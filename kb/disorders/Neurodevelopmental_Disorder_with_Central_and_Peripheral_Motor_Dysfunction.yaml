genetic:
- name: NFASC
  gene_term:
    preferred_term: NFASC
    term:
      id: hgnc:29866
      label: NFASC
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    NFASC (1q32.1) encodes neurofascin. Alternative splicing gives the glial
    isoform NF155 (paranodal, with a third fibronectin type III repeat) and the
    neuronal isoforms NF186 and NF140 (nodal and axon initial segment).
    Reported homozygous variants include p.Arg831Ter (NF155-specific), the
    frameshifts p.Pro939Ter and p.Pro924ArgfsTer35, the splice variant
    c.3020-1G>A (skips exon 26, removing full-length NF186), and missense
    variants p.Asn130Asp, p.Arg359Pro, p.Pro694Thr, p.Ser820Pro, p.Val1077Ala
    and p.Val1122Glu.
  evidence:
  - reference: PMID:31501903
    reference_title: "Biallelic mutations in neurofascin cause neurodevelopmental impairment and peripheral demyelination."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The genetic disease caused by biallelic NFASC variants includes
      neurodevelopmental impairment and a spectrum of central and peripheral
      demyelination as part of its core clinical phenotype.
    explanation: Establishes biallelic NFASC variants as the cause of the disorder.
  - reference: PMID:30124836
    reference_title: "Homozygous mutation in the Neurofascin gene affecting the glial isoform of Neurofascin causes severe neurodevelopment disorder with hypotonia, amimia and areflexia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We propose that the disease in our proband is the first reported example
      of genetic deficiency of glial Neurofascin isoforms in humans
    explanation: First report of a human NFASC disease.
diagnosis:
- name: Exome or Genome Sequencing
  description: >-
    Diagnosis rests on identifying bi-allelic NFASC variants by exome or
    genome sequencing in a child with hypotonia, developmental delay and
    neuropathy or ataxia. Skin biopsy immunostaining for paranodal NF155 and
    CASPR1 has been used to confirm the functional effect.
  evidence:
  - reference: PMID:31501903
    reference_title: "Biallelic mutations in neurofascin cause neurodevelopmental impairment and peripheral demyelination."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      who were found by exome or genome sequencing to carry one frameshift and
      four different homozygous non-synonymous variants in NFASC
    explanation: All cases in the series were diagnosed by exome or genome sequencing.
differential_diagnoses:
- name: CNTNAP1-related congenital hypomyelinating neuropathy
  description: >-
    Bi-allelic CNTNAP1 (CASPR1) variants remove NF155's axonal partner and
    cause a similar paranodopathy with brainstem and corpus callosum atrophy,
    but with epilepsy, which has not been reported in NFASC disease.
  evidence:
  - reference: PMID:31501903
    reference_title: "Biallelic mutations in neurofascin cause neurodevelopmental impairment and peripheral demyelination."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, these patients have a similar phenotype to patients with
      CNTNAP1/CASPR1 mutations; however, without any epilepsy, which has been
      reported in CASPR1-mutated patients.
    explanation: Names CNTNAP1 disease as the closest differential.
- name: Anti-neurofascin-155 autoimmune nodopathy
  description: >-
    IgG4 autoantibodies against NF155 cause an acquired nodopathy (formerly
    anti-NF155 CIDP) with distal weakness, sensory ataxia and tremor, which
    shares the paranodal lesion of the genetic disease.
  evidence:
  - reference: PMID:31501903
    reference_title: "Biallelic mutations in neurofascin cause neurodevelopmental impairment and peripheral demyelination."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings support possible overlapping molecular mechanisms of
      paranodal damage at peripheral nerves in both the immune-mediated and the
      genetic disease
    explanation: Links the immune-mediated and genetic NF155 disease.
treatments:
- name: Supportive Multidisciplinary Care
  therapeutic_modality: OTHER
  description: >-
    No disease-modifying therapy exists. Management is supportive:
    physiotherapy and orthotics for hypotonia, weakness and ataxia, feeding and
    respiratory support where needed, audiological assessment, and
    developmental and educational support.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
animal_models:
- name: Neurofascin-null mouse (Nfasc-/-)
  species: Mouse
  genotype: Nfasc-/-
  publication: PMID:16337912
  modeled_mechanisms:
  - target: Paranodal Axoglial Junction Disruption
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Complete loss of neurofascin prevents formation of paranodal and nodal complexes.
    limitations: >-
      Removes all isoforms at once and is lethal within the first postnatal
      week, so it is more severe than the isoform-selective human genotypes.
    evidence:
    - reference: PMID:16337912
      reference_title: "Neurofascins are required to establish axonal domains for saltatory conduction."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In Neurofascin-null mice, neither paranodal adhesion junctions nor nodal
        complexes are formed.
      explanation: The null mouse lacks both paranodal and nodal complexes.
- name: Myelinating glia-specific Nfasc NF155 null mouse
  species: Mouse
  genotype: Myelinating glia-specific conditional deletion of Nfasc NF155
  publication: PMID:19185024
  modeled_mechanisms:
  - target: Paranodal Axoglial Junction Disruption
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Glia-specific loss of NF155, the isoform affected in most patients,
      prevents paranodal junction formation, slows peripheral conduction and
      causes ataxia, paresis and degeneration of myelinated axons.
    limitations: >-
      The mice die before the third postnatal week, earlier than most
      patients, and the cerebral white matter and cognitive features of the
      human disease cannot be assessed.
    evidence:
    - reference: PMID:19185024
      reference_title: "Spatiotemporal ablation of myelinating glia-specific neurofascin (Nfasc NF155) in mice reveals gradual loss of paranodal axoglial junctions and concomitant disorganization of axonal domains."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These mice exhibit severe ataxia, motor paresis, and death before the
        third postnatal week.
      explanation: >-
        Loss of glial NF155 alone reproduces the severe motor phenotype.
- name: Purkinje cell-specific Nfasc NF186 knockout mouse
  species: Mouse
  genotype: Purkinje cell-specific conditional deletion of Nfasc NF186
  publication: PMID:42052621
  modeled_mechanisms:
  - target: Cerebellar Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Loss of NF186 from Purkinje cells disrupts the axon initial segment,
      mislocalises sodium and potassium channels, and leads to Purkinje cell
      degeneration with cerebellar dysfunction.
    limitations: >-
      Deletion is restricted to Purkinje cells, whereas the patient splice
      variant removes full-length NF186 from all neurons.
    evidence:
    - reference: PMID:42052621
      reference_title: "Purkinje cell-specific loss of Neurofascin and Ankyrin G causes disruption of axon initial segments, neurodegeneration, and cerebellar ataxia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        By 2 months of age, degeneration of Purkinje cells was evident,
        accompanied by cerebellar dysfunction.
      explanation: >-
        Cerebellar dysfunction follows Purkinje-specific NF186 loss.

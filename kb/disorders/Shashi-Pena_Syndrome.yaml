name: Shashi-Pena Syndrome
creation_date: "2026-08-29T21:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Shashi-Pena syndrome
  term:
    id: MONDO:0014963
    label: Shashi-Pena syndrome
description: >-
  Shashi-Pena syndrome (SHAPNS) is an autosomal dominant developmental disorder
  caused by de novo heterozygous truncating variants in ASXL2, one of the three
  mammalian Additional sex combs-like genes. It was defined in 2016 in six
  unrelated probands and completes a set: ASXL1 causes Bohring-Opitz syndrome,
  ASXL3 causes Bainbridge-Ropers syndrome, and ASXL2 causes this.

  The three are paralogous PR-DUB scaffolds and share a core of developmental
  delay, hypotonia, feeding difficulty and dysmorphism, so the useful clinical
  content is what separates them. SHAPNS is the one with **macrocephaly and no
  growth retardation** - Bohring-Opitz and Bainbridge-Ropers both restrict
  growth - and with more variability in intellectual outcome, from low-average
  ability to severe disability. The face is recognisable: glabellar nevus
  flammeus, prominent or proptotic eyes with ptosis, arched eyebrows, broad
  nasal tip.

  Two systems outside the nervous system deserve attention because they are
  actionable and easy to miss. Hypoglycemia, typically in infancy and sometimes
  hyperinsulinaemic, is common enough that prolonged fasting is a documented
  thing to avoid. And ASXL2-null mice are glucose-intolerant, insulin-resistant
  and lipodystrophic through PPAR-gamma, a prediction that has since been met by
  a reported case of type 2 diabetes with dyslipidemia and hepatic steatosis in
  an 8-year-old - the rare instance in this entry where a mouse phenotype
  preceded and anticipated the human one.

  The mechanism is not settled, and the entry says so rather than picking a
  side. The defining study argued a dominant-negative effect, because the
  truncated transcripts escape nonsense-mediated decay and both alleles are
  expressed. A later family reached the same diagnosis through a balanced
  chromosomal rearrangement that *reduced* ASXL2 expression, which is a
  haploinsufficiency mechanism. Both cannot be the general explanation.
parents:
- hereditary disease
synonyms:
- SHAPNS
- ASXL2-related neurodevelopmental disorder

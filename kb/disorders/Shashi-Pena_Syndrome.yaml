genetic:
- name: ASXL2
  gene_term:
    preferred_term: ASXL2
    term:
      id: hgnc:23805
      label: ASXL2
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  presence: PRESENT
  notes: >-
    ASXL2 ("ASXL transcriptional regulator 2") is the second of three mammalian
    Additional sex combs-like genes. Its germline disease is Shashi-Pena
    syndrome; somatically it is recurrently mutated in acute myeloid leukaemia
    with t(8;21), and mouse deletion produces a myelodysplastic-syndrome-like
    disease.

    Whether that somatic story implies a cancer risk in Shashi-Pena syndrome is
    not known and should not be asserted from the gene alone. No malignancy
    surveillance is recommended in the GeneReviews management section, and no
    case of myeloid malignancy in a person with SHAPNS is cited in the material
    reviewed here. The germline and somatic variant classes are also not the
    same problem: the germline disease is caused by truncating variants
    predicted to act dominant-negatively, while the mouse cancer model is a
    deletion.

    Diagnostically, the point worth taking from the transmitted-translocation
    family is that a negative exome does not exclude ASXL2. A balanced
    rearrangement disrupting the gene was invisible to both chromosomal
    microarray and whole-exome sequencing and needed long-read sequencing plus
    RNA-seq to find.
  evidence:
  - reference: PMID:28593990
    reference_title: "Loss of Asxl2 leads to myeloid malignancies in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      ASXL2 is frequently mutated in acute myeloid leukaemia patients with
      t(8;21).
    explanation: >-
      The somatic context of the gene, recorded so the germline/somatic
      distinction in the notes is anchored.
  - reference: PMID:34841066
    reference_title: "Diagnosis of Shashi-Pena Syndrome Caused by Chromosomal Rearrangement Using Nanopore Sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The aim of this study was to uncover the genetic cause of delayed
      psychomotor development and variable intellectual disability in a proband
      whose previous genetic analyses, including chromosome microarray and whole
      exome sequencing, had been negative.
    explanation: >-
      The diagnostic point: microarray and exome were both negative in a patient
      who does have an ASXL2 disruption.
prevalence:
- population: Reported patients worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Defined in 2016 from six unrelated probands, with individual case reports
    and small series since. No population prevalence estimate has been published
    and none is inferable from the reported caseload, since ascertainment has
    been through exome sequencing of undiagnosed developmental disorders
    throughout.
  evidence:
  - reference: PMID:27693232
    reference_title: "De Novo Truncating Variants in ASXL2 Are Associated with a Unique and Recognizable Clinical Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study, we performed whole-exome sequencing in six unrelated
      probands with developmental delay, macrocephaly, and dysmorphic features.
    explanation: >-
      The founding cohort, and the ascertainment route that limits what can be
      said about frequency.
diagnosis:
- name: ASXL2 sequencing, and what to do when it is negative
  description: >-
    The diagnosis is established by a suggestive phenotype plus a heterozygous
    pathogenic ASXL2 variant. The gestalt is recognisable enough that the
    original series was assembled by clinical review after the sequencing, not
    before.

    The practically useful addition is the negative-exome case. A balanced
    t(2;11) translocation disrupting ASXL2 was missed by chromosomal microarray
    and by whole-exome sequencing and was found by long-read (nanopore)
    sequencing together with RNA-seq showing reduced ASXL2 expression. In a
    patient whose phenotype fits, a negative exome is not the end of the
    workup.
  evidence:
  - reference: PMID:39527683
    reference_title: "Shashi-Pena Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of Shashi-Pena syndrome is established in a proband with
      suggestive clinical findings and a heterozygous pathogenic variant in ASXL2
      identified by molecular genetic testing.
    explanation: >-
      The diagnostic criterion.
  - reference: PMID:34841066
    reference_title: "Diagnosis of Shashi-Pena Syndrome Caused by Chromosomal Rearrangement Using Nanopore Sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a complex chromosomal rearrangement affecting ASXL2 as a
      pathogenic mechanism of Shashi-Pena syndrome in a Chinese family.
    explanation: >-
      The structural-variant route to the same diagnosis, which is why long-read
      sequencing belongs in the workup after a negative exome.
treatments:
- name: Surveillance and Anticipatory Management
  description: >-
    No disease-modifying therapy exists. GeneReviews specifies a surveillance
    programme rather than a treatment: growth parameters and nutritional status
    at each visit, developmental and educational progress, attention and
    aggression, signs of ADHD, autism and anxiety, new seizures or tone change,
    temperature dysregulation, sleep apnea, feeding, scoliosis or kyphosis, and
    hypoglycemia. Spine radiographs, DXA in those with fractures, dental and
    ophthalmology review, blood glucose monitoring and audiology follow as
    clinically indicated.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:39527683
    reference_title: "Shashi-Pena Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surveillance: At each visit, measure growth parameters; evaluate nutritional
      status and safety of oral intake; monitor for the following: developmental
      progress and educational needs; difficulties with attention, anger
      outbursts, and aggression; signs of ADHD, autism, and anxiety; new
      manifestations, such as seizures and changes in tone; signs/symptoms of
      temperature dysregulation; signs/symptoms of sleep apnea; signs of feeding
      difficulties; development of scoliosis/kyphosis; and signs/symptoms of
      hypoglycemia.
    explanation: >-
      The surveillance schedule verbatim, which is the substance of management in
      this disorder.
- name: Management of Hypoglycemia and Hyperinsulinism
  description: >-
    Standard dextrose treatment and avoidance of fasting for infantile
    hypoglycemia; octreotide has been used where hyperinsulinism is
    demonstrated. Given the single reported case of prepubertal type 2 diabetes
    and the mouse metabolic phenotype, GeneReviews also asks for surveillance
    for euglycemia, hyperlipidemia and hypertension, and nutrition referral in
    those who become obese - so the metabolic monitoring here runs in both
    directions.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: octreotide
      term:
        id: CHEBI:7726
        label: octreotide
  evidence:
  - reference: PMID:39527683
    reference_title: "Shashi-Pena Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For infants with hypoglycemia, standard treatment with dextrose and
      avoidance of fasting is reasonable; octreotide has been used in those with
      hyperinsulinism.
    explanation: >-
      The hypoglycemia management, including the specific agent used for
      hyperinsulinism.
  - reference: PMID:39527683
    reference_title: "Shashi-Pena Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Review of healthy eating habits; surveillance for euglycemia,
      hyperlipidemia, hypertension, and consideration of referral to nutrition for
      those who develop obesity.
    explanation: >-
      The metabolic surveillance in the other direction, which is where the
      diabetes case and the mouse phenotype land clinically.
- name: Feeding Support
  description: >-
    Feeding therapy, with nasogastric or gastrostomy tube placement considered
    for persistent difficulty.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:39527683
    reference_title: "Shashi-Pena Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment of manifestations: Feeding therapy for those with feeding
      difficulties; consideration of nasogastric or gastrostomy tube placement for
      those with persistent feeding issues.
    explanation: >-
      The feeding intervention as specified in the management section.
animal_models:
- name: Asxl2 knockout mouse
  species: Mouse
  genotype: Asxl2 -/- and Asxl2 +/-
  publication: PMID:28593990
  description: >-
    The available Asxl2 mouse. It was made and characterised to study myeloid
    malignancy, and that is what it shows: increased long-term haematopoietic
    stem cells and granulocyte-macrophage progenitors, enhanced HSC self-renewal,
    dysregulated H3K27ac and H3K4me1/2, and a myelodysplastic-syndrome-like
    disease in transplant recipients. Separately, ASXL2-null mice are reported
    as glucose-intolerant, insulin-resistant and lipodystrophic.
  modeled_mechanisms:
  - target: Disturbed PR-DUB Chromatin Regulation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      It demonstrates that losing Asxl2 does dysregulate histone marks and gene
      expression in vivo, which supports the chromatin node in kind. It does not
      model this disease: the phenotype it produces is haematological, the
      genotype is a deletion rather than a truncating allele, and the
      developmental features that define Shashi-Pena syndrome are not what the
      model was assessed for.
    limitations: >-
      Two mismatches, and the second is the important one. First, the readout is
      myeloid rather than neurodevelopmental. Second, a deletion models
      haploinsufficiency or null, whereas the human disease is caused by
      truncating variants whose transcripts escape nonsense-mediated decay and
      which are argued to act dominant-negatively - so the mouse may be testing
      a different molecular lesion, not merely a different tissue.
    evidence:
    - reference: PMID:28593990
      reference_title: "Loss of Asxl2 leads to myeloid malignancies in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The altered gene expression is associated with dysregulated H3K27ac and
        H3K4me1/2.
      explanation: >-
        In vivo evidence that Asxl2 loss dysregulates chromatin marks, which is
        the part of this model that speaks to the node.
    - reference: PMID:28593990
      reference_title: "Loss of Asxl2 leads to myeloid malignancies in mice."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here we show that deletion of Asxl2 in mice leads to the development of
        myelodysplastic syndrome (MDS)-like disease.
      explanation: >-
        The phenotype the model actually produces, cited to bound what it can be
        used for. Graded INDIRECT because a myeloid phenotype does not bear
        directly on a neurodevelopmental disease.
  - target: PPAR-gamma-Linked Metabolic Dysregulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The null mouse's glucose intolerance, insulin resistance and lipodystrophy
      is the observation that generated the metabolic prediction for this
      syndrome, and a human case has since matched it.
    limitations: >-
      The mouse phenotype and the human case are one-to-one: a single reported
      patient with type 2 diabetes. Fidelity is called MODERATE on the strength
      of the prediction having been met once, not on any systematic comparison.
      The metabolic characterisation is also cited here second-hand, from the
      case report rather than from the primary mouse metabolic study.
    evidence:
    - reference: PMID:35716351
      reference_title: "Prepubertal onset of type 2 diabetes in Shashi-Pena syndrome due to ASXL2 mutation."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        ASXL2 null mice exhibit glucose intolerance, insulin resistance and
        lipodystrophy.
      explanation: >-
        The mouse metabolic phenotype. Graded INDIRECT because it is reported
        second-hand in the case report's introduction rather than in the primary
        mouse study.
differential_diagnoses:
- name: Bohring-Opitz syndrome (ASXL1)
  description: >-
    The paralogous disorder with the most severe phenotype. Separated from
    Shashi-Pena syndrome by growth: Bohring-Opitz restricts growth, Shashi-Pena
    does not and is characterised by macrocephaly and macrosomia. Intellectual
    disability in Bohring-Opitz is uniformly severe, where in Shashi-Pena it
    ranges to low-average.
  evidence:
  - reference: PMID:27693232
    reference_title: "De Novo Truncating Variants in ASXL2 Are Associated with a Unique and Recognizable Clinical Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Germline de novo truncating variants in ASXL1 and ASXL3 have been
      respectively implicated in causing Bohring-Opitz and Bainbridge-Ropers
      syndromes, which result in overlapping features of severe intellectual
      disability and dysmorphic features.
    explanation: >-
      Establishes the two paralogous disorders and their shared severity, which
      is the baseline the distinguishing features are measured against.
- name: Bainbridge-Ropers syndrome (ASXL3)
  description: >-
    The third member of the set, already curated in this knowledge base at
    kb/disorders/Bainbridge-Ropers_Syndrome.yaml, which names Shashi-Pena
    syndrome as its own differential. Same separation as for Bohring-Opitz:
    growth restriction and uniformly severe intellectual disability against
    macrocephaly and variable outcome here.
  evidence:
  - reference: PMID:27693232
    reference_title: "De Novo Truncating Variants in ASXL2 Are Associated with a Unique and Recognizable Clinical Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      features that distinguish the ASXL2-associated condition from ASXL1- and
      ASXL3-related disorders are macrocephaly, absence of growth retardation,
      and more variability in the degree of intellectual disabilities
    explanation: >-
      The three discriminating features, stated against both paralogous
      disorders at once.
- name: Overgrowth syndromes with macrocephaly
  description: >-
    A differential the disease has been argued into rather than out of. A
    patient with marked postnatal overgrowth, normal bone age and only minor
    neurodevelopmental features has been reported, on the basis of which ASXL2
    analysis has been proposed for suspected overgrowth-with-macrocephaly cases
    even without developmental delay or epilepsy.
  evidence:
  - reference: PMID:40475172
    reference_title: "Clinical Variability of Shashi-Pena Syndrome: A Novel ASXL2 Variant Associated with Overgrowth and Minor Neurodevelopmental Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SHAPNS could be inferred even in the absence of developmental delay or
      epilepsy.
    explanation: >-
      Widens the differential at the mild end, which is where this disorder is
      most likely to be missed.
discussions:
- discussion_id: shapns_dominant_negative_vs_haploinsufficiency
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do ASXL2 truncating variants cause Shashi-Pena syndrome by a
    dominant-negative effect or by haploinsufficiency?
  attaches_to:
  - "pathophysiology#De Novo Truncating ASXL2 Variant"
  - "pathophysiology#Disturbed PR-DUB Chromatin Regulation"
  - "genetic#ASXL2"
  rationale: >-
    Two published observations point in opposite directions and neither has been
    reconciled.

    The dominant-negative argument comes from the defining study: the truncated
    ASXL2 transcripts escape nonsense-mediated decay and both alleles are
    expressed in blood, so a stable truncated protein is present and could
    interfere. The paper's own wording is "likely to exert", not
    "demonstrated". This entry's genetic_context carries
    functional_impact_category DOMINANT_NEGATIVE on that basis, which is a
    choice made with the contrary evidence in view rather than in ignorance of
    it.

    The haploinsufficiency argument comes from the family with a balanced
    t(2;11) translocation, in whom RNA-seq showed *decreased* average ASXL2
    mRNA. Those patients have the same syndrome. If reduced dosage alone
    produces the phenotype, a stable interfering protein is not needed to
    explain it.

    Both can be partly true - a truncated protein could be dominant-negative
    while dosage reduction is independently sufficient - but that is a
    hypothesis, not a finding. The same question is explicitly open for ASXL1,
    where a review notes it is not clarified whether the common mutations give
    loss of protein or a stable truncated protein with dominant-negative or
    gain-of-function properties. Resolving it for ASXL2 would also decide
    whether an ASXL2 whole-gene deletion should be reported as causing this
    syndrome.
  proposed_experiments:
  - experiment_id: exp_shapns_allelic_series
    name: Allelic series comparing truncating variant, whole-gene deletion and rearrangement
    description: >-
      Compare patient-derived cells carrying a canonical truncating ASXL2 variant,
      a whole-gene deletion, and the translocation allele, measuring ASXL2 protein
      by an antibody that detects the truncated form, PR-DUB complex composition
      by immunoprecipitation, and H2AK119ub levels. Concordant phenotypes with
      discordant protein states would settle the mechanism; a deletion carrier
      with a milder phenotype would favour dominant-negative.
- discussion_id: shapns_no_neurodevelopmental_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Is there any model system in which the neurodevelopmental phenotype of
    Shashi-Pena syndrome can be studied?
  attaches_to:
  - "animal_models#Asxl2 knockout mouse"
  - "pathophysiology#Dysregulated Developmental Patterning"
  rationale: >-
    The Asxl2 mouse exists and is well characterised - for myeloid malignancy.
    Its published readouts are haematopoietic stem cell self-renewal, histone
    marks in Lin-cKit+ cells, and survival after transplant. Macrocephaly,
    craniofacial patterning, cognition and the dental phenotype are not among
    them.

    The genotype mismatch compounds the tissue mismatch. The mouse is a deletion;
    the human disease is caused by truncating alleles whose transcripts escape
    nonsense-mediated decay. If the dominant-negative account is right, the mouse
    is not modelling the human lesion at all, and the negative would be
    uninformative rather than reassuring.

    The one place the mouse has predicted a human finding is metabolic - glucose
    intolerance and lipodystrophy, met by a single case of prepubertal type 2
    diabetes. That is a real success and it is recorded as such on the model
    link. It does not extend to the neurodevelopmental phenotype, which is the
    disease's main burden and has no model at all.
  proposed_experiments:
  - experiment_id: exp_shapns_knockin_truncating_allele
    name: Knock-in mouse carrying a human ASXL2 truncating allele
    description: >-
      Generate a heterozygous knock-in of a recurrent human truncating ASXL2
      allele, confirm the truncated transcript escapes nonsense-mediated decay as
      it does in patients, and phenotype for head circumference, craniofacial
      morphometry, dental eruption timing, and behaviour, against both wild type
      and the existing Asxl2 deletion heterozygote. Comparing knock-in with
      deletion in one experiment would also address the dominant-negative
      question above.
notes: >-
  Curation inputs. One Perplexity deep-research run, committed alongside, plus
  independent PubMed searching. The report was used for orientation only. It
  contains no PMID or DOI in its body, and its term validation flagged, among
  others, UBERON:0004288 offered as "vertebral column" when UBERON calls it
  skeleton, and UBERON:0008896 offered as "skeleton" when UBERON calls it
  post-hyoid pharyngeal arch - two labels swapped between two real terms, which
  is the failure mode hardest to catch by eye. Every CURIE here was verified
  independently against OLS.

  Phenotypes represented in prose rather than as structured entries. The
  GeneReviews clinical-characteristics sentence enumerates a long list of
  variable findings, and quoting it once per phenotype would multiply
  near-identical snippets. Congenital heart defect, strabismus, feeding
  difficulty and conductive hearing loss are curated from it; the skin findings
  (capillary malformations, deep palmar creases, hypertrichosis), hypermobility,
  frequent fractures, temperature dysregulation, sleep apnea and global volume
  loss on brain MRI are not, and are represented only here. That is a curation
  choice about snippet economy, not a judgement that they are absent.

  Immune involvement. The hypogammaglobulinaemia phenotype is a single 2025 case
  and postdates the GeneReviews chapter, so it is not part of the established
  phenotype. It is recorded at VERY_RARE with its novelty stated, because a
  curator adding immune features later should be able to see where the claim
  came from.

      label: PR-DUB complex
  evidence:
  - reference: PMID:27693232
    reference_title: "De Novo Truncating Variants in ASXL2 Are Associated with a Unique and Recognizable Clinical Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ASXL genes (ASXL1, ASXL2, and ASXL3) participate in body patterning
      during embryogenesis and encode proteins involved in epigenetic regulation
      and assembly of transcription factors to specific genomic loci.
    explanation: >-
      The functional assignment of the gene family.
  - reference: PMID:27527698
    reference_title: "The Role of Additional Sex Combs-Like Proteins in Cancer."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Although Asx is characterized as a catalytic partner for the deubiquitinase
      Calypso (or BAP1), there are domains of ASXL proteins that are distinct from
      Asx and the roles and redundancies of ASXL members are not yet well
      understood.
    explanation: >-
      The PR-DUB partnership, together with the explicit limits on how far the
      Drosophila account transfers - which is why this node is PROVISIONAL.
  - reference: PMID:27527698
    reference_title: "The Role of Additional Sex Combs-Like Proteins in Cancer."
    supports: NO_EVIDENCE
    evidence_source: OTHER
    snippet: >-
      Moreover, it is not yet fully clarified if commonly encountered ASXL1
      mutations result in a loss of protein or stable expression of a truncated
      protein with dominant-negative or gain-of-function properties.
    explanation: >-
      Graded NO_EVIDENCE deliberately. The sentence is about ASXL1, not ASXL2, so
      it does not bear on this node's claim either way; it is cited to record
      that the mechanism question is open across the whole family rather than
      only here.
  downstream:
  - target: Dysregulated Developmental Patterning
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: PPAR-gamma-Linked Metabolic Dysregulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Dysregulated Developmental Patterning
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: >-
    The route from a chromatin scaffold to macrocephaly, a specific facial
    gestalt, dental anomalies and variable intellectual disability is not
    traced. What can be said is that the phenotype is reproducible enough to be
    recognised clinically, and that it differs from its two paralogous
    neighbours in a consistent direction - overgrowth rather than growth
    restriction.

    That direction is itself informative and is the reason this node is worth
    stating separately from the chromatin node: ASXL1 and ASXL3 truncations
    restrict growth, ASXL2 truncations do not, and one patient has been reported
    with marked postnatal overgrowth and only minor neurodevelopmental features,
    which has led to the suggestion that SHAPNS belongs among the overgrowth
    disorders with macrocephaly.
  evidence:
  - reference: PMID:27693232
    reference_title: "De Novo Truncating Variants in ASXL2 Are Associated with a Unique and Recognizable Clinical Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although overlapping features with Bohring-Opitz and Bainbridge-Ropers
      syndromes exist, features that distinguish the ASXL2-associated condition
      from ASXL1- and ASXL3-related disorders are macrocephaly, absence of growth
      retardation, and more variability in the degree of intellectual
      disabilities.
    explanation: >-
      The three features that separate this disorder from its paralogous
      neighbours, and the basis for treating the growth direction as a real
      signal.
  - reference: PMID:40475172
    reference_title: "Clinical Variability of Shashi-Pena Syndrome: A Novel ASXL2 Variant Associated with Overgrowth and Minor Neurodevelopmental Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study supports the inclusion of SHAPNS in overgrowth disorders with
      macrocephaly, suggesting the analysis of the ASXL2 gene even in suspected
      subjects with normal bone age and confirms dental anomalies as a clinical
      feature of this syndrome.
    explanation: >-
      Argues the overgrowth framing explicitly, from a patient at the mild end of
      the neurodevelopmental spectrum.
  downstream:
  - target: Macrocephaly
    causal_link_type: DIRECT
  - target: Global Developmental Delay
    causal_link_type: DIRECT
- name: PPAR-gamma-Linked Metabolic Dysregulation
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: >-
    ASXL2 interacts with PPAR-gamma, and ASXL2-null mice are glucose-intolerant,
    insulin-resistant and lipodystrophic. That is a mouse-derived prediction
    about a human phenotype, and it is one of the few places in this entry where
    the prediction has been tested: an 8-year-old prepubertal boy with SHAPNS
    developed type 2 diabetes with dyslipidemia and fatty infiltration of the
    liver, in the absence of a family history.

    It is graded PROVISIONAL because that is one patient. The source itself asks
    for further cases before treating the association as established, and the
    infantile hypoglycemia that is well documented in this syndrome is a
    different metabolic problem in the opposite direction, not obviously part of
    the same account.
  evidence:
  - reference: PMID:35716351
    reference_title: "Prepubertal onset of type 2 diabetes in Shashi-Pena syndrome due to ASXL2 mutation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      ASXL2 null mice exhibit glucose intolerance, insulin resistance and
      lipodystrophy. The regulatory role of ASXL2 in glucose and lipid
      homeostasis occurs through its interaction with peroxisome
      proliferator-activated receptor gamma (PPARγ), a gene implicated in the
      pathogenesis of type 2 diabetes on genome-wide association studies.
    explanation: >-
      The mouse phenotype and the proposed molecular link, which is what made the
      human prediction.
  - reference: PMID:35716351
    reference_title: "Prepubertal onset of type 2 diabetes in Shashi-Pena syndrome due to ASXL2 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report the first case of type 2 diabetes in Shashi-Pena syndrome,
      occurring in an 8-year-old prepubertal boy with no family history.
    explanation: >-
      The single human case that meets the mouse prediction.
  - reference: PMID:35716351
    reference_title: "Prepubertal onset of type 2 diabetes in Shashi-Pena syndrome due to ASXL2 mutation."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further reported cases will assist in confirming this association.
    explanation: >-
      The authors' own statement that one case does not establish the
      association, which is why this node is PROVISIONAL. Graded INDIRECT: it is
      a statement about the strength of the evidence rather than a result.
  downstream:
  - target: Type 2 Diabetes Mellitus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

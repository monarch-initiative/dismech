inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant, and in practice almost always de novo, so the recurrence
    risk to siblings is presumed low. All six probands in the defining series
    carried de novo truncating variants.

    One reported family departs from that pattern in a way worth knowing: a
    balanced t(2;11) translocation affecting ASXL2 was present in the proband,
    her father and her grandmother. That is transmitted rather than de novo, and
    it is also the case that argues for a different molecular mechanism (see the
    discussion below).
  evidence:
  - reference: PMID:39527683
    reference_title: "Shashi-Pena Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Shashi-Pena syndrome is an autosomal dominant disorder typically caused by a
      de novo pathogenic variant. Therefore, the risk to other family members is
      presumed to be low.
    explanation: >-
      The inheritance mode and its counselling consequence, from GeneReviews.
  - reference: PMID:34841066
    reference_title: "Diagnosis of Shashi-Pena Syndrome Caused by Chromosomal Rearrangement Using Nanopore Sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Karyotyping showed that a chromosomal balanced translocation t(2; 11) (p23;
      q23) was detected in the proband, her father, and her grandmother.
    explanation: >-
      A transmitted rearrangement rather than a de novo point variant, which is
      the exception to the de novo rule.
pathophysiology:
- name: De Novo Truncating ASXL2 Variant
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    Heterozygous truncating variants - nonsense and frameshift - in ASXL2. The
    defining series found six such variants in six unrelated probands, all de
    novo. Reported alleles since include p.Ser627Phefs*22 and further nonsense
    changes, and one family reached the same diagnosis through a balanced
    chromosomal rearrangement disrupting the gene rather than through a point
    variant.

    The variant class matters. All three ASXL germline diseases are caused by
    truncating variants, not missense, which is the observation the
    dominant-negative and gain-of-function arguments in this gene family are
    built on.
  genes:
  - preferred_term: ASXL2
    term:
      id: hgnc:23805
      label: ASXL2
  genetic_context:
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
  evidence:
  - reference: PMID:27693232
    reference_title: "De Novo Truncating Variants in ASXL2 Are Associated with a Unique and Recognizable Clinical Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this study, we performed whole-exome sequencing in six unrelated
      probands with developmental delay, macrocephaly, and dysmorphic features.
      All six had de novo truncating variants in ASXL2.
    explanation: >-
      The defining observation: de novo truncating variants in every proband.
  - reference: PMID:27693232
    reference_title: "De Novo Truncating Variants in ASXL2 Are Associated with a Unique and Recognizable Clinical Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We were also able to demonstrate with mRNA studies that these variants are
      likely to exert a dominant-negative effect, given that both alleles are
      expressed in blood and the mutated ASXL2 transcripts escape
      nonsense-mediated decay.
    explanation: >-
      The mRNA evidence behind the dominant-negative assignment on this node. Note
      the source's own hedge - "likely to exert" - and the contrary evidence
      recorded in the discussion below.
  downstream:
  - target: Disturbed PR-DUB Chromatin Regulation
    causal_link_type: DIRECT
- name: Disturbed PR-DUB Chromatin Regulation
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    ASXL proteins are the mammalian homologs of Drosophila Additional sex combs,
    which balances trithorax and Polycomb function, and they act as the
    scaffolding partner of the deubiquitinase BAP1 in the PR-DUB complex. The
    ASXL genes participate in body patterning during embryogenesis and encode
    proteins involved in epigenetic regulation and in assembling transcription
    factors at specific genomic loci.

    This node is PROVISIONAL, and the reason is specific rather than routine. No
    chromatin abnormality has been measured in tissue from a person with
    Shashi-Pena syndrome. The chromatin account is inherited from what is known
    about ASXL1 and about the mouse, and a review of the family notes that the
    domains of ASXL proteins are partly distinct from Asx and that the roles and
    redundancies of the three members are not well understood - including
    whether truncating variants give loss of protein or a stable truncated
    protein with dominant-negative or gain-of-function properties.
  biological_processes:
  - preferred_term: chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: ABNORMAL
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: PR-DUB complex
    term:

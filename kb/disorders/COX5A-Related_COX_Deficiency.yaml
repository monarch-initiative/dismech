pathophysiology:
- name: Predicted COX5A-COX4 Interface Disruption
  description: >-
    The p.Arg107Cys substitution is predicted to remove contacts at the COX5A-COX4 interface. This allele-specific
    structural model is distinct from experimentally measured protein depletion.
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:28247525
    reference_title: >-
      Mutation in mitochondrial complex IV subunit COX5A causes pulmonary arterial hypertension, lactic acidemia,
      and failure to thrive.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      We show that the variant lies within the evolutionarily conserved COX5A/COX4 interface domain, suggesting
      that it alters the interaction between these two subunits during complex IV biogenesis.
    explanation: >-
      Homology modeling predicts altered subunit contacts for p.Arg107Cys; a direct binding assay was not performed.
    directness: INDIRECT
  mechanism_confidence: HYPOTHETICAL
  downstream:
  - target: Impaired Complex IV Assembly
    description: Loss of the predicted interface contacts may impair early assembly.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

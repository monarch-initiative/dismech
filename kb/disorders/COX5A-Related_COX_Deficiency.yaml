    A 10 mm pineal gland cyst was observed on MRI at age four in the later patient. Its causal relationship
    to COX5A deficiency is uncertain.
  phenotype_term:
    preferred_term: Pineal cyst
    term:
      id: HP:0012683
      label: Pineal cyst
  evidence:
  - reference: url:https://iris.uniroma1.it/bitstream/11573/1705503/2/Torraco_Novel_2022.pdf
    reference_title: https://iris.uniroma1.it/bitstream/11573/1705503/2/Torraco_Novel_2022.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 4 years showed pineal gland cyst with a maximum diameter of 10 mm,
    explanation: The MRI described a pineal cyst in one patient.
genetic:
- name: COX5A
  gene_term:
    preferred_term: COX5A
    term:
      id: hgnc:2267
      label: COX5A
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    description: >-
      Homozygous missense variants were reported in both families; both parents in the second family were heterozygous.
    evidence:
    - reference: url:https://iris.uniroma1.it/bitstream/11573/1705503/2/Torraco_Novel_2022.pdf
      reference_title: https://iris.uniroma1.it/bitstream/11573/1705503/2/Torraco_Novel_2022.pdf
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Both parents resulted heterozygous for the same variant (Figure 1C).
      explanation: Both parents of the homozygous p.Ile89Ser patient carried the variant.
    - reference: PMID:28247525
      reference_title: >-
        Mutation in mitochondrial complex IV subunit COX5A causes pulmonary arterial hypertension, lactic acidemia,
        and failure to thrive.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: We present patients with a homozygous pathogenic variant in the COX5A gene.
      explanation: The founding family supports recessive inheritance.
  features: >-
    Two reported homozygous missense alleles expand the clinical spectrum: c.319C>T (p.Arg107Cys) in the founding
    siblings and c.266T>G (p.Ile89Ser) in the later patient. The case numbers do not establish penetrance or
    a dependable genotype-severity rule.
  variants:
  - name: c.319C>T (p.Arg107Cys)
    description: >-
      NM_004255.3; homozygous in the two founding siblings. Interface disruption is predicted computationally;
      wild-type complementation supports causality.
    evidence:
    - reference: url:https://repository.ubn.ru.nl/bitstream/handle/2066/174071/174071.pdf
      reference_title: https://repository.ubn.ru.nl/bitstream/handle/2066/174071/174071.pdf
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: chr15(GRCh37):g.75219127G>A; NM_004255.3 (GenBank reference sequence):c.319C>T; p.(Arg107Cys).
      explanation: The founder study reports the transcript and protein change for the homozygous allele.
    - reference: PMID:28247525
      reference_title: >-
        Mutation in mitochondrial complex IV subunit COX5A causes pulmonary arterial hypertension, lactic acidemia,
        and failure to thrive.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        We show that the variant lies within the evolutionarily conserved COX5A/COX4 interface domain, suggesting
        that it alters the interaction between these two subunits during complex IV biogenesis.
      explanation: >-
        Homology modeling predicts altered subunit contacts for p.Arg107Cys; a direct binding assay was not
        performed.
      directness: INDIRECT
    - reference: PMID:28247525
      reference_title: >-
        Mutation in mitochondrial complex IV subunit COX5A causes pulmonary arterial hypertension, lactic acidemia,
        and failure to thrive.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Lentiviral complementation rescues complex IV deficiency.
      explanation: >-
        Wild-type complementation supports the causal role of COX5A; the full text documents increased complex
        IV abundance.
  - name: c.266T>G (p.Ile89Ser)
    description: >-
      NM_004255.4; homozygous in the later patient, with heterozygous parents and a selective cellular complex
      IV defect.
    evidence:
    - reference: url:https://iris.uniroma1.it/bitstream/11573/1705503/2/Torraco_Novel_2022.pdf
      reference_title: https://iris.uniroma1.it/bitstream/11573/1705503/2/Torraco_Novel_2022.pdf
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        NGS analysis revealed a homozygous c.266 T > G variant (Figure 1C) which is predicted to produce a
        p.(Ile89Ser) aminoacidic substitution in a highly conserved region (Figure S1A) of COX5A (NM_004255.4).
      explanation: The second family carried homozygous c.266T>G, p.Ile89Ser.
    - reference: url:https://iris.uniroma1.it/bitstream/11573/1705503/2/Torraco_Novel_2022.pdf
      reference_title: https://iris.uniroma1.it/bitstream/11573/1705503/2/Torraco_Novel_2022.pdf
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Both parents resulted heterozygous for the same variant (Figure 1C).
      explanation: Both parents of the homozygous p.Ile89Ser patient carried the variant.
    - reference: url:https://iris.uniroma1.it/bitstream/11573/1705503/2/Torraco_Novel_2022.pdf
      reference_title: https://iris.uniroma1.it/bitstream/11573/1705503/2/Torraco_Novel_2022.pdf
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: found a 50% reduction of COX5A protein in the patient
      explanation: The p.Ile89Ser patient retained COX5A protein at about half the control amount.
    - reference: url:https://iris.uniroma1.it/bitstream/11573/1705503/2/Torraco_Novel_2022.pdf
      reference_title: https://iris.uniroma1.it/bitstream/11573/1705503/2/Torraco_Novel_2022.pdf
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        confirmed the selective reduction of the holocomplex CIV (20% residual amount) as well as an almost
        undetectable CIV activity (Figure 2D, E).
      explanation: >-
        The p.Ile89Ser fibroblasts retained about 20% holocomplex IV, with nearly undetectable in-gel activity.
  evidence:
  - reference: url:https://repository.ubn.ru.nl/bitstream/handle/2066/174071/174071.pdf
    reference_title: https://repository.ubn.ru.nl/bitstream/handle/2066/174071/174071.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: chr15(GRCh37):g.75219127G>A; NM_004255.3 (GenBank reference sequence):c.319C>T; p.(Arg107Cys).
    explanation: The founder study reports the transcript and protein change for the homozygous allele.
  - reference: url:https://iris.uniroma1.it/bitstream/11573/1705503/2/Torraco_Novel_2022.pdf
    reference_title: https://iris.uniroma1.it/bitstream/11573/1705503/2/Torraco_Novel_2022.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NGS analysis revealed a homozygous c.266 T > G variant (Figure 1C) which is predicted to produce a p.(Ile89Ser)
      aminoacidic substitution in a highly conserved region (Figure S1A) of COX5A (NM_004255.4).
    explanation: The second family carried homozygous c.266T>G, p.Ile89Ser.
  - reference: PMID:28247525
    reference_title: >-
      Mutation in mitochondrial complex IV subunit COX5A causes pulmonary arterial hypertension, lactic acidemia,
      and failure to thrive.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Lentiviral complementation rescues complex IV deficiency.
    explanation: >-
      Wild-type complementation supports the causal role of COX5A; the full text documents increased complex
      IV abundance.
treatments:
- name: High-calorie enteral nutrition
  description: >-
    High-calorie nasogastric feeding was used for the elder founder sibling, but weight gain remained poor.
    This documents supportive use, not demonstrated disease modification.
  treatment_term:
    preferred_term: Enteral Tube Feeding
    term:
      id: NCIT:C93322
      label: Enteral Tube Feeding
  evidence:
  - reference: url:https://repository.ubn.ru.nl/bitstream/handle/2066/174071/174071.pdf
    reference_title: https://repository.ubn.ru.nl/bitstream/handle/2066/174071/174071.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      she was discharged on a high calorie diet applied via nasogas- tric tube feeding. However, weight gain
      remained poor.
    explanation: The founder report documents nutritional treatment and limited response.
  target_phenotypes:
  - preferred_term: Failure to thrive
    term:
      id: HP:0001508
      label: Failure to thrive
- name: Thiamine, carnitine and coenzyme Q10
  description: >-
    The younger founder sibling received this mitochondrial supplement combination without an apparent effect.
    Benefit for COX5A disease is not established.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Nutritional Supplementation
    term:
      id: NCIT:C15425
      label: Nutritional Supplementation
    therapeutic_agent:
    - preferred_term: thiamine(1+)
      term:
        id: CHEBI:18385
        label: thiamine(1+)
    - preferred_term: carnitine
      term:
        id: CHEBI:17126
        label: carnitine
    - preferred_term: coenzyme Q10
      term:
        id: CHEBI:46245
        label: coenzyme Q10
  evidence:
  - reference: url:https://repository.ubn.ru.nl/bitstream/handle/2066/174071/174071.pdf
    reference_title: https://repository.ubn.ru.nl/bitstream/handle/2066/174071/174071.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: She received thiamine, carnitine, and coenzyme Q10 without an apparent effect.
    explanation: The only described clinical supplement use had no apparent effect.
- name: Copper chloride (preclinical)
  description: >-
    Copper chloride increased complex IV abundance in cultured p.Arg107Cys patient fibroblasts. The COX1 assembly
    intermediate persisted; a translation-inhibition experiment was consistent with stabilization of residual
    complexes or subassemblies. These experiments do not establish a safe or effective clinical treatment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: copper(II) chloride
      term:
        id: CHEBI:49553
        label: copper(II) chloride
  evidence:
  - reference: PMID:28247525
    reference_title: >-
      Mutation in mitochondrial complex IV subunit COX5A causes pulmonary arterial hypertension, lactic acidemia,
      and failure to thrive.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A potential therapeutic lead is demonstrated by showing that copper supplementation leads to partial
      rescue of complex IV deficiency in patient fibroblasts.
    explanation: Copper rescue is preclinical.
  - reference: url:https://repository.ubn.ru.nl/bitstream/handle/2066/174071/174071.pdf
    reference_title: https://repository.ubn.ru.nl/bitstream/handle/2066/174071/174071.pdf
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      accumulation of COX1 did not resolve in CuCl2-treated ﬁbroblasts, suggesting another mechanism of complex
      IV rescue.
    explanation: Copper did not normalize the accumulated assembly intermediate.
  target_mechanisms:
  - target: Reduced Complex IV Abundance
    description: >-
      Copper increases residual enzyme abundance in patient cells; it has not been shown to repair the interface
      defect.
    evidence:
    - reference: url:https://repository.ubn.ru.nl/bitstream/handle/2066/174071/174071.pdf
      reference_title: https://repository.ubn.ru.nl/bitstream/handle/2066/174071/174071.pdf
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        decrease of complex IV and the CuCl 2-induced increase exclusively affected monomeric complex IV ,
        whereas the levels of the com- plex IV containing high molecular weight supercomplexes remained unaffected.
      explanation: >-
        The decrease and copper response involved monomeric complex IV; higher-order supercomplex abundance
        was preserved.

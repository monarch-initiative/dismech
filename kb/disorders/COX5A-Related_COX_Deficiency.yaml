notes: >-
  The clinical evidence is a very small family series and a later single-patient report. Severity and organ
  involvement vary; these observations do not establish reliable frequencies, penetrance estimates or separate
  molecular subtypes. Preserved neurodevelopment in the later patient coexisted with structural MRI abnormalities.
  ATP depletion and the tissue-specific route from complex IV dysfunction to pulmonary hypertension or ovarian
  insufficiency were not directly measured. The 2017 primary report records the younger sibling dying at 15
  months; the 2022 comparison table lists 16 months. The primary age is retained here. Patient-level data in
  the 2022 study are available on request with privacy restrictions; no public cohort accession is given.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Homozygous missense variants were reported in both families; both parents in the second family were heterozygous.
  evidence:
  - reference: url:https://iris.uniroma1.it/bitstream/11573/1705503/2/Torraco_Novel_2022.pdf
    reference_title: https://iris.uniroma1.it/bitstream/11573/1705503/2/Torraco_Novel_2022.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Both parents resulted heterozygous for the same variant (Figure 1C).
    explanation: Both parents of the homozygous p.Ile89Ser patient carried the variant.
  - reference: PMID:28247525
    reference_title: >-
      Mutation in mitochondrial complex IV subunit COX5A causes pulmonary arterial hypertension, lactic acidemia,

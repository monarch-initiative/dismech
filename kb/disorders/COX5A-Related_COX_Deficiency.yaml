description: >-
  COX5A-related cytochrome c oxidase deficiency (MC4DN20) is an autosomal recessive mitochondrial disorder
  caused by biallelic COX5A variants. COX5A is a nuclear-encoded structural subunit required for normal complex
  IV biogenesis. Patient fibroblasts show reduced COX5A and complex IV abundance, impaired assembly and reduced
  enzyme activity, with residual assembled enzyme. The founding p.Arg107Cys siblings had infantile pulmonary
  arterial hypertension, lactic acidemia, hypotonia and severe growth failure with early death. A later p.Ile89Ser
  patient had a milder course with childhood ketotic hypoglycemia, severe short stature and hypergonadotropic
  hypogonadism, without cardiovascular or neurodevelopmental involvement. Copper rescue is a cell-culture finding;
  clinical benefit has not been demonstrated in these reports.

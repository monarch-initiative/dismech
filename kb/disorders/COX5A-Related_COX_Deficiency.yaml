diagnosis:
- name: Molecular genetic testing
  description: >-
    Exome sequencing followed by confirmation and family segregation identified the reported homozygous COX5A
    variants. The varied phenotype means that pulmonary hypertension is not required for the diagnosis.
  evidence:
  - reference: url:https://repository.ubn.ru.nl/bitstream/handle/2066/174071/174071.pdf
    reference_title: https://repository.ubn.ru.nl/bitstream/handle/2066/174071/174071.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: chr15(GRCh37):g.75219127G>A; NM_004255.3 (GenBank reference sequence):c.319C>T; p.(Arg107Cys).
    explanation: The founder study reports the transcript and protein change for the homozygous allele.
  - reference: url:https://iris.uniroma1.it/bitstream/11573/1705503/2/Torraco_Novel_2022.pdf
    reference_title: https://iris.uniroma1.it/bitstream/11573/1705503/2/Torraco_Novel_2022.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NGS analysis revealed a homozygous c.266 T > G variant (Figure 1C) which is predicted to produce a p.(Ile89Ser)
      aminoacidic substitution in a highly conserved region (Figure S1A) of COX5A (NM_004255.4).
    explanation: The second family carried homozygous c.266T>G, p.Ile89Ser.
  - reference: url:https://iris.uniroma1.it/bitstream/11573/1705503/2/Torraco_Novel_2022.pdf
    reference_title: https://iris.uniroma1.it/bitstream/11573/1705503/2/Torraco_Novel_2022.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Both parents resulted heterozygous for the same variant (Figure 1C).
    explanation: Both parents of the homozygous p.Ile89Ser patient carried the variant.
- name: Respiratory-chain enzymology and assembly studies
  description: >-
    Patient fibroblasts demonstrated isolated complex IV deficiency. Enzyme assays, immunoblotting and native
    electrophoresis distinguish reduced activity and abundance from complete failure to assemble the enzyme.
  evidence:
  - reference: PMID:28247525
    reference_title: >-
      Mutation in mitochondrial complex IV subunit COX5A causes pulmonary arterial hypertension, lactic acidemia,
      and failure to thrive.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In patient skin fibroblasts, the enzymatic activity and protein levels of complex IV and several of its
      subunits are reduced.
    explanation: The biochemical deficit and subunit depletion were measured in cultured patient fibroblasts.
  - reference: url:https://iris.uniroma1.it/bitstream/11573/1705503/2/Torraco_Novel_2022.pdf
    reference_title: https://iris.uniroma1.it/bitstream/11573/1705503/2/Torraco_Novel_2022.pdf
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      confirmed the selective reduction of the holocomplex CIV (20% residual amount) as well as an almost undetectable
      CIV activity (Figure 2D, E).
    explanation: >-
      The p.Ile89Ser fibroblasts retained about 20% holocomplex IV, with nearly undetectable in-gel activity.
  - reference: url:https://repository.ubn.ru.nl/bitstream/handle/2066/174071/174071.pdf
    reference_title: https://repository.ubn.ru.nl/bitstream/handle/2066/174071/174071.pdf
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: even though complex IV levels are clearly reduced, the complex can still be fully assembled.
    explanation: The founder study explicitly found residual assembled complex IV.
- name: Cardiac, metabolic, growth and endocrine assessment
  description: >-
    The clinical reports support evaluating lactate and acid-base status, growth, fasting hypoglycemia, cardiac
    involvement and pubertal endocrine function according to presentation. No disease-specific surveillance
    interval is established by this small literature.
  evidence:
  - reference: PMID:28247525
    reference_title: >-
      Mutation in mitochondrial complex IV subunit COX5A causes pulmonary arterial hypertension, lactic acidemia,
      and failure to thrive.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical details of two affected siblings suffering from early-onset pulmonary arterial hypertension,
      lactic acidemia, failure to thrive, and isolated complex IV deficiency are presented.
    explanation: >-
      The founder siblings had these clinical manifestations; this is not a direct assay of glycolytic flux.
  - reference: url:https://iris.uniroma1.it/bitstream/11573/1705503/2/Torraco_Novel_2022.pdf
    reference_title: https://iris.uniroma1.it/bitstream/11573/1705503/2/Torraco_Novel_2022.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      fasting blood test revealed ketotic hypoglycemia unresponsive to glucagone and meta- bolic acidosis.
    explanation: The clinical narrative documents ketotic hypoglycemia.
  - reference: url:https://iris.uniroma1.it/bitstream/11573/1705503/2/Torraco_Novel_2022.pdf
    reference_title: https://iris.uniroma1.it/bitstream/11573/1705503/2/Torraco_Novel_2022.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A clear initial ovarian insufficiency was detected by FSH 112 mIU/ml (normal value 1.9 –7.8), LH 21.5
      mIU/ml (normal value >10.1), and 17 β estradiol <5 pg/ml which documented hypergonadotropic hypogonadism.
    explanation: The endocrine evaluation establishes this finding in one patient.

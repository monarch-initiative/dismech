    reference_title: "Compound heterozygous or homozygous truncating MYBPC3 mutations cause lethal cardiomyopathy with features of noncompaction and septal defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Features of left ventricular noncompaction were diagnosed in three
      patients. In the fourth, hypertrabeculation was not a clear feature, but
      could not be excluded.
    explanation: >-
      Direct echocardiographic/clinical documentation of noncompaction
      features in the founding biallelic MYBPC3 case series.
  downstream:

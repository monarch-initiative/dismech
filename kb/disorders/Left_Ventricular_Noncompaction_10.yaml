    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This report confirms the concept of the phenotypic continuum of
      sarcomeric cardiomyopathies and describes possible phenotypic patterns
      and their transformation over time.
    explanation: >-
      States the phenotypic-continuum interpretation directly, grounded in a
      family in which one identical MYBPC3 truncating allele produced LVNC in
      one carrier and HCM in his children.

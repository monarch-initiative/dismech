has_subtypes:
- name: Biallelic MYBPC3 LVNC
  display_name: Biallelic (homozygous/compound heterozygous) MYBPC3 LVNC
  description: >-
    Homozygous or compound heterozygous truncating MYBPC3 variants abolish
    cMyBP-C almost completely. This allelic configuration is the
    best-documented cause of LVNC10: a case series of four unrelated neonates,
    combined with a literature review totaling 21 reported patients with
    biallelic truncating MYBPC3 mutations, found that all were diagnosed with
    severe cardiomyopathy and/or died within the first few months of life,
    with noncompaction features in three of the four newly reported cases and
    septal defects or a patent ductus arteriosus in 62% of the pooled cohort.
    Obligate heterozygous parents are typically asymptomatic or only mildly
    affected, so the phenotype behaves recessively at this severity threshold
    even though the single-allele state is itself the classic dominant CMH4
    disease allele.
  evidence:
  - reference: PMID:25335496
    reference_title: "Compound heterozygous or homozygous truncating MYBPC3 mutations cause lethal cardiomyopathy with features of noncompaction and septal defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients with biallelic truncating pathogenic mutations in MYBPC3
      reported so far (n=21) were diagnosed with severe cardiomyopathy and/or
      died within the first few months of life.
    explanation: >-
      Establishes that biallelic truncating MYBPC3 mutations are uniformly
      severe across the full reported literature cohort, defining this
      subtype.
  - reference: PMID:25335496
    reference_title: "Compound heterozygous or homozygous truncating MYBPC3 mutations cause lethal cardiomyopathy with features of noncompaction and septal defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to heterozygous pathogenic mutations, homozygous or compound
      heterozygous truncating pathogenic MYBPC3 mutations cause severe
      neonatal cardiomyopathy with features of left ventricular noncompaction
      and septal defects in approximately 60% of patients.
    explanation: >-
      Directly states the mono- versus bi-allelic contrast and defines the
      biallelic subtype as severe neonatal cardiomyopathy with noncompaction
      features and septal defects.
  - reference: PMID:30924982
    reference_title: "Biallelic mutation in MYH7 and MYBPC3 leads to severe cardiomyopathy with left ventricular noncompaction phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, haploinsufficiency in MYBPC3 results in a severe
      early-onset ventricular noncompaction phenotype requiring heart
      transplantation when combined with a de novo missense variant on the
      second allele.
    explanation: >-
      Independent case series confirming the compound-heterozygous
      (loss-of-function plus missense) route to severe, transplant-requiring
      LVNC in MYBPC3.
- name: Monoallelic MYBPC3 LVNC
  display_name: Monoallelic (heterozygous) MYBPC3 LVNC
  description: >-
    A single heterozygous MYBPC3 variant - the same class of allele that
    underlies hypertrophic cardiomyopathy 4 (CMH4) - can also present with, or
    co-segregate with, a noncompaction phenotype rather than pure hypertrophy,
    particularly in families that also carry an unambiguous HCM phenotype in
    relatives. In a family-screening study of 143 noncompaction cardiomyopathy
    index cases, the specific subgroup with noncompaction co-occurring with
    left ventricular hypertrophy was significantly associated with MYBPC3
    variants and with hypertrophic cardiomyopathy (without noncompaction) in
    relatives, distinguishing it from the MYH7-associated
    noncompaction-with-dilation subgroup. Case reports also document a single
    truncating MYBPC3 allele producing hypertrophic, noncompaction, and
    restrictive phenotypes across different members of one family.
  evidence:
  - reference: PMID:30947911
    reference_title: "Cardiac Phenotypes, Genetics, and Risks in Familial Noncompaction Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NCCM with HCM (4%) was associated with MYBPC3 and HCM without NCCM in
      relatives (p < 0.001).
    explanation: >-
      Directly establishes the MYBPC3-associated NCCM+HCM cardiac-phenotype
      subgroup this subtype description refers to, and the co-occurrence of
      HCM without NCCM in relatives.
  - reference: PMID:36011256
    reference_title: "Different Phenotypes of Sarcomeric MyBPC3-Cardiomyopathy in the Same Family: Hypertrophic, Left Ventricular Noncompaction and Restrictive Phenotypes (in Association with Sarcoidosis)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present a case of familial sarcomeric cardiomyopathy caused by
      heterozygous truncating pathogenic variant p.Q1233* in cardiac
      myosin-binding protein C (MyBPC3) gene. The proband was first diagnosed
      with restrictive cardiomyopathy combined with left ventricular
      noncompaction (LVNC) and sarcoidosis at the age of 64. ... His 39-year-old
      son and 35-year-old daughter have identical non-obstructive asymmetric
      hypertrophic cardiomyopathy.
    explanation: >-
      Direct case demonstration that the identical heterozygous truncating
      MYBPC3 allele produces an LVNC-containing phenotype in one family member
      and a classic HCM phenotype in his adult children.
  - reference: PMID:37963751
    reference_title: "[Clinical phenotype and genetic analysis of patients with left ventricular noncompaction caused by the biallelic mutation of MYBPC3 and MYH7]."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proband carried a heterozygous variation of the MYBPC3 gene
      c.C2827T and the MYH7 gene c.G2221C. The proband's sister carried
      heterozygous variation of MYBPC3 gene c.C2827T.
    explanation: >-
      PARTIAL, not full, support: despite the article's own title using
      "biallelic" to mean two genes (MYBPC3 plus MYH7), the genotype
      described is digenic rather than biallelic within MYBPC3 itself - the
      proband carries a heterozygous MYBPC3 variant together with a separate
      heterozygous MYH7 variant, and her sister carries only the heterozygous
      MYBPC3 variant. It is curated here, not under the biallelic subtype, as
      further evidence that a single heterozygous MYBPC3 allele (optionally
      alongside a second cardiomyopathy-gene variant) associates with an LVNC
      phenotype in a family setting, consistent with the genetic-heterogeneity
      picture this subtype already documents.
pathophysiology:
- name: MYBPC3 Loss-of-Function Variant and cMyBP-C Depletion
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  description: >-
    MYBPC3 encodes cardiac myosin-binding protein C (cMyBP-C), a thick-filament
    accessory protein of the sarcomeric A band. As in CMH4, most MYBPC3
    disease alleles are truncating (frameshift, nonsense, or splice variants),
    the truncated peptide is not stably detected in patient myocardium, and
    the operative consequence is reduced functional cMyBP-C protein rather
    than a dominant-negative poison peptide (see
    kb/disorders/Hypertrophic_Cardiomyopathy_4.yaml for the detailed
    nonsense-mediated-decay/proteasomal-degradation mechanism, which is shared
    with this entry). What differs in LVNC10 is allelic dose: a single
    truncating allele produces the classic CMH4 haploinsufficiency state
    (roughly 50% residual protein), while two loss-of-function alleles, or a
    loss-of-function allele combined with a destabilizing missense allele on
    the second copy, can reduce residual cMyBP-C to as little as ~20% of
    normal.

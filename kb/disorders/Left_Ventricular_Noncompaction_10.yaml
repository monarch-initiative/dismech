treatments:
- name: Guideline-directed heart failure pharmacotherapy
  description: >-
    As in the broader LVNC umbrella entry, no disease-modifying therapy
    reverses the MYBPC3-driven compaction defect, so treatment focuses on
    standard heart-failure pharmacotherapy for the resulting ventricular
    dysfunction.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
  target_mechanisms:
  - target: Neonatal Structural Cardiac Failure
    description: >-
      Symptomatic pharmacotherapy is directed at the heart failure produced by
      the noncompacted, structurally defective myocardium.
  evidence:
  - reference: PMID:37215603
    reference_title: "Advances in symptomatic therapy for left ventricular non-compaction in children."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Currently, no effective treatment strategy exists to reduce its
      incidence or severity, and symptomatic treatment is the only clinical
      treatment strategy.
    explanation: >-
      Supports symptom-directed rather than disease-reversing pharmacotherapy
      as the current treatment paradigm, including for pediatric-onset LVNC
      such as the neonatal MYBPC3 form.
- name: Heart transplantation
  description: >-
    Heart transplantation is used as salvage therapy for the severe biallelic
    MYBPC3 LVNC phenotype when medical therapy cannot sustain cardiac
    function.
  treatment_term:
    preferred_term: heart transplantation
    term:
      id: NCIT:C15246
      label: Heart Transplantation
  target_phenotypes:
  - preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
  target_mechanisms:
  - target: Dose-Dependent Failure of Myocardial Compaction and Congenital Structural Defects
    description: >-
      Transplantation replaces the structurally noncompacted, functionally
      failing myocardium once medical management is exhausted.
  evidence:
  - reference: PMID:30924982
    reference_title: "Biallelic mutation in MYH7 and MYBPC3 leads to severe cardiomyopathy with left ventricular noncompaction phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      haploinsufficiency in MYBPC3 results in a severe early-onset
      ventricular noncompaction phenotype requiring heart transplantation
      when combined with a de novo missense variant on the second allele.
    explanation: >-
      Directly documents heart transplantation as the clinical outcome for a
      compound heterozygous MYBPC3 LVNC case.
- name: Genetic testing and reproductive counseling
  description: >-
    Because biallelic MYBPC3 truncating genotypes are associated with severe,
    often lethal neonatal disease while single-allele carriers (including
    obligate-carrier parents) are typically unaffected or mildly affected,
    identification of a truncating MYBPC3 variant in one parent should prompt
    partner and family cascade testing to assess recurrence risk in future
    pregnancies.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:30924982
    reference_title: "Biallelic mutation in MYH7 and MYBPC3 leads to severe cardiomyopathy with left ventricular noncompaction phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, in patients with early disease onset and atypical
      clinical course, biallelic inheritance or more complex variants
      including copy number variations and de novo mutations should be
      considered.
    explanation: >-
      Directly supports the clinical recommendation to consider biallelic
      MYBPC3 inheritance, and therefore parental carrier and reproductive
      counseling, in early-onset atypical cardiomyopathy.

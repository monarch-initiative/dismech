    causal_link_type: DIRECT
    description: >-
      The noncompacted myocardium produces early, severe heart failure in
      the newborn period.
- name: Dose-Dependent Congenital Septal and Ductal Structural Defects
  biological_scale: TISSUE
  role: effector
  description: >-
    The same severe biallelic MYBPC3 genotype that produces compaction
    failure is also strongly associated with co-occurring congenital
    structural anomalies of the cardiac septum and the ductus arteriosus,
    which accompanied cardiomyopathy in the majority of the pooled biallelic
    literature cohort. The founding case series and its pooled literature
    review report these anomalies jointly ("septal defects or a patent
    ductus arteriosus") without distinguishing atrial from ventricular
    septal involvement, so this node is deliberately not more specific than
    the cited evidence supports.

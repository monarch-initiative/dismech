name: Left Ventricular Noncompaction 10
creation_date: "2026-08-17T00:00:00Z"
synonyms:
- LVNC10
- left ventricular noncompaction type 10
- MYBPC3 left ventricular noncompaction
- left ventricular noncompaction caused by mutation in MYBPC3
- cardiomyopathy, dilated, 1MM
description: >-
  Left ventricular noncompaction 10 (LVNC10) is the MYBPC3-specific form of
  left ventricular noncompaction (LVNC): any LVNC in which the disease-causing
  lesion is a variant in MYBPC3, the gene encoding cardiac myosin-binding
  protein C (cMyBP-C). MYBPC3 is best known as the single most frequently
  mutated gene in hypertrophic cardiomyopathy (see Hypertrophic Cardiomyopathy
  4 / CMH4), where a single truncating allele produces adult-onset cMyBP-C
  haploinsufficiency and predominantly hypertrophic remodeling. The
  noncompaction phenotype captured by LVNC10 is most robustly documented at
  the opposite end of the allelic-dose spectrum: homozygous or compound
  heterozygous truncating MYBPC3 variants that abolish cMyBP-C almost entirely
  and produce a severe, usually lethal, neonatal cardiomyopathy with
  hypertrabeculated/noncompacted myocardium and congenital septal defects.
  Milder, monoallelic MYBPC3 variants have also been documented producing or
  co-segregating with a noncompaction phenotype, particularly in families that
  also carry an unambiguous hypertrophic cardiomyopathy phenotype in relatives.
  OMIM groups this entity with "cardiomyopathy, dilated, 1MM" (CMD1MM) under
  the same MIM number (615396), and MONDO likewise classifies LVNC10 as a
  subtype of both left ventricular noncompaction and familial isolated dilated
  cardiomyopathy, consistent with the broader LVNC-DCM-HCM phenotypic
  continuum already described for other MYBPC3 disease presentations. This
  entry models the MYBPC3-specific genetic and molecular mechanism; the shared
  downstream LVNC consequences (arrhythmia, ventricular dysfunction,
  thromboembolic risk) are modeled in the umbrella
  kb/disorders/Left_Ventricular_Noncompaction.yaml (MONDO:0018901) and are not
  re-derived here.

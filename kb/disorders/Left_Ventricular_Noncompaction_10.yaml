genetic:
- name: MYBPC3
  gene_term:
    preferred_term: MYBPC3
    term:
      id: hgnc:7551
      label: MYBPC3
  relationship_type: CAUSATIVE
  notes: >-
    MYBPC3 encodes cardiac myosin-binding protein C and is the defining gene
    of this MONDO entity. It is the single most frequently mutated gene in
    hypertrophic cardiomyopathy (see Hypertrophic Cardiomyopathy 4); the
    LVNC10 phenotype is most consistently associated with biallelic
    (homozygous or compound heterozygous) truncating variants that produce a
    much greater loss of functional protein than the monoallelic
    haploinsufficiency state that typically causes CMH4.

    Qualification: a large rare-variant case-control study (840 LVNC cases
    vs. 125,748 gnomAD population controls) did not find MYBPC3 among the
    genes showing LVNC-specific enrichment - only truncating variants in
    MYH7, ACTN2, and PRDM16 were uniquely associated with LVNC in that
    analysis. This is consistent with the LVNC phenotype seen in MYBPC3
    carriers more often reflecting the well-established MYBPC3-HCM
    relationship "showing through" as a noncompaction-type imaging finding,
    rather than MYBPC3 driving a population-validated, distinct LVNC etiology
    the way MYH7/ACTN2/PRDM16 do. It does not contradict the biallelic-dose
    evidence directly documenting near-complete cMyBP-C loss causing severe
    neonatal noncompaction (Wessels 2015; Kolokotronis 2019) - those are
    individually reported biallelic/compound-heterozygous pedigrees, a
    different allelic regime from a heterozygous-carrier case-control burden
    test - but it is a genuine caveat against treating monoallelic MYBPC3 as
    an LVNC-specific gene in the same sense as MYH7/ACTN2/PRDM16.

    ClinGen has never curated a MYBPC3-LVNC gene-disease relationship. What it
    has curated is the pair of relationships either side of this entity: an AD
    MYBPC3-hypertrophic-cardiomyopathy relationship classified Definitive,
    and - separately, and directly covering the biallelic regime this entry
    models - an AR MYBPC3-dilated-cardiomyopathy relationship classified only
    Limited. Because OMIM files LVNC10 with "cardiomyopathy, dilated, 1MM"
    under one MIM number, that AR/Limited row is the closest thing to an
    expert-panel verdict on the genotype curated here, and it is a weak one.
    Both assertions are cited below.
  evidence:
  - reference: PMID:25335496
    reference_title: "Compound heterozygous or homozygous truncating MYBPC3 mutations cause lethal cardiomyopathy with features of noncompaction and septal defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to heterozygous pathogenic mutations, homozygous or compound
      heterozygous truncating pathogenic MYBPC3 mutations cause severe
      neonatal cardiomyopathy with features of left ventricular noncompaction
      and septal defects in approximately 60% of patients.
    explanation: >-
      Establishes MYBPC3 as causative for this LVNC entity and gives the
      dose-dependent contrast between the mono- and bi-allelic states.
  - reference: PMID:33500567
    reference_title: "Systematic large-scale assessment of the genetic architecture of left ventricular noncompaction reveals diverse etiologies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, truncating variants in MYH7, ACTN2, and PRDM16 were
      uniquely associated with LVNC and may reflect a distinct LVNC
      etiology.
    explanation: >-
      Documents that MYBPC3 was not among the genes found to be uniquely/
      LVNC-specifically enriched in this 840-case vs. 125,748-control
      rare-variant burden analysis, a qualification on the CAUSATIVE
      relationship modeled here (see notes above for how this is reconciled
      with the directly reported biallelic pedigree evidence). It qualifies
      rather than refutes the gene-disease relationship.
    directness: INDIRECT
  - reference: CGGV:assertion_7e65896e-33f5-439d-8749-aba08a539dd0-2021-10-07T160000.000Z
    reference_title: "MYBPC3 / hypertrophic cardiomyopathy (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      MYBPC3 | HGNC:7551 | hypertrophic cardiomyopathy | MONDO:0005045 | AD |
      Definitive | SOP8 | Hereditary Cardiovascular Disease Gene Curation
      Expert Panel | 2021-10-07T16:00:00.000Z
    explanation: >-
      ClinGen's Definitive classification of MYBPC3 for hypertrophic
      cardiomyopathy. Cited as the contrast term: this is the strength of
      evidence MYBPC3 carries for the phenotype it is actually established
      for, against which the noncompaction claims in this entry should be
      read.
    directness: INDIRECT
  - reference: CGGV:assertion_f240fb99-f839-4b9b-8e52-f2dc49078886-2025-05-16T040000.000Z
    reference_title: "MYBPC3 / dilated cardiomyopathy (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      MYBPC3 | HGNC:7551 | dilated cardiomyopathy | MONDO:0005021 | AR |
      Limited | SOP10 | Dilated Cardiomyopathy Gene Curation Expert Panel |
      2025-05-16T04:00:00.000Z
    explanation: >-
      ClinGen's autosomal recessive MYBPC3 curation - the allelic regime this
      entry models - reaches only Limited as of May 2025. Since OMIM groups
      LVNC10 with CMD1MM under one MIM number, this is the nearest
      expert-panel assessment of the biallelic genotype curated here, and it
      supports the caveat in the notes above rather than the strength of the
      founding pedigree evidence.
    directness: INDIRECT

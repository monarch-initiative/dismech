    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NCCM with HCM (4%) was associated with MYBPC3 and HCM without NCCM in
      relatives (p < 0.001).
    explanation: >-
      Directly establishes the MYBPC3-associated NCCM+HCM subgroup in this
      family-screening cohort, with HCM-without-NCCM co-occurring in

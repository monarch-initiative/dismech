      directness: INDIRECT
- name: Monoallelic cMyBP-C Deficiency and Noncompaction-Hypertrophy Phenotypic Overlap
  biological_scale: CELLULAR
  role: modulator
  description: >-
    A single truncating MYBPC3 allele - the CMH4 haploinsufficiency mechanism
    - produces a milder gene-dosage state that, in a subset of families, is
    associated with a noncompaction phenotype instead of, or together with,
    hypertrophic remodeling, and unaffected or hypertrophic-only relatives can
    carry the identical allele. This phenotypic plasticity supports a
    continuum-of-sarcomeric-cardiomyopathies model in which the same MYBPC3
    lesion can manifest as hypertrophic, noncompaction, or restrictive disease
    depending on modifying genetic or environmental factors.

    term:
      id: UBERON:0006566
      label: left ventricle myocardium
  evidence:
  - reference: PMID:25335496
    reference_title: "Compound heterozygous or homozygous truncating MYBPC3 mutations cause lethal cardiomyopathy with features of noncompaction and septal defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Features of left ventricular noncompaction were diagnosed in three
      patients. In the fourth, hypertrabeculation was not a clear feature, but
      could not be excluded.
    explanation: >-
      Direct echocardiographic/clinical documentation of noncompaction
      features in the founding biallelic MYBPC3 case series.
  downstream:
  - target: Neonatal Structural Cardiac Failure
    causal_link_type: DIRECT
    description: >-
      The noncompacted myocardium produces early, severe heart failure in
      the newborn period.
    evidence:
    - reference: PMID:25335496
      reference_title: "Compound heterozygous or homozygous truncating MYBPC3 mutations cause lethal cardiomyopathy with features of noncompaction and septal defects."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        They died from cardiac failure before age 13 weeks.
      explanation: >-
        The same four neonates in whom noncompaction was diagnosed died of
        cardiac failure within the first three months, which is the outcome
        this edge asserts. The source establishes the sequence within one
        cohort rather than isolating noncompaction as the cause, hence
        INDIRECT.
      directness: INDIRECT
- name: Dose-Dependent Congenital Septal and Ductal Structural Defects
  biological_scale: TISSUE
  role: effector
  description: >-
    The same severe biallelic MYBPC3 genotype that produces compaction
    failure is also strongly associated with co-occurring congenital
    structural anomalies of the cardiac septum and the ductus arteriosus,
    which accompanied cardiomyopathy in the majority of the pooled biallelic
    literature cohort. The founding case series and its pooled literature
    review report these anomalies jointly ("septal defects or a patent
    ductus arteriosus") without distinguishing atrial from ventricular
    septal involvement, so this node is deliberately not more specific than
    the cited evidence supports.

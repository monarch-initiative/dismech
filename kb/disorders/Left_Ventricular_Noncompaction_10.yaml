    reference_title: "Cardiac Phenotypes, Genetics, and Risks in Familial Noncompaction Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NCCM with HCM (4%) was associated with MYBPC3 and HCM without NCCM in
      relatives (p < 0.001).
    explanation: >-
      Directly establishes the MYBPC3-associated NCCM+HCM subgroup in this
      family-screening cohort, with HCM-without-NCCM co-occurring in
      relatives.
  - reference: PMID:36011256
    reference_title: "Different Phenotypes of Sarcomeric MyBPC3-Cardiomyopathy in the Same Family: Hypertrophic, Left Ventricular Noncompaction and Restrictive Phenotypes (in Association with Sarcoidosis)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This report confirms the concept of the phenotypic continuum of
      sarcomeric cardiomyopathies and describes possible phenotypic patterns
      and their transformation over time.
    explanation: >-
      States the phenotypic-continuum interpretation directly, grounded in a
      family in which one identical MYBPC3 truncating allele produced LVNC in
      one carrier and HCM in his children.
- name: Neonatal Structural Cardiac Failure
  biological_scale: ORGANISM
  role: effector
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Structural Cardiac Impairment and Heart Failure"
  description: >-
    The severe biallelic MYBPC3-cMyBP-C-deficient phenotype presents in the
    newborn period with feeding difficulties, failure to thrive, and dyspnea,
    and progresses to fatal cardiac failure within the first few months of
    life in the founding case series; heart transplantation has been used as
    a salvage therapy in an independently reported compound heterozygous
    case.
  evidence:
  - reference: PMID:25335496
    reference_title: "Compound heterozygous or homozygous truncating MYBPC3 mutations cause lethal cardiomyopathy with features of noncompaction and septal defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All four children presented with feeding difficulties, failure to
      thrive, and dyspnea. They died from cardiac failure before age 13
      weeks.
    explanation: >-
      Direct clinical description of the neonatal presentation and
      near-uniform early mortality in the founding biallelic MYBPC3 LVNC case
      series.
  - reference: PMID:30924982
    reference_title: "Biallelic mutation in MYH7 and MYBPC3 leads to severe cardiomyopathy with left ventricular noncompaction phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, haploinsufficiency in MYBPC3 results in a severe
      early-onset ventricular noncompaction phenotype requiring heart
      transplantation when combined with a de novo missense variant on the
      second allele.
    explanation: >-
      Documents heart transplantation as the clinical endpoint of the severe
      biallelic phenotype in an independent case series.

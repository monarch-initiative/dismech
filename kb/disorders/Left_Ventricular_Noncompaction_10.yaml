clinical_burden:
  burden_level: HIGH
  rationale: >-
    For the biallelic form the burden is maximal and brief: uniform severe
    cardiomyopathy or death within months of birth across every case reported
    up to 2015, with transplantation the only alternative endpoint documented.
    The monoallelic form is a different burden question entirely and is
    governed by the MYBPC3 hypertrophic cardiomyopathy literature rather than
    by anything specific to noncompaction; this HIGH rating is set by the
    biallelic subtype that defines the entity.
  evidence:
  - reference: PMID:25335496
    reference_title: "Compound heterozygous or homozygous truncating MYBPC3 mutations cause lethal cardiomyopathy with features of noncompaction and septal defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients with biallelic truncating pathogenic mutations in MYBPC3
      reported so far (n=21) were diagnosed with severe cardiomyopathy and/or
      died within the first few months of life.
    explanation: >-
      Uniform severe outcome across the complete reported cohort is what sets
      the burden level.
mechanistic_hypotheses:
- hypothesis_group_id: sarcomeric_dose_continuum
  hypothesis_label: Graded cMyBP-C dose sets position on one sarcomeric-cardiomyopathy continuum
  status: CANONICAL
  description: >-
    The prevailing reading of MYBPC3 genotype-phenotype relations: hypertrophic,
    noncompaction, restrictive and dilated presentations are positions on a
    single continuum, and residual functional cMyBP-C is the variable that sets
    which one a carrier occupies. Roughly 50% residual protein from a single
    truncating allele gives adult hypertrophic disease; ~20% or less from a
    biallelic genotype gives severe neonatal disease with noncompaction and
    septal defects. On this account nothing qualitatively different happens at
    the low-dose end, and the LVNC phenotype is what severe sarcomeric
    insufficiency looks like when it strikes during cardiac development. Its
    weakness is that it explains the severity gradient without explaining the
    change in kind, and one family carrying a single allele can display three
    different phenotypes among its members, which a purely quantitative account
    struggles with.
  evidence:
  - reference: PMID:36011256
    reference_title: "Different Phenotypes of Sarcomeric MyBPC3-Cardiomyopathy in the Same Family: Hypertrophic, Left Ventricular Noncompaction and Restrictive Phenotypes (in Association with Sarcoidosis)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This report confirms the concept of the phenotypic continuum of
      sarcomeric cardiomyopathies and describes possible phenotypic patterns
      and their transformation over time.
    explanation: >-
      States the continuum model directly, in a family where one allele
      produced three different phenotypes.
  - reference: PMID:30924982
    reference_title: "Biallelic mutation in MYH7 and MYBPC3 leads to severe cardiomyopathy with left ventricular noncompaction phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, the missense variant may lead to an unstable protein, as
      overall only 20% of the MYBPC3 protein remain detectable in affected
      cardiac tissue compared to control tissue.
    explanation: >-
      Supplies the quantitative anchor the continuum model needs: a measured
      residual protein level in the severe noncompaction case, against the
      ~50% expected of a heterozygous carrier.
- hypothesis_group_id: cytokinesis_brake_release
  hypothesis_label: Near-complete cMyBP-C loss releases an inhibitory brake on postnatal myocyte cytokinesis
  status: EMERGING
  description: >-
    A mechanistically distinct account of why the low-dose end diverges in kind
    rather than only in degree. In homozygous cMyBP-C-deficient mice, myocytes
    complete an extra round of division after birth and accumulate as
    supernumerary mononuclear cells; the heart enlarges by hyperplasia, whereas
    the heterozygous state enlarges it by hypertrophy. The authors conclude that
    cMyBP-C normally inhibits postnatal myocyte cytokinesis. If that inhibition
    is dose-sensitive, near-complete loss would extend the proliferative window
    across precisely the period in which the ventricle finishes converting
    trabecular to compact myocardium, offering a route from a quantitative
    protein deficit to a qualitatively different developmental outcome. This is
    a hypothesis about the human disease, not a finding in it: the mice develop
    dilation, not noncompaction, and no compaction measurement is reported. A
    zebrafish cMyBP-C knockout shows the same cardiomyocyte hyperplasia, so
    the proliferative response is at least conserved rather than murine; that
    strengthens the premise without touching the compaction step, which
    zebrafish anatomy cannot model.
  evidence:
  - reference: PMID:26153423
    reference_title: "Cardiac myosin binding protein C regulates postnatal myocyte cytokinesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, the mechanism leading to hypertrophic cardiomyopathy in
      heterozygous MYBPC3(+/-) individuals is myocyte hypertrophy (increased
      cell size), whereas the mechanism leading to cardiac dilation in
      homozygous Mybpc3(-/-) mice is primarily myocyte hyperplasia.
    explanation: >-
      The mono- versus bi-allelic divergence in cellular mechanism that this
      hypothesis generalizes from.
  - reference: PMID:36012114
    reference_title: "Transcriptome Profile Identifies Actin as an Essential Regulator of Cardiac Myosin Binding Protein C3 Hypertrophic Cardiomyopathy in a Zebrafish Model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Immunofluorescence staining revealed significant hyperplasia in the
      mutant's total cardiac and ventricular cardiomyocytes.
    explanation: >-
      Cross-species replication in a zebrafish cMyBP-C knockout. Hyperplasia
      arising independently in fish and mouse argues the proliferative response
      is a conserved consequence of losing cMyBP-C rather than a murine
      artifact, which is what this hypothesis needs to be worth testing in
      human tissue. Zebrafish have no compact myocardial layer, so it says
      nothing about the compaction step itself, hence INDIRECT.
    directness: INDIRECT

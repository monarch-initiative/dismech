      id: hgnc:7551
      label: MYBPC3
  description: >-
    A stable zebrafish knockout of the cMyBP-C orthologue, built as a
    hypertrophic-cardiomyopathy model but carrying the finding that matters
    most to this entry: immunofluorescence shows significant cardiomyocyte
    hyperplasia in mutant hearts at the larval stage, with myocardial
    remodeling and hyperplasia persisting into later larval development. That
    is the same cellular response the homozygous cMyBP-C-deficient mouse

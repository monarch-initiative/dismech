notes: >-
  These five references were consulted during curation (from the falcon
  deep-research pass and follow-up literature search) but are not individually
  mined for quoted evidence items: each is a broad LVNC genetics/outcome
  cohort, systematic review, or meta-analysis (van Waning 2018 JACC;
  van Waning 2019 systematic review; Kayvanpour 2019 meta-analysis;
  Sedaghat-Hamedani 2017; Arbustini 2014) that documents the general LVNC
  genetic-architecture and phenotype landscape summarized in the umbrella
  Left_Ventricular_Noncompaction.yaml entry, rather than a claim specific to
  MYBPC3/LVNC10 modeled in this entry. They are carried here for provenance
  and to record that they were reviewed and found non-contradictory to the
  MYBPC3-specific claims curated above. PMID:33500567 (Mazzarotto 2021,
  840 LVNC cases vs. 125,748 gnomAD controls) is mined for a direct

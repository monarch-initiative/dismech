- name: Tet-Off conditional cMyBP-C re-expression mouse (MYBPC3 null background)
  species: Mouse
  genotype: MYBPC3 null background carrying a doxycycline-regulated wild-type cMyBP-C transgene
  publication: PMID:30573635
  genes:
  - preferred_term: MYBPC3
    term:
      id: hgnc:7551
      label: MYBPC3
  description: >-
    A conditional model that titrates cMyBP-C up and down in the adult heart
    on a null background. Withdrawing cMyBP-C reproduced the null contractile
    phenotype and restoring it recovered ventricular function, establishing
    that the cardiac consequences of cMyBP-C absence are a maintained-state
    deficit rather than an irreversible lesion, at least for the adult
    contractile phenotype.
  evidence:
  - reference: PMID:30573635
    reference_title: "Recovery of left ventricular function following in vivo reexpression of cardiac myosin binding protein C."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The loss of cardiac myosin binding protein C (cMyBP-C) results in left
      ventricular dilation, cardiac hypertrophy, and impaired ventricular
      function in both constitutive and conditional cMyBP-C knockout (MYBPC3
      null) mice.
    explanation: >-
      Establishes the baseline null phenotype the conditional system is built
      on.
  modeled_mechanisms:
  - target: MYBPC3 Loss-of-Function Variant and cMyBP-C Depletion
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Controlled re-expression of wild-type cMyBP-C on the null background
      recovered ventricular function, showing the phenotype tracks the current
      protein level rather than a fixed consequence of having lacked it.
    limitations: >-
      The reversibility demonstrated is of the adult contractile and
      hypertrophic phenotype. LVNC10's defining lesion is a developmental
      failure of ventricular compaction laid down before birth, and nothing
      in this model tests whether that is reversible; a compaction defect
      could well be fixed even where contractile function is not. Knockdown
      was also partial rather than complete.
    divergences:
    - divergence_type: TEMPORAL_SCOPE
      materiality: INVALIDATING
      description: >-
        The manipulation and the readout both sit in the adult heart, after
        ventricular compaction is complete. The developmental window in which
        the human LVNC10 phenotype is established is entirely outside the
        model's temporal boundary, so its reversibility result cannot be
        carried across to the compaction defect.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Murine cardiac maturation and the postnatal timing of compaction
        differ from human, and the transgene is a wild-type mouse-heart
        construct rather than a corrected human allele.
    readouts:
    - name: In vivo left ventricular function after cMyBP-C re-expression
      target: MYBPC3 Loss-of-Function Variant and cMyBP-C Depletion
      description: >-
        Systolic and diastolic ventricular function measured after doxycycline
        withdrawal restored cMyBP-C to wild-type levels.
      direction: RESTORED
      interpretation: >-
        Function tracks current cMyBP-C level, supporting a maintained-state
        rather than irreversible reading of the protein-depletion node.
      evidence:
      - reference: PMID:30573635
        reference_title: "Recovery of left ventricular function following in vivo reexpression of cardiac myosin binding protein C."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-

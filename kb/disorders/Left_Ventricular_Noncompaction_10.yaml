discussions:
- discussion_id: lvnc10_dose_phenotype_divergence
  prompt: >-
    Why does near-complete biallelic loss of cMyBP-C converge on a
    developmental compaction-failure phenotype, while partial monoallelic
    haploinsufficiency of the same protein converges on hypertrophic
    remodeling (CMH4)?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Dose-Dependent Failure of Myocardial Compaction
  rationale: >-
    The clinical genetics literature robustly documents the correlation
    between MYBPC3 allelic dose and phenotype (biallelic loss to severe
    neonatal noncompaction; monoallelic loss to adult hypertrophic disease),
    but the mechanistic step converting a quantitative cMyBP-C deficit into a
    qualitatively different developmental outcome (failure of fetal
    myocardial compaction, rather than postnatal hypertrophic remodeling) is
    not established in the cited literature. This differs from the CMH4
    myosin super-relaxed-state mechanism, which explains hypercontractility
    from partial haploinsufficiency but has not been shown to explain the
    developmental compaction defect at near-complete loss.

    A candidate has since been added to this entry rather than left implicit:
    the homozygous cMyBP-C-deficient mouse shows that the same protein deficit
    reaches a different cellular endpoint at different allelic dose -
    hyperplasia through extended postnatal myocyte division at the null dose,
    hypertrophy at the heterozygous dose - and the authors attribute this to a
    normal inhibitory role of cMyBP-C in postnatal cytokinesis. That would
    supply the missing qualitative step, since the extended proliferative
    window overlaps the period of trabecular-to-compact remodeling. It does
    not close the gap: the mice develop dilation rather than noncompaction,
    no compaction measurement is reported, and the extrapolation from myocyte
    cell-cycle behaviour to ventricular wall architecture is the curator's,
    not the paper's. The hypothesis is carried as
    `mechanistic_hypotheses#cytokinesis_brake_release` with status EMERGING.
  evidence:
  - reference: PMID:26153423
    reference_title: "Cardiac myosin binding protein C regulates postnatal myocyte cytokinesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      MYBPC has unexpected inhibitory functions during postnatal myocyte
      cytokinesis and cell cycle progression.
    explanation: >-
      The finding that turns this gap from wholly open into one with a named
      candidate mechanism to test. Cited on the discussion because it bears on
      the question posed, not because it answers it.
    directness: INDIRECT
  proposed_experiments:
  - experiment_id: lvnc10_dose_dependent_compaction_study
    name: Graded cMyBP-C dosage time-course of cardiac compaction
    description: >-
      In an iPSC-derived cardiac organoid or animal model system, titrate
      cMyBP-C dosage across a graded range from full-length wild-type to
      near-null and compare myofibrillogenesis and trabecular-to-compact
      remodeling outcomes across the dose range, to determine whether a
      distinct low-dose threshold specifically produces a compaction
      failure phenotype rather than a hypertrophic one.
    perturbations:
    - name: Graded reduction of cMyBP-C dosage
      target: pathophysiology#MYBPC3 Loss-of-Function Variant and cMyBP-C Depletion
      description: >-
        Titrate residual cMyBP-C from wild-type through the heterozygous
        (~50%) and compound heterozygous (~20%) levels to near-null.
    readouts:
    - name: Trabecular-to-compact myocardial remodeling
      target: pathophysiology#Dose-Dependent Failure of Myocardial Compaction
      description: >-
        Ratio of noncompacted to compacted myocardial layer, measured across
        the dosage range at the end of the compaction window.
      biological_processes:
      - preferred_term: heart trabecula morphogenesis
        term:
          id: GO:0061384
          label: heart trabecula morphogenesis
    - name: Postnatal cardiomyocyte proliferation
      target: pathophysiology#Dose-Dependent Failure of Myocardial Compaction
      description: >-
        Myocyte division and mononuclear-cell accumulation across the same
        dosage range, to test whether extended proliferation tracks the
        compaction outcome.
      biological_processes:
      - preferred_term: cardiac muscle cell proliferation
        term:
          id: GO:0060038
          label: cardiac muscle cell proliferation
    would_support:
    - mechanistic_hypotheses#cytokinesis_brake_release
    supporting_outcome:
    - >-
      A discontinuity: below some residual-protein threshold the
      noncompacted-to-compacted ratio rises sharply and tracks the extension of
      the postnatal proliferative window, rather than both changing smoothly
      with dose.
    would_refute:
    - mechanistic_hypotheses#cytokinesis_brake_release
    refuting_outcome:
    - >-
      Compaction and proliferation both varying smoothly and proportionally
      with cMyBP-C dose, with no threshold, which would leave the phenotype
      difference quantitative and support the continuum account instead.
- discussion_id: lvnc10_no_model_shows_noncompaction
  prompt: >-
    Does any available model system actually reproduce the noncompaction
    phenotype of LVNC10, or only the genotype and the lethality?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Dose-Dependent Failure of Myocardial Compaction
  - animal_models#Homozygous cMyBP-C-deficient mouse (Mybpc3 t/t)
  - animal_models#Compound heterozygous MYBPC3 cloned pig
  - animal_models#mypbc3 knockout zebrafish
  - experimental_models#Biallelic MYBPC3 truncating hiPSC line with isogenic control
  rationale: >-
    Every model curated in this entry reaches the biallelic MYBPC3 genotype and
    none reaches the phenotype it is supposed to model. The homozygous
    cMyBP-C-deficient mouse dilates; the compound heterozygous cloned pig
    hypertrophies and dies perinatally; the zebrafish knockout has no compact
    myocardial layer to fail to form; the biallelic hiPSC line is a resource
    report with no phenotype assayed, and hiPSC-derived cardiomyocytes have no
    ventricular wall in which compaction could be scored at all. So the
    defining lesion of this entity - persistence of a noncompacted,
    hypertrabeculated ventricular wall - currently rests entirely on human
    imaging and autopsy, with no experimental system in which it can be
    perturbed or rescued.

    This is a mismatch worth stating rather than a gap in curation. The mouse
    and pig phenotypes are not merely weaker versions of the human one, they
    are different phenotypes, and species differences in the timing of
    ventricular compaction relative to birth are a plausible reason. Until a
    model reproduces the compaction defect, therapeutic inferences from the
    rescue experiments in this entry - the neonatal exon-skipping rescue and
    the Tet-Off reversibility result - bear on contractile and hypertrophic
    phenotypes, not on whether a compaction defect is preventable or
    reversible.
  evidence:
  - reference: PMID:26153423
    reference_title: "Cardiac myosin binding protein C regulates postnatal myocyte cytokinesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Homozygous cardiac myosin binding protein C-deficient (Mybpc(t/t)) mice
      develop dramatic cardiac dilation shortly after birth; heart size
      increases almost twofold.
    explanation: >-
      The mismatch stated in the sharpest available form: the biallelic-null
      mouse phenotype is dilation, and the human biallelic phenotype this
      entity is named for is noncompaction.
    directness: INDIRECT
  - reference: PMID:40496056
    reference_title: "Perinatal death in pig models of hypertrophic cardiomyopathy carrying sarcomere pathogenic variants."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The MYBPC3-edited piglet exhibited a compound heterozygous mutation
      leading to a markedly low level of mutant MYBPC3 protein and cardiac
      hypertrophy, reflecting the situation in infants.
    explanation: >-
      The large-animal attempt reaches hypertrophy, not noncompaction, so the
      mismatch is not confined to rodents.
    directness: INDIRECT
  proposed_experiments:
  - experiment_id: lvnc10_compaction_competent_model
    name: Compaction-competent biallelic MYBPC3 model
    description: >-
      Establish a system in which trabecular-to-compact remodeling can be
      scored under a biallelic MYBPC3 genotype - an engineered heart tissue or
      cardiac organoid taken through the compaction window, or an embryonic
      time course in a species whose compaction completes prenatally as it
      does in humans - and determine whether the noncompacted phenotype
      appears at all.
    readouts:
    - name: Noncompacted-to-compacted layer ratio
      target: pathophysiology#Dose-Dependent Failure of Myocardial Compaction
      description: >-
        The imaging measurement used to diagnose the human phenotype, applied
        to the model system.
    would_refute:
    - pathophysiology#Dose-Dependent Failure of Myocardial Compaction
    refuting_outcome:
    - >-
      A biallelic model that completes normal compaction would argue the human
      noncompaction finding is a secondary or modifier-dependent feature rather
      than a direct consequence of cMyBP-C loss, which is what the population
      burden analysis already hints at for the monoallelic state.

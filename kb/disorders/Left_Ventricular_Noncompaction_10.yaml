- name: MYBPC3 loss-of-function allele in trans with a de novo missense allele (Kolokotronis 2019)
  gene:
    preferred_term: MYBPC3
    term:
      id: hgnc:7551
      label: MYBPC3
  description: >-
    An independently reported compound heterozygous genotype: a loss-of-function
    MYBPC3 allele combined in trans with a de novo missense variant on the
    second allele. The missense allele was associated with an unstable
    protein product, reducing overall residual cMyBP-C to approximately 20%
    of control levels in affected cardiac tissue, and produced a severe
    early-onset noncompaction phenotype that required heart transplantation.
    The reporting study also recommends considering copy-number variants as
    an additional route to the same biallelic-dose mechanism, though no
    specific CNV genotype is documented for this MYBPC3 case in the cited
    literature.
  clinical_significance: PATHOGENIC
  evidence:

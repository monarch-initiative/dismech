  evidence:
  - reference: PMID:25335496
    reference_title: "Compound heterozygous or homozygous truncating MYBPC3 mutations cause lethal cardiomyopathy with features of noncompaction and septal defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two patients were compound heterozygotes for the pathogenic c.2373dup
      p.(Trp792fs) and c.2827C>T p.(Arg943*) mutations, and two were
      homozygous for the c.2373dup and c.2827C>T mutations.
    explanation: >-
      Documents the specific truncating variant class and biallelic genotypes
      (homozygous and compound heterozygous) underlying LVNC10.
  - reference: PMID:30924982
    reference_title: "Biallelic mutation in MYH7 and MYBPC3 leads to severe cardiomyopathy with left ventricular noncompaction phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, the missense variant may lead to an unstable protein, as
      overall only 20% of the MYBPC3 protein remain detectable in affected
      cardiac tissue compared to control tissue.
    explanation: >-
      Directly quantifies residual cMyBP-C protein (~20% of control) in
      affected cardiac tissue from a compound heterozygous MYBPC3 LVNC case,
      grounding the dose-dependence claim.
  downstream:
  - target: Dose-Dependent Failure of Myocardial Compaction
    causal_link_type: DIRECT
    hypothesis_groups:
    - sarcomeric_dose_continuum
    - cytokinesis_brake_release
    description: >-
      Near-complete biallelic loss of cMyBP-C is the allelic state most
      consistently linked to failure of normal trabecular-to-compact
      myocardial remodeling. This is the edge the two mechanistic hypotheses
      disagree about: whether it is the low end of one quantitative gradient
      or a qualitatively distinct developmental route.
    evidence:
    - reference: PMID:25335496
      reference_title: "Compound heterozygous or homozygous truncating MYBPC3 mutations cause lethal cardiomyopathy with features of noncompaction and septal defects."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In contrast to heterozygous pathogenic mutations, homozygous or compound
        heterozygous truncating pathogenic MYBPC3 mutations cause severe
        neonatal cardiomyopathy with features of left ventricular noncompaction
        and septal defects in approximately 60% of patients.
      explanation: >-
        States the genotype-to-phenotype step this edge asserts: it is the
        biallelic (near-complete cMyBP-C loss) genotype specifically, and not
        the heterozygous one, that produces the noncompaction phenotype.
  - target: Dose-Dependent Congenital Septal and Ductal Structural Defects
    causal_link_type: DIRECT
    description: >-
      The same near-complete biallelic loss of cMyBP-C is also associated
      with co-occurring congenital septal and ductal structural anomalies.
    evidence:
    - reference: PMID:25335496
      reference_title: "Compound heterozygous or homozygous truncating MYBPC3 mutations cause lethal cardiomyopathy with features of noncompaction and septal defects."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In 62% (13/21), septal defects or a patent ductus arteriosus
        accompanied cardiomyopathy.
      explanation: >-
        Quantifies the septal/ductal anomalies as accompanying the
        cardiomyopathy across the pooled biallelic cohort, which is the
        association this edge draws. The source reports co-occurrence within
        the biallelic genotype rather than demonstrating the developmental
        step, hence INDIRECT.
      directness: INDIRECT
  - target: Monoallelic cMyBP-C Deficiency and Noncompaction-Hypertrophy Phenotypic Overlap
    causal_link_type: DIRECT
    description: >-
      A single truncating allele produces a milder gene-dosage state that in
      some kindreds manifests as, or co-segregates in relatives with, a
      noncompaction phenotype rather than pure hypertrophy.
    evidence:
    - reference: PMID:30947911
      reference_title: "Cardiac Phenotypes, Genetics, and Risks in Familial Noncompaction Cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        NCCM with HCM (4%) was associated with MYBPC3 and HCM without NCCM in
        relatives (p < 0.001).
      explanation: >-
        Supports the edge from the MYBPC3 lesion to the milder,
        noncompaction-with-hypertrophy state: within a family-screening cohort
        this specific phenotype subgroup, and not noncompaction generally, is
        the one that tracks with MYBPC3.
- name: Dose-Dependent Failure of Myocardial Compaction
  biological_scale: TISSUE
  role: effector
  description: >-
    When cMyBP-C is reduced to a small fraction of normal by biallelic
    truncating (or loss-of-function-plus-missense) MYBPC3 genotypes, the fetal
    myocardium fails to complete the normal trabecular-to-compact remodeling
    process, leaving a persistently noncompacted, hypertrabeculated ventricular
    wall. The precise molecular step by which near-complete cMyBP-C loss
    diverts the myocardium toward a noncompaction phenotype, rather than
    toward the hypertrophic remodeling seen with partial (monoallelic)
    haploinsufficiency in CMH4, is not established (see the discussion
    below).

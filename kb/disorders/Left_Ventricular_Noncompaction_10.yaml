      Two patients were compound heterozygotes for the pathogenic c.2373dup
      p.(Trp792fs) and c.2827C>T p.(Arg943*) mutations, and two were
      homozygous for the c.2373dup and c.2827C>T mutations.
    explanation: >-
      Documents the specific compound heterozygous and homozygous genotypes
      in the founding LVNC10 case series.
inheritance:
- name: Autosomal recessive (biallelic truncating variants)
  description: >-
    The severe neonatal LVNC10 phenotype segregates as autosomal recessive at
    the level of disease severity: two truncating MYBPC3 alleles (homozygous
    or compound heterozygous) are required, while heterozygous parents are
    typically asymptomatic or only mildly affected obligate carriers. Because
    the heterozygous state is itself the classic dominant CMH4 disease allele,
    this is a dose-dependent threshold effect rather than true biological
    recessivity.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:25335496
    reference_title: "Compound heterozygous or homozygous truncating MYBPC3 mutations cause lethal cardiomyopathy with features of noncompaction and septal defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients with biallelic truncating pathogenic mutations in MYBPC3
      reported so far (n=21) were diagnosed with severe cardiomyopathy and/or
      died within the first few months of life.
    explanation: >-
      Establishes the biallelic requirement and uniform severity that defines
      the recessive-severity threshold of LVNC10.
- name: Autosomal dominant (monoallelic variants, incomplete/variable penetrance)
  description: >-
    A single heterozygous MYBPC3 variant can also be associated with a
    noncompaction phenotype in some kindreds, particularly those in which
    relatives carrying the same allele have an unambiguous hypertrophic
    cardiomyopathy phenotype, consistent with the incompletely penetrant,
    variably expressive autosomal dominant inheritance already established
    for MYBPC3-associated hypertrophic cardiomyopathy (CMH4).
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:30947911
    reference_title: "Cardiac Phenotypes, Genetics, and Risks in Familial Noncompaction Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NCCM with HCM (4%) was associated with MYBPC3 and HCM without NCCM in
      relatives (p < 0.001).
    explanation: >-
      PARTIAL support: identifies the MYBPC3-associated NCCM+HCM subgroup
      within a family-screening cohort in which relatives carrying the
      variant show variable, incompletely penetrant cardiac phenotypes.
prevalence:
- population: Reported in the literature (biallelic MYBPC3 genotype)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population-based prevalence estimate exists for LVNC10. As of the 2015
    founding case series and literature review, only 21 patients with biallelic
    truncating MYBPC3 mutations had been reported worldwide, underscoring
    extreme rarity.
  evidence:
  - reference: PMID:25335496
    reference_title: "Compound heterozygous or homozygous truncating MYBPC3 mutations cause lethal cardiomyopathy with features of noncompaction and septal defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients with biallelic truncating pathogenic mutations in MYBPC3
      reported so far (n=21) were diagnosed with severe cardiomyopathy and/or
      died within the first few months of life.
    explanation: >-
      Gives the total literature count (n=21) of biallelic MYBPC3 patients as
      of this 2015 review, supporting the ultra-rare/not-yet-documented
      population prevalence classification.

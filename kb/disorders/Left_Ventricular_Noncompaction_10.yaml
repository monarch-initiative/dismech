differential_diagnoses:
- name: Hypertrophic Cardiomyopathy 4
  disease_term:
    preferred_term: hypertrophic cardiomyopathy 4
    term:
      id: MONDO:0007268
      label: hypertrophic cardiomyopathy 4
  description: >-
    Hypertrophic cardiomyopathy 4 (CMH4) is caused by the same gene, MYBPC3,
    and the two entities sit at opposite ends of the same allelic-dose
    spectrum: monoallelic truncating variants classically produce the
    adult-onset hypertrophic phenotype of CMH4, while biallelic variants that
    abolish cMyBP-C more completely produce the severe neonatal noncompaction
    phenotype of LVNC10. Some monoallelic carriers and their relatives show
    overlapping or divergent hypertrophic/noncompaction phenotypes within the
    same family.
  distinguishing_features:
  - Biallelic (homozygous/compound heterozygous) MYBPC3 genotype and severe
    neonatal onset in LVNC10, versus the classic monoallelic, adult-onset
    CMH4 presentation
  - Predominant imaging phenotype is noncompacted/hypertrabeculated myocardium
    in LVNC10 versus discrete left ventricular hypertrophy in CMH4
  - LVNC10 frequently co-occurs with congenital septal defects, which are not
    a feature of typical monoallelic CMH4
  evidence:
  - reference: PMID:25335496
    reference_title: "Compound heterozygous or homozygous truncating MYBPC3 mutations cause lethal cardiomyopathy with features of noncompaction and septal defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to heterozygous pathogenic mutations, homozygous or compound
      heterozygous truncating pathogenic MYBPC3 mutations cause severe
      neonatal cardiomyopathy with features of left ventricular noncompaction
      and septal defects in approximately 60% of patients.
    explanation: >-
      Directly contrasts the heterozygous CMH4 genotype/phenotype with the
      biallelic LVNC10 genotype/phenotype in the same MYBPC3 gene.
- name: Left Ventricular Noncompaction (idiopathic/other genetic causes)
  disease_term:
    preferred_term: left ventricular noncompaction
    term:
      id: MONDO:0018901
      label: left ventricular noncompaction
  description: >-
    The broader LVNC umbrella entry captures noncompaction cardiomyopathy
    caused by other sarcomeric, mitochondrial, and cytoskeletal genes (MYH7,
    TAFAZZIN, NRAP, and others). LVNC10 is distinguished from these by the
    identification of a causative MYBPC3 variant, most often biallelic, on
    molecular genetic testing.
  distinguishing_features:
  - Requires molecular confirmation of a causative MYBPC3 variant
  - Biallelic MYBPC3 genotypes are associated with a distinctively severe,
    early neonatal-lethal course and co-occurring septal defects not
    typically emphasized in other genetic causes of LVNC
  evidence:
  - reference: PMID:30947911
    reference_title: "Cardiac Phenotypes, Genetics, and Risks in Familial Noncompaction Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NCCM with HCM (4%) was associated with MYBPC3 and HCM without NCCM in
      relatives (p < 0.001).
    explanation: >-
      Establishes that MYBPC3 (versus MYH7) marks a genetically and
      phenotypically distinguishable NCCM subgroup within the broader LVNC
      umbrella, supporting the need for molecular confirmation to distinguish
      LVNC10 from other genetic causes.
animal_models:
- name: Homozygous cMyBP-C-deficient mouse (Mybpc3 t/t)
  species: Mouse
  genotype: Mybpc3 t/t (homozygous cardiac myosin binding protein C-deficient)
  publication: PMID:26153423
  genes:
  - preferred_term: MYBPC3
    term:
      id: hgnc:7551
      label: MYBPC3
  description: >-
    The homozygous cMyBP-C-deficient mouse is the murine counterpart of the
    biallelic MYBPC3 allelic state that defines LVNC10, and is the only model
    in this entry that offers a candidate mechanism for the dose-phenotype
    divergence recorded in the open discussion below. These mice enlarge their
    hearts almost twofold shortly after birth, and the enlargement is driven
    by myocyte hyperplasia rather than hypertrophy: cMyBP-C-null myocytes
    complete an extra round of postnatal cell division and accumulate as
    supernumerary mononuclear cells, whereas the heterozygous state produces
    hypertrophy through increased cell size. The authors propose that cMyBP-C
    normally acts as an inhibitor of postnatal myocyte cytokinesis, so that
    near-complete loss releases a proliferative program at exactly the window
    in which the mammalian ventricle is finishing its trabecular-to-compact
    remodeling.
  evidence:
  - reference: PMID:26153423
    reference_title: "Cardiac myosin binding protein C regulates postnatal myocyte cytokinesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      MYBPC has unexpected inhibitory functions during postnatal myocyte
      cytokinesis and cell cycle progression.
    explanation: >-
      States the model's central mechanistic finding, which is what makes it
      informative for the allelic-dose question this entry models rather than
      merely another sarcomeric-cardiomyopathy mouse.
  modeled_mechanisms:
  - target: MYBPC3 Loss-of-Function Variant and cMyBP-C Depletion
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      The homozygous null genotype reproduces the near-complete cMyBP-C
      depletion that the biallelic human genotype produces, and the paper
      makes the mono- versus bi-allelic dose contrast explicitly.
    readouts:
    - name: Postnatal heart size
      target: MYBPC3 Loss-of-Function Variant and cMyBP-C Depletion
      description: >-
        Gross cardiac enlargement measured in homozygous null mice shortly
        after birth, against wild-type littermates.
      direction: INCREASED
      interpretation: >-
        Confirms that the null genotype produces an overt cardiac phenotype in
        the neonatal window, matching the timing of the human biallelic
        presentation.
      evidence:
      - reference: PMID:26153423
        reference_title: "Cardiac myosin binding protein C regulates postnatal myocyte cytokinesis."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Homozygous cardiac myosin binding protein C-deficient (Mybpc(t/t))
          mice develop dramatic cardiac dilation shortly after birth; heart
          size increases almost twofold.
        explanation: >-
          Reports the measured cardiac enlargement and its postnatal timing in
          the homozygous null model.
    evidence:
    - reference: PMID:26153423
      reference_title: "Cardiac myosin binding protein C regulates postnatal myocyte cytokinesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We suggest that human patients with homozygous MYBPC3-null mutations
        develop dilated cardiomyopathy, coupled with myocyte hyperplasia
        (increased cell number), as observed in Mybpc(t/t) mice.
      explanation: >-
        The authors themselves position the homozygous null mouse as the model
        of the human biallelic MYBPC3-null state, which is the node this link
        targets.
  - target: Dose-Dependent Failure of Myocardial Compaction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      The model reproduces the allelic dose and the neonatal timing of the
      human compaction phenotype, and supplies a cellular mechanism -
      failure of postnatal myocyte cell-cycle exit - that could plausibly
      divert ventricular wall maturation. It does not reproduce the
      noncompaction phenotype itself.
    limitations: >-
      The mouse phenotype is cardiac dilation with myocyte hyperplasia, not a
      persistently hypertrabeculated, noncompacted ventricular wall; the
      abstract reports no trabecular-to-compact remodeling measurement.
      Homozygous null mice also survive into adulthood, where the human
      biallelic genotype is lethal within months. Treating the cytokinesis
      finding as the explanation of human compaction failure is an inference
      the cited work does not make.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The measured quantity is the number of postnatal myocyte divisions and
        the resulting count of mononuclear myocytes. The node's quantity is
        the extent of trabecular-to-compact remodeling of the ventricular
        wall. Extra cell divisions are a candidate upstream cause of a
        compaction defect, not a measurement of one.
    - divergence_type: SCALE_EXTRAPOLATION
      materiality: QUALIFYING
      description: >-
        The model observes cell-cycle behaviour in individual cardiomyocytes
        (CELLULAR); the node is the tissue-level architecture of the
        ventricular wall (TISSUE). The step from supernumerary myocytes to a
        noncompacted wall is not observed in this model.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Murine and human ventricular compaction differ in timing relative to
        birth, and the mouse null survives to adulthood while the equivalent
        human genotype is fatal in the first months of life, so the
        postnatal-proliferation window the model exploits may not be the
        window in which the human phenotype is set.
    readouts:
    - name: Mononuclear cardiomyocyte number in the postnatal window
      target: Dose-Dependent Failure of Myocardial Compaction
      description: >-
        Count of myocytes completing an additional postnatal division within
        10 days of birth, compared with wild-type littermates.
      biological_processes:
      - preferred_term: cardiac muscle cell proliferation
        term:
          id: GO:0060038
          label: cardiac muscle cell proliferation
        modifier: INCREASED
      direction: INCREASED
      interpretation: >-
        The cellular readout standing in for the compaction node: extended
        postnatal proliferation is the model's proposed route from cMyBP-C
        loss to abnormal ventricular wall maturation.
      evidence:
      - reference: PMID:26153423
        reference_title: "Cardiac myosin binding protein C regulates postnatal myocyte cytokinesis."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We demonstrate that many Mybpc(t/t) myocytes undergo an additional
          round of cell division within 10 d postbirth compared with their
          wild-type counterparts, leading to increased numbers of mononuclear
          myocytes.
        explanation: >-
          Reports the measurement and its direction directly.
    evidence:
    - reference: PMID:26153423
      reference_title: "Cardiac myosin binding protein C regulates postnatal myocyte cytokinesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        However, the mechanism leading to hypertrophic cardiomyopathy in
        heterozygous MYBPC3(+/-) individuals is myocyte hypertrophy (increased
        cell size), whereas the mechanism leading to cardiac dilation in
        homozygous Mybpc3(-/-) mice is primarily myocyte hyperplasia.
      explanation: >-
        This is the sentence that makes the model informative for this node:
        it establishes that the same protein deficit reaches a qualitatively
        different cellular endpoint depending on allelic dose, which is the
        dose-dependence the node asserts. It is cited for the dose principle,
        not as evidence of noncompaction, which the model does not show.
      directness: INDIRECT
- name: Mybpc3-targeted knock-in mouse (homozygous exon 6 G>A)
  species: Mouse
  genotype: Mybpc3 knock-in, homozygous G>A transition in exon 6
  publication: PMID:23716398
  genes:
  - preferred_term: MYBPC3
    term:
      id: hgnc:7551
      label: MYBPC3
  description: >-
    A homozygous Mybpc3 knock-in mouse carrying a single point mutation that
    generates three aberrant mRNAs, developed as a hypertrophic-cardiomyopathy
    model but genotypically in the biallelic regime this entry curates. It is
    included here for the therapeutic arm: AAV-delivered U7snRNA antisense
    constructs that mask splicing enhancers in exons 5 and 6 shifted splicing
    toward a functional variant and, injected in newborns, abolished cardiac
    dysfunction and prevented hypertrophy. This is the only demonstration in
    this entry that a biallelic Mybpc3 cardiac phenotype is preventable if the
    protein deficit is corrected in the neonatal window.
  evidence:
  - reference: PMID:23716398
    reference_title: "Rescue of cardiomyopathy through U7snRNA-mediated exon skipping in Mybpc3-targeted knock-in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      KI mice carry a homozygous G>A transition in exon 6, which results in
      three different aberrant mRNAs.
    explanation: >-
      Establishes the model's homozygous genotype and its aberrant-transcript
      consequence, placing it in the biallelic allelic regime.
  modeled_mechanisms:
  - target: Neonatal Structural Cardiac Failure
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Neonatal AAV-U7-AON treatment prevented the cardiac dysfunction and
      hypertrophy that this homozygous Mybpc3 genotype otherwise produces,
      establishing the neonatal window as a point of intervention on the
      organ-level failure node.
    limitations: >-
      The rescued phenotype is hypertrophy with cardiac dysfunction, not
      noncompaction, so the experiment shows that a biallelic Mybpc3 cardiac
      phenotype is correctable rather than that the human LVNC10 compaction
      defect specifically is. The authors also report the effect as transient
      and requiring optimization, and the construct is exon-6-specific, so it
      would not transfer to the human truncating alleles curated in this
      entry without redesign.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The corrected lesion is a mouse exon-6 splice-shifting point mutation.
        The human LVNC10 alleles are frameshift and nonsense variants
        distributed across the gene, for which this exon-skipping strategy
        offers no direct route.
    - divergence_type: TEMPORAL_SCOPE
      materiality: QUALIFYING
      description: >-
        The rescue is reported as transient, so the experiment bounds a
        short-term prevention window and says nothing about durable
        correction of the organ-level failure node.
    readouts:
    - name: Left ventricular hypertrophy and cardiac function after neonatal AAV-U7-AON
      target: Neonatal Structural Cardiac Failure
      description: >-
        Cardiac function and left ventricular hypertrophy assessed in
        homozygous KI mice injected as newborns with AAV-U7-AON-5+6.
      direction: RESTORED
      interpretation: >-
        Prevention of the organ-level failure phenotype when the protein
        deficit is corrected neonatally.
      evidence:
      - reference: PMID:23716398
        reference_title: "Rescue of cardiomyopathy through U7snRNA-mediated exon skipping in Mybpc3-targeted knock-in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Injection of newborn KI mice abolished cardiac dysfunction and
          prevented left ventricular hypertrophy.
        explanation: >-
          Reports the measured rescue and its neonatal timing.
- name: Compound heterozygous MYBPC3 cloned pig
  species: Pig
  genotype: MYBPC3 compound heterozygous (CRISPR/Cas9 edited, somatic cell nuclear transfer)
  publication: PMID:40496056
  genes:
  - preferred_term: MYBPC3
    term:
      id: hgnc:7551
      label: MYBPC3
  description: >-
    A large-animal attempt at the biallelic MYBPC3 state. The edited piglet
    carried a compound heterozygous genotype, expressed markedly reduced
    mutant MYBPC3 protein, and developed cardiac hypertrophy, but the
    pregnancies yielded non-viable piglets that died around birth. The model
    therefore reproduces the perinatal lethality of human biallelic MYBPC3
    disease in a species with human-like cardiac size and physiology, while
    supplying no postnatal course.
  evidence:
  - reference: PMID:40496056
    reference_title: "Perinatal death in pig models of hypertrophic cardiomyopathy carrying sarcomere pathogenic variants."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The MYBPC3-edited piglet exhibited a compound heterozygous mutation
      leading to a markedly low level of mutant MYBPC3 protein and cardiac
      hypertrophy, reflecting the situation in infants.
    explanation: >-
      Establishes the biallelic genotype, the reduced protein level, and the
      authors' own framing of the model as reflecting the human infantile
      presentation.
  modeled_mechanisms:
  - target: Neonatal Structural Cardiac Failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Perinatal death with cardiac disease reproduces the lethal timing of the
      human biallelic phenotype in a large animal.
    limitations: >-
      The reported cardiac phenotype is hypertrophy; no noncompaction,
      hypertrabeculation, or septal defect is described. Only a single edited
      MYBPC3 piglet is reported, and cloning by somatic cell nuclear transfer
      independently causes perinatal loss, so the death cannot be attributed
      to the genotype alone. The authors' own conclusion is that pigs are
      unusually sensitive to sarcomeric variants, which is itself a caution
      against reading the timing across to humans.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The paper concludes that pigs are particularly sensitive to sarcomeric
        gene mutations, so the perinatal lethality may reflect porcine
        sensitivity rather than the severity of the human genotype.
    - divergence_type: POPULATION_MISMATCH
      materiality: QUALIFYING
      description: >-
        A single cloned MYBPC3-edited piglet, produced by somatic cell nuclear
        transfer, which carries its own perinatal-loss risk that is not
        separated from the genotype effect here.
    readouts:
    - name: Perinatal survival of MYBPC3-edited cloned piglets
      target: Neonatal Structural Cardiac Failure
      description: >-
        Viability of cloned piglets carrying edited sarcomeric genotypes.
      direction: DECREASED
      interpretation: >-
        Death around birth is the organism-level correlate of the human
        neonatal failure node.
      evidence:
      - reference: PMID:40496056
        reference_title: "Perinatal death in pig models of hypertrophic cardiomyopathy carrying sarcomere pathogenic variants."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In conclusion, MYBPC3 and MYH7 cloned piglets developed cardiac
          hypertrophy and died around birth, indicating that pigs are
          particularly sensitive to sarcomeric gene mutations.
        explanation: >-
          Reports both the outcome and the authors' species-sensitivity
          caveat in one sentence.
- name: mypbc3 knockout zebrafish

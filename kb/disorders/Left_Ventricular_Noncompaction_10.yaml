- name: Genetic testing and reproductive counseling
  description: >-
    Because biallelic MYBPC3 truncating genotypes are associated with severe,
    often lethal neonatal disease while single-allele carriers (including
    obligate-carrier parents) are typically unaffected or mildly affected,
    identification of a truncating MYBPC3 variant in one parent should prompt
    partner and family cascade testing to assess recurrence risk in future
    pregnancies.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:30924982
    reference_title: "Biallelic mutation in MYH7 and MYBPC3 leads to severe cardiomyopathy with left ventricular noncompaction phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, in patients with early disease onset and atypical
      clinical course, biallelic inheritance or more complex variants
      including copy number variations and de novo mutations should be
      considered.
    explanation: >-
      Directly supports the clinical recommendation to consider biallelic
      MYBPC3 inheritance, and therefore parental carrier and reproductive
      counseling, in early-onset atypical cardiomyopathy.
diagnosis:
- name: Echocardiographic and cardiac MRI diagnosis of trabeculated two-layer myocardium
  description: >-
    As in the broader LVNC umbrella, echocardiography and cardiac MRI are the
    primary imaging modalities used to identify the noncompacted and compacted
    myocardial layers; in the neonatal MYBPC3 form these are combined with
    assessment for co-occurring septal defects.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
    qualifiers:
    - predicate:
        preferred_term: diagnostic procedure
        term:
          id: NCIT:C18020
          label: Diagnostic Procedure
      value:
        preferred_term: echocardiography test
        term:
          id: NCIT:C16525
          label: Echocardiography Test
  notes: >-
    Imaging caveat: LV hypertrabeculation is not specific for pathological
    LVNC. Up to 15% of the general population exceeds conventional
    echocardiographic/CMR noncompaction-to-compaction ratio thresholds as a
    normal variant, and current (2023 ESC) guidance frames excessive
    trabeculation as a dynamic morphological trait that can occur
    physiologically (e.g., pregnancy, athletic training) rather than always
    indicating a distinct cardiomyopathy. In LVNC10, imaging findings should
    therefore be interpreted alongside the MYBPC3 genotype and, in the
    biallelic subtype, the co-occurring clinical and structural picture
    (feeding difficulties, failure to thrive, heart septal defects), not on
    morphology alone.
  evidence:
  - reference: PMID:25335496
    reference_title: "Compound heterozygous or homozygous truncating MYBPC3 mutations cause lethal cardiomyopathy with features of noncompaction and septal defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Features of left ventricular noncompaction were diagnosed in three
      patients. In the fourth, hypertrabeculation was not a clear feature, but
      could not be excluded.
    explanation: >-
      Supports echocardiographic/imaging assessment of noncompaction features
      as the diagnostic basis for this entity in the founding case series.
  - reference: PMID:38019448
    reference_title: "The Trouble with Trabeculation: How Genetics Can Help to Unravel a Complex and Controversial Phenotype."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It commonly occurs as a normal variant in apparently healthy
      individuals, with up to 15% of the population exceeding the diagnostic
      NC/C ratio when detected by sensitive cardiac magnetic resonance (CMR)
      imaging
    explanation: >-
      Supports the imaging-overdiagnosis caveat that excessive trabeculation
      by NC/C-ratio criteria alone is not specific for pathological LVNC.
      INDIRECT because this is general LVNC-imaging-trait evidence rather than
      MYBPC3/LVNC10-specific; evidence source is OTHER because this is a
      narrative review, not a primary clinical study.
    directness: INDIRECT
- name: Genetic testing for biallelic versus monoallelic MYBPC3 genotype
  description: >-
    Molecular genetic testing distinguishes the severe biallelic
    (homozygous/compound heterozygous) MYBPC3 genotype from the monoallelic
    genotype, which is prognostically critical because the two states predict
    markedly different clinical courses and inform parental carrier and
    reproductive counseling.

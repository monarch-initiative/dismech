mechanistic_hypotheses:
- hypothesis_group_id: thousands_of_recessive_id_loci
  hypothesis_label: >-
    The recessive class comprises thousands of loci, each individually
    ultra-rare, because recessive lesions are not filtered by selection
  status: EMERGING
  description: >-
    Under this model the extreme locus heterogeneity of AR-NSID is not an
    artefact of incomplete discovery but a structural prediction. A heterozygous
    carrier is unaffected and reproductively unimpaired, so a damaging recessive
    allele is under weak purifying selection and persists; consequently
    essentially any gene required for brain development can contribute, not
    merely the haploinsufficiency-intolerant minority that dominates the
    dominant class. The predictions are a long tail of genes each explaining one
    or a few families worldwide, a total locus count in the low thousands, no
    prevalent gene or pathway, and continued near-linear discovery of novel
    genes with each new consanguineous cohort. Successive cohorts have behaved
    exactly as predicted, but the estimate remains an extrapolation from
    clinic-ascertained multiplex families rather than a population measurement,
    which is why the status is EMERGING rather than established.
  evidence:
  - reference: PMID:28397838
    reference_title: "Mapping autosomal recessive intellectual disability: combined microarray and exome sequencing identifies 26 novel candidate genes in 192 consanguineous families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Previous studies have indicated high levels of genetic heterogeneity, with
      estimates of more than 2500 autosomal ID genes, the majority of which are
      autosomal recessive (AR).
    explanation: >-
      States the quantitative form of the hypothesis: >2500 autosomal loci,
      mostly recessive.
  - reference: PMID:28397838
    reference_title: "Mapping autosomal recessive intellectual disability: combined microarray and exome sequencing identifies 26 novel candidate genes in 192 consanguineous families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified definite or candidate mutations (or CNVs) in 51% of families
      in 72 different genes, including 26 not previously reported for ARID.
    explanation: >-
      Observed behaviour matching the prediction: even a large modern cohort
      yields many genes, a large fraction of them novel.
  - reference: PMID:29302074
    reference_title: "Genetics of intellectual disability in consanguineous families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 219 of these, we found likely causative variants, involving 77 known
      and 77 novel AR-ID (candidate) genes, 21 X-linked genes, as well as 9
      genes previously implicated in diseases other than ID.
    explanation: >-
      Novel genes equal known genes one-for-one in the largest cohort to date -
      the signature of an unsaturated long tail.
  - reference: PMID:30459488
    reference_title: "Genetics of autosomal recessive intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are no prevalent ARID genes, pathways, or protein complexes and the
      functions of the affected proteins are very diverse and limited not only
      to neurological aspects.
    explanation: >-
      Directly confirms the "no prevalent locus" corollary of the long-tail
      model.
  - reference: PMID:22541559
    reference_title: "Mutations in NSUN2 cause autosomal-recessive intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Particularly, autosomal-recessive forms of the disorder have a very
      heterogeneous molecular basis, and genes with an increased number of
      disease-causing mutations are not common.
    explanation: >-
      States the corollary that recurrently mutated genes are the exception, not
      the rule.
  - reference: PMID:28097321
    reference_title: "Diagnostic Yield and Novel Candidate Genes by Exome Sequencing in 152 Consanguineous Families With Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal recessive inherited neurodevelopmental disorders are highly
      heterogeneous, and many, possibly most, of the disease genes are still
      unknown.
    explanation: >-
      Independent statement that the gene set remains largely undiscovered, as
      the hypothesis predicts.

- hypothesis_group_id: nonsyndromic_boundary_is_ascertainment
  hypothesis_label: >-
    The non-syndromic label reflects depth of phenotyping and cohort size rather
    than a mechanistically distinct disease class
  status: EMERGING
  description: >-
    Under this model AR-NSID is the leading edge of recessive gene discovery
    rather than a separate biological entity: a gene-disease pair is called
    non-syndromic while it rests on one or two consanguineous pedigrees and a
    routine dysmorphology examination, and migrates into a named syndrome once
    enough patients accumulate to reveal a gestalt. The prediction is that
    MRT-series entities will be progressively reclassified, and several already
    have been. Within this entry, MRT5/NSUN2 was reported with accompanying
    facial dysmorphism and the discovering authors themselves raised the
    possibility of a syndromic form; MRT15/MAN1B1 was reported with a mixed
    cohort (three strictly non-syndromic families plus one with additional
    features) and now carries the eponymous MONDO label "Rafiq syndrome"; and
    ADAT3 - initially characterised as cognitive impairment with strabismus -
    became "an important recognizable cause of intellectual disability in
    Arabia" with dysmorphic features once a second cohort was described. The
    competing, not mutually exclusive model is that a genuine subset of genes
    has sufficiently brain-restricted consequence that isolated cognitive
    impairment is the real phenotype; TUSC3 is the strongest case, since
    N-glycosylation defects usually produce florid multisystem disease yet TUSC3
    loss does not. Distinguishing the two requires prospective deep phenotyping
    of MRT-series cohorts, which has not been done.
  evidence:
  - reference: PMID:30459488
    reference_title: "Genetics of autosomal recessive intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, in the last few months, evidence has been growing that many
      ARID genes are pleiotropic and that the resulting phenotypes may have a
      broad spectrum.
    explanation: >-
      The class-level statement of the hypothesis: ARID gene-phenotype
      relationships are broader than the initial non-syndromic reports imply.
  - reference: PMID:22541559
    reference_title: "Mutations in NSUN2 cause autosomal-recessive intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      suggesting that mutations in this gene might even induce a syndromic form
      of ID
    explanation: >-
      The original authors of an MRT-series entity explicitly raise
      reclassification as syndromic - the predicted migration, stated
      prospectively.
  - reference: PMID:22541559
    reference_title: "Mutations in NSUN2 cause autosomal-recessive intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The humans homozygous for NSUN2 mutations showed an overlapping phenotype
      consisting of moderate to severe ID and facial dysmorphism
    explanation: >-
      Documents the dysmorphic features that undercut the non-syndromic
      designation for this subtype.
  - reference: PMID:26842963
    reference_title: "ADAT3-related intellectual disability: Further delineation of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ADAT3-related intellectual disability is an important recognizable cause
      of intellectual disability in Arabia.
    explanation: >-
      Worked example of completed migration: a recessive tRNA-modification
      intellectual-disability gene becomes a RECOGNISABLE (i.e. syndromic)
      entity once a second cohort is phenotyped.
  - reference: PMID:26842963
    reference_title: "ADAT3-related intellectual disability: Further delineation of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ADAT3-related intellectual disability has been recently described in 24
      individuals from eight Saudi families who had cognitive impairment and
      strabismus.
    explanation: >-
      Establishes the starting point of that migration - a narrowly described
      cognitive phenotype - against which the later expansion is measured.
  - reference: PMID:21763484
    reference_title: "Mutations in the alpha 1,2-mannosidase gene, MAN1B1, cause autosomal-recessive intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      four consanguineous families affected by nonsyndromic autosomal-recessive
      intellectual disability (NS-ARID) and one in which the patients show
      additional clinical features
    explanation: >-
      Shows the boundary being crossed inside a single founding report, with
      syndromic and non-syndromic families for the same gene.
  - reference: PMID:18452889
    reference_title: "A defect in the TUSC3 gene is associated with autosomal recessive mental retardation."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data suggest that in contrast to other genetic defects of
      glycosylation, inactivation of TUSC3 causes nonsyndromic MR
    explanation: >-
      Counter-evidence for the competing model: a gene in a pathway whose other
      defects are floridly syndromic nevertheless produces isolated cognitive
      impairment, arguing that non-syndromic can be a real biological outcome
      rather than shallow phenotyping.

- hypothesis_group_id: imprinted_bias_monoallelic_arid
  hypothesis_label: >-
    Parent-of-origin expression bias makes a subset of recessive ID genes
    pathogenic in the monoallelic (maternally inherited) state
  status: EMERGING
  description: >-
    Some autosomal genes are not fully biallelically expressed but show a
    parent-of-origin expression BIAS. For TRAPPC9, brain expression is
    predominantly (~70%) from the maternally inherited allele. In mouse this
    produces a striking asymmetry: heterozygotes lacking the maternal allele
    (~70% loss of expression) phenocopy homozygous nulls, whereas heterozygotes
    lacking the paternal allele are normal. If the same bias holds in human
    brain, a SINGLE maternally inherited loss-of-function allele in an
    imprinted-bias ARID gene could be pathogenic - a genotype that standard
    recessive filtering (which demands two hits) would discard, and that
    standard recurrence-risk counselling (25%) would misstate. This would also
    predict apparent "non-penetrance" or unexplained mild cases in families
    where only one allele is disrupted. The hypothesis is EMERGING: the
    allele-bias and the mouse asymmetry are established, but the human clinical
    correlate rests on a single child with increased ad libitum food intake and
    has not been tested systematically in monoallelic TRAPPC9 carriers.
  applies_to_subtypes:
  - MRT13
  evidence:
  - reference: PMID:32877400
    reference_title: "Trappc9 deficiency causes parent-of-origin dependent microcephaly and obesity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In an analysis of brain-specific allele-biased expression, we identified
      that Trappc9, a cellular trafficking factor, was expressed predominantly
      (~70%) from the maternally inherited allele.
    explanation: >-
      Establishes the parent-of-origin expression bias on which the hypothesis
      depends.
  - reference: PMID:32877400
    reference_title: "Trappc9 deficiency causes parent-of-origin dependent microcephaly and obesity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Strikingly, heterozygous mice lacking the maternal allele (70% reduced
      expression) had pathology similar to homozygous mutants, whereas mice
      lacking the paternal allele (30% reduction) were phenotypically normal.
    explanation: >-
      The core prediction demonstrated in vivo: monoallelic maternal loss is
      sufficient for the phenotype.
  - reference: PMID:32877400
    reference_title: "Trappc9 deficiency causes parent-of-origin dependent microcephaly and obesity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A role for Trappc9 in energy balance was further supported by increased ad
      libitum food intake in a child with TRAPPC9 deficiency.
    explanation: >-
      The only human datum bearing on the model's translational validity, and it
      concerns the metabolic rather than the cognitive arm and rests on n=1 -
      hence PARTIAL and hence the EMERGING status.

phenotypes:
- category: Neurologic
  name: Intellectual Disability
  description: >-
    The defining and universal phenotype: significantly impaired intellectual
    functioning and adaptive behaviour with onset in the developmental period.
    Severity is gene- and family-dependent rather than uniform across the class.
    The course is static (non-progressive).
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  frequency: OBLIGATE
  diagnostic: true
  evidence:
  - reference: PMID:24176302
    reference_title: "Genetics of recessive cognitive disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For autosomal recessive ID (ARID) the recurrence risk is high and, in
      populations with frequent parental consanguinity, ARID is the most common
      form of ID.
    explanation: >-
      Intellectual disability is the defining phenotype of the class by
      construction; this review states the class in those terms.
  - reference: PMID:12459588
    reference_title: "Truncating neurotrypsin mutation in autosomal recessive nonsyndromic mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 4-base pair deletion in the neuronal serine protease neurotrypsin gene
      was associated with autosomal recessive nonsyndromic mental retardation
      (MR).
    explanation: >-
      The founding report of the class, associating a biallelic lesion with
      non-syndromic intellectual disability.

- category: Neurologic
  name: Mild Intellectual Disability
  description: >-
    The mild end of the severity spectrum (IQ approximately 50-70), documented
    most clearly in the CRBN/MRT2 kindred, in which affected adults achieved
    first-grade reading at best. Mild cases are systematically under-ascertained
    in this class because they are less likely to reach clinical genetics, so
    the published severity distribution understates them.
  phenotype_term:
    preferred_term: Mild intellectual disability
    term:
      id: HP:0001256
      label: Mild intellectual disability
  subtype: MRT2
  evidence:
  - reference: PMID:15557513
    reference_title: "A mutation in a novel ATP-dependent Lon protease gene in a kindred with mild mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Previously, a disease locus was mapped for a mild type of nonsyndromic
      mental retardation (IQ between 50 and 70) to a 4.2-MB interval on
      chromosome 3p25-pter in a large kindred.
    explanation: >-
      Documents a mild-severity AR-NSID entity with an explicit IQ range.
  notes: >-
    No frequency band is assigned. Per the repo frequency-evidence guidelines,
    the severity distribution across the class cannot be quantified from a
    literature ascertained through multiplex families referred for
    moderate-to-severe intellectual disability.

- category: Neurologic
  name: Moderate Intellectual Disability
  description: >-
    Together with severe intellectual disability, the commonest reported
    severity band in the published AR-NSID literature, typified by the
    GRIK2/MRT6 and NSUN2/MRT5 pedigrees, which were reported as
    moderate-to-severe.
  phenotype_term:
    preferred_term: Moderate intellectual disability
    term:
      id: HP:0002342
      label: Moderate intellectual disability
  evidence:
  - reference: PMID:17847003
    reference_title: "A defect in the ionotropic glutamate receptor 6 gene (GRIK2) is associated with autosomal recessive mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      cosegregates with moderate-to-severe nonsyndromic autosomal recessive
      mental retardation in a large, consanguineous Iranian family
    explanation: >-
      Documents the moderate-to-severe band in a founding AR-NSID pedigree.
  - reference: PMID:22541559
    reference_title: "Mutations in NSUN2 cause autosomal-recessive intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The humans homozygous for NSUN2 mutations showed an overlapping phenotype
      consisting of moderate to severe ID and facial dysmorphism
    explanation: >-
      Second independent gene with the same moderate-to-severe band.

- category: Neurologic
  name: Severe Intellectual Disability
  description: >-
    The severe end of the spectrum, documented in the nine consanguineous
    CC2D1A/MRT3 families. Severe cases are over-represented in published AR-NSID
    cohorts because they are the ones referred for molecular study.
  phenotype_term:
    preferred_term: Severe intellectual disability
    term:
      id: HP:0010864
      label: Severe intellectual disability
  subtype: MRT3
  evidence:
  - reference: PMID:16033914
    reference_title: "The CC2D1A, a member of a new gene family with C2 domains, is involved in autosomal recessive non-syndromic mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A protein truncating mutation was identified in the gene CC2D1A in nine
      consanguineous families with severe autosomal recessive NSMR.
    explanation: >-
      Documents severe non-syndromic intellectual disability across nine
      pedigrees sharing one recessive lesion.

- category: Neurologic
  name: Global Developmental Delay
  description: >-
    The presenting phenotype in infancy and early childhood, before an IQ can be
    formally assigned. Delay is global rather than domain-selective, consistent
    with a deficit in general cortical circuit function rather than a focal
    lesion. In the CRBN kindred, developmental milestones were described as
    mildly delayed from early childhood.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:15557513
    reference_title: "A mutation in a novel ATP-dependent Lon protease gene in a kindred with mild mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Developmental milestones were mildly delayed since early childhood."
    explanation: >-
      Documents early-childhood developmental delay as the presenting feature in
      an AR-NSID kindred.
  - reference: PMID:31182824
    reference_title: "Meta-analysis and multidisciplinary consensus statement: exome sequencing is a first-tier clinical diagnostic test for individuals with neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We defined NDD as global developmental delay, intellectual disability,
      and/or autism spectrum disorder.
    explanation: >-
      Confirms that global developmental delay is the standard clinical
      presentation category under which these cases are ascertained. PARTIAL
      because the source is a definition within a diagnostic-yield
      meta-analysis, not an AR-NSID-specific phenotype series.

- category: Neurologic
  name: Impaired Literacy and Academic Attainment
  description: >-
    The functional expression of the cognitive deficit. In the well-documented
    CRBN/MRT2 kindred the highest reading ability achieved by any affected
    individual was first-grade level, and most affected adults could not write
    at all. This level of functional detail is unusual in AR-NSID reports, where
    outcome is more often summarised as an IQ band.
  phenotype_term:
    preferred_term: Functional literacy and academic attainment ceiling
  subtype: MRT2
  evidence:
  - reference: PMID:15557513
    reference_title: "A mutation in a novel ATP-dependent Lon protease gene in a kindred with mild mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The highest reading ability achieved was at the first-grade level in a
      32-year-old affected woman as assessed by the Gray Oral Reading Scale.
    explanation: >-
      Quantifies functional academic attainment in an AR-NSID cohort using a
      standardised instrument.
  - reference: PMID:15557513
    reference_title: "A mutation in a novel ATP-dependent Lon protease gene in a kindred with mild mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In five affected adult individuals, writing skills were limited to signing
      their own names.
    explanation: >-
      Further functional-outcome detail for the same cohort.
  notes: >-
    Deliberately left without an ontology `term:` binding. The obvious
    candidate, HP:0001328 Specific learning disability, is a FALSE match rather
    than merely an imprecise one: its HPO definition ends "The impairment is not
    related to a global deficiency of intelligence", which explicitly excludes
    the case described here, namely attainment limited BY global intellectual
    disability. HPO currently has no class for functional literacy or academic
    attainment in the context of global intellectual disability, so this is a
    needs-term (NTR) candidate; per the term-precision guidance, no term is
    preferred over a misleading one.

- category: Neurologic
  name: Seizures
  description: >-
    An accessory, subtype-dependent phenotype rather than a feature of the class
    as a whole. Epilepsy is markedly over-represented among people with
    intellectual disability generally (approximately ten-fold), and is
    particularly characteristic of the MBOAT7/MRT57 subtype, while explicitly
    absent in the CRBN kindred. Its presence should prompt review of whether the
    case is genuinely non-syndromic.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  subtype: MRT57
  evidence:
  - reference: PMID:27616480
    reference_title: "Mutations in MBOAT7, Encoding Lysophosphatidylinositol Acyltransferase I, Lead to Intellectual Disability Accompanied by Epilepsy and Autistic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subjects presented with ID frequently accompanied by epilepsy and autistic features."
    explanation: >-
      Documents epilepsy as a frequent accompaniment in the MBOAT7 subtype.
  - reference: PMID:27616480
    reference_title: "Mutations in MBOAT7, Encoding Lysophosphatidylinositol Acyltransferase I, Lead to Intellectual Disability Accompanied by Epilepsy and Autistic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The risk of epilepsy among individuals with intellectual disability (ID)
      is approximately ten times that of the general population.
    explanation: >-
      Provides the base-rate context for the intellectual-disability population
      within which this subtype-restricted phenotype sits.
  - reference: PMID:15557513
    reference_title: "A mutation in a novel ATP-dependent Lon protease gene in a kindred with mild mental retardation."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      None of the affected individuals had peri- or postnatal infections,
      afebrile seizures, toxic exposures, or significant head trauma.
    explanation: >-
      Explicit documented absence of seizures in a different AR-NSID subtype,
      confirming this is not a class-level phenotype.
  notes: >-
    No class-level frequency band is assigned: seizures are subtype-restricted
    (frequent in MBOAT7, explicitly absent in CRBN) and no cohort quantifies
    epilepsy across AR-NSID as a whole.

- category: Neurologic
  name: Autistic Features
  description: >-
    Autistic features occur in a subset of subtypes, notably MBOAT7/MRT57.
    Conversely their explicit absence was recorded in the CRBN/MRT2 kindred,
    illustrating that autism is a subtype-level rather than class-level feature.
  phenotype_term:
    preferred_term: Autism
    term:
      id: HP:0000717
      label: Autism
  subtype: MRT57
  evidence:
  - reference: PMID:27616480
    reference_title: "Mutations in MBOAT7, Encoding Lysophosphatidylinositol Acyltransferase I, Lead to Intellectual Disability Accompanied by Epilepsy and Autistic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subjects presented with ID frequently accompanied by epilepsy and autistic features."
    explanation: >-
      Documents autistic features in the MBOAT7 subtype.
  - reference: PMID:15557513
    reference_title: "A mutation in a novel ATP-dependent Lon protease gene in a kindred with mild mental retardation."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "There was good eye contact and no autistic features."
    explanation: >-
      Explicit documented absence of autistic features in a different AR-NSID
      subtype, confirming that this is not a class-level phenotype.

- category: Neurologic
  name: Secondary Microcephaly
  description: >-
    Postnatal-onset (acquired) microcephaly, best documented in TRAPPC9/MRT13,
    where head circumference falls across centiles after a normal birth head
    size. Variable even within a single gene, so neither its presence nor its
    absence is decisive. Explicitly absent on examination in the CRBN kindred.
  phenotype_term:
    preferred_term: Secondary microcephaly
    term:
      id: HP:0005484
      label: Secondary microcephaly
  subtype: MRT13
  evidence:
  - reference: PMID:20004763
    reference_title: "A truncating mutation of TRAPPC9 is associated with autosomal-recessive intellectual disability and postnatal microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a genetic locus for autosomal-recessive nonsyndromic
      intellectual disability associated with variable postnatal microcephaly
      through homozygosity mapping of a consanguineous Israeli Arab family.
    explanation: >-
      Establishes variable postnatal (secondary) microcephaly in the TRAPPC9
      subtype.
  - reference: PMID:20004765
    reference_title: "Identification of mutations in TRAPPC9, which encodes the NIK- and IKK-beta-binding protein, in nonsyndromic autosomal-recessive mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Microcephaly is present in some but not all affected individuals."
    explanation: >-
      Supports the incomplete penetrance. PARTIAL because the report does not
      distinguish primary from secondary microcephaly in every case.
  notes: >-
    No frequency band is assigned, and the omission is deliberate rather than an
    oversight. PMID:32877400 tallies microcephaly at 95% of reported TRAPPC9
    cases in the same sentence that gives the 52% obesity figure used to justify
    the FREQUENT band on `Obesity`, so a VERY_FREQUENT band here would be
    arithmetically available. It is withheld because that tally counts
    "microcephaly" without separating primary from secondary (postnatal) forms,
    whereas this phenotype is specifically bound to HP:0005484 Secondary
    microcephaly; the sibling PMID:20004765 item is marked PARTIAL for the same
    reason. Per the repo frequency-evidence guidelines, a band is omitted rather
    than asserted on a denominator that does not match the phenotype scored.

- category: Endocrine
  name: Obesity
  description: >-
    Obesity is a well-documented, gene-specific accompaniment of TRAPPC9/MRT13
    disease, reported in 52% of published human cases alongside microcephaly in
    95%. It is the clearest example in this entry of an accessory feature that
    is neither propagation noise nor a class-level phenotype: it is a directly
    reported finding for one subtype, and it is mechanistically anchored, since
    TRAPPC9 is highly expressed in hypothalamic regions controlling energy
    balance and the null mouse shows a marked increase in body weight. Its
    presence is a further reason MRT13 sits at the edge of the non-syndromic
    definition.
  phenotype_term:
    preferred_term: Obesity
    term:
      id: HP:0001513
      label: Obesity
  frequency: FREQUENT
  subtype: MRT13
  evidence:
  - reference: PMID:32877400
    reference_title: "Trappc9 deficiency causes parent-of-origin dependent microcephaly and obesity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In humans, both homozygous and compound heterozygous mutations in TRAPPC9
      (NIBP) associate with developmental delay, microcephaly (95% reported
      cases), and obesity (52% reported cases)
    explanation: >-
      Human case-report tally establishing obesity in TRAPPC9-related disease
      and quantifying it at 52%, which falls in the FREQUENT band (30-79%) and
      therefore supports the frequency qualifier directly rather than by
      inference.
  - reference: PMID:32877400
    reference_title: "Trappc9 deficiency causes parent-of-origin dependent microcephaly and obesity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Loss-of-function mutations in human TRAPPC9 cause a rare neurodevelopmental
      syndrome characterized by microcephaly and obesity.
    explanation: >-
      Second human-anchored statement of the same association, from the
      abstract.
  - reference: PMID:32877400
    reference_title: "Trappc9 deficiency causes parent-of-origin dependent microcephaly and obesity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      By studying Trappc9 null mice we discovered that homozygous mutant mice
      showed a reduction in brain size, exploratory activity and social memory,
      as well as a marked increase in body weight.
    explanation: >-
      Animal-model corroboration of the weight phenotype. Kept as a SEPARATE
      evidence item with evidence_source MODEL_ORGANISM so that the human
      phenotype is not resting on mouse data.
  - reference: PMID:32877400
    reference_title: "Trappc9 deficiency causes parent-of-origin dependent microcephaly and obesity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A role for Trappc9 in energy balance was further supported by increased ad
      libitum food intake in a child with TRAPPC9 deficiency.
    explanation: >-
      Suggests a hyperphagic mechanism for the weight gain. PARTIAL because it
      rests on a single child.

- category: Neurologic
  name: Cerebral White Matter Hypoplasia
  description: >-
    Mild reduction in cerebral white matter volume on MRI, reported in the
    TRAPPC9/MRT13 subtype and consistent with the axonal-connectivity defect
    seen on imaging. This is a subtle quantitative finding rather than a
    recognisable malformation, which is why it does not by itself move the case
    out of the non-syndromic category. Routine neuroimaging is reported as
    normal in other subtypes - brain MRI was normal throughout the CRBN kindred.
  phenotype_term:
    preferred_term: Aplasia/Hypoplasia of the cerebral white matter
    term:
      id: HP:0012429
      label: Aplasia/Hypoplasia of the cerebral white matter
  subtype: MRT13
  evidence:
  - reference: PMID:20004765
    reference_title: "Identification of mutations in TRAPPC9, which encodes the NIK- and IKK-beta-binding protein, in nonsyndromic autosomal-recessive mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain magnetic resonance imaging of affected individuals indicates the
      presence of mild cerebral white matter hypoplasia.
    explanation: >-
      Directly documents the white-matter imaging finding in the TRAPPC9
      subtype.
  - reference: PMID:20004763
    reference_title: "A truncating mutation of TRAPPC9 is associated with autosomal-recessive intellectual disability and postnatal microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI analysis of affected patients shows defects in axonal connectivity."
    explanation: >-
      Independent imaging correlate of the same connectivity defect.

- category: Neurologic
  name: Absence of Dysmorphism and Extra-Neural Involvement
  description: >-
    The negative phenotype that DEFINES the class and is the single most
    important discriminator from syndromic recessive intellectual disability.
    Operationally it means that expert dysmorphology and general physical
    examination find no consistent extra-neural gestalt, brain imaging is normal
    or near-normal, and metabolic screening is unremarkable. The CRBN kindred
    provides the fullest published documentation of this negative. Because
    adequacy of assessment scales with cohort size, the designation should be
    recorded as provisional (see `mechanistic_hypotheses`).
  phenotype_term:
    preferred_term: Absence of dysmorphic, malformative, and extra-neural abnormality
  diagnostic: true
  evidence:
  - reference: PMID:15557513
    reference_title: "A mutation in a novel ATP-dependent Lon protease gene in a kindred with mild mental retardation."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Detailed physical and neurologic examinations in all study participants
      did not show microcephaly, organomegaly, phakomata, spasticity, weakness,
      neuropathy, visual deficits, feeding problems, or psychiatric disorders.
    explanation: >-
      Documents the absence of extra-neural and additional neurological
      features. REFUTE is used deliberately: the evidence refutes the presence
      of dysmorphic/extra-neural abnormality, which is the definitional
      requirement for this class.
  - reference: PMID:15557513
    reference_title: "A mutation in a novel ATP-dependent Lon protease gene in a kindred with mild mental retardation."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotype does not include congenital anomalies or dysmorphic
      features.
    explanation: >-
      The explicit non-syndromic statement for an MRT-series entity.
  - reference: PMID:18452889
    reference_title: "A defect in the TUSC3 gene is associated with autosomal recessive mental retardation."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data suggest that in contrast to other genetic defects of
      glycosylation, inactivation of TUSC3 causes nonsyndromic MR
    explanation: >-
      A second gene in which the absence of the expected multisystem syndromic
      features is the reported finding.
  notes: >-
    Curated as a phenotype entry because the absence is definitional and
    diagnostically load-bearing, not incidental; the evidence items are REFUTE
    because they document the absence of the finding rather than its presence.
    Deliberately left without an ontology `term:` binding. HP:0000271
    Abnormality of the face was considered and rejected: the constellation
    asserted here also covers absent organomegaly, spasticity, weakness,
    neuropathy, visual deficits, feeding problems, and metabolic derangement,
    so a facial term would anchor only a fraction of the claim while implying
    the rest was scoped to the face. HPO has no single class for "no syndromic
    gestalt on expert examination", so this is a needs-term (NTR) candidate;
    the individual absent features are enumerated in the description and
    evidence snippets instead.

genetic:
- name: PRSS12

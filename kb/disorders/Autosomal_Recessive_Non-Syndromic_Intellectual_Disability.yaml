      regions, on the basis of human brain co-expression data.
  - reference: PMID:32877400
    reference_title: "Trappc9 deficiency causes parent-of-origin dependent microcephaly and obesity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      By studying Trappc9 null mice we discovered that homozygous mutant mice
      showed a reduction in brain size, exploratory activity and social memory,
      as well as a marked increase in body weight.
    explanation: >-
      Animal-model support that biallelic loss of an AR-NSID gene reduces brain
      size and impairs memory. PARTIAL and MODEL_ORGANISM: mouse brain size and
      social memory are proxies for the human construct.

- name: Secondary (Postnatal) Microcephaly
  biological_scale: ORGANISM
  description: >-
    An incompletely penetrant consequence in a subset of subtypes, most clearly
    TRAPPC9-related disease, in which head circumference is normal at birth and
    falls across centiles postnatally. Its variability is diagnostically
    important: because microcephaly is present in some but not all affected
    individuals even within the same gene, its absence does not exclude the
    diagnosis, and its presence does not by itself reclassify the case as
    syndromic.

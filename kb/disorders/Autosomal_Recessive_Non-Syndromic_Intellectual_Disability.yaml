    explanation: >-
      Key negative result: the AR-NSID gene set is genetically distinct from the
      polygenic architecture of normal-range intelligence.
  - reference: PMID:26912939
    reference_title: "Examining non-syndromic autosomal recessive intellectual disability (NS-ARID) genes for an enriched association with intelligence differences."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL

- name: Impaired Cortical Circuit Formation and Connectivity
  biological_scale: TISSUE
  description: >-
    Where the affected theme acts during development - vesicle trafficking,
    N-glycosylation of nascent membrane and secreted proteins, general
    transcriptional regulation - the consequence is a defect in the BUILDING of
    cortical circuitry rather than in its moment-to-moment operation. The
    recessive gene set is preferentially expressed in prenatal brain, and the
    best-characterised example, TRAPPC9, is highly expressed in postmitotic
    cortical neurons, with affected individuals showing MRI evidence of impaired
    axonal connectivity and mild cerebral white matter hypoplasia. Crucially the
    structural consequence is subtle - reduced connectivity and, in some
    subtypes, mild postnatal microcephaly - rather than a gross malformation
    such as lissencephaly or agenesis of the corpus callosum. This quantitative
    rather than qualitative structural effect is what keeps the class inside the
    non-syndromic category: routine clinical neuroimaging is usually reported as
    normal or near-normal. Note also what this node is NOT: there is no
    degenerative, ischaemic, oxidative, inflammatory, or fibrotic arm. AR-NSID
    is a mis-built circuit, not a damaged one.

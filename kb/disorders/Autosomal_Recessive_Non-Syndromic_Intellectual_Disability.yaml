      microcephaly, and various facial dysmorphisms, in an autosomal-recessive
      fashion.
    explanation: >-
      Establishes the recessive segregation and documents the microcephaly and
      dysmorphism that place this subtype at the syndromic boundary.
- name: NSUN6
  gene_term:
    preferred_term: NSUN6
    term:
      id: hgnc:23529
      label: NSUN6
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: MRT82
  notes: >-
    5-methylcytosine RNA methyltransferase and the direct sibling of the
    already-curated NSUN2 subtype (MRT5); the third NSUN-family enzyme
    implicated in neurodevelopment after NSUN2 and NSUN3. The founding
    missense allele has lost enzymatic activity and cannot bind the methyl
    donor S-adenosyl-L-methionine.
  evidence:
  - reference: PMID:37226891
    reference_title: "Biallelic variants in NSUN6 cause an autosomal recessive neurodevelopmental disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data provide evidence that biallelic pathogenic variants in NSUN6
      cause one form of autosomal recessive intellectual disability,
      establishing another link between RNA modification and cognition.
    explanation: >-
      Establishes NSUN6 as causal for a form of autosomal recessive
      intellectual disability.
- name: KICS2
  gene_term:
    preferred_term: KICS2
    term:
      id: hgnc:26517
      label: KICS2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: MRT83
  notes: >-
    One of four subunits of the KICSTOR complex that recruits GATOR1 to the
    lysosome for nutrient-dependent mTORC1 regulation on amino-acid
    deprivation. Pathogenic variants in two other subunits, SZT2 and KPTN,
    were already associated with autosomal recessive intellectual disability
    and epileptic encephalopathy.
  evidence:
  - reference: PMID:39824192
    reference_title: "Bi-allelic KICS2 mutations impair KICSTOR complex-mediated mTORC1 regulation, causing intellectual disability and epilepsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified bi-allelic KICS2 variants in eleven affected individuals
      presenting with intellectual disability and epilepsy.
    explanation: >-
      Establishes the KICS2 subtype, its cohort size, and the accompanying
      epilepsy.
- name: Homozygous copy-number variants
  gene_term:
    preferred_term: TUSC3
    term:
      id: hgnc:30242
      label: TUSC3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Not a distinct gene but a distinct LESION CLASS that cuts across genes:
    homozygous intragenic and whole-gene deletions are a recurrent cause in this
    disease class (TUSC3 is the archetype), and copy-number variants accounted
    for 14% of solved cases in a large consanguineous intellectual-disability
    cohort. This is the reason chromosomal microarray retains a place in the
    workup even where recessive point mutation is the expected mechanism.
  evidence:
  - reference: PMID:27431290
    reference_title: "Clinical genomics expands the morbid genome of intellectual disability and offers a high diagnostic yield."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These included copy number variants in 14% (n=54, 15% are novel), and
      point mutations revealed by multi-gene panel and exome sequencing in the
      remaining 43% (1% were found to have Fragile-X).
    explanation: >-
      Quantifies the copy-number share of solved cases in a highly
      consanguineous intellectual-disability cohort.
  - reference: PMID:18452889
    reference_title: "A defect in the TUSC3 gene is associated with autosomal recessive mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Haplotype analyses and copy-number studies led to the identification of a
      homozygous deletion partly removing TUSC3 (N33) in all patients.
    explanation: >-
      The archetypal homozygous-deletion lesion within this disease class.

diagnosis:
- name: Exome or Genome Sequencing with Autozygosity Mapping
  description: >-
    Exome (increasingly genome) sequencing is the definitive diagnostic modality
    and is recommended as a first-tier test for unexplained neurodevelopmental
    disorders. Because there are no prevalent ARID genes, pathways, or protein
    complexes, targeted gene selection is explicitly not justified - broad
    sequencing rather than a small panel is the correct first step. In
    consanguineous families the yield is substantially raised by combining
    sequencing with homozygosity-by-descent mapping from SNP genotyping:
    filtering candidate variants to those inside runs of homozygosity shared by
    all affected siblings converts an unmanageable variant list into a short
    one. Trio or family-based testing remains valuable, because de novo dominant
    lesions occur in consanguineous families too and a homozygosity-only
    filtering strategy will miss them.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:30459488
    reference_title: "Genetics of autosomal recessive intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, in a regular case, there is no reasoning for picking a few genes for
      a first diagnostic step, and a genetic diagnosis of ID in general, and
      ARID specifically, is better made using large panels or exome sequencing.
    explanation: >-
      The explicit recommendation against targeted gene selection in this
      disease class, and for broad sequencing instead.
  - reference: PMID:31182824
    reference_title: "Meta-analysis and multidisciplinary consensus statement: exome sequencing is a first-tier clinical diagnostic test for individuals with neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our review demonstrates that ES consistently outperforms CMA for
      evaluation of unexplained NDDs. We propose a diagnostic algorithm placing
      ES at the beginning of the evaluation of unexplained NDDs.
    explanation: >-
      Consensus recommendation placing exome sequencing first-tier for
      unexplained neurodevelopmental disorders.
  - reference: PMID:31182824
    reference_title: "Meta-analysis and multidisciplinary consensus statement: exome sequencing is a first-tier clinical diagnostic test for individuals with neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Yield of ES was 36% overall, 31% for isolated NDD, and 53% for the NDD
      plus associated conditions.
    explanation: >-
      Quantifies yield, including the ISOLATED (non-syndromic) figure of 31%
      that is most relevant here and is notably LOWER than for syndromic cases.
      PARTIAL because the meta-analysis is not restricted to consanguineous or
      recessive cases.
  - reference: PMID:28397838
    reference_title: "Mapping autosomal recessive intellectual disability: combined microarray and exome sequencing identifies 26 novel candidate genes in 192 consanguineous families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we combined microarray genotyping, homozygosity-by-descent (HBD)
      mapping, copy number variation (CNV) analysis, and whole exome sequencing
      (WES) to identify disease genes/mutations in 192 multiplex Pakistani and
      Iranian consanguineous families with non-syndromic ID.
    explanation: >-
      Describes the combined HBD-mapping plus exome strategy specific to this
      disease class.
  - reference: PMID:28397838
    reference_title: "Mapping autosomal recessive intellectual disability: combined microarray and exome sequencing identifies 26 novel candidate genes in 192 consanguineous families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The high yield of AR mutations for ID indicated that this approach has
      excellent clinical potential and should inform clinical diagnostics,
      including clinical whole exome and genome sequencing, for populations in
      which consanguinity is common.
    explanation: >-
      Explicit clinical-diagnostic recommendation for the consanguineous
      setting.
  - reference: PMID:27431290
    reference_title: "Clinical genomics expands the morbid genome of intellectual disability and offers a high diagnostic yield."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Standard clinical evaluation suggested a diagnosis in 16% of cases
      (54/337) but only 70% of these (38/54) were subsequently confirmed. On the
      other hand, the genomic approach revealed a likely diagnosis in 58%
      (n=196).
    explanation: >-
      Head-to-head demonstration that genomics-first massively outperforms
      standard clinical evaluation in a highly consanguineous cohort - the
      strongest single argument for sequencing-first in this population.
  - reference: PMID:27431290
    reference_title: "Clinical genomics expands the morbid genome of intellectual disability and offers a high diagnostic yield."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When applied directly on all cases with negative molecular karyotyping,
      the diagnostic yield of exome sequencing was 60% (77/129).
    explanation: >-
      Quantifies exome yield after a negative microarray in the consanguineous
      setting.
  - reference: PMID:28097321
    reference_title: "Diagnostic Yield and Novel Candidate Genes by Exome Sequencing in 152 Consanguineous Families With Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of these, a clear clinical genetic diagnosis was made in 56 families
      (36.8%) owing to 57 (likely) pathogenic variants in 50 genes already
      established in neurodevelopmental disorders (46 autosomal recessive, 2
      X-linked, and 2 de novo) or in 7 previously proposed recessive candidates.
    explanation: >-
      Diagnostic yield in consanguineous families, with the recessive share of
      solved cases quantified and de novo dominant cases still present.

- name: Chromosomal Microarray
  description: >-
    Chromosomal microarray remains a standard early test for unexplained
    developmental delay or intellectual disability and is not made redundant by
    sequencing in this class: several AR-NSID lesions are homozygous deletions
    (TUSC3 is the archetype) that a copy-number-naive exome pipeline can miss,
    copy-number variants accounted for 14% of solved cases in a large
    consanguineous cohort, and in consanguineous families the array
    simultaneously supplies the genome-wide homozygosity map used to prioritise
    sequence variants.
  diagnosis_term:
    preferred_term: chromosomal microarray
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:20466091
    reference_title: "Consensus statement: chromosomal microarray is a first-tier clinical diagnostic test for individuals with developmental disabilities or congenital anomalies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Available evidence strongly supports the use of CMA in place of G-banded
      karyotyping as the first-tier cytogenetic diagnostic test for patients
      with DD/ID, ASD, or MCA.
    explanation: >-
      Establishes chromosomal microarray as the first-tier cytogenetic test in
      this clinical population.
  - reference: PMID:27431290
    reference_title: "Clinical genomics expands the morbid genome of intellectual disability and offers a high diagnostic yield."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These included copy number variants in 14% (n=54, 15% are novel), and
      point mutations revealed by multi-gene panel and exome sequencing in the
      remaining 43% (1% were found to have Fragile-X).
    explanation: >-
      Quantifies the copy-number contribution that justifies retaining
      microarray alongside sequencing.
  - reference: PMID:18452889
    reference_title: "A defect in the TUSC3 gene is associated with autosomal recessive mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Haplotype analyses and copy-number studies led to the identification of a
      homozygous deletion partly removing TUSC3 (N33) in all patients.
    explanation: >-
      Worked example of an AR-NSID lesion that is a homozygous deletion,
      requiring copy-number analysis to detect.

- name: Exclusion of Recognised Syndromic, Metabolic, and Treatable Causes
  description: >-
    A non-syndromic designation is a diagnosis of exclusion and requires expert
    dysmorphology assessment plus exclusion of recognised aetiologies (fragile
    X, chromosomal disorders, congenital infection, prenatal exposures, acquired
    perinatal injury, and inborn errors of metabolism). This is not merely
    nosological housekeeping: exome sequencing in consanguineous
    intellectual-disability cohorts uncovers TREATABLE inborn errors of
    metabolism in a small but clinically decisive minority, so a case
    provisionally labelled non-syndromic must not bypass metabolic evaluation.
    Developmental regression, in particular, argues against this diagnosis and
    toward a degenerative or metabolic alternative.
  diagnosis_term:
    preferred_term: disease screening
    term:
      id: NCIT:C15419
      label: Disease Screening
  evidence:
  - reference: PMID:28097321
    reference_title: "Diagnostic Yield and Novel Candidate Genes by Exome Sequencing in 152 Consanguineous Families With Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 5 of these families, potentially treatable disorders were diagnosed
      (mutations in PAH, CBS, MTHFR, CYP27A1, and HIBCH), and in 1 family, 2
      disease-causing homozygous variants in different genes were identified.
    explanation: >-
      Directly documents treatable metabolic disorders surfacing within a
      consanguineous intellectual-disability cohort - the clinical reason this
      exclusion step matters.
  - reference: PMID:15557513
    reference_title: "A mutation in a novel ATP-dependent Lon protease gene in a kindred with mild mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected individuals had normal laboratory studies on the following: MRI
      of the brain, high-resolution (ISCN G-banding 550 resolution) cytogenetic
      studies, DNA testing for a CCG repeat expansion in fragile X, fasting
      plasma amino acids, urine amino acids and organic acids, pyruvate,
      lactate, and ammonia.
    explanation: >-
      Specifies the exclusion workup that operationally assigns a family to the
      non-syndromic category.
  - reference: PMID:15557513
    reference_title: "A mutation in a novel ATP-dependent Lon protease gene in a kindred with mild mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All individuals had normal newborn screening examinations for
      hypothyroidism, galactosemia, maple syrup urine disease, phenylketonuria,
      and biotinidase.
    explanation: >-
      Documents the metabolic exclusions performed before assigning a
      non-syndromic recessive label.
  - reference: PMID:27431290
    reference_title: "Clinical genomics expands the morbid genome of intellectual disability and offers a high diagnostic yield."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Standard clinical evaluation suggested a diagnosis in 16% of cases
      (54/337) but only 70% of these (38/54) were subsequently confirmed.
    explanation: >-
      Important caveat on the exclusion step: clinical impression alone is
      unreliable, so exclusion should be evidence-based rather than
      gestalt-based. PARTIAL because it bears on the reliability of the step
      rather than on the step's content.

treatments:
- name: Genetic Counselling and Recurrence-Risk Assessment
  description: >-
    The highest-value intervention in this class, and the point at which it
    differs most sharply from the dominant class. Once biallelic causation is
    confirmed, sibling recurrence risk is 25% and carrier testing can be offered
    to at-risk relatives; in consanguineous kindreds where the allele is
    identical by descent, extended-family cascade testing and preconception or
    prenatal testing become possible. Counselling must be delivered with care
    for the cultural context in which consanguineous marriage occurs; the
    objective is informed reproductive choice. Two technical caveats: where
    multi-locus (oligogenic) causation is present, single-locus recurrence
    figures may be wrong; and for a gene with parent-of-origin expression bias
    the standard 25% figure may not apply.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:17718851
    reference_title: "Genetics of autosomal recessive non-syndromic mental retardation: recent advances."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The future objective will be the development of diagnostic kits for
      molecular diagnosis in mentally retarded individuals in order to offer
      at-risk families pre-natal diagnosis to detect affected offspring.
    explanation: >-
      States the counselling and prenatal-diagnosis rationale that molecular
      diagnosis in this class enables.
  - reference: PMID:24176302
    reference_title: "Genetics of recessive cognitive disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For autosomal recessive ID (ARID) the recurrence risk is high and, in
      populations with frequent parental consanguinity, ARID is the most common
      form of ID.
    explanation: >-
      Establishes the high recurrence risk that makes counselling the primary
      actionable output of diagnosis.
  - reference: PMID:24176302
    reference_title: "Genetics of recessive cognitive disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we review recent progress in this field, show that ARID is not rare
      even in outbred Western populations, and discuss the prospects for
      improving its diagnosis and prevention.
    explanation: >-
      Frames diagnosis-enabled prevention as the field's stated objective for
      this disease class.
  - reference: PMID:18452889
    reference_title: "A defect in the TUSC3 gene is associated with autosomal recessive mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All obligate carriers of this family were heterozygous, but none of 192
      unrelated healthy individuals from the same population carried this
      deletion.
    explanation: >-
      Supports the counselling message that heterozygous carriers, including
      both parents, are unaffected.
  - reference: PMID:27457812
    reference_title: "Exome sequencing of Pakistani consanguineous families identifies 30 novel candidate genes for recessive intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In another eight families segregation of multiple pathogenic variants was
      observed, affecting 19 genes that were either known or are novel
      candidates for ID.
    explanation: >-
      Supports the multi-locus counselling caveat. PARTIAL because the report
      documents multi-locus segregation but does not quantify its effect on
      recurrence risk.

- name: Early Intervention, Rehabilitation, and Special Education
  description: >-
    No disease-modifying therapy exists for any AR-NSID subtype. Management is
    the standard, non-gene-specific developmental package: early intervention
    services, individualised special education, and habilitative therapies,
    directed at maximising adaptive function rather than altering the underlying
    lesion. The functional-outcome data available for this class (for example
    reading limited to first-grade level in the CRBN kindred) underline how much
    is at stake in delivering this well.
  treatment_term:
    preferred_term: early intervention and special education
    term:
      id: NCIT:C15315
      label: Rehabilitation
  therapeutic_modality: BEHAVIORAL
  target_phenotypes:
  - preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  - preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:26503795
    reference_title: "Genetic studies in intellectual disability and related disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This approach has provided novel insights into the biological pathways
      underlying ID, improved the diagnostic process and offered new targets for
      therapy.
    explanation: >-
      Supports the framing that therapy for intellectual disability remains
      prospective - genetics has provided TARGETS, not treatments. PARTIAL
      because the review does not evaluate educational or rehabilitative
      interventions.
  - reference: PMID:15557513
    reference_title: "A mutation in a novel ATP-dependent Lon protease gene in a kindred with mild mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In five affected adult individuals, writing skills were limited to signing
      their own names.
    explanation: >-
      Documents the adult functional attainment that educational and
      habilitative intervention aims to improve.

- name: Speech and Language Therapy
  description: >-
    Directed at the delayed speech and language development that accompanies
    global developmental delay in this class. Symptomatic, with no
    subtype-specific modification.
  treatment_term:
    preferred_term: speech therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  therapeutic_modality: BEHAVIORAL
  target_phenotypes:
  - preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:15557513
    reference_title: "A mutation in a novel ATP-dependent Lon protease gene in a kindred with mild mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Developmental milestones were mildly delayed since early childhood."
    explanation: >-
      Establishes the developmental delay that speech and language therapy
      addresses. PARTIAL because the source documents the indication, not the
      efficacy of the intervention.

- name: Antiseizure Pharmacotherapy for Comorbid Epilepsy
  description: >-
    Indicated only for the subset of subtypes in which seizures occur, most
    clearly MBOAT7/MRT57. Choice of agent follows standard epilepsy practice; no
    AR-NSID subtype has an established gene-directed antiseizure strategy, so
    the agent is recorded at drug-class rather than individual-drug granularity.
  treatment_term:
    preferred_term: anticonvulsant therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
    therapeutic_agent:
    - preferred_term: anticonvulsant agent
      term:
        id: NCIT:C264
        label: Anticonvulsant Agent
  therapeutic_modality: SMALL_MOLECULE
  target_phenotypes:
  - preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:27616480
    reference_title: "Mutations in MBOAT7, Encoding Lysophosphatidylinositol Acyltransferase I, Lead to Intellectual Disability Accompanied by Epilepsy and Autistic Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subjects presented with ID frequently accompanied by epilepsy and autistic features."
    explanation: >-
      Establishes the epilepsy indication in this subtype. PARTIAL because the
      report documents the phenotype, not antiseizure treatment response.

- name: PDE4 Inhibition in CC2D1A-Related Disease (preclinical)
  description: >-
    The single mechanism-targeted therapeutic lead in this disease class, and
    PRECLINICAL ONLY - no human data exist and it must not be presented as a
    therapy. In Cc2d1a-deficient mice, loss of the CC2D1A restraint on PDE4D
    causes PDE4D hyperactivity, hippocampal cAMP depletion, and reduced CREB
    signalling; a PDE4 inhibitor restores spatial memory. Two hard caveats: the
    rescue is MALE-SPECIFIC (the underlying molecular deficit is absent in
    female mice, and the inhibitor has no effect in them), and the rescued
    readout is rodent spatial memory rather than the human cognitive construct.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rolipram
      term:
        id: CHEBI:104872
        label: rolipram
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Impaired Synaptic Transmission and Plasticity
    treatment_effect: INHIBITS
    description: >-
      PDE4 inhibition restores hippocampal cAMP/CREB signalling that is depleted
      by PDE4D hyperactivity in CC2D1A deficiency, targeting the synaptic
      plasticity node rather than the upstream genetic lesion.
    evidence:
    - reference: PMID:30732858
      reference_title: "Male-Specific cAMP Signaling in the Hippocampus Controls Spatial Memory Deficits in a Mouse Model of Autism and Intellectual Disability."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Restoring PDE4D activity using an inhibitor rescues cognitive deficits
        in male mice but has no effect on female mice.
      explanation: >-
        Demonstrates target engagement at the plasticity node with cognitive
        rescue. PARTIAL and MODEL_ORGANISM: mouse only, and male-specific.
  evidence:
  - reference: PMID:30732858
    reference_title: "Male-Specific cAMP Signaling in the Hippocampus Controls Spatial Memory Deficits in a Mouse Model of Autism and Intellectual Disability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that in Cc2d1a-deficient male mice PDE4D is hyperactive, leading
      to a reduction in cAMP response element binding protein signaling, but
      this molecular deficit is not present in female mice.
    explanation: >-
      Establishes the drug target and the sex restriction. PARTIAL and
      MODEL_ORGANISM because the entire result is in mice.
  - reference: PMID:30732858
    reference_title: "Male-Specific cAMP Signaling in the Hippocampus Controls Spatial Memory Deficits in a Mouse Model of Autism and Intellectual Disability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cc2d1a-deficient male mice show a deficit in spatial memory, which is not
      present in Cc2d1a-deficient female mice.
    explanation: >-
      The rescued phenotype is itself sex-restricted in the model, compounding
      the translational uncertainty.
  notes: >-
    Curated deliberately as an explicitly preclinical entry rather than omitted,
    because it is the only druggable-mechanism lead in the class and because the
    male-specific effect is a translational caveat that should be recorded
    rather than lost. See the `arnsid_model_translational_validity` discussion.

- name: Disease-Specific Metabolic Therapy After Reclassification
  description: >-
    Initiate the specific metabolic therapy - dietary restriction, cofactor or
    vitamin supplementation, or substrate-lowering pharmacotherapy as dictated
    by the gene - in any child whose provisional AR-NSID label is overturned by
    sequencing in favour of a treatable inborn error of metabolism. In a large
    consanguineous cohort this applied to 5 of 152 families (PAH, CBS, MTHFR,
    CYP27A1, HIBCH). The therapy is disease-modifying for those children, which
    is what distinguishes this from every other entry in this section: AR-NSID
    proper has no disease-modifying treatment, so the single largest
    therapeutic gain available in this clinical population comes from correctly
    identifying the minority who do not actually have it. The complementary
    diagnostic step is curated under `diagnosis` as "Exclusion of Recognised
    Syndromic, Metabolic, and Treatable Causes"; this entry records the
    therapeutic action that follows.
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:28097321
    reference_title: "Diagnostic Yield and Novel Candidate Genes by Exome Sequencing in 152 Consanguineous Families With Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 5 of these families, potentially treatable disorders were diagnosed
      (mutations in PAH, CBS, MTHFR, CYP27A1, and HIBCH), and in 1 family, 2
      disease-causing homozygous variants in different genes were identified.
    explanation: >-
      Direct evidence that treatable metabolic disorders are found within
      cohorts ascertained as recessive intellectual disability, and therefore
      that this therapeutic action has a real indication in this population.
  notes: >-
    The treatment term is necessarily generic because the therapy is
    gene-specific and heterogeneous (low-phenylalanine diet for PAH, betaine
    for CBS, chenodeoxycholic acid for CYP27A1, and others); Dietary
    Intervention is the closest single NCIT clinical action covering the
    commonest members. Each specific therapy properly belongs to the individual
    metabolic-disease entry rather than here. This entry is retained in
    `treatments` rather than `diagnosis` because the asserted action is
    therapeutic; the diagnostic counterpart is curated separately under
    `diagnosis`.

differential_diagnoses:
- name: Autosomal Dominant Non-Syndromic Intellectual Disability
  description: >-
    The sibling class and the principal differential in a simplex case. Both
    present as isolated intellectual disability without a syndromic gestalt, and
    the two cannot be distinguished clinically - only by the molecular result
    and the pedigree. Distinguishing them matters enormously for counselling:
    recurrence risk is 25% for recessive versus low (mosaicism-limited) for a de
    novo dominant lesion.
  disease_term:
    preferred_term: autosomal dominant non-syndromic intellectual disability
    term:
      id: MONDO:0015802
      label: autosomal dominant non-syndromic intellectual disability
  distinguishing_features:
  - Dominant cases are typically simplex with a heterozygous de novo variant in a constraint-intolerant gene and no consanguinity.
  - Recessive cases are more often multiplex with affected siblings, homozygous variants inside a run of homozygosity, and frequently consanguineous parents.
  - Only trio or family-based molecular testing resolves the two; de novo dominant lesions also occur within consanguineous families, so a consanguineous pedigree does not settle the question.
  evidence:
  - reference: PMID:29302074
    reference_title: "Genetics of intellectual disability in consanguineous families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Yet, compared to autosomal dominant de novo mutations, which are the
      predominant cause of ID in Western countries, the identification of AR-ID
      genes has lagged behind.
    explanation: >-
      States the population-dependent split between the recessive and de novo
      dominant classes that drives the differential.
  - reference: PMID:28097321
    reference_title: "Diagnostic Yield and Novel Candidate Genes by Exome Sequencing in 152 Consanguineous Families With Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      50 genes already established in neurodevelopmental disorders (46 autosomal
      recessive, 2 X-linked, and 2 de novo)
    explanation: >-
      Shows de novo dominant diagnoses arising inside a consanguineous cohort -
      the practical reason a recessive assumption must not be allowed to filter
      them out.

- name: Syndromic Intellectual Disability
  description: >-
    Any recognised syndrome in which intellectual disability is accompanied by a
    characteristic pattern of dysmorphic, malformative, metabolic, or
    neuroimaging features. The boundary is genuinely unstable in this class:
    several MRT-series genes (NSUN2, MAN1B1, ADAT3) have been reclassified as
    syndromic once larger series were phenotyped, and the class review notes
    that many ARID genes are pleiotropic with broad phenotypic spectra. A
    non-syndromic label assigned on a small cohort should be treated as
    provisional.
  distinguishing_features:
  - Presence of a consistent extra-neural gestalt on expert dysmorphology examination.
  - A recognisable neuroimaging malformation rather than subtle volume or connectivity change.
  - A diagnostic metabolic or biochemical abnormality.
  - Absence of all of these on adequate assessment defines the non-syndromic category, but adequacy of assessment scales with cohort size and follow-up duration.
  evidence:
  - reference: PMID:30459488
    reference_title: "Genetics of autosomal recessive intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, in the last few months, evidence has been growing that many
      ARID genes are pleiotropic and that the resulting phenotypes may have a
      broad spectrum.
    explanation: >-
      Class-level statement that the syndromic/non-syndromic boundary is
      unreliable for recessive intellectual-disability genes.
  - reference: PMID:26842963
    reference_title: "ADAT3-related intellectual disability: Further delineation of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ADAT3-related intellectual disability is an important recognizable cause
      of intellectual disability in Arabia.
    explanation: >-
      Worked example of a recessive intellectual-disability gene becoming a
      recognisable (syndromic) entity after further phenotyping.
  - reference: PMID:22541559
    reference_title: "Mutations in NSUN2 cause autosomal-recessive intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      suggesting that mutations in this gene might even induce a syndromic form
      of ID
    explanation: >-
      Shows the same boundary problem raised prospectively by the discovering
      authors.

- name: Treatable Inborn Errors of Metabolism
  description: >-
    Metabolic disorders such as phenylketonuria, homocystinuria, MTHFR
    deficiency, cerebrotendinous xanthomatosis, and HIBCH deficiency are
    themselves autosomal recessive and are enriched in exactly the same
    consanguineous populations. When mild or late-treated they can present as
    apparently isolated intellectual disability. This is the one part of the
    differential where the distinction changes management immediately.
  distinguishing_features:
  - Diagnostic biochemical abnormality on plasma amino acids, urine organic acids, homocysteine, acylcarnitines, or sterol profiling.
  - Often a history of episodic decompensation or a progressive rather than static course.
  - A specific dietary or pharmacological treatment exists, so the distinction is management-changing.
  - Newborn screening excludes several but is not universally available in the populations where AR-NSID is concentrated.
  evidence:
  - reference: PMID:28097321
    reference_title: "Diagnostic Yield and Novel Candidate Genes by Exome Sequencing in 152 Consanguineous Families With Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 5 of these families, potentially treatable disorders were diagnosed
      (mutations in PAH, CBS, MTHFR, CYP27A1, and HIBCH), and in 1 family, 2
      disease-causing homozygous variants in different genes were identified.
    explanation: >-
      Quantifies how often treatable metabolic disease is found in cohorts
      ascertained as recessive intellectual disability.
  - reference: PMID:15557513
    reference_title: "A mutation in a novel ATP-dependent Lon protease gene in a kindred with mild mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All individuals had normal newborn screening examinations for
      hypothyroidism, galactosemia, maple syrup urine disease, phenylketonuria,
      and biotinidase.
    explanation: >-
      Illustrates the metabolic exclusions performed before assigning a
      non-syndromic recessive label.

- name: X-Linked Intellectual Disability
  description: >-
    The historically better-characterised class of inherited non-syndromic
    intellectual disability, with more than 90 genes known well before the
    autosomal recessive class was opened up. In a family with affected males
    only, X-linkage and autosomal recessive inheritance can be
    indistinguishable on the pedigree, and fragile X remains a mandatory
    exclusion.
  distinguishing_features:
  - Male-only affectation with transmission through unaffected carrier females and absence of male-to-male transmission favours X-linkage.
  - Affected siblings of both sexes with consanguineous parents favours autosomal recessive inheritance.
  - Large consanguineous cohort studies still recover X-linked genes alongside autosomal recessive ones, so an assumption of autosomal recessive inheritance should not restrict variant filtering.
  - FMR1 repeat testing is a standard first-tier exclusion regardless of pedigree structure.
  evidence:
  - reference: PMID:21937992
    reference_title: "Deep sequencing reveals 50 novel genes for recessive cognitive disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More than 90 different gene defects have been identified for
      X-chromosome-linked intellectual disability alone, but research into the
      more frequent autosomal forms of intellectual disability is still in its
      infancy.
    explanation: >-
      Establishes the relative maturity of the X-linked class and the size of
      its gene set.
  - reference: PMID:29302074
    reference_title: "Genetics of intellectual disability in consanguineous families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 219 of these, we found likely causative variants, involving 77 known
      and 77 novel AR-ID (candidate) genes, 21 X-linked genes, as well as 9
      genes previously implicated in diseases other than ID.
    explanation: >-
      Shows X-linked genes being recovered within a consanguineous cohort
      ascertained for recessive disease - the practical reason not to pre-filter
      on inheritance mode.

- name: Progressive or Degenerative Neurological Disease
  description: >-
    Neurodegenerative and neurometabolic disorders can present in early
    childhood with apparent developmental delay before the progressive nature is
    evident. Because AR-NSID is a static developmental encephalopathy - a
    mis-built rather than a damaged circuit, with no degenerative, ischaemic, or
    inflammatory arm - loss of previously acquired skills is the single
    cleanest discriminator against this diagnosis.
  distinguishing_features:
  - Developmental regression (loss of acquired skills) effectively excludes AR-NSID.
  - Progressive neurological signs, evolving neuroimaging abnormality, or a deteriorating clinical course argue for a degenerative alternative.
  - In AR-NSID the gap versus peers widens with age because the developmental trajectory is shallower, not because skills are lost.
  evidence:
  - reference: PMID:15557513
    reference_title: "A mutation in a novel ATP-dependent Lon protease gene in a kindred with mild mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Detailed physical and neurologic examinations in all study participants
      did not show microcephaly, organomegaly, phakomata, spasticity, weakness,
      neuropathy, visual deficits, feeding problems, or psychiatric disorders.
    explanation: >-
      Documents the absence of the progressive neurological signs that would
      point to a degenerative alternative, in the best-characterised AR-NSID
      kindred.

- name: Al-Raqad Syndrome (DCPS)
  description: >-
    A named recessive syndrome caused by biallelic DCPS variants, and a
    differential rather than a member of this class. DCPS is the scavenger
    decapping enzyme acting in the last step of the 3' to 5' mRNA decay
    pathway - the counterpart of EDC3 (MRT50), which is curated here as a
    subtype - so the two share a discovery report and a theme but not a
    category: the DCPS report describes a syndrome with craniofacial anomalies
    and neuromuscular defects alongside the intellectual disability, which is
    the constellation whose presence disqualifies a case from the
    non-syndromic label. MONDO nevertheless files MONDO:0014648 as a direct
    child of MONDO:0019502; this entry records the disagreement rather than
    importing the concept.
  disease_term:
    preferred_term: Al-Raqad syndrome
    term:
      id: MONDO:0014648
      label: Al-Raqad syndrome
  distinguishing_features:
  - Craniofacial anomalies present, which the non-syndromic category excludes.
  - Neuromuscular involvement present, which the non-syndromic category excludes.
  - Named as a syndrome (Al-Raqad) in its own founding report, not as a numbered MRT locus.
  evidence:
  - reference: PMID:25712129
    reference_title: "Loss of the scavenger mRNA decapping enzyme DCPS causes syndromic intellectual disability with neuromuscular defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified a DCPS pathogenic mutation in a large family with
      three affected individuals presenting with a novel recessive syndrome
      consisting of craniofacial anomalies, intellectual disability and
      neuromuscular defects.
    explanation: >-
      The founding report describes DCPS disease as a syndrome with
      craniofacial and neuromuscular features, which is why it is a
      differential rather than a subtype of this non-syndromic class.

- name: Intellectual Developmental Disorder, Autosomal Recessive 75 (PIDD1)
  description: >-
    Biallelic PIDD1 variants cause a neurodevelopmental disorder whose
    defining feature is a cortical malformation: a typical
    anterior-predominant pachygyria closely resembling the neuroimaging
    pattern of CRADD-related disease (MRT34), its PIDDosome partner. A
    recognisable neuroimaging malformation is one of the explicit
    disqualifiers for the non-syndromic category, and MONDO's own label for
    the class names variant lissencephaly, so this belongs with the
    malformation-of-cortical-development entities rather than here -
    notwithstanding that earlier PIDD1 families had been described as
    apparently non-syndromic, which is presumably how MONDO:0030785 came to
    sit under MONDO:0019502.
  disease_term:
    preferred_term: intellectual developmental disorder, autosomal recessive 75, with neuropsychiatric features and variant lissencephaly
    term:
      id: MONDO:0030785
      label: intellectual developmental disorder, autosomal recessive 75, with neuropsychiatric features and variant lissencephaly
  distinguishing_features:
  - Anterior-predominant pachygyria on neuroimaging, a gross cortical malformation rather than the subtle connectivity change this class permits.
  - Grouped mechanistically with CRADD-related disease through the PIDD1/CRADD/caspase-2 PIDDosome rather than with the MRT-series themes.
  - The earlier apparently non-syndromic description was superseded once systematic neuroradiology was applied to a larger cohort.
  evidence:
  - reference: PMID:34163010
    reference_title: "Pathogenic variants in PIDD1 lead to an autosomal recessive neurodevelopmental disorder with pachygyria and psychiatric features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in eleven subjects displaying intellectual disability, behaviorial and
      psychiatric features, and a typical anterior-predominant pachygyria,
      remarkably resembling the CRADD-related neuroimaging pattern.
    explanation: >-
      Establishes the cortical malformation that disqualifies PIDD1 disease
      from the non-syndromic category.
  - reference: PMID:34163010
    reference_title: "Pathogenic variants in PIDD1 lead to an autosomal recessive neurodevelopmental disorder with pachygyria and psychiatric features."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More recently, biallelic pathogenic variants in PIDD1 have been
      described in a few families with apparently nonsydnromic intellectual
      disability.
    explanation: >-
      Records the earlier apparently non-syndromic description, the most
      likely reason MONDO files this class under the non-syndromic parent.

- name: Intellectual Developmental Disorder, Autosomal Recessive 81 (ASCC3)
  description: >-
    Biallelic ASCC3 variants cause a neuromuscular syndrome rather than
    isolated cognitive impairment. ASCC3 is a DNA helicase subunit of the
    four-part ASC-1 transcriptional cointegrator complex whose siblings ASCC1
    and TRIP4 cause spinal muscular atrophy with congenital bone fractures,
    and the reported phenotype spans severe developmental delay to muscle
    fatigue with a genotype-phenotype correlation. A neuromuscular disease
    family, not a member of a class defined by isolated intellectual
    disability; MONDO files MONDO:0958204 under MONDO:0019502 nonetheless.
  disease_term:
    preferred_term: intellectual developmental disorder, autosomal recessive 81
    term:
      id: MONDO:0958204
      label: intellectual developmental disorder, autosomal recessive 81
  distinguishing_features:
  - Neuromuscular involvement is the defining feature, not an accessory one.
  - Complex-level allelism with the spinal muscular atrophy with congenital bone fractures genes ASCC1 and TRIP4.
  - Biallelic loss of function appears not to be compatible with life, unlike the loss-of-function mechanism typical of this class.
  evidence:
  - reference: PMID:35047834
    reference_title: "Discovery of a neuromuscular syndrome caused by biallelic variants in ASCC3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report the discovery of ASCC3 as the cause of a neuromuscular
      syndrome in seven unreported individuals from six unrelated families and
      updates on the one previously reported family.
    explanation: >-
      The founding cohort report characterises ASCC3 disease as a
      neuromuscular syndrome, placing it outside this non-syndromic class.
  - reference: PMID:35047834
    reference_title: "Discovery of a neuromuscular syndrome caused by biallelic variants in ASCC3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All the individuals share a neurologic phenotype that ranges from severe
      developmental delay to muscle fatigue.
    explanation: >-
      Documents the neuromuscular range of the shared phenotype.

- name: Intellectual Developmental Disorder, Autosomal Recessive 77 (CEP104)
  description: >-
    Biallelic CEP104 variants cause a ciliopathy. CEP104 is already curated in
    this knowledge base as a causative gene of Joubert syndrome, and the
    report that implicates it in intellectual disability does so alongside
    CEP290 as ciliary genes in families with other ciliopathy-associated
    features, emphasising pleiotropy. The lump/split call is therefore to keep
    CEP104 with the ciliopathy entry that already models its mechanism rather
    than to duplicate the gene as an MRT subtype here.
  disease_term:
    preferred_term: intellectual developmental disorder, autosomal recessive 77
    term:
      id: MONDO:0031031
      label: intellectual developmental disorder, autosomal recessive 77
  distinguishing_features:
  - Additional ciliopathy-associated features accompany the intellectual disability.
  - Allelic with Joubert syndrome, where CEP104 is already curated in this knowledge base.
  - Mechanism is ciliary structure and signalling, which this class's pathograph does not model.
  evidence:
  - reference: PMID:34196201
    reference_title: "CEP104 and CEP290; Genes with Ciliary Functions Cause Intellectual Disability in Multiple Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report several Iranian families affected with ID and other
      ciliopathy-associated features carrying known and novel variants in two
      ciliary genes; CEP104 and CEP290.
    explanation: >-
      The report implicating CEP104 in intellectual disability describes
      accompanying ciliopathy features, placing the gene with the ciliopathy
      entry rather than in this class.
  - reference: PMID:34196201
    reference_title: "CEP104 and CEP290; Genes with Ciliary Functions Cause Intellectual Disability in Multiple Families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We emphasize on the clinical variability and pleiotropic phenotypes due
      to variants of these genes.
    explanation: >-
      The authors' own emphasis on pleiotropy, which is the argument for a
      single ciliopathy home rather than a separate non-syndromic subtype.

discussions:
- discussion_id: arnsid_no_class_specific_prevalence
  prompt: >-
    What fraction of all intellectual disability is attributable to autosomal
    recessive NON-SYNDROMIC gene defects, in consanguineous and in outbred
    populations?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - prevalence#
  rationale: >-
    Every published figure is either the all-cause intellectual disability
    prevalence (about 1%), a whole-class share (about 10% of affected children
    in an outbred population, syndromic and non-syndromic combined), or a solve
    rate within a clinic-ascertained multiplex consanguineous cohort (37-58%).
    None is a population estimate for the non-syndromic recessive class. Solve
    rates are inflated by multiplex ascertainment - families were selected for
    having two or more affected offspring, which enriches for recessive
    inheritance by construction - and are further confounded by cohorts that mix
    syndromic and non-syndromic cases; in one large consanguineous series 92% of
    families had additional features beyond intellectual disability. Without a
    population-based denominator the burden of this class, and therefore the
    case for carrier-screening programmes, cannot be quantified.
  proposed_experiments:
  - experiment_id: exp_arnsid_population_based_sequencing
    name: Unselected population-based sequencing of intellectual disability in a high-consanguinity setting
    description: >-
      Ascertain intellectual disability cases from a defined population rather
      than from genetics clinics, apply exome or genome sequencing to all, and
      have a clinical geneticist classify each case as syndromic or
      non-syndromic blinded to the genotype. This yields the first genuine
      population numerator and denominator for the non-syndromic recessive
      class, and simultaneously measures the size of the multiplex
      ascertainment inflation affecting existing estimates.
  - experiment_id: exp_arnsid_multiplex_bias_reanalysis
    name: Reanalysis of existing consanguineous cohorts stratified by sibship structure
    description: >-
      Re-analyse published large consanguineous cohorts stratifying solve rate
      by number of affected siblings and by syndromic status, to estimate and
      correct the ascertainment inflation in the headline yields and derive a
      bias-adjusted class share.
  evidence:
  - reference: PMID:28097321
    reference_title: "Diagnostic Yield and Novel Candidate Genes by Exome Sequencing in 152 Consanguineous Families With Neurodevelopmental Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      additional features were present in 140 of the families (92.1%)
    explanation: >-
      Documents the syndromic-contamination confounder directly: 92% of families
      in this consanguineous cohort had features beyond intellectual disability,
      i.e. were not strictly non-syndromic, so the headline yield cannot be read
      as an AR-NSID-specific estimate.
  - reference: PMID:30459488
    reference_title: "Genetics of autosomal recessive intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of ARID in a cohort of affected children of an outbred
      population is estimated to be about 10%, with an upward tendency in still
      unclarified cases.
    explanation: >-
      The best available figure, and it illustrates the gap: it is a share of
      affected children rather than a population rate, and it covers ARID as a
      whole rather than the non-syndromic subset.

- discussion_id: arnsid_candidate_gene_validation_backlog
  prompt: >-
    How many of the hundreds of AR-ID "candidate" genes reported from
    consanguineous cohorts are genuinely causal, given that most rest on a
    single family with no functional follow-up?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic Loss-of-Function Variant in an Autosomal Neurodevelopmental Gene
  rationale: >-
    The discovery engine for this class - one consanguineous family, one
    autozygous interval, one homozygous variant - produces gene-disease
    assertions faster than they can be replicated or functionally validated. In
    a single-family autozygous interval many rare homozygous variants
    co-segregate perfectly with disease by construction, so segregation carries
    much less evidential weight than in an outbred pedigree. The founding papers
    describe their own findings as "probably disease-causing variants" in
    "candidate" genes, and the largest cohort reports novel candidates at parity
    with confirmed genes. The consequence is that gene-disease validity for much
    of this class is unassessed, which propagates directly into clinical variant
    interpretation.
  proposed_experiments:
  - experiment_id: exp_arnsid_clingen_validity_curation
    name: Systematic gene-disease validity curation of the MRT series
    description: >-
      Apply ClinGen-style gene-disease validity classification to every MRT
      series entry and to candidate genes reported from consanguineous cohorts,
      producing an auditable Definitive/Moderate/Limited/Disputed assignment per
      gene and a quantified estimate of how much of the reported gene set is
      currently below reportable evidence thresholds.
  - experiment_id: exp_arnsid_matchmaking_second_families
    name: Cross-cohort matchmaking for independent second families
    description: >-
      Systematically submit single-family AR-NSID candidate genes to
      matchmaking platforms to seek independent second families with concordant
      genotype and phenotype before clinical reporting, and measure the
      proportion of candidates that do and do not replicate.
  evidence:
  - reference: PMID:21937992
    reference_title: "Deep sequencing reveals 50 novel genes for recessive cognitive disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study, the largest published so far, has revealed additional
      mutations in 23 genes previously implicated in intellectual disability or
      related neurological disorders, as well as single, probably
      disease-causing variants in 50 novel candidate genes.
    explanation: >-
      The discovering authors themselves label the findings "single, probably
      disease-causing variants" in "candidate" genes.
  - reference: PMID:29302074
    reference_title: "Genetics of intellectual disability in consanguineous families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 219 of these, we found likely causative variants, involving 77 known
      and 77 novel AR-ID (candidate) genes, 21 X-linked genes, as well as 9
      genes previously implicated in diseases other than ID.
    explanation: >-
      Quantifies the backlog: novel candidates match confirmed genes
      one-for-one in the largest cohort published.
  - reference: PMID:30459488
    reference_title: "Genetics of autosomal recessive intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For an exhaustive deciphering of the genetics of ARID, we suggest research
      at the level of single genes rather than large meta-analyses.
    explanation: >-
      The field's own recommendation, which is effectively a call for the
      per-gene validation work this gap describes.

- discussion_id: arnsid_theme_to_phenotype_mapping
  prompt: >-
    Why do lesions in themes as different as glutamate receptor signalling,
    tRNA methylation, N-glycosylation, and phospholipid remodelling all converge
    on the same clinical phenotype, and does the affected theme predict severity
    or accessory features?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Loss of a Gene-Specific Molecular Function Required by Developing Neurons
  rationale: >-
    Thematic recurrence is documented statistically - the gene set is enriched
    for co-expression and protein-protein interaction - but it is explicitly NOT
    pathway convergence, since the class review finds no prevalent pathways or
    protein complexes. It is therefore unresolved whether the themes act through
    a shared final common pathway (all ultimately degrading synaptic plasticity)
    or are genuinely parallel routes to a phenotype coarse enough to absorb
    them. The question is testable because the class already shows
    theme-correlated variation: the synaptic member GRIK2 and the
    transcriptional member MED23 produce clean cognitive phenotypes, whereas the
    lipid member MBOAT7 carries epilepsy and autistic features and the
    trafficking member TRAPPC9 carries microcephaly, white-matter change, and
    obesity. Whether that pattern is real or reflects reporting noise across
    tiny cohorts is unknown.
  proposed_experiments:
  - experiment_id: exp_arnsid_multigene_deep_phenotyping
    name: Multi-gene AR-NSID deep-phenotyping cohort
    description: >-
      Assemble a cohort with sufficient numbers per gene across several
      mechanistic themes and apply uniform deep phenotyping (standardised
      cognitive and adaptive testing, EEG, longitudinal head circumference,
      dysmorphology, MRI volumetry), then test whether theme membership predicts
      severity band, epilepsy risk, microcephaly, and syndromic reclassification.
  - experiment_id: exp_arnsid_ipsc_theme_convergence
    name: Comparative profiling of patient-derived neurons across mechanistic themes
    description: >-
      Generate patient iPSC-derived cortical neurons or organoids for
      representatives of each theme and compare transcriptomic, morphometric,
      and electrophysiological readouts, to test whether the themes converge on
      a shared downstream cellular signature or remain distinguishable.
  evidence:
  - reference: PMID:30459488
    reference_title: "Genetics of autosomal recessive intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are no prevalent ARID genes, pathways, or protein complexes and the
      functions of the affected proteins are very diverse and limited not only
      to neurological aspects.
    explanation: >-
      States the negative finding that makes the convergence question genuinely
      open rather than already answered by a shared pathway.
  - reference: PMID:26748517
    reference_title: "Systematic Phenomics Analysis Deconvolutes Genes Mutated in Intellectual Disability into Biologically Coherent Modules."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Systematic identification of highly enriched functional themes and
      phenotypes revealed typical phenotype combinations characterizing
      process-defined groups of ID disorders, such as chromatin-related
      disorders and deficiencies in DNA repair.
    explanation: >-
      Demonstrates that theme membership CAN predict phenotype combinations for
      some processes, making the question tractable for the recessive themes
      catalogued here.

- discussion_id: arnsid_model_translational_validity
  prompt: >-
    Do the rodent models used for AR-NSID genes report on human intellectual
    disability, given that the rescued readouts are sex-restricted rodent memory
    assays and that a key dosage mechanism (parent-of-origin bias) is
    established only in mouse brain?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Synaptic Transmission and Plasticity
  - pathophysiology#Impaired Cortical Circuit Formation and Connectivity
  rationale: >-
    Evidence exists in the models; what is open is whether it transfers. Three
    specific mismatches are documented rather than hypothetical. First,
    intellectual disability is a construct (IQ plus adaptive functioning) with
    no animal equivalent, so every model readout is a proxy - Drosophila
    short-term memory for NSUN2, mouse spatial and social memory for CC2D1A and
    TRAPPC9. Second, the one pharmacological rescue in the class is
    MALE-SPECIFIC: the PDE4D signalling deficit is absent in Cc2d1a-deficient
    female mice and the inhibitor has no effect in them, so a therapy developed
    on this model could fail in half of patients for reasons the model cannot
    reveal. Third, the parent-of-origin dosage mechanism for Trappc9 is
    established in mouse brain, and its human correlate rests on a single child
    with increased food intake - a metabolic rather than cognitive readout at
    n=1. This is a HUMAN_MODEL_MISMATCH rather than a KNOWLEDGE_GAP because in
    each case the model data are solid and it is their translational validity
    that is uncertain.
  proposed_experiments:
  - experiment_id: exp_arnsid_sex_stratified_human_correlate
    name: Sex-stratified analysis of CC2D1A-related disease in humans
    description: >-
      Assemble the published and unpublished CC2D1A cohort and test whether
      cognitive severity, autistic features, and behavioural phenotype differ by
      sex as the mouse model predicts, before any PDE4-inhibitor trial is
      contemplated. A negative result would indicate the male-specific mouse
      mechanism does not transfer.
  - experiment_id: exp_arnsid_human_brain_trappc9_allelic_bias
    name: Allele-specific TRAPPC9 expression in human brain and phenotyping of monoallelic carriers
    description: >-
      Measure allele-specific TRAPPC9 expression in human brain tissue to test
      whether the ~70% maternal bias seen in mouse holds in humans, and
      systematically phenotype heterozygous carriers of maternally inherited
      TRAPPC9 loss-of-function alleles for subclinical cognitive or metabolic
      effects.
  - experiment_id: exp_arnsid_human_ipsc_cortical_readouts
    name: Human iPSC cortical models as a bridge readout
    description: >-
      Use patient-derived iPSC cortical neurons and organoids, which retain
      human-specific cortical progenitor biology absent from rodent models, to
      test whether the cellular deficits identified in mouse (neurite outgrowth,
      cAMP/CREB signalling, progenitor depletion) are reproduced in human cells
      of the correct genotype.
  evidence:
  - reference: PMID:30732858
    reference_title: "Male-Specific cAMP Signaling in the Hippocampus Controls Spatial Memory Deficits in a Mouse Model of Autism and Intellectual Disability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Restoring PDE4D activity using an inhibitor rescues cognitive deficits in
      male mice but has no effect on female mice.
    explanation: >-
      The sex-restricted rescue that makes translational validity the open
      question for the class's only druggable lead.
  - reference: PMID:30732858
    reference_title: "Male-Specific cAMP Signaling in the Hippocampus Controls Spatial Memory Deficits in a Mouse Model of Autism and Intellectual Disability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We propose that male-specific signaling mechanisms are involved in
      establishing sex bias in neurodevelopmental disorders.
    explanation: >-
      The authors themselves frame the finding as a general claim about
      sex-specific mechanism, which is precisely what needs human confirmation.
  - reference: PMID:32877400
    reference_title: "Trappc9 deficiency causes parent-of-origin dependent microcephaly and obesity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A role for Trappc9 in energy balance was further supported by increased ad
      libitum food intake in a child with TRAPPC9 deficiency.
    explanation: >-
      The single human datum supporting the mouse imprinting model, and it
      concerns metabolism rather than cognition at n=1 - the mismatch this gap
      describes.
  - reference: PMID:22541559
    reference_title: "Mutations in NSUN2 cause autosomal-recessive intellectual disability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      When the Drosophila melanogaster NSUN2 ortholog was deleted, severe
      short-term-memory (STM) deficits were observed; STM could be rescued by
      re-expression of the wild-type protein in the nervous system.
    explanation: >-
      Illustrates the proxy-readout problem at its most extreme: Drosophila
      short-term memory standing in for human intellectual disability.

notes: >-
  Scope and modelling decisions. (1) This entry models the CLASS, following
  the same pattern as its sibling Autosomal Dominant Non-Syndromic
  Intellectual Disability. The MRT-series subtypes under `has_subtypes` are
  exemplars chosen to span the mechanistic theme set and the severity range,
  each anchored on a primary discovery paper with a verified snippet; they are
  not an exhaustive enumeration of the series, which exceeds 80 numbered
  entries and is still growing; a later genetics pass added 21 further
  gene-defined MRT subtypes, so the set now spans MRT1 to MRT83. The
  deep-research report suggested this class might alternatively be modelled as
  a `kb/groupings/` Grouping (a union defined by phenotype plus inheritance
  mode plus a negation); that is a reasonable follow-up but is not done here,
  both because the sibling AD class is already modelled as a Disease and
  because a Grouping requires its members to exist as separate Disease
  entries, which the MRT series does not yet. (2) The pathophysiology graph is
  deliberately kept at the ARCHITECTURE level with worked exemplars, rather
  than attempting per-gene chains for tens of genes. Critically, it does NOT
  assert pathway convergence: the class review states there are no prevalent
  ARID genes, pathways, or protein complexes, so the middle node is curated as
  thematic recurrence with that negative finding cited on the node itself. (3)
  No GeneReviews chapter exists for the class as a whole (PubMed searches for
  "autosomal recessive intellectual disability GeneReviews[TI]" and
  "nonsyndromic intellectual disability GeneReviews[TI]" both return zero
  results), so the GeneReviews phenotype baseline step could not be applied;
  the phenotype set is built instead from the primary MRT discovery literature
  and the large consanguineous cohort studies. (4) The HPO annotations
  propagated to MONDO:0019502 from its descendants (spasticity, cerebral
  visual impairment, and an ear-morphology cluster) were deliberately NOT
  transcribed: they are inherited from syndromic descendants of the grouping
  node and are precisely the features whose presence disqualifies a case from
  the non-syndromic label. (5) ADAT3 appears under `genetic` but deliberately
  NOT under `has_subtypes`: it is included as a founder-effect exemplar and as
  the worked case of migration out of the non-syndromic category, and
  modelling it as an MRT subtype here would assert a non-syndromic status that
  its own follow-up literature contradicts. (6) ST3GAL3 (MRT12) is a genuine
  member of the series per MONDO but is omitted because no primary report
  could be retrieved and cached, and this repository does not permit uncited
  assertions. TECR (MRT14) was omitted on the same ground when this entry was
  first written; its founding report (PMID:21212097) has since been retrieved
  and cached, so MRT14 is now curated. (7) `prevalence` deliberately carries
  no class-specific numeric rate; see the
  `arnsid_no_class_specific_prevalence` discussion. (8) MONDO asserts `is_a
  MONDO:0017706` (disorder of carbohydrate transmembrane transport and
  absorption) for MONDO:0019502. That parentage appears to be an upstream
  ontology defect, presumably leaked from a glycosylation-related descendant
  (TUSC3, MAN1B1, ST3GAL3); it is recorded here rather than reflected in
  `parents`, and is worth filing upstream with MONDO. (9) Deep research for
  this entry used the `claude_code` provider rather than `falcon`: no Edison /
  FutureHouse API key was available in the curation environment and
  `deep-research-client` reported `claude_code` as the only available
  provider. All DR-sourced PMIDs were independently fetched with `just
  fetch-reference` and every snippet verified against the cached abstract.
  (10) Two phenotypes deliberately carry a free-text `preferred_term` with NO
  ontology `term:` binding, each with its reasoning in the phenotype's own
  `notes`: "Impaired Literacy and Academic Attainment" (HP:0001328 Specific
  learning disability is a false match, since its definition explicitly
  excludes impairment related to a global deficiency of intelligence) and
  "Absence of Dysmorphism and Extra-Neural Involvement" (HP:0000271
  Abnormality of the face would anchor only the facial fraction of a much
  wider negative constellation). Both are needs-term (NTR) candidates for HPO.
  (11) Pathograph wiring: the mechanism chain is connected to the phenotype
  list and to the causal gene list, so the entry states in machine-readable
  form which mechanism produces which clinical feature and which gene acts at
  which node. Genes are attached to the node their own discovery literature
  implicates (synaptic node: GRIK2, PRSS12, MED23, MBOAT7, CC2D1A, TECR, FMN2,
  HNMT, TNIK; cortical-circuit node: TRAPPC9, TUSC3, MAN1B1, FBXO31, RUSC2,
  LINGO1; molecular-function node: NSUN2, ADAT3, CRBN, PGAP1, NDST1, EDC3,
  ZC3H14, ELP2, IMPA1, TAF13, FERRY3, ZBTB11, RSRC1, ALKBH8, METTL5, NSUN6,
  KICS2). The molecular-function node carries much the largest share because
  it is the node whose own claim is the loss of a GENE-SPECIFIC function, with
  no pathway convergence asserted; a gene is placed on the synaptic or
  cortical-circuit node only where its own founding report states a synaptic
  or developmental role, and each such statement is quoted in that subtype's
  evidence. Every causal edge carries its own evidence item. TWO phenotypes
  are deliberately left causally unconnected: "Obesity", because its route
  runs through hypothalamic energy balance rather than the
  neurodevelopmental-cognition architecture this graph models, and modelling
  it would require a hypothalamic node the class-level graph intentionally
  does not carry; and "Absence of Dysmorphism and Extra-Neural Involvement",
  because it is a definitional negative and a causal edge into an absence
  would be a category error. Both omissions are principled, not gaps to be
  closed by a later connectivity sweep. (12) MRT66 is bound to hgnc:1184,
  whose HGNC-approved symbol read live from rest.genenames.org on 2026-09-25
  is FERRY3 (FERRY endosomal RAB5 effector complex subunit 3), with C12orf4
  recorded there as a previous symbol and `date_symbol_changed` 2023-12-04.
  The OBO build used by term validation still carries C12orf4, so `term.label`
  retains C12orf4 (the label validation compares against) while
  `preferred_term` gives the approved symbol - the same convention CLAUDE.md
  records for GBA1/GBA. The founding report predates the rename and uses
  C12orf4 throughout.

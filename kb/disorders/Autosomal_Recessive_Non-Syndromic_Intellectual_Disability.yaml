  - target: Loss of a Gene-Specific Molecular Function Required by Developing Neurons
    description: >-
      Homozygosity for the damaging allele is what allows the molecular
      consequence to be expressed at all. This is exactly the step the
      imprinted-bias model contests: for a gene with strong parent-of-origin
      expression bias, loss of the dominant (maternal) allele alone may reduce
      expression enough to cross the threshold, so biallelic loss would not be
      required.

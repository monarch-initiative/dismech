- name: TRAPPC9
  gene_term:
    preferred_term: TRAPPC9
    term:
      id: hgnc:30832
      label: TRAPPC9
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: MRT13
  frequency: >-
    One of the most frequently reported single-gene causes of AR-NSID, reported
    independently by two groups in 2009 and in many families since.
  notes: >-
    TRAPP-complex vesicle-trafficking subunit (NIBP) that also activates NF-kB
    via IKK-beta, converging with CC2D1A on the same signalling theme. Unique in
    this class for an established parent-of-origin expression bias in brain
    (see `mechanistic_hypotheses`).
  evidence:

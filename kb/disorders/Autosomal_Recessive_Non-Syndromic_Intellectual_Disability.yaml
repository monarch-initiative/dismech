- name: Loss of a Gene-Specific Molecular Function Required by Developing Neurons
  biological_scale: MOLECULAR
  description: >-
    The class has no shared pathway. The authoritative review states plainly
    that there are no prevalent ARID genes, pathways, or protein complexes, and
    that the functions of the affected proteins are very diverse. What recurs is
    a limited set of cellular THEMES, each entered by several genes: synaptic
    transmission and proteolysis (GRIK2, PRSS12, MPDZ), activity-dependent and
    general transcriptional regulation (MED23, TET1), RNA and tRNA modification
    (NSUN2, ADAT3, ELP2, METTL23), protein N-glycosylation and glycoprotein
    quality control (TUSC3, MAN1B1, ST3GAL3), vesicle trafficking with NF-kB
    signalling (TRAPPC9, TRAPPC6B, WASHC4, TBC1D23, CC2D1A), regulated protein
    degradation (CRBN), and membrane phospholipid remodelling (MBOAT7). These
    are post-hoc organising themes, not a claim of pathway convergence. What IS
    statistically established at class level is weaker but real: the gene set is
    enriched for co-expression, for direct protein-protein interaction with
    products of already-known intellectual disability genes, and for prenatal
    and infant brain expression.

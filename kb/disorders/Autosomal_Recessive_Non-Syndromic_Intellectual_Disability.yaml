pathophysiology:
- name: Biallelic Loss-of-Function Variant in an Autosomal Neurodevelopmental Gene
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    The initiating lesion is the presence of two damaging alleles at one
    autosomal locus - most often a homozygous protein-truncating variant, but
    also homozygous whole-gene or partial deletion (TUSC3), complex
    rearrangement (GRIK2), or homozygous hypomorphic missense (MED23, MAN1B1) -
    so that the gene product is absent or severely reduced. Unlike the dominant
    class the affected genes are NOT restricted to the
    haploinsufficiency-intolerant fraction of the genome: because one working
    copy suffices, a damaging recessive allele is under weak purifying selection
    and persists in the population, so the recessive class draws on a far larger
    gene pool. That is the structural reason the number of candidate loci is
    estimated in the thousands and each individual gene explains only a handful
    of families. Homozygous copy-number lesions are a genuine and recurrent
    subset of the trigger, which is why chromosomal microarray remains part of
    the workup even in a suspected-recessive workflow.
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  biological_processes:
  - preferred_term: nervous system development
    term:
      id: GO:0007399
      label: nervous system development
  downstream:
  - target: Autozygosity Exposes Recessive Alleles in Consanguineous Pedigrees
    description: >-
      The recessive lesion is silent in the heterozygous state; parental
      relatedness is what converts a carrier allele into an affected homozygote.
    causal_link_type: DIRECT
    hypothesis_groups:
    - thousands_of_recessive_id_loci
    evidence:
    - reference: PMID:30459488
      reference_title: "Genetics of autosomal recessive intellectual disability."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The risk for ARID in children of first cousins or closer is a magnitude
        higher than for children of unrelated parents.
      explanation: >-
        Supports the edge itself: it is parental relatedness, not the allele
        alone, that converts recessive carrier burden into affected offspring.
  - target: Loss of a Gene-Specific Molecular Function Required by Developing Neurons
    description: >-
      Absence of the gene product removes one component from one of a limited
      number of recurring cellular processes required for brain development.
      Under the long-tail model this single edge stands in for many hundreds to
      thousands of gene-specific instantiations.
    causal_link_type: DIRECT
    hypothesis_groups:
    - thousands_of_recessive_id_loci
    evidence:
    - reference: PMID:17718851
      reference_title: "Genetics of autosomal recessive non-syndromic mental retardation: recent advances."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        All of the mutations in the ARNSMR-causing genes are protein truncating,
        indicating a putative severe loss-of-function effect.
      explanation: >-
        Supports the edge: the allelic class is protein-truncating loss of
        function, so the biallelic lesion removes the gene-specific function.
  evidence:
  - reference: PMID:17718851
    reference_title: "Genetics of autosomal recessive non-syndromic mental retardation: recent advances."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All of the mutations in the ARNSMR-causing genes are protein truncating,
      indicating a putative severe loss-of-function effect.
    explanation: >-
      Establishes complete loss of function as the allelic mechanism for the
      founding members of the class.
  - reference: PMID:18452889
    reference_title: "A defect in the TUSC3 gene is associated with autosomal recessive mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recent studies have shown that autosomal recessive mental retardation
      (ARMR) is extremely heterogeneous, and there is reason to believe that the
      number of underlying gene defects goes into the thousands.
    explanation: >-
      States the locus-heterogeneity consequence of a recessive architecture not
      confined to constraint-intolerant genes.
  - reference: PMID:28397838
    reference_title: "Mapping autosomal recessive intellectual disability: combined microarray and exome sequencing identifies 26 novel candidate genes in 192 consanguineous families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Previous studies have indicated high levels of genetic heterogeneity, with
      estimates of more than 2500 autosomal ID genes, the majority of which are
      autosomal recessive (AR).
    explanation: >-
      Quantifies the gene pool and states explicitly that the majority is
      recessive.
  - reference: PMID:28397838
    reference_title: "Mapping autosomal recessive intellectual disability: combined microarray and exome sequencing identifies 26 novel candidate genes in 192 consanguineous families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The new ARID genes include nine with loss-of-function mutations (ABI2,
      MAPK8, MPDZ, PIDD1, SLAIN1, TBC1D23, TRAPPC6B, UBA7 and USP44), and
      missense mutations include the first reports of variants in BDNF or TET1
      associated with ID.
    explanation: >-
      Illustrates the allelic spectrum of the trigger - predominantly
      loss-of-function with a minority of conserved-residue missense.
  - reference: PMID:21937992
    reference_title: "Deep sequencing reveals 50 novel genes for recessive cognitive disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More than 90 different gene defects have been identified for
      X-chromosome-linked intellectual disability alone, but research into the
      more frequent autosomal forms of intellectual disability is still in its
      infancy.
    explanation: >-
      Contextualises the autosomal recessive class as the larger but
      historically under-characterised fraction of inherited intellectual
      disability.

- name: Autozygosity Exposes Recessive Alleles in Consanguineous Pedigrees
  biological_scale: ORGANISM
  role: modifier
  description: >-
    Parental consanguinity does not create the mutant allele; it raises the
    probability that a rare carrier allele is inherited in duplicate, identical
    by descent, so that the two copies lie inside a shared run of homozygosity.
    This is the population-genetic step that converts an invisible recessive
    burden into overt disease, and it is why the class is concentrated in
    populations where cousin marriage is common - the risk of recessive
    intellectual disability in children of first cousins or closer is an order
    of magnitude higher than in children of unrelated parents. It is also the
    methodological lever: because the causal variant must lie inside an
    autozygous interval shared by all affected siblings, homozygosity mapping
    reduces the search space enough for exome sequencing to identify the gene in
    a single family. The same reasoning explains why the class was almost
    invisible before this method - conventional linkage requires many
    independent families per locus, which extreme locus heterogeneity makes
    impossible.

- name: Impaired Synaptic Transmission and Plasticity
  biological_scale: CELLULAR
  description: >-
    Where the affected theme is synaptic, the immediate cellular consequence is
    a defect in excitatory neurotransmission or in the activity-dependent
    changes that encode experience. GRIK2 loss removes a kainate-receptor
    subunit from the excitatory synapse with electrophysiologically confirmed
    loss of function; PRSS12/neurotrypsin loss removes a protease acting at the
    presynaptic membrane lining the synaptic cleft, where its proteolysis is
    required for normal synaptic function; MED23 loss blocks JUN/FOS
    immediate-early-gene induction, the transcriptional arm of
    activity-dependent plasticity; MBOAT7 loss alters the arachidonoyl
    phosphatidylinositol pool from which synaptic signalling lipids derive; and
    CC2D1A loss releases PDE4D hyperactivity, depleting hippocampal cAMP and
    reducing CREB signalling. The resulting deficit is in the machinery of
    learning and memory rather than in gross brain structure - which is
    precisely why the phenotype is cognitive and non-syndromic.

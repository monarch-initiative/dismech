  evidence:
  - reference: PMID:12459588
    reference_title: "Truncating neurotrypsin mutation in autosomal recessive nonsyndromic mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immuno-electron microscopy on adult human brain sections revealed that
      neurotrypsin is located in presynaptic nerve endings, particularly over
      the presynaptic membrane lining the synaptic cleft.
    explanation: >-
      Localises the founding gene product to the presynaptic terminal, anchoring
      the synaptic mechanism in human brain tissue.
  - reference: PMID:12459588
    reference_title: "Truncating neurotrypsin mutation in autosomal recessive nonsyndromic mental retardation."
    supports: SUPPORT

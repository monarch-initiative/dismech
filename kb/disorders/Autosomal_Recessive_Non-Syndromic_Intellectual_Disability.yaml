    snippet: >-
      This suggests essential roles of TRAPPC9 in human brain development,
      possibly through its effect on NF-kappaB activation and protein
      trafficking in the postmitotic neurons of the cerebral cortex.
    explanation: >-
      Links the trafficking/NF-kB theme specifically to postmitotic cortical
      neuron development.
  - reference: PMID:20004765
    reference_title: "Identification of mutations in TRAPPC9, which encodes the NIK- and IKK-beta-binding protein, in nonsyndromic autosomal-recessive mental retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain magnetic resonance imaging of affected individuals indicates the
      presence of mild cerebral white matter hypoplasia.
    explanation: >-
      Documents the subtle white-matter imaging correlate, consistent with a

      reference_title: "A mutation in a novel ATP-dependent Lon protease gene in a kindred with mild mental retardation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A gene on chromosome 3p that is associated with mild mental retardation
        in a large kindred is reported. This finding implicates a role for the
        ATP-dependent degradation of proteins in memory and learning.
      explanation: >-
        Supports the edge from the memory/learning mechanism to the scored
        intellectual-disability phenotype in a worked AR-NSID kindred.
  - target: Global Developmental Delay
    description: >-
      The presenting form of the same deficit in infancy and early childhood,
      before an IQ can be formally assigned; global rather than domain-selective.
    causal_link_type: DIRECT

name: Autosomal Recessive Non-Syndromic Intellectual Disability
creation_date: "2026-08-01T00:00:00Z"
description: >-
  Autosomal recessive non-syndromic intellectual disability (AR-NSID / NS-ARID;
  the OMIM "mental retardation / intellectual developmental disorder, autosomal
  recessive" MRT series) is a genetically extremely heterogeneous class of
  intellectual disability in which impaired intellectual functioning and
  adaptive behaviour arise from biallelic (usually homozygous) loss-of-function
  variants in an autosomal gene, without a consistent pattern of associated
  dysmorphic, malformative, metabolic, or neuroimaging features that would
  define a clinically recognisable syndrome. It is the mechanistic and
  epidemiological mirror image of the autosomal dominant class: where AD-NSID is
  dominated by sporadic de novo heterozygous lesions in constraint-intolerant
  genes, AR-NSID is inherited, carries a 25% sibling recurrence risk, and is
  concentrated in populations with frequent parental consanguinity - roughly a
  seventh of the world population, in which recessive gene defects are the
  leading genetic cause of intellectual disability. Because each gene accounts
  for only a handful of families worldwide, the class was intractable to
  conventional linkage and was opened up only by homozygosity (autozygosity)
  mapping in large consanguineous pedigrees combined with exome sequencing: the
  first gene, PRSS12/neurotrypsin, was reported in 2002, only four genes were
  known by 2008, and large consanguineous cohorts have since implicated many
  hundreds, against an estimated total of more than 2,500 autosomal
  intellectual-disability genes, most of them recessive. Critically, the causal
  genes do NOT converge on a prevalent pathway or protein complex - the
  authoritative review of the class states there are no prevalent ARID genes,
  pathways, or protein complexes - but they do fall repeatedly into a limited
  set of recurring cellular themes: synaptic transmission and proteolysis
  (GRIK2, PRSS12), transcriptional regulation (MED23), RNA modification
  (NSUN2, ADAT3), protein glycosylation (TUSC3, MAN1B1), vesicle trafficking
  with NF-kB signalling (TRAPPC9, CC2D1A), protein turnover (CRBN), and membrane
  lipid remodelling (MBOAT7). The disorder is a static (non-progressive)
  developmental encephalopathy - a mis-built rather than a damaged circuit - so
  developmental regression argues against the diagnosis. As in the dominant
  class the non-syndromic label is unstable: several MRT-series entities (NSUN2,
  MAN1B1, ADAT3) acquired recognisable dysmorphic or systemic features once
  larger series were phenotyped.

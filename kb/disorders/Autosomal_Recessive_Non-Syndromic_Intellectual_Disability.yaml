- name: Impaired Learning, Memory, and Cognitive Development
  biological_scale: ORGANISM
  role: consequence
  description: >-
    The convergent organism-level outcome: significantly impaired intellectual
    functioning and adaptive behaviour with onset in the developmental period.
    Severity spans the range from mild (CRBN, IQ 50-70) to severe (CC2D1A), with
    moderate-to-severe the commonest reported band - though that distribution is
    inflated by ascertainment through multiplex families referred to specialist
    genetics services. Because the upstream lesions damage the machinery of
    synaptic plasticity and cortical connectivity rather than producing a
    specific structural or metabolic lesion, the deficit is global and STATIC
    rather than regressive: the developmental trajectory is shallower, so the
    gap versus peers widens with age, but there is no loss of previously
    acquired skills. Developmental regression therefore argues against this
    diagnosis and toward a degenerative or metabolic alternative. Notably, this
    class is not the low tail of the normal-range polygenic intelligence
    distribution - common variants in NS-ARID genes are not enriched for
    intelligence QTLs.
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  biological_processes:

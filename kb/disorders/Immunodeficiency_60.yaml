pathophysiology:
- name: BACH2 Protein Destabilization
  biological_scale: MOLECULAR
  description: >-
    The step that explains why one mutant allele yields half-dosage rather than a
    poisoned pathway. The reported BRIDA mutations do not produce a dominant-negative
    protein; they destabilize BACH2 itself, either by interfering with homodimerization
    through the BTB/POZ domain or by driving the protein into aggregates. The mutant
    product is therefore lost rather than interfering, which is what makes the
    downstream defect a pure gene-dosage problem.
  genes:
  - preferred_term: BACH2
    term:
      id: hgnc:14078
      label: BACH2
  genetic_context:
    gene:
      preferred_term: BACH2
      term:
        id: hgnc:14078
        label: BACH2
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE

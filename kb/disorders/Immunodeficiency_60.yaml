histopathology:
- name: Chronic colitis with crypt branching and pericryptal lymphocytic infiltrate
  description: >-
    The colonic biopsy in the index patient shows chronic architectural change - crypt
    branching - together with lymphocytes massed around the crypts, and a Treg
    population that is reduced relative both to healthy controls and to patients with
    ordinary inflammatory bowel disease. That last comparison is what makes the biopsy
    mechanistically informative rather than merely confirmatory: the Treg deficit is
    not a generic consequence of colonic inflammation, so it points at the regulatory
    T-cell failure as the cause of the colitis rather than its result.

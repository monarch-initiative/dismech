    reference_title: "BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "increased expression of the TH1 transcription factor T-bet and two gut-homing receptors, CCR9 and β7-integrin on CD4+ T cells"
    explanation: >-
      Raised CCR9 and beta-7 integrin on patient CD4+ T cells. Shared with the TH1 node

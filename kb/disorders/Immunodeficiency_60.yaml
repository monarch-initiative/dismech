    explanation: >-
      The founding report establishing BACH2 as the causal gene for this Mendelian
      entity, and the mechanism as haploinsufficiency.
  - reference: PMID:37148421
    reference_title: "An early-onset SLE patient with a novel paternal inherited BACH2 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing analysis of the patient and her parents revealed a novel heterozygous point mutation in BACH2, c.G1727T, resulting in substitution of a highly conserved arginine with leucine (R576L), which is predicted to be deleterious, in the patient and her father."
    explanation: >-
      Identifies the variant in the second reported family and its inheritance from an

  biological_scale: CELLULAR
  description: >-
    The effector half of the T-cell lesion. Insufficient BACH2 releases the repression
    that normally restrains effector lineage commitment, and the patients' CD4+
    compartment is pushed towards the TH1 programme, marked by raised T-bet. This says
    what the surviving cells become; where they go is the separate node below.

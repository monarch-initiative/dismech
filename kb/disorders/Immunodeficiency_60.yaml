  - reference: PMID:37148421
    reference_title: "An early-onset SLE patient with a novel paternal inherited BACH2 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BACH2-related immunodeficiency and autoimmunity (BRIDA) is an inborn error of immunity, newly reported in 2017, presenting with symptoms of immunoglobulin deficiency and ongoing colitis."
    explanation: >-
      A second group's summary of the syndrome, which pairs immunoglobulin deficiency

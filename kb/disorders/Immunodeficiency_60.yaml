pathophysiology:
- name: BACH2 Protein Destabilization
  biological_scale: MOLECULAR
  description: >-
    The step that explains why one mutant allele yields half-dosage rather than a
    poisoned pathway. The reported BRIDA mutations do not produce a dominant-negative
    protein; they destabilize BACH2 itself, either by interfering with homodimerization
    through the BTB/POZ domain or by driving the protein into aggregates. The mutant
    product is therefore lost rather than interfering, which is what makes the
    downstream defect a pure gene-dosage problem.
  genetic_context:
    gene:
      preferred_term: BACH2
      term:
        id: hgnc:14078
        label: BACH2
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
  evidence:
  - reference: PMID:28530713
    reference_title: "BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutations disrupted protein stability by interfering with homodimerization or by causing aggregation."
    explanation: >-
      States the molecular consequence of the variants directly, and is the reason
      this entry records LOSS_OF_FUNCTION rather than DOMINANT_NEGATIVE.
  - reference: PMID:37148421
    reference_title: "An early-onset SLE patient with a novel paternal inherited BACH2 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reduced BACH2 expression and deficient transcriptional repression of the BACH2 target, BLIMP1, were detected in PBMCs or lymphoblastoid cell lines of our patient."
    explanation: >-
      Independent confirmation in a second family that a BRIDA variant lowers BACH2
      protein and its repressor output, in patient-derived cells.
  downstream:
  - target: BACH2 Haploinsufficiency
    causal_link_type: DIRECT
- name: BACH2 Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    Loss of one functional BACH2 allele leaves insufficient BACH2 protein to
    specify lymphocyte lineage decisions. IUIS characterises the defect as
    haploinsufficiency for a critical lineage specification transcription factor,
    which is a dosage statement rather than a dominant-negative one: the residual
    wild-type allele is not poisoned, it is simply not enough. BACH2 is required in
    both lymphoid lineages, which is why one dosage lesion produces a T-cell and a
    B-cell defect at once.

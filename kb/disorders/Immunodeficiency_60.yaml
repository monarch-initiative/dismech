    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected subjects had lymphocyte-maturation defects that caused immunoglobulin deficiency and intestinal inflammation."
    explanation: >-
      States immunoglobulin deficiency as a feature of the affected subjects in the

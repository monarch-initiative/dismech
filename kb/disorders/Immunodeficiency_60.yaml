    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Impaired Memory B Cell Development
  biological_scale: CELLULAR
  description: >-
    The B-cell arm of the defect. IUIS records impaired memory B-cell development as
    the circulating B-cell finding in BACH2 deficiency. Mechanistically BACH2 sits
    upstream of the memory-versus-plasma-cell decision: in normal human memory B
    cells, differentiation to plasma cells is driven by PRDM1/BLIMP1 induction with
    reciprocal downregulation of BACH2, so BACH2 is the repressor that holds the
    memory programme open. Insufficient BACH2 leaves that programme unable to be
    established, and the memory B-cell compartment that supplies durable mucosal and
    respiratory antibody does not accumulate.

    The founding report's full text resolves how far the defect goes, which earlier
    versions of this entry left open. The loss in patients is not only of memory B
    cells but specifically of class-switched ones, and activating patient naive B
    cells in vitro reproduces the failure directly: class-switch recombination,
    plasmablast generation and class-switched antibody secretion are all impaired.
    Isotype switching is therefore annotated here as a patient-level defect rather
    than a mouse inference.

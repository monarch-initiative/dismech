- name: Impaired Regulatory T Cell Differentiation
  biological_scale: CELLULAR
  description: >-
    BACH2 is one of the transcription factors whose loss defines the monogenic
    "Tregopathies" - inborn errors of immunity that act through the regulatory T-cell
    compartment rather than through effector immunity. Insufficient BACH2 impairs
    regulatory T-cell differentiation, and the resulting failure of peripheral
    tolerance is the arm of the disease that produces lymphocytic tissue infiltration
    rather than infection.
  cell_types:
  - preferred_term: FoxP3+ regulatory T cell
    term:
      id: CL:0000815
      label: regulatory T cell
  biological_processes:
  - preferred_term: regulatory T cell differentiation
    term:
      id: GO:0045066
      label: regulatory T cell differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:33996698
    reference_title: "Different Apples, Same Tree: Visualizing Current Biological and Clinical Insights into CTLA-4 Insufficiency and LRBA and DEF6 Deficiencies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Other IEIs affect the function of regulatory T (Treg) cells—so-called ‘Tregopathies'—such as immune dysregulation, polyendocrinopathy, enteropathy, X-linked (IPEX) syndrome, deficiencies of CD25 or BTB domain and CNC homolog 2 (BACH2), and gain-of-function mutations in signal transducer and activator of transcription 3 (STAT3)"
    explanation: >-
      Places BACH2 deficiency explicitly among the inborn errors that act through
      regulatory T-cell function, which is the basis for this node.
  - reference: PMID:23728300
    reference_title: "BACH2 represses effector programs to stabilize T(reg)-mediated immune homeostasis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "BACH2 was required for efficient formation of regulatory (Treg) cells and consequently for suppression of lethal inflammation in a manner that was Treg-cell-dependent."
    explanation: >-
      The mechanistic basis for this node. INDIRECT because it is a mouse gene
      disruption rather than an observation in BRIDA patients.
  - reference: PMID:23728300
    reference_title: "BACH2 represses effector programs to stabilize T(reg)-mediated immune homeostasis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "its absence during Treg polarization resulted in inappropriate diversion to effector lineages"
    explanation: >-
      Gives the failure mode - cells destined for the regulatory lineage become
      effectors instead - which is what converts a Treg defect into tissue infiltration.
  downstream:
  - target: Lymphocytic colitis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Impaired Memory B Cell Development
  biological_scale: CELLULAR
  description: >-
    The B-cell arm of the defect. IUIS records impaired memory B-cell development as
    the circulating B-cell finding in BACH2 deficiency. Mechanistically BACH2 sits
    upstream of the memory-versus-plasma-cell decision: in normal human memory B
    cells, differentiation to plasma cells is driven by PRDM1/BLIMP1 induction with
    reciprocal downregulation of BACH2, so BACH2 is the repressor that holds the
    memory programme open. Insufficient BACH2 leaves that programme unable to be
    established, and the memory B-cell compartment that supplies durable mucosal and
    respiratory antibody does not accumulate. The entry stops there: whether the
    surviving memory cells are specifically depleted of class-switched clones is
    stated by the primary reports but not by any source available here, so neither
    the cell-type binding nor the process binding asserts it.
  cell_types:
  - preferred_term: memory B cell
    term:
      id: CL:0000787
      label: memory B cell
  biological_processes:
  - preferred_term: memory B cell differentiation
    term:
      id: GO:0002319
      label: memory B cell differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:35748970
    reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Impaired memory B cell development"
    explanation: >-
      The circulating-B-cell column of the IUIS Table 4 row for BACH2 deficiency.
  - reference: PMID:29670635
    reference_title: "Chronic Lymphocytic Leukemia B-Cell Normal Cellular Counterpart: Clues From a Functional Perspective."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "human IgG+ MBCs primar - ily differentiated into PCs in response to either T-cell-dependent or T-cell-independent stimulation guided by rapid PRDM1 (BLIMP1) induction and downregulation of BACH2"
    explanation: >-
      Establishes the reciprocal BACH2-BLIMP1 relationship in normal human memory B
      cells that this node's mechanism depends on. Graded INDIRECT because it
      describes normal B-cell differentiation in a review of chronic lymphocytic
      leukemia, not the disorder. Quoted with the source's own hyphenation artifact.
  - reference: PMID:28530713
    reference_title: "BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected subjects had lymphocyte-maturation defects that caused immunoglobulin deficiency and intestinal inflammation."
    explanation: >-
      The defining report's statement that the maturation defect is what causes the
      humoral deficiency, which is the edge this node draws to immunoglobulin deficiency.
  - reference: PMID:15152264
    reference_title: "The transcriptional programme of antibody class switching involves the repressor Bach2."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we show that Bach2 is critical for CSR and somatic hypermutation (SHM) of immunoglobulin genes."
    explanation: >-
      Identifies which step of the B-cell programme depends on BACH2. INDIRECT because
      it is a mouse knockout, and note the dose mismatch - a null, not the human
      heterozygous state.
  downstream:
  - target: Immunoglobulin deficiency
    causal_link_type: DIRECT
phenotypes:
- category: Immunologic
  name: Progressive T-cell lymphopenia
  description: >-
    IUIS records the circulating T-cell finding in BACH2 deficiency as progressive
    T-cell lymphopenia. The qualifier matters: the count falls over time rather than
    being low from the outset, so a normal T-cell count early does not exclude the
    diagnosis.
  phenotype_term:
    preferred_term: Progressive T-cell lymphopenia
    term:
      id: HP:0005403
      label: Decreased total T cell count
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:35748970
    reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Progressive T cell lymphopenia Impaired memory B cell development"
    explanation: >-
      The circulating T-cell column of the IUIS Table 4 row for BACH2 deficiency. The
      quote runs into the adjacent circulating-B-cell column because the two cells
      are contiguous in the cached table text.
- category: Gastrointestinal
  name: Lymphocytic colitis
  description: >-
    Lymphocytic infiltration of the colonic mucosa, listed by IUIS as an associated
    feature of BACH2 deficiency. It is the infiltrative rather than the infectious
    half of the phenotype and is what marks the disorder as immune dysregulation
    rather than isolated antibody deficiency.
  phenotype_term:
    preferred_term: Lymphocytic colitis
    term:
      id: HP:0002583
      label: Colitis
  evidence:
  - reference: PMID:35748970
    reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Haploinsufficiency for a critical lineage specification transcription factor Lymphocytic colitis, sinopulmonary infections"
    explanation: >-
      The associated-features column of the IUIS Table 4 row, quoted together with
      the preceding functional-defect cell so the span is long enough to be
      self-describing.
  - reference: PMID:28530713
    reference_title: "BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected subjects had lymphocyte-maturation defects that caused immunoglobulin deficiency and intestinal inflammation."
    explanation: >-
      The defining report records intestinal inflammation in the affected subjects,
      which is the primary-source basis for this phenotype.
- category: Immunologic
  name: Immunoglobulin deficiency
  description: >-
    The humoral consequence of the failed B-cell maturation programme, and the finding
    that makes the disorder look like a predominantly antibody deficiency at the
    bedside. The defining report states it outright; a later family showed selective
    IgA deficiency, so which isotypes fall and how far is not uniform across the
    reported cases.
  phenotype_term:
    preferred_term: Immunoglobulin deficiency
    term:
      id: HP:0004313
      label: Decreased circulating immunoglobulin concentration

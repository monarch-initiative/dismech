diagnosis:
- name: Pulmonary surveillance in BACH2 carriers
  description: >-
    Periodic pulmonary assessment is recommended for patients with BACH2 mutations.
    The recommendation follows from the sinopulmonary infection phenotype and the
    structural lung damage that recurrent infection produces in antibody-deficient
    patients, and the authors making it are explicit that the case base is small.
  evidence:
  - reference: PMID:33864888
    reference_title: "Molecular diagnosis of childhood immune dysregulation, polyendocrinopathy, and enteropathy, and implications for clinical management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "although there are limited cases reported, current evidence also supports pulmonary screening for patients with mutations in BACH2, ITCH and TOM1"
    explanation: >-
      States the surveillance recommendation and, in the same sentence, the limited
      case base it rests on.
  notes: >-
    Recorded under diagnosis rather than treatments because it is a monitoring
    action, not a therapeutic one.
mechanistic_hypotheses:
- hypothesis_group_id: bach2_dosage_axis
  hypothesis_label: >-
    Common regulatory variation and rare coding haploinsufficiency at BACH2 act on one
    gene-dosage axis
  status: EMERGING
  description: >-
    BACH2 occupies an unusual position: the same gene is a recurrent common-variant
    susceptibility locus across many polygenic autoimmune diseases and, separately,
    the cause of a Mendelian inborn error of immunity through coding
    haploinsufficiency. The hypothesis is that these are two ends of one dosage
    continuum - that regulatory variants shifting BACH2 expression modestly across a
    population produce autoimmune susceptibility, while a coding lesion halving it
    produces overt immune dysregulation with immunodeficiency.

    This is recorded as a hypothesis and deliberately not drawn as a causal edge. The
    susceptibility associations and the Mendelian mechanism are established
    separately; that they share a dosage mechanism is an inference, and no cached
    source tests it. Deciding it would need expression-level data linking the risk
    haplotypes to BACH2 dosage in the relevant lymphocyte compartments.
  evidence:
  - reference: PMID:22561518
    reference_title: "Genome-wide association analyses identify 13 new susceptibility loci for generalized vitiligo."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "CLNK (P = 1.56 × 10(-8)), BACH2 (P = 2.53 × 10(-8)), SLA (P = 1.58 × 10(-8))"
    explanation: >-
      Establishes the common-variant end of the proposed axis by naming BACH2 among
      the genome-wide significant vitiligo susceptibility loci, with its association
      statistic. INDIRECT because it is an association study in a different disease,
      cited only to establish that the susceptibility claim exists.
  - reference: PMID:35748970
    reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Haploinsufficiency for a critical lineage specification transcription factor"
    explanation: >-
      Establishes the Mendelian end of the proposed axis as an explicitly
      dosage-dependent mechanism, which is what makes a shared-dosage model
      conceivable in the first place.
  notes: >-
    See the entry-level notes for the list of dismech entries carrying BACH2 as a
    susceptibility locus.
discussions:
- discussion_id: bach2_imd60_humoral_phenotype_uncurated
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Memory B Cell Development
  - phenotypes#Recurrent sinopulmonary infections
  prompt: >-
    What is the immunoglobulin phenotype of immunodeficiency 60, and does it meet
    criteria for common variable immunodeficiency?
  rationale: >-
    The IUIS row this entry is built on records impaired memory B-cell development
    but says nothing about serum immunoglobulin levels, class-switch recombination
    in patient cells, or the plasmablast response. The primary reports describing
    the syndrome are not in this repository's reference cache and could not be
    fetched during curation, so the quantitative humoral phenotype - which
    isotypes fall, how far, and whether the picture is formally CVID-like - is
    absent from the entry rather than settled. Filling it requires the primary
    BACH2 immunodeficiency literature and would add a hypogammaglobulinemia node
    between the memory B-cell node and the infection phenotype, where the entry
    currently draws a single indirect edge.
- discussion_id: bach2_repressor_direction_paradox
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Memory B Cell Development
  prompt: >-
    If BACH2 suppresses immunoglobulin production, why does losing it cause antibody
    deficiency rather than excess antibody?
  rationale: >-
    BACH2 is described as a repressor of immunoglobulin production, and in normal
    memory B cells plasma-cell differentiation proceeds by inducing BLIMP1 and
    downregulating BACH2. Read naively, halving BACH2 should therefore release
    antibody output, not reduce it. The resolution offered in the literature is that
    BACH2 is required for the class-switch and memory programme while simultaneously
    restraining premature terminal differentiation, so its loss yields plentiful but
    unswitched, low-affinity antibody rather than more useful antibody. The entry
    words the memory B-cell node in those terms, but the supporting sources here
    state the two halves separately rather than together, and confirming the account
    for BACH2-haploinsufficient patients specifically needs the primary reports.
- discussion_id: bach2_imd60_iuis_versus_clingen_panel
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - disease#
  prompt: >-
    Should immunodeficiency 60 be grouped with the antibody deficiencies or with the
    diseases of immune dysregulation?
  rationale: >-
    The two authorities pull in different directions and both are defensible. ClinGen
    curated the gene through its Antibody Deficiencies Gene Curation Expert Panel,
    which reflects how the disorder presents - sinopulmonary infection and humoral
    deficiency. IUIS places it in Table 4 with the regulatory T-cell defects, which
    reflects the mechanism and the infiltrative colitis. This entry follows IUIS,
    because the Tregopathy classification is corroborated independently and because
    the lymphocytic colitis is not explicable as a consequence of antibody deficiency.
    The disagreement is recorded rather than hidden, since a reader coming from the
    ClinGen side will expect the other answer.
  evidence:
  - reference: CGGV:assertion_2473560a-6e5c-4342-a6e2-c89e37f4cc71-2023-02-21T180000.000Z
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "BACH2 | HGNC:14078 | immunodeficiency 60 | MONDO:0032723 | AD | Moderate | SOP9 | Antibody Deficiencies Gene Curation Expert Panel | 2023-02-21T18:00:00.000Z"
    explanation: >-
      Names the ClinGen expert panel that curated the gene, which is the antibody
      deficiency panel rather than an immune dysregulation panel.

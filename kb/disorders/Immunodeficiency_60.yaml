name: Immunodeficiency 60
creation_date: "2026-09-03T00:00:00Z"
category: Mendelian
description: >-
  Immunodeficiency 60 is an autosomal dominant inborn error of immunity caused by
  haploinsufficiency for BACH2, a BTB/POZ- and basic-leucine-zipper-domain
  transcriptional repressor that acts as a lineage-specification factor in both the
  T-cell and the B-cell arm of adaptive immunity. The International Union of
  Immunological Societies places it in Table 4, diseases of immune dysregulation,
  rather than among the predominantly antibody deficiencies, and summarises the
  defect as haploinsufficiency for a critical lineage specification transcription
  factor.

  The consequence is the unusual pairing that defines the entity: a humoral
  deficiency and a lymphocytic infiltrative disease in the same patient. Loss of one
  functional BACH2 allele impairs regulatory T-cell differentiation, which places
  the disorder among the monogenic "Tregopathies" alongside IPEX, CD25 deficiency
  and STAT3 gain-of-function; it also impairs memory B-cell development, which
  underlies the sinopulmonary infection phenotype. IUIS records progressive T-cell
  lymphopenia in the circulating T-cell compartment and impaired memory B-cell
  development in the B-cell compartment, with lymphocytic colitis and sinopulmonary
  infections as the associated clinical features. BACH2 defects are among the
  monogenic causes found when FOXP3-negative IPEX-like immune dysregulation is
  sequenced, and pulmonary surveillance is recommended for carriers.

  This entry is deliberately conservative about how much is settled. ClinGen's
  Antibody Deficiencies Gene Curation Expert Panel classifies the BACH2 relationship
  to immunodeficiency 60 as Moderate rather than Definitive or Strong, and the
  syndrome rests on a small number of reported families. The entry was curated in a
  session that could not reach PubMed, so the primary BACH2 immunodeficiency
  literature is not represented here and the pathograph is built from what
  authoritative classification and review sources state directly. The humoral
  phenotype in particular - the pan-hypogammaglobulinemia and impaired class-switch
  recombination that the primary reports describe - is recorded as a knowledge gap
  rather than asserted, because no cached source states it for this disorder.

  A separate claim must be kept distinct from this one. BACH2 is also a common-variant
  susceptibility locus in many polygenic autoimmune diseases - type 1 diabetes,
  Graves disease, vitiligo, multiple sclerosis, alopecia areata, autoimmune adrenal
  insufficiency - and appears in this knowledge base in that role in more than a
  dozen entries. That is an association claim about regulatory variation in a
  population, not the Mendelian coding haploinsufficiency described here. Whether the
  two act on one BACH2 dosage axis is recorded below as an emerging hypothesis, not
  as a causal edge.
synonyms:

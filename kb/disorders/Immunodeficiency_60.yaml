genetic:
- name: BACH2
  gene_term:
    preferred_term: BACH2
    term:
      id: hgnc:14078
      label: BACH2
  relationship_type: CAUSATIVE
  notes: >-
    Recorded as CAUSATIVE because the mechanism is a Mendelian autosomal dominant
    haploinsufficiency, but with an important qualification: ClinGen classifies the
    BACH2 relationship to immunodeficiency 60 as Moderate, and this schema's
    CAUSATIVE value is defined against ClinGen's Definitive and Strong tiers. There is
    no enum value for the Moderate tier, so the ClinGen classification is carried in
    external_assertions and stated here rather than being lost. BACH2 is at 6q15.

    This entry's BACH2 record is the rare coding haploinsufficiency claim only. The
    same gene appears elsewhere in this knowledge base as a common-variant
    susceptibility locus with relationship_type SUSCEPTIBILITY in polygenic autoimmune
    entries; those records make a different claim and should not be merged with this
    one.
  variants:
  - name: "NM_021813.4:c.1727G>T p.(Arg576Leu)"
    description: >-
      Novel heterozygous missense variant reported in the second BRIDA family,
      substituting a highly conserved arginine and predicted deleterious. Patient
      cells showed reduced BACH2 expression and deficient repression of its target
      BLIMP1. Inherited from the father, who was clinically unaffected but had an
      extreme reduction in memory B cells - the entry's one data point on penetrance.
  evidence:

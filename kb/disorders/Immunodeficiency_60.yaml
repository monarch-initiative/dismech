notes: >-
  Provenance, stated so a reader can calibrate the entry. The spine is the founding
  report (PMID:28530713) plus the second reported family (PMID:37148421), with the
  IUIS 2022 Table 4 row and the ClinGen gene-disease validity record supplying the
  classification and the strength of the gene-disease assertion, and two mouse studies
  (PMID:23728300, PMID:15152264) supplying the mechanism of each arm.

  PMID:28530713 was originally curated from its abstract alone, and that bounded most
  of this entry. Its full text is now in the reference cache and the entry has been
  rebuilt on it (issue #10867), which changed the following: the isotype pattern is
  curated per patient rather than as an undifferentiated deficiency, the founding
  subjects' individual phenotypes are curated, the Bach2 heterozygote carries
  per-compartment readouts instead of a single "analogous lymphocyte defects" line and
  its mouse line is identified, immunoglobulin replacement and corticosteroid therapy
  are recorded as observed management, and a human RNAi knockdown is curated as an
  experimental model. The full text was not previously reachable because of a bug in
  this repository's reference-validator patch rather than because the article is
  restricted; the fix ships with the same change.

  Two limits survive. Immunoglobulin concentrations are in Supplementary Table 1, which
  PMC does not serve, so the humoral phenotype is a direction per isotype and carries
  no values or reference ranges. And the mouse mechanism evidence for the individual
  arms is still largely homozygous-null rather than heterozygous, so it establishes
  what BACH2 does rather than what halving it does; the model links say so in their
  limitations. The dose-matched claims now rest on the heterozygous mouse and on the
  human knockdown instead.

  Named Entity Confusion warning for whoever extends this entry. Searching the
  reference cache for BACH2 returns around thirty files, and almost none of them are
  about this disorder. They divide into two unrelated groups: BACH2 as a
  common-variant susceptibility locus in polygenic autoimmune disease, and BACH2 in
  lymphoma and leukemia biology. Citing either group for the Mendelian entity would
  be exactly the entity confusion the reference SOP warns about. The two background
  sources used here (PMID:29670635 and PMID:26235382) are cited only for statements
  about normal BACH2 molecular biology that they make directly, and both are graded
  INDIRECT for that reason.

  BACH2 appears as a SUSCEPTIBILITY locus in the following dismech entries, all of
  which make the polygenic association claim rather than this Mendelian one. This is
  a snapshot taken at curation (2026-09-03), not a maintained index - re-derive it
  with a grep for the gene rather than trusting the list to be current:
  Type_I_Diabetes, Crohn_Disease, Celiac_Disease, Vitiligo, Multiple_Sclerosis,
  Asthma, Psoriasis, Systemic_Lupus_Erythematosus, Ulcerative_Colitis,
  Rheumatoid_Arthritis, Ankylosing_Spondylitis, Addisons_Disease,
  Atopic_Dermatitis.

  No mechanism module currently covers regulatory T-cell differentiation failure or
  class-switch recombination failure, so there is no conforms_to target for either
  pathophysiology node. Both are recurrent across the inborn errors of immunity and
  would be reasonable module candidates.

  On quoting Table 1. The founding report's Table 1 rows are quotable as evidence
  snippets because JATS tables are now extracted into the reference cache as
  pipe-delimited rows, the same shape as an ORPHA or ICEES row. A row quote carries no
  column headers, so an explanation citing one has to say which table and which row it
  is - the rows in this entry do. Do not quote a row without that context.

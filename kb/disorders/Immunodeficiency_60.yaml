    reference_title: "An early-onset SLE patient with a novel paternal inherited BACH2 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SLE symptoms and recurrent fever were relieved by treatment with prednisone combined with tofacitinib."
    explanation: >-
      Reports the response in the one patient treated this way. Quoted as the narrow
      claim it is - symptom relief in a single case, not a trial result.
  notes: >-
    Aimed at the autoimmune arm only. The founding report is explicit that steroids in
    its own index patient did not touch the immunodeficiency or the pneumonitis, so a
    response here should not be read as disease control.
- name: Immunoglobulin Replacement Therapy
  therapeutic_modality: OTHER
  description: >-
    Intravenous immunoglobulin, given to the two founding subjects who were deficient
    in every isotype. The third subject, whose IgA alone was low against raised IgM
    and IgG, was not on replacement - so the founding report's own practice was to
    treat the pan-deficient patients and not the IgA-restricted one.
  treatment_term:
    preferred_term: intravenous immunoglobulin therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
  target_mechanisms:
  - target: Immunoglobulin deficiency
    description: >-
      Replacement substitutes for the antibody the failed class-switch and memory
      programme cannot produce. It does not act on the maturation defect itself, so it
      addresses the phenotype and leaves the pathophysiology node upstream of it
      untouched.
    evidence:
    - reference: PMID:28530713
      reference_title: "BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "| On IvIg treatment | Yes | Yes | No |"
      explanation: >-
        Table 1 records replacement in the two subjects whose isotypes were uniformly
        low and not in the third, which is what ties the treatment to this phenotype.
  evidence:
  - reference: PMID:28530713
    reference_title: "BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "| On IvIg treatment | Yes | Yes | No |"
    explanation: >-
      Table 1 of the founding report, the row recording immunoglobulin replacement
      status for each of the three subjects.
  notes: >-
    Recorded as observed management in three patients, not as a trial result or a
    guideline recommendation - no source consulted states a dosing regimen, a target
    trough, or an outcome under replacement for BRIDA. The modality is OTHER rather
    than PROTEIN_REPLACEMENT: IVIg is pooled plasma-derived polyclonal antibody, and
    PROTEIN_REPLACEMENT is defined in the schema as recombinant protein or enzyme
    replacement, which this is not. Earlier versions of this entry
    carried the absence of this treatment as a known gap; it was closed by Table 1 of
    the founding report, which reached the reference cache only once JATS tables were
    extracted (issue #10867).
- name: Corticosteroid Therapy
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Systemic corticosteroids for the inflammatory features. In the index patient they
    resolved the fever and the pancytopenia, and later controlled most of her
    autoimmune manifestations - while leaving the immunodeficiency and the pneumonitis
    unchanged. That split is the useful clinical fact: steroids treat the arm of the
    disease driven by the regulatory T-cell failure and do nothing for the arm driven
    by the B-cell maturation failure.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:24261
        label: glucocorticoid
  target_mechanisms:
  - target: Non-infectious fever
    description: >-
      The fever resolved on corticosteroids, which is also what marks it as
      immune-mediated rather than infective.
    evidence:
    - reference: PMID:28530713
      reference_title: "BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Fever and cytopenia improved with corticosteroids, but lymphopenia, deficiency in immunoglobulin (Ig)M, IgG, IgA and IgE, ongoing colitis, lung infiltrates and recurrent upper respiratory tract infections persisted"
      explanation: Names the fever as one of the two features that responded.
  - target: Pancytopenia
    description: >-
      The cytopenia resolved on corticosteroids, in the same course as the fever.
    evidence:
    - reference: PMID:28530713
      reference_title: "BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Fever and cytopenia improved with corticosteroids, but lymphopenia, deficiency in immunoglobulin (Ig)M, IgG, IgA and IgE, ongoing colitis, lung infiltrates and recurrent upper respiratory tract infections persisted"
      explanation: Names the cytopenia as the other feature that responded.
  evidence:
  - reference: PMID:28530713
    reference_title: "BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fever and cytopenia improved with corticosteroids, but lymphopenia, deficiency in immunoglobulin (Ig)M, IgG, IgA and IgE, ongoing colitis, lung infiltrates and recurrent upper respiratory tract infections persisted"
    explanation: >-
      Both halves of the claim in one sentence: what responded, and what did not.
  - reference: PMID:28530713
    reference_title: "BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Many of the autoimmune phenomena in our patient with the L24P mutation have been successfully treated with corticosteroids although this has not reduced her chronic variable immunodeficiency nor her pneumonitis"
    explanation: >-
      The longer-term result, and the explicit statement of what did not respond. It
      supports this treatment as described - effective against the autoimmune arm and
      not against the immunodeficiency or the pneumonitis - rather than supporting
      corticosteroids as a treatment for the disorder as a whole.
  notes: >-
    Bound to the generic Pharmacotherapy action with a CHEBI agent because the source
    names no specific steroid. NCIT:C2322 is the real Corticosteroid term but fails the
    ChemicalEntityTerm dynamic enum, so CHEBI:24261 is used instead - the same choice
    recorded in E-Cigarette_or_Vaping_Product_Use-Associated_Lung_Injury.
diagnosis:
- name: Pulmonary surveillance in BACH2 carriers
  description: >-
    Periodic pulmonary assessment is recommended for patients with BACH2 mutations.
    The recommendation follows from the sinopulmonary infection phenotype and the
    structural lung damage that recurrent infection produces in antibody-deficient
    patients, and the authors making it are explicit that the case base is small.
  evidence:
  - reference: PMID:33864888
    reference_title: "Molecular diagnosis of childhood immune dysregulation, polyendocrinopathy, and enteropathy, and implications for clinical management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "although there are limited cases reported, current evidence also supports pulmonary screening for patients with mutations in BACH2, ITCH and TOM1"
    explanation: >-
      States the surveillance recommendation and, in the same sentence, the limited
      case base it rests on.
  notes: >-
    Recorded under diagnosis rather than treatments because it is a monitoring
    action, not a therapeutic one.
animal_models:
- name: Bach2-heterozygous mouse (BRIDA report)
  species: Mouse
  genotype: Bach2 heterozygous (Bach2+/-)
  publication: PMID:28530713
  description: >-
    The dose-matched model. Because BRIDA is a haploinsufficiency, a heterozygous
    mouse rather than a knockout is the construct that reproduces the human genetic
    state, and the founding report shows it produces analogous lymphocyte defects.
  notes: >-
    Same line as the three model entries below, and no longer an open question: the
    founding report's methods state that its Bach2 animals "were generated and housed
    as previously described", citing the study curated here as PMID:23728300. So this
    heterozygote and the heterozygote in that study are one line, characterized twice.
    They are two experiments and not two independent observations of the line - do not
    count them as replication of each other.
  modeled_mechanisms:
  - target: BACH2 Haploinsufficiency
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Heterozygous loss in mouse reproduces the molecular state of heterozygous loss in
      humans - reduced Bach2 message and protein with de-repressed Prdm1 - which is
      what licenses reading mouse Bach2 dosage biology onto this disorder.
    limitations: >-
      The mouse is normal until it is challenged. Bulk CD4+, CD8+, B-cell and
      plasma-cell numbers are unchanged in unimmunized animals, whereas the patients
      have a progressive T-cell lymphopenia, so the heterozygote does not model the
      resting human phenotype and its informative readouts all come from immunization
      or from subset gating rather than from counts.

      Keeping the dose-match versus dose-dependence distinction this entry draws: dose
      match is a property of the construct, and every heterozygote here has it by
      construction. Dose dependence is a demonstrated graded response, and it needs a
      genotype comparison. This model now has both - the full text compares Bach2+/-
      against wild-type for message, protein, Prdm1, and the immunization readouts -
      which is why the fidelity here is HIGH rather than the MODERATE that the
      abstract-only record supported.
    readouts:
    - name: Bach2 message and protein in heterozygous animals
      target: BACH2 Haploinsufficiency
      direction: DECREASED
      interpretation: >-
        The gene-dosage lesion itself, confirmed at both message and protein level.
      evidence:
      - reference: PMID:28530713
        reference_title: "BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "We found that Bach2+/− mice manifest reduced Bach2 mRNA (Fig. 6a) and protein expression (Fig. 6b) together with elevated Prdm1 mRNA"
        explanation: >-
          Reports the reduced Bach2 and the de-repressed Prdm1 in one sentence, which is
          the same molecular signature reported in the patients.
    - name: Resting lymphocyte subset counts in heterozygous animals
      target: BACH2 Haploinsufficiency
      direction: UNCHANGED
      interpretation: >-
        A negative result, kept because it bounds the model: halving Bach2 does not by
        itself deplete the lymphoid compartments in an unchallenged animal.
      evidence:
      - reference: PMID:28530713
        reference_title: "BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "There was no difference in the numbers of CD4+ and CD8+ T cells, B cells or plasma cells in unchallenged mice"
        explanation: Reports the measurement behind this readout, as a negative finding.
    evidence:
    - reference: PMID:28530713
      reference_title: "BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We observed analogous lymphocyte defects in Bach2-heterozygous mice."
      explanation: >-
        Supports treating the heterozygous mouse as informative for the human
        haploinsufficient state.
  - target: Impaired Memory B Cell Development
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      On immunization the heterozygote fails at exactly the step the patients fail at:
      it barely generates class-switched B cells or plasma cells, and its germinal
      centers are reduced. This is the dose-matched counterpart of the patients'
      impaired in vitro class switching, and it is the readout that most directly
      connects halving BACH2 to the humoral phenotype.
    limitations: >-
      Requires deliberate immunization to appear; unchallenged heterozygotes have normal
      B-cell and plasma-cell numbers. The readout is also a single model antigen
      (NP-CGG in alum), so it speaks to the T-dependent IgG response and not to the
      mucosal IgA arm that dominates the patients' isotype pattern.
    readouts:
    - name: Class-switched B cells and plasma cells after immunization
      target: Impaired Memory B Cell Development
      direction: DECREASED
      interpretation: >-
        The class-switch and terminal-differentiation failure at matched gene dosage.
      evidence:
      - reference: PMID:28530713
        reference_title: "BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Immunized Bach2+/− mice exhibited minimal induction of both IgG1 class switched-B220hiCD138− B cells and B220loCD138+ plasma cells compared to WT mice"
        explanation: Reports the measurement behind this readout.
    - name: Germinal center B cell proportion after immunization
      target: Impaired Memory B Cell Development
      direction: DECREASED
      interpretation: >-
        Locates part of the failure upstream of switching, in the germinal center
        reaction that class switching and memory formation depend on.
      evidence:
      - reference: PMID:28530713
        reference_title: "BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The proportion of germinal center B220+Ki67+Bcl6+ B cells was also reduced in Bach2+/− mice"
        explanation: Reports the measurement behind this readout.
    evidence:
    - reference: PMID:28530713
      reference_title: "BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Immunized Bach2+/− mice exhibited minimal induction of both IgG1 class switched-B220hiCD138− B cells and B220loCD138+ plasma cells compared to WT mice"
      explanation: >-
        Supports treating the heterozygote as informative for the B-cell arm at the
        human gene dosage, which the homozygous nulls below cannot do.
  - target: Gut-Homing Receptor Upregulation on CD4+ T Cells
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The heterozygote reproduces the patients' receptor shift - more CCR9+ and beta-7
      integrin+ CD4+ T cells, alongside fewer FoxP3+ cells - at the same gene dosage.
    limitations: >-
      No colitis is reported in these animals, so the model supports the cellular shift
      without demonstrating that it is sufficient for the intestinal disease. The link
      targets the gut-homing node specifically because T-bet, the marker of the TH1
      node, was not measured in these mice.
    readouts:
    - name: Gut-homing receptor expression on CD4+ T cells
      target: Gut-Homing Receptor Upregulation on CD4+ T Cells
      direction: INCREASED
      interpretation: >-
        The tissue-addressing half of this node, present at halved Bach2 dosage.
      evidence:
      - reference: PMID:28530713
        reference_title: "BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "but Bach2+/− mice did have a small but significant reduction in FoxP3+ cells together with significant increases in CCR9+ and β7-integrin+ cells in CD4+ T cells"
        explanation: >-
          Reports both measurements behind this readout in one sentence, including the
          authors' own qualification that the Treg reduction is small.
    evidence:
    - reference: PMID:28530713
      reference_title: "BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "but Bach2+/− mice did have a small but significant reduction in FoxP3+ cells together with significant increases in CCR9+ and β7-integrin+ cells in CD4+ T cells"
      explanation: >-
        Supports treating the heterozygote as informative for the effector-skewing node
        at the human gene dosage: the same paired shift the patients show, in an animal
        carrying the same halved dosage.
- name: Bach2-heterozygous mouse (Igarashi line, Treg characterization)
  species: Mouse
  genotype: Bach2 heterozygous (Bach2+/-)
  publication: PMID:23728300
  description: >-
    The best dose-matched evidence in this entry for the regulatory T-cell arm.
    Heterozygotes of the Igarashi null line have reduced Treg frequencies, so Treg
    formation is Bach2 gene-dose dependent rather than merely Bach2-dependent - which
    is what makes the Treg defect a plausible consequence of human haploinsufficiency
    rather than an artifact of complete loss.
  modeled_mechanisms:
  - target: Impaired Regulatory T Cell Differentiation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Halving Bach2 reduces Treg frequency in mouse, matching both the gene dosage and
      the compartment of the human disease.
    limitations: >-
      Mouse rather than human, and the frequency reduction is reported without the
      functional suppression assays that would show whether the remaining Tregs work.
      That caveat is about Treg function rather than Treg differentiation, so it does
      not weaken the model's fidelity for this node, which is a differentiation node -
      hence HIGH here. The dose-match versus dose-dependence distinction this entry
      draws applies to both heterozygote entries and no longer separates them: both are
      heterozygotes, so both match the human gene dosage by construction, and both now
      compare genotypes against wild-type, so both demonstrate a graded response rather
      than only a matched dose. What still separates them is which compartment each one
      measured. This study measured Treg frequency, which is the node here; the BRIDA
      report measured Bach2 message and protein, the immunization response and the CD4+
      subset shifts, and is linked to those nodes instead. Same line as the null entries
      below and as the BRIDA heterozygote above, so none of them is an independent
      replication of the others.
    readouts:
    - name: Regulatory T cell frequency in heterozygous animals
      target: Impaired Regulatory T Cell Differentiation
      direction: DECREASED
      interpretation: >-
        Treg formation responds to Bach2 gene dosage, not only to its complete absence.
      evidence:
      - reference: PMID:23728300
        reference_title: "BACH2 represses effector programs to stabilize T(reg)-mediated immune homeostasis."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Treg cell formation was Bach2 gene-dose dependent since mice heterozygous for the KO allele had reduced frequencies of Treg cells"
        explanation: Reports the measurement behind this readout.
    evidence:
    - reference: PMID:23728300
      reference_title: "BACH2 represses effector programs to stabilize T(reg)-mediated immune homeostasis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Treg cell formation was Bach2 gene-dose dependent since mice heterozygous for the KO allele had reduced frequencies of Treg cells"
      explanation: >-
        Supports treating the heterozygote as informative for the human
        haploinsufficient Treg defect, at matched gene dosage.
- name: Bach2-null mouse (Igarashi line, Treg characterization)
  species: Mouse
  genotype: Bach2 knockout (homozygous null)
  publication: PMID:23728300
  description: >-
    The Igarashi-derived Bach2 null, characterized here for the regulatory T-cell
    compartment. It is a null rather than a heterozygote, so it speaks to what BACH2
    does, not to what halving it does.
  notes: >-
    This is the same mouse line as the class-switching entry below and as the
    heterozygote entry above - one line from one lab, characterized in two studies.
    The entries are split so each publication field matches the evidence on its own
    links, not because the lines are independent. Do not read the three as independent
    replication.
  modeled_mechanisms:
  - target: Impaired Regulatory T Cell Differentiation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Complete Bach2 loss prevents efficient Treg formation and diverts cells destined
      for the regulatory lineage into effector lineages, producing lethal inflammation.
    limitations: >-
      Homozygous null, whereas the human disease is heterozygous; the mouse phenotype
      is correspondingly more severe than BRIDA and cannot be read as a dose-matched
      prediction.
    readouts:
    - name: Regulatory T cell formation
      target: Impaired Regulatory T Cell Differentiation
      direction: DECREASED
      interpretation: Loss of the regulatory compartment this node describes.
      evidence:
      - reference: PMID:23728300
        reference_title: "BACH2 represses effector programs to stabilize T(reg)-mediated immune homeostasis."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "BACH2 was required for efficient formation of regulatory (Treg) cells and consequently for suppression of lethal inflammation in a manner that was Treg-cell-dependent."
        explanation: Reports the measurement behind this readout.
    evidence:
    - reference: PMID:23728300
      reference_title: "BACH2 represses effector programs to stabilize T(reg)-mediated immune homeostasis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "its absence during Treg polarization resulted in inappropriate diversion to effector lineages"
      explanation: >-
        Supports treating the knockout as informative for the Treg differentiation node.
- name: Bach2-null mouse (Igarashi line, class-switching characterization)
  species: Mouse
  genotype: Bach2 knockout (homozygous null)
  publication: PMID:15152264
  description: >-
    The same Igarashi-derived Bach2 null, characterized here for the B-cell arm. This
    is the original report of the line; the regulatory T-cell study above used it
    rather than deriving its own.
  notes: >-
    Same line as the two entries above. Curated as its own model so this publication
    field matches the evidence on its link, not because the line is independent.
  modeled_mechanisms:
  - target: Impaired Memory B Cell Development
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Bach2-null B cells fail to class switch efficiently while retaining IgM output
      and abundant Blimp-1 and XBP-1 expression, which localizes the defect to class
      switch recombination rather than to terminal differentiation.
    limitations: >-
      Homozygous null rather than the human heterozygous dose, and the readout is
      class switching in mouse rather than memory B-cell counts in patients.
    readouts:
    - name: Class switch recombination efficiency
      target: Impaired Memory B Cell Development
      direction: DECREASED
      interpretation: >-
        The specific B-cell step that fails when BACH2 is absent.
      evidence:
      - reference: PMID:15152264
        reference_title: "The transcriptional programme of antibody class switching involves the repressor Bach2."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "However, they failed to undergo efficient CSR."
        explanation: Reports the measurement behind this readout.
    evidence:
    - reference: PMID:15152264
      reference_title: "The transcriptional programme of antibody class switching involves the repressor Bach2."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Genetic ablation of Bach2 in mice revealed that Bach2 was required for both T-cell-independent and T-cell-dependent IgG responses and SHM."
      explanation: >-
        Supports treating the knockout as informative for the B-cell arm of this entry.
experimental_models:
- name: BACH2 RNAi knockdown in primary human T and B cells
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: primary cells from healthy human donors
  culture_system: >-
    Nucleofection of BACH2-targeting siRNA/DsiRNA into purified healthy-donor CD4+ T
    cells or naive B cells, achieving roughly 50 percent knockdown, followed by
    polyclonal or class-switch-inducing stimulation.
  publication: PMID:28530713
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: CD4-positive helper T cell
    term:
      id: CL:0000492
      label: CD4-positive helper T cell
  - preferred_term: naive B cell
    term:
      id: CL:0000788
      label: naive B cell
  description: >-
    The dose-matched human system, and the strongest causal evidence in this entry.
    Every other model here is either a mouse or a patient: the mouse matches the dosage
    but not the species, and the patients match the species but cannot separate the
    BACH2 lesion from everything else in their genomes and histories. Knocking BACH2
    down by about half in healthy donor cells does both at once - human cells, human
    gene dosage, one variable changed - and it reproduces the patients' phenotype in
    both lineages: PRDM1 rises, CD4+ T cells proliferate less, and class switching to
    IgG and IgA is suppressed.
  notes: >-
    A knockdown is not a haploinsufficiency. The reduction is transient, its depth is
    approximate rather than exactly one allele's worth, and it acts on mature cells
    rather than across development - so it shows that acutely halving BACH2 is
    sufficient for these defects, not that the patients' lifelong half-dosage produces
    them by the same route. Curated as an experimental model rather than as an animal
    model because the system is human primary cells; see the schema's note that
    whole-organism animal models never belong in this section.
  modeled_mechanisms:
  - target: BACH2 Haploinsufficiency
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reducing BACH2 by about half in healthy human lymphocytes reproduces the
      patients' cellular phenotype in both lineages, which is what converts the
      correlation between low BACH2 and the BRIDA phenotype into a causal claim.
    limitations: >-
      Acute, incomplete and transient knockdown in mature cells, not a germline
      heterozygous state, so it cannot speak to developmental consequences or to the
      progressive features of the disease. Knockdown depth is reported as approximately
      50 percent rather than measured per experiment.
    readouts:
    - name: PRDM1 message after BACH2 knockdown in CD4+ T cells
      target: BACH2 Haploinsufficiency
      direction: INCREASED
      interpretation: >-
        De-repression of the direct BACH2 target, matching what is measured in patient
        cells.
      evidence:
      - reference: PMID:28530713
        reference_title: "BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Silencing BACH2 in control CD4+ T cells led to a significant rise in PRDM1 mRNA"
        explanation: Reports the measurement behind this readout.
    evidence:
    - reference: PMID:28530713
      reference_title: "BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we silenced BACH2 expression in healthy control T and B cells using RNAi by ~50% and carried out functional phenotyping"
      explanation: >-
        States the system and the knockdown depth, which is what makes it dose-matched
        to a heterozygous human and therefore informative for this node.
    - reference: PMID:28530713
      reference_title: "BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Thus, experimental silencing of BACH2 in healthy T and B cells recapitulated the phenotype seen in primary cells of the patients."
      explanation: >-
        The authors' own summary that the knockdown reproduces the patient phenotype,
        which is the claim this model link makes.
  - target: Impaired Memory B Cell Development
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Halving BACH2 in healthy human B cells is sufficient to suppress class switching
      to IgG and IgA - the two isotypes whose deficiency dominates the patients'
      humoral phenotype.
    limitations: >-
      Measures class switching in culture rather than memory B-cell accumulation in
      vivo, so it substantiates the isotype-switching annotation on this node and not
      the memory-compartment annotation. Healthy donor cells, so it says what BACH2
      dosage does and not what the specific BRIDA alleles do.
    readouts:
    - name: In vitro class switch recombination to IgG and IgA after BACH2 knockdown
      target: Impaired Memory B Cell Development
      direction: DECREASED
      interpretation: >-
        The isotype-switching step of this node, shown to depend on BACH2 dosage in
        human cells.
      evidence:
      - reference: PMID:28530713
        reference_title: "BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "silencing BACH2 in healthy control B cells, significantly suppressed in vitro class switch recombination towards the IgG and IgA isotypes"
        explanation: Reports the measurement behind this readout.
    evidence:
    - reference: PMID:28530713
      reference_title: "BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "silencing BACH2 in healthy control B cells, significantly suppressed in vitro class switch recombination towards the IgG and IgA isotypes"
      explanation: >-
        Supports treating the knockdown as informative for the class-switch arm of this
        node, in human cells at approximately the human heterozygous dosage.
mechanistic_hypotheses:
- hypothesis_group_id: bach2_dosage_axis
  hypothesis_label: >-
    Common regulatory variation and rare coding haploinsufficiency at BACH2 act on one
    gene-dosage axis
  status: EMERGING
  description: >-
    BACH2 occupies an unusual position: the same gene is a recurrent common-variant
    susceptibility locus across many polygenic autoimmune diseases and, separately,
    the cause of a Mendelian inborn error of immunity through coding
    haploinsufficiency. The hypothesis is that these are two ends of one dosage
    continuum - that regulatory variants shifting BACH2 expression modestly across a
    population produce autoimmune susceptibility, while a coding lesion halving it
    produces overt immune dysregulation with immunodeficiency.

    This is recorded as a hypothesis and deliberately not drawn as a causal edge. The
    susceptibility associations and the Mendelian mechanism are established
    separately; that they share a dosage mechanism is an inference, and no cached
    source tests it. Deciding it would need expression-level data linking the risk
    haplotypes to BACH2 dosage in the relevant lymphocyte compartments.
  evidence:
  - reference: PMID:28530713
    reference_title: "BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Single-nucleotide variants in the BACH2 locus are associated with several autoimmune diseases, but BACH2 mutations that cause Mendelian monogenic primary immunodeficiency have not previously been identified."
    explanation: >-
      States both ends of the proposed axis in one sentence, and is the founding
      report's own framing of why the Mendelian entity was worth looking for.
  - reference: PMID:28530713
    reference_title: "BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "genes that cause monogenic haploinsufficient diseases were substantially enriched for TFs and SE architecture"
    explanation: >-
      The mechanism the founding report proposes for why one locus supports both a
      common-variant association signal and a rare dosage disease - super-enhancer
      architecture makes transcription-factor genes dosage-sensitive.
  - reference: PMID:23728300
    reference_title: "BACH2 represses effector programs to stabilize T(reg)-mediated immune homeostasis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Genetic polymorphisms within a single locus encoding the transcription factor BACH2 are associated with numerous autoimmune and allergic diseases including asthma, Crohn's disease, coeliac disease, vitiligo, multiple sclerosis and type 1 diabetes."
    explanation: >-
      Enumerates the common-variant end of the axis, and names the same diseases that
      carry BACH2 as a susceptibility locus elsewhere in this knowledge base.
  - reference: PMID:22561518
    reference_title: "Genome-wide association analyses identify 13 new susceptibility loci for generalized vitiligo."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "CLNK (P = 1.56 × 10(-8)), BACH2 (P = 2.53 × 10(-8)), SLA (P = 1.58 × 10(-8))"
    explanation: >-
      One concrete instance of the common-variant end, with its association statistic.
  - reference: PMID:35748970
    reference_title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Haploinsufficiency for a critical lineage specification transcription factor"
    explanation: >-
      Establishes the Mendelian end of the proposed axis as an explicitly
      dosage-dependent mechanism, which is what makes a shared-dosage model
      conceivable in the first place.
  notes: >-
    See the entry-level notes for the list of dismech entries carrying BACH2 as a
    susceptibility locus.
discussions:
- discussion_id: bach2_imd60_humoral_phenotype_uncurated
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Memory B Cell Development
  - phenotypes#Recurrent sinopulmonary infections
  prompt: >-
    Which immunoglobulin isotypes fall in immunodeficiency 60, by how much, and does
    the picture meet criteria for common variable immunodeficiency?
  rationale: >-
    Two of the three parts are now answered from the founding report's full text, and
    the third is not.

    Which isotypes: not the same ones in every patient. Two founding subjects were low
    in IgM, IgG, IgA and IgE together; the third, carrying the same E788K allele as her
    affected father, had low IgA against raised IgM and IgG. IgA is the only isotype
    low in all three, and a further family carrying R576L was also IgA deficient. The
    pattern therefore does not track the variant, which rules out the simplest reading
    - that each allele produces its own humoral picture - and leaves modifiers, age or
    ascertainment as the explanation. All of this is now curated: the isotype spread on
    the Immunoglobulin deficiency phenotype, IgA separately as the consistent one.

    CVID criteria: the authors state that all three subjects developed "a chronic
    variable immunodeficiency" characterised by recurrent respiratory infection with
    failure to respond to vaccination, and the vaccine-response failure is curated as
    its own phenotype. That is the authors' characterisation rather than a formal
    application of ESID or ICON diagnostic criteria, and this entry does not upgrade it
    into one. The separate question of whether the disorder belongs with the antibody
    deficiencies at all is tracked in the IUIS-versus-ClinGen discussion below.

    By how much: still open, and now for a specific and probably permanent reason. The
    immunoglobulin concentrations are reported in Supplementary Table 1, which is not
    part of the article record served by PMC, so no accessible source gives a value.
    Table 1 of the main article gives only Low, Normal or High per isotype. Until a
    further family is reported with values in the main text, this entry can record the
    direction of each isotype but not its magnitude, and cannot carry reference ranges
    for the humoral phenotype.

    The plasmablast and class-switch assay results named in the original version of
    this gap are no longer missing and are curated on the memory B-cell node.
  evidence:
  - reference: PMID:28530713
    reference_title: "BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "| IgG | Low | Low | High * |"
    explanation: >-
      Table 1, the IgG row. It is the sharpest statement of the non-uniformity: the
      third subject's IgG is not merely normal but raised, which is why this entry does
      not describe BRIDA as a hypogammaglobulinemia.
  - reference: PMID:28530713
    reference_title: "BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "| IgE | Low | Low | Normal |"
    explanation: >-
      Cited as the boundary of what the accessible record contains. Table 1 gives each
      isotype as a category and never as a concentration, so the founding report - the
      only source that measured these patients - does not bear on the magnitude
      question this gap now turns on.
- discussion_id: bach2_repressor_direction_paradox
  kind: OPEN_QUESTION
  status: RESOLVED
  attaches_to:
  - pathophysiology#Impaired Memory B Cell Development
  prompt: >-
    If BACH2 suppresses immunoglobulin production, why does losing it cause antibody
    deficiency rather than excess antibody?
  rationale: >-
    BACH2 represses immunoglobulin production, and in normal memory B cells plasma-cell
    differentiation proceeds by inducing BLIMP1 and downregulating BACH2. Read naively,
    halving BACH2 should release antibody output rather than reduce it.
  resolution_note: >-
    Answered by the Bach2 knockout. Bach2-null B cells still produce IgM and still
    express Blimp-1 and XBP-1 abundantly, so plasmacytic differentiation itself does
    not require BACH2 - what fails is class switch recombination specifically. The
    abundance is itself informative: BACH2 represses BLIMP1, so losing BACH2
    de-represses the plasma-cell programme rather than leaving it untouched, and the
    cell terminally differentiates without having switched isotype. BACH2 is
    therefore not a brake on antibody output in general; it is required for the
    class-switch and somatic-hypermutation programme while restraining premature
    terminal differentiation. Losing it yields antibody that is present but unswitched
    and unmutated, which is a functional humoral deficiency rather than an excess. The
    memory B-cell node is worded accordingly.

    The dose caveat this note used to end on is now closed. The resolution rested on a
    homozygous null mouse; the founding report's full text shows the same thing in
    human cells at the human gene dosage, by knocking BACH2 down about 50 percent in
    healthy donor B cells and finding class switching to IgG and IgA suppressed. So the
    class-switch dependency is a property of BACH2 dosage in human B cells, not an
    artifact of complete loss in mouse.

    One thing the full text complicates rather than settles. The null mouse showed
    plasmacytic differentiation intact, which is what let the answer be "switching
    fails, terminal differentiation does not". Patient naive B cells stimulated with
    IL-21 in vitro show impaired plasmablast generation as well as impaired switching.
    Those need not conflict - different species, different dosage, different stimulus -
    but the clean separation should not be over-read. This entry annotates isotype
    switching on the memory B-cell node and does not annotate plasma-cell
    differentiation, because the human plasmablast finding is a single in vitro assay
    and the mouse evidence points the other way.
  evidence:
  - reference: PMID:15152264
    reference_title: "The transcriptional programme of antibody class switching involves the repressor Bach2."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "When stimulated in vitro, Bach2-deficient B cells produced IgM, as did wild-type cells, and abundantly expressed Blimp-1 (refs 9, 10) and XBP-1 (ref. 11), critical regulators of the plasmacytic differentiation, indicating that Bach2 was not required for the plasmacytic differentiation itself. However, they failed to undergo efficient CSR."
    explanation: >-
      The sentence that dissolves the paradox - it separates plasmacytic
      differentiation, which is intact without BACH2, from class switching, which is not.
  - reference: PMID:28530713
    reference_title: "BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "silencing BACH2 in healthy control B cells, significantly suppressed in vitro class switch recombination towards the IgG and IgA isotypes"
    explanation: >-
      Closes the dose caveat: the same dependency, in human B cells, at approximately
      the heterozygous dosage rather than in a homozygous null mouse.
- discussion_id: bach2_imd60_penetrance
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - genetic#BACH2
  - inheritance#Autosomal dominant
  prompt: >-
    Is BRIDA fully penetrant, and can a BACH2 carrier have the cellular phenotype
    without the disease?
  rationale: >-
    In the second reported family the R576L variant was inherited from the father, who
    had no obvious symptoms yet showed an extreme reduction in memory B cells. That is
    a carrier with the laboratory phenotype and without the clinical one, which is the
    signature of incomplete penetrance or of a threshold effect requiring a second hit.
    It matters practically: it means an asymptomatic parent cannot be assumed to be a
    non-carrier, and it bears on how a family is counselled. One family is not enough
    to establish a penetrance estimate, and no source consulted here reports carrier
    counts, so this is a single observation rather than a quantified claim.
  evidence:
  - reference: PMID:37148421
    reference_title: "An early-onset SLE patient with a novel paternal inherited BACH2 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, extreme reduction of memory B cells was detected in the patient's father, although he had no obvious symptoms."
    explanation: >-
      The observation itself - cellular phenotype present, clinical phenotype absent,
      in an obligate carrier.
- discussion_id: bach2_imd60_phenotype_expansion
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - disease#
  - phenotypes#
  prompt: >-
    How wide is the BRIDA phenotype beyond immunoglobulin deficiency and colitis?
  rationale: >-
    Reports after the founding description have attached progressively more
    autoimmunity to heterozygous BACH2 variants - early-onset systemic lupus with
    juvenile dermatomyositis and IgA deficiency in one family, and autoimmune
    enteropathy alongside T-cell large granular lymphocytic leukemia, type 1 diabetes,
    pure red cell aplasia and celiac disease in another. Each is a single case, and
    the second carries obvious confounders: an HLA-DQ8 allele and a concurrent
    clonal lymphoproliferative disorder that is itself associated with autoimmunity.
    So these are not curated as phenotypes of this entry. The open question is whether
    BRIDA is a broad autoimmunity-predisposing state whose reported range is still
    growing, or whether single-case reports are accumulating around a gene that is
    also a common autoimmune susceptibility locus. Deciding it needs a case series,
    not more single reports.
  evidence:
  - reference: PMID:37148421
    reference_title: "An early-onset SLE patient with a novel paternal inherited BACH2 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we describe a patient with BRIDA presenting with early-onset SLE, juvenile dermatomyositis, and IgA deficiency."
    explanation: One reported expansion of the phenotype, in a single patient.
  - reference: PMID:40386599
    reference_title: "Autoimmune enteropathy associated with T cell large granular lymphocytic leukemia in a patient with BACH2 mutation: a case report."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "She carries an HLA-DQ8 allele and a germline heterozygous mutation of BACH2."
    explanation: >-
      The second reported expansion, quoted with the confounding HLA allele in the same
      sentence because that is precisely why this entry does not curate it as a
      phenotype. INDIRECT for the same reason.
- discussion_id: bach2_imd60_iuis_versus_clingen_panel
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - disease#
  prompt: >-
    Should immunodeficiency 60 be grouped with the antibody deficiencies or with the
    diseases of immune dysregulation?
  rationale: >-
    The two authorities pull in different directions and both are defensible. ClinGen
    curated the gene through its Antibody Deficiencies Gene Curation Expert Panel,
    which reflects how the disorder presents - sinopulmonary infection and humoral
    deficiency. IUIS places it in Table 4 with the regulatory T-cell defects, which
    reflects the mechanism and the infiltrative colitis. This entry follows IUIS,
    because the Tregopathy classification is corroborated independently and because
    the lymphocytic colitis is not explicable as a consequence of antibody deficiency.
    The disagreement is recorded rather than hidden, since a reader coming from the
    ClinGen side will expect the other answer.
  evidence:
  - reference: CGGV:assertion_2473560a-6e5c-4342-a6e2-c89e37f4cc71-2023-02-21T180000.000Z
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "BACH2 | HGNC:14078 | immunodeficiency 60 | MONDO:0032723 | AD | Moderate | SOP9 | Antibody Deficiencies Gene Curation Expert Panel | 2023-02-21T18:00:00.000Z"
    explanation: >-
      Names the ClinGen expert panel that curated the gene, which is the antibody
      deficiency panel rather than an immune dysregulation panel.
references:
- reference: PMID:28530713
  title: "BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency."
  findings:
  - statement: >-
      The founding report. Describes the syndrome, names it BRIDA, attributes it to BACH2
      haploinsufficiency, states the immunoglobulin deficiency and intestinal inflammation,
      gives the protein-destabilization mechanism, and reports the Bach2-heterozygous
      mouse. Cached as full text, including Table 1, which carries the per-subject isotype
      pattern and immunoglobulin-replacement status. The immunoglobulin concentrations
      themselves are in Supplementary Table 1, which is not part of the retrievable article.
- reference: PMID:37148421
  title: "An early-onset SLE patient with a novel paternal inherited BACH2 mutation."
  findings:
  - statement: >-
      The second reported family. Supplies the R576L variant, reduced BACH2 expression and
      deficient BLIMP1 repression in patient cells, an unaffected carrier father with an
      extreme memory B-cell reduction, and the prednisone plus tofacitinib response.
- reference: PMID:23728300
  title: "BACH2 represses effector programs to stabilize T(reg)-mediated immune homeostasis."
  findings:
  - statement: >-
      Mouse knockout establishing that BACH2 is required for regulatory T-cell formation and
      that its absence diverts cells to effector lineages. The basis of the Treg arm.
- reference: PMID:15152264
  title: "The transcriptional programme of antibody class switching involves the repressor Bach2."
  findings:
  - statement: >-
      Mouse knockout localizing the B-cell defect to class switch recombination while showing
      plasmacytic differentiation is intact. Resolves the repressor-direction paradox.
- reference: PMID:40386599
  title: "Autoimmune enteropathy associated with T cell large granular lymphocytic leukemia in a patient with BACH2 mutation: a case report."
  findings:
  - statement: >-
      Single case of autoimmune enteropathy with T-LGL in a germline heterozygous BACH2
      carrier. Cited only in the phenotype-expansion discussion, not as a phenotype.
- reference: PMID:39826876
  title: "Curation of gene-disease relationships in primary antibody deficiencies using the ClinGen validation framework."
  findings:
  - statement: >-
      The ClinGen Antibody Deficiencies expert panel curation effort behind the Moderate
      classification, and the definition of the tier system.
- reference: PMID:35748970
  title: "Human Inborn Errors of Immunity: 2022 Update on the Classification from the International Union of Immunological Societies Expert Committee."
  findings:
  - statement: >-
      Places BACH2 deficiency in Table 4 (diseases of immune dysregulation) with
      autosomal dominant inheritance, progressive T-cell lymphopenia, impaired memory
      B-cell development, haploinsufficiency for a lineage specification transcription
      factor, and lymphocytic colitis with sinopulmonary infections. The backbone of
      this entry.
- reference: PMID:33996698
  title: "Different Apples, Same Tree: Visualizing Current Biological and Clinical Insights into CTLA-4 Insufficiency and LRBA and DEF6 Deficiencies."
  findings:
  - statement: >-
      Lists BACH2 deficiency among the monogenic Tregopathies alongside IPEX, CD25
      deficiency and STAT3 gain-of-function, which grounds the regulatory T-cell arm of
      the mechanism.

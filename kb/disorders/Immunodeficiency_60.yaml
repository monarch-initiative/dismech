- name: Gut-Homing Receptor Upregulation on CD4+ T Cells
  biological_scale: CELLULAR
  description: >-
    The addressing half, and what makes the tissue infiltration land in the gut. A Treg
    deficit on its own predicts autoimmunity without predicting where it will appear;
    in BRIDA the CD4+ compartment carries raised levels of the two receptors that
    direct a T cell to intestinal tissue, CCR9 and beta-7 integrin. The same shift is
    reproduced at matched gene dosage in the heterozygous mouse, which is what makes it
    a consequence of halving BACH2 rather than a reaction to established colitis.
  cell_types:
  - preferred_term: CD4-positive helper T cell
    term:
      id: CL:0000492
      label: CD4-positive helper T cell
  notes: >-
    Deliberately unbound. The observation is receptor expression on the cells, not a
    measurement of migration, and GO has no term for homing to intestinal tissue -
    binding T cell migration here would assert something the source does not report.
    This node was split out of a combined TH1-and-gut-homing node so that the TH1 claim
    could keep its GO binding without this one riding along under it.
  evidence:

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we describe a syndrome of BACH2-related immunodeficiency and autoimmunity (BRIDA) that results from BACH2 haploinsufficiency."
    explanation: >-
      The defining report's statement that the syndrome results from haploinsufficiency,
      and the source of the BRIDA name.
  - reference: PMID:28530713
    reference_title: "BACH2 immunodeficiency illustrates an association between super-enhancers and haploinsufficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The TF BACH2 is essential for T and B lymphocytes and is associated with an archetypal super-enhancer (SE)."
    explanation: >-
      States that BACH2 is required in both lymphoid lineages, which is why a single

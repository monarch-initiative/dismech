pathophysiology:
- name: BACH2 Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    Loss of one functional BACH2 allele leaves insufficient BACH2 protein to
    specify lymphocyte lineage decisions. IUIS characterises the defect as
    haploinsufficiency for a critical lineage specification transcription factor,
    which is a dosage statement rather than a dominant-negative one: the residual
    wild-type allele is not poisoned, it is simply not enough.

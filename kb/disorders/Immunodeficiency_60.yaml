    explanation: >-
      The functional-defect column of the IUIS Table 4 row, which states both the
      dosage mechanism and the class of protein affected.
  - reference: PMID:26235382
    reference_title: "Immunogenetics of autoimmune thyroid diseases: A comprehensive review."
    supports: SUPPORT
    directness: INDIRECT

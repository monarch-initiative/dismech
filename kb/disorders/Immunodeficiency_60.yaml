- category: Immunologic
  name: Immunoglobulin deficiency
  description: >-
    The humoral consequence of the failed B-cell maturation programme, and the finding
    that makes the disorder look like a predominantly antibody deficiency at the
    bedside.

    Which isotypes fall is now curated from the founding report's full text, and the
    answer is that it varies between patients rather than tracking the variant. Two of
    the three founding subjects - the L24P proband and the E788K father - were low in
    IgM, IgG, IgA and IgE together. The third, the father's daughter and so a carrier
    of the same E788K allele, had low IgA against raised IgM and raised IgG. IgA is
    the only isotype low in all three. A later, unrelated family carrying R576L again
    showed IgA deficiency. So a normal or high IgG does not exclude the diagnosis, and
    the humoral phenotype should be read per isotype rather than as a single grade.

    What is still not curated is how far each isotype falls. The concentrations are
    reported in a supplementary table that is not part of the retrievable article, so
    this entry records direction and not values, and carries no reference ranges.

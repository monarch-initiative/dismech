- reference: CGGV:assertion_2473560a-6e5c-4342-a6e2-c89e37f4cc71-2023-02-21T180000.000Z
  title: "BACH2 / immunodeficiency 60 (Moderate)"
  findings:
  - statement: >-
      ClinGen Antibody Deficiencies Gene Curation Expert Panel classifies the autosomal

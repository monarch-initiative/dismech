name: Harderoporphyria
creation_date: "2026-08-28T16:30:00Z"
category: Mendelian
description: >-
  Coproporphyrinogen oxidase does its job twice. It removes two propionate side
  chains from coproporphyrinogen III in sequence, and between the two removals
  the substrate exists as a tricarboxylic intermediate, harderoporphyrinogen,
  which the enzyme must hold onto in order to finish. Harderoporphyria is what
  happens when a variant lets the enzyme complete the first decarboxylation and
  not the second: the intermediate is released instead of being retained, and it
  is excreted in enormous quantities.

  That distinguishes it sharply from hereditary coproporphyria, which is the same
  gene. HCP is a dominant disorder of half-normal enzyme activity in the liver;
  the substrate upstream of the block accumulates, hepatic ALAS1 is derepressed,
  and patients have acute neurovisceral attacks after puberty. Harderoporphyria
  is recessive, requires two alleles, presents in the newborn with haemolytic
  anaemia and jaundice rather than with attacks, and the diagnostic finding is a
  different molecule - harderoporphyrin dominating faecal porphyrins where in HCP
  it is a minor component.

  So the split is not a severity band on one mechanism. The same enzyme fails in
  two different ways, at two different points, in two different compartments, and
  the position of the variant within the protein is what decides which disease
  the patient has.

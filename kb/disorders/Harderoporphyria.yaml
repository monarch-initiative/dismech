genetic:
- name: CPOX
  gene_term:
    preferred_term: CPOX
    term:
      id: hgnc:2321
      label: CPOX
  relationship_type: CAUSATIVE
  notes: >-
    The genotype-phenotype relationship in CPOX is position-dependent and not
    dose-dependent, and the two statements need holding together carefully.

    Position matters: variants altering residues D400-K404 give harderoporphyria,
    while biallelic variants elsewhere in the gene give a "homozygous HCP"
    phenotype that is a different disease. p.His327Arg extends the picture, since
    it lies outside that interval but was predicted to interact with W399 in the
    active site - so the functional criterion is proximity to the retention
    machinery rather than to a stretch of sequence.

    Zygosity acts through configuration, not just count. In the second reported
    family the K404E allele was paired with an intron-6 donor-splice-site variant
    that skips exon 6 and produces no functional protein, so the retention-class
    allele is the only source of activity and the compound heterozygote behaves
    as the homozygote does. A null in trans does not dilute the phenotype; it
    exposes it.

    Dose does not: within HCP, residual enzyme activity ranged from 1% to 64%
    across expressed variants with clinically uniform presentation, so severity
    does not track inactivation. That is why this entry does not present
    harderoporphyria as the severe end of a CPOX activity gradient. A single copy
    of a variant known to cause harderoporphyria in homozygotes can produce
    ordinary adult HCP, which is the same point from the other direction.
  evidence:
  - reference: PMID:11309681
    reference_title: Characterization of mutations in the CPO gene in British patients demonstrates
      absence of genotype-phenotype correlation and identifies relationship between hereditary
      coproporphyria and harderoporphyria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In all patients, clinical presentation was uniform, in spite of the wide range
      (1%-64%) of residual coproporphyrinogen oxidase activity, as determined by heterologous
      expression.
    explanation: The measured absence of a dose-response relationship, which is what rules
      out reading harderoporphyria as simply lower activity.
  - reference: PMID:11309681
    reference_title: Characterization of mutations in the CPO gene in British patients demonstrates
      absence of genotype-phenotype correlation and identifies relationship between hereditary
      coproporphyria and harderoporphyria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: show that single copies of CPO mutations that are known or predicted to cause
      "homozygous" HCP or harderoporphyria can produce typical HCP in adults
    explanation: The same allele in one copy gives HCP and in two gives harderoporphyria -
      the observation that makes zygosity as well as position part of the rule.
  - reference: PMID:21103937
    reference_title: Harderoporphyria due to homozygosity for coproporphyrinogen oxidase
      missense mutation H327R.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: Structural studies predicted that p.H327R interacts with residue W399 in the
      CPOX active site, thereby accounting for the Harderoporphyria phenotype.
    explanation: Graded COMPUTATIONAL because the interaction is a structural prediction,
      not a measurement - which is exactly why the residue-interval rule should be read as
      functional rather than positional.

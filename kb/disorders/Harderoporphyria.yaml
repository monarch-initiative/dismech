notes: >-
  Scope, and a disagreement with MONDO. MONDO places harderoporphyria under
  CPOX-related hereditary coproporphyria. This entry treats it as its own
  disease, and the reasoning is curated as a discussion rather than buried here:
  the mechanism is a redirection of the reaction rather than a partial loss of
  it, severity does not order the two phenotypes, and biallelic CPOX variants
  outside the retention region give a third phenotype again. The existing
  Inherited_Porphyria entry carries HCP as a CPOX subtype and is not modified by
  this PR; a reviewer who prefers to see harderoporphyria as a subtype there
  should say so and it can be moved.

  Module conformance. Three nodes declare conforms_to against
  heme_biosynthesis_porphyria. The enzymatic block and the cutaneous phototoxicity
  conform closely. The accumulation node conforms in structure while differing in
  substance in a way worth flagging: the module describes accumulation of
  pathway precursors and porphyrins upstream of a block, whereas what accumulates
  here is a reaction intermediate released mid-catalysis. The conformance is
  still correct - it is the same node in the causal chain - but the module's
  description does not currently cover this case.

  Prevalence. Recorded as CASES_IN_LITERATURE with no rate, because no population
  estimate exists. The prevalence_class band is an inference from a reported
  count of roughly eight cases, not a measured figure, and the notes field says
  so.

  Erythroid injury. The node linking harderoporphyrin accumulation to haemolysis
  is graded PROVISIONAL and its incoming edge is
  INDIRECT_UNKNOWN_INTERMEDIATES. The compartment is established; the mechanism
  of red cell destruction is not, and a knowledge-gap discussion records what
  specifically is unknown and why it would matter.

  Deep research. Two runs. The openscientist run commissioned for this entry
  timed out at 3600s and was cancelled by the client, so no report existed when
  the entry was written and every reference here was located independently
  through PubMed. A claude_code run was then commissioned during PR review and is
  committed alongside this entry.

  What the report changed: nothing. It corroborated the entry - including the
  prevalence handling, which it describes as "fewer than 10 cases reported
  worldwide", consistent with the CASES_IN_LITERATURE record above - and
  supplied no citable content the entry lacked. That is recorded as an outcome
  rather than passed over, because a report that adds nothing is a different
  result from a report that was not read.

  Its own term-validation section flags two identifiers it names wrongly, and
  they are the now-familiar pattern: HP:0032263, which it calls
  "Coproporphyrinuria" and which HPO calls Increased blood pressure, and
  UBERON:0001155, which it calls "liver" and which UBERON calls colon. Both
  resolve, so nothing but the name check catches them. Neither is used here.

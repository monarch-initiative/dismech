- name: Arrest After the First Decarboxylation
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The enzyme removes the first propionate and then fails to retain
    harderoporphyrinogen for the second cycle, so the intermediate is released
    rather than carried through to protoporphyrinogen. The structural account is
    specific: the K404E substitution disrupts a type I beta-turn whose job is
    substrate retention between cycles.

    The claim is that the reaction is redirected, not that throughput is normal.
    The enzyme is also slower - the 1983 kinetics give a Michaelis constant
    15-20-fold above normal and a maximal velocity half of normal, and lymphocyte
    activity in the affected siblings was 10% of control. What distinguishes this
    disease from a straightforwardly less active enzyme is that the deficit is
    not uniform across the two cycles, so the accumulating species is an
    intermediate that barely appears in other porphyrias rather than the
    substrate upstream of the block.

    That distinction was contested, and by the same paper. The 1983 authors
    explicitly ruled out an active-site lesion specific to the second
    decarboxylation, on the grounds that rat liver metabolises coproporphyrinogen
    and harderoporphyrinogen at the same active centre. They were right about the
    active centre and it does not settle the question: the 2005 crystal structure
    locates the harderoporphyria lesion not in a second catalytic site but in a
    beta-turn that retains the substrate between cycles at the one shared site.
    A single active centre and a cycle-specific failure are compatible, which is
    what the structure showed and the kinetics alone could not.

    Separately, CPOX is an obligate homodimer whose monomer has no activity, so
    what a given genotype does depends on which dimers can form.
  molecular_functions:
  - preferred_term: second decarboxylation of harderoporphyrinogen to protoporphyrinogen
    modifier: ABSENT
    term:
      id: GO:0004109
      label: coproporphyrinogen oxidase activity

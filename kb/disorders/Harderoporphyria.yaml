  description: >-
    The released intermediate accumulates and is excreted, dominating the faecal
    porphyrin profile. This is the diagnostic signature and it is quantitative:
    harderoporphyrin normally makes up under a fifth of faecal porphyrin and here
    exceeds three fifths. Unlike most porphyrias, the accumulating species in
    this disease is not a pathway substrate but a reaction intermediate.

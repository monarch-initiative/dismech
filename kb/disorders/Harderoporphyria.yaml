- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    No population estimate exists. Reported as a handful of cases: a 2010 report
    describes homozygous HCP patients as "only a few" and most of those as having
    harderoporphyria, and a 2019 case report counted eight previously reported
    cases. Recorded as a literature count rather than a rate, and the
    prevalence_class band is an inference from that count rather than a measured
    figure.
  evidence:
  - reference: PMID:30828546
    reference_title: 'Harderoporphyria: Case of lifelong photosensitivity associated with
      compound heterozygous coproporphyrinogen oxidase (CPOX) mutations.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Two previously undescribed coproporphyrinogen oxidase (CPOX) mutations were
      identified, including a deletion of four amino acids in a region of the enzyme mutated
      in 7 of the 8 previously reported cases.
    explanation: Establishes the order of magnitude of the reported literature - eight prior
      cases - and, incidentally, that seven of those eight carried a variant in the same
      region.
diagnosis:
- name: Faecal Porphyrin Fractionation
  description: >-
    The test that makes the diagnosis. Total porphyrin elevation is common to
    many porphyrias; it is the fraction that is harderoporphyrin which is
    specific, so a laboratory reporting only totals will miss this disease and
    report a picture consistent with coproporphyria.
  diagnosis_term:
    preferred_term: laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:6886003
    reference_title: 'Harderoporphyria: a variant hereditary coproporphyria.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the pattern of fecal porphyrin excretion was atypical for hereditary coproporphyria
      because the major porphyrin was harderoporphyrin (greater than 60%; normal value is
      less than 20%)
    explanation: Shows the fractionation, not the total, carrying the diagnostic
      information.
- name: CPOX Sequencing
  description: >-
    Confirms the diagnosis and, because the phenotype is position-dependent,
    interprets it: the finding that matters is whether the variants affect the
    substrate-retention region, not merely that they are in CPOX.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:9454777
    reference_title: 'Neonatal hemolytic anemia due to inherited harderoporphyria: clinical
      characteristics and molecular basis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In the present study, molecular investigations in a second family with neonatal
      hemolytic anemia and harderoporphyria revealed two heterozygous point mutations in
      the COX gene.
    explanation: Molecular confirmation in a second, independent family, establishing the
      compound-heterozygous configuration as well as the homozygous one.
treatments:
- name: Supportive Management of Haemolysis
  therapeutic_modality: OTHER
  description: >-
    There is no treatment directed at the enzymatic lesion. Management is
    supportive: transfusion where the anaemia requires it, management of neonatal
    hyperbilirubinaemia, and light protection for the photosensitivity. This
    entry records no disease-modifying therapy because none was found in the
    literature reviewed, not because the search was incomplete - the reported
    literature is a handful of cases and none reports an intervention trial.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Neonatal Haemolytic Anaemia and Jaundice
    treatment_effect: MODULATES
    description: >-
      Addresses the consequence, not the cause. Nothing in current management
      reaches the retention defect in the enzyme.
  evidence:
  - reference: PMID:9454777
    reference_title: 'Neonatal hemolytic anemia due to inherited harderoporphyria: clinical
      characteristics and molecular basis.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Harderoporphyric patients exhibit jaundice, severe chronic hemolytic anemia
      of early onset associated with hepatosplenomegaly, and skin photosensitivity.
    explanation: PARTIAL because it establishes what has to be managed, not that any
      particular management works - no reviewed source reports a treatment result in this
      disease.
- name: Genetic Counselling
  therapeutic_modality: BEHAVIORAL
  description: >-
    Autosomal recessive with a 25% sibling recurrence risk. It has an added
    complication here that ordinary recessive counselling does not: a carrier
    parent is not merely a carrier but has HCP, and can have acute attacks in
    adulthood. So the family assessment produced by testing a proband is a
    two-generation, two-disease assessment.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:11309681
    reference_title: Characterization of mutations in the CPO gene in British patients demonstrates
      absence of genotype-phenotype correlation and identifies relationship between hereditary
      coproporphyria and harderoporphyria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: show that single copies of CPO mutations that are known or predicted to cause
      "homozygous" HCP or harderoporphyria can produce typical HCP in adults
    explanation: The basis for the two-disease family assessment - a heterozygous relative
      is at risk of adult HCP, not simply an unaffected carrier.
discussions:
- discussion_id: harpo_why_not_a_severity_band_of_hcp
  kind: INTERPRETATION
  attaches_to:
  - disease#Harderoporphyria
  - genetic#CPOX
  prompt: Why is harderoporphyria curated as its own disease rather than as severe CPOX
    deficiency within hereditary coproporphyria?
  rationale: >-
    MONDO places harderoporphyria under CPOX-related hereditary coproporphyria,
    and the existing dismech porphyria entry carries HCP as a CPOX subtype, so
    the obvious reading is that this is HCP with two hits instead of one. Three
    things argue against it, and they are the reason this is a separate entry.

    The mechanism differs at the step that matters. HCP is a partial deficiency:
    less enzyme, substrate backing up, hepatic ALAS1 derepressed, acute attacks.
    Harderoporphyria is a redirection: the enzyme performs its first
    decarboxylation and then fails to hold the intermediate for the second, so
    what accumulates is a molecule that barely appears in HCP at all. A structure
    of human CPOX locates the lesion in a beta-turn whose function is exactly that
    retention.

    Severity does not order the two. Residual enzyme activity across HCP variants
    spans 1% to 64% with clinically uniform presentation, so "less activity" does
    not produce harderoporphyria; if it did, the low-activity HCP patients would
    have it and they do not.

    And biallelism alone is not the criterion either. Biallelic CPOX variants
    outside the retention region give a "homozygous HCP" phenotype that is
    distinct from harderoporphyria. So the discriminator is which residues are
    affected, not how many alleles or how much activity remains.

    This is a lump/split call and it goes against MONDO's placement, which is
    recorded here rather than left implicit so that a reviewer who disagrees has
    the argument to disagree with.
  evidence:
  - reference: PMID:16176984
    reference_title: Structural basis of hereditary coproporphyria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Conversely, harderoporphyria-causing K404E mutation precludes a type I beta-turn
      from retaining the substrate for the second decarboxylation cycle.
    explanation: The distinct structural mechanism, which is the primary argument for the
      split.
  - reference: PMID:11309681
    reference_title: Characterization of mutations in the CPO gene in British patients demonstrates
      absence of genotype-phenotype correlation and identifies relationship between hereditary
      coproporphyria and harderoporphyria.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: demonstrate that the severity of the phenotype does not correlate with the degree
      of inactivation by mutation of coproporphyrinogen oxidase
    explanation: Rules out the severity-band reading directly.
  - reference: PMID:9454777
    reference_title: 'Neonatal hemolytic anemia due to inherited harderoporphyria: clinical
      characteristics and molecular basis.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Neither abdominal pain nor neuropsychiatric symptoms are observed.
    explanation: The sharpest clinical discriminator available. HCP is defined by acute
      neurovisceral attacks; their absence in harderoporphyria is not a milder version of
      that presentation but a different one, which is the clinical counterpart of the
      mechanistic argument.
- discussion_id: harpo_how_the_intermediate_damages_erythrocytes
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Erythroid Compartment Injury
  prompt: By what mechanism does accumulated harderoporphyrin cause haemolysis?
  rationale: >-
    The chain from variant to accumulated intermediate is established at the
    structural level. The chain from accumulated intermediate to destroyed red
    cell is not, and it is worth being explicit that this entry does not know it.

    What is established is the compartment and the association: this is an
    erythropoietic porphyria, harderoporphyrin is measurable in erythrocytes as
    well as faeces, and the haemolysis is present from birth. What is not
    established is whether the damage is photo-oxidative in the same way as the
    skin lesions, whether it acts on the mature erythrocyte or on the developing
    erythroblast, or whether the intermediate is directly toxic at all rather than
    marking a compartment where heme synthesis has failed.

    The distinction is not academic. If the haemolysis is photo-oxidative it
    should respond to the same light protection as the skin, and if it is a
    consequence of failed heme synthesis in the erythroblast it should not. No
    reviewed source addresses this, and with eight or so reported cases in the
    literature it is unlikely to be addressed by observation alone.
  evidence:
  - reference: PMID:28349448
    reference_title: 'Neonatal-Onset Hereditary Coproporphyria: A New Variant of Hereditary
      Coproporphyria.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: In contrast, harderoporphyria is an erythropoietic porphyria that represents
      photosensitivity and hemolytic anemia from the neonatal period.
    explanation: Establishes the compartment and the co-occurrence of the two features,
      which is as far as the reviewed literature goes - it does not connect them
      mechanistically.
- discussion_id: harpo_biochemical_phenotype_can_disagree_with_genotype
  kind: OPEN_QUESTION
  attaches_to:
  - diagnosis#Faecal Porphyrin Fractionation
  prompt: What should a neonate with the harderoporphyria clinical picture but an HCP
    porphyrin profile be called?
  rationale: >-
    A 2017 report describes a neonate with photosensitivity, haemolytic anaemia
    and jaundice - the harderoporphyria presentation - whose faecal porphyrin
    pattern was that of typical HCP rather than harderoporphyria, and who carried
    a novel heterozygous four-base-pair deletion with no K404E and no second
    identified allele. The authors proposed calling it neonatal-onset HCP.

    This matters for how the entry should be used rather than only for
    nomenclature. Both of this entry's discriminators - the faecal fraction and
    the variant position - failed on that patient while the clinical picture was
    unambiguous. Either the discriminators are less reliable than the small
    reported series suggests, or there is a third CPOX phenotype, or a second
    allele went undetected.

    With around eight reported cases the question cannot be settled by counting.
    It is recorded here so that a future curator meeting a similar case knows this
    entry's diagnostic rule has a documented exception rather than reading the
    rule as tested.
  evidence:
  - reference: PMID:28349448
    reference_title: 'Neonatal-Onset Hereditary Coproporphyria: A New Variant of Hereditary
      Coproporphyria.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: However, the pattern of porphyrin metabolites of feces was consistent with that
      of typical HCP, not of harderoporphyria.
    explanation: The discordance itself - clinical harderoporphyria with an HCP biochemical
      profile.
  - reference: PMID:28349448
    reference_title: 'Neonatal-Onset Hereditary Coproporphyria: A New Variant of Hereditary
      Coproporphyria.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We found a heterozygous, novel, four-base pair deletion in exon 7 of the CPOX
      gene, although other mutations including the p.Lys404Glu mutation in CPOX were not
      found.
    explanation: The genotype that also failed to fit, which is what makes this an open
      question rather than a mis-assigned case.

    snippet: Conversely, harderoporphyria-causing K404E mutation precludes a type I beta-turn
      from retaining the substrate for the second decarboxylation cycle.
    explanation: The structural mechanism, from the crystal structure of human CPOX - this
      is the sentence the whole entry turns on.
  - reference: PMID:6886003
    reference_title: 'Harderoporphyria: a variant hereditary coproporphyria.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Kinetic parameters of coproporphyrinogen III oxidase from these patients were
      clearly modified, with a Michaelis constant 15-20-fold higher than normal values when
      using coproporphyrinogen or harderoporphyrinogen as substrates. Maximal velocity was
      half the normal value, and we also observed a marked sensitivity to thermal denaturation.
    explanation: The measured kinetics, which show the enzyme is also slower and less stable.
      Quoted so this node does not read as claiming normal throughput - the claim is that
      the deficit is unequal between the two cycles, not that there is no deficit.
  - reference: PMID:6886003
    reference_title: 'Harderoporphyria: a variant hereditary coproporphyria.'
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: The possibility that a mutation affecting the enzyme on the active center which
      is specifically involved in the second decarboxylation (from harderoporphyrinogen to
      protoporphyrinogen) was eliminated by experiments on rat liver that showed that coproporphyrinogen
      and harderoporphyrinogen were metabolized at the same active center.
    explanation: Graded REFUTE because it is the argument against this node, from the paper
      that named the disease - the 1983 authors rejecting a lesion specific to the second
      decarboxylation. It is carried rather than omitted because the resolution is a real
      one and worth reading - they showed a single shared active centre, and the 2005
      structure showed the lesion is in substrate retention between cycles at that one
      centre, not in a second catalytic site. The two results are compatible; the older
      inference was the strongest reading available before the structure existed.
  - reference: PMID:24078084
    reference_title: The enzyme engineering of mutant homodimer and heterodimer of coproporphyinogen
      oxidase contributes to new insight into hereditary coproporphyria and harderoporphyria.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The monomer form of mutated CPOX did not show any activity and homodimeric enzymes
      derived from HCP mutant showed low activity (<20% of the control).
    explanation: Establishes the obligate-dimer requirement, which is why genotype acts
      through which dimers can assemble rather than through allele dosage alone.
  - reference: PMID:24078084
    reference_title: The enzyme engineering of mutant homodimer and heterodimer of coproporphyinogen

name: Turnpenny-Fry Syndrome
creation_date: "2026-11-24T00:00:00Z"
category: Mendelian
synonyms:
- turnpenny-fry syndrome
- TPFS
- Neurocardioskeletal Syndrome
- PCGF2-related syndrome
description: >-
  Turnpenny-Fry syndrome (TPFS) is an autosomal dominant neurodevelopmental
  syndrome caused by heterozygous missense variants at a single residue,
  Pro65, of PCGF2 (MEL18), a Polycomb group RING finger protein of the
  canonical Polycomb repressive complex 1 (PRC1). Almost all variants are
  de novo (p.Pro65Leu recurrently, p.Pro65Ser in monozygotic twins), with
  transmission from a mosaic parent reported twice.

  Patients have global developmental delay and intellectual disability with
  delayed or absent speech, hypotonia, feeding difficulties and constipation,
  impaired growth, and a recognizable facial gestalt: frontal bossing,
  sparse scalp hair, periorbital fullness, malar hypoplasia, narrow
  palpebral fissures, a small mouth and dysplastic "satyr" ears. Brain MRI
  shows white matter changes, polymicrogyria or ventricular enlargement;
  most patients have cardiac or vascular anomalies (patent ductus
  arteriosus, septal defects, aortic dilatation, vessel tortuosity), and
  vertebral anomalies, kyphoscoliosis, hearing loss and diaphragmatic hernia
  occur. No functional study has established how the Pro65 substitutions
  act; structural modelling suggests they alter an N-terminal loop needed for
  histone binding, and a dominant-negative effect on PRC1 has been proposed.
  About sixteen patients have been reported.
disease_term:
  preferred_term: turnpenny-fry syndrome
  term:
    id: MONDO:0032707
    label: turnpenny-fry syndrome
parents:
- Neurodevelopmental Disorder
- Chromatinopathy

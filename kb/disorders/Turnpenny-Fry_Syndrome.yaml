    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Using mouse embryonic stem cells (ESCs) with CRISPR/Cas9-mediated gene editing, we found that the loss of Pcgf2, though not affecting the global level of H2AK119ub1, disrupts these cPRC1.2 loops in ESCs and impairs the transcriptional induction of crucial target genes necessary for neuronal differentiation."

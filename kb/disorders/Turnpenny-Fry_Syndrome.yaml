- name: Abnormal Axial Skeletal Patterning
  description: >-
    Mel18-null mice show posterior homeotic transformations of the axial
    skeleton; patients have vertebral hypoplasia, kyphoscoliosis and pectus
    deformities. The link from the mouse null phenotype to the patients'
    vertebral anomalies is inferred.
  biological_scale: TISSUE

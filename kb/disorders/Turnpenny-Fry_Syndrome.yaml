notes: >-
  MONDO cross-references the phenotype as OMIM 618371. ClinGen raised PCGF2
  for TPFS from Strong to Definitive in 2026 on the basis of three further de
  novo cases, and notes that no functional studies establish the mechanism
  and that variants at codons other than Pro65 are of unknown significance.
  No GeneReviews chapter covers the disorder. The phenotype baseline is the
  13-patient Turnpenny et al. series (PMID:30343942), whose full text is not
  in the reference cache; its per-feature counts are quoted from the
  comparison table in PMID:38283775, which reproduces them, and the
  frequencies here follow those counts. Cardiac and vascular counts by
  lesion (patent ductus arteriosus, atrial septal defect, aortic dilatation)
  are given only in the Turnpenny full text, so only the pooled cardiac
  figure is used.
inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous Pro65 missense variants, nearly always de novo. One mother
    (in the founding series) and one father were mosaic and clinically
    unaffected, so recurrence through parental mosaicism is possible.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:30343942
    reference_title: "Missense Mutations of the Pro65 Residue of PCGF2 Cause a Recognizable Syndrome Associated with Craniofacial, Neurological, Cardiovascular, and Skeletal Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All the mutations affected the same highly conserved proline in PCGF2 and were de novo, excepting maternal mosaicism in one."
    explanation: Heterozygous de novo variants, with one mosaic mother.
  - reference: PMID:36105049
    reference_title: "Investigation of an inherited PCGF2: p.Pro65Leu mutation causing Turnpenny-Fry syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A recurrent missense variant, namely PCGF2: c.194C > T (p.Pro65Leu), was identified and suggested to be inherited from a mosaic father based on Sanger sequencing validation."
    explanation: Transmission from a mosaic father.
pathophysiology:
- name: PCGF2 Pro65 Missense Substitution
  description: >-
    Every reported variant changes Pro65, in an N-terminal loop adjacent to
    the RING domain. Structural modelling and molecular dynamics predict that
    the substitution alters this loop and destabilizes the protein, and the
    loop is proposed to contact histones. Absence of truncating variants or
    deletions in patients argues against simple haploinsufficiency; a
    dominant-negative effect is proposed but untested.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: PCGF2
    term:
      id: hgnc:12929
      label: PCGF2
  genetic_context:
    variant_origin: GERMLINE
  molecular_functions:
  - preferred_term: histone binding
    modifier: DECREASED
    term:
      id: GO:0042393
      label: histone binding
  downstream:
  - target: Impaired PRC1-Mediated Polycomb Repression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - pcgf2_dominant_negative
    description: >-
      Proposed from structural modelling; no experiment has tested how the
      Pro65 variants affect PRC1 function.
    evidence:
    - reference: PMID:30343942
      reference_title: "Missense Mutations of the Pro65 Residue of PCGF2 Cause a Recognizable Syndrome Associated with Craniofacial, Neurological, Cardiovascular, and Skeletal Features."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      directness: INDIRECT
      snippet: "Mutant PCGF2 may have dominant-negative effects, sequestering PRC1 components into complexes that lack the ability to interact efficiently with histones."
      explanation: The proposed consequence of the substitution for PRC1.
  evidence:
  - reference: PMID:30343942
    reference_title: "Missense Mutations of the Pro65 Residue of PCGF2 Cause a Recognizable Syndrome Associated with Craniofacial, Neurological, Cardiovascular, and Skeletal Features."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Computer structural modeling suggests the substitutions alter an N-terminal loop of PCGF2 critical for histone biding."
    explanation: Modelling places the substitution in a histone-binding loop.
  - reference: PMID:36105049
    reference_title: "Investigation of an inherited PCGF2: p.Pro65Leu mutation causing Turnpenny-Fry syndrome."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "MD results suggested a deleterious effect on the intramolecular structural flexibility and stability of PCGF2 protein by this variant."
    explanation: Molecular dynamics predicts destabilization by p.Pro65Leu.
- name: Impaired PRC1-Mediated Polycomb Repression
  description: >-
    PCGF2 defines the canonical PRC1.2 complex, which silences developmental
    regulators through histone modification and chromatin compaction. In
    Pcgf2-null mice, Hox cluster genes are ectopically expressed along the
    body axis, and in Pcgf2-null mouse embryonic stem cells the
    PRC1.2-dependent chromatin loops at bivalent neuronal genes are lost.
    That the Pro65 missense variants act through this pathway is inferred.
  biological_scale: CELLULAR
  cellular_components:
  - preferred_term: PRC1 complex
    term:
      id: GO:0035102
      label: PRC1 complex
  biological_processes:
  - preferred_term: epigenetic negative regulation of gene expression
    modifier: DECREASED
    term:
      id: GO:0045814
      label: negative regulation of gene expression, epigenetic
  downstream:

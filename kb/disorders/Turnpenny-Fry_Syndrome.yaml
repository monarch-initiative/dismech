mechanistic_hypotheses:
- hypothesis_group_id: pcgf2_dominant_negative
  hypothesis_label: Pro65 substitutions act dominant-negatively on PRC1
  status: EMERGING
  description: >-
    Mutant PCGF2 is proposed to assemble into PRC1 but bind histones poorly,
    sequestering PRC1 components. This rests on structural modelling, the
    restriction of all patients to one residue, and the absence of truncating
    alleles or deletions in patients; it has not been tested, and ClinGen
    records that the mechanism is unknown.
  evidence:
  - reference: PMID:30343942

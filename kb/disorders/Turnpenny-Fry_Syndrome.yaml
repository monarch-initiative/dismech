genetic:
- name: PCGF2
  association: Causal
  gene_term:
    preferred_term: PCGF2
    term:
      id: hgnc:12929
      label: PCGF2
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_58b289b7-f842-4a32-a1fa-2777455fbd27-2026-06-15T160000.000Z
    evidence:
    - reference: CGGV:assertion_58b289b7-f842-4a32-a1fa-2777455fbd27-2026-06-15T160000.000Z
      reference_title: "PCGF2 / turnpenny-fry syndrome (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "PCGF2 | HGNC:12929 | turnpenny-fry syndrome | MONDO:0032707 | AD | Definitive"
      explanation: ClinGen Definitive classification (2026 re-evaluation).
  notes: >-
    All reported variants are heterozygous missense changes of Pro65:
    c.194C>T p.(Pro65Leu) in most patients and c.193C>T p.(Pro65Ser) in one
    pair of monozygotic twins. ClinGen cautions that variants at other codons
    need very careful consideration.
  evidence:
  - reference: PMID:25533962
    reference_title: "Large-scale discovery of novel genetic causes of developmental disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The two children with identical Pro65Leu mutations in PCGF2, which encodes a component of a Polycomb transcriptional repressor complex, share a strikingly similar facial appearance representing a novel and distinct dysmorphic syndrome."
    explanation: First report of the recurrent variant in the DDD study.
  - reference: PMID:30343942
    reference_title: "Missense Mutations of the Pro65 Residue of PCGF2 Cause a Recognizable Syndrome Associated with Craniofacial, Neurological, Cardiovascular, and Skeletal Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings demonstrate the important role of PCGF2 in human development and confirm that heterozygous substitutions of the Pro65 residue of PCGF2 cause a recognizable syndrome characterized by distinctive craniofacial, neurological, cardiovascular, and skeletal features."
    explanation: The founding 13-patient series.
  - reference: PMID:38283775
    reference_title: "Acute Lymphoblastic Leukemia in a Pediatric Patient With Turnpenny-Fry Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At 4 years, clinical exome sequencing (mendeliome) identified a heterozygous variant in the PCGF2 gene, (NM_007144.2), c.194C>T, p.(Pro65Leu), previously reported as pathogenic, and which was presumed to have occurred de novo after negative parental testing."
    explanation: Replication of the recurrent de novo variant.
animal_models:
- name: Mel18 (Pcgf2) knockout mouse
  species: Mouse
  genotype: Pcgf2 (mel-18) homozygous null
  publication: PMID:8625838
  description: >-
    Homozygous null mice survive to birth but die at about four weeks with
    strong growth retardation, and show posterior homeotic transformations of
    the axial skeleton with ectopic Hox expression.
  modeled_mechanisms:
  - target: Impaired PRC1-Mediated Polycomb Repression
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Loss of Pcgf2 derepresses Hox genes in the paraxial mesoderm.
    limitations: >-
      This is a homozygous null; patients are heterozygous for a missense
      substitution proposed to act dominant-negatively, and heterozygous null
      mice and humans with truncating variants are not reported to have the
      syndrome.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The node is the effect of heterozygous Pro65 substitutions on PRC1;
        the model removes PCGF2 entirely in both copies, so it shows what
        PCGF2 normally represses, not how the patient allele behaves.
    evidence:
    - reference: PMID:8625838
      reference_title: "A role for mel-18, a Polycomb group-related vertebrate gene, during theanteroposterior specification of the axial skeleton."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The homeotic transformations were correlated with ectopic expression of Homeobox cluster genes along the anteroposterior axis in the developing paraxial mesoderm."
      explanation: Hox derepression in the null mouse.
  - target: Abnormal Axial Skeletal Patterning
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Posterior transformations of the axial skeleton.
    limitations: >-
      Homeotic transformation in a null mouse is not the same lesion as the
      vertebral hypoplasia and kyphoscoliosis reported in patients.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The mouse readout is vertebral identity (homeotic transformation),
        while the patient finding is vertebral size and spinal curvature.
    evidence:
    - reference: PMID:8625838
      reference_title: "A role for mel-18, a Polycomb group-related vertebrate gene, during theanteroposterior specification of the axial skeleton."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Similar to the Drosophila posterior sex combs mutant, posterior transformations of the axial skeleton were reproducibly observed in mel-18 mutants."
      explanation: Axial skeletal defects in the null mouse.

  - reference: PMID:36105049
    reference_title: "Investigation of an inherited PCGF2: p.Pro65Leu mutation causing Turnpenny-Fry syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A recurrent missense variant, namely PCGF2: c.194C > T (p.Pro65Leu), was identified and suggested to be inherited from a mosaic father based on Sanger sequencing validation."
    explanation: Parental mosaicism raises recurrence risk.
diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Exome sequencing identified most cases. Targeted testing of codon 65 is
    possible once the gestalt is recognized, and sensitive testing of parents
    can detect mosaicism.
  diagnosis_term:
    preferred_term: Whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:34750959
    reference_title: "A new case of Turnpenny-Fry syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing (WES) was performed from the peripheral blood sample of the patient. WES revealed a heterozygous mutation in the PCGF2 gene."
    explanation: Diagnosis by exome sequencing.

- name: Abnormal Craniofacial Development
  description: >-
    The recognizable facial gestalt (frontal bossing, malar hypoplasia,
    periorbital fullness, narrow palpebral fissures, small mouth, dysplastic
    ears, high palate, prognathia) is the most consistent feature. Knockouts
    of PCGF2 orthologs in mice and flies support a role in craniofacial and
    skeletal development; how the Pro65 variants disturb facial development
    is not known.
  biological_scale: TISSUE

name: Cocaine Dependence
creation_date: "2026-11-19T00:00:00Z"
category: Psychiatric
description: >-
  Cocaine dependence is a chronic, relapsing disorder of compulsive cocaine
  use. Its pharmacological trigger is unusually well localised: cocaine blocks
  the plasma-membrane transporters that clear dopamine, serotonin and
  noradrenaline from the synapse, and the potency with which a cocaine-like
  drug blocks the dopamine transporter predicts how hard an animal will work
  for it. What follows from that trigger is the shared addiction cycle. What
  does not follow is a treatment: no pharmacotherapy is approved for this
  disorder in the United States or Europe, and the best-supported intervention
  is a behavioural one. The entry therefore carries an unusual amount of its
  weight in the gap between a well-understood molecular target and the absence
  of a drug that exploits it.
disease_term:
  preferred_term: cocaine dependence
  term:
    id: MONDO:0005186
    label: cocaine dependence
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0004456
      label: cocaine abuse
    mapping_predicate: skos:closeMatch
    mapping_source: dismech curation
    mapping_justification: >-
      MONDO keeps cocaine abuse as a separate class from cocaine dependence,
      preserving the pre-DSM-5 split that DSM-5 merged into a single cocaine
      use disorder graded by severity. This entry is bound to the dependence
      term and covers the DSM-5 construct, so the abuse class overlaps it
      without being either exactly the same concept or strictly narrower, and
      the mapping is recorded as a close match rather than as an exact or
      narrow one. It is not recorded as a has_subtypes entry, because severity
      grading is not a subtype axis in this schema.
synonyms:
- Cocaine addiction
- Cocaine use disorder
parents:
- Substance Use Disorder
- Mental Health Disorder
notes: >-
  Scope. This entry is the chronic use disorder. Acute cocaine toxicity, which
  is dominated by the drug's separate local-anaesthetic action on voltage-gated
  sodium channels and by coronary vasoconstriction, is curated in
  Cocaine_Intoxication (MONDO:0019544) and is deliberately absent from this
  pathograph; the sodium-channel pharmacology is not modelled here at all. The
  two are listed as differential diagnoses of each other rather than merged,
  because a first-time user can have the intoxication without the dependence
  and a dependent user is not always intoxicated.
  Most of the cited trials ascertain adults with active cocaine use confirmed
  by urinalysis rather than a DSM diagnosis, and the two psychosocial
  syntheses pool cocaine with amphetamine, which is stated on each claim that
  rests on them.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: COMMON
  notes: >-
    No population-based prevalence estimate of diagnosed cocaine dependence
    was located for this entry, so no rate is recorded. The mortality
    statement in clinical_burden is about overdose deaths rather than about
    the number of dependent people, and is not a prevalence measure.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Cocaine is the second leading cause of illicit drug overdose death in both
    the United States and the United Kingdom, and the disorder that sustains
    the exposure has no approved pharmacotherapy in either jurisdiction.
  evidence:
  - reference: PMID:33961037
    reference_title: "Comparison of Treatments for Cocaine Use Disorder Among Adults: A Systematic Review and Meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the US and the United Kingdom, cocaine use is the second leading cause
      of illicit drug overdose death. Psychosocial treatments for cocaine use
      disorder are limited, and no pharmacotherapy is approved for use in the
      US or Europe.
    explanation: >-
      States both halves of the burden in one sentence pair: the mortality
      rank, and the absence of an approved drug that would let it be treated
      pharmacologically. Quoted from the importance statement of a
      meta-analysis of 157 trials.
pathophysiology:
- name: Monoamine Transporter Blockade by Cocaine
  biological_scale: MOLECULAR
  description: >-
    Cocaine binds and blocks the plasma-membrane transporters for dopamine,
    serotonin and noradrenaline, so released transmitter is not cleared from
    the synapse. The dopamine transporter is the site that tracks the
    behaviour: across cocaine-like drugs, potency at inhibiting dopamine
    transporter binding predicts potency in self-administration, and potency
    at a large panel of other presynaptic and postsynaptic sites does not.
    Blockade of all three transporters, rather than of the dopamine
    transporter alone, is what the knockout work below forces the entry to
    model.
  molecular_functions:
  - preferred_term: monoamine transporter activity
    term:
      id: GO:0008504
      label: monoamine transmembrane transporter activity
    modifier: DECREASED
  - preferred_term: dopamine transporter activity
    term:
      id: GO:0005330
      label: dopamine:sodium symporter activity
    modifier: DECREASED
  genes:

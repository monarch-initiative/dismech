    term:
      id: UBERON:0000451
      label: prefrontal cortex
  evidence:
  - reference: PMID:22011681
    reference_title: "Dysfunction of the prefrontal cortex in addiction: neuroimaging findings and clinical implications."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      However, imaging studies in addictive behaviours have identified a key
      involvement of the prefrontal cortex (PFC) both through its regulation of
      limbic reward regions and its involvement in higher-order executive
      function (for example, self-control, salience attribution and awareness).
    explanation: >-
      Summarises the human imaging basis for a prefrontal contribution. A
      review across addictive behaviours rather than a cocaine-specific
      measurement.
  downstream:
  - target: Compulsive Cocaine Seeking and Loss of Control
    causal_link_type: DIRECT
    description: >-
      Reduced executive control is what allows habitual, negatively reinforced
      seeking to proceed against the patient's stated intention.
- name: Compulsive Cocaine Seeking and Loss of Control
  conforms_to: "addiction_cycle#Compulsive Seeking and Loss of Control"
  biological_scale: ORGANISM
  node_class: BEHAVIOURAL_AND_COGNITIVE_MECHANISM
  description: >-
    The upstream arms converge on compulsive seeking with loss of control over
    intake. This is the clinical syndrome, and it is the node that maintains
    the exposure below it.
  evidence:
  - reference: PMID:27475769
    reference_title: "Neurobiology of addiction: a neurocircuitry analysis."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Drug addiction can be defined as a chronically relapsing disorder,
      characterised by compulsion to seek and take the drug, loss of control in
      limiting intake, and emergence of a negative emotional state (eg,
      dysphoria, anxiety, irritability) when access to the drug is prevented.
    explanation: >-
      The definition this node names, including the negative emotional state
      the withdrawal node carries separately.
  downstream:
  - target: Addictive cocaine use
    causal_link_type: DIRECT
  - target: Sustained Cocaine Exposure
    causal_link_type: DIRECT
    description: >-
      Continued compulsive use is what maintains the exposure that carries the
      overdose mortality.
- name: Sustained Cocaine Exposure
  biological_scale: ORGANISM
  node_class: ENVIRONMENTAL_EFFECT
  description: >-
    The dependence maintains a repeated exposure to cocaine. The acute
    cardiovascular and neurological toxicity of that exposure is curated in
    Cocaine_Intoxication rather than here; this node exists so the pathograph
    does not stop at the psychiatric syndrome and leave the overdose mortality
    unexplained.
  triggers:
  - preferred_term: exposure to cocaine
    term:
      id: ECTO:9000265
      label: exposure to cocaine
  evidence:
  - reference: PMID:33961037
    reference_title: "Comparison of Treatments for Cocaine Use Disorder Among Adults: A Systematic Review and Meta-analysis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the US and the United Kingdom, cocaine use is the second leading cause
      of illicit drug overdose death.
    explanation: >-
      Establishes that the maintained exposure is a leading cause of overdose
      death. Indirect because the statistic is about cocaine use rather than
      about dependence specifically.
mechanistic_hypotheses:
- hypothesis_group_id: cd_dat_blockade_canonical
  hypothesis_label: Dopamine transporter blockade is the reinforcing mechanism
  status: CANONICAL
  description: >-
    Cocaine reinforces because it blocks the dopamine transporter, raising
    accumbens dopamine. This is the reading the self-administration potency
    correlation established and the one the textbooks carry. It is recorded as
    canonical because it is the default against which the alternative below is
    read, not because the knockout data leave it unqualified.
- hypothesis_group_id: cd_monoamine_redundancy
  hypothesis_label: Dopamine and serotonin transporter blockade are redundant routes to the same reinforcement
  status: ALTERNATIVE
  description: >-
    Reinforcement does not require any one transporter, because blocking
    either the dopamine or the serotonin transporter suffices when the other
    is absent. The evidence is the double-knockout result: single knockouts of
    the dopamine, serotonin or noradrenaline transporter all leave cocaine
    reward intact, and only removing the dopamine and serotonin transporters
    together abolishes place preference. If this is right, a medication
    aimed at one transporter should be expected to fail, which is consistent
    with the absence of an approved drug.
- hypothesis_group_id: cd_deltafosb_persistence
  hypothesis_label: DeltaFosB accumulation is what makes the disorder outlast the exposure
  status: EMERGING
  description: >-
    The stability of DeltaFosB in striatal neurons is proposed as the
    mechanism by which episodes of drug exposure become a lasting change in
    drug sensitivity and seeking. Transgenic overexpression increases
    sensitivity to drugs of abuse, which is a demonstration of sufficiency in
    an engineered animal rather than evidence that this is what sustains the
    human disorder.

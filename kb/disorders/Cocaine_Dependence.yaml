    susceptibility type because this entry cites no human association study
    for variants in this gene: the transporter is here as the drug's target,
    which is a pharmacological fact rather than a gene-disease claim, and it is
    carried structurally on the transporter-blockade node. Reported
    associations between SLC6A3 variants and cocaine dependence exist in the
    literature and would be the thing to cite if this row is ever retyped.
differential_diagnoses:
- name: Cocaine intoxication
  description: >-
    The acute toxic syndrome of a single exposure, dominated by cocaine's
    local-anaesthetic action on voltage-gated sodium channels and by coronary
    vasoconstriction. It is a different disease from the chronic use disorder
    and is curated separately: a first-time user can have the intoxication
    without the dependence, and a dependent user is not always intoxicated.
  disease_term:
    preferred_term: cocaine intoxication
    term:
      id: MONDO:0019544
      label: cocaine intoxication
  distinguishing_features:
  - >-
    Intoxication is an acute, self-limiting state defined by a recent dose,
    where dependence is a pattern of behaviour over time defined by loss of
    control.
  - >-
    The sodium-channel pharmacology that drives cocaine's cardiovascular
    toxicity is not part of this entry's pathograph at all.
treatments:
- name: Contingency management with a community reinforcement approach
  description: >-
    Reinforcing verified abstinence with tangible rewards, combined with the
    community reinforcement approach. In the network meta-analysis of
    psychosocial interventions it was the only intervention that increased the
    number of abstinent patients against treatment as usual, at end of
    treatment, at twelve weeks and at longest follow-up, and it also had fewer
    dropouts. With no approved pharmacotherapy, this is the best-supported
    treatment for the disorder.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Behavioral Counseling
    term:
      id: NCIT:C181743
      label: Behavioral Counseling
  target_mechanisms:
  - target: Incentive Salience and Cocaine Cue Reactivity
    description: >-
      Contingency management puts a competing reinforcer against the drug's,
      acting on the same incentive-learning arm rather than on the
      pharmacology.
  evidence:
  - reference: PMID:30586362
    reference_title: "Comparative efficacy and acceptability of psychosocial interventions for individuals with cocaine and amphetamine addiction: A systematic review and network meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared to TAU, contingency management (CM) plus community reinforcement
      approach was the only intervention that increased the number of abstinent
      patients at the end of treatment (OR 2.84, 95% CI 1.24-6.51, P = 0.013),
      and also at 12 weeks (OR 7.60, 95% CI 2.03-28.37, P = 0.002) and at
      longest follow-up (OR 3.08, 95% CI 1.33-7.17, P = 0.008).
    explanation: >-
      The network meta-analysis result that singles this intervention out, with
      effects at three timepoints. Note the analysis pools cocaine with
      amphetamine addiction, so the estimate is not cocaine-specific.
  - reference: PMID:30586362
    reference_title: "Comparative efficacy and acceptability of psychosocial interventions for individuals with cocaine and amphetamine addiction: A systematic review and network meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We included 50 RCTs evaluating 12 psychosocial interventions or TAU in
      6,942 participants.
    explanation: >-
      Gives the evidence base behind the comparison, which is what makes a
      network meta-analysis the right source for ranking interventions none of
      which has been tested against all the others directly.
  notes: >-
    The source pools cocaine and amphetamine addiction and does not report a
    cocaine-only estimate, so this row's effect sizes are for the combined
    population. The same paper is the right source for the amphetamine entries
    when they are curated.
- name: Pharmacotherapy
  description: >-
    There is no approved pharmacotherapy for this disorder in the United
    States or Europe. The row exists to record the absence rather than a
    treatment: it is the clinically important fact about managing cocaine
    dependence, and it is what makes the mechanism nodes above a route to
    candidate drugs rather than an explanation of existing ones.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:33961037
    reference_title: "Comparison of Treatments for Cocaine Use Disorder Among Adults: A Systematic Review and Meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Psychosocial treatments for cocaine use disorder are limited, and no
      pharmacotherapy is approved for use in the US or Europe.
    explanation: >-
      States the absence of an approved drug, from a meta-analysis of 157
      trials selected for active cocaine use confirmed by urinalysis.
  - reference: PMID:31183685
    reference_title: Pharmacotherapy for Cocaine Use Disorder-a Systematic Review and Meta-analysis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Currently, there are no accepted FDA-approved pharmacotherapies for
      cocaine use disorder, though numerous medications have been tested in
      clinical trials.
    explanation: >-
      Sources both halves of this row's claim in one sentence: that no drug is
      approved, and that the absence is not for want of trials. A second
      systematic review searching MEDLINE, PsycINFO and the Cochrane Library,
      independent of the meta-analysis above.
  notes: >-
    No therapeutic_agent is bound, because there is no agent to bind. Numerous
    medications have been tested in clinical trials without reaching approval;
    this entry does not enumerate them.
discussions:
- discussion_id: cd_which_transporter_carries_reinforcement
  kind: CONTROVERSY
  prompt: >-
    Does cocaine reinforcement run through the dopamine transporter, or
    through whichever monoamine transporter is available?
  attaches_to:
  - pathophysiology#Monoamine Transporter Blockade by Cocaine
  - pathophysiology#Serotonergic Contribution to Cocaine Reinforcement
  - mechanistic_hypotheses#cd_dat_blockade_canonical
  - mechanistic_hypotheses#cd_monoamine_redundancy
  rationale: >-
    The potency correlation that made the dopamine transporter the canonical
    target is solid, and so is the double-knockout result that says no single
    transporter is required. Both are recorded, one as SUPPORT on the blockade
    node and one as REFUTE, because they are not reconcilable by picking a
    winner: the first is a correlation across drugs in intact animals, the
    second a sufficiency test in animals that developed without the
    transporter. The question matters practically rather than taxonomically.
    If reinforcement is redundant across transporters, a medication aimed at
    one of them should be expected to fail, and the disorder's lack of an
    approved drug is then a prediction of the mechanism rather than an
    accident of neglect.
- discussion_id: cd_no_approved_pharmacotherapy
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why has a well-localised molecular target produced no approved medication?
  attaches_to:
  - treatments#Pharmacotherapy
  - pathophysiology#Monoamine Transporter Blockade by Cocaine
  rationale: >-
    Cocaine's target was identified in 1987 and the disorder still has no
    approved drug in the United States or Europe, and not for want of trials:
    two independent systematic reviews record the absence alongside the
    numerous medications that have been tested. The gap is recorded here
    because it is the most consequential open question about this disease, and
    because the entry's own content suggests two non-exclusive reasons: the
    redundancy above, which would defeat a single-transporter agent, and the
    fact that blocking the target is itself reinforcing, so a competitive
    antagonist at the dopamine transporter is hard to separate from a
    stimulant. Neither is established as the explanation.

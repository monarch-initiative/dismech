  evidence:
  - reference: PMID:2899326
    reference_title: Drugs abused by humans preferentially increase synaptic dopamine concentrations in the mesolimbic system of freely moving rats.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Drugs abused by humans (e.g., opiates, ethanol, nicotine, amphetamine,
      and cocaine) increased extracellular dopamine concentrations in both
      areas, but especially in the accumbens, and elicited hypermotility at low
      doses.
    explanation: >-
      Brain dialysis in freely moving rats with cocaine among the drugs
      tested, giving the preferential accumbens rise this node asserts.
  downstream:
  - target: Incentive Salience and Cocaine Cue Reactivity
    causal_link_type: DIRECT
    description: >-
      Dopamine released in the presence of cocaine-associated cues is the
      teaching signal that gives those cues motivational value.
  - target: Reward Deficit and Stress-System Recruitment in Cocaine Abstinence
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Repeated supraphysiological mesolimbic dopamine signalling
    description: >-
      Repetition of the acute signal recruits the opponent adaptation; a
      single exposure does not.
  - target: DeltaFosB Accumulation in Striatal Neurons
    causal_link_type: DIRECT
    description: >-
      Repeated dopaminergic drive on striatal neurons is what drives the
      transcription factor's accumulation.
- name: Serotonergic Contribution to Cocaine Reinforcement
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Cocaine reinforcement does not require the dopamine transporter alone.
    Deleting the dopamine transporter, the serotonin transporter or the
    noradrenaline transporter singly leaves cocaine reward intact, and only
    deleting the dopamine and serotonin transporters together abolishes
    cocaine place preference. The reading this entry takes is redundancy: in
    the absence of one transporter the other can carry the reinforcement. It
    is marked provisional because the evidence is entirely from mice that
    developed without the transporter, so it bears on which targets are
    sufficient in that preparation rather than on which carries the effect in
    an intact human brain.
  molecular_functions:
  - preferred_term: serotonin transporter activity
    term:
      id: GO:0008504
      label: monoamine transmembrane transporter activity
    modifier: DECREASED
  genes:
  - preferred_term: SLC6A4
    term:
      id: hgnc:11050
      label: SLC6A4
  evidence:
  - reference: PMID:11320258
    reference_title: "Molecular mechanisms of cocaine reward: combined dopamine and serotonin transporter knockouts eliminate cocaine place preference."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, mice with no DAT and either no or one SERT gene copy display no
      preference for places where they have previously received cocaine.
    explanation: >-
      The result the node rests on: place preference survives loss of either
      transporter alone and is abolished only when both are removed.
  - reference: PMID:11320258
    reference_title: "Molecular mechanisms of cocaine reward: combined dopamine and serotonin transporter knockouts eliminate cocaine place preference."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, knockouts of neither DAT, SERT, or NET reduce cocaine
      reward/reinforcement, leaving substantial uncertainty about cocaine's
      molecular mechanisms for reward.
    explanation: >-
      Recorded as a refutation of the simpler claim that the dopamine
      transporter alone carries cocaine reinforcement, which the preceding
      node's canonical evidence would otherwise support unqualified. The
      authors state the uncertainty in their own words, so the entry carries
      the tension rather than resolving it.
  downstream:
  - target: Incentive Salience and Cocaine Cue Reactivity
    causal_link_type: DIRECT
    description: >-
      A parallel route to the same reinforcement, which is why removing the
      dopaminergic route alone does not abolish it.
- name: DeltaFosB Accumulation in Striatal Neurons
  biological_scale: MOLECULAR
  description: >-
    Repeated cocaine causes the transcription factor DeltaFosB to accumulate
    in a subset of nucleus accumbens and dorsal striatum neurons. It is
    unusually stable, so it persists long after the drug has gone, and
    transgenic mice that overexpress it are more sensitive to the behavioural
    effects of drugs of abuse. This is the entry's candidate answer to why the
    disorder outlasts the exposure.
  molecular_functions:
  - preferred_term: DeltaFosB transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: INCREASED
  genes:
  - preferred_term: FOSB
    term:
      id: hgnc:3797
      label: FOSB
  locations:
  - preferred_term: nucleus accumbens
    term:
      id: UBERON:0001882
      label: nucleus accumbens
  - preferred_term: dorsal striatum
    term:
      id: UBERON:0005382
      label: dorsal striatum
  evidence:
  - reference: PMID:11572966
    reference_title: "DeltaFosB: a sustained molecular switch for addiction."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      DeltaFosB, a member of the Fos family of transcription factors,
      accumulates within a subset of neurons of the nucleus accumbens and
      dorsal striatum (brain regions important for addiction) after repeated
      administration of many kinds of drugs of abuse.
    explanation: >-
      Names the protein, the cell populations and the anatomy this node binds.
      A review across drug classes rather than a cocaine-specific measurement.
  - reference: PMID:11572966
    reference_title: "DeltaFosB: a sustained molecular switch for addiction."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Importantly, DeltaFosB persists in neurons for relatively long periods
      of time because of its extraordinary stability.
    explanation: >-
      The property that makes this node a candidate explanation for a disorder
      that persists after the exposure stops, rather than one more acute drug
      effect.
  downstream:
  - target: Incentive Salience and Cocaine Cue Reactivity
    causal_link_type: DIRECT
    description: >-
      The transcriptional change is proposed to sustain the increased
      sensitivity to drug and drug cues.
  - target: Compulsive Cocaine Seeking and Loss of Control
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Stable striatal gene-expression change
    description: >-
      Overexpressing the protein increases sensitivity to drugs of abuse and,
      the authors suggest, drug seeking; the intermediate is the gene
      expression it drives rather than the protein itself.
- name: Incentive Salience and Cocaine Cue Reactivity
  conforms_to: "addiction_cycle#Incentive Salience and Habit Formation"
  biological_scale: CELLULAR
  description: >-
    Cocaine-associated cues acquire motivational value through pavlovian
    learning, and control over seeking migrates from goal-directed to habitual
    as it moves from ventral to more dorsal striatum.
  biological_processes:
  - preferred_term: drug-cue conditioning and habit learning
    term:
      id: GO:0008306

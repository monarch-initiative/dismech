  evidence:
  - reference: PMID:16251991
    reference_title: "Neural systems of reinforcement for drug addiction: from actions to habits to compulsion."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      We hypothesize that the change from voluntary drug use to more habitual
      and compulsive drug use represents a transition at the neural level from
      prefrontal cortical to striatal control over drug seeking and drug taking
      behavior as well as a progression from ventral to more dorsal domains of
      the striatum, involving its dopaminergic innervation.
    explanation: >-
      The framework statement of the ventral-to-dorsal transition this node
      asserts. The authors' hypothesis in a review, not a result, and not
      cocaine-specific.
  downstream:
  - target: Compulsive Cocaine Seeking and Loss of Control
    causal_link_type: DIRECT
    description: >-
      Once seeking is habitual and cue-driven it continues without being
      re-decided.
- name: Reward Deficit and Stress-System Recruitment in Cocaine Abstinence
  conforms_to: "addiction_cycle#Reward Deficit and Stress-System Recruitment"
  biological_scale: ORGANISM
  description: >-
    Abstinence lowers the function of the dopamine component of the reward
    system and recruits the extended-amygdala stress neurotransmitters, so
    continued use becomes negatively reinforced. This is the module's key
    conformance target and the stage at which the disorder becomes
    self-sustaining.
  biological_processes:
  - preferred_term: reduced mesolimbic dopamine signalling
    term:
      id: GO:0014046
      label: dopamine secretion
    modifier: DECREASED
  - preferred_term: corticotropin-releasing factor signalling in the extended amygdala
    term:
      id: GO:0071376
      label: cellular response to corticotropin-releasing hormone stimulus
    modifier: INCREASED
  locations:
  - preferred_term: nucleus accumbens
    term:
      id: UBERON:0001882
      label: nucleus accumbens
  - preferred_term: central amygdala
    term:
      id: UBERON:0002883
      label: central amygdaloid nucleus
  - preferred_term: bed nucleus of the stria terminalis
    term:
      id: UBERON:0001880
      label: bed nucleus of stria terminalis
  evidence:
  - reference: PMID:27475769
    reference_title: "Neurobiology of addiction: a neurocircuitry analysis."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      The increases in negative emotional states and dysphoric and stress-like
      responses in the withdrawal/negative affect stage involve decreases in the
      function of the dopamine component of the reward system and recruitment
      of brain stress neurotransmitters, such as corticotropin-releasing factor
      and dynorphin, in the neurocircuitry of the extended amygdala.
    explanation: >-
      Names both arms of the adaptation this node carries. A review synthesis
      across substances rather than a cocaine measurement.
  - reference: PMID:33318153
    reference_title: "Drug Addiction: Hyperkatifeia/Negative Reinforcement as a Framework for Medications Development."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Hyperkatifeia provides an additional source of motivation for compulsive
      drug seeking via negative reinforcement.
    explanation: >-
      States the role this node plays in the cycle: the negative affective
      state of withdrawal is itself a motive for seeking, over and above any
      positive effect of the drug. Taken from the framework paper that
      proposes hyperkatifeia as a medications-development target, which
      matters for a disorder with no approved medication.
  downstream:
  - target: Cocaine Withdrawal Syndrome
    causal_link_type: DIRECT
    description: >-
      The negative affective state is what the patient experiences and reports
      when cocaine is stopped.
  - target: Prefrontal Executive Control Deficit
    causal_link_type: DIRECT
    description: >-
      Prefrontal regulation of the basal ganglia and extended amygdala is
      degraded as the opponent adaptation establishes itself.
  - target: Compulsive Cocaine Seeking and Loss of Control
    causal_link_type: DIRECT
    description: >-
      Using to relieve the negative state is negative reinforcement, and it
      maintains use independently of any positive effect.
- name: Cocaine Withdrawal Syndrome
  biological_scale: ORGANISM
  description: >-
    Stopping cocaine after sustained use produces a dysphoric state with
    fatigue, disturbed sleep and increased appetite. It is not the
    life-threatening withdrawal of alcohol or the autonomic storm of opioids,
    which is part of why the disorder was once thought not to produce physical
    dependence, and it is nonetheless the state that negative reinforcement
    acts on.
  downstream:
  - target: Dysphoria
    causal_link_type: DIRECT
  - target: Fatigue
    causal_link_type: DIRECT
  - target: Insomnia
    causal_link_type: DIRECT
  - target: Increased appetite
    causal_link_type: DIRECT
- name: Prefrontal Executive Control Deficit
  conforms_to: "addiction_cycle#Prefrontal Executive Control Deficit"
  biological_scale: TISSUE
  description: >-
    Prefrontal regulation of limbic reward regions and of higher-order
    executive function is disrupted, so the capacity to act on an intention to
    stop is reduced at the point it is needed.

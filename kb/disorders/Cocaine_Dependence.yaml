name: Cocaine Dependence
creation_date: "2026-11-19T00:00:00Z"
category: Psychiatric
description: >-
  Cocaine dependence is a chronic, relapsing disorder of compulsive cocaine
  use. Its pharmacological trigger is unusually well localised: cocaine blocks
  the plasma-membrane transporters that clear dopamine, serotonin and
  noradrenaline from the synapse, and the potency with which a cocaine-like
  drug blocks the dopamine transporter predicts how hard an animal will work
  for it. What follows from that trigger is the shared addiction cycle. What
  does not follow is a treatment: no pharmacotherapy is approved for this
  disorder in the United States or Europe, and the best-supported intervention
  is a behavioural one. The entry therefore carries an unusual amount of its
  weight in the gap between a well-understood molecular target and the absence
  of a drug that exploits it.
disease_term:
  preferred_term: cocaine dependence
  term:
    id: MONDO:0005186
    label: cocaine dependence
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0004456
      label: cocaine abuse
    mapping_predicate: skos:closeMatch
    mapping_source: dismech curation
    mapping_justification: >-
      MONDO keeps cocaine abuse as a separate class from cocaine dependence,
      preserving the pre-DSM-5 split that DSM-5 merged into a single cocaine
      use disorder graded by severity. This entry is bound to the dependence
      term and covers the DSM-5 construct, so the abuse class overlaps it
      without being either exactly the same concept or strictly narrower, and
      the mapping is recorded as a close match rather than as an exact or
      narrow one. It is not recorded as a has_subtypes entry, because severity
      grading is not a subtype axis in this schema.
synonyms:
- Cocaine addiction
- Cocaine use disorder
parents:
- Substance Use Disorder
- Mental Health Disorder
notes: >-
  Scope. This entry is the chronic use disorder. Acute cocaine toxicity, which
  is dominated by the drug's separate local-anaesthetic action on voltage-gated
  sodium channels and by coronary vasoconstriction, is curated in
  Cocaine_Intoxication (MONDO:0019544) and is deliberately absent from this
  pathograph; the sodium-channel pharmacology is not modelled here at all. The
  two are listed as differential diagnoses of each other rather than merged,
  because a first-time user can have the intoxication without the dependence
  and a dependent user is not always intoxicated.
  Most of the cited trials ascertain adults with active cocaine use confirmed
  by urinalysis rather than a DSM diagnosis, and the two psychosocial
  syntheses pool cocaine with amphetamine, which is stated on each claim that
  rests on them.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population-based prevalence estimate of diagnosed cocaine dependence
    was located for this entry, so no rate is recorded. The mortality
    statement in clinical_burden is about overdose deaths rather than about
    the number of dependent people, and is not a prevalence measure.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Cocaine is the second leading cause of illicit drug overdose death in both
    the United States and the United Kingdom, and the disorder that sustains
    the exposure has no approved pharmacotherapy in either jurisdiction.
  evidence:
  - reference: PMID:33961037
    reference_title: "Comparison of Treatments for Cocaine Use Disorder Among Adults: A Systematic Review and Meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the US and the United Kingdom, cocaine use is the second leading cause
      of illicit drug overdose death. Psychosocial treatments for cocaine use
      disorder are limited, and no pharmacotherapy is approved for use in the
      US or Europe.
    explanation: >-
      States both halves of the burden in one sentence pair: the mortality
      rank, and the absence of an approved drug that would let it be treated
      pharmacologically. Quoted from the importance statement of a
      meta-analysis of 157 trials.
pathophysiology:
- name: Monoamine Transporter Blockade by Cocaine
  biological_scale: MOLECULAR
  description: >-
    Cocaine binds and blocks the plasma-membrane transporters for dopamine,
    serotonin and noradrenaline, so released transmitter is not cleared from
    the synapse. The dopamine transporter is the site that tracks the
    behaviour: across cocaine-like drugs, potency at inhibiting dopamine
    transporter binding predicts potency in self-administration, and potency
    at a large panel of other presynaptic and postsynaptic sites does not.
    Blockade of all three transporters, rather than of the dopamine
    transporter alone, is what the knockout work below forces the entry to
    model.
  molecular_functions:
  - preferred_term: monoamine transporter activity
    term:
      id: GO:0008504
      label: monoamine transmembrane transporter activity
    modifier: DECREASED
  - preferred_term: dopamine transporter activity
    term:
      id: GO:0005330
      label: dopamine:sodium symporter activity
    modifier: DECREASED
  genes:
  - preferred_term: SLC6A3
    term:
      id: hgnc:11049
      label: SLC6A3
  - preferred_term: SLC6A4
    term:
      id: hgnc:11050
      label: SLC6A4
  - preferred_term: SLC6A2
    term:
      id: hgnc:11048
      label: SLC6A2
  chemical_entities:
  - preferred_term: cocaine
    term:
      id: CHEBI:27958
      label: cocaine
  triggers:
  - preferred_term: exposure to cocaine
    term:
      id: ECTO:9000265
      label: exposure to cocaine
  evidence:
  - reference: PMID:2820058
    reference_title: Cocaine receptors on dopamine transporters are related to self-administration of cocaine.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus, the cocaine receptor related to substance abuse is proposed to be
      the one associated with dopamine uptake inhibition.
    explanation: >-
      The paper's conclusion from a correlation across cocaine-like drugs
      between self-administration potency and dopamine transporter binding in
      rat striatum, against a panel of other binding sites that did not
      correlate. This is the result that made the dopamine transporter the
      canonical target.
  - reference: PMID:11320258
    reference_title: "Molecular mechanisms of cocaine reward: combined dopamine and serotonin transporter knockouts eliminate cocaine place preference."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: >-
      Cocaine blocks uptake by neuronal plasma membrane transporters for
      dopamine (DAT), serotonin (SERT), and norepinephrine (NET).
    explanation: >-
      States the full set of transporters this node binds, which the
      dopamine-transporter result alone does not. Quoted from the paper's
      opening statement of established pharmacology rather than from its own
      knockout experiments.
  - reference: PMID:11320258
    reference_title: "Molecular mechanisms of cocaine reward: combined dopamine and serotonin transporter knockouts eliminate cocaine place preference."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, knockouts of neither DAT, SERT, or NET reduce cocaine
      reward/reinforcement, leaving substantial uncertainty about cocaine's
      molecular mechanisms for reward.
    explanation: >-
      Refutes the reading that the dopamine transporter alone carries cocaine
      reinforcement, which the potency correlation above would otherwise
      support unqualified. It sits on this node because that is the claim it
      cuts against; on the redundancy node below, the same sentence is
      supporting evidence rather than a refutation. The authors state the
      uncertainty in their own words, so the entry carries the tension rather
      than resolving it.
  downstream:
  - target: Elevated Synaptic Dopamine in the Nucleus Accumbens
    causal_link_type: DIRECT
    description: >-
      Blocking reuptake leaves released dopamine in the synapse for longer,
      which is how the transporter block becomes a dopamine signal.
  - target: Serotonergic Contribution to Cocaine Reinforcement
    causal_link_type: DIRECT
    description: >-
      The same drug molecule blocks the serotonin transporter, and the
      knockout work makes that a load-bearing part of the reinforcement rather
      than an incidental action.
- name: Elevated Synaptic Dopamine in the Nucleus Accumbens
  conforms_to: "addiction_cycle#Acute Mesolimbic Dopamine Reinforcement"
  biological_scale: CELLULAR
  description: >-
    Reuptake blockade raises extracellular dopamine, preferentially in the
    nucleus accumbens, which is the step cocaine shares with every other drug
    of abuse and the step the addiction cycle module anchors. Cocaine reaches
    it by preventing clearance rather than, as nicotine does, by driving
    release.
  biological_processes:
  - preferred_term: synaptic dopamine reuptake
    term:
      id: GO:0051583
      label: dopamine uptake involved in synaptic transmission
    modifier: DECREASED
  cell_types:
  - preferred_term: dopaminergic neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  locations:
  - preferred_term: nucleus accumbens
    term:
      id: UBERON:0001882
      label: nucleus accumbens
  - preferred_term: ventral tegmental area
    term:
      id: UBERON:0002691
      label: ventral tegmental area
  evidence:
  - reference: PMID:2899326
    reference_title: Drugs abused by humans preferentially increase synaptic dopamine concentrations in the mesolimbic system of freely moving rats.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Drugs abused by humans (e.g., opiates, ethanol, nicotine, amphetamine,
      and cocaine) increased extracellular dopamine concentrations in both
      areas, but especially in the accumbens, and elicited hypermotility at low
      doses.
    explanation: >-
      Brain dialysis in freely moving rats with cocaine among the drugs
      tested, giving the preferential accumbens rise this node asserts.
  downstream:
  - target: Incentive Salience and Cocaine Cue Reactivity
    causal_link_type: DIRECT
    description: >-
      Dopamine released in the presence of cocaine-associated cues is the
      teaching signal that gives those cues motivational value.
  - target: Reward Deficit and Stress-System Recruitment in Cocaine Abstinence
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Repeated supraphysiological mesolimbic dopamine signalling
    description: >-
      Repetition of the acute signal recruits the opponent adaptation; a
      single exposure does not.
  - target: DeltaFosB Accumulation in Striatal Neurons
    causal_link_type: DIRECT
    description: >-
      Repeated dopaminergic drive on striatal neurons is what drives the
      transcription factor's accumulation.
- name: Serotonergic Contribution to Cocaine Reinforcement
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Cocaine reinforcement does not require the dopamine transporter alone.
    Deleting the dopamine transporter, the serotonin transporter or the
    noradrenaline transporter singly leaves cocaine reward intact, and only
    deleting the dopamine and serotonin transporters together abolishes
    cocaine place preference. The reading this entry takes is redundancy: in
    the absence of one transporter the other can carry the reinforcement. It
    is marked provisional because the evidence is entirely from mice that
    developed without the transporter, so it bears on which targets are
    sufficient in that preparation rather than on which carries the effect in
    an intact human brain.
  molecular_functions:
  - preferred_term: serotonin transporter activity
    term:
      id: GO:0005335
      label: serotonin:sodium:chloride symporter activity
    modifier: DECREASED
  genes:
  - preferred_term: SLC6A4
    term:
      id: hgnc:11050
      label: SLC6A4
  evidence:
  - reference: PMID:11320258
    reference_title: "Molecular mechanisms of cocaine reward: combined dopamine and serotonin transporter knockouts eliminate cocaine place preference."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, mice with no DAT and either no or one SERT gene copy display no
      preference for places where they have previously received cocaine.
    explanation: >-
      The result the node rests on: place preference survives loss of either
      transporter alone and is abolished only when both are removed.
  downstream:
  - target: Incentive Salience and Cocaine Cue Reactivity
    causal_link_type: DIRECT
    description: >-
      A parallel route to the same reinforcement, which is why removing the
      dopaminergic route alone does not abolish it.
- name: DeltaFosB Accumulation in Striatal Neurons
  biological_scale: MOLECULAR
  description: >-
    Repeated cocaine causes the transcription factor DeltaFosB to accumulate
    in a subset of nucleus accumbens and dorsal striatum neurons. It is
    unusually stable, so it persists long after the drug has gone, and
    transgenic mice that overexpress it are more sensitive to the behavioural
    effects of drugs of abuse. This is the entry's candidate answer to why the
    disorder outlasts the exposure.
  molecular_functions:
  - preferred_term: DeltaFosB transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: INCREASED
  genes:
  - preferred_term: FOSB
    term:
      id: hgnc:3797
      label: FOSB
  locations:
  - preferred_term: nucleus accumbens
    term:
      id: UBERON:0001882
      label: nucleus accumbens
  - preferred_term: dorsal striatum
    term:
      id: UBERON:0005382
      label: dorsal striatum
  evidence:
  - reference: PMID:11572966
    reference_title: "DeltaFosB: a sustained molecular switch for addiction."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      DeltaFosB, a member of the Fos family of transcription factors,
      accumulates within a subset of neurons of the nucleus accumbens and
      dorsal striatum (brain regions important for addiction) after repeated
      administration of many kinds of drugs of abuse.
    explanation: >-
      Names the protein, the cell populations and the anatomy this node binds.
      A review across drug classes rather than a cocaine-specific measurement.
  - reference: PMID:11572966
    reference_title: "DeltaFosB: a sustained molecular switch for addiction."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Importantly, DeltaFosB persists in neurons for relatively long periods
      of time because of its extraordinary stability.
    explanation: >-
      The property that makes this node a candidate explanation for a disorder
      that persists after the exposure stops, rather than one more acute drug
      effect.
  downstream:
  - target: Incentive Salience and Cocaine Cue Reactivity
    causal_link_type: DIRECT
    description: >-
      The transcriptional change is proposed to sustain the increased
      sensitivity to drug and drug cues.
  - target: Compulsive Cocaine Seeking and Loss of Control
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Stable striatal gene-expression change
    description: >-
      Overexpressing the protein increases sensitivity to drugs of abuse and,
      the authors suggest, drug seeking; the intermediate is the gene
      expression it drives rather than the protein itself.
- name: Incentive Salience and Cocaine Cue Reactivity
  conforms_to: "addiction_cycle#Incentive Salience and Habit Formation"
  biological_scale: CELLULAR
  description: >-
    Cocaine-associated cues acquire motivational value through pavlovian
    learning, and control over seeking migrates from goal-directed to habitual
    as it moves from ventral to more dorsal striatum.
  biological_processes:
  - preferred_term: drug-cue conditioning and habit learning
    term:
      id: GO:0008306
      label: associative learning
    modifier: INCREASED
  locations:
  - preferred_term: ventral striatum
    term:
      id: UBERON:0005403
      label: ventral striatum
  - preferred_term: dorsal striatum
    term:
      id: UBERON:0005382
      label: dorsal striatum
  evidence:
  - reference: PMID:16251991
    reference_title: "Neural systems of reinforcement for drug addiction: from actions to habits to compulsion."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      We hypothesize that the change from voluntary drug use to more habitual
      and compulsive drug use represents a transition at the neural level from
      prefrontal cortical to striatal control over drug seeking and drug taking
      behavior as well as a progression from ventral to more dorsal domains of
      the striatum, involving its dopaminergic innervation.
    explanation: >-
      The framework statement of the ventral-to-dorsal transition this node
      asserts. The authors' hypothesis in a review, not a result, and not
      cocaine-specific.
  downstream:
  - target: Compulsive Cocaine Seeking and Loss of Control
    causal_link_type: DIRECT
    description: >-
      Once seeking is habitual and cue-driven it continues without being
      re-decided.
- name: Reward Deficit and Stress-System Recruitment in Cocaine Abstinence
  conforms_to: "addiction_cycle#Reward Deficit and Stress-System Recruitment"
  biological_scale: ORGANISM
  description: >-
    Abstinence lowers the function of the dopamine component of the reward
    system and recruits the extended-amygdala stress neurotransmitters, so
    continued use becomes negatively reinforced. This is the module's key
    conformance target and the stage at which the disorder becomes
    self-sustaining.
  biological_processes:
  - preferred_term: reduced mesolimbic dopamine signalling
    term:
      id: GO:0014046
      label: dopamine secretion
    modifier: DECREASED
  - preferred_term: corticotropin-releasing factor signalling in the extended amygdala
    term:
      id: GO:0071376
      label: cellular response to corticotropin-releasing hormone stimulus
    modifier: INCREASED
  locations:
  - preferred_term: nucleus accumbens
    term:
      id: UBERON:0001882
      label: nucleus accumbens
  - preferred_term: central amygdala
    term:
      id: UBERON:0002883
      label: central amygdaloid nucleus
  - preferred_term: bed nucleus of the stria terminalis
    term:
      id: UBERON:0001880
      label: bed nucleus of stria terminalis
  evidence:
  - reference: PMID:27475769
    reference_title: "Neurobiology of addiction: a neurocircuitry analysis."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      The increases in negative emotional states and dysphoric and stress-like
      responses in the withdrawal/negative affect stage involve decreases in the
      function of the dopamine component of the reward system and recruitment
      of brain stress neurotransmitters, such as corticotropin-releasing factor
      and dynorphin, in the neurocircuitry of the extended amygdala.
    explanation: >-
      Names both arms of the adaptation this node carries. A review synthesis
      across substances rather than a cocaine measurement.
  - reference: PMID:33318153
    reference_title: "Drug Addiction: Hyperkatifeia/Negative Reinforcement as a Framework for Medications Development."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Hyperkatifeia provides an additional source of motivation for compulsive
      drug seeking via negative reinforcement.
    explanation: >-
      States the role this node plays in the cycle: the negative affective
      state of withdrawal is itself a motive for seeking, over and above any
      positive effect of the drug. Taken from the framework paper that
      proposes hyperkatifeia as a medications-development target, which
      matters for a disorder with no approved medication.
  downstream:
  - target: Cocaine Withdrawal Syndrome
    causal_link_type: DIRECT
    description: >-
      The negative affective state is what the patient experiences and reports
      when cocaine is stopped.
  - target: Prefrontal Executive Control Deficit
    causal_link_type: DIRECT
    description: >-
      Prefrontal regulation of the basal ganglia and extended amygdala is
      degraded as the opponent adaptation establishes itself.
  - target: Compulsive Cocaine Seeking and Loss of Control
    causal_link_type: DIRECT
    description: >-
      Using to relieve the negative state is negative reinforcement, and it
      maintains use independently of any positive effect.
- name: Cocaine Withdrawal Syndrome
  biological_scale: ORGANISM
  description: >-
    Stopping cocaine after sustained use produces a dysphoric state with
    fatigue, disturbed sleep and increased appetite. It is not the
    life-threatening withdrawal of alcohol or the autonomic storm of opioids,
    which is part of why the disorder was once thought not to produce physical
    dependence, and it is nonetheless the state that negative reinforcement
    acts on.
  downstream:
  - target: Dysphoria
    causal_link_type: DIRECT
  - target: Fatigue
    causal_link_type: DIRECT
  - target: Insomnia
    causal_link_type: DIRECT
  - target: Increased appetite
    causal_link_type: DIRECT
- name: Prefrontal Executive Control Deficit
  conforms_to: "addiction_cycle#Prefrontal Executive Control Deficit"
  biological_scale: TISSUE
  description: >-
    Prefrontal regulation of limbic reward regions and of higher-order
    executive function is disrupted, so the capacity to act on an intention to
    stop is reduced at the point it is needed.
  biological_processes:
  - preferred_term: prefrontal glutamatergic projection signalling
    term:
      id: GO:0014047
      label: glutamate secretion
    modifier: DECREASED
  locations:

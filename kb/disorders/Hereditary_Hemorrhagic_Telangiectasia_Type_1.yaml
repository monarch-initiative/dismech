      Reducing epistaxis severity implies action on the nasal mucosal
      telangiectases that bleed.
    evidence:
    - reference: PMID:39292928
      reference_title: >-
        Pomalidomide for Epistaxis in Hereditary Hemorrhagic Telangiectasia.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Among patients with HHT, pomalidomide treatment resulted in a
        significant, clinically relevant reduction in epistaxis severity.
      explanation: >-
        Indirect: the trial measured epistaxis severity, a clinical readout, and
        did not image or biopsy the telangiectases themselves.
  evidence:
  - reference: PMID:39292928
    reference_title: >-
      Pomalidomide for Epistaxis in Hereditary Hemorrhagic Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At 24 weeks, the mean difference between the pomalidomide group and the
      placebo group in the change from baseline in the Epistaxis Severity Score
      was -0.94 points (95% confidence interval [CI], -1.57 to -0.31; P = 0.004).
    explanation: >-
      The primary efficacy result behind this treatment record.
  - reference: PMID:39292928
    reference_title: >-
      Pomalidomide for Epistaxis in Hereditary Hemorrhagic Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Adverse events that were more common in the pomalidomide group than in the

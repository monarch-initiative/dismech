- name: Right-to-Left Shunt Physiology
  biological_scale: ORGANISM
  description: >-
    Blood traversing a pulmonary AVM bypasses both gas exchange and the
    pulmonary capillary filter. The first consequence is hypoxemia and exertional
    breathlessness; the second is that venous emboli and bacteria reach the
    systemic and cerebral circulation, producing paradoxical embolic stroke and
    brain abscess. Neurological manifestations secondary to shunting were
    observed only in HHT1 patients in a systematically screened cohort, and
    respiratory symptoms were likewise mainly an HHT1 finding.

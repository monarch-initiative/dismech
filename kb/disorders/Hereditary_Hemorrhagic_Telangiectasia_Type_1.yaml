prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_low: 4.7
  rate_high: 10.0
  notes: >-
    Derived, not directly measured. No population survey reports a prevalence for
    ENG-related HHT1 as such, so this record combines two separately cited facts:
    the occurrence of HHT as a whole, and the ENG share of molecularly solved
    cases, which is roughly half. The arithmetic joining them is this entry's.

    It is recorded as a range rather than a point because the first input is
    contested. The commonly quoted figure of 1 in 5,000 (20 per 100,000) halves
    to 10 per 100,000. A Swedish national-register study instead measured HHT at
    9.3 per 100,000, which halves to about 4.7; those authors attribute the
    shortfall to underdiagnosis of milder cases. The honest answer is the
    interval between the two rather than either endpoint, so the estimate is
    bounded by ascertainment rather than precise.
  evidence:
  - reference: PMID:39062925
    reference_title: >-
      Investigation of the Genetic Determinants of Telangiectasia and Solid Organ
      Arteriovenous Malformation Formation in Hereditary Hemorrhagic
      Telangiectasia (HHT).
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hereditary Hemorrhagic Telangiectasia (HHT) is an autosomal dominant
      inherited vascular malformation disorder that occurs in 1 in 5000
      individuals
    explanation: >-
      Supplies the parent-disease occurrence rate that the HHT1 estimate is
      derived from. Indirect because it is a statement about HHT overall, not
      about the ENG-related subset.
  - reference: PMID:39062925
    reference_title: >-
      Investigation of the Genetic Determinants of Telangiectasia and Solid Organ
      Arteriovenous Malformation Formation in Hereditary Hemorrhagic
      Telangiectasia (HHT).
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ENG and ACVRL1 mutations account for roughly equal percentages of the
      disorder and are found in 96.1% of cases with HHT when the consensus
      Curaçao Criteria are strictly applied
    explanation: >-
      Supplies the ENG share of molecularly solved HHT, the second term in the
      derivation. Indirect for the same reason: it reports a genotype
      distribution, not a population rate for HHT1.
  - reference: PMID:42410718
    reference_title: "Expected survival is decreased in hereditary hemorrhagic telangiectasia: Results from a population-based registry study."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The prevalence of HHT was estimated at 9.3 per 100,000 over the 12 years.
    explanation: >-
      A measured registry prevalence for HHT overall, well below the commonly
      quoted 1 in 5,000. Halved for the ENG share it yields about 4.7 per
      100,000, which is the lower bound of the range recorded here. Indirect
      because it measures HHT, not the ENG-related subset.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    HHT1 is transmitted as an autosomal dominant trait with age-related
    penetrance of individual manifestations and marked variability both between
    and within families, including among relatives carrying the same ENG variant.
  evidence:
  - reference: PMID:20301525
    reference_title: Hereditary Hemorrhagic Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HHT is inherited in an autosomal dominant manner with considerable
      intrafamilial variability and age-related penetrance of individual
      manifestations.
    explanation: >-
      GeneReviews states the mode of inheritance and the penetrance behaviour
      that HHT1 shares with the other molecular forms.
  - reference: PMID:7894484
    reference_title: >-
      Endoglin, a TGF-beta binding protein of endothelial cells, is the gene for
      hereditary haemorrhagic telangiectasia type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hereditary haemorrhagic telangiectasia (HHT) is an autosomal dominant
      disorder characterized by multisystemic vascular dysplasia and recurrent
      haemorrhage.
    explanation: >-
      The paper that identified ENG as the HHT1 gene states the dominant mode of
      transmission for the families in which the gene was mapped.
genetic:
- name: ENG
  presence: PRESENT
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: ENG
    term:
      id: hgnc:3349
      label: ENG
  notes: >-
    Heterozygous loss-of-function variants in ENG at 9q34, encoding the
    endothelial TGF-beta superfamily co-receptor endoglin, define HHT1. The
    originally reported alleles were a nonsense substitution and two deletions
    creating premature termination codons, establishing a truncating,
    loss-of-function mechanism from the outset.
  case_fractions:
  - population: Molecularly solved HHT meeting strict Curaçao criteria
    notes: >-
      ENG and ACVRL1 are reported to contribute roughly equal shares of solved
      cases; the source gives the combined ENG + ACVRL1 detection rate (96.1%)
      and the equality statement rather than a separate ENG percentage, so no
      single numeric case_fraction_percent is asserted here.
    evidence:
    - reference: PMID:39062925
      reference_title: >-
        Investigation of the Genetic Determinants of Telangiectasia and Solid
        Organ Arteriovenous Malformation Formation in Hereditary Hemorrhagic
        Telangiectasia (HHT).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        ENG and ACVRL1 mutations account for roughly equal percentages of the
        disorder and are found in 96.1% of cases with HHT when the consensus
        Curaçao Criteria are strictly applied
      explanation: >-
        Quantifies the ENG contribution to solved HHT as approximately half of
        the 96.1% jointly attributable to ENG and ACVRL1.
  evidence:
  - reference: PMID:7894484
    reference_title: >-
      Endoglin, a TGF-beta binding protein of endothelial cells, is the gene for
      hereditary haemorrhagic telangiectasia type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified endoglin as the HHT gene mapping to 9q3 and have
      established HHT as the first human disease defined by a mutation in a
      member of the TGF-beta receptor complex.
    explanation: >-
      The gene-identification result that defines HHT1 as the ENG-related form.
  - reference: PMID:7894484
    reference_title: >-
      Endoglin, a TGF-beta binding protein of endothelial cells, is the gene for
      hereditary haemorrhagic telangiectasia type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified mutations in three affected individuals: a C to G
      substitution converting a tyrosine to a termination codon, a 39 base pair
      deletion and a 2 basepair deletion which creates a premature termination
      codon.
    explanation: >-
      The founding allele series is truncating, which is the basis for assigning
      functional_impact_category LOSS_OF_FUNCTION.
  - reference: PMID:39062925
    reference_title: >-
      Investigation of the Genetic Determinants of Telangiectasia and Solid Organ
      Arteriovenous Malformation Formation in Hereditary Hemorrhagic
      Telangiectasia (HHT).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Endoglin (ENG), activin A receptor type II-like 1 (ACVRL1/ALK1), and SMAD4
      mutations cause HHT1 (OMIM 187300), HHT2 (OMIM 600376), and the combined
      Juvenile Polyposis/HHT (JP/HHT) syndrome (OMIM 175050), respectively
      [3,4,5].
    explanation: >-
      Confirms the gene-to-numbered-type assignment, including the OMIM anchor
      187300 for the ENG form curated here.
pathophysiology:
- name: ENG Loss-of-Function Germline Variant
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: ENG
      term:
        id: hgnc:3349
        label: ENG
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Heterozygous truncating ENG alleles at 9q34. The founding series comprised
      a nonsense substitution and two deletions creating premature termination
      codons, so the mechanism is loss of functional protein rather than altered
      activity.
  description: >-
    A heterozygous truncating or otherwise inactivating variant in ENG at 9q34 is
    inherited through the family. The founding alleles were a nonsense codon and
    two frameshifting deletions, so the primary lesion removes functional protein
    rather than altering its activity.
  downstream:
  - target: Endoglin Haploinsufficiency in Vascular Endothelium
    causal_link_type: DIRECT
    description: >-
      Only the wild-type allele produces surface protein, so the germline
      truncating allele translates directly into reduced endothelial endoglin.
    evidence:
    - reference: PMID:10562296
      reference_title: A murine model of hereditary hemorrhagic telangiectasia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Hereditary hemorrhagic telangiectasia type 1 (HHT1) is associated with
        mutations in the Endoglin gene, leading to haploinsufficiency.
      explanation: >-
        States the step from ENG mutation to haploinsufficiency, which is exactly
        this edge.
  evidence:
  - reference: PMID:7894484
    reference_title: >-
      Endoglin, a TGF-beta binding protein of endothelial cells, is the gene for
      hereditary haemorrhagic telangiectasia type 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified mutations in three affected individuals: a C to G
      substitution converting a tyrosine to a termination codon, a 39 base pair
      deletion and a 2 basepair deletion which creates a premature termination
      codon.
    explanation: >-
      Documents the initiating germline lesion and its truncating character.
- name: Endoglin Haploinsufficiency in Vascular Endothelium
  biological_scale: MOLECULAR
  description: >-
    Endothelial cells carry roughly half the normal complement of endoglin, an
    accessory protein of the TGF-beta receptor superfamily that is highly
    expressed on endothelium. Mutant protein is largely absent from the cell
    surface, so the phenotype follows from reduced dosage of the wild-type
    product rather than from a dominant-negative species.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  downstream:
  - target: Impaired BMP9-ALK1-SMAD1/5/8 Endothelial Signaling
    causal_link_type: DIRECT
    description: >-
      Endoglin is required for BMP9-driven SMAD1 phosphorylation in endothelial
      cells, so reduced endoglin lowers flux through this pathway.
    evidence:
    - reference: PMID:23300529
      reference_title: >-
        Endoglin requirement for BMP9 signaling in endothelial cells reveals new
        mechanism of action for selective anti-endoglin antibodies.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We also demonstrate, using siRNA depletion of ENG and novel anti-ENG
        antibodies, that ENG is required for BMP9/pSMAD1 signaling in all human
        and mouse endothelial cells tested.
      explanation: >-
        Depleting ENG abolishes BMP9/pSMAD1 signaling, which establishes the
        dependence this edge asserts.
  evidence:
  - reference: PMID:10562296
    reference_title: A murine model of hereditary hemorrhagic telangiectasia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Endoglin (CD105), an accessory protein of the TGF-beta receptor
      superfamily, is highly expressed on endothelial cells.
    explanation: >-
      Establishes endoglin's identity and endothelial expression, the substrate
      of this node.
- name: Impaired BMP9-ALK1-SMAD1/5/8 Endothelial Signaling
  biological_scale: CELLULAR
  description: >-
    Endoglin acts as a co-receptor alongside ALK1, the ACVRL1 gene product, in
    the endothelial BMP9 pathway that phosphorylates SMAD1/5/8. Reduced endoglin
    lowers signalling through this axis. That ENG and ACVRL1 lesions converge on
    one pathway is the accepted explanation for why HHT1 and HHT2 are clinically
    similar disorders despite different genes.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: BMP9-driven endothelial BMP signaling
    term:
      id: GO:0030509
      label: BMP signaling pathway
    modifier: DECREASED
  - preferred_term: SMAD1/5/8 signal transduction
    term:
      id: GO:0060395
      label: SMAD protein signal transduction
    modifier: DECREASED
  downstream:
  - target: Dysregulated Endothelial Angiogenic Response
    causal_link_type: DIRECT
    description: >-
      Loss of BMP9/ALK1/endoglin signalling releases the endothelium from a
      pathway required for orderly angiogenesis.
    evidence:
    - reference: PMID:23300529
      reference_title: >-
        Endoglin requirement for BMP9 signaling in endothelial cells reveals new
        mechanism of action for selective anti-endoglin antibodies.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Finally, anti-ENG antibodies that interfere with BMP9/pSMAD1 signaling,
        but not with TGFβ1/pSMAD3 signaling, also decrease in vitro HUVEC
        endothelial tube formation
      explanation: >-
        Blocking the BMP9/pSMAD1 arm alone changes endothelial tube formation,
        tying this signalling deficit to an altered angiogenic response.
  evidence:
  - reference: PMID:23300529
    reference_title: >-
      Endoglin requirement for BMP9 signaling in endothelial cells reveals new
      mechanism of action for selective anti-endoglin antibodies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      ENG and ACVRL1 are both required for angiogenesis and mutations in either
      gene are associated with Hereditary Hemorrhagic Telangectasia, a rare
      genetic vascular disorder.
    explanation: >-
      Places ENG and ALK1 in one angiogenic pathway, which is what makes this a
      shared HHT1/HHT2 node. The source spells the disease "Telangectasia"; the
      snippet preserves the original text.
  - reference: PMID:28564608
    reference_title: >-
      Structural Basis of the Human Endoglin-BMP9 Interaction: Insights into BMP
      Signaling and HHT1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      BMP9 interacts with a hydrophobic surface of the N-terminal orphan domain
      of ENG, which adopts a new duplicated fold generated by circular
      permutation. The interface involves residues mutated in HHT1 and overlaps
      with the epitope of tumor-suppressing anti-ENG monoclonal TRC105.
    explanation: >-
      Crystallography places HHT1-mutated residues directly on the BMP9-binding
      surface of endoglin, which is the structural reason ENG variants impair
      this pathway and not merely a correlation between the two.
  - reference: PMID:28564608
    reference_title: >-
      Structural Basis of the Human Endoglin-BMP9 Interaction: Insights into BMP
      Signaling and HHT1.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The structure of the C-terminal zona pellucida module suggests how two
      copies of ENG embrace homodimeric BMP9, whose binding is compatible with
      ligand recognition by type I but not type II receptors.
    explanation: >-
      Explains endoglin's ligand-presentation role to the type I receptor ALK1,
      which is the architecture this node depends on.
- name: Somatic Second-Hit Biallelic ENG Inactivation
  biological_scale: MOLECULAR
  description: >-
    The germline variant is present in every cell, yet malformations form in only
    a small minority of vessels. A very-low-level somatic loss-of-function
    mutation on the second ENG allele within the lesional endothelium supplies
    the focal trigger. Loss of heterozygosity at ENG has been demonstrated in a
    brain AVM in which the germline and somatic loss-of-function mutations lay on
    different alleles. This node explains the focality and the intrafamilial
    variability that haploinsufficiency alone does not.
  downstream:
  - target: Dysregulated Endothelial Angiogenic Response
    causal_link_type: DIRECT
    description: >-
      Biallelic inactivation in a clone of endothelial cells converts a
      uniformly haploinsufficient vasculature into a focal lesion.
    evidence:
    - reference: PMID:39062925
      reference_title: >-
        Investigation of the Genetic Determinants of Telangiectasia and Solid
        Organ Arteriovenous Malformation Formation in Hereditary Hemorrhagic
        Telangiectasia (HHT).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This is the first report that nasal telangiectasias and solid organ AVMs
        in HHT are caused by very-low-level somatic biallelic second-hit
        mutations.
      explanation: >-
        States the causal claim this edge makes, that the second hit is what
        produces the lesion.
  evidence:
  - reference: PMID:39062925
    reference_title: >-
      Investigation of the Genetic Determinants of Telangiectasia and Solid Organ
      Arteriovenous Malformation Formation in Hereditary Hemorrhagic
      Telangiectasia (HHT).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      including the loss of heterozygosity in ENG in one brain AVM sample, in
      which the germline mutation occurred in a different allele than a nearby
      somatic mutation (both are loss-of-function mutations)
    explanation: >-
      The ENG-specific demonstration of biallelic inactivation in a lesion, which
      is what makes this node HHT1 evidence rather than generic HHT evidence.
  - reference: PMID:39062925
    reference_title: >-
      Investigation of the Genetic Determinants of Telangiectasia and Solid Organ
      Arteriovenous Malformation Formation in Hereditary Hemorrhagic
      Telangiectasia (HHT).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with HHT harbor these heterozygous germline mutations in every
      cell of the body, yet vascular malformations occur in only a small minority
      of vessels, with predilection for specific anatomic locations.
    explanation: >-
      States the focality problem that this node exists to solve.
  - reference: PMID:39299239
    reference_title: >-
      Somatic mutations in arteriovenous malformations in hereditary hemorrhagic
      telangiectasia support a bi-allelic two-hit mutation mechanism of
      pathogenesis.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we show that another mechanism for the second hit is loss of
      heterozygosity across the chromosome bearing the germline mutation.
    explanation: >-
      Adds loss of heterozygosity as a second route to biallelic inactivation
      alongside a somatic point mutation. Indirect because the paper works at the
      level of "an HHT gene" rather than reporting ENG separately.
  - reference: PMID:39299239
    reference_title: >-
      Somatic mutations in arteriovenous malformations in hereditary hemorrhagic
      telangiectasia support a bi-allelic two-hit mutation mechanism of
      pathogenesis.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also identified somatic mutations in one pulmonary AVM and two brain
      AVMs, confirming that mucocutaneous and internal organ vascular
      malformations undergo the same molecular mechanisms.
    explanation: >-
      Extends the second-hit mechanism to the pulmonary and cerebral lesions that
      dominate HHT1, rather than leaving it established only for skin
      telangiectases. Indirect for the same gene-agnostic reason.
- name: Dysregulated Endothelial Angiogenic Response
  biological_scale: CELLULAR
  description: >-
    Endothelial cells deficient in endoglin signalling mount a disordered
    angiogenic and remodelling response. In the endoglin-null embryo the
    primitive vascular plexus fails to mature into defined vessels and the
    resulting channels dilate and rupture, which is the developmental extreme of
    the same defect.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: dysregulated angiogenesis
    term:
      id: GO:0001525
      label: angiogenesis
    modifier: DYSREGULATED
  - preferred_term: blood vessel remodeling
    term:
      id: GO:0001974
      label: blood vessel remodeling
    modifier: ABNORMAL
  downstream:
  - target: Loss of the Intervening Capillary Bed
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:10562296
    reference_title: A murine model of hereditary hemorrhagic telangiectasia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The primitive vascular plexus of the yolk sac fails to mature into defined
      vessels, and vascular channels dilate and rupture.
    explanation: >-
      Shows that removing endoglin leaves vessel maturation disordered and the
      resulting channels fragile.
  - reference: PMID:39062925
    reference_title: >-
      Investigation of the Genetic Determinants of Telangiectasia and Solid Organ
      Arteriovenous Malformation Formation in Hereditary Hemorrhagic
      Telangiectasia (HHT).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in these genes lead to an underproduction of functional proteins,
      resulting in excessive abnormal angiogenesis [10].
    explanation: >-
      States the angiogenic consequence of underproduced ENG/ACVRL1 protein.
- name: Loss of the Intervening Capillary Bed
  biological_scale: TISSUE
  description: >-
    The defining lesion of HHT is an arteriovenous malformation that lacks
    intervening capillaries, so an artery drains directly into a vein. Small
    lesions of this kind are the mucocutaneous telangiectases; large ones are the
    visceral AVMs. Both the fragility that causes bleeding and the shunt
    physiology that causes the neurological complications follow from this single
    architectural change.
  downstream:
  - target: Mucocutaneous Telangiectasia Formation
    causal_link_type: DIRECT
  - target: Pulmonary Arteriovenous Malformation Formation
    causal_link_type: DIRECT
  - target: Cerebral Arteriovenous Malformation Formation
    causal_link_type: DIRECT
  - target: Hepatic arteriovenous malformation
    causal_link_type: DIRECT
    description: >-
      Hepatic AVMs arise by the same architectural mechanism in HHT1, though they
      are the lesion that predominates in HHT2 rather than here.
    evidence:
    - reference: PMID:20301525
      reference_title: Hereditary Hemorrhagic Telangiectasia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Large AVMs occur most often in the lungs, liver, or brain; complications
        from bleeding or shunting may be sudden and catastrophic.
      explanation: >-
        Names the liver among the organs in which the capillary-free AVM lesion
        forms.
  evidence:
  - reference: PMID:20301525
    reference_title: Hereditary Hemorrhagic Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hereditary hemorrhagic telangiectasia (HHT) is characterized by the
      presence of multiple arteriovenous malformations (AVMs) that lack
      intervening capillaries and result in direct connections between arteries
      and veins.
    explanation: >-
      Defines the architectural lesion this node names.
  - reference: PMID:20301525
    reference_title: Hereditary Hemorrhagic Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Large AVMs occur most often in the lungs, liver, or brain; complications
      from bleeding or shunting may be sudden and catastrophic.
    explanation: >-
      Supports the branch of this node into the organ-specific lesions below it.
- name: Mucocutaneous Telangiectasia Formation
  biological_scale: TISSUE
  description: >-
    Small AVMs form in the nasal, oral and gastrointestinal mucosa and in the
    skin of the fingers and face. These thin-walled lesions bleed on minor
    trauma, which makes them the source of epistaxis and of chronic occult
    gastrointestinal blood loss. Somatic second hits are detectable in a
    substantial fraction of nasal and dermal telangiectases.
  downstream:
  - target: Recurrent epistaxis
    causal_link_type: DIRECT
  - target: Gastrointestinal hemorrhage
    causal_link_type: DIRECT
  - target: Mucocutaneous telangiectasia

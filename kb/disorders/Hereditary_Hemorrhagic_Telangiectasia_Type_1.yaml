- name: Genetic Counseling and Predictive Testing
  therapeutic_modality: BEHAVIORAL
  description: >-
    Autosomal dominant transmission with a 50% recurrence risk to offspring makes
    counseling and cascade testing central to management. Once the family variant
    is known, predictive testing of at-risk relatives is possible; if it is not,
    at-risk relatives are screened clinically.
  treatment_term:

diagnosis:
- name: Molecular diagnosis by ENG sequencing
  diagnosis_term:
    preferred_term: ENG sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    HHT1 is established molecularly by identifying a heterozygous pathogenic ENG
    variant. Clinically, HHT is diagnosed by the Curaçao criteria - recurrent
    epistaxis, characteristic mucocutaneous telangiectases, visceral AVMs and an
    affected first-degree relative - with three of four establishing the
    diagnosis; the criteria themselves do not distinguish HHT1 from HHT2, so the
    numbered type is a molecular assignment. A large pulmonary AVM in a patient
    under 45 is the clinical finding that most argues for testing ENG first.
  evidence:
  - reference: PMID:20301525
    reference_title: Hereditary Hemorrhagic Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The molecular diagnosis is established by identification of a heterozygous
      pathogenic variant in ACVRL1, ENG, or SMAD4 by molecular genetic testing.
    explanation: >-
      States that the molecular diagnosis rests on identifying the heterozygous
      gene variant, which for HHT1 is ENG.
  - reference: PMID:20301525
    reference_title: Hereditary Hemorrhagic Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical diagnosis of HHT can be established in a proband with at least
      three of the following diagnostic criteria: recurrent epistaxis;
      mucocutaneous telangiectases in characteristic locations; visceral AVMs; a
      first-degree relative diagnosed with HHT on the basis of the preceding
      criteria.
    explanation: >-
      The Curaçao criteria as stated by GeneReviews, and the three-of-four
      threshold.
  - reference: PMID:17388964
    reference_title: >-
      Hereditary hemorrhagic telangiectasia: clinical features in ENG and ALK1
      mutation carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ENG gene should be first targeted for mutational screening in the
      presence of large PAVM in patients < 45 years.
    explanation: >-
      Gives the phenotype-directed testing strategy that prioritises ENG.
- name: Screening for pulmonary arteriovenous malformations
  diagnosis_term:
    preferred_term: transthoracic contrast echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  description: >-
    Because PAVMs in HHT1 are frequently asymptomatic yet carry stroke and
    abscess risk, detection is by scheduled screening rather than by symptoms.
    GeneReviews recommends evaluation every five years with transthoracic
    contrast echocardiography in adults, and TCE or chest radiograph with pulse
    oximetry in children.
  evidence:
  - reference: PMID:20301525
    reference_title: Hereditary Hemorrhagic Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      evaluation for pulmonary AVMs every five years with transthoracic contrast
      echocardiography (TCE) in adults and TCE or chest radiograph with pulse
      oximetry in children
    explanation: >-
      The recommended surveillance modality and interval.
  - reference: PMID:17224686
    reference_title: >-
      Genotype-phenotype correlations in hereditary hemorrhagic telangiectasia:
      data from the French-Italian HHT network.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PAVMs were more frequently detected in asymptomatic HHT1 patients (54 vs.
      12.8%, P<0.0001).
    explanation: >-
      Quantifies the asymptomatic PAVM burden in HHT1 that makes screening rather
      than symptom-led investigation necessary.
- name: Screening for cerebral arteriovenous malformations
  diagnosis_term:
    preferred_term: contrast-enhanced brain MRI with blood-product-sensitive sequences
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    Cerebral AVMs are the other HHT1-distinguishing lesion (20% in HHT1 versus 0%
    in HHT2 on systematic screening), so surveillance for them belongs alongside
    the pulmonary screening above. GeneReviews recommends brain MRI with and
    without contrast, using sequences that detect blood products, in infancy and
    again by age 18-20 years.
  evidence:
  - reference: PMID:20301525
    reference_title: Hereditary Hemorrhagic Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      brain MRI with and without contrast using sequences that detect blood
      products in infancy and again by age 18-20 years for cerebral AVMs
    explanation: >-
      The recommended cerebral surveillance modality, sequence requirement and
      the two ages at which it is performed.
  - reference: PMID:17388964
    reference_title: >-
      Hereditary hemorrhagic telangiectasia: clinical features in ENG and ALK1
      mutation carriers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PAVMs and CAVMs were significantly more frequent in HHT1 (75% vs. 44%, P <
      0.0005; 20% vs. 0%, P < 0.002, respectively) and HAVMs in HHT2 (60% vs.
      84%, P < 0.01).
    explanation: >-
      Establishes the HHT1 cerebral AVM burden that makes this surveillance
      particularly relevant to this genotype.
discussions:
- discussion_id: hht1_second_hit_organ_specificity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do somatic second hits in ENG produce pulmonary and cerebral AVMs
    preferentially in HHT1, when the germline lesion and the second-hit mechanism
    are present throughout the vasculature?
  attaches_to:
  - pathophysiology#Somatic Second-Hit Biallelic ENG Inactivation
  - pathophysiology#Pulmonary Arteriovenous Malformation Formation
  rationale: >-
    The second-hit model explains why lesions are focal, but not why HHT1 lesions
    favour lung and brain while ACVRL1-related HHT2 lesions favour liver. Both
    genes act in the same BMP9/ALK1/SMAD pathway, and second hits have now been
    demonstrated in both. The organ preference is therefore unexplained by the
    pathway model and by the second-hit model taken together, and no tissue-level
    determinant - flow environment, endothelial subtype, local BMP9 availability
    - has been established as the discriminating factor.
  evidence:
  - reference: PMID:39062925
    reference_title: >-
      Investigation of the Genetic Determinants of Telangiectasia and Solid Organ
      Arteriovenous Malformation Formation in Hereditary Hemorrhagic
      Telangiectasia (HHT).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with HHT harbor these heterozygous germline mutations in every
      cell of the body, yet vascular malformations occur in only a small minority
      of vessels, with predilection for specific anatomic locations.
    explanation: >-
      States the anatomical predilection as an open observation rather than an
      explained one.
- discussion_id: hht1_modifier_genes
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which modifier genes account for the variable expressivity of HHT1 among
    relatives who carry the same ENG variant?
  attaches_to:
  - pathophysiology#Endoglin Haploinsufficiency in Vascular Endothelium
  - genetic#ENG
  rationale: >-
    Severity of epistaxis and the number and location of lesions vary markedly
    even within a family sharing one ENG variant, and the Eng+/- mouse shows the
    same effect as a strain-background dependence, which is direct evidence that
    modifiers exist. The mouse work names 129/Ola as a permissive background but
    does not identify the responsible loci, and no human modifier has been
    established. Resolving this would matter clinically because it is the
    variability, not the genotype, that currently limits prediction of who will
    develop a pulmonary or cerebral AVM.
  evidence:
  - reference: PMID:10562296
    reference_title: A murine model of hereditary hemorrhagic telangiectasia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In this murine model of HHT, it appears that epigenetic factors and
      modifier genes, some of which are present in 129/Ola, contribute to disease
      heterogeneity.
    explanation: >-
      Establishes that modifiers exist and are unidentified, which is the gap.
  - reference: PMID:39062925
    reference_title: >-
      Investigation of the Genetic Determinants of Telangiectasia and Solid Organ
      Arteriovenous Malformation Formation in Hereditary Hemorrhagic
      Telangiectasia (HHT).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The severity of epistaxis and number and location of telangiectases and
      AVMs vary significantly, even among affected individuals from the same
      family who have the same genetic mutation [7].
    explanation: >-
      The human counterpart of the mouse observation, stating within-family
      variability at identical genotype.
- discussion_id: hht1_no_genotype_specific_therapy
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does any HHT therapy work differently in ENG-related HHT1 than in
    ACVRL1-related HHT2?
  attaches_to:
  - treatments#Pomalidomide
  - treatments#Bevacizumab
  rationale: >-
    Every systemic therapy curated here was trialled in HHT patients selected by
    clinical diagnosis rather than by genotype. PATH-HHT enrolled on epistaxis
    severity and transfusion dependence and reports no ENG-versus-ACVRL1
    subgroup. Since the two genotypes differ substantially in which organs are
    affected, a genotype-stratified analysis is a reasonable expectation that the
    literature does not yet supply, and treatment records in this entry should
    not be read as HHT1-specific efficacy claims.
  evidence:
  - reference: clinicaltrials:NCT03910244
    reference_title: >-
      Pomalidomide for the Treatment of Bleeding in Hereditary Hemorrhagic
      Telangiectasia
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 159 patients will be randomized 2:1 to treatment with oral
      pomalidomide or matching placebo for 24 weeks.
    explanation: >-
      The registered design specifies randomization without genotype
      stratification, which is the basis of this gap.
datasets:
- accession: geo:GSE197105
  title: >-
    RNA sequencing of isolated brain endothelial cells from Smad4, Alk1, or Eng
    endothelial cell-specific knock-out mutants, respective wildtypes (WTs), and
    Angiopoietin-2 inhibition transcriptional changes.
  data_type: BULK_RNA_SEQ
  sample_count: 39
  organism:
    preferred_term: mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  genes:
  - preferred_term: ENG
    term:
      id: hgnc:3349
      label: ENG
  publication: PMID:37288572
  notes: >-
    Included for the Eng endothelial-cell-specific knockout arm, which is the
    HHT1-relevant portion; the Smad4 and Alk1 arms of the same series model
    JP-HHT and HHT2 respectively and are not evidence for this entry. Relevance
    triage matters here: a dataset search on "hereditary hemorrhagic
    telangiectasia" returns mostly Alk1- and Smad4-based series that resolve
    perfectly but concern the other molecular forms, and this was the only
    candidate in that search naming Eng. Note also that this is an endothelial
    conditional-knockout mouse, not the germline heterozygous state of human
    HHT1, so it speaks to endoglin's endothelial requirement rather than to
    haploinsufficiency.

notes: >-
  Relationship to the parent entry. Hereditary Hemorrhagic Telangiectasia carries
  the disease-wide account and lists HHT1 under has_subtypes with MONDO:0008535.
  This standalone entry follows the precedent of
  Hereditary_Hemorrhagic_Telangiectasia_4: the subtype record on the parent
  remains correct and is not superseded, while the ENG-specific mechanism,
  genotype-phenotype contrast, model system and knowledge gaps are curated here
  at a depth a subtype record cannot hold. Content that is true of HHT generally
  is cited as such rather than presented as an HHT1 finding.

  Named-entity confusion guardrail. HHT1 is ENG at 9q34; HHT2 is ACVRL1/ALK1 at
  12q13. Because the two are clinically similar and are usually reported side by
  side, papers about one are easily mistaken for papers about the other, and the
  numeral is often the only thing distinguishing the titles. One trap was hit and
  avoided during this curation: PMID:24957885, "VEGF neutralization can prevent
  and normalize arteriovenous malformations in an animal model for hereditary
  hemorrhagic telangiectasia 2", is an Alk1 model and is NOT evidence for the
  ENG-related mechanism curated here; it was deliberately excluded despite being
  a strong match on every search term used to find HHT mouse-model papers. The
  animal model curated in this entry is the Eng+/- mouse (PMID:10562296). Before
  adding any mechanism or model evidence, check which gene the source actually
  studied. Also note the direction of the hepatic finding: hepatic AVMs occur in
  HHT1 but are commoner and more often symptomatic in HHT2, so a hepatic-dominant
  source is probably about HHT2.

  Deep research. A falcon (Edison) run was requested on 2026-09-01 per the
  curation default. The Edison endpoint returned 403 "Failed to authenticate", so
  the run was re-issued through the repository's recorded-fallback path
  (`just dr_fallback='--fallback' research-disorder falcon ...`) rather than by
  substituting a provider by hand. OpenScientist produced the report, which is
  therefore named research/Hereditary_Hemorrhagic_Telangiectasia_Type_1-deep-research-openscientist.md
  and carries fell_back, requested_provider and provider_attempts in its
  frontmatter. Its 44 references all resolved (confabulation_rate 0.0) but
  needs_review is true on two off-topic references, neither of which is cited
  here.

  Two things about that report a later curator should know. First, its ontology
  bindings are unusable: term validation matched only 10 of 22 labels, and every
  drug CURIE it offered names a different drug - it gives NCIT:C47737 for
  tranexamic acid (actually Sulfamethoxazole), NCIT:C72713 for pomalidomide
  (Azipramine), NCIT:C1794 for thalidomide (Capecitabine) and NCIT:C71146 for
  pazopanib (Salirasib). No CURIE in this entry comes from the report; all were
  taken from the committed caches and OAK. Second, `just preflight-dr` flagged
  the report for mixing in a second entity (KIT mentioned 22 times, 42% of ENG),
  and inspection bore that out: its KIT/angiogenic-endothelium section rests on
  an Alk1 mouse model (PMID:42579368), its gene-specific-programs claim on a
  SMAD4/ALK1 study (PMID:42460472), and its variable-expressivity section on
  PMID:10946360, which is titled for an HHT *type 2* kindred. Those sections were
  excluded. Only two report-sourced references were used, both checked
  individually: PMID:28564608 (endoglin-BMP9 crystal structure, explicitly HHT1)
  and PMID:39299239 (loss of heterozygosity as a second-hit route), the latter
  marked INDIRECT because it works at the level of "an HHT gene" rather than
  reporting ENG separately. The rest of the entry was assembled from
  PubMed-sourced primary literature and the GeneReviews baseline independently of
  the report.

  GeneReviews baseline. PMID:20301525 (McDonald, Gossage, Stevenson; updated 2026
  Feb 19) was used as the mandatory phenotype baseline. Its Clinical
  Characteristics items are each represented above: epistaxis, mucocutaneous
  telangiectases, pulmonary/hepatic/cerebral AVMs and GI bleeding. Two are
  deliberately not curated as HHT1 phenotypes. Gastrointestinal polyps and the
  juvenile polyposis overlap belong to SMAD4-related disease, which is a
  different molecular entity and is covered by the parent entry's
  has_subtypes record. Pulmonary arterial hypertension is chiefly an ACVRL1/HHT2
  and GDF2 association; no HHT1-specific source was found for it, so it is
  recorded here as an absence rather than imported from the parent. The
  Agents/Circumstances to Avoid warnings are captured as a treatment record with
  the GeneReviews text quoted verbatim.

  Prevalence is derived, not surveyed. The 10 per 100,000 figure is this entry's
  arithmetic over two separately cited facts - HHT overall at 1 in 5,000 and ENG
  contributing roughly half of solved cases. It is recorded with that derivation
  stated in the record's own notes. No population study of ENG-related HHT1 as
  such was found.

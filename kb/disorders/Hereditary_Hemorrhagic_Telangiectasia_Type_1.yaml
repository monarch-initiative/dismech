  - reference: PMID:17388964
    reference_title: >-
      Hereditary hemorrhagic telangiectasia: clinical features in ENG and ALK1
      mutation carriers.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neurological manifestations secondary to CAVMs/PAVMs were found only in
      HHT1 patients, whereas severe liver involvement was detected only in HHT2.
    explanation: >-
      Refutes any claim that severe or symptomatic hepatic disease is an HHT1
      manifestation: in this cohort it occurred only in HHT2.
treatments:
- name: Pulmonary AVM Embolization
  therapeutic_modality: SURGERY
  description: >-
    Transcatheter occlusion of pulmonary AVMs with a feeding vessel 2-3 mm or
    greater in diameter, performed to prevent paradoxical embolic stroke rather
    than to treat symptoms. Because PAVMs are both more frequent and more often
    asymptomatic in HHT1, this is the intervention most specific to this
    genotype.
  treatment_term:
    preferred_term: embolization of pulmonary arteriovenous malformation
    term:
      id: NCIT:C15230
      label: Embolization Therapy
  target_mechanisms:
  - target: Right-to-Left Shunt Physiology
    description: >-
      Occluding the feeding artery closes the conduit that carries emboli and
      bacteria past the pulmonary capillary filter.
    evidence:
    - reference: PMID:20301525
      reference_title: Hereditary Hemorrhagic Telangiectasia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Pulmonary AVMs with a feeding vessel 2-3 mm or greater in diameter
        typically require occlusion for stroke prevention.
      explanation: >-
        States both the intervention and the shunt-mediated complication it is
        aimed at.
  evidence:
  - reference: PMID:20301525
    reference_title: Hereditary Hemorrhagic Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pulmonary AVMs with a feeding vessel 2-3 mm or greater in diameter
      typically require occlusion for stroke prevention.
    explanation: >-
      GeneReviews gives the size threshold and the indication for occlusion.
- name: Antibiotic Prophylaxis for Right-to-Left Shunt
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Antibiotic prophylaxis before dental and non-sterile invasive procedures in
    patients with pulmonary shunting, together with care to exclude air bubbles
    from intravenous lines. Both measures address the loss of the pulmonary
    filter rather than the vascular lesion itself.
  treatment_term:
    preferred_term: antibiotic prophylaxis
    term:
      id: NCIT:C51993
      label: Antibiotic Prophylaxis
  target_mechanisms:
  - target: Right-to-Left Shunt Physiology
    description: >-
      Prophylaxis and air-bubble precautions counter the passage of bacteria and
      air emboli through the shunt to the systemic circulation.
    evidence:
    - reference: PMID:20301525
      reference_title: Hereditary Hemorrhagic Telangiectasia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        When pulmonary shunting is present, use antibiotic prophylaxis for dental
        and non-sterile invasive procedures, taking care to prevent air bubbles
        from being introduced in intravenous lines
      explanation: >-
        Conditions the recommendation explicitly on the presence of pulmonary
        shunting, which is the mechanism targeted.
  evidence:
  - reference: PMID:20301525
    reference_title: Hereditary Hemorrhagic Telangiectasia.

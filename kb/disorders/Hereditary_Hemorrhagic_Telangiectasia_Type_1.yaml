name: Hereditary Hemorrhagic Telangiectasia Type 1
creation_date: '2026-09-01T00:00:00Z'
synonyms:
- HHT1
- telangiectasia, hereditary hemorrhagic, type 1
- ENG-related hereditary hemorrhagic telangiectasia
- Osler-Weber-Rendu disease type 1
description: >-
  Hereditary hemorrhagic telangiectasia type 1 (HHT1) is the ENG-related form of
  hereditary hemorrhagic telangiectasia, an autosomal dominant vascular dysplasia
  in which arteriovenous malformations lack an intervening capillary bed and
  connect arteries directly to veins. It is defined molecularly by a heterozygous
  loss-of-function variant in ENG at 9q34, which encodes endoglin, an endothelial
  co-receptor of the TGF-beta receptor superfamily; endoglin was the first HHT
  gene identified and established HHT as the first human disease attributed to a
  mutation in a member of the TGF-beta receptor complex. The germline variant
  produces endoglin haploinsufficiency in vascular endothelium and impairs
  BMP9-driven ALK1/SMAD1/5/8 signaling, but the germline lesion is present in
  every cell while lesions arise in only a small minority of vessels; somatic
  second-hit biallelic inactivation in the lesional endothelium supplies the
  focal trigger. HHT1 is separated from ACVRL1-related HHT2 by a reproducible
  genotype-phenotype contrast rather than by any difference in diagnostic
  criteria: pulmonary and cerebral arteriovenous malformations are substantially
  more frequent in HHT1, epistaxis begins earlier, and the neurological
  consequences of right-to-left shunting - paradoxical embolic stroke and brain
  abscess - fall disproportionately on HHT1 patients, whereas symptomatic hepatic
  involvement and gastrointestinal bleeding are the HHT2 pattern. This entry is
  curated to what the literature reports for ENG/HHT1 specifically; general HHT
  material is cited as such and the parent entry Hereditary Hemorrhagic
  Telangiectasia carries the disease-wide account.

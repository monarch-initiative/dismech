    explanation: >-
      Gives the recurrence risk that counseling conveys.
- name: Avoidance of Antithrombotic Agents and Shunt-Related Hazards
  therapeutic_modality: BEHAVIORAL
  description: >-
    GeneReviews lists agents and circumstances to avoid in HHT. Anticoagulant and
    nonsteroidal anti-inflammatory agents that interfere with clotting, including
    aspirin, should be avoided where nose or GI bleeding is significant unless
    required for another condition. Vigorous nose blowing, heavy lifting,
    straining at stool and nasal finger manipulation are avoided because they
    provoke bleeding from mucosal telangiectases. Scuba diving is avoided unless
    contrast echocardiography within five years excluded a right-to-left shunt,
    and liver biopsy is avoided. The diving and biopsy restrictions bear
    particularly on HHT1, where pulmonary shunting is the predominant lesion.
  treatment_term:
    preferred_term: avoidance of agents and circumstances that provoke bleeding or embolism
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301525
    reference_title: Hereditary Hemorrhagic Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Agents/circumstances to avoid: Vigorous nose blowing; lifting heavy
      objects; straining during bowel movements; finger manipulation in the nose;
      anticoagulant and nonsteroidal anti-inflammatory agents that interfere with
      clotting (including aspirin) should be avoided in individuals with
      significant nose or GI bleeding unless required for treatment of other
      medical condition; scuba diving unless TCE within the last five years was
      negative for evidence of a right-to-left shunt; liver biopsy.
    explanation: >-
      The GeneReviews drug-safety and circumstance warnings quoted verbatim.
animal_models:
- species: Mouse
  genotype: Eng heterozygous null (Eng+/-)
  background: Inbred 129/Ola and mixed C57BL/6-129/Ola
  description: >-
    Mice carrying one inactivated endoglin allele reproduce the haploinsufficient
    state of HHT1. Some heterozygotes develop telangiectases or recurrent
    nosebleeds, and the fact that only some do - and that this depends on strain
    background - is the model's principal contribution: it demonstrates that
    modifier genes and epigenetic factors, not the ENG lesion alone, govern
    expressivity. Homozygous null embryos die at gestational day 10.0-10.5 with
    failed vascular plexus maturation and arrested heart development, defining
    the null phenotype against which haploinsufficiency is read.
  publication: PMID:10562296
  genes:
  - preferred_term: ENG
    term:
      id: hgnc:3349
      label: ENG
  modeled_mechanisms:
  - target: Endoglin Haploinsufficiency in Vascular Endothelium
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The model reproduces the exact molecular lesion of HHT1, a single
      inactivated endoglin allele.
    evidence:
    - reference: PMID:10562296
      reference_title: A murine model of hereditary hemorrhagic telangiectasia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        To generate a disease model and ascertain the role of endoglin in
        development, we generated mice lacking 1 or both copies of the gene.
      explanation: >-
        States that the model was constructed as a copy-number model of the human
        haploinsufficient lesion.
  - target: Mucocutaneous Telangiectasia Formation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Telangiectases and recurrent nosebleeds appear in some heterozygotes, but
      not in all, and only on permissive genetic backgrounds.
    limitations: >-
      Penetrance is partial and strain-dependent, so the model cannot be used to
      estimate lesion frequency in human HHT1; and the paper reports
      telangiectases and nosebleeds without reporting the pulmonary and cerebral
      AVMs that most distinguish human HHT1.
    evidence:
    - reference: PMID:10562296
      reference_title: A murine model of hereditary hemorrhagic telangiectasia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Some heterozygotes, either with an inbred 129/Ola or mixed
        C57BL/6-129/Ola background, show signs of HHT, such as telangiectases or
        recurrent nosebleeds.
      explanation: >-
        Reports lesion formation in the heterozygote and, in the word "some", the
        partial penetrance that makes this PARTIALLY_RECAPITULATES.
  - target: Dysregulated Endothelial Angiogenic Response
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The endoglin-null embryo shows the developmental extreme of the angiogenic
      defect: the primitive plexus fails to mature and the resulting channels
      dilate and rupture.
    limitations: >-
      This readout comes from the homozygous null embryo, not from the
      heterozygote that models human HHT1, so it demonstrates endoglin's
      requirement in vessel maturation rather than the consequence of
      haploinsufficiency.
    evidence:
    - reference: PMID:10562296
      reference_title: A murine model of hereditary hemorrhagic telangiectasia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The primitive vascular plexus of the yolk sac fails to mature into
        defined vessels, and vascular channels dilate and rupture.
      explanation: >-
        The vascular maturation failure that grounds the angiogenic node.
  evidence:
  - reference: PMID:10562296
    reference_title: A murine model of hereditary hemorrhagic telangiectasia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In this murine model of HHT, it appears that epigenetic factors and
      modifier genes, some of which are present in 129/Ola, contribute to disease
      heterogeneity.
    explanation: >-
      The model's central conclusion, and the reason it is informative for HHT1's
      variable expressivity.
clinical_trials:
- name: NCT03910244
  phase: PHASE_II
  status: COMPLETED
  description: >-
    PATH-HHT, a placebo-controlled double-blind randomized trial of oral
    pomalidomide for 24 weeks in HHT patients with moderate-to-severe epistaxis
    and anemia or transfusion/iron dependence. Stopped early for efficacy at a
    planned interim analysis. Enrollment was by clinical HHT diagnosis, not by
    ENG genotype, so the result applies to HHT1 as part of the HHT population
    rather than as a genotype-specific finding.
  target_phenotypes:
  - preferred_term: Spontaneous, recurrent epistaxis
    term:
      id: HP:0004406
      label: Spontaneous, recurrent epistaxis
  - preferred_term: Iron deficiency anemia
    term:
      id: HP:0001891
      label: Iron deficiency anemia
  evidence:
  - reference: clinicaltrials:NCT03910244
    reference_title: >-
      Pomalidomide for the Treatment of Bleeding in Hereditary Hemorrhagic
      Telangiectasia
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is a Phase II placebo-controlled double-blind study of pomalidomide in
      patients with hereditary hemorrhagic telangiectasia (HHT) with moderate to
      severe epistaxis who have anemia and/or require parenteral iron infusions
      or blood transfusions.
    explanation: >-
      The registry record establishing the trial's phase, design and eligible
      population.
  - reference: PMID:39292928
    reference_title: >-
      Pomalidomide for Epistaxis in Hereditary Hemorrhagic Telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The trial was closed to enrollment in June 2023 after a planned interim
      analysis met a prespecified threshold for efficacy.
    explanation: >-
      Records the early stop for efficacy stated in the description.
biochemical:
- name: Soluble endoglin
  context: >-
    Circulating soluble endoglin is among the plasma/serum proteins reviewed as
    candidate HHT biomarkers, alongside VEGF, TGF-beta1 and angiopoietin-2 and
    the microRNAs miR-27a, miR-205 and miR-210. It is the ENG gene product and so
    is of particular interest in HHT1, but these remain research-stage adjuncts:
    diagnosis is still clinical by the Curaçao criteria with molecular
    confirmation, and no diagnostic threshold is curated here because the source
    reports none.
  presence: PRESENT
  evidence:
  - reference: PMID:25873934
    reference_title: Research on potential biomarkers in hereditary hemorrhagic telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      products detected in plasma or serum samples: soluble proteins (vascular
      endothelial growth factor, transforming growth factor β1, soluble endoglin,
      angiopoietin-2) and microRNA variants (miR-27a, miR-205, miR-210)
    explanation: >-
      Lists soluble endoglin among the circulating candidate biomarkers reviewed
      for HHT.
  - reference: PMID:25873934
    reference_title: Research on potential biomarkers in hereditary hemorrhagic telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of HHT patients currently remains at the clinical level,
      according to the "Curaçao criteria," whereas the molecular diagnosis is
      used to confirm or rule out suspected HHT cases
    explanation: >-
      Establishes that these biomarkers have not displaced clinical and molecular
      diagnosis, which is why this record asserts candidacy rather than clinical
      utility.
  notes: >-
    Curated as a candidate biomarker only. The cited source is a review of
    biomarker research, not a diagnostic-performance study, and reports no
    sensitivity, specificity or cut-off for soluble endoglin in HHT1.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    HHT shortens life. A Swedish national-register cohort put life expectancy
    after age 30 at 73.0 years against 80.5 in matched controls, and a
    questionnaire study of deceased patients found an average loss of 19 years of
    potential life. Which manifestations carry that mortality is not what the
    HHT1 lesion profile would predict: in a 1,286-patient prospective cohort the
    predictors were anemia, gastrointestinal bleeding and symptomatic liver
    vascular malformations, while brain vascular malformations and pulmonary AVMs
    - the two lesions that most distinguish HHT1 - were NOT associated with
    mortality. The authors attribute that to those two being routinely screened
    and treated preventatively at HHT centres, which is the argument for the
    surveillance records above rather than evidence that the lesions are benign.
  evidence:
  - reference: PMID:42410718
    reference_title: "Expected survival is decreased in hereditary hemorrhagic telangiectasia: Results from a population-based registry study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Life expectancy for cases with HHT after age 30 was estimated at 73.0
      (68.0-77.2) compared to 80.5 (79.1-82.0) years for controls.
    explanation: >-
      Quantifies the survival gap against matched general-population controls.
  - reference: PMID:33407668
    reference_title: Predictors of mortality in patients with hereditary hemorrhagic telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A history of anemia was associated with increased mortality (HR = 2.93, 95%
      CI 1.37-6.26, p = 0.006), as were gastro-intestinal (GI) bleeding (HR =
      2.63, 95% CI 1.46-4.74, p = 0.001), and symptomatic liver VMs (HR = 2.10,
      95% CI 1.15-3.84, p = 0.015).
    explanation: >-
      Identifies the manifestations that actually carry mortality risk, with
      effect sizes.
  - reference: PMID:33407668
    reference_title: Predictors of mortality in patients with hereditary hemorrhagic telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain VMs and pulmonary arteriovenous malformations (AVMs) were not
      associated with mortality (p > 0.05).
    explanation: >-
      The negative result that matters most for HHT1: its two defining lesions
      did not predict death in this centre-treated cohort.
  - reference: PMID:33407668
    reference_title: Predictors of mortality in patients with hereditary hemorrhagic telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Conversely, mortality does not appear to be associated with pulmonary AVMs
      or brain VMs, for which patients are routinely screened and treated
      preventatively at HHT Centres.
    explanation: >-
      The authors' own reading of that negative result as an effect of
      surveillance and pre-emptive treatment, which is why it must not be quoted
      as evidence that these lesions are harmless.
  - reference: PMID:29781402
    reference_title: >-
      Life expectancy and comorbidities in patients with hereditary hemorrhagic
      telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the deceased HHT patients, 35% (95% CI: 23-48%) died from sepsis, 26%
      (95% CI: 16-38%) from cardiac failure, 20% (95% CI: 9-28%) from a severe
      bleeding episode, and 13% (95% CI: 6-24%) from terminal cancer.
    explanation: >-
      Gives the distribution of causes of death, with sepsis first - consistent
      with loss of the pulmonary capillary filter in shunting patients.
  - reference: PMID:33407668
    reference_title: Predictors of mortality in patients with hereditary hemorrhagic telangiectasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was no significant difference in mortality between patients with
      ACVRL1 and ENG mutation (p > 0.05).
    explanation: >-
      The single most HHT1-specific mortality statement in the literature cited
      here, and it is a null result: ENG carriers did not differ from ACVRL1
      carriers. It is curated so the entry does not imply an HHT1-specific
      mortality profile that the data do not support.
  notes: >-
    The burden recorded here is HHT-wide. PMID:42410718 and PMID:29781402 do not
    stratify by gene at all. PMID:33407668 does, and its HHT1-relevant result is
    a null one, curated as its own evidence item above: mortality did not differ
    significantly between ACVRL1 and ENG carriers (HR 1.54, 95% CI 0.70-3.38,
    p = 0.286). ENG was in fact the commonest genotype in that cohort (496 of
    886, 56%). Its separate SMAD4 comparison is against "ACVRL1/ENG" pooled and
    rests on four deaths among 33 SMAD4 patients, so it is too imprecise to
    yield an HHT1-specific figure and is not curated as one. The practical
    reading is that HHT1 carries HHT's mortality burden rather than a distinct
    one, which is the opposite of the pattern seen for lesion distribution.
progression:
- phase: Adult mortality and cause of death
  notes: >-
    Deaths in HHT are dominated by sepsis and cardiac failure rather than by
    acute hemorrhage, and congestive heart failure is the commonest non-fatal
    comorbidity. This is HHT-wide data, not HHT1-stratified.
  evidence:
  - reference: PMID:29781402
    reference_title: >-

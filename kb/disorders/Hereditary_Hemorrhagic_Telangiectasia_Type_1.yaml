- name: Pomalidomide
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    An immunomodulatory antiangiogenic agent. In the randomized,
    placebo-controlled PATH-HHT trial (NCT03910244), pomalidomide reduced Epistaxis
    Severity Score at 24 weeks by a mean of 0.94 points more than placebo; the
    trial was stopped early at a planned interim analysis for efficacy.
    Neutropenia, constipation and rash were more common on pomalidomide. The
    trial enrolled HHT patients without restricting to ENG genotype.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pomalidomide
      term:
        id: CHEBI:72690
        label: pomalidomide
  target_mechanisms:

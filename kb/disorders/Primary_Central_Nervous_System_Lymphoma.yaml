    snippet: >-
      Clinical presentation varies depending on the involved regions of the CNS.
    explanation: >-
      Supports the raised-pressure presentation this sign belongs to; the source
      does not report its frequency.
- category: Clinical
  name: Ataxia
  description: >-
    Gait and limb ataxia with cerebellar or brainstem involvement, which is the
    less common posterior-fossa presentation.
  phenotype_term:
    preferred_term: Ataxia
    term:
      id: HP:0001251
      label: Ataxia
  evidence:
  - reference: PMID:37322012
    reference_title: "Primary central nervous system lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Clinical presentation varies depending on the involved regions of the CNS.
    explanation: >-
      Supports the location-dependent deficit of which this is the
      posterior-fossa form.
- category: Clinical
  name: Blurred vision
  description: >-
    Blurring and floaters from vitreoretinal involvement. A substantial share of
    eyes with disease are asymptomatic, so a normal visual history does not
    exclude ocular involvement.
  phenotype_term:
    preferred_term: Blurred vision
    term:
      id: HP:0000622
      label: Blurred vision
  evidence:
  - reference: PMID:37322012
    reference_title: "Primary central nervous system lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Primary central nervous system lymphoma (PCNSL) is a diffuse large B cell
      lymphoma in which the brain, spinal cord, leptomeninges and/or eyes are
      exclusive sites of disease.
    explanation: >-
      Establishes ocular involvement as within the disease definition, which is
      what this visual phenotype reflects.
- category: Laboratory
  name: Increased CSF protein concentration
  description: >-
    Raised CSF protein, usually with pleocytosis and normal glucose. It is part
    of the IELSG prognostic score rather than merely a diagnostic finding.
  phenotype_term:
    preferred_term: Increased CSF protein concentration
    term:
      id: HP:0002922
      label: Increased CSF protein concentration
  evidence:
  - reference: PMID:38937027
    reference_title: "Molecular diagnosis of primary CNS lymphoma in 2024 using MYD88(Leu265Pro) and IL-10."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In rare cases, cerebrospinal fluid (CSF) or vitreous humour might aid in
      providing a cytological diagnosis.
    explanation: >-
      Supports CSF as a diagnostic compartment in this disease; the cited source
      addresses its cytological and biomarker yield rather than protein
      concentration specifically, so this is an indirect support.
    directness: INDIRECT
genetic:
- name: MYD88
  notes: >-
    Somatic, not germline. The L265P hotspot allows the MYD88-IRAK4-IRAK1
    myddosome to assemble without receptor ligation. It is also the basis of the
    CSF liquid-biopsy assay, which is unusual — the same lesion serves as driver,
    diagnostic marker and drug target.
  gene_term:
    preferred_term: MYD88
    term:
      id: hgnc:7562
      label: MYD88
  relationship_type: CAUSATIVE
  variant_origin: SOMATIC
  evidence:
  - reference: PMID:30723112
    reference_title: "MYD88 L265P mutation and CDKN2A loss are early mutational events in primary central nervous system diffuse large B-cell lymphomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Combined WES and targeted sequencing identified MYD88 mutation in 67% (42
      of 63) of patients, CDKN2A biallelic loss in 44% (16 of 36), and CD79b
      mutation in 61% (22 of 36).
    explanation: >-
      Gives the mutation frequency in a sequenced PCNSL cohort.
- name: CD79B
  notes: >-
    Somatic ITAM-domain mutation, most often co-occurring with MYD88 L265P. The
    pairing is what places most of these tumours in the MCD genomic subtype.
  gene_term:
    preferred_term: CD79B
    term:
      id: hgnc:1699
      label: CD79B
  relationship_type: CAUSATIVE
  variant_origin: SOMATIC
  evidence:
  - reference: PMID:35646048
    reference_title: "Whole-Genome/Exome Sequencing Uncovers Mutations and Copy Number Variations in Primary Diffuse Large B-Cell Lymphoma of the Central Nervous System."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common mutations were identified in IGLL5 (68%), PIM1 (63%), MYD88
      (55%), CD79B (42%), BTG2 (39%), PCLO (39%), KMT2D (34%), and BTG1 (29%)
      genes.
    explanation: >-
      Gives the CD79B mutation frequency alongside the other recurrent lesions.
- name: CDKN2A
  notes: >-
    Lost by 9p21.3 deletion, mutation or promoter hypermethylation. An early
    clonal event rather than a late one, which is why it sits on the initiating
    arm of the chain rather than at progression.
  gene_term:
    preferred_term: CDKN2A
    term:
      id: hgnc:1787
      label: CDKN2A
  relationship_type: CAUSATIVE
  variant_origin: SOMATIC
  evidence:
  - reference: PMID:30723112
    reference_title: "MYD88 L265P mutation and CDKN2A loss are early mutational events in primary central nervous system diffuse large B-cell lymphomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Phylogenetic analysis of paired primary and relapsed specimens identified
      MYD88 mutation and CDKN2A loss as early clonal events.
    explanation: >-
      Establishes CDKN2A loss as an early rather than late clonal event.
- name: PIM1
  notes: >-
    Mutated by aberrant somatic hypermutation rather than by a hotspot, and among
    the most frequently altered genes in sequenced cohorts.
  gene_term:
    preferred_term: PIM1
    term:
      id: hgnc:8986
      label: PIM1
  relationship_type: CAUSATIVE
  variant_origin: SOMATIC
  evidence:
  - reference: PMID:35646048
    reference_title: "Whole-Genome/Exome Sequencing Uncovers Mutations and Copy Number Variations in Primary Diffuse Large B-Cell Lymphoma of the Central Nervous System."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common mutations were identified in IGLL5 (68%), PIM1 (63%), MYD88
      (55%), CD79B (42%), BTG2 (39%), PCLO (39%), KMT2D (34%), and BTG1 (29%)
      genes.
    explanation: >-
      Gives the PIM1 mutation frequency in a whole-genome/exome cohort.
- name: B2M
  notes: >-
    Beta-2-microglobulin, the invariant light chain of MHC class I. Mutation or
    loss of heterozygosity removes class I from the cell surface outright, which
    is a more complete escape than reduced HLA expression.
  gene_term:
    preferred_term: B2M
    term:
      id: hgnc:914
      label: B2M
  relationship_type: CAUSATIVE
  variant_origin: SOMATIC
  evidence:
  - reference: PMID:36971477
    reference_title: "Large B-cell Lymphomas of Immune-Privileged Sites Relapse via Parallel Clonal Evolution from a Common Progenitor B Cell."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic alterations in genes involved in immune escape (HLA,
      CD274/PDCD1LG2) were predominantly unique in primary and relapse samples
      and thus considered late genetic events.
    explanation: >-
      Places the immune-escape lesion class, which B2M belongs to, late in the
      clonal hierarchy.
- name: CD274
  notes: >-
    PD-L1, at 9p24.1 with PDCD1LG2 and JAK2. Copy gain or rearrangement of the
    locus overexpresses the checkpoint ligands. The same lesion is the reason
    PD-1 blockade is a rational thing to try in this disease, so it is both an
    escape mechanism and a therapeutic handle.
  gene_term:
    preferred_term: CD274
    term:
      id: hgnc:17635
      label: CD274
  relationship_type: CAUSATIVE
  variant_origin: SOMATIC
  evidence:
  - reference: PMID:31471540
    reference_title: "Amplification of 9p24.1 in diffuse large B-cell lymphoma identifies a unique subset of cases that resemble primary mediastinal large B-cell lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Copy number alterations (CNAs) of 9p24.1 occur frequently in Hodgkin
      lymphoma, primary mediastinal large B-cell lymphoma (PMBCL), primary
      central nervous system lymphoma, and primary testicular lymphoma, resulting
      in overexpression of PD-L1 and sensitivity to PD-1 blockade-based
      immunotherapy.
    explanation: >-
      Names PCNSL among the diseases where this locus is recurrently altered and
      states both the consequence and its therapeutic implication.
- name: CARD11
  notes: >-
    Gain-of-function mutation activates NF-kB below the receptor, which makes it
    a route to the same output that does not depend on the receptor being
    engaged. That position is why it also confers resistance to BTK inhibition:
    the drug acts upstream of the lesion.

    Identifier note: the deep-research report for this entry gave hgnc:16412 for
    CARD11, which is NLRC4. The correct value used here was taken from the HGNC
    API.
  gene_term:
    preferred_term: CARD11
    term:
      id: hgnc:16393
      label: CARD11
  relationship_type: CAUSATIVE
  variant_origin: SOMATIC
  evidence:
  - reference: PMID:28619981
    reference_title: "Ibrutinib Unmasks Critical Role of Bruton Tyrosine Kinase in Primary CNS Lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The only PCNSL with complete ibrutinib resistance harbored a mutation
      within the coiled-coil domain of CARD11, a known ibrutinib resistance
      mechanism.
    explanation: >-
      Demonstrates the CARD11 lesion in PCNSL and its functional consequence of
      bypassing upstream BTK inhibition.
prevalence:
- population: United States, SEER registries 1975-2017
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.5
  rate_denominator: POPULATION_PER_YEAR
  notes: >-
    Rose from 0.1 to 0.5 per 100,000 per year across the study period. The rate
    recorded here is the end-of-period figure; the trend itself is the more
    informative number and is quoted in the evidence.
  evidence:
  - reference: PMID:35096360
    reference_title: "Primary central nervous system lymphoma in the United States, 1975-2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Incidence rate increased from 0.1/100,000 to 0.5/100,000 with an AAPC of
      5.3% from 1975 to 2017.
    explanation: >-
      Gives both the incidence rate and its trend over four decades.
progression:
- phase: Outcome
  notes: >-
    Five-year overall survival across the SEER period was roughly a third, having
    improved substantially since the 1970s but not for patients over 60. A
    quarter to a half of those who respond will relapse.
  evidence:
  - reference: PMID:35096360
    reference_title: "Primary central nervous system lymphoma in the United States, 1975-2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 5-year overall survival rates in SEER 9 registries and SEER 18
      registries were 30.5% and 37.4%, respectively.
    explanation: >-
      Gives population-level survival from the two registry series.
  - reference: PMID:37322012
    reference_title: "Primary central nervous system lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Despite available treatments, 15-25% of patients do not respond to
      chemotherapy and 25-50% relapse after initial response.
    explanation: >-
      Gives the refractory and relapse fractions that sit behind the survival
      figures.
diagnosis:
- name: Stereotactic brain biopsy
  description: >-
    The diagnostic gold standard, with one caveat that matters more here than in
    most tumours: corticosteroids are rapidly cytolytic to lymphoma cells and can
    make the lesion disappear radiographically and become uninterpretable
    histologically. They should be withheld before biopsy whenever it is safe to
    do so.
  evidence:
  - reference: PMID:38937027
    reference_title: "Molecular diagnosis of primary CNS lymphoma in 2024 using MYD88(Leu265Pro) and IL-10."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Suspicion raised on brain MRI must be confirmed by a histopathological
      diagnosis of a tumour specimen collected by stereotactic biopsy.
    explanation: >-
      States the diagnostic pathway and the primacy of tissue diagnosis.
- name: CSF MYD88 L265P and interleukin-10 assay
  description: >-
    The minimally invasive adjunct, and the reason the driver mutation is
    clinically useful beyond its biology. MYD88 L265P by PCR together with CSF
    IL-10 gives a usable diagnostic signal where biopsy is hazardous or
    non-diagnostic.
  evidence:
  - reference: PMID:38937027
    reference_title: "Molecular diagnosis of primary CNS lymphoma in 2024 using MYD88(Leu265Pro) and IL-10."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Several independent studies have shown that MYD88Leu265Pro and IL-10 can be
      easily assessed in peripheral blood, plasma, aqueous and vitreous humour,
      and CSF of patients with PCNSL with substantial sensitivity and
      specificity, especially when evaluated in combination.
    explanation: >-
      States the combined-biomarker approach and the compartments it can be run
      in.
biochemical:
- name: Cerebrospinal fluid interleukin-10
  notes: >-
    A diagnostic biomarker rather than a disease mechanism, and an unusually good
    one for a compartment that is hard to sample. Raised CSF IL-10 separates PCNSL
    from other CNS disease with high sensitivity and specificity, and the
    IL-10/IL-6 ratio improves the separation from CNS infection specifically. It
    also carries prognostic information, which a purely diagnostic marker would
    not.
  evidence:
  - reference: PMID:27924864
    reference_title: "Cerebrospinal Fluid IL-10 and IL-10/IL-6 as Accurate Diagnostic Biomarkers for Primary Central Nervous System Large B-cell Lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using a CSF IL-10 cutoff value of 8.2 pg/ml, the diagnostic sensitivity and
      specificity were 95.5% and 96.1%, respectively
    explanation: >-
      Gives the diagnostic performance of the marker at a stated cutoff.
  - reference: PMID:27924864
    reference_title: "Cerebrospinal Fluid IL-10 and IL-10/IL-6 as Accurate Diagnostic Biomarkers for Primary Central Nervous System Large B-cell Lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An increased CSF IL-10 level at diagnosis and post-treatment was associated
      with poor Progression free survival (PFS) for patients with PCNSL
    explanation: >-
      Records the prognostic dimension, which is why this is modelled as a
      biomarker rather than only as a diagnostic step.
environmental:
- name: Prolonged iatrogenic immunosuppression
  description: >-
    Solid organ transplantation and long-term immunosuppressive treatment for
    autoimmune disease. This is not a cause of the sporadic disease and is not
    modelled as one; it is the exposure that permits the EBV-driven branch, and
    the link is drawn onto that node rather than onto the tumour as a whole.
  exposure_term:
    preferred_term: exposure to prolonged immunosuppressive drug therapy
  notes: >-
    Left unbound after searching. ECTO's drug-exposure terms cover named agents
    and classes rather than the state of sustained therapeutic immunosuppression,
    which is what this exposure is; ECTO:0000509 (exposure to drug) is the only
    close hit and is too general to say anything. Recorded as free text rather
    than bound to a term that would not carry the meaning.
  influences_mechanisms:
  - target: Loss of EBV-Specific T-Cell Surveillance
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >-
      Sustained pharmacological suppression of T-cell function is the route by
      which EBV-specific control is lost in the transplant and autoimmune
      populations.
    evidence:
    - reference: PMID:36960939
      reference_title: "EBV-positive PCNSL in older patients: incidence, characteristics, tumor pathology, and outcomes across a large multicenter cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Younger age, SOT or autoimmune disease, and immunosuppressive treatment
        correlated highly with EBV-positivity.
      explanation: >-
        Ties immunosuppressive treatment specifically to the EBV-positive form
        this edge targets.
  evidence:
  - reference: PMID:37322012
    reference_title: "Primary central nervous system lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients receiving prolonged immunosuppressive agents (such as those
      undergoing solid organ transplantation or those with autoimmune disorders)
      are the major at-risk population for PCNSL
    explanation: >-
      Establishes this exposure as the principal identified risk factor for the
      disease.
animal_models:
- name: Canine primary CNS B-cell lymphoma
  species: Dog
  genotype: Naturally occurring, no engineered genotype
  publication: PMID:23115372
  description: >-
    A spontaneous rather than engineered model, and included for that reason.
    Primary CNS lymphoma occurs naturally in dogs at a few percent of intracranial
    primary neoplasms, which makes it one of the few settings where the disease's
    CNS restriction arises without being imposed by the experiment. Single case
    reports rather than a characterised colony, so it supports the existence of
    the natural phenotype and little more.
  modeled_mechanisms:
  - target: Perivascular Infiltration of CNS Parenchyma
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Reproduces a primary B-cell lymphoma confined to the CNS in an outbred
      species, without engineered lesions.
    limitations: >-
      Case-report evidence only, with no molecular characterisation, so whether
      the canine disease shares the MYD88/CD79B genetics that define the human
      entity is unknown. It supports the natural occurrence of the anatomical
      phenotype and cannot be used to argue anything about mechanism.
    evidence:
    - reference: PMID:23115372
      reference_title: "Primary central nervous system B-cell lymphoma in a young dog."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Canine primary central nervous system lymphomas constitute about 4% of
        all intracranial primary neoplasms, but comprehensive histopathologic
        classifications have rarely been carried out.
      explanation: >-
        Establishes the natural occurrence and frequency in dogs, and states the
        characterisation gap that limits the model.
treatments:
- name: High-Dose Methotrexate-Based Induction Chemotherapy
  description: >-
    The backbone. Methotrexate at high dose crosses the blood-brain barrier,
    which is the property the whole regimen is built around. The MATRix
    combination adds cytarabine, rituximab and thiotepa and roughly doubles the
    complete remission rate against methotrexate and cytarabine alone.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: high-dose methotrexate-based chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: methotrexate
      term:
        id: CHEBI:44185
        label: methotrexate
    - preferred_term: cytarabine
      term:
        id: CHEBI:28680
        label: cytarabine
    - preferred_term: thiotepa
      term:
        id: CHEBI:9570
        label: Thiotepa
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
  target_mechanisms:
  - target: Unchecked Clonal B-Cell Proliferation
    description: >-
      Cytotoxic against the proliferating clone; the rituximab component adds
      CD20-directed killing.
  evidence:
  - reference: PMID:27132696
    reference_title: "Chemoimmunotherapy with methotrexate, cytarabine, thiotepa, and rituximab (MATRix regimen) in patients with primary CNS lymphoma: results of the first randomisation of the International Extranodal Lymphoma Study Group-32 (IELSG32) phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At median follow-up of 30 months (IQR 22-38), patients treated with
      rituximab and thiotepa had a complete remission rate of 49% (95% CI 38-60),
      compared with 23% (14-31) of those treated with methotrexate-cytarabine
      alone
    explanation: >-
      The randomised comparison establishing the four-drug regimen over the
      two-drug backbone.
  - reference: PMID:37322012
    reference_title: "Primary central nervous system lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Standard of care includes methotrexate-based polychemotherapy followed by
      age-tailored thiotepa-based conditioned autologous stem cell
      transplantation and, in patients unsuitable for such treatment,
      consolidation with whole-brain radiotherapy or single-drug maintenance.
    explanation: >-
      States the overall treatment sequence this induction opens.
- name: Autologous Haematopoietic Stem Cell Transplantation Consolidation
  description: >-
    Thiotepa-based conditioning followed by autologous transplant. In the PRECIS
    randomisation it gave better two-year progression-free survival than
    whole-brain radiotherapy and, more importantly for survivors, preserved or
    improved cognition where radiotherapy impaired it.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: autologous haematopoietic stem cell transplantation
    term:
      id: NCIT:C16039
      label: Autologous Hematopoietic Stem Cell Transplantation
  target_mechanisms:
  - target: Unchecked Clonal B-Cell Proliferation
    description: >-
      Permits myeloablative consolidation dosing against residual clone, with
      stem-cell rescue.
  evidence:
  - reference: PMID:30785830
    reference_title: "Radiotherapy or Autologous Stem-Cell Transplantation for Primary CNS Lymphoma in Patients 60 Years of Age and Younger: Results of the Intergroup ANOCEF-GOELAMS Randomized Phase II PRECIS Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 2-year progression-free survival rates were 63% (95% CI, 49% to 81%)
      and 87% (95% CI, 77% to 98%) in the WBRT and ASCT arms, respectively.
    explanation: >-
      The randomised progression-free survival comparison against radiotherapy
      consolidation.
- name: Whole-Brain Radiotherapy Consolidation
  description: >-
    Effective, and increasingly reserved for patients who cannot have a
    transplant. The reason is not efficacy but delayed neurotoxicity: cognitive
    decline, gait disturbance and incontinence that can arrive years later and
    that transplant consolidation avoids.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: whole-brain radiotherapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  target_mechanisms:
  - target: Perivascular Infiltration of CNS Parenchyma
    description: >-
      Irradiates the whole compartment the tumour infiltrates, rather than a
      resectable margin.
  evidence:
  - reference: PMID:30785830
    reference_title: "Radiotherapy or Autologous Stem-Cell Transplantation for Primary CNS Lymphoma in Patients 60 Years of Age and Younger: Results of the Intergroup ANOCEF-GOELAMS Randomized Phase II PRECIS Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cognitive impairment was observed after WBRT, whereas cognitive functions
      were preserved or improved after ASCT.
    explanation: >-
      The cognitive outcome that has moved this from first choice to fallback in
      transplant-eligible patients.
- name: Bruton Tyrosine Kinase Inhibition
  description: >-
    Tirabrutinib and ibrutinib target BTK in the B-cell receptor arm the disease
    depends on, and they work in relapsed and refractory disease where little
    else does. The limitation is durability rather than response: responses are
    frequent but median duration is measured in months.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Bruton tyrosine kinase inhibitor therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tirabrutinib
      term:
        id: NCIT:C102876
        label: Tirabrutinib
    - preferred_term: ibrutinib
      term:
        id: NCIT:C81934
        label: Ibrutinib
  target_mechanisms:
  - target: Ligand-Independent BCR and Toll-Like Receptor Signaling
    description: >-
      Blocks BTK immediately downstream of the mutant receptor complex, which is
      why the drug class matches this disease's genetics.
  evidence:
  - reference: PMID:38690230
    reference_title: "Three-year follow-up analysis of phase 1/2 study on tirabrutinib in patients with relapsed or refractory primary central nervous system lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The overall response rate was 63.6% (95% CI: 47.8-77.6) with complete
      response (CR), unconfirmed CR, and partial response in 9, 7, and 12
      patients, respectively.
    explanation: >-
      Gives the response rate in relapsed and refractory disease.
  - reference: PMID:38690230
    reference_title: "Three-year follow-up analysis of phase 1/2 study on tirabrutinib in patients with relapsed or refractory primary central nervous system lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The median duration of response (DOR) was 9.2 months, with a DOR rate of
      19.8%; the median progression-free survival (PFS) and median overall
      survival (OS) were 2.9 months and not reached, respectively
    explanation: >-
      Records the short duration of response that is this class's main
      limitation.
clinical_trials:
- name: NCT01011920
  phase: PHASE_II
  status: COMPLETED
  description: >-
    IELSG32, the randomised trial that established the MATRix induction regimen
    and compared whole-brain radiotherapy with autologous transplant as
    consolidation.
  evidence:
  - reference: PMID:27132696
    reference_title: "Chemoimmunotherapy with methotrexate, cytarabine, thiotepa, and rituximab (MATRix regimen) in patients with primary CNS lymphoma: results of the first randomisation of the International Extranodal Lymphoma Study Group-32 (IELSG32) phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study is registered with ClinicalTrials.gov, number NCT01011920.
    explanation: >-
      Ties the registration identifier to the published trial.
differential_diagnoses:
- name: Glioblastoma and other high-grade glioma
  description: >-
    The main radiological mimic, and the distinction changes management
    completely — glioma is resected, PCNSL is not. Imaging separates them
    imperfectly: PCNSL enhances homogeneously with restricted diffusion and lower
    relative cerebral blood volume, glioblastoma ring-enhances with higher
    perfusion. Biopsy settles it.
  evidence:
  - reference: PMID:38937027
    reference_title: "Molecular diagnosis of primary CNS lymphoma in 2024 using MYD88(Leu265Pro) and IL-10."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Suspicion raised on brain MRI must be confirmed by a histopathological
      diagnosis of a tumour specimen collected by stereotactic biopsy.
    explanation: >-
      Supports tissue diagnosis as the step that resolves the imaging
      differential.
- name: Secondary CNS involvement by systemic DLBCL
  description: >-
    Not a mimic but a definitional boundary, and the reason whole-body staging is
    mandatory rather than optional. Systemic lymphoma with CNS deposits is a
    different disease with different biology and management; finding extra-CNS
    disease reclassifies the case out of this entry.
  evidence:
  - reference: PMID:37322012
    reference_title: "Primary central nervous system lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      PCNSL should be distinguished from lymphoma categories other than DLBCL
      primary arising in the CNS and from the secondary CNS lymphomas, which are
      diagnosed in patients with systemic DLBCL who have CNS involvement.
    explanation: >-
      States the boundary directly.
discussions:
- discussion_id: cns_tropism_unresolved
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the transforming B cell acquire its lesions inside the CNS, or transform
    systemically and then home there?
  attaches_to:
  - pathophysiology#Acquisition of MYD88 and CD79B Driver Mutations
  - pathophysiology#Perivascular Infiltration of CNS Parenchyma
  rationale: >-
    The disease is defined by a location whose origin is not established. Two
    accounts are current and are not mutually exclusive: that the clone is
    selected and retained in the CNS by chronic B-cell-receptor engagement with
    CNS self-proteins, or that transformation happens outside the CNS and the
    clone homes in afterwards via chemokine gradients. The clonal-evolution data
    complicate rather than settle it, because a common progenitor in a memory
    B-cell state implies a systemic reservoir while the immune-escape lesions
    that arise late look like adaptation to a compartment the tumour is already
    in. Until this is resolved, the entry's chain deliberately does not commit to
    an anatomical location for the initiating lesion.
  evidence:
  - reference: PMID:37322012
    reference_title: "Primary central nervous system lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pathophysiology is incompletely understood, although a central role seems
      to comprise immunoglobulins binding to self-proteins expressed in the
      central nervous system (CNS) and alterations of genes involved in B cell
      receptor, Toll-like receptor and NF-κB signalling.
    explanation: >-
      States both that the mechanism is unsettled and what the leading
      antigen-selection account proposes.
notes: >-
  Entry level and MONDO binding. This is curated at the WHO entity level as
  primary CNS lymphoma rather than at the anatomical level of the stub that
  prompted it. MONDO asserts cerebral lymphoma (MONDO:0003655) as a direct
  subclass of MONDO:0002571, so the narrower term is recorded as a
  skos:narrowMatch rather than given its own entry.

  WHO 2022 places this disease inside "large B-cell lymphomas of immune-privileged
  sites" alongside primary testicular and primary vitreoretinal large B-cell
  lymphoma, while the International Consensus Classification keeps it as a
  standalone entity. The entry follows the ICC here, because the immune-privileged
  grouping is a shared-mechanism family of the kind this knowledge base models
  with a Grouping rather than by merging entries. A grouping record for the three
  would be a reasonable follow-up.

  Ontology corrections to the deep-research report. The report (claude_code) was
  strong on content — 32 of 32 citations resolved with no confabulation — and
  poor on identifiers, and the two are worth separating. It offered at least
  seven wrong bindings, of which its own term-validation section caught three:

  - NCIT:C9218, offered as "Primary Central Nervous System Lymphoma", is Stage IV
    Oropharyngeal Carcinoma AJCC v6.
  - UBERON:0004087, offered as "vitreous body", is vena cava.
  - NCIT:C36044, offered as "Diffuse Large B-Cell Lymphoma", is Grade 3b
    Malignant Neoplasm, and is obsolete.

  Four more were caught only by checking each identifier against its cache or
  ontology by hand, because the validator label-checked 31 of 75 terms and skips
  gene CURIEs entirely:

  - hgnc:16412, offered as CARD11, is NLRC4. CARD11 is hgnc:16393.
  - HP:0000618, offered as "Blurred vision", is Blindness. The correct term,
    used here, is HP:0000622.
  - HP:0002153, offered as "Papilledema", is Hyperkalemia. The correct term,
    used here, is HP:0001085.
  - HP:0034332, offered as "Focal neurologic deficit", is Cognitive regression.

  One further trap is worth recording because the tooling actively pointed at it.
  The report gave CHEBI:9560 for thiotepa, and the validator's obsolescence check
  reported it as replaced by CHEBI:102166 — which is thiopental, an anaesthetic
  barbiturate, not the alkylating agent. Following the automated replacement would
  have bound the wrong drug. Thiotepa is CHEBI:9570, taken from a direct search.

  No datasets block. PCNSL has published genomic cohorts, but the accessions were
  not verified in this session and an unverified accession is worse than none.
  This is an ordinary gap rather than a reasoned exclusion, and is a good
  follow-up.

  References fetched but not cited. The deep-research run resolved 42 references
  into the cache and this entry cites 15 of them. The rest were read and set
  aside, and the reasons fall into three groups, recorded here so that a fetched
  cache is not mistaken for research nobody looked at.

  Several are about systemic DLBCL, Hodgkin lymphoma or primary mediastinal
  lymphoma rather than this disease, and were retrieved because the report
  discusses PCNSL against those comparators. PMID:31471540 is the exception that
  is cited, because it names PCNSL explicitly among the diseases carrying the
  9p24.1 lesion.

  Several cover treatment options this entry does not yet model - lenalidomide,
  checkpoint inhibitors, CAR-T, and the blood-brain-barrier penetration
  strategies. They are real and they belong here eventually; the entry currently
  carries induction, consolidation, radiotherapy and BTK inhibition, and adding
  a relapsed/refractory arm properly is a follow-up rather than something to
  bolt on.

  A few are imaging and radiomics studies supporting the differential against
  glioblastoma. The differential entry makes the weaker claim that tissue
  diagnosis is what settles it, which the cited source supports directly, so the
  imaging literature was not needed to carry it.

  Prognostic scoring (IELSG and MSKCC) is the one omission that is a genuine
  content gap rather than a scoping decision. The progression section records a
  single outcome phase with population survival and no risk stratification, and
  PMID:29541540 is cached and unused. Worth adding.

pathophysiology:
- name: Acquisition of MYD88 and CD79B Driver Mutations
  description: >-
    The initiating lesion, and an unusually stereotyped one. MYD88 L265P and
    CD79B ITAM mutations occur together in most cases, and clonal-evolution
    analysis of paired primary and relapse specimens places them, alongside
    TBL1XR1 mutation and BCL6 rearrangement, in a common progenitor cell that is
    held in a memory B-cell state before germinal-centre re-entry. This is the
    origin node: the transforming event is somatic, and the cell it happens in
    is bound as a memory B cell rather than as a generic B cell, because that is
    the state the cited clonal-evolution analysis places the common progenitor
    in. A single cell type is bound deliberately: binding both the generic and
    the specific term would make the cell-of-origin derivation report two
    origins, which would be an artefact of granularity rather than the genuine
    lump/split signal that report is for.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: GAIN_OF_FUNCTION
  cell_types:
  - preferred_term: memory-state common progenitor B cell
    term:
      id: CL:0000787
      label: memory B cell
  downstream:
  - target: Ligand-Independent BCR and Toll-Like Receptor Signaling
    causal_link_type: DIRECT
    description: >-
      Both lesions act on the same receptor-proximal step: MYD88 L265P on the
      TLR/IL-1R adapter, CD79B on the B-cell receptor ITAM.
  evidence:
  - reference: PMID:30723112
    reference_title: "MYD88 L265P mutation and CDKN2A loss are early mutational events in primary central nervous system diffuse large B-cell lymphomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Combined WES and targeted sequencing identified MYD88 mutation in 67% (42
      of 63) of patients, CDKN2A biallelic loss in 44% (16 of 36), and CD79b
      mutation in 61% (22 of 36).
    explanation: >-
      Gives the frequencies of the three defining lesions in a sequenced cohort.
  - reference: PMID:30723112
    reference_title: "MYD88 L265P mutation and CDKN2A loss are early mutational events in primary central nervous system diffuse large B-cell lymphomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Phylogenetic analysis of paired primary and relapsed specimens identified
      MYD88 mutation and CDKN2A loss as early clonal events.
    explanation: >-
      Establishes these as initiating rather than late lesions, which is what
      makes this the origin node.
  - reference: PMID:36971477
    reference_title: "Large B-cell Lymphomas of Immune-Privileged Sites Relapse via Parallel Clonal Evolution from a Common Progenitor B Cell."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All LBCL-IP sample pairs were clonally related, and both tumors developed
      from a common progenitor cell (CPC) with MYD88 and TBL1XR1 mutations
      and/or BCL6 translocations in 30/33 cases, indicating that these are early
      genetic events.
    explanation: >-
      Identifies the common progenitor cell and the lesions it carries.
  - reference: PMID:36971477
    reference_title: "Large B-cell Lymphomas of Immune-Privileged Sites Relapse via Parallel Clonal Evolution from a Common Progenitor B Cell."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the CPC contains genetic alterations that support prolonged
      survival/proliferation and retention in a memory B-cell state, followed by
      germinal center reentry, aSHM and immune escape
    explanation: >-
      Supports binding the memory B-cell state on this node as the cell in which
      the initiating lesions are held.
- name: Ligand-Independent BCR and Toll-Like Receptor Signaling
  description: >-
    MYD88 L265P allows the myddosome to assemble without receptor ligation, and
    mutation of the CD79B ITAM tyrosine removes the negative-feedback step that
    normally terminates B-cell receptor signalling. Both convert a transient,
    antigen-gated signal into a continuous one. This is a qualitative change in
    regulation rather than a quantitative increase, which is why the pathway
    modifiers here are GAIN_OF_FUNCTION rather than INCREASED.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: B cell receptor signaling pathway
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0050853
      label: B cell receptor signaling pathway
  - preferred_term: toll-like receptor signaling pathway
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0002224
      label: toll-like receptor signaling pathway
  downstream:
  - target: Constitutive Canonical NF-kB Activation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37322012
    reference_title: "Primary central nervous system lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pathophysiology is incompletely understood, although a central role seems
      to comprise immunoglobulins binding to self-proteins expressed in the
      central nervous system (CNS) and alterations of genes involved in B cell
      receptor, Toll-like receptor and NF-κB signalling.
    explanation: >-
      Names the three pathways this node and the next sit on, and is candid that
      the overall mechanism is not fully worked out.
  - reference: PMID:28619981
    reference_title: "Ibrutinib Unmasks Critical Role of Bruton Tyrosine Kinase in Primary CNS Lymphoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bruton tyrosine kinase (BTK) links the B-cell antigen receptor (BCR) and
      Toll-like receptors with NF-κB.
    explanation: >-
      States the receptor-to-NF-kB connection this node and the next one model,
      and identifies the node in the chain that the BTK inhibitors act on.
- name: Constitutive Canonical NF-kB Activation
  description: >-
    The convergence point. Continuous signalling through both receptors, with
    CARD11 mutation and 3q12.3 gain driving NFKBIZ in a subset, holds canonical
    NF-kB transcriptionally active and sustains the survival and proliferation
    programme the tumour depends on. It is also the node the BTK inhibitors act
    on, which is why they work in a disease with no other targeted option.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: canonical NF-kappaB signal transduction
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
  downstream:
  - target: Unchecked Clonal B-Cell Proliferation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:30723112
    reference_title: "MYD88 L265P mutation and CDKN2A loss are early mutational events in primary central nervous system diffuse large B-cell lymphomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PCNSL is characterized by frequent mutations within the B-cell receptor and
      NF-κB pathways.
    explanation: >-
      States the pathway convergence that defines the disease's genomics.
- name: Aberrant Somatic Hypermutation and CDKN2A Loss
  description: >-
    A parallel arm rather than a downstream consequence: off-target
    activation-induced cytidine deaminase activity mutates PIM1, BTG1, BTG2 and
    other loci, while CDKN2A is lost by 9p21.3 deletion, mutation or promoter
    methylation. The result is loss of the p16INK4a/p14ARF brake on the cell
    cycle on top of the signalling lesions, and progressive genomic instability.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Unchecked Clonal B-Cell Proliferation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:35646048
    reference_title: "Whole-Genome/Exome Sequencing Uncovers Mutations and Copy Number Variations in Primary Diffuse Large B-Cell Lymphoma of the Central Nervous System."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common mutations were identified in IGLL5 (68%), PIM1 (63%), MYD88
      (55%), CD79B (42%), BTG2 (39%), PCLO (39%), KMT2D (34%), and BTG1 (29%)
      genes.
    explanation: >-
      Lists the aberrant-somatic-hypermutation target genes alongside the
      signalling drivers in a whole-genome/exome cohort.
  - reference: PMID:30723112
    reference_title: "MYD88 L265P mutation and CDKN2A loss are early mutational events in primary central nervous system diffuse large B-cell lymphomas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Copy-number analysis demonstrated frequent regions of copy loss (ie,
      CDKN2A), with few areas of amplification.
    explanation: >-
      Records CDKN2A loss as the dominant copy-number event, against a
      copy-number landscape with little amplification.
- name: Acquisition of Immune-Escape Lesions
  description: >-
    The genetically distinctive arm of this disease, and the one that separates
    it from nodal DLBCL. Loss of the HLA locus at 6p21 by deletion or
    copy-neutral loss of heterozygosity, B2M mutation, and gain or rearrangement
    of the PD-L1/PD-L2 locus at 9p24.1 remove the tumour from both MHC-restricted
    recognition and T-cell effector function. Clonal-evolution analysis places
    these as late events, arising independently in primary and relapse samples
    rather than being inherited from the common progenitor.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: LOSS_OF_FUNCTION
  cellular_components:
  - preferred_term: MHC class II protein complex
    modifier: DECREASED
    term:
      id: GO:0042613
      label: MHC class II protein complex
  downstream:
  - target: Escape from T-Cell Immunosurveillance
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36971477
    reference_title: "Large B-cell Lymphomas of Immune-Privileged Sites Relapse via Parallel Clonal Evolution from a Common Progenitor B Cell."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic alterations in genes involved in immune escape (HLA,
      CD274/PDCD1LG2) were predominantly unique in primary and relapse samples
      and thus considered late genetic events.
    explanation: >-
      Places the immune-escape lesions late in the clonal hierarchy and shows
      they arise independently in each tumour.
- name: Escape from T-Cell Immunosurveillance
  description: >-
    The functional consequence, and it compounds rather than creates the problem:
    the CNS is already an immune-sheltered compartment, so a tumour that also
    loses MHC display and overexpresses checkpoint ligands is doubly hidden.
    Reactive T cells, macrophages and microglia are present in the lesion but do
    not clear it. WHO's grouping of this disease with primary testicular and
    vitreoretinal large B-cell lymphoma rests on this shared biology.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: CD8-positive, alpha-beta T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  downstream:
  - target: Perivascular Infiltration of CNS Parenchyma
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36971477
    reference_title: "Large B-cell Lymphomas of Immune-Privileged Sites Relapse via Parallel Clonal Evolution from a Common Progenitor B Cell."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Large B-cell lymphoma of immune-privileged sites (LBCL-IP) arise in immune
      sanctuaries including the testis and central nervous system (CNS).
    explanation: >-
      States the immune-sanctuary framing that groups this disease with its
      testicular and vitreoretinal counterparts.
  - reference: PMID:37322012
    reference_title: "Primary central nervous system lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Other factors such as T cells, macrophages or microglia, endothelial cells,
      chemokines, and interleukins, probably also have important roles.
    explanation: >-
      Supports the presence and relevance of the reactive cellular compartment,
      while marking its role as probable rather than established.
- name: Unchecked Clonal B-Cell Proliferation
  description: >-
    Sustained NF-kB survival signalling with the cell-cycle brake removed. The
    clone that results is a diffuse large B-cell lymphoma by morphology and
    immunophenotype, non-germinal-centre in the great majority of cases, and it
    accounts for over 95% of lymphomas arising primarily in the CNS.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neoplastic B cell
    term:
      id: CL:0000236
      label: B cell
  downstream:
  - target: Perivascular Infiltration of CNS Parenchyma
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37530337
    reference_title: "Primary central nervous system lymphoma: Comprehension of cell-of-origin subtypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Primary central nervous system diffuse large B-cell lymphoma (PCNS-DLBCL)
      is an uncommon extranodal lymphoma that accounts for more than 95% of all
      the CNS lymphomas.
    explanation: >-
      Establishes DLBCL as the histology of essentially the whole entity.
- name: Perivascular Infiltration of CNS Parenchyma
  description: >-
    The tumour grows in angiocentric cuffs around CNS microvessels rather than as
    a discrete encapsulated mass, which is why resection has no role and why the
    lesion is diffusely infiltrative well beyond its enhancing margin. Deep
    periventricular, basal ganglia, thalamic and corpus callosum involvement is
    characteristic and prognostically adverse.
  biological_scale: TISSUE
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  - preferred_term: spinal cord
    term:
      id: UBERON:0002240
      label: spinal cord
  downstream:
  - target: Mass Effect and Blood-Brain Barrier Disruption
    causal_link_type: DIRECT
  - target: Neoplasm of the nervous system
    causal_link_type: DIRECT
  - target: Increased CSF protein concentration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:35096360
    reference_title: "Primary central nervous system lymphoma in the United States, 1975-2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most PCNSL occurred in the brain, followed by the spinal cord.
    explanation: >-
      Gives the anatomical distribution bound on this node.
- name: Mass Effect and Blood-Brain Barrier Disruption
  description: >-
    Expanding perivascular tumour, vasogenic oedema and a leaking blood-brain
    barrier together produce the clinical syndrome. Which deficit appears is a
    matter of where the lesion sits rather than of anything specific to the
    tumour, which is why presentation is heterogeneous and frequently mistaken
    for stroke, demyelination or a psychiatric disorder before imaging.
  biological_scale: ORGANISM
  downstream:
  - target: Seizure
    causal_link_type: DIRECT
  - target: Headache
    causal_link_type: DIRECT
  - target: Papilledema
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Atypical behavior
    causal_link_type: DIRECT
  - target: Memory impairment
    causal_link_type: DIRECT
  - target: Ataxia
    causal_link_type: DIRECT
  - target: Hemiparesis
    causal_link_type: DIRECT
  - target: Aphasia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37322012
    reference_title: "Primary central nervous system lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Clinical presentation varies depending on the involved regions of the CNS.
    explanation: >-
      States that the clinical picture is determined by lesion location rather
      than by a tumour-specific syndrome.
- name: Vitreoretinal Dissemination
  description: >-
    Spread to the eye, itself a second immune-privileged compartment behind the
    blood-ocular barrier. It is common enough that ophthalmic examination is part
    of staging, and a substantial minority of affected eyes are asymptomatic, so
    it is found by looking rather than by complaint.
  biological_scale: TISSUE
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  downstream:
  - target: Blurred vision
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37322012
    reference_title: "Primary central nervous system lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Primary central nervous system lymphoma (PCNSL) is a diffuse large B cell
      lymphoma in which the brain, spinal cord, leptomeninges and/or eyes are
      exclusive sites of disease.
    explanation: >-
      Establishes the eye as one of the disease's defining compartments.
- name: Loss of EBV-Specific T-Cell Surveillance
  description: >-
    A separate route into the same tumour, and the reason this entry is not
    purely a story about MYD88. In HIV infection, transplant immunosuppression
    and congenital immunodeficiency, failure of EBV-specific T-cell control
    permits outgrowth of an EBV-transformed B-cell clone without the same
    dependence on the somatic driver mutations above. The resulting disease is
    EBV-positive and is regarded as biologically distinct from the sporadic
    immunocompetent form, while converging on the same infiltrative endpoint.
  biological_scale: ORGANISM
  downstream:
  - target: Unchecked Clonal B-Cell Proliferation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Reaches the same proliferating clone by viral transformation under absent
      immune control rather than by the MYD88/CD79B route.
  evidence:
  - reference: PMID:36960939
    reference_title: "EBV-positive PCNSL in older patients: incidence, characteristics, tumor pathology, and outcomes across a large multicenter cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among 309 CNSL patients aged ≥60, 11.7% had EBV + tumors of which 72.2%
      were solid organ transplant (SOT)-related post-transplant
      lymphoproliferative disorders (PTLD).
    explanation: >-
      Quantifies the EBV-positive fraction and ties most of it to
      transplant-associated immunosuppression, which is the population this
      branch describes.
  - reference: PMID:36960939
    reference_title: "EBV-positive PCNSL in older patients: incidence, characteristics, tumor pathology, and outcomes across a large multicenter cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Younger age, SOT or autoimmune disease, and immunosuppressive treatment
      correlated highly with EBV-positivity.
    explanation: >-
      Establishes the association between impaired immune control and EBV
      positivity that this node asserts.
  - reference: PMID:37322012
    reference_title: "Primary central nervous system lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients receiving prolonged immunosuppressive agents (such as those
      undergoing solid organ transplantation or those with autoimmune disorders)
      are the major at-risk population for PCNSL
    explanation: >-
      Names the at-risk population this branch is scoped to.
phenotypes:
- category: Clinical
  name: Neoplasm of the nervous system
  description: >-
    The lesion itself: one or more enhancing, diffusion-restricted intra-axial
    masses, most often supratentorial and frequently deep or periventricular.
  phenotype_term:
    preferred_term: Neoplasm of the nervous system
    term:
      id: HP:0004375
      label: Neoplasm of the nervous system
  evidence:
  - reference: PMID:35096360
    reference_title: "Primary central nervous system lymphoma in the United States, 1975-2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most PCNSL occurred in the brain, followed by the spinal cord.
    explanation: >-
      Records the anatomical distribution of the tumour.
- category: Clinical
  name: Hemiparesis
  description: >-
    Focal motor deficit, the commonest way this disease presents. Which deficit
    appears follows the lesion, so hemiparesis and aphasia are two faces of the
    same thing rather than separate syndromes.
  phenotype_term:
    preferred_term: Hemiparesis
    term:
      id: HP:0001269
      label: Hemiparesis
  evidence:
  - reference: PMID:37322012
    reference_title: "Primary central nervous system lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the most common clinical presentation is focal neurological deficit
      followed by altered mental status
    explanation: >-
      Establishes focal neurological deficit as the leading presentation, of
      which motor weakness is the commonest form.
- category: Clinical
  name: Aphasia
  description: >-
    Language deficit with dominant-hemisphere involvement, the other common form
    of the focal presentation.
  phenotype_term:
    preferred_term: Aphasia
    term:
      id: HP:0002381
      label: Aphasia
  evidence:
  - reference: PMID:37322012
    reference_title: "Primary central nervous system lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the most common clinical presentation is focal neurological deficit
      followed by altered mental status
    explanation: >-
      The same statement of the leading presentation; aphasia is its
      dominant-hemisphere form.
- category: Clinical
  name: Atypical behavior
  description: >-
    Personality change, apathy and behavioural disturbance, often the earliest
    complaint and a common reason the diagnosis is initially missed.
  phenotype_term:
    preferred_term: Behavioral and personality change
    term:
      id: HP:0000708
      label: Atypical behavior
  evidence:
  - reference: PMID:37322012
    reference_title: "Primary central nervous system lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Clinical presentation varies depending on the involved regions of the CNS.
    explanation: >-
      Supports a location-determined clinical picture, of which behavioural
      change is the frontal manifestation; the source does not quantify it.
- category: Clinical
  name: Memory impairment
  description: >-
    Cognitive decline at presentation, and separately a late consequence of
    whole-brain radiotherapy in survivors.
  phenotype_term:
    preferred_term: Memory impairment
    term:
      id: HP:0002354
      label: Memory impairment
  evidence:
  - reference: PMID:30785830
    reference_title: "Radiotherapy or Autologous Stem-Cell Transplantation for Primary CNS Lymphoma in Patients 60 Years of Age and Younger: Results of the Intergroup ANOCEF-GOELAMS Randomized Phase II PRECIS Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cognitive impairment was observed after WBRT, whereas cognitive functions
      were preserved or improved after ASCT.
    explanation: >-
      Documents the treatment-related arm of this phenotype and the consolidation
      choice that determines it.
- category: Clinical
  name: Seizure
  description: >-
    Less frequent than in glioma, which is consistent with the deep and
    periventricular location typical of this tumour rather than a cortical one.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:37322012
    reference_title: "Primary central nervous system lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Clinical presentation varies depending on the involved regions of the CNS.
    explanation: >-
      The cited review ties the manifestations to lesion location; it does not

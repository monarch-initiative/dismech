name: Primary Central Nervous System Lymphoma
creation_date: "2026-09-09T12:00:00Z"
category: Complex
synonyms:
- PCNSL
- primary CNS lymphoma
- primary diffuse large B-cell lymphoma of the CNS
- PCNS-DLBCL
- primary brain lymphoma
description: >-
  Primary central nervous system lymphoma is an aggressive diffuse large B-cell
  lymphoma whose defining feature is where it is not: the brain, spinal cord,
  leptomeninges and eyes are its exclusive sites at diagnosis, and demonstrable
  disease outside the central nervous system excludes the diagnosis. That
  restriction is the entity, and it is why staging deliberately looks for
  systemic disease it hopes not to find.

  The tumour arises from a B cell that has acquired a small, stereotyped set of
  somatic lesions — MYD88 L265P and CD79B together in the majority of cases —
  which switch on Toll-like-receptor and B-cell-receptor signalling without any
  ligand and drive canonical NF-kB constitutively. Clonal evolution studies of
  paired primary and relapse samples place those mutations, with TBL1XR1 and BCL6
  rearrangement, in a common progenitor cell held in a memory B-cell state, and
  place the immune-escape lesions much later. The late group is the
  characteristic one: loss of the HLA locus at 6p21, B2M mutation, and gain or
  rearrangement of the PD-L1/PD-L2 locus at 9p24.1 all remove the tumour from
  T-cell view inside a compartment that was already immunologically sheltered.
  WHO's 2022 classification groups PCNSL with primary testicular and
  vitreoretinal large B-cell lymphoma on exactly this basis, as lymphomas of
  immune-privileged sites.

  Clinically it is a subacute mass lesion with a deceptive imaging signature —
  homogeneous enhancement and restricted diffusion rather than the ring
  enhancement of glioblastoma or abscess — and a notorious sensitivity to
  corticosteroids, which can make the tumour vanish radiographically and render a
  subsequent biopsy uninterpretable. Treatment is high-dose methotrexate-based
  induction followed by consolidation, and the consolidation choice is the one
  that matters most for what survivors are left with: autologous transplant
  preserves cognition where whole-brain radiotherapy erodes it.

  downstream:
  - target: Tubulin Acetylation and Neuronal Migration Defect
    description: >-
      Inferred link from FOXP2-regulated SRPX2/uPAR network perturbation in
      speech-related cortex to the SRPX2-dependent cortical neuronal migration
      and tubulin-acetylation pathway.
    evidence:
    - reference: PMID:20858596
      reference_title: "Molecular networks implicated in speech-related disorders: FOXP2 regulates the SRPX2/uPAR complex."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: >-
        Mutations in transcription factor FOXP2 cause difficulties mastering
        fluent speech (developmental verbal dyspraxia, DVD), whereas mutations
        of sushi-repeat protein SRPX2 lead to epilepsy of the rolandic
        (sylvian) speech areas, with DVD or with bilateral perisylvian
        polymicrogyria. Pathophysiological mechanisms driven by SRPX2 involve
        modified interaction with the plasminogen activator receptor (uPAR).
      explanation: >-
        Indirectly links modified SRPX2/uPAR interaction in the FOXP2-regulated
        speech-cortex network to the downstream SRPX2 cortical development and
        epilepsy branch (the link to neuronal migration is inferred across
        studies rather than directly tested in this promoter/interaction assay).

- name: Tubulin Acetylation and Neuronal Migration Defect
  description: >-
    In utero Srpx2 silencing in rat cortex impairs neuronal migration, and
    wild-type but not mutant human SRPX2 rescues the migration phenotype while
    increasing alpha-tubulin acetylation. This is the clearest module-conformant
    branch and links SRPX2 to the microtubule-dependent neuronal migration
    module rather than to a generic epilepsy module.

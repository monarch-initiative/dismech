- name: Landau-Kleffner Syndrome
  disease_term:
    preferred_term: Landau-Kleffner syndrome
    term:
      id: MONDO:0009509
      label: Landau-Kleffner syndrome
  description: >-
    Childhood epileptic encephalopathy within the continuous spike-and-waves
    during sleep (CSWS) and rolandic epilepsy spectrum, presenting with
    acquired epileptic aphasia rather than developmental oral/speech dyspraxia
    or bilateral perisylvian polymicrogyria.
  distinguishing_features:
  - Landau-Kleffner syndrome is an epileptic encephalopathy within the CSWS and rolandic epilepsy spectrum, whereas SRPX2 mutations were reported in rolandic seizures with oral and speech dyspraxia or bilateral perisylvian polymicrogyria.
  evidence:
  - reference: PMID:19682046
    reference_title: "From rolandic epilepsy to continuous spike-and-waves during sleep and Landau-Kleffner syndromes: insights into possible genetic factors."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Indeed, the Landau-Kleffner syndrome (LKS), the continuous spike-and-waves
      during sleep syndrome (CSWS), and the benign childhood epilepsy with
      centrotemporal spikes (BCECTS) or benign rolandic epilepsy, are different
      entities that are considered as part of a single continuous spectrum of
      disorders.
    explanation: >-
      Places Landau-Kleffner syndrome and benign rolandic epilepsy as distinct
      entities along a shared childhood focal epilepsy spectrum.
discussions:
- discussion_id: gap_srpx2_variant_causality_and_lumping
  prompt: >-
    Which SRPX2 variants have sufficient modern segregation, population,
    functional, and replication evidence to support a single disease entry with
    speech-epilepsy and bilateral perisylvian PMG branches?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#SRPX2 Missense Variation and Protein Processing Defect
  - pathophysiology#Perisylvian Cortical Organization Failure
  rationale: >-
    The original abstracts support reported N327S and Y72S branches, but the
    ClinGen Epilepsy GCEP reclassified the SRPX2-epilepsy relationship as
    Refuted in October 2023 based on gnomAD population allele frequencies, lack
    of missense constraint, and the identification of another putative cause
    (GRIN2A, PMID:23933820) in one of the original families. For curation, this
    means SRPX2 is retained as a historical/mechanistic boundary entry while
    variant-level causality and subtype branching remain open and contested.
  evidence:
  - reference: PMID:16497722
    reference_title: SRPX2 mutations in disorders of language cortex and cognition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A second mutation (Y72S) was identified within the first sushi domain of
      SRPX2 in a male with RSs and bilateral perisylvian polymicrogyria and his
      female relatives with mild MR or unaffected carrier status.
    explanation: >-
      Shows variable expression or carrier status within the reported PMG
      branch, motivating careful variant-level interpretation.
  - reference: PMID:17942002
    reference_title: Molecular evolution of the human SRPX2 gene that causes brain disorders of the Rolandic and Sylvian speech areas.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The R75K substitution occurred in the first sushi domain of SRPX2, only
      three amino acid residues away from a previously reported disease-causing
      mutation (Y72S).
    explanation: >-
      Supports focusing variant interpretation on the first sushi domain while
      keeping functional consequences open.
  - reference: CGGV:assertion_e9555886-a248-4bd4-b3dc-50ff503d6e7a-2023-10-17T170000.000Z
    reference_title: "SRPX2 / epilepsy (Refuted)"
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      While initial evidence (such as segregation and initial experiments)
      seemed to support pathogenicity in respect to epilepsy, subsequent
      evidence including mean allele frequency in gnomAD, a high dN/dS ratio,
      variable clinical presentations and the detection of another putative
      cause in one of the families (GRIN2A) (PMID:23933820) brings this gene
      disease relationship into question. Without significant supportive
      genetic evidence, a correlation to epilepsy and/or neurodevelopmental
      disorders is not supported.
    explanation: >-
      Records the 2023 ClinGen Epilepsy GCEP Refuted verdict questioning the
      human genetic evidence for SRPX2 in epilepsy and neurodevelopmental
      disorders.
  proposed_experiments:
  - experiment_id: exp_srpx2_variant_reclassification_panel
    name: SRPX2 variant reclassification and rescue panel
    description: >-
      Reassess reported SRPX2 variants with current population frequencies,
      segregation, X-inactivation data, protein-processing assays, and
      standardized rescue of SRPX2 knockdown or knockout phenotypes. Include
      N327S, Y72S, nearby first-sushi-domain variants, and matched benign
      controls.
    experiment_type:
      preferred_term: variant reclassification and functional rescue experiment
    perturbations:
    - name: SRPX2 variant knock-in or rescue
      target: pathophysiology#SRPX2 Missense Variation and Protein Processing Defect
      genes:
      - preferred_term: SRPX2
        term:
          id: hgnc:30668
          label: SRPX2
      description: >-
        Introduce or rescue individual SRPX2 variants in a shared assay
        background to compare protein processing, migration, and tubulin
        acetylation.
    readouts:

name: SRPX2-related Speech-Epilepsy-Polymicrogyria
creation_date: "2026-06-12T03:31:46Z"
category: Mendelian
synonyms:
- SRPX2-related rolandic epilepsy with speech dyspraxia
- SRPX2-related bilateral perisylvian polymicrogyria
- rolandic seizures with oral and speech dyspraxia and mental retardation
description: >-
  SRPX2-related speech-epilepsy-polymicrogyria is an X-linked
  neurodevelopmental disorder boundary in which reported SRPX2 variants affect
  rolandic/sylvian speech-cortex function and development. The entry lumps
  rolandic epilepsy with oral/speech dyspraxia and the bilateral perisylvian
  polymicrogyria presentation because the shared skeleton is coherent:
  SRPX2-dependent protein processing and SRPX2/uPAR network function converge
  on neuronal migration, tubulin acetylation, perisylvian cortical organization,
  and later epileptiform activity. It should not be expanded to all rolandic
  epilepsy, all developmental speech disorder, or all polymicrogyria.
parents:
- Rolandic epilepsy
- Polymicrogyria
- speech disorder
- malformation of cortical development
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:16497722
      reference_title: SRPX2 mutations in disorders of language cortex and cognition.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We have identified the Xq22 gene SRPX2 as being responsible for rolandic
        seizures (RSs) associated with oral and speech dyspraxia and mental
        retardation (MR).
      explanation: >-
        Classifies SRPX2-related disease as a neurologic disorder affecting
        epilepsy, speech, and cortical development.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:17942002
      reference_title: Molecular evolution of the human SRPX2 gene that causes brain disorders of the Rolandic and Sylvian speech areas.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The X-linked SRPX2 gene encodes a Sushi Repeat-containing Protein of
        unknown function and is mutated in two disorders of the Rolandic/Sylvian
        speech areas.
      explanation: >-
        Describes reported X-linked SRPX2 variation in disorders of the
        Rolandic/Sylvian speech areas (note that the ClinGen Epilepsy GCEP
        subsequently refuted the SRPX2-epilepsy relationship in 2023).
inheritance:
- name: X-linked inheritance
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  expressivity: VARIABLE
  description: >-
    SRPX2 is located on Xq22 with reported X-linked segregation and variable
    expression in female carriers (ranging from mild intellectual disability or
    speech-epilepsy manifestations to unaffected carrier status), although the
    ClinGen Epilepsy GCEP refuted the SRPX2-epilepsy gene-disease relationship
    in 2023 after detection of a GRIN2A variant in one of the original families.
  evidence:
  - reference: PMID:16497722
    reference_title: SRPX2 mutations in disorders of language cortex and cognition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A second mutation (Y72S) was identified within the first sushi domain of
      SRPX2 in a male with RSs and bilateral perisylvian polymicrogyria and his
      female relatives with mild MR or unaffected carrier status.
    explanation: >-
      Documents reported X-linked segregation of the SRPX2 Y72S variant with
      variable expressivity or unaffected carrier status in females.
  - reference: PMID:17942002
    reference_title: Molecular evolution of the human SRPX2 gene that causes brain disorders of the Rolandic and Sylvian speech areas.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The X-linked SRPX2 gene encodes a Sushi Repeat-containing Protein of
      unknown function and is mutated in two disorders of the Rolandic/Sylvian
      speech areas.
    explanation: >-
      Describes the X-linked chromosomal localization of SRPX2 in the reported
      families.
prevalence:
- population: Reported family pedigrees
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    Only two founding family branches (N327S with rolandic seizures and
    oral/speech dyspraxia, and Y72S in a male proband with bilateral perisylvian
    polymicrogyria and female relatives) are described in the primary genetic
    report.
  evidence:
  - reference: PMID:16497722
    reference_title: SRPX2 mutations in disorders of language cortex and cognition.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disease-causing mutation (N327S) resulted in gain-of-glycosylation of
      the secreted mutant protein. A second mutation (Y72S) was identified
      within the first sushi domain of SRPX2 in a male with RSs and bilateral
      perisylvian polymicrogyria and his female relatives with mild MR or
      unaffected carrier status.
    explanation: >-
      Documents the two reported family pedigrees defining the ultra-rare
      SRPX2-related disease spectrum.
progression:
- phase: Onset
  age_range: Prenatal cortical development with childhood seizure and speech onset
  notes: >-
    Neuronal migration defects originate during embryonic cortical development,
    followed postnatally by childhood focal (rolandic) seizures and oral/speech
    dyspraxia.
  evidence:
  - reference: PMID:23831613
    reference_title: Tubacin prevents neuronal migration defects and epileptic activity caused by rat Srpx2 silencing in utero.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using an in utero Srpx2 silencing approach, we show that SRPX2 influences
      neuronal migration in the developing rat cerebral cortex. Wild-type, but
      not the mutant human SRPX2 proteins, rescued the neuronal migration
      phenotype caused by Srpx2 silencing in utero, and increased alpha-tubulin
      acetylation. Following in utero Srpx2 silencing, spontaneous epileptiform
      activity was recorded post-natally.
    explanation: >-
      Supports prenatal developmental onset of neuronal migration defects
      followed by postnatal epileptiform activity.
  - reference: PMID:19682046
    reference_title: "From rolandic epilepsy to continuous spike-and-waves during sleep and Landau-Kleffner syndromes: insights into possible genetic factors."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Recent reports on the involvement of the SRPX2 and ELP4 genes with
      possible roles in cell motility, migration, and adhesion have provided
      first insights into the complex molecular bases of childhood focal
      epilepsies.
    explanation: >-
      Places SRPX2-related epilepsy within childhood-onset focal epilepsies.
- phase: Chronic
  age_range: Lifelong (in the polymicrogyria structural branch)
  notes: >-
    Polymicrogyria is an irreversible, lifelong structural cortical malformation
    managed symptomatically across childhood and adulthood.
  evidence:
  - reference: PMID:36211152
    reference_title: The Genetic Landscape of Polymicrogyria.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      PMG is a lifelong disorder. The brain malformation cannot be reversed, but
      the symptoms may be treated in children and adults.
    explanation: >-
      Supports the lifelong, non-reversible course of the polymicrogyria
      structural malformation branch.
notes: >-
  MONDO:0015587 labels rolandic epilepsy-speech dyspraxia syndrome, but no
  disease_term is assigned because this curation intentionally includes the
  SRPX2-associated bilateral perisylvian polymicrogyria boundary only where the
  same SRPX2 speech-cortex migration mechanism applies. The ontology term does
  not define the disease boundary.

  description: >
    Microglial depletion and dyshomeostasis in cerebral and periventricular
    white matter drive pronounced GFAP-positive reactive astrocytosis and
    elevated proinflammatory chemokine (MCP-1/CCL2) expression, amplifying
    white matter neuroinflammation.

      choline and N-acetylaspartate in ALSP patients.

differential_diagnoses:
- name: AARS2-related leukoencephalopathy (LKENP)
  description: >
    Autosomal recessive leukoencephalopathy caused by biallelic pathogenic
    variants in AARS2, sharing the histological hallmark of neuraxial
    degeneration with neuroaxonal spheroids and white matter demyelination.
  distinguishing_features:
  - Autosomal recessive inheritance due to biallelic AARS2 variants rather than autosomal dominant CSF1R variants
  - Earlier age at onset (typically third decade of life) and association with premature ovarian failure in affected females
  - More prominent brainstem and deep gray matter tract involvement on brain MRI
  evidence:
  - reference: PMID:31775912
    reference_title: "An AARS variant as the likely cause of Swedish type hereditary diffuse leukoencephalopathy with spheroids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "While the histological hallmark of neuraxial degeneration with spheroids is common to the three disorders: AARS2 leukoencephalopathy, CSF1R related HDLS/ALSP, and HDLS-S (with the latter two expected to be most closely related), some differences have been observed, including an earlier age of onset of leukodystrophy (third decade of life) in addition to ovarian failure associated to AARS2 mutations"
    explanation: >
      Directly contrasts AARS2 leukoencephalopathy with CSF1R-related HDLS/ALSP
      by earlier onset and ovarian failure.
  - reference: PMID:31775912
    reference_title: "An AARS variant as the likely cause of Swedish type hereditary diffuse leukoencephalopathy with spheroids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Systematic comparison of MRI phenotypes showed more brain stem and deeper gray matter lesions in AARS2 disease"
    explanation: >
      Supports more prominent brainstem and deep gray matter MRI involvement in
      AARS2-related leukoencephalopathy compared with CSF1R-related HDLS/ALSP.
- name: AARS1-related leukoencephalopathy (Swedish-type HDLS and AARS1-AR-ALSP)
  disease_term:
    preferred_term: AARS1-related leukoencephalopathy
    term:
      id: MONDO:1010132
      label: AARS1-related leukoencephalopathy
  description: >
    Adult-onset leukoencephalopathy with neuroaxonal spheroids and pigmented
    glia caused by pathogenic variants in AARS1 (formerly AARS), including the
    autosomal dominant Swedish HDLS kindred (p.Cys152Phe) and autosomal
    recessive AARS1-AR-ALSP (p.Thr606Ile).
  distinguishing_features:
  - Causative pathogenic variants in AARS1 (heterozygous p.Cys152Phe in dominant Swedish-type HDLS or homozygous p.Thr606Ile in recessive ALSP) with absence of CSF1R mutations
  - Posterior-predominant leukoencephalopathy and ophthalmologic dysfunction in recessive AARS1-AR-ALSP
  evidence:
  - reference: PMID:31775912
    reference_title: "An AARS variant as the likely cause of Swedish type hereditary diffuse leukoencephalopathy with spheroids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we demonstrate that the p.Cys152Phe variant in AARS is the likely cause of HDLS-S, thus separating this nosographic entity from CSFR1R related HDLS/ALSP."
    explanation: >
      Separates AARS1-mutated Swedish-type HDLS from CSF1R-related HDLS/ALSP.
  - reference: PMID:37106376
    reference_title: "An AARS1 variant identified to cause adult-onset leukoencephalopathy with neuroaxonal spheroids and pigmented glia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, we associated a recessive AARS1 variant with ALSP (AARS1-AR-ALSP)."
    explanation: >
      Establishes recessive AARS1 pathogenic variants as a distinct genetic cause
      of adult-onset leukoencephalopathy with axonal spheroids and pigmented glia.
- name: Frontotemporal dementia
  disease_term:
    preferred_term: frontotemporal dementia
    term:
      id: MONDO:0017276
      label: frontotemporal dementia
  description: >
    Shares early adult-onset executive dysfunction, personality and behavioral
    changes, social disinhibition, apathy, and depression with CSF1R-related
    leukoencephalopathy, frequently leading to clinical misdiagnosis.
  distinguishing_features:
  - Confluent frontoparietal deep white matter T2/FLAIR hyperintensities, persistent diffusion-restricted lesions, corpus callosum thinning, and periventricular calcifications on CT in HDLS/ALSP
  - Heterozygous pathogenic variant in CSF1R
  evidence:
  - reference: PMID:38897209
    reference_title: "Therapeutic potential of human microglia transplantation in a chimeric model of CSF1R-related leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The overlap in clinical symptoms with more common neurological disorders including multiple sclerosis, atypical parkinsonism, and frontotemporal dementia often leads to misdiagnosis."
    explanation: >
      Documents frequent clinical misdiagnosis of ALSP as frontotemporal
      dementia.
  - reference: PMID:34145972
    reference_title: "Modeling CSF-1 receptor deficiency diseases - how close are we?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The spectrum of neuropsychiatric symptoms, including personality changes, executive dysfunction, social disinhibition and depression observed in patients, that could be mistaken for frontotemporal dementias, was explained by the involvement of the prefrontal deep white matter [60, 61]."
    explanation: >
      Explains why prefrontal deep white matter involvement in ALSP mimics
      frontotemporal dementia.
- name: Multiple sclerosis
  disease_term:
    preferred_term: multiple sclerosis
    term:
      id: MONDO:0005301
      label: multiple sclerosis
  description: >
    Inflammatory demyelinating disorder of the central nervous system that can
    mimic early motor, cognitive, and white-matter MRI findings of
    CSF1R-related leukoencephalopathy in young and middle-aged adults.
  distinguishing_features:
  - Relentlessly progressive clinical course without relapses or gadolinium-enhancing plaques, persistent diffusion restriction in deep white matter, and frontal periventricular calcifications on CT in HDLS/ALSP
  - Pathogenic CSF1R variant on molecular genetic testing
  evidence:
  - reference: PMID:38897209
    reference_title: "Therapeutic potential of human microglia transplantation in a chimeric model of CSF1R-related leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The overlap in clinical symptoms with more common neurological disorders including multiple sclerosis, atypical parkinsonism, and frontotemporal dementia often leads to misdiagnosis."
    explanation: >
      Identifies multiple sclerosis as a major clinical mimic of CSF1R-related
      leukoencephalopathy.
- name: Corticobasal syndrome
  disease_term:
    preferred_term: corticobasal syndrome
    term:
      id: MONDO:0018696
      label: corticobasal syndrome
  description: >
    Asymmetric parkinsonism, rigidity, bradykinesia, apraxia, and pyramidal
    signs in CSF1R-related leukoencephalopathy frequently mimic corticobasal
    syndrome or atypical parkinsonism.
  distinguishing_features:
  - Extensive bilateral or asymmetric frontoparietal white matter lesions, thinning of the corpus callosum, and periventricular calcifications on neuroimaging in HDLS/ALSP
  - Identification of a heterozygous pathogenic variant in CSF1R
  evidence:
  - reference: PMID:22197934
    reference_title: "Mutations in the colony stimulating factor 1 receptor (CSF1R) gene cause hereditary diffuse leukoencephalopathy with spheroids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Follow-up sequencing identified an additional CSF1R mutation in an individual diagnosed with corticobasal syndrome."
    explanation: >
      Demonstrates that CSF1R-related HDLS can present clinically as
      corticobasal syndrome.
  - reference: PMID:38897209
    reference_title: "Therapeutic potential of human microglia transplantation in a chimeric model of CSF1R-related leukoencephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The overlap in clinical symptoms with more common neurological disorders including multiple sclerosis, atypical parkinsonism, and frontotemporal dementia often leads to misdiagnosis."
    explanation: >
      Documents frequent misdiagnosis of ALSP as atypical parkinsonism.
- name: Brain abnormalities, neurodegeneration, and dysosteosclerosis (BANDDOS)
  disease_term:
    preferred_term: brain abnormalities, neurodegeneration, and dysosteosclerosis
    term:
      id: MONDO:0032772
      label: brain abnormalities, neurodegeneration, and dysosteosclerosis
  description: >
    Allelic autosomal recessive disorder caused by biallelic pathogenic variants
    in CSF1R, characterized by congenital or pediatric-onset brain structural
    malformations, severe leukodystrophy, periventricular calcifications, and
    generalized skeletal dysplasia (dysosteosclerosis).
  distinguishing_features:
  - Autosomal recessive inheritance with biallelic (homozygous or compound heterozygous) CSF1R variants rather than heterozygous autosomal dominant CSF1R variants
  - Congenital, infantile, or childhood onset with dysosteosclerosis, craniofacial sclerosis, and congenital brain malformations (agenesis of corpus callosum, cerebellar and Dandy-Walker anomalies)
  evidence:
  - reference: PMID:37349768
    reference_title: "Brain abnormalities, neurodegeneration, and dysosteosclerosis (BANDDOS): new cases, systematic literature review, and associations with CSF1R-ALSP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CSF1R mutations cause autosomal-dominant CSF1R-related leukoencephalopathy with axonal spheroids and pigmented glia (CSF1R-ALSP) and autosomal-recessive brain abnormalities, neurodegeneration, and dysosteosclerosis (BANDDOS)."
    explanation: >
      Distinguishes autosomal dominant CSF1R-ALSP from allelic autosomal
      recessive BANDDOS.
  - reference: PMID:34135456
    reference_title: "From HDLS to BANDDOS: fast-expanding phenotypic spectrum of disorders caused by mutations in CSF1R."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recently, a more severe phenotypic spectrum has been identified in individuals with bi-allelic mutations of CSF1R. In addition to leukoencephalopathy of earlier onset than HDLS, the new disease shows brain malformations and skeletal dysplasia compatible with dysosteosclerosis (DOS), thus named \"brain abnormalities, neurodegeneration, and dysosteosclerosis\" (BANDDOS, OMIM # 618476)."
    explanation: >
      Details the biallelic genotype, congenital brain malformations, and
      skeletal dysplasia that separate BANDDOS from adult-onset HDLS/ALSP.

treatments:
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >
    HSCT is an emerging disease-modifying therapy increasingly offered to
    patients with CSF1R-ALSP, aiming to replace dysfunctional CSF1R-mutant
    microglia/brain macrophages with donor-derived cells. Outcomes are variable:
    gait problems as the predominant manifestation and younger age at transplant
    predict better outcomes, whereas a high burden of cognitive symptoms
    predicts worse outcomes.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic hematopoietic stem cell transplantation
    term:
      id: NCIT:C46089
      label: Allogeneic Hematopoietic Stem Cell Transplantation
  target_mechanisms:
  - target: Microglial Dyshomeostasis and Depletion
    treatment_effect: RESTORES
    description: >
      Donor-derived hematopoietic myeloid cells with wild-type CSF1R engraft in
      the central nervous system and repopulate the depleted microglial niche,
      stabilizing white-matter lesions and neurological function.
    evidence:
    - reference: PMID:31840744
      reference_title: "Allogeneic HSCT for adult-onset leukoencephalopathy with spheroids and pigmented glia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Allogeneic HSCT may be beneficial in ALSP by providing a supply of bone marrow-derived brain-engrafting myeloid cells with donor wild-type CSF1R to repopulate the microglial niche."
      explanation: >
        Supports repopulation of the dysfunctional microglial niche by wild-type
        donor myeloid cells as the mechanism of action of allogeneic HSCT.
  evidence:
  - reference: PMID:36559271
    reference_title: "Hematopoietic Stem Cell Transplantation in CSF1R-Related Leukoencephalopathy: Retrospective Study on Predictors of Outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hematopoietic stem cell transplantation (HSCT) has been increasingly offered to patients with CSF1R-ALSP."
    explanation: >
      Documents HSCT as an emerging therapy increasingly used in CSF1R-ALSP.
  - reference: PMID:36559271
    reference_title: "Hematopoietic Stem Cell Transplantation in CSF1R-Related Leukoencephalopathy: Retrospective Study on Predictors of Outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "gait problems indicated a milder phenotype with better response to HSCT and good therapy outcomes. In contrast, patients with a higher burden of cognitive symptoms were most likely not to benefit from HSCT."
    explanation: >
      Outcomes are variable and depend on phenotype/timing, so HSCT benefit is
      partial and patient-dependent.
  - reference: PMID:31840744
    reference_title: "Allogeneic HSCT for adult-onset leukoencephalopathy with spheroids and pigmented glia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Allogeneic HSCT may be beneficial in ALSP by providing a supply of bone marrow-derived brain-engrafting myeloid cells with donor wild-type CSF1R to repopulate the microglial niche."
    explanation: >
      Provides the mechanistic rationale for HSCT in ALSP: donor-derived myeloid
      cells with wild-type CSF1R engraft the brain and repopulate the dysfunctional
      microglial niche. The two-patient series showed MRI stabilization and partial
      clinical stabilization at >2 years.

- name: Supportive and Multidisciplinary Care
  description: >
    Mainstay management is multidisciplinary supportive care, including
    neurology, neuropsychological rehabilitation, physical, occupational, and
    speech-language therapy, psychotherapy, social support, and genetic
    counseling. Sedatives, antipsychotics, and other medications that decrease
    alertness or increase fall risk should be used cautiously in individuals
    with gait problems and cognitive decline.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:22934315
    reference_title: "CSF1R-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multidisciplinary care by specialists in neurology, psychotherapy, neuropsychological rehabilitation, physical therapy, occupational therapy, speech-language therapy, social services for family support, and genetic counseling."
    explanation: >
      GeneReviews specifies multidisciplinary supportive care as the management
      approach.
  - reference: PMID:22934315
    reference_title: "CSF1R-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "sedatives, antipsychotics, and other medications that may decrease alertness and increase the risk of falling should be used cautiously"
    explanation: >
      GeneReviews "Agents/circumstances to avoid": caution with sedatives and
      antipsychotics in patients with gait problems and cognitive decline.

- name: Genetic Counseling
  description: >
    Genetic counseling is recommended given autosomal dominant (and, for
    biallelic early-onset disease, autosomal recessive) inheritance; predictive
    and prenatal/preimplantation genetic testing are possible once the familial
    CSF1R variant is known.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:22934315
    reference_title: "CSF1R-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "predictive testing for at-risk relatives and prenatal and preimplantation genetic testing for CSF1R-related disorder are possible"
    explanation: >
      GeneReviews supports genetic counseling and predictive/prenatal testing
      once the familial variant is identified.

- name: iPSC-Derived Microglia Transplantation (experimental)
  description: >
    An emerging, preclinical microglia-replacement strategy. Transplantation of
    human iPSC-derived microglial (iMG) progenitors into a microglia-deficient
    (Csf1r FIRE-enhancer-deleted) ALSP mouse model restores a homeostatic
    microglial signature and prevents axonal spheroids, white-matter
    abnormalities, reactive astrocytosis, and brain calcifications. CRISPR-corrected
    ALSP-patient-derived iMG can reverse pre-existing pathology, supporting iMG
    transplantation as a candidate disease-modifying therapy. Not yet in human use.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: cellular therapy
    term:
      id: NCIT:C70601
      label: Cellular Therapy
  target_mechanisms:
  - target: Microglial Dyshomeostasis and Depletion
    treatment_effect: RESTORES
    description: >
      Transplantation of wild-type or CRISPR-corrected human iPSC-derived
      microglial progenitors restores a homeostatic microglial signature and
      reverses axonal spheroids, reactive astrocytosis, and brain
      calcifications in preclinical ALSP models.
    evidence:
    - reference: PMID:38897209
      reference_title: "Therapeutic potential of human microglia transplantation in a chimeric model of CSF1R-related leukoencephalopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "transplantation of human induced pluripotent stem cell (iPSC)-derived microglial (iMG) progenitors restores a homeostatic microglial signature and prevents the development of axonal spheroids, white matter abnormalities, reactive astrocytosis, and brain calcifications"
      explanation: >
        Demonstrates that iPSC-derived microglia transplantation directly
        restores homeostatic microglial function and prevents downstream
        neuropathology in vivo.
  evidence:
  - reference: PMID:38897209
    reference_title: "Therapeutic potential of human microglia transplantation in a chimeric model of CSF1R-related leukoencephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "transplantation of human induced pluripotent stem cell (iPSC)-derived microglial (iMG) progenitors restores a homeostatic microglial signature and prevents the development of axonal spheroids, white matter abnormalities, reactive astrocytosis, and brain calcifications"
    explanation: >
      Preclinical proof of concept that iMG transplantation prevents ALSP-like
      neuropathology in the FIRE mouse model.
  - reference: PMID:38897209
    reference_title: "Therapeutic potential of human microglia transplantation in a chimeric model of CSF1R-related leukoencephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "transplantation of CRISPR-corrected ALSP-patient-derived iMG reverses pre-existing spheroids, astrogliosis, and calcification pathologies"
    explanation: >
      Transplantation of CRISPR-corrected patient-derived iMG into the ALSP mouse
      model reverses established pathology, supporting gene-corrected autologous
      microglia replacement as a therapeutic avenue.

- name: Iluzanebart (VGL101; investigational TREM2 agonist monoclonal antibody)
  description: >
    Investigational monoclonal antibody evaluated in the open-label Phase 2
    IGNITE trial (NCT05677659) in patients with genetically confirmed
    CSF1R-related ALSP to assess safety, tolerability, and effects on
    neuroimaging and disease-progression biomarkers. The Phase 2 IGNITE study
    was terminated after failing to show beneficial effects on neuroimaging,
    fluid biomarkers, or clinical efficacy endpoints in ALSP patients.
  notes: >
    Target-mechanism links are omitted because the cached ClinicalTrials.gov
    registry record (NCT05677659) describes only the clinical study objectives
    and does not provide molecular mechanism-of-action evidence, and because
    the Phase 2 IGNITE study was terminated after failing to demonstrate
    beneficial effects on biomarker or clinical efficacy endpoints, per the
    Falcon deep-research report
    (research/Hereditary_Diffuse_Leukoencephalopathy_with_Spheroids-deep-research-falcon.md),
    citing the sponsor's clinical readout announcement.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: Monoclonal Antibody Therapy
    term:
      id: NCIT:C15490
      label: Monoclonal Antibody Therapy
  evidence:
  - reference: clinicaltrials:NCT05677659
    reference_title: "A Phase 2 Safety, Tolerability, and Proof-of-Concept Study of VGL101 in Patients With Adult-Onset Leukoencephalopathy With Axonal Spheroids and Pigmented Glia (ALSP) (The Ignite Study)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is a multicenter, open-label study to assess the safety and tolerability of iluzanebart (also referred to as VGL101) in subjects with documentation of a gene mutation in the CSF1R gene for the treatment of adult-onset leukoencephalopathy with axonal spheroids and pigmented glia (ALSP)"
    explanation: >
      Documents clinical evaluation of iluzanebart (VGL101) in patients with
      genetically confirmed CSF1R-related ALSP.

clinical_trials:
- name: NCT05677659
  description: >
    The Ignite Study: a Phase 2, open-label study of iluzanebart (VGL101) in
    CSF1R-mutation-confirmed ALSP patients, evaluating safety, tolerability,
    and effects on imaging and disease-progression biomarkers. The trial was
    terminated after failing to demonstrate beneficial effects on neuroimaging,
    biomarker, or clinical efficacy endpoints.
  notes: >

      evidence_source: HUMAN_CLINICAL
      snippet: "Early-onset CSF1R-related disorder is typically caused by biallelic pathogenic variants and inherited in an autosomal recessive manner"
      explanation: >
        GeneReviews confirms autosomal recessive inheritance for early-onset
        disease caused by biallelic CSF1R variants.
  notes: >
    Heterozygous pathogenic variants in CSF1R, clustering in the tyrosine kinase
    domain, are the most common cause of ALSP/HDLS. More than 70 different
    mutations have been identified worldwide.
  evidence:
  - reference: PMID:22197934
    reference_title: "Mutations in the colony stimulating factor 1 receptor (CSF1R) gene cause hereditary diffuse leukoencephalopathy with spheroids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We combined genome-wide linkage analysis with exome sequencing and identified 14 different mutations affecting the tyrosine kinase domain of the colony stimulating factor 1 receptor (encoded by CSF1R) in 14 families with HDLS."
    explanation: >
      Identifies CSF1R tyrosine-kinase-domain mutations as the cause of HDLS in
      14 families.
  - reference: PMID:22934315
    reference_title: "CSF1R-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Late-onset CSF1R-related disorder is typically caused by a heterozygous pathogenic variant and inherited in an autosomal dominant manner"
    explanation: >
      GeneReviews confirms autosomal dominant inheritance for the typical
      late-onset form.


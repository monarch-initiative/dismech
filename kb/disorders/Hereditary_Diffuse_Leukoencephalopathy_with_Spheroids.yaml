  description: >
    Neuroaxonal damage in cerebral white matter and the corpus callosum precedes
    frank demyelination. Disrupted fast axonal transport leads to focal axonal
    swellings (spheroids) packed with phosphorylated neurofilaments, amyloid
    precursor protein (APP), ubiquitin, and dysmorphic mitochondria, accompanied
    by progressive loss of myelinated axons in frontoparietal and corticospinal
    tracts.

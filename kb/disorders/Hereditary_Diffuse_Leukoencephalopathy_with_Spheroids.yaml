description: >
  Hereditary diffuse leukoencephalopathy with spheroids (HDLS), also known as
  adult-onset leukoencephalopathy with axonal spheroids and pigmented glia
  (ALSP) or CSF1R-related leukoencephalopathy, is a rare, progressive
  white-matter neurodegenerative disease most commonly caused by heterozygous,
  typically autosomal dominant, pathogenic variants in CSF1R. CSF1R encodes the
  colony-stimulating factor 1 receptor, which is predominantly expressed on
  microglia, the resident brain macrophages. Impaired CSF1R signaling produces
  microglial dysfunction and a primary microgliopathy that drives demyelination,
  axonal degeneration with axonal spheroids, and accumulation of pigmented glia
  in cerebral white matter. Patients typically present in their 40s-50s with a
  frontotemporal-dementia-like phenotype, neuropsychiatric and personality
  changes, parkinsonism, pyramidal signs, gait disturbance, and seizures,
  progressing to a bedridden, vegetative state.

inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE
  description: >
    Adult-onset CSF1R-related leukoencephalopathy (HDLS/ALSP) is typically
    inherited in an autosomal dominant manner due to heterozygous pathogenic
    variants in CSF1R. Penetrance is age-dependent, increasing from 10% at age
    27 years to 50% at age 43 years and 95% at age 60 years, with marked
    intrafamilial and interfamilial variable expressivity.
  evidence:
  - reference: PMID:22934315
    reference_title: "CSF1R-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Late-onset CSF1R-related disorder is typically caused by a heterozygous pathogenic variant and inherited in an autosomal dominant manner; rarely, late-onset CSF1R-related disorder may be caused by biallelic CSF1R pathogenic variants."
    explanation: >
      GeneReviews establishes autosomal dominant inheritance as the typical mode
      for late-onset CSF1R-related disorder.
  - reference: PMID:34145972
    reference_title: "Modeling CSF-1 receptor deficiency diseases - how close are we?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "have shown that the penetrance of ALSP is age-dependent, increasing from 10% at age 27 years to 50%, at age 43 years and 95%, at age 60 years."
    explanation: >
      Cohort data demonstrate incomplete, age-dependent penetrance reaching 95%
      by age 60 years.
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    Rarely, late-onset CSF1R-related disorder or early-onset CSF1R-related
    disorder (BANDDOS) is caused by biallelic CSF1R pathogenic variants
    inherited in an autosomal recessive manner.
  evidence:
  - reference: PMID:22934315
    reference_title: "CSF1R-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Early-onset CSF1R-related disorder is typically caused by biallelic pathogenic variants and inherited in an autosomal recessive manner."
    explanation: >
      GeneReviews documents autosomal recessive inheritance for biallelic
      CSF1R-related disorder.

prevalence:
- population: General population (estimated point prevalence)
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_low: 3.0
  rate_high: 7.5
  notes: >
    Estimated point prevalence of CSF1R-related adult-onset leukoencephalopathy
    with axonal spheroids and pigmented glia (CSF1R-ALSP) is 30 to 75 cases per
    million (3.0 to 7.5 per 100,000), and CSF1R pathogenic variants may account
    for up to 25% of adult-onset leukoencephalopathies.
  evidence:
  - reference: PMID:37349768
    reference_title: "Brain abnormalities, neurodegeneration, and dysosteosclerosis (BANDDOS): new cases, systematic literature review, and associations with CSF1R-ALSP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As of January 2023, approximately 300 cases of CSF1R-ALSP were reported, but with genetic testing available commercially, the disease is increasingly recognized, and at present, the prevalence is estimated at 30–75 cases/million [1]."
    explanation: >
      Reports the estimated point prevalence of 30 to 75 cases per million for
      CSF1R-ALSP.
  - reference: PMID:37349768
    reference_title: "Brain abnormalities, neurodegeneration, and dysosteosclerosis (BANDDOS): new cases, systematic literature review, and associations with CSF1R-ALSP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the colony-stimulating factor-1 receptor (CSF1R) gene may account for up to 25% of adult-onset leukoencephalopathies"
    explanation: >
      Documents the proportion of adult-onset leukoencephalopathies attributable
      to CSF1R variants.
- population: Published literature cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: RARE
  notes: >
    Approximately 500 individuals with CSF1R-related disorder have been reported
    in the medical literature, with substantial underascertainment due to
    clinical overlap with more common neurological disorders.
  evidence:
  - reference: PMID:22934315
    reference_title: "CSF1R-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "About 500 individuals with CSF1R-related disorder have been reported to date."
    explanation: >
      GeneReviews documents approximately 500 reported individuals worldwide.

progression:
- phase: Adult symptom onset
  age_range: 40s-50s (mean ~43 years)
  notes: >
    Patients typically present in the fourth to fifth decade of life (average
    age at onset 43 years) with a frontotemporal dementia-like neuropsychiatric
    phenotype or pyramidal and extrapyramidal motor symptoms. Women tend to
    develop clinical symptoms at a younger age than men. White matter MRI
    abnormalities and periventricular calcifications can precede clinical onset
    by several years.
  evidence:
  - reference: PMID:30429277
    reference_title: "CSF1R-related leukoencephalopathy: A major player in primary microgliopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Typically, patients present with frontotemporal dementia-like phenotype in their 40s-50s, accompanied by motor symptoms, including pyramidal and extrapyramidal signs. Women tend to develop the clinical symptoms at a younger age than men."
    explanation: >
      Establishes typical onset in the 40s-50s and earlier symptom onset in
      women.
  - reference: PMID:31775912
    reference_title: "An AARS variant as the likely cause of Swedish type hereditary diffuse leukoencephalopathy with spheroids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Both have adult onset, with average age at HDLS/ALSP onset of 43 years and average age at onset for HDLS-S of 40; and average age at death of 53 and 55 years, respectively."
    explanation: >
      Documents mean age at onset of 43 years and mean age at death of 53 years
      for CSF1R-related HDLS/ALSP.
- phase: Rapid neurodegenerative progression and terminal vegetative state
  age_range: Mean age at death ~53 years
  duration: ~10 years (difference between mean onset at 43 years and mean death at 53 years)
  notes: >
    Following symptom onset, cognitive and motor decline progress rapidly.
    Affected individuals lose speech and ambulation, become bedridden with
    spasticity and rigidity, and progress to a terminal vegetative state with
    primitive reflexes; death most commonly results from pneumonia or other
    intercurrent infections at an average age of 53 years. The ~10-year
    duration reflects the difference between the reported average age at onset
    (43 years) and average age at death (53 years) in PMID:31775912.
  evidence:
  - reference: PMID:22934315
    reference_title: "CSF1R-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most affected individuals eventually become bedridden with spasticity, rigidity, and loss of the ability to walk. They lose speech and voluntary movement and appear to be generally unaware of their surroundings. The last stage of disease progresses to a vegetative state with presence of primitive reflexes, such as visual and tactile grasp, mouth-opening reflex, and sucking reflex. Death most commonly results from pneumonia or other infections."
    explanation: >
      GeneReviews details the progression to bedridden status, loss of speech
      and voluntary movement, terminal vegetative state, and death from
      pneumonia or other infections.
  - reference: PMID:31775912
    reference_title: "An AARS variant as the likely cause of Swedish type hereditary diffuse leukoencephalopathy with spheroids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Both have adult onset, with average age at HDLS/ALSP onset of 43 years and average age at onset for HDLS-S of 40; and average age at death of 53 and 55 years, respectively."
    explanation: >
      Establishes the ~10-year difference between average age at onset (43
      years) and average age at death (53 years) in CSF1R-related HDLS/ALSP.

diagnosis:
- name: CSF1R Molecular Genetic Testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >
    Definitive diagnosis of CSF1R-related disorder is established in a proband
    with suggestive clinical and neuroimaging findings by identifying a
    heterozygous CSF1R pathogenic variant (typically in the intracellular
    tyrosine kinase domain encoded by exons 12-21 in adult-onset ALSP/HDLS) or
    biallelic CSF1R pathogenic variants (in BANDDOS) on molecular genetic
    testing.
  results: >
    Identification of a heterozygous or biallelic pathogenic variant in CSF1R
    confirms the diagnosis of CSF1R-related leukoencephalopathy.
  evidence:
  - reference: PMID:22934315
    reference_title: "CSF1R-Related Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of CSF1R-related disorder is established in a proband with suggestive findings and a heterozygous CSF1R pathogenic variant or biallelic CSF1R pathogenic variants identified by molecular genetic testing."
    explanation: >
      GeneReviews defines molecular genetic testing of CSF1R as the diagnostic
      standard for CSF1R-related disorder.
- name: Brain MRI and CT Neuroimaging
  diagnosis_term:
    preferred_term: neuroimaging
    term:
      id: NCIT:C173635
      label: Neuroimaging
  description: >
    Brain MRI evaluates characteristic bilateral frontoparietal and
    periventricular T2/FLAIR white matter hyperintensities, early thinning of
    the corpus callosum, and persistent diffusion-restricted white matter
    lesions on diffusion-weighted imaging; non-contrast head CT is used to
    detect punctate periventricular ("stepping-stone") calcifications in the
    frontal white matter adjacent to the lateral ventricles.
  results: >
    White matter hyperintensities with corpus callosum thinning and
    diffusion-restricted lesions on brain MRI, accompanied by punctate
    periventricular calcifications on head CT, are neuroradiological hallmarks
    that prioritize CSF1R genetic testing.
  evidence:
  - reference: PMID:30429277
    reference_title: "CSF1R-related leukoencephalopathy: A major player in primary microgliopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "On brain imaging, in addition to white matter abnormalities, thinning of the corpus callosum, diffusion-restricted lesions in the white matter, and brain calcifications are hallmarks."
    explanation: >
      Establishes the hallmark neuroimaging triad of white matter abnormalities
      with callosal thinning, diffusion-restricted white matter lesions, and
      brain calcifications.
  - reference: PMID:34145972
    reference_title: "Modeling CSF-1 receptor deficiency diseases - how close are we?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Small spotty calcifications that are preferentially distributed in the frontal white matter adjacent to the horns of the lateral ventricles have been frequently reported in CT scans of CRL patients (35 out of 57 investigated cases, Table 4)."
    explanation: >
      Documents the utility of head CT for detecting characteristic punctate
      periventricular frontal white matter calcifications.


pathophysiology:
- name: Impaired Microglial CSF1R Signaling
  description: >
    CSF1R encodes the colony-stimulating factor 1 receptor, a receptor tyrosine
    kinase expressed predominantly on microglia. Disease-causing variants
    cluster in the intracellular tyrosine kinase domain and abolish
    CSF-1-stimulated receptor autophosphorylation, producing loss of kinase
    activity via haploinsufficiency or dominant-negative inhibition of wild-type
    receptor dimers. Because CSF1R is the primary regulator of microglial
    proliferation, survival, and differentiation, impaired CSF1R signaling
    initiates a primary microgliopathy.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: CSF1R
    term:
      id: hgnc:2433
      label: CSF1R
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  biological_processes:
  - preferred_term: macrophage colony-stimulating factor signaling pathway
    term:
      id: GO:0038145
      label: macrophage colony-stimulating factor signaling pathway
    modifier: DECREASED
  molecular_functions:
  - preferred_term: macrophage colony-stimulating factor receptor activity
    term:
      id: GO:0005011
      label: macrophage colony-stimulating factor receptor activity
    modifier: DECREASED
  evidence:
  - reference: PMID:22197934
    reference_title: "Mutations in the colony stimulating factor 1 receptor (CSF1R) gene cause hereditary diffuse leukoencephalopathy with spheroids."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro, CSF-1 stimulation resulted in rapid autophosphorylation of selected tyrosine residues in the kinase domain of wild-type but not mutant CSF1R, suggesting that HDLS may result from partial loss of CSF1R function."
    explanation: >
      The discovery paper shows that HDLS-causing CSF1R mutations abolish
      CSF-1-stimulated autophosphorylation, establishing partial loss of CSF1R
      function as the molecular lesion.
  - reference: PMID:22197934
    reference_title: "Mutations in the colony stimulating factor 1 receptor (CSF1R) gene cause hereditary diffuse leukoencephalopathy with spheroids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As CSF1R is a crucial mediator of microglial proliferation and differentiation in the brain, our findings suggest an important role for microglial dysfunction in HDLS pathogenesis."
    explanation: >
      Links impaired CSF1R signaling to microglial dysfunction as the central
      pathogenic mechanism.
  downstream:
  - target: Microglial Dyshomeostasis and Depletion
    causal_link_type: DIRECT
    description: >
      Loss of CSF1R tyrosine kinase signaling directly impairs microglial
      trophic survival and proliferation, causing progressive microglial
      depletion, dystrophic morphology, and accumulation of lipid- and
      iron-laden pigmented glia.
    evidence:
    - reference: PMID:30429277
      reference_title: "CSF1R-related leukoencephalopathy: A major player in primary microgliopathies."
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: "Given that CSF1R mainly expresses in microglia, CSF1R-related leukoencephalopathy is representative of primary microgliopathies"
      explanation: >
        Establishes that microglial CSF1R loss of function directly produces a
        primary microgliopathy.
  - target: Elevated Cerebral CSF2 Signaling
    causal_link_type: DIRECT
    description: >
      Reduced CSF-1R signaling disrupts the homeostatic balance between CSF-1R
      and CSF-2R signaling in microglia, driving compensatory upregulation of
      cerebral CSF-2 (GM-CSF) transcripts and downstream CSF-2 target genes.
    evidence:
    - reference: PMID:32130903
      reference_title: "Microglial Homeostasis Requires Balanced CSF-1/CSF-2 Receptor Signaling."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We also show elevation of Csf2 transcripts and of several CSF-2 downstream targets in the brains of ALSP patients, demonstrating that the mechanisms identified in the mouse model are functional in humans."
      explanation: >
        Demonstrates that CSF1R deficiency leads to elevated cerebral CSF2
        signaling in human ALSP brains and mouse models.

- name: Microglial Dyshomeostasis and Depletion
  description: >
    Impaired CSF1R signaling causes a primary microgliopathy characterized by
    loss of homeostatic P2RY12-positive microglia, regional microglial
    attrition in subcortical white matter, and transformation of surviving
    microglia into dystrophic, CD68/CD163-positive, PAS- and iron-positive
    pigmented glia containing lipofuscin and ceroid bodies. Depletion of
    homeostatic microglia removes essential trophic support and myelin-debris
    clearance in cerebral white matter.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
    modifier: ABNORMAL
  biological_processes:
  - preferred_term: microglial cell proliferation
    term:
      id: GO:0061518
      label: microglial cell proliferation
    modifier: DECREASED
  - preferred_term: microglial cell activation
    term:
      id: GO:0001774
      label: microglial cell activation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:38897209
    reference_title: "Therapeutic potential of human microglia transplantation in a chimeric model of CSF1R-related leukoencephalopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we generated a xenotolerant mouse model lacking the fms-intronic regulatory element (FIRE) enhancer within Csf1r, which develops nearly all the hallmark pathologies associated with ALSP"
    explanation: >
      Selective genetic depletion of microglia via Csf1r FIRE-enhancer deletion
      recapitulates hallmark ALSP neuropathology, proving that microglial
      depletion/dysfunction drives the disease cascade.
  - reference: PMID:34145972
    reference_title: "Modeling CSF-1 receptor deficiency diseases - how close are we?"
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Consistent with this, other studies showed a patchy distribution of Iba1 and P2ry12 positive homeostatic microglia, which were more abundant in relatively preserved areas, but sparse in devastated areas"
    explanation: >
      Documents the patchy loss of homeostatic (P2RY12+) microglia in devastated
      white matter areas of human ALSP brains.
  downstream:
  - target: Primary Axonal Degeneration and Spheroid Formation
    causal_link_type: DIRECT
    description: >
      Loss of homeostatic microglial trophic support and clearance function
      triggers neuroaxonal transport failure, axonal swelling, and accumulation
      of neurofilament- and APP-positive axonal spheroids in cerebral white
      matter.
    evidence:
    - reference: PMID:38897209
      reference_title: "Therapeutic potential of human microglia transplantation in a chimeric model of CSF1R-related leukoencephalopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "transplantation of human induced pluripotent stem cell (iPSC)-derived microglial (iMG) progenitors restores a homeostatic microglial signature and prevents the development of axonal spheroids, white matter abnormalities, reactive astrocytosis, and brain calcifications"
      explanation: >
        Restoring homeostatic microglia prevents axonal spheroid formation,
        establishing a direct causal link from microglial loss/dyshomeostasis to
        axonal spheroids.
  - target: Reactive Astrocytosis
    causal_link_type: DIRECT
    description: >
      Microglial depletion and dyshomeostasis induce pro-inflammatory chemokine
      release (CCL2/MCP-1) and reactive GFAP-positive astrogliosis in cerebral
      white matter.
    evidence:
    - reference: PMID:38897209
      reference_title: "Therapeutic potential of human microglia transplantation in a chimeric model of CSF1R-related leukoencephalopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "transplantation of CRISPR-corrected ALSP-patient-derived iMG reverses pre-existing spheroids, astrogliosis, and calcification pathologies"
      explanation: >
        Reversal of astrogliosis upon microglial restoration establishes that
        microglial dyshomeostasis directly drives reactive astrocytosis.
  - target: Periventricular Dystrophic Calcification
    causal_link_type: DIRECT
    description: >
      Loss of homeostatic microglial clearance of calcium phosphate precipitates
      leads to dystrophic calcification in periventricular white matter.
    evidence:
    - reference: PMID:38897209
      reference_title: "Therapeutic potential of human microglia transplantation in a chimeric model of CSF1R-related leukoencephalopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "transplantation of CRISPR-corrected ALSP-patient-derived iMG reverses pre-existing spheroids, astrogliosis, and calcification pathologies"
      explanation: >
        Reversal of brain calcifications upon microglial restoration establishes
        that microglial dyshomeostasis directly drives dystrophic calcification.

- name: Elevated Cerebral CSF2 Signaling
  description: >
    In CSF1R-haploinsufficient brains, reduced CSF-1R signaling disrupts the
    homeostatic balance between CSF-1R and CSF-2R signaling, resulting in
    elevated cerebral CSF-2 (GM-CSF) transcripts and increased expression of
    CSF-2 downstream target genes in microglia.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  evidence:
  - reference: PMID:32130903
    reference_title: "Microglial Homeostasis Requires Balanced CSF-1/CSF-2 Receptor Signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also show elevation of Csf2 transcripts and of several CSF-2 downstream targets in the brains of ALSP patients, demonstrating that the mechanisms identified in the mouse model are functional in humans."
    explanation: >
      Confirms elevated CSF2 transcripts and downstream target expression in
      post-mortem human ALSP brains.
  - reference: PMID:32130903
    reference_title: "Microglial Homeostasis Requires Balanced CSF-1/CSF-2 Receptor Signaling."

    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      proteasome activity was reduced, and augmentation of insoluble ubiquitinated protein was observed.
    explanation: >-
      The measurement of accumulated insoluble ubiquitinated protein this node
      records.
  downstream:
  - target: Neuronal Proteostasis Failure
    description: >-
      Neurons are the cell type least able to tolerate a fall in degradative
      capacity, having no route to dilute an undegraded burden by division.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18701681
      reference_title: >-
        Depletion of 26S proteasomes in mouse brain neurons causes neurodegeneration and Lewy-like inclusions resembling human pale bodies.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Impairment of specifically ubiquitin-mediated protein degradation caused intraneuronal Lewy-like inclusions and extensive neurodegeneration in the nigrostriatal pathway and forebrain regions.
      explanation: >-
        Impairing ubiquitin-mediated degradation in mouse neurons alone is
        sufficient to cause inclusion formation and neurodegeneration. It is a
        conditional null in adult mouse neurons, not the human hypomorphic
        allele in development, so the step is inferred.
- name: Neuronal Proteostasis Failure
  biological_scale: CELLULAR
  description: >-
    Loss of proteostatic capacity in neurons, the node from which the
    clinical neurological phenotype is drawn. The evidence that neurons
    specifically depend on the 26S proteasome is the mouse conditional
    knockout; the evidence that this disease produces a neurological
    phenotype is clinical. The step between them is not directly
    demonstrated, so every edge out of this node is graded INDIRECT.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:18701681
    reference_title: >-
      Depletion of 26S proteasomes in mouse brain neurons causes neurodegeneration and Lewy-like inclusions resembling human pale bodies.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      PSMC1 is an essential subunit of the 26S proteasome and Psmc1 conditional knock-out mice display 26S proteasome depletion in targeted neurons, in which the 20S proteasome is not affected.
    explanation: >-
      Establishes that PSMC1 is required for the 26S holoenzyme specifically,
      with the 20S core left intact when it is removed from neurons.
  - reference: PMID:18701681
    reference_title: >-
      Depletion of 26S proteasomes in mouse brain neurons causes neurodegeneration and Lewy-like inclusions resembling human pale bodies.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The model demonstrates that 26S proteasomes are necessary for normal neuronal homeostasis and that 20S proteasome activity is insufficient for neuronal survival.
    explanation: >-
      States the conclusion this node encodes: 26S function is required for
      neuronal homeostasis and residual 20S activity does not substitute for
      it.

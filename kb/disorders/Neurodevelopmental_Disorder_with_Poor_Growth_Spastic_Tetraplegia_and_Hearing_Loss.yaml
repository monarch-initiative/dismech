classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:35861243
      reference_title: >-
        PSMC1 variant causes a novel neurological syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We now delineate an autosomal recessive syndrome of failure to thrive, severe developmental delay and intellectual disability, spastic tetraplegia with central hypotonia, chorea, hearing loss, micropenis and undescended testes, as well as mild elevation of liver enzymes.
      explanation: >-
        The defining manifestations are neurological - severe developmental delay,
        intellectual disability, spastic tetraplegia, central hypotonia and chorea
        - which places the entry in the neurologic chapter.
  mechanistic_category:
  - classification_value: proteotoxic disease
    notes: >-
      Assigned on the degradation side of proteostasis: the lesion is in the
      proteasome's own unfolding motor, not in an aggregation-prone client
      protein. No aggregation, stress-response or interferon-signature data
      exist for PSMC1-mutant human cells, so the classification rests on the
      class-level characterisation of proteasomopathies plus the
      ubiquitinated-protein accumulation seen on Rpt2 knockdown in flies.
    evidence:
    - reference: PMID:42370079
      reference_title: >-
        Molecular mechanisms in rare proteasomopathies.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The concomitant proteasome impairment leads to imbalanced protein homeostasis by dysfunctional ubiquitin-mediated protein degradation.
      explanation: >-
        Establishes that proteasomopathies as a class act through failure of
        ubiquitin-mediated protein homeostasis. The statement is class-level
        rather than PSMC1-specific.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All three affected siblings are homozygous for the PSMC1 p.I328T variant and
    both parents are unaffected obligate heterozygotes. Heterozygous carriers in
    this kindred had no phenotype, and the authors conclude that heterozygous
    loss of PSMC1 function is likely to be clinically silent in humans.
  evidence:
  - reference: PMID:35861243
    reference_title: >-
      PSMC1 variant causes a novel neurological syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The missense variant in PSMC1 was demonstrated via RFLP and Sanger sequencing to fully segregate within the family as expected for recessive heredity
    explanation: >-
      Segregation analysis in the kindred, by two independent methods, matches
      autosomal recessive inheritance.
  - reference: PMID:35861243
    reference_title: >-
      PSMC1 variant causes a novel neurological syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      it is extremely likely that heterozygous loss of function of PSMC1 results in no discernible phenotype in humans
    explanation: >-
      The authors' conclusion that carriers are unaffected, drawn from the
      unaffected obligate carriers in this kindred together with published
      14q32.11 deletion carriers. It is an inference from small numbers, not a
      carrier study.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Three affected individuals, all siblings among the ten offspring of one
    consanguineous Bedouin Israeli couple. No further families have been
    reported and no population-based prevalence or incidence estimate exists, so
    no numeric rate is asserted here. The variant was absent from 84 screened
    members of the same tribe and from 553 in-house exomes, so it is not even a
    detectable founder allele in that population.
  evidence:
  - reference: PMID:35861243
    reference_title: >-
      PSMC1 variant causes a novel neurological syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three of the 10 offspring of healthy consanguineous parents of Bedouin Israeli ancestry
    explanation: >-
      Gives the case count and the single-kindred, consanguineous ascertainment
      behind this literature-count-only occurrence measure.
  - reference: PMID:35861243
    reference_title: >-
      PSMC1 variant causes a novel neurological syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Screening of 84 nonaffected individuals belonging to the same tribe of this family was performed by RFLP and did not identify any homozygous or heterozygous carriers of the PSMC1 variant.
    explanation: >-
      Ethnically matched carrier screening found no further carriers, arguing
      against an appreciable founder frequency.
- population: Neurodevelopmental proteasomopathies overall
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Class-level context rather than an estimate for this entity: a 2024 review
    counted 78 reported patients across all neurodevelopmental
    proteasomopathies, of whom only 8 had biallelic PSMB1, PSMC1 or PSMC3
    variants. This entry's three patients sit inside that recessive minority.
  evidence:
  - reference: PMID:39220754
    reference_title: >-
      Understanding neurodevelopmental proteasomopathies as new rare disease entities: A review of current concepts, molecular biomarkers, and perspectives.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recessive forms, reported in 8/78 patients with PSMB1, PSMC1, or PSMC3 biallelic variants, represent only 10% of neurodevelopmental proteasomopathies.
    explanation: >-
      The review's own count of the recessive subset of the disease class, which
      frames how few PSMC1 patients exist.
pathophysiology:
- name: Biallelic PSMC1 p.I328T Substitution
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. The homozygous PSMC1 missense variant NM_002802.3
    c.983T>C p.(Ile328Thr) - numbered p.I255T on the shorter NM_001330212.1
    transcript - was the only plausible rare homozygous change in the single
    1.14 Mb autozygous interval shared by the three affected siblings on
    chromosome 14, and it is absent from public and in-house control
    databases.
  genes:
  - preferred_term: PSMC1
    term:
      id: hgnc:9547
      label: PSMC1
  evidence:
  - reference: PMID:35861243
    reference_title: >-
      PSMC1 variant causes a novel neurological syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygosity mapping combined with exome sequencing revealed a disease-associated p.I328T PSMC1 variant.
    explanation: >-
      Names the variant and the mapping strategy that identified it.
  - reference: PMID:35861243
    reference_title: >-
      PSMC1 variant causes a novel neurological syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      haplotype of a chromosome 14 locus between SNPs rs10083415 and rs1286459 (positioned, respectively, at 89464163 and 90608806 in the GRCh38/Hg38 assembly), segregated within the family as expected for autosomal recessive heredity.
    explanation: >-
      Defines the single autozygous interval within which the variant was the
      candidate, and confirms recessive segregation of the haplotype.
  - reference: PMID:35861243
    reference_title: >-
      PSMC1 variant causes a novel neurological syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The variant was not found in our 553 WES database (mainly of the Bedouin community) nor in public databases (1000 Genomes, gnomAD, and AFC).
    explanation: >-
      Absence from in-house and public population databases, which is part of
      why this variant rather than the co-located TTC7B variant was pursued.
  downstream:
  - target: Destabilised PSMC1 AAA+ ATPase Fold
    description: >-
      The substitution replaces a buried isoleucine with a hydrophilic
      threonine inside the AAA+ motor domain, so the primary consequence is on
      the fold of the ATPase itself rather than on its expression level.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35861243
      reference_title: >-
        PSMC1 variant causes a novel neurological syndrome.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        Protein modeling demonstrated that the PSMC1 variant is located at the highly conserved putative ATP binding and hydrolysis domain, and is suggested to interrupt a hydrophobic core within the protein.
      explanation: >-
        Structural modelling locates the substituted residue in the conserved
        ATP binding and hydrolysis domain and predicts hydrophobic-core
        disruption.
- name: Destabilised PSMC1 AAA+ ATPase Fold
  biological_scale: MOLECULAR
  description: >-
    Rpt2/PSMC1 is one of the six AAA+ ATPases that form the base ring of the
    19S regulatory particle and provide the mechanical work of substrate
    engagement, unfolding and translocation into the 20S core. p.I328 lies
    within the hydrophobic core of the motor domain, so replacing it is
    expected to perturb the folded structure of the ring subunit. No
    biochemical measurement of ATPase activity in patient material has been
    reported, so this node is supported by structural prediction plus the in
    vivo rescue result, not by a direct assay.
  molecular_functions:
  - preferred_term: AAA+ ATPase activity of the 19S base
    term:
      id: GO:0016887
      label: ATP hydrolysis activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: 19S regulatory particle
    term:
      id: GO:0022624
      label: proteasome accessory complex
  evidence:
  - reference: PMID:35861243
    reference_title: >-
      PSMC1 variant causes a novel neurological syndrome.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Protein modeling demonstrated that the PSMC1 variant is located at the highly conserved putative ATP binding and hydrolysis domain, and is suggested to interrupt a hydrophobic core within the protein.
    explanation: >-
      Places the residue in the conserved ATP binding and hydrolysis domain.
  - reference: PMID:35861243
    reference_title: >-
      PSMC1 variant causes a novel neurological syndrome.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      The p.I328, mutated in the affected individuals, is part of the hydrophobic core of PSMC1; therefore, it is expected that its substitution by the hydrophilic threonine will affect the collapse of the core and, as a result, the structure of the protein.
    explanation: >-
      States the predicted structural mechanism: loss of a buried hydrophobic
      side chain destabilises the fold.
  downstream:
  - target: Reduced 26S Proteasome Proteolytic Capacity
    description: >-
      A partly non-functional motor subunit lowers, but does not abolish, the
      proteolytic throughput of the 26S proteasome. The in vivo rescue assay
      is what fixes the direction and the magnitude: human wild-type PSMC1
      nearly fully rescued an Rpt2-depletion phenotype while the mutant
      rescued it only partly.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35861243
      reference_title: >-
        PSMC1 variant causes a novel neurological syndrome.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Fruit flies in which we silenced the Drosophila ortholog Rpt2 specifically in the eye exhibited an apparent phenotype that was highly rescued by the human wild-type PSMC1, yet only partly by the mutant PSMC1, proving the functional effect of the p.I328T disease-causing variant.
      explanation: >-
        A cross-species complementation assay in fly eye, not a proteasome assay
        in patient cells, so the loss of function is inferred from incomplete
        rescue.
- name: Reduced 26S Proteasome Proteolytic Capacity
  biological_scale: MOLECULAR
  description: >-
    Reduced ubiquitin-dependent degradation through the 26S holoenzyme. This
    is the shared node of the neurodevelopmental proteasomopathies: lesions
    in the 20S core (PSMB1), the 19S lid (PSMD12) and the 19S base (PSMC1,
    PSMC3) all converge here. The deficit in this disease is partial - a
    complete loss of the orthologue is lethal in mice and in worms - which
    is why a viable human phenotype exists at all.
  biological_processes:
  - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: DECREASED
  cellular_components:
  - preferred_term: 26S proteasome
    term:
      id: GO:0000502
      label: proteasome complex
  evidence:
  - reference: PMID:35861243
    reference_title: >-
      PSMC1 variant causes a novel neurological syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      proteasome activity was reduced, and augmentation of insoluble ubiquitinated protein was observed.
    explanation: >-
      Direct measurement of reduced proteasome activity on knockdown of the
      PSMC1 orthologue in the fly central nervous system, reported in this
      paper as the basis for its own model choice.
  - reference: PMID:42370079
    reference_title: >-
      Molecular mechanisms in rare proteasomopathies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The concomitant proteasome impairment leads to imbalanced protein homeostasis by dysfunctional ubiquitin-mediated protein degradation.
    explanation: >-
      Class-level statement that proteasomopathies act by dysfunctional
      ubiquitin-mediated degradation.
  - reference: PMID:35861243
    reference_title: >-
      PSMC1 variant causes a novel neurological syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Knock‐out of the PSMC1 ortholog in mice was shown to be embryonic lethal.
    explanation: >-

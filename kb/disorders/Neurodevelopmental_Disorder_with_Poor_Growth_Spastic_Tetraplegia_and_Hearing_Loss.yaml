- name: Accumulation of Ubiquitinated Substrates
  biological_scale: CELLULAR
  description: >-
    Failure to clear polyubiquitinated proteins. In flies this is measurable
    as an increase in insoluble ubiquitinated protein after Rpt2 knockdown;
    in mice, neuron-restricted loss of Psmc1 produces frank ubiquitin- and
    alpha-synuclein-positive intraneuronal inclusions. Neither observation
    has yet been made in cells carrying the human p.I328T allele.
  biological_processes:
  - preferred_term: ubiquitin-dependent protein catabolic process
    term:
      id: GO:0006511
      label: ubiquitin-dependent protein catabolic process
    modifier: DECREASED
  evidence:
  - reference: PMID:35861243
    reference_title: >-

  downstream:
  - target: Accumulation of Ubiquitinated Substrates
    description: >-
      Substrates tagged for degradation are not cleared, so polyubiquitinated
      protein accumulates in an insoluble fraction.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35861243
      reference_title: >-

genetic:
- name: PSMC1
  gene_term:
    preferred_term: PSMC1
    term:
      id: hgnc:9547
      label: PSMC1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    PSMC1 (14q32.11) encodes Rpt2, one of the six paralogous AAA+ ATPases
    forming the base of the 19S regulatory particle. A single pathogenic
    allele has been reported, the homozygous missense c.983T>C
    p.(Ile328Thr). The gene is highly intolerant of variation (pLI 1,
    missense Z 3.95) and no homozygous loss-of-function allele is recorded
    in gnomAD, consistent with a hypomorphic rather than a null mechanism in
    this disease.
  evidence:
  - reference: PMID:35861243
    reference_title: >-
      PSMC1 variant causes a novel neurological syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygosity mapping combined with exome sequencing revealed a disease-associated p.I328T PSMC1 variant.
    explanation: >-
      Establishes the gene-disease relationship and the mapping that produced
      it.
  - reference: PMID:39220754
    reference_title: >-
      Understanding neurodevelopmental proteasomopathies as new rare disease entities: A review of current concepts, molecular biomarkers, and perspectives.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a total of six neurodevelopmental proteasomopathies have been described, involving the four subunits PSMB1/β6, PSMC1/Rpt2, PSMC3/Rpt5, and PSMD12/Rpn5
    explanation: >-
      Confirms PSMC1/Rpt2 as one of the four proteasome subunits implicated in
      neurodevelopmental proteasomopathies, independently of the founding
      report.
  variants:
  - name: PSMC1 c.983T>C p.(Ile328Thr)
    description: >-
      Homozygous missense substitution in PSMC1 (NM_002802.3; equivalently
      c.764T>C p.I255T on NM_001330212.1), the only allele reported for this
      disorder. It lies in the conserved AAA+ ATP binding and hydrolysis
      domain, within a buried hydrophobic core, and was absent from 553
      in-house exomes, from 1000 Genomes, gnomAD and AFC, and from 84 screened
      members of the same tribe.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:35861243
      reference_title: >-
        PSMC1 variant causes a novel neurological syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Fruit flies in which we silenced the Drosophila ortholog Rpt2 specifically in the eye exhibited an apparent phenotype that was highly rescued by the human wild-type PSMC1, yet only partly by the mutant PSMC1, proving the functional effect of the p.I328T disease-causing variant.
      explanation: >-
        The cross-species rescue experiment the authors present as proof of the
        variant's functional effect.
    - reference: PMID:35861243
      reference_title: >-
        PSMC1 variant causes a novel neurological syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The variant was not found in our 553 WES database (mainly of the Bedouin community) nor in public databases (1000 Genomes, gnomAD, and AFC).
      explanation: >-
        Population-database absence supporting the pathogenic classification.
animal_models:
- name: Drosophila Rpt2 eye knockdown with human PSMC1 rescue
  species: Fruit fly
  genotype: GMR-Gal4 driven UAS-Rpt2-RNAi, rescued with UAS-PSMC1 wild-type or UAS-PSMC1-I255T
  category: Cross-species complementation assay
  publication: PMID:35861243
  description: >-
    The functional assay on which the gene-disease claim rests. Rpt2 is the
    fly orthologue of PSMC1 and is 91% identical to the human protein.
    Silencing it in the eye produces a severe degenerative eye phenotype;
    the assay then asks whether a human PSMC1 transgene can rescue it, and
    compares wild-type with the patient allele.
  modeled_mechanisms:
  - target: Reduced 26S Proteasome Proteolytic Capacity
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Eye-specific RNAi depletes the fly orthologue of PSMC1, creating the
      loss of 26S function that the human allele is proposed to cause
      partially. The rescue arm then reads out how much function the patient
      allele retains.
    limitations: >-
      The perturbation is RNAi knockdown of the orthologue, not the missense
      allele in its native locus, and the readout tissue is the compound eye
      rather than neurons. Ommatidial fusion and depigmentation have no human
      counterpart, so the assay reports residual protein function and not the
      disease phenotype. Rescue was scored morphologically; no proteasome
      activity or ubiquitin-conjugate measurement was made in the rescued
      flies.
    readouts:
    - name: Adult eye morphology after eye-specific Rpt2 silencing
      target: Reduced 26S Proteasome Proteolytic Capacity
      direction: ALTERED
      interpretation: >-
        Establishes that the orthologue is required, and defines the phenotype
        that the rescue arm scores against.
      evidence:
      - reference: PMID:35861243
        reference_title: >-
          PSMC1 variant causes a novel neurological syndrome.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Silencing Rpt2 specifically in the eye using GMR‐Gal4 resulted in a severe eye phenotype, including depigmentation, necrosis, disorganization of ommatidia, fusion of ommatidia, irregularity of ommatidia shape and size, and loss of interommatidial bristles
        explanation: >-
          Enumerates the eye phenotype produced by silencing the orthologue.
    - name: Rescue of the Rpt2-RNAi eye phenotype by human PSMC1 transgenes
      target: Reduced 26S Proteasome Proteolytic Capacity
      direction: RESTORED
      interpretation: >-
        Wild-type human PSMC1 nearly fully rescues while the patient allele
        rescues only partly, so p.I328T is a partial rather than complete loss
        of function. This is the single result that separates a hypomorph from a
        null in this disease.
      evidence:
      - reference: PMID:35861243
        reference_title: >-
          PSMC1 variant causes a novel neurological syndrome.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Fruit flies in which we silenced the Drosophila ortholog Rpt2 specifically in the eye exhibited an apparent phenotype that was highly rescued by the human wild-type PSMC1, yet only partly by the mutant PSMC1, proving the functional effect of the p.I328T disease-causing variant.
        explanation: >-
          States the differential rescue by wild-type versus mutant human PSMC1.
      - reference: PMID:35861243
        reference_title: >-
          PSMC1 variant causes a novel neurological syndrome.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          expression of PSMC1‐MUT failed to rescue fusion of ommatidia and extended ommatidia defects and anomalies
        explanation: >-
          Specifies which components of the eye phenotype the mutant transgene
          failed to rescue.
    evidence:
    - reference: PMID:35861243
      reference_title: >-
        PSMC1 variant causes a novel neurological syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Fruit flies in which we silenced the Drosophila ortholog Rpt2 specifically in the eye exhibited an apparent phenotype that was highly rescued by the human wild-type PSMC1, yet only partly by the mutant PSMC1, proving the functional effect of the p.I328T disease-causing variant.
      explanation: >-
        Establishes the assay as informative for residual PSMC1 function, which
        is what this node encodes.
- name: Psmc1 neuron-restricted conditional knockout mouse
  species: Mouse
  genotype: Psmc1 (Rpt2/S4) conditional knockout, Cre/loxP inactivation restricted to substantia nigra or forebrain neurons
  category: Conditional loss-of-function model
  publication: PMID:18701681
  description: >-
    A neuron-restricted conditional null generated to model Parkinson
    disease, not this syndrome. It is curated here because it is the only in
    vivo demonstration that neurons specifically require the 26S proteasome,
    and because the germline null is embryonic lethal, so it is the only
    mammalian route to the question.
  modeled_mechanisms:
  - target: Neuronal Proteostasis Failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Removing Psmc1 from neurons depletes the 26S proteasome while leaving
      the 20S core intact, and is sufficient on its own to cause inclusion
      pathology and neurodegeneration - which is the claim this node makes
      about neuronal dependence on 26S function.
    limitations: >-
      Genotype mismatch in both direction and timing: a complete conditional
      null in defined postnatal neuronal populations, against a germline
      hypomorphic missense present in every cell from conception. The output
      is adult-onset neurodegeneration with Lewy-like inclusions - a
      Parkinson-disease phenotype - whereas the human disease is a static,
      congenital neurodevelopmental one with no reported neurodegeneration or
      parkinsonism. Nothing in the model addresses hearing, growth, genital
      development or the liver findings. It supports the neuronal-dependence
      step only.
    readouts:
    - name: 26S proteasome content in targeted neurons
      target: Neuronal Proteostasis Failure
      direction: DECREASED
      interpretation: >-
        Confirms the intended lesion is specific to the 26S holoenzyme rather
        than to proteasome content generally.
      evidence:
      - reference: PMID:18701681
        reference_title: >-
          Depletion of 26S proteasomes in mouse brain neurons causes neurodegeneration and Lewy-like inclusions resembling human pale bodies.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          PSMC1 is an essential subunit of the 26S proteasome and Psmc1 conditional knock-out mice display 26S proteasome depletion in targeted neurons, in which the 20S proteasome is not affected.
        explanation: >-
          Reports the 26S depletion with the 20S core unaffected.
    - name: Intraneuronal inclusion pathology and neurodegeneration
      target: Neuronal Proteostasis Failure
      direction: INCREASED
      interpretation: >-
        The consequence of losing neuronal 26S function in vivo. Note this is
        degenerative pathology, not a developmental phenotype.
      evidence:
      - reference: PMID:18701681
        reference_title: >-
          Depletion of 26S proteasomes in mouse brain neurons causes neurodegeneration and Lewy-like inclusions resembling human pale bodies.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Impairment of specifically ubiquitin-mediated protein degradation caused intraneuronal Lewy-like inclusions and extensive neurodegeneration in the nigrostriatal pathway and forebrain regions.
        explanation: >-
          Reports the inclusion pathology and neurodegeneration measured in the
          model.
    evidence:
    - reference: PMID:18701681
      reference_title: >-
        Depletion of 26S proteasomes in mouse brain neurons causes neurodegeneration and Lewy-like inclusions resembling human pale bodies.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The model demonstrates that 26S proteasomes are necessary for normal neuronal homeostasis and that 20S proteasome activity is insufficient for neuronal survival.
      explanation: >-
        The authors' conclusion that 26S function is required for neuronal
        homeostasis, which is why the model is treated as informative for this
        node despite the genotype mismatch.
diagnosis:
- name: Exome sequencing with homozygosity mapping
  description: >-
    Diagnosis is molecular and genotype-first: biallelic PSMC1 variants. In
    the founding kindred, genome-wide linkage in twelve family members
    narrowed the locus to a single 1.14 Mb autozygous interval on chromosome
    14, and trio exome sequencing within it left PSMC1 as the only
    candidate. There are no consensus clinical diagnostic criteria, and the
    clinical picture - developmental delay, spastic tetraplegia, hearing
    loss - is shared with many genetically distinct disorders, so it cannot
    be diagnosed clinically.
  evidence:
  - reference: PMID:35861243
    reference_title: >-
      PSMC1 variant causes a novel neurological syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Homozygosity mapping combined with exome sequencing revealed a disease-associated p.I328T PSMC1 variant.
    explanation: >-
      Names the two methods by which the diagnosis was established.
  - reference: PMID:35861243
    reference_title: >-
      PSMC1 variant causes a novel neurological syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      haplotype of a chromosome 14 locus between SNPs rs10083415 and rs1286459 (positioned, respectively, at 89464163 and 90608806 in the GRCh38/Hg38 assembly), segregated within the family as expected for autosomal recessive heredity.
    explanation: >-
      Describes the autozygous interval that made the exome analysis
      tractable, the step specific to a consanguineous pedigree.
treatments:
- name: Supportive and Symptomatic Care
  description: >-
    No disease-modifying or mechanism-targeted therapy exists. Management is
    entirely supportive: developmental and rehabilitative therapy, audiological
    follow-up, nutritional support for the failure to thrive, and management of
    spasticity. Proteasome inhibitors used in oncology act in the direction
    opposite to what this mechanism would require and have no role here.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: >-
    Recorded without an evidence item. No publication describes management of
    this disorder; the founding report is a gene-discovery paper. Attaching a
    quoted snippet to a treatment claim here would overstate the literature.
- name: Gastrostomy Feeding
  description: >-
    Enteral nutrition delivered through a surgically placed gastrostomy tube.
    This is the only intervention actually documented in the affected
    individuals: the eldest was fed through a gastrostomy at 20 years, and the
    paper's per-patient table carries a PEG column, so percutaneous endoscopic
    gastrostomy was recorded as a clinical variable for this kindred rather
    than mentioned in passing. It is symptomatic, addressing the caloric
    consequence of the feeding failure and not the proteasome defect.
  action_category: THERAPEUTIC
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: gastrostomy tube feeding
    term:
      id: NCIT:C93322
      label: Enteral Tube Feeding
  target_mechanisms:
  - target: Failure to Thrive
    treatment_effect: BYPASSES
    description: >-
      Delivers calories by a route that does not depend on oral intake, so it
      mitigates the growth failure without altering anything upstream of it.
    evidence:
    - reference: PMID:35861243
      reference_title: >-
        PSMC1 variant causes a novel neurological syndrome.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        was fully nonambulatory, fed through gastrostomy, with severe failure to thrive
      explanation: >-
        Records the gastrostomy and the severe failure to thrive together in
        the same patient. The source does not report a growth response to
        feeding, so the benefit is inferred from the route rather than
        measured, hence INDIRECT.
  notes: >-
    therapeutic_modality is DEVICE rather than BEHAVIORAL. The coarse mapping
    in CLAUDE.md puts dietary intervention under BEHAVIORAL, but this is
    nutrition delivered through a surgically placed tube, not a change of diet
    or feeding behaviour, and BEHAVIORAL would misdescribe it.
  evidence:
  - reference: PMID:35861243
    reference_title: >-
      PSMC1 variant causes a novel neurological syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      was fully nonambulatory, fed through gastrostomy, with severe failure to thrive
    explanation: >-
      The direct documentation that this intervention was used in an affected
      individual, which is what distinguishes it from the standard-of-care
      entries around it.
  - reference: PMID:35861243
    reference_title: >-
      PSMC1 variant causes a novel neurological syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Abbreviations: n/a, data not available; PEG, percutaneous endoscopic gastrostomy.
    explanation: >-
      The legend of the per-patient phenotype table, which defines PEG as one
      of its recorded variables. It establishes that gastrostomy status was
      tracked for each patient rather than noted once; it is a legend and not a
      finding, so it is graded INDIRECT and carries no count.
- name: Physical Therapy
  description: >-
    Physiotherapy for spasticity, contracture prevention and postural management
    in non-ambulatory patients, following general practice for severe
    neurodevelopmental disability rather than any disorder-specific protocol.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  notes: >-
    Recorded without an evidence item. No management publication exists for
    this disorder and the founding report describes no physiotherapy for these
    patients; this is general practice for severe spastic non-ambulant
    disability, not a disorder-specific claim, and quoting a source for it
    would misrepresent what the literature says.
- name: Speech and Language Therapy
  description: >-
    Speech-language therapy, in practice augmentative and alternative
    communication, since no affected individual has achieved verbal
    communication.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: speech and language therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  notes: >-
    Recorded without an evidence item, on the same basis as Physical Therapy.
    What the source does document is the absence of any verbal communication in
    all three patients; the therapeutic response to that is inferred standard
    practice.
- name: Occupational Therapy
  description: >-
    Occupational therapy to support adaptive functioning and daily care, given
    the severe global impairment and non-ambulation.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: occupational therapy
    term:
      id: NCIT:C121351
      label: Occupational Therapy
  notes: >-
    Recorded without an evidence item, on the same basis as Physical Therapy.
    No occupational therapy is described for these patients.
- name: Audiological Assessment and Hearing Management
  description: >-
    Audiological follow-up with amplification where indicated. Hearing loss was
    present in all three published patients and is a modifiable contributor to
    the communication phenotype. NCIT has no clinical-action term for
    hearing-device use, so the generic rehabilitation action is bound.
  action_category: THERAPEUTIC
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: aural rehabilitation and hearing management
    term:
      id: NCIT:C15315
      label: Rehabilitation
  notes: >-
    Recorded without an evidence item. Hearing loss is documented in all three
    patients, but no audiological characterisation, device use or hearing
    management is reported, so the intervention itself is inferred standard
    practice. NCIT has no clinical-action term for hearing-device use, which is
    why the generic rehabilitation action is bound and the specificity is
    carried in preferred_term.
- name: Genetic Counseling
  description: >-
    Counselling on autosomal recessive inheritance with a 25% recurrence risk
    per pregnancy for carrier couples, and on targeted prenatal or
    preimplantation testing once the familial variant is known. Particularly
    relevant in the consanguineous setting in which this disorder was
    ascertained.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  notes: >-
    Recorded without an evidence item. The 25% recurrence risk is the
    arithmetic of autosomal recessive inheritance, which the entry evidences in
    its inheritance block; no counselling of this family is described in the
    source, so no quote is attached here.
discussions:
- discussion_id: single_kindred_phenotype_boundary
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which features of this syndrome are intrinsic to PSMC1 deficiency, and
    which belong to the single consanguineous kindred in which it was
    described?
  attaches_to:
  - pathophysiology#Neuronal Proteostasis Failure
  rationale: >-
    The entity rests on three affected siblings of one Bedouin Israeli
    family. Every available proportion is a 3/3 or 2/3 count from that
    sibship, so no feature can be separated from the shared genetic
    background or from consanguinity-associated homozygosity elsewhere in
    the genome. This is why no frequency band is asserted on any phenotype
    in this entry. The source itself flags two findings in one patient - a
    duplicated renal collecting system and a muscular ventricular septal
    defect - as possibly unrelated to the PSMC1 variant, and those are
    deliberately not curated as phenotypes here.
  proposed_experiments:
  - experiment_id: exp_psmc1_matchmaking_additional_families
    name: Identify additional PSMC1 families
    description: >-
      Identify further families with biallelic PSMC1 variants through
      international matchmaking (GeneMatcher, DECIPHER, Matchmaker Exchange)
      and determine which features recur outside this kindred - in particular
      the hypogonadism, the macrocytic anemia and the neonatal cholestasis.
  - experiment_id: exp_psmc1_allelic_series
    name: Test other PSMC1 alleles
    description: >-
      Determine whether other PSMC1 alleles, particularly compound
      heterozygous combinations with a truncating allele, produce the same
      phenotype or a distinct severity.
  evidence:
  - reference: PMID:35861243
    reference_title: >-
      PSMC1 variant causes a novel neurological syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three of the 10 offspring of healthy consanguineous parents of Bedouin Israeli ancestry
    explanation: >-
      States the size and structure of the entire evidence base for this
      entity.
- discussion_id: fly_and_mouse_models_do_not_match_the_human_genotype
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do the available models speak to this disease, when neither carries the
    human genotype and neither produces a neurodevelopmental phenotype?
  attaches_to:
  - pathophysiology#Reduced 26S Proteasome Proteolytic Capacity
  - pathophysiology#Neuronal Proteostasis Failure
  rationale: >-
    Two model systems support this entry and each is mismatched in a
    different way. The Drosophila assay is a knockdown of the orthologue
    read out in the compound eye; it establishes that p.I328T is
    hypomorphic, but says nothing about neurodevelopment. The mouse is a
    conditional null in defined postnatal neuronal populations that produces
    adult neurodegeneration with Lewy-like inclusions - a Parkinson-disease
    phenotype - whereas the human disease is congenital, static and not
    reported to be degenerative. Between them they support the molecular
    chain and the neuronal-dependence step; neither supports the
    developmental step, and the germline mouse null is embryonic lethal, so
    the disease genotype cannot simply be made in mouse by deletion.
  proposed_experiments:
  - experiment_id: exp_psmc1_knockin_mouse_i328t
    name: Generate a genotype-matched Psmc1 knock-in
    description: >-
      Generate a mouse carrying the orthologous I328T substitution in the
      endogenous locus and ask whether homozygotes are viable and, if so,
      whether they show developmental rather than degenerative brain
      phenotypes, plus hearing and gonadal phenotypes.
  - experiment_id: exp_psmc1_patient_ipsc_proteasome_assays
    name: Measure proteasome function in patient-derived cells
    description: >-
      Measure 26S assembly, ATPase activity, ubiquitin-conjugate load and
      chymotrypsin-like activity in patient fibroblasts or iPSC-derived
      neurons carrying p.I328T, alongside isogenic controls. No such
      measurement in human PSMC1-mutant material has been reported.
  evidence:
  - reference: PMID:35861243
    reference_title: >-
      PSMC1 variant causes a novel neurological syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Knock‐out of the PSMC1 ortholog in mice was shown to be embryonic lethal.
    explanation: >-
      States the constraint that shapes the modelling problem: complete loss
      of the orthologue is embryonic lethal in mice.
- discussion_id: hypogonadism_unique_to_psmc1
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does a 19S base ATPase lesion produce hypogonadotropic hypogonadism
    when no other proteasomopathy does?
  attaches_to:
  - phenotypes#Micropenis
  - phenotypes#Cryptorchidism
  rationale: >-
    Micropenis with undescended testes, low testosterone and low
    gonadotropins was present in all three patients, with normal pituitary
    structure, normal remaining anterior pituitary axes, and normal
    karyotype and SRY. The source states that this is unique within the
    proteasomopathies. It is therefore either a genuinely PSMC1-specific
    consequence, or a feature of this kindred's background - and with one
    family there is no way to tell. Both Micropenis and Cryptorchidism are
    left unwired in the pathograph for this reason.
  proposed_experiments:
  - experiment_id: exp_psmc1_hpg_axis_characterisation
    name: Characterise the hypothalamic-pituitary-gonadal axis
    description: >-
      Dynamic testing of the hypothalamic-pituitary-gonadal axis (GnRH
      stimulation, hCG stimulation, inhibin B, AMH) in any further patients
      identified, to establish whether the defect is central or gonadal.
  evidence:
  - reference: PMID:35861243
    reference_title: >-
      PSMC1 variant causes a novel neurological syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ambiguous genitalia with micropenis, undescended testes and low testosterone levels seen with the PSMC1 variant is unique and has not been reported in any of the diseases due to mutations in components of the proteasome.
    explanation: >-
      States the observation that raises the question: this feature has no
      counterpart in the rest of the disease class.
differential_diagnoses:
- name: Other neurodevelopmental proteasomopathies
  description: >-
    The disorders caused by variants in PSMB1 (20S core beta6), PSMC3 (19S
    base Rpt5) and PSMD12 (19S lid Rpn5), plus the PSMD11 phenotype. They
    share developmental delay, intellectual disability, dysmorphism and
    hearing loss, which the founding report reads as a common molecular
    mechanism rather than coincidence. They are separated by gene, and
    clinically by which extra features are present: cataracts and
    subcutaneous deposits with PSMC3, congenital and ophthalmologic
    malformations with PSMD12, microcephaly with PSMB1. Hypogonadism
    separates PSMC1 from all of them. This is distinct from the
    proteasome-associated autoinflammatory syndromes (PRAAS/CANDLE), which arise from
    immunoproteasome and core-particle genes and present with fever,
    panniculitis and lipodystrophy rather than a neurodevelopmental
    phenotype.
  distinguishing_features:
  - Causal gene and proteasome subcomplex (20S core, 19S base, 19S lid)
  - Micropenis with hypogonadotropic hypogonadism is reported only with PSMC1
  - Autoinflammatory proteasomopathies present with fever, panniculitis and lipodystrophy, not neurodevelopmental disability
  evidence:
  - reference: PMID:39220754
    reference_title: >-
      Understanding neurodevelopmental proteasomopathies as new rare disease entities: A review of current concepts, molecular biomarkers, and perspectives.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a total of six neurodevelopmental proteasomopathies have been described, involving the four subunits PSMB1/β6, PSMC1/Rpt2, PSMC3/Rpt5, and PSMD12/Rpn5
    explanation: >-
      Enumerates the four subunits whose disorders form this differential.
  - reference: PMID:35861243
    reference_title: >-
      PSMC1 variant causes a novel neurological syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ambiguous genitalia with micropenis, undescended testes and low testosterone levels seen with the PSMC1 variant is unique and has not been reported in any of the diseases due to mutations in components of the proteasome.
    explanation: >-
      Names the feature that distinguishes this entity from the rest of the
      class.
notes: >-
  Curation caveats. (1) No frequency band is asserted on any phenotype:
  every proportion available is a 3/3 or 2/3 count within one sibship,
  which is not a population frequency, and the counts are stated in each
  phenotype's notes instead. (2) No biochemical measurement of proteasome
  assembly or activity in human PSMC1-mutant material has been reported;
  the molecular chain rests on structural modelling plus a Drosophila
  complementation assay, and every edge that crosses from that evidence to
  a human phenotype is graded INDIRECT. (3) Ten phenotypes have no incoming
  causal edge from a pathophysiology node - hearing impairment, micropenis,
  cryptorchidism, macrocytic anemia, neonatal cholestasis, elevated hepatic
  transaminases, abnormal facial shape, feeding difficulties, dolichocephaly
  and microcephaly - because no cited source supports a causal edge from a
  modelled mechanism to them. The reason is recorded in each phenotype's
  notes rather than left implicit. Failure to thrive likewise has no
  upstream mechanism edge, but it is reached in the graph as the target of
  the Gastrostomy Feeding treatment, which is the one intervention actually
  documented in these patients. (4) A duplicated renal collecting system and a muscular
  ventricular septal defect were seen in one patient; the source itself
  says these might not be related to the PSMC1 variant, so they are not
  curated as phenotypes. (5) The gene-disease relationship is flagged as
  provisional in NCBI's mim2gene_medgen mapping for OMIM:620071,
  consistent with a single reported family; that is recorded here as
  context rather than as an evidence item, because it is a property of a
  data file and not a citable statement. (6) A falcon deep-research report was generated after this entry was written
  and is committed alongside it
  (research/Neurodevelopmental_Disorder_with_Poor_Growth_Spastic_Tetraplegia_and_Hearing_Loss-deep-research-falcon.md).
  It reached the same conclusions from the same primary source and changed
  nothing here except the Chorea count, which was opened up after the report
  read the paper's per-patient table differently from the narrative. Its own
  reference and term validation are clean (4/4 references resolved, 40/40 terms
  resolved, none obsolete). (7) Named-entity-confusion watch:
  PSMC1 has a substantial literature as a cancer-prognosis and
  Parkinson-disease candidate gene, and a PubMed search on the symbol alone returns
  almost entirely such papers. It must also not be confused with PSMC3
  (OMIM:619354, deafness with cataract) or with the PSMB1 disorder NEDMHAL
  (OMIM:620038), which is curated separately in this repository.

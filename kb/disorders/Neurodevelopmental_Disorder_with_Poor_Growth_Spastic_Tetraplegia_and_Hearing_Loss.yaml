name: Neurodevelopmental Disorder with Poor Growth, Spastic Tetraplegia, and Hearing Loss
creation_date: "2026-09-04T00:00:00Z"
category: Mendelian
synonyms:
- PSMC1-related neurodevelopmental disorder
- PSMC1-related neurodevelopmental proteasomopathy
description: >-
  Neurodevelopmental disorder with poor growth, spastic tetraplegia, and hearing
  loss (OMIM:620071) is an ultra-rare autosomal recessive syndrome caused by a
  biallelic missense variant in PSMC1, which encodes Rpt2, one of the six AAA+
  ATPases of the base of the 19S regulatory particle of the 26S proteasome. It
  belongs to the small family of neurodevelopmental proteasomopathies, and was
  only the second of them to be traced to a base subunit of the regulatory
  particle rather than to the 20S core or the 19S lid. Affected individuals have
  failure to thrive, severe global developmental delay and intellectual
  disability, spastic tetraplegia on a background of central hypotonia, chorea,
  hearing loss, micropenis with undescended testes and mildly elevated liver
  enzymes; none achieved speech or independent ambulation, and brain MRI shows
  ventriculomegaly without a malformation. Mechanistically the reported
  homozygous p.I328T substitution sits in the conserved AAA+ ATP binding and
  hydrolysis domain and is predicted to disrupt a hydrophobic core of the
  protein, so the folded ATPase is destabilised and ubiquitin-dependent
  degradation through the 26S proteasome falls. The functional consequence was
  shown in vivo rather than in patient cells: an eye phenotype caused by
  silencing the Drosophila orthologue Rpt2 was almost fully rescued by wild-type
  human PSMC1 but only partly by the mutant, so the allele is hypomorphic rather
  than null - which fits the observation that complete loss of the orthologue is
  embryonic lethal in mice. The entity rests on three affected siblings of one
  consanguineous Bedouin Israeli kindred plus that functional validation, so its
  phenotypic boundaries remain provisional. The hypogonadism is the feature that
  distinguishes it from the rest of the class.

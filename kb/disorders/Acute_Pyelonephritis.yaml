name: Acute Pyelonephritis
creation_date: "2026-09-30T09:47:36Z"
description: >-
  Acute pyelonephritis is a bacterial upper urinary tract infection in which
  uropathogenic bacteria ascend from the bladder through the ureter, seed the
  renal pelvis and renal parenchyma, and provoke acute tubulointerstitial
  inflammation with fever, flank pain, and risk of bacteremia or sepsis.
category: Infectious Disease
disease_term:
  preferred_term: acute pyelonephritis
  term:
    id: MONDO:0003529
    label: acute pyelonephritis
parents:
- Bacterial urinary tract infection
synonyms:
- Acute bacterial pyelonephritis
notes: >-
  The Falcon deep-research request fell back to OpenScientist and all 45
  reported references resolved. One asserted quote was unsupported and the
  report mislabeled HP:0032453 as pyuria, so pyuria was not bound here; the
  report's old NCIT ciprofloxacin identifier was also corrected to the locally
  cached Ciprofloxacin term.
infectious_agent:
- name: Escherichia coli
  description: >-
    Uropathogenic E. coli is the dominant bacterial cause of ascending acute
    pyelonephritis.
  infectious_agent_term:
    preferred_term: Escherichia coli
    term:
      id: NCBITaxon:562
      label: Escherichia coli
  evidence:
  - reference: PMID:27532362
    reference_title: >-
      Fluoroquinolone-Resistant and Extended-Spectrum β-Lactamase-Producing
      Escherichia coli Infections in Patients with Pyelonephritis, United
      States(1).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Cultures from 453 (86.9%) of 521 patients grew Escherichia coli.
    explanation: >-
      Supports E. coli as the dominant organism in a prospective U.S. adult
      cohort with culture-confirmed acute pyelonephritis.
classifications:
  harrisons_chapter:
  - classification_value: KIDNEY_URINARY_TRACT
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Ascending bladder-to-kidney spread
  description: >-
    Uropathogens ascend from the bladder through the ureter into the renal
    pelvis and renal parenchyma.
pathophysiology:
- name: Vesicoureteral Bacterial Ascent
  role: trigger
  biological_scale: TISSUE
  description: >-
    Bacteria present in the bladder ascend the ureter and reach the renal
    pelvis or collecting-system epithelium.
  locations:
  - preferred_term: ureter
    term:
      id: UBERON:0000056
      label: ureter
  - preferred_term: renal pelvis
    term:
      id: UBERON:0001224
      label: renal pelvis
  downstream:
  - target: Renal Parenchymal Bacterial Expansion
    causal_link_type: DIRECT
    description: >-
      Bacterial ascent into the upper tract seeds the renal pelvis, medulla, and
      cortical interstitium.
- name: Renal Parenchymal Bacterial Expansion
  biological_scale: TISSUE
  description: >-
    Uropathogens proliferate within the renal collecting system and adjacent
    parenchyma.
  cell_types:
  - preferred_term: kidney collecting duct epithelial cell
    term:
      id: CL:1000454
      label: kidney collecting duct epithelial cell
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  - preferred_term: collecting duct of renal tubule
    term:
      id: UBERON:0001232
      label: collecting duct of renal tubule
  biological_processes:
  - preferred_term: cell adhesion
    modifier: INCREASED
    term:
      id: GO:0007155
      label: cell adhesion
  downstream:
  - target: Acute Tubulointerstitial Inflammation
    causal_link_type: DIRECT
    description: >-
      Local bacterial proliferation activates innate responses in the infected
      kidney.
  evidence:
  - reference: PMID:33513212
    reference_title: >-
      A host receptor enables type 1 pilus-mediated pathogenesis of Escherichia
      coli pyelonephritis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Bacterial mutants lacking the type 1 pilus adhesin (FimH) were unable to
      establish kidney infection in male C3H/HeN mice.
    explanation: >-
      Supports FimH-dependent UPEC adhesion as a requirement for ascending
      kidney infection in a mouse pyelonephritis model.
  - reference: PMID:33513212
    reference_title: >-
      A host receptor enables type 1 pilus-mediated pathogenesis of Escherichia
      coli pyelonephritis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      The mannosylated extracellular domain of human DSG2 bound directly to the
      lectin domain of FimH in vitro
    explanation: >-
      Identifies desmoglein-2 as a human renal epithelial receptor for the UPEC
      FimH lectin in vitro.
- name: Acute Tubulointerstitial Inflammation
  biological_scale: TISSUE
  description: >-
    Neutrophil-rich renal inflammation produces fever, flank pain, and systemic
    illness and can spill bacteria or cytokines into the bloodstream.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  - preferred_term: kidney interstitium
    term:
      id: UBERON:0005215
      label: kidney interstitium
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  - preferred_term: defense response to bacterium
    modifier: INCREASED
    term:
      id: GO:0042742
      label: defense response to bacterium
  - preferred_term: neutrophil activation
    modifier: INCREASED
    term:
      id: GO:0042119
      label: neutrophil activation
  evidence:
  - reference: PMID:11817650
    reference_title: "The 'innate' host response protects and damages the infected urinary tract."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      neutrophils are the critical effectors of the host defence and that
      neutrophil dysfunctions lead to acute pyelonephritis and renal scarring.
    explanation: >-
      Supports the central role of neutrophil recruitment and function in
      containing upper-tract UPEC infection.
  - reference: PMID:39321268
    reference_title: >-
      Neutrophil extracellular traps protect the kidney from ascending infection
      and are required for a positive leukocyte dipstick test.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      PADI4 inhibition in mice blocked NETosis and resulted in progression of
      cystitis into pyelonephritis
    explanation: >-
      Supports urinary neutrophil NETosis as a protective barrier that limits
      ascent from cystitis to kidney infection in a mouse UTI model.
phenotypes:
- name: Fever
  description: >-
    Acute upper-tract infection produces systemic febrile illness.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:27532362
    reference_title: >-
      Fluoroquinolone-Resistant and Extended-Spectrum β-Lactamase-Producing
      Escherichia coli Infections in Patients with Pyelonephritis, United
      States(1).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      adults with flank pain, temperature >38.0°C, and a diagnosis of acute
      pyelonephritis, confirmed by culture.
    explanation: >-
      Documents fever as part of the case definition for a prospective acute
      pyelonephritis culture-surveillance study.
- name: Flank pain
  description: >-
    Renal pelvic and parenchymal inflammation produces acute flank or
    costovertebral-region pain.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Flank pain
    term:
      id: HP:0030157
      label: Flank pain
  evidence:
  - reference: PMID:27532362
    reference_title: >-
      Fluoroquinolone-Resistant and Extended-Spectrum β-Lactamase-Producing
      Escherichia coli Infections in Patients with Pyelonephritis, United
      States(1).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      adults with flank pain, temperature >38.0°C, and a diagnosis of acute
      pyelonephritis, confirmed by culture.
    explanation: >-
      Documents flank pain as part of the case definition for a prospective
      acute pyelonephritis culture-surveillance study.
- name: Sepsis
  description: >-
    Bacteremic or cytokine-spilling acute pyelonephritis can progress to
    urosepsis.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Sepsis
    term:
      id: HP:0100806
      label: Sepsis
treatments:
- name: Culture-guided fluoroquinolone antimicrobial therapy
  description: >-
    Community-acquired acute pyelonephritis is treated with an antibiotic
    active against the cultured uropathogen and tailored to susceptibility
    results and local resistance; ciprofloxacin is an oral fluoroquinolone
    option when the isolate is susceptible and patient factors permit it.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: Ciprofloxacin
      term:
        id: NCIT:C375
        label: Ciprofloxacin
  target_mechanisms:
  - target: Renal Parenchymal Bacterial Expansion
    treatment_effect: INHIBITS
    description: >-
      Susceptibility-guided antimicrobial therapy kills or suppresses the
      proliferating renal uropathogen population.
  - target: Acute Tubulointerstitial Inflammation
    treatment_effect: INHIBITS
    description: >-
      Bacterial eradication removes the trigger for ongoing neutrophilic
      tubulointerstitial inflammation.
  evidence:
  - reference: PMID:22726802
    reference_title: >-
      Ciprofloxacin for 7 days versus 14 days in women with acute
      pyelonephritis: a randomised, open-label and double-blind,
      placebo-controlled, non-inferiority trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Short-term clinical cure occurred in 71 (97%) patients treated with
      ciprofloxacin for 7 days and 80 (96%) treated for 14 days
    explanation: >-
      Supports ciprofloxacin as an effective oral antibiotic in a randomized
      duration trial of women with community-acquired acute pyelonephritis.
review_notes: >-
  Duplicate preflight found no exact MONDO:0003529 or exact acute-pyelonephritis
  standalone entry in ignored-inclusive kb/disorders, stubs, research, history,
  .github, and docs searches. Local and origin/main matches were confined to
  Familial_Vesicoureteral_Reflux, which models acute pyelonephritis as a
  reflux-mediated consequence; all-state GitHub PR and issue matches were the
  same merged Familial VUR work, not duplicate standalone curation.

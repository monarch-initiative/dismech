diagnosis:
- name: Urine culture and parenchymal imaging
  description: >-
    Diagnosis rests on pyuria and a positive urine culture; DMSA scintigraphy is
    the reference standard for parenchymal involvement and scarring.
  markers: urine culture; dimercaptosuccinic acid (DMSA) renal scintigraphy
  evidence:
  - reference: PMID:27313268
    reference_title: >-
      Ceftazidime-avibactam Versus Doripenem for the Treatment of Complicated
      Urinary Tract Infections, Including Acute Pyelonephritis: RECAPTURE, a
      Phase 3 Randomized Trial Program.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosis was based on positive urine cultures obtained within 48 hours of
      enrollment showing 1–2 gram-negative uropathogens at ≥105 colony-forming
      units (CFU)/mL, and pyuria.
    explanation: >-
      Documents the quantitative urine-culture and pyuria case definition used
      for culture-confirmed acute pyelonephritis.
  - reference: PMID:27748543
    reference_title: >-
      Delayed treatment of the first febrile urinary tract infection in early
      childhood increased the risk of renal scarring.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      renal scarring based on dimercaptosuccinic acid scintigraphy (DMSA)
      findings
    explanation: >-
      DMSA scintigraphy is used to define renal parenchymal lesions and
      scarring.
progression:
- phase: Uncomplicated acute pyelonephritis
  notes: >-
    Acute parenchymal kidney infection; most cases resolve with prompt
    antibiotics.
  evidence:
  - reference: PMID:38020186
    reference_title: >-
      Temporal changes in incidence of hospital-diagnosed acute pyelonephritis:
      A 19-year population-based Danish cohort study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      which may lead to sepsis, acute kidney injury, kidney scarring, chronic
      kidney disease, and death
    explanation: >-
      Frames acute pyelonephritis as the starting point of a progression that
      can reach sepsis, scarring, and CKD.
- phase: Emphysematous pyelonephritis
  notes: >-
    Gas-forming necrotizing infection, chiefly in diabetic or obstructed
    patients.
  evidence:
  - reference: PMID:42221797
    reference_title: >-
      Clinical spectrum, outcome and impact of nephrectomy in critically-ill
      adult patients with emphysematous pyelonephritis: the PYELEMPHY
      observational retrospective multicenter Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Emphysematous pyelonephritis (EPN) is a rare, life-threatening necrotizing
      urinary tract infection marked by gas formation in the renal parenchyma
      and perirenal tissues.
    explanation: >-
      Defines emphysematous pyelonephritis as a severe necrotizing stage of
      upper-tract infection.
- phase: Urosepsis and septic shock
  notes: >-
    Bacteremic spread with systemic sepsis; mortality is high once septic shock
    develops.
  evidence:
  - reference: PMID:42417339
    reference_title: >-
      '[Treatment, outcomes, and management strategy for purulent
      pyelonephritis: a systematic review and meta-analysis. Part II].'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in patients with septic shock, mortality reached 20-30%
    explanation: >-
      Documents the high mortality of the septic-shock stage of severe
      pyelonephritis.
- phase: Renal scarring and chronic kidney disease
  notes: >-
    Delayed or severe infection leaves permanent scars that can progress to
    hypertension and chronic kidney disease.
  evidence:
  - reference: PMID:27748543
    reference_title: >-
      Delayed treatment of the first febrile urinary tract infection in early
      childhood increased the risk of renal scarring.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Delay in treatment initiation of 72 hours or more was a risk factor for
      permanent renal scars after the first episode of febrile UTI.
    explanation: >-
      Links delayed treatment to the permanent-scarring sequela of acute
      pyelonephritis.
treatments:
- name: Culture-guided fluoroquinolone antimicrobial therapy
  description: >-
    Community-acquired acute pyelonephritis is treated with an antibiotic
    active against the cultured uropathogen and tailored to susceptibility
    results and local resistance; ciprofloxacin is an oral fluoroquinolone
    option when the isolate is susceptible and patient factors permit it.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: Ciprofloxacin
      term:
        id: NCIT:C375
        label: Ciprofloxacin
  target_mechanisms:
  - target: Renal Parenchymal Bacterial Expansion
    treatment_effect: INHIBITS
    description: >-
      Susceptibility-guided antimicrobial therapy kills or suppresses the
      proliferating renal uropathogen population.
  - target: Acute Tubulointerstitial Inflammation
    treatment_effect: INHIBITS
    description: >-
      Bacterial eradication removes the trigger for ongoing neutrophilic
      tubulointerstitial inflammation.
  evidence:
  - reference: PMID:22726802
    reference_title: >-
      Ciprofloxacin for 7 days versus 14 days in women with acute
      pyelonephritis: a randomised, open-label and double-blind,
      placebo-controlled, non-inferiority trial.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Short-term clinical cure occurred in 71 (97%) patients treated with
      ciprofloxacin for 7 days and 80 (96%) treated for 14 days
    explanation: >-
      Supports ciprofloxacin as an effective oral antibiotic in a randomized
      duration trial of women with community-acquired acute pyelonephritis.
- name: Intravenous third-generation cephalosporin (ceftriaxone)
  description: >-
    Hospitalized or febrile acute pyelonephritis in hemodynamically stable
    patients is commonly treated empirically with an intravenous
    third-generation cephalosporin such as ceftriaxone.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

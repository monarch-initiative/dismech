    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ceftazidime-avibactam was highly effective for the empiric treatment of
      cUTI (including acute pyelonephritis), and may offer an alternative to
      carbapenems in this setting.
    explanation: >-
      Phase 3 RCT evidence supporting ceftazidime-avibactam for complicated UTI
      including acute pyelonephritis.
- name: Source control (decompression and drainage)
  description: >-
    When obstruction or an abscess is present, antibiotics alone are
    insufficient: urgent decompression (nephrostomy or ureteral stent) and
    percutaneous drainage of large abscesses are required, with nephrectomy
    reserved for fulminant disease.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: urinary tract decompression and drainage
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Renal Parenchymal Bacterial Expansion
    treatment_effect: INHIBITS
    description: >-
      Relieving obstruction and draining pus removes the stasis and
      focus that sustain renal bacterial expansion.
  evidence:
  - reference: PMID:42417339
    reference_title: >-
      '[Treatment, outcomes, and management strategy for purulent
      pyelonephritis: a systematic review and meta-analysis. Part II].'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In cases of urinary tract obstruction, urgent decompression with
      nephrostomy or ureteral stenting was mandatory and led to improvement in
      >90% of cases.
    explanation: >-
      Supports obstruction decompression as a required source-control
      intervention in severe pyelonephritis.
animal_models:
- name: Murine transurethral ascending UTI/pyelonephritis model (C3H/HeN)
  species: Mouse
  genotype: C3H/HeN wild-type, transurethral UPEC inoculation
  publication: PMID:33513212
  description: >-
    Transurethral UPEC inoculation of C3H/HeN mice reproduces ascending kidney
    infection and is the workhorse model for bacterial and host determinants of
    pyelonephritis.
  modeled_mechanisms:
  - target: Renal Parenchymal Bacterial Expansion
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      FimH-dependent UPEC adhesion and renal colonisation are reproduced in the
      C3H/HeN ascending-infection model.
    limitations: >-
      Mice lack a direct IL-8/CXCL8 ortholog (functional homologs are used) and
      differ in urinary-tract anatomy, so the human chemokine-driven neutrophil
      axis and polymorphism spectrum are only partially captured.
    evidence:
    - reference: PMID:33513212
      reference_title: >-
        A host receptor enables type 1 pilus-mediated pathogenesis of
        Escherichia coli pyelonephritis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Bacterial mutants lacking the type 1 pilus adhesin (FimH) were unable to
        establish kidney infection in male C3H/HeN mice.
      explanation: >-
        The C3H/HeN model recapitulates FimH-dependent renal colonisation
        underlying parenchymal bacterial expansion.
review_notes: >-
  Duplicate preflight found no exact MONDO:0003529 or exact acute-pyelonephritis
  standalone entry in ignored-inclusive kb/disorders, stubs, research, history,
  .github, and docs searches. Local and origin/main matches were confined to
  Familial_Vesicoureteral_Reflux, which models acute pyelonephritis as a
  reflux-mediated consequence; all-state GitHub PR and issue matches were the
  same merged Familial VUR work, not duplicate standalone curation.

      pyelonephritis in stable patients.
- name: Ceftazidime-avibactam
  description: >-
    For complicated or resistant (including ESBL-producing) infection,
    ceftazidime-avibactam is a carbapenem-sparing option that was non-inferior
    to doripenem for complicated UTI including acute pyelonephritis in a Phase 3
    program.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:

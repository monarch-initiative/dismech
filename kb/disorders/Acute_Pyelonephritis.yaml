genetic:
- name: IRF3
  gene_term:
    preferred_term: IRF3
    term:
      id: hgnc:6118
      label: IRF3
  association: >-
    An IRF3 promoter polymorphism with reduced promoter activity segregates with
    symptomatic kidney infection versus asymptomatic bacterial carriage, marking
    IRF3 as a host-susceptibility locus for ascending pyelonephritis.
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:20886096
    reference_title: >-
      Pathogen specific, IRF3-dependent signaling and innate resistance to human
      kidney infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Relevance of this pathway for human disease was supported by polymorphic
      IRF3 promoter sequences, differing between children with severe,
      symptomatic kidney infection and children who were asymptomatic bacterial
      carriers.
    explanation: >-
      IRF3 promoter genotypes differ between children with symptomatic kidney
      infection and asymptomatic carriers, supporting IRF3 as a susceptibility
      locus.
  - reference: PMID:20886096
    reference_title: >-
      Pathogen specific, IRF3-dependent signaling and innate resistance to human
      kidney infection.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      IRF3 promoter activity was reduced by the disease-associated genotype,
      consistent with the pathology in Irf3(-/-) mice.
    explanation: >-
      A promoter-activity assay shows the disease-associated genotype lowers
      IRF3 promoter activity, a plausible functional basis for susceptibility.
- name: CXCL8
  gene_term:
    preferred_term: CXCL8
    term:
      id: hgnc:6025
      label: CXCL8
  association: >-
    The IL-8 (CXCL8) promoter variant rs4073 (-251A>T) is associated with
    pediatric parenchymal renal infection and with severity of acute lobar
    nephronia.
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:21042230
    reference_title: >-
      Genetic polymorphisms and susceptibility to parenchymal renal infection
      among pediatric patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      only IL-8 (rs4073, -251A>T) showed significant differences in genotype and
      allele frequency between the control and APN or ALN cases
    explanation: >-
      Associates the CXCL8 rs4073 promoter variant with susceptibility to
      parenchymal renal infection in children.
- name: CXCR1
  gene_term:
    preferred_term: CXCR1
    term:
      id: hgnc:6026
      label: CXCR1
  association: >-
    Low CXCR1 (IL-8 receptor) expression impairs neutrophil recruitment and is
    linked to recurrent pyelonephritis and renal scarring.
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:11817650
    reference_title: "The 'innate' host response protects and damages the infected urinary tract."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the data linking low CXCR1 expression to recurrent pyelonephritis in man,
      as well as the information on the genetic basis for low CXCR1 expression in
      affected patients.
    explanation: >-
      Review synthesis linking reduced CXCR1 expression, and its genetic basis,
      to susceptibility to recurrent pyelonephritis.
environmental:
- name: Diabetes mellitus
  description: >-
    Diabetes, with high tissue glucose, is the dominant predisposing condition
    for severe necrotizing and emphysematous forms of acute pyelonephritis.
  evidence:
  - reference: PMID:42221797
    reference_title: >-
      Clinical spectrum, outcome and impact of nephrectomy in critically-ill
      adult patients with emphysematous pyelonephritis: the PYELEMPHY
      observational retrospective multicenter Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diabetes mellitus and urinary tract obstruction are the main predisposing
      factors implicated in the pathogenesis of EPN
    explanation: >-
      Names diabetes as a main predisposing factor for emphysematous
      pyelonephritis.
  influences_mechanisms:
  - target: Renal Parenchymal Bacterial Expansion
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Hyperglycaemia and impaired perfusion favour uncontrolled parenchymal
      bacterial proliferation and gas-forming necrotizing infection.
    evidence:
    - reference: PMID:42221797
      reference_title: >-
        Clinical spectrum, outcome and impact of nephrectomy in critically-ill
        adult patients with emphysematous pyelonephritis: the PYELEMPHY
        observational retrospective multicenter Study.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Overweight or obesity was present in 74%, and diabetes in 63%.
      explanation: >-
        Diabetes is over-represented in critically-ill emphysematous
        pyelonephritis, supporting it as a predisposing condition for severe
        parenchymal disease.
- name: Urinary tract obstruction
  description: >-
    Obstruction or stones cause urinary stasis that predisposes to ascending
    infection and to severe, necrotizing pyelonephritis.
  evidence:
  - reference: PMID:42221797
    reference_title: >-
      Clinical spectrum, outcome and impact of nephrectomy in critically-ill
      adult patients with emphysematous pyelonephritis: the PYELEMPHY
      observational retrospective multicenter Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diabetes mellitus and urinary tract obstruction are the main predisposing
      factors implicated in the pathogenesis of EPN
    explanation: >-
      Names urinary tract obstruction as a main predisposing factor for
      emphysematous pyelonephritis.
  influences_mechanisms:
  - target: Renal Parenchymal Bacterial Expansion
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Obstruction and stasis allow uropathogens to proliferate in the renal
      collecting system and parenchyma.
    evidence:
    - reference: PMID:42221797
      reference_title: >-
        Clinical spectrum, outcome and impact of nephrectomy in critically-ill
        adult patients with emphysematous pyelonephritis: the PYELEMPHY
        observational retrospective multicenter Study.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Urinary tract obstruction was identified in 46%.
      explanation: >-
        Obstruction is present in nearly half of severe emphysematous
        pyelonephritis cases, supporting it as a predisposing factor.
- name: Pregnancy
  description: >-
    Pregnancy-associated ureteral dilation and urinary stasis increase the risk
    of ascending infection and pyelonephritis.
  evidence:
  - reference: PMID:41274602
    reference_title: >-
      Treatment of asymptomatic bacteriuria during pregnancy: A
      risk-factor-based approach.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During pregnancy, there is increased risk of ascending urinary tract
      infection (UTI) resulting in pyelonephritis and associated preterm
      delivery and low birth weight.
    explanation: >-
      Pregnancy raises the risk that a urinary tract infection ascends to cause
      pyelonephritis.
  influences_mechanisms:
  - target: Vesicoureteral Bacterial Ascent
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Gestational ureteral dilation and stasis favour ascent of bladder
      uropathogens into the upper tract.
    evidence:
    - reference: PMID:41274602
      reference_title: >-
        Treatment of asymptomatic bacteriuria during pregnancy: A
        risk-factor-based approach.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        During pregnancy, there is increased risk of ascending urinary tract
        infection (UTI) resulting in pyelonephritis and associated preterm
        delivery and low birth weight.
      explanation: >-
        Pregnancy raises the risk that a urinary tract infection ascends to
        cause pyelonephritis.
prevalence:
- population: Denmark (women, hospital-diagnosed, 2018)
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 154.0
  rate_denominator: PERSON_YEARS
  notes: >-
    19-year Danish population-based cohort; women's rate rose from 6.8 to 15.4
    per 10,000 person-years over 2000-2018.
  evidence:
  - reference: PMID:38020186
    reference_title: >-
      Temporal changes in incidence of hospital-diagnosed acute pyelonephritis:
      A 19-year population-based Danish cohort study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the incidence increased from 6.8 (95% CI: 6.8-6.8) to 15.4 (95% CI:
      15.4-15.4) in women and from 2.7 (95% CI: 2.7-2.7) to 4.5 (95% CI:
      4.5-4.5) in men.
    explanation: >-
      Reports the 2018 hospital-diagnosed APN incidence in women (15.4 per
      10,000 person-years = 154 per 100,000).

notes: >-
  Allelic spectrum. Every missense allele reported to date substitutes an
  arginine in the homeodomain, and two independent alleles hit the same residue
  (homeodomain Arg5, protein Arg207). The founder allele is Arg207Cys and a
  later case carried Arg207His. The in-silico prediction was that the histidine
  substitution retains stronger DNA binding than the cysteine one and gives a
  milder phenotype (PMID:26007620), which is a genotype-phenotype hypothesis
  rather than a measured result and is not curated as a subtype here. A
  homozygous nonsense allele (PMID:27144914) and compound heterozygous missense
  alleles (PMID:38203298, PMID:39235314) have since been reported, and a further
  homozygous missense allele in a consanguineous Turkish family brought the
  reported total to four at the time (PMID:27640920).

  Named entity check. Three distinct entities share the phrase "congenital
  facial" in this literature and were kept apart during curation. HCFP3 is
  HOXB1-related and recessive and is what this entry covers; HCFP1 and HCFP2 are
  dominant with mapped loci and no identified gene; Moebius syndrome adds an
  abduction deficit to the facial palsy. The Moebius differential is curated
  from a cohort screen rather than from assertion.

  Deep-research provenance. Curated alongside an OpenScientist report
  (research/Hereditary_Congenital_Facial_Paresis_3-deep-research-openscientist.md),
  whose causal chain matched the one built here from primary literature. Its
  substantive addition was the upstream regulatory context now folded into the
  rhombomere-4 node: the retinoic-acid gradient that initiates Hoxb1 expression
  and the b1 autoregulatory element that maintains it. Two of its ontology
  suggestions were not used. UBERON:0005396, offered as rhombomere 4, is
  carotid artery segment, so the r4 node is anchored to the hindbrain instead;
  no UBERON rhombomere-4 term is bound here. CL:0011001 was offered for
  branchiomotor neurons and is a spinal cord motor neuron, so the generic
  CL:0000100 is used with the specificity carried in preferred_term.

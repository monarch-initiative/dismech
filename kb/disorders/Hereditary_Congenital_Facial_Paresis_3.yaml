- name: Impaired Development of r4-Derived Cranial Ganglia
  biological_scale: TISSUE
  description: >-
    Rhombomere 4 is the precursor of the geniculate ganglion and of the spiral
    and vestibular ganglia, which is the developmental route from the same
    segmental lesion to the sensorineural hearing loss and the ear malformations
    seen in most patients. The mechanism connecting the r4 lesion to the human
    auditory phenotype has not been demonstrated directly, so this node records
    a lineage relationship rather than an experimentally traced chain.

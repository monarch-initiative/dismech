    snippet: "The homozygous nonsense variant c.66C>G/p.(Tyr22*) in HOXB1 was identified in the four patients with HCFP and ear malformations, while healthy family members carried the mutation in the heterozygous state."
    explanation: Affected individuals are homozygous and heterozygous relatives are healthy, which is the recessive segregation pattern.

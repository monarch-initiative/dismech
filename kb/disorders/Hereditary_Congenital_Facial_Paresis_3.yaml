pathophysiology:
- name: HOXB1 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic HOXB1 variants abolish or degrade the transcriptional activity of
    the HOXB1 homeodomain. Reported missense alleles all replace an arginine in
    the homeodomain, and the recurrent Arg207 corresponds to homeodomain Arg5,
    which contacts thymine in the DNA minor groove within the HOXB1:PBX1:DNA
    ternary complex. A homozygous nonsense allele produces the same disease,
    which is what identifies the mechanism as loss of function.
  gene:
    preferred_term: HOXB1
    modifier: LOSS_OF_FUNCTION
    term:
      id: hgnc:5111
      label: HOXB1
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    modifier: DECREASED
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  evidence:
  - reference: PMID:22770981
    reference_title: "HOXB1 founder mutation in humans recapitulates the phenotype of Hoxb1-/- mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular modeling and an in vitro DNA-protein binding assay predict that the mutation would disrupt these interactions, destabilize the HOXB1:PBX1:DNA complex, and alter HOXB1 transcriptional activity."
    explanation: Modeling plus a binding assay place the defect at DNA binding within the HOXB1-PBX1 complex.
  - reference: PMID:27144914
    reference_title: "Homozygous HOXB1 loss-of-function mutation in a large family with hereditary congenital facial paresis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first disease-associated HOXB1 mutation with a likely loss-of-function effect suggesting that all HOXB1 variants reported so far also have severe impact on activity of this transcriptional regulator."
    explanation: A nonsense allele causing the same phenotype is the argument that the missense alleles also act by loss of function.
  downstream:
  - target: Failure to Maintain Rhombomere 4 Identity
    causal_link_type: DIRECT
    description: >-
      HOXB1 is the segment-identity gene of rhombomere 4, so its loss removes
      the transcriptional program that maintains r4 identity.
    evidence:
    - reference: PMID:8967950
      reference_title: "Altered segmental identity and abnormal migration of motor neurons in mice lacking Hoxb-1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here we report that absence of Hoxb-1 leads to changes in r4 identity."
      explanation: Directly states that loss of Hoxb1 changes rhombomere 4 identity.
- name: Failure to Maintain Rhombomere 4 Identity
  biological_scale: TISSUE
  description: >-
    Rhombomere 4 patterning is initiated normally but is not maintained without
    HOXB1. The segment is therefore specified and then loses its identity, which
    is why the downstream deficits are of specification and migration rather
    than of initial hindbrain segmentation.

    The reason initiation and maintenance come apart is that they are driven by
    different things. Initiation is extrinsic: a retinoic acid gradient made by
    Raldh2 in paraxial mesoderm, bounded by the RA-degrading Cyp26 enzymes,
    restricts Hoxb1 expression to presumptive r4. Maintenance is autoregulatory:
    HOXB1 sustains its own r4 expression through the b1 autoregulatory element,
    which is activated by HOXB1 and PBX1 binding together. That loop is exactly
    what the recurrent homeodomain Arg207 substitution destabilizes, which is
    how a DNA-contact mutation produces a maintenance failure rather than a
    failure to specify the segment at all.
  locations:
  - preferred_term: hindbrain
    term:
      id: UBERON:0002028
      label: hindbrain
  biological_processes:
  - preferred_term: rhombomere development
    modifier: ABNORMAL
    term:
      id: GO:0021546
      label: rhombomere development
  - preferred_term: anterior/posterior pattern specification
    modifier: ABNORMAL
    term:
      id: GO:0009952
      label: anterior/posterior pattern specification
  evidence:
  - reference: PMID:8967950
    reference_title: "Altered segmental identity and abnormal migration of motor neurons in mice lacking Hoxb-1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In mutant mouse embryos, molecular markers indicate that patterning of r4 is initiated properly but not maintained."
    explanation: Distinguishes a maintenance failure from a failure to establish the segment.
  - reference: PMID:11278854
    reference_title: "The recruitment of SOX/OCT complexes and the differential activity of HOXA1 and HOXB1 modulate the Hoxb1 auto-regulatory enhancer function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We previously showed that HOXB1 and PBX1 activate transcription from the b1-ARE by binding to sequences required for the expression of a reporter gene in rhombomere 4 in vivo."
    explanation: Identifies the HOXB1-PBX1 autoregulatory loop that maintains r4 expression, which is the machinery the Arg207 homeodomain substitution disrupts.
  - reference: PMID:15872003
    reference_title: "Shifting boundaries of retinoic acid activity control hindbrain segmental gene expression."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Retinoic acid (RA) generated by Raldh2 in paraxial mesoderm is required for specification of the posterior hindbrain, including restriction of Hoxb1 expression to presumptive rhombomere 4 (r4)."
    explanation: Establishes that r4 Hoxb1 expression is initiated extrinsically by retinoic acid, which is why an intrinsic HOXB1 lesion spares initiation. It is indirect because it describes normal patterning rather than the disease state.
  downstream:
  - target: Mis-specification and Failed Migration of Facial Branchiomotor Neurons
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:8967950
      reference_title: "Altered segmental identity and abnormal migration of motor neurons in mice lacking Hoxb-1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cellular analysis by DiI tracing reveals that the r4-specific facial branchiomotor (FBM) and contralateral vestibuloacoustic efferent (CVA) neurons are incorrectly specified."
      explanation: Lineage tracing links the r4 identity defect to mis-specification of the r4-derived facial branchiomotor neurons.
  - target: Loss of r4-Derived Neural Crest Support of the VIIth Nerve
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:15198977
      reference_title: "Hoxb1 functions in both motoneurons and in tissues of the periphery to establish and maintain the proper neuronal circuitry."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "By conditionally deleting the Hoxb1 locus in neural crest, we demonstrate that Hoxb1 is also required in r4-derived neural crest to facilitate and maintain formation of the VIIth nerve circuitry."
      explanation: Conditional deletion isolates a second, neural-crest-autonomous arm downstream of the same r4 lesion.
  - target: Impaired Development of r4-Derived Cranial Ganglia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38203298
      reference_title: "Expanding the Phenotype of Hereditary Congenital Facial Paresis Type 3."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "playing a crucial role in the development of rhombomere 4, which is a precursor of the geniculate ganglion and the spiral and vestibular ganglion"
      explanation: Places the geniculate and spiral/vestibular ganglia in the r4 lineage, which is the route from the r4 lesion to the auditory phenotype. The intervening steps in humans are not established.
- name: Mis-specification and Failed Migration of Facial Branchiomotor Neurons
  biological_scale: CELLULAR
  description: >-
    Facial branchiomotor neurons are born in r4 and normally migrate caudally
    into r5. Without HOXB1 they differentiate but do not migrate correctly,
    forming an atypically migrating nucleus, and the facial motor nerve is
    subsequently lost.
  cell_types:
  - preferred_term: facial branchiomotor neuron
    term:
      id: CL:0000100
      label: motor neuron
  biological_processes:
  - preferred_term: neuron migration
    modifier: ABNORMAL
    term:
      id: GO:0001764
      label: neuron migration
  evidence:
  - reference: PMID:8967950
    reference_title: "Altered segmental identity and abnormal migration of motor neurons in mice lacking Hoxb-1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In mutants, motor neurons differentiate but the CVA and FBM neurons fail to migrate into their proper positions."
    explanation: The neurons are made and then fail to reach their target position, so the defect is one of migration rather than neurogenesis.
  downstream:
  - target: Facial Motor Nerve Deficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:8967950
      reference_title: "Altered segmental identity and abnormal migration of motor neurons in mice lacking Hoxb-1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Instead, they form a motor nucleus which migrates atypically, and there is a subsequent loss of the facial motor nerve."
      explanation: States the causal step from failed migration to loss of the facial motor nerve.
- name: Loss of r4-Derived Neural Crest Support of the VIIth Nerve
  biological_scale: CELLULAR
  description: >-
    A separate, non-neuronal arm of the same lesion. Rhombomere-4-derived neural
    crest generates the glia that myelinate the VIIth cranial nerve. In
    conditional mouse mutants glial progenitor specification is preserved, so
    the requirement is for a later glial function in maintaining the nerve
    rather than for producing the glia at all.
  cell_types:
  - preferred_term: r4-derived neural crest cell
    term:
      id: CL:0011012
      label: neural crest cell
  biological_processes:
  - preferred_term: neural crest cell migration
    modifier: ABNORMAL
    term:
      id: GO:0001755
      label: neural crest cell migration
  evidence:
  - reference: PMID:15198977
    reference_title: "Hoxb1 functions in both motoneurons and in tissues of the periphery to establish and maintain the proper neuronal circuitry."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Genetic lineage analysis revealed that a significant population of r4-derived neural crest is fated to generate glia that myelinate the VIIth cranial nerve."
    explanation: Establishes the r4 neural crest as the source of the myelinating glia of the facial nerve.
  - reference: PMID:15198977
    reference_title: "Hoxb1 functions in both motoneurons and in tissues of the periphery to establish and maintain the proper neuronal circuitry."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Neural crest cultures show that the absence of Hoxb1 function does not appear to affect overall glial progenitor specification, suggesting that a later glial function is critical for maintenance of the VIIth nerve."
    explanation: Narrows the glial defect to maintenance rather than progenitor specification.
  downstream:
  - target: Facial Motor Nerve Deficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:15198977
      reference_title: "Hoxb1 functions in both motoneurons and in tissues of the periphery to establish and maintain the proper neuronal circuitry."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Taken together, these results suggest that the molecular program governing the development and maintenance of the VIIth cranial nerve is dependent upon Hoxb1, both in the neural crest-derived glia and in the facial branchiomotor neurons."
      explanation: States that both arms converge on development and maintenance of the VIIth nerve.
- name: Facial Motor Nerve Deficiency
  biological_scale: TISSUE
  description: >-
    The converged consequence of the motor-neuron and neural-crest arms, namely
    a facial nerve that is congenitally deficient. In patients this is seen as
    complete bilateral absence of the blink reflex, localizing the lesion to the
    facial nerve nucleus, and in some individuals as facial nerve axonal
    neuropathy on electrophysiology with structurally normal nerves on imaging.
  locations:
  - preferred_term: facial nerve
    term:
      id: UBERON:0001647
      label: facial nerve
  biological_processes:
  - preferred_term: facial nerve morphogenesis

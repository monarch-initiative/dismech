name: Hereditary Congenital Facial Paresis 3
creation_date: "2026-09-05T10:00:00Z"
category: Mendelian
synonyms:
- HCFP3
- facial paresis, hereditary congenital, 3
- HOXB1-related congenital facial palsy
- hereditary congenital facial palsy type 3
description: >-
  Hereditary congenital facial paresis type 3 (HCFP3) is an autosomal recessive
  congenital cranial dysinnervation disorder caused by biallelic variants in
  HOXB1. It presents at birth with non-progressive bilateral facial weakness,
  usually with sensorineural hearing loss, and frequently with external ear
  malformation and mild esodeviation.

  The lesion is developmental rather than degenerative, and it is anchored to a
  single hindbrain segment. HOXB1 is expressed throughout rhombomere 4, where it
  maintains segmental identity; r4 is the source of the facial branchiomotor
  neurons that innervate the muscles of facial expression, of the r4-derived
  neural crest that generates the glia myelinating the VIIth nerve, and of the
  geniculate and vestibulocochlear ganglia. One transcription-factor lesion in
  one segment therefore explains the facial, auditory and ear findings together,
  and explains why the deficit is fixed from birth, because the affected
  structures are mis-specified during embryogenesis rather than lost afterwards.

  Every HOXB1 missense variant reported to date substitutes an arginine in the
  homeodomain, and the recurrent Arg207 (homeodomain Arg5) residue contacts DNA
  in the minor groove within the HOXB1:PBX1:DNA ternary complex. A nonsense
  allele produces the same disease, which is what establishes the mechanism as
  loss of function rather than a dominant-negative or neomorphic effect.

  SCOPE. This entry covers HCFP3 only. HCFP1 (3q21-q22) and HCFP2
  (10q21.3-q22.1) are autosomal dominant, have no identified gene, and are not
  curated here. Moebius syndrome shares the facial palsy but adds limited ocular
  abduction and is a separate entity.

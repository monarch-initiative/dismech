    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is expressed in the embryonic spinal cord and hindbrain, playing a crucial role in the development of rhombomere 4, which is a precursor of the geniculate ganglion and the spiral and vestibular ganglion"
    explanation: Establishes the lineage relationship this node asserts.
  downstream:
  - target: Sensorineural Hearing Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38203298
      reference_title: "Expanding the Phenotype of Hereditary Congenital Facial Paresis Type 3."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "HCFP type 3 (HCFP3) is associated with biallelic variants in the HOXB1 gene, manifesting at birth with facial muscle weakness and typically accompanied by hearing loss"
      explanation: Ties the hearing loss to the same biallelic HOXB1 lesion; the intervening steps are not established in humans.

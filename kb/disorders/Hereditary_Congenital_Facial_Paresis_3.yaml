animal_models:
- name: Hoxb1-null mouse
  species: Mouse
  genotype: Hoxb1 homozygous null
  publication: PMID:8967950
  description: >-
    The constitutive Hoxb1 knockout is the model the human phenotype was
    explicitly said to recapitulate. It shows the r4 identity failure and the
    facial branchiomotor neuron migration defect that lead to loss of the facial
    motor nerve.
  modeled_mechanisms:
  - target: Mis-specification and Failed Migration of Facial Branchiomotor Neurons
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      DiI lineage tracing in the null embryo shows the r4-derived facial
      branchiomotor and contralateral vestibuloacoustic neurons differentiating
      but failing to migrate, which is the mechanism this node asserts.
    limitations: >-
      The model is a constitutive null, whereas most human alleles are missense
      substitutions in the homeodomain with residual, allele-specific DNA
      binding. Mouse facial branchiomotor migration from r4 into r5 is also a
      developmental event that cannot be observed in patients, so the human
      counterpart is inferred from the shared clinical endpoint.
    readouts:
    - name: DiI-traced position of r4-derived FBM and CVA neurons
      target: Mis-specification and Failed Migration of Facial Branchiomotor Neurons
      direction: ALTERED
      interpretation: >-
        Neurons are present but mislocated, distinguishing a migration defect
        from a neurogenesis defect.
      evidence:
      - reference: PMID:8967950
        reference_title: "Altered segmental identity and abnormal migration of motor neurons in mice lacking Hoxb-1."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In mutants, motor neurons differentiate but the CVA and FBM neurons fail to migrate into their proper positions."
        explanation: The lineage-tracing readout behind this node.
  evidence:
  - reference: PMID:22770981
    reference_title: "HOXB1 founder mutation in humans recapitulates the phenotype of Hoxb1-/- mice."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The resulting phenotype includes bilateral facial palsy, hearing loss, and strabismus and correlates extensively with the previously reported Hoxb1(-/-) mouse phenotype."
    explanation: The human-to-mouse phenotype correspondence is what licenses treating this model as informative for HCFP3.
- name: Neural-crest-conditional Hoxb1 mouse
  species: Mouse
  genotype: Hoxb1 conditional deletion in neural crest
  publication: PMID:15198977
  description: >-
    Conditional deletion restricted to neural crest separates the
    crest-autonomous requirement from the motor-neuron-autonomous one, which is
    the experiment that establishes the second arm of this entry's pathograph.
  modeled_mechanisms:
  - target: Loss of r4-Derived Neural Crest Support of the VIIth Nerve
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Tissue-restricted deletion shows the VIIth nerve circuitry requires HOXB1
      in r4-derived crest independently of its requirement in the motor neurons.
    limitations: >-
      Human HCFP3 is a germline biallelic lesion affecting both compartments at
      once, so the conditional model demonstrates that the crest arm is
      sufficient to disturb the nerve but says nothing about its relative
      contribution in patients.
    readouts:
    - name: Formation and maintenance of VIIth nerve circuitry after crest-restricted deletion
      target: Loss of r4-Derived Neural Crest Support of the VIIth Nerve
      direction: DECREASED
      interpretation: >-
        The nerve circuitry is disturbed by a lesion confined to the crest
        lineage.
      evidence:
      - reference: PMID:15198977
        reference_title: "Hoxb1 functions in both motoneurons and in tissues of the periphery to establish and maintain the proper neuronal circuitry."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "By conditionally deleting the Hoxb1 locus in neural crest, we demonstrate that Hoxb1 is also required in r4-derived neural crest to facilitate and maintain formation of the VIIth nerve circuitry."
        explanation: The conditional-deletion readout behind this node.
treatments:
- name: Symptomatic and Supportive Management
  description: >-
    No disease-modifying therapy exists. Management is symptomatic and
    preventive, and the counselling value of the molecular diagnosis is
    substantial because the deficit is congenital and non-progressive.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:38203298
    reference_title: "Expanding the Phenotype of Hereditary Congenital Facial Paresis Type 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The management of this condition primarily involves a symptomatic and preventive approach, as no specific pathogenetic therapy has been developed thus far."
    explanation: States plainly that management is symptomatic and that no targeted therapy exists.
  target_mechanisms:
  - target: Congenital Bilateral Facial Palsy
    description: >-
      Supportive care addresses the consequences of the facial weakness; it does
      not act on the developmental lesion.
- name: Genetic Counseling
  description: >-
    Autosomal recessive recurrence counselling, and reassurance about the
    non-progressive natural history. In the reported adult case the molecular
    diagnosis ended years of misdiagnosis as facioscapulohumeral muscular
    dystrophy and resolved the patient's pregnancy-planning concerns.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:38203298
    reference_title: "Expanding the Phenotype of Hereditary Congenital Facial Paresis Type 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, the patient faces no contraindications for childbirth, and there is a low risk of transmitting the condition to offspring."
    explanation: The specific counselling content that follows from recessive inheritance.
progression:
- phase: Congenital and non-progressive
  notes: >-
    The deficit is present at birth and does not progress. Because the lesion is
    one of embryonic specification, no new deficits are expected to emerge.
  evidence:
  - reference: PMID:38203298
    reference_title: "Expanding the Phenotype of Hereditary Congenital Facial Paresis Type 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given that HCFP3 is a congenital disorder associated with cranial nerves, we anticipate no progression of the muscle weakness or the emergence of new symptoms."
    explanation: Explicit statement of the non-progressive natural history.
differential_diagnoses:
- name: Moebius syndrome
  description: >-
    Shares congenital facial palsy but adds limited ocular abduction from sixth
    nerve involvement. Screening a large cohort of patients diagnosed with
    Moebius syndrome or HCFP found a HOXB1 variant only in an HCFP case, not in
    the Moebius cases.
  evidence:
  - reference: PMID:27144914
    reference_title: "Homozygous HOXB1 loss-of-function mutation in a large family with hereditary congenital facial paresis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Möbius syndrome shares facial palsy with HCFP, but is additionally characterized by limited abduction of the eye(s)."
    explanation: The discriminating clinical sign between the two entities.
  - reference: PMID:26007620
    reference_title: "A new hereditary congenital facial palsy case supports arg5 in HOX-DNA binding domain as possible hot spot for mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We screened 95 sporadic patients diagnosed as MBS or HCFP for mutations in HOXB1. A novel homozygous alteration was identified in one HCFP case"
    explanation: A cohort screen in which HOXB1 accounted for an HCFP case and not the Moebius cases, supporting the separation.
- name: Facioscapulohumeral muscular dystrophy
  description: >-
    A real diagnostic trap rather than a theoretical one. Facial weakness with
    neck and shoulder-girdle complaints led to a years-long FSHD misdiagnosis in
    a molecularly confirmed HCFP3 patient before D4Z4 sizing and exome
    sequencing corrected it.
  evidence:
  - reference: PMID:38203298
    reference_title: "Expanding the Phenotype of Hereditary Congenital Facial Paresis Type 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For many years, she was misdiagnosed with facio-scapulo-humeral muscular dystrophy, due to complaints of shoulder girdle and neck muscle weakness."
    explanation: Documents the misdiagnosis this differential exists to prevent.
diagnosis:
- name: Exome sequencing for biallelic HOXB1 variants
  description: >-
    Molecular confirmation is by exome or targeted sequencing showing biallelic
    HOXB1 variants. Phase matters, because the first compound heterozygous case
    required read-level analysis to show the two variants were in trans, and
    paternity testing to establish that one had arisen de novo.
  evidence:
  - reference: PMID:38203298
    reference_title: "Expanding the Phenotype of Hereditary Congenital Facial Paresis Type 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an analysis of the sequence reads demonstrated that both variants were in trans"
    explanation: Shows the phasing step required to call biallelic status for nearby variants.
- name: Blink reflex testing
  description: >-
    Electrophysiological localization. Bilateral absence of all blink reflex
    components indicates impairment at the facial nerve nuclei rather than a
    muscular or neuromuscular-junction cause, and limb electrodiagnostics are
    normal.
  evidence:
  - reference: PMID:38203298
    reference_title: "Expanding the Phenotype of Hereditary Congenital Facial Paresis Type 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Comprehensive electrodiagnostic testing was conducted, showing no signs of peripheral neuropathy and any neurogenic or myogenic changes in the limb muscles."
    explanation: The normal limb study is what makes the isolated blink-reflex abnormality localizing.
discussions:
- discussion_id: hcfp3_esodeviation_outside_r4
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does esodeviation occur in HCFP3 when HOXB1 acts in rhombomere 4 and the
    ocular motor nuclei do not derive from it?
  attaches_to:
  - phenotypes#Esotropia
  rationale: >-
    Esodeviation is reported in 44% of published cases, which is too frequent to
    dismiss, yet the r4 lineage does not supply the abducens or oculomotor
    nuclei. Either mutant HOXB1 isoforms act outside r4, or the deviation is a
    secondary consequence of the facial and orbital phenotype. The published
    suggestion is the former, and it is explicitly speculative.
  evidence:
  - reference: PMID:38203298
    reference_title: "Expanding the Phenotype of Hereditary Congenital Facial Paresis Type 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This prompts speculation that certain mutant isoforms of HOXB1 may influence other cranial nerves."
    explanation: The authors themselves frame this as speculation, which is the gap this entry records.
- discussion_id: hcfp3_neck_shoulder_weakness
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is proximal neck and shoulder-girdle weakness part of the HCFP3 phenotype?
  attaches_to:
  - phenotypes#Congenital Bilateral Facial Palsy
  rationale: >-
    A single molecularly confirmed patient had objectively measured neck flexor
    and extensor weakness with sternocleidomastoid and trapezius hypotrophy on
    MRI, and no alternative cause was found after excluding FSHD, myotonic
    dystrophy type 2 and myasthenia. The finding is not curated as a phenotype
    of the disease here because it rests on one patient and the authors
    themselves ask for more data.
  evidence:
  - reference: PMID:38203298
    reference_title: "Expanding the Phenotype of Hereditary Congenital Facial Paresis Type 3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We speculate that neck weakness might be a component of HCFP3, yet we acknowledge that additional data are needed to provide concrete evidence of this novel clinical association."
    explanation: States the uncertainty directly, which is why this is a gap rather than a curated phenotype.

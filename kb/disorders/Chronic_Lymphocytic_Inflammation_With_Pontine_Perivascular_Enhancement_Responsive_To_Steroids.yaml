    explanation: >-
      Documents myelopathic involvement as an occasional and subsequent rather than
      presenting feature.
- category: Imaging
  name: Pontine perivascular gadolinium enhancement
  description: >
    The radiological signature: symmetric curvilinear and punctate gadolinium enhancement
    peppering the pons and extending into medulla, middle cerebellar peduncle, cerebellum,
    midbrain and occasionally cord. Unlike the clinical features, this is discriminating -
    provided the size and T2 constraints from the 2017 criteria are applied.
  phenotype_term:
    preferred_term: Abnormal brainstem MRI signal intensity
    term:
      id: HP:0012747
      label: Abnormal brainstem MRI signal intensity
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:20639547
    reference_title: "Chronic lymphocytic inflammation with pontine perivascular enhancement responsive to steroids (CLIPPERS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients had symmetric curvilinear gadolinium enhancement peppering the pons and
      extending variably into the medulla, brachium pontis, cerebellum, midbrain and
      occasionally spinal cord.
    explanation: >-
      Documents the enhancement pattern and its anatomical distribution in every patient of
      the founding cohort.
diagnosis:
- name: Contrast-enhanced brain MRI with size and T2 constraints
  description: >
    MRI is the discriminating test, but only when read against the 2017 criteria rather than
    for the enhancement pattern alone: enhancing nodules must be under 3 mm, without ring
    enhancement or mass effect, and the T2 abnormality must not significantly exceed the T1
    enhancement. Those constraints exist because the gross pattern alone had been letting
    other diseases in.
  evidence:
  - reference: PMID:29050399
    reference_title: "Diagnostic criteria for chronic lymphocytic inflammation with pontine perivascular enhancement responsive to steroids (CLIPPERS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the lack of formalized diagnostic criteria has led to reports of patients with
      dissimilar features purported to have CLIPPERS
    explanation: >-
      States the problem the quantitative imaging constraints were written to solve, which
      is why the constraints rather than the pattern are the diagnostic content.
- name: Brain biopsy
  description: >
    Biopsy shows the perivascular CD3-positive T-cell infiltrate and, critically, excludes
    lymphoma, granulomatous disease, infection and vasculitis. Because no biomarker exists
    and because CNS lymphoma has repeatedly declared itself late in patients who initially
    met every CLIPPERS criterion, there is a published argument for biopsying early rather
    than after steroid failure.
  evidence:
  - reference: PMID:35126669
    reference_title: "Brain biopsy in patients with CLIPPERS syndrome: why and when."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hence, we propose that in the absence of other diagnostic markers, brain biopsy should
      be performed as early as possible in CLIPPERS patients.
    explanation: >-
      States the case for early biopsy and its premise - the absence of any diagnostic
      marker - which is the reason this test carries the diagnostic weight it does.
  - reference: PMID:35126669
    reference_title: "Brain biopsy in patients with CLIPPERS syndrome: why and when."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Yet diagnostic biomarkers are missing and other immune-mediated, (para-) infectious
      and malignant causes mimic CLIPPERS-like MRI presentations.
    explanation: >-
      Records that no biomarker exists and that the MRI appearance is mimicked by several
      disease classes, which is what leaves biopsy as the discriminating test.
treatments:
- name: High-Dose Glucocorticosteroid Therapy
  description: >
    High-dose corticosteroids produce a marked clinical and radiological response, and in
    the 2017 series this was universal - 23 of 23 confirmed patients. It is not by itself a
    diagnostic test: 8 of 12 patients who turned out to have another disease also improved
    clinically on steroids, and the discriminating feature was radiological response, seen
    in only 2 of those 12.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: glucocorticoid
      term:
        id: CHEBI:24261
        label: glucocorticoid
  target_mechanisms:
  - target: Perivascular T-Lymphocytic Infiltration of Brainstem White Matter
    description: >-
      Corticosteroids suppress the T-cell infiltrate directly; the radiological and clinical
      improvement follows from that.
  evidence:
  - reference: PMID:29050399
    reference_title: "Diagnostic criteria for chronic lymphocytic inflammation with pontine perivascular enhancement responsive to steroids (CLIPPERS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Marked clinical and radiological corticosteroid responsiveness was observed in
      CLIPPERS (23/23)
    explanation: >-
      Establishes universal corticosteroid responsiveness in the confirmed cohort.
  - reference: PMID:29050399
    reference_title: "Diagnostic criteria for chronic lymphocytic inflammation with pontine perivascular enhancement responsive to steroids (CLIPPERS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Corticosteroid responsiveness was common but not universal in non-CLIPPERS [clinical
      improvement (8/12); radiological improvement (2/12); clinical worsening on
      discontinuation (3/8)].
    explanation: >-
      Records that steroid response occurs in the mimics too, which is why responsiveness
      cannot stand as a diagnostic criterion on its own despite being in the disease name.
- name: Chronic Steroid-Sparing Immunosuppression
  description: >
    Because relapse on taper is universal, patients require indefinite maintenance therapy,
    with steroid-sparing agents such as methotrexate used to limit cumulative corticosteroid
    toxicity. The evidence base is case series and case reports; there is no controlled
    trial and no agreed regimen.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Immunosuppressive Therapy
    term:
      id: NCIT:C15261
      label: Immunosuppressive Therapy
    therapeutic_agent:
    - preferred_term: methotrexate
      term:
        id: CHEBI:44185
        label: methotrexate
  target_mechanisms:
  - target: Perivascular T-Lymphocytic Infiltration of Brainstem White Matter
    description: >-
      Maintenance immunosuppression holds the same infiltrate suppressed once corticosteroids
      are withdrawn.
  evidence:
  - reference: PMID:20639547
    reference_title: "Chronic lymphocytic inflammation with pontine perivascular enhancement responsive to steroids (CLIPPERS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients routinely worsened following glucocorticosteroid taper and required chronic
      glucocorticosteroid or other immunosuppressive therapy.
    explanation: >-
      Establishes the need for chronic immunosuppression as a consequence of universal
      taper-dependent relapse.
discussions:
- discussion_id: clippers_upstream_trigger_unknown
  kind: KNOWLEDGE_GAP
  prompt: >-
    What recruits the perivascular T-cell infiltrate in CLIPPERS, and against what antigen?
  attaches_to:
  - pathophysiology#Perivascular T-Lymphocytic Infiltration of Brainstem White Matter
  rationale: >-
    The pathograph in this entry begins at a tissue-level observation because nothing
    upstream of it has been established. No antigen, autoantibody, infectious trigger or
    susceptibility locus is known, and no diagnostic biomarker exists. The inference that
    the process is immune-mediated rests on two indirect arguments - the T-cell predominance
    of the infiltrate and the corticosteroid responsiveness - rather than on an identified
    immune target. Supplying a plausible upstream node here would misrepresent the state of
    the evidence, so the gap is recorded instead. It is also the gap that matters
    practically: a biomarker derived from the trigger is what would resolve the mimic
    problem recorded in the sibling discussion.
- discussion_id: clippers_entity_versus_syndrome
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is CLIPPERS a single disease entity, or a syndrome that collects several overlapping
    diseases and the prodromal phases of some of them - CNS lymphoma in particular?
  attaches_to:
  - disease#Chronic Lymphocytic Inflammation With Pontine Perivascular Enhancement Responsive To Steroids
  rationale: >-
    This question was raised in print by the authors of the first fatal case and has not been
    settled. Patients meeting the full clinical, radiological and histopathological
    definition have gone on to biopsy-confirmed lymphomatoid granulomatosis and fatal CNS
    B-cell lymphoma, in one case after seven months of reliable steroid response. The 2017
    criteria sharpened the boundary but were derived from a cohort with a median follow-up
    of 44 months, and the concern is specifically about what declares itself later than
    that. The entity question bears directly on how this entry should be read: if CLIPPERS
    is partly a prodrome, then the pathograph above describes a common final inflammatory
    pattern rather than a disease mechanism.
  evidence:
  - reference: PMID:23649857
    reference_title: "Fatal B-cell lymphoma following chronic lymphocytic inflammation with pontine perivascular enhancement responsive to steroids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, the question remains whether CLIPPERS is an actual new disease entity or
      represents a syndrome that includes different overlapping diseases and their
      prestages.
    explanation: >-
      States the open question in the authors' own words, which is what this discussion
      records rather than resolves.
  - reference: PMID:23649857
    reference_title: "Fatal B-cell lymphoma following chronic lymphocytic inflammation with pontine perivascular enhancement responsive to steroids."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During follow-up, however, treatment failed, and he had a biopsy-confirmed diagnosis
      of lymphomatoid granulomatosis that evolved into fatal B-cell lymphoma of the central
      nervous system.
    explanation: >-
      Documents the specific course that motivates the question: a fully characterised
      CLIPPERS presentation that later proved to be an evolving lymphoma.
  - reference: PMID:36029706
    reference_title: "Clinical characteristics, management, and outcomes of CLIPPERS: A comprehensive systematic review of 140 patients from 100 studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sixteen percent of the cases were associated with malignancy, mostly hematologic
      malignancies.
    explanation: >-
      Moves the question from anecdote to a rate: one in six published cases carries a
      malignancy association, which is the scale of the problem the entity question is
      about.
  - reference: PMID:33658321
    reference_title: "Hemophagocytic Lymphohistiocytosis Gene Mutations in Adult Patients Presenting With CLIPPERS-Like Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During follow-up, 3 of them displayed atypical findings for CLIPPERS, including
      emergence of systemic non-Hodgkin lymphoma (1/3) and confluent gadolinium-enhancing
      lesions on brain MRI (3/3).
    explanation: >-
      Shows the same divergence inside the genetic subgroup: three of four mutated patients
      stopped looking like CLIPPERS on follow-up, so the subgroup may be a separate disease
      rather than a genetic form of this one.
environmental:
- name: Intracranial Epstein-Barr virus infection
  description: >
    EBV has been reported within the CNS of a CLIPPERS patient, and EBV-driven B-cell
    lymphoma has emerged during paediatric CLIPPERS. Whether EBV is a trigger, a passenger
    reactivating under immunosuppression, or a marker of the lymphoproliferative process
    that some CLIPPERS turns out to be, is unresolved - the reported case had been in
    remission from Hodgkin lymphoma for eleven years before presenting. Recorded as
    MODULATES rather than TRIGGERS for that reason.
  influences_mechanisms:
  - target: Perivascular T-Lymphocytic Infiltration of Brainstem White Matter
    environmental_effect: MODULATES
    causal_link_type: UNKNOWN
    description: >-
      Association only. No study has shown that EBV initiates or sustains the infiltrate.
    evidence:
    - reference: PMID:27861371
      reference_title: "Chronic lymphocytic inflammation with pontine perivascular enhancement responsive to steroids (CLIPPERS) with intracranial Epstein-Barr virus infection: A Case Report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        we report a case of CLIPPERS presenting with intracranial Epstein-Barr virus (EBV)
        infection and diffuse white matter involvement
      explanation: >-
        Documents the co-occurrence of intracranial EBV with CLIPPERS. Graded INDIRECT
        because a single case of co-occurrence does not establish that the virus acts on the
        mechanism.
  evidence:
  - reference: PMID:27861371
    reference_title: "Chronic lymphocytic inflammation with pontine perivascular enhancement responsive to steroids (CLIPPERS) with intracranial Epstein-Barr virus infection: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pathophysiology of CLIPPERS still remains unclear and the reports are quite few.
    explanation: >-
      Records the state of mechanistic knowledge against which this association has to be
      read: an unexplained disease, so an association is not yet a mechanism.

- name: Perivascular T-Lymphocytic Infiltration of Brainstem White Matter
  description: >
    The earliest event anyone has observed. Biopsy of affected brainstem white matter shows
    a dense perivascular infiltrate dominated by CD3-positive T lymphocytes, with mild
    B-lymphocyte and moderate macrophage components, present in meninges and in both white
    and grey matter. Granulomas, organisms, lymphoma and vasculitis are absent, which is
    what distinguishes the finding rather than what explains it. What recruits these cells,
    and against what, is unknown - see the knowledge gap attached to this node.
  biological_scale: TISSUE

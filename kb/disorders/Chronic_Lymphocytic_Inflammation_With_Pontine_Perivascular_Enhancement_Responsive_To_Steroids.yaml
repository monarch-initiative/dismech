      reference_title: "Hemophagocytic Lymphohistiocytosis Gene Mutations in Adult Patients Presenting With CLIPPERS-Like Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        To determine whether adult cases of Chronic Lymphocytic Inflammation with Pontine
        Perivascular Enhancement Responsive to Steroids (CLIPPERS) may be related to
        familial hemophagocytic lymphohistiocytosis (HLH) causes, we have screened patients
        with adult-onset CLIPPERS for mutations in primary HLH-associated genes.
      explanation: >-
        States the hypothesis this edge encodes. Graded INDIRECT because the study
        establishes an association between the genotype and the syndrome, not the causal
        path from degranulation failure to the brainstem infiltrate.
  evidence:
  - reference: PMID:33658321
    reference_title: "Hemophagocytic Lymphohistiocytosis Gene Mutations in Adult Patients Presenting With CLIPPERS-Like Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations involved in HLH were identified in 2 definite and 2 probable CLIPPERS (4/12).
    explanation: >-

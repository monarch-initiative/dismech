  No GeneReviews chapter applies: CLIPPERS is not a Mendelian disorder and no causal gene
  is known. `just check-genereviews` returns NO_CHAPTER for both collections against the
  committed Bookshelf index (snapshot 2026-09-10). The phenotype baseline used here is the
  2017 diagnostic-criteria series (PMID:29050399) together with the original 2010 cohort
  (PMID:20639547).
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    No population rate has been estimated and none exists in Orphanet or any registry. The
    largest synthesis is a systematic review that found 140 patients across 100 case reports
    and series published between the 2010 first description and January 2022. That count is
    the whole recorded world literature, not a sample of it, so it measures recognition
    rather than occurrence.
  evidence:
  - reference: PMID:36029706
    reference_title: "Clinical characteristics, management, and outcomes of CLIPPERS: A comprehensive systematic review of 140 patients from 100 studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 100 case reports and series including a total of 140 patients with
      CLIPPERS (mean age: 46±18 years and males were 60%).
    explanation: >-
      Gives the size of the entire published literature, together with the age and sex
      distribution, which is the basis for recording occurrence as a literature case count.
  - reference: PMID:29050399
    reference_title: "Diagnostic criteria for chronic lymphocytic inflammation with pontine perivascular enhancement responsive to steroids (CLIPPERS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CLIPPERS was diagnosed in 23 patients (18 male and five female) and 12 patients had a
      non-CLIPPERS diagnosis.
    explanation: >-
      Gives the largest single-centre confirmed count, and simultaneously the proportion of
      referrals that are not the disease, which is why any count reflects ascertainment.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Revised upward from the impression the founding cohort gives. Across the whole published
    literature the relapse rate is 59.2% and overall mortality is 10%, rising to 30% in the
    patients whose CLIPPERS is associated with malignancy. Every reported patient worsens
    when corticosteroids are withdrawn, so treatment is indefinite with the cumulative
    toxicity that implies, and repeated untreated attacks produce brainstem and cerebellar
    atrophy with permanent disability. A tenth of patients dying, in a condition usually
    described as steroid-responsive, is what places this at HIGH rather than MODERATE.
  evidence:
  - reference: PMID:36029706
    reference_title: "Clinical characteristics, management, and outcomes of CLIPPERS: A comprehensive systematic review of 140 patients from 100 studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The overall mortality rate was 10%, but mortality in patients with malignancy was 30%
      and it was 12% in patients with relapses.
    explanation: >-
      Gives the mortality figures overall and stratified by malignancy association, the
      principal basis for the HIGH burden assessment.
  - reference: PMID:36029706
    reference_title: "Clinical characteristics, management, and outcomes of CLIPPERS: A comprehensive systematic review of 140 patients from 100 studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The overall relapse rate was 59.2%, and the duration of steroid therapy was
      considerably shorter in the relapsed cases than in the non-relapsed
    explanation: >-
      Quantifies relapse and links it to the duration of the acute steroid course, which is
      the modifiable part of the burden.
  - reference: PMID:28110629
    reference_title: "CLIPPERS and the need for long-term immunosuppression."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Long-term immunosuppression appears to be mandatory in order to achieve sustained
      remission and prevent disability related to atrophy of the structures involved in
      repeated attacks.
    explanation: >-
      States the mechanism by which relapses convert into permanent disability - atrophy of
      the repeatedly inflamed structures - and the indefinite treatment it forces.
  - reference: PMID:29050399
    reference_title: "Diagnostic criteria for chronic lymphocytic inflammation with pontine perivascular enhancement responsive to steroids (CLIPPERS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      clinical worsening occurred in all 12 CLIPPERS cases when corticosteroids were
      discontinued
    explanation: >-
      Establishes the universal relapse on withdrawal that makes treatment indefinite.
genetic:
- name: PRF1
  gene_term:
    preferred_term: PRF1
    term:
      id: hgnc:9360
      label: PRF1
  relationship_type: SUSCEPTIBILITY
  notes: >
    Biallelic PRF1 mutations with reduced perforin expression in natural killer cells were
    found in three of twelve adult CLIPPERS patients who consented to genetic testing. None
    met systemic HLH criteria. Recorded as SUSCEPTIBILITY rather than CAUSATIVE because it
    remains unsettled whether these patients have CLIPPERS with a genetic modifier or a
    distinct, HLH-spectrum disease that presents as CLIPPERS - see the discussion attached
    to this entry.
  evidence:
  - reference: PMID:33658321
    reference_title: "Hemophagocytic Lymphohistiocytosis Gene Mutations in Adult Patients Presenting With CLIPPERS-Like Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three of them had biallelic PRF1 mutations with reduced perforin expression in natural
      killer cells.
    explanation: >-
      Documents biallelic PRF1 mutations with a demonstrated protein-level consequence in
      adult CLIPPERS patients.
- name: UNC13D
  gene_term:
    preferred_term: UNC13D
    term:
      id: hgnc:23147
      label: UNC13D
  relationship_type: SUSCEPTIBILITY
  notes: >
    Biallelic UNC13D mutations with impaired cytotoxic lymphocyte degranulation were found
    in a fourth adult CLIPPERS patient, and an independent report describes two further
    patients sharing a hypomorphic UNC13D variant in compound heterozygosity. UNC13D encodes
    Munc13-4, required for cytotoxic granule fusion - the same step perforin acts at, one
    stage earlier.
  evidence:
  - reference: PMID:33658321
    reference_title: "Hemophagocytic Lymphohistiocytosis Gene Mutations in Adult Patients Presenting With CLIPPERS-Like Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The remaining patient had biallelic UNC13D mutations with cytotoxic lymphocyte
      impaired degranulation.
    explanation: >-
      Documents biallelic UNC13D mutations with a functional degranulation defect in an
      adult CLIPPERS patient.
  - reference: PMID:41781714
    reference_title: "Two Cases of CLIPPERS-like Syndrome Sharing a Hypomorphic UNC13D Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report two patients with CLIPPERS-like brain MRI findings who carried the same
      missense UNC13D variant in one allele along with deleterious variants in the opposite
      allele.
    explanation: >-
      Independently replicates the UNC13D association in two further patients, which is what
      moves it beyond a single-cohort observation.
mechanistic_hypotheses:
- hypothesis_group_id: failed_cytotoxic_clearance
  hypothesis_label: Failed cytotoxic clearance sustains the infiltrate
  status: EMERGING
  description: >-
    That in at least a subgroup, CLIPPERS is driven by an inability of cytotoxic lymphocytes
    to kill. Biallelic PRF1 or UNC13D lesions leave an antigen-bearing target uncleared, so
    the T cell response against it never resolves and becomes the chronic perivascular
    infiltrate that defines the disease. The attraction of this model is that it explains
    the chronicity - a feature the "immune-mediated inflammation" account merely restates -
    and it predicts the steroid dependence, since suppression removes the response without
    removing its stimulus. It is EMERGING rather than established: the association rests on
    4 of 12 tested patients in one cohort plus two further UNC13D patients, no step between
    the degranulation defect and the brainstem lesion has been traced, and three of the four
    mutated patients subsequently showed features atypical for CLIPPERS.
  evidence:
  - reference: PMID:33658321
    reference_title: "Hemophagocytic Lymphohistiocytosis Gene Mutations in Adult Patients Presenting With CLIPPERS-Like Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our patients presenting with adult-onset CLIPPERS, one-third have HLH gene
      mutations. This genetic treatable condition should be searched in patients with
      CLIPPERS, especially in those presenting with atypical findings.
    explanation: >-
      States the frequency the hypothesis rests on and the authors' own clinical reading of
      it, including the qualifier that the association is strongest in atypical cases.
pathophysiology:
- name: Impaired Cytotoxic Lymphocyte Granule-Mediated Killing
  description: >
    Present in a genetic subgroup rather than in every patient. Roughly a third of adult
    CLIPPERS patients tested carry biallelic mutations in primary HLH genes - PRF1, whose
    product perforin punctures the target-cell membrane, or UNC13D, whose product Munc13-4
    is required one step earlier for cytotoxic granule fusion. Both lesions converge on the
    same failure: cytotoxic lymphocytes cannot kill. The proposed consequence is that
    antigen-bearing target cells are not cleared, so the T cell response against them
    persists instead of resolving - which would make the chronic perivascular infiltrate a
    consequence of failed killing rather than of excessive activation.

    Two things keep this node hypothetical rather than established. None of the mutated
    patients met systemic HLH criteria, so this is not simply HLH presenting in the brain.
    And three of the four went on to show findings atypical for CLIPPERS, one developing
    systemic non-Hodgkin lymphoma - which leaves open whether they had CLIPPERS at all.
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL

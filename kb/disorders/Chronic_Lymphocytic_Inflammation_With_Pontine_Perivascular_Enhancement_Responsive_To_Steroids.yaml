      The perivascular location of the infiltrate is what makes the enhancement pattern
      perivascular: inflammation sits on the small perforating vessels of the pons.
    evidence:
    - reference: PMID:20639547
      reference_title: "Chronic lymphocytic inflammation with pontine perivascular enhancement responsive to steroids (CLIPPERS)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Neuropathology of biopsy material from four patients demonstrated white matter

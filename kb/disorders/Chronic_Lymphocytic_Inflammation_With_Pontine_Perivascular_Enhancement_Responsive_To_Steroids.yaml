name: Chronic Lymphocytic Inflammation With Pontine Perivascular Enhancement Responsive To Steroids
creation_date: "2026-09-18T00:00:00Z"
category: Complex
synonyms:
- CLIPPERS
- CLIPPERS syndrome
- chronic lymphocytic inflammation with pontine perivascular enhancement responsive to steroids syndrome
description: >
  CLIPPERS is a chronic inflammatory disorder of the central nervous system that centres on
  the brainstem. It was defined in 2010 from eight patients as a triad: a clinical syndrome
  of episodic diplopia, facial paraesthesia and gait ataxia progressing to brainstem and
  sometimes myelopathic signs; a distinctive MRI appearance of symmetric curvilinear
  gadolinium enhancement "peppering" the pons and extending into medulla, middle cerebellar
  peduncles, cerebellum, midbrain and occasionally cord; and a perivascular, predominantly
  T-lymphocytic white-matter infiltrate on biopsy, without granulomas, organisms, lymphoma
  or vasculitis. Clinical and radiological response to high-dose glucocorticosteroids is
  marked, and relapse on taper is the rule rather than the exception, so patients need
  chronic immunosuppression.

  The name is a description, not a mechanism, and that is the honest state of the disease.
  The T-cell-predominant pathology and the corticosteroid responsiveness are together taken
  as evidence of an immune-mediated process, but no antigen, autoantibody, infectious
  trigger or genetic susceptibility locus has been established, and no diagnostic biomarker
  exists. This entry therefore models the pathograph from the earliest node anyone has
  actually observed - perivascular T-cell infiltration of brainstem white matter - and
  records the missing upstream trigger as an explicit knowledge gap rather than supplying a
  plausible one.

  CLIPPERS is also a diagnosis of exclusion with a documented and consequential mimic
  problem. Formal criteria published in 2017 were motivated by reports of dissimilar
  patients labelled CLIPPERS, and in that series 12 of 35 patients referred with suspected
  CLIPPERS had another diagnosis. Corticosteroid responsiveness does not settle it: most of
  the non-CLIPPERS patients improved on steroids too. Individual patients with textbook
  presentations have declared themselves months to years later as CNS B-cell lymphoma.
  Follow-up dependency is therefore part of the disease definition, not an afterthought.

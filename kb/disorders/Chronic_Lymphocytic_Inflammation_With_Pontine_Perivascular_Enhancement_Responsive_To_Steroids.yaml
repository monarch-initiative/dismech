- name: Blood-Brain Barrier Breakdown at Pontine Perforating Vessels
  description: >
    Inflammation of the small perforating vessels makes them leak gadolinium, producing the
    radiological signature of the disease: symmetric, curvilinear and punctate enhancement
    peppering the pons. The 2017 criteria sharpened this into discriminating features -
    homogeneous enhancing nodules under 3 mm without ring enhancement or mass effect, and
    T2 signal abnormality not significantly exceeding the T1 enhancement. Those two
    negatives are what separate the pattern from lymphoma and from demyelinating disease.
  biological_scale: TISSUE
  locations:
  - preferred_term: pons
    term:
      id: UBERON:0000988
      label: pons
  downstream:
  - target: Pontine perivascular gadolinium enhancement
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:29050399
    reference_title: "Diagnostic criteria for chronic lymphocytic inflammation with pontine perivascular enhancement responsive to steroids (CLIPPERS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CLIPPERS patients had brainstem predominant perivascular gadolinium enhancing lesions
      on magnetic resonance imaging that were discriminated from non-CLIPPERS by:
      homogenous gadolinium enhancing nodules <3 mm in diameter without ring-enhancement or
      mass effect, and homogenous T2 signal abnormality not significantly exceeding the T1
      enhancement.
    explanation: >-
      Gives the enhancement characteristics produced by this node, including the two
      negative features that carry the discriminating power.

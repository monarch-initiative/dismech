name: Primary Progressive Apraxia of Speech
creation_date: '2026-05-06T03:10:33Z'
category: Neurodegenerative Disease
parents:
- Neurodegenerative Disease
synonyms:
- PPAOS
disease_term:
  preferred_term: primary progressive apraxia of speech
  term:
    id: MONDO:0017803
    label: primary progressive apraxia of speech
description: Primary progressive apraxia of speech (PPAOS) is a sporadic neurodegenerative syndrome characterized by insidious-onset, gradually progressive impairment of motor speech planning and programming as the sole or predominant initial clinical feature in the absence of aphasia or generalized cognitive decline. Neuroimaging demonstrates focal atrophy and hypometabolism of the superior lateral premotor cortex and supplementary motor area, and autopsy studies most commonly reveal an underlying 4-repeat tauopathy (progressive supranuclear palsy or corticobasal degeneration).
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:34219857
      reference_title: 'Primary Progressive Apraxia of Speech: From Recognition to Diagnosis and Care.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Most published autopsied cases with an initial PPAOS diagnosis have had a 4-repeat (4R) tauopathy (a subcategory of proteinopathies), with CBD and PSP being the most common PPAOS-associated disease subtypes
      explanation: Establishes that primary progressive apraxia of speech is a neurodegenerative disorder most commonly driven by a 4-repeat tauopathy.
inheritance:
- name: Sporadic
  inheritance_term:
    preferred_term: Sporadic
    term:
      id: HP:0003745
      label: Sporadic
  description: Primary progressive apraxia of speech is typically sporadic and has not been associated with an increased risk of a high-penetrance causal mendelian mutation.
  evidence:
  - reference: PMID:34219857
    reference_title: 'Primary Progressive Apraxia of Speech: From Recognition to Diagnosis and Care.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: PPAOS was not found to be associated with increased risk of an underlying causal genetic mutation (Botha & Josephs, 2019; Flanagan et al., 2015).
    explanation: Demonstrates that PPAOS is predominantly sporadic without an established monogenic inheritance pattern.
prevalence:
- population: Estimated clinical population
  measure_type: POINT_PREVALENCE
  rate_per_100000: 2.0
  prevalence_class: BAND_1_9_PER_100000
  notes: Point prevalence is estimated at approximately 2 per 100,000 for isolated PPAOS and ~4.4 per 100,000 when progressive apraxia of speech with mild aphasia is included.
  evidence:
  - reference: PMID:34219857
    reference_title: 'Primary Progressive Apraxia of Speech: From Recognition to Diagnosis and Care.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: There have been no formal epidemiologic studies but PAOS prevalence has been estimated at about 4.4 per 100,000 if patients with PPAOS and PAOS with mild aphasia are included (Whitwell et al., 2015); the prevalence of PPAOS alone is probably closer to 2 per 100,000 (Botha & Utianski, 2020).
    explanation: Provides the published prevalence estimate of ~2 per 100,000 for isolated PPAOS.
progression:
- phase: Onset
  age_range: Late adulthood (typical onset 60s-70s; cohort mean 73 years, range 49-82)
  notes: Insidious onset of isolated apraxia of speech (phonetic, prosodic, or mixed) without aphasia or parkinsonism at initial presentation.
  evidence:
  - reference: PMID:22382356
    reference_title: 'Characterizing a neurodegenerative syndrome: primary progressive apraxia of speech.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'These subjects with primary progressive apraxia of speech included eight females and four males, with a mean age of onset of 73 years (range: 49-82).'
    explanation: Documents late-adulthood onset (mean 73 years, range 49-82) in the foundational PPAOS cohort.
- phase: Secondary motor and oculomotor evolution
  age_range: Approximately 5 years after symptom onset
  notes: Evolution into a progressive supranuclear palsy-like motor syndrome with extrapyramidal signs, bradykinesia, dysarthria, supranuclear gaze palsy, dysphagia, and limb apraxia.
  evidence:
  - reference: PMID:25113789
    reference_title: The evolution of primary progressive apraxia of speech.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These findings demonstrate that some subjects with primary progressive apraxia of speech will rapidly evolve and develop a devastating progressive supranuclear palsy-like syndrome ∼ 5 years after onset, perhaps related to progressive involvement of neocortex, basal ganglia and midbrain.
    explanation: Establishes the ~5-year evolution from isolated speech apraxia to a PSP-like motor syndrome.
- phase: Advanced stage and survival
  age_range: Median survival ~9 years from symptom onset (5.9 years from first visit)
  notes: Progressive loss of functional oral speech toward mutism with severe parkinsonism and dysphagia; median survival is approximately 9 years.
  evidence:
  - reference: PMID:34219857
    reference_title: 'Primary Progressive Apraxia of Speech: From Recognition to Diagnosis and Care.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Median survival time from the first visit was 5.9 years for PPAOS, 4.3 years for AOS+PAA, and 5.3 years for PAA, which translates to about 9 year survival for PPAOS, and 7-8 year survival for AOS+PAA and PAA.
    explanation: Documents overall survival duration from symptom onset in PPAOS.
has_subtypes:
- name: Phonetic
  display_name: Phonetic PPAOS
  description: A subtype (formerly Type 1) in which articulatory distortions, distorted sound substitutions or additions, and articulatory groping predominate; associated with more rapid emergence of cortical and motor deficits.
  evidence:
  - reference: PMID:34219857
    reference_title: 'Primary Progressive Apraxia of Speech: From Recognition to Diagnosis and Care.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The Phonetic subtype is characterised by a predominance of articulatory distortions, distorted sound substitutions or additions, and articulatory groping and attempts at self-correction of phonetic level errors.
    explanation: Defines the phonetic subtype of PPAOS.
- name: Prosodic
  display_name: Prosodic PPAOS
  description: A subtype (formerly Type 2) in which slow speech rate and prosodically segmented syllable-by-syllable speech predominate; more frequently evolves into a progressive supranuclear palsy-like syndrome.
  evidence:
  - reference: PMID:34219857
    reference_title: 'Primary Progressive Apraxia of Speech: From Recognition to Diagnosis and Care.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The Prosodic subtype is characterised by a predominance of slow rate and segmentation (lengthened intersegment durations) between words or between syllables within multisyllabic words.
    explanation: Defines the prosodic subtype of PPAOS.
- name: Mixed
  display_name: Mixed PPAOS
  description: A subtype in which neither phonetic nor prosodic abnormalities predominate, or when severe impairment precludes distinction.
  evidence:
  - reference: PMID:34219857
    reference_title: 'Primary Progressive Apraxia of Speech: From Recognition to Diagnosis and Care.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In a third subtype, called Mixed, neither phonetic nor prosodic abnormalities predominate.
    explanation: The clinical care review explicitly recognizes a Mixed PPAOS subtype when phonetic and prosodic abnormalities are not clearly predominant.
pathophysiology:
- name: Four-Repeat Tauopathy Neurodegeneration
  description: Most autopsied PPAOS cases are caused by an underlying 4-repeat (4R) tauopathy, most commonly corticobasal degeneration (CBD) or progressive supranuclear palsy (PSP), which drives neuronal and glial tau inclusion formation and initiates selective neurodegeneration in premotor and supplementary motor speech cortices. A minority of patients show Pick disease (3R tau) or non-tau / Alzheimer disease biomarker profiles, though isolated AOS at onset remains most strongly predictive of 4R tauopathy.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: glial cell
    term:
      id: CL:0000125
      label: glial cell
  biological_processes:
  - preferred_term: inclusion body assembly
    term:
      id: GO:0070841
      label: inclusion body assembly
  - preferred_term: neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
  evidence:
  - reference: PMID:38007664
    reference_title: Amyloid and Tau PET Positivity in Progressive Agrammatic Aphasia and Apraxia of Speech.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These patients typically have an underlying 4-repeat tauopathy, although they sometimes show evidence of amyloid-β and tau deposition on PET, suggesting Alzheimer's disease (AD).
    explanation: The PET/autopsy study supports a frequent 4-repeat tauopathy etiology in progressive apraxia of speech while noting occasional amyloid-beta/AD biomarker heterogeneity.
  - reference: PMID:34219857
    reference_title: 'Primary Progressive Apraxia of Speech: From Recognition to Diagnosis and Care.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Most published autopsied cases with an initial PPAOS diagnosis have had a 4-repeat (4R) tauopathy (a subcategory of proteinopathies), with CBD and PSP being the most common PPAOS-associated disease subtypes (e.g., (Boeve et al., 2003; Gorno-Tempini et al., 2011; Josephs et al., 2005; Josephs & Duffy, 2008; Josephs et al., 2016; Tetzloff, Duffy, Strand, et al., 2018)). A few cases have had Pick disease pathology (a 3R tauopathy), or even non-tau pathology, but it is uncertain if the AOS was the only speech, language or nonaphasic-cognitive disorder at onset in those cases (Botha & Josephs, 2019).
    explanation: Summarizes autopsy evidence linking PPAOS predominantly to PSP/CBD-spectrum 4-repeat tauopathy while noting rare 3R-tau or non-tau cases.
  downstream:
  - target: Premotor and Supplementary Motor Cortex Degeneration
    description: PSP/CBD-spectrum 4-repeat tauopathy is the common upstream pathology driving focal degeneration of the superior lateral premotor and supplementary motor speech network.
    evidence:
    - reference: PMID:34219857
      reference_title: 'Primary Progressive Apraxia of Speech: From Recognition to Diagnosis and Care.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Most published autopsied cases with an initial PPAOS diagnosis have had a 4-repeat (4R) tauopathy (a subcategory of proteinopathies), with CBD and PSP being the most common PPAOS-associated disease subtypes
      explanation: Links underlying 4R tauopathy to the clinical PPAOS motor-speech network syndrome.
- name: Premotor and Supplementary Motor Cortex Degeneration
  description: Focal grey-matter atrophy, cortical hypometabolism, and white-matter tract degeneration of the superior lateral premotor cortex, supplementary motor area (SMA), and superior longitudinal fasciculus impair the planning, sequencing, and programming of articulatory motor commands.
  cell_types:
  - preferred_term: cerebral cortex neuron
    term:
      id: CL:0010012
      label: cerebral cortex neuron
  locations:
  - preferred_term: premotor cortex
    term:
      id: UBERON:0016634
      label: premotor cortex
  - preferred_term: supplemental motor cortex
    term:
      id: UBERON:0016636
      label: supplemental motor cortex
  evidence:
  - reference: PMID:22382356
    reference_title: 'Characterizing a neurodegenerative syndrome: primary progressive apraxia of speech.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Voxel-based morphometry of grey matter revealed focal atrophy of superior lateral premotor cortex and supplementary motor area.
    explanation: The foundational clinical-imaging cohort localizes PPAOS to premotor and supplementary motor speech networks.
  - reference: PMID:34219857
    reference_title: 'Primary Progressive Apraxia of Speech: From Recognition to Diagnosis and Care.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Studies consistently point to grey and white matter involvement in cortical and subcortical regions that are linked to speech planning/programming, production, and monitoring. The brunt of cortical abnormalities usually are in the superior lateral premotor area and SMA of the left or left greater than right hemisphere, with white matter loss extending to the inferior premotor cortex and body of the corpus callosum.
    explanation: Confirms across multimodal neuroimaging that early PPAOS neurodegeneration selectively targets the superior lateral premotor cortex and SMA.
  downstream:
  - target: Speech Apraxia
    description: Degeneration of premotor and supplementary motor speech networks produces progressive impairment of speech motor planning and programming.
    evidence:
    - reference: PMID:22382356
      reference_title: 'Characterizing a neurodegenerative syndrome: primary progressive apraxia of speech.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Voxel-based morphometry of grey matter revealed focal atrophy of superior lateral premotor cortex and supplementary motor area.
      explanation: Focal atrophy of the superior lateral premotor cortex and supplementary motor area directly underlies progressive speech apraxia.
  - target: Dysarthria
    description: Spread of neurodegeneration into primary motor execution pathways is associated with progressive dysarthria over the longitudinal disease course.
    evidence:
    - reference: PMID:34219857
      reference_title: 'Primary Progressive Apraxia of Speech: From Recognition to Diagnosis and Care.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Dysarthria frequently develops in PPAOS, although it nearly always remains less severe than the AOS. Overall, it was present at initial assessment in 30% of PPAOS cases in our current research cohort.
      explanation: Documents frequent development of dysarthria during PPAOS evolution.
  - target: Subcortical, Brainstem, and Perisylvian Network Spread
    description: Over longitudinal follow-up, neurodegeneration spreads from the superior premotor cortex and SMA into the prefrontal and motor cortices, left inferior frontal lobe, basal ganglia, thalamus, and midbrain.
    evidence:
    - reference: PMID:25113789
      reference_title: The evolution of primary progressive apraxia of speech.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Increased rates of brain atrophy over time were observed throughout the premotor cortex, as well as prefrontal cortex, motor cortex, basal ganglia and midbrain, while white matter tract degeneration spread into the splenium of the corpus callosum and motor cortex white matter.
      explanation: Demonstrates longitudinal anatomical spread of cortical premotor/SMA atrophy into the basal ganglia, midbrain, and motor/prefrontal cortices.
- name: Subcortical, Brainstem, and Perisylvian Network Spread
  description: Over ~5 years of longitudinal progression, accelerated atrophy, white-matter tract degeneration, and hypometabolism spread from the premotor cortex and SMA into the basal ganglia, thalamus, midbrain, motor cortex white matter, and left inferior frontal lobe, driving the emergence of extrapyramidal motor signs, bulbar dysphagia, and late-onset nonfluent aphasia.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: collection of basal ganglia
    term:
      id: UBERON:0010011
      label: collection of basal ganglia
  - preferred_term: midbrain
    term:
      id: UBERON:0001891
      label: midbrain
  evidence:
  - reference: PMID:25113789
    reference_title: The evolution of primary progressive apraxia of speech.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Increased rates of brain atrophy over time were observed throughout the premotor cortex, as well as prefrontal cortex, motor cortex, basal ganglia and midbrain, while white matter tract degeneration spread into the splenium of the corpus callosum and motor cortex white matter.
    explanation: Demonstrates longitudinal spread from premotor/motor cortex into prefrontal cortex, basal ganglia, and midbrain underlying motor progression.
  - reference: PMID:34219857
    reference_title: 'Primary Progressive Apraxia of Speech: From Recognition to Diagnosis and Care.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Longitudinal imaging demonstrates increased atrophy and hypometabolism in the same regions, with spread into the left inferior frontal lobe, basal ganglia and thalamus in those who develop aphasia over time.
    explanation: Demonstrates longitudinal spread of atrophy and hypometabolism into the left inferior frontal lobe, basal ganglia, and thalamus.
  downstream:
  - target: Extrapyramidal Signs
    description: Caudal spread of neurodegeneration into the striatum and midbrain produces progressive parkinsonian/extrapyramidal motor signs.
    evidence:
    - reference: PMID:25113789
      reference_title: The evolution of primary progressive apraxia of speech.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: All subjects developed extrapyramidal signs.
      explanation: Longitudinal follow-up confirms universal development of extrapyramidal signs as pathology spreads to striatum and midbrain.
  - target: Dysphagia
    description: Progressive involvement of corticobulbar, basal ganglia, and brainstem motor pathways produces swallowing impairment with choking as patients evolve toward a PSP-like syndrome.
    evidence:
    - reference: PMID:25113789
      reference_title: The evolution of primary progressive apraxia of speech.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: they showed a combination of severe parkinsonism, near mutism, dysphagia with choking, vertical supranuclear gaze palsy or slowing, balance difficulties with falls and urinary incontinence
      explanation: Documents the emergence of dysphagia with choking alongside severe parkinsonism and brainstem oculomotor signs during longitudinal progression.
  - target: Aphasia
    description: Spread of atrophy and hypometabolism into the left inferior frontal lobe, basal ganglia, and thalamus leads to the emergence of nonfluent/agrammatic aphasia over time.
    evidence:
    - reference: PMID:34219857
      reference_title: 'Primary Progressive Apraxia of Speech: From Recognition to Diagnosis and Care.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Longitudinal imaging demonstrates increased atrophy and hypometabolism in the same regions, with spread into the left inferior frontal lobe, basal ganglia and thalamus in those who develop aphasia over time.
      explanation: Directly links spread of neurodegeneration into the left inferior frontal lobe, basal ganglia, and thalamus to the longitudinal emergence of aphasia in PPAOS.
phenotypes:
- name: Speech Apraxia
  category: Neurologic
  diagnostic: true
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Speech apraxia
    term:
      id: HP:0011098
      label: Speech apraxia
  description: Impaired planning and programming of speech movements produces distorted, effortful, or segmented speech and is the obligate initial defining feature of PPAOS.
  evidence:
  - reference: PMID:22382356
    reference_title: 'Characterizing a neurodegenerative syndrome: primary progressive apraxia of speech.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Apraxia of speech is a disorder of speech motor planning and/or programming that is distinguishable from aphasia and dysarthria.
    explanation: The foundational cohort defines the motor-speech planning impairment that forms the core phenotype.
  - reference: PMID:34219857
    reference_title: 'Primary Progressive Apraxia of Speech: From Recognition to Diagnosis and Care.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: PPAOS can be more narrowly defined as AOS of insidious onset and gradual progression, in the absence of more than equivocal evidence of aphasia, nonaphasic cognitive impairments or sensorimotor deficits that meet criteria for another specific neurodegenerative disease or other explanatory condition at the time of diagnosis.
    explanation: The review provides diagnostic framing for progressive apraxia of speech as the dominant presenting feature.
- name: Dysarthria
  category: Neurologic
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Dysarthria
    term:
      id: HP:0001260
      label: Dysarthria
  description: Dysarthric speech (often spastic or hypokinetic) frequently emerges as the neurodegenerative syndrome progresses.
  evidence:
  - reference: PMID:34219857
    reference_title: 'Primary Progressive Apraxia of Speech: From Recognition to Diagnosis and Care.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Dysarthria can be present but cannot be more severe than the AOS at presentation.
    explanation: Dysarthria can accompany PPAOS, but the definition requires apraxia of speech to remain the predominant motor-speech deficit at presentation.
  - reference: PMID:34219857
    reference_title: 'Primary Progressive Apraxia of Speech: From Recognition to Diagnosis and Care.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Dysarthria frequently develops in PPAOS, although it nearly always remains less severe than the AOS. Overall, it was present at initial assessment in 30% of PPAOS cases in our current research cohort.
    explanation: Demonstrates that dysarthria frequently develops in PPAOS patients.
- name: Aphasia
  category: Neurologic
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Aphasia
    term:
      id: HP:0002381
      label: Aphasia
  description: Some patients develop mild aphasic language impairment several years into progression, although apraxia of speech remains predominant.
  evidence:
  - reference: PMID:34219857
    reference_title: 'Primary Progressive Apraxia of Speech: From Recognition to Diagnosis and Care.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: By definition, aphasia is not present in people with PPAOS at the time of initial diagnosis. It may not emerge for several years, may remain mild once it does, and with progression the AOS usually remains predominant.
    explanation: The review supports aphasia as a possible later feature rather than a defining initial feature.
- name: Extrapyramidal Signs
  category: Neurologic
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Extrapyramidal signs
    term:
      id: HP:0002071
      label: Abnormality of extrapyramidal motor function
  description: Parkinsonian/extrapyramidal motor features (such as bradykinesia and rigidity) emerge during disease progression in virtually all longitudinally followed patients.
  evidence:
  - reference: PMID:25113789
    reference_title: The evolution of primary progressive apraxia of speech.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All subjects developed extrapyramidal signs.
    explanation: The longitudinal cohort documents extrapyramidal progression across all followed subjects.
- name: Dysphagia
  category: Neurologic
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Dysphagia
    term:
      id: HP:0002015
      label: Dysphagia
  description: Swallowing impairment with choking occurs frequently as patients evolve toward a PSP-like syndrome.
  evidence:
  - reference: PMID:25113789
    reference_title: The evolution of primary progressive apraxia of speech.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: they showed a combination of severe parkinsonism, near mutism, dysphagia with choking, vertical supranuclear gaze palsy or slowing, balance difficulties with falls and urinary incontinence
    explanation: The longitudinal cohort supports dysphagia in the PSP-like progression subset of PPAOS rather than as a universal presenting feature.
diagnosis:
- name: Structural MRI Localization
  description: Voxel-based morphometry and related MRI analyses can show focal atrophy in superior lateral premotor cortex and supplementary motor area, supporting a motor-speech network localization.
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  results: Focal superior lateral premotor cortex and supplementary motor area atrophy.
  evidence:
  - reference: PMID:22382356
    reference_title: 'Characterizing a neurodegenerative syndrome: primary progressive apraxia of speech.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Voxel-based morphometry of grey matter revealed focal atrophy of superior lateral premotor cortex and supplementary motor area.
    explanation: Supports MRI-based localization of the PPAOS neurodegenerative substrate.
- name: FDG-PET Hypometabolism Localization
  description: FDG-PET can show hypometabolism in the same superior lateral premotor and supplementary motor regions implicated by structural imaging.
  diagnosis_term:
    preferred_term: positron emission tomography procedure
    term:
      id: NCIT:C17007
      label: Positron Emission Tomography
  results: Focal hypometabolism of superior lateral premotor cortex and supplementary motor area.
  evidence:
  - reference: PMID:22382356
    reference_title: 'Characterizing a neurodegenerative syndrome: primary progressive apraxia of speech.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: '[(18)F]-fluorodeoxyglucose positron emission tomography scans revealed focal hypometabolism of superior lateral premotor cortex and supplementary motor area'
    explanation: Supports FDG-PET as a functional imaging correlate of the premotor/SMA disease network.
differential_diagnoses:
- name: Primary Progressive Aphasia
  disease_term:
    preferred_term: primary progressive aphasia
    term:
      id: MONDO:0019806
      label: primary progressive aphasia
  description: Nonfluent/agrammatic primary progressive aphasia (nfvPPA) often co-occurs with apraxia of speech, whereas PPAOS is defined by isolated or predominant motor speech planning impairment without aphasia at presentation.
  distinguishing_features:
  - Absence of language/grammatical comprehension or production deficit (aphasia) on spoken and written language testing in PPAOS
  evidence:
  - reference: PMID:22382356
    reference_title: 'Characterizing a neurodegenerative syndrome: primary progressive apraxia of speech.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Apraxia of speech is a disorder of speech motor planning and/or programming that is distinguishable from aphasia and dysarthria.
    explanation: Establishes that apraxia of speech in PPAOS is clinically distinguishable from primary progressive aphasia.
- name: Progressive Supranuclear Palsy
  disease_term:
    preferred_term: progressive supranuclear palsy
    term:
      id: MONDO:0019037
      label: progressive supranuclear palsy
  description: Classic progressive supranuclear palsy presents with early vertical supranuclear gaze palsy and postural instability with falls, whereas PPAOS presents with isolated speech apraxia and only develops PSP-like features approximately 5 years later.
  distinguishing_features:
  - Isolated motor speech apraxia without early vertical gaze palsy or falls at initial presentation in PPAOS
  evidence:
  - reference: PMID:25113789
    reference_title: The evolution of primary progressive apraxia of speech.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In the other five there was a striking progression of symptoms that had evolved into a progressive supranuclear palsy-like syndrome; they showed a combination of severe parkinsonism, near mutism, dysphagia with choking, vertical supranuclear gaze palsy or slowing, balance difficulties with falls and urinary incontinence, and one was wheelchair bound.
    explanation: Documents the overlap and longitudinal evolution between PPAOS and progressive supranuclear palsy.
- name: Corticobasal Syndrome
  disease_term:
    preferred_term: corticobasal syndrome
    term:
      id: MONDO:0018696
      label: corticobasal syndrome
  description: Corticobasal syndrome presents with asymmetric cortical sensory/motor signs (ideomotor apraxia, alien limb, asymmetric rigidity/dystonia), which are absent at initial PPAOS diagnosis but can emerge during later evolution.
  distinguishing_features:
  - Absence of asymmetric limb rigidity, limb apraxia, dystonia, or cortical sensory loss at initial presentation in PPAOS
  evidence:
  - reference: PMID:34219857
    reference_title: 'Primary Progressive Apraxia of Speech: From Recognition to Diagnosis and Care.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Unlike in PSP, AOS and aphasia are common and sometimes among early signs of “typical” CBS (Blake et al., 2003; Gorno-Tempini et al., 2004). Similar to PSP, PPAOS can progress to a syndrome that meets criteria for a CBS diagnosis, and pathology consistent with CBD (Amici et al., 2006; Blake et al., 2003; Gorno-Tempini et al., 2006; Josephs & Duffy, 2008; Josephs, Petersen, et al., 2006; Kertesz et al., 2000; Tetzloff, Duffy, Strand, et al., 2018).
    explanation: Directly establishes the clinical and pathological overlap between PPAOS and corticobasal syndrome (CBS) / corticobasal degeneration (CBD), including longitudinal progression from initial PPAOS to CBS.
  - reference: PMID:34219857
    reference_title: 'Primary Progressive Apraxia of Speech: From Recognition to Diagnosis and Care.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Common manifestations of typical CBS include asymmetric limb rigidity and apraxia, and parkinsonism.
    explanation: Identifies the typical sensorimotor features of CBS (asymmetric limb rigidity, limb apraxia, and parkinsonism) that distinguish classic CBS from isolated PPAOS at baseline.
  - reference: PMID:34219857
    reference_title: 'Primary Progressive Apraxia of Speech: From Recognition to Diagnosis and Care.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: PPAOS can be more narrowly defined as AOS of insidious onset and gradual progression, in the absence of more than equivocal evidence of aphasia, nonaphasic cognitive impairments or sensorimotor deficits that meet criteria for another specific neurodegenerative disease or other explanatory condition at the time of diagnosis.
    explanation: Confirms that sensorimotor deficits meeting criteria for CBS are absent at the time of initial PPAOS diagnosis.

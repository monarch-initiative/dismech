notes: >-
  Scope. This entry covers the congenital, F2-linked disorder only. The acquired
  mimic lupus anticoagulant-hypoprothrombinaemia syndrome is antibody-mediated
  and is curated as a differential diagnosis, not a subtype. The common F2
  G20210A thrombophilia allele raises prothrombin and causes thrombosis; it is a
  different disease and is not modelled here.

  A third biochemical category, sometimes labelled type III, is described in the
  literature: dysprothrombin variants whose defect is resistance to inhibition by
  antithrombin, so they present with thrombosis rather than bleeding. It is not
  curated as a subtype because it is a within-type-II mechanistic subdivision of
  a handful of variants rather than an established third clinical form, and
  because no node in this entry models antithrombin inhibition. Do not confuse it
  with the Reduced Thrombomodulin-Dependent Protein C Activation node, which is a
  different anticoagulant arm.

  Module conformance. No conforms_to is declared. The two candidate modules were
  checked: `primary_hemostatic_plug_failure` explicitly excludes
  coagulation-factor deficiencies from its scope ("mucocutaneous bleeding alone
  is NOT sufficient to infer conformance: coagulation-factor deficiencies
  (hemophilia, plasma von Willebrand disease) ... all produce the same clinical
  output without a platelet primary-hemostatic component being lost"), and
  `thrombogenesis` models pathological intravascular thrombus formation, which is
  this disease's inverse. A shared coagulation-factor-deficiency module covering
  the common-pathway factor deficiencies would be a reasonable future addition;
  it does not exist yet.

  Umbilical stump bleeding was deliberately not curated as a phenotype. It is a
  classic sign of a rare bleeding disorder, but the sources reviewed here assign
  it specifically to factor XIII deficiency and afibrinogenaemia
  ("Bleeding from the umbilical stump shortly after birth is highly suggestive of
  factor XIII deficiency or afibrinogenemia", PMID:40747195), and no source
  reviewed reported it in factor II deficiency. Epistaxis and gingival bleeding
  are almost certainly part of the mucocutaneous picture but are recorded here
  only inside the aggregate "Recurrent mucocutaneous bleeding" phenotype, because
  no reviewed source names them for this disease specifically.

  Bleeding severity correlates only loosely with residual factor II activity.
  Thrombin generation assays outperform the PT and aPTT for detecting rare factor
  deficiencies and track bleeding severity better than factor activity does,
  which is consistent with this entry's model in which a single enzyme deficit
  propagates through five separate downstream branches.

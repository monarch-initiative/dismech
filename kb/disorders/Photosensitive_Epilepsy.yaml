notes: >-
  Sourcing. Drafted from primary literature (Takahashi 1999, Galizia et al.
  2015, Strigaro et al. 2015, Bai et al. 2019, Gurrell et al. 2019, and the
  2022 reflex-seizure scoping review), then cross-checked against a
  deep-research report generated with the falcon provider (Edison
  Scientific), committed as
  research/Photosensitive_Epilepsy-deep-research-falcon.md.

  Scope note on eye closure and self-induction. This entry models
  light-triggered and pattern-triggered photosensitivity. It does not model
  self-induced photosensitive epilepsy (Sunflower syndrome, MONDO:0100529),
  in which patients deliberately wave a hand in front of the eyes in bright
  light to self-elicit the response, as a separate subtype: that is a
  distinct behavioral entity layered on top of an underlying
  photosensitivity trait rather than a differently mechanistically triggered
  epilepsy, and it does not yet have its own dismech curation.

  What is deliberately not duplicated here. Five of the six named subtypes
  (photosensitive occipital lobe epilepsy, juvenile myoclonic epilepsy,
  Jeavons syndrome, Dravet syndrome, and the progressive myoclonic
  epilepsies) already have full, independently curated dismech entries. Each
  subtype block here is intentionally thin: it exists to place that entry in
  the photosensitive-epilepsy family via subtype_term and to describe only
  the photosensitivity-specific literature, not to re-derive the full
  pathophysiology, phenotype list, or treatment plan already curated in the
  linked file. A curator editing the photosensitivity content of, say,
  Dravet syndrome should edit both this subtype block and the corresponding
  section of Dravet_syndrome.yaml, since the schema does not provide
  inheritance between them (the same non-DRY relationship that conforms_to
  has to mechanism modules).
inheritance:
  - name: Genetically complex, polygenic trait with identified contributing loci
    description: >-
      Photosensitivity itself is a heritable EEG trait most consistent with
      complex, polygenic inheritance rather than a single Mendelian pattern.
      CHD2 is the best-established single-gene risk-factor contributor
      identified to date (see genetic section), but unique CHD2 variants
      explain only a minority of photosensitive-epilepsy cases, and the
      condition as a whole is genetically heterogeneous. Individual named
      subtypes carry their own, separately curated inheritance patterns in
      their own entries.
    evidence:
      - reference: PMID:25783594
        reference_title: CHD2 variants are a risk factor for photosensitivity in epilepsy.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We identified 11 unique variants in the 580 individuals with
          photosensitive epilepsies and 128 unique variants in the 34 427
          controls: unique CHD2 variation is over-represented in cases
          overall (P = 2.17 × 10(-5))
        explanation: >-
          Quantifies CHD2 as a statistically significant but partial
          contributor (11 of 580 cases carried a unique variant), supporting
          a complex rather than single-gene-necessary inheritance model for
          photosensitivity as a whole.
pathophysiology:
  - name: Reduced Alpha-Rhythm Network Inhibition
    biological_scale: TISSUE
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Excitation-Inhibition Imbalance"
    description: >-
      Simultaneous EEG-fMRI shows that photosensitive patients have reduced
      inhibition of the resting-state networks that generate the posterior
      alpha rhythm, the brain's normal idling rhythm, compared with both
      non-photosensitive epilepsy patients and healthy controls. This is a
      baseline network-level abnormality, present outside of stimulation, and
      is the excitation-inhibition-imbalance amplifier step that this entry's
      pathophysiology chain was previously missing: the acute hyperexcitable
      response to flickering light described in the next node is superimposed
      on a cortex whose inhibitory network tone is already reduced.
    notes: >-
      This node deliberately does not carry the module's usual
      Excitation-Inhibition Imbalance annotations, cell_types CL:0000617
      (GABAergic neuron) and biological_processes GO:0007214 (GABA signaling,
      DECREASED). The Vaudano et al. finding modeled here is a network-level
      alpha-rhythm inhibition abnormality measured by resting-state EEG-fMRI,
      not a cellular or molecular claim about GABAergic neurotransmission
      specifically, so binding those GABA-specific terms here would overstate
      what the cited evidence establishes. Recorded here so a future
      conformance audit reads this as a deliberate scope choice rather than
      an incomplete annotation.
    downstream:
      - target: Visual Cortical Hyperexcitability to Flickering Light and Pattern Stimulation
    evidence:
      - reference: PMID:28334965
        reference_title: >-
          Photosensitive epilepsy is associated with reduced inhibition of
          alpha rhythm generating networks.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          This difference consists of a decreased alpha-related inhibition of
          the visual cortex and sensory-motor networks at rest.
        explanation: >-
          The authors' own statement of the finding this node models: reduced
          alpha-related inhibition of the visual and sensory-motor cortex,
          measured at rest independent of any stimulus, the E/I-imbalance
          amplifier step this entry's pathophysiology chain was missing.
          Retrieved directly from the article's abstract (the earlier
          DOI-keyed cache entry for the same article lacked full text; this
          PMID-keyed fetch resolved it).
      - reference: PMID:28334965
        reference_title: >-
          Photosensitive epilepsy is associated with reduced inhibition of
          alpha rhythm generating networks.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Genetic generalized epilepsy with photosensitivity demonstrated
          significantly greater mean alpha-power with respect to controls and
          other epilepsy groups.
        explanation: >-
          The specific EEG-fMRI measurement distinguishing photosensitive
          from non-photosensitive epilepsy groups, establishing that this
          inhibitory-network abnormality is specific to photosensitivity
          rather than to epilepsy in general.
      - reference: DOI:10.1101/2024.12.21.24319242
        reference_title: >-
          Functional network dynamics in photosensitive epilepsy depend on
          stimulation frequency and photosensitivity type
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          PSE patients showed apparent differences in functional connectivity
          in the PPR band (3-4Hz) with hypoconnected centro-parietal regions
          and hyperconnected anterior and anterio-posterior areas compared to
          HC and PWE for stimulation frequencies 10Hz-20Hz.
        explanation: >-
          Independent EEG connectivity evidence that photosensitive-epilepsy
          networks are abnormally hypoconnected over posterior/centro-parietal
          regions, a network-level correlate consistent with reduced posterior
          inhibitory network tone. Supports is PARTIAL because this preprint
          frames the finding as altered functional connectivity during
          stimulation rather than as reduced inhibition specifically, and it
          remains an unpublished preprint (is_preprint: true in its cache
          record).
  - name: Visual Cortical Hyperexcitability to Flickering Light and Pattern Stimulation
    biological_scale: TISSUE
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
    description: >-
      The root abnormality is a visual cortex, and adjoining parietal
      cortex, that responds to flickering light or a structured pattern with
      an excessive, hypersynchronous discharge rather than a normal evoked
      response. This is a heritable trait present with or without clinical
      seizures, and it is the abnormality that the photoparoxysmal response
      makes visible on EEG.
    locations:
      - preferred_term: primary visual cortex
        term:
          id: UBERON:0002436
          label: primary visual cortex
    biological_processes:
      - preferred_term: abnormally amplified cortical response to visual stimulation
        description: >-
          No GO term is bound here: GO:0050908 ("detection of light stimulus
          involved in visual perception") names retinal phototransduction,
          not the cortical amplitude abnormality this node claims, and no
          better-fitting GO term for cortical visual-response hyperexcitability
          was found, so the claim is kept as free text rather than bound to a
          mismatched term.
        modifier: ABNORMAL
    downstream:
      - target: Photoparoxysmal EEG Response
    evidence:
      - reference: PMID:25783594
        reference_title: CHD2 variants are a risk factor for photosensitivity in epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Photosensitivity is a heritable abnormal cortical response to
          flickering light, manifesting as particular electroencephalographic
          changes, with or without seizures.
        explanation: >-
          Defines photosensitivity itself as the abnormal cortical response
          this node models, and establishes that it is heritable and exists
          independently of overt seizures.
      - reference: PMID:35807051
        reference_title: >-
          Photo-Dependent Reflex Seizures-A Scoping Review with Proposal of
          Classification.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          we focused on reflex seizures provoked by different factors whose
          common feature is the patient's response to intermittent photic
          stimulation.
        explanation: >-
          States that the common feature across these reflex seizures is the
          patient's cortical response to intermittent photic stimulation,
          which is what this node and the linked environmental exposure both
          describe. Evidence source is OTHER because this is a review
          article.
  - name: Photoparoxysmal EEG Response
    biological_scale: TISSUE
    description: >-
      The electrographic signature elicited by intermittent photic
      stimulation: spike, polyspike, or spike-wave discharges appearing
      during or immediately after the stimulus train, usually with a
      generalized or bilateral field in the syndromes modeled by this entry
      (in contrast to the occipitally confined response of the separately
      curated photosensitive occipital lobe epilepsy subtype). The
      physiological rule governing elicitation differs by underlying
      syndrome: some patients' responses depend on stimulus wavelength, while
      others', notably in Dravet syndrome, depend instead on the total
      quantity of light delivered.
    downstream:
      - target: Visual-to-Motor Cortical Hyperexcitable Spread
    evidence:
      - reference: PMID:10496248
        reference_title: >-
          Photosensitive epilepsies and pathophysiologic mechanisms of the
          photoparoxysmal response.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The authors found two types of pathophysiologic mechanisms of PPRs
          (wavelength-dependent PPRs and quantity-of-light-dependent PPRs) in
          patients with idiopathic generalized epilepsy and hereditary
          dentatorubral-pallidoluysian atrophy.
        explanation: >-
          Establishes the two distinct physiological mechanisms that
          generate the photoparoxysmal response and ties them to different
          underlying epilepsy syndromes, which is the basis for this node's
          claim that the eliciting rule is syndrome-dependent.
      - reference: PMID:10496248
        reference_title: >-
          Photosensitive epilepsies and pathophysiologic mechanisms of the
          photoparoxysmal response.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The type of pathophysiologic mechanism for eliciting PPRs by
          low-luminance photic stimulation was closely related to the
          classification of the epilepsy syndrome.
        explanation: >-
          The authors' own concluding statement linking PPR-eliciting
          mechanism to epilepsy syndrome classification.
      - reference: PMID:31526678
        reference_title: >-
          Photosensitive epilepsy and photosensitivity of patients with
          possible epilepsy in Chinese Han race: A prospective multicenter
          study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          69.9% patients were evoked by frequency ranged 8 Hz-25 Hz, with
          accompanying seizures in 13 patients.
        explanation: >-
          Quantifies the flicker-frequency range that elicits the response in
          a large prospective cohort and the minority in whom the
          electrographic response is accompanied by a clinical seizure.
  - name: Visual-to-Motor Cortical Hyperexcitable Spread
    biological_scale: TISSUE
    description: >-
      Once elicited in visual cortex, the discharge does not stay contained:
      transcranial magnetic stimulation studies show that the normal
      inhibitory connection from primary visual cortex to primary motor
      cortex is lost specifically in patients who currently show a
      photoparoxysmal response, so that motor cortex responds excessively to
      visual-cortex input. This overactive visuomotor connection is proposed
      as the mechanistic bridge between an occipital electrographic event and
      the myoclonic and generalized motor phenomena that follow it.
    locations:
      - preferred_term: primary motor cortex
        term:
          id: UBERON:0001384
          label: primary motor cortex
    downstream:
      - target: Photically Provoked Seizure Generation
    evidence:
      - reference: PMID:26395125
        reference_title: >-
          Overactive visuomotor connections underlie the photoparoxysmal
          response. A TMS study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          IGE patients with a PPR have an overactive functional response of
          M1 to inputs traveling from V1.
        explanation: >-
          The authors' direct conclusion establishing the overactive
          visual-to-motor cortical connection this node models.
      - reference: PMID:26395125
        reference_title: >-
          Overactive visuomotor connections underlie the photoparoxysmal
          response. A TMS study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          This was not true in PPR-positive IGE patients, in whom this type
          of physiologic inhibition was significantly (p < 0.05) reduced.
        explanation: >-
          The specific measurement behind the claim: the normal V1-to-M1
          inhibitory effect measured by TMS was significantly reduced only in
          patients currently showing a photoparoxysmal response, not in
          photonegative patients or healthy controls.
  - name: Photically Provoked Seizure Generation
    biological_scale: ORGANISM
    description: >-
      The clinical seizure: myoclonic jerks, absence, or generalized
      tonic-clonic activity emerging once the visuomotor spread recruits
      enough cortex to produce a symptom. Which seizure type predominates
      depends on the underlying syndrome rather than on the trigger itself,
      which is why the same photic stimulus produces eyelid myoclonia in
      Jeavons syndrome, myoclonic jerks in juvenile myoclonic epilepsy, and
      occipital visual seizures in photosensitive occipital lobe epilepsy.
    downstream:
      - target: Recurrent Visually Provoked Seizures
    evidence:
      - reference: PMID:31526678
        reference_title: >-
          Photosensitive epilepsy and photosensitivity of patients with
          possible epilepsy in Chinese Han race: A prospective multicenter
          study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          6 of 9 patients with eyes closure sensitivity experienced epileptic
          seizures during IPS.
        explanation: >-
          Direct observation of the electrographic-to-clinical transition,
          in this case in patients with eye-closure sensitivity, a subset of
          the photosensitivity trait.
  - name: Recurrent Visually Provoked Seizures
    biological_scale: ORGANISM
    description: >-
      The clinical epilepsy at its purest: seizures reliably and repeatedly
      elicited by the same class of visual stimulus. This node deliberately
      does not conform to the module's Recurrent Unprovoked Seizures node;
      see the attached discussion. It describes the reflex component common
      to every subtype in this entry, not the full clinical picture of any
      one of them; the subtype blocks and their linked entries additionally
      describe spontaneous, unprovoked seizures where those occur.
    evidence:
      - reference: PMID:34221545
        reference_title: Reflex Epilepsy.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Reflex seizures (RS) are epileptic events that are objectively and
          consistently elicited in response to a specific afferent stimulus
          or by an activity of the patient.
        explanation: >-
          Defines the reflex seizure by its consistent elicitation, the
          property that makes photically provoked seizures provoked by
          definition and grounds the module-boundary discussion attached to
          this node. Evidence source is OTHER because this is a narrative
          review, not a primary cohort or case study.
phenotypes:
  - category: Neurological
    name: Visually Provoked Seizures
    description: >-
      Seizures reliably elicited by flickering light or a structured visual
      pattern.
    phenotype_term:
      preferred_term: Visually-induced seizure
      term:
        id: HP:0020216
        label: Visually-induced seizure
    frequency: VERY_FREQUENT
    evidence:
      - reference: PMID:35807051
        reference_title: >-
          Photo-Dependent Reflex Seizures-A Scoping Review with Proposal of
          Classification.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Photo-dependent reflex seizures make up the majority of this type
          of disorder among reflex seizures.
        explanation: >-
          Establishes visually provoked seizures as the majority form of
          reflex seizures overall, supporting a very frequent band for this
          defining feature. Evidence source is OTHER because this is a
          review article.
  - category: Neurological
    name: Photoparoxysmal Response on Intermittent Photic Stimulation
    description: >-
      Generalized or bilateral spike, polyspike, or spike-wave discharges
      elicited on EEG by intermittent photic stimulation, the laboratory
      correlate of the trigger.
    phenotype_term:
      preferred_term: EEG with photoparoxysmal response
      term:
        id: HP:0010852
        label: EEG with photoparoxysmal response
    evidence:
      - reference: PMID:31526678
        reference_title: >-
          Photosensitive epilepsy and photosensitivity of patients with
          possible epilepsy in Chinese Han race: A prospective multicenter
          study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Of the 73 patients with PPR to IPS, 48 were female.
        explanation: >-
          Documents a cohort of 73 patients ascertained specifically by their
          PPR to IPS, supporting that this EEG finding is the diagnostic
          criterion by which patients enter this and comparable cohorts. No
          frequency band is set here: this sentence quantifies the cohort's
          sex distribution, not what fraction of photosensitive-epilepsy
          patients show a PPR, and no cached reference in this entry gives a
          quotable population-level PPR frequency to justify one.
  - category: Neurological
    name: Photosensitive Myoclonic Seizures
    description: >-
      Myoclonic jerks provoked by photic stimulation, the predominant seizure
      type in the genetic generalized photosensitive syndromes such as
      Jeavons syndrome and juvenile myoclonic epilepsy.
    phenotype_term:
      preferred_term: Photosensitive myoclonic seizure
      term:
        id: HP:0001327
        label: Photosensitive myoclonic seizure
    frequency: FREQUENT
    evidence:
      - reference: PMID:25783594
        reference_title: CHD2 variants are a risk factor for photosensitivity in epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We studied 580 individuals with epilepsy and either photosensitive
          seizures or abnormal photoparoxysmal response on
          electroencephalography, or both, and 55 individuals with
          photoparoxysmal response but no seizures.
        explanation: >-
          Establishes photosensitive seizures, predominantly myoclonic in the
          genetic generalized syndromes this cohort was drawn from, as a
          recurrent clinical finding across a large ascertained sample.
  - category: Neurological
    name: Photosensitive Tonic-Clonic Seizures
    description: >-
      Bilateral tonic-clonic seizures provoked by photic stimulation, seen
      when the propagated discharge engages a sufficiently large cortical and
      subcortical network rather than remaining restricted to a myoclonic
      jerk.
    phenotype_term:
      preferred_term: Photosensitive tonic-clonic seizure
      term:
        id: HP:0007207
        label: Photosensitive tonic-clonic seizure
    frequency: FREQUENT
    evidence:
      - reference: PMID:35807051
        reference_title: >-
          Photo-Dependent Reflex Seizures-A Scoping Review with Proposal of
          Classification.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Although generalized seizures, such as myoclonic, tonic-clonic, and
          absence, are the most common, PPR has also been found in patients
          with occipital epilepsy and temporal lobe epilepsy
        explanation: >-
          States directly that tonic-clonic seizures are, along with
          myoclonic and absence seizures, among the most common seizure types
          in patients with PPR, supporting a frequent rather than merely
          occasional band. Evidence source is OTHER because this is a
          scoping review, not a primary cohort study. Replaces an earlier
          citation that quoted an eye-closure-sensitivity sentence unrelated
          to seizure type and miscounted 6 of 9 (67%) as "only a minority."
      - reference: PMID:31526678
        reference_title: >-
          Photosensitive epilepsy and photosensitivity of patients with
          possible epilepsy in Chinese Han race: A prospective multicenter
          study.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          69.9% patients were evoked by frequency ranged 8 Hz-25 Hz, with
          accompanying seizures in 13 patients.
        explanation: >-
          Quantifies that a clinical seizure of any type (not specifically
          tonic-clonic) accompanied the electrographic response in only 13 of
          the 73 PPR-positive patients (about 18%), the minority figure this
          paper actually supports; PARTIAL because the seizure type is not
          broken down by semiology in this sentence.
  - category: Neurological
    name: Eyelid Myoclonia Seizures
    subtype: Photosensitivity as the Archetypal Syndrome, Jeavons Syndrome
    description: >-
      Brief, rapid eyelid jerks with upward eye deviation, typically provoked
      by eye closure in bright light. The defining seizure type of Jeavons
      syndrome, included here because eye-closure sensitivity is itself part
      of the photosensitivity trait spectrum this entry models.
    phenotype_term:
      preferred_term: Eyelid myoclonia seizure
      term:
        id: HP:0032678
        label: Eyelid myoclonia seizure
    frequency: VERY_FREQUENT
    evidence:
      - reference: PMID:25783594
        reference_title: CHD2 variants are a risk factor for photosensitivity in epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Among epilepsy syndromes, there was over-representation of unique
          CHD2 variants (3/36 cases) in the archetypal photosensitive
          epilepsy syndrome, eyelid myoclonia with absences (P = 3.50 ×
          10(-4))
        explanation: >-
          Names eyelid myoclonia with absences as the archetypal
          photosensitive epilepsy syndrome, supporting a very frequent band
          for its defining seizure type within this subtype.
genetic:
  - name: CHD2
    gene_term:
      preferred_term: CHD2
      term:
        id: hgnc:1917
        label: CHD2
    relationship_type: RISK_FACTOR
    association: >-
      Unique (singleton) CHD2 variants are significantly over-represented in
      people with photosensitive epilepsies compared to population controls,
      and are the strongest single-gene contributor identified to date. CHD2
      encodes an ATP-dependent chromodomain-helicase-DNA-binding chromatin
      remodeler rather than an ion channel, which is notable because nearly
      every other established photosensitive/generalized epilepsy gene
      encodes a channel or a direct synaptic protein; how chromatin
      remodeling during neurodevelopment produces an acutely provokable
      cortical hyperexcitability is not established. Severe, fully
      penetrant loss-of-function CHD2 variants instead cause a distinct,
      separately curated developmental and epileptic encephalopathy
      (kb/disorders/CHD2-Related_Developmental_and_Epileptic_Encephalopathy.yaml);
      the risk-factor association modeled here is the milder, incompletely
      penetrant end of the same gene's phenotypic spectrum, seen in people
      whose epilepsy is not a fully expressed encephalopathy.
    case_fractions:
      - population: >-
          580 individuals with photosensitive seizures and/or abnormal
          photoparoxysmal response (EuroEPINOMICS CoGIE consortium)
        case_fraction_percent: 1.9
        cohort_size: 580
        notes: >-
          11 of 580 individuals carried a unique CHD2 variant (11/580 ≈
          1.9%), a statistically significant excess over the 128/34427 rate
          in unselected population controls (P = 2.17 x 10^-5), but still a
          minority of cases overall.
        evidence:
          - reference: PMID:25783594
            reference_title: CHD2 variants are a risk factor for photosensitivity in epilepsy.
            supports: SUPPORT
            evidence_source: HUMAN_CLINICAL
            snippet: >-
              We identified 11 unique variants in the 580 individuals with
              photosensitive epilepsies and 128 unique variants in the 34
              427 controls: unique CHD2 variation is over-represented in
              cases overall (P = 2.17 × 10(-5)).
            explanation: >-
              Source of the case count and control comparison used to derive
              the case fraction.
      - population: Eyelid myoclonia with absences (Jeavons syndrome) subgroup, n=36
        case_fraction_percent: 8.3
        cohort_size: 36
        notes: 3 of 36 Jeavons syndrome cases carried a unique CHD2 variant.
        evidence:
          - reference: PMID:25783594
            reference_title: CHD2 variants are a risk factor for photosensitivity in epilepsy.
            supports: SUPPORT
            evidence_source: HUMAN_CLINICAL
            snippet: >-
              there was over-representation of unique CHD2 variants (3/36
              cases) in the archetypal photosensitive epilepsy syndrome,
              eyelid myoclonia with absences (P = 3.50 × 10(-4))
            explanation: >-
              Source of the syndrome-specific case count showing a higher
              CHD2 yield within Jeavons syndrome than in the mixed
              photosensitive-epilepsy cohort overall.
    evidence:
      - reference: PMID:25783594
        reference_title: CHD2 variants are a risk factor for photosensitivity in epilepsy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Chd2 knockdown markedly enhanced mild innate zebrafish larval
          photosensitivity.
        explanation: >-
          Zebrafish chd2 knockdown causally enhances photosensitivity in
          vivo, supporting a functional, not merely statistical, role for
          CHD2 loss in the photosensitivity trait.
      - reference: PMID:25783594
        reference_title: CHD2 variants are a risk factor for photosensitivity in epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          CHD2 does not encode an ion channel, opening new avenues for
          research into human cortical excitability.
        explanation: >-
          The authors' own framing of CHD2 as mechanistically distinct from
          the channelopathies that dominate epilepsy genetics, which is the
          basis for treating the CHD2-to-hyperexcitability link as an open
          mechanistic question rather than an established pathway.
      - reference: PMID:25783594
        reference_title: CHD2 variants are a risk factor for photosensitivity in epilepsy.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          CHD2 variation was not over-represented in photoparoxysmal response
          without seizures.
        explanation: >-
          Sharpens the scope of the CHD2 association: it holds for
          photosensitive epilepsy (seizures, or an abnormal photoparoxysmal
          response occurring alongside a seizure disorder) but not for the
          photoparoxysmal response occurring alone with no seizures, the same
          trait-versus-epilepsy boundary this entry draws elsewhere. Graded
          PARTIAL because it is a negative result narrowing where the
          positive association applies, not new support for the RISK_FACTOR
          claim itself.
environmental:
  - name: Intermittent Photic Stimulation and Structured Visual Patterns
    description: >-
      Flickering light (natural, such as sunlight through trees or on water,
      or artificial, such as strobe lighting, television, and video games) and
      structured high-contrast patterns are the reproducible triggers that
      define this entry. MONDO's own logical definition of photosensitive
      epilepsy binds the visible-light exposure directly to the disease
      concept, which this environmental entry mirrors with a pathograph link
      rather than only a textual description.
    exposure_term:
      preferred_term: exposure to visible light radiation
      term:
        id: ECTO:0000007
        label: exposure to visible light radiation
    evidence:
      - reference: PMID:25783594
        reference_title: CHD2 variants are a risk factor for photosensitivity in epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Photosensitivity is a heritable abnormal cortical response to
          flickering light, manifesting as particular electroencephalographic
          changes, with or without seizures.
        explanation: >-
          Establishes flickering light exposure as the trigger of the
          abnormal cortical response that defines photosensitivity, the
          general claim this environmental entry as a whole makes.
    influences_mechanisms:
      - target: Visual Cortical Hyperexcitability to Flickering Light and Pattern Stimulation
        environmental_effect: TRIGGERS
        causal_link_type: DIRECT
        description: >-
          Delivery of intermittent photic stimulation, at an individually
          variable flicker-frequency range, is the direct proximate trigger
          of the abnormal cortical response that this entry's pathophysiology
          chain begins with; it is also the basis of the standard diagnostic
          EEG provocation procedure.
        evidence:
          - reference: PMID:31526678
            reference_title: >-
              Photosensitive epilepsy and photosensitivity of patients with
              possible epilepsy in Chinese Han race: A prospective multicenter
              study.
            supports: SUPPORT
            evidence_source: HUMAN_CLINICAL
            snippet: >-
              69.9% patients were evoked by frequency ranged 8 Hz-25 Hz, with
              accompanying seizures in 13 patients.
            explanation: >-
              Quantifies the flicker-frequency range that triggers the
              cortical response in a large prospective cohort, directly
              supporting the TRIGGERS relationship asserted here.
    notes: >-
      Structured, high-contrast patterns (stripes, checkerboards) are a
      related and well-documented trigger, sometimes acting even under
      constant illumination without flicker, but ECTO was searched and has no
      dedicated exposure term for pattern stimulation distinct from visible
      light exposure in general; binding one here would misrepresent what
      ECTO:0000007 actually covers, so pattern sensitivity is described in
      prose only rather than given its own exposure_term.
epidemiology:
  - name: Proportion of Pediatric Epilepsy Referrals with Photosensitive Epilepsy
    description: >-
      In a single-center Chinese pediatric epilepsy service that screened 398
      consecutively diagnosed children with video-EEG and intermittent photic
      stimulation testing, photosensitive epilepsy was found in 31. This is a
      proportion within an epilepsy-referral cohort ascertained by a specific
      IPS protocol, not a general-population prevalence estimate.
    unit: proportion of a single-center pediatric epilepsy referral cohort
    evidence:
      - reference: PMID:36969295
        reference_title: >-
          Electroclinical characteristics of photosensitive epilepsy: A
          retrospective study of 31 Chinese children and literature review.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          PSE accounted for 7.79% (31/398) of children with epilepsy during
          the observation period in our single epilepsy center.
        explanation: >-
          Direct quantification of the fraction of children with epilepsy who
          were found to have photosensitive epilepsy in this ascertainment
          protocol. Retrieved directly from the article's PMID-keyed full
          text (the earlier DOI-keyed cache entry for the same article was
          abstract-only; this PMID-keyed fetch resolved the full text).
  - name: Onset Age and Sex Ratio in a Pediatric Photosensitive Epilepsy Cohort
    description: >-
      In the same 31-patient Chinese pediatric cohort, seizure onset was in
      early childhood on average, and photosensitive epilepsy was markedly
      more common in girls than boys, a sex skew paralleled elsewhere in the
      photosensitivity literature (see the treatments section for a sex
      difference in valproate pharmacodynamic response).
    unit: years (onset age); ratio (sex)
    mean_range: "7.8 +/- 3.28 years onset; male:female 1:3.43"
    evidence:
      - reference: PMID:36969295
        reference_title: >-
          Electroclinical characteristics of photosensitive epilepsy: A
          retrospective study of 31 Chinese children and literature review.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Among them, there were 7 males and 24 females; the male to female
          ratio was 1:3.43.
        explanation: >-
          Direct report of the sex ratio in this pediatric photosensitive
          epilepsy cohort. Retrieved directly from the article's PMID-keyed
          full text (the earlier DOI-keyed cache entry for the same article
          was abstract-only; this PMID-keyed fetch resolved the full text).
      - reference: PMID:36969295
        reference_title: >-
          Electroclinical characteristics of photosensitive epilepsy: A
          retrospective study of 31 Chinese children and literature review.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The highest age of incidence ranged from 6 to 11 years with a
          proportion of 70.96% (22/31, 2 males and 10 females).
        explanation: >-
          Reports the peak incidence age range in this cohort. The source
          itself is internally inconsistent here: it states "22/31" for the
          peak-age-band proportion but then gives a male/female breakdown
          (2 and 10) that sums to 12, not 22. This is flagged as a
          discrepancy in the cited source rather than silently resolved in
          either direction; the female-skew qualitative pattern (2 males
          versus 10 females in whichever subgroup the breakdown actually
          describes) is consistent with the sex ratio reported elsewhere in
          this cohort regardless of which figure is correct.
  - name: Age at Onset of the Photosensitivity Trait
    description: >-
      Independent of any one syndrome's seizure-onset age, the underlying
      photosensitivity trait itself (the abnormal photoparoxysmal EEG
      response) most often first appears in childhood or adolescence, with a
      peak age at onset around 12 years and onset before age 20 in the great
      majority of cases. This is a broader, syndrome-agnostic estimate,
      distinct from the syndrome-specific seizure-onset age reported in the
      Chinese pediatric cohort above.
    unit: years
    evidence:
      - reference: PMID:23274161
        reference_title: >-
          Photosensitivity: epidemiology, genetics, clinical manifestations,
          assessment, and management.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Photosensitivity usually begins before the age of 20 years with a
          peak age at onset at around 12.
        explanation: >-
          States the typical age-of-onset window and peak for the
          photosensitivity trait itself. Evidence source is OTHER because
          this is a review article.
  - name: Visual Sensitivity Prevalence Varies by Underlying Epilepsy Syndrome
    description: >-
      The proportion of epilepsy patients who show visual sensitivity is
      highly syndrome-dependent rather than a single fixed rate, consistent
      with this entry's framing of photosensitivity as a trait riding along
      with different underlying epilepsy syndromes at markedly different
      rates (from a minority in some syndromes up to the great majority in
      others, such as juvenile myoclonic epilepsy).
    unit: percent of patients, syndrome-dependent
    evidence:
      - reference: DOI:10.5772/intechopen.1015299
        reference_title: How and When to Treat Visually-Evoked Seizures
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Depending on the type of epilepsy, visual sensitivity can occur in
          up to 40% of patients, but this is often not diagnosed or treated.
        explanation: >-
          States the syndrome-dependent range and the practical caveat that
          visual sensitivity is frequently underdiagnosed even when present.
          Evidence source is OTHER because this is a book chapter overview,
          not a primary study.
animal_models:
  - name: Papio papio photosensitive baboon
    species: Papio papio (baboon)
    genotype: >-
      Naturally occurring, heritable generalized photosensitivity trait; no
      causal mutation has yet been identified.
    publication: PMID:26875109
    description: >-
      The classic naturally occurring primate model of generalized
      photosensitive epilepsy: colonies of Papio papio baboons show a
      heritable predisposition to generalized epileptiform discharges and
      motor seizures on intermittent photic stimulation, closely paralleling
      the human photoparoxysmal response, and have been used for decades to
      study visual-network propagation and antiseizure pharmacology.
    modeled_mechanisms:
      - target: Visual Cortical Hyperexcitability to Flickering Light and Pattern Stimulation
        relationship: RECAPITULATES
        fidelity: MODERATE
        description: >-
          Reproduces the core trait this entry's pathophysiology chain begins
          with -- a heritable cortical hyperexcitability to flickering light
          -- in a species phylogenetically closer to humans than the rodent
          and avian models available for this trait.
        limitations: >-
          No causal genetic lesion has been identified in Papio papio despite
          a presumed genetic etiology, so the model cannot yet be used to test
          any specific human candidate variant (including CHD2), and primate
          colony availability sharply limits its use relative to zebrafish or
          mouse models.
        evidence:
          - reference: PMID:26875109
            reference_title: Genetics of reflex seizures and epilepsies in humans and animals.
            supports: SUPPORT
            evidence_source: OTHER
            snippet: >-
              No specific mutation has been found in Papio papio baboon,
              although a genetic etiology is likely.
            explanation: >-
              Establishes Papio papio as a naturally occurring
              photosensitive-epilepsy model with a presumed but still
              unidentified genetic basis, the basis for both the
              RECAPITULATES relationship and its stated limitation. Evidence
              source is OTHER because this is a narrative review, not a
              primary study of the baboon colony itself.
        readouts:
          - name: Ictal and Interictal Epileptiform EEG Discharges During Intermittent Light Stimulation
            target: Visual Cortical Hyperexcitability to Flickering Light and Pattern Stimulation
            interpretation: >-
              The electrographic readout by which photosensitive, epileptic
              (PS) baboon colonies are distinguished from asymptomatic
              control (CTL) animals: ictal and interictal epileptiform EEG
              discharges occurring during intermittent light stimulation.
              Renamed from an earlier, more specific "motor seizure response"
              framing after the cited source was found to establish the
              electrographic discharge readout directly but not a separately
              quantified motor-seizure measurement.
            evidence:
              - reference: PMID:22276085
                reference_title: Functional PET Evaluation of the Photosensitive Baboon.
                supports: SUPPORT
                evidence_source: MODEL_ORGANISM
                snippet: >-
                  our group utilized functional positron emission tomography
                  (PET) to compare cerebral blood flow (CBF) changes
                  occurring during intermittent light stimulation (ILS) and
                  rest between baboons photosensitive, epileptic (PS) and
                  asymptomatic, control (CTL) animals.
                explanation: >-
                  Establishes the intermittent light stimulation (ILS)
                  paradigm and the photosensitive-epileptic (PS) versus
                  asymptomatic-control (CTL) baboon classification this
                  readout depends on.
              - reference: PMID:22276085
                reference_title: Functional PET Evaluation of the Photosensitive Baboon.
                supports: SUPPORT
                evidence_source: MODEL_ORGANISM
                snippet: >-
                  CBF changes in the subtraction and covariance analyses
                  reveal the physiological response and visual connectivity
                  in CTL animals and pathophysiological networks underlying
                  responses associated with the activation of ictal and
                  interictal epileptic discharges in PS animals.
                explanation: >-
                  Directly reports the ictal and interictal epileptiform EEG
                  discharges that distinguish photosensitive from control
                  baboons, the specific measurement this readout attests.
    evidence:
      - reference: PMID:22276085
        reference_title: Functional PET Evaluation of the Photosensitive Baboon.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          our group utilized functional positron emission tomography (PET) to
          compare cerebral blood flow (CBF) changes occurring during
          intermittent light stimulation (ILS) and rest between baboons
          photosensitive, epileptic (PS) and asymptomatic, control (CTL)
          animals.
        explanation: >-
          Establishes the photosensitive baboon as a naturally occurring
          model in which intermittent light stimulation reproducibly
          distinguishes a photosensitive-epileptic phenotype from
          asymptomatic controls, the basis for the RECAPITULATES
          relationship.
      - reference: PMID:26875109
        reference_title: Genetics of reflex seizures and epilepsies in humans and animals.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          No specific mutation has been found in Papio papio baboon, although
          a genetic etiology is likely.
        explanation: >-
          Supports Papio papio as an informative naturally occurring model for
          the visual cortical hyperexcitability node. Evidence source is
          OTHER because this is a narrative review, not a primary study of the
          baboon colony itself.
  - name: Fepi (Fayoumi) photosensitive chicken line
    species: Gallus gallus (Fayoumi-derived Fepi chicken strain)
    genotype: >-
      Recessive autosomal mutation in the acceptor site of SV2A intron 2
      (synaptic vesicle glycoprotein 2A, the levetiracetam binding target),
      homozygous
    publication: PMID:22046416
    description: >-
      A heritable avian model of photic and audiogenic reflex epilepsy in
      which a splice-site mutation in SV2A produces spontaneous, photically
      triggered seizures, providing a genetically defined counterpoint to the
      still-genetically-unresolved Papio papio model. Brain-chimera transfer
      experiments in this same strain, however, localize its seizure
      generator to the brain stem rather than to visual cortex, which is why
      this model is scored FAILS_TO_RECAPITULATE below rather than
      PARTIALLY_RECAPITULATES.
    modeled_mechanisms:
      - target: Visual Cortical Hyperexcitability to Flickering Light and Pattern Stimulation
        relationship: FAILS_TO_RECAPITULATE
        fidelity: LOW
        description: >-
          Reproduces heritable photic (and audiogenic) seizure susceptibility
          linked to a defined synaptic gene, but living neural-chimera
          experiments in this strain -- replacing specific embryonic brain
          vesicles with their Fepi-donor equivalents -- localize the seizure
          generator to the brain stem (prosencephalon and mesencephalon), not
          to the visual cortex this entry's pathophysiology chain describes.
        limitations: >-
          The original authors' own conclusion places the Fepi seizure
          generator in the brain stem: substituting only the mesencephalon
          transfers the motor seizure, substituting only the prosencephalon
          transfers interictal paroxysmal activity, and total transfer
          requires substituting both. This is a fundamentally different
          anatomical locus from the visual-cortex and thalamocortical
          mechanism this entry establishes for human photosensitive epilepsy
          (see the Reduced Alpha-Rhythm Network Inhibition and Visual
          Cortical Hyperexcitability nodes above), not merely a difference of
          degree from avian brain architecture. It is recorded here as a
          documented negative result rather than omitted, so a future curator
          does not re-propose the Fepi line as a cortical model of human
          photosensitive epilepsy. SV2A is also not among the genes
          implicated in human photosensitive epilepsy -- CHD2, the
          best-established human risk gene curated in this entry, is
          unrelated to SV2A.
        evidence:
          - reference: PMID:15260383
            reference_title: An avian model of genetic reflex epilepsy.
            supports: SUPPORT
            evidence_source: MODEL_ORGANISM
            snippet: >-
              We conclude that the Fepi is a good model of brain stem reflex
              epilepsy and suggest that the brain stem is a generator of some
              other animal and human genetic reflex "epileptic syndromes".
            explanation: >-
              The original authors' own conclusion, directly supporting the
              FAILS_TO_RECAPITULATE relationship: the Fepi model's own
              investigators locate its generator in the brain stem, not the
              visual cortex.
    evidence:
      - reference: PMID:22046416
        reference_title: >-
          Epilepsy caused by an abnormal alternative splicing with dosage
          effect of the SV2A gene in a chicken model.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          we report that a mutation in the acceptor site of the second intron
          of SV2A (the gene encoding synaptic vesicle glycoprotein 2A) is
          causing photosensitive reflex epilepsy in a unique vertebrate
          model, the Fepi chicken strain, a spontaneous model where the
          neurological disorder is inherited as an autosomal recessive
          mutation.
        explanation: >-
          The primary genetic study identifying the causal SV2A splice-site
          mutation in the Fepi chicken strain, replacing the earlier,
          secondary-review-only sourcing for this model with the original
          report.
      - reference: PMID:15260383
        reference_title: An avian model of genetic reflex epilepsy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The Fayoumi strain of chickens (Fepi) carries a recessive autosomal
          gene mutation in which homozygotes are afflicted with a photogenic
          and audiogenic reflex epilepsy.
        explanation: >-
          The classic description of the Fepi strain as a photogenic (and
          audiogenic) reflex epilepsy model, cited alongside the later SV2A
          gene-identification study above.
      - reference: PMID:26875109
        reference_title: Genetics of reflex seizures and epilepsies in humans and animals.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Mutation in synaptic vesicle glycoprotein 2A was found in another
          animal model of photosensitivity (Fayoumi chickens).
        explanation: >-
          Supports the Fayoumi chicken line as a genetically defined
          photosensitivity model. Evidence source is OTHER because this is a
          narrative review, not a primary study of the chicken line itself.
diagnosis:
  - name: Electroencephalography with Intermittent Photic Stimulation
    description: >-
      The core diagnostic investigation, and a deliberately provocative one:
      a standardized flash sequence across a range of frequencies is
      delivered during EEG recording specifically to elicit the
      photoparoxysmal response, with and without eye closure, since eye
      closure itself can gate the response.
    diagnosis_term:
      preferred_term: Electroencephalography
      term:
        id: NCIT:C38054
        label: Electroencephalography
    evidence:
      - reference: PMID:31526678
        reference_title: >-
          Photosensitive epilepsy and photosensitivity of patients with
          possible epilepsy in Chinese Han race: A prospective multicenter
          study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          6 of 9 patients with eyes closure sensitivity experienced epileptic
          seizures during IPS.
        explanation: >-
          Documents eye closure as a specific, separately assessed component
          of the standard intermittent photic stimulation protocol.
  - name: Virtual Reality and Machine Learning-Assisted Photoparoxysmal Response Detection
    description: >-
      An emerging research technique, not yet clinical standard of care, that
      adds a programmable virtual reality stimulation platform and AI-based
      automatic EEG scoring on top of the conventional IPS-EEG procedure,
      aiming to broaden and standardize the range of visual stimuli that can
      be tested for a photoparoxysmal response beyond the fixed manual flash
      protocol.
    diagnosis_term:
      preferred_term: Electroencephalography
      term:
        id: NCIT:C38054
        label: Electroencephalography
    evidence:
      - reference: DOI:10.1007/s00521-022-06940-z
        reference_title: >-
          Virtual reality and machine learning in the automatic
          photoparoxysmal response detection
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          This research focuses on introducing virtual reality (VR) in this
          context, adding, to the conventional infrastructure a more flexible
          one that can be programmed and that will allow developing a much
          wider and richer set of experiments in order to detect neurological
          illnesses, and to study subjects’ behaviours automatically.
        explanation: >-
          Describes the VR/AI-augmented IPS-EEG research platform this
          diagnosis entry models, distinct from and supplementary to the
          standard manual IPS-EEG protocol described above. Evidence source
          is OTHER because the paper's contribution is a detection system and
          methods description, not a report of patient clinical outcomes.
treatments:
  - name: Antiseizure Pharmacotherapy
    description: >-
      Valproate is the conventional first-line agent for photosensitive
      epilepsy and reliably suppresses the photoparoxysmal response;
      levetiracetam is a common alternative, particularly favored in girls
      and young women given valproate's teratogenicity and other
      reproductive-health concerns. A separate, purely pharmacodynamic sex
      difference has also been reported: in a within-patient retrospective
      cohort, males showed a significantly greater reduction in the
      standardized photosensitivity range on valproate than females, a
      finding distinct from (and not explained by) the prescribing pattern
      driven by teratogenicity risk.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: valproic acid
          term:
            id: CHEBI:39867
            label: valproic acid
        - preferred_term: levetiracetam
          term:
            id: CHEBI:6437
            label: levetiracetam
    target_mechanisms:
      - target: Visual-to-Motor Cortical Hyperexcitable Spread
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:40580381
        reference_title: >-
          Evidence of Sex-Related Pharmacodynamic Differences in
          Photosensitive Epilepsy Treated with Valproate: Findings from a
          Retrospective, Observational, Single-Center, Within-Patient,
          Cohort Study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          It is well established that VPA reduces or suppresses PPR, as
          first shown after single oral doses in seven out of nine
          photosensitive patients
        explanation: >-
          States directly that valproate reduces or suppresses the
          photoparoxysmal response, the basis for describing it as the
          conventional first-line agent for photosensitive epilepsy.
      - reference: PMID:40580381
        reference_title: >-
          Evidence of Sex-Related Pharmacodynamic Differences in
          Photosensitive Epilepsy Treated with Valproate: Findings from a
          Retrospective, Observational, Single-Center, Within-Patient,
          Cohort Study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Males experienced a significantly greater reduction in SPR compared
          with females. The mean decrease in SPR was -7.0 ± 2.6 in males only
          versus -3.9 ± 3.3 in females only (p = 0.0018).
        explanation: >-
          The study's own headline pharmacodynamic finding, quantifying the
          sex difference in valproate response referenced in the description
          above: a within-patient comparison of standardized photosensitivity
          range change before and after valproate, showing a significantly
          larger reduction in males.
  - name: Cenobamate
    description: >-
      In a phase 2 proof-of-principle study, a single oral dose of cenobamate
      (then YKP3089) produced dose-dependent suppression of the
      photoparoxysmal response in photosensitive epilepsy patients,
      establishing acute PPR suppression for a drug whose broader mechanism
      combines sodium-channel inactivation with GABA-A receptor positive
      allosteric modulation. It is an approved antiseizure medication used
      more broadly for focal-onset seizures; this entry documents its
      acute-suppression evidence specifically in the photosensitivity model,
      not a long-term PSE effectiveness trial.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: cenobamate
          term:
            id: CHEBI:234112
            label: Cenobamate
    target_mechanisms:
      - target: Visual Cortical Hyperexcitability to Flickering Light and Pattern Stimulation
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:31292226
        reference_title: >-
          Suppression of the photoparoxysmal response in photosensitive
          epilepsy with cenobamate (YKP3089).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Cenobamate 100 mg produced partial suppression in 1 of 3 patients;
          250 mg produced complete suppression in 1 of 4 and partial
          suppression in 4 of 4 patients; and 400 mg produced complete
          suppression in 1 of 4 and partial suppression in 2 of 4 patients.
        explanation: >-
          The dose-by-dose suppression results directly supporting the
          INHIBITS relationship asserted on this treatment. Retrieved
          directly from the article's PMID-keyed abstract (the earlier
          DOI-keyed cache entry for the same article lacked full text; this
          PMID-keyed fetch resolved it).
      - reference: PMID:31292226
        reference_title: >-
          Suppression of the photoparoxysmal response in photosensitive
          epilepsy with cenobamate (YKP3089).
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          CONCLUSIONS: This proof-of-principle study demonstrated that
          cenobamate is a potentially effective product for epilepsy.
        explanation: >-
          The authors' own conclusion, establishing acute PPR suppression as
          proof-of-principle evidence for cenobamate in photosensitive
          epilepsy.
      - reference: clinicaltrials:NCT00616148
        reference_title: "Pharmacodynamic Evaluation of YKP3089 in Epilepsy Patients With a Photo-induced Paroxysmal EEG-Response: Proof of Principle"
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          The aim of this study is to evaluate the ability of a single oral
          dose of YKP3089 to abolish or clearly reduce the IPS-induced
          photo-paroxysmal EEG response in photosensitive epilepsy patients,
          and to measure the onset and duration of the effect.
        explanation: >-
          ClinicalTrials.gov registration record for the proof-of-principle
          cenobamate (YKP3089) trial whose published results are cited above.
          Evidence source is OTHER because this is a registration summary,
          not study results.
  - name: Investigational GABAergic Positive Allosteric Modulation
    description: >-
      PF-06372865, an alpha2/3/5-subunit-selective GABA-A receptor positive
      allosteric modulator designed to avoid the alpha1-mediated sedative and
      dependence liabilities of benzodiazepines, produced a marked and
      statistically significant suppression of the photoparoxysmal response
      in a phase 2a proof-of-principle study, comparable in magnitude to
      lorazepam. This is investigational rather than an approved therapy, but
      is included because the human photosensitivity model is being used
      directly as a translational efficacy readout for this drug class.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
    target_mechanisms:
      - target: Visual Cortical Hyperexcitability to Flickering Light and Pattern Stimulation
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:30877186
        reference_title: >-
          Photosensitive epilepsy: Robust clinical efficacy of a selective
          GABA potentiator.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Both doses of PF-06372865 produced a marked and statistically
          significant mean reduction in SPR compared to placebo, which was
          similar in degree to lorazepam.
        explanation: >-
          The primary efficacy result supporting the INHIBITS relationship
          asserted on this treatment.
      - reference: PMID:30877186
        reference_title: >-
          Photosensitive epilepsy: Robust clinical efficacy of a selective
          GABA potentiator.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          There was complete suppression of SPR in 6/7 participants following
          PF-06372865 or lorazepam administration.
        explanation: >-
          Quantifies the magnitude of response suppression achieved.
  - name: Trigger Avoidance and Environmental Modification
    description: >-
      Because seizures are elicited rather than spontaneous in the reflex
      component this entry models, reducing exposure (distance from screens,
      avoiding untreated strobe environments, monocular viewing, and
      polarized or colored lenses that reduce the effective flicker or
      contrast reaching the retina) is genuinely therapeutic rather than
      merely precautionary, and is standard advice alongside medication.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: Lifestyle Therapy
      term:
        id: NCIT:C15900
        label: Lifestyle Therapy
    target_mechanisms:
      - target: Visual Cortical Hyperexcitability to Flickering Light and Pattern Stimulation
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:34221545
        reference_title: Reflex Epilepsy.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Treatment includes antiseizure medication, commonly valproate or
          levetiracetam, along with lifestyle modifications, and when
          amenable, surgical intervention.
        explanation: >-
          Places lifestyle modification alongside pharmacotherapy as a
          standard component of treatment for reflex epilepsies, the category
          photosensitive epilepsy belongs to. Evidence source is OTHER
          because this is a narrative review, not a primary cohort or case
          study.

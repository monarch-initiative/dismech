differential_diagnoses:
  - name: Self-Induced (Sunflower) Photosensitive Epilepsy
    description: >-
      A behaviorally distinct entity in which the patient deliberately
      elicits the photoparoxysmal response by waving fingers in front of the
      eyes in bright light, rather than passively encountering an
      environmental trigger. Not modeled as a subtype here (see notes); no
      MONDO disease_term is bound in this differential-diagnosis block
      because it names a related concept (MONDO:0100529, Sunflower syndrome)
      that this entry does not itself curate.
    distinguishing_features:
      - The stimulus is self-generated by hand-waving rather than encountered environmentally.
      - Behavior is often compulsive and difficult to interrupt, with a described self-reinforcing quality.
    evidence:
      - reference: PMID:35807051
        reference_title: >-
          Photo-Dependent Reflex Seizures-A Scoping Review with Proposal of
          Classification.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          Epilepsy with seizures provoked by intermittent light stimulation
          is a distinct group of epilepsies
        explanation: >-
          Supports treating photically provoked epilepsies as a distinct
          group within which self-induced forms are a recognized but
          behaviorally separate presentation. Evidence source is OTHER
          because this is a review article.
  - name: Fixation-Off Sensitivity Epilepsies
    description: >-
      Epilepsies, such as childhood occipital visual epilepsy, in which
      removing central visual fixation (eye closure in darkness, or
      convergence) rather than photic stimulation itself is the gating
      electrographic phenomenon. Distinguished by the opposite manipulation:
      photosensitive epilepsy's photoparoxysmal response requires a light
      stimulus, while fixation-off sensitivity requires the absence of
      structured foveal vision.
    distinguishing_features:
      - The gating manipulation is loss of central fixation, not delivery of a light or pattern stimulus.
      - Seizures occur spontaneously rather than being elicited by an external visual trigger.
    evidence:
      - reference: PMID:35503717
        reference_title: >-
          International League Against Epilepsy classification and
          definition of epilepsy syndromes with onset in childhood: Position
          paper by the ILAE Task Force on Nosology and Definitions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Epilepsy syndromes beginning in childhood have been divided into
          three categories: (1) self-limited focal epilepsies, comprising
          four syndromes: self-limited epilepsy with centrotemporal spikes,
          self-limited epilepsy with autonomic seizures, childhood occipital
          visual epilepsy, and photosensitive occipital lobe epilepsy
        explanation: >-
          Lists childhood occipital visual epilepsy, the fixation-off
          sensitivity syndrome, alongside photosensitive occipital lobe
          epilepsy as a separate, nosologically distinct syndrome despite
          the clinical closeness POLE's own entry discusses in detail.
discussions:
  - discussion_id: pse_provoked_seizure_module_boundary
    kind: OPEN_QUESTION
    status: OPEN
    prompt: >-
      Should photosensitive epilepsy conform to the
      epilepsy_excitation_inhibition_imbalance module's terminal node,
      Recurrent Unprovoked Seizures, given that its defining feature is a
      reproducibly provoked seizure, and how should that boundary be recorded
      when a subtype (JME, Dravet, the PMEs) genuinely has both provoked and
      unprovoked seizures?
    attaches_to:
      - "pathophysiology#Recurrent Visually Provoked Seizures"
    rationale: >-
      This entry declares conformance to
      epilepsy_excitation_inhibition_imbalance at the Neuronal
      Hyperexcitability and Hypersynchrony node and stops there, for the same
      reason already recorded in
      kb/disorders/Photosensitive_Occipital_Lobe_Epilepsy.yaml: the module's
      terminal node is Recurrent Unprovoked Seizures, and reflex seizures are
      elicited by definition, so declaring conformance there would assert the
      negation of the defining property of the reflex component this entry
      models. The complication specific to this root entry, and not shared by
      POLE, is that most of its named subtypes (JME, Jeavons syndrome, Dravet
      syndrome, the PMEs) are not purely reflex: they also have genuinely
      spontaneous, unprovoked seizures, and those subtypes' own separately
      curated entries may correctly conform to the terminal node for that
      reason. This entry's photosensitivity-scoped pathophysiology chain
      should not be read as contradicting that; it describes only the reflex
      component common to the whole family, deliberately leaving the
      unprovoked-seizure question to each subtype's own full entry.
    proposed_experiments:
      - experiment_id: pse_module_node_audit
        name: Audit of reflex-epilepsy and mixed-trigger entries against the module terminal node
        description: >-
          Extending the audit already proposed in the
          Photosensitive_Occipital_Lobe_Epilepsy entry, specifically compare
          how the terminal node is (or is not) declared across purely reflex
          entries versus mixed entries like this one that have both a
          reflex-scoped root and unprovoked-seizure-capable subtypes.
        decision_criterion: >-
          If curators consistently split conformance the way this entry does
          (reflex root stops short, individual mixed subtype entries conform
          separately), that confirms the current approach as the intended
          pattern rather than an ad hoc choice, and the module documentation
          should say so explicitly.
    evidence:
      - reference: PMID:34221545
        reference_title: Reflex Epilepsy.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Reflex seizures (RS) are epileptic events that are objectively and
          consistently elicited in response to a specific afferent stimulus
          or by an activity of the patient.
        explanation: >-
          Establishes reflex seizures as provoked by definition, creating the
          conflict with the module's unprovoked terminal node that this
          discussion is about. Evidence source is OTHER because this is a
          narrative review, not a primary cohort or case study.
      - reference: PMID:25783594
        reference_title: CHD2 variants are a risk factor for photosensitivity in epilepsy.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We studied 580 individuals with epilepsy and either photosensitive
          seizures or abnormal photoparoxysmal response on
          electroencephalography, or both, and 55 individuals with
          photoparoxysmal response but no seizures.
        explanation: >-
          Shows that the cohort used to establish the genetics of this trait
          was itself drawn from mixed generalized-epilepsy syndromes, not
          only pure reflex cases, which is the empirical basis for the
          complication this discussion raises about subtype entries having
          both provoked and unprovoked seizures.
  - discussion_id: chd2_chromatin_to_hyperexcitability_gap
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: >-
      By what mechanism does CHD2, a chromatin remodeler with no known direct
      role in ion transport or synaptic transmission, produce an acutely
      provokable cortical hyperexcitability, and does that mechanism converge
      on the same excitation-inhibition imbalance this entry's
      pathophysiology chain describes for the channelopathy-driven
      photosensitive syndromes?
    attaches_to:
      - "genetic#CHD2"
      - "pathophysiology#Visual Cortical Hyperexcitability to Flickering Light and Pattern Stimulation"
    rationale: >-
      Every other well-established photosensitive or generalized epilepsy
      gene referenced across this entry's subtypes and elsewhere in the
      knowledge base encodes an ion channel or a direct synaptic protein,
      fitting naturally into the excitation-inhibition imbalance framework
      this entry conforms to. CHD2 is different by the original authors' own
      framing: it is a chromatin remodeler, and how altering chromatin state
      during neurodevelopment produces a cortex that overreacts to a stimulus
      delivered in real time, rather than a fixed developmental malformation,
      is not established. The zebrafish knockdown result shows the effect is
      causal, not merely correlational, but does not by itself identify the
      intermediate steps between chromatin remodeling and acute
      photic-response hyperexcitability, so this is recorded as a knowledge
      gap rather than folded into the pathophysiology chain as an established
      mechanism.
    proposed_experiments:
      - experiment_id: chd2_downstream_expression_profiling
        name: Transcriptomic profiling of visual-cortex neurons in a Chd2-deficient model
        description: >-
          Single-cell or bulk transcriptomic and chromatin-accessibility
          profiling of visual-cortex neurons in a Chd2-deficient animal
          model, testing whether loss of Chd2 dysregulates expression of
          ion-channel or synaptic genes already implicated in the
          excitation-inhibition imbalance module, which would identify a
          convergent downstream pathway.
        decision_criterion: >-
          Dysregulation of known excitability genes would support convergence
          on the module's existing framework; a distinct or absent
          transcriptional signature in relevant excitability genes would
          indicate CHD2 acts through a genuinely separate mechanism not yet
          captured by the module.
    evidence:
      - reference: PMID:25783594
        reference_title: CHD2 variants are a risk factor for photosensitivity in epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          CHD2 does not encode an ion channel, opening new avenues for
          research into human cortical excitability.
        explanation: >-
          The authors' own statement of the mechanistic gap this discussion
          records.
      - reference: PMID:25783594
        reference_title: CHD2 variants are a risk factor for photosensitivity in epilepsy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Chd2 knockdown markedly enhanced mild innate zebrafish larval
          photosensitivity.
        explanation: >-
          Establishes that the CHD2-photosensitivity link is causal in an
          animal model, which is why this is framed as an open question about
          intermediate mechanism rather than about whether an effect exists
          at all.

name: Photosensitive Epilepsy
creation_date: "2026-08-26T00:00:00Z"
category: Complex
description: >-
  Epilepsy in which seizures are reproducibly triggered by intermittent
  photic stimulation, or by structured patterns, rather than occurring purely
  spontaneously. Photosensitivity itself is a heritable trait: an abnormal
  cortical response to flickering light or contrast pattern, visible on EEG as
  the photoparoxysmal response, that exists on a spectrum from an isolated
  laboratory finding with no clinical seizures to fully expressed reflex
  epilepsy. This entry models photosensitive epilepsy as a root concept with
  subtypes, because clinically it is not one thing: a minority of patients
  have "pure" photosensitive epilepsy in which visual stimuli are the only
  identified trigger, but far more often photosensitivity is a trait that
  rides along with a distinct epilepsy syndrome that also has spontaneous,
  unprovoked seizures, most archetypally eyelid myoclonia with absences
  (Jeavons syndrome), and also juvenile myoclonic epilepsy, Dravet syndrome,
  and the progressive myoclonic epilepsies. CHD2 is the best-established
  single-gene contributor identified to date, notable because it does not
  encode an ion channel, which points to chromatin regulation of neuronal
  excitability as a mechanism distinct from the channelopathies that dominate
  the rest of the epilepsy genetics literature.
parents:
  - Epilepsy
  - Neurological Disease
synonyms:
  - PSE
  - photoparoxysmal response
  - photogenic epilepsy
  - photic-induced epilepsy
classifications:
  harrisons_chapter:
    - classification_value: NEUROLOGIC
      notes: >-
        A reflex epilepsy defined by its trigger rather than by a single
        seizure type or EEG pattern; it cuts across the generalized/focal
        divide because most affected patients carry an underlying genetic
        generalized epilepsy syndrome while a minority have a focal
        (occipital) reflex syndrome.
disease_term:
  preferred_term: photosensitive epilepsy
  term:
    id: MONDO:0015643
    label: photosensitive epilepsy
mappings:
  mondo_mappings:
    - term:
        id: MONDO:0015643
        label: photosensitive epilepsy
      mapping_predicate: skos:exactMatch
      mapping_source: MONDO
      mapping_justification: >-
        MONDO:0015643 is defined as "An epilepsy characterized by seizures
        triggered by visual stimuli that form patterns in space or time, such
        as flashing lights," is cross-referenced to OMIM phenotypic series
        PS132100, and carries a formal RO:0009501 (has disposition to bear a
        role) relationship to ECTO:0000007 (exposure to visible light
        radiation) in its own logical definition, which is the same
        relationship this entry's environmental section encodes as
        influences_mechanisms.
has_subtypes:
  - name: Pure Photosensitive Epilepsy
    display_name: Pure (Isolated) Photosensitive Epilepsy
    description: >-
      Photically triggered seizures with no other spontaneous epilepsy
      syndrome: intermittent photic stimulation, and often a specific
      flicker-frequency range, is the only identified seizure trigger, and
      seizures do not occur in its absence. This is the reflex-epilepsy end
      of the spectrum. No dedicated MONDO identifier is bound for this
      subtype beyond the root MONDO:0015643 concept itself: MONDO's own
      children of photosensitive epilepsy (photoparoxysmal response 1-3,
      part of OMIM phenotypic series PS132100) are genetic-linkage loci
      mapped from family studies of the photoparoxysmal EEG trait, not a
      distinct clinical entity matching this description, so binding one of
      them here would overstate what they represent.
    evidence:
      - reference: PMID:35807051
        reference_title: >-
          Photo-Dependent Reflex Seizures-A Scoping Review with Proposal of
          Classification.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Epilepsy with seizures provoked by intermittent light stimulation
          is a distinct group of epilepsies
        explanation: >-
          A recent scoping review treats photically provoked epilepsy as its
          own distinct group, supporting a pure reflex form separate from
          photosensitivity riding along with another syndrome. Evidence
          source is OTHER because this is a review article.
  - name: Photosensitive Occipital Lobe Epilepsy
    subtype_term:
      preferred_term: photosensitive occipital lobe epilepsy
      term:
        id: MONDO:0100021
        label: photosensitive occipital lobe epilepsy
    description: >-
      A focal reflex epilepsy in which flickering light or structured
      pattern, classically television or video games, triggers a seizure
      that begins with elementary visual hallucinations and is accompanied by
      an occipitally confined (rather than generalized) photoparoxysmal
      response. Already fully curated as its own dismech entry; see
      kb/disorders/Photosensitive_Occipital_Lobe_Epilepsy.yaml for the
      detailed pathophysiology, phenotypes, and evidence. This subtype block
      exists to place that entry in the photosensitive-epilepsy family and
      is deliberately not a duplicate of its content.
    evidence:
      - reference: PMID:35503717
        reference_title: >-
          International League Against Epilepsy classification and
          definition of epilepsy syndromes with onset in childhood: Position
          paper by the ILAE Task Force on Nosology and Definitions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Epilepsy syndromes beginning in childhood have been divided into
          three categories: (1) self-limited focal epilepsies, comprising
          four syndromes: self-limited epilepsy with centrotemporal spikes,
          self-limited epilepsy with autonomic seizures, childhood occipital
          visual epilepsy, and photosensitive occipital lobe epilepsy
        explanation: >-
          Establishes photosensitive occipital lobe epilepsy as a current
          ILAE-recognized syndrome, the same citation already used in its own
          entry to ground its nosological status. Evidence source is OTHER
          because this is a nosology position paper, not a primary study.
  - name: Photosensitivity in Juvenile Myoclonic Epilepsy
    subtype_term:
      preferred_term: juvenile myoclonic epilepsy
      term:
        id: MONDO:0009696
        label: juvenile myoclonic epilepsy
    description: >-
      Juvenile myoclonic epilepsy (JME) is fully curated as its own dismech
      entry (kb/disorders/Juvenile_Myoclonic_Epilepsy.yaml); this subtype
      block scopes only the photosensitivity trait within it. Photosensitive
      seizures and an abnormal photoparoxysmal response are common in JME,
      but unlike pure photosensitive epilepsy, most patients also have
      spontaneous myoclonic and generalized tonic-clonic seizures on
      awakening that are not photically triggered, so JME as a whole conforms
      to the module's unprovoked-seizure terminal node in its own entry in a
      way that this photosensitivity-specific subtype block does not
      restate.
    evidence:
      - reference: PMID:25783594
        reference_title: CHD2 variants are a risk factor for photosensitivity in epilepsy.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We sought CHD2 variants in 238 exomes from familial genetic
          generalized epilepsies, and in other public exome data sets.
        explanation: >-
          Documents that the photosensitivity genetics work covered familial
          genetic generalized epilepsies, the category JME belongs to, as
          part of establishing where CHD2 variation contributes across the
          photosensitive-epilepsy spectrum rather than only in the archetypal
          syndrome.
  - name: Photosensitivity as the Archetypal Syndrome, Jeavons Syndrome
    display_name: Jeavons Syndrome (Eyelid Myoclonia with Absences)
    subtype_term:
      preferred_term: epilepsy with eyelid myoclonia
      term:
        id: MONDO:0015346
        label: epilepsy with eyelid myoclonia
    description: >-
      Jeavons syndrome is fully curated as its own dismech entry
      (kb/disorders/Jeavons_Syndrome.yaml). It is placed here as a subtype
      because the literature identifies it as the single syndrome in which
      photosensitivity is not merely a common accompanying trait but is
      part of the syndrome's own defining triad, alongside eyelid myoclonia
      and eye-closure-induced EEG paroxysms, and because it is the syndrome
      in which the CHD2 gene-photosensitivity association was first and most
      strongly established.
    genes:
      - preferred_term: CHD2
        term:
          id: hgnc:1917
          label: CHD2
    evidence:
      - reference: PMID:25783594
        reference_title: CHD2 variants are a risk factor for photosensitivity in epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Among epilepsy syndromes, there was over-representation of unique
          CHD2 variants (3/36 cases) in the archetypal photosensitive
          epilepsy syndrome, eyelid myoclonia with absences (P = 3.50 ×
          10(-4))
        explanation: >-
          States directly that eyelid myoclonia with absences (Jeavons
          syndrome) is the archetypal photosensitive epilepsy syndrome and
          gives the statistical basis for the CHD2 association being
          strongest there.
      - reference: PMID:25783594
        reference_title: CHD2 variants are a risk factor for photosensitivity in epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          CHD2 mutation is the first identified cause of the archetypal
          generalized photosensitive epilepsy syndrome, eyelid myoclonia with
          absences.
        explanation: >-
          The authors' own summary statement naming CHD2 as the first
          identified genetic cause specifically of Jeavons syndrome.
  - name: Photosensitivity in Dravet Syndrome
    subtype_term:
      preferred_term: Dravet syndrome
      term:
        id: MONDO:0100135
        label: Dravet syndrome
    description: >-
      Dravet syndrome is fully curated as its own dismech entry
      (kb/disorders/Dravet_syndrome.yaml); this subtype block scopes only the
      photosensitivity trait within it. Photosensitivity in Dravet syndrome
      (historically described under the older name severe myoclonic epilepsy
      in infancy, SMEI) has been shown to follow a different physiological
      rule from most other photosensitive epilepsies: the photoparoxysmal
      response tends to depend on the total quantity of light delivered
      rather than on its wavelength, unlike the wavelength-dependent pattern
      more typical of localization-related and symptomatic generalized
      epilepsies.
    evidence:
      - reference: PMID:10496248
        reference_title: >-
          Photosensitive epilepsies and pathophysiologic mechanisms of the
          photoparoxysmal response.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Four of the six photosensitive SMEI patients had
          quantity-of-light-dependent PPRs.
        explanation: >-
          Directly reports the quantity-of-light-dependent mechanism found in
          most photosensitive severe myoclonic epilepsy in infancy (Dravet
          syndrome) patients in this cohort, distinguishing it from the
          wavelength-dependent mechanism seen in other syndromes in the same
          study.
  - name: Photosensitivity in the Progressive Myoclonic Epilepsies
    subtype_term:
      preferred_term: progressive myoclonus epilepsy
      term:
        id: MONDO:0020074
        label: progressive myoclonus epilepsy
    description: >-
      The progressive myoclonic epilepsies (individually curated as their own
      dismech entries, e.g. kb/disorders/Progressive_Myoclonic_Epilepsy_Type_7.yaml
      and kb/disorders/Progressive_Myoclonic_Epilepsy_Type_8.yaml) frequently
      show a photoparoxysmal EEG response, most classically in
      Unverricht-Lundborg disease. Unlike the genetic generalized epilepsies
      above, photosensitivity here occurs against a background of a
      degenerative, worsening disease course, and both the spike-wave
      discharges and the photoparoxysmal response have been reported to
      diminish again as the disease reaches adulthood.
    evidence:
      - reference: PMID:18358403
        reference_title: Unverricht-Lundborg progressive myoclonus epilepsy in Oman.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Slowing of background activity, generalized spike-wave discharges,
          and photoparoxysmal responses were evident in all patients'
          electroencephalograms.
        explanation: >-
          Documents the photoparoxysmal response as a universal EEG finding
          in this confirmed Unverricht-Lundborg disease cohort, establishing
          photosensitivity as a feature of the progressive myoclonic
          epilepsies.
      - reference: PMID:18358403
        reference_title: Unverricht-Lundborg progressive myoclonus epilepsy in Oman.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Spike-wave discharges and photoparoxysmal responses tended to
          disappear in adulthood.
        explanation: >-
          Reports the age-dependent attenuation of the photoparoxysmal
          response in this progressive disease, a course distinct from the
          other subtypes in this entry.
references:
  - reference: PMID:35807051
    title: >-
      Photo-Dependent Reflex Seizures-A Scoping Review with Proposal of
      Classification.
  - reference: PMID:10496248
    title: >-
      Photosensitive epilepsies and pathophysiologic mechanisms of the
      photoparoxysmal response.
  - reference: PMID:25783594
    title: CHD2 variants are a risk factor for photosensitivity in epilepsy.
  - reference: PMID:26395125
    title: Overactive visuomotor connections underlie the photoparoxysmal response. A TMS study.
  - reference: PMID:31526678
    title: >-
      Photosensitive epilepsy and photosensitivity of patients with possible
      epilepsy in Chinese Han race: A prospective multicenter study.
  - reference: PMID:30877186
    title: 'Photosensitive epilepsy: Robust clinical efficacy of a selective GABA potentiator.'
notes: >-
  Sourcing. Drafted from primary literature (Takahashi 1999, Galizia et al.
  2015, Strigaro et al. 2015, Bai et al. 2019, Gurrell et al. 2019, and the
  2022 reflex-seizure scoping review), then cross-checked against a
  deep-research report generated with the falcon provider (Edison
  Scientific), committed as
  research/Photosensitive_Epilepsy-deep-research-falcon.md.

  Scope note on eye closure and self-induction. This entry models
  light-triggered and pattern-triggered photosensitivity. It does not model
  self-induced photosensitive epilepsy (Sunflower syndrome, MONDO:0100529),
  in which patients deliberately wave a hand in front of the eyes in bright
  light to self-elicit the response, as a separate subtype: that is a
  distinct behavioral entity layered on top of an underlying
  photosensitivity trait rather than a differently mechanistically triggered
  epilepsy, and it does not yet have its own dismech curation.

  What is deliberately not duplicated here. Five of the six named subtypes
  (photosensitive occipital lobe epilepsy, juvenile myoclonic epilepsy,
  Jeavons syndrome, Dravet syndrome, and the progressive myoclonic
  epilepsies) already have full, independently curated dismech entries. Each
  subtype block here is intentionally thin: it exists to place that entry in
  the photosensitive-epilepsy family via subtype_term and to describe only
  the photosensitivity-specific literature, not to re-derive the full
  pathophysiology, phenotype list, or treatment plan already curated in the
  linked file. A curator editing the photosensitivity content of, say,
  Dravet syndrome should edit both this subtype block and the corresponding
  section of Dravet_syndrome.yaml, since the schema does not provide
  inheritance between them (the same non-DRY relationship that conforms_to
  has to mechanism modules).
inheritance:
  - name: Genetically complex, polygenic trait with identified contributing loci
    description: >-
      Photosensitivity itself is a heritable EEG trait most consistent with
      complex, polygenic inheritance rather than a single Mendelian pattern.
      CHD2 is the best-established single-gene risk-factor contributor
      identified to date (see genetic section), but unique CHD2 variants
      explain only a minority of photosensitive-epilepsy cases, and the
      condition as a whole is genetically heterogeneous. Individual named
      subtypes carry their own, separately curated inheritance patterns in
      their own entries.
    evidence:
      - reference: PMID:25783594
        reference_title: CHD2 variants are a risk factor for photosensitivity in epilepsy.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We identified 11 unique variants in the 580 individuals with
          photosensitive epilepsies and 128 unique variants in the 34 427
          controls: unique CHD2 variation is over-represented in cases
          overall (P = 2.17 × 10(-5))
        explanation: >-
          Quantifies CHD2 as a statistically significant but partial
          contributor (11 of 580 cases carried a unique variant), supporting
          a complex rather than single-gene-necessary inheritance model for
          photosensitivity as a whole.
pathophysiology:
  - name: Visual Cortical Hyperexcitability to Flickering Light and Pattern Stimulation
    biological_scale: TISSUE
    conforms_to: "epilepsy_excitation_inhibition_imbalance#Neuronal Hyperexcitability and Hypersynchrony"
    description: >-
      The root abnormality is a visual cortex, and adjoining parietal
      cortex, that responds to flickering light or a structured pattern with
      an excessive, hypersynchronous discharge rather than a normal evoked
      response. This is a heritable trait present with or without clinical
      seizures, and it is the abnormality that the photoparoxysmal response
      makes visible on EEG.
    locations:
      - preferred_term: primary visual cortex
        term:
          id: UBERON:0002436
          label: primary visual cortex
    biological_processes:
      - preferred_term: detection of light stimulus involved in visual perception
        term:
          id: GO:0050908
          label: detection of light stimulus involved in visual perception
        modifier: ABNORMAL
    downstream:
      - target: Photoparoxysmal EEG Response
    evidence:
      - reference: PMID:25783594
        reference_title: CHD2 variants are a risk factor for photosensitivity in epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Photosensitivity is a heritable abnormal cortical response to
          flickering light, manifesting as particular electroencephalographic
          changes, with or without seizures.
        explanation: >-
          Defines photosensitivity itself as the abnormal cortical response
          this node models, and establishes that it is heritable and exists
          independently of overt seizures.
      - reference: PMID:35807051
        reference_title: >-
          Photo-Dependent Reflex Seizures-A Scoping Review with Proposal of
          Classification.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          the patient's response to intermittent photic stimulation
        explanation: >-
          Frames the abnormal cortical response as specifically a response
          to intermittent photic stimulation, the common trigger this node
          and the linked environmental exposure both describe. Evidence
          source is OTHER because this is a review article.
  - name: Photoparoxysmal EEG Response
    biological_scale: TISSUE
    description: >-
      The electrographic signature elicited by intermittent photic
      stimulation: spike, polyspike, or spike-wave discharges appearing
      during or immediately after the stimulus train, usually with a
      generalized or bilateral field in the syndromes modeled by this entry
      (in contrast to the occipitally confined response of the separately
      curated photosensitive occipital lobe epilepsy subtype). The
      physiological rule governing elicitation differs by underlying
      syndrome: some patients' responses depend on stimulus wavelength, while
      others', notably in Dravet syndrome, depend instead on the total
      quantity of light delivered.
    downstream:
      - target: Visual-to-Motor Cortical Hyperexcitable Spread
    evidence:
      - reference: PMID:10496248
        reference_title: >-
          Photosensitive epilepsies and pathophysiologic mechanisms of the
          photoparoxysmal response.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The authors found two types of pathophysiologic mechanisms of PPRs
          (wavelength-dependent PPRs and quantity-of-light-dependent PPRs) in
          patients with idiopathic generalized epilepsy and hereditary
          dentatorubral-pallidoluysian atrophy.
        explanation: >-
          Establishes the two distinct physiological mechanisms that
          generate the photoparoxysmal response and ties them to different
          underlying epilepsy syndromes, which is the basis for this node's
          claim that the eliciting rule is syndrome-dependent.
      - reference: PMID:10496248
        reference_title: >-
          Photosensitive epilepsies and pathophysiologic mechanisms of the
          photoparoxysmal response.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          The type of pathophysiologic mechanism for eliciting PPRs by
          low-luminance photic stimulation was closely related to the
          classification of the epilepsy syndrome.
        explanation: >-
          The authors' own concluding statement linking PPR-eliciting
          mechanism to epilepsy syndrome classification.
      - reference: PMID:31526678
        reference_title: >-
          Photosensitive epilepsy and photosensitivity of patients with
          possible epilepsy in Chinese Han race: A prospective multicenter
          study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          69.9% patients were evoked by frequency ranged 8 Hz-25 Hz, with
          accompanying seizures in 13 patients.
        explanation: >-
          Quantifies the flicker-frequency range that elicits the response in
          a large prospective cohort and the minority in whom the
          electrographic response is accompanied by a clinical seizure.
  - name: Visual-to-Motor Cortical Hyperexcitable Spread
    biological_scale: TISSUE
    description: >-
      Once elicited in visual cortex, the discharge does not stay contained:
      transcranial magnetic stimulation studies show that the normal
      inhibitory connection from primary visual cortex to primary motor
      cortex is lost specifically in patients who currently show a
      photoparoxysmal response, so that motor cortex responds excessively to
      visual-cortex input. This overactive visuomotor connection is proposed
      as the mechanistic bridge between an occipital electrographic event and
      the myoclonic and generalized motor phenomena that follow it.
    locations:
      - preferred_term: primary motor cortex
        term:
          id: UBERON:0001384
          label: primary motor cortex
    downstream:
      - target: Photically Provoked Seizure Generation
    evidence:
      - reference: PMID:26395125
        reference_title: >-
          Overactive visuomotor connections underlie the photoparoxysmal
          response. A TMS study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          IGE patients with a PPR have an overactive functional response of
          M1 to inputs traveling from V1.
        explanation: >-
          The authors' direct conclusion establishing the overactive
          visual-to-motor cortical connection this node models.
      - reference: PMID:26395125
        reference_title: >-
          Overactive visuomotor connections underlie the photoparoxysmal
          response. A TMS study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          This was not true in PPR-positive IGE patients, in whom this type
          of physiologic inhibition was significantly (p < 0.05) reduced.
        explanation: >-
          The specific measurement behind the claim: the normal V1-to-M1
          inhibitory effect measured by TMS was significantly reduced only in
          patients currently showing a photoparoxysmal response, not in
          photonegative patients or healthy controls.
  - name: Photically Provoked Seizure Generation
    biological_scale: ORGANISM
    description: >-
      The clinical seizure: myoclonic jerks, absence, or generalized
      tonic-clonic activity emerging once the visuomotor spread recruits
      enough cortex to produce a symptom. Which seizure type predominates
      depends on the underlying syndrome rather than on the trigger itself,
      which is why the same photic stimulus produces eyelid myoclonia in
      Jeavons syndrome, myoclonic jerks in juvenile myoclonic epilepsy, and
      occipital visual seizures in photosensitive occipital lobe epilepsy.
    downstream:
      - target: Recurrent Visually Provoked Seizures
    evidence:
      - reference: PMID:31526678
        reference_title: >-
          Photosensitive epilepsy and photosensitivity of patients with
          possible epilepsy in Chinese Han race: A prospective multicenter
          study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          6 of 9 patients with eyes closure sensitivity experienced epileptic
          seizures during IPS.
        explanation: >-
          Direct observation of the electrographic-to-clinical transition,
          in this case in patients with eye-closure sensitivity, a subset of
          the photosensitivity trait.
  - name: Recurrent Visually Provoked Seizures
    biological_scale: ORGANISM
    description: >-
      The clinical epilepsy at its purest: seizures reliably and repeatedly
      elicited by the same class of visual stimulus. This node deliberately
      does not conform to the module's Recurrent Unprovoked Seizures node;
      see the attached discussion. It describes the reflex component common
      to every subtype in this entry, not the full clinical picture of any
      one of them; the subtype blocks and their linked entries additionally
      describe spontaneous, unprovoked seizures where those occur.
    evidence:
      - reference: PMID:34221545
        reference_title: Reflex Epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Reflex seizures (RS) are epileptic events that are objectively and
          consistently elicited in response to a specific afferent stimulus
          or by an activity of the patient.
        explanation: >-
          Defines the reflex seizure by its consistent elicitation, the
          property that makes photically provoked seizures provoked by
          definition and grounds the module-boundary discussion attached to
          this node.
phenotypes:
  - category: Neurological
    name: Visually Provoked Seizures
    description: >-
      Seizures reliably elicited by flickering light or a structured visual
      pattern.
    phenotype_term:
      preferred_term: Visually-induced seizure
      term:
        id: HP:0020216
        label: Visually-induced seizure
    frequency: VERY_FREQUENT
    evidence:
      - reference: PMID:35807051
        reference_title: >-
          Photo-Dependent Reflex Seizures-A Scoping Review with Proposal of
          Classification.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Photo-dependent reflex seizures make up the majority of this type
          of disorder among reflex seizures.
        explanation: >-
          Establishes visually provoked seizures as the majority form of
          reflex seizures overall, supporting a very frequent band for this
          defining feature. Evidence source is OTHER because this is a
          review article.
  - category: Neurological
    name: Photoparoxysmal Response on Intermittent Photic Stimulation
    description: >-
      Generalized or bilateral spike, polyspike, or spike-wave discharges
      elicited on EEG by intermittent photic stimulation, the laboratory
      correlate of the trigger.
    phenotype_term:
      preferred_term: EEG with photoparoxysmal response
      term:
        id: HP:0010852
        label: EEG with photoparoxysmal response
    frequency: VERY_FREQUENT
    evidence:
      - reference: PMID:31526678
        reference_title: >-
          Photosensitive epilepsy and photosensitivity of patients with
          possible epilepsy in Chinese Han race: A prospective multicenter
          study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Of the 73 patients with PPR to IPS, 48 were female.
        explanation: >-
          Documents the photoparoxysmal response as the ascertainment
          criterion for this large prospective cohort, and separately
          supports the female preponderance noted elsewhere in this entry.
  - category: Neurological
    name: Photosensitive Myoclonic Seizures
    description: >-
      Myoclonic jerks provoked by photic stimulation, the predominant seizure
      type in the genetic generalized photosensitive syndromes such as
      Jeavons syndrome and juvenile myoclonic epilepsy.
    phenotype_term:
      preferred_term: Photosensitive myoclonic seizure
      term:
        id: HP:0001327
        label: Photosensitive myoclonic seizure
    frequency: FREQUENT
    evidence:
      - reference: PMID:25783594
        reference_title: CHD2 variants are a risk factor for photosensitivity in epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We studied 580 individuals with epilepsy and either photosensitive
          seizures or abnormal photoparoxysmal response on
          electroencephalography, or both, and 55 individuals with
          photoparoxysmal response but no seizures.
        explanation: >-
          Establishes photosensitive seizures, predominantly myoclonic in the
          genetic generalized syndromes this cohort was drawn from, as a
          recurrent clinical finding across a large ascertained sample.
  - category: Neurological
    name: Photosensitive Tonic-Clonic Seizures
    description: >-
      Bilateral tonic-clonic seizures provoked by photic stimulation, seen
      when the propagated discharge engages a sufficiently large cortical and
      subcortical network rather than remaining restricted to a myoclonic
      jerk.
    phenotype_term:
      preferred_term: Photosensitive tonic-clonic seizure
      term:
        id: HP:0007207
        label: Photosensitive tonic-clonic seizure
    frequency: OCCASIONAL
    evidence:
      - reference: PMID:31526678
        reference_title: >-
          Photosensitive epilepsy and photosensitivity of patients with
          possible epilepsy in Chinese Han race: A prospective multicenter
          study.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          6 of 9 patients with eyes closure sensitivity experienced epileptic
          seizures during IPS.
        explanation: >-
          Supports that only a minority of photosensitive patients, even
          within the eye-closure-sensitive subgroup, go on to have a clinical
          seizure of any type during stimulation, consistent with an
          occasional rather than very frequent band for a fully generalized
          seizure specifically.
  - category: Neurological
    name: Eyelid Myoclonia Seizures
    subtype: Photosensitivity as the Archetypal Syndrome, Jeavons Syndrome
    description: >-
      Brief, rapid eyelid jerks with upward eye deviation, typically provoked
      by eye closure in bright light. The defining seizure type of Jeavons
      syndrome, included here because eye-closure sensitivity is itself part
      of the photosensitivity trait spectrum this entry models.
    phenotype_term:
      preferred_term: Eyelid myoclonia seizure
      term:
        id: HP:0032678
        label: Eyelid myoclonia seizure
    frequency: VERY_FREQUENT
    evidence:
      - reference: PMID:25783594
        reference_title: CHD2 variants are a risk factor for photosensitivity in epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Among epilepsy syndromes, there was over-representation of unique
          CHD2 variants (3/36 cases) in the archetypal photosensitive
          epilepsy syndrome, eyelid myoclonia with absences (P = 3.50 ×
          10(-4))
        explanation: >-
          Names eyelid myoclonia with absences as the archetypal
          photosensitive epilepsy syndrome, supporting a very frequent band
          for its defining seizure type within this subtype.
genetic:
  - name: CHD2
    gene_term:
      preferred_term: CHD2
      term:
        id: hgnc:1917
        label: CHD2
    relationship_type: RISK_FACTOR
    association: >-
      Unique (singleton) CHD2 variants are significantly over-represented in
      people with photosensitive epilepsies compared to population controls,
      and are the strongest single-gene contributor identified to date. CHD2
      encodes an ATP-dependent chromodomain-helicase-DNA-binding chromatin
      remodeler rather than an ion channel, which is notable because nearly
      every other established photosensitive/generalized epilepsy gene
      encodes a channel or a direct synaptic protein; how chromatin
      remodeling during neurodevelopment produces an acutely provokable
      cortical hyperexcitability is not established. Severe, fully
      penetrant loss-of-function CHD2 variants instead cause a distinct,
      separately curated developmental and epileptic encephalopathy
      (kb/disorders/CHD2-Related_Developmental_and_Epileptic_Encephalopathy.yaml);
      the risk-factor association modeled here is the milder, incompletely
      penetrant end of the same gene's phenotypic spectrum, seen in people
      whose epilepsy is not a fully expressed encephalopathy.
    case_fractions:
      - population: >-
          580 individuals with photosensitive seizures and/or abnormal
          photoparoxysmal response (EuroEPINOMICS CoGIE consortium)
        case_fraction_percent: 1.9
        cohort_size: 580
        notes: >-
          11 of 580 individuals carried a unique CHD2 variant (11/580 ≈
          1.9%), a statistically significant excess over the 128/34427 rate
          in unselected population controls (P = 2.17 x 10^-5), but still a
          minority of cases overall.
        evidence:
          - reference: PMID:25783594
            supports: SUPPORT
            evidence_source: HUMAN_CLINICAL
            snippet: >-
              We identified 11 unique variants in the 580 individuals with
              photosensitive epilepsies and 128 unique variants in the 34
              427 controls: unique CHD2 variation is over-represented in
              cases overall (P = 2.17 × 10(-5)).
            explanation: >-
              Source of the case count and control comparison used to derive
              the case fraction.
      - population: Eyelid myoclonia with absences (Jeavons syndrome) subgroup, n=36
        case_fraction_percent: 8.3
        cohort_size: 36
        notes: 3 of 36 Jeavons syndrome cases carried a unique CHD2 variant.
        evidence:
          - reference: PMID:25783594
            supports: SUPPORT
            evidence_source: HUMAN_CLINICAL
            snippet: >-
              there was over-representation of unique CHD2 variants (3/36
              cases) in the archetypal photosensitive epilepsy syndrome,
              eyelid myoclonia with absences (P = 3.50 × 10(-4))
            explanation: >-
              Source of the syndrome-specific case count showing a higher
              CHD2 yield within Jeavons syndrome than in the mixed
              photosensitive-epilepsy cohort overall.
    evidence:
      - reference: PMID:25783594
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Chd2 knockdown markedly enhanced mild innate zebrafish larval
          photosensitivity.
        explanation: >-
          Zebrafish chd2 knockdown causally enhances photosensitivity in
          vivo, supporting a functional, not merely statistical, role for
          CHD2 loss in the photosensitivity trait.
      - reference: PMID:25783594
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          CHD2 does not encode an ion channel, opening new avenues for
          research into human cortical excitability.
        explanation: >-
          The authors' own framing of CHD2 as mechanistically distinct from
          the channelopathies that dominate epilepsy genetics, which is the
          basis for treating the CHD2-to-hyperexcitability link as an open
          mechanistic question rather than an established pathway.
environmental:
  - name: Intermittent Photic Stimulation and Structured Visual Patterns
    description: >-
      Flickering light (natural, such as sunlight through trees or on water,
      or artificial, such as strobe lighting, television, and video games) and
      structured high-contrast patterns are the reproducible triggers that
      define this entry. MONDO's own logical definition of photosensitive
      epilepsy binds the visible-light exposure directly to the disease
      concept, which this environmental entry mirrors with a pathograph link
      rather than only a textual description.
    exposure_term:
      preferred_term: exposure to visible light radiation
      term:
        id: ECTO:0000007
        label: exposure to visible light radiation
    evidence:
      - reference: PMID:25783594
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Photosensitivity is a heritable abnormal cortical response to
          flickering light, manifesting as particular electroencephalographic
          changes, with or without seizures.
        explanation: >-
          Establishes flickering light exposure as the trigger of the
          abnormal cortical response that defines photosensitivity, the
          general claim this environmental entry as a whole makes.
    influences_mechanisms:
      - target: Visual Cortical Hyperexcitability to Flickering Light and Pattern Stimulation
        environmental_effect: TRIGGERS
        causal_link_type: DIRECT
        description: >-
          Delivery of intermittent photic stimulation, at an individually
          variable flicker-frequency range, is the direct proximate trigger
          of the abnormal cortical response that this entry's pathophysiology
          chain begins with; it is also the basis of the standard diagnostic
          EEG provocation procedure.
        evidence:
          - reference: PMID:31526678
            supports: SUPPORT
            evidence_source: HUMAN_CLINICAL
            snippet: >-
              69.9% patients were evoked by frequency ranged 8 Hz-25 Hz, with
              accompanying seizures in 13 patients.
            explanation: >-
              Quantifies the flicker-frequency range that triggers the
              cortical response in a large prospective cohort, directly
              supporting the TRIGGERS relationship asserted here.
    notes: >-
      Structured, high-contrast patterns (stripes, checkerboards) are a
      related and well-documented trigger, sometimes acting even under
      constant illumination without flicker, but ECTO was searched and has no
      dedicated exposure term for pattern stimulation distinct from visible
      light exposure in general; binding one here would misrepresent what
      ECTO:0000007 actually covers, so pattern sensitivity is described in
      prose only rather than given its own exposure_term.
diagnosis:
  - name: Electroencephalography with Intermittent Photic Stimulation
    description: >-
      The core diagnostic investigation, and a deliberately provocative one:
      a standardized flash sequence across a range of frequencies is
      delivered during EEG recording specifically to elicit the
      photoparoxysmal response, with and without eye closure, since eye
      closure itself can gate the response.
    diagnosis_term:
      preferred_term: Electroencephalography
      term:
        id: NCIT:C38054
        label: Electroencephalography
    evidence:
      - reference: PMID:31526678
        reference_title: >-
          Photosensitive epilepsy and photosensitivity of patients with
          possible epilepsy in Chinese Han race: A prospective multicenter
          study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          6 of 9 patients with eyes closure sensitivity experienced epileptic
          seizures during IPS.
        explanation: >-
          Documents eye closure as a specific, separately assessed component
          of the standard intermittent photic stimulation protocol.
treatments:
  - name: Antiseizure Pharmacotherapy
    description: >-
      Valproate is the conventional first-line agent for photosensitive
      epilepsy and reliably suppresses the photoparoxysmal response;
      levetiracetam is a common alternative, particularly favored in girls
      and young women given valproate's teratogenicity and other
      reproductive-health concerns.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
      therapeutic_agent:
        - preferred_term: valproic acid
          term:
            id: CHEBI:39867
            label: valproic acid
        - preferred_term: levetiracetam
          term:
            id: CHEBI:6437
            label: levetiracetam
    target_mechanisms:
      - target: Visual-to-Motor Cortical Hyperexcitable Spread
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:40580381
        reference_title: >-
          Evidence of Sex-Related Pharmacodynamic Differences in
          Photosensitive Epilepsy Treated with Valproate: Findings from a
          Retrospective, Observational, Single-Center, Within-Patient,
          Cohort Study.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          It is well established that VPA reduces or suppresses PPR, as
          first shown after single oral doses in seven out of nine
          photosensitive patients
        explanation: >-
          States directly that valproate reduces or suppresses the
          photoparoxysmal response, the basis for describing it as the
          conventional first-line agent for photosensitive epilepsy.
  - name: Investigational GABAergic Positive Allosteric Modulation
    description: >-
      PF-06372865, an alpha2/3/5-subunit-selective GABA-A receptor positive
      allosteric modulator designed to avoid the alpha1-mediated sedative and
      dependence liabilities of benzodiazepines, produced a marked and
      statistically significant suppression of the photoparoxysmal response
      in a phase 2a proof-of-principle study, comparable in magnitude to
      lorazepam. This is investigational rather than an approved therapy, but
      is included because the human photosensitivity model is being used
      directly as a translational efficacy readout for this drug class.
    therapeutic_modality: SMALL_MOLECULE
    treatment_term:
      preferred_term: Pharmacotherapy
      term:
        id: NCIT:C15986
        label: Pharmacotherapy
    target_mechanisms:
      - target: Visual Cortical Hyperexcitability to Flickering Light and Pattern Stimulation
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:30877186
        reference_title: >-
          Photosensitive epilepsy: Robust clinical efficacy of a selective
          GABA potentiator.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Both doses of PF-06372865 produced a marked and statistically
          significant mean reduction in SPR compared to placebo, which was
          similar in degree to lorazepam.
        explanation: >-
          The primary efficacy result supporting the INHIBITS relationship
          asserted on this treatment.
      - reference: PMID:30877186
        reference_title: >-
          Photosensitive epilepsy: Robust clinical efficacy of a selective
          GABA potentiator.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          There was complete suppression of SPR in 6/7 participants following
          PF-06372865 or lorazepam administration.
        explanation: >-
          Quantifies the magnitude of response suppression achieved.
  - name: Trigger Avoidance and Environmental Modification
    description: >-
      Because seizures are elicited rather than spontaneous in the reflex
      component this entry models, reducing exposure (distance from screens,
      avoiding untreated strobe environments, monocular viewing, and
      polarized or colored lenses that reduce the effective flicker or
      contrast reaching the retina) is genuinely therapeutic rather than
      merely precautionary, and is standard advice alongside medication.
    therapeutic_modality: BEHAVIORAL
    treatment_term:
      preferred_term: Lifestyle Therapy
      term:
        id: NCIT:C15900
        label: Lifestyle Therapy
    target_mechanisms:
      - target: Visual Cortical Hyperexcitability to Flickering Light and Pattern Stimulation
        treatment_effect: INHIBITS
    evidence:
      - reference: PMID:34221545
        reference_title: Reflex Epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Treatment includes antiseizure medication, commonly valproate or
          levetiracetam, along with lifestyle modifications, and when
          amenable, surgical intervention.
        explanation: >-
          Places lifestyle modification alongside pharmacotherapy as a
          standard component of treatment for reflex epilepsies, the category
          photosensitive epilepsy belongs to.
differential_diagnoses:
  - name: Self-Induced (Sunflower) Photosensitive Epilepsy
    description: >-
      A behaviorally distinct entity in which the patient deliberately
      elicits the photoparoxysmal response by waving fingers in front of the
      eyes in bright light, rather than passively encountering an
      environmental trigger. Not modeled as a subtype here (see notes); no
      MONDO disease_term is bound in this differential-diagnosis block
      because it names a related concept (MONDO:0100529, Sunflower syndrome)
      that this entry does not itself curate.
    distinguishing_features:
      - The stimulus is self-generated by hand-waving rather than encountered environmentally.
      - Behavior is often compulsive and difficult to interrupt, with a described self-reinforcing quality.
    evidence:
      - reference: PMID:35807051
        reference_title: >-
          Photo-Dependent Reflex Seizures-A Scoping Review with Proposal of
          Classification.
        supports: PARTIAL
        evidence_source: OTHER
        snippet: >-
          Epilepsy with seizures provoked by intermittent light stimulation
          is a distinct group of epilepsies
        explanation: >-
          Supports treating photically provoked epilepsies as a distinct
          group within which self-induced forms are a recognized but
          behaviorally separate presentation. Evidence source is OTHER
          because this is a review article.
  - name: Fixation-Off Sensitivity Epilepsies
    description: >-
      Epilepsies, such as childhood occipital visual epilepsy, in which
      removing central visual fixation (eye closure in darkness, or
      convergence) rather than photic stimulation itself is the gating
      electrographic phenomenon. Distinguished by the opposite manipulation:
      photosensitive epilepsy's photoparoxysmal response requires a light
      stimulus, while fixation-off sensitivity requires the absence of
      structured foveal vision.
    distinguishing_features:
      - The gating manipulation is loss of central fixation, not delivery of a light or pattern stimulus.
      - Seizures occur spontaneously rather than being elicited by an external visual trigger.
    evidence:
      - reference: PMID:35503717
        reference_title: >-
          International League Against Epilepsy classification and
          definition of epilepsy syndromes with onset in childhood: Position
          paper by the ILAE Task Force on Nosology and Definitions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Epilepsy syndromes beginning in childhood have been divided into
          three categories: (1) self-limited focal epilepsies, comprising
          four syndromes: self-limited epilepsy with centrotemporal spikes,
          self-limited epilepsy with autonomic seizures, childhood occipital
          visual epilepsy, and photosensitive occipital lobe epilepsy
        explanation: >-
          Lists childhood occipital visual epilepsy, the fixation-off
          sensitivity syndrome, alongside photosensitive occipital lobe
          epilepsy as a separate, nosologically distinct syndrome despite
          the clinical closeness POLE's own entry discusses in detail.
discussions:
  - discussion_id: pse_provoked_seizure_module_boundary
    kind: OPEN_QUESTION
    status: OPEN
    prompt: >-
      Should photosensitive epilepsy conform to the
      epilepsy_excitation_inhibition_imbalance module's terminal node,
      Recurrent Unprovoked Seizures, given that its defining feature is a
      reproducibly provoked seizure, and how should that boundary be recorded
      when a subtype (JME, Dravet, the PMEs) genuinely has both provoked and
      unprovoked seizures?
    attaches_to:
      - "pathophysiology#Recurrent Visually Provoked Seizures"
    rationale: >-
      This entry declares conformance to
      epilepsy_excitation_inhibition_imbalance at the Neuronal
      Hyperexcitability and Hypersynchrony node and stops there, for the same
      reason already recorded in
      kb/disorders/Photosensitive_Occipital_Lobe_Epilepsy.yaml: the module's
      terminal node is Recurrent Unprovoked Seizures, and reflex seizures are
      elicited by definition, so declaring conformance there would assert the
      negation of the defining property of the reflex component this entry
      models. The complication specific to this root entry, and not shared by
      POLE, is that most of its named subtypes (JME, Jeavons syndrome, Dravet
      syndrome, the PMEs) are not purely reflex: they also have genuinely
      spontaneous, unprovoked seizures, and those subtypes' own separately
      curated entries may correctly conform to the terminal node for that
      reason. This entry's photosensitivity-scoped pathophysiology chain
      should not be read as contradicting that; it describes only the reflex
      component common to the whole family, deliberately leaving the
      unprovoked-seizure question to each subtype's own full entry.
    proposed_experiments:
      - experiment_id: pse_module_node_audit
        name: Audit of reflex-epilepsy and mixed-trigger entries against the module terminal node
        description: >-
          Extending the audit already proposed in the
          Photosensitive_Occipital_Lobe_Epilepsy entry, specifically compare
          how the terminal node is (or is not) declared across purely reflex
          entries versus mixed entries like this one that have both a
          reflex-scoped root and unprovoked-seizure-capable subtypes.
        decision_criterion: >-
          If curators consistently split conformance the way this entry does
          (reflex root stops short, individual mixed subtype entries conform
          separately), that confirms the current approach as the intended
          pattern rather than an ad hoc choice, and the module documentation
          should say so explicitly.
    evidence:
      - reference: PMID:34221545
        reference_title: Reflex Epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Reflex seizures (RS) are epileptic events that are objectively and
          consistently elicited in response to a specific afferent stimulus
          or by an activity of the patient.
        explanation: >-
          Establishes reflex seizures as provoked by definition, creating the
          conflict with the module's unprovoked terminal node that this
          discussion is about.
      - reference: PMID:25783594
        reference_title: CHD2 variants are a risk factor for photosensitivity in epilepsy.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We studied 580 individuals with epilepsy and either photosensitive
          seizures or abnormal photoparoxysmal response on
          electroencephalography, or both, and 55 individuals with
          photoparoxysmal response but no seizures.
        explanation: >-
          Shows that the cohort used to establish the genetics of this trait
          was itself drawn from mixed generalized-epilepsy syndromes, not
          only pure reflex cases, which is the empirical basis for the
          complication this discussion raises about subtype entries having
          both provoked and unprovoked seizures.
  - discussion_id: chd2_chromatin_to_hyperexcitability_gap
    kind: KNOWLEDGE_GAP
    status: OPEN
    prompt: >-
      By what mechanism does CHD2, a chromatin remodeler with no known direct
      role in ion transport or synaptic transmission, produce an acutely
      provokable cortical hyperexcitability, and does that mechanism converge
      on the same excitation-inhibition imbalance this entry's
      pathophysiology chain describes for the channelopathy-driven
      photosensitive syndromes?
    attaches_to:
      - "genetic#CHD2"
      - "pathophysiology#Visual Cortical Hyperexcitability to Flickering Light and Pattern Stimulation"
    rationale: >-
      Every other well-established photosensitive or generalized epilepsy
      gene referenced across this entry's subtypes and elsewhere in the
      knowledge base encodes an ion channel or a direct synaptic protein,
      fitting naturally into the excitation-inhibition imbalance framework
      this entry conforms to. CHD2 is different by the original authors' own
      framing: it is a chromatin remodeler, and how altering chromatin state
      during neurodevelopment produces a cortex that overreacts to a stimulus
      delivered in real time, rather than a fixed developmental malformation,
      is not established. The zebrafish knockdown result shows the effect is
      causal, not merely correlational, but does not by itself identify the
      intermediate steps between chromatin remodeling and acute
      photic-response hyperexcitability, so this is recorded as a knowledge
      gap rather than folded into the pathophysiology chain as an established
      mechanism.
    proposed_experiments:
      - experiment_id: chd2_downstream_expression_profiling
        name: Transcriptomic profiling of visual-cortex neurons in a Chd2-deficient model
        description: >-
          Single-cell or bulk transcriptomic and chromatin-accessibility
          profiling of visual-cortex neurons in a Chd2-deficient animal
          model, testing whether loss of Chd2 dysregulates expression of
          ion-channel or synaptic genes already implicated in the
          excitation-inhibition imbalance module, which would identify a
          convergent downstream pathway.
        decision_criterion: >-
          Dysregulation of known excitability genes would support convergence
          on the module's existing framework; a distinct or absent
          transcriptional signature in relevant excitability genes would
          indicate CHD2 acts through a genuinely separate mechanism not yet
          captured by the module.
    evidence:
      - reference: PMID:25783594
        reference_title: CHD2 variants are a risk factor for photosensitivity in epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          CHD2 does not encode an ion channel, opening new avenues for
          research into human cortical excitability.
        explanation: >-
          The authors' own statement of the mechanistic gap this discussion
          records.
      - reference: PMID:25783594
        reference_title: CHD2 variants are a risk factor for photosensitivity in epilepsy.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Chd2 knockdown markedly enhanced mild innate zebrafish larval
          photosensitivity.
        explanation: >-
          Establishes that the CHD2-photosensitivity link is causal in an
          animal model, which is why this is framed as an open question about
          intermediate mechanism rather than about whether an effect exists
          at all.

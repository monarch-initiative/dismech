name: Photosensitive Epilepsy
creation_date: "2026-08-26T00:00:00Z"
category: Complex
description: >-
  Epilepsy in which seizures are reproducibly triggered by intermittent
  photic stimulation, or by structured patterns, rather than occurring purely
  spontaneously. Photosensitivity itself is a heritable trait: an abnormal
  cortical response to flickering light or contrast pattern, visible on EEG as
  the photoparoxysmal response, that exists on a spectrum from an isolated
  laboratory finding with no clinical seizures to fully expressed reflex
  epilepsy. This entry models photosensitive epilepsy as a root concept with
  subtypes, because clinically it is not one thing: a minority of patients
  have "pure" photosensitive epilepsy in which visual stimuli are the only
  identified trigger, but far more often photosensitivity is a trait that
  rides along with a distinct epilepsy syndrome that also has spontaneous,
  unprovoked seizures, most archetypally eyelid myoclonia with absences
  (Jeavons syndrome), and also juvenile myoclonic epilepsy, Dravet syndrome,
  and the progressive myoclonic epilepsies. CHD2 is the best-established
  single-gene contributor identified to date, notable because it does not
  encode an ion channel, which points to chromatin regulation of neuronal
  excitability as a mechanism distinct from the channelopathies that dominate
  the rest of the epilepsy genetics literature.
parents:
  - Epilepsy
  - Neurological Disease
synonyms:
  - PSE
  - photoparoxysmal response
  - photogenic epilepsy
  - photic-induced epilepsy
classifications:
  harrisons_chapter:
    - classification_value: NEUROLOGIC
      notes: >-
        A reflex epilepsy defined by its trigger rather than by a single
        seizure type or EEG pattern; it cuts across the generalized/focal
        divide because most affected patients carry an underlying genetic
        generalized epilepsy syndrome while a minority have a focal
        (occipital) reflex syndrome.
disease_term:
  preferred_term: photosensitive epilepsy
  term:
    id: MONDO:0015643
    label: photosensitive epilepsy
mappings:
  mondo_mappings:
    - term:
        id: MONDO:0015643
        label: photosensitive epilepsy
      mapping_predicate: skos:exactMatch
      mapping_source: MONDO
      mapping_justification: >-
        MONDO:0015643 is defined as "An epilepsy characterized by seizures
        triggered by visual stimuli that form patterns in space or time, such
        as flashing lights," is cross-referenced to OMIM phenotypic series
        PS132100, and carries a formal RO:0009501 (has disposition to bear a
        role) relationship to ECTO:0000007 (exposure to visible light
        radiation) in its own logical definition, which is the same
        relationship this entry's environmental section encodes as
        influences_mechanisms.
has_subtypes:
  - name: Pure Photosensitive Epilepsy
    display_name: Pure (Isolated) Photosensitive Epilepsy
    description: >-
      Photically triggered seizures with no other spontaneous epilepsy
      syndrome: intermittent photic stimulation, and often a specific
      flicker-frequency range, is the only identified seizure trigger, and
      seizures do not occur in its absence. This is the reflex-epilepsy end
      of the spectrum. No dedicated MONDO identifier is bound for this
      subtype beyond the root MONDO:0015643 concept itself: MONDO's own
      children of photosensitive epilepsy (photoparoxysmal response 1-3,
      part of OMIM phenotypic series PS132100) are genetic-linkage loci
      mapped from family studies of the photoparoxysmal EEG trait, not a
      distinct clinical entity matching this description, so binding one of
      them here would overstate what they represent.
    evidence:
      - reference: PMID:35807051
        reference_title: >-
          Photo-Dependent Reflex Seizures-A Scoping Review with Proposal of
          Classification.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Epilepsy with seizures provoked by intermittent light stimulation
          is a distinct group of epilepsies
        explanation: >-
          A recent scoping review treats photically provoked epilepsy as its
          own distinct group, supporting a pure reflex form separate from
          photosensitivity riding along with another syndrome. Evidence
          source is OTHER because this is a review article.
  - name: Photosensitive Occipital Lobe Epilepsy
    subtype_term:
      preferred_term: photosensitive occipital lobe epilepsy
      term:
        id: MONDO:0100021
        label: photosensitive occipital lobe epilepsy
    description: >-
      A focal reflex epilepsy in which flickering light or structured
      pattern, classically television or video games, triggers a seizure
      that begins with elementary visual hallucinations and is accompanied by
      an occipitally confined (rather than generalized) photoparoxysmal
      response. Already fully curated as its own dismech entry; see
      kb/disorders/Photosensitive_Occipital_Lobe_Epilepsy.yaml for the
      detailed pathophysiology, phenotypes, and evidence. This subtype block
      exists to place that entry in the photosensitive-epilepsy family and
      is deliberately not a duplicate of its content.
    evidence:
      - reference: PMID:35503717
        reference_title: >-
          International League Against Epilepsy classification and
          definition of epilepsy syndromes with onset in childhood: Position
          paper by the ILAE Task Force on Nosology and Definitions.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: >-
          Epilepsy syndromes beginning in childhood have been divided into
          three categories: (1) self-limited focal epilepsies, comprising
          four syndromes: self-limited epilepsy with centrotemporal spikes,
          self-limited epilepsy with autonomic seizures, childhood occipital
          visual epilepsy, and photosensitive occipital lobe epilepsy
        explanation: >-
          Establishes photosensitive occipital lobe epilepsy as a current
          ILAE-recognized syndrome, the same citation already used in its own
          entry to ground its nosological status. Evidence source is OTHER
          because this is a nosology position paper, not a primary study.
  - name: Photosensitivity in Juvenile Myoclonic Epilepsy
    subtype_term:
      preferred_term: juvenile myoclonic epilepsy
      term:
        id: MONDO:0009696
        label: juvenile myoclonic epilepsy
    description: >-
      Juvenile myoclonic epilepsy (JME) is fully curated as its own dismech
      entry (kb/disorders/Juvenile_Myoclonic_Epilepsy.yaml); this subtype
      block scopes only the photosensitivity trait within it. Photosensitive
      seizures and an abnormal photoparoxysmal response are common in JME,
      but unlike pure photosensitive epilepsy, most patients also have
      spontaneous myoclonic and generalized tonic-clonic seizures on
      awakening that are not photically triggered, so JME as a whole conforms
      to the module's unprovoked-seizure terminal node in its own entry in a
      way that this photosensitivity-specific subtype block does not
      restate.
    evidence:
      - reference: PMID:25783594
        reference_title: CHD2 variants are a risk factor for photosensitivity in epilepsy.
        supports: PARTIAL
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          We sought CHD2 variants in 238 exomes from familial genetic
          generalized epilepsies, and in other public exome data sets.
        explanation: >-
          Documents that the photosensitivity genetics work covered familial
          genetic generalized epilepsies, the category JME belongs to, as
          part of establishing where CHD2 variation contributes across the
          photosensitive-epilepsy spectrum rather than only in the archetypal
          syndrome.
  - name: Photosensitivity as the Archetypal Syndrome, Jeavons Syndrome
    display_name: Jeavons Syndrome (Eyelid Myoclonia with Absences)
    subtype_term:
      preferred_term: epilepsy with eyelid myoclonia
      term:
        id: MONDO:0015346
        label: epilepsy with eyelid myoclonia
    description: >-
      Jeavons syndrome is fully curated as its own dismech entry
      (kb/disorders/Jeavons_Syndrome.yaml). It is placed here as a subtype
      because the literature identifies it as the single syndrome in which
      photosensitivity is not merely a common accompanying trait but is
      part of the syndrome's own defining triad, alongside eyelid myoclonia
      and eye-closure-induced EEG paroxysms, and because it is the syndrome
      in which the CHD2 gene-photosensitivity association was first and most
      strongly established.
    genes:
      - preferred_term: CHD2
        term:
          id: hgnc:1917
          label: CHD2
    evidence:
      - reference: PMID:25783594
        reference_title: CHD2 variants are a risk factor for photosensitivity in epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Among epilepsy syndromes, there was over-representation of unique
          CHD2 variants (3/36 cases) in the archetypal photosensitive
          epilepsy syndrome, eyelid myoclonia with absences (P = 3.50 ×
          10(-4))
        explanation: >-
          States directly that eyelid myoclonia with absences (Jeavons
          syndrome) is the archetypal photosensitive epilepsy syndrome and
          gives the statistical basis for the CHD2 association being
          strongest there.
      - reference: PMID:25783594
        reference_title: CHD2 variants are a risk factor for photosensitivity in epilepsy.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          CHD2 mutation is the first identified cause of the archetypal
          generalized photosensitive epilepsy syndrome, eyelid myoclonia with
          absences.
        explanation: >-
          The authors' own summary statement naming CHD2 as the first
          identified genetic cause specifically of Jeavons syndrome.
  - name: Photosensitivity in Dravet Syndrome
    subtype_term:
      preferred_term: Dravet syndrome
      term:
        id: MONDO:0100135
        label: Dravet syndrome
    description: >-
      Dravet syndrome is fully curated as its own dismech entry
      (kb/disorders/Dravet_syndrome.yaml); this subtype block scopes only the
      photosensitivity trait within it. Photosensitivity in Dravet syndrome
      (historically described under the older name severe myoclonic epilepsy
      in infancy, SMEI) has been shown to follow a different physiological
      rule from most other photosensitive epilepsies: the photoparoxysmal
      response tends to depend on the total quantity of light delivered
      rather than on its wavelength, unlike the wavelength-dependent pattern
      more typical of localization-related and symptomatic generalized
      epilepsies.
    evidence:
      - reference: PMID:10496248
        reference_title: >-
          Photosensitive epilepsies and pathophysiologic mechanisms of the
          photoparoxysmal response.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Four of the six photosensitive SMEI patients had
          quantity-of-light-dependent PPRs.
        explanation: >-
          Directly reports the quantity-of-light-dependent mechanism found in
          most photosensitive severe myoclonic epilepsy in infancy (Dravet
          syndrome) patients in this cohort, distinguishing it from the
          wavelength-dependent mechanism seen in other syndromes in the same
          study.
  - name: Photosensitivity in the Progressive Myoclonic Epilepsies
    subtype_term:
      preferred_term: progressive myoclonus epilepsy
      term:
        id: MONDO:0020074
        label: progressive myoclonus epilepsy
    description: >-
      The progressive myoclonic epilepsies (individually curated as their own
      dismech entries, e.g. kb/disorders/Progressive_Myoclonic_Epilepsy_Type_7.yaml
      and kb/disorders/Progressive_Myoclonic_Epilepsy_Type_8.yaml) frequently
      show a photoparoxysmal EEG response, most classically in
      Unverricht-Lundborg disease. Unlike the genetic generalized epilepsies
      above, photosensitivity here occurs against a background of a
      degenerative, worsening disease course, and both the spike-wave
      discharges and the photoparoxysmal response have been reported to
      diminish again as the disease reaches adulthood.
    evidence:
      - reference: PMID:18358403
        reference_title: Unverricht-Lundborg progressive myoclonus epilepsy in Oman.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Slowing of background activity, generalized spike-wave discharges,
          and photoparoxysmal responses were evident in all patients'
          electroencephalograms.
        explanation: >-
          Documents the photoparoxysmal response as a universal EEG finding
          in this confirmed Unverricht-Lundborg disease cohort, establishing
          photosensitivity as a feature of the progressive myoclonic
          epilepsies.
      - reference: PMID:18358403
        reference_title: Unverricht-Lundborg progressive myoclonus epilepsy in Oman.
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: >-
          Spike-wave discharges and photoparoxysmal responses tended to
          disappear in adulthood.
        explanation: >-
          Reports the age-dependent attenuation of the photoparoxysmal
          response in this progressive disease, a course distinct from the
          other subtypes in this entry.

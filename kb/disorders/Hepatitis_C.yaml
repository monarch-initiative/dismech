    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The most prevalent extrahepatic diseases with the highest degree of association with HCV are the essential mixed cryoglobulins with skin, neurologic, renal, and rheumatologic complications."
    explanation: Review of HCV extrahepatic manifestations identifies mixed cryoglobulinemia as the most prevalent and most strongly HCV-associated extrahepatic syndrome.
- name: Leukocytoclastic Vasculitis
  category: Dermatologic

      explanation: States the glomerular capillary deposition to membranoproliferative glomerulonephritis link directly.
phenotypes:
- name: Fatigue
  category: Constitutional
  frequency: VERY_FREQUENT
  description: >-
    Chronic fatigue is the most common symptom of chronic infection, often persisting
    even after viral clearance. It is also one of the symptoms reported in clinically
    apparent acute hepatitis.
  phenotype_term:
    preferred_term: Fatigue
    term:
      id: HP:0012378
      label: Fatigue
  evidence:
  - reference: PMID:16510035
    reference_title: "Extrahepatic manifestations of hepatitis C virus."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Although nonspecific, fatigue and arthralgias are very common in those with chronic hepatitis C."
    explanation: Review of HCV extrahepatic manifestations establishes fatigue as a very common symptom of chronic hepatitis C (not a treatment adverse event).
  - reference: PMID:29642211
    reference_title: A case report of sofosbuvir and daclatasvirto treat a patient with acute hepatitis C virus genotype 2 monoinfection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a 26 year-old Chinese female acquired a tattoo and developed fatigue,
      nausea, and anorexia.
    explanation: Case-level evidence supports fatigue in the acute phase but not its frequency there.
- name: Jaundice
  category: Hepatic
  frequency: FREQUENT
  description: >-

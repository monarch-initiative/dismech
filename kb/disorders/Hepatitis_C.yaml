transmission:
- name: Percutaneous and parenteral blood exposure
  description: >-
    The dominant route. Injection drug use, non-sterile injections, and unsafe medical
    procedures put infected blood directly into the recipient's circulation. Injection
    drug use is the major route in high-income countries; unsafe injection and medical
    practice continue to drive transmission where sterile technique is not assured.
  evidence:
  - reference: PMID:39066277
    reference_title: "Prevalence and Modes of Transmission of Hepatitis C Virus Infection: A Historical Worldwide Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The major modes of transmission for HCV include unscreened blood and blood
      products, injection drug use, non-sterile injections, and unsafe medical procedures
      in healthcare settings.
    explanation: This historical worldwide review names the parenteral routes that make up this transmission entry.
  - reference: PMID:36800699
    reference_title: "Acute hepatitis C virus infection: clinical update and remaining challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      People who have received unsafe medical procedures, used injection drugs,
      and lived with human immunodeficiency virus are reported to be most
      susceptible to acute HCV infection.
    explanation: This review identifies major human exposure contexts for newly acquired HCV.
  - reference: PMID:23481134
    reference_title: "Clinical characteristics, spontaneous clearance and treatment outcome of acute hepatitis C: a single tertiary center experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The source of infection was mainly injection drug use in 17/30 (56.7) and
      medical procedures 6/30 (20%).
    explanation: This cohort of newly acquired infections documents injection drug use and medical procedures as the observed acquisition sources.
- name: Transfusion of unscreened blood and blood products
  description: >-
    Historically a major route, now largely closed in high-income countries by donor
    screening. Transfusion and other iatrogenic exposure remain important where blood is
    not reliably screened.
  evidence:
  - reference: PMID:39066277
    reference_title: "Prevalence and Modes of Transmission of Hepatitis C Virus Infection: A Historical Worldwide Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Until the late 1980s, blood and blood-derived products were not screened for HCV,
      resulting in a transmission rate of approximately one case in every 50 blood units,
      even in high-income countries
    explanation: Quantifies the pre-screening transfusion route and dates the point at which donor screening closed it.
  - reference: PMID:18657711
    reference_title: "Acute hepatitis C."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      unsafe blood products and medical practices continue to increase transmission of
      HCV in many developing countries
    explanation: "States the geographic split this entry records: transfusion-related transmission has declined where blood is screened and continues where it is not."
- name: Sexual transmission
  description: >-
    A less efficient route than blood exposure, concentrated in men who have sex with men
    and in people with HIV coinfection rather than distributed across the general
    population.
  evidence:
  - reference: PMID:39066277
    reference_title: "Prevalence and Modes of Transmission of Hepatitis C Virus Infection: A Historical Worldwide Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Emerging high-risk groups include men who have sex with men (MSM), individuals
      exposed to tattoo practices, and newborns of HCV-infected pregnant women.
    explanation: Identifies men who have sex with men as the population in which sexual transmission is an emerging route.
  - reference: PMID:24923487
    reference_title: "A comprehensive hepatitis C virus risk factors meta-analysis (1989-2013): do they differ in Egypt?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Attention and urgent intervention should be given to the sexual route of
      transmission, as well as that through minor operations and medical procedures.
    explanation: This worldwide risk-factor meta-analysis identifies the sexual route as one requiring intervention, establishing it as a real if secondary route.
- name: Vertical (mother-to-child) transmission
  description: >-
    Transmission from mother to child around delivery, restricted to viremic mothers and
    increased by HIV coinfection. Neither mode of delivery nor feeding method changes the
    risk in monoinfected women.
  evidence:
  - reference: PMID:39066277
    reference_title: "Prevalence and Modes of Transmission of Hepatitis C Virus Infection: A Historical Worldwide Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      only anti-HCV-positive women with viremia face the risk of mother-to-child
      transmission (MTCT) of HCV, which is further heightened by HIV coinfection
    explanation: States that the vertical route requires maternal viremia and is amplified by HIV coinfection.
  - reference: PMID:39066277
    reference_title: "Prevalence and Modes of Transmission of Hepatitis C Virus Infection: A Historical Worldwide Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mode of delivery and type of feeding do not significantly affect vertical
      transmission in monoinfected women
    explanation: Supports the stated limits of the vertical route in women without HIV coinfection.
environmental:
- name: Blood-exposure risk contexts
  exposure_term:
    preferred_term: blood exposure
    term:
      id: ECTO:7000110
      label: exposure to blood
  influences_mechanisms:
  - target: HCV attachment and hepatocyte entry
    environmental_effect: TRIGGERS
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Hepatitis C is efficiently transmitted percutaneously, so unsafe
      injection and unsterile medical procedures put virus directly into
      blood, from which it reaches and attaches to hepatocytes.
    evidence:
    - reference: PMID:36800699
      reference_title: "Acute hepatitis C virus infection: clinical update and remaining challenges."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "People who have received unsafe medical procedures, used injection drugs, and lived with human immunodeficiency virus are reported to be most susceptible to acute HCV infection."
      explanation: >-
        Identifies unsafe medical procedures and injection drug use among the
        contexts with the highest reported infection, the percutaneous
        blood-exposure routes this link describes.
  description: >-
    Injection drug use and unsafe medical procedures increase the opportunity
    for blood-borne HCV acquisition; HIV coinfection identifies an important
    clinical risk context but is not itself a transmission route.
  evidence:
  - reference: PMID:36800699
    reference_title: "Acute hepatitis C virus infection: clinical update and remaining challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      People who have received unsafe medical procedures, used injection drugs,
      and lived with human immunodeficiency virus are reported to be most
      susceptible to acute HCV infection.
    explanation: The source directly identifies these risk contexts while allowing HIV status to be distinguished from a route of transmission.
- name: Injection Drug Use
  exposure_term:
    preferred_term: injection drug use
    term:
      id: ECTO:6000007
      label: exposure to substance abuse
  notes: Major route of HCV transmission through sharing of needles and drug preparation equipment
  evidence:
  - reference: PMID:24923487
    reference_title: "A comprehensive hepatitis C virus risk factors meta-analysis (1989-2013): do they differ in Egypt?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The highest detected risk was intravenous drug users (IDUs) (OR = 9.6)"
    explanation: "Meta-analysis of HCV risk factors: injecting drug use carries the single largest odds ratio of any exposure assessed, which is what makes it the major transmission route rather than merely one of several."
  - reference: PMID:39066277
    reference_title: "Prevalence and Modes of Transmission of Hepatitis C Virus Infection: A Historical Worldwide Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "injection drug use has become the major route of HCV transmission, especially in high-income countries, and it is emerging even in rural areas"
    explanation: Historical worldwide review of HCV transmission modes identifies injection drug use as the current major transmission route.
- name: Unsafe Medical Practices
  notes: Transmission through contaminated medical equipment, blood transfusions (pre-1992), and organ transplants
  evidence:
  - reference: PMID:18657711
    reference_title: "Acute hepatitis C."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "unsafe blood products and medical practices continue to increase transmission of HCV in many developing countries"
    explanation: "States the iatrogenic transmission route this annotation records, and notes the geographic split: transfusion-related transmission has declined in developed countries while unsafe medical practice continues to drive it elsewhere."
  - reference: PMID:25516637
    reference_title: "Health care-associated hepatitis C virus infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the more important risk is represented by unsafe practices regarding injections, notably with the improper use of multidose vials used for multiple patients"
    explanation: Review of health care-associated HCV infection identifies unsafe injection practices, including improper multidose-vial use, as the leading contamination route.
- name: Occupational Exposure
  notes: Healthcare workers at risk through needlestick injuries
  evidence:
  - reference: PMID:15018469
    reference_title: "Risk of hepatitis C virus transmission following percutaneous exposure in healthcare workers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 4,403 exposed HCW, 14 seroconverted (0.31%; 95% CI 0.15-0.48)"
    explanation: "Quantifies the per-exposure risk in 4,403 exposed healthcare workers. The same study found the risk concentrated in hollow-bore blood-filled needle injuries (0.74%) and raised sixfold by deep injury, so the annotation's needlestick framing is the right one."
  - reference: PMID:16231252
    reference_title: "Risk factors for hepatitis C virus transmission to health care workers after occupational exposure: a European case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All case patients were exposed to HCV-infected fluids through percutaneous injuries"
    explanation: European case-control study of HCV seroconversion in health care workers confirms percutaneous (needlestick) injury as the occupational exposure route.
- name: Tattoos and Body Piercing
  notes: Both are established HCV risk factors; non-sterile equipment is the presumed route but is not itself evidenced by the cited studies
  evidence:
  - reference: PMID:20678951
    reference_title: "Tattooing and the risk of transmission of hepatitis C: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pooled odds ratio (OR) and 95% confidence interval (CI) of the association of tattooing and hepatitis C from all studies was 2.74"
    explanation: "Meta-analysis of 83 studies; the association is strongest in non-injection drug users (OR 5.74), which matters because it separates tattooing from confounding by injecting. It covers the tattooing half of this exposure only -- piercing is evidenced by the item below -- and it measures association rather than the sterility mechanism the note names."
  - reference: PMID:24923487
    reference_title: "A comprehensive hepatitis C virus risk factors meta-analysis (1989-2013): do they differ in Egypt?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Other significant risk factors included poor education, older age, sharing sharp or blunt objects, MSM, tattooing, hijama, body piercing, minor operations and medical procedures"
    explanation: "Covers the body-piercing half of this exposure, which the tattooing meta-analysis above does not. The source lists piercing among significant risk factors without a per-factor odds ratio, so it establishes that piercing is a risk factor without quantifying it."
prevalence:
- population: Global (all ages)
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: UNKNOWN
  notes: >-
    The Global Burden of Disease 2019 analysis estimated 6.2 million new HCV
    infections worldwide in 2019. This is an incidence estimate for newly
    acquired infection, not the prevalence of symptomatic acute hepatitis.
  evidence:
  - reference: PMID:36935711
    reference_title: "The burden of hepatitis C virus in the world, China, India, and the United States from 1990 to 2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It was estimated that 6.2 million new HCV infections, 0.54 million
      HCV-related deaths, and 15.3 million DALYs worldwide in 2019, with an
      increase of 25.4, 59.1, and 43.6%, respectively, from 1990
    explanation: This GBD analysis quantifies global incident HCV infection in 2019.
- population: Global women of reproductive age (15-49 years)
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: UNKNOWN
  notes: >-
    In a GBD analysis restricted to reproductive-age women, global acute-HCV
    incidence increased by 46.45% from 1990 through 2019; this is a trend rather
    than an individual-level risk estimate.
  evidence:
  - reference: PMID:38638097
    reference_title: "Epidemiology of acute hepatitis C and hepatitis C virus-related cirrhosis in reproductive-age women, 1990-2019: An analysis of the Global Burden of Disease study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Over the 30 years, global incidences of AHC and HCV-related cirrhosis in
      reproductive-age women increased by 46.45 and 72.74%, respectively.
    explanation: This directly supports the acute-HCV incidence trend in the specified population.
progression:
- phase: Acute infection
  duration: Up to six months from acquisition, before persistent viremia is classified as chronic
  duration_days: "180"
  notes: >-
    Acute infection begins with recent HCV acquisition and detectable viremia. The
    six-month boundary is a clinical definition of chronicity rather than a claim that
    every untreated infection remains biologically unchanged until that time. The phase
    is predominantly asymptomatic and so is rarely diagnosed while it lasts; a minority
    present with clinically apparent hepatitis, which may include jaundice, nausea,
    fatigue, anorexia, and elevated transaminases. Diagnosis requires evidence that
    acquisition was recent, because anti-HCV and HCV RNA at a single time point do not
    separate this phase from chronic infection.
  evidence:
  - reference: PMID:39599853
    reference_title: "Acute Hepatitis C: Current Status and Future Perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      approximately 50-70% of individuals with recently acquired hepatitis C
      will develop a chronic infection, defined as the persistence of viremia
      for a period exceeding six months.
    explanation: This defines the recent-infection phase and the six-month chronicity boundary.
  - reference: PMID:23481134
    reference_title: "Clinical characteristics, spontaneous clearance and treatment outcome of acute hepatitis C: a single tertiary center experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Acute hepatitis C is rarely diagnosed due to its predominantly asymptomatic course.
    explanation: This directly supports clinically silent presentation as a major feature of the acute phase.
- phase: Spontaneous viral clearance
  notes: >-
    Clearance can occur without antiviral treatment, ending the infection at the acute
    phase. The observed proportion varies by cohort; one tertiary-center series reported
    clearance in 9 of 30 patients and should not be treated as a universal population
    frequency.
  evidence:
  - reference: PMID:23481134
    reference_title: "Clinical characteristics, spontaneous clearance and treatment outcome of acute hepatitis C: a single tertiary center experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Totally, 9 patients (30%) experienced spontaneous viral eradication.
    explanation: This cohort directly documents untreated spontaneous clearance while the note limits generalization of its frequency.
- phase: Fluctuating viremia during unresolved infection
  notes: >-
    Serial viral loads can fall and then rise. The quantified 37.5% fluctuation
    estimate came from an HIV-1-positive male cohort and is retained only as
    evidence that a single decline does not establish clearance.
  evidence:
  - reference: PMID:21139063
    reference_title: Predicting spontaneous clearance of acute hepatitis C virus in a large cohort of HIV-1-infected men.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The latter group included a significant proportion of 'fluctuating'
      progressors (37.5%), in whom a fall followed by a rise (>1 log₁₀) in
      viraemia was observed.
    explanation: This cohort directly demonstrates fluctuating viremia among patients who progressed.
- phase: Chronic infection
  duration: More than six months of persistent viremia
  notes: >-
    Failure to clear HCV leads to persistent viremia and classification as chronic
    hepatitis C. Reported persistence is 50-70% of recently acquired infections in one
    review and 70-80% in another. This is the phase in which progressive hepatic
    inflammation and fibrosis, cirrhosis, hepatocellular carcinoma, and the
    immune-complex extrahepatic syndromes arise, typically over decades.
  evidence:
  - reference: PMID:39599853
    reference_title: "Acute Hepatitis C: Current Status and Future Perspectives."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      approximately 50-70% of individuals with recently acquired hepatitis C
      will develop a chronic infection, defined as the persistence of viremia
      for a period exceeding six months.
    explanation: This directly supports both the outcome frequency range and definition of chronicity.
  - reference: PMID:19759533
    reference_title: "Genetic variation in IL28B and spontaneous clearance of hepatitis C virus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most (70-80%) HCV infections persist and about 30% of individuals with persistent infection develop chronic liver disease, including cirrhosis and hepatocellular carcinoma"
    explanation: Gives the second reported persistence range and the downstream chronic-liver-disease outcome that defines this phase.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_acute_hcv_clearance_persistence_model
  hypothesis_label: Host-virus response balance determines clearance or persistence
  status: CANONICAL
  description: >-
    Productive hepatocyte infection generates viremia and innate antiviral
    activation while HCV simultaneously suppresses interferon induction.
    Adaptive immune responses can accompany clearance, but ongoing immune
    responses and viral escape can coexist with persistence. Hepatocellular
    injury is immune-associated, although the contribution of individual cell
    populations is not fully resolved.
  evidence:
  - reference: PMID:25443342
    reference_title: Innate and adaptive immune responses in HCV infections.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Elimination of HCV during acute infection correlates with a rapid
      induction of innate, especially interferon (IFN) induced genes, and a
      delayed induction of adaptive immune responses.
    explanation: This review supports the canonical coordination of innate and adaptive responses in acute-HCV outcome.
- hypothesis_group_id: intrahepatic_tfh1_helper_refinement
  hypothesis_label: Intrahepatic Tfh1-like CD4 response as a helper axis for HCV control
  status: EMERGING
  description: >-
    A recent chimpanzee study proposes that liver-enriched HCV-specific
    PD-1-high ICOS-high Tfh1-like CD4 cells help B-cell and CD8-cell responses
    at the site of replication. This refines the general adaptive-response node
    but is not asserted as a confirmed human mechanism.
  evidence:
  - reference: PMID:40956619
    reference_title: "A liver-infiltrating CD4+ Tfh1 cell response predicts HCV control, hepatitis, and seroconversion during acute infection."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      HCV-specific PD-1hiICOShi CD4+ Tfh1-like cells were enriched in liver,
      suggesting the potential for B and CD8+ T cell help at the site of virus
      replication.
    explanation: The chimpanzee study directly supports the proposed helper-cell refinement while not establishing it in humans.
pathophysiology:
- name: HCV attachment and hepatocyte entry
  description: >-
    HCV first attaches to cell-surface proteoglycans, SR-BI, and CD81, then uses
    the tight-junction proteins claudin-1 and occludin and clathrin-mediated
    endocytosis to enter human liver cells.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  biological_processes:
  - preferred_term: symbiont entry into host cell
    modifier: INCREASED
    term:
      id: GO:0046718
      label: symbiont entry into host cell
  evidence:
  - reference: PMID:31427285
    reference_title: "Hepatitis C Virus Entry: Protein Interactions and Fusion Determinants Governing Productive Hepatocyte Invasion."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The virus initially attaches to surface proteoglycans, lipid receptors
      such as the scavenger receptor BI (SR-BI), and to the tetraspanin CD81.
      After lateral translocation of virions to tight junctions, claudin-1
      (CLDN1) and occludin (OCLN) are essential for entry.
    explanation: This review directly supports the host-factor sequence in the entry node.
  downstream:
  - target: HCV Polyprotein Translation
    description: >-
      Productive hepatocyte entry and genome release permit translation of the
      HCV polyprotein.
    hypothesis_groups:
    - canonical_acute_hcv_clearance_persistence_model
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Endosomal fusion and release of the positive-sense viral RNA genome
    evidence:
    - reference: PMID:31427285
      reference_title: "Hepatitis C Virus Entry: Protein Interactions and Fusion Determinants Governing Productive Hepatocyte Invasion."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Numerous host factors including proteins, lipids, and glycans promote
        productive uptake of HCV particles into human liver cells.
      explanation: >-
        Productive uptake supports the entry side of the edge; polyprotein
        translation after genome release is independently evidenced at the
        target node.
- name: HCV Polyprotein Translation
  biological_scale: MOLECULAR
  conforms_to: "viral_protease_inhibition#Synthesis of the Viral Polyprotein Precursor"
  role: trigger
  description: >-
    The positive-sense HCV RNA genome is translated as a single long
    polyprotein in infected hepatocytes. Host and viral proteases subsequently
    process this precursor into structural and nonstructural proteins.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  biological_processes:
  - preferred_term: Viral Gene Expression
    term:
      id: GO:0019080
      label: viral gene expression
    modifier: INCREASED
  evidence:
  - reference: PMID:22558217
    reference_title: "New details of HCV NS3/4A proteinase functionality revealed by a high-throughput cleavage assay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The hepatitis C virus (HCV) genome encodes a long polyprotein, which is
      processed by host cell and viral proteases to the individual structural
      and non-structural (NS) proteins.
    explanation: >-
      The primary cleavage-assay study establishes the HCV polyprotein
      precursor and its processing into individual viral proteins.
  downstream:
  - target: HCV NS3/4A-Dependent Processing of the Nonstructural Polyprotein
    description: >-
      The viral NS3/4A serine protease cleaves defined sites in the
      nonstructural region of the HCV polyprotein.
    hypothesis_groups:
    - canonical_acute_hcv_clearance_persistence_model
    causal_link_type: DIRECT
- name: HCV NS3/4A-Dependent Processing of the Nonstructural Polyprotein
  biological_scale: MOLECULAR
  conforms_to: "viral_protease_inhibition#Virus-Encoded Protease-Dependent Polyprotein Processing"
  role: therapeutic_vulnerability
  description: >-
    HCV NS3/4A is a virus-encoded serine protease complex that cleaves four
    defined junctions in the nonstructural region of the HCV polyprotein. This
    processing is essential for viral replication and produces active viral
    proteins, including NS3/4A itself. The active protease can also cleave host
    innate-sensing adaptors, a distinct downstream immune-evasion effect.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  biological_processes:
  - preferred_term: Viral Protein Processing
    term:
      id: GO:0019082
      label: viral protein processing
    modifier: INCREASED
  molecular_functions:
  - preferred_term: Peptidase Activity
    term:
      id: GO:0008233
      label: peptidase activity
  evidence:
  - reference: PMID:22558217
    reference_title: "New details of HCV NS3/4A proteinase functionality revealed by a high-throughput cleavage assay."
    supports: SUPPORT

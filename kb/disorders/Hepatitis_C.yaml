  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Hepatitis C"). Retrieved 2026-08-02.
notes: >-
  The separate entry Acute_Hepatitis_C_Virus_Infection (MONDO:0100371) was merged into
  this entry under design decisions §3e (issue 10115): a phase of one infection is never
  its own entry, and the entry it belongs to lists its phases in progression:. Its
  pathophysiology, phenotypes, biochemical markers, diagnosis, differential diagnoses,
  treatments, clinical trial, discussions, mechanistic hypotheses, prevalence, transmission
  and datasets were folded in here; its acute-phase and chronic-phase progression entries
  became this entry's Acute infection and Chronic infection phases; and MONDO:0100371 is
  carried as a skos:narrowMatch mapping so the concept stays retired from the curation
  queue rather than being lost. The two former has_subtypes rows, Acute Hepatitis C and
  Chronic Hepatitis C, were phases rather than organism strata, so their content moved to
  progression: as well and the has_subtypes block was removed. The merged entry's synonyms
  (Acute HCV infection, Recently acquired hepatitis C virus infection) name that phase
  rather than this disease and were not carried over.

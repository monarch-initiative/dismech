      explanation: The human study directly uses ALT as a readout of liver damage.
- name: Cirrhosis
  category: Hepatic
  frequency: FREQUENT
  description: End-stage liver fibrosis developing in 15-30% of chronically infected patients over 20-30 years.
  phenotype_term:
    preferred_term: Cirrhosis
    term:
      id: HP:0001394
      label: Cirrhosis

- name: Cryoglobulin Immune Complex Deposition
  description: >
    Chronic HCV antigenaemia drives production of cryoprecipitable
    immunoglobulin complexes that deposit in small vessels and glomerular
    capillary walls. This single immune-complex mechanism accounts for the
    cryoglobulinemia-spectrum extrahepatic manifestations, which affect skin
    and kidney rather than liver.
  biological_processes:
  - preferred_term: immune complex formation
    term:
      id: GO:0097281
      label: immune complex formation
    modifier: INCREASED
  evidence:
  - reference: PMID:22919404
    reference_title: "Morphologic features of extrahepatic manifestations of hepatitis C virus infection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Morphologically, immune complex depositions can be identified in small vessels and glomerular capillary walls, leading to leukoclastic vasculitis in the skin and membranoproliferative glomerulonephritis in the kidney."
    explanation: Histomorphologic review states that immune complex deposition in small vessels and glomerular capillaries is the mechanism producing the cutaneous and renal manifestations, establishing this node as their shared upstream cause.
  downstream:
  - target: Mixed Cryoglobulinemia
    description: Cryoprecipitable immune complexes are the defining constituent of the mixed cryoglobulinemia syndrome.
    causal_link_type: DIRECT
  - target: Leukocytoclastic Vasculitis
    description: Immune complexes deposited in dermal small vessels produce the cutaneous leukocytoclastic vasculitis.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22919404
      reference_title: "Morphologic features of extrahepatic manifestations of hepatitis C virus infection."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "immune complex depositions can be identified in small vessels and glomerular capillary walls, leading to leukoclastic vasculitis in the skin"
      explanation: States the small-vessel deposition to cutaneous leukocytoclastic vasculitis link directly.
  - target: Membranoproliferative Glomerulonephritis
    description: Immune complexes deposited in glomerular capillary walls produce membranoproliferative glomerulonephritis.
    causal_link_type: DIRECT
    evidence:

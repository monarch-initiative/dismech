name: Hepatitis C
creation_date: '2026-01-09T05:44:55Z'
category: Infectious Disease
description: >
  Hepatitis C is a liver infection caused by the hepatitis C virus (HCV). It is primarily
  transmitted through blood-to-blood contact, including injection drug use, unsafe medical
  practices, and transfusion of unscreened blood and blood products before donor screening;
  sexual and mother-to-child transmission occur less often. The entry covers the whole
  course of one infection. The acute phase, within six months of acquisition, is often
  clinically silent and can end in spontaneous clearance; the majority of infections
  instead persist as chronic hepatitis C, in which continuing viremia drives progressive
  hepatic fibrosis, cirrhosis, hepatocellular carcinoma, and immune-complex extrahepatic
  disease. Direct-acting antiviral therapies cure more than 95% of treated infections and
  are recommended once acute infection with quantifiable viremia is diagnosed, without
  waiting for possible spontaneous resolution.
disease_term:
  preferred_term: hepatitis C virus infection
  term:
    id: MONDO:0005231
    label: hepatitis C virus infection
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0100371
      label: acute hepatitis C virus infection
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO:0100371 names the acute phase of the infection this entry curates, not a
      separate disease. Under design decisions §3e a phase of one infection is never its
      own entry, and the entry it belongs to enumerates its phases in progression: --
      which this entry now does, with "Acute infection" and "Chronic infection" phases
      carrying the content of the former Acute_Hepatitis_C_Virus_Infection entry. The
      mapping is recorded as a narrowMatch so the MONDO concept is retired from the
      curation queue rather than lost.

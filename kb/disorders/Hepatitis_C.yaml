    reference_title: "Acute/recent HCV infection. Clinical course, viral replication kunetic and disease outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among 12 asymptomatics: 8 had elevated ALT"
    explanation: This cohort directly documents ALT elevation even among asymptomatic acute/recent infections.
  reports_on:
  - target: Immune-associated hepatocellular injury
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Serum ALT and AST measure hepatocyte injury from HCV replication and immune-mediated destruction, but do not identify the responsible immune-cell population.

    explanation: Review of HCV extrahepatic manifestations lists B-cell non-Hodgkin lymphomas among the HCV-associated entities.
biochemical:
- name: HCV RNA
  presence: Detected during active infection
  context: >-
    Qualitative or quantitative HCV RNA establishes current infection and
    quantitative levels guide treatment monitoring, but a single positive result
    does not by itself establish recent acquisition.
  readouts:
  - target: HCV genome replication and early viremia
    relationship: READOUT_OF
    direction: PRESENT_ABSENT
    endpoint_context: DIAGNOSTIC
    interpretation: Detectable circulating HCV RNA reports active viremia.
    evidence:
    - reference: PMID:23481134
      reference_title: "Clinical characteristics, spontaneous clearance and treatment outcome of acute hepatitis C: a single tertiary center experience."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: HCV-ribonucleic acid (RNA) was detectable at presentation in 26 (86.7%) patients.
      explanation: This directly supports HCV RNA as a viremia readout in newly acquired infection.
  evidence:
  - reference: PMID:30927209
    reference_title: Importance of Hepatitis C Virus RNA Testing in Patients with Suspected Drug-Induced Liver Injury.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tests for HCV RNA are valuable in distinguishing between active and
      resolved infection, but the presence of HCV RNA does not distinguish
      between acute and chronic hepatitis C
    explanation: This directly supports the use and limitation of HCV RNA as a biomarker.
- name: Anti-HCV Antibodies
  presence: Negative before seroconversion or positive after seroconversion
  context: >-
    Anti-HCV may be absent early and, once present, cannot distinguish active,
    resolved, acute, or chronic infection without RNA results and longitudinal
    context.
  evidence:
  - reference: PMID:30927209
    reference_title: Importance of Hepatitis C Virus RNA Testing in Patients with Suspected Drug-Induced Liver Injury.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Anti-HCV antibodies are usually used to exclude acute hepatitis C in a
      patient with acute liver injury, but it does not distinguish between
      acute, chronic or resolved hepatitis.
    explanation: This directly supports the interpretive limitation of anti-HCV antibody.
- name: Alanine aminotransferase
  presence: Increased or fluctuating during hepatocellular injury
  context: >-
    Serum ALT reports hepatocellular injury. It is not specific for HCV, can be
    elevated in clinically silent infection, and may be normal in some chronic
    infections.
  readouts:
  - target: Immune-associated hepatocellular injury
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: ALT is a biochemical readout of liver injury, not proof of a particular immune effector mechanism.
    evidence:
    - reference: PMID:34905514
      reference_title: Peripheral blood iNKT cell activation correlates with liver damage during acute hepatitis C.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We next analyzed the activation status of iNKT cells in the context of
        liver damage, which is defined by serum levels of alanine transaminase
        (ALT).
      explanation: This directly identifies ALT as the study's liver-damage readout.
  evidence:
  - reference: PMID:19124916
    reference_title: "Acute/recent HCV infection. Clinical course, viral replication kunetic and disease outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among 12 asymptomatics: 8 had elevated ALT"
    explanation: This directly documents ALT elevation in asymptomatic acute/recent infection.
- name: Elevated Bilirubin
  presence: Elevated
  context: Indicates impaired hepatic function, especially in acute infection or decompensated cirrhosis
genetic:
- name: IFNL3 (IL28B) rs12979860 clearance modifier
  gene_term:
    preferred_term: IFNL3
    term:
      id: hgnc:18365
      label: IFNL3
  association: >-
    The rs12979860 C/C genotype near IFNL3 (formerly IL28B) is associated with an
    increased probability of spontaneous HCV clearance and with response to
    interferon-based therapy; it is not necessary or sufficient for clearance, and its
    precise functional mechanism remains unresolved.
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:19759533
    reference_title: Genetic variation in IL28B and spontaneous clearance of hepatitis C virus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show that the C/C genotype strongly enhances resolution of HCV
      infection among individuals of both European and African ancestry.
    explanation: This multi-cohort human genetic study establishes rs12979860 as a modifier of spontaneous HCV clearance.
  - reference: PMID:19684573
    reference_title: "Genetic variation in IL28B predicts hepatitis C treatment-induced viral clearance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a genetic polymorphism near the IL28B gene, encoding interferon-lambda-3 (IFN-lambda-3), is associated with an approximately twofold change in response to treatment"
    explanation: Landmark GWAS linking the IL28B polymorphism to response to interferon-based HCV therapy.
diagnosis:
- name: Combined HCV RNA and anti-HCV testing with evidence of recent acquisition
  description: >-
    Acute infection is best supported by HCV RNA during the antibody-negative
    window, documented anti-HCV seroconversion, de novo RNA detection, or RNA
    loss during untreated recovery. RNA or antibody at one time point cannot by
    itself reliably distinguish acute from chronic infection.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: >-
    Current HCV RNA plus a documented recent negative result, seroconversion, or
    compatible longitudinal course supports acute HCV.
  evidence:
  - reference: PMID:30927209
    reference_title: Importance of Hepatitis C Virus RNA Testing in Patients with Suspected Drug-Induced Liver Injury.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, reliable diagnosis of acute hepatitis C usually requires testing at
      two time points demonstrating seroconversion to anti-HCV reactivity, de
      novo development of HCV RNA, or loss of HCV RNA during recovery.
    explanation: This directly supports longitudinal antibody/RNA evidence for recent infection.
- name: Serial HCV RNA assessment
  description: >-
    Repeat HCV RNA assessment is important when timing is uncertain because
    untreated viremia may fluctuate and a transient decline does not establish
    spontaneous clearance.
  diagnosis_term:
    preferred_term: diagnostic procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: >-
    Persistent, recurrent, or cleared RNA across serial measurements resolves
    uncertainty that remains after a single result.
  evidence:
  - reference: PMID:21139063
    reference_title: Predicting spontaneous clearance of acute hepatitis C virus in a large cohort of HIV-1-infected men.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The latter group included a significant proportion of 'fluctuating'
      progressors (37.5%), in whom a fall followed by a rise (>1 log₁₀) in
      viraemia was observed.
    explanation: This directly supports serial rather than single-point interpretation of viremia, with the cohort context stated in progression.
- name: Combined HCV antibody and antigen immunoassay
  description: >-
    A fourth-generation antibody/antigen assay can shorten the diagnostic window
    but does not eliminate the need for nucleic-acid testing.
  diagnosis_term:
    preferred_term: serology testing
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: Antibody/antigen reactivity is an early-detection adjunct and should be interpreted with HCV RNA testing.
  evidence:
  - reference: PMID:39283072
    reference_title: Comparison of a dual antibody and antigen HCV immunoassay to standard of care algorithmic testing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fourth generation HCV Duo Ab/Ag assay demonstrated comparable performance
      to SOC testing and shortens the diagnostic window but does not eliminate
      the need for NAAT in all patients.
    explanation: This diagnostic study directly supports the stated adjunctive role and limitation.
differential_diagnoses:
- name: Drug-induced liver injury
  disease_term:
    preferred_term: drug-induced liver injury
    term:
      id: MONDO:0005359
      label: drug-induced liver injury
  description: >-
    Drug-induced liver injury can closely mimic the hepatocellular presentation
    of acute HCV. Medication and supplement exposure, dechallenge, and formal
    causality assessment are interpreted alongside both anti-HCV and HCV RNA.
  distinguishing_features:
  - A compatible drug or supplement exposure and improvement after withdrawal favor drug-induced injury.
  - HCV RNA during an antibody-negative window or longitudinal seroconversion favors acute HCV.
  evidence:
  - reference: PMID:30927209
    reference_title: Importance of Hepatitis C Virus RNA Testing in Patients with Suspected Drug-Induced Liver Injury.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings indicate that patients presenting with acute
      hepatocellular injury, even with features suggestive of DILI, should be
      tested for both anti-HCV and HCV RNA to reliably exclude acute HCV
      infection.
    explanation: This prospective DILI-network analysis directly supports distinguishing acute HCV from DILI using both tests.
- name: Other viral, autoimmune, and biliary causes of acute hepatocellular injury
  description: >-
    Hepatitis A, B, and E, autoimmune hepatitis, and biliary disease can produce
    an overlapping acute-hepatitis presentation and require cause-specific
    testing when HCV timing is uncertain.
  distinguishing_features:
  - Cause-specific viral testing distinguishes hepatitis A, B, or E.
  - Autoimmune evaluation and biliary imaging are guided by the presentation.
  - Longitudinal anti-HCV and HCV RNA results establish or weaken recent-HCV timing.
  evidence:
  - reference: PMID:30927209
    reference_title: Importance of Hepatitis C Virus RNA Testing in Patients with Suspected Drug-Induced Liver Injury.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These assessments could include testing for hepatitis A, B, C, E,
      infectious mononucleosis, iron overload, and autoimmune conditions, as
      well as imaging for biliary tract disease10.
    explanation: This human diagnostic cohort directly supports the listed alternative-cause workup.
treatments:
- name: Direct-Acting Antivirals (DAAs)
  description: >
    Oral medications targeting viral proteins (NS3/4A protease, NS5A, NS5B polymerase)
    with cure rates exceeding 95%. Regimens include sofosbuvir/velpatasvir,
    glecaprevir/pibrentasvir, and others.
  treatment_term:
    preferred_term: antiviral therapy
    term:
      id: NCIT:C16119
      label: Antiviral Therapy
  evidence:
  - reference: PMID:24725239
    reference_title: "Ledipasvir and sofosbuvir for untreated HCV genotype 1 infection."
    supports: SUPPORT
    snippet: "Once-daily ledipasvir-sofosbuvir with or without ribavirin for 12 or 24 weeks was highly effective in previously untreated patients with HCV genotype 1 infection."
    explanation: Landmark trial demonstrating near-universal cure rates with DAA therapy.
  - reference: PMID:26569658
    reference_title: "Sofosbuvir and Velpatasvir for HCV in Patients with Decompensated Cirrhosis."
    supports: SUPPORT
    snippet: "Treatment with sofosbuvir-velpatasvir with or without ribavirin for 12 weeks and with sofosbuvir-velpatasvir for 24 weeks resulted in high rates of sustained virologic response in patients with HCV infection and decompensated cirrhosis."
    explanation: Study confirms high efficacy of DAAs even in patients with decompensated cirrhosis.
  - reference: PMID:36891719
    reference_title: "Guideline for the prevention and treatment of hepatitis C (2022 version)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "More and more direct antiviral agents, especially pan genotypic agents including those developed and produced by domestic enterprises, have been included in the national basic medical insurance directory."
    explanation: The 2022 hepatitis C prevention-and-treatment guideline reflects expanding availability of pangenotypic direct-acting antiviral agents as standard therapy.
- name: Immediate direct-acting antiviral treatment after confirmed acute HCV viremia
  description: >-
    Published AASLD-IDSA guidance recommends initiating direct-acting antiviral
    treatment after acute HCV with quantifiable RNA is diagnosed rather than
    waiting for possible spontaneous resolution.
  treatment_term:
    preferred_term: antiviral therapy
    term:
      id: NCIT:C16119
      label: Antiviral Therapy
  evidence:
  - reference: DOI:10.1002/hep.31060
    reference_title: "Hepatitis C Guidance 2019 Update: American Association for the Study of Liver Diseases-Infectious Diseases Society of America Recommendations for Testing, Managing, and Treating Hepatitis C Virus Infection."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      After the initial diagnosis of acute HCV with viremia (defined as
      quantifiable RNA), HCV treatment should be initiated without awaiting
      spontaneous resolution.
    explanation: The published AASLD-IDSA guidance directly supports the test-and-treat timing recommendation.
  notes: >-
    This entry captures treatment timing rather than a specific drug regimen.
    Regimen choice, contraindications, interactions, and jurisdiction-specific
    availability require consultation of current guidance.
- name: Eight-week glecaprevir/pibrentasvir therapy
  description: >-
    An eight-week oral glecaprevir/pibrentasvir direct-acting antiviral regimen
    produced high sustained virologic response rates in a completed single-arm
    phase IIIb study of adults with acute HCV. Glecaprevir is the regimen's
    NS3/4A protease inhibitor, whereas pibrentasvir inhibits NS5A. The absence
    of a randomized untreated comparator and geography-specific regulatory
    status should be considered when applying the result.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antiviral therapy
    term:
      id: NCIT:C16119
      label: Antiviral Therapy
    therapeutic_agent:
    - preferred_term: glecaprevir
      term:
        id: NCIT:C170029
        label: Glecaprevir
    - preferred_term: pibrentasvir
      term:
        id: NCIT:C166601
        label: Pibrentasvir
  target_mechanisms:
  - target: HCV NS3/4A-Dependent Processing of the Nonstructural Polyprotein
    treatment_effect: INHIBITS
    description: >-
      The glecaprevir component directly inhibits HCV NS3/4A protease and
      therefore blocks NS3/4A-dependent nonstructural-polyprotein processing.
      Pibrentasvir acts through NS5A and is not represented by this
      protease-target edge.
    evidence:
    - reference: PMID:29084747
      reference_title: "In Vitro Antiviral Activity and Resistance Profile of the Next-Generation Hepatitis C Virus NS3/4A Protease Inhibitor Glecaprevir."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Glecaprevir (formerly ABT-493) is a novel hepatitis C virus (HCV)
        NS3/4A protease inhibitor (PI) with pangenotypic activity.
      explanation: >-
        The primary biochemical study directly identifies glecaprevir as an HCV
        NS3/4A protease inhibitor.
    - reference: PMID:29084747
      reference_title: "In Vitro Antiviral Activity and Resistance Profile of the Next-Generation Hepatitis C Virus NS3/4A Protease Inhibitor Glecaprevir."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        It inhibited the enzymatic activity of purified NS3/4A proteases from
        HCV genotypes 1 to 6 in vitro
      explanation: >-
        The biochemical assay directly demonstrates glecaprevir inhibition of
        purified HCV NS3/4A proteases across genotypes.
  - target: HCV genome replication and early viremia
    treatment_effect: INHIBITS
    description: Direct-acting antiviral treatment suppresses acute HCV replication and enables virologic eradication.
    evidence:
    - reference: PMID:41297677
      reference_title: A single-arm phase IIIb study of 8-week glecaprevir/pibrentasvir treatment in adults with acute hepatitis C.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        An 8-week glecaprevir/pibrentasvir regimen was efficacious and
        well-tolerated in patients with acute HCV.
      explanation: This directly supports regimen efficacy against acute infection; the molecular target detail is intentionally kept at the viral-replication level.
  - target: Persistent HCV viremia
    treatment_effect: INHIBITS
    description: Achieving sustained virologic response removes persistent viremia and prevents progression to chronic infection.
    evidence:
    - reference: PMID:41297677
      reference_title: A single-arm phase IIIb study of 8-week glecaprevir/pibrentasvir treatment in adults with acute hepatitis C.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        SVR12 was achieved by 96.2% (95% CI 93.2%-97.8%) in the ITT population
        (n = 286), and 100% in the mITT-VF population (n = 275).
      explanation: Sustained virologic response directly supports inhibition and eradication of persistent viremia in the study population.
  evidence:
  - reference: PMID:41297677
    reference_title: A single-arm phase IIIb study of 8-week glecaprevir/pibrentasvir treatment in adults with acute hepatitis C.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, 286 adults were enrolled and treated; 14.3% were recent/current
      users of injection drugs, 49.7% were HCV/HIV coinfected, and 64.2% had HCV
      genotype 1.
    explanation: This establishes the treated acute-HCV study population and its important clinical contexts.
  - reference: PMID:41297677
    reference_title: A single-arm phase IIIb study of 8-week glecaprevir/pibrentasvir treatment in adults with acute hepatitis C.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SVR12 was achieved by 96.2% (95% CI 93.2%-97.8%) in the ITT population
      (n = 286), and 100% in the mITT-VF population (n = 275).
    explanation: This directly supports the high sustained virologic response achieved with the regimen.
  notes: >-
    This entry represents the regimen directly studied in acute HCV. Treatment
    selection, contraindications, interactions, and regulatory availability
    require current jurisdiction-specific guidance.
- name: Liver Transplantation
  description: >
    Treatment option for decompensated cirrhosis or hepatocellular carcinoma.
    DAA therapy post-transplant prevents graft reinfection.
  treatment_term:
    preferred_term: Liver Transplantation
    term:
      id: NCIT:C15271
      label: Liver Transplantation
- name: Hepatocellular Carcinoma Surveillance
  description: >
    Regular ultrasound and AFP monitoring in cirrhotic patients for early
    detection of hepatocellular carcinoma.
  treatment_term:
    preferred_term: surveillance for malignancies
    term:
      id: NCIT:C15406
      label: Cancer Screening
  evidence:
  - reference: PMID:15042359
    reference_title: "Randomized controlled trial of screening for hepatocellular carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "biannual screening reduced HCC mortality by 37%"
    explanation: Landmark randomized controlled trial demonstrating that biannual AFP plus ultrasound surveillance reduces HCC mortality in at-risk chronic-hepatitis patients.
clinical_trials:
- name: NCT04903626
  phase: PHASE_III
  status: COMPLETED
  description: >-
    Completed multicenter, single-arm phase IIIb study of eight weeks of oral
    glecaprevir/pibrentasvir in adults with acute HCV. The publication reports
    286 treated adults and 96.2% ITT SVR12 (95% CI 93.2%-97.8%).
  evidence:
  - reference: clinicaltrials:NCT04903626
    reference_title: "A Multicenter, Single-Arm Prospective Study to Evaluate Safety and Efficacy of GLE/PIB 8-Week Treatment in Adults and Adolescents With Acute Hepatitis C Virus (HCV) Infection"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Participants will receive oral tablets of GLE/PIB once daily (QD) for 8
      weeks and will be followed for 12 weeks after the end of treatment.
    explanation: The registry directly establishes the regimen and follow-up schedule.
  - reference: PMID:41297677
    reference_title: A single-arm phase IIIb study of 8-week glecaprevir/pibrentasvir treatment in adults with acute hepatitis C.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SVR12 was achieved by 96.2% (95% CI 93.2%-97.8%) in the ITT population

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Out of 4 symptomatics 3 were with jaundice.
    explanation: This small cohort directly documents jaundice in symptomatic acute/recent HCV without supporting a population frequency.
- name: Nausea

  notes: Identified by GEO DataSets index search for Hepatitis C (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE200809
  title: The human liver circadian transcriptome and its carcinogenic perturbation by hepatitis C virus infection (RNA-Seq I)
  description: Chronic liver disease and cancer are global health challenges. The role of the circadian clock (CC) as a regulator of physiology and disease is well established in animal models. However, in human liver the identity of circadian genes and their epigenetic regulation is unknown. Here, we unraveled the circadian transcriptome and epigenome of human hepatocytes using a human liver chimeric mouse model. We identified genes coding for transcription factors, chromatin modifiers, and critical enzymes which are expressed rhythmically in human hepatocytes, and which differ from the mouse liver circadian transcriptome.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 6
  publication: PMID:39209804
  notes: Identified by GEO DataSets index search for Hepatitis C (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: ega:EGAS00001000096
  title: Identification of improved IL28B SNPs and haplotypes for prediction of drug response in treatment of hepatitis C using massively parallel sequencing in a cross-sectional European cohort
  description: The hepatitis C virus infects nearly 3% of the World’s population, causing severe liver disease in many. Standard of care therapy is currently pegylated interferon alpha and ribavirin (PegIFN/R), which is effective in less than half of those infected with the most common viral genotype. Two IL28B SNPs, rs8099917 and rs12979860, predict response to (PegIFN/R) therapy in treatment of hepatitis C virus infection. These SNPs were identified in genome wide analyses using Illumina genotyping chips. In people of European ancestry, there are 6 common (>1%) haplotypes for IL28B, one tagged by rs8099917 minor allele, four tagged by rs12979860.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Hepatitis C"); description-level mentions were not accepted. EGA study_type: Resequencing. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: ega:EGAS00001002324
  title: Genome-to-genome analysis highlights the impact of the human innate and adaptive immune systems on the hepatitis C virus
  description: Outcomes of hepatitis C virus (HCV) infection and treatment depend on viral and host genetic factors. We use human genome-wide genotyping arrays and new whole-genome HCV viral sequencing technologies to perform a systematic genome-to-genome study of 542 individuals chronically infected with HCV, predominately genotype 3. We show that both HLA alleles and interferon lambda innate immune system genes drive viral genome polymorphism, and that IFNL4 genotypes determine HCV viral load through a mechanism that is dependent on a specific polymorphism in the HCV polyprotein. We highlight the interplay between innate immune responses and the viral genome in HCV control.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:28394351
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Hepatitis C"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: dbgap:phs000430
  title: Hepatitis C Antiviral Long-term Treatment Against Cirrhosis (HALT-C)
  description:  Reprinted from http://www.haltctrial.org/    Purpose    The  H epatitis C  A ntiviral  L ong-term  T reatment against  C irrhosis (HALT-C) Trial is a randomized controlled trial designed to evaluate the safety and efficacy of long-term use of pegylated interferon for the treatment of chronic hepatitis C in patients who failed to respond to previous interferon therapy. The HALT-C Trial was developed to determine whether prolonged interferon therapy altered histological and clinical outcomes in a group of patients who had failed to eradicate hepatitis C

name: Hepatitis C
creation_date: '2026-01-09T05:44:55Z'
category: Infectious Disease
description: >
  Hepatitis C is a liver infection caused by the hepatitis C virus (HCV). It is primarily
  transmitted through blood-to-blood contact, including injection drug use, unsafe medical
  practices, and rarely through sexual transmission. Acute infection is often asymptomatic
  but progresses to chronic infection in 75-85% of cases. Chronic hepatitis C can lead to
  liver cirrhosis, hepatocellular carcinoma, and liver failure. Direct-acting antiviral
  therapies have revolutionized treatment, with cure rates exceeding 95%.
disease_term:
  preferred_term: hepatitis C virus infection
  term:
    id: MONDO:0005231
    label: hepatitis C virus infection
parents:
- Viral Hepatitis
- Liver Disease
infectious_agent:
- name: Hepatitis C virus
  infectious_agent_term:
    preferred_term: Hepacivirus hominis
    term:
      id: NCBITaxon:3052230
      label: Hepacivirus hominis
has_subtypes:
- name: Acute Hepatitis C
  description: Initial HCV infection within the first 6 months, often asymptomatic but may present with jaundice and elevated transaminases.
- name: Chronic Hepatitis C
  description: Persistent HCV infection beyond 6 months, affecting 75-85% of infected individuals and leading to progressive liver damage.
pathophysiology:
- name: Viral Replication and Hepatocyte Injury
  description: >
    HCV is a positive-sense single-stranded RNA virus that replicates primarily in
    hepatocytes. Viral replication causes direct cytopathic effects and triggers
    immune-mediated hepatocyte destruction. The virus evades immune clearance through
    high mutation rates and quasispecies diversity.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: viral life cycle
    term:
      id: GO:0019058
      label: viral life cycle
- name: Chronic Inflammation and Fibrosis
  description: >
    Persistent HCV infection induces chronic hepatic inflammation with infiltration
    of lymphocytes and activation of hepatic stellate cells. This leads to progressive
    fibrosis through excessive collagen deposition, ultimately resulting in cirrhosis.
  cell_types:
  - preferred_term: hepatic stellate cell
    term:
      id: CL:0000632
      label: hepatic stellate cell
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  biological_processes:
  - preferred_term: chronic inflammatory response
    term:
      id: GO:0002544
      label: chronic inflammatory response
  - preferred_term: hepatic stellate cell activation
    term:
      id: GO:0035733
      label: hepatic stellate cell activation
  - preferred_term: collagen biosynthetic process
    term:
      id: GO:0032964
      label: collagen biosynthetic process
  evidence:
  - reference: PMID:26569658
    reference_title: "Sofosbuvir and Velpatasvir for HCV in Patients with Decompensated Cirrhosis."
    supports: PARTIAL
    snippet: "patients infected with HCV genotypes 1 through 6 who had decompensated cirrhosis"
    explanation: Study specifically targets HCV patients with decompensated cirrhosis, confirming progression of chronic inflammation to advanced liver damage.
- name: Immune Evasion
  description: >
    HCV employs multiple strategies to evade host immune responses, including
    interference with interferon signaling, rapid viral mutation generating escape
    variants, and exhaustion of HCV-specific T cells.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: symbiont-mediated suppression of host type I interferon-mediated signaling pathway
    term:
      id: GO:0039502
      label: symbiont-mediated suppression of host type I interferon-mediated signaling pathway
  evidence:
  - reference: PMID:16127453
    reference_title: "IPS-1, an adaptor triggering RIG-I- and Mda5-mediated type I interferon induction."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "'Knockdown' of IPS-1 by small interfering RNA blocked interferon induction by virus infection"
    explanation: In-vitro siRNA-knockdown study demonstrates the RIG-I/IPS-1(MAVS) interferon-induction pathway that HCV NS3/4A disrupts to evade interferon signaling; general virology, not HCV-specific.
- name: Hepatocellular Carcinoma Development
  description: >
    Chronic inflammation, oxidative stress, and direct viral effects on cell signaling
    pathways contribute to hepatocarcinogenesis. Cirrhosis is the major risk factor,
    but HCC can occur in non-cirrhotic livers.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:22537432
    reference_title: "Epidemiology of viral hepatitis and hepatocellular carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 5-year cumulative risk of developing HCC for patients with cirrhosis ranges between 5% and 30%, depending on etiology (it is highest in individuals with HCV infection)"
    explanation: Epidemiologic review establishing cirrhosis as the dominant HCC risk factor, with the highest cumulative HCC risk among HCV-infected patients.
  - reference: PMID:19759533
    reference_title: "Genetic variation in IL28B and spontaneous clearance of hepatitis C virus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most (70-80%) HCV infections persist and about 30% of individuals with persistent infection develop chronic liver disease, including cirrhosis and hepatocellular carcinoma"
    explanation: Documents the natural-history progression from persistent HCV infection to cirrhosis and hepatocellular carcinoma.
phenotypes:
- name: Fatigue
  category: Constitutional
  frequency: VERY_FREQUENT
  description: Chronic fatigue is the most common symptom, often persisting even after viral clearance.
  phenotype_term:
    preferred_term: Fatigue
    term:
      id: HP:0012378
      label: Fatigue
  evidence:
  - reference: PMID:16510035
    reference_title: "Extrahepatic manifestations of hepatitis C virus."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Although nonspecific, fatigue and arthralgias are very common in those with chronic hepatitis C."
    explanation: Review of HCV extrahepatic manifestations establishes fatigue as a very common symptom of chronic hepatitis C (not a treatment adverse event).
- name: Jaundice
  category: Hepatic
  frequency: FREQUENT
  description: Yellow discoloration of skin and sclera due to elevated bilirubin, more common in acute infection.
  phenotype_term:
    preferred_term: Jaundice
    term:
      id: HP:0000952
      label: Jaundice
- name: Hepatomegaly
  category: Hepatic
  frequency: FREQUENT
  description: Enlarged liver due to inflammation and/or fatty infiltration.
  phenotype_term:
    preferred_term: Hepatomegaly
    term:
      id: HP:0002240
      label: Hepatomegaly
- name: Elevated Transaminases
  category: Laboratory
  frequency: VERY_FREQUENT
  description: Elevated ALT and AST indicating hepatocyte injury, though levels may fluctuate in chronic infection.
  phenotype_term:
    preferred_term: Elevated circulating hepatic transaminase concentration
    term:
      id: HP:0002910
      label: Elevated circulating hepatic transaminase concentration
  reports_on:
  - target: Viral Replication and Hepatocyte Injury
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Serum ALT and AST measure hepatocyte injury from HCV replication and immune-mediated destruction.
- name: Cirrhosis
  category: Hepatic
  frequency: FREQUENT
  description: End-stage liver fibrosis developing in 15-30% of chronically infected patients over 20-30 years.
  phenotype_term:
    preferred_term: Cirrhosis
    term:
      id: HP:0001394
      label: Cirrhosis
  evidence:
  - reference: PMID:26569658
    reference_title: "Sofosbuvir and Velpatasvir for HCV in Patients with Decompensated Cirrhosis."
    supports: SUPPORT
    snippet: "patients infected with HCV genotypes 1 through 6 who had decompensated cirrhosis"
    explanation: Study specifically targets HCV patients with cirrhosis, confirming cirrhosis as a major complication.
  - reference: PMID:24725239
    reference_title: "Ledipasvir and sofosbuvir for untreated HCV genotype 1 infection."
    supports: SUPPORT
    snippet: "Of the 865 patients who underwent randomization and were treated, 16% had cirrhosis"
    explanation: Large HCV trial confirms cirrhosis prevalence among chronic HCV patients.
- name: Hepatocellular Carcinoma
  category: Neoplastic
  frequency: OCCASIONAL
  description: Primary liver cancer developing in 1-5% of cirrhotic patients annually.
  phenotype_term:
    preferred_term: Hepatocellular carcinoma
    term:
      id: HP:0001402
      label: Hepatocellular carcinoma
  evidence:
  - reference: PMID:22537432
    reference_title: "Epidemiology of viral hepatitis and hepatocellular carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "most cases of HCC (approximately 80%) are associated with chronic hepatitis B virus (HBV) or hepatitis C virus (HCV) infections"
    explanation: Establishes chronic HCV infection as a leading cause of hepatocellular carcinoma.
biochemical:
- name: HCV RNA
  presence: Detected
  context: Confirms active viral infection; quantitative levels guide treatment monitoring
- name: Anti-HCV Antibodies
  presence: Detected
  context: Indicates current or past infection; does not distinguish active from resolved infection
- name: Elevated ALT
  presence: Elevated
  context: Marker of hepatocyte injury, though may be normal in some chronic infections
- name: Elevated Bilirubin
  presence: Elevated
  context: Indicates impaired hepatic function, especially in acute infection or decompensated cirrhosis
genetic:
- name: IL28B Polymorphisms
  association: Susceptibility
  notes: IL28B (IFNL3) variants influence spontaneous clearance and response to interferon-based therapy
  evidence:
  - reference: PMID:19759533
    reference_title: "Genetic variation in IL28B and spontaneous clearance of hepatitis C virus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the C/C genotype strongly enhances resolution of HCV infection among individuals of both European and African ancestry"
    explanation: Genome-wide association evidence that the IL28B rs12979860 C/C genotype favors spontaneous clearance of HCV.
  - reference: PMID:19684573
    reference_title: "Genetic variation in IL28B predicts hepatitis C treatment-induced viral clearance."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a genetic polymorphism near the IL28B gene, encoding interferon-lambda-3 (IFN-lambda-3), is associated with an approximately twofold change in response to treatment"
    explanation: Landmark GWAS linking the IL28B polymorphism to response to interferon-based HCV therapy.
environmental:
- name: Injection Drug Use
  exposure_term:
    preferred_term: injection drug use
    term:
      id: ECTO:6000007
      label: exposure to substance abuse
  notes: Major route of HCV transmission through sharing of needles and drug preparation equipment
  evidence:
  - reference: PMID:24923487
    reference_title: "A comprehensive hepatitis C virus risk factors meta-analysis (1989-2013): do they differ in Egypt?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The highest detected risk was intravenous drug users (IDUs) (OR = 9.6)"
    explanation: "Meta-analysis of HCV risk factors: injecting drug use carries the single largest odds ratio of any exposure assessed, which is what makes it the major transmission route rather than merely one of several."
  - reference: PMID:39066277
    reference_title: "Prevalence and Modes of Transmission of Hepatitis C Virus Infection: A Historical Worldwide Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "injection drug use has become the major route of HCV transmission, especially in high-income countries, and it is emerging even in rural areas"
    explanation: Historical worldwide review of HCV transmission modes identifies injection drug use as the current major transmission route.
- name: Unsafe Medical Practices
  notes: Transmission through contaminated medical equipment, blood transfusions (pre-1992), and organ transplants
  evidence:
  - reference: PMID:18657711
    reference_title: "Acute hepatitis C."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "unsafe blood products and medical practices continue to increase transmission of HCV in many developing countries"
    explanation: "States the iatrogenic transmission route this annotation records, and notes the geographic split: transfusion-related transmission has declined in developed countries while unsafe medical practice continues to drive it elsewhere."
  - reference: PMID:25516637
    reference_title: "Health care-associated hepatitis C virus infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the more important risk is represented by unsafe practices regarding injections, notably with the improper use of multidose vials used for multiple patients"
    explanation: Review of health care-associated HCV infection identifies unsafe injection practices, including improper multidose-vial use, as the leading contamination route.
- name: Occupational Exposure
  notes: Healthcare workers at risk through needlestick injuries
  evidence:
  - reference: PMID:15018469
    reference_title: "Risk of hepatitis C virus transmission following percutaneous exposure in healthcare workers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 4,403 exposed HCW, 14 seroconverted (0.31%; 95% CI 0.15-0.48)"
    explanation: "Quantifies the per-exposure risk in 4,403 exposed healthcare workers. The same study found the risk concentrated in hollow-bore blood-filled needle injuries (0.74%) and raised sixfold by deep injury, so the annotation's needlestick framing is the right one."
  - reference: PMID:16231252
    reference_title: "Risk factors for hepatitis C virus transmission to health care workers after occupational exposure: a European case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All case patients were exposed to HCV-infected fluids through percutaneous injuries"
    explanation: European case-control study of HCV seroconversion in health care workers confirms percutaneous (needlestick) injury as the occupational exposure route.
- name: Tattoos and Body Piercing
  notes: Both are established HCV risk factors; non-sterile equipment is the
    presumed route but is not itself evidenced by the cited studies
  evidence:
  - reference: PMID:20678951
    reference_title: "Tattooing and the risk of transmission of hepatitis C: a systematic review and meta-analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The pooled odds ratio (OR) and 95% confidence interval (CI) of the association of tattooing and hepatitis C from all studies was 2.74"
    explanation: "Meta-analysis of 83 studies; the association is strongest in non-injection drug users (OR 5.74), which matters because it separates tattooing from confounding by injecting. PARTIAL because it covers the tattooing half of this exposure only -- piercing is evidenced by the item below -- and because it measures association rather than the sterility mechanism the note names."
  - reference: PMID:24923487
    reference_title: "A comprehensive hepatitis C virus risk factors meta-analysis (1989-2013): do they differ in Egypt?"
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Other significant risk factors included poor education, older age, sharing sharp or blunt objects, MSM, tattooing, hijama, body piercing, minor operations and medical procedures"
    explanation: "Covers the body-piercing half of this exposure, which the tattooing meta-analysis above does not. PARTIAL because the source lists piercing among significant risk factors without a per-factor odds ratio, so it establishes that piercing is a risk factor without quantifying it."
treatments:
- name: Direct-Acting Antivirals (DAAs)
  description: >
    Oral medications targeting viral proteins (NS3/4A protease, NS5A, NS5B polymerase)
    with cure rates exceeding 95%. Regimens include sofosbuvir/velpatasvir,
    glecaprevir/pibrentasvir, and others.
  treatment_term:
    preferred_term: antiviral therapy
    term:
      id: NCIT:C16119
      label: Antiviral Therapy
  evidence:
  - reference: PMID:24725239
    reference_title: "Ledipasvir and sofosbuvir for untreated HCV genotype 1 infection."
    supports: SUPPORT
    snippet: "Once-daily ledipasvir-sofosbuvir with or without ribavirin for 12 or 24 weeks was highly effective in previously untreated patients with HCV genotype 1 infection."
    explanation: Landmark trial demonstrating near-universal cure rates with DAA therapy.
  - reference: PMID:26569658
    reference_title: "Sofosbuvir and Velpatasvir for HCV in Patients with Decompensated Cirrhosis."
    supports: SUPPORT
    snippet: "Treatment with sofosbuvir-velpatasvir with or without ribavirin for 12 weeks and with sofosbuvir-velpatasvir for 24 weeks resulted in high rates of sustained virologic response in patients with HCV infection and decompensated cirrhosis."
    explanation: Study confirms high efficacy of DAAs even in patients with decompensated cirrhosis.
  - reference: PMID:36891719
    reference_title: "Guideline for the prevention and treatment of hepatitis C (2022 version)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "More and more direct antiviral agents, especially pan genotypic agents including those developed and produced by domestic enterprises, have been included in the national basic medical insurance directory."
    explanation: The 2022 hepatitis C prevention-and-treatment guideline reflects expanding availability of pangenotypic direct-acting antiviral agents as standard therapy.
- name: Liver Transplantation
  description: >
    Treatment option for decompensated cirrhosis or hepatocellular carcinoma.
    DAA therapy post-transplant prevents graft reinfection.
  treatment_term:
    preferred_term: Liver Transplantation
    term:
      id: NCIT:C15271
      label: Liver Transplantation
- name: Hepatocellular Carcinoma Surveillance
  description: >
    Regular ultrasound and AFP monitoring in cirrhotic patients for early
    detection of hepatocellular carcinoma.
  treatment_term:
    preferred_term: surveillance for malignancies
    term:
      id: NCIT:C15406
      label: Cancer Screening
  evidence:
  - reference: PMID:15042359
    reference_title: "Randomized controlled trial of screening for hepatocellular carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "biannual screening reduced HCC mortality by 37%"
    explanation: Landmark randomized controlled trial demonstrating that biannual AFP plus ultrasound surveillance reduces HCC mortality in at-risk chronic-hepatitis patients.
datasets:
- accession: geo:GSE267834
  title: Hepatitis C Virus-induced Differential Transcriptional Traits in Host Cells After Persistent Infection Elimination by Direct-Acting Antivirals In Cell Culture
  description: Chronic hepatitis C virus infection (HCV) causes liver inflammation and fibrosis, leading to development of severe liver disease, such as cirrhosis or hepatocellular carcinoma (HCC). Approval of direct acting antiviral (DAA) drug combinations has revolutionized chronic HCV therapy, with virus eradication in >98% of the treated patients. The efficacy of these treatments is such that it is formally possible for cured patients to carry formerly infected cells that display irreversible transcriptional alterations directly caused by chronic HCV Infection.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: BULK_RNA_SEQ
  sample_count: 28
  publication: PMID:38988177
  notes: Identified by GEO DataSets index search for Hepatitis C (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-08-01. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE119117
  title: Longitudinal transcriptomic characterization of the immune response to acute hepatitis C virus infection
  description: Most individuals exposed to hepatitis C virus (HCV) become persistently infected while a minority spontaneously eliminate the virus. Although early immune events influence infection outcome, the cellular composition, molecular effectors, and timeframe of the host response active shortly after viral exposure remain incompletely understood. Employing specimens collected from people who inject drugs (PWID) with high risk of HCV exposure, we utilized RNA-Seq to characterize immune function in peripheral blood before, during, and after acute HCV infection resulting in spontaneous resolution.
  organism:
    preferred_term: human
    term:

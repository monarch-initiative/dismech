    term:
      id: HP:0002240
      label: Hepatomegaly
- name: Elevated Transaminases
  category: Laboratory
  frequency: VERY_FREQUENT
  description: >-
    Elevated ALT and AST indicating hepatocyte injury. Levels may fluctuate in chronic
    infection and are raised even in clinically silent acute infection.
  phenotype_term:
    preferred_term: Elevated circulating hepatic transaminase concentration
    term:

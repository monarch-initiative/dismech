    snippet: "Other HCV-associated entities include porphyria cutanea tarda, lichen planus, necrolytic acral erythema, membranous glomerulonephritis, diabetic nephropathy, B-cell non-Hodgkin lymphomas, insulin resistance, sialadenitis, sicca syndrome, and autoimmune thyroiditis."
    explanation: Review of HCV extrahepatic manifestations lists porphyria cutanea tarda among the HCV-associated entities beyond the cryoglobulinemia spectrum.
  - reference: PMID:16510035
    reference_title: "Extrahepatic manifestations of hepatitis C virus."
    supports: SUPPORT

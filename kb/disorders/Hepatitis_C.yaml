      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Most (70-80%) HCV infections persist and about 30% of individuals with persistent infection develop chronic liver disease, including cirrhosis and hepatocellular carcinoma"
      explanation: Names cirrhosis as an outcome of the chronic liver disease this node describes.
  - target: Hepatocellular Carcinoma Development
    description: >-
      Cirrhosis is the dominant substrate for hepatocarcinogenesis, with the
      highest cumulative risk in HCV-infected patients.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Regenerative nodule formation and accumulated genomic damage
    evidence:

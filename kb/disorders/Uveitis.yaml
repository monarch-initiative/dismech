name: Uveitis
creation_date: "2026-08-26T22:00:00Z"
category: Complex
description: >-
  Uveitis is intraocular inflammation of the uveal tract (iris, ciliary body,
  and choroid), classified anatomically by the Standardization of Uveitis
  Nomenclature (SUN) Working Group into anterior, intermediate, posterior, and
  panuveitis. It is a leading cause of preventable vision loss and is
  mechanistically heterogeneous: distinct disorders converge on this final
  common anatomic phenotype through either a non-infectious autoimmune route
  (breakdown of ocular immune privilege with autoreactive Th1/Th17 T cell
  activation, as in HLA-B27-associated disease, juvenile idiopathic
  arthritis, Behcet's disease, Vogt-Koyanagi-Harada disease, and sarcoidosis)
  or a distinct infectious route (direct pathogen invasion or antigen-driven
  inflammatory response, as in toxoplasmosis, cytomegalovirus, herpetic, and
  tuberculous uveitis). This root entry models the two arms as separate
  causal chains rather than blending them into a single mechanism, and links
  to disorder-specific entries that are already fully curated elsewhere in
  this knowledge base.
disease_term:
  preferred_term: uveitis
  term:
    id: MONDO:0020283
    label: uveitis
parents:
- Eye disorder
- Inflammatory Disease
notes: >-
  Drug-induced uveitis (e.g. immune checkpoint inhibitor-associated uveitis,
  captured here as an environmental trigger) and masquerade syndromes (e.g.
  intraocular lymphoma mimicking uveitis) are recognized etiologic categories
  that are deliberately not modeled as `has_subtypes` entries in this pass;
  this is an intentional scoping decision for this curation round, not a gap
  to silently reopen without discussion.
has_subtypes:
- name: Anterior Uveitis
  subtype_term:
    preferred_term: anterior uveitis
    term:
      id: MONDO:0006651
      label: anterior uveitis
  classification: anatomic (SUN)
  children:
  - HLA-B27-Associated Anterior Uveitis
  - JIA-Associated Uveitis
  - Herpetic Anterior Uveitis
  description: >-
    Inflammation of the iris and ciliary body (iritis/iridocyclitis), the
    most common anatomic class of uveitis. Etiologies span idiopathic,
    HLA-B27/spondyloarthritis-associated, juvenile idiopathic
    arthritis-associated, and infectious (chiefly herpetic) disease.
  evidence:
  - reference: PMID:40434762
    reference_title: "Uveitis in Adults: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Anterior uveitis affects the iris and ciliary body (41%-60% of cases)"
    explanation: This review reports anterior uveitis as the most frequent anatomic class and defines its anatomic scope.
- name: HLA-B27-Associated Anterior Uveitis
  display_name: HLA-B27-Associated Acute Anterior Uveitis
  classification: etiologic (genetic/autoimmune)
  genes:
  - preferred_term: HLA-B27
    term:
      id: hgnc:4932
      label: HLA-B
  description: >-
    Recurrent, typically unilateral-alternating acute anterior uveitis
    associated with HLA-B27 and the spondyloarthropathies (notably ankylosing
    spondylitis). The single most frequently identified cause of acute
    anterior uveitis. Fully curated as the ocular manifestation of
    `Ankylosing_Spondylitis.yaml`; this stub links that systemic-disease
    pathophysiology into the uveitis anatomic classification.
  evidence:
  - reference: PMID:19027424
    reference_title: "Incidence and prevalence of uveitis in Veterans Affairs Medical Centers of the Pacific Northwest."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "human leukocyte antigen-B27-related diseases being the most common identified cause"
    explanation: A population-based cohort identifies HLA-B27-related disease as the leading identified cause of anterior uveitis.
  - reference: PMID:27245590
    reference_title: "HLA-B27 Anterior Uveitis: Immunology and Immunopathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with ankylosing spondylitis (AS) and AAU share other genetic markers, such as ERAP-1, which show strong evidence of gene-gene interaction and point to new mechanisms of disease pathogenesis."
    explanation: Directly supports the shared HLA-B27/ERAP1 genetic basis linking ankylosing spondylitis and acute anterior uveitis.
- name: JIA-Associated Uveitis
  display_name: Juvenile Idiopathic Arthritis-Associated Uveitis
  classification: etiologic (autoimmune, pediatric)
  description: >-
    Chronic, often clinically asymptomatic anterior uveitis occurring most
    commonly in ANA-positive, young-onset oligoarticular juvenile idiopathic
    arthritis, requiring regular screening because it can progress silently
    to sight-threatening complications. Fully curated as part of
    `Juvenile_Idiopathic_Arthritis.yaml`.
  evidence:
  - reference: PMID:42184063
    reference_title: "Clinical characteristics and factors associated with uveitis in juvenile idiopathic arthritis: a long-term single-center experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Particularly, early onset of the disease, female gender, positive ANA status, and articular relapses should be considered warning signs for uveitis."
    explanation: A JIA cohort study identifies the classic risk-factor profile (young onset, female sex, ANA positivity) for JIA-associated uveitis.
  - reference: PMID:42184063
    reference_title: "Clinical characteristics and factors associated with uveitis in juvenile idiopathic arthritis: a long-term single-center experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Juvenile Idiopathic Arthritis uveitis (JIA-U) can progress without obvious clinical signs and cause permanent damage if left untreated, therefore early detection through regular screening is crucial"
    explanation: Supports the characteristic silent/asymptomatic course of JIA-associated uveitis that drives systematic screening recommendations.
- name: Herpetic Anterior Uveitis
  display_name: Herpesvirus-Associated Anterior Uveitis
  classification: etiologic (infectious, viral)
  description: >-
    Acute or recurrent anterior uveitis caused by reactivation of herpes
    simplex virus, varicella zoster virus, or (less commonly) cytomegalovirus
    within the anterior chamber, often with elevated intraocular pressure,
    sectoral iris atrophy, and keratic precipitates. No dedicated dismech
    entry currently exists for herpes simplex/varicella zoster virus
    infection, so the viral mechanism is curated directly here rather than
    linked to a sibling file.
  evidence:
  - reference: PMID:37862684
    reference_title: "Viral Anterior Uveitis: A Practical and Comprehensive Review of Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The viral pathogens most commonly associated with infectious anterior uveitis include Herpes Simplex Virus, Varicella-Zoster Virus, Cytomegalovirus, and Rubella Virus."
    explanation: Identifies herpesviruses as the leading viral causes of infectious anterior uveitis.
  - reference: PMID:29543540
    reference_title: "Immunopathology of Virus-Induced Anterior Uveitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the herpes viruses cause an acute lytic infection and inflammation"
    explanation: Describes the acute lytic infection mechanism that distinguishes herpetic anterior uveitis from other viral causes.

- name: Pars Planitis
  subtype_term:
    preferred_term: pars planitis
    term:
      id: MONDO:0011644
      label: pars planitis
  classification: etiologic (idiopathic)
  description: >-
    The idiopathic subset of intermediate uveitis, characterized by vitreous

treatments:
- name: Etiology-Directed Antimicrobial Therapy
  description: >-
    Infectious uveitis requires treatment directed at the causative organism
    (antiviral, antiparasitic, or antimycobacterial therapy), typically
    combined with anti-inflammatory therapy once pathogen load is controlled.
  treatment_term:
    preferred_term: antimicrobial pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Ocular Pathogen Invasion or Reactivation
    treatment_effect: INHIBITS
    description: Antimicrobial therapy directly targets the causative infectious agent underlying this arm of uveitis.
  evidence:
  - reference: PMID:40434762
    reference_title: "Uveitis in Adults: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Infectious uveitis requires systemic antimicrobial treatment."
    explanation: Directly supports organism-directed antimicrobial therapy as the mainstay treatment of infectious uveitis.
- name: Topical Corticosteroid Therapy
  description: >-
    Topical corticosteroid eye drops are first-line therapy for
    non-infectious anterior uveitis, delivering high local drug
    concentration to the anterior segment while limiting systemic exposure.
  treatment_term:
    preferred_term: topical corticosteroid therapy
    term:
      id: NCIT:C122078
      label: Topical Corticosteroid Therapy
  target_mechanisms:
  - target: Cytokine-Driven Leukocyte Recruitment and Barrier Disruption
    treatment_effect: INHIBITS
    description: Topical corticosteroids suppress the cytokine-driven leukocyte recruitment and inflammation that damages ocular tissue in non-infectious anterior uveitis.
  evidence:
  - reference: PMID:40434762
    reference_title: "Uveitis in Adults: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "corticosteroid eyedrops are first-line treatment"
    explanation: States that topical corticosteroid eye drops are first-line therapy for noninfectious anterior uveitis.
- name: Systemic Corticosteroid Therapy
  description: >-
    Systemic corticosteroids rapidly suppress non-infectious intraocular
    inflammation in patients with moderate-to-severe intermediate,
    posterior, or panuveitis who are at high risk of sight-threatening
    complications.
  treatment_term:
    preferred_term: systemic corticosteroid therapy
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
  target_mechanisms:
  - target: Cytokine-Driven Leukocyte Recruitment and Barrier Disruption
    treatment_effect: INHIBITS
    description: Systemic corticosteroids suppress the cytokine-driven leukocyte recruitment and inflammation that damages ocular tissue in non-infectious uveitis.
  evidence:
  - reference: PMID:40434762
    reference_title: "Uveitis in Adults: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "require systemic and/or intravitreal corticosteroids and immunosuppressive agents"
    explanation: Directly supports systemic corticosteroids for moderate-to-severe non-infectious uveitis.
- name: Local (Intravitreal) Corticosteroid Therapy
  description: >-
    Locally delivered intravitreal corticosteroids are used, as an
    alternative or adjunct to systemic therapy, for moderate-to-severe
    non-infectious intermediate, posterior, or panuveitis, achieving high
    intraocular drug concentration while limiting systemic corticosteroid
    exposure. No NCIT clinical-action term specifically names the
    intravitreal route (the closest candidate, Localized Corticosteroid
    Therapy NCIT:C121367, is explicitly defined as intraarticular, topical,
    or inhaled only), so this treatment uses the generic Pharmacotherapy
    action term with a corticosteroid therapeutic agent instead of
    overclaiming a route-specific NCIT term.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  target_mechanisms:
  - target: Cytokine-Driven Leukocyte Recruitment and Barrier Disruption
    treatment_effect: INHIBITS
    description: Locally delivered intravitreal corticosteroids suppress the cytokine-driven leukocyte recruitment and inflammation that damages ocular tissue in non-infectious uveitis, without the systemic exposure of oral or intravenous therapy.
  evidence:
  - reference: PMID:40434762
    reference_title: "Uveitis in Adults: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "require systemic and/or intravitreal corticosteroids and immunosuppressive agents"
    explanation: Directly supports intravitreal corticosteroids as a local-delivery option for moderate-to-severe non-infectious uveitis.
- name: Steroid-Sparing Immunosuppressive Therapy
  description: >-
    Chronic, recurrent, bilateral, or vision-threatening non-infectious
    uveitis commonly requires steroid-sparing immunosuppression such as
    methotrexate or mycophenolate mofetil.
  treatment_term:
    preferred_term: immune suppressant agent therapy
    term:
      id: NCIT:C15261
      label: Immunosuppressive Therapy
  target_mechanisms:
  - target: Cytokine-Driven Leukocyte Recruitment and Barrier Disruption
    treatment_effect: INHIBITS
    description: Immunosuppressive therapy reduces recurrent autoimmune ocular inflammation while limiting corticosteroid exposure.
  evidence:
  - reference: PMID:40434762
    reference_title: "Uveitis in Adults: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For posterior uveitis, first-line therapy with disease-modifying antirheumatic drugs such as methotrexate achieved remission of inflammation in 52.1% (95% CI, 38.6%-67.1%) of patients, and mycophenolate mofetil controlled inflammation in 70.9% (95% CI, 57.1%-83.5%)"
    explanation: Provides quantitative human clinical outcome data for steroid-sparing immunosuppressive therapy in non-infectious uveitis.
- name: Adalimumab
  description: >-
    Adalimumab is a steroid-sparing anti-TNF biologic for active or inactive
    non-infectious intermediate, posterior, or panuveitis when inflammation
    is not adequately controlled with corticosteroid-based therapy.
  treatment_term:
    preferred_term: anti-TNF biologic therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Adalimumab
      term:
        id: NCIT:C65216
        label: Adalimumab
  therapeutic_modality: MONOCLONAL_ANTIBODY
  target_mechanisms:
  - target: Cytokine-Driven Leukocyte Recruitment and Barrier Disruption
    treatment_effect: INHIBITS
    description: Anti-TNF therapy inhibits the cytokine cascade that drives leukocyte recruitment and barrier disruption in non-infectious uveitis.
  evidence:
  - reference: PMID:27602665
    reference_title: "Adalimumab in Patients with Active Noninfectious Uveitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "median time to treatment failure was 24 weeks in the adalimumab group and 13 weeks in the placebo group"
    explanation: The VISUAL I trial supports adalimumab efficacy in active non-infectious intermediate, posterior, or panuveitis.
  - reference: PMID:39157460
    reference_title: "Update on non-infectious uveitis treatment: anti-TNF-alpha and beyond."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TNF-α inhibitors, anti-CD20 therapy and alkylating agents have shown considerable efficacy"
    explanation: This review confirms TNF-alpha inhibitors as an effective biologic option for non-infectious uveitis refractory to corticosteroids.

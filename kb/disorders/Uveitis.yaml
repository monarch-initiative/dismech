- name: Cytomegalovirus Retinitis
  subtype_term:
    preferred_term: cytomegalovirus retinitis
    term:
      id: MONDO:0000878
      label: cytomegalovirus retinitis
  classification: etiologic (infectious, viral)
  description: >-
    Necrotizing retinitis caused by cytomegalovirus reactivation, occurring
    almost exclusively in severely immunocompromised patients. Fully curated
    in `Cytomegalovirus_Retinitis.yaml`.
- name: Tuberculous Uveitis
  classification: etiologic (infectious, mycobacterial)
  description: >-
    Granulomatous uveitis caused by Mycobacterium tuberculosis, presenting as
    choroidal tubercles, tuberculoma, serpiginous-like choroiditis, or
    panuveitis, particularly in endemic regions and immunocompromised
    patients. Systemic tuberculosis is fully curated in `Tuberculosis.yaml`.
  evidence:
  - reference: PMID:40434762
    reference_title: "Uveitis in Adults: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "toxoplasmosis, herpes, tuberculosis, and HIV comprising 11% to 21% of infectious cases in high-income countries and 50% in low- and middle-income countries"
    explanation: Quantifies tuberculosis as a major contributor to infectious uveitis, especially in low- and middle-income countries.
- name: Panuveitis
  subtype_term:
    preferred_term: panuveitis
    term:
      id: MONDO:0017255
      label: panuveitis
  classification: anatomic (SUN)
  children:
  - Behcet Uveitis
  - Vogt-Koyanagi-Harada Uveitis
  - Sarcoid Uveitis
  description: >-
    Inflammation involving all uveal layers, considered a high-risk form of
    uveitis because of frequent sight-threatening complications. Commonly
    caused by systemic autoimmune/autoinflammatory disease (Behcet's disease,
    Vogt-Koyanagi-Harada disease, sarcoidosis) or infection (ocular
    toxoplasmosis, tuberculosis). Fully curated in `Panuveitis.yaml`, which
    carries the detailed pan-uveal inflammation pathophysiology.
  evidence:
  - reference: PMID:40434762
    reference_title: "Uveitis in Adults: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "panuveitis involves all uveal layers (7%-32%)"
    explanation: Defines the anatomic scope and reported frequency of panuveitis.
- name: Behcet Uveitis
  display_name: Behcet's Disease-Associated Panuveitis
  classification: etiologic (autoimmune, vasculitic)
  description: >-
    Bilateral, chronic, recurrent, non-granulomatous panuveitis with retinal
    vasculitis, a hallmark manifestation of Behcet's disease. Fully curated
    as part of `Behcets_Disease.yaml`.
  evidence:
  - reference: PMID:38778397
    reference_title: "Decoding Behcet's Uveitis: an In-depth review of pathogenesis and therapeutic advances."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Behcet's uveitis (BU) is a common manifestation of BD, occurring in over two-thirds of the patients."
    explanation: Establishes uveitis, typically panuveitis, as a common and defining manifestation of Behcet's disease.
- name: Vogt-Koyanagi-Harada Uveitis
  display_name: Vogt-Koyanagi-Harada Disease-Associated Panuveitis
  classification: etiologic (autoimmune, melanocyte-directed)
  description: >-
    Bilateral granulomatous panuveitis with exudative retinal detachment
    driven by T cell-mediated autoimmunity against melanocyte antigens,
    progressing without treatment to a chronic recurrent anterior uveitis
    with "sunset glow fundus." Fully curated in
    `Vogt-Koyanagi-Harada_Disease.yaml`.
  evidence:
  - reference: PMID:34869409
    reference_title: "New Perspectives on the Immunopathogenesis and Treatment of Uveitis Associated With Vogt-Koyanagi-Harada Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with initial-onset acute uveitis present with granulomatous choroiditis with secondary exudative retinal detachment resulting from impairment of the retinal pigment epithelium caused by choroidal inflammation"
    explanation: Describes the granulomatous panuveitis with exudative retinal detachment characteristic of acute VKH disease.
- name: Sarcoid Uveitis
  display_name: Sarcoidosis-Associated Uveitis
  classification: etiologic (autoimmune, granulomatous)
  description: >-
    Granulomatous ocular inflammation in sarcoidosis that can affect any
    uveal segment but most often presents as panuveitis. Fully curated as
    part of `Sarcoidosis.yaml` and `Neurosarcoidosis.yaml`.
  evidence:
  - reference: PMID:33173272
    reference_title: "Ocular Manifestations of Sarcoidosis in a South Florida Population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Twelve had uveitis of which panuveitis was the most common subtype."
    explanation: A sarcoidosis cohort study reports panuveitis as the most common uveitis subtype among ocular sarcoidosis cases.
pathophysiology:
- name: Breakdown of Ocular Immune Privilege
  biological_scale: TISSUE
  description: >-
    The eye is normally shielded from systemic immunity by physical
    barriers (blood-aqueous and blood-retinal), a locally immunosuppressive
    microenvironment, and tolerance circuits such as anterior
    chamber-associated immune deviation. Non-infectious (autoimmune)
    uveitis arises when these layered controls fail, permitting
    autoreactive lymphocyte access to intraocular antigens. This node
    begins the autoimmune arm of uveitis pathogenesis, modeled separately
    from the infectious arm below.
  biological_processes:
  - preferred_term: establishment of blood-retinal barrier
    modifier: DECREASED
    term:
      id: GO:1990963
      label: establishment of blood-retinal barrier
  notes: >-
    GO:1990963 is a developmental-process term (establishment, not
    maintenance) but is the only blood-retinal-barrier term in GO — there is
    no maintenance analogue to GO:0035633 (maintenance of blood-brain
    barrier). Used deliberately with DECREASED to represent adult barrier
    breakdown; do not re-litigate this without a better term becoming
    available.
  downstream:
  - target: Autoreactive Th1/Th17 T Cell Priming and Uveal Infiltration
    description: >-
      Loss of ocular immune privilege permits systemic activation and
      intraocular entry of autoreactive T cells.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41877771
    reference_title: "The Immunopathogenesis of uveitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Layered mechanisms normally restrain inflammation: physical barriers (blood-aqueous and blood-retina), a locally immunosuppressive milieu, and systemic tolerance circuits such as anterior chamber-associated immune deviation."
    explanation: Describes the layered immune-privilege mechanisms whose failure is the entry point for autoimmune uveitis.
- name: Autoreactive Th1/Th17 T Cell Priming and Uveal Infiltration
  biological_scale: CELLULAR
  description: >-
    Genetic susceptibility (HLA class I/II alleles and peptide-trimming
    enzymes such as ERAP1) shapes antigen presentation and lowers the
    activation threshold for autoreactive T cells directed against ocular
    or cross-reactive antigens. These T cells are primed toward Th1/Th17
    phenotypes in draining lymphoid tissue, then infiltrate the eye where
    they are restimulated by resident microglia and recruited macrophages.
    This is the mechanism underlying HLA-B27-associated and juvenile
    idiopathic arthritis-associated anterior uveitis and contributes to
    Behcet's disease- and Vogt-Koyanagi-Harada disease-associated
    panuveitis. Experimental autoimmune uveitis (EAU) models in rodents are
    the primary source of mechanistic detail for this pathway.
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  - preferred_term: T-helper 17 cell
    term:
      id: CL:0000899
      label: T-helper 17 cell
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  biological_processes:
  - preferred_term: T-helper 1 type immune response
    modifier: INCREASED
    term:
      id: GO:0042088
      label: T-helper 1 type immune response
  - preferred_term: T-helper 17 type immune response
    modifier: INCREASED
    term:
      id: GO:0072538
      label: T-helper 17 type immune response
  downstream:
  - target: Cytokine-Driven Leukocyte Recruitment and Barrier Disruption
    description: >-
      Restimulated effector T cells and resident myeloid cells drive
      cytokine cascades that recruit further leukocytes and damage ocular
      barriers.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:18317764
    reference_title: "New perspectives on effector mechanisms in uveitis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Th17 cells elicit EAU, can be found in uveitic eyes along with Th1 cells, and are dominant in some types of EAU. In other types of EAU, Th1 cells have a dominant role."
    explanation: Rodent experimental autoimmune uveitis studies establish the dual Th1/Th17 effector basis of autoimmune uveitis.
  - reference: PMID:27245590
    reference_title: "HLA-B27 Anterior Uveitis: Immunology and Immunopathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Studies of patients with AAU and animal models of disease indicate a role for innate immunity, the IL-23 cytokine pathway and exogenous factors, in the pathogenesis of both SpA and acute anterior uveitis."
    explanation: Supports genetic-pathway (IL-23/Th17 axis) involvement in human HLA-B27-associated anterior uveitis.
- name: Cytokine-Driven Leukocyte Recruitment and Barrier Disruption
  biological_scale: TISSUE
  description: >-
    Effector T cell and myeloid cytokine production amplifies leukocyte
    recruitment into the aqueous, vitreous, retina, and choroid while
    further disrupting the blood-retinal barrier, producing the clinical
    signs and sight-threatening complications common to non-infectious
    uveitis of any anatomic class.
  biological_processes:
  - preferred_term: leukocyte migration
    modifier: INCREASED
    term:
      id: GO:0050900
      label: leukocyte migration
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Ocular pain
    description: Intraocular inflammation and elevated intraocular pressure produce pain.
    causal_link_type: DIRECT
  - target: Photophobia
    description: Anterior chamber and ciliary inflammation causes light sensitivity.
    causal_link_type: DIRECT
  - target: Blurred vision
    description: Vitreous haze and macular edema reduce visual clarity.
    causal_link_type: DIRECT
  - target: Macular edema
    description: Leukocyte infiltration and cytokine-driven vascular permeability promote macular edema.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41877771
    reference_title: "The Immunopathogenesis of uveitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "effector T-cells are restimulated by resident microglia and recruited macrophages, driving cytokine cascades that disrupt the blood-retina barrier and amplify leukocyte recruitment"
    explanation: Directly supports the cytokine-driven leukocyte recruitment and barrier disruption mechanism of autoimmune uveitis.
- name: Ocular Pathogen Invasion or Reactivation
  biological_scale: TISSUE
  description: >-
    Infectious uveitis is triggered by direct invasion or reactivation of
    an infectious agent within the eye, mechanistically distinct from the
    autoimmune arm above. The responsible organism differs by anatomic
    class: herpesviruses (herpes simplex virus, varicella zoster virus)
    predominate in infectious anterior uveitis; Toxoplasma gondii,
    cytomegalovirus, and Mycobacterium tuberculosis predominate in
    infectious posterior uveitis and panuveitis. This node begins the
    infectious arm of uveitis pathogenesis and is modeled as a separate
    causal chain rather than merged with the autoimmune arm.
  downstream:
  - target: Pathogen Antigen-Driven Uveal Inflammatory Damage
    description: >-
      Ongoing pathogen replication or antigen persistence drives a
      destructive local inflammatory response.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:40456390
    reference_title: "Infectious uveitis: Epidemiology, etiology, diagnostic test performance and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Infectious uveitis is an inflammation of the uveal tract, corresponding to the middle layer of the eye, triggered by a response against an infectious agent."
    explanation: Establishes the direct infectious-trigger mechanism that distinguishes this arm from autoimmune uveitis.
  - reference: PMID:41877771
    reference_title: "The Immunopathogenesis of uveitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Infectious uveitis reflects direct intraocular infection or reactivation."
    explanation: Confirms direct infection or pathogen reactivation, rather than autoimmunity, as the trigger for this arm.
- name: Pathogen Antigen-Driven Uveal Inflammatory Damage
  biological_scale: TISSUE
  description: >-
    Persistent pathogen replication or retained antigen drives ocular
    infiltration by T cells and B/plasma cells and local production of
    proinflammatory cytokines and chemokines, causing necrotizing or
    granulomatous tissue damage and the same downstream clinical
    complications seen in the autoimmune arm, despite the distinct upstream
    trigger.
  cell_types:
  - preferred_term: lymphocyte
    term:
      id: CL:0000542
      label: lymphocyte
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  - preferred_term: defense response
    modifier: INCREASED
    term:
      id: GO:0006952
      label: defense response
  downstream:
  - target: Ocular pain
    description: Active infectious inflammation produces pain and redness.
    causal_link_type: DIRECT
  - target: Floaters
    description: Vitreous inflammatory infiltrate produces floaters.
    causal_link_type: DIRECT
  - target: Blurred vision
    description: Retinochoroiditis and vitreous haze reduce visual clarity.
    causal_link_type: DIRECT
  - target: Retinal detachment
    description: Necrotizing retinochoroiditis can lead to retinal detachment.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:29543540
    reference_title: "Immunopathology of Virus-Induced Anterior Uveitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These viral infections are commonly associated with ocular infiltration of T cells and B/plasma cells, and expression of cytokines and chemokines typical of a proinflammatory immune response."
    explanation: Directly supports pathogen-driven lymphocyte infiltration and proinflammatory cytokine expression as the tissue-damage mechanism of infectious uveitis.

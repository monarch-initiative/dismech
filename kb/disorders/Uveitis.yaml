genetic:
- name: HLA-B27
  gene_term:
    preferred_term: HLA-B
    term:
      id: hgnc:4932
      label: HLA-B
  association: Strong Risk Factor
  relationship_type: RISK_FACTOR
  notes: >-
    HLA-B27 is the single most frequently identified genetic risk factor for
    acute anterior uveitis, acting principally through HLA-B27-associated
    spondyloarthropathy, and is also a recognized genetic influence on
    uveitis incidence and prevalence more broadly.
  evidence:
  - reference: PMID:19027424
    reference_title: "Incidence and prevalence of uveitis in Veterans Affairs Medical Centers of the Pacific Northwest."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "human leukocyte antigen-B27-related diseases being the most common identified cause"
    explanation: A population-based cohort identifies HLA-B27-related disease as the leading identified cause of anterior uveitis.
  - reference: PMID:40434762
    reference_title: "Uveitis in Adults: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Incidence and prevalence of uveitis are influenced by genetic factors (eg, human leukocyte antigen–B27)"
    explanation: Identifies HLA-B27 as a genetic factor influencing uveitis incidence and prevalence broadly.
- name: ERAP1
  gene_term:
    preferred_term: ERAP1
    term:
      id: hgnc:18173
      label: ERAP1
  association: Risk Factor
  relationship_type: SUSCEPTIBILITY
  notes: >-
    ERAP1 encodes an endoplasmic-reticulum aminopeptidase that trims
    peptides for MHC class I presentation; ERAP1 variants show gene-gene
    interaction with HLA-B27 and shape susceptibility to acute anterior
    uveitis in the context of HLA-B27-associated spondyloarthropathy.
  evidence:
  - reference: PMID:27245590
    reference_title: "HLA-B27 Anterior Uveitis: Immunology and Immunopathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with ankylosing spondylitis (AS) and AAU share other genetic markers, such as ERAP-1, which show strong evidence of gene-gene interaction and point to new mechanisms of disease pathogenesis."
    explanation: Directly supports ERAP1 as a shared genetic modifier contributing to HLA-B27-associated acute anterior uveitis via gene-gene interaction.
diagnosis:
- name: SUN Anatomic Classification
  description: >-
    Diagnosis begins with ophthalmic examination establishing the SUN
    anatomic class (anterior, intermediate, posterior, panuveitis), followed
    by directed evaluation to distinguish infectious from non-infectious
    (autoimmune) etiology.
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  results: >-
    Anatomic classification narrows the differential; systemic and
    infectious workup then determines the causal arm and specific etiology.
  evidence:
  - reference: PMID:36164924
    reference_title: "The standardisation of uveitis nomenclature (SUN) project."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The SUN \"Developing Classification Criteria for the Uveitides\" project used a rigorous, multi-phase approach to develop classification criteria for 25 of the most common uveitic diseases."
    explanation: Describes the SUN classification project that underlies anatomic and etiologic diagnosis of uveitis.
- name: Intraocular Fluid Pathogen PCR Testing
  description: >-
    Polymerase chain reaction testing of aqueous or vitreous fluid supports
    identification of the infectious arm when clinical features suggest a
    herpetic, toxoplasmic, or other infectious etiology.
  diagnosis_term:
    preferred_term: polymerase chain reaction testing
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  results: >-
    A positive intraocular PCR result for a specific pathogen supports
    infectious rather than autoimmune uveitis and directs antimicrobial
    therapy.
  evidence:
  - reference: PMID:40456390
    reference_title: "Infectious uveitis: Epidemiology, etiology, diagnostic test performance and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "polymerase chain reaction (PCR) on ocular specimens for Herpes simplex virus has a sensitivity of 91.3% and specificity of 98.8%, while for toxoplasmosis the sensitivity is 43.1% and specificity 98.5%"
    explanation: Reports the diagnostic performance of intraocular PCR testing used to confirm infectious etiologies of uveitis.
environmental:
- name: Immune checkpoint inhibitor therapy
  exposure_term:
    preferred_term: immune checkpoint inhibitor therapy
  notes: >-
    ECTO was searched (via OLS, ontology=ecto) for "immune checkpoint
    inhibitor" and "checkpoint inhibitor"; no suitable exposure term was
    found, so `term:` is intentionally left unbound.
  influences_mechanisms:
  - target: Breakdown of Ocular Immune Privilege
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Immune checkpoint inhibitor therapy releases the checkpoints that
      normally restrain autoreactive T cells, precipitating loss of ocular
      immune privilege and drug-induced uveitis.
    evidence:
    - reference: DOI:10.3389/fimmu.2023.1302293
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The risk of uveitis was also higher among the ICI group during the 144-month follow-up period with a hazard ratio (HR) of 2.39 (95% CI: 2.07-2.75)."
      explanation: >-
        A matched TriNetX cohort study of 71,931 exposed and 71,931
        unexposed cancer patients found a significantly elevated hazard
        ratio for new-onset uveitis among immune checkpoint inhibitor
        recipients, supporting a direct causal trigger role.

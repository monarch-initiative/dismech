  evidence:
  - reference: PMID:40434762
    reference_title: "Uveitis in Adults: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "posterior uveitis involves the choroid and/or retina (17%-23%)"
    explanation: Defines the anatomic scope and reported frequency of posterior uveitis.
- name: Choroiditis

      label: choroiditis
  classification: anatomic (SUN)
  description: >-
    Focal, multifocal, or diffuse inflammation of the choroid, a form of
    posterior uveitis that may be infectious or non-infectious in origin.
    Fully curated in `Choroiditis.yaml`.
- name: Ocular Toxoplasmosis
  subtype_term:
    preferred_term: ocular toxoplasmosis
    term:
      id: MONDO:0005879
      label: ocular toxoplasmosis
  classification: etiologic (infectious, parasitic)
  description: >-
    Necrotizing retinochoroiditis due to reactivation of latent Toxoplasma
    gondii cysts in the retina, the most common identifiable cause of
    infectious posterior uveitis worldwide. Systemic and congenital
    toxoplasma infection is fully curated in `Toxoplasmosis.yaml`; this stub
    links the ocular manifestation into the posterior uveitis anatomic class.
  evidence:
  - reference: PMID:40456390
    reference_title: "Infectious uveitis: Epidemiology, etiology, diagnostic test performance and treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

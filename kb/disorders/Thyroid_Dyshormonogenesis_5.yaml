name: Thyroid dyshormonogenesis 5
creation_date: "2026-08-22T00:00:00Z"
description: >-
  Thyroid dyshormonogenesis 5 (TDH5) is autosomal recessive congenital
  hypothyroidism caused by biallelic pathogenic variants in DUOXA2. Thyroid
  hormone synthesis requires hydrogen peroxide at the apical membrane of the
  follicular cell, where thyroid peroxidase uses it to iodinate thyroglobulin.
  That peroxide is generated by DUOX2, which cannot fold, exit the endoplasmic
  reticulum or reach the plasma membrane on its own: it depends on the
  ER-resident maturation factor DUOXA2, encoded head-to-head with DUOX2 and
  co-expressed with it. Loss of DUOXA2 therefore strands DUOX2 in the ER and
  starves the apical membrane of peroxide, producing a partial iodine
  organification defect and goitrous congenital hypothyroidism. TDH5 is
  mechanistically a chaperone/maturation-factor deficiency rather than a defect
  in a hormone-synthesizing enzyme itself, and its phenotype tends to be milder
  than biallelic DUOX2 nonsense disease because the paralogous factor DUOXA1
  can partially substitute. Course is variable and frequently transient: on
  re-evaluation at 2-3 years most DUOXA2-associated congenital hypothyroidism
  resolves, and severity does not track genotype, so a DUOXA2 result predicts
  neither permanence nor severity.
category: Mendelian
parents:
- hereditary disease
synonyms:
- TDH5
- DUOXA2 deficiency
- congenital hypothyroidism due to DUOXA2 deficiency
- thyroid dyshormonogenesis type 5
- dual oxidase maturation factor 2 deficiency

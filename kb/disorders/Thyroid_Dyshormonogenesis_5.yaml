      label: thyroid follicular cell
  evidence:
  - reference: PMID:16651268
    reference_title: "Identification of the maturation factor for dual oxidase. Evolution of an eukaryotic operon equivalent."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We demonstrate that co-expression of DUOXA2, an ER-resident transmembrane
      protein, allows ER-to-Golgi transition, maturation, and translocation to the
      plasma membrane of functional DUOX2 in a heterologous system.
    explanation: >-
      Establishes the maturation and trafficking function of DUOXA2 that is lost
      in TDH5.
  - reference: PMID:16651268
    reference_title: "Identification of the maturation factor for dual oxidase. Evolution of an eukaryotic operon equivalent."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      It has been proposed that DUOX retention in the endoplasmatic reticulum (ER)
      of heterologous systems is due to the lack of an unidentified component
      required for functional maturation of the enzyme.
    explanation: >-
      States the ER-retention phenotype that DUOXA2 deficiency reproduces.
  downstream:
  - target: Deficient Apical Hydrogen Peroxide Generation
- name: Deficient Apical Hydrogen Peroxide Generation
  biological_scale: CELLULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    DUOX2 is the catalytic core of the thyroid hydrogen peroxide generator, an
    NADPH:O2 oxidoreductase flavoprotein that supplies peroxide at the apical
    membrane of the follicular cell. With DUOX2 stranded in the ER, apical
    peroxide generation falls and the oxidant required for the iodination
    reaction is no longer available in the follicular lumen.
  cell_types:
  - preferred_term: Thyroid follicular cell
    term:
      id: CL:0002258
      label: thyroid follicular cell
  evidence:
  - reference: PMID:16651268
    reference_title: "Identification of the maturation factor for dual oxidase. Evolution of an eukaryotic operon equivalent."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Dual oxidase 2 (DUOX2), an NADPH:O(2) oxidoreductase flavoprotein, is a
      component of the thyroid H(2)O(2) generator crucial for hormone synthesis at
      the apical membrane.
    explanation: >-
      Identifies DUOX2 as the apical peroxide-generating enzyme whose delivery
      DUOXA2 controls.
  - reference: PMID:18042646
    reference_title: "Biallelic inactivation of the dual oxidase maturation factor 2 (DUOXA2) gene as a novel cause of congenital hypothyroidism."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Dual oxidase 2 (DUOX2) is the catalytic core of the H(2)O(2) generator
      crucial for the iodination of thyroglobulin in thyroid hormone synthesis.
    explanation: >-
      Links apical peroxide generation directly to thyroglobulin iodination, the
      next step in the chain.
  downstream:
  - target: Partial Iodine Organification Defect
- name: Partial Iodine Organification Defect
  biological_scale: TISSUE
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Thyroid peroxidase requires hydrogen peroxide to organify iodide onto
    thyroglobulin tyrosyl residues. Peroxide limitation therefore presents as an
    organification defect, demonstrable on perchlorate discharge testing. It is
    characteristically partial rather than total — the index cohort was assembled
    specifically from patients with a partial iodine organification defect — which
    is consistent with residual peroxide supply from DUOXA1-supported DUOX1.

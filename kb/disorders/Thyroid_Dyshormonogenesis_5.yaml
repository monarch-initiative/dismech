  - reference: PMID:28100324
    reference_title: "[Characteristics of DUOXA2 gene mutation in children with congenital hypothyroidism]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DUOXA2 gene mutation is a common molecular pathogenic basis for CH children

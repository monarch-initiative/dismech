- name: Goitrous Congenital Hypothyroidism
  biological_scale: ORGANISM
  role: consequence
  mechanism_confidence: ESTABLISHED
  description: >-
    Reduced hormone output releases the pituitary from negative feedback; the
    resulting TSH drive both raises TSH on newborn screening and produces
    goitrous enlargement of a structurally normal, eutopic gland. Reported
    DUOXA2 disease spans transient and permanent congenital hypothyroidism,
    with severity variable and generally milder than biallelic DUOX2
    nonsense disease.
  biological_processes:
  - preferred_term: thyroid hormone metabolic process
    modifier: DECREASED
    term:
      id: GO:0042403
      label: thyroid hormone metabolic process

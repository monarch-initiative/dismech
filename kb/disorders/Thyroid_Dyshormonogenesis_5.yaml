- name: Partial Compensation by DUOXA1
  biological_scale: MOLECULAR
  role: modifier
  mechanism_confidence: PROVISIONAL
  description: >-
    DUOXA2 has a paralogue, DUOXA1, arranged head-to-head with DUOX1 in the same
    way DUOXA2 is with DUOX2. Functional studies indicate DUOXA1 can partially
    substitute for missing DUOXA2, which is the proposed reason the index DUOXA2
    patient had a milder phenotype than patients carrying biallelic DUOX2
    nonsense alleles. This node is a severity modifier rather than a step in the
    causal chain, and the supporting evidence is in-vitro plus a single-patient
    clinical correlation, so it is curated as PROVISIONAL.
  genes:
  - preferred_term: DUOXA1
    term:
      id: hgnc:26507
      label: DUOXA1
  evidence:
  - reference: PMID:18042646
    reference_title: "Biallelic inactivation of the dual oxidase maturation factor 2 (DUOXA2) gene as a novel cause of congenital hypothyroidism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Functional studies suggest that the DUOXA2 paralog (DUOXA1) can partially
      compensate DUOXA2 deficiency, consistent with the proband having a milder CH
      phenotype than patients with biallelic DUOX2 nonsense mutations.
    explanation: >-
      The sole evidence for the compensation model and for its proposed clinical
      consequence, both carried here at PROVISIONAL confidence.
  downstream:
  - target: Partial Iodine Organification Defect

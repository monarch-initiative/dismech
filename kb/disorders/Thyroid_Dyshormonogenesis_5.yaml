    reference_title: "Biallelic inactivation of the dual oxidase maturation factor 2 (DUOXA2) gene as a novel cause of congenital hypothyroidism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One Chinese patient born to nonconsanguineous parents was homozygous for a
      nonsense mutation (p.Y246X), producing a truncated DUOXA2 protein lacking
      transmembrane helix 5 and the C-terminal cytoplasmic domain.
    explanation: >-
      Identifies the index allele and the protein domains it removes.
  - reference: PMID:18042646
    reference_title: "Biallelic inactivation of the dual oxidase maturation factor 2 (DUOXA2) gene as a novel cause of congenital hypothyroidism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mutant protein was inactive in reconstituting DUOX2 in vitro.
    explanation: >-
      Functional demonstration that the patient allele is loss-of-function for the
      protein's defining activity.
  - reference: PMID:25675383
    reference_title: "A novel missense mutation (I26M) in DUOXA2 causing congenital goiter hypothyroidism impairs NADPH oxidase activity but not protein expression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In vitro experiments showed that the mutant I26M protein expression levels
      did not differ from those of wild-type DUOXA2 but that mutant I26M resulted
      in a complete deficiency of H2O2 generation.
    explanation: >-
      Shows the lesion can be purely functional: a DUOXA2 allele may be expressed
      at normal levels and still abolish peroxide generation, so protein abundance
      is not a valid readout of pathogenicity here.
  downstream:
  - target: Failure of DUOX2 Maturation and Apical Trafficking
- name: Failure of DUOX2 Maturation and Apical Trafficking
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    DUOX2 cannot mature or leave the endoplasmic reticulum unaided. DUOXA2 is an
    ER-resident transmembrane protein whose co-expression permits ER-to-Golgi
    transition, maturation and translocation of functional DUOX2 to the plasma
    membrane; this was the activity by which DUOXA2 was originally identified,
    resolving the long-standing failure to reconstitute a functional DUOX-based
    NADPH oxidase at the cell surface. Without DUOXA2, DUOX2 is retained in the
    ER and never reaches its site of action.
  biological_processes:
  - preferred_term: endoplasmic reticulum to Golgi vesicle-mediated transport
    modifier: DECREASED
    term:
      id: GO:0006888
      label: endoplasmic reticulum to Golgi vesicle-mediated transport
  locations:
  - preferred_term: endoplasmic reticulum membrane
    term:

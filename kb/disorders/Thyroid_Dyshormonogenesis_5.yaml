  - reference: PMID:18042646
    reference_title: "Biallelic inactivation of the dual oxidase maturation factor 2 (DUOXA2) gene as a novel cause of congenital hypothyroidism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report the first mutation in DUOXA2, identified in a patient with CH and
      dyshormonogenic goiter.
    explanation: >-
      Documents the goitrous congenital hypothyroidism phenotype in the index
      patient.
  - reference: PMID:18042646
    reference_title: "Biallelic inactivation of the dual oxidase maturation factor 2 (DUOXA2) gene as a novel cause of congenital hypothyroidism."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biallelic DUOXA2 mutations are a novel genetic event in permanent CH.
    explanation: >-

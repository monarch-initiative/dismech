    snippet: >-
      We report the first mutation in DUOXA2, identified in a patient with CH and
      dyshormonogenic goiter.
    explanation: >-
      Documents dyshormonogenic goiter in the index patient.
- category: Endocrine
  name: Transient Congenital Hypothyroidism
  description: >-
    Hypothyroidism that resolves on re-evaluation off treatment. A Guangzhou
    series that reassessed children at 2-3 years found most DUOXA2-associated CH
    to be transient, which refutes a permanent-only reading; the denominator
    warrants care, because that majority (4 of 6) is carried by monoallelic
    heterozygotes, and the two p.Tyr246Ter homozygotes split one transient and
    one mild permanent. For biallelic disease as defined here the balance is
    therefore unresolved on n=2. The practical consequence either way is that a
    DUOXA2 diagnosis warrants a planned trial off levothyroxine rather than an
    assumption of lifelong replacement.

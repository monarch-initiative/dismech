inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    TDH5 requires biallelic DUOXA2 variants. Recessive inheritance was
    established in the index pedigree by showing that heterozygous carriers had
    normal thyroid function and normal neonatal TSH screening, and has been
    reproduced in later cohorts where parents heterozygous for DUOX2 or DUOXA2
    variants were euthyroid.
  evidence:
  - reference: PMID:18042646
    reference_title: "Biallelic inactivation of the dual oxidase maturation factor 2 (DUOXA2) gene as a novel cause of congenital hypothyroidism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pedigree analysis demonstrated recessive inheritance, because heterozygous
      carriers had normal thyroid function including negative results in neonatal
      TSH screening.
    explanation: >-
      Direct pedigree demonstration that a single DUOXA2 allele is not sufficient
      to cause disease.
  - reference: PMID:33310921
    reference_title: "DUOX2 variants are a frequent cause of congenital primary hypothyroidism in Thai patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thyroid function tests of most parents with heterozygous state of DUOX2 and
      DUOXA2 variants were normal.
    explanation: >-
      Independent cohort confirmation that heterozygous carriers are generally
      euthyroid.
  - reference: PMID:29650690
    reference_title: "The genetic characteristics of congenital hypothyroidism in China by comprehensive screening of 21 candidate genes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal recessive inheritance of CH caused by mutations in DUOX2,
      DUOXA2, TG and TPO was confirmed by analysis of 22 family pedigrees.
    explanation: >-
      Pedigree analysis across 22 families confirms recessive inheritance for the
      dyshormonogenesis genes including DUOXA2.
pathophysiology:
- name: DUOXA2 Loss of Function
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    Biallelic DUOXA2 variants abolish or severely reduce the function of the dual
    oxidase maturation factor 2 protein. The index allele, homozygous p.Tyr246Ter,
    truncates the protein before transmembrane helix 5 and the C-terminal
    cytoplasmic domain, and the truncated product was shown to be inactive when
    tested for its ability to reconstitute DUOX2.
  genes:
  - preferred_term: DUOXA2
    term:
      id: hgnc:32698
      label: DUOXA2
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    description: >-
      The index genotype is a homozygous germline nonsense allele in a
      non-consanguineous Chinese family. Loss of function was demonstrated
      functionally, not merely predicted from the truncation.

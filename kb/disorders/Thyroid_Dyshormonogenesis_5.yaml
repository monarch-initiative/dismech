      reference_title: "Genetic causes of congenital hypothyroidism due to dyshormonogenesis."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        These include defects in iodide trapping (NIS), in the facilitated iodide
        efflux across the apical membrane (PDS), the organification of iodide
        within the follicular lumen (thyroid peroxidase, DUOX2, DUOXA2), the
        substrate for thyroid hormone synthesis (thyroglobulin) and the ability to
        recover and retain intrathyroidal iodine (iodotyrosine deiodinase).

  description: >-
    Sustained TSH stimulation of a gland that cannot make hormone efficiently
    produces goitrous enlargement. The gland is eutopic and structurally normal,
    which distinguishes dyshormonogenesis from thyroid dysgenesis on imaging.
  phenotype_term:
    preferred_term: Goiter

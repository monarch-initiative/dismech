  evidence:
  - reference: PMID:18042646
    reference_title: "Biallelic inactivation of the dual oxidase maturation factor 2 (DUOXA2) gene as a novel cause of congenital hypothyroidism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subjects included 11 CH patients with partial iodine organification defect
      but negative for other known genetic causes of partial iodine organification
      defect.
    explanation: >-
      Establishes the partial organification defect as the biochemical phenotype
      in which DUOXA2 disease was found.
  - reference: PMID:25231445
    reference_title: "Clinical genetics of congenital hypothyroidism."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mutations in 7 genes are well described causing iodine transport defect
      (SLC5A5), iodine organification defect (TPO, DUOX2, DUOXA2, SLC26A4),
      thyroglobulin (TG) synthesis or transport defect or iodotyrosine deiodinase
      (IYD/DEHAL1) deficiency.
    explanation: >-
      Classifies DUOXA2 disease specifically as an iodine organification defect.
  downstream:

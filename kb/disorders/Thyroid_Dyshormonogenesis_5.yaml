discussions:
- discussion_id: tdh5_duoxa1_compensation_untested_in_patients
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does DUOXA1-mediated compensation actually account for the milder phenotype
    of DUOXA2 disease in patients, or is the severity difference explained by
    residual allele function and cohort ascertainment?
  attaches_to:
  - "pathophysiology#Partial Compensation by DUOXA1"
  rationale: >-
    The compensation model is attractive and mechanistically plausible — DUOXA1
    is a paralogue with the same maturation function for DUOX1 — but the evidence
    is a functional study plus a severity comparison anchored on a single DUOXA2
    proband against DUOX2-nonsense patients. That comparison cannot separate
    paralogue compensation from allele-specific residual function or from the
    ascertainment route, since the DUOXA2 patient was found by screening a
    partial-organification-defect cohort, which selects against the most severe
    presentations. The question matters because DUOXA1 compensation, if real and
    modifiable, is a therapeutic target in a disease otherwise managed only by
    hormone replacement.
  proposed_experiments:
  - experiment_id: exp_tdh5_duoxa1_expression_in_patient_thyroid
    name: DUOXA1 and DUOX1 expression in DUOXA2-deficient thyroid tissue
    description: >-
      Quantify DUOXA1 and DUOX1 transcript and protein in thyroid tissue or
      thyrocyte models from DUOXA2-deficient patients versus controls, testing
      whether compensation is accompanied by measurable paralogue upregulation.
  - experiment_id: exp_tdh5_genotype_severity_cohort
    name: Genotype-stratified severity comparison across dyshormonogenesis genes
    description: >-
      Assemble reported DUOXA2, DUOX2 and TPO patients and compare severity
      measures ascertained the same way, to test whether the DUOXA2 milder-course
      claim survives control for ascertainment.
- discussion_id: tdh5_no_genotype_phenotype_correlation
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does DUOXA2 genotype fail to predict whether congenital hypothyroidism is
    transient or permanent, or how severe it is?
  attaches_to:
  - "pathophysiology#DUOXA2 Loss of Function"
  - "pathophysiology#Goitrous Congenital Hypothyroidism"
  rationale: >-
    The absence of a correlation is stated directly rather than merely
    unobserved, which makes it a finding rather than a gap in ascertainment. The
    same homozygous p.Tyr246Ter genotype produced transient disease in one child
    and mild permanent disease in another; monoallelic carriers ranged from
    typical permanent CH to transient. Several explanations are open and none
    tested: variable DUOXA1 compensation between individuals, dietary iodine
    sufficiency modifying how much residual peroxide output suffices, oligogenic
    contributions from the other dyshormonogenesis genes (digenic and triallelic
    DUOX2/DUOXA2 combinations are common in cohort series), or a developmental
    window after which the demand for hormone synthesis falls. Distinguishing
    them matters because it determines whether a trial off levothyroxine can be
    predicted rather than simply attempted.

    Monoallelic reports are recorded here rather than as phenotypes, deliberately.
    A dizygotic twin pair (PMID:27349010) is often cited to illustrate
    genotype-independence, and it cannot do that work for this entry: the twins
    each carried a SINGLE heterozygous variant, and in different genes - the boy
    a DUOXA2 p.Tyr246Ter, the girl a DUOX2 p.Arg885Gln. So the pair says nothing
    about DUOXA2 genotype-phenotype independence, and the boy's thyroid imaging
    cannot be curated as a TDH5 phenotype without contradicting this entry's own
    `inheritance` evidence that heterozygous carriers are euthyroid with negative
    neonatal screening. The wider question of why monoallelic DUOXA2 carriers are
    reported with CH at all - whether through an undetected second hit, an
    oligogenic contribution, or ascertainment - is part of this gap, not a
    settled phenotype.
  proposed_experiments:
  - experiment_id: exp_tdh5_transient_vs_permanent_cohort
    name: Genotype-stratified re-evaluation cohort with iodine status
    description: >-
      Reassess DUOXA2 patients off treatment at a uniform age while recording
      full dyshormonogenesis-gene genotype, DUOXA1 variants and iodine status, to
      test whether apparent genotype-independence survives control for oligogenic
      burden and environmental iodine.
  - experiment_id: exp_tdh5_residual_h2o2_vs_outcome
    name: Residual peroxide output as a predictor of course
    description: >-
      Measure H2O2 generation for each reported DUOXA2 allele in a common
      reconstitution system and test whether residual output, rather than allele
      identity, correlates with transient versus permanent disease.
- discussion_id: tdh5_boundary_with_congenital_hypothyroidism_entry
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Should the gene-anchored thyroid dyshormonogenesis entities be curated as
    standalone entries, as here, or folded into the Congenital_Hypothyroidism
    entry's Dyshormonogenesis subtype?
  attaches_to:
  - "pathophysiology#DUOXA2 Loss of Function"
  rationale: >-
    This is a curation-boundary question, recorded so the decision is auditable
    rather than implicit. Congenital_Hypothyroidism already carries a
    Dyshormonogenesis has_subtypes entry bound to MONDO:0010132, which is the
    direct MONDO parent of this entry's MONDO:0010137. That subtype names DUOXA2
    in prose but carries no per-gene mechanism, and a lumped subtype cannot
    represent a maturation-factor defect distinctly from a defect in a
    hormone-synthesizing enzyme — the distinction that makes TDH5 mechanistically
    interesting. A standalone entry was therefore curated. The repository has
    precedent both ways (Central_Congenital_Hypothyroidism is standalone
    alongside a Central subtype), and an active reconciliation of exactly this
    pattern is under way for Loeys-Dietz, so the convention may change.
notes: >-
  Scope and boundaries. This entry covers TDH5 specifically — the DUOXA2-anchored
  member of the thyroid dyshormonogenesis series (MONDO:0010137). It deliberately
  does not restate the general congenital hypothyroidism picture, which is curated
  in Congenital_Hypothyroidism, nor the DUOX2-anchored disease, which is a
  distinct entity. See the tdh5_boundary_with_congenital_hypothyroidism_entry
  discussion for why a standalone entry was created rather than a has_subtypes
  entry, and revisit it if the repository settles a different convention.

  What makes this entity mechanistically distinct. Most dyshormonogenesis genes
  encode enzymes or transporters that act directly in hormone synthesis (TPO, TG,
  SLC5A5, SLC26A4, IYD). DUOXA2 does not: it is a maturation factor whose only
  role is to get another protein folded, out of the ER and onto the apical
  membrane. TDH5 is therefore a trafficking/chaperone disease presenting as an
  organification defect, and the pathograph is curated to keep that distinction
  visible rather than collapsing it to "impaired hormone synthesis".

  A correction worth preserving. The index report classified biallelic DUOXA2
  disease as permanent congenital hypothyroidism, and that framing propagated.
  A later series that actually re-evaluated children off treatment at 2-3 years
  found most DUOXA2-associated CH to be transient, including in a p.Tyr246Ter
  homozygote. The entry now carries both, with the index claim marked PARTIAL.
  Note the denominator: that series' transient majority is carried by
  monoallelic heterozygotes, and its two homozygotes split one transient and one
  mild permanent, so it refutes permanent-only without establishing a rate for
  biallelic disease.
  Do not restore a permanent-only reading: the clinical consequence is that a
  DUOXA2 diagnosis warrants a planned trial off levothyroxine rather than an
  assumption of lifelong replacement.

  Protein abundance is not a pathogenicity readout here. The I26M allele is
  expressed at wild-type levels and still abolishes H2O2 generation entirely, so
  a normal Western blot does not exclude a damaging DUOXA2 variant.

  Evidence base. Small. The gene's function rests on the 2006 identification
  paper, and the disease on the 2008 index patient plus subsequent cohort
  sequencing studies in which DUOXA2 recurs as a minority cause alongside the
  much more common DUOX2. Severity claims should stay hedged accordingly.

biochemical:
- name: Partial Iodine Organification Defect on Perchlorate Discharge
  presence: PRESENT
  notes: >-
    The discriminating biochemical phenotype. A perchlorate discharge test
    demonstrates that trapped iodide has not been organified onto thyroglobulin.
    In DUOXA2 disease the defect is partial rather than total, and the original
    DUOXA2 patient was found precisely by screening a cohort selected for partial
    organification defect with no other identified genetic cause.
  evidence:
  - reference: PMID:18042646
    reference_title: "Biallelic inactivation of the dual oxidase maturation factor 2 (DUOXA2) gene as a novel cause of congenital hypothyroidism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subjects included 11 CH patients with partial iodine organification defect
      but negative for other known genetic causes of partial iodine organification
      defect.
    explanation: >-
      Defines the biochemical selection criterion that identified DUOXA2 disease.
genetic:
- name: DUOXA2
  gene_term:
    preferred_term: DUOXA2
    term:
      id: hgnc:32698
      label: DUOXA2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  frequency: >-
    Biallelic in the index families that define TDH5; cohort sequencing also
    reports monoallelic DUOXA2 carriers with congenital hypothyroidism (4 of 6
    in one Guangzhou series), whose sufficiency is unresolved
  notes: >-
    DUOXA2 (15q21.1) is transcribed head-to-head with DUOX2 from a shared
    bidirectional promoter region, an arrangement the discovering authors likened
    to a eukaryotic operon equivalent and which can be traced back before the
    divergence of echinoderms. The index pathogenic allele is the nonsense
    c.738C>G (p.Tyr246Ter). That allele appears to be population-enriched: one
    heterozygous carrier was found among 92 unrelated Chinese controls but none
    among Caucasian or Japanese controls.
  evidence:
  - reference: PMID:18042646
    reference_title: "Biallelic inactivation of the dual oxidase maturation factor 2 (DUOXA2) gene as a novel cause of congenital hypothyroidism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One heterozygous carrier of Y246X was identified in unrelated Chinese
      controls (n = 92) but not in Caucasian or Japanese controls, indicating that
      homozygosity for Y246X could be a frequent cause of CH in Chinese.
    explanation: >-
      Supports population enrichment of the index allele in Chinese populations.
  - reference: PMID:33310921
    reference_title: "DUOX2 variants are a frequent cause of congenital primary hypothyroidism in Thai patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 45 variants, 7 genes were involved (DUOX2, DUOXA2, TG, TPO, SLC5A5, PAX8
      and TSHR).
    explanation: >-
      Confirms DUOXA2 recurs as a causative gene in an independent congenital
      hypothyroidism cohort.
diagnosis:
- name: Newborn TSH Screening
  description: >-
    TDH5 is ascertained through routine neonatal congenital hypothyroidism
    screening. Screening does not distinguish dyshormonogenesis from dysgenesis;
    that requires imaging of a eutopic gland plus, ideally, molecular diagnosis.
  evidence:
  - reference: PMID:18042646
    reference_title: "Biallelic inactivation of the dual oxidase maturation factor 2 (DUOXA2) gene as a novel cause of congenital hypothyroidism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pedigree analysis demonstrated recessive inheritance, because heterozygous
      carriers had normal thyroid function including negative results in neonatal
      TSH screening.
    explanation: >-
      Establishes neonatal TSH screening as the ascertainment route and shows
      carriers screen negative.
- name: Molecular Diagnosis of the Dyshormonogenesis Gene
  description: >-
    Identifying the specific gene has prognostic value beyond confirming the
    diagnosis: it distinguishes transient from permanent congenital
    hypothyroidism, informs genetic counselling, and predicts whether iodine
    supplementation may serve as an adjunct or alternative to levothyroxine.
  evidence:
  - reference: PMID:21543982
    reference_title: "Genetic causes of congenital hypothyroidism due to dyshormonogenesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A definite molecular diagnosis of thyroid dyshormonogenesis allows genetic
      counseling and has prognostic value in differentiating transient from
      permanent congenital hypothyroidism and predicting the response of patients

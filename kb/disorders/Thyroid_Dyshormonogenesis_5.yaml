    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DUOXA2 gene mutation is a common molecular pathogenic basis for CH children
      with suspected thyroid dyshormonogenesis in Guangzhou, and most of them are
      manifested as transient CH.
    explanation: >-
      Establishes transient CH as the predominant DUOXA2 outcome on re-evaluation.
- category: Endocrine
  name: Variable Severity Independent of Genotype
  description: >-
    Severity does not track the DUOXA2 genotype. The Guangzhou series states
    directly that there is no genotype-phenotype association, and homozygous
    p.Tyr246Ter produced transient disease in one child and mild permanent
    disease in another. Genotype therefore cannot be used to predict course,
    which is an unusual and clinically important negative.

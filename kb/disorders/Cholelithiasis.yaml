name: Cholelithiasis
disease_term:
  preferred_term: cholelithiasis
  term:
    id: MONDO:0012672
    label: cholelithiasis
category: Disease
creation_date: "2026-10-08T00:00:00Z"
description: >-
  Gallstones in the gallbladder or biliary tree. Cholesterol stones are the
  dominant form and are the mechanism this entry models: hepatic secretion of
  cholesterol in excess of the bile salts and phospholipids that keep it
  solubilized produces supersaturated gallbladder bile, gallbladder mucin and
  other pronucleating factors accelerate the phase transition to solid
  cholesterol monohydrate crystals, and gallbladder hypomotility gives those
  crystals the residence time to be retained, aggregate and grow into
  macroscopic stones. Any one of the three is sufficient to start the process
  and most patients carry more than one. The disease is largely silent: a
  large majority of people with incidentally detected stones stay
  asymptomatic, and the clinical burden falls on the minority whose stones
  impact in the gallbladder neck or cystic duct, producing biliary pain, acute
  cholecystitis, or, when a stone passes into the common duct, obstructive
  jaundice and gallstone pancreatitis. Prevalence is high and rising with
  metabolic risk, from 7.4% to 13.9% of US adults across three decades.
  Treatment is laparoscopic cholecystectomy for symptomatic stones, with
  endoscopic clearance first when the common duct is involved; asymptomatic
  stones are managed expectantly.
notes: >-
  Scope. This entry models the cholesterol-stone mechanism, which the
  lithogenesis literature treats as the dominant form. Pigment stones are a
  different mechanism on the same anatomical outcome - black stones in chronic
  haemolysis, cirrhosis, Gilbert syndrome and cystic fibrosis, brown stones
  with biliary infection - and the KB already carries them as a phenotype of
  Sickle_Cell_Disease and Gilberts_Syndrome rather than through this chain.
  Whether cholelithiasis should become one entry with cholesterol and pigment
  subtypes, or a Grouping over two mechanism-distinct entries, is left open:
  this entry takes the cholesterol pathway, names the pigment alternative in
  the trigger node's description, and moves no entity boundary.

  MONDO:0012672 is used rather than MONDO:0005346 "gallstones", whose own
  definition describes the crystalline precipitate rather than the clinical
  condition.

  Ursodeoxycholic acid dissolution therapy is deliberately not curated as a
  treatment here. It is a real option for small, radiolucent stones in a
  functioning gallbladder, but the two management reviews cited in this entry
  do not state its indication or efficacy in a quotable sentence, and the
  dissolution trial literature was not read for this pass. Adding it needs its
  own source rather than an inference from the mechanism.
pathophysiology:
- name: Hepatic Cholesterol Hypersecretion and Biliary Supersaturation
  conforms_to: "cholelithiasis_biliary_supersaturation#Biliary Cholesterol Supersaturation"
  role: trigger
  biological_scale: ORGANISM
  description: >-
    Hepatocytes secrete cholesterol into bile in excess of the bile salts and
    phospholipids needed to hold it in mixed micelles and vesicles, so
    gallbladder bile becomes supersaturated and physically metastable. The
    excess is driven by the hepatocanalicular sterol transporter ABCG5/G8 in
    the genetic form and by insulin resistance and obesity in the common
    metabolic form. This is the step that distinguishes cholesterol stones
    from pigment stones, which instead precipitate bilirubin and arise in
    chronic haemolysis, cirrhosis or biliary infection.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: cholesterol homeostasis
    term:
      id: GO:0042632
      label: cholesterol homeostasis
    modifier: ABNORMAL
  - preferred_term: bile acid metabolic process
    term:
      id: GO:0008206
      label: bile acid metabolic process
    modifier: ABNORMAL
  evidence:
  - reference: PMID:18992590
    reference_title: Lithogenesis and bile metabolism.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Cholesterol crystal formation requires the presence of one or more of the following: (a) cholesterol supersaturation, (b) accelerated nucleation, or (c) gallbladder hypomotility/bile stasis."
    explanation: States the three-step triad this entry's pathophysiology follows, with supersaturation as the first.
  - reference: PMID:18992590
    reference_title: Lithogenesis and bile metabolism.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Generally, pigment stones are formed by the precipitation of bilirubin in bile, with black stones associated with chronic hemolytic states, cirrhosis, Gilbert syndrome, or cystic fibrosis, and brown stones associated with chronic bacterial or parasitic infections."
    explanation: The pigment-stone alternative this node explicitly excludes, and the reason the entry's scope note names it.
  - reference: PMID:17626266
    reference_title: Increased gallstone risk in humans conferred by common variant of hepatic ATP-binding cassette transporter for cholesterol.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The linkage and association studies identified the cholesterol transporter ABCG5/G8 as a genetic determinant of gallstone formation, or LITH gene, in humans."
    explanation: Identifies the hepatocanalicular transporter whose variants drive the hypersecretion at this node.
  downstream:
  - target: Mucin-Accelerated Cholesterol Crystal Nucleation
    causal_link_type: DIRECT
    description: >-
      Supersaturated bile is metastable, so the dissolved cholesterol can
      undergo a phase transition once nucleation is accelerated.
- name: Mucin-Accelerated Cholesterol Crystal Nucleation
  conforms_to: "cholelithiasis_biliary_supersaturation#Pronucleating Cholesterol Crystal Nucleation"
  role: amplifier
  biological_scale: TISSUE
  description: >-
    Gallbladder epithelium hypersecretes mucin, which accumulates as a viscous
    gel in the gallbladder lumen before any stone is visible. Hydrophobic
    domains on the mucin protein core bind the cholesterol-enriched vesicles
    carried in supersaturated bile and accelerate nucleation of solid
    cholesterol monohydrate crystals, which first appear inside that gel.
  cell_types:
  - preferred_term: gallbladder epithelial cell
    term:
      id: CL:0000066
      label: epithelial cell
  biological_processes:
  - preferred_term: mucus secretion
    term:
      id: GO:0070254
      label: mucus secretion
    modifier: INCREASED
  evidence:
  - reference: PMID:2210647
    reference_title: Gallbladder mucin as a pronucleating agent for cholesterol monohydrate crystals in bile.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In both animals and man, the initial stage of cholesterol gallstone formation, the nucleation of cholesterol monohydrate crystals, occurs within the mucus gel."
    explanation: Places nucleation, the step this node represents, inside the secreted mucin gel.
  - reference: PMID:2210647
    reference_title: Gallbladder mucin as a pronucleating agent for cholesterol monohydrate crystals in bile.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Binding of cholesterol-enriched vesicles to hydrophobic domains on the mucin protein core appears to be critical for the acceleration of cholesterol crystal nucleation by mucin."
    explanation: The molecular basis for calling mucin a pronucleating factor rather than a bystander.
  - reference: PMID:2210647
    reference_title: Gallbladder mucin as a pronucleating agent for cholesterol monohydrate crystals in bile.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Inhibition of mucus secretion with aspirin prevents gallstone formation in the cholesterol-fed prairie dog, indicating the importance of mucus in gallstone formation."
    explanation: The interventional evidence that mucin secretion is necessary rather than incidental, in an animal model.
  downstream:
  - target: Gallbladder Hypomotility and Bile Stasis
    causal_link_type: DIRECT
    description: >-
      Newly nucleated crystals are only retained if the gallbladder fails to
      clear them, which the same lithogenic state impairs.
- name: Gallbladder Hypomotility and Bile Stasis
  conforms_to: "cholelithiasis_biliary_supersaturation#Gallbladder Hypomotility and Bile Stasis"
  role: central_effector
  biological_scale: TISSUE
  description: >-
    Gallbladder smooth muscle contracts incompletely after a meal, leaving an
    enlarged residual volume and stagnant bile. The prolonged residence time
    is what converts nucleation into stone formation: crystals that would
    otherwise be emptied into the intestine are retained long enough to
    aggregate and grow. This is the step the entry shares with every other
    disorder that forms cholesterol stones, whatever drove the
    supersaturation.
  cell_types:
  - preferred_term: gallbladder smooth muscle cell
    term:
      id: CL:0000192
      label: smooth muscle cell
  biological_processes:
  - preferred_term: smooth muscle contraction
    term:
      id: GO:0006939
      label: smooth muscle contraction
    modifier: DECREASED
  evidence:
  - reference: PMID:18992590
    reference_title: Lithogenesis and bile metabolism.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Some risk factors for cholesterol stones include age, gender, genetics, obesity, rapid weight loss, and ileal disease."
    explanation: The risk factors that act through this node and the supersaturation node, including the rapid weight loss that impairs emptying.
  - reference: PMID:2210647
    reference_title: Gallbladder mucin as a pronucleating agent for cholesterol monohydrate crystals in bile.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "mucus accumulates as a viscous gel within the gallbladder lumen before gallstone formation"
    explanation: Evidence of retained luminal content preceding stone formation, the stasis this node describes.
  downstream:
  - target: Gallstone Growth in the Gallbladder
    causal_link_type: DIRECT
    description: >-
      Retained crystals in a stagnant, mucin-rich lumen aggregate and grow.
- name: Gallstone Growth in the Gallbladder
  conforms_to: "cholelithiasis_biliary_supersaturation#Gallstone Aggregation and Growth"
  role: effector
  biological_scale: TISSUE
  description: >-
    Cholesterol monohydrate crystals, embedded in the mucin gel of a poorly
    emptying gallbladder, aggregate and coalesce into macroscopic stones.
    Growth is sustained while supersaturation and stasis persist, which is why
    stones are usually multiple and why they recur after non-operative
    clearance.
  biological_processes:
  - preferred_term: cholesterol transport
    term:
      id: GO:0030301
      label: cholesterol transport
    modifier: ABNORMAL
  evidence:
  - reference: PMID:2210647
    reference_title: Gallbladder mucin as a pronucleating agent for cholesterol monohydrate crystals in bile.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "Hypersecretion of gallbladder mucus occurs in response to a lithogenic diet in experimental animals, and mucus accumulates as a viscous gel within the gallbladder lumen before gallstone formation."
    explanation: The gel matrix in which aggregation and growth proceed, established before macroscopic stones appear.
  - reference: PMID:32166900
    reference_title: "Prevalence and risk factors for gallstone disease: A population-based cross-sectional study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "men were more susceptible to develop multiple stones (OR 2.356, 95% CI 1.321-4.200, P = 0.004)"
    explanation: Multiplicity as a measured feature of the growth phase, and one that differs by sex.
  downstream:
  - target: Stone Impaction and Biliary Obstruction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Only a minority of stones ever impact; what determines which do is not
      established, which is why this edge is not direct.
- name: Stone Impaction and Biliary Obstruction
  conforms_to: "cholelithiasis_biliary_supersaturation#Cholelithiasis"
  role: consequence
  biological_scale: ORGANISM
  description: >-
    A stone impacted in the gallbladder neck or cystic duct raises
    intraluminal pressure and produces biliary pain and, when obstruction
    persists, acute cholecystitis. A stone that passes into the common bile
    duct obstructs biliary drainage, giving jaundice, and can obstruct the
    pancreatic duct, giving gallstone pancreatitis. Most stones never reach
    this node: the majority of people with incidentally detected gallstones
    remain asymptomatic.
  biological_processes:
  - preferred_term: bile acid metabolic process
    term:
      id: GO:0008206
      label: bile acid metabolic process
    modifier: ABNORMAL
  evidence:
  - reference: PMID:2187558
    reference_title: Asymptomatic gallstones.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Gallstones may present as biliary pain, acute cholecystitis, biliary obstruction or pancreatitis, but it is not clear who will develop symptoms and what are the commonest initial symptoms."
    explanation: Names the four presentations of this node and records that who progresses to them is unexplained.
  - reference: PMID:2187558
    reference_title: Asymptomatic gallstones.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Studies of the natural history of silent gallstones suggest that a large majority of patients with such stones will remain asymptomatic."
    explanation: Supports the claim that reaching this node is the exception rather than the rule.
  downstream:
  - target: Biliary pain
    causal_link_type: DIRECT
    description: >-
      Cystic-duct obstruction by an impacted stone produces the episodic
      visceral pain that defines symptomatic disease.
  - target: Cholecystitis
    causal_link_type: DIRECT
    description: >-
      Sustained obstruction with raised intraluminal pressure produces acute
      inflammation of the gallbladder wall.
  - target: Obstructive jaundice
    causal_link_type: DIRECT
    description: >-
      A stone passing into the common bile duct obstructs biliary drainage.
  - target: Gallstone pancreatitis
    causal_link_type: DIRECT
    description: >-
      A stone impacted at the ampulla obstructs the pancreatic duct.
phenotypes:
- name: Biliary pain
  category: Clinical
  description: >-
    Episodic severe right upper quadrant or epigastric pain, typically
    postprandial and lasting hours, caused by a stone obstructing the cystic
    duct. This is the presentation that defines symptomatic gallstone disease
    and the indication for cholecystectomy.
  phenotype_term:
    preferred_term: biliary colic
    term:
      id: HP:0002574
      label: Episodic abdominal pain
  evidence:
  - reference: PMID:2187558
    reference_title: Asymptomatic gallstones.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Gallstones may present as biliary pain, acute cholecystitis, biliary obstruction or pancreatitis"
    explanation: Biliary pain as the first-named presentation of gallstones.
  - reference: PMID:32234195
    reference_title: The Treatment of Gallstone Disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Cholecystectomy is indicated for patients with symptomatic gallstones or sludge."
    explanation: Establishes that it is this phenotype, not the stones themselves, that drives management.
- name: Cholecystitis
  category: Clinical
  description: >-
    Acute inflammation of the gallbladder wall following sustained cystic-duct
    obstruction, and the complication that converts elective surgery into an
    urgent indication.
  phenotype_term:
    preferred_term: acute cholecystitis
    term:
      id: HP:0001082
      label: Cholecystitis
  evidence:
  - reference: PMID:32234195
    reference_title: The Treatment of Gallstone Disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Acute cholecystitis is an indication for early laparoscopic cholecystectomy within 24 hours of admission to hospital."
    explanation: Records cholecystitis as a gallstone complication with its own urgent management.
- name: Obstructive jaundice
  category: Clinical
  description: >-
    Jaundice from obstruction of the common bile duct by a migrated stone,
    which requires endoscopic duct clearance before the gallbladder is
    removed.
  phenotype_term:
    preferred_term: jaundice
    term:
      id: HP:0000952
      label: Jaundice
  evidence:
  - reference: PMID:32234195
    reference_title: The Treatment of Gallstone Disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "After successful endoscopic clearance of the biliary pathway, patients who also have cholelithiasis should undergo laparoscopic cholecystectomy within 72 hours."
    explanation: Common-duct involvement as a distinct state requiring clearance of the biliary pathway first.
- name: Gallstone pancreatitis
  category: Clinical
  description: >-
    Acute pancreatitis caused by a stone obstructing the pancreatic duct at
    the ampulla, the most dangerous common complication of gallstones.
  phenotype_term:
    preferred_term: acute pancreatitis
    term:
      id: HP:0001733
      label: Pancreatitis
  evidence:
  - reference: PMID:2187558
    reference_title: Asymptomatic gallstones.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Gallstones may present as biliary pain, acute cholecystitis, biliary obstruction or pancreatitis, but it is not clear who will develop symptoms"
    explanation: Pancreatitis as a recognised presenting complication of gallstones.
genetic:
- name: ABCG8 lithogenic variant
  notes: >-
    The D19H variant of the hepatocanalicular sterol hemitransporter ABCG8 is
    the best-replicated genetic risk factor for gallstones, acting at the
    supersaturation step. It is a risk allele and not a Mendelian cause:
    heterozygotes are enriched among gallstone patients roughly threefold, and
    most carriers never form stones.
  relationship_type: RISK_FACTOR
  gene_term:
    preferred_term: ABCG8
    term:
      id: hgnc:13887
      label: ABCG8
  evidence:
  - reference: PMID:17626266
    reference_title: Increased gallstone risk in humans conferred by common variant of hepatic ATP-binding cassette transporter for cholesterol.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In ASPs, gallstones were strongly linked to the D19H variant of the ABCG8 gene (NPL score = 7.1; P = 4.6 x 10(-13))."
    explanation: The linkage result identifying the specific variant.
  - reference: PMID:17626266
    reference_title: Increased gallstone risk in humans conferred by common variant of hepatic ATP-binding cassette transporter for cholesterol.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "21.4% of gallstone patients carried the heterozygous D19H genotype, compared with 8.6% of controls (OR = 2.954; P = 0.026)"
    explanation: Quantifies the effect size that makes this a risk factor rather than a causative gene.
prevalence:
- population: United States adults, NHANES 2017 to March 2020
  measure_type: LIFETIME_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 13900.0
  notes: >-
    Self-reported history of gallstone disease, so a lifetime rather than a
    point measure. The same survey series gives 7.4% in 1988 to 1994, which
    the authors read as a doubling over three decades.
  evidence:
  - reference: PMID:36631004
    reference_title: Increasing gallstone disease prevalence and associations with gallbladder and biliary tract mortality in the US.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Between 1988-1994 and 2017-March 2020, gallstone disease prevalence increased from 7.4% to 13.9% and gallbladder surgery from 6.0% to 11.6%."
    explanation: Source of both the current figure and the trend recorded in the notes.
- population: Shanghai, China, general population
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 6830.0
  notes: >-
    Ultrasound-ascertained point prevalence in 4009 participants, so not
    directly comparable with the self-reported US lifetime figure above.
  evidence:
  - reference: PMID:32166900
    reference_title: "Prevalence and risk factors for gallstone disease: A population-based cross-sectional study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall prevalence of gallstones was 6.83% (6.22% for men vs 7.31% for women, P = 0.173)."
    explanation: The ultrasound-based point prevalence and its sex breakdown.
treatments:
- name: Laparoscopic Cholecystectomy
  description: >-
    Removal of the gallbladder, which eliminates both the stones and the organ
    in which they form, and is therefore definitive rather than suppressive.
    Indicated for symptomatic stones, and performed early when acute
    cholecystitis has supervened.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: laparoscopic cholecystectomy
    term:
      id: NCIT:C51676
      label: Cholecystectomy
  target_mechanisms:
  - target: Gallstone Growth in the Gallbladder
    treatment_effect: BYPASSES
    description: >-
      Cholecystectomy does not correct the supersaturation that drives
      lithogenesis; it removes the reservoir in which crystals are retained
      and grow, so the mechanism upstream of this node persists after surgery.
    evidence:
    - reference: PMID:32234195
      reference_title: The Treatment of Gallstone Disease.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Cholecystectomy is indicated for patients with symptomatic gallstones or sludge. This should be performed laparoscopically with a four-trocar technique, if possible."
      explanation: The indication and the route, for the operation this link describes.
  evidence:
  - reference: PMID:32234195
    reference_title: The Treatment of Gallstone Disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The timing of treatment for gallstone disease is an essential determinant of therapeutic success."
    explanation: The review's own conclusion on what governs outcome in this disease.
  - reference: PMID:32234195
    reference_title: The Treatment of Gallstone Disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Cholecystectomy can be performed in any trimester of pregnancy, if urgently indicated."
    explanation: Records that pregnancy is not a contraindication, which matters because pregnancy is itself lithogenic.
- name: Endoscopic Biliary Clearance
  description: >-
    Endoscopic retrograde cholangiography to clear stones from the common bile
    duct, done before cholecystectomy when the duct is involved.
    Endosonography first reduces the number of purely diagnostic procedures.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: endoscopic retrograde cholangiography for duct clearance
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Stone Impaction and Biliary Obstruction
    treatment_effect: INHIBITS
    description: >-
      Clearing the duct relieves the obstruction that produces jaundice and
      pancreatitis, without affecting stone formation in the gallbladder.
    evidence:
    - reference: PMID:32234195
      reference_title: The Treatment of Gallstone Disease.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "After successful endoscopic clearance of the biliary pathway, patients who also have cholelithiasis should undergo laparoscopic cholecystectomy within 72 hours."
      explanation: Establishes duct clearance as a distinct intervention preceding cholecystectomy.
  evidence:
  - reference: PMID:32234195
    reference_title: The Treatment of Gallstone Disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Endoscopic retrograde cholangiography should only be carried out as part of a planned therapeutic intervention; endosonography beforehand lessens the number of endoscopic retrograde cholangiographies that need to be performed."
    explanation: The procedure's indication and the imaging that should precede it.
environmental:
- name: Obesity and insulin resistance
  description: >-
    Metabolic risk acts on the supersaturation step and is the main reason
    population prevalence is rising. Central adiposity and diabetes are
    associated with gallstones, and diabetes with larger stones.
  influences_mechanisms:
  - target: Hepatic Cholesterol Hypersecretion and Biliary Supersaturation
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Insulin resistance raises biliary cholesterol secretion, but the
      intermediate steps between adiposity and the measured saturation index
      are not established in these sources.
    evidence:
    - reference: PMID:32166900
      reference_title: "Prevalence and risk factors for gallstone disease: A population-based cross-sectional study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "a waist-to-height ratio >=0.5 (OR 1.656, 95% CI 1.197-2.292, P = 0.002) had an increased risk of developing gallstones"
      explanation: Central adiposity as a measured risk factor for the disease this node initiates.
  evidence:
  - reference: PMID:26560258
    reference_title: Management of gallstones and its related complications.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "For cholesterol gallstone disease, moreover, a strong link exists between this disease and highly prevalent metabolic disorders such as obesity, dyslipidemia, type 2 diabetes, hyperinsulinemia, hypertriglyceridemia and the metabolic syndrome."
    explanation: States the metabolic association for the cholesterol-stone form specifically.
  - reference: PMID:32166900
    reference_title: "Prevalence and risk factors for gallstone disease: A population-based cross-sectional study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diabetes (OR 4.144, 95% CI 1.171-14.671, P = 0.028) was a risk factor for the formation of gallstones with diameters >=1 cm"
    explanation: Diabetes associated specifically with larger stones, which bears on the growth node.
progression:
- phase: Asymptomatic (silent) gallstones
  notes: >-
    Stones present on imaging with no biliary symptoms. The large majority of
    people in this phase stay in it, which is why incidental stones are
    managed expectantly rather than surgically. Diabetes is one of the
    recognised exceptions carrying a higher risk of progression.
  evidence:
  - reference: PMID:2187558
    reference_title: Asymptomatic gallstones.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, diabetics are at increased risk, as are patients whose stones are detected initially at laparotomy."
    explanation: Names the subgroups whose risk of leaving the asymptomatic phase is higher.
- phase: Symptomatic gallstone disease
  notes: >-
    Recurrent biliary pain, the phase in which cholecystectomy is indicated,
    and from which the obstructive complications arise.
  evidence:
  - reference: PMID:26560258
    reference_title: Management of gallstones and its related complications.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The majority of gallstone patients remain asymptomatic; however, interest toward the gallstone disease is continuing because of the high worldwide prevalence and management costs and the development of gallstone symptoms and complications."
    explanation: Distinguishes the asymptomatic majority from the symptomatic phase this record describes.
discussions:
- discussion_id: gap_which_silent_gallstones_become_symptomatic
  prompt: >-
    Which asymptomatic gallstones will become symptomatic or obstruct, and
    what distinguishes them from the large majority that never do?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Stone Impaction and Biliary Obstruction
  rationale: >-
    The edge into the impaction node is marked indirect for this reason: stone
    formation is well understood, but the transition from silent stones to
    biliary pain and obstruction is not. The natural-history review states
    plainly that it is not clear who will develop symptoms, and the only
    recognised predictors are diabetes and detection at laparotomy. The
    question is not academic, because the whole case for expectant management
    of incidental stones rests on the base rate rather than on any ability to
    identify the minority at risk.
  evidence:

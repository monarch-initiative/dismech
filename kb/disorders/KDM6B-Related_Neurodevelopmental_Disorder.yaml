animal_models:
- name: Kdm6b heterozygous mouse
  species: Mus musculus
  genotype: Kdm6b heterozygous (one allele deleted)
  category: knockout mouse model
  description: >-
    Deletion of one Kdm6b allele in mice, matching the human heterozygous
    dosage, produces autistic-like impaired sociability and object recognition
    memory plus ADHD-like hyperactivity and impulsivity that respond to
    methylphenidate.
  genes:
  - preferred_term: KDM6B
    term:
      id: hgnc:29012
      label: KDM6B
  publication: PMID:35711692
  modeled_mechanisms:
  - target: KDM6B Haploinsufficiency and Catalytic Impairment
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Recapitulates the human heterozygous loss-of-function dosage state.
    limitations: >-
      A whole-gene allele deletion rather than the point and in-frame variants
      that account for many human cases, and mouse behavior is only a proxy for
      the human cognitive phenotype.
  - target: Neurodevelopmental and Behavioral Phenotype
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the autism- and ADHD-like behavioral output of the mechanism.
    limitations: >-
      Does not address the dysmorphic, skeletal, or psychiatric (psychosis) arms
      of the human phenotype.
  evidence:
  - reference: PMID:35711692

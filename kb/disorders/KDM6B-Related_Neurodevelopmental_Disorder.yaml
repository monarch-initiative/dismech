      approach by a multidisciplinary team
    explanation: >-
      Explicit clinical recommendation for multidisciplinary management of
      KDM6B-related disease. The quote is trimmed to the last complete word
      before the cached abstract itself is truncated.
- name: Genetic counseling
  description: >-
    Counseling covers the autosomal dominant, predominantly de novo mechanism,
    the low but non-zero sibling recurrence risk from parental germline
    mosaicism, the possibility of a mildly affected transmitting parent, and the
    wide variability of the phenotype. Establishing the molecular diagnosis also
    resolves the differential with lysosomal storage and overgrowth
    chromatinopathies.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:38326731
    reference_title: "Cerebellar heterotopia in an 11-year-old child with KDM6B-related\
      \ neurodevelopmental disorder: A case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These findings expand the phenotypic spectrum of this syndrome,
      highlighting the potential role for KDM6B in cerebellar development and
      providing valuable insights for genetic counseling.
    explanation: >-
      The clinical literature frames phenotype delineation in this disorder as
      directly serving genetic counseling.
- name: Stimulant pharmacotherapy for ADHD symptoms
  description: >-
    Standard ADHD pharmacotherapy is used symptomatically when attention deficit
    and hyperactivity are impairing. Direct human trial evidence in KDM6B-related
    NDD is absent; the mechanistic rationale is supported by rescue of
    hyperactivity and impulsivity by methylphenidate in the heterozygous Kdm6b
    mouse. This is preclinical support only and must not be read as
    disease-specific efficacy evidence.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: methylphenidate
      term:
        id: CHEBI:6887
        label: methylphenidate
  target_phenotypes:
  - preferred_term: Attention deficit hyperactivity disorder
    term:
      id: HP:0007018
      label: Attention deficit hyperactivity disorder
  evidence:
  - reference: PMID:35711692
    reference_title: Kdm6b Haploinsufficiency Causes ASD/ADHD-Like Behavioral Deficits
      in Mice.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In addition, the mutant mice display markedly increased locomotor activity
      and impulsivity, two ADHD-like behavioral traits that are ameliorated by
      methylphenidate treatment.
    explanation: >-
      Model-organism evidence of methylphenidate response in Kdm6b
      haploinsufficiency; PARTIAL because no human treatment study exists for
      this disorder.

- hypothesis_group_id: patterning_hox_dysmorphology
  hypothesis_label: HOX/Polycomb mis-regulation as the route to the dysmorphic and
    distal skeletal minority phenotype
  status: EMERGING
  description: >-
    The coarse facies and mild distal skeletal anomalies that gave the disorder
    its OMIM name are hypothesised to arise from failure of KDM6B-dependent
    de-repression of HOX and related patterning loci during craniofacial and
    limb development. Supporting evidence is indirect (H3K27me3 control of Hox
    genes; hox mis-regulation and posterior developmental defects after
    inhibition of the KDM6 paralogue UTX in zebrafish). No human KDM6B
    craniofacial or limb developmental study has tested this directly, and the
    features are uncommon in the largest cohort.
  evidence:
  - reference: PMID:17851529
    reference_title: A histone H3 lysine 27 demethylase regulates animal posterior
      development.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Importantly, morpholino oligonucleotide inhibition of a zebrafish UTX
      homologue resulted in mis-regulation of hox genes and a striking posterior
      developmental defect
    explanation: >-
      Establishes an evolutionarily conserved developmental-patterning role for
      the KDM6 demethylase family, the premise of this hypothesis.

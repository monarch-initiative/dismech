- name: Altered Synaptic Transmission and Plasticity
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >
    Beyond its developmental role, KDM6B loss perturbs mature circuit function.
    Mosaic brain knockout of KDM6B in mice reduces NMDA receptor-mediated
    excitatory synaptic transmission and plasticity in the hippocampus,
    providing a cellular substrate for the cognitive and behavioral phenotype.
    This node is marked provisional because the evidence is currently from
    rodent and fly models rather than from human tissue.

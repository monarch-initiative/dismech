    term:
      id: GO:0030182
      label: neuron differentiation
    modifier: ABNORMAL
  downstream:
  - target: Neurodevelopmental and Behavioral Phenotype
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of the hippocampal neural stem cell reserve is accompanied by
      defective hippocampal-dependent behavior in the mouse, offering a
      substrate for the cognitive phenotype that is separate from the synaptic
      one.
  evidence:
  - reference: DOI:10.1101/2024.02.20.581302

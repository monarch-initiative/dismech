discussions:
- discussion_id: kdm6b_commitment_direction_paradox
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Does KDM6B loss block neural differentiation or accelerate it? Both are
    reported, and the reconciliation determines which cellular node actually
    drives the human cognitive phenotype.
  attaches_to:
  - pathophysiology#Impaired Neural Commitment and Neurogenesis
  - pathophysiology#Precocious Neural Stem Cell Differentiation and Pool Depletion
  rationale: >-
    Human embryonic stem cell-derived progenitors lacking KDM6 enzymes fail to
    differentiate into neurons and glia, and Jmjd3 deletion in subventricular
    zone neural stem cells impairs neuronal differentiation. In the hippocampal
    dentate gyrus, by contrast, Kdm6b deletion causes precocious neuronal
    differentiation that exhausts the stem cell pool. These are opposite
    directions of effect on the same cell-fate decision. Plausible
    reconciliations include regional specialisation (dentate gyrus versus
    subventricular zone and cortex), developmental timing, differing degrees of
    KDM6A compensation, or partial versus complete loss of KDM6 activity; the
    entry currently models both as separate nodes rather than forcing one.
    A further open strand is whether some of KDM6B's requirement is
    catalytic-independent, which would mean H3K27me3 demethylase activity alone
    does not account for the disorder; the abstracts available here do not
    settle that.
  proposed_experiments:
  - experiment_id: exp_kdm6b_region_matched_deletion_comparison
    name: Region-matched conditional Kdm6b deletion comparison
    description: >-
      Delete Kdm6b at matched developmental timepoints in dentate gyrus,
      subventricular zone, and cortical progenitors in the same study and score
      differentiation direction with common markers, to test whether the
      discrepancy is regional or methodological.
  - experiment_id: exp_kdm6b_catalytic_dead_rescue
    name: Catalytically dead KDM6B rescue
    description: >-
      Rescue KDM6B-null human neural progenitors with wild-type versus
      catalytically dead KDM6B and compare differentiation, proliferation, and
      H3K27me3 landscape, to quantify how much of the requirement is
      demethylase-dependent.
  evidence:
  - reference: DOI:10.1101/2024.02.20.581302
    reference_title: Chromatin regulator Kdm6b is required for the establishment
      and maintenance of neural stem cells in mouse hippocampus
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      causes precocious neuronal differentiation, and the NSC population fails
      to become established in the postnatal DG.
    explanation: >-
      The precocious-differentiation arm of the paradox.
  - reference: PMID:31959746
    reference_title: JMJD3 and UTX determine fidelity and lineage specification of
      human neural progenitor cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, KDM6-deficient NPCs exhibit poor proliferation and a failure to
      differentiate into neurons and glia.
    explanation: >-
      The differentiation-block arm of the paradox, in human cells.
- discussion_id: kdm6b_uncacheable_cohort_frequencies
  kind: CURATION_TODO
  status: OPEN
  prompt: >-
    Can the per-feature frequencies from the Rots et al. 2023 cohort be brought
    into this entry as snippet-verified evidence, so that FrequencyEnum bands
    can be assigned?
  attaches_to:
  - phenotypes#Hypotonia
  - phenotypes#Psychosis
  - phenotypes#Feeding difficulties
  - phenotypes#Coarse facial features
  rationale: >-
    PMID:37196654 is the definitive 85-individual cohort and its tables carry
    denominators for every recurrent manifestation, including several that this
    entry curates without a frequency band and at least two that it cannot
    curate at all. The publisher blocks full-text download, so `just
    fetch-reference PMID:37196654` yields an abstract-only cache, and
    PMC10257005 is not fetchable through the current reference sources. Per the
    project rule that snippets must be exact quotes from the cached reference,
    those numbers cannot be used here yet, and this entry deliberately leaves
    the bands off rather than transcribing figures it cannot verify.

    Two manifestations are consequently absent from `phenotypes` rather than
    merely unbanded, because no cacheable source documents them in this
    disorder: sleep disturbance (recorded only as a bare table row in the
    PMID:31124279 full text) and macrocephaly or postnatal overgrowth (no
    narrative statement in any cached source; the founding series reports only
    individual head-circumference centiles in a table). The overgrowth question
    matters disproportionately, because it is the phenotypic hinge against the
    Weaver, Sotos, and Cohen-Gibson differentials that this entry lists: if a
    substantial minority of KDM6B patients are macrocephalic, the clean
    "eraser loss gives no overgrowth" contrast drawn in those differentials
    needs qualifying.
  proposed_experiments:
  - experiment_id: exp_kdm6b_cohort_fulltext_ingest
    name: Ingest the Rots 2023 cohort tables through a cacheable route
    description: >-
      Obtain the cohort frequency tables through a source the reference
      validator can cache (author-deposited accepted manuscript, a PMC route
      once available, or supplementary data with a citable identifier), then
      assign FrequencyEnum bands to hypotonia, psychosis, feeding difficulty,
      autism, intellectual disability, and the skeletal features, and add
      macrocephaly and sleep disturbance as phenotypes.
- discussion_id: kdm6b_omim_name_mismatch
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Should the OMIM and MONDO label "neurodevelopmental disorder with coarse
    facies and mild distal skeletal abnormalities" be retired in favour of a
    gene-anchored name, given that the two features in the name are uncommon?
  attaches_to:
  - pathophysiology#Disrupted Craniofacial and Distal Skeletal Patterning
  rationale: >-
    The syndrome name derives from a 12-patient ascertainment series. The
    85-individual cohort found coarse facies and distal skeletal anomalies to be
    rare while hypotonia and psychosis are unexpectedly common, and stated
    explicitly that the OMIM description is inaccurate and potentially
    misleading. Retaining the name risks misdirecting clinical suspicion away
    from patients who lack dysmorphism. This entry uses the gene-anchored name
    while preserving MONDO:0032790 and the OMIM label as synonyms.
  evidence:
  - reference: PMID:37196654
    reference_title: The clinical and molecular spectrum of the KDM6B-related neurodevelopmental
      disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, by examining the molecular and clinical spectrum of 85 reported
      individuals with mostly de novo (likely) pathogenic KDM6B variants, we
      demonstrate that this description is inaccurate and potentially
      misleading.
    explanation: >-
      Direct source of the naming controversy recorded here.
- discussion_id: kdm6b_dysmorphology_mechanism_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what mechanism does reduced KDM6B activity produce coarse facies and mild
    distal skeletal anomalies in the minority of patients who have them?
  attaches_to:
  - pathophysiology#Disrupted Craniofacial and Distal Skeletal Patterning
  rationale: >-
    The neural arm of the mechanism is well supported by human stem cell, mouse,
    and fly data, but no study has connected KDM6B loss to human craniofacial or
    limb patterning. The HOX/Polycomb route is inferred from work on the
    paralogue UTX in zebrafish. Whether the dysmorphic minority reflects a
    distinct variant class, a modifier, or simply ascertainment bias is unknown.
  proposed_experiments:
  - experiment_id: exp_kdm6b_genotype_dysmorphology_stratification
    name: Genotype-stratified dysmorphology analysis of the published cohort
    description: >-
      Test within the 85-individual cohort whether coarse facies and distal
      skeletal features segregate with catalytic-domain missense variants versus
      truncating variants, or are distributed at random with respect to variant
      class.
  - experiment_id: exp_kdm6b_neural_crest_limb_differentiation
    name: KDM6B-null neural crest and limb bud differentiation with chromatin profiling
    description: >-
      Differentiate KDM6B-null human induced pluripotent stem cells along neural
      crest and limb bud trajectories and profile H3K27me3 and chromatin
      accessibility at HOX clusters to test the patterning hypothesis directly in
      human cells.
  - experiment_id: exp_kdm6b_episignature_stratified
    name: DNA methylation episignature stratified by dysmorphism
    description: >-
      Derive a peripheral-blood DNA methylation episignature in KDM6B variant
      carriers and test whether carriers with and without dysmorphism separate,
      which would indicate a distinct molecular subgroup.
- discussion_id: kdm6b_psychosis_frequency
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the true prevalence, age-of-onset distribution, and natural history
    of psychosis in KDM6B-related neurodevelopmental disorder?
  attaches_to:
  - phenotypes#Psychosis
  rationale: >-
    Psychosis is one of the most clinically actionable features of this disorder,
    yet the available published characterisations are qualitative and not
    obviously concordant: OMIM records psychosis in a small percentage of
    individuals over age 12, while the largest cohort lists it among features
    that are unexpectedly common. The cohort denominator for individuals aged 12
    or older is small. No frequency band can responsibly be assigned from the
    retrievable abstracts, so none is asserted on the phenotype record.
  proposed_experiments:
  - experiment_id: exp_kdm6b_prospective_psychiatric_followup
    name: Prospective psychiatric follow-up of the published cohort
    description: >-
      Follow cohort members prospectively from age 10 with standardised psychosis
      screening instruments to establish incidence and age of onset rather than
      cross-sectional prevalence in an ascertainment-enriched sample.
  - experiment_id: exp_kdm6b_age_stratified_reanalysis
    name: Age-stratified reanalysis of the 85-individual cohort
    description: >-
      Re-report psychiatric outcomes with explicit age-stratified denominators so
      that a defensible FrequencyEnum band can be assigned.
- discussion_id: kdm6b_mouse_human_dysmorphology_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Do the available Kdm6b mouse models reproduce the non-neural (craniofacial
    and distal skeletal) arm of the human phenotype, or only the behavioral arm?
  attaches_to:
  - pathophysiology#Disrupted Craniofacial and Distal Skeletal Patterning
  rationale: >-
    The heterozygous and mosaic-brain-knockout mouse models are reported in terms
    of sociability, memory, hyperactivity, impulsivity, and hippocampal synaptic
    physiology. The mosaic model is brain-restricted by construction and cannot
    address craniofacial or limb development at all. Evidence therefore exists in
    a model system but its fidelity to the dysmorphic component of the human
    disorder is untested rather than absent, which is the defining situation for
    a HUMAN_MODEL_MISMATCH rather than a plain knowledge gap.
  proposed_experiments:
  - experiment_id: exp_kdm6b_het_mouse_craniofacial_morphometry
    name: Craniofacial and skeletal morphometry of Kdm6b heterozygous mice
    description: >-
      Perform skeletal preparations and micro-CT craniofacial morphometry on
      constitutive Kdm6b heterozygous mice against wild-type littermates to test
      whether the dysmorphic arm of the human phenotype is modelled at all.
  - experiment_id: exp_kdm6b_lineage_conditional_deletion
    name: Lineage-restricted conditional Kdm6b deletion
    description: >-
      Delete Kdm6b conditionally in neural crest and limb bud lineages to test
      tissue-autonomous requirements for craniofacial and distal limb
      patterning.
  evidence:
  - reference: PMID:39223259
    reference_title: Impact of KDM6B mosaic brain knockout on synaptic function and
      behavior.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we show the impact of KDM6B mosaic brain knockout on the manifestation
      of different autistic-like phenotypes including repetitive behaviors,
      social interaction, and significant cognitive deficits.
    explanation: >-
      Illustrates that the available mouse characterisation is brain- and
      behavior-focused, leaving the dysmorphic arm of the human phenotype
      unmodelled.

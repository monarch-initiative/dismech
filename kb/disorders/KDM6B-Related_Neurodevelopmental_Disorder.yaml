  preferred_term: KDM6B-related neurodevelopmental disorder
  description: >-
    Chromatinopathy caused by heterozygous KDM6B (H3K27 demethylase) variants;
    the OMIM/MONDO label is "neurodevelopmental disorder with coarse facies and
    mild distal skeletal abnormalities".
  term:

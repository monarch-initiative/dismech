name: KDM6B-Related Neurodevelopmental Disorder
creation_date: "2026-08-15T00:00:00Z"
category: Mendelian
synonyms:
- neurodevelopmental disorder with coarse facies and mild distal skeletal abnormalities
- NEDCFSA
- Stolerman syndrome
- Stolerman neurodevelopmental syndrome
- KDM6B-related NDD
description: >
  KDM6B-related neurodevelopmental disorder is a rare, predominantly de novo
  autosomal dominant chromatinopathy caused by heterozygous loss-of-function or
  enzymatically disruptive variants in KDM6B (JMJD3), which encodes one of the
  two mammalian histone H3 lysine 27 (H3K27) di-/tri-demethylases. KDM6B
  removes the repressive H3K27me2/me3 mark deposited by Polycomb repressive
  complex 2 (PRC2, catalytic subunit EZH2), and thereby licenses timely
  de-repression of lineage-specifying genes during neural commitment,
  neurogenesis, and synaptic maturation. Reduced KDM6B dosage or catalytic
  activity leaves developmental loci trapped in a Polycomb-repressed,
  chromatin-inaccessible state, producing a broad neurodevelopmental and
  behavioral phenotype.

  The entity is indexed in OMIM (618505) and MONDO (MONDO:0032790) as
  "neurodevelopmental disorder with coarse facies and mild distal skeletal
  abnormalities" (NEDCFSA), a name derived from the original 12-patient series
  of Stolerman et al. (2019). The definitive 85-individual cohort of Rots et al.
  (2023) showed that this name is inaccurate and potentially misleading: coarse
  facies and distal skeletal anomalies are in fact uncommon, whereas cognitive
  deficits are near-universal and hypotonia and psychosis are unexpectedly
  frequent. This entry therefore uses the gene-anchored clinical name
  "KDM6B-related neurodevelopmental disorder" while retaining MONDO:0032790 and
  the OMIM-derived label as synonyms.

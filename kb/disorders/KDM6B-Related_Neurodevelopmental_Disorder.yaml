diagnosis:
- name: Molecular diagnosis by exome or genome sequencing
  description: >-
    Because the dysmorphism is mild and non-pathognomonic and there is no
    recognisable facial gestalt, the diagnosis is made molecularly rather than
    clinically: exome or genome sequencing, or a neurodevelopmental gene panel
    that includes KDM6B, with parental testing to establish de novo status.
    Variant interpretation should be domain-aware, since missense variants
    outside the JmjC catalytic and Zn-containing domains may be benign.
  evidence:
  - reference: PMID:31124279
    reference_title: Genetic variants in the KDM6B gene are associated with neurodevelopmental
      delays and dysmorphic features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified a number of de novo alterations in the KDM6B gene via
      whole exome sequencing (WES) in a cohort of 12 unrelated patients with
      developmental delay, intellectual disability, dysmorphic facial features,
      and other clinical findings.
    explanation: >-
      Exome sequencing is the ascertainment route by which this disorder is
      identified.
  - reference: PMID:37196654
    reference_title: The clinical and molecular spectrum of the KDM6B-related neurodevelopmental
      disorder.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we accurately define the broad clinical spectrum of the KDM6B-related NDD,
      introduce an innovative functional testing paradigm for the assessment of
      KDM6B variants
    explanation: >-
      Establishes a functional testing paradigm as an adjunct to sequence-based
      variant interpretation in this disorder.
differential_diagnoses:
- name: Weaver syndrome
  disease_term:
    preferred_term: Weaver syndrome
    term:
      id: MONDO:0010193
      label: Weaver syndrome
  description: >-
    EZH2-related overgrowth and intellectual disability syndrome. EZH2 is the
    catalytic subunit of PRC2 and writes the very H3K27me3 mark that KDM6B
    erases, so Weaver syndrome and KDM6B-related NDD are opposite perturbations
    of the same H3K27 methylation switch. The contrast is worth stating
    explicitly: the same chromatin axis produces an overgrowth syndrome when the
    writer is overactive and a non-overgrowth neurobehavioral syndrome when the
    eraser is lost.
  distinguishing_features:
  - Weaver syndrome features pre- and postnatal overgrowth with advanced bone age
    and a distinctive facial appearance, which are not part of the core
    KDM6B-related NDD presentation.
  - KDM6B-related NDD is dominated by cognitive, behavioral, and psychiatric
    features with mild, non-gestalt dysmorphism.
  - Molecular testing distinguishes them unambiguously (EZH2 versus KDM6B).
  evidence:
  - reference: PMID:38015625
    reference_title: "A mouse model of Weaver syndrome displays overgrowth and\
      \ excess osteogenesis reversible with KDM6A/6B inhibition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Weaver syndrome is a Mendelian disorder of the epigenetic machinery (MDEM)
      caused by germline pathogenic variants in EZH2, which encodes the
      predominant H3K27 methyltransferase and key enzymatic component of
      Polycomb repressive complex 2 (PRC2). Weaver syndrome is characterized by
      striking overgrowth and advanced bone age, intellectual disability, and
      distinctive facies.
    explanation: >-
      Defines Weaver syndrome as the EZH2 (H3K27 writer) counterpart disorder and
      names the overgrowth and advanced bone age that distinguish it from
      KDM6B-related NDD.
  - reference: PMID:38015625
    reference_title: "A mouse model of Weaver syndrome displays overgrowth and\
      \ excess osteogenesis reversible with KDM6A/6B inhibition."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Inhibition of the opposing H3K27 demethylases KDM6A and KDM6B
      substantially reversed the excessive osteogenesis in Ezh2R684C/+ cells
      both at the transcriptional and phenotypic levels.
    explanation: >-
      Direct experimental demonstration that KDM6B opposes the EZH2 Weaver
      variant on the same H3K27 axis, which is exactly the writer/eraser
      contrast this differential rests on.
- name: Sotos syndrome
  disease_term:
    preferred_term: Sotos syndrome
    term:
      id: MONDO:0019349
      label: Sotos syndrome
  description: >-
    NSD1-related overgrowth syndrome, the principal clinical mimic of Weaver
    syndrome and part of the same histone-methylation-machinery differential.
  distinguishing_features:
  - Overgrowth with macrocephaly, advanced bone age, and a characteristic facial
    gestalt.
  - Caused by NSD1 haploinsufficiency (an H3K36 methyltransferase) rather than a
    KDM6 or PRC2 lesion.
- name: Cohen-Gibson syndrome
  disease_term:
    preferred_term: Cohen-Gibson syndrome
    term:
      id: MONDO:0060510
      label: Cohen-Gibson syndrome
  description: >-
    EED-related overgrowth syndrome. EED is a core non-catalytic PRC2 subunit,
    making this a further PRC2-axis differential for a suspected H3K27
    chromatinopathy.
  distinguishing_features:
  - Weaver-like overgrowth with advanced bone age, contrasting with the absence
    of an overgrowth-defined presentation in KDM6B-related NDD.
- name: Kabuki syndrome
  disease_term:
    preferred_term: Kabuki syndrome
    term:
      id: MONDO:0016512
      label: Kabuki syndrome
  description: >-
    Chromatinopathy caused by KMT2D or KDM6A variants. KDM6A (UTX) is the direct
    paralogue of KDM6B and the other mammalian H3K27me2/me3 demethylase, so
    Kabuki syndrome is the closest mechanistic neighbour of this disorder.
  distinguishing_features:
  - Kabuki syndrome has a recognisable facial gestalt (long palpebral fissures
    with eversion of the lateral third of the lower lid), persistent fetal
    fingertip pads, cleft palate, congenital heart disease, and immune
    deficiency.
  - KDM6B-related NDD has no recognisable gestalt and is identified molecularly.
  evidence:
  - reference: PMID:18003914
    reference_title: Identification of JmjC domain-containing UTX and JMJD3 as histone
      H3 lysine 27 demethylases.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we show the JmjC domain-containing protein UTX (ubiquitously
      transcribed tetratricopeptide repeat, X chromosome), as well as the
      related JMJD3 (jumonji domain containing 3), specifically removes methyl
      marks on H3K27 in vitro.
    explanation: >-
      Establishes UTX/KDM6A and JMJD3/KDM6B as the paralogous H3K27 demethylase
      pair, the basis for pairing Kabuki syndrome with this disorder.
- name: Mucopolysaccharidosis
  description: >-
    Coarse facial features in an infant or young child with developmental delay
    commonly prompt a first-line evaluation for a lysosomal storage disorder, and
    this happened in at least one patient in the founding KDM6B series.
  distinguishing_features:
  - Mucopolysaccharidoses show progressive coarsening with organomegaly,
    dysostosis multiplex, and corneal clouding.
  - Abnormal urinary glycosaminoglycans or deficient lysosomal enzyme activity
    confirm a storage disorder; KDM6B-related NDD has normal lysosomal
    biochemistry and non-progressive dysmorphism.
treatments:
- name: Multidisciplinary developmental and supportive care
  description: >-
    No disease-modifying therapy exists. Management is supportive and
    anticipatory: early intervention with physical, occupational, and speech
    therapy for developmental delay and hypotonia, educational support for
    learning difficulties, and coordinated follow-up across genetics, neurology,
    and psychiatry. Psychiatric surveillance from adolescence is warranted given
    the reported psychosis risk.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:

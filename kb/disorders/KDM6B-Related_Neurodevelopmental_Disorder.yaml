notes: >-
  No GeneReviews chapter exists for KDM6B or for NEDCFSA as of this curation
  (PubMed searches for "KDM6B GeneReviews" returned no records), so the
  Rots et al. 2023 AJHG cohort (PMID:37196654) serves as the phenotype baseline
  in its place. Only the abstract of that paper is retrievable into the
  reference cache (the publisher blocks full-text download), so the per-feature
  cohort percentages reported in its tables cannot be quoted as evidence
  snippets here; frequency bands are therefore asserted only where the abstract
  itself is quantitative, per docs/frequency-evidence-guidelines.md. A 2025
  erratum to that paper is indexed as PMID:41110445; its cached record carries
  no retrievable content and it is not used as an evidence source.

  Reference-cache scoping: several caches in this PR were fetched during the
  Falcon deep-research reference-validation pass and are deliberately not cited.
  PMID:39767643 reports a bi-allelic KDM6B variant in a consanguineous family,
  which is inconsistent with the established heterozygous dominant mechanism and
  is therefore not used to support any claim here. PMID:41110445 is the
  content-free erratum record. The remaining DOI caches
  (DOI:10.1002/ajmg.a.61173 is the DOI-keyed duplicate of PMID:31124279;
  DOI:10.1016/j.conb.2019.02.009, DOI:10.1016/j.gim.2022.09.006,
  DOI:10.1038/s41598-024-70728-5 and DOI:10.54195/9789493296831) are general
  chromatin or chromatinopathy background rather than KDM6B-specific sources,
  and the entry cites primary KDM6B literature in their place.
  DOI:10.1101/2024.02.20.581302 (Gil et al., bioRxiv preprint) IS cited, on the
  Precocious Neural Stem Cell Differentiation and Pool Depletion node.
prevalence:
- population: Worldwide, individuals ascertained by exome or genome sequencing
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population-based prevalence estimate exists. The largest published series
    assembled 85 individuals worldwide through international collaboration, an
    order of magnitude that supports an ultra-rare classification.
  evidence:
  - reference: PMID:37196654
    reference_title: The clinical and molecular spectrum of the KDM6B-related neurodevelopmental
      disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, by examining the molecular and clinical spectrum of 85 reported
      individuals with mostly de novo (likely) pathogenic KDM6B variants, we
      demonstrate that this description is inaccurate and potentially
      misleading.
    explanation: >-
      Establishes the total published cohort size (85 individuals worldwide),
      the basis for the ultra-rare prevalence class.
inheritance:
- name: Autosomal dominant, predominantly de novo
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  de_novo_rate: >-
    Most reported pathogenic KDM6B variants have arisen de novo. The original
    12-patient series consisted entirely of de novo alterations, and the
    85-individual cohort is described as carrying mostly de novo (likely)
    pathogenic variants, with a minority inherited from a mildly affected or
    apparently unaffected parent.
  expressivity: VARIABLE
  description: >-
    Heterozygous KDM6B variants act in a dominant, dosage-sensitive manner.
    Expressivity is highly variable: cognitive involvement is consistent, but the
    severity of intellectual impairment and the presence of behavioral,
    psychiatric, dysmorphic, and skeletal features differ widely between
    individuals carrying comparable variants. Because the great majority of
    variants are de novo, recurrence risk for the siblings of a proband with a
    confirmed de novo variant is low, with residual risk from parental germline
    mosaicism. Inheritance from a mildly affected or apparently unaffected parent
    is documented and implies incomplete penetrance or highly variable
    expressivity in a minority of families.
  evidence:
  - reference: PMID:37196654
    reference_title: The clinical and molecular spectrum of the KDM6B-related neurodevelopmental
      disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      85 reported individuals with mostly de novo (likely) pathogenic KDM6B
      variants
    explanation: >-
      Establishes that pathogenic KDM6B variants are mostly de novo in the
      definitive cohort.
  - reference: PMID:37196654
    reference_title: The clinical and molecular spectrum of the KDM6B-related neurodevelopmental
      disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cognitive deficits are seen consistently in all individuals, but the
      overall phenotype is highly variable.
    explanation: >-
      Directly supports the VARIABLE expressivity assignment.
  - reference: PMID:31124279
    reference_title: Genetic variants in the KDM6B gene are associated with neurodevelopmental
      delays and dysmorphic features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified a number of de novo alterations in the KDM6B gene via
      whole exome sequencing (WES) in a cohort of 12 unrelated patients with
      developmental delay, intellectual disability, dysmorphic facial features,
      and other clinical findings.
    explanation: >-
      The founding case series established that the causal KDM6B alterations
      arise de novo.
genetic:
- name: KDM6B
  gene_term:
    preferred_term: KDM6B
    term:
      id: hgnc:29012
      label: KDM6B
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  features: >-
    Pathogenic alleles include nonsense, frameshift, and splice variants
    distributed across the gene (consistent with haploinsufficiency) as well as
    missense and in-frame indel variants clustered in or near the catalytic JmjC
    domain and the Zn-containing domain required for cofactor binding and
    protein stability.
  notes: >-
    KDM6B (lysine demethylase 6B, also known as JMJD3) encodes a JmjC
    domain-containing histone H3K27me2/me3 demethylase at 17p13.1. Inheritance
    is autosomal dominant with the great majority of variants arising de novo;
    see the disease-level inheritance block.
  evidence:
  - reference: PMID:31124279
    reference_title: Genetic variants in the KDM6B gene are associated with neurodevelopmental
      delays and dysmorphic features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The KDM6B protein consists of the JmjC catalytic domain and C-terminal
      helix and zinc motifs which are important in cofactor binding and protein
      stability
    explanation: >-
      Defines the functional domain architecture in which the disease-associated
      missense and in-frame variants cluster.
  - reference: PMID:31124279
    reference_title: Genetic variants in the KDM6B gene are associated with neurodevelopmental
      delays and dysmorphic features.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      indicating that haploinsufficiency of the KDM6B gene is not tolerated
    explanation: >-
      Population-constraint evidence (gnomAD observed/expected loss-of-function
      score) that KDM6B is dosage sensitive, the premise of the
      haploinsufficiency mechanism. Tagged COMPUTATIONAL because the claim comes
      from a population-database constraint metric rather than a patient
      observation.
  - reference: PMID:37196654
    reference_title: The clinical and molecular spectrum of the KDM6B-related neurodevelopmental
      disorder.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Using 3D protein structure analysis and an innovative dual Drosophila
      gain-of-function assay, we demonstrated a disruptive effect of 11
      missense/in-frame indels located in or near the enzymatic JmJC or
      Zn-containing domain of KDM6B.
    explanation: >-
      Functional assay evidence that disease-associated missense/in-frame
      variants in the catalytic and zinc-binding regions are damaging. Tagged
      MODEL_ORGANISM because the assay is a whole-organism Drosophila
      gain-of-function experiment; the same sentence also reports a
      computational 3D structure analysis, which is not separately curated here.

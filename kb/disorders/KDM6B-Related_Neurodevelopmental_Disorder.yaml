- name: Precocious Neural Stem Cell Differentiation and Pool Depletion
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >
    A second, direction-opposite consequence of KDM6B loss in the neural stem
    cell compartment. In the mouse hippocampal dentate gyrus, KDM6B is required
    to establish and maintain the neural stem cell pool: conditional deletion in
    embryonic dentate gyrus precursors causes precocious neuronal
    differentiation so that the stem cell population never becomes established,
    leaving the adult hippocampus essentially devoid of neural stem cells, with
    defective hippocampal-dependent behavior. Deletion in adult dentate gyrus
    neural stem cells likewise induces early differentiation and failure of pool
    maintenance.

    This is deliberately modeled as a node distinct from "Impaired Neural
    Commitment and Neurogenesis": that node captures a differentiation block
    (progenitors fail to become neurons), whereas this one captures premature
    differentiation that exhausts the progenitor reserve. Both are reported for
    KDM6B loss in different compartments and developmental windows, and
    reconciling them is an open question recorded in the
    kdm6b_commitment_direction_paradox discussion. The node is PROVISIONAL
    because the supporting study is a mouse preprint.
  cell_types:
  - preferred_term: neural stem cell
    term:
      id: CL:0000047
      label: neural stem cell
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020

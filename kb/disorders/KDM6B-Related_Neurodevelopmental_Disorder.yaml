- name: KDM6B catalytic-domain missense and in-frame indel variants
  gene:
    preferred_term: KDM6B
    term:
      id: hgnc:29012
      label: KDM6B
  type: Missense / in-frame indel
  clinical_significance: PATHOGENIC
  description: >-
    Missense substitutions and in-frame insertions or deletions located in or
    near the JmjC catalytic domain or the Zn-containing domain. Eleven such
    variants were shown to be functionally disruptive using 3D protein structure
    analysis combined with a dual Drosophila gain-of-function assay.
  evidence:
  - reference: PMID:37196654
    reference_title: The clinical and molecular spectrum of the KDM6B-related neurodevelopmental
      disorder.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we demonstrated a disruptive effect of 11 missense/in-frame indels located
      in or near the enzymatic JmJC or Zn-containing domain of KDM6B
    explanation: >-
      Direct functional demonstration that these non-truncating alleles impair
      KDM6B function.
- name: Copy-number deletions encompassing KDM6B
  gene:
    preferred_term: KDM6B
    term:
      id: hgnc:29012
      label: KDM6B
  type: Copy number loss
  clinical_significance: UNCERTAIN_SIGNIFICANCE
  description: >-
    Chromosomal microarray has identified 17p13.1 deletions that encompass
    KDM6B in individuals with overlapping features (developmental delay,
    intellectual disability, speech delay). These are curated as a separate,
    weaker variant class rather than as established pathogenic alleles, because
    every reported deletion also removes neighbouring genes, so the phenotype
    cannot be attributed to KDM6B alone. Chromosomal microarray therefore
    remains appropriate when a copy-number disorder is suspected, but a deletion
    finding does not by itself establish this diagnosis.
  evidence:
  - reference: PMID:31124279
    reference_title: Genetic variants in the KDM6B gene are associated with neurodevelopmental
      delays and dysmorphic features.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, it is important to note that all seven of these deletions also
      encompass neighboring genes the effects of which are uncertain.
    explanation: >-
      Directly states the attribution limitation that makes this a PARTIAL,
      uncertain-significance variant class rather than a pathogenic one.
pathophysiology:
- name: KDM6B Haploinsufficiency and Catalytic Impairment
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Epigenetic Machinery Component Haploinsufficiency"
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  role: trigger
  description: >
    Heterozygous de novo truncating variants reduce functional KDM6B dosage,
    while missense and in-frame indel variants in or near the JmjC catalytic
    domain and the zinc-binding motif impair the enzyme's demethylase activity
    or stability. Both routes converge on reduced cellular H3K27me2/me3
    demethylase capacity.
  genes:
  - preferred_term: KDM6B
    term:
      id: hgnc:29012
      label: KDM6B
  molecular_functions:
  - preferred_term: histone H3K27me2/H3K27me3 demethylase activity
    term:
      id: GO:0071558
      label: histone H3K27me2/H3K27me3 demethylase activity
    modifier: DECREASED
  downstream:
  - target: Failure to Remove Repressive H3K27me3
    causal_link_type: DIRECT
    description: >-
      Reduced KDM6B enzyme dosage or catalytic competence directly lowers the
      rate at which H3K27me2/me3 is erased from target loci.
  evidence:
  - reference: PMID:31124279
    reference_title: Genetic variants in the KDM6B gene are associated with neurodevelopmental
      delays and dysmorphic features.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lysine-specific demethylase 6B (KDM6B) demethylates trimethylated
      lysine-27 on histone H3.
    explanation: >-
      Establishes the enzymatic identity of KDM6B whose loss initiates the
      disease mechanism.
  - reference: PMID:37196654
    reference_title: The clinical and molecular spectrum of the KDM6B-related neurodevelopmental
      disorder.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we demonstrated a disruptive effect of 11 missense/in-frame indels located
      in or near the enzymatic JmJC or Zn-containing domain of KDM6B
    explanation: >-
      Shows that non-truncating disease alleles act by disrupting the catalytic
      and cofactor-binding regions, that is, by impairing enzyme function.
- name: Failure to Remove Repressive H3K27me3
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >
    KDM6B (JMJD3) and its paralogue KDM6A (UTX) are the JmjC-domain enzymes that
    specifically remove di- and trimethylation from histone H3 lysine 27. When
    KDM6B activity falls, H3K27me3 accumulates at KDM6B-bound developmental
    loci. In human neural progenitor cells lacking KDM6 enzymes, H3K27me3
    accumulates and DNA accessibility at neural developmental genes is blocked.
  molecular_functions:
  - preferred_term: histone H3K27me2/H3K27me3 demethylase activity
    term:
      id: GO:0071558
      label: histone H3K27me2/H3K27me3 demethylase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: ABNORMAL
  downstream:
  - target: Unopposed PRC2-Mediated Polycomb Repression
    causal_link_type: DIRECT
    description: >-
      Persistent H3K27me3 at developmental loci means PRC2-deposited repression
      is no longer counterbalanced by demethylation.
  evidence:
  - reference: PMID:18003914
    reference_title: Identification of JmjC domain-containing UTX and JMJD3 as histone
      H3 lysine 27 demethylases.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we show the JmjC domain-containing protein UTX (ubiquitously
      transcribed tetratricopeptide repeat, X chromosome), as well as the
      related JMJD3 (jumonji domain containing 3), specifically removes methyl
      marks on H3K27 in vitro.
    explanation: >-
      Identifies JMJD3/KDM6B as an H3K27-specific demethylase, the activity lost
      in this disorder.
  - reference: PMID:18003914
    reference_title: Identification of JmjC domain-containing UTX and JMJD3 as histone
      H3 lysine 27 demethylases.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Finally, overexpression of UTX and JMJD3 leads to reduced di- and
      trimethylation on H3K27 in cells, suggesting that UTX and JMJD3 may
      function as H3K27 demethylases in vivo.
    explanation: >-
      Demonstrates that cellular H3K27me2/me3 levels are set by KDM6 enzyme
      dosage, so reduced dosage raises the repressive mark.
  - reference: PMID:31959746
    reference_title: JMJD3 and UTX determine fidelity and lineage specification of
      human neural progenitor cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mechanistically, both JMJD3 and UTX are found to be enriched in gene loci
      essential for neural development in hNPCs, and KDM6 impairment leads to
      H3K27me3 accumulation and blockade of DNA accessibility at these genes.
    explanation: >-
      Human neural progenitor evidence that loss of KDM6 activity causes
      H3K27me3 accumulation at neurodevelopmental loci.
- name: Unopposed PRC2-Mediated Polycomb Repression
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Permissive-Repressive Chromatin State Imbalance"
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >
    H3K27me3 is deposited by Polycomb repressive complex 2 (PRC2, catalytic
    subunit EZH2) and read by Polycomb repressive complex 1 to enforce
    transcriptional silencing. KDM6B provides the opposing, erasing arm of this
    switch; its enzymatic activity antagonizes Polycomb regulation and resolves
    bivalent promoters at the onset of differentiation. With KDM6B activity
    reduced, developmental promoters and enhancers that should be de-repressed
    remain Polycomb-silenced. This is the mechanistic mirror image of PRC2
    gain-of-function chromatinopathies such as EZH2-related Weaver syndrome, in
    which the writing arm is overactive.
  biological_processes:
  - preferred_term: negative regulation of transcription by RNA polymerase II
    term:
      id: GO:0000122
      label: negative regulation of transcription by RNA polymerase II
    modifier: INCREASED
  - preferred_term: chromatin remodeling
    term:
      id: GO:0006338
      label: chromatin remodeling
    modifier: ABNORMAL
  downstream:
  - target: Dysregulated Neurodevelopmental Gene Expression
    causal_link_type: DIRECT
    description: >-
      Sustained Polycomb repression at lineage-specifying loci prevents their
      timely activation.
  - target: Disrupted Craniofacial and Distal Skeletal Patterning
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - patterning_hox_dysmorphology
    description: >-
      Polycomb and H3K27me3 control of HOX and other patterning loci provides a
      plausible but not directly demonstrated route from KDM6B loss to the
      dysmorphic and distal limb features seen in a minority of patients.
  evidence:
  - reference: PMID:18716661
    reference_title: The histone H3 lysine 27-specific demethylase Jmjd3 is required
      for neural commitment.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our results demonstrate the relevance of an enzymatic activity that
      antagonizes Polycomb regulation
    explanation: >-
      Establishes that Jmjd3/KDM6B acts specifically to antagonize Polycomb
      (PRC2) repression, the activity lost in this disorder.
  - reference: PMID:17851529
    reference_title: A histone H3 lysine 27 demethylase regulates animal posterior
      development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Histone H3K27 trimethylation (H3K27me3) has been linked to
      polycomb-group-protein-mediated suppression of Hox genes and animal body
      patterning, X-chromosome inactivation and possibly maintenance of
      embryonic stem cell (ESC) identity.
    explanation: >-
      Defines the Polycomb-repressive role of the H3K27me3 mark that KDM6B
      normally erases.
  - reference: PMID:17851529
    reference_title: A histone H3 lysine 27 demethylase regulates animal posterior
      development.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      An imbalance of H3K27 methylation owing to overexpression of the methylase
      EZH2 has been implicated in metastatic prostate and aggressive breast
      cancers.
    explanation: >-
      Supports the framing of KDM6B loss and EZH2 gain as opposite perturbations
      of the same H3K27 methylation balance; the cited disease context is
      oncological rather than neurodevelopmental, hence PARTIAL.
  - reference: PMID:38015625
    reference_title: "A mouse model of Weaver syndrome displays overgrowth and\
      \ excess osteogenesis reversible with KDM6A/6B inhibition."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This supports both the ideas that writers and erasers of histone marks
      exist in a fine balance to maintain epigenome state and that epigenetic
      modulating agents have therapeutic potential for the treatment of MDEMs.
    explanation: >-
      States the writer/eraser balance principle directly, and does so in the
      context of a Mendelian disorder of the epigenetic machinery rather than
      cancer, which is the framing this node asserts.
- name: Dysregulated Neurodevelopmental Gene Expression
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Dysregulated Neurodevelopmental Transcriptional Program"
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >
    KDM6B occupies promoters and neural enhancer elements of genes that specify
    neural identity, and its demethylase activity converts these elements from a
    poised or bivalent state to an active one. Loss of KDM6B leaves these
    regulatory elements enriched for H3K27me3 and inaccessible, so the
    transcriptional programme for neural commitment is not executed at the right
    time. The clinical literature describes the same principle as modulation of
    chromatin accessibility by RNA polymerase.
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  - preferred_term: neural stem cell
    term:
      id: CL:0000047
      label: neural stem cell
  biological_processes:
  - preferred_term: positive regulation of transcription by RNA polymerase II
    term:
      id: GO:0045944
      label: positive regulation of transcription by RNA polymerase II
    modifier: DECREASED
  - preferred_term: chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: ABNORMAL
  downstream:
  - target: Impaired Neural Commitment and Neurogenesis
    causal_link_type: DIRECT
    description: >-
      Failure to activate neurogenic regulators blocks progression of
      progenitors into neurons and glia.
  - target: Precocious Neural Stem Cell Differentiation and Pool Depletion
    causal_link_type: DIRECT
    description: >-
      In the hippocampal dentate gyrus the same loss of KDM6B-dependent
      regulation disrupts the transcriptomic signature of neural stem cell
      maintenance, so progenitors differentiate early instead of being held in
      reserve.
  evidence:
  - reference: PMID:25176653
    reference_title: Activation of neuronal gene expression by the JMJD3 demethylase
      is required for postnatal and adult brain neurogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      JMJD3 regulates neurogenic gene expression via interaction at not only
      promoter regions but also neurogenic enhancer elements.
    explanation: >-
      Shows that KDM6B/JMJD3 directly controls the neurodevelopmental
      transcriptional programme at promoters and enhancers.
  - reference: PMID:25176653
    reference_title: Activation of neuronal gene expression by the JMJD3 demethylase
      is required for postnatal and adult brain neurogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In Jmjd3-deleted SVZ cells, I12b remains enriched with H3K27me3 and
      Dlx2-dependent neurogenesis fails.
    explanation: >-
      Direct demonstration that loss of the demethylase leaves a neurogenic
      enhancer H3K27me3-marked and its target gene programme unexecuted.
  - reference: PMID:38326731
    reference_title: "Cerebellar heterotopia in an 11-year-old child with KDM6B-related\
      \ neurodevelopmental disorder: A case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      KDM6B encodes a histone demethylase, expressed in different tissues during
      development, which regulates gene expression through the modulation of
      chromatin accessibility by RNA polymerase.
    explanation: >-
      Clinical-genetics framing of the same chromatin-accessibility mechanism in
      the context of this disorder.
- name: Impaired Neural Commitment and Neurogenesis
  conforms_to: "epigenetic_machinery_neurodevelopmental_dysregulation#Impaired Neuronal Maturation, Plasticity, and Postnatal Neurogenesis"
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >
    KDM6B activity is required for cells to commit to the neural lineage and for
    neural progenitors to proliferate and differentiate into neurons and glia.
    Human embryonic stem cell-derived progenitors lacking KDM6 enzymes still
    form neural progenitors but proliferate poorly and fail to make neurons and
    glia; in mice, deletion of Jmjd3 in subventricular zone neural stem cells
    impairs neuronal differentiation in both the developing and the adult brain.
  cell_types:
  - preferred_term: neural progenitor cell
    term:

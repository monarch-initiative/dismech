- name: Disrupted Craniofacial and Distal Skeletal Patterning
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >
    A minority of affected individuals have coarse facial features and mild
    distal skeletal anomalies (broad hands, syndactyly, clinodactyly). A
    plausible mechanism is loss of KDM6-dependent de-repression of HOX and other
    patterning loci, since H3K27me3 controls Hox gene expression and body
    patterning and inhibition of the KDM6 paralogue UTX in zebrafish causes hox
    mis-regulation with a posterior developmental defect. This route has not
    been demonstrated for KDM6B in human craniofacial or limb development, and
    the 85-individual cohort showed these features to be uncommon, so the node
    is explicitly hypothetical.
  biological_processes:
  - preferred_term: cell fate commitment involved in pattern specification
    term:
      id: GO:0060581
      label: cell fate commitment involved in pattern specification
    modifier: ABNORMAL
  downstream:
  - target: Neurodevelopmental and Behavioral Phenotype
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - patterning_hox_dysmorphology
    description: >-
      Contributes the dysmorphic and distal skeletal component of the composite
      clinical phenotype.
  evidence:
  - reference: PMID:17851529
    reference_title: A histone H3 lysine 27 demethylase regulates animal posterior
      development.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Importantly, morpholino oligonucleotide inhibition of a zebrafish UTX
      homologue resulted in mis-regulation of hox genes and a striking posterior
      developmental defect, which was partially rescued by wild-type, but not by
      catalytically inactive, human UTX.
    explanation: >-
      Model-organism evidence that loss of KDM6-family H3K27 demethylase
      activity mis-regulates hox genes and disturbs body patterning; it concerns
      the paralogue UTX in zebrafish, not KDM6B in human limb or face, hence
      PARTIAL.
  - reference: PMID:37196654
    reference_title: The clinical and molecular spectrum of the KDM6B-related neurodevelopmental
      disorder.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, coarse facies and distal skeletal anomalies, as defined by OMIM,
      are rare in this expanded cohort while other features are unexpectedly
      common (e.g., hypotonia, psychosis, etc.).
    explanation: >-
      Establishes that the dysmorphic and skeletal arm of the phenotype exists
      but is uncommon, justifying the low-confidence, minority-pathway framing of
      this node.

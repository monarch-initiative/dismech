diagnosis:
- name: Clinicopathologic cutaneous melanoma diagnosis
  presence: REQUIRED
  description: >-
    A suspicious cutaneous lesion is evaluated clinically and with dermoscopy,
    then confirmed histopathologically. Molecular subtype assignment follows
    the melanoma diagnosis; a BRAF result alone cannot establish the tissue of
    origin or distinguish melanoma from another BRAF-mutant cancer.
  evidence:
  - reference: PMID:39700658
    reference_title: "European consensus-based interdisciplinary guideline for melanoma. Part 1: Diagnostics - Update 2024."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The diagnosis of melanoma can be made clinically and must always be confirmed by dermoscopy.
    explanation: The guideline directly supports clinical and dermoscopic assessment.
  - reference: PMID:39700658
    reference_title: "European consensus-based interdisciplinary guideline for melanoma. Part 1: Diagnostics - Update 2024."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: If melanoma is suspected, a histopathological examination is always required.
    explanation: The guideline directly requires pathologic confirmation.
- name: Tumor BRAF V600 genotyping
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  presence: REQUIRED_FOR_SUBTYPE_ASSIGNMENT
  description: >-
    A validated DNA assay should identify the exact tumor BRAF allele. Testing
    is especially relevant from stage IIB/C onward and before BRAF/MEK therapy.
    Broad sequencing can also separate V600 class-I disease from class-II or
    class-III non-V600 BRAF melanoma.
  results: Detection of a somatic BRAF codon-600 variant establishes the molecular subtype in confirmed cutaneous melanoma.
  evidence:
  - reference: PMID:39700658
    reference_title: "European consensus-based interdisciplinary guideline for melanoma. Part 1: Diagnostics - Update 2024."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: From stage IIB/C and higher, a mutation test is recommended, especially for the BRAF V600 mutation.
    explanation: The guideline supports stage-appropriate BRAF V600 testing.
  - reference: PMID:22536370
    reference_title: Routine multiplex mutational profiling of melanomas enables enrollment in genotype-driven therapeutic trials.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The test utilizes the SNaPshot method (multiplex PCR, multiplex primer extension, and capillary electrophoresis)
    explanation: The clinical laboratory study validates a multi-allele tumor-genotyping approach.
- name: VE1 immunohistochemistry as a V600E screen
  presence: COMPLEMENTARY
  description: >-
    VE1 staining can rapidly support V600E detection in suitable tissue, but
    imperfect sensitivity and allele specificity mean that it is not a complete
    substitute for molecular BRAF V600 testing.
  results: Positive tumor-cell VE1 staining supports V600E; discordant or clinically consequential negative results require molecular resolution.
  evidence:
  - reference: PMID:28424234
    reference_title: "BRAF V600 mutation detection in melanoma: a comparison of two laboratory testing methods."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The concordance rate between PCR and immunohistochemical BRAF status was 95.1%.
    explanation: The direct method comparison supports complementary screening while leaving room for discordance.
- name: Stage-directed body and brain imaging
  presence: STAGE_DEPENDENT
  description: >-
    From stage IIB/C, cross-sectional body imaging together with brain MRI is
    recommended for staging and surveillance planning. Imaging defines disease
    extent but does not determine BRAF status.
  evidence:
  - reference: PMID:39700658
    reference_title: "European consensus-based interdisciplinary guideline for melanoma. Part 1: Diagnostics - Update 2024."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      From stage IIB/C, whole-body examinations with computed tomography or
      positron emission tomography CT in combination with magnetic resonance
      imaging of the brain are recommended.
    explanation: The guideline directly supplies the stage threshold and imaging combination.

differential_diagnoses:
- name: Non-V600 BRAF-Mutant Cutaneous Melanoma
  description: >-
    These tumors can share the same cutaneous histology but carry class-II or
    class-III BRAF alleles with different dimerization, RAS dependence, kinase
    activity, and expected sensitivity to RAF monomer inhibitors.
  distinguishing_features:
  - Resolve the exact BRAF protein change rather than treating any BRAF mutation as V600 disease.
  - Class-I V600 mutants signal as RAS-independent monomers; class-II mutants signal as dimers and class-III mutants depend on activated RAS.
  evidence:
  - reference: PMID:28783719
    reference_title: Tumours with class 3 BRAF mutants are sensitive to the inhibition of activated RAS.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We have thus defined three distinct functional classes of BRAF mutants in human tumours.
    explanation: Functional classification directly distinguishes V600 class-I disease from non-V600 classes.
- name: RAS-Mutant, NF1-Mutant, or Triple-Wild-Type Cutaneous Melanoma
  description: >-
    Cutaneous melanomas in these genomic classes can be histologically
    indistinguishable but lack the defining BRAF V600 driver and follow
    different targeted-treatment logic.
  distinguishing_features:
  - Use tumor sequencing to assign the BRAF, RAS, NF1, or triple-wild-type genomic class.
  - Do not infer BRAF V600 status from morphology, age, site, or UV-exposure history.
  evidence:
  - reference: PMID:26091043
    reference_title: Genomic Classification of Cutaneous Melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We establish a framework for genomic classification into one of four
      subtypes based on the pattern of the most prevalent significantly mutated
      genes: mutant BRAF, mutant RAS, mutant NF1, and Triple-WT (wild-type).
    explanation: TCGA directly establishes the major mutually informative genomic classes.

progression:
- phase: BRAF-initiated melanocytic hyperplasia with a growth-arrest barrier
  notes: >-
    Lineage-restricted Braf V600E expression can initiate benign melanocytic
    proliferation without spontaneous melanoma progression, demonstrating that
    the driver is not a complete malignant program by itself.
  evidence:
  - reference: PMID:19282848
    reference_title: Braf(V600E) cooperates with Pten loss to induce metastatic melanoma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Mice developed benign melanocytic hyperplasias that failed to progress to melanoma over 15-20 months.
    explanation: The conditional model directly defines an initiated but progression-constrained phase.
- phase: Cooperative malignant and metastatic progression
  notes: >-
    Additional tumor-suppressor and survival-pathway changes can release the
    BRAF-initiated barrier. PTEN loss is one experimentally established route,
    producing rapid melanoma and lymph-node or lung metastasis in mice; human
    tumors remain more heterogeneous.
  evidence:
  - reference: PMID:19282848
    reference_title: Braf(V600E) cooperates with Pten loss to induce metastatic melanoma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: with metastases observed in lymph nodes and lungs
    explanation: The model directly establishes metastatic progression after genetic cooperation.
- phase: Targeted response followed by molecularly heterogeneous resistance
  notes: >-
    BRAF inhibition suppresses ERK phosphorylation and tumor proliferation, but
    progressing lesions can restore MAPK signaling through secondary NRAS or
    MEK1 alterations. Other lesions may use different or non-genetic routes.
  evidence:
  - reference: PMID:23569304
    reference_title: Pharmacodynamic effects and mechanisms of resistance to vemurafenib in patients with metastatic melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acquired resistance results primarily from MAPK reactivation driven by
      the appearance of secondary mutations in NRAS and MEK1 in subsets of patients.
    explanation: Serial pretreatment and progression biopsies directly define the resistant phase and its heterogeneity.
- phase: Brain-metastatic disease
  notes: >-
    Brain metastasis is a clinically important advanced phase. Targeted therapy
    can induce intracranial responses, but response durability remains limited,
    requiring integrated systemic and local treatment planning.
  evidence:
  - reference: PMID:28592387
    reference_title: "Dabrafenib plus trametinib in patients with BRAF(V600)-mutant melanoma brain metastases (COMBI-MB): a multicentre, multicohort, open-label, phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 44 (58%; 95% CI 46-69) of 76 patients in cohort A achieved an intracranial response
    explanation: The prospective phase-II trial directly characterizes treated brain-metastatic disease.

treatments:
- name: Surgical Excision of Resectable Cutaneous Melanoma
  action_category: THERAPEUTIC
  therapeutic_modality: SURGERY
  description: >-
    Complete excision with a stage-appropriate margin is the foundation for
    resectable primary disease. Sentinel-node biopsy is a staging procedure in
    selected tumors and should not be described as having a proven survival
    benefit. Subsequent adjuvant treatment depends on stage, BRAF allele, risk,
    and patient context.
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Cutaneous melanoma
    term:
      id: HP:0012056
      label: Cutaneous melanoma
  evidence:
  - reference: PMID:39709737
    reference_title: "European consensus-based interdisciplinary guideline for melanoma. Part 2: Treatment - Update 2024."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Cutaneous melanomas are excised with one to two-centimeter safety margins.
    explanation: The current interdisciplinary treatment guideline directly supports surgical excision.

- name: Adjuvant Dabrafenib Plus Trametinib
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Twelve months of dabrafenib plus trametinib is an adjuvant option after
    complete resection of high-risk stage-III BRAF V600E/K melanoma. Final
    COMBI-AD follow-up showed durable relapse-free and distant-metastasis-free
    benefit; the overall-survival comparison did not meet conventional
    statistical significance in the full population.
  target_mechanisms:
  - target: Somatic BRAF Codon-600 Driver
    treatment_effect: INHIBITS
    description: Dabrafenib inhibits class-I mutant BRAF kinase activity.
    evidence:
    - reference: clinicaltrials:NCT01682083
      reference_title: "COMBI-AD: A Phase III Randomized Double Blind Study of Dabrafenib (GSK2118436) in COMBInation With Trametinib (GSK1120212) Versus Two Placebos in the ADjuvant Treatment of High-risk BRAF V600 Mutation-positive Melanoma After Surgical Resection"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: BRAF V600E/K mutation-positive, high-risk
      explanation: The registry directly defines the biomarker-selected adjuvant population.
  - target: Sustained MEK-ERK Signaling
    treatment_effect: INHIBITS
    description: Trametinib blocks MEK output downstream of mutant BRAF.
    evidence:
    - reference: PMID:23569304
      reference_title: Pharmacodynamic effects and mechanisms of resistance to vemurafenib in patients with metastatic melanoma.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: The data suggest that inhibition downstream of BRAF should help to overcome acquired resistance.
      explanation: Human resistance biopsies provide the mechanistic rationale for downstream MEK inhibition.
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: dabrafenib
      term:
        id: CHEBI:75045
        label: dabrafenib
    - preferred_term: trametinib
      term:
        id: CHEBI:75998
        label: trametinib
  evidence:
  - reference: PMID:38899716
    reference_title: Final Results for Adjuvant Dabrafenib plus Trametinib in Stage III Melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Relapse-free survival favored dabrafenib plus trametinib over placebo (hazard ratio for relapse or death, 0.52; 95% CI, 0.43 to 0.63)
    explanation: Final randomized phase-III follow-up directly supports durable adjuvant relapse prevention.

- name: Dabrafenib Plus Trametinib for Unresectable or Metastatic Disease
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Dual BRAF/MEK inhibition produces rapid responses in BRAF V600E/K
    unresectable or metastatic melanoma. Pooled COMBI-d/COMBI-v follow-up showed
    five-year survival in a subset, while COMBI-MB demonstrated intracranial
    activity with comparatively limited response duration.
  target_mechanisms:
  - target: Somatic BRAF Codon-600 Driver
    treatment_effect: INHIBITS
    description: Dabrafenib directly inhibits the mutant BRAF kinase.
    evidence:
    - reference: PMID:31166680
      reference_title: Five-Year Outcomes with Dabrafenib plus Trametinib in Metastatic Melanoma.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: A total of 563 patients were randomly assigned to receive dabrafenib plus trametinib
      explanation: The biomarker-selected phase-III trials directly evaluate the combination.
  - target: Sustained MEK-ERK Signaling
    treatment_effect: INHIBITS
    description: Trametinib suppresses pathway output downstream of BRAF.
    evidence:
    - reference: PMID:23569304
      reference_title: Pharmacodynamic effects and mechanisms of resistance to vemurafenib in patients with metastatic melanoma.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: The data suggest that inhibition downstream of BRAF should help to overcome acquired resistance.
      explanation: Resistance profiling supports dual-level MAPK blockade.
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: dabrafenib
      term:
        id: CHEBI:75045
        label: dabrafenib
    - preferred_term: trametinib
      term:
        id: CHEBI:75998
        label: trametinib
  evidence:
  - reference: PMID:31166680
    reference_title: Five-Year Outcomes with Dabrafenib plus Trametinib in Metastatic Melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 34% (95% CI, 30 to 38) at 5 years
    explanation: Pooled phase-III follow-up directly reports long-term survival with the combination.
  - reference: PMID:28592387
    reference_title: "Dabrafenib plus trametinib in patients with BRAF(V600)-mutant melanoma brain metastases (COMBI-MB): a multicentre, multicohort, open-label, phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 44 (58%; 95% CI 46-69) of 76 patients in cohort A achieved an intracranial response
    explanation: COMBI-MB directly supports activity in brain-metastatic disease.

- name: Vemurafenib Plus Cobimetinib
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Vemurafenib plus cobimetinib is a combined BRAF/MEK option for BRAF V600
    advanced melanoma. Five-year coBRIM follow-up confirmed longer median
    progression-free and overall survival than vemurafenib alone, with
    regimen-specific toxicity and patient factors informing selection.
  target_mechanisms:
  - target: Somatic BRAF Codon-600 Driver
    treatment_effect: INHIBITS
    description: Vemurafenib inhibits class-I mutant BRAF.
    evidence:
    - reference: clinicaltrials:NCT01689519
      reference_title: "A Phase III, Double-Blind, Placebo-Controlled Study of Vemurafenib Versus Vemurafenib Plus GDC-0973 in Previously Untreated BRAF^600-Mutation Positive Patients With Unresectable Locally Advanced or Metastatic Melanoma"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: previously untreated BRAF V600 mutation-positive patients with unresectable locally advanced or metastatic melanoma
      explanation: The registry directly defines the molecular population and BRAF-containing regimen.
  - target: Sustained MEK-ERK Signaling
    treatment_effect: INHIBITS
    description: Cobimetinib inhibits MEK downstream of mutant BRAF.
    evidence:
    - reference: PMID:34158360
      reference_title: "5-Year Outcomes with Cobimetinib plus Vemurafenib in BRAFV600 Mutation-Positive Advanced Melanoma: Extended Follow-up of the coBRIM Study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL

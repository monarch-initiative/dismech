- name: Xiphophorus Gordon-Kosswig-Anders backcross hybrid melanoma
  species: Xiphophorus maculatus x Xiphophorus hellerii
  genotype: >-
    Backcross hybrid hemizygous for the Xmrk (Tu) locus and lacking the
    X. maculatus R/Diff tumour-suppressor allele
  background: >-
    X. maculatus Jp163A spotted-dorsal (Sd) x X. hellerii, F1 backcrossed to
    X. hellerii. The sibling Jp163B spotted-side (Sp) line is the Tu-carrying
    parent of three of the alternative hybrid models rather than of this
    classical cross; one of those, Sp-couchianus, is the primary UVB-inducible
    melanoma model and crosses Jp163B to X. couchianus (PMID:21143485).
  publication: PMID:2797166
  description: >-
    The oldest vertebrate melanoma model. Crossing a spotted X. maculatus
    platyfish to X. hellerii and backcrossing the F1 to the swordtail parent
    segregates the melanoma oncogene Xmrk away from the R/Diff locus that
    normally restrains it. Backcross progeny segregate into four Mendelian
    classes, and those inheriting Xmrk on an R/Diff-free background develop
    highly malignant melanoma. Xmrk encodes a constitutively active paralogue of the
    epidermal growth factor receptor whose dominant downstream output is the
    Ras/Raf/MAPK cascade. Because the driver sits upstream of RAF rather than in
    it, the model isolates the consequences of sustained MAPK flux from the
    identity of the mutation that produces it, and it was the system in which
    receptor tyrosine kinase/Ras/Raf/MAPK signalling was identified as the
    critical melanoma driver roughly a decade before that role was established
    in human tumours.
  associated_phenotypes:
  - Spontaneous malignant melanoma in the Xmrk-carrying, R/Diff-free segregant class
  - Melanoma malignancy grade tracking Xmrk expression level
  - Progression from pigmented macromelanophore lesion to invasive melanoma
  evidence:
  - reference: PMID:2797166
    reference_title: Novel putative receptor tyrosine kinase encoded by the melanoma-inducing Tu locus in Xiphophorus.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Malignant melanoma in Xiphophorus fish hybrids is caused by the activity of a dominant oncogene Tu.
    explanation: >-
      Establishes the hybrid fish as a genetically defined melanoma model and
      identifies the single dominant locus responsible.
  - reference: PMID:38299666
    reference_title: Validity of Xiphophorus fish as models for human disease.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: backcross segregants that have inherited only R/Diff-free chromosomes develop highly malignant melanoma due to unobstructed activity of Tu
    explanation: >-
      Describes the segregation that produces melanoma-bearing animals in this
      cross, and the tumour-suppressor loss that permits it.
  modeled_mechanisms:
  - target: Sustained MEK-ERK Signaling
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Ligand-independent Xmrk signalling drives the same Ras/Raf/MEK/ERK output
      that a BRAF codon-600 mutation produces, so the model reproduces the
      downstream node while entering the cascade one step further upstream.
    limitations: >-
      The fish carries no BRAF codon-600 mutation; the driver is an
      EGFR-family receptor tyrosine kinase, so the model cannot report on
      RAF-inhibitor binding, paradoxical RAF activation, or codon-600-specific
      allele biology. Xmrk also activates STAT5 and PI3K-AKT branches that a
      BRAF V600E melanocyte does not engage the same way, so MAPK-attributable
      effects must be separated from those before transferring inferences.
    readouts:
    - name: Ras/Raf/MAPK pathway activation downstream of Xmrk
      target: Sustained MEK-ERK Signaling
      description: >-
        Signalling analyses of Xmrk-expressing melanocytes and fish melanomas
        identifying which downstream cascade carries the transforming signal.
      direction: INCREASED
      interpretation: >-
        MAPK is the dominant effector arm of the fish oncogene, which is what
        makes the model informative for the human MEK-ERK node.
      evidence:
      - reference: PMID:38299666
        reference_title: Validity of Xiphophorus fish as models for human disease.
        supports: SUPPORT
        evidence_source: OTHER
        snippet: The most important downstream signaling pathway activated by the Xmrk receptor tyrosine kinase is the Ras/Raf/MAPK pathway
        explanation: >-
          Identifies MAPK as the principal transducer of the Xmrk signal, the
          basis for mapping this model onto the MEK-ERK node.
    - name: Xmrk transcript level versus tumour malignancy grade
      target: Sustained MEK-ERK Signaling
      description: >-
        Comparison of oncogene expression against histological malignancy across
        hybrid tumours.
      direction: INCREASED
      interpretation: >-
        A dose relationship between driver expression and malignancy, the fish
        counterpart of MAPK output scaling with melanoma aggressiveness.
      evidence:
      - reference: PMID:2797166
        reference_title: Novel putative receptor tyrosine kinase encoded by the melanoma-inducing Tu locus in Xiphophorus.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: We show that its level of expression correlates with the degree of malignancy of the tumour.
        explanation: Reports the measured relationship between oncogene expression and tumour grade.
    evidence:
    - reference: PMID:2797166
      reference_title: Novel putative receptor tyrosine kinase encoded by the melanoma-inducing Tu locus in Xiphophorus.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: The Tu gene codes for a novel receptor tyrosine kinase which is closely related to the receptor for epidermal growth factor.
      explanation: >-
        Places the fish driver in the EGFR receptor tyrosine kinase family,
        upstream of the same Ras/Raf/MEK/ERK cascade this node describes.
    - reference: PMID:38299666
      reference_title: Validity of Xiphophorus fish as models for human disease.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: studies of oncogenic Xmrk signaling predicted the role of the receptor tyrosine kinase/Ras/Raf/MAPK pathway as the critical driver for melanoma a decade before this was confirmed in humans
      explanation: >-
        States the predictive validity of this model for the human MAPK-driven
        melanoma mechanism.


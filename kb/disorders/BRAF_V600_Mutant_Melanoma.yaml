- name: Immune Checkpoint Blockade
  action_category: THERAPEUTIC
  therapeutic_modality: MONOCLONAL_ANTIBODY
  description: >-
    PD-1-based therapy, alone or in combination with CTLA-4 or LAG-3 blockade,
    is a major systemic option regardless of BRAF status. In treatment-naive
    metastatic BRAF V600 melanoma, DREAMseq and SECOMBIT support beginning with
    nivolumab plus ipilimumab for most trial-eligible patients, while urgent
    disease control, contraindications, prior adjuvant therapy, toxicity, and
    patient preference can alter individual sequencing.
  target_mechanisms:
  - target: Immune-Checkpoint-Mediated Evasion
    treatment_effect: INHIBITS
    description: Checkpoint antibodies release inhibitory signals that constrain antitumor T-cell activity.
    evidence:
    - reference: PMID:24903021
      reference_title: Response to BRAF inhibition in melanoma is enhanced when combined with immune checkpoint blockade.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Administration of anti-PD1 or anti-PDL1 together with a BRAF inhibitor led to an enhanced response, significantly prolonging survival and slowing tumor growth
      explanation: The immunocompetent melanoma model directly demonstrates checkpoint-mediated immune constraint.
  treatment_term:
    preferred_term: immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
    therapeutic_agent:
    - preferred_term: nivolumab
      term:
        id: NCIT:C68814
        label: Nivolumab
    - preferred_term: ipilimumab
      term:
        id: CHEBI:231679
        label: ipilimumab
  evidence:
  - reference: PMID:36166727
    reference_title: "Combination Dabrafenib and Trametinib Versus Combination Nivolumab and Ipilimumab for Patients With Advanced BRAF-Mutant Melanoma: The DREAMseq Trial-ECOG-ACRIN EA6134."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The 2-year OS for those starting on arm A was 71.8% (95% CI, 62.5 to 79.1) and arm B 51.5% (95% CI, 41.7 to 60.4; log-rank P = .010).
    explanation: The randomized phase-III sequencing trial directly supports immunotherapy-first survival for most enrolled patients.
  - reference: PMID:38167503
    reference_title: "Sequential immunotherapy and targeted therapy for metastatic BRAF V600 mutated melanoma: 4-year survival and biomarkers evaluation from the phase II SECOMBIT trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: These long-term survival outcomes confirm immunotherapy as the preferred first-line treatment approach for most patients with BRAFV600-mutant metastatic melanoma
    explanation: Four-year randomized phase-II follow-up independently supports the sequencing conclusion.
  - reference: PMID:39709737
    reference_title: "European consensus-based interdisciplinary guideline for melanoma. Part 2: Treatment - Update 2024."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: For first line treatment PD-1 antibodies alone or in combination with CTLA-4 or LAG-3 antibodies shall be considered.
    explanation: The current guideline places checkpoint therapy among first-line systemic options.


    snippet: 44 (58%; 95% CI 46-69) of 76 patients in cohort A achieved an intracranial response
    explanation: The molecularly selected phase-II trial directly documents the brain-metastatic phenotype and intracranial response.

biochemical:
- name: Tumor BRAF V600 Variant Detection
  presence: REQUIRED_FOR_SUBTYPE_ASSIGNMENT
  notes: >-
    Detection of a somatic BRAF codon-600 variant in melanoma tissue defines
    this molecular subtype. The exact protein allele should be reported because
    registration-trial evidence is strongest for V600E and V600K.
  evidence:
  - reference: PMID:22536370
    reference_title: Routine multiplex mutational profiling of melanomas enables enrollment in genotype-driven therapeutic trials.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The SNaPshot melanoma screen can detect 43 point mutations in 6 genes relevant to targeted therapy in melanoma.
    explanation: The clinical implementation study establishes multiplex tumor genotyping and allele resolution.
  - reference: PMID:39700658
    reference_title: "European consensus-based interdisciplinary guideline for melanoma. Part 1: Diagnostics - Update 2024."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: From stage IIB/C and higher, a mutation test is recommended, especially for the BRAF V600 mutation.
    explanation: The current diagnostic guideline supports stage-appropriate BRAF V600 testing.
- name: BRAF V600E VE1 Immunoreactivity
  presence: VARIABLE
  notes: >-
    VE1 immunohistochemistry can screen for the V600E protein, but it does not
    comprehensively identify all V600 alleles and showed imperfect sensitivity
    and specificity in the cited cohort. Molecular testing remains necessary
    when the result is discordant, negative despite clinical need, or when exact
    non-E allele resolution matters.
  evidence:
  - reference: PMID:28424234
    reference_title: "BRAF V600 mutation detection in melanoma: a comparison of two laboratory testing methods."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The antibody showed a sensitivity of 86.1% with a specificity of 96.9%.
    explanation: The direct PCR-versus-VE1 comparison quantifies performance and supports screening rather than universal substitution.
- name: Plasma BRAF V600 Circulating Tumor DNA
  presence: VARIABLE
  notes: >-
    BRAF V600-mutant circulating tumor DNA is frequently detectable in advanced
    disease and can carry prognostic information. Detectability is lower after
    resection, and intervention guided by ctDNA remains investigational rather
    than a replacement for tissue diagnosis or standard imaging.
  evidence:
  - reference: PMID:33587894
    reference_title: "Circulating tumour DNA in patients with advanced melanoma treated with dabrafenib or dabrafenib plus trametinib: a clinical validation study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: ctDNA was detected in pretreatment samples from 320 (93%) of 345 patients (COMBI-d) and 34 (89%) of 38 patients (COMBI-MB).
    explanation: The large biomarker analysis directly quantifies baseline detectability in advanced disease.
  - reference: PMID:40250457
    reference_title: "Clinical validation of droplet digital PCR assays in detecting BRAF(V600)-mutant circulating tumour DNA as a prognostic biomarker in patients with resected stage III melanoma receiving adjuvant therapy (COMBI-AD): a biomarker analysis from a double-blind, randomised phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: ctDNA was detectable in 79 (13%) of 597 baseline samples.
    explanation: The resected-stage-III analysis demonstrates much lower detection in the minimal-residual-disease setting.

genetic:
- name: BRAF p.Val600Glu
  gene_term:
    preferred_term: BRAF
    term:
      id: hgnc:1097
      label: BRAF
  association: Somatic Activating Driver Mutation
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    BRAF c.1799T>A (p.Val600Glu) is the dominant codon-600 allele and has the
    most extensive targeted-therapy evidence. Historical literature called the
    same residue V599E before sequence numbering was standardized.
  evidence:
  - reference: PMID:12068308
    reference_title: Mutations of the BRAF gene in human cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: All mutations are within the kinase domain, with a single substitution (V599E) accounting for 80%.
    explanation: The foundational study identifies the dominant activating melanoma allele under historical numbering.
  - reference: PMID:22536370
    reference_title: Routine multiplex mutational profiling of melanomas enables enrollment in genotype-driven therapeutic trials.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Among BRAF V600 mutations, 79%, 12%, 5%, and 4% were V600E, V600K, V600R, and V600M, respectively.
    explanation: The clinical testing cohort confirms dominance of the standardized V600E allele.

name: BRAF V600 Mutant Melanoma
creation_date: '2026-01-26T02:55:13Z'
description: >-
  BRAF V600-mutant melanoma is a molecularly defined subtype of cutaneous
  melanoma in which tumor cells carry an activating somatic substitution at
  BRAF codon 600. V600E is the dominant allele, followed by V600K; V600R and
  V600M are uncommon and have a smaller treatment-evidence base. Codon-600
  mutants are class-I BRAF proteins that signal as RAS-independent active
  monomers, sustaining MEK-ERK output. The driver can initiate melanocytic
  proliferation, but experimental models show that BRAF V600E alone often
  produces benign hyperplasia or a growth-arrest barrier; cooperating lesions
  such as PTEN loss enable malignant and metastatic progression. Stage and
  exact allele matter clinically. Resectable disease is managed surgically,
  while immune-checkpoint therapy and combined BRAF/MEK inhibition are major
  systemic options in advanced disease. Acquired resistance commonly restores
  MAPK signaling or engages bypass and adaptive programs.
categories:
- Skin Cancer
- Molecularly-Defined Cancer
- Solid Tumor
- Oncogene-Driven Cancer
parents:
- cutaneous melanoma
synonyms:
- BRAF V600-positive cutaneous melanoma
- BRAF V600-mutated melanoma
- BRAF class-I mutant melanoma

epidemiology:
- name: Cohort-dependent BRAF mutation frequency
  description: >-
    In a series of 106 primary cutaneous melanomas from western Turkey, 42.5%
    carried a BRAF mutation. This is a cohort proportion, not a population
    prevalence estimate; frequency varies with ancestry, melanoma subtype,
    anatomic site, age distribution, and testing strategy.
  evidence:
  - reference: PMID:25357015
    reference_title: Clinicopathological characteristics and mutation profiling in primary cutaneous melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: BRAF (42.5%), NRAS (15.1%), and CDKN2A (13.2%) were the 3 most common mutations.
    explanation: The primary-cutaneous-melanoma cohort supplies an explicit BRAF proportion and denominator.
- name: Younger-age, trunk, and intermittent-sun-exposure enrichment
  description: >-
    The same 106-tumor cohort associated BRAF mutation with younger age, trunk
    location, superficial-spreading or nodular histology, and intermittent sun
    exposure. These are enrichments within one regional series rather than
    diagnostic criteria or proof that ultraviolet radiation directly creates
    the noncanonical BRAF c.1799T>A substitution.
  evidence:
  - reference: PMID:25357015
    reference_title: Clinicopathological characteristics and mutation profiling in primary cutaneous melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: younger age (OR = 2.7)
    explanation: The cohort directly quantifies the stated clinicopathologic associations.
- name: V600 allele distribution in a molecular-testing cohort
  description: >-
    Among BRAF V600-positive tumors in the first 150 melanomas tested by one
    multiplex assay, V600E accounted for 79%, V600K for 12%, V600R for 5%, and
    V600M for 4%. These percentages characterize that referral cohort and should
    not be treated as invariant population frequencies.
  evidence:
  - reference: PMID:22536370
    reference_title: Routine multiplex mutational profiling of melanomas enables enrollment in genotype-driven therapeutic trials.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Among BRAF V600 mutations, 79%, 12%, 5%, and 4% were V600E, V600K, V600R, and V600M, respectively.
    explanation: The clinical molecular-testing study directly reports the within-V600 allele distribution.

has_subtypes:
- name: BRAF V600E Melanoma
  description: >-
    Melanoma carrying the somatic BRAF p.Val600Glu substitution. V600E was the
    dominant V600 allele in the cited molecular-testing cohort and has the
    deepest clinical-trial evidence base.
  evidence:
  - reference: PMID:22536370
    reference_title: Routine multiplex mutational profiling of melanomas enables enrollment in genotype-driven therapeutic trials.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Among BRAF V600 mutations, 79%, 12%, 5%, and 4% were V600E, V600K, V600R, and V600M, respectively.
    explanation: The molecular-testing cohort identifies V600E as the dominant V600 allele.
- name: BRAF V600K Melanoma
  description: >-
    Melanoma carrying the somatic BRAF p.Val600Lys substitution. V600K is less
    common than V600E but was included with V600E in the pivotal advanced and
    adjuvant BRAF/MEK trials represented here.
  evidence:
  - reference: PMID:22536370
    reference_title: Routine multiplex mutational profiling of melanomas enables enrollment in genotype-driven therapeutic trials.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Among BRAF V600 mutations, 79%, 12%, 5%, and 4% were V600E, V600K, V600R, and V600M, respectively.
    explanation: The molecular-testing cohort identifies V600K as the second most common V600 allele.
  - reference: PMID:31166680
    reference_title: Five-Year Outcomes with Dabrafenib plus Trametinib in Metastatic Melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients who have unresectable or metastatic melanoma with a BRAF V600E
      or V600K mutation have prolonged progression-free survival and overall
      survival when receiving treatment with BRAF inhibitors plus MEK inhibitors.
    explanation: The pooled phase-III analysis directly includes V600E and V600K melanoma.
- name: Rare BRAF V600 Melanoma
  description: >-
    Melanoma carrying another codon-600 substitution, including V600R or V600M.
    These alleles activate the same codon hotspot but are uncommon, and evidence
    from V600E/K-dominant registration trials must not be generalized to every
    rare V600 allele without allele-specific assessment.
  evidence:
  - reference: PMID:22536370
    reference_title: Routine multiplex mutational profiling of melanomas enables enrollment in genotype-driven therapeutic trials.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Among BRAF V600 mutations, 79%, 12%, 5%, and 4% were V600E, V600K, V600R, and V600M, respectively.
    explanation: The cohort directly documents the rare V600R and V600M alleles.
  - reference: PMID:28592387
    reference_title: "Dabrafenib plus trametinib in patients with BRAF(V600)-mutant melanoma brain metastases (COMBI-MB): a multicentre, multicohort, open-label, phase 2 trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: BRAFV600D/K/R-positive, asymptomatic melanoma brain metastases
    explanation: COMBI-MB supplies limited prospective inclusion of non-E V600 alleles but not broad evidence for every rare allele.

environmental:
- name: Intermittent Ultraviolet-Exposure Context
  exposure_term:
    preferred_term: exposure to ultraviolet radiation
    term:
      id: ECTO:0000006
      label: exposure to ultraviolet radiation
  influences_mechanisms:
  - target: Somatic BRAF Codon-600 Driver
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Deliberately not TRIGGERS. Intermittent sun exposure is associated with
      this tumour type, but this entry's own evidence notes the BRAF V600E
      mutation arises in anatomically sun-shielded naevi too, so ultraviolet
      light is a risk context rather than the mutational cause. The mutation
      does not carry a UV signature.
    evidence:
    - reference: PMID:25357015
      reference_title: "Clinicopathological characteristics and mutation profiling in primary cutaneous melanoma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "trunk localization (OR = 6.3), and intermittent sun exposure (OR = 4.6)"
      explanation: >-
        Reports intermittent sun exposure as a risk factor by odds ratio, an
        epidemiological association with the tumour rather than a demonstrated
        cause of the codon-600 mutation.
  description: >-
    Ultraviolet exposure is a background cause of cutaneous melanoma, and one
    primary-tumor cohort found BRAF mutation enriched with intermittent sun
    exposure. This association does not establish that UV directly creates the
    BRAF V600 nucleotide change, nor does it make exposure necessary for this
    molecular subtype.
  effect: Risk context for cutaneous melanomagenesis; molecular-subtype association is cohort dependent.
  evidence:
  - reference: PMID:25357015
    reference_title: Clinicopathological characteristics and mutation profiling in primary cutaneous melanoma.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: trunk localization (OR = 6.3), and intermittent sun exposure (OR = 4.6)
    explanation: The observational association supports a UV-exposure context but not direct mutagenic attribution for BRAF V600.
  - reference: PMID:19919630
    reference_title: BRAF V600E mutation and the tumour suppressor IGFBP7 in atypical genital naevi.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: The prevalence of BRAF V600E in AGN suggests that ultraviolet exposure is not essential for generating the mutation.
    explanation: Detection in a nonsun-exposed site directly supports the caveat that UV is not required for the V600E event.

mechanistic_hypotheses:
- hypothesis_group_id: canonical_braf_v600_melanoma_model
  hypothesis_label: Canonical BRAF V600 Melanoma Model
  status: CANONICAL
  description: >-
    A somatic class-I BRAF codon-600 mutant drives RAS-independent MEK-ERK
    signaling and melanocyte proliferation. BRAF V600E alone can generate
    benign melanocytic hyperplasia or oncogene-induced arrest, so malignant
    progression requires additional permissive changes. PTEN loss is a
    experimentally established cooperating route that activates PI3K-AKT-mTOR
    survival signaling and permits invasive, metastatic melanoma.
  evidence:
  - reference: PMID:12068308
    reference_title: Mutations of the BRAF gene in human cancer.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Mutated BRAF proteins have elevated kinase activity and are transforming in NIH3T3 cells.
    explanation: The foundational functional study establishes mutant-BRAF kinase activation and transforming capacity.
  - reference: PMID:19282848
    reference_title: Braf(V600E) cooperates with Pten loss to induce metastatic melanoma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Expression of BRaf(V600E) combined with Pten tumor suppressor gene
      silencing elicited development of melanoma with 100% penetrance.
    explanation: The conditional mouse model directly demonstrates cooperation between the driver and PTEN loss.
- hypothesis_group_id: acquired_mapk_inhibitor_resistance_model
  hypothesis_label: Acquired BRAF/MEK-Inhibitor Resistance Model
  status: CANONICAL
  description: >-
    MAPK-pathway inhibition selects for heterogeneous tumor-cell states and
    clones. Resistant disease can restore ERK output through secondary NRAS or
    MEK alterations and other MAPK routes, engage PI3K-AKT or receptor-kinase
    bypass signaling, or adopt reversible transcriptional and metabolic states.
    No single mechanism explains every progressing lesion.
  evidence:
  - reference: PMID:23569304
    reference_title: Pharmacodynamic effects and mechanisms of resistance to vemurafenib in patients with metastatic melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acquired resistance to vemurafenib associated with reactivation of MAPK
      signaling as observed by elevated ERK1/2 phosphorylation levels in
      progressive lesions.
    explanation: Serial human biopsies directly demonstrate MAPK reactivation at progression.
  - reference: PMID:24610826
    reference_title: "Molecular pathways: BRAF induces bioenergetic adaptation by attenuating oxidative phosphorylation."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: Therapeutic inhibition of BRAF(V600E) reverses metabolic reprogramming in melanoma cells and elevates OXPHOS.
    explanation: The mechanistic review supports metabolic adaptation as one component of resistance, not a universal route.

pathophysiology:
- name: Somatic BRAF Codon-600 Driver
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    A tumor-acquired missense substitution at BRAF codon 600 destabilizes the
    inactive kinase configuration. Codon-600 mutants constitute class-I BRAF:
    they are active without upstream RAS, signal as monomers, and differ
    mechanistically from class-II dimers and RAS-dependent class-III mutants.
  genes:
  - preferred_term: BRAF
    term:
      id: hgnc:1097
      label: BRAF
  molecular_functions:
  - preferred_term: protein serine/threonine kinase activity
    modifier: INCREASED
    term:
      id: GO:0004674
      label: protein serine/threonine kinase activity
  evidence:
  - reference: PMID:12068308
    reference_title: Mutations of the BRAF gene in human cancer.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Mutated BRAF proteins have elevated kinase activity and are transforming in NIH3T3 cells.
    explanation: The foundational study functionally establishes kinase activation and transformation.
  - reference: PMID:28783719
    reference_title: Tumours with class 3 BRAF mutants are sensitive to the inhibition of activated RAS.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Activating BRAF mutants cause feedback inhibition of GTP-bound RAS, are RAS-independent and signal either as active monomers (class 1) or constitutively active dimers (class 2).
    explanation: The functional-classification study places V600 alleles in the RAS-independent monomeric class.
  downstream:
  - target: Sustained MEK-ERK Signaling
    causal_link_type: DIRECT
    description: Constitutive class-I BRAF kinase output activates the downstream MEK-ERK cascade without an upstream RAS requirement.
    hypothesis_groups:
    - canonical_braf_v600_melanoma_model
    evidence:
    - reference: PMID:12068308
      reference_title: Mutations of the BRAF gene in human cancer.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: RAS function is not required for the growth of cancer cell lines with the V599E mutation.
      explanation: The original codon-numbering study directly demonstrates RAS-independent growth.
  - target: Oncogene-Induced Melanocytic Growth-Arrest Barrier
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - excessive oncogenic signaling
    - cellular senescence program
    description: In melanocytes, BRAF V600E can initiate benign hyperplasia followed by a durable growth-arrest barrier.
    hypothesis_groups:
    - canonical_braf_v600_melanoma_model
    evidence:
    - reference: PMID:19282848
      reference_title: Braf(V600E) cooperates with Pten loss to induce metastatic melanoma.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Mice developed benign melanocytic hyperplasias that failed to progress to melanoma over 15-20 months.
      explanation: Melanocyte-specific Braf V600E directly produced a nonprogressing benign state in mice.

- name: Sustained MEK-ERK Signaling
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    Constitutive mutant-BRAF output maintains the RAF-MEK-ERK cascade, which
    controls proliferative and survival programs in the melanocytic lineage.
    The pathway remains pharmacologically actionable because inhibition at both
    BRAF and MEK reduces pathway output and delays, but does not eliminate,
    resistance.
  biological_processes:
  - preferred_term: ERK1 and ERK2 cascade
    modifier: INCREASED
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
  evidence:
  - reference: PMID:23569304
    reference_title: Pharmacodynamic effects and mechanisms of resistance to vemurafenib in patients with metastatic melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Vemurafenib inhibited MAPK signaling and cell-cycle progression.
    explanation: Paired clinical biopsies show target-pathway suppression during BRAF inhibition.
  downstream:
  - target: MAPK-Dependent Melanocyte Proliferation and Survival
    causal_link_type: DIRECT
    description: Sustained ERK output maintains cell-cycle progression and survival in BRAF-driven melanoma cells.
    hypothesis_groups:
    - canonical_braf_v600_melanoma_model
    evidence:
    - reference: PMID:23569304
      reference_title: Pharmacodynamic effects and mechanisms of resistance to vemurafenib in patients with metastatic melanoma.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: An association between the decrease in extracellular signal-related kinase (ERK) phosphorylation and objective response was observed in paired biopsies (n = 22; P = .013).
      explanation: Pharmacodynamic response links reduced ERK activity with reduced tumor growth.

- name: MAPK-Dependent Melanocyte Proliferation and Survival
  role: consequence
  biological_scale: CELLULAR
  description: >-
    Persistent ERK signaling expands and sustains transformed melanocytes.
    This output is necessary but not always sufficient for invasive melanoma:
    experimental BRAF expression can stop at a benign hyperplasia, whereas
    additional survival and tumor-suppressor lesions permit progression.
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  locations:
  - preferred_term: skin of body
    term:
      id: UBERON:0002097
      label: skin of body
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  - preferred_term: apoptotic process
    modifier: DECREASED
    term:
      id: GO:0006915
      label: apoptotic process
  evidence:
  - reference: PMID:12068308
    reference_title: Mutations of the BRAF gene in human cancer.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Mutated BRAF proteins have elevated kinase activity and are transforming in NIH3T3 cells.
    explanation: The functional assay establishes proliferative transformation downstream of mutant BRAF.
  downstream:
  - target: Cutaneous Melanoma
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - clonal melanocyte expansion
    - escape from oncogene-induced growth arrest
    - malignant transformation
    description: MAPK-dependent expansion contributes to the cutaneous melanoma phenotype when cooperating progression barriers are overcome.
    hypothesis_groups:
    - canonical_braf_v600_melanoma_model
    evidence:
    - reference: PMID:19282848
      reference_title: Braf(V600E) cooperates with Pten loss to induce metastatic melanoma.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: By contrast, expression of BRaf(V600E) combined with Pten tumor suppressor gene silencing elicited development of melanoma with 100% penetrance, short latency and with metastases observed in lymph nodes and lungs.
      explanation: The lineage-specific model directly links the driver-plus-cooperation state to melanoma formation.

- name: Oncogene-Induced Melanocytic Growth-Arrest Barrier
  role: regulatory
  biological_scale: CELLULAR
  description: >-
    Strong oncogenic BRAF signaling can evoke a senescence-like arrest rather
    than continuous malignant growth. This helps explain why BRAF V600E is
    found in benign melanocytic proliferations and why additional genetic or
    cell-state changes are required for invasive cancer.
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  biological_processes:
  - preferred_term: cellular senescence
    modifier: INCREASED
    term:
      id: GO:0090398
      label: cellular senescence
  evidence:
  - reference: PMID:19282848
    reference_title: Braf(V600E) cooperates with Pten loss to induce metastatic melanoma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Mice developed benign melanocytic hyperplasias that failed to progress to melanoma over 15-20 months.
    explanation: The long-lived benign phenotype supports a progression barrier after driver activation.
  - reference: PMID:22549727
    reference_title: Abrogation of BRAFV600E-induced senescence by PI3K pathway activation contributes to melanomagenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: PTEN depletion abrogates BRAF(V600E)-induced senescence in human fibroblasts and melanocytes.
    explanation: The human-cell experiment directly identifies BRAF-induced senescence and its escape after PTEN depletion.

- name: PTEN-Loss and PI3K-AKT-mTOR Cooperation
  role: modifier
  biological_scale: MOLECULAR
  description: >-
    Loss of PTEN provides a cooperating survival pathway that permits
    BRAF-initiated melanocytes to escape the benign growth-arrest state and
    progress. This is a validated experimental route rather than a claim that
    PTEN loss is obligatory in every human BRAF V600 melanoma.
  genes:
  - preferred_term: PTEN
    term:
      id: hgnc:9588
      label: PTEN
  biological_processes:
  - preferred_term: intracellular signal transduction
    modifier: INCREASED
    term:
      id: GO:0035556
      label: intracellular signal transduction
  evidence:
  - reference: PMID:19282848
    reference_title: Braf(V600E) cooperates with Pten loss to induce metastatic melanoma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Expression of BRaf(V600E) combined with Pten tumor suppressor gene
      silencing elicited development of melanoma with 100% penetrance.
    explanation: The conditional mouse experiment directly establishes cooperation.
  - reference: PMID:22549727
    reference_title: Abrogation of BRAFV600E-induced senescence by PI3K pathway activation contributes to melanomagenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: PI3K pathway activation serves as a rate-limiting event in this setting
    explanation: Human cells and contiguous nevus-melanoma specimens support PI3K-pathway escape from the BRAF-induced barrier.
  downstream:
  - target: Invasive and Metastatic Melanoma Progression
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - escape from growth arrest
    - enhanced tumor-cell survival
    - invasive clonal expansion
    description: In the conditional model, PTEN loss converts BRAF-initiated hyperplasia into rapidly penetrant metastatic melanoma.
    hypothesis_groups:
    - canonical_braf_v600_melanoma_model
    evidence:
    - reference: PMID:19282848
      reference_title: Braf(V600E) cooperates with Pten loss to induce metastatic melanoma.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: with metastases observed in lymph nodes and lungs
      explanation: The same model directly demonstrates metastatic progression after genetic cooperation.

- name: Invasive and Metastatic Melanoma Progression
  role: consequence
  biological_scale: TISSUE
  description: >-
    Melanoma progression entails invasion, regional or distant dissemination,
    and survival in metastatic sites. BRAF V600 is a driver and treatment
    biomarker, but it does not by itself define the anatomic pattern or stage;
    co-alterations, immune context, and tumor-cell state modify progression.
  biological_processes:
  - preferred_term: positive regulation of cell migration
    modifier: INCREASED
    term:
      id: GO:0030335
      label: positive regulation of cell migration
  evidence:
  - reference: PMID:19282848
    reference_title: Braf(V600E) cooperates with Pten loss to induce metastatic melanoma.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: with metastases observed in lymph nodes and lungs
    explanation: The Braf/Pten model directly establishes dissemination after cooperative transformation.
  downstream:
  - target: Brain Metastases
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - hematogenous dissemination
    - blood-brain barrier transit
    - intracranial colonization
    description: Advanced BRAF V600 melanoma can disseminate to the brain, although a unique BRAF-dependent brain-homing route is not established here.
    evidence:
    - reference: PMID:28592387
      reference_title: "Dabrafenib plus trametinib in patients with BRAF(V600)-mutant melanoma brain metastases (COMBI-MB): a multicentre, multicohort, open-label, phase 2 trial."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: Between Feb 28, 2014, and Aug 5, 2016, 125 patients were enrolled in the study
      explanation: The molecularly selected trial establishes the clinical phenotype but not a unique brain-tropism mechanism.
  - target: Progressive Metastatic Disease
    causal_link_type: DIRECT
    description: Continued invasive growth and dissemination produce clinically progressive metastatic melanoma.
    evidence:
    - reference: PMID:28592387
      reference_title: "Dabrafenib plus trametinib in patients with BRAF(V600)-mutant melanoma brain metastases (COMBI-MB): a multicentre, multicohort, open-label, phase 2 trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: The median duration of response was relatively short.
      explanation: The trial documents limited response durability in advanced brain-metastatic disease.

- name: Immune-Checkpoint-Mediated Evasion
  conforms_to: "immune_checkpoint_blockade#Adaptive Immune Resistance"
  role: modifier
  biological_scale: CELLULAR
  description: >-
    BRAF-mutant melanoma exists within an immune-responsive but suppressive
    microenvironment. BRAF inhibition can increase CD8-positive T-cell
    infiltration while also increasing PD-L1, creating a rationale for
    checkpoint blockade. Immune phenotype varies among tumors and is not
    determined by BRAF status alone.
  cell_types:
  - preferred_term: CD8-positive, alpha-beta T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: negative regulation of T cell mediated immunity
    modifier: INCREASED
    term:
      id: GO:0002710
      label: negative regulation of T cell mediated immunity
  evidence:
  - reference: PMID:24903021
    reference_title: Response to BRAF inhibition in melanoma is enhanced when combined with immune checkpoint blockade.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: BRAF inhibition results in a more favorable tumor microenvironment in patients, with an increase in CD8(+) T-cell infiltrate and a decrease in immunosuppressive cytokines.
    explanation: Human paired observations support treatment-associated immune remodeling.
  - reference: PMID:26091043
    reference_title: Genomic Classification of Cutaneous Melanoma.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: samples assigned a transcriptomic subclass enriched for immune gene expression
    explanation: TCGA shows clinically relevant immune heterogeneity across cutaneous melanoma.

- name: Acquired MAPK Reactivation and Adaptive Resistance
  role: consequence
  biological_scale: CELLULAR
  description: >-
    Under BRAF- or BRAF/MEK-inhibitor selection, progressing lesions can restore
    ERK signaling through secondary NRAS or MAP2K1 alterations and other MAPK
    routes. Parallel PI3K-AKT signaling and reversible transcriptional or
    metabolic adaptation can also sustain drug-tolerant states. Resistance is
    therefore mechanistically heterogeneous.
  biological_processes:
  - preferred_term: ERK1 and ERK2 cascade
    modifier: INCREASED
    term:
      id: GO:0070371
      label: ERK1 and ERK2 cascade
  - preferred_term: response to xenobiotic stimulus
    modifier: ABNORMAL
    term:
      id: GO:0009410
      label: response to xenobiotic stimulus
  evidence:
  - reference: PMID:23569304
    reference_title: Pharmacodynamic effects and mechanisms of resistance to vemurafenib in patients with metastatic melanoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acquired resistance results primarily from MAPK reactivation driven by
      the appearance of secondary mutations in NRAS and MEK1 in subsets of patients.
    explanation: Serial biopsies directly establish specific clinical resistance routes.
  - reference: PMID:24610826
    reference_title: "Molecular pathways: BRAF induces bioenergetic adaptation by attenuating oxidative phosphorylation."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: Therapeutic inhibition of BRAF(V600E) reverses metabolic reprogramming in melanoma cells and elevates OXPHOS.
    explanation: The review supports adaptive metabolic plasticity as a candidate resistance component.
  downstream:
  - target: Progressive Metastatic Disease
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - restoration of tumor-cell proliferation
    - survival of drug-tolerant clones
    - expansion of resistant lesions
    description: Restored or bypass signaling permits renewed tumor growth during targeted therapy.
    hypothesis_groups:
    - acquired_mapk_inhibitor_resistance_model
    evidence:
    - reference: PMID:23569304
      reference_title: Pharmacodynamic effects and mechanisms of resistance to vemurafenib in patients with metastatic melanoma.
      supports: SUPPORT

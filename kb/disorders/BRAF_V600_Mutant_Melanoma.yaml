  description: >-
    Conditional melanocyte-specific Braf V600E produces benign melanocytic
    hyperplasia without melanoma over prolonged observation. Adding Pten loss
    produces rapid, fully penetrant melanoma with lymph-node and lung
    metastases, modeling oncogene initiation, progression restraint, and
    PI3K-pathway cooperation.
  associated_phenotypes:

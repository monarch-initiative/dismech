phenotypes:
- category: Neoplastic
  name: Cutaneous Melanoma
  frequency: OBLIGATE
  diagnostic: true
  description: >-
    A malignant melanoma arising in skin is the defining tumor phenotype for
    this entry. The BRAF V600 result subdivides cutaneous melanoma but does not
    substitute for its clinicopathologic diagnosis.
  phenotype_term:
    preferred_term: Cutaneous melanoma
    term:

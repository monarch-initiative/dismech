    explanation: The guideline establishes the cutaneous melanoma disease context.
- category: Neoplastic
  name: Progressive Metastatic Disease
  description: >-
    Stage III or IV disease can progress through regional or distant tumor
    growth. During targeted therapy, molecularly heterogeneous resistant lesions
    can restore MAPK signaling and resume growth.
  phenotype_term:
    preferred_term: Neoplasm

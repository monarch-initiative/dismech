  attaches_to:
  - genetic#BRAF p.Val600Arg
  - genetic#BRAF p.Val600Met
  rationale: >-
    Molecular testing confirms that rare V600 alleles exist, but the pivotal
    adjuvant and metastatic trials are dominated by or restricted to V600E/K.
    COMBI-MB included a small V600D/K/R cohort, which is not enough to assume
    identical efficacy for every rare allele and disease stage.
  evidence:
  - reference: PMID:28592387
    reference_title: "Dabrafenib plus trametinib in patients with BRAF(V600)-mutant melanoma brain metastases (COMBI-MB): a multicentre, multicohort, open-label, phase 2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: BRAFV600D/K/R-positive, asymptomatic melanoma brain metastases
    explanation: The small mixed-allele cohort makes the evidence boundary explicit.
- discussion_id: interpretation_first_line_systemic_sequence
  prompt: >-
    Which patients with treatment-naive metastatic BRAF V600 melanoma should
    begin with checkpoint immunotherapy, targeted therapy, or a short planned
    targeted induction?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - treatments#Immune Checkpoint Blockade
  - treatments#Dabrafenib Plus Trametinib for Unresectable or Metastatic Disease
  - treatments#Encorafenib Plus Binimetinib
  rationale: >-
    DREAMseq and SECOMBIT support immunotherapy first for most enrolled
    patients, while current guidance still allows BRAF/MEK inhibition first in
    selected cases. Rapidly progressive symptomatic disease, brain metastases,
    prior adjuvant therapy, contraindications, and the limited feasibility of
    crossover make individual sequencing more nuanced than a universal rule.
  evidence:
  - reference: PMID:36166727
    reference_title: "Combination Dabrafenib and Trametinib Versus Combination Nivolumab and Ipilimumab for Patients With Advanced BRAF-Mutant Melanoma: The DREAMseq Trial-ECOG-ACRIN EA6134."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Crossover occurred in 52% of patients with documented disease progression.
    explanation: Limited crossover feasibility is directly relevant to real sequencing decisions.
  - reference: PMID:39709737
    reference_title: "European consensus-based interdisciplinary guideline for melanoma. Part 2: Treatment - Update 2024."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: In stage IV melanoma with a BRAFV600 mutation, first-line therapy with BRAF/MEK inhibitors can be offered as an alternative to immunotherapy, in selected cases.
    explanation: Current guidance preserves a selected-case targeted-first option.
- discussion_id: gap_ctdna_guided_intervention
  prompt: >-
    Can postoperative or on-treatment BRAF V600 ctDNA be used prospectively to
    start, intensify, de-escalate, or switch therapy?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - biochemical#Plasma BRAF V600 Circulating Tumor DNA
  rationale: >-
    COMBI-d, COMBI-MB, and COMBI-AD biomarker analyses show prognostic
    association and useful kinetics, but they did not validate a ctDNA-directed
    intervention strategy.
  evidence:
  - reference: PMID:40250457
    reference_title: "Clinical validation of droplet digital PCR assays in detecting BRAF(V600)-mutant circulating tumour DNA as a prognostic biomarker in patients with resected stage III melanoma receiving adjuvant therapy (COMBI-AD): a biomarker analysis from a double-blind, randomised phase 3 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Additional studies using ctDNA measurements to guide therapeutic interventions might lead to improvements in the management of resected stage III melanoma.
    explanation: The authors explicitly identify intervention-guiding validation as future work.
- discussion_id: gap_human_progression_model_fidelity
  prompt: >-
    Which cooperating lesions and cell states are necessary and sufficient for
    BRAF V600-initiated human melanocytes to become invasive and metastatic?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#PTEN-Loss and PI3K-AKT-mTOR Cooperation
  rationale: >-
    Conditional mouse and zebrafish models establish multi-hit progression and
    provide tractable systems, but engineered germline or synchronous driver
    combinations do not reproduce the timing, UV background, clonal diversity,
    and immune history of every human tumor.
  evidence:
  - reference: PMID:24148783
    reference_title: The genetic heterogeneity and mutational burden of engineered melanomas in zebrafish models.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Engineered zebrafish melanomas show an overall low mutation burden.
    explanation: The model's low-burden, no-UV context exposes a clear mismatch with many human cutaneous melanomas.

disease_term:
  preferred_term: cutaneous melanoma
  term:
    id: MONDO:0005012
    label: cutaneous melanoma
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0005012
      label: cutaneous melanoma
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO
    mapping_justification: >-
      BRAF V600-mutant melanoma is a molecularly defined stratum of MONDO's cutaneous melanoma
      class, not the class itself: MONDO has no term for the
      BRAF V600E/K kinase-domain mutation stratum, so `disease_term` anchors to the parent
      term while this narrowMatch records that the entry is narrower than it.
      Required by design decisions section 3a for a promoted L4 biomarker
      stratum, which must never present bare parent-term reuse as an exact
      match; the parent term itself is claimed as an exactMatch by
      Cutaneous_Melanoma. Filing a MONDO NTR for this stratum is a tracked
      follow-up.

classifications:
  icdo_morphology:
    classification_value: Melanoma
    evidence:
    - reference: PMID:39700658
      reference_title: "European consensus-based interdisciplinary guideline for melanoma. Part 1: Diagnostics - Update 2024."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Cutaneous melanoma (CM) is the most dangerous form of skin tumor and accounts for 90 % of skin cancer mortality.
      explanation: The guideline establishes the melanoma morphology and cutaneous context.
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY
    evidence:
    - reference: PMID:26091043
      reference_title: Genomic Classification of Cutaneous Melanoma.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: We describe the landscape of genomic alterations in cutaneous melanomas through DNA, RNA, and protein-based analysis of 333 primary and/or metastatic melanomas from 331 patients.
      explanation: The integrated cancer cohort supports oncology classification.
review_notes: >-
  MONDO does not provide a dedicated term for this exact molecular subtype, so
  disease_term binds the cutaneous melanoma parent. The entry deliberately
  excludes non-V600 BRAF melanoma and does not generalize cutaneous evidence to
  uveal, mucosal, or acral melanoma without site-specific support. Variant
  frequencies are cohort observations. Treatment assertions distinguish
  V600E/K registration evidence from the thinner rare-V600 evidence base.
  DREAMseq and SECOMBIT favor immunotherapy-first sequencing for most enrolled
  metastatic patients, while current guidance retains targeted-first treatment
  for selected cases. TCGA-SKCM is represented as a broad cutaneous-melanoma
  dataset rather than a pure BRAF V600-only cohort.


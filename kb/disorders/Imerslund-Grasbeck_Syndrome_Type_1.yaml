  evidence:
  - reference: PMID:16722557
    reference_title: Imerslund-Gräsbeck syndrome (selective vitamin B(12) malabsorption with proteinuria).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mild proteinuria (with no signs of kidney disease) is present in about half of the patients.
    explanation: >-

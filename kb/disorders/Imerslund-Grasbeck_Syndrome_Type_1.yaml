pathophysiology:
- name: Biallelic CUBN Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Nonsense, frameshift, splice and missense variants on both CUBN alleles.
    Cubilin is a 460 kDa protein built from an N-terminal alpha helix, eight EGF
    domains and 27 CUB domains; the intrinsic factor-cobalamin binding site is
    CUB domains 5-8 and the amnionless-binding region is the N-terminal helix.
    Both lie in the N-terminal third, which is where IGS-causing alleles fall.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Failure of Cubam Receptor Assembly at the Brush Border
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23746554
      reference_title: An exon 53 frameshift mutation in CUBN abrogates cubam function and causes Imerslund-Gräsbeck syndrome in dogs.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The region included CUBN, the locus encoding cubilin, a peripheral membrane protein that in concert with AMN forms the functional intrinsic factor-cobalamin receptor expressed in ileum and a multi-ligand receptor in renal proximal tubules.
      explanation: >-
        States that cubilin only forms a functional receptor in concert with
        AMN, which is the step this edge asserts, and names both epithelia the
        receptor serves.
  evidence:
  - reference: PMID:10080186
    reference_title: Mutations in CUBN, encoding the intrinsic factor-vitamin B12 receptor, cubilin, cause hereditary megaloblastic anaemia 1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have now refined the MGA1 region by linkage disequilibrium (LD) mapping, fine-mapped CUBN and identified two independent disease-specific CUBN mutations in 17 Finnish MGA1 families.
    explanation: >-
      The genetic evidence that CUBN variants are the lesion in this disease.
  - reference: PMID:23746554
    reference_title: An exon 53 frameshift mutation in CUBN abrogates cubam function and causes Imerslund-Gräsbeck syndrome in dogs.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      CUB domains 5-8 comprise the essential IF-Cbl binding site ... and the N-terminal alpha helical region mediates association with AMN
    explanation: >-
      Locates the two functional sites within cubilin that an IGS-causing allele
      has to damage. Quoted in the ellipsis form the snippet auditor supports,
      because the source's inline citation markers sit between the two clauses.
- name: Failure of Cubam Receptor Assembly at the Brush Border
  biological_scale: MOLECULAR
  description: >-
    Cubilin has no transmembrane domain and no endocytic motif of its own.
    Amnionless supplies both, binding the N-terminal third of cubilin and
    carrying it to the apical surface; neither subunit endocytoses ligand alone.
    A cubilin that cannot bind amnionless, or cannot bind intrinsic
    factor-cobalamin, leaves a brush border without a working receptor.

    Cubam is not the whole endocytic machine. Megalin (LRP2) is required for
    efficient internalization of cubilin and its ligands, so apical uptake
    depends on a three-protein system in which CUBN supplies ligand
    recognition and the other two supply membrane anchoring and internalization.
    The same cubilin regions bind intrinsic factor-cobalamin and albumin, which
    is why one receptor lesion produces both the intestinal and the renal arm of
    this disease rather than one or the other.
  cellular_components:
  - preferred_term: apical brush border membrane
    term:
      id: GO:0016324
      label: apical plasma membrane
  molecular_functions:
  - preferred_term: intrinsic factor-cobalamin binding by cubilin
    modifier: DECREASED
    term:
      id: GO:0031419
      label: cobalamin binding
  downstream:
  - target: Loss of Ileal Intrinsic Factor-Cobalamin Endocytosis
    causal_link_type: DIRECT
  - target: Loss of Proximal Tubular Reabsorption of Filtered Protein
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:14576052
    reference_title: The functional cobalamin (vitamin B12)-intrinsic factor receptor is a novel complex of cubilin and amnionless.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In transfected cells expressing either AMN or a truncated IF-cobalamin-binding cubilin construct, neither protein alone conferred ligand endocytosis.
    explanation: >-
      The transfection experiment establishing that a lone cubilin subunit
      cannot endocytose ligand, which is why a CUBN lesion abolishes receptor
      function rather than merely reducing it.
  - reference: PMID:14576052
    reference_title: The functional cobalamin (vitamin B12)-intrinsic factor receptor is a novel complex of cubilin and amnionless.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These data indicate that cubilin and AMN are subunits of a novel cubilin/AMN (cubam) complex, where AMN binds to the amino-terminal third of cubilin and directs subcellular localization and endocytosis of cubilin with its ligand.
    explanation: >-
      Defines the cubam complex and the division of labour between its two
      subunits that this node depends on.
  - reference: PMID:20237569
    reference_title: Structural basis for receptor recognition of vitamin-B(12)-intrinsic factor complexes.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      This occurs by the combined action of the gastric intrinsic factor (IF) and the ileal endocytic cubam receptor formed by the 460-kilodalton (kDa) protein cubilin and the 45-kDa transmembrane protein amnionless.
    explanation: >-
      Names the two cubam subunits and their masses, and places the complex at
      the ileal apical surface where this node locates the failure. Graded
      INDIRECT because this is the paper's statement of normal physiology, from
      which the consequence of losing the receptor follows by inference.
  - reference: PMID:30295181
    reference_title: "Cubilin, the Intrinsic Factor-Vitamin B12 Receptor in Development and Disease."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      AMN is involved in appropriate plasma membrane transport of Cubilin whereas Lrp2 is essential for efficient internalization of Cubilin and its ligands.
    explanation: >-
      Adds megalin/LRP2 as a third required component of apical uptake. Graded
      INDIRECT because the review states the general requirement for cubilin
      internalization rather than measuring it in an IGS receptor.
  - reference: PMID:15845892
    reference_title: Amnionless function is required for cubilin brush-border expression and intrinsic factor-cobalamin (vitamin B12) absorption in vivo.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Studies in vivo demonstrated that both mutations abrogate AMN expression and block cubilin processing and targeting to the apical membrane.
    explanation: >-
      Shows the subunit interdependence in a whole animal rather than a
      transfected cell. Graded INDIRECT because the lesion studied is in AMN and
      this entry's lesion is in CUBN; it establishes that the two subunits are
      mutually required, not that a CUBN allele does this.
  - reference: PMID:11581259
    reference_title: Identification and characterization of two distinct ligand binding regions of cubilin.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      These results indicate that (a) cubilin contains two distinct regions that bind both IF-Cbl and albumin
    explanation: >-
      The shared-ligand result behind the two-organ split. Graded INDIRECT
      because it maps binding regions in a cell-free system rather than showing
      that an IGS allele abolishes both ligands at once.
- name: Loss of Ileal Intrinsic Factor-Cobalamin Endocytosis
  biological_scale: CELLULAR
  description: >-
    Every upstream step of cobalamin handling is normal: gastric acid, intrinsic
    factor secretion, haptocorrin release and pancreatic proteolysis. The block
    is at the single receptor-mediated uptake step in the distal ileum, which is
    why the malabsorption is selective for cobalamin rather than general, and
    why giving intrinsic factor with the test dose does not correct it.
  cell_types:
  - preferred_term: ileal enterocyte
    term:
      id: CL:1000334
      label: enterocyte of epithelium of small intestine
  biological_processes:
  - preferred_term: receptor-mediated uptake of the intrinsic factor-cobalamin complex
    modifier: DECREASED
    term:
      id: GO:0006898
      label: receptor-mediated endocytosis
  - preferred_term: intestinal cobalamin transport
    modifier: DECREASED
    term:
      id: GO:0015889
      label: cobalamin transport
  downstream:
  - target: Systemic Cobalamin Deficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16722557
      reference_title: Imerslund-Gräsbeck syndrome (selective vitamin B(12) malabsorption with proteinuria).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        IGS is caused by a selective incapacity to transport vitamin B12 across the intestinal wall, and is not related to a lack of gastric intrinsic factor.
      explanation: >-
        States that the transport failure is what produces the deficiency, and
        excludes the upstream intrinsic-factor step as the cause.
  evidence:
  - reference: PMID:16722557
    reference_title: Imerslund-Gräsbeck syndrome (selective vitamin B(12) malabsorption with proteinuria).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The cause is a defect in the receptor of the vitamin B(12)-intrinsic factor complex of the ileal enterocyte.
    explanation: >-
      Names the cell and the receptor step at which absorption fails.
  - reference: PMID:16722557
    reference_title: Imerslund-Gräsbeck syndrome (selective vitamin B(12) malabsorption with proteinuria).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vitamin B(12) absorption tests show low absorption, not corrected by administration of intrinsic factor.
    explanation: >-
      The observation that localises the block distal to intrinsic factor, which
      is what distinguishes this node from pernicious anemia.
- name: Loss of Proximal Tubular Reabsorption of Filtered Protein
  biological_scale: CELLULAR
  description: >-
    The same receptor operates in the proximal tubule, where it retrieves
    albumin, vitamin D binding protein, transferrin, apolipoprotein A1 and other
    filtered proteins from the primary urine. Cubam loss there produces
    persistent proteinuria with a high albumin fraction. This arm runs in
    parallel with the intestinal arm from the same lesion; it is not a
    consequence of the cobalamin deficiency, which is why replacing cobalamin
    does not touch it.
  cell_types:
  - preferred_term: renal proximal tubule epithelial cell
    term:
      id: CL:0002306
      label: epithelial cell of proximal tubule
  biological_processes:
  - preferred_term: receptor-mediated retrieval of filtered protein
    modifier: DECREASED
    term:
      id: GO:0006898
      label: receptor-mediated endocytosis
  downstream:
  - target: Persistent Non-Progressive Proteinuria
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:23746554
    reference_title: An exon 53 frameshift mutation in CUBN abrogates cubam function and causes Imerslund-Gräsbeck syndrome in dogs.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cubam is a multi-ligand, endocytic receptor expressed in epithelial brush borders of distal small intestine and renal proximal tubules.
    explanation: >-
      Places the same receptor in the proximal tubule, which is what makes the
      renal arm a direct consequence of the same lesion.
  - reference: PMID:31613795
    reference_title: Human C-terminal CUBN variants associate with chronic proteinuria and normal renal function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Collectively, our data suggest an important role for the C-terminal half of cubilin in renal albumin reabsorption.
    explanation: >-
      Human genetic evidence that cubilin function is what performs the tubular
      albumin retrieval this node describes.
  - reference: PMID:24156255
    reference_title: Detailed investigations of proximal tubular function in Imerslund-Gräsbeck syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of urinary protein excretion in the patients and 20 healthy controls revealed increased urinary excretion of cubilin ligands including apolipoprotein A-I, transferrin, vitamin D-binding protein, and albumin.
    explanation: >-
      Measures the lost reabsorption directly in IGS patients, and names the
      ligands, which is what makes this a cubilin-ligand leak rather than
      generic tubular injury.
  - reference: PMID:24156255
    reference_title: Detailed investigations of proximal tubular function in Imerslund-Gräsbeck syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This was, however, only observed in patients where plasma membrane expression of cubilin was predicted to be perturbed.
    explanation: >-
      Ties the renal arm to receptor surface expression rather than to the
      diagnosis. Patients whose cubilin still reaches the membrane did not leak.
- name: Systemic Cobalamin Deficiency
  biological_scale: ORGANISM
  description: >-
    Body cobalamin stores are large relative to daily need, so the deficiency
    declares itself only after maternal stores run down, from about four months
    of age and sometimes not for years. Both cobalamin-dependent enzymes fail:
    methionine synthase, giving hyperhomocysteinemia and the functional folate
    trap that blocks thymidylate synthesis, and methylmalonyl-CoA mutase, giving
    methylmalonic acidemia and aciduria.
  downstream:
  - target: Megaloblastic Erythropoiesis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:16722557
    reference_title: Imerslund-Gräsbeck syndrome (selective vitamin B(12) malabsorption with proteinuria).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The symptoms appear from 4 months (not immediately after birth as in transcobalamin deficiency) up to several years after birth.
    explanation: >-
      The delayed onset that follows from stores having to be exhausted first,
      and the contrast with a disorder that has no such buffer.
  - reference: PMID:22929189
    reference_title: "Inherited cobalamin malabsorption. Mutations in three genes reveal functional and ethnic patterns."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recessive mutations in CUBN or AMN cause Imerslund-Gräsbeck Syndrome (IGS), while recessive mutations in GIF cause Intrinsic Factor Deficiency (IFD).
    explanation: >-
      Confirms the gene-to-disease assignment used throughout this entry and
      separates it from the intrinsic-factor disorder with the same downstream
      deficiency.
- name: Megaloblastic Erythropoiesis
  biological_scale: TISSUE
  description: >-
    Cobalamin deficiency traps folate as methyltetrahydrofolate, starving
    thymidylate synthesis. DNA replication in the marrow falls out of step with
    cytoplasmic maturation, so erythroid precursors enlarge and are destroyed
    before release. All rapidly dividing lineages are affected, which is why
    neutropenia and thrombocytopenia accompany the anemia.
  cell_types:
  - preferred_term: erythroid precursor
    term:
      id: CL:0000038
      label: erythroid progenitor cell
  downstream:
  - target: Megaloblastic anemia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:16722557
    reference_title: Imerslund-Gräsbeck syndrome (selective vitamin B(12) malabsorption with proteinuria).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Megaloblastic anemia is caused by inability of the hematopoietic cells to divide, due to failure of DNA replication.
    explanation: >-
      The cellular mechanism this node asserts, stated for this disease.
- name: Persistent Non-Progressive Proteinuria
  biological_scale: ORGANISM
  description: >-
    Proteinuria that is present in roughly half of patients, does not change on
    cobalamin replacement, and does not lead to loss of renal function. It is
    reported as neither typically glomerular nor typically tubular in pattern,
    and in the isolated C-terminal-variant phenotype it is predominantly
    albuminuria.
  downstream:
  - target: Proteinuria
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:16722557
    reference_title: Imerslund-Gräsbeck syndrome (selective vitamin B(12) malabsorption with proteinuria).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both studies indicated that in properly treated patients, the proteinuria persisted over the years without noticeable change and that kidney function did not deteriorate.
    explanation: >-
      Establishes both halves of this node: that the proteinuria survives
      treatment, and that it is not nephrotoxic.
  - reference: PMID:31613795
    reference_title: Human C-terminal CUBN variants associate with chronic proteinuria and normal renal function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, renal function was normal in all cases.
    explanation: >-
      An independent cohort in which biallelic CUBN proteinuria was not
      accompanied by any loss of renal function.
phenotypes:
- name: Megaloblastic anemia
  category: Hematologic
  description: >-
    The presenting abnormality in most cases: macrocytic, megaloblastic and
    fully responsive to parenteral cobalamin.
  phenotype_term:
    preferred_term: Megaloblastic anemia
    term:
      id: HP:0001889
      label: Megaloblastic anemia
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:16722557
    reference_title: Imerslund-Gräsbeck syndrome (selective vitamin B(12) malabsorption with proteinuria).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Imerslund-Gräsbeck syndrome (IGS) or selective vitamin B(12) (cobalamin) malabsorption with proteinuria is a rare autosomal recessive disorder characterized by vitamin B(12) deficiency commonly resulting in megaloblastic anemia, which is responsive to parenteral vitamin B(12) therapy and appears in childhood.
    explanation: >-
      Names megaloblastic anemia as the characteristic manifestation and records
      its response to replacement.
- name: Macrocytic anemia
  category: Hematologic
  description: >-
    The routine-laboratory face of the same finding, with raised mean corpuscular

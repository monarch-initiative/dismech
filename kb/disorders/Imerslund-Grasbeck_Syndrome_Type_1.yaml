name: Imerslund-Grasbeck Syndrome Type 1
creation_date: "2026-09-09T13:40:00Z"
category: Mendelian
synonyms:
- IGS type 1
- IGS-1
- megaloblastic anemia 1
- MGA1
- selective vitamin B12 malabsorption with proteinuria
- enterocyte intrinsic factor receptor, defect of
- CUBN-related Imerslund-Grasbeck syndrome
description: >-
  Imerslund-Grasbeck syndrome type 1 is an autosomal recessive disorder in which
  biallelic CUBN variants disable cubilin, the ligand-binding subunit of the
  cubam receptor. Cubam is a heterodimeric endocytic receptor that sits in the
  brush border of two epithelia only: the ileal enterocyte, where it takes up
  the intrinsic factor-cobalamin complex, and the renal proximal tubule cell,
  where it reabsorbs filtered low-molecular-weight proteins. One receptor lesion
  therefore produces a two-organ disease, and the two organ effects are
  independent of each other.

  The intestinal arm is the one that makes the patient ill. Cobalamin absorption
  fails at the final receptor step while intrinsic factor secretion and gastric
  acid output are normal, so children present between a few months and several
  years of age, once maternal stores are exhausted, with megaloblastic anemia,
  failure to thrive, recurrent infections and, less often, neurological signs.
  It is fully correctable: lifelong parenteral cobalamin restores and maintains
  health.

  The renal arm is not correctable and does not need to be. Proteinuria persists
  unchanged on treatment because cobalamin replacement bypasses the gut but does
  nothing for the tubular receptor, and it does not progress to renal failure.
  Reading that proteinuria as glomerular disease is the characteristic clinical
  error, and it has led to renal biopsies and proteinuria-lowering treatment in
  patients whose kidneys were never going to fail.

  Where in cubilin the lesion falls decides which arm is affected. Variants
  affecting the N-terminal third, which carries the CUB 5-8 intrinsic
  factor-cobalamin binding site and the amnionless-association helix, give the
  full IGS picture. Variants after the vitamin B12-binding domain leave
  cobalamin uptake intact and produce isolated benign albuminuria, a phenotype
  common enough to appear as an association in population cohorts.

- name: Albuminuria
  category: Renal
  description: >-
    In the C-terminal-variant phenotype the proteinuria has a high albumin
    fraction, which is what leads to it being mistaken for glomerular disease.
  phenotype_term:
    preferred_term: Albuminuria
    term:
      id: HP:0012592
      label: Albuminuria
  evidence:
  - reference: PMID:31613795
    reference_title: Human C-terminal CUBN variants associate with chronic proteinuria and normal renal function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since the proteinuria in these patients had a high proportion of albuminuria, glomerular diseases such as steroid-resistant nephrotic syndrome or Alport syndrome were often the primary clinical diagnosis, motivating renal biopsies and the use of proteinuria-lowering treatments.
    explanation: >-
      Records the albumin-predominant pattern and the misdiagnosis it causes.
- name: Decreased circulating vitamin B12 concentration
  category: Biochemical
  description: >-
    Low serum cobalamin is the entry point to the diagnosis; the subsequent work
    is establishing that malabsorption is the cause and that it is selective.
  phenotype_term:
    preferred_term: Decreased circulating vitamin B12 concentration
    term:
      id: HP:0100502
      label: Decreased circulating vitamin B12 concentration
  evidence:
  - reference: PMID:37710296
    reference_title: "Imerslund-Gräsbeck syndrome: a comprehensive review of reported cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Imerslund-Gräsbeck syndrome (IGS, OMIM 261,100/618,882) is an autosomal recessive disorder characterized by a vitamin B12 (vitB12) deficiency, caused by a selective malabsorption of vitB12, with normal secretion of intrinsic factor (IF) and hydrochloric acid into the stomach [1].
    explanation: >-
      States the deficiency and, in the same sentence, that the upstream gastric
      steps are intact.
- name: Failure to thrive
  category: Growth
  description: >-
    Often the reason the child is brought to attention, before anemia is found.
  phenotype_term:
    preferred_term: Failure to thrive
    term:
      id: HP:0001508
      label: Failure to thrive
  evidence:
  - reference: PMID:37710296
    reference_title: "Imerslund-Gräsbeck syndrome: a comprehensive review of reported cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Before the diagnosis of vitB12 deficiency, patients have non-specific symptoms such as failure to thrive, paleness, fatigue, recurring viral infections and mild neurological symptoms.
    explanation: >-
      Lists failure to thrive among the presenting non-specific features.
- name: Recurrent infections
  category: Immunologic
  description: >-
    Recurrent viral and other infections, attributable to the cobalamin-dependent
    marrow failure affecting the leukocyte lineages as well as the erythroid one.
  phenotype_term:
    preferred_term: Recurrent infections
    term:
      id: HP:0002719
      label: Recurrent infections
  evidence:
  - reference: PMID:37710296
    reference_title: "Imerslund-Gräsbeck syndrome: a comprehensive review of reported cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Before the diagnosis of vitB12 deficiency, patients have non-specific symptoms such as failure to thrive, paleness, fatigue, recurring viral infections and mild neurological symptoms.
    explanation: >-
      The same presenting-symptom list, quoted for the infection component.
- name: Methylmalonic aciduria
  category: Biochemical
  description: >-
    Raised urinary methylmalonic acid reflects failure of the second
    cobalamin-dependent enzyme, methylmalonyl-CoA mutase. It is the marker used
    to follow adequacy of replacement.
  phenotype_term:
    preferred_term: Methylmalonic aciduria
    term:
      id: HP:0012120
      label: Methylmalonic aciduria
  evidence:
  - reference: PMID:23746554
    reference_title: An exon 53 frameshift mutation in CUBN abrogates cubam function and causes Imerslund-Gräsbeck syndrome in dogs.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Other documented abnormalities included low serum cobalamin concentrations, methylmalonic aciduria, and mild proteinuria.
    explanation: >-
      Records methylmalonic aciduria in the CUBN-mutant canine disease. Graded
      as model-organism evidence because the cohort described is canine; the
      marker itself is standard in the human disorder.
- name: Hyperhomocystinemia
  category: Biochemical
  description: >-
    Raised plasma homocysteine follows from methionine synthase failure and
    accompanies the raised methylmalonate.
  phenotype_term:
    preferred_term: Hyperhomocystinemia
    term:
      id: HP:0002160
      label: Hyperhomocystinemia
  evidence:
  - reference: PMID:22078000
    reference_title: Ancient founder mutation is responsible for Imerslund-Gräsbeck Syndrome among diverse ethnicities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The primary diagnostic criteria are reduced vitamin B12 levels in the serum, elevated homocysteine and methylmalonic acid levels in the blood and urine, and often mild proteinuria [3].
    explanation: >-
      Lists the two raised metabolites among the diagnostic criteria for IGS.
      The cohort in this paper is AMN-mutant, so the quote is used only for the
      biochemistry shared by both genes, not for any CUBN-specific claim.
genetic:
- name: CUBN
  association: Causal biallelic variant
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: CUBN
    term:
      id: hgnc:2548
      label: CUBN
  notes: >-
    Cubilin is the 460 kDa ligand-binding subunit of cubam, encoded in 67 exons
    on chromosome 10p12.1.

    Where the variant falls in the gene decides which of the two organ arms is
    affected, and this is the most useful genotype-phenotype fact about CUBN.
    IGS-causing alleles cluster in the N-terminal third, which holds both the
    amnionless-association helix and the CUB 5-8 intrinsic factor-cobalamin
    binding site. Variants after the vitamin B12-binding domain leave intestinal
    cobalamin uptake intact and present instead as isolated childhood-onset
    albuminuria with normal renal function, a phenotype mild enough that four
    such variants show up as albuminuria associations in population cohorts. A
    C-terminal CUBN genotype should therefore not be reported as IGS without
    evidence of cobalamin malabsorption.
  evidence:
  - reference: PMID:31613795
    reference_title: Human C-terminal CUBN variants associate with chronic proteinuria and normal renal function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Unlike the more N-terminal IGS mutations, 37 of the 41 proteinuria-associated CUBN variants led to modifications or truncations after the vitamin B12-binding domain.
    explanation: >-
      The positional split itself, stated as a contrast against the IGS allele
      distribution.
  - reference: PMID:31613795
    reference_title: Human C-terminal CUBN variants associate with chronic proteinuria and normal renal function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 39 patients, in whom biallelic pathogenic variants in the CUBN gene were associated with chronic isolated proteinuria and early childhood onset.
    explanation: >-
      The cohort establishing the isolated-proteinuria end of the CUBN spectrum.
  - reference: PMID:31613795
    reference_title: Human C-terminal CUBN variants associate with chronic proteinuria and normal renal function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Finally, we show that 4 C-terminal CUBN variants are associated with albuminuria and slightly increased GFR in meta-analyses of large population-based cohorts.
    explanation: >-
      The population-cohort signal, which is what makes the C-terminal phenotype
      a common benign condition rather than a rare disease variant.
  variants:
  - name: c.3890C>T (p.Pro1297Leu), Finnish founder allele FM1
    description: >-
      The Finnish major mutation. It sits in CUB domain 8, inside the CUB 5-8
      intrinsic factor-cobalamin binding region, and is a missense change rather
      than a truncation, so cubilin still reaches the brush border. What it
      destroys is ligand recognition: surface plasmon resonance shows the
      substitution raises the dissociation constant for intrinsic
      factor-cobalamin several-fold, mostly by slowing association. This is the
      allele behind the Finnish prevalence figure this entry records, and it is
      the cleanest evidence that IGS is a receptor-affinity disease and not only
      a receptor-abundance one.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:10887099
      reference_title: Cubilin P1297L mutation associated with hereditary megaloblastic anemia 1 causes impaired recognition of intrinsic factor-vitamin B(12) by cubilin.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Most Finnish patients with MGA1 carry the disease-specific P1297L mutation (FM1) in the IF-B(12) receptor, cubilin.
      explanation: >-
        Establishes P1297L as the predominant Finnish allele and names it FM1.
    - reference: PMID:10887099
      reference_title: Cubilin P1297L mutation associated with hereditary megaloblastic anemia 1 causes impaired recognition of intrinsic factor-vitamin B(12) by cubilin.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Surface plasmon resonance analysis revealed that the P1297L substitution specifically increases the K(d) for IF-Cbl binding several-fold, largely by decreasing the association rate constant.
      explanation: >-
        The binding measurement that gives the allele its mechanism, and the
        basis for calling this a loss of ligand affinity rather than a loss of
        receptor.
treatments:
- name: Lifelong parenteral cobalamin replacement
  description: >-
    Intramuscular cobalamin bypasses the absent receptor entirely. It corrects
    the anemia, the metabolite abnormalities and the growth failure, and holds
    patients well for decades. It has no effect on the proteinuria, and it does
    not need to: the renal arm is not progressive. Replacement is lifelong
    because the receptor defect is permanent.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydroxocobalamin
      term:
        id: CHEBI:27786
        label: hydroxocobalamin
    - preferred_term: cyanocobalamin
      term:
        id: CHEBI:17439
        label: cyanocob(III)alamin
  target_mechanisms:
  - target: Systemic Cobalamin Deficiency
    description: >-
      Parenteral delivery restores tissue cobalamin without using the ileal
      receptor, so it corrects everything downstream of this node and nothing
      upstream of it.
  target_phenotypes:
  - preferred_term: Megaloblastic anemia
    term:
      id: HP:0001889
      label: Megaloblastic anemia
  evidence:
  - reference: PMID:16722557
    reference_title: Imerslund-Gräsbeck syndrome (selective vitamin B(12) malabsorption with proteinuria).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Management includes life-long vitamin B(12) injections, and with this regimen, the patients stay healthy for decades. However, the proteinuria persists.
    explanation: >-
      States the treatment, its duration, its effectiveness and the one thing it
      does not fix.
  - reference: PMID:37710296
    reference_title: "Imerslund-Gräsbeck syndrome: a comprehensive review of reported cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most IGS patients are treated with intra-muscular vitB12, which most frequently corrects the clinical phenotype [1].
    explanation: >-
      Confirms the route and the outcome across the reported case literature.
- name: High-dose oral cobalamin
  description: >-
    Passive diffusion absorbs a small fraction of an oral dose independently of
    any receptor, so a large enough daily oral dose could in principle substitute
    for injections. The direct evidence in this disease is canine: three Beagles
    with hereditary cobalamin malabsorption were maintained in clinical and
    metabolic remission on 1 mg oral cyanocobalamin daily. No equivalent human
    trial exists in IGS, so this is recorded as a supported hypothesis rather
    than established practice.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cyanocobalamin
      term:
        id: CHEBI:17439
        label: cyanocob(III)alamin
  target_mechanisms:
  - target: Systemic Cobalamin Deficiency
    description: >-
      The same node by a different route: receptor-independent passive uptake in
      place of the missing endocytic step.
  evidence:
  - reference: PMID:30554416
    reference_title: Daily oral cyanocobalamin supplementation in Beagles with hereditary cobalamin malabsorption (Imerslund-Gräsbeck syndrome) maintains normal clinical and cellular cobalamin status.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      One milligram of cyano-Cbl daily PO appears efficacious for maintaining normal clinical status and normal cellular markers of Cbl metabolism in Beagles with IGS.
    explanation: >-
      The canine result. Recorded as model-organism evidence and deliberately
      not extended to a human recommendation.
diagnosis:
- name: Selective cobalamin malabsorption with normal intrinsic factor
  description: >-
    The diagnostic logic is subtractive: establish cobalamin deficiency, show it
    is due to malabsorption, show the malabsorption is not corrected by giving
    intrinsic factor, and exclude the other causes of cobalamin malabsorption. A
    trap sits inside this. Cobalamin deficiency itself damages enterocyte
    function, so absorption testing during the deficient state can read as
    generalised malabsorption; tests must be repeated after the deficiency is
    corrected. That is one reason molecular testing of CUBN, AMN and GIF has
    largely displaced absorption testing.
  evidence:
  - reference: PMID:16722557
    reference_title: Imerslund-Gräsbeck syndrome (selective vitamin B(12) malabsorption with proteinuria).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In diagnosing this disease, it is important to be aware that cobalamin deficiency affects enterocyte function; therefore, all tests suggesting general and cobalamin malabsorption should be repeated after abolishment of the deficiency.
    explanation: >-
      The confounding effect of the deficiency on the test used to diagnose it,
      and the remedy.
differential_diagnoses:
- name: Imerslund-Grasbeck syndrome type 2
  disease_term:
    preferred_term: Imerslund-Grasbeck syndrome type 2
    term:
      id: MONDO:0100157
      label: Imerslund-Grasbeck syndrome type 2
  description: >-
    The AMN half of the same receptor. Clinically it is the same disease and is
    not separable at the bedside; only sequencing distinguishes them.
  distinguishing_features:
  - Biallelic AMN variants rather than CUBN variants.
  - The Norwegian founder cluster and the Middle Eastern AMN c.208-2A>G founder allele belong to type 2.
  - Congenital urinary tract anomalies were reported in the original Norwegian AMN-mutant series and were rare in the Finnish CUBN-mutant patients.
  evidence:
  - reference: PMID:16722557
    reference_title: Imerslund-Gräsbeck syndrome (selective vitamin B(12) malabsorption with proteinuria).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Congenital anomalies were rare in the Finnish patients carrying the CUBN mutation but urinary tract anomalies were observed in the Norwegian patients carrying the AMN mutation.
    explanation: >-
      The one reported phenotypic difference between the two genes.
  - reference: PMID:22078000
    reference_title: Ancient founder mutation is responsible for Imerslund-Gräsbeck Syndrome among diverse ethnicities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This mutation causes over 50% of the IGS cases among Arabic, Turkish, and Sephardic Jewish families, making it a primary target for genetic screening among diverse IGS cases originating from the Middle East.
    explanation: >-
      The founder allele referred to is AMN c.208-2A>G, so this quote assigns
      the majority of Middle Eastern IGS to type 2 rather than to this entry.
- name: Hereditary intrinsic factor deficiency
  disease_term:
    preferred_term: hereditary intrinsic factor deficiency
    term:
      id: MONDO:0009852
      label: hereditary intrinsic factor deficiency
  description: >-
    GIF variants abolish intrinsic factor itself rather than its receptor. The
    cobalamin deficiency is identical; the receptor is intact, so absorption is
    corrected by giving intrinsic factor, and there is no proteinuria.
    Historically a substantial share of published IGS cases were GIF cases.
  distinguishing_features:
  - Proteinuria is typical of IGS and absent in intrinsic factor deficiency.
  - Absorption is corrected by administering intrinsic factor in GIF deficiency and is not in IGS.
  - The causal gene is GIF rather than CUBN or AMN.
  evidence:
  - reference: PMID:22929189
    reference_title: "Inherited cobalamin malabsorption. Mutations in three genes reveal functional and ethnic patterns."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recessive mutations in CUBN or AMN cause Imerslund-Gräsbeck Syndrome (IGS), while recessive mutations in GIF cause Intrinsic Factor Deficiency (IFD).
    explanation: >-
      The gene-level separation between the two disorders.
  - reference: PMID:16722557
    reference_title: Imerslund-Gräsbeck syndrome (selective vitamin B(12) malabsorption with proteinuria).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A recent study reported that IGS is difficult to distinguish from cases caused by mutations in the GIF (gastric intrinsic factor) gene [20]
    explanation: >-
      Records that the two have in practice been confused, which is why this
      differential is listed among the cobalamin disorders.
- name: Steroid-resistant nephrotic syndrome
  description: >-
    Not a mechanistic mimic but the practical one: albumin-predominant
    proteinuria in a child invites a glomerular diagnosis, a renal biopsy and
    proteinuria-lowering treatment, none of which the CUBN patient needs.
  distinguishing_features:
  - Renal function stays normal in CUBN-related proteinuria and declines in steroid-resistant nephrotic syndrome.
  - No biallelic CUBN variants were found in proteinuric patients with reduced renal function or focal segmental glomerulosclerosis.
  evidence:
  - reference: PMID:31613795
    reference_title: Human C-terminal CUBN variants associate with chronic proteinuria and normal renal function.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By contrast, we did not found any biallelic CUBN variants in proteinuric patients with reduced renal function or focal segmental glomerulosclerosis.
    explanation: >-
      The negative result that separates the two. Quoted verbatim, including the
      source's own grammatical slip.
animal_models:
- name: Border Collie CUBN exon 53 frameshift
  species: Dog
  genotype: CUBN exon 53 single-base deletion, homozygous
  publication: PMID:23746554
  description: >-
    A naturally occurring canine CUBN disease. It is the model in which a CUBN
    lesion, rather than an AMN one, produces the syndrome, which matters because
    the mouse is not usable here: cubam has rodent-specific functions in
    embryogenesis and the AMN knockout is embryonic lethal. The Border Collie
    disease is milder and later in onset than the giant schnauzer and Australian
    shepherd AMN diseases.
  modeled_mechanisms:
  - target: Failure of Cubam Receptor Assembly at the Brush Border
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      A spontaneous biallelic CUBN lesion in an outbred animal, producing
      cobalamin malabsorption with selective proteinuria, the same two-organ
      pattern as the human disease and from the same gene.
    limitations: >-
      The canine allele is a C-terminal (exon 53) frameshift, whereas human IGS
      alleles cluster in the N-terminal third. The model therefore demonstrates
      that a CUBN lesion can abrogate cubam function, but its allele is not
      positionally representative of the human mutation spectrum, and human
      C-terminal variants give isolated proteinuria rather than IGS. Fidelity is
      recorded as MODERATE rather than HIGH for that reason.
    evidence:
    - reference: PMID:23746554
      reference_title: An exon 53 frameshift mutation in CUBN abrogates cubam function and causes Imerslund-Gräsbeck syndrome in dogs.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Dogs closely model human clinical cobalamin deficiency and cubam function. Genetic studies in mice on the receptor complex have been hampered by rodent-specific functions of cubam essential for embryonic development.
      explanation: >-
        States why the dog is the model of record for cubam and why the mouse is
        not, which is the basis for treating this model as informative.
    - reference: PMID:23746554
      reference_title: An exon 53 frameshift mutation in CUBN abrogates cubam function and causes Imerslund-Gräsbeck syndrome in dogs.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The border collie disorder indicates that a CUBN mutation far C-terminal from the intrinsic factor-cobalamin binding site can abrogate receptor expression and cause Imerslund-Gräsbeck syndrome.
      explanation: >-
        The authors' own reading of the positional mismatch named in this link's
        limitations: a C-terminal canine allele still abolishes the receptor.
    - reference: PMID:23613799
      reference_title: A frameshift mutation in the cubilin gene (CUBN) in Border Collies with Imerslund-Gräsbeck syndrome (selective cobalamin malabsorption).
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This variant, a single base pair deletion (c.8392delC), is predicted to cause a frameshift and premature stop codon in the CUBN gene.
      explanation: >-
        Names the allele independently, in the genome-wide mapping study that
        found it.
- name: Beagle hereditary cobalamin malabsorption
  species: Dog
  genotype: CUBN c.786delC (exon 8), homozygous
  publication: PMID:30554416
  description: >-
    A Beagle kindred with hereditary cobalamin malabsorption, used to test
    whether daily oral cobalamin can replace parenteral dosing.
  modeled_mechanisms:
  - target: Systemic Cobalamin Deficiency
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Used as a treatment-response model rather than a mechanism model: urinary
      methylmalonate is read as the metabolic index of cobalamin sufficiency
      under an oral regimen.
    limitations: >-
      Three animals, no concurrent control arm on the intervention, and one of
      the three excreted high methylmalonate for the first six months. A
      confounding antibiotic course preceded the fall in that animal's
      excretion, so the response cannot be attributed to the oral dose alone.
      The treatment report itself does not name the causal gene; the CUBN
      assignment rests on the separate genetic characterisation of this kindred
      cited below.
    readouts:
    - name: Urinary methylmalonic acid to creatinine ratio
      target: Systemic Cobalamin Deficiency
      direction: UNCHANGED
      interpretation: >-
        Stayed within the healthy-dog range on oral dosing in two of three
        animals, read as maintained cobalamin sufficiency.
      evidence:
      - reference: PMID:30554416
        reference_title: Daily oral cyanocobalamin supplementation in Beagles with hereditary cobalamin malabsorption (Imerslund-Gräsbeck syndrome) maintains normal clinical and cellular cobalamin status.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Urine MMA remained consistently low in 2 dogs (median, 2.5 mmol/mol creatinine; range, 1.2-9; healthy dogs ... median, 2.9 mmol/mol creatinine; range, 1.3-76.5).
        explanation: >-
          The measurement itself, with the healthy-animal comparison it is read
          against. Quoted in the ellipsis form the snippet auditor supports,
          because the source's bracketed cohort size sits mid-sentence.
    evidence:
    - reference: PMID:30554416
      reference_title: Daily oral cyanocobalamin supplementation in Beagles with hereditary cobalamin malabsorption (Imerslund-Gräsbeck syndrome) maintains normal clinical and cellular cobalamin status.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Three client-owned Beagles with IGS and 48 healthy control dogs.
      explanation: >-
        The cohort. Quoted to make the size of the evidence base explicit, since
        the treatment claim rests entirely on these three animals.
    - reference: PMID:24433284
      reference_title: "Selective intestinal cobalamin malabsorption with proteinuria (Imerslund-Gräsbeck syndrome) in juvenile Beagles."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        All affected dogs were homozygous for a single-base deletion in CUBN exon 8 (CUBN c.786delC), predicting a translational frameshift, and the 2 parents tested were heterozygous.
      explanation: >-
        Assigns this kindred to CUBN rather than AMN, which is what makes a
        Beagle treatment result relevant to a CUBN entry at all.
    - reference: PMID:24433284
      reference_title: "Selective intestinal cobalamin malabsorption with proteinuria (Imerslund-Gräsbeck syndrome) in juvenile Beagles."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Affected dogs' kidneys lacked detectable cubilin protein.
      explanation: >-
        Confirms in tissue that the canine allele abolishes cubilin at the site
        this entry's renal arm depends on.
discussions:
- discussion_id: igs1_proteinuria_penetrance
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does proteinuria occur in only about half of IGS patients when the same
    cubam receptor is lost in every case?
  attaches_to:
  - pathophysiology#Loss of Proximal Tubular Reabsorption of Filtered Protein
  - phenotypes#Proteinuria
  rationale: >-
    The intestinal arm of the disease is essentially fully penetrant and the
    renal arm is not, from one lesion in one receptor. Candidate explanations
    have not been separated: residual cubilin function at the tubule for alleles
    that abolish it in the gut, compensation by megalin, an unrecognised
    threshold effect, or simply that intermittent mild proteinuria is
    under-detected. Resolving it would also settle whether absent proteinuria is
    genuinely uninformative for the diagnosis or only appears so.
- discussion_id: igs1_oral_cobalamin_in_humans
  kind: KNOWLEDGE_GAP
  prompt: >-
    Can high-dose oral cobalamin replace lifelong injections in human
    Imerslund-Grasbeck syndrome?
  attaches_to:
  - treatments#High-dose oral cobalamin
  rationale: >-
    The only direct evidence in this disease is three dogs. Receptor-independent
    passive diffusion is well established as a route and oral replacement has
    been adopted in other malabsorptive cobalamin deficiencies, but no human IGS
    trial has been done. The question matters because the alternative is
    intramuscular injection from childhood for life.
  proposed_experiments:
  - experiment_id: igs1_oral_vs_parenteral_noninferiority
    name: Non-inferiority trial of daily oral versus parenteral cobalamin in genetically confirmed IGS
    description: >-
      Randomise genetically confirmed IGS patients in metabolic remission to
      continue parenteral dosing or switch to daily high-dose oral
      cyanocobalamin, with serum cobalamin, plasma homocysteine and urinary
      methylmalonate as the maintenance endpoints.
    readouts:
    - name: Urinary methylmalonic acid
      target: pathophysiology#Systemic Cobalamin Deficiency
      direction: UNCHANGED
      interpretation: >-
        Remaining within the reference interval on the oral arm would indicate
        maintained cobalamin sufficiency.
notes: >-
  Scope and lump/split. MONDO:0100156 is the CUBN half of Imerslund-Grasbeck
  syndrome and MONDO:0100157 is the AMN half. They are clinically
  indistinguishable and are two lesions in one heterodimeric receptor, so
  lumping them under the parent term MONDO:0009853 would be defensible. This
  entry keeps them separate, in line with the KB's per-gene granularity for
  Mendelian disease, and because CUBN has a genotype-phenotype axis of its own,
  the C-terminal isolated-proteinuria phenotype, that has no AMN counterpart.
  IGS type 2 is recorded as a differential diagnosis rather than a subtype.

  Evidence handling worth flagging for a reader. Much of the IGS literature does
  not separate the two genes, and some of the largest papers describe AMN
  cohorts specifically. PMID:22078000 is an AMN c.208-2A>G founder study, cited
  here for the shared diagnostic biochemistry and for the type 2 differential,
  never for a CUBN claim. Where a quote comes from a mixed or AMN cohort the
  explanation says so.

  The canine models carry a caveat the fidelity tier alone does not express. The
  Border Collie CUBN allele is an exon 53 frameshift, and in humans
  post-B12-binding-domain variants give isolated albuminuria rather than IGS.
  The dog nonetheless has the full syndrome. Whether that is a species
  difference in cubilin domain requirements, or a difference between a
  frameshift and the human alleles studied, is not resolved in the cited work,
  and it is why the model's limitations field names the positional mismatch
  rather than only the species.

  No GeneReviews chapter exists for Imerslund-Grasbeck syndrome. PubMed was
  searched for "Imerslund-Grasbeck GeneReviews[All Fields]" (no results) and
  "cobalamin malabsorption GeneReviews[All Fields]" (one result, the
  Abetalipoproteinemia chapter, not relevant). The phenotype baseline here is
  therefore the 2023 Orphanet Journal of Rare Diseases review of reported cases
  and the 2006 Orphanet review, not a GeneReviews Clinical Characteristics
  section.

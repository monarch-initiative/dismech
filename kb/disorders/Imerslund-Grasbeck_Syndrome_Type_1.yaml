  evidence:
  - reference: PMID:37710296
    reference_title: "Imerslund-Gräsbeck syndrome: a comprehensive review of reported cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Laboratory examination often reveals macrocytic anemia with or without proteinuria
    explanation: >-

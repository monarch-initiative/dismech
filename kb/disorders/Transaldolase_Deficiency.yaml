- name: Renal tubular dysfunction
  description: Renal disease commonly includes low-molecular-weight proteinuria, hypercalciuria, aminoaciduria, phosphate wasting and tubular acidosis. Some patients progress to chronic kidney disease. The clinical association is established, but polyol toxicity or local NADPH failure has not been directly isolated in patient renal tissue.
  evidence:
  - reference: PMID:22510381
    reference_title: Nephrological abnormalities in patients with transaldolase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Renal tubular dysfunction is present in the majority of patients with transaldolase deficiency and may lead to chronic renal failure.
    explanation: Human renal disease is well documented; polyol toxicity as its specific mechanism remains inferred.
  - reference: PMID:22510381
    reference_title: Nephrological abnormalities in patients with transaldolase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The most common findings were low molecular weight (LMW) proteinuria and hypercalciuria.
    explanation: Defines the measured tubular phenotype.

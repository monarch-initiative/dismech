    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: the inactivation of AR reversed NADPH depletion and polyol buildup in the absence of TAL and blocked mitochondrial oxidative stress and liver disease progression from cirrhosis to HCC.
    explanation: Genetic epistasis separates AR-dependent oxidative carcinogenesis from persistent carbon trapping and cirrhosis in mice.
  - reference: PMID:36658399
    reference_title: Cytosolic aldose metabolism contributes to progression from cirrhosis to hepatocarcinogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: GSH depletion of TALKO livers persisted in DKO livers.
    explanation: Restored NADPH in the double knockout does not restore GSH; these pools are not interchangeable.
experimental_models:
- name: Patient-derived TAL-deficient lymphoblasts
  experimental_model_type: CELL_LINE
  description: TAL-deficient lymphoblasts show S7P accumulation, G6P and NADPH depletion, altered mitochondrial potential and stimulus-specific apoptosis. AAV-mediated restoration of TAL reverses multiple phenotypes.
  modeled_mechanisms:
  - target: Pentose phosphate pathway carbon sequestration
    relationship: RECAPITULATES
    description: Patient lymphoblasts accumulate sedoheptulose-7-phosphate with depleted glucose-6-phosphate and NADPH; TAL restoration tests the biochemical defect.
    limitations: One cell context does not establish every organ-specific disease mechanism.
    evidence:
    - reference: PMID:18498245
      reference_title: Transaldolase deficiency influences the pentose phosphate pathway, mitochondrial homoeostasis and apoptosis signal processing.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Sedoheptulose 7-phosphate was accumulated, whereas G6P (glucose 6-phosphate) was depleted, indicating a failure to recycle G6P for the oxidative branch of the PPP.
      explanation: Patient lymphoblasts directly demonstrate the nonoxidative carbon-recycling defect.
  - target: Mitochondrial dysfunction
    relationship: RECAPITULATES
    description: Patient lymphoblasts show increased mitochondrial mass and ATP, with altered calcium handling; TAL gene transfer reverses several measured cellular abnormalities.
    limitations: ATP and mitochondrial mass increase in these cells, unlike mouse liver.
    evidence:
    - reference: PMID:18498245
      reference_title: Transaldolase deficiency influences the pentose phosphate pathway, mitochondrial homoeostasis and apoptosis signal processing.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: increased mitochondrial mass associated with increased production of nitric oxide and ATP.
      explanation: Patient lymphoblasts show a different mitochondrial-mass and ATP response, preventing universal extrapolation from liver.
  evidence:
  - reference: PMID:18498245
    reference_title: Transaldolase deficiency influences the pentose phosphate pathway, mitochondrial homoeostasis and apoptosis signal processing.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Normalization of TAL activity by adeno-associated-virus-mediated gene transfer reversed the elevated CD38 expression, ATP and Ca(2+) levels
    explanation: Genetic rescue provides direct cellular support.
environmental:
- name: Acetaminophen exposure
  description: Acetaminophen can exacerbate hepatic oxidative injury in TAL-deficient mice. A clinical case after standard dosing during RSV infection supports avoidance in affected patients, although the concurrent illness limits causal attribution.
  effect: EXACERBATES
  influences_mechanisms:
  - target: Oxidative hepatocyte injury
    description: The exposure challenges already impaired hepatic antioxidant defenses.
    evidence:
    - reference: PMID:19436114
      reference_title: Prevention of hepatocarcinogenesis and increased susceptibility to acetaminophen-induced liver failure in transaldolase-deficient mice by N-acetylcysteine.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Taldo1-/- mice had increased susceptibility to acetaminophen-induced liver failure.
      explanation: Mouse experiments identify an oxidative challenge-sensitive injury pathway.
    - reference: PMID:29923087
      reference_title: Apparent Acetaminophen Toxicity in a Patient with Transaldolase Deficiency.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: We report a 13-month-old transaldolase-deficient male who developed mild liver failure after receiving standard doses of acetaminophen during a febrile respiratory syncytial virus infection.
      explanation: A human temporal association supports precautionary avoidance; concurrent infection limits attribution.

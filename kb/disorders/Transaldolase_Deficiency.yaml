- phase: Adolescent and adult course
  age_range: Adolescence through adulthood
  notes: >
    Survivors of the neonatal presentation can follow a comparatively indolent
    course, with diagnosis sometimes delayed to the second or third decade. In
    adulthood the dominant problems shift from acute hepatic and hematologic
    decompensation to hypergonadotropic hypogonadism, osteopenia, and slowly
    progressive renal and hepatic disease, so long-term multi-organ monitoring
    is required.

discussions:
- discussion_id: gap_erythronic_acid_pathway
  prompt: >-
    By what route is erythronic acid produced in transaldolase deficiency, and
    is it an inert marker or a toxic metabolite contributing to organ damage?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Pentose phosphate pathway metabolite imbalance
  - biochemical#Increased urinary polyols and seven-carbon sugars
  rationale: >-
    Erythronic acid is a major abnormal metabolite in every patient tested and
    in knockout mice, yet it is not an intermediate of the pentose phosphate
    pathway and is not accounted for by the sedoheptulose-7-phosphate and
    polyol overflow that the canonical model describes. The source paper
    presents a putative enzymatic sequence, so the route is a hypothesis rather
    than an unknown, but it has never been tested and the metabolite's toxicity
    has never been assayed. The same study also reports raised urinary
    2-oxoglutarate and fumarate in patients but not in the knockout mice, a
    species discrepancy that bears on how far mouse metabolomics can stand in
    for the human disease.
  proposed_experiments:
  - experiment_id: exp_taldo_erythronic_acid_isotope_tracing
    name: Carbon-13 glucose isotope tracing for erythronic acid origin
    description: >-
      Culture patient-derived and control fibroblasts with uniformly labelled
      carbon-13 glucose and trace label incorporation into erythronic acid by
      liquid chromatography-mass spectrometry, to determine whether it derives
      from the pentose phosphate pathway, from glycolysis, or from an
      independent route.
    would_support:
    - pathophysiology#Pentose phosphate pathway metabolite imbalance
    supporting_outcome: >-
      A labelling pattern placing erythronic acid downstream of the blocked
      nonoxidative pentose phosphate pathway would fold the metabolite into the
      existing model.
    refuting_outcome: >-
      Label entering erythronic acid independently of the pentose phosphate
      pathway would establish a parallel disposal or toxicity route that the
      current pathograph does not represent.
  evidence:
  - reference: PMID:20600873
    reference_title: "Mitochondrial involvement and erythronic acid as a novel biomarker in transaldolase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A putative sequence of enzymatic reactions leading to the formation of erythronic acid is presented."
    explanation: >
      The source proposes a candidate route rather than leaving it wholly
      unknown, which is what makes this a testable gap rather than a blank.
  - reference: PMID:20600873
    reference_title: "Mitochondrial involvement and erythronic acid as a novel biomarker in transaldolase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The urinary concentration of the citric acid cycle intermediates 2-oxoglutaric acid and fumaric acid was increased in the majority of TALDO-deficient patients but not in the knock-out mice."
    explanation: >
      Documents the patient-versus-mouse metabolic discrepancy that limits how
      far the knockout stands in for the human disorder.
  posed_date: "2026-09-02T00:00:00Z"
- discussion_id: gap_extrahepatic_tissue_mechanisms
  prompt: >-
    Does the pentose-phosphate redox mechanism operate in kidney, heart, and
    skin in transaldolase deficiency, or are the extra-hepatic manifestations
    driven by something else?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Redox and mitochondrial stress signaling
  - phenotypes#Abnormality of the kidney
  - phenotypes#Premature skin wrinkling
  - phenotypes#Biventricular hypertrophy
  - phenotypes#Hydrops fetalis
  rationale: >-
    The canonical mechanism has been measured in liver and in spermatozoa. For
    kidney, heart, skin, blood, and the fetal compartment the evidence is
    clinical co-occurrence only: the renal phenotype has been characterized in
    a nine-patient chart review without any measurement of pentose-phosphate
    flux, NADPH, or oxidative stress in renal tissue, and the standard
    attribution of tubulopathy to a toxic effect of accumulated sugars and
    polyols on the proximal tubule is an inference stated as such by its
    authors. A 2026 hypothesis-search run looked specifically for tissue-level
    studies in renal, cardiac, or dermal tissue of transaldolase-deficient
    models and found none. This matters because the disease entry's own
    hypothesis description asserts that toxic metabolite accumulation
    contributes to these manifestations.
  proposed_experiments:
  - experiment_id: exp_taldo_tissue_specific_conditional_knockout
    name: Tissue-restricted conditional Taldo1 knockout series
    description: >-
      Generate liver-, kidney-, and skin-restricted conditional Taldo1
      knockouts and compare organ pathology against the whole-body knockout, to
      separate organ-autonomous enzyme loss from damage caused by circulating
      metabolites produced elsewhere.
    would_support:
    - pathophysiology#Redox and mitochondrial stress signaling
    supporting_outcome: >-
      Local pentose-phosphate and redox derangement with matching pathology in
      each conditional knockout would extend the mechanism beyond the liver.
    refuting_outcome: >-
      Multi-organ disease arising from liver-restricted knockout alone would
      place the extra-hepatic manifestations downstream of circulating
      metabolites rather than of local enzyme loss.
  - experiment_id: exp_taldo_extrahepatic_tissue_metabolomics
    name: Metabolomic and redox profiling of non-hepatic tissue in existing knockouts
    description: >-
      Profile pentose-phosphate intermediates, polyols, NADPH/NADP ratio, and
      glutathione redox state in kidney, heart, and skin of existing
      transaldolase-null mice, a low-cost first test that needs no new line.
    would_support:
    - pathophysiology#Redox and mitochondrial stress signaling
    supporting_outcome: >-
      Carbon trapping and NADPH loss in non-hepatic tissue would supply the
      missing tissue-level evidence directly.
    refuting_outcome: >-
      Preserved redox state in affected non-hepatic organs would leave the
      extra-hepatic phenotypes without a mechanism in the current model.
  evidence:
  - reference: PMID:22510381
    reference_title: "Nephrological abnormalities in patients with transaldolase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Renal tubular dysfunction is present in the majority of patients with transaldolase deficiency and may lead to chronic renal failure."
    explanation: >
      Establishes that the renal phenotype is common and consequential while
      remaining a clinical description with no mechanistic measurement.
  - reference: PMID:24497183
    reference_title: "Clinical and molecular characteristics of two transaldolase-deficient patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The development of tubulopathy and, in the case of the second patient, nephrolithiasis is probably due to the toxic effect of sugars, sugar phosphates and polyols on the proximal tubules"
    explanation: >
      The standard renal explanation is offered by its authors as a
      probability, which is the inferential status this gap records.
  posed_date: "2026-09-02T00:00:00Z"
- discussion_id: gap_phenotypic_variability_modifiers
  prompt: >-
    What determines the range from hydrops fetalis to adult-onset diagnosis
    among people carrying the same TALDO1 genotype?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - mechanistic_hypotheses#canonical_taldo1_ppp_redox_model
  - genetic#Biallelic TALDO1 pathogenic variants
  rationale: >-
    Severity is discordant with genotype in both directions. Four Emirati
    patients homozygous for p.R192C range from hydrops fetalis to relatively
    mild disease, and three adults diagnosed at 17, 26, and 32 years carried no
    variant that would have predicted a milder course. A loss-of-function model
    alone therefore does not predict outcome, and no modifier has been
    identified: no genome-wide modifier study exists, and no systematic
    genotype-to-residual-activity matrix has been built that would separate
    null from hypomorphic alleles.
  proposed_experiments:
  - experiment_id: exp_taldo_genotype_activity_matrix
    name: Recombinant TALDO1 variant activity panel
    description: >-
      Express the reported TALDO1 variants recombinantly, measure kinetics and
      thermal stability for each, and test the residual activity against
      clinical severity in the corresponding patients.
    would_support:
    - genetic#Biallelic TALDO1 pathogenic variants
    supporting_outcome: >-
      Residual activity tracking with milder phenotype would explain part of
      the variability within the existing model.
    refuting_outcome: >-
      Severity uncorrelated with residual activity would force the search onto
      modifier loci or non-genetic factors.
  - experiment_id: exp_taldo_discordant_patient_exome
    name: Exome sequencing of phenotypically discordant patients
    description: >-
      Sequence the exomes of patients sharing a TALDO1 genotype but differing
      in severity, with AKR1B1 genotyping prespecified, to look for modifier
      alleles.
    would_support:
    - mechanistic_hypotheses#canonical_taldo1_ppp_redox_model
    supporting_outcome: >-
      A modifier segregating with severity would extend the canonical model
      rather than replace it.
    refuting_outcome: >-
      No genetic modifier would shift attention to epigenetic or environmental
      determinants.
  evidence:
  - reference: PMID:25388407
    reference_title: "Transaldolase deficiency caused by the homozygous p.R192C mutation of the TALDO1 gene in four Emirati patients with considerable phenotypic variability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "four Emirati patients with transaldolase deficiency caused by the homozygous p.R192C missense mutation in TALDO1 displaying wide phenotypic variability"
    explanation: Documents severity discordance among carriers of one identical genotype.
  - reference: PMID:41806563
    reference_title: "Transaldolase deficiency - natural disease course towards adulthood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis was performed only at 17, 26, and 32 years, respectively, which, however, did not reveal any genetic variants that would be expected to cause a milder disease course."
    explanation: >
      Shows the discordance in the mild direction as well: late-diagnosed
      adults carried no genotype that would have predicted their course.
  posed_date: "2026-09-02T00:00:00Z"
- discussion_id: mismatch_aldose_reductase_hcc_dependency
  prompt: >-
    Does aldose reductase activity determine hepatocellular carcinoma risk in
    human transaldolase deficiency, as it does in the mouse?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - phenotypes#Hepatocellular carcinoma
  - mechanistic_hypotheses#canonical_taldo1_ppp_redox_model
  rationale: >-
    Mouse genetic epistasis makes the cirrhosis-to-carcinoma transition
    conditional on aldose reductase: removing the enzyme blocks carcinoma
    susceptibility while worsening carbon trapping and growth restriction and
    leaving cirrhosis in place. If that dependence holds in patients, aldose
    reductase genotype or activity would be a risk stratifier for the disease's
    most severe endpoint, and aldose reductase inhibition would be a candidate
    intervention. No patient has been genotyped at AKR1B1 against carcinoma
    outcome, and the mouse result also carries an explicit trade-off, so it
    cannot be translated as a straightforward therapeutic target. Polyol
    accumulation itself is established in patients from urinary metabolites; it
    is the carcinoma dependence that is untested in humans.
  proposed_experiments:
  - experiment_id: exp_taldo_akr1b1_genotype_outcome
    name: AKR1B1 genotyping against hepatic outcome in known patients
    description: >-
      Retrospectively genotype AKR1B1 in the reported transaldolase-deficient
      cohort and test the association with hepatocellular carcinoma, cirrhosis
      severity, and growth restriction using existing stored DNA.
    would_support:
    - phenotypes#Hepatocellular carcinoma
    supporting_outcome: >-
      Carcinoma concentrated among patients with higher-activity aldose
      reductase genotypes would carry the mouse dependence into the human
      disease.
    refuting_outcome: >-
      Carcinoma distributed independently of AKR1B1 genotype would confine the
      rheostat model to the mouse.
  evidence:
  - reference: PMID:36658399
    reference_title: "Cytosolic aldose metabolism contributes to progression from cirrhosis to hepatocarcinogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Both TAL and AR are confined to the cytosol; however, their inactivation distorts mitochondrial redox homeostasis in opposite directions."
    explanation: >
      States the opposed-direction result that makes aldose reductase a
      rheostat rather than a simple aggravating factor, and which is the reason
      the human question cannot be answered by analogy.
  posed_date: "2026-09-02T00:00:00Z"
- discussion_id: mismatch_mtor_pon1_autoimmune_cirrhosis
  prompt: >-
    Does an mTOR-dependent, paraoxonase-1 and antiphospholipid-antibody route
    contribute to cirrhosis in human transaldolase deficiency, and would
    rapamycin therefore have a role?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Hepatic fibrosis and cirrhosis
  - mechanistic_hypotheses#canonical_taldo1_ppp_redox_model
  rationale: >-
    In transaldolase and aldose-reductase double-knockout mice, cirrhosis
    persists after the carcinoma route is blocked and is accompanied by mTOR
    activation, loss of paraoxonase-1 glycosylation and secretion, and
    antiphospholipid autoantibody production, all rapamycin-responsive in vivo.
    That is a mechanistically different route to cirrhosis from direct
    oxidative hepatocyte death, and it would imply a repurposable drug. It rests
    on one laboratory's compound-knockout mice. No serum paraoxonase-1 activity
    or antiphospholipid titre has been reported in any transaldolase-deficient
    patient, and the one published case of systemic lupus erythematosus
    alongside a TALDO1 variant is confounded by a co-occurring PTEN variant.
  proposed_experiments:
  - experiment_id: exp_taldo_pon1_apl_serology
    name: Serum paraoxonase-1 activity and antiphospholipid antibody survey
    description: >-
      Measure serum paraoxonase-1 activity, anticardiolipin, and anti-beta-2
      glycoprotein I antibodies in transaldolase-deficient patients against
      age-matched controls, stratified by severity of liver disease.
    would_support:
    - pathophysiology#Hepatic fibrosis and cirrhosis
    supporting_outcome: >-
      Reduced paraoxonase-1 with raised antiphospholipid titres in the severe
      liver-disease subset would bring the mouse route into the human disease
      and justify assessing mTOR inhibition.
    refuting_outcome: >-
      Normal paraoxonase-1 and absent antiphospholipid antibodies across the
      cohort would keep this route confined to the compound-knockout mouse.
  evidence:
  - reference: PMID:37742509
    reference_title: "mTOR-dependent loss of PON1 secretion and antiphospholipid autoantibody production underlie autoimmunity-mediated cirrhosis in transaldolase deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The present study thus identifies glycosylation and secretion of PON1 and aPL production as mTOR-dependent regulatory checkpoints of autoimmunity underlying liver cirrhosis in TAL deficiency."
    explanation: >
      The claim exists and is specific, but the whole demonstration is in
      knockout mice, which is what makes this a translational-validity question
      rather than a settled mechanism.
  posed_date: "2026-09-02T00:00:00Z"
- discussion_id: gap_nac_disease_modification
  prompt: >-
    Does N-acetylcysteine modify the course of liver disease in transaldolase
    deficiency, outside the setting of acetaminophen poisoning?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - treatments#N-acetylcysteine for oxidative liver stress
  rationale: >-
    The preclinical case is unusually strong for a disorder this rare: lifelong
    N-acetylcysteine blocks hepatocarcinogenesis and acetaminophen-induced
    liver failure in transaldolase-null mice and restores fertility in
    heterozygous males. The human record is a different thing. The four
    haploinsufficient patients treated successfully with N-acetylcysteine
    presented with acetaminophen-induced liver failure, for which
    N-acetylcysteine is the standard antidote in any patient, so their recovery
    does not isolate the transaldolase mechanism, and the reported fall in
    alpha-fetoprotein under treatment has also been observed in untreated
    patients. No prospective study has measured whether the drug alters
    fibrosis, polyol burden, or glutathione status in transaldolase deficiency
    outside an overdose. The entry accordingly records N-acetylcysteine as a
    context-specific option rather than disease-modifying therapy, and this
    discussion holds the reason.
  proposed_experiments:
  - experiment_id: exp_taldo_nac_open_label_trial
    name: Multicentre open-label N-acetylcysteine study with biomarker endpoints
    description: >-
      Enrol transaldolase-deficient patients across centres on open-label oral
      N-acetylcysteine with prespecified endpoints of liver stiffness,
      urinary polyol excretion, reduced-to-oxidized glutathione ratio, and
      liver biochemistry over 12 to 24 months, using each patient as their own
      pretreatment control given the size of the population.
    would_support:
    - treatments#N-acetylcysteine for oxidative liver stress
    - pathophysiology#Redox and mitochondrial stress signaling
    supporting_outcome: >-
      Improvement in glutathione status accompanied by stabilization of liver
      stiffness would support disease modification through the redox mechanism.
    refuting_outcome: >-
      Unchanged fibrosis and redox markers under treatment would confine
      N-acetylcysteine to acute acetaminophen exposure.
  evidence:
  - reference: PMID:31769880
    reference_title: "Transaldolase haploinsufficiency in subjects with acetaminophen-induced liver failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings suggest an unexpected prevalence and variety of genetic changes in human TALDO1 with relevance for liver injury that may be preventable by treatment with NAC."
    explanation: >
      The strongest human statement available is framed by its own authors as a
      suggestion about preventability, not a demonstration of it.
  - reference: PMID:34572178
    reference_title: "Successful Liver Transplantation in Two Polish Brothers with Transaldolase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, a reduction in AFP was also observed in patients without this therapy"
    explanation: >
      Directly undercuts the alpha-fetoprotein response that has been the main
      human argument for N-acetylcysteine as disease-modifying.
  posed_date: "2026-09-02T00:00:00Z"

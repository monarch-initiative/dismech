- name: Gonadal dysfunction
  description: Hypergonadotropic hypogonadism can become prominent in adolescence and adulthood. Reduced sex-steroid production and gonadal insufficiency are documented; attribution specifically to NADPH limitation remains a mechanistic hypothesis.
  evidence:
  - reference: PMID:30740741
    reference_title: 'Clinical, biochemical, and molecular overview of transaldolase deficiency and evaluation of the endocrine function: Update of 34 patients.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In some patients, there was gonadal dysfunction with low levels of testosterone and secondary luteinizing hormone (LH) and follicle-stimulating hormone (FSH) abnormalities later in life.
    explanation: Human endocrine findings support gonadal dysfunction but do not directly prove impaired NADPH-dependent steroidogenesis as its cause.
  downstream:
  - target: Hypergonadotropic hypogonadism
    description: Gonadal insufficiency produces the endocrine phenotype.
    causal_link_type: DIRECT

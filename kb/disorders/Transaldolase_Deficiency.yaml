animal_models:
- name: Taldo1-null and heterozygous mouse
  species: Mouse
  genotype: Taldo1-/- or Taldo1+/-
  description: Mouse models reproduce altered PPP metabolites, redox stress, liver disease and tumor susceptibility. Male null mice are infertile. Lifelong NAC prevents mouse liver injury and HCC; rescue of fertility was demonstrated in heterozygotes.
  modeled_mechanisms:
  - target: Mitochondrial dysfunction
    relationship: RECAPITULATES
    description: Taldo1-null liver shows reduced mitochondrial membrane potential, mitochondrial mass and ATP/ADP ratio under the studied conditions.
    limitations: Mouse liver ATP and mitochondrial mass changes differ from patient lymphoblast responses.
    evidence:
    - reference: PMID:19436114
      reference_title: Prevention of hepatocarcinogenesis and increased susceptibility to acetaminophen-induced liver failure in transaldolase-deficient mice by N-acetylcysteine.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: loss of transmembrane potential, diminished mitochondrial mass, and reduced ATP/ADP ratio.
      explanation: These mitochondrial and energetic changes were measured in mouse liver.
  - target: Fas apoptosis resistance and adaptive proliferation
    relationship: RECAPITULATES
    description: Taldo1-null hepatocytes resist CD95/Fas-mediated apoptosis in culture and in vivo, with altered beta-catenin phosphorylation and c-Jun expression.
    limitations: Fas resistance is distinct from sensitivity to oxidative necrosis.
    evidence:
    - reference: PMID:19436114
      reference_title: Prevention of hepatocarcinogenesis and increased susceptibility to acetaminophen-induced liver failure in transaldolase-deficient mice by N-acetylcysteine.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Taldo1-/- hepatocytes were resistant to CD95/Fas-mediated apoptosis in vitro and in vivo.
      explanation: The direction is apoptosis resistance, not generally increased hepatocyte apoptosis.
    - reference: PMID:19436114
      reference_title: Prevention of hepatocarcinogenesis and increased susceptibility to acetaminophen-induced liver failure in transaldolase-deficient mice by N-acetylcysteine.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Reduced beta-catenin phosphorylation and enhanced c-Jun expression in Taldo1-/- livers reflected adaptation to oxidative stress.
      explanation: Adaptive signaling accompanies resistance to Fas-mediated elimination.
  - target: Hepatocarcinogenesis
    relationship: RECAPITULATES
    description: Taldo1-deficient mice develop liver tumors; genetic and antioxidant interventions test contributions of redox stress to progression.
    limitations: Heterozygous mouse tumor risk does not establish autosomal dominant human TALDO deficiency.
    evidence:
    - reference: PMID:19436114
      reference_title: Prevention of hepatocarcinogenesis and increased susceptibility to acetaminophen-induced liver failure in transaldolase-deficient mice by N-acetylcysteine.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: Taldo1-/- and Taldo1+/- mice spontaneously developed HCC
      explanation: Mouse tumors establish a model endpoint; heterozygous mouse tumors do not establish dominant human disease.
  evidence:
  - reference: PMID:19436114
    reference_title: Prevention of hepatocarcinogenesis and increased susceptibility to acetaminophen-induced liver failure in transaldolase-deficient mice by N-acetylcysteine.
    supports: SUPPORT

mechanistic_hypotheses:
- hypothesis_group_id: canonical_taldo1_ppp_redox_model
  hypothesis_label: Canonical TALDO1 Pentose-Phosphate Redox Model
  status: CANONICAL
  description: >-
    Biallelic TALDO1 loss disrupts nonoxidative PPP carbon recycling and redox homeostasis. Liver
    injury, fibrosis and carcinogenesis follow partly distinct pathways. Mouse AR epistasis, mTOR/PON1
    observations and context-dependent cell-death responses refine the canonical mechanism; tissue-specific
    causes of many extrahepatic manifestations remain unresolved.
  notes: >-
    The canonical proximal metabolic model is retained after assessment of the OpenScientist report.
    The report is a literature synthesis, not an executed analysis. Increased Fas apoptosis is
    not the central hepatocyte mechanism: mouse hepatocytes resist it. AR deletion restores NADPH
    and prevents HCC but not GSH depletion or cirrhosis. The mTOR/PON1/aPL findings occur in TAL
    single and TAL/AR double knockouts; patient relevance is unproven. Four heterozygous APAP
    cases treated with NAC are not a controlled trial in congenital biallelic disease. Erythronic
    acid is a variable biomarker with proposed PPP-derived routes, not a universally elevated
    proven toxin. Long-term transplant outcomes and GenCC assertions exist, contrary to report
    absence claims.
  evidence:
  - reference: PMID:15115436
    reference_title: Deletion of Ser-171 causes inactivation, proteasome-mediated degradation and complete deficiency of human transaldolase.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Recombinant TALDeltaS171 had no enzymic activity.
    explanation: The deletion causes loss of activity and protein instability; it is not equivalent to removal of the bacterial catalytic lysine.
  - reference: PMID:18498245
    reference_title: Transaldolase deficiency influences the pentose phosphate pathway, mitochondrial homoeostasis and apoptosis signal processing.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Sedoheptulose 7-phosphate was accumulated, whereas G6P (glucose 6-phosphate) was depleted, indicating a failure to recycle G6P for the oxidative branch of the PPP.
    explanation: Patient lymphoblasts directly demonstrate the nonoxidative carbon-recycling defect.
  - reference: PMID:19436114
    reference_title: Prevention of hepatocarcinogenesis and increased susceptibility to acetaminophen-induced liver failure in transaldolase-deficient mice by N-acetylcysteine.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: depleted NADPH and glutathione levels, and increased production of lipid hydroperoxides.
    explanation: Mouse liver measurements support impaired antioxidant capacity.
  - reference: PMID:36658399
    reference_title: Cytosolic aldose metabolism contributes to progression from cirrhosis to hepatocarcinogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: GSH depletion of TALKO livers persisted in DKO livers.
    explanation: Restored NADPH in the double knockout does not restore GSH; these pools are not interchangeable.
  - reference: PMID:19436114
    reference_title: Prevention of hepatocarcinogenesis and increased susceptibility to acetaminophen-induced liver failure in transaldolase-deficient mice by N-acetylcysteine.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Taldo1-/- hepatocytes were resistant to CD95/Fas-mediated apoptosis in vitro and in vivo.
    explanation: The direction is apoptosis resistance, not generally increased hepatocyte apoptosis.
  - reference: PMID:19436114
    reference_title: Prevention of hepatocarcinogenesis and increased susceptibility to acetaminophen-induced liver failure in transaldolase-deficient mice by N-acetylcysteine.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Reduced beta-catenin phosphorylation and enhanced c-Jun expression in Taldo1-/- livers reflected adaptation to oxidative stress.
    explanation: Adaptive signaling accompanies resistance to Fas-mediated elimination.
  - reference: PMID:36658399
    reference_title: Cytosolic aldose metabolism contributes to progression from cirrhosis to hepatocarcinogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: the inactivation of AR reversed NADPH depletion and polyol buildup in the absence of TAL and blocked mitochondrial oxidative stress and liver disease progression from cirrhosis to HCC.
    explanation: Genetic epistasis separates AR-dependent oxidative carcinogenesis from persistent carbon trapping and cirrhosis in mice.
  - reference: PMID:37742509
    reference_title: mTOR-dependent loss of PON1 secretion and antiphospholipid autoantibody production underlie autoimmunity-mediated cirrhosis in transaldolase deficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: These findings suggest that deficient recycling of 6-carbon substrates by the PPP elicits mTOR activation and limits glycosylation and PON1 secretion into the bloodstream of TALKO and DKO mice.
    explanation: The proposed mechanism occurs in TAL single knockouts as well as TAL/AR double knockouts; human congenital-disease validation is absent.
  - reference: PMID:34677006
    reference_title: Liver Disease and Risk of Hepatocellular Carcinoma in Children With Mutations in TALDO1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Two of the 3 transplanted patients in our series had HCC in the explanted livers
    explanation: HCC was identified in a selected four-patient liver series; this is not a population incidence estimate.
  - reference: PMID:19436114
    reference_title: Prevention of hepatocarcinogenesis and increased susceptibility to acetaminophen-induced liver failure in transaldolase-deficient mice by N-acetylcysteine.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Taldo1-/- and Taldo1+/- mice spontaneously developed HCC
    explanation: Mouse tumors establish a model endpoint; heterozygous mouse tumors do not establish dominant human disease.
pathophysiology:
- name: TALDO1 transaldolase activity deficiency
  description: >
    Biallelic TALDO1 variants reduce or abolish human transaldolase protein
    stability and catalytic activity. The Ser171 deletion mechanism shows that
    mutant transaldolase can be translated but rapidly degraded by the
    proteasome and lacks appreciable enzymatic activity.

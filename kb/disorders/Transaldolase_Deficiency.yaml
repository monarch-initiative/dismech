biochemical:
- name: Reduced transaldolase activity
  presence: DECREASED
  context: >
    Patient-derived fibroblast and lymphoblast studies and recombinant protein
    assays show loss of transaldolase enzymatic activity in disease-associated
    TALDO1 variants.
  readouts:
  - target: TALDO1 transaldolase activity deficiency
    description: Lower measured activity marks a more severe enzyme deficiency.
    direction: POSITIVE
    evidence:
    - reference: PMID:15115436
      reference_title: Deletion of Ser-171 causes inactivation, proteasome-mediated degradation and complete deficiency of human transaldolase.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Recombinant TALDeltaS171 had no enzymic activity.
      explanation: The deletion causes loss of activity and protein instability; it is not equivalent to removal of the bacterial catalytic lysine.
    relationship: READOUT_OF
  evidence:
  - reference: PMID:15115436
    reference_title: "Deletion of Ser-171 causes inactivation, proteasome-mediated degradation and complete deficiency of human transaldolase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "no expression of the TALDeltaS171 protein or enzyme activity was detected"
    explanation: Patient-cell experiments support reduced transaldolase activity as the primary biochemical defect.
- name: Increased urinary polyols and seven-carbon sugars
  presence: INCREASED
  context: >-
    Urine testing shows increased erythritol, ribitol, arabitol, sedoheptitol, perseitol, sedoheptulose, and sedoheptulose-7-phosphate, supporting the biochemical diagnosis.
     Neonatal polyol excretion is physiologically high; interpret against age-specific controls.
  readouts:
  - target: Pentose phosphate pathway carbon sequestration
    description: Urinary carbohydrate abnormalities report the underlying metabolic block.
    direction: POSITIVE
    evidence:
    - reference: PMID:18498245
      reference_title: Transaldolase deficiency influences the pentose phosphate pathway, mitochondrial homoeostasis and apoptosis signal processing.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Sedoheptulose 7-phosphate was accumulated, whereas G6P (glucose 6-phosphate) was depleted, indicating a failure to recycle G6P for the oxidative branch of the PPP.
      explanation: Patient lymphoblasts directly demonstrate the nonoxidative carbon-recycling defect.
    relationship: READOUT_OF
  evidence:
  - reference: PMID:24497183
    reference_title: "Clinical and molecular characteristics of two transaldolase-deficient patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Elevated excretion of erythritol, ribitol, arabitol, sedoheptitol, perseitol, sedoheptulose and sedoheptulose-7P in the urine"
    explanation: The patient report provides the diagnostic urinary metabolite pattern.
  - reference: PMID:29923087
    reference_title: "Apparent Acetaminophen Toxicity in a Patient with Transaldolase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Urine polyols and plasma metabolomics confirmed the diagnosis of transaldolase deficiency."
    explanation: Human metabolomics data support urine polyols as diagnostic biochemical evidence.
  - reference: PMID:18987485
    reference_title: Urinary excretion of pentose phosphate pathway-associated polyols in early postnatal life.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Urinary excretion of polyols shows an age dependency with highest concentrations postnatally independent of the grade of maturity.
    explanation: Age-specific interpretation is necessary; high neonatal polyols alone do not establish TALDO deficiency.
- name: Urinary erythronic acid
  presence: INCREASED
  context: Increased in the original six-patient study and knockout mice, but below detection in a later patient. It is an adjunct metabolic marker, not a universal diagnostic requirement or proven toxin. Proposed erythrose-based PPP routes remain incompletely validated.
  evidence:
  - reference: PMID:20600873
    reference_title: Mitochondrial involvement and erythronic acid as a novel biomarker in transaldolase deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Urine from 6 TALDO-deficient patients and TALDO-deficient knock-out mice were analyzed
    explanation: Defines the original study population.
  - reference: PMID:26238251
    reference_title: 'Transaldolase Deficiency: A New Case Expands the Phenotypic Spectrum.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the level of erythronic acid in our case, if any, is lower than this limit.
    explanation: A later case limits universal elevation claims; it does not prove complete absence.
- name: Elevated alpha-fetoprotein
  presence: INCREASED
  context: AFP can be elevated during liver injury and in patients with suspicious nodules. Its level is age-dependent and nonspecific; a decline does not alone prove NAC efficacy or exclude HCC.
  evidence:
  - reference: PMID:29923087
    reference_title: Apparent Acetaminophen Toxicity in a Patient with Transaldolase Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: rising alpha-fetoprotein which peaked 2 weeks after acetaminophen exposure.
    explanation: The clinical case documents AFP change during liver injury without demonstrating a cancer-specific marker.
  - reference: PMID:29923087
    reference_title: Apparent Acetaminophen Toxicity in a Patient with Transaldolase Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: After discontinuation of acetaminophen and prior to initiation of N-acetylcysteine treatment, our patient demonstrated resolving alpha-fetoprotein levels
    explanation: Temporal AFP decline precedes NAC and cannot be attributed to treatment.

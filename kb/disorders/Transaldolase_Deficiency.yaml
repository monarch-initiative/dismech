name: Transaldolase Deficiency
creation_date: "2026-05-05T07:40:18Z"
category: Mendelian
synonyms:
- TALDO deficiency
- Eyaid syndrome
description: >-
  Transaldolase deficiency is an ultra-rare autosomal recessive inborn error of the pentose phosphate
  pathway caused by biallelic TALDO1 pathogenic variants. Loss of transaldolase activity disrupts
  nonoxidative pentose-phosphate metabolism, causing accumulation of polyols and seven-carbon
  sugars, impaired redox handling, mitochondrial stress, hepatocyte injury, and progressive liver
  disease. Affected individuals often present antenatally or neonatally with hydrops or edema,
  hepatosplenomegaly, hepatic dysfunction or cirrhosis, thrombocytopenia, anemia, renal abnormalities,
  cardiac malformations, abnormal skin vasculature, and variable endocrine or developmental findings.
  Diagnosis is supported by urinary polyol and sedoheptulose-7-phosphate abnormalities and confirmed
  by TALDO1 molecular testing. Management is largely supportive, with avoidance of acetaminophen
  exposure because patients may be unusually vulnerable to oxidative liver injury.
   Liver transplantation can treat severe hepatic disease but does not correct the systemic enzyme
  defect. Survivors may develop chronic renal disease and endocrine complications into adulthood;
  HCC may arise in childhood.

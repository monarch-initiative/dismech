  - reference: PMID:36658399
    reference_title: Cytosolic aldose metabolism contributes to progression from cirrhosis to hepatocarcinogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: the inactivation of AR reversed NADPH depletion and polyol buildup in the absence of TAL and blocked mitochondrial oxidative stress and liver disease progression from cirrhosis to HCC.
    explanation: Genetic epistasis separates AR-dependent oxidative carcinogenesis from persistent carbon trapping and cirrhosis in mice.
  - reference: PMID:17003133
    reference_title: Transaldolase is essential for maintenance of the mitochondrial transmembrane potential and fertility of spermatozoa.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Stimulation of de novo GSH synthesis by oral N-acetyl-cysteine normalized the low fertility rate of TAL(+/-) males
    explanation: The demonstrated fertility rescue was in heterozygous males, while null males have a more severe infertility phenotype.
- name: Taldo1 and aldose-reductase double-knockout mouse
  species: Mouse
  genotype: Taldo1-/-; Akr1b3-/-
  description: AR deletion restores NADPH and blocks HCC and acetaminophen susceptibility while GSH depletion, carbon trapping and cirrhosis persist. Further growth restriction argues against assuming AR inhibition is uniformly beneficial.
  modeled_mechanisms:
  - target: Aldose reductase-dependent polyol formation
    relationship: PERTURBS
    description: Deleting aldose reductase suppresses the polyol accumulation of Taldo1 deficiency and restores NADPH, directly perturbing this pathway.
    limitations: Complete germline mouse AR deletion is not equivalent to pharmacologic inhibition in patients.
    evidence:
    - reference: PMID:36658399
      reference_title: Cytosolic aldose metabolism contributes to progression from cirrhosis to hepatocarcinogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: the inactivation of AR reversed NADPH depletion and polyol buildup in the absence of TAL and blocked mitochondrial oxidative stress and liver disease progression from cirrhosis to HCC.
      explanation: Genetic epistasis separates AR-dependent oxidative carcinogenesis from persistent carbon trapping and cirrhosis in mice.
  - target: Hepatic fibrosis and cirrhosis
    relationship: RECAPITULATES
    description: Cirrhosis persists in the double knockout despite restored NADPH and blocked progression to hepatocellular carcinoma.
    limitations: Persistence of cirrhosis separates fibrosis from the HCC endpoint.
    evidence:
    - reference: PMID:36658399
      reference_title: Cytosolic aldose metabolism contributes to progression from cirrhosis to hepatocarcinogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: However, cirrhosis, which is caused by GSH depletion and responds to treatment with N-acetylcysteine (NAC) in TALKO mice 11 and humans 23, persisted in DKO mice (Figure 1C).
      explanation: The primary double-knockout experiment directly reports persistent cirrhosis; it must be distinguished from prevention of HCC progression and from separate human follow-up observations.
  evidence:

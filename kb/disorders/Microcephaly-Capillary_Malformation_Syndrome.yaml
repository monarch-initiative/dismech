histopathology:
- name: Dilated small-caliber papillary dermal vessels
  description: >
    Skin biopsy of the cutaneous lesions shows dilated small-caliber blood
    vessels confined to the papillary dermis, histologically confirming them as
    true capillary malformations rather than proliferative vascular tumours
    (haemangiomas). This is the only tissue-level pathology published in MIC-CAP;
    no endothelial signaling (phospho-S6 / phospho-ERK) study has been performed
    on the same tissue - see the capillary-malformation-mechanism knowledge gap.
  diagnostic: true
  evidence:
  - reference: PMID:21815250
    reference_title: "The microcephaly-capillary malformation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Skin biopsies were performed in Patients 2 and 3. Both showed dilated small-caliber blood vessels in the papillary dermis, consistent with capillary malformations (CMs)"
    explanation: Direct histopathologic confirmation of the cutaneous lesions as capillary malformations.

diagnosis:
- name: Clinical recognition of the cardinal feature set
  description: >
    Diagnosis is suspected in an infant with the congenital combination of
    microcephaly, multiple generalized cutaneous capillary malformations,
    hypoplastic distal phalanges, early-onset intractable epilepsy and profound
    developmental delay. The digital and cutaneous features are what separate
    MIC-CAP from primary autosomal recessive microcephaly on physical
    examination.
  evidence:
  - reference: PMID:24354023
    reference_title: "Microcephaly-Capillary Malformation Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The defining clinical characteristics of the microcephaly-capillary malformation (MIC-CAP) syndrome are typically present at birth: microcephaly and generalized cutaneous capillary malformations (a few to hundreds of oval/circular macules or patches varying in size from 1-2 mm to several cm), hypoplastic distal phalanges of the hands and/or feet, early-onset intractable epilepsy, and profound developmental delay."
    explanation: The GeneReviews statement of the suggestive clinical findings on which diagnosis is predicated.
- name: Molecular genetic testing of STAMBP
  description: >
    The diagnosis is established by identifying biallelic pathogenic STAMBP
    variants on molecular genetic testing. Exome sequencing is the usual route;
    note that the deep-intronic leaky splice allele c.1005+358A>G is invisible to
    exome sequencing, so genome sequencing or RNA studies may be required in a
    clinically compatible exome-negative proband. Chromosomal microarray has been
    normal in the reported patients in whom it was performed and has no
    established yield in this disorder.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:24354023
    reference_title: "Microcephaly-Capillary Malformation Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of MIC-CAP syndrome is established in a proband with suggestive findings and biallelic pathogenic variants in STAMBP identified by molecular genetic testing."
    explanation: The GeneReviews DIAGNOSIS/TESTING statement naming the confirmatory test.
  - reference: PMID:27531570
    reference_title: "Microcephaly-capillary malformation syndrome: Brothers with a homozygous STAMBP mutation, uncovered by exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we uncovered a homozygous missense variant in STAMBP (p.K303R) in the two siblings, inherited from heterozygous carrier parents"
    explanation: Worked example of exome sequencing establishing the molecular diagnosis.
- name: Exclusion of inborn errors of metabolism and infectious causes
  description: >
    Routine metabolic and infectious workup is normal in MIC-CAP, which is itself
    diagnostically informative: a normal metabolic screen in a severely
    microcephalic epileptic infant with generalized capillary malformations
    argues for MIC-CAP rather than a metabolic encephalopathy or congenital
    infection.
  presence: Negative
  evidence:
  - reference: PMID:21815250
    reference_title: "The microcephaly-capillary malformation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory studies conducted with normal results include high-resolution chromosome analysis, urine organic acids, very long chain fatty acids, quantitative CSF amino acids analysis, congenital disorders of glycosylation screen and workup for an infectious etiology (including TORCH titers)."
    explanation: Documents the normal metabolic and infectious workup that excludes the main differentials.

genetic:
- name: STAMBP
  notes: >
    STAMBP (2p13.1) encodes the 424-residue STAM-binding protein / AMSH, a
    Zn(2+)-dependent JAMM/MPN+ metalloprotease deubiquitinase specific for
    Lys63-linked polyubiquitin. Biallelic loss-of-function variants - homozygous
    or compound heterozygous - are necessary and sufficient for MIC-CAP. The
    reported allele spectrum is dominated by truncating and splice-disrupting
    variants, with a minority of missense alleles that cluster in the N-terminal
    MIT domain and the SH3-binding motif rather than in the catalytic JAMM
    domain. Recurrent alleles include p.Arg38Cys and p.Arg424*; a deep-intronic
    leaky splice allele (c.1005+358A>G) is associated with a markedly attenuated
    phenotype and is invisible to exome sequencing. Heterozygous carriers are
    asymptomatic; no gain-of-function or dominant-negative mechanism is known.
  gene_term:
    preferred_term: STAMBP
    term:
      id: hgnc:16950
      label: STAMBP
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:23542699
    reference_title: "Mutations in STAMBP, encoding a deubiquitinating enzyme, cause microcephaly-capillary malformation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We used whole-exome sequencing of five patients with MIC-CAP syndrome and identified recessive mutations in STAMBP"
    explanation: Original gene-disease discovery by exome sequencing of five patients.
  - reference: PMID:29907875
    reference_title: "A novel homozygous missense mutation in the SH3-binding motif of STAMBP causing microcephaly-capillary malformation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Microcephaly-capillary malformation syndrome is a congenital and neurodevelopmental disorder caused by biallelic mutations in the STAMBP gene."
    explanation: Independent confirmation of the biallelic STAMBP gene-disease relationship.
  - reference: PMID:27531570
    reference_title: "Microcephaly-capillary malformation syndrome: Brothers with a homozygous STAMBP mutation, uncovered by exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we uncovered a homozygous missense variant in STAMBP (p.K303R) in the two siblings, inherited from heterozygous carrier parents"
    explanation: Demonstrates recessive segregation from asymptomatic heterozygous carrier parents.

inheritance:
- name: Autosomal recessive inheritance
  description: >
    MIC-CAP is autosomal recessive. Typically one pathogenic STAMBP variant is
    inherited from each parent, giving a 25% recurrence risk to sibs. In a
    minority of families both variants derive from one parent through uniparental
    isodisomy of chromosome 2, in which case the sib recurrence risk falls to
    under 1% - a distinction with substantial counseling consequences. Penetrance
    in biallelic individuals appears complete; expressivity is variable and
    tracks residual STAMBP protein level.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: COMPLETE
  expressivity: VARIABLE
  evidence:
  - reference: PMID:24354023
    reference_title: "Microcephaly-Capillary Malformation Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MIC-CAP syndrome is an autosomal recessive disorder caused by biallelic STAMBP pathogenic variants."
    explanation: GeneReviews states the mode of inheritance unambiguously.
  - reference: PMID:24354023
    reference_title: "Microcephaly-Capillary Malformation Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Typically, one pathogenic variant is inherited from each parent; however, in some instances both pathogenic variants are inherited from one parent (uniparental isodisomy)."
    explanation: Documents the uniparental isodisomy route and its counseling implications.
  - reference: PMID:21815250
    reference_title: "The microcephaly-capillary malformation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two of our reported patients are an affected brother and sister, suggesting this is an autosomal recessive severe congenital MIC syndrome."
    explanation: Pre-molecular sibship evidence that first established recessive inheritance.

treatments:
- name: Multidisciplinary Supportive and Palliative Care
  description: >
    No disease-modifying therapy exists. Management is supportive and is
    delivered by a multidisciplinary team including medical genetics, neurology,
    developmental pediatrics and feeding specialists, with regular child-neurology
    follow-up and involvement of a complex-care or palliative-care team to
    monitor complications of severe neurologic impairment.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:24354023
    reference_title: "Microcephaly-Capillary Malformation Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Supportive care by multidisciplinary specialists including a medical geneticist, neurologist, developmental pediatrician, and feeding specialist is recommended."
    explanation: GeneReviews management recommendation for multidisciplinary supportive care.
  - reference: PMID:24354023
    reference_title: "Microcephaly-Capillary Malformation Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Regular follow up with a child neurologist for seizure management and a complex care / palliative care team or experienced pediatrician to monitor for complications associated with severe neurologic impairment."
    explanation: GeneReviews surveillance recommendation including palliative care.
- name: Anticonvulsant Polytherapy
  description: >
    Seizure management by an experienced pediatric neurology team; multiple
    anticonvulsant medications are usually required and control is often
    incomplete. Levetiracetam, topiramate, valproic acid and corticosteroids have
    been used in sequence in reported cases. Note the valproic-acid caution below.
  treatment_term:
    preferred_term: anticonvulsant therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
    therapeutic_agent:
    - preferred_term: anticonvulsant agent
      term:
        id: NCIT:C264
        label: Anticonvulsant Agent
    - preferred_term: levetiracetam
      term:
        id: CHEBI:6437
        label: levetiracetam
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:24354023
    reference_title: "Microcephaly-Capillary Malformation Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizures require management by an experienced pediatric neurology team, as multiple anticonvulsant medications are frequently required for adequate seizure control."
    explanation: GeneReviews establishes anticonvulsant polytherapy as standard management.
  - reference: PMID:31638258
    reference_title: "Early-onset epilepsy and microcephaly-capillary malformation syndrome caused by a novel STAMBP mutation in a Chinese boy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient was treated successively with levetiracetam (40-50 mg/kg/day), topiramate (6-7 mg/kg/day), valproic acid (30 mg/kg/day) and corticosteroids at the outpatient clinic. The spasms decreased and became myoclonic, but the epilepsy remained refractory."
    explanation: Documents a real drug sequence and its incomplete efficacy.
- name: Vigabatrin
  description: >
    Vigabatrin produced an 80% seizure reduction within a week in a single
    reported patient whose epilepsy had been refractory to levetiracetam,
    topiramate, valproic acid, corticosteroids and a ketogenic diet. This is a
    single case with three weeks of follow-up before the patient died, so
    long-term efficacy is unknown and vigabatrin should not be presented as
    established MIC-CAP therapy - though it is biologically coherent given the
    infantile-spasms phenotype for which vigabatrin is generally first line.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: vigabatrin
      term:
        id: CHEBI:63638
        label: vigabatrin
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:31638258
    reference_title: "Early-onset epilepsy and microcephaly-capillary malformation syndrome caused by a novel STAMBP mutation in a Chinese boy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After 1 month, the patient received vigabatrin (60 mg/kg/day) and the seizures reduced by 80% a week later."
    explanation: The single reported vigabatrin response in MIC-CAP.
  - reference: PMID:31638258
    reference_title: "Early-onset epilepsy and microcephaly-capillary malformation syndrome caused by a novel STAMBP mutation in a Chinese boy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Although the patient in the present study responded well to vigabatrin, the long-term efficacy of the drug could not be evaluated due to the early death of the patient."
    explanation: The authors' own caveat limiting the strength of this n=1 observation.
- name: Valproic Acid Caution
  description: >
    GeneReviews lists valproic acid under agents and circumstances to avoid, with
    deliberately hedged wording: one affected male died at 12 months of septic
    shock following acute pancreatitis possibly secondary to valproate, while
    other patients tolerated the drug. This is best treated as a caution
    warranting heightened pancreatic monitoring rather than an absolute
    contraindication.
  treatment_term:

name: Microcephaly-Capillary Malformation Syndrome
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
synonyms:
- MIC-CAP syndrome
- MIC-CM syndrome
- microcephaly-cutaneous capillary malformation syndrome
- MICCAP
- STAMBP-related neurodevelopmental disorder
description: >
  Microcephaly-capillary malformation (MIC-CAP) syndrome is an ultra-rare
  autosomal recessive neurocutaneous disorder caused by biallelic
  loss-of-function variants in STAMBP, which encodes the endosome-associated,
  Lys63-linkage-specific deubiquitinating isopeptidase AMSH (associated molecule
  with the SH3 domain of STAM). The cardinal features, present at birth, are
  congenital and progressive microcephaly, multiple small generalized cutaneous
  capillary malformations, hypoplastic distal phalanges of the hands and/or
  feet, early-onset intractable epilepsy, and profound developmental delay.
  Mechanistically, loss of AMSH activity blocks deubiquitination of K63-linked
  ubiquitin conjugates during ESCRT-mediated endosomal cargo sorting, producing
  ubiquitin-conjugate aggregation, elevated apoptosis and progressive neuronal
  loss, impaired neural stem/progenitor proliferation, and paradoxically
  constitutive (serum-insensitive) RAS-MAPK and PI3K-AKT-mTOR signaling that is
  the most plausible link to the cutaneous capillary malformations.

  NAMED-ENTITY DISAMBIGUATION: MIC-CAP (MONDO:0013659, OMIM:614261, STAMBP) must
  not be conflated with megalencephaly-capillary malformation-polymicrogyria
  syndrome (MCAP/M-CM, MONDO:0011240, OMIM:602501, PIK3CA), part of the
  PIK3CA-related overgrowth spectrum. The shared "capillary malformation" token
  is the only real overlap: MCAP is a sporadic somatic mosaic gain-of-function
  PI3K/AKT/mTOR *overgrowth* disorder with megalencephaly and polymicrogyria,
  whereas MIC-CAP is a germline biallelic loss-of-function deubiquitinase defect
  with *micro*cephaly and progressive cortical atrophy. Head-size direction,
  inheritance, mutational mechanism and causal gene all run opposite. Other
  confusable neighbours sharing the capillary-malformation token are CM-AVM
  syndrome (RASA1/EPHB4, autosomal dominant) and Sturge-Weber syndrome (mosaic
  GNAQ); see the differential_diagnoses block.

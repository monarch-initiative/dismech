progression:
- phase: Prenatal
  age_range: conception to birth
  notes: >-
    Impaired neural stem/progenitor proliferation fixes brain size before birth;
    infants are small for gestational age with occipitofrontal circumference well
    below the mean, and the capillary malformations and hypoplastic distal
    phalanges are already formed at delivery.
  evidence:
  - reference: PMID:24354023
    reference_title: "Microcephaly-Capillary Malformation Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The defining clinical characteristics of the microcephaly-capillary malformation (MIC-CAP) syndrome are typically present at birth"
    explanation: GeneReviews establishes congenital (prenatal-onset) presentation of the cardinal features.
- phase: Early infantile declaration
  age_range: birth to ~6 months
  notes: >-
    Seizure onset, frequently escalating to clusters of infantile spasms with
    hypsarrhythmia, together with hypotonia and feeding difficulty.
  evidence:
  - reference: PMID:31638258
    reference_title: "Early-onset epilepsy and microcephaly-capillary malformation syndrome caused by a novel STAMBP mutation in a Chinese boy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The child developed early-onset epilepsy after 3 months, with a generalized tonic-clonic seizure, which progressed to clusters of infantile spasms (2-10 clusters/day) 1 month later."
    explanation: Documents the early-infantile seizure declaration and escalation to infantile spasms.
- phase: Late infantile to toddler peak severity
  age_range: ~6 months to 2 years
  notes: >-
    Maximal seizure burden and refractoriness; head circumference falls further
    relative to the mean; spastic tetraparesis, myoclonus, optic atrophy and
    failure to thrive emerge; gastrostomy is usually required.
  evidence:
  - reference: PMID:24354023
    reference_title: "Microcephaly-Capillary Malformation Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "multiple anticonvulsant medications are frequently required for adequate seizure control"
    explanation: Reflects the peak refractory-epilepsy burden of this phase.
- phase: Childhood plateau
  age_range: after 2 years
  notes: >-
    Seizure burden partially stabilizes while the developmental trajectory
    remains flat at a profoundly low ceiling, with accumulating contractures and
    recurrent aspiration.
  evidence:
  - reference: PMID:24354023
    reference_title: "Microcephaly-Capillary Malformation Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seizures, which can be focal, tonic, and complex partial and can include infantile spasms, appear to stabilize after age two years."
    explanation: GeneReviews describes post-2-year seizure stabilization.

pathophysiology:
- name: Loss of STAMBP/AMSH K63-Linked Deubiquitinase Activity
  biological_scale: MOLECULAR
  description: >
    Biallelic loss-of-function STAMBP variants abolish or severely reduce the
    activity of AMSH, a Zn(2+)-dependent JAMM/MPN+ metalloprotease
    deubiquitinase with strict specificity for Lys63-linked polyubiquitin chains.
    Two routes to loss of function are documented: (i) protein destabilization
    and near-absence of AMSH, the dominant route, seen with truncating alleles
    and with missense alleles in the SH3-binding motif (e.g. p.Ser236Phe) that
    block STAM binding and thereby destabilize the protein; and (ii) direct
    catalytic or substrate-binding impairment, exemplified by the JAMM-domain
    allele p.Thr313Ile. Enzyme regulation is itself relevant: the N-terminal MIT
    domain clamps the catalytic domain in an autoinhibited state that STAM1
    binding relieves, which explains why MIT-domain and SH3-binding-motif
    missense variants - not just catalytic-site variants - are pathogenic.
  genes:
  - preferred_term: STAMBP
    term:
      id: hgnc:16950
      label: STAMBP
  molecular_functions:
  - preferred_term: K63-linked deubiquitinase activity
    term:
      id: GO:0061578
      label: K63-linked deubiquitinase activity
    modifier: DECREASED
  - preferred_term: cysteine-type deubiquitinase activity
    term:
      id: GO:0004843
      label: cysteine-type deubiquitinase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: protein K63-linked deubiquitination
    term:
      id: GO:0070536
      label: protein K63-linked deubiquitination
    modifier: DECREASED
  - preferred_term: protein deubiquitination
    term:
      id: GO:0016579
      label: protein deubiquitination
    modifier: DECREASED
  downstream:
  - target: Failure of ESCRT-Dependent Endosomal Sorting of Ubiquitinated Cargo
    description: >
      AMSH acts at the endosome as part of the ESCRT machinery; loss of its
      catalytic activity is the proximal cause of failed cargo deubiquitination
      during multivesicular-body sorting.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:23542699
    reference_title: "Mutations in STAMBP, encoding a deubiquitinating enzyme, cause microcephaly-capillary malformation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We used whole-exome sequencing of five patients with MIC-CAP syndrome and identified recessive mutations in STAMBP, a gene encoding the deubiquitinating (DUB) isopeptidase STAMBP (STAM-binding protein, also known as AMSH, associated molecule with the SH3 domain of STAM) that has a key role in cell surface receptor-mediated endocytosis and sorting."
    explanation: Establishes biallelic STAMBP loss of function as the cause and identifies the deubiquitinase as the affected activity.
  - reference: PMID:18758443
    reference_title: "Structural basis for specific cleavage of Lys 63-linked polyubiquitin chains."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The Zn(2+)-dependent DUBs AMSH and AMSH-LP regulate receptor trafficking by specifically cleaving Lys 63-linked polyubiquitin chains from internalized receptors."
    explanation: Defines the Zn(2+)-dependent, K63-linkage-specific enzymatic activity that is lost.
  - reference: PMID:29907875
    reference_title: "A novel homozygous missense mutation in the SH3-binding motif of STAMBP causing microcephaly-capillary malformation syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Immunoblot analysis of patient-derived lymphoblastoid cell lines (LCLs) revealed a severe reduction in STAMBP expression, indicating that Ser236Phe induces protein instability."
    explanation: Demonstrates protein destabilization as a route to loss of function in patient cells.
  - reference: PMID:24151880
    reference_title: "Mechanism of recruitment and activation of the endosome-associated deubiquitinase AMSH."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The MIC-CAP disease mutation, Thr313Ile, yields a substantial loss of catalytic activity without any significant change in the thermodynamic stability of the protein, indicating that its perturbed catalytic activity is the basis of the disease."
    explanation: Demonstrates the second, catalytic route to loss of function for a specific disease allele.
  - reference: PMID:40441142
    reference_title: "The MIT domain of STAMBP autoinhibits its deubiquitination activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "demonstrated that the MIT domain binds tightly to the catalytic domain (CD), resulting in autoinhibition of its activity"
    explanation: >
      Explains why MIT-domain missense variants (the majority of reported MIC-CAP
      missense alleles) are pathogenic despite lying outside the catalytic site.

- name: Failure of ESCRT-Dependent Endosomal Sorting of Ubiquitinated Cargo
  biological_scale: CELLULAR
  description: >
    AMSH is recruited to the ESCRT-0 complex through the interaction of its
    SH3-binding motif with the SH3 domain of STAM, and to ESCRT-III through its
    MIT domain. There it removes K63-linked chains from internalized,
    ubiquitin-tagged cell-surface receptors as they are handed down the ESCRT
    chain into intraluminal vesicles of the multivesicular body. Loss of AMSH
    leaves K63-ubiquitinated cargo mis-sorted: receptors are neither properly
    committed to lysosomal degradation nor cleanly recycled, and ubiquitin is not
    recovered. This is the proximal convergence node from which the proteostasis,
    signaling, progenitor and inflammatory arms of the disease all branch.
  cellular_components:
  - preferred_term: ESCRT-0 complex
    term:
      id: GO:0033565
      label: ESCRT-0 complex
  - preferred_term: early endosome
    term:
      id: GO:0005769
      label: early endosome
  - preferred_term: multivesicular body
    term:
      id: GO:0005771
      label: multivesicular body
  biological_processes:
  - preferred_term: multivesicular body sorting pathway
    term:
      id: GO:0071985
      label: multivesicular body sorting pathway
    modifier: ABNORMAL
  - preferred_term: endosome transport via multivesicular body sorting pathway
    term:
      id: GO:0032509
      label: endosome transport via multivesicular body sorting pathway
    modifier: ABNORMAL
  - preferred_term: ubiquitin-dependent protein catabolic process via the multivesicular body sorting pathway
    term:
      id: GO:0043162
      label: ubiquitin-dependent protein catabolic process via the multivesicular body sorting pathway
    modifier: DECREASED
  downstream:
  - target: Ubiquitin-Conjugate Aggregation and Proteostatic Stress
    description: Mis-sorted K63-ubiquitinated cargo accumulates as ubiquitin-conjugate aggregates.
    causal_link_type: DIRECT
  - target: Constitutive Serum-Insensitive RAS-MAPK and PI3K-AKT-mTOR Signaling
    description: >
      Activated receptors that are not committed to lysosomal degradation persist
      in the endosomal compartment and continue to signal.
    causal_link_type: DIRECT
  - target: Impaired Neural Stem and Progenitor Cell Proliferation
    description: >
      Failed endosomal cargo handling in neural progenitors limits their
      expansion during corticogenesis.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: NLRP3 Inflammasome Derepression and Neuroinflammation
    description: >
      NLRP3 is itself a K63-ubiquitination substrate restrained by AMSH; its
      derepression is a proposed inflammatory branch.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:24151880
    reference_title: "Mechanism of recruitment and activation of the endosome-associated deubiquitinase AMSH."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "AMSH, a deubiquitinating enzyme (DUB) with exquisite specificity for Lys63-linked polyubiquitin chains, is an endosome-associated DUB that regulates sorting of activated cell-surface signaling receptors to the lysosome, a process mediated by the members of the endosomal sorting complexes required for transport (ESCRT) machinery."
    explanation: Defines the normal ESCRT-associated endosomal sorting role whose failure this node represents.
  - reference: PMID:20159979
    reference_title: "AMSH interacts with ESCRT-0 to regulate the stability and trafficking of CXCR4."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The RXXK motif of AMSH interacts with the SH3 domains of the STAM and Grb2 families of adaptor proteins with high affinity."
    explanation: Establishes the ESCRT-0/STAM recruitment interaction that MIC-CAP SH3-binding-motif variants disrupt.
  - reference: PMID:21531206
    reference_title: "AMSH is required to degrade ubiquitinated proteins in the central nervous system."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "AMSH impairment results in missorted ubiquitinated cargoes in vitro and severe neurodegeneration in vivo"
    explanation: Links cargo mis-sorting directly to in vivo neurodegeneration.

- name: Ubiquitin-Conjugate Aggregation and Proteostatic Stress
  biological_scale: CELLULAR
  description: >
    Undegraded K63-ubiquitinated substrates accumulate as cytoplasmic
    ubiquitin-conjugate aggregates. Patient-derived lymphoblastoid cell lines
    show elevated conjugated-ubiquitin aggregates with increased autophagosome
    content, and lentiviral STAMBP re-expression reverses the phenotype. In the
    Amsh-null mouse the aggregates begin as early as embryonic day 10 and become
    severe in the postnatal brain, and the co-accumulating species have been
    identified as TDP-43, p62/SQSTM1 and glutamate receptors. Glutamate-receptor
    accumulation offers a direct, still-untested route from failed receptor
    downregulation to the excitation/inhibition imbalance underlying the
    epilepsy.
  cellular_components:
  - preferred_term: inclusion body
    term:
      id: GO:0016234
      label: inclusion body
    modifier: INCREASED
  biological_processes:
  - preferred_term: autophagy
    term:
      id: GO:0006914
      label: autophagy
    modifier: INCREASED
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Region-Selective Neuronal Apoptosis and Progressive Neuronal Loss
    description: >
      Ubiquitin-conjugate aggregation and the associated proteostatic stress
      drive caspase-3-dependent apoptosis of vulnerable neurons.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:23542699
    reference_title: "Mutations in STAMBP, encoding a deubiquitinating enzyme, cause microcephaly-capillary malformation syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient cell lines showed reduced STAMBP expression associated with accumulation of ubiquitin-conjugated protein aggregates, elevated apoptosis and insensitive activation of the RAS-MAPK and PI3K-AKT-mTOR pathways."
    explanation: Direct patient-cell evidence for ubiquitin-conjugate aggregation and elevated apoptosis.
  - reference: PMID:21531206
    reference_title: "AMSH is required to degrade ubiquitinated proteins in the central nervous system."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we demonstrate that AMSH(-/-) mice developed ubiquitinated protein accumulations as early as embryonic day 10 (E10), and that severe deposits were present in the brain at postnatal day 8 (P8) and P18."
    explanation: In vivo timing of the aggregate phenotype, beginning prenatally.
  - reference: PMID:21531206
    reference_title: "AMSH is required to degrade ubiquitinated proteins in the central nervous system."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Glutamate receptor and p62 accumulations were also found; these molecules colocalized with ubiquitinated aggregates in the brain."
    explanation: Identifies glutamate receptors and p62 among the accumulating substrates.
  - reference: PMID:21531206
    reference_title: "AMSH is required to degrade ubiquitinated proteins in the central nervous system."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Interestingly, TDP-43 was found to accumulate and colocalize with glial marker-positive cells in the brain."
    explanation: Documents TDP-43 accumulation, placing the aggregate phenotype in proteinopathy territory.

- name: Region-Selective Neuronal Apoptosis and Progressive Neuronal Loss
  biological_scale: TISSUE
  description: >
    Neurons of the hippocampus (particularly the CA1 field) and cerebral cortex
    die by apoptosis, while cerebellar neurons, thymocytes and fibroblasts are
    spared - a cell-autonomous, region-restricted survival requirement that is
    the most distinctive cellular phenotype of AMSH deficiency and matches the
    human neuropathology of disproportionately small cerebral hemispheres with a
    relatively preserved cerebellum. This postnatal degenerative arm explains the
    *progressive* component of the microcephaly and the cortical atrophy, in
    contrast with the prenatal proliferation arm that sets brain size at birth.
  cell_types:
  - preferred_term: hippocampal CA1 pyramidal neuron
    term:
      id: CL:0002608
      label: hippocampal neuron
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: neuron apoptotic process
    term:
      id: GO:0051402
      label: neuron apoptotic process
    modifier: INCREASED
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  downstream:
  - target: Progressive Microcephaly and Cortical Atrophy
    description: Cumulative neuronal loss produces radiographically progressive cerebral atrophy and a falling head circumference.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:11713295
    reference_title: "Loss of neurons in the hippocampus and cerebral cortex of AMSH-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Examination of brain sections at P6 demonstrated significant loss of neurons and apoptotic cells in the CA1 subfield of the hippocampus."
    explanation: Establishes apoptotic CA1 neuronal loss in the Amsh-null mouse.
  - reference: PMID:11713295
    reference_title: "Loss of neurons in the hippocampus and cerebral cortex of AMSH-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "AMSH-deficient hippocampal neuronal cells were unable to survive in vitro, even in the presence of several stimulatory cytokines, while AMSH-deficient cerebellar neurons, thymocytes, and embryonic fibroblasts survived normally."
    explanation: Demonstrates the cell-autonomous, region-selective survival requirement, including cerebellar sparing.
  - reference: PMID:39169623
    reference_title: "AAV-mediated Stambp gene replacement therapy rescues neurological defects in a mouse model of microcephaly-capillary malformation syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In this MIC-CAP syndrome mouse model, early-onset neuronal death occurs specifically in the hippocampus and cortex, accompanied by aggregation of ubiquitinated proteins, and massive neuroinflammation."
    explanation: Independent CNS-conditional knockout confirming the same regional selectivity and linking it to aggregates.
  - reference: PMID:23542699
    reference_title: "Mutations in STAMBP, encoding a deubiquitinating enzyme, cause microcephaly-capillary malformation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "implicates ubiquitin-conjugate aggregation and elevated apoptosis as factors potentially influencing the progressive neuronal loss underlying MIC-CAP syndrome"
    explanation: The discovery paper's own causal interpretation linking aggregation and apoptosis to progressive neuronal loss.

- name: Impaired Neural Stem and Progenitor Cell Proliferation
  biological_scale: CELLULAR
  description: >
    A developmental arm that operates before birth and is distinct from the
    postnatal degenerative arm. Human STAMBP-knockout cortical organoids show
    significantly reduced neural stem cell proliferation and are smaller, with no
    detectable increase in apoptosis at early stages; re-expression of wild-type
    STAMBP rescues proliferation while the disease alleles p.Gly307Glu and
    p.Thr313Ile do not. Independently, neural progenitor cells derived from
    STAMBP-deficient human embryonic stem cells cannot be maintained long term,
    with downregulation of the anti-apoptotic protein CFLAR as the identified
    effector and CFLAR re-expression rescuing the defect. Together these explain
    why the brain is already small at birth.
  cell_types:
  - preferred_term: neural stem cell
    term:
      id: CL:0000047
      label: neural stem cell
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  biological_processes:

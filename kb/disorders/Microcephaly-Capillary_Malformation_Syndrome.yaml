    term:
      id: GO:0061351
      label: neural precursor cell proliferation
    modifier: DECREASED
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: DECREASED
  - preferred_term: cerebral cortex development
    term:
      id: GO:0021987
      label: cerebral cortex development
    modifier: ABNORMAL
  - preferred_term: extrinsic apoptotic signaling pathway
    term:
      id: GO:0097191
      label: extrinsic apoptotic signaling pathway
    modifier: INCREASED
  downstream:
  - target: Progressive Microcephaly and Cortical Atrophy
    description: >
      A reduced cortical progenitor pool yields a small brain at birth, on which
      the postnatal degenerative arm is superimposed.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36033615
    reference_title: "Novel compound heterozygous mutation in STAMBP causes a neurodevelopmental disorder by disrupting cortical proliferation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Cortical organoids with STAMBP knockout (KO) showed significantly lower proliferation of neural stem cells (NSCs), leading to smaller organoids that are characteristic of microcephaly."
    explanation: Human organoid evidence that STAMBP loss reduces neural stem cell proliferation and organoid size.
  - reference: PMID:36033615
    reference_title: "Novel compound heterozygous mutation in STAMBP causes a neurodevelopmental disorder by disrupting cortical proliferation."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Furthermore, STAMBP disruption did not affect apoptosis in early cortical organoids."
    explanation: >
      Qualifies the mechanism: in the human organoid system the early defect is
      proliferative rather than apoptotic, contrasting with the mouse.
  - reference: PMID:38951308
    reference_title: "STAMBP is Required for Long-Term Maintenance of Neural Progenitor Cells Derived from hESCs."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We identified the anti-apoptotic protein CFLAR is down-regulated in those affected NPCs and ectopic expression of CFLAR rescues NPC defects induced by STAMBP-deficiency."
    explanation: Identifies CFLAR downregulation as the effector of progenitor loss, with a rescue experiment.

- name: Constitutive Serum-Insensitive RAS-MAPK and PI3K-AKT-mTOR Signaling
  biological_scale: MOLECULAR
  description: >
    Because activated receptors are not committed to lysosomal degradation, they
    persist and continue to signal from the endosomal compartment. Patient
    lymphoblastoid cell lines show RAS-MAPK and PI3K-AKT-mTOR pathway activity
    that is maintained even under serum starvation - "insensitive" rather than
    merely elevated - and lentiviral STAMBP restores a normal serum response.
    This paradoxical growth-signalling activation in a loss-of-function
    deubiquitinase disorder is the most plausible mechanistic bridge to the
    cutaneous capillary malformations, since both pathways are established
    drivers of vascular and capillary malformations. The arm is not settled: one
    patient homozygous for p.Ser236Phe had multiple capillary malformations
    *without* constitutive PI3K-AKT-mTOR activation.
  biological_processes:
  - preferred_term: MAPK cascade
    term:
      id: GO:0000165
      label: MAPK cascade
    modifier: INCREASED
  - preferred_term: TOR signaling
    term:
      id: GO:0031929
      label: TOR signaling
    modifier: INCREASED
  - preferred_term: TORC1 signaling
    term:
      id: GO:0038202
      label: TORC1 signaling
    modifier: INCREASED
  downstream:
  - target: Dermal Capillary Malformation
    description: >
      Dysregulated growth-factor signaling in capillary endothelium is the
      proposed route to the cutaneous capillary malformations.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - mtor_driven_capillary_malformation
  evidence:
  - reference: PMID:23542699
    reference_title: "Mutations in STAMBP, encoding a deubiquitinating enzyme, cause microcephaly-capillary malformation syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patient cell lines showed reduced STAMBP expression associated with accumulation of ubiquitin-conjugated protein aggregates, elevated apoptosis and insensitive activation of the RAS-MAPK and PI3K-AKT-mTOR pathways."
    explanation: Primary patient-cell evidence for serum-insensitive RAS-MAPK and PI3K-AKT-mTOR activation.
  - reference: PMID:23542699
    reference_title: "Mutations in STAMBP, encoding a deubiquitinating enzyme, cause microcephaly-capillary malformation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The latter cellular phenotype is notable considering the established connection between these pathways and their association with vascular and capillary malformations."
    explanation: The authors' explicit link from these pathways to the capillary-malformation phenotype.
  - reference: PMID:29907875
    reference_title: "A novel homozygous missense mutation in the SH3-binding motif of STAMBP causing microcephaly-capillary malformation syndrome."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "Contrary to previously reported STAMBP mutations, the Ser236Phe mutation did not lead to constitutive activation of the PI3K-AKT-mTOR pathway in patient-derived LCLs, as indicated by the expression of phosphorylated S6 ribosomal protein, suggesting that it is not the major pathomechanism underlying the disorder in this patient."
    explanation: >
      Allele-specific counter-evidence: this patient had capillary malformations
      without mTOR pathway activation, so mTOR activation is not necessary for the
      cutaneous phenotype.

- name: Dermal Capillary Malformation
  biological_scale: TISSUE
  description: >
    Multiple small, pink-to-red, blanchable, roughly oval or circular capillary
    malformations are distributed generally and randomly over the body - a few to
    hundreds, ranging from 1-2 mm to several centimetres. They are present at
    birth, are not segmental or dermatomal (distinguishing them from the V1
    trigeminal port-wine stain of Sturge-Weber syndrome), and carry none of the
    leptomeningeal-angiomatosis or glaucoma risk of that disorder. Skin biopsy
    confirms their nature histologically - dilated small-caliber vessels in the
    papillary dermis - but the proposed signaling substrate, capillary
    endothelium responding to the dysregulated RAS-MAPK and PI3K-AKT-mTOR
    activity described above, has never been assayed in MIC-CAP lesional skin.
  cell_types:
  - preferred_term: capillary endothelial cell
    term:
      id: CL:0002144
      label: capillary endothelial cell
  biological_processes:
  - preferred_term: angiogenesis
    term:
      id: GO:0001525
      label: angiogenesis
    modifier: ABNORMAL
  evidence:
  - reference: PMID:24354023
    reference_title: "Microcephaly-Capillary Malformation Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "generalized cutaneous capillary malformations (a few to hundreds of oval/circular macules or patches varying in size from 1-2 mm to several cm)"
    explanation: GeneReviews description of the morphology, number and size range of the lesions.
  - reference: PMID:23542699
    reference_title: "Mutations in STAMBP, encoding a deubiquitinating enzyme, cause microcephaly-capillary malformation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "multiple small capillary malformations on the skin"
    explanation: Confirms the cutaneous phenotype in the molecularly defined discovery cohort.

- name: NLRP3 Inflammasome Derepression and Neuroinflammation
  biological_scale: CELLULAR
  description: >
    A proposed inflammatory arm. STAMBP is a negative regulator of the NLRP3
    inflammasome, restraining it by removing K63-linked (non-degradative)
    polyubiquitin from NLRP3; STAMBP depletion in monocytes increases NLRP3 K63
    polyubiquitination, inflammasome activation and IL-1beta release. The
    CNS-conditional Stambp knockout mouse shows massive neuroinflammation
    accompanying neuronal death. No patient-level inflammasome or IL-1beta data
    exist, so this arm is hypothesized rather than established in human MIC-CAP -
    but it is the disease's most tractable drug-repurposing hypothesis.
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  cellular_components:
  - preferred_term: NLRP3 inflammasome complex
    term:
      id: GO:0072559
      label: NLRP3 inflammasome complex
  biological_processes:
  - preferred_term: interleukin-1 beta production
    term:
      id: GO:0032611
      label: interleukin-1 beta production
    modifier: INCREASED
  - preferred_term: microglial cell activation
    term:
      id: GO:0001774
      label: microglial cell activation
    modifier: INCREASED
  - preferred_term: neuroinflammatory response
    term:
      id: GO:0150076
      label: neuroinflammatory response
    modifier: INCREASED
  downstream:
  - target: Region-Selective Neuronal Apoptosis and Progressive Neuronal Loss
    description: >
      Neuroinflammation is proposed to amplify neuronal death in the STAMBP-null
      brain.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - nlrp3_neuroinflammation
  evidence:
  - reference: PMID:33253913
    reference_title: "The deubiquitinase STAMBP modulates cytokine secretion through the NLRP3 inflammasome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we identify the deubiquitinase STAM-binding protein (STAMBP) as a negative regulator of the NLRP3 inflammasome."
    explanation: Establishes STAMBP as a brake on the NLRP3 inflammasome.
  - reference: PMID:33253913
    reference_title: "The deubiquitinase STAMBP modulates cytokine secretion through the NLRP3 inflammasome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "While STAMBP does not modulate NLRP3 protein abundance, cellular depletion of the deubiquitinase increased NLRP3 K63 chain polyubiquitination resulting in increased NLRP3 inflammasome activation."
    explanation: >
      Shows the mechanism runs through exactly the K63 chemistry that AMSH is
      specialized for, making derepression plausible in MIC-CAP.
  - reference: PMID:39169623
    reference_title: "AAV-mediated Stambp gene replacement therapy rescues neurological defects in a mouse model of microcephaly-capillary malformation syndrome."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "accompanied by aggregation of ubiquitinated proteins, and massive neuroinflammation"
    explanation: In vivo neuroinflammation in the CNS-specific Stambp knockout, consistent with but not proving the inflammasome route.

- name: Progressive Microcephaly and Cortical Atrophy
  biological_scale: ORGANISM
  description: >
    The organism-level convergence of the prenatal proliferation arm and the
    postnatal degenerative arm: a brain that is already small at birth and then
    falls further behind, with progressive cortical atrophy, a simplified gyral
    pattern, increased extra-axial cerebrospinal fluid space, hippocampal
    hypoplasia and, in a minority, thin immature white matter. This structural
    substrate drives the intractable epilepsy, spastic tetraparesis, optic
    atrophy and profound developmental delay.
  biological_processes:
  - preferred_term: cerebral cortex development
    term:
      id: GO:0021987
      label: cerebral cortex development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:23542699
    reference_title: "Mutations in STAMBP, encoding a deubiquitinating enzyme, cause microcephaly-capillary malformation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Microcephaly-capillary malformation (MIC-CAP) syndrome is characterized by severe microcephaly with progressive cortical atrophy, intractable epilepsy, profound developmental delay and multiple small capillary malformations on the skin."
    explanation: Defines the progressive cortical atrophy that this node represents.
  - reference: PMID:11713295
    reference_title: "Loss of neurons in the hippocampus and cerebral cortex of AMSH-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Brain atrophy developed by P16 and was accompanied by complete loss of the CA1 neurons in the hippocampus and marked atrophy of the cerebral cortex."
    explanation: Model-organism recapitulation of the progressive brain atrophy.

mechanistic_hypotheses:
- hypothesis_group_id: mtor_driven_capillary_malformation
  hypothesis_label: Constitutive PI3K-AKT-mTOR signaling drives the cutaneous capillary malformations
  status: ALTERNATIVE
  description: >
    The discovery cohort found serum-insensitive RAS-MAPK and PI3K-AKT-mTOR
    activation in patient lymphoblastoid cell lines and proposed it as the link
    to the capillary malformations, by analogy with PIK3CA- and RASA1-related
    vascular anomalies. A later patient homozygous for p.Ser236Phe had multiple
    capillary malformations without detectable PI3K-AKT-mTOR activation, so
    either the capillary-malformation mechanism is mTOR-independent, or the
    lymphoblastoid readout does not reflect endothelial biology. No endothelial
    or skin-biopsy signaling study has been published in MIC-CAP.
  evidence:
  - reference: PMID:23542699
    reference_title: "Mutations in STAMBP, encoding a deubiquitinating enzyme, cause microcephaly-capillary malformation syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The latter cellular phenotype is notable considering the established connection between these pathways and their association with vascular and capillary malformations."
    explanation: The original statement of the hypothesis.
  - reference: PMID:29907875
    reference_title: "A novel homozygous missense mutation in the SH3-binding motif of STAMBP causing microcephaly-capillary malformation syndrome."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "the Ser236Phe mutation did not lead to constitutive activation of the PI3K-AKT-mTOR pathway in patient-derived LCLs"
    explanation: The allele-specific counter-observation that makes the hypothesis contested.
- hypothesis_group_id: nlrp3_neuroinflammation
  hypothesis_label: NLRP3 inflammasome derepression contributes to neuronal loss
  status: EMERGING
  description: >
    STAMBP restrains the NLRP3 inflammasome via K63-deubiquitination, and the
    CNS-conditional Stambp knockout mouse shows massive neuroinflammation. This
    supports a hypothesized IL-1beta-driven amplification of neuronal death, but
    the inflammasome work was done in monocytes with no patient data, so the arm
    is not established in human MIC-CAP.
  evidence:
  - reference: PMID:33253913
    reference_title: "The deubiquitinase STAMBP modulates cytokine secretion through the NLRP3 inflammasome."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "These findings describe a unique mechanism of non-degradative ubiquitination of NLRP3 by STAMBP to limit excessive inflammasome activation and to reduce injurious IL-1beta signaling."
    explanation: Molecular basis of the hypothesis, in a non-neural cell system.

phenotypes:
- name: Progressive microcephaly
  category: Structural
  description: >
    Congenital microcephaly that worsens postnatally. Occipitofrontal
    circumference is already well below the mean at birth and falls further with
    age; head circumference of -5.8 SD at 17 months has been documented.
  phenotype_term:
    preferred_term: Progressive microcephaly
    term:
      id: HP:0000253
      label: Progressive microcephaly
    clinical_course: PROGRESSIVE
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:24354023
    reference_title: "Microcephaly-Capillary Malformation Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The defining clinical characteristics of the microcephaly-capillary malformation (MIC-CAP) syndrome are typically present at birth: microcephaly and generalized cutaneous capillary malformations"
    explanation: GeneReviews lists microcephaly as a defining feature present at birth in essentially all affected individuals.
  - reference: PMID:25266620
    reference_title: "The microcephaly-capillary malformation syndrome in two brothers with novel clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized by congenital and progressive microcephaly, intractable epilepsy, profound developmental delay, multiple small capillary malformations on the skin, and poor somatic growth"
    explanation: Establishes both the congenital and the progressive character of the microcephaly.
- name: Cerebral atrophy
  category: Imaging
  description: >
    Progressive, generalized cerebral atrophy documented on serial brain MRI and
    confirmed at autopsy, with relative sparing of the cerebellum - the human
    imaging and neuropathologic correlate of the region-selective cortical and
    hippocampal neuronal loss modelled in Amsh-deficient mice. It is the
    radiographic signature that separates MIC-CAP from a purely developmental
    (non-progressive) primary microcephaly, and it names the "Progressive
    Microcephaly and Cortical Atrophy" pathophysiology node. No frequency band is
    asserted: the quotable documentation covers two autopsied/imaged patients and
    no series reports a denominator for atrophy specifically.
  phenotype_term:
    preferred_term: Progressive generalized cerebral atrophy
    term:
      id: HP:0002059
      label: Cerebral atrophy
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:21815250
    reference_title: "The microcephaly-capillary malformation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "progressive and generalized cerebral atrophy brain MRI at 19 months of age (Patient 1), and autopsy at 17 months of age (Patient 2), with relative sparing of the cerebellum"
    explanation: >-
      Direct imaging and autopsy documentation of progressive generalized
      cerebral atrophy with cerebellar sparing in two MIC-CAP patients.
  - reference: PMID:23542699
    reference_title: "Mutations in STAMBP, encoding a deubiquitinating enzyme, cause microcephaly-capillary malformation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "severe microcephaly with progressive cortical atrophy"
    explanation: >-
      The molecularly defined discovery cohort characterizes the syndrome by
      progressive cortical atrophy alongside the microcephaly.
- name: Capillary malformation
  category: Dermatological
  description: >
    Multiple small, blanchable, pink-to-red, oval or circular cutaneous macules
    and patches distributed generally over the body, present at birth. Number
    ranges from a few to hundreds and size from 1-2 mm to several centimetres.
    Not obligate across the full STAMBP spectrum - at least one patient with
    biallelic STAMBP variants had no apparent capillary malformation.
  phenotype_term:
    preferred_term: Capillary malformation
    term:
      id: HP:0025104
      label: Capillary malformation
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:24354023
    reference_title: "Microcephaly-Capillary Malformation Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "generalized cutaneous capillary malformations (a few to hundreds of oval/circular macules or patches varying in size from 1-2 mm to several cm)"
    explanation: GeneReviews describes the lesions as a defining feature present at birth.
  - reference: PMID:36033615
    reference_title: "Novel compound heterozygous mutation in STAMBP causes a neurodevelopmental disorder by disrupting cortical proliferation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "but without apparent capillary malformation on the skin and organs"
    explanation: >
      Documents a biallelic-STAMBP patient lacking the eponymous cutaneous sign,
      which is why the frequency is VERY_FREQUENT rather than obligate.
- name: Early-onset intractable epilepsy
  category: Neurological
  description: >
    Seizures begin in the neonatal period or the first months of life and are
    refractory to multiple anticonvulsants. Semiology includes focal, tonic and
    complex partial seizures and infantile spasms; the disorder is now framed as
    a recognizable developmental and epileptic encephalopathy. Seizure burden
    tends to stabilize after age two years.
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
    temporality: RECURRENT
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:

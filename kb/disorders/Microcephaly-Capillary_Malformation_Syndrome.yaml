    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Agents/circumstances to avoid: Valproic acid may or may not be associated with adverse effects."
    explanation: >
      GeneReviews drug-safety statement; the hedged wording is why this is curated
      as a caution rather than a contraindication.
- name: Gastrostomy Feeding
  description: >
    Enteral feeding via gastrostomy tube to optimize nutrition and weight gain
    and to reduce aspiration risk. Aspiration pneumonia is a leading proximate
    cause of hospitalization and death.

    term:
      id: HP:0001285
      label: Spastic tetraparesis
  evidence:
  - reference: PMID:24354023
    reference_title: "Microcephaly-Capillary Malformation Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Central hypotonia and peripheral hypertonia require attention to proper seating and bracing to maintain posture and prevent contractures."
    explanation: GeneReviews management recommendation for tone and posture.
- name: Ketogenic Diet
  description: >
    A ketogenic diet was trialled in one reported patient and failed to control
    seizures even after the ratio was escalated from 2:1 to 4:1. Recorded here as
    a documented negative result rather than a recommended therapy.
  treatment_term:
    preferred_term: ketogenic diet
    term:
      id: NCIT:C173168
      label: Ketogenic Diet
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:31638258
    reference_title: "Early-onset epilepsy and microcephaly-capillary malformation syndrome caused by a novel STAMBP mutation in a Chinese boy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "During the follow-up, the seizures were still not well controlled, although the ketogenic diet ratio was modified from 2:1 to 4:1"
    explanation: Documents failure of the ketogenic diet in the one case where it was tried.
- name: Genetic Counseling and Reproductive Options
  description: >
    Counseling on the 25% sib recurrence risk for biparental inheritance, and on
    the substantially lower (<1%) risk when the proband's homozygosity arose
    through uniparental isodisomy. Once the familial variants are known, carrier
    testing, prenatal testing and preimplantation genetic testing are available.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:24354023
    reference_title: "Microcephaly-Capillary Malformation Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "carrier testing for at-risk family members, prenatal testing for pregnancies at increased risk, and preimplantation genetic testing are possible"
    explanation: GeneReviews genetic-counseling options once familial variants are identified.
  - reference: PMID:24354023
    reference_title: "Microcephaly-Capillary Malformation Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier"
    explanation: The standard biparental recurrence risk that counseling conveys.
- name: AAV9-Mediated STAMBP Gene Replacement (Preclinical)
  description: >
    Neonatal AAV9-mediated brain-directed supplementation of Stambp significantly
    improved neurological defects, sustained growth and prolonged lifespan in a
    CNS-specific Stambp knockout mouse. This is the leading translational
    prospect for MIC-CAP and is unusually favourable on paper: the STAMBP coding
    sequence is small enough for AAV packaging, the CNS-restricted knockout
    phenocopies the global null (so brain-directed delivery may suffice), and the
    intervention worked postnatally. It remains mouse-only - there is no
    investigational new drug application, no clinical trial and no human data.
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  therapeutic_modality: GENE_THERAPY
  target_mechanisms:
  - target: Loss of STAMBP/AMSH K63-Linked Deubiquitinase Activity
    treatment_effect: RESTORES
    description: Gene supplementation restores AMSH deubiquitinase activity in the brain.
    evidence:
    - reference: PMID:39169623
      reference_title: "AAV-mediated Stambp gene replacement therapy rescues neurological defects in a mouse model of microcephaly-capillary malformation syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "neonatal AAV9-mediated gene supplementation of Stambp in the brain could significantly improve neurological defects"
      explanation: Demonstrates that restoring Stambp in the brain corrects the downstream phenotype.
  evidence:
  - reference: PMID:39169623
    reference_title: "AAV-mediated Stambp gene replacement therapy rescues neurological defects in a mouse model of microcephaly-capillary malformation syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Importantly, neonatal AAV9-mediated gene supplementation of Stambp in the brain could significantly improve neurological defects, sustain growth, and prolong the lifespan of StambpSox1-cKO mice."
    explanation: Preclinical efficacy of postnatal brain-directed gene replacement.
  - reference: PMID:39169623
    reference_title: "AAV-mediated Stambp gene replacement therapy rescues neurological defects in a mouse model of microcephaly-capillary malformation syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "provide preclinical evidence that postnatal gene replacement is an effective approach to cure the disease"
    explanation: The authors' own framing of the translational claim, explicitly preclinical.

differential_diagnoses:
- name: Megalencephaly-capillary malformation syndrome (MCAP)
  description: >
    The single most important named-entity confusion for MIC-CAP. MCAP is part of
    the PIK3CA-related overgrowth spectrum and shares only the
    capillary-malformation token. Everything else runs in the opposite direction:
    MCAP is a sporadic somatic mosaic activating PIK3CA disorder with
    megalencephaly, segmental overgrowth and polymicrogyria, whereas MIC-CAP is a
    germline biallelic loss-of-function STAMBP deubiquitinase defect with
    microcephaly and progressive cortical atrophy. MCAP additionally has a
    targeted therapy (alpelisib) that has no rationale in MIC-CAP.
  disease_term:
    preferred_term: megalencephaly-capillary malformation-polymicrogyria syndrome
    term:
      id: MONDO:0011240
      label: megalencephaly-capillary malformation-polymicrogyria syndrome
  distinguishing_features:
  - Megalencephaly (brain and head overgrowth) rather than microcephaly
  - Somatic mosaic gain-of-function PIK3CA rather than germline biallelic loss-of-function STAMBP
  - Sporadic/mosaic rather than autosomal recessive
  - Asymmetric segmental overgrowth of limbs, trunk and face
  - Polymicrogyria, ventriculomegaly, thick corpus callosum and cerebellar tonsillar ectopia
  - No hypoplastic distal phalanges
  - Targeted therapy with the PI3K-alpha inhibitor alpelisib is approved for PROS and has no rationale in MIC-CAP
  evidence:
  - reference: PMID:23946963
    reference_title: "PIK3CA-Related Overgrowth Spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PROS was separated into distinct clinical syndromes based on the tissues and/or organs involved"
    explanation: >
      GeneReviews places the historical clinical syndrome names - MCAP among them -
      inside the PIK3CA-related overgrowth spectrum, establishing MCAP as a
      PIK3CA entity distinct in gene and mechanism from STAMBP-related MIC-CAP.
  - reference: PMID:23946963
    reference_title: "PIK3CA-Related Overgrowth Spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of PROS is established in a proband with suggestive findings and a heterozygous mosaic (or rarely, constitutional) activating pathogenic variant in PIK3CA."
    explanation: Confirms the mosaic activating (gain-of-function) mechanism, the mechanistic opposite of biallelic STAMBP loss.
  - reference: PMID:23946963
    reference_title: "PIK3CA-Related Overgrowth Spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the core features are congenital or early-childhood onset of segmental/focal overgrowth with or without cellular dysplasia"
    explanation: Overgrowth, not undergrowth, is the core PROS/MCAP feature - the opposite of MIC-CAP.
- name: Primary autosomal recessive microcephaly (MCPH)
  disease_term:
    preferred_term: autosomal recessive primary microcephaly
    term:
      id: MONDO:0016660
      label: autosomal recessive primary microcephaly
  description: >
    Congenital microcephaly with a simplified gyral pattern, caused by biallelic
    variants in ASPM, WDR62, MCPH1 and other centrosomal/mitotic genes. Shares the
    microcephaly and simplified gyri with MIC-CAP but lacks the cutaneous and
    digital features.
  distinguishing_features:
  - No cutaneous capillary malformations
  - No hypoplastic distal phalanges or nail hypoplasia
  - Epilepsy is usually not intractable and often absent
  - Cognitive impairment without major motor delay; motor development comparatively preserved
  - Growth largely normal apart from mild short stature
  - Facies normal except for a narrow or sloping forehead
  evidence:
  - reference: PMID:24354023
    reference_title: "Microcephaly-Capillary Malformation Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "microcephaly and generalized cutaneous capillary malformations (a few to hundreds of oval/circular macules or patches varying in size from 1-2 mm to several cm), hypoplastic distal phalanges of the hands and/or feet"
    explanation: >
      The cutaneous and digital features quoted here are precisely what separate
      MIC-CAP from primary autosomal recessive microcephaly.
- name: Capillary malformation-arteriovenous malformation syndrome (CM-AVM)
  disease_term:
    preferred_term: capillary malformation-arteriovenous malformation syndrome
    term:
      id: MONDO:0012016
      label: capillary malformation-arteriovenous malformation syndrome
  description: >
    Autosomal dominant RASA1- or EPHB4-related disorder with multiple small
    cutaneous capillary malformations that closely resemble those of MIC-CAP, but
    with arteriovenous malformation/fistula risk instead of a neurodevelopmental
    phenotype.
  distinguishing_features:
  - Autosomal dominant, with an affected parent frequently identifiable
  - No microcephaly
  - No intractable epilepsy and no neurologic impairment
  - Arteriovenous malformations and arteriovenous fistulae are the principal risk
  - Caused by heterozygous RASA1 or EPHB4 variants rather than biallelic STAMBP variants
  evidence:
  - reference: PMID:24354023
    reference_title: "Microcephaly-Capillary Malformation Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "microcephaly and generalized cutaneous capillary malformations"
    explanation: >
      The co-occurrence of microcephaly with the capillary malformations is the
      discriminator from an isolated capillary-malformation syndrome such as
      CM-AVM.
- name: Sturge-Weber syndrome
  disease_term:
    preferred_term: Sturge-Weber syndrome
    term:
      id: MONDO:0008501
      label: Sturge-Weber syndrome
  description: >
    Mosaic GNAQ-related neurocutaneous disorder with a segmental facial port-wine
    stain, leptomeningeal angiomatosis, glaucoma and epilepsy.
  distinguishing_features:
  - Segmental facial port-wine stain, typically in the V1 trigeminal distribution, rather than generalized randomly distributed micro-lesions
  - Leptomeningeal angiomatosis
  - Glaucoma
  - Head size normal
  - Somatic mosaic GNAQ activation rather than germline biallelic STAMBP loss of function
  evidence:
  - reference: PMID:24354023
    reference_title: "Microcephaly-Capillary Malformation Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "generalized cutaneous capillary malformations"
    explanation: >
      The generalized (non-segmental) distribution of the MIC-CAP lesions is the
      key discriminator from the segmental port-wine stain of Sturge-Weber
      syndrome.

animal_models:
- species: Mus musculus
  genotype: Amsh (Stambp) constitutive knockout
  category: KNOCKOUT
  genes:
  - preferred_term: STAMBP
    term:
      id: hgnc:16950
      label: STAMBP
  description: >
    The original Amsh-null mouse is grossly normal at birth but shows postnatal
    growth retardation and dies between postnatal days 19 and 23, with apoptotic
    loss of CA1 hippocampal neurons from postnatal day 6, brain atrophy by
    postnatal day 16, and cell-autonomous failure of hippocampal (but not
    cerebellar) neuron survival in culture. A later analysis of the same model
    showed ubiquitinated-protein accumulation from embryonic day 10 with TDP-43,
    p62 and glutamate-receptor co-accumulation.
  evidence:
  - reference: PMID:11713295
    reference_title: "Loss of neurons in the hippocampus and cerebral cortex of AMSH-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "all the AMSH-deficient mice exhibited postnatal growth retardation and died between postnatal day 19 (P19) and P23"
    explanation: Establishes the lethal postnatal phenotype of complete Amsh loss.
  - reference: PMID:21531206
    reference_title: "AMSH is required to degrade ubiquitinated proteins in the central nervous system."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "AMSH(-/-) mice provide an animal model for neurodegenerative diseases, which are commonly characterized by the generation of proteinaceous aggregates."
    explanation: The authors' framing of the model's relevance to aggregate-driven neurodegeneration.
- species: Mus musculus
  genotype: Stambp Sox1-Cre conditional knockout (CNS-specific)
  category: CONDITIONAL_KNOCKOUT
  genes:
  - preferred_term: STAMBP
    term:
      id: hgnc:16950
      label: STAMBP
  description: >
    A central-nervous-system-restricted Stambp knockout that phenocopies the
    global null, including progressive microcephaly, postnatal growth retardation
    and fully penetrant preweaning death. It demonstrates that the CNS defect is
    sufficient for the lethal phenotype and provides the platform on which
    neonatal AAV9 gene replacement was shown to be efficacious.
  evidence:
  - reference: PMID:39169623
    reference_title: "AAV-mediated Stambp gene replacement therapy rescues neurological defects in a mouse model of microcephaly-capillary malformation syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we generated a central nervous system (CNS)-specific Stambp knockout mouse model (Stambp Sox1-cKO) that phenocopies Stambp null mice including progressive microcephaly, postnatal growth retardation and complete penetrance of preweaning death"
    explanation: Defines the model and shows the CNS lesion is sufficient for the systemic phenotype.

experimental_models:
- name: STAMBP-knockout human cortical organoids
  description: >
    Three-dimensional human cortical organoids carrying a STAMBP knockout show
    reduced neural stem cell proliferation and smaller size without early
    apoptosis, and variant-specific rescue: wild-type STAMBP restores
    proliferation while the disease alleles p.Gly307Glu and p.Thr313Ile do not.
    This is the principal human model of the developmental (prenatal) arm of the
    disease.
  experimental_model_type: ORGANOID
  cell_types:
  - preferred_term: neural stem cell
    term:
      id: CL:0000047
      label: neural stem cell
  publication: PMID:36033615
  findings:
  - statement: STAMBP knockout reduces neural stem cell proliferation and organoid size.
    supporting_text: "Cortical organoids with STAMBP knockout (KO) showed significantly lower proliferation of neural stem cells (NSCs), leading to smaller organoids that are characteristic of microcephaly."
    evidence:
    - reference: PMID:36033615
      reference_title: "Novel compound heterozygous mutation in STAMBP causes a neurodevelopmental disorder by disrupting cortical proliferation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Cortical organoids with STAMBP knockout (KO) showed significantly lower proliferation of neural stem cells (NSCs), leading to smaller organoids that are characteristic of microcephaly."
      explanation: The proliferation and size phenotype of the STAMBP-knockout organoid.
  - statement: The early organoid defect is proliferative rather than apoptotic.
    supporting_text: "Furthermore, STAMBP disruption did not affect apoptosis in early cortical organoids."
    evidence:
    - reference: PMID:36033615
      reference_title: "Novel compound heterozygous mutation in STAMBP causes a neurodevelopmental disorder by disrupting cortical proliferation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Furthermore, STAMBP disruption did not affect apoptosis in early cortical organoids."
      explanation: Direct statement that apoptosis is unaffected in the early human organoid model.
  evidence:
  - reference: PMID:36033615
    reference_title: "Novel compound heterozygous mutation in STAMBP causes a neurodevelopmental disorder by disrupting cortical proliferation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "A 3D human cortical organoid model was used to investigate the function of STAMBP and the pathogenicity of the novel mutation"
    explanation: Describes the organoid model system curated here.
- name: STAMBP-deficient hESC-derived neural progenitor cells
  description: >
    Human embryonic stem cells with STAMBP deficiency differentiate normally to
    the neural lineage but their neural progenitor cells cannot be maintained or
    expanded long term. Downregulation of the anti-apoptotic protein CFLAR is the
    identified effector, and ectopic CFLAR expression rescues the defect.
  experimental_model_type: IPSC_DERIVED_MODEL
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  publication: PMID:38951308
  findings:
  - statement: STAMBP is dispensable for pluripotency and neural differentiation but required for long-term neural progenitor maintenance.
    supporting_text: "We found that STAMBP is dispensable for the pluripotency maintenance or neural differentiation of hESCs."
    evidence:
    - reference: PMID:38951308
      reference_title: "STAMBP is Required for Long-Term Maintenance of Neural Progenitor Cells Derived from hESCs."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We found that STAMBP is dispensable for the pluripotency maintenance or neural differentiation of hESCs."
      explanation: Establishes that the defect is specific to progenitor maintenance rather than differentiation.
  - statement: CFLAR downregulation mediates the progenitor defect and CFLAR re-expression rescues it.
    supporting_text: "We identified the anti-apoptotic protein CFLAR is down-regulated in those affected NPCs and ectopic expression of CFLAR rescues NPC defects induced by STAMBP-deficiency."
    evidence:
    - reference: PMID:38951308
      reference_title: "STAMBP is Required for Long-Term Maintenance of Neural Progenitor Cells Derived from hESCs."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "ectopic expression of CFLAR rescues NPC defects induced by STAMBP-deficiency"
      explanation: The rescue experiment establishing CFLAR as the effector.
  evidence:
  - reference: PMID:38951308
    reference_title: "STAMBP is Required for Long-Term Maintenance of Neural Progenitor Cells Derived from hESCs."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In this study, we investigated the function and underlying mechanism of STAMBP during neural differentiation of human embryonic stem cells (hESCs)."
    explanation: Describes the hESC-derived neural model system curated here.
- name: Patient-derived lymphoblastoid cell lines
  description: >
    Epstein-Barr-virus-immortalized lymphoblastoid cell lines from MIC-CAP
    patients are the workhorse patient-cell model. They show reduced STAMBP
    protein, ubiquitin-conjugate aggregation, elevated autophagosome content,
    increased cleaved caspase-3 and Annexin V, and serum-insensitive RAS-MAPK and
    PI3K-AKT-mTOR activation, all reversible by lentiviral STAMBP transduction.
    They are a cell model, not a disease site.
  experimental_model_type: CELL_LINE
  cell_source: patient-derived, EBV-immortalized peripheral blood lymphocytes
  publication: PMID:23542699
  findings:
  - statement: Patient lymphoblastoid cell lines show reduced STAMBP, ubiquitin-conjugate aggregation, elevated apoptosis and serum-insensitive growth-pathway activation.
    supporting_text: "Patient cell lines showed reduced STAMBP expression associated with accumulation of ubiquitin-conjugated protein aggregates, elevated apoptosis and insensitive activation of the RAS-MAPK and PI3K-AKT-mTOR pathways."
    evidence:
    - reference: PMID:23542699
      reference_title: "Mutations in STAMBP, encoding a deubiquitinating enzyme, cause microcephaly-capillary malformation syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Patient cell lines showed reduced STAMBP expression associated with accumulation of ubiquitin-conjugated protein aggregates, elevated apoptosis and insensitive activation of the RAS-MAPK and PI3K-AKT-mTOR pathways."
      explanation: The primary patient-cell characterization underlying this model entry.
  evidence:
  - reference: PMID:29907875
    reference_title: "A novel homozygous missense mutation in the SH3-binding motif of STAMBP causing microcephaly-capillary malformation syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Immunoblot analysis of patient-derived lymphoblastoid cell lines (LCLs) revealed a severe reduction in STAMBP expression"
    explanation: Independent use of the same patient-derived lymphoblastoid cell line model.

discussions:
- discussion_id: miccap_apoptosis_vs_proliferation_model_mismatch
  prompt: >-
    Is the primary cellular lesion of STAMBP deficiency apoptotic neuronal death
    (as in mouse) or failed neural progenitor proliferation (as in human
    organoids), and does the mouse under-represent the prenatal human
    corticogenesis defect?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Region-Selective Neuronal Apoptosis and Progressive Neuronal Loss
  - pathophysiology#Impaired Neural Stem and Progenitor Cell Proliferation
  rationale: >-
    Amsh-null mice are grossly normal at birth and develop apoptotic CA1 and
    cortical neuronal loss postnatally, whereas human STAMBP-knockout cortical
    organoids show reduced neural stem cell proliferation with explicitly no
    early apoptosis. Human infants are microcephalic at birth AND progressively
    so, which neither model captures alone. The mismatch is mechanistically
    meaningful because it determines the therapeutic window: a purely postnatal
    apoptotic mechanism would be tractable to postnatal intervention, while a
    prenatal proliferative deficit would not.
  proposed_experiments:
  - experiment_id: miccap_exp_prenatal_proliferation_vs_apoptosis
    name: Stage-matched proliferation-versus-apoptosis comparison across mouse and human models
    description: >-
      Quantify proliferation (Ki-67, phospho-histone H3, EdU) and apoptosis
      (cleaved caspase-3, TUNEL) markers in embryonic Stambp-null mouse cortex
      alongside stage-matched human STAMBP-knockout cortical organoids.
    decision_criterion: >-
      Concordant proliferation deficits with discordant apoptosis would confirm
      that the mouse under-represents the prenatal human proliferative arm.
  - experiment_id: miccap_exp_human_brain_aggregate_ihc
    name: Ubiquitin, p62 and TDP-43 immunohistochemistry on human MIC-CAP brain
    description: >-
      Perform ubiquitin-conjugate, p62/SQSTM1 and TDP-43 immunohistochemistry on
      archived human MIC-CAP autopsy brain tissue. This is the direct human test
      of the mouse aggregate findings and, to our knowledge, has never been
      reported.
    decision_criterion: >-
      Presence of ubiquitin-conjugate, p62 and TDP-43 aggregates in human
      cortical and hippocampal neurons would confirm that the mouse proteostasis
      mechanism operates in human disease.
  - experiment_id: miccap_exp_postnatal_aav_window
    name: Postnatal-only AAV9 Stambp delivery window test
    description: >-
      Test whether AAV9-Stambp delivery restricted to defined postnatal windows
      rescues brain size, or merely slows further loss, in the Stambp Sox1-cKO
      mouse.
    decision_criterion: >-
      Rescue of absolute brain size would indicate a postnatally tractable
      mechanism; arrest of further decline without size recovery would indicate a
      fixed prenatal deficit.
  evidence:
  - reference: PMID:36033615
    reference_title: "Novel compound heterozygous mutation in STAMBP causes a neurodevelopmental disorder by disrupting cortical proliferation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, STAMBP disruption did not affect apoptosis in early cortical organoids."
    explanation: The human-organoid observation that directly conflicts with the apoptosis-dominant mouse model.
  - reference: PMID:11713295
    reference_title: "Loss of neurons in the hippocampus and cerebral cortex of AMSH-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The AMSH-deficient mice were morphologically indistinguishable from their littermates at birth, and histopathological examinations revealed normal morphogenesis in all tissues tested."
    explanation: >
      The mouse is normal at birth, so it cannot model the congenital component of
      human microcephaly.
- discussion_id: miccap_capillary_malformation_mechanism_gap
  prompt: >-
    What actually causes the cutaneous capillary malformations, given that at
    least one patient had them without PI3K-AKT-mTOR activation?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Constitutive Serum-Insensitive RAS-MAPK and PI3K-AKT-mTOR Signaling
  - pathophysiology#Dermal Capillary Malformation
  rationale: >-
    The mTOR/MAPK hypothesis rests entirely on patient lymphoblastoid cell lines,
    which are not endothelium. A patient homozygous for p.Ser236Phe had multiple
    capillary malformations without detectable PI3K-AKT-mTOR activation, so either
    the mechanism is pathway-independent or the lymphoblastoid readout is
    uninformative about endothelial biology. Lesional skin has been biopsied and
    described histologically (dilated small-caliber papillary-dermal vessels),
    but no endothelial signaling study - phospho-S6, phospho-ERK or equivalent -
    has ever been performed on that tissue, despite the lesions being trivially
    accessible.
  proposed_experiments:
  - experiment_id: miccap_exp_cm_endothelial_signaling_ihc
    name: Endothelial signaling immunohistochemistry on MIC-CAP capillary malformations
    description: >-
      Biopsy MIC-CAP cutaneous capillary malformations and stain for endothelial
      phospho-S6 and phospho-ERK against matched control skin and, ideally,
      against PIK3CA-related capillary malformation tissue.
    decision_criterion: >-
      Elevated endothelial phospho-S6/phospho-ERK in lesional skin would support
      the mTOR/MAPK hypothesis in the tissue that actually matters; normal
      staining would refute it.
  - experiment_id: miccap_exp_endothelial_conditional_ko
    name: Endothelial-specific Stambp conditional knockout
    description: >-
      Generate an endothelium-restricted Stambp conditional knockout mouse to
      test whether capillary malformations arise cell-autonomously in
      endothelium.
    decision_criterion: >-
      Development of cutaneous capillary malformations in the absence of a CNS
      phenotype would establish endothelial cell autonomy.
  evidence:
  - reference: PMID:29907875
    reference_title: "A novel homozygous missense mutation in the SH3-binding motif of STAMBP causing microcephaly-capillary malformation syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "suggesting that it is not the major pathomechanism underlying the disorder in this patient"
    explanation: The authors' explicit rejection of mTOR activation as the mechanism in their patient, who nonetheless had capillary malformations.
- discussion_id: miccap_il1_blockade_repurposing
  prompt: >-
    Would IL-1beta blockade modify the epileptic encephalopathy of MIC-CAP, given
    that STAMBP restrains the NLRP3 inflammasome and the mouse shows massive
    neuroinflammation?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#NLRP3 Inflammasome Derepression and Neuroinflammation
  rationale: >-
    AMSH restrains NLRP3 by exactly the K63-linked deubiquitination chemistry it
    is specialized for, and the CNS-conditional Stambp knockout shows massive
    neuroinflammation. IL-1 blockade with anakinra is already used in other
    refractory epilepsy syndromes, making this the most tractable repurposing
    hypothesis in the disease. It is entirely untested: the inflammasome work was
    done in monocytes with no patient or neural data.
  proposed_experiments:
  - experiment_id: miccap_exp_neural_inflammasome_readout
    name: Inflammasome and IL-1beta quantification in STAMBP-deficient neural tissue
    description: >-
      Measure NLRP3 K63-ubiquitination, inflammasome assembly and IL-1beta
      release in Stambp-knockout mouse brain and in patient-derived
      microglia-like cells, extending the monocyte finding to neural context.
    decision_criterion: >-
      Elevated NLRP3 K63-ubiquitination and IL-1beta in STAMBP-deficient neural
      cells would establish the arm as neural-relevant rather than
      monocyte-specific.
  - experiment_id: miccap_exp_il1_blockade_mouse
    name: IL-1 receptor blockade trial in the Stambp Sox1-cKO mouse
    description: >-
      Test whether IL-1 receptor blockade (e.g. anakinra) reduces seizure burden,
      neuroinflammation or preweaning mortality in the CNS-conditional Stambp
      knockout mouse.
    decision_criterion: >-
      A significant improvement in survival or seizure burden would justify
      considering IL-1 blockade as a repurposing candidate in human MIC-CAP.
  evidence:
  - reference: PMID:33253913
    reference_title: "The deubiquitinase STAMBP modulates cytokine secretion through the NLRP3 inflammasome."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "STAMBP knockout directly increased release of IL-1beta with TLR ligation"
    explanation: Molecular basis for the IL-1 blockade hypothesis, in monocytes rather than neural cells.
- discussion_id: miccap_natural_history_and_qol_gap
  prompt: >-
    What is the actual natural history, survival distribution, and caregiver/
    patient quality-of-life burden of MIC-CAP?
  kind: KNOWLEDGE_GAP
  status: OPEN
  rationale: >-
    With roughly 25-30 molecularly confirmed individuals reported worldwide there
    is no registry, no natural-history study, no survival curve, and no validated
    quality-of-life or caregiver-burden instrument has ever been administered.
    Life expectancy is described only as "shortened", with the oldest known living
    individual reported at 12 years. Prognostic counseling is therefore
    anecdote-based.
  proposed_experiments:
  - experiment_id: miccap_exp_international_registry
    name: International STAMBP patient registry with longitudinal phenotyping
    description: >-
      Establish a registry capturing standardized longitudinal phenotyping,
      seizure burden, feeding status, growth and survival across all molecularly
      confirmed STAMBP patients.
    decision_criterion: >-
      A cohort large enough to compute a survival distribution and to stratify
      outcome by variant class.
  - experiment_id: miccap_exp_qol_instruments
    name: Quality-of-life and caregiver-burden instrument administration
    description: >-
      Administer CPCHILD or PedsQL together with a validated caregiver-burden
      instrument across the reported MIC-CAP cohort, none of which has ever been
      done.
    decision_criterion: >-
      Any validated instrument data would replace the current inference-only
      quality-of-life assessment.
  - experiment_id: miccap_exp_protein_level_prognostic
    name: STAMBP protein level as a prognostic biomarker
    description: >-
      Test whether residual STAMBP protein level quantified on immunoblot from
      patient-derived cells predicts motor and language outcome, as the leaky
      splice-allele homozygote suggests.
    decision_criterion: >-
      A monotonic relationship between residual protein level and functional
      outcome would establish the first prognostic biomarker for the disease.
  evidence:
  - reference: PMID:35962715
    reference_title: "Further clinical delineation of microcephaly-capillary malformation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Currently, there is little published information about the natural history and long-term outcomes for individuals with MIC-CAP."
    explanation: Explicit statement of the natural-history gap by the group that maintains the GeneReviews chapter.

notes: >
  Scope and nosology. Recent reports show that the STAMBP phenotype is broader
  than classic MIC-CAP: at least one patient with biallelic STAMBP variants had
  global developmental delay, autism spectrum disorder, microcephaly, epilepsy
  and dysmorphism but no apparent capillary malformation, and a homozygote for a
  leaky deep-intronic splice allele achieved independent walking and short-phrase
  speech. This entry keeps the MIC-CAP name to match MONDO:0013659 but treats
  capillary malformation as very frequent rather than obligate, and should be
  read as covering the severe/complete end of a STAMBP-related neurodevelopmental
  spectrum.

  Somatic STAMBP biology is out of scope. STAMBP is recurrently dysregulated
  somatically in several cancers (melanoma, lung adenocarcinoma, pancreatic and
  colorectal carcinoma). Those are oncology findings about the same protein, not
  about MIC-CAP, and are deliberately not imported here.

  Deliberately omitted phenotypes. The HPO annotation set for OMIM:614261 also
  records hypoplasia of the corpus callosum, brachydactyly, clinodactyly,
  vesicoureteral reflux, and single-individual reports of cleft palate,
  sensorineural hearing impairment and adrenal insufficiency. None of these is
  quotable from any cached abstract or open full text, so they are not curated as
  phenotype entries rather than being propped up with topically adjacent
  citations. Note in particular that "corpus callosum" appears in none of the
  MIC-CAP references cited here - the only cited reference mentioning it is the
  PIK3CA/MCAP GeneReviews, i.e. the confusable neighbouring entity, where the
  callosum is characteristically *thick*.

  Ontology-term choices for the mixed tone pattern. The central/peripheral tone
  dissociation is curated as two entries - Central hypotonia and Peripheral
  hypertonia - because HPO has no single term for the pattern. HPO's specific
  "Central hypotonia" term, HP:0011398, is obsolete, so the axial component is
  bound to HP:0001290 Generalized hypotonia with the central qualifier carried
  in `preferred_term`. HP:0032361 was considered and rejected: it is "Decreased
  post-bronchodilator forced expiratory flow 25-75%", an unrelated spirometry
  concept.

  Frequency bands are deliberately absent on Cerebral atrophy, Central
  hypotonia, Peripheral hypertonia and Recurrent pneumonia. Each is documented
  in named individual patients or as a GeneReviews management target, but no
  published series reports a denominator for any of them, so assigning a
  FrequencyEnum band would be unsupported.

  No biochemical marker. There is no diagnostic blood, urine or cerebrospinal
  fluid analyte; blood and urinary metabolic screening is normal, which is itself
  diagnostically useful for excluding inborn errors of metabolism. The only
  abnormal biochemical readouts are research-grade immunoblots and
  immunofluorescence, so no `biochemical:` block is curated.

  Deliberate negatives. No environmental, infectious, lifestyle or teratogenic
  contribution has been implicated; no modifier or protective locus is known; no
  recurrent copy-number variant is known (chromosomal microarray was normal in
  the reported patients in whom it was performed, so it has no established
  diagnostic yield); no
  transcriptomic, proteomic, metabolomic or single-cell dataset of MIC-CAP
  patient or model tissue has been published.

classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      Primary clinical home. Although MIC-CAP is a multisystem neurocutaneous
      syndrome, the burden of disease, the surveillance plan and essentially all
      management are neurologic: a developmental and epileptic encephalopathy
      with progressive microcephaly, cortical atrophy, spastic tetraparesis and
      profound developmental delay. The cutaneous capillary malformations are
      diagnostically decisive but clinically inert.
    evidence:
    - reference: PMID:23542699
      reference_title: "Mutations in STAMBP, encoding a deubiquitinating enzyme, cause microcephaly-capillary malformation syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Microcephaly-capillary malformation (MIC-CAP) syndrome is characterized by severe microcephaly with progressive cortical atrophy, intractable epilepsy, profound developmental delay and multiple small capillary malformations on the skin."
      explanation: >-
        Three of the four defining features named here are neurologic, placing
        the disorder in Harrison's Neurologic Disorders Part.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      Secondary assignment: a monogenic autosomal recessive Mendelian disorder
      with a single causative gene (STAMBP), diagnosed by molecular genetic
      testing and managed with formal genetic counseling.
    evidence:
    - reference: PMID:24354023
      reference_title: "Microcephaly-Capillary Malformation Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "MIC-CAP syndrome is an autosomal recessive disorder caused by biallelic STAMBP pathogenic variants."
      explanation: >-
        GeneReviews states the monogenic autosomal recessive basis that places
        MIC-CAP in Harrison's Genetics and Disease Part.
  mechanistic_category:
  - classification_value: proteotoxic disease
    notes: >-
      Loss of the K63-specific deubiquitinase AMSH leaves ubiquitinated ESCRT
      cargo undegraded, and patient cells and Amsh-null mouse brain accumulate
      ubiquitin-conjugate aggregates that co-stain for p62/SQSTM1 and TDP-43.
      Assigned as a mechanistic (not clinical) tag; the aggregate phenotype is
      documented in patient lymphoblastoid cells and in mouse brain, not yet in
      human MIC-CAP brain tissue - see the discussions block.
    evidence:
    - reference: PMID:23542699
      reference_title: "Mutations in STAMBP, encoding a deubiquitinating enzyme, cause microcephaly-capillary malformation syndrome."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "implicates ubiquitin-conjugate aggregation and elevated apoptosis as factors potentially influencing the progressive neuronal loss underlying MIC-CAP syndrome"
      explanation: >-
        The discovery paper's own hedged ("potentially influencing")
        proteostasis-failure interpretation, hence PARTIAL.
    - reference: PMID:21531206
      reference_title: "AMSH is required to degrade ubiquitinated proteins in the central nervous system."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "AMSH(-/-) mice provide an animal model for neurodegenerative diseases, which are commonly characterized by the generation of proteinaceous aggregates."
      explanation: >-
        Explicitly frames AMSH loss as an aggregate-driven proteinopathy;
        PARTIAL because the framing is model-organism rather than human.

discussions:
- discussion_id: gap_gsd5_genotype_phenotype
  prompt: >-
    Why does McArdle disease show wide clinical variability — from severe fixed
    weakness to nearly asymptomatic, exercise-related symptoms — when no
    genotype-phenotype correlation has been established for PYGM variants, and
    what genetic or environmental modifiers account for this heterogeneity?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Blocked Skeletal Muscle Glycogenolysis
  rationale: >-
    McArdle disease is caused by biallelic loss-of-function PYGM variants, yet
    affected individuals range from severely limited to only mildly symptomatic.
    A large mutational update reports that no genotype-phenotype correlation has
    been described, so the recurrent p.R50X and other variants do not predict
    disease severity. The modifiers (e.g., additional genetic background,
    physical conditioning, or metabolic factors) that shape the clinical spectrum
    remain undefined and are relevant to prognosis and exercise counseling.

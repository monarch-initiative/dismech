      label: skeletal muscle fiber
  molecular_functions:
  - preferred_term: glycogen phosphorylase activity
    term:
      id: GO:0008184
      label: glycogen phosphorylase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:25914343
    reference_title: "McArdle Disease: Update of Reported Mutations and Polymorphisms in the PYGM Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      McArdle disease is an autosomal-recessive disorder caused by inherited
      deficiency of the muscle isoform of glycogen phosphorylase (or
      "myophosphorylase"), which catalyzes the first step of glycogen catabolism,
      releasing glucose-1-phosphate from glycogen deposits.
    explanation: Identifies the deficient myophosphorylase enzyme and the glycogenolytic reaction it catalyzes.
  - reference: PMID:21658951
    reference_title: Clinical and laboratory features of patients with myophosphorylase deficiency (McArdle disease).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Muscle biopsies revealed subsarcolemmal vacuolation and histochemical
      absence of myophosphorylase.
    explanation: Muscle histochemistry directly documents absent myophosphorylase in patients.
  downstream:
  - target: Blocked Skeletal Muscle Glycogenolysis
    description: Loss of myophosphorylase activity blocks the first step of muscle glycogen breakdown.
    causal_link_type: DIRECT
    evidence:

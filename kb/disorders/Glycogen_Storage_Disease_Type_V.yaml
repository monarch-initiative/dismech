pathophysiology:
- name: Myophosphorylase (PYGM) Deficiency
  description: >-
    Biallelic pathogenic variants in PYGM cause inherited deficiency of
    myophosphorylase, the muscle isoform of glycogen phosphorylase that
    catalyzes the first, rate-limiting step of glycogen catabolism, releasing
    glucose-1-phosphate from muscle glycogen.

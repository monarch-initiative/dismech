name: Glycogen Storage Disease Type V
creation_date: "2026-07-12T21:48:42Z"
category: Mendelian
synonyms:
- McArdle disease
- Myophosphorylase deficiency
- Muscle glycogen phosphorylase deficiency
- GSD due to muscle glycogen phosphorylase deficiency
- GSD type V
- GSD type 5
- Glycogenosis type V
description: >-
  Glycogen storage disease type V (McArdle disease) is an autosomal recessive
  muscle glycogenosis caused by inherited deficiency of myophosphorylase, the
  muscle isoform of glycogen phosphorylase encoded by PYGM. The enzyme catalyzes
  the first step of glycogen breakdown in skeletal muscle, so its loss blocks
  glycogenolysis and leaves patients unable to mobilize muscle glycogen for
  energy during exertion. The disorder is the paradigm of exercise intolerance:
  premature fatigue, muscle cramps, and myalgia occur within minutes of exertion,
  often followed by the characteristic "second wind" phenomenon, with
  exercise-induced rhabdomyolysis, myoglobinuria, and persistently elevated
  serum creatine kinase.

      reference_title: The effect of oral sucrose on exercise tolerance in patients with McArdle's disease.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In patients with McArdle's disease, blocked glycogenolysis in muscles
        results in low exercise tolerance and can lead to muscle injury,
        particularly in the first minutes of exercise.
      explanation: Links the myophosphorylase block to impaired muscle glycogenolysis and its exertional consequences.

      label: keratinocyte differentiation
    modifier: DECREASED
  - preferred_term: epidermis development
    term:
      id: GO:0008544
      label: epidermis development
    modifier: DECREASED
  evidence:
  - reference: PMID:12194825
    reference_title: "RIP4 is an ankyrin repeat-containing kinase essential for keratinocyte differentiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      RIP4 deficiency in mice results in perinatal lethality associated with
      abnormal epidermal differentiation.
    explanation: Keratinocyte differentiation defect of RIPK4 loss in vivo.
  - reference: PMID:12194825
    reference_title: "RIP4 is an ankyrin repeat-containing kinase essential for keratinocyte differentiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: RIP4 functions cell autonomously within the keratinocyte lineage.
    explanation: Places the defect in the keratinocyte itself.

name: Bartsocas-Papas Syndrome 1
creation_date: "2026-10-29T03:40:00Z"
category: Mendelian
synonyms:
- Bartsocas-Papas syndrome
- lethal popliteal pterygium syndrome
- BPS1
- autosomal recessive popliteal pterygium syndrome
- popliteal pterygium syndrome, lethal type
description: >-
  Bartsocas-Papas syndrome 1 is the severe, autosomal recessive form of
  popliteal pterygium syndrome. Affected fetuses and newborns have large
  popliteal webs that fix the knees in flexion, often with webs at other joints,
  together with fusion of the eyelid margins (ankyloblepharon), fibrous bands
  between the jaws (oral synechiae), cleft lip and palate, a hypoplastic nose,
  microcephaly, complete soft-tissue syndactyly with digital hypoplasia and bony
  synostosis, absent scalp hair, eyebrows, eyelashes and nails, and hypoplastic
  or ambiguous external genitalia. Most affected individuals die in utero or in
  the neonatal period, but a minority survive into childhood. The cause is
  biallelic loss-of-function variants in RIPK4, an ankyrin-repeat
  serine/threonine kinase that is a direct transcriptional target of p63 and
  that phosphorylates and activates the transcription factor IRF6, the gene
  mutated in the dominant popliteal pterygium syndrome. Loss of RIPK4 kinase
  activity disturbs keratinocyte differentiation and the formation of the
  periderm, the transient outer epithelial layer that stops apposed embryonic
  epithelia from adhering, so epithelial surfaces fuse; this explains the webs,
  the eyelid and oral fusions and the soft-tissue syndactyly. Milder RIPK4
  alleles cause attenuated presentations and the allelic CHAND syndrome, which
  is curated separately.

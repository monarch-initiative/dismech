progression:
- phase: Prenatal onset
  age_range: Prenatal; detectable on first-trimester ultrasound
  notes: >-
    The malformations are present before birth and lower-limb webs, limb
    malformations and facial anomalies can be seen on obstetric ultrasound.
  evidence:
  - reference: PMID:12575021
    reference_title: "First-trimester diagnosis of Bartsocas-Papas syndrome (BPS) by transvaginal ultrasound: case report and review of the literature."
    supports: SUPPORT

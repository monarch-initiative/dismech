inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals are homozygous for RIPK4 variants, usually in
    consanguineous families, with heterozygous unaffected parents and recurrence
    in siblings. In one child, with a milder presentation diagnosed clinically
    as popliteal pterygium syndrome, an apparently homozygous RIPK4 variant
    carried only by the mother was explained by maternal isodisomy of
    chromosome 21; the authors count this child within the RIPK4 disease.
  evidence:
  - reference: PMID:22197489
    reference_title: "Mutations in RIPK4 cause the autosomal-recessive form of popliteal pterygium syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using Affymetrix 250K SNP array genotyping and homozygosity mapping, we
      mapped this malformation syndrome to chromosomal region 21q22.3.
    explanation: >-
      Homozygosity mapping in consanguineous families located the recessive
      locus at RIPK4 on 21q22.3.
  - reference: PMID:22197488
    reference_title: "Exome sequence identifies RIPK4 as the Bartsocas-Papas syndrome locus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using exome sequencing in a consanguineous family, we identified the
      homozygous mutation c.1127C>A in exon 7 of RIPK4
    explanation: Homozygous RIPK4 variant in a consanguineous family.
  - reference: PMID:25691407
    reference_title: "Expanding the genetic and phenotypic spectrum of popliteal pterygium disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only one maternal allele was inherited by the proband indicating maternal
      isodisomy of chromosome 21.
    explanation: >-
      Uniparental disomy as an alternative route to homozygosity for a
      recessive RIPK4 variant.

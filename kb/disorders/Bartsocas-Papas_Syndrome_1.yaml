pathophysiology:
- name: RIPK4 Kinase Signaling Deficiency
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. Both RIPK4 alleles carry kinase-domain missense,
    nonsense or frameshift variants. RIPK4 is an ankyrin-repeat
    serine/threonine kinase expressed in the basal and suprabasal epidermis.
    The tested missense variants abolish catalytic activity, and the truncating
    alleles remove the kinase or the regulatory ankyrin repeats. Catalysis
    needs a dimer of the kinase domain.
  genes:
  - preferred_term: RIPK4
    term:
      id: hgnc:496
      label: RIPK4
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: Biallelic germline RIPK4 loss-of-function variants.
  molecular_functions:
  - preferred_term: protein serine/threonine kinase activity
    term:
      id: GO:0004674
      label: protein serine/threonine kinase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:22197489
    reference_title: "Mutations in RIPK4 cause the autosomal-recessive form of popliteal pterygium syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Luciferase reporter assays also demonstrated that these mutations are
      critical for the catalytic activity of RIPK4.
    explanation: Disease variants abolish RIPK4 catalytic activity.
  - reference: PMID:33713555
    reference_title: "A novel homozygous RIPK4 variant in a family with severe Bartsocas-Papas syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Pathogenicity predictions, molecular modeling, and cell-based functional
      assays showed that Asp161 residue is required for the kinase activity of
      the protein
    explanation: A further disease variant abolishes kinase activity.
  - reference: PMID:29706531
    reference_title: "Crystal Structure of Ripk4 Reveals Dimerization-Dependent Kinase Activity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we show that the intact dimeric entity is required for MmRipk4 catalytic
      activity through a series of engineered mutations and cell-based assays.
      We also assess the impact of BPS mutations on protein structure and
      activity
    explanation: >-
      RIPK4 catalysis requires kinase-domain dimerization, and BPS variants
      were assessed against this structure.
  downstream:
  - target: Impaired p63-RIPK4-IRF6 Differentiation Signaling
    causal_link_type: DIRECT
  - target: Impaired RIPK4 Wnt and Hippo Branch Signaling
    causal_link_type: DIRECT
- name: Impaired p63-RIPK4-IRF6 Differentiation Signaling
  biological_scale: MOLECULAR
  description: >-
    RIPK4 sits in a transcriptional and signaling axis of the surface ectoderm.
    p63, the master regulator of stratified epithelia, directly activates RIPK4
    transcription, and IRF6 also controls RIPK4 expression. RIPK4 phosphorylates
    IRF6 at Ser413 and Ser424, priming IRF6 for activation and nuclear entry,
    where it induces differentiation regulators such as GRHL3 and OVOL1. The role
    of RIPK4 in mouse development requires its kinase activity. Loss of RIPK4
    kinase activity therefore weakens the IRF6-dependent differentiation
    program, which is why the RIPK4 and IRF6 pterygium syndromes resemble each
    other.
  genes:
  - preferred_term: RIPK4
    term:
      id: hgnc:496
      label: RIPK4
  - preferred_term: IRF6
    term:
      id: hgnc:6121
      label: IRF6
  biological_processes:
  - preferred_term: keratinocyte differentiation
    term:
      id: GO:0030216
      label: keratinocyte differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:22197488
    reference_title: "Exome sequence identifies RIPK4 as the Bartsocas-Papas syndrome locus."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We have further demonstrated that RIPK4 is a direct transcriptional target
      of the protein p63, a master regulator of stratified epithelial
      development
    explanation: Places RIPK4 downstream of p63.
  - reference: PMID:25246526
    reference_title: "Receptor-interacting protein kinase 4 and interferon regulatory factor 6 function as a signaling axis to regulate keratinocyte differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Gene promoter reporter and in vitro kinase assays, coimmunoprecipitation
      experiments, and confocal microscopy demonstrated that RIPK4 directly
      regulates IRF6 trans-activator activity and nuclear translocation.
    explanation: RIPK4 directly activates IRF6.
  - reference: PMID:25246526
    reference_title: "Receptor-interacting protein kinase 4 and interferon regulatory factor 6 function as a signaling axis to regulate keratinocyte differentiation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Gene knockdown and overexpression studies indicated that the RIPK4-IRF6
      signaling axis controls the expression of key transcriptional regulators
      of keratinocyte differentiation, including Grainyhead-like 3 and OVO-like
      1.
    explanation: Downstream differentiation regulators of the axis.
  - reference: PMID:31578523
    reference_title: "The RIPK4-IRF6 signalling axis safeguards epidermal differentiation and barrier function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we show that the role of RIPK4 in mouse development requires its
      kinase activity; that RIPK4 and IRF6 expressed in the epidermis regulate
      the same biological processes; and that the phosphorylation of IRF6 at
      Ser413 and Ser424 primes IRF6 for activation.
    explanation: >-
      Mouse genetics show the developmental role of RIPK4 depends on its kinase
      activity acting through IRF6.
  - reference: PMID:25430793
    reference_title: "A novel RIPK4-IRF6 connection is required to prevent epithelial fusions characteristic for popliteal pterygium syndromes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found that IRF6 controls RIPK4 expression and that wild-type, but not
      kinase-dead, RIPK4 can complement the gastrulation defect in Xenopus
      caused by IRF6 malfunctioning.
    explanation: >-
      Places RIPK4 and IRF6 in one pathway, which requires RIPK4 kinase
      activity.
  downstream:
  - target: Defective Keratinocyte Differentiation
    causal_link_type: DIRECT
  - target: Disrupted Craniofacial, Limb and Genital Morphogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      RIPK4 is required for craniofacial and limb development, but the steps
      between the loss of RIPK4-IRF6 signaling and the skeletal, facial and
      genital malformations have not been defined.
    evidence:
    - reference: PMID:22197489
      reference_title: "Mutations in RIPK4 cause the autosomal-recessive form of popliteal pterygium syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: >-
        RIPK4 mediates activation of the nuclear factor-κB (NF-κB) signaling
        pathway and is required for keratinocyte differentiation and
        craniofacial and limb development.
      explanation: >-
        States the developmental requirement for RIPK4, drawn from earlier
        work; INDIRECT because it does not show the intermediate steps.
- name: Impaired RIPK4 Wnt and Hippo Branch Signaling
  biological_scale: MOLECULAR
  description: >-
    Besides IRF6, RIPK4 phosphorylates other substrates. It phosphorylates the
    Wnt adaptor DVL2 to promote canonical Wnt/beta-catenin signaling, and
    Bartsocas-Papas RIPK4 mutants fail to induce beta-catenin accumulation. It
    also phosphorylates LATS1/2 in liquid condensates, acting as an upstream
    kinase of a noncanonical Hippo pathway; in Ripk4 knockout epidermis
    Yap/Taz are activated in the granular layer and repress cholesterol
    biosynthesis, and removing Yap/Taz partly rescues the barrier defect.
    Disease-derived RIPK4 mutants fail to activate LATS1/2. How much these
    branches contribute to the human malformations is not known.
  genes:
  - preferred_term: RIPK4
    term:
      id: hgnc:496
      label: RIPK4
  biological_processes:
  - preferred_term: canonical Wnt signaling pathway
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
    modifier: DECREASED
  - preferred_term: hippo signaling
    term:
      id: GO:0035329
      label: hippo signaling
    modifier: DECREASED
  evidence:
  - reference: PMID:23371553
    reference_title: "Phosphorylation of Dishevelled by protein kinase RIPK4 regulates Wnt signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Ectopic RIPK4, but not catalytically inactive or Bartsocas-Papas RIPK4
      mutants, induced accumulation of cytosolic β-catenin and a
      transcriptional program similar to that caused by Wnt3a.
    explanation: BPS RIPK4 mutants lose Wnt/beta-catenin signaling.
  - reference: PMID:25784454
    reference_title: "Disease-associated mutations in IRF6 and RIPK4 dysregulate their signalling functions."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mutation also inhibited the stabilisation of β-catenin by RIPK4, and
      thus may additionally impair Wnt signalling.
    explanation: The p.Ser376X allele loses beta-catenin stabilization.
  - reference: PMID:40570855
    reference_title: "RIPK4 promotes epidermal differentiation through phase separation and activation of LATS1/2."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Disease-derived RIPK4 mutants exhibit defects in LATS1/2 activation
      either due to impaired kinase activity or disrupted phase separation.
    explanation: Disease RIPK4 alleles fail to activate the Hippo kinases LATS1/2.
  notes: >-
    hippo signaling is DECREASED because RIPK4 loss removes LATS1/2 activation,
    which leaves the downstream effectors Yap/Taz more active.
  downstream:
  - target: Defective Keratinocyte Differentiation
    causal_link_type: DIRECT
    description: >-
      The RIPK4-LATS1/2 branch is required for epidermal differentiation in
      mice.
    evidence:
    - reference: PMID:40570855
      reference_title: "RIPK4 promotes epidermal differentiation through phase separation and activation of LATS1/2."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our findings demonstrate that a RIPK4-initiated noncanonical Hippo
        pathway plays a specific role in epidermal differentiation.
      explanation: The Hippo branch acts in epidermal differentiation.
  - target: Epidermal Barrier Failure
    causal_link_type: DIRECT
    description: >-
      Yap/Taz activation in Ripk4 knockout epidermis represses cholesterol
      synthesis, and removing Yap/Taz partly rescues the barrier.
    evidence:
    - reference: PMID:40570855
      reference_title: "RIPK4 promotes epidermal differentiation through phase separation and activation of LATS1/2."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Ripk4 knockout in mice results in activation of Hippo pathway effectors
        Yap/Taz in the granular layer, which subsequently represses cholesterol
        biosynthesis. Furthermore, the ablation of Yap/Taz partially rescues
        skin barrier defects.
      explanation: Hippo branch link to the barrier defect.
- name: Defective Keratinocyte Differentiation
  biological_scale: CELLULAR
  description: >-
    Without RIPK4, keratinocytes do not complete their differentiation program.
    Ripk4-null mice die perinatally with abnormal epidermal differentiation, the
    defect is cell autonomous to the keratinocyte lineage, and patient
    keratinocytes carrying recessive RIPK4 missense variants show altered
    differentiation together with defective cell adhesion.

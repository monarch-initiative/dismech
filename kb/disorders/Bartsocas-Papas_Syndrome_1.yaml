    explanation: First-trimester detection.
- phase: Perinatal lethality
  age_range: Fetal period to the first weeks after birth
  notes: >-
    Most affected fetuses and newborns die in utero or in the neonatal period.
    Recorded here rather than as a phenotype because the HPO death terms
    (HP:0003826 Stillbirth, HP:0003811 Neonatal death) sit under HP:0040006
    Mortality/Aging, outside the HP:0000118 root of the PhenotypeTerm enum
    (`just validate` rejects both in a phenotype_term).
  evidence:
  - reference: PMID:14608644
    reference_title: "Unreported manifestations in two Dutch families with Bartsocas-Papas syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bartsocas-Papas syndrome (BPS) is a severe autosomal recessive syndrome
      characterized by neonatal or intrauterine death in most cases
    explanation: Intrauterine or neonatal death in most cases.
  - reference: PMID:22197489
    reference_title: "Mutations in RIPK4 cause the autosomal-recessive form of popliteal pterygium syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Marked popliteal pterygium associated with multiple congenital anomalies
      was observed in six members of the family, four of whom died within a week
      after birth.
    explanation: Neonatal deaths in a RIPK4-confirmed family.
  - reference: PMID:9738862
    reference_title: "Bartsocas-Papas syndrome in an Arab family with four affected sibs: further characterization."
    supports: SUPPORT

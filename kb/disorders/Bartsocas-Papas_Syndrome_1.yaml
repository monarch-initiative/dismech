    explanation: A stillbirth and infant deaths among four affected sibs.
- phase: Survival into childhood
  age_range: Infancy to adolescence, in a minority
  notes: >-
    A minority survive the neonatal period; survivors to 20 months, 8 years and
    the second decade have been reported, and they need staged reconstructive
    surgery.
  evidence:
  - reference: PMID:1632449
    reference_title: "New case of Bartsocas-Papas syndrome surviving at 20 months."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 3 of the 11 Bartsocas-Papas syndrome patients described so far,
      including the present case, the condition has not been neonatally lethal.
    explanation: About a quarter of early-reported patients survived the neonatal period.
  - reference: PMID:22197489
    reference_title: "Mutations in RIPK4 cause the autosomal-recessive form of popliteal pterygium syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although Bartsocas-Papas syndrome was initially considered as a lethal
      disorder, there are reported cases at 2, 8, and 18 years of age
    explanation: Survival into childhood and adolescence.
diagnosis:
- name: Clinical Recognition and Molecular Genetic Testing
  description: >-
    The diagnosis is suspected in a fetus or newborn with popliteal webs,
    ankyloblepharon, oral synechiae, orofacial clefting, syndactyly and genital
    hypoplasia, and is confirmed by biallelic pathogenic RIPK4 variants. IRF6
    (dominant popliteal pterygium syndrome), CHUK and TP63 (AEC syndrome) are
    the main genes to consider; an attenuated RIPK4 case resembling AEC was
    first tested for TP63 and then solved by exome sequencing. Correct genotyping
    changes the recurrence risk from that of a dominant disorder to 25 percent.
  evidence:
  - reference: PMID:23610050
    reference_title: "Exome analysis in clinical practice: expanding the phenotype of Bartsocas-Papas syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to the autosomal dominant Hay-Wells syndrome, Bartsocas-Papas
      syndrome is autosomal recessive, implying a 25% recurrence risk.
    explanation: Molecular diagnosis distinguishes BPS from AEC and sets recurrence risk.
  - reference: PMID:25691407
    reference_title: "Expanding the genetic and phenotypic spectrum of popliteal pterygium disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings have clinical implications for genetic counseling of
      families with pterygia syndromes
    explanation: Sequencing IRF6, RIPK4 and CHUK resolves the pterygium syndromes.
- name: Prenatal Ultrasound
  description: >-
    Lower-limb webs, limb malformations and facial anomalies can be seen on
    obstetric ultrasound, including in the first trimester, which allows
    prenatal diagnosis in families with a previously affected child.
  evidence:
  - reference: PMID:12575021
    reference_title: "First-trimester diagnosis of Bartsocas-Papas syndrome (BPS) by transvaginal ultrasound: case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe a fourth surviving patient and what we believe to be the first
      prenatal diagnosis of BPS in the first trimester.
    explanation: First-trimester ultrasound diagnosis.
  - reference: PMID:17457955
    reference_title: "Prenatal diagnosis of a Turkish Bartsocas-Papas syndrome case with upper limb pterigia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Obstetric ultrasound presented lower limb malformations and facial findings.
    explanation: Ultrasound findings in a prenatally diagnosed fetus.
  - reference: PMID:14608644
    reference_title: "Unreported manifestations in two Dutch families with Bartsocas-Papas syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The intrafamilial resemblance in severity is of importance for the genetic
      counseling of families and prenatal detection by ultrasound.
    explanation: Recurrence in families supports ultrasound surveillance.
treatments:
- name: Staged Surgical Reconstruction
  description: >-
    Surviving children need staged plastic and reconstructive surgery: release
    of fused lips and oral bands to open the mouth, eyelid and facial soft-tissue
    reconstruction, cleft palate closure, and release of the popliteal webs.
    Reconstruction is difficult and repeated procedures may not restore
    function, so goals are balanced against the burden of surgery. There is no
    disease-modifying therapy.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: staged reconstructive surgery
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:10517476
    reference_title: "Bartsocas-Papas syndrome with fusion of the lips and posterior fusion defects of the thoracic vertebrae."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The fused lips were opened by incising the fibrotic bands closing her mouth.
    explanation: Surgical release of lip fusion and oral bands.
  - reference: PMID:33529824
    reference_title: "Bartsocas-Papas syndrome: The first case report of severe autosomal recessive form from Indonesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the third stage, we performed soft-tissue facial reconstruction, and
      then his cleft palate was closed at 12 months of age
    explanation: Staged facial reconstruction and palate closure.
  - reference: PMID:25275471
    reference_title: "Bartsocas-Papas Syndrome: A Case Report and Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This raises new challenges with reconstruction highlighted by this case
      with a difficult balance between trying to overcome some of the profound
      effects of the syndrome versus diminishing quality of life for the child
      by repeated and often unsuccessful surgical procedures.
    explanation: Limits and burden of reconstruction in a long-term survivor.
  target_mechanisms:
  - target: Fused Lips
    description: Opens the mouth mechanically; does not address the RIPK4 defect.
  - target: Popliteal Pterygium
    description: Releases the web to improve knee extension.
  - target: Cleft Palate
    description: Closes the palatal cleft.
- name: Gastrostomy Feeding
  description: >-
    A gastrostomy may be needed for nutrition when oral malformations prevent
    feeding.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: gastrostomy
    term:
      id: NCIT:C52006
      label: Gastrostomy
  evidence:
  - reference: PMID:33529824
    reference_title: "Bartsocas-Papas syndrome: The first case report of severe autosomal recessive form from Indonesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Gastrostomy was performed by pediatric surgeons due to nutritional problems.
    explanation: Gastrostomy for feeding difficulty in a surviving infant.
- name: Multidisciplinary Supportive Care
  description: >-
    Care for survivors involves plastic and pediatric surgery, urology,
    anesthesia, otolaryngology, genetics, dentistry, physical therapy and speech
    therapy.
  treatment_term:
    preferred_term: multidisciplinary supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:33529824
    reference_title: "Bartsocas-Papas syndrome: The first case report of severe autosomal recessive form from Indonesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Management of BPS is best performed by a multidisciplinary team of
      plastic surgeons, pediatric surgeons, pediatric urologists, anesthetists,
      pediatrics, otolaryngologist, geneticists, dentists, physical therapists,
      social workers, and speech therapists.
    explanation: Case report recommendation for multidisciplinary care.
- name: Genetic Counseling
  description: >-
    Parents of an affected child are counselled about the 25 percent
    recurrence risk of an autosomal recessive disorder, and about prenatal
    diagnosis by molecular testing or ultrasound in later pregnancies.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:23610050
    reference_title: "Exome analysis in clinical practice: expanding the phenotype of Bartsocas-Papas syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast to the autosomal dominant Hay-Wells syndrome, Bartsocas-Papas
      syndrome is autosomal recessive, implying a 25% recurrence risk.
    explanation: Recurrence risk for counseling.
differential_diagnoses:
- name: Autosomal dominant popliteal pterygium syndrome
  description: >-
    IRF6-related popliteal pterygium syndrome shares popliteal webs, cleft lip
    and palate, syndactyly, ankyloblepharon and genital malformations, and severe
    cases can be indistinguishable from Bartsocas-Papas syndrome. It is usually
    milder, dominant, and often has lower lip pits. IRF6 variants have not been
    found in Bartsocas-Papas syndrome.
  disease_term:
    preferred_term: autosomal dominant popliteal pterygium syndrome
    term:
      id: MONDO:0007334
      label: autosomal dominant popliteal pterygium syndrome
  distinguishing_features:
  - Heterozygous IRF6 variant with dominant transmission
  - Usually milder course
  - Lower lip pits
  evidence:
  - reference: PMID:25691407
    reference_title: "Expanding the genetic and phenotypic spectrum of popliteal pterygium disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The more severe cases of PPS may be indistinguishable from patients
      diagnosed with Bartsocas-Papas syndrome (BPS; MIM 263650), a recessive
      disorder caused by mutations in the receptor-interacting serine/threonine
      kinase RIPK4
    explanation: States the clinical overlap with dominant PPS.
  - reference: PMID:22876587
    reference_title: "Bartsocas-Papas syndrome with variable expressivity in an Egyptian family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Linkage was excluded to the IRF6 gene; a candidate gene implicated in the
      Van der Woude and popliteal pterygium syndromes, with overlapping features
      with BPS.
    explanation: IRF6 excluded in a BPS family.
- name: Bartsocas-Papas syndrome 2
  description: >-
    The CHUK (IKK-alpha) form of Bartsocas-Papas syndrome has the same clinical
    picture and is distinguished only by gene testing.
  disease_term:
    preferred_term: Bartsocas-Papas syndrome 2
    term:
      id: MONDO:0859154
      label: Bartsocas-Papas syndrome 2
  distinguishing_features:
  - Biallelic CHUK variants with normal RIPK4
  evidence:
  - reference: PMID:25691407
    reference_title: "Expanding the genetic and phenotypic spectrum of popliteal pterygium disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the third family with BPS (BPS3), RIPK4 sequencing was negative and the
      girl had a normal 46, XX karyotype; therefore, whole exome sequencing was
      performedto identify the causative mutation(s).
    explanation: A clinically typical BPS family without a RIPK4 variant, later found to carry CHUK.
- name: Cocoon syndrome
  description: >-
    Complete loss of CHUK gives a lethal fetal malformation with limbs encased
    under a membrane-like skin; the RIPK4 phenotype is similar but less severe.
  disease_term:
    preferred_term: cocoon syndrome
    term:
      id: MONDO:0013334
      label: cocoon syndrome
  distinguishing_features:
  - Limbs bound to the trunk under transparent, membrane-like skin
  - Biallelic CHUK loss
  evidence:
  - reference: PMID:22197489
    reference_title: "Mutations in RIPK4 cause the autosomal-recessive form of popliteal pterygium syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, the spectrum of malformations observed in the presented
      families is similar, but less severe than the conserved helix-loop-helix
      ubiquitous kinase (CHUK)-deficient human fetus phenotype; known as Cocoon
      syndrome
    explanation: Compares the RIPK4 and CHUK phenotypes.
- name: CHAND syndrome
  description: >-
    Allelic RIPK4 disorder with ankyloblepharon, curly sparse hair and nail
    dysplasia but without pterygia, clefting or lethality.
  disease_term:
    preferred_term: CHAND syndrome
    term:
      id: MONDO:0008959
      label: CHAND syndrome
  distinguishing_features:
  - No pterygia, oral synechiae or orofacial clefts
  - Curly hair
  - Homozygous RIPK4 p.Glu284Lys outside the kinase domain
  evidence:
  - reference: PMID:26129644
    reference_title: "Identification of a novel mutation in RIPK4 in a kindred with phenotypic features of Bartsocas-Papas and CHAND syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Interestingly, however, our patients did not have cleft lip/palate, a
      common feature encountered in Bartsocas-Papas syndrome.
    explanation: Absence of clefting distinguishes the CHAND family.
- name: Ankyloblepharon-ectodermal defects-cleft lip/palate syndrome
  description: >-
    TP63-related AEC (Hay-Wells) syndrome shares ankyloblepharon, clefting and
    ectodermal dysplasia, and an attenuated RIPK4 case was first diagnosed as
    AEC. AEC is dominant and lacks pterygia.
  disease_term:
    preferred_term: ankyloblepharon-ectodermal defects-cleft lip/palate syndrome
    term:
      id: MONDO:0007124
      label: ankyloblepharon-ectodermal defects-cleft lip/palate syndrome
  distinguishing_features:
  - Heterozygous TP63 variant with dominant inheritance
  - No pterygia
  evidence:
  - reference: PMID:23610050
    reference_title: "Exome analysis in clinical practice: expanding the phenotype of Bartsocas-Papas syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A clinical diagnosis of ankyloblepharon-ectodermal defects-cleft
      lip/palate or Hay-Wells syndrome resulted in TP63 sequence analysis.
    explanation: An attenuated RIPK4 case was first diagnosed as AEC.
- name: Autosomal recessive multiple pterygium syndrome
  description: >-
    The Escobar and lethal multiple pterygium syndromes produce pterygia
    through fetal akinesia, most often from CHRNG and other neuromuscular
    junction genes, rather than through epithelial fusion. They lack
    ankyloblepharon, oral synechiae and the ectodermal defects. The Aslan-type
    multiple pterygium patients were later shown to carry RIPK4 variants.
  disease_term:
    preferred_term: autosomal recessive multiple pterygium syndrome
    term:
      id: MONDO:0009926
      label: autosomal recessive multiple pterygium syndrome
  distinguishing_features:
  - Multiple flexion webs with contractures from reduced fetal movement
  - No ankyloblepharon, filiform oral bands or ectodermal dysplasia
  evidence:
  - reference: PMID:7124793
    reference_title: "Limb pterygium syndromes: a review and report of eleven patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These seven had multiple joint webs, unusual finger contractures,
      syndactyly, rocker bottom feet, ptosis, antimongoloid slant of palpebral
      fissures, epicanthal folds, highly arched palate, scoliosis, and short
      stature.
    explanation: The multiple pterygium phenotype, without the ectodermal features of BPS.
  - reference: PMID:22197489
    reference_title: "Mutations in RIPK4 cause the autosomal-recessive form of popliteal pterygium syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present study's findings show that recessive mutations in RIPK4 cause
      Bartsocas-Papas syndrome and its variant, the autosomal-recessive form of
      multiple pterygium syndrome (Aslan type).
    explanation: Places the Aslan-type multiple pterygium patients within the RIPK4 disease.
animal_models:
- name: Ripk4 knockout mouse
  species: Mouse
  genotype: Ripk4(-/-)
  publication: PMID:12194825
  description: >-
    Constitutive Ripk4 knockout. The mice die perinatally with abnormal
    epidermal differentiation and fusion of all external orifices, modeling the
    null end of the human disease.
  modeled_mechanisms:
  - target: Defective Keratinocyte Differentiation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: RIPK4 is required cell autonomously for keratinocyte differentiation.
    limitations: >-
      Mouse epidermis and hair follicle biology differ from human.
    evidence:
    - reference: PMID:12194825
      reference_title: "RIP4 is an ankyrin repeat-containing kinase essential for keratinocyte differentiation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        RIP4 deficiency in mice results in perinatal lethality associated with
        abnormal epidermal differentiation.
      explanation: The knockout's keratinocyte differentiation defect.
  - target: Periderm Defect and Epithelial Fusion
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Abnormal periderm, apical E-cadherin mislocalization and fusion of
      external orifices, as in the human pterygia and oral fusions.
    limitations: >-
      Mouse eyelids are physiologically fused at birth, so ankyloblepharon
      cannot be read directly from the mouse.
    evidence:
    - reference: PMID:25430793
      reference_title: "A novel RIPK4-IRF6 connection is required to prevent epithelial fusions characteristic for popliteal pterygium syndromes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Receptor-interacting protein kinase 4 (RIPK4)-deficient mice have
        epidermal defects and fusion of all external orifices.
      explanation: Epithelial fusion phenotype of the knockout.
- name: Epidermis-specific Ripk4 knockout mouse
  species: Mouse
  genotype: Ripk4 epidermis-specific deletion (RIPK4EKO)
  publication: PMID:29317263
  description: >-
    Deletion of Ripk4 in the epidermis only. The epidermis stratifies, but the
    mice die shortly after birth from water loss through leaky tight junctions.
  modeled_mechanisms:
  - target: Epidermal Barrier Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Shows that epidermal RIPK4 is required for the inside-out barrier.
    limitations: >-
      Whether barrier failure contributes to death in human neonates with
      Bartsocas-Papas syndrome 1 has not been examined.
    evidence:
    - reference: PMID:29317263
      reference_title: "Keratinocyte-Specific Ablation of RIPK4 Allows Epidermal Cornification but Impairs Skin Barrier Formation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        However, RIPK4EKO mice die shortly after birth due to excessive water
        loss because of loss of tight junction protein claudin-1 localization at
        the cell membrane, which results in tight junction leakiness.
      explanation: Barrier failure and neonatal death of the epidermal knockout.
discussions:
- discussion_id: ripk4_malformation_route
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Disrupted Craniofacial, Limb and Genital Morphogenesis
  prompt: >-
    How does loss of RIPK4 kinase signaling produce the limb reduction, bony
    synostosis, orofacial clefts and genital hypoplasia of Bartsocas-Papas
    syndrome 1?
  rationale: >-
    The epithelial fusions are explained by periderm failure in Ripk4-null
    mice, but digit loss, carpal and tarsal synostosis and genital hypoplasia
    are not part of the knockout phenotype as described in the cited abstracts.
    Whether RIPK4 acts on these structures through epidermal-mesenchymal
    signaling, as IKK-alpha does in the related cocoon syndrome, or through a
    direct role outside the epidermis, is not known.
  evidence:
  - reference: PMID:22197489
    reference_title: "Mutations in RIPK4 cause the autosomal-recessive form of popliteal pterygium syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The present study's findings point out that RIPK4 and CHUK might function
      in closely related pathways to promote keratinocyte differentiation and
      epithelial growth.
    explanation: The shared-pathway hypothesis with CHUK remains a proposal.
- discussion_id: ripk4_allelic_spectrum
  kind: KNOWLEDGE_GAP
  attaches_to:
  - disease#
  prompt: >-
    Do RIPK4 variants form a single severity spectrum from CHAND syndrome
    through attenuated forms to lethal Bartsocas-Papas syndrome, and does
    residual kinase activity predict severity?
  rationale: >-
    RIPK4 variants have been reported in an AEC-like presentation without
    pterygia, in patients diagnosed with the milder popliteal pterygium
    syndrome, in CHAND syndrome and in the lethal phenotype, and severity can
    differ within a family. The kinase-domain variants tested so far abolish
    activity, but no study has compared residual activity across the clinical
    range.
  evidence:
  - reference: PMID:25691407
    reference_title: "Expanding the genetic and phenotypic spectrum of popliteal pterygium disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also demonstrate that mutations in RIPK4 can cause features with a
      range of severity along the PPS-BPS spectrum
    explanation: Variable severity of RIPK4 disease.
  - reference: PMID:33713555
    reference_title: "A novel homozygous RIPK4 variant in a family with severe Bartsocas-Papas syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RIPK4 variants are associated with a wide range of clinical features
      ranging from milder ectodermal dysplasia to severe BPS.
    explanation: States the allelic range.
  - reference: PMID:22876587
    reference_title: "Bartsocas-Papas syndrome with variable expressivity in an Egyptian family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings provide further evidence of intrafamilial clinical
      heterogeneity in families with BPS.
    explanation: Severity differs within a family.
  proposed_experiments:
  - experiment_id: ripk4_allele_activity_panel
    name: RIPK4 allele kinase and IRF6 activation panel
    description: >-
      Measure kinase activity and IRF6 activation in keratinocytes for RIPK4
      alleles from lethal, attenuated and CHAND cases side by side, to test
      whether residual activity tracks clinical severity.
references:
- reference: PMID:4339984
  title: "Popliteal pterygium syndrome. Evidence for a severe autosomal recessive form."

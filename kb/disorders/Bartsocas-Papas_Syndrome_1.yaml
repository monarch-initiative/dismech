- name: Periderm Defect and Epithelial Fusion
  biological_scale: TISSUE
  description: >-
    The periderm is a transient superficial epithelial layer that forms early in
    embryogenesis and keeps apposed, adhesion-competent embryonic epithelia from
    sticking together. In Ripk4-deficient mice periderm development is abnormal,
    E-cadherin is mislocalized to the apical membrane of the outer peridermal
    cells, and all external orifices fuse; deleting E-cadherin in keratinocytes
    rescues the oral and tail-to-body fusions. Failure of periderm formation is
    the proposed common mechanism of the popliteal pterygium, cocoon and
    Bartsocas-Papas syndromes. In patients this produces the popliteal and other
    pterygia, ankyloblepharon, the fibrous bands between the jaws and the fused
    lips.
  cell_types:
  - preferred_term: peridermal cell
    term:
      id: CL:0000078
      label: peridermal cell
  biological_processes:
  - preferred_term: eyelid development in camera-type eye
    term:
      id: GO:0061029
      label: eyelid development in camera-type eye
    modifier: ABNORMAL
  evidence:
  - reference: PMID:25430793
    reference_title: "A novel RIPK4-IRF6 connection is required to prevent epithelial fusions characteristic for popliteal pterygium syndromes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here we describe that RIPK4 deficiency in mice causes epithelial fusions
      associated with abnormal periderm development and aberrant ectopic
      localization of E-cadherin on the apical membrane of the outer peridermal
      cell layers.
    explanation: Mechanism linking RIPK4 loss to epithelial fusion through the periderm.
  - reference: PMID:29317263
    reference_title: "Keratinocyte-Specific Ablation of RIPK4 Allows Epidermal Cornification but Impairs Skin Barrier Formation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We show here that the epithelial fusions observed in RIPK4 full knockout
      (KO) mice are E-cadherin dependent, as keratinocyte-specific deletion of
      E-cadherin in RIPK4 full KO mice rescued the tail-to-body fusion and
      fusion of oral epithelia.
    explanation: Genetic rescue showing the fusions require E-cadherin.
  - reference: PMID:25133425
    reference_title: "Periderm prevents pathological epithelial adhesions during embryogenesis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Furthermore, this study suggests that failure of periderm formation
      underlies a series of devastating birth defects, including popliteal
      pterygium syndrome, cocoon syndrome, and Bartsocas-Papas syndrome.
    explanation: >-
      Proposes periderm failure as the shared mechanism; INDIRECT because the
      periderm data in this study come from Irf6, Ikka and Sfn mutant mice and a
      cocoon syndrome fetus rather than from RIPK4.
  notes: >-
    The mouse data are from Ripk4-null animals; the human periderm has not been
    examined in Bartsocas-Papas syndrome 1. ABNORMAL is used for the eyelid
    process because the defect is a failure of lid-margin separation rather than
    a change in the amount of a process.
  downstream:
  - target: Popliteal Pterygium
    causal_link_type: DIRECT
  - target: Multiple Pterygia
    causal_link_type: DIRECT
  - target: Ankyloblepharon
    causal_link_type: DIRECT
  - target: Oral Synechiae
    causal_link_type: DIRECT
  - target: Fused Lips
    causal_link_type: DIRECT
  - target: Finger Syndactyly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The soft-tissue syndactyly is grouped with the epithelial fusions as a
      shared feature of the popliteal pterygium syndromes; a periderm origin for
      digital fusion has not been shown directly.
    evidence:
    - reference: PMID:25430793
      reference_title: "A novel RIPK4-IRF6 connection is required to prevent epithelial fusions characteristic for popliteal pterygium syndromes."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        Although genetically distinct, these syndromes share the anomalies of
        marked pterygia, syndactyly, clefting and hypoplastic genitalia.
      explanation: Places syndactyly alongside the pterygia in the shared phenotype.
  - target: Toe Syndactyly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: As for finger syndactyly; inferred rather than shown.
- name: Hair Follicle and Ectodermal Appendage Dysplasia
  biological_scale: TISSUE
  description: >-
    Defective keratinocyte differentiation disturbs the ectodermal appendages.
    Ripk4-null skin grafted onto a normal host forms abnormal hair follicles and
    dysplastic epidermis, the likely basis of the absent scalp hair, eyebrows and
    eyelashes. The absent or hypoplastic nails are attributed to the same defect
    in the nail unit by analogy; nail biology in RIPK4 deficiency has not been
    studied.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: hair follicle development
    term:
      id: GO:0001942
      label: hair follicle development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:12194825
    reference_title: "RIP4 is an ankyrin repeat-containing kinase essential for keratinocyte differentiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Instead, abnormal hair follicle development and epidermal dysplasia,
      indicative of progression into a more pathologic state, are observed.
    explanation: Hair follicle development is abnormal in RIPK4-deficient skin.
  downstream:
  - target: Alopecia Totalis
    causal_link_type: DIRECT
  - target: Absent Eyebrows
    causal_link_type: DIRECT
  - target: Sparse or Absent Eyelashes
    causal_link_type: DIRECT
  - target: Nail Hypoplasia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inferred from the keratinocyte differentiation defect; nail-unit biology
      of RIPK4 deficiency has not been studied.
- name: Epidermal Barrier Failure
  biological_scale: TISSUE
  description: >-
    In mice, RIPK4 and IRF6 in the epidermis are needed to build the
    inside-out barrier. Epidermis-specific Ripk4 knockout mice stratify their
    epidermis but die shortly after birth from excessive water loss, because
    claudin-1 is not localized to the membrane and tight junctions leak. Whether
    barrier failure contributes to neonatal death in Bartsocas-Papas syndrome 1,
    where newborns also have severe facial, oral and limb malformations, has not
    been studied.
  biological_processes:
  - preferred_term: establishment of skin barrier
    term:
      id: GO:0061436
      label: establishment of skin barrier
    modifier: DECREASED
  evidence:
  - reference: PMID:29317263
    reference_title: "Keratinocyte-Specific Ablation of RIPK4 Allows Epidermal Cornification but Impairs Skin Barrier Formation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      However, RIPK4EKO mice die shortly after birth due to excessive water loss
      because of loss of tight junction protein claudin-1 localization at the
      cell membrane, which results in tight junction leakiness.
    explanation: Epidermal RIPK4 is required for barrier function and neonatal survival in mice.
  - reference: PMID:31578523
    reference_title: "The RIPK4-IRF6 signalling axis safeguards epidermal differentiation and barrier function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Accordingly, the lipid composition of the stratum corneum of Irf6-/- skin
      was abnormal, culminating in a severe defect in the function of the
      epidermal barrier.
    explanation: >-
      Barrier defect downstream of IRF6, the RIPK4 substrate, in the same
      signaling axis.
  downstream:
  - target: Scaling Skin
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inferred: scaly skin in patients is consistent with the mouse barrier
      defect, but human epidermal barrier function has not been measured.
- name: Disrupted Craniofacial, Limb and Genital Morphogenesis
  biological_scale: TISSUE
  description: >-
    RIPK4 is required for craniofacial and limb development, and RIPK4, IRF6
    and IKK-alpha mutant mice share a thickened epidermis with cleft palate or a
    fused oral cavity. The resulting malformations in patients are orofacial
    clefts, a hypoplastic nose, eyelid coloboma, reduction of the digits with
    absent thumbs and hypoplastic distal phalanges, synostosis of carpal,
    tarsal and phalangeal bones, clubfeet and hypoplastic or ambiguous external
    genitalia. How RIPK4 loss produces the skeletal and genital defects is not
    established.
  biological_processes:
  - preferred_term: limb development
    term:
      id: GO:0060173
      label: limb development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:25691407
    reference_title: "Expanding the genetic and phenotypic spectrum of popliteal pterygium disorders."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      Ikka, Irf6, and Ripk4 mutant mice share a thick, tightened epidermis and
      cleft palate or fused oral cavity.
    explanation: Shared craniofacial phenotype of the three mutant mouse lines.
  - reference: PMID:22197489
    reference_title: "Mutations in RIPK4 cause the autosomal-recessive form of popliteal pterygium syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      marked popliteal pterygium leading to severe arthrogryposis, synostosis of
      the carpal/tarsal and phalangeal bones in the hands and feet, digital
      hypoplasia/aplasia, and complete soft-tissue syndactyly
    explanation: The limb malformation pattern of the syndrome.
  notes: >-
    This node collects malformations whose mechanism is known only to start from
    the loss of RIPK4-IRF6 signaling; the intermediate steps are a knowledge gap
    (see discussions).
  downstream:
  - target: Cleft Palate
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      In RIPK4-deficient mice the oral epithelia fuse, and periderm failure can
      cause palatal shelves to adhere to the mandible or tongue, but the route to
      human palatal clefting in this disease has not been shown.
  - target: Cleft Lip

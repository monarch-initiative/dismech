- hereditary lethal multiple congenital anomalies/dysmorphic syndrome
notes: >-
  Scope. This entry covers the RIPK4 form (OMIM 263650, MONDO:0009901).
  Bartsocas-Papas syndrome 2 (MONDO:0859154) is the CHUK (IKK-alpha) form; it
  shares the clinical picture but has a different gene and is not covered here.
  Orphanet keeps a single concept, ORPHA:1234, that maps as broader to both OMIM
  numbers, so the Orphanet phenotype frequencies cited in this entry describe the
  clinical syndrome as a whole rather than molecularly confirmed RIPK4 cases
  alone. Most of the clinical series cited (1984 to 2012) predate the
  identification of RIPK4 and are diagnosed on clinical grounds.

  Relationship to CHAND syndrome (MONDO:0008959). CHAND syndrome is allelic
  (homozygous RIPK4 p.Glu284Lys, outside the kinase domain) and is curated as a
  separate entry. Bartsocas-Papas syndrome 1 adds pterygia, oral synechiae,
  orofacial clefting, limb reduction and synostosis, genital hypoplasia and
  perinatal lethality, which are not true of CHAND, and MONDO, OMIM and Orphanet
  keep the two diseases distinct. Attenuated RIPK4 presentations without
  pterygia or lethality have been reported under the Bartsocas-Papas name
  (PMID:23610050); they are kept in this entry because the source assigns them
  here, and the open question of a single RIPK4 spectrum is recorded in the
  discussions section.

  The intellectual disability listed as frequent by Orphanet is not included as
  a phenotype, because the surviving patients described in the cited abstracts
  are not characterised for development and a case review reports no
  disturbance of intelligence. No ClinGen gene-disease validity record for RIPK4
  was found in cache/clingen/gene_validity.csv, so no gene_disease_validity tier
  is recorded. `just check-genereviews` reports no GeneReviews chapter for this
  disease or for RIPK4; the phenotype baseline is Orphanet and the primary
  literature.

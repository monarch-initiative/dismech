    modifier: DECREASED
    term:
      id: GO:0006974
      label: DNA damage response
  downstream:
  - target: Loss of Cell Cycle Checkpoint Control
    description: p53 inactivation removes G1/S and G2/M checkpoint enforcement
    evidence:

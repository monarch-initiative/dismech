        by upregulating IL-6 expression in tumor cells through the NF-κB signaling
        pathway.
      explanation: >-
        The study identifies IL-6 as the intervening signal between AFB1-exposed
        tumor cells and M2-like macrophage polarization in its mechanistic systems.

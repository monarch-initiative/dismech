  biological_scale: CELLULAR
  description: >-
    AFB1-associated tumor-cell IL-6 promotes an immunosuppressive M2-like
    macrophage state. Combined IL-6 and PD-1 blockade has so far shown benefit
    only in a mouse tumor model and remains investigational in patients.
  cell_types:

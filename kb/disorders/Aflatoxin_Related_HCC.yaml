biochemical:
- name: Alpha-Fetoprotein (AFP)
  notes: >-
    Serum AFP is used with imaging in surveillance of high-risk populations and
    can be followed during treatment. It is not specific for aflatoxin etiology.
  evidence:
  - reference: PMID:27785449
    reference_title: "Hepatocellular carcinoma: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Screening includes both radiologic tests, such
      as ultrasound, computerized tomography, and magnetic resonance imaging, and
      serological markers such as α-fetoprotein at 6-month intervals.
    explanation: >-
      Confirms serum alpha-fetoprotein is used as a serological screening marker
      for HCC in surveillance.
- name: Aflatoxin-Albumin Adducts
  notes: >-
    Aflatoxin-albumin adducts in serum serve as biomarkers of recent aflatoxin
    exposure and are used in epidemiologic studies to assess population-level exposure.
  evidence:
  - reference: PMID:28114823
    reference_title: Comparison of urinary aflatoxin M1 and aflatoxin albumin adducts as biomarkers for assessing aflatoxin exposure in Tanzanian children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AFM1 measures short-term exposure, whereas AF-alb measures longer term exposure.
    explanation: >-
      Establishes serum aflatoxin-albumin (AF-alb) adducts as a biomarker of
      longer-term aflatoxin exposure.
- name: Urinary Aflatoxin Metabolites
  notes: >-
    Urinary aflatoxin M1 (AFM1) reflects recent AFB1 exposure and is used in
    exposure-assessment studies; it is not itself a tumor diagnostic marker.
  evidence:
  - reference: PMID:28114823
    reference_title: Comparison of urinary aflatoxin M1 and aflatoxin albumin adducts as biomarkers for assessing aflatoxin exposure in Tanzanian children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Urinary AFM1 is a good biomarker for AFB1 exposure in Tanzanian
      children, reflecting geographical and temporal variations in exposure to this
      foodborne toxin.
    explanation: >-
      Establishes urinary aflatoxin metabolite (AFM1) measurement as a biomarker
      of recent aflatoxin exposure.
genetic:
- name: TP53
  association: Somatic Mutation (R249S)
  gene_term:
    preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  notes: >-
    The TP53 R249S mutation is the molecular signature of aflatoxin-related HCC,
    enriched in high-exposure regions and rare in low-incidence regions. It
    results from AFB1-DNA damage at codon 249 and impairs p53 function.
  evidence:
  - reference: PMID:33457005
    reference_title: Genome-wide association study of the TP53 R249S mutation in hepatocellular carcinoma with aflatoxin B1 exposure and infection with hepatitis B virus.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exposure to dietary aflatoxin B1 (AFB1) induces DNA damage and
      mutation in the TP53 gene at codon 249, known as the TP53 R249S mutation, and is
      a major risk factor for hepatocellular carcinoma (HCC).
    explanation: >-
      Establishes the aflatoxin-induced TP53 R249S codon 249 mutation as a major
      somatic driver and risk factor for HCC.
- name: GSTM1
  association: Null genotype
  gene_term:
    preferred_term: GSTM1
    term:
      id: hgnc:4632
      label: GSTM1
  relationship_type: MODIFIER
  notes: >-
    The GSTM1-null genotype modifies susceptibility in aflatoxin-exposed
    populations; it is an exposure-response modifier rather than a somatic driver.
  evidence:
  - reference: PMID:15734960
    reference_title: Hepatocellular carcinoma and polymorphisms in carcinogen-metabolizing and DNA repair enzymes in a population with aflatoxin exposure and hepatitis B virus endemicity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The risk for HCC with null GSTM1 was most prominent among those with the
      highest groundnut consumption (OR, 4.67; 95% CI, 1.45-15.1) and was not
      evident among those with less than the mean groundnut intake (OR, 0.64;
      95% CI, 0.20-2.02).
    explanation: >-
      The exposure-stratified case-control result supports GSTM1-null as a
      modifier of HCC susceptibility under high presumed aflatoxin exposure.
- name: XRCC1
  association: XRCC1-399 AG genotype
  gene_term:
    preferred_term: XRCC1
    term:
      id: hgnc:12828
      label: XRCC1
  relationship_type: MODIFIER
  notes: >-
    XRCC1-399 variation was associated with HCC in an aflatoxin-exposed,
    HBV-endemic case-control population; it is modeled as a susceptibility
    modifier, not as an aflatoxin-specific somatic driver.
  evidence:
  - reference: PMID:15734960
    reference_title: Hepatocellular carcinoma and polymorphisms in carcinogen-metabolizing and DNA repair enzymes in a population with aflatoxin exposure and hepatitis B virus endemicity.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the heterozygote XRCC1-399 AG genotype (OR, 3.18; 95% CI, 1.35-7.51) were
      significantly associated with HCC.
    explanation: >-
      The adjusted case-control association supports XRCC1-399 AG as a
      susceptibility modifier in the study population, without establishing causality.
treatments:
- name: Surgical Resection
  description: >-
    Hepatic resection is potentially curative for early-stage HCC with preserved
    liver function. Limited by underlying cirrhosis and multifocal disease in
    many aflatoxin-exposed populations.
  evidence:
  - reference: PMID:27785449
    reference_title: "Hepatocellular carcinoma: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      only orthotopic liver transplantation (OLT) or surgical resection is
      curative
    explanation: >-
      Clinical review confirms that surgical resection is one of the few
      curative options for hepatocellular carcinoma.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Definitive Surgical Resection
    term:
      id: NCIT:C154430
      label: Definitive Surgical Resection
- name: Liver Transplantation
  description: >-
    Curative option for selected early HCC meeting or downstaged into Milan or
    University of California, San Francisco eligibility criteria. Transplantation
    treats both tumor and underlying liver disease but is limited by organ availability.
  evidence:
  - reference: PMID:27785449
    reference_title: "Hepatocellular carcinoma: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      OLT is available for patients who meet or are downstaged into the Milan
      or University of San Francisco criteria
    explanation: >-
      Clinical review describes orthotopic liver transplantation eligibility
      under Milan/UCSF criteria, consistent with this treatment option.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: organ transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
- name: Locoregional Tumor Ablation
  description: >-
    Radiofrequency ablation, microwave ablation, percutaneous ethanol injection,
    or cryoablation may provide local tumor control for selected HCCs.
  evidence:
  - reference: PMID:27785449
    reference_title: "Hepatocellular carcinoma: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Additional treatment modalities include transarterial chemoembolization,
      radiofrequency ablation, microwave ablation, percutaneous ethanol
      injection, cryoablation
    explanation: >-
      Review explicitly lists multiple local ablation approaches used for HCC.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Ablation Therapy
    term:
      id: NCIT:C20985
      label: Ablation Therapy
- name: Sorafenib
  description: >-
    Sorafenib improved overall survival compared with placebo in the SHARP trial
    for advanced HCC. This treatment is inherited from HCC management and is not
    specific to aflatoxin etiology.
  evidence:
  - reference: PMID:18650514
    reference_title: Sorafenib in advanced hepatocellular carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Median overall survival was 10.7 months in the sorafenib group and 7.9
      months in the placebo group (hazard ratio in the sorafenib group, 0.69;
      95% confidence interval, 0.55 to 0.87; P<0.001).
    explanation: >-
      SHARP trial demonstrating sorafenib extends median survival by nearly 3
      months in advanced hepatocellular carcinoma.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sorafenib
      term:
        id: CHEBI:50924
        label: sorafenib
  therapeutic_modality: SMALL_MOLECULE
- name: HBV Vaccination
  description: >-
    HBV vaccination prevents a major cofactor for HCC and is especially relevant
    in populations where HBV and dietary aflatoxin exposures coexist. The cited
    review supports HCC prevention, not an aflatoxin-specific effect size.
  evidence:
  - reference: PMID:27785449
    reference_title: "Hepatocellular carcinoma: a review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      HCC can be prevented if there are appropriate measures taken, including
      hepatitis B virus vaccination
    explanation: >-
      Clinical review confirms HBV vaccination as a key preventive measure
      reducing HCC incidence in aflatoxin-endemic populations.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
- name: Oltipraz and Chlorophyllin Chemoprevention
  description: >-
    Randomized trials in aflatoxin-exposed participants showed modulation of
    aflatoxin biomarkers by oltipraz and chlorophyllin. These surrogate outcomes
    establish proof of principle but do not demonstrate reduced HCC incidence.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Chemoprevention
    term:
      id: NCIT:C15604
      label: Chemoprevention
    therapeutic_agent:
    - preferred_term: oltipraz
      term:
        id: CHEBI:77319
        label: oltipraz
    - preferred_term: chlorophyllin
      term:
        id: CHEBI:232141
        label: chlorophyllin
  evidence:
  - reference: PMID:15508099
    reference_title: Chemoprevention of hepatocellular carcinoma in aflatoxin endemic areas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both chemopreventive agents modulated levels of aflatoxin biomarkers in
      the study participants in manners consonant with protection.
    explanation: >-
      The randomized-trial summary supports biomarker modulation in exposed
      participants, while the entry explicitly avoids claiming cancer prevention.
  target_mechanisms:
  - target: AFB1 Phase II Detoxification
    treatment_effect: ACTIVATES
    description: Oltipraz induces phase II enzymes involved in aflatoxin detoxification.
    evidence:
    - reference: PMID:15508099
      reference_title: Chemoprevention of hepatocellular carcinoma in aflatoxin endemic areas.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        oltipraz, is a potent inducer of phase 2 enzymes involved in the
        detoxication of carcinogens including aflatoxin.
      explanation: >-
        This mechanism applies specifically to oltipraz; chlorophyllin acts mainly
        by limiting carcinogen bioavailability and is not assigned to this target.
diagnosis:
- name: Circulating TP53 R249S Droplet Digital PCR
  description: >-
    Droplet digital PCR can detect circulating cell-free TP53 R249S DNA and may
    complement HCC assessment or population exposure surveillance in endemic
    settings. Detection is neither fully sensitive nor disease-defining.
  diagnosis_term:
    preferred_term: Droplet Digital PCR
    term:
      id: NCIT:C166064
      label: Droplet Digital PCR
  markers: circulating cell-free TP53 R249S DNA
  results: TP53 R249S-positive droplets are enriched in HCC but can also occur in controls.
  evidence:
  - reference: PMID:29749584
    reference_title: Droplet digital PCR detects high rate of TP53 R249S mutants in cell-free DNA of middle African patients with hepatocellular carcinoma.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observed a mutation prevalence of 24.8% (n = 37/149) in patients with
      tumor and 5.6% (n = 12/213) in controls (P = 2.2E-07).
    explanation: >-
      The Middle African case-control study demonstrates enrichment but also
      imperfect sensitivity and nonzero detection in controls, supporting an adjunctive role.
epidemiology:
- name: HBV-aflatoxin joint effect
  description: >-
    Biomarker-based studies support increased HCC risk when HBV infection and
    aflatoxin exposure coexist, but estimates differ on whether the joint effect
    is multiplicative or additive. This statistical interaction is represented
    as epidemiology rather than as a cellular pathophysiology node.
  factors:
  - chronic hepatitis B virus infection
  - dietary aflatoxin exposure
  evidence:
  - reference: PMID:14986813
    reference_title: Synergistic interaction between aflatoxin B1 and hepatitis B virus in hepatocarcinogenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      cohort studies of patients with HCC in China and Taiwan have provided
      compelling evidence for a multiplicative or sub-multiplicative interaction
      between HBV and AFB1 in the genesis of human HCC.
    explanation: >-
      This review summarizes earlier biomarker-based cohorts as multiplicative or
      sub-multiplicative.
  - reference: PMID:19273485
    reference_title: Aflatoxin B1 exposure, hepatitis B virus infection, and hepatocellular carcinoma in Taiwan.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, in this larger study, the effect of combined AFB1 exposure and HBV
      infection is more consistent with an additive than a multiplicative model.
    explanation: >-
      The larger nested case-control analysis directly qualifies the interaction
      model and prevents a universal multiplicative claim.
- name: Estimated global aflatoxin-attributable HCC burden
  description: >-
    A 2010 quantitative risk assessment estimated a broad annual global burden
    attributable to aflatoxin. This historical model-based range is not a current
    prevalence estimate and depends on exposure, HBV prevalence, and potency assumptions.
  minimum_value: 25200
  maximum_value: 155000
  unit: attributable HCC cases per year
  factors:
  - dietary aflatoxin exposure
  - chronic hepatitis B virus prevalence
  evidence:
  - reference: PMID:20172840
    reference_title: "Global burden of aflatoxin-induced hepatocellular carcinoma: a risk assessment."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Of the 550,000-600,000 new HCC cases worldwide each year, about
      25,200-155,000 may be attributable to aflatoxin exposure.
    explanation: >-
      The quantitative risk model provides the stated historical range; it is
      presented with its model and time limitations rather than as observed prevalence.

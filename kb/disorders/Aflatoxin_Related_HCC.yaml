      reference_title: "Effects of the TP53 p.R249S mutant on proliferation and clonogenic properties in human hepatocellular carcinoma cell lines: interaction with hepatitis B virus X protein."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: >-
        Using HCC cell lines, we show that p.R249S has lost the capacity to bind
        to p53 response elements and to transactivate p53 target genes.
      explanation: >-
        Supports the causal link from R249S-mediated loss of p53 transactivation
        to failure of p53-dependent cell cycle checkpoint enforcement.
  - target: R249S-CDK4-PIN1-c-Myc Gain-of-Function
    description: Serine 249 enables a phosphorylation-dependent oncogenic gain of function.
    evidence:
    - reference: PMID:29225033
      reference_title: Mutant p53 Gains Its Function via c-Myc Activation upon CDK4 Phosphorylation at Serine 249 and Consequent PIN1 Binding.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        These results unveil a CDK4-PIN1-p53-RS-c-Myc pathway as a novel
        mechanism for the GOF of p53-RS in HCC.
      explanation: >-
        Biochemical and HCC-cell experiments directly support a distinct
        phosphorylation-dependent R249S gain-of-function branch.

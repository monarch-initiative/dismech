      label: macrophage activation
  evidence:
  - reference: PMID:40789982
    reference_title: Aflatoxin B1 Promotes M2-like Macrophage Polarization via IL-6 Expression in Hepatocellular Carcinoma.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found that AFB1 indirectly influences M2-like macrophage polarization
      by upregulating IL-6 expression in tumor cells through the NF-κB signaling
      pathway.
    explanation: >-
      The mechanistic cell-system component supports an AFB1-associated M2-like
      state mediated by tumor-cell IL-6.
  - reference: PMID:40789982
    reference_title: Aflatoxin B1 Promotes M2-like Macrophage Polarization via IL-6 Expression in Hepatocellular Carcinoma.

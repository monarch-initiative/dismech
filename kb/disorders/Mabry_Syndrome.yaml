biochemical:
- name: Serum tissue-nonspecific alkaline phosphatase
  notes: >-
    Serum tissue-nonspecific alkaline phosphatase is persistently elevated because
    the GPI-anchored enzyme is released into the circulation rather than degraded.
    Isoenzyme fractionation confirms the tissue-nonspecific (ALPL) isoform without
    accompanying bone disease. Notably, elevated ALP is not universal across
    inherited GPI deficiency, and normal or low ALP does not exclude the diagnosis.
  evidence:
  - reference: PMID:22228761
    reference_title: "Mechanism for release of alkaline phosphatase caused by glycosylphosphatidylinositol deficiency in patients with hyperphosphatasia mental retardation syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Hyperphosphatasia resulted from secretion of ALP, a GPI-anchored protein normally expressed on the cell surface, into serum due to PIGV deficiency."
    explanation: Mechanistic basis of the elevated serum alkaline phosphatase.
  - reference: PMID:29310717
    reference_title: "Characterization of glycosylphosphatidylinositol biosynthesis defects by clinical features, flow cytometry, and automated image analysis."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "hyperphosphatasia is a variable feature that is not ideal for a clinical classification"
    explanation: Hyperphosphatasia is not universal across GPI biosynthesis defects, so a normal or low ALP does not exclude the diagnosis.

prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.1
  notes: >-
    Orphanet lists point prevalence <1/1,000,000 (ORPHA:247262). Fewer than ~100
    HPMRS patients are reported for the common subtypes; some subtypes have
    single-digit case counts.

diagnosis:
- name: Flow cytometry for GPI-anchored protein surface expression
  description: >-
    Functional confirmatory assay: flow cytometry for reduced surface GPI-anchored
    proteins (FLAER binding the GPI core; CD16/CD24 on granulocytes; CD55/CD59) on
    blood cells and fibroblasts. Flow confirms a GPI biosynthesis defect but does not
    identify the specific gene or predict severity.
  markers: "FLAER, CD16, CD24, CD55, CD59 on granulocytes and fibroblasts"
  evidence:
  - reference: PMID:29310717
    reference_title: "Characterization of glycosylphosphatidylinositol biosynthesis defects by clinical features, flow cytometry, and automated image analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "flow cytometry in blood cells and fibroblasts of 39 and 14 individuals with a GPIBD, respectively"
    explanation: Flow cytometry of blood cells and fibroblasts is a confirmatory screen for GPI biosynthesis defects.
- name: Molecular genetic testing (exome/genome sequencing)
  description: >-
    Whole-exome or whole-genome sequencing (ideally with RNA-seq) is first-line for
    undiagnosed developmental delay/seizures with high ALP, since targeted panels can
    miss intronic/3'UTR and promoter variants (documented for PGAP3 and PIGY). Serum
    transferrin isoelectric focusing is normal, distinguishing HPMRS from classical
    N-glycosylation CDGs.
  diagnosis_term:
    preferred_term: clinical whole-exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing

progression:
- phase: Neonatal-infantile onset
  age_range: neonatal to first year
  notes: >-
    Neonatal hypotonia, facial dysmorphism, and incidental hyperphosphatasia, with
    developmental delay apparent in the first year and median seizure onset around
    6 months.
  evidence:
  - reference: PMID:38456468
    reference_title: "The clinical and genetic spectrum of inherited glycosylphosphatidylinositol deficiency disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median age at seizure onset was 6 months"
    explanation: Median seizure onset at 6 months in the largest cohort.
- phase: Progressive neurodegeneration
  age_range: childhood
  notes: >-
    Long framed as a static encephalopathy, serial imaging instead shows progressive
    cerebral volume loss (87.5%) and progressive cerebellar atrophy (70.8%),
    indicating a superimposed neurodegenerative process, with intractable epilepsy
    and feeding/aspiration difficulty.
  evidence:
  - reference: PMID:38456468
    reference_title: "The clinical and genetic spectrum of inherited glycosylphosphatidylinositol deficiency disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cerebellar atrophy in 70.8%, indicating a neurodegenerative process"
    explanation: Serial imaging documents progressive atrophy, establishing a neurodegenerative course.
- phase: Outcome
  notes: >-
    Mortality is substantial (about 18% in the largest cohort), driven by respiratory
    infection, seizure-related death, and SUDEP; milder genotypes can survive to
    adulthood.
  evidence:
  - reference: PMID:38456468
    reference_title: "The clinical and genetic spectrum of inherited glycosylphosphatidylinositol deficiency disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "15 of whom were deceased at the time of writing"
    explanation: 15 of 83 individuals deceased, the basis for the ~18% mortality figure.

treatments:
- name: High-dose pyridoxine / pyridoxal-5-phosphate
  description: >-
    High-dose oral pyridoxine (or pyridoxal-5-phosphate) restores the CNS cofactor
    pool depleted by circulating free alkaline phosphatase. It reduces seizure
    frequency in roughly a third to a half of patients but rarely achieves seizure
    freedom, with no established dose-response and occasional paradoxical worsening;
    chronic high-dose exposure carries a risk of sensory peripheral neuropathy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: pyridoxine supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: pyridoxine
      term:
        id: CHEBI:16709
        label: pyridoxine
  target_mechanisms:
  - target: Circulating Pyridoxal-5-Phosphate Depletion
    treatment_effect: MODULATES
    description: >-
      Supplemental pyridoxine/P5P replenishes the CNS pyridoxal-5-phosphate pool
      depleted by circulating free alkaline phosphatase, partially relieving the
      cofactor-deficiency arm that drives seizures.
  evidence:
  - reference: PMID:35080266
    reference_title: "Pyridoxine or pyridoxal-5-phosphate treatment for seizures in glycosylphosphatidylinositol deficiency: A cohort study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "reduction in 2 out of 7 and less than 50% reduction in another 3 out of 7 participants"
    explanation: Prospective cohort found partial seizure reduction in a subset, with no participant reaching seizure freedom.
- name: Folinic acid
  description: >-
    Co-administered with pyridoxine when CSF 5-methyltetrahydrofolate is low, as in
    the documented HPMRS3 case.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: folinic acid
      term:
        id: CHEBI:15640
        label: 5-formyltetrahydrofolic acid
  evidence:
  - reference: PMID:36636587
    reference_title: "Hyperphosphatasia with mental retardation syndrome 3: Cerebrospinal fluid abnormalities and correction with pyridoxine and Folinic acid."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "correction with pyridoxine and Folinic acid"
    explanation: Folinic acid was co-administered with pyridoxine to correct the CSF vitamer deficiencies.
- name: Anticonvulsant therapy
  description: >-
    Symptomatic antiseizure medication; levetiracetam is the most-used agent.
    Epilepsy is drug-resistant in a majority, and no agent is specifically indicated.
  treatment_term:
    preferred_term: anticonvulsant agent therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
- name: Gastrostomy
  description: Enteral feeding for aspiration risk and feeding difficulty.
  treatment_term:
    preferred_term: gastrostomy
    term:
      id: NCIT:C52006
      label: Gastrostomy
- name: Supportive and rehabilitative care
  description: >-
    Multidisciplinary supportive care including physical, occupational, and speech
    therapy, bone-health and scoliosis monitoring, and management of cardiac, renal,
    and sensory complications.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Genetic counseling
  description: >-
    Recurrence-risk counseling (25% per pregnancy), carrier and cascade testing, and
    reproductive options including preimplantation and prenatal testing.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling

differential_diagnoses:
- name: Transient hyperphosphatasemia of infancy
  description: >-
    Benign, self-resolving elevation of alkaline phosphatase in infancy without
    neurologic features; the most common benign mimic to exclude.
  distinguishing_features:
  - Self-limited, resolving over weeks to months, with no developmental or seizure phenotype.
- name: Hypophosphatasia
  description: >-
    The biochemical mirror image: pathogenically LOW alkaline phosphatase from ALPL
    deficiency, with rickets/osteomalacia rather than the HPMRS neurodevelopmental
    picture.
  distinguishing_features:
  - Low (not elevated) serum alkaline phosphatase; skeletal mineralization defect.
- name: Other congenital disorders of glycosylation
  description: >-
    Classical N-glycosylation CDGs share multisystem/neurologic features but show an
    abnormal serum transferrin isoelectric focusing pattern, which is normal in HPMRS.
  distinguishing_features:
  - Abnormal transferrin isoelectric focusing (normal in HPMRS).
- name: GPI biosynthesis defects without hyperphosphatasia
  description: >-
    Multiple congenital anomalies-hypotonia-seizures syndromes (PIGN, PIGT, PIGA)
    and other GPI defects overlap clinically but lack the mannose-dependent release
    of soluble ALP and so do not show hyperphosphatasia.
  distinguishing_features:
  - Normal or low alkaline phosphatase despite a GPI-anchor biosynthesis defect.

discussions:
- discussion_id: gap_mabry_episignature_omics
  prompt: >-
    Does HPMRS/Mabry syndrome have a reproducible DNA-methylation episignature or a
    disease-specific human transcriptomic/proteomic/metabolomic signature that could
    serve as a diagnostic classifier or severity biomarker?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced Cell-Surface Display of GPI-Anchored Proteins
  rationale: >-
    Unlike several other intellectual-disability syndromes, no DNA-methylation
    episignature and no human omics dataset specific to HPMRS have been reported; the
    only omics data are from the Pigv341E mouse. Neither serum ALP nor flow-cytometry
    GPI-anchored-protein levels correlate with phenotypic severity, so there is
    currently no validated molecular severity biomarker. Filling this gap would
    improve diagnosis of ALP-normal cases and enable objective outcome measures.
  proposed_experiments:
  - experiment_id: exp_mabry_episignature
    name: Genome-wide methylation and multi-omics profiling of HPMRS patient cohorts
    description: >-
      Perform EPIC-array DNA methylation profiling plus RNA-seq on blood and
      fibroblasts across HPMRS genes to test for a reproducible episignature and
      genotype/severity-correlated expression signatures.
- discussion_id: hmm_mabry_pigv341e_mouse
  prompt: >-
    How faithfully does the Pigv341E knock-in mouse model the human HPMRS phenotype,
    given that it inverts the social phenotype and leaves the defining biomarker
    unmeasured?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Neuronal GPI-Anchored-Protein-Dependent Synaptic Function
  rationale: >-
    The Pigv341E mouse faithfully recapitulates the neurologic core (motor deficits,
    seizure susceptibility, memory impairment, hippocampal synaptopathy), but shows
    ENHANCED rather than reduced sociability - opposite in valence to the human
    phenotype - and did not quantify alkaline phosphatase, so it does not validate
    the defining hyperphosphatasia biomarker. Facial dysmorphism, brachytelephalangy,
    Hirschsprung disease, and progressive cerebral/cerebellar atrophy are also not
    reproduced. Translational validity of the social-behavior and biomarker domains
    is therefore the open question.
  proposed_experiments:
  - experiment_id: exp_mabry_mouse_alp
    name: Serum ALP and cross-species behavioral validation in GPI-anchor-deficient mice
    description: >-
      Quantify serum tissue-nonspecific alkaline phosphatase and re-assess social
      behavior with standardized assays across Pigv341E and additional HPMRS-gene
      mouse lines to test whether the biomarker and social-domain mismatches are
      model-specific.
  evidence:
  - reference: PMID:33402532
    reference_title: "A CRISPR-Cas9-engineered mouse model for GPI-anchor deficiency mirrors human phenotypes and exhibits hippocampal synaptic dysfunctions."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A CRISPR-Cas9-engineered mouse model for GPI-anchor deficiency mirrors human"
    explanation: The knock-in mouse mirrors human neurologic phenotypes but diverges on sociability and the ALP biomarker.

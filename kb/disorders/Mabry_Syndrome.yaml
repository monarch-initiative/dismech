pathophysiology:
- name: Hypomorphic GPI-Pathway Enzyme Deficiency
  description: >-
    Biallelic hypomorphic variants reduce the abundance or activity of a GPI-anchor
    biosynthesis enzyme (PIGV, PIGO, PIGW, or PIGY) in the endoplasmic reticulum
    membrane. The A341E founder change, for example, drastically decreases PIGV
    protein expression rather than abolishing the catalytic site, leaving partial
    pathway function intact.
  biological_processes:
  - preferred_term: GPI anchor biosynthetic process
    term:
      id: GO:0006506
      label: GPI anchor biosynthetic process
    modifier: DECREASED
  molecular_functions:
  - preferred_term: GPI mannosyltransferase activity
    term:
      id: GO:0004376
      label: GPI mannosyltransferase activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: endoplasmic reticulum membrane
    term:
      id: GO:0005789
      label: endoplasmic reticulum membrane
  downstream:
  - target: Accumulation of Incomplete Mannosylated GPI Intermediates
  evidence:
  - reference: PMID:22228761
    reference_title: "Mechanism for release of alkaline phosphatase caused by glycosylphosphatidylinositol deficiency in patients with hyperphosphatasia mental retardation syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutations found in four families caused amino acid substitutions A341E, A341V, Q256K, and H385P, which drastically decreased expression of the PIGV protein."
    explanation: Demonstrates the hypomorphic (reduced-abundance) nature of HPMRS-causing PIGV variants.
- name: Accumulation of Incomplete Mannosylated GPI Intermediates
  description: >-
    With a biosynthetic enzyme partially deficient, GPI assembly stalls mid-pathway
    and mannose-bearing incomplete GPI intermediates accumulate in the ER. This
    mannose-bearing (rather than mannose-free) stall is the decisive branch point
    that determines whether hyperphosphatasia follows.
  cellular_components:
  - preferred_term: endoplasmic reticulum membrane
    term:
      id: GO:0005789
      label: endoplasmic reticulum membrane
  downstream:
  - target: Transamidase-Mediated Release of Soluble Alkaline Phosphatase
  - target: Reduced Cell-Surface Display of GPI-Anchored Proteins
- name: Impaired Golgi GPI-Anchor Fatty-Acid Remodeling
  description: >-
    In the remodeling-arm subtypes (PGAP2, PGAP3), ER GPI assembly completes but
    Golgi fatty-acid remodeling of the attached anchor fails. The unremodeled
    lyso-GPI anchor cannot stably partition into membrane lipid rafts and becomes a
    substrate for phospholipases that release the attached protein. This arm
    converges on the same downstream nodes as the biosynthesis arm.
  cellular_components:
  - preferred_term: Golgi membrane
    term:
      id: GO:0000139
      label: Golgi membrane
  downstream:
  - target: Transamidase-Mediated Release of Soluble Alkaline Phosphatase
  - target: Reduced Cell-Surface Display of GPI-Anchored Proteins
  evidence:
  - reference: PMID:23561847
    reference_title: "PGAP2 mutations, affecting the GPI-anchor-synthesis pathway, cause hyperphosphatasia with mental retardation syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PGAP2 is involved in fatty-acid GPI-anchor remodeling, which occurs in the Golgi apparatus"
    explanation: Cell-biology characterization (from a human genetics report) defining the Golgi remodeling arm as a distinct upstream route to the shared downstream defect.
- name: Transamidase-Mediated Release of Soluble Alkaline Phosphatase
  description: >-
    The GPI transamidase recognizes the truncated mannose-bearing intermediate,
    cleaves the C-terminal signal peptide from tissue-nonspecific alkaline
    phosphatase anyway, and liberates the enzyme as a soluble, unanchored protein
    into the serum. This is the direct molecular cause of the hyperphosphatasia
    biomarker, and it explains why mannose-free GPI defects (e.g. PIGM) show no
    hyperphosphatasia.
  molecular_functions:
  - preferred_term: GPI-anchor transamidase activity
    term:
      id: GO:0003923
      label: GPI-anchor transamidase activity
  - preferred_term: alkaline phosphatase activity
    term:
      id: GO:0004035
      label: alkaline phosphatase activity
  downstream:
  - target: Circulating Pyridoxal-5-Phosphate Depletion
  evidence:
  - reference: PMID:22228761
    reference_title: "Mechanism for release of alkaline phosphatase caused by glycosylphosphatidylinositol deficiency in patients with hyperphosphatasia mental retardation syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Hyperphosphatasia resulted from secretion of ALP, a GPI-anchored protein normally expressed on the cell surface, into serum due to PIGV deficiency."
    explanation: Directly demonstrates the transamidase-dependent soluble-ALP-release mechanism.
  - reference: PMID:22228761
    reference_title: "Mechanism for release of alkaline phosphatase caused by glycosylphosphatidylinositol deficiency in patients with hyperphosphatasia mental retardation syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast, a previously reported PIGM deficiency, in which there is a defect in the transfer of the first mannose, does not result in hyperphosphatasia."
    explanation: The mannose-dependent branch condition distinguishing HPMRS from GPI defects without hyperphosphatasia.
- name: Reduced Cell-Surface Display of GPI-Anchored Proteins
  description: >-
    The failed anchor also leaves a broad guild of GPI-anchored surface proteins
    (CD55, CD59, contactins, NCAM-120, ephrin-A ligands, glypicans) reduced on the
    cell surface of patient granulocytes and fibroblasts. This surface deficiency,
    rather than the ALP release, is the arm that actually causes the disease.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  downstream:
  - target: Impaired Neuronal GPI-Anchored-Protein-Dependent Synaptic Function
- name: Impaired Neuronal GPI-Anchored-Protein-Dependent Synaptic Function
  description: >-
    Many GPI-anchored proteins are axon-guidance and synapse-organizing molecules,
    so their surface loss impairs neuronal connectivity and synaptic transmission.
    The Pigv341E mouse shows decreased hippocampal synaptic transmission underlying
    impaired memory formation.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  biological_processes:
  - preferred_term: chemical synaptic transmission
    term:
      id: GO:0007268
      label: chemical synaptic transmission
    modifier: DECREASED
  cellular_components:
  - preferred_term: synapse
    term:
      id: GO:0045202
      label: synapse
  downstream:
  - target: Abnormal Brain Development and Progressive Neurodegeneration
  evidence:
  - reference: PMID:33402532
    reference_title: "A CRISPR-Cas9-engineered mouse model for GPI-anchor deficiency mirrors human phenotypes and exhibits hippocampal synaptic dysfunctions."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "decreased hippocampal synaptic transmission that could underlie impaired memory formation"
    explanation: Mouse knock-in of the human PIGV founder allele shows the synaptic-transmission defect.
- name: Abnormal Brain Development and Progressive Neurodegeneration
  description: >-
    Disordered GPI-AP-dependent wiring produces structural brain abnormalities
    (cerebral and cerebellar atrophy, callosal anomalies, delayed myelination).
    Serial imaging demonstrates progressive cerebral and cerebellar volume loss,
    indicating a superimposed neurodegenerative process on the neurodevelopmental
    substrate.
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  downstream:
  - target: Seizures and Developmental Epileptic Encephalopathy
- name: Circulating Pyridoxal-5-Phosphate Depletion
  description: >-
    Free (unanchored) serum alkaline phosphatase dephosphorylates and degrades
    circulating pyridoxal 5'-phosphate, the active vitamin B6 vitamer and the
    cofactor for glutamate decarboxylase. CNS pyridoxal-5-phosphate falls, GABA
    synthesis falls, and a genetically fixed enzyme-trafficking defect thereby
    creates an acquired, nutritionally correctable cofactor deficiency in the brain.
  chemical_entities:
  - preferred_term: pyridoxal 5'-phosphate
    term:
      id: CHEBI:18405
      label: pyridoxal 5'-phosphate
    modifier: DECREASED
  downstream:
  - target: Seizures and Developmental Epileptic Encephalopathy
  evidence:
  - reference: PMID:36636587
    reference_title: "Hyperphosphatasia with mental retardation syndrome 3: Cerebrospinal fluid abnormalities and correction with pyridoxine and Folinic acid."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cerebrospinal fluid (CSF) neurotransmitter analysis showed low levels of pyridoxal phosphate and 5-methyltetrahydrofolate and raised homovanillic acid"
    explanation: HPMRS3 case with documented low CSF pyridoxal-5-phosphate, directly evidencing the cofactor-depletion side branch.
- name: Seizures and Developmental Epileptic Encephalopathy
  description: >-
    Two converging inputs drive the epilepsy phenotype: the structural/synaptic
    substrate from disordered brain development, and the treatable cofactor-depletion
    substrate (low CNS pyridoxal-5-phosphate). The dual input explains why pyridoxine
    partially helps a subset while rarely achieving seizure freedom.
  biological_processes:
  - preferred_term: chemical synaptic transmission
    term:
      id: GO:0007268
      label: chemical synaptic transmission
  evidence:
  - reference: PMID:38456468
    reference_title: "The clinical and genetic spectrum of inherited glycosylphosphatidylinositol deficiency disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "seizures (83%), hypotonia (72%)"
    explanation: Seizures are a core feature in the largest inherited GPI deficiency cohort.


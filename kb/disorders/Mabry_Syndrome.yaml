name: Mabry Syndrome
creation_date: "2026-07-27T12:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Mabry syndrome
  term:
    id: MONDO:0016596
    label: hyperphosphatasia-intellectual disability syndrome
synonyms:
- hyperphosphatasia with impaired intellectual development syndrome
- hyperphosphatasia with mental retardation syndrome
- HPMRS
- GPI biosynthesis defect
description: >-
  Mabry syndrome (hyperphosphatasia with intellectual disability syndrome, HPMRS)
  is an autosomal recessive, multisystem neurodevelopmental disorder caused by
  defective biosynthesis or Golgi remodeling of the glycosylphosphatidylinositol
  (GPI) anchor, the lipid moiety that tethers more than 150 proteins to the outer
  face of the plasma membrane. The clinical hallmark is a paradoxical pairing of a
  neurodevelopmental syndrome (developmental delay, intellectual disability,
  seizures, hypotonia, facial dysmorphism, brachytelephalangy) with a bone enzyme
  abnormality on routine chemistry: persistently elevated serum tissue-nonspecific
  alkaline phosphatase (hyperphosphatasia). Six genetically distinct subtypes
  (HPMRS1-6; genes PIGV, PIGO, PGAP2, PGAP3, PIGW, PIGY) sit within the broader
  family of inherited GPI deficiencies. Every viable patient retains partial pathway
  function, because complete GPI loss is embryonic-lethal.

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: COMPLETE
  expressivity: VARIABLE
  description: >-
    All six HPMRS subtypes are inherited in an autosomal recessive manner from
    biallelic hypomorphic (partial loss-of-function) variants; recurrence risk is
    25% per pregnancy. Expressivity is highly variable both within and between the
    six genes. Complete null alleles are not compatible with life in this pathway,
    so at least one hypomorphic allele is always retained.
  evidence:
  - reference: PMID:20802478
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hyperphosphatasia mental retardation (HPMR) syndrome is an autosomal recessive form of mental retardation with distinct facial features and elevated serum alkaline phosphatase."
    explanation: Establishes the autosomal recessive inheritance and the defining triad of HPMRS.

has_subtypes:
- name: HPMRS1
  display_name: HPMRS1 (PIGV)
  description: >-
    Most common subtype; caused by biallelic PIGV variants. PIGV encodes GPI
    mannosyltransferase II, which adds the second mannose to the GPI glycan in the
    endoplasmic reticulum. The recurrent European founder allele c.1022C>A
    (p.Ala341Glu) is present in ~80% of PIGV-positive families.
  subtype_term:
    preferred_term: hyperphosphatasia with intellectual disability syndrome 1
    term:
      id: MONDO:0009398
      label: hyperphosphatasia with intellectual disability syndrome 1
  genes:
  - preferred_term: PIGV
    term:
      id: hgnc:26031
      label: PIGV
- name: HPMRS2
  display_name: HPMRS2 (PIGO)
  description: >-
    Caused by biallelic PIGO variants. PIGO is the phosphoethanolamine transferase
    that adds the ethanolamine phosphate bridge to the third mannose in the ER; the
    second-most-frequently implicated gene after PIGV.
  subtype_term:
    preferred_term: hyperphosphatasia with intellectual disability syndrome 2
    term:
      id: MONDO:0013882
      label: hyperphosphatasia with intellectual disability syndrome 2
  genes:
  - preferred_term: PIGO
    term:
      id: hgnc:23215
      label: PIGO
- name: HPMRS3
  display_name: HPMRS3 (PGAP2)
  description: >-
    Caused by biallelic PGAP2 variants. PGAP2 performs Golgi fatty-acid remodeling
    (stearate reacylation) of the GPI anchor; the 1970 index Mabry family carries a
    PGAP2 variant. HPMRS3 appears the most pyridoxine-responsive subtype.
  subtype_term:
    preferred_term: hyperphosphatasia with intellectual disability syndrome 3
    term:
      id: MONDO:0013628
      label: hyperphosphatasia with intellectual disability syndrome 3
  genes:
  - preferred_term: PGAP2
    term:
      id: hgnc:17893
      label: PGAP2
- name: HPMRS4
  display_name: HPMRS4 (PGAP3)
  description: >-
    Caused by biallelic PGAP3 variants. PGAP3 is the GPI-anchor maturation
    deacylase in the Golgi; pathogenic noncoding (intronic/3'UTR) variants are
    documented and are missed by panel-based testing.
  subtype_term:
    preferred_term: hyperphosphatasia with intellectual disability syndrome 4
    term:
      id: MONDO:0014318
      label: hyperphosphatasia with intellectual disability syndrome 4
  genes:
  - preferred_term: PGAP3
    term:
      id: hgnc:23719
      label: PGAP3
- name: HPMRS5
  display_name: HPMRS5 (PIGW)
  description: >-
    Caused by biallelic PIGW variants. PIGW is the inositol acyltransferase acting
    early in ER GPI assembly; reported presentations include West syndrome with
    hypsarrhythmia.
  subtype_term:
    preferred_term: hyperphosphatasia with intellectual disability syndrome 5
    term:
      id: MONDO:0014457
      label: hyperphosphatasia with intellectual disability syndrome 5
  genes:
  - preferred_term: PIGW
    term:
      id: hgnc:23213
      label: PIGW
- name: HPMRS6
  display_name: HPMRS6 (PIGY)
  description: >-
    Caused by biallelic PIGY variants. PIGY is a subunit of the GPI-GlcNAc
    transferase complex; severity tracks residual expression, ranging from lethal
    multisystem disease to moderate developmental delay with microcephaly.
  subtype_term:
    preferred_term: hyperphosphatasia with intellectual disability syndrome 6
    term:
      id: MONDO:0014780
      label: hyperphosphatasia with intellectual disability syndrome 6
  genes:
  - preferred_term: PIGY
    term:
      id: hgnc:28213
      label: PIGY


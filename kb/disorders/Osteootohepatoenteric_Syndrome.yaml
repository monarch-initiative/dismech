inheritance:
- name: Autosomal Recessive
  description: >-
    Biallelic UNC45A variants, homozygous or compound heterozygous, confirmed by
    trio exome sequencing with parental segregation in the original families.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:29429573
    reference_title: "Loss-of-Function Mutations in UNC45A Cause a Syndrome Associating Cholestasis, Diarrhea, Impaired Hearing, and Bone Fragility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing of all affected individuals and their parents identified biallelic mutations in Unc-45 Myosin Chaperone A (UNC45A) as a likely driver for this disorder."
    explanation: "Trio sequencing with biallelic variants in affected individuals, which is the basis for the recessive assignment."
pathophysiology:
- name: Biallelic UNC45A Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Two mechanistic classes of allele converge on the same endpoint. Nonsense and
    frameshift alleles abolish the protein outright. Missense alleles are subtler
    and more informative: several are expressed at normal levels in transfected
    cells yet still fail to rescue, and for the p.Val423Asp allele the defect was
    shown to be protein instability rather than loss of a specific function.
    Thr230 and Leu237 both map to the third armadillo repeat of the central
    domain, the segment that connects the Hsp90-binding and myosin-binding ends.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:29429573
    reference_title: "Loss-of-Function Mutations in UNC45A Cause a Syndrome Associating Cholestasis, Diarrhea, Impaired Hearing, and Bone Fragility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "loss-of-function paradigm, wherein mutations attenuated or abolished protein activity with concomitant defects in gut development and function."
    explanation: "States the functional-impact category assigned to this node, from the paper that established the gene-disease relationship."
  - reference: PMID:35421597
    reference_title: "A Functional Relationship Between UNC45A and MYO5B Connects Two Rare Diseases With Shared Enteropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Protein instability rather than functional impairment underlies the pathogenicity of the O2HE syndrome-associated UNC45A-p.V423D mutation."
    explanation: >-
      Distinguishes the mechanism of one missense allele. Worth recording because
      it means the allele is not a separation-of-function reagent, and it is the
      only allele whose mechanism has been resolved this precisely.
  downstream:
  - target: Loss of UNC45A Myosin Co-Chaperone Function
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35575086
      reference_title: "UNC45A deficiency causes microvillus inclusion disease-like phenotype by impairing myosin VB-dependent apical trafficking."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In keeping with impaired myosin VB function, UNC45AKO Caco-2 cells showed abnormal epithelial morphogenesis that was restored by full-length UNC45A, but not by mutant alleles."
      explanation: >-
        Rescue by wild-type and failure of rescue by the patient alleles is what
        licenses treating the variants as acting through loss of the chaperone
        function rather than through some neomorphic effect.
- name: Loss of UNC45A Myosin Co-Chaperone Function
  biological_scale: MOLECULAR
  description: >-
    UNC45A is a UCS-family myosin co-chaperone with a three-domain architecture:
    the C-terminal UCS domain binds the myosin motor domain, the N-terminal
    tetratricopeptide-repeat domain binds Hsp90, and a central domain connects
    them. Vertebrates carry two non-redundant isoforms; UNC45B is confined to
    striated muscle and causes myopathy, while UNC45A is ubiquitous. That
    division is why this disease is not a myopathy.
  molecular_functions:
  - preferred_term: myosin co-chaperone activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0044183
      label: protein folding chaperone
  evidence:
  - reference: PMID:35575086
    reference_title: "UNC45A deficiency causes microvillus inclusion disease-like phenotype by impairing myosin VB-dependent apical trafficking."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "All UNC45 proteins share the same 3-domain organization, with a C-terminal UCS domain, which binds the motor domain of myosin, a less-conserved central domain of unknown function and an N-terminal tetratricopeptide repeat (TPR) domain that binds to Hsp90."
    explanation: >-
      Describes the molecular architecture this node loses. Background prose in
      the paper's introduction rather than its own result, hence OTHER.
  - reference: PMID:35421597
    reference_title: "A Functional Relationship Between UNC45A and MYO5B Connects Two Rare Diseases With Shared Enteropathy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "UNC45A is a myosin (co-)chaperone, and mutations in the UNC45A gene were recently identified in osteo-oto-hepato-enteric (O2HE) syndrome patients presenting with congenital diarrhea and intrahepatic cholestasis."
    explanation: >-
      States the protein's function and ties it to this disease. The paper is
      an in vitro study, but this particular sentence is its opening background
      statement rather than one of its results, so it is graded OTHER for the
      same reason as the architecture quote above it. It had been graded
      IN_VITRO from the paper's overall design, which is the wrong unit: the
      grading belongs to the passage.
  downstream:
  - target: Bile Salt Export Pump Mislocalization
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Which myosin client carries the hepatic defect is not established; the
      observation is that the chaperone and the transporter are both reduced in
      the same biopsy.
    evidence:
    - reference: PMID:41861679
      reference_title: "Odevixibat treatment for recurrent cholestasis in a patient with biallelic UNC45A variants causing osteo-oto-hepato-enteric syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Immunofluorescence microscopy of the liver specimen archived at age 10 showed reduced expression of the UNC45A protein and reduced expression and aberrant localization of the bile salt export pump (BSEP) in hepatocytes"
      explanation: >-
        Co-observation of reduced chaperone and mislocalized transporter in one
        specimen. The intervening client is unknown, hence the indirect link type.
  - target: Myosin VB Misfolding and Depletion
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35575086
      reference_title: "UNC45A deficiency causes microvillus inclusion disease-like phenotype by impairing myosin VB-dependent apical trafficking."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Myosin VB was identified by mass spectrometry as client of the UNC45A chaperone and was found misfolded in UNC45AKO Caco-2 cells."
      explanation: >-
        Client identification plus the misfolding phenotype in the knockout, which
        is the chaperone-to-client step this edge asserts.
- name: Myosin VB Misfolding and Depletion
  biological_scale: MOLECULAR
  description: >-
    Myosin VB is the recycling-endosome motor. Without its co-chaperone it
    misfolds and its protein level falls, in hepatic as well as intestinal cells.
    This is the node that connects osteootohepatoenteric syndrome to microvillus
    inclusion disease, whose cause is loss of myosin VB itself.
  molecular_functions:
  - preferred_term: myosin VB motor function
    modifier: DECREASED
    term:
      id: GO:0017022
      label: myosin binding
  evidence:
  - reference: PMID:35421597
    reference_title: "A Functional Relationship Between UNC45A and MYO5B Connects Two Rare Diseases With Shared Enteropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "UNC45A depletion in intestinal and hepatic cells reduced myosin Vb protein expression, and in intestinal epithelial cells, it affected 2 myosin Vb-dependent processes that underlie MVID pathogenesis: rat sarcoma-associated binding protein (RAB)11A-positve recycling endosome positioning and microvilli development."
    explanation: >-
      Both the depletion itself and the two downstream processes it disturbs. Note
      the depletion is also shown in hepatic cells, which is the only molecular
      thread to the liver phenotype.
  downstream:
  - target: Apical Trafficking and Recycling Endosome Failure
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35421597
      reference_title: "A Functional Relationship Between UNC45A and MYO5B Connects Two Rare Diseases With Shared Enteropathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "A functional relationship exists between UNC45A and myosin Vb, thereby connecting 2 rare congenital diseases with overlapping enteropathy at the molecular level."
      explanation: "The authors' own summary of the link this edge draws."
- name: Altered Chaperone-Myosin Complex Dissociation
  biological_scale: MOLECULAR
  description: >-
    The mechanism of the recurrent p.Leu237Pro allele, and the reason this entry
    does not treat every variant as a null. The mutant protein still chaperones:
    it prevents myosin aggregation and supports normal nonmuscle myosin II
    filament formation. What it cannot do is let go. It forms atypically stable
    oligomers that hold the chaperone-myosin complex together, and the trapped
    myosin is therefore unavailable, so the cellular consequence converges on the
    same trafficking failure as outright deficiency.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: NEOMORPHIC
  molecular_functions:
  - preferred_term: nonmuscle myosin II function
    modifier: DECREASED
    term:
      id: GO:0017022
      label: myosin binding
  evidence:
  - reference: PMID:40125554
    reference_title: "Altered chaperone-nonmuscle myosin II interactions drive pathogenicity of the UNC45A c.710T>C variant in osteo-oto-hepato-enteric syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The UNC45A p.Leu237Pro mutant retained chaperone activity, prevented myosin aggregation, and supported proper nonmuscle myosin II (NMII) filament formation in patient fibroblasts and human osteosarcoma (U2OS) cells."
    explanation: >-
      Establishes that this allele is not a loss of chaperone activity, which is
      what rules out folding it into the loss-of-function node.
  - reference: PMID:40125554
    reference_title: "Altered chaperone-nonmuscle myosin II interactions drive pathogenicity of the UNC45A c.710T>C variant in osteo-oto-hepato-enteric syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, the mutant formed atypically stable oligomers and prevented chaperone-myosin complex dissociation, thereby inhibiting NMII functions."
    explanation: "The positive mechanism: failure to release the client rather than failure to fold it."
  downstream:
  - target: Apical Trafficking and Recycling Endosome Failure
    causal_link_type: DIRECT
    description: >-
      Despite the different molecular route, the cellular endpoint is the same as
      in outright deficiency.
    evidence:
    - reference: PMID:40125554
      reference_title: "Altered chaperone-nonmuscle myosin II interactions drive pathogenicity of the UNC45A c.710T>C variant in osteo-oto-hepato-enteric syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Similar to biallelic UNC45A deficiency, this resulted in impaired intracellular trafficking, defective recycling, and abnormal retention of transferrin at various endocytic sites."
      explanation: "States the convergence on the trafficking phenotype, which is exactly what this edge asserts."
- name: Bile Salt Export Pump Mislocalization
  biological_scale: CELLULAR
  conforms_to: "cholestatic_liver_injury#Impaired Bile Formation and Secretion"
  description: >-
    The hepatic arm, and the newest part of this mechanism. A patient liver biopsy
    shows reduced UNC45A protein together with reduced expression and aberrant
    localization of the bile salt export pump in hepatocytes. BSEP is the
    canalicular exporter, so mislocalizing it is a failure of bile formation at
    its first step - which matches the low-GGT biochemical picture these patients
    have.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: canalicular bile acid transport
    modifier: DECREASED
    term:
      id: GO:0015722
      label: canalicular bile acid transport
  evidence:
  - reference: PMID:41861679
    reference_title: "Odevixibat treatment for recurrent cholestasis in a patient with biallelic UNC45A variants causing osteo-oto-hepato-enteric syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunofluorescence microscopy of the liver specimen archived at age 10 showed reduced expression of the UNC45A protein and reduced expression and aberrant localization of the bile salt export pump (BSEP) in hepatocytes"
    explanation: >-
      Both halves of the claim in one patient specimen: the chaperone is reduced
      and the transporter it should be helping to place is mislocalized. A single
      biopsy, which is why this node is not stated more strongly.
  downstream:
  - target: Intrahepatic cholestasis
    causal_link_type: DIRECT
- name: Apical Trafficking and Recycling Endosome Failure
  biological_scale: CELLULAR
  conforms_to: "enterocyte_polarity_trafficking_failure#Loss of Apical Delivery Machinery"
  description: >-
    RAB11A-positive recycling endosomes are mispositioned and apical transporters
    do not reach the membrane. The enterocyte can no longer build or hold a
    polarized absorptive surface. This is the module's trafficking arm entered one
    step upstream of its canonical MYO5B lesion: here the motor is present but
    unfolded rather than absent.
  cell_types:
  - preferred_term: enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  cellular_components:
  - preferred_term: recycling endosome
    term:
      id: GO:0055037
      label: recycling endosome
  biological_processes:
  - preferred_term: apical protein localization
    modifier: DECREASED
    term:
      id: GO:0045176
      label: apical protein localization
  evidence:
  - reference: PMID:35575086
    reference_title: "UNC45A deficiency causes microvillus inclusion disease-like phenotype by impairing myosin VB-dependent apical trafficking."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Patients and UNC45AKO 3D organoids displayed altered luminal development and microvillus inclusions, while 2D cultures revealed Rab11 and apical transporter mislocalization as well as sparse and disorganized microvilli."
    explanation: >-
      The trafficking failure shown in patient-derived organoids as well as in the
      engineered knockout, which is what makes it a patient phenotype and not only
      a cell-line one.
  downstream:
  - target: Microvillus Inclusion Formation and Brush Border Loss
    causal_link_type: DIRECT
- name: Microvillus Inclusion Formation and Brush Border Loss
  biological_scale: TISSUE
  description: >-
    Microvilli are internalized into intracellular inclusions instead of being
    presented apically, and the surviving brush border is sparse and disorganized.
    Duodenal biopsies show villus atrophy without inflammation, which is the
    finding that separates this from an immune enteropathy at the bench as well as
    at the bedside. The same picture is present in zebrafish enterocytes, so it is
    not an artefact of any one system.
  cell_types:
  - preferred_term: enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  cellular_components:
  - preferred_term: microvillus
    term:
      id: GO:0005902
      label: microvillus
  evidence:
  - reference: PMID:35575086
    reference_title: "UNC45A deficiency causes microvillus inclusion disease-like phenotype by impairing myosin VB-dependent apical trafficking."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They all showed villus atrophy with no inflammation"
    explanation: >-
      Patient duodenal biopsy histology. The absence of inflammation is the point:
      it excludes the immune enteropathies that otherwise present the same way.
  - reference: PMID:35575086
    reference_title: "UNC45A deficiency causes microvillus inclusion disease-like phenotype by impairing myosin VB-dependent apical trafficking."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Finally, microvillus inclusions and shortened microvilli were evidenced in enterocytes from unc45a-deficient zebrafish."
    explanation: >-
      Cross-species confirmation of the same subcellular lesion. Graded
      MODEL_ORGANISM because the observation quoted is the zebrafish one, even
      though the paper also reports human biopsies elsewhere.
  downstream:
  - target: Chronic diarrhea
    causal_link_type: DIRECT

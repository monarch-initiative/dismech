      id: hgnc:30594
      label: UNC45A
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic variants; 23 exons encoding a 944-residue protein with TPR, armadillo,
    neck and UCS domains. Reported alleles include p.Arg241Ter and p.Asp484GlufsTer31
    (no detectable protein), the missense alleles p.Thr230Arg, p.Leu237Pro, p.Glu728Lys
    and p.Ala838Pro (protein expressed at wild-type levels but non-functional in
    rescue), p.Val423Asp (destabilized), and the compound heterozygous p.Arg819Ter
    with p.Leu237Pro in a Chinese neonate. Variants in genes previously associated
    with microvillus inclusion disease - MYO5B, STX3, STXBP2 - were excluded in the
    patients, which is what makes UNC45A a distinct cause rather than a modifier.
    Two further points matter for interpreting a new variant. p.Leu237Pro is not a
    null: it retains chaperone activity and fails by trapping its client, so it is
    modelled as a separate NEOMORPHIC pathophysiology node rather than folded into
    the loss-of-function one. And UNC45A is allelic to a second disease - a 5'-UTR
    variant causes Aagenaes syndrome (lymphoedema cholestasis syndrome 1), which
    shares the neonatal cholestasis but adds lymphoedema and is not this entity.
  evidence:
  - reference: PMID:29429573
    reference_title: "Loss-of-Function Mutations in UNC45A Cause a Syndrome Associating Cholestasis, Diarrhea, Impaired Hearing, and Bone Fragility."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing of all affected individuals and their parents identified biallelic mutations in Unc-45 Myosin Chaperone A (UNC45A) as a likely driver for this disorder."
    explanation: "The gene-disease assignment."
  - reference: PMID:36587802
    reference_title: "UNC45A-related osteo-oto-hepato-enteric syndrome in a Chinese neonate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The gene detection results showed that the UNC45A gene of the newborn examined in the present study harbored the compound heterozygous variants p.Arg819Ter, and p.Leu237Pro; this was confirmed via Sanger sequencing."
    explanation: "An independent case with a recurrent missense allele in trans with a nonsense allele."
  - reference: PMID:40125554
    reference_title: "Altered chaperone-nonmuscle myosin II interactions drive pathogenicity of the UNC45A c.710T>C variant in osteo-oto-hepato-enteric syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In addition to facilitating various NMII-associated processes, UNC45A promotes the folding of myosin IB (MYO1B) and MYO5B, supporting their functions in vesicle trafficking"
    explanation: >-
      Names the client repertoire. Relevant to this record because it is why a
      single gene produces a four-organ phenotype, and why MYO5B is one client
      among several rather than the whole story.
  - reference: PMID:39887522
    reference_title: "A New Unc45a 5'utr Variant In Patients With Aagenaes Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The genetic basis for this syndrome was recently linked to a variant in the 5'-untranslated region (5'-UTR) of the UNC45A gene, located on chromosome 15q."
    explanation: >-
      Supports the allelic-disorder statement in the notes: a different class of
      UNC45A variant produces Aagenaes syndrome, not this disease.
  - reference: PMID:36699472
    reference_title: "Case report: Osteo-oto-hepato-enteric syndrome caused by UNC45A deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "no obvious genotype and phonotype correlations were observed"
    explanation: >-
      The negative result on allele class. Quoted with the source's own
      misspelling of "phenotype", which a snippet does not correct. Fifteen
      variants across eleven patients and no correlation - which is why this
      entry separates the alleles by mechanism in the notes rather than by
      expected severity.
- name: MYO5B
  gene_term:
    preferred_term: MYO5B
    term:
      id: hgnc:7603
      label: MYO5B
  association: Mechanistic client, not a modifier of this disease
  relationship_type: COOPERATING
  notes: >-
    MYO5B is recorded here because it is the UNC45A client whose depletion carries
    the enteropathy, not because MYO5B variants modify this disease. No MYO5B
    variant has been reported in a patient with osteootohepatoenteric syndrome; the
    original series explicitly excluded MYO5B, STX3 and STXBP2 before landing on
    UNC45A. Biallelic MYO5B loss causes microvillus inclusion disease, which is the
    separate disease this one converges on mechanistically.
  evidence:
  - reference: PMID:35575086
    reference_title: "UNC45A deficiency causes microvillus inclusion disease-like phenotype by impairing myosin VB-dependent apical trafficking."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Myosin VB was identified by mass spectrometry as client of the UNC45A chaperone and was found misfolded in UNC45AKO Caco-2 cells."
    explanation: >-
      Establishes the client relationship. This is the only sense in which MYO5B
      belongs in this entry, and the notes say so explicitly so the record is not
      read as a second disease gene.
treatments:
- name: Parenteral nutrition
  description: >-
    The enteropathy is feeding-independent, so the absorptive deficit is bypassed
    rather than corrected. This is supportive management of intestinal failure and
    is inferred from the disease class rather than reported as an outcome in these
    patients.
  treatment_term:
    preferred_term: total parenteral nutrition
    term:
      id: NCIT:C29484
      label: Total Parenteral Nutrition
  target_mechanisms:
  - target: Microvillus Inclusion Formation and Brush Border Loss
    description: Bypasses the lost absorptive surface; it does not restore it.
  evidence:
  - reference: PMID:36699472
    reference_title: "Case report: Osteo-oto-hepato-enteric syndrome caused by UNC45A deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Parenteral nutrition and enteral nutrition were required to treat severe diarrhea."
    explanation: >-
      A statement of what the reported patients actually received, across the
      published cohort rather than in one family.
  notes: >-
    An earlier revision of this entry said no cited paper stated a nutritional
    management recommendation in a quotable form, and rested the treatment on
    the mechanism instead. That was true only because the review that states it
    had not been cited. What the quote establishes is still narrow: that
    parenteral and enteral nutrition were required, not that either was
    evaluated against an alternative. No treatment study exists for this
    disease, and the dependence is reported as a feature of the course - most
    of the cohort table's entries read "need TPN" - rather than as an outcome.
- name: Odevixibat
  description: >-
    An ileal bile acid transporter inhibitor, used off-label here for the
    cholestatic pruritus. It is a rational target given the mechanism in this
    entry - if canalicular export is failing, interrupting the enterohepatic
    circulation lowers the bile acid load rather than trying to fix the pump - but
    the evidence is one adult patient reported as a letter, and the same letter
    says plainly that no cure or effective treatment exists for this disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: odevixibat
      term:
        id: CHEBI:757063
        label: odevixibat
  target_mechanisms:
  - target: Bile Salt Export Pump Mislocalization
    description: >-
      Does not correct the mislocalization. It reduces the bile acid pool
      presented to the failing canalicular step by blocking ileal reuptake.
  target_phenotypes:
  - preferred_term: Intrahepatic cholestasis
    term:
      id: HP:0001406
      label: Intrahepatic cholestasis
  evidence:
  - reference: PMID:41861679
    reference_title: "Odevixibat treatment for recurrent cholestasis in a patient with biallelic UNC45A variants causing osteo-oto-hepato-enteric syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we wish to report a case of osteo-oto-hepatic-enteric syndrome (O2HE), successfully treated with odevixibat."
    explanation: >-
      The single reported treatment response. Note the paper spells the syndrome
      "osteo-oto-hepatic-enteric"; the quote preserves the source's spelling.
  - reference: PMID:41861679
    reference_title: "Odevixibat treatment for recurrent cholestasis in a patient with biallelic UNC45A variants causing osteo-oto-hepato-enteric syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no cure or effective treatment, and the pathogenic mechanisms are not known."
    explanation: >-
      Quoted deliberately alongside the response above. The same authors who
      report the success state the general position, and an entry that recorded
      only the first sentence would overstate the evidence.
- name: Ursodeoxycholic acid
  description: >-
    A bile acid used as first-line supportive therapy for intrahepatic
    cholestasis generally, and the therapy the one reported patient who
    recovered was on. It does not address the mislocalized export pump; it
    shifts the composition of the circulating bile acid pool towards a less
    cytotoxic species, so the hepatocyte tolerates the retained load better.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ursodeoxycholic acid
      term:
        id: CHEBI:9907
        label: ursodeoxycholic acid
  target_phenotypes:
  - preferred_term: Intrahepatic cholestasis
    term:
      id: HP:0001406
      label: Intrahepatic cholestasis
  evidence:
  - reference: PMID:36699472
    reference_title: "Case report: Osteo-oto-hepato-enteric syndrome caused by UNC45A deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient was managed with ursodeoxycholic acid (UDCA)-based treatments, and the clinical symptoms and abnormal liver functions were significantly relieved."
    explanation: >-
      The only reported response. Note what the sentence does not say: the
      patient also received fat-soluble vitamins, compound glycyrrhizin and
      ademetionine, so "UDCA-based" is the authors' own hedge and no source
      here separates the contribution of one agent from the others.
  notes: >-
    Deliberately not given a target_mechanisms link. Every mechanism node in
    this entry is a trafficking or folding defect, and ursodeoxycholic acid
    acts on none of them - it changes the bile acid pool the failing canalicular
    step has to handle. Attaching it to Bile Salt Export Pump Mislocalization
    would assert a mechanism of action the evidence does not carry, so the
    treatment is linked to the phenotype it relieves instead.

name: Osteootohepatoenteric Syndrome
creation_date: "2026-09-11T12:50:00Z"
category: Mendelian
synonyms:
- O2HE syndrome
- osteo-oto-hepato-enteric syndrome
- UNC45A deficiency
- cholestasis, diarrhea, impaired hearing and bone fragility syndrome
description: >-
  Osteootohepatoenteric syndrome is a recessive disorder of a myosin
  co-chaperone. UNC45A belongs to the UCS family: a C-terminal UCS domain grips
  the myosin motor domain, an N-terminal tetratricopeptide-repeat domain binds
  Hsp90, and together they fold myosins that would otherwise aggregate. Losing
  it produces the four-organ combination the name records - bone fragility,
  sensorineural hearing loss, cholestatic liver disease and congenital diarrhoea.

  What makes the entry worth curating as a mechanism rather than a phenotype
  list is that the enteropathy has a named client protein. Mass spectrometry
  identified myosin VB as a UNC45A client, and myosin VB is misfolded in
  UNC45A-null enterocyte-like cells. Myosin VB is the motor whose loss causes
  microvillus inclusion disease, so the chain from chaperone to enteropathy runs
  through a second, already-characterized disease gene: UNC45A loss reduces
  functional myosin VB, recycling endosomes are mispositioned, apical cargo is
  not delivered, and the brush border is internalized as microvillus inclusions.
  Patient organoids and patient duodenal biopsies show the microvillus-inclusion
  picture, and so do zebrafish enterocytes.

  The liver has a mechanism too, and a more recent one: a patient liver biopsy
  shows reduced UNC45A together with reduced and mislocalized bile salt export
  pump in hepatocytes, which is a canalicular export failure and explains the
  low-GGT cholestasis. Hearing and bone are curated honestly as phenotypes with
  no mechanism at all. The chaperone is ubiquitous and nonmuscle myosin II is
  also its client, so a cochlear or skeletal mechanism is easy to hypothesize and
  none has been demonstrated; this entry does not invent the chain.

  Not every allele is a simple loss of function, and the entry models that. The
  recurrent p.Leu237Pro variant retains chaperone activity and folds nonmuscle
  myosin II correctly, but forms atypically stable oligomers that will not let go
  of the folded myosin - so it fails by holding on rather than by not working.
  It is curated as a separate node with functional_impact_category NEOMORPHIC,
  because collapsing it into the loss-of-function node would make the entry state
  something the 2025 analysis explicitly contradicts.

  One pathophysiology node declares conforms_to against
  kb/modules/enterocyte_polarity_trafficking_failure, entering through the
  trafficking arm (`#Loss of Apical Delivery Machinery`) and not the adhesion
  arm, as that module's description requires. This disease is a step upstream of
  the module's canonical MYO5B lesion rather than a variant of it.

  Only about a dozen patients have been reported, so every claim here is small-n
  and much of the mechanism is cell-line and zebrafish work rather than human.

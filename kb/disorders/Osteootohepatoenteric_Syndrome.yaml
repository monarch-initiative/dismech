diagnosis:
- name: Duodenal biopsy with electron microscopy
  description: >-
    Villus atrophy without inflammation on light microscopy, and microvillus
    inclusions with subapical vesicle accumulation on electron microscopy. The
    finding is indistinguishable from microvillus inclusion disease, which is the
    diagnostic trap: the histology names the mechanism, not the gene.
  diagnosis_term:
    preferred_term: duodenal biopsy
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  evidence:
  - reference: PMID:35575086
    reference_title: "UNC45A deficiency causes microvillus inclusion disease-like phenotype by impairing myosin VB-dependent apical trafficking."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They all showed villus atrophy with no inflammation"
    explanation: "The light-microscopy finding this biopsy detects."
- name: Molecular testing of UNC45A
  description: >-
    Sequencing is what distinguishes this from microvillus inclusion disease,
    since the histology does not. Testing should follow exclusion of MYO5B, STX3
    and STXBP2, which is the order the original series worked in.
  diagnosis_term:
    preferred_term: UNC45A gene sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:36587802
    reference_title: "UNC45A-related osteo-oto-hepato-enteric syndrome in a Chinese neonate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The gene detection results showed that the UNC45A gene of the newborn examined in the present study harbored the compound heterozygous variants p.Arg819Ter, and p.Leu237Pro; this was confirmed via Sanger sequencing."
    explanation: "Trio exome followed by Sanger confirmation, which is the diagnostic route in practice."
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Roughly a dozen patients. Four in three families in the 2018 gene-discovery
    paper, six in five families in the 2022 mechanistic study, and single
    subsequent case reports, with twelve patients counted in the literature as of
    2025. No prevalence or incidence estimate exists and none is attempted here.
  evidence:
  - reference: PMID:36587802
    reference_title: "UNC45A-related osteo-oto-hepato-enteric syndrome in a Chinese neonate."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, to date, only 10 patients with this syndrome have been reported in 2 studies; therefore, there is still a lack of analysis regarding the correlation between disease phenotype and genotype."
    explanation: >-
      A published count as of 2023, and the authors' own statement that the series
      is too small for genotype-phenotype analysis.
  - reference: PMID:36699472
    reference_title: "Case report: Osteo-oto-hepato-enteric syndrome caused by UNC45A deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, a total of 10 O2HE patients from eight families with UNC45A loss-of-function mutations were described in the literature"
    explanation: >-
      The same count with the family denominator, which is the more useful
      figure for a recessive disease: ten patients from eight families means
      the reports are mostly independent rather than mostly sibships.
progression:
- phase: Infantile remission of the hepatic and intestinal features
  age_range: first year of life
  notes: >-
    Recorded because the entry otherwise reads as uniformly severe, which the
    cohort does not support. Both defining visceral features have resolved in
    reported patients: the literature table records cholestasis resolving at
    2.5 and 3 years in three of the earlier patients, and the 2022 Chinese case
    had diarrhoea and cholestasis both resolve by 6 months and was off all
    drugs and growing normally at 1 year. This is a single reported course and
    is not a prognosis; the same paper cautions that hearing loss and bone
    fragility can declare themselves years later in patients whose gut and
    liver have settled, so remission of two organs is not remission of the
    disease.
  evidence:
  - reference: PMID:36699472
    reference_title: "Case report: Osteo-oto-hepato-enteric syndrome caused by UNC45A deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, our patient only suffered with mild diarrhea (3–5 times/day) and recovered along with cholestasis relief at the age of 6 months."
    explanation: >-
      The remitting course in the mildest reported patient. Quoted verbatim,
      including the source's en dash and the non-breaking space before
      "months".
  - reference: PMID:36699472
    reference_title: "Case report: Osteo-oto-hepato-enteric syndrome caused by UNC45A deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our patient's clinical manifestations were less severe than those of the previous reported cases, which expands the clinical spectrum of O2HE."
    explanation: >-
      The authors' own framing, and the reason this is curated as a phase of
      the disease rather than as a doubt about the diagnosis.
discussions:
- discussion_id: extraintestinal_mechanism_unknown
  kind: KNOWLEDGE_GAP
  prompt: >-
    What is the mechanism of the bone, ear and liver involvement, and does any of
    it run through myosin VB?
  attaches_to:
  - pathophysiology#Loss of UNC45A Myosin Co-Chaperone Function
  - phenotypes#Pathologic fracture
  - phenotypes#Sensorineural hearing impairment
  - phenotypes#Intrahepatic cholestasis
  rationale: >-
    Two of the four organs in the syndrome name have no mechanism in this entry,
    and that is a statement about the literature rather than about the curation.
    The enteropathy is traced to myosin VB, and the liver now has an observation
    of its own - reduced UNC45A with mislocalized BSEP in a patient biopsy -
    though which myosin client carries that defect is unknown, which is why that
    edge is indirect. For hearing and bone there is nothing: UNC45A folds
    nonmuscle myosin II and myosin IB as well as myosin VB, and myosin motors are
    central to both stereocilia function and osteoblast mechanics, so both are
    reasonable starting hypotheses and neither has been tested. The entry records
    them as phenotypes without upstream edges rather than inventing the chain.
  evidence:
  - reference: PMID:36699472
    reference_title: "Case report: Osteo-oto-hepato-enteric syndrome caused by UNC45A deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "UNC45A is required for proper folding of MYO15A. MYO15A is necessary for elongation and maintenance of inner ear hair cell stereocilia"
    explanation: >-
      The most specific candidate mechanism anyone has put in print for the
      deafness, and the reason it is cited here rather than drawn as a
      pathograph edge. It appears in a case report's discussion as an inference
      from two separate literatures - that UNC45A folds MYO15A, and that MYO15A
      maintains stereocilia - and neither of the three UNC45A papers cited in
      this entry mentions MYO15A at all. evidence_source is OTHER because the
      passage is a review argument, not a result. Naming the hypothesis is what
      makes the gap testable; asserting it would make it look closed.
- discussion_id: allele_class_versus_severity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do null alleles produce a more severe phenotype than the destabilizing missense
    alleles?
  attaches_to:
  - pathophysiology#Biallelic UNC45A Loss of Function
  rationale: >-
    The reported alleles fall into distinguishable mechanistic classes - no protein,
    protein present but non-functional, and protein destabilized - and one recurrent
    missense allele (p.Leu237Pro) appears in more than one family. That is the
    setup for a genotype-phenotype correlation, and the 2023 case report says
    explicitly that the series is still too small to draw one. Whether the four
    organs are involved in a fixed combination or vary with allele class is
    therefore open.

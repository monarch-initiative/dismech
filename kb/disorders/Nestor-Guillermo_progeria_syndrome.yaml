name: Nestor-Guillermo progeria syndrome
creation_date: "2026-04-13T22:47:36Z"
description: >-
  Nestor-Guillermo progeria syndrome is a rare BANF1-related progeroid disorder
  with early onset but comparatively slow progression. Affected individuals
  show premature aging features including growth retardation, reduced
  subcutaneous fat, joint stiffness, and profound skeletal abnormalities
  without the prominent cardiovascular disease typical of some other progerias.
category: Mendelian
parents:
- hereditary disease
- premature aging syndrome
synonyms:
- NGPS
- Néstor-Guillermo progeria syndrome
- BANF1-related neurodevelopmental syndrome
disease_term:
  preferred_term: Nestor-Guillermo progeria syndrome
  term:
    id: MONDO:0013523
    label: Nestor-Guillermo progeria syndrome
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:21549337
      reference_title: "Exome sequencing and functional analysis identifies BANF1 mutation as the cause of a hereditary progeroid syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Exome sequencing and molecular analysis in two unrelated families allowed us to identify a homozygous mutation in BANF1 ... encoding barrier-to-autointegration factor 1 (BAF), as the molecular abnormality responsible for this Mendelian disorder."
      explanation: Establishes Nestor-Guillermo progeria syndrome as an autosomal recessive monogenic Mendelian disorder caused by homozygous BANF1 mutation.
  mechanistic_category:
  - classification_value: laminopathy
    evidence:
    - reference: PMID:21549337
      reference_title: "Exome sequencing and functional analysis identifies BANF1 mutation as the cause of a hereditary progeroid syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Together, these results show that the p.Ala12Thr mutation in BAF identified in patients with this progeroid syndrome causes an abnormal distribution of components of the nuclear lamina, which are likely responsible for the nuclear abnormalities observed in this laminopathy."
      explanation: Primary discovery study classifies BANF1-related NGPS as a nuclear-envelope laminopathy driven by nuclear lamina disorganization and emerin mislocalization.
inheritance:
- name: Autosomal recessive
  description: >-
    NGPS is caused by biallelic BANF1 variants, recurrently the A12T
    substitution. ClinGen records the BANF1-NGPS gene-disease relationship as
    autosomal recessive, with the classification itself still Limited given how
    few families have been reported.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: CGGV:assertion_2e2059e5-b7a5-42fe-93b7-182982608431-2024-04-03T160000.000Z
    reference_title: "BANF1 / Nestor-Guillermo progeria syndrome (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "BANF1 | HGNC:17397 | Nestor-Guillermo progeria syndrome | MONDO:0013523 | AR | Limited"
    explanation: >-
      ClinGen's gene-disease validity row records autosomal recessive inheritance
      for BANF1-related NGPS.
pathophysiology:
- name: BANF1 mutation
  biological_scale: MOLECULAR
  description: >-
    Nestor-Guillermo progeria syndrome is caused by biallelic pathogenic BANF1
    missense mutation (recurrently c.34G>A, p.Ala12Thr), altering BAF function
    at the chromatin-nuclear envelope interface.
  notes: >-
    Primary patient-fibroblast immunoblotting reported markedly reduced BAF
    protein levels suggesting impaired protein stability, whereas subsequent
    biochemical characterization of purified recombinant BANF1 p.Ala12Thr
    showed that the mutant protein is folded and stable in vitro and attributed
    the defect primarily to disruption of its DNA-binding surface (potentially
    reflecting antibody-epitope masking by the A12T substitution or context-dependent
    cellular turnover).
  gene:
    preferred_term: BANF1
    description: Barrier-to-autointegration factor 1 nuclear envelope protein.
    term:
      id: hgnc:17397
      label: BANF1
  genes:
  - preferred_term: BANF1
    term:
      id: hgnc:17397
      label: BANF1
  molecular_functions:
  - preferred_term: chromatin binding
    modifier: DECREASED
    term:
      id: GO:0003682
      label: chromatin binding
  evidence:
  - reference: PMID:21932319
    reference_title: "Néstor-Guillermo progeria syndrome: a novel premature aging condition with early onset and chronic development caused by BANF1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in BANF1 have been recently reported to cause a new hereditary progeroid syndrome that we now propose to call the Néstor-Guillermo progeria syndrome (NGPS)."
    explanation: This directly supports BANF1 as the causal gene in NGPS.
  - reference: PMID:21549337
    reference_title: "Exome sequencing and functional analysis identifies BANF1 mutation as the cause of a hereditary progeroid syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional analysis showed that fibroblasts from both patients have a dramatic reduction in BAF protein levels, indicating that the p.Ala12Thr mutation impairs protein stability."
    explanation: Demonstrates markedly reduced BAF protein levels in homozygous p.Ala12Thr patient fibroblasts.
  downstream:
  - target: Impaired DNA binding by BAF
    causal_link_type: DIRECT
    description: The recurrent BANF1 p.Ala12Thr substitution directly disrupts the DNA-binding surface of BAF.
  - target: Nuclear envelope and chromatin dysregulation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Depletion and defective DNA binding of BAF perturb nuclear lamina organization and emerin localization.
- name: Impaired DNA binding by BAF
  biological_scale: MOLECULAR
  description: >-
    The NGPS-associated BANF1 A12T protein is folded in vitro but exhibits
    markedly impaired double-stranded DNA binding while retaining interaction with
    nuclear envelope partners, pinpointing defective chromatin-DNA bridging as a
    key biochemical defect.
  genes:
  - preferred_term: BANF1
    term:
      id: hgnc:17397
      label: BANF1
  molecular_functions:
  - preferred_term: DNA binding
    modifier: DECREASED
    term:
      id: GO:0003677
      label: DNA binding
  evidence:
  - reference: PMID:25495845
    reference_title: "Néstor-Guillermo Progeria Syndrome: a biochemical insight into Barrier-to-Autointegration Factor 1, alanine 12 threonine mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrate, using biochemical assays, that the BANF1 A12T protein is impaired in its ability to bind DNA while its interaction with nuclear envelope proteins is unperturbed."
    explanation: This directly supports impaired DNA binding as the molecular defect in NGPS.
  downstream:
  - target: Nuclear envelope and chromatin dysregulation
    causal_link_type: DIRECT
    description: Impaired DNA binding perturbs normal BAF-mediated nuclear envelope-chromatin tethering.
- name: Nuclear envelope and chromatin dysregulation
  biological_scale: CELLULAR
  description: >-
    BANF1 dysfunction causes profound nuclear lamina abnormalities in patient
    cells, including nuclear blebbing, cytoplasmic mislocalization of the LEM-domain
    partner emerin, and altered chromatin-nuclear envelope organization that are
    rescued by wild-type BANF1 expression.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: nuclear envelope organization
    modifier: ABNORMAL
    term:
      id: GO:0006998
      label: nuclear envelope organization
  - preferred_term: chromatin organization
    modifier: ABNORMAL
    term:
      id: GO:0006325
      label: chromatin organization
  evidence:
  - reference: PMID:21549337
    reference_title: "Exome sequencing and functional analysis identifies BANF1 mutation as the cause of a hereditary progeroid syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, progeroid fibroblasts display profound abnormalities in the nuclear lamina, including blebs and abnormal distribution of emerin, an interaction partner of BAF. These nuclear abnormalities are rescued by ectopic expression of wild-type BANF1, providing evidence for the causal role of this mutation."
    explanation: Demonstrates nuclear lamina blebbing and emerin mislocalization in NGPS patient fibroblasts and genetic rescue by wild-type BANF1.
  - reference: PMID:25495845
    reference_title: "Néstor-Guillermo Progeria Syndrome: a biochemical insight into Barrier-to-Autointegration Factor 1, alanine 12 threonine mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we demonstrate that the BANF1 A12T protein is indeed correctly folded, stable and that the observed phenotype, is likely due to the disruption of the DNA binding surface of the A12T mutant."
    explanation: This supports a chromatin-associated nuclear defect by showing that the NGPS mutation disrupts the BANF1 DNA-binding surface.
  downstream:
  - target: Progeroid Osteolysis and Skeletal Remodeling
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Chronic nuclear lamina and chromatin dysfunction drives severe progressive osteolysis and generalized osteoporosis.
  - target: Prematurely aged appearance
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Combined lipoatrophy, craniofacial bone resorption, and skin atrophy produce a pseudosenile progeroid appearance.
  - target: Growth delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Nuclear and chromatin dysregulation contributes to postnatal somatic growth retardation.
  - target: Joint stiffness
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Chronic connective-tissue and periarticular dysfunction produces progressive joint stiffness.
  - target: Reduced subcutaneous adipose tissue
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      BANF1-related nuclear and chromatin dysregulation contributes to the
      progeroid habitus, including reduced subcutaneous adipose tissue.
    evidence:
    - reference: PMID:21932319
      reference_title: >-
        Néstor-Guillermo progeria syndrome: a novel premature aging condition
        with early onset and chronic development caused by BANF1 mutations.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We describe herein the clinical features of the first two NGPS patients, who phenocopy features of classic progerias (i.e., Hutchinson-Gilford progeria syndrome or mandibuloacral dysplasia), such as aged appearance, growth retardation, decreased subcutaneous fat, thin limbs, and stiff joints.
      explanation: >-
        The first NGPS clinical report lists decreased subcutaneous fat among
        the progeroid features in patients with BANF1-related disease,
        supporting this phenotype as a downstream manifestation of the nuclear
        envelope and chromatin dysregulation branch.
- name: Progeroid Osteolysis and Skeletal Remodeling
  biological_scale: TISSUE
  description: >-
    Progressive resorptive bone loss and severe generalized osteoporosis affect
    the mandible, maxilla, clavicles, ribs, distal phalanges, and axial skeleton,
    driving craniofacial remodeling, scoliosis, and debilitating skeletal morbidity.
  locations:
  - preferred_term: skeleton
    term:
      id: UBERON:0004288
      label: skeleton
  biological_processes:
  - preferred_term: bone resorption
    modifier: INCREASED
    term:
      id: GO:0045453
      label: bone resorption
  evidence:
  - reference: PMID:21549337
    reference_title: "Exome sequencing and functional analysis identifies BANF1 mutation as the cause of a hereditary progeroid syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He also developed a generalized lipoatrophy, severe osteoporosis, and marked osteolysis. The atrophic facial subcutaneous fat pad and the marked osteolysis of the maxilla and mandible result in a typical pseudosenile facial appearance with micrognatia, prominent subcutaneous venous patterning, a convex nasal ridge, and proptosis"
    explanation: Documents severe osteoporosis and marked craniofacial and appendicular osteolysis driving the craniofacial and skeletal manifestations of NGPS.
  - reference: PMID:21932319
    reference_title: "Néstor-Guillermo progeria syndrome: a novel premature aging condition with early onset and chronic development caused by BANF1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, they suffer profound skeletal abnormalities that affect their quality of life."
    explanation: Confirms profound progressive skeletal disease as the principal source of clinical morbidity in NGPS.
  downstream:
  - target: Skeletal abnormalities
    causal_link_type: DIRECT
    description: Generalized resorptive bone loss and dysplastic remodeling manifest clinically as profound skeletal abnormalities.
  - target: Osteolysis
    causal_link_type: DIRECT
    description: Focal and regional bone resorption causes marked osteolysis of the mandible, maxilla, clavicles, ribs, and distal phalanges.
  - target: Osteoporosis
    causal_link_type: DIRECT
    description: Generalized bone loss produces severe early-onset osteoporosis.
  - target: Micrognathia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Severe mandibular osteolysis causes progressive mandibular regression and micrognathia.
  - target: Proptosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Maxillary/orbital bone resorption and loss of periorbital fat produce prominent eyes (proptosis).
  - target: Scoliosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Axial skeletal osteopenia and structural bone remodeling lead to severe scoliosis.
phenotypes:
- name: Prematurely aged appearance
  category: Constitutional
  diagnostic: true
  description: >-
    The aged appearance NGPS shares with the classic progerias, built from
    decreased subcutaneous fat, thin limbs, and stiff joints on a background of
    growth retardation. It is what places NGPS in the Progeroid_Syndromes
    grouping despite a mechanism (BANF1/BAF rather than lamin A) and a course
    (chronic, with long survival) that differ from Hutchinson-Gilford progeria.
  phenotype_term:
    preferred_term: Prematurely aged appearance
    term:
      id: HP:0007495

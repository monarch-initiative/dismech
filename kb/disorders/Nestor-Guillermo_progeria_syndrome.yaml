notes: >-
  Unlike Hutchinson-Gilford progeria syndrome and mandibuloacral dysplasia,
  Nestor-Guillermo progeria syndrome spares cardiovascular and metabolic systems
  into adulthood while causing severe progressive osteolysis of the mandible,
  clavicles, ribs, and distal phalanges. MONDO:0013523 lists 'BANF1-related
  neurodevelopmental syndrome' as an exact synonym and it is retained in
  synonyms for ontology alignment, although affected individuals have normal
  cognitive development rather than a neurodevelopmental phenotype.

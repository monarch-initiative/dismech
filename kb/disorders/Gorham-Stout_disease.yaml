diagnosis:
- name: Cross-sectional imaging
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    MRI and CT define the extent of osteolysis and extraosseous lymphatic involvement.
  results: Progressive osteolytic lesions with lymphatic soft-tissue extension support diagnosis.
  evidence:
  - reference: PMID:40102890
    reference_title: "Clinical features and current management experience in Gorham-Stout disease: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MRI can be used to evaluate the degree of involvement of bones, soft tissues and organs.
    explanation: Directly supports MRI as the recommended screening and staging modality for suspected GSD.
  - reference: PMID:40102890
    reference_title: "Clinical features and current management experience in Gorham-Stout disease: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CT is mainly used to evaluate the degree of bone destruction in patients.
    explanation: Directly supports CT for assessing the extent of osteolytic bone destruction in GSD.
- name: Histopathologic evaluation
  description: >-
    Biopsy is used to exclude mimics and demonstrate lymphatic-vascular tissue
    replacing bone.
  results: Nonmalignant lymphatic-vascular proliferation with bone loss supports Gorham-Stout disease.
  evidence:
  - reference: PMID:40102890
    reference_title: "Clinical features and current management experience in Gorham-Stout disease: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Typical histological images show abnormal expansion of lymphatic vessels and thin-walled blood vessels, loss of cortex and trabecular bone, and positive staining for PROX-1 and D2-40
    explanation: Directly supports characteristic histopathologic findings of lymphatic-vascular expansion and cortical/trabecular bone loss in GSD.
differential_diagnoses:
- name: diffuse lymphatic malformation
  disease_term:
    preferred_term: diffuse lymphatic malformation
    term:
      id: MONDO:0015408
      label: diffuse lymphatic malformation
  description: >-
    Generalized lymphatic disorders can overlap with soft-tissue and thoracic
    lymphatic complications.
  evidence:
  - reference: PMID:40102890
    reference_title: "Clinical features and current management experience in Gorham-Stout disease: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GLA is characterized by multifocal lymphatic malformations involving bones, viscera, and soft tissues. The osteolytic lesions are confined to the medullary cavity and are relatively stable.
    explanation: Directly supports generalized lymphatic anomaly (diffuse lymphatic malformation) as a key differential diagnosis distinguished by medullary-confined, non-progressive bone lesions.
- name: fibrous dysplasia
  disease_term:
    preferred_term: fibrous dysplasia
    term:
      id: MONDO:0000845
      label: fibrous dysplasia
  description: >-
    Fibro-osseous bone lesions may mimic progressive destructive skeletal disease.
  evidence:
  - reference: PMID:40102890
    reference_title: "Clinical features and current management experience in Gorham-Stout disease: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      X-rays show fibrous dysplasia as ground-glass, and blood tests may show elevated ALP. Some patients have GNAS mutations.
    explanation: Directly supports fibrous dysplasia as a differential diagnosis of osteolytic bone lesions distinguished by ground-glass radiographs and GNAS mutations.

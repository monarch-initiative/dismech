      ISDS Nosology and Classification of Genetic Skeletal Disorders, 2019
      revision (Mortier et al., PMID:31633310), Table 1 group 29 "Disorganized
      development of skeletal components group"; listed as "Gorham-Stout disease".
pathophysiology:
- name: Abnormal lymphangiogenic activation
  description: >-
    Dysregulated lymphatic endothelial growth drives expansion of abnormal
    lymphatic channels within and around bone.
  cell_types:
  - preferred_term: endothelial cell of lymphatic vessel
    term:

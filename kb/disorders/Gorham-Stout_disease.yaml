    term:
      id: NCIT:C198585
      label: Bisphosphonate Therapy
  description: >-
    Bisphosphonates are commonly used to reduce osteolysis and skeletal
    complications in GSD.
  target_mechanisms:
  - target: Progressive osteolysis
    treatment_effect: MODULATES

treatments:
- name: Sirolimus therapy
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sirolimus
      term:
        id: CHEBI:9168
        label: sirolimus
  description: >-
    mTOR inhibition with sirolimus is used in progressive disease to suppress
    lymphatic proliferation and reduce complications.
  target_mechanisms:
  - target: Abnormal lymphangiogenic activation
    treatment_effect: MODULATES
    description: Sirolimus inhibits PI3K-Akt-mTOR signaling to suppress abnormal lymphangiogenic vessel formation.
  target_phenotypes:
  - preferred_term: Osteolysis
    term:
      id: HP:0002797
      label: Osteolysis
  - preferred_term: Chylothorax
    term:
      id: HP:0010310
      label: Chylothorax
  evidence:
  - reference: PMID:40102890
    reference_title: "Clinical features and current management experience in Gorham-Stout disease: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surgery (66.9%) and bisphosphonates (56.9%) are still the mainstream treatment methods, with a total of 33 (18.2%) patients receiving sirolimus.
    explanation: This directly supports sirolimus as a current treatment used in GSD.
  - reference: PMID:40102890
    reference_title: "Clinical features and current management experience in Gorham-Stout disease: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Past research has shown that the PI3K-Akt-mTOR signaling pathway is important for regulating the formation of blood vessels and lymphatic vessels. Moreover, mTOR inhibitors can block downstream protein synthesis and have antitumor and antiangiogenic effects [39].
    explanation: Supports the anti-lymphangiogenic mechanism of mTOR inhibition in GSD.

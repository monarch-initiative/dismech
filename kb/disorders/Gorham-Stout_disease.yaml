  - reference: PMID:40102890
    reference_title: "Clinical features and current management experience in Gorham-Stout disease: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It commonly manifests as multiple osteolysis of the axial bone, with pain being the most common symptom.
    explanation: This directly supports osteolysis as the defining downstream skeletal lesion in GSD.
  downstream:
  - target: Skeletal pain state
    description: Active osteolysis commonly causes localized pain.
  - target: Osteolysis
    description: Osteoclast-mediated bone resorption produces progressive disappearing bone lesions.
  - target: Pathological fracture
    description: Progressive cortical and trabecular bone loss weakens bone structure and predisposes to pathological fractures.
- name: Thoracic lymphatic channel disruption
  description: >-
    Thoracic extension of abnormal lymphatic tissue can disrupt pleural
    drainage and predispose to pleural effusion.
  locations:
  - preferred_term: pleura
    term:
      id: UBERON:0000977
      label: pleura
  evidence:
  - reference: PMID:40102890
    reference_title: "Clinical features and current management experience in Gorham-Stout disease: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The mechanism of chylothorax is that irregular lymphatic vessels directly invade the pleura from the ribs or spine, and chylous fluid flows into the chest cavity from the thoracic duct or retroperitoneum.
    explanation: Directly describes thoracic lymphatic channel invasion of the pleura and chylous fluid entry into the chest cavity in GSD.
  - reference: PMID:40102890
    reference_title: "Clinical features and current management experience in Gorham-Stout disease: a systematic review."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pleural effusion was identified as a risk factor for patient mortality (P < 0.05).
    explanation: The review documents pleural effusion as a clinically important, mortality-associated complication of GSD; disruption of thoracic lymphatic channels as the mechanism producing it is the accepted interpretation rather than a finding of this quote.
  downstream:
  - target: Chylothorax formation
    description: Thoracic lymphatic disruption can produce chylous pleural effusions.
- name: Skeletal pain state
  description: >-
    Active osteolysis often produces persistent pain in the involved bone.
  evidence:
  - reference: PMID:40102890
    reference_title: "Clinical features and current management experience in Gorham-Stout disease: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pain is the most common symptom/complication of GSD patients, with 68.4% of patients complaining of pain in the lesion area.
    explanation: Directly supports persistent pain in the lesion area as the most common clinical state in GSD.
  downstream:
  - target: Bone pain
    description: Skeletal pain state manifests clinically as localized bone pain.
- name: Chylothorax formation
  description: >-
    Thoracic lymphatic disruption can lead to recurrent or persistent
    chylothorax.
  locations:
  - preferred_term: pleural cavity
    term:
      id: UBERON:0002402
      label: pleural cavity
  evidence:
  - reference: PMID:40102890
    reference_title: "Clinical features and current management experience in Gorham-Stout disease: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among the GSD patients in the past ten years, a total of 56 patients reported pleural effusion, of whom 39 patients were clearly diagnosed with chylothorax.
    explanation: Directly supports chylothorax formation as the predominant pleural effusion complication in GSD.
  downstream:
  - target: Chylothorax
    description: Accumulation of chylous effusion in the pleural cavity manifests clinically as chylothorax.

- name: Reduced Hair Cell Mechanotransduction
  role: effector
  biological_scale: CELLULAR
  conforms_to: sensorineural_hair_cell_loss#Hair Cell Mechanotransduction Failure and Death
  description: >-
    Transduction currents are normal in ahl5 hair cells at postnatal day 6 but reduced by 57% in
    inner and 71% in outer hair cells by postnatal days 12-14, around hearing onset. The knockout
    differs: early postnatal knockout hair cells have mostly normal transduction currents, yet the
    mice have no auditory brainstem response at one month, so reduced transduction is not established
    as the cause of deafness in the null.

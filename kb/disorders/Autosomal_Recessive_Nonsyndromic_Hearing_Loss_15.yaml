  - reference: PMID:23510777
    reference_title: Homozygosity mapping identifies a novel GIPC3 mutation causing congenital nonsyndromic hearing loss in a Saudi family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      for the phenotype in a consanguineous Saudi family, with five affected individuals

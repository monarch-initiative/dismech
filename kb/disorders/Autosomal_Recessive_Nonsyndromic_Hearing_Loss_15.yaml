pathophysiology:
- name: Biallelic GIPC3 Pathogenic Variants
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Biallelic germline GIPC3 variants cause recessive hearing loss. Reported homozygous alleles include
    missense changes across GH1, PDZ and GH2 regions, c.685dupG, p.Trp301* and c.226-1G>T. Loss of
    normal adaptor function is inferred from segregation, the splice assay and animal models; individual
    human alleles need not abolish protein expression. In particular, p.Trp301* removes only the
    last 12 amino acids, and the family reports do not directly measure the function of their patient
    missense proteins.

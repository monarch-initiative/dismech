  description: >-
    In P14-27 Black Swiss Gly115Arg mice, inner hair cell calcium currents activate at more hyperpolarized
    voltages and whole-cell influx increases; the normal modiolar-pillar gradient of maximal active-zone
    influx is reversed. This does not demonstrate direct GIPC3 binding to CaV1.3 or a defined calcium-channel
    trafficking pathway. The younger P8-12 knockout preparations in the 2023 study showed no calcium-current
    difference, so this is an allele-, age- and protocol-specific model result rather than a universal
    human defect.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4987782/
    reference_title: Hair cells use active zones with different voltage dependence of Ca2+ influx to decompose sounds into complementary neural codes - PMC
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In <em>Gipc3</em> mutant IHCs we found an increased whole-cell Ca<sup>2+</sup> current
    explanation: >-
      Direct patch-clamp result in the Black Swiss Gly115Arg mouse compared with age-matched C57BL/6
      controls.
  - reference: PMID:37096733
    reference_title: GIPC3 couples to MYO6 and PDZ domain proteins, and shapes the hair cell apical region.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      No difference was found in Ca2+ current properties between genotypes.
    explanation: >-
      The knockout study used calcium currents as recording quality control in P8-12 hair cells.
      This is a different age, allele and protocol, limiting generalization of the missense-model
      result.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  biological_processes:
  - preferred_term: calcium ion transmembrane transport
    modifier: INCREASED
    term:
      id: GO:0070588
      label: calcium ion transmembrane transport
  downstream:
  - target: Enhanced Inner Hair Cell Exocytosis
    causal_link_type: DIRECT
    description: >-
      Calcium influx promotes exocytosis; the authors interpret the increased capacitance response
      as a likely consequence of the increased current.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4987782/
      reference_title: Hair cells use active zones with different voltage dependence of Ca2+ influx to decompose sounds into complementary neural codes - PMC
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        likely as a consequence of the increased Ca<sup>2+</sup> current.
      explanation: >-
        An interpretation supported by paired electrophysiological measurements, without an independent
        rescue of calcium-channel activation.
- name: Enhanced Inner Hair Cell Exocytosis
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Black Swiss Gly115Arg inner hair cells have larger depolarization-evoked capacitance increments
    at P14-16, consistent with increased vesicle exocytosis accompanying enhanced calcium influx.
    This is a membrane-capacitance assay, not direct measurement of glutamate release in human hair
    cells.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4987782/
    reference_title: Hair cells use active zones with different voltage dependence of Ca2+ influx to decompose sounds into complementary neural codes - PMC
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We also observed enhanced exocytosis reported as membrane capacitance increments
    explanation: >-
      Capacitance responses were larger during 50- and 100-ms depolarizations.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  biological_processes:
  - preferred_term: synaptic vesicle exocytosis
    modifier: INCREASED
    term:
      id: GO:0016079
      label: synaptic vesicle exocytosis
  downstream:
  - target: Increased Spontaneous Auditory Nerve Firing
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Increased transmitter release can excite the postsynaptic spiral ganglion neuron. The study
      links presynaptic and in vivo measurements at the population level, without recording both
      sides of an individual synapse.
    evidence:
    - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4987782/
      reference_title: Hair cells use active zones with different voltage dependence of Ca2+ influx to decompose sounds into complementary neural codes - PMC
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These presynaptic changes likely underlie the enhanced spontaneous and sound-onset firing
      explanation: >-
        The source explicitly treats this causal explanation as provisional.
- name: Increased Spontaneous Auditory Nerve Firing
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    In vivo recordings from juvenile Black Swiss Gly115Arg mice show increased spontaneous spiral
    ganglion neuron firing and higher sound-onset firing rates despite elevated sound thresholds.
    Adapted firing and recovery from adaptation were similar to controls. Presynaptic calcium changes
    are a plausible explanation, but stereociliary dysfunction prevents isolating their contribution
    to sound encoding. These findings do not establish seizures or hyperacusis as human DFNB15 phenotypes.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4987782/
    reference_title: Hair cells use active zones with different voltage dependence of Ca2+ influx to decompose sounds into complementary neural codes - PMC
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Despite impaired transduction of sound, spontaneous SGN firing rates were elevated
    explanation: >-
      Direct in vivo single-neuron recording; the authors note that high-threshold, low-spontaneous-rate
      fibers could be undersampled.
  cell_types:
  - preferred_term: spiral ganglion neuron
    term:
      id: CL:0011113
      label: spiral ganglion neuron
- name: Reduced Autophagy Marker Response
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Gipc3 siRNA in HEI-OC1 cells and neonatal mouse cochlear explants reduces LC3B puncta or LC3B-II
    and increases p62, especially with tert-butyl hydroperoxide exposure. The authors interpret these
    changes as impaired mitophagy, but static LC3B/p62 measurements do not establish mitochondrial-selective
    autophagic flux. APPL1 abundance and colocalization change, without direct binding or a causal
    APPL1 rescue experiment in these auditory preparations. No patient allele or in vivo hearing
    rescue was tested.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC12511236/
    reference_title: Gipc3 Mutation Might Cause Sensorineural Hearing Loss by Inhibiting Mitophagy in Inner Ear Hair Cells - PMC
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Immunofluorescent analysis demonstrated significantly reduced LC3B-puncta formation in cochlear
      explants from si-Gipc3 groups versus controls
    explanation: >-
      The explant readout supports an altered autophagy-marker response; it is not proof of selective
      mitophagic flux.
- name: Increased Reactive Oxygen Species
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    In the HEI-OC1 siRNA experiment, Gipc3 depletion increases the fluorescent ROS readout and accentuates
    the response to tert-butyl hydroperoxide. This supports oxidative vulnerability in cultured cells.
    A serial pathway from deficient mitophagy to ROS production, or a role in human GIPC3 deafness,
    was not causally established.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC12511236/
    reference_title: Gipc3 Mutation Might Cause Sensorineural Hearing Loss by Inhibiting Mitophagy in Inner Ear Hair Cells - PMC
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The production of ROS increased significantly in the other three groups compared to the control
      group
    explanation: >-
      Figure 3 compares knockdown, oxidant and combined conditions; the combined condition had the
      largest increase.
- name: Mitochondrial Depolarization
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Gipc3 knockdown in HEI-OC1 cells lowers the JC-1 red-to-green fluorescence ratio, most markedly
    with tert-butyl hydroperoxide. This is an in vitro membrane-potential readout. Its temporal or
    causal relationship to the ROS and autophagy-marker changes is unresolved, and mitochondrial
    pathology has not been demonstrated in affected people.
  evidence:
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC12511236/
    reference_title: Gipc3 Mutation Might Cause Sensorineural Hearing Loss by Inhibiting Mitophagy in Inner Ear Hair Cells - PMC
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      JC-1 staining demonstrated mitochondrial depolarization through decreased red/green fluorescence
      ratio.
    explanation: >-
      A direct dye-based membrane-potential assay in the cultured-cell experiment.

phenotypes:
- category: Otologic
  name: Sensorineural Hearing Loss
  frequency: OBLIGATE
  description: >-
    Bilateral sensorineural hearing loss is the defining and, in the families assessed,
    the only feature. Balance testing (tandem gait, Romberg) and fundoscopy in the DFNB72
    families found no vestibular or retinal involvement.
  phenotype_term:
    preferred_term: Bilateral sensorineural hearing impairment
    term:
      id: HP:0008619
      label: Bilateral sensorineural hearing impairment
  evidence:
  - reference: PMID:21660509
    reference_title: Mutations of GIPC3 cause nonsyndromic hearing loss DFNB72 but not DFNB81 that also maps to chromosome 19p.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seventeen affected individuals in families DEM4322, PKDF1258, PKDF1048, DEM4197,
      PKDF335, and PKDF793 had bilateral HL that ranged from mild to profound
    explanation: >-
      Bilateral hearing loss in all 17 affected individuals of six families.
  - reference: PMID:21660509
    reference_title: Mutations of GIPC3 cause nonsyndromic hearing loss DFNB72 but not DFNB81 that also maps to chromosome 19p.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hearing loss in these families was not accompanied by obvious vestibular
      dysfunction, retinal dysfunction, or report of other anomalies.
    explanation: >-
      Supports the nonsyndromic character of the hearing loss. The preceding sentences in
      the source also describe PKDF291, which the same paper shows is a DFNB81 family, so
      "these families" is not purely GIPC3 families; the six GIPC3 families named just
      before are the bulk of them.
  - reference: PMID:21326233

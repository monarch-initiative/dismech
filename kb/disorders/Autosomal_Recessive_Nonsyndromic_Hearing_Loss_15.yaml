    preferred_term: Progressive sensorineural hearing impairment
    term:
      id: HP:0000408
      label: Progressive sensorineural hearing impairment
  description: >-
    Documented in one of two affected siblings of the Dutch DFNB95 family, whose loss
    progressed slowly from about 70 dB HL in infancy to 110 dB by 12 years, while the
    sibling's loss stayed stable at 90 dB HL. Recorded because progression is the
    dominant feature of the ahl5 mouse; in patients it is the exception on current data,
    so no frequency is assigned.
  evidence:
  - reference: PMID:21326233
    reference_title: Gipc3 mutations associated with audiogenic seizures and sensorineural hearing loss in mouse and human.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In individual II.1, the hearing loss progressed slowly to a loss of 110 dB at 12
      years of age and individual II.3, who is now 14 years old, has a stable hearing
      loss of 90 dB HL
    explanation: >-
      One progressive and one stable course within the same family.

genetic:

- name: GIPC3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: GIPC3
    term:
      id: hgnc:18183
      label: GIPC3
  association: >-
    Biallelic pathogenic variants in GIPC3 cause DFNB15/DFNB72/DFNB95. GIPC3 was first
    implicated in two small families (Indian DFNB15, Dutch DFNB95) alongside the ahl5
    mouse, and statistically significant linkage came from six large Pakistani DFNB72
    families. An adjacent 19p locus, DFNB81, is genetically distinct and not caused by
    GIPC3. Across populations GIPC3 is a rare cause of recessive deafness, with one
    exception: a founder missense allele, c.245A>G (p.Asn82Ser), in the Chuvash
    population of Russia.
  case_fractions:
  - population: Chuvash patients with hereditary sensorineural hearing loss (Russia)
    case_fraction_percent: 23.0
    notes: >-
      26 patients from 21 unrelated families; the 23% refers to patients homozygous for
      the c.245A>G founder allele.
    evidence:
    - reference: PMID:34071867
      reference_title: Genetic Variant c.245A>G (p.Asn82Ser) in GIPC3 Gene Is a Frequent Cause of Hereditary Nonsyndromic Sensorineural Hearing Loss in Chuvash Population.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        is the major molecular cause of hereditary sensorineural hearing loss in 23% of
        Chuvash patients
      explanation: >-
        The founder allele accounts for 23% of Chuvash patients.
  - population: South Indian prelingual hearing-impaired probands negative for GJB2, GJB6 and A1555G
    case_fraction_percent: 0.56
    cohort_size: 177
    evidence:
    - reference: PMID:33168789
      reference_title: Low incidence of GIPC3 variants among the prelingual hearing impaired from southern India.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We observed a single homozygous pathogenic frameshift variant c.685dupG
        (p.A229GfsX10), accounting for a low incidence (0.56%) of GIPC3 variants in south
        Indian population.
      explanation: >-
        One of 177 probands.
  - population: Saudi families with congenital nonsyndromic hearing loss
    case_fraction_percent: 1.0
    cohort_size: 100
    evidence:
    - reference: PMID:23510777
      reference_title: Homozygosity mapping identifies a novel GIPC3 mutation causing congenital nonsyndromic hearing loss in a Saudi family.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The presence of the GIPC3 mutations in only one of 100 Saudi families with
        congenital NSHL suggests that it appears to be a rare cause of familial or
        sporadic deafness in this population.
      explanation: >-
        One of 100 families.
  evidence:
  - reference: PMID:21326233
    reference_title: Gipc3 mutations associated with audiogenic seizures and sensorineural hearing loss in mouse and human.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we identify mutations in Gipc3 underlying progressive sensorineural hearing
      loss (age-related hearing loss 5, ahl5) and audiogenic seizures (juvenile
      audiogenic monogenic seizure 1, jams1) in mice and autosomal recessive deafness
      DFNB15 and DFNB95 in humans.
    explanation: >-
      The founding report linking GIPC3 to DFNB15 and DFNB95. The sentence covers both
      mouse and human findings; it is graded HUMAN_CLINICAL for the human gene-disease
      claim it is cited for here.
  - reference: PMID:21660509
    reference_title: Mutations of GIPC3 cause nonsyndromic hearing loss DFNB72 but not DFNB81 that also maps to chromosome 19p.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe one frameshift and six missense mutations in GIPC3 cosegregating
      with DFNB72 hearing loss in six large families that support statistically
      significant evidence for genetic linkage.
    explanation: >-
      Statistically significant linkage in six large families.
  - reference: PMID:21660509
    reference_title: Mutations of GIPC3 cause nonsyndromic hearing loss DFNB72 but not DFNB81 that also maps to chromosome 19p.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Haplotype analysis excluded GIPC3 from the obligate linkage interval in this family
      and defined a novel locus spanning 4.08 Mb and 104 genes.
    explanation: >-
      Establishes that a neighbouring 19p locus (DFNB81) is not GIPC3, so linkage to 19p
      alone does not assign a family to this disease.

inheritance:

- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All reported families segregate the disease recessively, and nearly all are
    consanguineous with homozygous affected members.
  evidence:
  - reference: PMID:17690910
    reference_title: The autosomal recessive nonsyndromic deafness locus DFNB72 is located on chromosome 19p13.3.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We ascertained three consanguineous Pakistani families (PKDF291, PKDF335 and
      PKDF793) segregating nonsyndromic recessive hearing loss.
    explanation: >-

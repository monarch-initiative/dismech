- name: Cuticular Plate Malformation
  role: effector
  biological_scale: CELLULAR
  description: >-
    In Gipc3 knockout inner hair cells, the cuticular plate fails to flatten from a hemispherical
    structure into a disk and fails to acquire the normal rounded-rectangular outline. Its area is
    smaller and depth greater, with initially similar volume; volume later declines after P21.5.
    GIPC3-MYO6 coupling of the plate to apical junctions is a proposed force-transmission mechanism,
    not a direct measurement of force. The link from this defect to absent hearing remains unresolved.
  cell_types:

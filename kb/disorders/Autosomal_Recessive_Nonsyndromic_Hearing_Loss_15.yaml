- name: Loss of GIPC3 Adaptor Function in Cochlear Hair Cells
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    GIPC3 is expressed in cochlear inner and outer hair cells and spiral ganglion neurons. In hair
    cells it starts out cytoplasmic and becomes concentrated in the cuticular plate and at apical
    cell junctions during postnatal development. It binds myosin VI (MYO6) directly, depends on MYO6
    for its junctional localisation, and binds PDZ-binding motifs of cytoskeletal and junctional
    proteins including MYO18A. The proposed role is as an adaptor coupling MYO6 to the actin structures
    of the hair cell apex; the older hypothesis, from its punctate cytoplasmic staining, was a role
    in vesicle trafficking. The localization and binding experiments use mouse, chicken and heterologous
    expression systems. In the Black Swiss Gly115Arg mouse, cochlear GIPC3 protein was reduced by
    82%; this mouse-allele measurement is not a protein assay of the human variants. Separate electrophysiology
    identifies altered presynaptic calcium signaling. A later siRNA study proposes an additional
    mitochondrial role in cultured auditory cells and cochlear explants.

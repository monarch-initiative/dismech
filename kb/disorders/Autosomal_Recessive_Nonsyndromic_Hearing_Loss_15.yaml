- name: Failure of Inner Hair Cell Potassium Current Maturation
  role: effector
  biological_scale: CELLULAR
  description: >-
    The 2011 Black Swiss study found smaller potassium currents at P12 than in P13 controls and proposed
    delayed inner hair cell maturation. A 2016 study of the same Gly115Arg strain instead found normally
    sized BK currents, normal BK clustering and unchanged resting potential at P14-16, using C57BL/6
    controls. Age, comparison strain and recording conditions differ; a persistent universal potassium-current
    defect is not established. Neither study demonstrates this abnormality in patients.

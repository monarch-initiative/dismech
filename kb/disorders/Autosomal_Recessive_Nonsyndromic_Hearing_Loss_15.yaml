    causal_link_type: DIRECT
    description: >-
      The splice assay demonstrates an altered transcript and premature termination; impairment of
      adaptor function is inferred. Protein absence was not measured, and the terminal p.Trp301*
      truncation must not be equated with complete protein loss.
    evidence:
    - reference: PMID:25296581
      reference_title: A canonical splice site mutation in GIPC3 causes sensorineural hearing loss in a large Pakistani family.

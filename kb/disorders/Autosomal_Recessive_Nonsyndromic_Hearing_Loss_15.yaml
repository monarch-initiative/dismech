name: Autosomal Recessive Nonsyndromic Hearing Loss 15
creation_date: "2026-09-23T17:00:00Z"
category: Mendelian
disease_term:
  preferred_term: autosomal recessive nonsyndromic hearing loss 15
  term:
    id: MONDO:0011160
    label: autosomal recessive nonsyndromic hearing loss 15
synonyms:
- DFNB15
- DFNB72
- DFNB95
- deafness, autosomal recessive 15
- deafness, autosomal recessive 72
- deafness, autosomal recessive 95
- GIPC3-related autosomal recessive nonsyndromic hearing loss
description: >-
  Bilateral sensorineural hearing loss of early, usually prelingual, onset caused by
  biallelic pathogenic variants in GIPC3, which encodes a small PDZ-domain adaptor
  protein of cochlear hair cells and spiral ganglion neurons. Three locus symbols name
  this one gene: DFNB15 (an Indian family mapped to 19p13), DFNB72 (Pakistani families
  mapped to 19p13.3) and DFNB95 (a Dutch family). Severity varies between families, from
  mild-to-severe to profound, and it is usually stable, although slow progression has
  been documented in at least one patient. The hearing loss is not accompanied by
  vestibular or retinal involvement in the families assessed.

  Nearly everything known about the mechanism comes from mouse. A PDZ-domain missense
  allele of Gipc3 underlies the ahl5 hearing-loss and jams1 audiogenic-seizure loci in
  Black Swiss mice, and disorganises the stereocilia bundle, reduces mechanotransduction
  currents and is followed by late degeneration of hair cells and spiral ganglion
  neurons. A Gipc3 knockout is profoundly deaf, with malformed cuticular plates and
  disrupted apical junctions, and GIPC3 binds myosin VI and myosin 18A. How these
  observations add up to deafness in patients is not settled.

parents:
- Autosomal Recessive Nonsyndromic Hearing Loss
- Hereditary Hearing Loss

pathophysiology:

- name: Biallelic GIPC3 Pathogenic Variants
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    Homozygous germline GIPC3 variants in consanguineous families. The reported spectrum
    is mostly missense, spread across the N-terminal GH1 region, the PDZ domain and the
    C-terminal GH2 region, together with a frameshift (c.685dupG), a nonsense variant
    (c.903G>A, p.Trp301*) and a canonical splice-site variant (c.226-1G>T) that causes
    use of an alternative acceptor, a frameshift and a premature stop codon. The truncating
    alleles make loss of function the most direct reading of the missense alleles too,
    but no study has measured the activity of a patient missense protein.
  genes:
  - preferred_term: GIPC3
    term:
      id: hgnc:18183
      label: GIPC3
  genetic_context:
    gene:
      preferred_term: GIPC3
      term:
        id: hgnc:18183
        label: GIPC3
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Typed LOSS_OF_FUNCTION on the strength of the frameshift, nonsense and
      splice-site alleles; the missense alleles have no functional assay in patient
      material.
  downstream:
  - target: Loss of GIPC3 Adaptor Function in Cochlear Hair Cells
    causal_link_type: DIRECT
    description: >-
      Truncating and splice alleles remove the protein; missense alleles are presumed to
      impair it.
    evidence:
    - reference: PMID:25296581
      reference_title: A canonical splice site mutation in GIPC3 causes sensorineural hearing loss in a large Pakistani family.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        With a minigene assay it was shown to result in the use of an alternative acceptor
        site in exon 2, resulting in a frameshift and a premature stop codon.
      explanation: >-
        A minigene splicing assay shows the c.226-1G>T allele produces a frameshifted,
        prematurely terminated transcript, i.e. a loss-of-function allele.
  evidence:
  - reference: PMID:21660509
    reference_title: Mutations of GIPC3 cause nonsyndromic hearing loss DFNB72 but not DFNB81 that also maps to chromosome 19p.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe one frameshift and six missense mutations in GIPC3 cosegregating
      with DFNB72 hearing loss in six large families that support statistically
      significant evidence for genetic linkage.
    explanation: >-
      The largest family series, establishing the allele classes and statistically
      significant linkage.
  - reference: PMID:25296581
    reference_title: A canonical splice site mutation in GIPC3 causes sensorineural hearing loss in a large Pakistani family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequence analysis of all exons and exon-intron boundaries of GIPC3 revealed a
      homozygous canonical splice site mutation, c.226-1G>T, in GIPC3.
    explanation: >-
      A homozygous splice-site allele in a further consanguineous family.

- name: Loss of GIPC3 Adaptor Function in Cochlear Hair Cells
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    GIPC3 is expressed in cochlear inner and outer hair cells and spiral ganglion neurons.
    In hair cells it starts out cytoplasmic and becomes concentrated in the cuticular plate
    and at apical cell junctions during postnatal development. It binds myosin VI (MYO6)
    directly, depends on MYO6 for its junctional localisation, and binds PDZ-binding
    motifs of cytoskeletal and junctional proteins including MYO18A. The proposed role is
    as an adaptor coupling MYO6 to the actin structures of the hair cell apex; the older
    hypothesis, from its punctate cytoplasmic staining, was a role in vesicle trafficking.
    All of this is mouse and chicken data.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  - preferred_term: spiral ganglion neuron
    term:
      id: CL:0011113
      label: spiral ganglion neuron
  cellular_components:
  - preferred_term: cuticular plate
    term:
      id: GO:0032437
      label: cuticular plate
  - preferred_term: cell-cell junction
    term:
      id: GO:0005911
      label: cell-cell junction
  locations:
  - preferred_term: cochlea
    term:
      id: UBERON:0001844
      label: cochlea
  downstream:
  - target: Stereocilia Bundle Disorganisation
    causal_link_type: DIRECT
    description: >-
      Shown for the ahl5 PDZ-domain missense allele in mouse.
    evidence:
    - reference: PMID:21326233
      reference_title: Gipc3 mutations associated with audiogenic seizures and sensorineural hearing loss in mouse and human.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The Gipc3(343A) allele disrupts the structure of the stereocilia bundle and affects
        long-term function of auditory hair cells and spiral ganglion neurons.
      explanation: >-
        The mouse missense allele causes the bundle defect.
  - target: Cuticular Plate and Apical Junction Malformation
    causal_link_type: DIRECT
    description: >-
      Shown for the Gipc3 knockout mouse.
    evidence:
    - reference: PMID:37096733
      reference_title: GIPC3 couples to MYO6 and PDZ domain proteins, and shapes the hair cell apical region.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Cuticular plates of Gipc3KO/KO hair cells did not flatten during development as
        did those of controls; moreover, hair bundles were squeezed along the cochlear axis
        in mutant hair cells.
      explanation: >-
        Loss of GIPC3 in the knockout mouse causes the cuticular plate defect.
  - target: Hair Cell and Spiral Ganglion Neuron Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Late-onset in the ahl5 mouse; the intermediate steps are not established.
    evidence:
    - reference: PMID:21326233
      reference_title: Gipc3 mutations associated with audiogenic seizures and sensorineural hearing loss in mouse and human.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Together, these data suggest that Gipc3 is required for postnatal maturation of the
        hair bundle and long-term survival of hair cells and spiral ganglion.
      explanation: >-
        The authors' conclusion from the ahl5 histology, linking GIPC3 function to
        long-term survival of both cell populations.
  evidence:
  - reference: PMID:21326233
    reference_title: Gipc3 mutations associated with audiogenic seizures and sensorineural hearing loss in mouse and human.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Gipc3 localizes to inner ear sensory hair cells and spiral ganglion.
    explanation: >-
      Places the protein in the cells the disease affects.
  - reference: PMID:37096733
    reference_title: GIPC3 couples to MYO6 and PDZ domain proteins, and shapes the hair cell apical region.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we establish that GIPC3 is initially localized to the cytoplasm of inner and
      outer hair cells of the cochlea and then is increasingly concentrated in cuticular
      plates and at cell junctions during postnatal development.
    explanation: >-
      Developmental localisation of GIPC3 in mouse cochlear hair cells.
  - reference: PMID:37096733
    reference_title: GIPC3 couples to MYO6 and PDZ domain proteins, and shapes the hair cell apical region.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      GIPC3 bound directly to MYO6, and the loss of MYO6 led to altered distribution of
      GIPC3.
    explanation: >-
      Direct binding to MYO6. The sentence also reports an in vivo result (GIPC3
      mislocalisation in Myo6-null hair cells); it is graded IN_VITRO for the binding
      claim it is cited for.
  - reference: PMID:37096733
    reference_title: GIPC3 couples to MYO6 and PDZ domain proteins, and shapes the hair cell apical region.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We propose that GIPC3 and MYO6 couple to PBMs of cytoskeletal and cell junction
      proteins to shape the cuticular plate.
    explanation: >-
      The authors' model of GIPC3 function, drawn from the chicken inner ear
      immunoaffinity purification and binding data.

- name: Stereocilia Bundle Disorganisation
  role: effector
  biological_scale: CELLULAR
  description: >-
    In ahl5 mice, outer hair cell bundles are disoriented and smaller from postnatal day 3,
    and inner hair cell bundles are sparse and less rigid, with thinner and sometimes
    shorter stereocilia by postnatal day 21. The Gipc3 knockout also has hair bundles
    compressed along the cochlear axis.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  cellular_components:
  - preferred_term: stereocilium bundle
    term:
      id: GO:0032421
      label: stereocilium bundle
  biological_processes:
  - preferred_term: auditory receptor cell stereocilium organization
    modifier: DECREASED
    term:
      id: GO:0060088
      label: auditory receptor cell stereocilium organization
  downstream:
  - target: Reduced Hair Cell Mechanotransduction
    causal_link_type: DIRECT
    description: >-
      Inferred by the authors from the bundle defect and the timing of the current loss;
      not tested by a separate manipulation.
    evidence:
    - reference: PMID:21326233
      reference_title: Gipc3 mutations associated with audiogenic seizures and sensorineural hearing loss in mouse and human.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The compromised structure of the stereocilia bundle suggested a defect in
        mechanotransduction.
      explanation: >-
        The authors link the bundle defect to the transduction deficit they then measured.
  evidence:
  - reference: PMID:21326233
    reference_title: Gipc3 mutations associated with audiogenic seizures and sensorineural hearing loss in mouse and human.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      By confocal and scanning electron microscopy we observed an irregular structure of
      the stereocilia bundle of OHC and inner hair cells (IHC).
    explanation: >-
      Direct imaging of the bundle defect in ahl5 mice.

- name: Reduced Hair Cell Mechanotransduction
  role: effector
  biological_scale: CELLULAR
  conforms_to: "sensorineural_hair_cell_loss#Hair Cell Mechanotransduction Failure and Death"
  description: >-
    Transduction currents are normal in ahl5 hair cells at postnatal day 6 but reduced by
    57% in inner and 71% in outer hair cells by postnatal days 12-14, around hearing onset.
    The same allele also blunts maturation of inner hair cell potassium currents. The
    knockout differs: early postnatal knockout hair cells have mostly normal transduction
    currents, yet the mice have no auditory brainstem response at one month, so reduced
    transduction is not established as the cause of deafness in the null.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  biological_processes:
  - preferred_term: detection of mechanical stimulus involved in sensory perception of sound
    modifier: DECREASED
    term:
      id: GO:0050910
      label: detection of mechanical stimulus involved in sensory perception of sound
  downstream:
  - target: Sensorineural Hearing Loss
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21326233
      reference_title: Gipc3 mutations associated with audiogenic seizures and sensorineural hearing loss in mouse and human.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        This reduction likely accounts for the elevated hearing thresholds.
      explanation: >-
        The authors attribute the elevated ABR thresholds of ahl5 mice to the reduced
        transduction currents. The human hearing loss is linked to this mouse step by
        inference only.
  evidence:
  - reference: PMID:21326233
    reference_title: Gipc3 mutations associated with audiogenic seizures and sensorineural hearing loss in mouse and human.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      A missense mutation in the PDZ domain has an attenuating effect on
      mechanotransduction and the acquisition of mature inner hair cell potassium
      currents.
    explanation: >-
      Summary of the electrophysiology in ahl5 hair cells.
  - reference: PMID:37096733
    reference_title: GIPC3 couples to MYO6 and PDZ domain proteins, and shapes the hair cell apical region.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Early postnatal Gipc3KO/KO mice had mostly normal mechanotransduction currents, but
      had no auditory brainstem response at 1 month of age.
    explanation: >-
      In the full knockout, early transduction is largely preserved while hearing is
      absent, which argues against reduced transduction being a general explanation of
      GIPC3 deafness (it does not exclude a later decline, which was not the time point
      tested here).

- name: Cuticular Plate and Apical Junction Malformation
  role: effector
  biological_scale: CELLULAR
  description: >-
    In Gipc3 knockout inner hair cells the cuticular plate fails to flatten and to take its
    normal rounded-rectangular shape, and junctions between inner hair cells and adjacent
    inner phalangeal cells are severely disrupted. How this produces the profound deafness
    of the knockout is not shown; it is left without a downstream edge rather than wired
    to the hearing-loss phenotype on inference.
  cell_types:
  - preferred_term: cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  cellular_components:
  - preferred_term: cuticular plate
    term:
      id: GO:0032437
      label: cuticular plate
  - preferred_term: cell-cell junction
    term:
      id: GO:0005911
      label: cell-cell junction
  evidence:
  - reference: PMID:37096733
    reference_title: GIPC3 couples to MYO6 and PDZ domain proteins, and shapes the hair cell apical region.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Junctions between inner hair cells and adjacent inner phalangeal cells were also
      severely disrupted in Gipc3KO/KO cochleas.
    explanation: >-
      The junctional defect in the knockout.

- name: Hair Cell and Spiral Ganglion Neuron Degeneration
  role: effector
  biological_scale: TISSUE
  conforms_to: "sensorineural_hair_cell_loss#Cochlear Amplification Loss and Spiral Ganglion Neuron Degeneration"
  description: >-
    In ahl5 mice the organ of Corti and spiral ganglion are histologically normal at 8
    weeks, but by 52 weeks the organ of Corti has degenerated from base towards apex and
    the spiral ganglion has lost many neurons, in parallel with progression of the hearing
    loss from high to low frequencies. Whether the same degeneration occurs in patients,
    most of whom have early non-progressive loss, is unknown.
  cell_types:
  - preferred_term: spiral ganglion neuron
    term:
      id: CL:0011113
      label: spiral ganglion neuron
  locations:
  - preferred_term: organ of Corti
    term:
      id: UBERON:0002227
      label: spiral organ of cochlea
  - preferred_term: spiral ganglion
    term:
      id: UBERON:0000395
      label: cochlear ganglion
  downstream:
  - target: Progressive Hearing Loss
    causal_link_type: DIRECT
    description: >-
      Established for the mouse; the human progression is documented in one patient
      without histology.
    evidence:
    - reference: PMID:21326233
      reference_title: Gipc3 mutations associated with audiogenic seizures and sensorineural hearing loss in mouse and human.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The high-to-low frequency progression of the hearing loss suggested a histopathology
        in the organ of Corti.
      explanation: >-
        The authors connect the progressive mouse hearing loss to the organ of Corti
        pathology they then documented.
  evidence:
  - reference: PMID:21326233
    reference_title: Gipc3 mutations associated with audiogenic seizures and sensorineural hearing loss in mouse and human.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Concomitantly, the spiral ganglion exhibited a severe loss of neurons that was most
      obvious at the base and the mid-apical region of the cochlea.
    explanation: >-
      Spiral ganglion neuron loss in aged ahl5 mice.

phenotypes:

- category: Otologic
  name: Sensorineural Hearing Loss
  frequency: OBLIGATE
  description: >-
    Bilateral sensorineural hearing loss is the defining and, in the families assessed,
    the only feature. Balance testing (tandem gait, Romberg) and fundoscopy in the DFNB72
    families found no vestibular or retinal involvement.
  phenotype_term:
    preferred_term: Bilateral sensorineural hearing impairment
    term:
      id: HP:0008619
      label: Bilateral sensorineural hearing impairment
  evidence:
  - reference: PMID:21660509
    reference_title: Mutations of GIPC3 cause nonsyndromic hearing loss DFNB72 but not DFNB81 that also maps to chromosome 19p.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Seventeen affected individuals in families DEM4322, PKDF1258, PKDF1048, DEM4197,
      PKDF335, and PKDF793 had bilateral HL that ranged from mild to profound
    explanation: >-
      Bilateral hearing loss in all 17 affected individuals of six families.
  - reference: PMID:21660509
    reference_title: Mutations of GIPC3 cause nonsyndromic hearing loss DFNB72 but not DFNB81 that also maps to chromosome 19p.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hearing loss in these families was not accompanied by obvious vestibular
      dysfunction, retinal dysfunction, or report of other anomalies.
    explanation: >-
      Supports the nonsyndromic character of the hearing loss.
  - reference: PMID:21326233
    reference_title: Gipc3 mutations associated with audiogenic seizures and sensorineural hearing loss in mouse and human.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The hearing loss in family W98-042 is bilateral and sensorineural with an early
      onset.
    explanation: >-
      The DFNB95 family.


      years of age and individual II.3, who is now 14 years old, has a stable hearing
      loss of 90 dB HL
    explanation: >-
      One progressive and one stable course within the same family.

genetic:
- name: GIPC3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: GIPC3
    term:
      id: hgnc:18183
      label: GIPC3
  association: >-
    Biallelic pathogenic variants in GIPC3 cause DFNB15/DFNB72/DFNB95. GIPC3 was first implicated
    in two small families (Indian DFNB15, Dutch DFNB95) alongside the ahl5 mouse, and statistically
    significant linkage came from six large Pakistani DFNB72 families. An adjacent 19p locus, DFNB81,
    is genetically distinct and not caused by GIPC3. Across populations GIPC3 is a rare cause of
    recessive deafness, with one exception: a founder missense allele, c.245A>G (p.Asn82Ser), in
    the Chuvash population of Russia.
  case_fractions:
  - population: Chuvash patients with hereditary sensorineural hearing loss (Russia)
    case_fraction_percent: 23.0
    notes: >-
      Six homozygous patients among 26 patients from 21 families. The reported 13/52 variant chromosomes
      (25%) include one additional heterozygous affected person without an identified second GIPC3
      allele and must not be interpreted as a 25% diagnostic yield.
    evidence:
    - reference: PMID:34071867
      reference_title: Genetic Variant c.245A>G (p.Asn82Ser) in GIPC3 Gene Is a Frequent Cause of Hereditary Nonsyndromic Sensorineural Hearing Loss in Chuvash Population.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        is the major molecular cause of hereditary sensorineural hearing loss in 23% of Chuvash patients
      explanation: >-
        The founder allele accounts for 23% of Chuvash patients.
    cohort_size: 26
  - population: South Indian prelingual hearing-impaired probands negative for GJB2, GJB6 and A1555G
    case_fraction_percent: 0.56
    cohort_size: 177
    evidence:
    - reference: PMID:33168789
      reference_title: Low incidence of GIPC3 variants among the prelingual hearing impaired from southern India.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We observed a single homozygous pathogenic frameshift variant c.685dupG (p.A229GfsX10), accounting
        for a low incidence (0.56%) of GIPC3 variants in south Indian population.
      explanation: >-
        One of 177 probands.
  - population: Saudi families with congenital nonsyndromic hearing loss
    case_fraction_percent: 1.0
    cohort_size: 100
    evidence:
    - reference: PMID:23510777
      reference_title: Homozygosity mapping identifies a novel GIPC3 mutation causing congenital nonsyndromic hearing loss in a Saudi family.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The presence of the GIPC3 mutations in only one of 100 Saudi families with congenital NSHL
        suggests that it appears to be a rare cause of familial or sporadic deafness in this population.
      explanation: >-
        One of 100 families.
  evidence:
  - reference: PMID:21326233
    reference_title: Gipc3 mutations associated with audiogenic seizures and sensorineural hearing loss in mouse and human.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we identify mutations in Gipc3 underlying progressive sensorineural hearing loss (age-related
      hearing loss 5, ahl5) and audiogenic seizures (juvenile audiogenic monogenic seizure 1, jams1)
      in mice and autosomal recessive deafness DFNB15 and DFNB95 in humans.
    explanation: >-
      The founding report linking GIPC3 to DFNB15 and DFNB95. The sentence covers both mouse and
      human findings; it is graded HUMAN_CLINICAL for the human gene-disease claim it is cited for
      here.
  - reference: PMID:21660509
    reference_title: Mutations of GIPC3 cause nonsyndromic hearing loss DFNB72 but not DFNB81 that also maps to chromosome 19p.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe one frameshift and six missense mutations in GIPC3 cosegregating with DFNB72
      hearing loss in six large families that support statistically significant evidence for genetic
      linkage.
    explanation: >-
      Statistically significant linkage in six large families.
  - reference: PMID:21660509
    reference_title: Mutations of GIPC3 cause nonsyndromic hearing loss DFNB72 but not DFNB81 that also maps to chromosome 19p.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Haplotype analysis excluded GIPC3 from the obligate linkage interval in this family and defined
      a novel locus spanning 4.08 Mb and 104 genes.
    explanation: >-
      Establishes that a neighbouring 19p locus (DFNB81) is not GIPC3, so linkage to 19p alone does
      not assign a family to this disease.

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Recessive segregation is supported by multiple consanguineous families with homozygous affected
    members and by a Chuvash founder cohort. Parental relatedness is not a diagnostic requirement.
    Human carrier hearing risk should not be inferred from the heterozygote findings in mouse strains.
  evidence:
  - reference: PMID:21660509
    reference_title: Mutations of GIPC3 cause nonsyndromic hearing loss DFNB72 but not DFNB81 that also maps to chromosome 19p.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report seven homozygous recessive mutations of GIPC3 associated with mild to profound
      HL segregating in seven large consanguineous families.
    explanation: >-
      Homozygous GIPC3 variants segregating recessively in seven consanguineous families.

animal_models:
- name: Gipc3 ahl5/jams1 Black Swiss mouse
  species: Mouse
  genotype: Gipc3 c.343G>A (PDZ-domain missense) homozygous, Black Swiss background
  publication: PMID:21326233
  description: >-
    A naturally occurring PDZ-domain missense allele underlying the ahl5 hearing-loss locus and the
    jams1 audiogenic-seizure locus. Mice have moderate hearing impairment at 4 weeks that becomes
    profound by one year, disorganised stereocilia bundles, reduced transduction currents, immature
    inner hair cell potassium currents, and late degeneration of the organ of Corti and spiral ganglion.
    Transgenic wild-type Gipc3 restores hearing thresholds at the click, 8 kHz and 16 kHz stimuli.
    The juvenile audiogenic seizures have no counterpart reported in patients.
  modeled_mechanisms:
  - target: Stereocilia Bundle Disorganisation
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    limitations: >-
      No human cochlear histology exists for this disease, so fidelity cannot be judged.
    evidence:
    - reference: PMID:21326233
      reference_title: Gipc3 mutations associated with audiogenic seizures and sensorineural hearing loss in mouse and human.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        By confocal and scanning electron microscopy we observed an irregular structure of the stereocilia
        bundle of OHC and inner hair cells (IHC).
      explanation: >-
        The bundle defect is observed directly in this model.
  - target: Progressive Hearing Loss
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    limitations: >-
      The mouse loss is early-onset but moderate and progressive, resembling age-related hearing
      loss, whereas patients mostly have prelingual, stable, severe-to-profound loss. The mouse allele
      is a missense variant not seen in patients, on the Black Swiss background where a second quantitative
      trait locus, ahl6, also contributes to the hearing loss.
    evidence:
    - reference: PMID:21326233
      reference_title: Gipc3 mutations associated with audiogenic seizures and sensorineural hearing loss in mouse and human.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        At 52 weeks of age, BLSW mice exhibited a profound hearing loss that progressed from higher
        to lower test frequencies.
      explanation: >-
        Progressive hearing loss in the model.
- name: Gipc3 knockout mouse
  species: Mouse
  genotype: Gipc3 tm1b (exons 2-3 deleted) homozygous
  publication: PMID:37096733
  description: >-
    The IMPC global knockout, closer in kind to the truncating patient alleles. It is profoundly
    deaf by one month, with malformed cuticular plates, compressed hair bundles and disrupted inner
    hair cell junctions, but largely normal early transduction currents.
  modeled_mechanisms:
  - target: Cuticular Plate Malformation
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    limitations: >-
      The defect is defined in mouse only; there is no human tissue to compare.
    evidence:
    - reference: PMID:37096733
      reference_title: GIPC3 couples to MYO6 and PDZ domain proteins, and shapes the hair cell apical region.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Cuticular plates of Gipc3KO/KO hair cells did not flatten during development as did those
        of controls; moreover, hair bundles were squeezed along the cochlear axis in mutant hair
        cells.
      explanation: >-
        The apical-region defect as observed in this model.
  - target: Sensorineural Hearing Loss
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      ABR shows absent responses at 1 month; the mechanism linking the apical defects to absent hearing
      is not established.
    evidence:
    - reference: PMID:37096733
      reference_title: GIPC3 couples to MYO6 and PDZ domain proteins, and shapes the hair cell apical region.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Early postnatal Gipc3KO/KO mice had mostly normal mechanotransduction currents, but had no
        auditory brainstem response at 1 month of age.
      explanation: >-
        Absent hearing in the null mouse, matching the profound end of the human spectrum.
  - target: Apical Hair Cell Junction Disruption
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    limitations: >-
      The junctional abnormality is defined in mouse; no corresponding human cochlear tissue was
      studied.
    evidence:
    - reference: PMID:37096733
      reference_title: GIPC3 couples to MYO6 and PDZ domain proteins, and shapes the hair cell apical region.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Junctions between inner hair cells and adjacent inner phalangeal cells were also severely
        disrupted in Gipc3KO/KO cochleas.
      explanation: >-
        The junctional defect in the knockout.

diagnosis:
- name: Hearing Loss Gene Panel or Exome Sequencing
  description: >-
    Clinically indistinguishable from other recessive nonsyndromic hearing losses, so the
    diagnosis is molecular. Reported families were solved by homozygosity mapping
    followed by GIPC3 sequencing, or by targeted deafness-gene panels after exclusion of
    the common genes. Because DFNB81 lies next to GIPC3 on 19p, linkage to the region is
    not enough; biallelic pathogenic or likely pathogenic GIPC3 variants must be established in the appropriate clinical and segregation context.
  evidence:
  - reference: PMID:29605370
    reference_title: A novel missense mutation in GIPC3 causes sensorineural hearing loss in an Iranian family revealed by targeted next-generation sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Targeted NGS allows easier detection of mutations in relatively uncommon deafness
      genes in families with ARNSHL.
    explanation: >-
      A GIPC3 family diagnosed by targeted panel sequencing.
  - reference: PMID:23510777
    reference_title: Homozygosity mapping identifies a novel GIPC3 mutation causing congenital nonsyndromic hearing loss in a Saudi family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A single shared block of homozygosity was identified on chromosome 19p13.3
      encompassing GIPC3, a recently identified hearing loss gene.
    explanation: >-
      Homozygosity mapping as the route to the diagnosis in a consanguineous family.

treatments:
- name: Cochlear Implantation
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  description: >-
    The standard intervention for severe-to-profound sensorineural loss. One GIPC3 patient (DFNB95,
    individual II.1) is reported to have been implanted after an audiogram at 11.5 years of age,
    following progression to profound loss; no outcome is reported. The spiral ganglion degeneration
    seen in aged ahl5 mice is a theoretical concern for implant benefit, but has not been looked
    for in patients.
  target_mechanisms:
  - target: Reduced Hair Cell Mechanotransduction
    treatment_effect: BYPASSES
    description: >-
      Stimulates the auditory nerve directly, bypassing hair cell transduction.
  evidence:
  - reference: PMID:21326233
    reference_title: Gipc3 mutations associated with audiogenic seizures and sensorineural hearing loss in mouse and human.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individual II.1 received a cochlear implant after the audiogram taken at 11.5 years of age.
    explanation: >-
      Documents use of a cochlear implant in a GIPC3 patient. It reports the intervention only, not
      its outcome.
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1434/
    reference_title: Genetic Hearing Loss Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cochlear implantation can be considered in children with severe-to-profound hearing loss
    explanation: >-
      General hearing-loss management guidance. It does not establish GIPC3-specific implantation
      outcomes.
- name: Hearing Aids and Auditory Habilitation
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: auditory habilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  description: >-
    For the families with mild-to-severe or moderate-to-severe loss, amplification and early habilitation
    are the relevant interventions. There are no GIPC3-specific data; this is general practice for
    prelingual sensorineural hearing loss.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1434/
    reference_title: Genetic Hearing Loss Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      can be used in individuals with mild-to-severe hearing loss.
    explanation: >-
      The general GeneReviews overview supports hearing aids across this severity range; it provides
      no GIPC3-specific outcome data.
- name: Genetic Counselling
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  description: >-
    For a couple confirmed to carry pathogenic GIPC3 variants, each pregnancy has a 25% chance of
    biallelic disease. Confirm parental genotypes and tailor counseling to the actual family, including
    families with an affected parent. The Chuvash founder allele supports targeted testing in that
    population; a negative founder test does not exclude other GIPC3 variants or other hearing-loss
    genes.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/books/NBK1434/
    reference_title: Genetic Hearing Loss Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      has at conception a 25% chance of having hearing loss
    explanation: >-
      This risk applies when both parents are confirmed heterozygotes for an autosomal recessive
      hearing-loss variant, not to every parental genotype combination.

discussions:
- discussion_id: mismatch_ahl5_course
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Gipc3 ahl5/jams1 Black Swiss mouse
  - pathophysiology#Reduced Hair Cell Mechanotransduction
  - pathophysiology#Hair Cell and Spiral Ganglion Neuron Degeneration
  prompt: >-
    Does the reduced-transduction, progressive-degeneration mechanism described in the
    ahl5 mouse explain GIPC3 deafness in patients, who mostly have prelingual, stable,
    severe-to-profound loss?
  rationale: >-
    The mechanistic chain in this entry comes almost entirely from the ahl5 missense
    mouse, which has a moderate, progressive, age-related-like hearing loss. The Gipc3
    knockout, closer to the truncating human alleles, is profoundly deaf by one month with
    largely normal early transduction currents, and its most visible defect is in the
    cuticular plate and apical junctions instead. So the two mouse models point to
    different proximate causes, and neither has been compared with human cochlear
    pathology. Only one patient has documented progression.

notes: >-
  DFNB15, DFNB72 and DFNB95 designate GIPC3-related hearing loss. DFNB81 is a distinct adjacent locus
  and should not be merged with this entry. The original DFNB15 mapping included both 3q and 19p
  candidates; the later genetic work identifies GIPC3 at 19p. No disease-specific GeneReviews chapter
  was identified; the general Genetic Hearing Loss Overview supports care and counseling, while primary
  family reports define the clinical phenotype. Human evidence establishes inheritance and hearing
  loss. Most mechanism evidence is from mice, chicken tissue or heterologous binding assays; the
  2025 mitophagy proposal uses siRNA-treated cells and neonatal explants, not an in vivo mutant or
  patient study. No GIPC3-specific cochlear implant outcome is established by the cited implantation
  report.


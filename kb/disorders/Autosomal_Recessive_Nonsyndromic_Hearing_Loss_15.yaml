animal_models:

- name: Gipc3 ahl5/jams1 Black Swiss mouse
  species: Mouse
  genotype: Gipc3 c.343G>A (PDZ-domain missense) homozygous, Black Swiss background
  publication: PMID:21326233
  description: >-
    A naturally occurring PDZ-domain missense allele underlying the ahl5 hearing-loss
    locus and the jams1 audiogenic-seizure locus. Mice have moderate hearing impairment
    at 4 weeks that becomes profound by one year, disorganised stereocilia bundles,
    reduced transduction currents, immature inner hair cell potassium currents, and late
    degeneration of the organ of Corti and spiral ganglion. Transgenic wild-type Gipc3
    restores hearing thresholds at the click, 8 kHz and 16 kHz stimuli. The juvenile
    audiogenic seizures have no counterpart reported in patients.
  modeled_mechanisms:
  - target: Stereocilia Bundle Disorganisation
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    limitations: >-
      No human cochlear histology exists for this disease, so fidelity cannot be judged.
    evidence:
    - reference: PMID:21326233
      reference_title: Gipc3 mutations associated with audiogenic seizures and sensorineural hearing loss in mouse and human.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        By confocal and scanning electron microscopy we observed an irregular structure of
        the stereocilia bundle of OHC and inner hair cells (IHC).
      explanation: >-
        The bundle defect is observed directly in this model.
  - target: Progressive Hearing Loss
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    limitations: >-
      The mouse loss is early-onset but moderate and progressive, resembling age-related
      hearing loss, whereas patients mostly have prelingual, stable, severe-to-profound
      loss. The mouse allele is a missense variant not seen in patients, on the Black
      Swiss background where a second quantitative trait locus, ahl6, also contributes to
      the hearing loss.
    evidence:
    - reference: PMID:21326233
      reference_title: Gipc3 mutations associated with audiogenic seizures and sensorineural hearing loss in mouse and human.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        At 52 weeks of age, BLSW mice exhibited a profound hearing loss that progressed
        from higher to lower test frequencies.
      explanation: >-
        Progressive hearing loss in the model.

- name: Gipc3 knockout mouse
  species: Mouse
  genotype: Gipc3 tm1b (exons 2-3 deleted) homozygous
  publication: PMID:37096733
  description: >-
    The IMPC global knockout, closer in kind to the truncating patient alleles. It is
    profoundly deaf by one month, with malformed cuticular plates, compressed hair bundles
    and disrupted inner hair cell junctions, but largely normal early transduction
    currents.
  modeled_mechanisms:
  - target: Cuticular Plate and Apical Junction Malformation
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    limitations: >-
      The defect is defined in mouse only; there is no human tissue to compare.
    evidence:
    - reference: PMID:37096733
      reference_title: GIPC3 couples to MYO6 and PDZ domain proteins, and shapes the hair cell apical region.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Cuticular plates of Gipc3KO/KO hair cells did not flatten during development as
        did those of controls; moreover, hair bundles were squeezed along the cochlear axis
        in mutant hair cells.
      explanation: >-
        The apical-region defect as observed in this model.
  - target: Sensorineural Hearing Loss
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      ABR shows absent responses at 1 month; the mechanism linking the apical defects to
      absent hearing is not established.
    evidence:
    - reference: PMID:37096733
      reference_title: GIPC3 couples to MYO6 and PDZ domain proteins, and shapes the hair cell apical region.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Early postnatal Gipc3KO/KO mice had mostly normal mechanotransduction currents, but
        had no auditory brainstem response at 1 month of age.
      explanation: >-
        Absent hearing in the null mouse, matching the profound end of the human spectrum.

diagnosis:

- name: Hearing Loss Gene Panel or Exome Sequencing
  description: >-
    Clinically indistinguishable from other recessive nonsyndromic hearing losses, so the
    diagnosis is molecular. Reported families were solved by homozygosity mapping
    followed by GIPC3 sequencing, or by targeted deafness-gene panels after exclusion of
    the common genes. Because DFNB81 lies next to GIPC3 on 19p, linkage to the region is
    not enough; a GIPC3 variant must be found.
  evidence:
  - reference: PMID:29605370
    reference_title: A novel missense mutation in GIPC3 causes sensorineural hearing loss in an Iranian family revealed by targeted next-generation sequencing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Targeted NGS allows easier detection of mutations in relatively uncommon deafness
      genes in families with ARNSHL.
    explanation: >-
      A GIPC3 family diagnosed by targeted panel sequencing.
  - reference: PMID:23510777
    reference_title: Homozygosity mapping identifies a novel GIPC3 mutation causing congenital nonsyndromic hearing loss in a Saudi family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A single shared block of homozygosity was identified on chromosome 19p13.3
      encompassing GIPC3, a recently identified hearing loss gene.
    explanation: >-
      Homozygosity mapping as the route to the diagnosis in a consanguineous family.

treatments:

- name: Cochlear Implantation
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  description: >-
    The standard intervention for severe-to-profound sensorineural loss. One GIPC3 patient
    (DFNB95, individual II.1) is reported to have been implanted after an audiogram at
    11.5 years of age, following progression to profound loss; no outcome is reported. The
    spiral ganglion degeneration seen in aged ahl5 mice is a theoretical concern for
    implant benefit, but has not been looked for in patients.
  target_mechanisms:
  - target: Reduced Hair Cell Mechanotransduction
    treatment_effect: BYPASSES
    description: >-
      Stimulates the auditory nerve directly, bypassing hair cell transduction.
  evidence:
  - reference: PMID:21326233
    reference_title: Gipc3 mutations associated with audiogenic seizures and sensorineural hearing loss in mouse and human.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individual II.1 received a cochlear implant after the audiogram taken at 11.5 years
      of age.
    explanation: >-
      Documents use of a cochlear implant in a GIPC3 patient. It reports the intervention
      only, not its outcome.

- name: Hearing Aids and Auditory Habilitation
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: auditory habilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  description: >-
    For the families with mild-to-severe or moderate-to-severe loss, amplification and
    early habilitation are the relevant interventions. There are no GIPC3-specific data;
    this is general practice for prelingual sensorineural hearing loss.

- name: Genetic Counselling
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  description: >-
    Autosomal recessive inheritance with a 25% recurrence risk for carrier couples. In the
    Chuvash population a single founder allele makes targeted carrier testing practical.

discussions:

- discussion_id: mismatch_ahl5_course
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Gipc3 ahl5/jams1 Black Swiss mouse
  - pathophysiology#Reduced Hair Cell Mechanotransduction
  - pathophysiology#Hair Cell and Spiral Ganglion Neuron Degeneration
  prompt: >-
    Does the reduced-transduction, progressive-degeneration mechanism described in the
    ahl5 mouse explain GIPC3 deafness in patients, who mostly have prelingual, stable,
    severe-to-profound loss?
  rationale: >-
    The mechanistic chain in this entry comes almost entirely from the ahl5 missense
    mouse, which has a moderate, progressive, age-related-like hearing loss. The Gipc3
    knockout, closer to the truncating human alleles, is profoundly deaf by one month with
    largely normal early transduction currents, and its most visible defect is in the
    cuticular plate and apical junctions instead. So the two mouse models point to
    different proximate causes, and neither has been compared with human cochlear
    pathology. Only one patient has documented progression.

notes: >-
  Locus nomenclature. DFNB15 was originally mapped in an Indian family to two candidate
  regions, 3q21.3-q25.2 and 19p13.3-13.1 (PMID:11493199); the 19p region carries GIPC3.
  DFNB72 (Pakistani families) and DFNB95 (a Dutch family) are the same gene. DFNB81 is a
  separate 19p locus adjacent to GIPC3 and should not be merged with this entry.

  Deep-research report. The Perplexity report cites mostly bare URLs, and its term
  validation flagged 17 of its CURIEs as naming different terms (for example
  UBERON:0001757 given as cochlea is pinna, CL:0000632 given as spiral ganglion neuron is
  hepatic stellate cell) and HP:0008594 as nonexistent. No CURIE was taken from it;
  every binding here was looked up directly.

  GeneReviews. No GeneReviews chapter names this disease (`just check-genereviews`
  against the 2026-09-10 Bookshelf index returns NO_CHAPTER), so the phenotype baseline
  is the primary family reports.

  Model provenance. Every mechanistic claim in the pathophysiology section is from mouse
  (evidence typed MODEL_ORGANISM) or from chicken inner ear and binding biochemistry
  (IN_VITRO). The human evidence establishes the gene, the inheritance and the clinical
  picture only. A 2025 mouse report proposing impaired mitophagy is not curated.


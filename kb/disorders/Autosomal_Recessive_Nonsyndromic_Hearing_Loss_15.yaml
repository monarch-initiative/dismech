    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Loss of function is an allele-class interpretation supported by truncating/splice alleles and
      models, not a demonstration that every human variant eliminates protein. The reported family
      genotypes here are homozygous.

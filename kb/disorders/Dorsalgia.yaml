- name: Intervertebral Disc Extracellular Matrix Degradation and Endplate Remodeling
  description: >-
    Structural defects or depletion of type IX collagen (COL9A1, COL9A2,
    COL9A3) and aggrecan (ACAN) destabilize the collagen-proteoglycan network
    of the intervertebral disc and cartilaginous vertebral endplate. Loss of
    matrix structural integrity suppresses extracellular matrix synthesis,
    accelerates proteoglycan and collagen catabolism, induces abnormal
    chondrocyte hypertrophy and endplate osteochondral remodeling, and results
    in annular fissures, disc tears, and loss of disc height.

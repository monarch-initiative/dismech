  evidence:
  - reference: PMID:27870580
    reference_title: "Clinical Characterization of Patients With Autosomal Dominant Short Stature due to Aggrecan Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aggrecan is a major proteoglycan of the cartilaginous intervertebral discs, and its degradation has been suggested to be an important pathogenic mechanism in intervertebral disc degenerative disease (21)."
    explanation: Confirms that aggrecan degradation is a central mechanism in human intervertebral disc degeneration and associated back pain.
  - reference: PMID:35126710
    reference_title: "Col9a2 gene deletion accelerates the degeneration of intervertebral discs."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results suggested that deletion of the Col9a2 gene led to osteochondral remodeling of cartilage EP and suppressed ECM synthesis, accelerating matrix degradation and chondrocyte hypertrophy in the IVD tissue."
    explanation: Demonstrates that type IX collagen loss drives cartilage endplate osteochondral remodeling, suppressed ECM synthesis, chondrocyte hypertrophy, and accelerated disc matrix degradation.
  - reference: PMID:18163498
    reference_title: "Early-onset degeneration of the intervertebral disc and vertebral end plate in mice deficient in type IX collagen."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Type IX collagen is an important component of the intervertebral disc extracellular matrix. Mutations in type IX collagen are associated with premature disc degeneration in mice and a predisposition to disc disorders in humans."
    explanation: Establishes the conserved role of type IX collagen in maintaining intervertebral disc and vertebral endplate integrity across mice and humans.
  - reference: PMID:19714629
    reference_title: "Decreased physical function and increased pain sensitivity in mice deficient for type IX collagen."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Intervertebral disc degeneration was also detected, with Col9a1(-/-) mice having an increased incidence of disc tears."
    explanation: Shows that type IX collagen deficiency directly causes structural annular tears and disc degeneration accompanied by increased mechanical pain sensitivity.
  downstream:
  - target: Intervertebral disk degeneration
    description: Extracellular matrix disassembly, aggrecan loss, and collagen IX defects directly produce structural intervertebral disc degeneration and disc tears.
  - target: Intradiscal Pro-Inflammatory Cytokine, NF-kappaB, and ROS Nociceptive Signaling
    description: Matrix breakdown products and mechanical instability within degenerating discs trigger local TNF-alpha, NF-kappaB, and ROS-mediated nociceptive signaling.
    evidence:

- name: Nerve Ingrowth and Neoinnervation of the Degenerating Intervertebral Disc
  description: >-
    Loss of the chondroitin-sulfate-rich aggrecan barrier, annular fissures,
    and cytokine-induced release of nerve growth factor (NGF) and brain-derived
    neurotrophic factor (BDNF) by resident disc cells, endothelial cells, and
    infiltrating leukocytes drive the ingrowth of dorsal root ganglion-derived
    nociceptive nerve fibers and accompanying microvessels into the normally
    aneural inner annulus fibrosus and nucleus pulposus, establishing the
    anatomical substrate for discogenic back pain.

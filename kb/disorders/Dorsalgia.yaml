    description: Newly ingrown DRG nociceptive fibers exposed to intradiscal NGF, BDNF, and inflammatory cytokines upregulate nociceptive neuropeptides (substance P, CGRP) and pain-associated cation channels (ASIC3, TRPV1).
    evidence:
    - reference: PMID:24166242
      reference_title: "Role of cytokines in intervertebral disc degeneration: pain and disc content."
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: "At this time, NP tissue as well as the infiltrating immune cells continue to release cytokines as well as neurogenic factors in particular NGF and BDNF. In DRG’s these neurotrophins induce expression of the pain associated cation channels in particular the acid sensing ion channel (ASIC)3 and the transient receptor potential cation channel, subfamily V, member 1 (Trpv1) 36–38."
      explanation: Links neurotrophin release in neoinnervated discs to induction of ASIC3 and TRPV1 nociceptive channels in dorsal root ganglion neurons.
  - target: Back pain

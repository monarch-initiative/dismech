  evidence:
  - reference: PMID:32170149
    reference_title: "Lumbar spinal stenosis and disc alterations affect the upper lumbar spine in adults with achondroplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The degenerative process of lumbar spinal stenosis leads to disc narrowing and bulging, infolding and thickening of the ligamentum flavum as well as facet osteoarthritis10–12. With advanced alterations, disc, ligamentum flavum, and facet joints protrude into the spinal canal. Increased stresses associated with disc degeneration and narrowing in turn induce in turn facet-joint and ligamentum-flavum degeneration. Thus degenerative disc changes may be a critical step in the cascade of events leading to lumbar spinal stenosis with its clinical manifestations."
    explanation: Demonstrates how disc narrowing and bulging induce facet osteoarthritis and ligamentum flavum thickening that collectively protrude into the spinal canal.
  downstream:
  - target: Spinal canal stenosis
    description: Combined protrusion of bulging discs, thickened ligamentum flavum, and osteoarthritic facet joints narrows the lumbar vertebral canal.
  - target: Nerve Root and Cauda Equina Compression with Ischemia and Axonal Transport Block
    description: Protrusion of degenerated discs, hypertrophied ligamentum flavum, and osteoarthritic facet joints into the spinal canal mechanically compresses lumbosacral nerve roots and the cauda equina.
    evidence:
    - reference: PMID:3188319
      reference_title: "Urodynamic evaluation of patients with spinal stenosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Compression of the spinal cord or nerve roots may lead to structural neuronal damage, neuronal ischemia or edema, and axonal transport block."
      explanation: Links mechanical spinal canal stenosis directly to nerve root and spinal cord compression, ischemia, edema, and axonal transport failure.

- name: Nerve Root and Cauda Equina Compression with Ischemia and Axonal Transport Block
  description: >-
    Mechanical impingement of lumbosacral nerve roots, the conus medullaris,
    or the cauda equina by herniated nucleus pulposus or stenotic canal
    structures compromises microvascular perfusion, producing intraneural
    ischemia, venous congestion, edema, structural demyelination/axonal
    injury, and blockade of anterograde and retrograde axonal transport. This
    neural injury manifests clinically as radicular sciatica, neurogenic
    claudication, lower limb sensorimotor deficits, and, in severe cauda
    equina compression, neurogenic bladder and bowel dysfunction.
  cell_types:

    explanation: Links progressive neural compression in the lumbar canal to the spectrum of neurogenic claudication, motor weakness, and autonomic sphincter dysfunction.
  downstream:
  - target: Spinal cord compression
    description: Severe canal narrowing or large disc extrusion directly compresses the distal spinal cord, conus medullaris, or cauda equina.
  - target: Lower limb pain
    description: Compression and ischemia of lumbosacral nerve roots cause radiating sciatic lower limb pain and neurogenic claudication.
  - target: Neuropathic pain
    description: Structural nerve root injury and periradicular sensitization generate dermatomal radicular neuropathic pain.
  - target: Lower limb muscle weakness
    description: Motor axon compression and axonal transport blockade in lumbosacral roots cause myotomal lower extremity paresis.
  - target: Hypoesthesia
    description: Sensory axon impingement in lumbosacral roots or the cauda equina causes dermatomal and perineal saddle hypoesthesia.
  - target: Gait disturbance

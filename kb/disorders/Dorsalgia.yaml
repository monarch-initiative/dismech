      snippet: "In the healthy state, nerve fiber ingrowth is prevented by the barrier function imparted by the high concentration of the chondroitin sulfate component of aggrecan and other matrix molecules which are inhibitory to nerve outgrowth85. Noteworthy, during degeneration an increase in keratan sulfate: chondroitin sulfate ratio and proteolytic cleavage of aggrecan mediated by cytokine dependent ADAMTS4/5 activity may thus enhance nerve invasion27,52."
      explanation: Explains how aggrecan degradation compromises the anti-neurogenic barrier of the intervertebral disc and permits nociceptive nerve fiber invasion.
  - target: Facet Joint Osteoarthritis
    description: Loss of intervertebral disc height and disc bulging redistribute mechanical stress to the posterior spinal facet joints, inducing facet joint osteoarthritis.
    evidence:
    - reference: PMID:32170149
      reference_title: "Lumbar spinal stenosis and disc alterations affect the upper lumbar spine in adults with achondroplasia."
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: "The degenerative process of lumbar spinal stenosis leads to disc narrowing and bulging, infolding and thickening of the ligamentum flavum as well as facet osteoarthritis10–12. With advanced alterations, disc, ligamentum flavum, and facet joints protrude into the spinal canal. Increased stresses associated with disc degeneration and narrowing in turn induce in turn facet-joint and ligamentum-flavum degeneration. Thus degenerative disc changes may be a critical step in the cascade of events leading to lumbar spinal stenosis with its clinical manifestations."
      explanation: Details the biomechanical cascade from disc degeneration and narrowing to facet joint osteoarthritis.

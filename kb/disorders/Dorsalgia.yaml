  - target: Nerve Ingrowth and Neoinnervation of the Degenerating Intervertebral Disc
    description: Proteolytic cleavage of chondroitin-sulfate-rich aggrecan and loss of axonal-repellent barrier molecules in degenerating discs permit nociceptive nerve fiber and microvessel ingrowth into the otherwise aneural inner disc.

      explanation: Details the biomechanical cascade from disc degeneration and narrowing to facet joint osteoarthritis, ligamentum flavum thickening, and spinal canal protrusion.

- name: Intradiscal Pro-Inflammatory Cytokine, NF-kappaB, and ROS Nociceptive Signaling
  description: >-
    Within degenerating intervertebral discs, resident cells and infiltrating
    immune cells upregulate tumor necrosis factor-alpha (TNF), activate the
    canonical NF-kappaB signaling cascade, generate elevated reactive oxygen
    species (ROS), and alter adrenoceptor and nociceptive neuropeptide
    expression. This pro-inflammatory microenvironment sensitizes sinuvertebral
    and dorsal root ganglion sensory neurons innervating the outer annulus
    fibrosus and vertebral endplate, generating axial discogenic low back pain.
  cell_types:

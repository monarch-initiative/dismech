    explanation: Confirms that aggrecan serves as a major structural proteoglycan of the intervertebral disc whose degradation drives disc degenerative disease.
  - reference: PMID:35126710
    reference_title: "Col9a2 gene deletion accelerates the degeneration of intervertebral discs."
    supports: SUPPORT

    posterior vertebral facet (zygapophyseal) joints, inducing degenerative
    facet joint osteoarthritis and osteophyte protrusion into the vertebral
    canal and lateral recesses.
  biological_processes:
  - preferred_term: response to mechanical stimulus
    modifier: DYSREGULATED
    term:

- name: Aberrant Spinal Mechanical Loading and Motion-Segment Stress
  description: >-
    Excessive compressive and shear forces across the thoracolumbar and lumbar
    spine—driven by local paraspinal muscle forces, spinal curvature, and
    repetitive hyperextension-to-flexion transitions under load—impose
    mechanical stress on the intervertebral disc and vertebral endplates,
    initiating degenerative disc remodeling and exacerbating axial low back
    pain.

name: Dorsalgia
creation_date: "2026-02-02T00:16:36Z"
description: >-
  Dorsalgia (back pain) is a common musculoskeletal and neurological syndrome
  characterized by pain localized to the dorsal aspect of the trunk, most
  frequently the lumbar spine, with or without radicular pain or neurogenic
  claudication in the lower extremities. Its etiology spans polygenic and rare
  monogenic susceptibility to intervertebral disc degeneration (involving
  proteoglycan sulfation and sulfate transport variants, aggrecan loss, and type IX
  collagen structural defects), aberrant mechanical loading, intradiscal
  pro-inflammatory cytokine and reactive oxygen species signaling, peripheral and
  central nociceptive sensitization, and secondary mechanical narrowing of the
  spinal canal or neural foramina that compresses lumbosacral nerve roots.
category: Complex
disease_term:
  preferred_term: Dorsalgia
synonyms:
- Back pain
- Low back pain
- Discogenic low back pain
- Lumbar disc disease
- Lumbago
classifications:
  harrisons_chapter:
  - classification_value: CARDINAL_MANIFESTATIONS
  - classification_value: NEUROLOGIC
parents:
- Musculoskeletal disorder
- Spinal disorder
has_subtypes:
- name: Discogenic Low Back Pain
  description: >-
    Axial low back pain arising directly from internal intervertebral disc
    degeneration, extracellular matrix breakdown, and intradiscal nociceptive
    and pro-inflammatory signaling without frank nerve root compression.
  evidence:
  - reference: PMID:39374801
    reference_title: "Human molecular mechanisms of discogenic low back pain: A scoping review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Current evidence converges to TNF-α, NF-κB signaling, and ROS-induced pro-inflammation."
    explanation: Scoping review of human discogenic low back pain identifies intradiscal pro-inflammatory signaling as the core driver of this clinical subtype.
- name: Lumbar Radiculopathy and Sciatica
  description: >-
    Back pain accompanied by radiating lower-extremity pain, paresthesia, or
    motor weakness caused by intervertebral disc herniation or foraminal
    narrowing that mechanically compresses and inflames lumbosacral nerve roots.
  evidence:
  - reference: PMID:36426378
    reference_title: "Presentation, management, and outcomes of cauda equina syndrome up to one year after surgery, using clinician and participant reporting: A multi-centre prospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most frequently occurring pre-operative symptoms were back pain (96%, 598/621) and sciatica (93%, 578/621)."
    explanation: Demonstrates the close clinical association between axial back pain and radicular sciatica in compressive lumbar disc pathology.
- name: Degenerative Lumbar Spinal Stenosis
  description: >-
    Chronic dorsalgia with neurogenic claudication resulting from combined
    intervertebral disc bulging, facet joint osteoarthritis, and ligamentum
    flavum thickening that narrow the central lumbar spinal canal.
  evidence:
  - reference: PMID:32170149
    reference_title: "Lumbar spinal stenosis and disc alterations affect the upper lumbar spine in adults with achondroplasia."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical expression of lumbar spinal stenosis ranges from low back pain with neurogenic claudication to paraplegia with bladder and bowel dysfunction7."
    explanation: Characterizes the clinical subtype of lumbar spinal stenosis presenting with low back pain and neurogenic claudication.
prevalence:
- population: General population (clinical practice diagnoses of dorsalgia)
  measure_type: PERIOD_PREVALENCE
  prevalence_class: COMMON
  notes: >-
    Multi-biobank genome-wide association meta-analysis accrued 119,100
    clinical practice cases of dorsalgia and 909,847 controls (alongside
    58,854 cases of intervertebral disc disorder and 922,958 controls).
  evidence:
  - reference: PMID:35110524
    reference_title: "Rare SLC13A1 variants associate with intervertebral disc disorder highlighting role of sulfate in disc pathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Back pain is a common and debilitating disorder with largely unknown underlying biology."
    explanation: Establishes back pain (dorsalgia) as a common population-level disorder.
  - reference: PMID:35110524
    reference_title: "Rare SLC13A1 variants associate with intervertebral disc disorder highlighting role of sulfate in disc pathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report a genome-wide association study of back pain using diagnoses assigned in clinical practice; dorsalgia (119,100 cases, 909,847 controls) and intervertebral disc disorder (IDD) (58,854 cases, 922,958 controls)."
    explanation: Documents the large clinical case burden of dorsalgia and intervertebral disc disorder across population biobank cohorts.
- subtype: Lumbar Radiculopathy and Sciatica

- name: Secondary Facet Osteoarthritis, Ligamentum Flavum Hypertrophy, and Spinal Canal Stenosis
  description: >-
    Intervertebral disc narrowing and bulging increase mechanical load on the
    posterior vertebral elements, triggering facet joint osteoarthritis and
    infolding and hypertrophy of the ligamentum flavum. Together with extruded
    or bulging disc material, these hypertrophic structures protrude into the
    vertebral canal and lateral recesses, causing progressive lumbar spinal
    canal stenosis.
  biological_processes:

      explanation: Connects intervertebral disc degeneration to intradiscal TNF-alpha, NF-kappaB, and ROS pro-inflammatory signaling in human discogenic low back pain.
  - target: Secondary Facet Osteoarthritis, Ligamentum Flavum Hypertrophy, and Spinal Canal Stenosis
    description: Loss of intervertebral disc height and disc bulging redistribute mechanical stress to the posterior spinal elements, inducing facet joint osteoarthritis, ligamentum flavum thickening, and spinal canal narrowing.
    evidence:
    - reference: PMID:32170149
      reference_title: "Lumbar spinal stenosis and disc alterations affect the upper lumbar spine in adults with achondroplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL

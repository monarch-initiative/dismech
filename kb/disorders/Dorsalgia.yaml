- name: Intraneural Ischemia, Edema, and Axonal Conduction Impairment
  description: >-
    Sustained mechanical compression of lumbosacral nerve roots and the cauda
    equina occludes intrinsic arterioles, capillaries, and venules, producing
    microvascular ischemia, venous congestion, intraneural edema, and impaired
    axonal transport and conduction. This neural injury manifests clinically as
    radicular sciatica, neurogenic claudication, lower limb sensorimotor
    deficits, and gait impairment, while ongoing nerve root afferent barrage
    also maintains central nociceptive sensitization.
  cell_types:

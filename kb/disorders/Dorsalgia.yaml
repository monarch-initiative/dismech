- name: Intradiscal Pro-Inflammatory Cytokine, NF-kappaB, and ROS Signaling
  description: >-
    Within degenerating intervertebral discs, resident cells and infiltrating
    immune cells upregulate tumor necrosis factor-alpha (TNF), activate the
    canonical NF-kappaB signaling cascade, and generate elevated reactive oxygen
    species (ROS), establishing a chronic pro-inflammatory intradiscal
    microenvironment.

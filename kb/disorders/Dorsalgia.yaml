progression:
- phase: Onset
  age_range: Adolescence to adulthood
  notes: >-
    Symptomatic dorsalgia and intervertebral disc degeneration most commonly
    manifest in adulthood, though genetic predisposition (such as ACAN or
    collagen IX mutations) can precipitate premature disc disease beginning in
    childhood or young adulthood.
  evidence:
  - reference: PMID:27870580
    reference_title: "Clinical Characterization of Patients With Autosomal Dominant Short Stature due to Aggrecan Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Back pain was also a common complaint in affected adult individuals of 11 families (families 1, 5 to 9, 12, 15, 16, 19, and 20), who reported back problems with confirmed disc disease or symptoms suspicious for intervertebral disc disease (3 children and 14 adults)."
    explanation: Shows that disc-related back pain predominantly affects adults but can present in children when driven by aggrecan mutations.
pathophysiology:
- name: Impaired Sulfate Transport and Proteoglycan Sulfation in Intervertebral Discs
  description: >-
    Reduced systemic sulfate reabsorption via loss-of-function variants in the
    renal sodium-sulfate cotransporter SLC13A1 or altered expression of the
    disc-expressed enzyme carbohydrate sulfotransferase 3 (CHST3) impairs the
    sulfation of glycosaminoglycan side chains on proteoglycans within the
    nucleus pulposus and annulus fibrosus. Undesulfated proteoglycans lose
    their fixed negative charge and osmotic water-retaining capacity,
    predisposing the intervertebral disc to dehydration and structural failure.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: sulfation
    modifier: DECREASED
    term:
      id: GO:0051923
      label: sulfation
  - preferred_term: proteoglycan biosynthetic process
    modifier: DYSREGULATED
    term:
      id: GO:0030166
      label: proteoglycan biosynthetic process
  locations:
  - preferred_term: intervertebral disk
    term:
      id: UBERON:0001066
      label: intervertebral disk
  genes:
  - preferred_term: CHST3
    term:
      id: hgnc:1971
      label: CHST3
  evidence:
  - reference: PMID:35110524
    reference_title: "Rare SLC13A1 variants associate with intervertebral disc disorder highlighting role of sulfate in disc pathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most significant association (ORIDD = 0.92, P = 1.6 × 10-39; ORdorsalgia = 0.92, P = 7.2 × 10-15) is with a 3'UTR variant (rs1871452-T) in CHST3, encoding a sulfotransferase enzyme expressed in intervertebral discs."
    explanation: Demonstrates that genetic variation in CHST3 impairs proteoglycan sulfation in the intervertebral disc and strongly associates with intervertebral disc disorder and dorsalgia.
  - reference: PMID:35110524
    reference_title: "Rare SLC13A1 variants associate with intervertebral disc disorder highlighting role of sulfate in disc pathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The largest effects on IDD are conferred by rare (MAF = 0.07 - 0.32%) loss-of-function (LoF) variants in SLC13A1, encoding a sodium-sulfate co-transporter (LoF burden OR = 1.44, P = 3.1 × 10-11); variants that also associate with reduced serum sulfate."
    explanation: Identifies rare loss-of-function variants in the sulfate transporter SLC13A1 as a high-impact driver of intervertebral disc pathology and back pain.
  downstream:
  - target: Intervertebral Disc Extracellular Matrix Degradation and Endplate Remodeling
    description: Deficient proteoglycan sulfation reduces disc osmotic pressure and accelerates extracellular matrix breakdown.
    evidence:
    - reference: PMID:35110524
      reference_title: "Rare SLC13A1 variants associate with intervertebral disc disorder highlighting role of sulfate in disc pathology."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Genes implicated by this study are involved in cartilage and bone biology, as well as neurological and inflammatory processes."
      explanation: Links genetic perturbations in sulfate and proteoglycan metabolism to downstream cartilage/disc matrix pathology and neurological/inflammatory pain pathways.

- name: Intervertebral Disc Extracellular Matrix Degradation and Endplate Remodeling
  description: >-
    Structural defects or depletion of type IX collagen (COL9A1, COL9A2,
    COL9A3) and aggrecan (ACAN) destabilize the collagen-proteoglycan network
    of the intervertebral disc and cartilaginous vertebral endplate. Loss of
    matrix integrity suppresses extracellular matrix synthesis, upregulates
    catabolic matrix metalloproteinase (MMP13) activity, induces abnormal
    chondrocyte hypertrophy and endplate osteochondral remodeling, and results
    in annular fissures, disc tears, and loss of disc height.
  cell_types:

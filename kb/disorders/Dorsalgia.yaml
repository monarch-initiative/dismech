    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The onset of discogenic pain is characterized by nerve fiber ingrowth into an otherwise aneural tissue33–35. The interplay between inflammatory cytokines and neurotrophins, produced by disc cells and infiltrating immunocytes as well as neurotrophin receptors and their modulators may guide this process."
    explanation: Establishes nociceptive nerve fiber ingrowth into the otherwise aneural intervertebral disc, guided by inflammatory cytokines and neurotrophins, as a defining mechanism of discogenic back pain.

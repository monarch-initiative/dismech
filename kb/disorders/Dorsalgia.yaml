      explanation: Connects impaired sulfate homeostasis from SLC13A1 loss-of-function directly to painful intervertebral disc cartilage degeneration and back pain.
    - reference: PMID:35110524
      reference_title: "Rare SLC13A1 variants associate with intervertebral disc disorder highlighting role of sulfate in disc pathology."
      supports: SUPPORT

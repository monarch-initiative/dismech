has_subtypes:
- name: Discogenic Low Back Pain
  description: >-
    Axial low back pain arising directly from internal intervertebral disc
    degeneration, extracellular matrix breakdown, and intradiscal nociceptive
    and pro-inflammatory signaling without frank nerve root compression.
  evidence:
  - reference: PMID:39374801
    reference_title: "Human molecular mechanisms of discogenic low back pain: A scoping review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Current evidence converges to TNF-α, NF-κB signaling, and ROS-induced pro-inflammation."
    explanation: Scoping review of human discogenic low back pain identifies intradiscal pro-inflammatory signaling as the core driver of this clinical subtype.
- name: Lumbar Radiculopathy and Sciatica
  description: >-
    Back pain accompanied by radiating lower-extremity pain, paresthesia, or
    motor weakness caused by intervertebral disc herniation or foraminal
    narrowing that mechanically compresses and inflames lumbosacral nerve roots.
  evidence:
  - reference: PMID:36426378
    reference_title: "Presentation, management, and outcomes of cauda equina syndrome up to one year after surgery, using clinician and participant reporting: A multi-centre prospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most frequently occurring pre-operative symptoms were back pain (96%, 598/621) and sciatica (93%, 578/621)."
    explanation: Demonstrates the close clinical association between axial back pain and radicular sciatica in compressive lumbar disc pathology.
- name: Degenerative Lumbar Spinal Stenosis
  description: >-
    Chronic dorsalgia with neurogenic claudication resulting from combined
    intervertebral disc bulging, facet joint osteoarthritis, and ligamentum
    flavum thickening that narrow the central lumbar spinal canal.
  evidence:
  - reference: PMID:32170149
    reference_title: "Lumbar spinal stenosis and disc alterations affect the upper lumbar spine in adults with achondroplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical expression of lumbar spinal stenosis ranges from low back pain with neurogenic claudication to paraplegia with bladder and bowel dysfunction7."
    explanation: Characterizes the clinical subtype of lumbar spinal stenosis presenting with low back pain and neurogenic claudication.

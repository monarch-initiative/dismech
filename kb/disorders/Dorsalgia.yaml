    snippet: "The most significant association (ORIDD = 0.92, P = 1.6 × 10-39; ORdorsalgia = 0.92, P = 7.2 × 10-15) is with a 3'UTR variant (rs1871452-T) in CHST3, encoding a sulfotransferase enzyme expressed in intervertebral discs."
    explanation: Reports a strong genome-wide association between a 3'UTR variant (rs1871452-T) in the disc-expressed sulfotransferase gene CHST3 and both intervertebral disc disorder and dorsalgia.
  - reference: PMID:35110524
    reference_title: "Rare SLC13A1 variants associate with intervertebral disc disorder highlighting role of sulfate in disc pathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The largest effects on IDD are conferred by rare (MAF = 0.07 - 0.32%) loss-of-function (LoF) variants in SLC13A1, encoding a sodium-sulfate co-transporter (LoF burden OR = 1.44, P = 3.1 × 10-11); variants that also associate with reduced serum sulfate."
    explanation: Identifies rare loss-of-function variants in the sulfate transporter SLC13A1 as a high-impact driver of intervertebral disc pathology and back pain.
  downstream:

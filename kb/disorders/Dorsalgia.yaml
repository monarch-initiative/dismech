name: Dorsalgia
creation_date: "2026-04-04T00:00:00Z"
description: >-
  Dorsalgia (back pain) is a common musculoskeletal and neurological syndrome
  characterized by pain localized to the dorsal aspect of the trunk, most
  frequently the lumbar spine, with or without radicular pain or neurogenic
  claudication in the lower extremities. Its etiology spans polygenic and rare
  monogenic susceptibility to intervertebral disc degeneration (involving impaired
  proteoglycan sulfation, aggrecan loss, and type IX collagen structural defects),
  pro-inflammatory cytokine and reactive oxygen species signaling within the disc,
  and secondary mechanical narrowing of the spinal canal or neural foramina that
  compresses spinal nerve roots or the cauda equina.

    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical expression of lumbar spinal stenosis ranges from low back pain with neurogenic claudication to paraplegia with bladder and bowel dysfunction7."
    explanation: Highlights neurogenic claudication and severe walking impairment in lumbar spinal stenosis.
  - reference: PMID:19714629
    reference_title: "Decreased physical function and increased pain sensitivity in mice deficient for type IX collagen."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Col9a1(-/-) mice had compensatory gait changes, increased mechanical sensitivity, and impaired physical ability."
    explanation: Demonstrates compensatory gait disturbances secondary to intervertebral disc degeneration and mechanical pain sensitivity.
genetic:
- name: CHST3
  association: Risk Variant
  inheritance:
  - name: Polygenic
  features: >-
    Common 3'UTR regulatory variant (rs1871452-T) in carbohydrate
    sulfotransferase 3 (OR_IDD = 0.92, P = 1.6 x 10^-39; OR_dorsalgia = 0.92,
    P = 7.2 x 10^-15), encoding a sulfotransferase enzyme expressed in
    intervertebral discs.
  gene_term:
    preferred_term: CHST3
    term:
      id: hgnc:1971
      label: CHST3
  evidence:
  - reference: PMID:35110524
    reference_title: "Rare SLC13A1 variants associate with intervertebral disc disorder highlighting role of sulfate in disc pathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most significant association (ORIDD = 0.92, P = 1.6 × 10-39; ORdorsalgia = 0.92, P = 7.2 × 10-15) is with a 3'UTR variant (rs1871452-T) in CHST3, encoding a sulfotransferase enzyme expressed in intervertebral discs."
    explanation: Identifies CHST3 as the strongest genome-wide locus associated with intervertebral disc disorder and dorsalgia.

- name: SLC13A1
  association: Loss-of-Function Risk Variant
  inheritance:
  - name: Polygenic
  features: >-
    Rare loss-of-function variants (MAF = 0.07-0.32%) in the renal
    sodium-sulfate cotransporter SLC13A1 confer a high-impact increase in
    intervertebral disc disorder risk (LoF burden OR = 1.44, P = 3.1 x 10^-11)
    and associate with reduced serum sulfate and dorsalgia.
  gene_term:
    preferred_term: SLC13A1
    term:
      id: hgnc:10916
      label: SLC13A1
  evidence:
  - reference: PMID:35110524
    reference_title: "Rare SLC13A1 variants associate with intervertebral disc disorder highlighting role of sulfate in disc pathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The largest effects on IDD are conferred by rare (MAF = 0.07 - 0.32%) loss-of-function (LoF) variants in SLC13A1, encoding a sodium-sulfate co-transporter (LoF burden OR = 1.44, P = 3.1 × 10-11); variants that also associate with reduced serum sulfate."
    explanation: Demonstrates that rare loss-of-function variants in SLC13A1 significantly increase risk for intervertebral disc disorder and back pain.

- name: COL9A2
  association: Susceptibility Mutation (Trp2 allele)
  inheritance:
  - name: Autosomal Dominant
  features: >-
    Tryptophan substitution allele (Trp2) in the alpha-2 chain of type IX
    collagen associated with dominantly inherited lumbar disc disease and
    accelerated intervertebral disc and endplate degeneration.
  gene_term:
    preferred_term: COL9A2
    term:
      id: hgnc:2218
      label: COL9A2
  evidence:
  - reference: PMID:11308397
    reference_title: "Identification of a novel common genetic risk factor for lumbar disk disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A tryptophan (Trp) allele (Trp2) was recently discovered in the COL9A2 gene that is associated with dominantly inherited LDD"
    explanation: Documents the autosomal dominant association between the COL9A2 Trp2 allele and lumbar disc disease.

- name: COL9A3
  association: Risk Factor (Arg103Trp / Trp3 allele)
  inheritance:
  - name: Polygenic
  features: >-
    Arginine-to-tryptophan substitution at residue 103 (Trp3 allele) in the
    alpha-3 chain of type IX collagen increases the risk of lumbar disc
    disease approximately 3-fold.
  gene_term:
    preferred_term: COL9A3
    term:
      id: hgnc:2219
      label: COL9A3
  evidence:
  - reference: PMID:11308397
    reference_title: "Identification of a novel common genetic risk factor for lumbar disk disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutation analysis of all 3 collagen IX genes resulted in identification of an Arg103-->Trp (arginine-->tryptophan) substitution in the alpha3 chain (Trp3 allele)."
    explanation: Identifies the COL9A3 Arg103Trp (Trp3) variant in patients with lumbar disc disease.
  - reference: PMID:11308397
    reference_title: "Identification of a novel common genetic risk factor for lumbar disk disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Presence of at least 1 Trp3 allele increases risk of LDD about 3-fold."
    explanation: Quantifies the 3-fold increased risk of lumbar disc disease conferred by the COL9A3 Trp3 allele.

- name: ACAN
  association: Pathogenic Mutation
  inheritance:
  - name: Autosomal Dominant
  features: >-
    Heterozygous mutations in aggrecan cause early-onset intervertebral disc
    degeneration and chronic back pain alongside autosomal dominant short
    stature and osteochondritis dissecans.
  gene_term:
    preferred_term: ACAN
    term:
      id: hgnc:319
      label: ACAN
  evidence:
  - reference: PMID:27870580
    reference_title: "Clinical Characterization of Patients With Autosomal Dominant Short Stature due to Aggrecan Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Back pain was also a common complaint in affected adult individuals of 11 families (families 1, 5 to 9, 12, 15, 16, 19, and 20), who reported back problems with confirmed disc disease or symptoms suspicious for intervertebral disc disease (3 children and 14 adults)."
    explanation: Establishes that autosomal dominant ACAN mutations frequently manifest with confirmed intervertebral disc disease and back pain.
environmental:
- name: Repetitive lumbar hyperextension and sudden trunk flexion during strenuous athletic loading
  presence: Mechanical symptom aggravator in athletes
  notes: >-
    Rapid transitions from lumbar hyperextension to trunk flexion during
    strenuous athletic maneuvers (such as the surfing take-off pop-up) impose
    mechanical stress on the lumbar spine that can provoke or aggravate low
    back pain.
  exposure_term:
    preferred_term: exposure to strenuous exercise
    term:
      id: ECTO:6000031
      label: exposure to strenuous exercise
  influences_mechanisms:
  - target: Aberrant Spinal Mechanical Loading and Motion-Segment Stress
  effect: >-
    Increases mechanical stress in the lumbar spine during strenuous athletic
    activity, provoking and aggravating low back pain.
  evidence:
  - reference: PMID:21509154
    reference_title: "Alternative pop-up for surfers with low back pain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A common problem in surfers is back pain during the "take-off," specifically the "pop-up."
    explanation: Identifies repetitive athletic loading during the surfing take-off pop-up maneuver as a trigger for low back pain.
  - reference: PMID:21509154
    reference_title: "Alternative pop-up for surfers with low back pain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This alternative is a suggested technique to alleviate the stress in the lumbar spine during surfing.
    explanation: Confirms that mechanical stress in the lumbar spine during repetitive athletic maneuvers sustains low back pain.
diagnosis:
- name: Lumbar Magnetic Resonance Imaging (MRI)
  presence: Gold standard neuroimaging modality for neural space compromise, disc herniation, and cauda equina compression
  notes: >-
    Directly visualizes intervertebral disc degeneration, herniation, spinal
    canal stenosis, obliteration of cerebrospinal fluid space, and compression
    of lumbosacral nerve roots or the cauda equina. Urgent MRI is recommended
    whenever red-flag symptoms suggest cauda equina syndrome.
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  results: >-
    Identifies intervertebral disc narrowing, bulging or herniation, facet
    hypertrophy, ligamentum flavum infolding, and neural space compromise with
    loss of visible perithecal cerebrospinal fluid.
  evidence:
  - reference: PMID:23230403
    reference_title: "Does patient history and physical examination predict MRI proven cauda equina syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lumbar MRI remains the preferred diagnostic modality to identify neural space compromise."
    explanation: Establishes lumbar MRI as the preferred diagnostic modality for evaluating neural space compromise in patients with back pain and radicular/autonomic symptoms.
  - reference: PMID:38496349
    reference_title: "Cauda equina, conus medullaris and syndromes mimicking sciatic pain: WFNS spine committee recommendations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We advocate for the use of the Lavy et al classification system to categorize different types of CES, and recommend urgent MRI in all patients with suspected CES (CESS), considering the low sensitivity of clinical examination in excluding CES."
    explanation: Guideline recommendation confirming urgent MRI as mandatory when dorsalgia is accompanied by suspected cauda equina compression.

- name: Spine Computed Tomography (CT)
  presence: Complementary cross-sectional imaging for bony canal and disc pathology
  notes: >-
    Used alongside clinical evaluation and MRI to assess bony vertebral body,
    facet joint, and intervertebral disc pathology in lumbar disc disease and
    spinal stenosis.
  diagnosis_term:
    preferred_term: Computed Tomography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  evidence:
  - reference: PMID:11308397
    reference_title: "Identification of a novel common genetic risk factor for lumbar disk disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 171 individuals with LDD (evaluated clinically and by magnetic resonance imaging or computed tomography)"
    explanation: Documents the use of computed tomography and MRI in the clinical diagnosis of lumbar disc disease.

- name: Focused Neurological and Physical Examination
  presence: Essential baseline clinical assessment for radiculopathy and red-flag signs
  notes: >-
    Assesses lower extremity motor strength, dermatomal sensation, perineal
    saddle sensation, and anal sphincter tone to screen for nerve root
    impingement or cauda equina syndrome, though clinical signs alone have
    limited specificity without confirmatory MRI.
  diagnosis_term:
    preferred_term: Neurologic Examination
    term:
      id: NCIT:C81313
      label: Neurologic Examination
  evidence:
  - reference: PMID:23230403
    reference_title: "Does patient history and physical examination predict MRI proven cauda equina syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Symptoms included back/low back pain, bilateral sciatica, bladder retention, bladder incontinence, frequent urination, decreased urinary sensation, and bowel incontinence; signs included saddle numbness and reduced anal tone."
    explanation: Details the key history and physical examination findings evaluated in patients with severe dorsalgia and suspected neural compression.
treatments:
- name: Nonsteroidal Anti-Inflammatory Drug (NSAID) Pharmacotherapy
  description: >-
    First-line pharmacologic therapy recommended by clinical practice guidelines
    for acute, subacute, and chronic low back pain when pharmacologic treatment
    is desired or after inadequate response to nonpharmacologic therapy,
    attenuating inflammatory and nociceptive signaling.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Nonsteroidal Antiinflammatory Drug
      term:
        id: NCIT:C257
        label: Nonsteroidal Antiinflammatory Drug
  target_mechanisms:
  - target: Intradiscal Pro-Inflammatory Cytokine, NF-kappaB, and ROS Signaling
  - target: Intradiscal Nociceptive Neuropeptide Signaling and Primary Afferent Sensitization
  evidence:
  - reference: PMID:28192789
    reference_title: "Noninvasive Treatments for Acute, Subacute, and Chronic Low Back Pain: A Clinical Practice Guideline From the American College of Physicians."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If pharmacologic treatment is desired, clinicians and patients should select nonsteroidal anti-inflammatory drugs or skeletal muscle relaxants (moderate-quality evidence)."
    explanation: American College of Physicians clinical practice guideline strongly recommending NSAIDs as first-line pharmacotherapy for acute and subacute low back pain.
  - reference: PMID:28192789
    reference_title: "Noninvasive Treatments for Acute, Subacute, and Chronic Low Back Pain: A Clinical Practice Guideline From the American College of Physicians."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In patients with chronic low back pain who have had an inadequate response to nonpharmacologic therapy, clinicians and patients should consider pharmacologic treatment with nonsteroidal anti-inflammatory drugs as first-line therapy, or tramadol or duloxetine as second-line therapy."
    explanation: Recommends NSAIDs as first-line pharmacologic therapy and duloxetine or tramadol as second-line therapy in chronic low back pain.

- name: Exercise Therapy, Motor Control Retraining, and Multidisciplinary Rehabilitation
  description: >-
    First-line nonpharmacologic management for chronic low back pain comprising
    structured exercise therapy, motor control exercise, multidisciplinary
    rehabilitation, and biomechanical technique modification to alleviate
    mechanical lumbar spine stress and reduce central pain hypersensitivity.
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_mechanisms:
  - target: Aberrant Spinal Mechanical Loading and Motion-Segment Stress
  - target: Peripheral and Central Nociceptive Sensitization in Chronic Back Pain
  evidence:
  - reference: PMID:28192789
    reference_title: "Noninvasive Treatments for Acute, Subacute, and Chronic Low Back Pain: A Clinical Practice Guideline From the American College of Physicians."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For patients with chronic low back pain, clinicians and patients should initially select nonpharmacologic treatment with exercise, multidisciplinary rehabilitation, acupuncture, mindfulness-based stress reduction (moderate-quality evidence), tai chi, yoga, motor control exercise, progressive relaxation, electromyography biofeedback, low-level laser therapy, operant therapy, cognitive behavioral therapy, or spinal manipulation (low-quality evidence)."
    explanation: Clinical practice guideline strongly recommending exercise, motor control exercise, and multidisciplinary rehabilitation as initial nonpharmacologic therapy for chronic low back pain.
  - reference: PMID:21509154
    reference_title: "Alternative pop-up for surfers with low back pain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This alternative is a suggested technique to alleviate the stress in the lumbar spine during surfing."
    explanation: Illustrates biomechanical movement modification to reduce lumbar spine stress in athletes with low back pain.

- name: Urgent Surgical Decompression (Laminectomy and Discectomy)
  description: >-
    Open or microscopic surgical decompression via laminectomy and discectomy
    to relieve mechanical impingement of lumbosacral nerve roots or the cauda
    equina. In cauda equina syndrome secondary to lumbar disc herniation,
    decompression within 48 hours of symptom onset significantly improves
    recovery of sensory, motor, urinary, and rectal function.
  treatment_term:
    preferred_term: Spinal Cord Decompression
    term:
      id: NCIT:C124141
      label: Spinal Cord Decompression
  target_mechanisms:
  - target: Spinal Nerve Root and Cauda Equina Compression
  - target: Facet Joint Osteoarthritis
  - target: Ligamentum Flavum Hypertrophy
  evidence:
  - reference: PMID:10851100
    reference_title: "Cauda equina syndrome secondary to lumbar disc herniation: a meta-analysis of surgical outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significant differences, however, were found in resolution of sensory and motor deficits as well as urinary and rectal function in patients treated within 48 hours compared with those treated more than 48 hours after onset of symptoms."
    explanation: Meta-analysis demonstrating significantly superior recovery of sensorimotor and sphincter function when surgical decompression is performed within 48 hours.
  - reference: PMID:38496349
    reference_title: "Cauda equina, conus medullaris and syndromes mimicking sciatic pain: WFNS spine committee recommendations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surgical decompression for CES and CMS is recommended within 48 h, preferably within less than 24 h."
    explanation: International clinical guideline recommending surgical decompression within 48 hours for compressive cauda equina syndrome.
  - reference: PMID:36426378
    reference_title: "Presentation, management, and outcomes of cauda equina syndrome up to one year after surgery, using clinician and participant reporting: A multi-centre prospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bilateral muscle strip, laminectomy, and discectomy were also more frequent when CSF was not visible on MRI"
    explanation: Documents laminectomy and discectomy as the standard decompressive procedures for severe lumbar canal occlusion.

- name: Full-Endoscopic Lumbar Discectomy
  description: >-
    Minimally invasive endoscopic removal of herniated lumbar disc fragments
    to achieve targeted neural decompression while minimizing paraspinal muscle
    trauma, hospital stay, and postoperative recovery time.
  treatment_term:
    preferred_term: Therapeutic Endoscopic Procedure
    term:
      id: NCIT:C64958
      label: Therapeutic Endoscopic Procedure
  target_mechanisms:
  - target: Spinal Nerve Root and Cauda Equina Compression
  evidence:
  - reference: PMID:37634669
    reference_title: "Development and Validation of a Nomogram to Predict the Risk of Recurrent Lower Extremity Radiating Pain Within 1 Week Following Full-Endoscopic Lumbar Discectomy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study aimed to identify risk factors for LE radiating pain after decompression with full-endoscopic lumbar discectomy"
    explanation: Documents the clinical use of full-endoscopic lumbar discectomy for surgical decompression of lumbar disc herniation with lower extremity radiating pain.
animal_models:
- species: Mus musculus
  genotype: Col9a2-/- (homozygous Col9a2 knockout)
  background: C57BL/6
  description: >-
    Mice lacking the alpha-2 chain of type IX collagen exhibit osteochondral
    remodeling of the cartilaginous vertebral endplate, suppressed
    extracellular matrix synthesis, chondrocyte hypertrophy, and accelerated
    intervertebral disc degeneration.
  evidence:
  - reference: PMID:35126710
    reference_title: "Col9a2 gene deletion accelerates the degeneration of intervertebral discs."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results suggested that deletion of the Col9a2 gene led to osteochondral remodeling of cartilage EP and suppressed ECM synthesis, accelerating matrix degradation and chondrocyte hypertrophy in the IVD tissue."
    explanation: Characterizes the Col9a2 knockout mouse as an experimental model of accelerated intervertebral disc and endplate degeneration.

- species: Mus musculus
  genotype: Col9a1-/- (homozygous Col9a1 knockout)
  description: >-
    Mice deficient in the alpha-1 chain of type IX collagen develop premature
    intervertebral disc degeneration with an increased incidence of annular
    disc tears, accompanied by heightened mechanical pain sensitivity,
    compensatory gait alterations, and impaired physical function.
  evidence:
  - reference: PMID:18163498
    reference_title: "Early-onset degeneration of the intervertebral disc and vertebral end plate in mice deficient in type IX collagen."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Type IX collagen is an important component of the intervertebral disc extracellular matrix. Mutations in type IX collagen are associated with premature disc degeneration in mice and a predisposition to disc disorders in humans."
    explanation: Establishes premature intervertebral disc and vertebral endplate degeneration in type IX collagen-deficient mice.
  - reference: PMID:19714629
    reference_title: "Decreased physical function and increased pain sensitivity in mice deficient for type IX collagen."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Col9a1(-/-) mice had compensatory gait changes, increased mechanical sensitivity, and impaired physical ability."
    explanation: Demonstrates behavioral dorsalgia equivalents—mechanical hyperalgesia, gait changes, and physical impairment—in Col9a1-/- mice.
  - reference: PMID:19714629
    reference_title: "Decreased physical function and increased pain sensitivity in mice deficient for type IX collagen."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Intervertebral disc degeneration was also detected, with Col9a1(-/-) mice having an increased incidence of disc tears."
    explanation: Links the behavioral pain phenotype in Col9a1-/- mice directly to histological intervertebral disc degeneration and disc tears.
differential_diagnoses:
- name: Deep Gluteal Syndrome and Piriformis Syndrome
  description: >-
    Non-discogenic entrapment of the sciatic nerve within the deep gluteal
    space (most commonly by the piriformis muscle) that mimics lumbosacral
    radiculopathy and sciatic pain without intraspinal nerve root compression.
  distinguishing_features:
  - Absence of causative nerve root compression on lumbar spine MRI
  - Buttock tenderness and sciatic pain reproduced by hip flexion, adduction, and internal rotation maneuvers
  evidence:
  - reference: PMID:38496349
    reference_title: "Cauda equina, conus medullaris and syndromes mimicking sciatic pain: WFNS spine committee recommendations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The treating physician should be cognizant of a variety of other pathologies that may mimic sciatica, including piriformis syndrome, and how to manage these."
    explanation: Identifies piriformis syndrome / deep gluteal syndrome as a major extraspinal mimic of discogenic sciatica.

- name: Axial Spondyloarthritis / Ankylosing Spondylitis
  description: >-
    Chronic immune-mediated inflammatory arthritis of the sacroiliac joints,
    spine, and entheses presenting with insidious inflammatory back pain.
  distinguishing_features:
  - Inflammatory back pain with morning stiffness that improves with exercise rather than rest
  - Active sacroiliac joint bone marrow edema on MRI or structural sacroiliitis on radiography
  disease_term:
    preferred_term: ankylosing spondylitis
    term:
      id: MONDO:0005306
      label: ankylosing spondylitis
  evidence:
  - reference: PMID:33105312
    reference_title: "Clinical Manifestations and Diagnosis of Axial Spondyloarthritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BACKGROUND: Axial spondyloarthritis (axSpA) is a chronic, rheumatic disease characterized by inflammation of the sacroiliac joint, spine, and entheses."
    explanation: Establishes axial spondyloarthritis as a primary inflammatory rheumatic differential diagnosis for chronic spinal and sacroiliac pain.
  - reference: PMID:38758383
    reference_title: "Diagnosis, monitoring, and management of axial spondyloarthritis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI can be beneficial when there is no visible structural damage on X-ray as it can help unravel bone marrow edema (BME) as a sign of ongoing inflammation."
    explanation: Identifies sacroiliac/spinal bone marrow edema on MRI as a distinguishing diagnostic feature of axial spondyloarthritis versus mechanical dorsalgia.

- name: Tuberculous Spondylitis (Pott Disease)
  description: >-
    Granulomatous vertebral osteomyelitis and spondylodiscitis caused by
    Mycobacterium tuberculosis that presents with progressive lumbar or
    thoracic back pain and risks vertebral collapse, residual spinal
    deformity, and neurological deficits if diagnosis is delayed.
  distinguishing_features:
  - Subacute-to-chronic lumbar pain unresponsive to routine analgesics, often accompanied by constitutional symptoms or epidemiological exposure
  - Contiguous vertebral body destruction, spondylodiscitis, and paraspinal abscess on spinal imaging with microbiological/histological confirmation of M. tuberculosis
  disease_term:
    preferred_term: tuberculosis, spinal
    term:
      id: MONDO:0043836
      label: tuberculosis, spinal
  evidence:
  - reference: PMID:33393654
    reference_title: "Pott disease: when lumbar pain is not innocent."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The involvement of the spine, although rare, can have major consequences if not diagnosed and treated in a timely and effective manner, such as residual deformities and neurological deficits. On occasion, the atypical presentation of tuberculous spondylitis may cause a delay in treatment and therefore lead to less favorable outcomes."
    explanation: Establishes tuberculous spondylitis (Pott disease) as an important infectious differential diagnosis of lumbar back pain that can cause spinal deformity and neurological deficits if missed.
notes: >-
  MONDO has no disease class for nonspecific dorsalgia / back pain, which HPO
  represents as HP:0003418 Back pain and ICD-10 as M54 Dorsalgia, so
  disease_term carries only the free-text preferred_term. Searches of MONDO in
  OLS for "back pain", "low back pain", "dorsalgia", "lumbago" and "dorsopathy"
  returned no such class; the closest hit, MONDO:0044339 lumbar disk
  degenerative disorder, covers only the discogenic subtype. The entry was
  previously bound to the MONDO root MONDO:0000001 (disease), which asserted
  identity with every disease in MONDO. Anatomical, phenotypic, and causal
  mechanisms remain anchored to UBERON, HP, GO, CL, and HGNC terms.

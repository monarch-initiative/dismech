  - reference: PMID:23230403
    reference_title: "Does patient history and physical examination predict MRI proven cauda equina syndrome?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Symptoms included back/low back pain, bilateral sciatica, bladder retention, bladder incontinence, frequent urination, decreased urinary sensation, and bowel incontinence; signs included saddle numbness and reduced anal tone."
    explanation: Details the key history and physical examination findings evaluated in patients with severe dorsalgia and suspected neural compression.
treatments:
- name: Urgent Surgical Decompression (Laminectomy and Discectomy)
  description: >-
    Open or microscopic surgical decompression via laminectomy and discectomy
    to relieve mechanical impingement of lumbosacral nerve roots or the cauda
    equina. In cauda equina syndrome secondary to lumbar disc herniation,
    decompression within 48 hours of symptom onset significantly improves
    recovery of sensory, motor, urinary, and rectal function.
  treatment_term:
    preferred_term: Spinal Cord Decompression
    term:
      id: NCIT:C124141
      label: Spinal Cord Decompression
  target_mechanisms:
  - target: Nerve Root and Cauda Equina Compression with Ischemia and Axonal Transport Block
  - target: Secondary Facet Osteoarthritis, Ligamentum Flavum Hypertrophy, and Spinal Canal Stenosis
  evidence:
  - reference: PMID:10851100
    reference_title: "Cauda equina syndrome secondary to lumbar disc herniation: a meta-analysis of surgical outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Significant differences, however, were found in resolution of sensory and motor deficits as well as urinary and rectal function in patients treated within 48 hours compared with those treated more than 48 hours after onset of symptoms."
    explanation: Meta-analysis demonstrating significantly superior recovery of sensorimotor and sphincter function when surgical decompression is performed within 48 hours.
  - reference: PMID:38496349
    reference_title: "Cauda equina, conus medullaris and syndromes mimicking sciatic pain: WFNS spine committee recommendations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surgical decompression for CES and CMS is recommended within 48 h, preferably within less than 24 h."
    explanation: International clinical guideline recommending surgical decompression within 48 hours for compressive cauda equina syndrome.
  - reference: PMID:36426378
    reference_title: "Presentation, management, and outcomes of cauda equina syndrome up to one year after surgery, using clinician and participant reporting: A multi-centre prospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bilateral muscle strip, laminectomy, and discectomy were also more frequent when CSF was not visible on MRI"
    explanation: Documents laminectomy and discectomy as the standard decompressive procedures for severe lumbar canal occlusion.

- name: Full-Endoscopic Lumbar Discectomy
  description: >-
    Minimally invasive endoscopic removal of herniated lumbar disc fragments
    to achieve targeted neural decompression while minimizing paraspinal muscle
    trauma, hospital stay, and postoperative recovery time.
  treatment_term:
    preferred_term: Therapeutic Endoscopic Procedure
    term:
      id: NCIT:C64958
      label: Therapeutic Endoscopic Procedure
  target_mechanisms:
  - target: Nerve Root and Cauda Equina Compression with Ischemia and Axonal Transport Block
  evidence:
  - reference: PMID:37634669
    reference_title: "Development and Validation of a Nomogram to Predict the Risk of Recurrent Lower Extremity Radiating Pain Within 1 Week Following Full-Endoscopic Lumbar Discectomy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study aimed to identify risk factors for LE radiating pain after decompression with full-endoscopic lumbar discectomy"
    explanation: Documents the clinical use of full-endoscopic lumbar discectomy for surgical decompression of lumbar disc herniation with lower extremity radiating pain.

- name: Biomechanical Movement Retraining and Physical Rehabilitation
  description: >-
    Modification of athletic and functional movement mechanics to avoid
    extreme lumbar hyperextension and abrupt trunk flexion under load,
    reducing mechanical shear stress across degenerated lumbar motion
    segments during rehabilitation.
  treatment_term:
    preferred_term: Physical Therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_mechanisms:
  - target: Intervertebral Disc Extracellular Matrix Degradation and Endplate Remodeling
  evidence:
  - reference: PMID:21509154
    reference_title: "Alternative pop-up for surfers with low back pain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This alternative is a suggested technique to alleviate the stress in the lumbar spine during surfing."
    explanation: Shows that targeted biomechanical modification during rehabilitation reduces mechanical stress in the lumbar spine.
animal_models:
- species: Mus musculus
  genotype: Col9a2-/- (homozygous Col9a2 knockout)
  background: C57BL/6
  description: >-
    Mice lacking the alpha-2 chain of type IX collagen exhibit osteochondral
    remodeling of the cartilaginous vertebral endplate, suppressed
    extracellular matrix synthesis, chondrocyte hypertrophy, and accelerated
    intervertebral disc degeneration.
  evidence:
  - reference: PMID:35126710
    reference_title: "Col9a2 gene deletion accelerates the degeneration of intervertebral discs."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results suggested that deletion of the Col9a2 gene led to osteochondral remodeling of cartilage EP and suppressed ECM synthesis, accelerating matrix degradation and chondrocyte hypertrophy in the IVD tissue."
    explanation: Characterizes the Col9a2 knockout mouse as an experimental model of accelerated intervertebral disc and endplate degeneration.

- species: Mus musculus
  genotype: Col9a1-/- (homozygous Col9a1 knockout)
  description: >-
    Mice deficient in the alpha-1 chain of type IX collagen develop premature
    intervertebral disc degeneration with an increased incidence of annular
    disc tears, accompanied by heightened mechanical pain sensitivity,
    compensatory gait alterations, and impaired physical function.
  evidence:
  - reference: PMID:18163498
    reference_title: "Early-onset degeneration of the intervertebral disc and vertebral end plate in mice deficient in type IX collagen."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Type IX collagen is an important component of the intervertebral disc extracellular matrix. Mutations in type IX collagen are associated with premature disc degeneration in mice and a predisposition to disc disorders in humans."
    explanation: Establishes premature intervertebral disc and vertebral endplate degeneration in type IX collagen-deficient mice.
  - reference: PMID:19714629
    reference_title: "Decreased physical function and increased pain sensitivity in mice deficient for type IX collagen."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Col9a1(-/-) mice had compensatory gait changes, increased mechanical sensitivity, and impaired physical ability."
    explanation: Demonstrates behavioral dorsalgia equivalents—mechanical hyperalgesia, gait changes, and physical impairment—in Col9a1-/- mice.
  - reference: PMID:19714629
    reference_title: "Decreased physical function and increased pain sensitivity in mice deficient for type IX collagen."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Intervertebral disc degeneration was also detected, with Col9a1(-/-) mice having an increased incidence of disc tears."
    explanation: Links the behavioral pain phenotype in Col9a1-/- mice directly to histological intervertebral disc degeneration and disc tears.
differential_diagnoses:
- name: Deep Gluteal Syndrome and Piriformis Syndrome
  description: >-
    Non-discogenic entrapment of the sciatic nerve within the deep gluteal
    space (most commonly by the piriformis muscle) that mimics lumbosacral
    radiculopathy and sciatic pain without intraspinal nerve root compression.
  distinguishing_features:
  - Absence of causative nerve root compression on lumbar spine MRI
  - Buttock tenderness and sciatic pain reproduced by hip flexion, adduction, and internal rotation maneuvers
  evidence:
  - reference: PMID:38496349
    reference_title: "Cauda equina, conus medullaris and syndromes mimicking sciatic pain: WFNS spine committee recommendations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The treating physician should be cognizant of a variety of other pathologies that may mimic sciatica, including piriformis syndrome, and how to manage these."
    explanation: Identifies piriformis syndrome / deep gluteal syndrome as a major extraspinal mimic of discogenic sciatica.

- name: Axial Spondyloarthritis / Ankylosing Spondylitis
  description: >-
    Chronic immune-mediated inflammatory arthritis of the sacroiliac joints
    and axial skeleton presenting with insidious inflammatory back pain.
  distinguishing_features:
  - Morning stiffness lasting greater than 30 minutes that improves with exercise rather than rest
  - Sacroiliitis and syndesmophytes on imaging and strong association with HLA-B27
  disease_term:
    preferred_term: ankylosing spondylitis
    term:
      id: MONDO:0005306
      label: ankylosing spondylitis

- name: Tuberculous Spondylitis (Pott Disease)
  description: >-
    Granulomatous vertebral osteomyelitis and discitis caused by Mycobacterium
    tuberculosis that presents with progressive chronic thoracic or lumbar
    back pain, vertebral collapse, and gibbus deformity.
  distinguishing_features:
  - Constitutional symptoms (fever, weight loss, night sweats) and elevated inflammatory markers
  - Contiguous vertebral body destruction and paraspinal cold abscess on MRI
  disease_term:
    preferred_term: tuberculosis, spinal
    term:
      id: MONDO:0043836
      label: tuberculosis, spinal
notes: >-
  MONDO does not currently carry a dedicated term for nonspecific dorsalgia /
  back pain (which is represented in HPO as HP:0003418 Back pain and ICD-10 as
  M54 Dorsalgia); therefore, the root term MONDO:0000001 (disease) is retained
  as a placeholder on disease_term while specific anatomical, phenotypic, and
  causal mechanisms are anchored to UBERON, HP, GO, CL, and HGNC terms.

genetic:
- name: UBE3C
  notes: >-
    UBE3C (7q36.3) encodes a HECT-type E3 ubiquitin ligase that docks on the 19S
    regulatory particle of the 26S proteasome and assembles K29/K48-linked
    polyubiquitin chains. Biallelic loss-of-function variants cause NEDSMB;
    patient RNA studies confirmed the loss-of-function effect.
  gene_term:
    preferred_term: UBE3C
    term:
      id: hgnc:16803
      label: UBE3C
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:36401616
    reference_title: "Biallelic variants in HECT E3 paralogs, HECTD4 and UBE3C, encoding ubiquitin ligases cause neurodevelopmental disorders that overlap with Angelman syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 3 patients from 2 families with Angelman-like syndrome, paralog-directed candidate gene approach detected 2 LoF variants in the other candidate E3 ligase gene, UBE3C, a paralog of the Angelman syndrome E3 ligase gene, UBE3A."
    explanation: >-
      Establishes UBE3C as the causal gene, the biallelic loss-of-function
      mechanism, and the paralogy to UBE3A that motivated its discovery.

- name: UBE3C (heterozygous autism susceptibility)
  notes: >-
    Separately from the recessive disease modeled by this entry, heterozygous
    UBE3C variants have been discussed as autism spectrum disorder risk alleles,
    and UBE3C is described in the HECT-ligase literature as an autism-associated
    member of the UBE3 family. This is a distinct dose and a distinct
    gene-phenotype relationship; it is recorded here so a curator does not later
    merge the two, not as part of the NEDSMB mechanism.
  gene_term:
    preferred_term: UBE3C
    term:
      id: hgnc:16803
      label: UBE3C
  relationship_type: SUSCEPTIBILITY
  evidence:
  - reference: PMID:33182779
    reference_title: "Molecular Evolution, Neurodevelopmental Roles and Clinical Significance of HECT-Type UBE3 E3 Ubiquitin Ligases."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "we summarize recent findings on brain-expressed HECT-type E3 UBE3 ligases and their murine orthologues, comprising Angelman syndrome UBE3A, Kaufman oculocerebrofacial syndrome UBE3B and autism spectrum disorder-associated UBE3C."
    explanation: >-
      Review-level statement that UBE3C is associated with autism spectrum
      disorder, distinct from the recessive NEDSMB association. Marked PARTIAL
      and OTHER: it is a review's framing of the gene, not a primary
      variant-level association study, and no effect size or variant class is
      asserted here on its basis.

variants:
- name: Biallelic UBE3C loss-of-function variants
  description: >-
    Two loss-of-function variants were identified across the 2 reported families.
    Only that count and the loss-of-function class are asserted here.
    Variant-level detail (coordinates, allele class per family, HGVS) appears only
    in the paper's full text, which has no PMC deposit and returned
    content_type: unavailable when fetched by DOI, so no variant-level claim is
    made. A deep-research report offered a multi-exon-deletion allele for one
    patient; it carried no resolvable citation and is deliberately not curated.
  gene:
    preferred_term: UBE3C
    term:
      id: hgnc:16803
      label: UBE3C
  evidence:
  - reference: PMID:36401616
    reference_title: "Biallelic variants in HECT E3 paralogs, HECTD4 and UBE3C, encoding ubiquitin ligases cause neurodevelopmental disorders that overlap with Angelman syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 3 patients from 2 families with Angelman-like syndrome, paralog-directed candidate gene approach detected 2 LoF variants in the other candidate E3 ligase gene, UBE3C, a paralog of the Angelman syndrome E3 ligase gene, UBE3A."
    explanation: >-
      States the number and class of variants (2 loss-of-function variants across
      2 families) asserted by this record.

diagnosis:
- name: Exome sequencing with paralog-directed candidate gene analysis
  description: >-
    NEDSMB is a molecular diagnosis. Every reported patient reached it through
    exome sequencing after a clinical diagnosis of Angelman syndrome was not
    confirmed by the standard UBE3A/15q11-q13 workup; the causal gene was then
    recognized by a paralog-directed candidate gene approach. Chromosomal
    analysis was used alongside exome sequencing in the founding study. There are
    no clinical diagnostic criteria and no gene-specific clinical test for this
    entity.
  evidence:
  - reference: PMID:36401616
    reference_title: "Biallelic variants in HECT E3 paralogs, HECTD4 and UBE3C, encoding ubiquitin ligases cause neurodevelopmental disorders that overlap with Angelman syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chromosomal analysis and exome sequencing were used to identify the genetic causes in 10 patients from 7 unrelated families with syndromic neurodevelopmental, seizure, and movement disorders and neurobehavioral phenotypes."
    explanation: >-
      Names the two modalities by which the diagnoses in this cohort were made.

differential_diagnoses:
- name: Angelman syndrome
  description: >-
    The principal differential and the reason the gene was found. All 3 reported
    UBE3C patients carried a clinical diagnosis of Angelman-like syndrome.
    Angelman syndrome is caused by loss of maternal UBE3A function at 15q11-q13
    and is distinguished by a positive methylation/UBE3A result and by its
    non-Mendelian imprinting mechanism; NEDSMB is autosomal recessive with two
    UBE3C null alleles and a negative Angelman workup.
  disease_term:
    preferred_term: Angelman syndrome
    term:
      id: MONDO:0007113
      label: Angelman syndrome
  evidence:
  - reference: PMID:36401616
    reference_title: "Biallelic variants in HECT E3 paralogs, HECTD4 and UBE3C, encoding ubiquitin ligases cause neurodevelopmental disorders that overlap with Angelman syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HECTD4 and UBE3C are novel biallelic rare disease genes, expand the association of the other HECT E3 ligase group with neurodevelopmental syndromes, and could explain some of the missing heritability in patients with a suggestive clinical diagnosis of Angelman syndrome."
    explanation: >-
      States explicitly that these genes account for part of the unexplained
      fraction of patients suspected clinically of Angelman syndrome, which is
      what makes Angelman syndrome the defining differential.

- name: HECTD4-related neurodevelopmental disorder
  description: >-
    The other novel HECT E3 ligase disorder reported in the same paper, in 7 of
    the 10 patients. It shares the syndromic neurodevelopmental, seizure,
    movement and behavioral presentation but is a different gene and a different
    entity; the two must not be merged, and HECTD4 findings must not be used as
    evidence for UBE3C claims.
  evidence:
  - reference: PMID:36401616
    reference_title: "Biallelic variants in HECT E3 paralogs, HECTD4 and UBE3C, encoding ubiquitin ligases cause neurodevelopmental disorders that overlap with Angelman syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In total, 4 patients were found to have 3 different homozygous loss-of-function (LoF) variants, and 3 patients had 4 compound heterozygous missense variants in the candidate E3 ligase gene, HECTD4, that were rare, absent from controls as homozygous, and predicted to be deleterious in silico."
    explanation: >-
      Documents the separate HECTD4 patient group reported in the same study,
      the boundary this entry must not cross.

- name: Angelman-like syndrome from other genes (UBE3A-negative AS-like)
  description: >-
    The clinical situation NEDSMB actually occupies. Roughly 10-15% of patients
    given a clinical diagnosis of Angelman syndrome have no molecular diagnosis on
    the standard 15q11-q13/UBE3A workup, and exome sequencing in that AS-like
    group returns pathogenic variants across a wide set of unrelated
    neurodevelopmental genes. NEDSMB was discovered inside exactly this group.
    Anything on this list is therefore a live alternative for a patient in front
    of you, and the discriminator is the molecular result, not the phenotype.
  notes: >-
    The cited cohort (Aguilera et al. 2021) reports SYNGAP1, VAMP2, TBL1XR1,
    ASXL3, SATB2, SMARCE1, SPTAN1, KCNQ3, SLC6A1, LAS1L and candidate HSF2, and
    names Christianson (SLC9A6), Rett (MECP2), Pitt-Hopkins (TCF4), Kleefstra
    (EHMT1), Mowat-Wilson (ZEB2) and HERC2 deficiency as established AS
    differentials. Single-gene AS-like differentials reported separately elsewhere
    - MEF2C, ACTL6B, CTNNB1, KMT5B, SYT1 - are named here as pointers only; they
    are not asserted as curated content because each rests on its own primary
    report that has not been read for this entry. A PR reviewer proposed that
    second list; it does not come from the cited cohort and the two should not be
    conflated.
  evidence:
  - reference: PMID:34653234
    reference_title: "New genes involved in Angelman syndrome-like: Expanding the genetic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is a 10-15% of patients with an AS phenotype whose genetic cause remains unknown (Angelman-like syndrome, AS-like)."
    explanation: >-
      Defines the AS-like group - clinically Angelman, molecularly undiagnosed -
      which is the population NEDSMB patients were ascertained from and therefore
      the differential this entry most needs.
  - reference: PMID:34653234
    reference_title: "New genes involved in Angelman syndrome-like: Expanding the genetic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results highlight the wide genetic heterogeneity in AS-like patients and expands the differential diagnosis."
    explanation: >-
      Establishes that the AS-like differential is genetically heterogeneous and
      still expanding, which is the reason this is curated as one differential
      entry rather than an enumerated gene list.

- name: Kaufman oculocerebrofacial syndrome (UBE3B)
  description: >-
    The third brain-expressed HECT-type UBE3 paralog disorder, completing the set
    with UBE3A/Angelman syndrome and UBE3C/NEDSMB. Like NEDSMB it is autosomal
    recessive with severe intellectual disability and microcephaly, but it is
    distinguished by its ocular and craniofacial gestalt - blepharophimosis,
    ptosis, a long narrow face and long thin hands and feet - which is not part of
    the NEDSMB description. Listed because the paralog family is exactly the axis
    along which this entity is most likely to be confused, and because a UBE3B
    finding must no more be used to support a UBE3C claim than a UBE3A one.
  disease_term:
    preferred_term: Kaufman oculocerebrofacial syndrome
    term:
      id: MONDO:0009485
      label: oculocerebrofacial syndrome, Kaufman type
  evidence:
  - reference: PMID:33182779
    reference_title: "Molecular Evolution, Neurodevelopmental Roles and Clinical Significance of HECT-Type UBE3 E3 Ubiquitin Ligases."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "we summarize recent findings on brain-expressed HECT-type E3 UBE3 ligases and their murine orthologues, comprising Angelman syndrome UBE3A, Kaufman oculocerebrofacial syndrome UBE3B and autism spectrum disorder-associated UBE3C."
    explanation: >-
      Establishes the three-member brain-expressed UBE3 paralog family and the
      disorder each member causes, which is the basis for listing UBE3B alongside
      UBE3A as a paralog differential.

animal_models:
- name: Ube3c-deficient mouse forebrain
  species: Mouse
  genotype: Ube3c loss of function
  publication: DOI:10.1101/2025.04.09.646620
  description: >-
    Ube3c-deficient murine cerebral cortex, used with human brain organoids to
    define the CBLL1/m6A arm. Reported in a preprint that had not entered PubMed
    at the time of curation.
  evidence:
  - reference: DOI:10.1101/2025.04.09.646620
    reference_title: "UBE3C links ubiquitin signaling to epitranscriptomic control of cortical neurogenesis (bioRxiv preprint, not peer reviewed)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "with its loss favoring neurogenesis and suppressing glial fate"
    explanation: >-
      Establishes that a Ube3c-deficient mouse exists and shows a cortical
      phenotype, i.e. that this model is informative for the disorder at all.
      Preprint; see the review_notes PREPRINT USE paragraph.
  modeled_mechanisms:
  - target: Impaired Neural Progenitor Cell-Cycle Exit and Skewed Neurogenesis
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    description: >-
      Loss of Ube3c shifts cortical cellular composition toward neurogenesis and
      away from glial fate, and disease-associated UBE3C mutations disrupt
      cortical lamination.
    limitations: >-
      Murine corticogenesis lacks the expanded outer subventricular zone and
      outer radial glia of the human cortex, and the mouse has no reported
      behavioral or speech phenotype corresponding to the human syndrome. The
      source is a preprint that has not been peer reviewed.
    evidence:
    - reference: DOI:10.1101/2025.04.09.646620
      reference_title: "UBE3C links ubiquitin signaling to epitranscriptomic control of cortical neurogenesis (bioRxiv preprint, not peer reviewed)."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "with its loss favoring neurogenesis and suppressing glial fate"
      explanation: >-
        Preprint evidence that the mouse model reproduces the neurogenic/gliogenic
        imbalance this node describes.
    - reference: DOI:10.1101/2025.04.09.646620
      reference_title: "UBE3C links ubiquitin signaling to epitranscriptomic control of cortical neurogenesis (bioRxiv preprint, not peer reviewed)."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "mutations alter its autoubiquitination activity and disrupt cortical lamination."
      explanation: >-
        Genetic complementation with disease-associated UBE3C mutations in the
        mouse disrupts cortical lamination, which is why this model is treated as
        modeling the disease lesion and not merely gene ablation.

experimental_models:
- name: Human iPSC-derived brain organoids with UBE3C loss of function
  experimental_model_type: ORGANOID
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  description: >-
    Human brain organoids were used in parallel with the mouse cortex to test
    whether the neurogenic/gliogenic shift and the CBLL1/m6A axis hold in a human
    cellular system. They partially close, but do not eliminate, the mouse-to-human
    gap: an organoid is not patient brain tissue and lacks vasculature, microglia
    and the full arc of postnatal circuit maturation in which the clinical
    phenotype emerges.
  evidence:
  - reference: DOI:10.1101/2025.04.09.646620
    reference_title: "UBE3C links ubiquitin signaling to epitranscriptomic control of cortical neurogenesis (bioRxiv preprint, not peer reviewed)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "with its loss favoring neurogenesis and suppressing glial fate"
    explanation: >-
      Establishes that human brain organoids were used alongside the mouse and
      show the same fate shift, which is what makes this model informative here.
      Preprint; see the review_notes PREPRINT USE paragraph.
  modeled_mechanisms:
  - target: CBLL1 Stabilization and m6A Writer Hyperactivation
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    description: >-
      Proteomic profiling of UBE3C-deficient organoids and forebrains identified
      CBLL1 as a UBE3C substrate driving m6A methylation.
    limitations: >-
      Preprint, not peer reviewed; organoids model corticogenesis, not the
      postnatal cortex in which speech, movement and behavioral phenotypes arise.
    evidence:
    - reference: DOI:10.1101/2025.04.09.646620
      reference_title: "UBE3C links ubiquitin signaling to epitranscriptomic control of cortical neurogenesis (bioRxiv preprint, not peer reviewed)."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "identifies Cbll1 as a UBE3C substrate"
      explanation: >-
        The organoids are half of the proteomic profiling that identified CBLL1 as
        a UBE3C substrate, which is the claim this link makes about this node.

treatments:
- name: Supportive and Rehabilitative Care
  description: >-
    No disease-specific therapy exists. Management is symptomatic and
    rehabilitative — developmental therapies, augmentative and alternative
    communication for absent speech, and behavioral support for aggression —
    extrapolated from practice in severe syndromic neurodevelopmental disorders.
    No treatment has been studied in NEDSMB patients, and none is curated here
    with disease-specific efficacy evidence.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation

- name: Speech-Language Therapy and Augmentative and Alternative Communication
  description: >-
    Absent speech is the feature the disorder is named for, and augmentative and
    alternative communication is the standard intervention for a non-speaking
    child with severe intellectual disability. NOT disease-specific evidence: no
    communication intervention has been trialed or reported in a NEDSMB patient,
    and this entry is extrapolated from general practice in severe syndromic
    neurodevelopmental disorders. It carries no evidence block for that reason.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Speech Therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
  notes: >-
    Curated with provenance in the description and no evidence block, the same
    SOP option A treatment applied to the phenotypes sourced from the OMIM
    clinical synopsis. Added on review suggestion because the defining feature of
    the disorder had no corresponding supportive intervention curated.

- name: Genetic Counseling
  description: >-
    Autosomal recessive inheritance, so the standard autosomal-recessive
    expectation of a one-in-four recurrence risk for the sibs of an affected child
    applies; no disorder-specific recurrence figure has been published. Carrier
    and prenatal testing become feasible once the familial variants are known.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:36401616
    reference_title: "Biallelic variants in HECT E3 paralogs, HECTD4 and UBE3C, encoding ubiquitin ligases cause neurodevelopmental disorders that overlap with Angelman syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HECTD4 and UBE3C are novel biallelic rare disease genes, expand the association of the other HECT E3 ligase group with neurodevelopmental syndromes, and could explain some of the missing heritability in patients with a suggestive clinical diagnosis of Angelman syndrome."
    explanation: >-
      The biallelic (autosomal recessive) mechanism is what makes recurrence-risk
      counseling applicable.

- name: STM2457 (METTL3 inhibitor) - preclinical only, not a patient treatment
  description: >-
    NOT A TREATMENT FOR PATIENTS. STM2457 is a small-molecule METTL3 (m6A writer)
    inhibitor. It is curated here solely because it is the one intervention shown
    to act on this disorder's proposed mechanism: in Ube3c-deficient mice it
    reverses the neural progenitor cell-cycle-exit defect in vivo. It has never
    been given to a person with NEDSMB, the mechanism it targets is the EMERGING
    epitranscriptomic hypothesis rather than established disease biology, and the
    supporting report is a preprint. It is recorded as a target_mechanisms lead so
    the pathograph carries the therapeutic hypothesis explicitly, and must not be
    read as a therapy recommendation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Impaired Neural Progenitor Cell-Cycle Exit and Skewed Neurogenesis
    treatment_effect: INHIBITS
    description: >-
      METTL3 inhibition lowers m6A writer activity, restoring progenitor
      cell-cycle exit in the mouse model.
    evidence:
    - reference: DOI:10.1101/2025.04.09.646620
      reference_title: "UBE3C links ubiquitin signaling to epitranscriptomic control of cortical neurogenesis (bioRxiv preprint, not peer reviewed)."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "impairs cell cycle exit, a defect reversible in vivo by the METTL3 inhibitor STM2457."
      explanation: >-
        The in vivo mouse rescue, which is the entire basis for this entry.
        Preprint, mouse only, no human data.
  notes: >-
    Curated deliberately rather than omitted: the omission of a preclinical lead
    is silent, and a reviewer cannot tell a considered decision from a miss. The
    preclinical framing is carried in the name, the description and this note.

discussions:
- discussion_id: ube3c_substrate_processivity_gap
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which UBE3C substrates fail to be degraded in patient neurons, and does
    proteasomal processivity actually fall in UBE3C-null human cells?
  attaches_to:
  - pathophysiology#Impaired Proteasomal Processivity and Cytosolic Protein Quality Control
  - pathophysiology#Neuronal Proteostatic Vulnerability
  rationale: >-
    The processivity defect is established for UBE3C knockdown in immortalized
    cell lines and for the yeast ortholog, and the disorder's causality is
    established genetically, but nothing connects the two: no measurement of
    proteasomal processivity, ubiquitin-conjugate load or substrate accumulation
    has been reported in cells from a NEDSMB patient. The neuronal step of the
    canonical model is therefore an inference, not a finding. The gap is wider
    than "which substrates", because UBE3C's cell biology is not confined to
    proteasomal processivity: it also sets autophagic flux (K29/K48-branched
    ubiquitination of VPS34, and K33 ubiquitination of ATG4B) and contributes to
    ER-associated degradation of misfolded substrates. Any of those arms could be
    the disease-relevant one, none is disease-linked in the current literature,
    and the canonical chain here models only the proteasomal arm.
  evidence:
  - reference: PMID:24158444
    reference_title: The E3 ubiquitin ligase UBE3C enhances proteasome processivity by ubiquitinating partially proteolyzed substrates.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Upon knockdown of UBE3C, an E3 ubiquitin ligase, a reporter protein consisting of a destabilizing domain fused to GFP is degraded more slowly and incompletely by the proteasome."
    explanation: >-
      Documents the one side of the gap that IS established - the processivity
      defect in a knockdown cell line - against which the absence of any
      patient-cell measurement is the gap.
  - reference: PMID:33637724
    reference_title: "VPS34 K29/K48 branched ubiquitination governed by UBE3C and TRABID regulates autophagy, proteostasis and liver metabolism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we show that ubiquitin ligase UBE3C and deubiquitinating enzyme TRABID reciprocally regulate K29/K48-branched ubiquitination of VPS34."
    explanation: >-
      Documents an autophagy-regulating UBE3C arm outside proteasomal
      processivity, one of the alternatives this gap says cannot yet be
      distinguished as the disease-relevant mechanism.
  - reference: PMID:38146933
    reference_title: UBE3C tunes autophagy via ATG4B ubiquitination.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "UBE3C mainly assembles K33-branched ubiquitin chains on ATG4B at Lys119 without causing ATG4B degradation."
    explanation: >-
      Documents a second, non-degradative UBE3C arm - autophagy tuning via ATG4B -
      widening the set of candidate disease-relevant mechanisms.
  - reference: PMID:38067172
    reference_title: UBE3C Facilitates the ER-Associated and Peripheral Degradation of Misfolded CFTR.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results suggest that UBE3C plays a vital role in the ERAD of misfolded CFTR and ABCB1, even within the RNF5/185-independent ERAD pathway, and it may also be involved in maintaining the peripheral quality control of CFTR."
    explanation: >-
      Documents a UBE3C role in ER-associated degradation of misfolded substrates,
      a third arm that the canonical chain here does not model.
  proposed_experiments:
  - experiment_id: patient_neuron_processivity_profiling
    name: Processivity and conjugate profiling in patient-derived neurons
    description: >-
      Differentiate iPSC-derived cortical neurons from the reported patients and
      isogenic controls, and measure proteasome-bound ubiquitin conjugate levels,
      accumulation of truncated degradation intermediates from a
      destabilizing-domain reporter, and sensitivity to proteotoxic stress
      (17-AAG, bortezomib).

- discussion_id: cbll1_m6a_human_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the CBLL1/m6A corticogenesis mechanism, defined in Ube3c-deficient mouse
    forebrain and human brain organoids, operate in the human patient brain?
  attaches_to:
  - pathophysiology#CBLL1 Stabilization and m6A Writer Hyperactivation
  - pathophysiology#Impaired Neural Progenitor Cell-Cycle Exit and Skewed Neurogenesis
  rationale: >-
    The mechanism is attractive and directly druggable in the model (STM2457
    rescues the progenitor defect in vivo), but the mismatch is substantive in
    three ways. The mouse cortex lacks the expanded outer subventricular zone and
    outer radial glia that dominate human cortical expansion, precisely the
    compartment a progenitor cell-cycle-exit defect would act on. Brain organoids
    model fetal corticogenesis and cannot express speech, movement or behavioral
    phenotypes, which is the entire clinical endpoint. And no patient brain
    tissue, imaging correlate of cortical lamination, or human CBLL1/m6A
    measurement exists to test the chain. The source is additionally a preprint
    that had not completed peer review at the time of curation.
  evidence:
  - reference: DOI:10.1101/2025.04.09.646620
    reference_title: "UBE3C links ubiquitin signaling to epitranscriptomic control of cortical neurogenesis (bioRxiv preprint, not peer reviewed)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "with its loss favoring neurogenesis and suppressing glial fate"
    explanation: >-
      The model-system result whose translational validity to human patient brain
      is the open question recorded by this mismatch.
  proposed_experiments:
  - experiment_id: patient_organoid_m6a_profiling
    name: m6A and CBLL1 profiling in patient-derived cortical organoids
    description: >-
      Generate cortical organoids from NEDSMB patient iPSCs and isogenic
      corrected controls, and measure CBLL1 abundance, transcriptome-wide m6A
      (meRIP-seq), progenitor cell-cycle exit and laminar marker distribution,
      with and without METTL3 inhibition.
  - experiment_id: patient_cortical_lamination_mri
    name: Neuroimaging correlate of cortical lamination
    description: >-
      Review or acquire high-resolution structural MRI in the reported patients
      for gyral, laminar or heterotopia phenotypes predicted by the mouse
      lamination defect, given that cerebellar hypoplasia and thin corpus
      callosum are already recorded in the clinical synopsis.

notes: >-
  The disorder acronym used by OMIM is NEDSMB (OMIM:620270). MONDO:0859519,
  MEDGEN:1840955 and UMLS:C5830319 all denote the same entity. No GeneReviews
  chapter exists for UBE3C or for this disorder; a PubMed search for
  "UBE3C GeneReviews" returned no records at the time of curation, so the
  GeneReviews phenotype-baseline step does not apply.

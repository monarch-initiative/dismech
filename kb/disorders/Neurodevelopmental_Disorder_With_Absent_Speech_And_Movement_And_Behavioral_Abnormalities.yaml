pathophysiology:
- name: Biallelic UBE3C Loss-of-Function Variants
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: UBE3C
      term:
        id: hgnc:16803
        label: UBE3C
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      UBE3C loss-of-function alleles. Zygosity is recorded as homozygous
      because that is what the founding report supports: 2 loss-of-function
      variants across 3 patients from 2 families. Compound heterozygosity is not
      reported for UBE3C in the cited literature and is not asserted.
  description: >-
    Biallelic - as reported, homozygous - loss-of-function variants in UBE3C
    (HGNC:16803, 7q36.3) are the initiating lesion. Patient RNA studies in the
    founding cohort demonstrated the loss-of-function effect at the transcript
    level, consistent with nonsense-mediated decay of the mutant message.
  downstream:
  - target: Loss of Proteasome-Associated HECT E3 Ligase Activity
    causal_link_type: DIRECT
    description: >-
      Absence of UBE3C protein removes the ligase activity from the proteasome.
  evidence:
  - reference: PMID:36401616
    reference_title: "Biallelic variants in HECT E3 paralogs, HECTD4 and UBE3C, encoding ubiquitin ligases cause neurodevelopmental disorders that overlap with Angelman syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The RNA studies in 4 patients with LoF variants in HECTD4 and UBE3C provided evidence for the LoF effect."
    explanation: >-
      Patient-derived RNA studies confirm that the identified variants act by
      loss of function. Note the sentence spans both HECTD4 and UBE3C patients;
      it is quoted here for the loss-of-function mechanism, which is asserted
      for both genes.

- name: Loss of Proteasome-Associated HECT E3 Ligase Activity
  biological_scale: MOLECULAR
  description: >-
    UBE3C is a HECT-domain E3 ubiquitin ligase that binds the 19S regulatory
    particle of the 26S proteasome through its N-terminal domain and assembles
    Lys29- and Lys48-linked polyubiquitin chains through its C-terminal HECT
    domain. It cycles on and off the proteasome together with the deubiquitinase
    USP14, with substrate load driving the association. Biallelic loss of UBE3C
    removes this activity from the particle.
  molecular_functions:
  - preferred_term: HECT-type ubiquitin protein ligase activity
    term:
      id: GO:0061630
      label: ubiquitin protein ligase activity
    modifier: LOSS_OF_FUNCTION
  biological_processes:
  - preferred_term: K29-linked polyubiquitin chain assembly
    term:
      id: GO:0035519
      label: protein K29-linked ubiquitination
    modifier: DECREASED
  - preferred_term: K48-linked polyubiquitin chain assembly
    term:
      id: GO:0070936
      label: protein K48-linked ubiquitination
    modifier: DECREASED
  downstream:
  - target: Impaired Proteasomal Processivity and Cytosolic Protein Quality Control
    causal_link_type: DIRECT
    description: >-
      Without UBE3C-mediated re-ubiquitination of proteasome-engaged substrates,
      degradation of stable substrates terminates prematurely.
  - target: CBLL1 Stabilization and m6A Writer Hyperactivation
    causal_link_type: DIRECT
    hypothesis_groups:
    - epitranscriptomic_corticogenesis
    description: >-
      Emerging, model-system-only arm: loss of UBE3C ligase activity stabilizes
      its substrate CBLL1, which drives m6A mRNA methylation.
  evidence:
  - reference: PMID:11278995
    reference_title: A HECT domain E3 enzyme assembles novel polyubiquitin chains.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Recombinant KIAA10 catalyzed the assembly of both Lys(29)- and Lys(48)-linked polyubiquitin chains."
    explanation: >-
      Establishes the chain-linkage specificity of UBE3C (originally cloned as
      KIAA10), the activity lost in this disorder.
  - reference: PMID:11278995
    reference_title: A HECT domain E3 enzyme assembles novel polyubiquitin chains.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The N-terminal domain of KIAA10 interacted in vitro with purified 26 S proteasomes and with the isolated S2/Rpn1 subunit of the proteasome's 19 S regulatory complex"
    explanation: >-
      Establishes that UBE3C docks on the 19S regulatory particle, which is why
      its loss is a proteasome-proximal defect rather than a generic ligase loss.
  - reference: PMID:28396413
    reference_title: Ubiquitinated proteins promote the association of proteasomes with the deubiquitinating enzyme Usp14 and the ubiquitin ligase Ube3c.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Thus, Usp14 and Ube3c cycle together on and off proteasomes, and the presence of ubiquitinated substrates promotes their association."
    explanation: >-
      Shows UBE3C is a substrate-load-responsive proteasome cofactor, so its
      absence is felt most when protein quality control demand is high.
  - reference: PMID:32039437
    reference_title: Crystal structure of HECT domain of UBE3C E3 ligase and its ubiquitination activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, we identified Lys903 in the UBE3C HECT domain as a major site of autoubiquitination."
    explanation: >-
      Locates the autoubiquitination site in the UBE3C HECT domain. This is the
      activity the preprint reports as altered by disease-associated mutations,
      so it is curated here on the ligase-activity node rather than only in prose.
  - reference: PMID:32039437
    reference_title: Crystal structure of HECT domain of UBE3C E3 ligase and its ubiquitination activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The deletion of the last three amino acids at the C-terminal completely abrogated UBE3C activity"
    explanation: >-
      Shows how narrowly the catalytic C-terminus is required, which is why
      truncating loss-of-function alleles abolish the activity rather than
      attenuating it.
  - reference: PMID:24811749
    reference_title: Autoubiquitination of the 26S proteasome on Rpn13 regulates breakdown of ubiquitin conjugates.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "When proteolysis is even partially inhibited in cells or purified 26S proteasomes with various inhibitors, Rpn13 becomes extensively and selectively poly-ubiquitinated by the proteasome-associated ubiquitin ligase, Ube3c/Hul5."
    explanation: >-
      PARTIAL: documents a second, regulatory UBE3C activity at the proteasome -
      stress-induced ubiquitination of the receptor subunit Rpn13, which
      autoinhibits conjugate degradation. It is quoted to show that "loss of
      UBE3C" is not a single-consequence lesion; which of its proteasomal
      activities matters in neurons is recorded as an open knowledge gap.

- name: Impaired Proteasomal Processivity and Cytosolic Protein Quality Control
  biological_scale: CELLULAR
  description: >-
    UBE3C ubiquitinates substrates that are already partially threaded into the
    proteasome, committing them to complete proteolysis. When UBE3C is absent or
    catalytically dead, or cannot bind the proteasome, stable substrates are
    degraded slowly and incompletely and are released as truncated fragments;
    cells become more vulnerable to proteotoxic stress. UBE3C is also the ligase
    that clears low-burden misfolded, oligomer-enriched species in mammalian
    cells.
  biological_processes:
  - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolism
    term:
      id: GO:0043161
      label: proteasome-mediated ubiquitin-dependent protein catabolic process
    modifier: DECREASED
  - preferred_term: protein quality control for misfolded proteins
    term:
      id: GO:0006515
      label: protein quality control for misfolded or incompletely synthesized proteins
    modifier: DECREASED
  downstream:
  - target: Neuronal Proteostatic Vulnerability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Post-mitotic neurons depend heavily on ubiquitin-proteasome turnover, so a
      processivity defect is expected to be felt most in the nervous system.
  evidence:
  - reference: PMID:24158444
    reference_title: The E3 ubiquitin ligase UBE3C enhances proteasome processivity by ubiquitinating partially proteolyzed substrates.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Upon knockdown of UBE3C, an E3 ubiquitin ligase, a reporter protein consisting of a destabilizing domain fused to GFP is degraded more slowly and incompletely by the proteasome."
    explanation: >-
      Directly demonstrates the processivity defect produced by loss of UBE3C,
      the cellular consequence modeled by this node.
  - reference: PMID:24158444
    reference_title: The E3 ubiquitin ligase UBE3C enhances proteasome processivity by ubiquitinating partially proteolyzed substrates.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Finally, knockdown renders cells more susceptible to the Hsp90 inhibitor 17-AAG, suggesting that UBE3C protects against the harmful accumulation of protein fragments arising from incompletely degraded proteasome substrates."
    explanation: >-
      Links loss of UBE3C to reduced tolerance of proteotoxic stress, the
      cell-fitness consequence of the processivity defect.
  - reference: PMID:39636856
    reference_title: Temporal control of acute protein aggregate turnover by UBE3C and NRF1-dependent proteasomal pathways.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Lower levels of misfolded agDD-GFP, enriched in oligomers, utilizes UBE3C-dependent proteasomal degradation in a pathway that is independent of RPN13 ubiquitylation by UBE3C."
    explanation: >-
      Identifies a specific class of misfolded, oligomer-enriched substrate whose
      clearance in mammalian cells requires UBE3C.
  - reference: PMID:21983566
    reference_title: Hul5 HECT ubiquitin ligase plays a major role in the ubiquitylation and turnover of cytosolic misfolded proteins.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "These findings indicate that Hul5 is involved in a cytosolic protein quality control pathway that targets misfolded proteins for degradation."
    explanation: >-
      The budding yeast ortholog Hul5 defines the conserved cytosolic
      quality-control role of this ligase family. Marked PARTIAL because it is
      orthologue evidence rather than a direct human UBE3C result, and IN_VITRO
      rather than MODEL_ORGANISM because yeast is not an animal - the repo scopes
      MODEL_ORGANISM to in vivo animal data.

- name: CBLL1 Stabilization and m6A Writer Hyperactivation
  biological_scale: MOLECULAR
  description: >-
    Proteomic profiling of Ube3c-deficient mouse forebrain and human brain
    organoids identifies CBLL1 (Hakai) as a UBE3C substrate. Loss of UBE3C
    stabilizes CBLL1, and the UBE3C-CBLL1 pair sets the level of
    N6-methyladenosine (m6A) mRNA methylation; in UBE3C-deficient neural
    progenitors the m6A writers are hyperactivated. Disease-associated UBE3C mutations also alter
    the ligase's autoubiquitination. This arm is EMERGING and rests entirely on
    model systems reported in a preprint.
  downstream:
  - target: Impaired Neural Progenitor Cell-Cycle Exit and Skewed Neurogenesis
    causal_link_type: DIRECT
    hypothesis_groups:
    - epitranscriptomic_corticogenesis
    description: >-
      m6A writer hyperactivation impairs cell-cycle exit in neural progenitors.
  evidence:
  - reference: DOI:10.1101/2025.04.09.646620
    reference_title: "UBE3C links ubiquitin signaling to epitranscriptomic control of cortical neurogenesis (bioRxiv preprint, not peer reviewed)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "identifies Cbll1 as a UBE3C substrate, and we show that the UBE3C-Cbll1 duo drives N"
    explanation: >-
      The on-point quote for this node: proteomic profiling of UBE3C-deficient
      forebrains and organoids identifies CBLL1 as a UBE3C substrate, and the
      UBE3C-CBLL1 pair drives m6A methylation. The quote stops at "N" because the
      cached text breaks the superscript of N6-methyladenosine onto its own line.
      Preprint; see the review_notes PREPRINT USE paragraph.
  - reference: DOI:10.1101/2025.04.09.646620
    reference_title: "UBE3C links ubiquitin signaling to epitranscriptomic control of cortical neurogenesis (bioRxiv preprint, not peer reviewed)."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Hyperactivation of m6A writers in"
    explanation: >-
      PARTIAL: supports the m6A-writer hyperactivation half of this node's claim.
      The quote is short because the cached preprint text breaks the gene symbol
      onto its own line mid-sentence, so no longer contiguous span exists; the
      remainder of the sentence states the downstream cell-cycle-exit consequence
      and is quoted on the next node instead.

- name: Impaired Neural Progenitor Cell-Cycle Exit and Skewed Neurogenesis
  biological_scale: CELLULAR
  description: >-
    In Ube3c-deficient murine cortex and human iPSC-derived brain organoids, loss
    of UBE3C shifts the cellular composition of the cortex, favoring neurogenesis
    and suppressing glial fate, with neural progenitors failing to exit the cell
    cycle normally. The defect is reversible in vivo in mouse by the METTL3
    inhibitor STM2457, which is a preclinical proof of mechanism and not a
    treatment.
  cell_types:
  - preferred_term: cortical neural progenitor / radial glial cell
    term:
      id: CL:0000047
      label: neural stem cell
  biological_processes:
  - preferred_term: nervous system development
    term:
      id: GO:0007399
      label: nervous system development
    modifier: ABNORMAL
  downstream:
  - target: Global Neurodevelopmental Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - epitranscriptomic_corticogenesis
    description: >-
      Disrupted corticogenesis is the proposed developmental route to the
      clinical phenotype under the emerging model.
  evidence:
  - reference: DOI:10.1101/2025.04.09.646620
    reference_title: "UBE3C links ubiquitin signaling to epitranscriptomic control of cortical neurogenesis (bioRxiv preprint, not peer reviewed)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "with its loss favoring neurogenesis and suppressing glial fate"
    explanation: >-
      Preprint evidence for the neurogenic/gliogenic imbalance in mouse cortex
      and human brain organoids upon UBE3C loss.
  - reference: DOI:10.1101/2025.04.09.646620
    reference_title: "UBE3C links ubiquitin signaling to epitranscriptomic control of cortical neurogenesis (bioRxiv preprint, not peer reviewed)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "impairs cell cycle exit, a defect reversible in vivo by the METTL3 inhibitor STM2457."
    explanation: >-
      Preprint evidence for the progenitor cell-cycle-exit defect and its
      pharmacological reversibility in mouse.

- name: Neuronal Proteostatic Vulnerability
  biological_scale: CELLULAR
  description: >-
    Neurons are long-lived and post-mitotic and cannot dilute damaged proteins by
    division, so they are the cell type in which a chronic reduction in
    proteasomal processivity is expected to be limiting. The HECT-type UBE3
    ligase family as a whole is required for cortical circuit assembly and higher
    cognitive function, which is the general reason a ligase-family defect
    presents as a neurodevelopmental syndrome. The specific neuronal consequence
    of UBE3C loss in human brain has not been measured, and this node is the
    inferential link in the canonical chain.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: ubiquitin-dependent protein catabolic process
    term:
      id: GO:0006511
      label: ubiquitin-dependent protein catabolic process
    modifier: DECREASED
  downstream:
  - target: Global Neurodevelopmental Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - proteostatic_neurodevelopment
    description: >-
      Chronic proteostatic insufficiency in developing and maturing neurons is
      the proposed route from the molecular lesion to the clinical syndrome.
  evidence:
  - reference: PMID:33182779
    reference_title: "Molecular Evolution, Neurodevelopmental Roles and Clinical Significance of HECT-Type UBE3 E3 Ubiquitin Ligases."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "we highlight that uninterrupted action of UBE3 ligases is a sine qua non for cortical circuit assembly and higher cognitive functions of the neocortex."
    explanation: >-
      Review-level support for the neurodevelopmental requirement of the UBE3
      ligase family. Marked PARTIAL and OTHER because it is an expert review
      making a family-level claim, not a UBE3C-specific experimental result.


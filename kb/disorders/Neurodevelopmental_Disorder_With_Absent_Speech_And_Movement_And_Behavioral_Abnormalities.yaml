    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 3 patients from 2 families with Angelman-like syndrome, paralog-directed candidate gene approach detected 2 LoF variants in the other candidate E3 ligase gene, UBE3C, a paralog of the Angelman syndrome E3 ligase gene, UBE3A."
    explanation: >-
      The only UBE3C-specific clinical characterization available in the
      abstract: an Angelman-like syndrome in 3 patients from 2 families.

mechanistic_hypotheses:
- hypothesis_group_id: proteostatic_neurodevelopment
  hypothesis_label: Proteasomal processivity failure model
  status: CANONICAL
  description: >-
    Loss of UBE3C removes the proteasome-docked ligase that re-ubiquitinates
    partially proteolyzed substrates, degrading proteasomal processivity and
    cytosolic protein quality control. Neurons, which cannot dilute damaged
    proteins by division, are the limiting cell type, and chronic proteostatic
    insufficiency during and after corticogenesis produces the neurodevelopmental
    syndrome. This is the mechanism that follows directly from the established
    biochemistry of the protein, but the neuronal step has not been measured in
    UBE3C-deficient human tissue.
  evidence:
  - reference: PMID:24158444
    reference_title: The E3 ubiquitin ligase UBE3C enhances proteasome processivity by ubiquitinating partially proteolyzed substrates.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Partial proteolysis is also observed when UBE3C is present but cannot ubiquitinate substrates because its active site has been mutated, it is unable to bind to the proteasome, or the substrate lacks lysine residues."
    explanation: >-
      The catalytic-dead and proteasome-binding-dead separation-of-function
      results are what make processivity failure, rather than some other UBE3C
      activity, the canonical mechanism proposed by this hypothesis.
- hypothesis_group_id: epitranscriptomic_corticogenesis
  hypothesis_label: CBLL1/m6A epitranscriptomic corticogenesis model
  status: EMERGING
  description: >-
    Loss of UBE3C stabilizes its substrate CBLL1, hyperactivating m6A mRNA
    writers in neural progenitors, impairing cell-cycle exit and skewing the
    neurogenic/gliogenic balance with disrupted cortical lamination. Supported by
    mouse forebrain and human brain organoid data in a 2025 preprint, including
    in vivo rescue by the METTL3 inhibitor STM2457. Not confirmed in human
    patient tissue, and not peer reviewed at the time of curation. The two models
    are complementary rather than competing: the same ligase loss could act both
    through general proteostasis and through this specific substrate.
  evidence:
  - reference: DOI:10.1101/2025.04.09.646620
    reference_title: "UBE3C links ubiquitin signaling to epitranscriptomic control of cortical neurogenesis (bioRxiv preprint, not peer reviewed)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "impairs cell cycle exit, a defect reversible in vivo by the METTL3 inhibitor STM2457."
    explanation: >-
      The single source for this hypothesis, including the in vivo pharmacological
      rescue that makes it testable. Preprint, not peer reviewed, which is why the
      status is EMERGING rather than ALTERNATIVE or CANONICAL.


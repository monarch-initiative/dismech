review_notes: >-
  EVIDENCE CEILING (read before adding claims). The entire published clinical
  description of NEDSMB rests on a single paper, Faqeih et al. 2023
  (PMID:36401616), which reports 3 UBE3C patients from 2 families alongside 7
  HECTD4 patients. That paper has no PMC deposit and no retrievable full text,
  so the only quotable clinical text available to this entry is its structured
  abstract. Two consequences are load-bearing here. First, the abstract's
  cohort-level sentence ("10 patients from 7 unrelated families with syndromic
  neurodevelopmental, seizure, and movement disorders and neurobehavioral
  phenotypes") describes the COMBINED HECTD4 + UBE3C cohort, not the UBE3C
  subset; every phenotype evidence item that leans on it is therefore marked
  supports: PARTIAL and says so in its explanation. The only UBE3C-specific
  clinical statement in the abstract is that the 3 patients came from 2 families
  "with Angelman-like syndrome". Second, the individual-level features that
  define the disorder's name and OMIM description (absent speech/mutism,
  tremor, ataxia, limb dystonia, aggression, hypodontia, hypotonia, obesity,
  cerebellar hypoplasia, thin corpus callosum, hearing impairment, coxa valga,
  accelerated skeletal maturation, intermittent diarrhoea) appear only in the
  paper's full text, and reach public curation through the OMIM:620270 clinical
  synopsis (mirrored in MedGen C5830319 / MONDO:0859519). Those phenotypes are
  curated here WITHOUT an evidence block, each carrying a notes line naming that
  provenance, rather than with a snippet manufactured against an abstract that
  does not contain it. That is the SOP's option A, not an oversight; do not
  "fix" them by attaching the Faqeih abstract to claims it does not make.
  NAMED-ENTITY-CONFUSION. Three distinct confusions are live for this entity and
  each was checked. (1) UBE3A vs UBE3C. The disorder was found precisely because
  it mimics Angelman syndrome, and UBE3C is UBE3A's paralog. No UBE3A/Angelman
  finding is used here to support a UBE3C phenotype or mechanism; UBE3A appears
  only in explicitly comparative statements and in differential_diagnoses.
  (2) HECTD4 vs UBE3C. The founding paper reports two genes and two disorders.
  HECTD4 findings are never used for UBE3C claims; where a quoted sentence spans
  both genes it is flagged in the explanation. (3) Biallelic recessive NEDSMB vs
  heterozygous UBE3C autism susceptibility. De novo and inherited heterozygous
  UBE3C variants have been reported as autism risk alleles, a genetically and
  mechanistically separate relationship. It is recorded here only as a
  SUSCEPTIBILITY genetic entry with its own rationale, and is not merged into
  the recessive disease. (4) UBE3C-LRP5 fusion in distal hereditary motor
  neuropathy (kb/disorders/Distal_Hereditary_Motor_Neuronopathy_Autosomal_Dominant.yaml)
  is a third, unrelated UBE3C-implicating entity and is not conflated here.
  CONSANGUINITY IS DELIBERATELY NOT ASSERTED. Secondary sources, and both
  deep-research reports run for this entry, describe the reported kindreds as
  consanguineous (Saudi and Turkish), and consanguinity would be the expected
  ascertainment context for a homozygous recessive disorder - a reviewer has
  already asked once why it is missing. It is recorded here rather than curated
  because no snippet-verifiable source states it: the word does not appear in the
  PMID:36401616 abstract, that paper has no retrievable full text, and the
  OMIM:620270 / MedGen C5830319 description does not mention it. Both DR reports
  attribute it to an uncited "[search result]", which is the same provenance as
  the 185-kb deletion allele this entry also declines. A curator with access to
  the full text should promote it to the inheritance description with a citation;
  until then its absence is a decision, not an omission.
  PREPRINT USE. The cortical-neurogenesis mechanism (CBLL1/m6A/METTL3) comes from
  Borisova et al., a bioRxiv preprint (DOI:10.1101/2025.04.09.646620) that had
  not entered PubMed at the time of curation. It is cited only for
  model-system claims, is labelled a preprint in every reference_title, carries
  its own HUMAN_MODEL_MISMATCH discussion, and is deliberately curated as an
  EMERGING mechanistic hypothesis rather than as established disease mechanism.

inheritance:
- name: Autosomal recessive inheritance
  description: >-
    The disorder is caused by biallelic UBE3C loss-of-function variants: 2
    loss-of-function variants across 3 patients from 2 families, i.e. one
    homozygous allele per family. No compound-heterozygous UBE3C patient is
    reported in the cited literature, and none is asserted here. Consanguinity in
    the reported kindreds is deliberately not asserted; see the CONSANGUINITY
    paragraph in the entry's review_notes for why.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:36401616
    reference_title: "Biallelic variants in HECT E3 paralogs, HECTD4 and UBE3C, encoding ubiquitin ligases cause neurodevelopmental disorders that overlap with Angelman syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HECTD4 and UBE3C are novel biallelic rare disease genes, expand the association of the other HECT E3 ligase group with neurodevelopmental syndromes, and could explain some of the missing heritability in patients with a suggestive clinical diagnosis of Angelman syndrome."
    explanation: >-
      The founding report classifies UBE3C as a biallelic rare disease gene,
      i.e. autosomal recessive.


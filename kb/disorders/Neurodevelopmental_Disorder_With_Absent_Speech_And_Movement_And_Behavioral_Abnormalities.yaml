name: Neurodevelopmental Disorder With Absent Speech and Movement and Behavioral Abnormalities
creation_date: "2026-08-20T00:00:00Z"
category: Mendelian
description: >-
  Neurodevelopmental disorder with absent speech and movement and behavioral
  abnormalities (NEDSMB) is an ultra-rare autosomal recessive syndrome caused by
  biallelic loss-of-function variants in UBE3C, which encodes a HECT-type E3
  ubiquitin ligase that docks on the 26S proteasome and is the closest human
  paralog of the Angelman syndrome gene UBE3A. The entity was delineated in 2023
  by Faqeih et al., who applied a paralog-directed candidate gene approach to
  patients carrying a clinical diagnosis of Angelman syndrome in whom the
  standard UBE3A/15q11-q13 workup was negative, and identified biallelic UBE3C
  loss-of-function variants in 3 patients from 2 families. The
  reported picture is global developmental delay from early infancy, severely
  impaired intellectual development with absent speech, a movement disorder
  (tremor, ataxia, limb dystonia), and prominent behavioral disturbance
  including aggression, together with mild dysmorphic features and hypodontia.
  Mechanistically, UBE3C is the ligase that ubiquitinates partially proteolyzed
  substrates already engaged by the proteasome, so its loss degrades proteasomal
  processivity and cytosolic protein quality control; an emerging, model-system
  arm links UBE3C loss to stabilization of the substrate CBLL1, hyperactivation
  of m6A writers, and failure of neural progenitor cell-cycle exit during
  corticogenesis.
synonyms:
- NEDSMB
- UBE3C-related neurodevelopmental disorder
- UBE3C deficiency
- Angelman-like syndrome due to biallelic UBE3C loss of function

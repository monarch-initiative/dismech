  description: >-
    The clinical endpoint: global developmental delay from early infancy,
    severely impaired intellectual development with absent speech, a movement
    disorder and behavioral abnormalities, presenting closely enough to Angelman
    syndrome that all reported patients had been given that clinical diagnosis
    before molecular testing.

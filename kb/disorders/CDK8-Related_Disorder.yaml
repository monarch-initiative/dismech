prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Ultra-rare. The syndrome-defining cohort comprised 12 individuals with 8 different
    de novo CDK8 variants; additional cases have since been reported. No population-based
    prevalence estimate is available.
  evidence:
  - reference: PMID:30905399
    reference_title: "De Novo Missense Substitutions in the Gene Encoding CDK8, a Regulator of the Mediator Complex, Cause a Syndromic Developmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All predicted substitutions localize to the ATP-binding pocket of the kinase domain."
    explanation: Documents the mutational mechanism in the defining cohort establishing CDK8 as an ultra-rare disease gene.
pathophysiology:
- name: CDK8 kinase module dysfunction
  description: >
    CDK8 is the catalytic kinase of the CDK8 kinase module (CKM), the dissociable regulatory
    cap of the Mediator complex. Disease-causing de novo missense variants cluster in the
    ATP-binding pocket of the kinase domain and behave as hypomorphic alleles, reducing
    phosphorylation of CDK8 substrates (e.g., STAT1-Ser727) and disrupting Mediator-dependent
    transcriptional regulation of developmental gene-expression programs. CDK8 belongs to the
    group of CDK8-kinase module-associated disease genes, alongside CDK19, MED12, MED12L, MED13,
    and MED13L.
  genes:
  - preferred_term: CDK8
    term:
      id: hgnc:1779
      label: CDK8
  biological_processes:
  - preferred_term: transcription by RNA polymerase II
    term:
      id: GO:0006366
      label: transcription by RNA polymerase II
  - preferred_term: regulation of gene expression
    term:
      id: GO:0010468
      label: regulation of gene expression
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:30905399
    reference_title: "De Novo Missense Substitutions in the Gene Encoding CDK8, a Regulator of the Mediator Complex, Cause a Syndromic Developmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All predicted substitutions localize to the ATP-binding pocket of the kinase domain."
    explanation: Localizes the pathogenic CDK8 substitutions to the kinase active site, supporting a kinase-activity loss mechanism.
  downstream:
  - target: Neurodevelopmental transcriptional dysregulation
    description: >-
      Reduced CDK8 kinase activity disrupts Mediator-dependent transcription of
      neurodevelopmental gene-expression programs.
  - target: Cardiac and structural developmental dysregulation
    description: >-
      CKM dysfunction perturbs cardiac and other developmental programs, contributing to
      congenital heart disease and structural anomalies.
- name: Neurodevelopmental transcriptional dysregulation
  description: >
    Downstream of CDK8 kinase dysfunction, neuronal gene-expression programs are dysregulated
    during brain development, contributing to hypotonia, intellectual disability, and behavioral
    abnormalities.

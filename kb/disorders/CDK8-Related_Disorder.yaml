discussions:
- discussion_id: dominant_negative_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: How do catalytically impaired CDK8 proteins cause dominant disease while retaining module association?
  attaches_to:
  - pathophysiology#Nonproductive Mediator Kinase Module Occupancy
  - pathophysiology#Reduced CDK8 Kinase Activity
  rationale: Missense clustering, retained stability and reduced catalysis motivate a model in which nonproductive modules compete with active ones. The reference/Ser62Leu mixing experiment did not clearly depart from linearity. CDK19 interference, developmental substrate specificity and simple dosage reduction remain distinguishable possibilities rather than demonstrated equivalences.

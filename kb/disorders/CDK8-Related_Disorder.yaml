    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital heart disease occurred in six subjects; additional features present in multiple individuals included agenesis of the corpus callosum, ano-rectal malformations, seizures, and hearing"
    explanation: Documents congenital heart disease and additional structural anomalies in the CDK8 cohort.
  downstream:

notes: Clinical frequencies refer to selected cohorts and their assessed denominators, not population prevalence or penetrance. Original 2019 case-level data are retained where the 2020 secondary table recounted them inconsistently; later cases are described separately. No established clinical subtypes or validated allele-specific prognostic categories follow from these small series. The publisher-hosted mmc1 PDF is the complete supplemental material for PMID:30905399 and supplies detailed clinical courses and treatments; its generated reference title remains the PDF URL. Progressive contractures and scoliosis in the maternally inherited Arg200Gln case broaden the observed range without establishing uniform progression. Treatment observations are individual reports, not controlled efficacy studies. No disorder-specific GeneReviews chapter or congenital-disease intervention trial was identified; cancer trials of kinase inhibitors do not establish treatment of this developmental condition.

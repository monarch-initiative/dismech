  rationale: Residual STAT1 phosphorylation differs among the founding alleles, and Asn156Ser reduced autophosphorylation more than Gly28Ala despite the latter child having more severe clinical findings. Small numbers, age differences, distinct assays and additional variation preclude a validated activity–severity relationship.

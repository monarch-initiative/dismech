- discussion_id: individual_feature_attribution
  kind: INTERPRETATION
  status: OPEN
  prompt: Which uncommon findings are reproducible CDK8-associated features rather than individual or multilocus observations?
  attaches_to:
  - genetic#CDK8
  - phenotypes#Metopic Synostosis
  - phenotypes#Decreased CSF Homovanillic Acid
  rationale: The Val27Leu case also carried a CACNA1A variant of uncertain significance and mosaic HDAC9 truncation, while the Gly30Ser case carried additional uncertain variation including COL3A1. The authors did not establish these as modifiers. Metopic synostosis and low CSF homovanillic acid remain isolated findings with uncertain mechanistic attribution; neither proves a uniform craniosynostosis or dopamine-synthesis mechanism.

      snippet: "Affected individuals have overlapping phenotypes characterized by hypotonia, mild to moderate intellectual disability, behavioral disorders, and variable facial dysmorphism."
      explanation: Supports classification as a neurodevelopmental / neurologic disorder.
prevalence:
- population: Founding 2019 international clinical cohort
  measure_type: CASES_IN_LITERATURE
  notes: Twelve unrelated individuals carried eight distinct missense substitutions; ten had confirmed de novo variants, while paternal samples were unavailable in two recurrent-allele cases. This selected cohort and subsequent reports do not establish population prevalence.
  evidence:
  - reference: PMID:30905399
    reference_title: De Novo Missense Substitutions in the Gene Encoding CDK8, a Regulator of the Mediator Complex, Cause a Syndromic Developmental Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: we identified eight different heterozygous missense CDK8 substitutions, including 10 shown to have arisen de novo, in 12 unrelated subjects
    explanation: Founding cohort size and confirmed inheritance.
pathophysiology:
- name: CDK8 Coding Missense Substitutions
  description: Heterozygous coding single-nucleotide substitutions alter conserved residues in or near the ATP-binding pocket. Their physical sequence changes are distinct from the resulting catalytic and developmental effects.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:30905399
    reference_title: De Novo Missense Substitutions in the Gene Encoding CDK8, a Regulator of the Mediator Complex, Cause a Syndromic Developmental Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: we identified eight different heterozygous missense CDK8 substitutions, including 10 shown to have arisen de novo, in 12 unrelated subjects
    explanation: Physical variant class in affected individuals.

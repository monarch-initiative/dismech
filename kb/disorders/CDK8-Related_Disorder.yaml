  rationale: STAT1 phosphorylation is a measured cell-assay readout, while candidate WNT, TGFβ/BMP, SHH and NOTCH changes were not demonstrated in these patients. Fish chemical inhibition affects both CDK8 and CDK19. Patient-derived cell studies are needed before assigning a specific developmental signaling defect or generalizing paralog-specific mitochondrial results to CDK8 disease.

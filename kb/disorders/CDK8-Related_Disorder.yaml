    description: Disrupted neuronal developmental programs contribute to intellectual disability.
  - target: Hypotonia
    description: Disrupted neurodevelopmental programs contribute to hypotonia.
  - target: Behavioral abnormalities
    description: Neurodevelopmental transcriptional dysregulation contributes to autism spectrum disorder and ADHD.
  - target: Facial dysmorphism
    description: Disrupted craniofacial developmental programs contribute to variable facial dysmorphism.
- name: Cardiac and structural developmental dysregulation
  description: >
    CDK8 kinase-module dysfunction perturbs cardiac and other developmental transcriptional
    programs, contributing to congenital heart disease (in about half of individuals) and
    additional structural anomalies including corpus callosum agenesis and ano-rectal
    malformations.
  cell_types:

genetic:
- name: CDK8
  association: Heterozygous kinase-domain missense variants cause a variable developmental disorder. De novo occurrence predominates in the founding series, but maternal transmission of Arg200Gln to an affected child establishes that inheritance is possible.
  gene_term:
    preferred_term: CDK8
    term:
      id: hgnc:1779
      label: CDK8
  inheritance:
  - name: Autosomal Dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:30905399
      reference_title: "De Novo Missense Substitutions in the Gene Encoding CDK8, a Regulator of the Mediator Complex, Cause a Syndromic Developmental Disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here, using whole-exome or whole-genome sequencing and by international collaboration, we report de novo mutations in CDK8, which has not been previously associated with a congenital disorder, in 12 unrelated individuals with overlapping phenotypes."
      explanation: Heterozygous de novo CDK8 missense variants are consistent with autosomal dominant inheritance.
    - reference: PMID:38193604
      reference_title: 'Expanding the phenotypic spectrum for CDK8-related disease: A case report.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: a likely pathogenic heterozygous CDK8 variant c.599G>A, p.(Arg200Gln) inherited from the biological mother
      explanation: Documented maternal transmission.
    description: Autosomal dominant inheritance includes both de novo and inherited variants. In the founding cohort, ten of twelve variants were confirmed de novo; two fathers were unavailable. A later mother-child pair shared a likely pathogenic Arg200Gln variant. Penetrance and recurrence rates have not been quantified.
  evidence:
  - reference: PMID:30905399
    reference_title: De Novo Missense Substitutions in the Gene Encoding CDK8, a Regulator of the Mediator Complex, Cause a Syndromic Developmental Disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: we identified eight different heterozygous missense CDK8 substitutions, including 10 shown to have arisen de novo, in 12 unrelated subjects
    explanation: Case-level genetic evidence.
  - reference: PMID:38193604
    reference_title: 'Expanding the phenotypic spectrum for CDK8-related disease: A case report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The clinical presentation of the child and mother is within the described clinical spectrum for IDDHBA
    explanation: Both generations were clinically affected.
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: G2P
    external_id: G2P02783
    notes: G2P assertion SGC-124667.1 in GenCC, evaluated September 18, 2019. The attribution is to G2P rather than an independent ClinGen assertion.
    evidence:
    - reference: url:https://thegencc.org/submissions/SGC-124667.1
      reference_title: CDK8 | intellectual developmental disorder with hypotonia and behavioral abnormalities | Autosomal dominant by G2P submission information facts
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      directness: DIRECT
      snippet: 'Classification: ... Definitive ... Gene: ... CDK8 ... Disease: ... intellectual developmental disorder with hypotonia and behavioral abnormalities'
      explanation: External G2P classification.
  notes: The initial molecularly studied alleles are missense substitutions concentrated around the kinase active site. These data do not establish pathogenicity of all CDK8 truncating alleles or multigene deletions. Some founding subjects had additional uncertain variants; their individual findings should not automatically be attributed exclusively to CDK8.
  variants:
  - name: c.185C>T (p.Ser62Leu)
    description: Recurrent alpha-C-helix allele in five founding subjects; de novo status was confirmed in three, while paternal samples were unavailable in two. STAT1 phosphorylation was markedly reduced.
    evidence:
    - reference: PMID:30905399
      reference_title: De Novo Missense Substitutions in the Gene Encoding CDK8, a Regulator of the Mediator Complex, Cause a Syndromic Developmental Disorder.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: a recurrent mutation, c.185C>T (p.Ser62Leu), was present in five individuals
      explanation: Recurrence in the original cohort.
  - name: p.Val27Leu, p.Arg29Gly and p.Gly30Ser
    description: Founding glycine-rich-loop substitutions c.79G>C, c.85C>G and c.88G>A. Kinase output was reduced without evidence of gross misfolding.
    evidence:
    - reference: PMID:30905399
      reference_title: De Novo Missense Substitutions in the Gene Encoding CDK8, a Regulator of the Mediator Complex, Cause a Syndromic Developmental Disorder.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: are clustered in the Gly-rich loop (amino acids 27–35), a highly conserved protein-kinase motif
      explanation: Variant positions.
  - name: c.291T>G (p.Phe97Leu) and c.669A>G (p.Ile223Met)
    description: These founding alleles retained approximately 63% and 51% of reference STAT1 phosphorylation in the cell assay, respectively. Relative assay activity does not establish a clinical severity ranking.
    evidence:
    - reference: PMID:30905399
      reference_title: De Novo Missense Substitutions in the Gene Encoding CDK8, a Regulator of the Mediator Complex, Cause a Syndromic Developmental Disorder.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: an intermediate level of phosphorylation (∼63% and ∼51% in comparison to the WT, respectively), was observed
      explanation: Residual activity in two alleles.
  - name: c.533G>A (p.Arg178Gln) and c.578T>G (p.Val193Gly)
    description: Activation-segment alleles from the founding series, with reduced kinase output. Arg178Gln was also investigated by molecular-dynamics simulation.
    evidence:
    - reference: PMID:30905399
      reference_title: De Novo Missense Substitutions in the Gene Encoding CDK8, a Regulator of the Mediator Complex, Cause a Syndromic Developmental Disorder.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Two substitutions, c.533G>A (p.Arg178Gln) and c.578T>G (p.Val193Gly), affect amino acids located in the activation segment
      explanation: Structural localization.
  - name: c.83G>C (p.Gly28Ala) and c.467A>G (p.Asn156Ser)
    description: De novo alleles in two additional patients with lower autophosphorylation activity. Asn156Ser reduced the assay readout more strongly than Gly28Ala; developmental severity in two differently aged patients cannot validate an activity-severity correlation.
    evidence:
    - reference: PMID:33067521
      reference_title: 'Pathogenesis of CDK8-associated disorder: two patients with novel CDK8 variants and in vitro and in vivo functional analyses of the variants.'
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Both the CDK8-G28A and CDK8-N156S mutations resulted in lower kinase activities compared with CDK8-WT
      explanation: Functional analysis of the later alleles.
  - name: c.599G>A (p.Arg200Gln)
    description: Likely pathogenic variant transmitted from an affected mother to her child. Progressive hip and knee contractures and scoliosis were reported in the child but not the mother.
    evidence:
    - reference: PMID:38193604
      reference_title: 'Expanding the phenotypic spectrum for CDK8-related disease: A case report.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: a likely pathogenic heterozygous CDK8 variant c.599G>A, p.(Arg200Gln) inherited from the biological mother
      explanation: Inherited allele and reported classification.
    clinical_significance: LIKELY_PATHOGENIC

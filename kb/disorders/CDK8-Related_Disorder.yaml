  - target: Altered Substrate-Binding Geometry
    description: Ser62Leu and Arg178Gln change substrate-pocket dynamics in computational simulations.
    causal_link_type: DIRECT
  - target: Reduced CDK8 Kinase Activity
    description: Tested missense variants reduce catalytic readouts.
    causal_link_type: DIRECT
- name: Altered Substrate-Binding Geometry
  description: Molecular-dynamics models of Ser62Leu and Arg178Gln predict a less open substrate-binding region. Gross protein misfolding and loss of ATP binding were not observed in biochemical studies; restricted substrate access remains a mechanistic interpretation.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:30905399
    reference_title: De Novo Missense Substitutions in the Gene Encoding CDK8, a Regulator of the Mediator Complex, Cause a Syndromic Developmental Disorder.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: the substrate-binding site of the WT CDK8 protein can adopt more open conformations than its mutated counterparts
    explanation: Structural-dynamics prediction.
  downstream:
  - target: Reduced CDK8 Kinase Activity
    description: Restricted substrate access could reduce phosphoryl transfer despite retained ATP binding.
    causal_link_type: DIRECT
- name: Reduced CDK8 Kinase Activity
  description: Tested alleles reduce kinase output. Most founding variants approach the kinase-dead control in the STAT1 assay, whereas Phe97Leu and Ile223Met retain intermediate activity. Gly28Ala and Asn156Ser also reduce autophosphorylation. Protein stability and cyclin-C binding are retained, so this is not equivalent to complete loss of the gene product.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:30905399
    reference_title: De Novo Missense Substitutions in the Gene Encoding CDK8, a Regulator of the Mediator Complex, Cause a Syndromic Developmental Disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: We observed that the cellular levels of pSTAT1 were reduced to a statistically significant extent, compared to WT, in all mutant-transfected cells
    explanation: Variant activity in a double-knockout cell background.
  - reference: PMID:33067521
    reference_title: 'Pathogenesis of CDK8-associated disorder: two patients with novel CDK8 variants and in vitro and in vivo functional analyses of the variants.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Both the CDK8-G28A and CDK8-N156S mutations resulted in lower kinase activities compared with CDK8-WT
    explanation: Autophosphorylation assay of later variants.
  role: central_effector

name: CDK8-Related Disorder
creation_date: '2026-07-31T00:00:00Z'
category: Mendelian
synonyms:
- Intellectual developmental disorder with hypotonia and behavioral abnormalities
- IDDHBA
- CDK8-associated neurodevelopmental disorder
- CDK8-related syndromic developmental disorder
description: >
  CDK8-related disorder (IDDHBA) is a rare autosomal dominant neurodevelopmental disorder
  caused by heterozygous de novo missense variants in CDK8, which encodes the catalytic
  cyclin-dependent kinase of the CDK8 kinase module of the Mediator transcriptional
  coactivator complex. The kinase module is a dissociable four-subunit cap (a CDK8 or CDK19
  kinase, cyclin C, a MED12 or MED12L scaffold, and a MED13 or MED13L subunit) that reversibly
  associates with core Mediator to gate RNA polymerase II transcription. Disease-causing CDK8
  substitutions localize to the ATP-binding pocket of the kinase domain and act as
  hypomorphic/partial loss-of-function alleles that reduce phosphorylation of CDK8 substrates.
  Affected individuals have hypotonia, mild-to-moderate intellectual disability, behavioral
  abnormalities (autism spectrum disorder and/or ADHD), and variable facial dysmorphism, with
  congenital heart disease in roughly half and additional features including agenesis of the
  corpus callosum, ano-rectal malformations, seizures, and hearing loss.

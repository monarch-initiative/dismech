- name: Reduced STAT1 Ser727 Phosphorylation
  description: Variant CDK8 produces less STAT1 Ser727 phosphorylation in SW620 cells lacking both endogenous CDK8 and CDK19. This is a measured biochemical readout, not evidence that STAT1 deficiency or immune dysfunction is the clinical disease mechanism.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:30905399
    reference_title: De Novo Missense Substitutions in the Gene Encoding CDK8, a Regulator of the Mediator Complex, Cause a Syndromic Developmental Disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: We observed that the cellular levels of pSTAT1 were reduced to a statistically significant extent, compared to WT, in all mutant-transfected cells
    explanation: Direct substrate readout.
- name: Nonproductive Mediator Kinase Module Occupancy
  description: 'Retained cyclin-C/module association despite impaired catalysis could reduce availability of productive kinase modules. This proposed dominant-negative route remains unconfirmed: mixing reference and Ser62Leu constructs did not show a clearly nonlinear reduction in STAT1 phosphorylation.'
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  evidence:
  - reference: PMID:30905399
    reference_title: De Novo Missense Substitutions in the Gene Encoding CDK8, a Regulator of the Mediator Complex, Cause a Syndromic Developmental Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: we predict that up to 50% of CDK8 modules could be present in a kinase-inactive, non-productive state
    explanation: Authors explicitly frame this as a prediction.
  - reference: PMID:30905399
    reference_title: De Novo Missense Substitutions in the Gene Encoding CDK8, a Regulator of the Mediator Complex, Cause a Syndromic Developmental Disorder.
    supports: NO_EVIDENCE
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: the observed reduction in phosphorylation in mixed samples did not obviously deviate from a linear response
    explanation: The mixing assay did not establish a dominant-negative interaction.
  downstream:
  - target: Altered Developmental Transcription
    description: Competition between productive and nonproductive modules could impair transcriptional regulation if the active module is limiting.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Altered Developmental Transcription
  description: CDK8 regulates transcription through Mediator and phosphorylation of multiple regulators. The relevant altered expression programs in patient neural and cardiac cells have not been identified. Candidate developmental pathways should not be treated as measured patient defects.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  evidence:
  - reference: PMID:30905399

- discussion_id: null_missense_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: Why do viable heterozygous human missense alleles differ from mouse Cdk8 gene-trap loss?
  attaches_to:
  - genetic#CDK8
  rationale: Homozygous mouse loss arrests preimplantation development, and heterozygotes lacked a reported overt phenotype. Neither outcome models the human missense syndrome directly. The heterozygote observation supports caution about simple haploinsufficiency but does not provide a complete neurobehavioral assessment or establish benignity of every human loss-of-function variant.

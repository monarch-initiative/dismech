name: Olmsted Syndrome 2
creation_date: "2026-10-24T01:30:00Z"
description: >-
  Olmsted syndrome 2 (OLMS2) is the autosomal dominant, PERP-related form of
  Olmsted syndrome: a severe palmoplantar keratoderma with periorificial
  keratotic plaques. It is caused by heterozygous nonsense variants clustered in
  the last exon of PERP (p.Trp151* and p.Tyr153*), which encodes a p53/p63
  target tetraspan membrane protein that is a component of desmosomes. Because
  the premature stop lies in the terminal exon, the mutant transcript escapes
  nonsense-mediated decay and a truncated protein is made; in patient
  keratinocytes it reaches the membrane but is enriched in the detergent-soluble
  fraction, consistent with unstable incorporation into desmosomes. Patient skin
  shows immature desmosomes lacking the electron-dense midline, cultured
  keratinocyte sheets fragment more under mechanical stress, and the epidermis
  is hyperproliferative with acanthosis and hyperkeratosis. Reported patients
  also have cheilitis, keratotic plaques in flexures and on the buttocks,
  hyperkeratotic nails and woolly, often yellow, hair. The same gene causes a
  recessive erythrokeratoderma (EKVP7) through biallelic loss of expression,
  which this knowledge base curates as a subtype of Erythrokeratodermia
  Variabilis.
category: Mendelian
synonyms:
- OLMS2
- palmoplantar keratoderma, mutilating, with periorificial keratotic plaques 2
parents:
- Olmsted syndrome

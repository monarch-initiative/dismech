genetic:
- name: PERP
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: PERP
    term:
      id: hgnc:17637
      label: PERP
  features: >-
    Heterozygous nonsense variants in the last exon of PERP, clustered at
    codons 151 and 153, which escape nonsense-mediated decay and produce a
    C-terminally truncated protein.
  notes: >-
    No ClinGen gene-disease validity record for PERP is present in the ClinGen
    export cached in this repository, so gene_disease_validity is left absent.
    The pathophysiology nodes PERP lands on carry no molecular_functions term:
    GO records no specific molecular function for PERP (its only molecular
    function annotations in QuickGO are generic protein binding, GO:0005515,
    from interaction assays), so no informative term is available to bind.
  variants:
  - name: PERP p.Trp151*
    description: >-
      Nonsense variant in the terminal exon, reported with two different
      nucleotide changes (c.452G>A and c.453G>A) in unrelated families,
      including one transmitted from an affected father to his daughter.
    gene:
      preferred_term: PERP
      term:
        id: hgnc:17637
        label: PERP
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:30321533
      reference_title: "Mutations in PERP Cause Dominant and Recessive Keratoderma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "one which is de novo and one which is inherited from an affected parent, conclusively demonstrates that these mutations cause OS"
      explanation: Segregation and recurrence across unrelated probands establish pathogenicity of the clustered truncations.
  - name: PERP p.Tyr153*
    description: >-
      Nonsense variant in the terminal exon (c.459C>G in the founding report),
      two residues downstream of p.Trp151*.
    gene:
      preferred_term: PERP
      term:
        id: hgnc:17637
        label: PERP
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:30321533
      reference_title: "Mutations in PERP Cause Dominant and Recessive Keratoderma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "four OS subjects were found to be heterozygous for a nonsense mutation in the last exon of PERP (p.Trp151* or p.Tyr153*)"
      explanation: Identifies p.Tyr153* as one of the two causal truncations.
  evidence:
  - reference: PMID:30321533
    reference_title: "Mutations in PERP Cause Dominant and Recessive Keratoderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we show that mutations in PERP, encoding a crucial component of desmosomes, cause both dominant and recessive human keratoderma."
    explanation: Establishes PERP as the causal gene for the dominant keratoderma.
  - reference: PMID:37510397
    reference_title: "Integration of Phenotype Term Prioritization and Gene Expression Analysis Reveals a Novel Variant in the PERP Gene Associated with Autosomal Recessive Erythrokeratoderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Three of these variants have been linked to dominant inheritance, generally associated with more aggressive and severe phenotypes within Olmsted syndrome"
    explanation: A later report's background summary of the dominant PERP variants and their Olmsted syndrome phenotype.
animal_models:
- name: Perp-null mouse
  species: Mouse
  genotype: Perp-/- (constitutive null)
  publication: PMID:15797384
  description: >-
    Constitutive Perp knockout mice die postnatally with blistering of
    stratified epithelia and structural desmosome defects. The model is a
    null allele and so corresponds to the recessive loss-of-function PERP
    disease rather than to the dominant C-terminal truncation of this entry.
  evidence:
  - reference: PMID:15797384
    reference_title: "Perp is a p63-regulated gene essential for epithelial integrity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Perp-/- mice die postnatally, with dramatic blistering in stratified epithelia symptomatic of compromised adhesion."
    explanation: Describes the adhesion phenotype of the null mouse.
  modeled_mechanisms:
  - target: Immature Desmosomes Lacking the Electron-Dense Midline
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Perp-deficient skin carries numerous structural desmosome defects.
    limitations: >-
      A null allele, not the dominant last-exon truncation; heterozygous Perp
      mice have no reported phenotype, so the dominant disease is not modeled.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        The OLMS2 lesion is a truncated PERP protein made from one allele. The
        model removes PERP entirely from both alleles, so it shows what loss of
        PERP does to desmosomes, not what the truncated protein does.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The desmosome observations are made in mouse stratified epithelia,
        not in the human palmoplantar and periorificial skin affected in OLMS2.
    evidence:
    - reference: PMID:15797384
      reference_title: "Perp is a p63-regulated gene essential for epithelial integrity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Perp localizes specifically to desmosomes, adhesion junctions important for tissue integrity, and numerous structural defects in desmosomes are observed in Perp-deficient skin"
      explanation: Desmosome defects in Perp-deficient mouse skin, the model counterpart of the immature desmosomes seen in patient skin.
  - target: Impaired Keratinocyte Adhesion Under Mechanical Stress
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: The null mouse blisters, a stronger adhesion failure than is seen clinically in OLMS2.
    limitations: >-
      Blistering is not reported in OLMS2 patients; the null allele produces a
      more severe adhesion failure than the dominant truncation.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        Complete loss of PERP stands in for a truncated protein expressed from
        one allele, which changes the severity of the adhesion defect.
    evidence:
    - reference: PMID:15797384
      reference_title: "Perp is a p63-regulated gene essential for epithelial integrity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Perp-/- mice die postnatally, with dramatic blistering in stratified epithelia symptomatic of compromised adhesion."
      explanation: Shows that loss of Perp compromises epithelial adhesion in vivo.
- name: Stratified-epithelium Perp conditional knockout mouse
  species: Mouse
  genotype: Perp conditional knockout with keratin 5 Cre
  publication: PMID:16417219
  description: >-
    Ablation of Perp in stratified epithelia reproduces the blistering,
    hyperproliferation and early postnatal death of the constitutive null,
    showing that these reflect a role of Perp within stratified epithelium.
  evidence:
  - reference: PMID:16417219
    reference_title: "The requirement for perp in postnatal viability and epithelial integrity reflects an intrinsic role in stratified epithelia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the majority of mice lacking Perp in stratified epithelia die within 10 days after birth, accompanied by blistering and hyperproliferation in the epithelia"
    explanation: Describes the phenotype of the epithelium-specific knockout.
  modeled_mechanisms:
  - target: Epidermal Hyperproliferation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Loss of Perp in stratified epithelia makes the epithelium hyperproliferative.
    limitations: >-
      A biallelic loss-of-function model with early lethality; the dominant
      truncation of OLMS2 is not modeled.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        Hyperproliferation here follows complete loss of Perp, whereas in OLMS2
        a truncated protein is present and the route to hyperproliferation is
        not known.
    evidence:
    - reference: PMID:16417219
      reference_title: "The requirement for perp in postnatal viability and epithelial integrity reflects an intrinsic role in stratified epithelia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "the majority of mice lacking Perp in stratified epithelia die within 10 days after birth, accompanied by blistering and hyperproliferation in the epithelia"
      explanation: Hyperproliferation of Perp-deficient stratified epithelium in vivo.
notes: >-
  Two follow-up reports of dominant PERP Olmsted syndrome, PMID:31361044 (with
  alopecia universalis) and PMID:34265120 (a recurrent c.459C>A change with
  congenital hypotrichosis, atopic dermatitis and growth retardation), are
  letters whose PubMed records carry no abstract, and no quotable text was
  retrieved for either on the fetches made for this entry; the features named
  here are taken from their titles only. They are therefore not curated as
  phenotypes; they are leads for a curator with full-text access. In the
  founding series the heart was evaluated in two subjects (cardiac ultrasound
  in a child, echocardiogram at age 39) and was normal, and one child had no
  pain. No treatment outcome has been reported for a PERP-genotyped patient. Erlotinib
  and sirolimus responses in Olmsted syndrome (PMID:31895414) were reported in
  children whose genotype the abstract does not state, so no treatment is
  curated here.

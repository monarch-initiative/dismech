- name: Epidermal Hyperproliferation
  description: >-
    Skin from the Olmsted syndrome subject has a higher proportion of Ki67
    positive cells in the basal layer of the interfollicular epidermis and more
    dermal mast cells than control skin. Unlike TRPV3-related Olmsted syndrome,
    no apoptotic keratinocytes were detected by activated caspase 3 staining.

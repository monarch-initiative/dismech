      label: Autosomal dominant inheritance
  description: >-
    Heterozygous C-terminal PERP truncations cause the disease. In the founding
    series one allele arose de novo and one was transmitted from an affected
    father to his daughter. Heterozygous carriers of N-terminal PERP truncations
    are unaffected, so the dominant disease depends on the allele class rather
    than on a single dose of PERP.
  evidence:
  - reference: PMID:30321533
    reference_title: "Mutations in PERP Cause Dominant and Recessive Keratoderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygosity for a C-terminal truncation, which produces a protein that appears to be unstably incorporated into desmosomes, causes Olmsted syndrome with severe periorificial and palmoplantar keratoderma in multiple unrelated kindreds."
    explanation: States that a single heterozygous allele is sufficient for Olmsted syndrome in several unrelated families.
  - reference: PMID:30321533
    reference_title: "Mutations in PERP Cause Dominant and Recessive Keratoderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "one which is de novo and one which is inherited from an affected parent, conclusively demonstrates that these mutations cause OS"
    explanation: Documents both a de novo occurrence and parent-to-child transmission of the heterozygous allele.
pathophysiology:
- name: PERP Last-Exon Nonsense Variant
  description: >-
    Heterozygous nonsense variants in the third and last exon of PERP,
    p.Trp151* (c.452G>A or c.453G>A) and p.Tyr153* (c.459C>G), lie within two
    residues of each other. Because they sit in the terminal exon the mutant
    transcript escapes nonsense-mediated decay, and patient keratinocytes make a
    C-terminally truncated protein. The authors argue against
    haploinsufficiency: obligate heterozygous carriers of an N-terminal
    truncation are unaffected, PERP truncating alleles occur in control
    databases, and Perp heterozygous mice have no phenotype. Their favored
    model is a combined dominant-negative and neomorphic effect, which remains
    untested.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: PERP
    term:
      id: hgnc:17637
      label: PERP
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  genetic_context:
    allele_type: nonsense variant in the terminal exon
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: UNKNOWN
    description: >-
      The functional class is recorded as unknown because the reporting
      authors propose, but do not demonstrate, a dominant-negative and
      neomorphic mechanism.
  evidence:
  - reference: PMID:30321533
    reference_title: "Mutations in PERP Cause Dominant and Recessive Keratoderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "four OS subjects were found to be heterozygous for a nonsense mutation in the last exon of PERP (p.Trp151* or p.Tyr153*)"
    explanation: Identifies the causal allele class and its position in the terminal exon.
  - reference: PMID:30321533
    reference_title: "Mutations in PERP Cause Dominant and Recessive Keratoderma."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "qRT-PCR demonstrated no deficiency in PERP RNA, consistent with terminal exon mutations escaping nonsense-mediated decay"
    explanation: Patient keratinocytes keep normal PERP mRNA levels, so the mutant transcript is not degraded.
  - reference: PMID:30321533
    reference_title: "Mutations in PERP Cause Dominant and Recessive Keratoderma."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Immunoblotting for PERP demonstrated lower molecular weight bands in Subject 1 keratinocyte lysates, consistent with expression of a truncated form"
    explanation: Shows that the truncated protein is produced in patient keratinocytes.
  - reference: PMID:30321533
    reference_title: "Mutations in PERP Cause Dominant and Recessive Keratoderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it is highly unlikely that OS in subjects with the heterozygous p.Trp151* and p.Tyr153* mutations is due to haploinsufficiency"
    explanation: The authors' conclusion against a dosage mechanism, based on unaffected carriers of a null allele.
  - reference: PMID:30321533
    reference_title: "Mutations in PERP Cause Dominant and Recessive Keratoderma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "A dominant-negative and neomorphic effect for the heterozygous, tightly clustered C-terminal truncating mutations seems most consistent with these observations."
    explanation: The proposed, untested mechanism; recorded so the UNKNOWN functional class is not read as an absence of a hypothesis.
  downstream:
  - target: Unstable Desmosomal Incorporation of Truncated PERP
    causal_link_type: DIRECT
    description: >-
      The truncated protein made from the mutant allele is the protein that
      fractionates as detergent-soluble.
    evidence:
    - reference: PMID:30321533
      reference_title: "Mutations in PERP Cause Dominant and Recessive Keratoderma."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "suggesting that the mutant protein may not be stably incorporated into desmosomes"
      explanation: The lower molecular weight, truncated bands are the ones enriched in the Triton-soluble fraction.
  - target: Epidermal Hyperproliferation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The founding study observes basal hyperproliferation in skin carrying the
      variant but does not establish whether it follows from the desmosomal
      defect or from another PERP function.
  - target: Altered Terminal Keratinocyte Differentiation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Expanded filaggrin staining was observed in skin carrying the variant; no
      intermediate step between the variant and this change has been shown.
- name: Unstable Desmosomal Incorporation of Truncated PERP
  description: >-
    In keratinocytes from a p.Tyr153* patient the truncated PERP reaches the
    plasma membrane normally but is enriched in the Triton X-100 soluble
    fraction, the behavior of a protein not stably held in desmosomes. Other
    desmosomal proteins, E-cadherin and claudin 1 keep normal solubility
    profiles, and their localization in skin is normal, which distinguishes
    this disease from desmosomal disorders in which other junction components
    are mislocalized.

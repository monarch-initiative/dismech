    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Both observations are made in the same patient, but how PERP contributes
      to desmosome maturation is not known, so the intervening steps are
      unspecified.
- name: Immature Desmosomes Lacking the Electron-Dense Midline
  conforms_to: "desmosomal_adhesion_failure#Failure of Desmosome Assembly and Intermediate Filament Anchorage"
  description: >-
    Electron microscopy of skin from a p.Tyr153* patient shows desmosomes that
    lack the electron-dense midline of mature desmosomes, shorter outer plaques
    in the lower suprabasal layer and modestly fewer desmosomes in the upper
    suprabasal layer. Inner plaques and keratin filament attachments appear
    intact, so of the two defects named by the conformance target only the
    assembly arm is evidenced here; keratin filament anchorage is not shown to
    fail.

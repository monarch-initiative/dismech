    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subject 3 is age 4 and presented within the first month of life with pink-red thickening of the palms and soles, which has progressed to confluent palmoplantar keratoderma with thicker scale and fissures developing on pressure-bearing areas."
    explanation: Neonatal onset with progression in one subject.
  - reference: PMID:30321533
    reference_title: "Mutations in PERP Cause Dominant and Recessive Keratoderma."
    supports: SUPPORT

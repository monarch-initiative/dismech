  - reference: PMID:30321533
    reference_title: "Mutations in PERP Cause Dominant and Recessive Keratoderma."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Other desmosomal proteins showed normal solubility profiles consistent with stable incorporation"
    explanation: The solubility change is specific to PERP rather than shared by the other desmosomal proteins.

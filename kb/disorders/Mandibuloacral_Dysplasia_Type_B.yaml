    reference_title: "Zinc metalloproteinase, ZMPSTE24, is mutated in mandibuloacral dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We now show compound heterozygous mutations, Phe361fsX379 and Trp340Arg, in the zinc metalloproteinase (ZMPSTE24) gene in one of the four patients who had severe MAD associated with progeroid appearance and generalized lipodystrophy."
    explanation: Gene discovery.
  - reference: PMID:31856865

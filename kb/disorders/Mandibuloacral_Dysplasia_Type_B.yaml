name: Mandibuloacral Dysplasia Type B
creation_date: "2026-10-05T00:00:00Z"
category: Mendelian
description: >-
  Mandibuloacral dysplasia with type B lipodystrophy (MADB) is an autosomal
  recessive progeroid disorder caused by biallelic ZMPSTE24 variants that leave
  partial activity of the zinc metalloprotease that cuts the farnesylated
  C-terminal tail off prelamin A. Farnesyl-prelamin A accumulates at the nuclear
  envelope, nuclei become misshapen, and cells show defective DNA damage
  responses, p53 activation and senescence. Clinically it presents in early
  childhood with mandibular and clavicular hypoplasia, acro-osteolysis of the
  distal phalanges, delayed cranial suture closure, dental crowding, mottled
  atrophic and sclerodermatous skin with calcified nodules, sparse brittle hair,
  short stature and lipoatrophy, often generalized. Focal segmental
  glomerulosclerosis with renal failure, osteoporosis with fractures, diabetes
  in a minority of patients, heart failure and, in one patient, a congenital
  myopathy have been reported. Underdevelopment of the occipital bone, present
  in every patient assessed, is the proposed sign distinguishing MADB from the
  LMNA-caused type A form. Cognition is usually normal.

  ZMPSTE24 deficiency is a severity spectrum ordered by residual enzyme
  activity: complete loss of function causes lethal restrictive dermopathy,
  while alleles retaining measurable activity cause MADB or a severe
  progeria. Restrictive dermopathy and the LMNA-caused type A form (MADA) are
  separate diseases and are not modelled here.

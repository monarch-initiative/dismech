    explanation: A homozygous founder variant in eight related patients.

diagnosis:
- name: Clinical diagnostic criteria
  description: >-
    MADB is highly likely with at least four major criteria, or three major and
    two minor criteria, defined from 20 genetically confirmed patients.
  evidence:
  - reference: PMID:31856865
    reference_title: "Mandibuloacral dysplasia type B (MADB): a cohort of eight patients from Suriname with a homozygous founder mutation in ZMPSTE24 (FACE1), clinical diagnostic criteria and management guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on our detailed clinical observations, and a review of previously described cases, we propose that the clinical diagnosis of MADB is highly likely if a patient exhibits ≥4 major clinical criteria OR ≥ 3 major clinical criteria and ≥ 2 minor clinical criteria."
    explanation: Proposed clinical criteria.
- name: Skull radiography for occipital ossification
  description: >-
    An underdeveloped interparietal occipital bone was found in every MADB
    patient imaged and may separate MADB from MADA.
  evidence:
  - reference: PMID:31856865
    reference_title: "Mandibuloacral dysplasia type B (MADB): a cohort of eight patients from Suriname with a homozygous founder mutation in ZMPSTE24 (FACE1), clinical diagnostic criteria and management guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "considered failure of ossification of the interparietal region of the occipital bone as a possible pathognomonic sign for MADB"
    explanation: Proposed pathognomonic radiographic sign.
- name: ZMPSTE24 sequencing and prelamin A immunoblot
  description: >-
    Sequencing ZMPSTE24 confirms the diagnosis; prelamin A accumulation on
    immunoblot of patient cells supports pathogenicity of new variants.
  evidence:
  - reference: PMID:18435794
    reference_title: "Severe mandibuloacral dysplasia caused by novel compound heterozygous ZMPSTE24 mutations in two Japanese siblings."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Immunoblots demonstrated accumulation of prelamin A in the patients' cell lysates from lymphoblasts."
    explanation: Prelamin A immunoblot as a functional readout in patient cells.

treatments:
- name: Lonafarnib
  description: >-
    The farnesyltransferase inhibitor lonafarnib is FDA-approved for
    processing-deficient progeroid laminopathies. It corrects the nuclear
    phenotype of MADB patient fibroblasts. Another farnesyltransferase
    inhibitor, ABT-100, improves the Zmpste24-null mouse, while FTI-277 failed
    in one fibroblast study. No clinical outcome data in MADB patients are
    available.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: lonafarnib
      term:
        id: CHEBI:47097
        label: lonafarnib
  target_mechanisms:

animal_models:
- name: Zmpste24 null mouse
  species: Mouse
  genotype: Zmpste24-/-
  publication: PMID:11923874
  modeled_mechanisms:
  - target: Defective Prelamin A Endoproteolytic Maturation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: Complete loss of Zmpste24 abolishes prelamin A processing.
    limitations: >-
      The null mouse has no residual activity, unlike MADB, so it is closer to
      the complete-loss end of the human spectrum.
    evidence:
    - reference: PMID:11923874
      reference_title: "Defective prelamin A processing and muscular and adipocyte alterations in Zmpste24 metalloproteinase-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In agreement with this finding, Zmpste24-null mice are defective in the proteolytic processing of prelamin A."
      explanation: The processing defect in the model.
  - target: Skeletal Stem/Progenitor Cell Loss and Impaired Bone Formation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Bone loss, fractures, micrognathia and osteolytic lesions.
    limitations: >-
      Spontaneous fractures resemble osteogenesis imperfecta models, more
      severe than typical MADB.
    evidence:
    - reference: PMID:15608054
      reference_title: "Heterozygosity for Lmna deficiency eliminates the progeria-like phenotypes in Zmpste24-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Zmpste24-deficient (Zmpste24(-/-)) mice exhibit retarded growth, alopecia, micrognathia, dental abnormalities, osteolytic lesions in bones, and osteoporosis, which are phenotypes shared with Hutchinson-Gilford progeria syndrome, a human disease caused by the synthesis of a mutant prelamin A that cannot undergo processing to lamin A."
      explanation: Skeletal phenotypes shared with human progeroid laminopathy.
  - target: Adipose Tissue Loss
    relationship: PARTIALLY_RECAPITULATES
    fidelity: UNKNOWN
    model_scale: TISSUE
    description: Near-complete fat loss in the global knockout.
    limitations: >-
      Adipocyte-specific deletion reduces fat only modestly and only in males,
      so the global-knockout lipodystrophy may be secondary to systemic disease.
    evidence:
    - reference: PMID:31941672
      reference_title: "Deficiency in ZMPSTE24 and resulting farnesyl-prelamin A accumulation only modestly affect mouse adipose tissue stores."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We conclude that ZMPSTE24 deficiency in adipocytes, and the accompanying accumulation of farnesyl-prelamin A, reduces adipose tissue stores, but only modestly and only in male mice."
      explanation: The conditional model separates cell-autonomous from systemic effects.

discussions:
- discussion_id: madb_lipodystrophy_cell_autonomy
  prompt: >-
    Zmpste24-null mice lose almost all fat, but adipocyte-specific Zmpste24
    deletion causes only a modest loss. Is the human lipodystrophy a direct
    effect of farnesyl-prelamin A in adipocytes, or secondary to systemic
    disease?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Adipose Tissue Loss
  rationale: >-
    The answer decides whether adipose-targeted therapy could help, and
    whether lipodystrophy should sit downstream of the cell-autonomous
    prelamin A chain or of a systemic node.
  evidence:
  - reference: PMID:31941672
    reference_title: "Deficiency in ZMPSTE24 and resulting farnesyl-prelamin A accumulation only modestly affect mouse adipose tissue stores."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We conclude that ZMPSTE24 deficiency in adipocytes, and the accompanying accumulation of farnesyl-prelamin A, reduces adipose tissue stores, but only modestly and only in male mice."
    explanation: The adipocyte-specific result that opens the question.

- discussion_id: madb_heart_failure
  prompt: >-
    Is heart failure part of MADB? One patient died of heart failure at 44, and
    Zmpste24-null mice develop dilated cardiomyopathy, but no cardiac
    evaluation of MADB patients has been reported.
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Congestive Heart Failure
  rationale: >-
    If cardiac involvement is part of the disease, MADB patients would need
    cardiac surveillance as well as renal and metabolic checks.
  evidence:
  - reference: PMID:31856865
    reference_title: "Mandibuloacral dysplasia type B (MADB): a cohort of eight patients from Suriname with a homozygous founder mutation in ZMPSTE24 (FACE1), clinical diagnostic criteria and management guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whether the heart failure in our patient is a solitary finding or this should be regarded part of mandibuloacral dysplasia requires further reports on MADB patients."
    explanation: The authors state the open question.

notes: >-
  Psychomotor development was normal in 14 of 16 patients assessed in the
  Suriname cohort and literature review (PMID:31856865, Table 2). No
  GeneReviews chapter exists for mandibuloacral dysplasia. Lonafarnib is
  approved in the United States for processing-deficient progeroid
  laminopathies, which include ZMPSTE24 deficiency, but MADB-specific clinical
  outcome data are lacking.

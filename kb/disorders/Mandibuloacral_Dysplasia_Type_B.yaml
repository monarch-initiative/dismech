    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Importantly, and in contrast to a previous report, we show here that FTI treatment also improves the aberrant nuclear phenotypes in MAD-B patient cells with mutations in ZMPSTE24 (P248L or L425P)."
    explanation: Lonafarnib corrects nuclear morphology in MADB fibroblasts.
  - reference: PMID:38050983
    reference_title: "The farnesyl transferase inhibitor (FTI) lonafarnib improves nuclear morphology in ZMPSTE24-deficient fibroblasts from patients with the progeroid disorder MAD-B."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "supports the FDA-approved indication for the FTI Zokinvy for patients with processing-deficient progeroid laminopathies, but not for patients with processing-proficient laminopathies"

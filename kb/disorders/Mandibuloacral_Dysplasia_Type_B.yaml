inheritance:
- name: Autosomal recessive
  description: >-
    Homozygous or compound heterozygous ZMPSTE24 variants; typically one null
    allele with one partially active missense allele, or two hypomorphic
    alleles. Heterozygous parents are healthy.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:31856865
    reference_title: "Mandibuloacral dysplasia type B (MADB): a cohort of eight patients from Suriname with a homozygous founder mutation in ZMPSTE24 (FACE1), clinical diagnostic criteria and management guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MADB is caused by reduced activity of the enzyme zinc metalloprotease ZMPSTE24 resulting from compound heterozygous or homozygous mutations in ZMPSTE24."
    explanation: States the biallelic genetic basis.
  - reference: PMID:18435794
    reference_title: "Severe mandibuloacral dysplasia caused by novel compound heterozygous ZMPSTE24 mutations in two Japanese siblings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Their parents and a brother, who were healthy, had heterozygous mutations."
    explanation: Unaffected heterozygous relatives are consistent with recessive inheritance.
  - reference: PMID:31856865
    reference_title: "Mandibuloacral dysplasia type B (MADB): a cohort of eight patients from Suriname with a homozygous founder mutation in ZMPSTE24 (FACE1), clinical diagnostic criteria and management guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the patient and/or the parents should be informed about the 25% risk of siblings of the patient having the same condition"
    explanation: Recurrence risk for siblings.

prevalence:
- population: Genetically confirmed MADB patients in the literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Twenty genetically confirmed patients when the Suriname cohort was
    published in 2019: eight related Surinamese patients homozygous for the
    founder variant p.Tyr399Cys plus twelve earlier reports.
  evidence:
  - reference: PMID:31856865
    reference_title: "Mandibuloacral dysplasia type B (MADB): a cohort of eight patients from Suriname with a homozygous founder mutation in ZMPSTE24 (FACE1), clinical diagnostic criteria and management guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also analysed all previously reported genetically confirmed MADB patients from literature (n = 12) for their clinical features."
    explanation: Twelve previously published cases.
  - reference: PMID:31856865
    reference_title: "Mandibuloacral dysplasia type B (MADB): a cohort of eight patients from Suriname with a homozygous founder mutation in ZMPSTE24 (FACE1), clinical diagnostic criteria and management guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All the Surinamese patients are of African descent and share the same homozygous c.1196A > G, p.(Tyr399Cys) missense variant in the ZMPSTE24 gene, confirming MADB."
    explanation: Eight further patients sharing a founder variant.

pathophysiology:
- name: ZMPSTE24 Partial Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic ZMPSTE24 variants reduce, but do not abolish, the activity of the
    ER and inner nuclear membrane zinc metalloprotease. Missense alleles reduce
    catalytic activity, protein stability, or both. Residual activity orders
    the ZMPSTE24 disease spectrum: none in restrictive dermopathy, partial in
    MADB and severe progeria.
  genes:
  - preferred_term: ZMPSTE24
    term:
      id: hgnc:12877
      label: ZMPSTE24
  molecular_functions:
  - preferred_term: metalloendopeptidase activity
    modifier: DECREASED
    term:
      id: GO:0004222
      label: metalloendopeptidase activity
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:12913070
    reference_title: "Zinc metalloproteinase, ZMPSTE24, is mutated in mandibuloacral dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We now show compound heterozygous mutations, Phe361fsX379 and Trp340Arg, in the zinc metalloproteinase (ZMPSTE24) gene in one of the four patients who had severe MAD associated with progeroid appearance and generalized lipodystrophy."
    explanation: First identification of ZMPSTE24 as a cause of MAD.
  - reference: PMID:12913070
    reference_title: "Zinc metalloproteinase, ZMPSTE24, is mutated in mandibuloacral dysplasia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The ZMPSTE24 mutant construct, Phe361fsX379, was inactive in complementing the yeast a-factor but the mutant, Trp340Arg, was partially active compared to the wild type ZMPSTE24 construct."
    explanation: One null and one partially active allele in the first MADB patient.
  - reference: PMID:22718200
    reference_title: "Human ZMPSTE24 disease mutations: residual proteolytic activity correlates with disease severity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Complete loss-of-function alleles are associated with RD, whereas retention of partial, measureable activity results in MAD-B or severe progeria."
    explanation: Places MADB at the partial-activity end of the ZMPSTE24 spectrum.
  - reference: PMID:29794150
    reference_title: "ZMPSTE24 missense mutations that cause progeroid diseases decrease prelamin A cleavage activity and/or protein stability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All mutations show diminished prelamin A processing and fall into three classes, with defects in activity, protein stability or both."
    explanation: Disease missense alleles reduce activity and/or stability.
  downstream:
  - target: Defective Prelamin A Endoproteolytic Maturation
    causal_link_type: DIRECT
    description: ZMPSTE24 performs the final cleavage that converts prelamin A to lamin A.
    evidence:
    - reference: PMID:12913070
      reference_title: "Zinc metalloproteinase, ZMPSTE24, is mutated in mandibuloacral dysplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "ZMPSTE24 is involved in post-translational proteolytic cleavage of carboxy terminal residues of farnesylated prelamin A in two steps to form mature lamin A."
      explanation: Names the processing step that a ZMPSTE24 defect blocks.

- name: Defective Prelamin A Endoproteolytic Maturation
  biological_scale: MOLECULAR
  description: >-
    The farnesylated, carboxymethylated C-terminal tail of prelamin A is not
    cleaved, so unprocessed farnesyl-prelamin A accumulates and mature lamin A
    is reduced. This is shown directly in patient lymphoblasts and fibroblasts.
  genes:
  - preferred_term: LMNA
    term:
      id: hgnc:6636
      label: LMNA
  biological_processes:
  - preferred_term: CAAX-box protein processing
    modifier: DECREASED
    term:
      id: GO:0071586
      label: CAAX-box protein processing
  cellular_components:
  - preferred_term: nuclear lamina
    term:
      id: GO:0005652
      label: nuclear lamina
  evidence:
  - reference: PMID:18435794
    reference_title: "Severe mandibuloacral dysplasia caused by novel compound heterozygous ZMPSTE24 mutations in two Japanese siblings."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Immunoblots demonstrated accumulation of prelamin A in the patients' cell lysates from lymphoblasts."
    explanation: Prelamin A accumulates in patient cells.
  - reference: PMID:21267004
    reference_title: "Type B mandibuloacral dysplasia with congenital myopathy due to homozygous ZMPSTE24 missense mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Western blot analysis revealed a major reduction of ZMPSTE24, together with the presence of unprocessed prelamin A and decreased levels of lamin A, in the patient's primary skin fibroblasts."
    explanation: Unprocessed prelamin A with reduced lamin A in patient fibroblasts.
  downstream:
  - target: Nuclear Envelope Dysmorphology
    causal_link_type: DIRECT
    description: >-
      Farnesyl-prelamin A deforms the nucleus; halving its level in
      Zmpste24-null cells makes misshapen nuclei less frequent.
    evidence:
    - reference: PMID:15608054
      reference_title: "Heterozygosity for Lmna deficiency eliminates the progeria-like phenotypes in Zmpste24-deficient mice."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "misshapen nuclei were less frequent in Zmpste24(-/-)Lmna(+/-) cells than in Zmpste24(-/-) cells"
      explanation: Lowering prelamin A dosage reduces nuclear misshaping in cultured cells.
  - target: Defective DNA Damage Response and Genomic Instability
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Unprocessed prelamin A impairs recruitment of 53BP1 and RAD51 to DNA
      lesions, delaying checkpoint response and repair.
    evidence:
    - reference: PMID:15980864
      reference_title: "Genomic instability in laminopathy-based premature aging."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "Our results indicate that unprocessed prelamin A and truncated lamin A act dominant negatively to perturb DNA damage response and repair, resulting in genomic instability which might contribute to laminopathy-based premature aging."
      explanation: Shown in Zmpste24-null and prelamin A-expressing mouse cells, not MADB patient cells.
  - target: p53 Activation and Cellular Senescence
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      A route independent of nuclear shape: farnesyl-methyl prelamin A at the
      nuclear rim suppresses AKT-mTOR signalling, promoting senescence.
    evidence:
    - reference: PMID:23686339
      reference_title: "Targeting isoprenylcysteine methylation ameliorates disease in a mouse model of progeria."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "ICMT inhibition increased AKT-mTOR signaling and proliferation and delayed senescence in human HGPS fibroblasts but did not reduce the levels of misshapen nuclei in mouse and human cells."
      explanation: >-
        Senescence can be relieved without correcting nuclear shape; shown in
        cultured HGPS and Zmpste24-deficient cells, not MADB cells.
  - target: Skeletal Stem/Progenitor Cell Loss and Impaired Bone Formation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Defective prelamin A processing produces aging-like bone loss in the
      mouse; the cellular steps in between are not established.
    evidence:
    - reference: PMID:19587107
      reference_title: "Accelerated features of age-related bone loss in zmpste24 metalloproteinase-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "We found that defective prelamin A processing induced accelerated features of age-related bone loss including lower osteoblast and osteocyte numbers and higher levels of marrow adipogenesis."
      explanation: Ties the prelamin A defect to bone loss in mice.
  - target: Defective Intramembranous Ossification
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed from the clinical pattern: the membranous interparietal bone
      fails to ossify while the endochondral supraoccipital forms normally.
    evidence:
    - reference: PMID:27410998
      reference_title: "Failure of ossification of the occipital bone in mandibuloacral dysplasia type B."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "This observation illustrates that ZMPSTE24 could play a specific role in membranous ossification in the interparietal part of the squama (Inca bone) but not in the intracartilaginous ossification of the supraoccipital."
      explanation: An inference from one patient's radiographs.
  - target: Adipose Tissue Loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Farnesyl-prelamin A in adipocytes reduces fat stores only modestly in the
      mouse, so most of the fat loss may arise elsewhere.
    evidence:
    - reference: PMID:31941672
      reference_title: "Deficiency in ZMPSTE24 and resulting farnesyl-prelamin A accumulation only modestly affect mouse adipose tissue stores."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "We conclude that ZMPSTE24 deficiency in adipocytes, and the accompanying accumulation of farnesyl-prelamin A, reduces adipose tissue stores, but only modestly and only in male mice."
      explanation: A modest adipocyte-autonomous effect.
  - target: Sparse Brittle Hair
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:12235369
      reference_title: "Zmpste24 deficiency in mice causes spontaneous bone fractures, muscle weakness, and a prelamin A processing defect."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "Zmpste24(-/-) mice gain weight slowly, appear malnourished, and exhibit progressive hair loss."
      explanation: Hair loss in the knockout.
    - reference: PMID:18587406
      reference_title: "Combined treatment with statins and aminobisphosphonates extends longevity in a mouse model of human premature aging."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "markedly improves the aging-like phenotypes of mice deficient in the metalloproteinase Zmpste24, including growth retardation, loss of weight, lipodystrophy, hair loss and bone defects"
      explanation: Blocking prelamin A prenylation reverses hair loss, placing it downstream of prelamin A.
  - target: Short Stature
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:18587406
      reference_title: "Combined treatment with statins and aminobisphosphonates extends longevity in a mouse model of human premature aging."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "markedly improves the aging-like phenotypes of mice deficient in the metalloproteinase Zmpste24, including growth retardation, loss of weight, lipodystrophy, hair loss and bone defects"
      explanation: Growth retardation in the knockout is reversed by blocking prelamin A prenylation.

- name: Nuclear Envelope Dysmorphology
  biological_scale: CELLULAR
  description: >-
    Patient fibroblasts have misshapen, structurally abnormal nuclei and a
    shortened replicative lifespan. Nuclear shape is a marker rather than a
    sufficient cause: fibroblasts from a restrictive dermopathy patient with
    only prelamin A had few nuclear abnormalities, and several rescues improve
    disease without normalizing nuclei.
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0002551
      label: fibroblast of dermis
  biological_processes:
  - preferred_term: nuclear envelope organization
    modifier: ABNORMAL
    term:
      id: GO:0006998
      label: nuclear envelope organization
  evidence:
  - reference: PMID:21267004
    reference_title: "Type B mandibuloacral dysplasia with congenital myopathy due to homozygous ZMPSTE24 missense mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These cells exhibited significant reductions in lifespan associated with major abnormalities of the nuclear shape and structure."
    explanation: Nuclear shape defects in patient fibroblasts.
  - reference: PMID:28050601
    reference_title: "Progeroid syndrome patients with ZMPSTE24 deficiency could benefit when treated with rapamycin and dimethylsulfoxide."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In this study, fibroblasts from MADB patients exhibited marked nuclear abnormalities and reduced proliferation that improved upon treatment with rapamycin and dimethylsulfoxide but not with other agents, including farnesyl transferase inhibitors."
    explanation: Independent confirmation of nuclear abnormalities in MADB fibroblasts.
  - reference: PMID:28050601
    reference_title: "Progeroid syndrome patients with ZMPSTE24 deficiency could benefit when treated with rapamycin and dimethylsulfoxide."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "prelamin A accumulation by itself might not be detrimental and requires additional alterations at the cellular level to manifest the phenotype"
    explanation: Caveat that prelamin A and nuclear misshaping are not sufficient on their own.
  downstream:
  - target: p53 Activation and Cellular Senescence
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: The nuclear abnormalities activate a p53-dependent checkpoint.
    evidence:
    - reference: PMID:16079796
      reference_title: "Accelerated ageing in mice deficient in Zmpste24 protease is linked to p53 signalling activation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "These findings provide evidence for the existence of a checkpoint response activated by the nuclear abnormalities caused by prelamin A accumulation, and support the concept that hyperactivation of the tumour suppressor p53 may cause accelerated ageing."
      explanation: Links prelamin A nuclear abnormalities to a p53 checkpoint in mice.

- name: Defective DNA Damage Response and Genomic Instability
  biological_scale: CELLULAR
  conforms_to: "genomic_instability_aging#Declining Genome Maintenance and Erroneous Repair"
  description: >-
    Zmpste24-deficient cells accumulate DNA damage and chromosome aberrations,
    are sensitive to DNA-damaging agents, and fail to recruit 53BP1 and RAD51
    to lesions, associated with hypoacetylation of histone H4 at lysine 16.
    Demonstrated in mouse cells; not yet measured in MADB patient cells.
  biological_processes:
  - preferred_term: double-strand break repair
    modifier: DECREASED
    term:
      id: GO:0006302
      label: double-strand break repair
  evidence:
  - reference: PMID:15980864
    reference_title: "Genomic instability in laminopathy-based premature aging."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that Zmpste24-deficient mouse embryonic fibroblasts (MEFs) show increased DNA damage and chromosome aberrations and are more sensitive to DNA-damaging agents."
    explanation: Genomic instability in cultured Zmpste24-null cells.
  - reference: PMID:21746928
    reference_title: "Histone H4 lysine 16 hypoacetylation is associated with defective DNA repair and premature senescence in Zmpste24-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Specifically, histone H4 was hypoacetylated at a lysine 16 residue (H4K16), and this defect was attributed to the reduced association of a histone acetyltransferase, Mof, to the nuclear matrix."
    explanation: A chromatin defect behind delayed repair-protein recruitment.
  downstream:
  - target: p53 Activation and Cellular Senescence
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Delayed DNA repair drives early cellular senescence.
    evidence:
    - reference: PMID:21746928
      reference_title: "Histone H4 lysine 16 hypoacetylation is associated with defective DNA repair and premature senescence in Zmpste24-deficient mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "We have previously reported that Zmpste24 deficiency results in genomic instability and early cellular senescence due to the delayed recruitment of repair proteins to sites of DNA damage."
      explanation: Attributes senescence to the repair defect.

- name: p53 Activation and Cellular Senescence
  biological_scale: CELLULAR
  conforms_to: "cellular_senescence#Senescence-Associated Cell Cycle Arrest"
  description: >-
    Zmpste24 deficiency upregulates p53 target genes with cellular senescence
    and organismal accelerated ageing; these are largely rescued by halving
    Lmna dosage and partly reversed by p53 loss. Patient fibroblasts show
    reduced proliferation and lifespan. Senescence is not simply a consequence
    of nuclear shape: reducing ICMT or RCE1 activity in Zmpste24-deficient
    cells relieves senescence through prelamin A-dependent AKT-mTOR signalling
    without correcting misshapen nuclei.
  biological_processes:
  - preferred_term: cellular senescence
    modifier: INCREASED
    term:
      id: GO:0090398
      label: cellular senescence
  evidence:
  - reference: PMID:16079796
    reference_title: "Accelerated ageing in mice deficient in Zmpste24 protease is linked to p53 signalling activation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We demonstrate that Zmpste24 deficiency elicits a stress signalling pathway that is evidenced by a marked upregulation of p53 target genes, and accompanied by a senescence phenotype at the cellular level and accelerated ageing at the organismal level."
    explanation: p53 activation and senescence in Zmpste24-null mice.
  - reference: PMID:16079796
    reference_title: "Accelerated ageing in mice deficient in Zmpste24 protease is linked to p53 signalling activation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These phenotypes are largely rescued in Zmpste24-/-Lmna+/- mice and partially reversed in Zmpste24-/-p53-/- mice."
    explanation: Genetic rescue places p53 downstream of prelamin A accumulation.
  - reference: PMID:23686339
    reference_title: "Targeting isoprenylcysteine methylation ameliorates disease in a mouse model of progeria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The reduced ICMT activity caused prelamin A mislocalization within the nucleus and triggered prelamin A-dependent activation of AKT-mammalian target of rapamycin (mTOR) signaling, which abolished the premature senescence of Zmpste24-deficient fibroblasts."
    explanation: Senescence of Zmpste24-deficient cells depends on prelamin A signalling through AKT-mTOR.
  - reference: PMID:32910507
    reference_title: "Targeting RAS-converting enzyme 1 overcomes senescence and improves progeria-like phenotypes of ZMPSTE24 deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results strengthen the idea that the presence of misshapen nuclei does not prevent phenotype improvement and suggest that targeting RCE1 might be useful for treating the rare progeroid disorders associated with ZMPSTE24 deficiency."
    explanation: Phenotype rescue without nuclear-shape correction.

- name: Skeletal Stem/Progenitor Cell Loss and Impaired Bone Formation
  biological_scale: TISSUE
  conforms_to: "osteoporosis_bone_resorption#Impaired Osteoblastic Bone Formation"
  description: >-
    Zmpste24-null mice have fewer osteoblasts and osteocytes, more marrow fat,
    reduced cortical and trabecular bone and spontaneous fractures. Conditional
    deletion places the lesion upstream of mature osteoblasts: removing
    Zmpste24 from Prx1-lineage skeletal stem/progenitor cells causes bone loss,
    while removing it from Osx-lineage osteoblasts does not.
  cell_types:
  - preferred_term: skeletal stem/progenitor cell
    term:
      id: CL:0020016
      label: osteochondral skeletal stem cell
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: osteoblast differentiation
    modifier: DECREASED
    term:
      id: GO:0001649
      label: osteoblast differentiation
  evidence:
  - reference: PMID:19587107
    reference_title: "Accelerated features of age-related bone loss in zmpste24 metalloproteinase-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found that defective prelamin A processing induced accelerated features of age-related bone loss including lower osteoblast and osteocyte numbers and higher levels of marrow adipogenesis."
    explanation: Reduced osteoblast numbers in the mouse model.
  - reference: PMID:12235369
    reference_title: "Zmpste24 deficiency in mice causes spontaneous bone fractures, muscle weakness, and a prelamin A processing defect."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Cortical and trabecular bone volumes are significantly reduced in Zmpste24(-/-) mice."
    explanation: Bone mass loss in the knockout.
  - reference: PMID:37407584
    reference_title: "Premature aging of skeletal stem/progenitor cells rather than osteoblasts causes bone loss with decreased mechanosensation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we established models of premature aging by conditional depletion of Zmpste24 (Z24) in mice and found that Prx1-dependent Z24 deletion, but not Osx-dependent Z24 deletion, caused significant bone loss."
    explanation: Locates the bone defect in skeletal stem/progenitor cells rather than osteoblasts.
  downstream:
  - target: Osteoporosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:12235369
      reference_title: "Zmpste24 deficiency in mice causes spontaneous bone fractures, muscle weakness, and a prelamin A processing defect."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "The most striking pathologic phenotype is multiple spontaneous bone fractures-akin to those occurring in mouse models of osteogenesis imperfecta."
      explanation: Bone fragility in the knockout parallels human osteoporosis with fractures.

- name: Defective Intramembranous Ossification
  biological_scale: TISSUE
  description: >-
    The interparietal part of the occipital squama, which forms by membranous
    ossification, fails to ossify, while the endochondral supraoccipital forms
    normally. Delayed suture closure and wide fontanelles fit the same
    membranous-bone pattern, but no study has tested that link.
  biological_processes:
  - preferred_term: intramembranous ossification
    modifier: DECREASED
    term:
      id: GO:0001957
      label: intramembranous ossification
  evidence:
  - reference: PMID:27410998
    reference_title: "Failure of ossification of the occipital bone in mandibuloacral dysplasia type B."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a striking failure of ossification of the interparietal region of the occipital bone, up to the position where transverse occipital suture can be observed"
    explanation: The membranous-bone defect on radiographs.
  downstream:
  - target: Underdeveloped Occipital Bone
    causal_link_type: DIRECT

- name: Adipose Tissue Loss
  biological_scale: TISSUE
  description: >-
    Lipoatrophy is part of the defining phenotype, generalized in about half of
    patients. Zmpste24-null mice lose almost all adipose tissue by four months,
    but deleting Zmpste24 only in adipocytes reduces fat only modestly, so
    whether the lipodystrophy is cell-autonomous is unresolved.
  cell_types:
  - preferred_term: adipocyte
    term:
      id: CL:0000136
      label: adipocyte
  biological_processes:
  - preferred_term: adipose tissue development
    modifier: ABNORMAL
    term:
      id: GO:0060612
      label: adipose tissue development
  evidence:
  - reference: PMID:11923874
    reference_title: "Defective prelamin A processing and muscular and adipocyte alterations in Zmpste24 metalloproteinase-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Histopathological analysis of the mutant mice revealed several abnormalities, including dilated cardiomyopathy, muscular dystrophy and lipodystrophy."
    explanation: Lipodystrophy in the Zmpste24-null mouse.
  downstream:
  - target: Lipodystrophy
    causal_link_type: DIRECT

- name: Progressive Glomerulosclerosis
  biological_scale: TISSUE
  description: >-
    Two adults with ZMPSTE24 MAD developed focal segmental glomerulosclerosis
    (one collapsing) and died of renal failure at 27 and 37 years. How prelamin
    A accumulation injures the glomerulus has not been studied.
  evidence:
  - reference: PMID:17152860
    reference_title: "Focal segmental glomerulosclerosis in patients with mandibuloacral dysplasia owing to ZMPSTE24 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Renal biopsies of both patients revealed focal segmental glomerulosclerosis, and the female patient had the collapsing variant."
    explanation: Biopsy-proven FSGS in two ZMPSTE24 MAD patients.
  downstream:
  - target: Focal Segmental Glomerulosclerosis
    causal_link_type: DIRECT


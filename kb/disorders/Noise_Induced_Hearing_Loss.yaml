discussions:
- discussion_id: mismatch_nihl_otoprotectant_animal_to_human
  prompt: >-
    Why do antioxidant and anti-excitotoxic otoprotectants that robustly prevent
    noise-induced hair-cell and synaptic loss in rodent and guinea-pig models
    repeatedly fail to show clear efficacy in human trials?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Cochlear Oxidative Stress
  - pathophysiology#Glutamate Excitotoxicity at the Inner Hair Cell Ribbon Synapse
  rationale: >-
    The oxidative-stress and glutamate-excitotoxicity arms of NIHL are defined
    almost entirely in animal models, where interventions such as
    N-acetylcysteine, D-methionine, and ACEMg are protective. Yet the best human
    trials (e.g., a randomized military N-acetylcysteine trial) have not
    confirmed protection. The mismatch is mechanistically meaningful: it is
    unclear whether the discrepancy reflects species differences in cochlear
    antioxidant capacity and exposure kinetics, dosing/timing relative to the
    roughly ten-day post-exposure free-radical window, human exposure
    heterogeneity, or endpoints (audiometric threshold) that miss the
    synaptopathic injury the drugs target. Resolving it determines whether
    pharmacologic otoprotection is achievable in people.
  proposed_experiments:
  - experiment_id: exp_nihl_otoprotectant_synaptopathy_endpoints
    name: Human otoprotection trials using synaptopathy-sensitive endpoints
    description: >-
      Test candidate otoprotectants in noise-exposed human cohorts using
      endpoints sensitive to cochlear synaptopathy (ABR wave-I amplitude,
      speech-in-noise, extended high-frequency audiometry) rather than standard
      pure-tone threshold shift alone, with dosing timed to the post-exposure
      oxidative window, to determine whether the animal-to-human gap is
      biological or a measurement artifact.
  evidence:
  - reference: PMID:25620313
    reference_title: "Efficacy and safety of N-acetylcysteine in prevention of noise induced hearing loss: a randomized clinical trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "N-acetylcysteine (NAC) has consistently reduced permanent NIHL in the laboratory, but its clinical efficacy is still controversial."
    explanation: >-
      States the animal-to-human translation gap that defines this mismatch.
      Evidence source is HUMAN_CLINICAL (randomized clinical trial).

inheritance:
- name: Polygenic susceptibility
  inheritance_term:
    preferred_term: Polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  description: >-
    NIHL is not Mendelian: susceptibility to a given noise dose is a
    multifactorial, polygenic trait with a strong gene-by-environment structure.
    Multiple small-effect loci in oxidative-stress, potassium-recycling,
    heat-shock, and hair-cell-structure pathways (e.g., NOX3, KCNQ4, CAT)
    modify risk only in the presence of the noise exposure.
  evidence:
  - reference: PMID:35903368
    reference_title: "The Role of Genetic Variants in the Susceptibility of Noise-Induced Hearing Loss."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "genetic factors, together with environmental conditions, also contribute to NIHL. A group"
    explanation: >-
      Establishes that genetic factors act together with environmental noise to
      determine NIHL susceptibility - a polygenic gene-by-environment model.
      Evidence source is OTHER (review).

prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: COMMON
  notes: >-
    NIHL is the most prevalent occupational disease worldwide; an estimated 1.3
    billion people have hearing loss attributable to noise, and occupational
    noise accounts for about 16% of adult disabling hearing loss. A precise
    population point-prevalence rate is not well defined because the at-risk
    denominator is exposure-dependent, so the coarse qualitative band is used.
  evidence:
  - reference: PMID:33129267
    reference_title: "An overview of occupational noise-induced hearing loss among workers: epidemiology, pathogenesis, and preventive measures."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is estimated that 1.3 billion people suffer from hearing loss due to noise exposure"
    explanation: >-
      Quantifies the global burden of noise-related hearing loss. Evidence
      source is OTHER (systematic review).

treatments:
- name: Hearing protection and noise control
  description: >-
    Primary prevention through the hierarchy of controls - engineering noise
    controls and substitution, administrative exposure limits, and personal
    hearing protectors (earplugs/earmuffs) - is the only fully effective
    intervention, backed by mandated hearing-conservation programs and
    audiometric surveillance above the action level.
  treatment_term:
    preferred_term: therapeutic avoidance of noise exposure
    term:
      id: NCIT:C15900
      label: Lifestyle Therapy
  evidence:
  - reference: PMID:33129267
    reference_title: "An overview of occupational noise-induced hearing loss among workers: epidemiology, pathogenesis, and preventive measures."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ONIHL is a complex and preventable disease"
    explanation: >-
      Supports prevention (exposure control) as the central management strategy.
      Evidence source is OTHER (systematic review).
- name: Hearing aids
  description: >-
    Amplification with hearing aids is first-line rehabilitation for the
    established permanent loss.
  treatment_term:
    preferred_term: hearing aid usage
  evidence:
  - reference: PMID:28944461
    reference_title: "Hearing aids for mild to moderate hearing loss in adults."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The main clinical intervention for mild to moderate hearing loss is the provision of hearing aids."
    explanation: >-
      Cochrane review establishing hearing aids as the main clinical
      intervention (amplification) for mild-to-moderate hearing loss, the
      first-line rehabilitation for the sensorineural loss of NIHL. Evidence
      source is OTHER (Cochrane systematic review).
- name: Cochlear implantation
  description: >-
    Cochlear implantation restores hearing in severe-to-profound loss when
    hearing aids are insufficient; benefit depends on surviving spiral-ganglion
    neurons.
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:38573882
    reference_title: "Socioeconomic and ethnic disparities associated with access to cochlear implantation for severe-to-profound hearing loss: A multicentre observational study of UK adults."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with severe-to-profound hearing loss may benefit from management with cochlear implants."
    explanation: >-
      Supports cochlear implantation for severe-to-profound hearing loss, the
      indication for NIHL that outstrips hearing-aid benefit. Evidence source is
      HUMAN_CLINICAL (multicentre observational study of adults).
- name: Corticosteroids for acute acoustic trauma
  description: >-
    For acute acoustic trauma, systemic and/or intratympanic corticosteroids are
    used as a rescue therapy within the narrow post-exposure window, extrapolated
    from idiopathic sudden sensorineural hearing loss protocols. Glucocorticoids
    are the only currently approved medication for NIHL, and there is no
    comparable rescue for established chronic NIHL, whose only effective handle is
    prevention.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:34306060
    reference_title: "Noise-Induced Hearing Loss: Updates on Molecular Targets and Potential Interventions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Glucocorticoid is the only approved medication for NIHL treatment."
    explanation: >-
      Directly supports glucocorticoids (corticosteroids) as the only approved
      NIHL pharmacotherapy. Evidence source is OTHER (review).
- name: N-acetylcysteine (investigational otoprotectant)
  description: >-
    N-acetylcysteine is an antioxidant otoprotectant studied for prevention of
    acute NIHL. It reliably reduces permanent NIHL in animal models but has not
    shown clear efficacy in humans - a large military randomized trial did not
    reject the null hypothesis for standard threshold shift. Included as an
    investigational agent, not established therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Cochlear Oxidative Stress
    treatment_effect: INHIBITS
    description: >-
      N-acetylcysteine is a glutathione precursor and antioxidant intended to
      scavenge the reactive oxygen species generated by noise, targeting the
      oxidative-stress arm of cochlear injury.
  evidence:
  - reference: PMID:25620313
    reference_title: "Efficacy and safety of N-acetylcysteine in prevention of noise induced hearing loss: a randomized clinical trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "N-acetylcysteine (NAC) has consistently reduced permanent NIHL in the laboratory, but its clinical efficacy is still controversial."
    explanation: >-
      Documents the laboratory-versus-clinic gap for NAC otoprotection; support
      is PARTIAL because the human trial was not confirmatory. Evidence source
      is HUMAN_CLINICAL (randomized clinical trial).
  - reference: PMID:25620313
    reference_title: "Efficacy and safety of N-acetylcysteine in prevention of noise induced hearing loss: a randomized clinical trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The null hypothesis for the rate of STS was not rejected based on the measured results."
    explanation: >-
      The primary endpoint (rate of standard threshold shift) was not
      significantly improved by NAC, refuting clinical efficacy at the tested
      dose. Evidence source is HUMAN_CLINICAL (randomized clinical trial).
  - reference: PMID:34306060
    reference_title: "Noise-Induced Hearing Loss: Updates on Molecular Targets and Potential Interventions."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "New pharmaceuticals targeting oxidative stress, inflammation, or noise-induced neuropathy are emerging"
    explanation: >-
      Situates N-acetylcysteine among the emerging investigational
      otoprotectants that target the oxidative-stress arm. Evidence source is
      OTHER (review).

diagnosis:
- name: Pure-tone audiometry with high-frequency noise notch
  description: >-
    NIHL is a clinical diagnosis from a hazardous-exposure history plus a
    compatible audiogram with normal otoscopy/tympanometry (confirming a
    sensorineural, not conductive, loss). The hallmark is a bilateral, symmetric
    high-frequency notch at 3, 4, or 6 kHz with relative recovery at 8 kHz.
    Distortion-product otoacoustic emissions detect outer-hair-cell dysfunction
    before threshold change, and reduced auditory-brainstem-response wave-I
    amplitude is the emerging biomarker of the cochlear synaptopathy this entry
    emphasizes. Occupational surveillance tracks the OSHA Standard Threshold
    Shift on serial audiograms.
  diagnosis_term:
    preferred_term: hearing examination
    term:
      id: NCIT:C38036
      label: Audiometric Test
  markers: >-
    Pure-tone audiogram (3-6 kHz notch), otoscopy/tympanometry, distortion-product
    otoacoustic emissions, auditory brainstem response wave-I amplitude
  evidence:
  - reference: PMID:33129267
    reference_title: "An overview of occupational noise-induced hearing loss among workers: epidemiology, pathogenesis, and preventive measures."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Pure tone audiometric testing is used to detect and quantify the degree of ONIHL"
    explanation: >-
      Establishes pure-tone audiometry as the diagnostic cornerstone. Evidence
      source is OTHER (systematic review).
  - reference: PMID:33129267
    reference_title: "An overview of occupational noise-induced hearing loss among workers: epidemiology, pathogenesis, and preventive measures."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "most noise exposures are symmetric and display typical signs of notching at high frequencies of 3000, 4000, or 6000 Hz with recovery at 8000 Hz in audiogram testing"
    explanation: >-
      Documents the characteristic bilateral, symmetric 3-6 kHz audiometric
      notch with 8 kHz recovery. Evidence source is OTHER (systematic review).

differential_diagnoses:
- name: Presbycusis (age-related hearing loss)
  description: >-
    Age-related sensorineural hearing loss overlaps with NIHL in its
    high-frequency, bilateral, symmetric pattern and frequently coexists with it
    in older workers.
  distinguishing_features:
  - Presbycusis continues to progress without noise exposure, whereas NIHL stabilizes once exposure stops.
  - Presbycusis tends to produce a smoothly down-sloping high-frequency audiogram without the discrete 3-6 kHz notch and 8 kHz recovery of NIHL.
  disease_term:
    preferred_term: presbycusis
    term:
      id: MONDO:0043765
      label: presbycusis
  evidence:
  - reference: PMID:33129267
    reference_title: "An overview of occupational noise-induced hearing loss among workers: epidemiology, pathogenesis, and preventive measures."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "ONIHL needs to be differentiated from age-related hearing loss in older persons"
    explanation: >-
      Explicitly frames age-related hearing loss as the key differential.
      Evidence source is OTHER (systematic review).
- name: Sudden sensorineural hearing loss
  description: >-
    Idiopathic sudden sensorineural hearing loss can be confused with acute
    acoustic trauma.
  distinguishing_features:
  - Sudden SNHL develops rapidly over hours to days, is frequently unilateral, and lacks a cumulative noise-dose history.
  - It is a medical urgency treated with corticosteroids, whereas chronic NIHL is managed by exposure control and rehabilitation.
  disease_term:
    preferred_term: sudden sensorineural hearing loss
    term:
      id: MONDO:0043373
      label: sudden sensorineural hearing loss
- name: Meniere disease
  description: >-
    Meniere disease is an inner-ear disorder that can present with sensorineural
    hearing loss.
  distinguishing_features:
  - Meniere disease causes fluctuating, typically low-frequency loss with episodic vertigo and aural fullness, unlike the fixed high-frequency loss of NIHL.
  disease_term:
    preferred_term: Meniere disease
    term:
      id: MONDO:0007972
      label: Meniere disease
- name: Vestibular schwannoma (acoustic neuroma)
  description: >-
    A vestibular schwannoma is a retrocochlear cause of sensorineural hearing
    loss that must be excluded when the loss is asymmetric.
  distinguishing_features:
  - Vestibular schwannoma causes asymmetric or unilateral loss and warrants imaging; NIHL is typically bilateral and symmetric (marked asymmetry suggests firearm exposure or a retrocochlear cause).
  disease_term:
    preferred_term: acoustic neuroma
    term:
      id: MONDO:0001569
      label: acoustic neuroma
- name: Ototoxic (drug-induced) hearing loss
  description: >-
    Drug- or chemical-induced ototoxic hearing loss can mimic and synergize with
    noise injury.
  distinguishing_features:
  - Ototoxic loss follows exposure to aminoglycosides, cisplatin, or loop diuretics and is distinguished by a medication/chemical history, though ototoxicants can potentiate concurrent noise damage.
  disease_term:
    preferred_term: drug-induced hearing loss
    term:
      id: MONDO:0850094
      label: drug-induced hearing loss


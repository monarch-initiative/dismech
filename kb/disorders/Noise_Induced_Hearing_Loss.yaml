name: Noise Induced Hearing Loss
creation_date: "2026-07-20T00:00:00Z"
category: Complex
disease_term:
  preferred_term: noise-induced hearing loss
  term:
    id: MONDO:0013098
    label: noise induced hearing loss
description: >-
  Noise-induced hearing loss (NIHL) is an acquired sensorineural hearing
  impairment caused by exposure to hazardous levels of sound energy, whether a
  single high-intensity acoustic event (acoustic trauma) or cumulative chronic
  overexposure (occupational or recreational). The cochlea is injured by two
  broadly separable mechanisms: direct mechanical disruption of the organ of
  Corti at very high sound-pressure levels, and a metabolic/oxidative cascade
  set off by intense sound that generates reactive oxygen species, disrupts
  cochlear blood flow and ionic homeostasis, and drives glutamate excitotoxicity
  at the inner-hair-cell afferent synapse. The earliest and most permanent
  lesion is loss of the ribbon synapses connecting inner hair cells to
  spiral-ganglion afferents (cochlear synaptopathy, "hidden hearing loss"),
  followed by outer-hair-cell death with loss of cochlear amplification and, over
  time, secondary spiral-ganglion-neuron degeneration. A temporary threshold
  shift can recover, but repeated or severe insults produce a permanent
  threshold shift, classically maximal in the 3-6 kHz region (the audiometric
  "noise notch"). Individual susceptibility varies severalfold and has a
  heritable, polygenic component that is only unmasked by the noise exposure -
  making NIHL a textbook gene-by-environment disease. It is one of the most
  common occupational diseases worldwide and is almost entirely preventable,
  yet established loss is irreversible because mammalian hair cells do not
  regenerate.
synonyms:
- acoustic trauma
- occupational hearing loss
- noise-induced hearing impairment
- noise-induced deafness

classifications:
  harrisons_chapter:
  - classification_value: DISORDER_OF_EAR
  - classification_value: ENVIRONMENTAL_EXPOSURES
  ilo_agent_category:
  - classification_value: hearing_impairment_caused_by_noise
    notes: >-
      ILO List of Occupational Diseases (revised 2010), item 1.2.1 "Hearing
      impairment caused by noise", under section 1.2 (physical agents). Note
      this is a section-1 (by causative agent) assignment with no section-2
      counterpart: the ILO list has no hearing/vestibular organ-system
      subsection, so unlike asbestosis or silicosis this disease takes exactly
      one item. NIHL also has a large non-occupational (recreational, firearms,
      military) component; the assignment records that an occupational form is
      recognised, not that every case is occupational.
  eu_occupational_category:
  - classification_value: noise_induced_hypoacousis_or_deafness
    notes: >-
      European schedule of occupational diseases (Commission Recommendation
      2003/670/EC as amended), Annex I item 503 "Hypoacousis or deafness caused
      by noise", under chapter 5 (physical agents).
environmental:
- name: Hazardous noise exposure
  exposure_term:
    preferred_term: exposure to sound radiation
    term:
      id: ECTO:8000044
      label: exposure to sound radiation
  exposure_classifications:
    hazard_agent_type:
    - classification_value: PHYSICAL
      notes: >-
        Noise is a physical energy, classified by the nature of the agent rather
        than by its effect — the injury is cochlear, but the hazard is physical.
    exposure_route:
    - classification_value: UNKNOWN
      notes: >-
        Route of exposure is a toxicological concept for agents taken up into
        the body and does not apply to acoustic energy, which acts directly on
        the cochlea without a portal of entry. Recorded as UNKNOWN rather than
        forcing an inapplicable value; this is the honest reading for physical
        agents generally.
    exposure_duration:
    - classification_value: CHRONIC
      notes: >-
        ATSDR chronic duration (365 days and longer) for cumulative occupational
        overexposure, the dominant pattern — the NIOSH recommended limit is an
        85 dBA 8-hour time-weighted average with a 3-dB exchange rate.
    - classification_value: ACUTE
      notes: >-
        ATSDR acute duration for acoustic trauma: a single high-intensity
        impulse or blast can produce immediate permanent mechanical injury, so
        both duration patterns are genuinely in play for this exposure.
    exposome_domain:
    - classification_value: SPECIFIC_EXTERNAL
      notes: >-
        An identifiable individual-level exposure in Wild's specific external
        domain, whether occupational or recreational. No IARC or GHS value
        applies — those instruments classify chemical agents, and noise is
        neither a carcinogen evaluation subject nor a GHS-classifiable substance.
  description: >-
    The sole cause of NIHL is exposure to sound energy at intensities and
    durations exceeding the cochlea's tolerance. Risk rises with sound-pressure
    level and cumulative exposure time; the occupational NIOSH recommended limit
    is an 85 dBA 8-hour time-weighted average with a 3-dB exchange rate. Sources
    include industrial and construction machinery, firearms and blast, military
    operations, agriculture, and recreational exposures such as amplified music
    and personal listening devices. Impulse/blast noise is more damaging than
    continuous noise of equivalent energy and can produce immediate mechanical
    acoustic trauma at a single exposure. Co-exposure to ototoxic solvents
    (toluene, styrene), heavy metals, carbon monoxide, and ototoxic drugs
    potentiates noise injury.
  evidence:
  - reference: PMID:33129267
    reference_title: "An overview of occupational noise-induced hearing loss among workers: epidemiology, pathogenesis, and preventive measures."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Occupational noise-induced hearing loss (ONIHL) is the most prevalent occupational disease in the world."
    explanation: >-
      Establishes hazardous occupational noise as the cause of the world's most
      prevalent occupational disease. Evidence source is OTHER because this is a
      narrative systematic review.
  influences_mechanisms:
  - target: Acoustic Overexposure and Cochlear Energy Delivery
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Sound energy above the cochlea's tolerance is not a risk factor for the
      insult, it is the insult: the exposure and the energy delivered to the
      organ of Corti are the same physical event.
    evidence:
    - reference: PMID:27916698
      reference_title: "Cellular mechanisms of noise-induced hearing loss."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Exposure to intense sound or noise can result in purely temporary threshold shift (TTS), or leave a residual permanent threshold shift (PTS) along with alterations in growth functions of auditory nerve output."
      explanation: >-
        Intense sound exposure is what produces threshold shift and altered
        auditory nerve output, the cochlear consequences of the delivered energy.

pathophysiology:
- name: Acoustic Overexposure and Cochlear Energy Delivery
  description: >-
    Hazardous sound delivers mechanical energy to the cochlea that exceeds the
    dissipative capacity of the organ of Corti. This is the initiating exposure
    node: intense stimulation over-drives the sensory epithelium, and the excess
    energy is transduced into the mechanical and metabolic injury cascades that
    follow. Depending on intensity it can leave only a temporary threshold shift
    or a permanent one.
  conforms_to: "sensorineural_hair_cell_loss#Cochlear Sensory Epithelium Insult"
  biological_processes:
  - preferred_term: Sensory perception of sound
    term:
      id: GO:0007605
      label: sensory perception of sound
  evidence:
  - reference: PMID:27916698
    reference_title: "Cellular mechanisms of noise-induced hearing loss."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Exposure to intense sound or noise can result in purely temporary threshold shift (TTS), or leave a residual permanent threshold shift (PTS) along with alterations in growth functions of auditory nerve output."
    explanation: >-
      Frames acoustic overexposure as the upstream insult that produces either
      reversible (TTS) or permanent (PTS) cochlear injury. Evidence source is
      OTHER because this is a mechanistic review.
  downstream:
  - target: Direct Mechanical Disruption of the Organ of Corti
  - target: Cochlear Oxidative Stress
  - target: Cochlear Vascular Compromise and Ionic Homeostasis Disruption

- name: Direct Mechanical Disruption of the Organ of Corti
  description: >-
    At very high sound-pressure levels (impulse noise, blast, acute acoustic
    trauma) the excess vibration mechanically damages the cochlea directly:
    disarray and fracture of the stereocilia hair bundles, uncoupling of
    stereocilia from the tectorial membrane, and at extreme intensities frank
    disruption of the organ of Corti. Reversible stereocilia damage underlies
    the recoverable temporary threshold shift; severe mechanical injury is
    immediate and permanent. This mechanical arm is distinct from, and additive
    to, the slower metabolic arm.
  cell_types:
  - preferred_term: Cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  evidence:
  - reference: PMID:27916698
    reference_title: "Cellular mechanisms of noise-induced hearing loss."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Contributions to TTS include reversible damage to hair cell (HC) stereocilia or synapses, while moderate TTS reflects protective purinergic hearing adaptation."
    explanation: >-
      Documents reversible mechanical damage to hair-cell stereocilia as a
      substrate of temporary threshold shift. Evidence source is OTHER
      (mechanistic review).
  - reference: PMID:9674603
    reference_title: "Excitotoxicity and repair of cochlear synapses after noise-trauma induced hearing loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Beside the well described mechanical damage to outer hair cells, a total disruption of inner hair cell (IHC)-auditory nerve synapses was acutely observed within the traumatized area."
    explanation: >-
      Confirms direct mechanical damage to outer hair cells after acoustic
      trauma. Evidence source is MODEL_ORGANISM (guinea pig noise-trauma model).
  downstream:
  - target: Outer Hair Cell Dysfunction and Death

- name: Cochlear Oxidative Stress
  description: >-
    Intense sound massively increases metabolic demand and mitochondrial
    activity in hair cells and the cochlear lateral wall, generating reactive
    oxygen and nitrogen species that overwhelm cochlear antioxidant defenses.
    Free-radical formation persists for about ten days after exposure, defining
    a prolonged window of ongoing injury that activates intracellular stress
    pathways and tips hair cells into programmed or necrotic death. This is the
    oxidative arm, distinct from the vascular/ionic arm of metabolic injury.
  conforms_to: "sensorineural_hair_cell_loss#Cochlear Ionic Homeostasis Disruption and Oxidative Stress"
  biological_processes:
  - preferred_term: Reactive oxygen species metabolic process
    term:
      id: GO:0072593
      label: reactive oxygen species metabolic process
  - preferred_term: Cellular response to oxidative stress
    term:
      id: GO:0034599
      label: cellular response to oxidative stress
  chemical_entities:
  - preferred_term: Reactive oxygen species
    term:
      id: CHEBI:26523
      label: reactive oxygen species
  evidence:
  - reference: PMID:27916698
    reference_title: "Cellular mechanisms of noise-induced hearing loss."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "While the substrates of HC damage are complex, they include the accumulation of reactive oxygen species and the active stimulation of intracellular stress pathways, leading to programmed and/or necrotic cell death."
    explanation: >-
      Establishes reactive-oxygen-species accumulation and stress-pathway
      activation as a substrate of hair-cell death in NIHL. Evidence source is
      OTHER (mechanistic review).
  downstream:
  - target: Glutamate Excitotoxicity at the Inner Hair Cell Ribbon Synapse
  - target: Outer Hair Cell Dysfunction and Death

- name: Cochlear Vascular Compromise and Ionic Homeostasis Disruption
  description: >-
    Independently of the oxidative arm, intense noise reduces cochlear blood
    flow and produces ischemia-reperfusion injury, and it disrupts the
    endocochlear potential and stria vascularis ionic homeostasis. The fall in
    endocochlear potential reduces the driving force for hair-cell
    mechanotransduction and the cochlear amplifier, raising the auditory
    threshold on top of any direct sensory-cell loss.
  conforms_to: "sensorineural_hair_cell_loss#Cochlear Ionic Homeostasis Disruption and Oxidative Stress"
  evidence:
  - reference: PMID:33129267
    reference_title: "An overview of occupational noise-induced hearing loss among workers: epidemiology, pathogenesis, and preventive measures."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Changes in the stria vascularis are likely to decrease endocochlear function, thus decreasing the cochlear amplifying function for auditory signals and increasing the auditory threshold"
    explanation: >-
      Documents stria vascularis / endocochlear-potential dysfunction as a
      distinct threshold-raising mechanism in noise injury. Evidence source is
      OTHER (systematic review).
  downstream:
  - target: Outer Hair Cell Dysfunction and Death

- name: Glutamate Excitotoxicity at the Inner Hair Cell Ribbon Synapse
  description: >-
    Intense stimulation causes excessive glutamate release from inner hair cells
    onto the postsynaptic glutamate receptors of type I spiral-ganglion afferent
    terminals. The resulting calcium overload swells and ruptures the afferent
    dendrites (excitotoxic dendritic swelling), decoupling the afferent from the
    hair cell. Blocking glutamate signaling with the antagonist kynurenate is
    highly protective, identifying excitotoxicity as the acute trigger of
    synaptic loss - a mechanism distinct from hair-cell death itself.
  cell_types:
  - preferred_term: Cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  biological_processes:
  - preferred_term: Glutamate receptor signaling pathway
    term:
      id: GO:0007215
      label: glutamate receptor signaling pathway
  chemical_entities:
  - preferred_term: L-glutamate
    term:
      id: CHEBI:29985
      label: L-glutamate(1-)
  evidence:
  - reference: PMID:9674603
    reference_title: "Excitotoxicity and repair of cochlear synapses after noise-trauma induced hearing loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "To test the hypothesis that synaptic damage is due to an excessive release of glutamate by the IHCs, we examined the protective effect of the glutamate antagonist kynurenate on noise-induced hearing loss."
    explanation: >-
      Directly tests and supports glutamate excitotoxicity as the cause of
      afferent synaptic damage in noise trauma. Evidence source is
      MODEL_ORGANISM (guinea pig).
  - reference: PMID:9674603
    reference_title: "Excitotoxicity and repair of cochlear synapses after noise-trauma induced hearing loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The high degree of protection observed with kynurenate attests that dendritic damage is an important component in noise-induced hearing loss."
    explanation: >-
      Pharmacologic block of glutamate signaling protects against dendritic
      damage, confirming the excitotoxic mechanism. Evidence source is
      MODEL_ORGANISM (guinea pig).
  downstream:
  - target: Cochlear Synaptopathy

- name: Cochlear Synaptopathy
  description: >-
    Excitotoxic injury permanently removes a fraction of the ribbon synapses
    between surviving inner hair cells and spiral-ganglion afferents. Because
    the hair cells and audiometric thresholds can remain normal, this loss is
    "hidden hearing loss": it degrades suprathreshold coding (speech in noise,
    temporal processing) without necessarily raising the pure-tone audiogram. It
    is the earliest permanent lesion of noise injury and precedes hair-cell
    loss.
  cell_types:
  - preferred_term: Cochlear inner hair cell
    term:
      id: CL:0000589
      label: cochlear inner hair cell
  evidence:
  - reference: PMID:19906956
    reference_title: "Adding insult to injury: cochlear nerve degeneration after \"temporary\" noise-induced hearing loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "acoustic overexposures causing moderate, but completely reversible, threshold elevation leave cochlear sensory cells intact, but cause acute loss of afferent nerve terminals and delayed degeneration of the cochlear nerve."
    explanation: >-
      Demonstrates that synaptic/afferent loss occurs even when hair cells and
      thresholds recover - the defining feature of hidden hearing loss.
      Evidence source is MODEL_ORGANISM (mouse).
  - reference: PMID:9674603
    reference_title: "Excitotoxicity and repair of cochlear synapses after noise-trauma induced hearing loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "a total disruption of inner hair cell (IHC)-auditory nerve synapses was acutely observed within the traumatized area."
    explanation: >-
      Directly documents acute disruption of the inner-hair-cell-to-afferent
      ribbon synapses after noise trauma. Evidence source is MODEL_ORGANISM
      (guinea pig).
  downstream:
  - target: Spiral Ganglion Neuron Degeneration
  - target: Suprathreshold Coding Deficit (Hidden Hearing Loss)

- name: Outer Hair Cell Dysfunction and Death
  description: >-
    Outer hair cells, which provide the active cochlear amplifier via
    prestin-driven electromotility, are the most vulnerable cells to noise.
    Their stereocilia are damaged and the cells die by apoptosis and necrosis,
    beginning in the high-frequency basal turn. Loss of the amplifier reduces
    cochlear sensitivity and frequency selectivity, producing the elevated
    thresholds measured on the audiogram.
  conforms_to: "sensorineural_hair_cell_loss#Hair Cell Mechanotransduction Failure and Death"
  cell_types:
  - preferred_term: Cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  biological_processes:
  - preferred_term: Outer hair cell apoptotic process
    term:
      id: GO:1905584
      label: outer hair cell apoptotic process
  - preferred_term: Necroptotic process
    term:
      id: GO:0070266
      label: necroptotic process
  evidence:
  - reference: PMID:33883202
    reference_title: "Primary Neural Degeneration in Noise-Exposed Human Cochleas: Correlations with Outer Hair Cell Loss and Word-Discrimination Scores."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Outer hair cell (OHC) loss also increased with age throughout the cochlea but was unaffected by noise history in the low-frequency region"
    explanation: >-
      Human temporal-bone histopathology showing noise exacerbates
      outer-hair-cell loss preferentially at high frequencies (the quoted clause
      continues that it is greatly exacerbated at high frequencies). Evidence
      source is HUMAN_CLINICAL (autopsy cohort).
  downstream:
  - target: Noise-Induced Permanent Threshold Shift

- name: Spiral Ganglion Neuron Degeneration
  description: >-
    Following synaptic loss, the deafferented type I spiral-ganglion neurons
    slowly degenerate over months to years even when the hair cells survive.
    This delayed primary neural degeneration compounds the coding deficit,
    contributes to poor word discrimination, and is relevant to the later
    benefit of cochlear implantation, which depends on surviving neurons.
  conforms_to: "sensorineural_hair_cell_loss#Cochlear Amplification Loss and Spiral Ganglion Neuron Degeneration"
  cell_types:
  - preferred_term: Type I spiral ganglion neuron
    term:
      id: CL:4023115
      label: type 1 spiral ganglion neuron
  evidence:
  - reference: PMID:19906956
    reference_title: "Adding insult to injury: cochlear nerve degeneration after \"temporary\" noise-induced hearing loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "cause acute loss of afferent nerve terminals and delayed degeneration of the cochlear nerve."
    explanation: >-
      Demonstrates delayed cochlear-nerve (spiral-ganglion) degeneration
      following noise exposure. Evidence source is MODEL_ORGANISM (mouse).
  - reference: PMID:33883202
    reference_title: "Primary Neural Degeneration in Noise-Exposed Human Cochleas: Correlations with Outer Hair Cell Loss and Word-Discrimination Scores."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ANF loss was substantial at all cochlear frequencies and was exacerbated by noise throughout."
    explanation: >-
      Human temporal-bone evidence that noise exposure exacerbates
      auditory-nerve-fiber (spiral-ganglion) loss. Evidence source is
      HUMAN_CLINICAL (autopsy cohort).
  downstream:
  - target: Suprathreshold Coding Deficit (Hidden Hearing Loss)

- name: Noise-Induced Permanent Threshold Shift
  description: >-
    A single moderate exposure can cause a temporary threshold shift that
    recovers over hours to days, aided by a partial synaptic-repair mechanism.
    Severe or repeated exposure converts this into a permanent threshold shift
    as hair cells and synapses are irreversibly lost. The permanent deficit is
    classically maximal at 3-6 kHz (the audiometric noise notch) with relative
    recovery at 8 kHz, and progresses only while exposure continues, then
    stabilizes once it stops.
  conforms_to: "sensorineural_hair_cell_loss#Progressive Sensorineural Hearing Loss"
  biological_processes:
  - preferred_term: Sensory perception of sound
    term:
      id: GO:0007605
      label: sensory perception of sound
  evidence:
  - reference: PMID:9674603
    reference_title: "Excitotoxicity and repair of cochlear synapses after noise-trauma induced hearing loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "a synaptic repair mechanism occurring within the first few days post-exposure is partly responsible for the recovery of temporary threshold shifts after an acoustic trauma."
    explanation: >-
      Explains why temporary threshold shift can recover (partial synaptic
      repair), distinguishing it from the permanent shift. Evidence source is
      MODEL_ORGANISM (guinea pig).

- name: Suprathreshold Coding Deficit (Hidden Hearing Loss)
  description: >-
    The synaptopathic/neural arm converges here rather than on the audiogram.
    Loss of ribbon synapses and spiral-ganglion neurons degrades suprathreshold
    sound coding - impaired speech-in-noise recognition and temporal processing -
    even when pure-tone thresholds are normal or recovered. This "hidden hearing
    loss" endpoint is distinct from, and can coexist with, the permanent
    threshold shift produced by the hair-cell arm.
  cell_types:
  - preferred_term: Type I spiral ganglion neuron
    term:
      id: CL:4023115
      label: type 1 spiral ganglion neuron
  evidence:
  - reference: PMID:33883202
    reference_title: "Primary Neural Degeneration in Noise-Exposed Human Cochleas: Correlations with Outer Hair Cell Loss and Word-Discrimination Scores."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this loss of neural channels contributes to poor word discrimination among those with similar audiometric threshold losses."
    explanation: >-
      Human evidence that neural loss degrades word discrimination independent of
      audiometric threshold - the defining feature of the hidden-hearing-loss
      endpoint. Evidence source is HUMAN_CLINICAL (autopsy cohort with
      audiometric correlation).
  - reference: PMID:19906956
    reference_title: "Adding insult to injury: cochlear nerve degeneration after \"temporary\" noise-induced hearing loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This primary neurodegeneration should add to difficulties hearing in noisy environments, and could contribute to tinnitus, hyperacusis, and other perceptual anomalies commonly associated with inner ear damage."
    explanation: >-
      Links primary neural degeneration to difficulty hearing in noise. Evidence
      source is MODEL_ORGANISM (mouse).

phenotypes:
- name: Bilateral high-frequency sensorineural hearing loss
  category: Clinical
  description: >-
    NIHL classically presents as a bilateral, symmetric, high-frequency
    sensorineural hearing loss with a characteristic notch at 3-6 kHz and
    relative recovery at 8 kHz. Outer-hair-cell loss in the high-frequency basal
    turn is the structural correlate.
  phenotype_term:
    preferred_term: High-frequency sensorineural hearing impairment
    term:
      id: HP:0005101
      label: High-frequency hearing impairment
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:33129267
    reference_title: "An overview of occupational noise-induced hearing loss among workers: epidemiology, pathogenesis, and preventive measures."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is bilateral and symmetrical, usually affecting the higher frequencies at 4 kHz, with spread to neighboring frequencies of 3 and 6 kHz, and some hearing recovery at 8 kHz"
    explanation: >-
      Directly describes the bilateral, symmetric, high-frequency audiometric
      pattern with the 3-6 kHz notch and recovery at 8 kHz. Evidence source is
      OTHER (systematic review).
- name: Tinnitus
  category: Clinical
  description: >-
    Ringing or buzzing tinnitus frequently accompanies noise injury, is often
    the first and most bothersome symptom, and may precede measurable threshold
    loss.
  phenotype_term:
    preferred_term: Tinnitus
    term:
      id: HP:0000360
      label: Tinnitus
  evidence:
  - reference: PMID:33129267
    reference_title: "An overview of occupational noise-induced hearing loss among workers: epidemiology, pathogenesis, and preventive measures."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Tinnitus, the subjective sensation of sound, is an effect of noise exposure that can be even more bothersome for individuals than hearing loss."
    explanation: >-
      Human/clinical review documenting tinnitus as an effect of noise exposure.
      Evidence source is OTHER (systematic review).
  - reference: PMID:19906956
    reference_title: "Adding insult to injury: cochlear nerve degeneration after \"temporary\" noise-induced hearing loss."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "This primary neurodegeneration should add to difficulties hearing in noisy environments, and could contribute to tinnitus, hyperacusis, and other perceptual anomalies commonly associated with inner ear damage."
    explanation: >-
      Mechanistic link from noise-induced primary neural degeneration to
      tinnitus; support is PARTIAL because the association is inferred from a
      mouse model. Evidence source is MODEL_ORGANISM.
- name: Poor speech-in-noise discrimination
  category: Clinical
  description: >-
    Difficulty understanding speech in background noise is a hallmark functional
    complaint, partly attributable to cochlear synaptopathy and primary neural
    degeneration, and can exceed what the pure-tone audiogram predicts.
  phenotype_term:
    preferred_term: Poor speech discrimination in noise
    term:
      id: HP:0001963
      label: Abnormal speech discrimination
  evidence:
  - reference: PMID:33883202
    reference_title: "Primary Neural Degeneration in Noise-Exposed Human Cochleas: Correlations with Outer Hair Cell Loss and Word-Discrimination Scores."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "this loss of neural channels contributes to poor word discrimination among those with similar audiometric threshold losses."
    explanation: >-
      Human evidence that neural loss degrades word discrimination beyond what
      thresholds predict. Evidence source is HUMAN_CLINICAL (autopsy cohort with
      audiometric correlation).

genetic:
- name: NOX3
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: NOX3
    term:
      id: hgnc:7890
      label: NOX3
  notes: >-
    NADPH oxidase 3, a cochlea-enriched NADPH oxidase, is the top GWAS-nominated
    NIHL susceptibility locus and a prototypical gene-by-environment example
    whose effect is unmasked only by noise. Note the direction is not simply
    "more enzyme, more damage": in the discovery study Nox3-mutant and
    heterozygous mice were more susceptible than wild type, so the causal
    direction is not a straightforward damage-driving one.
  evidence:
  - reference: PMID:25880434
    reference_title: "Genome-wide association study identifies nox3 as a critical gene for susceptibility to noise-induced hearing loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "significant peak for susceptibility to NIHL on chromosome 17 within a haplotype block containing NADPH oxidase-3 (Nox3)."
    explanation: >-
      GWAS in the Hybrid Mouse Diversity Panel identifies Nox3 as a critical
      NIHL susceptibility gene. Evidence source is MODEL_ORGANISM (mouse GWAS
      with knockout validation).
- name: KCNQ4
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: KCNQ4
    term:
      id: hgnc:6298
      label: KCNQ4
  notes: >-
    KCNQ4, a potassium channel essential for cochlear K+ recycling and already a
    monogenic-deafness gene, is among the most reproducible NIHL
    susceptibility loci across cohorts.
  evidence:
  - reference: PMID:35903368
    reference_title: "The Role of Genetic Variants in the Susceptibility of Noise-Induced Hearing Loss."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "the mutant allele A of rs4660470 in KCNQ4 may be a risk factor for developing NIHL"
    explanation: >-
      Names KCNQ4 variant rs4660470 specifically as a NIHL risk factor.
      Evidence source is OTHER (systematic review of NIHL genetic
      susceptibility).
- name: CAT
  relationship_type: SUSCEPTIBILITY
  gene_term:

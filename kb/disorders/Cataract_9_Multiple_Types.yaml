    Slit-lamp biomicroscopy documents the presence, laterality and morphology
    of the opacity and detects subclinical opacities in relatives, including
    punctate opacities in recessive R54C carriers. Morphology does not
    identify the gene.
  diagnosis_term:
    preferred_term: slit-lamp examination
    term:
      id: NCIT:C75583
      label: Slit-lamp Examination
  evidence:
  - reference: PMID:23288997
    reference_title: "A novel mutation in CRYAA is associated with autosomal dominant suture cataracts in a Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotype of the family was identified as Y-suture cataract by using slit-lamp photography."
    explanation: Slit-lamp photography characterized the cataract in the R54P family.
  - reference: PMID:17937925
    reference_title: "Recessive congenital total cataract with microcornea and heterozygote carrier signs caused by a novel missense CRYAA mutation (R54C)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One other sibling and the two parents were heterozygotes; these individuals had punctuate lenticular opacities evident by careful slit-lamp biomicroscopy which were not present in the noncarriers, all of whom had unremarkable ophthalmic examinations."
    explanation: Careful slit-lamp examination revealed carrier opacities.
- name: Genetic testing for inherited cataract
  description: >-
    CRYAA cataract is identified by sequencing, either a targeted cataract
    gene panel or exome, with segregation testing in relatives. The cited
    yields are for congenital cataract of all genetic causes.
  diagnosis_term:
    preferred_term: whole exome sequencing or cataract gene panel
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:

    snippet: "Sequencing of the CRYAA in this Jewish Persian family revealed a G-to-A substitution, resulting in the formation of a premature stop codon (W9X)."
    explanation: Homozygous nonsense allele in an inbred recessive family.
  - reference: PMID:17937925
    reference_title: "Recessive congenital total cataract with microcornea and heterozygote carrier signs caused by a novel missense CRYAA mutation (R54C)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "R54C is the second reported recessive CRYAA mutation associated with congenital cataract and the first with described morphology: punctuate lenticular opacities in carriers and congenital total white cataract with microcornea in homozygotes."
    explanation: Recessive transmission of R54C, with affected homozygotes and mildly affected carriers.
pathophysiology:
- name: CRYAA Dominant Missense Variant
  biological_scale: MOLECULAR
  conforms_to: cataract_lens_opacification#Lens Homeostasis Insult
  description: >-
    Heterozygous missense substitutions, mostly at arginine residues in the
    N-terminal region (R12, R21, R49, R54) or the alpha-crystallin domain
    (R116), alter alphaA-crystallin structure. The effect on chaperone
    activity is allele-dependent: R116C and R116H lose most activity, R12C,
    R21L and R21W lose a moderate amount, and R49C and R54C retain normal
    activity against the ADH client in vitro, so reduced chaperone capacity
    is not the only route to disease.
  genes:
  - preferred_term: CRYAA
    term:
      id: hgnc:2388
      label: CRYAA
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
  molecular_functions:
  - preferred_term: alphaA-crystallin chaperone (holdase) activity
    term:
      id: GO:0044183
      label: protein folding chaperone
    modifier: DECREASED
  evidence:
  - reference: PMID:11123904
    reference_title: "Structural and functional changes in the alpha A-crystallin R116C mutant in hereditary cataracts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Chaperone-like activity of the alphaA R116C mutant is approximately 4-fold lower than wild type, whether measured before or after conversion to a polydisperse population with incubation."
    explanation: Recombinant R116C protein has reduced chaperone activity.
  - reference: PMID:22045060
    reference_title: "Quaternary structural parameters of the congenital cataract causing mutants of αA-crystallin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Chaperone activity, as measured with ADH as the target protein, appeared normal in R49C and R54C, while R12C, R21L, and R21W showed moderate loss and R116C and R116H showed significant loss."
    explanation: Allele-dependent chaperone loss across seven cataract mutants.
  downstream:
  - target: Loss of Alpha-Crystallin Chaperone Capacity
    causal_link_type: DIRECT
    description: Missense alleles at R116 and in the N-terminal region reduce chaperone activity of the mutant subunits.
    evidence:
    - reference: PMID:22045060
      reference_title: "Quaternary structural parameters of the congenital cataract causing mutants of αA-crystallin."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Chaperone activity, as measured with ADH as the target protein, appeared normal in R49C and R54C, while R12C, R21L, and R21W showed moderate loss and R116C and R116H showed significant loss."
      explanation: Chaperone loss for five of seven tested alleles.
  - target: Abnormal Alpha-Crystallin Oligomer Assembly
    causal_link_type: DIRECT
    description: Mutant subunits form polydisperse or abnormally sized oligomers and exchange subunits poorly.
    evidence:
    - reference: PMID:11123904
      reference_title: "Structural and functional changes in the alpha A-crystallin R116C mutant in hereditary cataracts."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Homocomplexes of mutant subunits become highly polydisperse following incubation at 37 degrees C, reflecting the likely in vivo distribution of the complexes."
      explanation: R116C oligomers become polydisperse.
    - reference: PMID:11123904
      reference_title: "Structural and functional changes in the alpha A-crystallin R116C mutant in hereditary cataracts."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "alphaA R116C complexes also have a 4-fold reduced ability to exchange subunits with wild-type complexes."
      explanation: Reduced subunit exchange with wild-type protein.
  - target: Lens Cell Apoptosis
    causal_link_type: DIRECT
    description: R49C, unlike wild-type alphaA-crystallin, mislocalizes to the nucleus and does not protect lens epithelial cells from apoptosis.
    evidence:
    - reference: PMID:14512969
      reference_title: "Cell death triggered by a novel mutation in the alphaA-crystallin gene underlies autosomal dominant cataract linked to chromosome 21q."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Transfection studies of lens epithelial cells revealed that, unlike wild-type CRYAA, the R49C mutant protein was abnormally localized to the nucleus and failed to protect from staurosporine-induced apoptotic cell death."
      explanation: Loss of the anti-apoptotic function of alphaA-crystallin for a dominant allele.
  - target: Disturbed Lens-Anterior Segment Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Dominant alleles, particularly at R116, are associated with microcornea
      and other anterior segment malformation; the developmental mechanism is
      not established.
    evidence:
    - reference: PMID:17724170
      reference_title: "Genetic heterogeneity in microcornea-cataract: five novel mutations in CRYAA, CRYGD, and GJA8."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Clinical heterogeneity, including additional malformation of the anterior segment of the eye, confirm that dedicated cataract genes may be involved in the largely unknown developmental molecular mechanisms involved in lens-anterior segment interactions."
      explanation: The authors infer a developmental lens-anterior segment role from the clinical findings; the mechanism is not shown.
- name: CRYAA Recessive Loss-of-Function Variant
  biological_scale: MOLECULAR
  conforms_to: cataract_lens_opacification#Lens Homeostasis Insult
  description: >-
    Homozygous W9X introduces a stop codon at residue 9 and is expected to
    abolish alphaA-crystallin; homozygous R54C is a missense allele whose
    carriers have subclinical punctate opacities, so heterozygous R54C is not
    fully silent, and R54C has elsewhere been reported as a dominant allele
    whose chaperone activity is normal in vitro. The loss-of-function
    category is therefore secure for W9X only; for R54C it is an assumption
    from recessive transmission. The Cryaa-null mouse, which makes no alphaA-crystallin,
    models complete loss.
  genes:
  - preferred_term: CRYAA
    term:
      id: hgnc:2388
      label: CRYAA
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: alphaA-crystallin chaperone (holdase) activity
    term:
      id: GO:0044183
      label: protein folding chaperone
    modifier: DECREASED
  - preferred_term: structural constituent of eye lens
    term:
      id: GO:0005212
      label: structural constituent of eye lens
    modifier: DECREASED
  evidence:
  - reference: PMID:11006246
    reference_title: "A nonsense mutation (W9X) in CRYAA causes autosomal recessive cataract in an inbred Jewish Persian family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of the CRYAA in this Jewish Persian family revealed a G-to-A substitution, resulting in the formation of a premature stop codon (W9X)."
    explanation: Early nonsense allele in the recessive family.
  - reference: PMID:9023351
    reference_title: "Targeted disruption of the mouse alpha A-crystallin gene induces cataract and cytoplasmic inclusion bodies containing the small heat shock protein alpha B-crystallin."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Mice that are homozygous for the disrupted allele produce no detectable alpha A in their lenses, based on protein gel electrophoresis and immunoblot analysis."
    explanation: Complete loss of alphaA-crystallin in the null mouse, the model for truncating recessive alleles.
  downstream:
  - target: Loss of Alpha-Crystallin Chaperone Capacity
    causal_link_type: DIRECT
    description: Absence of alphaA-crystallin removes its chaperone contribution, and alphaB-crystallin becomes insoluble without it.
    evidence:
    - reference: PMID:9023351
      reference_title: "Targeted disruption of the mouse alpha A-crystallin gene induces cataract and cytoplasmic inclusion bodies containing the small heat shock protein alpha B-crystallin."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "These studies suggest that alpha A is essential for maintaining lens transparency, possibly by ensuring that alpha B or proteins closely associated with this small heat shock protein remain soluble."
      explanation: The null mouse links loss of alphaA-crystallin to loss of solubility of its partner; mouse rather than human allele.
  - target: Disturbed Lens-Anterior Segment Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Microcornea accompanies the recessive R54C cataract; its cause is hypothesized.
    evidence:
    - reference: PMID:17937925
      reference_title: "Recessive congenital total cataract with microcornea and heterozygote carrier signs caused by a novel missense CRYAA mutation (R54C)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "The microcornea may have been caused by an inductive effect on the developing cornea from the abnormal lens and/or reduced CRYAA molecular chaperoning of the cornea."
      explanation: Authors' hypothesis for the microcornea; not tested.
- name: Loss of Alpha-Crystallin Chaperone Capacity
  biological_scale: CELLULAR
  conforms_to: cataract_lens_opacification#Loss of Crystallin Solubility and Chaperone Capacity
  description: >-
    Lens fiber cells cannot turn over proteins, so the alpha-crystallins, as
    holdase chaperones, sequester destabilized beta- and gamma-crystallins and
    keep them soluble. Reduced or absent alphaA-crystallin activity lowers
    this capacity.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  biological_processes:
  - preferred_term: chaperone-mediated maintenance of lens protein solubility
    term:
      id: GO:0006457
      label: protein folding
    modifier: DECREASED
  evidence:
  - reference: PMID:30475834
    reference_title: "Transgenic zebrafish models reveal distinct molecular mechanisms for cataract-linked αA-crystallin mutants."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Terminally differentiated lens fiber cells, devoid of cellular machineries that repair and turn proteins over, rely on two small heat shock proteins (sHSPs), αA- and αB-crystallin, which function as molecular chaperones by sequestering thermodynamically destabilized client proteins to inhibit aggregation [2–5]."
    explanation: Background statement of the chaperone role of alpha-crystallins in lens fibers.
  downstream:
  - target: Crystallin Aggregation and Insolubility in Lens Fibers
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:9023351
      reference_title: "Targeted disruption of the mouse alpha A-crystallin gene induces cataract and cytoplasmic inclusion bodies containing the small heat shock protein alpha B-crystallin."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In addition, immunoblot analyses demonstrate that a significant portion of the alpha B in alpha A-/- lenses shifts into the insoluble fraction."
      explanation: Without alphaA-crystallin, alphaB-crystallin becomes insoluble.

name: Cataract 9 Multiple Types
creation_date: "2026-10-27T14:56:22Z"
category: Mendelian
parents:
- Early-onset non-syndromic cataract
synonyms:
- CTRCT9
- cataract 9, multiple types
- cataract 9, multiple types, with or without microcornea
- CRYAA-related cataract
- alphaA-crystallin-related cataract
description: >-
  Inherited, usually congenital or early-childhood, bilateral cataract caused
  by germline variants in CRYAA on 21q22.3, which encodes alphaA-crystallin
  (HSPB4), the most abundant small heat shock protein of the lens and an
  ATP-independent chaperone that keeps other lens proteins soluble.
  Heterozygous missense variants, most of them replacing an arginine (R12C,
  R21W, R21Q, R49C, R54P, R116C, R116H, and the putative G98R), cause
  autosomal dominant cataract of very variable morphology (nuclear, lamellar,
  anterior polar, cortical, sutural, fan-shaped, embryonal, anterior
  subcapsular) and are frequently accompanied by microcornea and sometimes by
  corneal opacity or other anterior segment malformation, and in one R21W
  family by microphthalmia. R54C has been reported both as a dominant allele
  (with R12C and R21W, in families with nuclear cataract and microcornea) and,
  in a separate sibship, as a recessive allele whose homozygotes have
  congenital total cataract and whose heterozygous carriers show only
  punctate opacities; homozygous W9X (nonsense) also causes recessive
  cataract. Mutant
  alphaA-crystallin forms abnormal, polydisperse oligomers, loses chaperone
  activity to varying degrees, co-aggregates with wild-type protein and
  becomes insoluble; in knock-in mouse lenses the R49C allele also activates
  the unfolded protein response and lens fiber cell apoptosis. The resulting
  crystallin aggregation and fiber cell loss scatter light. Management is
  surgical lens extraction with optical and amblyopia care; no
  genotype-directed therapy exists.

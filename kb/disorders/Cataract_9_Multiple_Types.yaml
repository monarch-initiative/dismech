genetic:
- name: CRYAA
  gene_term:
    preferred_term: CRYAA
    term:
      id: hgnc:2388
      label: CRYAA
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Dominant alleles include c.34C>T p.(Arg12Cys), p.(Arg21Trp),
    c.62G>A p.(Arg21Gln), c.145C>T p.(Arg49Cys), c.161G>C p.(Arg54Pro),
    p.(Arg116Cys), p.(Arg116His) and the putative c.292G>A p.(Gly98Arg).
    Recessive alleles are p.(Trp9*) and p.(Arg54Cys); p.(Arg54Cys) has also
    been reported as a dominant allele (PMID:22045060, background). No ClinGen gene-disease
    validity record for CRYAA was found in the local cache; the published
    ClinGen-protocol curation cited below is not a ClinGen record, so no
    gene_disease_validity assertion is recorded.
  evidence:
  - reference: PMID:42091610
    reference_title: "Evaluating gene-disease relationship strength in crystallin genes in association with pediatric cataracts."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Seven genes (CRYAA, CRYAB, CRYBA1, CRYBB1, CRYBB2, CRYGC, CRYGD) scored as Definitively associated with autosomal dominant (AD) inherited pediatric cataracts."
    explanation: Published curation using ClinGen protocols scores CRYAA as definitive for dominant pediatric cataract.
  - reference: PMID:14512969
    reference_title: "Cell death triggered by a novel mutation in the alphaA-crystallin gene underlies autosomal dominant cataract linked to chromosome 21q."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis identified a C --> T transition in exon 1 of CRYAA from affected individuals that was predicted to result in the nonconservative substitution of cysteine for arginine at codon 49 (R49C)."
    explanation: R49C identified by linkage and sequencing.
  - reference: PMID:23255486
    reference_title: "Identification of a novel oligomerization disrupting mutation in CRYΑA associated with congenital cataract in a South Australian family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a novel segregating heterozygous mutation, c.62G>A (p.R21Q), in the CRYΑA gene in one family."
    explanation: Segregating R21Q allele.
  - reference: PMID:16862070
    reference_title: "Identification of a novel, putative cataract-causing allele in CRYAA (G98R) in an Indian family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The G98R mutation segregates only in affected family members and is not seen in representative controls."
    explanation: Segregation of the putative G98R allele.
animal_models:
- name: Cryaa knockout mouse
  species: Mus musculus
  genotype: Cryaa-/-
  publication: PMID:9023351
  modeled_mechanisms:
  - target: Crystallin Aggregation and Insolubility in Lens Fibers
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Null lenses form alphaB-crystallin inclusion bodies and develop progressive nuclear opacity.
    limitations: >-
      Complete loss models the recessive truncating allele, not the
      heterozygous missense alleles of dominant disease.
    evidence:
    - reference: PMID:9023351
      reference_title: "Targeted disruption of the mouse alpha A-crystallin gene induces cataract and cytoplasmic inclusion bodies containing the small heat shock protein alpha B-crystallin."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Light and transmission electron microscopy reveal the presence of dense inclusion bodies in the central lens fiber cells."
      explanation: Inclusion bodies in central fibers of the null lens.
- name: Cryaa R49C knock-in mouse
  species: Mus musculus
  genotype: Cryaa R49C knock-in, heterozygous and homozygous
  publication: PMID:18056999
  modeled_mechanisms:
  - target: Lens Cell Apoptosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Homozygotes show lens fiber cell apoptosis, small eyes and severe cataract at birth; heterozygotes have early nuclear cataract.
    limitations: >-
      Apoptosis was shown in homozygotes, a genotype not reported in humans
      for R49C; the human R49C family is heterozygous.
    evidence:
    - reference: PMID:18056999
      reference_title: "Mechanism of small heat shock protein function in vivo: a knock-in mouse model demonstrates that the R49C mutation in alpha A-crystallin enhances protein insolubility and cell death."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Unexpectedly, alphaA-R49C homozygosity led to small eye phenotype and severe cataracts at birth."
      explanation: Severe phenotype in homozygous knock-in mice.
  - target: Loss of Lens Transparency
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: Heterozygous knock-in lenses develop early nuclear cataract, matching the human heterozygous R49C phenotype.
    limitations: Mouse lens; the human allele is carried on the mouse gene.
    evidence:
    - reference: PMID:18056999
      reference_title: "Mechanism of small heat shock protein function in vivo: a knock-in mouse model demonstrates that the R49C mutation in alpha A-crystallin enhances protein insolubility and cell death."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "alphaA-R49C heterozygosity led to early cataracts characterized by nuclear opacities."
      explanation: Heterozygous nuclear cataract.

has_subtypes:
- name: Autosomal dominant
  display_name: Autosomal dominant CRYAA cataract (with or without microcornea)
  description: >-
    Heterozygous missense CRYAA variants segregating with congenital or
    childhood cataract, with or without microcornea, in multigeneration
    families. Morphology and severity vary within families. R54C is listed
    here as well as under the recessive form: it was reported as a dominant
    allele alongside R12C and R21W, while a different family transmitted it
    recessively (PMID:17937925).
  evidence:
  - reference: PMID:9467006
    reference_title: "Autosomal dominant congenital cataract associated with a missense mutation in the human alpha crystallin gene CRYAA."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By sequencing the coding regions of CRYAA, we found that a missense mutation, R116C, is associated with ADCC in this family."
    explanation: First dominant CRYAA allele, R116C, in an autosomal dominant congenital cataract family.
  - reference: PMID:17724170
    reference_title: "Genetic heterogeneity in microcornea-cataract: five novel mutations in CRYAA, CRYGD, and GJA8."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three of these affected the crystallin, alpha-A gene (CRYAA), including two mutations (R12C and R21W) in the crystallin domain and one mutation (R116H) in the small heat shock domain."
    explanation: Three further dominant CRYAA missense alleles in Danish cataract-microcornea families.
  - reference: PMID:22045060
    reference_title: "Quaternary structural parameters of the congenital cataract causing mutants of αA-crystallin."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "The affected members of the three families had autosomal dominant bilateral congenital nuclear cataract in association with microcornea, all detected at the time of birth."
    explanation: >-
      The three families are those carrying R12C, R21W and R54C, named in the
      preceding sentence of this introduction; the paper restates an earlier
      clinical report, so R54C is also on record as a dominant allele.
- name: Autosomal recessive
  display_name: Autosomal recessive CRYAA congenital cataract
  description: >-
    Homozygous CRYAA nonsense (W9X) or missense (R54C) alleles in
    consanguineous or sibship families with congenital cataract, total and
    white with microcornea in the R54C family. R54C heterozygous carriers have
    punctate lens opacities visible only on careful slit-lamp examination.
    MONDO has no separate term for this form; it is kept in this entry because
    the gene and the downstream lens mechanism are shared.
  evidence:
  - reference: PMID:11006246
    reference_title: "A nonsense mutation (W9X) in CRYAA causes autosomal recessive cataract in an inbred Jewish Persian family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A nonsense mutation in the CRYAA gene causes autosomal recessive cataract in one family."
    explanation: First recessive CRYAA family (W9X).
  - reference: PMID:17937925
    reference_title: "Recessive congenital total cataract with microcornea and heterozygote carrier signs caused by a novel missense CRYAA mutation (R54C)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "R54C is the second reported recessive CRYAA mutation associated with congenital cataract and the first with described morphology: punctuate lenticular opacities in carriers and congenital total white cataract with microcornea in homozygotes."
    explanation: Second recessive allele and the recessive phenotype.

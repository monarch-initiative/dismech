    reference_title: "Evaluation of Genetic Testing in a Cohort of Diverse Pediatric Patients in the United States with Congenital Cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Whole exome sequencing and targeted congenital cataract panels showed diagnostic yields of 46.2% and 37.5%, respectively."
    explanation: Diagnostic yield of genetic testing in congenital cataract generally, not CRYAA-specific.
  - reference: PMID:17937925
    reference_title: "Recessive congenital total cataract with microcornea and heterozygote carrier signs caused by a novel missense CRYAA mutation (R54C)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

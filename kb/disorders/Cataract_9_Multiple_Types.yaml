    snippet: "One mutation (P189L) affected the gap junction protein alpha 8 (GJA8), and one mutation (Y134X) was detected in crystallin gamma-D (CRYGD)."
    explanation: Same phenotype caused by GJA8 and CRYGD variants in the same Danish series.
treatments:
- name: Cataract Surgery
  description: >-
    Lens extraction for visually significant opacity, followed by optical
    correction and amblyopia therapy. For dense bilateral congenital cataract
    the timing of surgery in the first weeks of life governs visual outcome.
    The timing evidence comes from cohorts that were not genotyped. No
    CRYAA-specific therapy exists.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cataract surgery
    term:
      id: NCIT:C157809
      label: Cataract Surgery
  target_phenotypes:
  - preferred_term: Congenital cataract
    term:
      id: HP:0000519
      label: Developmental cataract
  evidence:
  - reference: PMID:19084444
    reference_title: "The critical period for surgical treatment of dense congenital bilateral cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "During weeks 0-14, mean visual acuity decreased by 1 line with each 3 weeks' delay in surgery."
    explanation: Dense bilateral congenital cataract of unspecified cause; not genotyped for CRYAA.
- name: Pharmacological chaperone (experimental)
  description: >-
    The oxysterol compound 29 (5-cholesten-3b,25-diol, that is
    25-hydroxycholesterol) binds alpha-crystallins, reverses their aggregation
    in vitro and improved lens transparency in R49C knock-in mice. Preclinical
    only; there are no human data.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: compound 29 (25-hydroxycholesterol)
      term:
        id: CHEBI:42977
        label: 25-hydroxycholesterol
  target_mechanisms:
  - target: Crystallin Aggregation and Insolubility in Lens Fibers
    description: Stabilizes alpha-crystallin and restores its solubility.
    evidence:
    - reference: PMID:26542570
      reference_title: "Pharmacological chaperone for α-crystallin partially restores transparency in cataract models."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The most promising compound improved lens transparency in the R49C cryAA and R120G cryAB mouse models of hereditary cataract."
      explanation: Improved transparency in the R49C model.
  evidence:
  - reference: PMID:26542570
    reference_title: "Pharmacological chaperone for α-crystallin partially restores transparency in cataract models."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that compound 29 could improve the Tm of three mutants in cryAA (R49C, F71L and R116C) by at least 2 °C (Fig S4)."
    explanation: Thermal stabilization of disease mutants of alphaA-crystallin.
notes: >-
  No CRYAA-specific prevalence estimate exists. No GeneReviews or StatPearls
  chapter covers CTRCT9 or CRYAA cataract (Bookshelf index snapshot
  2026-09-10 plus an online PubMed title search, matched on the entry name
  and synonyms). The recessive R54C allele
  (PMID:17937925) is included with the recessive subtype; a mouse study of the
  same substitution (PMID:18282497) could not be used because no abstract is
  available in the reference cache. The human microphthalmia, lamellar
  cataract and dominant-R54C statements come from the introduction of
  PMID:22045060, which restates an earlier clinical report that is not in the
  reference cache; they are marked as background quotes for that reason.

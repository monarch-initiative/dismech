progression:
- phase: Paediatric presentation with infection and enteropathy
  notes: >
    The published natural history is thin — one detailed case report plus a
    seven-patient defining cohort whose abstract gives no ages. What is
    documented is a paediatric presentation combining recurrent pneumonia with a
    gastrointestinal syndrome of chronic diarrhoea and abdominal pain, on a
    background of hypogammaglobulinaemia and persistent B-cell lymphopenia.
  evidence:
  - reference: PMID:40274250
    reference_title: "Allogeneic hematopoietic stem cell transplantation in a patient with combined immunodeficiency caused by IRF4 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a pediatric case involving a male patient who presented with recurrent pneumonia, chronic diarrhoea, abdominal pain, and a skin rash."
    explanation: Documents the paediatric presenting syndrome.
  - reference: PMID:40274250
    reference_title: "Allogeneic hematopoietic stem cell transplantation in a patient with combined immunodeficiency caused by IRF4 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory evaluation revealed hypoglobulinemia and persistent B-cell lymphopenia."
    explanation: Gives the laboratory picture accompanying that presentation.
- phase: Failure of conventional therapy, then immune reconstitution after transplantation
  notes: >
    In the single published transplanted case, conventional management failed
    and allogeneic HSCT from an unrelated donor with reduced-toxicity
    conditioning produced immune reconstitution and complete resolution of the
    gastrointestinal symptoms. One case is not a natural history; this phase
    records what has been observed, not an expected course.
  evidence:
  - reference: PMID:40274250
    reference_title: "Allogeneic hematopoietic stem cell transplantation in a patient with combined immunodeficiency caused by IRF4 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given the failure of conventional therapies, the patient successfully underwent allogeneic hematopoietic stem cell transplantation (HSCT) from an unrelated donor using a reduced-toxicity conditioning regimen."
    explanation: Documents the failure of conventional therapy and the transplant approach taken.
  - reference: PMID:40274250
    reference_title: "Allogeneic hematopoietic stem cell transplantation in a patient with combined immunodeficiency caused by IRF4 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Post-transplant follow-up demonstrated successful immune reconstitution and complete resolution of gastrointestinal symptoms."
    explanation: Documents the post-transplant outcome.

clinical_burden:
  burden_level: HIGH
  rationale: >
    Agammaglobulinaemia with profound susceptibility to opportunistic infection,
    notably Pneumocystis jirovecii, in a disorder where conventional therapy
    failed in the one published case and allogeneic transplantation was required
    to reconstitute immunity. The evidence base is a seven-patient defining
    cohort plus a single transplanted case, so this assessment rests on the
    severity of the documented immunological defect rather than on cohort
    mortality data, which do not exist for IMD131.
  evidence:
  - reference: PMID:36662884
    reference_title: "A multimorphic mutation in IRF4 causes human autosomal dominant combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients exhibited profound susceptibility to opportunistic infections, notably Pneumocystis jirovecii, and presented with agammaglobulinemia."
    explanation: Establishes the severity of the immunological defect underpinning this burden assessment.
  - reference: PMID:40274250
    reference_title: "Allogeneic hematopoietic stem cell transplantation in a patient with combined immunodeficiency caused by IRF4 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given the failure of conventional therapies, the patient successfully underwent allogeneic hematopoietic stem cell transplantation (HSCT) from an unrelated donor using a reduced-toxicity conditioning regimen."
    explanation: Supports the management burden — conventional therapy insufficient, transplantation required.
animal_models:
- name: Heterozygous Irf4 T95R knock-in mouse
  species: Mouse (Mus musculus)
  genotype: Heterozygous Irf4 T95R knock-in
  category: Knock-in
  description: >
    A knock-in mouse model carrying heterozygous Irf4 T95R shows a severe defect
    in antibody production at steady state and after immunization, recapitulating
    the combined immunodeficiency seen in patients. Because the model reproduces
    the human allele in the heterozygous state rather than deleting the gene, it
    tests the multimorphic mechanism specifically and not simple
    haploinsufficiency.
  genes:
  - preferred_term: Irf4
    term:
      id: hgnc:6119
      label: IRF4
  associated_phenotypes:
  - Severe defect in antibody production
  modeled_mechanisms:
  - target: Agammaglobulinemia (Absent Antibody Production)
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The heterozygous knock-in reproduces the defining humoral output failure
      of the human disease, at steady state and after challenge with different
      antigen types.
    limitations: >-
      The cited abstract reports the antibody-production defect but does not
      report whether the mouse reproduces the opportunistic-infection
      susceptibility, the TH17/TFH deficits, or the human agammaglobulinaemia
      quantitatively, so fidelity beyond the antibody phenotype is unestablished
      from this source. Mouse and human IRF4-dependent B-cell programmes are
      also not identical.
    readouts:
    - name: Serum antibody production at steady state and after immunization
      target: Agammaglobulinemia (Absent Antibody Production)
      direction: DECREASED
      interpretation: >-
        A severe reduction in antibody output in the heterozygous knock-in is
        the murine correlate of patient agammaglobulinaemia, and establishes
        that one T95R allele suffices.
      evidence:
      - reference: PMID:36662884
        reference_title: "A multimorphic mutation in IRF4 causes human autosomal dominant combined immunodeficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "A knock-in mouse model of heterozygous T95R showed a severe defect in antibody production both at the steady state and after immunization with different types of antigens, consistent with the CID observed in these patients."
        explanation: Reports the measured antibody-production defect in both unchallenged and immunized animals.
    evidence:
    - reference: PMID:36662884
      reference_title: "A multimorphic mutation in IRF4 causes human autosomal dominant combined immunodeficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A knock-in mouse model of heterozygous T95R showed a severe defect in antibody production both at the steady state and after immunization with different types of antigens, consistent with the CID observed in these patients."
      explanation: >-
        The authors themselves treat the model as informative for the human
        combined immunodeficiency, which is the claim this link makes.
  evidence:
  - reference: PMID:36662884
    reference_title: "A multimorphic mutation in IRF4 causes human autosomal dominant combined immunodeficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A knock-in mouse model of heterozygous T95R showed a severe defect in antibody production both at the steady state and after immunization with different types of antigens, consistent with the CID observed in these patients."
    explanation: >
      Model-organism recapitulation of the antibody-production defect
      supporting the causal role of T95R.

treatments:
- name: Immunoglobulin Replacement Therapy
  description: >
    Replacement immunoglobulin (IVIG/SCIG) to correct agammaglobulinemia and
    reduce infection burden, a mainstay of management for antibody-deficient
    combined immunodeficiency.
  notes: >
    Standard-of-care extrapolation for antibody-deficient combined
    immunodeficiency; not specifically trialed in IMD131. A previous version of
    this note asserted that a reported IMD131 proband received IVIG, citing the
    PMID:36662884 cohort "/ associated case reports". Neither cached abstract
    mentions immunoglobulin replacement, so that claim was removed rather than
    left uncited. What the literature does establish is that conventional
    therapy proved insufficient in the one published transplanted case — cited
    below as indirect evidence, since it bears on the limits of this treatment
    rather than on its efficacy.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: immunoglobulin replacement therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:
  - target: Agammaglobulinemia (Absent Antibody Production)
    treatment_effect: BYPASSES
    description: >
      Exogenous immunoglobulin supplies the antibody the patient cannot
      produce, bypassing the agammaglobulinemia rather than correcting the
      underlying B-cell defect.
  evidence:
  - reference: PMID:40274250
    reference_title: "Allogeneic hematopoietic stem cell transplantation in a patient with combined immunodeficiency caused by IRF4 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given the failure of conventional therapies, the patient successfully underwent allogeneic hematopoietic stem cell transplantation (HSCT) from an unrelated donor using a reduced-toxicity conditioning regimen."
    directness: INDIRECT
    explanation: >-
      Indirect: records that conventional (non-transplant) management failed in
      the published IRF4-mutation case, bounding what supportive replacement
      therapy achieves in this disorder rather than evidencing its efficacy.

- name: Antimicrobial Prophylaxis
  description: >
    Prophylaxis against opportunistic infection, including anti-Pneumocystis
    jirovecii prophylaxis (typically trimethoprim-sulfamethoxazole), given the
    profound susceptibility to opportunistic pathogens.
  notes: >
    Standard-of-care extrapolation from combined-immunodeficiency management
    (anti-Pneumocystis prophylaxis); not specifically trialed in IMD131.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antimicrobial prophylaxis
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: trimethoprim
      term:
        id: CHEBI:45924
        label: trimethoprim
    - preferred_term: sulfamethoxazole
      term:
        id: CHEBI:9332
        label: sulfamethoxazole

- name: Hematopoietic Stem Cell Transplantation
  description: >
    Allogeneic hematopoietic stem cell transplantation is the potentially
    curative option for severe combined immunodeficiency phenotypes.
  treatment_term:
    preferred_term: allogeneic hematopoietic stem cell transplantation
    term:
      id: NCIT:C46089
      label: Allogeneic Hematopoietic Stem Cell Transplantation
  therapeutic_modality: CELL_THERAPY
  target_mechanisms:
  - target: Impaired B Cell Maturation and Plasma Cell Differentiation
    treatment_effect: RESTORES
    description: >
      Donor-derived hematopoiesis replaces the IRF4-mutant lymphoid
      compartment, restoring normal B-cell maturation and antibody production
      (reported immune reconstitution).
  - target: Impaired T Cell Differentiation
    treatment_effect: RESTORES
    description: >
      Donor-derived hematopoiesis restores the normal T-cell effector
      differentiation program (reported immune reconstitution).
  evidence:
  - reference: PMID:40274250
    reference_title: "Allogeneic hematopoietic stem cell transplantation in a patient with combined immunodeficiency caused by IRF4 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the patient successfully underwent allogeneic hematopoietic stem cell transplantation (HSCT) from an unrelated donor using a reduced-toxicity conditioning regimen. Post-transplant follow-up demonstrated successful immune reconstitution and complete resolution of gastrointestinal symptoms."
    explanation: >
      Clinical evidence that allogeneic HSCT reconstitutes the immune system
      and resolves enteropathy in an IRF4-mutation combined immunodeficiency patient.

diagnosis:
- name: Molecular genetic testing
  description: >
    Definitive diagnosis rests on molecular identification of the heterozygous
    IRF4 variant (recurrent p.T95R) by gene-panel or exome sequencing in a patient
    with combined immunodeficiency.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:40274250
    reference_title: "Allogeneic hematopoietic stem cell transplantation in a patient with combined immunodeficiency caused by IRF4 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis confirmed that the combined immunodeficiency was caused by an IRF4 mutation."
    explanation: >
      Genetic testing to identify the causal IRF4 variant establishes the
      diagnosis.
- name: Lymphocyte immunophenotyping
  description: >
    Flow-cytometric immunophenotyping supports the diagnosis by demonstrating the
    characteristic humoral and cellular defects — reduced/absent circulating
    immunoglobulins, persistent B-cell lymphopenia with impaired B-cell
    maturation, and reduced TH17/TFH populations.
  diagnosis_term:
    preferred_term: lymphocyte immunophenotyping
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  evidence:
  - reference: PMID:40274250
    reference_title: "Allogeneic hematopoietic stem cell transplantation in a patient with combined immunodeficiency caused by IRF4 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory evaluation revealed hypoglobulinemia and persistent B-cell lymphopenia."
    explanation: >
      Immunophenotyping/laboratory evaluation demonstrates the hypogammaglobulinemia
      and B-cell lymphopenia supporting the diagnosis.

differential_diagnoses:
- name: IRF4 haploinsufficiency (Whipple's disease susceptibility)
  description: >
    A distinct IRF4-related immune disorder in which IRF4 haploinsufficiency (e.g.
    the hypomorphic p.R25S variant, without negative dominance) predisposes to
    Whipple's disease (Tropheryma whipplei) with otherwise normal immunity — in
    contrast to the multimorphic, negatively-dominant T95R variant that causes the
    combined immunodeficiency of IMD131.
  distinguishing_features:
  - IMD131 is caused by the multimorphic (loss + gain + neomorphic) negatively-dominant T95R variant; IRF4 haploinsufficiency is a simple hypomorphic loss-of-function without negative dominance.
  - IMD131 produces broad combined immunodeficiency with agammaglobulinemia and opportunistic infection; IRF4 haploinsufficiency shows narrow susceptibility to Whipple's disease with otherwise intact immunity.
  evidence:
  - reference: PMID:41424747
    reference_title: "IRF4 haploinsufficiency in a multiplex family with Whipple's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This variant was hypomorphic for DNA binding and transcription induction. It did not exert negative dominance."
    explanation: >
      Contrasts the simple hypomorphic, non-dominant IRF4 haploinsufficiency
      mechanism with the multimorphic negatively-dominant T95R mechanism of IMD131.

- name: IRF4 F359L neomorphic dominant primary immunodeficiency
  description: >
    A separate autosomal dominant IRF4 primary immunodeficiency caused by the
    p.Phe359Leu (F359L) variant in the interferon activation domain (not the
    DNA-binding domain). It produces childhood hypogammaglobulinemia with
    defective plasma cell differentiation and abnormal T-cell subsets via a
    neomorphic mechanism acting at interferon-stimulated response elements (ISREs),
    distinct from the DNA-binding-domain T95R multimorphic mechanism of IMD131.
  distinguishing_features:
  - The F359L variant lies in the interferon activation domain and acts neomorphically at ISREs; the IMD131 T95R variant lies in the DNA-binding domain and is multimorphic (hyper-/hypo-/neomorphic) at canonical and noncanonical DNA sites.
  - F359L presents with hypogammaglobulinemia (not full agammaglobulinemia) and defective plasma-cell differentiation; IMD131 presents with agammaglobulinemia and prominent Pneumocystis susceptibility.
  - The F359L T-cell picture is a specific dissociation — low naive CD4 and CD8 counts alongside *high* terminal effector CD4 and CD8 counts — whereas IMD131 T cells show reduced TH17 and TFH populations with decreased cytokine production.
  - Mutant F359L IRF4 still binds known IRF4 binding motifs normally and fails instead at ISRE transcriptional regulation, with an altered set of protein binding partners; T95R alters DNA binding itself, gaining affinity and acquiring noncanonical GATA-site binding.
  evidence:
  - reference: PMID:36917008
    reference_title: "A neomorphic mutation in the interferon activation domain of IRF4 causes a dominant primary immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients' low blood plasmablast/plasma cell and naïve CD4 and CD8 T cell counts contrasted with high terminal effector CD4 and CD8 T cell counts."
    explanation: >-
      Gives the naive-versus-terminal-effector dissociation that distinguishes
      the F359L immunophenotype from the TH17/TFH-deficient IMD131 phenotype.
  - reference: PMID:36917008
    reference_title: "A neomorphic mutation in the interferon activation domain of IRF4 causes a dominant primary immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In B cell lines, the mutant IRF4 protein as wildtype was found to bind to known IRF4 binding motifs. The mutant IRF4 failed to efficiently regulate the transcriptional activity of interferon-stimulated response elements (ISREs)."
    explanation: >-
      Establishes that F359L leaves canonical DNA-motif binding intact, the
      point of mechanistic contrast with the DNA-binding-domain T95R variant.
  - reference: PMID:36917008
    reference_title: "A neomorphic mutation in the interferon activation domain of IRF4 causes a dominant primary immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings highlight a novel mechanism for autosomal-dominant primary immunodeficiency through altered protein binding by mutant IRF4 at ISRE, leading to defective plasma cell differentiation."
    explanation: >
      Documents the distinct ISRE-acting neomorphic mechanism of the F359L
      allelic IRF4 immunodeficiency, differentiating it from the DNA-binding-domain
      T95R mechanism of IMD131.


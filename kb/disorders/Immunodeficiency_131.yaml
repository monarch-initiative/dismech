genetic:
- name: IRF4
  gene_term:
    preferred_term: IRF4
    term:
      id: hgnc:6119
      label: IRF4
  relationship_type: CAUSATIVE
  notes: >
    A single recurrent heterozygous missense variant, c.284C>G (p.Thr95Arg;
    T95R), located in the IRF4 DNA-binding domain, causes IMD131. The variant is
    multimorphic: it binds DNA with higher affinity than wild-type IRF4
    (hypermorph), yet has reduced transcriptional activity on canonical IRF4
    target genes (hypomorph), while also binding noncanonical DNA sites and
    inducing genes not activated by wild-type IRF4 (neomorph).
  evidence:
  - reference: PMID:36662884
    reference_title: "A multimorphic mutation in IRF4 causes human autosomal dominant combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a recurrent heterozygous mutation in IRF4, p.T95R, causing an autosomal dominant combined immunodeficiency (CID) in seven patients from six unrelated families."
    explanation: >
      Establishes the recurrent heterozygous IRF4 p.T95R variant as the cause
      of autosomal dominant combined immunodeficiency (IMD131).

pathophysiology:
- name: IRF4 T95R Multimorphic DNA-Binding Alteration
  biological_scale: MOLECULAR
  description: >
    The heterozygous p.T95R substitution maps to the IRF4 DNA-binding domain and
    alters the transcription factor's canonical DNA-binding specificities. It
    increases DNA-binding affinity relative to wild-type IRF4 (hypermorph) and
    confers binding to noncanonical DNA sites — with the highest preference for a
    noncanonical GATA sequence — driving a simultaneous combination of loss,
    gain, and new (neomorphic) functions.
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: ABNORMAL
  downstream:
  - target: Dysregulated IRF4 Transcriptional Program
  evidence:
  - reference: PMID:36662884
    reference_title: "A multimorphic mutation in IRF4 causes human autosomal dominant combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The IRF4T95R variant maps to the TF's DNA binding domain, alters its canonical DNA binding specificities, and results in a simultaneous multimorphic combination of loss, gain, and new functions for IRF4."
    explanation: >
      Localizes the variant to the DNA-binding domain and defines the
      multimorphic mechanism (loss + gain + new function).
  - reference: PMID:37683642
    reference_title: "Molecular basis for the functional roles of the multimorphic T95R mutation of IRF4 causing human autosomal dominant combined immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that compared to IRF4-DBDWT, IRF4-DBDT95R exhibits higher binding affinities for both canonical and noncanonical DNAs, with the highest preference for the noncanonical GATA sequence."
    explanation: >
      Biochemical/structural characterization of the altered DNA-binding
      affinity and specificity of the T95R DNA-binding domain.
  - reference: PMID:36662884
    reference_title: "A multimorphic mutation in IRF4 causes human autosomal dominant combined immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "IRF4T95R behaved as a gain-of-function hypermorph by binding to DNA with higher affinity than IRF4WT."
    explanation: >
      The defining report's own statement of the hypermorphic arm of the
      multimorphic mechanism, independent of the later structural study.
  - reference: PMID:37683642
    reference_title: "Molecular basis for the functional roles of the multimorphic T95R mutation of IRF4 causing human autosomal dominant combined immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The crystal structures of IRF4-DBDWT in complex with the GATA sequence and IRF4-DBDT95R in complexes with both canonical and noncanonical DNAs were determined, showing that the T95R mutation enhances the interactions of IRF4-DBDT95R with the canonical and noncanonical DNAs to achieve higher affinity and specificity."
    explanation: >
      Supplies the structural basis for the altered binding this node asserts:
      crystal structures showing enhanced contacts with both canonical and
      noncanonical DNA.

- name: Dysregulated IRF4 Transcriptional Program
  biological_scale: MOLECULAR
  description: >
    Despite higher DNA-binding affinity, IRF4 T95R shows reduced transcriptional
    activity on canonical IRF4 target genes (hypomorphic activity) while
    neomorphically inducing a distinct set of genes not activated by wild-type
    IRF4. The net effect is a dysregulated IRF4-dependent gene-expression program
    that disrupts normal lymphocyte biology.
  downstream:
  - target: Impaired B Cell Maturation and Plasma Cell Differentiation
  - target: Impaired T Cell Differentiation
  evidence:
  - reference: PMID:36662884
    reference_title: "A multimorphic mutation in IRF4 causes human autosomal dominant combined immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Despite this increased affinity for DNA, the transcriptional activity on IRF4 canonical genes was reduced, showcasing a hypomorphic activity of IRF4T95R."
    explanation: >
      Documents the hypomorphic transcriptional output on canonical genes
      despite increased DNA binding, from in vitro reporter/transcriptional assays.
  - reference: PMID:36662884
    reference_title: "A multimorphic mutation in IRF4 causes human autosomal dominant combined immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "IRF4T95R functions as a neomorph by binding to noncanonical DNA sites to alter the gene expression profile, including the transcription of genes exclusively induced by IRF4T95R but not by IRF4WT."
    explanation: >
      Documents the neomorphic gene-expression changes that dysregulate the
      IRF4 program.

- name: Impaired B Cell Maturation and Plasma Cell Differentiation
  biological_scale: CELLULAR
  description: >
    IRF4 is a master regulator of the germinal-center exit, immunoglobulin
    class-switch recombination, and plasma-cell differentiation program. In
    IMD131, patient B cells show impaired maturation, decreased immunoglobulin
    isotype switching, and defective plasma cell differentiation, culminating in
    agammaglobulinemia.

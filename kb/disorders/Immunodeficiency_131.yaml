      reference_title: "A multimorphic mutation in IRF4 causes human autosomal dominant combined immunodeficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "causing an autosomal dominant combined immunodeficiency (CID)"
      explanation: >
        The disorder is classified as a combined immunodeficiency (impaired
        humoral and cellular immunity) in the IUIS framework.

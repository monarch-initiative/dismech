  iuis_category:
    classification_value: combined immunodeficiency
    notes: >-
      IMD131 (IRF4 T95R multimorphic disease) was reported in 2023 and postdates
      the IUIS 2022 update (Tangye et al., PMID:35748970); the only IRF4 entry
      in the 2022 tables is the distinct disorder IRF4 haploinsufficiency
      (Table 6, Whipple's disease susceptibility). The combined-immunodeficiency
      assignment here follows the causal report's designation of the disorder as
      an autosomal dominant combined immunodeficiency, matching the scope of
      IUIS Table 1 by analogy; the disease is not itself listed in the 2022
      tables.
    evidence:

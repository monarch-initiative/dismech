name: Immunodeficiency 131
creation_date: "2026-07-30T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: immunodeficiency 131
  term:
    id: MONDO:0976229
    label: immunodeficiency 131
description: >
  Immunodeficiency 131 (IMD131; IRF4-mediated combined immunodeficiency) is an
  autosomal dominant combined immunodeficiency caused by a recurrent heterozygous
  multimorphic missense mutation, p.Thr95Arg (T95R), in the DNA-binding domain of
  the transcription factor interferon regulatory factor 4 (IRF4). Affected
  individuals present in childhood with agammaglobulinemia and profound
  susceptibility to opportunistic infection, notably Pneumocystis jirovecii
  pneumonia. B cells show impaired maturation, decreased immunoglobulin isotype
  switching, and defective plasma cell differentiation; T cells show reduced TH17
  and T follicular helper (TFH) populations with decreased cytokine production. The
  T95R substitution alters IRF4's canonical DNA-binding specificities and behaves
  simultaneously as a loss-of-function (hypomorph), gain-of-function (hypermorph),
  and neomorph, a "multimorphic" pathophysiology that dysregulates the normal IRF4
  transcriptional program in lymphocytes.

synonyms:
- IMD131
- IRF4-mediated combined immunodeficiency
- IRF4 T95R combined immunodeficiency
- Autosomal dominant combined immunodeficiency due to IRF4 multimorphic mutation

parents:
- IRF4-related immune disorder
- Combined immunodeficiency


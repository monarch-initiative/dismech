- name: Agammaglobulinemia (Absent Antibody Production)
  biological_scale: ORGANISM
  description: >
    Failure of the terminal B-cell/plasma-cell program produces agammaglobulinemia
    — a near-complete absence of circulating antibody — the key humoral
    mechanistic intermediate between the B-cell differentiation defect and the
    clinical infection susceptibility.
  downstream:
  - target: Opportunistic Infection Susceptibility
  evidence:
  - reference: PMID:36662884
    reference_title: "A multimorphic mutation in IRF4 causes human autosomal dominant combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "presented with agammaglobulinemia"
    explanation: >
      Documents agammaglobulinemia as the humoral output failure downstream of
      the impaired B-cell/plasma-cell program.

- name: Opportunistic Infection Susceptibility
  biological_scale: ORGANISM
  description: >
    The combined loss of antibody (agammaglobulinemia) and impaired T-cell help
    produces profound susceptibility to opportunistic infections, most
    characteristically Pneumocystis jirovecii pneumonia — the clinical hallmark of
    the combined immunodeficiency.
  evidence:
  - reference: PMID:36662884
    reference_title: "A multimorphic mutation in IRF4 causes human autosomal dominant combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patients exhibited profound susceptibility to opportunistic infections, notably Pneumocystis jirovecii, and presented with agammaglobulinemia."
    explanation: >
      Documents profound susceptibility to opportunistic infection (notably
      Pneumocystis jirovecii) as the clinical consequence.


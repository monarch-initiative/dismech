- name: Impaired T Cell Differentiation
  biological_scale: CELLULAR
  description: >
    IRF4 directs the differentiation of multiple effector T-cell lineages. In
    IMD131, patient T cells contain reduced TH17 and T follicular helper (TFH)
    populations and exhibit decreased cytokine production, impairing T-cell help
    for humoral immunity and mucosal defense.

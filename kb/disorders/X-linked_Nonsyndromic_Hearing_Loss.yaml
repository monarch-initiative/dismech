name: X-linked Nonsyndromic Hearing Loss
creation_date: "2026-05-08T00:00:00Z"
updated_date: "2026-05-08T17:44:01Z"
description: >-
  X-linked nonsyndromic hearing loss, also called DFNX, is a genetically
  heterogeneous form of hereditary hearing loss. Six loci (DFNX1-DFNX6) have
  been described, but the gene at DFNX3 remains unidentified. POU3F4 and SMPX
  have definitive ClinGen validity for nonsyndromic genetic hearing loss.
  PRPS1 is definitive only for the lumped PRPS1-deficiency continuum (DFNX1,
  CMTX5, and Arts syndrome), and AIFM1 is definitive for the broader auditory
  and sensory neuropathy spectrum rather than isolated nonsyndromic hearing
  loss. COL4A6-hearing loss, X-linked 6 remained Limited at ClinGen's 2022
  recuration; a later reported family and minigene assay are post-curation
  evidence that may warrant reassessment but do not themselves establish a
  definitive causal relationship. POU3F4 is the most common DFNX gene and is
  strongly associated with incomplete partition type III inner-ear
  malformation.
category: Genetic

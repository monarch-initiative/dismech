  evidence:
  - reference: PMID:27886419
    reference_title: "Functional characterization of a novel loss-of-function mutation of PRPS1 related to early-onset progressive nonsyndromic hearing loss in Koreans (DFNX1): Potential implications on future therapeutic intervention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A strong candidate variant (p.A82P) of PRPS1 is co-segregated with SNHL in
      X-linked recessive inheritance from one Korean multiplex SNHL family.
    explanation: >-
      The family study directly supports sensorineural hearing loss in DFNX1.
- category: Clinical
  name: Progressive sensorineural hearing impairment
  description: >-
    Progressive sensorineural hearing loss is especially emphasized for PRPS1
    and SMPX-related DFNX subtypes.
  phenotype_term:
    preferred_term: Progressive sensorineural hearing impairment
    term:
      id: HP:0000408
      label: Progressive sensorineural hearing impairment
  evidence:
  - reference: PMID:25182139
    reference_title: "The expanding spectrum of PRPS1-associated phenotypes: three novel mutations segregating with X-linked hearing loss and mild peripheral neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing of a single Italian proband affected by
      non-syndromic HL identified a novel missense variant within the PRPS1 gene
      (NM_002764.3:c.337G>T (p.A113S)) segregating with post-lingual, bilateral,
      progressive deafness in the proband's family.
    explanation: >-
      The family study directly supports progressive hearing loss in DFNX1.
  - reference: PMID:21549342
    reference_title: "Next-generation sequencing identifies mutations of SMPX, which encodes the small muscle protein, X-linked, as a cause of progressive hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a Dutch family with an X-linked postlingual progressive hearing
      impairment, a critical linkage interval was determined to span a region
      of 12.9 Mb flanked by the markers DXS7108 and DXS7110.
    explanation: >-
      The original DFNX4 study directly supports postlingual progressive
      hearing loss.
- category: Clinical
  name: Auditory neuropathy spectrum disorder
  description: >-
    The reported AIFM1-associated DFNX5 phenotype includes auditory neuropathy,
    with distorted transmission from the inner ear to the auditory nerve and
    brainstem; delayed sensory neuropathy means it should not be assumed to
    remain nonsyndromic. No exact HPO term was found locally, so the specific
    phenotype is retained without a broader substitute.
  subtype: DFNX5
  evidence:
  - reference: PMID:25986071
    reference_title: "Mutations in apoptosis-inducing factor cause X-linked recessive auditory neuropathy spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variants in AIFM1 gene are a common cause of familial and sporadic ANSD
      and provide insight into the expanded spectrum of AIFM1-associated
      diseases.
    explanation: >-
      This supports ANSD within the reported AIFM1-associated DFNX5 cohort;
      it does not establish AIFM1 as a common cause across unselected ANSD.
- category: Clinical
  name: Incomplete partition type III
  description: >-
    POU3F4-related DFNX2/DFN3 is associated with incomplete partition type III,
    a characteristic inner-ear malformation that affects surgical planning.
  subtype: DFNX2
  phenotype_term:
    preferred_term: Incomplete partition type III
    term:
      id: HP:0011373
      label: Incomplete partition of the cochlea
  evidence:
  - reference: PMID:37371790
    reference_title: "Clinical and Molecular Aspects Associated with Defects in the Transcription Factor POU3F4: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The clinical features of POU3F4-related hearing loss include a
      pathognomonic malformation of the inner ear defined as incomplete
      partition of the cochlea type 3 (IP-III).
    explanation: >-
      The review directly supports IP-III as the characteristic POU3F4-related
      malformation.
  - reference: PMID:38498189
    reference_title: "Research progress on incomplete partition type 3 inner ear malformation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mutations in the POU3F4 gene emerge as the principal pathogenic
      contributors to IP-III anomalies
    explanation: >-
      The IP-III review independently supports POU3F4 as the principal genetic
      contributor to this malformation.
- category: Clinical
  name: Perilymphatic gusher during stapedectomy
  description: >-
    POU3F4-related DFNX2 can include perilymphatic gusher during otologic
    surgery, probably reflecting incomplete separation between the cochlea and
    internal auditory canal. No exact HPO term was identified locally, so this
    is retained as a named clinical phenotype without a broad substitute term.
  subtype: DFNX2
  evidence:
  - reference: PMID:37371790
    reference_title: "Clinical and Molecular Aspects Associated with Defects in the Transcription Factor POU3F4: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Often, a perilymphatic gusher is observed upon stapedectomy during
      surgery, possibly as a consequence of an incomplete separation of the
      cochlea from the internal auditory canal.
    explanation: >-
      The POU3F4 review directly supports perilymphatic gusher as a
      DFNX2-relevant surgical phenotype.

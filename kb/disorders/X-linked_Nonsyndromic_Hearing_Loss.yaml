imaging_findings:
- name: Incomplete partition type III on temporal-bone CT
  modality: CT
  description: >-
    High-resolution temporal-bone CT can show the POU3F4/IP-III pattern: absent
    modiolus, a widened lateral internal auditory canal with direct
    communication to the cochlea, and sometimes a thickened stapes footplate.
    This anatomy distinguishes IP-III from other cochlear partition anomalies
    and anticipates a perilymphatic gusher risk.
  phenotype_term:
    preferred_term: Incomplete partition type III
    term:
      id: HP:0011373
      label: Incomplete partition of the cochlea
  diagnostic: true
  subtype: DFNX2
  evidence:
  - reference: PMID:30065609
    reference_title: "X-Linked Sensorineural Hearing Loss: A Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Anatomical anomalies of the temporal bone, revealed by Computer-assisted
      Tomography (CT), include dilatation of the lateral end of the internal
      acoustic canal, abnormally wide communication between the internal
      acoustic canal and inner ear compartment and, in some cases, partial
      hypoplasia of the cochlea
    explanation: >-
      Review evidence identifies the temporal-bone imaging pattern that
      distinguishes POU3F4/IP-III anatomy.
- name: Cochlear nerve hypoplasia on internal-auditory-canal MRI
  modality: MRI
  description: >-
    Dedicated internal-auditory-canal MRI may show cochlear nerve hypoplasia in
    some people with AIFM1-associated auditory neuropathy. This localizes a
    neural lesion and is clinically important because cochlear implantation may
    have limited success when the cochlear nerve is hypoplastic.
  phenotype_term:
    preferred_term: Cochlear nerve hypoplasia
    term:
      id: HP:0034585
      label: Cochlear nerve hypoplasia
  diagnostic: true
  subtype: DFNX5
  evidence:
  - reference: PMID:25986071
    reference_title: "Mutations in apoptosis-inducing factor cause X-linked recessive auditory neuropathy spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The finding of cochlear nerve hypoplasia in some patients was
      AIFM1-related ANSD implies that MRI may be of value in localising the site
      of lesion and suggests that cochlea implantation in these patients may
      have limited success.
    explanation: >-
      The AIFM1 cohort directly supports MRI localization and the
      cochlear-nerve-hypoplasia caveat for implant counseling.
diagnosis:
- name: Auditory brainstem response and otoacoustic emissions
  description: >-
    When AIFM1-related or another auditory neuropathy phenotype is suspected,
    pair auditory brainstem response (ABR) with otoacoustic emissions (OAE).
    Present OAE with absent or markedly abnormal ABR supports an
    auditory-neuropathy phenotype; this pattern should not be generalized to
    every DFNX subtype.
  results: Present OAE with absent or markedly abnormal ABR supports an auditory-neuropathy phenotype.
  evidence:
  - reference: PMID:10663046
    reference_title: "[Otoacoustic emissions, auditory evoked potentials, pure tone thresholds and speech intelligibility in cases of auditory neuropathy]."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The combined findings of "normal evoked otoacoustic emissions (EOAE) and
      absent or markedly disturbed auditory evoked potentials from the
      brainstem and/or cortex" has been named auditory neuropathy in the
      English literature.
    explanation: >-
      The PubMed abstract directly supports the OAE-evoked-potential
      dissociation; it does not rely on a full-text-only cochlear-microphonic
      statement.
  - reference: PMID:38016438
    reference_title: "Cochlear Implantation in Children with Auditory Neuropathy: Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Its diagnosis is based on presence of otoacoustic emissions and lack of,
      or abnormal, brainstem auditory evoked potential.
    explanation: >-
      This establishes the core OAE-ABR dissociation used to recognize ANSD.
- name: Internal-auditory-canal MRI for cochlear nerve assessment
  description: >-
    MRI may be of value when auditory neuropathy or cochlear nerve deficiency
    is suspected, particularly in AIFM1-associated disease. Cochlear nerve
    hypoplasia can localize the lesion and temper expectations for cochlear
    implantation; the cited evidence does not establish a universal indication.
  results: Cochlear nerve hypoplasia supports a neural lesion and may predict limited cochlear-implant benefit.
  evidence:
  - reference: PMID:25986071
    reference_title: "Mutations in apoptosis-inducing factor cause X-linked recessive auditory neuropathy spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The finding of cochlear nerve hypoplasia in some patients was
      AIFM1-related ANSD implies that MRI may be of value in localising the site
      of lesion and suggests that cochlea implantation in these patients may
      have limited success.
    explanation: >-
      Human imaging data support MRI and the implant-outcome caveat in the
      AIFM1-associated subset.
- name: High-resolution temporal-bone CT
  description: >-
    Temporal-bone CT is the key anatomic study when POU3F4/IP-III is suspected.
    It distinguishes the absent-modiolus/dilated-IAC pattern from other inner-ear
    malformations and informs surgery because of the perilymphatic-gusher risk.
  results: Absent cochlear modiolus with dilated lateral internal auditory canal and direct cochlear communication supports IP-III.
  evidence:
  - reference: PMID:30065609
    reference_title: "X-Linked Sensorineural Hearing Loss: A Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Anatomical anomalies of the temporal bone, revealed by Computer-assisted
      Tomography (CT), include dilatation of the lateral end of the internal
      acoustic canal, abnormally wide communication between the internal
      acoustic canal and inner ear compartment and, in some cases, partial
      hypoplasia of the cochlea
    explanation: >-
      Review evidence supports CT detection of the characteristic DFNX2/IP-III
      anatomy.
- name: Molecular genetic testing
  description: >-
    Next-generation and third-generation sequencing can identify causal
    X-chromosome variants in patients with hereditary hearing loss.
  evidence:
  - reference: PMID:39272213
    reference_title: "Genomic and phenotypic landscapes of X-linked hereditary hearing loss in the Chinese population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed a molecular epidemiological investigation of X-linked
      hereditary HL based on next-generation sequencing and third-generation
      sequencing in 3646 unrelated patients with HL.
    explanation: >-
      This supports genomic testing as an implemented diagnostic approach in a
      large X-linked hereditary hearing-loss cohort.
  - reference: PMID:20301738
    reference_title: "Phosphoribosylpyrophosphate Synthetase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of PRS deficiency is established in a male proband with
      suggestive findings and a hemizygous pathogenic variant in PRPS1
      identified by molecular genetic testing.
    explanation: >-
      GeneReviews directly supports molecular confirmation for the PRPS1
      deficiency continuum represented within DFNX1.
differential_diagnoses:
- name: PRPS1 deficiency continuum, including CMTX5 and Arts syndrome
  disease_term:
    preferred_term: PRPS1 deficiency disorder
    term:
      id: MONDO:0100061
      label: PRPS1 deficiency disorder
  description: >-
    DFNX1, CMTX5, and Arts syndrome are allelic PRPS1-deficiency phenotypic
    clusters with overlap even within a family. A hearing-loss-predominant
    presentation should therefore be assessed for peripheral neuropathy,
    ataxia, optic atrophy, hypotonia, developmental impairment, and recurrent
    infections rather than assumed to be permanently nonsyndromic.
  distinguishing_features:
  - Postlingual progressive hearing loss without systemic findings favors the hearing-loss-predominant DFNX1 cluster.
  - Peripheral neuropathy and optic atrophy favor CMTX5; early hypotonia, ataxia, developmental impairment, and recurrent infections favor Arts syndrome.
  - Residual PRS-I activity and X-inactivation can contribute to intrafamilial and female variability.
  evidence:
  - reference: PMID:24528855
    reference_title: "X-linked Charcot-Marie-Tooth disease, Arts syndrome, and prelingual non-syndromic deafness form a disease continuum: evidence from a family with a novel PRPS1 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings demonstrate that CMTX5, Arts syndrome and DFN2 are
      phenotypic clusters on an intrafamilial continuum, including overlapping
      phenotypes even within individuals.
    explanation: >-
      The family study directly supports treating the PRPS1 conditions as a
      continuum in differential assessment.
- name: AIFM1 auditory and delayed sensory neuropathy spectrum
  disease_term:
    preferred_term: X-linked hereditary sensory and autonomic neuropathy with hearing loss
    term:
      id: MONDO:0010378
      label: X-linked hereditary sensory and autonomic neuropathy with hearing loss
  description: >-
    An initially isolated auditory-neuropathy presentation can precede the
    sensory neuropathy that defines the broader AIFM1 spectrum. Longitudinal
    neurologic examination and sensory nerve-conduction studies help avoid a
    premature nonsyndromic label.
  distinguishing_features:
  - Later extremity numbness, unsteadiness, areflexia, or reduced sensory nerve responses favors the broader AIFM1 neuropathy spectrum.
  - Normal early neurologic examination does not exclude AIFM1 because sensory symptoms may appear months or years after auditory neuropathy.
  evidence:
  - reference: PMID:25986071
    reference_title: "Mutations in apoptosis-inducing factor cause X-linked recessive auditory neuropathy spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotype associated with the AUNX1-causing AIFM1 p.R451Q mutation is
      characterised by childhood-onset ANSD and delayed peripheral sensory
      neuropathy presenting as extremity numbness, unsteadiness and areflexia.
    explanation: >-
      This directly supports delayed neurologic surveillance as a discriminator.
- name: TIMM8A-related Mohr-Tranebjaerg syndrome
  description: >-
    TIMM8A-related deafness-dystonia-optic neuronopathy (Mohr-Tranebjaerg
    syndrome) is a rare X-linked neurodegenerative disorder characterized by
    early-onset deafness, dystonia, and other neurologic manifestations. It is a
    syndromic differential when those features accompany an X-linked auditory
    presentation.
  distinguishing_features:
  - Early-onset deafness with dystonia or other neurologic manifestations favors Mohr-Tranebjaerg syndrome over isolated DFNX.
  evidence:
  - reference: PMID:31903733
    reference_title: "Functional analysis of a novel mutation in the TIMM8A gene that causes deafness-dystonia-optic neuronopathy syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The rare, X-linked neurodegenerative disorder, Mohr-Tranebjaerg syndrome
    explanation: >-
      The PubMed abstract directly identifies Mohr-Tranebjaerg syndrome as a
      rare X-linked neurodegenerative disorder.
  - reference: PMID:31903733
    reference_title: "Functional analysis of a novel mutation in the TIMM8A gene that causes deafness-dystonia-optic neuronopathy syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      syndrome), is caused by mutations in the TIMM8A gene. DDON syndrome is
      characterized by dystonia, early-onset deafness, and various other
      neurological manifestations.
    explanation: >-
      The PubMed abstract directly supports the TIMM8A basis and the
      deafness-dystonia-neurologic feature combination.
- name: NDP-related Norrie disease
  description: >-
    Norrie disease is an X-linked NDP-related retinopathy that can include
    sensorineural hearing loss. Retinal fibrovascular changes evident at birth
    and extraocular findings distinguish it from a primary nonsyndromic DFNX
    presentation.
  distinguishing_features:
  - Bilateral elevated retrolental masses and incomplete foveal development strongly favor Norrie disease.
  - Cognitive, behavioral, seizure, or peripheral vascular manifestations may accompany the retinal and auditory phenotype.
  - In a male proband with suggestive findings, molecular identification of a hemizygous NDP pathogenic variant establishes an NDP-related retinopathy.
  evidence:
  - reference: PMID:20301506
    reference_title: "NDP-Related Retinopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      NDP-related retinopathies typically involve bilateral and symmetric
      fibrovascular changes of the retina that are evident at birth and usually
      progress through childhood or adolescence to cause varying degrees of
      visual impairment.
    explanation: >-
      The GeneReviews PubMed record directly supports the bilateral retinal
      fibrovascular changes and their presence at birth.
  - reference: PMID:20301506
    reference_title: "NDP-Related Retinopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The eye findings of Norrie disease, the first described and best
      characterized of these disorders, are typically bilateral grayish-yellow,
      glistening, elevated retrolental masses composed of immature retinal cells
      usually visible through clear lenses; foveal development is always
      incomplete.
    explanation: >-
      The GeneReviews PubMed record directly supports the retrolental-mass and
      incomplete-foveal-development discriminators.
  - reference: PMID:20301506
    reference_title: "NDP-Related Retinopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Norrie disease is the only NDP-related retinopathy with associated
      extraocular findings, which can variably include cognitive disability,
      mental health and behavior disorders, seizures, sensorineural hearing
      loss, and peripheral vascular disease.
    explanation: >-
      GeneReviews directly sources sensorineural hearing loss and the
      syndromic features that distinguish Norrie disease from isolated DFNX.
  - reference: PMID:20301506
    reference_title: "NDP-Related Retinopathies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of an NDP-related retinopathy, an X-linked disorder, is

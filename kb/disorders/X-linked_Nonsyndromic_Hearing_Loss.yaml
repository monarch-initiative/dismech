- name: AIFM1-related auditory signal transmission defect
  biological_scale: TISSUE
  description: >-
    The reported AIFM1 phenotype is an auditory and sensory neuropathy spectrum
    in which transmission from the inner ear to the auditory nerve and
    brainstem is distorted. The cited human cohort does not establish a single
    cellular lesion in every affected individual or isolate hearing loss from
    the delayed neurologic phenotype.
  genes:
  - preferred_term: AIFM1
    term:
      id: hgnc:8768
      label: AIFM1
  evidence:
  - reference: PMID:25986071
    reference_title: "Mutations in apoptosis-inducing factor cause X-linked recessive auditory neuropathy spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Auditory neuropathy spectrum disorder (ANSD) is a form of hearing loss in
      which auditory signal transmission from the inner ear to the auditory
      nerve and brain stem is distorted, giving rise to speech perception
      difficulties beyond that expected for the observed degree of hearing
      loss.

      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Variants in AIFM1 gene are a common cause of familial and sporadic ANSD
        and provide insight into the expanded spectrum of AIFM1-associated
        diseases.
      explanation: >-
        The study supports the AIFM1-associated auditory-neuropathy phenotype

- name: Candidate COL4A6-associated cochlear basement-membrane involvement
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    COL4A6 encodes the alpha-6 chain of type IV collagen in basement membranes.
    The ClinGen assertion classifies the DFNX6 relationship as Limited. Human
    segregation and a variant-specific minigene assay provide candidate
    support, while expression in animal inner ears supports biological
    plausibility. In conflict, Col4a6-knockout mice had normal click-ABR
    thresholds and cochlear morphology. That result narrowly argues against
    simple loss of expression being sufficient in the mouse model, but does not
    test allele-specific human effects or establish a general cochlear
    mechanism.
  genes:
  - preferred_term: COL4A6
    term:
      id: hgnc:2208
      label: COL4A6
  evidence:
  - reference: PMID:23714752
    reference_title: "Novel form of X-linked nonsyndromic hearing loss with cochlear malformation caused by a mutation in the type IV collagen gene COL4A6."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Next-generation sequencing and subsequent segregation analysis detected a
      missense mutation (c.1771G>A, p.Gly591Ser) in the type IV collagen gene
      COL4A6 in all affected family members.
    explanation: >-
      Human segregation in the original family supports, but does not by itself
      establish, the COL4A6 association.
  - reference: PMID:23714752
    reference_title: "Novel form of X-linked nonsyndromic hearing loss with cochlear malformation caused by a mutation in the type IV collagen gene COL4A6."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In situ hybridization and immunostaining demonstrated expression of the
      COL4A6 homologs in the otic vesicle of the zebrafish and in the murine
      inner ear, supporting its role in normal ear development and function.
    explanation: >-
      Cross-species expression supplies model-organism support for an inner-ear
      role without overstating the unresolved mechanism.
  downstream:
  - target: Sensorineural hearing impairment
    description: >-
      Reported human families support a possible COL4A6-hearing-impairment
      association, but the Limited ClinGen classification leaves gene-level
      causality and the intervening mechanism unresolved.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:23714752
      reference_title: "Novel form of X-linked nonsyndromic hearing loss with cochlear malformation caused by a mutation in the type IV collagen gene COL4A6."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Next-generation sequencing and subsequent segregation analysis detected a
        missense mutation (c.1771G>A, p.Gly591Ser) in the type IV collagen gene
        COL4A6 in all affected family members.
      explanation: >-
        Segregation supports a candidate association but is insufficient to
        establish gene-level causality or the intervening mechanism.
phenotypes:
- category: Clinical
  name: Sensorineural hearing impairment
  description: >-
    Sensorineural hearing impairment is directly documented in DFNX1; the
    auditory phenotype is not uniform across every DFNX subtype.
  phenotype_term:
    preferred_term: Sensorineural hearing impairment

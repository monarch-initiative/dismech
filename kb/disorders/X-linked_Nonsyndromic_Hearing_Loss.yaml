imaging_findings:
- name: Incomplete partition type III on temporal-bone CT
  modality: CT
  description: >-
    High-resolution temporal-bone CT can show the POU3F4/IP-III pattern: absent
    modiolus, a widened lateral internal auditory canal with direct
    communication to the cochlea, and sometimes a thickened stapes footplate.
    This anatomy distinguishes IP-III from other cochlear partition anomalies
    and anticipates a perilymphatic gusher risk.
  phenotype_term:
    preferred_term: Incomplete partition type III
    term:
      id: HP:0008554
      label: Cochlear malformation
  diagnostic: true
  subtype: DFNX2
  evidence:
  - reference: PMID:30065609
    reference_title: "X-Linked Sensorineural Hearing Loss: A Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Anatomical anomalies of the temporal bone, revealed by Computer-assisted
      Tomography (CT), include dilatation of the lateral end of the internal
      acoustic canal, abnormally wide communication between the internal
      acoustic canal and inner ear compartment and, in some cases, partial
      hypoplasia of the cochlea
    explanation: >-
      Review evidence identifies the temporal-bone imaging pattern that
      distinguishes POU3F4/IP-III anatomy.
- name: Cochlear nerve hypoplasia on internal-auditory-canal MRI
  modality: MRI
  description: >-
    Dedicated internal-auditory-canal MRI may show cochlear nerve hypoplasia in
    some people with AIFM1-associated auditory neuropathy. This localizes a
    neural lesion and is clinically important because cochlear implantation may
    have limited success when the cochlear nerve is hypoplastic.
  diagnostic: true
  subtype: DFNX5
  evidence:
  - reference: PMID:25986071
    reference_title: "Mutations in apoptosis-inducing factor cause X-linked recessive auditory neuropathy spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The finding of cochlear nerve hypoplasia in some patients was
      AIFM1-related ANSD implies that MRI may be of value in localising the site
      of lesion and suggests that cochlea implantation in these patients may
      have limited success.
    explanation: >-
      The AIFM1 cohort directly supports MRI localization and the
      cochlear-nerve-hypoplasia caveat for implant counseling.
diagnosis:
- name: Auditory brainstem response and otoacoustic emissions
  description: >-
    When AIFM1-related or another auditory neuropathy phenotype is suspected,
    pair auditory brainstem response (ABR) with otoacoustic emissions (OAE) or
    cochlear microphonics. Preserved outer-hair-cell responses with absent or
    abnormal ABR supports ANSD; this pattern should not be generalized to every
    DFNX subtype.
  results: Present OAE or cochlear microphonics with absent or abnormal ABR supports an auditory-neuropathy phenotype.
  evidence:
  - reference: PMID:38016438
    reference_title: "Cochlear Implantation in Children with Auditory Neuropathy: Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Its diagnosis is based on presence of otoacoustic emissions and lack of,
      or abnormal, brainstem auditory evoked potential.
    explanation: >-
      This establishes the core OAE-ABR dissociation used to recognize ANSD.
- name: Internal-auditory-canal MRI for cochlear nerve assessment
  description: >-
    MRI is indicated when auditory neuropathy or cochlear nerve deficiency is
    suspected, particularly in AIFM1-associated disease. Cochlear nerve
    hypoplasia localizes the lesion and tempers expectations for cochlear
    implantation.
  results: Cochlear nerve hypoplasia supports a neural lesion and may predict limited cochlear-implant benefit.
  evidence:
  - reference: PMID:25986071
    reference_title: "Mutations in apoptosis-inducing factor cause X-linked recessive auditory neuropathy spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The finding of cochlear nerve hypoplasia in some patients was
      AIFM1-related ANSD implies that MRI may be of value in localising the site
      of lesion and suggests that cochlea implantation in these patients may
      have limited success.
    explanation: >-
      Human imaging data support MRI and the implant-outcome caveat in the
      AIFM1-associated subset.
- name: High-resolution temporal-bone CT
  description: >-
    Temporal-bone CT is the key anatomic study when POU3F4/IP-III is suspected.
    It distinguishes the absent-modiolus/dilated-IAC pattern from other inner-ear
    malformations and informs surgery because of the perilymphatic-gusher risk.
  results: Absent cochlear modiolus with dilated lateral internal auditory canal and direct cochlear communication supports IP-III.
  evidence:
  - reference: PMID:30065609
    reference_title: "X-Linked Sensorineural Hearing Loss: A Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Anatomical anomalies of the temporal bone, revealed by Computer-assisted
      Tomography (CT), include dilatation of the lateral end of the internal
      acoustic canal, abnormally wide communication between the internal
      acoustic canal and inner ear compartment and, in some cases, partial
      hypoplasia of the cochlea
    explanation: >-
      Review evidence supports CT detection of the characteristic DFNX2/IP-III
      anatomy.
- name: Molecular genetic testing
  description: >-
    Next-generation and third-generation sequencing can identify causal
    X-chromosome variants in patients with hereditary hearing loss.
  evidence:
  - reference: PMID:39272213
    reference_title: "Genomic and phenotypic landscapes of X-linked hereditary hearing loss in the Chinese population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed a molecular epidemiological investigation of X-linked
      hereditary HL based on next-generation sequencing and third-generation
      sequencing in 3646 unrelated patients with HL.
    explanation: >-
      This supports genomic testing as an implemented diagnostic approach in a
      large X-linked hereditary hearing-loss cohort.
differential_diagnoses:
- name: PRPS1 deficiency continuum, including CMTX5 and Arts syndrome
  disease_term:
    preferred_term: PRPS1 deficiency disorder
    term:
      id: MONDO:0100061
      label: PRPS1 deficiency disorder
  description: >-
    DFNX1, CMTX5, and Arts syndrome are allelic PRPS1-deficiency phenotypic
    clusters with overlap even within a family. A hearing-loss-predominant
    presentation should therefore be assessed for peripheral neuropathy,
    ataxia, optic atrophy, hypotonia, developmental impairment, and recurrent
    infections rather than assumed to be permanently nonsyndromic.
  distinguishing_features:
  - Postlingual progressive hearing loss without systemic findings favors the hearing-loss-predominant DFNX1 cluster.
  - Peripheral neuropathy and optic atrophy favor CMTX5; early hypotonia, ataxia, developmental impairment, and recurrent infections favor Arts syndrome.
  - Residual PRS-I activity and X-inactivation can contribute to intrafamilial and female variability.
  evidence:
  - reference: PMID:24528855
    reference_title: "X-linked Charcot-Marie-Tooth disease, Arts syndrome, and prelingual non-syndromic deafness form a disease continuum: evidence from a family with a novel PRPS1 mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings demonstrate that CMTX5, Arts syndrome and DFN2 are
      phenotypic clusters on an intrafamilial continuum, including overlapping
      phenotypes even within individuals.
    explanation: >-
      The family study directly supports treating the PRPS1 conditions as a
      continuum in differential assessment.
- name: AIFM1 auditory and delayed sensory neuropathy spectrum
  disease_term:
    preferred_term: X-linked hereditary sensory and autonomic neuropathy with hearing loss
    term:
      id: MONDO:0010378
      label: X-linked hereditary sensory and autonomic neuropathy with hearing loss
  description: >-
    An initially isolated auditory-neuropathy presentation can precede the
    sensory neuropathy that defines the broader AIFM1 spectrum. Longitudinal
    neurologic examination and sensory nerve-conduction studies help avoid a
    premature nonsyndromic label.
  distinguishing_features:
  - Later extremity numbness, unsteadiness, areflexia, or reduced sensory nerve responses favors the broader AIFM1 neuropathy spectrum.
  - Normal early neurologic examination does not exclude AIFM1 because sensory symptoms may appear months or years after auditory neuropathy.
  evidence:
  - reference: PMID:25986071
    reference_title: "Mutations in apoptosis-inducing factor cause X-linked recessive auditory neuropathy spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotype associated with the AUNX1-causing AIFM1 p.R451Q mutation is
      characterised by childhood-onset ANSD and delayed peripheral sensory
      neuropathy presenting as extremity numbness, unsteadiness and areflexia.
    explanation: >-
      This directly supports delayed neurologic surveillance as a discriminator.
- name: COL4A5-related Alport syndrome and COL4A5-COL4A6 contiguous deletions
  disease_term:
    preferred_term: Alport syndrome
    term:
      id: MONDO:0018965
      label: Alport syndrome
  description: >-
    X-linked Alport syndrome can include sensorineural hearing loss, and
    contiguous deletions extending from COL4A5 into COL4A6 can add diffuse
    leiomyomatosis. These diagnoses must be separated from a candidate isolated
    COL4A6/DFNX6 association by renal, ocular, smooth-muscle, and molecular
    findings.
  distinguishing_features:
  - Microhematuria, proteinuria, kidney insufficiency, anterior lenticonus, or maculopathy favors Alport syndrome.
  - Esophageal, tracheobronchial, or genital leiomyomatosis suggests a COL4A5-COL4A6 contiguous deletion.
  - Define deletion boundaries and test COL4A5 rather than attributing hearing loss categorically to COL4A6.
  evidence:
  - reference: PMID:20301386
    reference_title: "Alport Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Alport syndrome is characterized by kidney manifestations, sensorineural
      hearing loss (SNHL), and ocular manifestations.
    explanation: >-
      GeneReviews defines the renal-auditory-ocular combination distinguishing
      Alport syndrome from isolated hearing loss.
  - reference: PMID:20301386
    reference_title: "Alport Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      in those with deletions of COL4A5 extending into intron 2 of COL4A6,
      surgical intervention for symptomatic leiomyomas as needed
    explanation: >-
      The contiguous-deletion management statement anchors the distinct
      COL4A5-COL4A6 Alport/leiomyomatosis phenotype.
- name: OTOF-related and other auditory neuropathy spectrum disorders
  description: >-
    OTOF and other genetic or acquired ANSD causes share the OAE/ABR
    dissociation with AIFM1. Age at onset, inheritance, neurologic findings,
    MRI, and molecular testing distinguish them; an ANSD physiologic pattern is
    not specific for DFNX5.
  distinguishing_features:
  - Biallelic OTOF disease usually presents in infancy and follows autosomal recessive inheritance.
  - AIFM1 was confined to the non-infant group in one large cohort and may later add sensory neuropathy or cochlear nerve hypoplasia.
  - Perinatal, toxic, infectious, and immune causes require clinical exclusion when genetic testing is uninformative.
  evidence:
  - reference: PMID:38456936
    reference_title: "Clinical and genetic architecture of a large cohort with auditory neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most of the OTOF gene (96.6%, 28/29) could only be identified in the
      infant group, while the AIFM1 gene could only be identified in the
      non-infant group
    explanation: >-
      The cohort supports age-at-onset as a useful, nonabsolute discriminator
      between OTOF- and AIFM1-associated auditory neuropathy.
- name: Other inner-ear malformations versus POU3F4 incomplete partition type III
  description: >-
    Other incomplete-partition patterns, enlarged vestibular aqueduct, cochlear
    hypoplasia, and cochlear-nerve deficiency can all accompany hearing loss.
    The specific temporal-bone CT pattern and POU3F4 testing distinguish IP-III.
  distinguishing_features:
  - IP-III retains the interscalar septa but lacks the modiolus and has a widened lateral internal auditory canal directly communicating with the cochlea.
  - A perilymphatic gusher risk and POU3F4 variant or upstream deletion further favor IP-III.
  - MRI complements CT when cochlear nerve deficiency rather than a bony partition anomaly is suspected.
  evidence:
  - reference: PMID:30065609
    reference_title: "X-Linked Sensorineural Hearing Loss: A Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cochlear malformation was shown to consist of a relatively normal outer
      coat shape, absence of a cochlear modiolus, and a direct inter
      communication between the IAC and cochlear inner cavity.
    explanation: >-
      The characteristic CT anatomy distinguishes POU3F4/IP-III from other
      inner-ear malformations.
treatments:
- name: Cochlear implantation for POU3F4/IP-III anatomy
  description: >-
    Cochlear implantation is a major intervention for severe POU3F4-related
    IP-III hearing loss, but the malformation increases surgical complexity and
    requires careful preoperative assessment and postoperative verification.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cochlear implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  evidence:
  - reference: PMID:38498189
    reference_title: "Research progress on incomplete partition type 3 inner ear malformation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      cochlear implantation currently serving as the predominant therapeutic
      approach.
    explanation: >-
      The IP-III review supports cochlear implantation as the predominant
      therapeutic approach for this malformation-associated form of X-linked
      deafness.
- name: Genetic Counseling
  description: >-
    Genetic counseling is important for recurrence-risk counseling, sex-linked
    inheritance counseling, and genotype-informed management decisions in DFNX
    families.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:39272213
    reference_title: "Genomic and phenotypic landscapes of X-linked hereditary hearing loss in the Chinese population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of the genotype-phenotype relationship is valuable for X-linked
      HL precise diagnostics and genetic counseling.
    explanation: >-
      The cohort conclusion directly supports genetic counseling as a
      management implication of genotype-phenotype analysis.

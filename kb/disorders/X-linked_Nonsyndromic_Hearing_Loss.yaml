discussions:
- discussion_id: mismatch_col4a6_knockout_human_hearing
  prompt: >-
    Why does complete Col4a6 loss in mice leave click-ABR thresholds and
    cochlear morphology normal when human COL4A6 variants have been reported
    with DFNX6, and do allele-specific effects rather than simple loss of
    expression explain the difference?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Candidate COL4A6-associated cochlear basement-membrane involvement
  - phenotypes#Sensorineural hearing impairment
  rationale: >-
    The knockout is a narrow refutation of simple loss of Col4a6 expression
    being sufficient to produce severe hearing loss or cochlear malformation in
    this mouse model. It does not test the reported human missense or splice
    alleles and therefore does not broadly refute human COL4A6 causality. The
    mismatch matters because a null model could miss dominant-negative,
    aberrant-heterotrimer, allele-specific splicing, species-specific
    basement-membrane, or frequency-specific auditory effects.
  proposed_experiments:
  - experiment_id: exp_col4a6_allele_matched_mouse_comparison
    name: Allele-matched Col4a6 knock-in and knockout comparison
    description: >-
      Compare mice carrying orthologous versions of the reported human
      p.Gly591Ser missense and c.951+1G>T splice variants with the existing null
      allele and wild-type controls. Measure frequency-specific ABR and DPOAE
      thresholds, cochlear microanatomy, collagen alpha5-alpha6-alpha5(IV)
      assembly, and basement-membrane ultrastructure across development.
    decision_criterion: >-
      An auditory or cochlear phenotype confined to a reported-variant knock-in,
      with abnormal collagen heterotrimer assembly, would support an allele-specific
      mechanism missed by the null model. Normal auditory, structural, and
      collagen-assembly readouts in both knock-in models would weaken the reported
      variants' proposed cochlear mechanism.
  - experiment_id: exp_col4a6_isogenic_human_inner_ear_models
    name: Isogenic human inner-ear model of COL4A6 variant and null alleles
    description: >-
      Engineer the two reported COL4A6 variants and a matched null allele in
      human iPSC-derived inner-ear or cochlear basement-membrane models, then
      compare transcript splicing, alpha6(IV) protein incorporation, heterotrimer
      assembly, extracellular-matrix organization, and rescue after correction
      of each allele.
    decision_criterion: >-
      Variant-specific abnormalities that are rescued by correction but are absent
      from the null line would bridge the mouse-human mismatch and support a non-null
      mechanism. Absence of reproducible variant-specific abnormalities after
      isogenic correction and rescue would weaken the proposed human cochlear
      mechanism.
  evidence:
  - reference: PMID:33848312
    reference_title: "Lack of collagen α6(IV) chain in mice does not cause severe-to-profound hearing loss or cochlear malformation, a distinct phenotype from nonsyndromic hearing loss with COL4A6 missense mutation."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Hence, loss of Col4a6 gene expression in mice showed normal click ABR
      thresholds and normal cochlear formation, which differs from humans with
      the COL4A6 missense mutation c.1771G>A, p.Gly591Ser.
    explanation: >-
      This abstract-level negative result narrowly refutes simple loss of
      expression as sufficient in the mouse model. It does not test the human
      alleles or refute broad human gene-disease causality.

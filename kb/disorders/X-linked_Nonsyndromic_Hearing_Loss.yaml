- name: COL4A5-related Alport syndrome and COL4A5-COL4A6 contiguous deletions
  disease_term:
    preferred_term: Alport syndrome
    term:
      id: MONDO:0018965
      label: Alport syndrome
  description: >-
    X-linked Alport syndrome can include sensorineural hearing loss, and
    contiguous deletions extending from COL4A5 into COL4A6 can add diffuse
    leiomyomatosis. These diagnoses must be separated from a candidate isolated
    COL4A6/DFNX6 association by renal, ocular, smooth-muscle, and molecular
    findings.
  distinguishing_features:
  - Microhematuria, proteinuria, kidney insufficiency, anterior lenticonus, or maculopathy favors Alport syndrome.
  - Esophageal, tracheobronchial, or genital leiomyomatosis suggests a COL4A5-COL4A6 contiguous deletion.
  - Define deletion boundaries and test COL4A5 rather than attributing hearing loss categorically to COL4A6.
  evidence:
  - reference: PMID:20301386
    reference_title: "Alport Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Alport syndrome is characterized by kidney manifestations, sensorineural
      hearing loss (SNHL), and ocular manifestations.
    explanation: >-
      GeneReviews defines the renal-auditory-ocular combination distinguishing
      Alport syndrome from isolated hearing loss.
  - reference: PMID:20301386
    reference_title: "Alport Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      in those with deletions of COL4A5 extending into intron 2 of COL4A6,

    preferred_term: hearing loss, X-linked 1
    term:
      id: MONDO:0010577
      label: hearing loss, X-linked 1
  description: >-
    PRPS1-related DFNX1 is the hearing-loss-predominant end of the broader
    PRPS1-deficiency continuum rather than a cleanly separable gene-disease
    entity. Reported families include postlingual, bilateral, progressive
    hearing loss, sometimes with mild or subclinical peripheral neuropathy.
  genes:
  - preferred_term: PRPS1
    term:
      id: hgnc:9462
      label: PRPS1
  evidence:
  - reference: PMID:25182139
    reference_title: "The expanding spectrum of PRPS1-associated phenotypes: three novel mutations segregating with X-linked hearing loss and mild peripheral neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing of a single Italian proband affected by
      non-syndromic HL identified a novel missense variant within the PRPS1 gene
      (NM_002764.3:c.337G>T (p.A113S)) segregating with post-lingual, bilateral,
      progressive deafness in the proband's family.
    explanation: >-
      This family study directly links a PRPS1 variant to progressive
      nonsyndromic hearing loss.
- name: DFNX2
  display_name: DFNX2 / DFN3 / POU3F4-related X-linked hearing loss
  classification: molecular
  subtype_term:
    preferred_term: X-linked mixed hearing loss with perilymphatic gusher
    term:
      id: MONDO:0010576
      label: X-linked mixed hearing loss with perilymphatic gusher
  description: >-
    POU3F4-related DFNX2/DFN3 is the most frequent X-linked nonsyndromic
    hearing-loss subtype and is characterized by severe congenital or childhood
    hearing loss with incomplete partition type III inner-ear malformation in
    many affected individuals.
  genes:
  - preferred_term: POU3F4
    term:
      id: hgnc:9217
      label: POU3F4
  evidence:
  - reference: PMID:37371790
    reference_title: "Clinical and Molecular Aspects Associated with Defects in the Transcription Factor POU3F4: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      POU3F4 is the gene most commonly associated with X-linked deafness
      (DFNX2, DFN3) and accounts for about 50% of the cases of X-linked
      non-syndromic hearing loss.
    explanation: >-
      This review establishes POU3F4 as the main DFNX gene and links it to the
      DFNX2/DFN3 subtype.
  - reference: PMID:37371790
    reference_title: "Clinical and Molecular Aspects Associated with Defects in the Transcription Factor POU3F4: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The clinical features of POU3F4-related hearing loss include a
      pathognomonic malformation of the inner ear defined as incomplete
      partition of the cochlea type 3 (IP-III).
    explanation: >-
      The review directly supports IP-III as the characteristic POU3F4-related
      malformation.
- name: DFNX3
  display_name: DFNX3 / unresolved X-linked nonsyndromic hearing-loss locus
  classification: molecular
  description: >-
    DFNX3 is a mapped X-linked nonsyndromic hearing-loss locus for which no
    causal gene has yet been identified; it accounts for the gap between six
    named DFNX loci and five established genes.
  evidence:
  - reference: PMID:30065609
    reference_title: "X-Linked Sensorineural Hearing Loss: A Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      To date, six loci (DFNX1-6) and five genes (PRPS1 for DFNX1, POU3F4 for
      DFNX2, SMPX for DFNX4, AIFM1 for DFNX5 and COL4A6 for DFNX6) have been
      identified for X-linked non-syndromic hearing loss.
    explanation: >-
      The six-locus/five-gene enumeration documents that DFNX3 remains a locus
      without an identified causal gene.
- name: DFNX4
  display_name: DFNX4 / SMPX-related X-linked nonsyndromic hearing loss
  classification: molecular
  subtype_term:
    preferred_term: hearing loss, X-linked 4
    term:
      id: MONDO:0010238
      label: hearing loss, X-linked 4
  description: >-
    SMPX-related DFNX4 is usually progressive nonsyndromic hearing loss.
    Truncating SMPX variants are associated with DFNX4 auditory phenotypes,
    while nontruncating variants can be associated with non-auditory myopathy
    phenotypes.
  genes:
  - preferred_term: SMPX
    term:
      id: hgnc:11122
      label: SMPX
  evidence:
  - reference: PMID:21549342
    reference_title: "Next-generation sequencing identifies mutations of SMPX, which encodes the small muscle protein, X-linked, as a cause of progressive hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a Dutch family with an X-linked postlingual progressive hearing
      impairment, a critical linkage interval was determined to span a region
      of 12.9 Mb flanked by the markers DXS7108 and DXS7110. This interval
      overlaps with the previously described DFNX4 locus and contains 75
      annotated genes. Subsequent next-generation sequencing (NGS) detected one
      variant within the linkage interval, a nonsense mutation in SMPX.
    explanation: >-
      The original DFNX4 study directly establishes the X-linked postlingual
      progressive phenotype.

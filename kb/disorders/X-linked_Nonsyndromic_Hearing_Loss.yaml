    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      An in vitro minigene splicing assay revealed that c.951 + 1 G > T leads
      to skipping of exon 15, strongly suggesting a pathogenic role for this
      variant in the HL phenotype.
    explanation: >-
      The minigene assay is variant-specific in-vitro evidence; it supports
      splice disruption but does not by itself establish the gene-disease
      relationship.
  - reference: PMID:33840813
    reference_title: "Confirmation of COL4A6 variants in X-linked nonsyndromic hearing loss and its clinical implications."

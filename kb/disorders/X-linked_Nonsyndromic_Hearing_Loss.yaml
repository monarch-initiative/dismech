inheritance:
- name: X-linked inheritance
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  description: >-
    DFNX comprises hearing-loss loci and genes on the X chromosome. Female
    expression is gene specific: PRPS1 heterozygotes range from unaffected to
    unilateral or bilateral hearing loss and occasional subclinical neuropathy,
    influenced in part by X-inactivation. POU3F4 heterozygotes are usually
    unaffected, although hearing loss has been reported and systematic female
    imaging data are lacking. SMPX-associated hearing loss is often later,
    milder, and less penetrant in females than in males. Female carriers in the
    reported AIFM1 auditory-neuropathy families did not report auditory or
    sensory neuropathy. The few COL4A6 families do not establish reliable
    female penetrance or expressivity.
  expressivity: VARIABLE
  evidence:
  - reference: PMID:30065609
    reference_title: "X-Linked Sensorineural Hearing Loss: A Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      To date, six loci (DFNX1-6) and five genes (PRPS1 for DFNX1, POU3F4 for
      DFNX2, SMPX for DFNX4, AIFM1 for DFNX5 and COL4A6 for DFNX6) have been
      identified for X-linked non-syndromic hearing loss.
    explanation: >-
      The review directly classifies the DFNX loci and genes as X-linked.
  - reference: PMID:25182139
    reference_title: "The expanding spectrum of PRPS1-associated phenotypes: three novel mutations segregating with X-linked hearing loss and mild peripheral neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Female carriers may also be affected by unilateral or bilateral hearing
      impairment.
    explanation: >-
      Human family data support variable auditory expression in PRPS1
      heterozygotes.
  - reference: PMID:30065609
    reference_title: "X-Linked Sensorineural Hearing Loss: A Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Female carriers of a mutation in the DFNX2 usually show no hearing loss
    explanation: >-
      Review evidence supports usually absent but incompletely penetrant female
      expression for POU3F4.
  - reference: PMID:30065609
    reference_title: "X-Linked Sensorineural Hearing Loss: A Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Carrier females present only moderate hearing loss on the high
      frequencies.
    explanation: >-
      Review evidence supports a typically milder SMPX phenotype in females.
  - reference: PMID:25986071
    reference_title: "Mutations in apoptosis-inducing factor cause X-linked recessive auditory neuropathy spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because female carriers are unaffected, AIFM1 should be considered in
      small pedigrees with apparent autosomal recessive ANSD if X-linked
      inheritance cannot be excluded.
    explanation: >-
      This describes female nonpenetrance in the reported AIFM1 cohort, without
      assuming it for every AIFM1 variant or phenotype.
  - reference: PMID:20301738
    reference_title: "Phosphoribosylpyrophosphate Synthetase Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PRS deficiency is inherited in an X-linked manner. If the mother of the
      proband has a PRPS1 pathogenic variant, the chance of transmitting it in
      each pregnancy is 50%
    explanation: >-
      GeneReviews provides the X-linked transmission risk for the PRPS1
      deficiency continuum; expressivity in heterozygous females remains
      gene- and variant-specific.
pathophysiology:
- name: PRPS1 enzymatic activity deficiency
  biological_scale: MOLECULAR
  description: >-
    DFNX1 missense variants reduce phosphoribosyl pyrophosphate synthetase 1
    activity. The available human biochemical evidence establishes reduced
    enzyme activity but does not yet resolve why partial PRPS1 deficiency is
    selectively expressed as hearing loss in milder cases.
  genes:
  - preferred_term: PRPS1
    term:
      id: hgnc:9462
      label: PRPS1
  evidence:
  - reference: PMID:25182139
    reference_title: "The expanding spectrum of PRPS1-associated phenotypes: three novel mutations segregating with X-linked hearing loss and mild peripheral neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      All three variants result in a marked reduction (>60%) of the PRS-I
      activity in the patients' erythrocytes, with c.343A>G (p.M115V) and
      c.925G>T (p.V309F) affecting more severely the enzyme function.
    explanation: >-
      Biochemical assays on patient erythrocytes support reduced PRS-I activity
      as the molecular consequence of the DFNX1 variants.
  downstream:
  - target: Progressive sensorineural hearing impairment
    description: >-
      Partial PRPS1 deficiency is associated with postlingual bilateral
      progressive hearing loss in DFNX1 families.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:25182139
      reference_title: "The expanding spectrum of PRPS1-associated phenotypes: three novel mutations segregating with X-linked hearing loss and mild peripheral neuropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Whole-exome sequencing of a single Italian proband affected by
        non-syndromic HL identified a novel missense variant within the PRPS1
        gene (NM_002764.3:c.337G>T (p.A113S)) segregating with post-lingual,
        bilateral, progressive deafness in the proband's family.
      explanation: >-
        Segregation in a human family directly connects PRPS1 variation with
        the progressive hearing phenotype, while the intermediate steps remain
        unresolved.
- name: POU3F4-related inner ear developmental malformation

name: X-linked Nonsyndromic Hearing Loss
creation_date: "2026-05-08T00:00:00Z"
description: >-
  X-linked nonsyndromic hearing loss, also called DFNX, is a genetically
  heterogeneous form of hereditary hearing loss. Six loci (DFNX1-DFNX6) have
  been described, but the gene at DFNX3 remains unidentified. POU3F4 and SMPX
  have definitive ClinGen validity for nonsyndromic genetic hearing loss.
  PRPS1 is definitive only for the lumped PRPS1-deficiency continuum (DFNX1,
  CMTX5, and Arts syndrome), and AIFM1 is definitive for the broader auditory
  and sensory neuropathy spectrum rather than isolated nonsyndromic hearing
  loss. ClinGen classified the COL4A6-hearing loss, X-linked 6 relationship as
  Limited in February 2022. Human family and minigene observations provide
  variant-level evidence. A Col4a6-knockout mouse had normal click-ABR
  thresholds and cochlear morphology, narrowly arguing against simple loss of
  expression as a sufficient mechanism in that model without refuting
  variant-specific human causality. The human gene-disease relationship
  therefore remains unresolved rather than upgraded or broadly refuted. POU3F4
  is the most common DFNX gene and is strongly associated with incomplete
  partition type III inner-ear malformation.
category: Genetic

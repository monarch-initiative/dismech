has_subtypes:
- name: DFNX1
  display_name: DFNX1 / PRPS1-related X-linked nonsyndromic hearing loss
  classification: molecular
  subtype_term:
    preferred_term: hearing loss, X-linked 1
    term:
      id: MONDO:0010577
      label: hearing loss, X-linked 1
  description: >-
    PRPS1-related DFNX1 is the hearing-loss-predominant end of the broader
    PRPS1-deficiency continuum rather than a cleanly separable gene-disease
    entity. Reported families include postlingual, bilateral, progressive
    hearing loss, sometimes with mild or subclinical peripheral neuropathy.
  genes:
  - preferred_term: PRPS1
    term:
      id: hgnc:9462
      label: PRPS1
  evidence:
  - reference: PMID:25182139
    reference_title: "The expanding spectrum of PRPS1-associated phenotypes: three novel mutations segregating with X-linked hearing loss and mild peripheral neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing of a single Italian proband affected by
      non-syndromic HL identified a novel missense variant within the PRPS1 gene
      (NM_002764.3:c.337G>T (p.A113S)) segregating with post-lingual, bilateral,
      progressive deafness in the proband's family.
    explanation: >-
      This family study directly links a PRPS1 variant to progressive
      nonsyndromic hearing loss.
- name: DFNX2
  display_name: DFNX2 / DFN3 / POU3F4-related X-linked hearing loss
  classification: molecular
  subtype_term:
    preferred_term: X-linked mixed hearing loss with perilymphatic gusher
    term:
      id: MONDO:0010576
      label: X-linked mixed hearing loss with perilymphatic gusher
  description: >-
    POU3F4-related DFNX2/DFN3 is the most frequent X-linked nonsyndromic
    hearing-loss subtype and is characterized by severe congenital or childhood
    hearing loss with incomplete partition type III inner-ear malformation in
    many affected individuals.
  genes:
  - preferred_term: POU3F4
    term:
      id: hgnc:9217
      label: POU3F4
  evidence:
  - reference: PMID:37371790
    reference_title: "Clinical and Molecular Aspects Associated with Defects in the Transcription Factor POU3F4: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      POU3F4 is the gene most commonly associated with X-linked deafness
      (DFNX2, DFN3) and accounts for about 50% of the cases of X-linked
      non-syndromic hearing loss.
    explanation: >-
      This review establishes POU3F4 as the main DFNX gene and links it to the
      DFNX2/DFN3 subtype.
  - reference: PMID:37371790
    reference_title: "Clinical and Molecular Aspects Associated with Defects in the Transcription Factor POU3F4: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The clinical features of POU3F4-related hearing loss include a
      pathognomonic malformation of the inner ear defined as incomplete
      partition of the cochlea type 3 (IP-III).
    explanation: >-
      The review directly supports IP-III as the characteristic POU3F4-related
      malformation.
- name: DFNX3
  display_name: DFNX3 / unresolved X-linked nonsyndromic hearing-loss locus
  classification: molecular
  description: >-
    DFNX3 is a mapped X-linked nonsyndromic hearing-loss locus for which no
    causal gene has yet been identified; it accounts for the gap between six
    named DFNX loci and five established genes.
  evidence:
  - reference: PMID:30065609
    reference_title: "X-Linked Sensorineural Hearing Loss: A Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      To date, six loci (DFNX1-6) and five genes (PRPS1 for DFNX1, POU3F4 for
      DFNX2, SMPX for DFNX4, AIFM1 for DFNX5 and COL4A6 for DFNX6) have been
      identified for X-linked non-syndromic hearing loss.
    explanation: >-
      The six-locus/five-gene enumeration documents that DFNX3 remains a locus
      without an identified causal gene.
- name: DFNX4
  display_name: DFNX4 / SMPX-related X-linked nonsyndromic hearing loss
  classification: molecular
  subtype_term:
    preferred_term: hearing loss, X-linked 4
    term:
      id: MONDO:0010238
      label: hearing loss, X-linked 4
  description: >-
    SMPX-related DFNX4 is usually progressive nonsyndromic hearing loss.
    Truncating SMPX variants are associated with DFNX4 auditory phenotypes,
    while nontruncating variants can be associated with non-auditory myopathy
    phenotypes.
  genes:
  - preferred_term: SMPX
    term:
      id: hgnc:11122
      label: SMPX
  evidence:
  - reference: PMID:21549342
    reference_title: "Next-generation sequencing identifies mutations of SMPX, which encodes the small muscle protein, X-linked, as a cause of progressive hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a Dutch family with an X-linked postlingual progressive hearing
      impairment, a critical linkage interval was determined to span a region
      of 12.9 Mb flanked by the markers DXS7108 and DXS7110. This interval
      overlaps with the previously described DFNX4 locus and contains 75
      annotated genes. Subsequent next-generation sequencing (NGS) detected one
      variant within the linkage interval, a nonsense mutation in SMPX.
    explanation: >-
      The original DFNX4 study directly establishes the X-linked postlingual
      progressive phenotype.
- name: DFNX5
  display_name: DFNX5 / AIFM1-related X-linked hearing loss
  classification: molecular
  subtype_term:
    preferred_term: X-linked hereditary sensory and autonomic neuropathy with hearing loss
    term:
      id: MONDO:0010378
      label: X-linked hereditary sensory and autonomic neuropathy with hearing loss
  description: >-
    AIFM1-related DFNX5 falls within an X-linked auditory and sensory neuropathy
    spectrum. Auditory neuropathy may precede numbness, unsteadiness, areflexia,
    and abnormal sensory nerve studies by months or years, so an apparently
    isolated auditory presentation requires longitudinal neurologic follow-up.
  genes:
  - preferred_term: AIFM1
    term:
      id: hgnc:8768
      label: AIFM1
  evidence:
  - reference: PMID:25986071
    reference_title: "Mutations in apoptosis-inducing factor cause X-linked recessive auditory neuropathy spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variants in AIFM1 gene are a common cause of familial and sporadic ANSD
      and provide insight into the expanded spectrum of AIFM1-associated
      diseases.
    explanation: >-
      This Chinese familial-and-sporadic cohort identified AIFM1 variants in an
      auditory-neuropathy phenotype; it does not establish that AIFM1 is a
      common cause of ANSD in every population.
- name: DFNX6
  display_name: DFNX6 / COL4A6-related X-linked hearing loss
  classification: molecular
  subtype_term:
    preferred_term: hearing loss, X-linked 6
    term:
      id: MONDO:0010484
      label: hearing loss, X-linked 6
  description: >-
    DFNX6 is the reported COL4A6-associated X-linked hearing-loss phenotype.
    ClinGen retained a Limited classification in February 2022. A subsequently
    published family and in-vitro minigene result support one splice variant,
    while another reported missense variant remained a variant of uncertain
    significance; these post-curation data should be considered in a formal
    recuration rather than treated here as a categorical causal upgrade.
  genes:
  - preferred_term: COL4A6
    term:
      id: hgnc:2208
      label: COL4A6
  evidence:
  - reference: PMID:33840813
    reference_title: "Confirmation of COL4A6 variants in X-linked nonsyndromic hearing loss and its clinical implications."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      An in vitro minigene splicing assay revealed that c.951 + 1 G > T leads
      to skipping of exon 15, strongly suggesting a pathogenic role for this
      variant in the HL phenotype.
    explanation: >-
      The minigene assay is variant-specific in-vitro evidence published after
      the 2022 ClinGen evidence review; it supports splice disruption but does
      not by itself upgrade the gene-disease relationship.
  - reference: PMID:33840813
    reference_title: "Confirmation of COL4A6 variants in X-linked nonsyndromic hearing loss and its clinical implications."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The p.Gly1091Ala variant is classified as a variant of unknown
      significance based on the variant interpretation guidelines.
    explanation: >-
      The study explicitly preserves uncertainty for the reported missense
      variant.
inheritance:
- name: X-linked inheritance
  inheritance_term:
    preferred_term: X-linked inheritance
    term:
      id: HP:0001417
      label: X-linked inheritance
  description: >-
    DFNX comprises hearing-loss loci and genes on the X chromosome. Female
    expression is gene specific: PRPS1 heterozygotes range from unaffected to
    unilateral or bilateral hearing loss and occasional subclinical neuropathy,
    influenced in part by X-inactivation. POU3F4 heterozygotes are usually
    unaffected, although hearing loss has been reported and systematic female
    imaging data are lacking. SMPX-associated hearing loss is often later,
    milder, and less penetrant in females than in males. Female carriers in the
    reported AIFM1 auditory-neuropathy families did not report auditory or
    sensory neuropathy. The few COL4A6 families do not establish reliable
    female penetrance or expressivity.
  expressivity: VARIABLE
  evidence:
  - reference: PMID:30065609
    reference_title: "X-Linked Sensorineural Hearing Loss: A Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      To date, six loci (DFNX1-6) and five genes (PRPS1 for DFNX1, POU3F4 for
      DFNX2, SMPX for DFNX4, AIFM1 for DFNX5 and COL4A6 for DFNX6) have been
      identified for X-linked non-syndromic hearing loss.
    explanation: >-
      The review directly classifies the DFNX loci and genes as X-linked.
  - reference: PMID:25182139
    reference_title: "The expanding spectrum of PRPS1-associated phenotypes: three novel mutations segregating with X-linked hearing loss and mild peripheral neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Female carriers may also be affected by unilateral or bilateral hearing
      impairment.
    explanation: >-
      Human family data support variable auditory expression in PRPS1
      heterozygotes.
  - reference: PMID:30065609
    reference_title: "X-Linked Sensorineural Hearing Loss: A Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Female carriers of a mutation in the DFNX2 usually show no hearing loss
    explanation: >-
      Review evidence supports usually absent but incompletely penetrant female
      expression for POU3F4.
  - reference: PMID:30065609
    reference_title: "X-Linked Sensorineural Hearing Loss: A Literature Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Carrier females present only moderate hearing loss on the high
      frequencies.
    explanation: >-
      Review evidence supports a typically milder SMPX phenotype in females.
  - reference: PMID:25986071
    reference_title: "Mutations in apoptosis-inducing factor cause X-linked recessive auditory neuropathy spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because female carriers are unaffected, AIFM1 should be considered in
      small pedigrees with apparent autosomal recessive ANSD if X-linked
      inheritance cannot be excluded.
    explanation: >-
      This describes female nonpenetrance in the reported AIFM1 cohort, without
      assuming it for every AIFM1 variant or phenotype.
pathophysiology:
- name: PRPS1 enzymatic activity deficiency
  biological_scale: MOLECULAR
  description: >-
    DFNX1 missense variants reduce phosphoribosyl pyrophosphate synthetase 1
    activity. The available human biochemical evidence establishes reduced
    enzyme activity but does not yet resolve why partial PRPS1 deficiency is
    selectively expressed as hearing loss in milder cases.
  genes:
  - preferred_term: PRPS1
    term:
      id: hgnc:9462
      label: PRPS1
  evidence:
  - reference: PMID:25182139
    reference_title: "The expanding spectrum of PRPS1-associated phenotypes: three novel mutations segregating with X-linked hearing loss and mild peripheral neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      All three variants result in a marked reduction (>60%) of the PRS-I
      activity in the patients' erythrocytes, with c.343A>G (p.M115V) and
      c.925G>T (p.V309F) affecting more severely the enzyme function.
    explanation: >-
      Biochemical assays on patient erythrocytes support reduced PRS-I activity
      as the molecular consequence of the DFNX1 variants.
  downstream:
  - target: Progressive sensorineural hearing impairment
    description: >-
      Partial PRPS1 deficiency is associated with postlingual bilateral
      progressive hearing loss in DFNX1 families.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:25182139
      reference_title: "The expanding spectrum of PRPS1-associated phenotypes: three novel mutations segregating with X-linked hearing loss and mild peripheral neuropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Whole-exome sequencing of a single Italian proband affected by
        non-syndromic HL identified a novel missense variant within the PRPS1
        gene (NM_002764.3:c.337G>T (p.A113S)) segregating with post-lingual,
        bilateral, progressive deafness in the proband's family.
      explanation: >-
        Segregation in a human family directly connects PRPS1 variation with
        the progressive hearing phenotype, while the intermediate steps remain
        unresolved.
- name: POU3F4-related inner ear developmental malformation
  biological_scale: TISSUE
  description: >-
    POU3F4 encodes a POU-family transcription factor required for middle and
    inner ear development. POU3F4 defects can disrupt inner-ear morphogenesis,
    producing incomplete partition type III and predisposing to perilymphatic
    gusher during otologic surgery.
  genes:
  - preferred_term: POU3F4
    term:
      id: hgnc:9217
      label: POU3F4
  biological_processes:
  - preferred_term: inner ear morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0042472
      label: inner ear morphogenesis
  - preferred_term: regulation of DNA-templated transcription
    modifier: ABNORMAL
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
  evidence:
  - reference: PMID:37371790
    reference_title: "Clinical and Molecular Aspects Associated with Defects in the Transcription Factor POU3F4: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This gene codes for a transcription factor of the POU family that plays a
      major role in the development of the middle and inner ear.
    explanation: >-
      The review supports the developmental transcription-factor mechanism for
      POU3F4-related DFNX.
  downstream:
  - target: Incomplete partition type III
    description: >-
      Developmental disruption causes the characteristic IP-III inner-ear
      malformation.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37371790
      reference_title: "Clinical and Molecular Aspects Associated with Defects in the Transcription Factor POU3F4: A Review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The clinical features of POU3F4-related hearing loss include a
        pathognomonic malformation of the inner ear defined as incomplete
        partition of the cochlea type 3 (IP-III).
      explanation: >-
        The review directly links POU3F4-related hearing loss to IP-III.
- name: SMPX-related hair-cell mechanotransduction defect
  biological_scale: CELLULAR
  description: >-
    SMPX encodes a cytoskeleton-associated protein expressed in inner-ear hair
    cells. Model-organism evidence supports a role in hair-cell differentiation,
    stereociliary and kinociliary integrity, and mechanotransduction, providing
    a cellular mechanism for progressive DFNX4 hearing loss.
  genes:
  - preferred_term: SMPX
    term:
      id: hgnc:11122
      label: SMPX
  cell_types:
  - preferred_term: Auditory hair cell
    term:
      id: CL:0000202
      label: auditory hair cell
  biological_processes:
  - preferred_term: detection of mechanical stimulus involved in sensory perception
    modifier: DECREASED
    term:
      id: GO:0050974
      label: detection of mechanical stimulus involved in sensory perception
  - preferred_term: cell projection organization
    modifier: ABNORMAL
    term:
      id: GO:0030030
      label: cell projection organization
  evidence:
  - reference: PMID:38570547
    reference_title: "Differentiation and functioning of the lateral line organ in zebrafish require Smpx activity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The small muscle protein, X-linked (SMPX) gene encodes a
      cytoskeleton-associated protein, highly expressed in the inner ear hair
      cells (HCs), possibly regulating auditory function.
    explanation: >-
      The abstract supports SMPX expression in inner-ear hair cells and its
      likely auditory role.
  - reference: PMID:38570547
    reference_title: "Differentiation and functioning of the lateral line organ in zebrafish require Smpx activity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Such phenotypes were associated with a significant reduction in the
      mechanotransduction activity of the neuromast HCs
    explanation: >-
      Zebrafish loss-of-function evidence supports reduced mechanotransduction
      as a cellular consequence of SMPX deficiency.
  - reference: PMID:34722533
    reference_title: "SMPX Deficiency Causes Stereocilia Degeneration and Progressive Hearing Loss in CBA/CaJ Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Through morphological analyses of mice cochleas, we found the hair cell
      bundles progressively degenerated from the shortest row. Cellular edema
      occurred at the end phase of stereocilia degeneration, followed by cell
      death.
    explanation: >-
      Mouse data independently support progressive stereocilia degeneration and
      hair-cell death after Smpx loss.
  downstream:
  - target: Progressive sensorineural hearing impairment
    description: >-
      Reduced hair-cell mechanotransduction provides a cellular route from SMPX
      deficiency to progressive sensorineural hearing impairment.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:38570547
      reference_title: "Differentiation and functioning of the lateral line organ in zebrafish require Smpx activity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Such phenotypes were associated with a significant reduction in the
        mechanotransduction activity of the neuromast HCs
      explanation: >-
        Model-organism data connect SMPX deficiency with reduced hair-cell
        mechanotransduction, supporting the edge to progressive hearing
        impairment.
    - reference: PMID:21549342
      reference_title: "Next-generation sequencing identifies mutations of SMPX, which encodes the small muscle protein, X-linked, as a cause of progressive hearing impairment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In a Dutch family with an X-linked postlingual progressive hearing
        impairment, a critical linkage interval was determined to span a region
        of 12.9 Mb flanked by the markers DXS7108 and DXS7110.
      explanation: >-
        Human family evidence independently supports the progressive hearing
        endpoint of the model-derived mechanistic edge.
- name: AIFM1-related auditory signal transmission defect
  biological_scale: TISSUE
  description: >-
    The reported AIFM1 phenotype is an auditory and sensory neuropathy spectrum
    in which transmission from the inner ear to the auditory nerve and
    brainstem is distorted. The cited human cohort does not establish a single
    cellular lesion in every affected individual or isolate hearing loss from
    the delayed neurologic phenotype.
  genes:
  - preferred_term: AIFM1
    term:
      id: hgnc:8768
      label: AIFM1
  evidence:
  - reference: PMID:25986071
    reference_title: "Mutations in apoptosis-inducing factor cause X-linked recessive auditory neuropathy spectrum disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Auditory neuropathy spectrum disorder (ANSD) is a form of hearing loss in
      which auditory signal transmission from the inner ear to the auditory
      nerve and brain stem is distorted, giving rise to speech perception
      difficulties beyond that expected for the observed degree of hearing
      loss.
    explanation: >-
      The clinical study defines the transmission defect represented by this
      node.
  downstream:
  - target: Auditory neuropathy spectrum disorder
    description: >-
      AIFM1 variants segregated with auditory and peripheral sensory neuropathy
      in several families and were also identified in sporadic ANSD cases in a
      Chinese cohort.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:25986071
      reference_title: "Mutations in apoptosis-inducing factor cause X-linked recessive auditory neuropathy spectrum disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Variants in AIFM1 gene are a common cause of familial and sporadic ANSD
        and provide insight into the expanded spectrum of AIFM1-associated
        diseases.
      explanation: >-
        The study supports the AIFM1-associated auditory-neuropathy phenotype
        in the studied cohort without implying population-independent frequency
        or an isolated nonsyndromic boundary.
- name: Candidate COL4A6-associated cochlear basement-membrane involvement
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    COL4A6 encodes the alpha-6 chain of type IV collagen in basement membranes.
    The 2022 ClinGen curation found only Limited evidence for DFNX6. Human
    segregation and a later variant-specific minigene assay provide candidate
    support, while expression in animal inner ears supports biological
    plausibility; neither establishes a general cochlear mechanism.
  genes:
  - preferred_term: COL4A6
    term:
      id: hgnc:2208
      label: COL4A6
  evidence:
  - reference: PMID:23714752
    reference_title: "Novel form of X-linked nonsyndromic hearing loss with cochlear malformation caused by a mutation in the type IV collagen gene COL4A6."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Next-generation sequencing and subsequent segregation analysis detected a
      missense mutation (c.1771G>A, p.Gly591Ser) in the type IV collagen gene
      COL4A6 in all affected family members.
    explanation: >-
      Human segregation in the original family supports, but does not by itself
      establish, the COL4A6 association.
  - reference: PMID:23714752
    reference_title: "Novel form of X-linked nonsyndromic hearing loss with cochlear malformation caused by a mutation in the type IV collagen gene COL4A6."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In situ hybridization and immunostaining demonstrated expression of the
      COL4A6 homologs in the otic vesicle of the zebrafish and in the murine
      inner ear, supporting its role in normal ear development and function.
    explanation: >-
      Cross-species expression supplies model-organism support for an inner-ear
      role without overstating the unresolved mechanism.

- name: SOX10 genetic testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: Molecular confirmation relies on identifying a heterozygous pathogenic SOX10 variant (typically an NMD-escaping premature termination codon in exon 5, non-stop variant, HMG-domain missense variant, or 22q13.1 copy number change via sequencing, MLPA, or array-CGH) in the setting of a compatible neurocristopathy phenotype.
  results: Pathogenic SOX10 variant confirms the molecular diagnosis of PCWH syndrome.
  evidence:
  - reference: PMID:38391765
    reference_title: 'Waardenburg Syndrome: The Contribution of Next-Generation Sequencing to the Identification of Novel Causative Variants.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A neurological variant of type 4, named PCWH (peripheral demyelinating neuropathy, central dysmyelination, Waardenburg syndrome with Hirschsprung disease) is caused exclusively by pathogenic variants in SOX10 with a predominance of truncating variants on the last exon of the gene [20,21].
    explanation: Directly supports molecular genetic testing of SOX10, particularly exon 5 truncating variants, to confirm PCWH syndrome.
- name: Brain and temporal bone neuroimaging
  diagnosis_term:
    preferred_term: magnetic resonance imaging procedure
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: Brain MRI and temporal bone CT/MRI are used to document diffuse central dysmyelinating leukodystrophy, semicircular canal hypoplasia/dysplasia or agenesis, vestibular enlargement, and potential olfactory bulb agenesis.
  results: Diffuse hypomyelinating white matter abnormality and semicircular canal dysplasia/agenesis support the diagnosis of SOX10-related PCWH syndrome.
  evidence:
  - reference: PMID:34667088
    reference_title: 'SOX10: 20 years of phenotypic plurality and current understanding of its developmental function.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Consequently, temporal CT scan or MRI is of particular interest in diagnosis.
    explanation: Supports temporal bone CT/MRI and brain MRI to identify characteristic SOX10-associated inner ear malformations in diagnostic evaluation.
- name: Intestinal biopsy
  diagnosis_term:

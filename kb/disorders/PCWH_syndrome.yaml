inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: PCWH syndrome is an autosomal dominant disorder caused by heterozygous pathogenic SOX10 variants. Most cases arise de novo, though familial transmission (~20% across SOX10-related disorders) with marked intrafamilial and interfamilial phenotypic variability and parental mosaicism (~3-4%) are also documented.
  evidence:
  - reference: PMID:34667088
    reference_title: 'SOX10: 20 years of phenotypic plurality and current understanding of its developmental function.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Since then, heterozygous mutations have been reported in Waardenburg syndrome type 2 (Waardenburg syndrome type without Hirschsprung disease), PCWH or PCW (peripheral demyelinating neuropathy, central dysmyelination, Waardenburg syndrome, with or without Hirschsprung disease), intestinal manifestations beyond Hirschsprung (ie, chronic intestinal pseudo-obstruction), Kallmann syndrome and cancer.
    explanation: Confirms that PCWH syndrome is caused by heterozygous pathogenic mutations in SOX10, consistent with autosomal dominant inheritance.
prevalence:
- population: Global published cases
  prevalence_class: ULTRA_RARE
  measure_type: CASES_IN_LITERATURE
  notes: Ultra-rare SOX10-related neurocristopathy; an up-to-date literature curation and LOVD/HGMD review of ~300 independent SOX10-mutated families identified 64 independent index cases in the PCW/PCWH group.
  evidence:
  - reference: PMID:34667088
    reference_title: 'SOX10: 20 years of phenotypic plurality and current understanding of its developmental function.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: summary of confident mutations of SOX10 (approximately 300 independent cases, including unpublished ones in online supplemental table 1)
    explanation: Documents the small cumulative number of published and curated SOX10-mutant families worldwide (~300 total across all SOX10 phenotypes, of which 64 are classified as PCW/PCWH in Figure 3B).
  - reference: PMID:15004559
    reference_title: Molecular mechanism for distinct neurological phenotypes conveyed by allelic truncating mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Truncating mutations of SOX10 cause either a complex neurocristopathy designated PCWH or a more restricted phenotype known as Waardenburg-Shah syndrome (WS4; OMIM 277580).
    explanation: Establishes PCWH as a rare complex neurocristopathy caused by truncating SOX10 mutations.
progression:
- phase: Onset
  age_range: Neonatal to infancy
  notes: Presents in the neonatal period or early infancy with congenital intestinal obstruction or pseudo-obstruction from Hirschsprung disease/hypoganglionosis, congenital sensorineural hearing loss, pigmentary anomalies, hypotonia, demyelinating peripheral neuropathy, and diffuse central hypomyelination.
  evidence:
  - reference: PMID:29681101
    reference_title: A patient with peripheral demyelinating neuropathy, central dysmyelinating leukodystrophy, Waardenburg syndrome, and severe hypoganglionosis associated with a novel SOX10 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In this report, we present the case of a female infant with peripheral demyelinating neuropathy, central dysmyelinating leukodystrophy, Waardenburg syndrome, and Hirschsprung disease (PCWH) associated with a novel frameshift mutation (c.842dupT) in exon 5, the last exon of SOX10.
    explanation: Documents presentation in infancy with the full tetrad of PCWH features.
pathophysiology:
- name: NMD-escaping or altered-function SOX10 variant
  description: PCWH-associated truncating SOX10 variants (typically located in the last coding exon, exon 5, or the last 45 nucleotides of the penultimate exon, exon 4) escape nonsense-mediated mRNA decay (NMD) and produce an expressed C-terminally truncated SOX10 protein that retains the HMG DNA-binding domain but lacks normal transactivation capacity, exerting dominant-negative interference over wild-type SOX10. Additional pathogenic mechanisms capable of producing the PCW/PCWH spectrum include non-stop (C-terminal extension) variants that generate a deleterious tryptophan-arginine (WR) domain with toxic gain-of-function or dominant-additive effects, specific missense variants (such as Gln174/Pro175 variants that form nuclear paraspeckle foci with p54NRB/NONO and sequester wild-type SOX10, or dimerization-domain variants), and 22q13.1 duplications encompassing SOX10.
  genes:
  - preferred_term: SOX10
    term:
      id: hgnc:11190
      label: SOX10
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
    modifier: ABNORMAL
    term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
  evidence:
  - reference: PMID:15004559
    reference_title: Molecular mechanism for distinct neurological phenotypes conveyed by allelic truncating mutations.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Here we report that although all nonsense and frameshift mutations that cause premature termination of translation generate truncated SOX10 proteins with potent dominant-negative activity, the more severe disease phenotype, PCWH, is realized only when the mutant mRNAs escape the nonsense-mediated decay (NMD) pathway.
    explanation: Demonstrates that truncated SOX10 proteins exert potent dominant-negative activity when mutant mRNAs escape NMD.
  - reference: PMID:34667088
    reference_title: 'SOX10: 20 years of phenotypic plurality and current understanding of its developmental function.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Finally, duplication of the 22q13.1 region, including SOX10, can also induce PCWH
    explanation: Documents that 22q13.1 duplications encompassing SOX10, in addition to NMD-escaping truncations and non-stop mutations, can also produce PCWH.
  - reference: PMID:29681101
    reference_title: A patient with peripheral demyelinating neuropathy, central dysmyelinating leukodystrophy, Waardenburg syndrome, and severe hypoganglionosis associated with a novel SOX10 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The p.Ser282GlnfsTer12 mutation presumably escapes from nonsense-mediated decay and may generate a dominant-negative effect.
    explanation: Provides case-level support for an NMD-escaping SOX10 frameshift variant with dominant-negative effect in PCWH.
  downstream:
  - target: SOX10 developmental dysfunction
    description: The expressed mutant or dosage-altered SOX10 protein disrupts SOX10-dependent neural crest and extraneural crest glial and otic transcriptional networks.
    evidence:
    - reference: PMID:15004559
      reference_title: Molecular mechanism for distinct neurological phenotypes conveyed by allelic truncating mutations.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Our experiments show that triggering NMD and escaping NMD may cause distinct neurological phenotypes.
      explanation: Confirms that NMD-escaping mutant SOX10 transcripts drive the broader neurological developmental dysfunction of PCWH.
- name: SOX10 developmental dysfunction
  description: Disrupted SOX10 transcriptional activity impairs gene regulation across both neural crest derivatives (melanocytes, enteric nervous system progenitors, Schwann cells, and olfactory ensheathing cells) and extraneural crest tissues (placode-derived inner ear neurosensory/supporting epithelium and central nervous system oligodendrocytes) by failing to cooperatively transactivate lineage-specific target genes with partner factors including PAX3, MITF, POU3F1 (OCT6), EGR2 (KROX20), OLIG1, MYRF, TCF4, and CHD7.

      label: Biopsy Procedure
  description: Histologic assessment of rectal or intestinal biopsy specimens is used to evaluate enteric ganglion cells when Hirschsprung disease or severe hypoganglionosis is suspected.
  results: Absence or severe paucity of enteric ganglion cells confirms aganglionosis or hypoganglionosis.
differential_diagnoses:
- name: Waardenburg-Shah syndrome
  disease_term:
    preferred_term: Waardenburg-Shah syndrome
    term:
      id: MONDO:0019518
      label: Waardenburg-Shah syndrome
  description: Classic Waardenburg-Shah syndrome (WS4) caused by NMD-sensitive SOX10 haploinsufficiency, EDNRB, or EDN3 variants shares pigmentary, auditory, and Hirschsprung disease features with PCWH but lacks peripheral demyelinating neuropathy and central dysmyelinating leukodystrophy.
  distinguishing_features:
  - Absence of peripheral demyelinating neuropathy and central dysmyelinating leukodystrophy
  - SOX10 truncating variants located in 5' coding exons that undergo nonsense-mediated mRNA decay (haploinsufficiency), or pathogenic variants in EDNRB or EDN3
  evidence:
  - reference: PMID:15004559
    reference_title: Molecular mechanism for distinct neurological phenotypes conveyed by allelic truncating mutations.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Truncating mutations of SOX10 cause either a complex neurocristopathy designated PCWH or a more restricted phenotype known as Waardenburg-Shah syndrome (WS4; OMIM 277580).
    explanation: Directly distinguishes classic Waardenburg-Shah syndrome (WS4) from the more severe neurological PCWH phenotype.
- name: Kallmann syndrome
  disease_term:
    preferred_term: Kallmann syndrome
    term:
      id: MONDO:0018800
      label: Kallmann syndrome
  description: SOX10-related Kallmann syndrome (hypogonadotropic hypogonadism and anosmia due to olfactory ensheathing cell defects and olfactory bulb agenesis, frequently accompanied by sensorineural hearing loss) overlaps with the SOX10 clinical continuum and may co-occur with WS or PCWH features, but isolated Kallmann syndrome lacks Hirschsprung disease and diffuse central or peripheral dysmyelination.
  distinguishing_features:
  - Prominent hypogonadotropic hypogonadism and anosmia without enteric aganglionosis or leukodystrophy
  evidence:
  - reference: PMID:34667088
    reference_title: 'SOX10: 20 years of phenotypic plurality and current understanding of its developmental function.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The screening of cohorts indeed revealed SOX10 mutations in patients with KS, most of whom also have hearing impairment.
    explanation: Establishes SOX10-related Kallmann syndrome with deafness as an allelic disorder on the SOX10 clinical continuum.
- name: Pelizaeus-Merzbacher spectrum disorder
  disease_term:
    preferred_term: Pelizaeus-Merzbacher spectrum disorder
    term:
      id: MONDO:0010714
      label: Pelizaeus-Merzbacher spectrum disorder
  description: Pelizaeus-Merzbacher disease and Pelizaeus-Merzbacher-like disease 1 (including GJC2-related hypomyelinating leukodystrophy where GJC2 promoter mutations disrupt SOX10 transcriptional activation) resemble the central dysmyelinating leukodystrophy, nystagmus, spasticity, and ataxia of PCWH syndrome but lack neural crest derivative defects (Waardenburg pigmentary anomalies and Hirschsprung disease).
  distinguishing_features:
  - Absence of Hirschsprung disease and Waardenburg pigmentary anomalies
  - Caused by pathogenic variants in PLP1 or GJC2 (a direct transcriptional target of SOX10) rather than heterozygous SOX10 variants
  evidence:
  - reference: PMID:34667088
    reference_title: 'SOX10: 20 years of phenotypic plurality and current understanding of its developmental function.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Of interest, some of the genes directly regulated by SOX10 in PNS and CNS are known to be responsible for hypomyelinating/ demyelinating diseases, with some described mutations in these genes that directly result from a loss of regulation by SOX10.
    explanation: Supports the mechanistic and clinical overlap between SOX10-related central dysmyelination in PCWH and downstream hypomyelinating leukodystrophies such as Pelizaeus-Merzbacher spectrum disorders.

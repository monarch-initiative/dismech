genetic:
- name: SOX10
  gene_term:
    preferred_term: SOX10
    term:
      id: hgnc:11190
      label: SOX10
  association: Causal heterozygous pathogenic variant causing severe SOX10-related neurocristopathy
  inheritance:
  - name: Autosomal dominant inheritance
    evidence:
    - reference: PMID:34667088
      reference_title: 'SOX10: 20 years of phenotypic plurality and current understanding of its developmental function.'
      supports: SUPPORT
      evidence_source: OTHER
      snippet: Since then, heterozygous mutations have been reported in Waardenburg syndrome type 2 (Waardenburg syndrome type without Hirschsprung disease), PCWH or PCW (peripheral demyelinating neuropathy, central dysmyelination, Waardenburg syndrome, with or without Hirschsprung disease), intestinal manifestations beyond Hirschsprung (ie, chronic intestinal pseudo-obstruction), Kallmann syndrome and cancer.
      explanation: Confirms that heterozygous SOX10 mutations cause PCWH syndrome in an autosomal dominant manner.
  features: Premature termination codons in the last coding exon (exon 5) or last 45 nucleotides of the penultimate exon (exon 4) of SOX10 escape nonsense-mediated mRNA decay and act in a dominant-negative manner to produce PCWH (with earlier truncations within the last exon conferring more severe disease), whereas more 5' truncating variants trigger NMD and cause classic Waardenburg-Shah syndrome (WS4) via haploinsufficiency. Additional PCW/PCWH-associated alleles include non-stop (C-terminal extension) mutations that generate a toxic tryptophan-arginine (WR) domain, specific missense mutations in the HMG domain (including paraspeckle foci-forming Gln174/Pro175 variants) or dimerization domain, and 22q13.1 duplications encompassing SOX10.
  evidence:
  - reference: PMID:29681101
    reference_title: A patient with peripheral demyelinating neuropathy, central dysmyelinating leukodystrophy, Waardenburg syndrome, and severe hypoganglionosis associated with a novel SOX10 mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In this report, we present the case of a female infant with peripheral demyelinating neuropathy, central dysmyelinating leukodystrophy, Waardenburg syndrome, and Hirschsprung disease (PCWH) associated with a novel frameshift mutation (c.842dupT) in exon 5, the last exon of SOX10.
    explanation: This directly links SOX10 mutation to the defining PCWH phenotype.
  - reference: PMID:38391765
    reference_title: 'Waardenburg Syndrome: The Contribution of Next-Generation Sequencing to the Identification of Novel Causative Variants.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: A neurological variant of type 4, named PCWH (peripheral demyelinating neuropathy, central dysmyelination, Waardenburg syndrome with Hirschsprung disease) is caused exclusively by pathogenic variants in SOX10 with a predominance of truncating variants on the last exon of the gene [20,21].
    explanation: Confirms that PCWH is caused exclusively by pathogenic SOX10 variants, predominantly truncating mutations in the last coding exon.
  - reference: PMID:34667088
    reference_title: 'SOX10: 20 years of phenotypic plurality and current understanding of its developmental function.'
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'The severity of PCWH was shown to be linked to the location of the mutation within the last exon: the earlier the truncation, the more severe the phenotype.'
    explanation: Documents the genotype-phenotype correlation between truncation position in the last coding exon and PCWH clinical severity.

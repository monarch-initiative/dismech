  description: 'A 25% sibling recurrence risk. Counselling here has a specific pitfall: the phenotype
    looks like the dominant forms, so a family assumed to have dominant disease on clinical grounds would
    be given the wrong recurrence risk until the molecular diagnosis is made.'

- name: Orthodontic and Supportive Care
  description: 'Management follows the syndrome-level pattern: orthodontic treatment, corrective genital
    surgery where indicated, and surveillance. No NXN-specific management evidence exists. Symptomatic;
    nothing here acts on the redox regulation of Dishevelled.'

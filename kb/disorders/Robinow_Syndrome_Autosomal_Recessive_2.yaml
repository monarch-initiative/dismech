  description: >-
    Nucleoredoxin is a thioredoxin-family redox protein that binds Dishevelled
    and regulates its availability for WNT signal transduction. Losing it places
    the lesion one step upstream of Dishevelled itself — a regulator of the
    transducer rather than the transducer, the ligand, or the receptor.
  biological_processes:
  - preferred_term: NXN redox regulation of Dishevelled
    modifier: LOSS_OF_FUNCTION

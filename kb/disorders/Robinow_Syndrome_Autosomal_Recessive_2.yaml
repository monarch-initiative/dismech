    evidence:
    - reference: PMID:35047859
      reference_title: 'Novel pathogenic variants and quantitative phenotypic analyses of Robinow syndrome:
        WNT signaling perturbation and phenotypic variability.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Some of the more common physical features among all genotypes (prevalence more than 60%
        in each genotype), potentially comprising a clinical synopsis, include midface hypoplasia (90%,
        N = 54 out of 60); hypertelorism (79%, N = 50 out of 63); prominent eyes (65%, N = 35 out of 54);
        anteverted nares (88%, N = 49 out of 56); wide, low nasal bridge (90%, N = 55 out of 61); gingival
        hyperplasia (81%, N = 42 out of 52); limb length anomaly, including mesomelia/micromelia/rhizomelia
        (91%, N = 60 out of 66); brachydactyly (89%, N = 55 out of 62); and broad first toe (67%, N =
        33 out of 49).
      explanation: Confirms limb length anomalies including mesomelia as a highly prevalent (>60% across
        all genotypes) skeletal outcome of WNT/PCP disruption.
  - target: Fetal Facies
    causal_link_type: DIRECT
    description: Midline outgrowth failure of the frontonasal region.
    evidence:
    - reference: PMID:35047859
      reference_title: 'Novel pathogenic variants and quantitative phenotypic analyses of Robinow syndrome:
        WNT signaling perturbation and phenotypic variability.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Some of the more common physical features among all genotypes (prevalence more than 60%

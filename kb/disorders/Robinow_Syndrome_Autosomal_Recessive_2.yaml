    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Probands with biallelic NXN variants clustered together with the majority
      of probands carrying DVL1, DVL2, and DVL3 variants, demonstrating no
      phenotypic distinction between the NXN-autosomal recessive and dominant

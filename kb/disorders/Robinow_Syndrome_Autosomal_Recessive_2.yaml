      from two families with biallelic variants in NXN that co-segregate with the phenotype.
    explanation: Establishes NXN as a Robinow gene with co-segregating biallelic variants.
diagnosis:
- name: Molecular Confirmation
  presence: Positive
  results: Identification of biallelic pathogenic or likely pathogenic variants in NXN.
  description: Confirmed by biallelic NXN variants. In practice NXN is reached through a Robinow gene
    panel or exome rather than tested first, since the clinical picture does not distinguish it from the
    DVL-related forms — which is precisely what the phenotypic clustering showed.
  diagnosis_term:

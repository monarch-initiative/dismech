name: Robinow Syndrome, Autosomal Recessive 2
synonyms:
- RRS2
- NXN-related Robinow syndrome
- nucleoredoxin-related Robinow syndrome
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: robinow syndrome, autosomal recessive 2
  term:
    id: MONDO:0032800
    label: robinow syndrome, autosomal recessive 2
description: >-
  The NXN form: biallelic variants in nucleoredoxin, a thioredoxin-family redox
  protein that binds Dishevelled and regulates its availability for WNT signal
  transduction. It was found not by phenotype-led search but by screening the
  WNT5A interactome in Robinow families that were negative for the previously
  known genes — the same study that identified the FZD2 form.

  The interesting thing about this entity is that its inheritance and its
  phenotype point in different directions. It is recessive, like ROR2 disease,
  but quantitative phenotypic clustering places NXN probands with the DVL1,
  DVL2 and DVL3 probands — the dominant forms — rather than with ROR2 disease.
  So the severity gradient in Robinow syndrome tracks where in the pathway the
  lesion sits, not whether one or two alleles are hit. Nucleoredoxin acts at the
  Dishevelled step, and the phenotype follows the step rather than the dose.
parents:
- Robinow Syndrome
- Skeletal Dysplasia
notes: >-
  Scope. This entry covers the NXN form only (MONDO:0032800, RRS2). The ROR2
  recessive form is ``Autosomal_Recessive_Robinow_Syndrome``; the union is
  ``kb/groupings/Robinow_Syndrome.yaml``.

  Evidence base. Two families, three individuals. Nothing here rests on a large
  series, and the clinical phenotype is characterized mainly through the
  quantitative HPO clustering rather than through a descriptive case series. The
  entry is deliberately thinner than the ROR2 and DVL1 entries because the
  literature is thinner, not because it was curated less carefully; where a
  phenotype is asserted from the syndrome-level description rather than from NXN
  patients specifically, the evidence explanation says so.

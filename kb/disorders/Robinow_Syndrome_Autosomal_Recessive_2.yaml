  role: central_effector
  biological_scale: CELLULAR
  description: >-
    The convergence point this entry shares with every other Robinow genotype.
    What is distinctive is where NXN enters: at the Dishevelled step, the same
    level as the DVL1 and DVL3 alleles — which is the most plausible explanation
    for the phenotypic clustering, since probands with biallelic NXN variants
    group with the DVL-related probands rather than with ROR2 disease despite
    sharing ROR2 disease's recessive inheritance.
  biological_processes:

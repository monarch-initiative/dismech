discussions:
- discussion_id: nxn_recessive_but_dominant_like_phenotype
  kind: KNOWLEDGE_GAP
  prompt: Why does a recessive lesion at NXN produce a phenotype indistinguishable from the heterozygous
    DVL-related forms rather than from the recessive ROR2 form?
  attaches_to:
  - pathophysiology#Perturbed Dishevelled-Level WNT/PCP Signalling
  rationale: 'The natural expectation is that two hit alleles give more severe disease than one, and ROR2
    disease is indeed the severe end. NXN breaks that expectation: biallelic loss, but a phenotype clustering
    with heterozygous DVL1/DVL2/DVL3 probands. The most economical explanation is that severity tracks
    the position of the lesion in the cascade rather than allele dosage — receptor-level loss being worse
    than transducer-level perturbation — but that is an inference from a clustering analysis of a small
    cohort, not a measured mechanism. Functional comparison of NXN-null and ROR2-null signalling output
    in the same system would test it.'
  evidence:
  - reference: PMID:35047859
    reference_title: 'Novel pathogenic variants and quantitative phenotypic analyses of Robinow syndrome:
      WNT signaling perturbation and phenotypic variability.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Probands with biallelic NXN variants clustered together with the majority of probands carrying
      DVL1, DVL2, and DVL3 variants, demonstrating no phenotypic distinction between the NXN-autosomal
      recessive and dominant forms of RS.
    explanation: Documents the quantitative phenotypic clustering of recessive NXN probands with dominant
      DVL-related probands.

diagnosis:
- name: Molecular Confirmation
  description: >-
    Confirmed by biallelic NXN variants. In practice NXN is reached through a
    Robinow gene panel or exome rather than tested first, since the clinical
    picture does not distinguish it from the DVL-related forms — which is
    precisely what the phenotypic clustering showed.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:35047859
    reference_title: "Novel pathogenic variants and quantitative phenotypic analyses of Robinow syndrome: WNT signaling perturbation and phenotypic variability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic or likely pathogenic variants in genes associated with RS or RS
      phenocopies were identified in all 22 individuals
    explanation: >-
      Supports the high molecular yield of broad testing in a clinically
      ascertained Robinow cohort, which is how this form is reached.
differential_diagnoses:
- name: Autosomal Recessive Robinow Syndrome
  description: >-
    The ROR2 form — the other recessive Robinow entity, and the one this form is
    most likely to be assumed to resemble. It does not: ROR2 disease is more
    severe, with vertebral segmentation defects and rib fusions, while NXN
    probands cluster with the milder dominant forms.
- name: Autosomal Dominant Robinow Syndrome 2
  description: >-
    The DVL1 form. Phenotypically the closest match despite the opposite
    inheritance mode, which is the central observation about this entity.
    Distinguished by inheritance pattern and by the DVL1-specific osteosclerosis.
treatments:
- name: Genetic Counseling
  description: >-
    A 25% sibling recurrence risk. Counselling here has a specific pitfall: the
    phenotype looks like the dominant forms, so a family assumed to have
    dominant disease on clinical grounds would be given the wrong recurrence
    risk until the molecular diagnosis is made.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:35047859
    reference_title: "Novel pathogenic variants and quantitative phenotypic analyses of Robinow syndrome: WNT signaling perturbation and phenotypic variability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Probands with biallelic NXN variants clustered together with the majority
      of probands carrying DVL1, DVL2, and DVL3 variants, demonstrating no
      phenotypic distinction between the NXN-autosomal recessive and dominant
      forms of RS.
    explanation: >-
      Establishes that the clinical picture does not reveal the inheritance
      mode, which is what makes the counselling pitfall real.
- name: Orthodontic and Supportive Care
  description: >-
    Management follows the syndrome-level pattern: orthodontic treatment,
    corrective genital surgery where indicated, and surveillance. No NXN-specific
    management evidence exists.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:25577943
    reference_title: "Autosomal Dominant Robinow Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Orthodontic treatment is typically required.
    explanation: >-
      Management guidance from the dominant-form chapter, applied here because
      the phenotypes cluster together. PARTIAL because it is not NXN-specific.
discussions:
- discussion_id: nxn_recessive_but_dominant_like_phenotype
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does a recessive lesion at NXN produce a phenotype indistinguishable
    from the heterozygous DVL-related forms rather than from the recessive ROR2
    form?
  attaches_to:
  - pathophysiology#Perturbed Dishevelled-Level WNT/PCP Signalling
  rationale: >-
    The natural expectation is that two hit alleles give more severe disease
    than one, and ROR2 disease is indeed the severe end. NXN breaks that
    expectation: biallelic loss, but a phenotype clustering with heterozygous
    DVL1/DVL2/DVL3 probands. The most economical explanation is that severity
    tracks the position of the lesion in the cascade rather than allele dosage —
    receptor-level loss being worse than transducer-level perturbation — but that
    is an inference from a clustering analysis of a small cohort, not a measured
    mechanism. Functional comparison of NXN-null and ROR2-null signalling output
    in the same system would test it.
references:

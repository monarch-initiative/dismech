        hyperplasia (81%, N = 42 out of 52); limb length anomaly, including mesomelia/micromelia/rhizomelia
        (91%, N = 60 out of 66); brachydactyly (89%, N = 55 out of 62); and broad first toe (67%, N =
        33 out of 49).
      explanation: Establishes hypertelorism, midface hypoplasia, and wide nasal bridge as shared craniofacial
        consequences across all Robinow genotypes.
  - target: Genital Hypoplasia
    causal_link_type: DIRECT
    description: Reduced genital tubercle outgrowth.
    evidence:
    - reference: PMID:35047859
      reference_title: 'Novel pathogenic variants and quantitative phenotypic analyses of Robinow syndrome:
        WNT signaling perturbation and phenotypic variability.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Additionally, hypoplastic genitalia in males (93%, N = 25 out of 27) was common among all
        RS subjects, irrespective of the genetic etiology, but prevalence of hypoplastic genitalia in
        females was variable in different genotypes.
      explanation: Establishes male genital hypoplasia across all Robinow syndrome genetic etiologies.

- name: Disrupted Planar Cell Polarity in Developing Skeleton and Face
  role: consequence
  biological_scale: TISSUE
  description: 'The shared endpoint: loss of the polarized, directional cell behaviour that PCP signalling
    governs, in the growth plate, the frontonasal midline and the genital tubercle. The developmental
    decomposition comes from the Ror2-null mouse and is inherited here by pathway membership rather than
    demonstrated for NXN — a weaker transfer than usual, since NXN sits at a different step of the pathway
    from ROR2 and the phenotypic clustering says the two are not equivalent.'

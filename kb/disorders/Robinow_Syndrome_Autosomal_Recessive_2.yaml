differential_diagnoses:
- name: Autosomal Recessive Robinow Syndrome
  description: 'The ROR2 form — the other recessive Robinow entity, and the one this form is most likely
    to be assumed to resemble. It does not: ROR2 disease is more severe, with vertebral segmentation defects
    and rib fusions, while NXN probands cluster with the milder dominant forms.'
  evidence:
  - reference: PMID:35047859
    reference_title: 'Novel pathogenic variants and quantitative phenotypic analyses of Robinow syndrome:
      WNT signaling perturbation and phenotypic variability.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Hemivertebrae and scoliosis were reported in AR-RS, while umbilical hernias are almost exclusively
      observed in AD-RS.
    explanation: Vertebral involvement is the feature associated with the ROR2 recessive form.
  - reference: PMID:35047859
    reference_title: 'Novel pathogenic variants and quantitative phenotypic analyses of Robinow syndrome:
      WNT signaling perturbation and phenotypic variability.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In this study, only AR-RS individuals with variants in NXN were studied but none of them had
      scoliosis.
    explanation: None of the NXN individuals had scoliosis, which separates this form from ROR2 disease.
- name: Autosomal Dominant Robinow Syndrome 2
  description: The DVL1 form. Phenotypically the closest match despite the opposite inheritance mode,
    which is the central observation about this entity. Distinguished by inheritance pattern and by the
    DVL1-specific osteosclerosis.
  evidence:
  - reference: PMID:35047859
    reference_title: 'Novel pathogenic variants and quantitative phenotypic analyses of Robinow syndrome:
      WNT signaling perturbation and phenotypic variability.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Probands with biallelic NXN variants clustered together with the majority of probands carrying
      DVL1, DVL2, and DVL3 variants, demonstrating no phenotypic distinction between the NXN-autosomal
      recessive and dominant forms of RS.
    explanation: Establishes that DVL1-related dominant Robinow syndrome is phenotypically indistinguishable
      from NXN-related recessive disease and requires molecular differentiation.

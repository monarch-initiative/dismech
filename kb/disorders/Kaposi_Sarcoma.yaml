biochemical:
- name: HHV-8 Viral Load
  notes: >-
    HHV-8 DNA quantification by PCR correlates with disease activity.
    Rising viral loads may indicate disease progression or lytic reactivation.
- name: LANA Immunohistochemistry
  notes: >-
    Detection of latency-associated nuclear antigen (LANA) in tumor cells
    by immunohistochemistry is the gold standard for confirming HHV-8
    infection and diagnosing Kaposi sarcoma.
genetic:
- name: HHV-8 Viral Oncogenes
  association: Viral Oncogene Expression
  notes: >-
    HHV-8 encodes multiple oncogenes: vGPCR (constitutively active GPCR),
    vFLIP (NF-kappaB activator), vCyclin (cell cycle driver), LANA (tumor
    suppressor inhibitor), vIL-6, vBCL-2, and K1. These cooperate to drive
    transformation through multiple mechanisms.
diagnosis:
- name: Histopathological and LANA-1 Immunohistochemical Confirmation
  description: >-
    Definitive diagnosis of Kaposi sarcoma relies on histopathological
    identification of spindle-cell vascular proliferation combined with
    immunohistochemical detection of HHV-8 latency-associated nuclear antigen 1
    (LANA-1) within tumor spindle cells, distinguishing KS from vascular
    mimickers.
  diagnosis_term:
    preferred_term: Immunohistochemistry Staining Method
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  evidence:
  - reference: DOI:10.3390/cancers16040691
    reference_title: "Kaposi’s Sarcoma: Evaluation of Clinical Features, Treatment Outcomes, and Prognosis in a Single-Center Retrospective Case Series"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis is based on histopathological and immunohistochemical analyses."
    explanation: >-
      Confirms that histopathology and immunohistochemistry are the diagnostic
      standard for Kaposi sarcoma.
  - reference: PMID:16188485
    reference_title: "Spindle cells and their role in Kaposi's sarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both hybridization and immuno-histochemistry techniques have demonstrated
      that human herpesvirus 8 also known as Kaposi's sarcoma associated
      herpesvirus was present in spindle cells at all stages of the disease
      (patch, plaque, nodule).
    explanation: >-
      Demonstrates that immunohistochemistry detects HHV-8 in KS spindle cells
      across all histological stages.
- name: HHV-8 Polymerase Chain Reaction (PCR) Detection
  description: >-
    Polymerase chain reaction detection of HHV-8 DNA in lesion tissue or blood
    supports the diagnosis of Kaposi sarcoma and aids in distinguishing complex
    histopathological variants from benign vascular lesions.
  diagnosis_term:
    preferred_term: Polymerase Chain Reaction
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  evidence:
  - reference: DOI:10.3390/ijms262010058
    reference_title: "Recent Advances in the Histopathology, Molecular Biology, and Treatment of Kaposi Sarcoma: A Contemporary Review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This was led by the detection of HHV8 by PCR, and thereafter,
      immunohistochemically. This not only enabled the recognition and diagnosis
      of complex histopathological KS subtypes but also facilitated distinction
      from its mimickers, including acroangiodermatitis and pyogenic granuloma.
    explanation: >-
      Establishes PCR and immunohistochemical detection of HHV-8 as key
      diagnostic modalities for Kaposi sarcoma and differential diagnosis.
treatments:
- name: Antiretroviral Therapy
  description: >-
    For AIDS-associated KS, initiation or optimization of antiretroviral
    therapy (ART) is the most important intervention. Immune reconstitution
    leads to regression in many cases without KS-specific treatment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antiretroviral Therapy
    term:
      id: NCIT:C94631
      label: Antiretroviral Therapy
  target_mechanisms:
  - target: HHV-8 Lytic Reactivation in Endothelial Cells
    treatment_effect: INHIBITS
    description: >-
      Antiretroviral therapy is associated with reduced KS incidence in people
      with HIV. Restored immune control of HHV-8 lytic reactivation is the
      proposed route, but the cited cohort measured incidence only, not viral
      reactivation or T-cell surveillance.
    evidence:
    - reference: DOI:10.1186/s12885-023-11402-3
      reference_title: "Incident Kaposi sarcoma during the expansion of antiretroviral therapy eligibility in Nigeria: a retrospective cohort study"
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The expansion of ART eligibility was associated with a reduced incidence
        of HIV-associated KS among adults initiating HIV care in Jos, Nigeria.
      explanation: >-
        A population-level fall in KS incidence after expanded ART eligibility.
        That ART acts by limiting lytic reactivation is an inference from this
        result, not something the study measured.
  evidence:
  - reference: DOI:10.1186/s12885-023-11402-3
    reference_title: "Incident Kaposi sarcoma during the expansion of antiretroviral therapy eligibility in Nigeria: a retrospective cohort study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The expansion of ART eligibility was associated with a reduced incidence
      of HIV-associated KS among adults initiating HIV care in Jos, Nigeria.
    explanation: >-
      Demonstrates clinical effectiveness of antiretroviral therapy in reducing
      HIV-associated Kaposi sarcoma.
  - reference: DOI:10.3390/cancers16040691
    reference_title: "Kaposi’s Sarcoma: Evaluation of Clinical Features, Treatment Outcomes, and Prognosis in a Single-Center Retrospective Case Series"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surgery, antiretroviral therapy, and chemotherapy were the mostly adopted approaches."
    explanation: >-
      Single-center cohort study confirms antiretroviral therapy as one of the
      primary therapeutic modalities in Kaposi sarcoma management.
- name: Chemotherapy
  description: >-
    For advanced or rapidly progressive disease, liposomal doxorubicin
    or paclitaxel are first-line systemic chemotherapies. Reserved for
    patients with visceral involvement or disease not controlled by ART.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: doxorubicin
      term:
        id: CHEBI:28748
        label: doxorubicin
    - preferred_term: paclitaxel
      term:
        id: CHEBI:45863
        label: paclitaxel
  target_mechanisms:
  - target: Uncontrolled Cell Proliferation
    treatment_effect: INHIBITS
    description: >-
      Cytotoxic systemic chemotherapy with liposomal doxorubicin or paclitaxel
      inhibits spindle-cell tumor proliferation in disseminated or visceral KS.
    evidence:
    - reference: DOI:10.2147/ott.s468787
      reference_title: "Management and Future Therapeutic Perspectives of Classic Kaposi’s Sarcoma: An Evidence-Based Review"
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        To date, the systemic treatment of CKS primarily relies on cytotoxic
        chemotherapy, mainly anthracyclines, vinca alkaloids, and paclitaxel,
        resulting in 70–90% of the transient responses.
      explanation: >-
        Tumour response rates of 70-90% to cytotoxic chemotherapy (anthracyclines,
        vinca alkaloids, paclitaxel) in classic KS. A response is read as
        inhibition of tumour-cell proliferation only by inference, and the
        figure is for the classic form, so the support is indirect.
  evidence:
  - reference: DOI:10.3390/cancers16040691
    reference_title: "Kaposi’s Sarcoma: Evaluation of Clinical Features, Treatment Outcomes, and Prognosis in a Single-Center Retrospective Case Series"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surgery, antiretroviral therapy, and chemotherapy were the mostly adopted approaches."
    explanation: >-
      Documents chemotherapy among the primary adopted treatment modalities in
      clinical practice.
- name: Local Therapy
  description: >-
    Localized lesions may be treated with radiation, intralesional
    chemotherapy, cryotherapy, or surgical excision for palliation
    or cosmesis.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: radiation therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  evidence:
  - reference: DOI:10.3390/cancers16040691
    reference_title: "Kaposi’s Sarcoma: Evaluation of Clinical Features, Treatment Outcomes, and Prognosis in a Single-Center Retrospective Case Series"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The treatment is heterogeneous and includes several local and systemic therapeutic strategies."
    explanation: >-
      Confirms the use of local therapeutic strategies alongside systemic
      treatments in Kaposi sarcoma.
  - reference: DOI:10.2147/ott.s468787
    reference_title: "Management and Future Therapeutic Perspectives of Classic Kaposi’s Sarcoma: An Evidence-Based Review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Local therapy mainly consists of intralesional chemotherapy
      administration, radiotherapy, and electrochemotherapy.
    explanation: >-
      Names radiotherapy and intralesional chemotherapy as the main local
      therapies for classic KS.
- name: Reduction of Immunosuppression
  description: >-
    For iatrogenic KS in transplant recipients, reduction or modification
    of immunosuppressive therapy may lead to regression. Switching to
    sirolimus (mTOR inhibitor) may have anti-tumor effects in addition
    to immunosuppression.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Immunosuppression-Mediated Loss of CD8+ T-Cell Control of HHV-8
    treatment_effect: RESTORES
    description: >-
      Withdrawing or tapering the immunosuppressive agents restores the cytotoxic
      lymphocyte control this node loses, which is why reduction alone can produce
      remission without cytotoxic therapy.
    evidence:
    - reference: PMID:42549899
      reference_title: "HHV-8 Infection in Solid-Organ Transplant-Pathogenesis, Epidemiology, Clinical Manifestations and Management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "withdrawal or reduction in immunosuppression alone results in complete remission in 47.8% of patients with PT‐KS"
      explanation: Quantifies the response to reversing the mechanism this edge targets, with no other modality involved.
  evidence:
  - reference: DOI:10.7759/cureus.52527
    reference_title: "Evaluating Kaposi Sarcoma in Kidney Transplant Patients: A Systematic Review and Meta-Analysis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Furthermore, reduction or withdrawal of immunosuppression alone resulted
      in 47.8% KS complete remissions.
    explanation: >-
      Meta-analysis of kidney transplant recipients with Kaposi sarcoma
      demonstrates a 47.8% complete remission rate with reduction or withdrawal
      of immunosuppression alone.

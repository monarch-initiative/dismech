pathophysiology:
- name: HHV-8 Latent Infection of Endothelial Cells
  description: >-
    HHV-8 infects endothelial cells and establishes latent infection with expression
    of latency-associated nuclear antigen (LANA), vFLIP, and vCyclin. LANA maintains
    the viral episome and inhibits p53 and Rb tumor suppressor function. Latently
    infected cells undergo spindle cell transformation characteristic of KS.
  evidence:
  - reference: PMID:7489408
    reference_title: "Kaposi's sarcoma-associated herpesvirus infects endothelial and spindle cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KSHV/HHV-8 is present in the flat endothelial cells lining vascular spaces of KS lesions as well as in typical KS spindle cells."
    explanation: "Abstract reports HHV-8 presence in endothelial and spindle cells in KS lesions."
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: viral transcription
    term:
      id: GO:0019083
      label: viral transcription
  downstream:
  - target: vFLIP-Mediated NF-kappaB Activation
    description: Constitutive vFLIP expression activates survival signaling
  - target: vCyclin-Mediated Cell Cycle Dysregulation
    description: Viral cyclin drives cell cycle progression
  - target: vGPCR-Mediated Angiogenic Signaling
    description: Lytic gene expression promotes angiogenesis
  - target: HHV-8 Lytic Reactivation in Endothelial Cells
    description: The latently infected endothelial reservoir is the substrate that re-enters the lytic cycle once immune control is lost
- name: Immunosuppression-Mediated Loss of CD8+ T-Cell Control of HHV-8
  description: >-
    In solid-organ transplant recipients, chronic immunosuppressive therapy impairs
    the CD8+ T-cell and NK-cell surveillance that maintains HHV-8 latency in the
    immunocompetent host. The cited review names calcineurin inhibitors,
    corticosteroids and T-cell-depleting agents as the agent classes that impair
    that control.
  notes: >-
    mTOR inhibitors are deliberately absent from the agent list. The same review
    describes them as exerting antiproliferative and antiangiogenic effects that
    may counter these mechanisms, and recommends conversion to sirolimus or
    everolimus as treatment for post-transplant Kaposi sarcoma - so they belong
    with this entry's Reduction of Immunosuppression treatment, not with the
    agents that drive reactivation.
  evidence:
  - reference: PMID:42549899
    reference_title: "HHV-8 Infection in Solid-Organ Transplant-Pathogenesis, Epidemiology, Clinical Manifestations and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "In immunocompetent hosts, CD8+ T‐cells and NK cells maintain viral latency, but chronic immunosuppression particularly with calcineurin inhibitors, corticosteroids, or T‐cell–depleting agents impairs this control, allowing viral reactivation or donor‐derived primary infection"
    explanation: Names both the effector populations that maintain latency and the three agent classes whose use impairs that control, which is what this node asserts.
  cell_types:
  - preferred_term: CD8-positive T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  biological_processes:
  - preferred_term: negative regulation of viral genome replication
    modifier: DECREASED
    term:
      id: GO:0045071
      label: negative regulation of viral genome replication
  downstream:
  - target: HHV-8 Lytic Reactivation in Endothelial Cells
    causal_link_type: DIRECT
    description: Loss of cytotoxic lymphocyte surveillance removes the constraint that holds the virus in latency, permitting re-entry into the lytic cycle.
    evidence:
    - reference: PMID:42549899
      reference_title: "HHV-8 Infection in Solid-Organ Transplant-Pathogenesis, Epidemiology, Clinical Manifestations and Management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Loss of immune control under maintenance immunosuppression or antirejection therapy leads to viral activation of latent HHV‐8."
      explanation: States the causal step this edge draws - loss of immune control under maintenance immunosuppression activating the latent virus.
- name: HHV-8 Lytic Reactivation in Endothelial Cells
  description: >-
    With immune control lost, HHV-8 in the infected endothelial lineage switches
    from the latent programme to lytic replication. Lytic gene products, vGPCR and
    vIL-6 among them, drive cytokine release and angiogenic signalling, which is
    the route by which reactivation accelerates Kaposi sarcoma progression in
    transplant recipients.
  notes: >-
    No downstream edge is drawn to vFLIP-Mediated NF-kappaB Activation. The cited
    review classifies vFLIP with LANA-1 and vCyclin as a latent protein and vGPCR
    with vIL-6 as lytic, and this entry's own HHV-8 Latent Infection of Endothelial
    Cells node expresses vFLIP latently, so a claim that lytic reactivation raises
    vFLIP abundance would contradict both.
  evidence:
  - reference: PMID:42549899
    reference_title: "HHV-8 Infection in Solid-Organ Transplant-Pathogenesis, Epidemiology, Clinical Manifestations and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The virus infects endothelial, monocyte and B‐cell lineages, alternating between latency and lytic replication"
    explanation: Establishes that the endothelial lineage this node is bound to is one of the lineages that alternates between latency and lytic replication.
  - reference: PMID:42549899
    reference_title: "HHV-8 Infection in Solid-Organ Transplant-Pathogenesis, Epidemiology, Clinical Manifestations and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Latent proteins (LANA‐1, vCyclin, vFLIP) promote cell survival, whereas lytic proteins (vIL‐6, vGPCR) drive cytokine release and angiogenesis through IL‐6, IL‐10, VEGF, and PDGF"
    explanation: Identifies vGPCR as a lytic rather than latent product and names the angiogenic and cytokine output that the downstream edge carries.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: release from viral latency
    modifier: INCREASED
    term:
      id: GO:0019046
      label: release from viral latency
  downstream:
  - target: vGPCR-Mediated Angiogenic Signaling
    causal_link_type: DIRECT
    description: Lytic replication raises vGPCR expression, amplifying the angiogenic signalling arm of the lesion.
- name: vFLIP-Mediated NF-kappaB Activation
  description: >-
    Viral FLICE inhibitory protein (vFLIP) constitutively activates NF-kappaB
    signaling by interacting with IKK complex. This promotes cell survival,
    inflammation, and cytokine production. vFLIP also inhibits caspase-8-mediated
    apoptosis, providing resistance to death receptor-induced cell death.
  biological_processes:
  - preferred_term: positive regulation of NF-kappaB transcription factor activity
    modifier: INCREASED
    term:
      id: GO:0043123
      label: positive regulation of canonical NF-kappaB signal transduction
  downstream:
  - target: Apoptosis Resistance and Cell Survival
    description: NF-kappaB activates anti-apoptotic genes
- name: vCyclin-Mediated Cell Cycle Dysregulation
  description: >-
    Viral cyclin (vCyclin) forms active complexes with CDK6 that are resistant
    to inhibition by p16INK4A, p21, and p27. This drives cells through G1/S
    checkpoint regardless of normal growth regulatory signals, contributing
    to uncontrolled proliferation.
  biological_processes:
  - preferred_term: G1/S transition of mitotic cell cycle
    modifier: ABNORMAL
    term:
      id: GO:0000082
      label: G1/S transition of mitotic cell cycle
  downstream:
  - target: Uncontrolled Cell Proliferation
    description: Cell cycle checkpoint bypass leads to proliferation
- name: vGPCR-Mediated Angiogenic Signaling
  description: >-
    The viral G protein-coupled receptor (vGPCR) is expressed during lytic
    reactivation and activates multiple signaling pathways in a ligand-independent
    manner, including VEGF production and MAPK activation. vGPCR is highly
    oncogenic and promotes the angiogenic, inflammatory microenvironment
    characteristic of KS lesions.
  biological_processes:
  - preferred_term: signal transduction
    modifier: INCREASED
    term:
      id: GO:0007165
      label: signal transduction
  downstream:
  - target: Angiogenic Proliferation
    description: VEGF and inflammatory cytokines drive vascular proliferation
- name: Apoptosis Resistance and Cell Survival
  description: >-
    Multiple viral genes cooperate to prevent apoptosis: vFLIP inhibits
    caspase-8 and activates NF-kappaB; LANA inhibits p53; vBCL-2 mimics
    cellular BCL-2. This multi-layered apoptosis resistance enables survival
    and accumulation of infected cells.
  biological_processes:
  - preferred_term: apoptotic process
    modifier: DECREASED
    term:
      id: GO:0006915
      label: apoptotic process
- name: Uncontrolled Cell Proliferation
  description: >-
    Combined effects of vCyclin, LANA-mediated Rb inhibition, and growth
    factor signaling drive spindle cell proliferation, forming the
    characteristic KS lesions.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:16188485
    reference_title: "Spindle cells and their role in Kaposi's sarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite some clinical and epidemiological differences, the four Kaposi's
      sarcoma forms (classic, endemic, post-transplant and epidemic) display
      very similar histopathological features, with the proliferation of spindle
      cells (considered as the Kaposi's sarcoma tumor cells) associated with
      inflammation and neo-angiogenesis.
    explanation: >-
      Confirms that spindle cell proliferation is the core cellular tumor
      process across all four clinical forms of Kaposi sarcoma.
  downstream:
  - target: Cutaneous Lesions
    description: >-
      Proliferation of HHV-8-infected endothelial spindle cells in the dermis
      forms multifocal cutaneous macules, plaques, and nodules.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30205412
      reference_title: "Epidemiological and Clinical Patterns of Kaposi Sarcoma: A 16-Year Retrospective Cross-Sectional Study from Yaoundé, Cameroon."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Cutaneous lesions occurred more often (81.6%), mainly located on the
        lower limbs (47.7%); mucous lesions were found in 15.8% of the patients,
        while 8 patients (3.0%) had associated visceral lesions.
      explanation: >-
        Establishes cutaneous lesions as the primary clinical manifestation of
        Kaposi sarcoma tumor growth.
  - target: Lymphadenopathy
    description: >-
      Spindle cell tumor proliferation within lymph nodes causes regional or
      generalized lymphadenopathy.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:3029191
      reference_title: "Kaposi's sarcoma and acquired immunodeficiency syndrome. Postmortem findings in twenty-four cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The most common sites for visceral involvement with Kaposi's sarcoma
        were as follows: lung (37%), gastrointestinal tract (50%), and lymph
        nodes (50%).
      explanation: >-
        Demonstrates frequent lymph node involvement by Kaposi sarcoma tumor
        lesions.
  - target: GI Involvement
    description: >-
      Disseminated spindle cell tumor growth in the upper and lower
      gastrointestinal tract mucosa and submucosa causes gastrointestinal KS
      lesions.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:1947766
      reference_title: "Kaposi's sarcoma and AIDS: frequency of gastrointestinal involvement and its effect on survival. A prospective study in a heterogeneous population."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Gastrointestinal lesions were found in 17 cases (51%): 5 patients (15%)
        had both upper and lower GI tract involvement, 8 patients (24%) had only
        gastroduodenal lesions, and 4 (12%) only lower tract disease.
      explanation: >-
        Documents upper and lower gastrointestinal tract Kaposi sarcoma lesions
        in 51% of prospectively evaluated patients.
  - target: Pulmonary Involvement
    description: >-
      Visceral proliferation of Kaposi sarcoma spindle cells in the lung
      parenchyma and bronchial tree produces pulmonary KS lesions.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:3029191
      reference_title: "Kaposi's sarcoma and acquired immunodeficiency syndrome. Postmortem findings in twenty-four cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The most common sites for visceral involvement with Kaposi's sarcoma
        were as follows: lung (37%), gastrointestinal tract (50%), and lymph
        nodes (50%).
      explanation: >-
        Documents pulmonary visceral involvement by Kaposi sarcoma in 37% of
        cases at autopsy.
- name: Angiogenic Proliferation
  description: >-
    KS lesions are highly vascular due to vGPCR-induced VEGF and inflammatory
    cytokine production. The aberrant angiogenesis creates the characteristic
    red-purple appearance and contributes to edema and hemorrhage.
  evidence:
  - reference: PMID:16188485
    reference_title: "Spindle cells and their role in Kaposi's sarcoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the proliferation of spindle cells (considered as the Kaposi's sarcoma tumor cells) associated with inflammation and neo-angiogenesis"
    explanation: Histopathology review confirms spindle cell proliferation is intrinsically associated with neo-angiogenesis in KS lesions, supporting the angiogenic phenotype as a defining feature of the tumor.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: angiogenesis
    modifier: INCREASED
    term:
      id: GO:0001525
      label: angiogenesis
  downstream:
  - target: Cutaneous Lesions
    description: >-
      Neo-angiogenesis and vascular slit formation give cutaneous Kaposi sarcoma
      lesions their characteristic violaceous vascular appearance.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16188485
      reference_title: "Spindle cells and their role in Kaposi's sarcoma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the proliferation of spindle cells (considered as the Kaposi's sarcoma
        tumor cells) associated with inflammation and neo-angiogenesis
      explanation: >-
        Links neo-angiogenesis and spindle cell proliferation directly to KS
        lesion formation.
  - target: Lymphedema
    description: >-
      Aberrant lymphatic endothelial proliferation and vascular permeability
      impair lymphatic drainage, producing tumor-associated lymphedema.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30205412
      reference_title: "Epidemiological and Clinical Patterns of Kaposi Sarcoma: A 16-Year Retrospective Cross-Sectional Study from Yaoundé, Cameroon."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: >-
        The lesions predominantly were lymphedemas (28.6%) and papulonodules
        (21.1%).
      explanation: >-
        Documents lymphedema as a major clinical presentation of Kaposi sarcoma
        lesions. The source reports frequency only, so the lymphatic-obstruction
        mechanism in the edge description is inferred.

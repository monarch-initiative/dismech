prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  notes: >-
    A 2025 case report counted 14 previously published patients from seven
    families and added one, and a 2023 review counted 11 previously published
    patients before adding a mother and two sons. No population rate is
    available.
  evidence:
  - reference: PMID:40656194
    reference_title: 'Infantile epileptic spasms syndrome as a new phenotype in TOP2B deficiency caused by a de novo variant: a case report and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: To date, only 14 patients with Hoffman syndrome, BILU, and AMS from seven families have been reported in PubMed
    explanation: Literature count of published patients across the Hoffman, BILU and ablepharon-macrostomia-like presentations of the disease.
genetic:
- name: TOP2B
  gene_term:
    preferred_term: TOP2B
    term:
      id: hgnc:11990
      label: TOP2B
  association: Causative
  variant_origin: GERMLINE
  notes: >-
    relationship_type is deliberately left unset. TOP2B is the gene that is known to
    cause this disease, but the schema defines CAUSATIVE as a ClinGen Definitive
    or Strong tier, and ClinGen rates this pair Moderate (Antibody Deficiencies
    GCEP, 19 October 2021, SOP8); that tier is recorded in gene_disease_validity.
    UNKNOWN would wrongly say the pair is unclassified. Reported variants are
    heterozygous and lie in or next to the TOPRIM domain (S483L, A485P, EE587E,
    G633S, Y634C). A different allelic disorder, a neurodevelopmental disease
    without immunodeficiency, is caused by de novo variants in the N-terminal
    ATPase domain (H58Y, H63Y) and is not part of this entry.
  gene_disease_validity:
  - validity_classification: MODERATE
    classified_by: CLINGEN
    external_id: CGGV:assertion_677a64c1-b005-44f6-9846-a7f371222667-2021-10-19T125736.122Z
    evidence:
    - reference: CGGV:assertion_677a64c1-b005-44f6-9846-a7f371222667-2021-10-19T125736.122Z
      reference_title: TOP2B / B-cell immunodeficiency, distal limb anomalies, and urogenital malformations (Moderate)
      supports: SUPPORT
      evidence_source: OTHER
      snippet: TOP2B | HGNC:11990 | B-cell immunodeficiency, distal limb anomalies, and urogenital malformations | MONDO:0012243 | AD | Moderate
      explanation: The ClinGen Antibody Deficiencies GCEP classifies the TOP2B relationship with this exact MONDO disease as Moderate, autosomal dominant.
  evidence:
  - reference: PMID:31409799
    reference_title: Mutations in topoisomerase IIβ result in a B cell immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: In three families with Hoffman syndrome 9,10, we identi ﬁed three heterozygous mutations affecting the TOPRIM, or DNA gating, domain of the type II topoisomerase TOP2B.
    explanation: Heterozygous TOPRIM-domain TOP2B variants in three Hoffman syndrome families establish the gene for this disease.
  - reference: PMID:32128574
    reference_title: Topoisomerase 2β mutation impairs early B-cell development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Next, we used Sanger sequencing and found that exactly the same mutation was present in patients of family B (Figure 1B).
    explanation: The same A485P variant is present in both unrelated BILU families, linking the BILU presentation to TOP2B.
  - reference: PMID:32128574
    reference_title: Topoisomerase 2β mutation impairs early B-cell development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Our results indicate that BILU and Hoffman syndromes are manifestations of the same disease, TOP2B deficiency.
    explanation: Establishes that the separately described BILU and Hoffman syndromes are one TOP2B disease, the scope of this entry.
pathophysiology:
- name: Heterozygous TOPRIM-Domain TOP2B Variant
  description: >-
    The initiating lesion is a heterozygous germline variant in or next to the
    TOPRIM catalytic domain of TOP2B. Reported changes are missense substitutions
    and one in-frame deletion at conserved residues.
  biological_scale: MOLECULAR
  node_class: PATHOGENIC_SEQUENCE_VARIANT
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: DOMINANT_NEGATIVE
    zygosity: HETEROZYGOUS
  genes:
  - preferred_term: TOP2B
    term:
      id: hgnc:11990
      label: TOP2B
  evidence:
  - reference: PMID:31409799
    reference_title: Mutations in topoisomerase IIβ result in a B cell immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: All of the mutations affected the TOPRIM domain of TOP2B
    explanation: Locates the three originally reported patient variants in the TOPRIM domain.
  - reference: PMID:32128574
    reference_title: Topoisomerase 2β mutation impairs early B-cell development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Its substitution with proline is predicted to destabilize an α helix within the TOPRIM domain (Figure 1D, E) that is essential for the catalytic activity of the TOP2B protein
    explanation: The BILU A485P substitution sits in the same catalytic domain and is predicted to destabilize it.
  downstream:
  - target: Loss of Type II Topoisomerase Activity
    causal_link_type: DIRECT
    description: >-
      The variant enzyme itself cannot relax or decatenate DNA, and in the
      heterozygous state it also lowers the activity of the wild-type enzymes.
    evidence:
    - reference: PMID:32128574
      reference_title: Topoisomerase 2β mutation impairs early B-cell development.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: We found that enzymatic activities of TOP2BA485P were reduced more than 10 fold
      explanation: Purified recombinant mutant protein has more than tenfold lower relaxation and decatenation activity than wild type.
    - reference: PMID:31409799
      reference_title: Mutations in topoisomerase IIβ result in a B cell immunodeficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: Taken together, these results indicate that each of our patient mutations disrupt topoisomerase II function.
      explanation: Yeast complementation and sporulation assays show each patient substitution inactivates topoisomerase II; the model is the yeast ortholog rather than the human enzyme in B cells.
- name: Loss of Type II Topoisomerase Activity
  description: >-
    Cells carrying one variant allele have reduced capacity to relax
    transcription-generated supercoils and to decatenate DNA, below the level
    expected from the loss of one allele alone. This is a dominant-negative
    effect on wild-type TOP2B and TOP2A rather than haploinsufficiency: patient
    T-cell blasts have reduced decatenation activity, and carriers of a
    heterozygous loss-of-function TOP2B variant in population cohorts are not
    affected.
  biological_scale: MOLECULAR
  node_class: CATALYTIC_ACTIVITY
  molecular_functions:
  - preferred_term: DNA topoisomerase IIbeta activity
    modifier: DECREASED
    term:
      id: GO:0003918
      label: DNA topoisomerase type II (double strand cut, ATP-hydrolyzing) activity
  biological_processes:

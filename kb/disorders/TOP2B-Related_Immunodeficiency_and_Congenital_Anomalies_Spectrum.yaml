name: TOP2B-Related Immunodeficiency and Congenital Anomalies Spectrum
creation_date: '2026-11-11T22:21:31Z'
category: Mendelian
synonyms:
- Hoffman syndrome
- BILU syndrome
- B-cell immunodeficiency, distal limb anomalies, and urogenital malformations
- B-cell immunodeficiency-limb anomaly-urogenital malformation syndrome
- TICAS
- TOP2B deficiency
description: >-
  Autosomal dominant syndromic inborn error of immunity caused by heterozygous
  TOP2B variants in or next to the TOPRIM catalytic domain of topoisomerase
  IIbeta. The variant enzyme loses decatenation and relaxation activity and
  interferes with the wild-type type II topoisomerases, and B-cell development
  fails at its earliest stage. The result is absent or near-absent circulating B
  cells, hypogammaglobulinemia or agammaglobulinemia, poor vaccine responses and
  recurrent infections with encapsulated bacteria from childhood, with T cells
  preserved. NK-cell numbers and cytotoxicity can also be reduced. Congenital
  anomalies accompany the immunodeficiency with variable expression: distal limb
  anomalies such as triphalangeal thumbs, toe syndactyly and short first
  metatarsals, facial dysmorphism, urogenital malformations, and in some patients
  microcephaly, growth retardation and developmental delay. Hoffman syndrome and
  BILU syndrome were first described as separate conditions and are the same
  disease. Immunoglobulin replacement is used to prevent infections.

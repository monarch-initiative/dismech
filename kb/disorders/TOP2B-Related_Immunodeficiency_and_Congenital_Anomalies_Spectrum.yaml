    quote_role: REVIEW_SYNTHESIS
    snippet: Autosomal dominant mutations in TOP2B, a gene coding for a type II topoisomerase, has been reported in patients with recurrent infections with encapsulated organisms, absent B cells, and agammaglobulinemia, in addition to facial dysmorphism and limb abnormalities

      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: Together these results suggest that the defects in antigen-speciﬁc responses in the absence of Top2b are due to both reduced numbers of B cells as well as defects in the secretion of antibody or in the generation of mature, activated B cells.
      explanation: In mice the antibody failure follows both from the missing B cells and from a defect in the survivors; the inference to patients is indirect.
- name: Absent Peripheral B Cells and Failure of Antibody Production
  description: >-
    Patients have absent or very low circulating CD19-positive B cells with
    severely reduced immunoglobulins and absent protective titres after
    vaccination, while T-cell numbers and mitogen responses are normal. Residual
    immunoglobulin in some patients indicates a small undetected B-cell output
    rather than its complete absence. Severity varies across the spectrum: one
    reported adult carried an attenuated B-cell deficiency.
  biological_scale: ORGANISM
  node_class: IMMUNE_DEFICIENCY

      conditional model and in the heterozygous knockin.
    limitations: >-
      The conditional deletion is a null allele rather than the patient variant,
      and the stage affected differs between the two Cre lines. The patient
      marrow block is complete from the common lymphoid progenitor onwards,
      which is not what either mouse shows.

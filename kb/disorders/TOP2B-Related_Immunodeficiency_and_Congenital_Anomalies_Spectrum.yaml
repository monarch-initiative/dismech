- name: Reduced NK-Cell Development and Cytotoxicity
  description: >-
    Beyond the B-cell defect, NK-cell counts were below the reference range in
    three of the four originally reported patients, and a knockin mouse plus
    patient-derived iPSC study found fewer mature NK cells with reduced killing.

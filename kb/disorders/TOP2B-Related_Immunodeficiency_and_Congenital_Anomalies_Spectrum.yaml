phenotypes:
- name: Absent circulating B cells
  category: Immunologic
  description: >-
    CD19-positive B cells are absent or near-absent in peripheral blood. One
    reported adult carried only 48 cells per microlitre and one child was at
    0.15 percent of lymphocytes, so the finding is better read as profound
    reduction than as absolute absence.
  phenotype_term:
    preferred_term: Absent circulating B cells
    term:
      id: HP:0030252
      label: Absent circulating B cells
  frequency: VERY_FREQUENT
  sequelae:
  - target: Recurrent sinopulmonary infections
    causal_link_type: DIRECT
    description: Loss of antibody-mediated defence of the airway mucosa.
  - target: Bacteremia
    causal_link_type: DIRECT
    description: Loss of opsonising antibody permits invasive bacterial disease.
  evidence:
  - reference: PMID:31409799
    reference_title: Mutations in topoisomerase IIβ result in a B cell immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Affected patients have a normal T-cell compartment, but lack B cells in the peripheral blood
    explanation: States the defining blood finding and its restriction to the B lineage.
  - reference: PMID:40656194
    reference_title: 'Infantile epileptic spasms syndrome as a new phenotype in TOP2B deficiency caused by a de novo variant: a case report and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: CD19+ B cell | CD19+ | Lymphocyte | 0.15 | 16.57–27.65
    explanation: >-
      An immunophenotyping row from the 2025 case, where CD19-positive cells are
      0.15 percent of lymphocytes against a reference range of 16.57 to 27.65.
- name: Agammaglobulinemia
  category: Immunologic
  description: >-
    Serum immunoglobulins are severely reduced across isotypes. Some patients
    retain small detectable amounts, which is why hypogammaglobulinemia and
    agammaglobulinemia are both used in reports of this disease.

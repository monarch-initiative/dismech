    reference_title: Topoisomerase 2β mutation impairs early B-cell development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: The early block in B cell development distinguishes patients with TOP2B deficiency from most other B-cell immunodeficiencies that either impair later stages of B cell differentiation resulting in the accumulation of CD19+ pro-B cells (e.g. BTK deficiency)
    explanation: States the marrow finding that separates this disease from BTK deficiency.
  - reference: PMID:34241796
    reference_title: 'Agammaglobulinemia: from X-linked to Autosomal Forms of Disease.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: While the most common cause of congenital agammaglobulinemia is X-linked agammaglobulinemia (XLA), accounting for approximately 85% of cases, other genetic forms of agammaglobulinemia have been identified.
    explanation: Gives the diagnostic share that makes XLA the first alternative to exclude.
- name: Autosomal agammaglobulinemia
  description: >-
    The pre-B-cell-receptor and signalling defects (IGHM, CD79A, CD79B, BLNK,
    IGLL1, PIK3R1, TCF3, SLC39A7) share the absent B cells and
    agammaglobulinemia without the limb and urogenital malformations. TOP2B
    disease is itself counted in the IUIS agammaglobulinemia group, so the
    separation is molecular and syndromic rather than immunological.
  disease_term:
    preferred_term: autosomal agammaglobulinemia
    term:
      id: MONDO:0011096
      label: autosomal agammaglobulinemia
  evidence:
  - reference: PMID:32128574
    reference_title: Topoisomerase 2β mutation impairs early B-cell development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Rather, it is reminiscent of the early block of B cell differentiation seen in patients with dominant TCF3 mutations and recessive PIK3R1 mutations
    explanation: Names the two autosomal entities whose marrow block most resembles this one, which is where the immunological phenotype alone does not discriminate.
- name: Ablepharon-macrostomia syndrome
  description: >-
    One of the three originally reported TOP2B patients had been diagnosed as an
    atypical ablepharon-macrostomia syndrome before the humoral deficiency was
    recognised, so the two overlap clinically. Ablepharon-macrostomia syndrome
    proper is a TWIST2 disease without immunodeficiency.
  disease_term:
    preferred_term: ablepharon macrostomia syndrome
    term:
      id: MONDO:0008693
      label: ablepharon macrostomia syndrome
  evidence:
  - reference: PMID:31409799
    reference_title: Mutations in topoisomerase IIβ result in a B cell immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: A third patient initially being reported as having an atypical presentation of Ablepharon-Macrostomia syndrome14, was later found to have humoral immunode ﬁciency.
    explanation: Records the misdiagnosis that makes this syndrome a genuine competitor in a patient with facial anomalies.
- name: TOP2B-related neurodevelopmental disorder
  description: >-
    A separate allelic disease. De novo variants in the N-terminal ATPase domain
    and the C-terminal region, H58Y and H63Y among them, cause severe
    neurodevelopmental disease, epileptic encephalopathy and brain atrophy
    without the B-cell deficiency, and the 2026 report of the third H63Y patient
    proposes a distinct disease name for it. Domain position, not the gene, is
    what separates the two: the immunodeficiency variants sit in the central
    catalytic core. It is not curated here.
  evidence:
  - reference: PMID:42963833
    reference_title: Recurrent Neurodevelopmental Disorder Associated With a Dominant-Negative TOP2B H63Y Variant.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: The phenotype associated with the H63Y variant differs greatly from the TOP2B-related Immunodeficiency and Congenital Anomalies Spectrum (TICAS) syndrome that has been reported with heterozygous loss-of-function variants affecting the TOPRIM domain and adjacent regions of TOP2B.
    explanation: States that the ATPase-domain neurodevelopmental phenotype is distinct from the disease this entry covers.
  - reference: PMID:40656194
    reference_title: 'Infantile epileptic spasms syndrome as a new phenotype in TOP2B deficiency caused by a de novo variant: a case report and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Variants in the N-terminal ATPase domain and the C-terminal region are associated with developmental disorders, whereas variants in the central catalytic core domain are related to B-cell deficiency.
    explanation: Gives the domain rule that distinguishes the two allelic diseases, which is how a new variant is assigned.
animal_models:
- name: Top2b B-lineage conditional knockout and EE587E knockin mouse
  species: Mouse
  genotype: B-lineage conditional Top2b deletion (mb1-Cre, cd19-Cre) and heterozygous Top2b EE587E knockin
  category: Genetic
  publication: PMID:31409799
  description: >-
    Homozygous null mice die perinatally, so the B-cell work used conditional
    deletion plus a constitutive heterozygous knockin of the patient-equivalent
    in-frame deletion. The heterozygous knockin mirrors the patient genotype and
    has fewer B cells than a simple heterozygous null, which is the in vivo
    evidence for the dominant-negative mechanism.
  notes: >-
    Neither model reproduces the limb, facial or urogenital malformations, and
    the human marrow stage was not measured in the three founding families, so
    the stage correspondence is inferred from the mouse rather than shown in
    patients.

inheritance:
- name: Autosomal dominant inheritance
  description: >-
    Heterozygous TOP2B variants segregate dominantly in multigenerational
    families, and several arose de novo in a first affected family member who
    then transmitted them.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:31409799
    reference_title: Mutations in topoisomerase IIβ result in a B cell immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Sequencing of patients with B cell-restricted immunodeficiency reveals autosomal dominant mutations in TOP2B.
    explanation: Whole-genome sequencing of affected and unaffected members of three families identifies heterozygous TOP2B variants that follow a dominant pattern.
  - reference: PMID:15521984
    reference_title: Autosomal dominant B-cell immunodeficiency, distal limb anomalies and urogenital malformations (BILU syndrome) - report of a second family.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Here, we report a second family with similar features, which also shows autosomal dominant inheritance.
    explanation: A second BILU family, reported before the gene was known, also shows dominant transmission of the syndrome.
  - reference: PMID:32128574
    reference_title: Topoisomerase 2β mutation impairs early B-cell development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: identified the only mutation in the coding part of the genome that was absent in healthy parents I:3 and I:4, appeared de novo in their affected daughter II:4 and then was transmitted to her affected daughter III:1.
    explanation: In the original BILU family the A485P variant arose de novo and was then transmitted to the next affected generation, which is dominant inheritance with a de novo founder.

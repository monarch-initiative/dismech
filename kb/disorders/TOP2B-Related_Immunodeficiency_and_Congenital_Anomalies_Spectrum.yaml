diagnosis:
- name: TOP2B Sequencing
  description: >-
    The diagnosis is molecular. The founding families were solved by whole-genome
    sequencing and one later case by trio whole-exome sequencing; a third patient
    was found on reanalysis of clinical exome data after the humoral deficiency
    was recognised. Domain position matters when interpreting a new variant,
    because ATPase-domain variants belong to the separate neurodevelopmental
    disorder.
  diagnosis_term:
    preferred_term: TOP2B sequencing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:31409799
    reference_title: Mutations in topoisomerase IIβ result in a B cell immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: We performed whole genome sequencing of affected and nonaffected persons in these families (Fig. 1a).
    explanation: The method that established the diagnosis in the founding families.
  - reference: PMID:40656194
    reference_title: 'Infantile epileptic spasms syndrome as a new phenotype in TOP2B deficiency caused by a de novo variant: a case report and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Variants in the N-terminal ATPase domain and the C-terminal region are associated with developmental disorders, whereas variants in the central catalytic core domain are related to B-cell deficiency.
    explanation: The interpretation rule a new variant has to be read against, since the two TOP2B diseases are told apart by domain.
- name: Lymphocyte Immunophenotyping
  description: >-
    Flow cytometry of blood shows absent or near-absent CD19-positive B cells
    with normal T-cell subsets, and may show a low NK count. A marrow aspirate
    is not usually clinically indicated, and only one has been reported; it
    showed no CD19-positive cells at any stage.
  diagnosis_term:
    preferred_term: lymphocyte immunophenotyping
    term:
      id: NCIT:C113003
      label: Immunological Flow Cytometry
  evidence:
  - reference: PMID:40656194
    reference_title: 'Infantile epileptic spasms syndrome as a new phenotype in TOP2B deficiency caused by a de novo variant: a case report and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: CD19+ B cell | CD19+ | Lymphocyte | 0.15 | 16.57–27.65
    explanation: The immunophenotyping result in a reported patient, showing what the test finds.
  - reference: PMID:31409799
    reference_title: Mutations in topoisomerase IIβ result in a B cell immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: A bone marrow biopsy has not been clini- cally indicated for patients, leaving open the question of where in B-cell development the failure occurs in humans
    explanation: States that marrow sampling is not routine, which is why the peripheral immunophenotype is the practical test.

experimental_models:
- name: Yeast complementation and decatenation assays of patient alleles
  experimental_model_type: OTHER
  cell_source: Saccharomyces cerevisiae strains and nuclear fractions extracted from them
  publication: PMID:31409799
  description: >-
    The yeast equivalents of the patient substitutions were tested for their
    ability to complement a temperature-sensitive top2 allele and to support a
    top2 null, and nuclear fractions from heterozygous strains were assayed for
    decatenation. These are the experiments that separate loss of activity from
    dominant interference.
  modeled_mechanisms:
  - target: Loss of Type II Topoisomerase Activity
    relationship: MEASURES
    fidelity: LOW
    model_scale: MOLECULAR
    description: >-
      Fractions carrying one wild-type and one mutant copy decatenate less well
      than fractions with a single wild-type copy, which is dominant
      interference rather than reduced dosage.
    limitations: >-
      Yeast has one type II topoisomerase where humans have two, and the assay
      is on extracted nuclear fractions, so neither the human enzyme nor the
      B-cell context is present.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The protein assayed is the S. cerevisiae Top2 carrying the equivalent
        residue change, or a yeast-human chimera, not human TOP2B. Yeast also
        has no TOP2A paralogue for the mutant to interfere with, which is part
        of the human mechanism.
    evidence:
    - reference: PMID:31409799
      reference_title: Mutations in topoisomerase IIβ result in a B cell immunodeficiency.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: Thus, the disease-associated versions of TOP2 have a partial dominant negative phenotype in S. cerevisiae based on growth and/or decatenation assays.
      explanation: The conclusion of the yeast assays, which is the dominant-negative claim this node rests on.
    readouts:
    - name: DNA decatenation activity of nuclear fractions
      target: Loss of Type II Topoisomerase Activity
      direction: DECREASED
      interpretation: Mutant-plus-wild-type fractions decatenate less than single-wild-type-copy fractions.
      evidence:
      - reference: PMID:31409799
        reference_title: Mutations in topoisomerase IIβ result in a B cell immunodeficiency.
        supports: SUPPORT
        evidence_source: IN_VITRO
        directness: DIRECT
        quote_role: PRIMARY_RESULT
        snippet: fractions from the strain with only one copy of wild-type TOP2 decatenated kine- toplast DNA more effectively than fractions from strains with one wild-type and one mutant copy of TOP2 (Fig. 2d, Supplementary Fig. 4c).
        explanation: The decatenation comparison behind this readout.

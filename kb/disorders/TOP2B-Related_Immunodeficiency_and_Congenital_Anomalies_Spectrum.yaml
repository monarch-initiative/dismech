    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: The probands from each family presented with recurrent infections by polysaccharide-encapsulated bac- teria, severe hypogammaglobulinemia, and absent CD19 + B cells, but had normal T-cell responses to mitogens.

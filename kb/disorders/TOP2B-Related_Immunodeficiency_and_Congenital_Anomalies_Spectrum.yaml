    term:
      id: hgnc:11990
      label: TOP2B
  evidence:
  - reference: PMID:32128574
    reference_title: Topoisomerase 2β mutation impairs early B-cell development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: These results indicate that mutant TOP2BA485P protein not only itself has reduced intrinsic enzymatic activity, but also exerts a dominant negative effect on the activities of wild-type TOP2B and TOP2A.
    explanation: States the dominant-negative mechanism measured in decatenation assays of transfected cells.
  - reference: PMID:32128574
    reference_title: Topoisomerase 2β mutation impairs early B-cell development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: The decatenation activity of lysed patient’s T cell blasts was reduced (Figure 2D and Supplemental Figure 4).
    explanation: Measures the activity deficit in cells taken from a patient rather than only in recombinant protein.
  - reference: PMID:32128574
    reference_title: Topoisomerase 2β mutation impairs early B-cell development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: Thus, our experimental data are consistent with the dominant negative impact of the TOP2B mutation that causes BILU syndrome, rather than with haploinsufficiency.
    explanation: Distinguishes the mechanism from haploinsufficiency, which matters because unaffected heterozygous loss-of-function carriers exist in population cohorts.
  downstream:
  - target: Failure of Long B-Lineage Transcription Factor Gene Expression
    causal_link_type: DIRECT
    description: >-
      Without topoisomerase II activity, RNA polymerase II cannot complete
      transcription of very long genes, and the B-lineage transcription factors
      are among the longest.
    evidence:
    - reference: PMID:23995680
      reference_title: Topoisomerases facilitate transcription of long genes linked to autism.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      snippet: Expression of long genes is also reduced after knockdown of Top1 or Top2b in neurons, highlighting that both enzymes are required for full expression of long genes.
      explanation: Establishes the length-dependent transcription defect on loss of Top2b; the cells are neurons, so this supports the general mechanism rather than the B-cell case.
- name: Failure of Long B-Lineage Transcription Factor Gene Expression
  description: >-
    Topoisomerase II activity is needed for RNA polymerase II to transcribe very
    long genes, and the genes encoding the B-lineage transcription factors EBF1,
    PAX5 and FOXO1 are much longer than their T-lineage counterparts. This
    length dependence is the leading explanation for why the B lineage is the
    compartment that fails while T cells are spared. It is a hypothesis about
    human disease: the reduced expression was measured in mouse B cells, and the
    exact molecular route in patients remains unsettled.
  biological_scale: MOLECULAR
  node_class: TRANSCRIPT_LEVEL
  biological_processes:
  - preferred_term: transcription elongation of long B-lineage genes
    modifier: DECREASED
    term:
      id: GO:0006368
      label: transcription elongation by RNA polymerase II
  evidence:
  - reference: PMID:31409799
    reference_title: Mutations in topoisomerase IIβ result in a B cell immunodeficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: pre-B cells from Top2b+/EE587E mice demonstrated reduced expression of the B cell-speci ﬁc transcrip- tion factors Pax5 and Foxo1
    explanation: Mice carrying the patient-equivalent allele have lower Pax5 and Foxo1 in pre-B cells; the measurement is in mouse cells, not patient marrow.
  - reference: PMID:36045673
    reference_title: Topoisomerase 2β and DNA topology during B cell development.
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: Therefore, a combination of rapid cell cycling and the necessity to express long genes encoding B-cell TFs can make B cells highly susceptible to topological stress and create a unique requirement for TOP2B activity making these cells particularly sensitive to TOP2B deficiency.
    explanation: A review states the length-plus-proliferation argument for B-lineage selectivity; it is the authors' synthesis, not a measurement.
  downstream:
  - target: Arrest of Early B-Cell Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Insufficient PAX5 and EBF1 in early progenitors is proposed to stop them
      committing to and progressing through the B lineage.
    evidence:
    - reference: PMID:36045673
      reference_title: Topoisomerase 2β and DNA topology during B cell development.
      supports: SUPPORT
      evidence_source: OTHER
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      snippet: Thus, direct or indirect (via BRG1) association between TOP2B and B-cell TFs EBF1 and PAX5 may uniquely affect B-cell development leading to the absence of B cells in TOP2B-deficient patients
      explanation: States the proposed route from the transcription-factor deficit to absent B cells, hedged by the authors as a candidate mechanism.
- name: Arrest of Early B-Cell Development
  description: >-
    B-cell development stops immediately after the common lymphoid progenitor
    stage. A patient marrow aspirate contained no CD19-positive cells of any
    maturity, which places the block earlier than in most other B-cell
    immunodeficiencies, where pro-B cells accumulate. Mouse models with
    B-lineage Top2b deletion or the patient-equivalent allele lose B cells at
    several marrow stages.
  biological_scale: CELLULAR
  node_class: DIFFERENTIATION_IDENTITY
  cell_types:

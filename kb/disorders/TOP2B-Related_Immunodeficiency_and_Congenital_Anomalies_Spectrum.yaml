    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: found a complete absence of any CD19+ cells, including pro-B, pre-B, immature and mature B cells, but normal T, NK and myeloid cell lineages
    explanation: The patient marrow contains no B-lineage cells at any stage while other lineages are present, which is the arrest itself.
  downstream:
  - target: Absent circulating B cells
    causal_link_type: DIRECT
    description: The marrow block is why no B cells reach the blood.
    evidence:
    - reference: PMID:32128574
      reference_title: Topoisomerase 2β mutation impairs early B-cell development.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: Since BILU patients have no or few B cells in the blood, we studied T cells, skin fibroblasts and induced pluripotent stem cells (iPSCs)
      explanation: The peripheral absence of B cells is what forced the authors to study other cell types, and the marrow aspirate above locates its cause.
  - target: Absent Peripheral B Cells and Failure of Antibody Production
    causal_link_type: DIRECT
    description: >-
      With no B cells leaving the marrow, the periphery has none to produce
      immunoglobulin or to respond to antigen.
    evidence:
    - reference: PMID:31409799

treatments:
- name: Immunoglobulin Replacement Therapy
  description: >-
    Regular immunoglobulin replacement is the reported treatment for the
    antibody deficiency. It supplies passive IgG and does not correct the
    B-cell developmental defect, so it is given indefinitely. No disease-specific
    trial exists; the evidence here is a single reported course.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Immunoglobulin Therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:
  - target: Absent Peripheral B Cells and Failure of Antibody Production
    treatment_effect: BYPASSES
    description: >-
      Passive antibody substitutes for the missing product without restoring
      B-cell development.
    evidence:
    - reference: PMID:40656194
      reference_title: 'Infantile epileptic spasms syndrome as a new phenotype in TOP2B deficiency caused by a de novo variant: a case report and literature review.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      snippet: The patient was started on monthly intravenous immunoglobulin replacement therapy after being diagnosed with TOP2B deficiency and since then has not suffered from severe infections.
      explanation: One reported patient's infections stopped on replacement, which is the bypass claim; a single case is not a controlled result.
  evidence:
  - reference: PMID:40656194
    reference_title: 'Infantile epileptic spasms syndrome as a new phenotype in TOP2B deficiency caused by a de novo variant: a case report and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: The patient was started on monthly intravenous immunoglobulin replacement therapy after being diagnosed with TOP2B deficiency and since then has not suffered from severe infections.
    explanation: Documents the use and the reported outcome of immunoglobulin replacement in this disease.
- name: Anticonvulsant Therapy for Epileptic Spasms
  description: >-
    In the one patient with infantile epileptic spasms syndrome, seizures were
    refractory to vigabatrin, lamotrigine and pyridoxine. Corticotropin and oral
    corticosteroids, the usual first-line options for that syndrome, were
    withheld because of the immunodeficiency. This is a single case and not a
    treatment recommendation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:40656194
    reference_title: 'Infantile epileptic spasms syndrome as a new phenotype in TOP2B deficiency caused by a de novo variant: a case report and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: Various combinations of anticonvulsants, including vigabatrin, lamotrigine, and vitamin B6, were administered to the patient, but her seizures remained refractory.
    explanation: Records the drugs used and that they failed in the one reported case.
  - reference: PMID:40656194
    reference_title: 'Infantile epileptic spasms syndrome as a new phenotype in TOP2B deficiency caused by a de novo variant: a case report and literature review.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: first, her comorbid immunodeficiency increased the risk of severe infections from immunosuppressive therapy
    explanation: States why the usual first-line immunosuppressive treatment for infantile spasms was avoided here, which is the interaction between the two halves of the syndrome.

    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: it is not surprising that other features characterize chil- dren with this syndrome since Top2b promotes correct expres- sion of developmentally regulated genes
    explanation: The authors attribute the non-immune features to the enzyme's role in developmental gene expression; they offer it as an interpretation, not a result.

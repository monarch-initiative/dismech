discussions:
- discussion_id: gap_top2b_malformation_mechanism
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why do the limb, facial and urogenital malformations occur, and why does
    neither mouse model reproduce them?
  rationale: >-
    The B-cell arm of this disease has a mouse model that matches it and a
    human marrow aspirate that locates the block. The malformation arm has
    neither. The conditional knockout and the patient-allele knockin were
    characterised for B cells and NK cells, and no limb, facial or urogenital
    phenotype is reported in either, so the only account of the congenital
    anomalies is an attribution to the enzyme's role in developmental gene
    expression and in CTCF-dependent loop domains. That attribution is
    plausible and untested: no affected tissue from a patient has been studied,
    and the resemblance to enhancer-hijacking limb phenotypes is a resemblance,
    not a measurement. Until that gap closes, the malformation half of a
    three-axis syndrome rests on weaker evidence than the immune half.
  attaches_to:
  - pathophysiology#Disordered Developmental Gene Expression in Limb, Facial and Urogenital Primordia
  evidence:
  - reference: PMID:31409799
    reference_title: Mutations in topoisomerase IIβ result in a B cell immunodeficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: it is not surprising that other features characterize chil- dren with this syndrome since Top2b promotes correct expres- sion of developmentally regulated genes
    explanation: The authors' attribution for the non-immune features, offered without a tissue-level experiment to support it.
  - reference: PMID:31409799
    reference_title: Mutations in topoisomerase IIβ result in a B cell immunodeficiency.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    snippet: While our murine model has some phenotypic differences from our patients, it does provide opportunities to study B cells, which are not detected or practically assessed in our human patients.
    explanation: The authors state the mouse differs phenotypically from patients, which is the mismatch this gap records.
- discussion_id: gap_top2b_b_lineage_selectivity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does a defect in an enzyme needed by every dividing cell take out the B
    lineage specifically, leaving T cells intact?
  rationale: >-
    The leading explanation is gene length plus proliferation rate: the B-lineage
    transcription factors EBF1, PAX5 and FOXO1 are much longer than their
    T-lineage counterparts, and B-cell precursors divide very fast, so they are
    the cells least able to tolerate unresolved topological stress. The genes
    whose expression actually fell were measured in mouse B cells, and the
    reviews that advance the argument present it as a hypothesis. Chromatin
    looping is also used by the T lineage, which the authors themselves note is
    not easy to reconcile with the selectivity. A test would need the
    transcriptional consequence measured in human progenitors carrying a patient
    allele, which patient-derived iPSCs now make possible.
  attaches_to:
  - pathophysiology#Failure of Long B-Lineage Transcription Factor Gene Expression
  evidence:
  - reference: PMID:32128574
    reference_title: Topoisomerase 2β mutation impairs early B-cell development.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: While these TOP2B functions may contribute to the B-cell developmental defect, the exact molecular mechanism affecting specifically B cells, but not other immune cell lineages, remains unclear.
    explanation: The paper that located the marrow block states that the reason for the B-lineage selectivity is unknown, which is the gap itself.
  - reference: PMID:36045673
    reference_title: Topoisomerase 2β and DNA topology during B cell development.
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: However, chromatin looping and TADs are not specific to the development of B cells; in particular, chromatin looping has also been proposed to control rearrangement of TCR loci
    explanation: The authors' own objection to the looping explanation, which is why the question is recorded as open rather than answered.
notes: >-
  Entry scope is the TOP2B disease whose variants lie in or next to the TOPRIM
  catalytic domain, which the literature has described under three names:
  Hoffman syndrome, BILU syndrome, and an ablepharon-macrostomia-like
  presentation. PMID:32128574 showed these are one disease. The 2023 review that
  proposed the acronym TICAS is the source of this entry's name; the MONDO
  label and the two eponyms are kept as synonyms. The distinct allelic
  neurodevelopmental disorder caused by ATPase-domain variants is recorded as a
  differential diagnosis, not curated here. GeneReviews has no chapter for this
  disease or for TOP2B. Published patient numbers are small, around fifteen, so
  frequency values on individual phenotypes come from case counts within that
  literature rather than from any cohort. PMID:33459963, a reported TOPRIM-domain
  family, could not be cached (no abstract available through the fetcher) and is
  therefore not cited; it is named in the ClinGen evidence summary that this
  entry does cite. The malformation mechanism and the B-lineage selectivity are
  both recorded as open questions in `discussions`. The OpenScientist
  deep-research report in `research/` was used as a lead list only; every claim
  here is cited to a reference fetched and quoted directly. That report writes
  HGNC:11997 beside the TOP2B symbol in two places, which is TOR3A; TOP2B is
  hgnc:11990, the identifier used throughout this entry.

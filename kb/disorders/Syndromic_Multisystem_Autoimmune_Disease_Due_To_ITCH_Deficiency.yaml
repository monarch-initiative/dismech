name: Syndromic Multisystem Autoimmune Disease Due to ITCH Deficiency
creation_date: "2026-11-13T09:00:00Z"
category: Mendelian
synonyms:
- ITCH deficiency
- ITCH E3 ubiquitin ligase deficiency
- autoimmune disease, multisystem, with facial dysmorphism
- ADMFD
disease_term:
  preferred_term: syndromic multisystem autoimmune disease due to ITCH deficiency
  term:
    id: MONDO:0013245
    label: syndromic multisystem autoimmune disease due to ITCH deficiency
parents:
- Inborn error of immunity
- Primary immune regulatory disorder
description: >-
  Syndromic multisystem autoimmune disease due to ITCH deficiency (OMIM
  613385), also called autoimmune disease, multisystem, with facial
  dysmorphism, is an autosomal recessive primary immune regulatory disorder
  caused by biallelic loss-of-function variants in ITCH. ITCH encodes a
  NEDD4-family HECT-domain E3 ubiquitin ligase that enforces peripheral T cell
  tolerance by ubiquitylating and degrading a set of substrates including
  JunB, c-Jun, Notch, p63, p73 and c-FLIP, and by acting within the A20
  ubiquitin-editing complex that restrains NF-kappaB signalling. Losing it
  removes several brakes at once: JunB accumulates and skews responses toward
  Th2, antigen that should induce anergy no longer does so, TGF-beta-driven
  regulatory T cell generation is impaired, and NF-kappaB signalling is
  disinhibited. The clinical result is early-onset, progressive, multi-organ
  autoimmunity, with autoimmune hepatitis, enteropathy, chronic interstitial
  lung disease, thyroiditis, type 1 diabetes, myositis and arthritis accruing
  over time, on a syndromic background of failure to thrive, facial
  dysmorphism and developmental delay. The disorder was defined in 2010 by
  autozygosity mapping in a large Old Order Amish kindred, where ten patients
  shared a truncating ITCH variant; patients of other ancestries have since
  been reported. Morbidity and mortality are high. Autoimmune hepatitis can
  progress to acute liver failure, and lung disease to ventilator dependence.
  Management is broad immunosuppression for individual manifestations;
  allogeneic haematopoietic stem cell transplantation is the only reported
  disease-modifying therapy.
notes: >-
  Name. The entry name follows the MONDO label, which names both the
  syndromic scope and the gene. The OMIM title (autoimmune disease,
  multisystem, with facial dysmorphism) and the short clinical form used in
  the immunodeficiency literature (ITCH deficiency) are kept in synonyms.
  GeneReviews. No chapter covers this disease. A PubMed search of the
  GeneReviews book for the gene symbol
  (`ITCH[TIAB] AND genereviews[book] NOT retired[TI]`, run 2026-11-13)
  returns exactly one record, and it is the Dystrophic Epidermolysis Bullosa
  chapter, which matches only because the ordinary English word "itch"
  appears in its abstract. It is not relevant, is not cited and is not
  tagged; its identifier is deliberately left out of this note, because a
  GeneReviews chapter PMID appearing anywhere in an entry is read by
  check-genereviews as a citation needing a GeneReviews tag, and tagging a
  Dystrophic Epidermolysis Bullosa chapter on this entry would assert
  something false. Re-run the query above to see the title.
  `just check-genereviews` reports NO_CHAPTER. The phenotype baseline is the
  founding Amish series (PMID:20170897), the phenotype-expansion report
  (PMID:36338154) and the acute liver failure case (PMID:30705142).
  Two reports, one patient. PMID:36338154 (2022) and PMID:42148098 (2025)
  describe the same individual: both report the ITCH variant c.599dupC, and
  the 2025 report cites the earlier one. The polymyositis, psoriasis,
  parotitis, IgA deficiency and mitochondrial findings all come from her, so
  she must not be counted twice when reading the phenotype list. The two
  reports also disagree about whether sirolimus helped her, which is recorded
  on that treatment rather than resolved.
  Frequencies. Where a band is given it is taken from the cohort table of
  PMID:36338154, whose percentages are the ten-patient Amish cohort, and the
  quoted row is the snippet. Features absent from that cohort but present in
  the individually reported non-Amish patients (polymyositis, psoriasis,
  parotitis, IgA deficiency) are recorded VERY_RARE and attributed to those
  patients in their descriptions.
  Term binding. The deep-research report's term-validation section set
  needs_review and listed five mislabelled CURIEs. One is a genuinely wrong
  binding it suggested for this entry: HP:0030149, offered as "parotitis", is
  Cardiogenic shock. It is not used; the correct term, looked up in OLS, is
  HP:0011850 Parotitis. The others are the report putting a frequency word
  where the label belongs, and those identifiers are correct. Every term
  below was looked up in OLS at the time of writing.
  Thyroiditis is bound to the general term HP:0100646 rather than to
  HP:0000872 Hashimoto thyroiditis, because the one patient whose thyroid
  disease is described in detail had thyroiditis with exophthalmos, which
  points toward Graves disease rather than Hashimoto, and the series-level
  sources say only "thyroiditis".
  Prevalence is recorded as CASES_IN_LITERATURE. No prevalence estimate has
  been published. The ten Amish patients share a founder allele and so are
  not a basis for a general population rate.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic ITCH loss-of-function variants. The disease was mapped by
    autozygosity in a consanguineous founder population, which is the
    classical setting for a recessive disorder, and consanguinity is recorded
    in later unrelated families too.
  evidence:
  - reference: PMID:20170897
    reference_title: "Human ITCH E3 ubiquitin ligase deficiency causes syndromic multisystem autoimmune disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using autozygosity mapping in a large Amish kindred, we identified a linkage region on chromosome 20 and selected candidate genes for screening."
    explanation: >-
      Autozygosity mapping is the method used, and it presupposes and
      demonstrates recessive inheritance in a consanguineous kindred.
  - reference: PMID:36338154
    reference_title: "ITCH deficiency clinical phenotype expansion and mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autoimmune Disease, Multisystem, with Facial Dysmorphism (ADMFD) is an autosomal recessive disorder due to pathogenic variants in the ITCH gene."
    explanation: Direct statement of the inheritance pattern.
  - reference: PMID:30705142
    reference_title: "Mutation in ITCH Gene Can Cause Syndromic Multisystem Autoimmune Disease With Acute Liver Failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 1-year-old girl of consanguineous parents received a liver transplant (LT) because of acute liver failure"
    explanation: Consanguinity in an unrelated family outside the founder population.
genetic:
- name: ITCH
  gene_term:
    preferred_term: ITCH
    term:
      id: hgnc:13890
      label: ITCH
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Biallelic loss-of-function variants
  notes: >-
    ITCH encodes a NEDD4-family E3 ubiquitin ligase with an N-terminal C2
    domain, four WW domains that recognise substrate PY motifs, and a
    C-terminal catalytic HECT domain. Reported disease alleles are frameshift,
    nonsense and canonical splice-site changes. The functional endpoint is the
    same either way: the Amish allele produces a truncated protein, and in a
    later patient ITCH protein was completely absent from fibroblasts.
    relationship_type is CAUSATIVE because ClinGen rates the ITCH to this
    disease relationship Definitive (autosomal recessive, Primary Immune
    Regulatory Disorders GCEP); that assertion is recorded under
    gene_disease_validity.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_00d5cbfd-6118-48c7-b0d1-393f3e001118-2025-10-20T050000.000Z
    evidence:
    - reference: CGGV:assertion_00d5cbfd-6118-48c7-b0d1-393f3e001118-2025-10-20T050000.000Z
      reference_title: "ITCH / syndromic multisystem autoimmune disease due to ITCH deficiency (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "ITCH | HGNC:13890 | syndromic multisystem autoimmune disease due to ITCH deficiency | MONDO:0013245 | AR | Definitive | SOP11 | Primary Immune Regulatory Disorders Gene Curation Expert Panel"
      explanation: >-
        The ClinGen gene-disease validity row itself, for this gene and this
        MONDO disease, which is the assertion the tier is copied from.
  evidence:

diagnosis:
- name: Exome Sequencing
  description: >-
    Whole-exome sequencing makes the diagnosis. The gene was found by
    autozygosity mapping plus candidate screening in the founder kindred; in
    sporadic patients exome sequencing is what identifies it, and in the
    reported liver-failure case it was done post-mortem, after a liver
    transplant and a second transplant had already been performed without the
    underlying diagnosis being known.
  evidence:
  - reference: PMID:30705142
    reference_title: "Mutation in ITCH Gene Can Cause Syndromic Multisystem Autoimmune Disease With Acute Liver Failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Postmortem, whole-exome sequencing revealed a homozygous mutation in the ITCH gene."
    explanation: >-
      The diagnostic method, and the timing that shows why recognising the
      syndrome early matters.
- name: ITCH Protein Analysis in Fibroblasts
  description: >-
    Western analysis of patient-derived fibroblasts shows absence of ITCH
    protein, which confirms that novel variants are loss of function. This is
    the functional step that makes a variant of uncertain significance
    actionable.
  evidence:
  - reference: PMID:36338154
    reference_title: "ITCH deficiency clinical phenotype expansion and mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "two novel variants in ITCH with absence of ITCH protein in patient derived fibroblasts"
    explanation: The functional confirmation performed on patient cells.
treatments:
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >-
    The only reported disease-modifying therapy. A severely affected patient
    who had required tracheostomy and long-term ventilation had sustained
    immune and pulmonary recovery three years after transplantation. Only one
    previous transplanted patient had been reported, and no treatment
    algorithm is established, so this is a documented outcome in two patients
    rather than a standard of care.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic haematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Failure of Peripheral T Cell Tolerance
    description: >-
      Replaces the ITCH-deficient haematopoietic compartment, which is where
      the tolerance defect lives.
  evidence:
  - reference: PMID:42148098
    reference_title: "Case Report: Sustained immune and pulmonary recovery three years after hematopoietic stem cell transplantation for ITCH E3 ubiquitin ligase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only one prior case report has described a patient treated with hematopoietic stem cell transplantation (HSCT) with clinical improvement, and no established disease-modifying or curative therapy algorithm exists."
    explanation: >-
      States both the result and how thin the evidence base is, which is why
      the description does not present this as standard care.
- name: Corticosteroid Therapy for Autoimmune Manifestations
  description: >-
    Broad immunosuppression for individual autoimmune manifestations. In the
    reported liver-transplant case the rejection episodes were
    corticosteroid-sensitive, but the underlying systemic autoimmune disease
    continued to accrue organ involvement, which is the limit of this
    approach.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  target_mechanisms:
  - target: Multi-Organ Autoimmune Attack
    description: Suppresses individual autoimmune manifestations without correcting the tolerance defect.
  evidence:
  - reference: PMID:30705142
    reference_title: "Mutation in ITCH Gene Can Cause Syndromic Multisystem Autoimmune Disease With Acute Liver Failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Later, we saw corticosteroid-sensitive rejections as well as a systemic autoimmune disease"
    explanation: Corticosteroid responsiveness of the episodes in a reported patient.
- name: Liver Transplantation for Acute Liver Failure
  description: >-
    Liver transplantation was performed for acute liver failure in the
    reported case, twice. De novo autoimmune hepatitis developed in the first
    graft and comparable histology was found in the second, which is what
    makes this a treatment of the complication rather than of the disease: the
    autoimmunity follows the patient, not the organ.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: liver transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Autoimmune Hepatitis
    description: Replaces the failed organ; the underlying autoimmunity is unchanged.
  evidence:
  - reference: PMID:30705142
    reference_title: "Mutation in ITCH Gene Can Cause Syndromic Multisystem Autoimmune Disease With Acute Liver Failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Shortly after a second LT, a comparable liver histology could be detected"
    explanation: >-
      Recurrence of the same histology in the second graft, which is what
      shows the transplant does not address the cause.
- name: Sirolimus
  description: >-
    The mTOR inhibitor sirolimus, added to existing abatacept, ustekinumab and
    corticosteroids in the patient both reports describe. The two reports
    disagree about whether it worked, and the entry records both rather than
    choosing: the 2022 report describes dramatic improvement in diarrhoea and
    liver enzymes with reduced inflammation on repeat bowel biopsy, while the
    2025 report on the same patient says it was added without much clinical
    impact. The 2025 report is the later assessment and the one that led to
    transplantation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sirolimus
      term:
        id: NCIT:C1212
        label: Sirolimus
  target_mechanisms:
  - target: Multi-Organ Autoimmune Attack
    description: >-
      Suppresses the autoimmune manifestations; the reported effect on them is
      contradictory between the two reports.
  evidence:
  - reference: PMID:36338154
    reference_title: "ITCH deficiency clinical phenotype expansion and mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sirolimus was initiated (in addition to ongoing Abatacept, Ustekinemab and corticosteroids), and she responded with dramatic improvement in diarrhea, liver enzymes and the repeat endoscopic biopsies of bowel showed decreased inflammation"
    explanation: The favourable assessment, with the organ-specific responses it reports.
  - reference: PMID:42148098
    reference_title: "Case Report: Sustained immune and pulmonary recovery three years after hematopoietic stem cell transplantation for ITCH E3 ubiquitin ligase deficiency."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Sirolimus was added to her immunosuppressive medication without much clinical impact."
    explanation: >-
      Graded REFUTE because this is the later report on the same patient, by a
      different group, assessing the same drug as ineffective. The two
      statements cannot both be read as a treatment response, which is why
      both are recorded.
- name: Immunoglobulin Replacement
  description: >-
    Supplemental immunoglobulin for the IgA deficiency and waning antibody
    responses, given for years before transplantation and still the only
    ongoing immune-modulating therapy at last follow-up afterwards. That it
    outlasted the transplant is the point: the graft corrected the autoimmune
    dysregulation and did not remove the need for replacement.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: human immunoglobulin G
      term:
        id: NCIT:C80829
        label: Human Immunoglobulin G
  target_phenotypes:
  - preferred_term: Decreased circulating IgA concentration
    term:
      id: HP:0002720
      label: Decreased circulating IgA concentration
  evidence:
  - reference: PMID:42148098
    reference_title: "Case Report: Sustained immune and pulmonary recovery three years after hematopoietic stem cell transplantation for ITCH E3 ubiquitin ligase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At last follow-up, the only ongoing immune-modulating therapy is subcutaneous immunoglobulin replacement."
    explanation: >-
      The therapy that persisted after transplantation, when everything else
      had been stopped.
  - reference: PMID:36338154
    reference_title: "ITCH deficiency clinical phenotype expansion and mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She has been treated with supplemental IgG for the past several years."
    explanation: The same replacement therapy years earlier, in the same patient.
- name: Biologic and Cytotoxic Immunomodulators with Limited Response
  description: >-
    TNF inhibition, IL-12/23 inhibition with ustekinumab, T-cell costimulation
    blockade with abatacept, methotrexate and B-cell depletion with rituximab
    were all tried in the patient both reports describe. They are recorded
    because the negative result is the informative one: none allowed
    corticosteroids to be tapered, and rituximab caused a severe infusion
    reaction and hypogammaglobulinemia. That accumulated failure is what the
    case for transplantation rests on.
    The modality is OTHER rather than any single platform because the agents
    span three: monoclonal antibodies (ustekinumab, rituximab, the TNF
    inhibitors), a fusion protein (abatacept) and a small molecule
    (methotrexate). They are kept as one record because it is the accumulated
    failure across all of them, not any one agent, that is the finding.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ustekinumab
      term:
        id: NCIT:C84237
        label: Ustekinumab
    - preferred_term: rituximab
      term:
        id: NCIT:C1702
        label: Rituximab
    - preferred_term: abatacept
      term:
        id: NCIT:C28898
        label: Abatacept
    - preferred_term: methotrexate
      term:
        id: NCIT:C642
        label: Methotrexate
  target_mechanisms:
  - target: Multi-Organ Autoimmune Attack
    description: Targeted at the autoimmunity, without durable effect.
  evidence:
  - reference: PMID:42148098
    reference_title: "Case Report: Sustained immune and pulmonary recovery three years after hematopoietic stem cell transplantation for ITCH E3 ubiquitin ligase deficiency."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "produced limited or organ-specific responses and failed to permit sustained corticosteroid tapering"
    explanation: >-
      Graded REFUTE because the quoted finding is that these agents did not
      control the disease, which argues against them rather than for them.
  - reference: PMID:42148098
    reference_title: "Case Report: Sustained immune and pulmonary recovery three years after hematopoietic stem cell transplantation for ITCH E3 ubiquitin ligase deficiency."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "complicated by a severe infusion reaction and hypogammaglobulinemia requiring ongoing immunoglobulin replacement"
    explanation: >-
      The harm rituximab did, which belongs to the treatment rather than to
      the disease: the hypogammaglobulinemia it left is iatrogenic and is not
      the IgA deficiency recorded as a phenotype.

progression:
- phase: Early syndromic presentation
  age_range: Infancy to early childhood
  notes: >-
    Failure to thrive, facial dysmorphism and developmental delay are present
    early, before the autoimmunity declares itself.
  evidence:
  - reference: PMID:36338154
    reference_title: "ITCH deficiency clinical phenotype expansion and mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is characterized by failure to thrive, dysmorphic facial features, developmental delay, and systemic autoimmunity"
    explanation: The syndromic features that come first.
- phase: Accruing multi-organ autoimmunity
  notes: >-
    Organ-specific autoimmune disease accumulates over time and varies between
    patients, including between patients who share a genotype. In one reported
    patient the manifestations appeared sequentially over years, after a liver
    transplant had already been performed.
  evidence:
  - reference: PMID:30705142
    reference_title: "Mutation in ITCH Gene Can Cause Syndromic Multisystem Autoimmune Disease With Acute Liver Failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Later, we saw corticosteroid-sensitive rejections as well as a systemic autoimmune disease with detection of specific antibodies"
    explanation: The sequential accrual of manifestations.
- phase: High morbidity and mortality
  notes: >-
    The disease carries significant morbidity and mortality. The reported
    liver-failure patient died of sepsis after two transplants, intracranial
    bleeding and refractory pancytopenia.
  evidence:
  - reference: PMID:42148098
    reference_title: "Case Report: Sustained immune and pulmonary recovery three years after hematopoietic stem cell transplantation for ITCH E3 ubiquitin ligase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized by early-onset multisystem autoimmunity and significant morbidity and mortality"
    explanation: The disease's overall outlook as stated by a recent report.
  - reference: PMID:30705142
    reference_title: "Mutation in ITCH Gene Can Cause Syndromic Multisystem Autoimmune Disease With Acute Liver Failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three months afterward, the girl died of sepsis."
    explanation: The outcome in the one case reported in full.

pathophysiology:
- name: Biallelic ITCH Loss-of-Function Variant
  description: >-
    Both ITCH alleles carry a truncating or splice change. The protein is
    either truncated, as in the Amish founder allele, or absent altogether, as
    demonstrated in fibroblasts from a later patient.

    explanation: The syndromic features that come first.
- phase: Accruing multi-organ autoimmunity
  notes: >-
    Organ-specific autoimmune disease accumulates over time and varies between
    patients, including between patients who share a genotype. In one reported
    patient the manifestations appeared sequentially over years, after a liver
    transplant had already been performed.
  evidence:

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "characterized by early-onset multisystem autoimmunity and significant morbidity and mortality"
    explanation: The disease's overall outlook as stated by a recent report.
  - reference: PMID:30705142

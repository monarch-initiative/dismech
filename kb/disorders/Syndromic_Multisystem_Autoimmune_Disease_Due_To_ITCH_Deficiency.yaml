    explanation: The outcome in the one case reported in full.
animal_models:
- name: Itch-null (itchy) mouse
  species: Mouse
  genotype: Itch-/-
  publication: PMID:16557301
  description: >-
    The Itch-null mouse is the principal model. It was the observation that
    absence of Itch causes severe autoimmune disease in mice that motivated
    the search for a human phenotype in the first place. Its most informative
    use for this disease is the tolerance experiment: high-dose antigen that
    normally tolerizes fails to prevent airway inflammation in these animals.
  genes:
  - preferred_term: Itch
    term:
      id: MGI:1202301
      label: Itch
  modeled_mechanisms:
  - target: Failure of Peripheral T Cell Tolerance
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Directly demonstrates the tolerance defect that is inferred in
      patients, by showing that a tolerizing protocol fails.
    limitations: >-
      The experiment is in a Th2 airway-allergy model, not in the organs the
      human disease attacks, and the mouse does not reproduce the human
      syndromic features of facial dysmorphism and developmental delay.
    evidence:
    - reference: PMID:16557301
      reference_title: "Convergence of Itch-induced ubiquitination with MEKK1-JNK signaling in Th2 tolerance and airway inflammation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In a mouse allergic model, injection of high-dose tolerizing antigen failed to block the development of airway inflammation in Itch-/- mice."
      explanation: The tolerance failure measured directly in the model.
  evidence:
  - reference: PMID:20170897
    reference_title: "Human ITCH E3 ubiquitin ligase deficiency causes syndromic multisystem autoimmune disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Absence of Itch E3 ubiquitin ligase in mice has been shown to cause severe autoimmune disease."
    explanation: >-
      The mouse phenotype that preceded and motivated the discovery of the
      human disease.
differential_diagnoses:
- name: IPEX syndrome and other monogenic immune dysregulation disorders
  description: >-
    Early-onset multi-organ autoimmunity with enteropathy, endocrinopathy and
    skin disease is the shared presentation of the primary immune regulatory
    disorders. What separates this one is the syndromic background: failure to
    thrive, facial dysmorphism and developmental delay are not features of
    IPEX, and their presence alongside the autoimmunity is the clue to look at
    ITCH.
- name: Mitochondrial respiratory chain disease
  description: >-
    Not a theoretical differential. One reported patient was investigated for
    suspected mitochondrial disease and did have reduced mitochondrial DNA
    copy number, reduced fatty acid oxidation, reduced oxidative
    phosphorylation and reduced ATP production, before ITCH variants were
    found. The bioenergetic findings are real; they are a feature of this
    disease rather than an alternative diagnosis.
  evidence:
  - reference: PMID:36338154
    reference_title: "ITCH deficiency clinical phenotype expansion and mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we present a Caucasian female originally evaluated for possible mitochondrial respiratory chain deficiency, who ultimately was found to have two novel variants in ITCH"
    explanation: The diagnostic path that ran through a mitochondrial work-up first.
discussions:
- kind: KNOWLEDGE_GAP
  discussion_id: itch_mitochondrial_defect_scope
  prompt: >-
    Is the mitochondrial bioenergetic defect a general feature of ITCH
    deficiency, and does it contribute to the growth and developmental
    phenotype or run alongside it?
  rationale: >-
    The finding comes from one patient who happened to be worked up for
    suspected mitochondrial disease first, which is a route that selects for
    finding it. Nobody has measured mitochondrial DNA copy number, fatty acid
    oxidation or ATP production in the other reported patients, so there is no
    way to tell whether this is a property of the disease or of that patient.
    The question matters because the syndromic features, which are what
    distinguish this disorder from the other primary immune regulatory
    disorders, currently have no mechanism attached to them at all, and a
    bioenergetic deficit would be a candidate.
  attaches_to:
  - pathophysiology#Mitochondrial Bioenergetic Deficit
  - phenotypes#Failure to Thrive
  - phenotypes#Developmental Delay

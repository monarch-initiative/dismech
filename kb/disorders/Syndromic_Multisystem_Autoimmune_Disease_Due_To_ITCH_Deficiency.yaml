- name: Loss of ITCH E3 Ubiquitin Ligase Activity
  description: >-
    ITCH is a HECT-domain E3 ligase that ubiquitylates and degrades p73, p63,
    c-Jun, JunB, Notch and c-FLIP, and so sets the level of each. Without it
    those substrates accumulate. The breadth of the substrate list is why the
    disease is syndromic rather than purely immunological, and it is what the
    founding paper means by underscoring the importance of ITCH in many
    cellular processes.
  biological_scale: MOLECULAR
  node_class: CATALYTIC_ACTIVITY
  biological_processes:
  - preferred_term: protein ubiquitination
    modifier: DECREASED
    term:
      id: GO:0016567
      label: protein ubiquitination
  downstream:
  - target: Failure of Peripheral T Cell Tolerance
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16557301
      reference_title: "Convergence of Itch-induced ubiquitination with MEKK1-JNK signaling in Th2 tolerance and airway inflammation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here we used both in vivo and in vitro protocols to demonstrate that Th2 cells either containing a mitogen and extracellular kinase kinase 1 (MEKK1) mutant or lacking JNK1 or the E3 ubiquitin ligase Itch cannot be tolerized."
      explanation: Direct demonstration that losing the ligase is what makes the cells untolerizable.
  - target: Mitochondrial Bioenergetic Deficit
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reported in one patient, with no pathway worked out between the ligase
      and the bioenergetic measurements.
    evidence:
    - reference: PMID:36338154
      reference_title: "ITCH deficiency clinical phenotype expansion and mitochondrial dysfunction."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "While the role of ITCH protein in apoptosis and inflammation has previously been characterized, a defect in cellular bioenergetics has not yet been reported in ITCH deficiency."
      explanation: >-
        The authors present the connection as newly observed rather than
        mechanistically established, which is why the edge is indirect.
  evidence:
  - reference: PMID:24787015
    reference_title: "High throughput screening for inhibitors of the HECT ubiquitin E3 ligase ITCH identifies antidepressant drugs as regulators of autophagy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "is a HECT domain-containing E3 ligase that promotes the ubiquitylation and degradation of several proteins, including p73, p63, c-Jun, JunB, Notch and c-FLIP, thus affecting cell fate"
    explanation: The substrate list whose degradation fails, and the breadth of processes it touches.
- name: Failure of Peripheral T Cell Tolerance
  description: >-
    T cells that should be rendered anergic are not. In the mouse the
    demonstration is direct and unusually clean: high-dose tolerizing antigen,
    which normally shuts down the response, fails to block airway inflammation
    in Itch-null animals. The tolerogenic process that fails is
    ubiquitination by Itch converging with MEKK1 and JNK signalling. Three
    further arms contribute in the published mechanism, through JunB-driven
    Th2 skewing, impaired TGF-beta-driven regulatory T cell generation, and
    disinhibited NF-kappaB signalling; those are not separately curated here
    because the entry's sources demonstrate them in mouse and in vitro rather
    than in patients.
  biological_scale: CELLULAR
  node_class: AUTOIMMUNE_RESPONSE
  biological_processes:
  - preferred_term: T cell anergy
    modifier: DECREASED
    term:
      id: GO:0002870
      label: T cell anergy
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  downstream:
  - target: Multi-Organ Autoimmune Attack
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30705142
      reference_title: "Mutation in ITCH Gene Can Cause Syndromic Multisystem Autoimmune Disease With Acute Liver Failure."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "resulting in increased T-cell activity with lack of immune tolerance and manifestation of a complex systemic autoimmune disease"
      explanation: States the step from lost tolerance to systemic autoimmune disease.
  evidence:
  - reference: PMID:16557301
    reference_title: "Convergence of Itch-induced ubiquitination with MEKK1-JNK signaling in Th2 tolerance and airway inflammation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In a mouse allergic model, injection of high-dose tolerizing antigen failed to block the development of airway inflammation in Itch-/- mice."
    explanation: >-
      The experiment that shows tolerance induction itself is what fails,
      rather than some downstream effector step.
- name: Multi-Organ Autoimmune Attack
  description: >-
    Autoreactive lymphocytes attack liver, gut, lung, thyroid, pancreatic
    islets, muscle, joints and skin. The involvement accrues over time rather
    than presenting all at once, which is why a child can be diagnosed with
    one organ-specific autoimmune disease years before the syndrome is
    recognised. In the reported liver-failure case the autoimmune
    manifestations appeared sequentially after a first liver transplant, and
    the ITCH variant was found only at post-mortem exome sequencing.
  biological_scale: ORGANISM
  node_class: AUTOIMMUNE_RESPONSE
  downstream:
  - target: Autoimmune Hepatitis
    causal_link_type: DIRECT
  - target: Enteropathy
    causal_link_type: DIRECT
  - target: Chronic Interstitial Lung Disease
    causal_link_type: DIRECT
  - target: Thyroiditis
    causal_link_type: DIRECT
  - target: Type 1 Diabetes Mellitus
    causal_link_type: DIRECT
  - target: Myositis
    causal_link_type: DIRECT
  - target: Inflammatory Arthritis
    causal_link_type: DIRECT
  - target: Immune Neutropenia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36338154
    reference_title: "ITCH deficiency clinical phenotype expansion and mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is characterized by failure to thrive, dysmorphic facial features, developmental delay, and systemic autoimmunity that can manifest variably with autoimmune hepatitis, thyroiditis, and enteropathy, among other organ manifestations."
    explanation: The organ distribution and its variability.
  - reference: PMID:30705142
    reference_title: "Mutation in ITCH Gene Can Cause Syndromic Multisystem Autoimmune Disease With Acute Liver Failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Later, we saw corticosteroid-sensitive rejections as well as a systemic autoimmune disease with detection of specific antibodies (de novo autoimmune hepatitis, thyroiditis with exophthalmos, diabetes mellitus type 1, and immune neutropenia)."
    explanation: >-
      The sequential accrual of organ-specific autoimmunity in one patient,
      which is the pattern the node describes.
- name: Mitochondrial Bioenergetic Deficit
  description: >-
    A cellular energy defect reported in one patient who was originally
    investigated for a suspected mitochondrial respiratory chain disease.
    Muscle showed mitochondrial DNA copy number at 57% of controls, and
    fibroblasts showed reduced fatty acid oxidation, reduced oxidative
    phosphorylation and reduced ATP production. Whether this contributes to
    the growth and developmental features, or is a parallel consequence of
    losing a ligase with many substrates, is not established.
  biological_scale: CELLULAR
  node_class: ORGANELLE_DYSFUNCTION
  evidence:
  - reference: PMID:36338154
    reference_title: "ITCH deficiency clinical phenotype expansion and mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical studies of patient muscle showed mitochondrial DNA copy number of 57% compared to controls."
    explanation: The measured mitochondrial DNA deficit in patient muscle.
  - reference: PMID:36338154
    reference_title: "ITCH deficiency clinical phenotype expansion and mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional studies in skin fibroblasts revealed decreased activity of mitochondrial fatty acid oxidation and oxidative phosphorylation, and decreased overall ATP production."
    explanation: The bioenergetic measurements in patient fibroblasts.

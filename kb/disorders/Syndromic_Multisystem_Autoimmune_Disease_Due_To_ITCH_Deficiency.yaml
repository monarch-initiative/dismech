diagnosis:
- name: Exome Sequencing
  description: >-
    Whole-exome sequencing makes the diagnosis. The gene was found by
    autozygosity mapping plus candidate screening in the founder kindred; in
    sporadic patients exome sequencing is what identifies it, and in the
    reported liver-failure case it was done post-mortem, after a liver
    transplant and a second transplant had already been performed without the
    underlying diagnosis being known.
  evidence:
  - reference: PMID:30705142
    reference_title: "Mutation in ITCH Gene Can Cause Syndromic Multisystem Autoimmune Disease With Acute Liver Failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Postmortem, whole-exome sequencing revealed a homozygous mutation in the ITCH gene."
    explanation: >-
      The diagnostic method, and the timing that shows why recognising the
      syndrome early matters.
- name: ITCH Protein Analysis in Fibroblasts
  description: >-
    Western analysis of patient-derived fibroblasts shows absence of ITCH
    protein, which confirms that novel variants are loss of function. This is
    the functional step that makes a variant of uncertain significance
    actionable.
  evidence:
  - reference: PMID:36338154
    reference_title: "ITCH deficiency clinical phenotype expansion and mitochondrial dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "two novel variants in ITCH with absence of ITCH protein in patient derived fibroblasts"
    explanation: The functional confirmation performed on patient cells.
treatments:
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  description: >-
    The only reported disease-modifying therapy. A severely affected patient
    who had required tracheostomy and long-term ventilation had sustained
    immune and pulmonary recovery three years after transplantation. Only one
    previous transplanted patient had been reported, and no treatment
    algorithm is established, so this is a documented outcome in two patients
    rather than a standard of care.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic haematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Failure of Peripheral T Cell Tolerance
    description: >-
      Replaces the ITCH-deficient haematopoietic compartment, which is where
      the tolerance defect lives.
  evidence:
  - reference: PMID:42148098
    reference_title: "Case Report: Sustained immune and pulmonary recovery three years after hematopoietic stem cell transplantation for ITCH E3 ubiquitin ligase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only one prior case report has described a patient treated with hematopoietic stem cell transplantation (HSCT) with clinical improvement, and no established disease-modifying or curative therapy algorithm exists."
    explanation: >-
      States both the result and how thin the evidence base is, which is why
      the description does not present this as standard care.
- name: Corticosteroid Therapy for Autoimmune Manifestations
  description: >-
    Broad immunosuppression for individual autoimmune manifestations. In the
    reported liver-transplant case the rejection episodes were
    corticosteroid-sensitive, but the underlying systemic autoimmune disease
    continued to accrue organ involvement, which is the limit of this
    approach.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  target_mechanisms:
  - target: Multi-Organ Autoimmune Attack
    description: Suppresses individual autoimmune manifestations without correcting the tolerance defect.
  evidence:
  - reference: PMID:30705142
    reference_title: "Mutation in ITCH Gene Can Cause Syndromic Multisystem Autoimmune Disease With Acute Liver Failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Later, we saw corticosteroid-sensitive rejections as well as a systemic autoimmune disease"
    explanation: Corticosteroid responsiveness of the episodes in a reported patient.
- name: Liver Transplantation for Acute Liver Failure
  description: >-
    Liver transplantation was performed for acute liver failure in the
    reported case, twice. De novo autoimmune hepatitis developed in the first
    graft and comparable histology was found in the second, which is what
    makes this a treatment of the complication rather than of the disease: the
    autoimmunity follows the patient, not the organ.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: liver transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Autoimmune Hepatitis
    description: Replaces the failed organ; the underlying autoimmunity is unchanged.
  evidence:
  - reference: PMID:30705142
    reference_title: "Mutation in ITCH Gene Can Cause Syndromic Multisystem Autoimmune Disease With Acute Liver Failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Shortly after a second LT, a comparable liver histology could be detected"
    explanation: >-
      Recurrence of the same histology in the second graft, which is what
      shows the transplant does not address the cause.
progression:
- phase: Early syndromic presentation
  age_range: Infancy to early childhood
  notes: >-
    Failure to thrive, facial dysmorphism and developmental delay are present
    early, before the autoimmunity declares itself.
  evidence:

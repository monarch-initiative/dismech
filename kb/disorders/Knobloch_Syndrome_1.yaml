  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Homozygous or compound heterozygous COL18A1 variants; many reported families
    are consanguineous.
  evidence:
  - reference: PMID:10942434
    reference_title: Collagen XVIII, containing an endogenous inhibitor of angiogenesis and tumor growth, plays a critical role in the maintenance of retinal structure and in neural tube closure (Knobloch syndrome).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Knobloch syndrome (KS) is an autosomal recessive disorder defined by the occurrence of high myopia, vitreoretinal degeneration with retinal detachment, macular abnormalities and occipital encephalocele."
    explanation: States the recessive mode of inheritance in the paper that identified COL18A1 as the causal gene.
  - reference: PMID:33238767
    reference_title: Variable phenotype of Knobloch syndrome due to biallelic COL18A1 mutations in children.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WES analysis, confirmed by Sanger sequencing revealed COL18A1 biallelic null mutations in all affected individuals, consistent with autosomal recessive inheritance."
    explanation: Biallelic null variants in every affected child of an independent series.

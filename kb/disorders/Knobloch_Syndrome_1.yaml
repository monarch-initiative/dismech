  downstream:
  - target: Loss of Collagen XVIII from Basement Membranes
    causal_link_type: DIRECT
- name: Loss of Collagen XVIII from Basement Membranes
  description: >-
    Collagen XVIII is a heparan sulfate proteoglycan of basement membranes. In
    the eye it is present in every basement membrane except Descemet's
    membrane, including the inner limiting membrane, Bruch's membrane and the
    iris pigment epithelium basement membrane; it is also present in the
    choroid plexus epithelial basement membrane and the developing cortex. Its
    absence alters basement membrane structure in each of these sites.
  biological_scale: TISSUE
  cellular_components:
  - preferred_term: basement membrane
    term:
      id: GO:0005604
      label: basement membrane
  evidence:
  - reference: PMID:16532212
    reference_title: Mutations in collagen 18A1 and their relevance to the human phenotype.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Collagen XVIII, a proteoglycan, is a component of basement membranes (BMs)."
    explanation: Review establishing collagen XVIII as a basement membrane component.
  - reference: PMID:11927538
    reference_title: Lack of collagen XVIII/endostatin results in eye abnormalities.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "All basement membranes in wild-type eyes, except Descemet's membrane, showed immunogold labeling with antibodies against collagen XVIII."
    explanation: Localizes collagen XVIII to ocular basement membranes in mouse.
  downstream:
  - target: Defective Vitreoretinal Interface
  - target: Retinal Pigment Epithelium Dysfunction
  - target: Iris Pigment Epithelium Disruption
  - target: Impaired Hyaloid Vessel Regression
  - target: Defective Neural Tube Closure
  - target: Abnormal Cortical Neuronal Migration
  - target: Choroid Plexus Basement Membrane Abnormality
- name: Defective Vitreoretinal Interface
  description: >-
    Collagen XVIII anchors vitreous collagen fibrils to the inner limiting
    membrane. In Col18a1-null mice the vitreous separates from the inner
    limiting membrane; in patients the vitreous is syneretic or optically empty
    and the vitreoretinal interface is abnormally adherent at surgery. The two
    observations differ, so the exact human interface defect is not settled.
  biological_scale: TISSUE
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  evidence:
  - reference: PMID:11927538
    reference_title: Lack of collagen XVIII/endostatin results in eye abnormalities.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "collagen XVIII is important for anchoring vitreal collagen fibrils to the inner limiting membrane"
    explanation: Mouse knockout shows the anchoring role at the inner limiting membrane.
  - reference: PMID:40374141
    reference_title: Ophthalmological and Genetic Profile in Knobloch Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "an abnormally adherent vitreoretinal interface"
    explanation: Surgical observation of an abnormal vitreoretinal interface in a 34-patient genetically confirmed cohort.
  downstream:
  - target: Vitreoretinal degeneration
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11927538
      reference_title: Lack of collagen XVIII/endostatin results in eye abnormalities.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "The findings provide an explanation for high myopia, vitreoretinal degeneration and retinal detachment seen in patients with Knobloch syndrome caused by loss-of-function mutations in collagen XVIII."
      explanation: The authors extrapolate the mouse vitreoretinal anchoring defect to the human vitreoretinal degeneration.
  - target: Retinal detachment
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11927538
      reference_title: Lack of collagen XVIII/endostatin results in eye abnormalities.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "The findings provide an explanation for high myopia, vitreoretinal degeneration and retinal detachment seen in patients with Knobloch syndrome caused by loss-of-function mutations in collagen XVIII."
      explanation: Mouse-to-human extrapolation linking the interface defect to retinal detachment.
  - target: High myopia
    evidence:
    - reference: PMID:11927538
      reference_title: Lack of collagen XVIII/endostatin results in eye abnormalities.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "The findings provide an explanation for high myopia, vitreoretinal degeneration and retinal detachment seen in patients with Knobloch syndrome caused by loss-of-function mutations in collagen XVIII."
      explanation: The authors propose the ocular basement membrane defect as an explanation for high myopia; the step is not shown experimentally.
  - target: Macular hole
- name: Retinal Pigment Epithelium Dysfunction
  description: >-
    Without collagen XVIII, Bruch's membrane is abnormal, sub-RPE deposits
    accumulate, and RPE vitamin A metabolism fails, lowering rhodopsin content
    and causing age-dependent visual loss in mice. Patients show RPE and
    choriocapillaris atrophy, macular atrophy and a cone-rod pattern of retinal
    dysfunction.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell
  evidence:
  - reference: PMID:14685281
    reference_title: Collagen XVIII/endostatin is essential for vision and retinal pigment epithelial function.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "mice lacking the basement membrane component collagen XVIII/endostatin have massive accumulation of sub-RPE deposits with striking similarities to basal laminar deposits, abnormal RPE, and age-dependent loss of vision"
    explanation: RPE dysfunction in Col18a1-null mice.
  - reference: PMID:28924418
    reference_title: Optical coherence tomography findings and successful repair of retina detachment in Knobloch syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spectral domain optical coherence tomography demonstrated atrophy of the choriocapillaris and the retinal pigment epithelium, retinal thinning, and abnormal foveal contour."
    explanation: RPE atrophy on OCT in a patient homozygous for a COL18A1 variant.
  downstream:
  - target: Macular atrophy
    evidence:
    - reference: PMID:14685281
      reference_title: Collagen XVIII/endostatin is essential for vision and retinal pigment epithelial function.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "Our data demonstrate that collagen XVIII/endostatin is essential for RPE function, and suggest an important role of this collagen in Bruch's membrane."
      explanation: The mouse RPE defect is the proposed basis of the human macular and RPE atrophy; mice have no macula, so the link is inferential.
  - target: Cone-rod retinal dysfunction
    evidence:
    - reference: PMID:14685281
      reference_title: Collagen XVIII/endostatin is essential for vision and retinal pigment epithelial function.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "The progressive attenuation of visual function results from decreased retinal rhodopsin content as a consequence of abnormal vitamin A metabolism in the RPE."
      explanation: Mouse RPE failure lowers photoreceptor function; patients show a cone-rod rather than rod-predominant pattern, so the link is inferential.
- name: Iris Pigment Epithelium Disruption
  description: >-
    Loss of collagen XVIII disrupts the posterior iris pigment epithelium with
    release of melanin granules in mice, resembling pigment dispersion syndrome.
    Patients show iris transillumination defects, absent iris crypts and
    pigment dispersion with glaucoma.
  biological_scale: CELLULAR
  locations:
  - preferred_term: iris
    term:
      id: UBERON:0001769
      label: iris
  evidence:
  - reference: PMID:12766032
    reference_title: Age-dependent iris abnormalities in collagen XVIII/endostatin deficient mice with similarities to human pigment dispersion syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Col18a1(-/-) mice showed a disruption of the posterior iris pigment epithelial (IPE) cell layer with release of melanin granules."
    explanation: Iris pigment epithelium defect in the knockout mouse.
  downstream:
  - target: Iris transillumination defect

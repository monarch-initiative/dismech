diagnosis:
- name: COL18A1 molecular genetic testing
  description: >-
    Exome sequencing or a gene panel identifying biallelic COL18A1 variants.
    The ocular phenotype is often distinctive, but genetic testing is needed
    when the occipital defect is absent, where Knobloch syndrome is confused
    with familial exudative vitreoretinopathy or albinism.
  evidence:
  - reference: PMID:35387550
    reference_title: Severe retinal complications in Knobloch Syndrome - Three siblings without clinically apparent occipital defects and a review of the literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of Knobloch syndrome was eventually made through molecular genetic testing using an extensive panel."
    explanation: Genetic testing established the diagnosis in siblings without occipital findings.
treatments:
- name: Prophylactic Retinal Laser or Scleral Buckle
  description: >-
    Prophylactic laser retinopexy or scleral buckling of at-risk eyes. In a
    retrospective multicenter cohort, eyes that received prophylaxis had lower
    age-adjusted odds of retinal detachment.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Prophylactic laser retinopexy or scleral buckling
    term:
      id: NCIT:C217424
      label: Laser Photocoagulation
  target_phenotypes:
  - preferred_term: Retinal detachment
    term:
      id: HP:0000541
      label: Retinal detachment
  evidence:
  - reference: PMID:42710781
    reference_title: "Clinical Features, Retinal Detachment Rates, and Retinal Detachment Prophylaxis in Patients with Genetically Confirmed Knobloch Syndrome: A US-Based Multicenter Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Age-adjusted generalized estimating equation logistic model demonstrated lower odds of RD in eyes that received prophylaxis than not (odds ratio 0.20; P = 0.022)."
    explanation: Retrospective association of prophylaxis with fewer detachments.
- name: Vitrectomy with Scleral Buckle and Silicone Oil
  description: >-
    Repair of retinal detachment. Vitrectomy with adjunct scleral buckle and
    silicone oil tamponade gave the best single-surgery success in one cohort;
    Tenon's capsule or amniotic membrane grafts improved reattachment of
    macular hole-related detachments in another. Surgery is difficult because
    the vitreoretinal interface is abnormally adherent.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Vitrectomy with scleral buckle and silicone oil tamponade
    term:
      id: NCIT:C50837
      label: Vitrectomy
  target_phenotypes:
  - preferred_term: Retinal detachment
    term:
      id: HP:0000541
      label: Retinal detachment
  - preferred_term: Macular hole
    term:
      id: HP:0011508
      label: Macular hole
  evidence:
  - reference: PMID:38556002
    reference_title: Surgical Outcomes of Retinal Detachment in Knobloch Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vitrectomy with adjunct scleral buckle and silicone oil tamponade provided the highest single-surgery success (62.2%)."
    explanation: Comparative surgical outcomes in a retrospective cohort.
  - reference: PMID:40374141
    reference_title: Ophthalmological and Genetic Profile in Knobloch Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The use of Tenon's capsule or amniotic membrane grafts in 69% of MH-RD cases doubles the reattachment rate (82% vs 40%)."
    explanation: Graft-assisted repair of macular hole-related detachment.
- name: Ketogenic Diet for Intractable Epilepsy
  description: >-
    In one boy with polymicrogyria and drug-resistant epilepsy, a 3:1
    ketogenic diet controlled seizures after multiple antiseizure medications
    failed. Single-case evidence.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Ketogenic diet
    term:
      id: NCIT:C173168
      label: Ketogenic Diet
  target_phenotypes:
  - preferred_term: Epilepsy
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:28950998
    reference_title: Polymicrogyria and Intractable Epilepsy in Siblings With Knobloch Syndrome and Homozygous Mutation of COL18A1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At age 4, the patient was initiated on a 3:1 ratio ketogenic diet and was seizure-free after one month."
    explanation: Seizure freedom on ketogenic diet in a single patient.
animal_models:
- name: Col18a1 knockout mouse
  species: Mouse
  genotype: Col18a1-/-
  publication: PMID:11927538
  description: >-
    Mice lacking all collagen XVIII isoforms and endostatin. They reproduce
    the ocular basement membrane, RPE and iris defects; no occipital
    encephalocele is described in the cited reports.
  modeled_mechanisms:
  - target: Defective Vitreoretinal Interface
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    limitations: >-
      The vitreous separates from the inner limiting membrane in the mouse,
      whereas patients show an abnormally adherent interface at surgery; high
      myopia and retinal detachment are not reported in the mouse.
    evidence:
    - reference: PMID:11927538
      reference_title: Lack of collagen XVIII/endostatin results in eye abnormalities.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "collagen XVIII is important for anchoring vitreal collagen fibrils to the inner limiting membrane"
      explanation: The knockout shows the vitreoretinal anchoring defect.
  - target: Retinal Pigment Epithelium Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    limitations: Mice lack a macula, so the human macular atrophy cannot be modelled directly.
    evidence:
    - reference: PMID:14685281
      reference_title: Collagen XVIII/endostatin is essential for vision and retinal pigment epithelial function.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "mice lacking the basement membrane component collagen XVIII/endostatin have massive accumulation of sub-RPE deposits with striking similarities to basal laminar deposits, abnormal RPE, and age-dependent loss of vision"
      explanation: The knockout shows RPE dysfunction and visual loss.
  - target: Iris Pigment Epithelium Disruption
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    evidence:
    - reference: PMID:12766032
      reference_title: Age-dependent iris abnormalities in collagen XVIII/endostatin deficient mice with similarities to human pigment dispersion syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Col18a1(-/-) mice showed a disruption of the posterior iris pigment epithelial (IPE) cell layer with release of melanin granules."
      explanation: The knockout shows iris pigment epithelium disruption.
  - target: Choroid Plexus Basement Membrane Abnormality
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: CELLULAR
    limitations: Hydrocephalus is background-dependent (C57BL) and the choroid plexus has not been examined in patients.
    evidence:
    - reference: PMID:15254016
      reference_title: Structurally altered basement membranes and hydrocephalus in a type XVIII collagen deficient mouse line.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Significant broadening was observed in the epithelial basement membrane (BM) of the choroid plexuses (CP)"
      explanation: Choroid plexus basement membrane defect in the knockout.

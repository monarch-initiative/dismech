    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "These findings provide evidence that KS is caused by mutations in COL18A1 which, therefore, has a major role in determining the retinal structure as well as in the closure of the neural tube."
    explanation: The authors infer a neural tube closure role from the encephalocele in genetically confirmed patients.
  downstream:

genetic:
- name: COL18A1
  gene_term:
    preferred_term: COL18A1
    term:
      id: hgnc:2195
      label: COL18A1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Most pathogenic variants are frameshift, nonsense or splice variants. Some
    affect only the short isoform and others abolish all three isoforms;
    patients lacking all isoforms have more severe ocular disease. The
    c.3514_3515delCT deletion in exon 41 (as numbered in PMID:12415512) recurs
    on different haplotypes.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_ae24ab5e-a4a9-45eb-a52d-18e6dfebae53-2023-02-28T100000.000Z
    evidence:
    - reference: CGGV:assertion_ae24ab5e-a4a9-45eb-a52d-18e6dfebae53-2023-02-28T100000.000Z
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "COL18A1 | HGNC:2195 | Knobloch syndrome 1 | MONDO:0800167 | AR | Definitive"
      explanation: ClinGen Brain Malformations GCEP classifies COL18A1 as definitively causing autosomal recessive Knobloch syndrome 1.
  evidence:
  - reference: PMID:10942434
    reference_title: Collagen XVIII, containing an endogenous inhibitor of angiogenesis and tumor growth, plays a critical role in the maintenance of retinal structure and in neural tube closure (Knobloch syndrome).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a homozygous mutation at the AG consensus acceptor splice site of COL18A1 intron 1 exclusively among the 12 KS patients, which was not found among 140 control chromosomes."
    explanation: Gene discovery in a large consanguineous Brazilian family.
  - reference: PMID:12415512
    reference_title: Molecular analysis of collagen XVIII reveals novel mutations, presence of a third isoform, and possible genetic heterogeneity in Knobloch syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All are truncating mutations leading to deficiency of one or all collagen XVIII isoforms and endostatin."
    explanation: Independent unrelated patients carry biallelic truncating COL18A1 variants.
  - reference: CGGV:assertion_ae24ab5e-a4a9-45eb-a52d-18e6dfebae53-2023-02-28T100000.000Z
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism of pathogenicity is biallelic inherited loss-of-function variants."
    explanation: ClinGen summary of the disease mechanism.
  variants:
  - name: c.3514_3515delCT
    description: >-
      Recurrent two-base deletion in exon 41, found on three unrelated alleles
      embedded in different haplotypes, so it has arisen more than once.
    evidence:
    - reference: PMID:12415512
      reference_title: Molecular analysis of collagen XVIII reveals novel mutations, presence of a third isoform, and possible genetic heterogeneity in Knobloch syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We have verified that, in exon 41, the deletion c3514-3515delCT, found in three unrelated alleles, is embedded in different haplotypes, suggesting that this mutation has occurred more than once."
      explanation: Recurrent deletion on independent haplotypes.

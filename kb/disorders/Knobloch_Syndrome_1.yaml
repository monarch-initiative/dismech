    snippet: "Mice lacking collagen XVIII and its proteolytically derived product endostatin show delayed regression of blood vessels in the vitreous along the surface of the retina after birth and lack of or abnormal outgrowth of retinal vessels."
    explanation: Delayed hyaloid regression in the knockout mouse.
- name: Defective Neural Tube Closure
  description: >-
    Collagen XVIII is required for closure of the neural tube; its absence
    produces the midline occipital defect, which ranges from encephalocele or
    meningocele to a bony skull defect or a scalp lesion, and is absent in some
    patients.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: neural tube closure

      explanation: Pigment dispersion and glaucoma co-occur in patients; the causal step from iris pigment loss to glaucoma is inferred.
- name: Impaired Hyaloid Vessel Regression
  description: >-
    Col18a1-null mice show delayed regression of hyaloid vessels along the
    retinal surface and absent or abnormal outgrowth of retinal vessels. No
    phenotype in this entry is linked to this node yet: persistent fetal
    vasculature has been reported in Knobloch syndrome, but in a patient without
    a confirmed COL18A1 variant (PMID:15465551).
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: hyaloid vascular plexus regression
    term:
      id: GO:1990384

name: Knobloch Syndrome 1
creation_date: "2026-11-06T12:00:00Z"
category: Mendelian
description: >-
  Autosomal recessive developmental disorder caused by biallelic loss-of-function
  variants in COL18A1, which encodes collagen XVIII, a basement membrane
  proteoglycan whose C-terminal fragment is endostatin. The defining features are
  high myopia, vitreoretinal degeneration with a high rate of early childhood
  retinal detachment (often macular hole-related), macular atrophy, and a midline
  occipital defect that ranges from encephalocele or meningocele to a bony skull
  defect or a scalp lesion. The occipital defect is absent in a substantial
  minority, and cortical malformations (polymicrogyria, periventricular
  heterotopia), epilepsy and developmental delay occur in some patients.
synonyms:
- Knobloch syndrome type 1
- Knobloch syndrome, type 1
- KNO1
- Knobloch-Layer syndrome
- retinal detachment-occipital encephalocele syndrome
disease_term:
  preferred_term: Knobloch syndrome 1
  term:
    id: MONDO:0800167
    label: Knobloch syndrome 1
parents:
- Knobloch syndrome
notes: >-
  Named with the MONDO label. No gene-related (COL18A1-Related ...) name is
  established in MONDO, ClinGen, OMIM or GeneReviews, and there is no GeneReviews
  chapter for the disease, so the phenotype baseline comes from the molecularly
  confirmed case series cited below (PMID:27259167, PMID:33238767, PMID:42710781)
  and the Orphanet record (ORPHA:1571, which Orphanet maps as an exact match to
  this MONDO term). The Saudi paediatric series of Khan et al. (PMID:22399687) is
  not cited because it pools COL18A1 and ADAMTS18 children; ADAMTS18-related
  disease is curated separately in Microcornea-Myopic_Chorioretinal_Atrophy.
  Knobloch syndrome 2 (PAK2, dominant) is a different disease and is not covered.
references:
- reference: ORPHA:1571
  title: Knobloch syndrome
inheritance:

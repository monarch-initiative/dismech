notes: >-
  Not Neuralgic_Amyotrophy, which is the idiopathic or immune-mediated brachial
  plexopathy and is curated separately. Not the lower-trunk Klumpke form either, which is
  a distinct entity and is deliberately excluded from this entry rather than folded in.

  Evidence-grading note. The contracture routes, the aberrant reinnervation and the
  glenoid remodelling rest on neonatal rat work. Every evidence item drawn from those
  publications carries evidence_source MODEL_ORGANISM with directness INDIRECT, including
  the ones whose quoted sentence is about humans: evidence_source classifies the
  publication, not the claim. The human endpoints, the dysplasia frequency, the incidence
  and the treatment outcomes are evidenced from clinical series. The distinction is
  deliberate, because this is a condition where the mechanism is animal work and the
  outcomes are clinical series, and collapsing the two would overstate what is known
  about the human pathogenesis.

  Research consumption, stated rather than left to be inferred. The openscientist report
  fetched 46 references into the cache; this entry cites 20. The uncited remainder is
  mostly surgical-technique and outcome series for procedures the entry already models at
  the level of the mechanism they act on (tendon transfer variants, arthroscopic release
  variants, neurotization techniques), which would add operative detail without adding
  mechanism. Two phenotypes the report proposed are deliberately not curated because no
  cached source states them: an absent or reduced Moro reflex on the affected side, and
  upper limb undergrowth. Both are real and well known clinically; neither is quotable
  from anything in this PR, so they are recorded here rather than asserted.

  The openscientist deep-research report committed alongside this entry offered
  HP:0031843 as "Shoulder contracture". That code is Abnormally slow thought process. It
  was caught by the report's own term-validation section and never bound. The report's
  reference validation was clean, 40 of 40 verified with 9 of 9 quotes valid, and its
  causal chain is the backbone of the pathophysiology section here, but every snippet in
  this entry was taken from the cached reference text directly rather than from the
  report.

  No datasets block. This is an acquired mechanical injury with no molecular profiling
  literature; searching the term returns unrelated work.

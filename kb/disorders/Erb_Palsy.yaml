    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "BACKGROUND: An internal rotation contracture of the shoulder is common after neonatal brachial plexus injuries due to subscapularis shortening and atrophy."
    explanation: Names the atrophy component alongside the shortening.
- category: Musculoskeletal
  name: Elbow flexion contracture
  description: >-
    A recognised late sequela, presenting as a fixed flexion deformity that persists
    despite physiotherapy and splinting and is then treated by serial casting or hinged
    bracing. In the largest reported series the mean deformity at treatment was 45.8
    degrees at a mean age of 12.2 years, so this is a deformity of later childhood
    rather than part of the neonatal presentation.
  phenotype_term:
    preferred_term: Fixed flexion deformity of the elbow
    term:
      id: HP:0002987
      label: Elbow flexion contracture
  evidence:
  - reference: PMID:42438048
    reference_title: "Serial Casting and Hinged Elbow Bracing in the Treatment of Fixed Flexion Deformity of the Elbow Following Obstetric Brachial Plexus Palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BACKGROUND: Fixed flexion deformity (FFD) of the elbow is a recognized sequela of obstetric brachial plexus palsy (OBPP)."
    explanation: >-
      States the phenotype and its relation to the disease directly. No frequency is
      given: this is a treated case series of 73 patients, which is a numerator without
      a denominator of all obstetric brachial plexus palsy, so the frequency slot is
      left empty rather than estimated from it.
  - reference: PMID:42438048
    reference_title: "Serial Casting and Hinged Elbow Bracing in the Treatment of Fixed Flexion Deformity of the Elbow Following Obstetric Brachial Plexus Palsy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mean pretreatment active FFD was 45.8±19.9 degrees and improved to 20.7±15.1 degrees after treatment, giving a mean improvement of 25.2 degrees (95% CI: 21.6-28.8 degrees; P<0.001; Cohen dz=1.49)."
    explanation: >-
      Quantifies the severity of the established deformity, which is what makes it a
      treated entity rather than a note in a follow-up list.
environmental:
- name: Shoulder dystocia at delivery
  description: >-
    Impaction of the anterior shoulder behind the pubic symphysis, requiring resolution
    manoeuvres. It is by a wide margin the strongest risk factor, and it is also the
    circumstance in which the traction that injures the plexus is applied.
  influences_mechanisms:
  - target: Excessive Lateral Traction on the Upper Brachial Plexus at Delivery
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Shoulder dystocia is the delivery geometry in which the head-to-shoulder angle is
      forced open, which is the mechanical event that stretches the plexus.
    evidence:
    - reference: PMID:39187951
      reference_title: "Epidemiology of Brachial Plexus Birth Injury and the Impact of Cesarean Section on Its Incidence."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Shoulder dystocia was the strongest risk factor for BPBI in the logistic regression model [adjusted odds ratio (AOR): 56.9, P <0.001]."
      explanation: >-
        Gives the adjusted effect size for the association between the exposure and the
        injury.
  evidence:
  - reference: PMID:41367186
    reference_title: "Risk factors for shoulder dystocia-related brachial plexus injuries: A case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "INTRODUCTION: Brachial plexus injury (BPI) is one of the major complications associated with shoulder dystocia."
    explanation: >-
      Establishes the exposure-outcome pairing that this environmental entry records.
  notes: >-
    No exposure_term is bound. ECTO is an ontology of chemical, dietary, social and
    physical environmental exposures; it has no concept for an intrapartum mechanical
    event of this kind, and binding a generic physical-force term would assert something
    less specific than the free text already says. HP:0011413 Shoulder dystocia exists as
    a phenotype term but describes the mother's delivery rather than an exposure of the
    infant, so it is not used here either.
- name: Cesarean delivery
  description: >-
    Protective rather than causative, and the only intervention with a measured effect on
    incidence. Delivery by cesarean section removes the geometry in which the traction is
    applied. The protection is largest where the risk is largest: in macrosomic newborns
    the adjusted odds ratio was 0.581, below the 1.000 reference for a normal-weight
    newborn delivered vaginally.
  influences_mechanisms:
  - target: Excessive Lateral Traction on the Upper Brachial Plexus at Delivery
    environmental_effect: PROTECTS_AGAINST
    causal_link_type: DIRECT
    description: >-
      Acts on the initiating mechanical event by avoiding the vaginal delivery in which
      the head-to-shoulder angle is forced open.
    evidence:
    - reference: PMID:39187951
      reference_title: "Epidemiology of Brachial Plexus Birth Injury and the Impact of Cesarean Section on Its Incidence."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Stratified analysis indicated C-section delivery was protective against BPBI across newborn weight classes, but the magnitude of this protective value was highest among newborns with macrosomia."
      explanation: >-
        Reports the protective effect and, importantly, that it is not uniform: it is
        strongest in the group at highest risk, which is what a mechanical account
        predicts.
  evidence:
  - reference: PMID:39187951
    reference_title: "Epidemiology of Brachial Plexus Birth Injury and the Impact of Cesarean Section on Its Incidence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The AOR for a newborn with macrosomia born through C-section (AOR: 0.581, 95% CI: 0.365-0.925) was lower than that for a normal weight newborn born vaginally (AOR: 1.000, P =0.022)."
    explanation: >-
      Gives the adjusted effect size with its confidence interval and the comparator it
      is measured against.
  notes: >-
    No exposure_term is bound, for the same reason as the shoulder dystocia entry: ECTO
    has no concept for a mode of delivery. NCIT:C46088 (Cesarean Section) exists but is a
    procedure term rather than an exposure, and this record describes the infant's
    exposure rather than the mother's operation.
- name: Fetal macrosomia
  description: >-
    The upstream risk factor that makes the impaction likely, and the one that maternal
    diabetes and obesity act through. It is recorded here as a predisposing exposure
    rather than a trigger: macrosomia does not itself apply traction, it raises the
    probability that the shoulder impacts.
  influences_mechanisms:
  - target: Excessive Lateral Traction on the Upper Brachial Plexus at Delivery
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Acts through shoulder dystocia rather than directly. The known intermediate is the
      impaction itself, which is modeled as its own environmental entry above.
    evidence:
    - reference: PMID:27318182
      reference_title: "Shoulder dystocia: guidelines for clinical practice from the French College of Gynecologists and Obstetricians (CNGOF)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Its main risk factors are previous SD and macrosomia, but both are poorly predictive; 50-70% of SD cases occur in their absence, and most deliveries when they are present do not result in SD."
      explanation: >-
        Names macrosomia as a main risk factor and, in the same sentence, states how
        poorly it predicts, which is why this link is PREDISPOSES rather than TRIGGERS.
  evidence:
  - reference: PMID:39187951
    reference_title: "Epidemiology of Brachial Plexus Birth Injury and the Impact of Cesarean Section on Its Incidence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An interaction between cesarean (C-) section and newborn weight was explored by defining BPBI rates in a stratified manner."
    explanation: >-
      Establishes newborn weight as an effect modifier of the injury rate, which is the
      basis for curating macrosomia as a separate exposure.
  notes: >-
    No exposure_term is bound. ECTO covers environmental exposures of the organism, not
    fetal growth status, and HP:0001520 (Large for gestational age) describes the infant
    rather than an exposure acting on it.
animal_models:
- name: Neonatal rat C5-C6 neurotomy model
  species: Rat
  genotype: Wild type, surgical C5-C6 neurotomy at postnatal day 5
  publication: PMID:18343282
  description: >-
    The workhorse model for the post-injury deformity. Sectioning C5-C6 in the newborn
    rat reproduces the internal rotation contracture in every animal within four weeks
    and goes on to reproduce the glenoid deformity, which is what makes it a model of
    the sequelae rather than only of the nerve lesion.
  modeled_mechanisms:
  - target: Shoulder Internal Rotation Contracture
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Every animal developed the contracture on a defined timescale after the lesion.
    limitations: >-
      The lesion is a clean surgical neurotomy of known grade, whereas the human injury
      is a traction lesion of unknown and variable grade. The model therefore reproduces
      what happens after a severe lesion, and says nothing about the graded severity
      that determines which human infants reach this branch at all.
    readouts:
    - name: Shoulder internal rotation contracture at 4 weeks
      target: Shoulder Internal Rotation Contracture
      direction: INCREASED
      interpretation: Presence of the contracture in every operated animal within 4 weeks.
      evidence:
      - reference: PMID:18343282
        reference_title: "Brachial plexus birth palsy-associated shoulder deformity: a rat model study."
        supports: SUPPORT
        directness: INDIRECT
        evidence_source: MODEL_ORGANISM
        snippet: "RESULTS: All animals developed shoulder internal rotation contracture within 4 weeks after the C5, C6 neurotomy."
        explanation: The measurement behind this readout, with its timescale and completeness.
    evidence:
    - reference: PMID:18343282
      reference_title: "Brachial plexus birth palsy-associated shoulder deformity: a rat model study."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "CONCLUSIONS: This neonatal rat model clearly demonstrated typical shoulder deformities similar to that resulting from Erb's palsy."
      explanation: >-
        The authors' own claim that the model reproduces the human deformities, which is
        what licenses treating it as informative for this node.
  - target: Glenohumeral Dysplasia
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Glenoid version shifted from retroversion to anteversion with pseudoglenoid
      formation, subluxation and humeral head deformity.
    limitations: >-
      The direction of the version change is not the same as in humans, where the
      characteristic finding is increased glenoid retroversion with posterior
      subluxation. The model reproduces that a growing glenoid remodels under abnormal
      load, not the specific human deformity, and this entry does not use it to support
      the human dysplasia phenotype.
    readouts:
    - name: Glenoid version
      target: Glenohumeral Dysplasia
      direction: ALTERED
      interpretation: >-
        Measured shift in glenoid version, the bony correlate of the dysplasia node.
      evidence:
      - reference: PMID:18343282
        reference_title: "Brachial plexus birth palsy-associated shoulder deformity: a rat model study."
        supports: SUPPORT
        directness: INDIRECT
        evidence_source: MODEL_ORGANISM
        snippet: "Glenoid version changed from 2 degrees +/- 2 of retroversion (left side) to 8 degrees +/- 3 of anteversion."
        explanation: The quantitative readout, with its direction and dispersion.
    evidence:
    - reference: PMID:18343282
      reference_title: "Brachial plexus birth palsy-associated shoulder deformity: a rat model study."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Both shoulders were harvested, decalcified, and transected in the axial plane for glenoid version measurement and shoulder histology."
      explanation: >-
        Records how the deformity was measured, which is what makes the version figure
        interpretable.
- name: Selective subscapularis denervation rat model
  species: Rat
  genotype: Wild type, selective subscapularis denervation
  publication: PMID:25124991
  description: >-
    The dissection experiment for the atrophy route. Denervating the subscapularis alone
    produced the contracture, establishing that route as sufficient.
  modeled_mechanisms:
  - target: Subscapularis Denervation Atrophy and Impaired Longitudinal Growth
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Isolates one muscle's denervation as a sufficient cause of the contracture.
    limitations: >-
      Selective single-muscle denervation does not occur in the human injury, where the
      upper trunk supplies several muscles at once. The experiment establishes
      sufficiency in principle; it cannot say how much of a given child's contracture
      this route contributes, and the authors say so.
    evidence:
    - reference: PMID:25124991
      reference_title: "The role of subscapularis muscle denervation in the pathogenesis of shoulder internal rotation contracture after neonatal brachial plexus palsy: a study in a rat model."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Our study shows that subscapularis denervation, per se, could explain shoulder contracture after neonatal brachial plexus injury, though its relevance compared to other pathogenic factors needs further investigation."
      explanation: >-
        The sufficiency result together with the authors' explicit limitation, which is
        the basis for MODERATE rather than HIGH fidelity here.
- name: Selective suprascapular neurectomy rat model
  species: Rat
  genotype: Wild type, selective suprascapular neurectomy with subscapularis spared
  publication: PMID:24388715
  description: >-
    The complementary dissection experiment. Denervating only the external rotators,
    with the subscapularis intact and histologically unchanged, still produced the
    contracture.
  modeled_mechanisms:
  - target: Rotator Muscle Imbalance
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Establishes imbalance as a second sufficient route, independent of subscapularis
      atrophy.
    limitations: >-
      As with the subscapularis experiment, the lesion is selective in a way the human
      injury is not. What the pair of experiments establishes is that two routes are each
      sufficient, not their relative contribution in any patient.
    readouts:
    - name: Subscapularis fibre size and fibrosis
      target: Rotator Muscle Imbalance
      direction: UNCHANGED
      interpretation: >-
        A negative result, and the load-bearing one: the spared subscapularis was
        histologically normal, so the contracture in this arm cannot be attributed to it.
      evidence:
      - reference: PMID:24388715
        reference_title: "The role of muscle imbalance in the pathogenesis of shoulder contracture after neonatal brachial plexus palsy: a study in a rat model."
        supports: SUPPORT
        directness: INDIRECT
        evidence_source: MODEL_ORGANISM
        snippet: "No differences were found in subscapularis muscle fiber size and area of fibrosis between shoulders after suprascapular nerve injury."
        explanation: The measurement showing the spared muscle was unaffected.
    evidence:
    - reference: PMID:24388715
      reference_title: "The role of muscle imbalance in the pathogenesis of shoulder contracture after neonatal brachial plexus palsy: a study in a rat model."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "CONCLUSIONS: Our study supports the theory that shoulder muscle imbalance is a cause of shoulder contracture in patients with neonatal brachial plexus palsy."
      explanation: The conclusion this model link records.
treatments:
- name: Physical and Occupational Therapy
  description: >-
    First-line and universal: maintaining passive range of motion while waiting to see
    whether the nerve recovers. It is directed at preventing the contracture rather than
    at the nerve lesion.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  target_mechanisms:
  - target: Shoulder Internal Rotation Contracture
    description: >-
      Aimed at the contracture, by maintaining length in the internal rotators through
      the period when the muscle is denervated and not growing.
- name: Botulinum Toxin Injection of the Internal Rotators
  description: >-
    Chemical weakening of the internal rotators to rebalance the joint. The measured
    benefit outlasts the toxin's pharmacological half-life, which is the observation that
    makes it more than a temporising measure: gains of 46 degrees of passive external
    rotation at four months, with 18 degrees still present at eleven months.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: botulinum toxin chemodenervation
    term:
      id: NCIT:C157775
      label: Botulinum Toxin Therapy
    therapeutic_agent:
    - preferred_term: botulinum toxin type A
      term:
        id: CHEBI:3160
        label: Botulinum toxin type A
  target_mechanisms:
  - target: Rotator Muscle Imbalance
    description: >-
      Acts directly on the imbalance route by weakening the relatively preserved internal
      rotators, rather than by strengthening the denervated external rotators.
    evidence:
    - reference: PMID:32753228
      reference_title: "Outcomes of Botulinum Toxin Injection for Shoulder Internal Rotation Contractures in Infants with Brachial Plexus Birth Injury."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Subjects demonstrated a significant increase in passive external rotation of 46° (range, 10° to 90) at 4 months; an average improvement of 18° (range, -30° to 80°) persisted at 11 months after injection."
      explanation: >-
        Gives the effect size and its persistence beyond the toxin's half-life, which is
        what supports an effect on the underlying imbalance rather than a purely
        pharmacological one. Note the range crosses zero at eleven months, so some
        children lost ground.
  evidence:
  - reference: PMID:32753228
    reference_title: "Outcomes of Botulinum Toxin Injection for Shoulder Internal Rotation Contractures in Infants with Brachial Plexus Birth Injury."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Shoulder passive external rotation in adduction and Active Movement Scale external rotation scores were recorded before and after BTX-A injection."
    explanation: >-
      Records what was measured. This is a retrospective before-and-after series, not a
      controlled trial, which is the main limit on how the effect size should be read.
- name: Primary Nerve Reconstruction and Nerve Transfer
  description: >-
    Neuroma excision with grafting, or distal nerve transfers, when biceps recovery has
    not occurred by around three to six months. Nerve transfers reported grade 4 or
    better elbow flexion in all evaluable patients in one series. A systematic review of
    the whole literature is more measured: grafts and transfers both improve function,
    and no approach is established as superior.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: nerve reconstruction and nerve transfer
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Denervation of C5-C6 Innervated Shoulder and Elbow Muscles
    description: >-
      The only treatment aimed at the nerve lesion itself, restoring axonal continuity to
      the denervated muscles before the downstream deformity is established.
    evidence:
    - reference: PMID:27543083
      reference_title: "Distal transfers as a primary treatment in obstetric brachial plexus palsy: a series of 20 cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Of the remainder, 11 had grade 4+ power of elbow flexion and six patients had grade 4 power at 1\u2009year follow-up; all had 4+ power of elbow flexion at final follow-up."
      explanation: >-
        Reports the reinnervation outcome for the target muscle. A small uncontrolled
        series in a selected injury grade, so it establishes that the approach can work
        rather than how it compares.
  evidence:
  - reference: PMID:40958300
    reference_title: "Long-term outcomes and effectiveness of interventions in neonatal brachial plexus palsy: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While nerve grafts and nerve transfers show promising results, there is no definitive consensus on their superiority, particularly regarding external shoulder rotation and hand function recovery."
    explanation: >-
      The systematic review's own hedge, which is the honest summary of the comparative
      evidence and is deliberately quoted rather than the single-series result above.
- name: Secondary Shoulder Reconstruction
  description: >-
    Procedures for established deformity: anterior shoulder and subscapularis release,
    tendon transfer, and humeral derotation osteotomy. Anterior release improved glenoid
    version from -32 to -12 degrees, and open subscapularis lengthening with joint
    relocation gave durable remodelling at ten years, so the deformed joint retains
    remodelling capacity if the abnormal force is removed.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orthopedic surgical procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  target_mechanisms:
  - target: Glenohumeral Dysplasia
    description: >-
      Removes the deforming force and relocates the joint, after which the growing
      glenoid remodels. This is the therapeutic counterpart of the claim that the
      dysplasia is generated by sustained abnormal load rather than being a fixed primary
      malformation.
    evidence:
    - reference: PMID:30981548
      reference_title: "Isolated open anterior shoulder release in brachial plexus birth palsy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "RESULTS: After a mean follow-up period of 23 months, glenoid version and the percentage of the humeral head anterior to the middle of the glenoid fossa significantly improved from -32° and 18%, respectively, to mean postoperative values of -12° (P < .001) and 45% (P < .001), respectively."
      explanation: >-
        Measures the bony remodelling after release on two axes, version and humeral head
        position, which is what supports the claim that the deformity is load-driven and
        partly reversible.
    - reference: PMID:31085034
      reference_title: "Development of the glenohumeral joint after subscapular release and open relocation in children with brachial plexus birth palsy: long-term results in 61 patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The glenoid retroversion changed by 14.8° (95% confidence interval, 11.1°-18.4°; P < .01), from 25.4° to 10.6°, approaching a normal value."
      explanation: >-
        The same remodelling measured at a mean of 10.2 years, so the correction is
        durable rather than an early postoperative appearance. Note this is a
        before-and-after study without a control arm.
diagnosis:
- name: Clinical examination at birth with serial motor assessment
  description: >-
    Diagnosis is clinical: a flaccid arm at birth in the characteristic posture. What
    matters afterwards is serial assessment, because the decision that changes outcome is
    whether biceps function returns in the first months, and that is a longitudinal
    observation rather than a single test.
  presence: PRESENT
  evidence:
  - reference: PMID:25509702
    reference_title: "Brachial plexus birth palsy: the natural history, outcome of microsurgical repair and operative reconstruction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "OBJECTIVE: To document the natural history of brachial plexus birth palsy in relation to the recovery of elbow flexion and shoulder flexion in the first six months of life; to assess the outcome after microsurgery of the brachial plexus in patients who had no recovery of bicep function at six months."
    explanation: >-
      Frames the diagnostic task as serial assessment of recovery against the six-month
      biceps milestone.
- name: Imaging and electrophysiology for lesion grade
  description: >-
    Reserved for infants who are not recovering. The question these answer is not whether
    there is an injury but what grade it is, and specifically whether roots have been
    avulsed, which cannot be repaired by grafting.
  presence: PRESENT
  evidence:
  - reference: PMID:12874720
    reference_title: "[Management of obstetrical brachial plexus palsy--own experience with the primary operative technique]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If spontaneous recovery does not occur within the first six months of life, investigations like electrophysiology, and CT-myelography and surgical exploration of the brachial plexus are recommended."
    explanation: >-
      States both the trigger for investigation and the modalities, and makes clear they
      follow rather than establish the diagnosis.
  - reference: PMID:39432686
    reference_title: "Diagnostic accuracy of MRI for detecting nerve injury in brachial plexus birth injury."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean sensitivity and mean specificity of MRI for detecting root avulsion was 68% (95% CI: 55%, 79%) and 89% (95% CI: 78%, 95%), respectively."
    explanation: >-
      Puts numbers on how much the imaging answers. A sensitivity of 68 per cent means a
      negative MRI does not exclude avulsion, which is why imaging informs the operative
      decision rather than making it.
differential_diagnoses:
- name: Clavicle fracture
  description: >-
    The other common birth injury of the same delivery, and the main early mimic: a
    newborn with a fractured clavicle also does not move the arm, from pain rather than
    from denervation. They share risk factors and can co-occur.
  evidence:
  - reference: PMID:42486682
    reference_title: "Risk and protective factors for birth-related clavicle fracture and brachial plexus birth injury: a national cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "OBJECTIVE: Clavicle fracture is the most common birth-related fracture, resulting in concerns and dissatisfaction, while brachial plexus birth injury (BPBI) is a severe complication with potential lifelong sequelae."
    explanation: >-
      Establishes the two as the paired birth injuries of the same event, which is what
      makes clavicle fracture the differential rather than an unrelated condition.
discussions:
- discussion_id: erb_two_sufficient_contracture_routes
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Subscapularis Denervation Atrophy and Impaired Longitudinal Growth
  - pathophysiology#Rotator Muscle Imbalance
  prompt: >-
    Denervation atrophy and rotator imbalance are each sufficient to produce the
    contracture in the rat. What is their relative contribution in a given child?
  rationale: >-
    Two selective-denervation experiments each produce the contracture on their own, and
    neither was designed to weigh them against the other. That is not an academic
    question, because the treatments act on different routes: botulinum toxin weakens the
    intact internal rotators and so targets imbalance, while therapy aimed at maintaining
    subscapularis length targets the atrophy route. Which one dominates in a particular
    child would predict which treatment helps them, and nothing measures it. One of the
    two papers raises the point itself.
  evidence:
  - reference: PMID:25124991
    reference_title: "The role of subscapularis muscle denervation in the pathogenesis of shoulder internal rotation contracture after neonatal brachial plexus palsy: a study in a rat model."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Our study shows that subscapularis denervation, per se, could explain shoulder contracture after neonatal brachial plexus injury, though its relevance compared to other pathogenic factors needs further investigation."
    explanation: >-
      The authors state the open question directly: sufficiency is established, relative
      weight is not.
- discussion_id: erb_prevention_ceiling
  kind: KNOWLEDGE_GAP
  attaches_to:
  - environmental#Shoulder dystocia at delivery
  prompt: >-
    How much of the residual injury burden is preventable at all, given that most shoulder
    dystocia occurs without identifiable risk factors?
  rationale: >-
    Prevention here is obstetric, and it works: twelve years of multi-professional
    shoulder-dystocia simulation training was followed by a fall in brachial plexus injury
    from 7.4% to 1.3% of shoulder dystocia deliveries. But that is training in how to
    manage the event, not in how to avoid it. Risk-factor-based prevention has a hard
    ceiling, because half to two-thirds of shoulder dystocia happens in women with none of
    the recognised risk factors. Distinguishing the two kinds of prevention matters for
    what a service should invest in, and the literature does not separate their
    contributions.
  evidence:
  - reference: PMID:27318182
    reference_title: "Shoulder dystocia: guidelines for clinical practice from the French College of Gynecologists and Obstetricians (CNGOF)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Its main risk factors are previous SD and macrosomia, but both are poorly predictive; 50-70% of SD cases occur in their absence, and most deliveries when they are present do not result in SD."
    explanation: >-
      States the ceiling on risk-factor-based prediction in both directions, poor
      sensitivity and poor specificity.
  - reference: PMID:25688719
    reference_title: "Prevention of brachial plexus injury-12 years of shoulder dystocia training: an interrupted time-series study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MAIN OUTCOMES: Neonatal morbidity (brachial plexus injury, humeral fracture, clavicular fracture, 5-minute Apgar score <7) and documented management of shoulder dystocia (resolution manoeuvres performed, traction applied, head-to-body delivery interval)."
    explanation: >-
      Records what the training study measured. It is an interrupted time series rather
      than a trial, so the fall in injury is a before-and-after association in one unit.
- discussion_id: erb_rat_glenoid_direction_mismatch
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Glenohumeral Dysplasia
  - animal_models#Neonatal rat C5-C6 neurotomy model
  prompt: >-
    Does the rat glenoid deformity model the human one, given that the version change goes
    in the opposite direction?
  rationale: >-
    The rat model reproduces the contracture faithfully and is the main evidence that the
    dysplasia is load-driven rather than primary. But its glenoid moves from retroversion
    to anteversion, whereas the human deformity is characterised by increasing retroversion
    with posterior subluxation. Quadrupedal shoulder loading is not bipedal shoulder
    loading, so the discrepancy is explicable, but it means the model supports the general
    claim that a growing glenoid remodels under sustained abnormal force and does not
    support the specific human deformity. This entry uses it for the former only, and the
    human dysplasia phenotype is evidenced from human data.
  evidence:
  - reference: PMID:18343282
    reference_title: "Brachial plexus birth palsy-associated shoulder deformity: a rat model study."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Glenoid version changed from 2 degrees +/- 2 of retroversion (left side) to 8 degrees +/- 3 of anteversion."
    explanation: >-
      The measurement whose direction differs from the human finding, which is the
      mismatch this discussion records.

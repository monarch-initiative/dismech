name: Erb Palsy
creation_date: "2026-09-07T18:40:00Z"
category: Acquired
synonyms:
- Erb-Duchenne paralysis
- Erb-Duchenne palsy
- upper brachial plexus birth injury
- C5-C6 brachial plexus birth palsy
description: >-
  Erb palsy is the upper-trunk form of brachial plexus birth injury: traction on the
  C5-C6 roots during delivery, most often when the shoulder is impacted, producing
  flaccid weakness of the shoulder and elbow with the arm held adducted, internally
  rotated and pronated.

  It is worth curating as a mechanism rather than as a birth complication because the
  interesting part is what happens after the nerve heals. Most infants recover
  spontaneously. In the minority who do not, the residual disability is not simply
  persistent weakness: it is a progressive musculoskeletal deformity generated by the
  denervation, in a joint that is still growing. Neonatal rat work has separated two
  sufficient causes of the internal-rotation contracture that follows. Denervating the
  subscapularis alone produces it, through atrophy and impaired longitudinal growth of
  that muscle. Denervating only the external rotators and sparing the subscapularis
  also produces it, through imbalance. Either route alone is enough, which is why the
  contracture is so consistent, and it is also why a treatment aimed at only one of
  them is incomplete. The contracture then remodels the growing glenohumeral joint into
  dysplasia, found in roughly half of permanent cases.

  A third strand of residual disability comes from repair rather than from loss:
  regenerating axons crossing a neuroma-in-continuity reach antagonist muscles, so the
  child co-contracts and cannot use a passive range of motion that is otherwise
  adequate.

  Prevention is obstetric and its ceiling is known: shoulder dystocia is by far the
  strongest risk factor, but half to two-thirds of shoulder dystocia occurs with no
  identifiable risk factor present.

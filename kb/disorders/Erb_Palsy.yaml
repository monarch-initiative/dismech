prevalence:
- population: Germany, 2005-2018, national hospital discharge data
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 15.0
  rate_denominator: LIVE_BIRTHS
  notes: >-
    Reported as 0.15 per 1000 live births in 2018, down from 0.28 in 2005; normalized
    here to 15 per 100,000 live births. The rate is falling, and the source pairs the
    decline with rising cesarean delivery rates. This is obstetric brachial plexus
    injury overall rather than the Erb subtype specifically, so it is an upper bound on
    the Erb-specific rate. Note also that published incidence figures for this condition
    vary by roughly an order of magnitude across countries and ascertainment methods,
    so a single national figure should not be read as the worldwide rate.
  evidence:
  - reference: PMID:40315612
    reference_title: "Epidemiology and surgical management of obstetric brachial plexus injury: a national cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The incidence of OBPI per 1000 live births significantly decreased by 47.57%, from 0.28 in 2005 to 0.15 in 2018 (p < 0.001), representing a mean annual decrease of 0.010 ± 0.026."
    explanation: >-
      Gives the rate and its denominator, and the trend that the normalized figure is
      taken from.
  - reference: PMID:40315612
    reference_title: "Epidemiology and surgical management of obstetric brachial plexus injury: a national cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CONCLUSIONS: OBPI is a rare disease, with a decreasing incidence paralleled by an increase in cesarean birth delivery rates between 2005 and 2018 in Germany."
    explanation: >-
      Names the population and period the rate applies to, and the cesarean-rate
      association the authors pair it with.
pathophysiology:
- name: Excessive Lateral Traction on the Upper Brachial Plexus at Delivery
  biological_scale: ORGANISM
  description: >-
    The initiating event. Increasing the head-to-shoulder angle during delivery, most
    often when the anterior shoulder is impacted behind the symphysis, stretches the
    upper brachial plexus. This is a mechanical lesion and there is no molecular
    initiating step above it.
  downstream:
  - target: Graded Stretch Injury of the C5-C6 Upper Trunk
    causal_link_type: DIRECT
    description: >-
      The traction is transmitted to the C5-C6 roots and upper trunk, which are the most
      exposed part of the plexus in this delivery geometry.
    evidence:
    - reference: PMID:30020632
      reference_title: "Erb Palsy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Erb palsy most commonly results from an upper brachial plexus birth injury involving the C5–C6 nerve roots, with occasional extension to C7, leading to flaccid weakness or paralysis of the affected upper extremity."
      explanation: >-
        Names the injured roots and the resulting deficit, which is the step this edge
        asserts. Graded OTHER as a clinical reference chapter rather than a study.
  evidence:
  - reference: PMID:39187951
    reference_title: "Epidemiology of Brachial Plexus Birth Injury and the Impact of Cesarean Section on Its Incidence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Shoulder dystocia was the strongest risk factor for BPBI in the logistic regression model [adjusted odds ratio (AOR): 56.9, P <0.001]."
    explanation: >-
      Quantifies the delivery circumstance that produces the traction, with an effect
      size large enough to make the mechanical account the default one.
- name: Graded Stretch Injury of the C5-C6 Upper Trunk
  biological_scale: TISSUE
  description: >-
    The stretch produces a graded lesion along the Seddon spectrum: conduction block
    without axonal disruption at one end, axonal disruption within an intact sheath in
    the middle, rupture of the trunk, and root avulsion from the spinal cord at the
    other. The grade, not the fact of injury, is what determines everything downstream,
    and it is not directly measurable in the newborn.
  locations:
  - preferred_term: brachial plexus
    term:
      id: UBERON:0001814
      label: brachial nerve plexus
  downstream:
  - target: Denervation of C5-C6 Innervated Shoulder and Elbow Muscles
    causal_link_type: DIRECT
    description: >-
      Axonal interruption disconnects the motor units of the muscles supplied by the
      upper trunk.
    evidence:
    - reference: PMID:30020632
      reference_title: "Erb Palsy."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Erb palsy most commonly results from an upper brachial plexus birth injury involving the C5–C6 nerve roots, with occasional extension to C7, leading to flaccid weakness or paralysis of the affected upper extremity."
      explanation: >-
        States the nerve-to-weakness step. The flaccidity is the clinical signature of
        denervation rather than of a central lesion.
  evidence:
  - reference: PMID:12874720
    reference_title: "[Management of obstetrical brachial plexus palsy--own experience with the primary operative technique]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If spontaneous recovery does not occur within the first six months of life, investigations like electrophysiology, and CT-myelography and surgical exploration of the brachial plexus are recommended."
    explanation: >-
      Records that the lesion grade is established only later, by investigation or
      exploration, which is why this node describes a graded injury rather than a
      specific one.
- name: Denervation of C5-C6 Innervated Shoulder and Elbow Muscles
  biological_scale: TISSUE
  description: >-
    Loss of motor supply to deltoid, supraspinatus, infraspinatus, biceps, brachialis
    and subscapularis. The pattern of which muscles are denervated, and which are
    spared, is what generates the deformity rather than the total amount of weakness.
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: skeletal muscle atrophy
    term:
      id: GO:0014732
      label: skeletal muscle atrophy
    modifier: INCREASED
  downstream:
  - target: Upper limb muscle weakness
    causal_link_type: DIRECT
    description: >-
      Loss of motor supply to the upper-trunk muscles is what the flaccid weakness at
      birth is.
  - target: Shoulder girdle muscle atrophy
    causal_link_type: DIRECT
    description: >-
      Denervated muscle wastes, which is the observable counterpart of the denervation
      node.
  - target: Spontaneous Reinnervation and Functional Recovery
    causal_link_type: DIRECT
    description: >-
      In the large majority, the lesion is mild enough that the axons regenerate or
      conduction returns, and function is restored.
    evidence:
    - reference: PMID:12874720
      reference_title: "[Management of obstetrical brachial plexus palsy--own experience with the primary operative technique]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "80 to 95% of these lesions recover spontaneously."
      explanation: >-
        Gives the size of the recovery branch, which is what makes this the dominant
        outcome rather than an alternative one.
  - target: Subscapularis Denervation Atrophy and Impaired Longitudinal Growth
    causal_link_type: DIRECT
    description: >-
      Where reinnervation fails, the denervated subscapularis atrophies and does not
      grow in length as the limb grows.
    evidence:
    - reference: PMID:25124991
      reference_title: "The role of subscapularis muscle denervation in the pathogenesis of shoulder internal rotation contracture after neonatal brachial plexus palsy: a study in a rat model."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Our study shows that subscapularis denervation, per se, could explain shoulder contracture after neonatal brachial plexus injury, though its relevance compared to other pathogenic factors needs further investigation."
      explanation: >-
        Establishes subscapularis denervation as sufficient for the downstream
        contracture. Graded INDIRECT: this is a rat experiment, and the authors
        themselves qualify how much of the human pathogenesis it accounts for.
  - target: Rotator Muscle Imbalance
    causal_link_type: DIRECT
    description: >-
      The external rotators are supplied by the upper trunk and the internal rotators
      only partly, so upper-trunk denervation shifts the balance of forces across the
      joint even when the subscapularis itself is spared.
    evidence:
    - reference: PMID:24388715
      reference_title: "The role of muscle imbalance in the pathogenesis of shoulder contracture after neonatal brachial plexus palsy: a study in a rat model."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "MATERIALS AND METHODS: We performed selective neurectomy of the suprascapular nerve in 15 newborn rats to denervate only the supraspinatus and the infraspinatus muscles, leaving the subscapularis muscle intact."
      explanation: >-
        Describes the experiment that isolates the imbalance route by denervating only
        the external rotators. Graded INDIRECT as a rat model of the human lesion.
  - target: Aberrant Reinnervation Through a Neuroma-in-Continuity
    causal_link_type: DIRECT
    description: >-
      Where the sheath is disrupted but continuity is maintained, regenerating axons can
      grow into the wrong distal pathways.
  evidence:
  - reference: PMID:30020632
    reference_title: "Erb Palsy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Erb palsy most commonly results from an upper brachial plexus birth injury involving the C5–C6 nerve roots, with occasional extension to C7, leading to flaccid weakness or paralysis of the affected upper extremity."
    explanation: >-
      Names the denervation-driven weakness that defines this node.
- name: Spontaneous Reinnervation and Functional Recovery
  biological_scale: ORGANISM
  description: >-
    The dominant outcome, and the reason initial management is observation rather than
    surgery. Return of biceps function in the first months is the pivotal prognostic
    sign; its absence by three to six months is what converts observation into an
    operative decision.
  biological_processes:
  - preferred_term: neuron projection regeneration
    term:
      id: GO:0031102
      label: neuron projection regeneration
    modifier: INCREASED
  evidence:
  - reference: PMID:12874720
    reference_title: "[Management of obstetrical brachial plexus palsy--own experience with the primary operative technique]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "80 to 95% of these lesions recover spontaneously."
    explanation: Quantifies the recovery branch.
  - reference: PMID:25509702
    reference_title: "Brachial plexus birth palsy: the natural history, outcome of microsurgical repair and operative reconstruction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "OBJECTIVE: To document the natural history of brachial plexus birth palsy in relation to the recovery of elbow flexion and shoulder flexion in the first six months of life; to assess the outcome after microsurgery of the brachial plexus in patients who had no recovery of bicep function at six months."
    explanation: >-
      Establishes the six-month biceps-recovery milestone as the natural-history
      landmark that operative decisions are keyed to.
- name: Subscapularis Denervation Atrophy and Impaired Longitudinal Growth
  biological_scale: TISSUE
  description: >-
    The first of two independently sufficient routes to contracture. A denervated
    subscapularis loses mass and fibre size and, critically, fails to lengthen while the
    limb grows. The result is a relatively short, stiff internal rotator tethering the
    joint.
  biological_processes:
  - preferred_term: skeletal muscle atrophy
    term:
      id: GO:0014732
      label: skeletal muscle atrophy
    modifier: INCREASED
  downstream:
  - target: Shoulder Internal Rotation Contracture
    causal_link_type: DIRECT
    description: >-
      Shown to be sufficient on its own: denervating the subscapularis alone produces
      the contracture in the rat model.
    evidence:
    - reference: PMID:25124991
      reference_title: "The role of subscapularis muscle denervation in the pathogenesis of shoulder internal rotation contracture after neonatal brachial plexus palsy: a study in a rat model."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Our study shows that subscapularis denervation, per se, could explain shoulder contracture after neonatal brachial plexus injury, though its relevance compared to other pathogenic factors needs further investigation."
      explanation: >-
        The sufficiency claim this edge rests on, with the authors' own caveat about its
        weight relative to other routes.
  evidence:
  - reference: PMID:24388715
    reference_title: "The role of muscle imbalance in the pathogenesis of shoulder contracture after neonatal brachial plexus palsy: a study in a rat model."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "BACKGROUND: An internal rotation contracture of the shoulder is common after neonatal brachial plexus injuries due to subscapularis shortening and atrophy."
    explanation: >-
      States the shortening-and-atrophy account of the contracture that this node
      describes.
- name: Rotator Muscle Imbalance
  biological_scale: TISSUE
  description: >-
    The second independently sufficient route. Denervating only the supraspinatus and
    infraspinatus, leaving the subscapularis intact and histologically normal, still
    produced the contracture. That result is what makes this a separate mechanism rather
    than a restatement of the atrophy one.
  downstream:
  - target: Shoulder Internal Rotation Contracture
    causal_link_type: DIRECT
    description: >-
      Sufficient on its own, in a preparation where the subscapularis is spared.
    evidence:
    - reference: PMID:24388715
      reference_title: "The role of muscle imbalance in the pathogenesis of shoulder contracture after neonatal brachial plexus palsy: a study in a rat model."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "CONCLUSIONS: Our study supports the theory that shoulder muscle imbalance is a cause of shoulder contracture in patients with neonatal brachial plexus palsy."
      explanation: >-
        The authors' conclusion, which is the causal claim this edge makes. Graded
        INDIRECT as a rat result generalized to the human condition.
  evidence:
  - reference: PMID:24388715
    reference_title: "The role of muscle imbalance in the pathogenesis of shoulder contracture after neonatal brachial plexus palsy: a study in a rat model."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "No differences were found in subscapularis muscle fiber size and area of fibrosis between shoulders after suprascapular nerve injury."
    explanation: >-
      The control that makes this route independent: the subscapularis was
      histologically unchanged, so the contracture in that arm cannot be attributed to
      subscapularis atrophy.
- name: Aberrant Reinnervation Through a Neuroma-in-Continuity
  biological_scale: CELLULAR
  description: >-
    Regenerating axons crossing a neuroma-in-continuity are misrouted to antagonist
    muscles. The clinical consequence is cocontraction: agonist and antagonist fire
    together, so a child with an adequate passive range cannot use it. This is a
    disability produced by repair rather than by failure of repair, which is why it does
    not resolve with further waiting.
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  biological_processes:
  - preferred_term: neuron projection regeneration
    term:
      id: GO:0031102
      label: neuron projection regeneration
    modifier: DYSREGULATED
  downstream:
  - target: Persistent Functional Impairment of the Upper Limb
    causal_link_type: DIRECT
    description: >-
      Cocontraction limits usable motion independently of passive range.
    evidence:
    - reference: PMID:38263956
      reference_title: "Nerve Tracing in Juvenile Rats: A Feasible Model for the Study of Brachial Plexus Birth Palsy and Cocontractions?"
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "A number of these patients also suffer from cocontractions, preventing the use of an otherwise good passive range of motion in the shoulder."
      explanation: >-
        States precisely the dissociation this edge asserts, between passive range and
        usable function. Graded MODEL_ORGANISM because the sentence is the background
        framing of a juvenile-rat study, in keeping with the publication it comes from
        rather than with the claim it makes, and INDIRECT for the same reason.
  evidence:
  - reference: PMID:38263956
    reference_title: "Nerve Tracing in Juvenile Rats: A Feasible Model for the Study of Brachial Plexus Birth Palsy and Cocontractions?"
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "A number of these patients also suffer from cocontractions, preventing the use of an otherwise good passive range of motion in the shoulder."
    explanation: >-
      Establishes cocontraction as a recognised component of the residual disability.
      Graded MODEL_ORGANISM: the claim is about patients but the publication is a
      juvenile-rat model study, and evidence_source classifies the publication.
- name: Shoulder Internal Rotation Contracture
  biological_scale: TISSUE
  description: >-
    The convergence point of the two muscle routes, and the lesion that most subsequent
    treatment is aimed at. In the rat model every animal developed it within four weeks
    of the C5-C6 lesion, which is the consistency that two independently sufficient
    causes would predict.
  locations:
  - preferred_term: shoulder joint
    term:
      id: UBERON:0016884
      label: shoulder joint
  downstream:
  - target: Limited passive shoulder external rotation
    causal_link_type: DIRECT
    description: >-
      The contracture is measured as loss of passive external rotation.
  - target: Glenohumeral Dysplasia
    causal_link_type: DIRECT
    description: >-
      Sustained abnormal force across a growing joint remodels its shape. In the rat
      model, glenoid version moved from retroversion to anteversion with pseudoglenoid
      formation over the same interval.
    evidence:
    - reference: PMID:18343282
      reference_title: "Brachial plexus birth palsy-associated shoulder deformity: a rat model study."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Glenoid version changed from 2 degrees +/- 2 of retroversion (left side) to 8 degrees +/- 3 of anteversion."
      explanation: >-
        Measures the bony remodelling that follows the contracture in the model. Graded
        INDIRECT: the human counterpart is observed cross-sectionally rather than
        followed from contracture to deformity in the same subjects.
  evidence:
  - reference: PMID:18343282
    reference_title: "Brachial plexus birth palsy-associated shoulder deformity: a rat model study."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "RESULTS: All animals developed shoulder internal rotation contracture within 4 weeks after the C5, C6 neurotomy."
    explanation: >-
      Establishes the contracture as an obligate rather than occasional consequence of
      the lesion in the model, on a defined timescale.
- name: Glenohumeral Dysplasia
  biological_scale: TISSUE
  description: >-
    Progressive deformity of the glenoid and humeral head with posterior subluxation,
    developing under the sustained abnormal forces of the contracture while the joint is
    still growing. Found in roughly half of permanent cases, and the reason surveillance
    of the shoulder continues after the nerve lesion has stopped changing.
  locations:
  - preferred_term: shoulder joint
    term:
      id: UBERON:0016884
      label: shoulder joint
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  downstream:
  - target: Glenoid deformity with posterior humeral head subluxation
    causal_link_type: DIRECT
    description: >-
      The imaging and operative finding that the dysplasia node names.
  - target: Persistent Functional Impairment of the Upper Limb
    causal_link_type: DIRECT
    description: >-
      Once the joint surfaces are deformed, function is limited by joint geometry rather
      than by nerve or muscle, which is why secondary orthopaedic procedures rather than
      nerve surgery are what address it.
  evidence:
  - reference: PMID:37503533
    reference_title: "Permanent Brachial Plexus Birth Injury: Helsinki Shoulder Protocol."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Shoulder dysplasia was diagnosed in 49% of 270 patients with permanent brachial plexus birth injury in our catchment area from 1995 to 2021."
    explanation: >-
      Gives the human frequency with its denominator and catchment, which is what makes
      it a population figure rather than a case-series impression.
  - reference: PMID:37503533
    reference_title: "Permanent Brachial Plexus Birth Injury: Helsinki Shoulder Protocol."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The age at detection of shoulder dysplasia dropped from mean 5.4 years in children born before 2000 to mean 3.9 months in children born after 2009."
    explanation: >-
      Shows that the age at which dysplasia is found is a property of surveillance
      practice rather than of the disease, which matters when reading older series.
- name: Persistent Functional Impairment of the Upper Limb
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint in the minority who do not recover: a weak, internally rotated
    limb with limited abduction and external rotation, sometimes with elbow-flexion and
    forearm-supination deformity, and with usable motion further limited by
    cocontraction.
  downstream:
  - target: Elbow flexion contracture
    causal_link_type: DIRECT
    description: >-
      A recognised sequela of the persisting impairment, established late enough that it
      is treated as a fixed deformity rather than as part of the initial palsy.
  evidence:
  - reference: PMID:40958300
    reference_title: "Long-term outcomes and effectiveness of interventions in neonatal brachial plexus palsy: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Functional recovery varied by surgical approach, with nerve grafts and transfers showing significant improvements in upper limb mobility and strength."
    explanation: >-
      Establishes that the residual impairment is a mobility-and-strength deficit that
      intervention can move, which is what makes it the endpoint of this chain.

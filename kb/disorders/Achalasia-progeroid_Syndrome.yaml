- name: Alternative Splicing to a Stable Truncated BUD13 Protein
  description: >-
    The nonsense substitution causes alternative splicing of BUD13 transcripts,
    producing a stable truncated protein instead of no protein. Its expression
    level differs between affected individuals and tracks disease expression and
    life expectancy, which the authors interpret as the residual function that
    sets severity and survival. Patient cells are therefore BUD13-deficient
    rather than BUD13-null. The node carries no outgoing causal edge on
    purpose: the truncated protein limits the downstream defects rather than
    causing them, and the schema has no edge type for a severity modifier, so
    the defects hang from the variant node and this node records the
    modulation.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: BUD13
    term:
      id: hgnc:28199
      label: BUD13
  evidence:
  - reference: PMID:35670808
    reference_title: "Alternative splicing of BUD13 determines the severity of a developmental disorder with lipodystrophy and progeroid features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The nucleotide substitution caused alternative splicing of BUD13 leading to a stable truncated protein whose expression positively correlated with disease expression and life expectancy."
    explanation: Describes the truncated product and its association with severity and survival.
  - reference: PMID:35670808
    reference_title: "Alternative splicing of BUD13 determines the severity of a developmental disorder with lipodystrophy and progeroid features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "thereby probably determining the severity of the disease and the survival of affected individuals"
    explanation: The authors attribute severity and survival to the alternative splice product, as a probable rather than proven effect.
- name: Defective RES Complex Splicing with Elevated Intron Retention
  description: >-
    BUD13 is a subunit of the RES complex, which in vertebrates is required for
    efficient splicing of a subset of short, GC-rich introns. Patient dermal
    fibroblasts show elevated intron retention. Loss of bud13 or the other RES
    subunits in zebrafish causes a global intron-splicing defect, and BUD13
    deficiency in macrophages increases retention of BUD13-dependent introns and
    reduces the corresponding mature transcripts.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: BUD13
    term:
      id: hgnc:28199
      label: BUD13

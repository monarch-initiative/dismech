progression:
- phase: Childhood course
  age_range: Childhood
  notes: >-
    The course splits into two groups. Three of the five reported individuals
    (A1, A2 and A3) had stunted growth and intellectual disability and died
    within the first decade of life. The other two (A4 and A5) survived into
    adulthood with normal intellectual development. Mortality is recorded here
    rather than as a phenotype because HP:0003819 "Death in childhood" lies
    under Clinical modifier, outside the phenotypic abnormality branch the
    phenotype slot accepts. Ages and causes of death are not given in the
    abstract.
  evidence:

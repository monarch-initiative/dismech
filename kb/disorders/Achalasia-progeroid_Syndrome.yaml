animal_models:
- name: Zebrafish bud13 loss-of-function mutant
  species: Zebrafish
  genotype: bud13 CRISPR-Cas9 7-nucleotide deletion, homozygous
  publication: PMID:29969449
  modeled_mechanisms:
  - target: Defective RES Complex Splicing with Elevated Intron Retention
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: MOLECULAR
    description: >-
      Recapitulates the RES-dependent intron splicing defect, with embryonic
      neural degeneration and death by 4 to 5 days post-fertilization.
    limitations: >-
      The mutant is a functional null, whereas the human allele is hypomorphic
      because of the stable truncated isoform, so the model shows the direction
      of the splicing defect but not its human severity. It dies as an embryo,
      so lipodystrophy, achalasia, corneal and hearing phenotypes cannot be
      assessed.
    evidence:
    - reference: PMID:29969449
      reference_title: "RES complex is associated with intron definition and required for zebrafish early embryogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Transcriptomic analysis of bud13, snip1 (pml1) and rbmx2 (snu17) mutants revealed a global defect in intron splicing, with strong mis-splicing of a subset of introns."
      explanation: The model shows the RES-dependent splicing defect.
    - reference: PMID:29969449
      reference_title: "RES complex is associated with intron definition and required for zebrafish early embryogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The embryo progressively degenerates and mutants die by 4–5 dpf."
      explanation: Embryonic lethality limits the model to early developmental phenotypes.

name: Achalasia-Progeroid Syndrome
creation_date: "2026-10-17T03:15:00Z"
category: Mendelian
description: >-
  Achalasia-progeroid syndrome is an autosomal recessive multisystem disorder
  with prominent lipodystrophy, a characteristic facial appearance, corneal
  clouding, achalasia and progressive hearing loss, caused by biallelic variants
  in BUD13, a component of the spliceosomal retention and splicing (RES)
  complex. The published cohort is five individuals who all carry the same
  homozygous nonsense variant. Severity varies sharply within that cohort:
  three had stunted growth and intellectual disability and died within the
  first decade of life, while two are adults with normal intellectual
  development. The nonsense allele is not a simple null. It also causes
  alternative splicing of BUD13 that yields a stable truncated protein, and the
  amount of this protein tracks disease severity and survival, so the
  alternative splice product is thought to turn a loss-of-function allele into a
  hypomorphic one. Patient fibroblasts show elevated intron retention, a global
  reduction of spliceosomal proteins and nuclei with multiple envelope
  invaginations, all more marked in the severely affected individuals, and
  overexpression of either BUD13 isoform normalizes nuclear shape. How the
  splicing defect produces lipodystrophy, achalasia, corneal clouding or hearing
  loss has not been established.
parents:
- Genetic Disease
synonyms:
- ACHPS
- BUD13-related progeroid syndrome
- developmental disorder with lipodystrophy and progeroid features
notes: >-
  All clinical and cellular content derives from one primary report of five
  individuals (PMID:35670808). Only its abstract is freely available (no PMC or
  Europe PMC full text), so phenotype frequencies are recorded only where the
  abstract states a count, and features the abstract does not name (for example
  cataract, hypotonia or neuropathy) are not curated. MedGen (C6012702, read
  2026-10-17) lists 26 HPO features for the disease, including cataract,
  retinal dystrophy, sensorineural hearing loss, demyelinating sensory
  neuropathy, microcephaly and aortic and mitral regurgitation; these need a
  quotable source before they can be added. The abstract describes a
  "typical facial appearance" without naming its components, so no facial
  phenotype is bound; the progeroid designation rests on the disease name and
  the report's title. Searches of PubMed (BUD13 with progeroid, achalasia,
  lipodystrophy, variant or patient) and Europe PMC (BUD13 with progeroid,
  achalasia, lipodystrophy or nuclear envelope; Bud13 with mouse, knockout,
  chimera or lipoatrophy) on 2026-10-17 returned no further patients and no
  published mouse model. MONDO:0700300 cross-references OMIM:621123 and names
  BUD13 as its causal gene. No treatment, surveillance protocol or clinical
  trial has been published, so the entry has no treatments section.

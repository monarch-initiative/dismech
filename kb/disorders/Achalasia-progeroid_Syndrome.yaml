  evidence:
  - reference: PMID:35670808
    reference_title: "Alternative splicing of BUD13 determines the severity of a developmental disorder with lipodystrophy and progeroid features."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In dermal fibroblasts, we found elevated intron retention, a global reduction of spliceosomal proteins, and nuclei with multiple invaginations, which were more pronounced in A1, A2, and A3."
    explanation: Elevated intron retention in patient fibroblasts.
  - reference: PMID:29969449
    reference_title: "RES complex is associated with intron definition and required for zebrafish early embryogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Transcriptomic analysis of bud13, snip1 (pml1) and rbmx2 (snu17) mutants revealed a global defect in intron splicing, with strong mis-splicing of a subset of introns."
    explanation: >-
      Vertebrate loss-of-function evidence that bud13 is required for normal
      intron splicing. The zebrafish mutants are functional nulls, not
      hypomorphs, so they show the direction of the defect, not its human size.
  - reference: PMID:30639243
    reference_title: "BUD13 Promotes a Type I Interferon Response by Countering Intron Retention in Irf7."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Global analysis of BUD13 knockdown and BUD13 cross-linking to RNA revealed a subset of introns that share many characteristics with the one found in Irf7 and are spliced in a BUD13-dependent manner. Deficiency of BUD13 led to decreased mature transcript from genes containing such introns."
    explanation: BUD13 deficiency increases retention of a defined intron subset and lowers the mature transcripts.
  - reference: PMID:30639243
    reference_title: "BUD13 Promotes a Type I Interferon Response by Countering Intron Retention in Irf7."
    supports: SUPPORT
    evidence_source: IN_VITRO

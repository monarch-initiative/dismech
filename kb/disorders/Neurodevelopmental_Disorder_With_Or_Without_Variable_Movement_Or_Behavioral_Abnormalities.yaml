- name: Altered Neuronal Afterhyperpolarization and Firing
  description: >-
    SK channels carry part of the afterhyperpolarization that follows action
    potentials and so set neuronal firing patterns. In the frissonnant Kcnn2
    mouse, central vestibular neurons show lasting changes in
    afterhyperpolarization and firing. Neuronal firing has not been studied in
    patient-derived cells.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: regulation of action potential firing pattern
    modifier: ABNORMAL
    term:
      id: GO:0099608
      label: regulation of action potential firing pattern
  evidence:
  - reference: PMID:18604572
    reference_title: Behavioral effects of a deletion in Kcnn2, the gene encoding the SK2 subunit of small-conductance Ca2+-activated K+ channels.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Intracellular electrophysiological recordings of central vestibular
      neurons revealed permanent alterations of the AHP and firing behavior that
      might cause the tremor and associated locomotor deficits.
    explanation: Measured afterhyperpolarization and firing changes in Kcnn2 mutant mouse neurons.
  - reference: PMID:18604572
    reference_title: Behavioral effects of a deletion in Kcnn2, the gene encoding the SK2 subunit of small-conductance Ca2+-activated K+ channels.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: OTHER
    snippet: >-
      Small-conductance Ca(2+)-activated potassium (SK) channels are heteromeric
      complexes of SK alpha-subunits and calmodulin that modulate membrane
      excitability, are responsible for part of the after-hyperpolarization
      (AHP) following action potentials, and thus control the firing patterns
      and excitability of most central neurons.
    explanation: Background statement of the normal role of SK channels in neuronal firing.
  - reference: PMID:37466411
    reference_title: "K(Ca) 2.2 (KCNN2): A physiologically and therapeutically important potassium channel."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      KCa 2.x channels inhibit excitatory postsynaptic potentials (EPSPs) in
      neuronal dendrites and contribute to the medium afterhyperpolarization
      (mAHP) that follows the action potential bursts.
    explanation: >-
      Review synthesis of the normal physiological role of SK channels, the
      function lost when SK2 current is reduced.
  downstream:
  - target: Tremor
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18604572
      reference_title: Behavioral effects of a deletion in Kcnn2, the gene encoding the SK2 subunit of small-conductance Ca2+-activated K+ channels.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Intracellular electrophysiological recordings of central vestibular
        neurons revealed permanent alterations of the AHP and firing behavior
        that might cause the tremor and associated locomotor deficits.
      explanation: >-
        The authors propose, without testing it, that the firing changes cause
        the mouse tremor; indirect and hedged.
  - target: Ataxia
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18604572
      reference_title: Behavioral effects of a deletion in Kcnn2, the gene encoding the SK2 subunit of small-conductance Ca2+-activated K+ channels.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Intracellular electrophysiological recordings of central vestibular
        neurons revealed permanent alterations of the AHP and firing behavior
        that might cause the tremor and associated locomotor deficits.
      explanation: >-
        The proposed link from altered firing to locomotor deficits in the
        mouse is the closest available support for the ataxia edge; indirect
        and hedged.

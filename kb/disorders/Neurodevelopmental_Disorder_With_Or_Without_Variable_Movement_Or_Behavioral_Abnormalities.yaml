- name: In vitro functional testing of variants
  description: >-
    Patch-clamp recording of variant SK2 channels in heterologous cells has
    been used to classify variants; one variant tested in the founding series
    did not show loss of function and was reclassified as of uncertain
    significance. This is a research assay, not a routine clinical test.
  evidence:
  - reference: PMID:33242881
    reference_title: Variants in the SK2 channel gene (KCNN2) lead to dominant neurodevelopmental movement disorders.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We investigated the functional impact of six selected variants on SK2
      channel function using the patch-clamp technique.
    explanation: Patch clamp was used to assess variant pathogenicity.

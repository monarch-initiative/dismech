name: Neurodevelopmental Disorder With Or Without Variable Movement Or Behavioral Abnormalities
creation_date: '2026-10-25T00:00:00Z'
category: Mendelian
synonyms:
- KCNN2-related neurodevelopmental disorder
- NEDMAB
description: >-
  Autosomal dominant neurodevelopmental disorder caused by heterozygous, mostly
  de novo variants in KCNN2, which encodes SK2 (KCa2.2), a small-conductance
  calcium-activated potassium channel gated by calcium-calmodulin. Most variants
  tested in heterologous cells abolish or reduce SK2 current, and the disorder is
  thought to arise from KCNN2 haploinsufficiency, although some pore variants
  suppress the co-expressed wild-type channel in vitro. Affected children have
  motor and language developmental delay and intellectual disability that ranges
  from mild to severe, often with early-onset movement disorders (cerebellar
  ataxia, tremor, myoclonus, dystonia, chorea or tics) and behavioral features
  such as autism spectrum disorder and anxiety. Periventricular white matter
  hyperintensities are seen in about half of imaged patients. Milder
  presentations without intellectual disability, such as a specific learning
  disorder, have been reported. Spontaneous Kcnn2 mutant mice and rats show
  early-onset tremor and locomotor instability.
disease_term:
  preferred_term: neurodevelopmental disorder with or without variable movement or behavioral abnormalities
  term:
    id: MONDO:0859225
    label: neurodevelopmental disorder with or without variable movement or behavioral abnormalities
parents:
- Neurodevelopmental Disorder
notes: >-
  OMIM 619725. KCNN2 variants are also the cause of a separately catalogued
  allelic condition, myoclonic dystonia 34 (DYT34; MONDO:0030538), first
  described in a three-generation family with tremulous myoclonus-dystonia
  carrying p.Gly371Glu (PMID:32212350). MONDO and OMIM keep the two apart, and
  this entry covers only the neurodevelopmental presentation; the
  myoclonus-dystonia case reports and their deep brain stimulation outcomes
  belong with DYT34. The boundary is clinically blurred: patients with
  developmental delay can show myoclonus-dystonia-like movement disorders, and
  myoclonus-dystonia families can include members with cognitive or psychiatric
  features. No GeneReviews chapter covers this disorder. No disease-specific
  therapy has been reported.
inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous variants, most arising de novo, with one reported family in
    which a missense variant was inherited from an affected mother.
  inheritance_term:
    preferred_term: autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:33242881
    reference_title: Variants in the SK2 channel gene (KCNN2) lead to dominant neurodevelopmental movement disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This discovery prompted us to collect data from nine additional patients
      with de novo KCNN2 variants (one nonsense, one splice site, six missense
      variants and one in-frame deletion) and one family with a missense variant
      inherited from the affected mother.
    explanation: >-
      The founding series consists of de novo heterozygous variants plus one
      family with mother-to-child transmission.
  - reference: PMID:33242881
    reference_title: Variants in the SK2 channel gene (KCNN2) lead to dominant neurodevelopmental movement disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Altogether, our findings provide evidence that heterozygous variants,
      likely causing a haploinsufficiency of the KCNN2 gene, lead to novel
      autosomal dominant neurodevelopmental movement disorders mirroring
      phenotypes previously described in rodents.
    explanation: The authors conclude the disorder is autosomal dominant.
pathophysiology:
- name: Heterozygous KCNN2 Loss of Function
  description: >-
    Heterozygous KCNN2 variants (frameshift, nonsense, splice site, in-frame
    deletion and missense) reduce SK2 channel activity. Five of six variants
    tested by patch clamp in the founding series caused loss of function. In
    HEK293 cells, channels carrying pathogenic missense changes give no
    measurable current, and pore-lining mutants also suppress co-expressed
    wild-type SK2, so a dominant-negative effect may add to haploinsufficiency
    for some missense alleles. In a C. elegans knock-in study most disease
    variants behaved as loss of function, but I359M behaved as gain of function,
    so the direction of effect is not settled for every allele.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: KCNN2
    term:
      id: hgnc:6291
      label: KCNN2
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: small conductance calcium-activated potassium channel activity
    modifier: DECREASED
    term:
      id: GO:0016286
      label: small conductance calcium-activated potassium channel activity
  evidence:
  - reference: PMID:33242881
    reference_title: Variants in the SK2 channel gene (KCNN2) lead to dominant neurodevelopmental movement disorders.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      All variants tested but one, which was reclassified to uncertain
      significance, led to a loss-of-function of SK2 channels.
    explanation: Patch-clamp testing of patient variants showed loss of SK2 channel function.
  - reference: PMID:36717104
    reference_title: Loss-of-function K(Ca)2.2 mutations abolish channel activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      No measurable current was detected from HEK293 cells heterologously
      expressing these pathogenic KCa2.2 mutants.
    explanation: >-
      Disease-associated mutations introduced into rat KCa2.2 abolish channel
      current in a heterologous cell system.
  - reference: PMID:37466411
    reference_title: "K(Ca) 2.2 (KCNN2): A physiologically and therapeutically important potassium channel."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Studies have revealed that autosomal dominant neurodevelopmental movement
      disorders resembling rodent symptoms are caused by heterozygous
      loss-of-function mutations, which are most likely to induce KCNN2
      haploinsufficiency.
    explanation: Review synthesis attributing the disorder to KCNN2 haploinsufficiency.
  - reference: PMID:36717104
    reference_title: Loss-of-function K(Ca)2.2 mutations abolish channel activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      When coexpressed with the KCa2.2_WT channel, mutations of the pore-lining
      amino acid residues (I360M, Y362C, G363S, and I389V) and two proline
      substitutions (L174P and L433P) dominant negatively suppressed and
      completely abolished the activity of the coexpressed KCa2.2_WT channel.
    explanation: >-
      Some missense mutants also suppress wild-type channel activity, so
      heterozygous carriers may lose more than half of SK2 current.
  - reference: PMID:36717104
    reference_title: Loss-of-function K(Ca)2.2 mutations abolish channel activity.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Coexpression of the KCa2.2_I289N and the KCa2.2_WT channels reduced the
      apparent Ca2+ sensitivity compared with the KCa2.2_WT channel, which was
      rescued by a KCa2.2 positive modulator.
    explanation: >-
      The rat tremor allele I289N lowers the calcium sensitivity of
      heteromeric channels, a defect reversed in vitro by a positive
      modulator; no such compound has been tried in patients.
  - reference: PMID:41040851
    reference_title: Functional validation of human SK channels variants causing NEDMAB and Zimmermann-Laband syndrome-3 in C. elegans.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      NEDMAB mutations exhibited more complex phenotypic effects. Most caused a
      loss-of-function phenotype, indistinguishable from null mutants, while one
      displayed a clear gain-of-function effect.
    explanation: >-
      Most variants knocked into the worm orthologue KCNL-1 behave as loss of
      function.
  - reference: PMID:41040851
    reference_title: Functional validation of human SK channels variants causing NEDMAB and Zimmermann-Laband syndrome-3 in C. elegans.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Strikingly, the I359M NEDMAB mutation caused gain-of-function and not
      loss-of-function effects.
    explanation: >-
      One patient variant behaved as gain of function in the worm orthologue,
      contradicting a uniform loss-of-function model for every allele.
  downstream:
  - target: Altered Neuronal Afterhyperpolarization and Firing
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:18604572
      reference_title: Behavioral effects of a deletion in Kcnn2, the gene encoding the SK2 subunit of small-conductance Ca2+-activated K+ channels.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Intracellular electrophysiological recordings of central vestibular
        neurons revealed permanent alterations of the AHP and firing behavior
        that might cause the tremor and associated locomotor deficits.
      explanation: >-
        In the frissonnant mouse, whose Kcnn2 deletion removes normal
        transcripts, central neurons show altered afterhyperpolarization and
        firing; indirect because it is a mouse model with a complete loss of
        normal transcript rather than human heterozygosity.

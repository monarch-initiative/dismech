  evidence:
  - reference: PMID:33242881
    reference_title: Variants in the SK2 channel gene (KCNN2) lead to dominant neurodevelopmental movement disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using exome sequencing, we identified a de novo KCNN2 frameshift deletion
      in a patient with learning disabilities, cerebellar ataxia and white matter
      abnormalities on brain MRI.
    explanation: Exome sequencing identified the first patient's de novo variant.

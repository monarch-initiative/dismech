    reference_title: Exome sequencing in severe non-syndromic specific learning and language disorders in a French cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient 7 had a de novo missense variant in the KCNN2 gene, which is
      associated with neurodevelopmental disorder with or without variable

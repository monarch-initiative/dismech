- name: FGF23-mediated renal phosphate wasting
  subtypes:
  - ENPP1-related
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    ENPP1-related survivor disease includes elevated intact FGF23 with inverse
    phosphate-FGF23 coupling, producing phosphate wasting and hypophosphatemic
    rickets.
  biological_processes:
  - preferred_term: phosphate ion homeostasis
    modifier: ABNORMAL
    term:
      id: GO:0055062
      label: phosphate ion homeostasis
  chemical_entities:
  - preferred_term: phosphate
    modifier: DECREASED
    term:
      id: CHEBI:26020
      label: phosphate
  evidence:
  - reference: PMID:33005041
    reference_title: Prospective phenotyping of long-term survivors of generalized arterial calcification of infancy (GACI).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals with ENPP1 deficiency either had hypophosphatemic rickets or were
      predicted to develop it by 14 years of age; 14/16 had elevated intact FGF23
      levels (iFGF23).
    explanation: This supports elevated FGF23 and rickets risk in ENPP1-deficient GACI survivors.
  - reference: PMID:33005041
    reference_title: Prospective phenotyping of long-term survivors of generalized arterial calcification of infancy (GACI).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Blood phosphate levels correlated inversely with iFGF23.
    explanation: This supports phosphate-FGF23 coupling in ENPP1-related survivor disease.
  downstream:
  - target: Hypophosphatemic rickets
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Renal phosphate wasting and chronic hypophosphatemia
    description: FGF23-associated renal phosphate depletion impairs skeletal mineralization and produces hypophosphatemic rickets.
    evidence:
    - reference: PMID:24008425
      reference_title: "Mutations in the ABCC6 gene as a cause of generalized arterial calcification of infancy: genotypic overlap with pseudoxanthoma elasticum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Hypophosphatemia is assumed to be mediated by elevated plasma levels of the phosphatonin FGF23, which inhibits expression and internalization of the renal sodium-phosphate cotransporters SLC34A1 and SLC34A3 and inhibits synthesis of 1.25-dihydroxyvitamin D.
      explanation: >-
        This supplies the known renal phosphate-handling intermediates between
        elevated FGF23 and the hypophosphatemic skeletal phenotype.
- name: ENPP1-related auditory dysfunction of uncertain mechanism
  subtypes:
  - ENPP1-related
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: >-
    Long-term ENPP1-deficient GACI survivors have high lifetime risk of hearing
    loss. The affected auditory compartment and the causal molecular bridge
    from ENPP1 deficiency remain insufficiently established, so no specific
    hair-cell mechanism is asserted.
  evidence:
  - reference: PMID:33005041
    reference_title: Prospective phenotyping of long-term survivors of generalized arterial calcification of infancy (GACI).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For ENPP1-deficient individuals, the lifetime risk of cervical spine fusion
      was 25%, that of hearing loss was 75%, and the main morbidity in adults was
      related to enthesis calcification.
    explanation: The prospective survivor cohort quantifies hearing loss risk in ENPP1 deficiency.
  downstream:
  - target: Hearing loss
    causal_link_type: UNKNOWN
    description: >-
      Hearing loss is a frequent ENPP1-survivor association, but its directness
      and intermediates are not established.
    evidence:
    - reference: PMID:33005041
      reference_title: Prospective phenotyping of long-term survivors of generalized arterial calcification of infancy (GACI).
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        For ENPP1-deficient individuals, the lifetime risk of cervical spine fusion
        was 25%, that of hearing loss was 75%, and the main morbidity in adults was
        related to enthesis calcification.
      explanation: >-
        The prospective survivor cohort establishes the association and its
        frequency, but not a causal auditory mechanism.

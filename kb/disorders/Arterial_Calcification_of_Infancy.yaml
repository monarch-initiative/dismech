name: Arterial Calcification of Infancy
creation_date: "2026-05-05T15:37:54Z"
description: >-
  Arterial calcification of infancy, also called generalized arterial
  calcification of infancy, is an ultra-rare autosomal recessive disorder marked
  by ectopic mineralization and stenosis of arteries in fetal life or infancy.
  Most cases are associated with loss-of-function ENPP1 variants and a smaller
  fraction with ABCC6 variants, disrupting extracellular pyrophosphate-mediated
  inhibition of hydroxyapatite deposition.
category: Mendelian
disease_term:
  preferred_term: arterial calcification of infancy
  term:
    id: MONDO:0018870
    label: arterial calcification of infancy
parents:
- Vascular disorder
synonyms:
- Generalized arterial calcification of infancy
- GACI
- Idiopathic infantile arterial calcification
- Infantile arteriosclerosis
has_subtypes:
- name: ENPP1-related
  display_name: ENPP1-related arterial calcification of infancy
  description: >-
    Arterial calcification of infancy caused by biallelic pathogenic variants
    in ENPP1; described in OMIM as GACI1/OMIM:208000. ENPP1 is the major
    established disease gene, but the estimate below comes from reported cases
    and should not be treated as a population frequency.
  subtype_frequency: "~67% of reported GACI cases"
  genes:
  - preferred_term: ENPP1
    term:
      id: hgnc:3356
      label: ENPP1
  evidence:
  - reference: PMID:33005041
    reference_title: Prospective phenotyping of long-term survivors of generalized arterial calcification of infancy (GACI).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 67% of cases, GACI is caused by biallelic inactivating variants in ENPP1
      (ectonucleotide pyrophosphatase/phosphodiesterase 1)
    explanation: >-
      The survivor-cohort report identifies biallelic ENPP1 inactivation as the
      major reported genetic basis of GACI.
- name: ABCC6-related
  display_name: ABCC6-related arterial calcification of infancy
  description: >-
    Arterial calcification of infancy caused by biallelic pathogenic variants
    in ABCC6; described in OMIM as GACI2/OMIM:614473. This is a minority
    molecular subtype with phenotypic overlap with pseudoxanthoma elasticum.
  subtype_frequency: "~9% of reported GACI cases"
  genes:
  - preferred_term: ABCC6
    term:
      id: hgnc:57
      label: ABCC6
  evidence:
  - reference: PMID:33005041
    reference_title: Prospective phenotyping of long-term survivors of generalized arterial calcification of infancy (GACI).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 9% of cases, GACI results from biallelic inactivating variants in ABCC6,
      which encodes a plasma membrane transporter highly expressed in the liver
    explanation: >-
      The report identifies biallelic ABCC6 inactivation as a smaller reported
      molecular subtype of GACI.

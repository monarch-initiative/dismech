      results when initiated within 2 weeks of birth.
    explanation: >-
      The natural-history analysis directly establishes uncertainty about
      survival benefit despite earlier favorable reports.
  - reference: PMID:32172442
    reference_title: "Generalized Arterial Calcification of Infancy: New Insights, Controversies, and Approach to Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical data is limited to small, retrospective samples; it is therefore
      unknown whether commonly used medications, such as bisphosphonates and
      hypophosphatemia treatment, are therapeutic or potentially harmful.
    explanation: The review explicitly frames benefit versus harm as unresolved.

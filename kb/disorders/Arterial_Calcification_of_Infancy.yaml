prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: ULTRA_RARE
  notes: >-
    Contemporary review literature describes GACI as ultra-rare; no
    population-level prevalence estimate is asserted here because the ENPP1
    deficiency spectrum extends beyond the infantile vascular presentation.
  evidence:
  - reference: PMID:39343469
    reference_title: Generalized Arterial Calcification of Infancy (GACI).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Generalized arterial calcification of infancy (GACI) is an ultra-rare autosomal
      recessive disorder associated with pathogenic variants in ENPP1, the major gene
      involved in this condition, and in ABCC6, which is involved in a small fraction
      of affected individuals.
    explanation: The contemporary review explicitly describes GACI as ultra-rare.
progression:
- phase: Critical fetal and early-infantile vascular phase
  age_range: Fetal life through the first 6 months after birth
  notes: >-
    Severe diffuse arterial disease can cause fetal loss, early myocardial or
    cerebral ischemic events, heart failure, and death. Ascertainment is
    enriched for severe cases, but the first six months are the clearest
    high-risk period in the published natural-history series.
  evidence:
  - reference: PMID:34355424
    reference_title: "Ectopic Calcification and Hypophosphatemic Rickets: Natural History of ENPP1 and ABCC6 Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall mortality was 54.7% (13.4% in utero or stillborn), with a 50.4%
      probability of death before the age of 6 months (critical period).
    explanation: >-
      The international natural-history review identifies fetal mortality and
      the first six months as the critical mortality window.
- phase: Survivor multisystem phase
  age_range: Later infancy through adulthood
  notes: >-
    Arterial calcification may regress or leave limited residual imaging
    involvement, while ENPP1-deficient survivors commonly develop
    FGF23-associated hypophosphatemic rickets and may develop hearing loss,
    cervical fusion, enthesis calcification, and PXE-like findings. These later
    complications are not uniformly shared by the ABCC6 subtype.
  evidence:
  - reference: PMID:33005041
    reference_title: Prospective phenotyping of long-term survivors of generalized arterial calcification of infancy (GACI).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sixteen of 20 subjects presented with arterial calcifications, but only 5
      had residual involvement at the time of evaluation. Individuals with ENPP1
      deficiency either had hypophosphatemic rickets or were predicted to develop it
      by 14 years of age; 14/16 had elevated intact FGF23 levels (iFGF23).
    explanation: >-
      Prospective survivor phenotyping supports evolution from the infantile
      vascular presentation to later ENPP1-related mineral disease.

review_notes: >-
  Deep-research reports were treated as leads. Suggested prenatal findings such
  as hydrops fetalis and polyhydramnios were not normalized as phenotypes because
  the reviewed caches did not provide suitable exact primary text for those
  claims. The ENPP1/ABCC6 identity, OMIM subtype labels, current trial status,
  and all retained evidence snippets were independently checked. The GACI
  GeneReview was added as a tagged reference. ENPP1-related cervical fusion and
  enthesis calcification were normalized as separate phenotypes; the latter uses
  HPO's broader enthesis-abnormality concept because no calcification-specific
  HPO term is available. The two OMIM subtype records are captured as structured
  external assertions rather than subtype_term values because subtype_term is
  restricted to MONDO/NCIT and MONDO has no separate molecular subtype classes
  for ENPP1- and ABCC6-related GACI.

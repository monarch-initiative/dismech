differential_diagnoses:
- name: Pseudoxanthoma Elasticum
  description: >-
    PXE and GACI share ABCC6/pyrophosphate-pathway biology and can overlap
    genetically. Classic PXE is generally a later-onset elastic-tissue disorder
    with characteristic skin and retinal disease, whereas GACI is defined by
    congenital or infantile diffuse arterial calcification and stenosis.
  distinguishing_features:
  - Congenital or infantile diffuse arterial calcification and stenosis favors GACI.
  - Yellow papules, angioid streaks, and a later-onset elastic-tissue phenotype favor classic PXE.
  - ENPP1 is the major GACI gene; ABCC6 can cause either phenotype, so molecular results must be interpreted with presentation and age.
  evidence:
  - reference: PMID:24008425
    reference_title: "Mutations in the ABCC6 gene as a cause of generalized arterial calcification of infancy: genotypic overlap with pseudoxanthoma elasticum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A recent report described two siblings with identical ABCC6 gene mutations that led to classical PXE in the older brother and a phenotype similar to GACI in the younger brother
    explanation: >-
      Identical ABCC6 genotypes can produce PXE-like or GACI-like phenotypes,
      establishing the clinically important overlap.
discussions:
- discussion_id: bisphosphonate_outcome_uncertainty
  prompt: >-
    Do early bisphosphonates improve survival or durable vascular outcomes in
    GACI, and which agent, dose, timing, and duration offer net benefit without
    worsening skeletal mineralization?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - treatments#Bisphosphonate therapy
  - pathophysiology#Arterial calcification and stenosis
  rationale: >-
    Case reports describe apparent responses, but the largest start-time-matched
    natural-history analysis found no survival benefit and treatment regimens
    remain unstandardized. Confounding by indication and survivor bias make
    uncontrolled improvement difficult to interpret.
  evidence:
  - reference: PMID:34355424
    reference_title: "Ectopic Calcification and Hypophosphatemic Rickets: Natural History of ENPP1 and ABCC6 Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Contrary to previous publications, we found that bisphosphonate treatment had

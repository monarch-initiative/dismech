pathophysiology:
- name: Extracellular pyrophosphate anti-mineralization failure
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    ENPP1 or ABCC6 loss of function perturbs extracellular pyrophosphate and
    phosphate balance, reducing anti-mineralization capacity and promoting
    hydroxyapatite deposition in arteries and soft tissues.
  genes:
  - preferred_term: ENPP1
    term:
      id: hgnc:3356
      label: ENPP1
  - preferred_term: ABCC6
    term:
      id: hgnc:57
      label: ABCC6
  biological_processes:
  - preferred_term: ectopic mineralization
    modifier: INCREASED
    term:
      id: GO:0031214
      label: biomineral tissue development
  evidence:
  - reference: PMID:39343469
    reference_title: Generalized Arterial Calcification of Infancy (GACI).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Loss-of-function pathogenic variants of ENPP1 and ABCC6 lead to perturbations
      in the PPi/Pi ratio, thereby promoting hydroxyapatite mineralization in peripheral
      tissues.
    explanation: This directly supports disrupted PPi/Pi balance and hydroxyapatite mineralization as the core mechanism.
  - reference: PMID:33005041
    reference_title: Prospective phenotyping of long-term survivors of generalized arterial calcification of infancy (GACI).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 67% of cases, GACI is caused by biallelic inactivating variants in ENPP1
      (ectonucleotide pyrophosphatase/phosphodiesterase 1),3 which encodes an enzyme
      that cleaves ATP into AMP and inorganic pyrophosphate (PPi) at the cell surface.
    explanation: This supports ENPP1 loss as direct impairment of extracellular ATP hydrolysis to AMP and PPi.
  - reference: PMID:33005041
    reference_title: Prospective phenotyping of long-term survivors of generalized arterial calcification of infancy (GACI).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While the exact molecule transported by ABCC6 into the extracellular space is
      uncertain, one candidate is ATP, a substrate for ENPP1 and thus a source of
      plasma PPi.
    explanation: This supports ABCC6 as an upstream contributor to extracellular ATP supply and PPi generation.
  downstream:
  - target: Arterial calcification and stenosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Hydroxyapatite deposition in the arterial internal elastic lamina
    description: >-
      Loss of the extracellular PPi anti-mineralization brake permits
      hydroxyapatite deposition; mineralized arterial walls and secondary
      remodeling produce the defining calcification and stenosis.
    evidence:
    - reference: PMID:39343469
      reference_title: Generalized Arterial Calcification of Infancy (GACI).
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Loss-of-function pathogenic variants of ENPP1 and ABCC6 lead to perturbations
        in the PPi/Pi ratio, thereby promoting hydroxyapatite mineralization in peripheral
        tissues.
      explanation: >-
        The review directly links ENPP1 or ABCC6 loss, PPi/Pi imbalance, and
        hydroxyapatite mineralization.
- name: Reduced AMP/adenosine signaling
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    ENPP1 deficiency can reduce AMP and downstream adenosine signaling in
    addition to reducing PPi. This parallel purinergic mechanism is proposed to
    drive myointimal proliferation and can contribute to stenosis even when
    overt calcification is less prominent.
  genes:
  - preferred_term: ENPP1
    term:
      id: hgnc:3356
      label: ENPP1
  evidence:
  - reference: PMID:33005041
    reference_title: Prospective phenotyping of long-term survivors of generalized arterial calcification of infancy (GACI).
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Specifically, intimal proliferation results from AMP or adenosine deficiency40
      and comprises part of the ENPP1-GACI phenotype.
    explanation: The cohort discussion supports AMP/adenosine deficiency as a plausible driver of intimal proliferation in ENPP1-related GACI.
  downstream:
  - target: Arterial calcification and stenosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Myointimal proliferation
    description: >-
      Deficient AMP/adenosine signaling is proposed to promote myointimal
      proliferation, narrowing muscular arteries alongside the mineralization
      branch.
    evidence:
    - reference: PMID:32172442
      reference_title: "Generalized Arterial Calcification of Infancy: New Insights, Controversies, and Approach to Management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Identification of causative ENPP1 mutations revealed that GACI
        arises from deficiencies in inorganic pyrophosphate (leading to calcifications)
        and adenosine monophosphate (leading to intimal proliferation).
      explanation: >-
        The review explicitly links AMP deficiency to intimal proliferation;
        the pathway remains provisional because direct human mechanistic data
        are limited.

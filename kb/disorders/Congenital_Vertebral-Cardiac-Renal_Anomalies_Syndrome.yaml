  - reference: PMID:34200361
    reference_title: "A Homozygous Deletion of Exon 5 of KYNU Resulting from a Maternal Chromosome 2 Isodisomy (UPD2) Causes Catel-Manzke-Syndrome/VCRL Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "High-resolution SNP array analysis subsequently delineated a
      maternal isodisomy of chromosome 2 (UPD2)."
    explanation: Documents uniparental isodisomy as a route to biallelic KYNU
      loss.
- name: NADSYN1
  gene_term:
    preferred_term: NADSYN1
    term:
      id: hgnc:29832
      label: NADSYN1
  presence: PRESENT
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  subtype: VCRL3
  notes: >-
    Encodes NAD synthetase 1. Variant deleteriousness is domain-dependent, and

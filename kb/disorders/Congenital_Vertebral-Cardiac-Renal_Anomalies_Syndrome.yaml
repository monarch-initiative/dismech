- name: Impaired Somitogenesis
  description: >-
    Vertebrae and ribs form from somites budding sequentially off the presomitic
    mesoderm during weeks 4 to 6 of human gestation. NAD deficiency during this
    window perturbs segmentation, producing the hemivertebrae, vertebral fusions
    and rib anomalies characteristic of the disorder. Because the defect is in
    the metabolic substrate rather than in the Notch segmentation clock itself,
    multiple non-adjacent segments are affected without the coordinated
    clock-lesion pattern seen in the spondylocostal dysostoses.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: somitogenesis
    modifier: ABNORMAL
    term:
      id: GO:0001756
      label: somitogenesis
  downstream:
  - target: Vertebral segmentation defects
    causal_link_type: DIRECT
  - target: Rib anomalies
    causal_link_type: DIRECT
  - target: Hemivertebrae
    causal_link_type: DIRECT
  - target: Vertebral fusion
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:34681008
    reference_title: "Disruptive NADSYN1 Variants Implicated in Congenital Vertebral Malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In human embryogenesis, the vertebral column develops at 4-6 weeks
      of gestation from the paraxial mesoderm (PSM) and is closely related to
      the spinal cord and other organs originating from mesoderm"
    explanation: Establishes the developmental window and tissue of origin in
      which the NAD deficit acts on the axial skeleton.
- name: Disrupted Cardiac Morphogenesis
  description: >-
    NAD deficiency during cardiac looping and septation produces structural
    heart disease. Lesions are not confined to one side of the heart, which
    distinguishes the pattern from the outflow-tract-restricted defects of the
    neural-crest cardiopathies.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: heart development
    modifier: ABNORMAL
    term:
      id: GO:0007507
      label: heart development
  downstream:

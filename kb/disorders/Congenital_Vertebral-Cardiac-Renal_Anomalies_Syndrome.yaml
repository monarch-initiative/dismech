inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All three CNDD genocopies require biallelic loss-of-function variants.
    Heterozygous carriers are clinically unaffected under adequate dietary NAD
    precursor intake, but mouse data show that maternal heterozygosity combined
    with dietary vitamin B3 restriction is sufficient to cause malformations,
    so carrier status is not phenotypically inert under nutritional stress.
  evidence:
  - reference: PMID:37499065
    reference_title: "Congenital NAD Deficiency Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CNDD is inherited in an autosomal recessive manner."
    explanation: GeneReviews states the mode of inheritance for the disorder.
has_subtypes:
- name: VCRL1
  display_name: Vertebral, cardiac, renal, and limb defects syndrome 1 (HAAO)
  description: >-
    Caused by biallelic HAAO variants that abolish 3-hydroxyanthranilate
    3,4-dioxygenase, the enzyme converting 3-hydroxyanthranilic acid to the
    quinolinate precursor. The block is two steps upstream of NAD, so
    3-hydroxyanthranilic acid accumulates.
  subtype_term:
    preferred_term: vertebral, cardiac, renal, and limb defects syndrome 1
    term:
      id: MONDO:0060554
      label: vertebral, cardiac, renal, and limb defects syndrome 1
  genes:
  - preferred_term: HAAO
    term:
      id: hgnc:4796
      label: HAAO
  evidence:
  - reference: PMID:28792876
    reference_title: "NAD Deficiency, Congenital Malformations, and Niacin Supplementation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three patients carried homozygous variants predicting loss-of-function
      changes in the HAAO or KYNU proteins (HAAO p.D162*, HAAO p.W186*, or KYNU
      p.V57Efs*21)."
    explanation: The founding report identifies biallelic HAAO loss-of-function
      variants in affected individuals.
- name: VCRL2
  display_name: Vertebral, cardiac, renal, and limb defects syndrome 2 (KYNU)
  description: >-
    Caused by biallelic KYNU variants that abolish kynureninase, blocking
    conversion of 3-hydroxykynurenine to 3-hydroxyanthranilic acid. The
    accumulating 3-hydroxykynurenine is shunted to xanthurenic acid, which is
    excreted in urine and can be used diagnostically.
  subtype_term:
    preferred_term: vertebral, cardiac, renal, and limb defects syndrome 2
    term:
      id: MONDO:0060555
      label: vertebral, cardiac, renal, and limb defects syndrome 2
  genes:
  - preferred_term: KYNU
    term:
      id: hgnc:6469
      label: KYNU
  evidence:
  - reference: PMID:34200361
    reference_title: "A Homozygous Deletion of Exon 5 of KYNU Resulting from a Maternal Chromosome 2 Isodisomy (UPD2) Causes Catel-Manzke-Syndrome/VCRL Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we have identified a novel homozygous copy number variant (CNV)
      encompassing exon 5 of KYNU in an individual presenting with overlapping
      features of VCRL and Catel-Manzke Syndrome"
    explanation: Documents a biallelic KYNU lesion producing the VCRL phenotype.
- name: VCRL3
  display_name: Vertebral, cardiac, renal, and limb defects syndrome 3 (NADSYN1)
  description: >-
    Caused by biallelic NADSYN1 variants that abolish NAD synthetase 1, the
    terminal step shared by the de novo and Preiss-Handler routes. Because the
    block is downstream of the point at which dietary nicotinic acid enters,
    NADSYN1-null individuals cannot be rescued by nicotinic acid and require
    amidated precursors. This is the most phenotypically variable subtype,
    spanning prenatal lethality to essentially unaffected adults.
  subtype_term:
    preferred_term: vertebral, cardiac, renal, and limb defects syndrome 3
    term:
      id: MONDO:0030077
      label: vertebral, cardiac, renal, and limb defects syndrome 3
  genes:
  - preferred_term: NADSYN1
    term:
      id: hgnc:29832
      label: NADSYN1
  evidence:
  - reference: PMID:31883644
    reference_title: "Bi-allelic Mutations in NADSYN1 Cause Multiple Organ Defects and Expand the Genotypic Spectrum of Congenital NAD Deficiency Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we present five individuals from four unrelated families,
      individuals who share similar phenotypes with disease-causal bi-allelic
      variants in NADSYN1, encoding NAD synthetase 1, the final enzyme of the
      nicotinamide adenine dinucleotide (NAD) de novo synthesis pathway"
    explanation: Establishes NADSYN1 as the third CNDD gene.
  - reference: PMID:36951206
    reference_title: "Clinical heterogeneity of NADSYN1-associated VCRL syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two of them being siblings with the same homozygous variant and
      presenting with either a very severe prenatal lethal or a mild phenotypic
      form"
    explanation: Documents the wide intrafamilial phenotypic variability that
      distinguishes the NADSYN1 subtype.
  - reference: PMID:36649848
    reference_title: "Adult patient diagnosed with NADSYN1 associated congenital
      NAD deficiency and analysis of NAD levels to be published in: European
      Journal of Medical Genetics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present a male patient age 30 with a height of 130 cm and
      numerous skeletal malformations including segmentation defects of the
      spine, rib anomalies and unequal leg length as well as bilateral ptosis,
      cleft palate and asymmetric dysmorphic facial features."
    explanation: Documents survival to adulthood in this subtype, against a
      literature otherwise dominated by infant deaths.
  - reference: PMID:36649848
    reference_title: "Adult patient diagnosed with NADSYN1 associated congenital
      NAD deficiency and analysis of NAD levels to be published in: European
      Journal of Medical Genetics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No malformations of the kidneys or urinary tract were identified."
    explanation: Shows the renal arm of the four-organ pattern can be spared
      entirely, which is why a partial presentation should not exclude the
      diagnosis.

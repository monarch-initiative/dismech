    explanation: Characterizes how NADSYN1 variants impair the enzyme.
  - reference: PMID:38357931
    reference_title: "A metabolic signature for NADSYN1-dependent congenital NAD deficiency disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Phenotypes vary between CNDD patients (9) and do not appear

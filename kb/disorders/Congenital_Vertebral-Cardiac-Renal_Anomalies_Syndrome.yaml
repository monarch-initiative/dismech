    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital heart defects can include left-sided heart lesions,
      right-sided heart lesions, or both."
    explanation: Documents the non-lateralized distribution of cardiac lesions.
- name: Disrupted Nephrogenesis
  description: >-
    NAD deficiency during ureteric bud outgrowth and metanephric induction
    produces renal maldevelopment spanning hypoplasia and dysplasia through to
    complete bilateral agenesis, which is lethal.
  biological_scale: TISSUE
  biological_processes:

    explanation: Functional assay confirms the variants are loss-of-function
      rather than merely rare.
  - reference: PMID:33942433
    reference_title: "New cases that expand the genotypic and phenotypic spectrum of Congenital NAD Deficiency Disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "For the first time, missense mutations are identified as a cause
      of malformation and shown to disrupt enzyme function."
    explanation: Extends the allelic spectrum beyond truncating variants.
- name: KYNU
  gene_term:
    preferred_term: KYNU
    term:
      id: hgnc:6469
      label: KYNU
  presence: PRESENT
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE

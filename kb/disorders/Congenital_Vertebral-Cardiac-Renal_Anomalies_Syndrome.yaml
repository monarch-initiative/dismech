environmental:
- name: Maternal dietary NAD precursor insufficiency during pregnancy
  description: >-
    Low maternal intake of tryptophan and vitamin B3 lowers the NAD precursor
    supply reaching the conceptus. In mice this alone causes the malformation
    spectrum in genetically normal embryos, and combined with a single
    heterozygous pathway allele it produces a markedly worse outcome than either
    factor separately.
  presence: PRESENT
  effect: Lowers embryonic NAD, causing malformations and embryo loss
  influences_mechanisms:
  - target: Insufficient Maternal NAD Precursor Provision
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Dietary restriction of both NAD precursors is the exposure that establishes
      inadequate maternal provision.
    evidence:
    - reference: PMID:32015132
      reference_title: "NAD deficiency due to environmental factors or gene-environment interactions causes congenital malformations and miscarriage in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "When the dietary undersupply was combined with a maternal
        heterozygous variant in Haao, which alone does not cause NAD deficiency
        or malformations, the incidence of embryo loss and malformations was
        significantly higher, suggesting a gene-environment interaction."
      explanation: Establishes the exposure acting on maternal NAD provision and
        its interaction with genotype.
  evidence:
  - reference: PMID:32015132
    reference_title: "NAD deficiency due to environmental factors or gene-environment interactions causes congenital malformations and miscarriage in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our data show that NAD deficiency as a cause of embryo loss and
      congenital malformation is not restricted to the rare cases of biallelic
      mutations in NAD synthesis pathway genes."
    explanation: Supports treating maternal dietary insufficiency as an
      independent environmental cause.
  review_notes: >-
    ECTO was searched for a term denoting dietary insufficiency or deficiency of
    an NAD precursor; ECTO models exposures to substances, not their absence, and
    the only niacin terms found (ECTO:0900032, ECTO:9002151) denote exposure to
    niacin, which is the opposite claim. Left unbound rather than bound to an
    inverted term.
- name: Gestational niacin supplementation
  description: >-
    Vitamin B3 supplementation during pregnancy raises maternal and embryonic
    NAD and prevents the malformations in mouse models. The choice of vitamer
    matters and depends on where the block sits: nicotinic acid entering through
    the Preiss-Handler pathway still requires NADSYN1, so NADSYN1-null mothers
    need amidated precursors that bypass the terminal step.
  presence: PRESENT
  effect: Protective; restores embryonic NAD and prevents malformation
  exposure_term:
    preferred_term: exposure to niacin (b3) via ingestion
    term:
      id: ECTO:0900032
      label: exposure to niacin (b3) via ingestion
  influences_mechanisms:
  - target: Embryonic NAD Deficiency
    environmental_effect: PROTECTS_AGAINST
    causal_link_type: DIRECT
    description: >-
      Supplementation restores the precursor supply and prevents the NAD deficit
      that drives the malformations.
    evidence:
    - reference: PMID:28792876
      reference_title: "NAD Deficiency, Congenital Malformations, and Niacin Supplementation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In null mice, the prevention of NAD deficiency during gestation
        averted defects."
      explanation: Demonstrates that correcting the NAD deficit prevents the
        downstream malformations.
  evidence:
  - reference: PMID:28792876
    reference_title: "NAD Deficiency, Congenital Malformations, and Niacin Supplementation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Niacin supplementation during gestation prevented the
      malformations in mice."
    explanation: Establishes the protective effect of the exposure.
  - reference: PMID:38357931
    reference_title: "A metabolic signature for NADSYN1-dependent congenital NAD deficiency disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "While for Nadsyn1+/- mothers, any B3 vitamer was suitable to raise
      NAD, preventing embryo loss and malformation, Nadsyn1-/- mothers required
      supplementation with amidated NAD precursors (nicotinamide or nicotinamide
      mononucleotide) bypassing their metabolic block."
    explanation: Supports the claim that vitamer choice depends on the position
      of the enzymatic block.
treatments:
- name: Antenatal NAD precursor supplementation
  description: >-
    Vitamin B3 supplementation before and during a subsequent at-risk pregnancy
    is the only intervention that addresses the mechanism rather than its
    consequences, and it is preventive rather than curative: it must be in place
    during organogenesis, which is largely complete before most affected
    pregnancies are recognized. The evidence is from mouse models; no human
    trial has shown prevention of CNDD in an at-risk pregnancy, so this is a
    mechanistically motivated recommendation, not a proven one. Where the block
    is at NADSYN1, nicotinic acid is not sufficient and amidated precursors are
    required.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: nutritional supplementation with an NAD precursor
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: nicotinic acid
      term:
        id: CHEBI:15940
        label: nicotinic acid
    - preferred_term: nicotinamide
      term:
        id: CHEBI:17154
        label: nicotinamide
    - preferred_term: nicotinamide mononucleotide
      term:
        id: CHEBI:50383
        label: nicotinamide mononucleotide
  target_mechanisms:
  - target: Embryonic NAD Deficiency
    treatment_effect: RESTORES
    description: >-
      Raises the maternal precursor pool so that embryonic NAD stays above the
      organogenesis threshold.
    evidence:
    - reference: PMID:28792876
      reference_title: "NAD Deficiency, Congenital Malformations, and Niacin Supplementation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In null mice, the prevention of NAD deficiency during gestation
        averted defects."
      explanation: Shows the intervention acts by correcting this specific
        mechanism node.
  evidence:
  - reference: PMID:38357931
    reference_title: "A metabolic signature for NADSYN1-dependent congenital NAD deficiency disorder."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We reproduced NADSYN1-dependent CNDD in mice and assessed various
      maternal NAD precursor supplementation strategies to prevent adverse
      pregnancy outcomes."
    explanation: Describes the supplementation strategy this treatment records.
  - reference: PMID:38357931
    reference_title: A metabolic signature for NADSYN1-dependent congenital NAD
      deficiency disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additional clinical trials are needed before accurate dosage
      recommendations required to prevent CNDD-dependent malformation can be
      made."
    explanation: Establishes that the human dosing question is open, which is
      why this treatment is described as mechanistically motivated rather than
      established.
- name: Postnatal amidated NAD precursor supplementation
  description: >-
    Distinct from the antenatal preventive use: metabolome data suggest affected
    individuals continue to have inadequate NAD after birth, so maintaining NAD
    with amidated precursors may be warranted beyond the prenatal window. This
    is a suggestion from the metabolome study, not established practice, and
    GeneReviews records no cure and describes management as supportive.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: nutritional supplementation with an amidated NAD precursor
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: nicotinamide
      term:
        id: CHEBI:17154
        label: nicotinamide
  evidence:
  - reference: PMID:38357931
    reference_title: "A metabolic signature for NADSYN1-dependent congenital NAD deficiency disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "suggest an ongoing need to maintain NAD levels via amidated NAD
      precursor supplementation after birth"
    explanation: States the postnatal supplementation rationale, and its
      hedged framing is why this entry does not present it as established.
  - reference: PMID:38357931
    reference_title: A metabolic signature for NADSYN1-dependent congenital NAD
      deficiency disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 1-month-old individual with CNDD caused by biallelic
      loss-of-function HAAO variants was reported to have improved in length and
      development after 3 months of NA supplementation"
    explanation: A single reported human response to postnatal supplementation,
      cited as the anecdotal basis it is.
  - reference: PMID:38357931
    reference_title: A metabolic signature for NADSYN1-dependent congenital NAD
      deficiency disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Monitoring of progress in more supplemented individuals with CNDD,
      and for longer time frames, is necessary before it becomes clear whether
      these developmental phenotypes are indeed modifiable."
    explanation: The authors' own statement that the postnatal benefit is not
      yet established, which is why this treatment is not presented as standard
      of care.
  - reference: PMID:36649848
    reference_title: "Adult patient diagnosed with NADSYN1 associated congenital
      NAD deficiency and analysis of NAD levels to be published in: European
      Journal of Medical Genetics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The NAD pool rose approximately 25% after supplementation with
      nicotinamide, a NAD precursor for the salvage pathway."
    explanation: The one human measurement showing postnatal nicotinamide
      raises the NAD pool in an affected individual. It is a biochemical
      response in a single patient, not a clinical outcome.
- name: Supportive management of congenital anomalies
  description: >-
    There is no cure. Management is standard treatment of each malformation and
    of the functional consequences, coordinated across cardiology, nephrology,
    orthopaedics, ENT, ophthalmology and developmental services, with structured
    surveillance for scoliosis, hearing, vision, thyroid function, calcium and
    renal function. Medications that impair kidney function should be avoided in
    those with a solitary kidney or known renal impairment.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Abnormal heart morphology
    term:
      id: HP:0001627
      label: Abnormal heart morphology
  - preferred_term: Scoliosis
    term:
      id: HP:0002650
      label: Scoliosis
  - preferred_term: Renal dysplasia
    term:
      id: HP:0000110
      label: Renal dysplasia
  - preferred_term: Cleft palate
    term:
      id: HP:0000175
      label: Cleft palate
  - preferred_term: Tethered cord
    term:
      id: HP:0002144
      label: Tethered cord
  evidence:
  - reference: PMID:37499065
    reference_title: "Congenital NAD Deficiency Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is no cure for CNDD."
    explanation: Establishes that management is supportive rather than curative.
  - reference: PMID:37499065
    reference_title: "Congenital NAD Deficiency Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Agents/circumstances to avoid: Avoidance of medications that
      impair kidney function, in those with renal aplasia (solitary kidney)
      and/or known impaired kidney function."
    explanation: Records the GeneReviews drug-safety warning reflected in this
      treatment's description.
- name: Genetic counselling and family evaluation
  description: >-
    Autosomal recessive recurrence risk is 25% per pregnancy. Because
    malformations can be occult, at-risk relatives should be evaluated once the
    familial variants are known. Uniparental isodisomy has been documented as a
    route to biallelic KYNU loss, which changes the recurrence risk for that
    family and is a reason to establish the mechanism rather than assume
    biparental inheritance.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:37499065
    reference_title: "Congenital NAD Deficiency Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is appropriate to clarify the genetic status of apparently
      asymptomatic older and younger at-risk relatives of an affected individual
      in order to identify as early as possible those who would benefit from
      more in-depth evaluation for occult congenital malformations."
    explanation: Records the recommendation to evaluate at-risk relatives.

clinical_burden:
  burden_level: HIGH
  rationale: >-
    In the reported cohorts most affected individuals died in infancy of their
    malformations. Survivors carry lifelong consequences across several organ
    systems: short stature, developmental delay, and the surgical and
    surveillance burden of congenital heart disease, renal maldevelopment and
    progressive scoliosis. The burden also falls on the family through recurrent
    pregnancy loss and a 25% recurrence risk.
  evidence:
  - reference: PMID:38357931
    reference_title: A metabolic signature for NADSYN1-dependent congenital NAD
      deficiency disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the majority of whom have not survived past 3 months of age due to
      the severity of their malformations"
    explanation: Documents the mortality that drives the burden assessment.
pathophysiology:
- name: De Novo NAD Synthesis Pathway Enzymatic Block
  description: >-
    Biallelic loss-of-function variants in HAAO, KYNU or NADSYN1 abolish one of
    three non-redundant enzymatic steps converting L-tryptophan to NAD through
    the kynurenine pathway. No parallel route bypasses the lost step within de
    novo synthesis, so flux through the pathway stops at the affected enzyme.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: HAAO
    term:
      id: hgnc:4796
      label: HAAO
  - preferred_term: KYNU
    term:
      id: hgnc:6469
      label: KYNU
  - preferred_term: NADSYN1
    term:
      id: hgnc:29832
      label: NADSYN1
  molecular_functions:
  - preferred_term: 3-hydroxyanthranilate 3,4-dioxygenase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0000334
      label: 3-hydroxyanthranilate 3,4-dioxygenase activity
  - preferred_term: kynureninase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0030429
      label: kynureninase activity
  - preferred_term: NAD+ synthase activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0008795
      label: NAD+ synthase activity
  biological_processes:
  - preferred_term: de novo NAD biosynthesis from L-tryptophan
    modifier: DECREASED
    term:
      id: GO:0034354
      label: "'de novo' NAD+ biosynthetic process from L-tryptophan"
  downstream:
  - target: Kynurenine Pathway Intermediate Accumulation
    causal_link_type: DIRECT
    description: Substrate immediately upstream of the lost enzyme accumulates.
  - target: Embryonic NAD Deficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:28792876
      reference_title: "NAD Deficiency, Congenital Malformations, and Niacin Supplementation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Nicotinamide adenine dinucleotide (NAD) is synthesized de novo
        from tryptophan through the kynurenine pathway. The patients had reduced
        levels of circulating NAD."
      explanation: Links the pathway lesion directly to measured NAD deficiency
        in affected individuals, not merely to the genotype.
  evidence:
  - reference: PMID:38357931
    reference_title: "A metabolic signature for NADSYN1-dependent congenital NAD deficiency disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All CNDD cases identified to date originate from biallelic
      loss-of-function variants in any of 3 nonredundant genes of the NAD de
      novo synthesis pathway"
    explanation: States the shared molecular lesion and its non-redundancy.
- name: Kynurenine Pathway Intermediate Accumulation
  description: >-
    Metabolites immediately upstream of the enzymatic block accumulate and spill
    into plasma and urine. The identity of the accumulating species is
    gene-specific, which is what makes the circulating NAD metabolome
    diagnostically informative: HAAO loss raises 3-hydroxyanthranilic acid,
    KYNU loss raises 3-hydroxykynurenine and its transamination product
    xanthurenic acid, and NADSYN1 loss raises the terminal precursor.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: quinolinate biosynthesis from the kynurenine pathway
    modifier: DECREASED
    term:
      id: GO:0019805
      label: quinolinate biosynthetic process
  chemical_entities:
  - preferred_term: 3-hydroxy-L-kynurenine
    term:
      id: CHEBI:17380
      label: 3-hydroxy-L-kynurenine
  evidence:
  - reference: PMID:34200361
    reference_title: "A Homozygous Deletion of Exon 5 of KYNU Resulting from a Maternal Chromosome 2 Isodisomy (UPD2) Causes Catel-Manzke-Syndrome/VCRL Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Increased xanthurenic acid excretion in the urine confirmed the
      genetic diagnosis."
    explanation: Demonstrates that the upstream intermediate accumulates
      measurably in a KYNU-deficient patient.
  - reference: PMID:38357931
    reference_title: "A metabolic signature for NADSYN1-dependent congenital NAD deficiency disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The circulatory NAD metabolome in mice and humans before and after
      NAD precursor supplementation revealed a consistent metabolic signature
      with utility for patient identification."
    explanation: Supports the diagnostic use of the accumulated-metabolite
      pattern.
- name: Insufficient Maternal NAD Precursor Provision
  description: >-
    NAD available to the conceptus depends on maternal circulating tryptophan
    and vitamin B3 vitamers, which reach the embryo via the yolk sac before the
    embryonic liver is functional. Low maternal precursor supply lowers embryonic
    NAD independently of the embryo's own genotype, and is the environmental arm
    of the gene-environment interaction that sets phenotype severity.
  biological_scale: ORGANISM
  downstream:
  - target: Embryonic NAD Deficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40689776
      reference_title: "Maternal Circulatory NAD Precursor Levels and the Yolk Sac Determine NAD Deficiency-Driven Congenital Malformation Risk."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Maternal levels of nicotinamide positively correlated with
        embryonic NAD levels, highlighting its central role for embryonic NAD
        metabolism."
      explanation: Quantifies the maternal-supply-to-embryonic-NAD link that
        this edge asserts.
  evidence:
  - reference: PMID:32015132
    reference_title: "NAD deficiency due to environmental factors or gene-environment interactions causes congenital malformations and miscarriage in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "C57BL/6J wild-type mice had offspring exhibiting similar
      malformations when their supply of the NAD precursors tryptophan and
      vitamin B3 in the diet was restricted during pregnancy."
    explanation: Shows maternal precursor restriction alone reproduces the
      malformation spectrum, establishing this as an independent input.
- name: Embryonic NAD Deficiency
  description: >-
    Embryonic NAD falls below the level required to sustain the several hundred
    NAD-dependent reactions on which proliferating embryonic tissue depends.
    This is the convergence point of the disorder: genotype and maternal
    nutrition are two routes to the same deficit, and it is the deficit, not the
    variant, that determines outcome. Severity and defect type track the timing
    of the deficit during organogenesis rather than the identity of the affected
    enzyme.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: NAD+ biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0009435
      label: NAD+ biosynthetic process
  chemical_entities:

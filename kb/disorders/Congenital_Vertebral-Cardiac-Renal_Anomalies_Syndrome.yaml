diagnosis:
- name: Circulating NAD metabolome signature
  description: >-
    Plasma NAD and kynurenine-pathway metabolite profiling identifies affected
    individuals and, because the accumulating species depends on which enzyme is
    lost, points to the gene to sequence. GeneReviews establishes the diagnosis
    on biallelic pathogenic variants in HAAO, KYNU or NADSYN1; the metabolome is
    the finding that prompts that testing.
  evidence:
  - reference: PMID:37499065
    reference_title: "Congenital NAD Deficiency Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of CNDD is established in a proband with suggestive
      findings and biallelic pathogenic variants in HAAO, KYNU, or NADSYN1
      identified by molecular genetic testing."
    explanation: States the diagnostic criterion.
  - reference: PMID:38357931
    reference_title: "A metabolic signature for NADSYN1-dependent congenital NAD deficiency disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data collectively improve clinical diagnostics of
      NADSYN1-dependent CNDD"
    explanation: Supports the metabolome's diagnostic contribution.
differential_diagnoses:
- name: VACTERL association
  description: >-
    CNDD is clinically indistinguishable from VACTERL association in many
    individuals, and the overlap is the main reason the disorder is
    underdiagnosed. The practical separator is that CNDD has a testable
    biochemical and molecular basis, so a VACTERL-like presentation is a reason
    to measure NAD rather than to stop at a descriptive label.
  evidence:
  - reference: PMID:37499065
    reference_title: "Congenital NAD Deficiency Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cardiac, renal, vertebral, and limb anomalies are common,
      mimicking the clinical features described in VACTERL association"
    explanation: States the phenotypic overlap that drives the differential.
- name: Catel-Manzke syndrome
  description: >-
    A KYNU-deficient individual has been reported with features overlapping both
    VCRL and Catel-Manzke syndrome, so the two can present together.
  evidence:
  - reference: PMID:34200361
    reference_title: "A Homozygous Deletion of Exon 5 of KYNU Resulting from a Maternal Chromosome 2 Isodisomy (UPD2) Causes Catel-Manzke-Syndrome/VCRL Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in an individual presenting with overlapping features of VCRL and
      Catel-Manzke Syndrome"
    explanation: Documents the reported overlap.
- name: Congenital vertebral malformation of other genetic cause
  description: >-
    In a cohort of patients ascertained for congenital vertebral malformation,
    NADSYN1 variants accounted for a minority of cases, so most congenital
    vertebral malformation is not CNDD and the segmentation-clock disorders
    remain the larger differential.
  evidence:
  - reference: PMID:34681008
    reference_title: "Disruptive NADSYN1 Variants Implicated in Congenital Vertebral Malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings demonstrated that functional variants in NADSYN1 were
      involved in the complex genetic etiology of CVMs"
    explanation: Places CNDD as one contributor among several to congenital
      vertebral malformation.
discussions:
- discussion_id: human_efficacy_of_antenatal_b3_prevention
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does periconceptional and gestational vitamin B3 supplementation prevent
    congenital NAD deficiency disorder in an at-risk human pregnancy?
  rationale: >-
    Prevention in mice is well established and the mechanism is clear, but the
    human evidence is entirely absent: no trial or observational cohort has
    tested whether supplementation in a subsequent pregnancy after an affected
    child prevents recurrence. The gap matters because the intervention is cheap
    and low-risk while the outcome it would prevent is often lethal, and because
    families are being counselled now on mouse data alone. It is also unusually
    hard to close, since the disorder is rare enough that a conventional
    randomized trial is unlikely to be feasible.
  attaches_to:
  - treatments#Antenatal NAD precursor supplementation
  - pathophysiology#Embryonic NAD Deficiency
  evidence:
  - reference: PMID:38357931
    reference_title: A metabolic signature for NADSYN1-dependent congenital NAD
      deficiency disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additional clinical trials are needed before accurate dosage
      recommendations required to prevent CNDD-dependent malformation can be
      made."
    explanation: The authors state the human evidence is absent, which is the
      gap this discussion records.
- discussion_id: mouse_diet_conditionality_vs_human_ascertainment
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the mouse dependence of the CNDD phenotype on maternal dietary NAD
    precursor restriction hold in humans, whose background vitamin B3 intake is
    generally higher and often fortified?
  rationale: >-
    In every mouse model the malformation phenotype is conditional on a
    B3-restricted maternal diet; null animals on a replete diet are largely
    protected. Human CNDD patients, by contrast, are ascertained without any
    documented maternal dietary deficiency. Either human de novo synthesis
    contributes a larger share of embryonic NAD than the mouse experiments
    imply, or unmeasured variation in maternal precursor status is doing work
    that nobody has quantified. Which of these is true determines whether
    maternal nutritional assessment belongs in the counselling of an at-risk
    family, so this is not merely a modelling curiosity.
  attaches_to:
  - pathophysiology#Insufficient Maternal NAD Precursor Provision
  - animal_models#Haao-null mouse
  evidence:
  - reference: PMID:32015132
    reference_title: NAD deficiency due to environmental factors or
      gene-environment interactions causes congenital malformations and
      miscarriage in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "C57BL/6J wild-type mice had offspring exhibiting similar
      malformations when their supply of the NAD precursors tryptophan and
      vitamin B3 in the diet was restricted during pregnancy."
    explanation: Documents the dietary conditionality of the mouse phenotype
      that this mismatch is about.
- discussion_id: nad_deficiency_as_pleiotropic_malformation_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is NAD deficiency a shared mechanism behind other recurrent malformation
    constellations currently classified as separate entities?
  rationale: >-
    It has been proposed that NAD deficiency is a pleiotropic mechanism uniting
    VACTERL, limb-body wall complex, OEIS complex, MURCS, sirenomelia and
    others. The proposal is explicitly a hypothesis, and its author states that
    no confirmatory experimental studies in humans exist. Recording it as an
    open question rather than as background is the honest treatment: if it were
    true, the scope of this entry would be considerably larger than three genes.
  attaches_to:
  - disease#Congenital Vertebral-Cardiac-Renal Anomalies Syndrome
  evidence:
  - reference: PMID:35484986
    reference_title: "NAD+ deficiency in human congenital malformations and
      miscarriage: A new model of pleiotropy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "it is important to emphasize there have been no confirmatory
      experimental studies in humans to prove this hypothesis."
    explanation: The proposing author states the hypothesis is unconfirmed,
      which is why it is recorded as an open question rather than as content.
notes: >-
  Entry shape follows the decision recorded on issue #8549, which closed the
  standalone VCRL1 curation request in favour of a single root entry spanning
  the congenital NAD deficiency pathway with VCRL1 (HAAO), VCRL2 (KYNU) and
  VCRL3 (NADSYN1) as subtypes. GeneReviews independently treats the three genes
  as one disorder, "congenital NAD deficiency disorder", which supports that
  shape.

  No conforms_to declaration is made against the
  axial_segmentation_serial_homology module. That module is built around the
  Notch segmentation clock (DLL3, MESP2, LFNG, HES7, TBX6), and there is no
  evidence that NAD deficiency acts through that oscillator; the vertebral
  phenotypes converge without the mechanisms doing so. The relationship is
  recorded here rather than asserted as conformance.
review_notes: >-
  just discover-datasets returned a single GEO candidate (geo:GSE243441, bulk
  RNA-seq in bladder cancer) matched on the gene symbol NADSYN1 alone. It is a
  gene-only match with no relation to this disorder, and was rejected rather
  than curated. No datasets block is therefore present.

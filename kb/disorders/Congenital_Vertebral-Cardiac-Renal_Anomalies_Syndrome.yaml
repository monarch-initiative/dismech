      severity.
  - reference: PMID:34681008
    reference_title: "Disruptive NADSYN1 Variants Implicated in Congenital Vertebral Malformations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total number of eight variants in NADSYN1, including two
      truncating variants and six missense variants, were identified in nine

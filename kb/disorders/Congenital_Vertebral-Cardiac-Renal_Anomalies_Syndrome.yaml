name: Congenital Vertebral-Cardiac-Renal Anomalies Syndrome
creation_date: "2026-09-03T00:00:00Z"
category: Mendelian
description: >-
  An autosomal recessive multiple-malformation syndrome, also called congenital
  NAD deficiency disorder (CNDD), caused by biallelic loss-of-function variants
  in one of three non-redundant enzymes of the de novo nicotinamide adenine
  dinucleotide (NAD) synthesis pathway that converts L-tryptophan to NAD via
  kynurenine: HAAO (VCRL1), KYNU (VCRL2), and NADSYN1 (VCRL3). The enzymatic
  block lowers embryonic NAD below the level organogenesis requires, producing
  vertebral segmentation defects, congenital heart disease, renal anomalies and
  limb defects that mimic the VACTERL association, together with short stature,
  developmental delay and embryo loss. Because NAD can also be made from dietary
  vitamin B3, the severity of the disorder depends on maternal NAD precursor
  supply as well as genotype, and gestational niacin supplementation prevents the
  malformations in mouse models.

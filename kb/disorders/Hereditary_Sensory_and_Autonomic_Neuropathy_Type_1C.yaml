name: Hereditary Sensory and Autonomic Neuropathy Type 1C
creation_date: "2026-09-15T13:18:10Z"
category: Mendelian
description: >-
  HSAN1C is the SPTLC2 form of hereditary sensory and autonomic neuropathy type
  1: an autosomal dominant, slowly progressive, length-dependent axonal sensory
  neuropathy with distal sensory loss, acral ulceration and often lancinating
  pain. Heterozygous missense variants in SPTLC2, the second subunit of serine
  palmitoyltransferase, shift the enzyme's substrate preference from L-serine
  towards L-alanine, so the first and rate-limiting step of de novo sphingolipid
  synthesis produces 1-deoxysphingolipids. These lack the C1 hydroxyl of a
  normal sphingoid base, so they can neither be converted into complex
  sphingolipids nor degraded by the canonical route, and they accumulate to
  neurotoxic levels in plasma and in sensory neurons.

  The mechanism is a change in what the enzyme makes rather than a simple loss
  of what it normally makes, and the literature corrected itself on this point:
  the founding SPTLC2 report described partial to complete loss of SPT activity,
  while a later uniform re-assay of six SPTLC2 and eleven SPTLC1 mutants found
  canonical serine activity was not reduced in any of them. This entry curates
  the variants as NEOMORPHIC on the later evidence and records the disagreement
  rather than dropping the earlier claim.
disease_term:
  preferred_term: neuropathy, hereditary sensory and autonomic, type 1C
  term:
    id: MONDO:0013337
    label: neuropathy, hereditary sensory and autonomic, type 1C
synonyms:
- HSAN1C

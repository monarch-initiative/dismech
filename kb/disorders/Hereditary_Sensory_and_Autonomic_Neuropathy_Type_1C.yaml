    reference_title: "A Novel Variant (Asn177Asp) in SPTLC2 Causing Hereditary Sensory Autonomic Neuropathy Type 1C."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hereditary sensory and autonomic neuropathy type 1 (HSAN1) is a rare, autosomal dominantly inherited, slowly progressive and length-dependent axonal peripheral neuropathy."
    explanation: >-
      States the inheritance pattern and the axonal, length-dependent character
      of the neuropathy in the paper reporting an SPTLC2 family. The sentence
      introduces the disease rather than reporting this study's own result.
    quote_role: BACKGROUND
pathophysiology:
- name: SPTLC2 Missense Variant Alters Serine Palmitoyltransferase Substrate Preference
  biological_scale: MOLECULAR
  description: >-
    Serine palmitoyltransferase condenses palmitoyl-CoA with L-serine in the
    first and rate-limiting step of de novo sphingolipid synthesis. HSAN1
    missense variants in the SPTLC1 and SPTLC2 subunits impose a permanent shift
    in substrate preference from L-serine towards L-alanine. The variant enzyme
    therefore acquires an activity the wild-type enzyme does not have, which is
    why the genetic context is recorded as NEOMORPHIC rather than as a loss of
    function.
  molecular_functions:
  - preferred_term: serine C-palmitoyltransferase activity
    term:
      id: GO:0004758
      label: serine C-palmitoyltransferase activity
    modifier: DYSREGULATED
  genetic_context:
    gene:
      preferred_term: SPTLC2
      term:
        id: hgnc:11278
        label: SPTLC2
    functional_impact_category: NEOMORPHIC
  evidence:
  - reference: PMID:26681808
    reference_title: "HSAN1 mutations in serine palmitoyltransferase reveal a close structure-function-phenotype relationship."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutations induce a permanent shift in the substrate preference from L-serine to L-alanine, which results in the pathological formation of atypical and neurotoxic 1-deoxy-sphingolipids (1-deoxySL)."
    explanation: >-
      States the substrate shift and the novel product, which is what makes this
      a neomorphic rather than a loss-of-function change.
  - reference: PMID:26681808
    reference_title: "HSAN1 mutations in serine palmitoyltransferase reveal a close structure-function-phenotype relationship."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Despite earlier reports, canonical activity with l-serine was not reduced in any of the investigated SPT mutants."
    explanation: >-
      A uniform isotope-labelling re-assay of eleven SPTLC1 and six SPTLC2
      mutants finds canonical activity intact, which is the specific evidence
      against grading these variants as loss of function.
  - reference: PMID:20920666
    reference_title: "Mutations in the SPTLC2 subunit of serine palmitoyltransferase cause hereditary sensory and autonomic neuropathy type I."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "We demonstrate that these mutations result in a partial to complete loss of SPT activity in vitro and in vivo."
    explanation: >-
      The founding SPTLC2 report's contrary finding of reduced SPT activity,
      curated as REFUTE against the neomorphic reading rather than omitted. The
      later uniform re-assay above is why the entry follows the substrate-shift
      model; both are kept so the disagreement stays visible.
  downstream:
  - target: 1-Deoxysphingolipid Accumulation
    description: >-
      Condensation of palmitoyl-CoA with L-alanine instead of L-serine yields
      deoxysphinganine, and with glycine yields deoxymethylsphinganine.
- name: 1-Deoxysphingolipid Accumulation
  biological_scale: MOLECULAR
  description: >-
    1-deoxysphingolipids lack the C1 hydroxyl group of a canonical sphingoid
    base. That hydroxyl is required both for conversion into complex
    sphingolipids and for entry into the normal degradation route, so these
    metabolites accumulate rather than turning over. They are measurable in
    patient plasma by LC-MS, which makes this node the disease's accessible
    biomarker as well as its mechanism.
  biological_processes:
  - preferred_term: sphingolipid biosynthetic process
    term:
      id: GO:0030148
      label: sphingolipid biosynthetic process
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:20920666
    reference_title: "Mutations in the SPTLC2 subunit of serine palmitoyltransferase cause hereditary sensory and autonomic neuropathy type I."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Moreover, they cause the accumulation of the atypical and neurotoxic sphingoid metabolite 1-deoxy-sphinganine."
    explanation: >-
      Establishes that the SPTLC2 variants generate the atypical metabolite,
      independently of the disputed activity finding in the same paper.
  - reference: PMID:30955194
    reference_title: "A Novel Variant (Asn177Asp) in SPTLC2 Causing Hereditary Sensory Autonomic Neuropathy Type 1C."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected family members showed elevated 1-deoxysphingolipid plasma levels."
    explanation: >-
      Confirms the accumulation in affected people rather than only in a
      cell-based assay, which is what makes the node a human disease mechanism.
  - reference: PMID:29778900
    reference_title: "Hereditary sensory neuropathy type 1-associated deoxysphingolipids cause neurotoxicity, acute calcium handling abnormalities and mitochondrial dysfunction in vitro."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Levels of these abnormal compounds are elevated in blood of HSN-1 patients"
    explanation: >-
      Independent confirmation that the metabolites are elevated in patients.
      The statement summarises prior work rather than this paper's own
      measurement, which is its own in vitro neurotoxicity result.
    quote_role: BACKGROUND
  downstream:
  - target: Sensory Neuron Toxicity and Axonal Degeneration
    description: >-
      Accumulated deoxysphingoid bases are directly neurotoxic to sensory
      neurons.
- name: Sensory Neuron Toxicity and Axonal Degeneration
  biological_scale: CELLULAR
  description: >-
    Deoxysphingoid bases are toxic to primary sensory and motor neurons, with
    disturbed endoplasmic-reticulum and mitochondrial calcium handling and loss
    of mitochondrial membrane potential as proximate cellular effects.
    Degeneration is length-dependent, so the longest sensory axons in the lower
    limbs fail first, which is why the clinical picture begins in the feet.
  cell_types:
  - preferred_term: sensory neuron of dorsal root ganglion
    term:
      id: CL:1001451
      label: sensory neuron of dorsal root ganglion
  evidence:
  - reference: PMID:29778900
    reference_title: "Hereditary sensory neuropathy type 1-associated deoxysphingolipids cause neurotoxicity, acute calcium handling abnormalities and mitochondrial dysfunction in vitro."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we show that exogenous application of these deoxysphingoid bases causes dose- and time-dependent neurotoxicity in primary mammalian neurons, as determined by analysis of cell survival and neurite length"
    explanation: >-
      Direct demonstration that the accumulated metabolites kill neurons, with a
      dose-response, which is the evidence that the accumulation node causes
      this one.
  - reference: PMID:29778900
    reference_title: "Hereditary sensory neuropathy type 1-associated deoxysphingolipids cause neurotoxicity, acute calcium handling abnormalities and mitochondrial dysfunction in vitro."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The changes in intracellular Ca2+ handling are accompanied by an early loss of mitochondrial membrane potential in deoxysphingoid base-treated motor and sensory neurons."
    explanation: >-
      Names the proximate subcellular mechanism this node asserts.
  downstream:
  - target: Distal Sensory Impairment
    description: >-
      Loss of the longest sensory axons produces the length-dependent distal
      sensory deficit.
  - target: Acral Ulceration
    description: >-
      Insensate feet sustain unnoticed injury, which ulcerates and heals poorly.

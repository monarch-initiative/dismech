biochemical:
- name: Plasma 1-deoxysphingolipids
  presence: INCREASED
  notes: >-
    Measured by LC-MS. Elevated in affected family members, and the readout used
    to show that L-serine supplementation engages the mechanism. It is both the
    mechanistic marker and the pharmacodynamic endpoint, which is why the
    treatment evidence below is unusually direct for a disease this rare — and
    also why that evidence is a surrogate rather than a clinical outcome.
  evidence:
  - reference: PMID:30955194
    reference_title: "A Novel Variant (Asn177Asp) in SPTLC2 Causing Hereditary Sensory Autonomic Neuropathy Type 1C."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Their plasma sphingolipid profiles were analyzed by LC-MS. The biochemical properties of the mutation were characterized in a cell-based activity assay. Affected family members showed elevated 1-deoxysphingolipid plasma levels."
    explanation: >-
      Names the assay and reports the elevation in affected individuals.
genetic:
- name: SPTLC2
  gene_term:
    preferred_term: SPTLC2
    term:
      id: hgnc:11278
      label: SPTLC2
  relationship_type: CAUSATIVE
  notes: >-
    Heterozygous missense variants. The founding report screened 78 HSAN
    patients and found three SPTLC2 variants in four families; SPTLC3, the third
    SPT subunit, carried none, and none has been found there since. Later
    reports add N177D and others, and patients with SPTLC1 and SPTLC2 variants
    are described as clinically indistinguishable.
  evidence:
  - reference: PMID:20920666
    reference_title: "Mutations in the SPTLC2 subunit of serine palmitoyltransferase cause hereditary sensory and autonomic neuropathy type I."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No mutations were found in SPTLC3, but we identified three heterozygous missense mutations in the SPTLC2 subunit of SPT in four families presenting with a typical HSAN-I phenotype."
    explanation: >-
      Establishes SPTLC2 as causative and, in the same sentence, excludes
      SPTLC3, which is why HSAN1C is an SPTLC2 entity specifically.
  - reference: PMID:30955194
    reference_title: "A Novel Variant (Asn177Asp) in SPTLC2 Causing Hereditary Sensory Autonomic Neuropathy Type 1C."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study identifies the SPTLC2 N177D variant as a novel disease-causing mutation with increased 1-deoxySL formation and its association with a typical HSAN1 phenotype."
    explanation: >-
      Adds a further causative allele and ties it to the same biochemical
      mechanism.
treatments:
- name: Oral L-Serine Supplementation
  description: >-
    Substrate competition rather than enzyme replacement: supplying excess
    L-serine shifts the mutant enzyme back towards its canonical substrate and
    lowers 1-deoxysphingolipid production. Shown in a transgenic mouse model and
    in a 14-patient pilot study, and reported in HSAN1C itself in a 52-week
    single-patient study that titrated to 400 mg/kg/day and halved serum
    1-deoxysphingolipid without demonstrating a functional benefit.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: oral L-serine supplementation
    term:
      id: NCIT:C15433
      label: Nutritional Support
    therapeutic_agent:
    - preferred_term: L-serine
      term:
        id: CHEBI:17115
        label: L-serine
  target_mechanisms:
  - target: 1-Deoxysphingolipid Accumulation
    description: >-
      Excess dietary L-serine competes with L-alanine at the mutant enzyme's
      active site, reducing formation of the neurotoxic metabolite.
    evidence:
    - reference: PMID:22045570
      reference_title: "Oral L-serine supplementation reduces production of neurotoxic deoxysphingolipids in mice and humans with hereditary sensory autonomic neuropathy type 1."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In a pilot study with 14 HSAN1 patients, L-serine supplementation similarly reduced dSL levels."
      explanation: >-
        Shows the intervention lowers the mechanistic metabolite in patients,
        which is the specific claim this link makes. It does not show a clinical
        benefit; see the attached discussion.
  evidence:
  - reference: PMID:22045570
    reference_title: "Oral L-serine supplementation reduces production of neurotoxic deoxysphingolipids in mice and humans with hereditary sensory autonomic neuropathy type 1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In mice bearing a transgene expressing the C133W SPTLC1 mutant linked to HSAN1, a 10% L-serine–enriched diet reduced dSL levels. L-serine supplementation also improved measures of motor and sensory performance as well as measures of male fertility."
    explanation: >-
      The functional-outcome evidence comes from the mouse arm, not from
      patients, and the transgene is an SPTLC1 mutant rather than SPTLC2.
      Graded MODEL_ORGANISM for that reason.
  - reference: PMID:22045570
    reference_title: "Oral L-serine supplementation reduces production of neurotoxic deoxysphingolipids in mice and humans with hereditary sensory autonomic neuropathy type 1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast, a 10% L-alanine–enriched diet increased dSL levels and led to severe peripheral neuropathy."
    explanation: >-
      The reciprocal alanine arm moves both the metabolite and the phenotype in
      the opposite direction, which is the strongest available test that
      substrate competition is the operative mechanism.
  - reference: PMID:29042446
    reference_title: "Clinical and metabolic consequences of L-serine supplementation in hereditary sensory and autonomic neuropathy type 1C."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that oral supplementation of L-serine decreases 1-deoxySL in HSAN1C without major global effects on metabolism."
    explanation: >-
      The only study of this treatment in HSAN1C itself rather than in HSAN1A or
      the SPTLC1 mouse. Establishes the biochemical effect and the safety
      profile in an SPTLC2 carrier.
  - reference: PMID:29042446
    reference_title: "Clinical and metabolic consequences of L-serine supplementation in hereditary sensory and autonomic neuropathy type 1C."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Based on this single case and one-year follow-up, we cannot conclude whether the achieved 1-deoxySL reduction was sufficient to stop or slow the progression of the disease."
    explanation: >-
      The authors' own limit on what the study establishes. Curated as SUPPORT
      for the treatment while recording that the functional question is open -
      this is the sentence that makes the metabolite a surrogate rather than an
      outcome.
  - reference: PMID:29042446
    reference_title: "Clinical and metabolic consequences of L-serine supplementation in hereditary sensory and autonomic neuropathy type 1C."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our patient underwent a 52-wk treatment in which the L-serine dose was titrated up to 400 mg/kg/day."
    explanation: >-
      Records the dose and duration, which the entry previously did not carry
      anywhere.
differential_diagnoses:
- name: Hereditary sensory and autonomic neuropathy type 1A
  description: >-
    The SPTLC1 form. Clinically indistinguishable from HSAN1C and mechanistically
    identical at the level of deoxysphingolipid production, so the distinction is
    made by which SPT subunit carries the variant, not by phenotype.
- name: Diabetic sensory neuropathy
  description: >-
    Presents very similarly, and plasma deoxysphingolipids are also elevated in
    metabolic syndrome and type 2 diabetes, so the biomarker does not by itself
    separate the two. Genotype does.
discussions:
- discussion_id: hsan1c_lof_versus_neomorph
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#SPTLC2 Missense Variant Alters Serine Palmitoyltransferase Substrate Preference
  prompt: >-
    Do HSAN1-associated SPTLC2 variants reduce canonical serine
    palmitoyltransferase activity, or only add the alanine-condensing activity?
  rationale: >-
    The founding SPTLC2 report measured partial to complete loss of SPT
    activity; a later study re-assaying eleven SPTLC1 and six SPTLC2 mutants by a
    uniform isotope-labelling method found canonical activity was not reduced in
    any of them, and that three variants showed increased canonical activity.
    The two are not reconciled in the literature, and the difference is not
    cosmetic: it decides whether this is a neomorphic or a loss-of-function
    disease, and therefore whether substrate competition alone is the right
    therapeutic principle. This entry follows the later uniform re-assay, on the
    grounds that it compares mutants under one method, and keeps the earlier
    result as a REFUTE item rather than discarding it.
- discussion_id: hsan1c_serine_evidence_is_sptlc1_mouse
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - treatments#Oral L-Serine Supplementation
  prompt: >-
    Does the L-serine functional benefit shown in an SPTLC1-C133W transgenic
    mouse transfer to SPTLC2-mutant human disease?
  rationale: >-
    The only evidence that L-serine improves sensory and motor function, as
    opposed to lowering the metabolite, comes from a mouse carrying an SPTLC1
    mutation. The human pilot study reports the biochemical effect only, and that
    effect is a surrogate endpoint. Since HSAN1C is by definition an SPTLC2
    disease, both the species and the subunit differ from the model that carries
    the functional claim. The shared downstream metabolite is the reason to
    expect transfer, and the observation that SPTLC1 and SPTLC2 patients are
    clinically indistinguishable strengthens it. The gap is narrower than
    absence: a 52-week single-patient study in an SPTLC2 p.(Arg183Trp) carrier
    did record functional outcomes alongside the metabolite, and they were
    inconclusive - the neuropathy score did not improve and the authors decline
    to say whether progression was slowed. So the question is not whether
    SPTLC2 human data exist but whether an n-of-1 year-long observation can
    answer it, and the answer is no.
  proposed_experiments:
  - experiment_id: sptlc2_serine_functional_outcome
    name: Functional-outcome trial of oral L-serine in SPTLC2-mutant patients
    description: >-
      Follow genetically confirmed SPTLC2-mutant patients on oral L-serine with
      a sensory clinical endpoint - quantitative sensory testing and ulcer
      incidence - alongside the plasma 1-deoxysphingolipid measurement, rather
      than using the metabolite alone as the outcome.
    would_support:
    - treatments#Oral L-Serine Supplementation
    supporting_outcome:
    - >-
      Improvement or slowed progression of quantitative sensory testing and a
      fall in ulcer incidence in SPTLC2-mutant patients on L-serine, which would
      convert the surrogate result into a clinical one and extend the mouse
      functional finding across both species and subunit.
    would_refute:
    - treatments#Oral L-Serine Supplementation
    refuting_outcome:
    - >-
      Plasma 1-deoxysphingolipid falls as expected while sensory measures
      continue to decline at the untreated rate, which would show the metabolite
      is a marker of the lesion rather than its ongoing driver.
- discussion_id: hsan1c_severity_prediction
  kind: KNOWLEDGE_GAP
  attaches_to:
  - biochemical#Plasma 1-deoxysphingolipids
  prompt: >-
    Can the plasma sphingoid base profile predict HSAN1 severity well enough to
    be used clinically?
  rationale: >-
    Principal component analysis of sphingoid bases clustered SPT mutations into
    three groups corresponding to no, mild and severe phenotype, and the
    clusters mapped onto position in a homology model, with active-site
    mutations mild and surface mutations severe. That is a strong claim for a
    disease this rare, and it was made across SPTLC1 and SPTLC2 mutants
    together. Whether it holds within the SPTLC2 subset alone, and
    prospectively rather than on the mutants used to derive it, has not been
    tested.
notes: >-
  This entry is a separate Disease rather than a subtype row on
  Hereditary_Sensory_and_Autonomic_Neuropathy. That parent entry carries an
  HSAN1 subtype scoped to SPTLC1, and the corpus already splits
  Hereditary_Sensory_Neuropathy_Type_1D, Type_1E, Type_2 and Type_6 into their
  own entries, so a separate 1C entry follows the established pattern. The
  parent's `Neurotoxic Deoxysphingolipid Formation` node is the same mechanism
  seen from the group level; a `conforms_to` link is deliberately not asserted,
  because conformance targets a kb/modules/ module and the parent is a disease
  entry.

  The disagreement about canonical SPT activity is curated as a REFUTE evidence
  item plus a discussion, not resolved silently. Both papers are quoted on the
  sentences that carry their respective findings. Anyone changing
  `functional_impact_category` here should read both first.

  `evidence_source: MODEL_ORGANISM` on the two L-serine treatment items is
  deliberate and is the point of the attached HUMAN_MODEL_MISMATCH discussion:
  the functional-improvement claim is a mouse result, and the mouse carries an
  SPTLC1 transgene, so it differs from this disease in both species and subunit.
  The human arm of the same paper supports only the metabolite change, and is
  quoted separately on the treatment's mechanism link where it is graded
  HUMAN_CLINICAL. Reading the treatment block without that split would suggest
  a human functional result exists.

  `quote_role: BACKGROUND` marks five sentences. Each is a paper's introductory
  description of the HSAN1 clinical picture or of prior work, taken from papers
  whose own results are a substrate assay, a mouse diet experiment, or an in
  vitro neurotoxicity assay. Grading them HUMAN_CLINICAL without the marker
  would assert that those papers characterised the human phenotype themselves.
  PMID:29778900 is quoted both ways in this entry, which is the intended use of
  the slot: BACKGROUND for the patient blood levels it cites to others, and
  unmarked for the neurotoxicity it measured.

  The snippets from PMID:20920666 and PMID:29778900 describing ulceration come
  from paper introductions, and "most patients develop complications" is the
  only quantitative statement available for the ulceration phenotype. No
  frequency band is tagged from it, because "most" in an introduction citing a
  review is not a measured proportion in an HSAN1C cohort.

  No prevalence record is curated. None of the sources consulted gives a
  frequency for HSAN1C specifically, and an HSAN1 figure would be the parent's
  rather than this subtype's.

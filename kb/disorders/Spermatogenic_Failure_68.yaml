name: Spermatogenic Failure 68
creation_date: '2026-10-22T00:00:00Z'
category: Mendelian
synonyms:
- SPGF68
- spermatogenic failure 68
- CATSPERT-related male infertility
- C2CD6-related male infertility
description: 'Spermatogenic failure 68 (SPGF68) is autosomal recessive male infertility attributed to
  biallelic variants in CATSPERT (previously C2CD6, also called ALS2CR11). CATSPERT encodes CatSper tau,
  a subunit of the sperm-specific CatSper calcium channel. Its C2 membrane-binding domain carries the
  channel complex into the flagellar membrane and arranges it into four linear calcium signalling nanodomains
  along the principal piece.

  The human evidence is a single man. He came from a consanguineous family, had partial globozoospermia,
  and was homozygous for a missense variant (p.His113Arg) in the C2 domain, classed as of uncertain significance.
  The mechanism comes from two knockout mouse studies. Without CatSper tau the channel is reduced and
  the nanodomains are broken up. Sperm still conduct some calcium but cannot hyperactivate and fail to
  fertilize, while testis histology, sperm counts and sperm morphology stay normal. The human round-headed
  sperm phenotype and the mouse motility phenotype therefore do not match.'

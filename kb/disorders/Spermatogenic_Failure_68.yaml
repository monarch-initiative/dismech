treatments:
- name: Intracytoplasmic Sperm Injection (ICSI)
  description: Intracytoplasmic sperm injection (ICSI) places a single spermatozoon directly into the
    oocyte, so fertilisation no longer depends on hyperactivated motility or zona pellucida penetration.
    Men with type I globozoospermia who wish to conceive must use ICSI, but fertilisation rates with ICSI
    in globozoospermia are much lower than in other male infertility, and assisted oocyte activation
    (AOA) is reported to restore them. No ICSI outcome has been reported for a CATSPERT patient.
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Intracytoplasmic Sperm Injection
    term:
      id: NCIT:C185482
      label: Intracytoplasmic Sperm Injection
  target_mechanisms:
  - target: Failure of Sperm Hyperactivation
    treatment_effect: BYPASSES
    description: Direct injection of a single spermatozoon into the oocyte cytoplasm bypasses the requirement
      for CatSper-mediated hyperactivated motility and zona pellucida penetration.
    evidence:
    - reference: PMID:34998468
      reference_title: C2cd6-encoded CatSperτ targets sperm calcium channel to Ca(2+) signaling domains
        in the flagellar membrane.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: Therefore, the levels of CatSper proteins and/or ICatSper can serve as a prognosis to determine
        clinical approaches; i.e., in vitro fertilization (IVF) versus intracytoplasmic sperm injection
        (ICSI).
      explanation: The authors' clinical inference from their knockout-mouse results, not an experiment.
        It proposes choosing ICSI over IVF when CatSper is deficient, which implies that ICSI avoids the
        hyperactivation requirement, but no ICSI was performed with CatSpert-deficient sperm.
  target_phenotypes:
  - preferred_term: Male infertility
    term:
      id: HP:0003251
      label: Male infertility
  evidence:
  - reference: PMID:31985809
    reference_title: Exome sequencing reveals novel causes as well as new candidate genes for human globozoospermia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Patients with globozoospermia type I and wishing to conceive are forced to use ICSI for fertilisation.
    explanation: Establishes ICSI as the assisted reproductive intervention required for fertilization
      in men with type I globozoospermia.
  - reference: PMID:31985809
    reference_title: Exome sequencing reveals novel causes as well as new candidate genes for human globozoospermia.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: The success rate of fertilisation using ICSI for globozoospermic men is however lower than in
      unselected groups of male infertility (24.3% compared to 70–80%), and rates range between 0 and 100%,
      with most authors reporting low to no fertilisation
    explanation: Qualifies the treatment claim. ICSI is required but often fails in globozoospermia; the
      figures are cited from earlier clinical series rather than measured in this study.
  - reference: PMID:31985809
    reference_title: Exome sequencing reveals novel causes as well as new candidate genes for human globozoospermia.
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: The fertilisation rate is restored by assisted oocyte activation (AOA) using mechanical, chemical
      and electrical approaches
    explanation: Assisted oocyte activation alongside ICSI is reported to restore fertilisation in globozoospermia,
      cited from earlier work.
  - reference: PMID:34998468
    reference_title: C2cd6-encoded CatSperτ targets sperm calcium channel to Ca(2+) signaling domains
      in the flagellar membrane.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Therefore, the levels of CatSper proteins and/or ICatSper can serve as a prognosis to determine
      clinical approaches; i.e., in vitro fertilization (IVF) versus intracytoplasmic sperm injection
      (ICSI).
    directness: INDIRECT
    explanation: The authors' clinical inference from knockout-mouse results, proposing ICSI rather than

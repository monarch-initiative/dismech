discussions:
- discussion_id: spgf68_globozoospermia_vs_hyperactivation
  prompt: Does loss of CATSPERT cause round-headed sperm in humans, as the one reported patient suggests,
    or a CatSper hyperactivation defect with normal sperm morphology, as the knockout mice show?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - phenotypes#Globozoospermia
  - pathophysiology#Failure of Sperm Hyperactivation
  - animal_models#CatSpert (C2cd6) loss-of-function mouse
  rationale: The human evidence is one homozygous missense variant of uncertain significance in a man
    with partial globozoospermia, found in a cohort selected for that phenotype. Two independent mouse
    knockouts give a calcium channel targeting and hyperactivation defect with normal sperm heads. These
    cannot both describe one mechanism. Either the human variant does not cause the patient's globozoospermia,
    or the human protein has an acrosomal role the mouse does not show. Testing hyperactivation and CatSper
    current in sperm from men with biallelic CATSPERT variants, and finding further patients, would settle
    it.
  evidence:
  - reference: PMID:31985809
    reference_title: Exome sequencing reveals novel causes as well as new candidate genes for human globozoospermia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Additionally, functional follow-up is needed for several candidate genes to confirm the impact
      of these mutations on normal spermatogenesis.
    explanation: The reporting authors state that their candidate genes, C2CD6 among them, have not been
      confirmed.
  - reference: PMID:33108537
    reference_title: Genetic analyses of a large cohort of infertile patients with globozoospermia, DPY19L2
      still the main actor, GGN confirmed as a guest player.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: searching for deleterious variants in the nine other genes described to be associated with
      globozoospermia in human (C2CD6, C7orf61, CCDC62, CCIN, DNAH17, GGN, PICK1, SPATA16, and ZPBP1)
    explanation: A later globozoospermia cohort screened C2CD6 in DPY19L2-negative patients.
  - reference: PMID:33108537
    reference_title: Genetic analyses of a large cohort of infertile patients with globozoospermia, DPY19L2
      still the main actor, GGN confirmed as a guest player.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Only one homozygous novel truncating variant was identified in the GGN gene in one patient,
      confirming the association of GGN with globozoospermia.
    explanation: No C2CD6 variant was found in that screen, so the link between CATSPERT and globozoospermia
      still rests on the single original patient.
clinical_burden:
  burden_level: LOW
  rationale: The effect is reproductive only. No systemic features have been reported in the patient or
    in knockout mice.

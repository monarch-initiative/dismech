notes: MONDO cross-references this disease as OMIM 619805 and records CATSPERT as its causal gene, with
  no descendant terms. A PubMed search for CATSPERT, C2CD6, ALS2CR11, TMEM249 and CatSper tau on 2026-10-22
  found one human report (PMID:31985809, patient GL-4) and the mouse knockout studies cited here. A later
  globozoospermia cohort screened C2CD6 in 23 DPY19L2-negative patients and found no candidate variant
  (PMID:33108537). The deep-research report in research/ also found no further patients, and no functional
  test of p.His113Arg. TMEM249, sometimes named as a further CatSper component, is a separate gene and
  not part of this entry.

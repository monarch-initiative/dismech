pathophysiology:
- name: Loss of CatSper Tau Membrane-Targeting Function
  description: CatSper tau is a CatSper channel subunit with a calcium-dependent C2 membrane-binding domain.
    It reaches the flagellum on its own and acts as the main component that targets the channel complex
    to the flagellar membrane. It is not needed to assemble a working channel. In mice, truncating the
    C2 domain was enough to stop the channel being carried into the nanodomains of developing spermatids.
    The human variant p.His113Arg lies in the same C2 domain, but its effect on the protein has not been
    tested.

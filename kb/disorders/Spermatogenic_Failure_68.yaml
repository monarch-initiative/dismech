genetic:
- name: CATSPERT
  notes: CATSPERT was previously named C2CD6 and ALS2CR11; the HGNC build used for term validation still
    gives C2CD6 as the label of hgnc:14438. The one reported human allele is c.338A>G p.(His113Arg), homozygous,
    absent from gnomAD and classed as of uncertain significance under ACMG/AMP criteria by the reporting
    authors, who called it possibly causative. Their link to acrosome biology rested on protein interactions
    with SPATA16 and ZPBP. Mouse loss-of-function alleles (exon deletions and a C2-domain truncation)
    cause infertility through the CatSper channel instead. CAUSATIVE here follows the disease definition,
    which MONDO and OMIM key on this gene; it does not reflect the strength of the human evidence, which
    is one variant of uncertain significance.
  gene_term:
    preferred_term: CATSPERT
    term:
      id: hgnc:14438
      label: C2CD6
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:

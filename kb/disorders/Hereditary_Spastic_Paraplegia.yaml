    interacts with spastin through a
    hydrophobic region of spastin involved in ER localisation, placing these
    proteins in one interaction network, and the reticulon-2 work supports
    abnormal ER morphogenesis as a pathogenic mechanism in HSP. In SPG31 the
    molecular genetic mechanism is haploinsufficiency of REEP1.

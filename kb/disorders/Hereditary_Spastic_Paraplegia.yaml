notes: >
  HSP is defined and classified primarily by clinical and genetic features rather
  than neuropathology; more than 80 SPG loci are now recognized. The pure-versus-complex
  clinical split correlates imperfectly with genetic type, and several
  genes (e.g. SPG7) may present as either autosomal dominant or autosomal
  recessive disease. Drug-safety note from GeneReviews (SPG3A/ATL1-HSP):
  dantrolene should be avoided as it can induce irreversible weakness adversely
  affecting mobility.
  Gene-defined SPG subtypes are recorded on this umbrella entry when the
  literature places the form in the pure (uncomplicated) clinical category, and
  are left to the separate complex hereditary spastic paraplegia entry
  (MONDO:0015150) when it places them in the complex category. On that basis
  SPG2 (PLP1, an X-linked leukodystrophy also covered by the
  Pelizaeus-Merzbacher entry), SPG21 (Mast syndrome), SPG35 (FA2H), SPG47
  (AP4B1), SPG51 (AP4E1), SPG52 (AP4S1) and SPG56 (CYP2U1) sit on the complex
  entry rather than here; PLP1, FA2H and AP4B1 are already bound there. The
  category rulings for SPG2, SPG21 and SPG35 are MONDO's own class definitions,
  read 2026-09-25; for SPG56 it is PMID:29034544, which calls SPG56 an early
  onset complicated form of HSP. AP4B1, AP4E1, AP4M1 and AP4S1 are curated by
  ClinGen against a single disease entity, AP-4 deficiency syndrome
  (MONDO:0100176), rather than against separate SPG numbers.
datasets:
- accession: ega:EGAS00001000697
  title: Neuromics / RD-Connect - hereditary spastic paraplegia
  description: This study contains omics datasets from the Neuromics project (www.rd-neuromics.eu) on rare neuromuscular and neurodegenerative disorders. Data includes BAM and VCF files from whole-exome sequencing and standardised phenotypic data mapped to the human phenotype ontology (HPO). In some cases proteomic, transcriptomic and metabolomic data may also be available. This study groups together datasets from individuals with a hereditary spastic paraplegia phenotype, and also includes some unaffected family members. Search under the Neuromics name to find related studies for other neuromuscular and neurodegenerative disorders.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Hereditary Spastic Paraplegia"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: ega:EGAS00001001849
  title: Whole-genome sequencing of two probands with hereditary spastic paraplegia reveals novel splice-donor region mutation and known pathogenic mutation in SPG11
  description: Hereditary spastic paraplegias (SPG) are a group of heterogeneous neurodegenerative disorders, which are often presented with overlapping phenotypes such as progressive paraparesis and spasticity. To assist the diagnosis of SPG subtypes, next-generation sequencing is often used to provide supporting evidence. In this study, we report the case of two probands from the same family with SPG symptoms, including bilateral lower limbs weakness, unsteady gait, cognitive decline, dysarthria and slurring of speech since age of 14.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Hereditary Spastic Paraplegia"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: ega:EGAS00001002006
  title: HipSci HumanExome BeadChip analysis - Hereditary Spastic Paraplegia
  description: The HipSci project brings together diverse constituents in genomics, proteomics, cell biology and clinical genetics to create a UK national iPS cell resource and use it to carry out cellular genetic studies. In this sub-study we performed Genotyping analysis using the Infinium HumanExome BeadChip on iPS cells generated from skin biopsies or blood samples from rare disease patients diagnosed with Hereditary Spastic Paraplegia.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Hereditary Spastic Paraplegia"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: dbgap:phs001080
  title: Genome Studies in Hereditary Spastic Paraplegia
  description:  Next-generation sequencing technology is opening up new opportunities to rethink the way we identify disease causing genetic variation. An early application, whole exome sequencing, has now been established by a small number of research labs, including ours. Exome sequencing allows obtaining a near complete set of protein coding genomic variation in single individuals for less than $5,000. Promising targets for exome sequencing studies are Mendelian diseases, such as hereditary spastic paraplegias (HSP).
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from dbgap. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Hereditary Spastic Paraplegia"). Retrieved 2026-08-02.

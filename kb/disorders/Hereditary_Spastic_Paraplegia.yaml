  description: >
    A group of HSP genes encode proteins that work together to shape the
    endoplasmic reticulum into sheets and tubules: REEP1 (SPG31), atlastin-1
    (SPG3A) and spastin (SPG4), joined by reticulon 2 (SPG12) and REEP2
    (SPG72), which also belongs to that ER-shaping family and whose original

  biological_scale: MOLECULAR
  description: >
    DDHD1 belongs to the intracellular phospholipase A1 gene family. The study
    that identified DDHD1 mutations in autosomal recessive HSP showed in human
    cells that the pathophysiology includes altered mitochondrial architecture
    and bioenergetics with increased oxidative stress, and concluded that lipid
    metabolism is a critical HSP pathway with a deleterious impact on
    mitochondrial bioenergetic function. That study reported the same finding
    for CYP2U1; CYP2U1 is not bound on this node because SPG56 is curated as a
    complicated form on the complex hereditary spastic paraplegia entry.

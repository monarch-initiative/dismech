    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Spastin, the most common locus for mutations in hereditary spastic paraplegias, \nand katanin are related microtubule-severing AAA ATPases"
    explanation: Identifies spastin as a microtubule-severing AAA ATPase and the most common HSP locus.
  - reference: PMID:18202664
    reference_title: "Structural basis of microtubule severing by the hereditary spastic paraplegia protein spastin."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "our data support a model in which spastin pulls the C terminus of \ntubulin through its central pore, generating a mechanical force that \ndestabilizes tubulin-tubulin interactions within the microtubule lattice."
    explanation: Defines the molecular mechanism of spastin-mediated microtubule severing disrupted in SPG4.
  - reference: PMID:42320547
    reference_title: "Proteomic analysis reveals early pathological defects in corticospinal motor neurons of a spastin model of hereditary spastic paraplegia, which are improved by NU-9 treatment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "limitations with cytoarchitectural integrity and stability of key organelles contribute to their neuronal vulnerability"
    explanation: Proteomic analysis of SPASTC448Y mice reveals that spastin loss-of-function causes early cytoarchitectural defects and organellar instability contributing to corticospinal neuron vulnerability.
  - reference: PMID:42320547
    reference_title: "Proteomic analysis reveals early pathological defects in corticospinal motor neurons of a spastin model of hereditary spastic paraplegia, which are improved by NU-9 treatment."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "NU-9 treatment (100 mg/kg, for 100 days) significantly prevented degeneration of corticospinal axons, restored the integrity of mitochondria and endoplasmic reticulum, and reduced the presence of electron-dense accumulations in the CSMN of SPASTC448Y mice."
    explanation: Demonstrates that spastin dysfunction specifically compromises mitochondrial and ER integrity in corticospinal motor neurons, and restoration of these organellar functions prevents axonal degeneration.
- name: Atlastin-1 ER Tubular Network Defect (SPG3A)
  genes:

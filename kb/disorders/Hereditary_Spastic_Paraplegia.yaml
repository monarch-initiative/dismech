    explanation: Independent statement of the enzyme family and mitochondrial involvement assigned to DDHD1 on this node.
- name: Endosomal Membrane Trafficking and Sorting Defect (SPG6/SPG8/SPG80)
  genes:
  - preferred_term: NIPA1
    term:
      id: hgnc:17043
      label: NIPA1
  - preferred_term: WASHC5
    term:
      id: hgnc:28984
      label: WASHC5
  - preferred_term: UBAP1
    term:
      id: hgnc:12461
      label: UBAP1
  conforms_to: "corticospinal_tract_axonopathy#Long-Axon Maintenance Machinery Defect"
  biological_scale: CELLULAR
  description: >
    Three dominant HSP genes converge on the endosome. NIPA1 (SPG6) is a
    magnesium transporter that associates with early endosomes and the cell
    surface and redistributes between the two with magnesium availability.
    WASHC5/strumpellin (SPG8) is a core subunit of the WASH complex, which
    activates actin nucleation at endosomes; pathogenic SPG8 alleles produce
    endosomal fission defects and reduce CAV1 abundance. UBAP1 (SPG80) binds ubiquitin on endosomes, and the
    C-terminal deletion mutant is not recruited to endosome membranes, so loss
    of UBAP1 function may perturb endosomal fusion and sorting of ubiquitinated
    cargoes.
  cellular_components:
  - preferred_term: Early endosome
    term:
      id: GO:0005769
      label: early endosome
  biological_processes:
  - preferred_term: Endosomal transport
    term:
      id: GO:0016197
      label: endosomal transport
    modifier: DECREASED
  downstream:
  - target: Length-Dependent Corticospinal-Tract Axonal Degeneration
  evidence:
  - reference: PMID:17166836
    reference_title: "NIPA1(SPG6), the basis for autosomal dominant form of hereditary spastic paraplegia, encodes a functional Mg2+ transporter."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Subcellular localization with immunofluorescence showed that endogenous NIPA1 protein associates with early endosomes and the cell surface in a variety of neuronal and epithelial cells."
    explanation: Localises the SPG6 protein to early endosomes, supporting the NIPA1 binding and the early-endosome component on this node.
  - reference: PMID:31911435
    reference_title: "Hereditary spastic paraplegia SPG8 mutations impair CAV1-dependent, integrin-mediated cell adhesion."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: IN_VITRO
    snippet: "WASHC5, commonly called strumpellin, is a core component of the Wiskott-Aldrich syndrome protein and SCAR homolog (WASH) complex that activates actin nucleation at endosomes."
    explanation: Places WASHC5 in an endosomal complex, which is why the SPG8 gene is bound on this node rather than on an ER node.
  - reference: PMID:31911435
    reference_title: "Hereditary spastic paraplegia SPG8 mutations impair CAV1-dependent, integrin-mediated cell adhesion."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We uncovered a decrease in CAV1 protein abundance as well as endosomal fission defects resulting from pathogenic SPG8 mutations."
    explanation: Shows that SPG8 disease alleles cause an endosomal defect, not merely that the protein is endosomal.
  - reference: PMID:31515522
    reference_title: "UBAP1 mutations cause juvenile-onset hereditary spastic paraplegias (SPG80) and impair UBAP1 targeting to endosomes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The full-length UBAP1 protein is involved in endosomal dynamics in neurons, while loss of UBAP1 function may perturb endosomal fusion and sorting of ubiquitinated cargos."
    explanation: Assigns UBAP1 an endosomal fusion and cargo-sorting role, supporting its binding on this node.
  - reference: PMID:31515522
    reference_title: "UBAP1 mutations cause juvenile-onset hereditary spastic paraplegias (SPG80) and impair UBAP1 targeting to endosomes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Overexpression of the UBAP1 wild type interacts directly with ubiquitin on enlarged endosomes, while the UBAP1-mutant cannot be recruited to endosome membranes."
    explanation: Shows the disease allele fails to reach the endosome, the specific defect this node asserts for SPG80.
- name: Mitochondria-ER Contact Site and Organelle Morphology Defect (SPG87)
  genes:
  - preferred_term: TMEM63C
    term:
      id: hgnc:23787
      label: TMEM63C
  conforms_to: "corticospinal_tract_axonopathy#Long-Axon Maintenance Machinery Defect"
  biological_scale: CELLULAR
  description: >
    TMEM63C encodes a predicted osmosensitive calcium-permeable cation channel
    that localises to the endoplasmic reticulum and is particularly enriched at
    mitochondria-endoplasmic reticulum contact sites. Cell-based assays assign
    it a role in regulating both endoplasmic reticulum and mitochondrial
    morphology, and the study reporting biallelic TMEM63C variants in HSP reads
    this as further evidence that perturbed mitochondrial-endoplasmic reticulum
    dynamics is a pathomolecular mechanism in motor neurone degeneration.
  cellular_components:
  - preferred_term: Mitochondria-associated endoplasmic reticulum membrane contact site
    term:
      id: GO:0044233
      label: mitochondria-associated endoplasmic reticulum membrane contact site
  biological_processes:
  - preferred_term: Mitochondrion organization
    term:
      id: GO:0007005
      label: mitochondrion organization
    modifier: ABNORMAL
  - preferred_term: Endoplasmic reticulum organization
    term:
      id: GO:0007029
      label: endoplasmic reticulum organization
    modifier: ABNORMAL
  downstream:
  - target: Length-Dependent Corticospinal-Tract Axonal Degeneration
  evidence:
  - reference: PMID:35718349
    reference_title: "TMEM63C mutations cause mitochondrial morphology defects and underlie hereditary spastic paraplegia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Biochemical and microscopy analyses revealed that TMEM63C is an endoplasmic reticulum-localized protein, which is particularly enriched at mitochondria-endoplasmic reticulum contact sites."
    explanation: Localises TMEM63C to the contact site bound as this node's cellular component.
  - reference: PMID:35718349
    reference_title: "TMEM63C mutations cause mitochondrial morphology defects and underlie hereditary spastic paraplegia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional in cellula studies indicate a role for TMEM63C in regulating both endoplasmic reticulum and mitochondrial morphologies."
    explanation: Supports the two organelle-organization processes bound as ABNORMAL on this node.
  - reference: PMID:35718349
    reference_title: "TMEM63C mutations cause mitochondrial morphology defects and underlie hereditary spastic paraplegia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "add to the growing evidence of a fundamental pathomolecular role of perturbed mitochondrial-endoplasmic reticulum dynamics in motor neurone degenerative diseases"
    explanation: States the authors' reading of this mechanism as pathomolecular in motor neurone degeneration.
- name: Erlin-1/Erlin-2 Complex Defect (SPG62)
  genes:
  - preferred_term: ERLIN1
    term:
      id: hgnc:16947
      label: ERLIN1
  conforms_to: "corticospinal_tract_axonopathy#Long-Axon Maintenance Machinery Defect"
  biological_scale: MOLECULAR
  description: >
    ERLIN1 is named for its association with endoplasmic reticulum lipid rafts
    and carries a conserved prohibitin (PHB) domain. A splice-site allele found
    in an SPG62 patient was shown by minigene assay to delete exon 7 from the
    transcript, which the reporting authors expect to change that PHB domain and
    affect the function of the erlin1/2 complex.
  notes: >
    No ontology term is bound for the erlin complex itself: a search of GO
    through the EBI Ontology Lookup Service on 2026-09-25 (runoak -i ols:go
    search) for erlin returned nothing, and for prohibitin returned only
    GO:0035632 mitochondrial prohibitin complex, which is a different complex.
  downstream:
  - target: Length-Dependent Corticospinal-Tract Axonal Degeneration
  evidence:
  - reference: PMID:36100157
    reference_title: "A novel homozygous mutation in ERLIN1 gene causing spastic paraplegia 62 and literature review."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Minigene experiment further confirmed the mutation c.504+1G > A could cause erroneous deletion of Exon 7 in the mRNA, which may change the conserved prohibitin (PHB) domain of erlin-1 and affect the function of erlin1/2 complex."
    explanation: Ties the SPG62 splice allele to loss of the PHB domain and erlin1/2 complex function, the mechanism this node asserts.

- name: Progressive Lower-Limb Spasticity and Weakness
  conforms_to: "corticospinal_tract_axonopathy#Progressive Lower-Limb Spasticity and Weakness"
  description: >
    The convergent corticospinal-tract axonopathy produces the cardinal clinical
    syndrome: insidiously progressive bilateral lower-limb spasticity and
    weakness with hyperreflexia, crossed adductor signs, and extensor plantar
    (Babinski) responses. Spasticity is greatest in hamstring, quadriceps,
    adductor, and gastrocnemius-soleus muscles; weakness is most prominent in
    iliopsoas, hamstring, and tibialis anterior. This is the shared functional
    consequence of all genetic forms of HSP.
  biological_processes:
  - preferred_term: Neuron projection (axon) maintenance failure
    term:
      id: GO:1990535
      label: neuron projection maintenance
    modifier: DECREASED
  evidence:
  - reference: PMID:23897027
    reference_title: "Hereditary spastic paraplegia: clinico-pathologic features and emerging molecular mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypperreflexia, crossed adductor signs, extensor plantar responses are typically present"
    explanation: Documents the pyramidal signs that result from corticospinal-tract degeneration.


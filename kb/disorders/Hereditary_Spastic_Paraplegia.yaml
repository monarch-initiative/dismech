  evidence:
  - reference: PMID:23176821
    reference_title: "Alteration of fatty-acid-metabolizing enzymes affects mitochondrial form and function in hereditary spastic paraplegia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These genes code for two enzymes involved in fatty-acid metabolism, and we have demonstrated in human cells that the HSP pathophysiology includes alteration of mitochondrial architecture and bioenergetics with increased oxidative stress."
    explanation: Establishes the fatty-acid-metabolism defect and its mitochondrial consequence in patient-derived human cells.
  - reference: PMID:23176821

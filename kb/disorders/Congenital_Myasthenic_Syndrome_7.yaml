name: Congenital Myasthenic Syndrome 7
creation_date: "2026-09-16T21:05:00Z"
description: >
  Congenital myasthenic syndrome 7 (CMS7) is the presynaptic congenital
  myasthenic syndrome caused by variants in SYT2, which encodes synaptotagmin-2,
  the fast calcium sensor that couples the presynaptic calcium transient to
  synchronous synaptic vesicle fusion at the motor nerve terminal. Loss of that
  coupling reduces quantal acetylcholine release per nerve impulse, so the
  endplate potential falls below the threshold for a muscle action potential and
  transmission fails intermittently. The electrophysiological picture therefore
  resembles Lambert-Eaton myasthenic syndrome - low compound muscle action
  potentials at rest that facilitate after exercise or fast repetitive
  stimulation - and, correspondingly, the disorder responds to 3,4-diaminopyridine
  rather than to anticholinesterase therapy alone. MONDO defines CMS7 by its gene
  rather than by inheritance, and both a dominant and a recessive form exist: the
  dominant form arises from missense variants in the C2B calcium-binding domain
  and typically presents in later childhood or adulthood with foot deformity,
  lower-limb wasting and fatigable ocular weakness, while biallelic
  loss-of-function variants produce a severe infantile syndrome with profound
  weakness, areflexia and bulbar involvement. A motor axonal neuropathy
  accompanies the junctional defect in many affected individuals, so CMS7 sits at
  the interface of the congenital myasthenic syndromes and the hereditary motor
  neuropathies.

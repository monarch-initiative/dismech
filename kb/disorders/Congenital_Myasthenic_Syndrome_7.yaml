    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26519543
    reference_title: "Electrophysiologic features of SYT2 mutations causing a treatable neuromuscular syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Electrophysiologic testing revealed features indicative of a presynaptic
      deficit in neurotransmitter release with posttetanic potentiation lasting up
      to 60 minutes.
    explanation: >-
      Human electrophysiology establishing both the presynaptic release deficit and
      the unusually prolonged potentiation stated in the description.
  - reference: PMID:32250532
    reference_title: "Recessive congenital myasthenic syndrome caused by a homozygous mutation in SYT2 altering a highly conserved C-terminal amino acid sequence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Repetitive nerve stimulation revealed an extreme reduction of compound muscle
      action potential amplitudes at rest, with a striking facilitation followed by
      a progressive decline at fast stimulation rates.
    explanation: >-
      Shows the same presynaptic signature - low CMAP at rest with facilitation - in
      the recessive form, so the node applies to both subtypes.
  - reference: PMID:34037996
    reference_title: "Dominant and recessive congenital myasthenic syndromes caused by SYT2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    snippet: >-
      Microelectrode studies in the dominant form showed a marked reduction of the
      quantal content, which increased linearly with higher frequencies of nerve
      stimulation.
    explanation: >-
      Intracellular microelectrode measurement of quantal content itself, the
      quantity this node names, rather than the compound-action-potential proxy.
  - reference: PMID:29696584
    reference_title: "How to Spot Congenital Myasthenic Syndromes Resembling the Lambert-Eaton Myasthenic Syndrome? A Brief Review of Clinical, Electrophysiological, and Genetics Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      CMS-LEMS occurs due to deficits in acetylcholine vesicle release caused by
      dysfunction of different components in its pathway.
    explanation: >-
      Places the SYT2 lesion in the class of presynaptic syndromes whose shared
      final step is a deficit of acetylcholine vesicle release, which is the node
      this entry routes every upstream lesion through. A review's synthesis across
      the CMS-LEMS genes, not a measurement of its own.
- name: Loss of the Safety Factor of Neuromuscular Transmission
  biological_scale: TISSUE
  conforms_to: "neuromuscular_transmission_failure#Loss of the Safety Factor of Neuromuscular Transmission"
  description: >-
    With quantal content reduced, the endplate potential no longer exceeds the
    muscle fibre action potential threshold with a margin. Transmission then fails
    at individual junctions, intermittently and use-dependently, which is what
    produces fatigable weakness rather than fixed paralysis.

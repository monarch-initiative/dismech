- name: Pyridostigmine
  description: >-
    An acetylcholinesterase inhibitor. It prolongs the action of whatever
    acetylcholine is released rather than increasing release, so it addresses the
    downstream consequence and not the presynaptic lesion. Reported effective in the
    recessive case; in the dominant families it was tried first and
    3,4-diaminopyridine was substituted.

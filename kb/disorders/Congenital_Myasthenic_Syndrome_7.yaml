genetic:
- name: SYT2
  gene_term:
    preferred_term: SYT2
    term:
      id: hgnc:11510
      label: SYT2
  presence: Positive
  association: Dominant C2B Missense and Recessive Loss-of-Function Variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Two allelic classes with different inheritance. Dominant: C2B calcium-binding
    domain missense, principally c.920A>C p.Asp307Ala and c.923C>T p.Pro308Leu
    (the same two changes are reported elsewhere with the nucleotide substitutions
    written as c.920T>G and c.923G>A - see the note at the bottom of this entry).
    A third dominant allele class is an in-frame deletion rather than a missense
    change: c.1082_1096del (NM_177402.4), removing five residues from C2B, reported
    as a de novo event in a simplex case.
    Recessive: frameshift (c.1191delG p.Arg397Serfs*37, c.328_331dup), splice-donor
    (c.465+1G>A causing in-frame skipping of exon 4 in the C2A domain), and a
    multi-exon deletion spanning exons 2-9.
    Population constraint: gnomAD reports SYT2 as loss-of-function intolerant and
    missense-constrained - pLI 0.70, LOEUF upper bound 0.58, LoF z-score 3.34,
    missense z-score 2.62, synonymous z-score 0.98. These are
    database-derived summary statistics with no quotable publication behind them,
    so they are recorded here as notes rather than as an evidence-backed claim, and
    dismech has no structured slot for gene-level constraint metrics.
  evidence:
  - reference: PMID:33659639
    reference_title: "New recessive mutations in SYT2 causing severe presynaptic congenital myasthenic syndromes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In-frame skipping of exon 4 that encodes part of the C2A calcium-binding
      domain of SYT2 is associated with a loss-of-function effect resulting in a
      decrease of neurotransmitter release and severe pre- and postsynaptic NMJ
      defects.
    explanation: >-
      Supports the splice allele and its loss-of-function consequence, and notes
      that the recessive form damages the postsynaptic side as well.
  - reference: PMID:36722210
    reference_title: "Exome sequencing and microarray identified a novel large exonic deletion in SYT2 gene in an ultra-rare case with recessive CMS type 7."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical exome sequencing revealed a novel large deletion including the exons
      2 to 9 of SYT2 gene which confirmed the diagnosis of presynaptic CMS type 7
      in the siblings.
    explanation: >-
      Documents the multi-exon deletion allele class, which single-gene sequencing
      would miss.
  - reference: PMID:33320396
    reference_title: "A new de novo SYT2 mutation presenting as distal weakness. Neuropathy or neuromuscular junction dysfunction?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic analysis demonstrated a new de novo heterozygous in frame deletion of
      the SYT2 gene (NM_177402.4: c.1082_1096del), confirmed by Sanger sequencing,
      which removes five aminoacids in the C2B domain of synaptotagmin-2 protein,
      that cause a profound effect on the structure and function of this synaptic
      vesicle protein.
    explanation: >-
      Documents the in-frame deletion allele class, which is neither a C2B missense
      change nor a biallelic loss-of-function allele and so is not covered by either
      of the two classes above.
diagnosis:
- name: Electrophysiological and Molecular Diagnosis of CMS7
  description: >-
    Repetitive nerve stimulation is the discriminating test: compound muscle action
    potential amplitudes are low at rest and increment markedly after brief maximal
    exercise or at fast stimulation rates, the presynaptic pattern. Post-tetanic
    potentiation in CMS7 is unusually prolonged, up to 60 minutes. The
    genetic diagnosis is made on a CMS gene panel or exome sequencing; note that a
    multi-exon deletion has been reported, so a copy-number-aware method or
    confirmatory microarray is needed to avoid a false-negative in a consanguineous
    family. Acetylcholine receptor and voltage-gated calcium channel antibodies are
    negative, which is the test that separates CMS7 from the two acquired disorders
    its electrophysiology imitates; seronegativity is an expected consequence of a
    Mendelian channel-coupling defect rather than a finding any SYT2 series reports
    as a measured result, so it is carried here as prose supported indirectly rather
    than as a cited positive observation.
  notes: >-
    Differential diagnosis: Lambert-Eaton myasthenic syndrome, which the
    electrophysiology closely resembles but which is acquired and antibody
    mediated; other presynaptic congenital myasthenic syndromes (CHAT/CMS6, the
    SNAP25, VAMP1 and MUNC13-1 syndromes); and hereditary motor neuropathy, which
    the foot deformity and distal wasting suggest on their own. Coexisting foot
    deformity and a facilitating CMAP is the combination that points to SYT2.
  evidence:
  - reference: PMID:26519543
    reference_title: "Electrophysiologic features of SYT2 mutations causing a treatable neuromuscular syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with reflex potentiation following exercise and a uniquely prolonged period
      of posttetanic potentiation
    explanation: >-
      Supports the prolonged post-tetanic potentiation as the distinguishing
      diagnostic finding.
  - reference: PMID:36722210
    reference_title: "Exome sequencing and microarray identified a novel large exonic deletion in SYT2 gene in an ultra-rare case with recessive CMS type 7."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The deletion was confirmed on a chromosomal exon microarray.
    explanation: >-
      Supports the recommendation that a copy-number-aware method is needed, since
      this allele was confirmed by microarray.
  - reference: PMID:29696584
    reference_title: "How to Spot Congenital Myasthenic Syndromes Resembling the Lambert-Eaton Myasthenic Syndrome? A Brief Review of Clinical, Electrophysiological, and Genetics Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Although clinical signs similar to LEMS can be present, the main hallmark is
      the electrophysiological findings, which are identical to autoimmune LEMS.
    explanation: >-
      Supports making repetitive nerve stimulation the discriminating test and
      states that the electrophysiology alone cannot separate CMS7 from acquired
      LEMS, which is why the antibody result and the genetic result are both needed.
  - reference: PMID:30032336
    reference_title: "Congenital Myasthenic Syndromes: a Clinical and Treatment Approach."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Unlike in autoimmune myasthenia gravis, there is no role for immunotherapy in
      congenital myasthenic syndromes.
    explanation: >-
      The nearest citable support for the seronegativity statement above. It asserts
      the absence of an autoimmune mechanism in the congenital syndromes as a class,
      from which antibody negativity follows; it does not report an antibody
      measurement in a SYT2 cohort, hence directness INDIRECT.
  - reference: PMID:33320396
    reference_title: "A new de novo SYT2 mutation presenting as distal weakness. Neuropathy or neuromuscular junction dysfunction?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our case showed electrophysiological features consistent with a presynaptic
      dysfunction in the neuromuscular junction with normal post-exercise amplitudes,
      not supporting the presence of predominant axonal damage.
    explanation: >-
      Supports reading the electrophysiology as a junctional rather than an axonal
      result in a patient whose clinical picture is that of a motor neuropathy, which
      is the discrimination the differential below turns on.
treatments:
- name: 3,4-Diaminopyridine (Amifampridine)
  description: >-
    A presynaptic potassium channel blocker. By prolonging the nerve terminal
    action potential it increases calcium entry per impulse, which partially
    compensates for the degraded calcium-to-fusion coupling. This is the
    mechanistically targeted treatment for CMS7 and produces both symptomatic
    benefit and measurable improvement in neuromuscular transmission.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986

discussions:
- discussion_id: axonopathy_secondary_or_independent
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Motor Axonal Neuropathy and Denervation Atrophy
  prompt: >-
    Is the motor axonopathy in CMS7 a consequence of chronic neuromuscular
    transmission failure, or an independent axonal role of synaptotagmin-2?
  rationale: >-
    The entry draws the axonopathy as a parallel consequence of the SYT2 lesion
    rather than a sequela of the junctional defect, but that placement is not
    evidence-based. Synaptotagmin-2 is a synaptic vesicle protein, and no published
    work establishes an axonal transport or maintenance function for it that would
    explain length-dependent degeneration directly. If the axonopathy is instead
    secondary to sustained transmission failure, then effective presynaptic therapy
    started early might prevent it, which makes this a question with a management
    consequence and not only a modelling one.
- discussion_id: postsynaptic_involvement_recessive
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Reduced Quantal Acetylcholine Release at the Motor Endplate
  prompt: >-
    Why do recessive SYT2 alleles produce postsynaptic as well as presynaptic
    neuromuscular junction defects?
  rationale: >-
    CMS7 is classified as a presynaptic syndrome and this entry models it that way.
    But the recessive splice allele is reported to cause severe pre- AND
    postsynaptic NMJ defects. A purely presynaptic sensor lesion should not
    reorganize the postsynaptic apparatus except through trophic or
    activity-dependent effects, so either the postsynaptic change is a secondary
    consequence of chronic underactivity - which the entry does not model - or SYT2
    has a role in junctional maintenance that is not captured here. The distinction
    matters for whether the recessive form is a more severe version of the same
    disease or a partly different one.
notes: >-
  Scope: this is a single entry covering both the dominant and the recessive forms,
  with `has_subtypes` for each. That follows MONDO, whose definition of
  MONDO:0014468 is gene-scoped - "Any congenital myasthenic syndrome in which the
  cause of the disease is a mutation in the SYT2 gene" - rather than
  inheritance-scoped. Note that OMIM splits SYT2-related CMS by inheritance, so a
  reader coming from OMIM should expect the correspondence to be one-to-two.

  The dominant and recessive forms are modelled as two separate molecular nodes
  rather than one, because they are not the same lesion at different doses: the
  dominant variants disable calcium binding and act dominant-negatively, while the
  recessive alleles remove the protein or its SNARE-interaction surface. Curating
  them as a single node would have forced one `functional_impact_category` onto two
  different mechanisms.

  The UK prevalence figure (PMID:41251564) is for congenital myasthenic syndrome as
  a whole, not for CMS7. The OpenScientist report's own reference validation flagged
  it as possibly off topic, which was a useful signal read the right way round: the
  paper is not off topic, it is about the parent disease, so it is curated as an
  upper bound with `directness: INDIRECT` and a note saying so rather than as a CMS7
  prevalence.

  A discrepancy left as found: the same two dominant variants are written with
  opposite nucleotide substitutions in the two source papers - PMID:25192047 gives
  c.920A>C (p.Asp307Ala) and c.923C>T (p.Pro308Leu), while PMID:26519543 gives
  c.920T>G and c.923G>A for the same two amino acid changes. The protein-level
  changes agree and are what the mechanism turns on. The entry records both spellings
  in the `genetic` notes rather than silently picking one, because a snippet never
  corrects the source it quotes and resolving this needs the variant databases, not
  a judgement call.

  The GeneReviews chapter tagged in `references` is the parent-disease overview
  (Congenital Myasthenic Syndromes Overview), not a SYT2 chapter. The cached record
  is abstract-only and carries no SYT2 content, so there is nothing in it to mine
  for this entry. It is tagged anyway so that the judgement "no chapter-level source
  exists for CMS7" is explicit rather than implied by the reference's absence. This
  note lives here because `PublicationReference` has no slot to carry it.

  Penetrance is not recorded in the structured `penetrance` slot. The sources support
  "high" - the dominant variants segregate through multiple generations and no
  unaffected heterozygous carrier is reported - but `PenetranceEnum` offers only
  COMPLETE, INCOMPLETE and UNKNOWN, and no cohort exists that would let CMS7 be put
  in the first of those. Recording COMPLETE would assert more than the literature
  does and UNKNOWN would assert less, so the slot is left unset and the claim is
  carried as prose on each `inheritance` record.

inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >-
    The originally described form is autosomal dominant, caused by heterozygous
    missense variants in the SYT2 C2B calcium-binding domain and segregating
    through multiple generations. A de novo heterozygous in-frame deletion has
    also been reported in a simplex case, so an affected proband with unaffected
    parents does not exclude the dominant form and a negative parental test does
    not exclude SYT2. Penetrance in the reported multigenerational pedigrees
    appears high, but no cohort has been assembled that would let it be
    quantified, so the structured `penetrance` slot is deliberately left unset
    rather than recorded as COMPLETE.
  evidence:
  - reference: PMID:25192047
    reference_title: "Synaptotagmin 2 mutations cause an autosomal-dominant form of lambert-eaton myasthenic syndrome and nonprogressive motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Via whole-exome sequencing, we identified heterozygous missense mutations in
      the C2B calcium-binding domain of the gene encoding Synaptotagmin 2 in two
      multigenerational families presenting with peripheral motor neuron syndromes.
    explanation: >-
      Documents heterozygous C2B missense variants segregating in multigenerational
      families, the basis for dominant inheritance.
  - reference: PMID:33320396
    reference_title: "A new de novo SYT2 mutation presenting as distal weakness. Neuropathy or neuromuscular junction dysfunction?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic analysis demonstrated a new de novo heterozygous in frame deletion of
      the SYT2 gene (NM_177402.4: c.1082_1096del), confirmed by Sanger sequencing,
      which removes five aminoacids in the C2B domain of synaptotagmin-2 protein,
      that cause a profound effect on the structure and function of this synaptic
      vesicle protein.
    explanation: >-
      Documents a de novo dominant allele, which is what makes unaffected parents
      compatible with the dominant form and is the counselling-relevant exception
      to the segregating-pedigree picture above.
- name: Autosomal Recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  expressivity: VARIABLE
  description: >-
    A separate, more severe recessive form is caused by biallelic loss-of-function
    SYT2 variants - frameshift, splice-site and whole-exon deletion alleles.
    Heterozygous parents are clinically and electrophysiologically normal.
  evidence:
  - reference: PMID:32250532
    reference_title: "Recessive congenital myasthenic syndrome caused by a homozygous mutation in SYT2 altering a highly conserved C-terminal amino acid sequence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report here a consanguineous patient with a severe recessive form of
      presynaptic CMS and denervation atrophy caused by the homozygous mutation
      c.1191delG, p.Arg397Serfs*37 in SYT2.
    explanation: >-
      First report of a recessive SYT2 CMS, establishing the second inheritance
      mode.
  - reference: PMID:36722210
    reference_title: "Exome sequencing and microarray identified a novel large exonic deletion in SYT2 gene in an ultra-rare case with recessive CMS type 7."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The parents were confirmed carriers of the same mutation and were normal on
      clinical and EMG studies.
    explanation: >-
      Confirms carrier parents are unaffected even on electrophysiological testing,
      which is what makes this arm recessive rather than dominant with reduced
      penetrance.
has_subtypes:
- name: CMS7 dominant
  display_name: CMS7, autosomal dominant (SYT2 C2B missense)
  description: >-
    Heterozygous C2B-domain variants acting through a dominant-negative mechanism:
    principally the missense changes p.Asp307Ala and p.Pro308Leu, and also a de
    novo in-frame deletion, c.1082_1096del, removing five residues from C2B.
    Later onset, foot deformities and lower-limb wasting, fatigable ocular and
    lower-limb weakness, and an accompanying non-progressive or slowly progressive
    motor neuropathy. Clinically the milder of the two forms.
- name: CMS7 recessive
  display_name: CMS7, autosomal recessive (SYT2 biallelic loss of function)
  description: >-
    Biallelic frameshift, splice-site or exonic-deletion alleles. Severe and early:
    profound weakness, hypotonia, areflexia, bulbar involvement and motor
    developmental delay, with denervation atrophy.
pathophysiology:
- name: SYT2 C2B Dominant-Negative Calcium Sensor Disruption
  biological_scale: MOLECULAR
  subtypes:
  - CMS7 dominant
  conforms_to: "neuromuscular_transmission_failure#Endplate Component Lesion"
  description: >-
    Synaptotagmin-2 is the fast calcium sensor of the motor nerve terminal: its
    tandem C2 domains bind calcium entering through active-zone channels and
    trigger SNARE-mediated vesicle fusion within a millisecond. The dominant
    variants sit in the C2B calcium-binding pocket - p.Asp307Ala removes an
    essential calcium-coordinating aspartate, p.Pro308Leu the adjacent proline -
    so the sensor is expressed but cannot read the calcium signal. The effect is
    dominant-negative rather than haploinsufficient: the mutant subunit is
    incorporated into the release machinery alongside wild-type protein and
    actively degrades its function, which is why a single allele suffices and why
    the recessive form is not simply a more severe dose of the same lesion.
  genetic_context:
    gene:
      preferred_term: SYT2
      term:
        id: hgnc:11510
        label: SYT2
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
  molecular_functions:
  - preferred_term: calcium sensing by the synaptotagmin-2 C2B domain
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0005509
      label: calcium ion binding
  cellular_components:
  - preferred_term: synaptic vesicle
    term:
      id: GO:0008021
      label: synaptic vesicle
  downstream:
  - target: Failure of Calcium-Triggered Synaptic Vesicle Fusion
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25192047
    reference_title: "Synaptotagmin 2 mutations cause an autosomal-dominant form of lambert-eaton myasthenic syndrome and nonprogressive motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An essential calcium-binding aspartate residue, Asp307Ala, was disrupted by a
      c.920A>C change in one family that presented with an autosomal-dominant
      presynaptic neuromuscular junction disorder resembling Lambert-Eaton
      myasthenic syndrome.
    explanation: >-
      Identifies the dominant lesion as disruption of an essential calcium-binding
      residue in the sensor.
  - reference: PMID:34037996
    reference_title: "Dominant and recessive congenital myasthenic syndromes caused by SYT2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The pathogenesis of the dominant form likely involves a dominant-negative
      effect due to disruption of the dual function of synaptotagmin as a Ca2+
      -sensor and modulator of synaptic vesicle exocytosis.
    explanation: >-
      Supports classifying the dominant mechanism as dominant-negative rather than
      as simple loss of function, which is what the genetic_context records. Note
      the authors hedge with "likely"; this is the field's working model, not a
      settled demonstration.
- name: Biallelic SYT2 Loss of Function
  biological_scale: MOLECULAR
  subtypes:
  - CMS7 recessive
  conforms_to: "neuromuscular_transmission_failure#Endplate Component Lesion"
  description: >-
    The recessive lesion removes the protein or its C-terminal SNARE-interaction
    surface. That surface sits at the bottom face of the C2B domain and is not a
    calcium-binding site, so this is a mechanistically distinct route to the same
    endpoint - the sensor cannot engage the fusion machinery rather than cannot
    read calcium. Alleles include frameshift, splice-donor variants causing
    in-frame skipping of the C2A exon, and a deletion spanning exons 2 to 9. The
    resulting disease is markedly more severe than the dominant form.
  genetic_context:
    gene:
      preferred_term: SYT2
      term:
        id: hgnc:11510
        label: SYT2
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: synaptotagmin-2 SNARE engagement
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0000149
      label: SNARE binding
  downstream:
  - target: Failure of Calcium-Triggered Synaptic Vesicle Fusion
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:32250532
    reference_title: "Recessive congenital myasthenic syndrome caused by a homozygous mutation in SYT2 altering a highly conserved C-terminal amino acid sequence."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Modeling of the mutation using the rat Syt1 C2B x-ray structure revealed that
      Arg397Serfs*37 disrupts a highly conserved amino acid sequence at the bottom
      face of the C2B domain not directly involved in calcium binding, but crucial
      for synaptotagmin-SNARE interaction and exocytosis.
    explanation: >-
      Supports the claim that the recessive truncating lesion damages the
      SNARE-interaction surface rather than the calcium-binding site.
  - reference: PMID:32776697
    reference_title: "Biallelic loss of function variants in SYT2 cause a treatable congenital onset presynaptic myasthenic syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report seven patients of five families, with biallelic loss of
      function variants in SYT2, clinically manifesting with a remarkably
      consistent phenotype of severe congenital onset hypotonia and weakness, with
      variable degrees of respiratory involvement.
    explanation: >-
      Establishes biallelic loss of function as a distinct mutational mechanism with
      its own consistent and more severe phenotype.
  - reference: PMID:34037996
    reference_title: "Dominant and recessive congenital myasthenic syndromes caused by SYT2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The recessive form of CMS caused by a SYT2 mutation showed far more severe
      clinical manifestations than the dominant form.
    explanation: >-
      Head-to-head comparison in one study supporting the severity difference this
      node asserts.
- name: Failure of Calcium-Triggered Synaptic Vesicle Fusion
  biological_scale: MOLECULAR
  description: >-
    Without a functioning fast calcium sensor, the calcium transient that arrives
    with each action potential no longer triggers synchronous vesicle fusion.
    Directly demonstrated in a transgenic Drosophila carrying the homologue of the
    human dominant variant, where synaptic vesicle exocytosis is dominantly
    disrupted.
  biological_processes:
  - preferred_term: calcium-triggered synchronous synaptic vesicle fusion
    modifier: DECREASED
    term:
      id: GO:0099502
      label: calcium-dependent activation of synaptic vesicle fusion
  downstream:
  - target: Reduced Quantal Acetylcholine Release at the Motor Endplate
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25192047
    reference_title: "Synaptotagmin 2 mutations cause an autosomal-dominant form of lambert-eaton myasthenic syndrome and nonprogressive motor neuropathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Characterization of the mutation homologous to the human c.920A>C variant in
      Drosophila Synaptotagmin revealed a dominant disruption of synaptic vesicle
      exocytosis using this transgenic model.
    explanation: >-
      Direct experimental demonstration that the variant disrupts vesicle
      exocytosis, and that it does so dominantly.
  - reference: PMID:17521570
    reference_title: "Synaptotagmin-1, -2, and -9: Ca(2+) sensors for fast release that specify distinct presynaptic properties in subsets of neurons."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      Synaptotagmin-1 and -2 are known Ca(2+) sensors for fast synchronous
      neurotransmitter release
    explanation: >-
      Establishes the baseline physiology this node depends on, that synaptotagmin-2
      is a calcium sensor for fast synchronous release rather than an accessory
      protein. The sentence opens the paper and restates prior mouse work rather
      than reporting this study's own result, hence quote_role BACKGROUND; the
      evidence it summarises is rodent, hence MODEL_ORGANISM.
- name: Reduced Quantal Acetylcholine Release at the Motor Endplate
  biological_scale: CELLULAR
  conforms_to: "neuromuscular_transmission_failure#Reduced Quantal Acetylcholine Release"
  description: >-
    Fewer acetylcholine quanta are released per nerve impulse. Because the deficit
    is presynaptic and the terminal can be modulated moment to moment, it
    facilitates: compound muscle action potentials are low at rest and increment
    after brief maximal exercise or fast repetitive stimulation. In CMS7 the
    post-tetanic potentiation is unusually prolonged, lasting up to 60 minutes,
    which distinguishes it from the minutes-long facilitation of Lambert-Eaton
    syndrome and is a positive diagnostic sign rather than merely a resemblance.
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  biological_processes:
  - preferred_term: acetylcholine secretion, neurotransmission
    modifier: DECREASED
    term:
      id: GO:0014055
      label: acetylcholine secretion, neurotransmission
  cellular_components:
  - preferred_term: neuromuscular junction
    term:
      id: GO:0031594
      label: neuromuscular junction
  downstream:

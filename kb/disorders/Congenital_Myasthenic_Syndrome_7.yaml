- name: Presynaptic Terminal and Endplate Remodelling
  biological_scale: TISSUE
  description: >-
    Chronic transmission failure remodels the junction on both sides. Electron
    microscopy shows overdeveloped postsynaptic folding - the postsynaptic
    compensation for a weak endplate potential - together with abundant endosomes,
    multivesicular bodies and degenerative lamellar bodies inside small nerve
    terminals, which is a picture of disturbed vesicle recycling rather than of
    vesicle depletion alone.
  cellular_components:
  - preferred_term: neuromuscular junction
    term:
      id: GO:0031594
      label: neuromuscular junction
  evidence:
  - reference: PMID:34037996
    reference_title: "Dominant and recessive congenital myasthenic syndromes caused by SYT2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The EM demonstrated overdeveloped postsynaptic folding, and abundant
      endosomes, multivesicular bodies and degenerative lamellar bodies inside
      small nerve terminals.
    explanation: >-
      The ultrastructural findings this node describes, from patient muscle biopsy.
- name: Motor Axonal Neuropathy and Denervation Atrophy
  biological_scale: TISSUE
  description: >-
    Beyond the junctional defect, SYT2 variants produce a motor axonopathy with
    distal wasting and foot deformity, and in the recessive form frank denervation
    atrophy. This is the feature that links CMS7 to the hereditary motor
    neuropathies and is why the dominant form was first described as a combined
    myasthenic and motor-neuropathy phenotype. Whether the axonal degeneration is a
    consequence of chronically failing transmission or an independent
    synaptotagmin-2 function in the axon is not established.
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  downstream:
  - target: Motor axonal neuropathy
    causal_link_type: DIRECT
  - target: Pes cavus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Distal muscle weakness
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25192047
    reference_title: "Synaptotagmin 2 mutations cause an autosomal-dominant form of lambert-eaton myasthenic syndrome and nonprogressive motor neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A c.923C>T variant affecting an adjacent residue (p.Pro308Leu) produced a
      presynaptic neuromuscular junction defect and a dominant hereditary motor
      neuropathy in a second family.
    explanation: >-
      Documents the coexisting motor neuropathy in a SYT2 family, the claim this

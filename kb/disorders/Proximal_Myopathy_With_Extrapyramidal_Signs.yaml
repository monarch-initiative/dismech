- name: Neuronal Susceptibility to Calcium Overload-Induced Death
  biological_scale: CELLULAR
  description: >-
    Cortical mitochondria from neuron-specific MICU1 knockout mice have a lower
    calcium uptake threshold, and MICU1-deficient neurons and patient cells are
    more susceptible to excitotoxic calcium overload and death. The death is
    blunted by inhibiting the mitochondrial permeability transition pore.
  biological_processes:
  - preferred_term: positive regulation of mitochondrial membrane permeability
    term:
      id: GO:0035794
      label: positive regulation of mitochondrial membrane permeability
  cell_types:

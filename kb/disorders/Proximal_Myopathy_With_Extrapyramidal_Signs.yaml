progression:
- phase: Childhood onset
  notes: >-
    Most patients present before age 5 with motor delay, weakness, fatigue or
    an incidentally raised creatine kinase, but onset spans infancy to
    adulthood. Muscle weakness is usually static or slowly progressive, while
    extrapyramidal signs tend to appear later and progress.
  evidence:
  - reference: PMID:40898676
    reference_title: "Bi-Allelic Variants in MICU1 Cause Myopathy With Extrapyramidal Signs: Case Series, Phenotypic Spectrum, and Genotype-Phenotype Correlations From 61 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Across the combined cohort, the mean age at onset was 5.9 ± 7.3 years
      (median = 3 years); 61.5% presented before age 5, while 9.5% manifested
      after 15 years.
    explanation: >-
      Onset distribution across the combined cohort of published and new
      patients.
  - reference: PMID:41018190
    reference_title: "Compound heterozygous mutations in MICU1 cause myopathy with extrapyramidal signs in two Chinese pedigrees."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      While the muscle weakness is static, most patients develop progressive
      extrapyramidal signs that may become disabling.
    explanation: >-
      Background summary of the typical course: static weakness and
      progressive extrapyramidal signs.
- phase: Adult onset
  notes: >-
    A minority of patients first show symptoms after adolescence; one
    adult-onset patient (onset at 29 years) progressed faster than
    childhood-onset cases.
  evidence:
  - reference: PMID:40898676
    reference_title: "Bi-Allelic Variants in MICU1 Cause Myopathy With Extrapyramidal Signs: Case Series, Phenotypic Spectrum, and Genotype-Phenotype Correlations From 61 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Notably, we report one adult-onset patient whose symptoms began at age 29
      and progressed more rapidly than those in childhood-onset cases.
    explanation: >-
      Documents adult onset and its faster course in one patient.
pathophysiology:
- name: MICU1 Biallelic Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic germline nonsense, canonical splice-site, frameshift and
    exon-deletion variants in MICU1 abolish the MICU1 protein. MICU1 is the
    EF-hand calcium-sensing regulator of the mitochondrial calcium uniporter
    complex in the inner mitochondrial membrane, whose pore is formed by MCU.
  genes:
  - preferred_term: MICU1
    term:
      id: hgnc:1530
      label: MICU1
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Homozygous or compound heterozygous loss-of-function alleles; absent
      MICU1 protein has been shown in patient fibroblasts.
  molecular_functions:
  - preferred_term: uniporter gatekeeping (calcium channel regulator activity)
    term:
      id: GO:0005246
      label: calcium channel regulator activity
    modifier: ABSENT
  evidence:
  - reference: PMID:24336167
    reference_title: "Loss-of-function mutations in MICU1 cause a brain and muscle disorder linked to primary alterations in mitochondrial calcium signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report mutations of MICU1 in individuals with a disease phenotype
      characterized by proximal myopathy, learning difficulties and a
      progressive extrapyramidal movement disorder.
    explanation: >-
      The discovery report linking MICU1 mutations to the disease.
  - reference: PMID:27123478
    reference_title: "Homozygous deletion in MICU1 presenting with fatigue and lethargy in childhood."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      No MICU1 protein was detected in patient fibroblasts, which had impaired
      mitochondrial calcium uptake that was rescued through the overexpression
      of the wild-type allele.
    explanation: >-
      Shows the patient allele is a protein null, and that restoring MICU1
      corrects the calcium defect in patient cells.
  downstream:
  - target: Loss of Uniporter Calcium Threshold and Cooperative Activation
    causal_link_type: DIRECT
    description: >-
      Without MICU1 the uniporter is no longer held shut at low cytosolic
      calcium and is no longer cooperatively activated at high calcium.
    evidence:
    - reference: PMID:33428302
      reference_title: "Molecular pathophysiology of human MICU1 deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        threshold and the cooperative activation of mitochondrial Ca2+ uptake
        were lost in MICU1-deficient cells
      explanation: >-
        Patient-derived MICU1-deficient cells lose both the calcium threshold
        and cooperative activation of uptake.
- name: Loss of Uniporter Calcium Threshold and Cooperative Activation
  biological_scale: MOLECULAR
  description: >-
    MICU1 normally sets a cytosolic calcium threshold below which the uniporter
    stays closed and cooperatively boosts uptake once calcium rises. Its loss
    makes uptake inappropriately active at resting and low cytosolic calcium,
    while blunting the rise in uptake during large cytosolic calcium transients.
    Cytosolic calcium signals are correspondingly reduced in patient cells.
  genes:
  - preferred_term: MICU1
    term:
      id: hgnc:1530
      label: MICU1
  biological_processes:
  - preferred_term: calcium import into the mitochondrion
    term:
      id: GO:0036444
      label: calcium import into the mitochondrion
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:24336167
    reference_title: "Loss-of-function mutations in MICU1 cause a brain and muscle disorder linked to primary alterations in mitochondrial calcium signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In fibroblasts from subjects with MICU1 mutations, agonist-induced
      mitochondrial Ca(2+) uptake at low cytosolic Ca(2+) concentrations was
      increased, and cytosolic Ca(2+) signals were reduced.
    explanation: >-
      Patient fibroblasts show excess uptake at low cytosolic calcium, the
      loss of the gatekeeping threshold.
  - reference: PMID:31665639
    reference_title: "Dysregulation of Mitochondrial Ca(2+) Uptake and Sarcolemma Repair Underlie Muscle Weakness and Wasting in Patients and Mice Lacking MICU1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      detected in MICU1-patient cells and restored the mitochondrial Ca2+
      uptake threshold back to what was observed in CTRL fibroblasts.
    explanation: >-
      Re-expressing MICU1 in patient fibroblasts restores the normal uptake
      threshold, showing that MICU1 loss lowers it.
  - reference: PMID:31665639
    reference_title: "Dysregulation of Mitochondrial Ca(2+) Uptake and Sarcolemma Repair Underlie Muscle Weakness and Wasting in Patients and Mice Lacking MICU1."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      This increase was larger in MICU1-smKO than in CTRL ... supporting that
      impaired gatekeeping resulted in mitochondrial Ca2+ overload.
    explanation: >-
      In myofibers from skeletal muscle-specific knockout mice, loss of
      gatekeeping produces excess mitochondrial calcium uptake.
  downstream:
  - target: Resting Mitochondrial Calcium Overload
    causal_link_type: DIRECT
    description: >-
      Ungated uptake at resting cytosolic calcium raises matrix calcium.
    evidence:
    - reference: PMID:28132899
      reference_title: "Pathological consequences of MICU1 mutations on mitochondrial calcium signalling and bioenergetics."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        We propose that deregulation of mitochondrial Ca2+ uptake through loss
        of MICU1 raises resting ... initiating a futile Ca2+ cycle, whereby
        continuous mitochondrial Ca2+ influx is balanced by Ca2+ efflux through
        the sodium calcium exchanger (NLCXm).
      explanation: >-
        Links the loss of uptake regulation to raised resting matrix calcium in
        patient fibroblasts.
  - target: Impaired Mitochondrial Calcium Uptake During Muscle Activity
    causal_link_type: DIRECT
    description: >-
      Loss of cooperative activation blunts the mitochondrial calcium rise that
      normally accompanies excitation-contraction coupling and membrane injury.
    evidence:
    - reference: PMID:31665639
      reference_title: "Dysregulation of Mitochondrial Ca(2+) Uptake and Sarcolemma Repair Underlie Muscle Weakness and Wasting in Patients and Mice Lacking MICU1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Lack of MICU1 is associated with impaired mitochondrial Ca2+ uptake

genetic:
- name: MICU1
  gene_term:
    preferred_term: MICU1
    term:
      id: hgnc:1530
      label: MICU1
  presence: PRESENT
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    MICU1 (mitochondrial calcium uptake 1; previous symbol CBARA1) is the only
    gene associated with this disease. MONDO records no causal-gene axiom for
    MONDO:0014300, but OMIM 615673 and every case report in this entry assign
    it to MICU1. Exon-level deletions (exon 1, exon 2, exons 4 to 8) are a
    recurrent allele class and can be missed by sequence-only analysis. No
    ClinGen gene-disease validity record for MICU1 is cached in
    references_cache/, so gene_disease_validity is left absent.
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:24336167
    reference_title: "Loss-of-function mutations in MICU1 cause a brain and muscle disorder linked to primary alterations in mitochondrial calcium signaling."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report mutations of MICU1 in individuals with a disease phenotype
      characterized by proximal myopathy, learning difficulties and a
      progressive extrapyramidal movement disorder.
    explanation: >-
      Discovery of MICU1 as the causal gene.
  - reference: PMID:40898676
    reference_title: "Bi-Allelic Variants in MICU1 Cause Myopathy With Extrapyramidal Signs: Case Series, Phenotypic Spectrum, and Genotype-Phenotype Correlations From 61 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The targeted neuromuscular assessment, along with muscle biopsy and exome
      sequencing, identified six pathogenic MICU1 variants
    explanation: >-
      Independent families with pathogenic MICU1 variants.
  variants:
  - name: c.553C>T founder nonsense variant
    description: >-
      A nonsense variant recurrent in consanguineous Middle Eastern families,
      homozygous in 12 of 13 patients in one series. Reports name the protein
      change differently (p.Gln185* in the founder series, p.Arg185* in later
      reports).
    evidence:
    - reference: PMID:29721912
      reference_title: "A Middle Eastern Founder Mutation Expands the Genotypic and Phenotypic Spectrum of Mitochondrial MICU1 Deficiency: A Report of 13 Patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Of these patients, 12/13 are homozygous for a novel founder mutation
        c.553C>T (p.Q185*) that is predicted to lead to a complete loss of
        function of MICU1
      explanation: >-
        Identifies the founder allele and its predicted null effect.
  - name: Exon 1 deletion
    description: >-
      A homozygous 2,755 bp deletion removing exon 1, detected from exome read
      depth in two cousins with episodic fatigue and lethargy.
    evidence:
    - reference: PMID:27123478
      reference_title: "Homozygous deletion in MICU1 presenting with fatigue and lethargy in childhood."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Analysis of the exome sequencing depth revealed a homozygous deletion of
        exon 1 of MICU1 within a 2,755-base pair deletion.
      explanation: >-
        Shows a copy-number allele detected by exome depth analysis.

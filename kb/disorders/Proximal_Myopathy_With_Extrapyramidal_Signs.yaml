notes: >-
  MICU1 deficiency is a disorder of mitochondrial calcium signalling rather
  than of the respiratory chain: lactate is normal and muscle respiratory-chain
  enzyme activities can be normal.

  No GeneReviews chapter covers this disease: PubMed searches for "MICU1"
  and for "MPXPS", each combined with genereviews[book], returned zero
  records, and the disease name and synonyms match no chapter title in the
  Bookshelf index.

  Not curated as phenotypes: polymicrogyria, dysmorphic basal ganglia,
  seizures and encephalopathy, reported together in one child
  (PMID:32395406); facial dysmorphisms, which differ from report to report;
  and the congenital ptosis and corpus callosum thickening of a child whose
  only MICU1 finding is a homozygous missense variant of uncertain
  significance (PMID:42459038). Ptosis itself is curated because published
  summaries and Orphanet list it as a recurring variable feature. An
  episodic presentation with acute weakness and very high creatine kinase was
  reported with a homozygous deletion of the first coding exon
  (PMID:36425804).

animal_models:
- name: Micu1 knockout mouse (whole body)
  species: Mouse
  genotype: Micu1 -/-
  publication: PMID:27477272
  description: >-
    Whole-body Micu1 knockout causes high but incomplete perinatal mortality.
    Survivors show ataxia, muscle weakness, raised resting mitochondrial
    calcium, altered mitochondrial morphology and reduced ATP, then improve
    spontaneously with age as EMRE expression falls. Deleting one Emre allele
    rescues mortality and calcium uptake.
  modeled_mechanisms:
  - target: Resting Mitochondrial Calcium Overload
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces the raised resting mitochondrial calcium of patient cells in
      vivo.
    limitations: >-
      The defect and the phenotype improve with age in mice through EMRE
      downregulation, whereas extrapyramidal signs progress in patients; and
      most knockout pups die perinatally, which is not a human feature.
    readouts:
    - name: Resting mitochondrial calcium
      target: Resting Mitochondrial Calcium Overload
      direction: INCREASED
      interpretation: Direct measure of the overload node in young animals.
      evidence:
      - reference: PMID:27477272
        reference_title: "MICU1 Serves as a Molecular Gatekeeper to Prevent In Vivo Mitochondrial Calcium Overload."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Early in life, these animals display a range of biochemical
          abnormalities, including increased resting mitochondrial calcium
          levels, altered mitochondrial morphology, and reduced ATP.
        explanation: Reports the measurement and its direction.
    evidence:
    - reference: PMID:27477272
      reference_title: "MICU1 Serves as a Molecular Gatekeeper to Prevent In Vivo Mitochondrial Calcium Overload."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Similar to afflicted patients, viable MICU1(-/-) mice manifest marked
        ataxia and muscle weakness.
      explanation: >-
        The knockout reproduces the patient phenotype, supporting its use for
        this node.
- name: Skeletal muscle-specific Micu1 knockout mouse
  species: Mouse
  genotype: Muscle-specific conditional Micu1 deletion (MICU1-smKO)
  publication: PMID:31665639
  description: >-
    Mice lacking MICU1 in skeletal muscle show a lowered uptake threshold,
    impaired mitochondrial calcium uptake during contraction and after
    sarcolemmal injury, poor membrane repair, weakness, fatigue and
    activity-induced myofiber damage.
  modeled_mechanisms:
  - target: Defective Sarcolemmal Repair
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Isolated myofibers repair laser-induced sarcolemmal injury poorly.
    limitations: >-
      Muscle-only deletion cannot show any contribution of neuronal or
      systemic MICU1 loss to the muscle phenotype.
    evidence:
    - reference: PMID:31665639
      reference_title: "Dysregulation of Mitochondrial Ca(2+) Uptake and Sarcolemma Repair Underlie Muscle Weakness and Wasting in Patients and Mice Lacking MICU1."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        MICU1 deficit compromises mitochondrial Ca2+ uptake during sarcolemmal
        injury, which causes ineffective repair of the damaged myofibers.
      explanation: >-
        The model directly demonstrates the repair defect.
- name: Satellite cell-specific Micu1 knockout mouse
  species: Mouse
  genotype: Pax7-driven conditional Micu1 deletion in satellite cells
  publication: PMID:42349424
  description: >-
    Micu1 deletion in Pax7-positive satellite cells leaves satellite cell
    homeostasis intact but impairs regeneration after injury and
    self-renewal after transplantation.
  modeled_mechanisms:
  - target: Impaired Satellite Cell-Mediated Muscle Regeneration
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    model_scale: CELLULAR
    description: >-
      Directly measures regeneration after experimental muscle injury.
    limitations: >-
      Regeneration was tested after experimental injury in mice; whether
      satellite cell dysfunction contributes to the human myopathy has not
      been examined.
    evidence:
    - reference: PMID:42349424
      reference_title: "Elevated mitochondrial Ca(2+) impairs satellite cell pool expansion in response to skeletal muscle injury."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Satellite cell self-renewal from Micu1-deficient donor cells in
        transplant recipients was also heavily compromised.
      explanation: >-
        The model shows the satellite cell defect directly.
- name: Neuron-specific Micu1 knockout mouse
  species: Mouse
  genotype: Neuron-specific conditional Micu1 deletion (nKO)
  publication: PMID:35302860
  description: >-
    Mice lacking MICU1 in neurons develop progressive motor and cognitive
    deficits with degeneration of spinal and cortical motor neurons, and
    their neurons are more susceptible to calcium overload-induced death.
  modeled_mechanisms:
  - target: Progressive Neurodegeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Shows progressive neurodegeneration with motor and cognitive deficits.
    limitations: >-
      The degeneration reported is of spinal and cortical motor neurons; a
      basal ganglia lesion that would explain the human extrapyramidal signs
      was not shown.
    evidence:
    - reference: PMID:35302860
      reference_title: "Uncontrolled mitochondrial calcium uptake underlies the pathogenesis of neurodegeneration in MICU1-deficient mice and patients."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These animals show progressive, abnormal motor and cognitive phenotypes
        likely caused by the degeneration of motor neurons in the spinal cord and
        the cortex.
      explanation: >-
        Progressive neurodegeneration in the model.
discussions:
- discussion_id: mpxps_mouse_age_dependent_improvement
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why do MICU1-null mice improve with age, through EMRE downregulation,
    while the extrapyramidal disorder in patients tends to progress?
  attaches_to:
  - pathophysiology#Resting Mitochondrial Calcium Overload
  - phenotypes#Progressive extrapyramidal movement disorder
  rationale: >-
    The whole-body knockout reproduces the cellular defect but loses it with
    age as the uniporter is remodelled, whereas the human course shows
    static weakness with progressive extrapyramidal signs. Whether human
    tissues remodel the uniporter in the same way, and whether lowering EMRE
    or MCU would help patients, is untested.
  status: OPEN
  evidence:
  - reference: PMID:27477272
    reference_title: "MICU1 Serves as a Molecular Gatekeeper to Prevent In Vivo Mitochondrial Calcium Overload."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Older MICU1(-/-) mice show marked, spontaneous improvement coincident
      with improved mitochondrial calcium handling and an age-dependent
      reduction in EMRE expression.
    explanation: >-
      The age-dependent improvement in mice that raises the question.
  - reference: PMID:27477272
    reference_title: "MICU1 Serves as a Molecular Gatekeeper to Prevent In Vivo Mitochondrial Calcium Overload."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Remarkably, deleting one allele of EMRE helps normalize calcium uptake
      while simultaneously rescuing the high perinatal mortality observed in
      young MICU1(-/-) mice.
    explanation: >-
      EMRE reduction rescues the mouse, the basis for proposing uniporter
      modulation as therapy.
- discussion_id: mpxps_extrapyramidal_substrate
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which neurons and brain regions are damaged in patients with MICU1
    deficiency, and what explains the extrapyramidal signs?
  attaches_to:
  - pathophysiology#Progressive Neurodegeneration
  - phenotypes#Progressive extrapyramidal movement disorder
  rationale: >-
    The neuronal mechanism comes from a neuron-specific mouse knockout showing
    motor neuron degeneration in spinal cord and cortex. No human
    neuropathology has been reported in the cited literature, and the basal
    ganglia circuitry implied by chorea and dystonia has not been studied.
  status: OPEN
  evidence:
  - reference: PMID:35302860
    reference_title: "Uncontrolled mitochondrial calcium uptake underlies the pathogenesis of neurodegeneration in MICU1-deficient mice and patients."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      While studies in patient-derived cells revealed altered mitochondrial
      calcium signaling, the neuronal pathogenesis was difficult to study.
    explanation: >-
      States that neuronal pathogenesis in patients has been hard to study.

      explanation: >-
        In skeletal muscle-specific knockout mice, MICU1 loss impairs
        mitochondrial calcium uptake during excitation-contraction.
  - target: Episodic fatigue and lethargy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-

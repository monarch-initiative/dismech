name: Proximal Myopathy With Extrapyramidal Signs
creation_date: "2026-10-14T15:02:40Z"
description: >-
  An autosomal recessive neuromuscular disorder caused by biallelic
  loss-of-function variants in MICU1, the calcium-sensing gatekeeper subunit
  of the mitochondrial calcium uniporter. Onset is usually in early childhood,
  with proximal muscle weakness, easy fatigability, motor and speech delay,
  learning difficulties and a persistently raised serum creatine kinase with
  normal lactate. Many patients develop a progressive extrapyramidal movement
  disorder (chorea, tremor, dystonia), and variable features include ataxia,
  hyporeflexia, raised liver transaminases, short stature, microcephaly,
  nystagmus, cataract and optic atrophy. Loss of MICU1 removes the calcium
  threshold and cooperative activation of the uniporter, so mitochondria take
  up calcium at resting cytosolic concentrations and fail to boost uptake
  during muscle activity, leading to mitochondrial calcium overload and
  fragmentation, impaired muscle energetics and sarcolemmal repair, and
  vulnerability of neurons to calcium overload-induced death.

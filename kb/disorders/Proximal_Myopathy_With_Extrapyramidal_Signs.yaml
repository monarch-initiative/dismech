    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found increased susceptibility to mitochondrial Ca2+ overload-induced
      excitotoxic insults and cell death in MICU1-KO neurons and
      MICU1-deficient patient-derived cells, which can be blunted by inhibiting
      the mitochondrial permeability transition pore.
    explanation: >-
      Calcium overload-induced death of MICU1-deficient neurons, dependent on
      the permeability transition pore.
  downstream:

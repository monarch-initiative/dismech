      label: Autosomal recessive inheritance
  description: >-
    Affected individuals carry two MICU1 loss-of-function alleles, homozygous
    (often in consanguineous families) or compound heterozygous. Heterozygous
    carrier parents are unaffected.
  evidence:
  - reference: PMID:40898676
    reference_title: "Bi-Allelic Variants in MICU1 Cause Myopathy With Extrapyramidal Signs: Case Series, Phenotypic Spectrum, and Genotype-Phenotype Correlations From 61 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Myopathy with extrapyramidal signs (MPXPS) is a rare, autosomal-recessive,
      multisystem disorder caused by biallelic loss-of-function (LOF) variants
      in MICU1
    explanation: >-
      States the recessive mode of inheritance and the biallelic genotype in a
      series combining new and published patients.
  - reference: PMID:39973469
    reference_title: "MICU1 related myopathy - a rare report from India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The variants were segregating in unaffected parents in heterozygous state
    explanation: >-
      Segregation in this family shows heterozygous carrier parents are
      unaffected, consistent with recessive inheritance.
prevalence:
- population: Published MPXPS literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence has been measured. A 2025 case series combined
    seven new patients with 54 previously published cases, and a 2022 case
    report described the disease as occurring at a frequency below 1 in
    1,000,000. A founder nonsense variant (c.553C>T) is enriched in
    consanguineous Middle Eastern families.
  evidence:
  - reference: PMID:40898676
    reference_title: "Bi-Allelic Variants in MICU1 Cause Myopathy With Extrapyramidal Signs: Case Series, Phenotypic Spectrum, and Genotype-Phenotype Correlations From 61 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We clinically and genetically characterized seven affected individuals
      from six Iranian-Turkish consanguineous families and combined these data
      with 54 previously published cases (total of 62).
    explanation: >-
      Gives the count of published patients, the basis for the literature
      case-count record.
  - reference: PMID:36425804
    reference_title: "Case report: Unusual episodic myopathy in a patient with novel homozygous deletion of first coding exon of MICU1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      is a rare autosomal recessive disease due to a pathogenic variant in the
      MICU1 gene with a frequency lower than 1/1000000.
    explanation: >-
      The case report's background statement places the disease in the
      ultra-rare range; it does not give a measured prevalence.
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Orphanet worldwide point-prevalence class below 1 in 1,000,000, sourced to
    the discovery report.
  evidence:
  - reference: ORPHA:401768
    reference_title: "Proximal myopathy with extrapyramidal signs"
    supports: SUPPORT
    evidence_source: OTHER

diagnosis:
- name: Exome sequencing with copy-number analysis
  diagnosis_term:
    preferred_term: Whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  description: >-
    Diagnosis is by finding biallelic MICU1 variants, usually by exome
    sequencing. Exon-level deletions occur, so read-depth or other copy-number
    analysis is needed. Targeted testing for the c.553C>T founder variant is
    reasonable in Middle Eastern patients.
  evidence:
  - reference: PMID:27123478
    reference_title: "Homozygous deletion in MICU1 presenting with fatigue and lethargy in childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of the exome sequencing depth revealed a homozygous deletion of
      exon 1 of MICU1 within a 2,755-base pair deletion.
    explanation: >-
      The causal allele was found only by analyzing exome read depth.
  - reference: PMID:29721912
    reference_title: "A Middle Eastern Founder Mutation Expands the Genotypic and Phenotypic Spectrum of Mitochondrial MICU1 Deficiency: A Report of 13 Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      our work suggests that targeted analysis of the MICU1 founder mutation in
      Middle Eastern patients may be warranted.
    explanation: >-

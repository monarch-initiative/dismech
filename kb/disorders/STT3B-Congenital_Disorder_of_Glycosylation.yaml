    quote_role: BACKGROUND
    snippet: "STT3A isoform of the OST is located next to the protein translocation channel (12) to insure co-translational glycosylation of NXT/S sites on nascent chains (13), while STT3B mediates post-translational glycosylation of the sites that elude the STT3A complex (11)."

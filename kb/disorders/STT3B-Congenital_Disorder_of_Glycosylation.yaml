genetic:
- name: STT3B
  notes: >-
    STT3B (3p24.1) encodes the catalytic subunit of the OST-B
    oligosaccharyltransferase complex. Two homozygous variants are reported,
    each in one patient: the intronic c.1539+20G>T, with absent STT3B mRNA,
    severely reduced protein and rescue of the cellular glycosylation defect by
    STT3B cDNA, and the missense c.38C>G (p.Ser13Trp), with no functional
    data. ClinGen classifies STT3B as Limited (autosomal recessive) for the
    broad concept congenital disorder of glycosylation (MONDO:0015286, 2026),
    which is not this entry's MONDO:0014271, so no tier is recorded under
    gene_disease_validity. relationship_type is UNKNOWN because the evidence is
    two patients, only one with functional studies.
  gene_term:
    preferred_term: STT3B
    term:
      id: hgnc:30611
      label: STT3B
  relationship_type: UNKNOWN
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:23842455
      reference_title: "Mutations in STT3A and STT3B cause two congenital disorders of glycosylation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A homozygous mutation (c.1877T > C) in STT3A causes a p.Val626Ala change and a homozygous intronic mutation (c.1539 + 20G > T) in STT3B causes the other disorder."
      explanation: Homozygosity in a consanguineous family.
  variants:
  - name: STT3B c.1539+20G>T
    type: intronic
    description: >-
      Homozygous in the first patient; STT3B mRNA was absent and the protein
      severely reduced in his fibroblasts.
    evidence:
    - reference: PMID:23842455
      reference_title: "Mutations in STT3A and STT3B cause two congenital disorders of glycosylation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Protein immuno-blotting showed severe reduction in STT3B in Case-2 fibroblasts (Fig. 2B), which was due to a complete absence of mRNA based on PCR analysis (data not shown)."
      explanation: >-
        Loss of STT3B mRNA and protein in the patient's fibroblasts (Case-2 of
        the report is the STT3B patient).
  - name: STT3B c.38C>G (p.Ser13Trp)
    type: missense
    description: Homozygous in the second patient; not functionally tested.
    evidence:
    - reference: PMID:32253875
      reference_title: "Novel mutation and severe respiratory failure in congenital disorders of glycosylation Type Ix."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A novel homozygous mutation in the STT3B presence of c.38C > G that encodes p.S13W (p.Ser13Trp) was detected with next generation sequencing."
      explanation: The variant in the second patient.
  evidence:
  - reference: PMID:23842455
    reference_title: "Mutations in STT3A and STT3B cause two congenital disorders of glycosylation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "STT3B-deficient cells complemented with STT3B cDNA showed ∼85% decrease in Glyc-ER-GFP fluorescence"
    explanation: >-
      The STT3B-deficient cells are the patient's (Case-2) fibroblasts, and the
      reporter fluoresces only in N-glycosylation-deficient cells, so the fall
      in fluorescence on adding STT3B cDNA shows that wild-type STT3B corrects
      the patient cells' glycosylation defect.

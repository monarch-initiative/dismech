name: STT3B-Congenital Disorder of Glycosylation
creation_date: "2026-11-27T14:50:52Z"
category: Mendelian
disease_term:
  preferred_term: STT3B-congenital disorder of glycosylation
  term:
    id: MONDO:0014271
    label: STT3B-congenital disorder of glycosylation
description: >-
  STT3B-congenital disorder of glycosylation (STT3B-CDG, CDG-Ix) is a
  recessive disorder of N-linked protein glycosylation caused by biallelic
  variants in STT3B, one of the two catalytic subunits of the
  oligosaccharyltransferase that transfers the preassembled glycan from its
  lipid carrier onto asparagine residues of proteins in the endoplasmic
  reticulum. The STT3A complex glycosylates proteins as they are translated;
  the STT3B complex glycosylates, after translation, the sites the STT3A
  complex misses.

  Two patients have been reported, both from consanguineous families. The
  first, a boy of Iraqi ancestry homozygous for an intronic variant, had
  significant congenital and developmental abnormalities with hypotonia,
  intellectual disability, failure to thrive and feeding problems. The
  second, a 5-year-old boy homozygous for p.Ser13Trp, had dysmorphic
  features, hypotonia, developmental delay, epileptic spasms, recurrent apnoea
  and respiratory failure.

  In the first patient's fibroblasts STT3B mRNA was absent and the protein
  severely reduced; STT3B-specific substrates were hypoglycosylated, and
  STT3B cDNA restored glycosylation of a reporter protein. Serum transferrin,
  the standard screening test for type I CDG, was only very mildly abnormal,
  so STT3B-CDG can be missed by transferrin analysis and needs sequencing to
  be found. The paralogue STT3A causes the separate STT3A-CDG.
parents:
- congenital disorder of glycosylation type I
- disorder of protein N-glycosylation
synonyms:

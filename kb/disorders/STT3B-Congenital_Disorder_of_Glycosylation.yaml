differential_diagnoses:
- name: STT3A-congenital disorder of glycosylation
  description: >-
    The paralogue's disorder, a type I CDG with neurological involvement in
    which serum transferrin is clearly hypoglycosylated, unlike STT3B-CDG.
  distinguishing_features:
  - Biallelic STT3A rather than STT3B variants
  - Clearly abnormal type I transferrin profile
- name: Other type I congenital disorders of glycosylation
  description: >-
    Hypotonia, developmental delay and failure to thrive are shared by many
    type I CDGs, most of which give a clearly abnormal transferrin profile.
  distinguishing_features:
  - Biallelic STT3B variants
notes: >-
  Two patients have been reported (PMID:23842455, PMID:32253875). On
  2026-11-27 the PubMed query STT3B[tiab] AND (patient OR patients OR variant
  OR variants OR mutation OR mutations OR CDG OR "congenital disorder of
  glycosylation") returned 32 records, and the Europe PMC full-text query
  "STT3B" AND ("homozygous" OR "compound heterozygous" OR "biallelic") AND
  ("congenital disorder of glycosylation" OR "CDG") returned 37; neither
  contained a further STT3B patient. The MONDO definition, taken from
  Orphanet:370924, also lists intrauterine growth retardation, microcephaly,
  optic nerve atrophy and genital anomalies (micropenis, hypoplastic scrotum,
  undescended testes). The cached 2013 report refers to its Table 1 for the
  first patient's clinical features but does not include the table, and the
  Orphanet record is not cached, so those features are not recorded as
  phenotypes here.

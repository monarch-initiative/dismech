- name: Intercalated Disc and Costamere Destabilization
  biological_scale: CELLULAR
  role: effector
  description: >-
    The structural lesion of CMD1W. Adherens junctions become abnormal and the
    intercalated disc dissolves; cadherin and beta1D integrin fall at the junction. In the
    mouse this precedes any measurable contractile deficit, which places the junctional
    change upstream of the pump failure rather than as a consequence of it. The one human
    patient examined by electron microscopy, a p.Arg975Trp carrier, had grossly abnormal
    intercalated discs.

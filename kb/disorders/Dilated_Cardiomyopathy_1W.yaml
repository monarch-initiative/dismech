  evidence:
  - reference: PMID:32516855
    reference_title: "An assessment of the role of vinculin loss of function variants in inherited cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is conceivable that this is the result of a gene-environment interaction, such
      that disease is more likely to occur in the setting of non-genetic stressors (e.g.
      viral myocarditis).
    explanation: >-
      The environmental arm of the second-hit requirement, stated by the authors as a
      conjecture rather than a measured interaction.
  - reference: PMID:33983834
    reference_title: "The Complex and Diverse Genetic Architecture of Dilated Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      preliminary data from our studies and others suggests that at least 20% to 30% of

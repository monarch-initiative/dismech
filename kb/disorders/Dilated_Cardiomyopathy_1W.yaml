inheritance:
- name: Autosomal dominant
  description: >-
    CMD1W is transmitted as an autosomal dominant trait and affected individuals are
    heterozygous; ClinGen's Dilated Cardiomyopathy Gene Curation Expert Panel records
    autosomal dominant inheritance for the VCL-dilated cardiomyopathy relationship.
    Penetrance is the qualification that matters most for this entry. Family studies of
    predicted loss-of-function alleles repeatedly identify unaffected heterozygous
    parents, and the aggregate analysis concluded that heterozygous VCL loss of function
    on its own is insufficient to produce cardiomyopathy. The metavinculin-specific
    missense and in-frame alleles have not been shown to behave the same way, and the
    two classes should not be assumed to share a penetrance.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  evidence:
  - reference: CGGV:assertion_2d46699a-5f8c-460d-9233-bec4e2ecf560-2024-08-09T160000.000Z
    reference_title: "VCL / dilated cardiomyopathy (Strong)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "VCL | HGNC:12665 | dilated cardiomyopathy | MONDO:0005021 | AD | Strong"
    explanation: >-
      ClinGen records autosomal dominant inheritance for this gene-disease relationship,
      which is the authority for the mode of inheritance asserted here.
  - reference: PMID:32516855
    reference_title: "An assessment of the role of vinculin loss of function variants in inherited cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The lack of clear segregation data confirms that VCL pLOF variants do not cause a
      phenotype with a highly penetrant autosomal dominant pattern of inheritance
    explanation: >-
      States directly that the loss-of-function alleles do not behave as a highly
      penetrant dominant trait, which is what INCOMPLETE penetrance records here.
  - reference: PMID:32516855
    reference_title: "An assessment of the role of vinculin loss of function variants in inherited cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Family studies demonstrated that heterozygous loss of function of VCL alone is
      insufficient to cause cardiomyopathy but that these variants do contribute to
      disease risk.
    explanation: >-
      The family-study conclusion behind the reduced-penetrance qualification on this
      inheritance block.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No prevalence or incidence estimate exists for CMD1W as an entity. Reported
    frequencies are either variant carrier frequencies in reference populations or
    variant yields within cardiomyopathy testing cohorts, and neither is a disease rate,
    because penetrance of the loss-of-function class is low and variant interpretation is
    unsettled. The two records below are recorded as what they are rather than being
    promoted into a prevalence figure.
- population: gnomAD v2.1 exomes reference population
  measure_type: CARRIER_FREQUENCY
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 46.0
  notes: >-
    Frequency of VCL predicted loss-of-function alleles among reference-population
    individuals (58/125,297), after excluding variants predicted to escape
    nonsense-mediated decay. This is a variant carrier frequency, not a CMD1W prevalence:
    the same study concludes the alleles are not highly penetrant, so most carriers are
    not expected to be affected.
  evidence:
  - reference: PMID:32516855
    reference_title: "An assessment of the role of vinculin loss of function variants in inherited cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This equated to a prevalence of VCL pLOF variants of 0.00046 (58/125,297) in
      individuals in gnomAD
    explanation: >-
      Source of the 0.00046 reference-population carrier frequency, normalized here to 46
      per 100,000.
progression:
- phase: Infantile presentation with severe systolic dysfunction
  age_range: Median 2 months at diagnosis in the genotype-defined series
  notes: >-
    Presentation in the loss-of-function series was in early infancy with severe
    ventricular dilation and depressed ejection fraction.
  evidence:
  - reference: PMID:37548861
    reference_title: "Heart Failure with Recovered Ejection Fraction in Patients with Vinculin Loss-of-function Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Median age at diagnosis was 2 months, median LV ejection fraction was 24%, and
      median LV end-diastolic diameter z-score was 10.8.
    explanation: >-
      Gives the age and severity at presentation that define this phase.
- phase: Recovery of ventricular function on heart failure therapy
  age_range: Median 2.7 years at recovery
  notes: >-
    Five of six infants normalized left ventricular function 0.3 to 3.2 years after
    diagnosis while on an ACE inhibitor and a beta-blocker; one progressed to end-stage
    failure and transplantation. Six patients is not a natural history, and one patient in
    the series relapsed after medications were stopped and recovered again on
    re-treatment.
  evidence:
  - reference: PMID:37548861
    reference_title: "Heart Failure with Recovered Ejection Fraction in Patients with Vinculin Loss-of-function Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Five patients (83%) showed normalization of LV function at a median age of 2.7
      years.
    explanation: >-
      Establishes the recovery phase and its timing.
  - reference: PMID:37548861
    reference_title: "Heart Failure with Recovered Ejection Fraction in Patients with Vinculin Loss-of-function Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One patient progressed to end-stage HF requiring heart transplant."
    explanation: >-
      Records that recovery is not universal, so this phase is not an expected outcome.
mechanistic_hypotheses:
- hypothesis_group_id: metavinculin_altered_actin_crosslinking
  hypothesis_label: Metavinculin tail alleles act by qualitatively altered actin cross-linking
  status: CANONICAL
  description: >-
    The founding CMD1W alleles p.Arg975Trp and p.Leu954del lie in the
    metavinculin-specific exon and are not dosage lesions. They change how metavinculin
    cross-links actin filaments, which is a qualitative change in the behaviour of a
    protein that is still present, and their effect is confined to the muscle-specific
    isoform. This is the model under which force transmission at the thin
    filament-intercalated disc interface is disrupted without vinculin being lost.
  evidence:
  - reference: PMID:11815424
    reference_title: "Metavinculin mutations alter actin interaction in dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      significantly altered metavinculin-mediated cross-linking of actin filaments in an
      in vitro assay
    explanation: >-
      The functional measurement the hypothesis rests on: the alleles change actin
      cross-linking rather than abolishing the protein.
- hypothesis_group_id: vcl_plof_reduced_penetrance_risk_allele
  hypothesis_label: VCL loss-of-function alleles act as moderate-penetrance risk alleles requiring a second contribution
  status: CANONICAL
  description: >-
    Predicted loss-of-function alleles affect both the vinculin and the metavinculin
    transcripts and are strongly enriched in dilated cardiomyopathy referrals, but they
    are frequently inherited from unaffected parents and co-occur with variants in other
    cardiomyopathy genes. The best-supported reading is that they raise risk rather than
    determine disease, and that expression requires an additional genetic or
    environmental contribution. This is why the historical Mendelian label CMD1W should
    not be read as asserting that every heterozygous VCL variant is causal.
  evidence:
  - reference: PMID:32516855
    reference_title: "An assessment of the role of vinculin loss of function variants in inherited cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, the data are most consistent with VCL pLOF variants acting as genetic
      modifiers that can lead to more severe disease or the precipitation of disease in
      the presence of additional risk factors, such as other genetic and/or environmental
      contributions.
    explanation: >-
      The study's own statement of this model, drawn from the aggregated family studies.
  - reference: PMID:32516855
    reference_title: "An assessment of the role of vinculin loss of function variants in inherited cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      VCL loss-of-function variants should be reported in a diagnostic setting but need
      to be clearly distinguished as having lower penetrance.
    explanation: >-
      The reporting recommendation that follows from treating these as risk alleles.
- hypothesis_group_id: infantile_adhesion_immaturity_recovery
  hypothesis_label: Infantile dependence on vinculin explains early onset and later recovery
  status: EMERGING
  description: >-
    Proposed explanation for the two features that distinguish the loss-of-function
    phenotype: onset concentrated in infancy, and frequent normalization of ventricular
    function thereafter. If vinculin haploinsufficiency matters most while intercalated
    disc adhesion is still maturing, then the same allele would be more disruptive in
    infancy and less so once vinculin has localized into a mature disc. Supporting
    evidence that adhesion remodeling is a developmentally timed, vinculin-dependent
    process comes from the mouse; the human claim is an inference from a six-patient
    series and is not established.
  evidence:
  - reference: PMID:37548861
    reference_title: "Heart Failure with Recovered Ejection Fraction in Patients with Vinculin Loss-of-function Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      It is possible that vinculin haploinsufficiency may be more disruptive in infancy
      when E-cadherin is still immature.
    explanation: >-
      The authors state the hypothesis explicitly, and label it as a possibility rather
      than a finding; the observation it is built on is the recovery of five of six
      infants.
  - reference: PMID:41231303
    reference_title: "Vinculin Y822 phosphorylation regulates adhesion remodeling during cardiomyocyte maturation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      VCL Y822 phosphorylation levels peaked during adhesion remodeling in the developing
      heart and were reduced as adhesions matured postnatally.
    explanation: >-
      Independent demonstration in mouse that vinculin-dependent adhesion remodeling is
      developmentally timed, which is the premise the human hypothesis needs. It does not
      show that this timing explains the human recovery.
pathophysiology:
- name: Metavinculin Tail Variant Altering Actin Cross-Linking
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  mechanism_confidence: ESTABLISHED
  description: >-
    The founding CMD1W lesion is a heterozygous variant in the metavinculin-specific exon
    of VCL: the missense allele p.Arg975Trp or the three-base-pair in-frame deletion
    p.Leu954del. Because the affected exon is spliced only into metavinculin, these
    alleles perturb the heart and smooth muscle isoform while leaving ubiquitous vinculin
    intact. Both involve conserved residues and were absent from 500 control individuals.
    This is a qualitative change in a protein that is still expressed, which is what
    separates this node from the loss-of-function node below.
  genes:
  - preferred_term: VCL
    term:
      id: hgnc:12665
      label: VCL
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  genetic_context:
    genes:
    - preferred_term: VCL
      term:
        id: hgnc:12665
        label: VCL
    allele_type: metavinculin-specific missense or in-frame deletion
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    description: >-
      Heterozygous germline alleles in the metavinculin-specific exon. No functional
      impact category is asserted: the measured effect is altered actin cross-linking,
      which the schema's FunctionalImpactEnum does not cleanly represent, and neither
      dominant-negative nor simple loss of function has been established for these
      alleles.
  evidence:
  - reference: PMID:11815424
    reference_title: "Metavinculin mutations alter actin interaction in dilated cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One missense mutation (Arg975Trp) and one 3-bp deletion (Leu954del) were identified."
    explanation: >-
      Names the two founding alleles, found by screening the metavinculin-specific exon in
      350 unrelated dilated cardiomyopathy patients.
  - reference: PMID:37548861
    reference_title: "Heart Failure with Recovered Ejection Fraction in Patients with Vinculin Loss-of-function Variants."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Vinculin is a ubiquitously expressed protein encoded by the VCL gene with a larger
      splice isoform, metavinculin, exclusively expressed in cardiac and smooth muscle.
    explanation: >-
      Establishes the isoform restriction that makes a metavinculin-exon allele a
      muscle-specific lesion. This is a background statement of established cell biology,
      not a result of the cited series.
  downstream:
  - target: Impaired Vinculin-Actin Coupling at Cardiomyocyte Adhesion Complexes
    causal_link_type: DIRECT
    hypothesis_groups:
    - metavinculin_altered_actin_crosslinking
    description: >-
      The mutant metavinculin is expressed and incorporated, but cross-links actin
      filaments abnormally.
    evidence:
    - reference: PMID:11815424
      reference_title: "Metavinculin mutations alter actin interaction in dilated cardiomyopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        significantly altered metavinculin-mediated cross-linking of actin filaments in an
        in vitro assay
      explanation: >-
        Direct measurement that the alleles change actin cross-linking, which is the edge
        from the variant to impaired coupling.
- name: VCL Predicted Loss-of-Function Allele
  biological_scale: MOLECULAR
  role: trigger
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult"
  mechanism_confidence: PROVISIONAL
  description: >-
    The second and numerically larger allelic class is heterozygous predicted loss of
    function: nonsense, frameshift, canonical splice-site and one multi-exon duplication.
    Unlike the metavinculin-exon alleles these hit both VCL transcripts, so they reduce
    vinculin as well as metavinculin, and haploinsufficiency is the leading model for
    those expected to undergo nonsense-mediated decay. Confidence is recorded as
    PROVISIONAL rather than ESTABLISHED because the class is enriched in dilated
    cardiomyopathy but is not sufficient on its own to produce it, and most individual
    alleles remain variants of uncertain significance.

discussions:
- discussion_id: no_vcl_directed_therapy_or_trial
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is there any VCL-directed therapeutic development for CMD1W, and if not, what would a
    trial-ready endpoint look like in a phenotype that frequently recovers on standard
    therapy?
  attaches_to:
  - treatments#
  rationale: >-
    A ClinicalTrials.gov search on 2026-09-03 for "vinculin" returned zero studies, and a
    search restricted to dilated cardiomyopathy with the term "VCL gene" also returned
    zero. No clinical_trials block is curated for this entry because there is nothing to
    curate, and the absence is recorded here rather than left as a silent gap. Every
    treatment in this entry acts on the expressed heart failure phenotype, not on the
    adhesion lesion. The design problem specific to CMD1W is that the most common natural
    course under standard therapy is recovery, so a genotype-targeted agent would have to
    beat an already favourable comparator in a very small population.
- discussion_id: no_subtype_specific_epidemiology_or_survival
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the prevalence, incidence and survival of CMD1W as an entity, as opposed to
    the carrier frequency of VCL variants?
  attaches_to:
  - prevalence#
  rationale: >-
    Everything currently quotable is either a reference-population variant frequency or a
    variant yield inside a testing cohort. Neither is a disease rate, and with a
    reduced-penetrance allele the gap between the two is large and unmeasured. There is no
    CMD1W survival curve; the contemporary dilated cardiomyopathy registry outcome data
    cited in this entry's notes are all-cause and cannot be assigned to this genotype. The
    six-patient infant series is the only genotype-defined outcome dataset in existence and
    its 83% recovery figure must not be read as a population estimate.
- discussion_id: mouse_arrhythmic_severity_versus_human_phenotype
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why does cardiomyocyte-specific vinculin loss kill half of knockout mice by sudden
    arrhythmic death before three months, while human VCL loss-of-function carriers present
    predominantly with recoverable heart failure and only occasional conduction disease?
  attaches_to:
  - pathophysiology#Ventricular Arrhythmia and Conduction Disease
  - pathophysiology#Connexin 43 Lateralization and Conduction Slowing
  rationale: >-
    The mouse evidence for the electrical branch is strong and direct: connexin 43 moves to
    the lateral border, optical mapping shows defective conduction, telemetry documents
    ventricular tachycardia, and 49% die suddenly with contractile function still
    preserved. The human picture does not match that severity. Among 32 VCL
    loss-of-function probands only three had bradycardia or heart block and one had
    supraventricular tachycardia, and current practice is explicitly that a VCL variant does
    not by itself justify a defibrillator the way an LMNA or FLNC variant does, a position
    curated with its citation as the Implantable Cardioverter-Defibrillator treatment. The most
    likely explanation is dosage - the mouse is a complete cardiomyocyte-restricted null and
    human carriers are heterozygous - but that has not been demonstrated, and until it is,
    the arrhythmic node in this entry rests on a model whose translational validity to human
    CMD1W is the open question. This matters clinically, because it is the difference
    between an arrhythmia-first genotype and a heart-failure-first one.
  proposed_experiments:
  - experiment_id: heterozygous_vcl_arrhythmic_phenotyping
    name: Arrhythmic phenotyping of heterozygous Vcl mice under mechanical stress
    description: >-
      Telemetry and optical mapping in heterozygous rather than homozygous cardiomyocyte
      Vcl-deficient animals, at baseline and after a defined pressure-overload or
      inflammatory stress, to test whether the arrhythmic phenotype is a dosage effect and
      whether it requires a second hit in the way the human phenotype appears to.
    experiment_type:
      preferred_term: in vivo dosage-comparison and stress-challenge experiment
    readouts:
    - name: Spontaneous ventricular arrhythmia burden on telemetry
      target: pathophysiology#Ventricular Arrhythmia and Conduction Disease
      direction: INCREASED
      interpretation: >-
        A low unstressed burden that rises only after the applied stress would support the
        second-hit reading and explain the human-mouse gap.
    - name: Connexin 43 distribution at the intercalated disc
      target: pathophysiology#Connexin 43 Lateralization and Conduction Slowing
      direction: ALTERED
      interpretation: >-
        Whether lateralization occurs at half dosage at all, and if so whether it is
        stress-dependent.
    would_support:
    - pathophysiology#Ventricular Arrhythmia and Conduction Disease
    supporting_outcome:
    - >-
      Heterozygous animals show connexin 43 lateralization and an arrhythmic burden only
      after imposed stress, matching the reduced-penetrance human pattern.
    refuting_outcome:
    - >-
      Heterozygous animals show a severe unstressed arrhythmic phenotype comparable to the
      homozygous knockout, which would leave the human-mouse discrepancy unexplained by
      dosage and point instead at a species difference in cardiac electrophysiology.
diagnosis:
- name: Transthoracic echocardiography
  description: >-
    The study that establishes the dilated cardiomyopathy phenotype and defines it
    quantitatively, before any question of VCL sequencing arises. It is also the
    instrument through which the recovery phenotype of this genotype is observed and
    followed: every infant in the genotype-defined series was characterized on
    echocardiography at diagnosis, and the normalization of ventricular function in five
    of six was measured the same way.
  diagnosis_term:
    preferred_term: transthoracic echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:33652931
    reference_title: "Diagnosis and Risk Prediction of Dilated Cardiomyopathy in the Era of Big Data and Genomics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A full diagnostic work-up for DCM typically includes a focused history, laboratory evaluation, electrocardiography (ECG), Holter monitoring, echocardiography, CMR (with late gadolinium enhancement (LGE)), and genetic testing"
    explanation: >-
      Places echocardiography inside the standard dilated cardiomyopathy work-up
      alongside the genetic testing this entry already curates.
  - reference: PMID:33652931
    reference_title: "Diagnosis and Risk Prediction of Dilated Cardiomyopathy in the Era of Big Data and Genomics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "DCM is considered in the presence of (1) left ventricular dilatation (indexed left ventricular end-diastolic diameter (LVEDd) >117% for age and sex, or the LV end-diastolic volume (LVEDV) ≥2 standard deviations from normal according to normograms), and (2) left ventricular systolic dysfunction (LV ejection fraction (LVEF) <45% and/or LV fractional shortening <25%)."
    explanation: >-
      The diagnostic thresholds themselves. Both limbs are echocardiographic
      measurements, which is why this modality and not genetic testing is what makes the
      diagnosis.
  - reference: PMID:37548861
    reference_title: "Heart Failure with Recovered Ejection Fraction in Patients with Vinculin Loss-of-function Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients showed LV dilation and dysfunction on echocardiograms and LV or biventricular hypertrophy and T wave abnormalities on electrocardiogram."
    explanation: >-
      Records that the echocardiographic finding in the genotype-defined VCL series was
      left ventricular dilation and dysfunction, which is what the modality contributes
      in this specific disease.
- name: Cardiac magnetic resonance with late gadolinium enhancement
  description: >-
    Tissue characterization added to the echocardiographic diagnosis. Late gadolinium
    enhancement identifies replacement fibrosis and carries prognostic weight in dilated
    cardiomyopathy generally. No CMD1W-specific enhancement pattern has been described,
    so the modality is curated at the level the source supports, which is the general
    dilated cardiomyopathy work-up and risk assessment rather than a VCL signature.
  diagnosis_term:
    preferred_term: cardiac magnetic resonance imaging with late gadolinium enhancement
    term:
      id: NCIT:C137915
      label: Magnetic Resonance Imaging of the Heart
  evidence:
  - reference: PMID:33652931
    reference_title: "Diagnosis and Risk Prediction of Dilated Cardiomyopathy in the Era of Big Data and Genomics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A full diagnostic work-up for DCM typically includes a focused history, laboratory evaluation, electrocardiography (ECG), Holter monitoring, echocardiography, CMR (with late gadolinium enhancement (LGE)), and genetic testing"
    explanation: >-
      Places cardiac magnetic resonance with late gadolinium enhancement in the standard
      dilated cardiomyopathy work-up.
  - reference: PMID:33652931
    reference_title: "Diagnosis and Risk Prediction of Dilated Cardiomyopathy in the Era of Big Data and Genomics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The use of clinically granular investigations, such as late gadolinium enhancement on cardiac magnetic resonance imaging, is warranted in order to increase predictive performance."
    explanation: >-
      The reason the study is done rather than deferred, which is that it adds
      information risk models built on ejection fraction alone do not carry.
- name: Electrocardiography
  description: >-
    Baseline rhythm and conduction assessment. It matters more in this entry than the
    disease-level work-up alone would suggest, because bradycardia, heart block and
    supraventricular tachycardia are documented minority findings in VCL
    loss-of-function probands, and because the infant series recorded a consistent
    abnormal electrocardiogram at presentation.
  diagnosis_term:
    preferred_term: electrocardiography
    term:
      id: NCIT:C38053
      label: Electrocardiography
  evidence:
  - reference: PMID:33652931
    reference_title: "Diagnosis and Risk Prediction of Dilated Cardiomyopathy in the Era of Big Data and Genomics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A full diagnostic work-up for DCM typically includes a focused history, laboratory evaluation, electrocardiography (ECG), Holter monitoring, echocardiography, CMR (with late gadolinium enhancement (LGE)), and genetic testing"
    explanation: >-
      Places electrocardiography in the standard dilated cardiomyopathy work-up.
  - reference: PMID:37548861
    reference_title: "Heart Failure with Recovered Ejection Fraction in Patients with Vinculin Loss-of-function Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients showed LV dilation and dysfunction on echocardiograms and LV or biventricular hypertrophy and T wave abnormalities on electrocardiogram."
    explanation: >-
      The electrocardiographic findings actually observed in the genotype-defined VCL
      series, which is what this modality contributes here beyond generic screening.
- name: Ambulatory (Holter) rhythm monitoring
  description: >-
    Extended rhythm recording, which is what detects the intermittent conduction and
    tachyarrhythmia findings that a single resting tracing misses. It is the diagnostic
    counterpart of the arrhythmic branch of this entry's pathograph, and it is the
    measurement that would be needed to say whether the severe arrhythmic phenotype of
    the murine model has any quiet human counterpart.
  diagnosis_term:
    preferred_term: ambulatory Holter electrocardiographic monitoring
    term:
      id: NCIT:C38064
      label: Holter Monitoring
  evidence:
  - reference: PMID:33652931
    reference_title: "Diagnosis and Risk Prediction of Dilated Cardiomyopathy in the Era of Big Data and Genomics."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A full diagnostic work-up for DCM typically includes a focused history, laboratory evaluation, electrocardiography (ECG), Holter monitoring, echocardiography, CMR (with late gadolinium enhancement (LGE)), and genetic testing"
    explanation: >-
      Places Holter monitoring in the standard dilated cardiomyopathy work-up as a
      distinct study from the resting electrocardiogram.
- name: Cardiomyopathy multigene panel including VCL
  description: >-
    Genetic testing for CMD1W is done through a curated cardiomyopathy next-generation
    sequencing panel that includes VCL with copy-number analysis, since one of the reported
    allele classes is a multi-exon duplication. Two interpretive cautions are specific to
    this gene. Most VCL loss-of-function alleles are reported as variants of uncertain
    significance, so a positive result usually cannot be used for predictive cascade
    testing on its own. And uptake of testing is the binding constraint in practice rather
    than panel content: dilated cardiomyopathy has the lowest genetic testing rate of the
    guideline-indicated cardiovascular diagnoses.
  evidence:
  - reference: PMID:37915745
    reference_title: "Real-world utilization of guideline-directed genetic testing in inherited cardiovascular diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At 0.8%, the DCM cohort demonstrated the lowest utilization of genetic testing."
    explanation: >-
      Quantifies the implementation gap: 827 of 101,919 newly diagnosed dilated
      cardiomyopathy patients had recorded genetic testing.
  - reference: PMID:32516855
    reference_title: "An assessment of the role of vinculin loss of function variants in inherited cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Current practice across clinical laboratories is to classify novel VCL pLOF variants
      as variants of uncertain significance
    explanation: >-
      The interpretive caution that governs how a positive VCL panel result can be used.
references:
- reference: PMID:20301486
  title: Dilated Cardiomyopathy Overview.
  tags:
  - GeneReviews
notes: >-
  CMD1W is the VCL member of the numbered dilated cardiomyopathy series. The reason it
  earns a separate entry rather than folding into the parent is mechanistic and is curated
  explicitly: its lesion is in force transmission at the intercalated disc and costamere,
  not in force generation by the sarcomere. Its sarcomeric siblings in this series
  (CMD1S/MYH7, CMD1E/TNNT2) perturb the motor; CMD1W perturbs the junction that motor
  pushes against. That difference shows up clinically as an infantile, frequently
  recoverable phenotype rather than the progressive adult course typical of the sarcomeric
  entries, and it is why the entry conforms to the shared
  cardiomyopathy_maladaptive_remodeling module only from the Primary Cardiomyocyte Insult
  node onward, with three intervening adhesion nodes of its own.

  Two allelic classes, curated apart. The metavinculin-specific exon alleles
  (p.Arg975Trp, p.Leu954del) are qualitative: the protein is present and cross-links actin
  abnormally, and the effect is restricted to the muscle isoform. The predicted
  loss-of-function alleles hit both transcripts and reduce dosage. Keeping them as separate
  trigger nodes is not bookkeeping - the founding entity was defined on the first class,
  and almost all modern evidence, including the epidemiology, the pediatric skew and the
  recovery phenotype, comes from the second. Conflating them would attribute the infant
  recovery data to the metavinculin alleles, where no such data exist.

  Gene-disease validity and penetrance are separate judgements. ClinGen classified
  VCL-dilated cardiomyopathy as Strong in August 2024, which is a statement about whether
  the gene causes the disease. The largest aggregate study concluded that a heterozygous
  loss-of-function allele is insufficient on its own, which is a statement about individual
  alleles. Both are curated: the ClinGen row supports the CAUSATIVE relationship, and the
  same Hawley sentence appears as SUPPORT on the inheritance and hypothesis blocks and as
  REFUTE against the strong reading of CAUSATIVE in the genetic block, because it genuinely
  cuts both ways depending on the claim.

  What was checked and not curated.
  ClinicalTrials.gov was searched directly on 2026-09-03 rather than relying on the
  deep-research report: "vinculin" returned zero studies and a dilated cardiomyopathy search
  with "VCL gene" returned zero. No clinical_trials block is present and the absence is
  recorded as a knowledge gap.
  No environmental block is curated. The deep-research report lists alcohol, cardiotoxic
  chemotherapy, hypertension and viral myocarditis as plausible second hits, but none has
  been measured in VCL carriers; the only citable statement is the Hawley conjecture, which
  is curated on the Additional Genetic or Environmental Stressor pathophysiology node
  instead, where its status as a conjecture is visible.
  No ORPHA record is cited. The Orphanet concept for familial isolated dilated
  cardiomyopathy (ORPHA:154) is not VCL-specific and is not in this repository's reference
  cache.
  Two references fetched during curation are deliberately not cited. PMID:38867869, the
  commentary on the 2023 ESC cardiomyopathy guidelines, was read for the device and
  risk-stratification question but its only genotype-specific statement lists the genes
  associated with an arrhythmogenic non-dilated phenotype (FLNC, DSP, DES, PLN, TMEM43,
  RBM20); VCL is absent from that list, and quoting a list to assert something about a
  gene it does not name would be an argument from silence, so the defibrillator caveat is
  cited to a source that states the genotype-specific principle positively instead.
  PMID:19952892 (Zemljic-Harpf, vinculin and talin in the myocardium) is a review whose
  mechanistic content here is carried by the primary sources already cited on the same
  nodes, principally the cardiomyocyte-specific knockout, so it would add a citation
  without adding a claim.
  GO:0060047 heart contraction is retained on the two nodes that carry it. It is an
  organ-level process where the convention prefers HP or UBERON, but the term is used the
  same way across the numbered dilated cardiomyopathy series and in the shared
  cardiomyopathy entries, and dropping it here alone would make this entry inconsistent
  with its siblings for no gain.
  Contemporary dilated cardiomyopathy registry outcomes (PMID:32452075, 1.46 combined
  death/transplant/assist-device events per 100 patient-years in the most recent enrolment
  era) were read but not curated as evidence, because they are all-cause and cannot be
  assigned to this genotype. No CMD1W survival estimate exists.

  GeneReviews scope. The applicable GeneReviews resource is the disease-level "Dilated
  Cardiomyopathy Overview" (PMID:20301486), tagged in `references`. Its indexed PubMed
  record is content_type abstract_only and carries only the chapter's purpose statement,
  with no Clinical Characteristics or Management sections, so no snippet is quoted from it
  and the phenotype baseline for this entry is built from the primary VCL cohort, case
  series and pedigree literature.

  Source provenance. The Edison/falcon deep-research report
  (research/Dilated_Cardiomyopathy_1W-deep-research-falcon.md) was used as a lead list
  only. It cites by author-year key with DOIs and carries no PMIDs, so every DOI was
  resolved to a PMID through the PMC ID converter or a PubMed title search and the PMID is
  what is cited here, keeping every evidence item on the snippet-checked path. The report's
  own term-validation section flags five HP identifiers as "named something else"; those
  are false alarms caused by the validator reading a frequency column as a label, and each
  identifier was re-verified independently against OLS before use. The report also declines
  to name a MONDO identifier for the entity and suggests using the parent term instead;
  MONDO:0012667 does exist and is used here.

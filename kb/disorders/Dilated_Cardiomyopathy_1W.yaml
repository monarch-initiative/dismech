name: Dilated Cardiomyopathy 1W
creation_date: "2026-09-04T02:26:58Z"
synonyms:
- CMD1W
- DCM1W
- VCL familial isolated dilated cardiomyopathy
- familial isolated dilated cardiomyopathy caused by mutation in VCL
- dilated cardiomyopathy type 1W
- cardiomyopathy, dilated, 1W
- vinculin-associated dilated cardiomyopathy
- metavinculin-associated dilated cardiomyopathy
description: >-
  Dilated cardiomyopathy 1W (CMD1W) is the VCL-related member of the numbered familial
  dilated cardiomyopathy series. VCL encodes vinculin and its muscle-specific splice
  isoform metavinculin, the mechanosensitive adaptor that anchors filamentous actin to
  the cadherin-based adherens junctions of the intercalated disc and to the
  integrin-based costameres of the sarcolemma. The lesion in CMD1W is therefore one of
  force *transmission*, not force *generation*: where the sarcomeric entries in this
  series (CMD1S/MYH7, CMD1E/TNNT2) perturb the motor that makes force, CMD1W perturbs
  the junctional machinery that carries that force between myocytes and out to the
  matrix. That distinction is mechanistically load-bearing and is why the entry exists
  separately from its sarcomeric siblings.

  Two allelic classes are curated separately because their mechanisms differ. The
  founding alleles p.Arg975Trp and p.Leu954del lie in the metavinculin-specific exon,
  are absent from 500 controls, and qualitatively alter metavinculin-mediated actin
  cross-linking in vitro; the single patient examined ultrastructurally had grossly
  abnormal intercalated discs. Predicted loss-of-function (pLOF) alleles are a different
  proposition: they affect both the vinculin and the metavinculin transcripts, are
  strongly enriched in dilated cardiomyopathy referrals (OR 9.01), skew heavily toward
  infantile and pediatric onset, and yet do not segregate as a highly penetrant dominant
  trait. The largest aggregate study concludes that heterozygous VCL loss of function
  alone is insufficient to cause cardiomyopathy and that these alleles behave as
  moderate-penetrance risk alleles requiring an additional genetic or environmental
  contribution. ClinGen's Dilated Cardiomyopathy Gene Curation Expert Panel nonetheless
  classifies the VCL-dilated cardiomyopathy relationship as Strong with autosomal
  dominant inheritance, so gene-disease validity and allele-level penetrance are two
  separate judgements and are curated as such here.

  The clinically distinctive feature is the infantile presentation with severe systolic
  failure that frequently reverses: in the only genotype-defined series, six infants
  presented at a median age of 2 months with a median ejection fraction of 24%, and five
  of six normalized ventricular function on an ACE inhibitor and a beta-blocker. That
  makes CMD1W a candidate genetic basis for heart failure with recovered ejection
  fraction, on a six-patient sample.

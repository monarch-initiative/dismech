  - reference: PMID:32516855
    reference_title: "An assessment of the role of vinculin loss of function variants in inherited cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All variants except for the p.Pro943Argfs*9 variant were present in both the
      NM_014000.2 and NM_003373.3 transcripts.
    explanation: >-
      Establishes that this allelic class is not metavinculin-restricted, which is the

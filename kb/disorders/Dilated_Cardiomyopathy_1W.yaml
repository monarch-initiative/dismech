  - reference: PMID:32516855
    reference_title: "An assessment of the role of vinculin loss of function variants in inherited cardiomyopathy."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Family studies demonstrated that heterozygous loss of function of VCL alone is
      insufficient to cause cardiomyopathy but that these variants do contribute to
      disease risk.
    explanation: >-
      Curated as REFUTE against the strong reading of CAUSATIVE, that a heterozygous VCL
      allele is by itself sufficient to produce the disease. The same sentence supports
      the weaker risk-conferring reading, which is why it also appears as SUPPORT on the
      inheritance block and on the reduced-penetrance hypothesis. Both readings are
      curated rather than one being suppressed.
  - reference: PMID:32516855
    reference_title: "An assessment of the role of vinculin loss of function variants in inherited cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data revealed that the majority of these individuals (89.5%) had pediatric onset
      of disease.
    explanation: >-
      The pediatric skew that distinguishes VCL loss-of-function carriers from other
      genotypes in the same testing cohorts.

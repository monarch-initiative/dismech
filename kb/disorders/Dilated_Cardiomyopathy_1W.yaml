    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variants identified included six affecting canonical splice sites, twelve nonsense
      variants, seven frameshift variants, and one multi exon duplication.
    explanation: >-
      The variant classes that make up this node, from the 26 unique alleles found across

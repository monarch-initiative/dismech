    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Heterozygous germline predicted loss-of-function alleles affecting both the
      NM_014000.2 and NM_003373.3 transcripts, so both vinculin and metavinculin are
      reduced.
  evidence:
  - reference: PMID:32516855
    reference_title: "An assessment of the role of vinculin loss of function variants in inherited cardiomyopathy."

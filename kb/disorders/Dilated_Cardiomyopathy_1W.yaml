treatments:
- name: Heart Failure Pharmacotherapy
  description: >-
    Guideline-directed therapy for heart failure with reduced ejection fraction, applied
    to the expressed phenotype. There is no VCL-directed treatment. Contemporary HFrEF
    guidance rests on four pillars: renin-angiotensin system inhibition (an ACE
    inhibitor, an ARB, or an angiotensin receptor-neprilysin inhibitor), beta-blockade, a
    mineralocorticoid receptor antagonist, and an SGLT2 inhibitor, with a loop diuretic
    added for congestion. What the genotype-defined series documents is narrower. Every
    infant in it received an ACE inhibitor and a beta-blocker, and five of six recovered
    ventricular function; the series was uncontrolled, so it establishes what was given,
    not that the drugs caused the recovery. The MRA, SGLT2 inhibitor and ARNI agents
    curated below are quoted from adult HFrEF guidance and record the standard of care
    the expressed phenotype is managed under; they are not therapy documented in that
    infant cohort. Guideline authors are explicit that improved ejection fraction does not
    license stopping therapy, and the one patient in the series who was weaned off
    medication relapsed and needed it restarted.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ACE inhibitor
      term:
        id: NCIT:C247
        label: ACE Inhibitor
    - preferred_term: beta-adrenergic antagonist
      term:
        id: NCIT:C29576
        label: Beta-Adrenergic Antagonist
    - preferred_term: angiotensin receptor-neprilysin inhibitor
      term:
        id: NCIT:C190796
        label: Angiotensin Receptor-Neprilysin Inhibitor
    - preferred_term: mineralocorticoid receptor antagonist
      term:
        id: NCIT:C101255
        label: Aldosterone Receptor Antagonist
    - preferred_term: SGLT2 inhibitor
      term:
        id: NCIT:C98083
        label: SGLT2 Inhibitor
    - preferred_term: loop diuretic
      term:
        id: NCIT:C448
        label: Diuretic
  target_mechanisms:
  - target: Heart Failure with Reduced Ejection Fraction
    treatment_effect: MODULATES
    description: >-
      Neurohormonal blockade acts on the failing-ventricle syndrome, not on the vinculin
      lesion upstream of it.
    evidence:
    - reference: PMID:37548861
      reference_title: "Heart Failure with Recovered Ejection Fraction in Patients with Vinculin Loss-of-function Variants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "All patients received an angiotensin-converting enzyme (ACE) inhibitor and a beta-blocker."
      explanation: >-
        Records the regimen every patient received. Indirect for the treatment-effect
        claim because the series had no control arm, so the association between therapy
        and recovery is not causal evidence.
  evidence:
  - reference: PMID:37653361
    reference_title: "Summary and Comparison of the 2022 ACC/AHA/HFSA and 2021 ESC Heart Failure Guidelines."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      improvement does not necessarily represent normalization of LV function or
      resolution of the cardiomyopathic process and highlights the importance of
      continuing treatment as per HFrEF recommendations to prevent deterioration in
      symptomatic status or LVEF
    explanation: >-
      The basis for continuing therapy after ejection fraction recovers, which is the
      management question this genotype raises most often.
  - reference: PMID:37653361
    reference_title: "Summary and Comparison of the 2022 ACC/AHA/HFSA and 2021 ESC Heart Failure Guidelines."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The four pillars of HF management (RAAS inhibition, beta-blockade, MRA, and SGLT2i) should be initiated in all patients with HFrEF as tolerated."
    explanation: >-
      Names the four drug classes that constitute guideline-directed therapy for the
      expressed HFrEF phenotype, and is why this node carries an MRA and an SGLT2
      inhibitor alongside the ACE inhibitor and beta-blocker the infant series recorded.
  - reference: PMID:37653361
    reference_title: "Summary and Comparison of the 2022 ACC/AHA/HFSA and 2021 ESC Heart Failure Guidelines."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Inhibition of the RAAS is recommended to reduce morbidity and mortality, with both ACC/AHA/HFSA and ESC guidelines recommending an ARNi as first-line therapy in hospitalized patients with acute HF or following a trial of an ACEi or ARB in outpatients to ensure the patient tolerates RAAS inhibition."
    explanation: >-
      Places the angiotensin receptor-neprilysin inhibitor within the
      renin-angiotensin-system arm of the regimen, which is why ARNI is curated as a
      therapeutic agent alongside the ACE inhibitor rather than instead of it.
  - reference: PMID:37653361
    reference_title: "Summary and Comparison of the 2022 ACC/AHA/HFSA and 2021 ESC Heart Failure Guidelines."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MRAs are recommended in addition to ACEi and beta-blockers to improve symptoms and reduce all-cause mortality, HF hospitalizations, and sudden cardiac death in all patients with HFrEF."
    explanation: >-
      The specific recommendation behind the mineralocorticoid receptor antagonist agent
      on this node, added to rather than replacing the ACE inhibitor and beta-blocker.
  - reference: PMID:37653361
    reference_title: "Summary and Comparison of the 2022 ACC/AHA/HFSA and 2021 ESC Heart Failure Guidelines."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SGLT2i therapy is a new addition to the pillars of HF management."
    explanation: >-
      Records that the SGLT2 inhibitor is a pillar of the regimen in its own right, which
      is the class most likely to be missing from an older description of this therapy.
  - reference: PMID:37653361
    reference_title: "Summary and Comparison of the 2022 ACC/AHA/HFSA and 2021 ESC Heart Failure Guidelines."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Loop diuretics such as frusemide or bumetanide are the preferred diuretic agent for use in most patients with HF."
    explanation: >-
      The basis for the loop diuretic agent, which is symptomatic congestion control
      rather than a mortality-modifying pillar.
- name: Implantable Cardioverter-Defibrillator
  description: >-
    Primary-prevention defibrillator implantation for the expressed heart failure
    phenotype. The indication in CMD1W is the ordinary HFrEF one, resting on ejection
    fraction, symptoms and response to optimal medical therapy, and the genotype does not
    lower the threshold. Only a small number of cardiomyopathy genes carry a
    genotype-specific device recommendation, LMNA being the worked example, and VCL is
    not among them. That is the clinically load-bearing negative in this entry: the
    murine phenotype is arrhythmia-first and lethal, the human phenotype is
    heart-failure-first and frequently recoverable, and the mouse severity is recorded as
    a human-model mismatch rather than translated into a device indication.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  target_mechanisms:
  - target: Ventricular Arrhythmia and Conduction Disease
    treatment_effect: INHIBITS
    description: >-
      The device terminates a sustained ventricular arrhythmia once it starts; it leaves
      the conduction substrate that generates the arrhythmia untouched.
  evidence:
  - reference: PMID:37653361
    reference_title: "Summary and Comparison of the 2022 ACC/AHA/HFSA and 2021 ESC Heart Failure Guidelines."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "For primary prevention, regardless of etiology, the ACC/AHA/HFSA guidelines strongly recommend an ICD to reduce the risk of SCD and all-cause mortality in patients with symptomatic HFrEF of ischemic or non-ischemic etiology, with an LVEF ≤ 35% despite ≥ 3 months of optimal medical management if their life expectancy is > 1 year"
    explanation: >-
      The primary-prevention indication that applies to a CMD1W patient, stated in terms
      of ejection fraction, symptoms and duration of optimal medical therapy rather than
      of genotype.
  - reference: PMID:39519012
    reference_title: "Dilated Cardiomyopathy: A Genetic Journey from Past to Future."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "Hence, LMNA cardiomyopathy constitutes one of the few genotype-specific evidenced-based guideline recommendations in the cardiomyopathies."
    explanation: >-
      Supports the claim that a VCL variant does not by itself justify a defibrillator.
      Indirect: the quote establishes that genotype-specific device recommendations exist
      for only a few cardiomyopathy genes and names LMNA as the exemplar, and the VCL
      claim follows from VCL not being one of them rather than from a statement about
      VCL.
- name: Cardiac Resynchronization Therapy
  description: >-
    Biventricular pacing for the subset with persistent symptomatic systolic dysfunction
    and electrical dyssynchrony after optimal medical therapy. As with the defibrillator,
    the indication is the conventional electrical and functional one and is not modified
    by VCL genotype. It is included because conduction disease is a documented minority
    finding in VCL loss-of-function probands, so the dyssynchrony pathway is reachable in
    this entry even though it is not the usual course.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cardiac resynchronization therapy
    term:
      id: NCIT:C80436
      label: Cardiac Resynchronization Therapy
  target_mechanisms:
  - target: Heart Failure with Reduced Ejection Fraction
    treatment_effect: MODULATES
    description: >-
      Recoordinating right and left ventricular activation improves pump efficiency
      without acting on the adhesion lesion or on force transmission at the intercalated
      disc.
  evidence:
  - reference: PMID:37653361
    reference_title: "Summary and Comparison of the 2022 ACC/AHA/HFSA and 2021 ESC Heart Failure Guidelines."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Cardiac resynchronization therapy (CRT) is strongly recommended for symptomatic patients (NYHA class II-IV on best medical management) who have LVEF ≤ 35%, sinus rhythm, left bundle branch block (LBBB) with a QRS of ≥ 150 ms to reduce total mortality and hospitalizations, and improve symptoms and quality of life"
    explanation: >-
      The indication criteria, which are ejection fraction, rhythm and QRS morphology.
      None of them reference genotype.
- name: Ventricular Assist Device Support
  description: >-
    Mechanical circulatory support for decompensated end-stage failure, used here as the
    bridge to transplantation. It is curated because the genotype-defined series contains
    exactly one such course: the single infant who did not recover ventricular function
    went to a left ventricular assist device at 7 months and transplantation at 10
    months, which is the counterexample to the recoverable phenotype the other five
    patients define.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: ventricular assist device placement
    term:
      id: NCIT:C80452
      label: Ventricular Assist Device Placement
  target_mechanisms:
  - target: Heart Failure with Reduced Ejection Fraction
    treatment_effect: BYPASSES
    description: >-
      The pump substitutes for ventricular ejection rather than restoring it, so the
      failing myocardium is worked around rather than repaired.
  evidence:
  - reference: PMID:37548861
    reference_title: "Heart Failure with Recovered Ejection Fraction in Patients with Vinculin Loss-of-function Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patient V who was diagnosed with severe DCM at age 4 months progressed to decompensated HF requiring a LV assist device at age 7 months and a heart transplant at age 10 months."
    explanation: >-
      Documents assist-device support and its timing within the genotype-defined series,
      which is the clinical course this treatment describes.
- name: Heart Transplantation
  description: >-
    Reserved for refractory end-stage failure. One of the six infants in the
    genotype-defined series progressed to a ventricular assist device at 7 months and
    transplantation at 10 months, so the recoverable phenotype is not universal.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Organ Transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Heart Failure with Reduced Ejection Fraction
    treatment_effect: BYPASSES
    description: >-
      Replacing the organ removes the diseased myocardium rather than correcting the
      adhesion lesion.
  evidence:
  - reference: PMID:37548861
    reference_title: "Heart Failure with Recovered Ejection Fraction in Patients with Vinculin Loss-of-function Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One patient progressed to end-stage HF requiring heart transplant."
    explanation: >-
      Documents transplantation as an outcome within the genotype-defined series.
- name: Genetic Counseling and Family Screening
  description: >-
    Cascade genetic testing and clinical screening of first-degree relatives, with the
    reduced penetrance of VCL loss-of-function alleles stated explicitly. A VCL variant of
    uncertain significance should not drive predictive testing or irreversible management,
    and most VCL loss-of-function alleles assessed by clinical laboratories are of
    uncertain significance. Clinical screening rather than genotype alone carries the
    weight here, because up to a fifth of apparently asymptomatic relatives across dilated
    cardiomyopathy cohorts already have overt disease at first assessment.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:39519012
    reference_title: "Dilated Cardiomyopathy: A Genetic Journey from Past to Future."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is also consensus across guidelines to offer cascade genetic screening and
      genetic counseling to first-degree relatives of patients with genetic DCM
    explanation: >-
      The guideline basis for offering cascade screening in a genetic dilated
      cardiomyopathy.
  - reference: PMID:39519012
    reference_title: "Dilated Cardiomyopathy: A Genetic Journey from Past to Future."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the time of initial evaluation in seemingly asymptomatic relatives, up to 20%
      will be found to have overt DCM, with an age-dependent increase in prevalence
    explanation: >-
      Quantifies the yield of clinical screening of relatives, which is why screening is
      not deferred pending variant reclassification.
  - reference: PMID:32516855
    reference_title: "An assessment of the role of vinculin loss of function variants in inherited cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Current practice across clinical laboratories is to classify novel VCL pLOF variants
      as variants of uncertain significance
    explanation: >-
      The reason a VCL result usually cannot carry predictive weight on its own in a
      counseling setting.
animal_models:
- name: Cardiomyocyte-specific vinculin knockout mouse
  species: Mouse
  genotype: Vcl conditional knockout, Cre-loxP cardiomyocyte-specific excision
  publication: PMID:17785437
  description: >-
    The reference in vivo model for CMD1W mechanism. Cre-loxP excision of Vcl in
    cardiomyocytes produced adherens junction abnormalities, intercalated disc dissolution,
    reduced cadherin and beta1D integrin, and lateral connexin 43 mislocalization, all
    before any contractile deficit. Half the animals then died suddenly of ventricular
    tachycardia in the first three months with preserved contractile function, and the
    survivors developed dilated cardiomyopathy.
  genes:
  - preferred_term: VCL
    term:
      id: hgnc:12665
      label: VCL
  modeled_mechanisms:
  - target: Intercalated Disc and Costamere Destabilization
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Directly demonstrates that removing vinculin from cardiomyocytes destabilizes both
      the cell-cell and the cell-matrix adhesion structures, and does so before contractile
      function falls.
    limitations: >-
      A complete cardiomyocyte-restricted null, not the heterozygous state that human
      carriers have, so the magnitude and the timing are both expected to overstate the
      human lesion. It also models the loss-of-function allelic class only; the
      metavinculin-tail alleles are not a dosage lesion and are not represented.
    readouts:
    - name: Intercalated disc ultrastructure
      target: Intercalated Disc and Costamere Destabilization
      direction: ALTERED
      interpretation: >-
        Dissolution of the disc structure on electron microscopy is the structural
        correlate of this node.
      evidence:
      - reference: PMID:17785437
        reference_title: "Cardiac-myocyte-specific excision of the vinculin gene disrupts cellular junctions, causing sudden death or dilated cardiomyopathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Prior to the onset of cardiac dysfunction, ultrastructural analysis of cVclKO
          heart tissue showed abnormal adherens junctions with dissolution of the
          intercalated disc structure, expression of the junctional proteins cadherin and
          beta1D integrin were reduced, and the gap junction protein connexin 43 was
          mislocalized to the lateral myocyte border.
        explanation: Reports the ultrastructural measurement behind this readout.
    evidence:
    - reference: PMID:17785437
      reference_title: "Cardiac-myocyte-specific excision of the vinculin gene disrupts cellular junctions, causing sudden death or dilated cardiomyopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        shows that it is required for preservation of normal cell-cell and cell-matrix
        adhesive structures
      explanation: >-
        Supports treating this model as informative for the junctional node.
  - target: Connexin 43 Lateralization and Conduction Slowing
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Provides the electrophysiological demonstration that the junctional lesion slows
      conduction and generates ventricular tachycardia.
    limitations: >-
      Murine cardiac electrophysiology differs substantially from human, and the model is a
      complete null. Human VCL carriers show conduction disease at low frequency and no
      genotype-specific defibrillator indication is established, so the arrhythmic severity
      here does not transfer.
    readouts:
    - name: Myocardial conduction by optical mapping
      target: Connexin 43 Lateralization and Conduction Slowing
      direction: DECREASED
      interpretation: >-
        Defective conduction on optical mapping is the functional correlate of the
        displaced gap junctions.
      evidence:
      - reference: PMID:17785437
        reference_title: "Cardiac-myocyte-specific excision of the vinculin gene disrupts cellular junctions, causing sudden death or dilated cardiomyopathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Conscious telemetry documented ventricular tachycardia as the cause of sudden
          death, while defective myocardial conduction was detected by optical mapping.
        explanation: Reports the conduction measurement behind this readout.
  - target: Ventricular Dilation and Systolic Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Knockout animals surviving the arrhythmic period went on to develop dilated
      cardiomyopathy, closing the chain from adhesion failure to chamber dilation.
    limitations: >-
      The dilated phenotype appears only in the survivors of a lethal arrhythmic phase that
      has no human counterpart at this frequency, and the time course is compressed into
      six months.
    readouts:
    - name: Development of dilated cardiomyopathy in survivors
      target: Ventricular Dilation and Systolic Dysfunction
      direction: INCREASED
      interpretation: >-
        Onset of dilated cardiomyopathy in the surviving knockouts is the phenotypic
        correlate of this node.
      evidence:
      - reference: PMID:17785437
        reference_title: "Cardiac-myocyte-specific excision of the vinculin gene disrupts cellular junctions, causing sudden death or dilated cardiomyopathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          cVclKO mice that survived through the vulnerable period of sudden death developed
          dilated cardiomyopathy and died before 6 months of age.
        explanation: Reports the phenotypic outcome behind this readout.
- name: Vinculin Y822F knock-in mouse
  species: Mouse
  genotype: Vcl Y822F homozygous knock-in
  publication: PMID:41231303
  description: >-
    A mechanism-probing allele rather than a disease model. Substituting phenylalanine for
    tyrosine at vinculin residue 822 removes a phosphorylation site whose occupancy peaks
    while cardiac adhesions are remodeling and rises again after adult cardiac injury.
    Homozygous mice are viable and develop cardiac dysfunction by 28 weeks, and cultured
    mutant cardiomyocytes show disorganized cell-cell adhesion. Y822F is not a reported
    human CMD1W allele.
  genes:
  - preferred_term: VCL
    term:
      id: hgnc:12665
      label: VCL
  modeled_mechanisms:
  - target: Impaired Vinculin-Actin Coupling at Cardiomyocyte Adhesion Complexes
    relationship: PERTURBS
    fidelity: LOW
    description: >-
      Perturbs vinculin-dependent adhesion coupling through loss of a regulatory
      phosphosite, showing that the coupling is dynamically regulated rather than static.
    limitations: >-
      Y822F is an engineered allele that has not been reported in a human patient, and the
      mice are homozygous where human carriers are heterozygous. It bears on how vinculin
      coupling is regulated, not on how a CMD1W variant behaves.
    readouts:
    - name: Cardiomyocyte cell-cell adhesion organization
      target: Impaired Vinculin-Actin Coupling at Cardiomyocyte Adhesion Complexes
      direction: ALTERED
      interpretation: >-
        Disorganized cell-cell adhesion in mutant cardiomyocytes is the cellular correlate
        of impaired vinculin coupling.
      evidence:
      - reference: PMID:41231303
        reference_title: "Vinculin Y822 phosphorylation regulates adhesion remodeling during cardiomyocyte maturation."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Defects in cell-cell adhesion organization were also observed in cultured Vcl
          Y822F cardiomyocytes.
        explanation: >-
          Reports the cultured-cardiomyocyte measurement behind this readout.
    evidence:
    - reference: PMID:41231303
      reference_title: "Vinculin Y822 phosphorylation regulates adhesion remodeling during cardiomyocyte maturation."

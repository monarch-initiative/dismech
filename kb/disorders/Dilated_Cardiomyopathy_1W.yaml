      different, unlinked loci, determine the DCM phenotype
    explanation: >-
      Places the CMD1W second-hit observation inside the wider oligogenic architecture of
      dilated cardiomyopathy. Indirect because it is a statement about dilated
      cardiomyopathy generally, not about VCL carriers.
  downstream:
  - target: Ventricular Dilation and Systolic Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - vcl_plof_reduced_penetrance_risk_allele
    description: >-
      Only when the additional contribution is present does the reduced-vinculin

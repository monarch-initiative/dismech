  role: central_effector
  description: >-
    The defining lesion of CMD1W and the reason it is not simply another sarcomeric
    cardiomyopathy. The sarcomere still generates force; that force is no longer
    transmitted efficiently between myocytes or out to the extracellular matrix. Because
    the deficit is in transmission rather than generation, the myocardium is functionally
    uncoupled even where individual myocytes contract normally.

    Both allelic classes converge here. Vinculin is the mechanosensitive adaptor that
    links filamentous actin to the cadherin-catenin complexes of the adherens junction
    and to the integrin-talin complexes of the costamere; metavinculin does the same job
    in cardiac and smooth muscle. Whether the protein is present but cross-links actin
    abnormally, or is simply reduced in amount, the consequence at this node is the same:
    the actin cytoskeleton is less securely coupled to the adhesion machinery.

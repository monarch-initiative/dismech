    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      is extremely rare, with only a few cases reported worldwide; thus, reports
      on HBSL treatment are few.
    explanation: >-
      The review states that only a few cases have been reported worldwide,
      which is the basis for the ultra-rare, literature-count classification.
progression:
- phase: Infantile onset
  notes: >-
    The typical presentation, with motor delay or regression of acquired motor
    milestones and progressive leg spasticity. Onset across published cases
    spans 4 months to 18 years, and the clinical picture differs by age at
    onset.
  evidence:
  - reference: PMID:29518832
    reference_title: "[DARS mutations responsible for hypomyelination with brain stem and spinal cord involvement and leg spasticity: report of two cases and review of literature]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The age of disease onset was from 4 months to 18 years, and their initial
      symptoms were development delay or regression.
    explanation: >-
      The literature summary in this case report gives the onset range and the
      presenting symptoms across the 13 previously published patients.
  - reference: PMID:25527264
    reference_title: "DARS-associated leukoencephalopathy can mimic a steroid-responsive neuroinflammatory disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One patient had the typical infantile presentation, but 2 patients with
      onset in late adolescence had a disease mimicking an acquired inflammatory
      CNS disorder.
    explanation: >-
      Identifies infantile presentation as the typical course.
- phase: Adolescent onset, subacute
  notes: >-
    A later-onset presentation with subacute spastic paraplegia, minor focal
    cerebral white matter lesions, typical spinal long-tract involvement, and
    partial improvement with steroids, resembling an acquired inflammatory
    disorder.
  evidence:
  - reference: PMID:25527264
    reference_title: "DARS-associated leukoencephalopathy can mimic a steroid-responsive neuroinflammatory disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

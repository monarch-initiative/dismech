notes: >-
  No disease-specific GeneReviews chapter exists for HBSL or DARS1: PubMed
  searches for "DARS1", "HBSL" and the disease name, each combined with
  genereviews[book], returned zero records.

  HBSL (DARS1, cytoplasmic aspartyl-tRNA synthetase) and LBSL (DARS2,
  mitochondrial aspartyl-tRNA synthetase) share an MRI pattern and the old
  gene-symbol stem, and most PubMed hits for "DARS" with leukoencephalopathy are
  LBSL papers. Every reference cited in this entry is about DARS1 and HBSL.

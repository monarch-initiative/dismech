diagnosis:
- name: MRI pattern recognition with DARS1 genetic testing
  description: >-
    Diagnosis rests on recognising the brain and spinal cord MRI pattern and
    finding biallelic DARS1 variants by targeted panel, exome or genome
    sequencing. Spinal MRI matters because the spinal long-tract pattern is what
    separates adolescent-onset HBSL from acquired inflammatory disease, and a
    leukodystrophy panel should cover DARS2 as well as DARS1.
  evidence:
  - reference: PMID:25527264
    reference_title: "DARS-associated leukoencephalopathy can mimic a steroid-responsive neuroinflammatory disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three patients with mutations in DARS were identified by combining MRI
      pattern recognition and genetic analysis.
    explanation: >-
      MRI pattern recognition followed by genetic analysis is how these
      patients were diagnosed.
  - reference: PMID:23643384
    reference_title: "Mutations in DARS cause hypomyelination with brain stem and spinal cord involvement and leg spasticity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report on the application of high-throughput genome and exome
      sequencing to a cohort of ten individuals with a leukoencephalopathy of
      unknown etiology
    explanation: >-
      Genome and exome sequencing identified the molecular cause in the
      discovery cohort.
differential_diagnoses:
- name: Leukoencephalopathy with brainstem and spinal cord involvement and lactate elevation (LBSL)
  disease_term:
    preferred_term: LBSL
    term:
      id: MONDO:0012622
      label: leukoencephalopathy with brain stem and spinal cord involvement-high lactate syndrome
  description: >-
    The closest mimic, caused by variants in DARS2, the mitochondrial
    aspartyl-tRNA synthetase. The MRI patterns are strikingly similar. LBSL is
    distinguished genetically, and peripheral neuropathy and visual and hearing
    changes have been described more widely in LBSL. Literature searches on
    "DARS" with leukoencephalopathy return mostly LBSL papers, a recurring
    source of confusion.
  evidence:
  - reference: PMID:23643384
    reference_title: "Mutations in DARS cause hypomyelination with brain stem and spinal cord involvement and leg spasticity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intriguingly, HBSL bears a striking resemblance to leukoencephalopathy
      with brain stem and spinal cord involvement and elevated lactate (LBSL),
      which is caused by mutations in the mitochondria-specific DARS2,
      suggesting that these two diseases might share a common underlying
      molecular pathology.
    explanation: >-
      Establishes the resemblance and the different causal gene.
  - reference: PMID:33574740
    reference_title: "The Leukodystrophies HBSL and LBSL-Correlates and Distinctions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      However, perhaps due to earlier detection, a wider range of symptoms,
      including peripheral neuropathy, as well as visual and hearing changes
      have been described in LBSL patients.
    explanation: >-
      Clinical features reported more widely in LBSL than in HBSL; the authors
      note that the difference may reflect ascertainment.
- name: Multiple sclerosis
  disease_term:
    preferred_term: multiple sclerosis
    term:
      id: MONDO:0005301
      label: multiple sclerosis
  description: >-
    Adolescent-onset HBSL with focal cerebral lesions, spinal cord signal change
    and a steroid response can be mistaken for multiple sclerosis; the
    symmetric, tract-selective spinal pattern points to HBSL.
  evidence:
  - reference: PMID:25527264
    reference_title: "DARS-associated leukoencephalopathy can mimic a steroid-responsive neuroinflammatory disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Focal T2 hyperintense white matter changes on brain MRI in combination
      with spinal cord signal abnormalities usually suggest acquired
      inflammatory conditions such as multiple sclerosis, especially in the
      context of relapsing course and a positive response to steroid treatment.
    explanation: >-
      Names multiple sclerosis as the acquired condition that adolescent-onset
      HBSL mimics.

      had positive response to steroids.
    explanation: >-
      Describes the subacute course in the adolescent-onset patients.
  - reference: PMID:29518832
    reference_title: "[DARS mutations responsible for hypomyelination with brain stem and spinal cord involvement and leg spasticity: report of two cases and review of literature]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Clinical phenotypes of different age groups were significantly different.
    explanation: >-
      The literature review found that presentation differs by age at onset,
      which is why the infantile and adolescent phases are recorded separately.
pathophysiology:
- name: DARS1 Biallelic Variants
  biological_scale: MOLECULAR
  description: >-
    Biallelic germline DARS1 variants, mostly missense, alter highly conserved
    residues in or next to the active-site pocket of the C-terminal catalytic
    lobe of cytoplasmic aspartyl-tRNA synthetase (AspRS). Because complete loss
    of Dars1 is embryonic lethal in mice, disease alleles are inferred to retain
    residual function. Allele effects are not uniform: in an overexpression
    assay in HEK293 lysates (full text of PMID:33551752) A274V abolished
    aminoacylation while D367Y slightly increased it, so a simple loss of
    catalytic activity is not demonstrated for every allele.
  genes:
  - preferred_term: DARS1
    term:
      id: hgnc:2678
      label: DARS1
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Homozygous or compound heterozygous germline variants; partial loss of
      function is inferred from the lethality of the null allele in mice, not
      measured for each allele.
  evidence:
  - reference: PMID:23643384
    reference_title: "Mutations in DARS cause hypomyelination with brain stem and spinal cord involvement and leg spasticity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These mutations cause nonsynonymous changes to seven highly conserved
      amino acids, five of which are unchanged between yeast and man, in the
      DARS C-terminal lobe adjacent to, or within, the active-site pocket.
    explanation: >-
      Places the disease variants at conserved residues in or beside the
      catalytic active site of the enzyme.
  - reference: PMID:27816769
    reference_title: "In vivocharacterization of the aspartyl-tRNA synthetase DARS: Homing in on the leukodystrophy HBSL."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The complete loss of DARS function is not tolerated in mice suggesting
      that the identified HBSL mutations in humans retain some residual enzyme
      activity.
    explanation: >-
      The partial-loss-of-function interpretation is inferred from the
      lethality of the mouse null allele rather than measured in patient cells.
  downstream:
  - target: Reduced Cytosolic Aspartyl-tRNA Charging
    causal_link_type: DIRECT
    description: >-
      Active-site variants are expected to reduce charging of tRNA(Asp) with
      aspartate. This has been measured only for selected alleles in an
      overexpression assay, and one disease allele (D367Y) did not reduce
      activity there, so the edge is an allele-dependent expectation.
- name: Reduced Cytosolic Aspartyl-tRNA Charging
  biological_scale: MOLECULAR
  description: >-
    DARS1 AspRS is the cytoplasmic enzyme that pairs aspartate with tRNA(Asp).
    Reduced activity is expected to limit charged tRNA(Asp) available to
    cytoplasmic ribosomes. The mitochondrial counterpart is encoded by DARS2,
    which is not affected in HBSL, and the two enzymes do not substitute for
    each other.
  molecular_functions:
  - preferred_term: aspartate-tRNA ligase activity
    modifier: DECREASED
    term:
      id: GO:0004815
      label: aspartate-tRNA ligase activity
  biological_processes:
  - preferred_term: aspartyl-tRNA aminoacylation
    modifier: DECREASED
    term:
      id: GO:0006422
      label: aspartyl-tRNA aminoacylation
  locations:
  - preferred_term: cytosol
    term:
      id: GO:0005829
      label: cytosol
  evidence:
  - reference: PMID:29615866
    reference_title: "Expression Pattern of the Aspartyl-tRNA Synthetase DARS in the Human Brain."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      One of these enzymes is the aspartyl-tRNA synthetase DARS, which pairs
      aspartate with its corresponding tRNA.
    explanation: >-
      States the catalytic function that the disease variants are expected to
      impair.
  - reference: PMID:33574740
    reference_title: "The Leukodystrophies HBSL and LBSL-Correlates and Distinctions."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      While the fatal phenotype of Dars1 or Dars2 single gene deletion mouse
      mutants revealed that the two enzymes lack functional redundancy
    explanation: >-
      The cytoplasmic and mitochondrial enzymes cannot substitute for each
      other, so a DARS1 defect is not compensated by DARS2.
  downstream:
  - target: Impaired Protein Synthesis in CNS Neurons and Glia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Charged tRNA(Asp) is a prerequisite for translation, so reduced charging
      is expected to impair protein synthesis. Reduced translation has not been
      measured directly in HBSL patient cells or in the hypomorphic mice.
    evidence:
    - reference: PMID:29615866
      reference_title: "Expression Pattern of the Aspartyl-tRNA Synthetase DARS in the Human Brain."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: >-
        A prerequisite for translation is the accurate charging of tRNAs with
        their cognate amino acids, a reaction catalyzed by specific
        aminoacyl-tRNA synthetases.
      explanation: >-
        General biochemistry linking tRNA charging to translation; it is not a
        measurement in HBSL.
- name: Impaired Protein Synthesis in CNS Neurons and Glia
  biological_scale: CELLULAR
  description: >-
    The proposed cellular consequence. DARS1 is expressed in all cells but is
    enriched in neurons, where it is found in the soma with the translation
    machinery and also along neurites and at synapses, and it is low in
    oligodendrocytes, astrocytes and microglia. Which cell type is primarily
    injured, and whether local translation in axons or synapses is involved, is
    not established. The node is a hypothesis carried by the expression data and
    the enzyme's function, not a measured translation defect.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: oligodendrocyte
    term:
      id: CL:0000128
      label: oligodendrocyte
  biological_processes:
  - preferred_term: translation
    modifier: DECREASED
    term:
      id: GO:0006412
      label: translation
  evidence:
  - reference: PMID:29615866
    reference_title: "Expression Pattern of the Aspartyl-tRNA Synthetase DARS in the Human Brain."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Although obligatorily expressed in all cells, DARS shows a distinct
      expression pattern with enrichment in neurons but only low abundance in
      oligodendrocytes, astrocytes, and microglia.
    explanation: >-
      Human post-mortem brain and stem-cell-derived neural cells show where the
      enzyme is most abundant, which bears on which cells a partial defect
      affects first.
  - reference: PMID:27816769
    reference_title: "In vivocharacterization of the aspartyl-tRNA synthetase DARS: Homing in on the leukodystrophy HBSL."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Within neurons, DARS is mainly located in the cell soma where it
      co-localizes with other components of the translation machinery.
    explanation: >-
      Places the enzyme with the translation machinery in mouse neurons.
  - reference: PMID:27816769
    reference_title: "In vivocharacterization of the aspartyl-tRNA synthetase DARS: Homing in on the leukodystrophy HBSL."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Intriguingly, DARS is also present along neurites and at synapses, where
      it potentially contributes to local protein synthesis.
    explanation: >-
      Raises local neuronal translation as a possible vulnerable process; the
      authors state it as a possibility, not a finding.
  downstream:
  - target: Deficient Myelin in Brainstem, Cerebral and Spinal Long Tracts
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      How a translation defect yields tract-selective hypomyelination is
      unknown. In hypomorphic mice the outcome (reduced myelin proteins, spinal
      white matter vacuolization and demyelination) is reproduced, but the
      intermediate steps, and whether the oligodendrocyte is hit directly or
      secondarily to the axon, are not.
    evidence:
    - reference: PMID:33551752
      reference_title: "A Hypomorphic Dars1 (D367Y) Model Recapitulates Key Aspects of the Leukodystrophy HBSL."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Expression levels of the major myelin proteins were reduced in Dars1
        D367Y/- mice compared to controls.
      explanation: >-
        A hypomorphic Dars1 genotype reduces myelin protein expression in vivo,
        linking reduced DARS1 function to a myelin deficit without identifying
        the intermediate cellular steps.

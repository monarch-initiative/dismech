    evidence:
    - reference: PMID:29518832
      reference_title: "[DARS mutations responsible for hypomyelination with brain stem and spinal cord involvement and leg spasticity: report of two cases and review of literature]."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Novel mutations in DARS gene-namely, c.1498_1499insTCA (p.500_501insIle)
        and c.1210A>G (p.Met404Val)
      explanation: >-
        Reports variants found in affected patients.
  evidence:
  - reference: PMID:23643384
    reference_title: "Mutations in DARS cause hypomyelination with brain stem and spinal cord involvement and leg spasticity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report on the application of high-throughput genome and exome

    explanation: >-
      The discovery study, which identified DARS variants in a cohort of ten
      patients with the HBSL phenotype.
  - reference: PMID:33574740
    reference_title: "The Leukodystrophies HBSL and LBSL-Correlates and Distinctions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Ten years later, hypomyelination with brainstem and spinal cord

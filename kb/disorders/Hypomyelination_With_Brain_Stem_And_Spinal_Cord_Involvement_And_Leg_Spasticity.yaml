animal_models:
- name: Dars1 D367Y/- hypomorphic mouse
  species: Mouse
  genotype: Dars1 D367Y knock-in in trans to a Dars1 null allele
  publication: PMID:33551752
  description: >-
    Homozygous D367Y knock-in mice were phenotypically normal, so the allele was
    placed in trans to a null allele. D367Y/- mice show embryonic developmental
    delay, reduced birth rate, early hydrocephalus and microphthalmia, then
    late-onset motor deficits with spinal cord white matter vacuolization and
    demyelination and reduced myelin protein expression.
  modeled_mechanisms:
  - target: Deficient Myelin in Brainstem, Cerebral and Spinal Long Tracts
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reproduces late-onset spinal white matter demyelination and reduced
      myelin proteins.
    limitations: >-
      Missense over null is not the human genotype class, hydrocephalus and
      microphthalmia are not features of the human disease, and the full human
      brain MRI pattern was not reproduced; homozygous D367Y alone gives no
      phenotype.
    readouts:
    - name: Major myelin protein expression
      target: Deficient Myelin in Brainstem, Cerebral and Spinal Long Tracts
      direction: DECREASED
      interpretation: Molecular correlate of the myelin deficit.
      evidence:
      - reference: PMID:33551752
        reference_title: "A Hypomorphic Dars1 (D367Y) Model Recapitulates Key Aspects of the Leukodystrophy HBSL."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Expression levels of the major myelin proteins were reduced in Dars1
          D367Y/- mice compared to controls.
        explanation: Reports the measurement and its direction.
    - name: Spinal cord white matter vacuolization and demyelination
      target: Deficient Myelin in Brainstem, Cerebral and Spinal Long Tracts
      direction: INCREASED
      interpretation: Histological correlate of the spinal tract lesion.
      evidence:
      - reference: PMID:33551752
        reference_title: "A Hypomorphic Dars1 (D367Y) Model Recapitulates Key Aspects of the Leukodystrophy HBSL."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          until they developed late onset motor deficits as well as
          vacuolization and demyelination of the spinal cord white matter.
        explanation: Reports the late-onset spinal white matter pathology.
    evidence:
    - reference: PMID:33551752
      reference_title: "A Hypomorphic Dars1 (D367Y) Model Recapitulates Key Aspects of the Leukodystrophy HBSL."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Surprisingly, mice carrying this mutation homozygously were
        phenotypically normal.
      explanation: >-
        Explains why the model needs a null allele in trans, which is the main
        limit on its fidelity.
- name: Dars1 M256L/- hypomorphic mouse
  species: Mouse
  genotype: Dars1 M256L knock-in in trans to a Dars1 null allele
  publication: PMID:35357600
  description: >-
    Homozygous M256L mice were only mildly affected despite severe human
    disease. M256L/- mice show embryonic lethality, developmental delay, small
    size, hydrocephalus, anophthalmia and white matter vacuolization, with
    metabolic and peripheral-organ changes more prominent than the neurological
    ones.
  modeled_mechanisms:
  - target: Deficient Myelin in Brainstem, Cerebral and Spinal Long Tracts
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: White matter vacuolization in the M256L/- genotype.
    limitations: >-
      Missense over null is not the human genotype class; homozygous M256L,
      which causes severe human disease, gives only a mild mouse phenotype; and
      energy metabolism and peripheral organs are affected more than the
      nervous system, the reverse of the human disease.
    readouts:
    - name: White matter vacuolization
      target: Deficient Myelin in Brainstem, Cerebral and Spinal Long Tracts
      direction: INCREASED
      interpretation: Histological white matter pathology.
      evidence:
      - reference: PMID:35357600
        reference_title: "Developmental delay and late onset HBSL pathology in hypomorphic Dars1(M256L) mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          The Dars1 M256L/- offspring displayed increased embryonic lethality,
          severe developmental delay, reduced body weight and size,
          hydrocephalus, anophthalmia, and vacuolization of the white matter.
        explanation: Reports white matter vacuolization in this genotype.
    evidence:
    - reference: PMID:35357600
      reference_title: "Developmental delay and late onset HBSL pathology in hypomorphic Dars1(M256L) mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Remarkably, the Dars1 M256L/- genotype affected energy metabolism and
        peripheral organs more profoundly than the nervous system
      explanation: >-
        The tissue distribution of the mouse phenotype diverges from the human
        disease, which limits fidelity.
- name: Dars1 heterozygous null mouse
  species: Mouse
  genotype: Dars1 +/- (one null allele)
  publication: PMID:27816769
  description: >-
    Dars1-null embryos die before embryonic day 11. Heterozygotes have
    substantially reduced brain DARS1 levels but no gross abnormality and normal
    motor performance, with reduced pre-pulse inhibition of the acoustic startle
    response.
  modeled_mechanisms:
  - target: Reduced Cytosolic Aspartyl-tRNA Charging
    relationship: PERTURBS
    fidelity: LOW
    model_scale: MOLECULAR
    description: >-
      Halving gene dosage reduces DARS1 protein in brain without producing a
      motor or white matter phenotype.
    limitations: >-
      The model lowers enzyme amount rather than introducing a patient missense
      allele, charging activity was not measured, and it does not reproduce the
      motor or white matter disease; it is a dosage model, not an HBSL model.
    readouts:
    - name: Brain DARS1 protein level
      target: Reduced Cytosolic Aspartyl-tRNA Charging
      direction: DECREASED
      interpretation: >-
        Shows that one null allele lowers enzyme abundance.
      evidence:
      - reference: PMID:27816769
        reference_title: "In vivocharacterization of the aspartyl-tRNA synthetase DARS: Homing in on the leukodystrophy HBSL."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          display substantially reduced DARS levels in the brain; yet these
          mutants show no gross abnormalities, including unchanged motor
          performance.
        explanation: Reports reduced DARS1 levels without a motor phenotype.
    evidence:
    - reference: PMID:27816769
      reference_title: "In vivocharacterization of the aspartyl-tRNA synthetase DARS: Homing in on the leukodystrophy HBSL."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Dars-null mice are not viable and die before embryonic day 11.
      explanation: >-
        Complete loss is lethal, so only reduced-dosage or hypomorphic genotypes
        can be studied.
discussions:
- discussion_id: hbsl_primary_cell_type
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is the primary lesion in HBSL neuronal or oligodendroglial? DARS1 is
    enriched in neurons and low in oligodendrocytes, yet the disease is defined
    by hypomyelination.
  attaches_to:
  - pathophysiology#Impaired Protein Synthesis in CNS Neurons and Glia
  - pathophysiology#Deficient Myelin in Brainstem, Cerebral and Spinal Long Tracts
  rationale: >-
    The expression pattern points at neurons, but the hypomorphic mice show
    myelin protein loss and white matter demyelination, and no cited study has
    deleted or restored Dars1 selectively in neurons or oligodendrocytes. The
    answer determines which cells a gene-replacement vector would need to
    reach; the authors of the expression study anticipate a neuronal approach.
  status: OPEN
  evidence:
  - reference: PMID:29615866
    reference_title: "Expression Pattern of the Aspartyl-tRNA Synthetase DARS in the Human Brain."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In particular, we anticipate high benefit from a gene replacement approach
      in neurons of HBSL mouse models, given the abundant endogenous DARS
      expression in this lineage cell.
    explanation: >-
      The neuronal targeting proposal rests on expression data, not on a
      demonstrated neuronal lesion.
- discussion_id: hbsl_mouse_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Why do mice homozygous for HBSL alleles (D367Y, M256L) have little or no
    disease when the same human genotypes cause severe leukodystrophy?
  attaches_to:
  - pathophysiology#DARS1 Biallelic Variants
  - pathophysiology#Deficient Myelin in Brainstem, Cerebral and Spinal Long Tracts
  rationale: >-
    Both knock-in lines needed a null allele in trans to show pathology, and
    even then they reproduced spinal white matter changes but not the human
    brain MRI pattern, and one showed mainly metabolic and peripheral effects.
    Until the species difference is understood, the mice cannot be used to read
    off allele severity, and the D367Y line additionally carries an allele that
    did not lower enzyme activity in vitro.
  status: OPEN
  evidence:
  - reference: PMID:35357600
    reference_title: "Developmental delay and late onset HBSL pathology in hypomorphic Dars1(M256L) mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Despite causing severe illness in humans, homozygous Dars1 M256L mice were
      only mildly affected.
    explanation: >-
      States the human-mouse discrepancy directly for M256L.
  - reference: PMID:33551752
    reference_title: "A Hypomorphic Dars1 (D367Y) Model Recapitulates Key Aspects of the Leukodystrophy HBSL."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Surprisingly, mice carrying this mutation homozygously were
      phenotypically normal.
    explanation: >-
      The same discrepancy for D367Y.
- discussion_id: hbsl_steroid_response
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why do adolescent-onset HBSL patients improve partially on steroids, and
    does an inflammatory component contribute to the subacute deteriorations?
  attaches_to:
  - treatments#Corticosteroid Therapy
  - phenotypes#Subacute spastic paraplegia
  rationale: >-
    A partial steroid response in a genetic hypomyelinating disorder is
    unexpected and has been reported only in a few uncontrolled cases. Whether
    it reflects secondary inflammation, a non-specific effect, or the natural
    fluctuation of the course has not been studied.
  status: OPEN
  evidence:
  - reference: PMID:25527264
    reference_title: "DARS-associated leukoencephalopathy can mimic a steroid-responsive neuroinflammatory disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Adolescent-onset patients presented with subacute spastic paraplegia and
      had positive response to steroids.
    explanation: >-
      The observation that raises the question.
- discussion_id: hbsl_genotype_phenotype
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do particular DARS1 alleles predict infantile versus adolescent onset?
  attaches_to:
  - genetic#DARS1
  - progression#Infantile onset
  - progression#Adolescent onset, subacute
  rationale: >-
    Onset ranges from infancy to adolescence, but with a few dozen patients and
    mostly private alleles no genotype-phenotype correlation has been
    established, and only two alleles have been assayed functionally.
  status: OPEN
  evidence:
  - reference: PMID:33574740
    reference_title: "The Leukodystrophies HBSL and LBSL-Correlates and Distinctions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Both HBSL and LBSL are spectrum disorders lacking genotype to phenotype
      correlation.
    explanation: >-
      The review states that no genotype-phenotype correlation is known.

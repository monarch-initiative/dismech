  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence or incidence has been measured. The discovery
    series reported ten individuals (PMID:23643384), and a 2023 literature
    review counted 19 published patients in its full text (PMID:36712860).
    Orphanet's record (ORPHA:363412) is not in references_cache/ and is not
    quoted here.
  evidence:
  - reference: PMID:36712860
    reference_title: "Leukoencephalopathy hypomyelination with brainstem and spinal cord involvement and leg spasticity caused by DARS1 mutations."
    supports: SUPPORT

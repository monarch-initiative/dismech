genetic:
- name: DARS1
  gene_term:
    preferred_term: DARS1
    term:
      id: hgnc:2678
      label: DARS1
  presence: PRESENT
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    The gene was called DARS until it was renamed DARS1, so the discovery paper
    and early case reports use DARS. DARS2, the mitochondrial paralog, causes
    the different disease LBSL. No ClinGen gene-disease validity record for
    DARS1 is cached in references_cache/, so gene_disease_validity is left
    absent.
  inheritance:
  - name: Autosomal recessive inheritance
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  variants:
  - name: p.Asp367Tyr (D367Y)
    description: >-
      A missense allele from the discovery cohort, carried in trans with A274V
      by the index patient and introduced into mouse Dars1 to build the first
      knock-in model. It did not reduce aminoacylation activity in an
      overexpression assay (full text of PMID:33551752).
    evidence:
    - reference: PMID:33551752
      reference_title: "A Hypomorphic Dars1 (D367Y) Model Recapitulates Key Aspects of the Leukodystrophy HBSL."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        we introduced the HBSL-causing Dars1 D367Y point mutation into the mouse
        genome.
      explanation: >-
        Names D367Y as an HBSL-causing allele.
  - name: p.Met256Leu (M256L)
    description: >-
      A missense allele that causes severe disease in humans; homozygous
      knock-in mice are only mildly affected.
    evidence:
    - reference: PMID:35357600
      reference_title: "Developmental delay and late onset HBSL pathology in hypomorphic Dars1(M256L) mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In this study, we introduced the pathogenic DARS1 M256L mutation located
        on exon nine of the murine Dars1 locus.
      explanation: >-
        Identifies M256L as a pathogenic HBSL allele.
  - name: c.1363T>C and c.821C>G (compound heterozygous)
    description: >-
      Compound heterozygous genotype in a Chinese patient with childhood-onset
      developmental regression and leg spasticity; one of the two variants was
      novel at the time of report.
    evidence:
    - reference: PMID:35571067
      reference_title: "Case Report: DARS Mutations Responsible for Hypomyelination With Brain Stem and Spinal Cord Involvement and Leg Spasticity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The patient had two compound heterozygous mutations (NM_001349:c.1363T

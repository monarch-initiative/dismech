name: Hypomyelination with Brain Stem and Spinal Cord Involvement and Leg Spasticity
creation_date: "2026-10-09T20:30:00Z"
description: >-
  Hypomyelination with brain stem and spinal cord involvement and leg spasticity
  (HBSL) is an autosomal recessive leukodystrophy caused by biallelic germline
  variants in DARS1, mostly missense, which encodes the cytoplasmic
  aspartyl-tRNA synthetase that charges tRNA(Asp) with aspartate. Typical
  disease begins in infancy with delayed or regressing motor development and
  progressive, leg-predominant spasticity with pyramidal signs; ataxia,
  nystagmus, seizures and variable cognitive impairment are reported. MRI shows
  a recognisable pattern of hypomyelination involving the supratentorial white
  matter, the anterior brainstem and cerebellar peduncles, and the dorsal
  columns and lateral corticospinal tracts of the spinal cord. The spectrum is
  wider than the founding description: adolescent-onset patients can present
  with subacute spastic paraplegia, only minor focal cerebral white matter
  lesions, the same spinal long-tract changes, and a partial response to
  steroids, so the disease can mimic multiple sclerosis. HBSL closely resembles
  LBSL, which is caused by variants in DARS2 (the mitochondrial aspartyl-tRNA
  synthetase); the two are different diseases of different genes and should not
  be conflated. Complete loss of Dars1 is embryonic lethal in mice, so disease
  alleles are thought to retain residual function, but how a DARS1 defect
  produces a tract-selective white matter disease, and whether neurons or
  oligodendrocytes are affected first, is unresolved. There is no
  disease-modifying treatment.
category: Mendelian

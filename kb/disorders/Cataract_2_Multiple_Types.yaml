animal_models:
- name: CRYGC 5-bp duplication transgenic mouse
  species: Mouse
  genotype: Transgenic human CRYGC c.119_123dup (p.Cys42AlafsX63) minigene driven by the chicken betaB1-crystallin promoter
  publication: PMID:39994382
  description: >-
    Transgenic mice expressing the human 5-bp duplication allele develop
    cataracts of variable onset and severity; severe lenses have higher
    transgene expression and activate the unfolded protein response.
  modeled_mechanisms:
  - target: Lens Fiber Cell Unfolded Protein Response and Apoptosis
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      The mutant allele is an overexpressed transgene on a background with
      two normal mouse Crygc copies, so the dose of mutant protein differs
      from a heterozygous patient, and the stress response has not been
      examined in human lens tissue.
    evidence:
    - reference: PMID:39994382
      reference_title: "The c.119-123dup5bp mutation in human γC-crystallin destabilizes the protein and activates the unfolded protein response to cause highly variable cataracts."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Postnatal 3 weeks (P3W) Transgenic mice exhibited phenotypic diversity with a dimorphic population of severe and clear lenses."
      explanation: Variable cataract severity in transgenic mice.
- name: Crygc Chl3 mouse
  species: Mouse
  genotype: Crygc(Chl3), 6-bp in-frame deletion in exon 3 removing Gly and Arg in the fourth Greek key motif; dominant
  publication: PMID:11773036
  description: >-
    Chlorambucil-induced dominant mutant with bilateral nuclear and radial
    lens opacity, small lenses and degeneration of fiber cells in the lens
    core.
  modeled_mechanisms:
  - target: Lens Light Scattering and Loss of Transparency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      The mouse allele is not a human variant, and the mouse gamma-crystallin
      cluster differs from the human one, so the contribution of the mutant
      protein to the lens protein pool may not match.
    evidence:
    - reference: PMID:11773036
      reference_title: "A 6-bp deletion in the Crygc gene leading to a nuclear and radial cataract in the mouse."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A 6-bp deletion in exon 3 of the gammaC-crystallin encoding gene (Crygc) is causative for the cataract phenotype; the mutation is therefore designated CrygcChl3."
      explanation: A Crygc in-frame deletion causes nuclear cataract in mice.
treatments:
- name: Cataract Surgery
  description: >-
    Lens extraction is the standard management of visually significant CRYGC
    cataract, from infancy for dense congenital opacities. For dense
    bilateral congenital cataract, the timing of surgery in the first weeks
    of life governs visual outcome; this evidence comes from cohorts that
    were not genotyped. No CRYGC-specific therapy exists.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cataract surgery
    term:
      id: NCIT:C157809

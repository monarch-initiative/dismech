    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing (WES) and copy number variation (CNV) analysis were conducted for variant identification in a patient born with a total binocular CC without a family history of CC."
    explanation: Total bilateral congenital cataract in the W131R patient.
  - reference: PMID:17679936

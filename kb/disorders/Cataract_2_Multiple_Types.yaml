discussions:
- discussion_id: crygc_microcornea_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Microcornea
  - phenotypes#Microphthalmia
  prompt: >-
    How does a mutant lens crystallin produce a small cornea or small eye?
  rationale: >-
    Microcornea recurs in CRYGC families and microphthalmia has been
    reported with a de novo frameshift, but the studies here describe only
    protein aggregation and lens fiber cell stress. Nothing in this entry
    connects those lens events to growth of the cornea or globe, so these
    two phenotypes have no causal edge.
  evidence:
  - reference: PMID:22876111
    reference_title: "A nonsense mutation of CRYGC associated with autosomal dominant congenital nuclear cataracts and microcornea in a Chinese pedigree."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All affected individuals in this family exhibited nuclear cataracts and microcornea."
    explanation: Microcornea co-occurs with the cataract in a CRYGC family.
- discussion_id: crygc_variable_severity
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Lens Light Scattering and Loss of Transparency
  prompt: >-
    Why does the same CRYGC allele cause very different cataract severity
    between relatives, and even between the two eyes of one person?
  rationale: >-
    The 5-bp duplication family has highly variable cataracts. In transgenic
    mice severity follows transgene expression level, but the cause of that
    variation is unknown and the authors suggest a stochastic process during
    lens development; this has not been tested in patients.
  evidence:
  - reference: PMID:39994382
    reference_title: "The c.119-123dup5bp mutation in human γC-crystallin destabilizes the protein and activates the unfolded protein response to cause highly variable cataracts."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Although we currently do not have a good theory to explain the variability in CRYG5bpdup mRNA levels or phenotype, some sort of stochastic process during lens development seems likely based on the available data."
    explanation: Authors state that the source of variability is unexplained.
notes: >-
  Cataract 4, multiple types (CRYGD) is curated separately in
  Cataract_4_Multiple_Types. The Coppock-like dust-like nuclear opacity has
  no specific HPO term, so it is carried under Nuclear cataract.

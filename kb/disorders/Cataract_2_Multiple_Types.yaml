- name: Gamma-C Crystallin Aggregation in Lens Cells
  biological_scale: CELLULAR
  conforms_to: cataract_lens_opacification#Crystallin Aggregation and High-Molecular-Weight Complex Deposition
  description: >-
    Mutant gamma-C crystallin forms intracellular aggregates in cultured
    cells, including human lens epithelial cells. Mutant T5P also interacts
    less with itself and with other crystallins, and co-expressed
    alpha-A crystallin reduces its aggregation, which suggests that
    alpha-crystallin chaperone capacity limits aggregation in the lens.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  evidence:
  - reference: PMID:18926820
    reference_title: "Protein-protein interactions involving congenital cataract T5P gammaC-crystallin mutant: a confocal fluorescence microscopy study."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The confocal fluorescence images show that cells expressing T5P gammaC-crystallin contain many protein aggregates, but cells co-expressing with either gammaC- or alphaA-crystallin reduce the aggregation considerably."
    explanation: T5P aggregates in HeLa cells and alpha-A crystallin reduces it.
  - reference: PMID:18421082
    reference_title: "Visualization of in situ intracellular aggregation of two cataract-associated human gamma-crystallin mutants: lose a tail, lose transparency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transfection of the EGFP-tagged mutant cDNAs into several cell lines led to the visualization of aggregates, whereas that of wild-type cDNAs did not."
    explanation: Truncated W157X gamma-C crystallin aggregates in cells.
  - reference: PMID:12601044
    reference_title: "Alteration of protein-protein interactions of congenital cataract crystallin mutants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "For the T5P gammaC-crystallin, most of the interactions were decreased"
    explanation: T5P loses normal interactions with other crystallins in a two-hybrid assay.
  downstream:
  - target: Lens Light Scattering and Loss of Transparency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17122105
      reference_title: "Mutation causing self-aggregation in human gammaC-crystallin leading to congenital cataract."
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: "The authors found that the 5-bp insertion led to a loss of secondary and tertiary structures of the molecule and to an enhanced tendency of self-aggregation into light-scattering particles, offering a possible factor in lens opacification."
      explanation: Aggregates of mutant protein scatter light in solution; the link to lens opacity is inferred.
- name: Lens Fiber Cell Unfolded Protein Response and Apoptosis
  biological_scale: CELLULAR
  description: >-
    In transgenic mice carrying the human 5-bp duplication allele, lenses
    with severe cataract show PERK-dependent unfolded protein response
    activation with induction of autophagy and apoptosis, and severity
    tracks transgene expression level. This has been shown only for the
    5-bp duplication and only in mice.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  biological_processes:
  - preferred_term: PERK-mediated unfolded protein response
    term:
      id: GO:0036499
      label: PERK-mediated unfolded protein response
    modifier: INCREASED
  - preferred_term: apoptotic process
    term:
      id: GO:0006915
      label: apoptotic process
    modifier: INCREASED
  evidence:
  - reference: PMID:39994382
    reference_title: "The c.119-123dup5bp mutation in human γC-crystallin destabilizes the protein and activates the unfolded protein response to cause highly variable cataracts."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Thus, high levels of CRYGC5bpdup transgene expression in severely affected lenses induces UPRer and UPRmt stress responses primarily through the PERK-dependent and Atf4/Atf5/Ddit3 pathways respectively, inducing autophagy and apoptosis and thence congenital nuclear cataracts."
    explanation: Unfolded protein response, autophagy and apoptosis in transgenic mouse lenses.
  downstream:
  - target: Lens Light Scattering and Loss of Transparency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39994382
      reference_title: "The c.119-123dup5bp mutation in human γC-crystallin destabilizes the protein and activates the unfolded protein response to cause highly variable cataracts."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This effect is correlated to CRYGC5bpdup transgene expression, offering insight into cataract pathogenic pathways and recapitulating the variation in cataract severity in humans."
      explanation: Cataract severity tracks transgene expression and the stress response.
- name: Lens Light Scattering and Loss of Transparency
  biological_scale: TISSUE
  conforms_to: cataract_lens_opacification#Loss of Lens Refractive Transparency and Light Scattering
  description: >-
    Aggregated protein and damaged fiber cells scatter light, producing
    lens opacities that are most often nuclear, and sometimes dust-like
    (Coppock-like), zonular pulverulent or lamellar. Severity varies between
    relatives carrying the same allele.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  biological_processes:
  - preferred_term: maintenance of lens transparency
    term:
      id: GO:0036438
      label: maintenance of lens transparency
    modifier: DECREASED
  evidence:
  - reference: PMID:22052681
    reference_title: "A novel mutation impairing the tertiary structure and stability of γC-crystallin (CRYGC) leads to cataract formation in humans and zebrafish lens."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Using zebrafish as a model, we demonstrated that γC-crystallin p.Gly129Cys mutant caused the vacuole and the incomplete denucleation of lens, recapitulating the cataract phenotype in human beings."
    explanation: Expressing the G129C allele in zebrafish produces lens defects.
  - reference: PMID:32811259
    reference_title: "A novel CRYGC E128* mutation underlying an autosomal dominant nuclear cataract in a south Indian kindred."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Molecular function analysis of this novel mutation (p. E128*, CRYGC) in the zebrafish indicated this mutation to impair lens transparency."
    explanation: The E128* allele impairs lens transparency in zebrafish.

name: Cataract 2, Multiple Types
creation_date: "2026-10-23T02:00:00Z"
category: Mendelian
parents:
- Early-onset non-syndromic cataract
synonyms:
- CTRCT2
- cataract 2, multiple types
- CRYGC-related cataract
- gamma-C crystallin cataract
- Coppock-like cataract
description: >-
  Autosomal dominant, non-syndromic early-onset cataract caused by
  heterozygous variants in CRYGC, which encodes gamma-C crystallin, one of the
  monomeric beta-gamma crystallins that fill the cytoplasm of lens fiber cells.
  The gene was implicated in 1999, when the Coppock-like cataract family,
  originally attributed to a CRYGE pseudogene change, was found to carry a
  CRYGC T5P missense allele. Most reported alleles are missense changes or
  truncations (nonsense and frameshift) that remove the C-terminal Greek key
  motifs. The opacity is usually congenital and bilateral. Nuclear cataract is
  the most frequent morphology, and dust-like (Coppock-like), zonular
  pulverulent and lamellar opacities have also been reported; severity can
  differ widely within one family. Several families also have microcornea, and
  a de novo frameshift has been reported with microphthalmia and nystagmus.
  Biophysical studies show two routes to opacity. Most alleles (T5P, G129C,
  the 5-bp duplication, W157X) unfold or destabilize the protein and expose
  hydrophobic surfaces, so it aggregates. R168W keeps a near-normal fold and
  stability but still self-aggregates and scatters light. In transgenic mice,
  the 5-bp duplication also triggers an unfolded protein response, autophagy
  and apoptosis in the lens. Management is surgical lens extraction; there is
  no disease-specific therapy.

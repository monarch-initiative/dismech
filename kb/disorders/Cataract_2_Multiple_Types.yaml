genetic:
- name: CRYGC
  gene_term:
    preferred_term: CRYGC
    term:
      id: hgnc:2410
      label: CRYGC
  relationship_type: CAUSATIVE
  association: Causative
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    Residue numbering differs between reports: some biophysical papers number
    the processed protein without the initiator methionine, so the same
    allele can appear with positions differing by one. Two Chinese
    four-generation W157X families with nuclear cataract and microcornea
    (PMID:19204787, c.470G>A; PMID:22876111, c.471G>A) may be the same
    family reported twice. No ClinGen gene-disease validity record for CRYGC
    is cached in this repository, so gene_disease_validity is omitted; the
    published ClinGen-protocol curation cited below is not a ClinGen-issued
    assertion.
  evidence:
  - reference: PMID:10521291
    reference_title: "The gamma-crystallins and human cataracts: a puzzle made clearer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To our knowledge, these findings are the first evidence of an involvement of CRYGC and support the role of CRYGD in human cataract formation."
    explanation: First report implicating CRYGC.
  - reference: PMID:10914683
    reference_title: "A 5-base insertion in the gammaC-crystallin gene is associated with autosomal dominant variable zonular pulverulent cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The gammaD-crystallin gene shows no abnormalities, but a 5-bp duplication within exon 2 of the gammaC-crystallin gene has been found in one allele of each affected family member and is absent from both unaffected family members and unaffected controls."
    explanation: Linked family with a segregating CRYGC frameshift.
  - reference: PMID:28298635
    reference_title: "Novel mutations in CRYGC are associated with congenital cataracts in Chinese families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the CRYGC were responsible for 4.1% Chinese ADCC families in our cohort."
    explanation: CRYGC share of dominant congenital cataract in a cohort of 195 Chinese families.
  - reference: PMID:42091610
    reference_title: "Evaluating gene-disease relationship strength in crystallin genes in association with pediatric cataracts."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Seven genes (CRYAA, CRYAB, CRYBA1, CRYBB1, CRYBB2, CRYGC, CRYGD) scored as Definitively associated with autosomal dominant (AD) inherited pediatric cataracts."
    explanation: Published curation using ClinGen protocols scores CRYGC as definitive for dominant pediatric cataract.
  variants:
  - name: T5P (p.Thr5Pro)
    description: Coppock-like cataract allele; misfolded, destabilized and largely insoluble.
    evidence:
    - reference: PMID:11904153
      reference_title: "Conformational change and destabilization of cataract gammaC-crystallin T5P mutant."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The T5P mutation obviously changes conformation and decreases conformational stability."
      explanation: Biophysical behavior of T5P.
  - name: c.119_123dup (p.Cys42AlafsX63)
    description: >-
      Five-base duplication in exon 2 causing a frameshift; variable zonular
      pulverulent cataract in a seven-generation family.
    evidence:
    - reference: PMID:39994382
      reference_title: "The c.119-123dup5bp mutation in human γC-crystallin destabilizes the protein and activates the unfolded protein response to cause highly variable cataracts."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here we investigate the molecular mechanism of cataractogenesis of the CRYGC c.119-123dupGCGGC (p.Cys42AlafsX63) (CRYGC5bpdup) mutation."
      explanation: HGVS description of the duplication.
  - name: R168W (c.502C>T)
    description: Lamellar or nuclear cataract; native-like fold with increased self-aggregation.
    evidence:
    - reference: PMID:17679936
      reference_title: "A family with autosomal dominant primary congenital cataract associated with a CRYGC mutation: evidence of clinical heterogeneity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our data and previous report support that R168W is the actual disease-causing mutation and should no longer be considered a SNP."
      explanation: Segregation evidence for R168W as pathogenic.
  - name: G129C (c.385G>T)
    description: Nuclear cataract; disrupts the C-terminal domain and lowers stability.
    evidence:
    - reference: PMID:22052681
      reference_title: "A novel mutation impairing the tertiary structure and stability of γC-crystallin (CRYGC) leads to cataract formation in humans and zebrafish lens."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "we identified a novel, heterozygous c.385G<T mutation in CRYGC that resulted in the substitution of a highly conserved glycine by cysteine at codon 129 (p.Gly129Cys) in a three-generation Chinese family with autosomal dominant congenital nuclear cataract by sequencing candidate genes."
      explanation: G129C in a dominant nuclear cataract family.
  - name: W157X (c.470G>A / c.471G>A)
    description: Truncates the C-terminal 18 residues; nuclear cataract with microcornea; also reported de novo.
    evidence:
    - reference: PMID:40868138
      reference_title: "Genetic Landscape of Congenital Cataracts in a Swiss Cohort: Addressing Diagnostic Oversights in Nance-Horan Syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "He is the only carrier of the variant thus it being de novo."
      explanation: De novo W157X in a Swiss patient with nuclear cataract.

inheritance:
- name: Autosomal Dominant
  description: >-
    Heterozygous CRYGC variants segregate with cataract in multigenerational
    families. De novo heterozygous variants have been found in sporadic
    patients with unaffected parents.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:10914683
    reference_title: "A 5-base insertion in the gammaC-crystallin gene is associated with autosomal dominant variable zonular pulverulent cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A seven-generation family with 30 members affected by highly variable autosomal dominant zonular pulverulent cataracts has been previously described."
    explanation: Dominant transmission over seven generations in the 5-bp duplication family.
  - reference: PMID:19204787
    reference_title: "A novel nonsense mutation in CRYGC is associated with autosomal dominant congenital nuclear cataracts and microcornea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct sequencing of the candidate CRYGA-CRYGD gene cluster revealed a c.470G>A transversion in exon 3 of CRYGC, which cosegregated with cataracts in the family and was not observed in 100 normal controls."
    explanation: Heterozygous W157X co-segregates with cataract in a four-generation family.
  - reference: PMID:38068917
    reference_title: "Novel CRYGC Mutation in Conserved Ultraviolet-Protective Tryptophan (p.Trp131Arg) Is Linked to Autosomal Dominant Congenital Cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The first de novo missense mutation at c.391T>C was identified in exon 3 of CRYGC on chromosome 2 causing the substitution of a highly conserved Tryptophan to an Arginine located at p.Trp131Arg."
    explanation: A de novo heterozygous allele in a sporadic patient, consistent with dominant action.
pathophysiology:
- name: CRYGC Pathogenic Variant
  biological_scale: MOLECULAR
  conforms_to: cataract_lens_opacification#Lens Homeostasis Insult
  description: >-
    Heterozygous missense, nonsense and frameshift variants in CRYGC. Missense
    alleles change conserved residues in either domain (T5P, R48H, G129C,
    W131R, S166F, R168W). Nonsense and frameshift alleles (the c.119_123dup
    5-bp duplication, C109X, E128*, Y139X, W157X and others) truncate the
    protein and remove one or both C-terminal Greek key motifs.
  genes:
  - preferred_term: CRYGC
    term:
      id: hgnc:2410
      label: CRYGC
  molecular_functions:
  - preferred_term: structural constituent of eye lens
    term:
      id: GO:0005212
      label: structural constituent of eye lens
    modifier: ABNORMAL
    description: >-
      Gamma-C crystallin serves the lens as a densely packed, soluble
      structural protein. Mutant protein is still made but misfolds,
      aggregates or self-associates abnormally, so the structural role is
      altered qualitatively rather than simply reduced; hence ABNORMAL.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  evidence:
  - reference: PMID:10521291
    reference_title: "The gamma-crystallins and human cataracts: a puzzle made clearer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Further analysis of the original Coppock-like-cataract family identified a missense mutation in a highly conserved segment of exon 2 of CRYGC."
    explanation: First disease-causing CRYGC allele (T5P), found in the Coppock-like cataract family.
  - reference: PMID:10914683
    reference_title: "A 5-base insertion in the gammaC-crystallin gene is associated with autosomal dominant variable zonular pulverulent cataract."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation disrupts the reading frame of the gammaC-crystallin coding sequence and is predicted to result in the synthesis of an unstable gammaC-crystallin with 38 amino acids of the first \"Greek key\" motif followed by 52 random amino acids."
    explanation: The 5-bp duplication is a frameshift that leaves only part of the first Greek key motif.
  - reference: PMID:18618005
    reference_title: "A nonsense mutation in CRYGC associated with autosomal dominant congenital nuclear cataract in a Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One and a half Greek key motifs at the COOH-terminus were found to be absent in the structural model of the mutant truncated gammaC-crystallin."
    explanation: The C109X nonsense allele removes the C-terminal Greek key motifs.
  downstream:
  - target: Gamma-C Crystallin Unfolding and Destabilization
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11904153
      reference_title: "Conformational change and destabilization of cataract gammaC-crystallin T5P mutant."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The T5P mutation obviously changes conformation and decreases conformational stability."
      explanation: Recombinant T5P is misfolded and less stable than wild type.
    - reference: PMID:22052681
      reference_title: "A novel mutation impairing the tertiary structure and stability of γC-crystallin (CRYGC) leads to cataract formation in humans and zebrafish lens."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Molecular modeling and spectroscopic studies indicated that the mutation impaired the tertiary structure of the protein by modifying the H-bonding network in the C-terminal domain."
      explanation: G129C disrupts the C-terminal domain structure.
  - target: Self-Aggregation of Conformationally Normal Gamma-C Crystallin
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17122105
      reference_title: "Mutation causing self-aggregation in human gammaC-crystallin leading to congenital cataract."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The R168W mutant, on the other hand, was remarkably similar to the wild-type molecule in its conformation and structural stability, but it differed in its ability to aggregate and scatter light."
      explanation: R168W aggregates without unfolding.
- name: Gamma-C Crystallin Unfolding and Destabilization
  biological_scale: MOLECULAR
  conforms_to: cataract_lens_opacification#Loss of Crystallin Solubility and Chaperone Capacity
  description: >-
    Most tested alleles change the conformation of gamma-C crystallin and
    lower its stability. T5P alters conformation and stability and is
    largely insoluble when overexpressed; G129C disrupts the C-terminal
    domain and sharply lowers thermal stability; the 5-bp duplication loses
    secondary and tertiary structure; and the W157X truncation exposes
    hydrophobic side chains and lowers solubility.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  biological_processes:
  - preferred_term: protein folding
    term:
      id: GO:0006457
      label: protein folding
    modifier: ABNORMAL
  evidence:
  - reference: PMID:11904153
    reference_title: "Conformational change and destabilization of cataract gammaC-crystallin T5P mutant."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "During cloning and overexpression, the majority of T5P mutant was found in the inclusion body."
    explanation: T5P is largely insoluble when expressed in bacteria.
  - reference: PMID:22052681
    reference_title: "A novel mutation impairing the tertiary structure and stability of γC-crystallin (CRYGC) leads to cataract formation in humans and zebrafish lens."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The mutation led to a dramatic decrease in the thermal stability of γC-crystallin"
    explanation: G129C destabilizes the recombinant protein.
  - reference: PMID:17122105
    reference_title: "Mutation causing self-aggregation in human gammaC-crystallin leading to congenital cataract."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The authors found that the 5-bp insertion led to a loss of secondary and tertiary structures of the molecule and to an enhanced tendency of self-aggregation into light-scattering particles, offering a possible factor in lens opacification."
    explanation: The 5-bp duplication protein loses its fold.
  - reference: PMID:18421082
    reference_title: "Visualization of in situ intracellular aggregation of two cataract-associated human gamma-crystallin mutants: lose a tail, lose transparency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The deletion of C-terminal 18 residues of human gammaC- and gammaD-crystallins exposes the side chains of several hydrophobic residues in the sequence to the solvent, causing the molecule to self-aggregate."
    explanation: W157X truncation exposes hydrophobic residues.
  downstream:
  - target: Gamma-C Crystallin Aggregation in Lens Cells
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22052681
      reference_title: "A novel mutation impairing the tertiary structure and stability of γC-crystallin (CRYGC) leads to cataract formation in humans and zebrafish lens."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "a significant increase in the propensity of aggregation when subject to storage at high concentrations, heat, and UV- irradiation stresses"
      explanation: Destabilized G129C aggregates under stress.
  - target: Lens Fiber Cell Unfolded Protein Response and Apoptosis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39994382
      reference_title: "The c.119-123dup5bp mutation in human γC-crystallin destabilizes the protein and activates the unfolded protein response to cause highly variable cataracts."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Transgenic mice showed differential upregulation in Master regulator Grp78 (Hspa5) and downstream targets in the PERK-dependent UPR pathway including Atf4 and Chop (Ddit3), but not GADD34 (Ppp1r15a)."
      explanation: Lenses expressing the destabilized 5-bp duplication protein activate the PERK arm of the unfolded protein response.
- name: Self-Aggregation of Conformationally Normal Gamma-C Crystallin
  biological_scale: MOLECULAR
  conforms_to: cataract_lens_opacification#Loss of Crystallin Solubility and Chaperone Capacity
  description: >-
    The R168W protein has a near-normal conformation and stability but a
    greater tendency to self-aggregate and scatter light, showing that
    unfolding is not required for CRYGC cataract.
  cell_types:
  - preferred_term: lens fiber cell
    term:
      id: CL:0011004
      label: lens fiber cell
  evidence:
  - reference: PMID:17122105
    reference_title: "Mutation causing self-aggregation in human gammaC-crystallin leading to congenital cataract."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results support the idea that unfolding or structural destabilization is not always necessary for crystallin-associated cataractogenesis."
    explanation: Conclusion drawn from the R168W protein's normal fold and abnormal aggregation.
  downstream:
  - target: Gamma-C Crystallin Aggregation in Lens Cells
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17122105
      reference_title: "Mutation causing self-aggregation in human gammaC-crystallin leading to congenital cataract."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The R168W mutant, on the other hand, was remarkably similar to the wild-type molecule in its conformation and structural stability, but it differed in its ability to aggregate and scatter light."

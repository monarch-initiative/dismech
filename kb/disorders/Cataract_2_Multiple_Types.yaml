    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individual III:3 had cataract extraction performed at 6 years of age."
    explanation: Childhood cataract extraction in a W157X carrier.
  - reference: PMID:40868138
    reference_title: "Genetic Landscape of Congenital Cataracts in a Swiss Cohort: Addressing Diagnostic Oversights in Nance-Horan Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "had nuclear cataracts and underwent surgery at 1 month"
    explanation: Surgery at one month in a de novo W157X patient.
  - reference: PMID:19084444

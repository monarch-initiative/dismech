    snippet: "In the present study, we described a family with nuclear congenital cataract that segregated the CRYGC missense mutation c.502C>T."
    explanation: Congenital cataract in an R168W family.
  sequelae:
  - target: Amblyopia
    description: >-
      A dense opacity in early infancy deprives the developing visual system
      of a formed image, causing deprivation amblyopia unless the lens is
      removed early.
    evidence:
    - reference: PMID:19084444
      reference_title: "The critical period for surgical treatment of dense congenital bilateral cataracts."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Deprivation amblyopia may be minimized with early surgery for dense congenital bilateral cataracts."
      explanation: >-
        Cohort of infants with dense bilateral congenital cataract of
        unspecified cause; indirect because it was not genotyped for CRYGC.
  - target: Nystagmus
    description: >-
      Nystagmus follows early form deprivation from a dense congenital
      opacity and is more frequent when surgery is delayed.
    evidence:
    - reference: PMID:19084444
      reference_title: "The critical period for surgical treatment of dense congenital bilateral cataracts."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Surgery after 4 weeks was associated with a greater prevalence of strabismus and nystagmus than surgery before 4 weeks"
      explanation: >-
        Longer deprivation before surgery is associated with more nystagmus;
        indirect because the cohort was not genotyped for CRYGC.

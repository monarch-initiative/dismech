  - biochemical#Serum transferrin isoelectric focusing
  - pathophysiology#Protein Hypoglycosylation
  rationale: >-
    Of four patients, one had a normal transferrin profile throughout and
    another's normalized at 17 months. Transferrin IEF is the standard first-line
    CDG screen, so a disorder that half-escapes it is likely under-ascertained.
    Whether a different glycoprotein readout, or direct polyprenol/dolichol
    measurement, would perform better as a screen has not been tested.

- discussion_id: pathway_step_to_phenotype
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why do DHRSX-CDG and SRD5A3-CDG differ clinically when both raise the
    polyprenol-to-dolichol ratio and produce the same immature glycan signature?
  attaches_to:
  - pathophysiology#Impaired Dolichol Synthesis from Polyprenol
  - pathophysiology#Defective Lipid-Linked Oligosaccharide Maturation
  rationale: >-
    The two enzymes act in the same three-step conversion and their knockouts
    give the same Man-5/Man-4 accumulation in HAP1 cells, yet SRD5A3-CDG is a
    recognized disorder with its own phenotype dominated by ocular and
    neurological features. If the biochemical lesion is shared, something other
    than the glycan signature must account for the clinical difference —
    possibly DHRSX's activity on other substrates, or its reported localization
    to lipid droplet-like structures.

- discussion_id: cochlear_nerve_agenesis_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    How does defective N-glycosylation produce bilateral agenesis of the cochlear
    and vestibular nerves specifically?
  attaches_to:
  - phenotypes#Cochlear nerve aplasia
  - pathophysiology#Protein Hypoglycosylation
  rationale: >-
    Cranial nerve VIII agenesis is not a general feature of the CDGs, and the
    edges from hypoglycosylation to the clinical phenotypes are recorded as
    indirect with unknown intermediates for exactly this reason. Identifying the
    glycoprotein whose underglycosylation disrupts eighth nerve development would
    convert those edges into a mechanism, and would inform whether auditory
    brainstem implantation is a rational option.

- discussion_id: dolichol_role_versus_autophagy_role
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does DHRSX's reported secreted, autophagy-regulating role contribute to
    this disease, or is the phenotype entirely explained by the ER dolichol
    synthesis defect?
  attaches_to:
  - pathophysiology#DHRSX Oxidoreductase Deficiency
  - pathophysiology#Protein Hypoglycosylation
  rationale: >-
    Before its role in dolichol biosynthesis was known, DHRSX was characterized
    as a non-classical secretory protein that positively regulates
    starvation-induced autophagy. The patient variants cluster around the
    NAD(P)+ binding site and substrate channel, so they would be expected to
    impair the oxidoreductase function specifically, but nothing establishes
    that the autophagy role is spared. Separating the two would need
    catalytically dead versus secretion-deficient constructs in a
    disease-relevant cell type. It matters because the entire pathograph in
    this entry runs through glycosylation, and an unrecognised autophagy
    contribution would be a parallel arm it does not represent.
  evidence:
  - reference: PMID:25076851
    reference_title: "DHRSX, a novel non-classical secretory protein associated with starvation induced autophagy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "these results demonstrate that DHRSX is a novel non-classical secretory protein involved in the positive regulation of starvation induced autophagy"
    explanation: >-
      Establishes the second, non-glycosylation function of DHRSX that this gap
      is about. Indirect for the disease because the work is overexpression and
      siRNA knockdown in HeLa and U2OS cells with no patient material and no
      connection to the CDG phenotype.

notes: >-
  The literature uses "DHRSX-CDG" for this disorder; "congenital disorder of
  glycosylation, type 1DD" (CDG1DD) is the OMIM/MONDO name for the same entity
  (OMIM:301133). Do not confuse the pseudoautosomal location of DHRSX with
  X-linked inheritance — PAR1 genes are present in two copies in both sexes and
  escape X-inactivation, and both females and males are affected in the reported
  families.

references:
- reference: PMID:38821050
  title: A pseudoautosomal glycosylation disorder prompts the revision of dolichol biosynthesis.
- reference: PMID:38948797
  title: The N-glycosylation defect in Lec5 and Lec9 CHO cells is caused by absence of the DHRSX gene.

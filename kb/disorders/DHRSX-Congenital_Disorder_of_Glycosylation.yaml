name: DHRSX-Congenital Disorder of Glycosylation
creation_date: "2026-09-01T00:00:00Z"
category: Mendelian
description: >-
  DHRSX-CDG (congenital disorder of glycosylation type 1DD) is a type I
  congenital disorder of glycosylation caused by biallelic missense variants in
  DHRSX. Two things make it unusual. First, its inheritance is
  pseudoautosomal-recessive: DHRSX lies in pseudoautosomal region 1, present on
  both the X and the Y chromosome, so the gene behaves autosomally despite its
  sex-chromosome location. Second, identifying the disease rewrote a textbook
  pathway. Dolichol had been thought to be made directly from polyprenol by
  SRD5A3; the work describing these patients showed instead that the conversion
  takes three steps, with DHRSX performing the first and third — acting as an
  NAD+-dependent dehydrogenase and, non-consecutively, as an NADPH-dependent
  reductase — and SRD5A3 only the second. Losing DHRSX raises the
  polyprenol-to-dolichol ratio, and because polyprenol-phosphate is a poor
  substrate for DPAGT1, DPM synthase, and ALG3, the lipid-linked oligosaccharide
  fails to mature and immature glycans are transferred to nascent proteins. Four
  individuals from three families have been described, with distinct facial
  features, severe neurological involvement, profound sensorineural hearing loss
  with absent cochlear and vestibular nerves, and severe failure to thrive.
parents:
- hereditary disease
- congenital disorder of glycosylation
- inborn error of dolichol metabolism
disease_term:
  preferred_term: congenital disorder of glycosylation, type 1DD
  term:
    id: MONDO:0975846
    label: congenital disorder of glycosylation, type 1DD

inheritance:
- name: Pseudoautosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic missense variants in DHRSX, which lies in pseudoautosomal region 1
    of the X and Y chromosomes. Because PAR1 genes are present in two copies in
    both sexes and escape X-inactivation, transmission is effectively autosomal
    recessive rather than X-linked — the affected individuals include both
    females and males. HPO has no dedicated pseudoautosomal-recessive term, so
    the standard autosomal recessive term is bound here and the pseudoautosomal
    location recorded in this description.
  evidence:
  - reference: PMID:38821050
    reference_title: "A pseudoautosomal glycosylation disorder prompts the revision of dolichol biosynthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report a CDG caused by biallelic missense variants in DHRSX, a gene located in the pseudoautosomal region 1 of the X and Y chromosomes."
    explanation: Establishes both the biallelic requirement and the pseudoautosomal location that makes inheritance behave recessively.

pathophysiology:
- name: DHRSX Oxidoreductase Deficiency
  description: >-
    The reported variants — p.(Thr49Met), p.(Val181Phe), and p.(Leu215Phe) —
    cluster around the predicted NAD(P)+ binding site and the substrate access
    channel. Thr49 is an obligatory residue of the Class IV NAD(P)+ binding
    motif; Val181 contacts the cofactor directly and sits at the mouth of the
    substrate channel; Leu215 lies along that channel. All three are therefore
    expected to impair the enzyme's oxidoreductase function rather than its
    expression.
  biological_scale: MOLECULAR
  downstream:
  - target: Impaired Dolichol Synthesis from Polyprenol
    causal_link_type: DIRECT
    description: >-
      DHRSX catalyses two of the three steps converting polyprenol to dolichol,
      so loss of its oxidoreductase activity blocks the pathway at both ends.
    evidence:
    - reference: PMID:38821050
      reference_title: "A pseudoautosomal glycosylation disorder prompts the revision of dolichol biosynthesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we found that dolichol synthesis requires a three-step detour involving additional metabolites, where SRD5A3 catalyzes only the second reaction. The first and third steps are performed by DHRSX"
      explanation: Assigns the first and third steps of dolichol synthesis to DHRSX, so its loss directly blocks the conversion.
  molecular_functions:
  - preferred_term: NAD(P)-dependent oxidoreductase activity of DHRSX
    term:
      id: GO:0016616
      label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:38821050
    reference_title: "A pseudoautosomal glycosylation disorder prompts the revision of dolichol biosynthesis."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Altogether, the variants observed in our patients were expected to severely impact the putative oxidoreductase function of DHRSX."
    explanation: Structural modelling of the three patient variants predicts loss of oxidoreductase function.
  - reference: PMID:38821050
    reference_title: "A pseudoautosomal glycosylation disorder prompts the revision of dolichol biosynthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "DHRSX has a unique dual substrate and cofactor specificity, allowing it to act as a NAD+-dependent dehydrogenase and as a NADPH-dependent reductase in two non-consecutive steps."
    explanation: Characterizes the dual enzymatic activity that the patient variants disrupt.

- name: Impaired Dolichol Synthesis from Polyprenol
  description: >-
    Cells lacking DHRSX accumulate polyprenol and its phosphorylated and
    hexosylated derivatives while dolichol and its derivatives fall — that is,
    the polyprenol-to-dolichol ratio rises. Polyprenal levels are unchanged,
    which is the observation that localizes the block to the DHRSX steps rather
    than the SRD5A3 step.
  biological_scale: MOLECULAR
  downstream:
  - target: Defective Lipid-Linked Oligosaccharide Maturation
    causal_link_type: DIRECT
    description: >-
      Dolichol-phosphate availability is rate-limiting for N-glycosylation, and
      polyprenol-phosphate substitutes poorly for it at several LLO assembly
      steps.
    evidence:
    - reference: PMID:38821050
      reference_title: "A pseudoautosomal glycosylation disorder prompts the revision of dolichol biosynthesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "our data indicate that the increased ratio of polyprenol to dolichol affects maturation of the lipid linked oligosaccharide and is associated with the transfer of immature glycans"
      explanation: States the causal link from the raised polyprenol/dolichol ratio to defective LLO maturation.
  chemical_entities:
  - preferred_term: polyprenol
    term:
      id: CHEBI:26199
      label: polyprenol
    modifier: INCREASED
  - preferred_term: dolichol
    term:
      id: CHEBI:16091
      label: dolichol
    modifier: DECREASED
  evidence:
  - reference: PMID:38948797
    reference_title: "The N-glycosylation defect in Lec5 and Lec9 CHO cells is caused by absence of the DHRSX gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Both cell lines showed increased levels of polyprenol and its derivatives, concomitant with decreased levels of dolichol and derivatives, but no change in polyprenal levels, suggesting DHRSX deficiency."
    explanation: Documents the polyisoprenoid profile of DHRSX deficiency, including the unchanged polyprenal that localizes the block.

- name: Defective Lipid-Linked Oligosaccharide Maturation
  description: >-
    Dolichol-phosphate is rate-limiting for N-glycosylation because
    dolichol-phosphate sugars are used at seven steps of LLO assembly. DPAGT1
    (which transfers GlcNAc-1-P onto Dol-P), DPM synthase, and ALG3 (which adds
    the sixth mannose) are all markedly inefficient when handed the
    polyprenol-linked analogue instead. The LLO therefore stalls as an immature
    linear Man-5 species, with Man-4 arising downstream through EDEM3.
  biological_scale: MOLECULAR
  downstream:
  - target: Protein Hypoglycosylation
    causal_link_type: DIRECT
    description: >-
      The stalled immature LLO is transferred to nascent glycoproteins rather
      than being completed first — shown directly by castanospermine treatment,
      which distinguishes an immature transferred glycan from an over-trimmed
      mature one.
    evidence:
    - reference: PMID:38821050
      reference_title: "A pseudoautosomal glycosylation disorder prompts the revision of dolichol biosynthesis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "consistent with a direct transfer from linear Man-5 LLOs to nascent glycoproteins"
      explanation: The castanospermine experiment establishes that immature glycans are transferred, rather than mature glycans being trimmed back.
  biological_processes:
  - preferred_term: dolichol-linked oligosaccharide biosynthetic process
    term:
      id: GO:0006488
      label: dolichol-linked oligosaccharide biosynthetic process
    modifier: DECREASED
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  evidence:
  - reference: PMID:38821050
    reference_title: "A pseudoautosomal glycosylation disorder prompts the revision of dolichol biosynthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The availability of dolichol-phosphate is rate-limiting for N-glycosylation, since dolichol-phosphate sugars are used in seven steps during the formation of the LLO."
    explanation: Explains why a shortfall of dolichol-phosphate is sufficient to compromise LLO assembly.
  - reference: PMID:38821050
    reference_title: "A pseudoautosomal glycosylation disorder prompts the revision of dolichol biosynthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The N-linked oligosaccharides obtained from DHRSX and SRD5A3 deficient cells showed an increase in Man5GlcNAc2 species (Man-5) and Man4GlcNAc2 species (Man-4) alongside a reduction in Man9GlcNAc2 species (Man-9)."
    explanation: Documents the specific immature glycan signature produced by DHRSX deficiency.

- name: Protein Hypoglycosylation
  description: >-
    Underglycosylation of N-glycoproteins, detected clinically as a type I serum
    transferrin isoelectric focusing profile and experimentally as increased
    electrophoretic mobility of LAMP2. Notably the transferrin abnormality is not
    a reliable marker in every patient: one patient's profile normalized at 17
    months and a fourth patient's was normal throughout, so a normal transferrin
    IEF does not exclude this diagnosis.
  biological_scale: CELLULAR
  downstream:
  - target: Abnormal facial shape
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Profound intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Sensorineural hearing impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
    modifier: DECREASED
  evidence:
  - reference: PMID:38821050
    reference_title: "A pseudoautosomal glycosylation disorder prompts the revision of dolichol biosynthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients 1, 2, and 3 showed changes in transferrin profiles indicative of a defect in the attachment of N-glycans in the ER (i.e., a CDG type I)."
    explanation: Documents the type I transferrin profile establishing an ER-level N-glycan attachment defect in patients.
  - reference: PMID:38821050
    reference_title: "A pseudoautosomal glycosylation disorder prompts the revision of dolichol biosynthesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Increased mobility indicating a glycosylation defect was observed in DHRSX KO cells. Complementation by re-expression of wild-type DHRSX restored the normal migration pattern of LAMP2"
    explanation: Shows the hypoglycosylation is caused by DHRSX loss, since re-expression corrects it.


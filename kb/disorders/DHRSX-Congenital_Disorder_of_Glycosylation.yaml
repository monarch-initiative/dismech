    directness: INDIRECT
    snippet: "These individuals also experienced severe failure to thrive (requiring tube feeding); variable respiratory insufficiency; and involvement of the eyes, the gastrointestinal system, and other organs"
    explanation: >-
      Indirect. The abstract-level sentence records involvement of the
      gastrointestinal system and other organs, from which hepatic involvement
      follows. The per-patient detail identifying it as hepatosplenomegaly in

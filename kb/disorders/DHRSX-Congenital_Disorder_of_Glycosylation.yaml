name: DHRSX-Congenital Disorder of Glycosylation
creation_date: "2026-09-01T00:00:00Z"
category: Mendelian
description: >-
  DHRSX-CDG (congenital disorder of glycosylation type 1DD) is a type I
  congenital disorder of glycosylation caused by biallelic missense variants in
  DHRSX. Two things make it unusual. First, its inheritance is
  pseudoautosomal-recessive: DHRSX lies in pseudoautosomal region 1, present on
  both the X and the Y chromosome, so the gene behaves autosomally despite its
  sex-chromosome location. Second, identifying the disease rewrote a textbook
  pathway. Dolichol had been thought to be made directly from polyprenol by
  SRD5A3; the work describing these patients showed instead that the conversion
  takes three steps, with DHRSX performing the first and third — acting as an
  NAD+-dependent dehydrogenase and, non-consecutively, as an NADPH-dependent
  reductase — and SRD5A3 only the second. Losing DHRSX raises the
  polyprenol-to-dolichol ratio, and because polyprenol-phosphate is a poor
  substrate for DPAGT1, DPM synthase, and ALG3, the lipid-linked oligosaccharide
  fails to mature and immature glycans are transferred to nascent proteins. Four
  individuals from three families have been described, with distinct facial
  features, severe neurological involvement, profound sensorineural hearing loss
  with absent cochlear and vestibular nerves, and severe failure to thrive.
parents:
- hereditary disease
- congenital disorder of glycosylation
- inborn error of dolichol metabolism

- name: Antiepileptic Pharmacotherapy
  description: >-
    For the epilepsy present in three of the four individuals. No agent-specific
    guidance exists for this disorder.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy

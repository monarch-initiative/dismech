- name: Gastrostomy Feeding
  description: >-
    All four individuals had severe failure to thrive and all four required
    gastrostomy tube feeding, making this the most consistently applied
    intervention in the reported cohort.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: gastrostomy placement
    term:
      id: NCIT:C52006
      label: Gastrostomy
  target_mechanisms:
  - target: Failure to thrive
    description: >-
      Bypasses oral feeding failure; it does not address the glycosylation
      defect.
  evidence:
  - reference: PMID:38821050
    reference_title: "A pseudoautosomal glycosylation disorder prompts the revision of dolichol biosynthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These individuals also experienced severe failure to thrive (requiring tube feeding)"
    explanation: Records that tube feeding was required in the reported individuals.

- name: Non-Invasive Ventilation
  description: >-

genetic:
- name: DHRSX
  notes: >-
    Biallelic missense variants in DHRSX (NM_145177.3), encoding a
    dehydrogenase/reductase with dual NAD+-dependent dehydrogenase and
    NADPH-dependent reductase activity in dolichol biosynthesis. Reported alleles
    are c.146C>T p.(Thr49Met), c.541G>T p.(Val181Phe), and c.643C>T
    p.(Leu215Phe). The gene lies in pseudoautosomal region 1, so it is present on
    both sex chromosomes and inherited as if autosomal. The variants are
    predicted to disrupt NAD(P)+ cofactor binding or substrate access rather than
    protein abundance.
  gene_term:
    preferred_term: DHRSX
    term:
      id: hgnc:18399
      label: DHRSX
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:38821050
    reference_title: "A pseudoautosomal glycosylation disorder prompts the revision of dolichol biosynthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report a pseudoautosomal-recessive disease presenting as a congenital disorder of glycosylation in patients with missense variants in DHRSX (DHRSX-CDG)"
    explanation: Establishes DHRSX as the causal gene and names the disorder.

biochemical:
- name: Serum transferrin isoelectric focusing
  biomarker_term:
    preferred_term: Type I serum transferrin isoform profile
    term:
      id: HP:0003642
      label: Type I transferrin isoform profile
  presence: Type 1 pattern
  notes: >-
    A CDG type I transferrin pattern was present in three of four patients, but
    it is not dependable: one patient's profile normalized at 17 months of age
    and his brother's was normal throughout. A normal transferrin IEF therefore
    does not exclude DHRSX-CDG, which matters because transferrin IEF is the
    standard first-line CDG screen.
  evidence:
  - reference: PMID:38821050
    reference_title: "A pseudoautosomal glycosylation disorder prompts the revision of dolichol biosynthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the transferrin glycosylation profile of patient 3 normalized at 17 months of age and was normal in his brother, patient 4."
    explanation: Documents the limits of transferrin IEF as a screening test in this disorder.

experimental_models:
- name: DHRSX knockout HAP1 cells
  experimental_model_type: CELL_LINE
  description: >-
    Near-haploid human leukemia HAP1 cells with DHRSX knocked out, used with
    LAMP2 electrophoretic mobility as the glycosylation readout and wild-type
    DHRSX re-expression as the rescue arm.
  modeled_mechanisms:
  - target: Protein Hypoglycosylation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the N-glycosylation defect and, through complementation,
      demonstrates that DHRSX loss is its cause rather than a correlate.
    limitations: >-
      A complete knockout in a leukemia-derived near-haploid line, whereas
      patients carry hypomorphic missense alleles; it therefore establishes the
      pathway but not the residual activity of any patient allele, and it cannot
      model the neurological phenotype.
    readouts:
    - name: LAMP2 electrophoretic mobility
      target: Protein Hypoglycosylation
      direction: RESTORED
      interpretation: >-
        Increased LAMP2 mobility indicates hypoglycosylation in DHRSX KO cells;
        re-expression of wild-type DHRSX restores normal migration.
      evidence:
      - reference: PMID:38821050
        reference_title: "A pseudoautosomal glycosylation disorder prompts the revision of dolichol biosynthesis."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Increased mobility indicating a glycosylation defect was observed in DHRSX KO cells. Complementation by re-expression of wild-type DHRSX restored the normal migration pattern of LAMP2"
        explanation: Reports the LAMP2 mobility measurement and its rescue in this model.

- name: CHO Lec5 and Lec9 glycosylation mutants
  experimental_model_type: CELL_LINE
  description: >-
    Chinese hamster ovary lectin-resistance mutants isolated decades ago with a
    known but unexplained block in polyprenol-to-dolichol conversion. Once DHRSX
    was described, both were shown to lack the DHRSX genomic region, closing a
    long-standing gap. They are a natural-experiment model of complete DHRSX
    deficiency, and their pre-existing characterization independently corroborates
    the pathway.
  modeled_mechanisms:
  - target: Impaired Dolichol Synthesis from Polyprenol
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Both lines show the DHRSX-deficiency polyisoprenoid signature and loss of
      the two DHRSX enzymatic activities with SRD5A3 activity intact, and both
      are corrected by human DHRSX but not by SRD5A3.
    limitations: >-
      A rodent cell line carrying a genomic deletion, not a patient-derived model
      or a patient genotype; it speaks to the biochemistry and not to the
      clinical phenotype.
    readouts:
    - name: Polyprenol dehydrogenase and dolichal reductase activity in membranes
      target: Impaired Dolichol Synthesis from Polyprenol
      direction: ABOLISHED
      interpretation: >-
        Both DHRSX activities are absent while the SRD5A3-catalysed step is
        unaffected, localizing the block to the DHRSX-catalysed reactions.
      evidence:
      - reference: PMID:38948797
        reference_title: "The N-glycosylation defect in Lec5 and Lec9 CHO cells is caused by absence of the DHRSX gene."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "the typical polyprenol dehydrogenase and dolichal reductase activities of DHRSX were absent in membrane preparations derived from Lec5 and Lec9 cells, while the reduction of polyprenal to dolichal, catalyzed by SRD5A3, was unaffected"
        explanation: Reports the enzyme activity measurements distinguishing the DHRSX steps from the SRD5A3 step.
    - name: N-glycan synthesis after DHRSX versus SRD5A3 complementation
      target: Impaired Dolichol Synthesis from Polyprenol
      direction: RESTORED
      interpretation: >-
        Correction by human DHRSX but not by SRD5A3 assigns the defect
        specifically to DHRSX.
      evidence:
      - reference: PMID:38948797
        reference_title: "The N-glycosylation defect in Lec5 and Lec9 CHO cells is caused by absence of the DHRSX gene."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "N-glycan synthesis and changes in polyisoprenoid levels were corrected by complementation with human DHRSX but not with SRD5A3"
        explanation: Reports the discriminating complementation result.
    evidence:
    - reference: PMID:38948797
      reference_title: "The N-glycosylation defect in Lec5 and Lec9 CHO cells is caused by absence of the DHRSX gene."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Long-read whole genome sequencing of Lec5 and Lec9 cells did not reveal mutations in the ORF of SRD5A3, but the genomic region containing DHRSX was absent."
      explanation: Establishes that these long-studied mutants are DHRSX-deficient, making them a valid model of the human lesion.

treatments:
- name: Supportive and Multidisciplinary Care
  description: >-
    No disease-modifying therapy exists. Management is supportive: gastrostomy
    feeding for failure to thrive, non-invasive ventilation for obstructive sleep
    apnea and respiratory insufficiency, antiepileptic drugs, and orthopedic
    management of scoliosis and contractures. Note that the sensorineural hearing
    loss is associated with absent cochlear nerves in some individuals, which is
    the relevant consideration for whether cochlear implantation is an option.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care


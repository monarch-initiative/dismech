- category: Ophthalmologic
  name: Cataract
  subtype: NALD-IRD
  description: >-
    Lens opacity, one of the ocular abnormalities the Zellweger spectrum management literature
    groups with retinopathy and glaucoma as typical and often missed at first presentation.
    Band-level rather than PEX2-observed; it is recorded because it is part of the
    ophthalmologic examination a child with this diagnosis is entered into surveillance for.
  phenotype_term:
    preferred_term: Cataract
    term:
      id: HP:0000518
      label: Cataract
  evidence:

- category: Neurologic
  name: Leukodystrophy
  subtype: NALD-IRD
  description: >-
    Progressive white-matter disease, one of the three neurologic involvements GeneReviews
    names for the intermediate and milder band. It is scoped to the NALD-IRD subtype on
    purpose and is the feature that most sharply separates the two subtypes of this entry: the
    ataxic form is defined in part by its absence, with both reported PEX2 families showing
    cerebellar atrophy and explicitly normal white matter on MRI. Band-level rather than
    PEX2-observed.
  phenotype_term:
    preferred_term: Leukodystrophy
    term:
      id: HP:0002415
      label: Leukodystrophy
  evidence:
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Individuals with intermediate/milder ZSD do not have congenital malformations, but

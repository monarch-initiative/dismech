- category: Renal
  name: Calcium oxalate nephrolithiasis
  subtype: NALD-IRD
  description: >-
    Renal stones of calcium oxalate, reflecting loss of the peroxisomal glyoxylate
    detoxification that is also lost in primary hyperoxaluria type 1. Band-level rather than
    PEX2-observed; it is the reason an annual urine oxalate-to-creatinine ratio belongs in the

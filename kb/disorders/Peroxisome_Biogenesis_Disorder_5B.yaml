    reference_title: "Zellweger spectrum disorders: clinical overview and management approach."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Sensorineural deafness and ocular abnormalities like retinopathy, cataracts and glaucoma

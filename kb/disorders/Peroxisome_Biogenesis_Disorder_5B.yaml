name: Peroxisome Biogenesis Disorder 5B
creation_date: "2026-09-26T00:00:00Z"
category: Mendelian
description: >-
  Peroxisome biogenesis disorder 5B is the milder, non-Zellweger band of the PEX2 allelic
  series. The gene and the lesion are the same as in peroxisome biogenesis disorder 5A;
  what separates the two is how much peroxin-2 function the genotype leaves. Peroxin-2 is
  an integral peroxisomal membrane protein whose cytosolic C-terminal RING finger works
  with peroxin-10 and peroxin-12 as the ubiquitin ligase that recycles the PTS1 receptor
  PEX5, so a genotype retaining partial peroxin-2 activity leaves matrix-protein import
  reduced rather than abolished, and with it very-long-chain fatty acid beta-oxidation,
  branched-chain fatty acid oxidation, bile-acid synthesis and plasmalogen synthesis.

  The cellular correlate of that partial import defect has been worked out at this locus
  specifically, and it is what makes PEX2 a useful model of the mild band. Fibroblasts from
  mildly affected patients carry peroxisomal mosaicism - some cells with import-competent
  peroxisomes, some without - and a population of partially functional organelles that
  import the PTS1 enzymes but not catalase, named catalase-less peroxisomes by the group
  that characterised them. The PEX2 E55K allele found in an infantile Refsum disease
  patient reproduces that behaviour when transfected into a PEX2-null cell line, and it is
  temperature-sensitive: the peroxisomes are absent at 37 degrees and recovered at 30.

  Clinically this entry holds everything PEX2 does short of classic Zellweger syndrome, and
  the published patients fall into two groups that are not equally evidenced. The better
  documented is a childhood-onset, slowly progressive cerebellar ataxia with cerebellar
  atrophy, axonal sensorimotor polyneuropathy and areflexia, in patients who reach adult
  life - two brothers with onset at three and a half and eighteen years, and an Italian man
  still ambulant and cognitively intact at fifty-one. The other is the older neonatal
  adrenoleukodystrophy and infantile Refsum disease presentation, which at this locus rests
  on a small number of individually reported patients.

  The diagnostically consequential fact is biochemical. In the ataxic patients plasma
  very-long-chain fatty acids were nearly normal and it was a moderate rise in phytanic and
  pristanic acid that prompted the peroxisomal work-up; fibroblast beta-oxidation,
  plasmalogen synthesis and DHAPAT activity were normal. A normal very-long-chain fatty
  acid screen therefore does not exclude this diagnosis, and the route to it is sequencing.
synonyms:
- PBD5B
- peroxisome biogenesis disorder type 5B
- PEX2-related neonatal adrenoleukodystrophy
- PEX2-related infantile Refsum disease
- PEX2-related cerebellar ataxia
- attenuated PEX2-related Zellweger spectrum disorder

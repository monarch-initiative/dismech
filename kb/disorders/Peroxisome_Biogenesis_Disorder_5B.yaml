    notes: >-
      An autosomal recessive Mendelian disorder of organelle assembly, reached historically
      through complementation grouping - group F in the Japanese series, CG10 in the North
      American one - and then through identification of the gene.
  - classification_value: ENDOCRINOLOGY_METABOLISM
    notes: >-
      Also an inborn error of metabolism. At this end of the allelic series the biochemical
      signature is attenuated rather than absent, which is what makes it easy to miss.

- category: Ophthalmologic
  name: Strabismus
  subtype: Ataxic form
  description: Strabismus, one of the four presenting features in the reported adult patient.
  phenotype_term:
    preferred_term: Strabismus
    term:
      id: HP:0000486
      label: Strabismus
  evidence:
  - reference: PMID:23430938
    reference_title: "Zellweger Spectrum Disorder with Mild Phenotype Caused by PEX2 Gene Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 51-year-old Italian man was referred to us because of a clinical picture
      characterized by ataxia, areflexia, nystagmus, and strabismus, with childhood onset
      and slowly progressive course.
    explanation: Strabismus named among the presenting features.
- category: Otologic
  name: Sensorineural hearing impairment
  description: >-
    Sensorineural hearing loss, which at this end of the spectrum is late and acquired rather
    than congenital: audiometry and brainstem auditory evoked potentials were normal in both
    brothers into the mid-teens, and hearing loss appeared in the Italian patient between the
    third and fifth decades. It is deliberately left unscoped by subtype, because it belongs
    both to the ataxic form on the strength of that patient and to the neonatal
    adrenoleukodystrophy / infantile Refsum presentation on the strength of the
    spectrum-general literature.
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:23430938
    reference_title: "Zellweger Spectrum Disorder with Mild Phenotype Caused by PEX2 Gene Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Between the third and the fifth decades, bilateral hypoacusia and initial retinopathy were detected."
    explanation: >-
      The only PEX2-specific dating of the sensory loss in this entry, and the basis for
      calling it late and progressive rather than congenital.
  - reference: PMID:14630978
    reference_title: "Novel mutations in the PEX2 gene of four unrelated patients with a peroxisome biogenesis disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Common to PBDs are liver disease, variable neurodevelopmental delay, retinopathy and perceptive deafness."
    explanation: >-
      The class-level statement, quoted from the paper that reported the mildly affected
      complementation group 10 patient. It is a statement about peroxisome biogenesis
      disorders generally, not about this severity band, and is used only to place hearing
      loss among the expected features.
- category: Ophthalmologic
  name: Retinal dystrophy
  description: >-
    Retinopathy, also late in the ataxic form: fundoscopy and electroretinography were normal
    in both brothers at nine and fourteen years, and retinopathy was first detected in the
    Italian patient between the third and fifth decades. Like the hearing loss, it is left
    unscoped by subtype.
  phenotype_term:
    preferred_term: Retinal dystrophy
    term:
      id: HP:0000556
      label: Retinal dystrophy
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:23430938
    reference_title: "Zellweger Spectrum Disorder with Mild Phenotype Caused by PEX2 Gene Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Between the third and the fifth decades, bilateral hypoacusia and initial retinopathy were detected."
    explanation: >-
      The PEX2-specific observation, and the reason the binding carries a progressive course.
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Individuals with intermediate/milder ZSD do not have congenital malformations, but
      rather progressive peroxisome dysfunction variably manifest as sensory loss (secondary
      to retinal dystrophy and sensorineural hearing loss), neurologic involvement (ataxia,
      polyneuropathy, and leukodystrophy), liver dysfunction, adrenal insufficiency, and
      renal oxalate stones.
    explanation: >-
      GeneReviews' account of sensory loss in the band this entry occupies. Spectrum-general
      rather than PEX2-specific, and marked OTHER because GeneReviews is an expert synthesis
      rather than a primary study.
- category: Neurologic
  name: Cognitive impairment
  description: >-
    Cognition is normal or near-normal across the reported PEX2 mild-band patients, and this
    record exists to say so rather than to assert a deficit. Full-scale IQ was 75 and 80 in
    the two brothers - the lower end of the normal range - and the adult patient had no
    cognitive impairment at fifty-one. A clinician using preserved intellect to exclude a
    peroxisome biogenesis disorder would be wrong; that is the diagnostic point.
  phenotype_term:
    preferred_term: Cognitive impairment
    term:
      id: HP:0100543
      label: Cognitive impairment
  evidence:
  - reference: PMID:23430938
    reference_title: "Zellweger Spectrum Disorder with Mild Phenotype Caused by PEX2 Gene Mutations."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Dysmorphic features, cognitive impairment, and seizures were absent."
    explanation: >-
      A recorded negative in the oldest reported patient. Marked REFUTE because it
      contradicts the claim that cognitive impairment is a feature of this entry, which is
      what this phenotype record exists to settle.
  - reference: PMID:21392394
    reference_title: "Autosomal recessive cerebellar ataxia caused by mutations in the PEX2 gene."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He had truncal ataxia, moderate cerebellar tremor, mild scanning dysarthria, nystagmus,
      slow saccades without oculo-motor apraxia and hyporeflexia. His total ataxia score
      evaluated by the International Cooperative Ataxia Rating Scale (ICARS) was 17/100. He
      had no other neurological symptoms and his physical examination was normal. Cerebellar
      ataxia exacerbated slowly up to the age of 14 years but he was still able to walk
      without support. The ICARS score was 33/100. No other neurological signs were present
      and cognitive function remained normal.
    explanation: >-
      Cognitive function explicitly preserved over five years of follow-up in the younger
      brother, despite his ataxia score doubling. Quoted at length because the contrast
      between the two trajectories in one patient is the point.
- category: Hepatic
  name: Hepatic dysfunction
  subtype: NALD-IRD
  description: >-
    Liver disease, which across the Zellweger spectrum ranges from raised transaminases and
    coagulopathy to fibrosis and cirrhosis. It is not reported in any of the three PEX2
    mild-band patients curated here - liver enzymes were explicitly normal in the younger of
    the two ataxic brothers - so this record states an expected complication of the band
    rather than an observed PEX2 feature.
  phenotype_term:
    preferred_term: Liver dysfunction
    term:
      id: HP:0001410
      label: Decreased liver function
  evidence:
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Individuals with intermediate/milder ZSD do not have congenital malformations, but
      rather progressive peroxisome dysfunction variably manifest as sensory loss (secondary
      to retinal dystrophy and sensorineural hearing loss), neurologic involvement (ataxia,
      polyneuropathy, and leukodystrophy), liver dysfunction, adrenal insufficiency, and
      renal oxalate stones.
    explanation: >-
      GeneReviews' description of the band this subtype occupies. It is a statement about the
      intermediate and milder Zellweger spectrum as a whole, not about PEX2, and no PEX2
      patient in the sources cited here is reported with this feature - which is why the
      record is scoped to the NALD-IRD subtype and carries no frequency.
- category: Endocrine
  name: Adrenal insufficiency
  subtype: NALD-IRD
  description: >-
    Adrenocortical insufficiency. As with the liver disease, this is the band-level
    expectation that drives surveillance - annual ACTH and cortisol from the first year of
    life - and not an observed finding in any PEX2 mild-band patient cited here.
  phenotype_term:
    preferred_term: Adrenal insufficiency
    term:
      id: HP:0000846
      label: Adrenal insufficiency
  evidence:
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-

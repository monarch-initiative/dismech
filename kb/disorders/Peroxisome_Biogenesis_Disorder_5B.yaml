phenotypes:
- category: Neurologic
  name: Ataxia
  subtype: Ataxic form
  description: >-
    Cerebellar ataxia, the presenting and dominant feature of this entry's better documented
    subtype. Onset is in childhood in two of the three reported patients - three and a half
    years in one brother, three years in the Italian patient - and in adolescence in the
    third, at eighteen. Progression is slow enough that the brothers were walking unaided at
    fourteen and the Italian patient was ambulant at fifty-one.
  phenotype_term:
    preferred_term: Cerebellar ataxia
    term:
      id: HP:0001251
      label: Ataxia
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:21392394
    reference_title: "Autosomal recessive cerebellar ataxia caused by mutations in the PEX2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two brothers are described who developed progressive cerebellar ataxia at 3 1/2 and 18 years, respectively."
    explanation: >-
      Both the age range and the progressive course recorded on this binding, in the founding
      report of the presentation.
  - reference: PMID:21392394
    reference_title: "Autosomal recessive cerebellar ataxia caused by mutations in the PEX2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cerebellar ataxia exacerbated slowly up to the age of 14 years but he was still able to
      walk without support.
    explanation: >-
      The rate of progression in the younger brother, quoted because "slowly progressive" is
      a claim the entry makes repeatedly and this is the sentence that measures it.
- category: Neurologic
  name: Cerebellar atrophy
  subtype: Ataxic form
  description: >-
    Cerebellar atrophy on MRI, in the reported patients involving the vermis and the lateral
    hemispheres and, in the oldest, the cerebellar peduncles and bulbar olives. White matter
    is spared, which is the imaging finding that separates this entry from the
    leukodystrophic presentations of the spectrum.
  phenotype_term:
    preferred_term: Cerebellar atrophy
    term:
      id: HP:0001272
      label: Cerebellar atrophy
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:23430938
    reference_title: "Zellweger Spectrum Disorder with Mild Phenotype Caused by PEX2 Gene Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain MRI revealed marked atrophy of the subtentorial regions including cerebellum,
      cerebellar peduncles, and bulbar olives, and showed moderate atrophy of the
      supratentorial regions of the brain
    explanation: >-
      The fullest description of the imaging phenotype, in the oldest reported patient. Note
      that it extends beyond the cerebellum, which the younger patients' scans did not.
  - reference: PMID:21392394
    reference_title: "Autosomal recessive cerebellar ataxia caused by mutations in the PEX2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At the age of 9 years, a brain MRI showed atrophy of the vermis and lateral hemispheres
      of the cerebellum that worsened at the age of 14 years, but without signs of
      demyelination or neuronal migration defects in forebrain and cerebellum
    explanation: >-
      Serial imaging in the same child, which is the basis for the PROGRESSIVE course on this
      binding rather than an inference from the clinical course.
- category: Neurologic
  name: Dysarthria
  subtype: Ataxic form
  description: >-
    Cerebellar dysarthria. In the younger brother it was the first noticed sign, at about
    two and a half years, a year before the gait disturbance.
  phenotype_term:
    preferred_term: Dysarthria
    term:
      id: HP:0001260
      label: Dysarthria
  evidence:
  - reference: PMID:21392394
    reference_title: "Autosomal recessive cerebellar ataxia caused by mutations in the PEX2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "His milestones were normal but mild dysarthria was noticed at 2 1/2 years."
    explanation: >-
      The earliest recorded sign in any patient in this entry, and the pediatric point that
      normal early milestones do not exclude it.
  - reference: PMID:23430938
    reference_title: "Zellweger Spectrum Disorder with Mild Phenotype Caused by PEX2 Gene Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neurological examination revealed gait ataxia, dysarthria, dysmetria, areflexia, and
      bilateral pes cavus.
    explanation: An unrelated adult patient with the same sign.
- category: Neurologic
  name: Dysmetria
  subtype: Ataxic form
  description: Limb dysmetria, part of the cerebellar syndrome in both reported families.
  phenotype_term:
    preferred_term: Dysmetria
    term:
      id: HP:0001310
      label: Dysmetria
  evidence:
  - reference: PMID:23430938
    reference_title: "Zellweger Spectrum Disorder with Mild Phenotype Caused by PEX2 Gene Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neurological examination revealed gait ataxia, dysarthria, dysmetria, areflexia, and
      bilateral pes cavus.
    explanation: The examination finding in the reported adult patient.
- category: Neurologic
  name: Nystagmus
  subtype: Ataxic form
  description: >-
    Gaze-evoked nystagmus in the adult patient, and nystagmus with slow saccades in the
    younger of the two brothers. Reported with oculomotor apraxia in the older brother,
    which is a differential-diagnostic trap because it points towards the ataxias with
    oculomotor apraxia.
  phenotype_term:
    preferred_term: Nystagmus
    term:
      id: HP:0000639
      label: Nystagmus
  evidence:
  - reference: PMID:23430938
    reference_title: "Zellweger Spectrum Disorder with Mild Phenotype Caused by PEX2 Gene Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On admission to our Department, neurological examination showed gait ataxia, lateral
      and vertical gaze-evoked nystagmus, hypoacusia, mild dysarthria, slight dysmetria,
      generalized areflexia, and bilateral pes cavus.
    explanation: The oculomotor findings in the adult patient.
  - reference: PMID:21392394
    reference_title: "Autosomal recessive cerebellar ataxia caused by mutations in the PEX2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He had truncal ataxia, moderate cerebellar tremor, mild scanning dysarthria,
      nystagmus, slow saccades without oculo-motor apraxia and hyporeflexia.
    explanation: >-
      The same sign in an unrelated child, with the explicit note that oculomotor apraxia was
      absent - the older brother's had it, so the sign is inconsistent within one family.
- category: Neurologic
  name: Areflexia
  subtype: Ataxic form
  description: >-
    Generalised loss of tendon reflexes in the adult patient; hyporeflexia rather than
    areflexia in the two brothers. The combination of cerebellar ataxia with reduced reflexes
    is the clinical signature the reporting authors propose as the trigger for peroxisomal
    testing.
  phenotype_term:
    preferred_term: Areflexia
    term:
      id: HP:0001284
      label: Areflexia
  evidence:
  - reference: PMID:23430938
    reference_title: "Zellweger Spectrum Disorder with Mild Phenotype Caused by PEX2 Gene Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 51-year-old Italian man was referred to us because of a clinical picture
      characterized by ataxia, areflexia, nystagmus, and strabismus, with childhood onset
      and slowly progressive course.
    explanation: >-
      Areflexia named as one of the four cardinal features of the reported presentation.
- category: Neurologic
  name: Peripheral axonal neuropathy
  subtype: Ataxic form
  description: >-
    Axonal sensorimotor polyneuropathy on nerve conduction studies. It is not obligatory and
    it appears late: nerve conduction was normal in both brothers at nine, fourteen and
    eighteen years, and severe in the patient studied at fifty-one.
  phenotype_term:
    preferred_term: Axonal sensorimotor polyneuropathy
    term:
      id: HP:0003477
      label: Peripheral axonal neuropathy
  evidence:
  - reference: PMID:23430938
    reference_title: "Zellweger Spectrum Disorder with Mild Phenotype Caused by PEX2 Gene Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nerve conduction studies indicated a severe axonal sensorimotor polyneuropathy."
    explanation: The electrophysiological finding this binding records.
- category: Musculoskeletal
  name: Pes cavus
  subtype: Ataxic form
  description: Bilateral pes cavus in the adult patient with the severe axonal neuropathy.
  phenotype_term:
    preferred_term: Pes cavus
    term:
      id: HP:0001761
      label: Pes cavus
  evidence:
  - reference: PMID:23430938
    reference_title: "Zellweger Spectrum Disorder with Mild Phenotype Caused by PEX2 Gene Mutations."

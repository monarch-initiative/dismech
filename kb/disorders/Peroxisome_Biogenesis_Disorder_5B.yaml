has_subtypes:
- name: Ataxic form
  display_name: PEX2-related cerebellar ataxia (childhood-onset ataxic form)
  subtype_term:
    preferred_term: autosomal recessive ataxia due to PEX2 deficiency
    term:
      id: MONDO:0957443
      label: autosomal recessive ataxia due to PEX2 deficiency
  description: >-
    Childhood-onset, slowly progressive cerebellar ataxia with cerebellar atrophy on MRI,
    axonal sensorimotor polyneuropathy and generalised areflexia, in individuals who reach
    adult life with normal or near-normal intellect. This is the best documented PEX2 mild
    presentation: two brothers reported in 2011 and an unrelated man reported in 2012 who
    shares one of their alleles.
  genes:
  - preferred_term: PEX2
    term:
      id: hgnc:9717
      label: PEX2
  evidence:
  - reference: PMID:21392394
    reference_title: "Autosomal recessive cerebellar ataxia caused by mutations in the PEX2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two brothers are described who developed progressive cerebellar ataxia at 3 1/2 and 18 years, respectively."
    explanation: >-
      The founding report of this presentation, and the source of both its age range and
      its progressive course. Two brothers is the whole of that report, and the reader
      should hold that denominator against every statement made about this subtype.
  - reference: PMID:23430938
    reference_title: "Zellweger Spectrum Disorder with Mild Phenotype Caused by PEX2 Gene Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 51-year-old Italian man was referred to us because of a clinical picture
      characterized by ataxia, areflexia, nystagmus, and strabismus, with childhood onset
      and slowly progressive course.
    explanation: >-
      An unrelated patient with the same presentation, and the one that establishes
      survival to middle age at this locus.
  - reference: ORPHA:642965
    reference_title: "Autosomal recessive ataxia due to PEX2 deficiency"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A rare genetic, peroxisomal disease characterized by childhood or adolescence onset
      slowly progressing cerebellar ataxia and severe axonal sensorimotor polyneuropathy due
      to PEX 2 deficieny.
    explanation: >-
      Orphanet recognises this presentation as a named entity and defines it in terms that
      match the curated subtype: childhood or adolescent onset, slow progression, cerebellar
      ataxia with axonal sensorimotor polyneuropathy. Quoted with Orphanet's own typographical
      errors intact. Marked OTHER because an Orphanet record is a curated database entry
      rather than a study.
  - reference: ORPHA:642965
    reference_title: "Autosomal recessive ataxia due to PEX2 deficiency"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients develop marked brain atrophy including cerebellum, cerebellar peduncles, and
      bulbar olives. Gait disturbance, moderate truncal ataxia, moderate cerebellar tremor,
      mild dysarthria, areflexia, strabismus, hypoacusia and nystagmus were also reported.
    explanation: >-
      Orphanet's own feature list for the subtype, which is the independent check on the
      phenotype set curated here. It names every clinical feature this entry records for the
      ataxic form, and adds none this entry omits.
- name: NALD-IRD
  display_name: Neonatal adrenoleukodystrophy / infantile Refsum disease presentation
  description: >-
    The older phenotype labels for the intermediate and mild bands of the Zellweger
    spectrum: progressive peroxisomal failure with sensory loss, liver disease and
    developmental delay, without the congenital malformations of classic Zellweger syndrome.
    At the PEX2 locus this presentation rests on individually reported patients - the
    infantile Refsum disease patient carrying E55K opposite a nonsense allele, and the
    mildly affected homozygous W223X patient in the four-patient complementation group 10
    series - rather than on any assembled cohort.
  genes:
  - preferred_term: PEX2
    term:
      id: hgnc:9717
      label: PEX2
  evidence:
  - reference: PMID:10528859
    reference_title: "Defective PEX gene products correlate with the protein import, biochemical abnormalities, and phenotypic heterogeneity in peroxisome biogenesis disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a mutation in the PEX2 gene in an IRD patient with compound
      heterozygosity for a missense mutation and the known nonsense mutation detected in ZS
      patients.
    explanation: >-
      The infantile Refsum disease patient at this locus, and the genotype - one
      residual-function missense allele opposite an allele already known from the severe
      band - that defines the mild band.
  - reference: PMID:14630978
    reference_title: "Novel mutations in the PEX2 gene of four unrelated patients with a peroxisome biogenesis disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surprisingly, the patient lacking the domain had a mild phenotype, whereas the C247R patient had a severe phenotype."
    explanation: >-
      A second mildly affected PEX2 patient, and the authors' own surprise at the
      genotype-phenotype result, which is retained rather than smoothed over: the
      correlation between allele class and severity holds in general but is not mechanical.
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Individuals with intermediate/milder ZSD do not have congenital malformations, but
      rather progressive peroxisome dysfunction variably manifest as sensory loss
      (secondary to retinal dystrophy and sensorineural hearing loss), neurologic
      involvement (ataxia, polyneuropathy, and leukodystrophy), liver dysfunction, adrenal
      insufficiency, and renal oxalate stones.
    explanation: >-
      The GeneReviews characterisation of the band these older labels name. Quoted from the
      spectrum resource rather than from a PEX2 source because no PEX2 series describes this
      presentation in comparable detail; it is therefore a spectrum-general statement, not a
      PEX2-specific one.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No numeric prevalence is available for this entry, and none is asserted. The ataxic form
    rests on two brothers and one unrelated man; the neonatal adrenoleukodystrophy /
    infantile Refsum presentation on individually reported patients. No source cited here
    gives a rate, a denominator, or PEX2's share of the Zellweger spectrum. The PEX Gene
    Screen reports that the relative frequencies of the different PEX gene defects matched
    earlier complementation data, but publishes no PEX2 figure that could be quoted.
  evidence:
  - reference: PMID:15542397
    reference_title: "The PEX Gene Screen: molecular diagnosis of peroxisome biogenesis disorders in the Zellweger syndrome spectrum."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "The proportion of patients with different PEX gene defects correlated with frequencies previously identified by complementation analysis."
    explanation: >-
      Cited to record what the largest molecular series of the spectrum does and does not
      say. It reports that the gene-level proportions were as expected without giving a
      figure for PEX2, and it does not split its patients into severity bands at all, so it
      bears on neither the frequency nor the prevalence of this entry.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic PEX2 variants, and specifically genotypes leaving residual peroxin-2 function
    on at least one allele. The reported mild-band patients are either homozygous for a
    C-terminal frameshift that spares most of the protein, or compound heterozygous for a
    residual-function missense allele opposite a null allele that is itself known from
    classic Zellweger syndrome.
  evidence:
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      At conception, each sib of an individual with biallelic ZSD-causing pathogenic
      variants has a 25% chance of being affected, a 50% chance of being an asymptomatic
      carrier, and a 25% chance of being unaffected and not a carrier.
    explanation: >-
      The recurrence risk that genetic counselling for this entry turns on, stated for the
      spectrum as a whole. The quantitative risk is quoted rather than summarised because
      it is the sentence families are counselled from.
  - reference: PMID:21392394
    reference_title: "Autosomal recessive cerebellar ataxia caused by mutations in the PEX2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No mutation was found in P1 and P2 asymptomatic siblings, who had normal peroxisomal
      parameters in plasma and no neurologic symptoms.
    explanation: >-
      Recessive segregation worked through a sibship: two affected brothers homozygous for
      the allele, three unaffected siblings without it and biochemically normal.
  - reference: CGGV:assertion_17bf1c4a-1775-40c6-a499-774c93827343-2020-02-07T170000.000Z
    reference_title: "PEX2 / peroxisome biogenesis disorder (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PEX2 | HGNC:9717 | peroxisome biogenesis disorder | MONDO:0019234 | AR | Definitive"
    explanation: >-
      ClinGen's Peroxisomal Disorders expert panel records autosomal recessive inheritance
      for the locus. The assertion is made against the grouping concept MONDO:0019234
      rather than against this entry's MONDO:0013933, so it fixes the gene and the mode of
      inheritance and says nothing about the severity band.
pathophysiology:
- name: Biallelic PEX2 Genotype With Residual Peroxin-2 Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  conforms_to: "peroxisomal_metabolic_failure#Peroxisomal Biogenesis or Enzyme Defect"
  description: >-
    Both PEX2 alleles are altered, but the genotype as a whole leaves partial peroxin-2
    activity. Two configurations are reported at this end of the series: homozygosity for a
    frameshift so close to the stop codon that most of the protein survives
    (c.865_866insA, p.Ser289LysfsX36), and compound heterozygosity for a residual-function
    missense allele opposite a nonsense allele already known from classic Zellweger
    syndrome (E55K opposite R119X). The residual-function threshold, not gene identity, is
    what separates this entry from peroxisome biogenesis disorder 5A.
  genetic_context:
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: COMPOUND_HETEROZYGOUS
    gene:
      preferred_term: PEX2
      term:
        id: hgnc:9717
        label: PEX2
    description: >-
      COMPOUND_HETEROZYGOUS records the configuration of the reported E55K and R119X
      patients. It is not a requirement of the entry: the two ataxic brothers were
      apparently homozygous for a single C-terminal frameshift allele, and the mildly
      affected patient in the complementation group 10 series was homozygous for W223X.
  biological_processes:
  - preferred_term: peroxisome organization
    modifier: DECREASED
    term:
      id: GO:0007031
      label: peroxisome organization
  cellular_components:
  - preferred_term: peroxisomal membrane
    term:
      id: GO:0005778
      label: peroxisomal membrane
  evidence:
  - reference: PMID:10528859
    reference_title: "Defective PEX gene products correlate with the protein import, biochemical abnormalities, and phenotypic heterogeneity in peroxisome biogenesis disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These data suggest that allelic heterogeneity of the PEX gene affects the peroxisomal
      protein import and functions and regulates the clinical severity in PBD.
    explanation: >-
      The residual-function account that defines this entry against peroxisome biogenesis
      disorder 5A, stated by the study that made it at the PEX2 locus itself.
  - reference: PMID:40621817
    reference_title: "Distinguishing PEX2 and PEX16 gene variant severity for mild, severe and atypical peroxisome biogenesis disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      In general, clinical severity correlates to lower levels of residual PEX gene
      activity and much less to which PEX gene is involved (e.g. PEX16 vs PEX2 vs PEX3)
    explanation: >-
      States the residual-activity rule, and its corollary that the severity band matters
      more than which peroxin is affected. Graded HUMAN_CLINICAL with quote_role BACKGROUND
      because the sentence sits in the introduction of a Drosophila study and restates the
      human clinical correlation established elsewhere.
  - reference: PMID:21392394
    reference_title: "Autosomal recessive cerebellar ataxia caused by mutations in the PEX2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequencing of candidate PEX genes revealed a homozygous c.865_866insA mutation in the
      PEX2 gene leading to a frameshift 17 codons upstream of the stop codon.
    explanation: >-
      The homozygous mild-band genotype, and the structural reason it is mild: a frameshift
      seventeen codons from the end alters the C-terminus rather than removing the protein.
  downstream:
  - target: Partial Loss of Peroxin-2 RING Ubiquitin Ligase Function
    description: >-
      A residual-function PEX2 allele yields a peroxin-2 that reaches the peroxisomal
      membrane and retains part of its activity, rather than a protein that is absent or
      non-functional.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21392394
      reference_title: "Autosomal recessive cerebellar ataxia caused by mutations in the PEX2 gene."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The fact that peroxisomes in the patient's fibroblasts were normally present and
        contained catalase suggests that the mutated PEX2 is localized correctly in the
        peroxisomal membrane and still is partly active.
      explanation: >-
        The authors' inference that the mild allele yields a partly active, correctly
        localised protein. Their own "suggests" is preserved and the item is marked
        INDIRECT, because the claim is read off organelle morphology rather than from an
        activity measurement.
- name: Partial Loss of Peroxin-2 RING Ubiquitin Ligase Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Peroxin-2 is an integral peroxisomal membrane protein with two transmembrane domains
    and a cytosolic C-terminal zinc-binding RING finger. Together with peroxin-10 and
    peroxin-12 it forms the membrane-embedded ubiquitin ligase that ubiquitinates the PTS1
    receptor PEX5 so the receptor can be retrotranslocated and reused. Degrading that
    activity rather than abolishing it is the molecular difference between this entry and
    the severe band.
  molecular_functions:
  - preferred_term: ubiquitin-protein transferase activity
    modifier: DECREASED
    term:
      id: GO:0004842
      label: ubiquitin-protein transferase activity
  cellular_components:
  - preferred_term: peroxisomal membrane
    term:
      id: GO:0005778
      label: peroxisomal membrane
  evidence:
  - reference: PMID:14630978
    reference_title: "Novel mutations in the PEX2 gene of four unrelated patients with a peroxisome biogenesis disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PBD patients belonging to complementation group 10 (CG10) have mutations in the PEX2
      gene (PXMP3), which codes for a protein (PEX2) that contains two transmembrane domains
      and a zinc-binding domain considered to be important for its interaction with other
      proteins of the peroxisomal protein import machinery.
    explanation: >-
      The domain architecture this node asserts, from a PEX2 patient series rather than from
      a general review.
  - reference: PMID:21392394
    reference_title: "Autosomal recessive cerebellar ataxia caused by mutations in the PEX2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The PEX2, PEX10 and PEX12 genes encode peroxins that are integral peroxisomal membrane
      proteins with a cytosolic carboxy-terminal RING finger domain that act as ubiquitin
      ligases required for the ubiquitination of the PTS1-receptor (PEX5) in the peroxisomal
      membrane
    explanation: >-
      Names the ligase activity and its substrate. Graded HUMAN_CLINICAL with quote_role
      BACKGROUND: the sentence is the discussion's framing of established biochemistry
      rather than a result of the case report it sits in.
  - reference: PMID:35768507
    reference_title: "A peroxisomal ubiquitin ligase complex forms a retrotranslocation channel."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      Recycling requires receptor modification by a membrane-embedded ubiquitin ligase
      complex comprising three RING finger domain-containing proteins (Pex2, Pex10 and
      Pex12)
    explanation: >-
      The complex peroxin-2's RING domain belongs to, and what it does. INDIRECT because the
      structure was solved in a fungal system, so the human claim rests on conservation.
  - reference: PMID:10652207
    reference_title: "Molecular mechanism of detectable catalase-containing particles, peroxisomes, in fibroblasts from a PEX2-defective patient."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Furthermore, a defect in the C-terminal portion of Pex2p exposed to the cytosol
      containing a RING finger motif caused the mild phenotype, residual enzyme activities,
      and mosaic detectable peroxisomes in fibroblasts from the patient.
    explanation: >-
      The single sentence that ties the defining claims of this entry together at the PEX2
      locus: a C-terminal RING-region lesion, a mild clinical phenotype, residual enzyme
      activity, and peroxisomal mosaicism. It is also the structural account of why the
      c.865_866insA frameshift seventeen codons from the stop codon lands in this band.
  downstream:
  - target: Partial Failure of Peroxisomal Matrix Protein Import
    description: >-
      Degraded ligase activity slows PEX5 recycling, so matrix-protein import is reduced
      rather than abolished - the state that produces a mixed population of import-competent
      and import-incompetent organelles.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10528859
      reference_title: "Defective PEX gene products correlate with the protein import, biochemical abnormalities, and phenotypic heterogeneity in peroxisome biogenesis disorders."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we noted the E55K mutation had mosaic activities of peroxisomal protein import
        machinery and residual activities of peroxisomal functions, including
        dihydroxyacetone phosphate acyltransferase and beta oxidation of very long chain
        fatty acids
      explanation: >-
        The transfection experiment that ties a specific mild PEX2 allele to mosaic import
        and residual pathway activity, which is exactly what this edge asserts.
- name: Partial Failure of Peroxisomal Matrix Protein Import
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Matrix-protein import is reduced but not abolished. In patient fibroblasts this appears
    as peroxisomal mosaicism - some cells with normal peroxisomes, some with none, some
    mixed - and as a population of partially functional organelles that import the PTS1
    enzymes acyl-CoA oxidase and thiolase while leaving catalase in the cytosol, which the
    group that described them named catalase-less peroxisomes. In the PEX2 E55K case the
    defect is temperature-sensitive, recovering at a permissive temperature; in the Italian
    patient the mosaicism persisted at 40 degrees, so the temperature test does not detect
    every mild PEX2 genotype. The fibroblast bound below is the cell the defect was assayed
    in, not a claim about which cell drives the disease: the import machinery is ubiquitous
    and the tissue that fails clinically is the cerebellum.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: protein import into peroxisome matrix
    modifier: DECREASED
    term:
      id: GO:0016558
      label: protein import into peroxisome matrix
  cellular_components:
  - preferred_term: peroxisomal matrix
    term:
      id: GO:0005782
      label: peroxisomal matrix
  evidence:
  - reference: PMID:10960480
    reference_title: "Catalase-less peroxisomes. Implication in the milder forms of peroxisome biogenesis disorder."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Catalase-less peroxisomes were also observed in human fibroblasts from patients with
      milder forms of peroxisome biogenesis disorder, including the one from which the
      mutant PEX2 gene was derived.
    explanation: >-
      Establishes that the partially functional organelle characterised in the cell model is
      present in patient fibroblasts, including the PEX2 patient whose allele was used.
  - reference: PMID:23430938
    reference_title: "Zellweger Spectrum Disorder with Mild Phenotype Caused by PEX2 Gene Mutations."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Immunofluorescence microscopy analysis using antibodies raised against catalase, a
      peroxisomal matrix enzyme, revealed a heterogeneous pattern: some cells showed normal
      peroxisomes whereas in other cells peroxisomes were absent, and in yet other cells a
      mixed picture was observed.
    explanation: >-
      Peroxisomal mosaicism observed directly in a PEX2 patient's fibroblasts, which is the
      cellular claim of this node.
  - reference: PMID:11330043
    reference_title: "Temperature sensitivity in peroxisome assembly processes characterizes milder forms of peroxisome biogenesis disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO

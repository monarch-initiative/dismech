      qualifier travels with the claim: hypotonia and delay are typical, and preserved
      intellect is still compatible with the diagnosis.
- category: Neurodevelopmental
  name: Global developmental delay
  subtype: NALD-IRD
  description: >-
    Developmental delay, typical of the band but not of the ataxic subtype of this entry,
    whose patients had normal milestones and full-scale IQs in or near the normal range.
    Recorded so the two subtypes are not read as one.
  phenotype_term:
    preferred_term: Global developmental delay
    term:
      id: HP:0001263
      label: Global developmental delay
  evidence:
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "While hypotonia and developmental delays are typical, intellect can be normal."
    explanation: >-
      The band-level statement. Its second clause is the one that matters for this entry:
      preserved intellect does not exclude the diagnosis, which is exactly what the PEX2
      ataxic patients show.
  - reference: PMID:14630978
    reference_title: "Novel mutations in the PEX2 gene of four unrelated patients with a peroxisome biogenesis disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Common to PBDs are liver disease, variable neurodevelopmental delay, retinopathy and perceptive deafness."
    explanation: >-
      The class-level statement from the paper reporting the mildly affected complementation
      group 10 patient. It covers peroxisome biogenesis disorders generally, and the word
      "variable" is the operative one.

progression:
- phase: Childhood or adolescent onset, slow progression, survival to middle age
  notes: >-
    The prognostic fact that separates this entry from peroxisome biogenesis disorder 5A,
    where infants typically die in the first year. In the ataxic form first symptoms appear
    between about two and a half and eighteen years, progression is slow, and the oldest
    reported patient was ambulant and independent at fifty-one. That trajectory is drawn from
    three patients in two families and should be read as the reported experience, not as a
    prognosis that can be quoted to a family.
  evidence:
  - reference: PMID:23430938
    reference_title: "Zellweger Spectrum Disorder with Mild Phenotype Caused by PEX2 Gene Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient, born at term with normal birth weight and Apgar scores, developed normally
      until 3 years of age, when unsteady walking and frequent falls were noticed.
    explanation: >-
      The pediatric onset in the oldest reported patient, and the normal neonatal course that
      precedes it - which is the observation that keeps this entry out of the neonatal band.
  - reference: PMID:23430938
    reference_title: "Zellweger Spectrum Disorder with Mild Phenotype Caused by PEX2 Gene Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Motor disturbances progressed very slowly during childhood and adolescence without
      impairing his daily activities.
    explanation: >-
      The rate of progression through the childhood years, in the one patient followed to
      middle age.
  - reference: PMID:21392394
    reference_title: "Autosomal recessive cerebellar ataxia caused by mutations in the PEX2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      His older brother (P2) had normal neurologic examination at 14 years, but at the age of
      18 years he started to develop cerebellar signs with impaired gait, dysmetria, ataxia of
      the trunk, dysarthria, hyporeflexia and slow saccades with oculomotor apraxia.
    explanation: >-
      The other end of the onset range, in a sibling with the same genotype - a fourteen-year
      difference in age at onset within one family, which is why this entry does not offer an
      expected age of onset.
genetic:
- name: PEX2
  gene_term:
    preferred_term: PEX2
    term:
      id: hgnc:9717
      label: PEX2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  review_notes: >-
    PEX2, formerly PXMP3 and originally named peroxisome assembly factor-1, was the first
    human peroxin gene identified, cloned by functional complementation of Zellweger
    fibroblasts in 1992. It defines complementation group F in the Japanese series and
    complementation group 10 in the North American one. The alleles reported in this mild
    band are p.Glu55Lys opposite p.Arg119X in an infantile Refsum disease patient,
    c.865_866insA (p.Ser289LysfsX36) homozygous in two ataxic brothers and opposite
    p.Arg119X in an unrelated ataxic adult, and homozygous p.Trp223X in a mildly affected
    patient of the complementation group 10 series. The last of those is a nonsense allele
    at the mild end, which is why this entry does not claim that allele class alone predicts
    the band.
  evidence:
  - reference: PMID:1546315
    reference_title: "A human gene responsible for Zellweger syndrome that affects peroxisome assembly."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A human complementary DNA has been cloned that complements the disease's symptoms
      (including defective peroxisome assembly) in fibroblasts from a patient with Zellweger
      syndrome.
    explanation: >-
      The original identification of the gene, by functional complementation. Quoted from the
      primary report rather than from a review.
  - reference: CGGV:assertion_17bf1c4a-1775-40c6-a499-774c93827343-2020-02-07T170000.000Z
    reference_title: "PEX2 / peroxisome biogenesis disorder (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In summary, PEX2 is definitively associated with autosomal recessive peroxisomal biogenesis disorder."
    explanation: >-
      ClinGen's Peroxisomal Disorders Gene Curation Expert Panel classifies the relationship
      as Definitive. The assertion is against the grouping concept MONDO:0019234 peroxisome
      biogenesis disorder, so it establishes the gene-disease relationship for the locus and
      not for this severity band.
  - reference: PMID:11330043
    reference_title: "Temperature sensitivity in peroxisome assembly processes characterizes milder forms of peroxisome biogenesis disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified heterozygous mutations E55K/R119Stop in the PEX2 gene of an IRD patient
      of complementation group F.
    explanation: >-
      The genotype of the infantile Refsum disease patient, and the complementation group
      assignment PEX2 disease was first reached through. Quoted from the companion report by
      the same group because it states both facts in one sentence.
  - reference: PMID:21392394
    reference_title: "Autosomal recessive cerebellar ataxia caused by mutations in the PEX2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, because the c.865_866insA mutation introduces a frameshift 17 codons upstream
      of the stop codon, resulting in a PEX2 protein with an altered C-terminus
      (p.Ser289LysfsX36), it is very unlikely that it could be a non-pathogenic variation
      occurring in the normal population.
    explanation: >-
      The variant that recurs across both reported ataxic families, with the authors' own
      pathogenicity reasoning. Their hedge about the untested paternal allele is recorded in
      the entry notes rather than dropped.
  - reference: PMID:23430938
    reference_title: "Zellweger Spectrum Disorder with Mild Phenotype Caused by PEX2 Gene Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequence analysis of the PXMP3 (PEX2) gene (reference sequence NM_000318.2) identified
      two heterozygous mutations
    explanation: >-
      The compound heterozygous configuration in the unrelated adult patient. The two alleles
      are the Zellweger nonsense variant p.Arg119X and the same C-terminal frameshift carried
      by the two brothers; the published sentence naming them carries a typographical degree
      sign in the cDNA position, so the shorter clause is quoted and the alleles are named in
      review_notes instead.
  - reference: PMID:10652207
    reference_title: "Molecular mechanism of detectable catalase-containing particles, peroxisomes, in fibroblasts from a PEX2-defective patient."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We propose that the two putative membrane-spanning segments in Pex2p are important
      domains for peroxisome assembly and import and that a defect in one of these domains
      severely affects PBD patients.
    explanation: >-
      The other half of the domain rule, stated as the authors' proposal: a lesion in a
      membrane-spanning segment is severe, where one in the cytosolic C-terminal region is
      mild. Their "We propose" is preserved.
  - reference: PMID:14630978
    reference_title: "Novel mutations in the PEX2 gene of four unrelated patients with a peroxisome biogenesis disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The third patient had a homozygous mutation leading to the absence of the zinc-binding
      domain (W223X) and the fourth patient had a homozygous mutation leading to the change of
      the second cysteine residue of the zinc-binding domain (C247R).
    explanation: >-
      The two homozygous zinc-binding-domain genotypes whose severities ran opposite to
      expectation - the truncating allele mild, the missense allele severe - which is the
      evidence against reading allele class as a severity rule.
  - reference: PMID:40621817
    reference_title: "Distinguishing PEX2 and PEX16 gene variant severity for mild, severe and atypical peroxisome biogenesis disorders."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We identified a severity spectrum for PEX2 and PEX16 alleles, with some missense
      mutations exhibiting severity comparable to truncations. Alleles linked to mild PBD
      showed partial rescue, while variants associated with atypical ataxia could fully
      rescue.
    explanation: >-
      A functional ordering of the specific PEX2 alleles curated here, assayed by humanised
      Drosophila rescue. MODEL_ORGANISM: the measurement is in flies expressing the human
      alleles, and it supports the residual-function account rather than establishing it in
      patients.
biochemical:
- name: Plasma branched-chain fatty acids
  context: >-
    Phytanic and pristanic acid are the analytes that led to the diagnosis in the ataxic
    form, and they moved when the very-long-chain fatty acids did not.
  evidence:
  - reference: PMID:21392394
    reference_title: "Autosomal recessive cerebellar ataxia caused by mutations in the PEX2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Plasma VLCFAs were nearly normal in patients P1 and P2, but a moderate increase in the
      levels of phytanic and pristanic acids was found, prompting us to suspect a peroxisomal
      disorder
    explanation: >-
      The abnormality that opened the diagnosis, and the normal result that would have closed
      it if the branched-chain fatty acids had not been measured.
  notes: >-
    A raised pristanic acid with a pristanic/phytanic ratio above one first suggested
    alpha-methylacyl-CoA racemase deficiency in the ataxic brothers, and had to be excluded
    by isomer analysis and enzyme assay before the peroxin genes were sequenced. That is a
    real diagnostic detour, not a theoretical one.
- name: Plasma very-long-chain fatty acids
  context: >-
    The screening test for the Zellweger spectrum, and the one that is unreliable at this end
    of it. Nearly normal in the two ataxic brothers, raised in the unrelated adult patient.
  evidence:
  - reference: PMID:23430938
    reference_title: "Zellweger Spectrum Disorder with Mild Phenotype Caused by PEX2 Gene Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of plasma peroxisomal parameters revealed increased levels of very long chain
      fatty acids (VLCFAs), branched-chain fatty acids (pristanic and phytanic acid), and bile
      acid intermediates, prompting us to suspect a peroxisomal disorder.
    explanation: >-
      The patient in whom the very-long-chain fatty acids were raised, quoted alongside the
      contrary result in the brothers so the record shows both.
  notes: >-
    A normal plasma very-long-chain fatty acid concentration does not exclude a mild PEX2
    genotype: it was nearly normal in both reported ataxic brothers. Request phytanic acid,
    pristanic acid and the C27 bile-acid intermediates alongside it, and do not treat a normal
    screen as an answer.
- name: Cultured fibroblast peroxisomal assays
  context: >-
    The confirmatory panel - plasmalogen synthesis, DHAPAT activity, very-long-chain fatty
    acid and pristanic acid beta-oxidation, phytanic acid alpha-oxidation - which at this end
    of the spectrum can be almost entirely normal in a patient who has the disease.
  evidence:
  - reference: PMID:21392394
    reference_title: "Autosomal recessive cerebellar ataxia caused by mutations in the PEX2 gene."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Taken together, those analyses pointed towards a mild peroxisomal defect, but did not
      clearly indicate at which level.
    explanation: >-
      The authors' reading of a near-normal fibroblast panel, and the reason they went on to
      sequence three candidate peroxin genes rather than stopping.
  notes: >-
    The corollary for practice: in a patient with unexplained recessive cerebellar ataxia and
    a suggestive plasma profile, a normal fibroblast panel is not an exclusion, and sequencing
    is the route to the diagnosis.
diagnosis:
- name: Targeted plasma peroxisomal metabolite panel
  description: >-
    Plasma very-long-chain fatty acids with phytanic acid, pristanic acid and the C27
    bile-acid intermediates DHCA and THCA. Cheap, widely available, and the step that
    identified the disorder in every reported patient in this entry - but only because the
    branched-chain species were requested alongside the very-long-chain fatty acids.
  evidence:
  - reference: PMID:21392394
    reference_title: "Autosomal recessive cerebellar ataxia caused by mutations in the PEX2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Systematic screening for such PEX gene defect can easily and reliably be performed by
      the simple measurement of peroxisomal metabolites in plasma and will probably increase
      the frequency of PBD patients with mild phenotypes such as ARCA.
    explanation: >-
      The authors' proposal for how this diagnosis is reached, and their prediction that the
      mild band is under-ascertained.
- name: PEX gene sequencing
  description: >-
    Sequencing of the peroxin genes, which is what confirms the diagnosis. In both reported
    families the metabolite profile pointed to a peroxisomal defect without localising it, and
    the biochemical assays could not narrow it further, so molecular testing was not a
    confirmation of a biochemical answer but the source of the answer.
  evidence:
  - reference: PMID:21392394
    reference_title: "Autosomal recessive cerebellar ataxia caused by mutations in the PEX2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic screening of PEX2 and other PEX genes involved in peroxisomal biogenesis is
      warranted in children and adults with ARCA.
    explanation: >-
      The recommendation this record implements, stated for both children and adults - the
      age range this entry spans.
  - reference: PMID:23430938
    reference_title: "Zellweger Spectrum Disorder with Mild Phenotype Caused by PEX2 Gene Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Peroxisomal mosaicism with a mixed population of fibroblasts with and without peroxisomes
      persisted at 40°C, making systematic sequencing of the different PEX genes necessary.
    explanation: >-
      Why the cell-biological work-up did not substitute for sequencing in this patient: the
      temperature-shift assay that identifies many mild genotypes did not resolve his.
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of ZSD is established in a proband with the suggestive clinical and
      biochemical findings above by identification of biallelic pathogenic variants in one of
      the 13 known ZSD-PEX genes.
    explanation: >-
      GeneReviews' diagnostic criterion for the spectrum, which is what makes biallelic PEX
      variant identification the confirmatory test rather than a supporting one. Quoted
      because it states the role this record plays; OTHER because GeneReviews is an expert
      consensus chapter rather than a study.
treatments:
- name: Symptomatic and supportive management
  description: >-
    There is no disease-modifying therapy. For this band management is dominated by the motor
    and sensory consequences - rehabilitation for the ataxia and neuropathy, hearing aids,
    refractive correction, fat-soluble vitamin supplementation - rather than by the neonatal
    problems that dominate the severe band.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The focus is on symptomatic therapy and may include gastrostomy to provide adequate
      calories, hearing aids, cataract removal, glasses to correct refractive errors,
      supplementation of fat-soluble vitamins, and cholic acid supplementation
    explanation: >-
      The GeneReviews management statement for the spectrum. The list is spectrum-wide;
      gastrostomy in particular belongs to the severe band and not to this entry. The modality
      is OTHER because the row spans devices, surgery and supplementation.
- name: Cholic acid supplementation
  description: >-
    Bile-acid replacement, given because peroxisomal bile-acid synthesis is impaired and the
    C27 intermediates that accumulate are hepatotoxic. It is the only approved therapy for the
    Zellweger spectrum. Two limits belong on the claim: the evidence is spectrum-wide rather
    than PEX2-specific, and it is directed at liver disease, which is not what dominates the
    reported PEX2 mild-band patients - so nothing here says it alters the cerebellar disease
    that defines this entry.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cholic acid
      term:
        id: CHEBI:16359
        label: cholic acid
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:34521419
    reference_title: "Cholbam® and Zellweger spectrum disorders: treatment implementation and management."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Cholbam® (cholic acid), approved by the U.S. Food and Drug Administration in March 2015,
      is currently the only therapy approved as adjunctive treatment for patients with ZSDs and
      single enzyme bile acid synthesis disorders.
    explanation: >-
      The regulatory status of the one approved therapy. INDIRECT for this entry: the approval
      is for the spectrum, and no outcome in a PEX2 mild-band patient is reported anywhere in
      the sources cited here.
  - reference: PMID:34521419
    reference_title: "Cholbam® and Zellweger spectrum disorders: treatment implementation and management."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      This review will focus on the use of CA therapy in the treatment of liver disease
      associated with ZSDs, including recommendations for initiating and maintaining CA therapy
      and the limitations of available clinical data supporting its use in this patient
      population.
    explanation: >-
      The target of the therapy - liver disease - and the reviewers' own acknowledgement that
      the supporting clinical data are limited. Quoted rather than summarised so the caveat
      travels with the claim.
- name: Multidisciplinary surveillance
  description: >-
    Scheduled monitoring rather than treatment, and the part of management that matters most
    in a slowly progressive disorder where the sensory losses arrive decades after the ataxia.
    For a child diagnosed in this band the practical core is annual audiology and
    ophthalmology, liver function and liver imaging, an annual urine oxalate-to-creatinine
    ratio, adrenal function from the first year, six-monthly dental review, and developmental
    and educational follow-up.
  treatment_term:
    preferred_term: multisystem surveillance schedule
  therapeutic_modality: OTHER
  notes: >-
    Deliberately left unbound; the meaning is carried in preferred_term. TreatmentActionTerm
    is rooted at NCIT:C25218 Clinical Intervention or Procedure. Searching NCIT through the
    OLS search API for "surveillance" and for "monitoring" returns NCIT:C15719 Surveillance,
    NCIT:C53607 Patient Monitoring and NCIT:C61256 Monitoring; asking the local NCIT build
    for each one's is-a ancestors returns no NCIT:C25218 among them, so none is a legal value
    for this slot. NCIT:C15419 Disease Screening is reachable from that root and is what this
    repository uses for screening treatments elsewhere, but it names screening an unselected
    population for an undiagnosed disease, which is not what this record describes - here the
    diagnosis is already made and the schedule looks for its complications.
  evidence:
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Annual audiology and ophthalmologic evaluations; annual monitoring of liver function and
      coagulation factors, and ultrasound and/or fibroscan to evaluate liver architecture;
      monitor for changes in seizure activity; head MRI to evaluate for white matter changes
      that may explain changes in cognitive and/or motor ability; monitor developmental
      progress and educational needs; ACTH and cortisol levels by age one year and annually
      thereafter.
    explanation: >-
      The GeneReviews surveillance schedule for the spectrum, which is the only sourced
      schedule available for this entry. It is written for the spectrum as a whole, so parts of
      it - seizure monitoring in particular - address problems not reported in the PEX2 mild
      band.
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Dental examinations every six months. Annual urine oxalate-to-creatinine ratio with
      consideration of kidney imaging when performing liver imaging.
    explanation: >-
      The two surveillance items most easily forgotten in a patient whose presentation is
      neurological: the enamel defect of the secondary dentition and renal oxalate stones.
- name: Dietary phytanic acid restriction
  description: >-
    Restriction of dietary phytanic acid, on the reasoning that phytanic acid is exclusively
    of dietary origin and is one of the two branched-chain species that accumulate in this
    entry. The Zellweger spectrum management literature does not recommend it generally: it
    is reserved for extremely high phytanic acid levels and is explicitly advised against
    when levels are only moderately raised, because maintaining caloric intake matters more.
    The PEX2 patients cited here are reported only as having increased branched-chain fatty
    acids, with no statement that phytanic acid reaches the extreme level at which the review
    indicates restriction, and no outcome of this intervention is reported in any of them. For
    this entry it is therefore a conditional option rather than a therapy of demonstrated
    benefit.
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:26627182
    reference_title: "Zellweger spectrum disorders: clinical overview and management approach."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      A phytanic acid restricted diet is only necessary when levels of phytanic acid are
      extremely high and is not recommended when levels are moderately increased
    explanation: >-
      The Zellweger spectrum management review's actual statement on phytanic acid
      restriction, which both establishes the intervention as a recognised option and
      supplies the threshold that keeps it conditional. INDIRECT because it is stated for the
      spectrum rather than for PEX2, and OTHER because the source is an expert management
      review rather than a study.
clinical_trials:
- name: NCT06190626
  phase: NOT_APPLICABLE
  description: >-
    Longitudinal observational natural-history study of the retinal degeneration of Zellweger
    spectrum disorder, set up to define its course, to work out which tests best track
    progression, and to produce prognostic information about vision loss. It enrolls at
    spectrum level rather than by complementation group, so it is relevant to this entry
    through the retinal dystrophy the milder band carries rather than through PEX2
    specifically. NOT_APPLICABLE because it is observational and follows no FDA phase.
  target_phenotypes:
  - preferred_term: Retinal dystrophy
    term:
      id: HP:0000556
      label: Retinal dystrophy
  notes: >-
    Recruitment status is absent because it is not sourceable from the cached record: the
    ClinicalTrials.gov entry for this study holds only its summary text, with no
    overall-status field, so no value is asserted.
  evidence:
  - reference: clinicaltrials:NCT06190626
    reference_title: "Longitudinal Prospective Natural History Study of Retinopathy in Zellweger Spectrum Disorder"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The goal of this observational study is to define the course of the retinal degeneration
      in a ZSD patient cohort.
    explanation: >-
      The registered objective, which is what makes this study relevant to the retinal
      dystrophy this entry records for the intermediate and milder band.
differential_diagnoses:
- name: Peroxisome biogenesis disorder 5A (Zellweger)
  description: >-
    The severe band at the same locus. Separated not by gene but by residual peroxin-2
    function, and in practice by congenital malformations and death in the first year of life.
    It is not curated in this repository.
  distinguishing_features:
  - Congenital malformations - neuronal migration defect, renal cysts, epiphyseal stippling
  - Neonatal hypotonia, poor feeding and distinctive facies
  - Death in the first year without developmental progress
  - Absent rather than mosaic peroxisomal matrix-protein import in fibroblasts
  evidence:
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Infants with severe ZSD are significantly impaired and typically die during the first
      year of life, usually having made no developmental progress.
    explanation: The clinical outcome that separates the two bands.
  - reference: PMID:10528859
    reference_title: "Defective PEX gene products correlate with the protein import, biochemical abnormalities, and phenotypic heterogeneity in peroxisome biogenesis disorders."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The nonsense mutation severely affects these peroxisomal functions as well as the protein
      import.
    explanation: >-
      The cellular counterpart of the clinical split, measured at this locus: the allele that
      produces the severe band abolishes what the mild allele preserves in part.
- name: Other autosomal recessive cerebellar ataxias
  description: >-
    The clinical differential this entry is actually met in. A child or adult with progressive
    ataxia, cerebellar atrophy and reduced reflexes is worked up for Friedreich ataxia, ataxia
    telangiectasia and the ataxias with oculomotor apraxia; a peroxisomal biogenesis disorder
    is not on the first list and is missed unless the branched-chain fatty acids are requested.
    Both reported families were tested for Friedreich ataxia and oculomotor apraxia type 1
    before the peroxisomal work-up.
  distinguishing_features:
  - Raised plasma phytanic and pristanic acid, with the pristanic/phytanic ratio above one
  - Raised C27 bile-acid intermediates DHCA and THCA
  - Plasma very-long-chain fatty acids may be near normal
  - Biallelic PEX2 variants on sequencing
  evidence:
  - reference: PMID:21392394
    reference_title: "Autosomal recessive cerebellar ataxia caused by mutations in the PEX2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Molecular studies of frataxin and aprataxin genes ruled out Friedrich ataxia and
      cerebellar ataxia with oculomotor apraxia 1 (AOA1).
    explanation: >-
      The specific alternatives excluded before this diagnosis was reached, in the founding
      report.
- name: Alpha-methylacyl-CoA racemase deficiency
  description: >-
    The trap this entry's biochemical profile sets. A raised pristanic acid with a raised
    pristanic/phytanic ratio and normal very-long-chain fatty acids is the classic AMACR
    picture, and it was the first diagnosis considered in the two ataxic brothers.
  distinguishing_features:
  - Distinguished by R- and S-isomer analysis of DHCA and THCA
  - Distinguished by AMACR enzyme activity in fibroblasts
  - Traces of DHCA and THCA also exclude adult Refsum disease
  evidence:
  - reference: PMID:21392394
    reference_title: "Autosomal recessive cerebellar ataxia caused by mutations in the PEX2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This was ruled out by the measurement of R- and S- isomers of DHCA and THCA in plasma
      and AMACR activity in fibroblasts from P1.
    explanation: >-
      The tests that resolved the misdirection. The preceding sentence in the same paragraph,
      which states that the raised pristanic and phytanic acids with normal very-long-chain
      fatty acids first suggested AMACR deficiency, carries a bracketed citation and is
      therefore paraphrased in this record's description rather than quoted.
- name: Zellweger spectrum disorders of other complementation groups
  description: >-
    The other twelve ZSD-PEX genes produce overlapping phenotypes across the same severity
    range, and mild bands with cerebellar ataxia are described at PEX10, PEX12 and PEX16 as
    well as here. The distinction is molecular and does not change management.
  distinguishing_features:
  - Different causal PEX gene on sequencing
  - Clinically and biochemically overlapping at the same point on the severity range
  - PEX16 mild disease additionally reported with spastic paraparesis, leukodystrophy and cataract
  evidence:
  - reference: PMID:21392394
    reference_title: "Autosomal recessive cerebellar ataxia caused by mutations in the PEX2 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, these patients displayed additional neurological symptoms including axonal
      motor neuropathy and decreased vibration sense in PEX10- mutated patients and spastic
      paraparesia, leukodystrophy peripheral neuropathy and cataracts in patients with PEX16
      mutation.
    explanation: >-
      The features that were used to tell the neighbouring mild bands apart at the time. The
      preceding sentence, which reports that mild cerebellar-ataxia phenotypes had just been
      shown at PEX10 and PEX16, carries a bracketed citation and is not quoted. Note that the distinction drawn here - an isolated ataxia at PEX2 against an
      ataxia-plus at PEX10 - does not survive the later PEX2 patient, who had a severe
      neuropathy.
  - reference: PMID:20301621
    reference_title: "Zellweger Spectrum Disorder."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the term "ZSD" is now used to refer to all individuals with a defect in one of the
      ZSD-PEX genes regardless of phenotype
    explanation: >-
      The current gene-agnostic framing, which is why the differential between complementation
      groups is molecular rather than clinical.
discussions:
- discussion_id: normal_biochemistry_at_the_mild_end
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Residual Peroxisomal Fatty-Acid Oxidation and Ether-Lipid Synthesis
  - biochemical#Plasma very-long-chain fatty acids
  prompt: >-
    How often is the plasma very-long-chain fatty acid screen normal in a patient who
    nevertheless carries a biallelic mild PEX2 genotype, and what proportion of mild PEX2
    disease is therefore missed by a work-up that stops at that test?
  rationale: >-
    Two of the three reported ataxic patients had nearly normal very-long-chain fatty acids,
    and one had a fibroblast panel that was normal on every axis except phytanic acid
    alpha-oxidation. If that is representative, the screening test in routine use has poor
    sensitivity in exactly the band this entry covers - but three patients cannot establish a
    rate, and there is no ascertainment-corrected series to compute one from. The reporting
    authors themselves predicted that systematic metabolite screening would increase the
    apparent frequency of mild disease, which is a statement that the current denominator is
    wrong.
- discussion_id: temperature_sensitivity_is_not_universal
  kind: CONTROVERSY
  attaches_to:
  - pathophysiology#Partial Failure of Peroxisomal Matrix Protein Import
  prompt: >-
    Is temperature-sensitive peroxisome assembly a general property of mild peroxisome
    biogenesis disorder genotypes, or only of a subset that happens to include PEX2 E55K?
  rationale: >-
    The 2000 study found every infantile Refsum disease cell line it tested to be
    temperature-sensitive and concluded that the property characterises the milder forms, with
    PEX2 E55K shown to be its direct cause by transfection. The 2012 PEX2 patient contradicts
    that generalisation: his peroxisomal mosaicism persisted at both 37 and 40 degrees, and his
    authors concluded that the assay did not spare them from sequencing. Both observations are
    in this entry, on the same node, and the entry does not resolve them - the honest reading
    is that temperature sensitivity is allele-dependent rather than band-dependent.
notes: >-
  Lump/split decision: DISEASE, curated as the mild band of the PEX2 allelic series at
  MONDO:0013933, rather than as a has_subtypes row on a PEX2 parent entry or on the Zellweger
  spectrum entry. The basis is precedent plus ontology, and both are stated here rather than
  assumed. Eleven numbered peroxisome biogenesis disorder entries already exist in kb/, and
  two A/B pairs are curated at exactly this granularity as separate Disease entries - 4A/4B
  and 11A/11B - which are the direct analogue of the 5A/5B pair. Peroxisome_Biogenesis_Disorder_1B,
  _2B, _6B and _8B are likewise separate entries. The ontology agrees: MONDO gives 5A
  (MONDO:0013932) and 5B (MONDO:0013933) separate identifiers under the shared PEX2 parent
  MONDO:0100260. Note the asymmetry this leaves: there is no peroxisome biogenesis disorder 5A
  entry in this repository, so the differential row naming it points at a concept the KB does
  not yet hold. The stub is retired accordingly.

  Two existing entries already carry PEX2 content, and this entry neither duplicates nor
  supersedes either. Zellweger_Spectrum_Disorders.yaml holds a PEX2-ZSD has_subtypes row
  bound to the shared parent MONDO:0100260, and Peroxisome_Biogenesis_Disorder.yaml describes
  the gene at class level; both state PEX2's place in the RING-finger ubiquitin ligase complex
  generically, across the whole severity range. What is new here is the severity band - the
  mild-band alleles, the residual-function cell biology, and the clinical picture of patients
  who reach adult life. Where this entry restates the generic molecular account it does so from
  primary sources rather than from those entries.

  Which claims are PEX2-specific and which are spectrum-general. This distinction is the one a
  reader of a B-band entry most needs, and it is not left to inference. PEX2-specific and
  drawn from patients with a proven PEX2 genotype: the ataxia, cerebellar atrophy, dysarthria,
  dysmetria, nystagmus, areflexia, axonal polyneuropathy, pes cavus and strabismus; the
  preserved cognition; the onset range and the slow course; the branched-chain fatty acid and
  fibroblast biochemistry; the peroxisomal mosaicism and catalase-less peroxisomes; and every
  genotype named. Spectrum-general, quoted from GeneReviews or from class-level statements and
  labelled as such on each evidence item: the sensory-loss, liver, adrenal and renal-oxalate
  picture of the intermediate band; the recurrence risk; the management and surveillance
  schedule; and the cholic acid approval. Where the two disagree the PEX2 source is preferred
  and the disagreement is recorded - most visibly on the leukodystrophy, which GeneReviews
  lists for the intermediate band and which both PEX2 ataxic reports explicitly exclude on MRI.

  MONDO and Orphanet both recognise the ataxic form as a named entity -
  MONDO:0957443 / ORPHA:642965 "autosomal recessive ataxia due to PEX2 deficiency", whose
  Orphanet synonym is "mild peroxisomal disorder due to PEX2 deficiency" - and it is bound as
  the subtype_term on that has_subtypes row. Worth flagging rather than passing over: MONDO
  files that class under MONDO:0100309 hereditary ataxia, not under MONDO:0013933, so in the
  ontology the ataxic form is a sibling concept reached from the ataxias rather than a child
  of this entry. This entry treats it as a presentation of PEX2 mild-band disease, which is
  how the primary literature treats it - the two case reports that describe these patients
  both frame them as Zellweger spectrum disorder with a mild phenotype, and one of the two
  alleles reported across those patients, p.Arg119X, is a nonsense variant already reported
  in classic Zellweger syndrome. If a
  future reviewer prefers MONDO's reading, the remedy is a separate entry for MONDO:0957443,
  not a change to this one.

  The NALD-IRD row carries no subtype_term, and that is a searched answer rather than an
  omission. Searching MONDO through the OLS search API for "neonatal adrenoleukodystrophy"
  returns two classes, MONDO:0009919 peroxisomal acyl-CoA oxidase deficiency and
  MONDO:0019234 peroxisome biogenesis disorder, which carry the string as a synonym;
  searching for "infantile Refsum disease" returns only MONDO:0019234. Both are the wrong
  concept here - one is a single-enzyme defect at a different locus, the other the
  whole-class grouping - so binding either would assert something false.

  Phenotype frequencies are deliberately absent from this entry, and that is a decision rather
  than an omission. The reported PEX2 mild band is three patients in two families for the
  ataxic form and a small number of individually reported patients for the neonatal
  adrenoleukodystrophy / infantile Refsum presentation. A percentage computed over three
  patients would be a false precision, and importing the frequencies published for the
  Zellweger spectrum - or for the better-studied PEX10 mild band - would attribute to PEX2
  observations that were never made in PEX2 patients. Where a feature's frequency matters
  clinically, the entry states the count instead: the neuropathy was absent in two patients and
  severe in the third, hearing loss and retinopathy were absent into the mid-teens in two and
  appeared in the third's third to fifth decades.

  The pediatric reading. Onset is in childhood in two of the three ataxic patients, and the
  earliest sign in either family was mild dysarthria at about two and a half years, a year
  before the gait disturbance - so the presenting complaint in a child may be speech rather
  than balance. Early milestones were normal in every reported patient, and the neonatal
  period was unremarkable, which is what keeps these children out of a metabolic work-up. The
  sensory losses that define the older labels of this band arrive decades later at this locus,
  which is an argument for instituting the GeneReviews surveillance schedule at diagnosis in a
  child rather than waiting for symptoms. The fourteen-year difference in age at onset between
  two brothers homozygous for the same allele is the caution to give a family: the genotype
  does not predict when.

  Two hedges from the primary sources are carried rather than dropped. The apparent homozygosity
  for c.865_866insA in the two brothers could not be confirmed, because paternal DNA was
  unavailable and a deletion in trans would look identical; the authors say so themselves. And
  the mildly affected homozygous W223X patient in the complementation group 10 series was
  surprising to the authors who reported him, since a nonsense allele removing the zinc-binding
  domain would be expected to be severe - so this entry does not claim that allele class
  predicts the band, only that residual function does.

  No animal model is curated. A Pex2 knockout mouse exists and is well characterised, but it
  is a null allele modelling classic Zellweger syndrome rather than this band, and no
  model carrying a human mild PEX2 allele in a mammal is reported in the sources cited here.
  The humanised Drosophila work is cited as evidence on the gene record instead of as an animal
  model, because what it measures is allele severity by rescue rather than a recapitulation of
  the human phenotype.

  No treatment in this entry has a reported outcome in a PEX2 patient. Cholic acid has an FDA
  approval and a hepatic rationale, both spectrum-wide; dietary phytanic acid restriction has a
  biochemical rationale and no reported result. Every efficacy-bearing treatment evidence item
  is therefore marked INDIRECT, and nothing here claims an effect on the cerebellar disease that
  defines this band.

  Ataxia is bound to HP:0001251, for which "Cerebellar ataxia" is HPO's own exact synonym; the
  course-qualified HP:0002073 Progressive cerebellar ataxia was considered and not taken, on the
  repository convention of carrying course on clinical_course rather than inside the term. The
  cognitive impairment record is bound to HP:0100543 and carries two REFUTE items, because its
  purpose is to record that cognition is preserved - a negative that matters diagnostically -
  rather than to assert a deficit.

    reference_title: "Dermatological manifestations, management, and care in RASopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RASopathies are rare genetic disorders caused by germline pathogenic
      variants in genes belonging to the RAS/MAPK pathway, which signals cell
      proliferation, differentiation, survival and death.
    explanation: Confirms germline RAS/MAPK pathway dysregulation as the shared mechanism underlying the RASopathies, of which ulerythema ophryogenes is a dermatologic feature.
  downstream:
  - target: Follicular Keratinocyte Hyperproliferation and Plugging
    description: >-
      RAS-MAPK pathway dysregulation in the RASopathies produces follicular
      hyperkeratosis and inflammation phenotypically convergent with the
      other causes of keratosis pilaris atrophicans faciei.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Perifollicular Inflammation
  description: >-
    Follicular keratin occlusion (and, in the LRP1-deficient family, impaired
    immune regulation) triggers a perifollicular inflammatory infiltrate,
    producing the characteristic erythema surrounding follicular papules.
  cell_types:

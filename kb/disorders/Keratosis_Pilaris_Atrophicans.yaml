    term:
      id: GO:0031424
      label: keratinization
    modifier: ABNORMAL
  - preferred_term: keratinocyte differentiation
    term:
      id: GO:0030216
      label: keratinocyte differentiation
    modifier: ABNORMAL
  evidence:
  - reference: PMID:26142438
    reference_title: "Whole exome sequencing identifies LRP1 as a pathogenic gene in autosomal recessive keratosis pilaris atrophicans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Keratosis pilaris atrophicans (KPA) is a group of rare genodermatoses
      characterised by perifollicular keratosis and inflammation that
      progresses to atrophy and scars of the facial skin.
    explanation: Establishes the shared proximal lesion (perifollicular keratosis) common to the KPA spectrum.
  downstream:
  - target: Perifollicular Inflammation
    description: >-
      Follicular keratin plugging incites a perifollicular inflammatory

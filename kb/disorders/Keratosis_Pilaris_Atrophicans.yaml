treatments:
- name: Topical Retinoid Therapy
  description: >-
    Topical retinoids (e.g. tretinoin) are used to reduce follicular
    hyperkeratosis and papule formation, analogous to their use in other
    keratinization disorders; response in KPA is often incomplete.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tretinoin
      term:
        id: CHEBI:15367
        label: all-trans-retinoic acid
  notes: >-
    No controlled trial evidence for topical retinoids in KPA specifically was
    identified; this reflects extrapolation from general keratinization
    disorder management.
- name: Topical Corticosteroid Therapy
  description: >-
    Topical corticosteroids are used to reduce perifollicular inflammation
    and erythema.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Topical Corticosteroid Therapy
    term:
      id: NCIT:C122078
      label: Topical Corticosteroid Therapy
- name: Pulsed Dye Laser Therapy
  description: >-
    Pulsed dye laser treats the erythema, follicular papules, and associated
    alopecia of ulerythema ophryogenes and atrophoderma vermiculatum, with
    case reports of clinically significant improvement in erythema and
    partial hair regrowth after a single session.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Laser Therapy
    term:
      id: NCIT:C15466
      label: Laser Therapy
  evidence:
  - reference: PMID:40761190
    reference_title: "Successful treatment of ulerythema ophryogenes with pulsed dye laser: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pulsed dye laser treatment appears to be a safe and effective treatment
      for the erythema and alopecia symptoms associated with this refractory
      condition.
    explanation: Case report demonstrates pulsed dye laser efficacy for ulerythema ophryogenes erythema and alopecia.
  - reference: PMID:11260551
    reference_title: "Laser treatment of atrophoderma vermiculata."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report successful treatment of 2 patients by means of the carbon
      dioxide and 585 nm pulsed dye lasers.
    explanation: Case series reports successful laser treatment of atrophoderma vermiculatum.
- name: Genetic Counseling
  description: >-
    Genetic counseling is appropriate given the heterogeneous inheritance
    across KPA variants (autosomal recessive LRP1, X-linked recessive MBTPS2
    KFSD, and rarer autosomal dominant familial forms).
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
notes: >-
  This root entry curates the KPA umbrella and fully curates two of its three
  principal subtypes (keratosis pilaris atrophicans faciei/ulerythema
  ophryogenes and atrophoderma vermiculatum). The third subtype, keratosis
  follicularis spinulosa decalvans (KFSD, MBTPS2-related), already has its own
  complete dismech entry at kb/disorders/Keratosis_Follicularis_Spinulosa_Decalvans.yaml
  (whose parents already list "Keratosis pilaris atrophicans"); it is
  cross-referenced here as a has_subtypes entry rather than duplicated. The
  association between ulerythema ophryogenes/keratosis pilaris atrophicans
  faciei and the RASopathies (cardiofaciocutaneous and Noonan syndrome) is
  documented as a phenotypic overlap, not as KPA being classified as a
  RASopathy itself (KPA is not RAS-MAPK-driven as a primary disease and is not
  a member of kb/groupings/RASopathies.yaml); see the "RAS-MAPK Pathway
  Dysregulation (RASopathy Context)" pathophysiology node and the
  RASopathy-associated genetic entry above.

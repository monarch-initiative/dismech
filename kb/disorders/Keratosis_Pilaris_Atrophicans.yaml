name: Keratosis Pilaris Atrophicans
creation_date: "2026-08-26T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: keratosis pilaris atrophicans
  term:
    id: MONDO:0018855
    label: keratosis pilaris atrophicans
description: >-
  Keratosis pilaris atrophicans (KPA) is an umbrella term for a group of rare,
  genetically heterogeneous genodermatoses of follicular keratinization in
  which follicular hyperkeratosis with perifollicular inflammation progresses
  to atrophy and scarring, most often affecting the face, eyebrows, and scalp.
  The three principal clinical variants are keratosis pilaris atrophicans
  faciei (ulerythema ophryogenes), atrophoderma vermiculatum, and keratosis
  follicularis spinulosa decalvans (KFSD, MBTPS2-related X-linked disease).
  Most KPA is sporadic, but a documented autosomal recessive LRP1 loss-of-
  function cause exists, and the keratosis pilaris atrophicans faciei/
  ulerythema ophryogenes phenotype specifically is a recognized, frequent
  dermatologic feature of monosomy 18p and of the RAS-MAPK-driven RASopathies
  (chiefly cardiofaciocutaneous syndrome, also Noonan syndrome), reflecting
  genetic heterogeneity converging on a shared follicular pathophysiology
  rather than a single Mendelian cause.
parents:
- Genodermatosis
has_subtypes:
- name: Keratosis Pilaris Atrophicans Faciei
  display_name: Keratosis Pilaris Atrophicans Faciei (Ulerythema Ophryogenes)
  subtype_term:
    preferred_term: keratosis pilaris atrophicans faciei
    term:
      id: MONDO:0859588
      label: keratosis pilaris atrophicans faciei
  mappings:
    mondo_mappings:
    - term:
        id: MONDO:0018086
        label: ulerythema ophryogenesis
      mapping_predicate: skos:closeMatch
      mapping_source: MONDO
      mapping_justification: >-
        MONDO models "ulerythema ophryogenesis" (MONDO:0018086) and "keratosis
        pilaris atrophicans faciei" (MONDO:0859588) as two separate is-a
        children of keratosis pilaris atrophicans, but the clinical and
        dermatology literature treats "ulerythema ophryogenes" as the
        classic/eponymous name for the same faciei variant (e.g. PMID:24801913
        writes "ulerythema ophryogenes (keratosis pilaris atrophicans
        faciei)"). closeMatch records this near-synonymy without asserting
        formal ontological identity.
  description: >-
    Ulerythema ophryogenes (UO) begins with erythematous, keratotic follicular
    papules of the lateral eyebrows and cheeks that progress to perifollicular
    scarring, sparse or absent lateral eyebrows, and (rarely) extension to the
    forehead or scalp; eyelashes are typically spared. Most cases are
    sporadic, but autosomal dominant familial transmission has been reported.
    The same phenotype is a recognized, frequent cutaneous marker of monosomy
    18p (five reported cases as of 2014) and of RAS-MAPK pathway
    dysregulation in the RASopathies, occurring in up to 90% of
    molecularly-confirmed cardiofaciocutaneous syndrome (see
    kb/groupings/RASopathies.yaml).
  evidence:
  - reference: PMID:24801913
    reference_title: "Trias of keratosis pilaris, ulerythema ophryogenes and 18p monosomy: Zouboulis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Keratosis pilaris and ulerythema ophryogenes (keratosis pilaris
      atrophicans faciei) are part of a group of hereditary disorders of hair
      follicle keratinization involving follicular inflammation and
      subsequent atrophy.
    explanation: Confirms ulerythema ophryogenes and keratosis pilaris atrophicans faciei denote the same clinical entity within the KPA spectrum.
  - reference: PMID:40761190
    reference_title: "Successful treatment of ulerythema ophryogenes with pulsed dye laser: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      presented a progressive erythema and confluent horny follicular
      erythematous papules with areas of alopecia around the lateral third of
      eyebrows without signs of pitted or atrophic scars, which has been
      evident since childhood
    explanation: Describes the characteristic clinical presentation of ulerythema ophryogenes, including lateral eyebrow follicular papules and alopecia.
- name: Atrophoderma Vermiculatum
  subtype_term:
    preferred_term: atrophoderma vermiculata
    term:
      id: MONDO:0008849
      label: atrophoderma vermiculata
  description: >-
    Atrophoderma vermiculatum (also folliculitis ulerythematosa reticulata)
    presents in childhood as symmetric follicular papules of the cheeks and
    preauricular skin that slowly evolve into a reticulated, pitted
    "honeycombed"/"worm-eaten" atrophic scarring pattern, with a slowly
    progressive course.
  evidence:
  - reference: PMID:11260551
    reference_title: "Laser treatment of atrophoderma vermiculata."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Atrophoderma vermiculata is a rare genodermatosis with usual onset in
      childhood, characterized by a "honey-combed" reticular atrophy of the
      cheeks. The course is generally slow, with progressive worsening.
    explanation: Describes the defining clinical morphology and slowly progressive course of atrophoderma vermiculatum.
  - reference: PMID:9720693
    reference_title: "Folliculitis ulerythematosa reticulata (atrophoderma vermiculata): early detection of a case with unilateral lesions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Unilateral folliculitis ulerythematosa reticulata (a variant of
      keratosis pilaris atrophicans) is strikingly rare, and its very early
      clinical and microscopic changes are demonstrated in this case report.
    explanation: Confirms atrophoderma vermiculatum/folliculitis ulerythematosa reticulata is classified as a variant within the keratosis pilaris atrophicans spectrum.
- name: Keratosis Follicularis Spinulosa Decalvans
  subtype_term:
    preferred_term: keratosis follicularis spinulosa decalvans
    term:
      id: MONDO:0000136
      label: keratosis follicularis spinulosa decalvans
  description: >-
    KFSD is the most extensive KPA variant, with generalized follicular
    hyperkeratosis and progressive cicatricial alopecia of the scalp,
    eyebrows, and eyelashes, most often caused by X-linked recessive MBTPS2
    (site-2 protease) variants; rarer autosomal forms (e.g. CST6) are also
    reported. Photophobia, corneal dystrophy, and other ocular findings can
    coexist. This subtype's full pathophysiology, phenotypes, genetics, and
    treatment are curated in its own dedicated dismech entry,
    kb/disorders/Keratosis_Follicularis_Spinulosa_Decalvans.yaml; it is
    cross-referenced here rather than duplicated.
  genes:
  - preferred_term: MBTPS2
    term:
      id: hgnc:15455
      label: MBTPS2
  inheritance:
  - name: X-linked recessive

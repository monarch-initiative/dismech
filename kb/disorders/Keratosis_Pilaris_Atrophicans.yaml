      supports: SUPPORT
      evidence_source: OTHER
      snippet: "- X-linked recessive"
      explanation: Orphanet lists X-linked recessive inheritance as the predominant mode for KFSD.
  evidence:
  - reference: PMID:26142438
    reference_title: "Whole exome sequencing identifies LRP1 as a pathogenic gene in autosomal recessive keratosis pilaris atrophicans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Keratosis pilaris atrophicans (KPA) is a group of rare genodermatoses
      characterised by perifollicular keratosis and inflammation that
      progresses to atrophy and scars of the facial skin.
    explanation: Frames KFSD as one of the genodermatoses within the broader KPA group whose shared endpoint is perifollicular keratosis/inflammation progressing to atrophy and scarring.
genetic:
- name: LRP1 Autosomal Recessive Variants
  gene_term:
    preferred_term: LRP1
    term:
      id: hgnc:6692
      label: LRP1
  association: >-
    A homozygous missense variant (p.Lys1245Arg) in LRP1 was identified as
    the cause of autosomal recessive, mixed-type keratosis pilaris atrophicans
    in a large consanguineous Pakistani pedigree, the first reported causal
    gene for the root KPA entity itself (as distinct from the MBTPS2-caused
    KFSD subtype).
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive
    evidence:
    - reference: PMID:26142438
      reference_title: "Whole exome sequencing identifies LRP1 as a pathogenic gene in autosomal recessive keratosis pilaris atrophicans."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A large consanguineous Pakistani pedigree segregating autosomal
        recessive KPA of a mixed type was subject to autozygosity mapping and
        whole exome sequencing.
      explanation: Establishes autosomal recessive inheritance of the LRP1-associated KPA family.
  evidence:
  - reference: PMID:26142438
    reference_title: "Whole exome sequencing identifies LRP1 as a pathogenic gene in autosomal recessive keratosis pilaris atrophicans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic analyses identified a unique homozygous missense variant
      (K1245R) in the LRP1 in all affected family members.
    explanation: Identifies the specific causal LRP1 variant segregating with disease in the affected family.
  - reference: PMID:26142438
    reference_title: "Whole exome sequencing identifies LRP1 as a pathogenic gene in autosomal recessive keratosis pilaris atrophicans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The LRP1 mRNA and LRP1 protein levels in fibroblasts of affected
      individuals were markedly reduced when compared with controls.
      Similarly, the LRP1-mediated cellular uptake of alpha(2)M was reduced in
      patient fibroblasts.
    explanation: Functional fibroblast assays confirm the LRP1 variant causes loss of LRP1 expression and receptor-mediated endocytic function.
- name: 18p Deletion (Monosomy 18p)
  association: Chromosomal Alteration
  subtype: Keratosis Pilaris Atrophicans Faciei
  relationship_type: RISK_FACTOR
  variant_origin: GERMLINE
  notes: >-
    Ulerythema ophryogenes/keratosis pilaris atrophicans faciei with
    concurrent keratosis pilaris of the trunk and limbs has been reported in
    at least five patients with monosomy of the short arm of chromosome 18
    since the association was first described in 1994, prompting proposal of
    a distinct "Zouboulis syndrome" trias. No single causal gene within the
    18p deletion region has been confirmed; a candidate role for LAMA1 was
    proposed but not substantiated with further evidence.
  evidence:
  - reference: PMID:8041661
    reference_title: "Ulerythema ophryogenes and keratosis pilaris in a child with monosomy 18p."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a 13-year-old boy with deletion of the short arm of
      chromosome 18 and follicular, partially inflammatory, keratotic papules
      of the eyebrows, foreskin, and cheeks (ulerythema ophryogenes) as well
      as the shoulders, upper back, upper arms, and thighs (keratosis
      pilaris), initially diagnosed as atopic dermatitis.
    explanation: First reported case establishing the association between monosomy 18p and ulerythema ophryogenes/keratosis pilaris.
  - reference: PMID:24801913
    reference_title: "Trias of keratosis pilaris, ulerythema ophryogenes and 18p monosomy: Zouboulis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have reviewed the five almost identical cases that have been
      reported in 20 years and we suggest the existence of a new rare
      syndrome characterized by the trias keratosis pilaris, ulerythema
      ophryogenes and monosomy 18p.
    explanation: Reviews five reported cases confirming the recurrent association of monosomy 18p with keratosis pilaris and ulerythema ophryogenes.
- name: RASopathy RAS-MAPK Pathway Variants (Cardiofaciocutaneous and Noonan Syndrome)
  association: >-
    Germline gain-of-function variants in RAS-MAPK pathway genes (BRAF,
    MAP2K1, MAP2K2, KRAS in cardiofaciocutaneous syndrome; PTPN11 and others
    in Noonan syndrome) cause the RASopathies, in which ulerythema
    ophryogenes/keratosis pilaris atrophicans faciei is a frequent
    dermatologic manifestation rather than an isolated causal relationship to
    KPA itself; see kb/groupings/RASopathies.yaml for the cross-disease
    grouping.
  subtype: Keratosis Pilaris Atrophicans Faciei
  relationship_type: RISK_FACTOR
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:21062266
    reference_title: "Dermatological findings in 61 mutation-positive individuals with cardiofaciocutaneous syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ulerythema ophryogenes was common, occurring in 90% (55/61)."
    explanation: Quantifies ulerythema ophryogenes as a highly frequent dermatologic finding in a mutation-positive cardiofaciocutaneous syndrome cohort.
  - reference: PMID:30141192
    reference_title: "Dermatological manifestations in cardiofaciocutaneous syndrome: a prospective multicentric study of 45 mutation-positive patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Keratosis pilaris (KP), ulerythema ophryogenes (UO), palmoplantar
      hyperkeratosis (PPHK) and multiple melanocytic naevi (MMN; over 50
      naevi) were noted in 82%, 44%, 27% and 29% of patients, respectively.
    explanation: An independent prospective cohort confirms ulerythema ophryogenes as a frequent (44%) dermatologic feature of cardiofaciocutaneous syndrome.
  - reference: PMID:36541891
    reference_title: "Dermatological manifestations, management, and care in RASopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They can affect dermis and epidermis, causing pigmented lesions
      (melanocytic nevi, café-au-lait spots, and lentigines), hyperkeratosis
      (keratosis pilaris, ulerythema ophryogenes, and palmoplantar keratosis)
      or hyperplasia.
    explanation: Review confirms ulerythema ophryogenes/keratosis pilaris as a recognized dermatologic hallmark across the RASopathies.
pathophysiology:
- name: Follicular Keratinocyte Hyperproliferation and Plugging
  description: >-
    Across the genetically heterogeneous KPA spectrum, the proximal shared
    lesion is abnormal follicular keratinocyte differentiation, causing
    hyperkeratotic plugging of the follicular infundibulum and the clinical
    finding of hyperkeratotic follicular papules.
  cell_types:

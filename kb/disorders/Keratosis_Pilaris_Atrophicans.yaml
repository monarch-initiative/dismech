- name: LRP1 Loss of Function and Impaired Endocytic Receptor Signaling
  description: >-
    In the LRP1-associated autosomal recessive KPA family, a homozygous LRP1
    missense variant markedly reduces LRP1 mRNA/protein levels and
    LRP1-mediated endocytic uptake in patient fibroblasts. LRP1 is a
    multifunctional endocytic and immune-regulatory receptor, and its loss is
    proposed to contribute to the inflammatory component of the disease.
  genes:
  - preferred_term: LRP1
    term:
      id: hgnc:6692
      label: LRP1
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  molecular_functions:
  - preferred_term: low-density lipoprotein particle receptor activity
    term:
      id: GO:0005041
      label: low-density lipoprotein particle receptor activity
    modifier: LOSS_OF_FUNCTION
  biological_processes:
  - preferred_term: receptor-mediated endocytosis
    term:
      id: GO:0006898
      label: receptor-mediated endocytosis
    modifier: DECREASED
  evidence:
  - reference: PMID:26142438
    reference_title: "Whole exome sequencing identifies LRP1 as a pathogenic gene in autosomal recessive keratosis pilaris atrophicans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The LRP1 mRNA and LRP1 protein levels in fibroblasts of affected
      individuals were markedly reduced when compared with controls.
      Similarly, the LRP1-mediated cellular uptake of alpha(2)M was reduced in
      patient fibroblasts.
    explanation: Functional assays demonstrate loss of LRP1 expression and receptor-mediated endocytic uptake in patient cells.
  - reference: PMID:26142438
    reference_title: "Whole exome sequencing identifies LRP1 as a pathogenic gene in autosomal recessive keratosis pilaris atrophicans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The inflammatory characteristics of the KPA entity in our family
      suggest a link to the immune-regulatory functions of LRP1.
    explanation: Authors propose LRP1's immune-regulatory role links its loss of function to the inflammatory phenotype.
  downstream:
  - target: Perifollicular Inflammation
    description: Loss of LRP1 immune-regulatory function is proposed to promote perifollicular inflammation.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: RAS-MAPK Pathway Dysregulation (RASopathy Context)
  description: >-
    In individuals with cardiofaciocutaneous or Noonan syndrome, germline
    gain-of-function RAS-MAPK pathway variants (e.g. BRAF, MAP2K1, MAP2K2,
    KRAS, PTPN11) drive constitutive Ras/MAPK signaling in developing skin and
    pilosebaceous units, producing ulerythema ophryogenes/keratosis pilaris
    atrophicans faciei as a dermatologic manifestation of the underlying
    RASopathy rather than of an independent follicular disease process (see
    kb/groupings/RASopathies.yaml).
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: Ras protein signal transduction
    term:
      id: GO:0007265

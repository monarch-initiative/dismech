prevalence:
- population: Global reported cases and families
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Kufor-Rakeb syndrome is a rare autosomal recessive form of juvenile- or
    very early-onset parkinsonism (<30 years) described primarily in isolated
    families and case reports across diverse populations, without formal
    population-based prevalence denominators.
  evidence:
  - reference: PMID:22166450
    reference_title: "Autosomal recessive parkinsonism."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mutations in other genes, including ATP13A2 (PARK9), PLA2G6 (PARK14), and FBX07 (PARK15), cause more rare forms of recessive parkinsonism with very early-onset (<30 years) and usually additional, atypical features (pyramidal, dystonic, ocular movement, and cognitive disturbances).
    explanation: >-
      Characterizes ATP13A2-related parkinsonism (PARK9) as a rare form of
      autosomal recessive very early-onset parkinsonism compared with PRKN,
      PINK1, and DJ-1 disease.
  - reference: PMID:41306646
    reference_title: "Kufor-Rakeb Syndrome in a Guatemalan Patient With an ATP13A2 Gene Pathogenic Variant: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Juvenile-onset forms are rare and can be caused by biallelic mutations in several genes. Kufor-Rakeb syndrome (KRS) is an autosomal-recessive form of early-onset parkinsonism caused by pathogenic variants in the ATP13A2 (PARK9) gene.
    explanation: >-
      Supports the rarity of juvenile-onset autosomal recessive parkinsonism
      including Kufor-Rakeb syndrome.
progression:
- phase: Onset
  age_range: Juvenile to young adult (<30 years; reported sibling onset at ages 23 and 27 years)
  notes: >-
    Typically presents in adolescence or young adulthood (<30 years) with
    levodopa-responsive or atypical parkinsonism accompanied by pyramidal and
    ocular motility signs.
  evidence:
  - reference: PMID:22166450
    reference_title: "Autosomal recessive parkinsonism."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mutations in other genes, including ATP13A2 (PARK9), PLA2G6 (PARK14), and FBX07 (PARK15), cause more rare forms of recessive parkinsonism with very early-onset (<30 years) and usually additional, atypical features (pyramidal, dystonic, ocular movement, and cognitive disturbances).
    explanation: >-
      Documents very early onset (<30 years) as characteristic of ATP13A2
      (PARK9) recessive parkinsonism.
  - reference: PMID:29966207
    reference_title: "Kufor-Rakeb Syndrome/PARK9: One Novel and One Possible Recurring Ashkenazi ATP13A2 Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two affected siblings (born to non-consanguineous Jewish parents) presenting a similar KRS phenotype (onset age 27, 23), carried compound heterozygous pathogenic variants in ATP13A2: c.217_218insG and c.3057delC.
    explanation: >-
      Provides specific young-adult onset ages (23 and 27 years) in confirmed
      ATP13A2-related Kufor-Rakeb syndrome.
- phase: Progressive neurodegenerative course
  age_range: Adolescence through adulthood
  notes: >-
    Follows a progressive neurodegenerative course involving motor decline,
    cognitive impairment, and neuropsychiatric symptoms including behavioral
    outbursts and psychosis.
  evidence:
  - reference: PMID:41306646
    reference_title: "Kufor-Rakeb Syndrome in a Guatemalan Patient With an ATP13A2 Gene Pathogenic Variant: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we present the first documented Guatemalan case of KRS, a young woman with progressive motor and cognitive decline.
    explanation: >-
      Documents progressive motor and cognitive decline over the disease course.
  - reference: PMID:31232173
    reference_title: "Successful treatment of psychosis in a patient with Kufor-Rakeb syndrome with low dose aripiprazole: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present a case of a 32-year-old male with Kufor-Rakeb syndrome (KRS), a form of juvenile parkinsonism due to mutations of the ATP13A2 gene at PARK9 locus. The patient was seen for daily behavioral outbursts and psychotic symptoms.
    explanation: >-
      Illustrates progression from juvenile-onset parkinsonism to adult
      behavioral and psychotic complications by age 32 years.
pathophysiology:
- name: ATP13A2 loss impairs lysosomal polyamine transport
  description: >-
    ATP13A2 is a lysosomal P5B-ATPase that transports polyamines. In Kufor-Rakeb
    syndrome, loss-of-function ATP13A2 variants impair endolysosomal polyamine
    transport, producing lysosomal dysfunction and creating a mechanistic basis
    for neurodegeneration.

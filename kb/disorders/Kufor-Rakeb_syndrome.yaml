differential_diagnoses:
- name: Hereditary spastic paraplegia
  description: >-
    Complicated hereditary spastic paraplegia (including ATP13A2-related SPG78)
    overlaps clinically and genetically with Kufor-Rakeb syndrome when lower-limb
    spasticity, pyramidal weakness, cognitive decline, and supranuclear gaze
    palsy predominate, whereas prominent juvenile-onset levodopa-responsive
    parkinsonism favors classic Kufor-Rakeb syndrome along the ATP13A2 clinical
    continuum.
  distinguishing_features:
  - Predominant progressive lower-limb spastic paraplegia without levodopa-responsive parkinsonism favors complicated hereditary spastic paraplegia (SPG78).
  - Prominent juvenile- or young-onset extrapyramidal parkinsonism alongside pyramidal spasticity, supranuclear gaze palsy, and facial-faucial-finger mini-myoclonus favors Kufor-Rakeb syndrome.
  disease_term:
    preferred_term: hereditary spastic paraplegia
    term:
      id: MONDO:0019064
      label: hereditary spastic paraplegia
  evidence:
  - reference: PMID:28137957
    reference_title: "Loss-of-function mutations in the ATP13A2/PARK9 gene cause complicated hereditary spastic paraplegia (SPG78)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study adds complicated hereditary spastic paraplegia (SPG78) to the clinical continuum of ATP13A2-associated neurological disorders, which are commonly hallmarked by lysosomal and mitochondrial dysfunction."
    explanation: >-
      Establishes complicated hereditary spastic paraplegia as a key differential
      and phenotypic continuum disorder alongside Kufor-Rakeb syndrome.
  - reference: PMID:40560206
    reference_title: "Experience in the clinical and genetic diagnosis of a series of Algerian patients with hereditary spastic paraplegias."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In one family, reverse phenotyping revealed a case of Kufor-Rakeb syndrome after ATP13A2 variants were identified, showing the importance of dialogue between clinicians and geneticists."
    explanation: >-
      Demonstrates that Kufor-Rakeb syndrome can initially present inside a
      hereditary spastic paraplegia diagnostic cohort and requires clinical
      re-evaluation to distinguish from isolated HSP.
- name: Wilson disease
  description: >-
    Wilson disease is an autosomal recessive disorder of copper metabolism
    caused by biallelic pathogenic variants in ATP7B that represents a key
    treatable differential diagnosis in patients presenting with juvenile- or
    early-onset dystonia-parkinsonism and neuropsychiatric disturbances.
  distinguishing_features:
  - Biallelic ATP7B pathogenic variants, low serum ceruloplasmin, low total serum copper, increased urinary copper excretion, hepatic involvement, and corneal Kayser-Fleischer rings favor Wilson disease.
  - Biallelic ATP13A2 pathogenic variants with normal copper metabolism parameters, supranuclear upgaze palsy, and facial-faucial-finger mini-myoclonus favor Kufor-Rakeb syndrome.
  disease_term:
    preferred_term: Wilson disease
    term:
      id: MONDO:0010200
      label: Wilson disease
  evidence:
  - reference: PMID:23649720
    reference_title: "Phenomenology and classification of dystonia: a consensus update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Dystonia-parkinsonism syndromes encompass more common conditions as well as rarer forms 36–38. Of notable interest are: dopa-responsive dystonia (DRD), Wilson’s disease, Parkin-, PINK1-, and DJ-1-associated parkinsonism(PARK2, 6, and 7), X-linked dystonia-parkinsonism/Lubag(DYT3), rapid-onset dystonia-parkinsonism (DYT12) and neurodegeneration with brain iron accumulation (NBIA, including PANK2-and PLA2G6-associated neurodegeneration, neuroferritinopathy, and others)."
    explanation: >-
      Identifies Wilson disease alongside early-onset recessive parkinsonism and
      neurodegeneration with brain iron accumulation (NBIA) as a key inherited
      dystonia-parkinsonism differential diagnosis.
  - reference: PMID:20301685
    reference_title: "Wilson Disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnosis of Wilson disease is established in most instances by a combination of biochemical findings (low serum ceruloplasmin concentration, low serum concentration of total copper, and increased urinary copper excretion) and/or detection of biallelic pathogenic (or likely pathogenic) variants in ATP7B identified by molecular genetic testing"
    explanation: >-
      Establishes the copper-metabolism biochemical abnormalities and biallelic
      ATP7B variants that distinguish Wilson disease from ATP13A2-related
      Kufor-Rakeb syndrome.
- name: Neuronal ceroid lipofuscinosis
  description: >-
    Neuronal ceroid lipofuscinosis (including the allelic ATP13A2-related CLN12
    presentation, anchored here to the group term MONDO:0016295 because OMIM
    #606693 merges CLN12 with Kufor-Rakeb syndrome) is a neurodegenerative
    lysosomal storage disorder defined histologically by intracellular
    accumulation of autofluorescent lipopigments, vacuolated lymphocytes, and
    fingerprint-like profiles on nerve and muscle biopsy, with strong clinical
    overlap with Kufor-Rakeb syndrome.
  distinguishing_features:
  - Histological demonstration of vacuolated lymphocytes, cytoplasmic autofluorescent lipopigments, and fingerprint-like profiles in nerve and muscle biopsy defines neuronal ceroid lipofuscinosis (CLN12), which clinically combines extrapyramidal, pyramidal, and cerebellar involvement with cognitive deficits, peripheral neuropathy, and slow vertical eye movements.
  - Prominent juvenile-onset levodopa-responsive parkinsonism with pyramidal spasticity, supranuclear upgaze palsy, and facial-faucial-finger mini-myoclonus without diagnostic lipopigment storage biopsy findings favors classic Kufor-Rakeb syndrome.
  disease_term:
    preferred_term: neuronal ceroid lipofuscinosis
    term:
      id: MONDO:0016295
      label: neuronal ceroid lipofuscinosis
  evidence:
  - reference: PMID:22388936
    reference_title: "Mutation of the parkinsonism gene ATP13A2 causes neuronal ceroid-lipofuscinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in ATP13A2 are a known cause of Kufor-Rakeb syndrome (KRS), a rare parkinsonian phenotype with juvenile onset. These data show that NCL and KRS may share etiological features and implicate the lysosomal pathway in Parkinson's disease."
    explanation: >-
      Demonstrates that neuronal ceroid lipofuscinosis and Kufor-Rakeb syndrome
      are allelic ATP13A2 disorders with shared lysosomal etiology.
  - reference: PMID:28137957
    reference_title: "Loss-of-function mutations in the ATP13A2/PARK9 gene cause complicated hereditary spastic paraplegia (SPG78)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular defects in this gene have been causally associated with Kufor-Rakeb syndrome (#606693), an autosomal recessive form of juvenile-onset parkinsonism, and neuronal ceroid lipofuscinosis (#606693), a neurodegenerative disorder characterized by the intracellular accumulation of autofluorescent lipopigments."
    explanation: >-
      Contrasts the juvenile-onset parkinsonian presentation of Kufor-Rakeb
      syndrome with the intracellular autofluorescent lipopigment storage that
      defines ATP13A2-related neuronal ceroid lipofuscinosis.
  - reference: PMID:28137957
    reference_title: "Loss-of-function mutations in the ATP13A2/PARK9 gene cause complicated hereditary spastic paraplegia (SPG78)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "More recently, ATP13A2 mutations were identified in a single kindred with neuronal ceroid lipofuscinosis (NCL) (Farias et al., 2011; Bras et al., 2012; Schultheis et al., 2013), histologically defined by the presence of vacuolated lymphocytes, cytoplasmic positive autofluorescent lipopigments and fingerprint-like profiles in nerve and muscle biopsy (Tome et al., 1985). The clinical presentation in this family showed strong overlap with KRS and was characterized by combined extrapyramidal, pyramidal and cerebellar involvement, accompanied by cognitive deficits, peripheral neuropathy and slow vertical eye movements (Bras et al., 2012)."
    explanation: >-
      Details the biopsy findings (vacuolated lymphocytes, autofluorescent
      lipopigments, fingerprint-like profiles) and overlapping extrapyramidal,
      pyramidal, cerebellar, neuropathic, cognitive, and oculomotor clinical
      features in the ATP13A2-related CLN12 kindred.
- name: Autosomal recessive juvenile Parkinson disease 2
  description: >-
    Autosomal recessive juvenile Parkinson disease 2 (PARK2), caused by
    biallelic mutations in PRKN (parkin), presents with early-onset
    levodopa-responsive parkinsonism and a relatively benign course, lacking the
    atypical pyramidal, oculomotor, dystonic, and cognitive manifestations
    characteristic of ATP13A2-related Kufor-Rakeb syndrome.
  distinguishing_features:
  - Early-onset levodopa-responsive parkinsonism with a benign course and absence of pyramidal tract signs, supranuclear gaze palsy, or early cognitive decline favors PRKN (PARK2)-related autosomal recessive juvenile Parkinson disease 2.
  - Very early-onset (<30 years) parkinsonism accompanied by pyramidal spasticity, dystonia, supranuclear gaze palsy, facial-faucial-finger mini-myoclonus, and cognitive decline favors Kufor-Rakeb syndrome (PARK9).
  disease_term:
    preferred_term: autosomal recessive juvenile Parkinson disease 2
    term:
      id: MONDO:0010820
      label: autosomal recessive juvenile Parkinson disease 2
  evidence:
  - reference: PMID:22166450
    reference_title: "Autosomal recessive parkinsonism."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The phenotype of parkin mutations is characterized by early-onset parkinsonism, good response to levodopa, and benign course. The average onset age is in the 30s, but late-onset cases have been described."
    explanation: >-
      Directly characterizes PRKN (parkin / PARK2)-related autosomal recessive
      juvenile Parkinson disease 2 as early-onset levodopa-responsive
      parkinsonism with a benign course.
  - reference: PMID:22166450
    reference_title: "Autosomal recessive parkinsonism."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In three forms, caused by mutations in parkin (PARK2), PINK1 (PARK6), or DJ-1 (PARK7), the phenotype is usually characterized by levodopa-responsive parkinsonism without atypical features."
    explanation: >-
      Notes that PRKN (PARK2)-related parkinsonism (grouped by the review with
      PINK1 and DJ-1) presents as levodopa-responsive parkinsonism without
      atypical neurological signs.
  - reference: PMID:22166450
    reference_title: "Autosomal recessive parkinsonism."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Mutations in other genes, including ATP13A2 (PARK9), PLA2G6 (PARK14), and FBX07 (PARK15), cause more rare forms of recessive parkinsonism with very early-onset (<30 years) and usually additional, atypical features (pyramidal, dystonic, ocular movement, and cognitive disturbances)."
    explanation: >-
      Distinguishes ATP13A2-associated Kufor-Rakeb syndrome (PARK9) from PRKN
      (PARK2)-related juvenile parkinsonism by the presence of pyramidal,
      dystonic, ocular movement, and cognitive disturbances.

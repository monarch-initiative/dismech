    explanation: Enumerates the non-specific structural brain abnormalities that define the disorder.
  - reference: PMID:34894355
    reference_title: "Terminal 6q deletions cause brain malformations, a phenotype mimicking heterozygous DLL1 pathogenic variants: A multicenter retrospective case series."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "deletions of the 6q27 region involving the DLL1 gene in fetuses with these malformations"
    explanation: >-
      The structural brain malformations in a fetal 6q27-terminal-deletion
      series are consistent with a contribution of DLL1 loss. These are
      contiguous-gene deletions that remove many genes besides DLL1, so this
      is supporting context for the convergence of brain malformations on the
      6q27/DLL1 locus, not direct evidence that DLL1 loss alone drives them.

- name: Somite Segmentation Defect
  description: >-
    Oscillatory DLL1 expression is essential for somite segmentation. Reduced
    DLL1 dosage at critical developmental times disrupts somitogenesis,
    producing vertebral segmentation defects and scoliosis; reduced Dll1
    expression is associated with scoliosis and vertebral defects in mice.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: somitogenesis
    modifier: DYSREGULATED
    term:
      id: GO:0001756
      label: somitogenesis
  downstream:
  - target: Scoliosis
    causal_link_type: DIRECT
  - target: Vertebral segmentation defect
    causal_link_type: DIRECT
  - target: Kyphosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:31353024
    reference_title: "Haploinsufficiency of the Notch Ligand DLL1 Causes Variable Neurodevelopmental Disorders."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "Oscillatory expression of DLL1 is essential for somite segmentation in vivo."
    explanation: Establishes the developmental role of DLL1 oscillation in somite segmentation.
  - reference: PMID:31353024
    reference_title: "Haploinsufficiency of the Notch Ligand DLL1 Causes Variable Neurodevelopmental Disorders."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "reduced Dll1 expression in mice is associated with scoliosis and mild vertebral defects"
    explanation: Mouse dosage-reduction data link reduced DLL1 to scoliosis and vertebral defects.
  - reference: PMID:31353024
    reference_title: "Haploinsufficiency of the Notch Ligand DLL1 Causes Variable Neurodevelopmental Disorders."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four individuals in our cohort had scoliosis, and one had a segmentation defect of the spine."
    explanation: Documents scoliosis and vertebral segmentation defects in the patient cohort.


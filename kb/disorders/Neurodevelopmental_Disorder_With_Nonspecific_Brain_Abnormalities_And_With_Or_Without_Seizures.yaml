name: Neurodevelopmental Disorder With Nonspecific Brain Abnormalities And With Or Without Seizures
creation_date: "2026-10-25T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: DLL1-related neurodevelopmental disorder
  term:
    id: MONDO:0032877
    label: neurodevelopmental disorder with nonspecific brain abnormalities and with or without seizures
synonyms:
- DLL1-related neurodevelopmental disorder
- NEDBAS
- DLL1 haploinsufficiency disorder
description: >-
  An autosomal dominant neurodevelopmental disorder caused by heterozygous
  loss-of-function variants in DLL1, which encodes Delta-like canonical Notch
  ligand 1. Haploinsufficiency of this Notch pathway ligand disrupts
  Notch-dependent neural development. The phenotype is variable and includes
  developmental delay and intellectual disability, autism spectrum disorder,
  seizures, muscular hypotonia, non-specific structural brain abnormalities on
  MRI, and skeletal features such as scoliosis and vertebral segmentation
  defects. First delineated by Fischer-Zirnsak et al. (2019) in 15 individuals
  from 12 unrelated families (OMIM:618709).
references:
- reference: PMID:31353024
  title: "Haploinsufficiency of the Notch Ligand DLL1 Causes Variable Neurodevelopmental Disorders."
- reference: PMID:34894355
  title: "Terminal 6q deletions cause brain malformations, a phenotype mimicking heterozygous DLL1 pathogenic variants: A multicenter retrospective case series."

pathophysiology:
- name: DLL1 Haploinsufficiency
  description: >-
    Heterozygous loss-of-function variants in DLL1 (nonsense, splice-site,
    missense in the DSL domain, and whole-gene deletion) reduce the functional
    dosage of the Delta-like 1 Notch ligand. Premature stop codons are predicted
    to trigger nonsense-mediated decay, and DLL1 is strongly constrained against
    loss of function (gnomAD pLI = 1.0), indicating that one functional copy is
    insufficient.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HETEROZYGOUS
  molecular_functions:
  - preferred_term: Notch ligand (Notch binding) activity
    modifier: DECREASED
    term:
      id: GO:0005112
      label: Notch binding
  downstream:
  - target: Reduced DLL1 Notch Ligand Dosage
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:31353024
    reference_title: "Haploinsufficiency of the Notch Ligand DLL1 Causes Variable Neurodevelopmental Disorders."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "This method identified 15 individuals from 12 unrelated families with heterozygous pathogenic DLL1 variants (nonsense, missense, splice site, and one whole gene deletion)."
    explanation: Documents the heterozygous loss-of-function allelic spectrum underlying the disorder.
  - reference: PMID:31353024
    reference_title: "Haploinsufficiency of the Notch Ligand DLL1 Causes Variable Neurodevelopmental Disorders."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: COMPUTATIONAL
    snippet: "No LoF variants in DLL1 are reported in control cohorts, indicating intolerance to LoF (gnomAD pLI score = 1.0)."
    explanation: Population-constraint analysis shows DLL1 is intolerant to loss of function, supporting a haploinsufficiency mechanism.
  - reference: PMID:31353024
    reference_title: "Haploinsufficiency of the Notch Ligand DLL1 Causes Variable Neurodevelopmental Disorders."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: COMPUTATIONAL
    snippet: "All predicted premature stop codons are located before the penultimate exon and probably cause nonsense-mediated decay"
    explanation: Predicts nonsense-mediated decay of truncating alleles, the molecular basis of reduced ligand dosage.

- name: Reduced DLL1 Notch Ligand Dosage
  description: >-
    The reduced amount of functional Delta-like 1 lowers the availability of
    this transmembrane ligand in the tissues where DLL1 drives Notch signaling:
    the neural progenitor compartment of the developing brain, and the
    presomitic mesoderm during somite segmentation. DLL1 is highly expressed in
    neuronal precursor cells during embryogenesis, and Notch output is highly
    sensitive to relative ligand dosage. This dosage reduction therefore feeds
    both a neural and a paraxial-mesoderm branch of the pathology.
  biological_scale: MOLECULAR
  downstream:
  - target: Impaired Notch Signaling in Neural Progenitors
    causal_link_type: DIRECT
  - target: Somite Segmentation Defect
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:31353024
    reference_title: "Haploinsufficiency of the Notch Ligand DLL1 Causes Variable Neurodevelopmental Disorders."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "DLL1 (MIM: 606582) is highly expressed in neuronal precursor cells during embryogenesis."
    explanation: Establishes that DLL1 is the relevant Notch ligand in the neural progenitor compartment where dosage is reduced.

- name: Impaired Notch Signaling in Neural Progenitors
  description: >-
    Lower DLL1 ligand dosage reduces trans-activation of Notch receptors on
    neighboring cells. Cell-cell contact-mediated Notch receptor-ligand
    interaction normally releases the Notch intracellular domain, which enters
    the nucleus and drives target-gene transcription; reduced ligand attenuates
    this signaling and disrupts the lateral-inhibition and oscillatory output
    that patterns neural tissue.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  biological_processes:
  - preferred_term: Notch signaling pathway
    modifier: DECREASED
    term:
      id: GO:0007219
      label: Notch signaling pathway
  downstream:
  - target: Dysregulated Neuronal Differentiation
    causal_link_type: DIRECT
  - target: Aberrant Neuronal Migration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:31353024
    reference_title: "Haploinsufficiency of the Notch Ligand DLL1 Causes Variable Neurodevelopmental Disorders."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "Cell-cell contact-mediated Notch receptor-ligand interactions release the Notch intracellular domain (NICD), which enters the nucleus and stimulates transcription of target genes."
    explanation: Describes the Notch signaling step that is attenuated when ligand dosage falls.

- name: Dysregulated Neuronal Differentiation
  description: >-
    DLL1 regulates neuronal differentiation through oscillatory expression and
    lateral inhibition, whereby differentiating neurons restrain neighboring
    progenitors from differentiating. Reduced Notch output releases this
    inhibition; in model systems, loss of Dll1 increases neuronal
    differentiation and causes CNS hyperplasia with excess neurons.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: neuron differentiation
    modifier: INCREASED
    term:
      id: GO:0030182
      label: neuron differentiation
  downstream:
  - target: Disordered Brain Morphogenesis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:31353024
    reference_title: "Haploinsufficiency of the Notch Ligand DLL1 Causes Variable Neurodevelopmental Disorders."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "It regulates neuronal differentiation through oscillation and lateral inhibition such that differentiating neurons inhibit neighboring cells from undergoing neuronal differentiation by expressing Notch signals in an oscillatory manner."
    explanation: Establishes the lateral-inhibition mechanism by which reduced DLL1 dysregulates neuronal differentiation.
  - reference: PMID:31353024
    reference_title: "Haploinsufficiency of the Notch Ligand DLL1 Causes Variable Neurodevelopmental Disorders."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: "loss of Dll1 in mice increases neuronal differentiation and causes CNS hyperplasia and an increased number of neurons"
    explanation: Mouse loss-of-function data show excess neuronal differentiation when DLL1 is reduced.

- name: Aberrant Neuronal Migration
  description: >-
    Attenuated Notch signaling is proposed to disturb neuronal migration. The
    authors hypothesize that the periventricular nodular heterotopia seen in a
    patient reflects aberrant neuronal migration caused by DLL1
    haploinsufficiency.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: neuron migration
    modifier: ABNORMAL
    term:
      id: GO:0001764
      label: neuron migration
  downstream:
  - target: Periventricular nodular heterotopia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Disordered Brain Morphogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:31353024
    reference_title: "Haploinsufficiency of the Notch Ligand DLL1 Causes Variable Neurodevelopmental Disorders."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "that we hypothesize is due to aberrant neuronal migration caused by DLL1 haploinsufficiency"
    explanation: States the authors' mechanistic hypothesis linking DLL1 haploinsufficiency to a neuronal-migration defect (periventricular nodular heterotopia).

- name: Disordered Brain Morphogenesis
  description: >-
    Notch signaling forms cellular fields and influences brain morphogenesis, so
    reduced DLL1 dosage disrupts brain development and produces non-specific
    structural brain abnormalities together with the neurodevelopmental features
    of the disorder. Overlapping brain malformations are seen with 6q27
    deletions involving DLL1.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: brain development
    modifier: ABNORMAL
    term:
      id: GO:0007420
      label: brain development

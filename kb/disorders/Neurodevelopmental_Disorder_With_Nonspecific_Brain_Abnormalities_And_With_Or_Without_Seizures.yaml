genetic:
- name: DLL1
  gene_term:
    preferred_term: DLL1
    term:
      id: hgnc:2908
      label: DLL1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Heterozygous loss-of-function variants in DLL1 cause the disorder by
    haploinsufficiency. The spectrum comprises nonsense, canonical splice-site,
    and missense variants plus a whole-gene deletion; variants are de novo in
    some families and inherited from an affected parent in others. The single
    missense variant (p.Cys179Phe) affects a conserved cysteine of the DSL
    domain and is predicted to disrupt folding and Notch signaling. No external
    gene-disease validity classification (e.g. ClinGen) was located for this
    pair at curation time; evidence rests on the Fischer-Zirnsak cohort.
  evidence:
  - reference: PMID:31353024
    reference_title: "Haploinsufficiency of the Notch Ligand DLL1 Causes Variable Neurodevelopmental Disorders."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "This method identified 15 individuals from 12 unrelated families with heterozygous pathogenic DLL1 variants (nonsense, missense, splice site, and one whole gene deletion)."
    explanation: Establishes DLL1 as the causative gene and the heterozygous allelic spectrum.
  - reference: PMID:31353024
    reference_title: "Haploinsufficiency of the Notch Ligand DLL1 Causes Variable Neurodevelopmental Disorders."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variants were de novo in seven individuals; four individuals inherited the variants from an affected parent and inheritance is unknown in five individuals due to incomplete parental testing."
    explanation: Documents de novo and dominantly inherited transmission consistent with autosomal dominant inheritance.
  - reference: PMID:31353024
    reference_title: "Haploinsufficiency of the Notch Ligand DLL1 Causes Variable Neurodevelopmental Disorders."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "it is possible that the variant p.Cys179Phe affects correct folding of the DSL domain of DLL1 and interferes with physiological Notch signaling."
    explanation: Interprets the one missense variant as a loss-of-function allele via disrupted DSL-domain folding.


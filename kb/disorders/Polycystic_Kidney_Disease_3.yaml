name: Polycystic Kidney Disease 3
creation_date: "2026-08-29T00:00:00Z"
category: Mendelian
synonyms:
- PKD3
- APKD3
- polycystic kidney disease 3
- polycystic kidney disease type 3
- polycystic kidney disease, adult, type 3
- polycystic kidney disease 3 with or without polycystic liver disease
- autosomal dominant polycystic kidney disease caused by mutation in GANAB
description: >-
  Polycystic kidney disease 3 is the GANAB form of autosomal dominant polycystic
  kidney disease. Its clinical signature is an inversion of the usual ADPKD
  picture: kidney disease is mild and often does not progress to end-stage renal
  disease, while liver involvement is variable and can be severe. Some families
  present as polycystic liver disease with few or no renal cysts at all, so the
  same gene sits on both sides of a boundary that used to separate two disorders.

  The mechanism explains the inversion. GANAB encodes the alpha subunit of
  glucosidase II, an endoplasmic-reticulum enzyme that trims N-linked glycans
  during glycoprotein quality control. It is not part of the polycystin complex.
  What it does is allow polycystin-1 to mature and reach the cell surface and the
  primary cilium, so the lesion sits one step upstream of the PKD1 and PKD2
  lesions rather than alongside them. In GANAB-null cells, glucosidase II alpha is
  absolutely required for maturation and surface and ciliary localisation of both
  polycystin-1 and polycystin-2, and cells carrying a single functional copy show
  reduced mature polycystin-1. Wild-type but not mutant protein rescues the
  defect. Cystogenesis is therefore driven by defective polycystin-1 maturation
  rather than by loss of the channel complex itself.

  That upstream position is also why GANAB belongs to a group the polycystin
  genes do not. Its partner subunit, glucosidase II beta, is encoded by PRKCSH,
  a long-established polycystic liver disease gene, and independent work placed
  GANAB alongside SEC63, ALG8 and SEC61B as endoplasmic-reticulum protein
  biogenesis genes whose loss impairs polycystin-1 maturation. The unifying
  claim is that these are modulators of polycystin-1 rather than second copies
  of it, and that the amount of correctly folded polycystin-1 a cell achieves is
  what sets where a patient lands on the kidney-to-liver spectrum.

  Clinically the practical consequence is about expectations and therapy. ADPKD
  management is organised around rapid progressors, and vasopressin V2 receptor
  antagonism is approved for rapidly progressive disease. A GANAB patient is
  characteristically not that patient, so importing the standard ADPKD
  trajectory would misinform counselling in the direction of unwarranted alarm
  about the kidneys and unwarranted reassurance about the liver.

notes: >-
  Scope and lump/split note. This is curated as a standalone entry rather than a
  has_subtypes entry on Autosomal_Dominant_Polycystic_Kidney_Disease, following
  the precedent set by Polycystic_Kidney_Disease_2, which is likewise a
  gene-specific ADPKD form with its own MONDO term and its own entry. Two things
  justify it here beyond precedent: the lesion is mechanistically upstream of the
  polycystin complex rather than in it, and the clinical trajectory is inverted
  relative to PKD1 and PKD2, with mild kidney and potentially severe liver
  disease. The parent entry already lists GANAB in its genetic block as an
  ADPKD-spectrum gene; that record and this entry should be read together, and
  nothing here contradicts it.

  Phenotype sourcing discipline. The GeneReviews chapter for this disease is
  written for ADPKD as a whole and names GANAB only among the less common
  associated genes. Its Clinical Characteristics section therefore describes the
  PKD1-dominated picture: bilateral kidney cysts progressing to end-stage kidney
  disease in about half of patients by age 60, intracranial aneurysms, and the
  wider extrarenal spectrum. Those are deliberately not imported here as GANAB
  phenotypes. Only features the GANAB literature itself reports are curated as
  phenotypes of this entry; the ADPKD-general material is used for management and
  surveillance, where it does apply to a GANAB patient who has cysts, and is
  labelled as such in each case.

  No intracranial aneurysm phenotype. It is a cardinal ADPKD extrarenal feature
  and its absence here is deliberate rather than an oversight: no GANAB-specific
  report in the reference cache describes it, the reported cohort is small, and
  curating it from the ADPKD-general chapter would be exactly the import this
  entry is trying to avoid. It is recorded as a knowledge gap instead.
pathophysiology:
- name: GANAB Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Heterozygous loss-of-function variants in GANAB, mostly truncating, reduce
    the dose of glucosidase II alpha. The gene was found by whole-exome
    sequencing of genetically unresolved ADPKD families and confirmed by Sanger
    screening of a further 321 families, yielding nine families and twenty
    affected individuals across both ADPKD and autosomal dominant polycystic
    liver disease presentations.
  gene:
    preferred_term: GANAB
    description: >-
      Encodes glucosidase II subunit alpha, the catalytic subunit of the
      endoplasmic-reticulum enzyme required for polycystin-1 maturation.
    modifier: DECREASED
    term:
      id: hgnc:4138
      label: GANAB
  genetic_context:
    gene:
      preferred_term: GANAB
      term:
        id: hgnc:4138
        label: GANAB
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Heterozygous loss-of-function alleles, predominantly truncating, in a gene
      whose reduced dose is sufficient to impair polycystin-1 maturation.
  molecular_functions:
  - preferred_term: glucosidase activity
    term:
      id: GO:0015926
      label: glucosidase activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  evidence:
  - reference: PMID:27259053
    reference_title: "Mutations in GANAB, Encoding the Glucosidase IIα Subunit, Cause Autosomal-Dominant Polycystic Kidney and Liver Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sanger screening of 321 additional GUR families identified eight further
      likely mutations (six truncating), and a total of 20 affected individuals
      were identified in seven ADPKD- and two ADPLD-affected families.
    explanation: >-
      Establishes the allele spectrum as predominantly truncating and the size of
      the cohort on which this disease concept rests.
  downstream:
  - target: Impaired Polycystin-1 Maturation and Trafficking
    causal_link_type: DIRECT
    description: >-
      Reduced glucosidase II alpha activity directly impairs the
      quality-control step polycystin-1 depends on.
    evidence:
    - reference: PMID:27259053
      reference_title: "Mutations in GANAB, Encoding the Glucosidase IIα Subunit, Cause Autosomal-Dominant Polycystic Kidney and Liver Disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Analysis of GANAB-null cells showed an absolute requirement of GIIα for
        maturation and surface and ciliary localization of the ADPKD proteins
        (PC1 and PC2), and reduced mature PC1 was seen in GANAB(+/-) cells.
      explanation: >-
        Demonstrates the requirement directly, and importantly shows the defect
        at heterozygous dose, which is the patient genotype.
- name: Impaired Polycystin-1 Maturation and Trafficking
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Polycystin-1 requires glucosidase II alpha to complete its
    endoplasmic-reticulum maturation and reach the cell surface and the primary
    cilium. Without it, the protein does not mature; with one functional copy,
    less mature protein is made. Rescue is allele-specific: wild-type glucosidase
    II alpha restores polycystin-1 surface localisation in null cells and mutant
    protein does not, which ties the cellular defect to the patient alleles
    rather than to the knockout alone.

    This is the step that distinguishes the disorder from PKD1 and PKD2. Those
    lesions remove or alter the polycystin complex itself; this one leaves the
    complex intact and starves it of correctly folded polycystin-1.
  biological_processes:
  - preferred_term: protein maturation
    term:
      id: GO:0051604
      label: protein maturation
    modifier: DECREASED
  - preferred_term: protein folding in endoplasmic reticulum
    term:
      id: GO:0034975
      label: protein folding in endoplasmic reticulum
    modifier: DECREASED
  cellular_components:
  - preferred_term: ciliary membrane
    term:
      id: GO:0060170
      label: ciliary membrane
  evidence:
  - reference: PMID:27259053
    reference_title: "Mutations in GANAB, Encoding the Glucosidase IIα Subunit, Cause Autosomal-Dominant Polycystic Kidney and Liver Disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      PC1 surface localization in GANAB(-/-) cells was rescued by wild-type, but
      not mutant, GIIa.
    explanation: >-
      Allele-specific rescue, which is what connects the cellular phenotype to
      the variants found in patients.
  - reference: PMID:28375157
    reference_title: Isolated polycystic liver disease genes define effectors of polycystin-1 function.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We inactivated these candidate genes in cell line models to show that loss
      of function of each results in defective maturation and trafficking of
      polycystin-1, the central determinant of cyst pathogenesis.
    explanation: >-
      Independent confirmation from a separate cohort and laboratory that GANAB
      loss impairs polycystin-1 maturation and trafficking.
  downstream:
  - target: Renal Cystogenesis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Reduced functional polycystin-1 at the cilium is the proximate cause of
      cyst formation, through the polycystin signalling pathway shared with PKD1
      and PKD2.
    evidence:
    - reference: PMID:27259053
      reference_title: "Mutations in GANAB, Encoding the Glucosidase IIα Subunit, Cause Autosomal-Dominant Polycystic Kidney and Liver Disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        the cystogenesis is most likely driven by defects in PC1 maturation
      explanation: >-
        States the causal chain from polycystin-1 maturation failure to
        cystogenesis. Quoted as the cystogenesis clause only, so that this
        in-vitro claim and the human-genetic claim in the same sentence are cited
        separately rather than sharing one quote with two gradings.
  - target: Hepatic Cystogenesis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The same maturation defect operates in biliary epithelium, where it
      produces the liver phenotype that dominates in many GANAB families.
    evidence:
    - reference: PMID:28375157
      reference_title: Isolated polycystic liver disease genes define effectors of polycystin-1 function.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Here, we have used whole exome sequencing in a discovery cohort of 102
        unrelated patients who were excluded for mutations in the 2 most common
        PCLD genes, PRKCSH and SEC63, to identify heterozygous loss-of-function
        mutations in 3 additional genes, ALG8, GANAB, and SEC61B.
      explanation: >-
        Identifies GANAB in an isolated polycystic liver disease cohort, showing
        the hepatic route is a primary presentation and not merely an ADPKD
        complication.
- name: Renal Cystogenesis
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Focal cysts form in the kidney, but the process is milder and slower than in
    PKD1 or PKD2 and frequently does not reach end-stage renal disease. The
    reported phenotype is explicitly characterised as mild polycystic kidney
    disease, which is the feature that most distinguishes this form clinically.
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  evidence:
  - reference: PMID:27259053
    reference_title: "Mutations in GANAB, Encoding the Glucosidase IIα Subunit, Cause Autosomal-Dominant Polycystic Kidney and Liver Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotype was mild PKD and variable, including severe, PLD.
    explanation: >-
      Characterises the renal phenotype as mild, which is the modal claim this
      node makes.
  - reference: PMID:40134995
    reference_title: "GANAB-Associated Severe Autosomal Dominant Polycystic Kidney Disease in an 18-Year-Old Female: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The GANAB gene mutation found in this patient is typically associated with
      mild kidney disease; however, according to the Mayo Clinic Imaging
      Classification (MIC) for ADPKD, our patient falls under Classification 1E,
      which is predictive of rapid progression to end-stage renal disease (ESRD).
    explanation: >-
      Qualifies rather than supports the mildness claim. A single reported patient
      fell in the highest-risk imaging class, so mild is the expectation and not a
      guarantee. Graded PARTIAL because one case cannot overturn the cohort
      characterisation, and equally cannot be dismissed by it.
- name: Hepatic Cystogenesis
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Liver cysts are variable and can be severe, and in some families dominate the
    presentation to the point that patients are ascertained as isolated
    polycystic liver disease with few or no renal cysts. This is the reverse of
    the usual ADPKD emphasis and is the practical reason a GANAB diagnosis
    changes surveillance.
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:27259053
    reference_title: "Mutations in GANAB, Encoding the Glucosidase IIα Subunit, Cause Autosomal-Dominant Polycystic Kidney and Liver Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The phenotype was mild PKD and variable, including severe, PLD.
    explanation: >-
      Establishes that liver disease is variable and may be severe, in contrast
      to the mild renal phenotype.
animal_models:
- name: Ganab heterozygous knockout mouse
  species: Mouse
  genotype: Ganab +/- (CRISPR-Cas9 targeted deletion, C57BL/6)
  publication: PMID:32550232
  description: >-
    CRISPR-Cas9 targeted deletion of Ganab in C57BL/6 mice. Homozygous deletion
    is embryonic lethal. Heterozygotes reduce Ganab protein by at least half,
    which is the human genotype, and develop no kidney or liver cysts, no tubular
    dilatation, no glomerular abnormality and no clinical phenotype. Notably,
    polycystin-1 and polycystin-2 expression in the heterozygous kidney was
    unaffected.
  evidence:
  - reference: PMID:32550232
    reference_title: Ganab Haploinsufficiency Does Not Cause Polycystic Kidney Disease or Polycystic Liver Disease in Mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To construct a mouse model of Ganab gene deletion, we analyzed the Ganab
      gene structure and designed two CRISPR-/Cas9-based targeting strategies.
    explanation: >-
      Establishes the model construction, which is what makes its negative result
      informative rather than merely absent.
  modeled_mechanisms:
  - target: Renal Cystogenesis
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The mouse heterozygote does not develop the human phenotype. This is a
      substantive negative result rather than a missing experiment: the authors
      conclude that Ganab haploinsufficiency does not cause cysts in mice and go
      further, questioning whether it is the causative gene at all.
    limitations: >-
      Two things limit how far the negative travels. Mouse and human differ in
      cyst susceptibility across the ADPKD genes generally, and mouse models of
      even PKD1 heterozygosity are notoriously slow and often require a second
      hit, so a null result at heterozygous dose in an unstressed mouse is weaker
      evidence against causation than it first appears. And the human evidence is
      not only genetic: GANAB(+/-) human cells show reduced mature polycystin-1,
      which is the specific readout this mouse reports as unaffected. The
      disagreement is therefore between two experiments, not between a gene and a
      phenotype.
    evidence:
    - reference: PMID:32550232
      reference_title: Ganab Haploinsufficiency Does Not Cause Polycystic Kidney Disease or Polycystic Liver Disease in Mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Ganab haploinsufficiency does not cause kidney or liver cysts in mice,
        suggesting that it may not be the causative gene in polycystic kidney
        disease.
      explanation: >-
        The authors' own conclusion, which is what makes this a substantive
        negative claim about the model rather than an experiment that was simply
        not run. It supports treating the model as failing to recapitulate the
        node; the readouts below carry the individual measurements.
    readouts:
    - name: Kidney and liver cyst formation
      target: Renal Cystogenesis
      direction: UNCHANGED
      interpretation: >-
        No cysts formed in heterozygous animals, a genuine negative rather than an
        unmeasured outcome.
      evidence:
      - reference: PMID:32550232
        reference_title: Ganab Haploinsufficiency Does Not Cause Polycystic Kidney Disease or Polycystic Liver Disease in Mice.
        supports: REFUTE
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We found that homozygous mutation of the Ganab gene in C57BL/6 mice
          resulted in early embryonic lethality, and there were no cysts in the
          kidneys or livers of Ganab +/- mice.
        explanation: >-
          Reports the absent cyst phenotype at the dose corresponding to the human
          genotype.
    - name: Polycystin-1 and polycystin-2 expression in kidney
      target: Renal Cystogenesis
      direction: UNCHANGED
      interpretation: >-
        Directly contradicts the reduced mature polycystin-1 seen in human
        GANAB(+/-) cells, and is the sharpest point of disagreement between the
        model and the human data.
      evidence:
      - reference: PMID:32550232
        reference_title: Ganab Haploinsufficiency Does Not Cause Polycystic Kidney Disease or Polycystic Liver Disease in Mice.
        supports: REFUTE
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Ganab protein expression was reduced by at least 50%, while the
          expression of ADPKD proteins (PC1 and PC2) and acetylated tubulin was
          not affected in the Ganab +/- kidney.
        explanation: >-
          Confirms the intended half-dose reduction while reporting the polycystin
          readout as unchanged, which is what the human cell work found altered.


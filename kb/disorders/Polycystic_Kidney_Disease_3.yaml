genetic:
- name: GANAB
  gene_term:
    preferred_term: GANAB
    term:
      id: hgnc:4138
      label: GANAB
  association: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Heterozygous loss-of-function variants, six of the eight identified by
    targeted screening being truncating. GANAB was a strong candidate before it
    was proven, because its partner subunit glucosidase II beta is encoded by
    PRKCSH, an established polycystic liver disease gene, so the two halves of
    one enzyme cause overlapping disease.
  evidence:
  - reference: PMID:27259053
    reference_title: "Mutations in GANAB, Encoding the Glucosidase IIα Subunit, Cause Autosomal-Dominant Polycystic Kidney and Liver Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because PRKCSH encodes GIIβ, GANAB is a strong ADPKD and ADPLD candidate
      gene.
    explanation: >-
      States the subunit-partner reasoning that made GANAB a candidate and that
      places this disease alongside the polycystic liver disease genes.
  - reference: PMID:20301424
    reference_title: "Polycystic Kidney Disease, Autosomal Dominant."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      a heterozygous pathogenic variant in PKD1, PKD2, or one of the less common
      associated genes (ALG5, ALG9, DNAJB11, GANAB, IFT140)
    explanation: >-
      GeneReviews lists GANAB among the genes whose heterozygous pathogenic
      variants establish an ADPKD diagnosis. Graded OTHER because the sentence is
      a diagnostic-criteria statement in an expert review rather than primary
      human data.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Inherited in an autosomal dominant manner, with heterozygous
    loss-of-function alleles sufficient to impair polycystin-1 maturation. For
    counselling: each child of a carrier has a 50 percent chance of inheriting
    the variant, 10 to 20 percent of affected individuals carry a de novo
    variant, and once the familial variant is known GeneReviews states that
    prenatal and preimplantation genetic testing are available.
  evidence:
  - reference: PMID:27259053
    reference_title: "Mutations in GANAB, Encoding the Glucosidase IIα Subunit, Cause Autosomal-Dominant Polycystic Kidney and Liver Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, we show that GANAB mutations cause ADPKD and ADPLD
    explanation: >-
      Establishes GANAB as a cause of two autosomal dominant disorders.
  - reference: PMID:20301424
    reference_title: "Polycystic Kidney Disease, Autosomal Dominant."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Each child of an individual who is heterozygous for an ADPKD-causing
      pathogenic variant has a 50% chance of inheriting the pathogenic variant.
    explanation: >-
      Gives the transmission risk for counselling. Graded OTHER as expert-review
      guidance. Unlike the Clinical Characteristics material this entry
      deliberately excludes, the counselling section names GANAB explicitly and
      its content is not PKD1-specific, so it applies here directly.
  - reference: PMID:20301424
    reference_title: "Polycystic Kidney Disease, Autosomal Dominant."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most individuals diagnosed with ADPKD have an affected parent; 10%-20% of
      affected individuals have the disorder as the result of a de novo
      pathogenic variant.
    explanation: >-
      Gives the de novo rate, which matters for counselling a carrier with no
      family history. Graded OTHER as expert-review guidance.

prevalence:
- population: Genetically unresolved ADPKD and ADPLD families
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Twenty affected individuals in nine families at the time of gene discovery,
    found by screening 321 genetically unresolved families plus six families
    that had undergone exome sequencing. This is a share of the unresolved remainder, not a
    population rate: 7 to 10 percent of ADPKD families and about half of ADPLD
    families were genetically unresolved before this gene was identified.
  evidence:
  - reference: PMID:27259053
    reference_title: "Mutations in GANAB, Encoding the Glucosidase IIα Subunit, Cause Autosomal-Dominant Polycystic Kidney and Liver Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After screening, 7%-10% of ADPKD-affected and ~50% of ADPLD-affected
      families were genetically unresolved (GUR), suggesting further genetic
      heterogeneity of both disorders.
    explanation: >-
      Gives the size of the unresolved pool this gene was found within, which is
      the denominator the case count should be read against.
diagnosis:
- name: Molecular Genetic Testing
  description: >-
    A GANAB variant is what distinguishes this entry from ADPKD generally, and
    imaging cannot make that call. GeneReviews establishes the ADPKD diagnosis on
    age-specific kidney imaging criteria plus either an affected first-degree
    relative or a heterozygous pathogenic variant, and lists GANAB among the
    less common associated genes that satisfy the molecular arm. Because the
    renal phenotype here is mild and may be atypical in distribution, a patient
    can fail imaging criteria built around the PKD1 picture and still carry the
    diagnosis.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301424
    reference_title: "Polycystic Kidney Disease, Autosomal Dominant."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      a heterozygous pathogenic variant in PKD1, PKD2, or one of the less common
      associated genes (ALG5, ALG9, DNAJB11, GANAB, IFT140)
    explanation: >-
      Establishes molecular testing including GANAB as a route to the ADPKD
      diagnosis. Graded OTHER because it is a diagnostic-criteria statement in an
      expert review, not primary data.
  - reference: PMID:32405593
    reference_title: Large Deletions in GANAB and SEC63 Explain 2 Cases of Polycystic Kidney and Liver Disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because of its 75−base pair read length, WES is not equipped to detect
      large deletions.
    explanation: >-
      Explains why a testing strategy resting on exome sequencing alone will miss
      the large GANAB deletions this paper reports, which is the argument for
      including deletion and duplication analysis in the panel.
  notes: >-
    Modality matters here. Single-gene GANAB testing is a cascade test only,
    because reaching GANAB as a hypothesis already requires PKD1 and PKD2 to have
    been excluded; the primary test is a multigene cystic kidney and liver panel.
    That panel must include deletion and duplication analysis: large GANAB
    deletions are a reported cause, and exome sequencing is structurally poor at
    detecting them because its short reads and PCR-based amplification give
    uneven coverage.

    There is no biochemical test. Glucosidase II activity is not measured
    clinically, so the enzyme defect that defines the disorder is inferred from
    the genotype rather than assayed.
  results: >-
    A heterozygous GANAB loss-of-function variant, or a whole- or partial-gene
    deletion, in a patient in whom PKD1 and PKD2 have been excluded.
- name: Abdominal Imaging of Kidney and Liver
  description: >-
    Imaging carries a different weight here than in PKD1. It must cover the liver
    deliberately rather than incidentally, because hepatic burden may exceed
    renal burden and in some families is the presenting problem. GeneReviews
    recommends abdominal computed tomography or magnetic resonance imaging every
    one to five years in adults depending on disease stage.
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:20301424
    reference_title: "Polycystic Kidney Disease, Autosomal Dominant."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CT or MRI examination of the abdomen with and without contrast enhancement
      every one to five years in adults depending on disease stage
    explanation: >-
      States the ADPKD surveillance imaging interval. Graded PARTIAL and OTHER:
      this is an ADPKD-general expert recommendation, not a GANAB-specific one,
      and the stage-dependence it assumes was calibrated on a population in which
      most patients progress faster than GANAB carriers do.
  notes: >-
    Applied here as ADPKD-general management rather than GANAB-specific evidence.
    The interval is deliberately not narrowed for this entry: no GANAB-specific
    surveillance schedule exists, and the mild-course expectation is itself
    contested by a reported severe case.
treatments:
- name: Blood Pressure Control
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Hypertension management with ACE inhibitors or angiotensin II receptor
    blockers, plus dietary modification, is the ADPKD intervention with the
    broadest applicability and the least dependence on rate of progression, which
    makes it the one that transfers most safely to a GANAB carrier.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:20301424
    reference_title: "Polycystic Kidney Disease, Autosomal Dominant."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treatment for hypertension may include ACE inhibitors or angiotensin II
      receptor blockers and diet modification.
    explanation: >-
      States the ADPKD hypertension recommendation. Graded PARTIAL and OTHER as
      ADPKD-general expert guidance rather than GANAB-specific evidence.
- name: Vasopressin V2 Receptor Antagonism
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Tolvaptan is approved for rapidly progressive ADPKD, and that eligibility
    criterion is exactly where the GANAB distinction bites. A characteristically
    mild, often non-progressive kidney phenotype is not the population the
    approval describes, so this treatment is curated as conditionally applicable
    rather than indicated, and the condition is the individual patient's
    demonstrated rate of progression rather than the genotype.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tolvaptan
      term:
        id: CHEBI:32246
        label: tolvaptan
  target_phenotypes:
  - preferred_term: Multiple renal cysts
    term:
      id: HP:0005562
      label: Multiple renal cysts
  evidence:
  - reference: PMID:20301424
    reference_title: "Polycystic Kidney Disease, Autosomal Dominant."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Treatment with vasopressin V2 receptor antagonists (e.g., tolvaptan) to
      slow disease progression is approved for individuals with rapidly
      progressive disease.
    explanation: >-
      States the approved indication, whose restriction to rapidly progressive
      disease is the reason this treatment cannot be assumed to apply here.
      Graded PARTIAL and OTHER: ADPKD-general expert guidance, and no trial has
      enrolled GANAB carriers as such.
  notes: >-
    Curated to record a conditional, not a recommendation. Whether the
    critical-intervention-window logic behind tolvaptan eligibility applies to a
    genotype that rarely progresses is genuinely open, and the reported severe
    GANAB case is precisely the patient in whom the question would arise.
- name: Management of Symptomatic Polycystic Liver Disease
  therapeutic_modality: SURGERY
  description: >-
    The gap this entry most needed to close. Hepatic burden is the part of the
    phenotype that dominates in many GANAB families, and it has its own
    escalation ladder that is largely independent of kidney management. Medical
    measures come first, avoidance of oestrogens plus acid suppression, and
    severe symptoms escalate to percutaneous aspiration and sclerosis,
    laparoscopic fenestration, combined hepatic resection with fenestration,
    selective hepatic artery embolisation, or liver transplantation.
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Polycystic liver disease
    term:
      id: HP:0006557
      label: Polycystic liver disease
  evidence:
  - reference: PMID:20301424
    reference_title: "Polycystic Kidney Disease, Autosomal Dominant."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Symptomatic liver cysts may improve with avoidance of estrogens and the use
      of H2 blockers or proton pump inhibitors. Severe symptoms may require
      percutaneous aspiration and sclerosis, laparoscopic fenestration, combined
      hepatic resection and cyst fenestration, liver transplantation, or
      selective hepatic artery embolization.
    explanation: >-
      States the full medical-to-surgical escalation for symptomatic polycystic
      liver disease. Graded PARTIAL and OTHER as ADPKD-general expert guidance
      rather than GANAB-specific evidence, though it applies with more force here
      than the renal recommendations do, because this is the compartment GANAB
      carriers are most likely to need it in.
- name: Avoidance of Nephrotoxic and Cyst-Aggravating Exposures
  therapeutic_modality: BEHAVIORAL
  description: >-
    GeneReviews names specific agents and circumstances to avoid. One of them is
    directly relevant to this entry's phenotype emphasis: oestrogens, and
    possibly progestogens, should be avoided in individuals with severe
    polycystic liver disease, which is the presentation GANAB carriers are most
    likely to reach.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301424
    reference_title: "Polycystic Kidney Disease, Autosomal Dominant."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Agents/circumstances to avoid: Long-term administration of nephrotoxic
      agents, high levels of caffeine, high-salt diet, smoking, and obesity, and
      in individuals with severe PLD, use of estrogens and possibly progestogens.
    explanation: >-
      The GeneReviews agents-to-avoid list, including the oestrogen caution that
      is specific to severe polycystic liver disease. Graded PARTIAL and OTHER as
      ADPKD-general expert guidance.

discussions:
- discussion_id: pkd3_mouse_contradicts_human_pc1_defect
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why does polycystin-1 remain unaffected in the Ganab heterozygous mouse
    kidney when it is reduced in human GANAB heterozygous cells, and which result
    describes the patient?
  attaches_to:
  - pathophysiology#Impaired Polycystin-1 Maturation and Trafficking
  - animal_models#Ganab heterozygous knockout mouse
  rationale: >-
    The two experiments disagree on the readout that the whole mechanism rests
    on. Human GANAB(+/-) cells show reduced mature polycystin-1, and that is the
    evidence connecting the gene to cystogenesis. The mouse heterozygote achieves
    the intended halving of Ganab protein and reports polycystin-1 and
    polycystin-2 expression unaffected, with no cysts anywhere. The mouse authors
    draw the strong conclusion, that Ganab may not be causative at all.

    Several things could reconcile them and none has been tested. The human work
    measured mature glycoform specifically while the mouse measured expression,
    which are different quantities. Mouse cyst models across the ADPKD genes
    generally need a second hit or prolonged time, so an unstressed young
    heterozygote may simply be below threshold. Species differences in
    glucosidase II dependence are plausible given that the human phenotype is
    itself mild. Until this is resolved, the entry's central mechanism rests on
    human cell work and human genetics, with the only whole-animal test of it
    returning negative, and that should be visible rather than smoothed over.
  evidence:
  - reference: PMID:32550232
    reference_title: Ganab Haploinsufficiency Does Not Cause Polycystic Kidney Disease or Polycystic Liver Disease in Mice.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Homozygous Ganab mutations are lethal in the fetal stage, and Ganab
      haploinsufficiency does not cause kidney or liver cysts in mice, suggesting
      that it may not be the causative gene in polycystic kidney disease.
    explanation: >-
      The mouse study's own conclusion, which challenges the gene-disease claim
      rather than merely failing to confirm it.
  - reference: PMID:27259053
    reference_title: "Mutations in GANAB, Encoding the Glucosidase IIα Subunit, Cause Autosomal-Dominant Polycystic Kidney and Liver Disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      reduced mature PC1 was seen in GANAB(+/-) cells
    explanation: >-
      The human heterozygous-cell result the mouse kidney contradicts.
- discussion_id: pkd3_mildness_is_modal_not_guaranteed
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What determines whether a GANAB carrier follows the expected mild renal
    course or progresses rapidly?
  attaches_to:
  - pathophysiology#Renal Cystogenesis
  - phenotypes#Multiple Renal Cysts
  rationale: >-
    Mild kidney disease is the characterisation from the discovery cohort and is
    the basis on which a GANAB result would reassure a patient. But a reported
    18-year-old carrier fell into Mayo imaging class 1E, the class predicting
    rapid progression to end-stage renal disease, and the report was written
    specifically to question the mildness assumption. With around twenty
    published carriers there is no basis for a modifier analysis, and no
    genotype-phenotype rule separates the two courses. The clinical consequence
    is concrete: mildness governs surveillance intervals and whether
    disease-modifying therapy is considered at all, and a counselling message
    built on the cohort description will occasionally be wrong.
  evidence:
  - reference: PMID:40134995
    reference_title: "GANAB-Associated Severe Autosomal Dominant Polycystic Kidney Disease in an 18-Year-Old Female: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The GANAB gene mutation found in this patient is typically associated with
      mild kidney disease; however, according to the Mayo Clinic Imaging
      Classification (MIC) for ADPKD, our patient falls under Classification 1E,
      which is predictive of rapid progression to end-stage renal disease (ESRD).
    explanation: >-
      Documents a carrier at the severe end and states the challenge to the
      mildness assumption explicitly.
- discussion_id: pkd3_intracranial_aneurysm_risk_unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do GANAB carriers carry the ADPKD-associated intracranial aneurysm risk?
  attaches_to:
  - phenotypes#
  rationale: >-
    Intracranial aneurysm is a cardinal extrarenal feature of ADPKD, occurring at
    roughly fivefold the general-population rate, and its presence or absence
    drives whether a patient is offered magnetic resonance angiography screening.
    No GANAB-specific report in the reference cache addresses it either way. This
    entry deliberately does not import it from the ADPKD-general GeneReviews
    chapter, because that chapter describes the PKD1-dominated picture and
    importing it would manufacture a GANAB phenotype from a statement about a
    different genotype. Equally, absence of evidence in twenty published carriers
    is not evidence of absence, and a curator reading this entry should not
    conclude the risk is zero.

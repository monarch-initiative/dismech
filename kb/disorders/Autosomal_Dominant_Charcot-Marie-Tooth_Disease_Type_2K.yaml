name: Autosomal dominant Charcot-Marie-Tooth disease type 2K
creation_date: "2026-09-04T00:00:00Z"
description: >-
  Charcot-Marie-Tooth disease type 2K (CMT2K) is an axonal peripheral neuropathy
  caused by heterozygous missense variants in GDAP1, a glutathione
  S-transferase-like protein tail-anchored in the outer mitochondrial membrane.
  The gene also causes a recessive neuropathy (CMT4A / AR-CMT2K), and the two are
  not simply mild and severe versions of one lesion: recessive alleles reduce
  GDAP1 fission activity, whereas the dominant alleles curated here interfere
  with mitochondrial fusion and raise reactive oxygen species production, so the
  same clinical syndrome is reached by two different routes through mitochondrial
  dynamics. Dominant alleles are structurally subtle — they leave the fold close
  to intact and destabilise it thermally rather than abolishing it — which fits
  the later onset and milder course usually reported for AD-CMT2K. That severity
  claim is genuinely contested rather than settled, and both the cohorts
  supporting it and the cohort finding no AD/AR difference are curated here.
category: Mendelian
parents:
- hereditary disease
synonyms:
- CMT2K
- AD-CMT2K
- Charcot-Marie-Tooth disease type 2K
- GDAP1-related autosomal dominant axonal neuropathy

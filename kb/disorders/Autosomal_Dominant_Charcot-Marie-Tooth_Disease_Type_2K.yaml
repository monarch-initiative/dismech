- category: Neurologic
  name: Peripheral Axonal Neuropathy
  description: >-
    The core phenotype: a length-dependent axonal sensorimotor neuropathy.
    Motor nerve conduction velocities are preserved, which is what separates
    CMT2K from the demyelinating GDAP1 phenotype (CMT4A).
  phenotype_term:

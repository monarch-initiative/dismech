- name: Reduced Store-Operated Calcium Entry
  biological_scale: CELLULAR
  description: Reduced store-operated calcium entry occurs in GDAP1-silenced SH-SY5Y cells and in a SH-SY5Y model coexpressing GDAP1 R120W and candidate modifier JPH1 R213P. These are specific experimental contexts. A corresponding calcium deficit or necessary role in degeneration has not been demonstrated in dominant-GDAP1 patient neurons.
  evidence:
  - &id009
    reference: url:https://riunet.upv.es/bitstreams/abe9bcbf-8c46-4c50-9186-e548695f913c/download
    reference_title: https://riunet.upv.es/bitstreams/abe9bcbf-8c46-4c50-9186-e548695f913c/download
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: JPH1p.R213P, together with GDAP1p.R120W, produces an even lower SOCE activity com- pared with JPH1 and GDAP1 p.R120W.
    explanation: Transfected SH-SY5Y cells establish a context-dependent calcium phenotype, not endogenous patient-neuron mediation.

genetic:
- name: GDAP1
  gene_term:
    preferred_term: GDAP1
    term:
      id: hgnc:15968
      label: GDAP1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    GDAP1 encodes a glutathione S-transferase-like protein
    tail-anchored in the outer mitochondrial membrane. Dominant CMT2K alleles are
    missense changes in the folded GST-like core; reported examples include
    p.R120W, p.H123R (a Finnish founder allele), p.Q218E, the in-frame deletion
    p.R226del, p.A247V, p.R282H and p.C240Y. Severity grades with the affected
    domain rather than with the gene: p.C240Y, inside the GST domain, carries a
    complex I defect and faster progression than p.R120W outside it. Note that
    the same gene causes recessive disease through a different cellular lesion
    (reduced fission rather than impaired fusion), so inheritance mode, not
    merely allele dosage, determines the mechanism.
  evidence:
  - reference: PMID:40711989
    reference_title: "GDAP1-Related Charcot-Marie-Tooth Disease: Axonal or Demyelinating Subtype? Autosomal Recessive or Autosomal Dominant Inheritance?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The GDAP1 gene encodes a mitochondrial outer membrane protein crucial for
      mitochondrial function.
    explanation: >-
      Establishes the gene product's subcellular location and functional
      importance.
  - reference: PMID:33480199
    reference_title: "Clinical and Neuroimaging Features in Charcot-Marie-Tooth Patients with GDAP1 Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      five with autosomal dominant (AD) CMT type 2K (three families with p.R120W
      and two families with p.Q218E)
    explanation: >-
      Names specific heterozygous GDAP1 alleles segregating as dominant CMT2K.
  - reference: PMID:37058526
    reference_title: "Conserved intramolecular networks in GDAP1 are closely connected to CMT-linked mutations and protein stability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      describe new crystal structures of the autosomal recessive R120Q and the
      autosomal dominant A247V and R282H GDAP1 variants
    explanation: >-
      Source for the dominant alleles A247V and R282H named in the notes above.
  - reference: PMID:37058526
    reference_title: "Conserved intramolecular networks in GDAP1 are closely connected to CMT-linked mutations and protein stability."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Enzymatic activity of GDAP1 has not been convincingly demonstrated, nor has
      any substrate been identified in vivo.
    explanation: >-
      Substantiates the statement in notes that no molecular_functions term is
      bound because GDAP1 has no demonstrated catalytic activity or substrate.
- name: Reduced penetrance and variable expressivity
  gene_term:
    preferred_term: GDAP1
    term:
      id: hgnc:15968
      label: GDAP1
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    Dominant GDAP1 variants are not fully penetrant. Carriers within reported
    families range from clinically normal or paraesthesia-only — while still
    showing neuropathic signs on examination and nerve conduction studies — to
    severely affected, and intra-familial variability in onset age, severity and
    progression is marked. This is the datum behind the ascertainment hypothesis
    in this entry's open severity discussion: if a substantial share of dominant
    carriers are subclinical, cohorts assembled from symptomatic probands will
    systematically under-count them.
  evidence:
  - reference: PMID:28236508
    reference_title: "Phenotypical features of a new dominant GDAP1 pathogenic variant (p.R226del) in axonal Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Several individuals were asymptomatic or had paraesthesia only, however
      neurological examination and nerve conduction studies demonstrated
      neuropathic signs.
    explanation: >-
      Documents subclinical dominant carriers detectable only on examination and
      nerve conduction studies.
  - reference: PMID:35656516
    reference_title: "Mild Late-Onset Sensory Neuropathy Associated with Heterozygous Missense GDAP1 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      some subjects were asymptomatic, perhaps due to incomplete penetrance or
      the nature of the heterozygous form.
    explanation: >-
      States incomplete penetrance explicitly for heterozygous GDAP1 carriers.
  - reference: PMID:29372391
    reference_title: "Genotype-phenotype correlation and frequency of distribution in a cohort of Chinese Charcot-Marie-Tooth patients associated with GDAP1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observed a marked intra-familial variability within the AD family in
      terms of age at disease onset, symptom severity and clinical progression.
    explanation: >-
      Documents variable expressivity within a single dominant GDAP1 family.
diagnosis:
- name: Nerve Conduction Studies
  description: >-
    Nerve conduction studies place a patient in the axonal CMT2 branch before any
    genetic testing: motor conduction velocities are preserved while compound
    muscle action potential amplitudes are reduced. This is what separates CMT2K
    from the demyelinating GDAP1 phenotype. A caveat specific to the dominant
    form is that mild carriers may have near-normal electrodiagnostic studies, so
    a normal result does not exclude the diagnosis in an at-risk relative.
  evidence:
  - reference: PMID:28495047
    reference_title: "Similar clinical, pathological, and genetic features in Chinese patients with autosomal recessive and dominant Charcot-Marie-Tooth disease type 2K."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Motor nerve conduction velocities of the median nerve were within normal
      ranges, and compound muscle action potential ranged from 1.5 to 3.8 mV.
    explanation: >-
      The axonal electrodiagnostic pattern in genetically confirmed CMT2K.
  - reference: PMID:35656516
    reference_title: "Mild Late-Onset Sensory Neuropathy Associated with Heterozygous Missense GDAP1 Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The findings showed that clinical features demonstrated no pes cavus, no
      significant weakness in the hands or feet, normal reflexes in four out of
      the five subjects, and mild to normal electrodiagnostic findings.
    explanation: >-
      Supports the caveat that mild dominant carriers may have near-normal
      electrodiagnostic studies.
- name: Molecular Genetic Testing of GDAP1
  description: >-
    Diagnosis is confirmed by identifying a heterozygous GDAP1 pathogenic
    variant. Zygosity is the discriminator that assigns the case to the dominant
    or the recessive disorder, and therefore determines both the counseling and
    the expected mechanism.
  evidence:
  - reference: PMID:20301711
    reference_title: "GDAP1-Related Hereditary Motor and Sensory Neuropathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosis of GDAP1-HMSN is based on clinical findings and confirmed by
      detection on molecular genetic testing of either biallelic pathogenic
      variants in GDAP1 in those with autosomal recessive inheritance or a
      heterozygous pathogenic variant in those with autosomal dominant
      inheritance.
    explanation: >-
      States the confirmatory genetic test and the zygosity-based assignment.

- discussion_id: cmt2k_candidate_jph1_modifier
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Is JPH1 p.Arg213Pro a reproducible clinical modifier of GDAP1 p.Arg120Trp neuropathy?
  attaches_to:
  - genetic#JPH1
  - pathophysiology#Reduced Store-Operated Calcium Entry
  rationale: A single double-carrier proband had more marked disease than GDAP1-only paternal relatives, while JPH1-only maternal relatives were unaffected. Functional support comes from transformed-cell knockdown and overexpression, not endogenous patient-neuron rescue. Neither colocalization nor negative co-immunoprecipitation resolves the physical interaction. SOCE restoration by WT JPH1 persisted despite mitochondrial blockers, so a mandatory mitochondrial-recovery route is unsupported. Replicated human association and the link between calcium handling and axonal degeneration remain open.

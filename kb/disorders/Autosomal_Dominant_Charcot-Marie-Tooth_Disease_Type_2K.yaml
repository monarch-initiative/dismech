genetic:
- name: GDAP1
  gene_term:
    preferred_term: GDAP1
    term:
      id: hgnc:15968
      label: GDAP1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: Dominant disease has been reported with alleles including p.Arg120Trp, p.His123Arg, p.Ala156Gly, p.Pro274Leu, p.Gln218Glu and p.Arg226Lys. An in-frame p.Arg226del and a historically reported early truncating c.23delAG allele mean that the disorder should not be defined as missense-only. This catalogue is not a claim that all rare heterozygous GDAP1 variants are pathogenic. Reduced penetrance belongs to the causal GDAP1 record, not a second modifier-gene record. Variant position or soluble-fragment melting temperature is not a validated clinical severity predictor.
  evidence:
  - *id001
  - *id008
  - reference: PMID:28236508
    reference_title: Phenotypical features of a new dominant GDAP1 pathogenic variant (p.R226del) in axonal Charcot-Marie-Tooth disease.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: We describe two unrelated Spanish families with a dominant axonal CMT. A novel in frame GAA deletion in exon 5 of the GDAP1 gene (c.677_679del; p.R226del) was identified in both families.
    explanation: Two families carry an in-frame deletion; the precise source wording is checked against the abstract.
  - reference: PMID:20685671
    reference_title: The GST domain of GDAP1 is a frequent target of mutations in the dominant form of axonal Charcot Marie Tooth type 2K.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: 'Three novel mutations were identified in three families with dominant segregation of the disease: two missense changes, p.Arg226Ser and p.Ser34Cys, affecting the GST domain of the GDAP1 protein and a novel deletion (c.23delAG) leading to early truncation of the protein upstream the GST domain.'
    explanation: This historical report includes an early truncating allele in a dominant family; it does not establish a general haploinsufficiency mechanism.

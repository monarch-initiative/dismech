    explanation: >-
      Gives the GDAP1 share of a Chinese CMT cohort.
treatments:
- name: Multidisciplinary Supportive and Rehabilitative Care
  description: >-
    There is no disease-modifying therapy. Management is symptomatic and
    rehabilitative, delivered by a team spanning neurology, physiatry, orthopedic
    surgery, and physical and occupational therapy, and includes daily heel cord
    stretching to prevent Achilles shortening, ankle-foot orthoses, walking aids,
    and analgesia for musculoskeletal pain.
  treatment_term:
    preferred_term: multidisciplinary supportive and rehabilitative care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: BEHAVIORAL
  target_mechanisms:
  - target: Distal Motor and Sensory Deficit
    description: >-
      Orthoses, stretching, and walking aids address the functional consequences
      of distal weakness; they do not act on the mitochondrial lesion.
  evidence:
  - reference: PMID:20301711
    reference_title: "GDAP1-Related Hereditary Motor and Sensory Neuropathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment is symptomatic and involves evaluation and management by a
      multidisciplinary team that includes neurologists, physiatrists, orthopedic
      surgeons, and physical and occupational therapists.
    explanation: >-
      GeneReviews statement of the standard of care for GDAP1 neuropathy.
  - reference: PMID:20301711
    reference_title: "GDAP1-Related Hereditary Motor and Sensory Neuropathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment may include: daily heel cord stretching exercises to prevent
      Achilles tendon shortening, ankle/foot orthoses, orthopedic surgery,
      forearm crutches or canes, wheelchairs, treatment of musculoskeletal pain
      with acetaminophen or nonsteroidal anti-inflammatory agents, and career and
      employment counseling.
    explanation: >-
      Enumerates the specific supportive interventions.
- name: Avoidance of Neurotoxic Agents and Obesity
  description: >-
    GeneReviews lists drugs known to cause nerve damage, and obesity, as
    circumstances to avoid in GDAP1 neuropathy. This is a management hazard
    rather than a therapy, and is curated here so it is not lost.
  treatment_term:
    preferred_term: avoidance of neurotoxic agents
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301711
    reference_title: "GDAP1-Related Hereditary Motor and Sensory Neuropathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Agents/circumstances to avoid: Drugs and medications known to cause nerve
      damage; obesity.
    explanation: >-
      The GeneReviews hazard statement for GDAP1 neuropathy.
- name: Genetic Counseling
  description: >-
    Offspring of an affected individual have a 50% risk of inheriting the
    variant. Counseling must also address that the same gene causes a recessive
    disorder, so carrier and reproductive implications differ by family.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301711
    reference_title: "GDAP1-Related Hereditary Motor and Sensory Neuropathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AD inheritance: Offspring of an individual with AD GDAP1-HMSN have a 50%
      risk of inheriting the GDAP1 pathogenic variant from their affected parent.
    explanation: >-
      States the dominant recurrence risk that counseling conveys.
experimental_models:
- name: hiPSC-derived motor neurons from a GDAP1 patient
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Human induced-pluripotent-stem-cell-derived motor neurons from a GDAP1
    patient and normal controls. GDAP1 mRNA is mainly expressed in motor neurons
    in normal subjects and is drastically reduced in the patient's cells. Patient
    motor neurons show reduced viability with lipid dysfunction and oxidative
    stress, and mitochondrial cristae defects without an ATP production deficit.
  publication: PMID:34440148
  modeled_mechanisms:
  - target: Oxidative Stress and Bioenergetic Failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Establishes oxidative stress and mitochondrial structural defects in human
      motor neurons carrying a GDAP1 mutation, the cell type the disease affects.
    limitations: >-
      The patient carries a homozygous premature-termination-codon allele
      (c.581C>G, p.Ser194*) degraded by nonsense-mediated decay — a
      loss-of-function, recessive genotype, and the paper describes the patient as
      CMT2H. It therefore cannot report on the dominant fusion-interference
      mechanism curated here, and supports only the shared downstream oxidative
      and mitochondrial endpoint. Notably ATP production was preserved, so the
      bioenergetic component of this node is not reproduced.
    evidence:
    - reference: PMID:34440148
      reference_title: "GDAP1 Involvement in Mitochondrial Function and Oxidative Stress, Investigated in a Charcot-Marie-Tooth Model of hiPSCs-Derived Motor Neurons."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Morphological and functional investigations revealed in the CMT patient's
        motor neurons a decrease of cell viability associated to lipid dysfunction
        and oxidative stress development.
      explanation: >-
        Demonstrates oxidative stress in human GDAP1-mutant motor neurons.
    - reference: PMID:34440148
      reference_title: "GDAP1 Involvement in Mitochondrial Function and Oxidative Stress, Investigated in a Charcot-Marie-Tooth Model of hiPSCs-Derived Motor Neurons."
      supports: REFUTE
      evidence_source: IN_VITRO
      snippet: >-
        Thus, in the CMT patient's motor neurons, mitochondrial cristae defects
        were observed, even if no deficit in ATP production emerged.
      explanation: >-
        Refutes the bioenergetic-failure half of the target node in this model:
        cristae are abnormal but ATP output is preserved.
animal_models:
- name: Gdap1 knockout mouse
  species: Mouse
  genotype: Gdap1 null (homozygous knockout)
  publication: PMID:25860513
  description: >-
    A constitutive Gdap1 knockout mouse with abnormal motor behaviour from about
    three months, electrophysiologically and biochemically confirmed axonal
    neuropathy, progressive anterior horn motor neuron loss, neuromuscular
    junction defects, and, in cultured motor and dorsal root ganglion neurons,
    large defective mitochondria, altered ER cisternae, reduced alpha-tubulin
    acetylation, increased autophagy vesicles, and a blunted store-operated
    calcium entry response.
  modeled_mechanisms:
  - target: Length-Dependent Distal Axonal Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Reproduces the axonal neuropathy endpoint of GDAP1 disease in vivo, with
      motor neuron loss and neuromuscular junction pathology.
    limitations: >-
      This is a null allele, so it models the loss-of-function lesion that
      underlies recessive GDAP1 neuropathy, not the dominant CMT2K mechanism.
      Recessive alleles reduce fission activity whereas dominant alleles
      interfere with fusion and raise ROS, so the knockout cannot report on the
      mechanism curated for this entry — it supports the shared downstream axonal
      endpoint only. The paper itself frames its findings as relevant to the
      axonal recessive form.
    evidence:
    - reference: PMID:25860513
      reference_title: "Lack of GDAP1 induces neuronal calcium and mitochondrial defects in a knockout mouse model of charcot-marie-tooth neuropathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Electrophysiological and biochemical studies confirmed the axonal nature
        of the neuropathy whereas histopathological studies over time showed
        progressive loss of motor neurons (MNs) in the anterior horn of the
        spinal cord and defects in neuromuscular junctions.
      explanation: >-
        Establishes that the model reproduces an axonal neuropathy with motor
        neuron loss, the downstream endpoint this link claims.
    - reference: PMID:25860513
      reference_title: "Lack of GDAP1 induces neuronal calcium and mitochondrial defects in a knockout mouse model of charcot-marie-tooth neuropathy."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Loss of function recessive mutations in GDAP1 are associated with
        decreased mitochondrial fission activity, while dominant mutations result
        in impairment of mitochondrial fusion with increased production of
        reactive oxygen species and susceptibility to apoptotic stimuli.
      explanation: >-
        Refutes reading the knockout as a model of the dominant mechanism: a null
        allele reproduces the recessive fission-loss lesion, not the dominant
        fusion-interference lesion curated in this entry.
    readouts:
    - name: Store-operated calcium entry response in motor neurons
      target: Length-Dependent Distal Axonal Degeneration
      direction: DECREASED
      interpretation: >-
        Calcium-handling failure downstream of a mislocalized mitochondrial
        network in GDAP1-deficient neurons.
      evidence:
      - reference: PMID:25860513
        reference_title: "Lack of GDAP1 induces neuronal calcium and mitochondrial defects in a knockout mouse model of charcot-marie-tooth neuropathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Importantly, MNs showed reduced cytosolic calcium and SOCE response."
        explanation: >-
          Reports the direction and cell type of the calcium measurement.
discussions:
- discussion_id: cmt2k_ad_versus_ar_severity_conflict
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is autosomal dominant CMT2K genuinely milder and later in onset than
    recessive GDAP1 neuropathy, or does the reported difference reflect
    ascertainment of the mildest dominant carriers?
  attaches_to:
  - "pathophysiology#Impaired Mitochondrial Fusion and Network Dynamics"
  - "phenotypes#Mild Predominantly Sensory Presentation"
  rationale: >-
    The literature does not agree, and the disagreement is curated rather than
    resolved. Several cohorts report that the dominant form is milder and later
    in onset than the recessive form, and one heterozygous series describes
    carriers with no pes cavus, normal reflexes and near-normal
    electrodiagnostics. Against that, a Chinese series of genetically confirmed
    AR-CMT2K and AD-CMT2K patients found no difference in onset, severity,
    electrophysiology or nerve pathology, with all patients presenting before age
    five. A severe rapidly progressive dominant case with respiratory failure has
    also been reported. Mechanistically, either outcome is defensible: the two
    inheritance modes damage mitochondrial dynamics by different routes, and the
    paper establishing that split explicitly notes the clinical manifestations
    are similar. Ascertainment is the obvious confounder — if mild dominant
    carriers are frequently subclinical, cohorts assembled from symptomatic
    probands will under-count them and the two series can both be right about
    the patients they saw.
  evidence:
  - reference: PMID:40711989
    reference_title: "GDAP1-Related Charcot-Marie-Tooth Disease: Axonal or Demyelinating Subtype? Autosomal Recessive or Autosomal Dominant Inheritance?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Additionally, we highlight that AD-CMT2K has a milder phenotype than other
      GDAP1-related disease types, which could result in an underestimation of the
      number of AD-CMT2K cases.
    explanation: >-
      The milder-and-under-ascertained side of the conflict, and the source of the
      ascertainment hypothesis this gap proposes testing.
  - reference: PMID:29372391
    reference_title: "Genotype-phenotype correlation and frequency of distribution in a cohort of Chinese Charcot-Marie-Tooth patients associated with GDAP1 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical characteristics and findings in our study demonstrated that the
      recessive form presented earlier in life and exhibited severe symptoms and
      rapid evolution compared to the dominant form.
    explanation: >-
      A second cohort reporting the dominant form as later-onset and milder.
  - reference: PMID:28495047
    reference_title: "Similar clinical, pathological, and genetic features in Chinese patients with autosomal recessive and dominant Charcot-Marie-Tooth disease type 2K."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study observed no difference in the disease onset, phenotype severity,
      electrophysiological findings, or pathological changes between AR-CMT2K and
      AD-CMT2K patients.
    explanation: >-
      Directly contradicts the milder-dominant claim in a cohort of genetically
      confirmed AR-CMT2K and AD-CMT2K patients, which is why this is curated as an
      open conflict rather than a settled fact.
  proposed_experiments:
  - experiment_id: exp_cmt2k_systematic_family_screening
    name: Systematic examination of at-risk relatives in AD-CMT2K families
    description: >-
      Examine and perform nerve conduction studies on all adult first-degree
      relatives of AD-CMT2K probands regardless of symptoms, to estimate what
      fraction of dominant carriers are subclinical and quantify the
      ascertainment bias directly.
  - experiment_id: exp_cmt2k_allele_stratified_severity
    name: Severity comparison stratified by affected protein domain
    description: >-
      Pool dominant GDAP1 cases and compare severity by whether the variant lies
      inside or outside the GST domain, testing whether domain location rather
      than inheritance mode accounts for the conflicting severity reports.
notes: >-
  Two points a reader should not have to reconstruct. First, the dominant and
  recessive GDAP1 neuropathies are mechanistically distinct rather than dose
  variants of one lesion: recessive alleles reduce GDAP1 fission activity while
  the dominant alleles curated here interfere with fusion and raise ROS. Any
  model built on a null allele — including the Gdap1 knockout mouse in this
  entry — therefore speaks to the recessive lesion and to shared downstream
  axonal endpoints, not to the CMT2K mechanism. Second, GDAP1's own enzymatic
  function is unresolved: it is structurally a glutathione S-transferase-like
  protein, but no catalytic activity or in vivo substrate has been convincingly
  demonstrated, so no molecular_functions term is bound on the initiating node.
  Resveratrol restored complex I activity in CMT2K patient fibroblasts and the
  authors propose reducing oxidative stress as a therapeutic strategy; that is an
  in vitro result and is deliberately not curated as a treatment.

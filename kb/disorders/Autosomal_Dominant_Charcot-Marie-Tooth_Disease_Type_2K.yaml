diagnosis:
- name: Clinical and Family Evaluation
  description: Assess distal weakness and atrophy, sensory loss, reflexes, foot shape, gait and functional needs, together with a three-generation family history. Mild or apparently unaffected relatives can carry a dominant allele. Exclude acquired neuropathies and other hereditary neuropathies, particularly when progression is unusually rapid.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: A three-generation family history with attention to other relatives with neurologic signs and symptoms should be obtained.
    explanation: Current CMT GeneReviews recommends family evaluation.
  - *id008
  - *id005
- name: Nerve Conduction Studies
  description: Use motor and sensory nerve conduction studies with clinical and genetic findings. Reduced amplitudes with relatively preserved velocities often support axonal neuropathy, but intermediate, mixed or near-normal findings occur. A normal study in a mildly affected relative does not by itself exclude dominant GDAP1 disease.
  evidence:
  - *id004
  - reference: PMID:35656516
    reference_title: Mild Late-Onset Sensory Neuropathy Associated with Heterozygous Missense GDAP1 Variants.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The findings from the subjects with a heterozygous pathogenic GDAP1 missense variant (Table 1) demonstrate that all presented with a mild sensory neuropathy; all except one subject had a late-onset neuropathy developing after age 40. Electrodiagnostic testing was normal in one of the five individuals, with the other two individuals having minor nerve conduction abnormalities.
    explanation: The selected series contains four pathogenic-variant cases plus one VUS; normal or borderline tests are not a general sensitivity estimate.
- name: Molecular Diagnosis and Variant Interpretation
  description: Establish a GDAP1 variant with evidence for dominant pathogenicity in the clinical and family context. A single rare heterozygous variant or VUS is insufficient. Current CMT testing pathways include PMP22 dosage testing, a neuropathy panel including GDAP1, and broader genomic testing when initial testing is unrevealing. Test an established familial variant in relatives with appropriate counseling.
  evidence:
  - reference: PMID:20301711
    reference_title: GDAP1-Related Hereditary Motor and Sensory Neuropathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Diagnosis of GDAP1-HMSN is based on clinical findings and confirmed by detection on molecular genetic testing of either biallelic pathogenic variants in GDAP1 in those with autosomal recessive inheritance or a heterozygous pathogenic variant in those with autosomal dominant inheritance.
    explanation: The historical disease-specific chapter distinguishes dominant and recessive diagnoses; current interpretation still requires variant-level evidence.
  - reference: PMID:21753178
    reference_title: Dominant GDAP1 mutations cause predominantly mild CMT phenotypes.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: If the genetic data remain unconvincing, a functional assay may be considered in order to distinguish truly pathogenic sequence variants from benign polymorphisms, like for the Ala156Gly mutation.
    explanation: The original dominant-family study cautions against assigning uncertain variants solely from heterozygosity.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Health care providers ordering genetic testing should be familiar with the genetics of CMT.
    explanation: Current guidance emphasizes skilled interpretation of CMT genetic testing.
- name: Assessment of Atypical Respiratory or Voice Symptoms
  description: Dysphonia, stridor, weak cough or respiratory symptoms warrant appropriate otolaryngology and respiratory evaluation. Confirm vocal-fold or diaphragmatic dysfunction rather than inferring it from hoarseness alone, and reconsider additional causes in unusually rapid deterioration.
  evidence:
  - *id010
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1358/
    reference_title: Charcot-Marie-Tooth Hereditary Neuropathy Overview - GeneReviews® - NCBI Bookshelf
    supports: SUPPORT
    directness: DIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: ) warrant consultation with specialists in otolaryngology at the time of diagnosis; evidence of vocal cord paralysis (hoarseness and/or stridor) at any time warrants periodic monitoring by specialists in otolaryngology to detect vocal cord hypomotility and quantify the degree of airway obstruction, a potentially lethal complication
    explanation: This general CMT advice is applied according to symptoms and individual risk; it is not evidence that all CMT2K patients have vocal-fold paralysis.
prevalence:
- population: International selected dominant CMT screening cohort
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: One positive family among 97 screened dominant CMT families; seven additional GDAP1 families were recruited separately. This is diagnostic yield in an ascertained CMT cohort, not population prevalence.
  evidence:
  - reference: PMID:21753178
    reference_title: Dominant GDAP1 mutations cause predominantly mild CMT phenotypes.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: In addition to the dominant GDAP1 families gathered through international collaboration, we screened a group of 97 dominant CMT families and identified one new heterozygous mutation. This indicates that the frequency of dominant GDAP1 mutations in larger cohorts is relatively low, at about 1%.
    explanation: The denominator excludes seven separately recruited mutation-positive families.
- population: Korean CMT family cohort
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: Eight GDAP1 families among 1,143 total CMT families, or eight among 799 without PMP22 duplication. The ten GDAP1 patients comprised seven AD patients in five families and three AR patients in three families, as resolved from Table 1 and the Results. Abstract wording conflates family and patient counts. No population prevalence is inferred.

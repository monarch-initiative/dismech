    explanation: Clinical electrophysiology primarily supports axonal neuropathy, with some intermediate and mixed findings.
  - &id005
    reference: PMID:21753178
    reference_title: Dominant GDAP1 mutations cause predominantly mild CMT phenotypes.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Disease onset varied widely, ranging from childhood to late adulthood. Walking difficulties were the most common initial symptoms. Disease progression was slow and as a rule patients remained ambulatory. Four patients (CMT-129.03, CMT-129.07, CMT-1060.01, and CMT-1130.03) required an ankle foot orthosis; patient CMT-1058.01 became wheelchair-dependent at the age of 61 years. Weakness and atrophy was mainly restricted to distal muscles of the lower and upper limbs except for patients CMT-129.03, CMT-129.07, CMT-1058.01, and CMT-1130.03, who had mild signs of proximal weakness.
    explanation: Motor disability, distal weakness and atrophy characterize affected members, with variable progression.

        reference_title: https://univ-angers.hal.science/hal-02388209v1/document
        supports: SUPPORT
        directness: DIRECT
        evidence_source: IN_VITRO
        quote_role: PRIMARY_RESULT
        snippet: CI enzymatic activity was about 50% lower in the p. C240Y fibroblasts compared to controls (Fig. 1a, p=0.01), while only reduced by 30% in the p.R120W fi broblasts (Fig. 1a, p=0.09).  # codespell:ignore ontrols
        explanation: The enzyme-activity reduction was significant for C240Y but not R120W in two-family fibroblast comparisons.
  - target: Reduced Complex I-Linked ATP Synthesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Complex-I-substrate ATP synthesis was lower in permeabilized patient fibroblasts.
    limitations: Does not establish resting ATP depletion in patient neurons or a universal deficit across genotypes.
    evidence:

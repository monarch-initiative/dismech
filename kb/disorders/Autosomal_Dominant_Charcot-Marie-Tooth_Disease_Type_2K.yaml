discussions:
- discussion_id: cmt2k_variable_expression_and_ascertainment
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which allele, familial and ascertainment factors explain the broad dominant GDAP1 phenotype?
  attaches_to:
  - genetic#GDAP1
  rationale: Most reported dominant families have milder and slower disease than typical recessive cohorts, but the distributions overlap. A four-patient Chinese comparison with two AD and two AR cases cannot demonstrate equivalence, and the 2025 Iranian series contains only two AD individuals. Systematic evaluation of relatives is necessary to distinguish clinical nonpenetrance from very mild electrophysiological expression. The Korean paper contains abstract-versus-table discrepancies in patient/family and allele counts; the table-supported seven AD people in five families is used here. The 2022 sensory series includes one VUS and internal case1/2 and reflex-summary inconsistencies, so no precise pooled feature rate is used.
  evidence:
  - *id001
  - *id008
  - reference: PMID:28495047
    reference_title: Similar clinical, pathological, and genetic features in Chinese patients with autosomal recessive and dominant Charcot-Marie-Tooth disease type 2K.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: This study observed no difference in the disease onset, phenotype severity, electrophysiological findings, or pathological changes between AR-CMT2K and AD-CMT2K patients.
    explanation: The comparison has only two individuals per inheritance group; absence of a reported difference is not equivalence.
  - reference: PMID:40711989
    reference_title: 'GDAP1-Related Charcot-Marie-Tooth Disease: Axonal or Demyelinating Subtype? Autosomal Recessive or Autosomal Dominant Inheritance?'
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Additionally, we highlight that AD-CMT2K has a milder phenotype than other GDAP1-related disease types, which could result in an underestimation of the number of AD-CMT2K cases.
    explanation: The inference comes from a small AD subset, not a representative penetrance estimate.

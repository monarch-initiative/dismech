- name: Length-Dependent Distal Axonal Degeneration
  description: >-
    Long peripheral axons depend on mitochondria trafficked over great distances,
    so a mitochondrial network that is poorly distributed and bioenergetically
    compromised fails first at the distal ends of the longest fibres. Sural nerve
    biopsy in CMT2K shows loss of large myelinated fibres with regeneration
    clusters, and electron microscopy shows mitochondrial aggregation in axons and
    Schwann cells with neurofilament accumulation.
  biological_scale: TISSUE
  conforms_to: "peripheral_axonal_degeneration#Axonal Transport Impairment and Mitochondrial Dysfunction"

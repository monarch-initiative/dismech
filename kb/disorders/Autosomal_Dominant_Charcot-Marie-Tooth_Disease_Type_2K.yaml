  description: A constitutive null model develops motor abnormalities from about three months and reduced CMAP at five months. Fewer healthy anterior-horn motor neurons and later reduced neuromuscular-junction occupancy were reported, but five-month sciatic axon number, size distribution and myelin g-ratio were preserved. Rotarod differences became nonsignificant after nine months. Protein-abundance panels suggest altered metabolism but do not directly measure ATP flux. Complete loss models recessive GDAP1 deficiency and cannot establish the mechanism of a heterozygous dominant allele.

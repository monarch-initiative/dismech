    explanation: >-
      Gives the GDAP1 share of a large genetically characterized CMT cohort.
- population: Chinese CMT cohort
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    GDAP1 variants were found in 1.63% (5/306) of unrelated Chinese CMT patients,

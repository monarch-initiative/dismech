      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: In 8 Charcot-Marie-Tooth disease (CMT) families we identified 4 pathogenic heterozygous GDAP1 mutations, 3 of which are novel. Three of the mutations displayed reduced disease penetrance. Disease onset in the affected individuals was variable, ranging from early childhood to adulthood. Disease progression was slow in most patients and overall severity milder than typically seen in autosomal recessive GDAP1 mutations.
      explanation: Eight ascertained families establish dominant inheritance and variable expression; seven families were recruited separately from the 97-family screening cohort.

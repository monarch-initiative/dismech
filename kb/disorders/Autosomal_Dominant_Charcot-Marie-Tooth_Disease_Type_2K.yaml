- name: Sensory Axonal Dysfunction
  biological_scale: TISSUE
  description: Peripheral sensory nerve dysfunction causes distal sensory loss, paresthesias and sometimes pain. It may dominate a very mild presentation, and routine nerve conduction studies can be normal or only subtly abnormal in selected carriers.

    quote_role: PRIMARY_RESULT
    snippet: This study presents the clinical and electrophysiological findings of four subjects with a pathogenic heterozygous GDAP1 variant causing Charcot-Marie-Tooth disease 2K (CMT2K) and one additional subject with an uncertain GDAP1 variant and clinical findings of CMT 2K.

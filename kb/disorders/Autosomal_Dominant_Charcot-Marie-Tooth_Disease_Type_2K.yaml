  relationship_type: MODIFIER
  variant_origin: GERMLINE
  presence: PRESENT
  notes: The p.Arg213Pro allele is a proposed modifier of GDAP1 p.Arg120Trp based on one double-carrier proband within a screen of 24 GDAP1 carriers from eight Spanish families. JPH1-only maternal relatives were neurologically unaffected. Cell experiments support context-dependent effects on store-operated calcium entry, but do not establish a broadly replicated human modifier association, JPH1-alone disease causation or a clinical calcium-directed treatment.
  evidence:
  - &id017
    reference: url:https://riunet.upv.es/bitstreams/abe9bcbf-8c46-4c50-9186-e548695f913c/download
    reference_title: https://riunet.upv.es/bitstreams/abe9bcbf-8c46-4c50-9186-e548695f913c/download
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: The proband from the fCMT-408 family is a carrier of the GDAP1 p.R120W mutation inherited from her father, who is a CMT patient, and of the JPH1 p.R213P mutation transmitted from her mother, who is a healthy woman.
    explanation: One double-carrier proband provides clinical support for a proposed modifier, not a replicated modifier association.

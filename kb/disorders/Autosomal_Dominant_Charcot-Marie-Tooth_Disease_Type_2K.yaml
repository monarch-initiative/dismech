notes: 'This entry covers AD-CMTAx-GDAP1, historically CMT2K. Heterozygosity alone is insufficient: a variant must have evidence supporting dominant disease causation rather than recessive carrier status or uncertain significance. Most reported dominant alleles are missense, but an in-frame deletion and an early truncating allele have also been reported. Current general CMT GeneReviews supplies the care baseline; the retired GDAP1 chapter is retained only as explicitly historical context. Human cohort, purified-protein, overexpression, patient-fibroblast and recessive comparison-model findings are distinguished throughout.'

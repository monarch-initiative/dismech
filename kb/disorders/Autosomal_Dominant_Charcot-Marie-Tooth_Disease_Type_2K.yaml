experimental_models:
- name: Soluble GDAP1 variant proteins
  experimental_model_type: OTHER
  publication: PMID:35509130
  description: Purified recombinant GDAP1 fragments were studied by crystallography, solution scattering and thermal assays in 2022 and 2023. R120W/H123R and several other core substitutions reduce apparent melting temperature while retaining overall folding; R310Q/W in longer fragments instead slightly increase it. None of these constructs includes the transmembrane anchor. These experiments measure protein biophysics, not cellular half-life, mitochondrial fusion or clinical severity.
  modeled_mechanisms:
  - target: Reduced GDAP1 Thermal Stability
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Apparent thermal stability is reduced for the tested R120W/H123R fragments.
    limitations: Other alleles need not have the same direction; full-length membrane-embedded behavior and causal translation remain unresolved.
    evidence:
    - *id012
    readouts:
    - name: Apparent melting temperature
      target: Reduced GDAP1 Thermal Stability
      direction: DECREASED
      interpretation: Apparent thermal stability is reduced for the tested R120W/H123R fragments.
      evidence:
      - reference: PMID:35509130
        reference_title: Structural insights into Charcot-Marie-Tooth disease-linked mutations in human GDAP1.
        supports: SUPPORT
        directness: DIRECT
        evidence_source: IN_VITRO
        quote_role: PRIMARY_RESULT
        snippet: The apparent Tm value for wtGDAP1, ~62°C, was >5°C higher than for both mutants, suggesting that the effect of the mutations may be linked to an overall destabilization of the fold.
        explanation: R120W/H123R soluble fragments were tested by apparent melting temperature; this is not a cellular protein-turnover assay.
- name: Rat sensory neurons expressing full-length GDAP1 variants
  experimental_model_type: PRIMARY_CELL_CULTURE
  publication: PMID:35509130
  description: Full-length WT, R120W and H123R were overexpressed in primary rat sensory neurons. The study found no apparent difference in staining intensity/localization, distinguishable gross morphology or toxicity. Nonreducing cellular SDS gels support absence of stable disulfide-linked dimers under those assay conditions, not absence of all native noncovalent dimers.
  modeled_mechanisms:
  - target: Heterozygous GDAP1 Pathogenic Variant
    relationship: PERTURBS
    fidelity: LOW
    model_scale: CELLULAR
    description: The culture expresses full-length disease variants and delineates negative gross cellular findings.
    limitations: Not an endogenous human heterozygous neuron or a sensitive test of long-term axonal degeneration; no fusion assay was reported in this culture.
    evidence:
    - reference: PMID:35509130
      reference_title: Structural insights into Charcot-Marie-Tooth disease-linked mutations in human GDAP1.
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO

  rationale: Fusion inhibition, purified-fragment thermal stability, ROS and complex-I-linked bioenergetic measurements arise from distinct experimental systems. No tested chain establishes thermal instability as the necessary cause of fusion failure or ROS as the necessary mediator of human axonal injury. Patient fibroblast R120W results lack the oxidative-stress signal seen in C240Y, despite overexpression findings. The redox manuscript measures SIRT1/NRF1 abundance, not mediation by their activity. Resveratrol improved pooled complex I activity in cultured cells; it remains experimental and is not established treatment. The source uses older GST-domain boundaries and does not validate a domain-wide clinical severity rule.

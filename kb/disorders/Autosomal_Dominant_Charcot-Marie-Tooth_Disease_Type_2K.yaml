  description: A heterozygous GDAP1 variant with established dominant pathogenicity can be inherited or arise de novo. Reduced penetrance and marked intrafamilial variability occur. Each child has a 50% chance of inheriting the variant; severity is not predicted by that transmission probability. Recessive GDAP1 alleles and variants of uncertain significance require separate interpretation.

    reference_title: Clinical and Neuroimaging Features in Charcot-Marie-Tooth Patients with GDAP1 Mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: This study enrolled 1,143 unrelated CMT families, and excluded 344 families with PMP22 duplication. The GDAP1 mutation rate was 0.7% (n=8) in the 1,143 total families and 1.0% (n=8) in the 799 families without PMP22 duplication.
    explanation: Family-level yield is explicitly reported.
  - reference: PMID:33480199
    reference_title: Clinical and Neuroimaging Features in Charcot-Marie-Tooth Patients with GDAP1 Mutations.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: We found six GDAP1 mutations in five AD CMT2K families (p.R120W in three families, and p.Q218E and p.R226K in each of the other two families) and three AR CMTRIA families (p.P111H and p.V219G in one family, and p.H256R and p.H256R in two families) (Fig. 1A).

  - reference: PMID:28236508
    reference_title: "Phenotypical features of a new dominant GDAP1 pathogenic variant (p.R226del) in axonal Charcot-Marie-Tooth disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Transfection of HeLa cells with the p.R226del mutation led to an increased
      mitochondrial aggregation.
    explanation: >-
      An independent dominant allele produces abnormal mitochondrial network
      distribution in a cell model.
- name: Oxidative Stress and Bioenergetic Failure
  description: >-
    Dominant GDAP1 alleles raise reactive oxygen species production and give
    uneven mitochondrial transmembrane potentials. In patient fibroblasts the
    severity of this redox lesion tracks the affected protein domain: p.C240Y,
    inside the GST domain, carries a mitochondrial complex I defect with greater
    oxidative stress and faster clinical progression than p.R120W outside it.
    Downstream of complex I deficiency the redox-sensitive deacetylase SIRT1 and
    its target NRF1 are both reduced.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: response to oxidative stress

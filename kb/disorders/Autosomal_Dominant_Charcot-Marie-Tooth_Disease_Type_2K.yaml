inheritance:
- name: Autosomal dominant inheritance
  description: >-
    CMT2K is caused by a heterozygous GDAP1 pathogenic variant. The same gene
    causes recessive disease (CMT4A / AR-CMT2K) when both alleles are affected,
    and the dominant and recessive alleles act through different cellular
    mechanisms rather than differing only in dosage.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:20301711
    reference_title: "GDAP1-Related Hereditary Motor and Sensory Neuropathy – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosis of GDAP1-HMSN is based on clinical findings and confirmed by
      detection on molecular genetic testing of either biallelic pathogenic
      variants in GDAP1 in those with autosomal recessive inheritance or a
      heterozygous pathogenic variant in those with autosomal dominant
      inheritance.
    explanation: >-
      States that a heterozygous GDAP1 variant underlies the dominant form
      curated here.
  - reference: PMID:19782751
    reference_title: "GDAP1 mutations differ in their effects on mitochondrial dynamics and apoptosis depending on the mode of inheritance."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Thus, different cellular mechanisms that disturb mitochondrial dynamics
      underlie the similar clinical manifestations caused by GDAP1 mutations,
      depending on the mode of inheritance.
    explanation: >-
      Supports treating the dominant form as a mechanistically distinct entity
      rather than a milder dose of the recessive lesion.
pathophysiology:
- name: GDAP1 Protein Destabilization by Heterozygous Missense Variant
  description: >-
    Dominant CMT2K alleles are overwhelmingly missense changes in the GST-like
    core of GDAP1. Crystallographic and biophysical work on the dominant variants
    H123R (a Finnish founder allele) and R120W shows that the mutant proteins
    fold and behave in solution much like wild type but are markedly less
    thermally stable, with the substitutions disrupting a side-chain interaction
    network linking helices alpha-3, alpha-6 and alpha-7. The lesion is therefore
    a destabilised but still-assembled protein rather than an absent one. Note
    that thermal destabilization does not by itself explain dominance: the same
    structural work finds it in recessive alleles too, so what makes these
    alleles dominant is not established at the protein level and is inferred from
    the cellular phenotype instead.
  biological_scale: MOLECULAR
  downstream:
  - target: Impaired Mitochondrial Fusion and Network Dynamics
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35509130
      reference_title: "Structural insights into Charcot-Marie-Tooth disease-linked mutations in human GDAP1."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Structural analysis of GDAP1 indicates that CMT may arise from disruption
        of specific intra- and intermolecular interaction networks, leading to
        alterations in GDAP1 structure and stability, and, eventually,
        insufficient motor and sensory neuron function.
      explanation: >-
        Links the destabilising structural change to downstream failure of GDAP1
        function in motor and sensory neurons.
  evidence:
  - reference: PMID:35509130
    reference_title: "Structural insights into Charcot-Marie-Tooth disease-linked mutations in human GDAP1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The disease variant proteins retain close to normal structure and solution
      behavior, but both present a significant decrease in thermal stability.
    explanation: >-
      Establishes thermal destabilization, not misfolding or absence, as the
      molecular consequence of the dominant CMT2K variants studied.
  - reference: PMID:37058526
    reference_title: "Conserved intramolecular networks in GDAP1 are closely connected to CMT-linked mutations and protein stability."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      All disease variant proteins retain close to normal structure and solution
      behaviour.
    explanation: >-
      Extends the same structural finding across dominant and recessive alleles,
      which is why destabilization is not curated here as the basis of dominance.
  - reference: PMID:35509130
    reference_title: "Structural insights into Charcot-Marie-Tooth disease-linked mutations in human GDAP1."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we describe the biochemical and structural properties of the Finnish
      founding CMT2K mutation H123R and CMT2K-linked R120W, both of which are
      autosomal dominant mutations.
    explanation: >-
      Confirms the variants characterized structurally are the dominant CMT2K
      alleles curated in this entry.
- name: Impaired Mitochondrial Fusion and Network Dynamics
  description: >-
    Wild-type GDAP1 is a mitochondrial fission factor that acts through Drp1 and
    Fis1. The dominant CMT2K alleles do not simply reduce that fission activity —
    which is what the recessive alleles do — but instead interfere with
    mitochondrial fusion, producing an unbalanced and abnormally distributed
    mitochondrial network. This inheritance-dependent split is the central
    mechanistic distinction between CMT2K and recessive GDAP1 neuropathy.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: mitochondrial fusion
    term:
      id: GO:0008053
      label: mitochondrial fusion
    modifier: DECREASED
  downstream:
  - target: Oxidative Stress and Bioenergetic Failure
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:19782751
      reference_title: "GDAP1 mutations differ in their effects on mitochondrial dynamics and apoptosis depending on the mode of inheritance."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Only the expression of dmGDAP1s increases the production of ROS, leads to
        uneven mitochondrial transmembrane potentials, and enhances the
        susceptibility to apoptotic stimuli.
      explanation: >-
        Ties the dominant-allele fusion defect directly to increased ROS and
        membrane-potential failure, the next step in the chain.
  evidence:
  - reference: PMID:19782751
    reference_title: "GDAP1 mutations differ in their effects on mitochondrial dynamics and apoptosis depending on the mode of inheritance."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Recessively inherited CMT-associated forms of GDAP1 (rmGDAP1s) have reduced
      fission activity, whereas dominantly inherited forms (dmGDAP1s) interfere
      with mitochondrial fusion.
    explanation: >-
      The primary statement that dominant CMT2K alleles act on fusion, which is
      what distinguishes this node from the recessive GDAP1 mechanism.

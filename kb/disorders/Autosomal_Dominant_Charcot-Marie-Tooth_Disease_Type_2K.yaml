- category: Neurologic
  name: Mild Predominantly Sensory Presentation
  description: >-
    At the mild end of the AD-CMT2K spectrum, heterozygous GDAP1 carriers may
    present with painful, numb feet and diminished pinprick sensation but no pes
    cavus, no significant distal weakness, preserved reflexes, and near-normal
    electrodiagnostic studies. This near-subclinical presentation is a plausible
    reason AD-CMT2K is under-ascertained.

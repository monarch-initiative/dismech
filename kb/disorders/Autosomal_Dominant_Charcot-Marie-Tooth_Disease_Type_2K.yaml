    snippet: >-
      Electron microscopy showed mitochondrial aggregation in both axons and
      Schwann cells, and neurofilament accumulation in giant unmyelinated fibers.
    explanation: >-
      Direct human nerve pathology showing the mitochondrial lesion inside
      peripheral axons and Schwann cells.
  - reference: PMID:28495047
    reference_title: "Similar clinical, pathological, and genetic features in Chinese patients with autosomal recessive and dominant Charcot-Marie-Tooth disease type 2K."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sural nerve biopsy revealed loss of large myelinated fibers with
      regeneration clusters and a few onion bulbs.
    explanation: >-
      Establishes axonal fibre loss with attempted regeneration as the tissue
      lesion in CMT2K.
- name: Distal Motor and Sensory Deficit
  description: >-
    The distal-to-proximal gradient of axonal loss produces distal weakness and
    wasting with milder sensory involvement and foot deformity, beginning in the
    lower limbs. Reflexes are not uniformly lost: generalized areflexia is
    reported in a severe dominant case, while a mild heterozygous series found
    normal reflexes in four of five subjects.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:28495047
    reference_title: "Similar clinical, pathological, and genetic features in Chinese patients with autosomal recessive and dominant Charcot-Marie-Tooth disease type 2K."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients had disease onset before 5 years of age, and presented with
      muscle weakness, atrophy, and mild sensory disturbance in distal limbs.
    explanation: >-
      Describes the distal motor-predominant deficit with milder sensory
      involvement in genetically confirmed CMT2K patients.

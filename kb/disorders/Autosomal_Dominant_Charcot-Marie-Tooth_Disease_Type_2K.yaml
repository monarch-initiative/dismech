      quote_role: PRIMARY_RESULT
      snippet: Whereas treatment with 10 µM resv eratrol produced no significant modification of CI activity (data not shown), treat ment with 25µM resveratrol modulated CI activity in CMT2K fibroblasts with a trend towards the restoration of CI activity in both p.C240Y and p.R120W fibroblasts. We also assessed t he effect of resveratrol in alleviating mitochondrial dysfunction in cells carrying GDAP1 m utations independently of the location and mutation type in the perspective of potential f uture therapeutic studies on CMT2K patients. Combining both patient families showed a significant improvement of CI activity after resveratrol treatment (Fig. 5, p<0.05).  # codespell:ignore ment

    readouts:
    - name: Complex I-linked ATP synthesis
      target: Reduced Complex I-Linked ATP Synthesis
      direction: DECREASED
      interpretation: Complex-I-substrate ATP synthesis was lower in permeabilized patient fibroblasts.
      evidence:
      - reference: url:https://univ-angers.hal.science/hal-02388209v1/document
        reference_title: https://univ-angers.hal.science/hal-02388209v1/document
        supports: SUPPORT
        directness: DIRECT
        evidence_source: IN_VITRO
        quote_role: PRIMARY_RESULT
        snippet: Measurements of mitochondrial oxygen consumption re vealed that using CI malate-pyruvate (MP) substrates, the respiratory rate (Fig. 1b) and the corresponding ATP production (Fig. 1c) were significantly lower in both mutant cell lines, compared to controls (40%, p<0.05 in both measurements).  # codespell:ignore ontrols
        explanation: Permeabilized fibroblasts from both families had lower complex-I-substrate respiration and ATP synthesis under the experimental conditions.
  - target: Increased Mitochondrial Reactive Oxygen Species
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: C240Y cells showed increased mitochondrial ROS-related fluorescence and additional oxidative-stress markers.
    limitations: R120W cells lacked a corresponding oxidative-stress signal; assays do not prove ROS is the mediator of nerve injury.
    evidence:
    - *id016
    readouts:
    - name: MitoSOX fluorescence
      target: Increased Mitochondrial Reactive Oxygen Species
      direction: INCREASED
      interpretation: C240Y cells showed increased mitochondrial ROS-related fluorescence and additional oxidative-stress markers.
      evidence:
      - reference: url:https://univ-angers.hal.science/hal-02388209v1/document
        reference_title: https://univ-angers.hal.science/hal-02388209v1/document
        supports: SUPPORT
        directness: DIRECT
        evidence_source: IN_VITRO
        quote_role: PRIMARY_RESULT
        snippet: Using a fluorescent probe specific for superoxide a nions (MitoSOX TM ), we identified a 40% enhancement of fluorescence intensity in p.C240Y fi broblasts compared to controls (Fig. 4a and 4b, p=0.020). In addition, we observed a 50% decrease in thiol group level, which are the ROS targets, further supporting ROS overproduction (Fig. 4c, p=0.015). Moreover, the expression of manganese superoxide dismutase (MnSOD), a major mitochondrial antioxidant, was 53% higher in p.C240Y fibroblasts compared to c ontrols (Fig. 4d, p=0.045). In contrast, in the p.R120W fibroblasts, no evidence of oxidative stress was observed (Fig. 4).  # codespell:ignore ontrols

- name: Melanin Biosynthesis Deficiency
  description: >
    The convergence point of the three upstream routes. Melanin is synthesized
    by melanocytes (skin, hair follicle) and the retinal pigment epithelium
    within specialized organelles called melanosomes. Whether the lesion is in a
    melanogenic enzyme (TYR, TYRP1, DCT), in the melanosomal ion transport that
    sets the pH tyrosinase needs (OCA2, SLC45A2, SLC24A5), or in melanosome
    biogenesis itself (LRMDA), the result is absent or reduced melanin in
    melanocytes and the retinal pigment epithelium. OCA1A, with complete
    tyrosinase deficiency, produces no melanin throughout life, whereas
    hypomorphic and non-TYR forms permit some pigment accumulation.
  cell_types:
  - preferred_term: melanocyte
    term:
      id: CL:0000148
      label: melanocyte
  - preferred_term: retinal pigment epithelial cell
    term:
      id: CL:0002586
      label: retinal pigment epithelial cell

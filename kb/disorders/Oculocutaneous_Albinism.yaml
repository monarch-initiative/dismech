- name: Melanosome Biogenesis Defect
  description: >
    The OCA7 route. LRMDA (formerly C10orf11) is not an enzyme or a transporter:
    it is recruited to the limiting membrane of the melanosome through active
    RAB32, where it binds the Commander assembly, and mutations causing OCA7
    uncouple that RAB32-Commander binding. Loss of LRMDA disturbs melanosome
    maturation itself - PMEL processing and the stage I to stage II transition -
    and lowers melanosomal pH, so pigment output falls without any defect in the
    melanogenic enzymes. LRMDA localises to melanoblasts and melanocytes in
    human fetal tissue but was not detected in retinal pigment epithelial cells.

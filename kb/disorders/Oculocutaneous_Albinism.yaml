- name: Melanosomal Ion Transport and pH Dysregulation
  description: >
    The non-enzymatic arm of OCA. Tyrosinase
    works only at neutral pH, but premelanosomes are acidic; neutralisation at
    the stage II-to-III transition depends on the combined action of several
    melanosomal membrane transport proteins. OCA2 mediates a chloride-selective
    anion conductance and is a positive regulator of pH neutralisation; SLC45A2
    is proposed to efflux protons coupled to a sugar substrate; SLC24A5 is a
    potassium-dependent sodium/calcium exchanger whose subcellular site is still
    disputed. Losing any of them leaves the melanosome acidic, so tyrosinase is
    inactive and, in the case of OCA2 and SLC45A2, is also mis-trafficked and
    retained in the ER/Golgi rather than delivered to the melanosome. The
    transport activities themselves remain incompletely characterised.

pathophysiology:
- name: Melanogenic Enzyme Deficiency
  description: >
    The enzymatic arm of OCA. Tyrosinase (TYR) is the rate-limiting enzyme,
    converting tyrosine to DOPA and DOPA to dopaquinone, and it requires a
    neutral melanosomal pH and a copper cofactor to work at all. Two further
    melanosomal enzymes act downstream in the same pathway: tyrosinase-related
    protein 1 (TYRP1), which oxidises 5,6-dihydroxyindole-2-carboxylic acid
    (DHICA) monomers into melanin, and dopachrome tautomerase (DCT, also called
    tyrosinase-related protein 2). Loss of any of the three removes a step from
    eumelanin synthesis, and the severity tracks how much residual activity
    remains: TYR null alleles give lifelong complete absence of pigment, while
    TYRP1 and DCT variants leave milder hypopigmentation.

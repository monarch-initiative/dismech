genetic:
- name: INPP5E
  association: Biallelic C-terminal nonsense variants
  gene_term:
    preferred_term: INPP5E
    term:
      id: hgnc:21474
      label: INPP5E
  notes: >-
    INPP5E encodes inositol polyphosphate-5-phosphatase E, a farnesylated ciliary
    lipid phosphatase. Its variants cause two allelic disorders that ClinGen splits on
    mechanism: phosphatase-domain variants cause Joubert syndrome 1 (curated in
    Joubert_syndrome), and the C-terminal truncations listed here cause MORM
    syndrome. ClinGen rates the INPP5E-MORM relationship Moderate because only two
    alleles in a handful of families are known. relationship_type is left unset
    because the schema reserves CAUSATIVE for a Definitive or Strong ClinGen tier,
    which this pair does not have; the Moderate tier is recorded below.

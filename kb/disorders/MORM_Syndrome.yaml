pathophysiology:
- name: INPP5E C-terminal Truncation Removing the CaaX Motif
  biological_scale: MOLECULAR
  description: >-
    Both MORM alleles are nonsense variants in the terminal exon of INPP5E that delete
    the last residues of the protein, including the CaaX box whose cysteine (Cys644)
    is farnesylated. Unlike the Joubert syndrome 1 variants, which cluster in the
    phosphatase domain and abolish catalysis, the MORM truncations leave the
    phosphatase domain intact; ClinGen's curation records that the MORM variants
    lose membrane localisation while retaining enzymatic activity.
  genes:
  - preferred_term: INPP5E
    term:
      id: hgnc:21474
      label: INPP5E
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
  downstream:
  - target: Failed PDE6D-Dependent Ciliary Targeting of INPP5E
    causal_link_type: DIRECT
    description: >-
      Farnesylation of the CaaX cysteine is what PDE6D binds to carry INPP5E into the
      cilium, so removing the motif removes the targeting signal.
    evidence:
    - reference: PMID:27063844
      reference_title: PDE6δ-mediated sorting of INPP5E into the cilium is determined by cargo-carrier affinity.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        A mutation encoding a stop codon near to the CaaX motif (Q627) of INPP5E was
        identified in a family with MORM syndrome 18 , a ciliopathy characterized by
        intellectual disability, obesity, retinal dystrophy and micropenis 24 . This
        mutation was shown to affect INPP5E ciliary localization
      explanation: >-
        Introduction of a biochemical study summarising earlier human genetic work:
        the MORM allele is a stop codon next to the CaaX motif that disrupts ciliary
        localization.
  evidence:
  - reference: PMID:34211432
    reference_title: "Novel Insights Into Monogenic Obesity Syndrome Due to INPP5E Gene Variant: A Case Report of a Female Patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the case of MORMS, a nonsense mutation is located in the C-terminal domain of
      the gene, resulting in a truncated protein, affecting ciliary localization and
      stabilization of ciliary structures
    explanation: >-
      States the C-terminal truncation as the molecular lesion of MORM syndrome.
  - reference: CGGV:assertion_a50bbd87-4308-4272-83fc-21274d283e63-2026-03-27T160000.000Z
    reference_title: "INPP5E / MORM syndrome (Moderate)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Molecular mechanisms differ in that Joubert syndrome variants result in loss of
      enzymatic activity without defects in ciliary location (PMID:19668216), while
      MORM syndrome variants result in loss of membrane localisation while retaining
      enzymatic activity (PMID:19668215).
    explanation: >-
      ClinGen's statement of the mechanistic split between the two allelic disorders.
  - reference: PMID:19668216
    reference_title: "Mutations in INPP5E, encoding inositol polyphosphate-5-phosphatase E, link phosphatidyl inositol signaling to the ciliopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Mutations clustered in the phosphatase domain and impaired 5-phosphatase
      activity, resulting in altered cellular PtdIns ratios.
    explanation: >-
      The contrast case: Joubert syndrome 1 alleles are catalytic-domain variants,
      which is what sets the C-terminal MORM truncations apart.
- name: Failed PDE6D-Dependent Ciliary Targeting of INPP5E
  biological_scale: CELLULAR
  conforms_to: "ciliopathy_dysfunction#Basal Body and Transition Zone Dysfunction"
  description: >-
    Farnesylated INPP5E is carried to the cilium by the prenyl-binding protein PDE6D,
    released inside the cilium by ARL3-GTP, and retained with the help of ARL13B.
    Without its farnesylated C terminus the truncated MORM protein cannot use this
    route and fails to accumulate in the ciliary membrane. The same targeting failure
    is produced from the carrier side by a homozygous PDE6D splice variant in Joubert
    syndrome. The conformance target is the module's ciliary-gating node; the MORM
    defect is in cargo targeting rather than in basal-body or transition-zone
    structure, so the fit is partial.
  genes:
  - preferred_term: INPP5E
    term:
      id: hgnc:21474
      label: INPP5E
  - preferred_term: PDE6D
    term:
      id: hgnc:8788
      label: PDE6D
  cellular_components:
  - preferred_term: cilium
    term:
      id: GO:0005929
      label: cilium
  biological_processes:
  - preferred_term: protein localization to cilium
    term:
      id: GO:0061512
      label: protein localization to cilium
    modifier: DECREASED
  downstream:
  - target: Ciliary Phosphoinositide Imbalance
    causal_link_type: DIRECT
    description: >-
      INPP5E is the 5-phosphatase that keeps PI(4,5)P2 out of the ciliary membrane, so
      its absence from the cilium lets PI(4,5)P2 accumulate there.
    evidence:
    - reference: PMID:26190144
      reference_title: Modulation of Ciliary Phosphoinositide Content Regulates Trafficking and Sonic Hedgehog Signaling Output.
      supports: SUPPORT
      evidence_source: IN_VITRO
      directness: INDIRECT
      snippet: >-
        Upon INPP5E inactivation, PI(4,5)P2 accumulates at the ciliary tip whereas PI4P
        is depleted.
      explanation: >-
        Shown for INPP5E inactivation in neural stem cells rather than for the MORM
        truncation itself; the inference is that removing INPP5E from the cilium has
        the same effect on the ciliary lipid pool.
  - target: Primary Cilium Instability
    causal_link_type: DIRECT
    description: >-
      The MORM allele was shown to impair both INPP5E ciliary localization and cilium
      stability in the founding family.
    evidence:
    - reference: PMID:19668215
      reference_title: "INPP5E mutations cause primary cilium signaling defects, ciliary instability and ciliopathies in human and mouse."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In human INPP5E, we identified a mutation affecting INPP5E ciliary localization
        and cilium stability in a family with MORM syndrome
      explanation: >-
        Connects the MORM allele's loss of ciliary localization with ciliary
        instability.
  evidence:
  - reference: PMID:23150559
    reference_title: "ARL13B, PDE6D, and CEP164 form a functional network for INPP5E ciliary targeting."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      INPP5E is targeted to the primary cilium through a motif near the C terminus and
      prenyl-binding protein phosphodiesterase 6D (PDE6D)-dependent mechanisms.
    explanation: >-
      Locates the ciliary targeting signal at the C terminus that the MORM truncations
      remove.
  - reference: PMID:29140789
    reference_title: Mechanism and dynamics of INPP5E transport into and inside the ciliary compartment.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The farnesylation defective INPP5E CaaX box mutant loses the exclusive ciliary
      localization.
    explanation: >-
      An engineered CaaX-box mutant reproduces the loss of ciliary localization
      expected of a truncation that deletes the box.
  - reference: PMID:24166846
    reference_title: A homozygous PDE6D mutation in Joubert syndrome impairs targeting of farnesylated INPP5E protein to the primary cilium.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Mutant PDE6D shows reduced binding to INPP5E, which fails to localize to primary
      cilia in patient fibroblasts and tissues.
    explanation: >-
      Shows in a binding assay and in cultured patient fibroblasts and patient tissue
      sections that INPP5E ciliary targeting depends on PDE6D binding to its
      prenylated C terminus. Graded IN_VITRO because every measurement in the
      sentence is made outside the organism.
- name: Ciliary Phosphoinositide Imbalance
  biological_scale: MOLECULAR
  description: >-
    Ciliary INPP5E converts PI(4,5)P2 to PI4P, keeping the ciliary membrane PI4P-rich.
    When INPP5E is absent, PI(4,5)P2 accumulates and recruits TULP3 together with the
    Hedgehog-repressing receptor GPR161 into the cilium, raising ciliary cAMP.
  genes:
  - preferred_term: INPP5E
    term:
      id: hgnc:21474
      label: INPP5E
  molecular_functions:
  - preferred_term: ciliary PI(4,5)P2 5-phosphatase activity
    term:
      id: GO:0004439
      label: phosphatidylinositol-4,5-bisphosphate 5-phosphatase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: phosphatidylinositol dephosphorylation
    term:
      id: GO:0046856
      label: phosphatidylinositol dephosphorylation
    modifier: DECREASED
  downstream:
  - target: Repressed Ciliary Hedgehog Signaling
    causal_link_type: DIRECT
    description: >-
      PI(4,5)P2-dependent recruitment of TULP3 and GPR161 raises cAMP and represses
      the Shh target gene Gli1.
    evidence:
    - reference: PMID:26190144
      reference_title: Modulation of Ciliary Phosphoinositide Content Regulates Trafficking and Sonic Hedgehog Signaling Output.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        This is accompanied by recruitment of the PI(4,5)P2-interacting protein TULP3 to
        the ciliary membrane, along with Gpr161. This results in an increased production
        of cAMP and a repression of the Shh transcription gene Gli1.
      explanation: >-
        Describes the step from ciliary PI(4,5)P2 accumulation to reduced Hedgehog
        output.
  evidence:
  - reference: PMID:26190144
    reference_title: Modulation of Ciliary Phosphoinositide Content Regulates Trafficking and Sonic Hedgehog Signaling Output.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our results reveal the link between ciliary regulation of phosphoinositides by
      INPP5E and Shh regulation via ciliary trafficking of TULP3/Gpr161 and also provide
      mechanistic insight into ciliary alterations found in Joubert and MORM syndromes
      resulting from INPP5E mutations.
    explanation: >-
      The authors relate the ciliary phosphoinositide defect to MORM syndrome
      explicitly.
- name: Repressed Ciliary Hedgehog Signaling
  biological_scale: CELLULAR
  conforms_to: "ciliopathy_dysfunction#Impaired Hedgehog Signal Transduction"
  description: >-
    Ciliary GPR161 and raised cAMP hold the Hedgehog pathway in its repressed state,
    lowering Gli1 output. This has been shown in INPP5E-inactivated neural stem cells;
    which MORM phenotypes, if any, follow from it has not been established, so no
    phenotype edge is drawn from this node.
  biological_processes:
  - preferred_term: smoothened signaling pathway
    term:
      id: GO:0007224
      label: smoothened signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:26190144
    reference_title: Modulation of Ciliary Phosphoinositide Content Regulates Trafficking and Sonic Hedgehog Signaling Output.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This results in an increased production of cAMP and a repression of the Shh
      transcription gene Gli1.
    explanation: >-
      Reduced Hedgehog transcriptional output after INPP5E inactivation.
- name: Primary Cilium Instability
  biological_scale: CELLULAR
  description: >-
    Loss of ciliary INPP5E does not prevent cilium assembly but destabilises
    pre-existing cilia after growth-factor stimulation, through unopposed ciliary
    PDGFR-alpha and PI3K signalling; blocking either restores stability in
    Inpp5e-deficient cells.

    modifier: INCREASED
  downstream:
  - target: Photoreceptor Ciliary Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Photoreceptors depend on a modified primary cilium, the connecting cilium, so
      a ciliary defect in INPP5E disease falls on them; this is an inference from
      INPP5E retinopathy generally rather than a measurement in MORM photoreceptors.
    evidence:
    - reference: PMID:41465079
      reference_title: Longitudinal Multimodal Assessment of Structure and Function in INPP5E-Related Retinopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      quote_role: BACKGROUND
      snippet: >-
        The INPP5E pathogenic variants disrupt normal phosphoinositide signaling,
        leading to ciliary dysfunction characterized by abnormalities in the structure
        and function of photoreceptor cilia
      explanation: >-
        Background statement from a non-syndromic INPP5E retinopathy report; it
        concerns INPP5E variants generally, not the MORM truncations.
  - target: Hypothalamic Ciliary Dysfunction in MC4R Neurons
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Obesity in MORM syndrome is attributed to loss of ciliary INPP5E function in
      hypothalamic energy-balance neurons; the support is mouse gene repression
      rather than the MORM allele itself.
    evidence:
    - reference: PMID:42838451
      reference_title: Cell-type-specific repression reveals MC4R neurons as a site of action for ciliary obesity genes.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: >-
        An in vivo CRISPRi screen of obesity-associated ciliopathy genes (Bbs10,
        Inpp5e, Ankrd26) demonstrated that their repression in MC4R neurons is
        sufficient to promote obesity
      explanation: >-
        Repressing Inpp5e in MC4R neurons is enough to cause obesity in mice. The
        link to the MORM allele is inferred, because the model lowers Inpp5e
        expression rather than mislocalising a truncated protein.
  evidence:
  - reference: PMID:19668215
    reference_title: "INPP5E mutations cause primary cilium signaling defects, ciliary instability and ciliopathies in human and mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Inpp5e inactivation did not impair ciliary assembly but altered the stability of
      pre-established cilia after serum addition. Blocking phosphoinositide 3-kinase
      (PI3K) activity or ciliary platelet-derived growth factor receptor alpha
      (PDGFRalpha) restored ciliary stability.
    explanation: >-
      Defines the instability phenotype and its PI3K/PDGFR-alpha dependence in
      Inpp5e-deficient mouse cells.
- name: Photoreceptor Ciliary Dysfunction
  biological_scale: TISSUE
  conforms_to: "ciliopathy_dysfunction#Photoreceptor Connecting Cilium Degeneration"
  description: >-
    Dysfunction of the photoreceptor connecting cilium produces the retinal dystrophy
    of MORM syndrome. It was described as congenital and non-progressive in the
    founding kindred but as a progressive cone-rod dystrophy in the Slovenian case,

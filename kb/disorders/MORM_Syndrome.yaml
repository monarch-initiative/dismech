experimental_models:
- name: INPP5E-knockout iPSC-derived human retinal organoids
  experimental_model_type: ORGANOID
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: photoreceptor cell
    term:
      id: CL:0000210
      label: photoreceptor cell
  cell_source: >-
    Human induced pluripotent stem cells carrying a CRISPR/Cas9 D477N substitution
    that inactivates the INPP5E catalytic domain, differentiated to retinal organoids
    over 230 days alongside isogenic controls.
  genes:
  - preferred_term: INPP5E
    term:
      id: hgnc:21474
      label: INPP5E
  publication: PMID:42374981
  description: >-
    Human retinal organoids in which INPP5E is functionally absent. INPP5E is at the
    photoreceptor connecting cilium in controls and undetectable in the mutant
    organoids, where ARL13B and rhodopsin are mislocalised and outer-segment membranes
    are elongated.
  modeled_mechanisms:
  - target: Photoreceptor Ciliary Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Shows in human photoreceptors that losing INPP5E disturbs connecting-cilium
      protein localisation and outer-segment membrane structure, which is the
      mechanism this node asserts, in human rather than mouse tissue.
    limitations: >-
      The allele is a catalytic-domain point mutation, the Joubert-type lesion rather
      than the MORM truncation; the organoids have no retinal pigment epithelium
      interaction or visual cycle, and no electrophysiological or visual outcome is
      measured.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        D477N abolishes INPP5E catalysis, which is the mechanism ClinGen attributes to
        Joubert syndrome 1 and explicitly contrasts with MORM syndrome, where
        enzymatic activity is retained and ciliary targeting is lost. The model
        therefore removes the activity the MORM protein keeps.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        A retinal organoid has no retinal pigment epithelium partner, no choroidal
        blood supply and no visual cycle, so outer-segment renewal and the functional
        consequence of the structural defect lie outside the model.
    readouts:
    - name: ARL13B and rhodopsin localisation in mature photoreceptors
      target: Photoreceptor Ciliary Dysfunction
      direction: ALTERED
      interpretation: >-
        Mislocalisation of a ciliary membrane protein and of opsin is the human
        correlate of connecting-cilium dysfunction in this node.
      evidence:
      - reference: PMID:42374981
        reference_title: Loss of INPP5E affects photoreceptor outer segment membrane biogenesis in iPSC-derived human retinal organoids.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          In mature ROs, INPP5E localizes to the connecting cilium of photoreceptors,
          and the loss of INPP5E leads to altered localization of ARL13B and rhodopsin
          in mature photoreceptors.
        explanation: >-
          The localisation measurement behind this readout.
    - name: Outer-segment membrane morphology
      target: Photoreceptor Ciliary Dysfunction
      direction: ALTERED
      interpretation: >-
        Elongated outer-segment membranes in both photoreceptor classes, read by the
        authors as a defect of outer-segment membrane biogenesis.
      evidence:
      - reference: PMID:42374981
        reference_title: Loss of INPP5E affects photoreceptor outer segment membrane biogenesis in iPSC-derived human retinal organoids.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          photoreceptor outer segment structure is affected, leading to elongated
          outer segment membranes in both cone and rod photoreceptors
        explanation: >-
          The structural measurement behind this readout.
    evidence:
    - reference: PMID:42374981
      reference_title: Loss of INPP5E affects photoreceptor outer segment membrane biogenesis in iPSC-derived human retinal organoids.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        we used human induced pluripotent stem cells (iPSCs) containing a
        CRISPR/Cas9-generated point mutation (D477N) that renders the catalytic domain
        of INPP5E non-functional
      explanation: >-
        Establishes the allele the model carries, which is both why it is informative

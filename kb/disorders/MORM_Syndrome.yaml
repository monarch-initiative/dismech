    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This results in an increased production of cAMP and a repression of the Shh
      transcription gene Gli1.
    explanation: >-
      Reduced Hedgehog transcriptional output after INPP5E inactivation.
- name: Primary Cilium Instability
  biological_scale: CELLULAR
  description: >-
    Loss of ciliary INPP5E does not prevent cilium assembly but destabilises
    pre-existing cilia after growth-factor stimulation, through unopposed ciliary
    PDGFR-alpha and PI3K signalling; blocking either restores stability in
    Inpp5e-deficient cells.

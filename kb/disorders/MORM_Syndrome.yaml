differential_diagnoses:
- name: Joubert syndrome 1
  description: >-
    Allelic INPP5E disorder caused by phosphatase-domain variants, curated as a
    subtype of the Joubert_syndrome entry.
  distinguishing_features:
  - Molar tooth sign, hypotonia, ataxia and abnormal breathing pattern in Joubert syndrome, absent in MORM syndrome
  - Renal, hepatic or skeletal involvement in Joubert syndrome, not reported in MORM syndrome
  disease_term:
    preferred_term: Joubert syndrome 1
    term:
      id: MONDO:0008944
      label: Joubert syndrome 1
  evidence:
  - reference: PMID:34211432
    reference_title: "Novel Insights Into Monogenic Obesity Syndrome Due to INPP5E Gene Variant: A Case Report of a Female Patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain magnetic resonance imaging did not show pathological changes; she lacked
      hypotonia, ataxia, and respiratory pattern disorder and did not present any
      renal, hepatic, or skeletal involvement to fit the diagnostic criteria
    explanation: >-
      The features that separated the MORM patient from Joubert syndrome.
- name: Bardet-Biedl syndrome
  description: >-
    The closest phenocopy, sharing obesity, retinal dystrophy, intellectual disability
    and genital hypoplasia.
  distinguishing_features:
  - Retinal dystrophy in MORM syndrome is congenital and was non-progressive in the founding kindred
  - No polydactyly in MORM syndrome
  - Small penis without testicular anomalies
  disease_term:
    preferred_term: Bardet-Biedl syndrome
    term:
      id: MONDO:0015229
      label: Bardet-Biedl syndrome
  evidence:
  - reference: PMID:16493448
    reference_title: "MORM syndrome (mental retardation, truncal obesity, retinal dystrophy and micropenis), a new autosomal recessive disorder, links to 9q34."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It shows similarities to Bardet-Biedl syndrome and Cohen syndrome, but can be
      distinguished by clinical features; the age of onset and nonprogressive nature
      of the visual impairment, the lack of characteristic facies, skin or gingival
      infection, microcephaly, 'mottled retina', polydactyly and small penis without
      testicular anomalies.
    explanation: >-
      The founding report's differential against Bardet-Biedl and Cohen syndromes.
- name: Cohen syndrome
  description: >-

diagnosis:
- name: Molecular genetic testing of INPP5E
  description: >-
    The diagnosis is established by finding a biallelic truncating INPP5E variant.
    Both reported families were solved by sequencing: the second Pakistani family by
    whole-exome sequencing, and the Slovenian patient by a targeted retinal-dystrophy
    panel followed by phenotype-driven reanalysis of the same data, after ALMS1
    sequencing had been negative.
  diagnosis_term:
    preferred_term: molecular genetic testing of INPP5E
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:31173343
    reference_title: BBS5 and INPP5E mutations associated with ciliopathy disorders in families from Pakistan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing identified the likely causes of disease as a novel
      homozygous frameshift mutation (NM_152384.2: c.196delA; p.(Arg66Glufs*12);
      family 1) in BBS5, and a nonsense mutation (NM_019892.5:c.1879C>T; p.Gln627*;
      family 2) in INPP5E
    explanation: >-
      Exome sequencing was the route to the molecular diagnosis in the second
      Pakistani MORM family.
  - reference: PMID:34211432
    reference_title: "Novel Insights Into Monogenic Obesity Syndrome Due to INPP5E Gene Variant: A Case Report of a Female Patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The regions of interest were enriched using TruSightOne library enrichment kit
      (Illumina, San Diego, USA) and targeted analysis of genes causative of cone-rod
      type of retinal dystrophy (list of genes in the Appendix), with no causative
      mutations found.
    explanation: >-
      A retinal-dystrophy gene panel missed the diagnosis in the Slovenian case,
      which is why broader analysis was needed.
- name: Retinal electrophysiology and imaging
  description: >-
    Electroretinography establishes the type of retinal dystrophy, and optical
    coherence tomography with fundus autofluorescence records outer-retinal thinning.
    In the Slovenian case electroretinography typed the dystrophy as cone-rod, which
    was the finding that distinguished her course from the non-progressive retinopathy
    of the founding kindred.
  diagnosis_term:
    preferred_term: electroretinography and retinal imaging
    term:
      id: NCIT:C101217
      label: Retinal Examination
  evidence:
  - reference: PMID:34211432
    reference_title: "Novel Insights Into Monogenic Obesity Syndrome Due to INPP5E Gene Variant: A Case Report of a Female Patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Electrophysiological examination (scotopic photopic electroretinography)
      confirmed cone-rod type retinal dystrophy.
    explanation: >-
      Electroretinography typed the retinal dystrophy in the only reported case with
      the second allele.
  - reference: PMID:34211432
    reference_title: "Novel Insights Into Monogenic Obesity Syndrome Due to INPP5E Gene Variant: A Case Report of a Female Patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      3D Optic Coherence Topography (Topcon 1000) analysis determined reduced retinal
      thickness with irregularities, predominantly of the outer retinal layer
    explanation: >-
      Optical coherence tomography recorded the outer-retinal thinning.
  - reference: PMID:41465079
    reference_title: Longitudinal Multimodal Assessment of Structure and Function in INPP5E-Related Retinopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Our findings posit that the EZ width, INL thickness, and cone flicker ERG are
      excellent candidate biomarkers for monitoring disease progression.
    explanation: >-
      Which measures track progression, proposed for non-syndromic INPP5E retinopathy
      rather than for MORM syndrome, so the transfer to this disease is an inference.
  notes: >-
    No INPP5E retinopathy entry in dismech carries reference_ranges, and neither cited
    report states a cut-off, so none is recorded here.
- name: Brain MRI
  description: >-
    Brain imaging in the Slovenian patient showed delayed myelination without

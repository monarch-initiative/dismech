- name: Hypothalamic Ciliary Dysfunction in MC4R Neurons
  biological_scale: TISSUE
  conforms_to: "ciliopathy_dysfunction#Hypothalamic Ciliary Signaling and Metabolic Dysfunction"
  description: >-
    MC4R-expressing neurons of the paraventricular hypothalamus regulate energy
    balance through their primary cilia. Repressing Inpp5e in these neurons in mice
    is sufficient to cause weight gain, and adult Inpp5e knockout mice become obese,
    which is consistent with the early-onset hyperphagic obesity of MORM syndrome.
  notes: >-
    The cell type is bound to generic neuron. CL has no general hypothalamic neuron
    class; its hypothalamic neuron terms are typed by transmitter or peptide
    (glutamatergic, GABAergic, kisspeptin, AgRP, POMC). The cited study defines its
    cells only as MC4R-expressing neurons of the paraventricular hypothalamus, so a
    transmitter-typed term would claim more than the source states.
  cell_types:

name: MORM Syndrome
creation_date: "2026-11-23T17:15:44Z"
category: Mendelian
description: >-
  MORM syndrome (mental retardation, truncal obesity, retinal dystrophy and
  micropenis) is an autosomal recessive ciliopathy caused by biallelic nonsense
  variants in the last exon of INPP5E that truncate the protein just upstream of
  its C-terminal CaaX farnesylation motif. It was first described in a large
  consanguineous Pakistani kindred, where a founder p.Gln627* allele segregates,
  and a second truncating allele (p.Gln633*) has since been reported in a
  Slovenian girl. The truncated phosphatase loses its PDE6D-dependent ciliary
  targeting rather than its catalytic activity, which distinguishes MORM syndrome
  mechanistically from the allelic Joubert syndrome 1, whose INPP5E variants
  cluster in the phosphatase domain and abolish 5-phosphatase activity. The
  clinical picture is static intellectual disability, early-onset truncal obesity
  with hyperphagia and insulin resistance, retinal dystrophy, and micropenis in
  males, without the molar tooth sign or renal involvement of Joubert syndrome.
synonyms:
- MORMS
- mental retardation, truncal obesity, retinal dystrophy, and micropenis
- impaired intellectual development, truncal obesity, retinal dystrophy, and micropenis syndrome
notes: >-
  Curated as its own entry rather than folded into the allelic Joubert syndrome 1
  (a has_subtypes row of the Joubert_syndrome entry): MONDO, OMIM (610156) and the
  ClinGen Syndromic Disorders GCEP all treat MORM syndrome as a separate disease,
  and the ClinGen lumping-and-splitting rationale cites both a distinct presentation
  and a distinct molecular mechanism (loss of ciliary targeting with retained
  enzymatic activity, versus loss of phosphatase activity in JBTS1). No GeneReviews
  chapter covers MORM syndrome; the GeneReviews Joubert syndrome chapter is an
  Overview whose abstract does not mention it. The phenotype baseline is therefore
  the founding family report (PMID:16493448), the second family report
  (PMID:31173343), the single Slovenian case report (PMID:34211432) and the ClinGen
  curation summary. Fewer than five families are published, so no phenotype
  frequencies are recorded, and the metabolic, respiratory and pubertal features
  rest on one patient.

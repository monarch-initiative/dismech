animal_models:
- name: Retina-specific Inpp5e knockout mouse (Inpp5e F/F; Six3-Cre)
  species: Mouse
  genotype: Inpp5e conditional null, Six3-Cre driven retinal deletion (retInpp5e-/-)
  genes:
  - preferred_term: Inpp5e
    term:
      id: MGI:1927753
      label: Inpp5e
  publication: PMID:33711342
  description: >-
    Conditional deletion of Inpp5e throughout the retina. Photoreceptor outer-segment
    discs and the axoneme fail to form, intraflagellar transport particles pile up at
    the distal connecting cilium, and the retina degenerates almost completely in the
    first three postnatal weeks.
  modeled_mechanisms:
  - target: Photoreceptor Ciliary Dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Shows that losing INPP5E from photoreceptors disrupts the connecting cilium and
      outer-segment assembly, which is the mechanism this node asserts.
    limitations: >-
      A retina-restricted null allele, not the MORM C-terminal truncation, so the
      model removes the whole protein rather than its ciliary targeting; and the
      degeneration is complete by postnatal day 21, whereas the retinopathy of the
      founding kindred was congenital and non-progressive.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        The MORM lesion is a nonsense variant in the terminal exon that leaves the
        phosphatase domain intact and removes only the farnesylated C terminus. This
        model deletes the gene, so no truncated, mistargeted protein is present and
        the targeting failure that defines the human mechanism is not what is being
        modelled.
    - divergence_type: TEMPORAL_SCOPE
      materiality: QUALIFYING
      description: >-
        The mouse retina degenerates almost entirely within three postnatal weeks,
        a Leber congenital amaurosis-like course. The retinal dystrophy of the
        founding MORM kindred was described as congenital and non-progressive, so the
        model's time course is not the human one even where the cell biology matches.
    readouts:
    - name: Outer-segment disc and axoneme formation
      target: Photoreceptor Ciliary Dysfunction
      direction: ABOLISHED
      interpretation: >-
        Structural correlate of connecting-cilium dysfunction in this model.
      evidence:
      - reference: PMID:33711342
        reference_title: Deletion of the phosphatase INPP5E in the murine retina impairs photoreceptor axoneme formation and prevents disc morphogenesis.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Although P10 mutant outer segments contain structural and phototransduction
          proteins, axonemal structure and disc membranes fail to form
        explanation: >-
          Reports the structural measurement behind this readout.
    - name: Intraflagellar transport particle distribution in the connecting cilium
      target: Photoreceptor Ciliary Dysfunction
      direction: ALTERED
      interpretation: >-
        Accumulation at the distal connecting cilium is read by the authors as
        disrupted intraflagellar transport.
      evidence:
      - reference: PMID:33711342
        reference_title: Deletion of the phosphatase INPP5E in the murine retina impairs photoreceptor axoneme formation and prevents disc morphogenesis.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Connecting cilia of retInpp5e-/- rods display accumulation of intraflagellar
          transport particles A and B at their distal ends, suggesting disrupted
          intraflagellar transport
        explanation: >-
          The ciliary transport measurement in this model.
    evidence:
    - reference: PMID:33711342
      reference_title: Deletion of the phosphatase INPP5E in the murine retina impairs photoreceptor axoneme formation and prevents disc morphogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        we generated mice with a retina-specific KO (Inpp5eF/F;Six3Cre, abbreviated as
        retInpp5e-/-)
      explanation: >-
        Establishes what the model is: retina-restricted loss of Inpp5e, which is why
        it is informative for the photoreceptor node.
- name: MC4R-neuron Inpp5e CRISPRi mouse
  species: Mouse
  genotype: Mc4r-t2a-Cre; LSL-dCas9-KRAB with AAV-delivered Inpp5e sgRNA
  genes:
  - preferred_term: Inpp5e
    term:
      id: MGI:1927753
      label: Inpp5e
  publication: PMID:42838451
  description: >-
    Cre-dependent CRISPR interference represses Inpp5e specifically in
    MC4R-expressing neurons, without editing the DNA, and body weight is followed
    from 4 to 20 weeks. Repression in these neurons alone is enough to cause weight
    gain.
  modeled_mechanisms:
  - target: Hypothalamic Ciliary Dysfunction in MC4R Neurons
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Locates the obesity-relevant action of Inpp5e in MC4R neurons, which is the
      claim this node makes, and shows that losing it there is sufficient for weight
      gain.
    limitations: >-
      Transcriptional repression of Inpp5e in a mouse neuronal population, not the
      human C-terminal truncation; the readout is body weight and composition rather
      than any ciliary measurement in those neurons, and the authors describe the
      Inpp5e effect as smaller than that of Mc4r or Adcy3 repression.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        CRISPRi lowers Inpp5e transcript levels. The MORM allele instead produces a
        full-length-minus-CaaX protein that keeps its catalytic activity and cannot
        enter the cilium, so the model reproduces absence of the protein's function
        rather than its mislocalisation.
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The node asserts ciliary signalling failure in MC4R neurons. What the model
        measures is body weight and body composition of the whole animal; no ciliary
        quantity in those neurons is reported, so the cellular claim rests on the
        organismal outcome.

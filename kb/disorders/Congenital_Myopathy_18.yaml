  harrisons_chapter:
  - classification_value: NEUROLOGIC
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
notes: >-
  No GeneReviews chapter covers this disorder. Death in infancy from
  respiratory failure is recorded in the respiratory phenotype description
  rather than as a separate phenotype. CACNA1S is also a malignant
  hyperthermia susceptibility gene (MHS5), but no malignant hyperthermia
  reaction has been reported in this patient group, and the cited sources
  give no myopathy-specific anaesthesia guidance. Cognitive delay, sensorineural hearing loss, short
  stature and neurogenic biopsy changes were each reported in single patients
  and are not annotated, because their relation to CACNA1S is uncertain. The
  heterozygous CACNA1S phenotypes of exertional myalgia, rhabdomyolysis and
  hyperCKemia (PMID:40018084; p.Arg528Leu at a periodic paralysis residue,
  PMID:29193480) and the permanent myopathy that can follow hypokalemic
  periodic paralysis are allelic phenotypes with onset mostly in childhood or
  later, described by their authors as lying between periodic paralysis and
  congenital myopathy, and are not part of this entry. Patient-derived iPSC lines from dominant and recessive cases
  exist (PMID:40885023), but no phenotype data from them have been
  published.

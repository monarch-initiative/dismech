genetic:
- name: CACNA1S
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: CACNA1S
    term:
      id: hgnc:1397
      label: CACNA1S
  notes: >-
    Reported alleles (NM_000069) include homozygous missense p.(Arg789His)
    and p.(Ala63Asp); compound heterozygous combinations of nonsense
    (p.Gln1485*, p.Trp990*, p.Arg1702*), frameshift (p.Leu791Cysfs*37,
    p.Leu873Argfs*21, p.Gln1649Glnfs*72), splice (c.1394-2A>G, c.3526-2A>G)
    and missense alleles (for example p.Met222Lys with p.Arg789Cys in a
    recurrent fetal akinesia family); and heterozygous missense alleles
    inherited dominantly or arising de novo (p.Pro742Gln, p.Pro742Ser,
    p.Leu1367Val, p.Asn909Ser). Variants cluster in the II-III cytoplasmic
    loop that couples Cav1.1 to RYR1 and in the C-terminal region. OMIM
    records this disorder as 620246 (MONDO exactMatch). No ClinGen
    gene-disease validity record exists for CACNA1S and congenital myopathy;
    the only cached ClinGen CACNA1S assertion is for malignant hyperthermia
    susceptibility 5.
  evidence:
  - reference: PMID:28012042
    reference_title: "Dihydropyridine receptor (DHPR, CACNA1S) congenital myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing revealed ten recessive or dominant mutations in CACNA1S (Cav1.1), the pore-forming subunit of DHPR in skeletal muscle."
    explanation: Defines CACNA1S as the causal gene in 11 patients from 7 families.
  - reference: PMID:31227654
    reference_title: "Dihydropyridine Receptor Congenital Myopathy In A Consangineous Turkish Family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe a consanguineous family with three affected children, presenting congenital hypotonia, contractures, ophthalmoplegia and respiratory insufficiency, with a novel homozygous mutation in the CACNA1S gene."
    explanation: Independent homozygous family.
  - reference: PMID:38111203
    reference_title: "Biallellic variants in CACNA1S cause fetal akinesia sequence, progressive hydrops and stillbirth."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Trio whole exome sequencing (WES) detected compound heterozygous likely pathogenic CACNA1S gene variants associated with autosomal dominant (AD) and autosomal recessive (AR) congenital myopathy and FADS."
    explanation: Compound heterozygous variants in a prenatal case.

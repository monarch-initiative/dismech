- name: Impaired Depolarization-Induced Sarcoplasmic Reticulum Calcium Release
  biological_scale: CELLULAR
  description: >-
    In skeletal muscle, the DHPR on the T-tubule is mechanically coupled to
    RYR1 on the sarcoplasmic reticulum. Reduced Cav1.1 lowers the calcium
    released per depolarization, a failure of excitation-contraction coupling
    shared with the RYR1 and STAC3 congenital myopathies.
  genes:
  - preferred_term: CACNA1S
    term:
      id: hgnc:1397
      label: CACNA1S
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  - preferred_term: myotube
    term:
      id: CL:0002372
      label: myotube
  biological_processes:
  - preferred_term: release of sequestered calcium ion into cytosol by sarcoplasmic reticulum
    term:
      id: GO:0014808
      label: release of sequestered calcium ion into cytosol by sarcoplasmic reticulum
    modifier: DECREASED
  evidence:
  - reference: PMID:28012042
    reference_title: "Dihydropyridine receptor (DHPR, CACNA1S) congenital myopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "and with a major impairment of Ca2+ release induced by depolarization in cultured myotubes"
    explanation: Calcium release defect measured in patient myotubes.
  - reference: PMID:28012042
    reference_title: "Dihydropyridine receptor (DHPR, CACNA1S) congenital myopathy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "In skeletal muscle, ECC is performed by the direct coupling of a voltage-gated L-type Ca2+ channel (dihydropyridine receptor; DHPR) located on the T-tubule with a Ca2+ release channel (ryanodine receptor; RYR1) on the sarcoplasmic reticulum (SR) component of the triad."
    explanation: Background on the normal DHPR-RYR1 coupling that is impaired.
  downstream:
  - target: Reduced Skeletal Muscle Contractile Force
    causal_link_type: DIRECT
    description: >-
      Less calcium per depolarization yields less force per stimulus, from
      fetal life onward.
    evidence:
    - reference: PMID:28012042
      reference_title: "Dihydropyridine receptor (DHPR, CACNA1S) congenital myopathy."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      snippet: "Muscle contraction upon nerve stimulation relies on excitation-contraction coupling (ECC) to promote the rapid and generalized release of calcium within myofibers."
      explanation: Contraction depends on the calcium release that is impaired.

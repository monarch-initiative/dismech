pathophysiology:
- name: Reduced Cav1.1 Protein in Skeletal Muscle
  biological_scale: MOLECULAR
  description: >-
    Recessive and dominant CACNA1S variants (missense, nonsense, frameshift and
    splice alleles) lower the amount of Cav1.1 (DHPR alpha1S) protein in
    skeletal muscle, through loss of expression or reduced protein stability.
    How heterozygous missense variants reduce protein, and whether some act
    dominant-negatively, has not been established.

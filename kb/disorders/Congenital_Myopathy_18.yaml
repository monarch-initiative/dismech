- name: Congenital Generalized Muscle Weakness
  biological_scale: ORGANISM
  description: >-
    Hypotonia at or before birth with generalized weakness, predominantly
    axial and proximal, facial weakness with a high-arched palate,
    ophthalmoplegia or ptosis in a subset, oropharyngeal weakness with
    feeding and swallowing difficulty, delayed motor milestones and scoliosis.
    Some patients have milder childhood- or adult-onset proximal weakness.
  evidence:
  - reference: PMID:37510268
    reference_title: "Congenital Myopathy as a Phenotypic Expression of CACNA1S Gene Mutation: Case Report and Systematic Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The characteristic features of most affected individuals were delayed motor development with generalized hypotonia, a weakness of the facial muscles with a high arched palate, progressive axial and limb muscle weakness with a proximal-distal gradient beginning soon after birth or in infancy, swallowing difficulties to the point of needing a gastrostomy in severe cases, and mild to severe respiratory involvement."
    explanation: Pooled clinical picture across published patients.
  downstream:
  - target: Neonatal hypotonia
    causal_link_type: DIRECT

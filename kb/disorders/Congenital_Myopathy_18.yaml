  - preferred_term: CACNA1S
    term:
      id: hgnc:1397
      label: CACNA1S
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  cell_types:
  - preferred_term: skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  molecular_functions:
  - preferred_term: L-type (high voltage-gated) calcium channel activity of Cav1.1
    term:
      id: GO:0008331
      label: high voltage-gated calcium channel activity
    modifier: DECREASED
  evidence:
  - reference: PMID:37510268
    reference_title: "Congenital Myopathy as a Phenotypic Expression of CACNA1S Gene Mutation: Case Report and Systematic Review of the Literature."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "The CACNA1S gene encodes the α-1s subunit of the dihydropyridine receptor (DHPR), a voltage-gated calcium channel and voltage sensor for calcium release in skeletal muscle"
    explanation: >-
      Background on the molecular function of Cav1.1: an L-type voltage-gated
      calcium channel that also acts as the voltage sensor for SR calcium
      release. Less Cav1.1 protein means less of this activity at the triad.
  - reference: PMID:37510268
    reference_title: "Congenital Myopathy as a Phenotypic Expression of CACNA1S Gene Mutation: Case Report and Systematic Review of the Literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Both recessive and dominant mutations are linked with a reduction in protein levels and an impairment of the calcium release induced by depolarization"
    explanation: >-
      Review synthesis of the founding functional work: reduced Cav1.1 protein
      with both recessive and dominant alleles.
  - reference: PMID:37930228
    reference_title: "Two zebrafish cacna1s loss-of-function variants provide models of mild and severe CACNA1S-related myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Disease associated variants result in loss of gene expression and/or reduction of Cav1.1 protein stability."
    explanation: Background statement of the human allele mechanism in the zebrafish model paper.
  - reference: PMID:38426167
    reference_title: "Case report: Dihydropyridine receptor (CACNA1S) congenital myopathy, a novel phenotype with early onset periodic paralysis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Minigene assay revealed the splicing variant caused skipping of exon 28 from the transcript, potentially affecting protein folding and/or voltage dependent activation."
    explanation: A splice allele removes an exon from the CACNA1S transcript.
  downstream:

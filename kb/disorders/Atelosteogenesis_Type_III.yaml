  evidence:
  - reference: PMID:20301736
    reference_title: FLNB-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Monoallelic gain-of-function pathogenic variants in FLNB cause a spectrum
      of phenotypic severity ranging from apparently isolated clubfoot to Larsen
      syndrome (FLNB-LS), atelosteogenesis type 3 (FLNB-AO3), and
      atelosteogenesis type 1 (FLNB-AO1), which is perinatal lethal.
    explanation: GeneReviews establishes the monoallelic gain-of-function classification for FLNB-AO3.
  - reference: PMID:14991055
    reference_title: "Mutations in the gene encoding filamin B disrupt vertebral segmentation, joint formation and skeletogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The filamins are cytoplasmic proteins that regulate the structure and
      activity of the cytoskeleton by cross-linking actin into three-dimensional
      networks, linking the cell membrane to the cytoskeleton and serving as
      scaffolds on which intracellular signaling and protein trafficking
      pathways are organized (reviewed in refs. 1,2).
    explanation: >-
      The causal gene's established protein functions supply the cytoskeletal context without specifying an AO3-only downstream interaction.
  - reference: PMID:16752402
    reference_title: "Mutations in two regions of FLNB result in atelosteogenesis I and III."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of the mutations resided in exon 2 and exon 3, which encode
      the CH2 domain of the actin-binding region of filamin B. The remaining
      mutations were found in exon 28 and exon 29, which encode repeats 14 and
      15 of filamin B.
    explanation: The AO1/AO3 patient series identifies two recurrent FLNB variant clusters.
  downstream:
  - target: Abnormal joint formation, vertebral development, and endochondral ossification
    description: >
      Human developmental-expression and disease-association data connect FLNB
      to growth-plate, joint, vertebral, and ossification phenotypes, but do not
      resolve the complete molecular-to-tissue chain for AO3.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:14991055
      reference_title: "Mutations in the gene encoding filamin B disrupt vertebral segmentation, joint formation and skeletogenesis."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We found that filamin B is expressed in human growth plate chondrocytes
      explanation: Developmental expression supports the proposed tissue bridge, while the intermediate causal steps remain unresolved.
- name: Abnormal joint formation, vertebral development, and endochondral ossification
  description: >
    Filamin B has a developmental role in joint formation, vertebral
    segmentation, and endochondral ossification. In AO3, disruption of these
    processes provides a bounded tissue-level explanation for congenital joint
    dislocations, severe limb and long-bone abnormalities, and vertebral
    dysplasia. Clinical occurrence supports endpoint placement but generally
    does not prove directness of individual edges.

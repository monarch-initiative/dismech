definitions:
- name: FLNB-AO3 spectrum definition
  definition_type: OTHER
  description: >
    A severe monoallelic FLNB gain-of-function disorder within a continuous
    phenotypic spectrum that also includes FLNB-related Larsen syndrome and
    FLNB-AO1. AO3 shares severe short-limb dwarfism, large-joint dislocations,
    and clubfeet with AO1, while postneonatal and adult survival distinguishes
    the possible AO3 course from perinatal-lethal AO1.
  evidence:
  - reference: PMID:20301736
    reference_title: FLNB-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Monoallelic gain-of-function pathogenic variants in FLNB cause a spectrum
      of phenotypic severity ranging from apparently isolated clubfoot to Larsen
      syndrome (FLNB-LS), atelosteogenesis type 3 (FLNB-AO3), and
      atelosteogenesis type 1 (FLNB-AO1), which is perinatal lethal.
    explanation: The current GeneReviews update defines AO3 within the monoallelic FLNB gain-of-function spectrum.
  - reference: PMID:10076882
    reference_title: "Atelosteogenesis type III: long term survival, prenatal diagnosis, and evidence for dominant transmission."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is the first documentation of survival to adulthood of an individual
      with this disorder, of prenatal diagnostic assessment of an affected
      individual, and of vertical transmission suggestive of autosomal dominant
      inheritance.
    explanation: The mother-son report establishes that AO3 can be compatible with adult survival and vertical transmission.
inheritance:
- name: Autosomal dominant FLNB disorder
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    FLNB-AO3 follows an autosomal dominant disease model and is caused by a
    heterozygous gain-of-function FLNB pathogenic variant. Both vertical
    transmission and occurrence in an apparently simplex family are possible;
    parental mosaicism and marked intrafamilial severity differences must be
    considered in recurrence counseling.
  evidence:
  - reference: PMID:14991055
    reference_title: "Mutations in the gene encoding filamin B disrupt vertebral segmentation, joint formation and skeletogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found homozygosity or compound heterozygosity with respect to stop-codon mutations in autosomal recessive spondylocarpotarsal syndrome (SCT, OMIM 272460) and missense mutations in individuals with autosomal dominant Larsen syndrome (OMIM 150250) and the perinatal lethal atelosteogenesis I and III phenotypes (AOI, OMIM 108720; AOIII, OMIM 108721).
    explanation: >-
      This directly supports autosomal dominant inheritance for the AOIII FLNB phenotype.
  - reference: PMID:10076882
    reference_title: "Atelosteogenesis type III: long term survival, prenatal diagnosis, and evidence for dominant transmission."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe two additional instances of atelosteogenesis, type III, in a
      woman and her son.
    explanation: A mother-son pair provides direct evidence that AO3 can be transmitted vertically.
  - reference: PMID:20301736
    reference_title: FLNB-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Comparatively mild (e.g., FLNB-LS) and severe (e.g., FLNB-AO3) forms of
      the autosomal dominant FLNB-related disorders can occur in the same
      family.
    explanation: GeneReviews documents dominant inheritance with substantial within-family phenotypic variability.

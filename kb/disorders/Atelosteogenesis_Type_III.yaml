name: Atelosteogenesis Type III
creation_date: '2026-03-04T07:57:38Z'
category: Mendelian
description: >
  Atelosteogenesis type III (FLNB-AO3) is a severe but variably survivable
  monoallelic FLNB gain-of-function skeletal dysplasia. It is characterized by
  severe short-limb disproportion, congenital large-joint dislocations,
  clubfeet, vertebral and long-bone abnormalities, and variable craniofacial,
  thoracic, and laryngotracheal involvement. Respiratory compromise can be
  life-threatening and may require invasive support, but survival into childhood
  and adulthood is documented; it should not be modeled as uniformly perinatal
  lethal.

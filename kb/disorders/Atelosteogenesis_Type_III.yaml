genetic:
- name: Heterozygous gain-of-function FLNB pathogenic variants
  association: CAUSATIVE
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: FLNB
    term:
      id: hgnc:3755
      label: FLNB
  notes: >
    Heterozygous gain-of-function FLNB variants cause AO3. The same recurrent
    variant can span AO1/AO3 or broader FLNB phenotypes, so variant identity

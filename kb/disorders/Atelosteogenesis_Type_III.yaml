diagnosis:
- name: Clinical and Skeletal Radiographic Evaluation
  description: >
    Prenatal or postnatal imaging can identify the AO3 pattern of severe
    short-limb dysplasia, congenital dislocations, humeral and other long-bone
    abnormalities, and vertebral clefting or curvature. Because AO3 overlaps
    AO1, Larsen syndrome, atelosteogenesis type II, and otopalatodigital type II,
    radiography establishes a pattern and differential rather than a gene-level
    diagnosis.
  diagnosis_term:
    preferred_term: radiograph imaging procedure
    term:
      id: NCIT:C38101
      label: X-Ray Imaging
  evidence:
  - reference: PMID:1442028
    reference_title: "Atelosteogenesis type 3: the first patient in Japan and a survivor for more than 1 year."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Radiological examination demonstrated striking hypoplasia of the humerus with proximal rounding and distal tapering giving a 'drumstick' appearance, 'S'-shape configuration of the cervical spine, scoliosis and coronal cleft in the thoracolumbar vertebral bodies.
    explanation: >-
      This supports the diagnostic importance of distinctive radiographic skeletal abnormalities.
- name: Molecular FLNB Confirmation and Spectrum Assignment
  description: >
    Molecular diagnosis requires identification of a heterozygous
    gain-of-function pathogenic FLNB variant. The variant must be interpreted
    together with the clinical-radiographic phenotype because FLNB-AO3 overlaps
    a broader allelic spectrum and individual variants do not always predict a
    single severity category.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
    qualifiers:
    - predicate:
        preferred_term: has participant
        term:
          id: RO:0000057
          label: has participant
      value:
        preferred_term: FLNB
        term:
          id: hgnc:3755
          label: FLNB
  results: A heterozygous gain-of-function pathogenic FLNB variant.
  evidence:
  - reference: PMID:20301736
    reference_title: FLNB-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of other FLNB-related disorders (LS, AO1, AO3) is
      established in a proband by identification of a heterozygous
      gain-of-function pathogenic variant in FLNB by molecular genetic testing.
    explanation: >-
      GeneReviews defines molecular confirmation for AO3 and the overlapping dominant FLNB spectrum.
treatments:
- name: Individualized Respiratory and Airway Support
  description: >
    Respiratory assessment should distinguish thoracic restriction from upper-
    and central-airway instability. Support is individualized; some infants may
    require prolonged ventilation, tracheostomy, or other invasive airway care,
    while published survival and severity vary. A single case requiring
    tracheostomy demonstrates possibility, not a universal treatment rule.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:1442028
    reference_title: "Atelosteogenesis type 3: the first patient in Japan and a survivor for more than 1 year."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The infant experienced recurrent apnea and persistent severe tracheomalacia, which necessitated tracheostomy at 5 months of age.
    explanation: >-
      The case demonstrates that severe AO3 airway disease can require tracheostomy.
  - reference: PMID:20301736
    reference_title: FLNB-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In individuals with FLNB-AO3, survival beyond the neonatal period is
      possible with intensive and invasive respiratory support.
    explanation: GeneReviews supports planning for intensive respiratory support in selected individuals while acknowledging survival variability.
- name: Individualized Orthopedic Follow-up in Survivors
  description: >
    Long-term survivors require individualized orthopedic assessment of joint
    dislocations, spinal curvature, limb deformity, mobility, and function. The
    published AO3 management literature is case-based, so no single operation or
    schedule is generalized to all affected individuals.
  treatment_term:
    preferred_term: orthopedic procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  evidence:
  - reference: PMID:27258362
    reference_title: "Atelosteogenesis type III: orthopedic management."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the literature, an orthopedic management for this disorder has not
      been well described. We report the case and orthopedic management of a
      6-year-old female patient with atelosteogenesis type III after 3 years of
      follow-up.
    explanation: The report demonstrates multiyear orthopedic management but also shows that the evidence base is limited to case experience.
- name: Genetic Counseling and Parental Evaluation
  description: >
    Counseling should explain autosomal dominant inheritance, the possibility of
    de novo or inherited disease, parental somatic or gonadal mosaicism, marked
    phenotypic variability, and a 50% transmission risk from a constitutional
    heterozygous individual. Evaluation of parents for the familial variant and
    subtle FLNB-spectrum findings refines recurrence counseling.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301736
    reference_title: FLNB-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      FLNB-LS, FLNB-AO1, FLNB-AO3, and FLNB-related apparently isolated clubfoot
      are inherited in an autosomal dominant manner.
    explanation: GeneReviews establishes the inheritance model underlying counseling.
  - reference: PMID:20301736
    reference_title: FLNB-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Each child of a proband who is heterozygous for an FLNB pathogenic variant
      has a 50% chance of inheriting the pathogenic variant.
    explanation: GeneReviews provides the transmission risk for a constitutional heterozygous parent.
differential_diagnoses:
- name: Atelosteogenesis type I
  description: >
    The perinatal-lethal FLNB-AO1 end of the same gain-of-function spectrum can
    overlap AO3 in skeletal and joint findings. Persistent postneonatal or adult
    survival supports AO3, whereas AO1 is defined as perinatal lethal in current
    GeneReviews scope; molecular results still require phenotype-level spectrum
    interpretation.
  disease_term:
    preferred_term: atelosteogenesis type I
    term:
      id: MONDO:0007167
      label: atelosteogenesis type I
  distinguishing_features:
  - FLNB-AO1 is defined as perinatal lethal in the current spectrum
  - Survival beyond the neonatal period is possible in FLNB-AO3
  evidence:
  - reference: PMID:20301736
    reference_title: FLNB-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      FLNB-AO1 is lethal in the perinatal period. At its most severe, the
      spectrum of phenotypes assigned FLNB-AO1 can present with perinatal-lethal
      micromelic dwarfism characterized by flipper-like limbs (polysyndactyly
      with complete syndactyly of all fingers and toes, hypoplastic or absent
      first digits, and duplicated intermediate and distal phalanges);
      macrobrachycephaly; prominent forehead; hypertelorism; and proptosis.
    explanation: GeneReviews supplies the perinatal-lethal AO1 boundary used to distinguish it from survivable AO3.
- name: Atelosteogenesis type II
  description: >
    A clinically and radiographically overlapping perinatal-lethal dysplasia in
    the autosomal recessive SLC26A2 sulfate-transporter spectrum, with a
    cartilage-matrix sulfation disorder rather than monoallelic FLNB gain of
    function.
  disease_term:
    preferred_term: atelosteogenesis type II
    term:
      id: MONDO:0009727
      label: atelosteogenesis type II
  distinguishing_features:
  - Biallelic SLC26A2 disorder rather than a heterozygous FLNB disorder
  - Distinctive cartilage-matrix histopathology and sulfation pathogenesis
  evidence:
  - reference: PMID:9133349
    reference_title: "Atelosteogenesis syndromes: a review, with comments on their pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Atelosteogenesis type II shows distinctive chondro-osseous histopathology
      with a major disturbance in cartilage matrix macromolecules.
    explanation: The review identifies the cartilage-matrix distinction between AO2 and FLNB-related AO3.
- name: Larsen syndrome
  description: >
    A generally milder monoallelic FLNB gain-of-function disorder with
    congenital large-joint dislocations, clubfeet, craniofacial findings, and
    vertebral abnormalities. Larsen syndrome and AO3 are allelic and can overlap
    within families, so severity and full radiographic pattern guide assignment.
  disease_term:
    preferred_term: Larsen syndrome
    term:
      id: MONDO:0007875
      label: Larsen syndrome
  distinguishing_features:
  - Generally milder skeletal severity than AO3
  - Allelic FLNB overlap and within-family variability limit rigid variant-only classification
  evidence:
  - reference: PMID:10076882
    reference_title: "Atelosteogenesis type III: long term survival, prenatal diagnosis, and evidence for dominant transmission."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical and radiologic phenotype of atelosteogenesis, type III
      overlaps with that of another skeletal dysplasia, autosomal dominant
      Larsen syndrome; these most likely represent allelic conditions.
    explanation: The familial AO3 report explicitly identifies Larsen syndrome as an overlapping allelic differential.
- name: Otopalatodigital syndrome type II
  description: >
    A severe X-linked FLNA-related skeletal dysplasia with craniofacial, digital,
    long-bone, and thoracic abnormalities that can resemble AO3. Sex-linked
    inheritance, FLNA molecular findings, and the full radiographic pattern
    distinguish it from autosomal dominant FLNB-AO3.
  distinguishing_features:
  - FLNA-related X-linked disorder rather than a heterozygous FLNB disorder
  - The founding AO3 series found a distinct clinical, radiographic, genetic, and histologic pattern despite overlap
  evidence:
  - reference: PMID:2368807
    reference_title: "Atelosteogenesis type III: a distinct skeletal dysplasia with features overlapping atelosteogenesis and oto-palato-digital syndrome type II."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical, radiographic, genetic, and histologic data are presented which
      demonstrate differences between our patients and previously reported
      cases of these other conditions.
    explanation: The founding series explicitly separates AO3 from phenotypically overlapping OPD2.
notes: >-
  AO3 is a severe but variably survivable member of the monoallelic FLNB
  gain-of-function spectrum. Historical publications sometimes called AO1 and
  AO3 lethal together, but documented childhood and adult survivors make a
  uniformly lethal AO3 model inaccurate. The proximal mechanism remains bounded:
  FLNB gain of function, variant clustering, and roles in actin scaffolding,
  joint formation, vertebral development, and endochondral ossification are
  established, whereas the precise altered protein interactions and complete
  variant-to-tissue chain are unresolved. A ClinicalTrials.gov search on
  2026-07-21 identified no AO3-specific interventional studies, and no
  disease-modifying treatment is established.

progression:
- phase: Congenital presentation with variable postnatal survival
  age_range: Prenatal period to adulthood
  notes: >-
    Skeletal abnormalities are present prenatally or at birth. Severe respiratory
    compromise can cause early death or require invasive support, yet survival
    beyond infancy and into adulthood is documented. The sparse case literature
    does not support a single deterministic survival trajectory.
  evidence:
  - reference: PMID:20301736
    reference_title: FLNB-Related Disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In individuals with FLNB-AO3, survival beyond the neonatal period is
      possible with intensive and invasive respiratory support.
    explanation: GeneReviews summarizes the severe respiratory course while explicitly recognizing postneonatal survival.
  - reference: PMID:10076882
    reference_title: "Atelosteogenesis type III: long term survival, prenatal diagnosis, and evidence for dominant transmission."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This is the first documentation of survival to adulthood of an individual
      with this disorder, of prenatal diagnostic assessment of an affected
      individual, and of vertical transmission suggestive of autosomal dominant
      inheritance.
    explanation: The report demonstrates that the AO3 course can extend from prenatal recognition through adulthood.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    AO3 imposes high typical burden through major congenital skeletal
    deformity, joint dislocations, impaired mobility, and potentially severe
    airway or respiratory disease. Burden is variable rather than uniformly
    lethal: some individuals require tracheostomy or other invasive respiratory
    support, while long-term survivors require continuing orthopedic care.
  evidence:
  - reference: PMID:1442028
    reference_title: "Atelosteogenesis type 3: the first patient in Japan and a survivor for more than 1 year."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The infant experienced recurrent apnea and persistent severe
      tracheomalacia, which necessitated tracheostomy at 5 months of age.
    explanation: This survivor required invasive airway management, supporting high clinical burden.
  - reference: PMID:27258362
    reference_title: "Atelosteogenesis type III: orthopedic management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report the case and orthopedic management of a 6-year-old female
      patient with atelosteogenesis type III after 3 years of follow-up.
    explanation: A long-term survivor required multiyear orthopedic follow-up and management.
pathophysiology:
- name: Monoallelic FLNB gain-of-function cytoskeletal disorder
  description: >
    FLNB-AO3 is caused by heterozygous gain-of-function FLNB variants. Filamin B
    cross-links actin, links membrane proteins to the cytoskeleton, and provides
    a scaffold for signaling and trafficking. AO1/AO3 variants cluster in the
    CH2 actin-binding domain and in repeats 14-15, but the precise protein
    interactions or novel interactions responsible for AO3 are not resolved;
    the entry therefore does not assign one variant-universal biochemical
    effect.

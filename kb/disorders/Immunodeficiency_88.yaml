name: Immunodeficiency 88
creation_date: "2026-09-01T00:00:00Z"
category: Mendelian
synonyms:
- IMD88
- Mendelian susceptibility to mycobacterial diseases due to TBX21 deficiency
- T-bet deficiency
- TBX21 deficiency
- Human T-bet deficiency
description: >
  Immunodeficiency 88 is an autosomal recessive inborn error of immunity caused by
  biallelic loss-of-function variants in TBX21, the gene encoding the T-box
  transcription factor T-bet. It presents as Mendelian susceptibility to mycobacterial
  disease (MSMD): a selective predisposition to clinical disease caused by weakly
  virulent mycobacteria, in particular the Bacille Calmette-Guerin (BCG) vaccine strain
  and environmental non-tuberculous mycobacteria, in individuals with no overt
  abnormality on routine haematological and immunological testing.

  Almost every genetic etiology of MSMD converges on interferon gamma (IFN-gamma):
  each either impairs the production of the cytokine or the cellular response to it.
  TBX21 deficiency, reported by Yang and colleagues in 2020, belongs to the
  production arm, but it is mechanistically distinctive within that arm. T-bet is not
  a component of the IL-12/IFN-gamma signalling circuit; it is the master
  transcription factor of type 1 immunity, required for the *development* of the
  lymphocyte lineages that supply IFN-gamma rapidly at the site of mycobacterial
  challenge. Human T-bet deficiency therefore removes the cells rather than the
  signalling step.

  The consequence is a lineage-selective lesion. Circulating
  Mycobacterium-reactive natural killer (NK), invariant NKT (iNKT),
  mucosal-associated invariant T (MAIT) and Vdelta2+ gamma-delta T lymphocytes are
  present at extremely low counts, as are Mycobacterium-non-reactive classic TH1
  lymphocytes, and the cells that do remain produce abnormally small amounts of
  IFN-gamma. Critically, the compartment that is spared cannot substitute: CD8+
  alpha-beta T and non-classic CD4+ alpha-beta TH1* lymphocytes produce IFN-gamma
  normally in response to mycobacterial antigens and still fail to compensate. That
  dissociation is the central finding of the disease and is what makes it informative
  about protective anti-mycobacterial immunity in humans generally — it shows that
  purely adaptive IFN-gamma is not sufficient, and that the innate and innate-like
  compartments are non-redundant.

  The disease has a second, opposite-signed arm. T-bet both drives the type 1 program
  and represses the type 2 one, and the patient's mutant protein does neither. The
  spared CD4+ alpha-beta T compartment therefore overproduces Th2 cytokines on chronic
  stimulation regardless of antigen specificity — a phenotype reversed by restoring
  wild-type T-bet — giving markedly high plasma IL-5 and IL-13, blood eosinophilia and
  persistent upper airway inflammation. One transcription-factor lesion thus yields an
  infectious phenotype from too little type 1 immunity and an allergic one from too
  much type 2, in different lymphocyte compartments. The same purely adaptive CD4+
  alpha-beta population carries both the failure to compensate and the excess.

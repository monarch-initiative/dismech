animal_models:
- name: T-bet knockout mouse (Tbx21-/-), CD4 and NK IFN-gamma production
  species: Mouse
  genotype: Tbx21 targeted deletion (homozygous null)
  publication: PMID:11786644
  description: >
    The original Tbx21-null characterisation, and the model that anticipated the
    compartment-selectivity of the human disease. It reports that T-bet is required for
    IFN-gamma production in CD4 and NK cells but not in CD8 cells — the same asymmetry
    later found in the patient, whose CD8+ alpha-beta T cells produce IFN-gamma normally
    while the innate and innate-like compartments do not.
  modeled_mechanisms:
  - target: Failure of Purely Adaptive IFN-gamma Compensation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      The mouse independently establishes that the CD8 compartment's IFN-gamma
      production is T-bet-independent, which is precisely why the spared human CD8+
      compartment is functionally intact and why its failure to compensate is a
      substantive finding rather than a second deficit.
    limitations: >-
      The mouse is a clean null; the patient's allele abolishes DNA binding with protein
      still expressed at reduced levels. The mouse also lacks the MAIT and Vdelta2+
      gamma-delta compartment structure of humans, so it cannot model the innate-like
      arm of the human deficit.
    evidence:
    - reference: PMID:11786644
      reference_title: "Distinct effects of T-bet in TH1 lineage commitment and IFN-gamma production in CD4 and CD8 T cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        it is required for control of IFN-gamma production in CD4 and NK cells, but not
        in CD8 cells
      explanation: >-
        States the CD4/NK-versus-CD8 asymmetry that the human disease reproduces.
- name: T-bet knockout mouse (Tbx21-/-), NK and NKT development
  species: Mouse
  genotype: Tbx21 targeted deletion (homozygous null)
  publication: PMID:15084276
  description: >
    Establishes that the NK and invariant NKT deficit in T-bet deficiency is a
    developmental, stem-cell-intrinsic defect rather than a defect of mature-cell
    function. This is the mechanistic claim the human entry's lineage-failure node makes,
    and the mouse is where it was demonstrated — the human evidence is a single patient's
    cell counts, which cannot on their own distinguish failed development from
    peripheral loss.
  modeled_mechanisms:
  - target: Failed Development of Innate and Innate-like Lymphocyte Lineages
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Demonstrates that loss of T-bet blocks generation of mature NK and invariant NKT
      cells at the stem-cell level, supplying the developmental interpretation of the
      patient's depleted counts.
    limitations: >-
      Mice have no MAIT compartment and no Vdelta2+ gamma-delta subset comparable to the
      human one, so two of the four lineages depleted in the patient have no counterpart
      in this model. The mouse is also a null allele rather than the patient's
      DNA-binding-deficient one.
    evidence:
    - reference: PMID:15084276
      reference_title: "T-bet regulates the terminal maturation and homeostasis of NK and Valpha14i NKT cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        a profound, stem cell-intrinsic defect in their ability to generate mature NK and
        Valpha14i NKT cells
      explanation: >-
        Localises the deficit to development rather than to maintenance of mature cells,
        which is the claim of the node this link targets.
- name: T-bet knockout mouse (Tbx21-/-), airway type 2 phenotype
  species: Mouse
  genotype: Tbx21 targeted deletion (homozygous null)
  publication: PMID:11786643
  description: >
    Mice with a targeted deletion of Tbx21 spontaneously develop the physiological and
    inflammatory features of asthma without any allergen exposure, and the phenotype
    transfers with CD4+ cells into SCID recipients. The model predates the human disease
    by eighteen years and predicted its type-2 arm: it is the reason the allergic
    phenotype in the T-bet-deficient patient was recognised as part of the disease
    rather than as a coincidence.
  modeled_mechanisms:
  - target: Excessive Th2 Cytokine Production by Adaptive CD4+ Alpha-Beta T Cells
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The mouse reproduces the central claim of this node — that losing T-bet releases a
      CD4+ T-cell-intrinsic type 2 program in the absence of any allergen — and the
      CD4+ adoptive transfer localises it to the same compartment as in the patient.
    limitations: >-
      The murine phenotype is lower-airway asthma; the reported human type-2 phenotype is
      described as upper airway inflammation with blood eosinophilia, and whether
      lower-airway disease is present in the patient has not been reported either way.
      Do not read this as an established difference in anatomical level — it is a gap in
      what has been published. The mouse is also a clean null, while the patient's
      variant abolishes DNA binding with protein still expressed at reduced levels, so
      the two are not the same molecular lesion. Only one human patient has been
      described, so the extent of any species difference cannot be assessed.
    readouts:
    - name: Spontaneous asthma-like airway physiology and inflammation
      target: Excessive Th2 Cytokine Production by Adaptive CD4+ Alpha-Beta T Cells
      direction: INCREASED
      interpretation: >-
        Airway inflammation arising without allergen challenge is the model's evidence
        that loss of T-bet is itself sufficient to drive the type 2 program.
      evidence:
      - reference: PMID:11786643
        reference_title: "Development of spontaneous airway changes consistent with human asthma in mice lacking T-bet."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Mice with a targeted deletion of the T-bet gene and severe combined
          immunodeficient mice receiving CD4+ cells from T-bet knockout mice
          spontaneously demonstrated multiple physiological and inflammatory features
          characteristic of asthma.
        explanation: >-
          Reports the measured airway phenotype and its transfer by CD4+ cells.
    evidence:
    - reference: PMID:11786643
      reference_title: "Development of spontaneous airway changes consistent with human asthma in mice lacking T-bet."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Thus, T-bet deficiency, in the absence of allergen exposure, induces a murine
        phenotype reminiscent of both acute and chronic human asthma.
      explanation: >-
        Supports treating the Tbx21-null mouse as informative for the type-2 arm of
        human T-bet deficiency.
  evidence:
  - reference: PMID:11786643
    reference_title: "Development of spontaneous airway changes consistent with human asthma in mice lacking T-bet."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observed reduced expression of the TH1 transcription factor, T-bet, in T cells
      from airways of patients with asthma compared with that in T cells from airways of
      nonasthmatic patients
    explanation: >-
      The human airway observation that motivated the knockout, establishing that the
      T-bet/asthma link was not purely a mouse finding.
treatments:
- name: Recombinant Interferon Gamma
  description: >
    Subcutaneous recombinant IFN-gamma is the mechanistically indicated therapy for this
    etiology. The TBX21 lesion impairs IFN-gamma production while leaving the IFN-gamma
    receptor and the downstream JAK-STAT1 machinery intact, so exogenous cytokine can
    engage a competent receptor and restore macrophage activation. This is the
    therapeutic dividing line within MSMD: production defects are candidates for
    recombinant IFN-gamma, whereas defects abolishing the response to the cytokine are
    not, and are managed with transplantation or gene therapy instead. Note that this is
    a mechanism-based indication for the production arm of MSMD generally; no trial or
    case series of recombinant IFN-gamma in TBX21-deficient patients has been reported.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: interferon gamma-1b
      term:
        id: NCIT:C100089
        label: Interferon Gamma-1b
  target_mechanisms:
  - target: Failed IFN-gamma-Dependent Macrophage Activation
    treatment_effect: ACTIVATES
    description: >-
      Exogenous recombinant IFN-gamma supplies the cytokine that the T-bet-deficient
      lymphocyte compartment cannot make, to a structurally intact receptor, restoring
      the macrophage-activating signal.
    evidence:
    - reference: PMID:38025345
      reference_title: "Mendelian susceptibility to mycobacterial diseases: State of the puzzle."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        MSMD patients with impaired production of IFN-γ may benefit from injections of
        human recombinant IFN-γ, while for patients with abolished response to this
        cytokine, hematopoietic stem cell transplantation (HSCT) and promising gene
        therapy are the only current therapeutic options.
      explanation: >-
        States the production-versus-response therapeutic split that places TBX21
        deficiency, a production defect, on the recombinant IFN-gamma side.
  evidence:
  - reference: PMID:38025345
    reference_title: "Mendelian susceptibility to mycobacterial diseases: State of the puzzle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MSMD patients with impaired production of IFN-γ may benefit from injections of
      human recombinant IFN-γ
    explanation: >-
      Supports recombinant IFN-gamma as the therapy indicated for the IFN-gamma
      production arm of MSMD, to which TBX21 deficiency belongs.
  - reference: PMID:36630059
    reference_title: "Mendelian Susceptibility to Mycobacterial Disease (MSMD): Clinical, Immunological, and Genetic Features of 22 Patients from 15 Moroccan Kindreds."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with defects in IFN-γ production may benefit from treatment with
      recombinant human IFN-γ, in addition to antibiotics.
    explanation: >-
      Independent statement of the same indication, and specifies that it is an adjunct
      to antibiotics rather than a replacement for them.
  notes: >-
    Recorded as a class-level indication, not as an administered treatment. The
    published TBX21-deficient patient was treated with antimycobacterial drugs alone and
    responded; recombinant IFN-gamma is not reported to have been given to him or to any
    other TBX21-deficient individual.
- name: Antimycobacterial Therapy
  description: >
    Prolonged multidrug antimycobacterial chemotherapy is the mainstay of managing the
    mycobacterial disease itself, and is required regardless of which MSMD gene is
    involved. It treats the infection rather than the underlying immune defect, so
    relapse on withdrawal would be expected while the IFN-gamma deficit persists, though
    the index patient has in fact remained in remission off therapy. The agents listed
    are the drugs used across the Moroccan MSMD cohort from which this patient was
    ascertained; regimen composition should follow species identification and
    susceptibility testing rather than being applied as a fixed block, and this entry
    does not assert a specific regimen or duration for this disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: multidrug antimycobacterial chemotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: antitubercular agent
      term:
        id: NCIT:C280
        label: Antitubercular Agent
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: isoniazid
      term:
        id: CHEBI:6030
        label: isoniazide
    - preferred_term: pyrazinamide
      term:
        id: CHEBI:45285
        label: pyrazinecarboxamide
    - preferred_term: ethambutol
      term:
        id: CHEBI:4877
        label: ethambutol
  target_mechanisms:
  - target: Uncontrolled Replication of Weakly Virulent Mycobacteria
    treatment_effect: INHIBITS
    description: >-
      Antimycobacterial drugs act directly on the organism, substituting pharmacological
      killing for the macrophage-mediated killing the host cannot perform.
  evidence:
  - reference: PMID:38341181
    reference_title: "Genetic, immunologic, and clinical features of 830 patients with Mendelian susceptibility to mycobacterial diseases (MSMD): A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MSMD is associated with a high mortality rate, mostly due to impaired control of
      infection.
    explanation: >-
      Establishes uncontrolled mycobacterial infection as the dominant cause of death in
      MSMD, which is what antimycobacterial therapy is directed at.
  - reference: PMID:36630059
    reference_title: "Mendelian Susceptibility to Mycobacterial Disease (MSMD): Clinical, Immunological, and Genetic Features of 22 Patients from 15 Moroccan Kindreds."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with defects in IFN-γ production may benefit from treatment with
      recombinant human IFN-γ, in addition to antibiotics.
    explanation: >-
      Establishes antibiotics as the baseline treatment in MSMD, on which recombinant
      IFN-gamma is an adjunct rather than a substitute.
- name: Avoidance of BCG Vaccination
  description: >
    Live BCG vaccine is the commonest trigger of disease in MSMD, so it is
    contraindicated in an affected child and in at-risk siblings pending genetic
    testing. Because in endemic countries BCG is given at birth, the vaccine is
    frequently administered before any diagnosis is possible, which is why changes to
    vaccination policy in endemic areas are proposed as a pre-exposure prevention
    strategy at the population level rather than as an individual clinical decision.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: avoidance of live BCG vaccination
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Uncontrolled Replication of Weakly Virulent Mycobacteria
    treatment_effect: INHIBITS
    description: >-
      Withholding the live vaccine removes the mycobacterial challenge that the
      IFN-gamma-deficient host cannot contain.
  evidence:
  - reference: PMID:38341181
    reference_title: "Genetic, immunologic, and clinical features of 830 patients with Mendelian susceptibility to mycobacterial diseases (MSMD): A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Preexposure strategies, such as changes in vaccination policy in endemic areas,
      the establishment of a worldwide registry of patients with MSMD, and precise
      follow-up over generations in affected families, appear to be vital to decrease
      MSMD-related mortality.
    explanation: >-
      Supports pre-exposure avoidance of BCG as a recommended strategy for reducing
      MSMD mortality.
  - reference: PMID:36630059
    reference_title: "Mendelian Susceptibility to Mycobacterial Disease (MSMD): Clinical, Immunological, and Genetic Features of 22 Patients from 15 Moroccan Kindreds."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      BCG vaccination is contraindicated in MSMD patients and should be delayed in
      newborn siblings until the exclusion of a genetic predisposition to mycobacteria.
    explanation: >-
      States the contraindication and extends it to at-risk newborn siblings pending
      genetic testing, which is the actionable content of this entry.
progression:
- phase: Reported course of the index patient
  notes: >-
    The only published disease course in this genotype, and a single patient's course
    rather than a natural history for the disorder. Disease presented as mycobacterial
    disease in childhood and was treated; he has since remained in remission and free of
    mycobacterial infection for several years. The specific regimen and its duration are
    deliberately not stated here: they appear in a deep-research summary but in none of
    the cited sources, and an uncited treatment duration is exactly the kind of detail
    that should not be promoted to entry fact.

    Two features of the course are worth separating. First, if an affected child is
    ascertained through BCG disease, the age at onset is a property of the vaccination
    schedule rather than of the genotype — an affected child in a country that does not
    give BCG would be expected to present later, on exposure to an environmental
    mycobacterium. Do not read an infantile onset as an intrinsic disease property.
    Second, the type-2 arm did not follow the infection's trajectory: the upper airway
    inflammation and eosinophilia were reported independently of the mycobacterial
    episode, which is consistent with the two arms being mechanistically separate.
  evidence:
  - reference: PMID:35867801
    reference_title: "Human T-bet governs the generation of a distinct subset of CD11c(high)CD21(low) B cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient also developed upper airway inflammation and peripheral eosinophilia
      due to TH2-skewing of T-bet-deficient CD4+ T cells
    explanation: >-
      Records the type-2 arm as a separate development in the same patient, reported
      after and independently of the mycobacterial episode.
  - reference: PMID:35867801
    reference_title: "Human T-bet governs the generation of a distinct subset of CD11c(high)CD21(low) B cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      he has been in remission and free of mycobacterial infection for several years
    explanation: >-
      Records the outcome of the mycobacterial episode: sustained remission, not a
      relapsing course.
environmental:
- name: Bacille Calmette-Guerin (BCG) vaccination
  description: >
    Routine BCG immunisation is the sentinel environmental exposure in this disorder.
    The attenuated Mycobacterium bovis BCG strain is harmless to immunocompetent
    infants but disseminates in a host that cannot mount IFN-gamma-dependent macrophage
    activation, which is how MSMD patients typically come to attention. In endemic
    countries the vaccine is given at birth, so the exposure almost always precedes any
    possibility of diagnosis.
  exposure_term:
    preferred_term: exposure to Bacille Calmette-Guerin vaccine
  effect: Triggers disseminated mycobacterial disease in an IFN-gamma-deficient host.
  notes: >-
    `exposure_term` is deliberately left without a `term:` binding. ECTO has no
    vaccination, vaccine, BCG or Mycobacterium exposure class; the same search was run
    and recorded for Immunodeficiency_69, and the cached ECTO term set confirms the gap
    is unchanged. Recorded so a later curator does not repeat the search.
  evidence:
  - reference: PMID:38025345
    reference_title: "Mendelian susceptibility to mycobacterial diseases: State of the puzzle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MSMD confers a selective susceptibility to infections with weakly virulent
      mycobacteria, including the M. bovis Bacille Calmette-Guerin (BCG) vaccines
    explanation: >-
      Establishes BCG vaccine exposure as a defining trigger of clinical disease in this
      disease family.
  influences_mechanisms:
  - target: Uncontrolled Replication of Weakly Virulent Mycobacteria
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      BCG vaccination introduces the live attenuated mycobacterium that then replicates
      unchecked in macrophages the T-bet-deficient host cannot activate.
    evidence:
    - reference: PMID:38025345
      reference_title: "Mendelian susceptibility to mycobacterial diseases: State of the puzzle."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        MSMD confers a selective susceptibility to infections with weakly virulent
        mycobacteria, including the M. bovis Bacille Calmette-Guerin (BCG) vaccines
      explanation: >-
        Links the BCG exposure to the failure of mycobacterial containment modelled by
        this node.
discussions:
- discussion_id: tbet_mouse_human_humoral_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the Tbx21-null mouse predict human T-bet deficiency in the B cell compartment,
    given that the mouse has impaired humoral immunity and the patient does not?
  attaches_to:
  - pathophysiology#Loss of T-bet-Dependent B Cell Subset Development and Class-Switch Skewing
  rationale: >-
    The two disagree, and the disagreement is documented on both sides. T-bet-deficient
    mice have reduced age-associated B cells and impaired humoral immunity; the
    T-bet-deficient patient has largely normal humoral immunity, with intact somatic
    hypermutation, affinity maturation, memory B cell formation and vaccine-specific
    antibody titres. What survives the species jump is narrower than the mouse
    suggested: a requirement for one CD11c-high CD21-low subset and a bias in
    immunoglobulin class switching, not a humoral deficit. The mismatch matters because
    the mouse literature is the reason T-bet was expected to be broadly required for
    antibody responses, and it is not — in humans it is largely redundant for
    long-lived protective humoral immunity. Note this is one patient, so the human side
    of the comparison rests on a single individual.

    The same caution applies to the type-2 arm, though more weakly, because there the
    human side is a gap rather than a contrary finding. The mouse develops lower-airway
    asthma spontaneously; the patient's reported type-2 disease is described as upper
    airway inflammation with eosinophilia, and lower-airway involvement is neither
    reported nor excluded. Whether any real difference exists — and whether it would be
    a species difference, a difference between a null allele and a DNA-binding-deficient
    one, or simply the range of one patient — cannot be settled with the evidence
    available.
  proposed_experiments:
  - experiment_id: tbx21_additional_patients_bcell_profile
    name: Assess the CD11c-high CD21-low compartment and class-switch profile in additional TBX21-deficient individuals
    description: >-
      The human side of every claim here rests on one person. Identifying further
      TBX21-deficient individuals — through MSMD cohort sequencing in BCG-vaccinating,
      consanguineous populations, where this patient was found — and repeating the B cell
      immunophenotyping and serum immunoglobulin subclass measurement would establish
      whether the spared humoral immunity is a property of human T-bet deficiency or of
      this patient's particular allele.
    would_support:
    - pathophysiology#Loss of T-bet-Dependent B Cell Subset Development and Class-Switch Skewing
    supporting_outcome:
    - >-
      Additional TBX21-deficient individuals show absent CD11c-high CD21-low B cells and
      the same IgG1/IgG4/IgE-skewed, IgG2-reduced profile, with normal vaccine responses.
    refuting_outcome:
    - >-
      Additional individuals show a frank humoral deficit resembling the mouse, which
      would place this patient's spared humoral immunity down to his specific allele
      rather than to a human-versus-mouse difference.
- discussion_id: tbet_lineage_vs_percell_ifng
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the mycobacterial susceptibility in human T-bet deficiency arise from the
    absence of the innate and innate-like lineages themselves, or from the reduced
    per-cell IFN-gamma output of the cells that remain?
  attaches_to:
  - pathophysiology#Deficient Mycobacterium-Reactive IFN-gamma Production
  rationale: >-
    The reported patient has both defects at once — the Mycobacterium-reactive NK, iNKT,
    MAIT and Vdelta2+ gamma-delta compartments are largely absent, and the residual
    cells are individually hypofunctional for IFN-gamma. The two are not separable in a
    single natural genotype, so the entry records them as one node with two components
    rather than asserting a dominant contribution. The distinction matters
    therapeutically: a per-cell secretion defect would be expected to respond to
    exogenous IFN-gamma, whereas a purely developmental lesion might also require
    reconstitution of the missing lineages.
- discussion_id: tbx21_ifng_therapy_untested
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is recombinant IFN-gamma clinically effective in TBX21 deficiency specifically?
  attaches_to:
  - treatments#Recombinant Interferon Gamma
  rationale: >-
    The indication recorded in this entry is mechanistic and generalised from the
    IFN-gamma-production arm of MSMD, not observed in TBX21-deficient patients. Human
    T-bet deficiency is reported in a very small number of individuals, and no treated
    series exists. The inference is reasonable — the receptor and JAK-STAT1 machinery
    are intact — but it is an inference, and the entry should not be read as reporting
    a demonstrated response.
notes: >-
  OMIM records this disease as 619630 (IMMUNODEFICIENCY 88; IMD88), and the causal gene
  as TBX21 (*604895, 17q21.32). There is no `omim_mappings` slot in the schema —
  `DiseaseMappings` covers ICD-10-CM, ICD-11, MONDO and NCIT only — so the OMIM
  identifier is recorded here rather than as a structured mapping. Orphanet has no
  dedicated code for TBX21 deficiency; the parent concept is ORPHA:748 (Mendelian
  susceptibility to mycobacterial diseases).

  Two of the cached references are republications rather than independent reports.
  PMID:35909394 (Qatar Med J) is a near-verbatim republication of the PMID:34160550 JEM
  abstract on the same patient; the JEM paper is cited here as the primary source, and
  the two must not be read as two studies.

  One caution for future curators on patient counts. `PMID:36630059` reports TBX21 in one
  patient of a 22-patient Moroccan MSMD cohort, and a later Moroccan registry survey
  (`PMID:41209815`) also reports a TBX21 patient. These are almost certainly the same
  individual, ascertained through the same centre, rather than two cases. Do not read
  the two reports as independent patients when revising the prevalence or penetrance
  statements here.

  Human T-bet deficiency is one of the most recently described MSMD etiologies, reported
  by Yang et al. in 2020, and is known from a very small number of patients. Frequencies,
  natural history, and treatment response are therefore not established at the level of
  detail available for the older etiologies such as IL12RB1 and IFNGR1 deficiency, which
  between them account for 61% of reported MSMD patients. Claims in this entry that
  derive from the MSMD population rather than from TBX21-deficient patients are marked as
  such in the relevant explanation or description.

    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient has extremely low counts of circulating Mycobacterium-reactive natural
      killer (NK), invariant NKT (iNKT), mucosal-associated invariant T (MAIT), and Vδ2+
      γδ T lymphocytes
    explanation: >-
      Reports the reduced Vdelta2+ gamma-delta T cell count directly in the affected
      patient.
- category: Immunologic
  name: Decreased Th1 T cell proportion
  description: >
    Classic TH1 lymphocytes are severely depleted, consistent with T-bet's canonical
    role as the TH1 lineage-specifying transcription factor. Note that these cells are
    Mycobacterium-non-reactive in this patient, so their loss is a marker of the
    transcriptional lesion rather than the direct cause of the mycobacterial
    susceptibility.
  phenotype_term:
    preferred_term: Decreased classic TH1 lymphocyte count
    term:
      id: HP:0025829
      label: Decreased Th1 T cell proportion
  evidence:
  - reference: PMID:33296702
    reference_title: "Human T-bet Governs Innate and Innate-like Adaptive IFN-γ Immunity against Mycobacteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      and of Mycobacterium-non reactive classic TH1 lymphocytes, with the residual
      populations of these cells also producing abnormally small amounts of IFN-γ
    explanation: >-
      Reports depletion of classic TH1 lymphocytes alongside the innate-like lineages.
- category: Immunologic
  name: Lymphadenopathy
  description: >
    Lymphadenopathy, frequently multifocal, is the single most common clinical
    manifestation across the MSMD patient population. The frequency figure below is for
    MSMD as a whole rather than for the TBX21 etiology specifically, which has too few
    reported patients to support an etiology-specific estimate; it is recorded here as
    the expected syndromic presentation.
  phenotype_term:
    preferred_term: Lymphadenopathy
    term:
      id: HP:0002716
      label: Lymphadenopathy
  evidence:
  - reference: PMID:38341181
    reference_title: "Genetic, immunologic, and clinical features of 830 patients with Mendelian susceptibility to mycobacterial diseases (MSMD): A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lymphadenopathy was the most common clinical manifestation of MSMD, reported in
      378 (45.5%) cases and multifocal in 35.1%.
    explanation: >-
      Cohort-level frequency of lymphadenopathy in MSMD; applied here as the syndromic
      context for this etiology, not as a TBX21-specific rate.
- category: Hematologic
  name: Increased total eosinophil count
  description: >
    Blood eosinophilia in the reported patient, driven by the IL-5 excess that follows
    loss of T-bet repression of the Th2 program. This is a consequence of the same
    variant as the mycobacterial susceptibility but reaches the clinic by an entirely
    separate route, so it is not a marker of infection severity.
  phenotype_term:
    preferred_term: Blood eosinophilia
    term:
      id: HP:0001880
      label: Increased total eosinophil count
  evidence:
  - reference: PMID:34160550
    reference_title: "High Th2 cytokine levels and upper airway inflammation in human inherited T-bet deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      T-bet deficiency thus underlies the excessive production of Th2 cytokines,
      particularly IL-5 and IL-13, by CD4+ αβ T cells, causing blood eosinophilia and
      UAI.
    explanation: >-
      Attributes the patient's blood eosinophilia to the Th2 cytokine excess caused by
      T-bet deficiency.
- category: Respiratory
  name: Chronic upper airway inflammation
  description: >
    Persistent upper airway inflammation in the reported patient, described alongside
    the blood eosinophilia as the allergic arm of the disease and attributed to the same
    Th2 cytokine excess.
  phenotype_term:
    preferred_term: Persistent upper airway inflammation
    temporality: CHRONIC
  evidence:
  - reference: PMID:34160550
    reference_title: "High Th2 cytokine levels and upper airway inflammation in human inherited T-bet deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we explore the persistent upper airway inflammation (UAI) and blood
      eosinophilia of this patient.
    explanation: >-
      Documents persistent upper airway inflammation as a clinical feature of the
      reported T-bet-deficient patient.
  notes: >-
    Deliberately left unbound. The nearest HPO term is HP:0002257 Chronic rhinitis,
    defined as chronic inflammation of the *nasal mucosa*; the source says only "upper
    airway inflammation" and its abstract contains no instance of nasal, rhinitis or
    sinus. Binding it would manufacture an anatomical claim the source does not make,
    and HPO has no broader upper-airway-inflammation term (the nearest alternatives,
    HP:0002781 and HP:0005945, are obstruction rather than inflammation). Recorded so a
    later curator does not repeat the search; an HPO new-term request is the real fix.
- category: Immunologic
  name: Increased circulating IgE concentration
  description: >
    Elevated plasma IgE, part of the class-switch skew toward IgG1, IgG4 and IgE that
    follows loss of T-bet. It sits on the same type-2 axis as the Th2 cytokine excess
    and the eosinophilia.
  phenotype_term:

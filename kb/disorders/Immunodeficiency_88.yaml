    modifier: DECREASED
  - preferred_term: TH1 lineage commitment
    term:
      id: GO:0045063
      label: T-helper 1 cell differentiation
    modifier: DECREASED
  downstream:
  - target: Reduced natural killer cell count
  - target: Decreased mucosal-associated invariant T cell proportion
  - target: Decreased gamma-delta T cell proportion
  - target: Decreased Th1 T cell proportion
  - target: Deficient Mycobacterium-Reactive IFN-gamma Production
    causal_link_type: DIRECT
    description: >-
      The depleted lineages are the ones that supply IFN-gamma against mycobacteria, so
      their absence is the proximate cause of the IFN-gamma deficit.
    evidence:
    - reference: PMID:33296702
      reference_title: "Human T-bet Governs Innate and Innate-like Adaptive IFN-γ Immunity against Mycobacteria."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Human T-bet deficiency thus underlies mycobacterial disease by preventing the
        development of innate (NK) and innate-like adaptive lymphocytes (iNKT, MAIT, and
        Vδ2+ γδ T cells) and IFN-γ production by them
      explanation: >-
        Links the developmental failure of these lineages to the loss of IFN-gamma
        production by them, which is exactly this edge.
  evidence:
  - reference: PMID:33296702
    reference_title: "Human T-bet Governs Innate and Innate-like Adaptive IFN-γ Immunity against Mycobacteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient has extremely low counts of circulating Mycobacterium-reactive natural
      killer (NK), invariant NKT (iNKT), mucosal-associated invariant T (MAIT), and Vδ2+
      γδ T lymphocytes, and of Mycobacterium-non reactive classic TH1 lymphocytes
    explanation: >-
      Direct enumeration of the depleted lineages in the patient.
  - reference: PMID:34675939
    reference_title: "Expression Regulation and Function of T-Bet in NK Cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Deficiency of T-bet leads to significantly reduced NK cell numbers
    explanation: >-
      Mouse genetic data independently support T-bet as a requirement for the NK
      compartment, corroborating the human developmental defect.
- name: Failure of Purely Adaptive IFN-gamma Compensation
  biological_scale: CELLULAR
  description: >
    CD8+ alpha-beta T and non-classic CD4+ alpha-beta TH1* lymphocytes are spared by
    the T-bet lesion and produce IFN-gamma normally in response to mycobacterial
    antigens. They nonetheless fail to compensate for the missing innate and
    innate-like output. This negative result is the disease's central mechanistic
    finding: it establishes that the innate and innate-like IFN-gamma compartments are
    non-redundant for anti-mycobacterial immunity in humans, and it is why the residual
    adaptive response does not rescue the phenotype.
  cell_types:
  - preferred_term: mycobacterium-specific CD8+ alpha-beta T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  - preferred_term: non-classic CD4+ alpha-beta TH1-star cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  downstream:
  - target: Deficient Mycobacterium-Reactive IFN-gamma Production
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Because the spared adaptive compartment cannot substitute, the IFN-gamma deficit
      created by the lineage failure persists rather than being corrected.
    evidence:
    - reference: PMID:33296702
      reference_title: "Human T-bet Governs Innate and Innate-like Adaptive IFN-γ Immunity against Mycobacteria."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        with mycobacterium-specific, IFN-γ-producing, purely adaptive CD8+ αβ T, and
        CD4+ αβ TH1∗ cells unable to compensate for this deficit
      explanation: >-
        States explicitly that the spared adaptive compartment does not compensate for
        the IFN-gamma deficit.
  evidence:
  - reference: PMID:33296702
    reference_title: "Human T-bet Governs Innate and Innate-like Adaptive IFN-γ Immunity against Mycobacteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other lymphocyte subsets develop normally but produce low levels of IFN-γ, with
      the exception of CD8+ αβ T and non-classic CD4+ αβ TH1∗ lymphocytes, which produce
      IFN-γ normally in response to mycobacterial antigens.
    explanation: >-
      Establishes that this compartment is functionally intact, which is what makes its
      failure to compensate a substantive finding rather than a second deficit.
- name: Deficient Mycobacterium-Reactive IFN-gamma Production
  biological_scale: ORGANISM
  description: >
    The net result is insufficient IFN-gamma at the site of mycobacterial challenge.
    The deficit is quantitative and has two components: the cells that would normally
    supply the cytokine are largely absent, and the residual members of those
    populations each secrete abnormally small amounts. Human IFN-gamma level behaves as
    a quantitative trait determining the outcome of mycobacterial infection, so a
    partial deficit is sufficient to produce disease.
  biological_processes:
  - preferred_term: IFN-gamma production by mycobacterium-reactive lymphocytes
    term:
      id: GO:0032609
      label: type II interferon production
    modifier: DECREASED
  downstream:
  - target: Failed IFN-gamma-Dependent Macrophage Activation
    causal_link_type: DIRECT
    description: >-
      IFN-gamma is the macrophage-activating signal; too little of it leaves the
      macrophage compartment unactivated.
    evidence:
    - reference: PMID:38025345
      reference_title: "Mendelian susceptibility to mycobacterial diseases: State of the puzzle."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        It was proven that the human IFN-γ level is a quantitative trait that defines
        the outcome of mycobacterial infection.
      explanation: >-
        Supports the dose-dependent step from a reduced IFN-gamma level to failure of
        mycobacterial control.
  evidence:
  - reference: PMID:33296702
    reference_title: "Human T-bet Governs Innate and Innate-like Adaptive IFN-γ Immunity against Mycobacteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      with the residual populations of these cells also producing abnormally small
      amounts of IFN-γ
    explanation: >-
      Establishes the second component of the deficit: the surviving cells are
      themselves hypofunctional for IFN-gamma.
- name: Failed IFN-gamma-Dependent Macrophage Activation
  biological_scale: CELLULAR
  conforms_to: "granuloma_formation#Th1 and TNF-Driven Macrophage Recruitment and Activation"
  description: >
    IFN-gamma is the signal that licenses macrophages to kill ingested mycobacteria.
    With the cytokine in short supply, the macrophage antimicrobial program is not
    engaged. This is the step at which every MSMD etiology converges, whether the
    upstream lesion impairs IFN-gamma production, as here, or the response to it.
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: IFN-gamma-dependent macrophage activation
    term:
      id: GO:0042116
      label: macrophage activation
    modifier: DECREASED
  downstream:
  - target: Uncontrolled Replication of Weakly Virulent Mycobacteria
    causal_link_type: DIRECT
    description: >-
      An unactivated macrophage is a permissive niche, so ingested mycobacteria are not
      killed.
  evidence:
  - reference: PMID:38025345
    reference_title: "Mendelian susceptibility to mycobacterial diseases: State of the puzzle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      almost all genetic etiologies of MSMD alter the interferon-gamma (IFN-γ)- mediated
      immunity by impairing or abolishing IFN-γ production or the response to this
      cytokine
    explanation: >-
      Establishes IFN-gamma-mediated immunity as the common convergence point of MSMD,
      of which macrophage activation is the effector arm.
- name: Uncontrolled Replication of Weakly Virulent Mycobacteria
  biological_scale: ORGANISM
  description: >
    Mycobacteria that a competent host clears without difficulty — the M. bovis BCG
    vaccine strain and environmental non-tuberculous species — replicate unchecked and
    disseminate. The susceptibility is selective: these patients are not broadly
    vulnerable to all pathogens, which is the clinical signature that distinguishes
    MSMD from combined immunodeficiency.
  biological_processes:
  - preferred_term: macrophage-mediated killing of intracellular mycobacteria
    term:
      id: GO:0042742
      label: defense response to bacterium
    modifier: DECREASED
  downstream:
  - target: Disseminated BCG disease
  - target: Susceptibility to environmental mycobacteria and severe tuberculosis
  - target: Non-typhoidal salmonellosis
  - target: Lymphadenopathy
  evidence:
  - reference: PMID:38025345
    reference_title: "Mendelian susceptibility to mycobacterial diseases: State of the puzzle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MSMD confers a selective susceptibility to infections with weakly virulent
      mycobacteria, including the M. bovis Bacille Calmette-Guerin (BCG) vaccines and
      various environmental mycobacteria in patients, primarily children, without
      classical immune defects.
    explanation: >-
      Describes the organism-level outcome and its selectivity, which is the content of
      this node.
- name: Loss of T-bet Repression of the Th2 Program
  biological_scale: MOLECULAR
  description: >
    T-bet is not only the activator of the type 1 program; it is also a repressor of
    the type 2 one. The patient's mutant T-bet, unlike the wild-type protein, fails to
    inhibit production of the Th2 cytokines IL-4, IL-5, IL-9 and IL-13 when
    overexpressed in Th2 cells. A single transcription-factor lesion therefore produces
    two opposite-signed defects at once, and this repressive arm is what gives IMD88 an
    allergic phenotype on top of its infectious one.
  cell_types:
  - preferred_term: T-helper 2 cell
    term:
      id: CL:0000546
      label: T-helper 2 cell
  biological_processes:
  - preferred_term: T-bet repression of Th2 lineage commitment
    term:
      id: GO:0045629
      label: negative regulation of T-helper 2 cell differentiation
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Excessive Th2 Cytokine Production by Adaptive CD4+ Alpha-Beta T Cells
    causal_link_type: DIRECT
    description: >-
      With the repressor gone, the CD4+ alpha-beta T compartment produces Th2 cytokines
      without restraint.
    evidence:
    - reference: PMID:34160550
      reference_title: "High Th2 cytokine levels and upper airway inflammation in human inherited T-bet deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Finally, the patient's CD4+ αβ T cells produced most of the Th2 cytokines in
        response to chronic stimulation, regardless of their antigen specificities, a
        phenotype reversed by the expression of WT T-bet.
      explanation: >-
        Restoration of wild-type T-bet reverses the overproduction, establishing that
        loss of T-bet repression causes it rather than merely accompanying it.
  evidence:
  - reference: PMID:34160550
    reference_title: "High Th2 cytokine levels and upper airway inflammation in human inherited T-bet deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Unlike wild-type (WT) T-bet, the mutant form of T-bet from this patient did not
      inhibit the production of Th2 cytokines, including IL-4, IL-5, IL-9, and IL-13,
      when overexpressed in T helper 2 (Th2) cells.
    explanation: >-
      Establishes loss of the Th2-repressive function of T-bet as a distinct molecular
      consequence of the same variant.
- name: Excessive Th2 Cytokine Production by Adaptive CD4+ Alpha-Beta T Cells
  biological_scale: CELLULAR
  description: >
    The patient's CD4+ alpha-beta T lymphocytes produce most of the Th2 cytokines on
    chronic stimulation, and do so regardless of antigen specificity — the defect is a
    loss of restraint on the program rather than an antigen-directed response. Note the
    compartment: this is the same purely adaptive CD4+ alpha-beta population that is
    spared by, and cannot compensate for, the type 1 arm of the disease. One
    compartment thus carries both the disease's failure to help and its excess.
  cell_types:
  - preferred_term: CD4-positive, alpha-beta T cell
    term:
      id: CL:0000624
      label: CD4-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: Th2 cytokine production
    term:
      id: GO:0035745
      label: T-helper 2 cell cytokine production
    modifier: INCREASED
  downstream:
  - target: Increased total eosinophil count
  - target: Chronic upper airway inflammation
  evidence:
  - reference: PMID:34160550
    reference_title: "High Th2 cytokine levels and upper airway inflammation in human inherited T-bet deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Herpesvirus saimiri-immortalized T cells from the patient produced abnormally
      large amounts of Th2 cytokines
    explanation: >-
      Documents the Th2 cytokine overproduction in patient-derived cells.
  - reference: PMID:34160550
    reference_title: "High Th2 cytokine levels and upper airway inflammation in human inherited T-bet deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the patient had markedly high plasma IL-5 and IL-13 concentrations
    explanation: >-
      Gives the systemic in vivo correlate of the cellular overproduction. Quoted
      separately from the in vitro finding in the same sentence because the two are
      different kinds of evidence.
  - reference: PMID:34160550
    reference_title: "High Th2 cytokine levels and upper airway inflammation in human inherited T-bet deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      T-bet deficiency thus underlies the excessive production of Th2 cytokines,
      particularly IL-5 and IL-13, by CD4+ αβ T cells, causing blood eosinophilia and
      UAI.
    explanation: >-
      States the causal chain from T-bet loss through CD4+ Th2 cytokine excess to the
      two clinical consequences recorded as downstream phenotypes.
- name: Loss of T-bet-Dependent B Cell Subset Development and Class-Switch Skewing
  biological_scale: CELLULAR
  description: >
    A third consequence of the same lesion, in a third compartment. T-bet is dispensable
    for the bulk of humoral immunity in humans — somatic hypermutation, affinity
    maturation, memory and plasmablast formation, and vaccine-specific antibody titres
    are all intact — but it is required for one specific B cell subset (CD11c-high
    CD21-low) and it biases immunoglobulin class switching. The patient's isotype
    profile is skewed toward IgG1, IgG4 and IgE and away from IgG2. The IgE limb is not
    incidental: it runs in the same type-2 direction as the Th2 excess, which is
    consistent with a common loss of T-bet restraint on type 2 responses.
  cell_types:
  - preferred_term: CD11c-high CD21-low B cell
    term:
      id: CL:0000236
      label: B cell
  downstream:
  - target: Increased circulating IgE concentration
  - target: Decreased circulating IgG2 concentration
  evidence:
  - reference: PMID:35867801
    reference_title: "Human T-bet governs the generation of a distinct subset of CD11c(high)CD21(low) B cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, human T-bet is largely redundant for long-lived protective humoral immunity
      but is essential for the development of a distinct subset of human
      CD11chiCD21lo B cells.
    explanation: >-
      States both halves of this node: humoral immunity is broadly spared, and one
      specific B cell subset is T-bet-dependent.
  - reference: PMID:35867801
    reference_title: "Human T-bet governs the generation of a distinct subset of CD11c(high)CD21(low) B cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nevertheless, the patient exhibited skewed class switching to IgG1, IgG4, and IgE,
      along with reduced IgG2, both in vivo and in vitro.
    explanation: >-
      Documents the class-switch skewing that produces the immunoglobulin phenotypes
      recorded downstream of this node.
phenotypes:
- category: Infectious
  name: Disseminated BCG disease
  description: >
    Disseminated disease caused by the M. bovis BCG vaccine strain following routine
    vaccination. In countries with universal BCG programmes this is typically the
    presenting event of MSMD, since it is the first mycobacterial challenge an infant
    meets.
  phenotype_term:
    preferred_term: BCGosis
    term:
      id: HP:0020087
      label: BCGosis
  evidence:
  - reference: PMID:38025345
    reference_title: "Mendelian susceptibility to mycobacterial diseases: State of the puzzle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MSMD confers a selective susceptibility to infections with weakly virulent
      mycobacteria, including the M. bovis Bacille Calmette-Guerin (BCG) vaccines
    explanation: >-
      Establishes BCG disease as a defining clinical manifestation of MSMD, the syndrome
      this TBX21 etiology produces.
- category: Infectious
  name: Susceptibility to environmental mycobacteria and severe tuberculosis
  description: >
    MSMD confers susceptibility to weakly virulent environmental non-tuberculous
    mycobacteria and to severe forms of tuberculosis, in addition to BCG. This is
    recorded as the class-level susceptibility of the syndrome, not as an observed event
    in the index patient: he had a single BCG episode, was cured, and has remained free
    of mycobacterial infection for several years. He is therefore explicitly NOT an
    example of recurrent mycobacterial infection, and HP:0011274 is deliberately not
    bound here.
  evidence:
  - reference: PMID:38025345
    reference_title: "Mendelian susceptibility to mycobacterial diseases: State of the puzzle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These patients may also present severe forms of tuberculosis, and about half of
      them might develop non-typhoidal salmonellosis.
    explanation: >-
      Extends the MSMD infectious spectrum beyond weakly virulent mycobacteria to severe
      tuberculosis. Quoted for the tuberculosis clause; the salmonellosis clause is
      curated separately below.
  - reference: PMID:35867801
    reference_title: "Human T-bet governs the generation of a distinct subset of CD11c(high)CD21(low) B cells."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      he has been in remission and free of mycobacterial infection for several years
    explanation: >-
      Refutes recurrence in the only reported patient. Recorded explicitly so the
      class-level susceptibility above is not read as an observed recurrent course.
- category: Infectious
  name: Non-typhoidal salmonellosis
  description: >
    About half of MSMD patients develop non-typhoidal salmonellosis, reflecting the same
    dependence on IFN-gamma-activated macrophages for control of intracellular bacteria.
    As with lymphadenopathy, this is the MSMD-wide figure and is recorded as the expected
    syndromic spectrum; it is not reported in the TBX21-deficient patient, whose only
    documented infection was the BCG episode.
  evidence:
  - reference: PMID:38025345
    reference_title: "Mendelian susceptibility to mycobacterial diseases: State of the puzzle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These patients may also present severe forms of tuberculosis, and about half of
      them might develop non-typhoidal salmonellosis.
    explanation: >-
      Cohort-level frequency of non-typhoidal salmonellosis in MSMD; applied here as
      syndromic context, not as a TBX21-specific finding.
- category: Immunologic
  name: Reduced natural killer cell count
  description: >
    Circulating Mycobacterium-reactive NK lymphocytes are present at extremely low
    counts, reflecting the failure of the T-bet-dependent NK developmental program.
  phenotype_term:
    preferred_term: Reduced total natural killer cell count
    term:
      id: HP:0040218
      label: Reduced total natural killer cell count
  evidence:
  - reference: PMID:33296702
    reference_title: "Human T-bet Governs Innate and Innate-like Adaptive IFN-γ Immunity against Mycobacteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient has extremely low counts of circulating Mycobacterium-reactive natural
      killer (NK), invariant NKT (iNKT), mucosal-associated invariant T (MAIT), and Vδ2+
      γδ T lymphocytes
    explanation: >-
      Reports the reduced NK count directly in the affected patient.
- category: Immunologic
  name: Decreased mucosal-associated invariant T cell proportion
  description: >
    MAIT lymphocytes are among the innate-like adaptive lineages that fail to develop

    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Plasma IgA and IgM levels in P were normal, while IgE was elevated
    explanation: >-
      Reports the elevated plasma IgE alongside normal IgA and IgM, which localises the
      defect to class switching rather than to antibody production generally.
- category: Immunologic
  name: Decreased circulating IgG2 concentration
  description: >
    Reduced plasma IgG2, the opposite limb of the same class-switch skew, present both
    in vivo and in vitro and mirrored by fewer IgG2+ memory B cells.
  phenotype_term:
    preferred_term: Decreased circulating IgG2 concentration
    term:
      id: HP:0008348
      label: Decreased circulating IgG2 concentration
  evidence:
  - reference: PMID:35867801
    reference_title: "Human T-bet governs the generation of a distinct subset of CD11c(high)CD21(low) B cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Plasma total IgG levels were also higher in P, predominantly due to increased IgG1,
      and a modest increase in IgG4 (Fig. 1D). By contrast, IgG2 was reduced
    explanation: >-
      Reports the full immunoglobulin subclass profile in the patient: total IgG and

classifications:
  iuis_category:
    classification_value: innate immunity defect
    notes: >-
      IUIS phenotypic classification of inborn errors of immunity, Mendelian
      susceptibility to mycobacterial disease (MSMD) table. Immunodeficiency 88 is the
      TBX21 (T-bet) etiology of MSMD.
    evidence:
    - reference: PMID:38341181
      reference_title: "Genetic, immunologic, and clinical features of 830 patients with Mendelian susceptibility to mycobacterial diseases (MSMD): A systematic review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Twenty-one genes are now known to be associated with MSMD: 18 autosomal genes
        (IL12B, IL12RB1, IL12RB2, IL23R, JAK1, RORC, ISG15, USP18, TYK2, IRF8, SPPL2A,
        IFNGR1, IFNGR2, IRF1, STAT1, TBX21, IFNG and ZNFX1) and three X-linked genes
        (CYBB, MCTS1 and NEMO)
      explanation: >-
        Places TBX21 in the established gene set of Mendelian susceptibility to
        mycobacterial disease, the syndrome under which this entry is classified.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  notes: >-
    Deliberately carries no `rate_per_100000` and no `prevalence_class`. The published
    figures are for MSMD as a syndrome across all 20-plus causal genes, not for the
    TBX21 etiology, and putting them in machine-queryable slots would assert a
    population rate for a disease with one reported patient — a claim the surrounding
    prose disclaims but the exported fields would not. The two available syndrome-level
    estimates also disagree five-fold and are quoted here side by side rather than
    reconciled: about 1 in 10,000 (PMID:36630059) and about 1 in 50,000
    (PMID:36326697), both 2022-2023 papers from overlapping author groups.
  evidence:
  - reference: PMID:36630059
    reference_title: "Mendelian Susceptibility to Mycobacterial Disease (MSMD): Clinical, Immunological, and Genetic Features of 22 Patients from 15 Moroccan Kindreds."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This condition affects about 1/10,000 individuals worldwide
    explanation: >-
      One of the two worldwide prevalence estimates for MSMD, the syndrome of which this
      disease is one genetic etiology.
  - reference: PMID:36326697
    reference_title: "Inherited human ITK deficiency impairs IFN-γ immunity and underlies tuberculosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      selectively predisposes ∼1/50,000 individuals to severe disease caused by weakly
      virulent mycobacteria
    explanation: >-
      The competing worldwide estimate for MSMD, five-fold lower than the other. Recorded
      alongside it rather than averaged or chosen between.
- population: TBX21 etiology specifically
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    TBX21 is among the rarest MSMD etiologies. In the 22-patient Moroccan MSMD series it
    accounted for a single patient, against 8 for IL12RB1 and 7 for STAT1; that patient
    is the index case of this disease. No prevalence rate can be derived from a single
    reported individual, which is why the class is UNKNOWN rather than an ultra-rare
    band.
  evidence:
  - reference: PMID:36630059
    reference_title: "Mendelian Susceptibility to Mycobacterial Disease (MSMD): Clinical, Immunological, and Genetic Features of 22 Patients from 15 Moroccan Kindreds."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic mutations were identified on the following genes: IL12RB1 in 8 patients,
      STAT1 in 7 patients; SPPL2A, IFNGR1, and TYK2 in two patients each; and TBX21 in
      one patient, with different modes of inheritance.
    explanation: >-
      Gives the relative rarity of the TBX21 etiology within a genetically characterised
      MSMD cohort.
diagnosis:
- name: Whole blood IL-12 / IFN-gamma activation test
  description: >
    The functional screening assay for MSMD. Whole blood is stimulated and both the
    production of IL-12 and IFN-gamma and the response to those cytokines are measured,
    which localises the lesion to the production or the response arm of the circuit
    before any gene is named. In TBX21 deficiency the expected pattern is impaired
    IFN-gamma production with an intact response — the distinction that determines
    whether recombinant IFN-gamma is a rational therapy.
  evidence:
  - reference: PMID:36630059
    reference_title: "Mendelian Susceptibility to Mycobacterial Disease (MSMD): Clinical, Immunological, and Genetic Features of 22 Patients from 15 Moroccan Kindreds."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole blood activation test was performed to assess both the production of IL-12
      and IFN-γ and the response to these two cytokines
    explanation: >-
      Describes the assay and, importantly, that it reads production and response
      separately — which is what makes it discriminating within MSMD.
- name: Whole exome sequencing with Sanger confirmation
  description: >
    Genetic confirmation is what assigns the etiology, and it is not optional in MSMD:
    the functional assay narrows the arm of the circuit but not the gene, and the
    therapeutic split between production and response defects turns on which gene it is.
    This is how the index patient's TBX21 genotype was established.
  evidence:
  - reference: PMID:36630059
    reference_title: "Mendelian Susceptibility to Mycobacterial Disease (MSMD): Clinical, Immunological, and Genetic Features of 22 Patients from 15 Moroccan Kindreds."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WES was performed for all patients and Sanger sequencing was used to confirm the
      mutations in the patients and their relatives
    explanation: >-
      Describes the genetic workup applied to the cohort that includes the TBX21 patient.
  - reference: PMID:38535546
    reference_title: "Diagnosis and Management of Infections in Patients with Mendelian Susceptibility to Mycobacterial Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In most suspected MSMD cases, patients are treated empirically without confirming a
      microbiological and molecular diagnosis.
    explanation: >-
      Records the gap this step addresses: molecular diagnosis is frequently not obtained
      in practice, which is why it is called out here rather than assumed.
- name: Exclusion of chronic granulomatous disease
  description: >
    NBT and DHR testing is the standard discriminator against chronic granulomatous
    disease, the other inborn error that presents with BCG complications and granulomas.
    Neutrophil oxidative burst is normal in MSMD, and CGD was among the initial
    misdiagnoses recorded in the MSMD literature.
  presence: ABSENT
  evidence:
  - reference: PMID:36630059
    reference_title: "Mendelian Susceptibility to Mycobacterial Disease (MSMD): Clinical, Immunological, and Genetic Features of 22 Patients from 15 Moroccan Kindreds."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NBT and/or DHR tests were performed for 12 symptomatic patients and showed normal
      phagocytic activity of neutrophils in all of them
    explanation: >-
      Establishes normal neutrophil oxidative burst in MSMD patients, which is what
      separates them from chronic granulomatous disease.
inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    The index patient is homozygous for a loss-of-function TBX21 variant, described by
    the reporting group as autosomal recessive, complete T-bet deficiency. Consistent
    with the rest of the MSMD gene set, in which most etiologies are autosomal
    recessive complete deficiencies, heterozygous carriage is not reported to cause
    mycobacterial disease. The patient was ascertained in a Moroccan MSMD cohort in
    which 64% of patients were born to consanguineous parents — the demographic context
    in which autosomal recessive MSMD etiologies are found, and the reason
    BCG-vaccinating, TB-endemic, high-consanguinity populations are where further TBX21
    cases would be looked for.
  evidence:
  - reference: PMID:38341181
    reference_title: "Genetic, immunologic, and clinical features of 830 patients with Mendelian susceptibility to mycobacterial diseases (MSMD): A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      showed that homozygosity for a T-box transcription factor-21 (TBX21) variant
      could result in MSMD
    explanation: >-
      States that the reported TBX21 genotype underlying MSMD is homozygous, the basis
      for recording autosomal recessive inheritance.
  - reference: PMID:34160550
    reference_title: "High Th2 cytokine levels and upper airway inflammation in human inherited T-bet deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have described a child suffering from Mendelian susceptibility to mycobacterial
      disease (MSMD) due to autosomal recessive, complete T-bet deficiency
    explanation: >-
      States the inheritance mode and the completeness of the deficiency explicitly.
  - reference: PMID:36630059
    reference_title: "Mendelian Susceptibility to Mycobacterial Disease (MSMD): Clinical, Immunological, and Genetic Features of 22 Patients from 15 Moroccan Kindreds."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fourteen patients (64%) were born to consanguineous parents.
    explanation: >-
      Gives the consanguinity rate in the cohort from which this patient was ascertained,
      the demographic context for an autosomal recessive etiology.
genetic:
- name: TBX21
  gene_term:
    preferred_term: TBX21
    term:
      id: hgnc:11599
      label: TBX21
  association: CAUSATIVE
  variant_origin: GERMLINE
  features: >
    TBX21 encodes T-bet, the T-box transcription factor that specifies type 1 immunity.
    The reported disease genotype is homozygosity for an in-del variant in exon 1 that
    abolishes DNA-binding activity. Protein expression is reduced but not abolished —
    TBX21 RNA is normal while protein is diminished — so the defect is functional rather
    than a clean null, which matters when comparing the patient with Tbx21-null mouse
    models. The resulting cellular phenotype is lineage-selective
    rather than global: the developmental programs for NK, iNKT, MAIT and Vdelta2+
    gamma-delta T lymphocytes fail, while other lymphocyte subsets develop normally and
    are impaired only in the amount of IFN-gamma they produce.
  evidence:
  - reference: PMID:38341181
    reference_title: "Genetic, immunologic, and clinical features of 830 patients with Mendelian susceptibility to mycobacterial diseases (MSMD): A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      showed that homozygosity for a T-box transcription factor-21 (TBX21) variant
      could result in MSMD
    explanation: >-
      Establishes a homozygous TBX21 variant as a genetic cause of Mendelian
      susceptibility to mycobacterial disease.
  - reference: PMID:33296702
    reference_title: "Human T-bet Governs Innate and Innate-like Adaptive IFN-γ Immunity against Mycobacteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a patient with mycobacterial disease due to inherited deficiency of the
      transcription factor T-bet.
    explanation: >-
      Attributes the patient's mycobacterial disease to inherited deficiency of T-bet,
      the TBX21 gene product.
  - reference: PMID:33296702
    reference_title: "Human T-bet Governs Innate and Innate-like Adaptive IFN-γ Immunity against Mycobacteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other lymphocyte subsets develop normally but produce low levels of IFN-γ, with
      the exception of CD8+ αβ T and non-classic CD4+ αβ TH1∗ lymphocytes, which produce
      IFN-γ normally in response to mycobacterial antigens.
    explanation: >-
      Documents that the TBX21 lesion is lineage-selective rather than a global
      lymphocyte defect, which is what distinguishes it from other MSMD etiologies.
  - reference: PMID:35867801
    reference_title: "Human T-bet governs the generation of a distinct subset of CD11c(high)CD21(low) B cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This patient carries a homozygous in-del mutation in TBX21 that abolishes
      DNA-binding activity without abrogating protein expression
    explanation: >-
      Specifies the variant class and its functional consequence: loss of DNA binding
      with protein still expressed, not a null allele.
  - reference: PMID:36630059
    reference_title: "Mendelian Susceptibility to Mycobacterial Disease (MSMD): Clinical, Immunological, and Genetic Features of 22 Patients from 15 Moroccan Kindreds."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a patient (P22) has a homozygous indel (insertion and/or deletion) mutation in exon
      1 of the TBX21 gene
    explanation: >-
      Localises the variant to exon 1 and independently confirms the homozygous indel
      genotype.
  - reference: PMID:36630059
    reference_title: "Mendelian Susceptibility to Mycobacterial Disease (MSMD): Clinical, Immunological, and Genetic Features of 22 Patients from 15 Moroccan Kindreds."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient expressed normal amounts of TBX21 RNA but protein expression was
      diminished
    explanation: >-
      Quantifies the expression defect: transcript normal, protein reduced. This is why
      the allele is described as functional rather than a null.
pathophysiology:
- name: TBX21 Loss of Function
  biological_scale: MOLECULAR
  genetic_context:
    allele_type: INDEL
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  description: >
    The initiating lesion is biallelic loss of function of TBX21, abolishing functional
    T-bet. T-bet is a sequence-specific DNA-binding transcription factor of the T-box
    family and is the master regulator of the type 1 immune program; its loss removes
    the transcriptional instruction that specifies the IFN-gamma-producing lineages
    rather than any component of the IL-12/IFN-gamma signalling circuit itself.
  molecular_functions:
  - preferred_term: T-bet sequence-specific transcriptional activation
    term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Failed Development of Innate and Innate-like Lymphocyte Lineages
    causal_link_type: DIRECT
    description: >-
      Loss of the T-bet transcriptional program removes the lineage-specification
      signal for the NK, iNKT, MAIT and Vdelta2+ gamma-delta T compartments.
    evidence:
    - reference: PMID:33296702
      reference_title: "Human T-bet Governs Innate and Innate-like Adaptive IFN-γ Immunity against Mycobacteria."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Human T-bet deficiency thus underlies mycobacterial disease by preventing the
        development of innate (NK) and innate-like adaptive lymphocytes (iNKT, MAIT, and
        Vδ2+ γδ T cells)
      explanation: >-
        States the causal step directly: T-bet deficiency prevents the development of
        these lineages.
  - target: Loss of T-bet Repression of the Th2 Program
    causal_link_type: DIRECT
    description: >-
      T-bet has a second, repressive function that is lost at the same time: the
      wild-type protein restrains the type 2 program, and the patient's mutant protein
      does not.
    evidence:
    - reference: PMID:34160550
      reference_title: "High Th2 cytokine levels and upper airway inflammation in human inherited T-bet deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Unlike wild-type (WT) T-bet, the mutant form of T-bet from this patient did not
        inhibit the production of Th2 cytokines, including IL-4, IL-5, IL-9, and IL-13,
        when overexpressed in T helper 2 (Th2) cells.
      explanation: >-
        Direct comparison of wild-type and patient-mutant T-bet establishes that the
        variant specifically abolishes Th2 repression, which is this causal edge.
  - target: Loss of T-bet-Dependent B Cell Subset Development and Class-Switch Skewing
    causal_link_type: DIRECT
    description: >-
      The same loss of T-bet also removes a B-cell-intrinsic requirement, for one
      CD11c-high CD21-low subset and for the normal balance of immunoglobulin class
      switching.
    evidence:
    - reference: PMID:35867801
      reference_title: "Human T-bet governs the generation of a distinct subset of CD11c(high)CD21(low) B cells."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Moreover, T-bet was required for the in vivo and in vitro development of a
        distinct subset of human B cells characterized by reduced expression of CD21 and
        the concomitantly high expression of CD19, CD20, CD11c, FCRL5, and T-bet
      explanation: >-
        Establishes the B-cell-intrinsic requirement for T-bet, which is this causal
        edge.
  evidence:
  - reference: PMID:33296702
    reference_title: "Human T-bet Governs Innate and Innate-like Adaptive IFN-γ Immunity against Mycobacteria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a patient with mycobacterial disease due to inherited deficiency of the
      transcription factor T-bet.
    explanation: >-
      Establishes inherited T-bet deficiency as the initiating molecular lesion.
  - reference: PMID:34675939
    reference_title: "Expression Regulation and Function of T-Bet in NK Cells."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      T box domain of T box proteins might bind the target sequence as a dimer,
      interacting with both the major and the minor grooves of the DNA
    explanation: >-
      Supports the molecular-function annotation of T-bet as a sequence-specific
      DNA-binding transcription factor.
- name: Failed Development of Innate and Innate-like Lymphocyte Lineages
  biological_scale: CELLULAR
  description: >
    Without T-bet, the innate (NK) and innate-like adaptive (iNKT, MAIT, Vdelta2+
    gamma-delta T) lymphocyte lineages fail to develop, and circulating counts of the
    Mycobacterium-reactive members of these populations are extremely low. Classic TH1
    lymphocytes, which are Mycobacterium-non-reactive, are also severely depleted. This
    is a developmental rather than a signalling defect, which is what distinguishes
    IMD88 from the receptor and JAK-STAT etiologies of MSMD.
  cell_types:
  - preferred_term: Mycobacterium-reactive natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  - preferred_term: invariant NKT cell
    term:
      id: CL:0000921
      label: type I NK T cell
  - preferred_term: mucosal-associated invariant T cell
    term:

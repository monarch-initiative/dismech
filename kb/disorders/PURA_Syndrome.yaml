    explanation: Missense variants lower Pur-alpha levels in cells, supporting haploinsufficiency.
  - reference: PMID:38655849
    reference_title: PURA syndrome-causing mutations impair PUR-domain integrity and affect P-body association.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'These mutations either destroyed the folding integrity, RNA binding, or dimerization of PURA.'
    explanation: Gives the molecular consequences of patient missense variants.

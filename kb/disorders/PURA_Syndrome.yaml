    evidence_source: HUMAN_CLINICAL
    snippet: 'We describe 11 individuals with clinical features of 5q31.3 microdeletion syndrome and de novo mutations in PURA, encoding transcriptional activator protein Pur-α, within the critical region.'
    explanation: The discovery report identifying de novo PURA variants as the cause of the syndrome.

genetic:
- name: PURA
  gene_term:
    preferred_term: PURA
    term:
      id: hgnc:9701
      label: PURA
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  association: Haploinsufficiency, autosomal dominant
  notes: >-
    More than 90 distinct pathogenic variants are reported without a clear
    genotype-phenotype correlation beyond the extent of loss. Duplications of
    5q31 encompassing PURA raise PURA expression and cause a milder, distinct
    neurodevelopmental disorder, so PURA is dosage sensitive in both directions;
    the duplication disorder is not part of this entry.
  evidence:
  - reference: PMID:25439098
    reference_title: Mutations in PURA cause profound neonatal hypotonia, seizures, and encephalopathy in 5q31.3 microdeletion syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'These data implicate causative PURA mutations responsible for the severe neurological phenotypes observed in this syndrome.'
    explanation: Establishes PURA as the causal gene.
  - reference: PMID:25342064
    reference_title: Whole exome sequencing in family trios reveals de novo mutations in PURA as a cause of severe neurodevelopmental delay and learning disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Protein-altering de novo mutations in PURA were identified in four subjects.'
    explanation: Independent co-discovery of de novo PURA variants in developmental-delay trios.
  - reference: PMID:34790866
    reference_title: 'PURA-Related Developmental and Epileptic Encephalopathy: Phenotypic and Genotypic Spectrum.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'We found 97 pathogenic variants in PURA without any clear genotype-phenotype associations.'
    explanation: Allelic heterogeneity without a clear genotype-phenotype correlation.
  - reference: PMID:42768094
    reference_title: 5q31 duplications encompassing PURA are associated with a neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Our findings support that 5q31 duplications encompassing PURA represent a novel genomic disorder presenting with a milder phenotype than the reciprocal deletion syndrome and implicate PURA dosage dysregulation as a key contributor to the associated clinical features.'
    explanation: Supports the note that increased PURA dosage causes a separate, milder disorder.
inheritance:
- name: Autosomal dominant, usually de novo
  description: >-
    Autosomal dominant. Almost all cases arise from a de novo variant, and all
    reported 5q31.3 deletions have been de novo. Rare inherited and mosaic cases
    are known, and recurrence risk from parental gonadal mosaicism may exceed the
    usual figure because PURA loss-of-function variants appear to confer a
    selective advantage in the germline.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:28448108
    reference_title: PURA-Related Neurodevelopmental Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Almost all individuals diagnosed with PURA syndrome have the disorder as the result of a de novo constitutional PURA pathogenic variant.'
    explanation: De novo origin in almost all cases.
  - reference: PMID:28448108
    reference_title: PURA-Related Neurodevelopmental Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'the recurrence risk for PURA syndrome due to parental gonadal mosaicism is expected to be higher than the standard parental gonadal mosaicism risk of <1% because loss-of-function variants in PURA have a selective advantage resulting in clonal expansion'

    snippet: 'Patients with 5q31.3 deletion syndrome exhibited more congenital defects (50% vs 12%, p<0.0001), respiratory difficulties (94% vs 63%, p=0.013) and walking disability (94% vs 55%, p=0.0026) than patients with PURA syndrome.'
    explanation: Quantifies the greater severity of the deletion form in a pooled review of 230 patients.
  - reference: PMID:36376392
    reference_title: 'A 25 Mainland Chinese cohort of patients with PURA-related neurodevelopmental disorders: clinical delineation and genotype-phenotype correlations.'

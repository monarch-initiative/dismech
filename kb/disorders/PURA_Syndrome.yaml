diagnosis:
- name: PURA molecular genetic testing
  presence: PRESENT
  description: >-
    Diagnosis is molecular: sequencing identifies a heterozygous intragenic
    variant in about 93 percent, and chromosomal microarray or other deletion
    testing identifies a 5q31.3 deletion including PURA in about 7 percent.
  evidence:
  - reference: PMID:28448108
    reference_title: PURA-Related Neurodevelopmental Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'The diagnosis of PURA syndrome is established in a proband with a heterozygous PURA pathogenic variant (~93% of individuals with a PURA-NDD)'
    explanation: GeneReviews diagnostic criterion for the intragenic form.
  - reference: PMID:28448108
    reference_title: PURA-Related Neurodevelopmental Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'the diagnosis of 5q31.3 deletion syndrome is established in a proband with a nonrecurrent 5q31.3 deletion encompassing all or part of PURA (~7% of individuals with a PURA-NDD) identified by molecular genetic testing'
    explanation: GeneReviews diagnostic criterion for the deletion form.
- name: DNA methylation episignature
  presence: PRESENT
  description: >-
    A PURA-NDD-specific genome-wide methylation profile can help classify PURA
    variants of uncertain significance.
  evidence:
  - reference: PMID:38770750
    reference_title: Genome-wide epigenetic signatures facilitated the variant classification of the PURA gene and uncovered the pathomechanism of PURA-related neurodevelopmental disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Patients with PURA-NDD exhibit a specific episignature, which has potential to aid identification and diagnosis of PURA-NDD patients'
    explanation: Establishes the episignature as a diagnostic aid.
treatments:
- name: Supportive Multidisciplinary Care
  therapeutic_modality: BEHAVIORAL
  description: >-
    No disease-modifying therapy exists. Management is supportive and
    multidisciplinary, covering development, hypotonia, seizures, movement
    disorders, speech, feeding, apnea, vision, and cardiac, urogenital and
    skeletal complications, with surveillance for dysphagia, vitamin D deficiency,
    low bone density, hip dysplasia and scoliosis.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:28448108
    reference_title: PURA-Related Neurodevelopmental Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'PURA-NDDs are incurable genetic disorders that are managed supportively and symptomatically.'
    explanation: GeneReviews management statement.
- name: Developmental Rehabilitation Therapies
  therapeutic_modality: BEHAVIORAL
  description: >-
    Physical, occupational, and speech and language therapy, including
    alternative and augmentative communication given that most patients are
    non-verbal, with periodic reassessment of communication systems.
  treatment_term:
    preferred_term: physical, occupational and speech therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:28448108
    reference_title: PURA-Related Neurodevelopmental Disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Ongoing routine care by a multidisciplinary team is recommended including treatment and/or therapy for developmental delays, neurologic findings (hypotonia, seizures, abnormal movements), speech and language disorders, feeding difficulties, apnea, visual impairment'
    explanation: GeneReviews recommends therapy for developmental delay, hypotonia and speech and language disorders.

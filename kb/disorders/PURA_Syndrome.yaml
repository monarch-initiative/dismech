- name: Loss of P-bodies and Altered mRNA Regulation
  biological_scale: CELLULAR
  description: >-
    Pur-alpha is mostly cytoplasmic and binds thousands of mRNAs. Its depletion
    changes the abundance of many of them, lowers the P-body components LSM14A and
    DDX6, abolishes P-body formation and stabilises P-body-enriched transcripts.
    Patient variants also lose the normal co-localisation of PURA with P-bodies.
    In neurons Pur-alpha also travels with Staufen and FMRP in granules that
    target mRNAs to dendritic sites of translation.
    How this contributes to the neurodevelopmental phenotype has not been shown.
  biological_processes:
  - preferred_term: P-body assembly
    term:
      id: GO:0033962
      label: P-body assembly
    modifier: DECREASED
  - preferred_term: regulation of mRNA stability
    term:
      id: GO:0043488
      label: regulation of mRNA stability
  evidence:
  - reference: PMID:36651277
    reference_title: Depletion of the RNA-binding protein PURA triggers changes in posttranscriptional gene regulation and loss of P-bodies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Here, we show that PURA is predominantly located in the cytoplasm, where it binds to thousands of mRNAs. Many of these transcripts change abundance in response to PURA depletion.'
    explanation: Establishes PURA as a cytoplasmic mRNA-binding regulator whose loss changes transcript abundance.
  - reference: PMID:36651277
    reference_title: Depletion of the RNA-binding protein PURA triggers changes in posttranscriptional gene regulation and loss of P-bodies.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Furthermore, PURA knockdown results in stabilization of P-body-enriched transcripts, whereas other mRNAs are not affected.'
    explanation: Shows the selective effect on P-body-enriched mRNA stability.
  - reference: PMID:38655849
    reference_title: PURA syndrome-causing mutations impair PUR-domain integrity and affect P-body association.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'In this study, we observed that patient mutations across PURA impair its previously reported co-localization with processing bodies.'
    explanation: Patient variants, not only depletion, disturb the PURA-P-body association.
  - reference: PMID:16511857
    reference_title: Role of Pur alpha in targeting mRNA to sites of translation in hippocampal neuronal dendrites.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: 'Pur alpha and Staufen are colocalized at dendritic sites of mRNA translation.'
    explanation: Normal-function evidence that Pur-alpha works in neuronal mRNA transport granules; whether their loss mediates the patient phenotype is not shown.
- name: Transcriptional Dysregulation
  biological_scale: MOLECULAR
  description: >-
    Pur-alpha also acts in the nucleus as a transcriptional regulator with DNA
    duplex-unwinding activity. Patients share a genome-wide DNA methylation
    episignature, and a truncating variant studied in cells mislocalised to the
    nucleus, changed expression of genes in neurodevelopmental pathways and
    impaired DNA unwinding.
  biological_processes:
  - preferred_term: regulation of DNA-templated transcription
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
  evidence:
  - reference: PMID:38770750
    reference_title: Genome-wide epigenetic signatures facilitated the variant classification of the PURA gene and uncovered the pathomechanism of PURA-related neurodevelopmental disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Genome-wide DNA methylation analysis unveiled distinctive methylation profiles to PURA-NDD, and the established classifier can reclassify PURA variants of uncertain significance.'
    explanation: A disease-specific episignature indicates genome-wide chromatin-level dysregulation in patients.
  - reference: PMID:41130720
    reference_title: 'PURA protein mislocalisation in the nucleus: mechanistic basis for transcriptional dysregulation and DNA unwinding deficits in a model of the p.L148Wfs*77 PURA variant.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: 'Nuclear mislocalisation of the PURA variant dysregulates transcriptional balance and impairs DNA unwinding, linking PURA''s structural integrity to neurodevelopmental deficits.'
    explanation: Cell-model evidence for transcriptional dysregulation by a patient variant; shown for a single variant.
  - reference: PMID:26744780

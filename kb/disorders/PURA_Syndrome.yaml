name: PURA Syndrome
creation_date: '2026-09-30T00:00:00Z'
description: >-
  An autosomal dominant neurodevelopmental disorder caused by reduced dosage of
  PURA, which encodes Pur-alpha, a single-stranded DNA- and RNA-binding protein
  that regulates transcription, mRNA transport and translation and is needed for
  postnatal brain development. Most cases carry a de novo heterozygous PURA
  variant (PURA syndrome proper); a minority carry a de novo 5q31.3 deletion that
  removes all or part of PURA together with neighbouring genes. Onset is
  neonatal, with profound hypotonia, feeding difficulty, apnea and hypoventilation,
  hypersomnolence, hypothermia and an exaggerated startle response. All affected
  individuals in the large cohorts have moderate to severe intellectual
  disability, most remain non-verbal, many never walk independently, and about
  half to 60 percent develop epilepsy that is often drug resistant. A
  neuromuscular junction component contributes to the weakness in some patients.
categories:
- Neurodevelopmental Disorder
- Developmental and Epileptic Encephalopathy
parents:
- autosomal dominant disease
- multiple congenital anomalies/dysmorphic syndrome-intellectual disability
synonyms:

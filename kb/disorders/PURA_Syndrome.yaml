    explanation: Establishes the nuclear transcriptional and cytoplasmic mRNA-localisation roles of Pur-alpha.
- name: Impaired Postnatal Neuronal Development
  biological_scale: TISSUE
  description: >-
    In mice, Pur-alpha is required for postnatal proliferation of neuronal
    precursors and for dendritic and synaptic maturation in the hippocampus and
    cerebellum. Homozygous knockouts develop tremor and seizures from two weeks
    and die by four weeks; heterozygous mice show hypotonia, gait abnormality,
    memory deficits and neuron loss in the hippocampus and cerebellum. The two
    independent Pura-null lines disagree on precursor proliferation: absent in
    one, prolonged in the other, so the direction of that effect is unsettled.
  cell_types:
  - preferred_term: hippocampal neuron
    term:
      id: CL:0002608
      label: hippocampal neuron
  - preferred_term: cerebellar Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  biological_processes:
  - preferred_term: neural precursor cell proliferation
    term:
      id: GO:0061351
      label: neural precursor cell proliferation
    modifier: DECREASED
  - preferred_term: dendrite development
    term:
      id: GO:0016358
      label: dendrite development
    modifier: DECREASED
  evidence:
  - reference: PMID:12972605
    reference_title: Puralpha is essential for postnatal brain development and developmentally coupled cellular proliferation as revealed by genetic inactivation in the mouse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: 'There are severely lower numbers of neurons in regions of the hippocampus and cerebellum of PURA(-/-) mice versus those of age-matched +/+ littermates, and lamination of these regions is aberrant at time of death.'
    explanation: Complete loss of Pur-alpha disrupts hippocampal and cerebellar development.
  - reference: PMID:12972605
    reference_title: Puralpha is essential for postnatal brain development and developmentally coupled cellular proliferation as revealed by genetic inactivation in the mouse.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: 'At postnatal day 5, a critical time for cerebellar development, Puralpha and Cdk5 were both at peak levels in bodies and dendrites of Purkinje cells of PURA(+/+) mice, but both were absent in dendrites of PURA(-/-) mice.'
    explanation: Places the defect in Purkinje cell dendrites during postnatal cerebellar development.
  - reference: PMID:22010047
    reference_title: Lack of Pur-alpha alters postnatal brain development and causes megalencephaly.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: 'lack of Purα prolongs the postnatal proliferation of neuronal precursor cells both in the hippocampus and in the cerebellum, however, without affecting the overall number of postmitotic neurons'
    explanation: >-
      An independent Pura-null line found precursor proliferation prolonged rather
      than reduced, and neuron numbers unchanged, which contradicts the DECREASED
      proliferation modifier drawn from the first knockout.
  - reference: PMID:22010047
    reference_title: Lack of Pur-alpha alters postnatal brain development and causes megalencephaly.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: 'Independent of these findings, we observed alterations in the expression and distribution of the dendritic protein MAP2, the translation of which has been proposed previously to be Purα-dependent.'
    explanation: The same knockout does support the dendritic component of this node.
  - reference: PMID:16511857
    reference_title: Role of Pur alpha in targeting mRNA to sites of translation in hippocampal neuronal dendrites.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: 'Using genetic inactivation in the mouse, PURA, encoding Pur alpha, is demonstrated to be essential for developmentally-timed dendrite formation in the cerebellum and hippocampus.'
    explanation: Knockout evidence for the dendrite-formation component of this node.

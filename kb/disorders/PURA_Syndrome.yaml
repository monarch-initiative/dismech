animal_models:
- name: Pura knockout mouse
  species: Mouse
  genotype: Pura-/- (homozygous) and Pura+/- (heterozygous)
  publication: PMID:12972605
  description: >-
    Homozygous knockouts are normal at birth, develop tremor and spontaneous
    seizures from two weeks and die by four weeks, with reduced neurons and
    precursor proliferation in hippocampus and cerebellum. Heterozygous mice, which
    match the patient genotype, show hypotonia, gait abnormality and memory deficits.
  modeled_mechanisms:
  - target: Impaired Postnatal Neuronal Development
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      The severe homozygous phenotype does not correspond to any human genotype;
      only the heterozygous mouse matches patients, and it lacks the neonatal
      respiratory and feeding phenotype.
    evidence:
    - reference: PMID:27651147
      reference_title: 'Memory deficits, gait ataxia and neuronal loss in the hippocampus and cerebellum in mice that are heterozygous for Pur-alpha.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: 'When combined with these new findings, the Pur-alpha heterozygous knockout mice may provide an animal model to study mechanisms of and treatments for Pur-alpha-related cognitive deficiencies and neuropathology.'
      explanation: The authors propose the heterozygous mouse as a model of Pur-alpha-related cognitive deficiency.

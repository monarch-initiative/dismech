    explanation: Supports PURA as the main driver of the deletion phenotype with additional contribution from co-deleted genes.
pathophysiology:
- name: PURA Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    The initiating lesion. A de novo heterozygous intragenic variant or a 5q31.3
    deletion reduces functional Pur-alpha. Missense variants as well as truncating
    ones lower Pur-alpha levels and share one DNA methylation episignature,
    supporting haploinsufficiency as the common mechanism. Missense variants act
    by destroying the folding, RNA binding or dimerization of the PUR domains, and
    the unusually dynamic structure of PURA makes it sensitive to even
    conservative substitutions.

    snippet: 'In PURA syndrome, protein-truncating (nonsense or frameshift) variants were associated with more speech deficits (93% vs 80%, p=0.014) than non-protein-truncating (missense or in-frame) variants.'
    explanation: Gives the one variant-class correlation reported within the point-variant form.

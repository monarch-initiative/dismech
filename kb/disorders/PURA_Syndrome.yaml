- name: Neuromuscular Junction Dysfunction
  biological_scale: TISSUE
  description: >-
    Although PURA-NDD is primarily a central nervous system disorder, some
    patients show myopathic facies, ptosis, fluctuating weakness and a
    decremental response on repetitive nerve stimulation, and PURA is now listed
    among congenital myasthenic syndrome genes. Some infants improve with
    pyridostigmine or salbutamol. How reduced Pur-alpha impairs neuromuscular
    transmission is not established.
  biological_processes:
  - preferred_term: neuromuscular synaptic transmission
    term:
      id: GO:0007274
      label: neuromuscular synaptic transmission
    modifier: DECREASED
  evidence:
  - reference: PMID:36768582
    reference_title: 'Neuromuscular and Neuromuscular Junction Manifestations of the PURA-NDD: A Systematic Review of the Reported Symptoms and Potential Treatment Options.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Recently, fluctuating weakness noted in a PURA-NDD patient, accompanied by repetitive nerve stimulation abnormalities, suggested the disease to be a channelopathy and, more specifically, a neuromuscular junction disorder.'
    explanation: Clinical and electrophysiological evidence for a neuromuscular junction component.
  - reference: PMID:41575592
    reference_title: Exploring molecular signatures in PURA syndrome using muscle proteomics and serum biomarkers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'In line with the recognized classification of PURA syndrome as a CMS subtype, our patients exhibited hypotonia, ptosis, ocular weakness, and myopathic facies, reflecting impaired neuromuscular transmission.'
    explanation: A ten-patient series with myasthenic features consistent with impaired neuromuscular transmission.
  - reference: PMID:41575592
    reference_title: Exploring molecular signatures in PURA syndrome using muscle proteomics and serum biomarkers.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: 'Subtle vesicle accumulation and minor NMJ alterations suggest possible neuromuscular involvement in PURA syndrome.'
    explanation: Ultrastructural findings in one patient biopsy are subtle, so the NMJ contribution is supported but modest.
  downstream:
  - target: Myopathic Facies
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Ptosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Apnea

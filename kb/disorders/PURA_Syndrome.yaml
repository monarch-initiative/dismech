    snippet: 'The diagnosis of PURA syndrome is established in a proband with a heterozygous PURA pathogenic variant (~93% of individuals with a PURA-NDD)'
    explanation: Defines the intragenic-variant form and gives its share of PURA-NDD.
  - reference: PMID:39824548

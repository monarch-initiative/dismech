notes: >-
  The entry covers both PURA-related neurodevelopmental disorders, PURA syndrome
  from intragenic variants and the 5q31.3 deletion syndrome, under the MONDO
  grouping term that carries the synonym PURA syndrome, with each as a subtype.
  How loss of P-bodies and transcriptional dysregulation lead to the neurological
  phenotype is not established, so those nodes have no downstream edges.

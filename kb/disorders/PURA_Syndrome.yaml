  description: >-
    De novo, nonrecurrent 5q31.3 deletion encompassing all or part of PURA,
    about 7 percent of PURA-NDD. Compared with intragenic variants it carries more
    congenital defects, respiratory difficulty and walking disability, consistent
    with a contribution from co-deleted genes.

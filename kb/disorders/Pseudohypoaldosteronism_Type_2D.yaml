    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Results from independent simulations indicate that when S433 was phosphorylated, the electrostatic potential became more negative in the AM binding site of KLHL3 and therefore was unfavorable for binding with the negatively charged AM."
    explanation: Gives the electrostatic basis for the loss of binding at this node.
- name: Loss of KLHL3 Substrate Adaptor Function

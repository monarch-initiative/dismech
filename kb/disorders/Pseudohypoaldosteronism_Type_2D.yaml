      reference_title: "Angiotensin II signaling via protein kinase C phosphorylates Kelch-like 3, preventing WNK4 degradation."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We show that KLHL3 is phosphorylated at serine 433 in the Kelch domain (a site frequently mutated in hypertension with hyperkalemia) by protein kinase C in cultured cells and that this phosphorylation prevents WNK4 binding and degradation."
      explanation: States directly that serine 433 phosphorylation blocks WNK4 binding and degradation.
  evidence:

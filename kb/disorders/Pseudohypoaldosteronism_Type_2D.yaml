    explanation: Dietary potassium restriction uses the same switch in the distal convoluted tubule.
  - reference: PMID:30718414
    reference_title: "Calcineurin dephosphorylates Kelch-like 3, reversing phosphorylation by angiotensin II and regulating renal electrolyte handling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In vivo, tacrolimus increases levels of KLHL3S433-P, resulting in increased levels of WNK4, phosphorylated SPAK, and NCC."
    explanation: Calcineurin inhibition raises serine 433 phosphorylation and reproduces the downstream cascade.
  - reference: PMID:27727489

    quote_role: REVIEW_SYNTHESIS
    snippet: "Aldosterone levels are variable, but are relatively low given the degree of hyperkalemia (elevated serum potassium is a potent stimulus for aldosterone secretion)."
    explanation: Explains the inappropriately low aldosterone that gives the syndrome its name.
- name: Reduced Sodium Delivery to ENaC-Expressing Segments
  description: >-
    In the late distal convoluted tubule, connecting tubule and cortical
    collecting duct, ENaC-mediated sodium reabsorption generates the lumen
    negative voltage that drives potassium secretion through ROMK. When upstream
    NCC captures the sodium, that driving force is lost. Two further WNK4 actions
    compound it: excess WNK4 clears ROMK from the cell surface, and it also
    lowers the large-conductance BK channel by promoting its degradation, so both
    secretory potassium channels of the segment are suppressed as well as their
    driving force.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: kidney collecting duct principal cell
    term:
      id: CL:1001431
      label: kidney collecting duct principal cell
  biological_processes:
  - preferred_term: renal sodium ion transport in ENaC-expressing segments
    modifier: DECREASED
    term:
      id: GO:0003096
      label: renal sodium ion transport
  downstream:
  - target: Impaired Distal Potassium Secretion
    causal_link_type: DIRECT
    description: >-
      Without ENaC-driven sodium entry there is no electrical driving force for
      luminal potassium secretion, and the channels that would carry it are
      themselves reduced.
    evidence:
    - reference: PMID:39699086
      reference_title: "Familial Hyperkalemic Hypertension."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "In these segments, ENaC-mediated Na+ reabsorption generates the electrical driving force for ROMK-mediated K+ secretion into the tubule lumen."
      explanation: States the electrical coupling between ENaC sodium entry and ROMK potassium secretion.
  evidence:
  - reference: PMID:23576762
    reference_title: "Kelch-like 3 and Cullin 3 regulate electrolyte homeostasis via ubiquitination and degradation of WNK4."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that WT but not mutant KLHL3 inhibits WNK4-induced reduction of ROMK level."
    explanation: Mutant KLHL3 permits WNK4 to lower ROMK, adding a channel-level contribution to impaired potassium secretion.
  - reference: PMID:23576762
    reference_title: "Kelch-like 3 and Cullin 3 regulate electrolyte homeostasis via ubiquitination and degradation of WNK4."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "WNK4 normally induces clearance of the renal outer medullary K+ channel (ROMK) from the cell surface."
    explanation: Establishes the WNK4 effect on ROMK that mutant KLHL3 fails to restrain.
  - reference: PMID:23885063
    reference_title: "Regulation of large-conductance Ca2+-activated K+ channels by WNK4 kinase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results suggest that WNK4 inhibits BK channel activity, in part, by increasing channel degradation through an ubiquitin-dependent pathway."
    explanation: Excess WNK4 also lowers the BK channel, the other secretory potassium route of these segments.
  - reference: PMID:21613417
    reference_title: "WNK4 kinase inhibits Maxi K channel activity by a kinase-dependent mechanism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These findings suggest that WNK4 WT inhibits Maxi K activity by reducing Maxi K protein at the membrane, but that the inhibition is not due to an increase in clathrin-mediated endocytosis of Maxi K, but likely due to enhancing its lysosomal degradation."
    explanation: Independent confirmation of the WNK4 effect on the BK channel, with the degradative route identified.
- name: Impaired Distal Potassium Secretion
  description: >-
    Renal potassium excretion falls despite a normal glomerular filtration rate
    and a potassium load that would normally drive secretion, producing the
    hyperkalemia that defines the syndrome.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: renal potassium excretion
    modifier: DECREASED
    term:
      id: GO:0036359
      label: renal potassium excretion
  downstream:
  - target: Hyperkalemia
    causal_link_type: DIRECT
    description: >-
      Potassium that cannot be secreted into the tubular lumen accumulates in
      the extracellular fluid.
    evidence:
    - reference: PMID:39699086
      reference_title: "Familial Hyperkalemic Hypertension."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "This results in lower K+ secretion and thus hyperkalemia."
      explanation: States the step from reduced potassium secretion to hyperkalemia.
  - target: Hyperkalemia-Driven Impairment of Renal Ammonium Excretion
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The hyperkalemia that follows from the secretory defect is in turn what
      disturbs renal ammonia handling, in the account this entry encodes.
  evidence:
  - reference: PMID:22073419
    reference_title: "Pseudohypoaldosteronism Type II."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Pseudohypoaldosteronism type II (PHAII) is characterized by hyperkalemia despite normal glomerular filtration rate (GFR) and frequently by hypertension."
    explanation: Records that the hyperkalemia occurs with a preserved filtration rate, so it is a secretory defect.
  - reference: PMID:25313067
    reference_title: "Angiotensin II signaling via protein kinase C phosphorylates Kelch-like 3, preventing WNK4 degradation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "components of an E3 ubiquitin ligase complex that targets WNKs for degradation--cause constitutively increased renal salt reabsorption and impaired K(+) secretion, resulting in hypertension and hyperkalemia"
    explanation: Frames impaired potassium secretion as the shared human consequence of mutations in the complex; quoted from this paper's introduction rather than from its own cell and mouse experiments.
- name: Hyperkalemia-Driven Impairment of Renal Ammonium Excretion
  description: >-
    The metabolic acidosis of this syndrome is best explained as a secondary
    consequence of the hyperkalemia rather than as a primary proton secretion
    defect. In the constitutively active SPAK mouse, which isolates cotransporter
    hyperactivation from any other effect of the disease genes, correcting the
    hyperkalemia with a thiazide or with dietary potassium restriction also
    corrected the acidosis, and the mice showed reduced ammonia-generating
    enzymes in the proximal tubule with reduced collecting duct ammonia
    transport.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: renal regulation of acid-base pH
    modifier: DECREASED
    term:
      id: GO:0006885
      label: regulation of pH
  downstream:
  - target: Hyperchloremic metabolic acidosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Reduced renal ammonium excretion lowers net acid excretion, producing the
      hyperchloremic acidosis.
    evidence:
    - reference: PMID:39699086
      reference_title: "Familial Hyperkalemic Hypertension."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Thus, metabolic acidosis in FHHt occurs due to secondary effects of hyperkalemia on ammonia metabolism and/or secretion along the proximal tubule and collecting duct."
      explanation: States the conclusion that the acidosis is secondary to hyperkalemia through ammonia handling.
  evidence:
  - reference: PMID:39699086
    reference_title: "Familial Hyperkalemic Hypertension."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Hydrochlorothiazide administration and dietary K+ restriction, both of which corrected hyperkalemia, also corrected metabolic acidosis in CA-SPAK mice."
    explanation: Correcting the hyperkalemia corrects the acidosis in the model that isolates cotransporter hyperactivation.

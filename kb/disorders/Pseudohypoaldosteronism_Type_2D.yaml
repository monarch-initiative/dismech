name: Pseudohypoaldosteronism Type 2D
category: Mendelian
creation_date: "2026-10-30T15:29:18Z"
synonyms:
- PHA2D
- PHAIID
- KLHL3 pseudohypoaldosteronism type 2
- pseudohypoaldosteronism type 2 caused by mutation in KLHL3
- KLHL3-related familial hyperkalemic hypertension
- Gordon syndrome due to KLHL3 mutation
description: >-
  Pseudohypoaldosteronism type 2D (PHA2D) is the KLHL3-related form of familial
  hyperkalemic hypertension, the syndrome also called pseudohypoaldosteronism
  type II or, in its renal sense, Gordon syndrome. KLHL3 is the substrate adaptor
  that presents the WNK1 and WNK4 kinases to a CUL3-RING E3 ubiquitin ligase for
  proteasomal degradation. When that presentation fails, WNK kinase protein
  accumulates in the distal convoluted tubule and drives the SPAK and OSR1
  cascade, which phosphorylates and activates the thiazide-sensitive sodium
  chloride cotransporter NCC (SLC12A3). The resulting constitutive distal sodium
  chloride reabsorption expands extracellular volume, producing hypertension and
  renin suppression, while diverting sodium away from the ENaC-expressing
  segments downstream removes the electrical driving force for potassium
  secretion. Excess WNK4 additionally suppresses the ROMK and BK potassium
  channels themselves, so patients are hyperkalemic despite a normal glomerular
  filtration rate and an aldosterone level that is inappropriately low for the
  degree of hyperkalemia. Hyperchloremia, hyperchloremic metabolic acidosis and
  hypercalciuria complete the biochemical picture. KLHL3 is the only one of the
  four familial hyperkalemic hypertension genes with both an autosomal dominant
  and an autosomal recessive form: recessive alleles are distributed through the
  protein and abolish adaptor function, whereas dominant alleles cluster in the
  Kelch propeller and BTB domains, where they block WNK or CUL3 binding and act
  as dominant negatives through KLHL3 dimerization. Thiazide diuretics, which
  inhibit the overactive cotransporter directly, correct the electrolyte and
  blood pressure abnormalities.
disease_term:
  preferred_term: pseudohypoaldosteronism type 2D
  term:
    id: MONDO:0013781
    label: pseudohypoaldosteronism type 2D
parents:
- Pseudohypoaldosteronism type 2
notes: >-
  Scope of the syndrome-level sources. The Orphanet record cited throughout
  (ORPHA:757, pseudohypoaldosteronism type 2) and the GeneReviews chapter
  (PMID:22073419) both describe pseudohypoaldosteronism type II across all four
  causative genes (WNK1, WNK4, KLHL3, CUL3) rather than the KLHL3 form alone, so
  their phenotype frequencies and their statement that prevalence is unknown
  apply to the syndrome as a whole. Figures specific to KLHL3 come from the
  Boyden cohort (PMID:22266938), whose genotype-stratified table reports its 8
  recessive and 16 dominant KLHL3 kindreds as separate rows.

  Name collision. `kb/disorders/Gordon_Syndrome.yaml` in this knowledge base is
  distal arthrogryposis type 3, an unrelated musculoskeletal disorder sharing
  the eponym. It is not a parent or a relative of this entry and appears under
  `differential_diagnoses` only to record the collision; the renal sense of
  Gordon syndrome is this disease and its sibling gene forms.

  Sibling gene forms. PHA2A (WNK1), PHA2B (WNK4) and PHA2E (CUL3) are separate
  MONDO concepts sharing this mechanism from the WNK accumulation step onwards.
  They are cited here as differential diagnoses; their pathophysiology is not
  duplicated in this entry.

  Several cited experiments were done in WNK4 D561A or constitutively active
  SPAK mice rather than in a KLHL3 genotype. They are used only where the claim
  is about the shared cascade downstream of WNK accumulation, which the KLHL3
  R528H knock-in independently shows is engaged, and each explanation says which
  genotype the result came from. No KLHL3-specific claim rests on them.

  Mechanism of the acidosis. No study has established it in a KLHL3 genotype.
  The constitutively active SPAK mouse, which isolates cotransporter
  hyperactivation, attributes it to a secondary effect of hyperkalemia on
  proximal tubule and collecting duct ammonia handling, and that is the chain
  encoded here. The WNK4 Q562E mouse supports a different account, excessive
  collecting duct bicarbonate secretion through pendrin, and a cohort of 18
  human WNK4 Q565E patients had renal ammonium excretion no lower than
  unaffected subjects. The disagreement is recorded as a knowledge gap rather
  than resolved in the pathograph.

  Muscle weakness, periodic paralysis, fatigue and nausea with vomiting are
  recorded as phenotypes but left unwired to the pathograph. They are
  clinically attributed to the hyperkalemia, and the entry's description says
  so, but no source found states that causal link for this syndrome: Orphanet
  lists the features without a mechanism, GeneReviews does not mention them,
  and the one PHA2D case report gives them as presenting complaints rather than
  as consequences of a measured potassium. A `sequelae` edge from Hyperkalemia
  would be the right encoding once such a source exists. The same holds for
  short stature and growth delay, where the only candidate source
  (PMID:41380172) reports normal growth in its own patient.

  GeneReviews describes hypercalciuria in four words, below the snippet-length
  floor, so that claim is cited from PMID:25925082 instead, which is also
  KLHL3-specific and quantitative. GeneReviews remains the entry's phenotype
  baseline and is tagged in `references`.

  Hypercalciuria is documented in KLHL3-mutant families (PMID:25925082) but is
  deliberately left unwired to the pathograph. The only mechanistic account in
  the literature comes from the WNK4 D561A mouse, a different genotype whose
  human counterpart has more severe hypercalciuria, so no causal edge from the
  cotransporter node is sourced for the KLHL3 form.

  No ClinGen gene-disease validity assertion exists for the KLHL3 and
  pseudohypoaldosteronism type 2D pair in the committed ClinGen export
  (`kb/genes/ingest/clingen_gene_validity.tsv` and
  `cache/clingen/gene_validity.csv` carry one for CUL3 with PHA2E only), so no
  `gene_disease_validity` record is copied into this entry.

  Three leads from the openscientist deep-research report were checked and not
  used. It gives KLHL3 as HGNC:15531, which is EBNA1BP2; the correct identifier,
  read from the HGNC REST record for the symbol, is hgnc:6354. It binds
  suppressed renin to HP:0040331, which HPO calls Focal hypointensity of cerebral
  white matter on MRI, and hyperchloremic metabolic acidosis to HP:0004910, which
  is Bicarbonate-wasting renal tubular acidosis; the terms used here
  (HP:0003351, HP:0004918) were resolved independently. And it cites
  PMID:41380172 for growth impairment, but that paper is a CUL3 case whose
  follow-up reports normal growth and appropriate developmental milestones, so it
  supports neither the growth claim nor anything about the KLHL3 form.
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    Heterozygous missense KLHL3 variants clustered in the Kelch propeller and
    BTB domains segregate with the trait under a dominant model. They are
    inferred to act as dominant negatives because they phenocopy recessive loss
    of function, and because mice heterozygous for a KLHL3 null allele are
    unaffected while a heterozygous R528H knock-in is not. KLHL3 dimerization
    supplies the mechanism: a mutant subunit disables the heterodimer it joins.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:22266938
    reference_title: "Mutations in kelch-like 3 and cullin 3 cause hypertension and electrolyte abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sixteen kindreds have heterozygous mutations that co-segregate with the trait under a dominant model"
    explanation: Sixteen KLHL3 kindreds show dominant co-segregation of a heterozygous variant.
  - reference: PMID:22266938
    reference_title: "Mutations in kelch-like 3 and cullin 3 cause hypertension and electrolyte abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Importantly, we infer that mutations in dominant kindreds are likely dominant-negative, because they phenocopy the features of recessive disease."
    explanation: States the dominant-negative inference for the heterozygous KLHL3 alleles.
  - reference: PMID:22073419
    reference_title: "Pseudohypoaldosteronism Type II."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "PHAII is frequently inherited in an autosomal dominant manner; PHAIID (caused by pathogenic variants in KLHL3) may also be inherited in an autosomal recessive manner."
    explanation: GeneReviews records both modes for the KLHL3 form specifically.
- name: Autosomal recessive inheritance
  description: >-
    Biallelic KLHL3 variants, homozygous or compound heterozygous, cause the
    same disease in kindreds where affected members are confined to siblings who
    inherited both alleles while relatives carrying none or one are unaffected.
    Recessive alleles are distributed throughout the protein rather than
    clustered, and consanguinity underlies several of the reported families.
    Recessive transmission was unknown for pseudohypoaldosteronism type II
    before KLHL3 was identified, and KLHL3 remains the only familial
    hyperkalemic hypertension gene with a recessive form.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:22266938
    reference_title: "Mutations in kelch-like 3 and cullin 3 cause hypertension and electrolyte abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In these kindreds, affected members are confined to siblings of index cases who inherited the same two mutations, while unaffected relatives inherited zero or one mutation"
    explanation: Segregation in the eight biallelic KLHL3 kindreds follows a recessive model.
  - reference: PMID:22266938
    reference_title: "Mutations in kelch-like 3 and cullin 3 cause hypertension and electrolyte abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recessive transmission has not been previously described for PHAII."
    explanation: Records that the recessive mode was first established through KLHL3.
  - reference: PMID:28511177
    reference_title: "Familial Hyperkalemia and Hypertension (FHHt) and KLHL3: Description of a Family with a New Recessive Mutation (S553L) Compared to a Family with a Dominant Mutation, Q309R, with Analysis of Urinary Sodium Chloride Cotransporter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A family with recessive FHHt caused by a new KLHL3 mutation, S553L, is described."
    explanation: An independent consanguineous family carrying a recessive KLHL3 allele.
  - reference: PMID:42057493
    reference_title: "Challenges in the Diagnosis and Management of a Paediatric Patient With Normotensive Pseudohypoaldosteronism Type IID."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequent genetic testing identified a novel homozygous splice-site mutation in the KLHL3, confirming autosomal recessive PHA2D."
    explanation: A homozygous splice-site KLHL3 variant in recessive PHA2D.
  - reference: PMID:39699086
    reference_title: "Familial Hyperkalemic Hypertension."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "KLHL3 mutations account for 50-60% of FHHt-causing mutations, and of these, about 25% are recessive and 75% are dominant"
    explanation: Gives the proportion of KLHL3 alleles that are recessive rather than dominant.
prevalence:
- population: Worldwide
  measure_type: POINT_PREVALENCE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    Orphanet records the point prevalence of pseudohypoaldosteronism type 2 as
    unknown across all four causative genes, and no KLHL3-specific figure
    exists. The published series give the scale rather than a rate: KLHL3
    variants were found in 24 index cases of a 52-kindred referral cohort, which
    is a referral denominator and not a population one.
  evidence:
  - reference: ORPHA:757
    reference_title: "Pseudohypoaldosteronism type 2"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Unknown | Worldwide | Point prevalence | PMID:22073419"
    explanation: Orphanet epidemiology row recording an unknown worldwide point prevalence.
  - reference: PMID:22266938
    reference_title: "Mutations in kelch-like 3 and cullin 3 cause hypertension and electrolyte abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KLHL3 was sequenced in all PHAII index cases, identifying novel mutations in 24"
    explanation: Twenty-four of the 52 referred pseudohypoaldosteronism type II kindreds carried a KLHL3 variant.
progression:
- phase: Biochemical disease without hypertension
  age_range: Childhood to early adulthood
  notes: >-
    Hyperkalemia with hyperchloremic metabolic acidosis and suppressed renin
    typically precedes hypertension in the KLHL3 form. Only 14 percent of
    recessive and 17 percent of dominant KLHL3 patients were diagnosed with
    hypertension by age 18, against 94 percent for CUL3, and mean age at
    diagnosis or referral was in the mid twenties for both KLHL3 classes. A
    normotensive nine-year-old with biallelic KLHL3 disease has been reported in
    whom the absence of hypertension delayed diagnosis.
  evidence:
  - reference: PMID:22266938
    reference_title: "Mutations in kelch-like 3 and cullin 3 cause hypertension and electrolyte abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "| KLHL3 Recessive | 8 | 14 | 26 ±14 | 6.8 ±0.5 | 17.6 ±1.5 | 14 |"
    explanation: Genotype-stratified row giving a mean diagnosis age of 26 years and 14 percent hypertensive by age 18 for recessive KLHL3.
  - reference: PMID:22266938
    reference_title: "Mutations in kelch-like 3 and cullin 3 cause hypertension and electrolyte abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subjects with CUL3 mutations presented at much younger ages than those with mutation in KLHL3, WNK1, or WNK4, and had significantly more severe hyperkalemia and metabolic acidosis and were far more likely to have hypertension before age 18 (others commonly develop hypertension at later ages)"
    explanation: Hypertension in the KLHL3 form commonly appears later than in CUL3 disease.
  - reference: PMID:42057493
    reference_title: "Challenges in the Diagnosis and Management of a Paediatric Patient With Normotensive Pseudohypoaldosteronism Type IID."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory evaluation revealed severe hyperkalaemia and hyperchloremic metabolic acidosis with a normal glomerular filtration rate and persistent normotension."
    explanation: Documents the biochemical phase without hypertension in a child with PHA2D.
- phase: Hypertension and its complications
  age_range: Adulthood
  notes: >-
    Hypertension develops in most affected adults and carries the usual
    cardiovascular, renal and cerebrovascular risk, which is why blood pressure
    control is part of management rather than electrolyte correction alone.
  evidence:
  - reference: PMID:22073419
    reference_title: "Pseudohypoaldosteronism Type II."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Control of blood pressure is important to reduce the risk of cardiovascular and renal disease and stroke."
    explanation: GeneReviews states the rationale for treating the hypertensive phase.
  - reference: ORPHA:757
    reference_title: "Pseudohypoaldosteronism type 2"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Age of onset: All ages"
    explanation: Orphanet records onset across all ages for pseudohypoaldosteronism type 2.
genetic:
- name: KLHL3
  association: Causative, autosomal dominant (dominant negative) or autosomal recessive (biallelic loss of function)
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: KLHL3
    term:
      id: hgnc:6354
      label: KLHL3
  notes: >-
    KLHL3 encodes a BTB-BACK-Kelch protein serving as the substrate adaptor of a
    CUL3-RING E3 ubiquitin ligase. Two allele classes behave differently.
    Recessive alleles are spread through the protein and include a nonsense
    allele (W470X), a compound heterozygous missense pair (F322C with S410L), a
    homozygous splice-site allele, and homozygous S553L. Dominant alleles
    cluster: nine of sixteen in the Boyden series alter the d-a loops of the
    Kelch propeller and three sit in the BTB domain at sites implicated in
    cullin binding. S410L is mechanistically distinctive in combining reduced
    protein stability with reduced WNK4 affinity. S433G and S433N substitute the
    serine whose physiological phosphorylation normally switches WNK binding
    off, so those alleles mimic a constitutively phosphorylated adaptor.
  evidence:
  - reference: PMID:22266938
    reference_title: "Mutations in kelch-like 3 and cullin 3 cause hypertension and electrolyte abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we used exome sequencing to identify mutations in kelch-like 3 (KLHL3) or cullin 3 (CUL3) in PHAII patients from 41 unrelated families."
    explanation: Identification of KLHL3 as a pseudohypoaldosteronism type II gene.
  - reference: PMID:22266938
    reference_title: "Mutations in kelch-like 3 and cullin 3 cause hypertension and electrolyte abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While recessive KLHL3 mutations are distributed throughout the encoded protein, dominant KLHL3 mutations show striking clustering"
    explanation: Contrasts the distribution of recessive and dominant KLHL3 alleles.
  - reference: PMID:22406640
    reference_title: "KLHL3 mutations cause familial hyperkalemic hypertension by impairing ion transport in the distal nephron."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using combined linkage analysis and whole-exome sequencing in two families, we identified KLHL3 as a third gene responsible for FHHt."
    explanation: Independent identification of KLHL3 as a familial hyperkalemic hypertension gene.
  - reference: PMID:22406640
    reference_title: "KLHL3 mutations cause familial hyperkalemic hypertension by impairing ion transport in the distal nephron."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct sequencing of 43 other affected individuals revealed 11 additional missense mutations that were associated with heterogeneous phenotypes and diverse modes of inheritance."
    explanation: Eleven further missense alleles with heterogeneous phenotype and mixed inheritance.
  - reference: PMID:24266877
    reference_title: "Detection of mutations in KLHL3 and CUL3 in families with FHHt (familial hyperkalaemic hypertension or Gordon's syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KLHL3 variants all occur in kelch-repeat domains and so probably disrupt WNK complex binding."
    explanation: A replication cohort in which every KLHL3 variant fell in a Kelch repeat.
  variants:
  - name: R528H
    description: >-
      Recurrent heterozygous Kelch-domain missense allele, the one modelled in
      knock-in mice. Mutant KLHL3 R528H binds neither WNK1 nor WNK4, and a
      CUL3-KLHL3 R528H complex fails to ubiquitylate WNK1 in vitro. Reported in
      dominant kindreds.
    evidence:
    - reference: PMID:24821705
      reference_title: "Impaired degradation of WNK1 and WNK4 kinases causes PHAII in mutant KLHL3 knock-in mice."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "we measured the binding of TAMRA-labeled WNK1 and WNK4 peptides to full-length KLHL3 using fluorescence correlation spectroscopy, and found that neither WNK1 nor WNK4 bound to mutant KLHL3 R528H"
      explanation: R528H abolishes binding of both WNK substrates.
    - reference: PMID:23387299
      reference_title: "The CUL3-KLHL3 E3 ligase complex mutated in Gordon's hypertension syndrome interacts with and ubiquitylates WNK isoforms: disease-causing mutations in KLHL3 and WNK4 disrupt interaction."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The recombinant wild-type CUL3-KLHL3 E3 ligase complex, but not a disease-causing CUL3-KLHL3 ... mutant complex, ubiquitylated WNK1 in vitro."
      explanation: The R528H complex loses WNK1 ubiquitylation activity.
  - name: S410L
    description: >-
      Kelch-domain allele reported as one half of a compound heterozygous
      recessive genotype with F322C. It is distinctive in lowering KLHL3 protein
      stability as well as WNK4 binding affinity.
    evidence:
    - reference: PMID:22266938
      reference_title: "Mutations in kelch-like 3 and cullin 3 cause hypertension and electrolyte abnormalities."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "one in which affected members are compound heterozygotes for two missense mutations (F322C and S410L)"
      explanation: S410L occurs as one allele of a compound heterozygous recessive genotype.
    - reference: PMID:39699086
      reference_title: "Familial Hyperkalemic Hypertension."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "This indicated that the mechanism for the increase in WNK abundance was reduced stability of the KLHL3 S410L mutant protein."
      explanation: S410L raises WNK abundance by destabilising the adaptor, not only by losing binding.
  - name: W470X
    description: >-
      Homozygous nonsense allele in the kindred that first established recessive
      transmission of pseudohypoaldosteronism type II.
    variant_type: single nucleotide variant
    evidence:
    - reference: PMID:22266938
      reference_title: "Mutations in kelch-like 3 and cullin 3 cause hypertension and electrolyte abnormalities."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These include one kindred in which affected members are homozygous for a nonsense mutation (W470X)"
      explanation: A homozygous nonsense KLHL3 allele in a recessive kindred.
  - name: S433G and S433N
    description: >-
      Kelch-domain alleles substituting serine 433, the residue whose
      phosphorylation by protein kinase C, protein kinase A or Akt normally
      prevents WNK binding. A molecular dynamics study shows the phosphate makes
      the acidic-motif binding pocket more electronegative and dismantles the
      hydrogen bond network holding WNK4 there, which is why these alleles are
      read as mimicking the phosphorylated adaptor rather than simply disabling
      it.
    evidence:
    - reference: PMID:39699086
      reference_title: "Familial Hyperkalemic Hypertension."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "FHHt-causing mutations S433G and S443N likely recapitulate the effect of bona fide phosphorylation of S433 or the phosphomimetic S433E mutation exerting significant structural changes that prevent WNK4 binding to the CUL3-KLHL3 CRL."
      explanation: Reads the serine 433 substitutions as phosphomimetic. The quoted sentence carries the review's own typographical slip in the second allele name; the correct allele is S433N, as the preceding sentence of that paragraph gives it.
    - reference: PMID:27727489
      reference_title: "Phosphorylation of KLHL3 at serine 433 impairs its interaction with the acidic motif of WNK4: a molecular dynamics study."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "In conclusion, phosphorylation of KLHL3 at S433 disrupts the hydrogen bonds, hydrophobic and electrostatic interactions between the Kelch domain of KLHL3 and the AM of WNK4."
      explanation: Supplies the structural account of why a modification or substitution at serine 433 abolishes WNK4 binding.
    - reference: PMID:27727489
      reference_title: "Phosphorylation of KLHL3 at serine 433 impairs its interaction with the acidic motif of WNK4: a molecular dynamics study."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "phosphorylation of KLHL3 at serine 433, which is also a site frequently mutated in patients"
      explanation: Confirms that serine 433 is both the regulatory site and a recurrent patient mutation site.
  - name: S553L
    description: >-
      Homozygous allele in a consanguineous Jewish family of Yemenite origin,
      one of the few reported recessive KLHL3 genotypes outside the original
      series. Its biochemistry has not been characterised.
    evidence:
    - reference: PMID:28511177
      reference_title: "Familial Hyperkalemia and Hypertension (FHHt) and KLHL3: Description of a Family with a New Recessive Mutation (S553L) Compared to a Family with a Dominant Mutation, Q309R, with Analysis of Urinary Sodium Chloride Cotransporter."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This consanguineous Jewish family of Yemenite extraction, included 2 homozygous and 7 heterozygous affected subjects."
      explanation: Records the homozygous S553L genotype and the family it was found in.
  - name: Q309R
    description: >-
      Recurrent heterozygous Kelch-domain allele reported in dominant kindreds,
      including the family in which raised urinary exosomal NCC abundance was
      first shown, and one of the two families in which hypercalciuria was
      quantified.
    evidence:
    - reference: PMID:25925082
      reference_title: "Hypercalciuria in familial hyperkalemia and hypertension with KLHL3 mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Two new families with FHHt including a total number of 23 subjects, 10 of them affected, in whom previously described mutations in KLHL3 (Q309R and R528H) were identified."
      explanation: Q309R and R528H were the alleles in the two families studied for hypercalciuria.
    - reference: PMID:28511177
      reference_title: "Familial Hyperkalemia and Hypertension (FHHt) and KLHL3: Description of a Family with a New Recessive Mutation (S553L) Compared to a Family with a Dominant Mutation, Q309R, with Analysis of Urinary Sodium Chloride Cotransporter."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Increased urinary NCC was found in the affected members of the family with dominant Q309R KLHL3 mutation."
      explanation: Q309R carriers showed the raised urinary cotransporter abundance the mechanism predicts.
pathophysiology:
- name: Dominant-Negative Poisoning of KLHL3 Dimers
  description: >-
    Heterozygous KLHL3 missense alleles in the Kelch propeller and BTB domains
    do not merely halve adaptor dose. KLHL3 dimerizes, so a mutant subunit
    disables the heterodimer it joins and only wild-type homodimers remain
    functional. The genetic evidence is an asymmetry in mice: heterozygotes for
    a KLHL3 null allele are unaffected and accumulate no renal WNK, whereas
    heterozygous human missense carriers and heterozygous R528H knock-in mice
    have the full phenotype.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: KLHL3
    term:
      id: hgnc:6354
      label: KLHL3
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: DOMINANT_NEGATIVE
  downstream:
  - target: Loss of KLHL3 Substrate Adaptor Function
    causal_link_type: DIRECT
    description: >-
      Poisoned heterodimers leave the CUL3-KLHL3 complex unable to present its
      WNK substrates, the same end state as biallelic loss.
    evidence:
    - reference: PMID:28052936
      reference_title: "KLHL3 Knockout Mice Reveal the Physiological Role of KLHL3 and the Pathophysiology of Pseudohypoaldosteronism Type II Caused by Mutant KLHL3."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We further demonstrated that the dimerization of KLHL3 can explain this dominant negative effect."
      explanation: Links dimerization to the dominant-negative behaviour of mutant KLHL3.
  evidence:
  - reference: PMID:28052936
    reference_title: "KLHL3 Knockout Mice Reveal the Physiological Role of KLHL3 and the Pathophysiology of Pseudohypoaldosteronism Type II Caused by Mutant KLHL3."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This clearly demonstrates that the heterozygous deletion of KLHL3 was not sufficient to cause PHAII, indicating that autosomal dominant type PHAII is caused by the dominant negative effect of mutant KLHL3."

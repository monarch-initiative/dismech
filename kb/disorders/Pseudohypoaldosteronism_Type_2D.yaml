diagnosis:
- name: Biochemical and hormonal profile
  description: >-
    Hyperkalemia with a normal glomerular filtration rate, hyperchloremia,
    metabolic acidosis and suppressed plasma renin, with an aldosterone that is
    low relative to the potassium level, establishes the clinical diagnosis.
    Hypertension supports it but is not required.
  measurements:
  - preferred_term: potassium, serum or plasma
    term:
      id: LOINC:2823-3
      label: Potassium [Moles/volume] in Serum or Plasma
  - preferred_term: chloride, serum or plasma
    term:
      id: LOINC:2075-0
      label: Chloride [Moles/volume] in Serum or Plasma
  - preferred_term: bicarbonate, serum or plasma
    term:
      id: LOINC:1963-8
      label: Bicarbonate [Moles/volume] in Serum or Plasma
  evidence:
  - reference: PMID:22073419
    reference_title: "Pseudohypoaldosteronism Type II."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "With hyperkalemia (in the setting of normal glomerular filtration), hypertension, metabolic acidosis, hyperchloremia, and suppressed plasma renin levels; AND/OR"
    explanation: The GeneReviews clinical diagnostic criteria for pseudohypoaldosteronism type II.
  - reference: PMID:42057493
    reference_title: "Challenges in the Diagnosis and Management of a Paediatric Patient With Normotensive Pseudohypoaldosteronism Type IID."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although this trial improved biochemical markers, it was discontinued once suppressed renin and aldosterone levels pointed toward PHA2."
    explanation: The hormonal profile redirected this case from mineralocorticoid deficiency to pseudohypoaldosteronism type 2.
- name: Molecular genetic testing of the familial hyperkalemic hypertension genes
  description: >-
    Sequencing of KLHL3, CUL3, WNK1 and WNK4 assigns the subtype. KLHL3 is the
    only one of the four in which a biallelic result is diagnostic as well as a
    heterozygous one, so zygosity has to be reported and interpreted rather than
    the variant alone.
  diagnosis_term:
    preferred_term: Genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:22073419
    reference_title: "Pseudohypoaldosteronism Type II."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "By the identification of a heterozygous pathogenic variant in CUL3, WNK1, or WNK4 or a heterozygous pathogenic variant or biallelic pathogenic variants in KLHL3."
    explanation: States the molecular diagnostic criterion, and that KLHL3 admits both zygosities.
  - reference: PMID:41982973
    reference_title: "Clinical and molecular characteristics of a series of Chinese children with pseudohypoaldosteronism: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "three with PHAII (heterozygous KLHL3 or CUL3 mutations) exhibiting hyperkalemia and acidosis that were responsive to thiazides"
    explanation: Genetic testing assigned the subtype in a mixed pseudohypoaldosteronism series including KLHL3 patients.
- name: Urinary exosomal NCC abundance
  description: >-
    A research measurement rather than a clinical test. Urinary exosomal NCC is
    raised in affected KLHL3 carriers, which demonstrates the mechanism in
    patients rather than only in models. Heterozygous relatives in a recessive
    family also showed a rise without a clinical phenotype, so the measurement
    does not separate carriers from patients.
  evidence:
  - reference: PMID:28511177
    reference_title: "Familial Hyperkalemia and Hypertension (FHHt) and KLHL3: Description of a Family with a New Recessive Mutation (S553L) Compared to a Family with a Dominant Mutation, Q309R, with Analysis of Urinary Sodium Chloride Cotransporter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Increased urinary NCC was found in affected members (heterozygous) with dominant KLHL3 Q309R, and in affected members (homozygous) of the recessive form."
    explanation: Urinary cotransporter abundance is raised in affected carriers of both dominant and recessive KLHL3 genotypes.
  - reference: PMID:28511177
    reference_title: "Familial Hyperkalemia and Hypertension (FHHt) and KLHL3: Description of a Family with a New Recessive Mutation (S553L) Compared to a Family with a Dominant Mutation, Q309R, with Analysis of Urinary Sodium Chloride Cotransporter."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unexpectedly, in the recessive disease, heterozygotes seemed to have increased urinary NCC as well, apparently not sufficient quantitatively to produce a clinical phenotype."
    explanation: Unaffected heterozygotes also showed raised urinary cotransporter abundance, limiting the measurement's diagnostic value.
treatments:
- name: Thiazide diuretic therapy
  description: >-
    Thiazides inhibit NCC, the transporter the disease makes overactive, so this
    is mechanism-directed therapy rather than symptomatic treatment, and it
    corrects the hyperkalemia, the acidosis and the hypertension together.
    Dosing needs individual titration: a normotensive child given 0.5 mg/kg/day
    of hydrochlorothiazide developed symptomatic hypotension and was stabilised
    on 0.25 mg/kg on alternate days. Chronic use carries class side effects and
    provokes compensatory adaptation in the nephron, which is what motivates
    work on direct inhibitors of the cascade upstream.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: hydrochlorothiazide
      term:
        id: CHEBI:5778
        label: hydrochlorothiazide
  target_mechanisms:
  - target: NCC Hyperphosphorylation in the Distal Convoluted Tubule
    description: >-
      Thiazides block the sodium chloride cotransporter that the WNK, SPAK and
      OSR1 cascade has activated, acting on the proximate cause of the salt
      retention.
    evidence:
    - reference: PMID:22266938
      reference_title: "Mutations in kelch-like 3 and cullin 3 cause hypertension and electrolyte abnormalities."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "virtually all patients with KLHL3 and CUL3 mutations have been treated with thiazide diuretics, inhibitors of the Na-Cl cotransporter NCC, with correction of phenotypic abnormalities"
      explanation: Names the cotransporter as the thiazide target and reports correction of the phenotype in KLHL3 patients.
  evidence:
  - reference: PMID:22073419
    reference_title: "Pseudohypoaldosteronism Type II."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Electrolyte and blood pressure abnormalities of PHAII in children and adults are often corrected with thiazide diuretics."
    explanation: GeneReviews states the first-line treatment and what it corrects.
  - reference: PMID:42057493
    reference_title: "Challenges in the Diagnosis and Management of a Paediatric Patient With Normotensive Pseudohypoaldosteronism Type IID."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The dosage was ultimately titrated to an alternate-day, low-dose regimen (0.25 mg/kg), which successfully maintained metabolic stability while minimizing adverse effects."
    explanation: Records the reduced, alternate-day regimen needed in a normotensive PHA2D patient.
  - reference: PMID:41982973
    reference_title: "Clinical and molecular characteristics of a series of Chinese children with pseudohypoaldosteronism: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Management was tailored to the subtype, including aggressive salt supplementation for systemic PHAI and thiazide diuretics for PHAII."
    explanation: Thiazide diuretics were the treatment used for the KLHL3 and CUL3 patients in this series.
  - reference: PMID:32724175
    reference_title: "WNK-SPAK/OSR1-NCC kinase signaling pathway as a novel target for the treatment of salt-sensitive hypertension."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Thiazide diuretics are currently the main treatment option for Gordon's syndrome. However, they have a number of side effects, and chronic usage can lead to compensatory adaptations in the nephron that counteract their action."
    explanation: Records the limitations of chronic thiazide therapy that motivate work on upstream inhibitors.
- name: Dietary sodium and potassium restriction
  description: >-
    Because the disease is salt dependent, restricting dietary salt treats the
    hypertension and restricting potassium treats the hyperkalemia. GeneReviews
    frames the converse as a circumstance to avoid: untreated patients should not
    take excessive salt or potassium.
  action_category: THERAPEUTIC
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Increased Distal Nephron Sodium Chloride Reabsorption
    description: >-
      Reducing the sodium chloride load limits what the overactive cotransporter
      can retain.
  evidence:
  - reference: PMID:22073419
    reference_title: "Pseudohypoaldosteronism Type II."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Untreated individuals with PHAII should avoid excessive intake of foods high in salt and potassium as these may exacerbate hypertension and hyperkalemia."
    explanation: GeneReviews names salt and potassium excess as circumstances to avoid.
  - reference: PMID:24266877
    reference_title: "Detection of mutations in KLHL3 and CUL3 in families with FHHt (familial hyperkalaemic hypertension or Gordon's syndrome)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "is a salt-dependent form of hypertension caused by mutations in the regulators of the thiazide-sensitive Na+-Cl- co-transporter NCC ... and is effectively treated by thiazide diuretics and/or dietary salt restriction"
    explanation: States that dietary salt restriction is effective treatment; quoted from this paper's framing of the disease rather than from its own genetic results.
- name: Blood pressure and electrolyte surveillance
  description: >-
    Routine electrolyte and blood pressure measurement, with blood pressure
    control pursued for its own sake because of the cardiovascular, renal and
    cerebrovascular risk the hypertension carries. Pregnancy needs separate
    handling, since thiazides have been associated with adverse fetal outcome,
    particularly in the first trimester.
  action_category: MONITORING
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:22073419
    reference_title: "Pseudohypoaldosteronism Type II."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Control of blood pressure is important to reduce the risk of cardiovascular and renal disease and stroke."
    explanation: GeneReviews states the rationale for blood pressure control beyond electrolyte correction.
  - reference: PMID:22073419
    reference_title: "Pseudohypoaldosteronism Type II."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Some antihypertensive medications, including thiazide diuretics, have been associated with adverse fetal outcome, especially when taken during the first trimester of pregnancy; referral to an obstetrics group with expertise in high-risk pregnancies should be considered."
    explanation: Records the pregnancy caveat on the first-line drug.
- name: Testing of at-risk relatives
  description: >-
    Serum potassium and blood pressure measurement, or targeted testing for the
    familial variant, identifies affected relatives before complications
    develop. Zygosity governs who is at risk: in a recessive kindred
    heterozygous relatives are unaffected, while in a dominant kindred they are
    not.
  action_category: COUNSELING_INFORMATIONAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:22073419
    reference_title: "Pseudohypoaldosteronism Type II."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Measurement of serum potassium concentration and blood pressure or identification of the known familial CUL3, KLHL3, WNK1, and WNK4 pathogenic variant(s) in first-degree relatives of individuals with PHAII allows for early diagnosis and treatment"
    explanation: GeneReviews states the evaluation of relatives at risk.
  - reference: PMID:22266938
    reference_title: "Mutations in kelch-like 3 and cullin 3 cause hypertension and electrolyte abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In these kindreds, affected members are confined to siblings of index cases who inherited the same two mutations, while unaffected relatives inherited zero or one mutation"
    explanation: In recessive kindreds only biallelic relatives are affected, which determines who needs follow-up.
animal_models:
- name: KLHL3 R528H knock-in mouse
  species: Mouse
  genotype: Klhl3 R528H/+ (heterozygous knock-in)
  publication: PMID:24821705
  description: >-
    A heterozygous knock-in of the recurrent dominant human Kelch-domain allele.
    It reproduces salt-sensitive hypertension, hyperkalemia and metabolic
    acidosis with raised renal WNK1, WNK4 and phosphorylated NCC, so it models
    the dominant form of the human disease at the level of both mechanism and
    phenotype.
  modeled_mechanisms:
  - target: WNK1 and WNK4 Kinase Accumulation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Both WNK substrates accumulate in the kidney of the heterozygous knock-in,
      and the mutant protein binds neither.
    readouts:
    - name: Renal WNK1 and WNK4 protein abundance
      target: WNK1 and WNK4 Kinase Accumulation
      direction: INCREASED
      interpretation: Direct measurement of the accumulation this node asserts.
      evidence:
      - reference: PMID:24821705
        reference_title: "Impaired degradation of WNK1 and WNK4 kinases causes PHAII in mutant KLHL3 knock-in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Interestingly, the protein expression of both WNK1 and WNK4 was significantly increased in the KLHL3(R528H/+) mouse kidney, confirming that increases in these WNK kinases activated the WNK-OSR1/SPAK-NCC phosphorylation cascade in KLHL3(R528H/+) knock-in mice."
        explanation: Reports the raised renal WNK1 and WNK4 protein levels.
    evidence:
    - reference: PMID:24821705
      reference_title: "Impaired degradation of WNK1 and WNK4 kinases causes PHAII in mutant KLHL3 knock-in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Thus, we found that increased protein expression levels of WNK1 and WNK4 kinases cause PHAII by KLHL3 R528H mutation due to impaired KLHL3-Cullin3-mediated ubiquitination."
      explanation: The authors attribute the model's phenotype to the WNK accumulation this node names.
  - target: NCC Hyperphosphorylation in the Distal Convoluted Tubule
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Renal cotransporter phosphorylation is increased, with the salt-sensitive
      hypertension, hyperkalemia and acidosis that follow from it.
    readouts:
    - name: Renal phosphorylated NCC abundance
      target: NCC Hyperphosphorylation in the Distal Convoluted Tubule
      direction: INCREASED
      interpretation: The phosphorylation state this node asserts, measured in the model kidney.
      evidence:
      - reference: PMID:24821705
        reference_title: "Impaired degradation of WNK1 and WNK4 kinases causes PHAII in mutant KLHL3 knock-in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Moreover, the phosphorylation of NCC was increased in the KLHL3(R528H/+) mouse kidney, indicating that the KLHL3(R528H/+) knock-in mouse is an ideal mouse model of PHAII."
        explanation: Reports increased renal cotransporter phosphorylation in the knock-in.
    limitations: >-
      The hypertension in the model is salt sensitive, that is, it needs a salt
      load to appear, whereas human carriers are hypertensive on an ordinary
      diet. One allele is modelled, so the recessive form and the
      allele-specific behaviour of S410L and the serine 433 substitutions are
      outside its scope.
    evidence:
    - reference: PMID:24821705
      reference_title: "Impaired degradation of WNK1 and WNK4 kinases causes PHAII in mutant KLHL3 knock-in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "KLHL3(R528H/+) knock-in mice exhibited salt-sensitive hypertension, hyperkalemia and metabolic acidosis."
      explanation: The model reproduces the three cardinal features of the human disease.
- name: KLHL3 knockout mouse
  species: Mouse
  genotype: Klhl3-/- and Klhl3+/- (beta-galactosidase reporter knockout)
  publication: PMID:28052936
  description: >-
    A null allele carrying a beta-galactosidase reporter, which separates the
    two human inheritance modes experimentally. Homozygous nulls have the
    pseudohypoaldosteronism type II phenotype with raised renal WNK1 and WNK4;
    heterozygous nulls have neither. That asymmetry is the evidence that the
    dominant human alleles are dominant negative rather than haploinsufficient,
    and the reporter also shows where KLHL3 is expressed outside the kidney
    without WNK accumulating there.
  modeled_mechanisms:
  - target: Loss of KLHL3 Substrate Adaptor Function
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Complete loss of the adaptor produces the disease phenotype, and the
      review literature reads the homozygous null as the closest available model
      of the recessive human form.
    limitations: >-
      A null allele is not a missense allele: it cannot reproduce the
      dominant-negative heterodimer poisoning the human dominant alleles act
      through, which is precisely why the heterozygote is unaffected. No mouse
      carrying a recessive human missense allele has been reported.
    evidence:
    - reference: PMID:28052936
      reference_title: "KLHL3 Knockout Mice Reveal the Physiological Role of KLHL3 and the Pathophysiology of Pseudohypoaldosteronism Type II Caused by Mutant KLHL3."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "KLHL3-/- mice also showed PHAII-like phenotypes, whereas KLHL3+/- mice did not."
      explanation: Complete adaptor loss gives the disease phenotype while a single null allele does not.
    - reference: PMID:39699086
      reference_title: "Familial Hyperkalemic Hypertension."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "the phenotype of constitutive global KLHL3−/− mice generated by the Uchida group(151) likely recapitulates the majority of recessive mutations"
      explanation: The review reads the homozygous null as standing in for the recessive human genotypes.
  - target: Dominant-Negative Poisoning of KLHL3 Dimers
    relationship: FAILS_TO_RECAPITULATE
    fidelity: UNKNOWN
    model_scale: ORGANISM
    description: >-
      The heterozygous null does not develop the disease, so this model does not
      reproduce the dominant human phenotype. That negative result is the
      argument for the dominant-negative mechanism rather than a shortcoming of
      the experiment.
    limitations: >-
      A deletion removes the subunit instead of substituting it, so there is no
      mutant protein available to poison a dimer. The model therefore bounds the
      mechanism from one side only and cannot demonstrate the poisoning
      directly.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The model's quantity is KLHL3 gene dose, halved by deletion. The node's
        quantity is the proportion of KLHL3 dimers carrying a mutant subunit,
        which a heterozygous missense allele raises while leaving gene dose
        intact. The two differ in the direction that matters here.
    evidence:
    - reference: PMID:28052936
      reference_title: "KLHL3 Knockout Mice Reveal the Physiological Role of KLHL3 and the Pathophysiology of Pseudohypoaldosteronism Type II Caused by Mutant KLHL3."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This clearly demonstrates that the heterozygous deletion of KLHL3 was not sufficient to cause PHAII, indicating that autosomal dominant type PHAII is caused by the dominant negative effect of mutant KLHL3."
      explanation: The heterozygous null's lack of phenotype is what establishes the dominant-negative reading.
differential_diagnoses:
- name: Pseudohypoaldosteronism type 2E
  disease_term:
    preferred_term: pseudohypoaldosteronism type 2E
    term:
      id: MONDO:0013782
      label: pseudohypoaldosteronism type 2E
  description: >-
    The CUL3 form, biochemically identical but the most severe of the four. It
    presents far earlier, with deeper hyperkalemia and acidosis, and its variants
    are dominant and largely de novo rather than inherited.
  distinguishing_features:
  - Much younger age at presentation, and 94 percent hypertensive by age 18 against 17 percent for dominant KLHL3
  - Dominant and predominantly de novo CUL3 variants, so often no family history
  - No recessive form, where KLHL3 has one
  evidence:
  - reference: PMID:22266938
    reference_title: "Mutations in kelch-like 3 and cullin 3 cause hypertension and electrolyte abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KLHL3 mutations are either recessive or dominant, whereas CUL3 mutations are dominant and predominantly de novo."
    explanation: Contrasts the inheritance of the KLHL3 and CUL3 forms.
  - reference: PMID:22266938
    reference_title: "Mutations in kelch-like 3 and cullin 3 cause hypertension and electrolyte abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "| CUL3 | 17 | 21 | 9 ±6 | 7.5 ±0.9 | 15.5 ±2.0 | 94 |"
    explanation: The CUL3 row of the genotype-stratified table, with a mean diagnosis age of 9 years and 94 percent hypertensive by age 18.
  - reference: PMID:41380172
    reference_title: "Diagnostic pitfalls in aldosterone defects: a 9-year follow-up of early-onset pseudohypoaldosteronism type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in WNK1, WNK4, KLHL3, and CUL3 have been identified, with CUL3 mutations particularly associated with early-onset and severe phenotypes."
    explanation: Confirms the early-onset, severe character of the CUL3 form relative to the others.
- name: Pseudohypoaldosteronism type 2B
  description: >-
    The WNK4 form. It shares the mechanism from the WNK accumulation step
    onwards, since its missense alleles block the same KLHL3 interaction from the
    substrate side, but it is milder than the KLHL3 form and has only a dominant
    mode. Its hypercalciuria is more marked.
  distinguishing_features:
  - Milder hyperkalemia and acidosis than the KLHL3 form
  - Dominant inheritance only
  - More severe hypercalciuria than in KLHL3 disease
  evidence:
  - reference: PMID:22266938
    reference_title: "Mutations in kelch-like 3 and cullin 3 cause hypertension and electrolyte abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the other mutant loci, there remain significant differences in disease severity (rank order recessive KLHL3 > dominant KLHL3 > WNK4 > WNK1)."
    explanation: Places the WNK4 form below both KLHL3 forms in severity.
  - reference: PMID:25925082
    reference_title: "Hypercalciuria in familial hyperkalemia and hypertension with KLHL3 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypercalciuria in FHHt with KLHL3 mutations is less severe than that observed in FHHt with the Q565E WNK4 mutation"
    explanation: Quantifies the difference in hypercalciuria between the KLHL3 and WNK4 forms.
  - reference: PMID:37285722
    reference_title: "Identification of a novel KLHL3-interacting motif in the C-terminal region of WNK4."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This may be one of the reasons why PHAII is less severe when WNK4 is mutated compared to KLHL3 is mutated."
    explanation: Offers a molecular reason, a second KLHL3-binding motif in WNK4, for the milder WNK4 phenotype.
- name: Pseudohypoaldosteronism type 2A
  description: >-
    The WNK1 form, the mildest of the four, with the latest mean age at
    diagnosis and the least deranged potassium and bicarbonate.
  distinguishing_features:
  - Mildest biochemistry of the four genes and the latest presentation
  - Attributed to raised kidney-specific WNK1 rather than a coding change in an adaptor
  evidence:
  - reference: PMID:22266938
    reference_title: "Mutations in kelch-like 3 and cullin 3 cause hypertension and electrolyte abnormalities."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "| WNK1 | 2 | 23 | 36 ±20 | 5.8 ±0.8 | 22.4 ±4.6 | 13 |"
    explanation: The WNK1 row of the genotype-stratified table, with a mean potassium of 5.8 and bicarbonate of 22.4 mmol/L.
  - reference: PMID:35894282
    reference_title: "WNK1 in the kidney."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The high sensitivity of KS-WNK1 to KLHL3-targeted degradation and the low levels of L-WNK1 in the DCT, led to propose that this type of FHHt is mainly due to increased KS-WNK1 protein in the DCT."
    explanation: The WNK1 form is attributed to raised kidney-specific WNK1, the isoform most sensitive to KLHL3-directed degradation.
- name: Calcineurin inhibitor nephrotoxicity
  description: >-
    Tacrolimus and ciclosporin produce an acquired phenocopy. Calcineurin is the
    phosphatase that removes the KLHL3 serine 433 phosphate, so inhibiting it
    locks the adaptor in its non-binding state and reproduces the whole cascade.
    Hypertension and hyperkalemia are common adverse effects of these drugs for
    this reason.
  distinguishing_features:
  - Temporal relation to starting a calcineurin inhibitor, and no family history
  - Reversible on withdrawal or dose reduction, where the genetic disease is not
  evidence:
  - reference: PMID:30718414
    reference_title: "Calcineurin dephosphorylates Kelch-like 3, reversing phosphorylation by angiotensin II and regulating renal electrolyte handling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The renal effects of CNIs mimic the hypertension and hyperkalemia that result from germ-line mutations in with-no-lysine (WNK) kinases and the Kelch-like 3 (KLHL3)-CUL3 ubiquitin ligase complex."
    explanation: States that calcineurin inhibitors mimic the genetic disease, which this paper then traces to the shared serine 433 node.
  - reference: PMID:30718414
    reference_title: "Calcineurin dephosphorylates Kelch-like 3, reversing phosphorylation by angiotensin II and regulating renal electrolyte handling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Moreover, tacrolimus attenuates KLHL3-mediated WNK4 ubiquitylation and degradation, while this effect is absent in KLHL3 with S433A substitution."
    explanation: The drug effect requires serine 433, the residue the S433G and S433N disease alleles occupy.
- name: Hyperkalemic renal tubular acidosis from aldosterone deficiency or resistance
  description: >-
    Hyperkalemic distal renal tubular acidosis from true hypoaldosteronism or
    from mineralocorticoid resistance gives a similar potassium and acid-base
    picture. Renin and aldosterone separate them: both are raised in the
    salt-wasting pseudohypoaldosteronism type 1 disorders and in aldosterone
    deficiency, and both are suppressed here. A response to fludrocortisone can
    mislead, since it improved the biochemistry of a PHA2D patient being treated
    for presumed mineralocorticoid deficiency.
  distinguishing_features:
  - Suppressed renin and aldosterone, where salt-wasting and aldosterone-deficient states have both raised
  - Volume expansion with hypertension, rather than salt wasting with hypovolemia and hyponatremia
  - Sustained correction by a thiazide, which addresses the overactive cotransporter
  evidence:
  - reference: PMID:42057493
    reference_title: "Challenges in the Diagnosis and Management of a Paediatric Patient With Normotensive Pseudohypoaldosteronism Type IID."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to an initial clinical suspicion of isolated mineralocorticoid deficiency, a diagnostic trial of fludrocortisone was initiated while awaiting definitive results."
    explanation: Mineralocorticoid deficiency was the initial working diagnosis in a patient with PHA2D.
  - reference: PMID:41982973
    reference_title: "Clinical and molecular characteristics of a series of Chinese children with pseudohypoaldosteronism: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pseudohypoaldosteronism (PHA) is a rare disorder characterized by renal resistance to mineralocorticoids, leading to hyperkalemia, hyponatremia, and metabolic acidosis."
    explanation: The pseudohypoaldosteronism type 1 disorders share the hyperkalemia and acidosis but add the hyponatremia of salt wasting.
  - reference: PMID:41380172
    reference_title: "Diagnostic pitfalls in aldosterone defects: a 9-year follow-up of early-onset pseudohypoaldosteronism type 2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Aldosterone pathway defects may be misdiagnosed during the initial clinical assessment."
    explanation: Records that aldosterone pathway defects and pseudohypoaldosteronism type 2 are confused on first assessment.
- name: Gordon syndrome (distal arthrogryposis type 3)
  description: >-
    A name collision rather than a clinical differential. The eponym Gordon
    syndrome is used both for this renal syndrome and for distal arthrogryposis
    type 3, a musculoskeletal disorder with joint contractures and cleft palate
    that is curated separately in this knowledge base as
    `kb/disorders/Gordon_Syndrome.yaml`. The two share no mechanism and no
    overlapping presentation; the hazard is a literature or ontology search
    returning one for the other.
  distinguishing_features:
  - Congenital joint contractures and cleft palate, with no electrolyte abnormality
  - Not caused by any of the four familial hyperkalemic hypertension genes
  evidence:
  - reference: PMID:24266877
    reference_title: "Detection of mutations in KLHL3 and CUL3 in families with FHHt (familial hyperkalaemic hypertension or Gordon's syndrome)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "FHHt (familial hyperkalaemic hypertension; also known as Gordon's syndrome) is a salt-dependent form of hypertension"
    explanation: Documents that the renal syndrome carries the Gordon eponym, which is the source of the collision; quoted from the paper's framing rather than its results.
discussions:
- discussion_id: acidosis_mechanism_in_klhl3_disease
  kind: KNOWLEDGE_GAP
  prompt: >-
    What mechanism produces the metabolic acidosis in KLHL3-related
    pseudohypoaldosteronism type 2, and is it the same mechanism as in the WNK4
    form?
  attaches_to:
  - pathophysiology#Hyperkalemia-Driven Impairment of Renal Ammonium Excretion
  rationale: >-
    Two incompatible accounts exist and neither was obtained in a KLHL3
    genotype. The constitutively active SPAK mouse, which isolates cotransporter
    hyperactivation, makes the acidosis secondary to hyperkalemia through
    proximal tubule ammonia generation and collecting duct ammonia transport,
    and that is the chain this entry encodes. The WNK4 Q562E mouse instead
    attributes it to excessive collecting duct bicarbonate secretion through
    pendrin, with normal proton secretion and ammonium excretion. A cohort of 18
    human WNK4 Q565E patients had renal ammonium excretion no lower than
    unaffected subjects, which fits neither mouse cleanly. Whether the KLHL3 form
    follows either account is untested.
  proposed_experiments:
  - experiment_id: klhl3_acid_base_ammonia_handling
    name: Acid-base and ammonia handling in KLHL3 R528H knock-in and KLHL3 null mice
    description: >-
      Measure urinary ammonium excretion, urine pH under an acid load, proximal
      tubule ammoniagenic enzyme expression and collecting duct Rhcg abundance in
      Klhl3 R528H/+ and Klhl3 null mice, before and after thiazide correction of
      the hyperkalemia, and test whether pendrin deletion corrects the acidosis
      as it does in the WNK4 model.
    would_support:
    - pathophysiology#Hyperkalemia-Driven Impairment of Renal Ammonium Excretion
    supporting_outcome:
    - Reduced urinary ammonium excretion with reduced proximal ammoniagenic enzyme expression that normalises when a thiazide corrects the potassium
    - No correction of the acidosis by pendrin deletion in a KLHL3 genotype
    refuting_outcome:
    - Normal ammonium excretion with correction of the acidosis by pendrin deletion, which would place the KLHL3 form with the WNK4 bicarbonate secretion account instead
    readouts:
    - name: Urinary ammonium excretion
      target: pathophysiology#Hyperkalemia-Driven Impairment of Renal Ammonium Excretion
      direction: DECREASED
      interpretation: >-
        The quantity the encoded mechanism predicts will fall, and the one the
        human WNK4 cohort did not show falling.
- discussion_id: hypercalciuria_mechanism_in_klhl3_disease
  kind: KNOWLEDGE_GAP
  prompt: >-
    By what mechanism does hypercalciuria arise in KLHL3-related
    pseudohypoaldosteronism type 2?
  attaches_to:
  - phenotypes#Hypercalciuria
  rationale: >-
    Hypercalciuria is established as a feature of KLHL3-mutant families and is
    milder than in the WNK4 Q565E form, but the only mechanistic work is in the
    WNK4 D561A mouse, where reduced paracellular calcium reabsorption in the
    thick ascending limb was implicated and TRPV6 and calbindin rose as an
    apparent compensation. Nothing of the kind has been measured in a KLHL3
    genotype, and the milder human phenotype suggests the two may not share a
    mechanism. The phenotype is therefore left unconnected in the pathograph
    rather than attached to the cotransporter node by inference.
  proposed_experiments:
  - experiment_id: klhl3_renal_calcium_handling
    name: Renal calcium handling in KLHL3 R528H knock-in mice
    description: >-
      Measure urinary calcium excretion, the furosemide-induced calciuric
      response as a probe of thick ascending limb paracellular transport, and
      TRPV5, TRPV6 and calbindin abundance in Klhl3 R528H/+ mice, for direct
      comparison with the published WNK4 D561A data.
    would_support:
    - phenotypes#Hypercalciuria
    supporting_outcome:
    - Raised urinary calcium with a blunted furosemide calciuric response, matching the thick ascending limb account from the WNK4 model
    refuting_outcome:
    - Raised urinary calcium with a normal furosemide response, which would place the defect distally and separate the KLHL3 mechanism from the WNK4 one
- discussion_id: recessive_missense_versus_null
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does a recessive KLHL3 missense allele behave like a null allele in vivo?
  attaches_to:
  - pathophysiology#Loss of KLHL3 Substrate Adaptor Function
  - genetic#KLHL3
  rationale: >-
    The recessive human genotypes include missense alleles such as S410L, which
    destabilises the protein as well as weakening WNK4 binding, and S553L, whose
    biochemistry has not been characterised. The only in vivo model of the
    recessive form is a complete gene deletion, which the review literature
    takes as standing in for the recessive alleles. That substitution is
    untested, and it matters for the severity ranking: recessive KLHL3 disease is
    the most severe of the four genes after CUL3, which a pure null would be
    expected to explain but a partially functional missense allele would not.
  proposed_experiments:
  - experiment_id: recessive_klhl3_missense_knockins
    name: Knock-in mice carrying recessive human KLHL3 missense alleles
    description: >-
      Generate homozygous Klhl3 S410L and S553L knock-in mice and compare renal
      WNK1, WNK4, phosphorylated SPAK and phosphorylated NCC abundance, blood
      pressure and electrolytes against Klhl3 null and wild-type littermates.
    would_support:
    - pathophysiology#Loss of KLHL3 Substrate Adaptor Function
    supporting_outcome:
    - Homozygous missense knock-ins phenocopy the null for WNK accumulation and electrolytes, which would justify using the null as a model of recessive disease
    refuting_outcome:
    - A milder or qualitatively different phenotype in the missense knock-ins, which would mean the published recessive model overstates the genotype it stands for
- discussion_id: upstream_cascade_inhibitors
  kind: OPEN_QUESTION
  prompt: >-
    Would a direct WNK or SPAK/OSR1 inhibitor treat this disease better than a
    thiazide?
  attaches_to:
  - pathophysiology#SPAK and OSR1 Hyperactivation
  - treatments#Thiazide diuretic therapy
  rationale: >-
    Thiazides work and are the standard of care, but chronic use carries class
    side effects and provokes compensatory nephron adaptation that offsets the
    drug. The epistasis experiments make an unusually specific prediction about
    the alternative: in the WNK4 D561A mouse, removing SPAK alone abolished the
    phenotype while removing OSR1 in the kidney tubule did not, so a
    SPAK-selective inhibitor would be expected to work and an OSR1-selective one
    would not. Molecular inhibitors of the pathway are under development, but
    none has been tested in a KLHL3 genotype or in patients with this disease.
  proposed_experiments:
  - experiment_id: spak_inhibitor_in_klhl3_knockin
    name: SPAK-selective inhibition in KLHL3 R528H knock-in mice
    description: >-
      Give a SPAK-selective inhibitor and, in parallel, a thiazide to Klhl3
      R528H/+ mice on a normal and a high-salt diet, and compare blood pressure,
      serum potassium and bicarbonate, phosphorylated NCC abundance, and the
      compensatory nephron remodelling that chronic thiazide treatment induces.
    would_support:
    - pathophysiology#SPAK and OSR1 Hyperactivation
    supporting_outcome:
    - Correction of blood pressure, potassium and bicarbonate at least equal to the thiazide arm, with lower phosphorylated NCC and without the compensatory remodelling the thiazide arm shows
    refuting_outcome:
    - No improvement in the electrolyte or blood pressure abnormalities, which would mean SPAK inhibition does not reach the cascade in a KLHL3 genotype even though Spak deletion rescues the WNK4 one

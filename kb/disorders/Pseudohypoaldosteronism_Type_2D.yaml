- name: KLHL3 Serine 433 Phosphorylation Blocking WNK Binding
  description: >-
    Phosphorylation of KLHL3 at serine 433, inside the Kelch domain, prevents
    WNK4 from binding and so prevents its degradation. This is the physiological
    switch by which angiotensin II, dietary potassium restriction, insulin and
    vasopressin signalling raise WNK levels, and calcineurin reverses it. The
    disease alleles S433G and S433N occupy that residue, so PHA2D includes a
    genetic lock of a normally regulated switch. The same node explains why
    calcineurin inhibitors produce an acquired phenocopy.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: KLHL3
    term:
      id: hgnc:6354
      label: KLHL3
  biological_processes:
  - preferred_term: KLHL3 serine 433 phosphorylation
    modifier: INCREASED
    term:
      id: GO:0006468
      label: protein phosphorylation
  downstream:
  - target: Loss of KLHL3 Substrate Adaptor Function
    causal_link_type: DIRECT
    description: >-
      Serine 433 phosphorylation, or its genetic mimicry, abolishes substrate
      binding without changing adaptor abundance.

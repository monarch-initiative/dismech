      This is a phase 3, multicenter, prospective, randomized study of
      intravenous (IV) ceftolozane/tazobactam versus IV meropenem in the
      treatment of adult participants with either ventilator-associated
      bacterial pneumonia (VABP) or ventilated hospital-acquired bacterial

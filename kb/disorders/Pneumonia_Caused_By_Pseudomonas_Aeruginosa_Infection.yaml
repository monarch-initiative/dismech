treatments:
- name: Susceptibility-guided antipseudomonal beta-lactam therapy
  description: >-
    Ventilated hospital-acquired or ventilator-associated P. aeruginosa
    pneumonia is treated with an antipseudomonal antibiotic regimen guided by
    isolate susceptibility, local resistance, severity, and renal function; the
    ASPECT-NP trial compared ceftolozane/tazobactam with meropenem in a
    Gram-negative HAP/VAP population that included P. aeruginosa.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:

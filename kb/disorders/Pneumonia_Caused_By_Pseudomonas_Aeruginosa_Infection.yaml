progression:
- phase: Acute ventilator-associated pneumonia
  notes: >-
    Acute lower-airway P. aeruginosa infection in a ventilated or impaired
    airway drives flagellin- and T3SS-mediated neutrophilic pneumonia that can
    progress to alveolar-capillary barrier failure, respiratory failure, and
    sepsis.
  evidence:
  - reference: PMID:35022730
    reference_title: >-
      Clinical and microbiological outcomes, by causative pathogen, in the
      ASPECT-NP randomized, controlled, Phase 3 trial comparing
      ceftolozane/tazobactam and meropenem for treatment of
      hospital-acquired/ventilator-associated bacterial pneumonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      purulent tracheal secretions with ≥1 other clinical criterion
    explanation: >-
      Defines the acute ventilated-pneumonia presentation in the trial
      population.
- phase: Chronic mucoid airway infection
  notes: >-
    In structurally abnormal airways (cystic fibrosis, bronchiectasis),
    P. aeruginosa converts to a mucoid alginate-overproducing phenotype and
    establishes a relapsing, phagocytosis-resistant chronic airway infection.
  evidence:
  - reference: PMID:37009499
    reference_title: >-
      Mechanism of resistance to phagocytosis and pulmonary persistence in
      mucoid Pseudomonas aeruginosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      During chronic colonization of the airway and biofilm formation,
      P. aeruginosa converts to a mucoid phenotype
    explanation: >-
      Describes the chronic mucoid-conversion phase of P. aeruginosa airway
      infection.

clinical_trials:
- name: NCT02070757
  phase: PHASE_III
  status: COMPLETED
  description: >-
    ASPECT-NP: a Phase 3 randomized, double-blind trial comparing intravenous
    ceftolozane/tazobactam with meropenem in adults with ventilated
    hospital-acquired or ventilator-associated bacterial pneumonia.
  evidence:
  - reference: clinicaltrials:NCT02070757
    reference_title: "A Prospective, Randomized, Double-Blind, Multicenter, Phase 3 Study to Assess the Safety and Efficacy of Intravenous Ceftolozane/Tazobactam Compared With Meropenem in Adult Patients With Ventilated Nosocomial Pneumonia"
    supports: SUPPORT

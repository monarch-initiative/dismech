transmission:
- name: Hospital lower-airway acquisition
  description: >-
    P. aeruginosa pneumonia is commonly acquired when hospital or ICU
    exposures place the organism into an intubated or impaired lower airway,
    especially after mechanical ventilation, reintubation, prolonged ICU care,
    or prior antibiotic selection for resistant strains.
  evidence:
  - reference: PMID:42592972
    reference_title: >-
      Risk factors and microbiological profile of ventilator-associated
      pneumonia in a tertiary-care intensive care unit in Tuzla: a prospective
      observational study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Reintubation, elevated CRP, leukocytosis, hypercapnia, and prolonged
      mechanical ventilation were associated with VAP.
    explanation: >-
      Links invasive airway support and its duration to ventilator-associated
      pneumonia, the major clinical context for Pseudomonas lower-respiratory
      infection.
  - reference: PMID:41826861
    reference_title: >-
      Prevalence and phenotypic characterization of carbapenem resistance in
      multidrug-resistant Gram-negative bacteria across selected healthcare
      facilities in the United Arab Emirates: a retrospective study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Hospitals were the primary source of MDR-CR isolates
    explanation: >-
      Supports the hospital reservoir for multidrug-resistant
      carbapenem-resistant P. aeruginosa and other Gram-negative isolates.

environmental:
- name: Mechanical ventilation and ICU airway instrumentation
  description: >-
    Endotracheal intubation, repeated airway manipulation, impaired
    mucociliary clearance, and prolonged ventilation create a hospital
    lower-airway exposure niche in which P. aeruginosa can reach the distal
    respiratory tract.
  influences_mechanisms:
  - target: Lower-Airway Pseudomonas Infection
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Ventilation and airway instrumentation bypass upper-airway defenses and
      permit P. aeruginosa to seed the tracheobronchial tree and alveolar
      compartment.
  evidence:
  - reference: PMID:42592972
    reference_title: >-
      Risk factors and microbiological profile of ventilator-associated
      pneumonia in a tertiary-care intensive care unit in Tuzla: a prospective
      observational study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Reintubation, elevated CRP, leukocytosis, hypercapnia, and prolonged
      mechanical ventilation were associated with VAP.
    explanation: >-
      Supports mechanical ventilation and reintubation as acquisition contexts
      for ventilator-associated pneumonia.

pathophysiology:
- name: Lower-Airway Pseudomonas Infection
  role: trigger
  biological_scale: TISSUE
  description: >-
    P. aeruginosa enters the distal airway or ventilated alveolar compartment
    and establishes lower-respiratory infection, bringing flagellin, type III
    secretion injectisomes, and cytotoxic effector proteins into contact with
    alveolar epithelial and innate immune cells.
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  - preferred_term: alveolus of lung
    term:
      id: UBERON:0002299
      label: alveolus of lung
  downstream:
  - target: Airway Flagellin-TLR5 Signaling
    causal_link_type: DIRECT
    description: >-
      Flagellated bacilli are sensed by epithelial TLR5 when they contact the
      airway surface.
  - target: Type III Secretion Cytotoxicity
    causal_link_type: DIRECT
    description: >-
      Bacterial contact permits the type III secretion apparatus to inject
      Exo-family cytotoxic effectors into host cells.
  - target: NLRC4 Inflammasome IL-1 Beta Release
    causal_link_type: DIRECT
    description: >-
      Alveolar macrophages sense the type III secretion apparatus and activate
      an NLRC4 inflammasome response.
  evidence:
  - reference: PMID:35022730
    reference_title: >-
      Clinical and microbiological outcomes, by causative pathogen, in the
      ASPECT-NP randomized, controlled, Phase 3 trial comparing
      ceftolozane/tazobactam and meropenem for treatment of
      hospital-acquired/ventilator-associated bacterial pneumonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Baseline LRT pathogens included Klebsiella pneumoniae (34.6%),
      Pseudomonas aeruginosa (25.0%) and Escherichia coli (18.2%).
    explanation: >-
      Supports the lower respiratory tract as the infected site in
      P. aeruginosa hospital-acquired and ventilator-associated pneumonia.
- name: Airway Flagellin-TLR5 Signaling
  biological_scale: CELLULAR
  description: >-
    Airway epithelial cells recognize P. aeruginosa flagellin through TLR5,
    initiating NF-kB-linked inflammatory signaling that helps launch the
    neutrophilic response to lower-airway infection.
  cell_types:
  - preferred_term: epithelial cell
    term:
      id: CL:0000066
      label: epithelial cell
  biological_processes:
  - preferred_term: toll-like receptor signaling pathway
    modifier: INCREASED
    term:
      id: GO:0002224
      label: toll-like receptor signaling pathway
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Neutrophilic Alveolar-Capillary Injury
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Flagellin sensing induces epithelial inflammatory mediators that converge
      with T3SS and inflammasome signals to recruit neutrophils.
  evidence:
  - reference: PMID:16239509
    reference_title: >-
      Human airway epithelial cells sense Pseudomonas aeruginosa infection via
      recognition of flagellin by Toll-like receptor 5.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      airway epithelial receptor TLR5 senses P. aeruginosa through its
      flagellin protein
    explanation: >-
      Shows that human airway epithelial cells use TLR5 to detect
      P. aeruginosa flagellin.
- name: Type III Secretion Cytotoxicity
  biological_scale: CELLULAR
  description: >-
    The P. aeruginosa type III secretion system injects ExoU, ExoS, ExoT, and
    ExoY effector proteins into contacted epithelial and innate immune cells,
    producing a cytotoxic acute-lung-injury phenotype.
  cell_types:
  - preferred_term: pulmonary alveolar type 2 cell
    term:
      id: CL:0002063
      label: pulmonary alveolar type 2 cell
  downstream:
  - target: NLRC4 Inflammasome IL-1 Beta Release
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The type III secretion apparatus can be sensed by macrophages and
      activate an NLRC4 inflammasome response.
  - target: Neutrophilic Alveolar-Capillary Injury
    causal_link_type: DIRECT
    description: >-
      T3SS-competent organisms directly worsen epithelial cytotoxicity, alveolar
      permeability, bacterial clearance, and mortality in acute lung injury.
  evidence:
  - reference: PMID:15972518
    reference_title: >-
      Alveolar response to Pseudomonas aeruginosa: role of the type III
      secretion system.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      the CHA strain was associated with increased in vitro cytotoxicity on
      A549 cells, as assessed by the release of lactate dehydrogenase
    explanation: >-
      A functional type III secretion system (CHA strain) produced greater
      host-cell cytotoxicity than its isogenic exsA-null mutant, supporting
      T3SS-driven cytotoxicity.
- name: NLRC4 Inflammasome IL-1 Beta Release
  biological_scale: CELLULAR
  description: >-
    Alveolar macrophages exposed to T3SS-expressing P. aeruginosa activate the
    NLRC4 inflammasome and produce IL-1 beta, an inflammatory axis that can
    impair macrophage phagocytosis and intensify lung injury.
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  biological_processes:
  - preferred_term: interleukin-1 beta production
    modifier: INCREASED
    term:
      id: GO:0032611
      label: interleukin-1 beta production
  - preferred_term: phagocytosis
    modifier: DECREASED
    term:
      id: GO:0006909
      label: phagocytosis
  downstream:
  - target: Neutrophilic Alveolar-Capillary Injury
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Inflammasome-driven IL-1 beta release amplifies cytokine production,
      phagocytic failure, and pulmonary inflammatory damage.
  evidence:
  - reference: PMID:33489931
    reference_title: >-
      Adipose-Derived Mesenchymal Stem Cells Ameliorating Pseudomonas
      aeruginosa-induced Acute Lung Infection via Inhibition of NLRC4
      Inflammasome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      PA infection mainly activated Nod-like receptor containing a caspase
      activating and recruitment domain 4 (NLRC4) inflammasome
    explanation: >-
      Supports NLRC4 inflammasome activation in experimental acute
      P. aeruginosa lung infection.
- name: Mucoid Alginate Biofilm Immune Evasion
  biological_scale: CELLULAR
  description: >-
    In chronic airway infection, mucoid P. aeruginosa overproduces cell-surface
    alginate and grows as biofilm, physically interfering with opsonic and
    non-opsonic macrophage phagocytosis and helping the organism persist in
    cystic-fibrosis or bronchiectatic airways.
  biological_processes:
  - preferred_term: biofilm formation
    modifier: INCREASED
    term:
      id: GO:0042710
      label: biofilm formation
  - preferred_term: phagocytosis
    modifier: DECREASED
    term:
      id: GO:0006909
      label: phagocytosis
  downstream:
  - target: Chronic Pseudomonas Airway Persistence
    causal_link_type: DIRECT
    description: >-
      Alginate-mediated antiphagocytic biofilm growth promotes persistence
      after mucoid conversion in structurally abnormal airways.
  evidence:
  - reference: PMID:37009499
    reference_title: >-
      Mechanism of resistance to phagocytosis and pulmonary persistence in
      mucoid Pseudomonas aeruginosa.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: alginate production inhibited opsonic and non-opsonic phagocytosis
    explanation: >-
      Demonstrates that bacterial surface alginate blocks human and murine
      macrophage phagocytosis of mucoid P. aeruginosa.
- name: Chronic Pseudomonas Airway Persistence
  biological_scale: TISSUE
  description: >-
    Mucoid biofilm immune evasion allows P. aeruginosa to persist in airways
    with cystic-fibrosis or bronchiectatic mucus clearance defects, converting a
    hospital-style acute Gram-negative pneumonia mechanism into a relapsing
    chronic infection pattern.
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  downstream:
  - target: Neutrophilic Alveolar-Capillary Injury
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Persistent infection repeatedly exposes the airway to Pseudomonas
      ligands, cytotoxins, and neutrophilic inflammatory injury.
  evidence:
  - reference: PMID:37009499
    reference_title: >-
      Mechanism of resistance to phagocytosis and pulmonary persistence in
      mucoid Pseudomonas aeruginosa.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      During chronic colonization of the airway and biofilm formation,
      P. aeruginosa converts to a mucoid phenotype
    explanation: >-
      The study's introduction restates the established clinical natural
      history of chronic P. aeruginosa airway colonization, in which the
      organism converts to a mucoid phenotype.
- name: Neutrophilic Alveolar-Capillary Injury
  biological_scale: TISSUE
  description: >-
    Epithelial TLR5 signaling, macrophage NLRC4/IL-1 beta activation, and T3SS
    cytotoxicity converge on a neutrophilic inflammatory exudate that injures
    the alveolar-capillary barrier, causes protein-rich edema, and can progress
    to acute respiratory failure, sepsis, and death.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  locations:
  - preferred_term: alveolus of lung
    term:
      id: UBERON:0002299
      label: alveolus of lung
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Dyspnea
    causal_link_type: DIRECT
    description: >-
      Alveolar-capillary barrier failure and protein-rich edema impair gas
      exchange, producing dyspnea.
  - target: Acute respiratory distress syndrome
    causal_link_type: DIRECT
    description: >-
      Diffuse neutrophilic alveolar injury and permeability edema can progress
      to acute respiratory distress syndrome physiology.
  - target: Sepsis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Severe lower-respiratory injury with invasive infection can disseminate
      or drive a systemic inflammatory response, causing sepsis.
  evidence:
  - reference: PMID:15972518
    reference_title: >-
      Alveolar response to Pseudomonas aeruginosa: role of the type III
      secretion system.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      increased lung injury, as assessed by the wet/dry weight ratio for the
      lungs and the protein level in bronchoalveolar lavage fluid
    explanation: >-
      Supports edema and alveolar protein leak as readouts of T3SS-amplified
      acute lung injury in a P. aeruginosa pneumonia model.


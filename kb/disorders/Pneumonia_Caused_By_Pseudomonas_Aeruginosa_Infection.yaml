prevalence:
- population: Mechanically ventilated patients, Tuzla tertiary-care ICU
  measure_type: PERIOD_PREVALENCE
  notes: >-
    VAP occurred in 34.7% of mechanically ventilated patients in this cohort,
    with Gram-negative pathogens predominating and P. aeruginosa the
    second-ranked causative pathogen. This is overall VAP occurrence in the
    ventilated cohort, not P. aeruginosa-specific disease prevalence, so no
    disease-specific rate is asserted in the structured slots.
  evidence:
  - reference: PMID:42592972
    reference_title: >-
      Risk factors and microbiological profile of ventilator-associated
      pneumonia in a tertiary-care intensive care unit in Tuzla: a prospective
      observational study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: VAP was diagnosed in 41 patients (34.7%).
    explanation: >-
      Reports the proportion of mechanically ventilated patients who developed
      VAP in a cohort where P. aeruginosa was the second-ranked pathogen.

diagnosis:
- name: Lower-respiratory culture with antimicrobial susceptibility testing
  description: >-
    Pseudomonas pneumonia is confirmed by culturing lower-respiratory samples,
    such as endotracheal aspirate or bronchoalveolar lavage fluid, and testing
    antimicrobial susceptibility because MDR and carbapenem-resistant isolates
    are common in hospital-acquired disease.
  evidence:
  - reference: PMID:42801252
    reference_title: >-
      Common Organisms and Their Drug Resistance Patterns in Endotracheal
      Aspirate Samples of Patients With Ventilator-Associated Pneumonia: A
      Retrospective Observational Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Endotracheal aspirate samples were cultured, and antimicrobial
      susceptibility testing was performed
    explanation: >-
      Supports endotracheal aspirate culture followed by antimicrobial
      susceptibility testing in patients with ventilator-associated pneumonia.
  - reference: PMID:41826861
    reference_title: >-
      Prevalence and phenotypic characterization of carbapenem resistance in
      multidrug-resistant Gram-negative bacteria across selected healthcare
      facilities in the United Arab Emirates: a retrospective study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      period prevalence calculated within total isolates of each organism group
      was highest for MDR-CR Acinetobacter (22.8%), followed by MDR-CR P.
      aeruginosa (12.9%)
    explanation: >-
      Supports that multidrug-resistant, carbapenem-resistant P. aeruginosa
      isolates are common, motivating antimicrobial susceptibility testing; the
      figure is a resistance proportion among isolates, not disease prevalence.
- name: CRP and leukocyte inflammatory-marker support
  description: >-
    Elevated CRP and leukocytosis support the clinical diagnosis and risk
    assessment of ventilator-associated pneumonia but do not identify
    P. aeruginosa without microbiology.
  markers: C-reactive protein; leukocyte count
  evidence:
  - reference: PMID:42592972
    reference_title: >-
      Risk factors and microbiological profile of ventilator-associated

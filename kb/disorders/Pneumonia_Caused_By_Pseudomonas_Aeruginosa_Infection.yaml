animal_models:
- name: T3SS-competent rat acute lung injury model
  species: Rattus norvegicus
  genotype: Wild type
  publication: PMID:15972518
  description: >-
    Rats challenged intratracheally with a T3SS-competent P. aeruginosa CHA
    strain developed greater alveolar permeability injury, impaired bacterial
    clearance, and higher mortality than rats challenged with the isogenic
    exsA-null CHA-D1 strain, directly testing T3SS contribution to acute
    Pseudomonas lung injury.
  associated_phenotypes:
  - Pseudomonas acute lung injury
  - Elevated bronchoalveolar lavage protein
  - Increased lung wet/dry weight ratio
  modeled_mechanisms:
  - target: Type III Secretion Cytotoxicity
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Comparing a wild-type T3SS strain to an exsA-null mutant isolates the
      type III secretion contribution to alveolar permeability injury.
    evidence:
    - reference: PMID:15972518
      reference_title: >-
        Alveolar response to Pseudomonas aeruginosa: role of the type III
        secretion system.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        increased lung injury, as assessed by the wet/dry weight ratio for the
        lungs and the protein level in bronchoalveolar lavage fluid
      explanation: >-
        Shows that the T3SS-competent challenge produced more permeability
        edema than the T3SS-deficient mutant.
  evidence:
  - reference: PMID:15972518
    reference_title: >-
      Alveolar response to Pseudomonas aeruginosa: role of the type III
      secretion system.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      decreased bacterial clearance from the lungs, ultimately leading to an
      increased mortality rate
    explanation: >-
      Supports bacterial-clearance and mortality phenotypes in the
      T3SS-competent rat acute lung injury model.

review_notes: >-
  Duplicate preflight found no exact MONDO:0037398 or exact-label local entry
  in ignored-inclusive searches and no all-state GitHub PR or issue carrying
  the same MONDO identifier before this entry was seeded. Curation retained the
  OpenScientist report's TLR5, T3SS, NLRC4, alginate, VAP, and treatment
  mechanisms. The purulent-secretions concept is kept as a phenotype bound to
  HP:0032016 (Abnormal sputum) after the report's own CURIE was rejected as
  incorrect; the report's pulmonary-consolidation binding remains unused, and
  host CFTR genetics are scoped as a structural airway susceptibility context
  rather than a Mendelian cause. Prevention (ventilator-care bundles, subglottic
  secretion drainage, antimicrobial stewardship) is out of scope because dismech
  has no prevention section.

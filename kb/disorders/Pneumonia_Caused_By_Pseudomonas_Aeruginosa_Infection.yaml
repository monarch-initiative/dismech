name: Pneumonia Caused By Pseudomonas Aeruginosa Infection
creation_date: "2026-09-30T09:04:44Z"
description: >-
  Pneumonia caused by Pseudomonas aeruginosa infection is an acute bacterial
  lower-respiratory infection in which the opportunistic Gram-negative bacillus
  Pseudomonas aeruginosa reaches the distal airways or ventilated alveolar
  compartment, senses and injures epithelial and macrophage surfaces through
  flagellin, a type III secretion system, and cytotoxic effectors, and drives a
  suppurative neutrophilic pneumonia that can progress to alveolar-capillary
  barrier failure, sepsis, and ventilator-associated multidrug-resistant
  disease. In structurally abnormal airways, especially cystic fibrosis or
  bronchiectasis, mucoid alginate biofilm formation creates a chronic
  phagocytosis-resistant branch of infection.
category: Infectious Disease
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:35022730
      reference_title: >-
        Clinical and microbiological outcomes, by causative pathogen, in the
        ASPECT-NP randomized, controlled, Phase 3 trial comparing
        ceftolozane/tazobactam and meropenem for treatment of
        hospital-acquired/ventilator-associated bacterial pneumonia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: >-
        Baseline LRT pathogens included Klebsiella pneumoniae (34.6%),
        Pseudomonas aeruginosa (25.0%) and Escherichia coli (18.2%).
      explanation: >-
        Identifies P. aeruginosa as a lower-respiratory pathogen among
        ventilated patients with hospital-acquired or ventilator-associated
        bacterial pneumonia, placing this disorder in the infectious-disease
        part.

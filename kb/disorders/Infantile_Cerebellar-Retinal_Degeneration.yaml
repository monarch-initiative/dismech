name: Infantile Cerebellar-Retinal Degeneration
creation_date: "2026-09-12T13:50:00Z"
category: Mendelian
synonyms:
- ICRD
- infantile cerebellar retinal degeneration
- ACO2 deficiency
- mitochondrial aconitase deficiency
- cerebellar-retinal degeneration, infantile
description: >-
  An autosomal recessive neurodegenerative disorder caused by biallelic variants
  in ACO2, which encodes mitochondrial aconitase - the Krebs-cycle enzyme that
  isomerises citrate to isocitrate. Children present at two to six months with
  truncal hypotonia, athetosis and seizures, lose visual tracking that was normal
  at birth, and go on to bilateral optic atrophy, retinal degeneration and
  cerebellar atrophy.

  The mechanistically important finding, and the one that shapes this entry, is a
  negative result. In the original families the five respiratory-chain complexes
  and the pyruvate dehydrogenase complex were all normal in muscle mitochondria,
  while aconitase activity itself was severely reduced in lymphoblasts. So this
  is not a general oxidative-phosphorylation failure that happens to be caused by
  a mitochondrial gene. It is a specific, isolated block in the Krebs cycle, and
  the pathograph is written that way: the node downstream of enzyme deficiency is
  TCA-cycle flux, not OXPHOS. An entry that routed this through
  "impaired oxidative phosphorylation" would be asserting something the defining
  paper measured and excluded.

  Why the cerebellum and retina specifically, when the enzyme is ubiquitous, is
  not explained by anything curated here, and the entry records that as a
  knowledge gap rather than inventing a selective-vulnerability mechanism.

  Lump/split. ACO2 has a wide allelic spectrum and this entry deliberately covers
  only part of it. Biallelic variants also cause isolated recessive
  ophthalmological phenotypes without the neurological syndrome, and - separately
  and more commonly - monoallelic variants cause dominant isolated optic atrophy,
  with one European screen finding 50 dominant index cases against 11 biallelic.
  The dominant disorder is not modelled here as a subtype, because a different
  mode of inheritance is a split signal rather than a severity gradient: a
  has_subtypes entry under a recessive disease cannot carry a dominant
  inheritance. It is recorded in the genetic notes and in a discussion instead,
  as a separate entity that a future curator should create.

  No pathophysiology node declares conforms_to. kb/modules/ was searched; the
  available mitochondrial modules concern respiratory-chain and mtDNA-maintenance
  failure, which is precisely what this disease was shown not to have.

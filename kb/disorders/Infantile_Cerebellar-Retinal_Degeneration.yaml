genetic:
- name: ACO2
  gene_term:
    preferred_term: ACO2
    term:
      id: hgnc:118
      label: ACO2
  relationship_type: CAUSATIVE
  notes: >-
    ACO2 encodes mitochondrial aconitase, a Krebs-cycle enzyme. Its allelic
    spectrum spans three clinically distinct presentations, and only the first is
    curated in this entry.

    Biallelic variants cause this infantile neurological syndrome. Biallelic
    variants can also cause isolated ophthalmological phenotypes without the
    neurological features, though the literature records explicit doubt about
    that. Monoallelic variants cause dominant isolated optic atrophy, and that is
    numerically the commonest ACO2 disease: a European screen of genetically
    unsolved inherited optic neuropathies found 50 dominant index cases against 11
    biallelic.

    The dominant disorder is not a subtype of this entry. A has_subtypes record
    under a recessive disease cannot carry a dominant mode of inheritance, and
    inheritance is a split signal rather than a severity gradient. It warrants its
    own Disease entry; see the discussion.
  evidence:
  - reference: PMID:34056600
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By screening European cohorts of individuals with genetically unsolved inherited optic neuropathies, we identified 61 cases harbouring variants in ACO2, among whom 50 carried dominant mutations, emphasizing for the first time the important contribution of ACO2 monoallelic pathogenic variants to dominant optic atrophy."
    explanation: >-
      Establishes the dominant optic atrophy entity and its numerical weight
      relative to biallelic disease.
  - reference: PMID:34056600
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report the identification of 50 index cases carrying heterozygous pathogenic ACO2 variants, together with 11 index cases with biallelic ACO2 mutations."
    explanation: >-
      Quantifies the dominant and recessive case counts recorded in the notes.
  - reference: PMID:32449285
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, some doubt remains as to whether biallelic ACO2 variants can cause isolated ophthalmologic phenotypes."
    explanation: >-
      Records the stated uncertainty about the recessive eye-limited phenotype.
      Marked INDIRECT because it reports the state of the argument rather than
      establishing or excluding the phenotype.
diagnosis:
- name: Plasma metabolomic fingerprint
  description: >-
    Untargeted plasma metabolomics yields a metabolite signature reported as
    diagnostic for mitochondrial aconitase deficiency. This is a useful adjunct
    precisely because the standard mitochondrial workup is unhelpful here: the
    respiratory-chain complexes are normal, so a muscle biopsy assay of the
    complexes will not point at this gene.
  evidence:
  - reference: PMID:28463998
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Taken together we report a diagnostic metabolic fingerprint for mitochondrial aconitase 2 deficiency."
    explanation: >-
      States the diagnostic claim this record describes.
  - reference: PMID:22405087
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The activities of the five enzymatic complexes of the mitochondrial respiratory chain and the pyruvate dehydrogenase complex were normal in isolated mitochondria from muscle."
    explanation: >-
      Supports the rationale in this record's description, that a conventional
      respiratory-chain workup will be normal. Marked INDIRECT because it reports
      a negative enzymology result rather than evaluating a diagnostic test.
- name: ACO2 sequencing
  description: >-
    Molecular confirmation. Because the biochemical workup that would normally
    localise a mitochondrial disease is normal in this disorder, sequencing is
    effectively the primary diagnostic route rather than a confirmatory one.
  evidence:
  - reference: PMID:22405087
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygosity mapping followed by whole-exome sequencing disclosed a Ser112Arg mutation in ACO2"
    explanation: >-
      The genomic route by which the disease was originally identified.
discussions:
- discussion_id: aco2_selective_tissue_vulnerability
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does loss of a ubiquitous Krebs-cycle enzyme damage the cerebellum, optic
    nerve and retina in particular?
  attaches_to:
  - pathophysiology#Krebs Cycle Flux Block
  - pathophysiology#Progressive Neuronal and Photoreceptor Degeneration
  rationale: >-
    Mitochondrial aconitase is expressed in every tissue with mitochondria, and
    the enzymatic deficit was demonstrated in lymphoblasts - a cell type that is
    not clinically affected. Yet the disease is concentrated in cerebellum, optic
    nerve and retina, with the cortex involved enough to give evolving
    microcephaly and the muscle apparently spared.

    Nothing curated here explains this. The usual candidate accounts - high and
    inflexible energy demand in retinal ganglion cells and their long unmyelinated
    axons, limited metabolic reserve in cerebellar neurons, or a tissue-specific
    consequence of substrate accumulation rather than of ATP shortfall - are
    plausible and untested in this disorder.

    This gap is not decorative. The same selective vulnerability pattern is what
    the dominant ACO2 optic atrophy shows in isolation, so whatever explains the
    tissue selectivity may also explain why a monoallelic dose produces an
    eye-limited disease while a biallelic dose produces a multisystem one.
  evidence:
  - reference: PMID:22405087
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Specific aconitase activity in the individuals' lymphoblasts was severely reduced."
    explanation: >-
      Demonstrates the enzymatic deficit in a clinically unaffected cell type,
      which is what makes the tissue selectivity a real question rather than an
      artefact of where the enzyme is expressed.
- discussion_id: aco2_dominant_optic_atrophy_needs_own_entry
  kind: CURATION_TODO
  status: OPEN
  prompt: >-
    Should dominant ACO2-related isolated optic atrophy be a separate dismech
    Disease entry?
  attaches_to:
  - genetic#ACO2
  rationale: >-
    Yes, and this entry deliberately leaves room for it rather than absorbing it.

    Monoallelic ACO2 variants cause isolated dominant optic atrophy, and it is the
    numerically commoner ACO2 disease: 50 dominant index cases against 11
    biallelic in one European screen of unsolved inherited optic neuropathies. It
    cannot be a has_subtypes record under this entry, because a subtype of a
    recessive disease cannot carry dominant inheritance, and dismech treats mode
    of inheritance as a split signal rather than a severity gradient.

    A third presentation sits between them: biallelic variants causing isolated
    ophthalmological phenotypes without neurological features. The literature
    records explicit doubt about whether that entity is real, so it should not be
    curated as established until that doubt resolves.

    Recorded as a CURATION_TODO rather than a knowledge gap because the science is
    settled and the outstanding work is curation.
  evidence:
  - reference: PMID:34056600
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report the identification of 50 index cases carrying heterozygous pathogenic ACO2 variants, together with 11 index cases with biallelic ACO2 mutations."
    explanation: >-
      Establishes that the dominant entity exists and is numerically substantial,
      which is the case for giving it its own entry.
  - reference: PMID:32449285
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, some doubt remains as to whether biallelic ACO2 variants can cause isolated ophthalmologic phenotypes."
    explanation: >-
      Supports leaving the third, recessive eye-limited presentation uncurated for
      now. Marked INDIRECT because it reports uncertainty rather than a finding.

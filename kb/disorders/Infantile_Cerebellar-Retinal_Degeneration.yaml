inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    The neurological syndrome requires biallelic ACO2 variants. Note that
    monoallelic ACO2 variants cause a different, dominantly inherited disorder
    limited to the optic nerve; see the genetic notes.
  evidence:
  - reference: PMID:28463998
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Infantile cerebellar-retinal degeneration associated with mutations in the mitochondrial aconitase 2 gene (ACO2) has been recently described as a neurodegenerative disease of autosomal recessive inheritance."
    explanation: >-
      States the inheritance pattern and the gene.
  - reference: PMID:22405087
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygosity mapping followed by whole-exome sequencing disclosed a Ser112Arg mutation in ACO2, encoding mitochondrial aconitase, a component of the Krebs cycle."
    explanation: >-
      Homozygosity mapping in consanguineous families, consistent with recessive
      inheritance, and the original gene identification.
pathophysiology:
- name: Biallelic ACO2 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous variants in ACO2. The founding families
    carried a homozygous Ser112Arg substitution identified by homozygosity mapping
    with exome sequencing.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Reduced Mitochondrial Aconitase Activity
    description: >-
      The variant enzyme retains little catalytic activity.
  evidence:
  - reference: PMID:22405087
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygosity mapping followed by whole-exome sequencing disclosed a Ser112Arg mutation in ACO2, encoding mitochondrial aconitase, a component of the Krebs cycle."
    explanation: >-
      The original identification of the causative variant and gene.
  - reference: PMID:30689204
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequently, additional studies reported patients with pathogenic ACO2 variants, further expanding the genetic and clinical spectrum of this disorder to include milder and later onset manifestations."
    explanation: >-
      Establishes allelic and phenotypic heterogeneity beyond the founding
      families.
- name: Reduced Mitochondrial Aconitase Activity
  biological_scale: MOLECULAR
  description: >-
    Loss of the enzyme that converts citrate to isocitrate via cis-aconitate. This
    was measured directly in patient lymphoblasts and found severely reduced,
    which is what makes the enzymatic deficit an observation rather than an
    inference from the genotype.
  molecular_functions:
  - preferred_term: mitochondrial aconitase activity
    modifier: DECREASED
    term:
      id: GO:0003994
      label: aconitate hydratase activity
  downstream:
  - target: Krebs Cycle Flux Block
    description: >-
      The citrate-to-isocitrate step is the committed point the enzyme catalyses,
      so its loss interrupts flux through the cycle.
  evidence:
  - reference: PMID:22405087
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Specific aconitase activity in the individuals' lymphoblasts was severely reduced."
    explanation: >-
      Direct measurement of the enzymatic deficit in patient cells.
- name: Krebs Cycle Flux Block
  biological_scale: MOLECULAR
  description: >-
    An isolated interruption of the tricarboxylic acid cycle. This node, rather
    than a respiratory-chain node, is where the mechanism sits, because the
    respiratory chain was measured and found intact. Plasma metabolomics in
    affected patients yields a diagnostic metabolic fingerprint, which is
    consistent with an accumulating upstream substrate pool rather than with a
    general failure of mitochondrial energy production.
  biological_processes:
  - preferred_term: tricarboxylic acid cycle
    modifier: DECREASED
    term:
      id: GO:0006099
      label: tricarboxylic acid cycle
  downstream:
  - target: Progressive Neuronal and Photoreceptor Degeneration
    description: >-
      The proposed route from the metabolic block to tissue loss. The selective
      vulnerability of cerebellum, optic nerve and retina is not explained by
      anything curated here; see the knowledge gap.
  evidence:
  - reference: PMID:22405087
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The activities of the five enzymatic complexes of the mitochondrial respiratory chain and the pyruvate dehydrogenase complex were normal in isolated mitochondria from muscle."
    explanation: >-
      Recorded as REFUTE against the alternative that this disease acts through
      respiratory-chain failure. It is the measurement that localises the lesion
      to the Krebs cycle itself, and it is the reason this node is not an
      oxidative-phosphorylation node.
  - reference: PMID:28463998
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Taken together we report a diagnostic metabolic fingerprint for mitochondrial aconitase 2 deficiency."
    explanation: >-
      A measurable plasma metabolite signature, which supports a defined
      metabolic block at this node.
- name: Progressive Neuronal and Photoreceptor Degeneration
  biological_scale: TISSUE
  description: >-
    Degeneration concentrated in the cerebellum, the optic nerve and the retina,
    with evolving microcephaly indicating that the cerebral cortex is also
    affected. Vision is normal in the newborn period and then deteriorates, so the
    process is degenerative rather than a failure of development.
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  cell_types:
  - preferred_term: retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  downstream:
  - target: Axial hypotonia
  - target: Truncal ataxia
  - target: Athetosis
  - target: Seizure
  - target: Optic atrophy
  - target: Retinal dystrophy
  - target: Cerebellar atrophy
  - target: Progressive microcephaly
  - target: Esotropia
  evidence:
  - reference: PMID:22405087
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Visual tracking, normal at the newborn period, steadily deteriorated with the gradual evolution of bilateral optic atrophy."
    explanation: >-
      Establishes the degenerative rather than developmental character of the
      visual loss, which is what this node claims.
  - reference: PMID:30689204
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most patients present in early infancy with severe truncal hypotonia, truncal ataxia, variable seizures, evolving microcephaly, and ophthalmological abnormalities of which the most dominant are esotropia and optic atrophy with later development of retinal dystrophy."
    explanation: >-
      The consolidated phenotype across 16 patients, and the source for the
      individual phenotype records below.

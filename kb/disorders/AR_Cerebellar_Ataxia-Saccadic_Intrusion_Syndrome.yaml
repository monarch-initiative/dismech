- name: Memantine for Disabling Saccadic Intrusions
  action_category: THERAPEUTIC
  description: >-
    In two brothers with SCASI, memantine 20 mg/day reduced the frequency of
    saccadic intrusions and produced sustained improvement in reading without
    reported side effects. This uncontrolled two-patient observation supports a
    carefully monitored symptomatic trial in selected patients, not established
    efficacy or disease modification.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

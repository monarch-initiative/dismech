progression:
- phase: Adult-onset progressive course
  age_range: Adult presentation documented; the classic-SCASI-only onset distribution is not established
  notes: >-
    Classic SCASI/SCAR4 is slowly progressive. A 2026 molecularly confirmed
    adult case began in the twenties and progressed over 30 years. Infantile
    and childhood presentations reported for the wider VPS13D allelic spectrum
    are intentionally not assigned to this classic disease entry.
  evidence:
  - reference: PMID:42387113
    reference_title: "Adult-Onset SCAR4 with a 30-Year Slowly Progressive Course: First Combined Assessment with FDG-PET and Brain Perfusion SPECT."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient developed gait disturbance in his twenties, followed by
      progressive cerebellar and sensory ataxia, pyramidal signs, and peripheral
      neuropathy.
    explanation: Documents a slowly progressive adult-onset SCAR4 presentation.
pathophysiology:
- name: Biallelic VPS13D Dysfunction
  description: >-
    Biallelic pathogenic VPS13D variants are the initiating lesion. The common
    configuration of one nonsense or splice-site allele with one missense
    allele supports partial residual function rather than uniform complete
    protein absence; the node therefore uses dysfunction rather than
    loss-of-function as its disease-wide label.

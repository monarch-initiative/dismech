inheritance:
- name: Autosomal recessive inheritance
  description: >-
    SCASI/SCAR4 is caused by biallelic germline VPS13D variants. Most reported
    affected individuals carry one loss-of-function allele and one missense or
    other partially functional allele; this pattern is consistent with the
    severe consequences of complete VPS13D loss in experimental systems.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:29604224
    reference_title: Mutations in VPS13D lead to a new recessive ataxia with spasticity and mitochondrial defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing identified compound heterozygous mutations in VPS13D on
      chromosome 1p36 in all 7 families.
    explanation: Establishes biallelic VPS13D variants in multiple recessive ataxia families.
  - reference: PMID:30789691
    reference_title: VPS13D Movement Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: VPS13D movement disorder is inherited in an autosomal recessive manner.
    explanation: GeneReviews states the inheritance mode directly.

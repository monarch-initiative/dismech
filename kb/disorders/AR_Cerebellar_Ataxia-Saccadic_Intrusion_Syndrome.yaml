- name: Dysregulated VPS13D-Dependent Organelle Contact-Site Lipid Handling
  description: >-
    VPS13D is a large contact-site protein with a lipid-transfer domain. Its
    lipid-transfer domain binds glycerophospholipids and fatty acids in vitro;
    VPS13D depletion inhibits lipid-droplet-to-mitochondria fatty-acid
    trafficking, and Miro/VAP recruitment can bridge VPS13D between the ER and
    mitochondria. Whether VPS13D directly transports endogenous lipids in
    affected human neurons, and how this function contributes to SCASI, remain
    unproven.

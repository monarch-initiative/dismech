name: Autosomal Recessive Cerebellar Ataxia-Saccadic Intrusion Syndrome
creation_date: "2026-06-04T12:00:00Z"
category: Mendelian
description: >-
  Autosomal recessive cerebellar ataxia-saccadic intrusion syndrome
  (SCASI), also called spinocerebellar ataxia, autosomal recessive 4
  (SCAR4), is the classic VPS13D-associated recessive ataxia represented by
  MONDO:0011811. It is a slowly progressive cerebellar syndrome distinguished
  by fixation-disrupting saccadic intrusions, especially macrosaccadic
  oscillations and hypermetric saccades, together with pyramidal signs and
  axonal sensorimotor neuropathy. Biallelic pathogenic VPS13D variants are
  causative. Experimental work establishes roles for VPS13D in organelle
  contact-site lipid handling, mitochondrial fission, mitophagic completion,
  mitochondrial morphology, and axonal mitochondrial distribution, but the
  intermediates connecting these cellular defects to the selective human
  cerebellar, oculomotor, corticospinal, and peripheral-nerve phenotype remain
  unresolved. Childhood chorea, epilepsy, dystonia, isolated spastic
  paraplegia, and severe tremor occur in the broader VPS13D allelic spectrum
  and are not treated here as defining features of classic SCASI.

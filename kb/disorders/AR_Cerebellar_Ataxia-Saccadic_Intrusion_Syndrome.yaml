    reference_title: SUPPRESSION OF SACCADIC INTRUSIONS IN HEREDITARY ATAXIA BY MEMANTINE
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with memantine caused sustained improvement in reading in both

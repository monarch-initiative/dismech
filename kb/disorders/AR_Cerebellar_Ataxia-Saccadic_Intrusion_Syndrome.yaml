genetic:
- name: Biallelic VPS13D Pathogenic Variants
  gene_term:
    preferred_term: VPS13D
    term:
      id: hgnc:23595
      label: VPS13D
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Positive
  notes: >-
    SCASI/SCAR4 is caused by biallelic germline VPS13D variants, frequently a
    loss-of-function allele in trans with a missense or other residual-function
    allele. No individual variant is represented here because the previously
    listed p.Gln1106Ter claim lacked variant-specific evidence in the available
    reference cache.
  evidence:
  - reference: PMID:29604224
    reference_title: Mutations in VPS13D lead to a new recessive ataxia with spasticity and mitochondrial defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Exome sequencing identified compound heterozygous mutations in VPS13D on
      chromosome 1p36 in all 7 families.
    explanation: Establishes the causative biallelic gene-disease relationship.
diagnosis:
- name: Molecular Confirmation of VPS13D-Related SCASI/SCAR4
  description: >-
    Confirm the diagnosis by identifying biallelic pathogenic or likely
    pathogenic VPS13D variants. Multigene ataxia testing or exome/genome
    sequencing is appropriate when the phenotype is not recognized a priori;
    segregation analysis should establish that the two variants are in trans.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:30789691
    reference_title: VPS13D Movement Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of VPS13D movement disorder is established in a proband by
      identification of biallelic pathogenic variants in VPS13D on molecular
      genetic testing.
    explanation: GeneReviews defines molecular confirmation by biallelic pathogenic VPS13D variants.
- name: Quantitative Eye-Movement Recording
  description: >-
    Video-oculography or an equivalent quantitative eye-movement method can
    document fixation-disrupting macrosaccadic oscillations, hypermetric
    horizontal saccades, and abnormally fast larger saccades. This is a
    high-value supportive phenotype test, not a substitute for molecular
    confirmation.
  evidence:
  - reference: DOI:10.1212/01.wnl.0000286952.01476.eb
    reference_title: SUPPRESSION OF SACCADIC INTRUSIONS IN HEREDITARY ATAXIA BY MEMANTINE
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Eye movements were measured (magnetic search coil technique)
    explanation: Demonstrates objective measurement of the SCASI fixation and saccade phenotype.
- name: RNA Sequencing for Unresolved Splice-Effect Variants
  description: >-
    When exome or genome testing identifies a VPS13D VUS with a possible splice
    effect, RNA sequencing can demonstrate aberrant transcription and help
    resolve pathogenicity. This is particularly relevant to synonymous,
    missense, and deep intronic variants that escape routine interpretation.
  evidence:
  - reference: PMID:37340120
    reference_title: "RNA sequencing reveals a complete picture of a homozygous missense variant in a patient with VPS13D movement disorder: a case report and review of the literature."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      clinicians should consider utilizing RNA-seq to clarify VUS by evaluating
      its effect on RNA transcription.
    explanation: Directly supports RNA sequencing as a functional follow-up for unresolved VPS13D variants.
differential_diagnoses:
- name: RFC1 Spectrum Disorder / CANVAS
  description: >-
    RFC1 biallelic repeat expansions can cause adult-onset cerebellar ataxia
    with sensory neuropathy or neuronopathy.
  distinguishing_features:
  - Bilateral vestibular areflexia and chronic cough favor CANVAS.
  - RFC1 repeat-expansion testing is required because standard exome sequencing can miss the expansion.
  - Macrosaccadic oscillations are not a defining RFC1 feature.
- name: Friedreich Ataxia
  description: >-
    FXN-related Friedreich ataxia overlaps through progressive ataxia,
    pyramidal signs, and sensory neuropathy.
  distinguishing_features:
  - Cardiomyopathy, diabetes, scoliosis, and characteristic sensory-potential loss favor Friedreich ataxia.
  - FXN GAA-repeat testing distinguishes it molecularly.
- name: ARSACS and Other Recessive Spastic Ataxias
  description: >-
    SACS-, SPG7-, KIF1C-, SETX-, APTX-, and other recessive disorders can
    combine cerebellar ataxia, pyramidal signs, and neuropathy.
  distinguishing_features:
  - Disease-specific MRI, retinal, biochemical, and neuropathy patterns guide panel or genome interpretation.
  - The classic SCASI fixation phenotype with macrosaccadic oscillations and hypermetric saccades favors VPS13D.
- name: Autosomal Dominant Spinocerebellar Ataxias Including SCA4
  description: >-
    The historical label SCAR4 can be confused with autosomal dominant SCA4 and
    other dominant spinocerebellar ataxias.
  distinguishing_features:
  - A dominant multigenerational pedigree argues against VPS13D-related SCAR4.
  - Biallelic VPS13D variants establish the recessive disorder.

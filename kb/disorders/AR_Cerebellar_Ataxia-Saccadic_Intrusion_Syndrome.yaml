discussions:
- discussion_id: gap_scasi_disease_boundary_and_genotype_phenotype
  prompt: >-
    Which biallelic VPS13D genotypes belong to classic SCASI/SCAR4, and which
    define other disorders in the broader VPS13D movement-disorder spectrum?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic VPS13D Dysfunction
  - pathophysiology#Cerebellar and Oculomotor Circuit Dysfunction
  rationale: >-
    MONDO:0011811 is the classic cerebellar ataxia-saccadic intrusion entity,
    whereas published VPS13D cohorts aggregate childhood chorea/epilepsy,
    generalized dystonia, isolated or predominant spastic paraplegia, and
    tremor with classic SCASI. Residual VPS13D function, variant class, and age
    of onset probably influence presentation, but the current case count is too
    small and nosologically mixed for reliable genotype-phenotype rules. This
    entry therefore keeps broad-spectrum observations out of the classic
    phenotype and treatment rows unless explicitly contextualized.
  evidence:
  - reference: PMID:29604224
    reference_title: Mutations in VPS13D lead to a new recessive ataxia with spasticity and mitochondrial defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study demonstrates that compound heterozygous mutations in VPS13D
      cause movement disorders along the ataxia-spasticity spectrum
    explanation: Establishes a broad VPS13D ataxia-spasticity spectrum around the classic family.
  - reference: PMID:41288814
    reference_title: "VPS13D-Related Disorders: Description of New Variant and Phenotypic Spectrum Based on Age of Onset."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pediatric presentations appear to follow a more disabling course, with
      distinct characteristics according to age of onset.
    explanation: Supports age-dependent heterogeneity and a distinct pediatric spectrum.
- discussion_id: gap_scasi_human_model_mismatch_and_circuit_selectivity
  prompt: >-
    How do VPS13D mitochondrial and contact-site defects produce selective
    cerebellar, oculomotor, corticospinal, and peripheral axonal dysfunction in
    humans, and which model best reproduces the compound-hypomorphic disease?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Dysregulated VPS13D-Dependent Organelle Contact-Site Lipid Handling
  - pathophysiology#Impaired Mitochondrial Fission and Mitophagic Completion
  - pathophysiology#Neuronal Dysfunction and Neurodegeneration
  rationale: >-
    Fly knockdown and conditional mouse knockout strongly support mitochondrial
    quality-control and neuronal-degeneration mechanisms, but severe depletion
    or null states do not reproduce the typical human combination of one
    loss-of-function and one missense allele. The mouse model adds a
    microglia-dependent inflammatory death pathway that has not been shown in
    human SCASI, while neither model recreates the defining macrosaccadic
    oscillations or establishes selective peripheral-nerve involvement.
    Variant-matched human iPSC-derived cerebellar and peripheral neurons with
    isogenic controls are needed to test the cellular-to-circuit bridge.
  evidence:
  - reference: PMID:29604224
    reference_title: Mutations in VPS13D lead to a new recessive ataxia with spasticity and mitochondrial defects.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All but 2 patients carried a loss-of-function (nonsense or splice site)
      mutation on one and a missense mutation on the other allele.
    explanation: Defines the typical human allelic architecture that complete-loss models do not reproduce.
  - reference: PMID:40563011
    reference_title: Microglia promote inflammatory cell death upon neuronal mitochondrial impairment during neurodegeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Depletion of microglia suppressed cell death and behavioral phenotypes but
      not mitochondrial changes in the neuron-specific Vps13d-knockout model
    explanation: Demonstrates a mouse-specific glial mediator whose relevance to human SCASI remains unresolved.
  - reference: PMID:39957248
    reference_title: VPS13D mutations affect mitochondrial homeostasis and locomotion in Caenorhabditis elegans.
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      vps-13D mutant worms exhibit locomotion defects and abnormal mitochondrial
      morphology.
    explanation: A variant-based model narrows the allelic mismatch but still lacks the human circuit phenotype.
notes: >-
  Scope and nomenclature: this entry represents classic
  SCASI/SCAR4 (MONDO:0011811; ORPHA:95434; OMIM:607317;
  MeSH:C537310), historically also called SCA24. The unqualified synonym
  "VPS13D-related disorder" was removed because it spans clinically distinct
  childhood and adult presentations. Tremor and deep-brain stimulation were
  also removed from the treatment/phenotype rows because the reported DBS case
  represents a broader severe spastic-ataxia presentation, not the defining
  classic SCASI family. The previous p.Gln1106Ter variant row was removed
  because available evidence supported only a general variant class, not that
  exact variant-level assertion. Phenotype frequency bands are intentionally
  omitted because classic-SCASI denominators are too small and are often pooled
  with the broader VPS13D spectrum.

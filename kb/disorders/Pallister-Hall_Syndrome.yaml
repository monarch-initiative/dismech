discussions:
- discussion_id: phs_scope_sporadic_hypothalamic_hamartoma
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Should congenital hypothalamic hamartoma syndrome (MONDO:0009436), which
    MONDO files as the sole is_a child of this entry's term and attributes to
    SMO, be curated as a subtype of Pallister-Hall syndrome?
  attaches_to:
  - pathophysiology#Hypothalamic Development Disruption
  rationale: >
    This entry declines that placement, and MONDO:0009436's own textual
    definition is the reason. That definition closes "Though hypothalamic
    hamartomas can occur in patients with certain genetic disorders (such as
    Pallister-Hall syndrome), the majority of cases are sporadic", and its
    synonyms are the bare lesion names - hypothalamic hamartoma, hamartoma of
    the hypothalamus - plus "Pallister-Hall-like syndrome". So the concept MONDO
    describes there is predominantly sporadic hypothalamic hamartoma, of which
    germline Pallister-Hall syndrome is one minority cause. Placing it beneath
    this entry inverts that relationship, and through this term it inherits
    hereditary disease, polydactyly, syndactyly, skeletal dysplasia and
    pituitary deficiency, none of which the definition claims for the sporadic
    majority.

    The causal gene MONDO records for it is also not this entry's gene. Its OWL
    axioms assert SMO (hgnc:11119), whereas Pallister-Hall syndrome is a
    germline GLI3 disorder. In sporadic hypothalamic hamartoma, SMO has been
    implicated only as one of several Shh-pathway genes falling inside
    brain-tissue-specific large copy-number or loss-of-heterozygosity lesions,
    rather than as an individually recurrent somatic target; the recurrent
    somatic genes in that series were PRKACA and GLI3. The sporadic, somatically
    driven entity is curated in this repository as Hypothalamic Hamartoma with
    Gelastic Seizures, bound to MONDO:0019484, whose own node for the initiating
    lesion is a somatic Sonic hedgehog pathway mutation. That is where an SMO
    assertion belongs, and that entry currently names SMO in prose without a
    bound genetic record, which is the open piece of work here.
  notes: >-
    Recording rather than silently resolving this, because a future curator
    following MONDO's hierarchy will find it asserting a parentage this entry
    declines. The same shape - MONDO's is_a placement disagreeing with MONDO's
    own definition of the same term - is recorded on the Hemophilia entry for
    factor XI deficiency.


- name: Gap-junction and sodium-channel remodeling
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Mutant plakoglobin that fails to localize at the intercalated disc causes
    a significant reduction of connexin43 gap-junction protein in both
    ventricles, with smaller and fewer gap junctions. Desmosomal dysfunction
    also secondarily reduces the cardiac sodium channel NaV1.5 (SCN5A) at the
    intercalated disc. Together this gap-junction and sodium-channel remodeling
    forms an arrhythmogenic substrate that is present even before overt
    structural cardiomyopathy.
  genes:

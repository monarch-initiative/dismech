- name: Avoidance of competitive and endurance exercise
  description: >-
    Restriction of competitive and endurance exercise is recommended to reduce
    mechanical stress on the desmosomally weakened myocardium, since increased
    mechanical stress or stretch promotes cardiomyocyte death and fibrofatty
    replacement. Extrapolated from general arrhythmogenic cardiomyopathy
    management and supported mechanistically by the mechanical-stress
    dependence of the desmosomal lesion.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: behavioral counseling
    term:
      id: MAXO:0000077
      label: behavioral counseling

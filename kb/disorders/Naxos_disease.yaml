- name: JUP
  gene_term:
    preferred_term: JUP
    term:
      id: hgnc:6207
      label: JUP
  relationship_type: CAUSATIVE
  variants:
  - name: c.2157del2 (p.Ser710fs)
    description: >-
      Homozygous 2-base-pair deletion in plakoglobin causing a frameshift and
      premature protein truncation; the founder variant in Naxos disease.
    evidence:
    - reference: PMID:10902626
      reference_title: "Identification of a deletion in plakoglobin in arrhythmogenic right ventricular cardiomyopathy with palmoplantar keratoderma and woolly hair (Naxos disease)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A homozygous 2 base pair deletion in the plakoglobin gene was identified
        only in the 19 affected individuals. This deletion caused a frameshift and
        premature termination of the protein, which was shown by western blot
        analysis.
      explanation: >-
        Documents the specific founder 2-bp deletion and its frameshift/truncation
        consequence.
  notes: >-
    Biallelic loss-of-function variants in JUP (plakoglobin) cause Naxos
    disease. The founder allele is a homozygous 2-bp deletion (c.2157del2,
    p.Ser710fs) truncating the C-terminal domain of the protein.
  evidence:
  - reference: PMID:10902626
    reference_title: "Identification of a deletion in plakoglobin in arrhythmogenic right ventricular cardiomyopathy with palmoplantar keratoderma and woolly hair (Naxos disease)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A homozygous 2 base pair deletion in the plakoglobin gene was identified
      only in the 19 affected individuals. This deletion caused a frameshift and
      premature termination of the protein, which was shown by western blot
      analysis.
    explanation: >-
      Directly documents the causal homozygous truncating JUP variant.
  - reference: PMID:10902626
    reference_title: "Identification of a deletion in plakoglobin in arrhythmogenic right ventricular cardiomyopathy with palmoplantar keratoderma and woolly hair (Naxos disease)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      29 clinically unaffected family members were heterozygous for the
      mutation; 20 unrelated individuals from Naxos and 43 autosomal dominant
      ARVC probands were homozygous for the normal allele.
    explanation: >-
      Confirms recessive segregation: heterozygous carriers were unaffected and
      the variant was absent (homozygous normal) in controls and dominant ARVC.
treatments:
- name: Implantable cardioverter-defibrillator placement
  description: >-
    ICD implantation provides antiarrhythmic protection and improves life
    expectancy in high-risk patients with malignant ventricular arrhythmias.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: MAXO:0000474
      label: implantable cardioverter-defibrillator placement
  evidence:
  - reference: PMID:10914377
    reference_title: "Implantable defibrillator therapy in Naxos disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The implantation of an automatic defibrillator provides an alternative
      form of antiarrhythmic management to improve life expectancy in these high
      risk cardiac patients.
    explanation: >-
      Supports ICD implantation as a management strategy to reduce sudden-death
      risk.
  - reference: PMID:16722579
    reference_title: "Naxos disease: cardiocutaneous syndrome due to cell adhesion defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Implantation of an automatic cardioverter defibrillator is indicated for
      prevention of sudden cardiac death.
    explanation: >-
      The authoritative Naxos review states ICD implantation is indicated for
      sudden-death prevention.
- name: Antiarrhythmic and heart-failure pharmacotherapy
  description: >-
    Antiarrhythmic drugs are used to prevent recurrent sustained ventricular
    tachycardia, and standard pharmacological therapy is used for congestive
    heart failure in advanced disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:

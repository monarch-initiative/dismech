    explanation: >-
      The authoritative Naxos review states ICD implantation is indicated for
      sudden-death prevention.
- name: Antiarrhythmic and heart-failure pharmacotherapy
  description: >-
    Antiarrhythmic drugs are used to prevent recurrent sustained ventricular
    tachycardia, and standard pharmacological therapy is used for congestive
    heart failure in advanced disease. Note that in arrhythmogenic
    cardiomyopathy antiarrhythmic drugs reduce arrhythmia burden but do not
    reduce the risk of sudden death.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:16722579
    reference_title: "Naxos disease: cardiocutaneous syndrome due to cell adhesion defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Antiarrhythmic drugs are used for preventing recurrences of episodes of
      sustained ventricular tachycardia and classical pharmacological treatment
      for congestive heart failure
    explanation: >-
      Supports antiarrhythmic drug therapy for recurrent VT and standard
      pharmacotherapy for heart failure.
  - reference: PMID:25894016
    reference_title: "Pharmacotherapy and other therapeutic modalities for managing Arrhythmogenic Right Ventricular Cardiomyopathy."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Antiarrhythmic drugs play an important role in terms of reduction of both
      the number and the complexity of arrhythmias, but they do not reduce the
      risk of SD.
    explanation: >-
      Qualifies the benefit of antiarrhythmic drugs in ARVC: they reduce
      arrhythmia burden but not sudden-death risk (Naxos is a recessive ARVC).
- name: Catheter ablation
  description: >-
    Catheter ablation is used to control recurrent ventricular tachycardia
    refractory to antiarrhythmic drugs, though ventricular tachycardia

    reference_title: "Naxos disease: cardiocutaneous syndrome due to cell adhesion defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Antiarrhythmic drugs are used for preventing recurrences of episodes of
      sustained ventricular tachycardia and classical pharmacological treatment
      for congestive heart failure
    explanation: >-
      Supports antiarrhythmic drug therapy for recurrent VT and standard
      pharmacotherapy for heart failure.
- name: Heart transplantation
  description: >-
    Heart transplantation is considered at the end stages of the disease for
    refractory heart failure.
  therapeutic_modality: SURGERY
  treatment_term:

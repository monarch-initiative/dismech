    reference_title: "Genotype-phenotype assessment in autosomal recessive arrhythmogenic right ventricular cardiomyopathy (Naxos disease) caused by a deletion in plakoglobin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During follow-up (10 +/- 6 years), 16 (62%) developed structural
      progression, 12 (46%) arrhythmic events and 7 (27%) heart failure.
    explanation: >-
      27% of affected homozygotes developed heart failure over follow-up,
      supporting an occasional-frequency outcome.

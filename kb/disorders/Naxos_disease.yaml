    term:
      id: GO:0086006
      label: voltage-gated sodium channel activity involved in cardiac muscle cell action potential
    modifier: DECREASED
  locations:
  - preferred_term: myocardium
    term:
      id: UBERON:0002349
      label: myocardium
  evidence:
  - reference: PMID:15851108
    reference_title: "Remodeling of myocyte gap junctions in arrhythmogenic right ventricular cardiomyopathy due to a deletion in plakoglobin (Naxos disease)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Connexin43 expression at intercellular junctions was reduced
      significantly in both right and left ventricles in all patients with
      Naxos disease.
    explanation: >-
      Documents connexin43 gap-junction reduction in Naxos myocardium.
  - reference: PMID:23178689
    reference_title: "Remodeling of the cardiac sodium channel, connexin43, and plakoglobin at the intercalated disk in patients with arrhythmogenic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunoreactive signal levels of PKG, Cx43, and NaV1.5 were disturbed in
      74%, 70%, and 65% of the patients, respectively.
    explanation: >-
      Human myocardial immunohistochemistry from arrhythmogenic-cardiomyopathy
      patients shows disturbed plakoglobin (PKG), connexin43, and NaV1.5
      sodium-channel signal at the intercalated disc, evidencing both the
      gap-junction and sodium-channel arms of this node. The cohort is
      desmosomal ARVC broadly (multiple genotypes); the Naxos-specific
      connexin43 arm is separately established by PMID:15851108.
  - reference: PMID:15851108
    reference_title: "Remodeling of myocyte gap junctions in arrhythmogenic right ventricular cardiomyopathy due to a deletion in plakoglobin (Naxos disease)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Electron microscopy revealed smaller and fewer gap junctions
      interconnecting ventricular myocytes.
    explanation: >-
      Ultrastructural confirmation of reduced gap-junction number/size,
      establishing an arrhythmogenic substrate.
  downstream:
  - target: Ventricular arrhythmia and sudden death
    description: >-
      Gap-junction remodeling slows myocardial conduction, contributing to the
      reentrant arrhythmogenic substrate.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced connexin43-mediated electrical coupling and slowed conduction
    evidence:
    - reference: PMID:15851108
      reference_title: "Remodeling of myocyte gap junctions in arrhythmogenic right ventricular cardiomyopathy due to a deletion in plakoglobin (Naxos disease)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Naxos disease, a recessive form of arrhythmogenic right ventricular
        cardiomyopathy, is associated with a high incidence of arrhythmias and
        sudden cardiac death.
      explanation: >-
        Connects the gap-junction-remodeled substrate to the high arrhythmic
        and sudden-death burden.
- name: Nuclear plakoglobin and canonical Wnt suppression
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Desmosomal disruption can redistribute plakoglobin to the nucleus, where it
    reduces canonical Wnt/beta-catenin signaling through Tcf/Lef1, activating
    adipogenic and fibrogenic gene programs that drive the characteristic
    fibrofatty replacement. Confidence is PROVISIONAL for Naxos disease: the
    supporting evidence derives from desmoplakin (DSP) knockdown/knockout
    models rather than plakoglobin (JUP) loss, so its translational validity to
    the human JUP phenotype remains an open question (see the attached
    HUMAN_MODEL_MISMATCH discussion).

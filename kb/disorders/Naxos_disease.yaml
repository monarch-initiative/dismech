  prevalence_class: RARE
  notes: >-
    A founder disorder originally described on the Greek island of Naxos, with
    additional families reported from Greece, Italy, India, Ecuador, Israel and
    Turkey. Overall it is very rare; higher local carrier frequency reflects the
    island founder effect.
  evidence:
  - reference: PMID:15210133
    reference_title: "Naxos disease and Carvajal syndrome: cardiocutaneous disorders that highlight the pathogenesis and broaden the spectrum of arrhythmogenic right ventricular cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical and histopathological spectrum of heart disease, molecular
      genetics and genotype-phenotype correlation are reviewed in 22 affected
      families with this cardiocutaneous syndrome reported in the literature
      from Greece, Italy, India, Ecuador, Israel and Turkey.
    explanation: >-
      Documents the small number of reported families worldwide, supporting a
      very rare, founder-associated disorder.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: COMPLETE
  description: >-
    Naxos disease is inherited in an autosomal recessive pattern; affected
    individuals are homozygous for a JUP loss-of-function variant, classically
    the founder frameshift c.2157del2 (p.Ser710fs). The cutaneous phenotype is
    present from infancy and the cardiomyopathy is fully penetrant by
    adolescence. Heterozygous carriers are clinically unaffected, though a
    minority show minor ECG or echocardiographic changes.
  evidence:
  - reference: PMID:11691526
    reference_title: "Genotype-phenotype assessment in autosomal recessive arrhythmogenic right ventricular cardiomyopathy (Naxos disease) caused by a deletion in plakoglobin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Autosomal recessive ARVC caused by a mutation in plakoglobin was 100%
      penetrant by adolescence.
    explanation: >-
      Establishes autosomal recessive inheritance with full penetrance of the
      cardiomyopathy by adolescence in homozygotes.
  - reference: PMID:11691526
    reference_title: "Genotype-phenotype assessment in autosomal recessive arrhythmogenic right ventricular cardiomyopathy (Naxos disease) caused by a deletion in plakoglobin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In eight who were heterozygous, minor ECG or echocardiographic
      abnormalities were observed.
    explanation: >-
      Supports that a minority of heterozygous carriers show only minor,
      subclinical changes.
pathophysiology:
- name: Plakoglobin loss-of-function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Homozygous truncating variants in JUP (plakoglobin/gamma-catenin) produce a
    C-terminally truncated protein. Plakoglobin is a core armadillo-family
    protein of the desmosome and adherens junction, so its loss impairs
    junctional protein assembly at cell-cell contacts in tissues that depend on
    strong mechanical adhesion, including myocardium, epidermis, and hair
    follicle.
  genes:
  - preferred_term: JUP
    term:
      id: hgnc:6207
      label: JUP
  biological_processes:
  - preferred_term: desmosome organization
    term:
      id: GO:0002934
      label: desmosome organization
    modifier: DECREASED
  evidence:
  - reference: PMID:10902626
    reference_title: "Identification of a deletion in plakoglobin in arrhythmogenic right ventricular cardiomyopathy with palmoplantar keratoderma and woolly hair (Naxos disease)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A homozygous 2 base pair deletion in the plakoglobin gene was identified
      only in the 19 affected individuals. This deletion caused a frameshift and
      premature termination of the protein, which was shown by western blot
      analysis.
    explanation: >-
      Directly documents the homozygous truncating plakoglobin variant as the
      molecular cause of Naxos disease.
  - reference: PMID:10902626
    reference_title: "Identification of a deletion in plakoglobin in arrhythmogenic right ventricular cardiomyopathy with palmoplantar keratoderma and woolly hair (Naxos disease)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This protein is a key component of desmosomes and adherens junctions, and
      is important for the tight adhesion of many cell types, including those in
      the heart and skin.
    explanation: >-
      Supports plakoglobin's role in desmosomal/adherens-junction adhesion in
      both cardiac and cutaneous tissue, explaining the multisystem phenotype.
  downstream:
  - target: Intercalated-disc desmosome failure
    description: >-
      Truncated plakoglobin destabilizes the cardiomyocyte desmosome at the
      intercalated disc, impairing mechanical cell-cell adhesion.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10902626
      reference_title: "Identification of a deletion in plakoglobin in arrhythmogenic right ventricular cardiomyopathy with palmoplantar keratoderma and woolly hair (Naxos disease)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        the proteins involved in cell-cell adhesion play an important part in
        maintaining myocyte integrity, and when junctions are disrupted, cell
        death, and fibrofatty replacement occur.
      explanation: >-
        Links disruption of the adhesion junction to loss of myocyte integrity.
  - target: Cutaneous and hair-follicle desmosome failure
    description: >-
      The same plakoglobin defect weakens desmosomal adhesion in epidermal
      keratinocytes and the hair follicle, producing palmoplantar keratoderma
      and woolly hair.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10902626
      reference_title: "Identification of a deletion in plakoglobin in arrhythmogenic right ventricular cardiomyopathy with palmoplantar keratoderma and woolly hair (Naxos disease)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        is important for the tight adhesion of many cell types, including those
        in the heart and skin.
      explanation: >-
        Supports extension of the adhesion defect to skin, underlying the
        cutaneous phenotype.

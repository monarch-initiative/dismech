- name: Gap-junction and sodium-channel remodeling
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Mutant plakoglobin that fails to localize at the intercalated disc causes
    a significant reduction of connexin43 gap-junction protein in both
    ventricles, with smaller and fewer gap junctions. This gap-junction
    remodeling forms an arrhythmogenic substrate that is present even before
    overt structural cardiomyopathy.

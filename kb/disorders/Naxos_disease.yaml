name: Naxos disease
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
description: >-
  Naxos disease is a rare autosomal recessive cardiocutaneous syndrome that
  combines arrhythmogenic right ventricular cardiomyopathy (ARVC) with a
  distinctive ectodermal phenotype of woolly hair present from birth and diffuse
  non-epidermolytic palmoplantar keratoderma appearing in infancy. It is caused
  by homozygous loss-of-function variants in JUP, the gene encoding plakoglobin
  (gamma-catenin), a component of desmosomes and adherens junctions. First
  described in families from the Greek island of Naxos, it was the first disorder
  to establish a causal link between a desmosomal protein defect and ARVC. The
  cutaneous features are congenital or early-childhood markers that identify
  affected children before the fully penetrant cardiomyopathy manifests in
  adolescence with ventricular arrhythmias, syncope, and a high risk of sudden
  cardiac death.

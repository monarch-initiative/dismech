differential_diagnoses:
- name: Carvajal syndrome
  disease_term:
    preferred_term: Carvajal syndrome
    term:
      id: MONDO:0011581
      label: arrhythmogenic cardiomyopathy with wooly hair and keratoderma
  description: >-
    Carvajal syndrome is the desmoplakin (DSP) cardiocutaneous syndrome with the
    same woolly hair and palmoplantar keratoderma but predominantly left
    ventricular / dilated cardiomyopathy and earlier, more heart-failure-prone
    presentation.
  notes: >-
    Allelic/phenotypic variant distinguished by the causal gene (DSP vs JUP) and
    left-ventricular predominance; corresponds to the dedicated
    Carvajal_Syndrome entry (MONDO:0011581).
  evidence:
  - reference: PMID:25824144
    reference_title: "Two Novel Homozygous Desmoplakin Mutations in Carvajal Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      is characterized by the association of dilated cardiomyopathy, striate
      palmoplantar keratoderma, and woolly hair. It is caused by homozygous as
      well as heterozygous mutations in DSP, which encodes the desmosomal plaque
      protein desmoplakin.
    explanation: >-
      Distinguishes Carvajal syndrome (DSP, dilated cardiomyopathy) from
      Naxos disease (JUP, right-ventricular ARVC).
- name: Myocarditis
  disease_term:
    preferred_term: myocarditis
    term:
      id: MONDO:0004496
      label: myocarditis
  description: >-
    Acute myocarditis can mimic the arrhythmias and myocardial injury of
    arrhythmogenic cardiomyopathy and is an important cardiac differential.
  notes: >-
    Clinical differential for the cardiomyopathy component; distinguished by the
    cardiocutaneous phenotype and JUP genotype in Naxos disease.
discussions:
- discussion_id: hmm_naxos_wnt_suppression_dsp_vs_jup
  prompt: >-
    Does nuclear-plakoglobin-mediated suppression of canonical Wnt/beta-catenin
    signaling, established in desmoplakin (DSP) knockdown/knockout models,
    operate equivalently in human JUP (plakoglobin) loss-of-function Naxos
    disease to drive fibrofatty replacement?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Nuclear plakoglobin and canonical Wnt suppression
  rationale: >-
    The canonical adipogenic/fibrogenic Wnt-suppression mechanism was
    demonstrated by silencing or deleting desmoplakin (DSP), not plakoglobin
    (JUP), and partly in murine systems. Naxos disease is caused by JUP
    truncation; although plakoglobin is the effector redistributed to the
    nucleus in that model, direct confirmation that JUP loss reproduces the same
    Wnt-suppression-driven fibrofatty program in human myocardium is lacking.
  proposed_experiments:
  - experiment_id: exp_naxos_jup_ipsc_wnt_readout
    name: JUP-null iPSC-cardiomyocyte Wnt readout
    description: >-
      Test canonical Wnt/beta-catenin activity and adipogenic/fibrogenic gene
      programs in JUP-2157del2 patient-derived iPSC-cardiomyocytes versus
      isogenic controls.
  - experiment_id: exp_naxos_myocardium_plakoglobin_wnt
    name: Naxos myocardium plakoglobin/Wnt assessment
    description: >-
      Assess nuclear plakoglobin localization and Wnt target-gene expression in
      Naxos disease myocardial samples.
  evidence:
  - reference: PMID:16823493
    reference_title: "Suppression of canonical Wnt/beta-catenin signaling by nuclear plakoglobin recapitulates phenotype of arrhythmogenic right ventricular cardiomyopathy."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      We established atrial myocyte cell lines expressing siRNA against
      desmoplakin (DP), responsible for human ARVC.
    explanation: >-
      Confirms the mechanism was established in a desmoplakin-knockdown model,
      not a plakoglobin/JUP model, motivating the human-model-mismatch question.
  - reference: PMID:24920660
    reference_title: "Identification of a new modulator of the intercalated disc in a zebrafish model of arrhythmogenic cardiomyopathy."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we created a zebrafish model of ACM with cardiac myocyte-specific
      expression of the human 2057del2 mutation in the gene encoding
      plakoglobin. A high-throughput screen identified SB216763 as a suppressor
      of the disease phenotype.
    explanation: >-
      Gene-correct plakoglobin model evidence that the arrhythmogenic phenotype
      is pharmacologically rescuable exists (the 2057del2 allele is the same
      Naxos founder mutation this entry records as c.2157del2, under an
      alternative literature numbering), but it remains a model-organism result;
      direct confirmation of the Wnt-suppression edge in human JUP-mutant
      myocardium is still lacking.

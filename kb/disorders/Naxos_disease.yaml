genetic:
- name: JUP
  gene_term:
    preferred_term: JUP
    term:
      id: hgnc:6207
      label: JUP
  relationship_type: CAUSATIVE
  variants:
  - name: c.2157del2 (p.Ser710fs)
    description: >-
      Homozygous 2-base-pair deletion in plakoglobin causing a frameshift and
      premature protein truncation; the founder variant in Naxos disease.
    evidence:
    - reference: PMID:10902626
      reference_title: "Identification of a deletion in plakoglobin in arrhythmogenic right ventricular cardiomyopathy with palmoplantar keratoderma and woolly hair (Naxos disease)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A homozygous 2 base pair deletion in the plakoglobin gene was identified
        only in the 19 affected individuals. This deletion caused a frameshift and
        premature termination of the protein, which was shown by western blot
        analysis.
      explanation: >-
        Documents the specific founder 2-bp deletion and its frameshift/truncation
        consequence.
  notes: >-
    Biallelic loss-of-function variants in JUP (plakoglobin) cause Naxos
    disease. The founder allele is a homozygous 2-bp deletion (c.2157del2,
    p.Ser710fs) truncating the C-terminal domain of the protein. The
    genotype-phenotype boundary is informative: a heterozygous dominant JUP
    variant (S39_K40insS) instead causes arrhythmogenic right ventricular
    cardiomyopathy without the cutaneous phenotype. A Naxos-like phenotype
    (woolly hair, palmoplantar keratoderma, and cardiomyopathy) can also occur
    without the JUP founder allele: a single consanguineous 2004 Saudi Arab
    family was reported as JUP-negative, though exclusion there rested only on
    heterozygosity at one intronic marker (IVS11+22G/A) in the affected
    proband rather than gene-panel/exome sequencing. Such JUP-negative
    Naxos-like families are in current nosology most often attributed to DSP
    (see the Carvajal syndrome differential), so this is better read as a
    boundary of the JUP-defined entity than as intrinsic locus heterogeneity of
    Naxos disease itself.
  evidence:
  - reference: PMID:10902626
    reference_title: "Identification of a deletion in plakoglobin in arrhythmogenic right ventricular cardiomyopathy with palmoplantar keratoderma and woolly hair (Naxos disease)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A homozygous 2 base pair deletion in the plakoglobin gene was identified
      only in the 19 affected individuals. This deletion caused a frameshift and
      premature termination of the protein, which was shown by western blot
      analysis.
    explanation: >-
      Directly documents the causal homozygous truncating JUP variant.
  - reference: PMID:10902626
    reference_title: "Identification of a deletion in plakoglobin in arrhythmogenic right ventricular cardiomyopathy with palmoplantar keratoderma and woolly hair (Naxos disease)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      29 clinically unaffected family members were heterozygous for the
      mutation; 20 unrelated individuals from Naxos and 43 autosomal dominant
      ARVC probands were homozygous for the normal allele.
    explanation: >-
      Confirms recessive segregation: heterozygous carriers were unaffected and
      the variant was absent (homozygous normal) in controls and dominant ARVC.
  - reference: PMID:17924338
    reference_title: "A novel dominant mutation in plakoglobin causes arrhythmogenic right ventricular cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we report, for the first time, a dominant mutation in the gene encoding
      plakoglobin in a German family with ARVC but no cutaneous abnormalities.
      The mutation (S39_K40insS) is predicted to insert an extra serine residue
      at position 39 in the N-terminus of plakoglobin.
    explanation: >-
      Defines the allelic genotype-phenotype boundary: a dominant N-terminal JUP
      variant causes ARVC without the Naxos cutaneous phenotype, distinct from
      the recessive C-terminal truncation.
  - reference: PMID:15494820
    reference_title: "Naxos disease in an Arab family is not caused by the Pk2157del2 mutation. Evidence for exclusion of the plakoglobin gene."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Absence of the Pk2157del2 frameshift in the affected child proved that
      Naxos disease in this Saudi Arab family is not caused by the same mutation
    explanation: >-
      A limiting observation on the JUP-causative record: a clinically classic
      Naxos-like phenotype in a single consanguineous Saudi Arab family did not
      carry the JUP founder mutation, and the plakoglobin gene was excluded
      (heterozygosity at the IVS11+22G/A intronic marker). Marks the boundary of
      the JUP-defined entity; such families are today usually attributed to DSP
      (Carvajal syndrome).
treatments:
- name: Implantable cardioverter-defibrillator placement
  description: >-
    ICD implantation provides antiarrhythmic protection and improves life
    expectancy in high-risk patients with malignant ventricular arrhythmias.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  evidence:
  - reference: PMID:10914377
    reference_title: "Implantable defibrillator therapy in Naxos disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The implantation of an automatic defibrillator provides an alternative
      form of antiarrhythmic management to improve life expectancy in these high
      risk cardiac patients.
    explanation: >-
      Supports ICD implantation as a management strategy to reduce sudden-death
      risk.
  - reference: PMID:16722579
    reference_title: "Naxos disease: cardiocutaneous syndrome due to cell adhesion defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Implantation of an automatic cardioverter defibrillator is indicated for

- name: LMNB1 upstream regulatory deletion
  subtype: Upstream Deletion-Related ADLD
  gene_term:
    preferred_term: LMNB1
    term:
      id: hgnc:6637
      label: LMNB1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Heterozygous, nonrecurrent noncoding deletions immediately upstream of
    LMNB1 on 5q23.2, ranging from roughly 250 kb to 670 kb, that leave the
    coding sequence intact. Because they alter only regulatory sequence, they
    are missed by sequence-based exome testing and require copy-number or
    structural-variant assays.
  evidence:
  - reference: PMID:30842973
    reference_title: Genomic deletions upstream of lamin B1 lead to atypical autosomal dominant leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients had unique nonrecurrent deletions upstream of the LMNB1, varying in size from 250 kb to 670 kb."
    explanation: Defines the size range and nonrecurrent character of the causative alleles.
  - reference: PMID:30697589
    reference_title: Duplication and deletion upstream of LMNB1 in autosomal dominant adult-onset leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found 2 patients from 1 family carrying a 249-kb genomic deletion upstream of LMNB1."
    explanation: An independent family carrying a deletion at the small end of the reported size range.
  - reference: PMID:30842973
    reference_title: Genomic deletions upstream of lamin B1 lead to atypical autosomal dominant leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given that these mutations do not alter the coding sequence, our data also emphasize the importance of regulatory elements and the need for performing analyses for copy number variants that might be missed with the standard whole-exome sequencing, currently being used to identify mutations in patients with leukodystrophies."
    explanation: >-
      States the diagnostic consequence of the lesion being noncoding, which is
      why exome sequencing is not an adequate first-tier test here.

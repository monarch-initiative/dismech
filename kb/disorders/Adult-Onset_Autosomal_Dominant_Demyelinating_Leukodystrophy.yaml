discussions:
- discussion_id: gap_adld_deletion_dysautonomia_spinal_cord
  prompt: >-
    Is the absence of early dysautonomia in upstream-deletion (atypical) ADLD
    caused by the sparing of the spinal cord below the uppermost cervical
    level, and if so why does the same LMNB1 overexpression spare the cord in
    deletion carriers but not in duplication carriers?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Enhancer Adoption From Upstream Deletion
  - pathophysiology#Autonomic-System Involvement (Mechanism Unresolved)
  rationale: >-
    The two OMIM criteria that separate atypical from typical ADLD, lack of
    early autonomic involvement and relative sparing of cerebellum and spinal
    cord, are the same fact seen clinically and radiologically if the
    dysautonomia of ADLD is cord-derived. The deletion cohort authors advance
    exactly that reading, but they label it a hypothesis, and it rests on
    spinal MRI from only two deletion carriers. It also leaves the harder
    question untouched: both routes raise LMNB1, so an anatomically selective
    difference in outcome implies a difference in where or how much the gene is
    de-repressed that the enhancer-adoption and silencer-loss models do not yet
    specify.
  evidence:
  - reference: PMID:30842973
    reference_title: Genomic deletions upstream of lamin B1 lead to atypical autosomal dominant leukodystrophy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "This difference could explain the lack of early autonomic symptoms in patients with deletions, as it has been hypothesized that autonomic symptoms in ADLD with duplications are due to spinal cord involvement."
    explanation: >-
      The authors present the cord-sparing explanation explicitly as a
      hypothesis built on a prior hypothesis, not as an established mechanism.
  - reference: PMID:30697589
    reference_title: Duplication and deletion upstream of LMNB1 in autosomal dominant adult-onset leukodystrophy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of cerebellar symptoms and lesions may be characteristic in our patients with the deletion compared with the previously reported family with the deletion."
    explanation: >-
      A second deletion family shows cerebellar involvement, so the
      cerebellar-sparing half of the atypical definition is not consistent
      across the reported families and the phenotype-to-anatomy mapping is
      unsettled.
  proposed_experiments:
  - experiment_id: exp_adld_deletion_cord_autonomic_correlation
    name: Prospective spinal-cord imaging and autonomic testing across ADLD genotypes
    description: >-
      Enroll genotyped ADLD duplication and upstream-deletion carriers,
      including presymptomatic relatives, and pair quantitative cervical and
      thoracic spinal-cord cross-sectional-area measurement with the standard
      autonomic battery, tilt table, QSART, and urodynamics, at matched ages.
      A cord-derived dysautonomia model predicts that autonomic deficit tracks
      cord atrophy within and across genotypes; a genotype effect that survives
      adjustment for cord atrophy would refute it.
    experiment_type:
      preferred_term: Genotype-stratified prospective imaging and autonomic phenotyping study
- discussion_id: gap_adld_model_to_human_cellular_mechanism
  prompt: >-
    Which oligodendrocyte, astrocyte, and axon-myelin-unit abnormalities caused
    by LMNB1 overexpression are causal in human ADLD, and what mechanism
    produces the early autonomic phenotype that current mouse models lack?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#RAVER2/PTB-Dependent PLP1 Spliceopathy
  - pathophysiology#Oligodendrocyte Lipid and Myelin Program Dysfunction
  - pathophysiology#Astrocyte LIF-Support Dysfunction
  - pathophysiology#Axon-Myelin Unit Injury
  - pathophysiology#Autonomic-System Involvement (Mechanism Unresolved)
  rationale: >-
    Available mouse and cultured-cell models yield conflicting cell-type results
    and do not reproduce the early autonomic manifestations seen in patients.
    This mismatch prevents any one glial or axonal branch from being asserted as
    the established human bridge from LMNB1 overexpression to demyelination.
  evidence:
  - reference: PMID:37450245
    reference_title: "Understanding the Ultra-Rare Disease Autosomal Dominant Leukodystrophy: an Updated Review on Morpho-Functional Alterations Found in Experimental Models."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Indeed, neither of the two in vivo models is able to fully recapitulate the clinical phenotype observed in ADLD patients, since they do not display the autonomic symptoms that are characteristic of ADLD initial stages [36]."
    explanation: The review explicitly documents the model-to-human autonomic mismatch.
  proposed_experiments:
  - experiment_id: exp_adld_patient_derived_glial_coculture
    name: Patient-derived isogenic glial and neuronal co-culture study
    description: >-
      Compare LMNB1-duplication and corrected isogenic iPSC-derived astrocytes,
      oligodendrocytes, and neurons in co-culture, measuring LIF signaling,
      RAVER2/PTB-dependent PLP1 splicing, myelin-lipid programs, axon-myelin
      integrity, and rescue after LMNB1 normalization to distinguish primary
      from secondary cellular effects.
    experiment_type:
      preferred_term: Isogenic patient-derived iPSC co-culture perturbation study

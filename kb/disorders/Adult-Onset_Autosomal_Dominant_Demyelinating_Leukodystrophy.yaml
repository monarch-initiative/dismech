- name: Absence of Early Autonomic Involvement
  category: Neurologic
  subtype: Upstream Deletion-Related ADLD
  frequency: EXCLUDED
  phenotype_term:
    preferred_term: Autonomic dysfunction
    term:
      id: HP:0012332
      label: Abnormal autonomic nervous system physiology
    modifier: ABSENT
  notes: >-
    The absence is carried by `frequency: EXCLUDED`, which is what the HPOA
    exporter reads to emit a NOT-qualified row; `modifier: ABSENT` alone is not
    consulted by the export layer and documents intent only. Without EXCLUDED
    this block exported as a POSITIVE assertion that ADLD features abnormal
    autonomic physiology, cited to the two papers stating the opposite.
    `temporality: CHRONIC` was removed: it contradicts a claim about EARLY
    absence, and the cited evidence describes autonomic features as late when
    they appear at all.
  description: >-
    Curated as a deliberate negative contrast: autonomic features are the
    hallmark early sign of the duplication form but are largely absent early in
    the upstream-deletion form, appearing instead as a late consequence of
    established spasticity. This is one of the two OMIM criteria separating
    ADLDAT from ADLDTY.
  evidence:
  - reference: PMID:30842973
    reference_title: Genomic deletions upstream of lamin B1 lead to atypical autosomal dominant leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of note, early involvement of the autonomic nervous system was notable in only 1 patient with orthostatic intolerance and urinary urgency. In 2 patients, urinary urgency and incontinence were late features of the disorder, occurring only after development of severe lower limb spasticity."
    explanation: >-
      Documents that autonomic involvement is uncommon at onset and, when
      present, is a late feature in the deletion cohort.
  - reference: PMID:30697589
    reference_title: Duplication and deletion upstream of LMNB1 in autosomal dominant adult-onset leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with the deletion exhibited relatively earlier onset, more prominent cognitive impairment, and fewer autonomic symptoms than patients with duplication."
    explanation: An independent family confirms the reduced autonomic burden relative to duplication carriers.

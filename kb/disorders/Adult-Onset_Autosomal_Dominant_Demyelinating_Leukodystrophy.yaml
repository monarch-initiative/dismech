genetic:
- name: LMNB1
  gene_term:
    preferred_term: LMNB1
    term:
      id: hgnc:6637
      label: LMNB1
  association: Causative
  features: >-
    LMNB1 causes ADLD through increased expression, most often by whole-gene
    tandem duplication and more rarely by upstream regulatory deletion.
    Regulatory architecture matters in both classes: some larger tandem
    duplications predicted to preserve the oligodendrocyte silencer interaction
    were not associated with demyelination, whereas an inverted duplication
    predicted to disrupt that interaction was associated with severe ADLD.
  inheritance:
  - name: Autosomal dominant inheritance
    evidence:
    - reference: PMID:26053668
      reference_title: "LMNB1-related autosomal-dominant leukodystrophy: Clinical and radiological course."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Duplication of the LMNB1 gene encoding lamin B1 causes adult-onset autosomal-dominant leukodystrophy (ADLD) starting with autonomic symptoms, which are followed by pyramidal signs and ataxia."
      explanation: >-
        The title and abstract support autosomal-dominant inheritance in
        LMNB1-related ADLD.
    - reference: PMID:26749591
      reference_title: LMNB1-Related Autosomal Dominant Leukodystrophy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "LMNB1-related ADLD is inherited in an autosomal dominant manner."
      explanation: GeneReviews explicitly establishes the mode of inheritance.
  evidence:
  - reference: PMID:28769756
    reference_title: "An LMNB1 Duplication Caused Adult-Onset Autosomal Dominant Leukodystrophy in Chinese Family: Clinical Manifestations, Neuroradiology and Genetic Diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, Multiplex ligand-dependent probe amplification (MLPA) showed whole duplication of LMNB1 gene which is co-segregated with the disease phenotype in this family."
    explanation: >-
      The family study supports LMNB1 duplication as a causative structural
      variant.
  - reference: PMID:40046440
    reference_title: "Case report: LMNB1 duplication-mediated autosomal dominant adult leukodystrophy in a Chinese family and literature review of Chinese patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Currently, two genetic alterations have been identified in association with the pathogenesis of ADLD: LMNB1 gene tandem duplication and LMNB1 gene upstream deletions."
    explanation: Supports the two major LMNB1 gain-of-expression structural variant classes represented in this entry.
- name: LMNB1 upstream regulatory deletion
  subtype: Upstream Deletion-Related ADLD
  gene_term:
    preferred_term: LMNB1
    term:
      id: hgnc:6637
      label: LMNB1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Heterozygous, nonrecurrent deletions upstream of LMNB1 on 5q23.2,
    ranging from roughly 250 kb to 670 kb, that leave the LMNB1 coding
    sequence intact. The intervals can also delete neighboring genes, so
    regulatory describes the effect on LMNB1 rather than every sequence
    overlapped. Sequence-focused exome testing can miss these alleles;
    copy-number or structural-variant analysis is needed.
  evidence:
  - reference: PMID:30842973
    reference_title: Genomic deletions upstream of lamin B1 lead to atypical autosomal dominant leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients had unique nonrecurrent deletions upstream of the LMNB1, varying in size from 250 kb to 670 kb."
    explanation: Defines the size range and nonrecurrent character of the causative alleles.
  - reference: PMID:30697589
    reference_title: Duplication and deletion upstream of LMNB1 in autosomal dominant adult-onset leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found 2 patients from 1 family carrying a 249-kb genomic deletion upstream of LMNB1."
    explanation: An independent family carrying a deletion at the small end of the reported size range.
  - reference: PMID:30842973
    reference_title: Genomic deletions upstream of lamin B1 lead to atypical autosomal dominant leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given that these mutations do not alter the coding sequence, our data also emphasize the importance of regulatory elements and the need for performing analyses for copy number variants that might be missed with the standard whole-exome sequencing, currently being used to identify mutations in patients with leukodystrophies."
    explanation: >-
      States the diagnostic consequence of sparing the LMNB1 coding sequence,
      which is why exome sequencing is not an adequate first-tier test here.
variants:
- name: LMNB1 ADLD-1-TO upstream deletion (approximately 660 kb)
  regulatory_target_gene:
    preferred_term: LMNB1
    term:
      id: hgnc:6637
      label: LMNB1
  variant_type: deletion
  genomic_contexts:
  - coding sequence
  - intron
  - intergenic region
  description: >-
    Heterozygous deletion reported by Giorgio et al. in the ADLD-1-TO family,
    spanning hg19 chr5:125385805-126043053 and ending approximately 66 kb
    upstream of the LMNB1 promoter. The interval removes GRAMD3, ALDH7A1,
    and PHAX and intervening sequence while sparing LMNB1 itself. Its ADLD
    mechanism is altered regulation of LMNB1 rather than deletion of LMNB1
    coding sequence. Lamin B1 excess was demonstrated in frontal-lobe
    postmortem tissue. The original study proposed forebrain enhancer
    adoption; later work implicates loss of an oligodendrocyte silencer and
    leaves the additional requirement for ectopic enhancers unresolved.
  functional_effects:
  - function: LMNB1 transcriptional regulation
    type: Increased expression through altered regulatory contacts
    regulatory_element_type: TAD_BOUNDARY
    regulatory_mechanism: Boundary deletion with proposed enhancer adoption
    description: >-
      The rearrangement removes a topological boundary and changes the
      regulatory neighborhood of an intact LMNB1 promoter. This is increased
      expression in an affected tissue, not evidence by itself for a new
      protein activity or expression in a normally non-expressing cell type.
  - function: Oligodendrocyte-specific repression of LMNB1
    type: Loss of silencer-mediated repression
    regulatory_element_type: SILENCER
    regulatory_mechanism: Deletion of a CTCF-associated silencer region
    affected_cell_types:
    - preferred_term: oligodendrocyte
      term:
        id: CL:0000128
        label: oligodendrocyte
    description: >-
      The upstream-deletion class removes the silencer region characterized
      using CRISPR-edited cells and mouse models. These experiments support
      a mechanism for the human deletion class without directly testing this
      complete approximately 660 kb allele in human oligodendrocytes.
  evidence:
  - reference: PMID:25701871
    reference_title: "A large genomic deletion leads to enhancer adoption by the lamin B1 gene: a second path to autosomal dominant adult-onset demyelinating leukodystrophy (ADLD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients carry a large (∼660 kb) heterozygous deletion that begins 66 kb upstream of the LMNB1 promoter."
    explanation: >-
      Establishes the original familial upstream-deletion allele and its
      separation from the LMNB1 promoter; coordinates and neighboring-gene
      loss are reported in the paper's Results and Figure 2.
  - reference: PMID:25701871
    reference_title: "A large genomic deletion leads to enhancer adoption by the lamin B1 gene: a second path to autosomal dominant adult-onset demyelinating leukodystrophy (ADLD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lamin B1 overexpression was confirmed in further ADLD-1-TO tissues and in a postmortem brain sample, where lamin B1 was increased in the frontal lobe."
    explanation: Direct human-tissue evidence links this allele to increased lamin B1 expression.
  - reference: PMID:39910058
    reference_title: An oligodendrocyte silencer element underlies the pathogenic impact of lamin B1 structural variants.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "observed an increase in Lmnb1 expression only in Oli-neu cells but not in either the N2A or 3T3 cells"
    explanation: >-
      Deletion of the syntenic 19 kb regulatory segment in mouse cell lines
      supports oligodendrocyte-lineage silencer activity. This is indirect
      experimental support for the human upstream-deletion mechanism, not a
      test of the complete approximately 660 kb human allele.
- name: LMNB1 upstream deletion (249 kb; Japanese pedigree IV)
  regulatory_target_gene:
    preferred_term: LMNB1
    term:
      id: hgnc:6637
      label: LMNB1
  variant_type: deletion
  genomic_contexts:
  - coding sequence
  - intron
  - intergenic region
  description: >-
    Deletion at hg19 chr5:125855011-126103996 reported by Mezaki et al. in
    an independent Japanese family. It removes PHAX and ALDH7A1 and
    intervening sequence while sparing LMNB1. The affected family had
    leukodystrophy with pyramidal signs, ataxia, prominent cognitive
    impairment, and no apparent autonomic symptoms. Unlike the original
    deletion family's brain measurements, peripheral-leukocyte LMNB1 mRNA
    was not increased in the tested carrier; expression in brain was not
    measured in this family.
  functional_effects:
  - function: Tissue-dependent LMNB1 transcriptional regulation
    type: Proposed regulatory dysregulation with unchanged blood expression
    regulatory_element_type: TAD_BOUNDARY
    regulatory_mechanism: Deletion overlapping the proposed upstream insulator and Enh-A
    description: >-
      Overlap with the original ADLD deletion supports disruption of the same
      regulatory interval. The study did not demonstrate increased LMNB1
      expression in blood, and its proposed brain-specific effect should not
      be treated as a measured expression result for this allele.
  evidence:
  - reference: PMID:30697589
    reference_title: Duplication and deletion upstream of LMNB1 in autosomal dominant adult-onset leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The range of deletion was determined to be 249 kb (hg19 chr5: 125,855,011-126,103,996), which includes PHAX and ALDH7A1"
    explanation: Reports the allele's genomic interval, assembly, and neighboring genes removed.
  - reference: PMID:30697589
    reference_title: Duplication and deletion upstream of LMNB1 in autosomal dominant adult-onset leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The LMNB1 mRNA expression level in the blood of patient 5 with the deletion was comparable to those of control subjects and his unaffected mother"
    explanation: >-
      Directly supports the unchanged peripheral-blood readout; it does not
      establish expression levels in brain or exclude a tissue-dependent effect.
  - reference: PMID:30697589
    reference_title: Duplication and deletion upstream of LMNB1 in autosomal dominant adult-onset leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These patients showed pyramidal signs, ataxia, and prominent cognitive impairment. In contrast to the patients with duplication, patients with the deletion did not show apparent autonomic symptoms."
    explanation: Describes the clinical consequences associated with this independent upstream-deletion allele.
- name: LMNB1 inverted duplication (approximately 475 kb; BR-1/F4)
  gene:
    preferred_term: LMNB1
    term:
      id: hgnc:6637
      label: LMNB1
  regulatory_target_gene:
    preferred_term: LMNB1
    term:
      id: hgnc:6637
      label: LMNB1
  variant_type: duplication
  genomic_contexts:
  - coding sequence
  - intron
  - intergenic region
  description: >-
    Inverted duplication of approximately 475 kb, including LMNB1 and its
    upstream silencer region, inserted centromeric to LMNB1. The allele was
    described as BR-1 in the original structural analysis and F4 in the 2025
    functional study. It is associated with an accelerated ADLD phenotype.
    This coding-overlapping SV also has a proposed regulatory mechanism:
    its insertion and orientation separate the original LMNB1 copy from
    its silencer interaction. The silencer region is retained, so sequence
    content alone does not predict preserved regulation.
  functional_effects:
  - function: Long-range silencer control of LMNB1
    type: Increased expression with predicted disruption of silencer contact
    regulatory_element_type: SILENCER
    regulatory_mechanism: Inverted-duplication insertion alters promoter-silencer topology
    description: >-
      Orca chromatin-contact predictions indicated loss of the original
      promoter-silencer interaction despite retention of a silencer copy in
      the inverted duplicated segment. Patient-derived fibroblasts showed
      high LMNB1 expression, but that measurement is separate from the
      computational inference about the causal chromatin contact.
  evidence:
  - reference: PMID:39910058
    reference_title: An oligodendrocyte silencer element underlies the pathogenic impact of lamin B1 structural variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This patient did not have a head-to-tail tandem duplication but rather an inverted duplication (ADLD-Inv-Dup) that was inserted centromeric to the LMNB1 gene"
    explanation: Establishes the complex orientation and insertion site of the approximately 475 kb ADLD-associated allele.
  - reference: PMID:39910058
    reference_title: An oligodendrocyte silencer element underlies the pathogenic impact of lamin B1 structural variants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Fibroblasts derived from the F4-1 patient exhibited the highest level of LMNB1 expression"
    explanation: Patient-derived fibroblast experiments demonstrate increased expression for this allele.
  - reference: PMID:39910058
    reference_title: An oligodendrocyte silencer element underlies the pathogenic impact of lamin B1 structural variants.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "The Orca-prediction demonstrated that this inverted and duplicated 19 kb element forms an interaction with the original 19 kb element effectively sequestering the latter element and preventing its interaction with the non-duplicated LMNB1 gene"
    explanation: >-
      Supports the proposed regulatory-contact mechanism as a model prediction,
      distinct from direct chromatin-contact measurement in affected CNS tissue.
diagnosis:
- name: LMNB1 Copy-Number Testing
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Targeted LMNB1 deletion/duplication analysis, MLPA, array-CGH, or other
    validated copy-number methods are needed when the phenotype and MRI pattern
    suggest LMNB1-related ADLD.
  results: >-
    Heterozygous LMNB1 duplication or an upstream regulatory deletion supports
    the molecular diagnosis.
  evidence:
  - reference: PMID:28769756
    reference_title: "An LMNB1 Duplication Caused Adult-Onset Autosomal Dominant Leukodystrophy in Chinese Family: Clinical Manifestations, Neuroradiology and Genetic Diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In order to understand the genetic cause of the disease in this family, target exome capture based next generation sequencing has been done, but no causative variants or possibly pathogenic variants has been identified."
    explanation: >-
      The study shows that sequence-focused testing can miss the diagnosis.
  - reference: PMID:28769756
    reference_title: "An LMNB1 Duplication Caused Adult-Onset Autosomal Dominant Leukodystrophy in Chinese Family: Clinical Manifestations, Neuroradiology and Genetic Diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, Multiplex ligand-dependent probe amplification (MLPA) showed whole duplication of LMNB1 gene which is co-segregated with the disease phenotype in this family."
    explanation: >-
      MLPA copy-number testing identified the familial LMNB1 duplication after
      exome sequencing was unrevealing.
  - reference: PMID:26749591
    reference_title: LMNB1-Related Autosomal Dominant Leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of LMNB1-related ADLD is established in a proband with suggestive clinical and MRI findings and either an LMNB1 duplication or (more rarely) a heterozygous deletion upstream of the LMNB1 promoter identified by molecular genetic testing."
    explanation: >-
      GeneReviews defines molecular diagnosis by the characteristic clinical
      and MRI findings plus an LMNB1 duplication or upstream deletion.
  - reference: PMID:40933505
    reference_title: Clinical Practice Guidelines for the Diagnosis, Management, and Surveillance of LMNB1-Related Autosomal Dominant Leukodystrophy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Single-gene testing that can identify LMNB1 structural variants (duplications/deletions) at a high resolution is currently the optimal means of confirming a genetic diagnosis. Exome sequencing is not recommended as a first-tier test."
    explanation: >-
      The 2025 Delphi consensus guideline makes high-resolution structural-variant
      testing, not exome sequencing, the recommended confirmatory test, which is
      what allows the noncoding upstream deletion to be found at all.

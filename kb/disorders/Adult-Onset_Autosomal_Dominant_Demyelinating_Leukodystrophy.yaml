progression:
- phase: Presymptomatic radiologic disease
  notes: Brain and spinal-cord MRI abnormalities can precede clinical manifestations by more than a decade.
  evidence:
  - reference: PMID:26053668
    reference_title: "LMNB1-related autosomal-dominant leukodystrophy: Clinical and radiological course."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI abnormalities of the brain and spinal cord can precede clinical symptoms by more than a decade and are extensive in all symptomatic patients."
    explanation: The longitudinal study documents a presymptomatic imaging phase.
- phase: Early autonomic manifestations
  age_range: Fifth to sixth decade
  notes: Autonomic dysfunction commonly precedes or accompanies emerging gait and coordination difficulty.
  evidence:
  - reference: PMID:26053668
    reference_title: "LMNB1-related autosomal-dominant leukodystrophy: Clinical and radiological course."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autonomic dysfunction appeared in the fifth to sixth decade, preceding or together with gait and coordination difficulties."
    explanation: The cohort establishes the characteristic early clinical phase and timing.
- phase: Progressive pyramidal and bulbar disability
  age_range: Seventh decade in the longitudinal cohort
  notes: Motor signs can ascend from spastic paraplegia to tetraplegia and pseudobulbar palsy.
  evidence:
  - reference: PMID:26053668
    reference_title: "LMNB1-related autosomal-dominant leukodystrophy: Clinical and radiological course."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Motor signs developed ascending from spastic paraplegia to tetraplegia and pseudobulbar palsy in the seventh decade."
    explanation: The longitudinal study defines the later motor progression pattern.
- phase: Earlier onset in the upstream-deletion (atypical) subtype
  age_range: 32 to 52 years in the reported deletion cohort
  notes: >-
    Onset in deletion carriers can begin in the fourth decade or earlier,
    ahead of the fifth-to-sixth-decade autonomic onset typical of duplication
    carriers, and the presenting complaint is usually speech rather than
    autonomic.
  evidence:
  - reference: PMID:30842973
    reference_title: Genomic deletions upstream of lamin B1 lead to atypical autosomal dominant leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five patients from 3 independent families presented at ages ranging from 32 to 52 years with neurologic symptoms that included progressive hypophonia, upper and lower limb weakness and spasticity, and cerebellar dysfunction and MRIs characterized by widespread white matter alterations."
    explanation: Gives the age-at-onset range and presenting syndrome of the deletion cohort.
  - reference: PMID:30697589
    reference_title: Duplication and deletion upstream of LMNB1 in autosomal dominant adult-onset leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with the deletion exhibited relatively earlier onset, more prominent cognitive impairment, and fewer autonomic symptoms than patients with duplication."
    explanation: Independently supports earlier onset in deletion relative to duplication carriers.
pathophysiology:
- name: LMNB1 Overexpression
  description: >-
    Whole-gene duplication or upstream regulatory deletion increases LMNB1
    expression, establishing lamin B1 excess as the proximal molecular driver.
  genes:
  - preferred_term: LMNB1
    term:
      id: hgnc:6637
      label: LMNB1
  evidence:
  - reference: PMID:28769756
    reference_title: "An LMNB1 Duplication Caused Adult-Onset Autosomal Dominant Leukodystrophy in Chinese Family: Clinical Manifestations, Neuroradiology and Genetic Diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Duplication or over expression of the lamin B1 (LMNB1) gene causes ADLD."
    explanation: >-
      The family study directly links LMNB1 duplication/overexpression with
      adult-onset autosomal dominant leukodystrophy.
  - reference: PMID:25701871
    reference_title: "A large genomic deletion leads to enhancer adoption by the lamin B1 gene: a second path to autosomal dominant adult-onset demyelinating leukodystrophy (ADLD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chromosomal rearrangements with duplication of the lamin B1 (LMNB1) gene underlie autosomal dominant adult-onset demyelinating leukodystrophy (ADLD), a rare neurological disorder in which overexpression of LMNB1 causes progressive central nervous system demyelination."
    explanation: >-
      The structural-variant study supports LMNB1 overexpression as the shared
      mechanism driving progressive CNS demyelination.
  downstream:
  - target: Nuclear Lamina and Chromatin Perturbation
    causal_link_type: DIRECT
    description: Lamin B1 excess perturbs inner-nuclear-membrane proteins, chromatin organization, and cellular physiology.
    evidence:
    - reference: PMID:37450245
      reference_title: "Understanding the Ultra-Rare Disease Autosomal Dominant Leukodystrophy: an Updated Review on Morpho-Functional Alterations Found in Experimental Models."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "changes to its structural homeostasis might translate into functional alterations."
      explanation: The experimental-model review supports a functional consequence of altered nuclear-lamina homeostasis.
  - target: RAVER2/PTB-Dependent PLP1 Spliceopathy
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - LMNB1-dependent RAVER2 upregulation and inhibition of PTB splicing activity
    description: >-
      Patient-derived fibroblast and blood-cell studies link LMNB1 excess to
      RAVER2 upregulation and abnormal splicing of PTB targets including PLP1.
    evidence:
    - reference: PMID:37450245
      reference_title: "Understanding the Ultra-Rare Disease Autosomal Dominant Leukodystrophy: an Updated Review on Morpho-Functional Alterations Found in Experimental Models."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "Functional studies on mRNA extracted from skin fibroblasts and whole blood of ADLD patients demonstrated that RAVER2 expression is positively regulated by the levels of Lamin B1, being both proteins increased in ADLD cells."
      explanation: >-
        Patient-derived ex-vivo studies support LMNB1-dependent RAVER2
        upregulation, while the intervening transcriptional mechanism is not
        established.
  - target: Oligodendrocyte Lipid and Myelin Program Dysfunction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - altered oligodendrocyte chromatin marks and myelin-gene expression
    description: Model systems link LMNB1 overexpression to reduced myelin-lipid synthesis and altered oligodendrocyte differentiation.
    evidence:
    - reference: PMID:37450245
      reference_title: "Understanding the Ultra-Rare Disease Autosomal Dominant Leukodystrophy: an Updated Review on Morpho-Functional Alterations Found in Experimental Models."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Obser- vations made on LMNB1 overexpressing oligodendrocytes have been controversial"
      explanation: The review supports this model-derived branch but explicitly records conflicting oligodendrocyte results.
  - target: Astrocyte LIF-Support Dysfunction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - reduced LIF production and LIF-receptor signaling
    description: In-vitro astrocyte models suggest that LMNB1 overexpression reduces trophic support for myelinating oligodendrocytes.
    evidence:
    - reference: PMID:37450245
      reference_title: "Understanding the Ultra-Rare Disease Autosomal Dominant Leukodystrophy: an Updated Review on Morpho-Functional Alterations Found in Experimental Models."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "Cells displayed altered morphology, aberrant cellular signaling, reduced viability, and induction of reactivity"
      explanation: This is an evidence-qualified hypothesis from astrocyte models, not an established human causal bridge.
  - target: Axon-Myelin Unit Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Transgenic and neuronal models associate LMNB1 overexpression with axonal shortening, disintegration, and axon-myelin-unit degradation.
    evidence:
    - reference: PMID:37450245
      reference_title: "Understanding the Ultra-Rare Disease Autosomal Dominant Leukodystrophy: an Updated Review on Morpho-Functional Alterations Found in Experimental Models."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "axonal disintegration and the degradation of the axon-myelin unit"
      explanation: The edge is limited to model evidence; the intermediates and human relevance remain uncertain.
  - target: Central Nervous System Demyelination
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: LMNB1 overexpression causes CNS demyelination, while the intervening human cellular mechanism remains unresolved.
    evidence:
    - reference: PMID:25701871
      reference_title: "A large genomic deletion leads to enhancer adoption by the lamin B1 gene: a second path to autosomal dominant adult-onset demyelinating leukodystrophy (ADLD)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "overexpression of LMNB1 causes progressive central nervous system demyelination."
      explanation: Human genetic evidence supports the causal endpoint while not identifying the intervening cellular route.
- name: Enhancer Adoption From Upstream Deletion
  biological_scale: MOLECULAR
  description: >-
    Some families lack an LMNB1 coding duplication and instead have upstream
    deletions that disrupt regulatory boundaries, allowing ectopic enhancer
    activity to increase LMNB1 expression. This is the causal lesion of the
    atypical subtype recognized as MONDO:0700286 / OMIM ADLDAT. The deletions
    are nonrecurrent and vary in size, but comparison across families defines a
    shared minimal critical region spanning a topologically associating domain
    boundary.
  genes:
  - preferred_term: LMNB1
    term:
      id: hgnc:6637
      label: LMNB1
  evidence:
  - reference: PMID:25701871
    reference_title: "A large genomic deletion leads to enhancer adoption by the lamin B1 gene: a second path to autosomal dominant adult-onset demyelinating leukodystrophy (ADLD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The deletion eliminates a genome topological domain boundary, allowing normally forbidden interactions between at least three forebrain-directed enhancers and the LMNB1 promoter, in line with the observed mainly cerebral localization of lamin B1 overexpression and myelin degeneration."
    explanation: >-
      This supports a noncoding structural variant mechanism that converges on
      LMNB1 overexpression.
  - reference: PMID:30842973
    reference_title: Genomic deletions upstream of lamin B1 lead to atypical autosomal dominant leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Strikingly, this genomic region encompassed a boundary between 2 topologically associated domains (TADs) and strengthens our original hypothesis that a disruption of the TAD boundary causes LMNB1 overexpression and in turn the disease."
    explanation: >-
      Cross-family mapping localizes the shared critical region to a TAD
      boundary, supporting boundary disruption as the operative lesion.
  - reference: PMID:30842973
    reference_title: Genomic deletions upstream of lamin B1 lead to atypical autosomal dominant leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing the deletion junctions revealed the importance of repetitive elements (Alu, LINEs) in the genomic rearrangement."
    explanation: >-
      Identifies repeat-mediated rearrangement as the origin of the
      nonrecurrent deletions, explaining why each family carries a private allele.
  downstream:
  - target: LMNB1 Overexpression
    causal_link_type: DIRECT
    description: Enhancer adoption increases LMNB1 promoter activity and converges on lamin B1 overexpression.
    evidence:
    - reference: PMID:25701871
      reference_title: "A large genomic deletion leads to enhancer adoption by the lamin B1 gene: a second path to autosomal dominant adult-onset demyelinating leukodystrophy (ADLD)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The deletion eliminates a genome topological domain boundary, allowing normally forbidden interactions between at least three forebrain-directed enhancers and the LMNB1 promoter, in line with the observed mainly cerebral localization of lamin B1 overexpression and myelin degeneration."
      explanation: The deletion study directly supports enhancer adoption converging on cerebral LMNB1 overexpression.
    - reference: PMID:30842973
      reference_title: Genomic deletions upstream of lamin B1 lead to atypical autosomal dominant leukodystrophy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Expression analysis revealed increased LMNB1 expression in patient cells."
      explanation: Direct measurement in deletion-carrier cells confirms the convergence on increased LMNB1 expression.
  - target: Loss of the Oligodendrocyte-Specific LMNB1 Silencer Element
    causal_link_type: DIRECT
    description: >-
      The deleted interval contains a CTCF-based silencer element, so the
      upstream deletion removes the repressor outright rather than merely
      exposing the promoter to foreign enhancers.
    evidence:
    - reference: PMID:39910058
      reference_title: An oligodendrocyte silencer element underlies the pathogenic impact of lamin B1 structural variants.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In the case of the ADLD-Del, this silencer element is lost due to the upstream genomic deletion, leading to a similar overexpression"
      explanation: >-
        Places the silencer element inside the deleted interval, making its loss
        the direct consequence of the upstream deletion.
- name: Loss of the Oligodendrocyte-Specific LMNB1 Silencer Element
  biological_scale: MOLECULAR
  description: >-
    A CTCF-based silencer element upstream of LMNB1 normally holds lamin B1
    expression low specifically in oligodendrocytes, acting through
    three-dimensional chromatin looping and recruitment of the PRC2 repressor
    complex. Both ADLD routes remove that repression: the upstream deletion
    deletes the element, while a tandem duplication places an extra LMNB1 copy
    outside its control. This node is what makes the two molecular subtypes one
    disease, and it supplies the otherwise unexplained oligodendrocyte
    specificity of a phenotype caused by a ubiquitously expressed gene. The
    evidence is CRISPR-edited cell lines and mouse models plus human genotype
    comparison, not direct human CNS measurement.
  genes:
  - preferred_term: LMNB1
    term:
      id: hgnc:6637
      label: LMNB1
  - preferred_term: CTCF
    term:
      id: hgnc:13723
      label: CTCF
  biological_processes:
  - preferred_term: negative regulation of transcription by RNA polymerase II
    term:
      id: GO:0000122
      label: negative regulation of transcription by RNA polymerase II
    modifier: DECREASED
  - preferred_term: chromatin looping
    term:
      id: GO:0140588
      label: chromatin looping
    modifier: ABNORMAL
  evidence:
  - reference: PMID:39910058
    reference_title: An oligodendrocyte silencer element underlies the pathogenic impact of lamin B1 structural variants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we have identified a silencer element that is lost in ADLD patients and that specifically targets expression to oligodendrocytes"
    explanation: Establishes the silencer element and its oligodendrocyte-restricted action.
  - reference: PMID:39910058
    reference_title: An oligodendrocyte silencer element underlies the pathogenic impact of lamin B1 structural variants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This element consists of CTCF binding sites that mediate three-dimensional chromatin looping involving LMNB1 and the recruitment of the PRC2 transcriptional repressor complex."
    explanation: Specifies the molecular composition and repressive mechanism of the element.
  - reference: PMID:39910058
    reference_title: An oligodendrocyte silencer element underlies the pathogenic impact of lamin B1 structural variants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The loss of this silencer element in ADLD provides a parsimonious mechanism explaining tissue specificity and how both duplication and upstream deletion can lead to lamin B1 overexpression"
    explanation: >-
      Supports the unifying claim that silencer escape, not the structural
      variant class, is the shared proximal mechanism.
  downstream:
  - target: LMNB1 Overexpression
    causal_link_type: DIRECT
    description: >-
      Escape from silencer-mediated repression de-represses LMNB1 in
      oligodendrocytes, the cell type whose vulnerability defines the disease.
    evidence:
    - reference: PMID:39910058
      reference_title: An oligodendrocyte silencer element underlies the pathogenic impact of lamin B1 structural variants.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "As a result, the duplicated copy of the LMNB1 gene is no longer under the repressive control of the silencer element and overexpression occurs."
      explanation: States the de-repression step that links silencer escape to LMNB1 overexpression.
- name: Nuclear Lamina and Chromatin Perturbation
  description: >-
    Experimental models show cell-type-dependent nuclear and chromatin changes
    after LMNB1 overexpression. This node records a proximal effect without
    making it an oligodendrocyte-only causal bridge to human demyelination.
  biological_processes:

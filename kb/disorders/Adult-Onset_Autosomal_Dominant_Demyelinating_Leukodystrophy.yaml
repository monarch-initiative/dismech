name: Adult-Onset Autosomal Dominant Demyelinating Leukodystrophy
creation_date: "2026-05-06T03:14:37Z"
category: Neurodegenerative Disease
parents:
- Neurodegenerative Disease
disease_term:
  preferred_term: adult-onset autosomal dominant demyelinating leukodystrophy
  term:
    id: MONDO:0008215
    label: adult-onset autosomal dominant demyelinating leukodystrophy
description: >-
  Adult-onset autosomal dominant demyelinating leukodystrophy is a rare,
  slowly progressive neurodegenerative leukodystrophy characterized by central
  nervous system demyelination with autonomic dysfunction, pyramidal signs,
  ataxia, and variable cognitive impairment.
synonyms:
- LMNB1-related autosomal dominant leukodystrophy
- Autosomal dominant adult-onset demyelinating leukodystrophy
- ADLD
external_assertions:
- name: OMIM adult-onset autosomal dominant leukodystrophy record
  source: OMIM
  assertion_type: disease_record
  external_id: OMIM:169500
  description: >-
    OMIM disease identifier for the typical (LMNB1 duplication) form of
    adult-onset autosomal dominant demyelinating leukodystrophy, ADLDTY.
- name: OMIM atypical adult-onset autosomal dominant leukodystrophy record
  source: OMIM
  assertion_type: disease_record
  external_id: OMIM:621061
  description: >-
    OMIM disease identifier for the atypical form, ADLDAT, caused by
    heterozygous deletion upstream of LMNB1 rather than whole-gene duplication.
    This is the entity carried by MONDO:0700286, curated here as the Upstream
    Deletion-Related ADLD subtype rather than as a separate disease entry
    because the two forms converge on the same LMNB1 gain-of-expression
    mechanism.
has_subtypes:
- name: LMNB1 Duplication-Related ADLD
  display_name: Typical ADLD (LMNB1 duplication)
  classification: molecular
  genes:
  - preferred_term: LMNB1
    term:
      id: hgnc:6637
      label: LMNB1
  description: >-
    The classic molecular subtype caused by heterozygous LMNB1 duplication,
    producing lamin B1 overexpression and the typical autonomic, pyramidal,
    ataxic, and leukodystrophy phenotype. This is the form OMIM designates
    ADLDTY.
  evidence:
  - reference: DOI:10.1007/s44162-024-00055-w
    reference_title: A retrospective review of LMNB1-related autosomal dominant leukodystrophy
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All eight patients had LMNB1 duplication."
    explanation: Supports LMNB1 duplication as the molecular finding across the Mayo Clinic ADLD cohort.
- name: Upstream Deletion-Related ADLD
  display_name: Atypical ADLD (LMNB1 upstream deletion)
  classification: molecular
  subtype_term:
    preferred_term: atypical adult-onset autosomal dominant demyelinating leukodystrophy
    term:
      id: MONDO:0700286
      label: leukodystrophy, demyelinating, adult-onset, autosomal dominant, atypical
  genes:
  - preferred_term: LMNB1
    term:
      id: hgnc:6637
      label: LMNB1
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    description: >-
      The nonrecurrent upstream deletions segregate as heterozygous, fully
      penetrant dominant alleles across the reported multigenerational families.
    evidence:
    - reference: PMID:30842973
      reference_title: Genomic deletions upstream of lamin B1 lead to atypical autosomal dominant leukodystrophy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our findings confirmed the association between LMNB1 upstream deletions and leukodystrophy previously reported in a single family, expanding the phenotypic and molecular description of this condition."
      explanation: Three additional independent families confirm dominant segregation of the upstream-deletion allele with the leukodystrophy phenotype.
  description: >-
    A regulatory structural-variant subtype in which heterozygous upstream
    deletion removes a topological boundary and drives LMNB1 enhancer adoption
    without whole-gene duplication. OMIM separates this as ADLDAT, and MONDO
    as the "atypical" child term, because the clinical picture diverges from
    the duplication form: onset is earlier, speech symptoms rather than
    dysautonomia dominate the presentation, early autonomic involvement is
    absent, and cerebellar and spinal-cord involvement is comparatively
    limited. It remains a subtype rather than a separate disease entry because
    both routes converge on the same proximal driver, LMNB1 overexpression.
  evidence:
  - reference: PMID:25701871
    reference_title: "A large genomic deletion leads to enhancer adoption by the lamin B1 gene: a second path to autosomal dominant adult-onset demyelinating leukodystrophy (ADLD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This second route to LMNB1 overexpression and ADLD is a new example of the relevance of regulatory landscape modifications in determining Mendelian phenotypes."
    explanation: Supports upstream regulatory deletion and enhancer adoption as a distinct molecular route to ADLD.
  - reference: PMID:30842973
    reference_title: Genomic deletions upstream of lamin B1 lead to atypical autosomal dominant leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although clinical and radiologic features overlapped with those of autosomal dominant leukodystrophy because of LMNB1 duplications, patients with deletions upstream of LMNB1 had an earlier age at symptom onset, lacked early dysautonomia, and appeared to have lesser involvement of the cerebellum and sparing of the spinal cord diameter on MRI."
    explanation: >-
      This is the defining clinical and radiologic contrast that separates the
      atypical upstream-deletion form from the typical duplication form.
  - reference: PMID:30842973
    reference_title: Genomic deletions upstream of lamin B1 lead to atypical autosomal dominant leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients had unique nonrecurrent deletions upstream of the LMNB1, varying in size from 250 kb to 670 kb."
    explanation: >-
      Establishes that the causative alleles are nonrecurrent structural
      variants of variable size, not a single recurrent rearrangement.
  - reference: PMID:30697589
    reference_title: Duplication and deletion upstream of LMNB1 in autosomal dominant adult-onset leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with the deletion exhibited relatively earlier onset, more prominent cognitive impairment, and fewer autonomic symptoms than patients with duplication."
    explanation: >-
      An independent Japanese family reproduces the earlier-onset and
      reduced-dysautonomia contrast and adds prominent cognitive impairment.
  - reference: PMID:39910058
    reference_title: An oligodendrocyte silencer element underlies the pathogenic impact of lamin B1 structural variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most cases of ADLD are caused by tandem genomic duplications involving the lamin B1 gene (LMNB1) while a small subset are caused by genomic deletions upstream of the gene."
    explanation: Supports the upstream-deletion route as the minority molecular class within ADLD.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: Heterozygous LMNB1 gain-of-expression structural variants segregate in an autosomal dominant pattern.
  evidence:
  - reference: PMID:26053668
    reference_title: "LMNB1-related autosomal-dominant leukodystrophy: Clinical and radiological course."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Duplication of the LMNB1 gene encoding lamin B1 causes adult-onset autosomal-dominant leukodystrophy (ADLD) starting with autonomic symptoms, which are followed by pyramidal signs and ataxia."
    explanation: The longitudinal family study directly identifies the autosomal-dominant disease pattern.
prevalence:
- population: Worldwide published families
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: More than 30 affected families had been reported; this is literature ascertainment, not a population-rate estimate.

- name: Autonomic-System Involvement (Mechanism Unresolved)
  description: >-
    Autonomic dysfunction is often the first clinical manifestation. Because
    affected noradrenergic pathways include non-myelinated fibers, the causal
    route is not represented as a direct consequence of demyelination.
  evidence:
  - reference: PMID:26053668
    reference_title: "LMNB1-related autosomal-dominant leukodystrophy: Clinical and radiological course."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Duplication of the LMNB1 gene encoding lamin B1 causes adult-onset autosomal-dominant leukodystrophy (ADLD) starting with autonomic symptoms, which are followed by pyramidal signs and ataxia."
    explanation: >-
      The longitudinal cohort supports an autonomic-to-pyramidal/cerebellar
      clinical sequence downstream of LMNB1-related demyelinating disease.
  downstream:
  - target: Autonomic Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Unresolved LMNB1-related autonomic-system involvement manifests clinically as autonomic dysfunction.

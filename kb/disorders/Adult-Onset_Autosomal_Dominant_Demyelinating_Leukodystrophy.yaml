    explanation: Supports nuclear structural homeostasis as a relevant lamin B1-dependent process.
- name: RAVER2/PTB-Dependent PLP1 Spliceopathy
  description: >-
    LMNB1-dependent RAVER2 upregulation inhibits PTB splicing regulation and
    produces an abnormal splicing pattern that includes the major myelin gene
    PLP1. This patient-cell branch is plausible but has not been established as
    the causal bridge in human CNS tissue.

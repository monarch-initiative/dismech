discussions:
- discussion_id: gap_adld_model_to_human_cellular_mechanism
  prompt: >-
    Which oligodendrocyte, astrocyte, and axon-myelin-unit abnormalities caused
    by LMNB1 overexpression are causal in human ADLD, and what mechanism
    produces the early autonomic phenotype that current mouse models lack?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Oligodendrocyte Lipid and Myelin Program Dysfunction
  - pathophysiology#Astrocyte LIF-Support Dysfunction
  - pathophysiology#Axon-Myelin Unit Injury
  - pathophysiology#Autonomic-System Involvement (Mechanism Unresolved)
  rationale: >-
    Available mouse and cultured-cell models yield conflicting cell-type results
    and do not reproduce the early autonomic manifestations seen in patients.
    This mismatch prevents any one glial or axonal branch from being asserted as
    the established human bridge from LMNB1 overexpression to demyelination.
  evidence:
  - reference: PMID:37450245
    reference_title: "Understanding the Ultra-Rare Disease Autosomal Dominant Leukodystrophy: an Updated Review on Morpho-Functional Alterations Found in Experimental Models."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Indeed, neither of the two in vivo models is able to fully recapitulate the clinical phenotype observed in ADLD patients, since they do not display the autonomic symptoms that are characteristic of ADLD initial stages [36]."
    explanation: The review explicitly documents the model-to-human autonomic mismatch.
  proposed_experiments:
  - experiment_id: exp_adld_patient_derived_glial_coculture
    name: Patient-derived isogenic glial and neuronal co-culture study
    description: >-
      Compare LMNB1-duplication and corrected isogenic iPSC-derived astrocytes,
      oligodendrocytes, and neurons in co-culture, measuring LIF signaling,
      myelin-lipid programs, axon-myelin integrity, and rescue after LMNB1
      normalization to distinguish primary from secondary cellular effects.
    experiment_type:
      preferred_term: Isogenic patient-derived iPSC co-culture perturbation study

name: Adult-Onset Autosomal Dominant Demyelinating Leukodystrophy
creation_date: "2026-05-06T03:14:37Z"
category: Neurodegenerative Disease
parents:
- Neurodegenerative Disease
disease_term:
  preferred_term: adult-onset autosomal dominant demyelinating leukodystrophy
  term:
    id: MONDO:0008215
    label: adult-onset autosomal dominant demyelinating leukodystrophy
description: >-
  Adult-onset autosomal dominant demyelinating leukodystrophy is a rare,
  slowly progressive neurodegenerative leukodystrophy characterized by central
  nervous system demyelination with autonomic dysfunction, pyramidal signs,
  ataxia, and variable cognitive impairment.
synonyms:
- LMNB1-related autosomal dominant leukodystrophy
- Autosomal dominant adult-onset demyelinating leukodystrophy
- ADLD
external_assertions:
- name: OMIM adult-onset autosomal dominant leukodystrophy record
  source: OMIM
  assertion_type: disease_record
  external_id: OMIM:169500
  description: >-
    OMIM disease identifier for the typical (LMNB1 duplication) form of
    adult-onset autosomal dominant demyelinating leukodystrophy, ADLDTY.
- name: OMIM atypical adult-onset autosomal dominant leukodystrophy record
  source: OMIM
  assertion_type: disease_record
  external_id: OMIM:621061
  description: >-
    OMIM disease identifier for the atypical form, ADLDAT, caused by
    heterozygous deletion upstream of LMNB1 rather than whole-gene duplication.
    This is the entity carried by MONDO:0700286, curated here as the Upstream
    Deletion-Related ADLD subtype rather than as a separate disease entry
    because the two forms converge on the same LMNB1 gain-of-expression
    mechanism.
has_subtypes:
- name: LMNB1 Duplication-Related ADLD
  display_name: Typical ADLD (LMNB1 duplication)
  classification: molecular
  genes:
  - preferred_term: LMNB1
    term:
      id: hgnc:6637
      label: LMNB1
  description: >-
    The classic molecular subtype caused by heterozygous LMNB1 duplication,
    producing lamin B1 overexpression and the typical autonomic, pyramidal,
    ataxic, and leukodystrophy phenotype. This is the form OMIM designates
    ADLDTY.
  evidence:
  - reference: DOI:10.1007/s44162-024-00055-w
    reference_title: A retrospective review of LMNB1-related autosomal dominant leukodystrophy
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All eight patients had LMNB1 duplication."
    explanation: Supports LMNB1 duplication as the molecular finding across the Mayo Clinic ADLD cohort.
- name: Upstream Deletion-Related ADLD
  display_name: Atypical ADLD (LMNB1 upstream deletion)
  classification: molecular
  subtype_term:
    preferred_term: atypical adult-onset autosomal dominant demyelinating leukodystrophy
    term:
      id: MONDO:0700286
      label: leukodystrophy, demyelinating, adult-onset, autosomal dominant, atypical
  genes:
  - preferred_term: LMNB1
    term:
      id: hgnc:6637
      label: LMNB1
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    description: >-
      The nonrecurrent upstream deletions segregate as heterozygous, fully
      penetrant dominant alleles across the reported multigenerational families.
    evidence:
    - reference: PMID:30842973
      reference_title: Genomic deletions upstream of lamin B1 lead to atypical autosomal dominant leukodystrophy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our findings confirmed the association between LMNB1 upstream deletions and leukodystrophy previously reported in a single family, expanding the phenotypic and molecular description of this condition."
      explanation: Three additional independent families confirm dominant segregation of the upstream-deletion allele with the leukodystrophy phenotype.
  description: >-
    A regulatory structural-variant subtype in which heterozygous upstream
    deletion disrupts LMNB1 regulation without duplicating the gene. Loss of an
    oligodendrocyte silencer and enhancer adoption have been implicated; the
    requirement for ectopic enhancer activity remains unresolved. OMIM
    separates this as ADLDAT, and MONDO
    as the "atypical" child term, because the clinical picture diverges from
    the duplication form: onset is earlier, speech symptoms rather than
    dysautonomia dominate the presentation, early autonomic involvement is
    absent, and cerebellar and spinal-cord involvement is comparatively
    limited. It remains a subtype rather than a separate disease entry because
    both routes converge on the same proximal driver, LMNB1 overexpression.
  evidence:
  - reference: PMID:25701871
    reference_title: "A large genomic deletion leads to enhancer adoption by the lamin B1 gene: a second path to autosomal dominant adult-onset demyelinating leukodystrophy (ADLD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This second route to LMNB1 overexpression and ADLD is a new example of the relevance of regulatory landscape modifications in determining Mendelian phenotypes."
    explanation: Supports upstream regulatory deletion and enhancer adoption as a distinct molecular route to ADLD.
  - reference: PMID:30842973
    reference_title: Genomic deletions upstream of lamin B1 lead to atypical autosomal dominant leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although clinical and radiologic features overlapped with those of autosomal dominant leukodystrophy because of LMNB1 duplications, patients with deletions upstream of LMNB1 had an earlier age at symptom onset, lacked early dysautonomia, and appeared to have lesser involvement of the cerebellum and sparing of the spinal cord diameter on MRI."
    explanation: >-
      This is the defining clinical and radiologic contrast that separates the
      atypical upstream-deletion form from the typical duplication form.
  - reference: PMID:30842973
    reference_title: Genomic deletions upstream of lamin B1 lead to atypical autosomal dominant leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients had unique nonrecurrent deletions upstream of the LMNB1, varying in size from 250 kb to 670 kb."
    explanation: >-
      Establishes that the causative alleles are nonrecurrent structural
      variants of variable size, not a single recurrent rearrangement.
  - reference: PMID:30697589
    reference_title: Duplication and deletion upstream of LMNB1 in autosomal dominant adult-onset leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with the deletion exhibited relatively earlier onset, more prominent cognitive impairment, and fewer autonomic symptoms than patients with duplication."
    explanation: >-
      An independent Japanese family reproduces the earlier-onset and
      reduced-dysautonomia contrast and adds prominent cognitive impairment.
  - reference: PMID:39910058
    reference_title: An oligodendrocyte silencer element underlies the pathogenic impact of lamin B1 structural variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most cases of ADLD are caused by tandem genomic duplications involving the lamin B1 gene (LMNB1) while a small subset are caused by genomic deletions upstream of the gene."
    explanation: Supports the upstream-deletion route as the minority molecular class within ADLD.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: Heterozygous LMNB1 gain-of-expression structural variants segregate in an autosomal dominant pattern.
  evidence:
  - reference: PMID:26053668
    reference_title: "LMNB1-related autosomal-dominant leukodystrophy: Clinical and radiological course."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Duplication of the LMNB1 gene encoding lamin B1 causes adult-onset autosomal-dominant leukodystrophy (ADLD) starting with autonomic symptoms, which are followed by pyramidal signs and ataxia."
    explanation: The longitudinal family study directly identifies the autosomal-dominant disease pattern.
prevalence:
- population: Worldwide published families
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: More than 30 affected families had been reported; this is literature ascertainment, not a population-rate estimate.
  evidence:
  - reference: PMID:37450245
    reference_title: "Understanding the Ultra-Rare Disease Autosomal Dominant Leukodystrophy: an Updated Review on Morpho-Functional Alterations Found in Experimental Models."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "More than 30 affected families around the world have been reported to date."
    explanation: The review supplies a literature family count without implying population prevalence.
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: Exact population occurrence is not available.
  evidence:
  - reference: PMID:37450245
    reference_title: "Understanding the Ultra-Rare Disease Autosomal Dominant Leukodystrophy: an Updated Review on Morpho-Functional Alterations Found in Experimental Models."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, ADLD diagnosis is not always straightforward, therefore exact prevalence data are still lacking [5]."
    explanation: The source explicitly states that exact prevalence remains unknown.
progression:
- phase: Presymptomatic radiologic disease
  notes: Brain and spinal-cord MRI abnormalities can precede clinical manifestations by more than a decade.
  evidence:
  - reference: PMID:26053668
    reference_title: "LMNB1-related autosomal-dominant leukodystrophy: Clinical and radiological course."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI abnormalities of the brain and spinal cord can precede clinical symptoms by more than a decade and are extensive in all symptomatic patients."
    explanation: The longitudinal study documents a presymptomatic imaging phase.
- phase: Early autonomic manifestations
  age_range: Fifth to sixth decade
  notes: Autonomic dysfunction commonly precedes or accompanies emerging gait and coordination difficulty.
  evidence:
  - reference: PMID:26053668
    reference_title: "LMNB1-related autosomal-dominant leukodystrophy: Clinical and radiological course."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autonomic dysfunction appeared in the fifth to sixth decade, preceding or together with gait and coordination difficulties."
    explanation: The cohort establishes the characteristic early clinical phase and timing.
- phase: Progressive pyramidal and bulbar disability
  age_range: Seventh decade in the longitudinal cohort
  notes: Motor signs can ascend from spastic paraplegia to tetraplegia and pseudobulbar palsy.
  evidence:
  - reference: PMID:26053668
    reference_title: "LMNB1-related autosomal-dominant leukodystrophy: Clinical and radiological course."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Motor signs developed ascending from spastic paraplegia to tetraplegia and pseudobulbar palsy in the seventh decade."
    explanation: The longitudinal study defines the later motor progression pattern.
- phase: Earlier onset in the upstream-deletion (atypical) subtype
  age_range: 32 to 52 years in the reported deletion cohort
  notes: >-
    Onset in deletion carriers can begin in the fourth decade or earlier,
    ahead of the fifth-to-sixth-decade autonomic onset typical of duplication
    carriers, and the presenting complaint is usually speech rather than
    autonomic.
  evidence:
  - reference: PMID:30842973
    reference_title: Genomic deletions upstream of lamin B1 lead to atypical autosomal dominant leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five patients from 3 independent families presented at ages ranging from 32 to 52 years with neurologic symptoms that included progressive hypophonia, upper and lower limb weakness and spasticity, and cerebellar dysfunction and MRIs characterized by widespread white matter alterations."
    explanation: Gives the age-at-onset range and presenting syndrome of the deletion cohort.
  - reference: PMID:30697589
    reference_title: Duplication and deletion upstream of LMNB1 in autosomal dominant adult-onset leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with the deletion exhibited relatively earlier onset, more prominent cognitive impairment, and fewer autonomic symptoms than patients with duplication."
    explanation: Independently supports earlier onset in deletion relative to duplication carriers.
pathophysiology:
- name: LMNB1 Overexpression
  biological_scale: MOLECULAR
  description: >-
    Excess LMNB1 expression is a proximal molecular driver of ADLD.
    Increased lamin B1 was measured in frontal-lobe tissue from the original
    upstream-deletion family and in fibroblasts carrying the inverted
    duplication. This is quantitative overexpression in sampled tissues,
    not evidence that LMNB1 is newly expressed in a normally negative cell
    type. Peripheral-leukocyte expression was unchanged in the tested
    carrier of the independent 249 kb deletion, whose brain expression was
    not measured.
  biological_processes:
  - preferred_term: LMNB1 gene expression
    term:
      id: GO:0010467
      label: gene expression
    modifier: INCREASED
  genes:
  - preferred_term: LMNB1
    term:
      id: hgnc:6637
      label: LMNB1
  evidence:
  - reference: PMID:28769756
    reference_title: "An LMNB1 Duplication Caused Adult-Onset Autosomal Dominant Leukodystrophy in Chinese Family: Clinical Manifestations, Neuroradiology and Genetic Diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Duplication or over expression of the lamin B1 (LMNB1) gene causes ADLD."
    explanation: >-
      The family study directly links LMNB1 duplication/overexpression with
      adult-onset autosomal dominant leukodystrophy.
  - reference: PMID:25701871
    reference_title: "A large genomic deletion leads to enhancer adoption by the lamin B1 gene: a second path to autosomal dominant adult-onset demyelinating leukodystrophy (ADLD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chromosomal rearrangements with duplication of the lamin B1 (LMNB1) gene underlie autosomal dominant adult-onset demyelinating leukodystrophy (ADLD), a rare neurological disorder in which overexpression of LMNB1 causes progressive central nervous system demyelination."
    explanation: >-
      The structural-variant study supports LMNB1 overexpression as the shared
      mechanism driving progressive CNS demyelination.
  - reference: PMID:25701871
    reference_title: "A large genomic deletion leads to enhancer adoption by the lamin B1 gene: a second path to autosomal dominant adult-onset demyelinating leukodystrophy (ADLD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lamin B1 overexpression was confirmed in further ADLD-1-TO tissues and in a postmortem brain sample, where lamin B1 was increased in the frontal lobe."
    explanation: Direct tissue measurement supports overexpression in the original upstream-deletion family.
  - reference: PMID:30842973
    reference_title: Genomic deletions upstream of lamin B1 lead to atypical autosomal dominant leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Expression analysis revealed increased LMNB1 expression in patient cells."
    explanation: >-
      Expression analysis in an additional deletion-carrier cell sample
      supports overexpression, without generalizing to every carrier or tissue.
  - reference: PMID:39910058
    reference_title: An oligodendrocyte silencer element underlies the pathogenic impact of lamin B1 structural variants.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Fibroblasts derived from the F4-1 patient exhibited the highest level of LMNB1 expression"
    explanation: Direct measurement supports increased expression in inverted-duplication fibroblasts independently of the contact prediction.
  downstream:
  - target: Nuclear Lamina and Chromatin Perturbation
    causal_link_type: DIRECT
    description: Lamin B1 excess perturbs inner-nuclear-membrane proteins, chromatin organization, and cellular physiology.
    evidence:
    - reference: PMID:37450245
      reference_title: "Understanding the Ultra-Rare Disease Autosomal Dominant Leukodystrophy: an Updated Review on Morpho-Functional Alterations Found in Experimental Models."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "changes to its structural homeostasis might translate into functional alterations."
      explanation: The experimental-model review supports a functional consequence of altered nuclear-lamina homeostasis.
  - target: RAVER2/PTB-Dependent PLP1 Spliceopathy
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - LMNB1-dependent RAVER2 upregulation and inhibition of PTB splicing activity
    description: >-
      Patient-derived fibroblast and blood-cell studies link LMNB1 excess to
      RAVER2 upregulation and abnormal splicing of PTB targets including PLP1.
    evidence:
    - reference: PMID:37450245
      reference_title: "Understanding the Ultra-Rare Disease Autosomal Dominant Leukodystrophy: an Updated Review on Morpho-Functional Alterations Found in Experimental Models."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Functional studies on mRNA extracted from skin fibroblasts and whole blood of ADLD patients demonstrated that RAVER2 expression is positively regulated by the levels of Lamin B1, being both proteins increased in ADLD cells."
      explanation: >-
        Patient-derived ex-vivo studies support LMNB1-dependent RAVER2
        upregulation, while the intervening transcriptional mechanism is not
        established.
  - target: Oligodendrocyte Lipid and Myelin Program Dysfunction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - altered oligodendrocyte chromatin marks and myelin-gene expression
    description: Model systems link LMNB1 overexpression to reduced myelin-lipid synthesis and altered oligodendrocyte differentiation.
    evidence:
    - reference: PMID:37450245
      reference_title: "Understanding the Ultra-Rare Disease Autosomal Dominant Leukodystrophy: an Updated Review on Morpho-Functional Alterations Found in Experimental Models."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Obser- vations made on LMNB1 overexpressing oligodendrocytes have been controversial"
      explanation: The review supports this model-derived branch but explicitly records conflicting oligodendrocyte results.
  - target: Astrocyte LIF-Support Dysfunction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - reduced LIF production and LIF-receptor signaling
    description: In-vitro astrocyte models suggest that LMNB1 overexpression reduces trophic support for myelinating oligodendrocytes.
    evidence:
    - reference: PMID:37450245
      reference_title: "Understanding the Ultra-Rare Disease Autosomal Dominant Leukodystrophy: an Updated Review on Morpho-Functional Alterations Found in Experimental Models."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Cells displayed altered morphology, aberrant cellular signaling, reduced viability, and induction of reactivity"
      explanation: This is an evidence-qualified hypothesis from astrocyte models, not an established human causal bridge.
  - target: Axon-Myelin Unit Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Transgenic and neuronal models associate LMNB1 overexpression with axonal shortening, disintegration, and axon-myelin-unit degradation.
    evidence:
    - reference: PMID:37450245
      reference_title: "Understanding the Ultra-Rare Disease Autosomal Dominant Leukodystrophy: an Updated Review on Morpho-Functional Alterations Found in Experimental Models."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "axonal disintegration and the degradation of the axon-myelin unit"
      explanation: The edge is limited to model evidence; the intermediates and human relevance remain uncertain.
  - target: Central Nervous System Demyelination
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: LMNB1 overexpression causes CNS demyelination, while the intervening human cellular mechanism remains unresolved.
    evidence:
    - reference: PMID:25701871
      reference_title: "A large genomic deletion leads to enhancer adoption by the lamin B1 gene: a second path to autosomal dominant adult-onset demyelinating leukodystrophy (ADLD)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "overexpression of LMNB1 causes progressive central nervous system demyelination."
      explanation: Human genetic evidence supports the causal endpoint while not identifying the intervening cellular route.
- name: Upstream LMNB1 Regulatory Deletion
  biological_scale: MOLECULAR
  genetic_context:
    variant_type: deletion
    genomic_contexts:
    - coding sequence
    - intron
    - intergenic region
    variant_origin: GERMLINE
    description: >-
      The approximately 660 kb ADLD-1-TO and 249 kb Japanese-family deletions
      overlap neighboring genes and intergenic sequence while sparing LMNB1.
      LMNB1 is their regulatory target, not a deleted coding gene.
  description: >-
    Nonrecurrent upstream deletions define the atypical ADLD subtype. They
    remove regulatory sequence outside LMNB1 and can also delete PHAX,
    ALDH7A1, and other neighboring sequence. The structural lesion is
    distinct from its proposed enhancer-adoption and silencer-loss effects.
    The 249 kb allele was not associated with increased LMNB1 mRNA in the
    tested carrier's peripheral leukocytes; its brain expression was not
    measured.
  evidence:
  - reference: PMID:25701871
    reference_title: "A large genomic deletion leads to enhancer adoption by the lamin B1 gene: a second path to autosomal dominant adult-onset demyelinating leukodystrophy (ADLD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients carry a large (∼660 kb) heterozygous deletion that begins 66 kb upstream of the LMNB1 promoter."
    explanation: Establishes the physical upstream deletion in the original ADLD family.
  - reference: PMID:30697589
    reference_title: Duplication and deletion upstream of LMNB1 in autosomal dominant adult-onset leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The range of deletion was determined to be 249 kb (hg19 chr5: 125,855,011-126,103,996), which includes PHAX and ALDH7A1"
    explanation: Establishes the independent smaller deletion and its overlap with neighboring genes.
  - reference: PMID:30697589
    reference_title: Duplication and deletion upstream of LMNB1 in autosomal dominant adult-onset leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The LMNB1 mRNA expression level in the blood of patient 5 with the deletion was comparable to those of control subjects and his unaffected mother"
    explanation: Preserves the unchanged blood readout rather than inferring overexpression in every carrier or tissue.
  - reference: PMID:30842973
    reference_title: Genomic deletions upstream of lamin B1 lead to atypical autosomal dominant leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing the deletion junctions revealed the importance of repetitive elements (Alu, LINEs) in the genomic rearrangement."
    explanation: Localizes repeat-associated breakpoints in the nonrecurrent structural lesions.
  downstream:
  - target: Forebrain Enhancer Adoption
    causal_link_type: DIRECT
    description: >-
      Removing the upstream boundary changes the LMNB1 regulatory
      neighborhood and may permit contacts with forebrain-directed enhancers.
      The requirement for this mechanism remains hypothetical.
    evidence:
    - reference: PMID:25701871
      reference_title: "A large genomic deletion leads to enhancer adoption by the lamin B1 gene: a second path to autosomal dominant adult-onset demyelinating leukodystrophy (ADLD)."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: "The deletion eliminates a genome topological domain boundary, allowing normally forbidden interactions between at least three forebrain-directed enhancers and the LMNB1 promoter, in line with the observed mainly cerebral localization of lamin B1 overexpression and myelin degeneration."
      explanation: >-
        This interpretation combines 4C in cultured patient fibroblasts,
        cultured-cell reporters, and embryonic mouse enhancer assays. It
        indirectly supports the proposed human CNS mechanism, not a direct
        chromatin-contact measurement in human brain.
  - target: Loss of Oligodendrocyte-Specific LMNB1 Silencer Control
    causal_link_type: DIRECT
    description: >-
      The human upstream deletions remove a regulatory interval containing
      the silencer region. Deletion experiments in the syntenic mouse region
      support loss of repression, without directly testing the complete human
      alleles in human oligodendrocytes.
    evidence:
    - reference: PMID:39910058
      reference_title: An oligodendrocyte silencer element underlies the pathogenic impact of lamin B1 structural variants.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "observed an increase in Lmnb1 expression only in Oli-neu cells but not in either the N2A or 3T3 cells"
      explanation: >-
        The engineered 19 kb deletion demonstrates lineage-dependent silencer
        activity in mouse cell lines and indirectly supports the human deletion route.
- name: LMNB1 Inverted Duplication
  biological_scale: MOLECULAR
  genetic_context:
    gene:
      preferred_term: LMNB1
      term:
        id: hgnc:6637
        label: LMNB1
    variant_type: duplication
    genomic_contexts:
    - coding sequence
    - intron
    - intergenic region
    variant_origin: GERMLINE
    description: >-
      The approximately 475 kb BR-1/F4 allele duplicates LMNB1 and its upstream
      regulatory region in an inverted orientation and inserts the segment
      centromeric to LMNB1. The silencer sequence is retained.
  description: >-
    A complex inverted duplication involving LMNB1 is associated with
    accelerated ADLD. Its physical content includes the gene and silencer,
    while its proposed regulatory effect depends on insertion site and
    orientation. The altered promoter-silencer contact is a computational
    prediction, separate from the increased LMNB1 expression measured in
    patient-derived fibroblasts.
  evidence:
  - reference: PMID:39910058
    reference_title: An oligodendrocyte silencer element underlies the pathogenic impact of lamin B1 structural variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This patient did not have a head-to-tail tandem duplication but rather an inverted duplication (ADLD-Inv-Dup) that was inserted centromeric to the LMNB1 gene"
    explanation: Establishes the physical orientation and placement of the disease-associated duplication.
  downstream:
  - target: Predicted LMNB1 Promoter-Silencer Contact Disruption
    causal_link_type: DIRECT
    description: >-
      The inverted insertion is predicted to sequester the original silencer
      away from the original LMNB1 promoter despite retaining silencer DNA.
    evidence:
    - reference: PMID:39910058
      reference_title: An oligodendrocyte silencer element underlies the pathogenic impact of lamin B1 structural variants.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "The Orca-prediction demonstrated that this inverted and duplicated 19 kb element forms an interaction with the original 19 kb element effectively sequestering the latter element and preventing its interaction with the non-duplicated LMNB1 gene"
      explanation: The proposed contact consequence comes from Orca, not direct measurement in affected CNS tissue.
- name: Forebrain Enhancer Adoption
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Enhancer adoption was proposed from chromatin-contact and enhancer
    studies in the original upstream-deletion family. Cross-family mapping
    identifies a shared interval spanning a topological boundary, but later
    experiments also identify a silencer in this interval. Whether ectopic
    enhancer contact is required in addition to silencer loss remains
    unresolved. Ectopic contact does not by itself establish expression in
    a normally non-expressing cell type.
  genes:
  - preferred_term: LMNB1
    term:
      id: hgnc:6637
      label: LMNB1
  evidence:
  - reference: PMID:30842973
    reference_title: Genomic deletions upstream of lamin B1 lead to atypical autosomal dominant leukodystrophy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Strikingly, this genomic region encompassed a boundary between 2 topologically associated domains (TADs) and strengthens our original hypothesis that a disruption of the TAD boundary causes LMNB1 overexpression and in turn the disease."
    explanation: Supports the authors' boundary-disruption hypothesis without establishing its necessity.
  - reference: PMID:39910058
    reference_title: An oligodendrocyte silencer element underlies the pathogenic impact of lamin B1 structural variants.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In the case of ADLD-Del, it is yet unclear if interaction with the ectopic enhancer is also required for disease causation or whether deletion of the silencer element alone is sufficient"
    explanation: Explicitly limits the certainty of enhancer adoption as the human disease mechanism.
  downstream:
  - target: LMNB1 Overexpression
    causal_link_type: DIRECT
    description: >-
      Newly available enhancer contacts could increase LMNB1 promoter
      activity; this is a proposed contributor to the measured expression
      phenotype rather than a demonstrated requirement.
    evidence:
    - reference: PMID:25701871
      reference_title: "A large genomic deletion leads to enhancer adoption by the lamin B1 gene: a second path to autosomal dominant adult-onset demyelinating leukodystrophy (ADLD)."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: "The deletion eliminates a genome topological domain boundary, allowing normally forbidden interactions between at least three forebrain-directed enhancers and the LMNB1 promoter, in line with the observed mainly cerebral localization of lamin B1 overexpression and myelin degeneration."
      explanation: >-
        Cultured-fibroblast 4C, cultured-cell reporters, and mouse enhancer

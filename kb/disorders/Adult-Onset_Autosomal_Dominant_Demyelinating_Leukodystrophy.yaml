    supports: SUPPORT
    evidence_source: OTHER
    snippet: "More than 30 affected families around the world have been reported to date."
    explanation: The review supplies a literature family count without implying population prevalence.
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: Exact population occurrence is not available.
  evidence:
  - reference: PMID:37450245
    reference_title: "Understanding the Ultra-Rare Disease Autosomal Dominant Leukodystrophy: an Updated Review on Morpho-Functional Alterations Found in Experimental Models."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, ADLD diagnosis is not always straightforward, therefore exact prevalence data are still lacking [5]."

progression:
- phase: Presymptomatic radiologic disease
  notes: Brain and spinal-cord MRI abnormalities can precede clinical manifestations by more than a decade.
  evidence:
  - reference: PMID:26053668
    reference_title: "LMNB1-related autosomal-dominant leukodystrophy: Clinical and radiological course."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI abnormalities of the brain and spinal cord can precede clinical symptoms by more than a decade and are extensive in all symptomatic patients."
    explanation: The longitudinal study documents a presymptomatic imaging phase.
- phase: Early autonomic manifestations
  age_range: Fifth to sixth decade
  notes: Autonomic dysfunction commonly precedes or accompanies emerging gait and coordination difficulty.
  evidence:
  - reference: PMID:26053668
    reference_title: "LMNB1-related autosomal-dominant leukodystrophy: Clinical and radiological course."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Autonomic dysfunction appeared in the fifth to sixth decade, preceding or together with gait and coordination difficulties."
    explanation: The cohort establishes the characteristic early clinical phase and timing.
- phase: Progressive pyramidal and bulbar disability
  age_range: Seventh decade in the longitudinal cohort
  notes: Motor signs can ascend from spastic paraplegia to tetraplegia and pseudobulbar palsy.
  evidence:
  - reference: PMID:26053668
    reference_title: "LMNB1-related autosomal-dominant leukodystrophy: Clinical and radiological course."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Motor signs developed ascending from spastic paraplegia to tetraplegia and pseudobulbar palsy in the seventh decade."
    explanation: The longitudinal study defines the later motor progression pattern.
pathophysiology:
- name: LMNB1 Overexpression
  description: >-
    Whole-gene duplication or upstream regulatory deletion increases LMNB1
    expression, establishing lamin B1 excess as the proximal molecular driver.
  genes:
  - preferred_term: LMNB1
    term:
      id: hgnc:6637
      label: LMNB1
  evidence:
  - reference: PMID:28769756
    reference_title: "An LMNB1 Duplication Caused Adult-Onset Autosomal Dominant Leukodystrophy in Chinese Family: Clinical Manifestations, Neuroradiology and Genetic Diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Duplication or over expression of the lamin B1 (LMNB1) gene causes ADLD."
    explanation: >-
      The family study directly links LMNB1 duplication/overexpression with
      adult-onset autosomal dominant leukodystrophy.
  - reference: PMID:25701871
    reference_title: "A large genomic deletion leads to enhancer adoption by the lamin B1 gene: a second path to autosomal dominant adult-onset demyelinating leukodystrophy (ADLD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chromosomal rearrangements with duplication of the lamin B1 (LMNB1) gene underlie autosomal dominant adult-onset demyelinating leukodystrophy (ADLD), a rare neurological disorder in which overexpression of LMNB1 causes progressive central nervous system demyelination."
    explanation: >-
      The structural-variant study supports LMNB1 overexpression as the shared
      mechanism driving progressive CNS demyelination.
  downstream:
  - target: Nuclear Lamina and Chromatin Perturbation
    causal_link_type: DIRECT
    description: Lamin B1 excess perturbs inner-nuclear-membrane proteins, chromatin organization, and cellular physiology.
    evidence:
    - reference: PMID:37450245
      reference_title: "Understanding the Ultra-Rare Disease Autosomal Dominant Leukodystrophy: an Updated Review on Morpho-Functional Alterations Found in Experimental Models."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "changes to its structural homeostasis might translate into functional alterations."
      explanation: The experimental-model review supports a functional consequence of altered nuclear-lamina homeostasis.
  - target: Oligodendrocyte Lipid and Myelin Program Dysfunction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - altered oligodendrocyte chromatin marks and myelin-gene expression
    description: Model systems link LMNB1 overexpression to reduced myelin-lipid synthesis and altered oligodendrocyte differentiation.
    evidence:
    - reference: PMID:37450245
      reference_title: "Understanding the Ultra-Rare Disease Autosomal Dominant Leukodystrophy: an Updated Review on Morpho-Functional Alterations Found in Experimental Models."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Observations made on LMNB1 overexpressing oligodendrocytes have been controversial"
      explanation: The review supports this model-derived branch but explicitly records conflicting oligodendrocyte results.
  - target: Astrocyte LIF-Support Dysfunction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - reduced LIF production and LIF-receptor signaling
    description: In-vitro astrocyte models suggest that LMNB1 overexpression reduces trophic support for myelinating oligodendrocytes.
    evidence:
    - reference: PMID:37450245
      reference_title: "Understanding the Ultra-Rare Disease Autosomal Dominant Leukodystrophy: an Updated Review on Morpho-Functional Alterations Found in Experimental Models."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Cells displayed altered morphology, aberrant cellular signaling, reduced viability, and induction of reactivity"
      explanation: This is an evidence-qualified hypothesis from astrocyte models, not an established human causal bridge.
  - target: Axon-Myelin Unit Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Transgenic and neuronal models associate LMNB1 overexpression with axonal shortening, disintegration, and axon-myelin-unit degradation.
    evidence:
    - reference: PMID:37450245
      reference_title: "Understanding the Ultra-Rare Disease Autosomal Dominant Leukodystrophy: an Updated Review on Morpho-Functional Alterations Found in Experimental Models."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "axonal disintegration and the degradation of the axon-myelin unit"
      explanation: The edge is limited to model evidence; the intermediates and human relevance remain uncertain.
  - target: Central Nervous System Demyelination
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: LMNB1 overexpression causes CNS demyelination, while the intervening human cellular mechanism remains unresolved.
    evidence:
    - reference: PMID:25701871
      reference_title: "A large genomic deletion leads to enhancer adoption by the lamin B1 gene: a second path to autosomal dominant adult-onset demyelinating leukodystrophy (ADLD)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "overexpression of LMNB1 causes progressive central nervous system demyelination."
      explanation: Human genetic evidence supports the causal endpoint while not identifying the intervening cellular route.
- name: Enhancer Adoption From Upstream Deletion
  description: >-
    Some families lack an LMNB1 coding duplication and instead have upstream
    deletions that disrupt regulatory boundaries, allowing ectopic enhancer
    activity to increase LMNB1 expression.
  evidence:
  - reference: PMID:25701871
    reference_title: "A large genomic deletion leads to enhancer adoption by the lamin B1 gene: a second path to autosomal dominant adult-onset demyelinating leukodystrophy (ADLD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The deletion eliminates a genome topological domain boundary, allowing normally forbidden interactions between at least three forebrain-directed enhancers and the LMNB1 promoter, in line with the observed mainly cerebral localization of lamin B1 overexpression and myelin degeneration."
    explanation: >-
      This supports a noncoding structural variant mechanism that converges on
      LMNB1 overexpression.
  downstream:
  - target: LMNB1 Overexpression
    causal_link_type: DIRECT
    description: Enhancer adoption increases LMNB1 promoter activity and converges on lamin B1 overexpression.
    evidence:
    - reference: PMID:25701871
      reference_title: "A large genomic deletion leads to enhancer adoption by the lamin B1 gene: a second path to autosomal dominant adult-onset demyelinating leukodystrophy (ADLD)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The deletion eliminates a genome topological domain boundary, allowing normally forbidden interactions between at least three forebrain-directed enhancers and the LMNB1 promoter, in line with the observed mainly cerebral localization of lamin B1 overexpression and myelin degeneration."
      explanation: The deletion study directly supports enhancer adoption converging on cerebral LMNB1 overexpression.
- name: Nuclear Lamina and Chromatin Perturbation
  description: >-
    Experimental models show cell-type-dependent nuclear and chromatin changes
    after LMNB1 overexpression. This node records a proximal effect without
    making it an oligodendrocyte-only causal bridge to human demyelination.
  biological_processes:
  - preferred_term: chromatin organization
    term:
      id: GO:0006325
      label: chromatin organization
    modifier: ABNORMAL
  evidence:
  - reference: PMID:37450245
    reference_title: "Understanding the Ultra-Rare Disease Autosomal Dominant Leukodystrophy: an Updated Review on Morpho-Functional Alterations Found in Experimental Models."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "LMNB1 encodes for Lamin B1, a protein of the nuclear lamina. Lamin B1 regulates many cellular processes such as DNA replication, chromatin organization, and senescence."
    explanation: Supports nuclear-lamina and chromatin organization disruption as a proximal molecular consequence of LMNB1 overexpression.
  - reference: PMID:37450245
    reference_title: "Understanding the Ultra-Rare Disease Autosomal Dominant Leukodystrophy: an Updated Review on Morpho-Functional Alterations Found in Experimental Models."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Nevertheless, Lamin B1 together with the other lamins that constitute the nuclear lamina has firstly the key role of maintaining the nuclear structure."
    explanation: Supports nuclear structural homeostasis as a relevant lamin B1-dependent process.
- name: Oligodendrocyte Lipid and Myelin Program Dysfunction
  description: >-

- name: Brain MRI
  description: >-
    MRI can document cerebellar involvement in a neuropathy-predominant presentation. All four patients imaged in the 2018 reassessment had mild cerebellar atrophy, without white-matter
    abnormalities or brainstem atrophy; this is a cohort observation, not a validated diagnostic sensitivity.
  evidence:

- name: CMT2B2 patient-derived primary fibroblasts
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: Primary fibroblasts designated CMT2B2-I through V in the 2020 study
  publication: PMID:32504494
  description: Western blotting measured PNKP abundance. Nuclear ADP-ribose after 45 minutes with 10 micromolar camptothecin served as a sensitive cellular readout of unrepaired TOP1-associated single-strand breaks.
  notes: The MPZ p.Tyr145Ser CMT control line is a comparator, not a PNKP-CMT2B2 case. The paper reports no detectable IR-induced SSBR defect in CMT2B2 as unpublished observations. Protein abundance and isolated enzyme activities did not individually correlate strongly with clinical severity.

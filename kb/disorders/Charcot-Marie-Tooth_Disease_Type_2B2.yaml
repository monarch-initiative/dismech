differential_diagnoses:
- name: Ataxia with oculomotor apraxia type 4 (AOA4)
  description: >-
    The same gene and, in five of the reported CMT2B2 patients, literally one of
    the same alleles: p.Thr408del was described first in AOA4. AOA4 leads with
    ataxia and oculomotor apraxia; CMT2B2 leads with the neuropathy and has
    cerebellar signs that are mild by comparison. The distinction is one of
    severity and emphasis within an allelic spectrum, not of gene.
  evidence:
  - reference: PMID:32504494
    reference_title: "Pathological mutations in PNKP trigger defects in DNA single-strand break repair but not DNA double-strand break repair."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hereditary mutations in polynucleotide kinase-phosphatase (PNKP) result in a spectrum of neurological pathologies ranging from neurodevelopmental dysfunction in microcephaly with early onset seizures (MCSZ) to neurodegeneration in ataxia oculomotor apraxia-4 (AOA4) and Charcot-Marie-Tooth disease (CMT2B2)."
    explanation: Places the three PNKP entities on one spectrum.
    directness: INDIRECT
    quote_role: BACKGROUND
- name: Microcephaly with seizures and developmental delay (MCSZ)
  description: >-
    The severe neurodevelopmental end of the PNKP spectrum. It is excluded here on
    examination rather than by assumption: the reassessed CMT2B2 patients had no
    cognitive impairment, no microcephaly and no seizures.
  evidence:
  - reference: PMID:30039206
    reference_title: "The polynucleotide kinase 3'-phosphatase gene (PNKP) is involved in Charcot-Marie-Tooth disease (CMT2B2) previously related to MED25."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Detailed clinical reassessment of the initial family and the new individuals revealed in all an adult-onset slowly progressive CMT2 associated with signs of cerebellar dysfunction such as slurred speech and oculomotor involvement, but neither microcephaly, seizures, nor developmental delay."
    explanation: The examined absence of the MCSZ features.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
- name: PNKP neuropathy presenting before ataxia
  description: >-
    A separate report describes early-onset axonal sensorimotor neuropathy from
    PNKP variants with ataxia appearing only years later and without oculomotor
    apraxia. It matters for the differential because it means a PNKP patient can
    present as a pure CMT for a long time, so the absence of cerebellar signs at
    first assessment does not exclude the gene.
  evidence:
  - reference: PMID:27066567
    reference_title: Mutation in PNKP presenting initially as axonal Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "early-onset axonal sensory-motor neuropathy (or axonal Charcot-Marie-Tooth (CMT) disease) followed years later by ataxia without oculomotor apraxia can be caused by deleterious variants in PNKP"
    explanation: >-
      Establishes that PNKP disease can present as an isolated axonal neuropathy
      before any cerebellar sign appears.

    directness: DIRECT
    quote_role: PRIMARY_RESULT

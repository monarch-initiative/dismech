- population: Costa Rica (founder haplotype)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No prevalence estimate exists. The published series is one large
    consanguineous Costa Rican family plus five unrelated Costa Rican CMT2
    patients, all carrying the same ancestral founder haplotype. Whether the
    entity exists outside that founder population is unknown.
  evidence:
  - reference: PMID:30039206
    reference_title: "The polynucleotide kinase 3'-phosphatase gene (PNKP) is involved in Charcot-Marie-Tooth disease (CMT2B2) previously related to MED25."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "suggesting that this is an ancestral founder haplotype"
    explanation: >-
      The reported patients all carry one ancestral haplotype, which is why the
      case count is not a population estimate.


  notes: >-
    The 2018 series includes the original Costa Rican founder family and five additional unrelated Costa Rican patients. These are ascertained cases, not a population prevalence estimate.
    Adult PNKP-associated polyneuropathy with cerebellar signs was subsequently reported in an Italian patient; the Costa Rican founder allele is not asserted to encompass every adult
    PNKP neuropathy.
  evidence:
  - reference: PMID:30039206
    reference_title: "The polynucleotide kinase 3'-phosphatase gene (PNKP) is involved in Charcot-Marie-Tooth disease (CMT2B2) previously related to MED25."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: all the unrelated individuals heterozygous for the MED25 variant not belonging to the extended family were also heterozygous for this PNKP variant, suggesting that this is an ancestral founder haplotype.
    explanation: The founder haplotype carries PNKP p.Gln517Ter and MED25 p.Ala335Val; it does not place p.Thr408del on the same chromosome.
  - reference: PMID:31436889
    reference_title: "From congenital microcephaly to adult onset cerebellar ataxia: Distinct and overlapping phenotypes in patients with PNKP gene mutations."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: Patient 3 is one of the oldest patients described to date and presented polyneuropathy, and cerebellar signs.
    explanation: An Italian PNKP-spectrum case establishes broader geographic occurrence of adult neuropathy with cerebellar involvement; the abstract does not establish the Costa Rican founder genotype.

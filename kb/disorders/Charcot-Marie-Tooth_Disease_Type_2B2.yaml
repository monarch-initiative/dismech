- name: PNKP
  gene_term:
    preferred_term: PNKP
    term:
      id: hgnc:9154
      label: PNKP
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal Recessive
  notes: >-
    PNKP encodes the bifunctional DNA end-processing enzyme polynucleotide kinase 3'-phosphatase. The original family carries homozygous c.1549C>T (p.Gln517Ter), whereas five additional
    Costa Rican patients carry p.Gln517Ter in trans with c.1221_1223del (p.Thr408del). Only the p.Gln517Ter allele cosegregates with MED25 p.Ala335Val on the founder haplotype. Genotype
    does not establish a strict clinical boundary between neuropathy-predominant disease and AOA4.
  evidence:
  - reference: PMID:30039206
    reference_title: "The polynucleotide kinase 3'-phosphatase gene (PNKP) is involved in Charcot-Marie-Tooth disease (CMT2B2) previously related to MED25."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using exome sequencing, we now identified a homozygous nonsense variant (p.Gln517ter) in the last exon of an adjacent gene, the polynucleotide kinase 3'-phosphatase (PNKP) gene."
    explanation: The gene assignment for this entity.
    directness: DIRECT
    quote_role: PRIMARY_RESULT
  - reference: CGGV:assertion_c0e0d66f-c68d-4df3-bab2-71afc448e4b0-2021-03-22T201527.084Z
    reference_title: "MED25 / Charcot-Marie-Tooth disease type 2B2 (Disputed)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Re-assessing the first and only reported family by WES, Leal et al. identified a homozygous stop mutation in PNKP, a gene that is located in the same linkage region"
    explanation: >-
      ClinGen's account of the reassignment, from the panel that disputed the
      previous gene.
    directness: DIRECT

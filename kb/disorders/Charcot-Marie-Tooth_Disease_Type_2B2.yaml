discussions:
- discussion_id: gap_cmt2b2_med25_modifier
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the MED25 p.Ala335Val variant contribute anything to the CMT2B2
    phenotype, or is it purely a passenger on the founder haplotype?
  rationale: >-
    The founder haplotype confounds PNKP p.Gln517Ter with MED25 p.Ala335Val. Five additional patients have two pathogenic PNKP alleles but only one MED25 allele. The 2018 authors proposed
    a possible protective modifier effect of homozygous MED25, but age, genotype and ascertainment were not controlled. The 2009 study demonstrated altered SH3-peptide binding and Med25/Pmp22
    coexpression in Pmp22 animal models, not a PNKP disease model or modifier rescue experiment.
  attaches_to:
  - genetic#MED25
  - pathophysiology#Homozygous PNKP p.Gln517Ter
  - pathophysiology#Compound Heterozygous PNKP p.Gln517Ter and p.Thr408del
  evidence:
  - reference: PMID:30039206
    reference_title: "The polynucleotide kinase 3'-phosphatase gene (PNKP) is involved in Charcot-Marie-Tooth disease (CMT2B2) previously related to MED25."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: it would be possible to hypothesize that the MED25 variant confers a protective effect in them.
    explanation: A protective modifier effect was proposed, not established.
  - reference: PMID:19290556
    reference_title: "Identification of the variant Ala335Val of MED25 as responsible for CMT2B2: molecular data, functional studies of the SH3 recognition motif and correlation between wild-type MED25 and PMP22 RNA levels in CMT1A animal models."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: the p.A335V mutation has little influence on transcription activation
    explanation: The original GAL4 reporter did not show a large generic transcriptional effect; SH3 binding results do not establish clinical modification.
- discussion_id: gap_cmt2b2_neuron_break_burden
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the single-strand break burden actually raised in the peripheral neurons
    and cerebellar neurons of PNKP patients, and does it explain why those cells
    and not others degenerate?
  rationale: >-
    CMT2B2 repair measurements were made in fibroblasts and lymphoblastoid cells, not neurons. Reduced CPT-induced SSBR is demonstrated, while the proposed link to endogenous TOP1 damage,
    neuronal selectivity and clinical severity requires direct testing. Residual protein or isolated kinase/phosphatase activity alone did not correlate strongly with disease severity.
  attaches_to:
  - pathophysiology#Accumulation of Unrepaired Single-Strand Breaks in Post-Mitotic Neurons
  - pathophysiology#Impaired DNA Single-Strand Break Repair

- discussion_id: cmt2b2_repair_assay_scope
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: How do genotype, cell type and damage source affect PNKP-associated double-strand break repair?
  rationale: 'The 2020 negative DSBR assays used MCSZ and combined AOA4/MCSZ fibroblasts after IR or camptothecin. The 2015 homozygous p.Thr408del neuropathy case had persistent gamma-H2AX after hydrogen peroxide/doxorubicin, interpreted as impaired BER/NHEJ. These results are not interchangeable: genotype, assay, timing and damage source differ, and neither establishes normal DSBR in all CMT2B2 neurons.'
  attaches_to:
  - pathophysiology#Impaired DNA Single-Strand Break Repair
  evidence:
  - reference: PMID:32504494
    reference_title: Pathological mutations in PNKP trigger defects in DNA single-strand break repair but not DNA double-strand break repair.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: primary fibroblasts derived from individuals with MCSZ or with combined AOA4/MCSZ exhibit normal rates of DSBR following treatment with either ionising radiation (IR) or camptothecin (CPT)
    explanation: The detailed experimental scope is narrower than the abstract’s spectrum-wide summary.
  - reference: PMID:27066567
    reference_title: Mutation in PNKP presenting initially as axonal Charcot-Marie-Tooth disease.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: after 24 hours, the PNKP-mutated cells showed a much larger population of γH2AX-positive cells than the control cells, and this persisted even after 72 hours
    explanation: A distinct genotype and assay showed persistent damage; this is not a direct contradiction within the same experimental system.

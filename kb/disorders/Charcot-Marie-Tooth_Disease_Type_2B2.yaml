pathophysiology:
- name: Biallelic PNKP Loss-of-Function Variant
  role: trigger
  biological_scale: MOLECULAR
  description: >-
    The founding family is homozygous for PNKP c.1549C>T p.Gln517ter, a nonsense
    variant in the last exon that removes the final five residues. Five further
    Costa Rican patients are compound heterozygous for that allele and
    c.1221_1223del p.Thr408del, an in-frame deletion previously reported in
    ataxia with oculomotor apraxia type 4. Both alleles sit on the same ancestral
    haplotype as the MED25 p.Ala335Val variant that was originally proposed as
    causative, which is why an exhaustive Sanger screen of the interval reached
    the wrong gene in 2009.
  genetic_context:
    allele_type: SNV
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:30039206
    reference_title: "The polynucleotide kinase 3'-phosphatase gene (PNKP) is involved in Charcot-Marie-Tooth disease (CMT2B2) previously related to MED25."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using exome sequencing, we now identified a homozygous nonsense variant (p.Gln517ter) in the last exon of an adjacent gene, the polynucleotide kinase 3'-phosphatase (PNKP) gene."
    explanation: >-
      The gene-discovery statement that reassigns CMT2B2 from MED25 to PNKP.
  - reference: PMID:30039206
    reference_title: "The polynucleotide kinase 3'-phosphatase gene (PNKP) is involved in Charcot-Marie-Tooth disease (CMT2B2) previously related to MED25."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It consists of a three-base deletion in exon 14, c.1221_1223del"
    explanation: >-
      The second allele, carried in compound heterozygosity by the five later
      patients.
  - reference: CGGV:assertion_c0e0d66f-c68d-4df3-bab2-71afc448e4b0-2021-03-22T201527.084Z
    reference_title: "MED25 / Charcot-Marie-Tooth disease type 2B2 (Disputed)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The authors identified 5 further families carrying biallelic loss-of-function mutations in PNKP as well, pointing towards the pathogenicity of this gene over MED25."
    explanation: >-
      ClinGen's independent reading of the same evidence, naming PNKP as the
      causative gene for this entity.
  downstream:
  - target: Destabilised PNKP C-Terminus and Loss of DNA End-Processing Activity
    causal_link_type: DIRECT
    description: >-
      The truncated residues are structural, so the first consequence is on the
      enzyme itself.
- name: Destabilised PNKP C-Terminus and Loss of DNA End-Processing Activity
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    PNKP is bifunctional: a 5'-kinase and a 3'-phosphatase that together convert
    damaged break termini into the 5'-phosphate/3'-hydroxyl ends that ligation
    requires. Its two catalytic domains both bind DNA and the C-terminus is
    buried between them, contacting residues in each. The residues removed by
    p.Gln517ter are exactly those contacts, so the predicted lesion is
    destabilisation of the folded enzyme rather than loss of a catalytic residue.
  molecular_functions:
  - preferred_term: PNKP polynucleotide 5'-kinase activity
    term:
      id: GO:0016301
      label: kinase activity
    modifier: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:30039206
    reference_title: "The polynucleotide kinase 3'-phosphatase gene (PNKP) is involved in Charcot-Marie-Tooth disease (CMT2B2) previously related to MED25."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PKNP catalyzes the 5-prime phosphorylation of nucleic acids and also has an associated 3-prime phosphatase activity"
    explanation: >-
      The two enzymatic activities of PNKP. The source spells the gene PKNP here;
      the quote is reproduced as printed.
  - reference: PMID:30039206
    reference_title: "The polynucleotide kinase 3'-phosphatase gene (PNKP) is involved in Charcot-Marie-Tooth disease (CMT2B2) previously related to MED25."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "PNKP contains a kinase and a phosphate domain that are both involved in DNA binding."
    explanation: >-
      The domain architecture behind the structural-destabilisation reading. The
      structural analysis in that paper is a homology model of human PNKP built on
      the murine crystal structure, so it is graded as computational.
  downstream:
  - target: Impaired DNA Single-Strand Break Repair
    causal_link_type: DIRECT
    description: >-
      Without correctly processed termini, the ligation step of single-strand
      break repair cannot proceed.
- name: Impaired DNA Single-Strand Break Repair
  role: central_effector
  biological_scale: MOLECULAR
  description: >-
    Primary fibroblasts from PNKP patients spanning the whole disease spectrum
    show a markedly reduced rate of single-strand break repair. The same study
    looked for a double-strand break repair defect and did not find one, which
    matters because PNKP participates in both pathways and the double-strand
    route would have been the natural assumption. Restoring repair in those cells
    needed both catalytic activities plus the FHA domain that binds XRCC1.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: single strand break repair
    term:
      id: GO:0000012
      label: single strand break repair
    modifier: DECREASED
  evidence:
  - reference: PMID:32504494
    reference_title: "Pathological mutations in PNKP trigger defects in DNA single-strand break repair but not DNA double-strand break repair."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast, the rate of SSB repair (SSBR) is markedly reduced."
    explanation: >-
      The measured repair deficit in patient-derived fibroblasts.
  - reference: PMID:32504494
    reference_title: "Pathological mutations in PNKP trigger defects in DNA single-strand break repair but not DNA double-strand break repair."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "did not detect a significant defect in DSB repair (DSBR) in primary fibroblasts from PNKP patients spanning the spectrum of PNKP-mutated pathologies."
    explanation: >-
      Cited against the alternative reading of this node, that the lesion is in
      double-strand break repair. It is a negative result and is curated as one.
  - reference: PMID:32504494
    reference_title: "Pathological mutations in PNKP trigger defects in DNA single-strand break repair but not DNA double-strand break repair."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Hereditary mutations in polynucleotide kinase-phosphatase (PNKP) result in a spectrum of neurological pathologies ranging from neurodevelopmental dysfunction in microcephaly with early onset seizures (MCSZ) to neurodegeneration in ataxia oculomotor apraxia-4 (AOA4) and Charcot-Marie-Tooth disease (CMT2B2)."
    explanation: >-
      Places CMT2B2 explicitly inside the PNKP allelic spectrum whose repair
      biology this study measured, so the cellular result is about this disease
      and not only about its severe siblings.
  downstream:
  - target: Accumulation of Unrepaired Single-Strand Breaks in Post-Mitotic Neurons
    causal_link_type: DIRECT
    description: >-
      A reduced repair rate in cells that cannot dilute damage by division leaves
      breaks outstanding.
- name: Accumulation of Unrepaired Single-Strand Breaks in Post-Mitotic Neurons
  role: effector
  biological_scale: CELLULAR
  description: >-
    The step from a measured repair-rate deficit in fibroblasts to break burden
    in human neurons is an inference, not a measurement, and is curated as one.
    What supports it is that the study's own conclusion frames reduced
    single-strand break repair as the source of the neurodegenerative as well as
    the neurodevelopmental pathology, and that the extent of the reduction tracks
    disease severity.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: DNA repair
    term:
      id: GO:0006281
      label: DNA repair
    modifier: DECREASED
  evidence:
  - reference: PMID:32504494
    reference_title: "Pathological mutations in PNKP trigger defects in DNA single-strand break repair but not DNA double-strand break repair."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "these data implicate reduced rates of SSBR, not DSBR, as the source of both neurodevelopmental and neurodegenerative pathology in PNKP-mutated disease"
    explanation: >-
      The authors' own attribution of the neurodegenerative arm of PNKP disease to
      the single-strand break repair deficit. Graded INDIRECT because the
      measurement is in fibroblasts and the claim is about neurons.
  downstream:
  - target: Length-Dependent Peripheral Axonal Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      No intermediate step between outstanding breaks and axonal loss is
      established in the sources curated here.
  - target: Cerebellar Neuronal Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same unresolved gap applies to the cerebellar arm.
- name: Length-Dependent Peripheral Axonal Degeneration
  role: effector
  biological_scale: TISSUE
  conforms_to: "peripheral_axonal_degeneration#Distal Axonal Degeneration and Demyelination"
  description: >-
    Every reported patient, from the original family and from the five later
    families, was diagnosed clinically and electrophysiologically with an axonal
    peripheral polyneuropathy. Nerve conduction shows a severe reduction of the
    compound muscle action potential with relative preservation of F-wave latency
    - the axonal-loss pattern, not a demyelinating one - and in the most affected
    patient the CMAP could not be recorded at all.
  cell_types:
  - preferred_term: sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  evidence:
  - reference: PMID:30039206
    reference_title: "The polynucleotide kinase 3'-phosphatase gene (PNKP) is involved in Charcot-Marie-Tooth disease (CMT2B2) previously related to MED25."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients from the large Costa Rican family and the five additional families were clinically and electrophysiologically diagnosed with axonal peripheral polyneuropathy."
    explanation: >-
      Establishes the axonal polyneuropathy across the whole reported series.
  - reference: PMID:30039206
    reference_title: "The polynucleotide kinase 3'-phosphatase gene (PNKP) is involved in Charcot-Marie-Tooth disease (CMT2B2) previously related to MED25."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the electrophysiological analysis demonstrated a severe reduction of the CMAP of affected nerves with relative preservation of F-waves latency"
    explanation: >-
      The electrophysiological signature of axonal loss that this node asserts.
  downstream:
  - target: Adult-Onset Axonal Sensorimotor Polyneuropathy
    causal_link_type: DIRECT
    description: >-
      Progressive length-dependent fibre loss is the leading clinical problem.
- name: Cerebellar Neuronal Injury
  role: effector
  biological_scale: TISSUE
  conforms_to: "cerebellar_purkinje_degeneration#Cerebellar Neuron Insult"
  description: >-
    Brain MRI showed cerebellar atrophy in every individual studied, with no
    white-matter abnormality and no brain or brainstem atrophy. The
    cerebellum is therefore involved but selectively and mildly compared with the
    severe end of the PNKP spectrum. No neuropathology is available in this
    entity, so the cellular target within the cerebellum is not identified here
    and Purkinje-cell loss specifically is not asserted.
  evidence:
  - reference: PMID:30039206
    reference_title: "The polynucleotide kinase 3'-phosphatase gene (PNKP) is involved in Charcot-Marie-Tooth disease (CMT2B2) previously related to MED25."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI of the brain revealed cerebellar atrophy with no white matter abnormalities, brain atrophy, nor brainstem atrophy, in all studied individuals"
    explanation: >-
      The imaging finding, including the negatives that bound how far the
      cerebellar claim extends.
  - reference: PMID:30039206
    reference_title: "The polynucleotide kinase 3'-phosphatase gene (PNKP) is involved in Charcot-Marie-Tooth disease (CMT2B2) previously related to MED25."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Homozygous variants in this gene were previously linked to progressive cerebellar atrophy and polyneuropathy [6]"
    explanation: >-
      The combination of cerebellar atrophy with polyneuropathy was already on
      record for PNKP before this entity was reassigned to it.
  downstream:
  - target: Mild Cerebellar Dysfunction
    causal_link_type: DIRECT
    description: >-
      Cerebellar atrophy is expressed clinically as dysarthria and oculomotor
      signs rather than as a disabling ataxia.
- name: Adult-Onset Axonal Sensorimotor Polyneuropathy
  role: outcome
  biological_scale: ORGANISM
  conforms_to: "peripheral_axonal_degeneration#Peripheral Neuropathy"
  description: >-
    A symmetric motor and sensory neuropathy with distal muscle wasting and
    impaired deep tendon reflexes, beginning between the ages of 28 and 42 in the
    original family, progressing slowly, and ending in loss of independent
    ambulation in the most advanced patient.
  evidence:
  - reference: PMID:30039206
    reference_title: "The polynucleotide kinase 3'-phosphatase gene (PNKP) is involved in Charcot-Marie-Tooth disease (CMT2B2) previously related to MED25."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "presented with a symmetric motor and sensory neuropathy, distal muscle wasting, impaired deep tendon reflexes, and age at onset between 28 and 42 years."
    explanation: >-
      The clinical syndrome and its adult age of onset in the founding family.
  downstream:
  - target: Distal Muscle Weakness
    causal_link_type: DIRECT
    description: Length-dependent motor fibre loss.
  - target: Distal Amyotrophy
    causal_link_type: DIRECT
    description: Denervation atrophy of intrinsic hand and foot muscles and calves.
  - target: Areflexia
    causal_link_type: DIRECT
    description: Loss of the afferent and efferent limbs of the tendon reflex arc.
  - target: Distal Sensory Impairment
    causal_link_type: DIRECT
    description: Large-fibre sensory loss, vibration and position first.
  - target: Pes Cavus and Hammertoes
    causal_link_type: DIRECT
    description: >-
      Chronic imbalance between intrinsic and extrinsic foot muscles, in the one
      patient in whom it was recorded.
  - target: Loss of Ambulation
    causal_link_type: DIRECT
    description: The end state of progressive distal and then proximal weakness.
- name: Mild Cerebellar Dysfunction
  role: outcome
  biological_scale: ORGANISM
  description: >-
    Slurred speech in every reassessed patient and oculomotor involvement in
    some, without microcephaly, seizures or developmental delay. This is the
    clinical expression of the milder end of the PNKP spectrum, which the 2018
    authors attribute to an allelic effect.
  evidence:
  - reference: PMID:30039206
    reference_title: "The polynucleotide kinase 3'-phosphatase gene (PNKP) is involved in Charcot-Marie-Tooth disease (CMT2B2) previously related to MED25."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Detailed clinical reassessment of the initial family and the new individuals revealed in all an adult-onset slowly progressive CMT2 associated with signs of cerebellar dysfunction such as slurred speech and oculomotor involvement, but neither microcephaly, seizures, nor developmental delay."
    explanation: >-
      The defining clinical contrast with MCSZ and with the severe AOA4 end of the
      spectrum.
  - reference: PMID:30039206
    reference_title: "The polynucleotide kinase 3'-phosphatase gene (PNKP) is involved in Charcot-Marie-Tooth disease (CMT2B2) previously related to MED25."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We propose that PKNP variants are the major causative variant for the CMT2 phenotype in these individuals and that the milder clinical manifestation is due to an allelic effect."
    explanation: >-
      The authors' proposed explanation for the mildness, quoted with its hedge

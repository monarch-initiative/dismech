genetic:
- name: PNKP
  gene_term:
    preferred_term: PNKP
    term:
      id: hgnc:9154
      label: PNKP
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal Recessive
  notes: >-
    PNKP encodes polynucleotide kinase 3'-phosphatase, a bifunctional DNA
    end-processing enzyme. Two disease alleles are reported in this entity:
    c.1549C>T p.Gln517ter, homozygous in the original Costa Rican family, and
    c.1221_1223del p.Thr408del, carried in compound heterozygosity with it by five
    further Costa Rican patients and previously associated with AOA4. Both lie on
    the same ancestral founder haplotype as the MED25 variant that was originally
    proposed. ClinGen has no curation of the PNKP-CMT2B2 relationship itself; its
    PNKP record covers microcephaly, seizures and developmental delay
    (MONDO:0013254, Definitive).
  evidence:
  - reference: PMID:30039206
    reference_title: "The polynucleotide kinase 3'-phosphatase gene (PNKP) is involved in Charcot-Marie-Tooth disease (CMT2B2) previously related to MED25."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using exome sequencing, we now identified a homozygous nonsense variant (p.Gln517ter) in the last exon of an adjacent gene, the polynucleotide kinase 3'-phosphatase (PNKP) gene."
    explanation: The gene assignment for this entity.
  - reference: CGGV:assertion_c0e0d66f-c68d-4df3-bab2-71afc448e4b0-2021-03-22T201527.084Z
    reference_title: "MED25 / Charcot-Marie-Tooth disease type 2B2 (Disputed)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Re-assessing the first and only reported family by WES, Leal et al. identified a homozygous stop mutation in PNKP, a gene that is located in the same linkage region"
    explanation: >-
      ClinGen's account of the reassignment, from the panel that disputed the
      previous gene.
- name: MED25
  gene_term:
    preferred_term: MED25
    term:
      id: hgnc:28845
      label: MED25
  association: Disputed ClinGen gene-disease validity; superseded by PNKP
  relationship_type: DISPUTED
  variant_origin: GERMLINE
  notes: >-
    Recorded because the 2009 assignment is still in circulation and a curator or
    clinician meeting "CMT2B2, MED25" needs to find the correction here rather
    than assume this entry is out of date. The MED25 p.Ala335Val variant
    cosegregates with the causal PNKP alleles on one founder haplotype, no second
    CMT family with a MED25 variant has been published, and the variant is
    homozygous in four unaffected gnomAD individuals. MED25 does cause a separate
    recessive disorder, Basel-Vanagaite-Smirin-Yosef syndrome, which is curated
    separately and does not include neuropathy.
  evidence:
  - reference: CGGV:assertion_c0e0d66f-c68d-4df3-bab2-71afc448e4b0-2021-03-22T201527.084Z
    reference_title: "MED25 / Charcot-Marie-Tooth disease type 2B2 (Disputed)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MED25 | HGNC:28845 | Charcot-Marie-Tooth disease type 2B2 | MONDO:0011570 | AR | Disputed | SOP8 | Charcot-Marie-Tooth Disease Gene Curation Expert Panel"
    explanation: >-
      The ClinGen classification row, keyed on this entry's own MONDO identifier.
  - reference: CGGV:assertion_c0e0d66f-c68d-4df3-bab2-71afc448e4b0-2021-03-22T201527.084Z
    reference_title: "MED25 / Charcot-Marie-Tooth disease type 2B2 (Disputed)"
    supports: REFUTE
    evidence_source: OTHER
    snippet: "the only reported variant has been found in a homozygous state in 4 unaffected individuals (GnomAD)"
    explanation: >-
      Population evidence against MED25 p.Ala335Val being sufficient to cause the
      disease.
  - reference: PMID:19290556
    reference_title: "Identification of the variant Ala335Val of MED25 as responsible for CMT2B2: molecular data, functional studies of the SH3 recognition motif and correlation between wild-type MED25 and PMP22 RNA levels in CMT1A animal models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a homozygous p.A335V mutation in the MED25 gene in an extended Costa Rican family with autosomal recessively inherited Charcot-Marie-Tooth neuropathy linked to the CMT2B2 locus in chromosome 19q13.3."
    explanation: >-
      The original 2009 assignment, cited so the superseded claim is visible in the
      entry rather than only its correction.

diagnosis:
- name: Nerve Conduction Studies and Electromyography
  description: >-
    Electrophysiology establishes the axonal character: severely reduced compound
    muscle action potentials with relative preservation of F-wave latencies,
    rather than the uniform conduction slowing of a demyelinating neuropathy.
  evidence:
  - reference: PMID:30039206
    reference_title: "The polynucleotide kinase 3'-phosphatase gene (PNKP) is involved in Charcot-Marie-Tooth disease (CMT2B2) previously related to MED25."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the electrophysiological analysis demonstrated a severe reduction of the CMAP of affected nerves with relative preservation of F-waves latency"
    explanation: The electrophysiological pattern used to classify the neuropathy.
- name: Brain MRI
  description: >-
    Worth doing even when the presentation is a pure neuropathy: cerebellar
    atrophy was present in every patient imaged and is the finding that points
    from an isolated axonal CMT2 towards the PNKP spectrum.
  evidence:
  - reference: PMID:30039206
    reference_title: "The polynucleotide kinase 3'-phosphatase gene (PNKP) is involved in Charcot-Marie-Tooth disease (CMT2B2) previously related to MED25."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI of the brain revealed cerebellar atrophy with no white matter abnormalities, brain atrophy, nor brainstem atrophy, in all studied individuals"
    explanation: The imaging finding that redirects the differential.
- name: PNKP Sequencing, and Reading the Whole Gene
  description: >-
    The cautionary detail from the original work is that the causal variant was
    present in the first Sanger screen and was discarded, because the PNKP gene
    annotation in use at the time contained an upstream stop codon that placed the
    variant outside the coding sequence. A last-exon variant in a gene with a
    contested annotation is exactly what a filtering step drops.
  evidence:
  - reference: PMID:30039206
    reference_title: "The polynucleotide kinase 3'-phosphatase gene (PNKP) is involved in Charcot-Marie-Tooth disease (CMT2B2) previously related to MED25."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using exome sequencing, we now identified a homozygous nonsense variant (p.Gln517ter) in the last exon of an adjacent gene, the polynucleotide kinase 3'-phosphatase (PNKP) gene."
    explanation: >-
      The variant and its position in the last exon, which is the part of the gene
      the earlier analysis mishandled.

differential_diagnoses:
- name: Ataxia with oculomotor apraxia type 4 (AOA4)
  description: >-
    The same gene and, in five of the reported CMT2B2 patients, literally one of
    the same alleles: p.Thr408del was described first in AOA4. AOA4 leads with
    ataxia and oculomotor apraxia; CMT2B2 leads with the neuropathy and has
    cerebellar signs that are mild by comparison. The distinction is one of
    severity and emphasis within an allelic spectrum, not of gene.
  evidence:
  - reference: PMID:32504494
    reference_title: "Pathological mutations in PNKP trigger defects in DNA single-strand break repair but not DNA double-strand break repair."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Hereditary mutations in polynucleotide kinase-phosphatase (PNKP) result in a spectrum of neurological pathologies ranging from neurodevelopmental dysfunction in microcephaly with early onset seizures (MCSZ) to neurodegeneration in ataxia oculomotor apraxia-4 (AOA4) and Charcot-Marie-Tooth disease (CMT2B2)."
    explanation: Places the three PNKP entities on one spectrum.
- name: Microcephaly with seizures and developmental delay (MCSZ)
  description: >-
    The severe neurodevelopmental end of the PNKP spectrum. It is excluded here on
    examination rather than by assumption: the reassessed CMT2B2 patients had no
    cognitive impairment, no microcephaly and no seizures.
  evidence:
  - reference: PMID:30039206
    reference_title: "The polynucleotide kinase 3'-phosphatase gene (PNKP) is involved in Charcot-Marie-Tooth disease (CMT2B2) previously related to MED25."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Detailed clinical reassessment of the initial family and the new individuals revealed in all an adult-onset slowly progressive CMT2 associated with signs of cerebellar dysfunction such as slurred speech and oculomotor involvement, but neither microcephaly, seizures, nor developmental delay."
    explanation: The examined absence of the MCSZ features.
- name: PNKP neuropathy presenting before ataxia
  description: >-
    A separate report describes early-onset axonal sensorimotor neuropathy from
    PNKP variants with ataxia appearing only years later and without oculomotor
    apraxia. It matters for the differential because it means a PNKP patient can
    present as a pure CMT for a long time, so the absence of cerebellar signs at
    first assessment does not exclude the gene.
  evidence:
  - reference: PMID:27066567
    reference_title: Mutation in PNKP presenting initially as axonal Charcot-Marie-Tooth disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "early-onset axonal sensory-motor neuropathy (or axonal Charcot-Marie-Tooth (CMT) disease) followed years later by ataxia without oculomotor apraxia can be caused by deleterious variants in PNKP"
    explanation: >-
      Establishes that PNKP disease can present as an isolated axonal neuropathy
      before any cerebellar sign appears.


- ARCMT2B
- Charcot-Marie-Tooth disease, axonal, autosomal recessive, B2
- autosomal recessive axonal CMT4C3
- PNKP-related axonal Charcot-Marie-Tooth disease
parents:
- Charcot-Marie-Tooth Disease Type 2
- Hereditary Motor and Sensory Neuropathy
description: >-
  An autosomal recessive, adult-onset, axonal sensorimotor polyneuropathy that
  was mapped in a large consanguineous Costa Rican family and is caused by
  biallelic loss of function in PNKP, the bifunctional DNA-repair enzyme
  polynucleotide kinase 3'-phosphatase.

  The gene assignment has a history that this entry puts in front rather than in
  a footnote, because a reader who consults an older source will find the wrong
  gene. The locus was mapped to 19q13.3 in 2001; in 2009 an exhaustive Sanger
  screen of the interval found a single homozygous missense variant, MED25
  p.Ala335Val, and MED25 was proposed as causative. No second CMT family with a
  MED25 variant was ever reported. Re-examining the same family by exome
  sequencing in 2018 found a homozygous nonsense variant in PNKP, p.Gln517ter,
  in the last exon of an adjacent gene inside the same linkage interval - a
  variant that the original screen had actually seen but discarded, because the
  PNKP annotation then in use placed it outside the coding sequence. Five further
  unrelated Costa Rican CMT2 patients who had been typed as MED25 heterozygotes
  turned out to be compound heterozygous for that PNKP allele and a second one,
  p.Thr408del, already associated with ataxia with oculomotor apraxia type 4. The
  MED25 and PNKP variants cosegregate on one ancestral founder haplotype, which
  is exactly why the first screen landed on the wrong one of the two. The ClinGen
  Charcot-Marie-Tooth Disease Gene Curation Expert Panel classified
  MED25-CMT2B2 as DISPUTED in 2021, noting among other things that the MED25
  allele is homozygous in four unaffected gnomAD individuals.

  So this is not a mapped locus without a gene. It is a mapped locus whose gene
  was misassigned and then corrected, and the corrected gene brings a mechanism
  with it. PNKP is a bifunctional end-processing enzyme: it phosphorylates 5'
  ends and dephosphorylates 3' ends to create the 5'-phosphate/3'-hydroxyl
  termini that DNA ligase requires. Loss of that activity leaves single-strand
  breaks unrepaired, and in cells from patients across the whole PNKP disease
  spectrum the measured deficit is specifically in single-strand break repair
  and not in double-strand break repair. The p.Gln517ter allele truncates the
  last five residues of a C-terminus that is buried between the kinase and
  phosphatase domains and contacts both, so the predicted consequence is
  destabilisation of the folded enzyme rather than removal of a catalytic
  residue.

  What makes CMT2B2 a distinct entity within that spectrum rather than a
  relabelling of it is severity and tissue distribution. PNKP variants also cause
  microcephaly with seizures and developmental delay (MCSZ) at the severe
  neurodevelopmental end, and ataxia with oculomotor apraxia type 4 (AOA4) in
  between. The CMT2B2 patients have neither microcephaly, seizures nor
  developmental delay; onset is in the third decade; and the leading problem is a
  severe length-dependent axonal sensorimotor neuropathy, with cerebellar
  involvement present but mild - slurred speech in all of them, oculomotor
  involvement in some, and cerebellar atrophy on MRI without brain or brainstem
  atrophy. The 2018 authors attribute that mildness to an allelic effect. A
  further observation from the biochemistry lines up with the clinical split
  without proving it: reduced PNKP phosphatase activity tracks with
  neurodevelopmental disease while reduced kinase activity tracks with
  neurodegeneration. This entry records that correlation as a correlation.

  Management is supportive and is not disease-specific; no CMT2B2 treatment
  study appears in the sources curated here.
notes: >-
  Deep-research provenance, recorded because the first attempt failed in a way a
  later curator should know about. The committed falcon report
  (research/Charcot-Marie-Tooth_Disease_Type_2B2-deep-research-falcon.md) is a
  retry. The first run, launched from the plain entry name, produced a report
  that was about the right disease (CMT2B2 named 62 times) but reproduced the
  superseded 2009 gene assignment throughout: MED25 was mentioned 57 times and
  PNKP zero times, with no mention of Gln517ter, AOA4 or MCSZ, and its
  curation conclusion was to represent CMT2B2 as a MED25 disease-gene assertion.
  That report was discarded rather than committed, because research/ is consumed
  as a curation input and it would have led a curator to the disputed gene. The
  retry inlined the gene, the two alleles, the OMIM number and the reassigning
  paper in the disease_name variable, and returned PNKP as the top gene at 89
  occurrences against MED25 at 19, reaching the same conclusion this entry does
  independently. Reproduce the failure with:
  `just research-disorder falcon Charcot-Marie-Tooth_Disease_Type_2B2`.

  Note also that `just preflight-dr` returns SKIP for this entity in both runs,
  because MONDO records no causal gene for MONDO:0011570 and the gene-identity
  discriminator therefore cannot run. SKIP is not a pass; the substitution and
  gene-attribution checks here were done by hand.

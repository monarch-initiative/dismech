description: "An autosomal recessive axonal sensorimotor neuropathy caused by biallelic PNKP variants, initially mapped in a large Costa Rican family. The founder family carries homozygous c.1549C>T (p.Gln517Ter); five additional Costa Rican patients carried p.Gln517Ter in trans with c.1221_1223del (p.Thr408del). Only p.Gln517Ter lies on the ancestral haplotype carrying MED25 p.Ala335Val. The original MED25 assignment was superseded by PNKP in 2018, and the ClinGen expert panel classified MED25-CMT2B2 as Disputed in 2021.\n\nThe neuropathy-predominant phenotype overlaps the wider PNKP ataxia-neuropathy spectrum. In the original family, reported onset was 28–42 years. Four patients reassessed in 2018 had severe distal axonal sensorimotor neuropathy, dysarthria and mild cerebellar atrophy, with oculomotor apraxia in two. Microcephaly, seizures and developmental delay were absent in this cohort; these negative observations are not universal exclusions across PNKP-associated disease. Adult neuropathy with cerebellar signs has also been described outside Costa Rica.\n\nPNKP processes DNA strand-break termini through its 5'-kinase and 3'-phosphatase activities. Structural modeling predicts\
  \ destabilization after loss of the final five residues in p.Gln517Ter. Patient-derived CMT2B2 cells have reduced PNKP protein and impaired repair after camptothecin-induced TOP1 damage. The relationship between cellular repair defects and selective neuronal degeneration remains inferred; residual protein or isolated enzyme activity did not correlate strongly with clinical severity. Management is supportive, with general CMT care extrapolated where subtype-specific intervention evidence is unavailable."
notes: >-
  The entry covers neuropathy-predominant PNKP disease historically designated CMT2B2. AOA4 and MCSZ belong to an overlapping allelic spectrum; broader cohorts and cell experiments are
  identified as indirect context rather than added to the Costa Rican clinical denominator. The current GeneReviews CMT Overview (PMID:20301532, updated 2025-11-20) has a purpose-only
  PubMed abstract and is not a phenotype baseline in that form. Its cached full chapter supports general management and recessive counseling; disease-specific clinical findings come
  from the primary reports. The Pmp22 transgenic rodents in PMID:19290556 concern other neuropathies and Med25 coexpression, not PNKP-CMT2B2 animal models. The structural prediction
  is represented in a computationally supported mechanism node. No CMT2B2-specific histopathology or intervention study was established in the cited sources.

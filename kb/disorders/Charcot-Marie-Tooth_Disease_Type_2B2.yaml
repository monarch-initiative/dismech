discussions:
- discussion_id: gap_cmt2b2_med25_modifier
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the MED25 p.Ala335Val variant contribute anything to the CMT2B2
    phenotype, or is it purely a passenger on the founder haplotype?
  rationale: >-
    Every reported patient carries both variants, because the two genes are
    adjacent and the alleles cosegregate on a single ancestral haplotype. That
    perfect linkage is what made the original assignment go wrong, and it also
    means no reported patient separates the two. ClinGen's Disputed call rests on
    the absence of other MED25 CMT families and on four unaffected gnomAD
    homozygotes, which argues MED25 alone is not sufficient - but it does not
    exclude a modifying contribution in the presence of biallelic PNKP loss. The
    2009 work reported that the MED25 variant broadens SH3-domain binding
    specificity and that Med25 is coordinately expressed with Pmp22, so a
    modifier hypothesis is not empty. Settling it needs a PNKP-biallelic patient
    who is not on this haplotype.
  attaches_to:
  - genetic#MED25
  - pathophysiology#Biallelic PNKP Loss-of-Function Variant
- discussion_id: gap_cmt2b2_neuron_break_burden
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the single-strand break burden actually raised in the peripheral neurons
    and cerebellar neurons of PNKP patients, and does it explain why those cells
    and not others degenerate?
  rationale: >-
    The repair deficit is measured in patient fibroblasts, a dividing cell type
    with no phenotype. The step to post-mitotic neurons is an inference from the
    biochemistry, and it is the step that has to carry the tissue selectivity of a
    ubiquitously expressed enzyme. The kinase-versus-phosphatase correlation
    reported alongside it is suggestive but is a correlation across a small set of
    alleles, not a demonstrated determinant.
  attaches_to:
  - pathophysiology#Accumulation of Unrepaired Single-Strand Breaks in Post-Mitotic Neurons
  - pathophysiology#Impaired DNA Single-Strand Break Repair


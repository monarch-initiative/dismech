- name: AOA4/MCSZ fibroblast PNKP complementation
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: Primary fibroblasts with combined AOA4/MCSZ, supplied with recombinant PNKP or expression constructs
  publication: PMID:32504494
  description: Wild-type and phosphatase-dead D171N PNKP rescued camptothecin-associated repair, whereas phosphatase-dead protein failed to complement the IR-associated defect. The FHA mutant failed to restore full repair after either exposure. The kinase-dead construct was unstable and was not used for further rescue analysis.
  modeled_mechanisms:
  - target: Reduced PNKP DNA 5-Prime Kinase Function
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Complementation supports the rate-limiting kinase requirement for repair of TOP1-associated breaks.
    limitations: Related PNKP genotype, not CMT2B2; rescue of DNA repair in fibroblasts is not rescue of neuropathy.
    evidence:
    - reference: PMID:32504494
      reference_title: Pathological mutations in PNKP trigger defects in DNA single-strand break repair but not DNA double-strand break repair.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: both His-PNKPWT and His-PNKPPD completely suppressed the elevated accumulation of TOP1-induced SSBs in AOA4/MCSZ patient fibroblasts following CPT treatment
      explanation: Indirect support for assigning the kinase step in CMT2B2; the experiment itself used AOA4/MCSZ cells.
  - target: Impaired DNA Single-Strand Break Repair
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Wild-type and FHA-domain comparisons connect recruitment to repair.
    limitations: Different patient genotype and non-neural tissue.
    evidence:
    - reference: PMID:32504494
      reference_title: Pathological mutations in PNKP trigger defects in DNA single-strand break repair but not DNA double-strand break repair.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: recombinant His-PNKPFHA harbouring a mutated FHA domain failed to restore full repair capacity in AOA4/MCSZ fibroblasts following either IR or CPT
      explanation: PNKP recruitment contributes to efficient SSBR in related patient cells.
- name: PNKP p.Thr408del homozygous CMT01SP patient cells
  experimental_model_type: CELL_LINE
  cell_source: Patient-derived CMT01SP cells from the early-onset neuropathy/ataxia case; normal human fibroblasts as control
  publication: PMID:27066567
  description: After hydrogen peroxide or doxorubicin, patient cells showed reduced viability, increased apoptosis/caspase-3, persistent G2 arrest and persistent gamma-H2AX. The authors inferred impaired BER and NHEJ; these assays do not isolate the CMT2B2 TOP1-SSBR mechanism.
  notes: This homozygous p.Thr408del patient had childhood neuropathy followed by ataxia, rather than the adult Costa Rican founder presentation. Different genotype, damage agents and readouts limit comparison with the 2020 study. No modeled_mechanisms link to the specific SSBR node is asserted because these assays do not distinguish strand-break classes.
  evidence:
  - reference: PMID:27066567
    reference_title: Mutation in PNKP presenting initially as axonal Charcot-Marie-Tooth disease.
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: after 24 hours, the PNKP-mutated cells showed a much larger population of γH2AX-positive cells than the control cells, and this persisted even after 72 hours
    explanation: Persistent damage was measured directly in this patient-cell model. The readout does not identify the DNA repair pathway responsible.

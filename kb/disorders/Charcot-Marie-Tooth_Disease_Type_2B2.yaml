- name: Predicted Destabilization of the PNKP C-Terminus
  role: effector
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: Homology modeling on murine PNKP (PDB 3ZVN) predicts loss of interdomain contacts after truncation of Q517–G521, destabilizing the kinase/phosphatase orientation and the ADP pocket near Y515. This is a structural prediction, not a direct protein-folding or catalytic measurement.
  evidence:
  - reference: PMID:30039206
    reference_title: "The polynucleotide kinase 3'-phosphatase gene (PNKP) is involved in Charcot-Marie-Tooth disease (CMT2B2) previously related to MED25."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: COMPUTATIONAL
    quote_role: PRIMARY_RESULT
    snippet: Wildtype residues Q517-G521, which are lacking in the p.Gln517ter variant, form extensive interactions with residues from the phosphatase domain (C308, L312, L315) and the kinase domain (R458, R462)
    explanation: The modeled contact loss supports the structural mechanism.
  - reference: PMID:30039206
    reference_title: "The polynucleotide kinase 3'-phosphatase gene (PNKP) is involved in Charcot-Marie-Tooth disease (CMT2B2) previously related to MED25."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: COMPUTATIONAL
    quote_role: PRIMARY_RESULT
    snippet: the fixation of the C-terminus appears essential for stabilizing the relative domain orientation and for stabilizing the conformation of the ADP-binding site, which involves Y515 close to the site of truncation.
    explanation: Predicted ADP-pocket disruption; the study did not directly measure allele-specific enzyme activity.
  downstream:
  - target: Reduced PNKP DNA 5-Prime Kinase Function
    causal_link_type: DIRECT
    description: An altered ADP-binding pocket is predicted to compromise kinase function.
    hypothesis_groups:
    - cmt2b2_structural_model

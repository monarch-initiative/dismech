name: Craniofaciocardiohepatic Syndrome
creation_date: "2026-10-21T15:00:00Z"
category: Mendelian
parents:
- Syndromic orofacial cleft
- Multiple congenital anomalies syndrome
synonyms:
- CFCHS
- AMOTL1-associated multiple congenital anomalies
- AMOTL1-related orofacial clefting syndrome
description: >-
  Craniofaciocardiohepatic syndrome is an autosomal dominant multiple
  congenital anomaly syndrome caused by heterozygous missense variants in
  AMOTL1, which encodes angiomotin-like protein 1, an actin-binding scaffold
  of tight and adherens junctions. Almost all reported variants fall in a
  hotspot at residues 157-161 (p.Arg157Cys, p.Arg157His, p.Pro160Leu,
  p.Gln161Arg), arising de novo or inherited with variable expressivity.
  Orofacial clefting is the most consistent feature; congenital heart
  disease (mostly septal defects), tall stature, large or dysplastic ears,
  hearing loss, liver involvement, myopia, scoliosis and developmental delay
  occur in subsets. Residues Arg157 and Pro160 lie in the tankyrase-binding
  motif that targets AMOTL1 for poly-ADP-ribosylation, RNF146 ubiquitination
  and proteasomal degradation. In cultured cells the R157C and P160L
  mutants escape this degradation and accumulate in the cytoplasm, and
  R157C disrupts cell junctions and focal adhesions and slows directed cell
  migration more than excess wild-type AMOTL1 does; Arg157His and Gln161Arg
  have not been tested. A dominant mechanism of this kind fits the absence
  of disease from Amotl1 deletion in mice. Expressing the R157C
  mutant in zebrafish embryos causes craniofacial cartilage, cardiac and
  trunk defects, but neither zebrafish nor the knock-in mouse reproduces
  clefting.
references:
- reference: PMID:39538375
  title: "AMOTL1 -Associated Multiple Congenital Anomalies (Craniofaciocardiohepatic Syndrome, CFCHS): A Novel Clinical Spectrum Including Craniofacial, Heart and Liver Abnormalities."

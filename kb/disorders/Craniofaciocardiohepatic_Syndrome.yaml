    - reference: PMID:42012498
      reference_title: Patient-derived AMOTL1 mutations lead to defective cell migration and tissue development.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Here, we show that both the R157C and P160L mutants fail to interact with Tankyrase 1/2 and Ring finger protein 146, rendering them unable to undergo poly ADP-ribosylation, ubiquitination, and subsequent proteasomal degradation."
      explanation: Both hotspot mutants lose binding to the degradation machinery.
- name: Escape from Tankyrase-RNF146-Mediated AMOTL1 Degradation
  biological_scale: MOLECULAR
  description: >-
    Tankyrase 1/2 normally poly-ADP-ribosylate AMOTL1 through its
    tankyrase-binding motif, marking it for RNF146 ubiquitination and
    proteasomal degradation. The R157C and P160L mutants bind neither enzyme,
    so they are not modified and are not degraded.
  biological_processes:

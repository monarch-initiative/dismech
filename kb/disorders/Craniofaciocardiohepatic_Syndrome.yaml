animal_models:
- name: AMOTL1 R157C mRNA-injected zebrafish
  species: Zebrafish
  genotype: Transient expression of mCherry-tagged human AMOTL1 p.Arg157Cys
  publication: PMID:42012498
  modeled_mechanisms:
  - target: Disrupted Craniofacial and Cardiac Morphogenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Mutant expression causes craniofacial cartilage hypoplasia with a short
      lower jaw, pericardial edema, bradycardia and trunk curvature.
    limitations: >-
      Transient overexpression of the human protein on a normal zebrafish
      background, not a heterozygous germline allele; wild-type AMOTL1
      overexpression also causes milder defects, and no cleft is produced.
    evidence:
    - reference: PMID:42012498
      reference_title: Patient-derived AMOTL1 mutations lead to defective cell migration and tissue development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Using zebrafish as a model, we show that expression of AMOTL1 mutants induces craniofacial malformations, pericardial edema, bradycardia, and trunk curvature, indicative of developmental defects and partially overlapping with features reported in patients."
      explanation: The authors describe the overlap with patients as partial.
- name: Amotl1 R157C knock-in mouse
  species: Mouse
  genotype: Amotl1 p.Arg157Cys knock-in
  publication: PMID:30375152
  modeled_mechanisms:
  - target: Disrupted Craniofacial and Cardiac Morphogenesis
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Mice carrying the patient allele have reduced survival to weaning but no
      overt craniofacial or cardiac phenotype.
    limitations: >-
      The cause of the reduced survival is unknown, and the mouse lacks the
      orofacial and cardiac malformations that define the human disorder. The
      authors note that off-target CRISPR editing at another locus could
      formally explain the lethality.
    evidence:
    - reference: PMID:30375152
      reference_title: Using human sequencing to guide craniofacial research.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We did not see any evidence of cleft palate in 24 Amotl1R157C/wt embryos at E16.5–E18.5 and in 10 P0 Amotl1R157C/wt pups"
      explanation: Primary negative result for clefting.
    - reference: PMID:30375152
      reference_title: Using human sequencing to guide craniofacial research.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "showed no evidence of outflow tract defects, septal defects or valvular anomalies"
      explanation: Primary negative result for heart defects.
    - reference: PMID:30375152
      reference_title: Using human sequencing to guide craniofacial research.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These findings of underrepresented Amotl1R157C mice in our colony could formally be the result of “off-target” CRISPR-Cas9 editing at an independent locus"
      explanation: The authors' own caveat on the survival defect.
    - reference: PMID:36751037
      reference_title: A mutational hotspot in AMOTL1 defines a new syndrome of orofacial clefting, cardiac anomalies, and tall stature.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: BACKGROUND
      snippet: "Specifically, murine models of AMOTL1 deficiency and variant-specific mouse models (p.(Arg157Cys)) did not exhibit the overt cardiac or craniofacial phenotype described in humans"
      explanation: Restates the knock-in mouse result.
discussions:
- discussion_id: cfchs_clefting_not_modelled
  prompt: >-
    Why do neither the Amotl1 R157C knock-in mouse nor R157C-expressing
    zebrafish develop a cleft, when clefting is present in nearly every
    affected person?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - phenotypes#Orofacial Cleft
  - pathophysiology#Disrupted Craniofacial and Cardiac Morphogenesis
  rationale: >-
    The cellular mechanism (escape from tankyrase-mediated degradation,
    junctional disruption, slowed migration) is shown in cultured cells, and
    zebrafish reproduce jaw, heart and trunk defects, but the defining human
    malformation is absent in both animal models. It is unknown whether this
    reflects species differences in palatal development, redundancy among
    the AMOT family, or a requirement for the stable heterozygous germline
    state that mRNA injection does not provide.
  evidence:
  - reference: PMID:42012498
    reference_title: Patient-derived AMOTL1 mutations lead to defective cell migration and tissue development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, neither the injected zebrafish nor the mouse model carrying the R157C variant exhibited phenotypes comparable to cleft lip or palate reported in affected human patients"
    explanation: States the mismatch for both models.
notes: >-
  About twenty patients have been published, mostly in one cohort report
  (PMID:36751037), so feature frequencies are approximate and clefting may be
  over-represented by ascertainment. Only R157C and P160L have been studied
  functionally. Management is surgical and supportive, directed at the
  individual malformations, with surveillance as recommended in the cohort
  report; no disease-modifying treatment exists.

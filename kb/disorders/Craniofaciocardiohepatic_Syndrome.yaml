- name: Impaired Directed Cell Migration
  biological_scale: CELLULAR
  description: >-
    R157C AMOTL1 reduces both the speed and the directional persistence of
    collectively migrating cells. Overexpressed wild-type AMOTL1 also slows
    migration, but less, so part of the effect is one of excess AMOTL1
    rather than specific to the mutant. Cell adhesion and migration underlie lip,
    palate and heart morphogenesis, which is the proposed link to the
    malformations.
  biological_processes:
  - preferred_term: cell migration
    modifier: DECREASED
    term:
      id: GO:0016477
      label: cell migration
  evidence:
  - reference: PMID:42012498
    reference_title: Patient-derived AMOTL1 mutations lead to defective cell migration and tissue development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "As a result, we observed that R157C AMOTL1 expression significantly inhibited both the speed and persistence of migrating cells."
    explanation: Wound-healing assay in MDCK cells.
  - reference: PMID:42012498
    reference_title: Patient-derived AMOTL1 mutations lead to defective cell migration and tissue development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Notably, the effect of R157C AMOTL1 on cell migration was substantially more pronounced than that of WT AMOTL1"
    explanation: Wild-type overexpression also slows migration, but less than the mutant.
  downstream:
  - target: Disrupted Craniofacial and Cardiac Morphogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The step from impaired migration to malformation is inferred; the
      embryonic cell populations involved have not been studied.
    evidence:
    - reference: PMID:36751037
      reference_title: A mutational hotspot in AMOTL1 defines a new syndrome of orofacial clefting, cardiac anomalies, and tall stature.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "AMOTL1 disruption impacts cellular adhesion and cell migration (Huang et al., 2018), cellular processes that are critical for almost all embryonic tissue morphogenetic events, including development of the lip, palate, and heart"
      explanation: The cohort authors' rationale linking the cellular defect to the malformations.
- name: Disrupted Craniofacial and Cardiac Morphogenesis
  biological_scale: TISSUE
  description: >-
    Injecting R157C AMOTL1 mRNA into zebrafish embryos causes underdeveloped
    craniofacial cartilage with a shortened lower jaw, pericardial edema,
    bradycardia and trunk curvature, more often and more severely than
    wild-type AMOTL1. Neither this model nor the R157C knock-in mouse shows
    clefting, so the clefting step itself is not modelled.
  evidence:
  - reference: PMID:42012498
    reference_title: Patient-derived AMOTL1 mutations lead to defective cell migration and tissue development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, during zebrafish embryonic development, expression of the R157C mutant leads to craniofacial malformations and defects in cardiac function and skeletal muscle."
    explanation: The mutant disrupts craniofacial, cardiac and muscle development in zebrafish.
  - reference: PMID:42012498
    reference_title: Patient-derived AMOTL1 mutations lead to defective cell migration and tissue development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "when compared with WT AMOTL1 expression, both the penetrance and severity of defects in trunk and heart development were more pronounced in zebrafish expressing R157C AMOTL1"
    explanation: The mutant is more harmful than excess wild-type protein.
  downstream:
  - target: Orofacial Cleft
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Hypothetical: neither the zebrafish nor the mouse model produces a cleft
      (see the cfchs_clefting_not_modelled discussion).
  - target: Micrognathia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Supported by the shortened lower jaw in R157C-expressing zebrafish.
  - target: Congenital Heart Defect
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Zebrafish show pericardial edema and bradycardia rather than a structural
      septal defect, so the link to human heart malformations is inferred.
  - target: Scoliosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Inferred from trunk curvature in zebrafish embryos, which is not the same
      phenotype as scoliosis.

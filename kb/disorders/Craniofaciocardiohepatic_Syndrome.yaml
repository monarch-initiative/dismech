pathophysiology:
- name: AMOTL1 Tankyrase-Binding Motif Missense Variant
  biological_scale: MOLECULAR
  description: >-
    Heterozygous missense substitutions at Arg157, Pro160 or Gln161 in a
    highly conserved stretch of the glutamine-rich N-terminus; Arg157 and
    Pro160 lie in the tankyrase-binding motif of AMOTL1. AMOTL1 tolerates
    loss of function (pLI 0) and Amotl1 deletion mice survive normally,
    while R157C knock-in mice have reduced survival, so the variants are
    thought to act by gain of function or dominant interference rather than
    haploinsufficiency. The functional category is left unset because the
    sources do not settle it: the mutants also lose a normal function, since
    R157C escapes DDI2 cleavage and so no longer promotes focal-adhesion
    maturation.
  genetic_context:
    variant_origin: GERMLINE
  genes:
  - preferred_term: AMOTL1
    term:
      id: hgnc:17811
      label: AMOTL1
  molecular_functions:
  - preferred_term: tankyrase 1/2 binding
    modifier: DECREASED
    term:
      id: GO:0019899
      label: enzyme binding
  - preferred_term: RNF146 binding
    modifier: DECREASED
    term:
      id: GO:0031625
      label: ubiquitin protein ligase binding
  evidence:
  - reference: PMID:42012498
    reference_title: Patient-derived AMOTL1 mutations lead to defective cell migration and tissue development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we show that both the R157C and P160L mutants fail to interact with Tankyrase 1/2 and Ring finger protein 146, rendering them unable to undergo poly ADP-ribosylation, ubiquitination, and subsequent proteasomal degradation."
    explanation: The molecular defect of the variants is lost binding to tankyrase 1/2 and RNF146.
  - reference: PMID:36751037
    reference_title: A mutational hotspot in AMOTL1 defines a new syndrome of orofacial clefting, cardiac anomalies, and tall stature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a hotspot for variants in AMOTL1 affecting amino acids 157 - 161."
    explanation: Variants cluster at residues 157-161.
  - reference: PMID:30375152
    reference_title: Using human sequencing to guide craniofacial research.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice carrying the variant identified in the human sequencing studies, however, do not survive to weaning in normal ratios."
    explanation: The R157C knock-in allele reduces mouse survival.
  - reference: PMID:30375152
    reference_title: Using human sequencing to guide craniofacial research.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results indicate that Amotl1 is not required in the mouse for survival to weaning."
    explanation: >-
      Amotl1 deletion is tolerated in mice, so the patient allele is harmful
      where loss of the gene is not, which argues against haploinsufficiency.
  - reference: PMID:36751037
    reference_title: A mutational hotspot in AMOTL1 defines a new syndrome of orofacial clefting, cardiac anomalies, and tall stature.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data and the heterozygous inheritance of the alleles reported here again may reflect either a gain-of-function or dominant negative mechanism for variants affecting amino acids 157 and 160 of AMOTL1."
    explanation: The cohort authors' reading of the genetic and mouse data.
  downstream:

  - reference: PMID:42012498
    reference_title: Patient-derived AMOTL1 mutations lead to defective cell migration and tissue development.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Consistent with this observation, in an independent cell type, both R157C and P160L AMOTL1 mutants also exhibited punctate cytoplasmic accumulation in NIH-3T3 cells"

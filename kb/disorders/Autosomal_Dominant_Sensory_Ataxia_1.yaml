- name: Progressive Sensory Gait Ataxia
  biological_scale: ORGANISM
  description: >-
    The clinical endpoint: a broad-based, unsteady, visually dependent gait that
    worsens over years, leading to falls, then reliance on a stick and eventually
    a walking aid, typically within a decade of onset. Cerebellar signs
    (dysarthria, nystagmus, appendicular cerebellar ataxia with eyes open) and
    cerebellar atrophy on imaging are characteristically absent, and it is this
    combination — severe ataxia with a normal cerebellum — that identifies the
    disorder clinically.
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:34469621
    reference_title: RNF170 mutation causes autosomal dominant sensory ataxia with
      variable pyramidal involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All affected family members showed sensory ataxia on examination."
    explanation: Sensory ataxia is the obligate clinical outcome.
  - reference: PMID:32943585
    reference_title: 'Mutation in RNF170 causes sensory ataxic neuropathy with vestibular
      areflexia: a CANVAS mimic.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain MRI was normal and in particular there was no cerebellar atrophy."
    explanation: >-
      Confirms that the ataxia is sensory rather than cerebellar, the key
      distinguishing observation.

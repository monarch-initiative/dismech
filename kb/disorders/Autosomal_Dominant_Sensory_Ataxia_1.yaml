- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ultra-rare. At gene discovery only two clinically ascertained families were
    known, both from Maritime Canada and sharing a founder haplotype; a Belgian
    family and an Ecuadorian family were subsequently reported carrying the same
    p.Arg199Cys allele. Only a few dozen affected individuals are on record, no
    population rate has ever been estimated, and a targeted screen of 404
    neuromuscular patients yielded no additional cases. No numeric
    rate_per_100000 is asserted because none has been measured.
  evidence:
  - reference: PMID:21115467
    reference_title: A mutation in the RNF170 gene causes autosomal dominant sensory
      ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date only two families have been clinically ascertained with this condition, both from Maritime Canada."
    explanation: >-
      Establishes the case-count basis for the ultra-rare classification at the
      time of gene discovery.
  - reference: PMID:34469621
    reference_title: RNF170 mutation causes autosomal dominant sensory ataxia with
      variable pyramidal involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We did not find additional pathogenic variants in RNF170 in our in-house neuromuscular cohort."
    explanation: >-
      A targeted screen of 404 neuromuscular patients found no further RNF170
      cases, supporting extreme rarity even in an enriched clinical cohort.
genetic:
- name: RNF170
  gene_term:
    preferred_term: RNF170
    term:
      id: hgnc:25358
      label: RNF170
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    RNF170 encodes an endoplasmic reticulum membrane RING-finger E3 ubiquitin
    ligase with three predicted membrane-spanning helices. The ADSA locus was
    originally mapped to chromosome 8p12-8q12 in the two Maritime Canadian
    families before the gene was identified by direct sequencing of the shared
    haplotype interval. Only one RNF170 allele, the missense p.Arg199Cys, has
    ever been associated with sensory ataxia; all other reported pathogenic
    RNF170 alleles are biallelic loss-of-function variants causing a different
    disease (autosomal recessive spastic paraplegia 85). A different RNF170
    variant found in a patient with sensory ataxia should therefore not be
    assumed causal by analogy.
  evidence:
  - reference: PMID:21115467
    reference_title: A mutation in the RNF170 gene causes autosomal dominant sensory
      ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified a putative pathogenic mutation in the gene encoding ring-finger protein RNF170, a potential ubiquitin ligase."
    explanation: Gene-discovery report establishing RNF170 as the ADSA gene.
  - reference: PMID:21115467
    reference_title: A mutation in the RNF170 gene causes autosomal dominant sensory
      ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We previously mapped both families to chromosome 8p12-8q12"
    explanation: Records the linkage interval that localised the gene.
  - reference: PMID:34469621
    reference_title: RNF170 mutation causes autosomal dominant sensory ataxia with
      variable pyramidal involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unlike the distinctive bi-allelic loss of function variants in RNF170 associated with hereditary spastic paraplegia (HSP), the p.Arg199Cys variant is the only one reported in sensory ataxia."
    explanation: >-
      Establishes the allelic-series boundary: a single missense allele underlies
      ADSA, distinct from the biallelic loss-of-function HSP alleles.
variants:
- name: RNF170 c.595C>T p.Arg199Cys
  gene:
    preferred_term: RNF170
    term:
      id: hgnc:25358
      label: RNF170
  description: >-
    The single recurrent ADSA allele. A rare non-synonymous substitution at a
    well-conserved residue, predicted deleterious by multiple in silico tools.
    Found on a shared founder haplotype in the two Maritime Canadian families and
    independently in a Belgian and an Ecuadorian family, showing it is not
    confined to the founder population. Arg199 is a charged residue in a
    transmembrane region, and functional work shows that ionic interactions
    between charged transmembrane residues are what maintain RNF170 stability, so
    the arginine-to-cysteine change destabilises the protein rather than
    abolishing its catalytic activity.
  clinical_significance: PATHOGENIC
  type: missense variant
  functional_effects:
  - function: RNF170 protein stability
    description: >-
      Reduced steady-state RNF170 protein level through enhanced
      autoubiquitination and proteasomal degradation, demonstrated both in
      transfected cells and in ADSA patient lymphoblasts.
  - function: IP3 receptor-mediated cytosolic calcium mobilisation
    description: >-
      Impaired agonist-evoked (platelet-activating-factor-stimulated) calcium
      mobilisation in patient lymphoblasts, with normal store content, receptor
      level and IP3 production.
  - function: ubiquitin ligase activity toward IP3 receptors
    description: >-
      Preserved rather than abolished. Mutant RNF170 attaches the full normal
      complement of mono-, K48- and K63-linked ubiquitin conjugates to activated
      IP3 receptors, so the calcium defect is not explained by defective IP3
      receptor ubiquitination.
  - function: dominant developmental toxicity in zebrafish
    description: >-
      Dose-dependent dominant disruption of embryonic development on
      microinjection of mutant orthologous mRNA, the principal evidence for an
      allele-specific toxic property.
  evidence:
  - reference: PMID:25882839
    reference_title: A Point Mutation in the Ubiquitin Ligase RNF170 That Causes Autosomal
      Dominant Sensory Ataxia Destabilizes the Protein and Impairs Inositol 1,4,5-Trisphosphate
      Receptor-mediated Ca2+ Signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RNF170 is an endoplasmic reticulum membrane ubiquitin ligase that contributes to the ubiquitination of activated inositol 1,4,5-trisphosphate (IP3) receptors, and also, when point mutated (arginine to cysteine at position 199), causes autosomal dominant sensory ataxia (ADSA), a disease characterized by neurodegeneration in the posterior columns of the spinal cord."
    explanation: >-
      Names the exact variant and ties it to the posterior-column
      neurodegeneration phenotype.
  - reference: PMID:21115467
    reference_title: A mutation in the RNF170 gene causes autosomal dominant sensory
      ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation is a rare non-synonymous change in a well-conserved residue and is predicted to be pathogenic by SIFT, PolyPhen, PANTHER and Align-GVD."
    explanation: In silico support for pathogenicity at gene discovery.
  - reference: PMID:32943585
    reference_title: 'Mutation in RNF170 causes sensory ataxic neuropathy with vestibular
      areflexia: a CANVAS mimic.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we performed focused exome sequencing in III-3 which identified a c.595C>T, p.Arg199Cys variant in RNF170"
    explanation: Provides the cDNA-level description of the recurrent allele.
mechanistic_hypotheses:
- hypothesis_group_id: r199c_toxic_gain_of_function
  hypothesis_label: p.Arg199Cys Toxic Gain-of-Function / Dominant-Negative Model
  status: EMERGING
  description: >-
    The currently favoured but unproven explanation for dominance. Because
    heterozygous carriers of RNF170 nonsense alleles are unaffected, losing one
    functional copy of RNF170 cannot by itself cause sensory ataxia; the
    p.Arg199Cys protein must therefore do something a null allele does not.
    Candidate mechanisms are a toxic property of the misfolded, unstable mutant
    protein, or a dominant-negative action on the erlin1/2-RNF170 complex in
    which the destabilised mutant poisons the complex or perturbs its
    stoichiometry. The strongest positive evidence is the dose-dependent dominant
    developmental toxicity of mutant RNF170 mRNA in zebrafish embryos. This
    model, not simple haploinsufficiency, is what the field currently regards as
    plausible, but no specific toxic species or poisoned complex has been
    demonstrated, and the zebrafish readout is embryonic development rather than
    adult sensory neurodegeneration.
  evidence:
  - reference: PMID:32943585
    reference_title: 'Mutation in RNF170 causes sensory ataxic neuropathy with vestibular
      areflexia: a CANVAS mimic.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although the exact mechanism remains elusive, a toxic gain of function seems plausible and is supported by the dose-dependent toxicity of RNF170 Arg199Cys in zebrafish larvae"
    explanation: >-
      States the hypothesis and its supporting model-organism observation while
      explicitly flagging that the mechanism is unresolved.
  - reference: PMID:21115467
    reference_title: A mutation in the RNF170 gene causes autosomal dominant sensory
      ataxia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Microinjection of wild-type or mutant orthologous messenger RNAs into zebrafish (Danio rerio) embryos confirmed that the mutation dominantly disrupts normal embryonic development."
    explanation: >-
      Direct experimental demonstration that the mutant allele acts dominantly in
      a model organism.
  - reference: PMID:32943585
    reference_title: 'Mutation in RNF170 causes sensory ataxic neuropathy with vestibular
      areflexia: a CANVAS mimic.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, both the clinical phenotype, with primary involvement of upper motor neurons vs dorsal root ganglia sensory neurons, and the disease-causing mechanism, loss-of-function vs toxic gain-of-function, differ between RNF170 HSP and autosomal dominant sensory ataxia, respectively."
    explanation: >-
      Contrasts the recessive loss-of-function disease with the proposed toxic
      gain-of-function mechanism of the dominant disease.
- hypothesis_group_id: rnf170_haploinsufficiency
  hypothesis_label: RNF170 Haploinsufficiency Model
  status: ALTERNATIVE
  description: >-
    The straightforward reading of the biochemistry: p.Arg199Cys destabilises
    RNF170, lowering its steady-state level, and reduced RNF170 dosage impairs
    IP3 receptor ERAD in vulnerable sensory neurons. It is retained here because
    the loss-of-expression biochemistry is solid in patient-derived cells and
    because Rnf170-null mice reproduce proprioceptive and gait deficits. It is
    nevertheless disfavoured as the primary disease mechanism: heterozygous
    carriers of RNF170 nonsense alleles, who are unambiguously haploinsufficient,
    are clinically unaffected, and their biallelic relatives develop spastic
    paraplegia rather than sensory ataxia.
  evidence:
  - reference: PMID:25882839
    reference_title: A Point Mutation in the Ubiquitin Ligase RNF170 That Causes Autosomal
      Dominant Sensory Ataxia Destabilizes the Protein and Impairs Inositol 1,4,5-Trisphosphate
      Receptor-mediated Ca2+ Signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Inhibited expression of mutant RNF170 was seen in cells expressing exogenous RNF170 constructs and in ADSA lymphoblasts, and appears to result from enhanced RNF170 autoubiquitination and proteasomal degradation."
    explanation: >-
      Establishes the reduced-dosage premise of the haploinsufficiency model in
      patient-derived cells.
  - reference: PMID:32943585
    reference_title: 'Mutation in RNF170 causes sensory ataxic neuropathy with vestibular
      areflexia: a CANVAS mimic.'
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Indeed, despite previous evidence of reduced stability and expression level of mutant Arg199Cys RNF170 haploinsufficiency is unlikely to be the primary disease since heterozygous carriers of nonsense variants in RNF170 were later shown to be unaffected"
    explanation: >-
      Human genetic evidence directly against haploinsufficiency as the primary
      mechanism.
- hypothesis_group_id: non_ip3r_substrate_dysregulation
  hypothesis_label: Non-IP3-Receptor Substrate Dysregulation Model
  status: EMERGING
  description: >-
    Patient lymphoblasts show a genuine functional defect in agonist-evoked Ca2+
    mobilisation, yet this defect cannot be attributed to aberrant IP3 receptor
    ubiquitination: mutant RNF170 attaches the full normal complement of
    ubiquitin conjugates to activated IP3 receptors, and receptor levels, store
    content and IP3 production are all unchanged. The authors of that work
    therefore proposed that the pathogenic consequence lies with other, still
    unidentified RNF170 substrates, or is an adaptive response to chronically
    reduced RNF170. Under this model the IP3 receptor is a marker of the pathway
    rather than the critical substrate, and identifying the true substrate is the
    central open problem.
  evidence:
  - reference: PMID:25882839
    reference_title: A Point Mutation in the Ubiquitin Ligase RNF170 That Causes Autosomal
      Dominant Sensory Ataxia Destabilizes the Protein and Impairs Inositol 1,4,5-Trisphosphate
      Receptor-mediated Ca2+ Signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Rather, the defect likely reflects abnormal ubiquitination of other substrates, or adaptation to the chronic reduction in RNF170 levels."
    explanation: >-
      The primary functional study explicitly proposes non-IP3-receptor
      substrates as the likely explanation.
  - reference: PMID:25882839
    reference_title: A Point Mutation in the Ubiquitin Ligase RNF170 That Causes Autosomal
      Dominant Sensory Ataxia Destabilizes the Protein and Impairs Inositol 1,4,5-Trisphosphate
      Receptor-mediated Ca2+ Signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "wild-type and mutant RNF170 have apparently identical ubiquitin ligase activities toward IP3 receptors"
    explanation: >-
      Shows the mutant is not deficient in its best-characterised catalytic
      activity, motivating the search for another substrate.
pathophysiology:
- name: RNF170 p.Arg199Cys Transmembrane Destabilizing Substitution
  biological_scale: MOLECULAR
  description: >-
    The single molecular lesion of ADSA. Arginine 199 is a charged residue in a
    transmembrane region of RNF170; systematic point mutagenesis showed that ionic
    interactions between charged transmembrane residues are what hold the protein
    together, so replacing this arginine with cysteine removes a stabilising
    charge pair. The substitution does not damage the catalytic RING function.
  genes:
  - preferred_term: RNF170
    term:
      id: hgnc:25358
      label: RNF170
  cellular_components:
  - preferred_term: endoplasmic reticulum membrane
    term:
      id: GO:0005789
      label: endoplasmic reticulum membrane
  mechanism_confidence: ESTABLISHED
  evidence:
  - reference: PMID:25882839
    reference_title: A Point Mutation in the Ubiquitin Ligase RNF170 That Causes Autosomal
      Dominant Sensory Ataxia Destabilizes the Protein and Impairs Inositol 1,4,5-Trisphosphate
      Receptor-mediated Ca2+ Signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The basis for these effects was probed via additional point mutations, revealing that ionic interactions between charged residues in the transmembrane domains of RNF170 are required for protein stability."
    explanation: >-
      Explains why an arginine-to-cysteine change at position 199 destabilises the
      protein.
  - reference: PMID:21610068
    reference_title: RNF170 protein, an endoplasmic reticulum membrane ubiquitin ligase,
      mediates inositol 1,4,5-trisphosphate receptor ubiquitination and degradation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "RNF170 is predicted to have three membrane-spanning helices, is localized to the ER membrane, and possesses ubiquitin ligase activity."
    explanation: >-
      Establishes the membrane topology and ER localisation that make a
      transmembrane charge pair structurally relevant.

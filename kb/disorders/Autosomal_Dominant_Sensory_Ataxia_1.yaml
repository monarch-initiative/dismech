      case, evidencing upper-limb deafferentation.
  notes: >-
    Deliberately left without an ontology `term:` binding. HPO has no term for
    pseudoathetosis. The term suggested in review, HP:0011443, resolves to
    "Abnormality of coordination" - a very high-level parent that would be far
    broader than, and would not convey, this specific deafferentation sign, and
    HP:0002305 Athetosis would be positively misleading because pseudoathetosis is
    mechanistically distinct from athetosis. Per the CLAUDE.md guidance that
    `preferred_term` may stand alone when no suitable ontology term exists, the
    free-text preferred term is used rather than a misleading binding.

- category: Neurologic
  name: Areflexia of Lower Limbs
  description: >-
    Absent lower limb deep tendon reflexes because the large-fibre afferent limb of
    the reflex arc is destroyed. Reflexes are typically reduced rather than absent
    in the upper limbs. Retained or brisk reflexes, characteristic of RFC1-CANVAS,
    are not a feature of RNF170 disease unless there is superimposed pyramidal
    involvement.
  phenotype_term:
    preferred_term: Areflexia of lower limbs
    term:
      id: HP:0002522
      label: Areflexia of lower limbs
  evidence:
  - reference: PMID:32943585
    reference_title: 'Mutation in RNF170 causes sensory ataxic neuropathy with vestibular
      areflexia: a CANVAS mimic.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deep-tendon reflexes were reduced in the upper limbs and absent in the lower limbs."
    explanation: Direct examination finding of lower limb areflexia.

- category: Neurologic
  name: Sensory Neuropathy
  description: >-
    A ganglionopathic (non-length-dependent) sensory neuropathy with reduced or
    absent sensory nerve action potentials and preserved motor conduction.
    Genuinely variable between kindreds: absent in the originally described
    Maritime Canadian families, prominent in the Ecuadorian family.
  phenotype_term:
    preferred_term: Sensory neuropathy
    term:
      id: HP:0000763
      label: Sensory neuropathy
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:34469621
    reference_title: RNF170 mutation causes autosomal dominant sensory ataxia with
      variable pyramidal involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pyramidal involvement, and sometimes slow-pursuit abnormalities and/or a sensory neuropathy, were more variable findings."
    explanation: >-
      The qualifier "sometimes" applied to sensory neuropathy in a kindred where it
      was not universal supports the OCCASIONAL band.
  - reference: PMID:32943585
    reference_title: 'Mutation in RNF170 causes sensory ataxic neuropathy with vestibular
      areflexia: a CANVAS mimic.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, in contrast to the two previously reported families, both our patients had reduced or absent sensory action potentials in the four limbs."
    explanation: >-
      Documents the interfamilial variability of the peripheral sensory
      involvement.

- category: Neurologic
  name: Decreased Distal Sensory Nerve Action Potential
  description: >-
    Electrophysiological correlate of the peripheral arm of the ganglionopathy:
    reduced or absent sensory nerve action potentials with normal motor nerve
    conduction.
  phenotype_term:
    preferred_term: Decreased distal sensory nerve action potential
    term:
      id: HP:0007230
      label: Decreased distal sensory nerve action potential
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:32943585
    reference_title: 'Mutation in RNF170 causes sensory ataxic neuropathy with vestibular
      areflexia: a CANVAS mimic.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NCS showed normal motor conduction parameters. Sensory action potentials had decreased amplitudes in the upper limbs and were absent in the lower limbs."
    explanation: >-
      Direct nerve-conduction documentation of reduced sensory action potentials
      with motor sparing.

- category: Neurologic
  name: Impaired Pain Sensation
  description: >-
    Reduced pinprick sensation extending proximally into the limbs, part of the
    broader sensory loss. Notably, significant neuropathic pain and foot ulceration
    are not features, distinguishing ADSA from the hereditary sensory and autonomic
    neuropathies.
  phenotype_term:
    preferred_term: Impaired pain sensation
    term:
      id: HP:0007328
      label: Impaired pain sensation
  evidence:
  - reference: PMID:32943585
    reference_title: 'Mutation in RNF170 causes sensory ataxic neuropathy with vestibular
      areflexia: a CANVAS mimic.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pinprick sensation was reduced to the elbow and to the hip."
    explanation: Direct examination finding of reduced pinprick sensation.
  - reference: PMID:32943585
    reference_title: 'Mutation in RNF170 causes sensory ataxic neuropathy with vestibular
      areflexia: a CANVAS mimic.'
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "without evidence of cerebellar or autonomic involvement and no significant foot ulcerations or pain"
    explanation: >-
      Qualifies the sensory phenotype: pinprick is impaired but neuropathic pain
      and ulceration are not part of the syndrome.

- category: Neurologic
  name: Vestibular Areflexia
  description: >-
    Bilateral loss of vestibulo-ocular reflex gain, documented on video head
    impulse testing. A late feature that may be absent or borderline earlier in the
    course, and the finding that makes ADSA a CANVAS mimic.
  phenotype_term:
    preferred_term: Vestibular areflexia
    term:
      id: HP:0008568
      label: Vestibular areflexia
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:32943585
    reference_title: 'Mutation in RNF170 causes sensory ataxic neuropathy with vestibular
      areflexia: a CANVAS mimic.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Also, bilateral vestibular areflexia was identified in the index case, mimicking CANVAS."
    explanation: >-
      Reported in one of two examined affected individuals and explicitly described
      as stage-dependent, supporting the OCCASIONAL band.

- category: Neurologic
  name: Dysesthesia
  description: >-
    Unpleasant abnormal sensation in the hands and feet accompanying the sensory
    loss, frequently described by patients as a sensation of walking on cotton.
    Curated as dysesthesia rather than paresthesia because the cited source
    specifically reports "dysaesthesia"; the two were previously bundled in one
    entry, and only dysesthesia is snippet-supportable.
  phenotype_term:
    preferred_term: Dysesthesia
    term:
      id: HP:0012534
      label: Dysesthesia
  evidence:
  - reference: PMID:32943585
    reference_title: 'Mutation in RNF170 causes sensory ataxic neuropathy with vestibular
      areflexia: a CANVAS mimic.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a 57-year old woman with onset of poor balance at the age of 47 years, followed by dysaesthesia and sensory loss in her feet and hands"
    explanation: Documents dysaesthesia as part of the sensory syndrome.

- category: Neurologic
  name: Pyramidal Signs
  description: >-
    Corticospinal tract signs (spasticity, hyperreflexia, extensor plantar
    responses) occur in some affected individuals but are variable and are not
    required for the diagnosis. Their presence blurs the clinical boundary with the
    recessive RNF170 spastic paraplegia phenotype.
  phenotype_term:
    preferred_term: Abnormal pyramidal sign
    term:
      id: HP:0007256
      label: Abnormal pyramidal sign
  frequency: OCCASIONAL
  reports_on:
  - target: pathophysiology#Variable Corticospinal Tract Involvement
    relationship: READOUT_OF
    description: >-
      This phenotype is the clinical readout of the variable corticospinal arm of
      the pathograph.
  evidence:
  - reference: PMID:34469621
    reference_title: RNF170 mutation causes autosomal dominant sensory ataxia with
      variable pyramidal involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pyramidal involvement, and sometimes slow-pursuit abnormalities and/or a sensory neuropathy, were more variable findings."
    explanation: >-
      Establishes pyramidal involvement as a variable feature, supporting the
      OCCASIONAL band. The cited source says "pyramidal involvement" generically
      rather than naming spasticity, which is why the binding is the parent term
      HP:0007256 rather than HP:0001257 Spasticity.

- category: Neurologic
  name: Impaired Smooth Pursuit
  description: >-
    Slow-pursuit abnormalities on oculomotor examination in some affected
    individuals; saccades and pursuit were normal in others, so this is not a
    consistent feature.
  phenotype_term:
    preferred_term: Impaired smooth pursuit
    term:
      id: HP:0007772
      label: Impaired smooth pursuit
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:34469621
    reference_title: RNF170 mutation causes autosomal dominant sensory ataxia with
      variable pyramidal involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pyramidal involvement, and sometimes slow-pursuit abnormalities and/or a sensory neuropathy, were more variable findings."
    explanation: >-
      Names slow-pursuit abnormalities among the variable findings, supporting the
      OCCASIONAL band.
imaging_findings:
- name: Posterior Column Signal Change and Atrophy on Spinal MRI
  modality: MRI
  description: >-
    Reduced volume and increased T2 signal of the posterior columns on cervical
    spinal cord MRI, the in vivo correlate of the defining posterior-column
    degeneration.
  located_in:
    preferred_term: spinal cord dorsal column
    term:
      id: UBERON:0005373
      label: spinal cord dorsal column
  phenotype_term:
    preferred_term: Dorsal column degeneration
    term:
      id: HP:0007006
      label: Dorsal column degeneration
  laterality: BILATERAL
  diagnostic: true
  evidence:
  - reference: PMID:32943585
    reference_title: 'Mutation in RNF170 causes sensory ataxic neuropathy with vestibular
      areflexia: a CANVAS mimic.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MRI of the cervical spine showed reduced volume and increased T2 signal of the posterior columns"
    explanation: Direct imaging description of the diagnostic finding.

- name: Absence of Cerebellar Atrophy on Brain MRI
  modality: MRI
  description: >-
    A negative imaging finding with real diagnostic weight: the cerebellum is
    normal, which separates ADSA from the spinocerebellar ataxias and from
    RFC1-CANVAS, in which cerebellar atrophy is typical.
  diagnostic: true
  evidence:
  - reference: PMID:32943585
    reference_title: 'Mutation in RNF170 causes sensory ataxic neuropathy with vestibular
      areflexia: a CANVAS mimic.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain MRI was normal and in particular there was no cerebellar atrophy."
    explanation: Documents the diagnostically useful absence of cerebellar atrophy.
diagnosis:
- name: Molecular confirmation of RNF170 p.Arg199Cys
  description: >-
    Diagnosis rests on identifying the heterozygous RNF170 c.595C>T p.Arg199Cys
    variant, in practice by exome or targeted panel sequencing, in a patient with
    an adult-onset predominantly sensory ataxia. Because p.Arg199Cys is the only
    RNF170 allele reported in sensory ataxia, a different RNF170 variant in this
    clinical setting should not be assumed causal. In a patient with sensory ataxia
    plus vestibular areflexia, RFC1 expansion testing is usually performed first;
    RNF170 should be tested when RFC1 is negative, particularly if the family
    history is dominant.
  evidence:
  - reference: PMID:32943585
    reference_title: 'Mutation in RNF170 causes sensory ataxic neuropathy with vestibular
      areflexia: a CANVAS mimic.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Therefore, we recommend considering RNF170 in the diagnostic work-up of patients affected by sensory ataxic neuropathies and RFC1 negative CANVAS-like patients, particularly if there is a dominant family history."
    explanation: States the recommended diagnostic pathway.
  - reference: PMID:32943585
    reference_title: 'Mutation in RNF170 causes sensory ataxic neuropathy with vestibular
      areflexia: a CANVAS mimic.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because of the presence of sensory neuropathy and vestibular areflexia gene testing for RFC1 expansion was performed and resulted negative"
    explanation: >-
      Illustrates the practical testing order, with RFC1 excluded before RNF170 was
      found.

- name: Nerve conduction studies and vestibular testing
  description: >-
    Nerve conduction studies show reduced or absent sensory nerve action potentials
    with normal motor conduction when the peripheral arm is involved, and may be
    entirely normal in families with purely central disease. Video head impulse
    testing detects the late bilateral vestibulo-ocular reflex deficit. Cervical
    spinal MRI demonstrates the posterior-column lesion. Exclusion of acquired
    sensory ganglionopathy (paraneoplastic, autoimmune, toxic, metabolic) is a
    necessary part of the workup.
  evidence:
  - reference: PMID:32943585
    reference_title: 'Mutation in RNF170 causes sensory ataxic neuropathy with vestibular
      areflexia: a CANVAS mimic.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vestibular testing showed a bilateral VOR gain impairment at the video Head Impulse test"
    explanation: Documents the vestibular test used to establish the deficit.
  - reference: PMID:32943585
    reference_title: 'Mutation in RNF170 causes sensory ataxic neuropathy with vestibular
      areflexia: a CANVAS mimic.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Screening for autoimmune, neoplastic, toxic and metabolic causes was negative."
    explanation: >-
      Documents that acquired causes were actively excluded before the genetic
      diagnosis was accepted.
differential_diagnoses:
- name: CANVAS (RFC1-related cerebellar ataxia, neuropathy, vestibular areflexia syndrome)
  description: >-
    The most important differential. Both cause a late-onset sensory ganglionopathy
    with vestibular impairment. CANVAS is autosomal recessive, caused by a biallelic
    RFC1 AAGGG repeat expansion, and characteristically has cerebellar involvement,
    chronic cough and retained or brisk reflexes. ADSA is dominant, has no
    cerebellar involvement and no cough, and reflexes are reduced or absent;
    vestibular areflexia appears only in advanced disease.
  distinguishing_features:
  - Autosomal dominant inheritance in ADSA versus autosomal recessive in CANVAS
  - Absent cerebellar involvement and normal cerebellar imaging in ADSA
  - Absence of the chronic cough that is characteristic of CANVAS
  - Reduced or absent reflexes in ADSA versus retained or brisk reflexes in CANVAS
  - Vestibular areflexia only in advanced ADSA, whereas it is a defining early
    feature of CANVAS
  evidence:
  - reference: PMID:32943585
    reference_title: 'Mutation in RNF170 causes sensory ataxic neuropathy with vestibular
      areflexia: a CANVAS mimic.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As opposed to autosomal recessive RFC1 CANVAS, cerebellar involvement, cough and retained/brisk reflexes are absent RNF170 related syndrome, mode of inheritance is autosomal dominant, and the vestibular areflexia may be observed only in more advanced disease stages."
    explanation: >-
      Explicit point-by-point clinical contrast between the two disorders.

- name: Spastic paraplegia 85, autosomal recessive (biallelic RNF170)
  disease_term:
    preferred_term: spastic paraplegia 85, autosomal recessive
    term:
      id: MONDO:0030512
      label: spastic paraplegia 85, autosomal recessive
  description: >-
    The recessive disease at the other end of the same allelic series. Caused by
    biallelic RNF170 loss-of-function variants, it presents as a hereditary spastic
    paraplegia with primary upper-motor-neuron involvement rather than a dorsal root
    ganglion sensory neuronopathy, and is believed to act by simple loss of function
    rather than by whatever mechanism drives the dominant disease. Heterozygous
    carriers of these null alleles are unaffected. Keeping the two apart matters:
    same gene, different variant class, different inheritance, different target
    neuron, different mechanism.
  distinguishing_features:
  - Biallelic loss-of-function variants versus the single recurrent p.Arg199Cys
    missense allele
  - Autosomal recessive versus autosomal dominant transmission
  - Primary upper motor neuron (corticospinal) involvement versus dorsal root
    ganglion sensory neuronopathy
  - Spasticity and weakness as the leading problem versus proprioceptive sensory
    ataxia
  - Generally earlier (childhood to adolescent) onset versus fifth-to-seventh-decade
    onset in ADSA
  evidence:
  - reference: PMID:32943585
    reference_title: 'Mutation in RNF170 causes sensory ataxic neuropathy with vestibular
      areflexia: a CANVAS mimic.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, both the clinical phenotype, with primary involvement of upper motor neurons vs dorsal root ganglia sensory neurons, and the disease-causing mechanism, loss-of-function vs toxic gain-of-function, differ between RNF170 HSP and autosomal dominant sensory ataxia, respectively."
    explanation: >-
      States the clinical and mechanistic separation between the dominant and
      recessive RNF170 diseases.
  - reference: PMID:31636353
    reference_title: Bi-allelic variants in RNF170 are associated with hereditary spastic
      paraplegia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We provide evidence that mutations in the ubiquitin E3 ligase gene RNF170, which targets inositol 1,4,5-trisphosphate receptors for degradation, are the likely cause of autosomal recessive HSP in four unrelated families"
    explanation: Establishes the recessive RNF170 disease as a separate entity.
  - reference: PMID:33165979
    reference_title: 'RNF170-Related Hereditary Spastic Paraplegia: Confirmation by
      a Novel Mutation.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe here a novel hereditary spastic paraplegia family with 4 affected members carrying a homozygous p.(Tyr114*) stop gain variant in RNF170."
    explanation: >-
      Independent confirmation that biallelic truncating RNF170 variants cause
      spastic paraplegia, not sensory ataxia.

- name: Friedreich ataxia
  description: >-
    The classic genetic posterior-column-plus-sensory-ganglion disorder, and the
    long-standing differential for any patient with sensory ataxia and areflexia. It
    is autosomal recessive, usually much earlier in onset, and typically accompanied
    by cardiomyopathy, scoliosis, diabetes and corticospinal involvement, none of
    which is characteristic of ADSA.
  distinguishing_features:
  - Autosomal recessive FXN repeat expansion versus dominant RNF170 missense
  - Childhood or adolescent onset versus fifth-to-seventh-decade onset
  - Systemic features (cardiomyopathy, diabetes, scoliosis) absent in ADSA
  evidence:
  - reference: PMID:32943585
    reference_title: 'Mutation in RNF170 causes sensory ataxic neuropathy with vestibular
      areflexia: a CANVAS mimic.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "toxic (cisplatin, pyridoxine) and genetic causes (Friedreich"
    explanation: >-
      Lists Friedreich ataxia among the genetic causes in the sensory
      ganglionopathy differential.

- name: Acquired sensory ganglionopathy (paraneoplastic, autoimmune, toxic)
  description: >-
    Non-genetic sensory neuronopathy must be excluded before pursuing a genetic
    diagnosis: anti-Hu paraneoplastic ganglionopathy, Sjogren syndrome and other
    autoimmune causes, and toxic exposures such as cisplatin and pyridoxine. In
    reported ADSA patients, screening for autoimmune, neoplastic, toxic and
    metabolic causes was negative.
  distinguishing_features:
  - Subacute rather than decade-long progression in most acquired forms
  - Positive autoantibody, malignancy or exposure history
  - Absence of a dominant family history
  evidence:
  - reference: PMID:32943585
    reference_title: 'Mutation in RNF170 causes sensory ataxic neuropathy with vestibular
      areflexia: a CANVAS mimic.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There is a narrow differential diagnosis for a sensory ganglionopathy which includes paraneoplastic (anti-Hu antibodies), autoimmune (Sjogren Syndrome,), toxic (cisplatin, pyridoxine) and genetic causes"
    explanation: Enumerates the acquired causes that must be excluded.
progression:
- phase: Presymptomatic adulthood
  age_range: Birth to fourth or fifth decade
  notes: >-
    Carriers are clinically normal for most of adult life. Because onset is late, an
    unaffected examination in an at-risk relative in this age range carries no
    information about carrier status.
  evidence:
  - reference: PMID:32943585
    reference_title: 'Mutation in RNF170 causes sensory ataxic neuropathy with vestibular
      areflexia: a CANVAS mimic.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two sisters III-2 and III-4, aged 58 and 49, are reportedly unaffected but given the late onset of the disease were not considered for segregation analysis."
    explanation: >-
      Shows that even relatives in their fifties may be presymptomatic.
- phase: Onset of imbalance and sensory symptoms
  age_range: Fifth to seventh decade
  notes: >-
    Presentation is with poor balance, then distal dysaesthesia and sensory loss in
    feet and hands. Reported onset ages include 47, 50 and about 60 years.
  evidence:
  - reference: PMID:32943585
    reference_title: 'Mutation in RNF170 causes sensory ataxic neuropathy with vestibular
      areflexia: a CANVAS mimic.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a 57-year old woman with onset of poor balance at the age of 47 years, followed by dysaesthesia and sensory loss in her feet and hands"
    explanation: Documents the presenting sequence and age of onset.
- phase: Progressive ataxia with loss of independent mobility
  age_range: Roughly 5 to 15 years after onset
  notes: >-
    Ataxia worsens, falls and fractures occur, and patients move from a stick to a
    walking aid. Vestibular involvement, when it develops, appears at this stage and
    compounds the imbalance.
  evidence:
  - reference: PMID:32943585
    reference_title: 'Mutation in RNF170 causes sensory ataxic neuropathy with vestibular
      areflexia: a CANVAS mimic.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She has been using a stick to walk since the age of 55."
    explanation: >-
      Documents progression to aid dependence roughly five years after onset.
treatments:
- name: Physical Therapy and Balance Rehabilitation
  description: >-
    No disease-modifying therapy exists for ADSA. Management is supportive and
    centres on gait and balance rehabilitation, visual and tactile compensation
    strategies for the proprioceptive deficit, falls prevention, and provision of
    walking aids as ataxia progresses.
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  therapeutic_modality: BEHAVIORAL
  notes: >-
    Deliberately uncited. No trial, cohort or guideline addressing treatment of
    RNF170-related sensory ataxia exists, and this is standard-of-care extrapolation
    from the management of sensory ataxias generally; attaching a PMID here would
    misrepresent the evidence base. Recorded as a treatment because falls prevention
    and mobility aids are the substance of real clinical management.

- name: Genetic Counseling
  description: >-
    Autosomal dominant transmission implies a 50 percent recurrence risk for
    offspring, complicated by late and possibly age-dependent penetrance, so
    predictive testing in younger at-risk relatives requires careful counselling
    about an unquantified age-related risk. Because p.Arg199Cys is the only allele
    associated with sensory ataxia, while other RNF170 variants cause a recessive
    disease, interpretation of RNF170 findings must be variant-specific.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:34469621
    reference_title: RNF170 mutation causes autosomal dominant sensory ataxia with
      variable pyramidal involvement.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is important for neurologists to be aware of this characteristic phenotype and to include this gene in gene panels for ataxia and HSP."
    explanation: >-
      Supports the counselling and testing recommendation for RNF170 in ataxia and
      HSP panels.
animal_models:
- species: Mouse
  genotype: Rnf170 knockout (Rnf170-/-)
  category: Knockout
  description: >-
    Constitutive Rnf170 knockout mice develop age-dependent gait abnormalities from
    about 12 months, with asynchronous stepping between diagonal limb pairs and a
    fixed step sequence, together with reduced proprioceptive and thermal
    nociceptive sensitivity, and accumulate Itpr1 protein in cerebellum and spinal
    cord but not cerebral cortex. The model therefore reproduces ADSA-like sensory
    and gait phenotypes and demonstrates regionally selective IP3 receptor
    dysregulation. Its relationship to the human dominant disease is nonetheless
    problematic — see the HUMAN_MODEL_MISMATCH discussion — because it models
    complete loss of function, a state that in humans is either clinically silent
    (heterozygous carriers) or causes spastic paraplegia (biallelic).
  genes:
  - preferred_term: RNF170
    term:
      id: hgnc:25358
      label: RNF170
  associated_phenotypes:
  - Impaired proprioception
  - Progressive gait ataxia
  - Reduced thermal nociception
  evidence:
  - reference: PMID:26433933
    reference_title: Age-dependent gait abnormalities in mice lacking the Rnf170 gene
      linked to human autosomal-dominant sensory ataxia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Remarkably, Rnf170(-/-) mice began to develop gait abnormalities in old age (12 months) in the form of asynchronous stepping between diagonal limb pairs with a fixed step sequence during locomotion, while age-matched wild-type mice showed stable gait patterns using several step sequence repertoires."
    explanation: Describes the age-dependent gait phenotype of the null mouse.
  - reference: PMID:26433933
    reference_title: Age-dependent gait abnormalities in mice lacking the Rnf170 gene
      linked to human autosomal-dominant sensory ataxia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "As reported in ADSA patients, they also showed a reduced sensitivity for proprioception and thermal nociception."
    explanation: >-
      Documents the proprioceptive deficit that parallels the human sensory
      phenotype.

- species: Zebrafish
  genotype: Transient expression of wild-type versus p.Arg199Cys orthologous mRNA
  category: Transient overexpression
  description: >-
    Microinjection of mutant orthologous RNF170 mRNA into zebrafish embryos
    disrupted normal development in a dominant, dose-dependent manner, whereas
    wild-type mRNA did not. This is the principal positive experimental evidence
    that the p.Arg199Cys allele has a dominant toxic property rather than merely
    reducing gene dosage, and it is the main support for the toxic gain-of-function
    hypothesis. It is a developmental readout in a non-mammalian embryo, not a model
    of adult sensory neurodegeneration.
  genes:
  - preferred_term: RNF170
    term:
      id: hgnc:25358
      label: RNF170
  evidence:
  - reference: PMID:21115467
    reference_title: A mutation in the RNF170 gene causes autosomal dominant sensory
      ataxia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Microinjection of wild-type or mutant orthologous messenger RNAs into zebrafish (Danio rerio) embryos confirmed that the mutation dominantly disrupts normal embryonic development."
    explanation: >-
      Demonstrates dominant action of the mutant allele in a model organism.

- species: Dog
  genotype: RNF170 c.367delG p.Ala123Glnfs*11 (homozygous, naturally occurring)
  category: Naturally occurring
  description: >-
    A naturally occurring canine RNF170 frameshift causing neuroaxonal dystrophy
    with pelvic limb weakness and ataxia, segregating in an autosomal recessive
    pattern. Included here for completeness and contrast: its authors explicitly
    propose it as a large-animal model of human autosomal recessive spastic
    paraplegia 85, NOT of ADSA. It is therefore a model of the recessive allelic
    disease and must not be treated as evidence about the dominant p.Arg199Cys
    mechanism.
  genes:
  - preferred_term: RNF170
    term:
      id: hgnc:25358

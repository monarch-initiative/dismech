- category: Neurologic
  name: Pseudoathetosis
  description: >-
    Slow, writhing, involuntary drift of the outstretched unmonitored limbs, seen
    in the arms of affected patients. Despite the name it is not athetosis: it is a
    deafferentation sign caused by loss of proprioceptive feedback rather than by

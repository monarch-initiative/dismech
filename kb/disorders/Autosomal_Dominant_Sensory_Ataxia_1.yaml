    explanation: >-
      Directly documents enhanced autoubiquitination and proteasomal clearance of
      the mutant protein in patient-derived cells.
  downstream:
  - target: Impaired erlin1/2-RNF170-Mediated IP3 Receptor ERAD
    causal_link_type: DIRECT
    hypothesis_groups:
    - rnf170_haploinsufficiency
    description: >-
      Under the reduced-dosage reading, less RNF170 means less IP3 receptor
      ubiquitination capacity at the ER membrane.
  - target: Dysregulated ER Calcium Release in Sensory Neurons
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - r199c_toxic_gain_of_function
    - non_ip3r_substrate_dysregulation
    description: >-
      Alternative routes that bypass the IP3-receptor-ERAD step: a toxic property
      of the unstable mutant protein, or mis-ubiquitination of an unidentified
      non-IP3-receptor substrate. Both are invoked because the observed patient
      calcium defect is demonstrably not explained by defective IP3 receptor

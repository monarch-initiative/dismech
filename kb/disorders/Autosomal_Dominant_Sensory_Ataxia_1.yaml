- name: Loss of Proprioceptive and Vibratory Afferent Input
  biological_scale: ORGANISM
  description: >-
    The physiological consequence of losing large-fibre sensory pathways centrally
    and peripherally: joint position sense and vibration sense are degraded, deep
    tendon reflexes are lost because their afferent limb is destroyed, and the
    patient becomes dependent on vision to know where the limbs are. Removing
    vision unmasks the deficit (positive Romberg sign) and unmonitored limbs drift
    (pseudoathetosis).

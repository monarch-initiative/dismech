discussions:
- discussion_id: adsa_null_mouse_models_recessive_not_dominant_disease
  prompt: >-
    Does the Rnf170-null mouse model autosomal dominant sensory ataxia, or does it
    actually model the recessive RNF170 spastic paraplegia, given that human
    heterozygous RNF170 null carriers are unaffected?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#RNF170 Protein Destabilization by Enhanced Autoubiquitination
  - pathophysiology#Impaired erlin1/2-RNF170-Mediated IP3 Receptor ERAD
  rationale: >-
    Evidence exists in the model but its translational validity is the open
    question, which is why this is a HUMAN_MODEL_MISMATCH rather than a plain
    knowledge gap. Rnf170-/- mice do develop ADSA-like proprioceptive loss and
    age-dependent gait abnormality, which is superficially strong support for a
    loss-of-function mechanism. But the human genetics point the other way:
    heterozygous carriers of RNF170 nonsense alleles are clinically unaffected, and
    individuals homozygous for such alleles develop hereditary spastic paraplegia
    with upper-motor-neuron involvement rather than sensory ataxia. A complete-null
    mouse therefore corresponds genotypically to the recessive human disease, not to
    the heterozygous missense state that causes ADSA. The naturally occurring canine
    RNF170 frameshift model has the same problem: it segregates recessively and its
    authors propose it as a model of SPG85. Consequently the null-mouse phenotype
    cannot be used as evidence that ADSA is caused by loss of RNF170 function, and
    the concordance of its sensory phenotype with ADSA may reflect convergence on a
    shared vulnerable pathway rather than mechanistic identity. A further internal
    inconsistency: the null mouse accumulates Itpr1 most in cerebellum and spinal
    cord, yet the cerebellum is precisely the structure spared in the human disease.
    No p.Arg199Cys knock-in animal exists, so the dominant allele has never been
    modelled in its native heterozygous state.
  proposed_experiments:
  - experiment_id: exp_adsa_r199c_knockin_mouse
    name: Heterozygous Rnf170 p.Arg199Cys knock-in mouse versus null littermates
    description: >-
      Generate a knock-in mouse carrying the orthologous Rnf170 p.Arg199Cys allele
      and phenotype it in the heterozygous state alongside heterozygous and
      homozygous null littermates, scoring dorsal root ganglion neuronopathy,
      posterior column degeneration, proprioception and gait. If the heterozygous
      knock-in is affected while the heterozygous null is not, the allele acts by a
      mechanism other than haploinsufficiency.
    would_support:
    - pathophysiology#RNF170 Protein Destabilization by Enhanced Autoubiquitination
  - experiment_id: exp_adsa_dominant_negative_complex_assay
    name: Test for dominant-negative poisoning of the erlin1/2-RNF170 complex
    description: >-
      Determine whether mutant RNF170 co-assembles with the erlin1/2 complex and
      impairs wild-type RNF170 function in a heterozygous setting, which would
      distinguish a dominant-negative from a purely toxic misfolding mechanism.
    would_support:
    - pathophysiology#Impaired erlin1/2-RNF170-Mediated IP3 Receptor ERAD
  - experiment_id: exp_adsa_drg_specific_phenotyping
    name: Dorsal-root-ganglion-specific phenotyping in null and knock-in animals
    description: >-
      Phenotype dorsal root ganglion neurons specifically, rather than whole
      cerebellum or cord homogenates, in both null and knock-in animals, since the
      human lesion is a ganglionopathy and bulk-tissue readouts may have obscured
      the relevant cell population.
    would_support:
    - pathophysiology#Dorsal Root Ganglion Sensory Neuronopathy
  evidence:
  - reference: PMID:26433933
    reference_title: Age-dependent gait abnormalities in mice lacking the Rnf170 gene
      linked to human autosomal-dominant sensory ataxia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Although this mutant allele is known to be dominant, the functional identity thereof has not been clearly established."
    explanation: >-
      The authors of the null mouse study themselves flag that the functional nature
      of the dominant human allele was unresolved, which is precisely the gap a null
      genotype cannot close.
  - reference: PMID:32943585
    reference_title: 'Mutation in RNF170 causes sensory ataxic neuropathy with vestibular
      areflexia: a CANVAS mimic.'
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Indeed, despite previous evidence of reduced stability and expression level of mutant Arg199Cys RNF170 haploinsufficiency is unlikely to be the primary disease since heterozygous carriers of nonsense variants in RNF170 were later shown to be unaffected"
    explanation: >-
      Human genetic evidence that the loss-of-function state modelled by the null
      mouse does not cause the dominant disease.
  - reference: PMID:39177409
    reference_title: Canine RNF170 Single Base Deletion in a Naturally Occurring Model
      for Human Neuroaxonal Dystrophy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "RNF170 variants were previously identified in human patients with autosomal recessive spastic paraplegia-85 (SPG85); this clinical phenotype shows similarities to the dogs described herein."
    explanation: >-
      The other available large-animal RNF170 model is likewise recessive and is
      proposed by its authors as a model of the recessive human disease.

- discussion_id: adsa_selective_vulnerability_of_dorsal_root_ganglion_neurons
  prompt: >-
    Why does a ubiquitously expressed ER ubiquitin ligase, when mutated, damage
    large dorsal root ganglion sensory neurons and the posterior columns
    specifically, while sparing the cerebellum and cortex?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Dysregulated ER Calcium Release in Sensory Neurons
  - pathophysiology#Dorsal Root Ganglion Sensory Neuronopathy
  rationale: >-
    RNF170 is broadly expressed and the erlin1/2-RNF170-IP3 receptor module operates
    in all cells, yet the human disease is remarkably restricted. The only
    mechanistic hint is regional: in Rnf170-null mice Itpr1 protein accumulates in
    cerebellum and spinal cord but not cerebral cortex, showing that the
    consequences of losing this pathway are already region-dependent at the
    biochemical level. That does not explain why large sensory neurons in the dorsal
    root ganglia are the cells that die in humans, and it sits awkwardly with the
    clinical sparing of the cerebellum. Nor does it explain why the closely related
    recessive disease targets upper motor neurons instead. No neuropathological
    study of dorsal root ganglia in ADSA has been reported, so the ganglionopathy is
    inferred entirely from electrophysiology and imaging, and selective
    vulnerability is the central unexplained feature of the disorder.
  proposed_experiments:
  - experiment_id: exp_adsa_cell_type_pathway_comparison
    name: Cross-cell-type comparison of the erlin1/2-RNF170-IP3 receptor module
    description: >-
      Compare RNF170, ERLIN1/2 and ITPR1 expression levels and IP3-receptor turnover
      kinetics across dorsal root ganglion sensory neurons, corticospinal motor
      neurons and cerebellar Purkinje cells, to test whether pathway dependency
      tracks the disease-vulnerable cell type.
    would_support:
    - pathophysiology#Dorsal Root Ganglion Sensory Neuronopathy
  - experiment_id: exp_adsa_ipsc_sensory_neuron_calcium
    name: Calcium handling in patient-derived iPSC sensory neurons
    description: >-
      Measure agonist-evoked ER calcium release in patient-derived iPSC sensory
      neurons carrying p.Arg199Cys alongside isogenic controls and RNF170-null lines,
      to test whether the sensory-neuron lineage is disproportionately sensitive.
    would_support:
    - pathophysiology#Dysregulated ER Calcium Release in Sensory Neurons
  - experiment_id: exp_adsa_human_drg_neuropathology
    name: Neuropathological examination of ADSA dorsal root ganglia
    description: >-
      Perform neuropathological examination of dorsal root ganglia and spinal cord
      from an affected individual. No such study has been reported, so the
      ganglionopathy is currently inferred entirely from electrophysiology and
      imaging.
    would_support:
    - pathophysiology#Dorsal Root Ganglion Sensory Neuronopathy
  evidence:
  - reference: PMID:26433933
    reference_title: Age-dependent gait abnormalities in mice lacking the Rnf170 gene
      linked to human autosomal-dominant sensory ataxia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Protein blot analysis revealed that the amount of Itpr1 protein was significantly elevated in the cerebellum and spinal cord but intact in the cerebral cortex in Rnf170(-/-) mice."
    explanation: >-
      Demonstrates that loss of this pathway has region-selective biochemical
      consequences, the only current clue to selective vulnerability.

- discussion_id: adsa_true_pathogenic_substrate_of_rnf170
  prompt: >-
    If mutant RNF170 ubiquitinates IP3 receptors normally, what substrate actually
    mediates the calcium-signalling defect and the neurodegeneration?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired erlin1/2-RNF170-Mediated IP3 Receptor ERAD
  - pathophysiology#Dysregulated ER Calcium Release in Sensory Neurons
  rationale: >-
    The assumption that ADSA is a disease of IP3 receptor ERAD is inherited from
    RNF170's known biochemistry, not demonstrated in patient cells. In ADSA
    lymphoblasts the calcium defect is real, yet mutant RNF170 attaches the full
    normal set of ubiquitin conjugates to activated IP3 receptors, and receptor
    level, store content and IP3 production are unchanged. The original
    investigators therefore concluded that the defect reflects abnormal
    ubiquitination of other, unidentified substrates or an adaptive response to
    chronically low RNF170. Identifying the operative substrate would determine
    whether ADSA is genuinely an IP3-receptor-turnover disease or a distinct ER
    quality-control disease that merely shares a gene with one.
  proposed_experiments:
  - experiment_id: exp_adsa_ubiquitinome_profiling
    name: Comparative ubiquitinome profiling of ADSA patient cells
    description: >-
      Perform comparative ubiquitinome or diGly proteomics on ADSA patient cells and
      isogenic controls to identify substrates whose ubiquitination is altered by
      p.Arg199Cys.
    would_support:
    - pathophysiology#Dysregulated ER Calcium Release in Sensory Neurons
  - experiment_id: exp_adsa_mutant_rnf170_interactome
    name: RNF170 interactome in the mutant versus wild-type state
    description: >-
      Define the RNF170 interactome in the mutant versus wild-type state, including
      the erlin1/2 and TMUB1 scaffolds, to look for a poisoned complex.
    would_support:
    - pathophysiology#Impaired erlin1/2-RNF170-Mediated IP3 Receptor ERAD
  - experiment_id: exp_adsa_calcium_defect_in_sensory_neurons
    name: Reproduce the calcium defect in the degenerating cell type
    description: >-
      Determine whether the lymphoblast calcium defect is cell-autonomous and
      reproducible in sensory neurons, the cell type that actually degenerates,
      rather than only in an immortalised blood-derived lineage.
    would_support:
    - pathophysiology#Dysregulated ER Calcium Release in Sensory Neurons
  evidence:
  - reference: PMID:25882839
    reference_title: A Point Mutation in the Ubiquitin Ligase RNF170 That Causes Autosomal
      Dominant Sensory Ataxia Destabilizes the Protein and Impairs Inositol 1,4,5-Trisphosphate
      Receptor-mediated Ca2+ Signaling.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Rather, the defect likely reflects abnormal ubiquitination of other substrates, or adaptation to the chronic reduction in RNF170 levels."
    explanation: >-
      States the unresolved substrate question in the words of the study that
      created it.
notes: >-
  Scope, provenance, module-conformance and named-entity-confusion notes for this
  entry.


  (1) No GeneReviews baseline exists. PubMed searches for a GeneReviews chapter
  covering RNF170, ADSA or sensory ataxia returned no results, so the usual
  GeneReviews phenotype baseline could not be applied. The phenotype block was
  instead built from the three primary clinical reports that together constitute
  essentially the entire clinical literature on this disorder: the gene-discovery
  paper on the two Maritime Canadian families (PMID:21115467), the Belgian family
  (PMID:34469621), and the Ecuadorian family reported in detail as a CANVAS mimic
  (PMID:32943585, whose full text is cached and supplies examination-level detail).
  Every clinical feature named in those reports is represented above.


  (2) Named-entity-confusion (NEC) preflight. This disorder sits in two
  high-NEC-risk classes at once: it belongs to a numbered ataxia series and it
  shares its gene with a differently named, differently inherited disease. The
  MONDO record for MONDO:0012166 was pulled with OAK and gave three independent
  identity anchors, all of which match this entry: the causal gene RNF170
  (relationship RO:0004003 HGNC:25358), the OMIM xref OMIM:608984, and the synonyms
  ADSA and SNAX1. The two nearest confusable entities were checked and are
  deliberately excluded: autosomal recessive spastic paraplegia 85 (SPG85,
  MONDO:0030512, OMIM:619686, biallelic RNF170 loss of function) and RFC1-related
  CANVAS. Neither is curated here as a manifestation of ADSA; both are recorded as
  differential diagnoses. Both deep-research reports were independently NEC-screened
  by gene-mention frequency and passed: falcon named RNF170 160 times against 10 for
  RFC1 (p.Arg199Cys 22 times), openscientist 71 times against 3 for RFC1
  (p.Arg199Cys 11 times).


  (3) Allelic-series discipline. Only one variant, p.Arg199Cys, has ever been linked
  to sensory ataxia; every other pathogenic RNF170 allele reported is a biallelic
  loss-of-function variant causing spastic paraplegia. Literature retrieved for
  "RNF170" is therefore dominated by the recessive HSP disease (PMID:31636353,
  PMID:33165979, PMID:35041108, PMID:36046950, PMID:38499745, PMID:42462372) and by
  basic erlin/IP3-receptor cell biology. Recessive-disease papers are cited in this
  entry only where they legitimately bear on ADSA — as differential diagnosis, as
  evidence about the shared ER module, or as the source of the crucial observation
  that heterozygous null carriers are unaffected — and never as evidence for an ADSA
  clinical feature.


  (4) Module conformance, and three deliberate non-conformances. Exactly one node
  declares conformance to `peripheral_axonal_degeneration`: "Dorsal Root Ganglion
  Sensory Neuronopathy" conforms to `#Insult to Peripheral Neurons and Schwann
  Cells` (a genetic insult to peripheral sensory neurons). Conformance is
  deliberately NOT declared for that module's `#Distal Axonal Degeneration and
  Demyelination` or `#Length-Dependent Nerve Fiber Dysfunction` nodes, because
  where ADSA behaves as a ganglionopathy the insult is at the sensory neuron cell
  body, degeneration proceeds along both central and peripheral branches, and the
  resulting sensory loss is not length-dependent — the hands are often as affected
  as the feet, and pseudoathetosis and areflexia dominate over the distal
  glove-and-stocking pattern those module nodes describe. "Peripheral Sensory Axon
  Degeneration" therefore records the peripheral branch of a ganglionopathy rather
  than distal dying-back, and does not declare conformance despite the documented
  reduced or absent sensory nerve action potentials. Conformance is also
  not declared for `#Axonal Transport Impairment and Mitochondrial Dysfunction`, for
  which there is no RNF170-specific evidence. Conformance to
  `cerebellar_purkinje_degeneration` was considered and rejected outright: cerebellar
  involvement is characteristically absent, brain MRI including the cerebellum is
  normal, and the diagnostic value of the syndrome lies precisely in severe ataxia
  with a normal cerebellum.


  (5) Mechanism is genuinely unresolved, and the entry is built to show that rather
  than to hide it. Three `mechanistic_hypotheses` are recorded with
  hypothesis-tagged causal edges: a toxic gain-of-function or dominant-negative
  model (EMERGING, currently favoured in the literature), simple haploinsufficiency
  (ALTERNATIVE, explicitly argued against by the unaffected heterozygous null
  carriers), and dysregulation of an unidentified non-IP3-receptor substrate
  (EMERGING). The "Impaired erlin1/2-RNF170-Mediated IP3 Receptor ERAD" node carries
  `mechanism_confidence: PROVISIONAL` and a REFUTE-tagged evidence item, because the
  canonical assumption that ADSA is an IP3-receptor-ERAD disease is not supported in
  patient cells.


  (6) A 2026 case report is deliberately not used to expand the phenotype.
  PMID:42052314 describes a 60-year-old woman with hypertrophic olivary
  degeneration, palatal myoclonus, pendular nystagmus and mild cerebellar atrophy in
  whom "genetic testing revealed a heterozygous mutation in the RNF170 gene". The
  specific variant is not stated, there was no family history of ataxia, and
  cerebellar atrophy and palatal tremor are features the established ADSA literature
  explicitly reports as absent. This report is therefore treated as an unverified
  phenotype-expansion claim of uncertain significance: only the positive Romberg
  sign, which is consistent with the established phenotype, is cited from it, and
  hypertrophic olivary degeneration, palatal myoclonus, nystagmus and cerebellar
  atrophy are NOT curated as ADSA phenotypes. If the variant is later shown to be
  p.Arg199Cys and the association replicated, this decision should be revisited.
  Following review, the Positive Romberg Sign phenotype no longer depends on this
  report: its primary evidence is now the genotype-confirmed p.Arg199Cys Ecuadorian
  index case (PMID:32943585), with this case report retained only as a secondary
  corroborating item, so the phenotype stands regardless of how PMID:42052314 is
  ultimately judged.


  (7) Treatment evidence is intentionally sparse. There is no disease-modifying
  therapy and no ADSA-specific trial, cohort or guideline; ClinicalTrials.gov
  searches performed during deep research by both providers returned no
  disease-specific trial. The rehabilitation entry is recorded without an evidence
  item and with an explanatory note rather than being supported by a citation that
  does not address this disease. No `clinical_trials` block is asserted.


  (8) Onset is not curated as a phenotype. Adult/late onset is a defining feature of
  this disorder, but the HPO onset terms (HP:0003581 Adult onset, HP:0003584 Late
  onset) live in the Clinical modifier subtree rather than the Phenotypic
  abnormality subtree and are not members of the schema's `PhenotypeTerm` dynamic
  enum. Onset is therefore carried in the `progression` phases, the `inheritance`
  description and the Progressive Gait Ataxia description instead of as a
  pseudo-phenotype with an invalid term binding.


  (8a) Ontology-term granularity decisions made in review. Two bindings were
  changed and one was deliberately declined. `Pyramidal Signs` was rebound from
  HP:0001257 Spasticity to its parent HP:0007256 Abnormal pyramidal sign, because
  the only cited source says "pyramidal involvement" generically and asserting
  spasticity specifically over-committed relative to the evidence. The bundled
  "Paresthesia and Dysesthesia" phenotype was split down to a single concept and
  rebound from HP:0003401 Paresthesia to HP:0012534 Dysesthesia, since the snippet
  reports "dysaesthesia" and only that is snippet-supportable. Conversely, the new
  `Pseudoathetosis` phenotype is deliberately left with a free-text
  `preferred_term` and NO `term:` binding: HPO has no pseudoathetosis term,
  HP:0011443 resolves to the very broad "Abnormality of coordination", and
  HP:0002305 Athetosis would be actively misleading because pseudoathetosis is a
  deafferentation sign rather than an extrapyramidal one. A missing binding is
  preferable to a wrong one.


  (9) Deep-research provenance. Two independent deep-research reports were generated
  and are committed at
  `research/Autosomal_Dominant_Sensory_Ataxia_1-deep-research-falcon.md` and
  `research/Autosomal_Dominant_Sensory_Ataxia_1-deep-research-openscientist.md`.
  They were used as lead-generation and cross-check layers only: every PMID, snippet
  and ontology term in this entry was independently fetched and verified against the
  cached reference body, and no citation was taken from either report on trust. Both
  proved concordant with the primary literature and with each other on disease
  identity, the p.Arg199Cys allele, the dorsal-root-ganglion localisation, the CANVAS
  contrast and the unresolved dominance mechanism. Notably, openscientist reached the
  same conclusion recorded in the HUMAN_MODEL_MISMATCH discussion above
  independently, stating that the existing mouse and dog models are
  loss-of-function/recessive and better model SPG85 than ADSA. falcon failed to
  recover the OMIM identifier that the MONDO record supplies directly, and cited a
  narrower source set than the primary-literature sweep performed here;
  openscientist converged on the same 13-paper evidence base identified
  independently.

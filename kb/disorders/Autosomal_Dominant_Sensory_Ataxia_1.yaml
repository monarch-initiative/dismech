- name: Vestibular Ganglion Sensory Neuron Degeneration
  biological_scale: TISSUE
  description: >-
    In advanced disease the same vulnerability extends to the vestibular
    (Scarpa's) ganglion, producing bilateral vestibular hypofunction detectable as
    impaired vestibulo-ocular reflex gain on video head impulse testing. This was
    documented in one index case in whom testing three years earlier had been only
    borderline, indicating late and progressive involvement. Together with the
    sensory ganglionopathy this makes ADSA a phenocopy of RFC1-related CANVAS, and
    supports a shared susceptibility of sensory neurons in spinal, cranial and
    vestibular ganglia.

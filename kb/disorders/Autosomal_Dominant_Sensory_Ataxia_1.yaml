- name: Dysregulated ER Calcium Release in Sensory Neurons
  biological_scale: MOLECULAR
  description: >-
    The convergent functional abnormality, reached by whichever upstream route is
    correct. Patient lymphoblasts mobilise significantly less cytosolic Ca2+ in
    response to platelet-activating factor, while store content, receptor level
    and IP3 production are all normal — localising the defect to the IP3 receptor
    itself. In Rnf170-null mice Itpr1 protein accumulates in the cerebellum and
    spinal cord but not the cerebral cortex, showing that loss of this pathway
    perturbs IP3 receptor homeostasis in a regionally selective way. Note that
    this regional pattern does not map cleanly onto the human lesion, since the
    cerebellum is clinically and radiologically spared in ADSA.

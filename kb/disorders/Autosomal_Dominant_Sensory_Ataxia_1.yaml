- name: Dorsal Root Ganglion Sensory Neuronopathy
  biological_scale: CELLULAR
  conforms_to: peripheral_axonal_degeneration#Insult to Peripheral Neurons and Schwann
    Cells
  description: >-
    Degeneration of large sensory neurons whose cell bodies lie in the dorsal
    root ganglia and whose centrally projecting branches form the posterior
    columns. That the insult originates at the cell body (a neuronopathy or
    ganglionopathy) rather than at the distal axon is an inference, drawn from
    combined electrophysiology and imaging and best evidenced in the Ecuadorian
    kindred, where both the central and the peripheral branch degenerate; that
    non-length-dependent pattern explains prominent upper- as well as lower-limb
    sensory involvement in that family. The inference must not be generalized to
    every ADSA1 kindred: the original Canadian families had normal sensory nerve
    conduction despite posterior-column disease, so the peripheral branch is not
    always involved. The node is marked PROVISIONAL for that reason. It is not
    frequency-banded, because it is the sole modelled route to the universal
    defining lesion; the genuinely variable peripheral arm is banded separately
    on "Peripheral Sensory Axon Degeneration".

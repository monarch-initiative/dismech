inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    ADSA segregates as an autosomal dominant trait in every reported kindred:
    two founder-related families from Maritime Canada, a Belgian family, and an
    Ecuadorian family, all carrying the same heterozygous RNF170 p.Arg199Cys
    allele. Onset is late (fifth to seventh decade), so apparently unaffected
    younger relatives cannot be scored as non-penetrant; age-dependent
    penetrance is therefore not established and no penetrance figure is asserted.
  evidence:
  - reference: PMID:32943585
    reference_title: 'Mutation in RNF170 causes sensory ataxic neuropathy with vestibular
      areflexia: a CANVAS mimic.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By exome-sequencing we have identified the same p.Arg199Cys RNF170 mutation in an Ecuadorian family affected by an autosomal dominant late-onset progressive sensory ganglionopathy."
    explanation: >-
      An independent third kindred confirms dominant transmission of the same
      allele.
  - reference: PMID:32943585
    reference_title: 'Mutation in RNF170 causes sensory ataxic neuropathy with vestibular
      areflexia: a CANVAS mimic.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two sisters III-2 and III-4, aged 58 and 49, are reportedly unaffected but given the late onset of the disease were not considered for segregation analysis."
    explanation: >-
      Documents why apparent non-penetrance cannot be scored in this late-onset
      disorder.

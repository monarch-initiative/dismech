    causal_link_type: DIRECT

- name: RNF170 Protein Destabilization by Enhanced Autoubiquitination
  biological_scale: MOLECULAR
  description: >-
    The destabilised mutant protein autoubiquitinates more avidly and is cleared
    by the proteasome, so steady-state RNF170 levels fall. This is seen both in
    cells transfected with mutant constructs and, importantly, in lymphoblasts
    from ADSA patients, establishing that the reduced-dosage state exists in
    patient tissue and is not an overexpression artefact.

- name: Impaired erlin1/2-RNF170-Mediated IP3 Receptor ERAD
  biological_scale: MOLECULAR
  description: >-
    RNF170 is the E3 ligase arm of the ER quality-control module that disposes of
    activated IP3 receptors. On receptor activation the erlin1/2 (SPFH1/2)
    complex binds the third intralumenal loop of IP3R1 and recruits RNF170, which
    then attaches the mono-, K48- and K63-linked ubiquitin conjugates that commit
    the receptor to ERAD. Erlin1/2 binding is the rate-limiting first step and
    RNF170 recruitment depends on it. Reduced RNF170 availability slows this
    turnover pathway. This node states the canonical pathway; the evidence that
    mutant RNF170 actually fails at this step is weak, which is why the causal
    edge into it is hypothesis-tagged and the node carries PROVISIONAL confidence.
  biological_processes:
  - preferred_term: ERAD pathway
    term:

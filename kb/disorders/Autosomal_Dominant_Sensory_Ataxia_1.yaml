name: Autosomal Dominant Sensory Ataxia 1
creation_date: '2026-08-01T00:00:00Z'
category: Mendelian
synonyms:
- ADSA
- SNAX1
- RNF170 hereditary ataxia
- ataxia, sensory, 1, autosomal dominant
- hereditary ataxia caused by mutation in RNF170
description: >-
  Autosomal dominant sensory ataxia 1 (ADSA, SNAX1) is an ultra-rare, adult-onset,
  slowly progressive, predominantly sensory ataxia caused by the recurrent
  heterozygous RNF170 missense variant p.Arg199Cys (c.595C>T). RNF170 is an
  endoplasmic reticulum membrane RING-finger E3 ubiquitin ligase that is
  recruited by the erlin1/2 (SPFH1/2) complex to conformationally activated
  inositol 1,4,5-trisphosphate (IP3) receptors and commits them to
  endoplasmic-reticulum-associated degradation (ERAD), thereby setting the
  turnover rate of the principal ER calcium-release channel.


  The defining anatomical lesion is degeneration of the posterior (dorsal)
  columns of the spinal cord. Some kindreds additionally show a sensory
  neuronopathy (ganglionopathy) of the dorsal root ganglia with degeneration of
  both central and peripheral branches of large sensory neurons. Normal sensory
  nerve conduction in the original Canadian families demonstrates that the
  peripheral branch is spared in those kindreds, which argues against — though it
  does not by itself disprove — a universal ganglionopathy.
  Patients present in the fifth to seventh decade with
  progressive unsteadiness, loss of proprioception
  and vibration sense, a positive Romberg sign and lower limb areflexia,
  progressing over years to walking-aid dependence. Cerebellar function and
  cerebellar imaging are characteristically spared, distinguishing ADSA from the
  spinocerebellar ataxias. Variable additional features include pyramidal signs,
  impaired smooth pursuit, and — in advanced disease — bilateral vestibular
  areflexia that can make ADSA a phenocopy ("mimic") of RFC1-negative CANVAS.


  ADSA sits at the dominant end of an RNF170 allelic series whose recessive end
  is a mechanistically and clinically distinct disease: biallelic RNF170
  loss-of-function variants cause autosomal recessive spastic paraplegia 85
  (SPG85), with primary upper-motor-neuron rather than dorsal-root-ganglion
  involvement. Because heterozygous carriers of RNF170 null alleles are
  unaffected, simple haploinsufficiency is an unlikely explanation for the
  dominant sensory ataxia, and the mechanism by which p.Arg199Cys acts remains
  genuinely unresolved.

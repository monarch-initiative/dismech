- name: Peripheral Sensory Axon Degeneration
  biological_scale: TISSUE
  description: >-
    Degeneration of the peripherally projecting branches of the affected dorsal
    root ganglion neurons, expressed electrophysiologically as reduced or absent
    sensory nerve action potentials with preserved motor conduction. This arm is
    genuinely variable across kindreds and is the main phenotypic difference
    between the reported families: the Maritime Canadian families had normal
    sensory nerve conduction (a purely central posterior-column picture), whereas
    the Ecuadorian family had absent sensory action potentials in all four limbs.
    The reason for this difference is unknown; a modifying genetic background has
    been proposed by the authors as a hypothesis, not demonstrated.

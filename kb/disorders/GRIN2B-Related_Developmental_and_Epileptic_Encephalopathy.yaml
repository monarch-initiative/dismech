- name: L-Serine Supplementation
  description: >-
    For loss-of-function variants, oral L-serine (an NMDA-receptor co-agonist
    precursor of D-serine and glycine) has been trialed to potentiate
    hypofunctional NMDA-receptor signaling; a phase 2A trial in GRIN
    loss-of-function patients reported motor-function and adaptive-behavior
    improvement.
  therapeutic_modality: SMALL_MOLECULE

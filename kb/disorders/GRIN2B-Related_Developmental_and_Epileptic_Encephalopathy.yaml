    explanation: >-
      The founding study identified de novo GRIN2B mutations in affected
      individuals.
pathophysiology:
- name: GRIN2B Variant Altering the GluN2B NMDA Receptor Subunit
  biological_scale: MOLECULAR
  description: >-
    De novo heterozygous missense or protein-truncating variants in GRIN2B alter
    the GluN2B subunit of the NMDA receptor. Because GluN2B-containing NMDA
    receptors predominate in the developing forebrain, variants perturb the
    receptor at a developmentally critical window.

    evidence_source: MODEL_ORGANISM
    snippet: "In Grin2b+/C456Y mice, GluN2B protein levels were strongly reduced in association with decreased hippocampal NMDAR currents and NMDAR-dependent long-term depression (LTD) but unaltered long-term potentiation, indicative of mutation-induced protein degradation and LTD sensitivity."

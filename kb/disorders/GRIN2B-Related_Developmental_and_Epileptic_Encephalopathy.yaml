  downstream:
  - target: Global Developmental Delay
    description: Impaired NMDAR-dependent synaptic maturation delays early motor, cognitive, and language milestone acquisition.
  - target: Intellectual Disability
    description: Defective hippocampal and cortical synaptic plasticity impairs learning, memory consolidation, and intellectual development.
  - target: Autistic Behavior
    description: Disrupted glutamatergic synapse organization and circuit maturation contribute to autism spectrum and behavioral features.
  - target: Hypotonia
    description: Altered central glutamatergic drive during early neurodevelopment impairs descending motor tone regulation.
  - target: Spasticity
    description: Disrupted corticospinal and sensorimotor circuit maturation contributes to upper-motor-neuron tone abnormalities.
  - target: Feeding Difficulties
    description: Impaired central sensorimotor network development and axial hypotonia disrupt coordinated oral-motor feeding.
  - target: Movement Disorder
    description: Dysregulated glutamatergic circuit development across corticostriatal networks produces hyperkinetic movement abnormalities.
  - target: Cerebral Visual Impairment
    description: Impaired activity-dependent maturation of visual cortical synapses disrupts central visual processing.
- name: Cortical Excitation-Inhibition Imbalance
  biological_scale: TISSUE
  description: >-
    Dysregulated NMDA-receptor signaling shifts the balance between excitation
    and inhibition in developing cortical networks, producing neuronal
    hyperexcitability and hypersynchrony that generate seizures.

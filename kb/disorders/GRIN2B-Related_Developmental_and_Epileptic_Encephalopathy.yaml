    reference_title: "Mutations in GRIN2A and GRIN2B encoding regulatory subunits of NMDA receptors cause variable neurodevelopmental phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Either GRIN2B or GRIN2A, encoding the NMDA receptor subunits NR2B and NR2A, was found to be disrupted by chromosome translocation breakpoints in individuals with mental retardation and/or epilepsy."
    explanation: >-
      Establishes GRIN2B (GluN2B/NR2B) disruption as a cause of intellectual
      disability and epilepsy.

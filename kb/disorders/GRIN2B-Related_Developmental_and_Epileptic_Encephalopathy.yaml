discussions:
- discussion_id: gap_grin2b_gof_vs_lof_precision_therapy
  prompt: >-
    Can GRIN2B missense variants be reliably partitioned into gain-of-function
    and loss-of-function classes, and does that functional classification predict
    the clinical phenotype and the response to NMDA-receptor-directed precision
    therapy (channel blockers such as memantine or dextromethorphan for
    gain-of-function; receptor-enhancing strategies for loss-of-function)?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#NMDA Receptor Gain-of-Function
  - pathophysiology#NMDA Receptor Loss-of-Function
  rationale: >-
    GRIN2B variants converge on the same downstream disease but through opposite
    changes in receptor activity, so the gain-of-function versus loss-of-function
    distinction is potentially the key determinant of both phenotype and rational
    treatment. However, functional classification requires electrophysiological
    characterization that is not available for most variants, many variants have
    mixed or partial effects, and clinical evidence that NMDA-receptor
    antagonists benefit gain-of-function patients is limited to case reports.
    Resolving whether functional class predicts phenotype and treatment response
    is central to precision therapy for this disorder.
  proposed_experiments:
  - experiment_id: exp_grin2b_variant_functional_treatment_map
    name: Systematic functional-class to phenotype and treatment-response mapping
    description: >-
      Characterize a large panel of patient GRIN2B variants with standardized
      electrophysiology (agonist potency, open probability, calcium permeability,
      magnesium block, surface expression) to assign gain- or loss-of-function
      class, then correlate class with deep clinical phenotyping and with
      prospectively collected responses to NMDA-receptor-directed therapy.
  evidence:
  - reference: PMID:28377535
    reference_title: "GRIN2B encephalopathy: novel findings on phenotype, variant clustering, functional consequences and treatment aspects."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional consequences of variants were diverse, revealing various potential gain-of-function and loss-of-function mechanisms and a retained sensitivity to the use-dependent blocker memantine."
    explanation: >-
      Variants show diverse gain- and loss-of-function consequences, and
      gain-of-function receptors retain memantine sensitivity, motivating the
      precision-therapy question.

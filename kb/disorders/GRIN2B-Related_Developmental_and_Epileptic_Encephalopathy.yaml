name: GRIN2B-Related Developmental and Epileptic Encephalopathy
creation_date: "2026-07-22T00:00:00Z"
category: Mendelian
synonyms:
- DEE27
- EIEE27
- GRIN2B-related developmental and epileptic encephalopathy
- Developmental and epileptic encephalopathy 27
description: >-
  GRIN2B-related developmental and epileptic encephalopathy (DEE27) is a
  neurodevelopmental disorder caused by de novo heterozygous variants in GRIN2B,
  which encodes the GluN2B subunit of the N-methyl-D-aspartate (NMDA) glutamate
  receptor. GluN2B-containing NMDA receptors are the dominant NMDA receptors in
  the developing brain and are central to excitatory synaptic transmission,
  calcium-dependent signaling, and activity-dependent synapse maturation and
  plasticity. Pathogenic GRIN2B variants fall into two broad functional classes:
  gain-of-function variants that increase NMDA receptor activity, and
  loss-of-function variants that reduce receptor function or surface expression.
  Both classes disrupt tightly regulated NMDA-receptor signaling, impairing
  synaptic development and plasticity (producing developmental delay and
  intellectual disability) and altering the cortical excitation-inhibition
  balance (producing seizures). The disorder presents in infancy or early
  childhood with a spectrum from intellectual disability and autism without
  epilepsy to severe early-onset epileptic encephalopathy.

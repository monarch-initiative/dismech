- name: Impaired Synaptic Development and Plasticity
  biological_scale: CELLULAR
  description: >-
    NMDA receptors, and GluN2B in particular, drive dendritic and synaptic
    maturation and activity-dependent plasticity (long-term potentiation and
    depression). Their dysregulation impairs synapse organization and plasticity,
    the substrate of the disorder's developmental delay and intellectual
    disability.

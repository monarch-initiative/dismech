- name: NMDA Receptor Gain-of-Function
  biological_scale: MOLECULAR
  description: >-
    A subset of GRIN2B missense variants increases NMDA receptor activity by
    enhancing agonist (glutamate/glycine) potency, increasing channel open
    probability or calcium permeability, or reducing voltage-dependent
    magnesium block, producing excessive NMDA-receptor-mediated current and
    calcium influx.

name: Non-24-Hour Sleep-Wake Rhythm Disorder
creation_date: "2026-08-24T00:00:00Z"
category: Neurological Disorder
parents:
- Sleep Disorder
- Neurological Disease
disease_term:
  preferred_term: non-24-hour sleep-wake rhythm disorder
  term:
    id: MONDO:0019137
    label: non-24-hour sleep-wake syndrome
description: >-
  Non-24-hour sleep-wake rhythm disorder (free-running disorder,
  hypernycthemeral syndrome) is the circadian disorder in which the pacemaker is
  not locked to the 24-hour day at all. The human circadian clock has an
  intrinsic period slightly longer than 24 hours and is reset each morning by
  retinal light exposure. Where that light signal cannot reach the
  suprachiasmatic nucleus - as in total blindness without light perception - the
  clock runs at its own period, so sleep onset and wake time drift progressively
  later day after day. The clinical consequence follows directly from the
  arithmetic: symptoms are cyclical rather than constant, because the drifting
  endogenous phase passes in and out of alignment with the imposed schedule over
  weeks. Patients therefore have alternating periods of entirely normal sleep
  and severe insomnia with daytime sleepiness, which is what makes the diagnosis
  so often missed - a patient assessed during an aligned stretch looks well.
  Diagnosis requires demonstrating a circadian period outside the normal range,
  which needs repeated measurement of a phase marker over time rather than a
  single assessment. It is rare in the general population and common in the
  totally blind, where it may affect up to half of those without light
  perception.
notes: >-
  THE WORKED CONFORMER FOR THE ENTRAINMENT ARM. This entry is the cleanest
  available case of circadian_phase_misalignment's second entry arm, and is
  curated partly for that reason: the oscillator is entirely normal, and the
  disorder consists of losing the input that should reset it. That separation is
  hard to demonstrate in jet lag or shift work, where the light signal is present
  but mistimed, and impossible in the familial clock-variant disorders, where the
  oscillator itself is altered. It is also the setting in which the module's
  drug-target pattern is cleanest, since a timed melatonin-receptor signal
  entrains the pacemaker with no competing photic input.

  A NOTE ON THE SIGHTED FORM. Non-24 also occurs in sighted people, usually young
  men, typically evolving out of a delayed sleep-wake phase disorder, and there
  the mechanism cannot be simple absence of light input - it is more plausibly a
  combination of a long intrinsic period with behaviourally mistimed light
  exposure. This entry curates the blind form, where the mechanism is
  established, and does not extend the trigger node's claim to the sighted form.
pathophysiology:
- name: Absence of Photic Input to the Suprachiasmatic Nucleus
  description: >-
    The trigger. Photoentrainment does not use the image-forming visual pathway:
    melanopsin-expressing intrinsically photosensitive retinal ganglion cells
    project directly to the suprachiasmatic nucleus, and rods and cones are not
    required. The clinically important consequence is that visual and circadian
    blindness dissociate - a person with no useful vision but a surviving ipRGC
    pathway can still entrain normally, while loss of the eyes or of the
    retinohypothalamic projection removes entrainment entirely. This is why the
    disorder tracks light perception rather than visual acuity, and why the
    at-risk group is specifically those without light perception rather than the
    blind generally.
  role: trigger
  biological_scale: CELLULAR
  conforms_to: "circadian_phase_misalignment#Loss or Mistiming of Photic Entrainment Input"
  cell_types:
  - preferred_term: melanopsin-expressing intrinsically photosensitive retinal ganglion cell
    term:
      id: CL:0020014
      label: intrinsically photosensitive retinal ganglion cell
    modifier: DECREASED
  biological_processes:
  - preferred_term: entrainment of the circadian clock by photoperiod
    term:
      id: GO:0043153
      label: entrainment of circadian clock by photoperiod
    modifier: DECREASED
  locations:
  - preferred_term: retina
    term:
      id: UBERON:0000966
      label: retina
  evidence:
  - reference: PMID:29326647
    reference_title: "Non-24-Hour Sleep-Wake Rhythm Disorder in the Totally Blind: Diagnosis and Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Daily retinal light exposure is necessary for the synchronization of the
      circadian rhythms with the external 24-h solar environment.
    explanation: >-
      States the input this node loses, and that it is a requirement rather than
      a contributor to entrainment.
  - reference: PMID:11834834
    reference_title: "Melanopsin-containing retinal ganglion cells: architecture, projections, and intrinsic photosensitivity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The primary circadian pacemaker, in the suprachiasmatic nucleus (SCN) of
      the mammalian brain, is photoentrained by light signals from the eyes
      through the retinohypothalamic tract. Retinal rod and cone cells are not
      required for photoentrainment.
    explanation: >-
      Establishes that the entrainment pathway is separable from image-forming
      vision, which is the basis for the dissociation between visual and
      circadian blindness this node turns on.
  - reference: PMID:26466871
    reference_title: "Tasimelteon for non-24-hour sleep-wake disorder in totally blind people (SET and RESET): two multicentre, randomised, double-masked, placebo-controlled phase 3 trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most totally blind people have non-24-hour sleep-wake disorder (non-24), a
      rare circadian rhythm disorder caused by an inability of light to reset
      their circadian pacemaker.
    explanation: >-
      States the causal claim of this node directly - the disorder is caused by
      light being unable to reset the pacemaker, not by any abnormality of the
      pacemaker itself.
  downstream:
  - target: Free-Running Circadian Period
    description: >-
      Without a daily resetting signal the pacemaker reverts to its own intrinsic
      period, which in most people is slightly longer than 24 hours.
    causal_link_type: DIRECT

- name: Free-Running Circadian Period
  description: >-
    The pacemaker runs at its intrinsic period rather than at 24 hours. Under
    stringent measurement the human circadian period lies roughly between 23.8
    and 25.1 hours; in an entrained person daily light resets it to exactly 24,
    and without that correction the residual difference accumulates. The
    arithmetic is what generates the clinical picture: a person whose
    non-entrained period is 24.5 hours goes to sleep and wakes half an hour later
    each day, so their phase completes a full circuit relative to the clock
    roughly every seven weeks. Crucially the oscillator itself is normal - this
    is a failure of correction, not of the clock, which distinguishes the
    disorder from the familial advanced and delayed phase syndromes.
  role: amplifier
  biological_scale: ORGANISM
  conforms_to: "circadian_phase_misalignment#Shifted or Free-Running Endogenous Circadian Phase"
  biological_processes:
  - preferred_term: circadian rhythm
    term:
      id: GO:0007623
      label: circadian rhythm
    modifier: ABNORMAL
  locations:
  - preferred_term: suprachiasmatic nucleus
    term:
      id: UBERON:0002034
      label: suprachiasmatic nucleus
  evidence:
  - reference: PMID:29326647
    reference_title: "Non-24-Hour Sleep-Wake Rhythm Disorder in the Totally Blind: Diagnosis and Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This master clock has, for most humans, an intrinsic rhythm slightly longer
      than 24 h.
    explanation: >-
      Gives the intrinsic period that this node reverts to, and its direction -
      longer than 24 hours - which is why the drift is almost always later rather
      than earlier.
  - reference: PMID:30083814
    reference_title: Circadian Rhythm Disturbances in the Blind.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In most humans, the circadian period is slightly longer than 24 h and
      without regular resetting it tends to drift, leading to progressively later
      bedtimes and wake times and a tendency to cycle though periods of normal
      and abnormal sleep.
    explanation: >-
      States the whole mechanism of this node and the next in one sentence,
      including the cyclical alternation of normal and abnormal sleep that
      follows from a drifting phase.
  downstream:
  - target: Cyclical Misalignment with the 24-Hour Schedule
    description: >-
      A phase that drifts continuously passes in and out of alignment with the
      fixed social schedule, rather than sitting at a stable wrong offset.
    causal_link_type: DIRECT

- name: Cyclical Misalignment with the 24-Hour Schedule
  description: >-
    The rate-limiting step, and it differs from the fixed-phase circadian
    disorders in a way that matters clinically. In advanced or delayed sleep
    phase disorder the misalignment is constant, so symptoms are constant. Here
    the endogenous phase migrates through all clock times, so the patient cycles
    between stretches of entirely normal sleep, when phase happens to coincide
    with the schedule, and stretches of severe insomnia and daytime sleepiness,
    when it is opposed. That cyclicity is the disorder's signature and its main
    diagnostic obstacle: a single clinical assessment, a single sleep study, or a
    single phase marker taken during an aligned stretch will all look normal, and
    the complaint can be dismissed as inconsistent or behavioural.
  role: central_effector
  biological_scale: ORGANISM
  conforms_to: "circadian_phase_misalignment#Misalignment Between Endogenous Circadian Phase and the Imposed Sleep-Wake Schedule"
  biological_processes:
  - preferred_term: entrainment of circadian clock
    term:
      id: GO:0009649
      label: entrainment of circadian clock
    modifier: DECREASED
  - preferred_term: regulation of the circadian sleep/wake cycle
    term:
      id: GO:0042749
      label: regulation of circadian sleep/wake cycle
    modifier: ABNORMAL
  evidence:
  - reference: PMID:29326647
    reference_title: "Non-24-Hour Sleep-Wake Rhythm Disorder in the Totally Blind: Diagnosis and Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Affected patients experience cyclical or periodic episodes of poor sleep
      and daytime dysfunction, severely interfering with social, academic, and
      professional life.
    explanation: >-
      Establishes the cyclical rather than constant symptom pattern that this
      node encodes, and its functional impact.
  - reference: PMID:29326647
    reference_title: "Non-24-Hour Sleep-Wake Rhythm Disorder in the Totally Blind: Diagnosis and Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      remains challenging from a clinical point of view due to the cyclical
      symptoms and should be confirmed by measurements of circadian biomarkers
      such as urinary melatonin to demonstrate a circadian period outside the
      normal range
    explanation: >-
      Supports the diagnostic obstacle named in the description - that cyclicity
      itself is what makes the disorder hard to recognise, and why repeated
      biomarker measurement rather than a single assessment is required.
  downstream:
  - target: Cyclical Insomnia and Daytime Dysfunction
    description: >-
      When the drifting phase opposes the required schedule, sleep is attempted
      against an active circadian wake signal and wake is required at the
      circadian trough.
    causal_link_type: DIRECT

- name: Cyclical Insomnia and Daytime Dysfunction
  description: >-
    The clinical endpoint: alternating weeks of normal sleep and of severe
    sleep-onset insomnia with daytime sleepiness, cycling with a period set by
    the difference between the patient's intrinsic period and 24 hours. The
    resulting disability is social and occupational as much as symptomatic,
    because the unpredictability makes fixed commitments - school, employment,
    childcare - difficult to sustain even though the total amount of disturbed
    sleep is modest.
  role: consequence
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: circadian sleep/wake cycle, sleep
    term:
      id: GO:0050802
      label: circadian sleep/wake cycle, sleep
    modifier: ABNORMAL
  evidence:
  - reference: PMID:29326647
    reference_title: "Non-24-Hour Sleep-Wake Rhythm Disorder in the Totally Blind: Diagnosis and Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This circadian drift leads to cyclical sleep disturbances and daytime
      sleepiness which pose a major handicap.
    explanation: >-
      States the endpoint and its severity, linking it explicitly to the drift
      rather than to sleep loss as such.

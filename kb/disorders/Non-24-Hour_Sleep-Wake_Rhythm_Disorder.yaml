diagnosis:
- name: Serial circadian phase marker measurement
  description: >-
    The diagnosis cannot be made from a single assessment, which is the practical
    point that distinguishes it from every other sleep disorder here. Repeated
    measurement of a phase marker - urinary 6-sulphatoxymelatonin or plasma
    melatonin profiles over 24 hours, sampled on multiple occasions weeks apart -
    is required to demonstrate a circadian period outside the normal range.
    Actigraphy with a sleep diary over an extended period shows the characteristic
    progressive drift. A patient assessed during an aligned stretch will look
    entirely normal on any single measurement.
  diagnosis_term:
    preferred_term: actigraphy
    term:
      id: NCIT:C180883
      label: Actigraphy
  evidence:
  - reference: PMID:29326647
    reference_title: "Non-24-Hour Sleep-Wake Rhythm Disorder in the Totally Blind: Diagnosis and Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      should be confirmed by measurements of circadian biomarkers such as urinary
      melatonin to demonstrate a circadian period outside the normal range
    explanation: >-
      Establishes the diagnostic standard: a measured period outside the normal
      range, which requires serial rather than single measurement.
  - reference: PMID:30083814
    reference_title: Circadian Rhythm Disturbances in the Blind.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      New screening tools have been developed but actigraphy and repeated
      melatonin profiles over 24 h remain essential.
    explanation: >-
      Confirms that repeated profiling remains essential despite newer screening
      instruments, which is why this entry does not list a screening tool as
      sufficient.
treatments:
- name: Tasimelteon
  description: >-
    A dual MT1/MT2 melatonin receptor agonist taken at a fixed clock time each
    evening, and the only agent approved for this indication by both the FDA and
    the European Medicines Agency. It substitutes a pharmacological
    phase-setting signal for the missing photic one, entraining the free-running
    pacemaker to 24 hours. Two properties should be preserved by any entry citing
    it. It is substitutive, not curative: withdrawal loses entrainment again,
    which is itself the cleanest evidence that it acts on the phase node rather
    than on sleep. And the response rate is modest - entrainment was achieved in
    20% of treated patients at one month against 3% on placebo - so it should not
    be curated as reliably effective.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tasimelteon
      term:
        id: CHEBI:79042
        label: tasimelteon
  target_mechanisms:
  - target: Free-Running Circadian Period
    treatment_effect: ACTIVATES
    description: >-
      Timed MT1/MT2 agonism at the suprachiasmatic nucleus supplies the
      phase-setting signal that light cannot, entraining the free-running
      pacemaker to a 24-hour period.
  evidence:
  - reference: PMID:26466871
    reference_title: "Tasimelteon for non-24-hour sleep-wake disorder in totally blind people (SET and RESET): two multicentre, randomised, double-masked, placebo-controlled phase 3 trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Once-daily tasimelteon can entrain totally blind people with non-24;
      however, continued tasimelteon treatment is necessary to maintain these
      improvements.
    explanation: >-
      Randomised evidence for both halves of the claim: the agent entrains the
      pacemaker, and the effect is substitutive rather than curative.
  - reference: PMID:26466871
    reference_title: "Tasimelteon for non-24-hour sleep-wake disorder in totally blind people (SET and RESET): two multicentre, randomised, double-masked, placebo-controlled phase 3 trials."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Circadian entrainment occurred in eight (20%) of 40 patients in the
      tasimelteon group compared with one (3%) of 38 patients in the placebo
      group at month 1
    explanation: >-
      Cited as PARTIAL because it bounds the effect: entrainment at one month was
      achieved in a minority, so the node is druggable but far from reliably
      correctable.
  - reference: PMID:26466871
    reference_title: "Tasimelteon for non-24-hour sleep-wake disorder in totally blind people (SET and RESET): two multicentre, randomised, double-masked, placebo-controlled phase 3 trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two (20%) of ten patients who were withdrawn to placebo remained entrained
      compared with nine (90%) of ten who continued to receive tasimelteon
    explanation: >-
      The randomised-withdrawal arm, and the strongest evidence that the drug
      maintains entrainment rather than the patient having re-entrained
      spontaneously.
- name: Timed Melatonin
  description: >-
    Low-dose melatonin at a fixed evening time is the long-standing alternative,
    acting on the same receptors and the same node. It is used alongside
    behavioural measures - fixed sleep and wake times, structured daily routine,
    consistent meal and activity timing - which supply non-photic timing cues in
    the absence of light. Curated without an efficacy claim from a randomised
    trial, since the evidence cited here supports its use in management rather
    than quantifying its effect.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: melatonin
      term:
        id: CHEBI:16796
        label: melatonin
  target_mechanisms:
  - target: Free-Running Circadian Period
    treatment_effect: ACTIVATES
    description: >-
      Timed exogenous melatonin acts on the same MT1/MT2 receptors as
      tasimelteon to supply a daily phase-setting cue.
  evidence:
  - reference: PMID:29326647
    reference_title: "Non-24-Hour Sleep-Wake Rhythm Disorder in the Totally Blind: Diagnosis and Management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Management includes behavioral modification and melatonin.
    explanation: >-
      Establishes melatonin plus behavioural measures as standard management; the
      source states the approach rather than quantifying efficacy, which is why
      no effect size is asserted here.

discussions:
- discussion_id: gap_sighted_non24_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    What causes non-24-hour sleep-wake rhythm disorder in sighted people, whose
    photic input is intact?
  attaches_to:
  - pathophysiology#Absence of Photic Input to the Suprachiasmatic Nucleus
  rationale: >-
    This entry's trigger node is the absence of photic input, which cannot be the
    mechanism in sighted patients - yet the disorder occurs in them, typically in
    young men and typically evolving out of a delayed sleep-wake phase disorder.
    The candidate explanations are mechanistically different and predict different
    treatments: an unusually long intrinsic period exceeding what daily light can
    correct; reduced sensitivity of the entrainment pathway; or a behavioural
    loop in which an already-delayed phase leads to light exposure timed to
    reinforce the delay rather than correct it, which would make the disorder
    partly self-inflicted and reversible by schedule management. Distinguishing
    them requires measuring the phase-response curve, which is rarely done
    clinically, and the entry deliberately does not extend its trigger claim to
    this group until they are separated.
  proposed_experiments:
  - experiment_id: exp_sighted_non24_phase_response
    name: Phase-response characterisation in sighted free-running patients
    description: >-
      Measure intrinsic circadian period under forced desynchrony and construct
      individual light phase-response curves in sighted patients with
      non-24-hour sleep-wake rhythm disorder, comparing them against patients
      with delayed sleep-wake phase disorder and against controls, with
      concurrent light dosimetry to establish whether the received light signal
      is adequate but ineffective or simply mistimed.

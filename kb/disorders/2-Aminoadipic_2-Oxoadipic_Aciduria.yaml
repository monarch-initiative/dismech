    description: >-
      Accumulated 2-oxoadipate becomes available to E1o (OGDH). Shown in
      cultured cells; the flux this carries in patients is unknown.
    evidence:
    - reference: PMID:32160276
      reference_title: "DHTKD1 and OGDH display substrate overlap in cultured cells and form a hybrid 2-oxo acid dehydrogenase complex in vivo."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In summary, 2-oxoadipic acid is a substrate for DHTKD1, but also for
        OGDH in a cell model system.
      explanation: OGDH can process 2-oxoadipate, so the accumulated substrate is partly diverted to it.
  - target: Global developmental delay
    causal_link_type: UNKNOWN
    hypothesis_groups:

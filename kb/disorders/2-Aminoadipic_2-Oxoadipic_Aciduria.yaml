discussions:
- discussion_id: amoxad_clinical_significance
  prompt: >-
    Is 2-aminoadipic 2-oxoadipic aciduria a disease, or a benign biochemical
    trait whose apparent clinical features come from ascertaining children
    who were already neurologically unwell?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - disease#2-Aminoadipic 2-Oxoadipic Aciduria
  - phenotypes#Global developmental delay
  - phenotypes#Intellectual disability
  - mechanistic_hypotheses#amoxad_metabolite_neurotoxicity
  rationale: >-
    The biochemical defect is certain and ClinGen rates the gene Definitive,
    but ClinGen explicitly restricts that rating to a biochemical abnormality.
    The clinical evidence points both ways. Most patients were found by urine
    screening of children with developmental delay or epilepsy, which
    guarantees an association whether or not the defect is causal. Against
    causation: the first described patient had a mentally and physically
    normal sister with the same metabolites, a mentally normal brother of
    another patient shared the defect, three of four newly genotyped
    individuals in one series were asymptomatic, and screening-detected
    neonates have been asymptomatic. Metabolite levels do not separate
    affected from unaffected individuals, and one knockout mouse line is
    clinically normal. For causation: the symptomatic proportion is high in
    the published series, and two deaths in early childhood (one with
    apparent immunodeficiency, one sudden death with fatty liver) have been
    reported, though neither was genetically confirmed or shown to result
    from the defect. Until genotype-first data exist, the neurodevelopmental
    phenotypes in this entry are recorded as reported associations, not
    established disease features, and the edge to developmental delay is
    scoped to an emerging hypothesis.
  proposed_experiments:
  - experiment_id: exp_amoxad_genotype_first_recall
    name: Genotype-first recall of biallelic DHTKD1 carriers
    description: >-
      Identify individuals with biallelic predicted loss-of-function or
      functionally validated DHTKD1 variants in population biobanks or
      sequenced cohorts unselected for neurological disease, confirm the
      biochemical phenotype by urine and plasma metabolite measurement, and
      compare neurodevelopmental, seizure and educational outcomes with
      matched non-carriers and unaffected siblings.
    would_support:
    - mechanistic_hypotheses#amoxad_metabolite_neurotoxicity
    supporting_outcome:
    - >-
      A clear excess of developmental delay, intellectual disability or
      epilepsy in biochemically confirmed carriers relative to controls.
    refuting_outcome:
    - >-
      No excess of neurodevelopmental features at adequate power, which would
      support reclassifying the condition as a benign biochemical trait.
  evidence:
  - reference: PMID:26141459
    reference_title: "New Cases of DHTKD1 Mutations in Patients with 2-Ketoadipic Aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This broad range of phenotypes has led some to question whether
      2-ketoadipic aciduria represents a true disease state or if the
      biochemical abnormalities found in these patients merely reflect an
      ascertainment bias.
    explanation: Frames the controversy.
  - reference: PMID:26141459
    reference_title: "New Cases of DHTKD1 Mutations in Patients with 2-Ketoadipic Aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present four additional individuals from two families, with
      2-ketoadipic aciduria with compound heterozygous or homozygous mutations
      in DHTKD1, three of which remain asymptomatic.
    explanation: Most of a genotyped series was asymptomatic.
  - reference: PMID:1161338
    reference_title: "Alpha-ketoadipic aciduria: a description of a new metabolic error in lysine-tryptophan degradation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the patient (KW) had a mentally and physically normal sister (CW) with
      the same metabolites elevated
    explanation: An unaffected sibling with the same biochemistry.
  - reference: PMID:6772026
    reference_title: "Tryptophan and lysine metabolism in alpha-aminoadipic aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A comparison of the urinary alpha-AA and alpha-KA concentrations in our
      subjects with comparable data in mentally normal and mentally retarded
      patients with this condition suggested that the retardation may result
      from other causes.
    explanation: Metabolite burden did not track intellectual outcome.
  - reference: CGGV:assertion_d6dd5de3-9819-432d-996c-12a66dff277f-2020-11-03T193815.515Z
    reference_title: "DHTKD1 / 2-aminoadipic 2-oxoadipic aciduria (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the association of DHTKD1 with these phenotypes has not yet been
      experimentally confirmed and is therefore classified as a biochemical
      abnormality
    explanation: The expert panel's position on clinical significance.
  - reference: PMID:28545977
    reference_title: "Elevated glutaric acid levels in Dhtkd1-/Gcdh- double knockout mice challenge our current understanding of lysine metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      DHTKD1 acts upstream of GCDH, and its deficiency leads to none or often
      mild clinical phenotype in humans, 2-aminoadipic 2-oxoadipic aciduria.
    explanation: The mouse study's framing of the human clinical picture as absent or mild.
  - reference: PMID:6796766
    reference_title: "Alpha-aminoadipic aciduria: chemical and enzymatic studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A new case of alpha-aminoadipic aciduria had an apparent
      immunodeficiency and died at the age of 4 months.
    explanation: A fatal case, not genetically confirmed, that keeps open the possibility of a severe phenotype.
  - reference: PMID:35648288
    reference_title: "Sudden death of a 2-year-old child due to alpha-ketoadipic aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: No obvious lesions could be identified except for a marked fatty liver.
    explanation: A forensic sudden-death case attributed to the disorder; the causal link is not demonstrated.
- discussion_id: amoxad_cmt2q_allelic_relationship
  prompt: >-
    How can biallelic DHTKD1 loss of function produce a mostly benign
    aciduria while a single heterozygous DHTKD1 nonsense variant was reported
    to cause dominant axonal Charcot-Marie-Tooth disease type 2Q?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#DHTKD1 Biallelic Loss of Function
  - genetic#DHTKD1
  rationale: >-
    CMT2Q rests on one five-generation Chinese family in which a heterozygous
    nonsense variant (p.Tyr485*) segregated with neuropathy and halved DHTKD1
    mRNA through nonsense-mediated decay. If halving DHTKD1 were sufficient
    for neuropathy, the heterozygous parents of AMOXAD patients, and the
    patients themselves with little or no residual activity, would be expected
    to have neuropathy, which has not been reported. Possible explanations
    include a second, unidentified variant on the CMT2Q haplotype, a
    dominant-acting effect specific to that allele or to residual truncated
    protein, or under-examination of AMOXAD patients and carriers for
    peripheral nerve disease. ClinGen assessed the two conditions separately
    and noted the CMT2Q evidence comes from a single family. The mouse data
    disagree: one Dhtkd1 knockout develops a CMT2-like neuropathy and a
    knock-in of the CMT2Q allele gives a partial sensory phenotype, while
    another knockout is clinically normal. CMT2Q is curated as a subtype of
    Charcot-Marie-Tooth_Disease_Type_2; this entry does not duplicate it.
  proposed_experiments:
  - experiment_id: exp_amoxad_nerve_conduction_survey
    name: Peripheral nerve assessment of AMOXAD patients and heterozygous relatives
    description: >-
      Perform nerve conduction studies and a structured neuropathy examination
      in genotyped AMOXAD patients and their heterozygous parents, and
      re-sequence the CMT2Q family across the linked 10p13-14 interval for a
      second candidate variant.
    supporting_outcome:
    - >-
      Axonal neuropathy in AMOXAD patients or carriers would indicate that
      DHTKD1 dosage itself affects peripheral nerve.
    refuting_outcome:
    - >-
      Normal studies, or a second causal variant in the CMT2Q family, would
      indicate that the CMT2Q effect is allele- or locus-specific.
  evidence:
  - reference: PMID:23141294
    reference_title: "A nonsense mutation in DHTKD1 causes Charcot-Marie-Tooth disease type 2 in a large Chinese pedigree."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DHTKD1 mRNA expression levels in peripheral blood of affected persons
      were observed to be half of those in unaffected individuals.
    explanation: The CMT2Q allele acts by halving expression, a dosage expected to be tolerated given the recessive aciduria.
  - reference: CGGV:assertion_d6dd5de3-9819-432d-996c-12a66dff277f-2020-11-03T193815.515Z
    reference_title: "DHTKD1 / 2-aminoadipic 2-oxoadipic aciduria (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Of note, this gene has also been implicated in Autosomal Dominant
      Charcot-Marie-Tooth Disease Type 2Q in a single family
    explanation: ClinGen notes the CMT2Q evidence rests on one family.
  - reference: PMID:32633484
    reference_title: "Inhibition and Crystal Structure of the Human DHTKD1-Thiamin Diphosphate Complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      Mutations in DHTKD1 have been associated with 2-aminoadipic and
      2-oxoadipic aciduria, Charcot-Marie-Tooth disease type 2Q and
      eosinophilic esophagitis, but the pathophysiology of these clinically
      distinct disorders remains elusive.
    explanation: States that how one gene produces these distinct disorders is unexplained.
  - reference: PMID:32169121
    reference_title: "CMT2Q-causing mutation in the Dhtkd1 gene lead to sensory defects, mitochondrial accumulation and altered metabolism in a knock-in mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: knock-in mice partially recapitulate the clinical phenotypes of CMT2Q patients
    explanation: The CMT2Q allele in mice gives only a partial neuropathy.
- discussion_id: amoxad_mouse_model_discordance
  prompt: >-
    Why does one Dhtkd1 knockout mouse stay clinically normal while another
    develops a CMT2-like neuropathy, and which better represents the human
    biallelic disorder?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - animal_models#Dhtkd1 knockout mouse (Biagosch 2017)
  - animal_models#Dhtkd1 knockout mouse with CMT2-like neuropathy (Xu 2018)
  - pathophysiology#2-Aminoadipate Accumulation
  rationale: >-
    Both knockouts reproduce the human biochemistry, so evidence exists in
    the model; what is uncertain is how to read the clinical phenotype. The
    Biagosch line is asymptomatic even on a high-lysine diet, matching the
    many asymptomatic patients. The Xu line develops progressive distal
    weakness, slowed nerve conduction and myelin damage, which the authors
    attribute to 2-aminoadipate stimulating insulin secretion and altering
    Schwann cell myelin protein zero expression, and 2-aminoadipate feeding
    alone reproduced the phenotype. If that mechanism applied to humans,
    AMOXAD patients, who have high 2-aminoadipate, would be expected to have
    neuropathy and altered insulin secretion; neither has been reported.
    Strain background is a further confounder, because C57BL/6J, the most
    common background, is itself a natural Dhtkd1 hypomorph. Until the
    difference is explained, neither line's clinical phenotype should be
    taken as evidence about the human disorder, though both support the
    biochemical nodes.
  proposed_experiments:
  - experiment_id: exp_dhtkd1_ko_side_by_side
    name: Side-by-side phenotyping of Dhtkd1 knockout lines on matched backgrounds
    description: >-
      Back-cross both knockout alleles onto a Dhtkd1-wild-type background,
      phenotype littermates in one facility for nerve conduction, nerve
      histology, glucose-stimulated insulin secretion and urinary metabolites,
      and test 2-aminoadipate feeding in wild-type mice of the same
      background.
    supporting_outcome:
    - >-
      Neuropathy in both lines on a matched background would make the
      neuropathy a property of Dhtkd1 loss that human patients should be
      examined for.
    refuting_outcome:
    - >-
      Neuropathy confined to one line or background would point to a line- or
      strain-specific modifier.
  evidence:
  - reference: PMID:28545977
    reference_title: "Elevated glutaric acid levels in Dhtkd1-/Gcdh- double knockout mice challenge our current understanding of lysine metabolism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Under challenging conditions of a high lysine diet, only Gcdh-/- mice
      but not Dhtkd1-/- mice developed clinical symptoms such as lethargic
      behaviour and weight loss.
    explanation: One knockout line is clinically normal.
  - reference: PMID:29661920
    reference_title: "DHTKD1 Deficiency Causes Charcot-Marie-Tooth Disease in Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Here, we show that Dhtkd1-/- mice mimic the major aspects of CMT2 phenotypes
    explanation: The other knockout line develops neuropathy.
  - reference: PMID:29661920
    reference_title: "DHTKD1 Deficiency Causes Charcot-Marie-Tooth Disease in Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Further studies revealed that both 2-KAA and 2-AAA could stimulate insulin biosynthesis and secretion.
    explanation: The proposed metabolite-insulin mechanism that would predict a human phenotype not yet observed.
  - reference: PMID:30709776
    reference_title: "Mild inborn errors of metabolism in commonly used inbred mouse strains."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      C57BL/6J mice have decreased Dhtkd1 mRNA expression due to a solitary
      long terminal repeat (LTR) in intron 4 of Dhtkd1.
    explanation: The common C57BL/6J background is itself Dhtkd1-hypomorphic, a confounder for every mouse study.
- discussion_id: amoxad_dhtkd1_inhibition_ga1
  prompt: >-
    Does the mild course of DHTKD1 deficiency make DHTKD1 a safe
    substrate-reduction target for glutaric aciduria type 1, given that OGDH
    can also make glutaryl-CoA from 2-oxoadipate?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Residual 2-Oxoadipate Decarboxylation by OGDH
  - pathophysiology#Impaired Oxidative Decarboxylation of 2-Oxoadipate to Glutaryl-CoA
  - mechanistic_hypotheses#ogdh_compensation_benign_course
  rationale: >-
    DHTKD1 acts one step upstream of glutaryl-CoA dehydrogenase, the enzyme
    deficient in glutaric aciduria type 1, so blocking it was proposed to
    prevent accumulation of neurotoxic glutarate and 3-hydroxyglutarate; the
    near-benign course of AMOXAD is the safety argument. Genetic Dhtkd1
    deletion did not rescue Gcdh-deficient mice, and cell work showed OGDH
    supplies the remaining glutaryl-CoA through a hybrid complex. This bears
    on AMOXAD itself: the same OGDH route may be why DHTKD1 loss is tolerated.
    Small-molecule DHTKD1 inhibitors (adipoyl phosphonate and its esters,
    tenatoprazole) now exist, and in rats they changed brain metabolism and
    the ECG, which is a reminder that pharmacological inhibition and lifelong
    genetic deficiency need not have the same consequences. Whether combined
    DHTKD1 and partial OGDH inhibition could reduce glutaryl-CoA without
    harming TCA-cycle function is untested.
  proposed_experiments:
  - experiment_id: exp_dhtkd1_ogdh_flux_partition
    name: Partition of 2-oxoadipate flux between DHTKD1 and OGDH in human cells
    description: >-
      In patient fibroblasts and DHTKD1-knockout human hepatocyte models,
      measure labelled lysine flux to glutaryl-CoA derivatives with and
      without partial OGDH knockdown, to quantify how much decarboxylation
      OGDH carries when E1a is absent.
    would_support:
    - mechanistic_hypotheses#ogdh_compensation_benign_course
    supporting_outcome:
    - >-
      Substantial residual glutaryl-CoA formation that falls with OGDH
      knockdown in DHTKD1-null cells.
    refuting_outcome:
    - >-
      Negligible residual flux, which would mean the mild phenotype needs
      another explanation.
  evidence:
  - reference: PMID:28545977
    reference_title: "Elevated glutaric acid levels in Dhtkd1-/Gcdh- double knockout mice challenge our current understanding of lysine metabolism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We hypothesized that inhibition of DHTKD1 may prevent the accumulation of
      neurotoxic dicarboxylic metabolites suggesting DHTKD1 inhibition as a
      possible treatment strategy for GA-I.
    explanation: The therapeutic proposal.
  - reference: PMID:28545977
    reference_title: "Elevated glutaric acid levels in Dhtkd1-/Gcdh- double knockout mice challenge our current understanding of lysine metabolism."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: However, the genetic Dhtkd1 inhibition in Dhtkd1-/-/Gcdh-/- mice could not rescue the GA-I phenotype.
    explanation: Genetic DHTKD1 loss alone did not rescue GA1 mice.
  - reference: PMID:32160276
    reference_title: "DHTKD1 and OGDH display substrate overlap in cultured cells and form a hybrid 2-oxo acid dehydrogenase complex in vivo."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Substrate reduction through inhibition of DHTKD1, an enzyme upstream of
      the defective glutaryl-CoA dehydrogenase, has been investigated as a
      potential therapy, but revealed the existence of an alternative
      enzymatic source of glutaryl-CoA.
    explanation: The alternative source is OGDH.
  - reference: PMID:32633484
    reference_title: "Inhibition and Crystal Structure of the Human DHTKD1-Thiamin Diphosphate Complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      we report the identification of adipoylphosphonic acid and tenatoprazole
      as DHTKD1 inhibitors using targeted and high throughput screening,
      respectively
    explanation: Pharmacological DHTKD1 inhibitors exist.
  - reference: PMID:35795216
    reference_title: "Administration of Phosphonate Inhibitors of Dehydrogenases of 2-Oxoglutarate and 2-Oxoadipate to Rats Elicits Target-Specific Metabolic and Physiological Responses."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      strong inhibition of OADH decreases levels of tryptophan and
      beta-aminoisobutyrate and activities of malate dehydrogenase and
      pyruvate dehydrogenase, increasing the R-R interval of ECG
    explanation: Pharmacological inhibition has systemic effects in rats, unlike the reported human genetic deficiency.
- discussion_id: amoxad_cardiometabolic_signal
  prompt: >-
    Do people with AMOXAD, who have lifelong high 2-aminoadipate, show the
    dysglycaemia or low HDL cholesterol that population studies link to
    plasma 2-aminoadipate and to common DHTKD1 variants?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#2-Aminoadipate Accumulation
  - biochemical#2-Aminoadipic acid (urine and plasma)
  rationale: >-
    In the BXD mouse reference population Dhtkd1 was the main genetic
    regulator of 2-aminoadipate and explained variance in fasting glucose
    and diabetes status; in humans, plasma 2-aminoadipate associates
    inversely with HDL cholesterol and is influenced by common DHTKD1
    variants, and it has been linked to type 2 diabetes risk. DHTKD1
    knockout cells have impaired mitochondrial respiration. AMOXAD patients
    are a natural experiment of very high 2-aminoadipate from birth, yet no
    study has measured glucose tolerance, insulin secretion or lipids in
    them. This is a gap in curation of the disease rather than a claimed
    feature: none of these cardiometabolic traits is recorded as a phenotype
    here, because no patient data exist.
  proposed_experiments:
  - experiment_id: exp_amoxad_metabolic_phenotyping
    name: Cardiometabolic phenotyping of genotyped AMOXAD patients
    description: >-
      Measure fasting glucose, oral glucose tolerance with insulin and
      C-peptide, HbA1c and lipid profile, including HDL cholesterol, in
      genotyped AMOXAD patients and age-matched unaffected siblings.
    supporting_outcome:
    - >-
      Altered insulin secretion or lower HDL in patients would make the
      population association plausibly causal and add a phenotype.
    refuting_outcome:
    - >-
      Normal values despite very high 2-aminoadipate would argue that the
      population association is not driven by 2-aminoadipate itself.
  evidence:
  - reference: PMID:25215496
    reference_title: "Multilayered genetic and omics dissection of mitochondrial activity in a mouse reference population."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Most prominently, Dhtkd1 was identified as a primary regulator of
      2-aminoadipate, explaining variance in fasted glucose and diabetes
      status in both mice and humans.
    explanation: Links Dhtkd1 genetic variation, 2-aminoadipate and glycaemic traits.
  - reference: PMID:35621206
    reference_title: "Genetic Architecture of Plasma Alpha-Aminoadipic Acid Reveals a Relationship With High-Density Lipoprotein Cholesterol."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the top associations from the meta-analysis included single-nucleotide
      polymorphisms in the known 2-AAA pathway gene DHTKD1
    explanation: Common DHTKD1 variants influence plasma 2-aminoadipate in humans.
  - reference: PMID:35621206
    reference_title: "Genetic Architecture of Plasma Alpha-Aminoadipic Acid Reveals a Relationship With High-Density Lipoprotein Cholesterol."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Elevated plasma 2-AAA associates with reduced levels of high-density lipoprotein cholesterol.
    explanation: Population association between 2-aminoadipate and HDL cholesterol.
  - reference: PMID:34484123
    reference_title: "Knock-Out of DHTKD1 Alters Mitochondrial Respiration and Function, and May Represent a Novel Pathway in Cardiometabolic Disease Risk."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Here we report that DHTKD1 knock-out (KO) in HAP-1 cells leads to impaired mitochondrial structure and function.
    explanation: A cellular mechanism proposed to link DHTKD1 to cardiometabolic risk.
- discussion_id: amoxad_diagnostic_confounders
  prompt: >-
    Which published cases of alpha-aminoadipic or alpha-ketoadipic aciduria
    are DHTKD1 deficiency, and which are phenocopies or unconfirmed?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - diagnosis#Plasma and urine amino acid analysis
  - differential_diagnoses#Vigabatrin-induced alpha-aminoadipic aciduria
  - differential_diagnoses#Kearns-Sayre syndrome presenting with 2-oxoadipic aciduria
  rationale: >-
    Much of the clinical description of this disorder comes from case reports
    published before DHTKD1 was identified in 2012, diagnosed on biochemistry
    alone. Several cannot be assumed to be DHTKD1 deficiency: one girl with
    seizures, dysmorphism and persistent fetal haemoglobin had normal
    fibroblast decarboxylation; one child's transient 2-oxoadipic aciduria
    preceded Kearns-Sayre syndrome; vigabatrin reproduces the plasma and urine
    2-aminoadipate levels of the inherited disorder; and in one sequencing
    series two of ten biochemically diagnosed patients had no causal DHTKD1
    variants. Pooling these cases inflates the apparent clinical burden. When
    adding phenotypes to this entry, prefer genotyped cases and record the
    diagnostic basis of older ones.
  evidence:
  - reference: PMID:6163632
    reference_title: "alpha-Aminoadipic aciduria and persistence of fetal haemoglobin in an oligophrenic child."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      did not indicate a primary enzyme defect in the alpha-aminoadipic acid
      transamination or decarboxylation steps
    explanation: A frequently cited symptomatic case lacked the enzyme defect in fibroblasts.
  - reference: PMID:10655159
    reference_title: "Kearns-Sayre syndrome presenting as 2-oxoadipic aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A patient with 2-oxoadipic aciduria and 2-aminoadipic aciduria
      presented at 2 years of age with manifestations typical of organic
      acidemia, episodes of ketosis and acidosis, progressive to coma.
    explanation: A mitochondrial disease presenting with the same organic aciduria.
  - reference: PMID:8764822
    reference_title: "Treatment with vigabatrin may mimic alpha-aminoadipic aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This could lead to incorrect diagnosis and to inappropriate genetic counseling.
    explanation: Drug phenocopy.
  - reference: PMID:25860818
    reference_title: "Genetic basis of alpha-aminoadipic and alpha-ketoadipic aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have now sequenced DHTKD1 in nine patients diagnosed with
      alpha-aminoadipic and alpha-ketoadipic aciduria as well as one patient
      with isolated alpha-aminoadipic aciduria, and identified causal
      mutations in eight.
    explanation: Not every biochemically diagnosed patient carries causal DHTKD1 variants.
  - reference: PMID:25860818
    reference_title: "Genetic basis of alpha-aminoadipic and alpha-ketoadipic aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The clinical presentation of this group of patients was inhomogeneous.
    explanation: Clinical heterogeneity even among genotyped patients.

- reference: PMID:28545977
  title: Elevated glutaric acid levels in Dhtkd1-/Gcdh- double knockout mice challenge our current understanding of lysine metabolism.
notes: >-
  No GeneReviews chapter covers this disorder: a PubMed search for
  DHTKD1[TIAB] AND genereviews[book] returned no chapters, and the only
  GeneReviews chapter mentioning aminoadipic acid is the ALDH7A1
  pyridoxine-dependent epilepsy chapter, a different disease. Phenotypes were
  taken from primary case series and the ClinGen curation instead. The
  allelic dominant disorder Charcot-Marie-Tooth disease type 2Q
  (MONDO:0014012) is curated as the CMT2Q subtype of
  Charcot-Marie-Tooth_Disease_Type_2 and is not duplicated here. Several
  historical case reports (PMID:4442872, PMID:3930865, PMID:1527995,
  PMID:10503694, PMID:11596655) have no retrievable abstract and are not used
  as evidence. Urinary N-acetyl-2-aminoadipic acid has been reported in one
  patient (PMID:8487492) and is not recorded as a marker.

inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: UNKNOWN
  description: >-
    Genotyped patients carry two DHTKD1 variants, homozygous or compound
    heterozygous. Biallelic variants reliably produce the biochemical trait,
    but whether they produce any clinical phenotype is unresolved, and
    asymptomatic affected siblings are documented. Clinical penetrance is
    therefore recorded as UNKNOWN rather than INCOMPLETE.
  evidence:
  - reference: PMID:25860818
    reference_title: "Genetic basis of alpha-aminoadipic and alpha-ketoadipic aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Alpha-aminoadipic and alpha-ketoadipic aciduria is an autosomal
      recessive inborn error of lysine, hydroxylysine, and tryptophan
      degradation.
    explanation: States the autosomal recessive mode of inheritance in a series of ten sequenced patients.
  - reference: PMID:26141459
    reference_title: "New Cases of DHTKD1 Mutations in Patients with 2-Ketoadipic Aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present four additional individuals from two families, with
      2-ketoadipic aciduria with compound heterozygous or homozygous mutations
      in DHTKD1, three of which remain asymptomatic.
    explanation: >-
      Affected individuals are homozygous or compound heterozygous, and three
      of four remained asymptomatic, which is why clinical penetrance is left
      unknown.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: RARE
  notes: >-
    No population rate has been measured. ClinGen counted at least eleven
    DHTKD1-genotyped probands across three publications when it classified the
    gene in 2020; older biochemically diagnosed cases without genotyping add a
    similar number. Because most affected people may be asymptomatic and urine
    organic acid analysis is not done routinely, the literature count is
    expected to underestimate the true frequency.
  evidence:
  - reference: CGGV:assertion_d6dd5de3-9819-432d-996c-12a66dff277f-2020-11-03T193815.515Z
    reference_title: "DHTKD1 / 2-aminoadipic 2-oxoadipic aciduria (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Variants in this gene have been reported in at least eleven probands in three publications
    explanation: ClinGen's count of genotyped probands in the literature.
  - reference: PMID:32303640
    reference_title: "Structure-function analyses of the G729R 2-oxoadipate dehydrogenase genetic variant associated with a disorder of l-lysine metabolism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      These include α-aminoadipic and α-ketoadipic aciduria (AMOXAD), a rare
      disorder of l-lysine, l-hydroxylysine, and l-tryptophan catabolism
    explanation: Describes AMOXAD as a rare disorder.
mechanistic_hypotheses:
- hypothesis_group_id: canonical_dhtkd1_oadh_block
  hypothesis_label: DHTKD1 loss blocks 2-oxoadipate decarboxylation, causing upstream metabolite accumulation
  status: CANONICAL
  description: >-
    Biallelic DHTKD1 variants remove or inactivate E1a, so the
    2-oxoadipate dehydrogenase complex cannot convert 2-oxoadipate to
    glutaryl-CoA. 2-Oxoadipate and its transamination partner 2-aminoadipate
    accumulate and are excreted, together with 2-hydroxyadipate. This explains
    the defining biochemistry and is supported by patient genetics, fibroblast
    complementation and tracer studies, recombinant-enzyme kinetics and two
    knockout mouse lines. It does not, by itself, explain any clinical
    feature.
  evidence:
  - reference: PMID:23141293
    reference_title: "DHTKD1 mutations cause 2-aminoadipic and 2-oxoadipic aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      our results establish mutations in DHTKD1 as a cause of human
      2-aminoadipic and 2-oxoadipic aciduria via impaired turnover of
      decarboxylation 2-oxoadipate to glutaryl-CoA
    explanation: The gene-discovery study states the canonical mechanism.
  - reference: CGGV:assertion_d6dd5de3-9819-432d-996c-12a66dff277f-2020-11-03T193815.515Z
    reference_title: "DHTKD1 / 2-aminoadipic 2-oxoadipic aciduria (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The mechanism for disease is homozygous loss of function, with defecits
      in viable protein levels preventing the lysine degredation pathway from
      proceeding normally causing a buildup of metabolites in the tissues,
      blood, and urine.
    explanation: ClinGen's summary of the disease mechanism (spelling errors are ClinGen's own).
- hypothesis_group_id: ogdh_compensation_benign_course
  hypothesis_label: OGDH-containing complexes partly decarboxylate 2-oxoadipate, limiting the consequences of DHTKD1 loss
  status: EMERGING
  description: >-
    E1o (OGDH) can also decarboxylate 2-oxoadipate, and DHTKD1 forms a hybrid
    complex with OGDH, DLST and DLD. Residual glutaryl-CoA production through
    OGDH would let lysine flux continue past the block, which may explain why
    DHTKD1 deficiency is mild or silent in most people and in knockout mice,
    and why DHTKD1 loss does not abolish glutaryl-CoA formation in a GA1
    background. The human contribution of this route has not been measured.
  evidence:
  - reference: PMID:32160276
    reference_title: "DHTKD1 and OGDH display substrate overlap in cultured cells and form a hybrid 2-oxo acid dehydrogenase complex in vivo."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In summary, 2-oxoadipic acid is a substrate for DHTKD1, but also for
      OGDH in a cell model system.
    explanation: Shows OGDH can process the substrate that accumulates when DHTKD1 is lost.
  - reference: PMID:28545977
    reference_title: "Elevated glutaric acid levels in Dhtkd1-/Gcdh- double knockout mice challenge our current understanding of lysine metabolism."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: provides evidence for a so far unknown mechanism leading to glutaryl-CoA
    explanation: >-
      Glutaryl-CoA-derived metabolites persisted in Dhtkd1/Gcdh double
      knockout mice, implying an alternative route around DHTKD1, which the
      later cell study attributed to OGDH.
- hypothesis_group_id: amoxad_metabolite_neurotoxicity
  hypothesis_label: Accumulated 2-oxoadipate or 2-aminoadipate causes neurodevelopmental symptoms in some patients
  status: EMERGING
  description: >-
    A minority of reported patients have developmental delay, intellectual
    disability, epilepsy, ataxia, hypotonia, microcephaly or behavioural
    problems. It has been proposed that the accumulated metabolites, an
    imbalance in lysine catabolism, or altered reactive oxygen species
    production cause these features. No study has shown a causal link, and
    the alternative explanation, that the biochemistry was found because
    children with unrelated neurological disease were screened, fits the
    asymptomatic siblings and screening-detected cases equally well. This
    hypothesis is recorded so that the provisional edges in the pathograph
    are scoped and can be withdrawn together.
  evidence:
  - reference: PMID:23141293
    reference_title: "DHTKD1 mutations cause 2-aminoadipic and 2-oxoadipic aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: This disorder has been associated with varying neurological symptoms.
    explanation: Records the association that motivates the hypothesis; it is not evidence of causation.
  - reference: PMID:26141459
    reference_title: "New Cases of DHTKD1 Mutations in Patients with 2-Ketoadipic Aciduria."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This broad range of phenotypes has led some to question whether
      2-ketoadipic aciduria represents a true disease state or if the
      biochemical abnormalities found in these patients merely reflect an
      ascertainment bias.
    explanation: States the competing ascertainment-bias explanation for the clinical features.
pathophysiology:
- name: DHTKD1 Biallelic Loss of Function
  description: >-
    Biallelic germline DHTKD1 variants reduce or abolish functional E1a. The
    index patients were compound heterozygous for a start-loss variant
    (c.1A>G) or a nonsense variant (c.1228C>T, p.Arg410*) together with the
    recurrent missense variant c.2185G>A (p.Gly729Arg). Later series added
    missense, nonsense, splice-donor, duplication and deletion-insertion
    alleles. Most tested missense variants impair folding or stability and
    reduce activity, although three tested variants showed no defect.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: DHTKD1
    term:
      id: hgnc:23537
      label: DHTKD1
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:23141293
    reference_title: "DHTKD1 mutations cause 2-aminoadipic and 2-oxoadipic aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      compound heterozygosity for an initiating methionine mutation (c.1A>G)
      and a missense mutation
    explanation: Index patient carried a start-loss allele with the recurrent missense allele.
  - reference: PMID:23141293
    reference_title: "DHTKD1 mutations cause 2-aminoadipic and 2-oxoadipic aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sequence analysis of a second individual identified the same missense
      mutation together with a nonsense mutation
    explanation: A second patient carried a nonsense allele, supporting loss of function as the mechanism.
  - reference: PMID:25860818
    reference_title: "Genetic basis of alpha-aminoadipic and alpha-ketoadipic aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report nine novel mutations, including three missense mutations, two
      nonsense mutations, two splice donor mutations, one duplication, and one
      deletion and insertion.
    explanation: Range of variant classes, most of them predicted null.
  downstream:
  - target: Defective E1a Incorporation into the 2-Oxoadipate Dehydrogenase Complex
    causal_link_type: DIRECT
    description: Applies to the missense alleles that have been studied structurally.
    evidence:
    - reference: PMID:32695416
      reference_title: "Crystal structure and interaction studies of human DHTKD1 provide insight into a mitochondrial megacomplex in lysine catabolism."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        missense DHTKD1 variants causing the inborn error of 2-amino-adipic and
        2-oxoadipic aciduria impact on the complex formation, either directly by
        disrupting the interaction with DLST, or indirectly through
        destabilizing the DHTKD1 protein
      explanation: Disease missense variants disrupt complex formation with DLST.
  - target: Loss of 2-Oxoadipate Dehydrogenase Activity
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32633484
      reference_title: "Inhibition and Crystal Structure of the Human DHTKD1-Thiamin Diphosphate Complex."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Whereas the majority of the DHTKD1 variants displayed impaired folding
        or reduced thermal stability in combination with absent or reduced
        enzyme activity, three variants showed no abnormalities.
      explanation: Most disease-associated missense variants reduce or abolish enzyme activity; the three normal variants are a caveat.
- name: Defective E1a Incorporation into the 2-Oxoadipate Dehydrogenase Complex
  description: >-
    E1a acts only when assembled on the 24-mer DLST (E2o) core with DLD (E3).
    The recurrent p.Gly729Arg variant and other missense variants impair this
    assembly, either by disrupting the E1a-DLST interface or by destabilising
    E1a, which impairs channelling of intermediates between E1a and E2o.
  biological_scale: MOLECULAR

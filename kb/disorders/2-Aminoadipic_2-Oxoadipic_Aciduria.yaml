- name: Loss of 2-Oxoadipate Dehydrogenase Activity
  description: >-
    E1a is a thiamine diphosphate-dependent decarboxylase with about 49-fold
    higher catalytic efficiency for 2-oxoadipate than for 2-oxoglutarate, so
    it is the dedicated E1 of the 2-oxoadipate dehydrogenase complex in the
    mitochondrial matrix. Loss of E1a removes the complex's activity.

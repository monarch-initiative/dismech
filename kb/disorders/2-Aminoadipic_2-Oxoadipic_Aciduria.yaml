    snippet: >-
      loss of DHTKD1 in glutaryl-CoA dehydrogenase-deficient HEK-293 cells
      leads to a 2-fold decrease in the established GA1 clinical biomarker
      glutarylcarnitine and demonstrate that oxoglutarate dehydrogenase (OGDH)
      is responsible for this remaining glutarylcarnitine production
    explanation: OGDH supplies glutaryl-CoA when DHTKD1 is absent.

animal_models:
- name: Dhtkd1 knockout mouse (Biagosch 2017)
  species: Mouse
  genotype: Dhtkd1-/-
  publication: PMID:28545977
  description: >-
    A Dhtkd1-deficient mouse made to test DHTKD1 inhibition as a therapy for
    glutaric aciduria type 1. It reproduces the biochemistry and stays

name: 2-Aminoadipic 2-Oxoadipic Aciduria
creation_date: "2026-11-09T00:42:39Z"
category: Mendelian
description: >-
  2-Aminoadipic 2-oxoadipic aciduria (AMOXAD) is an autosomal recessive inborn
  error of L-lysine, L-hydroxylysine and L-tryptophan degradation caused by
  biallelic loss-of-function variants in DHTKD1. DHTKD1 encodes E1a, the
  thiamine diphosphate-dependent 2-oxoadipate dehydrogenase that, with the E2
  (DLST) and E3 (DLD) subunits it shares with the 2-oxoglutarate dehydrogenase
  complex, converts 2-oxoadipate to glutaryl-CoA in the mitochondrial matrix.
  Loss of this step raises 2-oxoadipate, 2-aminoadipate and usually
  2-hydroxyadipate in urine and plasma.

  The biochemical defect is established; its clinical significance is not.
  Reported individuals range from early-onset developmental delay, epilepsy,
  ataxia and microcephaly to completely normal, including unaffected siblings
  with the same biochemistry, and most were found by metabolic screening of
  children who already had neurological problems. ClinGen classifies the
  condition as a biochemical abnormality because none of the associated
  clinical features has been shown to be caused by DHTKD1 deficiency. This
  entry therefore wires the pathograph through to the biochemical phenotypes
  and leaves the neurodevelopmental phenotypes on an explicitly provisional
  hypothesis branch.

        subjects with comparable data in mentally normal and mentally retarded
        patients with this condition suggested that the retardation may result
        from other causes.
      explanation: Metabolite levels did not separate mentally normal from impaired patients, arguing against a metabolite-driven cause.
- name: Residual 2-Oxoadipate Decarboxylation by OGDH
  description: >-
    E1o (OGDH) can also decarboxylate 2-oxoadipate, and DHTKD1 assembles
    with OGDH, DLST and DLD into a hybrid 2-oxoglutarate/2-oxoadipate
    dehydrogenase complex. In GCDH-deficient cells lacking DHTKD1, OGDH
    accounts for the remaining glutarylcarnitine production. This route is
    proposed to limit the metabolic consequences of DHTKD1 loss; how much
    flux it carries in patients is unknown.

  - Later ophthalmoplegia, retinopathy and heart block with an mtDNA deletion.
  evidence:
  - reference: PMID:10655159
    reference_title: "Kearns-Sayre syndrome presenting as 2-oxoadipic aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

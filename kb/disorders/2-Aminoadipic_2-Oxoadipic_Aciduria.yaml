    explanation: DHTKD1 sequencing confirmed the diagnosis in eight of ten biochemically diagnosed patients.
differential_diagnoses:
- name: Vigabatrin-induced alpha-aminoadipic aciduria
  description: >-
    Vigabatrin raises plasma and urine 2-aminoadipic acid to levels seen in
    the inherited disorder, so a child on vigabatrin can be misdiagnosed.
  distinguishing_features:
  - History of vigabatrin treatment; amino acid testing should precede starting the drug.
  evidence:
  - reference: PMID:8764822
    reference_title: "Treatment with vigabatrin may mimic alpha-aminoadipic aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A significant increase in alpha-aminoadipic acid (AAA) occurred in
      plasma and urine of VGB-treated children, thus mimicking a known rare
      metabolic disease, alpha-aminoadipic aciduria (AAAuria).
    explanation: Drug phenocopy of the biochemical phenotype.
- name: Kearns-Sayre syndrome presenting with 2-oxoadipic aciduria
  description: >-
    A child with transient 2-oxoadipic and 2-aminoadipic aciduria, ketosis
    and acidosis later developed Kearns-Sayre syndrome with a mitochondrial
    DNA deletion; the metabolites disappeared when the episode resolved.

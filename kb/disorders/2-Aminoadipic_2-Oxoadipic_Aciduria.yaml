- name: Dhtkd1 knockout mouse with CMT2-like neuropathy (Xu 2018)
  species: Mouse
  genotype: Dhtkd1-/-
  publication: PMID:29661920
  description: >-
    An independent Dhtkd1 knockout with greatly raised urinary 2-ketoadipate
    and 2-aminoadipate that develops a progressive distal motor and sensory
    neuropathy resembling CMT2, attributed to 2-aminoadipate-stimulated
    insulin secretion acting on Schwann cell myelin gene expression.

treatments:
- name: Lysine-restricted diet
  description: >-
    No disease-specific therapy is established, and most affected people
    need none. Dietary lysine restriction has been tried because metabolite
    excretion tracks lysine intake, but in the one reported trial lysine
    restriction with vitamins B1 and B6 did not correct the biochemistry, and
    no clinical benefit has been shown.
  treatment_term:
    preferred_term: dietary lysine restriction
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  therapeutic_modality: BEHAVIORAL
  target_mechanisms:
  - target: Lysine, Hydroxylysine and Tryptophan Catabolic Flux
    description: Intended to reduce the load reaching the blocked step.
  evidence:
  - reference: PMID:117247
    reference_title: "Biochemical and clinical studies of a new case of alpha-aminoadipic aciduria."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dietary restriction of lysine and administration of vitamins B1 and B6
      were unsuccessful in correcting the biochemical abnormality.
    explanation: Lysine restriction failed to correct the biochemistry in a single patient.
  - reference: PMID:1112064
    reference_title: "Alpha-ketoadipic aciduria, a new inborn error of lysine metabolism; biochemical studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: The excretion of alpha-aminoadipic acid correlated to the lysine intake.
    explanation: The rationale for restriction; a biochemical correlation, not a clinical outcome.
- name: Pyridoxine and thiamine supplementation
  description: >-
    Vitamin B6, and B6 with B1 (the cofactor precursor of the
    thiamine diphosphate-dependent E1a), have each been tried in single
    patients. One patient showed a smaller 2-aminoadipate rise on lysine
    loading after three months of pyridoxine, but that patient's fibroblasts
    decarboxylated 2-aminoadipate normally, so the case may not have been
    DHTKD1 deficiency; in another, B1 and B6 with lysine restriction did not
    correct the biochemistry. No clinical benefit has been shown.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pyridoxine
      term:
        id: CHEBI:16709
        label: pyridoxine
    - preferred_term: thiamine
      term:
        id: CHEBI:18385
        label: thiamine(1+)
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:6163632
    reference_title: "alpha-Aminoadipic aciduria and persistence of fetal haemoglobin in an oligophrenic child."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After 3 months of pyridoxine medication the increase of
      alpha-aminoadipic acid in blood and urine during the oral L-lysine
      loading test was less than in the test before treatment.
    explanation: Single-patient biochemical response to pyridoxine; the patient's enzyme defect was not demonstrated.
  - reference: PMID:117247
    reference_title: "Biochemical and clinical studies of a new case of alpha-aminoadipic aciduria."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dietary restriction of lysine and administration of vitamins B1 and B6
      were unsuccessful in correcting the biochemical abnormality.
    explanation: B1 and B6 did not correct the biochemistry in another patient.
- name: Genetic counseling
  description: >-
    Counseling on autosomal recessive inheritance and on the uncertain,

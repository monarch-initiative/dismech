diagnosis:
- name: Urine organic acid analysis
  description: >-
    GC-MS of urine shows raised 2-oxoadipic and 2-hydroxyadipic acids. Because
    2-oxoadipate is unstable it can be missed, which is how some patients were
    first reported as isolated alpha-aminoadipic aciduria.
  diagnosis_term:
    preferred_term: urine organic acid analysis by GC-MS
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  notes: >-
    Bound to the generic laboratory procedure term: NCIT:C111203 Gas
    Chromatography Mass Spectrometry names the technique but is outside the
    clinical-procedure enum used by diagnosis_term.
  evidence:
  - reference: PMID:6772026
    reference_title: "Tryptophan and lysine metabolism in alpha-aminoadipic aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Further analyses of their urines revealed that both boys had measurable
      amounts of previously undetected alpha-ketoadipic acid (alpha-KA) before
      and after the loading test.
    explanation: Urine analysis detects 2-oxoadipate, which was missed on first testing.
- name: Plasma and urine amino acid analysis
  description: >-
    Raised 2-aminoadipic acid in plasma and urine. Other causes of
    alpha-aminoadipic aciduria (hyperlysinemia/saccharopinuria, glutaryl-CoA
    dehydrogenase deficiency) and vigabatrin treatment should be excluded.
  diagnosis_term:
    preferred_term: plasma and urine amino acid analysis
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:117247
    reference_title: "Biochemical and clinical studies of a new case of alpha-aminoadipic aciduria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other known causes of alpha-aminoadipic aciduria were eliminated by
      showing that levels of lysine, saccharopine and pipecolic acid in plasma
      and urine were normal and that the activity of glutaryl-CoA
      dehydrogenase was also normal.
    explanation: The exclusions required before attributing alpha-aminoadipic aciduria to this disorder.
- name: DHTKD1 molecular genetic testing
  description: >-

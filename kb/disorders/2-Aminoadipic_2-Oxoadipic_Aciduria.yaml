genetic:
- name: DHTKD1
  gene_term:
    preferred_term: DHTKD1
    term:
      id: hgnc:23537
      label: DHTKD1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: Biallelic loss-of-function variants (autosomal recessive)
  notes: >-
    ClinGen rates DHTKD1 in autosomal recessive 2-aminoadipic 2-oxoadipic
    aciduria as Definitive. The relationship is CAUSATIVE for the biochemical
    trait that defines the disorder; ClinGen explicitly classifies the
    condition as a biochemical abnormality, so this is not a claim that DHTKD1
    variants cause the neurodevelopmental features. A heterozygous DHTKD1
    nonsense variant in one family causes dominant Charcot-Marie-Tooth disease
    type 2Q, curated as a subtype of Charcot-Marie-Tooth_Disease_Type_2 and
    assessed separately by ClinGen.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_d6dd5de3-9819-432d-996c-12a66dff277f-2020-11-03T193815.515Z
    evidence:
    - reference: CGGV:assertion_d6dd5de3-9819-432d-996c-12a66dff277f-2020-11-03T193815.515Z
      reference_title: "DHTKD1 / 2-aminoadipic 2-oxoadipic aciduria (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "DHTKD1 | HGNC:23537 | 2-aminoadipic 2-oxoadipic aciduria | MONDO:0008774 | AR | Definitive"
      explanation: ClinGen Aminoacidopathy GCEP classifies DHTKD1 in autosomal recessive AMOXAD as Definitive.
    - reference: CGGV:assertion_d6dd5de3-9819-432d-996c-12a66dff277f-2020-11-03T193815.515Z
      reference_title: "DHTKD1 / 2-aminoadipic 2-oxoadipic aciduria (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        the association of DHTKD1 with these phenotypes has not yet been
        experimentally confirmed and is therefore classified as a biochemical
        abnormality
      explanation: ClinGen's own qualification of what the Definitive tier covers.
  features: >-
    DHTKD1 on 10p14 has 17 exons and encodes a 919-amino-acid mitochondrial
    protein. Reported alleles include start-loss (c.1A>G), nonsense
    (c.1228C>T, p.Arg410*), splice-donor, duplication, deletion-insertion and
    missense variants; two missense variants, one of them c.2185G>A
    (p.Gly729Arg), account for most alleles. Ten disease-associated missense
    variants have been characterised biochemically.
  variants:
  - name: c.2185G>A (p.Gly729Arg)
    description: >-
      The recurrent missense allele, found in the index patients and in most
      later cases. The variant protein assembles poorly with DLST (E2o) and the
      reconstituted complex has about 50-fold lower catalytic efficiency.
    evidence:
    - reference: PMID:25860818
      reference_title: "Genetic basis of alpha-aminoadipic and alpha-ketoadipic aciduria."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Two missense mutations, one of which was reported before, were observed in the majority of cases.
      explanation: A previously reported missense allele (p.Gly729Arg from the index study) recurs in most cases.
    - reference: PMID:32303640
      reference_title: "Structure-function analyses of the G729R 2-oxoadipate dehydrogenase genetic variant associated with a disorder of l-lysine metabolism."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        the G729R E1a variant when assembled into OADHc in vitro displays a
        50-fold decrease in catalytic efficiency for NADH production
      explanation: Functional effect of the recurrent allele.
  - name: c.1A>G (start-loss)
    description: Loss of the initiating methionine; found in trans with p.Gly729Arg in the first patient.
    evidence:
    - reference: PMID:23141293
      reference_title: "DHTKD1 mutations cause 2-aminoadipic and 2-oxoadipic aciduria."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        compound heterozygosity for an initiating methionine mutation (c.1A>G)
        and a missense mutation
      explanation: Identifies the start-loss allele.
  - name: c.1228C>T (p.Arg410*)
    description: Nonsense allele found in trans with p.Gly729Arg in the second index patient.
    evidence:
    - reference: PMID:23141293
      reference_title: "DHTKD1 mutations cause 2-aminoadipic and 2-oxoadipic aciduria."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Sequence analysis of a second individual identified the same missense

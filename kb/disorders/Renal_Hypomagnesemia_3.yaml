    evidence_source: OTHER
    snippet: "FHHNC patients are given oral magnesium supplementation and thiazide diuretics to prevent the progression of nephrocalcinosis or nephrolithiasis, but neither treatment has had a considerable effect on the levels of urinary calcium or serum magnesium or on the deterioration of renal function"
    explanation: Magnesium supplementation is standard but of limited effect.
  - reference: PMID:11518780
    reference_title: "Novel paracellin-1 mutations in 25 families with familial hypomagnesemia with hypercalciuria and nephrocalcinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with magnesium salts and thiazides seemed to have no effect on the progression of the disease."
    explanation: No effect on progression in a CLDN16 series.

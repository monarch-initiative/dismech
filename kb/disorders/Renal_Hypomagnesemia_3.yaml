    explanation: Background physiology that makes the TAL paracellular route the main site of magnesium reabsorption.
  downstream:
  - target: Renal magnesium wasting
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25477417
      reference_title: "Retrospective cohort study of familial hypomagnesaemia with hypercalciuria and nephrocalcinosis due to CLDN16 mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All cases showed nephrocalcinosis, increased urinary fractional excretion of magnesium and hypercalciuria."
      explanation: Every patient in the CLDN16 cohort had raised fractional magnesium excretion.
  - target: Hypomagnesemia
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20147368
      reference_title: "Targeted deletion of murine Cldn16 identifies extra- and intrarenal compensatory mechanisms of Ca2+ and Mg2+ wasting."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Similar to patients, CLDN16-deficient mice displayed hypercalciuria and hypomagnesemia."

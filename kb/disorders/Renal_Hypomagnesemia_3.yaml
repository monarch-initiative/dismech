      label: Autosomal recessive inheritance
  description: >-
    Affected individuals carry biallelic CLDN16 variants, homozygous or compound
    heterozygous. Heterozygous relatives may have hypercalciuria or kidney
    stones without the full disease.
  evidence:
  - reference: PMID:11518780
    reference_title: "Novel paracellin-1 mutations in 25 families with familial hypomagnesemia with hypercalciuria and nephrocalcinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Familial hypomagnesemia with hypercalciuria and nephrocalcinosis (FHHNC) is an autosomal recessive tubular disorder that is frequently associated with progressive renal failure."
    explanation: States recessive inheritance in a CLDN16 (PCLN-1) family series.
  - reference: PMID:25477417
    reference_title: "Retrospective cohort study of familial hypomagnesaemia with hypercalciuria and nephrocalcinosis due to CLDN16 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All cases of FHHNC carried recessive mutations in CLDN16."
    explanation: All 25 cases in a national cohort carried recessive CLDN16 mutations.

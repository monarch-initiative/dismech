    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "As mentioned before, FHHNC patients usually develop chronic renal failure, which is correlated with progressive tubulointerstitial nephritis; however, its pathophysiology is uncertain."
    explanation: Review statement that kidney failure accompanies tubulointerstitial nephritis of uncertain cause.
  downstream:

      label: Chronic kidney disease
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:11518780
    reference_title: "Novel paracellin-1 mutations in 25 families with familial hypomagnesemia with hypercalciuria and nephrocalcinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the time of diagnosis, the GFR was already decreased to <60 ml/min per 1.73 m(2) for 11 patients."
    explanation: Reduced GFR at diagnosis in a third of patients.

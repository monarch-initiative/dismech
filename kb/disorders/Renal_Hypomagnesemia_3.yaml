name: Renal Hypomagnesemia 3
creation_date: "2026-11-06T00:00:00Z"
category: Mendelian
description: >-
  Renal hypomagnesemia 3 (HOMG3) is the CLDN16 form of familial hypomagnesemia
  with hypercalciuria and nephrocalcinosis (FHHNC), an autosomal recessive
  tubulopathy. CLDN16 encodes claudin-16 (formerly paracellin-1), a tight
  junction protein of the thick ascending limb of the loop of Henle (TAL).
  With claudin-19 it forms the cation-selective paracellular pathway through
  which most filtered magnesium and much filtered calcium are reabsorbed in
  this segment. Biallelic loss of claudin-16 function causes renal magnesium
  and calcium wasting, so patients have hypomagnesemia, hypercalciuria and
  bilateral nephrocalcinosis, often with polyuria, polydipsia, recurrent
  urinary tract infections, hematuria and nephrolithiasis from early childhood.
  Elevated parathyroid hormone, hyperuricemia, hypocitraturia and incomplete
  distal renal tubular acidosis are common. Kidney function declines
  progressively, and many patients need renal replacement therapy in
  adolescence; complete loss-of-function genotypes present earlier and progress
  faster than genotypes that keep partial claudin-16 function. Patients also
  have amelogenesis imperfecta. Magnesium salts and thiazides are supportive;
  kidney transplantation corrects the tubular defect, which does not recur in
  the graft.
notes: >-
  The entry is anchored on MONDO:0009550 (OMIM 248250) and CLDN16 (hgnc:2037).
  The CLDN19 form of FHHNC, with severe ocular involvement (renal
  hypomagnesemia 5, OMIM 248190), is a separate MONDO disease and is out of
  scope here except as a differential. Much of the clinical literature uses
  "FHHNC" for both forms, so the name "familial hypomagnesemia with
  hypercalciuria and nephrocalcinosis" is kept as a synonym rather than used as
  the entry name, which would be broader than the entry.

  Phenotypes are taken from CLDN16-only cohorts (Weber 2001, PMID:11518780;
  Konrad 2008, PMID:18003771; the Polish cohort, PMID:25477417) and from the
  FHHNC type 1 paragraph of the 2016 review (PMID:26613020). Frequencies are
  recorded only where a CLDN16-only cohort reports a percentage.

  How CLDN16 loss leads to progressive kidney failure is not settled. The
  review states that a correlation with hypercalciuria and nephrocalcinosis has
  not been found, and Konrad 2008 proposes an additional role of claudin-16 in
  tight junction integrity. The entry therefore links the kidney-injury node to
  the claudin-16 defect with an indirect edge of unknown type rather than
  routing it through nephrocalcinosis.

  No GeneReviews chapter covers this disease; just check-genereviews --online
  reports NO_CHAPTER against the 2026-09-10 Bookshelf index.

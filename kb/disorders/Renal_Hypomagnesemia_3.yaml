    Oral magnesium salts are given for the hypomagnesemia but have not been
    shown to change serum magnesium substantially or to slow loss of kidney
    function.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

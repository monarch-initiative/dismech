animal_models:
- name: Claudin-16 knockdown mouse (transgenic RNAi)
  species: Mouse
  genotype: Transgenic shRNA knockdown of Cldn16
  publication: PMID:17442678
  modeled_mechanisms:
  - target: Loss of Cation-Selective TAL Tight Junction Pathway
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: >-
      Knockdown mice lose TAL paracellular cation selectivity and develop renal
      magnesium and calcium wasting with nephrocalcinosis.
    limitations: >-
      Knockdown is incomplete and transgenic, unlike germline biallelic human
      variants; progressive kidney failure is not reported in this model.
    evidence:
    - reference: PMID:17442678
      reference_title: "Transgenic RNAi depletion of claudin-16 and the renal handling of magnesium."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Claudin-16 knock-down (KD) mice exhibit chronic renal wasting of magnesium and calcium and develop renal nephrocalcinosis."
      explanation: The model reproduces the human renal phenotype.
- name: Cldn16 knockout mouse
  species: Mouse
  genotype: Cldn16 targeted deletion, homozygous
  publication: PMID:20147368
  modeled_mechanisms:
  - target: Impaired Paracellular Magnesium and Calcium Reabsorption in the TAL
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Knockout mice have hypercalciuria and hypomagnesemia with raised PTH and
      1,25-dihydroxyvitamin D, but no nephrocalcinosis.
    limitations: >-
      Compensatory upregulation of calcium and magnesium transporters prevents
      nephrocalcinosis, so the model does not reproduce the human calcium
      deposition or kidney failure.
    evidence:
    - reference: PMID:20147368
      reference_title: "Targeted deletion of murine Cldn16 identifies extra- and intrarenal compensatory mechanisms of Ca2+ and Mg2+ wasting."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Contrary to FHHNC patients, nephrocalcinosis was absent in our model, indicating the existence of compensatory pathways in ion handling in this model."
      explanation: The knockout reproduces cation wasting but not nephrocalcinosis.
differential_diagnoses:
- name: Renal hypomagnesemia 5 (CLDN19-related FHHNC with ocular involvement)
  description: >-
    The CLDN19 form shares the renal phenotype and adds severe myopia, macular
    coloboma and nystagmus. Ocular examination and CLDN16/CLDN19 sequencing
    separate the two.
  evidence:
  - reference: PMID:26613020
    reference_title: "Familial hypomagnesaemia with hypercalciuria and nephrocalcinosis: clinical and molecular characteristics."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Patients with mutations in CLDN19 also present severe ocular abnormalities such as myopia, nystagmus and macular colobamata."
    explanation: Ocular findings distinguish the CLDN19 form.

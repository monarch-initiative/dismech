    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The primary defect is related to impaired tubular reabsorption of magnesium and calcium in the thick ascending limb of Henle's loop."
    explanation: Locates the primary defect in TAL magnesium and calcium reabsorption.
  - reference: PMID:10390358
    reference_title: "Paracellin-1, a renal tight junction protein required for paracellular Mg2+ resorption."
    supports: SUPPORT

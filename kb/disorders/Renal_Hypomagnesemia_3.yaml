pathophysiology:
- name: Biallelic CLDN16 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Missense, nonsense, splice-site and deletion variants in CLDN16 reduce or
    abolish claudin-16 function. Expression studies separate variants that
    leave partial function from those that abolish it, and the distinction
    predicts age at onset and rate of kidney decline. Missense variants cluster
    in the first extracellular loop; p.Leu151Phe is a founder allele in
    Germany and eastern Europe.
  genes:
  - preferred_term: CLDN16
    term:
      id: hgnc:2037
      label: CLDN16
  molecular_functions:
  - preferred_term: paracellular cation channel activity of claudin-16
    term:
      id: GO:0160187
      label: paracellular tight junction channel activity
    modifier: DECREASED
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:10390358
    reference_title: "Paracellin-1, a renal tight junction protein required for paracellular Mg2+ resorption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, positional cloning has identified a human gene, paracellin-1 (PCLN-1), mutations in which cause renal Mg2+ wasting."
    explanation: Positional cloning identifies CLDN16 (PCLN-1) mutations as the cause.
  - reference: PMID:18003771
    reference_title: "CLDN16 genotype predicts renal decline in familial hypomagnesemia with hypercalciuria and nephrocalcinosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Expression studies revealed that five of the 12 new mutations led to partial loss of claudin-16 function and the remaining seven led to complete loss of function."
    explanation: Expression studies show that disease variants cause partial or complete loss of claudin-16 function.
  - reference: CGGV:assertion_cd2b60d4-b932-4d0b-bc46-d6b0827a6333-2023-12-06T050000.000Z
    reference_title: "CLDN16 / renal hypomagnesemia 3 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism of pathogenicity is known to be loss of function."
    explanation: The ClinGen curation records loss of function as the disease mechanism.
  downstream:
  - target: Loss of Cation-Selective TAL Tight Junction Pathway
    causal_link_type: DIRECT
    description: >-
      Claudin-16 is a cation (Na+) pore in TAL tight junctions; with claudin-19
      it makes the junction cation selective. Disease variants abolish this.
    evidence:
    - reference: PMID:18188451
      reference_title: "Claudin-16 and claudin-19 interact and form a cation-selective tight junction complex."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In addition, disruption of this interaction by introduction of FHHNC-causing mutant forms of either CLDN16 or CLDN19 abolished their synergistic effect."
      explanation: FHHNC-causing CLDN16 mutants abolish the cation selectivity conferred with claudin-19.
  - target: Ameloblast Tight Junction Dysfunction
    causal_link_type: DIRECT
    description: >-
      Claudin-16 is also expressed at secretory ameloblast tight junctions,
      where its loss alters enamel formation.
    evidence:
    - reference: PMID:26426912
      reference_title: "Claudin-16 Deficiency Impairs Tight Junction Function in Ameloblasts, Leading to Abnormal Enamel Formation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "To investigate the role of CLDN16 in tooth formation, we studied a murine model of FHHNC and showed that CLDN16 deficiency led to altered secretory ameloblast TJ structure, lowering of extracellular pH in the forming enamel matrix, and abnormal enamel matrix protein processing, resulting in an enamel phenotype closely resembling human AI."
      explanation: In the mouse model, claudin-16 deficiency disrupts ameloblast tight junctions.
- name: Loss of Cation-Selective TAL Tight Junction Pathway
  biological_scale: CELLULAR
  description: >-
    In the TAL, magnesium and calcium are reabsorbed between cells, driven by
    a lumen-positive voltage. Claudin-16 behaves as a non-selective cation
    channel rather than a dedicated magnesium channel, and its interaction with
    claudin-19 gives the tight junction its cation selectivity. Without it the
    junction loses cation selectivity, so the driving force and pathway for
    divalent cation reabsorption are lost.
  cell_types:
  - preferred_term: TAL epithelial cell
    term:
      id: CL:1001106
      label: kidney loop of Henle thick ascending limb epithelial cell
  cellular_components:
  - preferred_term: tight junction
    term:
      id: GO:0005923
      label: bicellular tight junction
  locations:
  - preferred_term: thick ascending limb of loop of Henle
    term:
      id: UBERON:0001291
      label: thick ascending limb of loop of Henle
  evidence:
  - reference: PMID:10390358
    reference_title: "Paracellin-1, a renal tight junction protein required for paracellular Mg2+ resorption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PCLN-1 is located in tight junctions of the TAL and is related to the claudin family of tight junction proteins."
    explanation: Places claudin-16 in TAL tight junctions.
  - reference: PMID:18188451
    reference_title: "Claudin-16 and claudin-19 interact and form a cation-selective tight junction complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we showed that in pig kidney epithelial cells, CLDN19 functioned as a Cl(-) blocker, whereas CLDN16 functioned as a Na(+) channel."
    explanation: Claudin-16 acts as a paracellular cation channel in kidney epithelial cells.
  - reference: PMID:18188451
    reference_title: "Claudin-16 and claudin-19 interact and form a cation-selective tight junction complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Coexpression of CLDN16 and CLDN19 generated cation selectivity of the TJ in a synergistic manner, and CLDN16 and CLDN19 were observed to interact using several criteria."
    explanation: Claudin-16 and claudin-19 together make the junction cation selective.
  - reference: PMID:17442678
    reference_title: "Transgenic RNAi depletion of claudin-16 and the renal handling of magnesium."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we show that claudin-16 plays a key role in maintaining the paracellular cation selectivity of the thick ascending limbs of the nephron."
    explanation: In claudin-16 knockdown mice, TAL paracellular cation selectivity depends on claudin-16.
  downstream:
  - target: Impaired Paracellular Magnesium and Calcium Reabsorption in the TAL
    causal_link_type: DIRECT
    description: >-
      Without a cation-selective paracellular pathway, magnesium and calcium are
      no longer reabsorbed in the TAL.
    evidence:
    - reference: PMID:17442678
      reference_title: "Transgenic RNAi depletion of claudin-16 and the renal handling of magnesium."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Claudin-16 knock-down (KD) mice exhibit chronic renal wasting of magnesium and calcium and develop renal nephrocalcinosis."
      explanation: Loss of claudin-16 in mice leads to renal magnesium and calcium wasting.
  - target: Progressive Tubulointerstitial Kidney Injury
    causal_link_type: UNKNOWN
    description: >-
      Proposed: claudin-16 may also be needed for tight junction integrity, and
      its loss may drive progressive kidney injury independently of the
      calcium load. Supported only by the genotype-dependence of kidney
      decline, not by a direct experiment.
    evidence:
    - reference: PMID:18003771
      reference_title: "CLDN16 genotype predicts renal decline in familial hypomagnesemia with hypercalciuria and nephrocalcinosis."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "That FHHNC is frequently associated with progressive renal failure suggests additional roles for claudin-16 in the maintenance of tight junction integrity."
      explanation: The authors infer a tight-junction-integrity role from the frequency of progressive renal failure.
    - reference: PMID:18003771
      reference_title: "CLDN16 genotype predicts renal decline in familial hypomagnesemia with hypercalciuria and nephrocalcinosis."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "In addition, those with complete loss of function had a more rapid decline in GFR (7.3 versus 2.9 ml/min per 1.72 m2/y; P < 0.01), leading to 54% requiring renal replacement therapy by age 15 compared with 20% of those with residual function (P < 0.05)."
      explanation: Kidney decline tracks the amount of residual claudin-16 function.
- name: Impaired Paracellular Magnesium and Calcium Reabsorption in the TAL
  biological_scale: TISSUE
  description: >-
    Paracellular reabsorption of magnesium and calcium in the thick ascending
    limb fails, so both cations are lost in the urine. Fractional magnesium
    excretion is high even when serum magnesium is still normal.

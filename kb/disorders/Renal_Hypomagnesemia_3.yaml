genetic:
- name: CLDN16
  gene_term:
    preferred_term: CLDN16
    term:
      id: hgnc:2037
      label: CLDN16
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    CLDN16 (3q28) encodes claudin-16, a four-transmembrane tight junction
    protein of the thick ascending limb that acts as a paracellular cation
    pore. Disease variants are missense, nonsense, splice-site and deletions;
    missense variants cluster in the first extracellular loop.
  notes: >-
    Heterozygous relatives may have hypercalciuria or nephrolithiasis
    (PMID:11518780), and a heterozygous mother with hyperparathyroidism has
    been reported (PMID:42960388); these are observations in carriers, not a
    second inheritance mode of this disease.
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_cd2b60d4-b932-4d0b-bc46-d6b0827a6333-2023-12-06T050000.000Z
    evidence:
    - reference: CGGV:assertion_cd2b60d4-b932-4d0b-bc46-d6b0827a6333-2023-12-06T050000.000Z
      reference_title: "CLDN16 / renal hypomagnesemia 3 (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "CLDN16 | HGNC:2037 | renal hypomagnesemia 3 | MONDO:0009550 | AR | Definitive"
      explanation: ClinGen gene-disease validity record classifying this pair as Definitive.
  evidence:
  - reference: PMID:10390358
    reference_title: "Paracellin-1, a renal tight junction protein required for paracellular Mg2+ resorption."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, positional cloning has identified a human gene, paracellin-1 (PCLN-1), mutations in which cause renal Mg2+ wasting."
    explanation: Identifies CLDN16 as the causal gene.
  - reference: PMID:18003771
    reference_title: "CLDN16 genotype predicts renal decline in familial hypomagnesemia with hypercalciuria and nephrocalcinosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 23 patients who had mutations resulting in complete loss of function of both alleles were significantly younger at the onset of symptoms than the 46 patients who had at least one mutant allele providing partial function (2.2 versus 5.6 years; P < 0.01)."
    explanation: Genotype severity predicts age at onset.
  variants:
  - name: p.Leu151Phe
    type: MISSENSE
    clinical_significance: PATHOGENIC
    description: >-
      Founder variant in the first extracellular loop, the most frequent allele
      in patients from Germany, Poland and eastern Europe.
    evidence:
    - reference: PMID:11518780
      reference_title: "Novel paracellin-1 mutations in 25 families with familial hypomagnesemia with hypercalciuria and nephrocalcinosis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The accumulation of mutations affecting the first extracellular loop was striking, with 48% of all mutant alleles exhibiting a Leu151Phe exchange."
      explanation: Leu151Phe accounts for 48% of mutant alleles in the series.
    - reference: PMID:25477417
      reference_title: "Retrospective cohort study of familial hypomagnesaemia with hypercalciuria and nephrocalcinosis due to CLDN16 mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The founder mutation in CLDN16, Leu151Phe, was the most frequent cause of FHHNC in Polish patients, with 13 (52%) cases being homozygous and 5 (20%) carrying Leu151Phe allele in compound heterozygosity."
      explanation: Founder allele in the Polish cohort.

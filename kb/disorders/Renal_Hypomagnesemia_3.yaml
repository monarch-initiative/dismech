    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "During follow-up, renal function declined in 60% of patients; 12% of patients reached CKD stage 3 or 4 and one patient developed end-stage renal failure."
    explanation: Renal function declined in 60% over a median 4.8-year follow-up.

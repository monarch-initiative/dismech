  - target: Hyperparathyroidism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Parathyroid hormone rises before kidney failure, in contrast to the low
      or normal PTH usually seen with hypomagnesemia. In the knockout mouse the
      rise is interpreted as compensation for renal calcium loss.
    evidence:
    - reference: PMID:20147368
      reference_title: "Targeted deletion of murine Cldn16 identifies extra- and intrarenal compensatory mechanisms of Ca2+ and Mg2+ wasting."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "In line with the renal loss of Ca(2+), compensatory mechanisms like parathyroid hormone and 1,25(OH)(2)D(3) were significantly elevated."
      explanation: In Cldn16-deficient mice, PTH rises as a response to renal calcium loss.
- name: Progressive Tubulointerstitial Kidney Injury
  biological_scale: TISSUE
  description: >-
    Chronic kidney disease in FHHNC is accompanied by progressive
    tubulointerstitial nephritis. Its cause is uncertain: it has been
    attributed to hypercalciuria and nephrocalcinosis, but a correlation has
    not been shown, and a role of claudin-16 in tight junction integrity has
    been proposed instead.

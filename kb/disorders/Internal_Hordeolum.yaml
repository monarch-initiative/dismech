diagnosis:
- name: Clinical eyelid examination
  description: >-
    Typical morphology, focal eyelid-margin pain and swelling, and an acute
    course usually establish the diagnosis clinically.
  evidence:
  - reference: PMID:34379160
    reference_title: >-
      [Hordeolum and chalazion : (Differential) diagnosis and treatment].
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Due to the typical morphological features and clinical course, the
      diagnosis can mostly be clinically established.
    explanation: >-
      Supports clinical examination and course as the main diagnostic approach
      for typical hordeolum or chalazion.
- name: Biopsy of persistent or atypical eyelid nodules
  description: >-
    Persistent, recurrent, or atypical lesions should be excised and examined
    histopathologically to exclude masquerading eyelid malignancy.
  diagnosis_term:
    preferred_term: Biopsy Procedure
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  evidence:
  - reference: PMID:34379160
    reference_title: >-
      [Hordeolum and chalazion : (Differential) diagnosis and treatment].
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In persistent, recurrent or clinically atypical cases malignant tumors
      must be excluded as a differential diagnosis by excisional biopsy and
      histopathological assessment.
    explanation: >-
      Defines when biopsy is used: to rule out a malignant eyelid tumor rather
      than to diagnose routine acute hordeolum.
differential_diagnoses:
- name: Chalazion
  description: >-
    Chalazion can follow internal hordeolum but is a chronic lipogranulomatous
    meibomian lesion rather than an acute suppurative bacterial infection.
  distinguishing_features:
  - Chronic induration without the acute painful purulence of a bacterial hordeolum.
  evidence:
  - reference: PMID:28068454
    reference_title: Non-surgical interventions for acute internal hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If unresolved, an acute internal hordeolum can become chronic, or can
      develop into a chalazion.
    explanation: >-
      Distinguishes chalazion as a chronic lesion that can arise after the
      acute internal hordeolum phase.
- name: External Hordeolum
  description: >-
    External hordeolum affects glands of Zeis or Moll associated with eyelash
    follicles, whereas internal hordeolum affects the tarsal-plate meibomian
    gland.
  distinguishing_features:
  - External lesions are lash-follicle associated rather than centered in the tarsal meibomian gland.
  evidence:
  - reference: PMID:28181687
    reference_title: Acupuncture for acute hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      When the meibomian gland in the tarsal plate is affected, internal
      hordeolum occurs, while when the glands of Zeis or Moll associated with
      eyelash follicles are affected, external hordeolum, or stye occurs.
    explanation: >-
      Separates internal meibomian-gland disease from external Zeis or Moll
      gland infection.
- name: Eyelid malignancy
  description: >-
    Persistent, recurrent, or morphologically atypical hordeolum-like nodules
    can represent malignant eyelid tumors and require excisional biopsy.
  distinguishing_features:
  - Persistence, recurrence, or atypical appearance should prompt histopathology.
  evidence:
  - reference: PMID:34379160
    reference_title: >-
      [Hordeolum and chalazion : (Differential) diagnosis and treatment].
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In persistent, recurrent or clinically atypical cases malignant tumors
      must be excluded as a differential diagnosis by excisional biopsy and
      histopathological assessment.
    explanation: >-
      Supports malignancy as a differential diagnosis when a presumed
      hordeolum is recurrent, persistent, or atypical.
treatments:
- name: Warm compresses and lid hygiene
  description: >-
    Warm compresses and lid hygiene are used as conservative measures to
    promote drainage and clear the eyelid margin, but controlled trial evidence
    for acute internal hordeolum is absent.
  target_mechanisms:
  - target: Acute Suppurative Tarsal Gland Inflammation
    treatment_effect: MODULATES
    description: >-
      Local heat and lid cleansing aim to soften obstructed secretions and help
      the infected tarsal gland drain.
  evidence:
  - reference: PMID:28068454
    reference_title: Non-surgical interventions for acute internal hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Non-surgical interventions of interest included the use of hot or warm
      compresses, lid scrubs, antibiotics, or steroids compared with
      observation, placebo, or other active interventions.
    explanation: >-
      Establishes warm compresses and lid scrubs as conventional nonsurgical
      interventions assessed for acute internal hordeolum.
  - reference: PMID:28068454
    reference_title: Non-surgical interventions for acute internal hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: No trials were identified for this review.
    explanation: >-
      Records the evidence gap for nonsurgical acute internal hordeolum
      interventions.
- name: Local or systemic antibiotic therapy
  description: >-
    Antibiotics are used locally or systemically to suppress staphylococcal
    infection, with systemic therapy reserved for severe, nonlocal, or
    topical-treatment-resistant disease. No controlled trials of antibiotics
    for acute internal hordeolum were identified by a Cochrane review.
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Meibomian Gland Staphylococcal Seeding
    treatment_effect: INHIBITS
    description: >-
      Antibiotic therapy reduces the S. aureus burden that initiates the focal
      meibomian-gland infection.
  evidence:
  - reference: PMID:42367702
    reference_title: Local Injections of Fluorouracil for Eyelid Hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Currently, treatment methods for hordeolum mainly include local warm
      compresses, local or systemic antibiotic therapy, and abscess incision
      and drainage.
    explanation: >-
      The introduction of this case series lists local or systemic antibiotics
      among the main treatment approaches used for hordeolum.
  - reference: PMID:28068454
    reference_title: Non-surgical interventions for acute internal hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Systemic antibiotics are sometimes used when local antibiotics are not
      effective, or when the infection is not localized.
    explanation: >-
      Supports reserving systemic antibiotics for infection that is not
      localized or does not respond to local antibiotics.
  - reference: PMID:28068454
    reference_title: Non-surgical interventions for acute internal hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If the condition is severe and is resistant to topical antibiotics,
      systemic antibiotics, or surgical incision and drainage may be
      implemented
    explanation: >-
      Supports systemic antibiotics for severe or topical-antibiotic-resistant
      disease.
  - reference: PMID:28068454
    reference_title: Non-surgical interventions for acute internal hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: No trials were identified for this review.
    explanation: >-
      The Cochrane review, which included antibiotics among the interventions
      of interest, found no controlled trials, so antibiotic use for acute
      internal hordeolum rests on practice rather than trial evidence.
- name: Incision and drainage
  description: >-
    Incision and drainage evacuates a persistent or severe eyelid abscess when
    conservative and medical therapy are insufficient.
  treatment_term:
    preferred_term: Incision and Drainage
    term:
      id: NCIT:C38067
      label: Incision and Drainage
  target_mechanisms:
  - target: Acute Suppurative Tarsal Gland Inflammation
    treatment_effect: INHIBITS
    description: >-
      Drainage decompresses the localized abscess produced by tarsal-gland
      suppuration.
  evidence:
  - reference: PMID:42367702
    reference_title: Local Injections of Fluorouracil for Eyelid Hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Currently, treatment methods for hordeolum mainly include local warm
      compresses, local or systemic antibiotic therapy, and abscess incision
      and drainage.
    explanation: >-
      Identifies abscess incision and drainage as a standard procedural option
      for hordeolum.
epidemiology:
- name: Japanese invasive hordeolum procedure distribution
  description: >-
    A 2014-2022 Japanese nationwide-claims study counted 638,699 invasive
    hordeolum procedures, an annual average of 56.2 per 100,000 person-years.
    The procedure code covers incision of external or internal hordeolum, so
    these rates combine both forms and capture surgically treated disease
    rather than total internal hordeolum incidence.
  evidence:
  - reference: PMID:41675090
    reference_title: >-
      Sex Differences and Age Distributions in Invasive Treatments for
      Chalazion and Hordeolum in Japan: A 9-Year Nationwide Claims Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 1 104 078 procedures (ITC: 465 379; ITH: 638 699) were
      recorded over the 9-year study period.
    explanation: >-
      Gives the total count of invasive hordeolum procedures in Japan.
  - reference: PMID:41675090
    reference_title: >-
      Sex Differences and Age Distributions in Invasive Treatments for
      Chalazion and Hordeolum in Japan: A 9-Year Nationwide Claims Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The annual average rates were 40.9 for ITC and 56.2 for ITH per 100 000
      person-years.
    explanation: >-
      Gives the annual average rate of invasive hordeolum treatment.
  - reference: PMID:41675090
    reference_title: >-
      Sex Differences and Age Distributions in Invasive Treatments for
      Chalazion and Hordeolum in Japan: A 9-Year Nationwide Claims Study.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ITH (K208): Incision of hordeolum (external or internal)."
    explanation: >-
      Shows that the procedure code does not distinguish internal from

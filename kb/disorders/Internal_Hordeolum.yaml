name: Internal Hordeolum
creation_date: "2026-09-29T21:56:01Z"
description: >-
  Internal hordeolum is an acute localized staphylococcal infection of a
  meibomian gland in which bacteria entering at the eyelid margin trigger
  neutrophilic suppuration within the tarsal gland.
category: Infectious Disease
disease_term:
  preferred_term: internal hordeolum
  term:
    id: MONDO:0004917
    label: internal hordeolum
parents:
- eye infectious disorder
- staphylococcal infection
synonyms:
- Hordeolum internum
- Internal stye
infectious_agent:
- name: Staphylococcus aureus
  infectious_agent_term:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  description: >-
    Staphylococcus aureus is the usual bacterial agent for hordeola involving
    eyelid glands.
  evidence:
  - reference: PMID:28181687
    reference_title: Acupuncture for acute hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The usual cause of an acute hordeolum is the Staphylococcus aureus
      bacterium
    explanation: >-
      Identifies S. aureus as the classic bacterial agent for acute hordeola.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Local Eyelid Gland Inoculation
  description: >-
    Staphylococci from periocular skin colonization seed the meibomian gland
    opening at the eyelid margin and establish a focal tarsal-gland infection.
  evidence:
  - reference: PMID:28181687
    reference_title: Acupuncture for acute hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      When the meibomian gland in the tarsal plate is affected, internal
      hordeolum occurs, while when the glands of Zeis or Moll associated with
      eyelash follicles are affected, external hordeolum, or stye occurs.
    explanation: >-
      Localizes internal hordeolum to infection of the eyelid's tarsal
      meibomian gland rather than to a systemic or vector-borne route.
pathophysiology:
- name: Meibomian Gland Dysfunction and Chronic Blepharitis
  role: predisposing condition
  description: >-
    Underlying meibomian gland dysfunction or chronic blepharitis, including
    meibomitis associated with seborrheic dermatitis or acne rosacea, leaves
    the tarsal glands prone to obstruction and focal infection.
  biological_scale: TISSUE
  locations:
  - preferred_term: meibomian gland
    term:
      id: UBERON:0001818
      label: tarsal gland
  - preferred_term: margin of eyelid
    term:
      id: UBERON:0034772
      label: margin of eyelid
  downstream:
  - target: Meibomian Gland Orifice Obstruction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Dysfunctional meibomian secretion and lid-margin inflammation predispose
      to blockage of the gland orifice.
  evidence:
  - reference: PMID:34379160
    reference_title: >-
      [Hordeolum and chalazion : (Differential) diagnosis and treatment].
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      They can occur in association with underlying diseases causing Meibomian
      gland dysfunction and/or chronic blepharitis.
    explanation: >-
      Names meibomian gland dysfunction and chronic blepharitis as the
      underlying conditions on which hordeola arise.
  - reference: PMID:28068454
    reference_title: Non-surgical interventions for acute internal hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Blepharitis (Fuchs 1911; Skorin 2002), acne rosacea (De Jesus 2004),
      trichiasis, and cicatricial ectropion (Moriarty 1982), are conditions
      frequently associated with internal hordeola.
    explanation: >-
      The review's background lists blepharitis and acne rosacea among the
      conditions frequently associated with internal hordeola.
  - reference: PMID:6218459
    reference_title: Classification of chronic blepharitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Primary meibomitis appears not to be a primarily infectious entity but to
      represent a facet of generalized sebaceous gland dysfunction and to be
      found in association with seborrheic dermatitis or acne rosacea.
    explanation: >-
      Characterizes meibomian-gland inflammation in chronic blepharitis as a
      sebaceous gland dysfunction associated with seborrheic dermatitis or acne
      rosacea, the predisposing substrate for internal hordeolum.
- name: Meibomian Gland Orifice Obstruction
  description: >-
    Blockage of the meibomian gland orifice at the eyelid margin retains
    secretions in the tarsal gland and provides the setting for bacterial
    infection.
  biological_scale: TISSUE
  locations:
  - preferred_term: meibomian gland
    term:
      id: UBERON:0001818
      label: tarsal gland
  - preferred_term: margin of eyelid
    term:
      id: UBERON:0034772
      label: margin of eyelid
  downstream:
  - target: Meibomian Gland Staphylococcal Seeding
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The obstructed gland is the site where staphylococcal infection becomes
      established.
  evidence:
  - reference: PMID:28181687
    reference_title: Acupuncture for acute hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It is an acute, red, painful, and localized inflammation with abscess
      formation, usually caused by obstructed orifices of the sebaceous glands
      of the eyelid.
    explanation: >-
      Identifies obstruction of the eyelid sebaceous-gland orifices as the
      usual antecedent of the hordeolum abscess.
- name: Meibomian Gland Staphylococcal Seeding
  role: trigger
  description: >-
    Bacteria enter a meibomian-gland orifice at the eyelid margin and seed the
    tarsal sebaceous gland.
  biological_scale: TISSUE
  locations:
  - preferred_term: meibomian gland
    term:
      id: UBERON:0001818
      label: tarsal gland
  - preferred_term: margin of eyelid
    term:
      id: UBERON:0034772
      label: margin of eyelid
  downstream:
  - target: Acute Suppurative Tarsal Gland Inflammation
    causal_link_type: DIRECT
    description: >-
      Staphylococcal growth inside the meibomian gland drives acute local
      inflammation.
  evidence:
  - reference: PMID:28181687
    reference_title: Acupuncture for acute hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      When the meibomian gland in the tarsal plate is affected, internal
      hordeolum occurs, while when the glands of Zeis or Moll associated with
      eyelash follicles are affected, external hordeolum, or stye occurs.
    explanation: >-
      Supports the anatomic trigger site for internal hordeolum: the
      meibomian gland embedded in the tarsal plate.
- name: Acute Suppurative Tarsal Gland Inflammation
  description: >-
    The infected tarsal gland recruits neutrophils and forms a localized
    painful abscess within the eyelid.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: Neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  locations:
  - preferred_term: meibomian gland
    term:
      id: UBERON:0001818
      label: tarsal gland
  - preferred_term: eyelid
    term:
      id: UBERON:0001711
      label: eyelid
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  - preferred_term: neutrophil activation
    modifier: INCREASED
    term:
      id: GO:0042119
      label: neutrophil activation
  downstream:
  - target: Hordeolum Internum
    causal_link_type: DIRECT
    description: >-
      Suppuration in the meibomian gland produces the internal stye centered
      within the tarsal plate.
  - target: Eyelid Pain
    causal_link_type: DIRECT
    description: >-
      The acute suppurative inflammation makes the lesion painful.
  - target: Eyelid Erythema
    causal_link_type: DIRECT
    description: >-
      Local inflammation produces redness of the affected eyelid.
  - target: Eyelid Swelling
    causal_link_type: DIRECT
    description: >-
      Abscess formation and inflammatory edema swell the eyelid.
  - target: Chalazion Formation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      An unresolved internal hordeolum can become chronic and develop into a
      chalazion.
  - target: Preseptal Eyelid Cellulitis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Severe or unresolved infection can spread beyond the meibomian gland
      into adjacent eyelid tissue.
  evidence:
  - reference: PMID:28068454
    reference_title: Non-surgical interventions for acute internal hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A hordeolum is a common, painful inflammation of the eyelid margin that
      is usually caused by a bacterial infection.
    explanation: >-
      Frames the painful acute eyelid-margin inflammatory nodule as a bacterial
      process.
  - reference: PMID:28181687
    reference_title: Acupuncture for acute hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It is an acute, red, painful, and localized inflammation with abscess
      formation, usually caused by obstructed orifices of the sebaceous glands
      of the eyelid.
    explanation: >-
      Supports localized abscess formation as the tissue-level lesion.
- name: Chalazion Formation
  description: >-
    An unresolved internal hordeolum can become chronic and organize into a
    chalazion, a chronic meibomian-gland granuloma rather than an acute
    suppurative infection.
  biological_scale: TISSUE
  locations:
  - preferred_term: meibomian gland
    term:
      id: UBERON:0001818
      label: tarsal gland
  evidence:
  - reference: PMID:28068454
    reference_title: Non-surgical interventions for acute internal hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If unresolved, an acute internal hordeolum can become chronic, or can
      develop into a chalazion.
    explanation: >-
      Documents chalazion as the chronic outcome of an unresolved acute
      internal hordeolum.
  - reference: PMID:28181687
    reference_title: Acupuncture for acute hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      As long as an internal hordeolum remains unresolved, it can develop into
      a chalazion or generalized eyelid cellulitis.
    explanation: >-
      Supports the chalazion branch of the outcomes of unresolved internal
      hordeolum.
- name: Preseptal Eyelid Cellulitis
  description: >-
    Infection spreading from the meibomian gland into adjacent eyelid tissue
    produces generalized eyelid (preseptal) cellulitis; hordeolum is a common
    predisposing factor in adult preseptal cellulitis series.
  biological_scale: TISSUE
  locations:
  - preferred_term: eyelid
    term:
      id: UBERON:0001711
      label: eyelid
  evidence:
  - reference: PMID:28181687
    reference_title: Acupuncture for acute hordeolum.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      As long as an internal hordeolum remains unresolved, it can develop into
      a chalazion or generalized eyelid cellulitis.
    explanation: >-
      Supports the eyelid-cellulitis branch of the outcomes of unresolved
      internal hordeolum.
  - reference: PMID:34607790
    reference_title: >-
      Differences in characteristics, aetiologies, isolated pathogens, and the
      efficacy of antibiotics in adult patients with preseptal cellulitis and
      orbital cellulitis between 2000-2009 and 2010-2019.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common predisposing factor was dacryocystitis (15.5%-30.5%),
      followed by hordeolum (15.5%-24.8%).
    explanation: >-
      In a hospitalized-adult cellulitis series, hordeolum was a common
      antecedent for preseptal cellulitis.

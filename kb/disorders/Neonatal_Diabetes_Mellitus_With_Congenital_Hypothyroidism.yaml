  - reference: PMID:21786021
    reference_title: "The Krüppel-like zinc finger protein GLIS3 transactivates neurogenin 3 for proper fetal pancreatic islet differentiation in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In vivo and in vitro analyses placed Glis3 upstream of Neurog3, the endocrine pancreas lineage-defining transcription factor."
    explanation: Places GLIS3 upstream of the endocrine lineage determinant in the fetal pancreas.
  - reference: PMID:21786021
    reference_title: "The Krüppel-like zinc finger protein GLIS3 transactivates neurogenin 3 for proper fetal pancreatic islet differentiation in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results indicate that GLIS3 controls fetal islet differentiation via direct transactivation of Neurog3, a perturbation that causes neonatal diabetes in mice."
    explanation: Links loss of Neurog3 transactivation to neonatal diabetes in the knockout.
  - reference: PMID:27813676
    reference_title: "Differential Gene Dosage Effects of Diabetes-Associated Gene GLIS3 in Pancreatic β Cell Differentiation and Function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast to the >90% reduction of Ngn3 and near-total absence of insulin (Ins) in the embryonic pancreas of Glis3-/- mice"
    explanation: Quantifies the loss of Ngn3 and insulin in the Glis3-null embryonic pancreas.
  - reference: PMID:19481545
    reference_title: "A murine model of neonatal diabetes mellitus in Glis3-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The high levels of blood sugar are attributed to a decrease in the Insulin mRNA level in the pancreas that is caused by impaired islet development and the subsequent impairment of Insulin-producing cell formation."
    explanation: Independent knockout showing impaired islet development and insulin-producing cell formation.
  downstream:
  - target: Insulin Deficiency
    description: Too few insulin-producing beta cells are formed to sustain insulin output.
- name: Reduced Insulin Gene Transcription
  biological_scale: MOLECULAR
  description: >-
    In differentiated beta cells GLIS3 binds a response element in the insulin
    promoter and cooperates with PDX1, MAFA and NEUROD1 to drive insulin
    transcription; it also directly regulates Mafa and Slc2a2. The NDH1 mutant
    protein cannot activate insulin expression. Pancreas-specific deletion in
    mice leaves PDX1-positive cells that no longer express insulin.
  cell_types:
  - preferred_term: type B pancreatic cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  evidence:
  - reference: PMID:19264802
    reference_title: "The Krüppel-like zinc finger protein Glis3 directly and indirectly activates insulin gene transcription."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrate that insulin 2 (Ins2) mRNA expression in rat insulinoma 832/13 cells is markedly increased by wild-type Glis3 overexpression, but not by the NDH1 mutant."
    explanation: >-
      The patient-derived NDH1 mutant fails to activate insulin expression that
      wild-type GLIS3 induces.
  - reference: PMID:19264802
    reference_title: "The Krüppel-like zinc finger protein Glis3 directly and indirectly activates insulin gene transcription."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Glis3 binds to the Ins2 promoter in the cell, detected by chromatin immunoprecipitation."
    explanation: Shows direct GLIS3 occupancy of the insulin promoter.
  - reference: PMID:31340201
    reference_title: "GLIS3 binds pancreatic beta cell regulatory regions alongside other islet transcription factors."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Indeed, presumptive beta cells appeared to persist as PDX1+/INS-/MAFA-/GLUT2- cells."
    explanation: >-
      After pancreas-specific Glis3 deletion, beta cells persist but lose insulin
      expression, isolating the transcriptional role from the developmental one.
  downstream:
  - target: Insulin Deficiency
    description: Remaining beta cells produce too little insulin.
- name: Insulin Deficiency
  biological_scale: ORGANISM
  description: >-
    Endogenous insulin production is absent or severely reduced from birth, with
    low C-peptide. Insulin requirements and sensitivity vary widely between
    patients. Fetal insulin deficiency is also the proposed cause of the
    intrauterine growth restriction seen in most patients.
  cell_types:
  - preferred_term: type B pancreatic cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  evidence:
  - reference: PMID:36312692
    reference_title: "A Neonate With Diabetes Mellitus, Congenital Hypothyroidism, and Congenital Glaucoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "C-peptide level was 0.2 ng/mL (1.1-4.4 ng/mL) suggestive of exogenous insulin administration and deficiency of endogenous insulin."
    explanation: Low C-peptide documents endogenous insulin deficiency in a GLIS3 patient.
  downstream:
  - target: Neonatal Diabetes Mellitus
    description: Insulin deficiency causes hyperglycaemia from the first days of life.
  - target: Intrauterine Growth Retardation
    description: >-
      Insulin is a major fetal growth factor; its intrauterine deficiency is the
      proposed cause of the growth restriction.
    evidence:
    - reference: PMID:26259131
      reference_title: "Expanding the Clinical Spectrum Associated With GLIS3 Mutations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the concomitant presence of IUGR may reflect significant intrauterine insulin deficiency"
      explanation: >-
        The authors attribute the IUGR to fetal insulin deficiency; the claim is
        stated as a possibility, not demonstrated.
- name: Impaired TSH-Dependent Thyroid Hormone Biosynthesis
  biological_scale: CELLULAR
  description: >-
    In the thyroid GLIS3 acts downstream of TSH and TSHR. It binds the promoters
    of iodide transporter genes (Nis/SLC5A5, Pds/SLC26A4) and other thyroid
    hormone biosynthesis genes. The global knockout also loses TSH-driven
    follicular cell proliferation through mTORC1, but a thyroid-specific
    (Pax8-Cre) knockout keeps normal proliferation while biosynthesis genes stay
    suppressed, so the proliferation defect is attributed to GLIS3 loss in other
    cell types and the cell-autonomous thyroid defect is in hormone synthesis.
    Its loss produces a dyshormonogenic
    hypothyroidism in which TSH and thyroglobulin rise. Thyroid anatomy in
    patients ranges from normal to hypoplasia or athyreosis, and a post-mortem
    gland showed sparse colloid with interstitial fibrosis, so a developmental
    contribution is not excluded.
  biological_processes:
  - preferred_term: thyroid hormone generation
    term:
      id: GO:0006590
      label: thyroid hormone generation
    modifier: DECREASED
  cell_types:
  - preferred_term: thyroid follicular cell
    term:
      id: CL:0002258
      label: thyroid follicular cell
  locations:
  - preferred_term: thyroid gland
    term:
      id: UBERON:0002046
      label: thyroid gland
  evidence:
  - reference: PMID:29083325
    reference_title: "GLIS3 is indispensable for TSH/TSHR-dependent thyroid hormone biosynthesis and follicular cell proliferation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we demonstrate that GLIS3 acts downstream of thyroid-stimulating hormone (TSH) and TSH receptor (TSHR) and is indispensable for TSH/TSHR-mediated proliferation of thyroid follicular cells and biosynthesis of thyroid hormone."
    explanation: Establishes GLIS3 as required for TSH-driven thyroid hormone biosynthesis.
  - reference: PMID:29083325
    reference_title: "GLIS3 is indispensable for TSH/TSHR-dependent thyroid hormone biosynthesis and follicular cell proliferation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "GLIS3 is critical for the transcriptional activation of several genes required for thyroid hormone biosynthesis, including the iodide transporters Nis and Pds, both of which showed enhanced GLIS3 binding at their promoters."
    explanation: Names the direct transcriptional targets through which biosynthesis fails.
  - reference: PMID:37461635
    reference_title: "Role of GLIS3 in thyroid development and in the regulation of gene expression in thyroid specific Glis3KO mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We further show that Glis3KO mice do not display any major changes in prenatal thyroid gland morphology indicating that CH in Glis3KO mice is due to dyshormonogenesis rather than thyroid dysgenesis."
    explanation: >-
      Places the mouse hypothyroidism in hormone synthesis rather than gland
      formation, which is why this node is a biosynthesis defect.
  - reference: PMID:37461635
    reference_title: "Role of GLIS3 in thyroid development and in the regulation of gene expression in thyroid specific Glis3KO mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, the expression of several thyroid hormone biosynthesis-, extracellular matrix (ECM)-, and inflammation-related genes was still suppressed in Glis3-Pax8Cre mice"
    explanation: >-
      Deleting Glis3 only in thyroid cells is enough to suppress biosynthesis
      genes, so this defect is intrinsic to the follicular cell.
  - reference: PMID:26259131
    reference_title: "Expanding the Clinical Spectrum Associated With GLIS3 Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, the postmortem examination of the thyroid gland in patient 6 demonstrated a paucity of colloid as well as extensive perifollicular and interstitial fibrosis, explaining the need for thyroxine despite apparently normal thyroid anatomy on ultrasonography."
    explanation: Human thyroid histology showing failed hormone storage in an anatomically normal gland.
  downstream:
  - target: Congenital Hypothyroidism
    description: Insufficient thyroid hormone synthesis causes hypothyroidism from birth.
  - target: Elevated Circulating TSH
    description: Loss of thyroid hormone feedback raises TSH, which then fails to drive the gland.
  - target: Elevated Circulating Thyroglobulin
    description: >-
      Thyroglobulin is secreted while iodide handling is impaired, so circulating
      thyroglobulin rises.
- name: Renal Cystogenesis
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    GLIS3 localises to the primary cilium and uses WWTR1/TAZ as a transcriptional
    coactivator, placing it in a cilium-associated signalling pathway like its
    paralog GLIS2, whose loss causes nephronophthisis. Glis3 zinc-finger mutant
    mice develop polycystic kidneys, with fewer ciliated cells in the cyst
    lining. Patients show enlarged kidneys with multiple small cysts, cystic
    renal dysplasia and deficient corticomedullary differentiation, usually with
    preserved renal function early on. How ciliary GLIS3 function leads to cysts
    in humans is not established.
  notes: >-
    The primary cilium is bound to GO:0097730 non-motile cilium because
    GO:0072372 primary cilium did not resolve as a live GO class in the
    CellularComponentTerm enum during term validation.
  cellular_components:
  - preferred_term: primary cilium
    term:
      id: GO:0097730
      label: non-motile cilium

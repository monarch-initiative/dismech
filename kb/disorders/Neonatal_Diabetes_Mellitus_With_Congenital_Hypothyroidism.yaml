genetic:
- name: GLIS3
  gene_term:
    preferred_term: GLIS3
    term:
      id: hgnc:28510
      label: GLIS3
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic variants: partial or whole-exon deletions (most frequent),
    frameshift (c.1873dupC in the index family), nonsense (p.Gln798Ter) and
    missense variants in the zinc-finger DNA-binding domain (p.Cys536Trp,
    p.His561Tyr, p.Arg589Trp, p.His647Arg). Some deletions also remove the
    neighbouring SLC1A1 gene. Common GLIS3 variants associated with type 1 and
    type 2 diabetes in GWAS are susceptibility alleles and are not part of this
    Mendelian entry.
  evidence:
  - reference: PMID:16715098
    reference_title: "Mutations in GLIS3 are responsible for a rare syndrome with neonatal diabetes mellitus and congenital hypothyroidism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we show that this syndrome results from mutations in GLIS3, encoding GLI similar 3, a recently identified transcription factor."
    explanation: The original identification of GLIS3 as the causal gene.
  - reference: PMID:26259131
    reference_title: "Expanding the Clinical Spectrum Associated With GLIS3 Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients 1, 5, and 10 harbor missense mutations (p.Arg589Trp, p.Cys536Trp, and p.His561Tyr, respectively), affecting highly conserved amino acids located in the DNA binding domain and so are likely to be pathogenic, thus severely affecting the function of the GLIS3 protein."
    explanation: Adds zinc-finger missense variants to the allelic spectrum.
treatments:
- name: Insulin Therapy
  description: >-
    Lifelong insulin from diagnosis, often by continuous subcutaneous infusion
    with glucose monitoring. Insulin sensitivity varies widely, from recurrent
    hypoglycaemia on very small doses to insulin resistance during illness, so
    control is often labile. The diabetes is a beta-cell developmental
    deficiency rather than a KATP-channel defect, so molecular diagnosis matters:
    it distinguishes insulin-dependent forms like this one from the
    sulfonylurea-responsive KCNJ11/ABCC8 channel forms.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: insulin
      term:
        id: CHEBI:145810
        label: insulin
  target_mechanisms:
  - target: Insulin Deficiency
    treatment_effect: RESTORES
    description: Exogenous insulin replaces the hormone that the patient cannot produce.
  evidence:

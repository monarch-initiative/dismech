diagnosis:
- name: Molecular genetic testing of GLIS3
  diagnosis_term:
    preferred_term: GLIS3 sequencing and copy-number analysis
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Suspected in any infant with neonatal diabetes and congenital hypothyroidism,
    including from non-consanguineous families. Because partial deletions are the
    commonest variant class, copy-number analysis or chromosomal microarray is
    needed in addition to sequencing.
  evidence:
  - reference: PMID:21139041
    reference_title: "Novel GLIS3 mutations demonstrate an extended multisystem phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also report the first case of a recessive GLIS3 mutation causing neonatal diabetes and congenital hypothyroidism in a child from a non-consanguineous pedigree, highlighting the importance of molecular genetic testing in any patient with this phenotype."
    explanation: Recommends genetic testing for every patient with the phenotype.
experimental_models:
- experimental_model_type: OTHER
  name: GLIS3-null human embryonic stem cell pancreatic differentiation (HUES8)
  organism:
    preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: human embryonic stem cell
    term:
      id: CL:0002322
      label: embryonic stem cell
  cell_source: HUES8 human embryonic stem cell line, CRISPR/Cas- and TALEN-edited GLIS3 knockout
  culture_system: Directed pancreatic differentiation of gene-edited hESCs to the pancreatic-progenitor and PH-beta stage
  publication: PMID:27133796
  description: >-
    A systematic hESC knockout panel of eight pancreatic transcription factors.
    Unlike PDX1, RFX6 and NGN3 knockouts, the GLIS3-null line showed no overt
    endocrine differentiation defect at the stages assayed, a human-model result
    that does not reproduce the beta-cell deficiency of patients and is read by
    the authors as a possible later-stage or protocol-dependent requirement.
  modeled_mechanisms:
  - target: Impaired Endocrine Pancreas Differentiation
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      The human GLIS3-null line did not show the endocrine differentiation defect
      that the human disease and the mouse knockouts show, at the differentiation
      stages tested.
    limitations: >-
      Only early-to-mid pancreatic differentiation stages were assayed; the
      protocol generates fetal polyhormonal beta cells, so a later-stage or
      maturation-stage GLIS3 requirement could be missed. This is a single in
      vitro system.
    evidence:
    - reference: PMID:27133796
      reference_title: "Genome Editing of Lineage Determinants in Human Pluripotent Stem Cells Reveals Mechanisms of Pancreatic Development and Diabetes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "At the PH-β stage, all −/− mutant lines exhibited a defect with the exception of PTF1A−/−, MNX1−/− and GLIS3−/− mutants."
      explanation: The GLIS3 knockout line lacked the differentiation defect seen in other PNDM-gene knockouts.
  evidence:
  - reference: PMID:27133796
    reference_title: "Genome Editing of Lineage Determinants in Human Pluripotent Stem Cells Reveals Mechanisms of Pancreatic Development and Diabetes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This protocol may allow us to identify later differentiation defects in PTF1A−/−, MNX1−/− and GLIS3−/− mutant lines, which did not exhibit an overt phenotype at early differentiation stages."
    explanation: The authors read the absent early phenotype as a possible later-stage requirement, framing the model's negative result.
animal_models:
- name: Glis3 global knockout mouse
  species: Mouse
  genotype: Glis3 -/- (gene-targeted null)
  publication: PMID:21786021
  description: >-
    Global Glis3-null mice develop severe neonatal diabetes and die within the
    first days to weeks of life, with near-total loss of embryonic Ngn3 and
    insulin expression.
  modeled_mechanisms:
  - target: Impaired Endocrine Pancreas Differentiation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: Reproduces the failure of fetal islet endocrine differentiation.
    limitations: >-
      Neonatal lethality in the mouse precludes study of the later multisystem
      course seen in surviving patients.
    evidence:
    - reference: PMID:21786021
      reference_title: "The Krüppel-like zinc finger protein GLIS3 transactivates neurogenin 3 for proper fetal pancreatic islet differentiation in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results indicate that GLIS3 controls fetal islet differentiation via direct transactivation of Neurog3, a perturbation that causes neonatal diabetes in mice."
      explanation: Shows the knockout reproduces the developmental mechanism and the diabetes.
  evidence:
  - reference: PMID:19481545
    reference_title: "A murine model of neonatal diabetes mellitus in Glis3-deficient mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The pancreatic phenotypes indicate that the Glis3-deficient mice are a model for GLIS3 mutation and diabetes mellitus in humans."
    explanation: Independent Glis3 knockout validated as a model of the human diabetes.
- name: Glis3 zinc-finger mutant mouse (Glis3 zf/zf)
  species: Mouse
  genotype: Glis3 zf/zf
  publication: PMID:19273592
  description: >-
    Mice carrying a Glis3 zinc-finger mutation develop diabetes and polycystic
    kidney disease resembling the human syndrome.
  modeled_mechanisms:
  - target: Renal Cystogenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reproduces the renal cystic disease.
    limitations: >-
      Cyst mechanism in the mouse is linked to ciliary localisation but not
      resolved, and the human lesion is often cystic dysplasia rather than
      classic polycystic kidney disease.
    evidence:
    - reference: PMID:19273592
      reference_title: "Glis3 is associated with primary cilia and Wwtr1/TAZ and implicated in polycystic kidney disease."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our study demonstrates that dysfunction of Glis3 leads to the development of cystic renal disease, suggesting that Glis3 plays a critical role in maintaining normal renal functions."
      explanation: Mutant mice develop the cystic renal disease.
  evidence:
  - reference: PMID:19273592
    reference_title: "Glis3 is associated with primary cilia and Wwtr1/TAZ and implicated in polycystic kidney disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These mice display abnormalities very similar to those of patients with neonatal diabetes and hypothyroidism syndrome, including the development of diabetes and polycystic kidney disease."
    explanation: States the resemblance to the human syndrome.
- name: GLIS3-deficient mouse thyroid model
  species: Mouse
  genotype: Glis3 deficiency (knockout)
  publication: PMID:29083325
  description: >-
    GLIS3-deficient mice fail to mount TSH-driven thyroid hormone biosynthesis
    and follicular proliferation and do not develop goiter under chronic TSH
    stimulation.
  modeled_mechanisms:
  - target: Impaired TSH-Dependent Thyroid Hormone Biosynthesis
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Reproduces the thyroid hormone biosynthesis defect.
    limitations: >-
      Does not explain the athyreosis or hypoplasia seen in some patients, which
      suggests a developmental component the model does not address.
    evidence:
    - reference: PMID:29083325
      reference_title: "GLIS3 is indispensable for TSH/TSHR-dependent thyroid hormone biosynthesis and follicular cell proliferation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our study identifies GLIS3 as a key regulator of TSH/TSHR-mediated thyroid hormone biosynthesis and proliferation of thyroid follicular cells and uncovers a mechanism by which GLIS3 deficiency causes neonatal hypothyroidism and prevents goiter development."
      explanation: Links the mouse finding to the neonatal hypothyroidism of the human disease.
- name: Thyroid-specific Glis3 knockout mouse (Glis3-Pax8Cre)
  species: Mouse
  genotype: Glis3 floxed; Pax8-Cre (thyroid-specific deletion)
  publication: PMID:37461635
  description: >-
    Deleting Glis3 only in thyroid follicular lineage cells separates the
    cell-autonomous thyroid defect from effects of global GLIS3 loss.
    Biosynthesis genes remain suppressed, while the follicular proliferation
    defect of the global knockout is not reproduced.
  modeled_mechanisms:
  - target: Impaired TSH-Dependent Thyroid Hormone Biosynthesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Reproduces suppression of thyroid hormone biosynthesis genes, most clearly
      under high TSH.
    limitations: >-
      Follicular cell proliferation is not repressed in this model, unlike the
      global knockout, so it isolates the biosynthesis arm only. Human thyroid
      hypoplasia or athyreosis is not modelled.
    readouts:
    - name: Thyroid hormone biosynthesis gene expression
      target: Impaired TSH-Dependent Thyroid Hormone Biosynthesis
      direction: DECREASED
      interpretation: Expression readout of the biosynthesis defect in follicular cells.
      evidence:
      - reference: PMID:37461635
        reference_title: "Role of GLIS3 in thyroid development and in the regulation of gene expression in thyroid specific Glis3KO mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "However, the expression of several thyroid hormone biosynthesis-, extracellular matrix (ECM)-, and inflammation-related genes was still suppressed in Glis3-Pax8Cre mice"
        explanation: Reports the decreased biosynthesis gene expression in this model.
    evidence:
    - reference: PMID:37461635
      reference_title: "Role of GLIS3 in thyroid development and in the regulation of gene expression in thyroid specific Glis3KO mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, the expression of several thyroid hormone biosynthesis-, extracellular matrix (ECM)-, and inflammation-related genes was still suppressed in Glis3-Pax8Cre mice"
      explanation: Supports using this model for the biosynthesis node.
  evidence:
  - reference: PMID:37461635
    reference_title: "Role of GLIS3 in thyroid development and in the regulation of gene expression in thyroid specific Glis3KO mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Loss of GLI-Similar 3 (GLIS3) function in mice and humans causes congenital hypothyroidism (CH)."
    explanation: Frames the mouse work against the human congenital hypothyroidism.

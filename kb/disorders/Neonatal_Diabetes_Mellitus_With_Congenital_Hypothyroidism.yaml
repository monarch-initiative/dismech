- name: Impaired Osteoblast Differentiation
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    GLIS3 is highly expressed in human osteoblasts and promotes osteoblast
    differentiation in part by inducing FGF18. Patients show osteopenia, poorly
    healing rib fractures with persistent callus and scoliosis, which the
    clinical authors interpret as a bone remodelling defect. The link between
    the in vitro osteoblast data and the human skeletal phenotype is inferred.
  biological_processes:
  - preferred_term: osteoblast differentiation
    term:
      id: GO:0001649
      label: osteoblast differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:17488195
    reference_title: "Krüppel-like zinc finger protein Glis3 promotes osteoblast differentiation by regulating FGF18 expression."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The zinc finger protein Glis3 is highly expressed in human osteoblasts and acts synergistically with BMP2 and Shh in enhancing osteoblast differentiation in multipotent C3H10T1/2 cells."
    explanation: Establishes a pro-osteoblastic function of GLIS3 in cell culture.
  - reference: PMID:26259131
    reference_title: "Expanding the Clinical Spectrum Associated With GLIS3 Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The persistence of callus formation suggests a defect in bone remodeling either due to dysfunctional osteoblast signaling to osteoclasts or reduced osteoclastic bone reabsorption."
    explanation: The clinical authors' interpretation of the skeletal phenotype as a remodelling defect.
  downstream:
  - target: Osteopenia
    description: Deficient bone formation and remodelling reduce bone mineral density.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The absence of a major transcript in the pancreas and thyroid (deletions from both families) and an eye-specific transcript (deletion from one family), together with residual expression of some GLIS3 transcripts, seems to explain the incomplete clinical manifestations in these individuals."
    explanation: Associates loss of an eye-specific GLIS3 transcript with the ocular phenotype.
  - reference: PMID:26259131
    reference_title: "Expanding the Clinical Spectrum Associated With GLIS3 Mutations."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "However, from our cohort we were unable to ascribe a specific exon relating to the eye disease."
    explanation: >-
      A later 12-patient series could not reproduce an exon-specific link for the
      eye disease, which weakens the transcript-specific explanation.
  downstream:
  - target: Congenital Glaucoma
    description: Abnormal anterior segment development raises intraocular pressure from infancy.
  - target: High Hypermetropia
    description: >-
      A short axial length of the globe produces high hyperopia, reported with

    label: neonatal diabetes mellitus with congenital hypothyroidism
synonyms:
- NDH syndrome
- neonatal diabetes and hypothyroidism syndrome
- neonatal diabetes-congenital hypothyroidism-congenital glaucoma-hepatic fibrosis-polycystic kidneys syndrome
- diabetes mellitus, neonatal, with congenital hypothyroidism
- GLIS3-related neonatal diabetes
parents:
- Neonatal Diabetes Mellitus
- Congenital Hypothyroidism
notes: >-
  Common noncoding GLIS3 variants are genome-wide association signals for type 1
  and type 2 diabetes. That susceptibility role is a different relationship from
  the biallelic loss of function curated here and is not modelled as a genetic
  cause of this entry.
inheritance:
- name: Autosomal Recessive
  description: >-
    Affected individuals carry biallelic GLIS3 variants, homozygous in the
    majority, who are mostly offspring of consanguineous unions; compound
    heterozygotes have also been reported. Heterozygous carrier parents are
    usually clinically unaffected, but in one Saudi family every heterozygous
    carrier sibling of two affected children had juvenile hypothyroidism, so a
    milder carrier thyroid phenotype is possible.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:34093443
    reference_title: "Case Report: Neonatal Diabetes Mellitus Caused by a Novel GLIS3 Mutation in Twins."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, 14 mutations in GLIS3 have been reported, inherited in an autosomal recessive manner."
    explanation: >-
      States the autosomal recessive inheritance of the reported GLIS3 variants.
      The sentence summarises prior reports rather than this study's own twins.
    quote_role: BACKGROUND
  - reference: PMID:35394098
    reference_title: "Case report: Neonatal diabetes mellitus with congenital hypothyroidism as a result of biallelic heterozygous mutations in GLIS3 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Each was inherited from clinically healthy father and mother, respectively."
    explanation: >-
      The two compound heterozygous variants were each inherited from an
      unaffected parent, consistent with recessive inheritance.
  - reference: PMID:40583116
    reference_title: "Congenital glaucoma associated with high hyperopia, an ophthalmic phenotypical manifestation for GLIS3 deletion: case report and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic testing of other siblings showed a heterozygous deletion of the GLIS3 gene. Although their ophthalmic examinations were unremarkable, all carriers presented with juvenile hypothyroidism."
    explanation: >-
      Heterozygous carriers in this family lacked the syndrome but had juvenile
      hypothyroidism, which qualifies the statement that carriers are unaffected.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    About 22 cases from 16 families in 11 countries had been described by 2022.
    No population prevalence estimate exists. In a Chinese screen of 592
    congenital hypothyroidism patients, GLIS3 variants were found in 0.3%, and
    neither carrier had the recessive syndrome.
  evidence:
  - reference: PMID:35394098
    reference_title: "Case report: Neonatal diabetes mellitus with congenital hypothyroidism as a result of biallelic heterozygous mutations in GLIS3 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, 22 cases of NDH syndrome from 16 families and 11 countries have been described."
    explanation: Gives the published case count, which is the only frequency measure available.
    quote_role: BACKGROUND
  - reference: PMID:29146476
    reference_title: "Mutation screening of the GLIS3 gene in a cohort of 592 Chinese patients with congenital hypothyroidism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study indicated that the prevalence of GLIS3 variations was 0.3% among studied Chinese CH patients."
    explanation: >-
      Shows that GLIS3 variants are a rare contributor even within a congenital
      hypothyroidism cohort.
pathophysiology:
- name: Biallelic GLIS3 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic GLIS3 variants remove or truncate the transcription factor. The
    original NDH1 frameshift (c.1873dupC) yields a protein that still enters the
    nucleus but has lost its C-terminal transactivation function, while partial
    deletions remove the 5' exons and the major pancreatic and thyroid
    transcripts. Residual expression of shorter tissue-specific transcripts from
    some deletion alleles is the proposed explanation for incomplete phenotypes.
  molecular_functions:
  - preferred_term: GLIS3 sequence-specific DNA-binding transcription factor activity
    term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
    modifier: DECREASED
  genetic_context:
    gene:
      preferred_term: GLIS3
      term:
        id: hgnc:28510
        label: GLIS3
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:16715098
    reference_title: "Mutations in GLIS3 are responsible for a rare syndrome with neonatal diabetes mellitus and congenital hypothyroidism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the original family, we identified a frameshift mutation predicted to result in a truncated protein. In two other families with an incomplete syndrome, we found that affected individuals harbor deletions affecting the 11 or 12 5'-most exons of the gene."
    explanation: >-
      Identifies the truncating and deletion alleles that define the disease
      mechanism as loss of GLIS3.
  - reference: PMID:18263616
    reference_title: "Functional analysis of the zinc finger and activation domains of Glis3 and mutant Glis3(NDH1)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrate that this truncation does not effect the nuclear localization but results in the loss of Glis3 transactivating activity."
    explanation: >-
      Shows directly that the patient frameshift abolishes GLIS3 transcriptional
      activation, the molecular function this node marks as decreased.
  - reference: PMID:21139041
    reference_title: "Novel GLIS3 mutations demonstrate an extended multisystem phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results confirm partial gene deletions as the most common type of GLIS3 mutations, accounting for four of five families identified to date."
    explanation: Establishes gene deletion as the predominant loss-of-function allele class.
  downstream:
  - target: Impaired Endocrine Pancreas Differentiation
    description: >-
      Without GLIS3, neurogenin 3 is not transactivated in the fetal pancreas and
      endocrine lineage specification fails.
  - target: Reduced Insulin Gene Transcription
    description: GLIS3 directly activates the insulin promoter in beta cells.
  - target: Impaired TSH-Dependent Thyroid Hormone Biosynthesis
    description: >-
      GLIS3 is required downstream of TSHR for expression of thyroid hormone
      biosynthesis genes.
  - target: Renal Cystogenesis
    description: Loss of cilium-associated GLIS3 signalling in the kidney leads to cyst formation.
  - target: Abnormal Intrahepatic Bile Duct Development
    description: GLIS3 deficiency disturbs bile duct development in the liver.
  - target: Impaired Pancreatic Ductal and Acinar Function
    description: GLIS3 is also expressed in pancreatic acini and ducts.
  - target: Impaired Ocular Development
    description: Loss of the eye-specific GLIS3 transcript is associated with congenital glaucoma.
  - target: Impaired Osteoblast Differentiation
    description: GLIS3 promotes osteoblast differentiation.
- name: Impaired Endocrine Pancreas Differentiation
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    GLIS3 binds GLIS3 response elements in the Neurog3 promoter and activates it
    directly and together with HNF6 and FOXA2. In Glis3-null mouse embryos Ngn3
    expression falls by more than 90% and insulin is nearly absent, so the fetal
    islet endocrine lineage, beta cells in particular, is not generated. The
    human evidence is genetic and clinical; the step-level mechanism comes from
    mouse and cell models.
  biological_processes:
  - preferred_term: endocrine pancreas development
    term:
      id: GO:0031018
      label: endocrine pancreas development
    modifier: DECREASED
  - preferred_term: type B pancreatic cell differentiation
    term:
      id: GO:0003309
      label: type B pancreatic cell differentiation
    modifier: DECREASED
  cell_types:
  - preferred_term: pancreatic endocrine cell
    term:
      id: CL:0008024
      label: pancreatic endocrine cell
  locations:

    snippet: "Patients were initially treated with insulin at 0.4 to 2.0 U/kg/24 h (patient 4 required 2.0 U/kg/24 h), demonstrating a range of insulin sensitivities."
    explanation: All patients in the series were insulin treated, with widely varying doses.
  - reference: PMID:34093443
    reference_title: "Case Report: Neonatal Diabetes Mellitus Caused by a Novel GLIS3 Mutation in Twins."

- name: Impaired Pancreatic Ductal and Acinar Function
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    GLIS3 is expressed at lower levels in pancreatic acini and in ductal cells as
    well as in beta cells. Some patients have exocrine pancreatic insufficiency
    with low faecal elastase and pancreatic cysts, which the case-series authors
    attribute to a role of GLIS3 in pancreatic duct development and
    maintenance. This is an inference from expression and phenotype, not a
    demonstrated mechanism.
  locations:
  - preferred_term: pancreas
    term:
      id: UBERON:0001264
      label: pancreas
  evidence:
  - reference: PMID:26259131
    reference_title: "Expanding the Clinical Spectrum Associated With GLIS3 Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of exocrine pancreatic dysfunction in patients 2, 3a, 3b, and 7 in our series suggests that exocrine pancreatic involvement may be more extensive than previously described (8)."
    explanation: >-
      Documents exocrine involvement in patients and proposes it as a primary
      GLIS3 effect rather than a secondary one.
  - reference: PMID:26259131
    reference_title: "Expanding the Clinical Spectrum Associated With GLIS3 Mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The presence of pancreatic cystic changes in patients 3a and 3b supports the previous observations that GLIS3 is important in the development and maintenance of pancreatic ducts (15)."
    explanation: Links the pancreatic cysts seen in patients to a ductal role of GLIS3.
  downstream:
  - target: Exocrine Pancreatic Insufficiency
    description: Reduced acinar enzyme output causes malabsorption.
  - target: Pancreatic Cysts
    description: Abnormal ductal development produces pancreatic cysts.
- name: Impaired Ocular Development
  biological_scale: TISSUE
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Congenital glaucoma occurs in roughly a third of patients. The original
    genotype-phenotype analysis linked glaucoma to loss of an eye-specific GLIS3
    transcript, and Glis3 is expressed dynamically in the developing optic
    vesicle, lens and retina in mice, but later series could not tie glaucoma to
    a specific exon. The developmental defect behind the glaucoma is not
    characterised.
  locations:

  - reference: PMID:19273592
    reference_title: "Glis3 is associated with primary cilia and Wwtr1/TAZ and implicated in polycystic kidney disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We demonstrate that Glis3 localizes to the primary cilium, suggesting that Glis3 is part of a cilium-associated signaling pathway."
    explanation: Supports the ciliary localisation that ties GLIS3 to cystic kidney mechanisms.
  - reference: PMID:12966531

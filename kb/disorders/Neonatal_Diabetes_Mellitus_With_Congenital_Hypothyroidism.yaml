    evidence_source: HUMAN_CLINICAL
    snippet: "The renal disease was characterized by large kidneys and multiple small cysts with deficient corticomedullary junction differentiation and normal kidney function."
    explanation: Describes the human renal lesion in the index family.
  downstream:
  - target: Cystic Renal Dysplasia
    description: Cyst formation in developing kidneys produces cystic dysplasia.
  - target: Enlarged Kidneys
    description: Multiple cysts enlarge the kidneys.
- name: Abnormal Intrahepatic Bile Duct Development
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Liver disease in NDH presents as neonatal cholestasis and progresses in some
    patients to hepatic fibrosis and biliary cirrhosis, occasionally requiring
    liver transplantation. Explant histology shows bile duct paucity and a
    predominantly biliary cirrhosis, pointing to abnormal bile duct development
    as the lesion. Shorter GLIS3 transcripts are expressed in the liver, and the
    variable hepatic phenotype has been attributed to differential transcript
    loss. The cellular mechanism has not been worked out.
  biological_processes:

name: Neonatal Diabetes Mellitus With Congenital Hypothyroidism
creation_date: "2026-09-24T16:19:44Z"
category: Mendelian
description: >-
  Neonatal diabetes and congenital hypothyroidism (NDH) syndrome is a rare
  autosomal recessive multisystem disorder caused by biallelic loss-of-function
  variants in GLIS3, which encodes GLI-similar 3, a Kruppel-like zinc finger
  transcription factor with five C2H2 zinc fingers and a C-terminal
  transactivation domain. It was first described in 2003 in two Saudi siblings
  with permanent non-autoimmune neonatal diabetes, severe congenital
  hypothyroidism, congenital glaucoma, cholestasis progressing to hepatic
  fibrosis, polycystic kidneys, intrauterine growth restriction and minor facial
  anomalies, and GLIS3 was identified as the causal gene in 2006. Partial gene
  deletions are the most frequent variant class; frameshift, nonsense and
  zinc-finger missense variants also occur, in homozygous or compound
  heterozygous form.

  Permanent neonatal diabetes is the one constant feature. GLIS3 acts upstream of
  neurogenin 3 in the fetal pancreas to drive endocrine differentiation and later
  binds the insulin promoter directly, so its loss produces insulin deficiency
  from birth. In the thyroid GLIS3 acts downstream of TSH/TSHR and is needed for
  expression of thyroid hormone biosynthesis genes, which explains a
  dyshormonogenic hypothyroidism with elevated TSH and thyroglobulin that is
  often resistant to conventional levothyroxine doses, although thyroid
  morphology ranges from normal to athyreosis. Renal cystic dysplasia, liver
  disease ranging from cholestasis with bile duct paucity to biliary cirrhosis,
  congenital glaucoma, exocrine pancreatic insufficiency, osteopenia,
  sensorineural deafness, developmental delay and a recognisable facial gestalt
  are variable. Early reports described death in infancy, but survival into
  adolescence and adulthood is now documented. Management is insulin (often by
  pump), levothyroxine, pancreatic enzyme replacement when needed, and
  organ-specific care including glaucoma surgery and, for end-stage liver
  disease, liver transplantation.

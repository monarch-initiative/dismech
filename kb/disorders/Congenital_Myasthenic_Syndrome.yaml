    term:
      id: GO:0014055
      label: acetylcholine secretion, neurotransmission
    modifier: DECREASED
  - preferred_term: Calcium-ion regulated exocytosis of synaptic vesicles
    term:
      id: GO:0017156
      label: calcium-ion regulated exocytosis
    modifier: DECREASED

      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  description: >-
    Endplate acetylcholinesterase deficiency caused by biallelic COLQ
    variants. ColQ is the triple-helical collagenic tail that anchors the
    asymmetric forms of acetylcholinesterase at the neuromuscular junction, so
    its loss leaves acetylcholine in the cleft for a prolonged period and a
    single nerve stimulus elicits a repetitive CMAP. Cholinesterase inhibitors
    are contraindicated because of severe adverse effects including
    respiratory arrest in some patients; ephedrine and salbutamol are
    effective in some patients.
  evidence:
  - reference: PMID:36835142
    reference_title: "Clinical and Pathologic Features of Congenital Myasthenic Syndromes Caused by 35 Genes-A Comprehensive Review."

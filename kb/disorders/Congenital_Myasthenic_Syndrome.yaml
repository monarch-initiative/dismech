- name: Defective SNARE-Mediated Synaptic Vesicle Fusion
  conforms_to: "neuromuscular_transmission_failure#Reduced Quantal Acetylcholine Release"
  description: >-
    Calcium entering the motor nerve terminal through the P/Q-type calcium
    channel binds the two C2B domains of synaptotagmin-2 and triggers assembly
    of the SNARE complex - SNAP25, syntaxin and the vesicle SNARE
    synaptobrevin-1 (VAMP1) - which fuses acetylcholine-laden synaptic
    vesicles with the presynaptic membrane. Variants in SYT2 or VAMP1 break
    that calcium-to-fusion coupling, so fewer quanta are released per nerve
    impulse. The result is a Lambert-Eaton-like electrophysiology, with a
    decrement on low-frequency repetitive nerve stimulation and an increment
    at high frequency, which is why amifampridine, which enhances calcium
    entry into the nerve terminal, is effective in this group. This node is
    distinct from the upstream acetylcholine synthesis and vesicle-loading
    defects: here the vesicles are filled, but they do not fuse on cue.
  cell_types:
  - preferred_term: Motor neuron presynaptic terminal
    term:
      id: CL:0000100
      label: motor neuron
  biological_processes:

  review_notes: >-
    SCN4A-CMS (CMS16, MONDO:0013620) is a further postsynaptic MONDO term, for
    a sarcolemmal sodium-channel rather than an AChR-pathway defect. Nothing in
    kb/ carries MONDO:0013620 or the string CMS16, so it is genuinely
    uncurated; SCN4A itself is bound in other entries, for other SCN4A
    diseases. MONDO also files CMS8 (AGRN) under its presynaptic
    class as well as here, which is defensible: agrin is released from the
    nerve terminal even though it acts on the postsynaptic LRP4-MuSK complex.
  description: >-
    Defects of the postsynaptic membrane — by far the largest group. Includes
    primary AChR deficiency and AChR kinetic abnormalities (slow-channel and
    fast-channel syndromes) from variants in the AChR subunit genes (CHRNE,
    CHRNA1, CHRNB1, CHRND, CHRNG), and defects of endplate development /
    maintenance and AChR clustering (RAPSN, DOK7, MUSK, AGRN, LRP4). CHRNE
    low-expressor variants and DOK7 are among the most common CMS genotypes
    overall. Slow-channel CMS (SCCMS) is the principal autosomal dominant form.
  evidence:
  - reference: PMID:38696726
    reference_title: "Congenital myasthenic syndromes in adults: clinical features, diagnosis and long-term prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CHRNE-low expressor variants were the most common (23.8%), followed by variants in DOK7 (18.7%) and RAPSN (14%)."
    explanation: Quantifies the dominant postsynaptic genotypes (CHRNE, DOK7, RAPSN) in a 235-patient adult cohort.
- name: Glycosylation
  display_name: Glycosylation-Related CMS
  classification: nmj_compartment
  children:
  - CMS12
  - CMS13
  review_notes: >-
    Deliberately left without a subtype_term. MONDO's grouping class for this
    set, MONDO:0018144 "congenital myasthenic syndromes with glycosylation
    defect", is obsolete; a synonym-inclusive MONDO search ("t~glycosylation
    defect") returns it and the three member terms CMS12, CMS13 and CMS14, but
    no live grouping class. The other three glycosylation CMS genes are
    curated elsewhere rather than here: ALG2-CMS (CMS14, MONDO:0014543) is a
    has_subtypes row of
    kb/disorders/ALG2-Congenital_Disorder_of_Glycosylation.yaml, a lump/split
    call that entry's own notes argue explicitly; ALG14-CMS (CMS15,
    MONDO:0014542) has its own Disease entry at
    kb/disorders/Congenital_Myasthenic_Syndrome_15.yaml; and GMPPB-CMS has no
    numbered CMS designation and no term among the 37 is_a descendants of
    MONDO:0018940, so it is recorded only in genetic: and on this row.
    MONDO:0700084 "myopathy caused by variation in GMPPB" exists but is a
    myopathy class, not a congenital myasthenic syndrome one.
  description: >-
    Defects in the N-linked protein glycosylation pathway (GFPT1, DPAGT1, ALG2,
    ALG14, GMPPB) that impair glycosylation of multiple NMJ glycoproteins,
    including the AChR, producing a "combination" endplate defect. These
    typically present as a limb-girdle CMS, often with tubular aggregates on
    muscle biopsy and elevated creatine kinase, and respond to cholinesterase
    inhibitors. Glycosylation genes are an increasingly recognized cause,
    accounting for over 20% of cases in some cohorts.
  evidence:
  - reference: PMID:37721175
    reference_title: "Clinical and genetic characterisation of a large Indian congenital myasthenic syndrome cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "postsynaptic defects were most common (62.4%), followed by glycosylation defects (21.3%), synaptic basal lamina genes (4.3%) and presynaptic defects (2.8%)."
    explanation: Quantifies the relative frequency of the four mechanistic subtype groups in a 156-patient Indian cohort.
- name: CMS1A
  display_name: CHRNA1-related congenital myasthenic syndrome (CMS1A)
  classification: gene_defined
  subtype_term:
    preferred_term: congenital myasthenic syndrome 1A
    term:

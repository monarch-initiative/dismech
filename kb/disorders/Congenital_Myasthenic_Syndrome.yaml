- name: Presynaptic Acetylcholine Handling Defect
  conforms_to: "neuromuscular_transmission_failure#Reduced Quantal Acetylcholine Release"
  description: >-
    The acetylcholine-handling arm of presynaptic CMS: the lesion lies in the
    supply of transmitter rather than in the release machinery. Choline
    acetyltransferase (CHAT) synthesizes ACh, the high-affinity choline
    transporter (SLC5A7) recovers choline into the terminal, the vesicular ACh
    transporter (SLC18A3) loads it into synaptic vesicles, and PREPL is
    required for those vesicles to be refilled. A defect at any of these steps
    lowers the quantal content of ACh release and so the endplate potential.
    In this group a decrement on low-frequency stimulation is elicited at rest
    in some patients, but only after exercise or high-frequency stimulation in
    the others. The downstream fusion step is modeled separately in Defective
    SNARE-Mediated Synaptic Vesicle Fusion, and terminal development in
    Defective Motor Nerve Terminal Formation.
  cell_types:
  - preferred_term: Motor neuron presynaptic terminal
    term:
      id: CL:0000100
      label: motor neuron
  biological_processes:
  - preferred_term: Acetylcholine biosynthetic process
    term:
      id: GO:0008292
      label: acetylcholine biosynthetic process
    modifier: DECREASED

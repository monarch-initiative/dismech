    term:
      id: hgnc:1912
      label: CHAT
  - preferred_term: SLC5A7
    term:
      id: hgnc:14025
      label: SLC5A7
  - preferred_term: SLC18A3
    term:
      id: hgnc:10936
      label: SLC18A3
  - preferred_term: PREPL

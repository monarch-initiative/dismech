      label: CHRNA1
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  description: >-
    Slow-channel CMS (SCCMS) caused by a heterozygous missense variant in
    CHRNA1, the AChR alpha-1 subunit. Slow-channel variants abnormally prolong
    the AChR channel opening time, so the resting membrane potential
    depolarizes, AChRs desensitize, and excessive calcium influx produces an
    endplate myopathy. Cholinesterase inhibitors are mostly ineffective,
    whereas quinidine and fluoxetine ameliorate the slow-channel phenotype.
  evidence:
  - reference: PMID:36835142
    reference_title: "Clinical and Pathologic Features of Congenital Myasthenic Syndromes Caused by 35 Genes-A Comprehensive Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "SCCMS | CHRNA1 | CMS1A | (14) | AD | decrement, repetitive CMAP"
    explanation: >-
      Table 1 of this review assigns CHRNA1 to CMS1A within the SCCMS
      pathomechanistic group, with the inheritance pattern and the low-frequency
      repetitive-nerve-stimulation finding quoted here.

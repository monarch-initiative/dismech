  - CMS23
  - CMS24
  - CMS25
  review_notes: >-
    Two further presynaptic gene-defined subtypes are curated as their own
    Disease entries rather than as children here, because each already carries
    its own pathophysiology nodes and phenotypes: CHAT-CMS (CMS6, MONDO:0009689) in
    kb/disorders/Congenital_Myasthenic_Syndrome_6.yaml, and SYT2-CMS (CMS7,
    MONDO:0014468, which covers both the dominant CMS7A and the recessive
    CMS7B forms) in kb/disorders/Congenital_Myasthenic_Syndrome_7.yaml.
    SNAP25-CMS (CMS18) is likewise not a child here: its MONDO term,
    MONDO:0014590, is the disease_term of
    kb/disorders/SNAP25_Encephalopathy.yaml, because OMIM has retitled
    OMIM:616330 as developmental and epileptic encephalopathy 117 while MONDO's
    label still lags. That entry's own notes record that its presynaptic
    myasthenic arm is deliberately under-curated there.
  description: >-
    Defects in acetylcholine (ACh) synthesis, vesicular packaging, or release at
    the motor nerve terminal. CHAT (choline acetyltransferase) is the commonest
    presynaptic gene; other genes include SLC5A7, SLC18A3, SNAP25, SYT2, VAMP1,
    and UNC13A. Presynaptic CMS comprise roughly 5-10% of all CMS and frequently
    present prenatally/neonatally with a severe phenotype that can include
    arthrogryposis, developmental delay, and episodic/sudden apneic crises
    (classically CHAT-CMS, "CMS with episodic apnea").
  mappings:
    mondo_mappings:
    - term:
        id: MONDO:0009689
        label: congenital myasthenic syndrome 6
      mapping_predicate: skos:narrowMatch
      mapping_source: MONDO
      mapping_justification: >-
        MONDO:0009689 (congenital myasthenic syndrome 6) is defined in MONDO
        as CMS caused specifically by CHAT mutations and is_a
        MONDO:0700466 (presynaptic congenital myasthenic syndrome); it is
        narrower than this Presynaptic subtype, which also covers SLC5A7-,
        SLC18A3-, SNAP25-, SYT2-, VAMP1-, and UNC13A-related presynaptic CMS.
        CHAT-CMS is modeled here as the commonest presynaptic gene, with a
        dedicated CHAT genetic entry below, and is curated in full as
        Congenital_Myasthenic_Syndrome_6.yaml.
  evidence:
  - reference: PMID:37212067
    reference_title: "Presynaptic Congenital Myasthenic Syndromes: Understanding Clinical Phenotypes through In vivo Models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They can result from a dysfunction in acetylcholine (ACh) synthesis or recycling, in its packaging into synaptic vesicles, or its subsequent release into the synaptic cleft."
    explanation: Defines the presynaptic CMS mechanistic group by the affected step of ACh handling.
  - reference: PMID:37212067
    reference_title: "Presynaptic Congenital Myasthenic Syndromes: Understanding Clinical Phenotypes through In vivo Models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Presynaptic CMS usually presents during the prenatal or neonatal period, with a severe phenotype including congenital arthrogryposis, developmental delay, and apnoeic crisis."
    explanation: Establishes the severe prenatal/neonatal presentation typical of presynaptic CMS.
- name: Synaptic
  display_name: Synaptic (Basal-Lamina) CMS
  classification: nmj_compartment
  children:
  - CMS5
  - CMS19
  review_notes: >-
    Deliberately left without a subtype_term. MONDO's synaptic-CMS grouping
    class, MONDO:0020346 "synaptic congenital myasthenic syndrome", is
    obsolete. A synonym-inclusive MONDO search (runoak search "t~synaptic
    congenital myasthenic") surfaces that class and no other synaptic grouping
    class, and no synaptic grouping class appears among the 37 is_a
    descendants of MONDO:0018940 either, where the live presynaptic
    (MONDO:0700466) and postsynaptic (MONDO:0020344) classes both do. No live
    MONDO term therefore denotes this group. MONDO classifies CMS19
    (COL13A1) under both its presynaptic and its postsynaptic classes; it is
    placed here instead, following PMID:36835142, whose Table 1 files COL13A1
    with COLQ and LAMB2 as synaptic CMS.
  description: >-
    Defects in proteins of the synaptic basal lamina. The prototype is COLQ-CMS:
    COLQ encodes the collagen-like tail subunit that anchors acetylcholinesterase
    (AChE) in the synaptic cleft, so biallelic loss produces endplate AChE
    deficiency with prolonged ACh action. Other synaptic-cleft genes include
    LAMB2, LAMA5, and COL13A1. Synaptic CMS characteristically does NOT respond
    to (and may worsen with) cholinesterase inhibitors, but responds to ephedrine
    and salbutamol.
  evidence:
  - reference: PMID:38475910
    reference_title: "COLQ-Congenital myasthenic syndrome in an Iranian cohort: the clinical and genetics spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the collagen-like tail subunit gene (COLQ) of acetylcholinesterase are responsible for recessive forms of synaptic congenital myasthenic syndromes with end plate acetylcholinesterase deficiency."
    explanation: Defines COLQ-CMS as the synaptic basal-lamina subtype with endplate AChE deficiency.

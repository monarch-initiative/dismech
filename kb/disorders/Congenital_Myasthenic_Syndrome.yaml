  notes: >-
    SYT2 encodes synaptotagmin-2, the fast calcium sensor that couples the
    presynaptic calcium transient to SNARE-mediated vesicle fusion.
    Hemiallelic and biallelic variants cause CMS7A and CMS7B respectively,
    which are curated as their own Disease entry
    (kb/disorders/Congenital_Myasthenic_Syndrome_7.yaml, MONDO:0014468); SYT2

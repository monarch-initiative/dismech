      and the safety factor of neuromuscular transmission.
- name: Defective Motor Nerve Terminal Formation
  description: >-
    A distinct presynaptic lesion in which the nerve terminal itself is built
    wrongly, rather than the acetylcholine cycle or the fusion machinery
    failing within an otherwise normal terminal. MYO9A, an unconventional
    myosin with a Rho GTPase-activating domain, regulates intracellular
    transport in peripheral nerve; SLC25A1 is a mitochondrial inner-membrane
    transporter. Knockdown of either in zebrafish disturbs the elongation and
    branching of spinal motor axons and compromises neuromuscular junction
    formation, so the myasthenia in CMS23 and CMS24 is attributed to defective
    nerve terminal development. Cholinesterase inhibitors are effective in
    MYO9A-CMS, whereas both cholinesterase inhibitors and amifampridine are
    generally ineffective in SLC25A1-CMS.
  cell_types:
  - preferred_term: Motor neuron presynaptic terminal
    term:
      id: CL:0000100

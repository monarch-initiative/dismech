    quote_role: REVIEW_SYNTHESIS
    snippet: "Synaptotagmin 2 (SYT2) senses Ca2+ ions entering into the nerve terminal through P/Q-type calcium channel and triggers the formation of the SNARE complex that releases ACh in synaptic vesicles to the synaptic space"
    explanation: >-
      States the presynaptic calcium-sensing and SNARE-triggering step that SYT2

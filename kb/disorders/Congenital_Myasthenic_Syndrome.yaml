- name: Endplate Collagen XIII Deficiency
  description: >-
    Collagen XIII is a single-pass transmembrane collagen enriched at the
    neuromuscular junction that is required for the maturation and maintenance
    of endplate acetylcholine receptors. Biallelic COL13A1 variants reduce
    AChR clustering, and Col13a1-deficient mice form the junction abnormally.
    The mechanism therefore sits in the synaptic compartment alongside the
    COLQ lesion but is not an acetylcholinesterase-anchoring defect, which is
    why the two synaptic subtypes differ in their drug response:
    cholinesterase inhibitors are contraindicated in COLQ-CMS and merely
    ineffective in COL13A1-CMS, while salbutamol is reported to help in both.
  cell_types:
  - preferred_term: Skeletal muscle fiber endplate
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:

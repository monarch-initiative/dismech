    VAMP1 encodes synaptobrevin-1, the vesicle SNARE. Biallelic
    loss-of-function variants cause CMS25, a Lambert-Eaton-like CMS in which
    low-frequency repetitive nerve stimulation gives a decrement and
    high-frequency stimulation an increment.

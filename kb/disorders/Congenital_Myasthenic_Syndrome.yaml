genetic:
- name: CHRNE
  gene_term:
    preferred_term: CHRNE
    term:
      id: hgnc:1966
      label: CHRNE
  association: Causal
  subtype: CMS4
  notes: >-
    CHRNE encodes the epsilon subunit of the adult muscle acetylcholine
    receptor. Recessive low-expressor and null variants cause primary AChR
    deficiency (the most common CMS genotype in several cohorts); other CHRNE
    variants cause slow- or fast-channel kinetic CMS.
  evidence:
  - reference: PMID:37721175
    reference_title: "Clinical and genetic characterisation of a large Indian congenital myasthenic syndrome cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the individual CMS genes, the most commonly affected gene was CHRNE (39.4%)"
    explanation: CHRNE was the single most common CMS gene in the Indian cohort.
- name: DOK7
  gene_term:
    preferred_term: DOK7
    term:
      id: hgnc:26594
      label: DOK7
  association: Causal
  subtype: CMS10
  notes: >-
    DOK7 is a cytoplasmic adaptor required for MuSK activation and AChR
    clustering. Recessive variants cause a postsynaptic limb-girdle CMS;
    c.1124_1127dupTGCC is a recurrent variant. DOK7-CMS responds to salbutamol
    but typically not to cholinesterase inhibitors.
  evidence:
  - reference: PMID:38696726
    reference_title: "Congenital myasthenic syndromes in adults: clinical features, diagnosis and long-term prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "followed by variants in DOK7 (18.7%) and RAPSN (14%)"
    explanation: DOK7 is the second most common CMS genotype in the French adult cohort.
  - reference: PMID:38907197
    reference_title: "DOK7 congenital myasthenic syndrome: case series and review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "c.1124_1127dupTGCC is the most common variant; three patients had this variant."
    explanation: Identifies the recurrent DOK7 frameshift variant.
- name: RAPSN
  gene_term:
    preferred_term: RAPSN
    term:
      id: hgnc:9863
      label: RAPSN
  association: Causal
  subtype: CMS11
  notes: >-
    RAPSN encodes rapsyn, which clusters AChR at the endplate. Recessive
    variants cause a postsynaptic CMS often severe in early childhood that
    subsequently improves; responsive to cholinesterase inhibitors.
  evidence:
  - reference: PMID:38696726
    reference_title: "Congenital myasthenic syndromes in adults: clinical features, diagnosis and long-term prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RAPSN patients, often severely affected in early childhood, subsequently improved."
    explanation: Describes the characteristic RAPSN-CMS natural history.
- name: COLQ
  gene_term:
    preferred_term: COLQ
    term:
      id: hgnc:2226
      label: COLQ
  association: Causal
  subtype: CMS5
  notes: >-
    COLQ encodes the collagen-like tail subunit that anchors acetylcholinesterase
    in the synaptic basal lamina. Biallelic loss causes synaptic CMS with
    endplate AChE deficiency.
  evidence:
  - reference: PMID:38475910
    reference_title: "COLQ-Congenital myasthenic syndrome in an Iranian cohort: the clinical and genetics spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in the collagen-like tail subunit gene (COLQ) of acetylcholinesterase are responsible for recessive forms of synaptic congenital myasthenic syndromes with end plate acetylcholinesterase deficiency."
    explanation: COLQ is the prototypical synaptic basal-lamina CMS gene.
- name: CHAT
  gene_term:
    preferred_term: CHAT
    term:
      id: hgnc:1912
      label: CHAT
  association: Causal
  subtype: Presynaptic
  notes: >-
    CHAT encodes choline acetyltransferase, the enzyme that synthesizes ACh.
    It is the commonest presynaptic CMS gene and the classic cause of CMS with
    episodic apnea (sudden, sometimes fatal, apneic crises in infancy).
  evidence:
  - reference: PMID:37212067
    reference_title: "Presynaptic Congenital Myasthenic Syndromes: Understanding Clinical Phenotypes through In vivo Models."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They can result from a dysfunction in acetylcholine (ACh) synthesis or recycling"
    explanation: CHAT-mediated ACh synthesis defect underlies the commonest presynaptic CMS.
- name: MUSK
  gene_term:
    preferred_term: MUSK
    term:
      id: hgnc:7525
      label: MUSK
  association: Causal
  subtype: CMS9
  notes: >-
    MUSK encodes the muscle-specific receptor tyrosine kinase, the central hub of
    agrin-LRP4-MuSK-DOK7-rapsyn signaling that drives AChR clustering. MUSK-CMS
    has a variable phenotype and a notably high rate of ICU admission.
  evidence:
  - reference: PMID:38696726
    reference_title: "Congenital myasthenic syndromes in adults: clinical features, diagnosis and long-term prognosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RAPSN (54.8%), MUSK (50%), DOK7 (38.6%) and AGRN (25.0%)"
    explanation: MUSK-CMS had one of the highest ICU-admission rates in the French cohort.
- name: GFPT1
  gene_term:
    preferred_term: GFPT1
    term:
      id: hgnc:4241
      label: GFPT1
  association: Causal
  subtype: CMS12
  notes: >-
    GFPT1 controls the rate-limiting step of the hexosamine pathway feeding
    N-glycosylation. Recessive variants cause a limb-girdle glycosylation CMS,
    often with tubular aggregates on muscle biopsy.
  evidence:
  - reference: PMID:37721175
    reference_title: "Clinical and genetic characterisation of a large Indian congenital myasthenic syndrome cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DOK7 (14.4%), DPAGT1 (9.8%), GFPT1 (7.6%), MUSK (6.1%), GMPPB (5.3%)"
    explanation: GFPT1 is a recurrent glycosylation-pathway CMS gene in the Indian cohort.
- name: DPAGT1
  gene_term:
    preferred_term: DPAGT1
    term:
      id: hgnc:2995
      label: DPAGT1
  association: Causal
  subtype: CMS13
  notes: >-
    DPAGT1 catalyzes the first committed step of N-linked glycosylation.
    Recessive variants cause a limb-girdle glycosylation CMS; p.T380I is a
    suspected founder allele in the Indian subcontinent.
  evidence:
  - reference: PMID:37721175
    reference_title: "Clinical and genetic characterisation of a large Indian congenital myasthenic syndrome cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DPAGT1 p.T380I and DES c.1023+5G>A, for which founder haplotypes are suspected."
    explanation: Identifies a suspected DPAGT1 founder variant in this population.
- name: CHRNA1
  gene_term:
    preferred_term: CHRNA1
    term:
      id: hgnc:1955
      label: CHRNA1
  association: Causal
  subtype: Postsynaptic
  notes: >-
    CHRNA1 encodes the alpha subunit of the muscle AChR. Variants cause
    postsynaptic CMS (including slow- and fast-channel kinetic forms); the most
    severe loss-of-function alleles cause the separately curated prenatal-lethal
    CHRNA1 fetal akinesia disorder.
- name: CHRNB1
  gene_term:
    preferred_term: CHRNB1
    term:
      id: hgnc:1961
      label: CHRNB1
  association: Causal
  subtype: Postsynaptic
  notes: >-
    CHRNB1 encodes the beta subunit of the muscle AChR; variants cause
    postsynaptic kinetic/deficiency CMS.
- name: CHRND
  gene_term:
    preferred_term: CHRND
    term:
      id: hgnc:1965
      label: CHRND
  association: Causal
  subtype: Postsynaptic
  notes: >-
    CHRND encodes the delta subunit of the muscle AChR; variants cause
    postsynaptic kinetic/deficiency CMS, often with prominent ocular involvement.
- name: AGRN
  gene_term:
    preferred_term: AGRN
    term:
      id: hgnc:329
      label: AGRN
  association: Causal
  subtype: CMS8
  notes: >-
    AGRN encodes agrin, the motor-neuron-derived proteoglycan that activates the
    LRP4-MuSK-DOK7-rapsyn clustering pathway. Recessive variants cause a
    postsynaptic CMS with a variable phenotype.
- name: LRP4
  gene_term:
    preferred_term: LRP4
    term:
      id: hgnc:6696
      label: LRP4
  association: Causal
  subtype: CMS17
  notes: >-
    LRP4 is the agrin co-receptor that activates MuSK. Recessive variants are a
    rare cause of postsynaptic CMS via impaired AChR clustering.
- name: GMPPB
  gene_term:
    preferred_term: GMPPB
    term:
      id: hgnc:22932
      label: GMPPB
  association: Causal
  subtype: Glycosylation
  notes: >-
    GMPPB supplies GDP-mannose for glycosylation. Variants cause a glycosylation
    CMS that overlaps with limb-girdle muscular dystrophy (a "myasthenic-myopathic"
    presentation, frequently with elevated CK).
  evidence:
  - reference: PMID:37721175
    reference_title: "Clinical and genetic characterisation of a large Indian congenital myasthenic syndrome cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Myopathy and muscular dystrophy genes such as GMPPB and DES, presenting as gradually progressive limb girdle CMS, expand the phenotypic spectrum."
    explanation: Documents the limb-girdle myopathic GMPPB-CMS presentation.
- name: COL13A1
  gene_term:
    preferred_term: COL13A1
    term:
      id: hgnc:2190
      label: COL13A1
  association: Causal
  subtype: CMS19
  notes: >-
    COL13A1 encodes a single-pass transmembrane collagen enriched at the
    neuromuscular junction that is required for the maturation and maintenance
    of endplate acetylcholine receptors. Biallelic variants cause CMS19, a
    synaptic-compartment CMS in which cholinesterase inhibitors are
    ineffective but salbutamol and amifampridine help.
  evidence:
  - reference: PMID:36835142
    reference_title: "Clinical and Pathologic Features of Congenital Myasthenic Syndromes Caused by 35 Genes-A Comprehensive Review."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "Introduction of the pathogenic variants into C2C12 myotubes reduced AChR clustering"
    explanation: >-
      Shows that the reported COL13A1 variants impair AChR clustering in a
      myotube model.
  - reference: PMID:36835142
    reference_title: "Clinical and Pathologic Features of Congenital Myasthenic Syndromes Caused by 35 Genes-A Comprehensive Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "All patients developed respiratory distress and weak sucking at birth"
    explanation: >-
      Describes the uniform neonatal presentation of COL13A1-CMS.
- name: SLC5A7
  gene_term:
    preferred_term: SLC5A7
    term:
      id: hgnc:14025
      label: SLC5A7
  association: Causal
  subtype: CMS20
  notes: >-
    SLC5A7 encodes the high-affinity choline transporter that takes choline
    back up into the motor nerve terminal for acetylcholine resynthesis.
    Biallelic loss-of-function variants cause CMS20 with neonatal episodic
    apnea; hemiallelic frameshifting variants of the same gene instead cause
    autosomal dominant distal hereditary motor neuropathy type VIIA.
  evidence:
  - reference: PMID:36835142
    reference_title: "Clinical and Pathologic Features of Congenital Myasthenic Syndromes Caused by 35 Genes-A Comprehensive Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "High affinity choline transporter (ChT, SLC5A7) expressed at the nerve terminal membrane uptakes choline to the nerve terminal"
    explanation: >-
      States the presynaptic transport step that SLC5A7 carries out.
  - reference: PMID:36835142
    reference_title: "Clinical and Pathologic Features of Congenital Myasthenic Syndromes Caused by 35 Genes-A Comprehensive Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Later, recessive pathogenic variants of SLC5A7 were reported to cause CMS"
    explanation: >-
      Establishes recessive SLC5A7 variants as a cause of CMS.
- name: SLC18A3
  gene_term:
    preferred_term: SLC18A3
    term:
      id: hgnc:10936
      label: SLC18A3
  association: Causal
  subtype: CMS21
  notes: >-
    SLC18A3 encodes the vesicular acetylcholine transporter, which loads newly
    synthesized acetylcholine into synaptic vesicles, and is encoded within
    the first intron of CHAT. Biallelic variants cause CMS21, presenting with
    severe neonatal weakness, arthrogryposis and respiratory distress.
  evidence:
  - reference: PMID:36835142
    reference_title: "Clinical and Pathologic Features of Congenital Myasthenic Syndromes Caused by 35 Genes-A Comprehensive Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Vesicular acetylcholine transporter (vAChT, SLC18A3) transports synthesized ACh to the synaptic vesicle"
    explanation: >-
      States the vesicular loading step that SLC18A3 carries out.
  - reference: PMID:36835142
    reference_title: "Clinical and Pathologic Features of Congenital Myasthenic Syndromes Caused by 35 Genes-A Comprehensive Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Loss-of-function variants of SLC18A3 also cause CMS"
    explanation: >-
      Establishes loss-of-function SLC18A3 variants as a cause of CMS.
- name: PREPL
  gene_term:
    preferred_term: PREPL
    term:
      id: hgnc:30228
      label: PREPL
  association: Causal
  subtype: CMS22
  notes: >-
    PREPL encodes a serine peptidase of unknown physiological substrate whose
    loss impairs refilling of synaptic vesicles with acetylcholine. Biallelic
    loss-of-function variants cause CMS22; because PREPL overlaps SLC3A1 at
    its 3-prime end, a deletion spanning both genes gives hypotonia-cystinuria
    syndrome instead.
  evidence:
  - reference: PMID:36835142
    reference_title: "Clinical and Pathologic Features of Congenital Myasthenic Syndromes Caused by 35 Genes-A Comprehensive Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Loss-of-function variants of PREPL do not cause endplate AChR deficiency, but inhibit refilling of ACh to synaptic vesicles, reduce the number of releasable ACh quanta, and decrease the probability of vesicular release"
    explanation: >-
      States the presynaptic mechanism of PREPL loss and excludes an
      AChR-deficiency mechanism.
  - reference: PMID:36835142
    reference_title: "Clinical and Pathologic Features of Congenital Myasthenic Syndromes Caused by 35 Genes-A Comprehensive Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Ten patients with PREPL-CMS including HCS were initially diagnosed as Prader-Willi syndrome"
    explanation: >-
      Records the characteristic initial misdiagnosis in PREPL-CMS.
- name: SLC25A1
  gene_term:
    preferred_term: SLC25A1
    term:
      id: hgnc:10979
      label: SLC25A1
  association: Causal
  subtype: CMS23
  notes: >-
    SLC25A1 encodes a mitochondrial inner-membrane transporter. Biallelic
    variants cause CMS23, attributed to defective motor nerve terminal
    formation; variants in the same gene also cause combined D-2- and
    L-2-hydroxyglutaric aciduria. Cholinesterase inhibitors and amifampridine
    are generally ineffective.
  evidence:
  - reference: PMID:36835142
    reference_title: "Clinical and Pathologic Features of Congenital Myasthenic Syndromes Caused by 35 Genes-A Comprehensive Review."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "Knockdown of Slc25a1 in zebrafish causes aberration in the axonal elongation of spinal motor neurons and compromise the formation of the NMJ"
    explanation: >-
      Zebrafish knockdown links SLC25A1 loss to defective motor axon and NMJ
      formation.
  - reference: PMID:36835142
    reference_title: "Clinical and Pathologic Features of Congenital Myasthenic Syndromes Caused by 35 Genes-A Comprehensive Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "SLC25A1-CMS is thus predicted to be caused by presynaptic defects"
    explanation: >-
      Assigns SLC25A1-CMS to the presynaptic compartment.
- name: MYO9A
  gene_term:
    preferred_term: MYO9A
    term:
      id: hgnc:7608
      label: MYO9A
  association: Causal
  subtype: CMS24
  notes: >-
    MYO9A encodes an unconventional myosin with a Rho GTPase-activating domain
    that regulates intracellular transport in peripheral nerve. Biallelic
    loss-of-function variants cause CMS24 through defective motor nerve
    terminal formation.
  evidence:
  - reference: PMID:36835142
    reference_title: "Clinical and Pathologic Features of Congenital Myasthenic Syndromes Caused by 35 Genes-A Comprehensive Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Biallelic loss-of-function variants of MYO9A cause CMS"
    explanation: >-
      Establishes biallelic MYO9A loss of function as a cause of CMS.
  - reference: PMID:36835142
    reference_title: "Clinical and Pathologic Features of Congenital Myasthenic Syndromes Caused by 35 Genes-A Comprehensive Review."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "Knockdown of two orthologs, myo9aa/ab, in zebrafish causes shortening and abnormal branching of spinal motor neurons, and defective NMJ signal transmission"
    explanation: >-
      Zebrafish knockdown links MYO9A loss to abnormal motor axons and failed
      NMJ transmission.
- name: VAMP1
  gene_term:
    preferred_term: VAMP1
    term:
      id: hgnc:12642
      label: VAMP1

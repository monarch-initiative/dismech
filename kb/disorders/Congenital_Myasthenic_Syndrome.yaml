notes: >-
  Subtype enumeration and scope (2026-09-20). This umbrella entry now enumerates
  the gene-defined, numbered CMS subtypes as `has_subtypes` rows, each bound to
  its own MONDO term and carrying the causal gene, alongside the four
  pre-existing rows that group them by NMJ compartment. The compartment rows
  carry `children` lists naming their members, so the two schemes coexist
  without duplicating content: the compartment is the mechanistic and
  therapeutic axis, the number is MONDO's and OMIM's gene-defined axis.

  Anchor check. The entry's `disease_term`, MONDO:0018940, was re-verified
  against MONDO before this pass: it is the umbrella class ("Congenital
  myasthenic syndrome (CMS) is a group of genetic disorders of impaired
  neuromuscular transmission at the motor endplate characterized by fatigable
  muscle weakness"), and every numbered subtype enumerated here is among its 37
  is_a descendants. It is not a leaf disease standing in for the family, so no
  re-anchoring was needed.

  What is deliberately NOT a row here. Four gene-defined CMS concepts have their
  own Disease entries and are not duplicated as subtype rows: CHAT-CMS (CMS6,
  MONDO:0009689), SYT2-CMS (CMS7, MONDO:0014468, covering CMS7A and CMS7B),
  ALG14-CMS (CMS15, MONDO:0014542), and the prenatal-lethal CHRNA1 fetal
  akinesia disorder. CHAT and SYT2 are still recorded in `genetic:` so the
  umbrella's gene list is complete. Two more numbered CMS terms are curated
  under a different parent and are cross-referenced from the relevant
  compartment row rather than duplicated here: CMS14 (ALG2, MONDO:0014543) is a
  `has_subtypes` row of
  kb/disorders/ALG2-Congenital_Disorder_of_Glycosylation.yaml, and CMS18
  (SNAP25, MONDO:0014590) is the `disease_term` of
  kb/disorders/SNAP25_Encephalopathy.yaml, whose notes explain MONDO's lagging
  label. Of all the numbered CMS terms, only CMS16 (SCN4A, MONDO:0013620) is
  genuinely absent from this KB: a grep of kb/ finds neither that CURIE nor the
  string CMS16. CMS4A, CMS4B and CMS4C are is_a children of the CMS4 row's own
  term, MONDO:1040021, and are covered by it. GMPPB-CMS has no numbered CMS
  designation and no term among the 37 is_a descendants of MONDO:0018940, so it
  is recorded only in `genetic:` and on the Glycosylation compartment row.

  Observations on MONDO, recorded rather than acted on. (1) MONDO's grouping
  classes for the synaptic and glycosylation compartments, MONDO:0020346 and
  MONDO:0018144, are both obsolete with no live replacement found by a
  synonym-inclusive search, so those two compartment rows are left unbound while
  the presynaptic and postsynaptic rows bind MONDO:0700466 and MONDO:0020344.
  (2) MONDO classifies CMS19 (COL13A1) as both presynaptic and postsynaptic
  CMS; PMID:36835142 Table 1 files COL13A1 as synaptic CMS, and this entry
  follows the review. (3) MONDO:0009689, whose primary label is "congenital
  myasthenic syndrome 6" and whose gene is CHAT, carries the bare synonym
  "CMS1A", which is the primary label of a different term, MONDO:0011088
  (CHRNA1). (4) MONDO:0044299 (CMS22, PREPL) is not filed under MONDO:0700466
  even though PMID:36835142 groups PREPL with CHAT, SLC18A3 and SLC5A7 as
  presynaptic CMS caused by defective recycling of acetylcholine.

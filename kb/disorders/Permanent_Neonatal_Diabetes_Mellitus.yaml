- name: PTF1A
  gene_term:
    preferred_term: PTF1A
    term:
      id: hgnc:23734
      label: PTF1A
  association: Biallelic truncating variants
  relationship_type: CAUSATIVE
  subtype: PNDM-PCAS
  notes: >-
    One of two genes whose biallelic loss removes the beta-cell compartment rather than impairing it: the pancreas does not form. Biallelic PDX1 loss reaches the same endpoint (heterozygous PDX1 is curated as MODY 4 in Maturity-Onset_Diabetes_of_the_Young); what distinguishes PTF1A is that the same transcription factor is also
    required for cerebellar neurogenesis, so the diabetes comes with cerebellar
    agenesis. The committed ClinGen Gene-Disease Validity snapshot
    (data/clingen/gene_validity.csv) carries no PTF1A row for any disease, so
    the attestation here is the positional-cloning report and the MONDO class
    definition.
  evidence:
  - reference: PMID:15543146
    reference_title: "Mutations in PTF1A cause pancreatic and cerebellar agenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Positional cloning identified the mutations 705insG and C886T in the gene
      PTF1A, encoding pancreas transcription factor 1alpha, as disease-causing
      sequence changes.
    explanation: States the gene-disease relationship this record names.
  - reference: PMID:15543146
    reference_title: "Mutations in PTF1A cause pancreatic and cerebellar agenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The essential role of PTF1A in normal cerebellar development was confirmed
      by detailed neuropathological analysis of Ptf1a(-/-) mice.
    explanation: Supports the cerebellar arm of the two-organ mechanism this record describes.

- name: PNDM4
  display_name: diabetes mellitus, permanent neonatal 4 (INS-related)
  subtype_term:
    preferred_term: diabetes mellitus, permanent neonatal 4
    term:
      id: MONDO:0030089
      label: diabetes mellitus, permanent neonatal 4
  classification: molecular
  genes:
  - preferred_term: INS
    term:
      id: hgnc:6081
      label: INS
  description: >-
    Heterozygous INS variants in critical regions of the preproinsulin molecule.
    Unlike the channel subtypes, the defect is in the secreted product rather
    than in the trigger for secreting it. The founding report predicts that the
    variants prevent normal folding of proinsulin, and proposes that the
    misfolded molecule drives endoplasmic reticulum stress and beta-cell death.
  evidence:
  - reference: PMID:17855560
    reference_title: "Insulin gene mutations as a cause of permanent neonatal diabetes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report 10 heterozygous mutations in the human insulin gene in 16
      probands with neonatal diabetes.
    explanation: States the gene-disease relationship and inheritance this subtype names.
  - reference: CGGV:assertion_c5224322-637e-40a8-89eb-d44e01536f25-2020-05-13T160000.000Z
    reference_title: "INS / monogenic diabetes (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "INS | HGNC:6081 | monogenic diabetes | MONDO:0015967 | AD | Definitive"
    explanation: >-
      ClinGen curates INS against a lumped monogenic diabetes entity rather than
      against this subtype, and grades the dominant relationship definitive.
- name: PNDM-PCAS
  display_name: permanent neonatal diabetes mellitus-pancreatic and cerebellar agenesis syndrome (PTF1A-related)
  subtype_term:
    preferred_term: permanent neonatal diabetes mellitus-pancreatic and cerebellar agenesis syndrome
    term:
      id: MONDO:0012192
      label: permanent neonatal diabetes mellitus-pancreatic and cerebellar agenesis syndrome
  classification: molecular
  genes:
  - preferred_term: PTF1A
    term:
      id: hgnc:23734
      label: PTF1A
  description: >-
    Biallelic PTF1A variants. The defect is developmental rather than functional:
    MONDO characterises the syndrome as neonatal diabetes with cerebellar and/or
    pancreatic agenesis, and the founding report places PTF1A in both mammalian
    pancreatic development and cerebellar neurogenesis, which is why one gene
    accounts for both organs.
  evidence:
  - reference: PMID:15543146
    reference_title: "Mutations in PTF1A cause pancreatic and cerebellar agenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Positional cloning identified the mutations 705insG and C886T in the gene
      PTF1A, encoding pancreas transcription factor 1alpha, as disease-causing
      sequence changes.
    explanation: States the gene-disease relationship this subtype names.
  - reference: PMID:15543146
    reference_title: "Mutations in PTF1A cause pancreatic and cerebellar agenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      PTF1A is known to have a role in mammalian pancreatic development, and the
      clinical phenotype of the affected individuals implicated the protein as a
      key regulator of cerebellar neurogenesis.
    explanation: Supports the developmental, two-organ mechanism this subtype's description states.
- name: EIF2B1-NDM
  display_name: EIF2B1-related permanent neonatal diabetes with transient liver dysfunction
  subtype_term:
    preferred_term: EIF2B1-related permanent neonatal diabetes with transient liver dysfunction
    term:
      id: MONDO:1060246
      label: EIF2B1-related permanent neonatal diabetes with transient liver dysfunction
  classification: molecular
  genes:
  - preferred_term: EIF2B1
    term:
      id: hgnc:3257
      label: EIF2B1
  description: >-
    De novo EIF2B1 missense variants, in four of five reported patients
    accompanied by hepatitis-like episodes in childhood. The mechanism the
    founding report proposes is a failure of stress sensing: the variants are
    predicted to render the eIF2B complex insensitive to the eIF2
    phosphorylation that normally triggers the stress response.
  evidence:
  - reference: PMID:31882561
    reference_title: "De Novo Mutations in EIF2B1 Affecting eIF2 Signaling Cause Neonatal/Early-Onset Diabetes and Transient Hepatic Dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results establish de novo EIF2B1 mutations as a novel cause of
      permanent diabetes and liver dysfunction.
    explanation: States the gene-disease relationship this subtype names.
  - reference: PMID:31882561
    reference_title: "De Novo Mutations in EIF2B1 Affecting eIF2 Signaling Cause Neonatal/Early-Onset Diabetes and Transient Hepatic Dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition to having diabetes, four of five patients had hepatitis-like
      episodes in childhood.
    explanation: Supports the transient liver dysfunction this subtype is named for.
  - reference: PMID:31882561
    reference_title: "De Novo Mutations in EIF2B1 Affecting eIF2 Signaling Cause Neonatal/Early-Onset Diabetes and Transient Hepatic Dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We propose that these variants render the eIF2B complex insensitive to
      eIF2 phosphorylation, which occurs under stress conditions and triggers
      expression of stress response genes.
    explanation: States the stress-sensing mechanism this subtype's description attributes to the founding report.

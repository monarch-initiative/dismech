- name: Beta-Cell K-ATP Channel Activation
  description: Activating KCNJ11 (Kir6.2) or ABCC8 (SUR1) variants leave the beta-cell K-ATP channel open
    when intracellular ATP rises, so glucose cannot depolarise the cell and trigger insulin release. Sulfonylureas
    close the channel by an ATP-independent route.

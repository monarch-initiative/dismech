    term:
      id: hgnc:59
      label: ABCC8
  description: >-
    Activating variants in ABCC8, encoding the SUR1 regulatory subunit of the
    same channel PNDM2 disrupts at the pore. The permanent presentation is the
    minority one for this gene; the transient presentation is TNDM2.
  evidence:
  - reference: PMID:16885549
    reference_title: "Activating mutations in the ABCC8 gene in neonatal diabetes mellitus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CONCLUSIONS: Dominant mutations in ABCC8 accounted for 12 percent of cases
      of neonatal diabetes in the study group.
    explanation: States the gene-disease relationship this subtype names.
  - reference: PMID:17389331
    reference_title: "New ABCC8 mutations in relapsing neonatal diabetes and clinical features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SUR1 mutations are more frequent in transient (52%) compared with
      permanent (14%) neonatal diabetes cases screened for ABCC8 in our series.
    explanation: Source for this subtype's description calling the permanent presentation the minority one for ABCC8.
  - reference: CGGV:assertion_33c0dfa5-c6ea-42fd-8118-be6ff97beb3e-2022-07-24T160000.000Z

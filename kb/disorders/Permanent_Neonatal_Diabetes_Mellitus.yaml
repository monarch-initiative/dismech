name: Permanent Neonatal Diabetes Mellitus
creation_date: '2026-11-21T00:00:00Z'
category: Mendelian
description: 'Permanent neonatal diabetes mellitus (PNDM) is insulin-deficient diabetes beginning in the
  first six months of life that does not remit. It is genetically heterogeneous: activating variants in
  the beta-cell K-ATP channel genes KCNJ11 and ABCC8 are the commonest causes and respond to oral sulfonylureas,
  while biallelic GCK loss, dominant INS variants that misfold proinsulin, failure of pancreatic development
  (PTF1A) and syndromic forms account for the rest. Inheritance and treatment both depend on the gene.'
disease_term:
  preferred_term: permanent neonatal diabetes mellitus
  term:
    id: MONDO:0100164
    label: permanent neonatal diabetes mellitus
parents:
- Monogenic Diabetes
synonyms:
- PNDM
notes: Curated as one genetically heterogeneous entry with a subtype per gene, matching the GeneReviews
  chapter that covers it. Syndromic forms with their own entries (Wolcott-Rallison syndrome, Wolfram syndrome,
  thiamine-responsive megaloblastic anaemia, NDM-CH) are not duplicated here; NDM-CH is kept as a pointer
  subtype. EIF2B1 is recorded as a causative gene but not wired to a mechanism node, because the cited
  report establishes the gene-disease relationship without a source here for the molecular defect.
has_subtypes:
- name: PNDM1
  display_name: permanent neonatal diabetes mellitus 1 (biallelic GCK)
  subtype_term:
    preferred_term: permanent neonatal diabetes mellitus 1
    term:
      id: MONDO:0100165
      label: permanent neonatal diabetes mellitus 1
  classification: molecular
  genes:
  - preferred_term: GCK
    term:
      id: hgnc:4195
      label: GCK
  description: >-
    Complete glucokinase deficiency from biallelic GCK variants. The recessive,
    two-allele counterpart of heterozygous GCK MODY (MODY type 2, curated in Maturity-Onset_Diabetes_of_the_Young):
    the same gene, at a dose that abolishes rather than raises the glucose set
    point for insulin release.
  evidence:
  - reference: PMID:14578306
    reference_title: "Permanent neonatal diabetes caused by glucokinase deficiency: inborn error of the glucose-insulin signaling pathway."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The five subjects with permanent neonatal diabetes due to glucokinase
      deficiency identified to date are characterized by intrauterine growth
      retardation, permanent insulin-requiring diabetes from the first day of
      life, and hyperglycemia in both parents.
    explanation: States the gene-disease relationship and the recessive pattern this subtype names.
  - reference: CGGV:assertion_8a4a40fe-471c-4e9a-a28b-7db3a21cffa6-2026-06-02T160000.000Z
    reference_title: "GCK / monogenic diabetes (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "GCK | HGNC:4195 | monogenic diabetes | MONDO:0015967 | SD | Definitive"
    explanation: >-
      ClinGen curates GCK against a lumped monogenic diabetes entity rather than
      against this subtype, and grades it definitive with semidominant inheritance.
- name: PNDM2
  display_name: diabetes mellitus, permanent neonatal 2 (KCNJ11-related)
  subtype_term:
    preferred_term: diabetes mellitus, permanent neonatal 2
    term:
      id: MONDO:0030087
      label: diabetes mellitus, permanent neonatal 2
  classification: molecular
  genes:
  - preferred_term: KCNJ11
    term:
      id: hgnc:6257
      label: KCNJ11
  description: >-
    Heterozygous activating variants in KCNJ11, encoding the Kir6.2 pore of the
    beta-cell ATP-sensitive potassium channel. The channel fails to close in
    response to ATP, so glucose does not trigger insulin release; sulfonylureas
    close it by an ATP-independent route, which is the basis for transferring
    affected neonates from insulin to an oral sulfonylurea.
  evidence:
  - reference: PMID:15115830
    reference_title: "Activating mutations in the gene encoding the ATP-sensitive potassium-channel subunit Kir6.2 and permanent neonatal diabetes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CONCLUSIONS: Heterozygous activating mutations in the gene encoding Kir6.2
      cause permanent neonatal diabetes and may also be associated with
      developmental delay, muscle weakness, and epilepsy.
    explanation: States the gene-disease relationship and inheritance this subtype names.
  - reference: PMID:16885550
    reference_title: "Switching from insulin to oral sulfonylureas in patients with diabetes due to Kir6.2 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diabetes results from impaired insulin secretion caused by a failure of
      the beta-cell K(ATP) channel to close in response to increased
      intracellular ATP. Sulfonylureas close the K(ATP) channel by an
      ATP-independent route.
    explanation: States the two mechanistic claims this subtype's description makes.
  - reference: CGGV:assertion_9353379e-564a-43bc-a859-7d27ab640e9e-2023-01-05T170000.000Z
    reference_title: "KCNJ11 / monogenic diabetes (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "KCNJ11 | HGNC:6257 | monogenic diabetes | MONDO:0015967 | AD | Definitive"
    explanation: >-
      ClinGen curates KCNJ11 against a lumped monogenic diabetes entity rather
      than against this subtype, and grades it definitive.

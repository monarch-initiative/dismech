        subacute myelopathies.
      explanation: >-
        Classifies spinal cord infarction clinically among acute and subacute
        myelopathies.
prevalence:
- population: General population (arterial spinal cord infarction)
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    Spinal cord infarction accounts for approximately 1% of all strokes and is
    diagnosed roughly 100-fold less frequently than cerebral stroke, with
    underascertainment due to clinical overlap with other acute noncompressive
    myelopathies; no denominator-based annual incidence rate per 100,000 is
    stated in the cited abstracts.
  evidence:
  - reference: DOI:10.3390/jcm14041293
    reference_title: "Spinal Cord Infarction: Clinical and Neuroradiological Clues of a Rare Stroke Subtype"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spinal cord infarction (SCI) of arterial origin is a rare vascular event,
      and its incidence is probably underestimated. There are no strong
      epidemiological data, and the diagnostic pathway is complex and sometimes
      incomplete.
    explanation: Establishes rarity and incomplete population-level incidence data.
  - reference: DOI:10.7759/cureus.64083
    reference_title: "Anterior Spinal Cord Infarction: A Rare Diagnosis With an Uncommon Presentation"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spinal cord infarction (SCI) is a rare vascular event accounting for 1% of
      all strokes.
    explanation: Quantifies spinal cord infarction at approximately 1% of all strokes.
  - reference: PMID:39119546
    reference_title: Spinal cord ischemia - from diagnosis to treatment.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      SCI, when compared to cerebral stroke, is a relatively rare disease, being
      diagnosed 100 times less often.
    explanation: Places spinal cord ischemia incidence roughly two orders of magnitude below cerebral stroke.
epidemiology:
- name: Rare and likely underrecognized spinal cord stroke
  description: >-
    Spinal cord infarction is a rare vascular event and the available
    epidemiology is incomplete, with diagnostic underrecognition likely because
    acute ischemic myelopathy can mimic other acute and subacute myelopathies.
  evidence:
  - reference: DOI:10.3390/jcm14041293
    reference_title: "Spinal Cord Infarction: Clinical and Neuroradiological Clues of a Rare Stroke Subtype"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spinal cord infarction (SCI) of arterial origin is a rare vascular event,
      and its incidence is probably underestimated.
    explanation: This clinical-neuroradiology review supports rarity, uncertain incidence, and likely underrecognition.
pathophysiology:
- name: Spinal arterial supply disruption
  biological_scale: TISSUE
  description: >-
    Aortic pathology, vertebral or aortic dissection, arteriosclerosis,
    embolism, systemic hypotension, perioperative interruption of collateral
    supply, or rarer embolic mechanisms can reduce spinal cord perfusion and
    initiate hypoxic-ischemic injury.

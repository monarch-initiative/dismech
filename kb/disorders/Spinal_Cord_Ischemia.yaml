    causal_link_type: DIRECT
    description: Spinothalamic tract, dorsal/ventral root entry, or segmental gray-matter ischemic injury generates acute and chronic radicular or central neuropathic pain.
  - target: Urinary incontinence
    causal_link_type: DIRECT
    description: Lateral horn and descending autonomic tract infarction disrupts supraspinal and sacral sphincter control, causing urinary incontinence.

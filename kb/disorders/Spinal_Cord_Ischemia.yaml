    explanation: This anterior-spinal-artery syndrome report links tract and horn anatomy to motor, sensory, and autonomic manifestations.
  downstream:
  - target: Paraplegia or paraparesis
    causal_link_type: DIRECT
    description: Bilateral thoracic or thoracolumbar corticospinal tract and anterior horn infarction produces acute paraparesis or paraplegia.
  - target: Hemiplegia or hemiparesis
    causal_link_type: DIRECT
    description: Unilateral sulcal-artery hemicord ischemia injures ipsilateral descending motor pathways, causing hemiparesis.
  - target: Tetraplegia
    causal_link_type: DIRECT
    description: Cervical anterior spinal artery infarction injuring bilateral corticospinal tracts and cervical anterior horns causes tetraplegia.
  - target: Respiratory dysfunction
    causal_link_type: DIRECT

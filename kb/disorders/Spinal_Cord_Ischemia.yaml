    description: Abrupt arterial occlusion causes rapid territorial spinal cord infarction reaching maximal neurological deficit within hours.
  - target: Dissociated pain and temperature sensory loss
    causal_link_type: DIRECT
    description: Anterolateral spinothalamic tract infarction with dorsal-column sparing produces dissociated loss of pain and temperature sensation.

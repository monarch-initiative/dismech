  evidence:
  - reference: PMID:40885467
    reference_title: Calcium/calmodulin-dependent protein kinase II inhibition using tatCN19o ameliorates spinal cord ischemia associated with aortic surgery.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In contrast to sham and tatCN19o-treated mice, the lumbar anterior horn of
      untreated SCI mice showed minimal surviving motor neurons, with
      vacuolization and pyknosis, suggesting both necrosis and apoptosis.
    explanation: >-
      Demonstrates CaMKII-dependent necrotic and apoptotic loss of lumbar
      anterior horn motor neurons after aortic-clamping spinal cord ischemia in
      mice.
  - reference: PMID:40630671
    reference_title: "The role of oxidative stress in spinal cord ischemia reperfusion injury: mechanisms and therapeutic implications."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Oxidative stress can initiate multiple inflammatory and apoptotic
      pathways, triggering a series of destructive events such as inflammatory
      responses and cell death, further deteriorating the microenvironment at
      the injured site, and leading to neurological dysfunction.
    explanation: >-
      Review establishing reactive oxygen species and downstream apoptotic cell
      death as central effectors of spinal cord ischemia-reperfusion injury.
  downstream:
  - target: Anterior horn and spinal tract ischemic injury
    causal_link_type: DIRECT
    description: >-
      Necrotic and apoptotic loss of anterior horn neurons and adjacent white
      matter injury produce territorial spinal cord tissue infarction.

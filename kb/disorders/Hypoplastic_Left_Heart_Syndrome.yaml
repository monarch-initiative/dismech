name: Hypoplastic Left Heart Syndrome
creation_date: "2026-08-10T03:40:00Z"
category: Congenital
disease_term:
  preferred_term: hypoplastic left heart syndrome
  term:
    id: MONDO:0004933
    label: hypoplastic left heart syndrome
description: >
  Underdevelopment of the entire left side of the heart, from the mitral valve through the left
  ventricle and aortic valve to the ascending aorta and arch, such that the left heart cannot
  support the systemic circulation. Two features make it unusual among congenital heart defects.
  The first is that its cause is genuinely unsettled, and the argument is not about which gene
  but about which kind of thing starts the disease. One account says an intrinsic myocardial or
  valvar defect comes first and the small chamber follows from it. The other says an obstruction
  reduces flow through the left heart in mid-gestation and the chamber fails to grow because it
  is not being used. Both have direct experimental support, and the most informative recent work
  does not choose between them so much as nest one inside the other. The second is that the
  treatment does not repair anything. Staged palliation rearranges the circulation so that the
  right ventricle pumps to the body and venous blood reaches the lungs without a pump at all.
  Every late problem these patients face, and there are many, belongs to the physiology of that
  reconstruction rather than to the original malformation. Fewer than a third are alive without
  a transplant at thirty-five years, and that figure has stopped improving.
parents:
- congenital heart malformation
- univentricular heart

classifications:
  harrisons_chapter:
  - classification_value: CARDIOVASCULAR
    notes: >-
      A structural congenital cardiovascular malformation. The neurodevelopmental and hepatic
      sequelae of the palliated circulation fall outside this chapter but are consequences of the
      cardiac lesion and its treatment rather than independent disease.

has_subtypes:
- name: Aortic atresia
  display_name: Hypoplastic left heart syndrome with aortic atresia
  description: >
    The severe end of the spectrum, in which the aortic valve is imperforate. It matters
    mechanistically rather than only descriptively, because with no antegrade flow the ascending
    aorta becomes a retrograde-perfused conduit whose only function is to supply the coronary
    arteries. Coronary perfusion is then ductal-dependent, which is why ductal closure in this
    subtype threatens the myocardium and not only the systemic circulation.
- name: Aortic stenosis with mitral stenosis
  display_name: Hypoplastic left heart syndrome with patent but stenotic valves
  description: >
    Some antegrade flow persists through hypoplastic but perforate valves. This is the subtype in
    which the disease can be watched developing before birth, and the subtype in which fetal
    intervention has been attempted, because there is a lumen to open.
- name: Evolving HLHS from critical aortic stenosis
  display_name: Evolving hypoplastic left heart syndrome
  description: >
    A mid-gestation fetus with critical aortic stenosis and a left ventricle that is still of
    adequate size, which progresses to established hypoplasia by term if the obstruction is not
    relieved. It is curated as a subtype because it is the only setting in which the natural
    history of the disease is observable prospectively, and because it is the group in which the
    flow theory makes a testable prediction.

inheritance:
- name: Complex non-Mendelian inheritance
  description: >
    The dominant pattern. Family clustering establishes that this disease and related left-sided
    malformations are heritable, and genomic regions influencing that inheritance have been
    identified, yet single causal variants have not been found in most patients. The conclusion
    drawn in the field is not that the genetics are unknown but that the inheritance model is
    wrong, that expecting one disease-causing variant is the error. That is why this entry curates
    the genetic contribution as a distributed input to a convergent phenotype rather than as a
    causal gene, and why simple recurrence-risk counselling is not available.
  inheritance_term:
    preferred_term: Non-Mendelian inheritance
    term:
      id: HP:0001426
      label: Non-Mendelian inheritance
  evidence:
  - reference: PMID:38884762
    reference_title: "Human Genetics of Hypoplastic Left Heart Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, using simple Mendelian inheritance models, identification of single genetic variants that \"cause\" HLHS has remained elusive, and in most cases, the genetic cause remains unknown. These results suggest that HLHS inheritance is complex rather than simple."
    explanation: >-
      States the conclusion this inheritance record encodes, that the inheritance is complex
      rather than that the genetics are merely undiscovered.
  - reference: PMID:38884762
    reference_title: "Human Genetics of Hypoplastic Left Heart Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Second, studies of family clustering of HLHS and related cardiovascular malformations have determined HLHS is heritable. Third, genomic regions that encode genes influencing the inheritance of HLHS have been identified."
    explanation: >-
      Establishes heritability and mapped contributing regions, which is what makes the absence of
      single causal variants informative rather than simply a gap in ascertainment.

- name: Autosomal recessive, sarcomeric
  description: >
    A minority mechanism rather than the disease's general mode, applying to the compound
    heterozygous MYH6 route curated in the genetic section. It is recorded because it carries a
    counselling consequence the complex pattern does not, namely a defined sibling recurrence
    risk, and because the unaffected heterozygous parents and siblings in those families are what
    establish the mode.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:26085007
    reference_title: "Recessive MYH6 Mutations in Hypoplastic Left Heart With Reduced Ejection Fraction."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Parents and siblings who were heterozygous carriers had normal echocardiograms."
    explanation: >-
      Unaffected carriers in the same families are the observation that establishes recessive
      rather than dominant transmission for this route. Graded PARTIAL because two families
      cannot establish how large a share of the disease this mode accounts for.

mechanistic_hypotheses:
- hypothesis_group_id: flow_theory
  hypothesis_label: Flow theory, no flow no grow
  status: CANONICAL
  description: >-
    An initiating obstruction at the mitral or aortic valve reduces flow through the left heart
    in mid-gestation, and the chamber, valves, and ascending aorta fail to grow because
    shear-dependent growth signalling is lost. On this account the hypoplasia is secondary and
    the primary lesion is mechanical. It is the model that predicts serial fetal echocardiography
    showing progression from isolated critical aortic stenosis to established hypoplasia, and it
    is the model that motivates fetal aortic valvuloplasty.
  evidence:
  - reference: PMID:42200818
    reference_title: "Is There a Unified Etiology of Hypoplastic Left Heart Syndrome? Evaluating Genetic, Structural, and Hemodynamic Models of Disease Initiation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The flow theory is strongly supported by animal models and in utero interventions that demonstrate the impact of altered hemodynamics on cardiac morphogenesis."
    explanation: >-
      States both the support for the model and its two sources, animal work and the human
      intervention. Evidence source is OTHER because this is a review evaluating competing models
      rather than a primary study.
  - reference: PMID:42200818
    reference_title: "Is There a Unified Etiology of Hypoplastic Left Heart Syndrome? Evaluating Genetic, Structural, and Hemodynamic Models of Disease Initiation."
    supports: REFUTE
    evidence_source: OTHER
    snippet: "However, the flow theory fails to identify initial causes of disturbed flow or related histological features of HLHS like endocardial fibroelastosis."
    explanation: >-
      The same review's statement of what the model cannot account for, curated alongside the
      support so the hypothesis is recorded with its limits rather than as settled. It is a
      REFUTE of the model's sufficiency, not of its contribution.

- hypothesis_group_id: intrinsic_myocardial_defect
  hypothesis_label: Intrinsic myocardial and cell-autonomous defect
  status: ALTERNATIVE
  description: >-
    A primary defect of cardiomyocyte proliferation, differentiation, or sarcomeric function
    limits growth of the left heart directly, with the flow deficit a consequence rather than a
    cause. The strongest form of this argument is not that flow is irrelevant but that the flow
    deficit is itself downstream of a myocardial defect, which is what a myocardium-restricted
    genetic rescue of the structural phenotype demonstrates.
  evidence:
  - reference: PMID:29569026
    reference_title: "The Genetic Landscape of Hypoplastic Left Heart Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Current paradigm suggests HLHS is largely of hemodynamic origin, but recent findings from analysis of the first mouse model of HLHS showed intrinsic cardiomyocyte proliferation and differentiation defects underlying the left ventricular (LV) hypoplasia."
    explanation: >-
      States the challenge to the haemodynamic paradigm and its source in the first genetic mouse
      model of the disease.
  - reference: PMID:36198703
    reference_title: "Intrinsic myocardial defects underlie an Rbfox-deficient zebrafish model of hypoplastic left heart syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This work supports an emerging paradigm for HLHS pathogenesis that centers on myocardial intrinsic defects."
    explanation: >-
      A second, independent model system reaching the same conclusion, which is what raises this
      from a single-model result to a competing account.

- hypothesis_group_id: myocardial_defect_upstream_of_flow
  hypothesis_label: Myocardial defect upstream of the flow deficit
  status: EMERGING
  description: >-
    A reconciliation rather than a third competitor. On this account an intrinsic myocardial
    defect impairs pump function, the impaired pump produces the flow deficit, and the flow
    deficit produces the structural hypoplasia, so both earlier models describe true steps in one
    sequence. The evidence is a genetic rescue with anatomical specificity. Restoring the gene
    only in myocardium rescues the ventricular, valve, and aortic phenotypes together, which is
    what one expects if all three are downstream of pump function and not if they are independent
    lesions. This is recorded as EMERGING because it rests on one model organism.
  evidence:
  - reference: PMID:36198703
    reference_title: "Intrinsic myocardial defects underlie an Rbfox-deficient zebrafish model of hypoplastic left heart syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast to current models, we demonstrate that these structural deficits arise secondary to impaired pump function as these phenotypes are rescued when Rbfox is specifically expressed in the myocardium."
    explanation: >-
      The tissue-restricted rescue is what makes this more than a correlation. It places the
      myocardial defect upstream of the structural deficits while leaving the flow-dependence of
      those deficits intact.
  - reference: PMID:36198703
    reference_title: "Intrinsic myocardial defects underlie an Rbfox-deficient zebrafish model of hypoplastic left heart syndrome."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we report that zebrafish lacking two orthologs of the RNA binding protein RBFOX2, a gene linked to HLHS in humans, display cardiovascular defects overlapping those in HLHS patients including ventricular, valve, and aortic deficiencies."
    explanation: >-
      Establishes what the model reproduces. Graded PARTIAL because a zebrafish, which has a
      two-chambered heart and no left ventricle in the mammalian sense, can model the mechanism
      without modelling the anatomy.
  notes: >
    Recorded as a distinct hypothesis rather than folded into either parent because it makes a
    different prediction from both. The flow theory predicts that relieving obstruction should
    rescue growth regardless of myocardial genotype, and the intrinsic-defect model predicts that
    relieving obstruction should not help. This one predicts that relief should help partially and
    variably, depending on how much of the pump deficit is mechanical, which is closer to what
    fetal aortic valvuloplasty actually achieves.

pathophysiology:
- name: Genetic lesion affecting cardiac growth or valvulogenesis
  biological_scale: MOLECULAR
  description: >
    Variants in cardiac transcription factors, signalling genes, sarcomeric genes, and chromatin
    regulators contribute to the disease, but not in the way a Mendelian disorder does. Eight
    independent mouse lines produce the phenotype, the human genetic architecture combines de
    novo single-gene and copy-number lesions with lower-penetrance and common variation, and no
    single gene accounts for more than a small fraction of cases. That architecture is itself a
    mechanistic claim, because it says the phenotype is a convergence point reachable by many
    routes rather than the readout of one pathway.
  biological_processes:
  - preferred_term: cardiac ventricle development
    term:
      id: GO:0003231
      label: cardiac ventricle development
    modifier: DECREASED
  - preferred_term: heart valve development
    term:
      id: GO:0003170
      label: heart valve development
    modifier: DECREASED
  evidence:
  - reference: PMID:36286267
    reference_title: "Considering the Genetic Architecture of Hypoplastic Left Heart Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "De novo single-gene and copy number variant (CNV) disorders make an important contribution, but there is emerging evidence for causal contributions from lower penetrance and common variation."
    explanation: >-
      States the mixed architecture, which is the basis for modelling the genetic contribution as
      a distributed input to a convergent phenotype rather than as a causal gene.
  - reference: PMID:29569026
    reference_title: "The Genetic Landscape of Hypoplastic Left Heart Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Analysis of 8 independent HLHS mouse lines showed HLHS is genetically heterogeneous and multigenic in etiology."
    explanation: >-
      Supports genetic heterogeneity from the model-organism side, independently of the human
      sequencing data.
  downstream:
  - target: Impaired cardiomyocyte proliferation and differentiation
    causal_link_type: DIRECT
    hypothesis_groups:
    - intrinsic_myocardial_defect
    - myocardial_defect_upstream_of_flow
    description: >
      On the intrinsic-defect account the genetic lesion acts first on the myocyte, limiting
      growth of the chamber directly.
  - target: Obstruction to left heart inflow or outflow
    causal_link_type: DIRECT
    hypothesis_groups:
    - flow_theory
    description: >
      On the flow account the genetic lesion acts on valvulogenesis, and the mechanical
      consequence rather than the myocyte defect is what limits growth.

- name: Impaired cardiomyocyte proliferation and differentiation
  biological_scale: CELLULAR
  description: >
    Cardiomyocytes in the developing left ventricle proliferate less and differentiate abnormally,
    with disorganised sarcomeric architecture and altered mitochondrial maturation. This is what
    the first genetic mouse model of the disease showed, and it is the node that distinguishes an
    intrinsically small ventricle from a ventricle that is small because it is unused.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  locations:
  - preferred_term: heart left ventricle
    term:
      id: UBERON:0002084
      label: heart left ventricle
  evidence:
  - reference: PMID:29569026
    reference_title: "The Genetic Landscape of Hypoplastic Left Heart Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Current paradigm suggests HLHS is largely of hemodynamic origin, but recent findings from analysis of the first mouse model of HLHS showed intrinsic cardiomyocyte proliferation and differentiation defects underlying the left ventricular (LV) hypoplasia."
    explanation: >-
      Directly supports impaired proliferation and differentiation as the cellular lesion beneath
      the hypoplasia in a genetic model.
  downstream:
  - target: Reduced flow through the left heart
    causal_link_type: DIRECT
    hypothesis_groups:
    - myocardial_defect_upstream_of_flow
    description: >
      A myocardium that cannot pump adequately generates less flow, which is the reconciliation
      the tissue-restricted rescue experiment supports.
  - target: Progressive hypoplasia of left heart structures
    causal_link_type: DIRECT
    hypothesis_groups:
    - intrinsic_myocardial_defect
    description: >
      On the strict intrinsic-defect account the small chamber follows from the cell-autonomous
      growth defect without requiring a flow intermediate.

- name: Obstruction to left heart inflow or outflow
  biological_scale: TISSUE
  description: >
    Stenosis or atresia of the mitral or aortic valve. In the evolving form this is present in
    mid-gestation while the left ventricle is still of adequate size, so the obstruction can be
    observed before the hypoplasia it is proposed to cause.
  locations:
  - preferred_term: aortic valve
    term:
      id: UBERON:0002137
      label: aortic valve
  - preferred_term: mitral valve
    term:
      id: UBERON:0002135
      label: mitral valve
  downstream:
  - target: Reduced flow through the left heart
    causal_link_type: DIRECT
    hypothesis_groups:
    - flow_theory
    description: >
      A stenotic or atretic valve mechanically limits the volume traversing the left heart.

- name: Reduced flow through the left heart
  biological_scale: ORGANISM
  description: >
    Whatever puts it there, reduced flow across the mitral valve and out through the aortic valve
    is the shared middle of the disease. The claim attached to it is that flow is not merely a
    consequence of chamber size but an input to chamber growth, so that a left heart carrying
    less volume grows less. That claim is testable in humans, and it has been tested.
  locations:
  - preferred_term: heart left ventricle
    term:
      id: UBERON:0002084
      label: heart left ventricle
  downstream:
  - target: Progressive hypoplasia of left heart structures
    causal_link_type: DIRECT
    hypothesis_groups:
    - flow_theory
    - myocardial_defect_upstream_of_flow
    description: >
      Loss of the flow-dependent growth stimulus arrests growth of the chamber, its valves, and
      the ascending aorta together.
  - target: Endocardial fibroelastosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >
      Abnormal endocardial shear is associated with a fibroelastic lining of the ventricular
      cavity, though the flow account does not by itself explain this lesion.

- name: Endocardial fibroelastosis
  biological_scale: TISSUE
  description: >
    A layer of fibroelastic tissue lining the hypoplastic ventricular cavity, further reducing
    compliance and inflow. It is curated as its own node because it is the specific finding the
    flow theory is criticised for failing to explain, so collapsing it into the hypoplasia node
    would hide the weakness in the model.
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  locations:
  - preferred_term: heart left ventricle
    term:
      id: UBERON:0002084
      label: heart left ventricle
  evidence:
  - reference: PMID:42200818
    reference_title: "Is There a Unified Etiology of Hypoplastic Left Heart Syndrome? Evaluating Genetic, Structural, and Hemodynamic Models of Disease Initiation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "However, the flow theory fails to identify initial causes of disturbed flow or related histological features of HLHS like endocardial fibroelastosis."
    explanation: >-
      Identifies endocardial fibroelastosis as a histological feature the dominant model does not
      account for, which is why this entry gives it a node rather than treating it as detail.
      Evidence source is OTHER because this is a review.
  notes: >
    No biological_processes annotation is attached, and the reason is evidential rather than
    terminological. An earlier draft bound this node to GO:0001837 epithelial to mesenchymal
    transition, which is the wrong process. The literature describes endothelial-to-mesenchymal
    transition, a distinct event in which endocardial endothelium rather than epithelium acquires
    a mesenchymal phenotype. An apt term for that process does exist. GO:0140074 cardiac
    endothelial to mesenchymal transition carries EndMT and EndoMT as exact synonyms, and its
    definition reaches beyond endocardial cushion and valve formation to the generation of
    cardiac fibroblasts and smooth muscle cells, which is the population a fibroelastic lesion
    would draw on. It is deliberately not used here. The evidence cited on this node establishes
    only that the lesion exists and is unexplained by the flow model, and does not establish that
    any cell-state transition occurs, so binding GO:0140074 would attach a mechanism claim this
    entry cannot support. A future curator who arrives with evidence for the transition itself
    should use that term. The cell types are retained because the cellular participants are not
    in doubt.
  downstream:
  - target: Progressive hypoplasia of left heart structures
    causal_link_type: DIRECT
    description: >
      A non-compliant cavity lining further restricts filling and therefore further restricts the
      volume available to drive growth.

- name: Progressive hypoplasia of left heart structures
  biological_scale: TISSUE
  description: >
    By term the mitral valve, left ventricle, aortic valve, and ascending aorta and arch are all
    markedly undersized or atretic. The word progressive is doing real work here. This is not a
    malformation fixed at the moment of organogenesis but one that develops across gestation,
    which is precisely why a mid-gestation intervention is conceivable at all.
  locations:
  - preferred_term: heart left ventricle
    term:
      id: UBERON:0002084
      label: heart left ventricle
  - preferred_term: ascending aorta
    term:
      id: UBERON:0001496
      label: ascending aorta
  - preferred_term: arch of aorta
    term:
      id: UBERON:0001508
      label: arch of aorta
  downstream:
  - target: Ductus-dependent systemic and coronary perfusion
    causal_link_type: DIRECT
    description: >
      A left heart that cannot eject to the body leaves the systemic circulation dependent on
      right-to-left flow through the arterial duct.
  - target: Restrictive or intact atrial septum
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >
      Because a hypoplastic or atretic mitral valve gives the left atrium no forward outlet, the
      adequacy of the interatrial communication becomes the sole determinant of whether pulmonary
      venous return can escape.

- name: Restrictive or intact atrial septum
  biological_scale: ORGANISM
  description: >
    The left atrium in this disease receives the entire pulmonary venous return and has no
    outlet through a hypoplastic or atretic mitral valve, so that blood can only leave across the
    atrial septum. When the interatrial communication is small or absent the pulmonary veins
    are obstructed in utero, and the consequence is not merely haemodynamic. Sustained pulmonary
    venous hypertension remodels the lung itself, producing pulmonary lymphangiectasia, so the
    child is born with lung disease as well as heart disease. This is why an intact septum
    converts an operable malformation into an emergency at the moment of delivery, and why it is
    the single prenatal finding that most changes prognosis.
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  evidence:
  - reference: PMID:41185129
    reference_title: "Fetal Diagnosis of Hypoplastic Left Heart Syndrome With Restrictive Atrial Septum-Atrial Septal Morphology, Associated Lung Disease and Outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fetuses with hypoplastic left heart syndrome (HLHS) and restrictive/intact atrial septum (RAS) have high mortality, partly due to pulmonary lymphangiectasia (PL)."
    explanation: >-
      States both the prognostic weight of the finding and the mechanism by which it kills, which
      is lung remodelling rather than the cardiac lesion alone.
  - reference: PMID:41185129
    reference_title: "Fetal Diagnosis of Hypoplastic Left Heart Syndrome With Restrictive Atrial Septum-Atrial Septal Morphology, Associated Lung Disease and Outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most had a hypoplastic left atrium (LA, 80%). Four atrial septal morphology patterns were identified. PL was present among all patterns and associated with lower VTI ratio (p = 0.046)."
    explanation: >-
      Links the degree of obstruction, measured as the pulmonary venous flow ratio, to the lung
      lesion, which is what makes this a graded mechanism rather than a binary anatomical finding.
  downstream:
  - target: Circulatory collapse on ductal closure
    causal_link_type: DIRECT
    description: >
      An obstructed interatrial communication compounds the postnatal emergency, since pulmonary
      venous return cannot reach the systemic circulation even while the duct remains open.

- name: Ductus-dependent systemic and coronary perfusion
  biological_scale: ORGANISM
  description: >
    After birth the entire systemic output crosses the arterial duct from the pulmonary artery,
    and the right ventricle supplies both circulations in parallel. In aortic atresia the
    ascending aorta carries only retrograde flow to the coronary arteries, so the coronary supply
    is ductal-dependent too. Systemic and pulmonary flow now compete for the same output, which
    is why a fall in pulmonary vascular resistance after birth paradoxically worsens systemic
    perfusion by stealing flow into the lungs.
  locations:
  - preferred_term: ascending aorta
    term:
      id: UBERON:0001496
      label: ascending aorta
  downstream:
  - target: Circulatory collapse on ductal closure
    causal_link_type: DIRECT
    description: >
      Closure of the duct removes the only route by which blood reaches the body and, in aortic
      atresia, the heart itself.

- name: Circulatory collapse on ductal closure
  biological_scale: ORGANISM
  description: >
    The duct closes over the first days of life and systemic perfusion fails, producing shock,
    acidosis, and death. This is the reason the disease is uniformly fatal untreated and the
    reason prostaglandin infusion is the first intervention, since keeping the duct open buys the
    time in which everything else becomes possible.
  downstream:
  - target: Systemic right ventricle after staged palliation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >
      Surgical palliation prevents the collapse and substitutes a reconstructed circulation, which
      is the state the patient then lives in.

- name: Systemic right ventricle after staged palliation
  biological_scale: ORGANISM
  description: >
    The reconstruction leaves the right ventricle pumping to the body and, after the final stage,
    venous blood flowing to the lungs without a ventricle behind it. This is not a repair and the
    entry curates it as a disease state rather than as an outcome. The right ventricle is not
    built for systemic afterload and eventually fails in a substantial proportion. There is also
    evidence that this failure is not purely mechanical wear, since recessive sarcomeric variants
    found in patients who developed late right ventricular dysfunction suggest the same molecular
    defect that arrested the left ventricle can express itself later as a myopathy of the right.
    Patients with this disease do worse after the same operation than patients with other
    single-ventricle anatomies, which is consistent with something intrinsic to the myocardium
    rather than to the plumbing.
  cell_types:
  - preferred_term: cardiac muscle cell
    term:
      id: CL:0000746
      label: cardiac muscle cell
  locations:
  - preferred_term: heart right ventricle
    term:
      id: UBERON:0002080
      label: heart right ventricle
  evidence:
  - reference: PMID:26085007
    reference_title: "Recessive MYH6 Mutations in Hypoplastic Left Heart With Reduced Ejection Fraction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings implicate a shared molecular basis for the developmental arrest and latent myopathy of left and right ventricles, respectively."
    explanation: >-
      The specific claim this node makes, that late right ventricular failure may be a delayed
      expression of the same molecular lesion rather than only the cost of systemic afterload.
  - reference: PMID:39604028
    reference_title: "Cardiovascular Outcomes Associated With Hypoplastic Left Heart Syndrome Versus Other Types of Single Ventricle With a Predominant Right Ventricle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In multivariable analyses, HLHS was associated with a significantly higher risk of the composite outcome"
    explanation: >-
      Compares this disease against other anatomies palliated the same way and with the same
      systemic right ventricle, so the excess risk is attributable to something in the disease
      rather than to the operation. This is the epidemiological counterpart of the genetic
      argument above.

phenotypes:
- category: Cardiovascular
  name: Hypoplastic left ventricle
  description: >
    A left ventricle too small to support the systemic circulation, the defining structural
    lesion.
  phenotype_term:
    preferred_term: Hypoplastic left ventricle
    term:
      id: HP:0004383
      label: Hypoplastic left ventricle
    clinical_course: PROGRESSIVE

- category: Cardiovascular
  name: Aortic valve atresia
  description: >
    Imperforate aortic valve, present in the most severe subtype and the reason the ascending
    aorta becomes a retrograde coronary conduit.
  phenotype_term:
    preferred_term: Aortic valve atresia
    term:
      id: HP:0010883
      label: Aortic valve atresia

- category: Cardiovascular
  name: Mitral atresia
  description: >
    Imperforate mitral valve, eliminating inflow to the left ventricle and commonly co-occurring
    with aortic atresia.
  phenotype_term:
    preferred_term: Mitral atresia
    term:
      id: HP:0011560
      label: Mitral atresia

- category: Cardiovascular
  name: Patent ductus arteriosus
  description: >
    Persistence of the arterial duct, which in this disease is not a defect but the only route by
    which blood reaches the body. Its patency is maintained pharmacologically until surgery,
    inverting the usual clinical significance of the finding.
  phenotype_term:
    preferred_term: Patent ductus arteriosus
    term:
      id: HP:0001643
      label: Patent ductus arteriosus

- category: Cardiovascular
  name: Endocardial fibroelastosis
  description: >
    Fibroelastic thickening of the ventricular endocardium, reducing compliance. It is the
    histological finding that the dominant flow-based model of the disease does not account for.
  phenotype_term:
    preferred_term: Endocardial fibroelastosis
    term:
      id: HP:0001706
      label: Endocardial fibroelastosis

- category: Sign
  name: Cyanosis
  description: >
    Blue discoloration from the obligate mixing of systemic and pulmonary venous return in a
    single functional ventricle. Unlike in tetralogy of Fallot the mixing is anatomically
    unavoidable rather than dependent on shunt direction.
  phenotype_term:
    preferred_term: Cyanosis
    term:
      id: HP:0000961
      label: Cyanosis

- category: Sign
  name: Cardiogenic shock on ductal closure
  description: >
    Circulatory collapse over the first days of life as the duct closes, with acidosis and
    end-organ hypoperfusion. It is the presentation in any infant not diagnosed before birth or
    on newborn pulse oximetry screening.
  phenotype_term:
    preferred_term: Cardiogenic shock
    term:
      id: HP:0030149
      label: Cardiogenic shock
    temporality: ACUTE
    severity: SEVERE

- category: Cardiovascular
  name: Coarctation of the aorta
  description: >
    Narrowing of the aorta at the ductal insertion, frequently co-occurring and relevant because
    it further compromises the retrograde systemic supply on which the patient depends.
  phenotype_term:
    preferred_term: Coarctation of aorta
    term:
      id: HP:0001680
      label: Coarctation of aorta

- category: Cardiovascular
  name: Right ventricular failure after palliation
  description: >
    Late failure of the systemic right ventricle, the dominant cause of death or transplantation
    in survivors. It is a phenotype of the reconstructed circulation rather than of the
    malformation, and there is evidence that it may also be a delayed expression of the same
    myocardial defect.
  phenotype_term:
    preferred_term: Right ventricular failure
    term:
      id: HP:0001708
      label: Right ventricular failure
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:26085007
    reference_title: "Recessive MYH6 Mutations in Hypoplastic Left Heart With Reduced Ejection Fraction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Evaluation of cardiac structure and function by echocardiography in patients with hypoplastic left heart and their first-degree relatives identified 5 individuals with right ventricular ejection fraction ≤40% after Fontan operation."
    explanation: >-
      Documents the phenotype in a Fontan-palliated cohort with an explicit functional threshold.

genetic:
- name: MYH6
  gene_term:
    preferred_term: MYH6
    term:
      id: hgnc:7576
      label: MYH6
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >
    Encodes alpha-myosin heavy chain. It is the gene with the strongest statistical support in
    this disease, enriched by rare-variant burden testing against controls, and the one with the
    most interesting clinical implication, since compound heterozygous recessive variants were
    found in patients who later developed systemic right ventricular dysfunction. That connects
    the developmental lesion to the late complication through one molecule.
  evidence:
  - reference: PMID:33325730
    reference_title: "Genetic Association Between Hypoplastic Left Heart Syndrome and Cardiomyopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "rare variant burden testing of 56 genes revealed enrichment in MYH6 (P=0.000068)"
    explanation: >-
      Provides the case-control burden evidence, which is stronger than the family-based findings
      alone.
  - reference: PMID:26085007
    reference_title: "Recessive MYH6 Mutations in Hypoplastic Left Heart With Reduced Ejection Fraction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Secondary family-based filtering for de novo and recessive variants revealed rare inherited missense mutations on both paternal and maternal alleles of MYH6, encoding myosin heavy chain 6, in 2 patients who developed right ventricular dysfunction 3 to 11 years postoperatively."
    explanation: >-
      Establishes the recessive mode and its association with the late right ventricular
      phenotype, which is the specific claim the systemic right ventricle node depends on.
  - reference: PMID:26085007
    reference_title: "Recessive MYH6 Mutations in Hypoplastic Left Heart With Reduced Ejection Fraction."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Parents and siblings who were heterozygous carriers had normal echocardiograms."
    explanation: >-
      Supports recessive inheritance for this mechanism by showing carriers are unaffected.
      Graded PARTIAL because the number of families is very small.

- name: NOTCH1
  gene_term:
    preferred_term: NOTCH1
    term:
      id: hgnc:7881
      label: NOTCH1
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >
    A receptor central to valvulogenesis, endocardial cushion formation, and ventricular
    trabeculation, and one of the recurrently implicated genes in left-sided obstructive lesions
    generally. No frequency or effect size is asserted, since this entry cites no
    cohort-frequency evidence for it. The evidence attached is about the class of finding rather
    than this locus specifically, which is the honest position for a gene identified through
    mapped genomic regions rather than through a replicated association.
  evidence:
  - reference: PMID:38884762
    reference_title: "Human Genetics of Hypoplastic Left Heart Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Third, genomic regions that encode genes influencing the inheritance of HLHS have been identified."
    explanation: >-
      Supports the existence of mapped genomic contributions, which is the category this gene
      belongs to. Graded PARTIAL because it does not name this locus and therefore cannot
      establish its individual contribution.

- name: NKX2-5
  gene_term:
    preferred_term: NKX2-5
    term:
      id: hgnc:2488
      label: NKX2-5
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >
    A cardiac transcription factor with an OMIM-designated hypoplastic left heart syndrome
    subtype. As with NOTCH1, no frequency or effect size is asserted here.
  evidence:
  - reference: PMID:38884762
    reference_title: "Human Genetics of Hypoplastic Left Heart Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Third, genomic regions that encode genes influencing the inheritance of HLHS have been identified."
    explanation: >-
      As for NOTCH1, this supports the category rather than the locus. Graded PARTIAL for the
      same reason, and the two genes are curated at the same evidential strength deliberately,
      since neither has cohort-frequency evidence cited here.

- name: Cytogenetic abnormality
  gene_term:
    preferred_term: chromosomal abnormality associated with hypoplastic left heart syndrome
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >
    A minority of cases occur in the context of a chromosomal abnormality, Turner syndrome being
    the recurrently cited example. This is curated as a named genetic contribution without a gene
    binding, because the lesion is a chromosome rather than a locus and no single gene is being
    asserted. Its evidential role in this entry is specific. Cytogenetic association is one of
    the three independent lines of argument that the disease has genetic origins, alongside
    family clustering and mapped genomic regions, and it is the line that is hardest to explain
    on a purely haemodynamic account. No frequency is asserted, since this entry cites no source
    quantifying the syndromic share.
  evidence:
  - reference: PMID:38884762
    reference_title: "Human Genetics of Hypoplastic Left Heart Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "First, some HLHS cases have been associated with cytogenetic abnormalities (e.g., Turner syndrome)."
    explanation: >-
      Establishes the cytogenetic association and names the recurrent example, which is the whole
      of the claim this record makes.

- name: RBFOX2
  gene_term:
    preferred_term: RBFOX2
    term:
      id: hgnc:9906
      label: RBFOX2
  relationship_type: SUSCEPTIBILITY
  variant_origin: GERMLINE
  notes: >
    An RNA-binding splicing regulator linked to this disease in humans and the gene whose
    zebrafish orthologue loss produced the tissue-restricted rescue experiment that underlies the
    reconciling hypothesis in this entry. Its interest here is mechanistic rather than
    epidemiological.
  evidence:
  - reference: PMID:36198703
    reference_title: "Intrinsic myocardial defects underlie an Rbfox-deficient zebrafish model of hypoplastic left heart syndrome."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Injection of human RBFOX2 mRNA restores cardiovascular development in rbfox mutant zebrafish, while HLHS-linked RBFOX2 variants fail to rescue."
    explanation: >-
      Functional evidence that the human variants are loss of function, since wild-type human
      messenger RNA rescues and the patient variants do not. Graded PARTIAL because the assay is
      cross-species complementation rather than a human genetic association.

treatments:
- name: Prostaglandin E1 infusion
  description: >
    Maintains ductal patency from birth until surgery. It does nothing to the malformation and
    is not a treatment of the disease in any mechanistic sense, but without it the patient dies
    of the next node in the chain within days.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prostaglandin E1
      term:
        id: CHEBI:15544
        label: prostaglandin E1
  target_mechanisms:
  - target: Circulatory collapse on ductal closure
    treatment_effect: INHIBITS
    description: >
      Preventing ductal closure preserves the only route by which blood reaches the systemic and,
      in aortic atresia, the coronary circulation.
  evidence:
  - reference: PMID:40390868
    reference_title: "Caffeine Treatment for Prostaglandin E1-Induced Apnea Prevention in Congenital Heart Disease Neonates: A Randomized Clinical Trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prostaglandin E1 (PGE1) is used to maintain the ductus arteriosus open in neonates with ductal-dependent heart lesions but is associated with apnea."
    explanation: >-
      States both the indication this treatment is curated for and its principal toxicity in the
      same sentence. Apnoea matters practically, since it is the reason these neonates are often
      intubated for transport rather than for their cardiac lesion.

- name: Balloon atrial septostomy
  description: >
    Catheter enlargement of the interatrial communication, performed urgently after birth when
    the septum is restrictive or intact, and increasingly attempted before birth. It is the
    direct counterpart of the restrictive-septum emergency, and the fetal version is the second
    intervention in this disease that acts on mechanism rather than consequence. Fetal atrial
    septal intervention improves the measured degree of pulmonary venous obstruction, and in some
    fetuses the associated lung lesion improves too. Whether that translates into survival is not
    established, since mortality in the reported series did not differ by whether intervention was
    performed.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Restrictive or intact atrial septum
    treatment_effect: INHIBITS
    description: >
      Enlarging the interatrial communication relieves the obstruction to pulmonary venous
      egress, which is the lesion driving the lung disease.
  evidence:
  - reference: PMID:41185129
    reference_title: "Fetal Diagnosis of Hypoplastic Left Heart Syndrome With Restrictive Atrial Septum-Atrial Septal Morphology, Associated Lung Disease and Outcomes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mean VTI ratio improved in fetuses who underwent atrial septal intervention (n = 12), compared to those without (p = 0.001)."
    explanation: >-
      Establishes that the intervention relieves the physiological obstruction it targets, which
      is the mechanistic claim rather than the outcome claim.
  - reference: PMID:41185129
    reference_title: "Fetal Diagnosis of Hypoplastic Left Heart Syndrome With Restrictive Atrial Septum-Atrial Septal Morphology, Associated Lung Disease and Outcomes."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Seventeen neonates were live-born with intention-to-treat; 6-months mortality was 38% with no difference by morphology pattern, PL, or fetal intervention."
    explanation: >-
      Bounds the claim deliberately. The physiological target improves while mortality does not
      differ, so this entry curates the intervention as mechanism-directed without asserting
      survival benefit. Graded PARTIAL for that reason.

- name: Staged single-ventricle palliation
  description: >
    Three operations converting a parallel, ductal-dependent circulation into a series
    circulation with the right ventricle as the systemic pump and passive venous return to the
    lungs. It is the reason the disease is survivable and it is also the origin of the disease
    these patients live with afterwards. In the largest long-term cohort fewer than a third were
    alive without transplantation at thirty-five years, and survival has not improved in recent
    eras, which is a statement about the limits of the approach rather than about surgical
    technique.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Ductus-dependent systemic and coronary perfusion
    treatment_effect: INHIBITS
    description: >
      Reconstruction gives the right ventricle a permanent unobstructed path to the aorta,
      removing the dependence on the duct.
  evidence:
  - reference: PMID:40533128
    reference_title: "Long-Term Survival and Patient-Reported Outcomes After Staged Reconstructive Surgery for Hypoplastic Left Heart Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Transplant-free survival was 31.0% at 35 years. Transplant-free survival improved over time but is not different across recent eras."
    explanation: >-
      Quantifies both the survival achieved and the plateau. Graded PARTIAL because it supports
      the operation as life-prolonging while simultaneously bounding what it achieves, which is
      the balanced claim this entry makes.

- name: Fetal aortic valvuloplasty
  description: >
    Catheter dilation of a stenotic aortic valve in mid-gestation, attempted in fetuses with
    critical aortic stenosis whose left ventricle has not yet become hypoplastic. It is the only
    treatment in this disease that acts on mechanism rather than on consequence, and it is
    simultaneously the strongest human test of the flow theory, since it predicts that relieving
    obstruction should permit left heart growth. It partly does. Just over forty percent of
    live-born fetuses in the largest series achieved a biventricular circulation, and their
    left-sided structures were significantly larger at birth. Most still required postnatal
    intervention, so the result supports flow-dependent growth without supporting a cure.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Obstruction to left heart inflow or outflow
    treatment_effect: INHIBITS
    description: >
      Dilating the stenotic valve restores antegrade flow through the left heart during the
      gestational window in which the chamber is still growing.
  evidence:
  - reference: PMID:25052401
    reference_title: "Fetal aortic valvuloplasty for evolving hypoplastic left heart syndrome: postnatal outcomes of the first 100 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eighty-eight fetuses were live-born, and 38 had a BV circulation (31 from birth, 7 converted after initial univentricular palliation)."
    explanation: >-
      Quantifies how often the intervention achieved a two-ventricle circulation, which is the
      outcome the flow theory predicts should be attainable.
  - reference: PMID:25052401
    reference_title: "Fetal aortic valvuloplasty for evolving hypoplastic left heart syndrome: postnatal outcomes of the first 100 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Left-sided structures, namely aortic and mitral valve sizes and left ventricular volume, were significantly larger in the BV group at the time of birth (P<0.01)."
    explanation: >-
      This is the mechanistic result rather than the clinical one. Structures downstream of the
      relieved obstruction were larger, which is the growth response the flow theory posits.
  - reference: PMID:25052401
    reference_title: "Fetal aortic valvuloplasty for evolving hypoplastic left heart syndrome: postnatal outcomes of the first 100 patients."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "All but 1 of the BV patients required postnatal intervention; 42% underwent aortic or mitral valve replacement."
    explanation: >-
      Bounds the claim. A biventricular circulation is not a normal heart, and curating this
      alongside the successes keeps the entry from overstating what relieving the obstruction
      achieves. Graded PARTIAL for that reason.

- name: Cardiac transplantation
  description: >
    Replacement of the heart, used when the systemic right ventricle fails or when palliation is
    not feasible. It is the only treatment that removes the underlying myocardium, which matters
    if the late failure is partly a myopathy rather than only afterload mismatch, and it is
    limited by donor availability in the relevant age group.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Organ Transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Systemic right ventricle after staged palliation
    treatment_effect: INHIBITS
    description: >
      Transplantation replaces the failing systemic ventricle and, with it, any intrinsic
      myocardial defect it carried.

experimental_models:
- name: Rbfox-deficient zebrafish
  description: >
    Zebrafish lacking both orthologues of RBFOX2, which develop ventricular, valve, and aortic
    deficiencies overlapping the human phenotype. Its importance is not that it phenocopies the
    disease but that it can be dissected. Restoring the gene only in myocardium rescues the
    structural phenotypes, which places the myocardial defect upstream of the flow deficit and
    upstream of the structural lesions, and human wild-type messenger RNA rescues while
    patient-derived variants do not, which establishes those variants as loss of function. Its
    limitation is anatomical, since the zebrafish heart has one ventricle and no left heart in the
    mammalian sense, so the model can support the mechanism without supporting the anatomy.
  experimental_model_type: OTHER
  organism:
    preferred_term: zebrafish
    term:
      id: NCBITaxon:7955
      label: Danio rerio
  modeled_mechanisms:
  - target: Impaired cardiomyocyte proliferation and differentiation
    description: >
      The model localises the primary defect to the myocardium by tissue-restricted rescue.
  - target: Reduced flow through the left heart
    description: >
      It places the flow deficit downstream of impaired pump function rather than upstream of the
      myocardial phenotype.
  publication: PMID:36198703
  evidence:
  - reference: PMID:36198703
    reference_title: "Intrinsic myocardial defects underlie an Rbfox-deficient zebrafish model of hypoplastic left heart syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast to current models, we demonstrate that these structural deficits arise secondary to impaired pump function as these phenotypes are rescued when Rbfox is specifically expressed in the myocardium."
    explanation: >-
      The tissue-restricted rescue, which is the experiment that makes this model informative
      about causal order rather than only about phenotype.
  - reference: PMID:36198703
    reference_title: "Intrinsic myocardial defects underlie an Rbfox-deficient zebrafish model of hypoplastic left heart syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mechanistically, we find diminished expression and alternative splicing of sarcomere and mitochondrial components that compromise sarcomere assembly and mitochondrial respiration, respectively."
    explanation: >-
      Identifies the molecular consequence, which connects a splicing regulator to the contractile
      and energetic machinery a pump depends on.

- name: Genetic mouse models of hypoplastic left heart
  description: >
    A panel of independently derived mouse lines, the first genetic models of this disease. They
    established two things that changed the field. The hypoplasia is underpinned by intrinsic
    cardiomyocyte proliferation and differentiation defects rather than being purely haemodynamic,
    and the disease is genetically heterogeneous and multigenic rather than attributable to one
    locus. Similar but milder defects in the right ventricle in these models are the animal
    counterpart of the late systemic right ventricular failure seen in patients.
  experimental_model_type: OTHER
  organism:
    preferred_term: house mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  modeled_mechanisms:
  - target: Impaired cardiomyocyte proliferation and differentiation
    description: >
      The models demonstrate cell-autonomous proliferation and differentiation defects underlying
      the hypoplasia.
  - target: Genetic lesion affecting cardiac growth or valvulogenesis
    description: >
      Eight independent lines establish the multigenic architecture the trigger node describes.
  publication: PMID:29569026
  evidence:
  - reference: PMID:29569026
    reference_title: "The Genetic Landscape of Hypoplastic Left Heart Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Analysis of 8 independent HLHS mouse lines showed HLHS is genetically heterogeneous and multigenic in etiology."
    explanation: >-
      Establishes the multigenic architecture from independently derived lines rather than from a
      single mutant.
  - reference: PMID:29569026
    reference_title: "The Genetic Landscape of Hypoplastic Left Heart Syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The findings of similar defects of lesser severity in the right ventricle suggest this could contribute to the heart failure risks in surgically palliated HLHS patients."
    explanation: >-
      Provides the model-organism counterpart of the recessive-variant finding in patients, that
      the right ventricle is not a normal chamber pressed into abnormal service but is itself
      affected.

diagnosis:
- name: Fetal echocardiography
  description: >
    Prenatal diagnosis, which for this disease is not simply earlier diagnosis but a different
    clinical situation. It permits delivery at a surgical centre with prostaglandin ready, and in
    the evolving form it permits serial assessment and the possibility of fetal intervention.

- name: Newborn pulse oximetry screening
  description: >
    Detection of the ductal-dependent circulation before collapse by measuring saturation in a
    well infant. It works here because the mixing lesion produces measurable desaturation before
    it produces symptoms, and it is the intervention that most changes whether a child presents
    electively or in shock.

- name: Postnatal echocardiography
  description: >
    Confirms the anatomy and, critically, the adequacy of the interatrial communication, since a
    restrictive atrial septum obstructs pulmonary venous return and constitutes an emergency
    separate from the ductal one.

- name: Genetic and cytogenetic testing
  description: >
    Chromosomal analysis and sequencing, offered because a minority of cases occur within a
    cytogenetic syndrome and because family clustering establishes heritability. What testing
    can deliver here is bounded in an unusual way. It reliably identifies the syndromic minority,
    and it usually does not identify a causal variant in the rest, not because the sequencing is
    inadequate but because the inheritance is not the kind a single variant explains. Counselling
    therefore has to distinguish a syndromic diagnosis, which carries its own recurrence risk and
    extracardiac surveillance, from a negative result, which does not mean the disease is
    non-genetic.
  evidence:
  - reference: PMID:38884762
    reference_title: "Human Genetics of Hypoplastic Left Heart Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The implication of this conclusion is that researchers must move beyond the expectation that a single disease-causing variant can be found."
    explanation: >-
      Supports the limitation this diagnostic entry records, that a negative sequencing result is
      the expected outcome rather than an informative exclusion.

progression:
- phase: Mid-gestation
  notes: >
    In the evolving form, critical aortic stenosis is present while the left ventricle is still
    of adequate size. This is the only window in which the disease can be modified rather than
    palliated.

- phase: Term
  notes: >
    Left heart structures are established as hypoplastic or atretic and the circulation is
    committed to ductal dependence.

- phase: First days of life
  notes: >
    The duct closes and systemic perfusion fails without prostaglandin. This is the point at which
    the disease was uniformly fatal before surgical palliation.

- phase: Staged palliation through childhood
  notes: >
    Three operations over the first few years convert the parallel circulation to a series
    circulation with a systemic right ventricle and passive pulmonary flow.

- phase: Adult survivorship
  notes: >
    Fewer than a third are alive without transplantation at thirty-five years, and the figure has
    not improved across recent surgical eras. Outcome is heterogeneous, with a subset reporting
    good to excellent health.
  evidence:
  - reference: PMID:40533128
    reference_title: "Long-Term Survival and Patient-Reported Outcomes After Staged Reconstructive Surgery for Hypoplastic Left Heart Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this cohort of newborns undergoing staged reconstructive surgery for HLHS, fewer than one-third are alive without a transplant at 35 years of age. Survival has not improved in recent years."
    explanation: >-
      Supports both the long-term survival figure and the plateau, in a cohort of over two
      thousand neonates spanning four decades.

differential_diagnoses:
- name: Critical aortic stenosis with an adequate left ventricle
  description: >
    The distinction that matters most before birth, because it separates a fetus who might be
    offered valvuloplasty and a biventricular outcome from one already committed to single
    ventricle palliation. It is a judgement about a spectrum rather than a categorical difference,
    which is why the evolving form is curated as a subtype here.

- name: Other functionally univentricular hearts
  description: >
    Tricuspid atresia, double inlet left ventricle, and unbalanced atrioventricular septal defect
    all end in the same Fontan pathway. They are worth distinguishing because outcomes differ, and
    this disease does worse than the others despite the same operation and the same systemic right
    ventricle.

- name: Neonatal sepsis
  description: >
    Shares shock, acidosis, and poor perfusion in a previously well newborn, and is the diagnosis
    usually reached first in an infant who collapses on ductal closure without a prenatal
    diagnosis. Fluid resuscitation and antibiotics do not help, and the delay is consequential.

prevalence:
- population: Newborns with congenital heart disease
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >
    An estimated three percent of newborns with congenital heart disease develop this condition.
    That is a proportion of a diseased population rather than a population rate, so it is recorded
    in notes with its own evidence rather than normalised into a rate per hundred thousand, which
    would misrepresent the denominator.
  evidence:
  - reference: PMID:40386366
    reference_title: "Hypoplastic left heart syndrome-a scoping review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An estimated 3% of all newborns with congenital heart disease develop hypoplastic left heart syndrome (HLHS), making it a prominent cause of mortality in this group if surgical procedures or a heart transplant are not implemented."
    explanation: >-
      Gives the proportion among newborns with congenital heart disease, which is the denominator
      this record uses.

discussions:
- discussion_id: what_starts_the_disease
  kind: CONTROVERSY
  status: OPEN
  prompt: >
    Does hypoplastic left heart syndrome begin with a myocardial defect, with a valvar
    obstruction, or with something that produces both?
  rationale: >
    This is the field's central unsettled question and it is unusual in being a dispute about the
    kind of cause rather than the identity of one. The flow theory has the strongest human
    support, since relieving an obstruction in mid-gestation lets left-sided structures grow. The
    intrinsic-defect account has the strongest cellular support, since the first genetic mouse
    model showed proliferation and differentiation defects and a second, independent model in a
    different organism agreed. The reconciling position, that a myocardial defect impairs pump
    function and the resulting flow deficit produces the structural lesion, is supported by a
    tissue-restricted rescue but rests on one model organism with a heart that has no left
    ventricle. The practical stake is which fetuses can be helped, since only the mechanical
    component is currently addressable.
  attaches_to:
  - "pathophysiology#Reduced flow through the left heart"
  - "pathophysiology#Impaired cardiomyocyte proliferation and differentiation"
  evidence:
  - reference: PMID:42200818
    reference_title: "Is There a Unified Etiology of Hypoplastic Left Heart Syndrome? Evaluating Genetic, Structural, and Hemodynamic Models of Disease Initiation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "No single hypothesis has fully explained how HLHS is initiated, progresses, and presents with the clinical conditions that are encountered by cardiac surgeons and cardiologists."
    explanation: >-
      The review's own verdict, which is the reason this entry curates three hypothesis groups
      rather than selecting one. Evidence source is OTHER because it is a review.
  proposed_experiments:
  - experiment_id: exp_genotype_stratified_fetal_intervention
    name: Genotype-stratified analysis of fetal valvuloplasty response
    description: >
      Sequence a cohort undergoing fetal aortic valvuloplasty and test whether achieving a
      biventricular circulation is predicted by the absence of variants in myocardial growth and
      sarcomeric genes. The three hypotheses make different predictions. Pure flow theory predicts
      no genotype effect, the intrinsic-defect model predicts poor response regardless, and the
      reconciling model predicts response is graded by how much of the pump deficit is mechanical.

- discussion_id: is_late_right_ventricular_failure_a_myopathy
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    Is failure of the systemic right ventricle after palliation an afterload consequence, an
    expression of the same myocardial defect that arrested the left ventricle, or both?
  rationale: >
    The default assumption is mechanical, that a chamber built for low pressure eventually fails
    under systemic load. Two independent observations complicate it. Patients with this disease
    fare substantially worse after Fontan palliation than patients with other anatomies who have
    the same systemic right ventricle and the same operation, which points at something in the
    disease rather than in the load. And recessive sarcomeric variants were found in patients who
    developed late right ventricular dysfunction, with the authors framing it as one molecular
    basis expressed as developmental arrest on the left and latent myopathy on the right. If that
    is general, then some patients are destined to fail regardless of haemodynamic optimisation,
    and identifying them prospectively would change transplant listing rather than only prognosis.
  attaches_to:
  - "pathophysiology#Systemic right ventricle after staged palliation"
  evidence:
  - reference: PMID:39604028
    reference_title: "Cardiovascular Outcomes Associated With Hypoplastic Left Heart Syndrome Versus Other Types of Single Ventricle With a Predominant Right Ventricle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The composite outcome occurred in 7.1 versus 2.1 cases per 100 person-years in patients with HLHS versus non-HLHS (P<0.0001)."
    explanation: >-
      Isolates the disease from the operation and the ventricular morphology by comparing against
      other single-ventricle anatomies, which is what makes the excess risk informative about
      intrinsic myocardium.
  - reference: PMID:26085007
    reference_title: "Recessive MYH6 Mutations in Hypoplastic Left Heart With Reduced Ejection Fraction."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings implicate a shared molecular basis for the developmental arrest and latent myopathy of left and right ventricles, respectively."
    explanation: >-
      States the hypothesis in the authors' own terms. Graded PARTIAL because it rests on two
      patients and cannot establish how much of the population-level excess risk it explains.
  proposed_experiments:
  - experiment_id: exp_sarcomeric_genotype_and_fontan_rv_function
    name: Sarcomeric genotype and systemic right ventricular trajectory
    description: >
      In a multicentre Fontan cohort, test whether rare sarcomeric and cardiomyopathy-gene variant
      burden predicts the rate of decline in systemic right ventricular ejection fraction
      independently of haemodynamic variables, using other single-ventricle anatomies as the
      comparator group.

- discussion_id: model_systems_lack_a_left_ventricle
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >
    Can a disease defined by the failure of one specific chamber to grow be modelled in organisms
    whose hearts are not built the same way?
  rationale: >
    The two model systems that carry most of the mechanistic weight in this entry both have an
    anatomical mismatch with the disease. The zebrafish heart has a single ventricle and no left
    heart in the mammalian sense, so a model of RBFOX2 loss can show that structural deficits are
    downstream of pump function without showing that the human left ventricle behaves the same
    way. The mouse has the right anatomy but reaches the phenotype through mutations that are not
    the ones most human patients carry, and the human genetic architecture includes
    lower-penetrance and common variation that single-locus mouse lines do not represent. This is
    a fidelity question rather than an absence of evidence, since the experiments themselves are
    strong. What is uncertain is how far a conclusion about causal order in a two-chambered heart
    transfers to a four-chambered one.
  attaches_to:
  - "pathophysiology#Impaired cardiomyocyte proliferation and differentiation"
  - "pathophysiology#Reduced flow through the left heart"
  evidence:
  - reference: PMID:36198703
    reference_title: "Intrinsic myocardial defects underlie an Rbfox-deficient zebrafish model of hypoplastic left heart syndrome."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we report that zebrafish lacking two orthologs of the RNA binding protein RBFOX2, a gene linked to HLHS in humans, display cardiovascular defects overlapping those in HLHS patients including ventricular, valve, and aortic deficiencies."
    explanation: >-
      The word overlapping is doing the work. The defects correspond rather than being identical,
      which is the mismatch this discussion is about. Graded PARTIAL for that reason.
  - reference: PMID:36286267
    reference_title: "Considering the Genetic Architecture of Hypoplastic Left Heart Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, unlike classical Mendelian disorders where a relatively small number of genes are largely determinative of the occurrence and severity of the disease, the picture in HLHS is complex."
    explanation: >-
      Supports the second half of the mismatch, that the human genetic architecture is not the
      single-locus architecture the mouse lines instantiate.
  proposed_experiments:
  - experiment_id: exp_human_cardiac_organoid_flow_manipulation
    name: Flow manipulation in patient-derived human cardiac organoids
    description: >
      Use patient-derived induced pluripotent stem cell cardiac organoids or chamber-forming
      cardioids carrying HLHS-associated variants, with controlled perfusion, to test whether the
      growth deficit is cell-autonomous, flow-dependent, or both in human tissue with human
      genetic background, closing the anatomical and genetic gaps the animal models leave open.

notes: >
  Scope. This entry curates hypoplastic left heart syndrome including the palliated circulation as
  a disease state, on the reasoning that staged palliation does not repair the lesion and that the
  late complications belong to the reconstructed physiology. The neurodevelopmental, hepatic, and
  lymphatic sequelae of the Fontan circulation are consequences of that physiology and are named
  in the prose without being curated as nodes, since this entry cites no evidence for them.

  Module conformance. None is declared. The obvious candidate,
  cardiomyopathy_maladaptive_remodeling, describes an insult to a normally formed heart followed
  by neurohormonal activation and ventricular remodelling. The systemic right ventricle here is a
  congenitally normal chamber placed in an abnormal circulation, and the entry's own argument is
  that its failure may be partly a myopathy present from the start rather than remodelling in
  response to load. Declaring conformance would assert the mechanism the entry is careful to leave
  open. If the afterload arm were curated separately with its own evidence it would be a
  legitimate conformance target.

  Competing hypotheses. Three mechanistic_hypotheses groups are curated rather than one, because
  the disagreement about this disease is real and current, and because the causal edges genuinely
  differ between the models rather than merely being described differently. Edges opt into
  hypothesis groups so a reader can see which parts of the pathograph each model owns. The
  reconciling group is marked EMERGING and rests on a single model organism.

  Deep-research provenance. Curated from a claude_code deep-research report treated as leads only.
  Its citations were reliable, with all ten identifiers resolving to the papers claimed and
  correctly characterised. Its ontology suggestions were less so. UBERON:0002094 was offered for
  left ventricle and is the interventricular septum, and UBERON:0002078 was offered for right
  ventricle and is the right cardiac atrium. The correct terms used here are UBERON:0002084 and
  UBERON:0002080, with UBERON:0002135 for the mitral valve, which the report did not supply.

  NEC preflight returned SKIP, since MONDO records no causal gene. The manual fallback passed. The
  report's OMIM identifiers 241550 and 614435 are the two designated subtypes of this disease and
  190198 and 600584 are NOTCH1 and NKX2-5, and the top gene mentions, NOTCH1, MYH6, NKX2-5,
  SAP130, and HAND1, are all genuine loci for it. SAP130 is discussed in this entry's prose as the
  gene behind the first mouse model but is not curated as a genetic entry, because the evidence
  cited here is about the mouse lines collectively rather than about that locus in patients.

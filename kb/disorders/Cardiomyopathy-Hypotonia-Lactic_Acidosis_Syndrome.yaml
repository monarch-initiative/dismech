    evidence_source: HUMAN_CLINICAL
    snippet: "The critical dependence on mitochondria as an energy source is especially evident in tissues with high-energy demands such as the heart, muscle; defects in the mitochondrial energy production machinery underlie a wide range of primary mitochondrial disorders that present with cardiac and muscle diseases."
    explanation: Explains why heart and skeletal muscle are the target organs of a mitochondrial ATP-production defect such as phosphate-carrier deficiency.
  - reference: PMID:39671292

inheritance:
- name: Autosomal recessive
  description: >-
    Disease is caused by biallelic (homozygous or compound heterozygous)
    pathogenic variants in SLC25A3. Reported families include consanguineous and
    non-consanguineous pedigrees with homozygous exon 3A or exon 3A splice-region
    alleles, and one compound heterozygote.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:40944834
    reference_title: "Expanding the Clinical Spectrum of Mitochondrial Phosphate Carrier Deficiency: A Case Report With Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mitochondrial phosphate carrier (PiC) deficiency, caused by pathogenic variants in the SLC25A3 gene, is a rare autosomal recessive disorder primarily presenting with early-onset hypertrophic cardiomyopathy (HCMP), muscular hypotonia, and respiratory failure."
    explanation: States explicitly that SLC25A3-related PiC deficiency is autosomal recessive.
  - reference: PMID:17273968
    reference_title: "Mitochondrial phosphate-carrier deficiency: a novel disorder of oxidative phosphorylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a homozygous mutation--c.215G-->A (p.Gly72Glu)--in the alternatively spliced exon 3A of this enzyme in two siblings with lactic acidosis, hypertrophic cardiomyopathy, and muscular hypotonia who died within the 1st year of life."
    explanation: Homozygosity in two affected siblings of unaffected parents is consistent with autosomal recessive inheritance.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence estimate exists. The disorder was first described in
    2007 in two sisters from a non-consanguineous Turkish family; as of 2014-2015
    the literature comprised only two affected sibships, to which a small number
    of additional single-patient and single-family reports have since been added.
    Fewer than about a dozen molecularly confirmed patients have been published,
    so the only defensible occurrence statement is a literature case count in the
    ultra-rare band.
  evidence:
  - reference: PMID:25681081
    reference_title: "Pathologic Variants of the Mitochondrial Phosphate Carrier SLC25A3: Two New Patients and Expansion of the Cardiomyopathy/Skeletal Myopathy Phenotype With and Without Lactic Acidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The literature described two affected sibships with variants in SLC25A3; all cases had skeletal myopathy and cardiomyopathy (OMIM 610773)."
    explanation: Documents that the entire published literature at that time comprised two affected sibships, establishing the case-count basis for the ultra-rare classification.
  - reference: PMID:40362619
    reference_title: "Rescue of the First Mitochondrial Membrane Carrier, the mPiC, by TAT-Mediated Protein Replacement Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Variants in SLC25A3 exist and lead to mPiC deficiency (MPCD), cause a rare autosomal recessive disease with no current cure; patients with MPCD usually die within the first year of life."
    explanation: Confirms the disorder is rare. Evidence source is OTHER because this statement is background framing in a methods paper rather than an epidemiological study.

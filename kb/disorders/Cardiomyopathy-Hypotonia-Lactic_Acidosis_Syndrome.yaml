pathophysiology:
- name: Tissue-Specific Exon 3A/3B Alternative Splicing of SLC25A3
  biological_scale: MOLECULAR
  description: >-
    The single SLC25A3 gene produces two mutually exclusive carrier isoforms by
    alternative splicing of exon 3A or exon 3B, which differ in 13 amino acids
    near the N-terminus. Isoform A (exon 3A) is the higher-affinity carrier
    expressed almost exclusively in heart, skeletal muscle, and diaphragm; isoform
    B (exon 3B) is ubiquitous. Because most reported pathogenic SLC25A3 alleles
    lie in exon 3A or its splice acceptor, the resulting carrier defect is
    restricted to striated muscle while other tissues retain functional isoform B.
    This splicing architecture is the mechanistic explanation for the
    cardiac-and-muscle-predominant phenotype and for the observation that patient
    fibroblasts, which use isoform B, have normal ATP synthesis.

- name: SLC25A3 Exon 3A Splice-Acceptor Variant
  biological_scale: MOLECULAR
  description: >-
    The homozygous intronic c.158-9A>G variant creates an alternative splice acceptor immediately before
    exon 3A. This is an isoform-specific RNA-processing lesion, distinct from the coding G72E allele.
  evidence:
  - reference: PMID:21763135
    reference_title: "Deficiency of the mitochondrial phosphate carrier presenting as myopathy and cardiomyopathy in a family with three affected children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a homozygous mutation c.158-9A>G located in the 5'-intron next to exon 3A specific for heart and skeletal muscle. This creates a novel splice site resulting in a more than 95% decrease of the wild type allele."
    explanation: Reports the variant and quantifies its effect on wild-type exon 3A transcript levels.

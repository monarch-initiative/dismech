    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a homozygous mutation--c.215G-->A (p.Gly72Glu)--in the alternatively spliced exon 3A of this enzyme in two siblings with lactic acidosis, hypertrophic cardiomyopathy, and muscular hypotonia who died within the 1st year of life."
    explanation: Hypertrophic cardiomyopathy in both siblings of the index family.
  - reference: PMID:21763135
    reference_title: "Deficiency of the mitochondrial phosphate carrier presenting as myopathy and cardiomyopathy in a family with three affected children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

- hypertrophic cardiomyopathy with hypotonia and lactic acidosis syndrome
notes: >-
  The GeneReviews baseline check found no matching chapter in the 2026-09-10 Bookshelf snapshot. Phenotype
  frequency bands and a current worldwide patient count are omitted because the available reports do not
  establish population frequencies or an exhaustive census. Prenatal, neonatal and later presentations
  are a clinical spectrum, not separately established molecular subtypes. PMID:40505409 describes a Spanish-family
  report, but neither the initial fetch nor a forced retry retrieved quotable text; its findings are not
  inferred from the title. PMID:34052969 is a broader mitochondrial-ataxia cohort whose retrieved abstract
  does not establish SLC25A3-specific ataxia. The meclizine study (PMID:40950028) and myotube-survival
  study (PMID:42282837) are preprints; their findings are retained only as explicitly provisional model
  evidence.

name: Cardiomyopathy-Hypotonia-Lactic Acidosis Syndrome
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
description: >-
  Cardiomyopathy-hypotonia-lactic acidosis syndrome (mitochondrial phosphate carrier deficiency, SLC25A3
  deficiency) is a rare autosomal recessive mitochondrial disorder. SLC25A3 encodes the inner-membrane
  carrier for inorganic phosphate and copper. Phosphate import supports mitochondrial ATP synthesis; copper
  transport supports respiratory-complex assembly and mitochondrial organization in experimental systems.
  Variants affecting alternatively spliced exon 3A preferentially disrupt the isoform enriched in heart
  and skeletal muscle, whereas variants in shared coding regions can also affect fibroblasts. Reported
  presentations include neonatal hypertrophic cardiomyopathy, hypotonia and lactic acidosis, but cardiomyopathy
  without lactic acidosis or clinical skeletal myopathy also occurs. Outcomes range from infantile death
  to survival after heart transplantation or into adulthood with residual myopathy. The relative contributions
  of phosphate transport, copper handling and mitochondrial dynamics to patient disease remain incompletely
  resolved.
disease_term:
  preferred_term: cardiomyopathy-hypotonia-lactic acidosis syndrome
  term:

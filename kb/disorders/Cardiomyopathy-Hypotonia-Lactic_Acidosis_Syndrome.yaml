- name: Aberrant Exon 3A Splicing
  biological_scale: MOLECULAR
  description: >-
    The recurrent acceptor variant produces abnormal exon-3A RNA with intronic sequence inclusion and
    a marked reduction of normal transcript. The resulting frameshift/early termination is predicted;
    muscle immunodetection independently shows reduced carrier protein.

    evidence_source: HUMAN_CLINICAL
    snippet: "Functional investigation of intact mitochondria showed a deficiency of ATP synthesis in muscle but not in fibroblasts, which correlated with the tissue-specific expression of exon 3A in muscle versus exon 3B in fibroblasts."
    explanation: Establishes the tissue-restricted ATP-synthesis defect as the functional biochemical signature.

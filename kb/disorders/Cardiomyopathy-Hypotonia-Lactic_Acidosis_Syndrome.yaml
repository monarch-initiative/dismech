progression:
- phase: Prenatal or neonatal presentation
  age_range: prenatal period to first weeks of life
  notes: >-
    Hypertrophic cardiomyopathy can be detected prenatally. Neonatal hypotonia, respiratory decompensation
    and lactic acidosis characterize several reports, but the complete triad is not required.
  evidence:
  - reference: PMID:21763135
    reference_title: "Deficiency of the mitochondrial phosphate carrier presenting as myopathy and cardiomyopathy in a family with three affected children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a family three children presented with severe neonatal lactic acidosis, hypertrophic cardiomyopathy and generalised muscular hypotonia."
    explanation: Documents the neonatal onset of the full triad.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4501241/?pdf=1
    reference_title: "Pathologic Variants of the Mitochondrial Phosphate Carrier SLC25A3: Two New Patients and Expansion of the Cardiomyopathy/Skeletal Myopathy Phenotype With and Without Lactic Acidosis - PMC"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Pregnancy was unremarkable except for hypertrophic cardiomyopathy noted on the second trimester ultrasound examination and confirmed by fetal echocardiogram.
    explanation: >-
      Prenatal cardiac onset in patient 2.
- phase: Infantile-lethal course
  age_range: first year of life
  notes: >-
    Both siblings in the founding G72E family died in infancy, and one child in the recurrent splice-variant
    family also died. These case observations do not establish that infantile death is the usual outcome
    across all genotypes.
  evidence:
  - reference: PMID:17273968
    reference_title: "Mitochondrial phosphate-carrier deficiency: a novel disorder of oxidative phosphorylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two siblings with lactic acidosis, hypertrophic cardiomyopathy, and muscular hypotonia who died within the 1st year of life"
    explanation: Both index-family siblings died within the first year of life.
- phase: Long-term survival with residual myopathy
  age_range: childhood to adulthood
  notes: >-
    Reported survivors include siblings with exercise intolerance, proximal weakness, stable hypertrophic
    cardiomyopathy and normal mental development, and an adult stable at age 32 despite persistent hyperlactatemia.
    These reports establish possible long-term survival, not its probability or a reliably mild splice-variant
    genotype.
  evidence:
  - reference: PMID:21763135
    reference_title: "Deficiency of the mitochondrial phosphate carrier presenting as myopathy and cardiomyopathy in a family with three affected children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At an age of 9 and 17years, respectively, they present with exercise intolerance, proximal muscle weakness, non-progressive hypertrophic cardiomyopathy and normal mental development."
    explanation: Documents long-term survival with a stable myopathic and cardiac phenotype.
  - reference: PMID:40944834
    reference_title: "Expanding the Clinical Spectrum of Mitochondrial Phosphate Carrier Deficiency: A Case Report With Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the age of 32 years, the patient remained stable with HCMP and persistently high lactate levels."
    explanation: >-
      Documents a survivor stable at age 32; does not establish an exhaustive age maximum.
pathophysiology:
- name: SLC25A3 Exon 3A G72E Variant
  biological_scale: MOLECULAR
  description: >-
    Homozygous c.215G>A in the muscle-enriched exon 3A changes Gly72 to glutamate in isoform A (NM_005888
    in the original report). Normal mutually exclusive exon selection determines the affected tissue context;
    splicing itself is not the initiating lesion.
  evidence:
  - reference: PMID:17273968
    reference_title: "Mitochondrial phosphate-carrier deficiency: a novel disorder of oxidative phosphorylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a homozygous mutation--c.215G-->A (p.Gly72Glu)--in the alternatively spliced exon 3A of this enzyme in two siblings with lactic acidosis, hypertrophic cardiomyopathy, and muscular hypotonia who died within the 1st year of life."
    explanation: Reports the homozygous exon 3A missense allele in the index family.
  - reference: PMID:17273968
    reference_title: "Mitochondrial phosphate-carrier deficiency: a novel disorder of oxidative phosphorylation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The enzyme defect was confirmed by complementation analysis in yeast."
    explanation: Yeast complementation provides functional confirmation of pathogenicity.
  - reference: PMID:38986607
    reference_title: Slc25a3-dependent copper transport controls flickering-induced Opa1 processing for mitochondrial safeguard.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Finally, atomic absorption spectrometry of isolated mitochondria showed that Slc25a3 (G72E) could not replenish mitochondrial copper levels in Drp1Slc25a3-KO MEFs (Fig. 7L).
    explanation: >-
      Patient-allele functional test in engineered mouse embryonic fibroblasts, not patient muscle.

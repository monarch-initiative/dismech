diagnosis:
- name: Molecular diagnosis by SLC25A3 sequencing
  description: >-
    Because the classical presentation - early-onset hypertrophic cardiomyopathy
    with lactic acidosis - is shared with several other mitochondrial and metabolic
    cardiomyopathies (and with infantile-onset Pompe disease), and because standard
    respiratory-chain enzyme panels and fibroblast studies are normal in this
    disorder, molecular sequencing of SLC25A3 is the practical diagnostic route.
    Sequencing should be considered even in isolated cardiomyopathy without
    myopathy or lactic acidosis.
  evidence:
  - reference: PMID:25681081
    reference_title: "Pathologic Variants of the Mitochondrial Phosphate Carrier SLC25A3: Two New Patients and Expansion of the Cardiomyopathy/Skeletal Myopathy Phenotype With and Without Lactic Acidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of SLC25A3 should be considered in patients with isolated cardiomyopathy, even those without generalized skeletal myopathy or lactic acidosis."
    explanation: Explicit diagnostic recommendation from the authors who expanded the phenotype.
  - reference: PMID:38656665
    reference_title: "Mitochondrial phosphate-carrier deficiency mimicking infantile-onset Pompe disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The characteristic clinical picture of a prominent early-onset hypertrophic cardiomyopathy and lactic acidosis may be an indication for analysis of the SLC25A3 gene."
    explanation: Identifies the clinical trigger for SLC25A3 testing.
differential_diagnoses:
- name: Infantile-onset Pompe disease
  description: >-
    Glycogen storage disease type II presents with the same combination of
    infantile hypertrophic cardiomyopathy, hypotonia, and raised creatine kinase,
    and has been the initial working diagnosis in at least one patient later shown
    to have mitochondrial phosphate-carrier deficiency. Acid alpha-glucosidase
    assay distinguishes the two.
  evidence:
  - reference: PMID:38656665
    reference_title: "Mitochondrial phosphate-carrier deficiency mimicking infantile-onset Pompe disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, described a patient with suspicion of infantile Pompe disease due to involvement of heart and muscle and high-level of plasma creatinine kinase but finally diagnosed mitochondrial phosphate-carrier deficiency."
    explanation: A published case in which infantile Pompe disease was the initial clinical suspicion.
treatments:
- name: Supportive and Heart-Failure Directed Care
  description: >-
    No curative or disease-modifying therapy exists. Management is supportive and
    phenotype-directed: heart-failure management and cardiac surveillance for the
    hypertrophic cardiomyopathy, respiratory support, treatment of lactic acidosis
    and avoidance of catabolic stress, and nutritional support. Prognosis in the
    classical form remains poor, with most patients dying in the first year of
    life.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:40362619
    reference_title: "Rescue of the First Mitochondrial Membrane Carrier, the mPiC, by TAT-Mediated Protein Replacement Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Variants in SLC25A3 exist and lead to mPiC deficiency (MPCD), cause a rare autosomal recessive disease with no current cure; patients with MPCD usually die within the first year of life."
    explanation: States explicitly that no cure exists and that the classical course is lethal in infancy, which is why care is supportive.
- name: Mitochondrial Cofactor Therapy and Fat-Rich Diet
  description: >-
    Empirical "mitochondrial cocktail" supplementation combined with a fat-rich
    (low-carbohydrate) diet was used in the longest-surviving reported patient and
    was associated with clinical improvement, although blood lactate remained
    elevated. This is a single-patient observation, not a trial result; there are
    no controlled efficacy data for any metabolic therapy in this disorder, and no
    specific agent can be recommended on the published evidence.
  therapeutic_modality: BEHAVIORAL
  context: >-
    Single-case, uncontrolled observation in a 32-year-old with the c.158-9A>G
    genotype. The dietary component is why the modality is tagged BEHAVIORAL; the
    specific cofactor agents were not named in the source abstract, so no
    therapeutic_agent is asserted.
  treatment_term:
    preferred_term: Dietary Intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  evidence:
  - reference: PMID:40944834
    reference_title: "Expanding the Clinical Spectrum of Mitochondrial Phosphate Carrier Deficiency: A Case Report With Literature Review."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient was treated with mitochondrial therapy, along with a fat-rich diet. Despite clinical improvement, lactate levels remained elevated."
    explanation: Marked PARTIAL because this is an uncontrolled single-patient observation with an incomplete biochemical response.
- name: Genetic Counseling
  description: >-
    Autosomal recessive inheritance carries a 25% recurrence risk for siblings. Two
    of the reported pedigrees had multiple affected children, so counselling and
    discussion of prenatal or preimplantation testing are relevant once the
    familial variants are known.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:21763135
    reference_title: "Deficiency of the mitochondrial phosphate carrier presenting as myopathy and cardiomyopathy in a family with three affected children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a family three children presented with severe neonatal lactic acidosis, hypertrophic cardiomyopathy and generalised muscular hypotonia."
    explanation: Three affected children in one sibship illustrates the recurrence risk that makes genetic counselling relevant.
- name: TAT-mPiC Protein Replacement (investigational, preclinical)
  description: >-
    A cell-penetrating TAT-fused recombinant phosphate carrier delivered to
    mPiC-knockdown cells localised correctly to the inner mitochondrial membrane
    and restored oxygen consumption, ATP production, matrix phosphate and copper
    delivery, and reduced lactate secretion. This is a preclinical cell-culture
    result only - there are no animal efficacy data and no human studies. It is
    recorded here as a mechanism-directed investigational strategy, not a clinical
    option.
  therapeutic_modality: PROTEIN_REPLACEMENT
  context: >-
    Preclinical, in vitro (mPiC-knockdown cell lines). No animal or human efficacy
    data.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Loss of Mitochondrial Phosphate Carrier Function in Heart and Skeletal Muscle
    treatment_effect: RESTORES
    description: >-
      Exogenous carrier protein delivered into mitochondria substitutes for the
      deficient endogenous carrier, restoring matrix phosphate transport.
  evidence:
  - reference: PMID:40362619
    reference_title: "Rescue of the First Mitochondrial Membrane Carrier, the mPiC, by TAT-Mediated Protein Replacement Treatment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Treatment of mPiC-knockdown cells with TAT-mPiC fusion protein increased cell growth and improved bioenergetic capabilities, as measured by oxygen consumption rate (OCR), ATP production, and reduction in lactate secretion."
    explanation: Demonstrates functional rescue of the bioenergetic defect in vitro.
  - reference: PMID:40362619
    reference_title: "Rescue of the First Mitochondrial Membrane Carrier, the mPiC, by TAT-Mediated Protein Replacement Treatment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This study presents the first successful delivery of a mitochondrial transmembrane carrier using the TAT-fusion system, offering a potential early treatment strategy for newborns with mPiC deficiency."
    explanation: The authors frame this explicitly as a potential, not established, treatment strategy.
- name: Mitochondrial Transplantation (investigational, preclinical)
  description: >-
    Transfer of exogenous healthy mitochondria into SLC25A3-mutant human
    iPSC-derived cardiomyocytes was explored as a way to rescue the hypertrophic
    phenotype and calcium-handling imbalance. This is an exploratory in vitro
    finding in a disease-model cell system; no in vivo or clinical data exist.
  therapeutic_modality: CELL_THERAPY
  context: >-
    Preclinical, in vitro (SLC25A3-mutant hiPSC-derived cardiomyocytes). No animal
    or human efficacy data.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Cardiomyocyte and Skeletal Muscle Energy Deficit
    treatment_effect: RESTORES
    description: >-
      Supplying functional mitochondria is intended to relieve the cardiomyocyte
      bioenergetic deficit that drives the hypertrophic response.
  evidence:
  - reference: PMID:39671292
    reference_title: "Mitochondrial transplantation rescues Ca(2+) homeostasis imbalance and myocardial hypertrophy in SLC25A3-related hypertrophic cardiomyopathy."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Finally, we explored the prospective therapeutic implications of mitochondrial transplantation in rescuing SLC25A3-related HCM."
    explanation: Marked PARTIAL because the authors describe this as an exploratory, prospective therapeutic implication rather than a demonstrated therapy.
discussions:
- discussion_id: mismatch_copper_cox_arm_not_seen_in_patients
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the copper-transport / cytochrome c oxidase arm of SLC25A3 function,
    demonstrated in knockdown cell lines and reconstituted systems, actually
    contribute to human cardiomyopathy-hypotonia-lactic acidosis syndrome, given
    that patient muscle biopsies show normal respiratory-chain enzyme activities?
  attaches_to:
  - pathophysiology#Impaired Mitochondrial Copper Delivery and Cytochrome c Oxidase Biogenesis
  - pathophysiology#Loss of Mitochondrial Phosphate Carrier Function in Heart and Skeletal Muscle
  rationale: >-
    SLC25A3 has been shown directly, in Lactococcus lactis and reconstituted
    liposomes, to transport copper, and knockdown or deletion in murine and human
    cell lines produces an isolated cytochrome c oxidase deficiency that copper
    supplementation rescues. If that arm operated in patients, one would expect
    reduced COX activity in affected muscle. Instead, the patient muscle biopsy
    reported by Mayr et al. showed normal respiratory-chain enzyme activities with
    only the carrier protein reduced, and histopathology in a long-surviving adult
    showed mildly increased rather than decreased COX and SDH staining. The
    evidence therefore exists in a model system but its translational validity to
    human SLC25A3 disease is the open question, which is why this is recorded as
    HUMAN_MODEL_MISMATCH rather than a plain knowledge gap. Possible resolutions
    include isoform specificity (the copper work used total SLC25A3 loss, whereas
    most patient alleles ablate only isoform A), residual isoform B sufficing for
    copper delivery in patient muscle, or the copper function being dispensable in
    vivo.
  proposed_experiments:
  - experiment_id: exp_slc25a3_isoform_copper_cox
    name: Isoform-resolved copper transport and COX metalation assay
    description: >-
      In isogenic human iPSC-derived cardiomyocytes engineered to carry (a) an exon
      3A-specific patient allele, (b) a total SLC25A3 knockout, and (c) the
      corrected genotype, quantify matrix copper, COX holoenzyme assembly and
      activity, and the response to copper supplementation. This directly tests
      whether the copper/COX arm is engaged by isoform-A-selective patient alleles
      or only by total carrier loss, reconciling the cell-line and patient-muscle
      observations.
    experiment_type:
      preferred_term: iPSC-derived cardiomyocyte perturbation assay
    model_systems:
    - name: Human iPSC-derived cardiomyocyte
      description: >-
        Cardiomyocytes differentiated from isogenic iPSC lines carrying
        exon-3A-selective versus total SLC25A3 loss, preserving the human isoform
        architecture that mouse and immortalised cell models do not reproduce.
      experimental_model_type: OTHER
  evidence:
  - reference: PMID:29237729
    reference_title: "The mammalian phosphate carrier SLC25A3 is a mitochondrial copper transporter required for cytochrome c oxidase biogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SLC25A3 knockdown or deletion consistently resulted in an isolated COX deficiency in these cells, and copper addition to the culture medium suppressed these biochemical defects."
    explanation: The model-system observation on one side of the mismatch.
  - reference: PMID:21763135
    reference_title: "Deficiency of the mitochondrial phosphate carrier presenting as myopathy and cardiomyopathy in a family with three affected children."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In a muscle biopsy normal activity of respiratory chain enzymes was found; however the amount of the mitochondrial phosphate carrier was decreased."
    explanation: The human observation on the other side of the mismatch - normal respiratory-chain enzyme activity in patient muscle.
- discussion_id: gap_genotype_phenotype_severity_spectrum
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What determines whether an individual with biallelic SLC25A3 variants dies in
    the first year of life or survives into adulthood with non-progressive
    hypertrophic cardiomyopathy?
  attaches_to:
  - pathophysiology#Cardiomyocyte and Skeletal Muscle Energy Deficit
  rationale: >-
    The reported phenotypic range is extreme for a disorder with fewer than a dozen
    published patients: the index siblings died within the first year of life,
    whereas patients homozygous for the recurrent c.158-9A>G splice allele have
    survived to ages 9, 17, and 32 years with non-progressive hypertrophic
    cardiomyopathy and normal cognition, and one compound heterozygote had isolated
    cardiomyopathy with normal lactate and no myopathy. Whether the determinant is
    residual exon 3A transcript level, isoform-B compensation, modifier loci, or
    the standard of supportive care available at the time cannot be resolved from
    the published cases. The cohort is too small for a genotype-phenotype analysis,
    and no natural-history study exists.
  evidence:
  - reference: PMID:40944834
    reference_title: "Expanding the Clinical Spectrum of Mitochondrial Phosphate Carrier Deficiency: A Case Report With Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case supports the expansion of the clinical spectrum of mitochondrial PiC deficiency by presenting a patient with a later-onset phenotype compared to previously reported cases."
    explanation: Documents that the phenotypic spectrum is still expanding and is not yet explained.

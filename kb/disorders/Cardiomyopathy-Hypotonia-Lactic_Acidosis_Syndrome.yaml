    snippet: "Isoform A is highly expressed in heart and skeletal muscle. Isoform B is ubiquitously expressed in all tissues that were examined, although at different levels."
    explanation: Northern blot analysis establishes the tissue-restricted expression of the exon IIIA isoform in heart and skeletal muscle. Evidence source is MODEL_ORGANISM because the measurements were made in bovine, not human, tissue.
  - reference: PMID:9712911
    reference_title: "Expression in Escherichia coli, functional characterization, and tissue distribution of isoforms A and B of the phosphate carrier from bovine mitochondria."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Western blot analysis demonstrated that isoform A is present in high amounts in heart, skeletal muscle, and diaphragm mitochondria, whereas isoform B is present in the mitochondria of all tissues examined."
    explanation: Confirms the tissue-restricted distribution at the protein (not just transcript) level in bovine mitochondria.
  - reference: PMID:9712911
    reference_title: "Expression in Escherichia coli, functional characterization, and tissue distribution of isoforms A and B of the phosphate carrier from bovine mitochondria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The transport affinities of isoform B for phosphate and arsenate were found to be 3-fold lower than those of isoform A."
    explanation: Reconstituted-liposome kinetics show isoform A is the higher-affinity phosphate carrier, so loss of isoform A is not trivially compensated by residual isoform B in striated muscle.
  - reference: PMID:21763135
    reference_title: "Deficiency of the mitochondrial phosphate carrier presenting as myopathy and cardiomyopathy in a family with three affected children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This protein is expressed in two tissue-specific isoforms generated by mutually exclusive alternative splicing of the SLC25A3 gene transcript."
    explanation: States the mutually exclusive alternative-splicing architecture of human SLC25A3 in the context of patient disease.
  downstream:
  - target: Loss of Mitochondrial Phosphate Carrier Function in Heart and Skeletal Muscle
    causal_link_type: DIRECT
    description: >-
      Pathogenic variants in exon 3A or its splice acceptor abolish or deplete the
      muscle-specific isoform A carrier while sparing ubiquitous isoform B.
- name: Loss of Mitochondrial Phosphate Carrier Function in Heart and Skeletal Muscle
  biological_scale: MOLECULAR
  description: >-
    Biallelic SLC25A3 variants reduce the amount and/or transport activity of the
    inorganic phosphate carrier in the inner mitochondrial membrane of
    cardiomyocytes and skeletal myofibres. The Turkish index family carried a
    homozygous missense allele in exon 3A (p.Gly72Glu); other families carry a
    homozygous splice-acceptor allele (c.158-9A>G) that creates a novel splice
    site and eliminates more than 95% of the wild-type exon 3A transcript, and one
    patient is a compound heterozygote for two novel coding alleles. Muscle biopsy
    in affected children shows reduced carrier protein.
  mechanism_confidence: ESTABLISHED

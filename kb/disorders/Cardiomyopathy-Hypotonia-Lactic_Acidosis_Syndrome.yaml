- name: SLC25A3 Shared-Exon Compound Heterozygous Variants
  biological_scale: MOLECULAR
  description: >-
    The shared-exon compound genotype comprises L200W and the GSSAS-to-QIP delins, inherited on opposite
    parental alleles. Yeast assays identify loss of function for the delins, but not L200W under the conditions
    tested. Both isoforms contain these shared regions; the patient fibroblasts are abnormal despite the
    cardiac-predominant clinical presentation.

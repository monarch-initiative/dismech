diagnosis:
- name: Molecular diagnosis by SLC25A3 sequencing
  description: >-
    Molecular testing of SLC25A3 can establish a diagnosis in early-onset hypertrophic cardiomyopathy
    with or without lactic acidosis or skeletal myopathy. Normal respiratory-chain panels or fibroblast
    ATP-synthesis results do not exclude isoform-A disease; assay findings depend on genotype and tissue.
  evidence:
  - reference: PMID:25681081
    reference_title: "Pathologic Variants of the Mitochondrial Phosphate Carrier SLC25A3: Two New Patients and Expansion of the Cardiomyopathy/Skeletal Myopathy Phenotype With and Without Lactic Acidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of SLC25A3 should be considered in patients with isolated cardiomyopathy, even those without generalized skeletal myopathy or lactic acidosis."
    explanation: Explicit diagnostic recommendation from the authors who expanded the phenotype.
  - reference: PMID:38656665
    reference_title: "Mitochondrial phosphate-carrier deficiency mimicking infantile-onset Pompe disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The characteristic clinical picture of a prominent early-onset hypertrophic cardiomyopathy and lactic acidosis may be an indication for analysis of the SLC25A3 gene."
    explanation: Identifies the clinical trigger for SLC25A3 testing.
- name: Functional assessment of intact muscle mitochondria
  description: >-
    The founding study detected reduced ADP-stimulated respiration with preserved uncoupled respiration
    in fresh muscle mitochondria. Standard frozen-tissue respiratory-chain assays can miss the transport
    defect; this functional approach complements molecular testing.
  evidence:
  - reference: PMID:17273968
    reference_title: "Mitochondrial phosphate-carrier deficiency: a novel disorder of oxidative phosphorylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Deficiency of the mitochondrial PiC cannot be identified by the analysis of the mitochondrial-energy metabolism in frozen tissue.
    explanation: >-
      Diagnostic limitation described in the founding study.
  - reference: PMID:17273968
    reference_title: "Mitochondrial phosphate-carrier deficiency: a novel disorder of oxidative phosphorylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Functional investigation of intact mitochondria should be performed to detect disorders of ATP synthesis, including mitochondrial-PiC deficiency, and other mitochondrial transport defects.
    explanation: >-
      Authors recommend intact-mitochondrial functional assessment.
differential_diagnoses:
- name: Infantile-onset Pompe disease
  description: >-
    Glycogen storage disease type II presents with the same combination of
    infantile hypertrophic cardiomyopathy, hypotonia, and raised creatine kinase,
    and has been the initial working diagnosis in at least one patient later shown
    to have mitochondrial phosphate-carrier deficiency. Acid alpha-glucosidase
    assay distinguishes the two.
  evidence:
  - reference: PMID:38656665
    reference_title: "Mitochondrial phosphate-carrier deficiency mimicking infantile-onset Pompe disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, described a patient with suspicion of infantile Pompe disease due to involvement of heart and muscle and high-level of plasma creatinine kinase but finally diagnosed mitochondrial phosphate-carrier deficiency."
    explanation: A published case in which infantile Pompe disease was the initial clinical suspicion.
  - reference: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC4501241/?pdf=1
    reference_title: "Pathologic Variants of the Mitochondrial Phosphate Carrier SLC25A3: Two New Patients and Expansion of the Cardiomyopathy/Skeletal Myopathy Phenotype With and Without Lactic Acidosis - PMC"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: no evidence of Pompe disease with normal acid alpha-glucosidase activity levels.
    explanation: >-
      Enzyme testing excluded Pompe disease in the compound-genotype infant.

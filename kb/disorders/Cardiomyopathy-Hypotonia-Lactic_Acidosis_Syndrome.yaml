    term:
      id: MONDO:0009290
      label: glycogen storage disease II
treatments:
- name: Supportive and Heart-Failure Directed Care
  description: >-
    Published management includes ventilation, diuretics, beta blockers and inotropes for respiratory
    or cardiac decompensation, and supportive metabolic care. These are case-based supportive measures;
    no disease-modifying efficacy is inferred from survival alone.
  therapeutic_modality: OTHER

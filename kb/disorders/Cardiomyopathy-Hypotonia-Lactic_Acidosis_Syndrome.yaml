name: Cardiomyopathy-Hypotonia-Lactic Acidosis Syndrome
creation_date: "2026-07-31T00:00:00Z"
category: Mendelian
description: >-
  Cardiomyopathy-hypotonia-lactic acidosis syndrome (mitochondrial phosphate
  carrier deficiency, SLC25A3 deficiency) is an ultra-rare autosomal recessive
  mitochondrial disorder caused by biallelic pathogenic variants in SLC25A3,
  which encodes the mitochondrial inorganic phosphate carrier (PiC) of the inner
  mitochondrial membrane. PiC supplies the matrix inorganic phosphate consumed by
  ATP synthase, so loss of carrier function starves the terminal step of
  oxidative phosphorylation of substrate. SLC25A3 is transcribed as two mutually
  exclusive isoforms generated by alternative splicing of exon 3A or exon 3B;
  isoform A predominates in heart and skeletal muscle while isoform B is
  ubiquitous. Because most reported pathogenic alleles disrupt exon 3A or its
  splice acceptor, the bioenergetic defect is largely confined to
  high-energy-demand striated muscle, which explains the cardiac- and
  myopathy-predominant presentation and the sparing of fibroblasts. Affected
  individuals classically present at or shortly after birth with hypertrophic
  cardiomyopathy, generalised muscular hypotonia, and lactic acidosis, and many
  die within the first year of life; a minority survive into adolescence or
  adulthood with exercise intolerance, proximal muscle weakness, and
  non-progressive hypertrophic cardiomyopathy. Only a handful of families have
  been reported worldwide.

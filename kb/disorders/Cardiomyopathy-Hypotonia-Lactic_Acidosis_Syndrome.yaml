biochemical:
- name: Blood lactate
  presence: INCREASED
  context: >-
    Elevated blood lactate is the principal biochemical marker. It is usually
    severe in the neonatal presentation and can persist for decades in long-term
    survivors despite clinical improvement on supportive metabolic therapy. It is
    not invariable - at least one molecularly confirmed patient with neonatal
    cardiomyopathy had normal lactate.
  evidence:
  - reference: PMID:40944834
    reference_title: "Expanding the Clinical Spectrum of Mitochondrial Phosphate Carrier Deficiency: A Case Report With Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient was treated with mitochondrial therapy, along with a fat-rich diet. Despite clinical improvement, lactate levels remained elevated."
    explanation: Documents persistent lactate elevation as a stable biochemical marker independent of clinical response.

    snippet: "In a muscle biopsy normal activity of respiratory chain enzymes was found; however the amount of the mitochondrial phosphate carrier was decreased."
    explanation: Documents both the reduced carrier protein and the normal respiratory-chain enzyme activities in patient muscle.
genetic:
- name: SLC25A3 biallelic pathogenic variants
  gene_term:
    preferred_term: SLC25A3
    term:
      id: hgnc:10989
      label: SLC25A3
  features: >-
    SLC25A3 encodes the mitochondrial inorganic phosphate carrier. Reported disease
    alleles cluster on the muscle-specific exon 3A and its splice acceptor: a
    homozygous exon 3A missense allele (c.215G>A, p.Gly72Glu) in the Turkish index
    family, and a recurrent homozygous splice-region allele (c.158-9A>G) that
    creates a novel splice site and removes over 95% of the wild-type exon 3A
    transcript, found in a second family, in an unrelated patient, and in a
    late-onset adult. One patient is a compound heterozygote for two novel coding
    variants outside exon 3A. Because the ubiquitous exon 3B isoform is retained in
    the exon 3A alleles, the biochemical defect is restricted to heart and skeletal
    muscle.
  evidence:
  - reference: PMID:25681081
    reference_title: "Pathologic Variants of the Mitochondrial Phosphate Carrier SLC25A3: Two New Patients and Expansion of the Cardiomyopathy/Skeletal Myopathy Phenotype With and Without Lactic Acidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants in the SLC25A3 gene, which codes for the mitochondrial phosphate transporter (PiC), lead to a failure of inorganic phosphate (Pi) transport across the mitochondrial membrane, which is required in the final step of oxidative phosphorylation."
    explanation: Establishes SLC25A3 as the disease gene and loss of phosphate transport as the molecular consequence of its pathogenic variants.
  - reference: PMID:17273968
    reference_title: "Mitochondrial phosphate-carrier deficiency: a novel disorder of oxidative phosphorylation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first report of patients with mitochondrial phosphate-carrier deficiency."
    explanation: The gene-disease relationship was first established in the 2007 index report of the two Turkish sisters.

  evidence:
  - reference: PMID:17273968
    reference_title: "Mitochondrial phosphate-carrier deficiency: a novel disorder of oxidative phosphorylation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mitochondrial phosphate carrier SLC25A3 transports inorganic phosphate into the mitochondrial matrix, which is essential for the aerobic synthesis of adenosine triphosphate (ATP)."
    explanation: >-
      States the carrier's function - matrix phosphate import - whose loss
      defines this node. Tagged OTHER rather than HUMAN_CLINICAL because the
      sentence is background biochemistry framing rather than a patient
      observation, matching how the analogous framing sentence from
      PMID:40362619 is tagged in this entry.
  - reference: PMID:40362619
    reference_title: "Rescue of the First Mitochondrial Membrane Carrier, the mPiC, by TAT-Mediated Protein Replacement Treatment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "mPiC imports inorganic phosphate (Pi) into the mitochondrial matrix for ATP production and other matrix phosphorylation reactions, as well as regulates mitochondrial Ca2+ uptake and buffering of matrix Ca2+."
    explanation: Confirms that matrix Pi supply for ATP production depends on the carrier, and notes the carrier's additional role in matrix calcium handling.
  - reference: PMID:40362619
    reference_title: "Rescue of the First Mitochondrial Membrane Carrier, the mPiC, by TAT-Mediated Protein Replacement Treatment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Most importantly, TAT-mPiC restored Pi and Cu delivery into the mitochondrial matrix."
    explanation: Restoring the carrier restores matrix Pi delivery in knockdown cells, confirming the carrier is rate-limiting for this step.
  downstream:
  - target: Substrate Limitation of ATP Synthase and Impaired Oxidative Phosphorylation
    causal_link_type: DIRECT
    description: >-
      ATP synthase condenses matrix ADP with matrix Pi, so a fall in matrix Pi is
      a direct substrate limitation on the terminal step of oxidative
      phosphorylation.
- name: Substrate Limitation of ATP Synthase and Impaired Oxidative Phosphorylation
  biological_scale: MOLECULAR
  description: >-
    Inorganic phosphate is a substrate of ATP synthase, so matrix Pi depletion
    limits proton-motive-force-driven ATP synthesis even when the respiratory
    chain complexes themselves are intact and normally assembled. This is the
    biochemical signature of the disorder: patient muscle mitochondria show
    deficient ATP synthesis while respiratory-chain enzyme activities are normal,
    and the defect is present in muscle but absent in fibroblasts, tracking the
    exon 3A/3B expression pattern.
  mechanism_confidence: ESTABLISHED

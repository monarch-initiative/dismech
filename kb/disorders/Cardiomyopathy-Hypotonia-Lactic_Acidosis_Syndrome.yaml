    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Additionally, assays in Lactococcus lactis and in reconstituted liposomes directly demonstrated that SLC25A3 functions as a copper transporter."
    explanation: Reconstituted-system assays demonstrate copper transport by SLC25A3 directly.
  - reference: PMID:21763135
    reference_title: "Deficiency of the mitochondrial phosphate carrier presenting as myopathy and cardiomyopathy in a family with three affected children."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In a muscle biopsy normal activity of respiratory chain enzymes was found; however the amount of the mitochondrial phosphate carrier was decreased."
    explanation: Normal respiratory-chain enzyme activity in patient muscle argues against a clinically significant cytochrome c oxidase deficiency in vivo, which is why this mechanism is marked PROVISIONAL.

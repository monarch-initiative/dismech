- name: Reduced Mitochondrial Matrix Inorganic Phosphate
  biological_scale: MOLECULAR
  description: >-
    The phosphate carrier is the principal route by which inorganic phosphate
    enters the mitochondrial matrix across the inner membrane, operating as a
    Pi/Pi antiporter and Pi/H+ symporter. When carrier capacity falls, matrix Pi
    concentration falls with it, depleting the pool available for matrix
    phosphorylation reactions.
  biological_processes:

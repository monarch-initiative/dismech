discussions:
- discussion_id: mismatch_copper_cox_arm_not_seen_in_patients
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    How much do copper transport, phosphate supply and mitochondrial organization each contribute to human
    SLC25A3 disease across alleles and tissues?
  attaches_to:
  - pathophysiology#Reduced Mitochondrial Copper Delivery
  - pathophysiology#Impaired Cytochrome c Oxidase Biogenesis
  - pathophysiology#Reduced Mitochondrial ATP Synthesis
  rationale: >-
    Direct transport and copper-selective rescue establish a copper-dependent carrier function in models,
    and human G72E has been tested in engineered fibroblasts. Patient studies, however, use different
    tissues and assays: some report normal respiratory-chain activity, while the founding paper gives
    COX 81 U/g against a 90–281 reference range in one sibling, later highlighted by Boulet et al. as
    a possible mild deficiency. Increased COX histochemical staining in another patient is not the same
    measurement. These observations limit a uniform clinical COX-deficiency claim without refuting carrier
    copper transport. Residual isoforms, allele, developmental timing and assay conditions require matched
    investigation.
  proposed_experiments:
  - experiment_id: exp_slc25a3_isoform_copper_cox
    name: Isoform-resolved copper transport and COX metalation assay
    description: >-
      Compare isogenic human cardiomyocytes carrying G72E, the recurrent splice variant, shared-exon variants
      and corrected controls. Measure isoform abundance, phosphate flux, matrix copper, COX assembly and
      activity under matched conditions. Copper-selective rescue would help separate substrate effects;
      translation to clinical tissues requires direct validation.
    experiment_type:
      preferred_term: iPSC-derived cardiomyocyte perturbation assay
    model_systems:
    - name: Human iPSC-derived cardiomyocyte
      description: >-
        Human isogenic cardiomyocytes with patient alleles and corrected controls to extend existing engineered
        mouse-cell evidence.
      experimental_model_type: OTHER
  evidence:
  - reference: PMID:33591272
    reference_title: Mitochondrial copper and phosphate transporter specificity was defined early in the evolution of eukaryotes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In SLC25A3, the L175A mutation separates Cu and phosphate transport by fully restoring COX activity and mitochondrial Cu levels without rescuing phosphate transport.
    explanation: >-
      Engineered separation-of-function construct establishes the copper-dependent COX effect in cells.
  - reference: PMID:29237729
    reference_title: The mammalian phosphate carrier SLC25A3 is a mitochondrial copper transporter required for cytochrome c oxidase biogenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the data presented suggest that loss of SLC25A3 in muscle results in a mild, isolated COX deficiency
    explanation: >-
      Boulet et al. reinterpret a quantitative value from the founding clinical report; this is not a
      new patient assay.
    quote_role: BACKGROUND
  - reference: PMID:21763135
    reference_title: "Deficiency of the mitochondrial phosphate carrier presenting as myopathy and cardiomyopathy in a family with three affected children."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a muscle biopsy normal activity of respiratory chain enzymes was found; however the amount of the mitochondrial phosphate carrier was decreased."
    explanation: >-
      Normal enzyme activity in this muscle biopsy illustrates assay/tissue heterogeneity; it does not
      refute the molecular transport function.
- discussion_id: gap_genotype_phenotype_severity_spectrum
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What determines whether an individual with biallelic SLC25A3 variants dies in
    the first year of life or survives into adulthood with non-progressive
    hypertrophic cardiomyopathy?
  attaches_to:
  - pathophysiology#Cardiomyocyte and Skeletal Muscle Bioenergetic Stress
  rationale: >-
    Published outcomes include infantile death, stable childhood or adult survival, and survival after
    transplantation. The recurrent splice allele itself occurs with both early death and longer survival.
    Residual transcript/protein, isoform compensation, modifiers and supportive treatment are plausible
    contributors but are not resolved by these small reports; a genotype alone should not be treated as
    prognostic.
  evidence:
  - reference: PMID:40944834
    reference_title: "Expanding the Clinical Spectrum of Mitochondrial Phosphate Carrier Deficiency: A Case Report With Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case supports the expansion of the clinical spectrum of mitochondrial PiC deficiency by presenting a patient with a later-onset phenotype compared to previously reported cases."
    explanation: Documents that the phenotypic spectrum is still expanding and is not yet explained.
animal_models:
- name: Inducible cardiomyocyte-specific Slc25a3 deletion
  species: Mus musculus
  genotype: Slc25a3 floxed; alpha-MHC-MerCreMer
  description: >-
    Adult inducible deletion reduces mitochondrial phosphate uptake and ATP synthesis while preserving
    bulk cardiac ATP. Longer deletion produces hypertrophy, dilation, systolic dysfunction and disrupted
    ultrastructure. Acute MPTP desensitization and ischemia-reperfusion protection are distinct from the
    chronic cardiomyopathy.
  publication: PMID:24658400
  modeled_mechanisms:
  - target: Reduced Mitochondrial Phosphate Import
    relationship: MEASURES
    description: Reduced phosphate uptake in isolated cardiac mitochondria.
  - target: Cardiomyocyte Hypertrophic Remodeling
    relationship: RECAPITULATES
    description: Hypertrophy and ventricular dysfunction after sustained deletion.
  evidence:
  - reference: PMID:24658400
    reference_title: Genetic deletion of the mitochondrial phosphate carrier desensitizes the mitochondrial permeability transition pore and causes cardiomyopathy.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Loss of PiC protein did not prevent MPTP opening, suggesting it is not a direct pore-forming component of this complex.
    explanation: >-
      Loss modulates rather than abolishes permeability transition.
  - reference: PMID:24658400
    reference_title: "Genetic deletion of the mitochondrial phosphate carrier desensitizes the mitochondrial permeability transition pore and causes cardiomyopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "deletion of the Slc25a3 gene from the heart long-term resulted in profound hypertrophy with ventricular dilation and depressed cardiac function, all features that reflect the cardiomyopathy observed in humans with mutations in SLC25A3"
    explanation: Cardiac-specific Slc25a3 deletion in mice is sufficient to produce hypertrophy, ventricular remodeling, and contractile dysfunction, matching the human cardiomyopathy.
  notes: >-
    Conditional adult total-gene deletion differs from congenital isoform-specific human alleles. PMID:40950028
    tested concurrent meclizine treatment in this model; it is a preprint.

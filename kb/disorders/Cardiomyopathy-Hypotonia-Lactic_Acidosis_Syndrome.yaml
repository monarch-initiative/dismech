    explanation: Documents raised plasma creatine kinase in a confirmed patient.
- name: Mitochondrial ATP synthesis rate in skeletal muscle
  presence: DECREASED
  context: >-
    The founding G72E family had impaired muscle ATP synthesis but preserved fibroblast synthesis. A normal
    fibroblast assay cannot exclude muscle-selective disease; shared-exon patient fibroblasts can have
    other functional abnormalities.

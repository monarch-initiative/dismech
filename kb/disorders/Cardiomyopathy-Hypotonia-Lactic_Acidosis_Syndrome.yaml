    modifier: DECREASED
  evidence:
  - reference: PMID:29237729
    reference_title: "The mammalian phosphate carrier SLC25A3 is a mitochondrial copper transporter required for cytochrome c oxidase biogenesis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SLC25A3 knockdown or deletion consistently resulted in an isolated COX deficiency in these cells, and copper addition to the culture medium suppressed these biochemical defects."
    explanation: Shows that loss of SLC25A3 in cultured cells produces a copper-remediable isolated cytochrome c oxidase deficiency.
  - reference: PMID:29237729

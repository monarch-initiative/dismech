- name: Cardiomyocyte and Skeletal Muscle Energy Deficit
  biological_scale: CELLULAR
  conforms_to: cardiomyopathy_maladaptive_remodeling#Primary Cardiomyocyte Insult
  description: >-
    Heart and skeletal muscle have the highest and least interruptible ATP demand,
    and they are also the tissues that depend on the exon 3A carrier isoform. The
    combination makes them the target organs of the disease: cardiomyocytes and
    myofibres cannot sustain contractile work on a reduced oxidative ATP supply.
    This is the disease-specific instance of the "Primary Cardiomyocyte Insult"
    step of the conserved cardiomyopathy maladaptive-remodeling module, with a
    metabolic (bioenergetic) rather than sarcomeric insult. Human iPSC-derived
    cardiomyocytes carrying SLC25A3 knockout or missense alleles reproduce this
    state, showing mitochondrial energy-metabolism dysfunction together with
    diastolic dysfunction and calcium-handling imbalance.

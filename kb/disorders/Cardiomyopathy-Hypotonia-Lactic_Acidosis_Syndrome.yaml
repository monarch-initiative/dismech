notes: >-
  No GeneReviews chapter exists for SLC25A3 / mitochondrial phosphate carrier
  deficiency - a PubMed search for "SLC25A3 GeneReviews" returned zero results on
  2026-07-31 - so the usual GeneReviews phenotype baseline is unavailable and
  this entry is anchored directly on the primary case reports and functional
  literature. The disorder is ultra-rare: the index report described two Turkish
  sisters, and fewer than about a dozen molecularly confirmed patients have been
  described since. This entry is therefore deliberately restricted to claims that
  can be quoted from a cached abstract. In particular, no frequency bands are
  asserted for any phenotype because no cohort large enough to support them
  exists. Death in infancy is curated under `progression` rather than as a
  `phenotypes` entry because HP:0001522 (Death in infancy) sits in the HPO
  Mortality/Aging branch, outside the Phenotypic abnormality subtree that the
  PhenotypeTerm dynamic enum draws from.

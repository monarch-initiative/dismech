- name: Impaired Mitochondrial Copper Delivery and Cytochrome c Oxidase Biogenesis
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Beyond phosphate, SLC25A3 has been shown in cell and reconstituted systems to
    transport copper into the mitochondrial matrix, supplying the labile copper
    pool required to metalate cytochrome c oxidase (complex IV). Knockdown or
    deletion of SLC25A3 in cultured cells causes an isolated COX deficiency that
    is rescued by copper supplementation, and restoring the carrier restores
    matrix copper delivery. Whether this second transport function contributes to
    the human disease is unresolved: patient muscle biopsies have shown normal
    respiratory-chain enzyme activities, so the copper/COX arm is recorded here as
    a provisional mechanism rather than an established component of the patient
    phenotype (see the HUMAN_MODEL_MISMATCH discussion).

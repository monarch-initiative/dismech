agent_life_cycle:
  description: >-
    M. tuberculosis is transmitted between humans by airborne droplets and
    establishes a primary infection, usually in the lungs, from which bacilli
    spread through the blood or lymphatics to the fallopian tubes. M. bovis has
    a cattle reservoir and reaches humans through unpasteurized milk.
  hosts:
  - preferred_term: Homo sapiens
    role: reservoir and clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  - preferred_term: cattle
    role: reservoir of Mycobacterium bovis
    term:
      id: NCBITaxon:9913
      label: Bos taurus
  evidence:
  - reference: PMID:34483510
    reference_title: Recent Advances in Diagnosis and Management of Female Genital Tuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Female genital tuberculosis (FGTB) is a chronic infectious disease of
      female genital tract due to Mycobacterium tuberculous (rarely
      Mycobacterium bovis from unpasteurized infected milk)
    explanation: >-
      Attributes M. bovis genital tuberculosis to infected milk, which places
      cattle upstream as the reservoir of that agent.
  - reference: PMID:28862174
    reference_title: Genital tuberculosis in females.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Mycobacterium tuberculosis bacilli reach the genital tract primarily by
      haematogenous spread and dissemination from foci outside the genitalia
      with lungs as the common primary focus.
    explanation: >-
      Describes spread from an extragenital, usually pulmonary, focus to the
      genital tract.

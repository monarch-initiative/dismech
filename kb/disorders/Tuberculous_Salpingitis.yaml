- name: Caseating granulomatosis
  description: >-
    Caseating epithelioid granulomas with Langhans giant cells in tubal or
    endometrial tissue, the histological basis of diagnosis.
  phenotype_term:
    preferred_term: Caseating granulomatosis
    term:
      id: HP:5210339
      label: Caseating granulomatosis
  evidence:
  - reference: PMID:30964083
    reference_title: "Female genital tuberculosis: Revisited."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Demonstration of typical caseous granuloma with or without Langerhans
      giant cells on histopathology is diagnostic of genital TB.
    explanation: >-
      States that caseous granulomas on histopathology are diagnostic.
  - reference: PMID:23905137
    reference_title: "Tuberculous salpingitis: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      TB of the left fallopian tube was diagnosed, as there were numerous
      typical granulomata throughout the fallopian tube.
    explanation: >-
      A case of tuberculous salpingitis diagnosed from granulomas throughout
      the resected tube.
progression:
- phase: Seeding and early salpingitis
  notes: >-
    Bacilli seed the tubes from an extragenital focus. The ampulla changes
    first, the organs may look normal, and granulomas are sparse and
    non-caseating.
  evidence:
  - reference: PMID:28862174
    reference_title: Genital tuberculosis in females.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Features of chronic salpingitis include occasional non-caseating
      granulomas in the early stage and single and/or multiple confluent
      epithelioid granulomas in the lamina propria in the later stage
    explanation: >-
      Describes sparse non-caseating granulomas in the early stage.
- phase: Chronic tubal destruction and spread
  notes: >-
    Confluent caseating granulomas destroy the endosalpinx; the tubes become
    beaded and blocked, hydrosalpinx, pyosalpinx and tubo-ovarian masses
    form, and infection spreads to the endometrium and ovaries.
  evidence:
  - reference: PMID:30964083
    reference_title: "Female genital tuberculosis: Revisited."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Later beading, closed tubes, tubo-ovarian masses, hydrosalpinx,
      pyosalpinx and the development of synechiae formation occurs
    explanation: >-
      Describes the later structural stage of genital tuberculosis.
- phase: Post-treatment sequelae
  notes: >-
    After cure, blocked tubes, adhesions and endometrial damage usually
    persist, so conception rates stay low and the risk of ectopic pregnancy
    and miscarriage stays high.
  evidence:
  - reference: PMID:28862174
    reference_title: Genital tuberculosis in females.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Conception rates are low among infertile women with genital TB even
      after multidrug therapy for TB, and the risk of complications such as
      ectopic pregnancy and miscarriage is high.
    explanation: >-
      States that fertility stays poor after treatment.
diagnosis:
- name: Endometrial Biopsy or Aspirate
  description: >-
    Premenstrual endometrial biopsy or aspirate for acid-fast bacilli,
    mycobacterial culture and histopathology is the standard specimen.
    Microscopy and culture are highly specific but insensitive because the
    disease is paucibacillary; menstrual blood and pelvic washings have been
    tried with variable results.
  diagnosis_term:
    preferred_term: endometrial biopsy
    term:
      id: NCIT:C51920
      label: Endometrial Biopsy
  evidence:
  - reference: PMID:26663993
    reference_title: Current Diagnosis and Management of Female Genital Tuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis is made by detection of acid-fast bacilli on microscopy or
      culture on endometrial biopsy or on histopathological detection of
      epithelioid granuloma on biopsy.
    explanation: >-
      Names endometrial biopsy microscopy, culture and histopathology as the
      basis of diagnosis.
  - reference: PMID:40519447
    reference_title: "Performance of Various Pelvic-Derived Samples for the Diagnosis of Female Genital Tract Tuberculosis by Conventional and Molecular Methods: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      ZN staining and culture demonstrated high specificity (pooled
      specificity: 1.00) but poor sensitivity (ZN: 10%; culture: 23%).
    explanation: >-
      Pooled diagnostic accuracy of smear microscopy and culture on pelvic
      specimens.
  - reference: PMID:40519447
    reference_title: "Performance of Various Pelvic-Derived Samples for the Diagnosis of Female Genital Tract Tuberculosis by Conventional and Molecular Methods: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Menstrual blood and pelvic washings were explored with variable results
    explanation: >-
      Reports variable yield from menstrual blood and pelvic washings.
- name: Xpert MTB/RIF Assay on Endometrial Tissue
  description: >-
    Cartridge-based nucleic acid amplification (GeneXpert) on endometrial
    tissue is highly specific and detects rifampicin resistance but has low
    sensitivity. Conventional PCR is more sensitive but gives false positives
    and is not sufficient alone.
  diagnosis_term:
    preferred_term: Xpert MTB/RIF assay
    term:
      id: NCIT:C20055
      label: Nucleic Acid Amplification Test
  evidence:
  - reference: PMID:40519447
    reference_title: "Performance of Various Pelvic-Derived Samples for the Diagnosis of Female Genital Tract Tuberculosis by Conventional and Molecular Methods: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      PCR showed pooled sensitivity and specificity of 54% and 97%,
      respectively, with considerable heterogeneity. GeneXpert demonstrated
      excellent specificity (pooled 100%) but low sensitivity (14%).
    explanation: >-
      Pooled accuracy of PCR and GeneXpert on pelvic specimens.
  - reference: PMID:26663993
    reference_title: Current Diagnosis and Management of Female Genital Tuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Polymerase chain reaction may be false positive and alone is not
      sufficient to make the diagnosis.
    explanation: >-
      Cautions that a positive PCR alone does not establish the diagnosis.
- name: Diagnostic Laparoscopy
  description: >-
    Laparoscopy shows tubercles, caseous nodules, beaded or blocked tubes,
    hydrosalpinx, tubo-ovarian masses and pelvic and perihepatic adhesions,
    and allows biopsy. It detects more cases than laboratory tests.
  diagnosis_term:
    preferred_term: laparoscopy
    term:
      id: NCIT:C16969
      label: Laparoscopy
  evidence:
  - reference: PMID:37202937
    reference_title: "Laparoscopic evaluation of female genital tuberculosis in infertility: An observational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Definite findings of FGTB were seen in 164 (43.86%) cases with beaded
      tubes (12.29%), tubercles (32.88%) and caseous nodules (14.96%).
    explanation: >-
      Reports definite laparoscopic signs in 44% of 374 women.
  - reference: PMID:37202937
    reference_title: "Laparoscopic evaluation of female genital tuberculosis in infertility: An observational study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The finding of this study suggests that laparoscopy is a useful modality
      to diagnose FGTB with a higher pickup rate of cases.
    explanation: >-
      The authors conclude laparoscopy detects more cases.
- name: Hysterosalpingography
  description: >-
    Contrast radiography of the uterus and tubes shows tubal blockage,
    hydrosalpinx, beaded, pipe-stem, golf-club or tobacco-pouch tubes and
    intrauterine adhesions. NCIT has no term for this procedure.
  diagnosis_term:
    preferred_term: hysterosalpingography
  evidence:
  - reference: PMID:37033134
    reference_title: Hysterosalpingography Observations in Female Genital Tuberculosis with Infertility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      HSG is a useful modality in FGTB with infertility.
    explanation: >-
      The authors conclude that hysterosalpingography is useful in 87
      infertile women with genital tuberculosis.
  - reference: PMID:24520493
    reference_title: "Hysterosalpingographic appearances of female genital tract tuberculosis: part I. Fallopian tube."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Part I presents specific findings of tuberculosis related to tubes such
      as "beaded tube", "golf club tube", "pipestem tube", "cobble stone tube"
      and "leopard skin tube".
    explanation: >-
      Lists the specific tubal appearances of tuberculosis on
      hysterosalpingography.
- name: Composite Reference Standard
  description: >-
    Because no single test detects all cases, diagnosis combines endometrial
    or peritoneal biopsy microscopy, culture, histopathology, GeneXpert or PCR
    with definite or probable laparoscopic and hysteroscopic findings.
  evidence:
  - reference: PMID:33308655
    reference_title: Genital tb-diagnostic algorithm and treatment.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Composite reference standard is a useful method to diagnose FGTB.
    explanation: >-
      Recommends a composite reference standard for diagnosis.
  - reference: PMID:21457984
    reference_title: Genital tuberculosis among infertile women and fertility outcome after antitubercular therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      No single test can detect all instances of GTB. A combination of tests is
      needed to increase the detection rate.
    explanation: >-
      Conclusion of a prospective study of 196 infertile women comparing
      diagnostic tests.
treatments:
- name: Antituberculous Chemotherapy
  description: >-
    Standard six-month regimen for drug-sensitive disease: isoniazid,
    rifampicin, pyrazinamide and ethambutol for two months, then isoniazid and
    rifampicin (with ethambutol in the Indian programme) for four months. A
    randomized trial found nine months no better than six.
    Rifampicin-resistant disease is treated with the multidrug-resistant
    tuberculosis regimens.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: isoniazid
      term:
        id: CHEBI:6030
        label: isoniazide
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: pyrazinamide
      term:
        id: CHEBI:45285
        label: pyrazinecarboxamide
    - preferred_term: ethambutol
      term:
        id: CHEBI:4877
        label: ethambutol
  target_mechanisms:
  - target: Caseating Granulomatous Endosalpingitis
    treatment_effect: INHIBITS
    description: >-
      Chemotherapy kills the bacilli and arrests the granulomatous
      inflammation, but does not reverse established tubal damage.
    evidence:
    - reference: PMID:26663993
      reference_title: Current Diagnosis and Management of Female Genital Tuberculosis.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Treatment is by giving daily therapy of rifampicin (R), isoniazid (H),
        pyrazinamide (Z) and ethambutol (E) for 2 months followed by daily 4
        month therapy of rifampicin (R) and isoniazid (H).
      explanation: >-
        States the standard regimen used to treat genital tuberculosis.
  evidence:
  - reference: PMID:30964083
    reference_title: "Female genital tuberculosis: Revisited."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Treatment is through the first-line drugs in combination (HRZE for two
      months followed by HRE for four months).
    explanation: >-
      States the six-month first-line regimen.
  - reference: PMID:30964083
    reference_title: "Female genital tuberculosis: Revisited."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In a randomized controlled trial, six months ATT was found to be equally
      effective as nine months therapy
    explanation: >-
      Summarizes a randomized trial showing six months is as effective as nine.
  - reference: PMID:37758670
    reference_title: "Effects of antituberculosis treatment on pregnancy outcomes in infertile women with genital tuberculosis: a systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The effect of antituberculosis treatment on pregnancy outcomes in
      infertile women with genital tuberculosis is very uncertain.
    explanation: >-
      A systematic review finds the effect of treatment on fertility very
      uncertain.
- name: In Vitro Fertilization and Embryo Transfer
  description: >-
    For women whose tubes are blocked after treatment but whose endometrium is
    receptive, IVF-ET gives higher pregnancy rates than antituberculous
    therapy alone. Tuboplasty is avoided because it does not improve fertility
    and risks flare-up and ectopic pregnancy. Surrogacy is offered when the
    endometrium is destroyed and adoption when the ovaries are also damaged.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: in vitro fertilization
    term:
      id: NCIT:C16580
      label: In Vitro Fertilization
  target_mechanisms:
  - target: Female infertility
    treatment_effect: INHIBITS
    description: >-
      IVF bypasses the blocked tubes; it does not help when the endometrium is
      destroyed.
    evidence:
    - reference: PMID:34483510
      reference_title: Recent Advances in Diagnosis and Management of Female Genital Tuberculosis.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        If tubes are blocked, but endometrium is receptive (normal), IVF ET (in
        vitro fertilization and embryo transfer) is performed with good outcome
        and conception rate of up to 25%.
      explanation: >-
        Recommends IVF-ET for blocked tubes with a receptive endometrium.
  evidence:
  - reference: PMID:39748636
    reference_title: "Pregnancy outcomes after all modes of conception in patients with genital tuberculosis: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Generally, there was a significant increase in pregnancy rates among
      patients who underwent IVF compared with those who underwent ATT (37.9%
      vs. 23.8%; p=0.02).
    explanation: >-
      Pooled pregnancy rates are higher with IVF than with antituberculous
      therapy alone.
  - reference: PMID:30964083
    reference_title: "Female genital tuberculosis: Revisited."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Tuboplasty should be avoided in case of FGTB as it does not improve the
      prognosis for fertility but there is risk of flare-up of TB and further
      ectopic gestation after ATT
    explanation: >-
      Advises against tubal reconstructive surgery.
- name: Salpingectomy for Hydrosalpinx Before IVF
  description: >-
    Removal (or proximal occlusion) of hydrosalpinges before IVF improves
    clinical pregnancy rates.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: salpingectomy
    term:
      id: NCIT:C51605
      label: Salpingectomy
  target_mechanisms:
  - target: Hydrosalpinx
    treatment_effect: INHIBITS
    description: >-
      Removing the fluid-filled tube removes its adverse effect on embryo
      implantation.
    evidence:
    - reference: PMID:36438172
      reference_title: "Female Genital Tuberculosis: Clinical Presentation, Current Diagnosis, and Treatment."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        The clinical pregnancy was increased with salpingectomy for
        hydrosalpinges prior to IVF
      explanation: >-
        Reports higher pregnancy rates after salpingectomy for hydrosalpinges
        before IVF.
  evidence:
  - reference: PMID:36438172
    reference_title: "Female Genital Tuberculosis: Clinical Presentation, Current Diagnosis, and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The clinical pregnancy was increased with salpingectomy for
      hydrosalpinges prior to IVF
    explanation: >-
      Supports salpingectomy for hydrosalpinx before IVF.
- name: Surgical Drainage or Extirpative Surgery
  description: >-
    Surgery is rarely needed. Persistent pyosalpinx or tubo-ovarian abscess
    despite chemotherapy is drained; for persistent or drug-resistant disease,
    total hysterectomy with bilateral salpingo-oophorectomy under
    chemotherapy cover is the operation of choice.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical drainage or hysterectomy with salpingo-oophorectomy
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Tubo-ovarian abscess
    treatment_effect: INHIBITS
    description: >-
      Drainage removes a persistent abscess that chemotherapy has not cleared.
    evidence:
    - reference: PMID:30964083
      reference_title: "Female genital tuberculosis: Revisited."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        However, limited surgery in the form of drainage of persistent pelvic or
        tubo-ovarian abscess despite medical treatment can be performed as
        recommended by the American Thoracic Society
      explanation: >-
        Recommends drainage of persistent tubo-ovarian abscess.
  evidence:
  - reference: PMID:26663993
    reference_title: Current Diagnosis and Management of Female Genital Tuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Surgery is rarely required only as drainage of abscesses.
    explanation: >-
      States that surgery is rarely needed.
  - reference: PMID:28862174
    reference_title: Genital tuberculosis in females.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The surgical procedure of choice is total hysterectomy with bilateral
      salpingo-oophorectomy with proper chemotherapy coverage
    explanation: >-
      Names hysterectomy with bilateral salpingo-oophorectomy as the operation
      of choice when surgery is needed.
clinical_trials:
- name: NCT05311423
  phase: NOT_APPLICABLE
  status: UNKNOWN
  description: >-
    A national multicentre prospective observational cohort study of the
    prevalence of genital tuberculosis in infertile women and its effect on
    the outcomes of assisted reproduction.
  target_phenotypes:
  - preferred_term: Female infertility
    term:
      id: HP:0008222
      label: Female infertility
  evidence:
  - reference: clinicaltrials:NCT05311423
    reference_title: "The Prevalence of Genital Tuberculosis and the Impact on Reproductive Outcomes in Infertile Women: a National Multicenter Prospective Cohort Study"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The pregnancy rate of assisted reproductive treatment (ART) in the
      infertile women with FGTB is still unsatisfied even after receiving
      standard anti-tuberculosis treatment.
    explanation: >-
      The registration states the problem the cohort addresses, poor assisted
      reproduction outcomes in genital tuberculosis after treatment.

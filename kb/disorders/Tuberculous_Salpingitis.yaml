    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      the prevalence of overall infertility, primary infertility and secondary
      infertility among FGTB population were 88%, 66% and 34%, respectively.
    explanation: >-
      Pooled share of women with genital tuberculosis who are infertile; most
      included studies recruited from infertility clinics.
  - reference: PMID:28862174
    reference_title: Genital tuberculosis in females.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In most cases, the disease is asymptomatic or can present with a few
      symptoms among which infertility is the most common.
    explanation: >-
      States that infertility is the most common presentation.
- name: Tubal blockage
  description: >-
    Unilateral or bilateral blockage of the tubes at the cornual, mid-tubal or
    fimbrial level, with beaded, rigid (pipe-stem), golf-club, cobblestone or
    tobacco-pouch tubes on hysterosalpingography.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: tuberculous tubal blockage
    term:
      id: HP:0011027
      label: Abnormal fallopian tube morphology
  evidence:

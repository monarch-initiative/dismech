    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Tubal blockage was seen in 69 (79.31%) and 67 (77.01%) cases
    explanation: >-
      Reports tubal blockage in about 78% of 87 infertile women with genital
      tuberculosis; the two figures refer to the two tubes.
  - reference: PMID:28862174
    reference_title: Genital tuberculosis in females.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In HSG, presentation of tubal TB varies from non-specific changes such
      as tubal dilatation, tubal occlusion, irregular contour, diverticular
      outpouching (salpingitis isthmica nodosa), hydrosalpinx to specific
      pattern such as ’cotton wool plug’, ’pipestem tube’, ’golf club tube’,
      ’cobblestone tube’, ’beaded tube’, ’leopard skin tube’
    explanation: >-
      Lists the tubal appearances of tuberculosis on hysterosalpingography.
  - reference: PMID:30964083
    reference_title: "Female genital tuberculosis: Revisited."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Various HSG findnigs like tobacco pouch, golfclub and maltese cross
      appearance of tubes and shruken uterine cavity with tubal block have been
      reported by different authors in FGTB
    explanation: >-
      Lists the tobacco-pouch and related tubal appearances on
      hysterosalpingography.

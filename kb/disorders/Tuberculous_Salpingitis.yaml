prevalence:
- population: Infertile women (pooled from 42 studies)
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    A meta-analysis of 30,918 infertile women found female genital
    tuberculosis in a pooled 20% (95% CI 15-25%), with extreme heterogeneity
    between studies. This is the share of infertile women with genital
    tuberculosis of any site, not a population prevalence of tuberculous
    salpingitis, so no rate is asserted. The tubes are involved in nearly all
    of these cases.
  evidence:
  - reference: PMID:36072071
    reference_title: "Female Genital Tuberculosis Among Infertile Women and Its Contributions to Primary and Secondary Infertility: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A total of 42 studies were selected with a total of 30,918 infertile
      women. Of these, the pooled prevalence of FGTB was 20% (95% confidence
      interval: 15-25%, I2 = 99.94%)
    explanation: >-
      Pooled share of infertile women with female genital tuberculosis.

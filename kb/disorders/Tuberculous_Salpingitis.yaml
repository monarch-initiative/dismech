    reference_title: "Female genital tuberculosis: Revisited."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In FGTB, fallopian tubes are affected in 90 per cent women, whereas
      uterine endometrium is affected in 70 per cent and ovaries in about 25
      per cent women.
    explanation: >-
      Reports tubal involvement in 90% of women with genital tuberculosis.
  - reference: PMID:26663993
    reference_title: Current Diagnosis and Management of Female Genital Tuberculosis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The fallopian tubes are involved in 90-100 % cases, endometrium is
      involved in 50-80 % cases, ovaries are involved in 20-30 % cases, and
      cervix is involved in 5-15 % cases of genital TB.
    explanation: >-
      Reports tubal involvement in 90-100% of cases.
- name: Female infertility
  description: >-

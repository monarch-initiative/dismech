name: Tuberculous Salpingitis
creation_date: "2026-11-26T03:48:19Z"
description: >-
  Tuberculous salpingitis is tuberculosis of the fallopian tubes. The tubes are
  the usual first and most frequently involved site of female genital
  tuberculosis and are affected, usually on both sides, in nearly every case.
  Mycobacterium tuberculosis reaches the tubes mainly through the bloodstream
  from a primary focus outside the genital tract, most often the lungs, and
  less often through lymphatics or by direct spread from abdominal or
  peritoneal tuberculosis. Granulomatous endosalpingitis with caseation
  damages the tubal mucosa and wall, which leads to tubal blockage, beading,
  hydrosalpinx or pyosalpinx, tubo-ovarian masses and pelvic adhesions.
  Infection commonly spreads from the tubes to the endometrium and less often
  to the ovaries. The disease is often silent and is usually found during
  investigation of infertility; pelvic pain, menstrual disturbance and ectopic
  pregnancy are the other main presentations. Diagnosis combines endometrial
  sampling for histopathology, acid-fast bacilli, culture and molecular tests
  with laparoscopy, hysteroscopy and hysterosalpingography. Treatment is
  standard six-month antituberculous chemotherapy. Fertility often stays poor
  after cure, and women with damaged tubes and a receptive endometrium are
  offered in-vitro fertilization.
category: Infectious Disease
disease_term:
  preferred_term: tuberculous salpingitis
  term:
    id: MONDO:0000271
    label: tuberculous salpingitis
parents:
- Tuberculosis
- Extrapulmonary Tuberculosis
- Salpingitis
synonyms:
- tubal tuberculosis
- tuberculosis of the fallopian tube
- tuberculous endosalpingitis
notes: >-
  Almost all of the clinical literature describes female genital tuberculosis
  as a whole rather than tuberculous salpingitis alone, because the tubes are
  involved in nearly every case and isolated tubal disease is rarely
  separated out. Most frequencies here therefore come from cohorts of women
  with female genital tuberculosis, nearly all of them infertile women from
  India, and they overstate infertility as a presentation. Pathogenesis claims
  (route of spread, early ampullary involvement, the endometrium being
  involved secondarily to the tubes) come from narrative reviews rather than
  from studies designed to test them. Scope: this entry covers the tubal
  disease and its direct consequences. Tuberculous endometritis is recorded
  here as a downstream extension of the tubal disease, because dismech has no
  separate entry or stub for it and the cited sources describe it as usually
  secondary to tubal disease. Ovarian involvement is recorded only as
  tubo-ovarian extension; tuberculous oophoritis, tuberculous peritonitis and
  urogenital tuberculosis have their own stubs. NCIT has no
  hysterosalpingography term (an OLS search of NCIT for
  "hysterosalpingography" returned no NCIT result), so that diagnosis row
  carries no term. MONDO (OLS, release 2026-11-03) asserts tuberculous
  salpingitis (MONDO:0000271) as a direct parent of meningeal tuberculosis
  (MONDO:0006042), alongside central nervous system tuberculosis and
  bacterial meningitis. Meningeal tuberculosis is an infection of the
  membranes of the brain and spinal cord and does not involve the fallopian
  tube, so this parent link looks like a MONDO misclassification that may
  warrant an upstream MONDO report. Seeded from
  `research/Tuberculous_Salpingitis-deep-research-claude_code.md` and PubMed
  searches.

  - target: Outer Hair Cell Functional Impairment
    description: Loss of CDC14A in the mouse allelic series is associated with early loss of otoacoustic emissions; the intervening substrate pathway is unknown.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

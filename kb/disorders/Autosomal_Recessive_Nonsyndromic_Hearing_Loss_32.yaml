    explanation: >-
      Patient-derived evidence that the exon 11 nonsense allele produces stable transcript
      rather than a null.
  - reference: PMID:41308992
    reference_title: "A truncated CDC14A retains catalytic structure and phosphatase activity preserving male fertility but causes nonsyndromic deafness."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Kinetic functional studies and X-ray crystallographic findings of purified ΔC-CDC14A protein indicate that it retains structural integrity and phosphatase activity."
    explanation: The truncated product is folded and enzymatically active.
- name: Nuclear Retention and Hair Bundle Mislocalization of CDC14A
  description: >-
    Full-length CDC14A in inner ear hair cells is cytoplasmic and concentrated in the hair
    bundle and along the kinocilium, with no detectable nuclear signal. The DFNB32-type
    truncated protein is mostly trapped in the nucleus, and only a fraction reaches the
    cytoplasm, stereocilia and kinocilia. The authors propose that this mislocalisation, not
    loss of activity, is what costs hearing in the DFNB32 subtype; that reading fits the
    data but rests on transfected explants, not on a knock-in mouse, and the authors list a
    p.R345* mouse as the next experiment.

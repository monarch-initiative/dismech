    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Hearing aids (sound amplification), customized by an audiologist to the degree and frequency of hearing loss, can be used in individuals with mild-to-severe hearing loss.
    explanation: General guidance supports fitting to residual hearing; primary CDC14A families document use without a response-rate estimate.

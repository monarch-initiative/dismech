has_subtypes:
- name: DFNB32
  display_name: DFNB32 (deafness with preserved male fertility)
  classification: clinical_phenotype
  description: >-
    The clinically nonsyndromic presentation includes affected men with documented paternity or semen results within or near reference ranges. This is best documented for p.Arg345Ter and p.Arg376Ter. C-terminal variants are often associated with this presentation, but fertility was unassessed for several reported alleles: the p.Ala451Thrfs*43 family contained only affected females, and the two affected men with p.Ser348Glnfs*2 were unmarried and had no children. The intron-14 splice-variant family also contained only affected females. Variant position and a predicted preserved short transcript do not by themselves establish male fertility. The 2024 p.Gln334Ter report found normal semen parameters but classified the variant as uncertain significance.
  evidence:
  - reference: PMID:32231217
    reference_title: "When transcripts matter: delineating between non-syndromic hearing loss DFNB32 and hearing impairment infertile male syndrome (HIIMS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that DFNB32 is a distinct phenotypic entity in males."
    explanation: >-
      Conclusion drawn from semen analyses of deaf men homozygous for exon 11 truncations,
      which were normal or near normal.
  - reference: PMID:41308992
    reference_title: "A truncated CDC14A retains catalytic structure and phosphatase activity preserving male fertility but causes nonsyndromic deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants affecting the globular N-terminal domains of human CDC14A are associated with HIIMS, whereas mutations in the IDR cause nonsyndromic deafness DFNB32."
    explanation: >-
      The later structural study summarizes an allele-position association; it does not document fertility or biochemical activity for every reported variant.
- name: HIIMS
  display_name: Hearing impairment and infertile male syndrome
  classification: clinical_phenotype
  subtype_term:
    preferred_term: hearing impairment and infertile male syndrome
    term:
      id: MONDO:0100069
      label: hearing impairment and infertile male syndrome
  description: >-
    Hearing impairment with male infertility is reported in families carrying early truncating, splice-altering or catalytic-domain CDC14A alleles. The 2018 series identified infertility by history in five families, with limited semen assessment. p.Arg312Gln was associated with hearing loss but its reproductive phenotype was not established. The 2024 p.Asn228Lys family had profound hearing loss and severe oligozoospermia, but the authors classified that variant as uncertain significance and did not perform a variant-specific functional assay. Female fertility has been observed in affected families; this does not quantify reproductive penetrance across all CDC14A genotypes. MONDO treats HIIMS as a separate syndromic disease, represented here within the shared allelic spectrum.
  evidence:
  - reference: PMID:29293958
    reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Infertility of some deaf males is associated with specific variants of CDC14A and defines a new monogenic syndrome (designated HIIMS) owing to insufficient phosphatase activity, while other variants with residual activity are associated with non-syndromic deafness DFNB32."
    explanation: >-
      The original definition of HIIMS as an allele-specific syndromic form of the same
      CDC14A disease.
  - reference: PMID:39119445
    reference_title: "Delineating the Disease Boundaries: Homozygous CDC14A Variants Underlying Nonsyndromic Hearing Loss and Hearing Impairment Infertile Male Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants in exon 10 and upstream cause HIIMS, and those in exon 11 and downstream are linked exclusively to hearing impairment."
    explanation: >-
      The authors propose an exon-based correlation, but classify both newly reported variants as VUS in the full text. This is not a validated individual fertility prediction.
    directness: INDIRECT
inheritance:
- name: Autosomal recessive
  description: >-
    Homozygous CDC14A variants segregating with deafness in consanguineous families from
    Tunisia, Pakistan, Iran and Mauritania; heterozygous parents and siblings hear normally.
    Infertility in the HIIMS subtype is male-limited, which is a sex-limited expression of an
    autosomal recessive genotype rather than a different mode of inheritance.

- population: Emirati patients with nonsyndromic hearing loss, retrospective genetic cohort
  measure_type: UNKNOWN
  notes: >-
    Nine patients in a retrospective Emirati clinic cohort were homozygous for p.Arg312Gly. The study included 72 molecularly diagnosed patients and excluded ten with negative or incomplete evaluations; this is a selected clinical observation, not population prevalence or a general diagnostic sensitivity. No fertility problems were reported, but CDC14A-specific age, sex and semen-assessment data were not provided.

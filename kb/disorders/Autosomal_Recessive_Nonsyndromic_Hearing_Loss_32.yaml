- name: Nuclear Retention and Hair Bundle Mislocalization of CDC14A
  description: >-
    In transfected P2–P3 mouse inner-ear explants, EGFP-tagged full-length mouse CDC14A localized to cytoplasm, stereocilia and kinocilia, whereas the truncated 1–345 construct accumulated predominantly in the nucleus. Some truncated protein remained in the cytoplasm and hair bundle. These findings concern introduced constructs, not direct localization in patient hair cells. Mislocalization is a proposed contributor to p.Arg345Ter-associated hearing loss; a corresponding knock-in model linking this defect to hair-cell survival had not been reported in the structural study.

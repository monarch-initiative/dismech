genetic:
- name: CDC14A
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: CDC14A
    term:
      id: hgnc:1718
      label: CDC14A
  notes: >-
    CDC14A lies at 1p21.2 and has 15 exons and six annotated transcripts encoding isoforms
    of 330 to 623 residues; exon 11 is the last exon of a 383-residue isoform. The protein has
    an N-terminal nuclear localisation signal, two globular dual-specificity phosphatase-like
    domains (DSPn, residues 17-152, and the catalytic DSPc, 217-325), and a disordered
    C-terminal region with a nuclear export signal. Its paralog CDC14B does not compensate:
    Cdc14b-null mice hear normally and are fertile. By 2026, 16 recessive variants had been
    reported. Their position predicts the subtype (see has_subtypes); the reliability of that
    rule is discussed under discussions.

    Penetrance has not been estimated. Every reported homozygote is deaf, but every family was
    ascertained through deafness. p.Arg376Ter has been found only in Iran, and haplotype
    sharing among four families supports a founder origin there.
  evidence:
  - reference: PMID:27259055
    reference_title: "Mutations in CDC14A, Encoding a Protein Phosphatase Involved in Hair Cell Ciliogenesis, Cause Autosomal-Recessive Severe to Profound Deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequent screening of 115 unrelated individuals affected by severe or profound congenital deafness of unknown genetic cause led us to identify another CDC14A biallelic nonsense mutation"
    explanation: A second, independent family with a biallelic CDC14A nonsense allele in the gene-discovery report.
  - reference: PMID:29293958
    reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report eight families segregating different homozygous recessive mutant alleles of CDC14A associated with human deafness DFNB32."
    explanation: >-
      Eight homozygous CDC14A alleles in eight families, including families linked to the
      original DFNB32 interval after GPSM2 had been excluded.
  - reference: PMID:41308992
    reference_title: "A truncated CDC14A retains catalytic structure and phosphatase activity preserving male fertility but causes nonsyndromic deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, 16 recessive variants of human CDC14A are associated with hearing loss."
    explanation: The size of the reported allelic series.
  - reference: PMID:32231217
    reference_title: "When transcripts matter: delineating between non-syndromic hearing loss DFNB32 and hearing impairment infertile male syndrome (HIIMS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study implicates the p.Arg376Ter mutation might be as a founder mutation in the Iranian population."
    explanation: Founder allele in Iran.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    About 16 variants in roughly two dozen families had been reported by 2026, almost all
    consanguineous and from Iran, Pakistan, Tunisia, Mauritania and the United Arab Emirates.
    No population prevalence has been published, so no rate is recorded.
  evidence:
  - reference: PMID:41308992
    reference_title: "A truncated CDC14A retains catalytic structure and phosphatase activity preserving male fertility but causes nonsyndromic deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, 16 recessive variants of human CDC14A are associated with hearing loss."
    explanation: Size of the reported literature.
- population: Emirati patients with nonsyndromic hearing loss, retrospective genetic cohort
  measure_type: UNKNOWN
  notes: >-
    In a retrospective UAE cohort of genetically tested patients with nonsyndromic hearing
    loss, the CDC14A missense p.Arg312Gly was the second most frequent variant after GJB2
    alleles, found homozygous in nine patients. This is a diagnostic-yield observation in an
    ascertained cohort, not a population rate, so no class or rate is recorded. It makes
    CDC14A a comparatively frequent recessive deafness gene in this population.
  evidence:
  - reference: PMID:36056583
    reference_title: "Mutation spectrum of non-syndromic hearing loss in the UAE, a retrospective cohort study and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The second commonly found variant is c.934C > G (p.Arg312Gly) in the CDC14A gene, found in 9 patients."
    explanation: Frequency of the CDC14A allele in the Emirati cohort.
progression:
- phase: Onset
  age_range: congenital to school age
  notes: >-
    Most families report congenital or prelingual onset. In several Iranian families onset
    was placed between ages 1 and 3, and in one family carrying p.Arg345Ter the loss was
    first noticed at school entry.
  evidence:
  - reference: PMID:32231217
    reference_title: "When transcripts matter: delineating between non-syndromic hearing loss DFNB32 and hearing impairment infertile male syndrome (HIIMS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In each family hearing impairment was reported to have occurred between ages 1 and 3 years."
    explanation: Reported age of onset in four Iranian families.
- phase: Course
  age_range: childhood to adulthood
  notes: >-
    Variable. Some families worsen through childhood and adolescence and others are
    described as stable. Male infertility in the HIIMS subtype is recognised only in
    adulthood, when affected men try to father children; it is a later-detected feature
    rather than a demonstrated later-onset one.
  evidence:
  - reference: PMID:29293958
    reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "who were married stated that for many years they have been unable to father children"
    explanation: Infertility recognised in married adult men.
diagnosis:
- name: CDC14A sequencing on hearing loss panels or exome
  description: >-
    Diagnosis is by exome sequencing or a hearing loss gene panel that includes CDC14A. The
    variant's position matters for counselling: exon 10 and upstream predicts HIIMS, and
    exon 11 and downstream predicts preserved male fertility. A man found to carry an HIIMS
    allele should be offered semen analysis. The rule is based on few families and has at
    least one apparent exception, so it is a prediction to test, not a diagnosis of
    fertility.
  evidence:
  - reference: PMID:32231217
    reference_title: "When transcripts matter: delineating between non-syndromic hearing loss DFNB32 and hearing impairment infertile male syndrome (HIIMS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations that preserve the function of the NM_033313.2 transcripts are expected to result in DFNB32 deafness rather than HIIMS, whereas mutations that oblate this transcript are expected to result in HIIMS."
    explanation: The transcript-based counselling rule.
treatments:
- name: Genetic Counseling
  description: >-
    Counselling for an autosomal recessive condition with a 25 percent sibling recurrence
    risk, plus allele-specific counselling about male fertility. Because infertility is
    male-limited and allele-dependent, an affected boy's fertility prognosis depends on where
    his variant lies, and the families most at risk of an unexpected infertility diagnosis
    are those whose only affected members are female or children.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:32231217
    reference_title: "When transcripts matter: delineating between non-syndromic hearing loss DFNB32 and hearing impairment infertile male syndrome (HIIMS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The semen analysis results in this study help provide a road map for counseling and caring for individuals with CDC14A-related deafness."
    explanation: The authors' statement that the genotype-fertility correlation is for counselling.
  notes: >-
    No target_mechanisms link: counselling does not act on a pathograph node.
- name: Hearing Amplification
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid amplification
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  description: >-
    Hearing aids are used for oral communication by affected individuals in families with
    moderate-to-severe loss. Amplification does not act on the degenerating hair cells; its
    usefulness falls as the loss progresses.
  target_mechanisms:
  - target: Bilateral Sensorineural Hearing Impairment
    description: >-
      Compensates for raised thresholds while residual hearing remains. No treatment_effect
      is recorded, because amplification does not change the mechanism.
  evidence:
  - reference: PMID:29293958
    reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "affected individuals from the families HPK1 and PKSN10 use hearing aids for oral communication"
    explanation: Documented use, not a measured outcome.
- name: Cochlear Implantation
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  description: >-
    The standard intervention for severe-to-profound sensorineural loss. The lesion in mice
    is in the hair cells, which an implant bypasses, but the mismatch between surviving hair
    cells and profound deafness in Cdc14a mice raises the possibility of a defect elsewhere in
    the auditory pathway, and the mouse Cdc14a reporter is also active in spiral ganglion,
    which an implant relies on.
  target_mechanisms:
  - target: Postnatal Hair Cell Degeneration
    treatment_effect: BYPASSES
    description: >-
      Electrical stimulation of the spiral ganglion replaces the transduction that lost hair
      cells no longer provide.
  notes: >-
    Carries no evidence item deliberately. No implantation outcome has been reported for a
    CDC14A patient, and quoting the general implant literature would attach evidence about a
    different population to this disease.
animal_models:
- name: Cdc14a knockout-first and exon 3 deletion mice
  species: Mouse
  genotype: Cdc14a tm1a, tm1b and tm1d homozygotes and tm1a/tm1b compound heterozygotes
  publication: PMID:29293958
  description: >-
    Three loss-of-function alleles made from the knockout-first construct. Homozygosity
    causes substantial perinatal lethality, with only 2.8 percent of pups surviving to
    weaning; survivors live normally. They have only residual low-frequency hearing at
    postnatal day 16, are profoundly deaf by day 90, and lack otoacoustic emissions from the
    first test. Males are infertile and females fertile.
  genes:
  - preferred_term: Cdc14a (mouse ortholog of CDC14A)
    term:
      id: hgnc:1718
      label: CDC14A
  modeled_mechanisms:
  - target: Postnatal Hair Cell Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Normal hair bundle development followed by stereocilia fusion and hair cell loss.
    limitations: >-
      Perinatal lethality means the survivors are a selected few percent of homozygotes,
      and no lethality has been reported in humans. The mouse course runs over weeks,
      whereas most human families have congenital loss. The alleles are nulls, so they model
      HIIMS rather than the DFNB32 truncations.
    evidence:
    - reference: PMID:29293958
      reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Auditory hair cells of postnatal Cdc14a mutants develop normally, but subsequently degenerate causing deafness."
      explanation: The hair cell phenotype of the mutant mice.
  - target: Seminiferous Tubule Degeneration and Spermiation Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Testicular degeneration, low sperm counts and male-only infertility.
    limitations: >-
      Human testicular histology has not been examined, so whether the human lesion is the
      same spermiation failure is inferred from semen findings alone.
    evidence:
    - reference: PMID:29293958
      reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In mutant male mice, degeneration of seminiferous tubules and spermiation defects result in low sperm count, and abnormal sperm motility and morphology."
      explanation: The testicular phenotype of the mutant mice.
- name: Cdc14a p.Cys278Ser catalytic-dead mouse
  species: Mouse
  genotype: Cdc14a c.832T>A (p.C278S), CRISPR/Cas9 knock-in, homozygous
  publication: PMID:29293958
  description: >-
    A single substitution at the catalytic cysteine that abolishes phosphatase activity
    while leaving the protein's fold and its hair cell localisation intact. Homozygotes are
    severely to profoundly deaf, have the same stereocilia fusion and hair cell degeneration
    as the null alleles, and males are infertile. It is the experiment that ties both
    phenotypes to the enzyme activity itself.
  genes:
  - preferred_term: Cdc14a (mouse ortholog of CDC14A)
    term:
      id: hgnc:1718
      label: CDC14A
  modeled_mechanisms:
  - target: Loss of CDC14A Catalytic Phosphatase Activity
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Removes exactly the activity that the human catalytic-domain missense alleles are
      predicted to remove.
    limitations: >-
      The human missense alleles are not the same substitution; p.Arg312Gln, for example,
      also causes the protein to aggregate in transfected cells, which is a second defect
      the catalytic-dead mouse does not model.
    evidence:
    - reference: PMID:29293958
      reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Collectively, these data indicate that the phosphatase catalytic activity of mouse CDC14A is essential for male fertility and hearing and promotes perinatal viability."
      explanation: The authors' conclusion from this allele.
- name: Cdc14a knockout mouse (male reproductive study)
  species: Mouse
  genotype: Cdc14a -/-
  publication: PMID:32679235
  description: >-
    An independent knockout studied for the male reproductive phenotype. Males are highly
    subfertile rather than sterile; eggs fertilised by them mostly die during development.
    The study adds a meiotic initiation defect and raised testicular levels of the CDC14A
    substrates CDC25A, WEE1 and PR-SET7. Hearing was not reported.
  genes:
  - preferred_term: Cdc14a (mouse ortholog of CDC14A)
    term:
      id: hgnc:1718
      label: CDC14A
  modeled_mechanisms:
  - target: Seminiferous Tubule Degeneration and Spermiation Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reduced sperm count and motility and more abnormally formed sperm, with empty spaces in seminiferous tubules.
    limitations: >-
      Subfertility rather than the complete infertility seen in the 2018 lines; the
      difference between the two knockout designs has not been reconciled. The raised
      substrate levels are correlative and do not show which substrate matters.
    evidence:
    - reference: PMID:32679235
      reference_title: "Cdc14a has a role in spermatogenesis, sperm maturation and male fertility."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cdc14a-/- male mice were subfertile and they could only produce very few offspring."
      explanation: Male subfertility in an independent knockout.
- name: cdc14aa germline frameshift zebrafish
  species: Zebrafish
  genotype: cdc14aa c.854_860del (p.G284fs4X), CRISPR/Cas9, homozygous
  publication: PMID:29293958
  description: >-
    A germline frameshift in the phosphatase domain of one of the two zebrafish CDC14A
    orthologs. Startle response, hair cell mechanotransduction, kinocilium length and male
    fertility are all normal. The paralog cdc14ab was left intact, so redundancy between the
    two fish genes is a possible explanation.
  genes:
  - preferred_term: cdc14aa (zebrafish ortholog of CDC14A)
    term:
      id: hgnc:1718
      label: CDC14A
  modeled_mechanisms:
  - target: Postnatal Hair Cell Degeneration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      No hearing or hair cell phenotype, and normal kinocilia, contradicting the earlier
      morpholino knockdowns.
    limitations: >-
      Only cdc14aa was mutated; cdc14ab may compensate, and genetic compensation triggered
      by the germline mutation is also possible. A double mutant has not been reported.
    evidence:
    - reference: PMID:29293958
      reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Kinocilia of germ-line mutants of mouse and zebrafish have normal lengths, which does not recapitulate the published cdc14aa knockdown morphant phenotype of short kinocilia."
      explanation: The negative result in the germline fish.
discussions:
- discussion_id: cdc14a_dfnb32_vs_hiims_boundary
  kind: INTERPRETATION
  prompt: >-
    Is CDC14A deafness one disease with a male-limited syndromic subtype, or two diseases,
    and how reliable is the exon 10 versus exon 11 rule that is used to tell them apart?
  attaches_to:
  - has_subtypes#DFNB32
  - has_subtypes#HIIMS
  - phenotypes#Male Infertility
  rationale: >-
    The name nonsyndromic is accurate for females, for males with C-terminal truncations,
    and for every affected child; it is wrong for adult males carrying catalytic-domain
    alleles. OMIM lumps the two under one phenotype entry with or without immotile sperm.
    MONDO splits them, with HIIMS under syndromic disease and no subsumption between the two
    terms. This entry lumps, because the hearing loss, its mouse mechanism and the gene are
    shared, and records HIIMS as a subtype bound to its MONDO term.

    The split rests on a mechanistic explanation that is now fairly strong: exon 11
    truncations escape nonsense-mediated decay because exon 11 ends a short isoform, and the
    resulting protein keeps its activity. But the clinical rule built on it rests on few
    men. Six men had semen analyses in the 2018 series, four in 2020, and the rest is
    self-reported fertility. Two observations cut against treating the rule as settled. The
    catalytic-domain missense p.Arg312Gly, an HIIMS allele, was found homozygous in nine
    Emirati patients with no fertility problems reported, though fertility appears not to
    have been assessed. And two brothers homozygous for the DFNB32-type p.Arg376Ter had only
    3 to 4 percent normally formed sperm, at the lower reference limit. The mechanistic
    explanation also has a gap: the exon 11 frameshift p.Ser348Glnfs*2 gave markedly reduced
    CDC14A transcript in blood, consistent with decay rather than escape, and the men
    carrying it have not had their fertility assessed.

    The practical consequence is counselling. A man told his allele predicts normal fertility
    may not have it, and a family with only affected women cannot be placed in either
    subtype clinically.
  evidence:
  - reference: PMID:29293958
    reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nevertheless, not all deaf males with homozygous mutations of CDC14A are infertile."
    explanation: The observation that created the two subtypes.
  - reference: PMID:32231217
    reference_title: "When transcripts matter: delineating between non-syndromic hearing loss DFNB32 and hearing impairment infertile male syndrome (HIIMS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical results from affected males suggest the NM_033313.2 transcript alone is sufficient for proper male fertility, but not for proper auditory function."
    explanation: Transcript-level explanation for the split.
  - reference: PMID:36056583
    reference_title: "Mutation spectrum of non-syndromic hearing loss in the UAE, a retrospective cohort study and literature review."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, the same mutation was reported before to be associated with deafness and male infertility (Imtiaz, 2017), none of our patients had fertility issues reported."
    explanation: >-
      An HIIMS allele without reported infertility in nine patients. Weak, because fertility
      was apparently not assessed, but it is the largest group carrying one HIIMS allele.
  - reference: PMID:32231217
    reference_title: "When transcripts matter: delineating between non-syndromic hearing loss DFNB32 and hearing impairment infertile male syndrome (HIIMS)."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The two brothers of L1096 however, had a borderline percentage of healthy morphological sperm, with only 3–4% of overall sperm exhibiting normal morphology."
    explanation: A borderline sperm finding in men with a DFNB32-type allele.
  - reference: PMID:31906439
    reference_title: "Novel Loss-of-Function Variants in CDC14A are Associated with Recessive Sensorineural Hearing Loss in Iranian and Pakistani Patients."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "the c.1041dup variant results in a defective transcript that is likely degraded by nonsense-mediated mRNA decay"
    explanation: >-
      An exon 11 frameshift (p.Ser348Glnfs*2) that appears to undergo nonsense-mediated
      decay in blood, unlike p.Arg345Ter, so the NMD-escape explanation for the DFNB32 class
      may not hold for every exon 11 allele. Indirect because the affected men were
      unmarried and fertility was not assessed.
  proposed_experiments:
  - experiment_id: exp_cdc14a_semen_analysis_by_allele
    name: Semen analysis of adult men homozygous for each reported CDC14A allele
    description: >-
      Offer semen analysis, with WHO reference criteria, to affected adult men in the
      Emirati p.Arg312Gly families and in all families carrying exon 11 or more 3'
      truncations, and compare sperm count, motility and morphology by allele position.
    would_support:
    - has_subtypes#HIIMS
    supporting_outcome:
    - >-
      Men homozygous for p.Arg312Gly have the HIIMS semen picture and men with exon 11
      truncations have normal semen, confirming that allele position predicts fertility.
    would_refute:
    - has_subtypes#HIIMS
    refuting_outcome:
    - >-
      Men homozygous for p.Arg312Gly have normal semen, or men with exon 11 truncations
      have consistently abnormal semen, which would mean the exon rule is not a reliable
      counselling tool.
- discussion_id: cdc14a_substrates_in_ear_and_testis
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which proteins does CDC14A dephosphorylate in hair cells and in the testis, and why does
    losing that activity cause hair cells to degenerate after they have formed normally?
  attaches_to:
  - pathophysiology#Loss of CDC14A Catalytic Phosphatase Activity
  - pathophysiology#Postnatal Hair Cell Degeneration
  - pathophysiology#Seminiferous Tubule Degeneration and Spermiation Failure
  rationale: >-
    The pathograph goes straight from loss of phosphatase activity to tissue degeneration
    because nothing is known in between. In cultured human cells CDC14A dephosphorylates the
    actin-binding protein drebrin and regulates ciliogenesis; in mouse testis the CDK
    regulators CDC25A and WEE1 and the histone methyltransferase PR-SET7 accumulate. None of
    these has been tested as the substrate responsible for the in vivo phenotype. The
    authors who made the mice note that the search is narrowed by CDC14A's localisation in
    kinocilia, basal bodies and stereocilia.
  evidence:
  - reference: PMID:29293958
    reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The phosphoprotein substrates of CDC14A critical for hearing and male fertility have not yet been identified, but the search is delimited by the subcellular localizations of CDC14A."
    explanation: The gap as stated by the group that made the mouse models.
  - reference: PMID:29293958
    reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our observations leave open the question as to whether CDC14A-associated deafness in humans and mice is the result of malfunctioning kinocilia, stereocilia or primary defects elsewhere that subsequently trigger degeneration of hair cells."
    explanation: Even the compartment in which the defect starts is unresolved.
  - reference: PMID:30467237
    reference_title: "The human phosphatase CDC14A modulates primary cilium length by regulating centrosomal actin nucleation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Indeed, we find that hCDC14A counteracts the CDK5-dependent phosphorylation of drebrin at S142 during ciliogenesis."
    explanation: >-
      A candidate substrate identified in a human epithelial cell line; indirect because it
      has not been tested in hair cells.
  proposed_experiments:
  - experiment_id: exp_cdc14a_hair_cell_phosphoproteome
    name: Phosphoproteomics of Cdc14a catalytic-dead cochlea before degeneration
    description: >-
      Compare the phosphoproteome of cochlear sensory epithelium from wild-type and
      p.Cys278Ser mice at postnatal days 10 to 14, before hair cell loss, and test the top
      hyperphosphorylated proteins for a phosphomimetic phenotype in hair cells.
    would_support:
    - pathophysiology#Loss of CDC14A Catalytic Phosphatase Activity
    supporting_outcome:
    - >-
      A small set of hair bundle or ciliary proteins is hyperphosphorylated before
      degeneration, and a phosphomimetic form of one of them reproduces the lesion.
    would_refute:
    - pathophysiology#Loss of CDC14A Catalytic Phosphatase Activity
    refuting_outcome:
    - >-
      No consistent hyperphosphorylation before degeneration, which would point to a
      non-catalytic or secondary mechanism downstream of the enzyme.
- discussion_id: cdc14a_kinocilium_hypothesis_and_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    The gene-discovery report attributed DFNB32 to short kinocilia, based on zebrafish
    morpholino knockdown. Germline mouse and zebrafish mutants have normal kinocilia. Is
    there any kinocilium defect in human CDC14A deafness, and which model should be
    trusted?
  attaches_to:
  - pathophysiology#Postnatal Hair Cell Degeneration
  - animal_models#cdc14aa germline frameshift zebrafish
  rationale: >-
    The kinocilium hypothesis is in the title of the gene-discovery paper and is repeated in
    later cohort reports. The better evidence is against it. Two morpholino studies reported
    kinocilia shortened by 14 to 22.5 percent; a germline cdc14aa frameshift fish and three
    mouse lines have kinocilia of normal length and, in mouse, normal bundles until after
    hearing onset. Morpholino phenotypes often fail to replicate in germline mutants, but a
    germline fish mutant can also be rescued by its paralog cdc14ab, which was not mutated.
    In human cells the direction is reversed: catalytically dead CDC14A gives longer primary
    cilia. No human hair cell or kinocilium has been examined.
  evidence:
  - reference: PMID:27259055
    reference_title: "Mutations in CDC14A, Encoding a Protein Phosphatase Involved in Hair Cell Ciliogenesis, Cause Autosomal-Recessive Severe to Profound Deafness."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "By using a morpholino strategy to knockdown cdc14a in zebrafish larvae, we found that the length of the kinocilia was reduced in inner-ear hair cells."
    explanation: The original kinocilium finding.
  - reference: PMID:29293958
    reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Kinocilia of germ-line mutants of mouse and zebrafish have normal lengths, which does not recapitulate the published cdc14aa knockdown morphant phenotype of short kinocilia."
    explanation: Germline mutants of two species do not reproduce it.
  - reference: PMID:30467237
    reference_title: "The human phosphatase CDC14A modulates primary cilium length by regulating centrosomal actin nucleation."
    supports: REFUTE
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Here, we show that human RPE1 hCDC14APD cells, encoding a phosphatase dead version of hCDC14A, have longer cilia than wild-type cells, while hCDC14A overexpression reduces cilia formation."
    explanation: >-
      In human cells, loss of activity lengthens cilia, the opposite of the morphant
      result. Indirect because these are epithelial cells, not hair cells.
  proposed_experiments:
  - experiment_id: exp_cdc14aa_cdc14ab_double_mutant
    name: cdc14aa and cdc14ab double germline mutant zebrafish
    description: >-
      Generate fish lacking both CDC14A orthologs and measure kinocilium length, hair cell
      mechanotransduction, startle response and male fertility.
    would_support:
    - animal_models#cdc14aa germline frameshift zebrafish
    supporting_outcome:
    - >-
      Double mutants have normal kinocilia, which would settle that the morphant phenotype
      was an artefact.
    would_refute:
    - animal_models#cdc14aa germline frameshift zebrafish
    refuting_outcome:
    - >-
      Double mutants have short kinocilia or a hearing defect, which would show the single
      mutant was masked by paralog redundancy.
notes: >-
  No GeneReviews chapter covers DFNB32 or HIIMS; `just check-genereviews --online` against
  the 2026-09-10 Bookshelf index and a live PubMed title search returned NO_CHAPTER.

  MONDO:0100069 (hearing impairment and infertile male syndrome) was looked up on OLS: its
  parent is MONDO:0002254 syndromic disease, not MONDO:0012091, and its definition cites
  PMID:29293958. It is bound here as a subtype rather than left for a separate entry because
  the two share gene, hearing phenotype and mouse mechanism and differ by allele and by a
  male-limited feature. If a separate HIIMS entry is ever created, the HIIMS subtype here
  should become a pointer carrying curated_in.

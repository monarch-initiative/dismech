genetic:
- name: CDC14A
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: CDC14A
    term:
      id: hgnc:1718
      label: CDC14A
  notes: >-
    CDC14A has multiple alternatively spliced transcripts. Transcript identifiers and exon numbering must accompany variant interpretation; a predicted short-isoform effect does not demonstrate the same RNA or protein outcome in cochlea and testis. The 2018 study found two abnormal leukocyte splice products for c.839-3C>G. The 2020 study demonstrated cryptic splice-site use for c.1421+2T>C in a HEK293T minigene assay and strongly reduced whole-blood RNA for c.1041dup (p.Ser348Glnfs*2). The later p.Arg345Ter study instead found stable leukocyte RNA. p.Arg376Ter shared a haplotype across four Iranian families, supporting a possible founder origin in that series. Penetrance and ancestry-wide carrier frequency are unknown. CDC14B did not compensate for hearing and fertility defects in the studied mouse mutants; this does not exclude compensation for other functions.
  evidence:
  - reference: PMID:27259055
    reference_title: "Mutations in CDC14A, Encoding a Protein Phosphatase Involved in Hair Cell Ciliogenesis, Cause Autosomal-Recessive Severe to Profound Deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequent screening of 115 unrelated individuals affected by severe or profound congenital deafness of unknown genetic cause led us to identify another CDC14A biallelic nonsense mutation"
    explanation: A second, independent family with a biallelic CDC14A nonsense allele in the gene-discovery report.
  - reference: PMID:29293958
    reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report eight families segregating different homozygous recessive mutant alleles of CDC14A associated with human deafness DFNB32."
    explanation: >-
      Eight homozygous CDC14A alleles in eight families, including families linked to the
      original DFNB32 interval after GPSM2 had been excluded.
  - reference: PMID:41308992
    reference_title: "A truncated CDC14A retains catalytic structure and phosphatase activity preserving male fertility but causes nonsyndromic deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, 16 recessive variants of human CDC14A are associated with hearing loss."
    explanation: The size of the reported allelic series.
  - reference: PMID:32231217
    reference_title: "When transcripts matter: delineating between non-syndromic hearing loss DFNB32 and hearing impairment infertile male syndrome (HIIMS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study implicates the p.Arg376Ter mutation might be as a founder mutation in the Iranian population."
    explanation: Founder allele in Iran.
  - reference: PMID:31906439
    reference_title: Novel Loss-of-Function Variants in CDC14A are Associated with Recessive Sensorineural Hearing Loss in Iranian and Pakistani Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Since both affected individuals in family 1 are female and the unmarried status of both affected males in family 2, we cannot exclude that the newly identified CDC14A variants would also cause male infertility.
    explanation: Reproductive phenotype was not established for either newly reported allele.
  - reference: PMID:31906439
    reference_title: Novel Loss-of-Function Variants in CDC14A are Associated with Recessive Sensorineural Hearing Loss in Iranian and Pakistani Patients.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The eight nucleotide deletion leads to a frameshift c.1414_1421del, p.Val472Leufs*20 (NM_033312.2) and the incorporation of a premature stop codon 20 triplicate bp positions downstream (Figure 2e).
    explanation: The experimentally observed eight-nucleotide deletion changes the reading frame and introduces a premature stop. Protein production in patient tissues was not measured.
  - reference: PMID:31906439
    reference_title: Novel Loss-of-Function Variants in CDC14A are Associated with Recessive Sensorineural Hearing Loss in Iranian and Pakistani Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The RT-qPCR analysis showed that the relative expression levels of CDC14A were significantly reduced by approximately 99% relative expression for both targeted regions for the homozygous individual (II.2) relative to WT controls.
    explanation: Whole-blood RNA from a c.1041dup homozygote was strongly reduced; NMD and tissue-specific consequences remain inferred.
  - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC11305659/
    reference_title: 'Delineating the Disease Boundaries: Homozygous CDC14A Variants Underlying Nonsyndromic Hearing Loss and Hearing Impairment Infertile Male Syndrome - PMC'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: both variants were classified as variants of uncertain significance by ACMG classification
    explanation: The primary full text classifies p.Gln334Ter and p.Asn228Lys as VUS. Segregation and in-silico predictions do not establish a measured variant-specific biochemical mechanism.
  - reference: PMID:31906439
    reference_title: Novel Loss-of-Function Variants in CDC14A are Associated with Recessive Sensorineural Hearing Loss in Iranian and Pakistani Patients.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The effect of the splice variant (c.1421+2T>C) in intron 14 was subjected to testing using a minigene assay that included cloning of exon 14, as well as the 5′ and 3′ flanking intronic sequences into an exon trapping vector
    explanation: The splice effect was tested using an exon-trapping minigene, rather than patient cochlear or testicular RNA.

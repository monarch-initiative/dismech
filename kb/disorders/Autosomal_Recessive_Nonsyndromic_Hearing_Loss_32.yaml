has_subtypes:
- name: DFNB32
  display_name: DFNB32 (deafness with preserved male fertility)
  classification: clinical_phenotype
  description: >-
    The nonsyndromic allelic class. Affected individuals of both sexes are deaf, and
    affected males are fertile or have semen parameters within or near reference ranges.
    The reported alleles are truncations in exon 11 or further 3' (p.Arg339Ter, p.Arg345Ter,
    p.Ser348Glnfs*2, p.Arg376Ter, p.Gln334Ter, p.Ala451Thrfs*43) and a splice-donor variant
    in intron 14. Exon 11 is the last exon of a short CDC14A isoform, so these transcripts
    escape nonsense-mediated decay and encode a protein that keeps both phosphatase domains
    and its activity but lacks the disordered C-terminal tail. No separate MONDO term exists
    for this class; MONDO:0012091, the term this whole entry is bound to, is the closest.
  evidence:
  - reference: PMID:32231217
    reference_title: "When transcripts matter: delineating between non-syndromic hearing loss DFNB32 and hearing impairment infertile male syndrome (HIIMS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We conclude that DFNB32 is a distinct phenotypic entity in males."
    explanation: >-
      Conclusion drawn from semen analyses of deaf men homozygous for exon 11 truncations,
      which were normal or near normal.
  - reference: PMID:41308992
    reference_title: "A truncated CDC14A retains catalytic structure and phosphatase activity preserving male fertility but causes nonsyndromic deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants affecting the globular N-terminal domains of human CDC14A are associated with HIIMS, whereas mutations in the IDR cause nonsyndromic deafness DFNB32."
    explanation: >-
      The genotype-phenotype boundary that defines the two subtypes, stated across all 16
      reported variants.
- name: HIIMS
  display_name: Hearing impairment and infertile male syndrome
  classification: clinical_phenotype
  subtype_term:
    preferred_term: hearing impairment and infertile male syndrome
    term:
      id: MONDO:0100069
      label: hearing impairment and infertile male syndrome
  description: >-
    The syndromic allelic class. Females are deaf and fertile; males are deaf and infertile,
    with oligozoospermia or azoospermia, poorly motile sperm and abnormal sperm morphology.
    The reported alleles abolish or remove the catalytic domain: the missense changes
    p.Arg312Gln, p.Arg312Gly, p.Gln320Pro and p.Asn228Lys, the N-terminal truncations
    p.Tyr126Ilefs*64 and p.Tyr139Ter, and an exon 10 acceptor splice variant. MONDO places
    this term under syndromic disease rather than under MONDO:0012091, so binding it here as
    a subtype is a lumping decision taken by this entry, not one MONDO makes. The syndrome is
    sex-limited: it can only be recognised in a family with an affected adult man who has
    tried to father children or had a semen analysis, so a family with only affected women or
    children cannot be assigned to either subtype on clinical grounds.
  evidence:
  - reference: PMID:29293958
    reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Infertility of some deaf males is associated with specific variants of CDC14A and defines a new monogenic syndrome (designated HIIMS) owing to insufficient phosphatase activity, while other variants with residual activity are associated with non-syndromic deafness DFNB32."
    explanation: >-
      The original definition of HIIMS as an allele-specific syndromic form of the same
      CDC14A disease.
  - reference: PMID:39119445
    reference_title: "Delineating the Disease Boundaries: Homozygous CDC14A Variants Underlying Nonsyndromic Hearing Loss and Hearing Impairment Infertile Male Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Variants in exon 10 and upstream cause HIIMS, and those in exon 11 and downstream are linked exclusively to hearing impairment."
    explanation: >-
      An independent pair of families, one with each form, used to state the exon boundary
      between the subtypes.
inheritance:
- name: Autosomal recessive
  description: >-
    Homozygous CDC14A variants segregating with deafness in consanguineous families from
    Tunisia, Pakistan, Iran and Mauritania; heterozygous parents and siblings hear normally.
    Infertility in the HIIMS subtype is male-limited, which is a sex-limited expression of an
    autosomal recessive genotype rather than a different mode of inheritance.
  inheritance_term:

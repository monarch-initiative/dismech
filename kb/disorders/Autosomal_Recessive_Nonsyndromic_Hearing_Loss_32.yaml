    Cochlear implantation may be considered according to general candidacy criteria for severe-to-profound sensorineural hearing loss and inadequate aided benefit. The reviewed CDC14A studies do not establish a gene-specific implant outcome. Mouse hair-cell degeneration supports a possible rationale, but does not establish that human auditory neural function is preserved.

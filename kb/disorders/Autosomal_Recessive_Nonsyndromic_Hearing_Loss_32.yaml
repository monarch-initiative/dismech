    evidence_source: HUMAN_CLINICAL
    snippet: "Deaf male V:3 family (MORL1) has a normal sperm count but 67% were immotile."
    explanation: Immotile sperm with a normal count in a man homozygous for p.Arg312Gly.
- name: Oligozoospermia
  category: Reproductive
  subtype: HIIMS
  description: Low sperm count, reported in one of the six men who had a semen analysis.
  phenotype_term:
    preferred_term: Oligozoospermia
    term:
      id: HP:0000798
      label: Oligozoospermia
  evidence:
  - reference: PMID:29293958
    reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."

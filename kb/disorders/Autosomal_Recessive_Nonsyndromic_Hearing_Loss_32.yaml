    explanation: Homozygosity in every affected member of six further Iranian families.
pathophysiology:
- name: Loss of CDC14A Catalytic Phosphatase Activity
  description: >-
    CDC14A is a dual-specificity phosphatase whose catalytic domain (DSPc, residues 217-325)
    dephosphorylates serine, threonine and tyrosine residues. The HIIMS alleles remove this
    activity: the missense substitutions p.Arg312Gln and p.Arg312Gly are predicted to
    destabilise the substrate-binding acidic groove, p.Gln320Pro to prevent activation of
    the catalytic water molecule, and the N-terminal truncations and exon 10 splice variant
    delete the domain altogether. The decisive test was made in mouse: a single
    cysteine-to-serine change at the catalytic residue (p.Cys278Ser), which kills activity
    without altering the protein's fold or its localisation in hair cells, reproduces
    deafness and male infertility as completely as the knockout alleles. Phosphatase
    activity is therefore required for both organs, which is the reason this node sits
    upstream of both the cochlear and the testicular lesion.
  biological_scale: MOLECULAR
  subtypes:
  - HIIMS
  genes:
  - preferred_term: CDC14A
    term:
      id: hgnc:1718
      label: CDC14A
  molecular_functions:
  - preferred_term: CDC14A dual-specificity phosphatase activity
    term:
      id: GO:0008138
      label: protein tyrosine/serine/threonine phosphatase activity
    modifier: DECREASED
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Postnatal Hair Cell Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Removing catalytic activity alone, in the p.Cys278Ser mouse, causes the same
      stereocilia fusion and hair cell degeneration as the null alleles. The substrates
      whose phosphorylation state matters in the hair cell are not known, so the
      intermediates are unknown.
    evidence:
    - reference: PMID:29293958
      reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "By SEM, inner ears of P60 deaf F0 homozygous C278S-CDC14A mice show fusion of stereocilia and degeneration of hair cells indistinguishable from other mutant alleles of Cdc14a"
      explanation: >-
        A point mutation that removes only catalytic activity reproduces the hair cell
        lesion, which ties the lesion to the enzyme activity rather than to the protein's
        presence.
  - target: Seminiferous Tubule Degeneration and Spermiation Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same catalytically dead mouse allele causes male infertility with seminiferous
      tubule degeneration. Which substrates link the enzyme to the spermatogenic lesion is
      unknown.
    evidence:
    - reference: PMID:29293958
      reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Homozygous F0 C278S-CDC14A male mice were infertile and showed degeneration of seminiferous tubules"
      explanation: The testicular lesion produced by loss of catalytic activity alone.
  evidence:
  - reference: PMID:29293958
    reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Collectively, these data indicate that the phosphatase catalytic activity of mouse CDC14A is essential for male fertility and hearing and promotes perinatal viability."
    explanation: The authors' conclusion from the knockout and catalytic-dead mouse alleles.
  - reference: PMID:29293958
    reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "As a result, the p.Q320P variant of CDC14A would not hydrolyze the covalent bond between C278 and the phosphate, resulting in a catalytically inactive CDC14A, where the substrate remains bound."
    explanation: >-
      Structural-model prediction that one of the human HIIMS missense alleles is
      catalytically dead. A model, not a measured activity.
- name: Loss of the CDC14A C-Terminal Disordered Region
  description: >-
    The nonsyndromic DFNB32 alleles truncate CDC14A after the two globular domains. The
    623-residue protein ends in a 278-residue intrinsically disordered region (IDR) that
    carries the nuclear export signal. Exon 11 truncations would be expected to trigger
    nonsense-mediated decay of the full-length transcript, but exon 11 is the final exon of a
    shorter isoform, and the p.Arg345Ter transcript is present at normal levels in patient
    leukocytes. The resulting protein (residues 1-345) was purified, crystallised and shown to
    keep its fold and its phosphatase activity. What it loses is the tail, and with it,
    nuclear export. The node therefore describes a protein that is catalytically competent
    but in the wrong place, which is what separates this subtype from HIIMS.
  biological_scale: MOLECULAR
  subtypes:
  - DFNB32
  genes:
  - preferred_term: CDC14A
    term:
      id: hgnc:1718
      label: CDC14A
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
  downstream:
  - target: Nuclear Retention and Hair Bundle Mislocalization of CDC14A
    causal_link_type: DIRECT
    description: >-
      Without the C-terminal region, which contains the nuclear export signal, the truncated
      protein is retained in the nucleus.
    evidence:
    - reference: PMID:41308992
      reference_title: "A truncated CDC14A retains catalytic structure and phosphatase activity preserving male fertility but causes nonsyndromic deafness."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These data indicate that residues 346 to 603 are required for robust export from the nucleus and normal subcellular localization of CDC14A in the inner ear, which are indispensable for hearing."
      explanation: >-
        Tagged full-length and truncated CDC14A compared in inner ear explants; the
        truncated protein accumulates in the nucleus.
  evidence:
  - reference: PMID:41308992
    reference_title: "A truncated CDC14A retains catalytic structure and phosphatase activity preserving male fertility but causes nonsyndromic deafness."
    supports: SUPPORT

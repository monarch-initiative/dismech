phenotypes:
- name: Bilateral Sensorineural Hearing Impairment
  category: Auditory
  frequency: OBLIGATE
  description: >-
    Bilateral sensorineural hearing loss is the defining feature in every reported family and
    in both sexes and both subtypes. Severity ranges from moderate to profound and varies with
    allele: the catalytic-site missense p.Gln320Pro gave the most severe loss among the eight
    families in the 2018 series, while carriers of exon 11 truncations ranged from
    moderate-to-severe to profound. Some individuals had asymmetric audiograms.
    `frequency: OBLIGATE` reflects that hearing loss is how every family was ascertained,
    not a measured penetrance.
  phenotype_term:
    preferred_term: Bilateral sensorineural hearing impairment
    term:
      id: HP:0008619
      label: Bilateral sensorineural hearing impairment
  evidence:
  - reference: PMID:31906439
    reference_title: "Novel Loss-of-Function Variants in CDC14A are Associated with Recessive Sensorineural Hearing Loss in Iranian and Pakistani Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients reported congenital, bilateral, sensorineural HL"
    explanation: Bilateral sensorineural loss in an Iranian and a Pakistani family.
  - reference: PMID:29293958
    reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In family PKDF539 segregating the p.Q320P substitution of CDC14A, HL is the most severe among the eight families"
    explanation: Allele-dependent severity, with the catalytic-site allele at the severe end.
  - reference: PMID:32231217
    reference_title: "When transcripts matter: delineating between non-syndromic hearing loss DFNB32 and hearing impairment infertile male syndrome (HIIMS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Regardless of gender, the loss of CDC14A and its phosphatase activity results in hearing loss."
    explanation: Hearing loss is shared by both sexes and both allelic classes.
- name: Congenital Severe to Profound Hearing Impairment
  category: Auditory
  description: >-
    The presentation in the founding Tunisian family, in the Iranian family of the 2016 gene
    report, and in the two families of the 2020 functional study: deafness present from
    birth, severe to profound. In other families the loss was first noticed between ages 1
    and 3, or at school entry, so congenital onset is common but not universal. No newborn
    hearing screen result has been reported for any affected child.
  phenotype_term:
    preferred_term: Congenital severe to profound sensorineural hearing impairment
    term:
      id: HP:0008527
      label: Congenital sensorineural hearing impairment
    severity: SEVERE
  evidence:
  - reference: PMID:27259055
    reference_title: "Mutations in CDC14A, Encoding a Protein Phosphatase Involved in Hair Cell Ciliogenesis, Cause Autosomal-Recessive Severe to Profound Deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By genetic linkage analysis in a large consanguineous Iranian family with eleven individuals affected by severe to profound congenital deafness"
    explanation: Congenital severe-to-profound deafness in the gene-discovery family.
  - reference: PMID:12634867
    reference_title: "Mapping of a new autosomal recessive nonsyndromic hearing loss locus (DFNB32) to chromosome 1p13.3-22.1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have ascertained 10 individuals from a large consanguineous Tunisian family with congenital profound autosomal recessive deafness."
    explanation: Congenital profound deafness in the family that defined the locus.
- name: Progressive Sensorineural Hearing Impairment
  category: Auditory
  description: >-
    Progression is reported in some families and explicitly absent in others. In three
    Pakistani families of the 2018 series younger affected individuals had better thresholds
    than older ones, and many reported worsening with age; an Iranian family homozygous for
    p.Arg345Ter described postlingual, progressive loss first noticed at school. By contrast,
    one Iranian family homozygous for p.Arg376Ter and the proband of a family with an intron
    14 splice variant were described as non-progressive. Longitudinal audiograms are scarce,
    so most of the progression evidence is cross-sectional or by report.
  phenotype_term:
    preferred_term: Progressive sensorineural hearing impairment
    term:
      id: HP:0000408
      label: Progressive sensorineural hearing impairment
  evidence:
  - reference: PMID:29293958
    reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although we only have longitudinal audiometric data for some individuals, many affected individuals reported progressive loss of hearing with age, an observation corroborated by their parents."
    explanation: Progression by report and cross-sectional audiometry, with the authors' own caveat.
  - reference: PMID:32231217
    reference_title: "When transcripts matter: delineating between non-syndromic hearing loss DFNB32 and hearing impairment infertile male syndrome (HIIMS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals report postlingual and progressive hearing loss that was first noticed when they started school."
    explanation: Postlingual progressive loss in a family homozygous for p.Arg345Ter.
  - reference: PMID:32231217
    reference_title: "When transcripts matter: delineating between non-syndromic hearing loss DFNB32 and hearing impairment infertile male syndrome (HIIMS)."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected individuals in family GL10179 are reported to have moderate to severe non-progressive sensorineural hearing loss."
    explanation: A family in which the loss is reported as stable, so progression is not universal.
  - reference: PMID:31906439
    reference_title: "Novel Loss-of-Function Variants in CDC14A are Associated with Recessive Sensorineural Hearing Loss in Iranian and Pakistani Patients."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, the HL in the proband of family 1 can be described as non-progressive."
    explanation: A second family described as non-progressive.
- name: Male Infertility
  category: Reproductive
  subtype: HIIMS
  description: >-
    Married deaf men in five of the eight families of the 2018 series had been unable to
    father children for years, while affected women in the same families had children. In
    the other families, and in all families carrying exon 11 or more 3' truncations, affected
    men are fathers or have adequate semen parameters. Infertility is therefore restricted to
    males and to the HIIMS allelic class. Self-reported infertility in married men, with
    semen analysis in only six men, is the human evidence; the mouse data are what establish
    that the association is not coincidental.
  phenotype_term:
    preferred_term: Male infertility
    term:
      id: HP:0003251
      label: Male infertility
  evidence:
  - reference: PMID:29293958
    reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In five of these families segregating pathogenic variants of CDC14A, deaf males are infertile, while deaf females are fertile."
    explanation: Male-limited infertility in the human families.
  - reference: PMID:29293958
    reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These males did not give rise to progeny, while Cdc14a homozygous mutant deaf females had many litters of healthy pups."
    explanation: The same sex-limited pattern in mutant mice, which argues against coincidence.
  - reference: PMID:39119445
    reference_title: "Delineating the Disease Boundaries: Homozygous CDC14A Variants Underlying Nonsyndromic Hearing Loss and Hearing Impairment Infertile Male Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "both families had clinical evidence of deafness, and family B also had infertility, so we referred to them as having nonsyndromic hearing loss (NSHL) and hearing impairment infertile male syndrome (HIIMS), respectively."
    explanation: Infertility in an independent family carrying a catalytic-domain missense allele.
- name: Reduced Sperm Motility
  category: Reproductive
  subtype: HIIMS
  description: >-
    The most consistent semen finding. In the 2018 series, 67 to 100 percent of sperm were
    immotile in four men, including two brothers with normal sperm counts. OMIM's name for
    the disease ("with or without immotile sperm") is taken from this finding.

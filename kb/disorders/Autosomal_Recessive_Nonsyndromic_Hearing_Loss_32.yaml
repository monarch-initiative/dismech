    explanation: Frequency of the CDC14A allele in the Emirati cohort.
progression:
- phase: Onset
  age_range: congenital to school age
  notes: >-
    Most families report congenital or prelingual onset. In several Iranian families onset
    was placed between ages 1 and 3, and in one family carrying p.Arg345Ter the loss was
    first noticed at school entry.
  evidence:
  - reference: PMID:32231217
    reference_title: "When transcripts matter: delineating between non-syndromic hearing loss DFNB32 and hearing impairment infertile male syndrome (HIIMS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In each family hearing impairment was reported to have occurred between ages 1 and 3 years."
    explanation: Reported age of onset in four Iranian families.
- phase: Course
  age_range: childhood to adulthood
  notes: >-
    Variable. Some families worsen through childhood and adolescence and others are
    described as stable. Male infertility in the HIIMS subtype is recognised only in
    adulthood, when affected men try to father children; it is a later-detected feature
    rather than a demonstrated later-onset one.
  evidence:
  - reference: PMID:29293958
    reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "who were married stated that for many years they have been unable to father children"
    explanation: Infertility recognised in married adult men.
diagnosis:
- name: CDC14A sequencing on hearing loss panels or exome
  description: >-
    Molecular diagnosis requires biallelic pathogenic or likely pathogenic CDC14A variants, with recessive phase and segregation assessed where needed, using an appropriate hearing-loss panel or genomic test. A variant of uncertain significance is not diagnostic. Transcript-specific RNA or protein evidence can aid interpretation. Discuss reproductive history and offer semen assessment or fertility referral to appropriately counseled adult males when indicated; variant position alone does not diagnose infertility or guarantee fertility.
  evidence:
  - reference: PMID:32231217
    reference_title: "When transcripts matter: delineating between non-syndromic hearing loss DFNB32 and hearing impairment infertile male syndrome (HIIMS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations that preserve the function of the NM_033313.2 transcripts are expected to result in DFNB32 deafness rather than HIIMS, whereas mutations that oblate this transcript are expected to result in HIIMS."
    explanation: A proposed transcript-based correlation, not a validated rule for diagnosing or excluding male infertility.
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: The identification of variant(s) of uncertain significance cannot be used to confirm or rule out the diagnosis.
    explanation: General genetic hearing-loss guidance supplies the diagnostic limit for VUS.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Recommended molecular genetic testing approaches include use of a multigene hearing loss panel and/or genomic testing.
    explanation: General guidance supports panel or genomic testing; it is not a CDC14A-specific diagnostic-yield estimate.
- name: Serial audiologic assessment
  description: Perform sequential audiologic examinations to establish individual stability or progression and identify superimposed acquired hearing loss. Frequency should be individualized; the reviewed sources do not establish a CDC14A-specific interval or justify translating the mouse timeline directly to human follow-up.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Regular follow up is recommended for all individuals with genetic hearing loss
    explanation: General GeneReviews follow-up guidance supports ongoing assessment; the accompanying surveillance section recommends sequential audiologic examinations tailored to diagnosis and prognosis.
treatments:
- name: Genetic Counseling
  description: >-
    Provide recessive-inheritance counseling and discuss the uncertainty in allele-specific male fertility. When both parents are confirmed heterozygous carriers, each pregnancy has a 25% probability of an affected child, 50% of a carrier and 25% of a child inheriting neither familial allele. Fertility counseling should use the individual's reproductive assessment and the evidence for the specific allele, rather than an exon-position rule alone.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:32231217
    reference_title: "When transcripts matter: delineating between non-syndromic hearing loss DFNB32 and hearing impairment infertile male syndrome (HIIMS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The semen analysis results in this study help provide a road map for counseling and caring for individuals with CDC14A-related deafness."
    explanation: The authors' statement that the genotype-fertility correlation is for counselling.
    quote_role: PRIMARY_RESULT
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: If both parents are known to be heterozygous for an autosomal recessive hearing loss-related pathogenic variant, each sib of the proband has at conception a 25% chance of having hearing loss, a 50% chance of having no hearing loss and being a carrier, and a 25% chance of having no hearing loss and not being a carrier.
    explanation: These Mendelian probabilities apply to two confirmed heterozygous carrier parents; they are not estimates of CDC14A reproductive penetrance.
- name: Hearing Amplification
  therapeutic_modality: DEVICE
  treatment_term:

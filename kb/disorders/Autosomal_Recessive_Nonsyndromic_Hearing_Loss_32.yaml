    evidence_source: HUMAN_CLINICAL
    snippet: "had no detectable sperm in his semen"
    explanation: Azoospermia in an affected man from family HLRB11.
- name: Abnormal Sperm Morphology
  category: Reproductive
  subtypes:
  - HIIMS
  - DFNB32
  description: >-
    Abnormal sperm morphology is part of the HIIMS semen picture. It is also the one semen
    abnormality reported in DFNB32-type males: two brothers homozygous for p.Arg376Ter had

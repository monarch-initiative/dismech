pathophysiology:
- name: Loss of CDC14A Catalytic Phosphatase Activity
  description: >-
    CDC14A catalytic loss is supported by knockout and catalytic-cysteine p.Cys278Ser mouse models with hearing loss and male infertility. Prior biochemical work supported preservation of the C278S protein fold, and localization was examined in transfected cells; these are not direct measurements of every human allele in vivo. Human early truncations and c.839-3C>G splice products disrupt the catalytic region, whereas the effects of p.Arg312Gly, p.Arg312Gln and p.Gln320Pro were principally modeled computationally. The splice products do not delete the entire catalytic domain, and reproductive status was not established for p.Arg312Gln. Individual human alleles should not all be treated as experimentally demonstrated catalytic nulls.

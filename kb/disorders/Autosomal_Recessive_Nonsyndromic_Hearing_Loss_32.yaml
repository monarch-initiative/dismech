- name: Seminiferous Tubule Degeneration and Spermiation Failure
  description: >-
    In infertile Cdc14a mutant male mice, seminiferous tubules degenerate, with loss of
    spermatogenic cells, vacuolisation of Sertoli cells, spermatid heads retained at the
    basement membrane and spermatids clumped around residual bodies. Epididymal sperm counts
    fall and the remaining sperm are often abnormal. A second, independent knockout line
    describes the same subfertility and adds a meiotic phenotype, with an excess of pachytene
    spermatocytes and raised levels of the CDC14A substrates CDC25A, WEE1 and PR-SET7 in the
    testis. This is the HIIMS-specific limb of the pathograph; males carrying DFNB32-type
    alleles do not show it, and females have no counterpart.

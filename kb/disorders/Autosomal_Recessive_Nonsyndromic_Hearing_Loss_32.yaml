description: >-
  CDC14A-related autosomal recessive hearing loss ranges from congenital severe-to-profound loss to moderate or later-recognized impairment, with variable progression. Some affected males also have infertility and abnormal semen parameters, termed hearing impairment and infertile male syndrome (HIIMS); other affected men have children or semen results within or near reference ranges. Published families do not establish a reliable fertility prognosis for every allele. Normal bedside balance testing has been reported, without proving universal preservation of vestibular function.

  This entry covers the CDC14A allelic spectrum represented by OMIM:608653 and retains HIIMS as a subtype bound to MONDO:0100069. MONDO:0012091 names nonsyndromic hearing loss, so this is a broader curation scope than that term alone. Clinical subtype assignment requires reproductive assessment where informative; an affected child or a family containing only affected females cannot establish the fertility phenotype of that allele.

  Loss of CDC14A phosphatase function in mice produces progressive cochlear hair-cell degeneration and male reproductive abnormalities. For the human p.Arg345Ter allele, leukocyte RNA remains detectable, and engineered truncated mouse protein retains catalytic activity but localizes abnormally in transfected inner-ear explants. These findings support allele-dependent mechanisms, but neither the exact human cochlear lesion nor the critical physiological substrates have been established. Other exon-11 variants cannot automatically be assigned the same RNA, protein or fertility consequences.

- name: Loss of the CDC14A C-Terminal Disordered Region
  description: >-
    The p.Arg345Ter human allele removes the C-terminal region beyond the globular domains. Its RNA remains detectable in patient leukocytes, but cochlear and testicular RNA and protein were not directly assayed. A proposed short-transcript explanation does not establish the same outcome for all exon-11 alleles: p.Ser348Glnfs*2 was associated with markedly reduced blood RNA. The structural study used engineered mouse residues 1–345 expressed in insect cells. The active truncated construct retained phosphatase activity; crystallography used a separate catalytically inactive truncated construct. Full-length and truncated lysates had similar substrate-affinity estimates, but unknown protein concentrations precluded comparing catalytic efficiency. Loss of the disordered tail and its export signal supports altered localization as a mechanism for this allele, without establishing a universal molecular or fertility boundary between DFNB32 and HIIMS.

- name: Postnatal Hair Cell Degeneration
  description: >-
    In Cdc14a mutant mice the organ of Corti is built normally. Stereocilia bundles and
    kinocilia look normal at postnatal days 7 to 9, so CDC14A is not needed to make a hair
    bundle. After the onset of hearing, stereocilia fuse, inner hair cells degenerate ahead
    of outer hair cells, and by postnatal day 90 about half of the hair cells in the apical
    turn are gone. Outer hair cell function is lost early: distortion-product otoacoustic
    emissions are absent from postnatal day 16. The stria vascularis is not involved, since
    the endocochlear potential is normal. One result does not fit a pure hair-cell-loss
    account. Mice are profoundly deaf at postnatal day 90 while about half their hair cells
    remain, which the authors read as a second, unidentified defect in the auditory pathway.
  biological_scale: TISSUE

    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: On initial evaluation of individuals with hearing loss, the goals for communication must be established with a focus on equipping individuals with language and appropriate access to language.
    explanation: General hearing-loss guidance prioritizes communication access and individualized goals.
- name: Avoidance of additional noise injury
  therapeutic_modality: OTHER
  description: Counsel people with hearing loss to avoid repeated excessive noise exposure. This limits additional acquired injury; a CDC14A-specific excess susceptibility to noise is not established.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK1434/pdf/Bookshelf_NBK1434.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    directness: DIRECT
    snippet: Since this risk can be minimized by avoidance, persons with documented hearing loss should be counseled appropriately and repeated overexposure to loud noises should be avoided.
    explanation: General hearing-loss care guidance; no CDC14A-specific gene–environment interaction is asserted.
animal_models:
- name: Cdc14a knockout-first and exon 3 deletion mice
  species: Mouse
  genotype: Cdc14a tm1a, tm1b and tm1d homozygotes and tm1a/tm1b compound heterozygotes
  publication: PMID:29293958
  description: >-
    Three loss-of-function alleles derived from a knockout-first construct cause substantial perinatal loss. Surviving homozygotes numbered 12 among 436 total progeny from heterozygote crosses (2.8% of all progeny, compared with the expected 25% homozygotes); this is not a 2.8% survival rate among mutant homozygotes. Survivors had residual low-frequency hearing at P16, profound hearing loss by P90 and absent otoacoustic emissions at all tested ages. Examined mutant males were infertile and mutant females produced litters.
  genes:
  - preferred_term: Cdc14a (mouse ortholog of CDC14A)
    term:
      id: hgnc:1718
      label: CDC14A
  modeled_mechanisms:
  - target: Postnatal Hair Cell Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Initially normal-appearing hair bundles followed by stereocilia fusion and hair-cell loss.
    limitations: >-
      Perinatal loss selects the surviving mice. Human perinatal lethality was not reported in the reviewed CDC14A families. Mouse hearing develops postnatally, and these loss-of-function alleles do not specifically model the human C-terminal truncations or prove normal early hair-cell physiology.
    evidence:
    - reference: PMID:29293958
      reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Auditory hair cells of postnatal Cdc14a mutants develop normally, but subsequently degenerate causing deafness."
      explanation: The hair cell phenotype of the mutant mice.
  - target: Seminiferous Tubule Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Testicular degeneration, low sperm counts and male-only infertility.
    limitations: >-
      Human testicular histology has not been examined, so whether the human lesion is the
      same spermiation failure is inferred from semen findings alone.
    evidence:
    - reference: PMID:29293958
      reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In mutant male mice, degeneration of seminiferous tubules and spermiation defects result in low sperm count, and abnormal sperm motility and morphology."
      explanation: The testicular phenotype of the mutant mice.
  - target: Outer Hair Cell Functional Impairment
    description: Absent emissions from P16 indicate early outer-hair-cell dysfunction.
    evidence:
    - reference: PMID:29293958
      reference_title: CDC14A phosphatase is essential for hearing and male fertility in mouse and human.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Absent distortion-product otoacoustic emissions (DPOAEs) at all ages tested (P16, 30, 60 and 90; Supplementary Material, Fig. S8C) indicated a loss of outer hair cell (OHC) function for both rare homozygotes and compound heterozygotes as early as P16.
      explanation: Absent emissions show early mouse outer-hair-cell dysfunction, before extensive hair-cell loss. This is not a direct electrophysiological measurement in human hair cells.
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: Human otoacoustic and cochlear cellular mechanisms have not been established for every allele.
    fidelity: MODERATE
  - target: Impaired Spermiation
    description: Spermatid retention and aggregates support impaired spermiation.
    evidence:
    - reference: PMID:29293958
      reference_title: CDC14A phosphatase is essential for hearing and male fertility in mouse and human.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: In addition, there were retained spermatid heads at the basement membranes and/or aggregates of spermatids around residual bodies compared with control animals
      explanation: Retained spermatid heads and aggregates in mutant mouse testes support impaired spermiation. Human spermiation was not examined.
    relationship: PARTIALLY_RECAPITULATES
    model_scale: CELLULAR
    limitations: Comparable human testicular histology is unavailable.
    fidelity: MODERATE
- name: Cdc14a p.Cys278Ser catalytic-dead mouse
  species: Mouse
  genotype: Cdc14a c.832T>A (p.C278S), CRISPR/Cas9 knock-in, homozygous
  publication: PMID:29293958
  description: >-
    The engineered catalytic-cysteine p.Cys278Ser substitution produces hearing loss, stereocilia fusion, hair-cell degeneration and male infertility in mice. Prior biochemical evidence and transfected-cell localization support its use to interrogate catalytic function; these should not be presented as direct fold and localization measurements throughout the living knock-in animal. Homozygous survivors numbered five among 153 total progeny of a heterozygous cross. This is not the survival percentage among homozygotes.
  genes:
  - preferred_term: Cdc14a (mouse ortholog of CDC14A)
    term:
      id: hgnc:1718
      label: CDC14A
  modeled_mechanisms:
  - target: Loss of CDC14A Catalytic Phosphatase Activity
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Removes exactly the activity that the human catalytic-domain missense alleles are
      predicted to remove.
    limitations: >-
      The human missense alleles are not the same substitution; p.Arg312Gln, for example,
      also causes the protein to aggregate in transfected cells, which is a second defect
      the catalytic-dead mouse does not model.
    evidence:
    - reference: PMID:29293958
      reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Collectively, these data indicate that the phosphatase catalytic activity of mouse CDC14A is essential for male fertility and hearing and promotes perinatal viability."
      explanation: The authors' conclusion from this allele.
- name: Cdc14a knockout mouse (male reproductive study)
  species: Mouse
  genotype: Cdc14a -/-
  publication: PMID:32679235
  description: >-
    An independent Cdc14a knockout study reported male subfertility with few offspring and death of most embryos after fertilization. Semen findings included reduced count and motility and increased abnormal morphology. Increased proportions of pachytene spermatocytes and fewer γH2ax-stained germ cells were interpreted by the authors as impaired meiotic initiation; those observations are not a direct developmental time course. CDC25A, WEE1 and PR-SET7 levels were raised, without establishing which substrate mediates the phenotype. The cached abstract does not report hearing assessment.
  genes:
  - preferred_term: Cdc14a (mouse ortholog of CDC14A)
    term:
      id: hgnc:1718
      label: CDC14A
  modeled_mechanisms:
  - target: Seminiferous Tubule Degeneration
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reduced sperm count and motility and more abnormally formed sperm, with empty spaces in seminiferous tubules.
    limitations: >-
      Subfertility rather than the complete infertility seen in the 2018 lines; the
      difference between the two knockout designs has not been reconciled. The raised
      substrate levels are correlative and do not show which substrate matters.
    evidence:
    - reference: PMID:32679235
      reference_title: "Cdc14a has a role in spermatogenesis, sperm maturation and male fertility."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Cdc14a-/- male mice were subfertile and they could only produce very few offspring."
      explanation: Male subfertility in an independent knockout.
- name: cdc14aa germline frameshift zebrafish
  species: Zebrafish
  genotype: cdc14aa c.854_860del (p.G284fs4X), CRISPR/Cas9, homozygous
  publication: PMID:29293958
  description: >-
    A germline frameshift disrupts one of the two zebrafish CDC14A orthologs. The study reported a normal tap-evoked startle response at six days postfertilization, FM1–43 dye uptake at five days (data not shown), normal kinocilium length and fertile adult males. These readouts do not constitute comprehensive audiometry or direct mechanotransduction-current measurements. The unaltered paralog cdc14ab and other genetic compensation are possible explanations for the difference from mouse and morphant findings.
  genes:
  - preferred_term: cdc14aa (zebrafish ortholog of CDC14A)
    term:
      id: hgnc:1718
      label: CDC14A
  modeled_mechanisms:
  - target: Postnatal Hair Cell Degeneration
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The reported larval startle, dye-uptake and kinocilium measurements did not reproduce the mouse auditory lesion; long-term hair-cell degeneration was not comprehensively excluded.
    limitations: >-
      Only cdc14aa was mutated; cdc14ab may compensate, and genetic compensation triggered
      by the germline mutation is also possible. A double mutant has not been reported.
    evidence:
    - reference: PMID:29293958
      reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Kinocilia of germ-line mutants of mouse and zebrafish have normal lengths, which does not recapitulate the published cdc14aa knockdown morphant phenotype of short kinocilia."
      explanation: The negative result in the germline fish.
- name: cdc14aa splice-blocking morphant zebrafish
  species: Zebrafish
  genotype: Transient splice-blocking morpholino knockdown
  publication: PMID:27259055
  description: The 2016 gene-discovery study injected a splice-blocking morpholino at the one- to two-cell stage. Inner-ear kinocilia were shorter at three days postfertilization than in mismatch-morpholino or uninjected controls, without gross inner-ear malformation or hair-bundle shape anomalies. This transient knockdown differs from the later germline frameshift model. The study did not establish the corresponding human cochlear lesion or a gene-specific treatment response.
discussions:
- discussion_id: cdc14a_dfnb32_vs_hiims_boundary
  kind: INTERPRETATION
  prompt: >-
    Is CDC14A deafness one disease with a male-limited syndromic subtype, or two diseases,
    and how reliable is the exon 10 versus exon 11 rule that is used to tell them apart?
  attaches_to:
  - has_subtypes#DFNB32
  - has_subtypes#HIIMS
  - phenotypes#Male Infertility
  rationale: >-
    This entry groups the CDC14A allelic spectrum while retaining the distinct MONDO HIIMS subtype. Clinical absence of assessed infertility should not be inferred from childhood, female-only families or allele position. Paternity and semen results support preserved reproductive function in some men with p.Arg345Ter or p.Arg376Ter, but the number of assessed men is small and two p.Arg376Ter brothers had borderline normal sperm morphology. Nine Emirati p.Arg312Gly cases had no reported fertility issues, with no CDC14A-specific reproductive assessment supplied; that is a knowledge gap rather than evidence against HIIMS. Stable p.Arg345Ter blood RNA and activity of an engineered truncation support an allele-specific explanation. Markedly reduced blood RNA for p.Ser348Glnfs*2 shows that exon-11 RNA behavior is not uniform, without directly measuring its testicular isoforms. Both variants in the 2024 family report were classified as VUS. Counseling should therefore use assessed individual reproductive findings and variant-specific evidence.
  evidence:
  - reference: PMID:29293958
    reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nevertheless, not all deaf males with homozygous mutations of CDC14A are infertile."
    explanation: The observation that created the two subtypes.
  - reference: PMID:32231217
    reference_title: "When transcripts matter: delineating between non-syndromic hearing loss DFNB32 and hearing impairment infertile male syndrome (HIIMS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical results from affected males suggest the NM_033313.2 transcript alone is sufficient for proper male fertility, but not for proper auditory function."
    explanation: The authors infer short-transcript sufficiency from clinical fertility results; tissue-specific transcript and protein function were not directly measured.
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:36056583
    reference_title: "Mutation spectrum of non-syndromic hearing loss in the UAE, a retrospective cohort study and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, the same mutation was reported before to be associated with deafness and male infertility (Imtiaz, 2017), none of our patients had fertility issues reported."
    explanation: >-
      No fertility issues were reported, but reproductive assessment was not documented. This supports an ascertainment limitation and does not refute the association with HIIMS.
  - reference: PMID:32231217
    reference_title: "When transcripts matter: delineating between non-syndromic hearing loss DFNB32 and hearing impairment infertile male syndrome (HIIMS)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The two brothers of L1096 however, had a borderline percentage of healthy morphological sperm, with only 3–4% of overall sperm exhibiting normal morphology."
    explanation: Borderline morphology illustrates heterogeneity within men carrying a C-terminal allele; it does not itself establish infertility.
  - reference: PMID:31906439
    reference_title: "Novel Loss-of-Function Variants in CDC14A are Associated with Recessive Sensorineural Hearing Loss in Iranian and Pakistani Patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "the c.1041dup variant results in a defective transcript that is likely degraded by nonsense-mediated mRNA decay"
    explanation: >-
      Blood RNA was strongly reduced for this exon-11 allele. The study did not assess male fertility or directly determine testicular isoform expression.
  proposed_experiments:
  - experiment_id: exp_cdc14a_semen_analysis_by_allele
    name: Semen analysis of adult men homozygous for each reported CDC14A allele
    description: >-
      Offer semen analysis, with WHO reference criteria, to affected adult men in the
      Emirati p.Arg312Gly families and in all families carrying exon 11 or more 3'
      truncations, and compare sperm count, motility and morphology by allele position.
    would_support:
    - has_subtypes#HIIMS
    supporting_outcome:
    - Consistent differences in reproductive measures by allele would strengthen a probabilistic genotype–phenotype association, without proving individual fertility or universal penetrance.
    would_refute:
    - has_subtypes#HIIMS
    refuting_outcome:
    - Overlapping distributions or discordant reproductive findings would weaken a simple exon-position prediction rule; neither result would erase the already observed HIIMS families.
- discussion_id: cdc14a_substrates_in_ear_and_testis
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which physiological substrates connect CDC14A loss to hair-cell dysfunction and reproductive pathology, and do early defects precede visible degeneration?
  attaches_to:
  - pathophysiology#Loss of CDC14A Catalytic Phosphatase Activity
  - pathophysiology#Postnatal Hair Cell Degeneration
  - pathophysiology#Seminiferous Tubule Degeneration
  rationale: >-
    The critical in-vivo substrate pathways remain unresolved, although candidate mechanisms exist. Human RPE1 cells with a 77-residue catalytic-region deletion have elongated primary cilia. CDC14A counteracts drebrin S142 phosphorylation, and pericentrosomal actin regulation contributes to that cell-line phenotype. Increased endocytic trafficking and early basal-body myosin Va accumulation were drebrin-independent. These experiments do not establish a drebrin-mediated pathway in auditory hair cells. In mouse testis, altered germ-cell composition and raised CDC25A, WEE1 and PR-SET7 levels provide additional observations, but no causal substrate has been shown to account for the reproductive phenotype.
  evidence:
  - reference: PMID:29293958
    reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The phosphoprotein substrates of CDC14A critical for hearing and male fertility have not yet been identified, but the search is delimited by the subcellular localizations of CDC14A."
    explanation: The gap as stated by the group that made the mouse models.
  - reference: PMID:29293958
    reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our observations leave open the question as to whether CDC14A-associated deafness in humans and mice is the result of malfunctioning kinocilia, stereocilia or primary defects elsewhere that subsequently trigger degeneration of hair cells."
    explanation: Even the compartment in which the defect starts is unresolved.
  - reference: PMID:30467237
    reference_title: "The human phosphatase CDC14A modulates primary cilium length by regulating centrosomal actin nucleation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Indeed, we find that hCDC14A counteracts the CDK5-dependent phosphorylation of drebrin at S142 during ciliogenesis."
    explanation: >-
      A candidate substrate identified in a human epithelial cell line; indirect because it
      has not been tested in hair cells.
  proposed_experiments:
  - experiment_id: exp_cdc14a_hair_cell_phosphoproteome
    name: Phosphoproteomics of Cdc14a catalytic-dead cochlea before degeneration
    description: >-
      Compare cochlear sensory-epithelium phosphoproteomes from wild-type and catalytic-site mutant mice before extensive degeneration. Test candidate sites with phosphomimetic and phospho-resistant constructs, direct enzyme assays and functional rescue, while controlling for tissue composition and assay sensitivity.
    would_support:
    - pathophysiology#Loss of CDC14A Catalytic Phosphatase Activity
    supporting_outcome:
    - Reproducible site-specific hyperphosphorylation together with direct CDC14A activity and phenotype rescue would support a particular substrate pathway.
    refuting_outcome:
    - A negative bulk phosphoproteome result would leave the substrate unresolved; it would not refute the known catalytic-site requirement because timing, abundance, cell composition and assay sensitivity may mask the relevant event.
- discussion_id: cdc14a_kinocilium_hypothesis_and_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    The gene-discovery report attributed DFNB32 to short kinocilia, based on zebrafish
    morpholino knockdown. Germline mouse and zebrafish mutants have normal kinocilia. Is
    there any kinocilium defect in human CDC14A deafness, and which model should be
    trusted?
  attaches_to:
  - pathophysiology#Postnatal Hair Cell Degeneration
  - animal_models#cdc14aa germline frameshift zebrafish
  - animal_models#cdc14aa splice-blocking morphant zebrafish
  rationale: >-
    Transient zebrafish morpholino knockdown produced shorter kinocilia, whereas the later germline cdc14aa mutant and mouse mutants had normal measured kinocilium lengths. Mouse hair-cell dysfunction and degeneration therefore do not require demonstrable early kinocilium shortening in those models. This discrepancy does not establish that the morphant finding was an artifact: paralog redundancy, other genetic compensation, developmental timing and perturbation design remain alternatives. RPE1 catalytic-region deletion instead produced longer primary cilia, a different cell type and perturbation. No patient hair-cell or kinocilium measurement resolves these model differences.
  evidence:
  - reference: PMID:27259055
    reference_title: "Mutations in CDC14A, Encoding a Protein Phosphatase Involved in Hair Cell Ciliogenesis, Cause Autosomal-Recessive Severe to Profound Deafness."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "By using a morpholino strategy to knockdown cdc14a in zebrafish larvae, we found that the length of the kinocilia was reduced in inner-ear hair cells."
    explanation: The original kinocilium finding.
  - reference: PMID:29293958
    reference_title: "CDC14A phosphatase is essential for hearing and male fertility in mouse and human."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Kinocilia of germ-line mutants of mouse and zebrafish have normal lengths, which does not recapitulate the published cdc14aa knockdown morphant phenotype of short kinocilia."
    explanation: Germline mutants of two species do not reproduce it.
  - reference: PMID:30467237
    reference_title: "The human phosphatase CDC14A modulates primary cilium length by regulating centrosomal actin nucleation."
    supports: REFUTE
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: "Here, we show that human RPE1 hCDC14APD cells, encoding a phosphatase dead version of hCDC14A, have longer cilia than wild-type cells, while hCDC14A overexpression reduces cilia formation."
    explanation: >-
      In human cells, loss of activity lengthens cilia, the opposite of the morphant
      result. Indirect because these are epithelial cells, not hair cells.
  proposed_experiments:
  - experiment_id: exp_cdc14aa_cdc14ab_double_mutant
    name: cdc14aa and cdc14ab double germline mutant zebrafish
    description: >-
      Generate fish lacking both CDC14A orthologs and measure kinocilium length, hair cell
      mechanotransduction, startle response and male fertility.
    would_support:
    - animal_models#cdc14aa germline frameshift zebrafish
    supporting_outcome:
    - Normal kinocilia in double mutants would weaken a simple CDC14A-paralog requirement for kinocilium length, while leaving other compensation or perturbation differences unresolved.
    would_refute:
    - animal_models#cdc14aa germline frameshift zebrafish
    refuting_outcome:
    - Short kinocilia or impaired auditory readouts in double mutants would support paralog redundancy as an explanation for the single-mutant findings; rescue and matched developmental measurements would strengthen that inference.
notes: >-
  The entry includes HIIMS within the CDC14A allelic spectrum while binding that subtype to its separate MONDO term. A future standalone HIIMS entry should be cross-linked through curated_in. General genetic hearing-loss guidance supplies supportive care and counseling; primary CDC14A families supply the clinical phenotype baseline.

name: Autosomal Recessive Nonsyndromic Hearing Loss 32
category: Mendelian
creation_date: "2026-10-01T20:35:52Z"
synonyms:
- DFNB32
- DFNB105
- autosomal recessive deafness 32
- autosomal recessive nonsyndromic deafness 32
- autosomal recessive deafness 105
- autosomal recessive nonsyndromic deafness type 105
- deafness, autosomal recessive 105
- deafness, autosomal recessive 32, with or without immotile sperm
- CDC14A autosomal recessive nonsyndromic deafness
- autosomal recessive nonsyndromic deafness caused by mutation in CDC14A
description: >-
  DFNB32 is autosomal recessive sensorineural hearing loss caused by biallelic variants in
  CDC14A, which encodes a dual-specificity phosphoprotein phosphatase. The locus was mapped
  in a Tunisian family with congenital profound deafness in 2003; the gene was found in 2016,
  when it was briefly given a second locus name, DFNB105, that was later shown to lie
  entirely inside the DFNB32 interval. Reported families are mostly consanguineous and come
  from Iran, Pakistan, Tunisia, Mauritania and the United Arab Emirates. Hearing loss is
  bilateral and ranges from moderate to profound; onset is congenital or early childhood in
  most families, progression is reported in some and explicitly absent in others, and
  balance is normal.

  The name says nonsyndromic, and for females, and for males carrying certain alleles, that
  is accurate. For other alleles it is not. In several families affected men are infertile,
  with low or absent sperm counts and largely immotile, misshapen sperm, while affected women
  in the same families have children. Mouse Cdc14a mutants reproduce this sex-limited
  pattern exactly: deaf females breed, deaf males do not. The discoverers named the syndromic
  form hearing impairment and infertile male syndrome (HIIMS). MONDO now carries HIIMS as a
  separate syndromic disease (MONDO:0100069), while OMIM keeps a single phenotype entry
  (608653) for deafness "with or without immotile sperm". This entry follows OMIM's lumping
  because the hearing loss and its mechanism are shared across the whole allelic series, and
  records HIIMS as a subtype bound to its own MONDO term so the distinction stays queryable.

  Which form a family has tracks the allele, not chance. Missense changes in the catalytic
  domain, a splice variant in exon 10 and N-terminal truncations abolish phosphatase activity
  and cause HIIMS. Truncations in exon 11 or further 3' remove the long, intrinsically
  disordered C-terminal tail but leave the two globular phosphatase domains intact; the
  truncated protein is stable, retains phosphatase activity, and supports male fertility, but
  it is trapped in the nucleus and fails to reach the hair bundle, so hearing is still lost.
  The boundary is not airtight: the catalytic-domain missense p.Arg312Gly, an HIIMS allele in
  the founding report, was the second commonest deafness variant in an Emirati cohort with no
  fertility problems reported, although fertility was not tested there.

  Mechanistically, CDC14A sits in hair cell kinocilia, basal bodies and the upper stereocilia.
  The first report proposed a kinocilium growth defect, based on zebrafish morpholino
  knockdown, but germline mouse and zebrafish mutants have kinocilia of normal length. In
  Cdc14a mutant mice the cochlea develops normally, and hair cells then degenerate after the
  onset of hearing, with stereocilia fusion and inner hair cells lost before outer ones. The
  phosphatase's substrates in the ear and testis are unknown, so the chain between loss of
  activity and hair cell death is not filled in.

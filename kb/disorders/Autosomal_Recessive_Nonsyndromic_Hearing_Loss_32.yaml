- name: Male Infertility
  category: Reproductive
  subtype: HIIMS
  description: >-
    Men in five families of the 2018 series reported inability to father children, whereas some affected men with p.Arg345Ter or p.Arg376Ter and affected women had children. The methods report semen assessment in six consenting men; the main text describes heterogeneous abnormalities. Fertility has not been measured for every reported CDC14A allele. The independent 2024 family with p.Asn228Lys had severe oligozoospermia, but variant causality remained uncertain under that study's ACMG classification.

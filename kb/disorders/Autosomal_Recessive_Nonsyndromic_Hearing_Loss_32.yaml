- name: Postnatal Hair Cell Degeneration
  description: >-
    Cdc14a mutant mouse hair bundles and kinocilia appear morphologically normal at P7–P9, but stereocilia subsequently fuse and hair cells degenerate, with inner hair-cell loss preceding outer hair-cell loss. About 5% of apical hair cells had degenerated at P17 and about half were absent at P90. Normal early morphology does not exclude an earlier functional or developmental defect that becomes apparent later. Normal measured endocochlear potentials argue against primary failure of the strial voltage supply, without excluding every strial contribution. Profound hearing loss despite remaining cells also indicates that cell number alone does not explain the functional deficit. Comparable histology has not been established in affected humans.

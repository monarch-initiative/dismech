- name: Normal Vestibular Function
  category: Vestibular
  frequency: EXCLUDED
  description: >-
    Balance is normal. No vestibular complaints were reported and Romberg and tandem gait
    testing found no balance problem in the 2018 series, and a Pakistani family in the 2020
    functional study had no vestibular complaints. This is bedside testing and self-report;

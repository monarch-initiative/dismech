name: RNU12-related minor spliceopathy
creation_date: "2026-04-16T00:00:00Z"
category: Mendelian
description: >-
  RNU12-related minor spliceopathy is a mechanism-defined Mendelian disease
  spectrum caused by biallelic pathogenic variants in RNU12, which encodes the
  U12 small nuclear RNA of the minor spliceosome. The shared molecular lesion is
  minor spliceosome dysfunction with defective splicing of U12-type introns in
  minor intron-containing genes. Reported clinical presentations currently
  include CDAGS syndrome and spinocerebellar ataxia, autosomal recessive 33
  (SCAR33), which differ in organ predilection but share the same upstream
  spliceosomal defect.
disease_term:
  preferred_term: RNU12-related minor spliceopathy disorder
  term:
    id: MONDO:1060223
    label: RNU12-related minor spliceopathy disorder
synonyms:
- RNU12-related minor spliceopathy disorder
- RNU12-related spliceopathy
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0033717
      label: congenital cerebellar ataxia due to RNU12 mutation
    mapping_predicate: skos:narrowMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO:0033717 is the Orphanet-derived (ORPHA:512260) term for the
      RNU12 early-onset cerebellar ataxia presentation, which this entry
      curates as the SCAR33 subtype alongside its OMIM-derived term
      MONDO:0859360. narrowMatch rather than exactMatch because this entry is
      the broader RNU12 minor spliceopathy umbrella that also covers CDAGS
      syndrome.
parents:
- Genetic Disorder
- Neurodevelopmental Disorder
- Craniofacial Disorder
has_subtypes:
- name: CDAGS
  display_name: CDAGS syndrome
  description: >-
    Multisystem developmental presentation characterized by craniosynostosis,
    delayed closure of the fontanelles and cranial defects, clavicular
    hypoplasia, anal and genitourinary malformations, and skin manifestations
    including porokeratosis.
  subtype_term:
    preferred_term: craniosynostosis-anal anomalies-porokeratosis syndrome
    term:
      id: MONDO:0011287
      label: craniosynostosis-anal anomalies-porokeratosis syndrome
  evidence:
  - reference: PMID:34085356
    reference_title: Biallelic variants in RNU12 cause CDAGS syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CDAGS Syndrome is a rare congenital disorder characterized by
      Craniosynostosis, Delayed closure of the fontanelles, cranial defects,
      clavicular hypoplasia, Anal and Genitourinary malformations, and Skin
      manifestations.
    explanation: >-
      Defines the CDAGS clinical presentation associated with biallelic RNU12
      variants.
- name: SCAR33
  display_name: Spinocerebellar ataxia, autosomal recessive 33
  description: >-
    Early-onset neurologic presentation characterized by autosomal recessively
    inherited cerebellar ataxia manifesting before 2 years of age, with
    differential expression of minor intron-containing RNAs including genes
    associated with cerebellar neurodegeneration. Orphanet names the same
    disease congenital cerebellar ataxia due to RNU12 mutation (ORPHA:512260;
    MONDO:0033717) and describes infantile delayed motor milestones,
    hypotonia, intention tremor, nystagmus, dysarthria, and mixed cerebellar
    hypoplasia and vermian degeneration on imaging. It differs from the CDAGS
    subtype in being a purely neurologic presentation caused by a homozygous
    RNU12 point mutation rather than compound heterozygous alleles.
  subtype_term:
    preferred_term: spinocerebellar ataxia, autosomal recessive 33
    term:
      id: MONDO:0859360
      label: spinocerebellar ataxia, autosomal recessive 33
  evidence:
  - reference: PMID:27863452
    reference_title: Mutation in noncoding RNA RNU12 causes early onset cerebellar ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WGS revealed a point mutation in noncoding RNA RNU12 that was associated
      with early onset cerebellar ataxia.
    explanation: >-
      Establishes the RNU12-associated early-onset ataxia presentation that maps
      to SCAR33.
  - reference: ORPHA:512260
    reference_title: Congenital cerebellar ataxia due to RNU12 mutation
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MONDO:0033717 | Exact"
    explanation: >-
      Orphanet maps its congenital cerebellar ataxia due to RNU12 mutation
      record exactly to MONDO:0033717.
  - reference: ORPHA:512260
    reference_title: Congenital cerebellar ataxia due to RNU12 mutation
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "OMIM:620208 | Exact"
    explanation: >-
      The same Orphanet record maps exactly to OMIM:620208, the OMIM entry from
      which MONDO:0859360 (SCAR33) is derived, so the two MONDO terms name one
      disease.
  - reference: ORPHA:512260
    reference_title: Congenital cerebellar ataxia due to RNU12 mutation
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A rare hereditary ataxia characterized by delayed motor milestones in
      early infancy, hypotonia, ataxic gait, intention tremor, nystagmus,
      dysarthric speech, and variable learning difficulties.
    explanation: >-
      Orphanet clinical definition of the RNU12 congenital cerebellar ataxia
      presentation.
  mappings:
    mondo_mappings:
    - term:
        id: MONDO:0033717
        label: congenital cerebellar ataxia due to RNU12 mutation
      mapping_predicate: skos:exactMatch
      mapping_source: Orphanet ORPHA:512260
      mapping_justification: >-
        MONDO:0033717 is the Orphanet-derived term (ORPHA:512260) and
        MONDO:0859360 the OMIM-derived term (OMIM:620208) for the same disease.
        Orphanet lists both MONDO:0033717 and OMIM:620208 as exact
        cross-references of ORPHA:512260, and both rest on the single
        consanguineous family reported in PMID:27863452.

      family in which members displayed autosomal recessively inherited
      cerebellar ataxia manifesting before 2 years of age.
    explanation: >-
      Supports recessive inheritance for the SCAR33 presentation.
pathophysiology:
- name: Minor spliceosome dysfunction from RNU12 variants
  conforms_to: "spliceosome_component_dysfunction#Germline Spliceosome Component Variant"
  description: >-
    Biallelic RNU12 variants disrupt the U12 small nuclear RNA, a core RNA
    component of the minor spliceosome, by altering the precursor U12 snRNA 3'
    extension or disrupting the secondary structure or Sm protein binding site
    of the RNU12 snRNA. This compromises minor spliceosome stability and
    function and impairs normal processing of U12-type introns.
  genes:
  - preferred_term: RNU12
    term:
      id: hgnc:19380
      label: RNU12
  biological_processes:
  - preferred_term: U12-type intron splicing
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
    modifier: DECREASED
  evidence:
  - reference: PMID:34085356
    reference_title: Biallelic variants in RNU12 cause CDAGS syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All five patients shared the same rare mutation NC_000022.10:g.43011402C>T,
      which alters a highly conserved nucleotide within the precursor U12 snRNA
      3' extension. Each of them also carried a rare variant on the other allele
      that either disrupts the secondary structure or the Sm binding site of the
      RNU12 snRNA.
    explanation: >-
      Demonstrates that pathogenic RNU12 variants alter the precursor 3'
      extension or disrupt the secondary structure or Sm protein binding site of
      the U12 snRNA.
  - reference: PMID:34085356
    reference_title: Biallelic variants in RNU12 cause CDAGS syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RNU12 encodes a small nuclear RNA that is a component of the minor
      spliceosome and is essential for minor intron splicing.
    explanation: >-
      Establishes that the disease gene encodes a core minor spliceosome RNA
      required for U12-type intron splicing.
  downstream:
  - target: U12-type intron retention and transcriptome dysregulation
    description: >-
      Impaired U12 snRNA function in the minor spliceosome leads directly to
      retention of U12-type introns and downstream transcriptomic dysregulation.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27863452
      reference_title: Mutation in noncoding RNA RNU12 causes early onset cerebellar ataxia.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Reverse transcriptase PCR demonstrated minor intron retention in all of 9
        randomly selected RNAs from this group, and RNAseq showed splicing
        disruption specific to all U12-type introns detected in blood monocytes
        from affected individuals.
      explanation: >-
        Demonstrates that RNU12 mutation causes widespread U12-type intron
        retention across minor-intron-containing transcripts.
    - reference: PMID:34085356
      reference_title: Biallelic variants in RNU12 cause CDAGS syndrome.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Whole transcriptome sequencing analysis of lymphoblastoid cells identified
        120 differentially expressed genes, and differential alternative splicing
        analysis indicated there was an enrichment of alternative splicing events
        in the patient.
      explanation: >-
        Shows enrichment of alternative splicing events and transcriptomic
        dysregulation downstream of biallelic RNU12 variants in CDAGS syndrome.
- name: U12-type intron retention and transcriptome dysregulation
  conforms_to: "spliceosome_component_dysfunction#Mis-Splicing of a Sensitive Transcript Subset"
  description: >-
    Loss of normal minor spliceosome activity causes selective disruption of
    U12-type intron splicing with downstream transcriptome-wide dysregulation in
    minor intron-containing genes. Tissue-specific sensitivity to this shared
    splicing lesion likely determines whether the dominant presentation is
    cranio-cutaneous malformation or cerebellar neurodegeneration.
  biological_processes:
  - preferred_term: U12-type intron splicing
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
    modifier: DECREASED
  evidence:
  - reference: PMID:27863452
    reference_title: Mutation in noncoding RNA RNU12 causes early onset cerebellar ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Reverse transcriptase PCR demonstrated minor intron retention in all of 9
      randomly selected RNAs from this group, and RNAseq showed splicing
      disruption specific to all U12-type introns detected in blood monocytes
      from affected individuals.
    explanation: >-
      Demonstrates selective U12-type intron retention in the ataxia
      presentation.
  - reference: PMID:34085356
    reference_title: Biallelic variants in RNU12 cause CDAGS syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Whole transcriptome sequencing analysis of lymphoblastoid cells identified
      120 differentially expressed genes, and differential alternative splicing
      analysis indicated there was an enrichment of alternative splicing events
      in the patient.
    explanation: >-
      Extends the same splicing-dysregulation mechanism to the CDAGS
      presentation.
  downstream:
  - target: Craniosynostosis
    description: >-
      Impaired minor spliceosome function from biallelic RNU12 variants leads to
      craniosynostosis in the CDAGS syndrome presentation.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:

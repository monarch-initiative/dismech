genetic:
- name: RNU12
  association: Causal biallelic noncoding snRNA variants
  gene_term:
    preferred_term: RNU12
    term:
      id: hgnc:19380
      label: RNU12
  notes: >-
    Biallelic pathogenic single-nucleotide variants in conserved elements of the
    noncoding U12 small nuclear RNA gene RNU12 cause both CDAGS syndrome and
    early-onset autosomal recessive cerebellar ataxia (SCAR33). In CDAGS
    syndrome, all five reported patients shared NC_000022.10:g.43011402C>T in
    the precursor U12 snRNA 3' extension in compound heterozygosity with a
    second rare variant disrupting either the secondary structure or the Sm
    binding site of the RNU12 snRNA, whereas SCAR33 was caused by a homozygous
    point mutation in noncoding RNA RNU12.
  evidence:
  - reference: PMID:34085356
    reference_title: Biallelic variants in RNU12 cause CDAGS syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole exome sequencing revealed biallelic rare variants that disrupt
      highly conserved nucleotides within the RNU12 gene.
    explanation: >-
      Demonstrates causal biallelic RNU12 variants in patients with CDAGS
      syndrome.
  - reference: PMID:34085356
    reference_title: Biallelic variants in RNU12 cause CDAGS syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All five patients shared the same rare mutation NC_000022.10:g.43011402C>T,
      which alters a highly conserved nucleotide within the precursor U12 snRNA
      3' extension. Each of them also carried a rare variant on the other allele
      that either disrupts the secondary structure or the Sm binding site of the
      RNU12 snRNA.
    explanation: >-
      Details the recurrent precursor 3'-extension variant and trans alleles
      disrupting U12 snRNA secondary structure or Sm binding site in CDAGS
      syndrome.
  - reference: PMID:27863452
    reference_title: Mutation in noncoding RNA RNU12 causes early onset cerebellar ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      WGS revealed a point mutation in noncoding RNA RNU12 that was associated
      with early onset cerebellar ataxia.
    explanation: >-
      Demonstrates a causal homozygous point mutation in RNU12 in early-onset
      autosomal recessive cerebellar ataxia (SCAR33).
diagnosis:
- name: Molecular genetic testing for RNU12
  description: >-
    Diagnosis is confirmed by identification of biallelic pathogenic variants in
    RNU12. Whole exome sequencing or whole genome sequencing with Sanger
    confirmation of identified variants establishes the diagnosis in both CDAGS
    and SCAR33 presentations.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:34085356
    reference_title: Biallelic variants in RNU12 cause CDAGS syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed whole exome and Sanger sequencing to identify the underlying
      molecular cause in five patients with CDAGS syndrome from four distinct
      families.
    explanation: >-
      Establishes whole exome sequencing with Sanger confirmation as the
      diagnostic approach for the CDAGS presentation.
  - reference: PMID:27863452
    reference_title: Mutation in noncoding RNA RNU12 causes early onset cerebellar ataxia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      whole genome sequencing (WGS) was analyzed in a large consanguineous
      family in which members displayed autosomal recessively inherited
      cerebellar ataxia manifesting before 2 years of age.
    explanation: >-
      Establishes whole genome sequencing as the diagnostic approach for the
      SCAR33 presentation.
notes: "This entry operationalizes MONDO NTR #9963 (\"RNU12 - related minor spliceopathy disorder\") as a mechanism-defined umbrella disease. That request has since been minted as MONDO:1060223 (\"RNU12-related minor spliceopathy disorder\"), which is now anchored as the top-level `disease_term` for this entry. The current Gene2Phenotype triage row only names RNU12-related CDAGS syndrome (MONDO:0011287), but the broader MONDO umbrella and the literature support a wider RNU12 disease spectrum spanning CDAGS syndrome and SCAR33 through shared minor spliceosome dysfunction affecting U12-type intron splicing."

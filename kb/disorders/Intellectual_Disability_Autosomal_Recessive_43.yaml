  frequency: OCCASIONAL
  evidence:
  - reference: PMID:31953988
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This patient presented with mild ID, short stature, and microcephaly.
    explanation: >-
      Directly reports microcephaly in one patient.

- name: Subependymal Nodular Heterotopia
  category: Nervous System
  description: >-
    Subependymal heterotopic nodules were found in both affected sisters
    reported in 2020. Bound to the HPO term for periventricular nodular
    heterotopia, which is the same lesion under the term HPO uses.
  phenotype_term:
    preferred_term: Subependymal heterotopic nodules
    term:
      id: HP:0032388
      label: Periventricular nodular heterotopia
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:31953988
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both had learning disabilities, macrocephaly, dysmorphic features,
      skeletal anomalies, and subependymal heterotopic nodules.
    explanation: >-
      Directly reports the neuronal migration abnormality in two siblings.

- name: Skeletal Anomalies
  category: Musculoskeletal
  description: >-
    Reported without further specification in the two sisters described in 2020,
    so only the general skeletal HPO term can be bound.
  phenotype_term:
    preferred_term: Skeletal anomalies
    term:
      id: HP:0000924
      label: Abnormality of the skeletal system
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:31953988
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both had learning disabilities, macrocephaly, dysmorphic features,
      skeletal anomalies, and subependymal heterotopic nodules.
    explanation: >-
      Reports skeletal anomalies as part of the syndromic presentation.

- name: Sensorineural Hearing Loss
  category: Ear
  description: >-
    Bilateral sensorineural hearing loss reported in one patient, in whom it
    accompanied congenital absence of the right internal carotid artery. A
    single observation; not established as a recurrent feature.
  phenotype_term:
    preferred_term: Bilateral sensorineural hearing loss
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  frequency: VERY_RARE
  evidence:
  - reference: PMID:31953988
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, the younger sibling had a congenital absence of the right
      internal carotid and bilateral sensorineural hearing loss.
    explanation: >-
      Single-patient report of bilateral sensorineural hearing loss in a
      WASHC4-biallelic individual.

- name: Progressive Movement Impairment
  category: Nervous System
  description: >-
    Motor deficits that worsen with age. The finding was made first in the
    knock-in mouse and then recovered from the patients' records by
    retrospective review, so its ascertainment in humans is retrospective rather
    than prospective.
  phenotype_term:
    preferred_term: Movement abnormality
    term:
      id: HP:0100022
      label: Abnormality of movement
  evidence:
  - reference: PMID:33749590
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A retrospective analysis of SWIPP1019R patients reveals similar movement
      deficits in humans.
    explanation: >-
      The human observation for this phenotype; the study is a mouse paper, but
      this specific sentence reports a retrospective analysis of the patients.
  - reference: PMID:33749590
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: >-
      Interestingly, while gait parameters of the mice were largely
      indistinguishable across genotypes at adolescence, a striking difference
      was seen when the same mice were aged to adulthood
    explanation: >-
      Supports the progressive character of the phenotype - gait is normal in
      adolescent mutants and abnormal in the same animals as adults - but in the
      knock-in mouse rather than in patients, whose human data are a
      retrospective chart review.

- name: Skeletal Muscle Involvement
  category: Musculoskeletal
  description: >-
    Dysregulation of muscle-relevant proteins on immunostaining of a patient
    muscle biopsy, reported for the first time in 2022 and explicitly absent
    from earlier descriptions.
  phenotype_term:
    preferred_term: Skeletal muscle involvement
    term:
      id: HP:0003198
      label: Myopathy
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:34599609
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proteomic analysis confirmed key molecular players in vitro and
      highlighted, for the first time, the involvement of skeletal muscle in
      patients.
    explanation: >-
      States that skeletal muscle involvement was demonstrated in patients.
  - reference: PMID:34599609
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, skeletal muscle involvement has not been reported so far in
      patients, and precise biochemical studies allowing a deeper understanding
      of the molecular etiology of the disease are still lacking.
    explanation: >-
      The same paper's statement of the prior state of knowledge, which is why
      this phenotype is marked OCCASIONAL and dated to 2022 rather than treated
      as a long-established feature.
  notes: >-
    Bound to HP:0003198 Myopathy, which is broader than what was shown. The
    evidence is biopsy immunostaining and proteomics, not a clinical myopathy
    syndrome with weakness, raised creatine kinase and myopathic EMG in a
    series; the preferred_term is kept at the weaker "Skeletal muscle
    involvement" for that reason.

animal_models:
- name: SWIP P1019R knock-in mouse
  species: Mouse
  genotype: Washc4 p.Pro1019Arg knock-in, homozygous (SWIP-P1019R), CRISPR-generated
  category: Genetic
  publication: PMID:33749590
  description: >-
    A mouse carrying the exact missense allele found in the founding Omani
    pedigree. It is the only animal model of a specific human MRT43 allele, and
    it generated a prediction - progressive motor decline - that was
    subsequently confirmed in the patients.
  genes:
  - preferred_term: WASHC4
    term:
      id: hgnc:29174
      label: WASHC4
  modeled_mechanisms:
  - target: WASH Complex Destabilization
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Spatial proteomics of mutant mouse brain shows the same complex
      destabilisation demonstrated for the patient allele in cells.
    evidence:
    - reference: PMID:33749590
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Quantitative spatial proteomics analysis of SWIPP1019R mouse brain
        reveals that this mutation destabilizes the WASH complex and uncovers
        significant perturbations in both endosomal and lysosomal pathways.
      explanation: >-
        Establishes that the model reproduces the molecular lesion this node
        describes, in brain tissue.
  - target: Neuronal Endo-Lysosomal Dysfunction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Enlarged endosomes and lysosomes, lipofuscin accumulation and progressive
      caspase-3 activation in mutant brain.
    limitations: >-
      The corresponding neuropathology has not been examined in patients - there
      is no human brain tissue in the literature for this disorder - so the
      cellular phenotype is established only in the mouse.
    readouts:
    - name: Endosome and lysosome size and lysosomal substrate accumulation
      target: Neuronal Endo-Lysosomal Dysfunction
      direction: INCREASED
      interpretation: >-
        Morphological correlate of the sorting failure at the compartment level.
      evidence:
      - reference: PMID:33749590
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Destabilization of the WASH complex leads to enlarged endosomes and
          lysosomes, with increased substrate accumulation at the lysosome.
        explanation: >-
          Reports the measured direction of the compartment-size and
          substrate-accumulation readout.
    evidence:
    - reference: PMID:33749590
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Cellular and histological analyses confirm that SWIPP1019R results in
        endo-lysosomal disruption and uncover indicators of neurodegeneration.
      explanation: >-
        Supports treating this model as informative for the endo-lysosomal node.
  - target: Progressive Movement Impairment
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Rotarod, gait and strength decline with age in mutant mice; the equivalent
      human deficits were then found on retrospective chart review.
    limitations: >-
      Rodent rotarod and gait measures are not the clinical movement examination
      used in the patients, and the human confirmation is retrospective, so the
      correspondence is at the level of "movement is affected and worsens",
      not of a matched motor phenotype.
    readouts:
    - name: TreadScan gait parameters at adolescence versus adulthood
      target: Progressive Movement Impairment
      direction: ALTERED
      interpretation: >-
        Behavioural correlate of the progressive motor arm of the phenotype:
        gait is indistinguishable from wild type in adolescence and clearly
        abnormal in the same animals as adults.
      evidence:
      - reference: PMID:33749590
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Interestingly, while gait parameters of the mice were largely
          indistinguishable across genotypes at adolescence, a striking
          difference was seen when the same mice were aged to adulthood
        explanation: >-
          Reports the gait measurement and its change between adolescence and
          adulthood, which is the readout recorded here.
    evidence:
    - reference: PMID:33749590
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We find that SWIPP1019R not only impacts cognition, but also causes
        significant progressive motor deficits in mice.
      explanation: >-
        Supports treating the model as informative for the movement phenotype.
  evidence:
  - reference: PMID:33749590
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To uncover how dysfunction of endosomal SWIP leads to disease, we generate
      a mouse model of the human WASHC4c.3056C>G mutation.
    explanation: >-
      Establishes that the model carries the human disease allele rather than a
      generic null.

- name: Zebrafish washc4 loss-of-function
  species: Zebrafish
  genotype: washc4 targeted inactivation
  category: Genetic
  publication: PMID:30010465
  description: >-
    Zebrafish study of Washc4 as a VCP interactor. It is a muscle-proteostasis
    experiment, not a neurodevelopmental one, and it is the source of the
    prediction that WASHC4 loss would affect skeletal muscle - a prediction only
    confirmed in patients in 2022.
  genes:
  - preferred_term: WASHC4
    term:
      id: hgnc:29174
      label: WASHC4
  modeled_mechanisms:
  - target: Impaired Autophagic Protein Clearance in Striated Muscle
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Washc4 inactivation impairs cardiac and skeletal muscle function and
      structure and interferes with autophagy, with ER stress but an intact
      ubiquitin-proteasome system.
    limitations: >-
      Zebrafish, and the study was designed around VCP/p97 myopathy rather than
      around intellectual disability; cardiac involvement of the kind reported
      here has not been described in WASHC4 patients, and the human muscle
      evidence is a single biopsy.
    evidence:
    - reference: PMID:30010465
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We found that targeted inactivation of either Vcp or Washc4, led to
        progressive impairment of cardiac and skeletal muscle function,
        structure and cytoarchitecture without interfering with the
        differentiation of both organ systems.
      explanation: >-
        Reports the muscle phenotype produced by loss of the MRT43 gene's
        ortholog.
  evidence:
  - reference: PMID:34599609
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Functional studies in a zebrafish model suggested that WASHC4 knockdown
      may also affect skeletal muscles by perturbing protein clearance.
    explanation: >-
      A later human study describing what this zebrafish model established and
      why it was worth testing in patients; cited to record the model's role,
      not as independent muscle evidence.


  phenotype_term:
    preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  frequency: FREQUENT
  evidence:
  - reference: PMID:31953988
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 2011, KIAA1033/WASHC4 was associated with autosomal recessive
      intellectual disability (ARID) in a large consanguineous family comprising
      seven affected individuals with moderate ID and short stature.
    explanation: >-
      Short stature is reported together with the intellectual disability in the
      founding family.
  - reference: PMID:34599609
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recessive variants in WASHC4 are linked to intellectual disability
      complicated by poor language skills, short stature, and dysmorphic
      features.
    explanation: >-
      Confirms short stature as an established feature of the gene-disease
      relationship, independent of the founding report.

- name: Dysmorphic Facial Features
  category: Head and Neck
  description: >-
    Dysmorphism is reported in the 2020 and 2022 patients and is one of the
    findings that moved the entity out of the non-syndromic category. No single
    recognisable gestalt has been defined, so the general HPO term is bound.
  phenotype_term:
    preferred_term: Dysmorphic facial features
    term:
      id: HP:0001999
      label: Abnormal facial shape
  evidence:
  - reference: PMID:31953988
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both had learning disabilities, macrocephaly, dysmorphic features,
      skeletal anomalies, and subependymal heterotopic nodules.
    explanation: >-
      Reports dysmorphic features in two affected sisters.
  - reference: PMID:34599609
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recessive variants in WASHC4 are linked to intellectual disability
      complicated by poor language skills, short stature, and dysmorphic
      features.
    explanation: >-
      Independent confirmation that dysmorphism belongs to the WASHC4 phenotype.

- name: Macrocephaly
  category: Head and Neck
  description: >-
    Reported in the two sisters with compound heterozygous variants. Head size
    is not consistent across the disorder - a different patient in the same
    report is microcephalic.
  phenotype_term:
    preferred_term: Macrocephaly
    term:
      id: HP:0000256
      label: Macrocephaly
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:31953988
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both had learning disabilities, macrocephaly, dysmorphic features,
      skeletal anomalies, and subependymal heterotopic nodules.
    explanation: >-
      Directly reports macrocephaly in two affected siblings.

- name: Microcephaly
  category: Head and Neck
  description: >-
    Reported in the third 2020 patient, alongside mild intellectual disability
    and short stature. Curated separately from macrocephaly because the two are
    opposite findings in different patients, not a single variable trait with an

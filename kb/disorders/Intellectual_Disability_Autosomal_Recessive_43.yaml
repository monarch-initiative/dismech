inheritance:
- name: Autosomal recessive
  description: >-
    Two damaging WASHC4 alleles are required. The founding family was
    consanguineous and the affected members homozygous; later families carry
    compound heterozygous variants inherited one from each parent, and one
    further sibship is homozygous. No heterozygous carrier has been reported as
    affected.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:31953988
    reference_title: "Novel KIAA1033/WASHC4 mutations in three patients with syndromic intellectual disability and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we describe three additional patients (from two unrelated families)
      with syndromic ID due to compound heterozygous KIAA1033 variants
      ascertained by exome sequencing (ES).
    explanation: >-
      Biallelic (compound heterozygous) variants inherited one from each parent
      in two unrelated families is the recessive transmission pattern.
  - reference: PMID:21498477
    reference_title: "Identification of a novel candidate gene for non-syndromic autosomal recessive intellectual disability: the WASH complex member SWIP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a large consanguineous family with autosomal recessive intellectual
      disability (ARID), we have combined homozygosity mapping, targeted exon
      enrichment and high-throughput sequencing to identify the underlying gene
      defect.
    explanation: >-
      The founding pedigree is consanguineous and was mapped by homozygosity
      mapping, which is only informative for a recessive, identical-by-descent
      locus.

prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fewer than fifteen affected individuals from four families are described in
    the primary literature as of 2026: seven in the 2011 Omani consanguineous
    pedigree, three from two unrelated families in 2020, and two sisters in
    2022. No population frequency estimate, birth prevalence, or carrier
    frequency has been published, and no Orphanet epidemiology record was
    available, so no numeric rate is asserted here.
  evidence:
  - reference: PMID:31953988
    reference_title: "Novel KIAA1033/WASHC4 mutations in three patients with syndromic intellectual disability and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since then, no other cases of KIAA1033 variants have been reported.
    explanation: >-
      Reviewing the literature nine years after the founding report, the authors
      found no further published cases, establishing that the entity is known
      from a handful of families rather than from any cohort large enough to
      support a rate.
  - reference: PMID:31953988
    reference_title: "Novel KIAA1033/WASHC4 mutations in three patients with syndromic intellectual disability and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 2011, KIAA1033/WASHC4 was associated with autosomal recessive
      intellectual disability (ARID) in a large consanguineous family comprising
      seven affected individuals with moderate ID and short stature.
    explanation: >-
      Gives the size of the founding pedigree, the first component of the
      published case count.

genetic:
- name: WASHC4
  gene_term:
    preferred_term: WASHC4
    term:
      id: hgnc:29174
      label: WASHC4
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  frequency: The only gene known to cause MRT43; all reported families carry biallelic WASHC4 variants.
  notes: >-
    Formerly KIAA1033; the protein is widely called SWIP (Strumpellin and WASH
    interacting protein). Reported disease alleles are the homozygous missense
    c.3056C>G p.(Pro1019Arg) in the founding Omani family, the compound
    heterozygous pairs p.(Gln442*)/p.(Asp1048Gly) and
    p.(Lys1079Arg)/p.(His503Arg), and a further homozygous variant in the 2022
    sibship. Both truncating and missense alleles occur, and the functionally
    characterised missense allele behaves as a loss of function by destabilising
    the complex rather than by any gain of activity.

    Complete Washc4 knockout in mouse is reported by MGI and IMPC to cause early
    embryonic phenotypes consistent with embryonic lethality, which would mean
    the human disease alleles are necessarily hypomorphic rather than true
    nulls. That constraint is recorded here without an evidence item: it is
    carried by mouse database phenotype annotations rather than by any statement
    in the WASHC4 disease literature, none of the cached references asserts it,
    and this repository has no MGI or IMPC ingest to quote from. It is stated as
    an unverified lead, not as a curated claim.
  variants:
  - name: c.3056C>G p.(Pro1019Arg)
    type: missense
    description: >-
      The founding allele, homozygous in the consanguineous Omani pedigree. It
      is the only WASHC4 disease allele that has been functionally characterised
      and modelled in an animal; it destabilises the WASH complex rather than
      abolishing the protein.
    evidence:
    - reference: PMID:33749590
      reference_title: "Genetic disruption of WASHC4 drives endo-lysosomal dysfunction and cognitive-movement impairments in mice and humans."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In particular, an autosomal recessive mutation inWASHC4(c.3056C>G;
        p.Pro1019Arg) was identified in a cohort of children with non-syndromic
        intellectual disability
      explanation: >-
        Names the nucleotide and protein change of the founding allele and the
        cohort it was found in. The run-together spacing is the cached text's
        own, produced by the loss of italic markup around the gene symbol.
  - name: p.(Gln442*) / p.(Asp1048Gly)
    type: compound heterozygous stop-gain and missense
    description: >-
      Compound heterozygous pair in the two sisters of the 2020 report, one
      allele inherited from each parent.
    evidence:
    - reference: PMID:31953988
      reference_title: "Novel KIAA1033/WASHC4 mutations in three patients with syndromic intellectual disability and a review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Two sisters, aged 4 and 5.5 years, had a stop-gain and a missense
        variants, each inherited from one parent (p.(Gln442*) and
        p.(Asp1048Gly)).
      explanation: >-
        Names both alleles and states that each was inherited from one parent.
  - name: p.(Lys1079Arg) / p.(His503Arg)
    type: compound heterozygous missense
    description: >-
      Compound heterozygous missense pair in the third patient of the 2020
      report, a 34-year-old with mild intellectual disability, short stature and
      microcephaly.
    evidence:
    - reference: PMID:31953988
      reference_title: "Novel KIAA1033/WASHC4 mutations in three patients with syndromic intellectual disability and a review of the literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The third patient was aged 34 years and had two missense variants, one
        inherited from each parent (p.(Lys1079Arg) and p.(His503Arg)).
      explanation: >-
        Names both alleles and the biparental inheritance in the third patient.
  - name: Unnamed homozygous WASHC4 variant (2022 sibship)
    description: >-
      A homozygous WASHC4 variant in the two siblings reported in 2022. The
      abstract states that the variant is homozygous but does not give its
      nucleotide or protein change, and the full text is not in the reference
      cache, so no allele designation is asserted here.
    evidence:
    - reference: PMID:34599609
      reference_title: "Homozygous WASHC4 variant in two sisters causes a syndromic phenotype defined by dysmorphisms, intellectual disability, profound developmental disorder, and skeletal muscle involvement."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Here, we report two siblings with a homozygous WASHC4 variant expanding
        the clinical spectrum of the disease and provide a phenotypical
        comparison with cases reported in the literature.
      explanation: >-
        Establishes that this sibship is homozygous for a WASHC4 variant,
        without naming the allele.
  evidence:
  - reference: PMID:21498477
    reference_title: "Identification of a novel candidate gene for non-syndromic autosomal recessive intellectual disability: the WASH complex member SWIP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a member of the recently discovered WASH complex, which is involved in
      actin polymerization and multiple endosomal transport processes.
    explanation: >-
      Identifies the gene the founding study implicated (SWIP/WASHC4) and the
      complex and cellular process it belongs to.
  - reference: PMID:34599609
    reference_title: "Homozygous WASHC4 variant in two sisters causes a syndromic phenotype defined by dysmorphisms, intellectual disability, profound developmental disorder, and skeletal muscle involvement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recessive variants in WASHC4 are linked to intellectual disability
      complicated by poor language skills, short stature, and dysmorphic
      features.
    explanation: >-
      States the gene-disease relationship in its current, post-2011 form.

pathophysiology:
- name: Biallelic WASHC4 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Two damaging WASHC4 alleles - homozygous missense p.Pro1019Arg in the
    founding pedigree, truncating and missense compound heterozygous pairs in
    later families - reduce the amount of functional SWIP protein available to
    the WASH complex.
  genetic_context:
    genes:
    - preferred_term: WASHC4
      term:
        id: hgnc:29174
        label: WASHC4
    zygosity: HOMOZYGOUS
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      The founding allele is homozygous by descent in a consanguineous pedigree;
      subsequent families are compound heterozygous. The functionally studied
      missense allele lowers SWIP protein level rather than creating a new
      activity, which is why it is classified as loss of function.
  genes:
  - preferred_term: WASHC4
    term:
      id: hgnc:29174
      label: WASHC4
  downstream:
  - target: WASH Complex Destabilization
    causal_link_type: DIRECT
    description: >-
      Reduced SWIP levels destabilise the assembled pentamer.
    evidence:
    - reference: PMID:21498477
      reference_title: "Identification of a novel candidate gene for non-syndromic autosomal recessive intellectual disability: the WASH complex member SWIP."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In line with this assumption, we could show that this mutation leads to
        significantly reduced SWIP levels and to destabilization of the entire
        WASH complex.
      explanation: >-
        States the causal step itself: the patient mutation lowers SWIP and, as
        a consequence, destabilises the whole complex.
  evidence:
  - reference: PMID:21498477
    reference_title: "Identification of a novel candidate gene for non-syndromic autosomal recessive intellectual disability: the WASH complex member SWIP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a large consanguineous family with autosomal recessive intellectual
      disability (ARID), we have combined homozygosity mapping, targeted exon
      enrichment and high-throughput sequencing to identify the underlying gene
      defect.
    explanation: >-
      Establishes that the initiating lesion is a biallelic autosomal locus
      identified by autozygosity mapping in an affected pedigree.

- name: WASH Complex Destabilization
  biological_scale: MOLECULAR
  description: >-
    SWIP/WASHC4 is one of five subunits of a roughly 500 kDa core complex that
    also contains WASH, Strumpellin (WASHC5), FAM21 (WASHC2) and CCDC53
    (WASHC3). Loss of SWIP does not merely remove one subunit: the assembled
    complex falls apart, so the WASH nucleation-promoting factor is lost from
    its site of action together with the subunits that anchor and regulate it.
  protein_complexes:
  - preferred_term: WASH complex
    term:
      id: GO:0071203
      label: WASH complex
  cellular_components:
  - preferred_term: endosome
    term:
      id: GO:0005768
      label: endosome
  downstream:
  - target: Loss of SWIP-Mediated Endosomal Membrane Anchoring
    causal_link_type: DIRECT
    description: >-
      SWIP is itself one of the two membrane anchors of the complex, so losing
      it removes an attachment point as well as a structural subunit.
  - target: Loss of Endosomal Branched-Actin Nucleation
    causal_link_type: DIRECT
    description: >-
      The complex exists to present the WASH nucleation-promoting factor to
      Arp2/3 at the endosome; a destabilised complex cannot do so.
    evidence:
    - reference: PMID:36995008
      reference_title: "SWIP mediates retromer-independent membrane recruitment of the WASH complex."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The pentameric WASH complex facilitates endosomal protein sorting by
        activating Arp2/3, which in turn leads to the formation of F-actin
        patches specifically on the endosomal surface.
      explanation: >-
        States that branched-actin patch formation on the endosome is a function
        of the intact pentamer, so its destabilisation removes that output.
  evidence:
  - reference: PMID:20498093
    reference_title: "WASH and WAVE actin regulators of the Wiskott-Aldrich syndrome protein (WASP) family are controlled by analogous structurally related complexes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here we show that WASH functions in cells within a 500 kDa core complex
      containing Strumpellin, FAM21, KIAA1033 (SWIP), and CCDC53.
    explanation: >-
      Defines the complex whose destabilisation this node describes and places
      KIAA1033/SWIP - the MRT43 gene product - inside it.
  - reference: PMID:33749590
    reference_title: "Genetic disruption of WASHC4 drives endo-lysosomal dysfunction and cognitive-movement impairments in mice and humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Quantitative spatial proteomics analysis of SWIPP1019R mouse brain reveals
      that this mutation destabilizes the WASH complex and uncovers significant
      perturbations in both endosomal and lysosomal pathways.
    explanation: >-
      Confirms in brain tissue of an animal carrying the human patient allele
      that the complex is destabilised, not just in cultured cells.

- name: Loss of SWIP-Mediated Endosomal Membrane Anchoring
  biological_scale: MOLECULAR
  description: >-
    The textbook route by which the WASH complex reaches the endosomal membrane
    is the FAM21-VPS35 interaction with retromer. SWIP provides a second,
    retromer-INDEPENDENT anchor, binding phosphoinositides directly, with
    PI(3,5)P2 the species that matters for endosomal binding. Loss of SWIP
    therefore removes an anchor that retromer cannot substitute for. This is a
    deliberate qualification of the common shorthand that WASH acts only
    downstream of retromer.
  molecular_functions:
  - preferred_term: phosphatidylinositol-3,5-bisphosphate binding
    term:
      id: GO:0080025
      label: phosphatidylinositol-3,5-bisphosphate binding
  cellular_components:
  - preferred_term: endosome
    term:
      id: GO:0005768
      label: endosome
  downstream:
  - target: Loss of Endosomal Branched-Actin Nucleation
    causal_link_type: DIRECT
    description: >-
      A complex that cannot be held at the endosomal surface cannot nucleate
      actin there.
  evidence:
  - reference: PMID:36995008
    reference_title: "SWIP mediates retromer-independent membrane recruitment of the WASH complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The retromer-independent membrane anchor is directly mediated by the
      subunit SWIP.
    explanation: >-
      Directly attributes a membrane-anchoring function to the MRT43 gene
      product itself, which is what makes its loss more than the loss of a
      structural filler subunit.
  - reference: PMID:36995008
    reference_title: "SWIP mediates retromer-independent membrane recruitment of the WASH complex."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      It is generally accepted that WASH complex attaches to the endosomal
      membrane via the interaction of its subunit FAM21 with the retromer
      subunit VPS35.
    explanation: >-
      Records the retromer-dependent route this node is contrasted with, so the
      qualification in the node description is attributable rather than
      editorial.
  notes: >-
    Cell-biological work in cultured cells on the SWIP protein, not on patient
    material. It is included because it is about WASHC4/SWIP itself; the
    disease-level consequence is inferred, and the downstream edges carry their
    own evidence.

- name: Loss of Endosomal Branched-Actin Nucleation
  biological_scale: CELLULAR
  description: >-
    The WASH complex's output is activation of Arp2/3 on the endosomal surface,
    producing localised branched-actin patches. Without it, the force that
    shapes and pinches the sorting tubules leaving the endosome is not
    generated.
  biological_processes:
  - preferred_term: Arp2/3 complex-mediated actin nucleation
    term:
      id: GO:0034314
      label: Arp2/3 complex-mediated actin nucleation
    modifier: DECREASED
  - preferred_term: actin filament polymerization
    term:
      id: GO:0030041
      label: actin filament polymerization
    modifier: DECREASED
  molecular_functions:
  - preferred_term: Arp2/3 complex binding
    term:
      id: GO:0071933
      label: Arp2/3 complex binding
  cellular_components:
  - preferred_term: early endosome
    term:
      id: GO:0005769
      label: early endosome
  downstream:
  - target: Failed Endosomal Cargo Sorting and Tubule Fission
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31953988
      reference_title: "Novel KIAA1033/WASHC4 mutations in three patients with syndromic intellectual disability and a review of the literature."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The WASH complex is involved in the regulation of the fission of tubules
        that serve as transport intermediates during endosome sorting.
      explanation: >-
        States the step from WASH complex activity to tubule fission during
        endosome sorting, which is the edge drawn here.
  evidence:
  - reference: PMID:34599609
    reference_title: "Homozygous WASHC4 variant in two sisters causes a syndromic phenotype defined by dysmorphisms, intellectual disability, profound developmental disorder, and skeletal muscle involvement."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The protein encoded by WASHC4 is part of the Wiskott-Aldrich syndrome
      protein and SCAR homolog family, co-localizes with actin in cells, and
      promotes Arp2/3-dependent actin polymerization in vitro.
    explanation: >-
      Attributes Arp2/3-dependent actin polymerisation to the WASHC4 gene
      product specifically, so its loss is expected to reduce that activity.

- name: Failed Endosomal Cargo Sorting and Tubule Fission
  biological_scale: CELLULAR
  description: >-
    Cargo that should leave the sorting endosome in a scission-competent tubule
    - for recycling to the surface or retrograde delivery to the Golgi - is not
    retrieved efficiently. The endosomal and lysosomal compartments enlarge and
    substrate accumulates.
  biological_processes:
  - preferred_term: endosomal transport
    term:
      id: GO:0016197
      label: endosomal transport
    modifier: DECREASED
  - preferred_term: endocytic recycling
    term:
      id: GO:0032456
      label: endocytic recycling
    modifier: DECREASED
  - preferred_term: retrograde transport, endosome to Golgi
    term:
      id: GO:0042147
      label: retrograde transport, endosome to Golgi
    modifier: DECREASED
  - preferred_term: endosome organization
    term:
      id: GO:0007032
      label: endosome organization
  downstream:
  - target: Neuronal Endo-Lysosomal Dysfunction
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:33749590
      reference_title: "Genetic disruption of WASHC4 drives endo-lysosomal dysfunction and cognitive-movement impairments in mice and humans."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Cellular and histological analyses confirm that SWIPP1019R results in
        endo-lysosomal disruption and uncover indicators of neurodegeneration.
      explanation: >-
        Links the sorting defect produced by the patient allele to disruption of
        the endo-lysosomal system in brain tissue.
  - target: Impaired Autophagic Protein Clearance in Striated Muscle
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The muscle arm is supported by zebrafish knockdown and by patient muscle
      and fibroblast proteomics, not by a demonstrated step from endosomal
      sorting to autophagic flux in human muscle.
  evidence:
  - reference: PMID:33749590
    reference_title: "Genetic disruption of WASHC4 drives endo-lysosomal dysfunction and cognitive-movement impairments in mice and humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Destabilization of the WASH complex leads to enlarged endosomes and
      lysosomes, with increased substrate accumulation at the lysosome.
    explanation: >-
      Describes the morphological and cargo-handling consequence at the
      compartment level that this node names.

- name: Neuronal Endo-Lysosomal Dysfunction
  biological_scale: CELLULAR
  description: >-
    In brain the sorting failure presents as a disturbed endo-lysosomal axis:
    enlarged endosomes and lysosomes, raised lysosomal enzyme levels, ER stress,
    accumulation of lipofuscin-like residual bodies, and progressive activation
    of apoptotic markers. The pattern is degenerative rather than purely
    developmental, which matters because MRT-series entities are usually treated
    as static encephalopathies.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  cellular_components:
  - preferred_term: lysosome
    term:
      id: GO:0005764
      label: lysosome
  biological_processes:
  - preferred_term: lysosome organization
    term:
      id: GO:0007040
      label: lysosome organization
  downstream:
  - target: Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The cognitive phenotype is attributed to the endo-lysosomal defect, but
      the intervening circuit-level step is not established.
    evidence:
    - reference: PMID:33749590
      reference_title: "Genetic disruption of WASHC4 drives endo-lysosomal dysfunction and cognitive-movement impairments in mice and humans."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Combined, these findings support the model that WASH complex
        destabilization, resulting from SWIPP1019R, drives cognitive and motor
        impairments via endo-lysosomal dysfunction in the brain.
      explanation: >-
        The authors state the causal model this edge encodes; the evidence is a
        mouse carrying the human allele, so the claim about human cognition is
        an inference from that model plus the patients' known phenotype.
  - target: Movement Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:33749590
      reference_title: "Genetic disruption of WASHC4 drives endo-lysosomal dysfunction and cognitive-movement impairments in mice and humans."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We find that SWIPP1019R not only impacts cognition, but also causes
        significant progressive motor deficits in mice.
      explanation: >-
        Establishes the motor arm of the same causal model in the knock-in
        animal.
  evidence:
  - reference: PMID:33749590
    reference_title: "Genetic disruption of WASHC4 drives endo-lysosomal dysfunction and cognitive-movement impairments in mice and humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cellular analyses confirm a significant impact on neuronal endo-lysosomal
      trafficking in vitro and in vivo, with evidence of lipofuscin accumulation
      and progressive apoptosis activation, molecular phenotypes that are
      indicative of neurodegenerative pathology.
    explanation: >-
      Names the specific cellular findings - lipofuscin accumulation, apoptosis
      activation - that this node asserts.

- name: Impaired Autophagic Protein Clearance in Striated Muscle
  biological_scale: CELLULAR
  description: >-
    Outside the nervous system, WASHC4 loss disturbs protein clearance in
    striated muscle. Zebrafish washc4 inactivation causes ER stress and
    interferes with autophagy without impairing the ubiquitin-proteasome system,
    and proteins relevant to muscle function are dysregulated in a patient
    muscle biopsy and in patient fibroblasts.
  cell_types:
  - preferred_term: muscle cell
    term:
      id: CL:0000187
      label: muscle cell
  locations:
  - preferred_term: skeletal muscle tissue
    term:
      id: UBERON:0001134
      label: skeletal muscle tissue
  biological_processes:
  - preferred_term: autophagy
    term:
      id: GO:0006914
      label: autophagy
    modifier: DECREASED
  downstream:
  - target: Skeletal Muscle Involvement
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34599609
      reference_title: "Homozygous WASHC4 variant in two sisters causes a syndromic phenotype defined by dysmorphisms, intellectual disability, profound developmental disorder, and skeletal muscle involvement."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Immunostaining on a muscle biopsy derived from the same patient
        confirmed dysregulation of proteins relevant for proper muscle function,
        thus highlighting an affliction of muscle cells upon loss of functional
        WASHC4.
      explanation: >-
        Connects loss of WASHC4 to a demonstrated abnormality in patient muscle
        tissue, which is the phenotype this edge points at.
  evidence:
  - reference: PMID:30010465
    reference_title: "Loss of the novel Vcp (valosin containing protein) interactor Washc4 interferes with autophagy-mediated proteostasis in striated muscle and leads to myopathy in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Notably, loss of Vcp resulted in compromised protein degradation via the
      proteasome and the macroautophagy/autophagy machinery, whereas Washc4
      deficiency did not affect the function of the ubiquitin-proteasome system
      (UPS) but caused ER stress and interfered with autophagy function in vivo.
    explanation: >-
      Specifies the arm of proteostasis that Washc4 loss affects in vivo -
      autophagy and ER stress, not the proteasome - which is the claim this node
      makes.
  notes: >-
    Kept as a separate branch rather than folded into the neuronal chain because
    its evidence base is different (zebrafish plus one patient biopsy) and
    because skeletal muscle involvement was explicitly absent from the reported
    human phenotype until 2022.


name: Intellectual Disability, Autosomal Recessive 43
creation_date: "2026-09-07T00:00:00Z"
category: Genetic
description: >-
  Intellectual disability, autosomal recessive 43 (MRT43) is a rare Mendelian
  neurodevelopmental disorder caused by biallelic variants in WASHC4 (formerly
  KIAA1033), which encodes SWIP, one of the five subunits of the pentameric WASH
  complex. The WASH complex sits on the endosomal surface, where it activates
  the Arp2/3 complex to build the branched-actin patches that drive scission of
  the sorting tubules carrying cargo out of the endosome. Loss of SWIP
  destabilises the whole complex, and the resulting endosomal-sorting failure
  presents in brain as an endo-lysosomal trafficking defect. The founding report
  (2011) described a large consanguineous Omani family with seven affected
  members, moderate intellectual disability and short stature, and framed the
  entity as NON-syndromic; every subsequent report has described additional
  features - dysmorphism, macro- or microcephaly, skeletal anomalies,
  subependymal heterotopic nodules, sensorineural hearing loss, and skeletal
  muscle involvement - so the current literature calls the phenotype syndromic
  and heterogeneous. Fewer than fifteen patients from four families have been
  reported. A knock-in mouse carrying the human p.Pro1019Arg allele reproduces
  both the cognitive impairment and a progressive motor decline that was then
  found retrospectively in the patients, making MRT43 one of the few MRT-series
  entities with an experimentally worked mechanism rather than a gene assignment
  alone.

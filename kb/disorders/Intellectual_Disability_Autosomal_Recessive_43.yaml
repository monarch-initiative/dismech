      snippet: >-
        Proteomic profiling of fibroblasts of the WASHC4-deficient patient
        revealed dysregulation of proteins relevant for the maintenance of the
        neuromuscular axis.
      explanation: >-
        States what was measured in this model and in which direction the
        interpretation runs.

diagnosis:
- name: Exome sequencing
  description: >-
    All reported families were solved by sequencing. The founding pedigree was
    identified by homozygosity mapping followed by targeted exon enrichment and
    high-throughput sequencing; the later families were ascertained by
    diagnostic exome sequencing. There is no biochemical marker and no
    functional assay in clinical use, so molecular testing is the diagnosis.
  diagnosis_term:
    preferred_term: Whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  markers: Biallelic pathogenic or likely pathogenic WASHC4 (KIAA1033) variants.
  evidence:
  - reference: PMID:31953988
    reference_title: "Novel KIAA1033/WASHC4 mutations in three patients with syndromic intellectual disability and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we describe three additional patients (from two unrelated families)
      with syndromic ID due to compound heterozygous KIAA1033 variants
      ascertained by exome sequencing (ES).
    explanation: >-
      Exome sequencing is named as the method by which these diagnoses were
      made.
  - reference: PMID:21498477
    reference_title: "Identification of a novel candidate gene for non-syndromic autosomal recessive intellectual disability: the WASH complex member SWIP."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a large consanguineous family with autosomal recessive intellectual
      disability (ARID), we have combined homozygosity mapping, targeted exon
      enrichment and high-throughput sequencing to identify the underlying gene
      defect.
    explanation: >-
      Records the sequencing-based route to the founding diagnosis.

- name: Brain MRI
  description: >-
    Neuroimaging is not diagnostic of MRT43 but is what discloses the
    subependymal heterotopic nodules described in two affected sisters, a
    structural finding that would not be suspected clinically.
  diagnosis_term:
    preferred_term: Magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:31953988
    reference_title: "Novel KIAA1033/WASHC4 mutations in three patients with syndromic intellectual disability and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Both had learning disabilities, macrocephaly, dysmorphic features,
      skeletal anomalies, and subependymal heterotopic nodules.
    explanation: >-
      The abstract reports the imaging finding without naming the modality;
      subependymal heterotopic nodules are a neuroimaging diagnosis, so the
      inference that brain imaging was performed is one step removed from what
      the quote states. Graded INDIRECT for that reason.
  notes: >-
    The cited abstract does not state the imaging modality. MRI is the modality
    in which subependymal nodular heterotopia is identified in practice, but
    that is inference, not a sourced statement about these patients.

- name: Genetic counseling
  description: >-
    Confirmation of biallelic WASHC4 variants establishes a 25% sibling
    recurrence risk and identifies both parents as carriers.
  diagnosis_term:
    preferred_term: Genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:31953988
    reference_title: "Novel KIAA1033/WASHC4 mutations in three patients with syndromic intellectual disability and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Here we describe three additional patients (from two unrelated families)
      with syndromic ID due to compound heterozygous KIAA1033 variants
      ascertained by exome sequencing (ES).
    explanation: >-
      Establishes carrier status of both parents in each family, which is the
      fact that recurrence-risk counselling rests on. The 25% figure itself is
      the standard recessive expectation and is not asserted by the quote.

- name: Audiological assessment
  description: >-
    Formal hearing assessment, prompted by the bilateral sensorineural hearing
    loss reported in one of the 2020 patients. Applies to case finding for that
    feature; it is not a test for MRT43 itself, which is diagnosed molecularly.
  diagnosis_term:
    preferred_term: audiological assessment
  evidence:
  - reference: PMID:31953988
    reference_title: "Novel KIAA1033/WASHC4 mutations in three patients with syndromic intellectual disability and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      In addition, the younger sibling had a congenital absence of the right
      internal carotid and bilateral sensorineural hearing loss.
    explanation: >-
      Establishes the finding that makes audiological assessment relevant. The
      source reports the hearing loss but does not describe the assessment
      pathway, so this is indirect support for the diagnostic entry rather than
      a statement that audiology is part of a workup.
  notes: >-
    No NCIT clinical-action term for audiological assessment is reachable from
    NCIT:C25218, so this entry carries a free-text preferred_term only, matching
    the treatment entry in Congenital_Heart_Defects_and_Skeletal_Malformations_Syndrome.
    NCIT:C85857 Evoked Response Audiometry is reachable and would validate, but
    the source does not say which test was performed, and binding a specific
    audiometric modality the report never names would manufacture specificity
    the evidence does not carry.


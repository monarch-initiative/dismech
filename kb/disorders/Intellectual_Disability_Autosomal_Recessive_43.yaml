    term:
      id: CL:0000057
      label: fibroblast
  modeled_mechanisms:
  - target: Impaired Autophagic Protein Clearance in Striated Muscle
    relationship: MEASURES
    fidelity: LOW
    model_scale: MOLECULAR
    description: >-
      Proteomic profiling of the patient's fibroblasts identified dysregulation
      of proteins relevant to the neuromuscular axis, which is what directed the

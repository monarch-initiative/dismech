diagnosis:
- name: Exome sequencing
  description: >-
    All reported families were solved by sequencing. The founding pedigree was
    identified by homozygosity mapping followed by targeted exon enrichment and
    high-throughput sequencing; the later families were ascertained by
    diagnostic exome sequencing. There is no biochemical marker and no
    functional assay in clinical use, so molecular testing is the diagnosis.
  diagnosis_term:
    preferred_term: Whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  markers: Biallelic pathogenic or likely pathogenic WASHC4 (KIAA1033) variants.
  evidence:
  - reference: PMID:31953988
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we describe three additional patients (from two unrelated families)
      with syndromic ID due to compound heterozygous KIAA1033 variants
      ascertained by exome sequencing (ES).
    explanation: >-
      Exome sequencing is named as the method by which these diagnoses were
      made.
  - reference: PMID:21498477
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a large consanguineous family with autosomal recessive intellectual
      disability (ARID), we have combined homozygosity mapping, targeted exon
      enrichment and high-throughput sequencing to identify the underlying gene
      defect.
    explanation: >-
      Records the sequencing-based route to the founding diagnosis.

- name: Brain MRI
  description: >-
    Neuroimaging is not diagnostic of MRT43 but is what discloses the
    subependymal heterotopic nodules described in two affected sisters, a
    structural finding that would not be suspected clinically.
  diagnosis_term:
    preferred_term: Magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:31953988
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Both had learning disabilities, macrocephaly, dysmorphic features,
      skeletal anomalies, and subependymal heterotopic nodules.
    explanation: >-
      The abstract reports the imaging finding without naming the modality;
      subependymal heterotopic nodules are a neuroimaging diagnosis, so the
      inference that brain imaging was performed is one step removed from what
      the quote states. Graded INDIRECT for that reason.
  notes: >-
    The cited abstract does not state the imaging modality. MRI is the modality
    in which subependymal nodular heterotopia is identified in practice, but
    that is inference, not a sourced statement about these patients.

- name: Genetic counseling
  description: >-
    Confirmation of biallelic WASHC4 variants establishes a 25% sibling
    recurrence risk and identifies both parents as carriers.
  diagnosis_term:
    preferred_term: Genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:31953988
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Here we describe three additional patients (from two unrelated families)
      with syndromic ID due to compound heterozygous KIAA1033 variants
      ascertained by exome sequencing (ES).
    explanation: >-
      Establishes carrier status of both parents in each family, which is the
      fact that recurrence-risk counselling rests on. The 25% figure itself is
      the standard recessive expectation and is not asserted by the quote.

treatments:
- name: Developmental and Educational Intervention
  description: >-
    Special education, speech and language therapy and developmental support for
    the intellectual disability and language delay. This is generic
    intellectual-disability management applied to MRT43; no study has assessed
    any intervention in WASHC4-related disease, and none is cited here because
    none exists.
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  therapeutic_modality: BEHAVIORAL
  notes: >-
    Deliberately uncited. Searches of the four primary WASHC4 reports and of
    PubMed for WASHC4/KIAA1033 treatment or management returned no
    disease-specific therapeutic study, guideline, or trial, and no GeneReviews
    chapter exists for this entity. Rather than attach a quote from an unrelated
    intellectual-disability paper, the claim is left as an unevidenced statement
    of ordinary supportive practice. The NCIT binding is the closest available
    clinical-action term; the entry is broader than physical therapy alone,
    which is why preferred_term is not simply echoed into the treatment name.

- name: Audiological Management
  description: >-
    Assessment and amplification for the bilateral sensorineural hearing loss
    reported in one patient. Applies only to the patient subset with hearing
    loss.
  treatment_term:
    preferred_term: Rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  therapeutic_modality: BEHAVIORAL
  target_phenotypes:
  - preferred_term: Bilateral sensorineural hearing loss
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  notes: >-
    Deliberately uncited, for the same reason as the developmental-intervention
    entry: the hearing loss is documented (PMID:31953988) but its management in
    this disorder is not described anywhere in the WASHC4 literature.

discussions:
- discussion_id: mrt43_nonsyndromic_label_unstable
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is MRT43 a non-syndromic intellectual disability, as its MONDO placement and
    its founding report say, or a syndromic one, as every subsequent report says?
  attaches_to:
  - phenotypes#Dysmorphic Facial Features
  - phenotypes#Skeletal Muscle Involvement
  rationale: >-
    MONDO:0014354 is a child of MONDO:0019502, autosomal recessive NON-syndromic
    intellectual disability, and the 2011 title says "non-syndromic". The 2020
    paper's own title says "syndromic intellectual disability", the 2022 title
    says "a syndromic phenotype", and between them they report dysmorphism,
    skeletal anomalies, subependymal nodular heterotopia, hearing loss, an
    absent internal carotid artery and skeletal muscle involvement. This entry
    curates the phenotype the later reports describe while keeping the MONDO
    binding, because the identifier is what the community indexes against; the
    disagreement is recorded here rather than resolved by silently recategorising
    the disorder. This is the same instability the class-level entry
    Autosomal_Recessive_Non-Syndromic_Intellectual_Disability already flags for
    NSUN2, MAN1B1 and ADAT3 - MRT43 is another instance of it, not a new
    phenomenon.
  evidence:
  - reference: PMID:31953988
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that KIAA1033 is responsible for a heterogeneous ARID
      phenotype, and additional description will be needed to refine the
      clinical phenotype.
    explanation: >-
      The authors themselves decline to settle the phenotype, which is the
      unresolved state this discussion records.

- discussion_id: mrt43_static_or_degenerative
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is MRT43 a static developmental encephalopathy, or does the endo-lysosomal
    defect drive a slowly progressive neurodegenerative process in patients?
  attaches_to:
  - pathophysiology#Neuronal Endo-Lysosomal Dysfunction
  - phenotypes#Progressive Movement Impairment
  rationale: >-
    The MRT series is conventionally treated as static, and developmental
    regression is taken to argue against the diagnosis. The knock-in mouse says
    otherwise for this gene: lipofuscin accumulation, progressive caspase-3
    activation, and motor decline that worsens between adolescence and
    adulthood. The human evidence is a retrospective chart review that found
    movement deficits, not a longitudinal study that found progression. No
    patient has been followed prospectively, and no human neuropathology exists.
    Resolving this changes surveillance - whether these patients need serial
    motor assessment - and it changes whether MRT43 should be described as a
    neurodevelopmental or a neurodegenerative disorder.
  evidence:
  - reference: PMID:33749590
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Cellular and histological analyses confirm that SWIPP1019R results in
      endo-lysosomal disruption and uncover indicators of neurodegeneration.
    explanation: >-
      The neurodegenerative indicators that make the question live are
      established in the mouse; the gap is that they have not been sought in
      patients.

- discussion_id: mrt43_no_therapeutic_evidence
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is there any evidence bearing on management of MRT43, beyond generic
    intellectual-disability supportive care?
  attaches_to:
  - treatments#
  rationale: >-
    No treatment study, management guideline, natural-history study, clinical
    trial or GeneReviews chapter exists for WASHC4-related disease. The two
    treatment entries here are ordinary supportive practice and carry no
    evidence for that reason, which is recorded explicitly rather than papered
    over with a quotation from an unrelated intellectual-disability paper. With
    fewer than fifteen reported patients this is a consequence of cohort size,
    not of neglect, and the first thing needed is a natural-history description
    rather than an intervention.
  evidence:
  - reference: PMID:31953988
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since then, no other cases of KIAA1033 variants have been reported.
    explanation: >-
      Supports the cohort-size explanation: nine years after the founding report
      the total published series was still one family.

differential_diagnoses:
- name: Ritscher-Schinzel (3C) syndrome and SPG8 (WASHC5/strumpellin)
  description: >-
    WASHC5, formerly KIAA0196, encodes strumpellin, a different subunit of the
    same WASH complex. Biallelic WASHC5 variants cause Ritscher-Schinzel / 3C
    syndrome with cranio-cerebello-cardiac malformations; heterozygous WASHC5
    variants cause hereditary spastic paraplegia type 8. Neither is MRT43, and
    the similarity of the gene symbols and the shared complex make this the most
    likely confusion in the WASHC4 literature. The distinguishing features are
    the gene, the inheritance pattern for SPG8, and the malformation and
    spastic-paraparesis phenotypes, none of which characterise MRT43.
  distinguishing_features:
  - Caused by WASHC5/KIAA0196, not WASHC4/KIAA1033
  - 3C syndrome features cerebellar and cardiac malformations not reported in MRT43
  - SPG8 is dominantly inherited spastic paraplegia, not recessive intellectual disability
  evidence:
  - reference: PMID:31953988
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Another member of the WASH complex, KIAA0196/WASHC5, has already been
      implicated in ARID with brain and cardiac malformations, under the
      designation of 3C or Ritscher-Schinzel syndrome (MIM#20210).
    explanation: >-
      The WASHC4 paper itself distinguishes its gene from the WASHC5 disorder,
      which is the distinction this entry records.
  - reference: PMID:20498093
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      Strumpellin is mutated in the human disease hereditary spastic paraplegia,
      and its link to WASH suggests that misregulation of actin dynamics on
      endosomes may play a role in this disorder.
    explanation: >-
      Establishes the second, dominant strumpellin disorder that must not be
      conflated with MRT43. The quote is about strumpellin/WASHC5 in a
      biochemical study of the complex, not about WASHC4 patients, hence
      INDIRECT.

- name: WASHC3-related short stature and neurodevelopmental syndrome
  description: >-
    WASHC3/CCDC53 is a third subunit of the same pentamer. Variants in it were
    reported in 2025 to cause short stature, variable neurodevelopmental
    abnormalities and distinctive facial dysmorphism - a phenotype that overlaps
    MRT43 closely enough to be a real diagnostic and curation confusion, since
    short stature, developmental abnormality and dysmorphism are exactly the
    MRT43 triad. The distinction is the gene, and that one reported WASHC3
    family carries a de novo dominant allele rather than biallelic variants.
  distinguishing_features:
  - Caused by WASHC3/CCDC53, not WASHC4/KIAA1033
  - Includes a de novo dominant missense family, so inheritance is not uniformly recessive
  - Short stature is attributed to impaired PTH1R endosomal trafficking in growth plate chondrocytes, a mechanism not demonstrated for WASHC4
  evidence:
  - reference: PMID:40129681
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RESULTS: Exome sequencing identified variants in WASHC3, a component of
      the WASH complex.
    explanation: >-
      Establishes that a second WASH-complex subunit gene causes an overlapping
      human phenotype, which is the confusion this differential guards against.
  - reference: PMID:40129681
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the first family, a de-novo-dominant missense variant (p.L69F) impaired
      WASHC3 participation in the WASH complex, altered PTH1R endosomal
      trafficking, diminished PTH1R signaling, and affected growth plate
      chondrocyte hypertrophic differentiation, providing a likely explanation
      for the short stature.
    explanation: >-
      Names the dominant inheritance and the chondrocyte mechanism that separate
      that disorder from MRT43.

notes: >-
  Scope and modelling decisions. (1) LUMP/SPLIT: curated as a standalone Disease
  entry rather than as a has_subtypes row on the class-level entry
  Autosomal_Recessive_Non-Syndromic_Intellectual_Disability. MONDO:0014354 is a
  leaf - no descendants - with a single causal-gene assertion (RO:0004003
  HGNC:29174), which is the gene-defined Mendelian leaf signature the repository
  treats as an entry. The class-level entry's own notes state that its
  has_subtypes rows are "exemplars chosen to span the mechanistic theme set...
  not an exhaustive enumeration", that WASHC4 is not among them, and that
  modelling the class as a Grouping is blocked because "a Grouping requires its
  members to exist as separate Disease entries, which the MRT series does not
  yet". This entry is one such member. The substantive reason, beyond
  bookkeeping, is that MRT43 now carries content a class-level node cannot hold:
  a worked molecular mechanism, an allele-specific knock-in mouse, and a
  phenotype that has migrated out of the non-syndromic category. (2) The entry
  does NOT assert pathway convergence with the other AR-ID trafficking genes.
  The class entry lists WASHC4 alongside TRAPPC9, TRAPPC6B, TBC1D23 and CC2D1A
  under "vesicle trafficking with NF-kB signalling" and states explicitly that
  these are "post-hoc organising themes, not a claim of pathway convergence".
  Nothing here contradicts that: no NF-kB claim is made for WASHC4, and no
  shared mechanism with those genes is curated, because none of the sources
  makes one. (3) The retromer framing is deliberately qualified. The common
  shorthand is that the WASH complex reaches the endosome downstream of
  retromer, via FAM21-VPS35. PMID:36995008 shows that SWIP - the MRT43 gene
  product itself - provides a second, retromer-INDEPENDENT anchor through
  phosphoinositide binding. The pathophysiology chain therefore has a separate
  node for the loss of that anchor, and the entry does not describe MRT43 as a
  retromer disorder. (4) NAMED ENTITY CONFUSION guard: WASHC5/strumpellin
  (Ritscher-Schinzel/3C syndrome, SPG8), VPS35 (Parkinson disease) and the
  broader WASH/retromer cell-biology literature are adjacent to this gene and
  are NOT this disease. WASHC5 is recorded under differential_diagnoses for that
  reason. No VPS35 or WASHC5 finding is curated as MRT43 evidence, and the
  cell-biology citations used here (PMID:20498093, PMID:36995008) are cited
  specifically for statements about SWIP/KIAA1033 or about the complex that
  contains it. (5) No conforms_to. There is no endosomal-sorting, retromer, or
  WASH-complex module in kb/modules/ (grep for "retromer" and "WASH complex"
  across the module directory returns nothing), and conforming this entry to an
  autophagy or proteostasis module would assert a relationship the sources do
  not make - PMID:30010465 specifically found the proteasome arm intact. A
  future endosomal-sorting module would be the right conformance target. (6) No
  GeneReviews chapter exists (PubMed "WASHC4 GeneReviews[All Fields]" returns
  zero results), so the GeneReviews phenotype baseline step could not be
  applied; the phenotype set is built from the four primary reports. (7)
  Prevalence carries no numeric rate. Nothing has been published beyond a case
  count, so measure_type is CASES_IN_LITERATURE with the qualitative
  ULTRA_RARE band and no rate_per_100000. (8) Macrocephaly and microcephaly are
  curated as separate phenotypes rather than as one "abnormal head
  circumference" node, because they are opposite findings in different patients
  within a single report, not a variable trait with an agreed direction. (9)
  Treatments carry no evidence, by decision rather than omission; see the
  mrt43_no_therapeutic_evidence discussion and the per-treatment notes. (10) The
  medRxiv preprint PMID:38712155, which reports a rare-variant association of
  WASHC4 with "abnormality of speech or vocalization" in a paediatric
  speech-and-language cohort, was read and deliberately NOT cited: it is a
  cohort-level burden association in a broad EMR population, not a statement
  about MRT43 patients, and the language phenotype is already directly evidenced
  by PMID:34599609. (11) Deep research used the claude_code provider;
  falcon was unavailable (HTTP 402) in this environment. Every PMID cited here
  was fetched independently with just fetch-reference and every snippet verified
  against the cached record. (12) The deep-research report attributes the
  founding MRT43 description to Najmabadi et al., Nature 2011 (PMID:21937992,
  "Deep sequencing reveals 50 novel genes for recessive cognitive disorders").
  That is wrong, and this entry does not follow it. The founding WASHC4 report
  is Ropers et al., Hum Mol Genet 2011 (PMID:21498477), which describes the
  consanguineous pedigree, the SWIP variant and the complex destabilisation, and
  which the eLife mouse paper cites as the source of the p.Pro1019Arg allele it
  models. PMID:21937992 is therefore not cited here at all, because no verified
  quote from it names KIAA1033/WASHC4.

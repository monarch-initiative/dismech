    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ingestion is rare because of alarming odour and irritant effect but documented in accidental, homicidal or suicidal attempts."
    explanation: >-
      Names the three documented intents behind formalin ingestion and explains
      why it is rare.
  - reference: PMID:35394178
    reference_title: "A fatal case of accidental oral formaldehyde poisoning and its pathomorphological characteristics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This article reports a case of a 50-year-old woman who died after accidentally drinking 25% formaldehyde solution in a transparent plastic bottle."
    explanation: >-
      A documented accidental ingestion arising from decanting formalin into an

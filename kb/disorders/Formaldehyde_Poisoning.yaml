name: Formaldehyde Poisoning
creation_date: "2026-08-13T00:00:00Z"
category: Environmental
categories:
- Toxic Exposure Disorder
- Aldehyde Toxicity
- Environmental Health Disorder
- Occupational Disease
synonyms:
- formalin poisoning
- formalin intoxication
- formaldehyde toxicity
- formaldehyde intoxication
- methanal poisoning
description: >-
  Formaldehyde poisoning is the toxic effect of exposure to formaldehyde gas,
  aqueous formaldehyde (formalin, typically a 37-40% solution stabilized with
  10-15% methanol), or formaldehyde-releasing agents. Formaldehyde is a small,
  highly water-soluble, highly reactive electrophilic aldehyde that forms
  Schiff-base adducts and methylene crosslinks with the amine and thiol groups
  of proteins and nucleic acids. Because it reacts so fast, its injury is
  largely confined to the tissue of first contact, and the clinical syndrome is
  set by route and dose rather than by a single downstream pathway. Inhalation
  produces a concentration-graded irritant syndrome of the eyes and upper
  airway, with epithelial cytotoxicity and regenerative proliferation at higher
  concentrations. Ingestion of formalin produces corrosive coagulative necrosis
  of the upper gastrointestinal tract - the same protein fixation that preserves
  a specimen jar - followed by systemic absorption, formate accumulation, severe
  high-anion-gap metabolic acidosis, circulatory collapse, and multiorgan
  failure; survivors may develop fibrotic strictures weeks later. Repeated
  contact causes haptenation and type IV sensitization (allergic contact
  dermatitis). Chronic inhalation is linked to upper-airway carcinoma, and
  formaldehyde is classified by IARC as a human carcinogen, though the
  mechanistic route to distant-site haematopoietic malignancy remains contested.
  There is no antidote; management is supportive, with hemodialysis for formate
  and acidosis, and fomepizole reserved for significant methanol co-ingestion.

definitions:
- name: Clinical case definition for formaldehyde poisoning
  definition_type: CASE_DEFINITION
  description: >-
    Formaldehyde poisoning is a toxic syndrome following inhalational, oral, or
    dermal and ocular exposure to formaldehyde or formalin, in which a highly
    reactive aldehyde damages the tissue of first contact by protein and nucleic
    acid crosslinking, with systemic acidosis and multiorgan failure when the
    dose is large enough to be absorbed.
  scope: Disease-level clinical framing across inhalational, ingestion, and chronic exposure routes
  evidence:
  - reference: PMID:10962510
    reference_title: "Toxicity of ingested formalin and its management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Formalin is irritating, corrosive and toxic and absorbed from all surfaces of the body."
    explanation: >-
      Supports the core framing that formaldehyde is simultaneously an irritant
      and a corrosive, and is absorbed by every route of contact.
parents:
- chemical poisoning
- aldehyde poisoning
has_subtypes:
- name: Acute inhalation
  display_name: Acute inhalational exposure (irritant syndrome)
  description: >-
    Concentration-graded irritation of the eyes, nose, throat, and airways
    following formaldehyde vapour exposure, largely reversible on removal from
    exposure but capable of epithelial injury and pulmonary oedema at high
    concentration.
  evidence:
  - reference: PMID:42101931
    reference_title: "The formaldehyde dispute - Part A: acute and chronic inhalation toxicity and the evolution of scientific knowledge."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Controlled human chamber studies reported no measurable pulmonary impairment below 0.3 ppm, the onset of mild ocular and nasal irritation at 0.3 to 0.5 ppm, and reversible sensory irritation observed at concentrations approaching 1 ppm."
    explanation: >-
      Establishes the concentration-graded irritant syndrome as the defining
      feature of the acute inhalational subtype, with reversibility at the doses
      that produce it.
- name: Acute ingestion
  display_name: Acute formalin ingestion (corrosive and systemic)
  description: >-
    Swallowing of formalin, producing corrosive coagulative injury of the upper
    gastrointestinal tract together with systemic acidosis, shock, and
    multiorgan failure. Frequently fatal, and complicated by the methanol that
    stabilizes commercial formalin.
  evidence:
  - reference: PMID:10962510
    reference_title: "Toxicity of ingested formalin and its management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ingestion can lead to immediate deleterious effects on almost all systems of the body including gastrointestinal tract, central nervous system, cardiovascular system and hepato-renal system, causing gastrointestinal hemorrhage, cardiovascular collapse, unconsciousness or convulsions, severe metabolic acidosis and acute respiratory distress syndrome."
    explanation: >-
      Defines the ingestion subtype as a combined corrosive plus multisystem
      syndrome rather than a purely local injury.
- name: Chronic exposure
  display_name: Chronic occupational or environmental exposure
  description: >-
    Repeated low-level inhalational or dermal exposure, producing sensitization,
    chronic airway and nasal mucosal changes, and - at the portal of entry -
    epithelial dysplasia and carcinoma risk.
  evidence:
  - reference: PMID:32686516
    reference_title: "Formaldehyde toxicity reports from in vitro and in vivo studies: a review and updated data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Studies with humans gave evidence regarding significant deleterious effects on health associated to chronic FA occupational exposure."
    explanation: >-
      Supports chronic occupational exposure as a distinct exposure subtype with
      documented human health effects.
prevalence:
- population: Worldwide
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No reliable incidence or prevalence figures exist for formaldehyde poisoning
    as such. It is not a reportable condition and poison-centre aggregate data
    do not break it out cleanly; the acute literature is almost entirely case
    reports and small series. Ingestion in particular is self-limiting at the
    point of exposure because of the smell and immediate pain, which is why it
    is reported mainly as accidental decanting, self-harm, or homicide.
  evidence:
  - reference: PMID:23640147
    reference_title: "Homicidal acute formalin poisoning in an infant from a rural sericulture family presenting with multisystem failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acute poisoning of formalin is rare because of its strong irritating effect and alarming odor."
    explanation: >-
      Supports the rarity of acute formalin poisoning and names the reason for
      it, without asserting a rate the literature cannot provide.
mechanistic_hypotheses:
- hypothesis_group_id: portal_of_entry_genotoxicity
  hypothesis_label: Portal-of-entry local genotoxicity model
  status: CANONICAL
  description: >-
    The dominant model: because formaldehyde is consumed by reaction within the
    first tissue it meets, genotoxic injury and the resulting carcinoma risk are
    confined to the site of contact. Stable-isotope work finds exogenous
    formaldehyde-DNA adducts only at the portal of entry, and the rodent
    bioassay finds tumours only in the nasal cavity and only at frankly
    cytotoxic concentrations. On this model carcinogenesis is a consequence of
    sustained local cytotoxicity plus regenerative proliferation, not of a
    cumulative systemic dose.
  evidence:
  - reference: PMID:30701286
    reference_title: "Evaluation of inhaled low-dose formaldehyde-induced DNA adducts and DNA-protein cross-links by liquid chromatography-tandem mass spectrometry."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our data clearly show that endogenous adducts are present in all tissues analyzed, but exogenous adducts were not detectable in any tissue samples, including the most susceptible nasal epithelium."
    explanation: >-
      Isotope-labelled inhalation shows exogenous adducts do not reach tissues
      distant from the portal of entry, which is the central argument for the
      local model.
- hypothesis_group_id: systemic_haematopoietic_genotoxicity
  hypothesis_label: Systemic haematopoietic genotoxicity model
  status: ALTERNATIVE
  description: >-
    The contested model behind the IARC myeloid-leukaemia classification:
    inhaled formaldehyde, or a transported reactive derivative, reaches
    haematopoietic stem cells and causes crosslink damage there. The
    epidemiology is mixed, the dosimetry is unexplained, and the animal
    leukaemia data come from genetic clearance failure (endogenous formaldehyde)
    rather than from inhalation - so this is curated as a competing model, not
    as settled pathophysiology.
  evidence:
  - reference: PMID:24714728
    reference_title: "Upper airway cancer, myeloid leukemia, and other cancers in a cohort of British chemical workers exposed to formaldehyde."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "it remains uncertain how inhaled formaldehyde might reach haematopoietic stem cells at sufficient concentrations to induce malignancy"
    explanation: >-
      States the unresolved dosimetric objection to the systemic model, which is
      why this hypothesis is recorded as ALTERNATIVE rather than canonical.
- hypothesis_group_id: intravascular_blood_fixation
  hypothesis_label: Intravascular blood fixation model of circulatory collapse
  status: EMERGING
  description: >-
    A single forensic case proposes that rapid fixation of blood within the
    tissue, rather than shock secondary to mucosal injury and acidosis, is the
    proximate mechanism of death after formaldehyde ingestion. Recorded as an
    explicitly labelled emerging hypothesis so it is not mistaken for the
    conventional route.
  evidence:
  - reference: PMID:35394178
    reference_title: "A fatal case of accidental oral formaldehyde poisoning and its pathomorphological characteristics."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "we put forward a new viewpoint on the mechanism of death from formaldehyde poisoning in which formaldehyde causes rapid fixation of blood in the tissue, thus leading to acute circulatory disturbance"
    explanation: >-
      The authors frame this as a new viewpoint they are proposing, which is why
      it is grouped as an emerging rather than canonical model.
pathophysiology:
- name: Formaldehyde delivery at the portal of entry
  biological_scale: TISSUE
  description: >-
    Formaldehyde is small, highly water-soluble, and reacts essentially on
    contact, so the delivered dose is deposited and consumed in the first tissue
    it meets: the ocular surface and upper respiratory mucosa on inhalation, the
    oropharyngeal and gastric mucosa on ingestion, the epidermis on skin
    contact. More than 90% of inhaled formaldehyde is retained in the upper
    airway. This scrubbing at the portal of entry is the single organizing
    principle of the disease - it is why injury is concentration-driven rather
    than cumulative-dose-driven, and why the toxicology of a systemic route is
    so different from that of a local one.
  cell_types:
  - preferred_term: respiratory tract epithelial cell
    term:
      id: CL:0002368
      label: respiratory tract epithelial cell
  downstream:
  - target: Schiff-base adduction and methylene crosslinking of biomolecules
    description: Deposited formaldehyde reacts immediately with nucleophilic groups in the contacted tissue.
  - target: Trigeminal sensory irritation
    description: Formaldehyde at the mucosal surface stimulates trigeminal nerve endings.
  evidence:
  - reference: PMID:39828805
    reference_title: "Formaldehyde and asthma: a plausibility?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Retention of FA in the upper airways is > 90% in agreement with mice exposure studies that only extreme FA concentrations can surpass trachea, travel to the lower airways, and cause mild bronchoconstriction."
    explanation: >-
      Quantifies upper-airway retention and states the corollary that only
      extreme concentrations reach beyond it, supporting portal-of-entry
      deposition.
  - reference: PMID:42101931
    reference_title: "The formaldehyde dispute - Part A: acute and chronic inhalation toxicity and the evolution of scientific knowledge."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "inhalation was illustrated to follow a concentration-dependent continuum of effects confined to the tissues of initial contact"
    explanation: >-
      States the portal-of-entry confinement principle directly. Tagged OTHER
      because this sentence is the review's synthesis across five decades of
      human, animal, and mechanistic studies rather than a single study type.
- name: Schiff-base adduction and methylene crosslinking of biomolecules
  biological_scale: MOLECULAR
  description: >-
    The single chemical event underlying every arm of the disease. The aldehyde
    carbon is electrophilic and attacks nucleophilic sites - lysine
    epsilon-amino and N-terminal amines, cysteine thiols, and the exocyclic
    amines of DNA bases - forming methylol adducts that condense into stable
    methylene bridges. No metabolic activation is required. The same reaction
    that fixes a histology specimen denatures a gastric mucosa, haptenates a
    self protein, and crosslinks DNA to protein.
  biological_processes:
  - preferred_term: peptide cross-linking
    modifier: INCREASED
    term:
      id: GO:0018149
      label: peptide cross-linking
  downstream:
  - target: Protein coagulation and tissue fixation
    description: Crosslinked structural proteins lose their native conformation and function.
  - target: DNA-protein and interstrand crosslink formation
    description: Adduction of DNA bases and adjacent proteins produces covalent DNA lesions.
  - target: Haptenation and type IV sensitization
    description: Covalent modification of self proteins creates neoantigenic hapten-carrier complexes.
  evidence:
  - reference: PMID:40480196
    reference_title: "Emerging mechanisms underlying formaldehyde toxicity and response."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It rapidly reacts with electron-rich groups in biomolecules like nucleic acids and proteins, leading to cellular damage."
    explanation: >-
      States the shared electrophilic chemistry that produces both the protein
      and the nucleic acid arms of the injury.
  - reference: PMID:30701286
    reference_title: "Evaluation of inhaled low-dose formaldehyde-induced DNA adducts and DNA-protein cross-links by liquid chromatography-tandem mass spectrometry."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The aldehyde moiety tends to react with nucleophilic sites in proteins and DNA, resulting in a number of DNA and protein adducts"
    explanation: >-
      Specifies the aldehyde-nucleophile chemistry and the adduct products that
      follow from it.
- name: Trigeminal sensory irritation
  biological_scale: TISSUE
  description: >-
    Formaldehyde at the ocular and upper-airway surface activates trigeminal
    nerve endings, triggering a reflex cascade of eyeblink, lacrimation,
    rhinorrhoea, and cough. This is the lowest-threshold effect of formaldehyde
    and the endpoint on which most occupational exposure limits are set. The
    early stages are fully reversible; sustained or high exposure carries the
    pathway into neurogenic inflammation and then tissue damage, which is where
    it converges with the cytotoxic arm.
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Nasal and upper airway epithelial cytotoxicity
    description: >-
      Prolonged or high-concentration stimulation progresses from reversible
      reflex irritation to neurogenic inflammation and epithelial damage.
  evidence:
  - reference: PMID:25182421
    reference_title: "Sensory irritation as a basis for setting occupational exposure limits."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "pathway is initiated by the interaction of local irritants with receptors of the nervous system (e.g., trigeminal nerve endings) and a downstream cascade of reflexes and defense mechanisms (e.g., eyeblinks, coughing)"
    explanation: >-
      Describes the sensory-irritation pathway that this node models, with
      formaldehyde as one of the three index substances in the analysis.
  - reference: PMID:25182421
    reference_title: "Sensory irritation as a basis for setting occupational exposure limits."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While the first stages of this pathway are thought to be completely reversible, high or prolonged exposure can lead to neurogenic inflammation and subsequently tissue damage."
    explanation: >-
      Supports the reversibility of the early node and the downstream edge to
      epithelial injury at higher or sustained exposure.
- name: Protein coagulation and tissue fixation
  biological_scale: TISSUE
  description: >-
    Extensive crosslinking of structural and enzymatic proteins denatures and
    coagulates them in situ. In the gastrointestinal tract after formalin
    ingestion this is visible at autopsy as literal tissue fixation - the mucosa
    and adjacent organs acquire the rigid, preserved morphology of a specimen.
    Coagulated cellular protein cannot carry out its normal function, so the
    tissue is killed rather than merely injured.
  cell_types:
  - preferred_term: epithelial cell of alimentary canal
    term:
      id: CL:0002251
      label: epithelial cell of alimentary canal
  downstream:
  - target: Coagulative mucosal necrosis and ulceration
    description: Fixed, non-functional tissue undergoes coagulative necrosis with mucosal breakdown.
  - target: Acute circulatory collapse and multiorgan failure
    description: >-
      A proposed direct route in which intravascular fixation of blood
      precipitates acute circulatory failure; curated under an emerging
      hypothesis group, not as established mechanism.
    hypothesis_groups:
    - intravascular_blood_fixation
  evidence:
  - reference: PMID:35394178
    reference_title: "A fatal case of accidental oral formaldehyde poisoning and its pathomorphological characteristics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the mechanism of death from formaldehyde poisoning is that it rapidly causes coagulation of tissue cell protein, which may lose its normal function"
    explanation: >-
      States protein coagulation with loss of function as the established
      mechanism of tissue injury after formaldehyde ingestion.
  - reference: PMID:35394178
    reference_title: "A fatal case of accidental oral formaldehyde poisoning and its pathomorphological characteristics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Anatomical examination revealed fixed tissue morphology of the stomach and adjacent organs."
    explanation: >-
      Direct autopsy observation of in-situ tissue fixation in the stomach,
      grounding this node in a human finding rather than in analogy.
- name: Coagulative mucosal necrosis and ulceration
  biological_scale: TISSUE
  description: >-
    Killed mucosa sloughs, producing ulceration, haemorrhage, and - with
    full-thickness injury - perforation and peritonitis. The stomach bears the
    worst of it after ingestion. Loss of the mucosal barrier is also the route
    by which formaldehyde and its metabolites enter the circulation in quantity.
  downstream:
  - target: Systemic absorption and glutathione-dependent oxidation to formate
    description: A denuded, hyperaemic mucosal surface permits large-scale systemic absorption.
  - target: Fibrotic stricture formation
    description: Deep injury heals by granulation and fibrosis rather than by regeneration.
  evidence:
  - reference: PMID:10962510
    reference_title: "Toxicity of ingested formalin and its management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ingestion can lead to immediate deleterious effects on almost all systems of the body including gastrointestinal tract, central nervous system, cardiovascular system and hepato-renal system, causing gastrointestinal hemorrhage, cardiovascular collapse, unconsciousness or convulsions, severe metabolic acidosis and acute respiratory distress syndrome."
    explanation: >-
      Supports gastrointestinal haemorrhage as a consequence of the corrosive
      mucosal injury, alongside the systemic effects it precedes.
- name: Fibrotic stricture formation
  biological_scale: TISSUE
  conforms_to: "fibrotic_response#Architectural Distortion and Organ Dysfunction"
  description: >-
    Corrosive injury that reaches beyond the mucosa does not regenerate; it
    heals by granulation and collagen deposition, and the scar contracts.
    Weeks after the acute episode this presents as oesophageal stricture and
    gastric outlet obstruction, often requiring repeated endoscopic dilation.
    This is the arm of the disease that persists in survivors, and it follows
    the conserved fibrotic-response pattern of injury to architectural
    distortion rather than anything formaldehyde-specific.
  notes: >-
    The stricture arm is asserted here on the general corrosive-ingestion
    literature and on the depth of injury documented in formaldehyde cases; no
    formaldehyde-specific cohort quantifies stricture incidence, so no
    frequency is curated for the corresponding phenotype.
  downstream:
  - target: Acute circulatory collapse and multiorgan failure
    description: >-
      Full-thickness necrosis progressing to perforation contributes to shock
      and multiorgan failure in the acute phase, before any fibrotic healing.
  evidence:
  - reference: PMID:10962510
    reference_title: "Toxicity of ingested formalin and its management."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Formalin is irritating, corrosive and toxic and absorbed from all surfaces of the body."
    explanation: >-
      Establishes the corrosive character of the injury that heals by fibrosis;
      it does not itself document stricture, so this is recorded as partial
      support.
- name: Systemic absorption and glutathione-dependent oxidation to formate
  biological_scale: MOLECULAR
  description: >-
    Absorbed formaldehyde conjugates spontaneously with glutathione to
    S-hydroxymethylglutathione, which ADH5 (alcohol dehydrogenase 5, also called
    formaldehyde dehydrogenase or GSNOR) oxidizes to S-formylglutathione;
    hydrolysis then releases formate. ALDH2 provides a mitochondrial backup arm.
    This is a normal, high-capacity clearance route, not a bioactivation step -
    formaldehyde's blood half-life is very short and the pathway even feeds
    one-carbon metabolism. Toxicity is a capacity-overflow phenomenon: the
    problem is the size of the bolus, not the existence of the pathway. Note the
    contrast with methanol poisoning, where formaldehyde is the intermediate
    being made rather than the poison being cleared.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: formaldehyde catabolic process
    modifier: INCREASED
    term:
      id: GO:0046294
      label: formaldehyde catabolic process
  - preferred_term: glutathione metabolic process
    modifier: INCREASED
    term:
      id: GO:0006749
      label: glutathione metabolic process
  molecular_functions:
  - preferred_term: S-(hydroxymethyl)glutathione dehydrogenase activity
    modifier: INCREASED
    term:
      id: GO:0051903
      label: S-(hydroxymethyl)glutathione dehydrogenase [NAD(P)+] activity
  downstream:
  - target: Formate accumulation and high anion gap metabolic acidosis
    description: Formate produced faster than folate-dependent clearance can dispose of it accumulates.
  evidence:
  - reference: PMID:33355142
    reference_title: "Digenic mutations in ALDH2 and ADH5 impair formaldehyde clearance and cause a multisystem disorder, AMeD syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "alcohol dehydrogenase 5 (also known as formaldehyde dehydrogenase or S-nitrosoglutathione reductase, ADH5/FDH/GSNOR) is the principal enzyme converting formaldehyde to formic acid in a glutathione-dependent manner"
    explanation: >-
      Identifies ADH5 as the principal glutathione-dependent enzyme converting
      formaldehyde to formate, which is the chemistry of this node.
  - reference: PMID:33512438
    reference_title: "Analysis of disease model iPSCs derived from patients with a novel Fanconi anemia-like IBMFS ADH5/ALDH2 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that ADH5 is the primary defense against formaldehyde, and ALDH2 provides a backup."
    explanation: >-
      Establishes the two-tier structure of the clearance pathway, with ADH5
      primary and ALDH2 as the backup arm.
  - reference: PMID:28813411
    reference_title: "Mammals divert endogenous genotoxic formaldehyde into one-carbon metabolism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, we find that formaldehyde detoxification in human cells generates formate, and thereby promotes nucleotide synthesis."
    explanation: >-
      Confirms formate as the product of human formaldehyde detoxification and
      supports the framing of this route as physiological rather than
      bioactivating.
- name: Formate accumulation and high anion gap metabolic acidosis
  biological_scale: ORGANISM
  description: >-
    Formate is eliminated slowly, by a saturable folate-dependent route, so a
    large formaldehyde load produces formate faster than it can be disposed of.
    Accumulated formate is an unmeasured anion and drives a severe
    high-anion-gap metabolic acidosis; it also inhibits mitochondrial cytochrome
    c oxidase, producing histotoxic hypoxia and lactate that widens the gap
    further. This is the same terminal chemistry as methanol poisoning, which
    matters clinically because commercial formalin is stabilized with methanol
    and the two toxidromes arrive together.
  biological_processes:
  - preferred_term: formate metabolic process
    modifier: INCREASED
    term:
      id: GO:0015942
      label: formate metabolic process
  molecular_functions:
  - preferred_term: cytochrome-c oxidase activity
    modifier: DECREASED
    term:
      id: GO:0004129
      label: cytochrome-c oxidase activity
  notes: >-
    The cytochrome c oxidase inhibition step is carried over from the shared
    formate chemistry established in methanol poisoning; no
    formaldehyde-specific publication measuring complex IV inhibition was
    identified during this curation, so no evidence item is attached to that
    claim here.
  downstream:
  - target: Acute circulatory collapse and multiorgan failure
    description: >-
      Uncorrected severe acidosis and impaired oxidative phosphorylation
      precipitate shock and organ failure.
  evidence:
  - reference: PMID:10962510
    reference_title: "Toxicity of ingested formalin and its management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ingestion can lead to immediate deleterious effects on almost all systems of the body including gastrointestinal tract, central nervous system, cardiovascular system and hepato-renal system, causing gastrointestinal hemorrhage, cardiovascular collapse, unconsciousness or convulsions, severe metabolic acidosis and acute respiratory distress syndrome."
    explanation: >-
      Places severe metabolic acidosis among the immediate systemic consequences
      of formalin ingestion.
- name: Acute circulatory collapse and multiorgan failure
  biological_scale: ORGANISM
  description: >-
    The terminal common pathway of substantial ingestion: distributive and
    hypovolaemic shock from massive mucosal injury, compounded by refractory
    acidosis and histotoxic hypoxia, producing cardiovascular collapse, CNS
    depression, acute kidney injury, hepatic injury, and acute respiratory
    distress syndrome. Death typically follows within hours to days.
  evidence:
  - reference: PMID:23640147
    reference_title: "Homicidal acute formalin poisoning in an infant from a rural sericulture family presenting with multisystem failure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite proper supportive treatment in the absence of antidote, the infant died within 13 hours after deliberate poisoning."
    explanation: >-
      Documents the fulminant multisystem course and the hours-scale time to
      death in a human case of formalin ingestion.
- name: Nasal and upper airway epithelial cytotoxicity
  biological_scale: TISSUE
  description: >-
    Above the irritant threshold, formaldehyde kills the epithelium it contacts.
    In the chronic rodent inhalation bioassay this appears as rhinitis,
    epithelial dysplasia, and squamous metaplasia, strictly confined to the
    nasal cavity and proximal trachea and graded by concentration. There is a
    sharp transition rather than a smooth ramp: at or below about 2 ppm the
    changes are minimal and reversible, while at 6 ppm and above there is
    persistent epithelial necrosis.
  cell_types:
  - preferred_term: nasopharyngeal epithelial cell
    term:
      id: CL:1001573
      label: nasopharyngeal epithelial cell
  biological_processes:
  - preferred_term: apoptotic process
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  downstream:
  - target: Regenerative epithelial proliferation and dysplasia
    description: Sustained epithelial killing drives compensatory proliferation of the surviving basal population.
  evidence:
  - reference: PMID:6871871
    reference_title: "Carcinogenicity of formaldehyde in rats and mice after long-term inhalation exposure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Significant formaldehyde-induced lesions were restricted to the nasal cavity and proximal trachea."
    explanation: >-
      The strongest available demonstration that formaldehyde injury is confined
      to the portal of entry, from the canonical two-year inhalation bioassay.
  - reference: PMID:6871871
    reference_title: "Carcinogenicity of formaldehyde in rats and mice after long-term inhalation exposure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Rhinitis, epithelial dysplasia, and squamous metaplasia occurred in all exposure groups of rats and in the intermediate and high exposure groups of mice."
    explanation: >-
      Documents the specific epithelial lesions modelled by this node and their
      concentration dependence.
  - reference: PMID:42101931
    reference_title: "The formaldehyde dispute - Part A: acute and chronic inhalation toxicity and the evolution of scientific knowledge."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "whereas exposures ≥6 ppm were associated with persistent epithelial necrosis, regenerative proliferation, and nasal squamous cell carcinomas localized to regions of highest vapor flux in the rat nasal cavity"
    explanation: >-
      Gives the concentration threshold at which reversible adaptive change
      becomes sustained cytotoxic injury. The quoted finding is from the rat
      nasal cavity, hence MODEL_ORGANISM.
- name: DNA-protein and interstrand crosslink formation
  biological_scale: MOLECULAR
  description: >-
    Formaldehyde reacting with DNA yields N2-hydroxymethyl-deoxyguanosine
    mono-adducts, DNA-DNA interstrand crosslinks, and - characteristically -
    covalent DNA-protein crosslinks. These lesions block replication fork
    progression and transcription, and they are the reason formaldehyde is
    genotoxic without requiring metabolic activation. This is also the point at
    which exogenous exposure joins a substantial endogenous background:
    formaldehyde is a normal product of histone and nucleic acid demethylation,
    so every cell already carries these adducts.
  biological_processes:
  - preferred_term: DNA damage response
    modifier: INCREASED
    term:
      id: GO:0006974
      label: DNA damage response
  - preferred_term: interstrand cross-link repair
    modifier: INCREASED
    term:
      id: GO:0036297
      label: interstrand cross-link repair
  downstream:
  - target: Saturation of crosslink repair capacity
    description: Lesions accumulate faster than the crosslink repair machinery can resolve them.
  evidence:
  - reference: PMID:33355142
    reference_title: "Digenic mutations in ALDH2 and ADH5 impair formaldehyde clearance and cause a multisystem disorder, AMeD syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Aldehydes primarily produce DNA interstrand cross-links (ICL) and nonenzymatic DNA-protein cross-links (DPC)."
    explanation: >-
      Names the two lesion classes this node models and their non-enzymatic
      origin.
  - reference: PMID:26412304
    reference_title: "Endogenous Formaldehyde Is a Hematopoietic Stem Cell Genotoxin and Metabolic Carcinogen."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Endogenous formaldehyde is produced by numerous biochemical pathways fundamental to life, and it can crosslink both DNA and proteins."
    explanation: >-
      Establishes both the crosslinking capability and the endogenous background
      against which exogenous exposure is superimposed.
- name: Saturation of crosslink repair capacity
  biological_scale: CELLULAR
  conforms_to: "genome_instability_mutation#Failure of DNA Damage Surveillance and Repair"
  description: >-
    Formaldehyde-induced crosslinks are resolved by the Fanconi anaemia
    interstrand-crosslink pathway, with FANCD2 as a central node, and by
    DNA-protein-crosslink proteolysis. These systems have finite throughput.
    When the aldehyde burden outruns them, damage persists into replication -
    the injury is not a poisoned enzyme but an exceeded repair budget. This is
    the mechanistic hinge on which both the local carcinogenesis arm and the
    contested haematopoietic arm turn.
  biological_processes:
  - preferred_term: DNA repair
    modifier: DECREASED
    term:
      id: GO:0006281
      label: DNA repair
  downstream:
  - target: Regenerative epithelial proliferation and dysplasia
    description: Unrepaired lesions are fixed as mutations in a proliferating epithelial field.
    hypothesis_groups:
    - portal_of_entry_genotoxicity
  - target: Haematopoietic stem cell genotoxic attrition
    description: >-
      Persistent crosslink damage in haematopoietic stem cells depletes the
      pool; demonstrated for endogenous formaldehyde in genetic models, and
      proposed but not established as a route from inhalational exposure.
    hypothesis_groups:
    - systemic_haematopoietic_genotoxicity
  evidence:
  - reference: PMID:26412304
    reference_title: "Endogenous Formaldehyde Is a Hematopoietic Stem Cell Genotoxin and Metabolic Carcinogen."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The repair of this damage is mediated by FANCD2, a DNA crosslink repair protein."
    explanation: >-
      Identifies the crosslink repair pathway that this node models as being
      saturable by formaldehyde damage.
  - reference: PMID:33355142
    reference_title: "Digenic mutations in ALDH2 and ADH5 impair formaldehyde clearance and cause a multisystem disorder, AMeD syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our results suggest that the combined deficiency of formaldehyde clearance mechanisms leads to the complex clinical features due to overload of formaldehyde-induced DNA damage, thereby saturation of DNA repair processes"
    explanation: >-
      States the capacity-overflow framing explicitly - disease follows when the
      formaldehyde burden saturates DNA repair.
- name: Regenerative epithelial proliferation and dysplasia
  biological_scale: TISSUE
  description: >-
    Sustained cytotoxicity forces the surviving basal epithelium into continuous
    replacement proliferation. A proliferating field is exactly where unrepaired
    crosslink damage becomes fixed mutation, and the combination of chronic cell
    killing, regenerative division, and local genotoxicity is the accepted mode
    of action for formaldehyde's nasal carcinogenicity. Crucially, the
    non-neoplastic changes regress when exposure stops - it is only the
    carcinoma that does not.
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  downstream:
  - target: Upper airway squamous cell carcinoma
    description: Mutations fixed in a chronically proliferating dysplastic field progress to carcinoma.
    hypothesis_groups:
    - portal_of_entry_genotoxicity
  evidence:
  - reference: PMID:42101931
    reference_title: "The formaldehyde dispute - Part A: acute and chronic inhalation toxicity and the evolution of scientific knowledge."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Computational dosimetry, DNA-protein crosslink kinetics, and biologically based dose-response (BBDR) modeling indicated that these outcomes arose from localized tissue injury rather than from cumulative systemic dose."
    explanation: >-
      Supports localized cytotoxic injury with regenerative proliferation, not
      cumulative systemic dose, as the mode of action for the tumour outcome.
      The inference is drawn from dosimetry and BBDR modelling, hence
      COMPUTATIONAL.
  - reference: PMID:6871871
    reference_title: "Carcinogenicity of formaldehyde in rats and mice after long-term inhalation exposure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "There was regression of rhinitis, dysplasia, and metaplasia at 27 months (3 months postexposure) in the 14.3- and 5.6-ppm groups of mice and in the 2.0- and 5.6-ppm groups of rats."
    explanation: >-
      Demonstrates that the proliferative and dysplastic changes at this node
      are reversible on withdrawal of exposure, unlike the carcinoma downstream
      of them.
- name: Upper airway squamous cell carcinoma
  biological_scale: TISSUE
  description: >-
    The best-anchored malignant endpoint. Squamous cell carcinoma arises at the
    site of maximal vapour flux - the anterior nasal cavity in the rat, the
    nasopharynx in exposed humans - and only in the setting of long-term
    exposure at concentrations that produce sustained cytotoxicity. Human
    epidemiology is not unanimous: the large NCI industrial cohort continues to
    show a nasopharyngeal cancer excess, while an equally large British chemical
    worker cohort found none.
  cell_types:
  - preferred_term: nasopharyngeal epithelial cell
    term:
      id: CL:1001573
      label: nasopharyngeal epithelial cell
  evidence:
  - reference: PMID:6871871
    reference_title: "Carcinogenicity of formaldehyde in rats and mice after long-term inhalation exposure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Squamous cell carcinomas were observed in the nasal cavities of 103 rats (52 females and 51 males) and 2 male mice exposed to 14.3 ppm and in 2 rats (one male and one female) exposed to 5.6 ppm of formaldehyde gas."
    explanation: >-
      The primary animal demonstration of nasal squamous cell carcinoma, with
      the steep concentration dependence and the large species difference.
  - reference: PMID:23788167
    reference_title: "Mortality from solid tumors among workers in formaldehyde industries: an update of the NCI cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consistent with previous analyses of this cohort, this update continues to suggest a link between formaldehyde exposure and nasopharyngeal cancer."
    explanation: >-
      Human cohort support for the nasopharyngeal carcinoma endpoint, from the
      largest industrial cohort followed through 2004.
  - reference: PMID:24714728
    reference_title: "Upper airway cancer, myeloid leukemia, and other cancers in a cohort of British chemical workers exposed to formaldehyde."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results provide no support for an increased hazard of myeloid leukemia, nasopharyngeal carcinoma, or other upper airway tumors from formaldehyde exposure."
    explanation: >-
      A comparably large human cohort finding no upper-airway cancer excess,
      recorded so the disagreement between the two cohorts is visible rather
      than resolved by selection.
- name: Haematopoietic stem cell genotoxic attrition
  biological_scale: CELLULAR
  description: >-
    Persistent formaldehyde-crosslink damage in haematopoietic stem cells
    impairs their differentiation and self-renewal and depletes the pool,
    ultimately producing marrow failure and leukaemic clonal evolution. This is
    firmly established for endogenous formaldehyde, in mice lacking clearance or
    repair and in humans with inherited clearance failure. Whether inhaled
    formaldehyde reaches the marrow in sufficient quantity to do the same is the
    contested question behind the IARC leukaemia classification, and is
    deliberately curated here under the alternative hypothesis rather than
    asserted.
  cell_types:
  - preferred_term: hematopoietic stem cell
    term:
      id: CL:0000037
      label: hematopoietic stem cell
  biological_processes:
  - preferred_term: apoptotic process
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  evidence:
  - reference: PMID:26412304
    reference_title: "Endogenous Formaldehyde Is a Hematopoietic Stem Cell Genotoxin and Metabolic Carcinogen."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Adh5(-/-)Fancd2(-/-) mice reveal an essential requirement for these protection mechanisms in hematopoietic stem cells (HSCs), leading to their depletion and precipitating bone marrow failure."
    explanation: >-
      Demonstrates stem cell depletion and marrow failure from formaldehyde
      damage in a genetic mouse model; supports the mechanism, not the
      inhalational route.
  - reference: PMID:33355142
    reference_title: "Digenic mutations in ALDH2 and ADH5 impair formaldehyde clearance and cause a multisystem disorder, AMeD syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cellular studies revealed that a decrease in the formaldehyde tolerance underlies a loss of differentiation and proliferation capacity of hematopoietic stem cells."
    explanation: >-
      Human cellular evidence that reduced formaldehyde tolerance costs
      haematopoietic stem cells their differentiation and proliferation
      capacity.
  - reference: PMID:30701286
    reference_title: "Evaluation of inhaled low-dose formaldehyde-induced DNA adducts and DNA-protein cross-links by liquid chromatography-tandem mass spectrometry."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: "Moreover, formaldehyde exposure at 1, 30 and 300 ppb did not alter the levels of endogenous formaldehyde-induced DNA adducts or DNA-protein crosslinks."
    explanation: >-
      Argues against low-dose inhaled formaldehyde reaching any tissue as
      genotoxic burden, which is the principal objection to reaching this node
      by the inhalational route.
- name: Haptenation and type IV sensitization
  biological_scale: CELLULAR
  description: >-
    Formaldehyde penetrating skin or airway epithelium covalently modifies self
    proteins, creating hapten-carrier complexes that dendritic cells take up and
    present. Hapten-specific T cells are primed, and on re-exposure mount a
    delayed-type hypersensitivity response - allergic contact dermatitis in
    skin. Sensitization is durable: it does not remit with exposure reduction,
    only with avoidance. Formaldehyde-releasing preservatives are a major and
    often unrecognized source, since a product need not list formaldehyde to
    deliver it.
  cell_types:
  - preferred_term: dendritic cell
    term:
      id: CL:0000451
      label: dendritic cell
  - preferred_term: CD8-positive, alpha-beta T cell
    term:
      id: CL:0000625
      label: CD8-positive, alpha-beta T cell
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  notes: >-
    The cellular steps of haptenation, dendritic cell presentation, and
    hapten-specific T cell priming are the general type IV hypersensitivity
    mechanism applied to formaldehyde; the evidence attached here establishes
    the clinical sensitization and its sources rather than measuring those
    cellular steps for formaldehyde specifically.
  evidence:
  - reference: PMID:18976378
    reference_title: "Occupational contact allergy to formaldehyde and formaldehyde releasers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Formaldehyde allergy is common and usually derives from formaldehyde-releasing biocides in cosmetic and other products."
    explanation: >-
      Supports formaldehyde sensitization as a common clinical entity and names
      formaldehyde releasers as the usual source.
  - reference: PMID:18976378
    reference_title: "Occupational contact allergy to formaldehyde and formaldehyde releasers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reactions to formaldehyde-releasing compounds were seen in 79% of the formaldehyde-allergic patients."
    explanation: >-
      Quantifies cross-reactivity to releasers among sensitized patients,
      supporting the shared haptenation mechanism.
- name: Erythrocyte oxidant injury
  biological_scale: CELLULAR
  description: >-
    A route-specific arm seen when formaldehyde reaches erythrocytes directly in
    the circulation rather than at a mucosal surface - classically iatrogenic
    contamination of dialysate, where residual formalin sterilant is delivered
    intravascularly. Formalin acts as a direct oxidant on red cells, producing
    acute intravascular haemolysis. The route matters: this does not follow from
    inhalational exposure.
  biological_processes:
  - preferred_term: response to oxidative stress
    modifier: INCREASED
    term:
      id: GO:0006979
      label: response to oxidative stress
  evidence:
  - reference: PMID:6705281
    reference_title: "Acute intravascular hemolysis due to accidental formalin intoxication during hemodialysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A patient accidentally exposed to formalin during hemodialysis developed acute intravascular hemolysis."
    explanation: >-
      Documents acute intravascular haemolysis after intravascular formalin
      exposure in a human patient.
  - reference: PMID:6705281

    evidence:
    - reference: PMID:39828805
      reference_title: "Formaldehyde and asthma: a plausibility?"
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Typical indoor FA concentrations in public buildings and homes are far below a threshold for sensory irritation in the upper airways, based on controlled human exposure studies, to induce sensory-irritative sensitization nor inflammatory epithelial damage in the airways."
      explanation: >-
        States that typical indoor concentrations fall below the irritation
        threshold, which is why this exposure is curated as modulating total
        dose rather than as a trigger.
- name: Iatrogenic intravascular formalin exposure during hemodialysis
  exposure_term:
    preferred_term: exposure to formaldehyde
    term:
      id: ECTO:0000439
      label: exposure to formaldehyde
  description: >-
    Formalin is used to sterilize dialysis equipment, and residual sterilant
    reaching the extracorporeal circuit delivers formaldehyde straight into the
    bloodstream. This is the one route that bypasses the portal-of-entry
    scrubbing entirely, which is why it produces a haematological injury that
    inhalation does not.
  evidence:
  - reference: PMID:6705281
    reference_title: "Acute intravascular hemolysis due to accidental formalin intoxication during hemodialysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Formalin intoxication should be recognized as a cause of acute hemolysis during hemodialysis and is not invariably fatal, provided further exposure is stopped in time and the complications prevented."
    explanation: >-
      Identifies accidental formalin exposure during haemodialysis as a
      recognized exposure route, and notes it is survivable if exposure stops.
  influences_mechanisms:
  - target: Erythrocyte oxidant injury
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Formalin delivered into the extracorporeal blood circuit contacts
      erythrocytes directly and acts on them as an oxidant.
    evidence:
    - reference: PMID:6705281
      reference_title: "Acute intravascular hemolysis due to accidental formalin intoxication during hemodialysis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In vitro study showed that formalin has direct oxidant action on red blood cells."
      explanation: >-
        Establishes the direct oxidant action on erythrocytes that this exposure
        route triggers.
- name: Dermal contact with formaldehyde and formaldehyde-releasing preservatives
  exposure_term:
    preferred_term: exposure to formaldehyde
    term:
      id: ECTO:0000439
      label: exposure to formaldehyde
  description: >-
    Metalworking fluids, protective creams, detergents, liquid soaps, and
    cosmetics preserved with formaldehyde releasers such as quaternium-15 and
    DMDM hydantoin deliver repeated low-level skin exposure. A product need not
    declare formaldehyde to deliver it, which is why releaser allergy is often
    missed.
  evidence:
  - reference: PMID:18976378
    reference_title: "Occupational contact allergy to formaldehyde and formaldehyde releasers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exposure to formaldehyde-releasing preservatives in liquid soaps and other rinse-off products was common in both occupational and non-occupational cases."
    explanation: >-
      Documents formaldehyde-releasing preservatives in everyday products as a
      common dermal exposure source.
  influences_mechanisms:
  - target: Haptenation and type IV sensitization
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Repeated skin contact allows formaldehyde to penetrate the epidermis and
      covalently modify self proteins, priming a hapten-specific T cell
      response.
    evidence:
    - reference: PMID:18976378
      reference_title: "Occupational contact allergy to formaldehyde and formaldehyde releasers."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The most common source of occupational sensitization was metalworking fluids followed by creams and related products."
      explanation: >-
        Identifies the dermal exposures that produce documented occupational
        sensitization.
treatments:
- name: Supportive multiorgan care
  description: >-
    There is no antidote for formaldehyde. Management is supportive care of each
    affected organ system: airway protection with early intubation for laryngeal
    oedema, aggressive fluid resuscitation and vasopressors for shock, and
    ventilatory support. Emesis must not be induced and chemical neutralization
    must not be attempted - both re-expose the oesophagus, and neutralization is
    exothermic.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Acute circulatory collapse and multiorgan failure
    treatment_effect: MODULATES
    description: >-
      Organ support sustains perfusion and gas exchange while the toxic insult
      is cleared; it does not act on the chemistry upstream of this node.
  evidence:
  - reference: PMID:10962510
    reference_title: "Toxicity of ingested formalin and its management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No specific antidote is available. Treatment of toxicity is supportive care of the various organ systems."
    explanation: >-
      States directly that no antidote exists and that supportive organ care is
      the treatment.
- name: Hemodialysis
  description: >-
    Extracorporeal removal is the key intervention in severe poisoning. It
    clears formate, corrects the acidosis, and simultaneously removes the
    methanol that stabilizes commercial formalin. The threshold for starting it
    should be low in a patient with severe high-anion-gap acidosis after
    formalin ingestion.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hemodialysis
    term:
      id: NCIT:C15248
      label: Hemodialysis
  target_mechanisms:
  - target: Formate accumulation and high anion gap metabolic acidosis
    treatment_effect: INHIBITS
    description: Dialysis removes accumulated formate and corrects the acidosis it drives.
  notes: >-
    Curated on mechanistic grounds shared with methanol poisoning, where
    haemodialysis for formate is standard. No formaldehyde-specific trial
    evidence exists and none plausibly could, so no efficacy claim is made here
    and no evidence item is attached.
- name: Sodium bicarbonate
  description: >-
    Intravenous sodium bicarbonate is given to correct the severe metabolic
    acidosis, buying time while formate is cleared. It treats the consequence,
    not the cause.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: sodium bicarbonate
      term:
        id: CHEBI:32139
        label: sodium hydrogencarbonate
  target_mechanisms:
  - target: Formate accumulation and high anion gap metabolic acidosis
    treatment_effect: MODULATES
    description: >-
      Buffering counteracts the acidaemia produced by accumulated formate
      without removing the formate itself.
  notes: >-
    Standard supportive management for the acidosis of toxic-alcohol and
    aldehyde poisoning; no formaldehyde-specific efficacy publication was
    identified, so no evidence item is attached.
- name: Folinic acid
  description: >-
    Folinic acid supplies the reduced folate cofactor for
    10-formyltetrahydrofolate dehydrogenase, the rate-limiting step in
    converting formate to carbon dioxide, and is used to accelerate formate
    clearance by analogy with methanol poisoning. Note a genuine paradox here:
    while folinic acid is standard acute therapy, folate derivatives are
    themselves a source of formaldehyde by oxidative decomposition of the folate
    backbone, and folate supplementation is cytotoxic to cells that cannot
    detoxify formaldehyde. The two situations are not the same, but the tension
    is worth knowing.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: folinic acid
      term:
        id: CHEBI:63606
        label: (6S)-5-formyltetrahydrofolic acid
  target_mechanisms:
  - target: Formate accumulation and high anion gap metabolic acidosis
    treatment_effect: INHIBITS
    description: Folinic acid accelerates folate-dependent oxidation of formate to carbon dioxide.
  evidence:
  - reference: PMID:28813411
    reference_title: "Mammals divert endogenous genotoxic formaldehyde into one-carbon metabolism."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Here we show that supplementation with tetrahydrofolate, the essential cofactor of this cycle, and other oxidation-prone folate derivatives kills human, mouse and chicken cells that cannot detoxify formaldehyde or that lack DNA crosslink repair."
    explanation: >-
      Cited for the caveat rather than the indication: folate supplementation is
      cytotoxic in clearance-deficient cells, which qualifies the enthusiasm for
      folate rescue in this setting.
- name: Fomepizole
  description: >-
    Fomepizole inhibits alcohol dehydrogenase and is indicated ONLY when there
    is significant methanol co-ingestion, which is common because commercial
    formalin is stabilized with 10-15% methanol. It does not treat formaldehyde
    itself: formaldehyde is already downstream of the alcohol dehydrogenase
    step, so blocking that enzyme does nothing to the formaldehyde already
    present. This distinction is easy to get backwards and matters clinically.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: fomepizole
      term:
        id: CHEBI:5141
        label: fomepizole
  notes: >-
    Deliberately carries no target_mechanisms link in this entry: fomepizole
    acts on the methanol arm of a co-ingestion, not on any node of the
    formaldehyde pathograph. Wiring it to a formaldehyde node would assert
    exactly the error the description warns against.
- name: Removal from exposure
  description: >-
    For the inhalational irritant syndrome and for occupational asthma and
    contact dermatitis, removal from exposure is the definitive intervention.
    The sensory irritation reflex arm is fully reversible in its early stages,
    and the non-neoplastic epithelial changes of chronic exposure regress once
    exposure stops - although carcinoma, once established, does not.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Nasal and upper airway epithelial cytotoxicity
    treatment_effect: INHIBITS
    description: >-
      Ending exposure removes the driver of epithelial killing and permits
      regression of the non-neoplastic lesions.
  evidence:
  - reference: PMID:6871871
    reference_title: "Carcinogenicity of formaldehyde in rats and mice after long-term inhalation exposure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "There was regression of rhinitis, dysplasia, and metaplasia at 27 months (3 months postexposure) in the 14.3- and 5.6-ppm groups of mice and in the 2.0- and 5.6-ppm groups of rats."
    explanation: >-
      Demonstrates regression of the non-neoplastic epithelial lesions after
      exposure ends, which is the mechanistic basis for removal from exposure.
- name: Bronchodilator therapy
  description: >-
    Inhaled beta-2 agonists are used for bronchospasm after high-concentration
    inhalational exposure, alongside humidified oxygen and observation for
    delayed pulmonary oedema.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: albuterol
      term:
        id: CHEBI:2549
        label: albuterol
  notes: >-
    Symptomatic management carried over from general irritant-gas exposure; no
    formaldehyde-specific efficacy publication was identified, so no evidence
    item is attached.
- name: Endoscopic dilation of corrosive stricture
  description: >-
    Fibrotic oesophageal strictures and gastric outlet obstruction developing
    weeks after corrosive ingestion are managed with serial endoscopic balloon
    dilation; full-thickness necrosis or perforation requires emergency
    gastrectomy or oesophagectomy.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: endoscopic esophageal dilation
    term:
      id: NCIT:C70908
      label: Esophageal Dilation
  target_mechanisms:
  - target: Fibrotic stricture formation
    treatment_effect: RESTORES
    description: Mechanical dilation restores luminal calibre lost to fibrotic contraction.
  notes: >-
    Standard management of corrosive-ingestion strictures generally; no
    formaldehyde-specific outcome series was identified, so no evidence item is
    attached.
animal_models:
- name: F344 rat two-year formaldehyde inhalation bioassay
  species: Rat
  genotype: Wild-type Fischer 344
  publication: PMID:6871871
  description: >-
    The canonical carcinogenicity model: 0, 2.0, 5.6, and 14.3 ppm formaldehyde
    gas, 6 h/day, 5 days/week for 24 months, with up to 6 months of follow-up
    after exposure ended. It established both the portal-of-entry confinement of
    injury and the steep concentration dependence of the tumour response.
  modeled_mechanisms:
  - target: Nasal and upper airway epithelial cytotoxicity
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces concentration-graded rhinitis, epithelial dysplasia, and
      squamous metaplasia strictly confined to the nasal cavity and proximal
      trachea.
    limitations: >-
      Rats are obligate nose-breathers with high nasal deposition, whereas
      humans are oronasal breathers; the rat lesion is anterior nasal while
      human tumours cluster at the nasopharynx, so the anatomical site does not
      transfer directly.
    readouts:
    - name: Nasal epithelial dysplasia and squamous metaplasia
      target: Nasal and upper airway epithelial cytotoxicity
      direction: INCREASED
      interpretation: Histological correlate of the epithelial cytotoxicity node in this model.
      evidence:
      - reference: PMID:6871871
        reference_title: "Carcinogenicity of formaldehyde in rats and mice after long-term inhalation exposure."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Rhinitis, epithelial dysplasia, and squamous metaplasia occurred in all exposure groups of rats and in the intermediate and high exposure groups of mice."
        explanation: Reports the histological measurement behind this readout.
    - name: Regression of non-neoplastic lesions after exposure ends
      target: Nasal and upper airway epithelial cytotoxicity
      direction: RESTORED
      interpretation: Establishes that this node is reversible, unlike the carcinoma downstream of it.
      evidence:
      - reference: PMID:6871871
        reference_title: "Carcinogenicity of formaldehyde in rats and mice after long-term inhalation exposure."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "There was regression of rhinitis, dysplasia, and metaplasia at 27 months (3 months postexposure) in the 14.3- and 5.6-ppm groups of mice and in the 2.0- and 5.6-ppm groups of rats."
        explanation: Reports the post-exposure regression measurement behind this readout.
    evidence:
    - reference: PMID:6871871
      reference_title: "Carcinogenicity of formaldehyde in rats and mice after long-term inhalation exposure."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Significant formaldehyde-induced lesions were restricted to the nasal cavity and proximal trachea."
      explanation: Supports treating this bioassay as informative for portal-of-entry epithelial injury.
  - target: Upper airway squamous cell carcinoma
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Produces nasal squamous cell carcinoma, but only at concentrations that
      overwhelm local repair, and at an anatomical site that does not correspond
      to the human nasopharyngeal tumour location.
    limitations: >-
      Tumours arose only at 5.6 and 14.3 ppm, far above human occupational
      exposure, and the near-total absence of tumours in mice at the same
      concentrations shows the response is governed by species-specific nasal
      dosimetry rather than by a species-invariant dose-response.
    readouts:
    - name: Nasal squamous cell carcinoma incidence
      target: Upper airway squamous cell carcinoma
      direction: INCREASED
      interpretation: The tumour endpoint of the bioassay, with its species and concentration dependence.
      evidence:
      - reference: PMID:6871871
        reference_title: "Carcinogenicity of formaldehyde in rats and mice after long-term inhalation exposure."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Squamous cell carcinomas were observed in the nasal cavities of 103 rats (52 females and 51 males) and 2 male mice exposed to 14.3 ppm and in 2 rats (one male and one female) exposed to 5.6 ppm of formaldehyde gas."
        explanation: Reports the tumour counts by species and concentration behind this readout.
    evidence:
    - reference: PMID:6871871
      reference_title: "Carcinogenicity of formaldehyde in rats and mice after long-term inhalation exposure."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "Squamous cell carcinomas were observed in the nasal cavities of 103 rats (52 females and 51 males) and 2 male mice exposed to 14.3 ppm and in 2 rats (one male and one female) exposed to 5.6 ppm of formaldehyde gas."
      explanation: >-
        Supports the model as informative for formaldehyde carcinogenesis while
        showing the species disparity that limits direct human extrapolation.
- name: Adh5-null Fancd2-null mouse
  species: Mouse
  genotype: Adh5-/- Fancd2-/-
  publication: PMID:26412304
  description: >-
    Combined loss of formaldehyde clearance and crosslink repair, which turns
    endogenous formaldehyde into a lethal genotoxin. The reference model for the
    genotoxic arm of formaldehyde biology.
  modeled_mechanisms:
  - target: Haematopoietic stem cell genotoxic attrition
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Demonstrates that unrepaired formaldehyde crosslink damage depletes
      haematopoietic stem cells and precipitates bone marrow failure, with
      karyomegaly and dysfunction in liver and kidney as well.
    limitations: >-
      This is endogenous formaldehyde overload created by genetic ablation of
      clearance and repair, not inhalational exposure. It establishes that
      formaldehyde can do this to stem cells; it does not establish that inhaled
      formaldehyde reaches them.
    readouts:
    - name: Haematopoietic stem cell depletion and marrow failure
      target: Haematopoietic stem cell genotoxic attrition
      direction: DECREASED
      interpretation: Functional correlate of stem cell attrition in this model.
      evidence:
      - reference: PMID:26412304
        reference_title: "Endogenous Formaldehyde Is a Hematopoietic Stem Cell Genotoxin and Metabolic Carcinogen."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Adh5(-/-)Fancd2(-/-) mice reveal an essential requirement for these protection mechanisms in hematopoietic stem cells (HSCs), leading to their depletion and precipitating bone marrow failure."
        explanation: Reports the stem cell depletion measurement behind this readout.
    evidence:
    - reference: PMID:26412304
      reference_title: "Endogenous Formaldehyde Is a Hematopoietic Stem Cell Genotoxin and Metabolic Carcinogen."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Formaldehyde is therefore an important source of endogenous DNA damage that is counteracted in mammals by a conserved protection mechanism."
      explanation: >-
        Supports treating this model as informative for the formaldehyde
        genotoxicity node.
  - target: DNA-protein and interstrand crosslink formation
    relationship: MEASURES
    fidelity: HIGH
    description: >-
      Direct mass-spectrometric quantification of formaldehyde-DNA adducts in
      tissue, showing that loss of ADH5 converts formaldehyde burden into DNA
      adduct burden.
    readouts:
    - name: Formaldehyde-DNA adduct accumulation in tissue
      target: DNA-protein and interstrand crosslink formation
      direction: INCREASED
      interpretation: Molecular correlate of the adduct and crosslink node in this model.
      evidence:
      - reference: PMID:26412304
        reference_title: "Endogenous Formaldehyde Is a Hematopoietic Stem Cell Genotoxin and Metabolic Carcinogen."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Here we show that endogenous formaldehyde is removed by the enzyme alcohol dehydrogenase 5 (ADH5/GSNOR), and Adh5(-/-) mice therefore accumulate formaldehyde adducts in DNA."
        explanation: Reports the adduct measurement behind this readout.
- name: Adh5-null Aldh2 E506K knock-in mouse
  species: Mouse
  genotype: Adh5-/- Aldh2 E506K/E506K
  publication: PMID:33355142
  description: >-
    A genocopy of the two-tier human clearance failure, with the mouse
    equivalent of the human ALDH2 p.Glu504Lys allele on an Adh5-null background.
  modeled_mechanisms:
  - target: Systemic absorption and glutathione-dependent oxidation to formate
    relationship: PERTURBS
    fidelity: HIGH
    description: >-
      Ablates both tiers of the formaldehyde clearance pathway modelled by this
      node, showing what happens when its capacity is removed entirely.
    limitations: >-
      Models loss of clearance capacity rather than an exogenous formaldehyde
      load, and produces a developmental and haematopoietic syndrome that is not
      the phenotype of acute formaldehyde poisoning.
    evidence:
    - reference: PMID:33355142
      reference_title: "Digenic mutations in ALDH2 and ADH5 impair formaldehyde clearance and cause a multisystem disorder, AMeD syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Moreover, Adh5-/-Aldh2 E506K/E506K double-deficient mice recapitulated key clinical features of AMeDS, showing short life span, dwarfism, and hematopoietic failure."
      explanation: >-
        Supports the model as a faithful genetic ablation of the clearance
        pathway this node describes.
- name: Rat low-dose isotope-labelled formaldehyde inhalation
  species: Rat
  genotype: Wild-type
  publication: PMID:30701286
  description: >-
    Nose-only inhalation of isotope-labelled formaldehyde at 1, 30, and 300 ppb
    for 28 days, with mass-spectrometric discrimination of exogenous from
    endogenous DNA adducts and DNA-protein crosslinks. Designed to answer
    whether inhaled formaldehyde contributes measurable genotoxic burden at
    ambient concentrations.
  modeled_mechanisms:
  - target: DNA-protein and interstrand crosslink formation
    relationship: FAILS_TO_RECAPITULATE
    fidelity: HIGH
    description: >-
      At environmentally relevant concentrations, inhaled formaldehyde produced
      no detectable exogenous adducts in any tissue - including the nasal
      epithelium - and did not change the endogenous adduct burden. The node is
      real, but low-dose inhalation does not reach it.
    limitations: >-
      Tested only up to 300 ppb, far below the concentrations at which the
      rodent bioassay produces tumours, so this is a statement about ambient
      exposure rather than about occupational peaks or the rat carcinogenicity
      range.
    readouts:
    - name: Exogenous formaldehyde-DNA adducts and DNA-protein crosslinks
      target: DNA-protein and interstrand crosslink formation
      direction: UNCHANGED
      interpretation: >-
        A negative result at ambient concentrations, and the load-bearing
        evidence for the portal-of-entry hypothesis.
      evidence:
      - reference: PMID:30701286
        reference_title: "Evaluation of inhaled low-dose formaldehyde-induced DNA adducts and DNA-protein cross-links by liquid chromatography-tandem mass spectrometry."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Moreover, formaldehyde exposure at 1, 30 and 300 ppb did not alter the levels of endogenous formaldehyde-induced DNA adducts or DNA-protein crosslinks."
        explanation: Reports the negative adduct measurement behind this readout.
    evidence:
    - reference: PMID:30701286
      reference_title: "Evaluation of inhaled low-dose formaldehyde-induced DNA adducts and DNA-protein cross-links by liquid chromatography-tandem mass spectrometry."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our data clearly show that endogenous adducts are present in all tissues analyzed, but exogenous adducts were not detectable in any tissue samples, including the most susceptible nasal epithelium."
      explanation: >-
        Substantiates the negative claim that low-dose inhalation does not add
        to the genotoxic burden at this node.
experimental_models:
- name: ADH5/ALDH2-deficient patient-derived iPSC haematopoietic differentiation
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Induced pluripotent stem cells from patients with biallelic ADH5 variants
    plus a heterozygous ALDH2*2 allele, differentiated toward haematopoiesis,
    used to establish the hierarchy of the two clearance enzymes in a human
    genetic background.
  publication: PMID:33512438
  modeled_mechanisms:
  - target: Systemic absorption and glutathione-dependent oxidation to formate
    relationship: PERTURBS
    fidelity: HIGH
    description: >-
      Human cells with graded clearance defects establish that ADH5 is the
      primary formaldehyde defence and ALDH2 the backup, which is the two-tier
      structure this node describes.
    limitations: >-
      An in vitro differentiation system driven by endogenous formaldehyde, not
      a model of exogenous exposure; it speaks to clearance capacity rather than
      to the toxicology of a swallowed or inhaled dose.
    readouts:
    - name: Spontaneous sister chromatid exchange in patient lymphocytes
      target: Systemic absorption and glutathione-dependent oxidation to formate
      direction: INCREASED
      interpretation: >-
        A cellular readout that clearance failure translates into
        recombinational repair of formaldehyde damage; notably cell-type
        dependent, since patient fibroblasts were normal.
      evidence:
      - reference: PMID:33512438
        reference_title: "Analysis of disease model iPSCs derived from patients with a novel Fanconi anemia-like IBMFS ADH5/ALDH2 deficiency."
        supports: SUPPORT
        evidence_source: HUMAN_CLINICAL
        snippet: "Phytohemagglutinin-stimulated lymphocytes from these patients displayed highly increased numbers of spontaneous sister chromatid exchanges (SCEs), reflecting homologous recombination repair of formaldehyde damage."
        explanation: Reports the sister chromatid exchange measurement behind this readout.
    evidence:
    - reference: PMID:33512438
      reference_title: "Analysis of disease model iPSCs derived from patients with a novel Fanconi anemia-like IBMFS ADH5/ALDH2 deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We found that ADH5 is the primary defense against formaldehyde, and ALDH2 provides a backup."
      explanation: >-
        Supports the model as informative for the structure of the clearance
        pathway at this node.
differential_diagnoses:
- name: Methanol poisoning
  disease_term:
    preferred_term: methanol poisoning
    term:
      id: MONDO:0017860
      label: methanol poisoning
  distinguishing_features:
  - Shares formate accumulation, high-anion-gap acidosis, and visual loss, but lacks corrosive gastrointestinal injury
  - Distinguished by an elevated osmolal gap and detectable serum methanol
  - Frequently coexists, because commercial formalin is stabilized with 10-15% methanol
  - Fomepizole is indicated for methanol and useless against formaldehyde already formed
  description: >-
    The most important differential and also the most common co-diagnosis. In
    methanol poisoning formaldehyde is the transient intermediate being
    produced; in formaldehyde poisoning it is the poison being cleared. Both
    converge on formate.
- name: Acid or alkali caustic ingestion
  distinguishing_features:
  - Corrosive gastrointestinal injury without the disproportionate systemic acidosis of formalin
  - Alkali produces deeper liquefactive oesophageal injury; formaldehyde produces coagulative fixation
  description: >-
    Other caustic ingestions produce a similar corrosive picture but do not
    carry the systemic formate load, so the depth of acidosis is the
    discriminator.
- name: ADH5/ALDH2 deficiency (AMeD syndrome)
  distinguishing_features:
  - No exogenous exposure; disease arises from failure to clear endogenous formaldehyde
  - Childhood onset with aplastic anaemia, short stature, and intellectual disability
  - Digenic - biallelic ADH5 variants plus the heterozygous ALDH2 rs671 allele
  - Chromosome fragility testing is negative, distinguishing it from Fanconi anaemia
  description: >-
    The inherited mirror image of this entry: the same molecule, no exposure at
    all, because the drain is blocked rather than the tap left running. It is a
    separate disease entity and is not curated here, but it is the mechanistic
    anchor for the genotoxic arm of formaldehyde biology.
  evidence:
  - reference: PMID:38614309
    reference_title: "Characteristic phenotypes of ADH5/ALDH2 deficiency during childhood."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ADH5/ALDH2 deficiency is a rare inherited syndrome characterized by short stature, microcephaly, delayed mental development, and hematopoietic dysfunction and has recently been proposed as a disease paradigm."
    explanation: >-
      Defines the inherited clearance-failure syndrome and its clinical triad,
      which is what distinguishes it from exposure-driven formaldehyde
      poisoning.
discussions:
- discussion_id: formaldehyde_leukaemia_route
  prompt: >-
    Does inhaled formaldehyde reach haematopoietic stem cells in sufficient
    quantity to cause myeloid leukaemia in humans?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Haematopoietic stem cell genotoxic attrition
  rationale: >-
    IARC classifies formaldehyde as causing myeloid leukaemia, but the route is
    unexplained. Formaldehyde is consumed at the portal of entry;
    isotope-labelled inhalation finds no exogenous adducts at distant sites; no
    animal model reproduces leukaemia from inhalation; and large occupational
    cohorts disagree. The genetic models that do produce leukaemia do so through
    endogenous formaldehyde overload, which is a different exposure. Conflating
    the two is the most common error in this literature, so the systemic route
    is curated as an alternative hypothesis rather than as established
    mechanism.
  proposed_experiments:
  - experiment_id: fa_marrow_adduct_dosimetry
    name: Marrow adduct dosimetry at occupationally relevant formaldehyde concentrations
    description: >-
      Isotope-labelled formaldehyde inhalation at occupationally relevant peak
      concentrations, with adduct quantification in bone marrow rather than only
      at ambient concentrations.
  - experiment_id: fa_aldh2_stratified_cohort
    name: ALDH2 rs671-stratified occupational cohort analysis
    description: >-
      Occupational cohort analysis stratified by ALDH2 rs671 genotype, testing
      whether the clearance-deficient tail of the exposed population carries the
      excess risk if any exists.
  evidence:
  - reference: PMID:24714728
    reference_title: "Upper airway cancer, myeloid leukemia, and other cancers in a cohort of British chemical workers exposed to formaldehyde."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it remains uncertain how inhaled formaldehyde might reach haematopoietic stem cells at sufficient concentrations to induce malignancy"
    explanation: >-
      States the open dosimetric question that this discussion records.
- discussion_id: rodent_nasal_dosimetry_mismatch
  prompt: >-
    Does the rodent nasal carcinogenicity bioassay translate to human upper
    airway cancer risk, given that the two species breathe differently and
    develop tumours at different sites?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Upper airway squamous cell carcinoma
  rationale: >-
    Rats are obligate nose-breathers with high anterior nasal deposition and
    develop tumours there; humans are oronasal breathers and the epidemiological
    signal is nasopharyngeal. Mice, exposed identically, developed 2 tumours
    where rats developed 103, because they reflexively reduce minute ventilation
    on formaldehyde exposure. The mechanism transfers; the dosimetry may not,
    and the rat tumours arise only at frankly cytotoxic concentrations well
    above human occupational exposure. This is a translational validity
    question, not an absence of evidence.
  proposed_experiments:
  - experiment_id: fa_cfd_nasal_dosimetry
    name: Comparative human-rodent nasal dosimetry with site-specific adduct anchoring
    description: >-
      Computational fluid dynamics dosimetry of human versus rodent nasal and
      nasopharyngeal flux, anchored to measured site-specific adduct burden, to
      test whether the human nasopharyngeal tumour site corresponds to the
      region of highest human vapour flux.
  evidence:
  - reference: PMID:6871871
    reference_title: "Carcinogenicity of formaldehyde in rats and mice after long-term inhalation exposure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Squamous cell carcinomas were observed in the nasal cavities of 103 rats (52 females and 51 males) and 2 male mice exposed to 14.3 ppm and in 2 rats (one male and one female) exposed to 5.6 ppm of formaldehyde gas."
    explanation: >-
      Quantifies the species disparity at identical exposure that motivates this
      mismatch discussion.
- discussion_id: intravascular_blood_fixation_mechanism
  prompt: >-
    Does formaldehyde cause acute circulatory failure by fixing blood within the
    vasculature, as distinct from shock secondary to mucosal injury and
    acidosis?
  kind: EMERGING_HYPOTHESIS
  status: OPEN
  attaches_to:
  - pathophysiology#Protein coagulation and tissue fixation
  rationale: >-
    A single forensic case report proposes that rapid intravascular fixation of
    blood, rather than the conventional route through mucosal injury and
    acidosis, is the proximate mechanism of death after formaldehyde ingestion.
    It is an interesting reading of the autopsy findings, but it is one case's
    hypothesis, and it is recorded here and grouped under an explicitly emerging
    hypothesis rather than presented as settled mechanism.
  evidence:
  - reference: PMID:35394178
    reference_title: "A fatal case of accidental oral formaldehyde poisoning and its pathomorphological characteristics."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "we put forward a new viewpoint on the mechanism of death from formaldehyde poisoning in which formaldehyde causes rapid fixation of blood in the tissue, thus leading to acute circulatory disturbance"
    explanation: >-
      The authors frame this explicitly as a new viewpoint they are proposing,
      which is why it is curated as an emerging hypothesis rather than
      mechanism.
- discussion_id: aldh2_rs671_exposure_interaction
  prompt: >-
    Are ALDH2 rs671 carriers a susceptible subpopulation for occupational
    formaldehyde exposure?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#ALDH2
  rationale: >-
    ALDH2*2 is dominant-negative and carried by a very large fraction of East
    Asian populations, and it demonstrably reduces formaldehyde tolerance in the
    inherited clearance-failure syndrome. Whether it modifies risk in
    formaldehyde-exposed workers has not, as far as this curation could
    establish, been characterized epidemiologically. This is a large, cheaply
    genotyped population and a testable prediction.
  proposed_experiments:
  - experiment_id: fa_aldh2_genotype_surveillance
    name: Genotype-stratified occupational surveillance in East Asian cohorts
    description: >-
      Genotype-stratified analysis of irritant symptoms, nasal cytology, and
      cancer incidence in East Asian formaldehyde-exposed occupational cohorts.
- discussion_id: folate_paradox_in_formaldehyde_biology
  prompt: >-
    How should folate supplementation be weighed in formaldehyde poisoning,
    given that the folate backbone is itself a formaldehyde source?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - treatments#Folinic acid
  rationale: >-
    Folinic acid is used to accelerate formate clearance, by analogy with
    methanol poisoning. Yet oxidation-prone folate derivatives decompose to
    formaldehyde, and folate supplementation kills cells that cannot detoxify it
    or repair its crosslinks. The acute high-formate patient and the chronically
    clearance-deficient cell are not the same situation, but the sign of the
    effect reverses between them, and no study addresses the acute-poisoning
    case directly.
  evidence:
  - reference: PMID:28813411
    reference_title: "Mammals divert endogenous genotoxic formaldehyde into one-carbon metabolism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Notably, formaldehyde is generated from oxidative decomposition of the folate backbone."
    explanation: >-
      Establishes the folate backbone as a formaldehyde source, which is the
      basis of the paradox this discussion records.

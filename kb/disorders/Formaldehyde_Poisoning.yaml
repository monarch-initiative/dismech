    evidence:
    - reference: PMID:10962510
      reference_title: "Toxicity of ingested formalin and its management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Formalin is irritating, corrosive and toxic and absorbed from all surfaces of the body."

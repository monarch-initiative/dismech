biochemical:
- name: Serum formate
  notes: >-
    Formate is the mechanistically correct analyte in formaldehyde poisoning.
    Formaldehyde itself has a very short blood half-life and a substantial
    endogenous background, so a blood formaldehyde level is neither sensitive
    nor interpretable in a living patient; formate is what accumulates and what
    drives the acidosis. It is available at reference laboratories but is
    usually too slow to guide the first hours of management, so the anion gap
    serves as the bedside surrogate. No reference interval is curated here
    because none was sourced from a citable publication.
  presence: INCREASED
  evidence:
  - reference: PMID:28813411
    reference_title: "Mammals divert endogenous genotoxic formaldehyde into one-carbon metabolism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, we find that formaldehyde detoxification in human cells generates formate, and thereby promotes nucleotide synthesis."
    explanation: >-
      Establishes formate as the product of human formaldehyde detoxification,
      which is why it is the analyte that accumulates.
- name: Post-mortem blood and tissue formaldehyde
  notes: >-
    In the forensic setting, formaldehyde can be quantified directly in blood
    and gastric tissue and used to confirm the cause of death, with tissue
    concentrations far exceeding blood concentrations because the compound is
    consumed at the site of contact. This is a post-mortem measurement and is
    not a clinical assay for a living patient.
  presence: INCREASED
  evidence:
  - reference: PMID:35394178
    reference_title: "A fatal case of accidental oral formaldehyde poisoning and its pathomorphological characteristics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The toxicity test results showed that the concentrations of formaldehyde in the blood and gastric tissue were 36.56 mg/kg and 274.48 mg/kg, respectively"
    explanation: >-
      Reports the measured post-mortem blood and gastric tissue concentrations
      used to establish formaldehyde poisoning as the cause of death.
diagnosis:
- name: Acid-base and osmolal gap workup
  description: >-
    There is no useful clinical formaldehyde assay - blood formaldehyde is
    metabolized within minutes against a substantial endogenous background - so
    diagnosis rests on exposure history plus surrogate laboratory findings.
    Arterial blood gas and serum chemistry to establish a high anion gap is the
    diagnostic centrepiece after ingestion. An osmolal gap and a serum methanol
    level should be obtained alongside it, because commercial formalin is
    stabilized with methanol and a significant methanol co-ingestion changes
    management (it, and only it, is the indication for fomepizole).
  diagnosis_term:
    preferred_term: arterial blood gas and anion gap measurement
    term:
      id: NCIT:C217391
      label: Diagnostic Blood Gas Testing
  evidence:
  - reference: PMID:10962510
    reference_title: "Toxicity of ingested formalin and its management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ingestion can lead to immediate deleterious effects on almost all systems of the body including gastrointestinal tract, central nervous system, cardiovascular system and hepato-renal system, causing gastrointestinal hemorrhage, cardiovascular collapse, unconsciousness or convulsions, severe metabolic acidosis and acute respiratory distress syndrome."
    explanation: >-
      Establishes severe metabolic acidosis as an immediate and expected finding
      after formalin ingestion, which is what makes the acid-base workup the
      diagnostic centrepiece.
- name: Upper gastrointestinal endoscopy with injury grading
  description: >-
    Endoscopy within roughly 12-48 hours of a corrosive ingestion grades the
    depth of mucosal injury (conventionally by the Zargar scale) - early enough
    to grade, late enough for the injury to have declared itself, and before the
    tissue becomes friable enough that scoping risks perforation. The injury
    grade is the best available predictor of both stricture formation and
    mortality after corrosive ingestion, so it drives disposition and the
    intensity of stricture surveillance.
  diagnosis_term:
    preferred_term: upper gastrointestinal endoscopy
    term:
      id: NCIT:C78144
      label: Esophagogastroduodenoscopy
  notes: >-
    Evidence here is from the general corrosive-ingestion literature rather than
    a formaldehyde-specific series; no formaldehyde-only endoscopic cohort was
    identified during this curation.
  evidence:
  - reference: PMID:31643028
    reference_title: "Immediate and long-term outcome of corrosive ingestion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "High-grade esophageal mucosal injury was associated with a high risk of stricture formation (p = 0.02)."
    explanation: >-
      Quantifies the prognostic value of the endoscopic injury grade for
      stricture formation, which is why endoscopic grading is the pivotal
      diagnostic step after corrosive ingestion.
  - reference: PMID:31643028
    reference_title: "Immediate and long-term outcome of corrosive ingestion."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no relationship between the presence of symptoms or oral mucosal injury and the grades of gastrointestinal mucosal injury."
    explanation: >-
      Supports the need for endoscopy specifically: symptoms and visible oral
      burns do not predict the depth of gastrointestinal injury, so the grade
      cannot be inferred clinically. Partial because the cohort is corrosive
      ingestion generally, not formaldehyde alone.
- name: Patch testing for formaldehyde and formaldehyde releasers
  description: >-
    Suspected formaldehyde allergic contact dermatitis is confirmed by patch
    testing. Formaldehyde sits in most baseline series, but the releasers must be
    tested separately - a product need not declare formaldehyde to deliver it,
    and a negative formaldehyde patch does not exclude releaser allergy.
  diagnosis_term:
    preferred_term: patch testing
    term:
      id: NCIT:C17137
      label: Skin Test
  evidence:
  - reference: PMID:18976378
    reference_title: "Occupational contact allergy to formaldehyde and formaldehyde releasers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Between January 2001 and May 2007, we had patch tested 81 patients with formaldehyde allergy and 18 with independent allergy to some formaldehyde releaser."
    explanation: >-
      Documents patch testing as the diagnostic method in practice, and shows
      that releaser allergy occurs independently of formaldehyde allergy - the
      reason both are tested.
  - reference: PMID:42035787
    reference_title: "The Prevalence of Contact Allergy to Formaldehyde and Formaldehyde Releasers: A Systematic Review and Meta-Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pooled prevalence of formaldehyde contact allergy was 2.88% (95% CI 2.55-3.24) with clinical relevance at 41.57%."
    explanation: >-
      Gives the diagnostic yield of patch testing in the population it is
      actually applied to - dermatitis patients under investigation - pooled
      across 158 studies and over 1.3 million patients.
genetic:
- name: ADH5
  notes: >-
    ADH5 (alcohol dehydrogenase 5, also known as formaldehyde dehydrogenase or
    S-nitrosoglutathione reductase) is the primary cellular defence against
    formaldehyde, oxidizing S-hydroxymethylglutathione en route to formate. It
    is not a causal gene for formaldehyde poisoning - the cause is the exposure -
    but it sets clearance capacity, and biallelic loss-of-function variants
    cause an inherited disorder of endogenous formaldehyde overload. The enzyme
    is deeply conserved from bacteria to mammals, which is itself evidence that
    endogenous formaldehyde has been a persistent pressure.
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: ADH5
    term:
      id: hgnc:253
      label: ADH5
  evidence:
  - reference: PMID:33512438
    reference_title: "Analysis of disease model iPSCs derived from patients with a novel Fanconi anemia-like IBMFS ADH5/ALDH2 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that ADH5 is the primary defense against formaldehyde, and ALDH2 provides a backup."
    explanation: >-
      Establishes ADH5 as the primary formaldehyde clearance enzyme, so its loss
      reduces the capacity that determines tolerance to a formaldehyde load.
  - reference: PMID:26412304
    reference_title: "Endogenous Formaldehyde Is a Hematopoietic Stem Cell Genotoxin and Metabolic Carcinogen."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we show that endogenous formaldehyde is removed by the enzyme alcohol dehydrogenase 5 (ADH5/GSNOR), and Adh5(-/-) mice therefore accumulate formaldehyde adducts in DNA."
    explanation: >-
      Demonstrates that losing ADH5 converts formaldehyde exposure into DNA
      adduct burden, the mechanistic basis for treating it as a susceptibility
      locus.
- name: ALDH2
  notes: >-
    ALDH2 (mitochondrial aldehyde dehydrogenase 2) is the backup arm of
    formaldehyde clearance. The common East Asian variant rs671 (c.1510G>A,
    p.Glu504Lys, ALDH2*2) is dominant-negative - ALDH2 is a tetramer, so one
    defective subunit compromises the assembled enzyme - and is carried by a
    very large fraction of East Asian populations. Whether ALDH2*2 carriers form
    a sensitive tail of the occupational formaldehyde exposure distribution is a
    plausible but untested prediction, recorded as a knowledge gap rather than
    asserted.
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: ALDH2
    term:
      id: hgnc:404
      label: ALDH2
  variants:
  - name: ALDH2 rs671 (NM_000690.4:c.1510G>A, p.Glu504Lys)
    description: >-
      The East Asian alcohol-flushing allele, also written ALDH2*2 and, in the
      mature protein numbering, E487K. It acts as a dominant negative on the
      ALDH2 tetramer, so heterozygotes lose most enzyme activity and carry
      reduced backup capacity for formaldehyde clearance.
    evidence:
    - reference: PMID:33355142
      reference_title: "Digenic mutations in ALDH2 and ADH5 impair formaldehyde clearance and cause a multisystem disorder, AMeD syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Rs671 in the aldehyde dehydrogenase 2 gene (ALDH2) is the cause of Asian alcohol flushing response after drinking."
      explanation: >-
        Identifies the rs671 allele and its population phenotype, in the paper
        that connects it to impaired formaldehyde clearance.
  evidence:
  - reference: PMID:33355142
    reference_title: "Digenic mutations in ALDH2 and ADH5 impair formaldehyde clearance and cause a multisystem disorder, AMeD syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ALDH2 detoxifies endogenous aldehydes, which are the major source of DNA damage repaired by the Fanconi anemia pathway."
    explanation: >-
      Establishes ALDH2 as an aldehyde clearance enzyme whose failure shifts the
      burden onto DNA crosslink repair.
  - reference: PMID:33147438
    reference_title: "Two Aldehyde Clearance Systems Are Essential to Prevent Lethal Formaldehyde Accumulation in Mice and Humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We show that formaldehyde is a common substrate of ALDH2 and ADH5 and establish methods to quantify elevated blood formaldehyde and formaldehyde-DNA adducts in tissues."
    explanation: >-
      Confirms formaldehyde as a shared substrate of both clearance enzymes,
      which is what makes ALDH2 a modifier of formaldehyde tolerance.
- name: FANCD2
  notes: >-
    FANCD2 is a central component of the Fanconi anaemia interstrand-crosslink
    repair pathway, the system that resolves formaldehyde-induced DNA
    crosslinks. It modifies tolerance downstream of clearance rather than
    upstream of it: clearance sets how much formaldehyde reaches DNA, repair
    sets what happens once it does. Fanconi anaemia patients are therefore a
    biologically motivated formaldehyde-sensitive population, though this has
    not been demonstrated clinically.
  relationship_type: MODIFIER
  gene_term:
    preferred_term: FANCD2
    term:
      id: hgnc:3585
      label: FANCD2
  evidence:
  - reference: PMID:26412304
    reference_title: "Endogenous Formaldehyde Is a Hematopoietic Stem Cell Genotoxin and Metabolic Carcinogen."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The repair of this damage is mediated by FANCD2, a DNA crosslink repair protein."
    explanation: >-
      Identifies FANCD2 as the repair protein handling formaldehyde-induced DNA
      damage, the basis for treating it as a tolerance modifier.

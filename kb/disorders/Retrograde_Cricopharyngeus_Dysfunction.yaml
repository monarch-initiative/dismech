    term:
      id: UBERON:0007268
      label: upper esophageal sphincter
  - preferred_term: cricopharyngeus muscle
    term:
      id: UBERON:0010928
      label: cricopharyngeus muscle
  downstream:
  - target: Intraesophageal Gas Trapping
    causal_link_type: DIRECT
    description: Failure of the cricopharyngeus muscle to relax during retrograde gas venting traps air within the esophageal body, equalizing esophageal and gastric pressures and producing low-pressure esophageal distension.
    evidence:
    - reference: PMID:38767031
      reference_title: "The inability to belch - A neglected disease in the era of high-resolution esophageal manometry."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: "We performed HRM with a belch provocation test for which the patient drank 500 ml of carbonated water. The study revealed increased esophageal pressure, an absence of UES relaxation and secondary peristalsis once the patient mentioned the need to belch."
      explanation: High-resolution manometry with carbonated water provocation demonstrates that absent UES relaxation leads directly to elevated intraesophageal pressure from trapped gas.
  - target: Inability to Belch
    causal_link_type: DIRECT
    description: Absent retrograde upper esophageal sphincter relaxation directly prevents air venting across the cricopharyngeus muscle, resulting in complete inability to belch.
    evidence:
    - reference: PMID:35122356
      reference_title: "Retrograde upper esophageal sphincter function… and dysfunction."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "prior to 2019, there were only three case reports in the world literature of individuals with a physiologically demonstrated inability to belch due to failure of the UES to relax after gas venting from the stomach and ensuing low-pressure esophageal distention"
      explanation: Directly links failure of UES relaxation after gastric gas venting to the inability to belch.

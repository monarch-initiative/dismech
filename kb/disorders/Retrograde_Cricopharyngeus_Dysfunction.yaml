    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The inability to burp (98.8%), bloating (92.9%), gurgling noises (31.8%), and excessive flatulence (21.2%) were the most common symptoms."
    explanation: The Jefferson case series quantifies inability to burp as the dominant presenting symptom.

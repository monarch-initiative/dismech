treatments:
- name: Botulinum Toxin Injection
  description: Injection of botulinum toxin type A (typically 50 to 100 units, with efficacy reported down to 10 units) into the cricopharyngeus muscle via operating-room rigid or flexible esophagoscopy or awake in-office electromyography-guided percutaneous/transtracheal approaches. Temporary chemodenervation relaxes the upper esophageal sphincter, serving as both a confirmatory diagnostic test and definitive therapy that frequently leads to durable reflex retraining beyond the pharmacologic half-life of the toxin.
  treatment_term:
    preferred_term: botulinum toxin type A therapy
    term:
      id: NCIT:C157775
      label: Botulinum Toxin Therapy
    therapeutic_agent:
    - preferred_term: botulinum toxin type A
      term:
        id: CHEBI:3160
        label: Botulinum toxin type A
  therapeutic_modality: OTHER
  target_mechanisms:
  - target: Failure of Upper Esophageal Sphincter Relaxation
    treatment_effect: INHIBITS
    description: Chemodenervation of the cricopharyngeus muscle blocks presynaptic acetylcholine release, lowering sphincter resistance to permit retrograde gas venting and durable central reprogramming of the belch reflex.
    evidence:
    - reference: PMID:31236539
      reference_title: "Inability to Belch and Associated Symptoms Due to Retrograde Cricopharyngeus Dysfunction: Diagnosis and Treatment."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "All 51 patients achieved ability to belch and relief of associated symptoms, and the majority seem to have \"retrained\" the ability to belch on a potentially \"permanent\" basis."
      explanation: Demonstrates that botulinum toxin injection restores retrograde UES relaxation and induces durable belch retraining.
  target_phenotypes:
  - preferred_term: Inability to belch
    term:
      id: HP:0025031
      label: Abnormality of the digestive system
    coarse_binding_basis: NO_HPO_TERM
    term_gap: HPO lacks a specific term for inability to belch (abelchia).
  - preferred_term: Socially awkward gurgling noises
    term:
      id: HP:0025031
      label: Abnormality of the digestive system
    coarse_binding_basis: NO_HPO_TERM
    term_gap: HPO lacks a specific term for esophageal or cervical gurgling sounds.
  - preferred_term: Abdominal bloating and distension

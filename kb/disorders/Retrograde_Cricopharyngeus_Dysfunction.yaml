    stratum: Patients with positive family history of R-CPD
    comparator_stratum: Patients without family history of R-CPD
    modified_outcome: Single-injection botulinum toxin symptom resolution
    effect_in_stratum: SMALLER_EFFECT
    modification_analysis: POST_HOC_SUBGROUP
    description: A positive family history of R-CPD is associated with reduced likelihood of symptom resolution after a single in-office botulinum toxin injection.
    evidence:

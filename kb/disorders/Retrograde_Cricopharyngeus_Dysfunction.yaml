diagnosis:
- name: Syndromic Clinical Diagnosis and Therapeutic Botulinum Toxin Trial
  description: Primary diagnosis is established clinically from the characteristic symptom tetrad (inability to belch, retrosternal/cervical gurgling noises, abdominal bloating/distension, and excessive flatulence) and definitively validated by symptom resolution following cricopharyngeal botulinum toxin injection.
  evidence:
  - reference: PMID:31236539
    reference_title: "Inability to Belch and Associated Symptoms Due to Retrograde Cricopharyngeus Dysfunction: Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "R-CPD can be diagnosed syndromically, using a symptom complex; clinical diagnosis is validated by relief of symptoms after BT injection; and BT into the CPM is an efficacious treatment, whose benefit appears to often last longer than the pharmacologic duration of action of BT."
    explanation: Establishes syndromic clinical diagnosis validated by response to cricopharyngeal botulinum toxin injection as the primary diagnostic paradigm for R-CPD.

- name: High-Resolution Impedance Manometry
  description: High-resolution impedance manometry (HRIM) with a provocative carbonated water challenge (e.g., 500 mL) objectively demonstrates increased esophageal pressure equilibrating with gastric pressure, absence of upper esophageal sphincter relaxation with no air venting across the UES, and repetitive secondary peristalsis, alongside elevated basal UES pressure and increased UES length.
  measurements:
  - preferred_term: high-resolution impedance manometry of the upper esophageal sphincter
    term:
      id: LOINC:51393-7
      label: Esophageal manometry study
  notes: >-
    LOINC codes esophageal manometry once, as a study whose result is a report, and
    that single record is what is bound: one match in the full LOINC 2.83 table and one
    in the Monarch KG, paginated to its stated total, with no Part. Two things it does
    not capture, recorded so the binding is not read as more than it is. The release
    has no high-resolution or impedance variant, so the modality this row specifies is
    not in the code. And it has no code for the provocative carbonated-water challenge
    that makes the test diagnostic here. The release's one quantitative
    esophageal pressure code, LOINC:60738-2, is a single intraluminal pressure rather
    than a manometry study and is not bound. No reference range is bound: the row's
    finding is failure of relaxation during distension, not a pressure threshold.
  evidence:
  - reference: PMID:35122356
    reference_title: "Retrograde upper esophageal sphincter function… and dysfunction."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The field has now further advanced with the publication in this issue of the Journal by Oude Nijhuis et al. of 8 cases of R-UESD demonstrated by high-resolution impedance manometry (HRIM) with a provocative challenge of carbonated water."
    explanation: HRIM with provocative testing provides objective diagnostic confirmation of R-CPD.
  - reference: PMID:38587015
    reference_title: "Upper Esophageal Sphincter and Esophageal Motility Pathology on Manometry in Retrograde Cricopharyngeal Dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Esophageal high-resolution impedance manometry was completed preoperatively in patients diagnosed with RCPD."
    explanation: HRIM is used for demonstrating UES abnormalities in R-CPD.
  - reference: PMID:38767031
    reference_title: "The inability to belch - A neglected disease in the era of high-resolution esophageal manometry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We performed HRM with a belch provocation test for which the patient drank 500 ml of carbonated water. The study revealed increased esophageal pressure, an absence of UES relaxation and secondary peristalsis once the patient mentioned the need to belch."
    explanation: HRM with belch provocation shows characteristic pressure rise and absent UES relaxation in R-CPD.
  - reference: PMID:38767031
    reference_title: "The inability to belch - A neglected disease in the era of high-resolution esophageal manometry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We encourage the use of HRM, looking for an increase in esophageal pressure to the level of gastric pressure, failure of UES relaxation with consequently no venting of air across the UES, and secondary peristalsis."
    explanation: Summarizes the diagnostic HRM criteria during belch provocation.

differential_diagnoses:
- name: Supragastric Belching
  description: Functional belching disorder characterized by repetitive supradiaphragmatic air influx and frequent belches, rather than an inability to vent esophageal gas.
  distinguishing_features:
  - Patients exhibit frequent, often repetitive belching episodes instead of inability to belch.
  - High-resolution manometry with belch provocation in R-CPD demonstrates an increase in esophageal pressure to the level of gastric pressure, failure of UES relaxation with no venting of air across the UES, and secondary peristalsis.
  evidence:
  - reference: PMID:38767031
    reference_title: "The inability to belch - A neglected disease in the era of high-resolution esophageal manometry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The incapacity to belch is the hallmark of the disease."
    explanation: R-CPD is defined by inability to belch, distinguishing it from conditions like supragastric belching where belching is frequent.
  - reference: PMID:38767031
    reference_title: "The inability to belch - A neglected disease in the era of high-resolution esophageal manometry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We encourage the use of HRM, looking for an increase in esophageal pressure to the level of gastric pressure, failure of UES relaxation with consequently no venting of air across the UES, and secondary peristalsis."
    explanation: Establishes the characteristic high-resolution manometry findings of R-CPD during belch provocation.

- name: Antegrade Cricopharyngeus Dysfunction
  description: Deglutitive cricopharyngeus muscle dysfunction occurring predominantly in older adults and presenting with oropharyngeal dysphagia due to impaired upper esophageal sphincter opening during swallowing.
  distinguishing_features:
  - Presents with swallowing difficulty (oropharyngeal dysphagia) in older adults rather than inability to belch in young adults.
  - Deglutitive upper esophageal sphincter relaxation is impaired in antegrade cricopharyngeus dysfunction but preserved in R-CPD.
  evidence:
  - reference: PMID:31236539
    reference_title: "Inability to Belch and Associated Symptoms Due to Retrograde Cricopharyngeus Dysfunction: Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "BT injection into the CPM has been previously reported for a different condition: a swallowing problem seen mostly in older persons caused by antegrade CPD (A-CPD).5-7 In the senior author’s extensive experience with that condition, A-CPD is much better treated with cricopharyngeus myotomy, and none of the patients with R-CPD reported here had any symptoms or findings of A-CPD."
    explanation: Distinguishes R-CPD from antegrade cricopharyngeus dysfunction by preservation of swallowing and distinct clinical demographics.

notes: >
  R-CPD was first formally named and syndromically defined in 2019 by Bastian
  and Smithson, after only three isolated physiological case reports of
  inability to belch (1987, 1991, and 2015) had been published in the prior
  literature. Despite typical symptom onset in infancy or early childhood and
  amplification in adolescence, patients historically underwent extensive
  non-diagnostic testing (esophagogastroduodenoscopy, barium esophagram, pH-impedance
  monitoring, gastric emptying studies) and empirical proton pump inhibitor or
  antispasmodic trials for presumed gastroesophageal reflux disease, irritable
  bowel syndrome, functional dyspepsia, or aerophagia before receiving a
  diagnosis at a mean age of 30.4 years. Most patients retain the ability to belch
  after a single cricopharyngeal botulinum toxin injection well beyond the
  expected 3-to-4-month pharmacologic duration of chemodenervation, indicating
  durable central or sensory-motor reprogramming of the retrograde upper
  esophageal sphincter reflex.

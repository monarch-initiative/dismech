      reference_title: "Origin and In-Office Treatment of Retrograde Cricopharyngeus Dysfunction."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Family history of R-CPD was a negative predictor of single-BTI success."
      explanation: Identifies family history of R-CPD as a negative predictor of single-injection botulinum toxin efficacy.
  evidence:
  - reference: PMID:31236539
    reference_title: "Inability to Belch and Associated Symptoms Due to Retrograde Cricopharyngeus Dysfunction: Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All 51 patients achieved ability to belch and relief of associated symptoms, and the majority seem to have \"retrained\" the ability to belch on a potentially \"permanent\" basis."
    explanation: The Bastian 2019 case series demonstrated 100% success rate with botulinum toxin injection in restoring belching ability.
  - reference: DOI:10.1177/2473974x20938342
    reference_title: "The Long‐term Efficacy of Botulinum Toxin Injection to Treat Retrograde Cricopharyngeus Dysfunction"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a case series of 200 patients with retrograde cricopharyngeus dysfunction, 99% experienced relief of the cardinal symptoms and 79.9% experienced lasting relief of their symptoms beyond pharmacologic duration of action after a single injection of botulinum toxin into the cricopharyngeus muscle."
    explanation: The Hoesli 2020 200-patient follow-up cohort establishes 99% initial relief and 79.9% durable symptom resolution at 6 or more months after a single botulinum toxin injection.
  - reference: PMID:38587015
    reference_title: "Upper Esophageal Sphincter and Esophageal Motility Pathology on Manometry in Retrograde Cricopharyngeal Dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All patients who underwent cricopharyngeal botulinum injections experienced initial improvement of symptoms with 3 patients requiring repeat intervention."

phenotypes:
- name: Inability to Belch
  description: Complete or near-complete inability to belch (eructate), which is the cardinal feature of R-CPD. Patients cannot voluntarily or reflexively release gas from the esophagus through the pharynx.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Inability to belch
    term:
      id: HP:0025031
      label: Abnormality of the digestive system
    coarse_binding_basis: NO_HPO_TERM
    term_gap: HPO has Belching (HP:0025262) and Aerophagia (HP:0031594) under Abnormality of digestive system physiology (HP:0025032), but no term for inability to belch (abelchia / retrograde eructation failure).
  evidence:
  - reference: PMID:31236539
    reference_title: "Inability to Belch and Associated Symptoms Due to Retrograde Cricopharyngeus Dysfunction: Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To propose and test the validity of a new syndrome called retrograde cricopharyngeus dysfunction (R-CPD) that explains inability to belch and the associated symptoms of loud gurgling noises, chest and abdominal pain/distention, and excessive flatulence"
    explanation: This landmark paper defined R-CPD and established inability to belch as the cardinal feature.
  - reference: PMID:37621856
    reference_title: "Retrograde Cricopharyngeus Dysfunction effectively treated with low dose botulinum toxin. A case report from Italy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A large constellation of hitherto unexplained symptoms including inability to burp, gurgling noises from the chest and lower neck, abdominal bloating, flatulence, painful hiccups and emetophobia was defined as Retrograde Cricopharyngeus Dysfunction (R-CPD) in 2019."
    explanation: The Pavesi 2023 case report reiterates inability to burp as the defining symptom of R-CPD.
  - reference: PMID:38767031
    reference_title: "The inability to belch - A neglected disease in the era of high-resolution esophageal manometry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The incapacity to belch is the hallmark of the disease."
    explanation: The Jiménez-Castillo 2025 series states the hallmark symptom is inability to belch.

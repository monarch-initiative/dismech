name: Gonorrhea
creation_date: "2026-08-08T13:20:00Z"
category: Infectious Disease
description: >-
  Gonorrhea is a sexually transmitted infection caused by the Gram-negative
  diplococcus Neisseria gonorrhoeae, which colonizes the mucosal epithelium of
  the urethra, cervix, rectum, pharynx, and conjunctiva. Infection is
  frequently asymptomatic, particularly at rectal and pharyngeal sites and in
  women, which sustains onward transmission. Ascending infection causes pelvic
  inflammatory disease and tubal infertility; haematogenous spread causes
  disseminated gonococcal infection; and perinatal transmission causes
  ophthalmia neonatorum. The organism varies its surface antigens continuously
  and elicits no protective immunity, so reinfection is the rule, and it has
  sequentially acquired resistance to every antimicrobial class deployed
  against it.
disease_term:
  preferred_term: gonorrhea
  term:
    id: MONDO:0004277
    label: gonorrhea
parents:
- Bacterial Infection
- Sexually transmitted infection
pathophysiology:
- name: Gonococcal Mucosal Attachment and Invasion
  biological_scale: TISSUE
  description: >-
    N. gonorrhoeae attaches to mucosal epithelium via type IV pili and Opa
    proteins and invades the epithelial layer, establishing infection at the
    urethral, cervical, rectal, pharyngeal, or conjunctival surface.
phenotypes:
- category: Genitourinary
  name: Urethritis
  description: >-
    Purulent urethral discharge with dysuria is the characteristic symptomatic
    presentation in men.
  phenotype_term:
    preferred_term: Urethritis
    term:
      id: HP:0500006
      label: Urethritis

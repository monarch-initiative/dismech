      The gonococcus adheres by type IV pili with PorB and Opa, and subverts
      complement-mediated killing by lipooligosaccharide sialylation together
      with a series of anti-phagocytic mechanisms - the immune-evasion core of
      this entry.
    supporting_text: "The gonococcus is able to subvert complement mediated killing and opsonisation by sialylation of its lipooligosaccharide and deploys a series of anti-phagocytic mechanisms."

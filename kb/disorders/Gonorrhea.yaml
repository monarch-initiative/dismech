diagnosis:
- name: Nucleic acid amplification testing
  description: >-
    NAAT is the diagnostic method of choice at all anatomic sites, including
    rectal and pharyngeal specimens where culture performs poorly. Because
    extragenital infection is usually asymptomatic, site-specific NAAT testing
    is what makes case-finding possible in the populations that sustain
    transmission.
  diagnosis_term:
    preferred_term: nucleic acid amplification testing
    term:
      id: NCIT:C17003
      label: Polymerase Chain Reaction
  results: >-
    Detection of N. gonorrhoeae nucleic acid from urine or from urethral,
    cervical, rectal, or pharyngeal swabs.
  evidence:
  - reference: PMID:20335410
    reference_title: "Nucleic acid amplification tests for diagnosis of Neisseria gonorrhoeae and Chlamydia trachomatis rectal infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study evaluated the performance of culture and nucleic acid amplification tests (NAATs) for rectal chlamydial and gonococcal diagnosis."
    explanation: >-
      Establishes NAAT evaluation against culture for extragenital gonococcal
      diagnosis.
  - reference: PMID:18520976
    reference_title: "Nucleic acid amplification tests in the diagnosis of chlamydial and gonococcal infections of the oropharynx and rectum in men who have sex with men."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nucleic acid amplification tests in the diagnosis of chlamydial and gonococcal infections of the oropharynx and rectum in men who have sex with men"
    explanation: >-
      Establishes NAAT use for oropharyngeal and rectal gonococcal diagnosis in
      the population where extragenital infection is most prevalent.
- name: Culture with antimicrobial susceptibility testing
  description: >-
    Culture retains a specific role that NAAT cannot fill: it is the only
    method that yields an isolate for susceptibility testing. In an organism
    that has sequentially defeated every drug class, surveillance culture is
    what detects the next resistance wave, and it is indicated in suspected
    treatment failure.
  diagnosis_term:
    preferred_term: bacterial culture and susceptibility testing
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: >-
    Growth of N. gonorrhoeae with minimum inhibitory concentrations for
    ceftriaxone, azithromycin, and other agents.
  evidence:
  - reference: PMID:35416971
    reference_title: "Management of Neisseria gonorrhoeae in the United States: Summary of Evidence From the Development of the 2020 Gonorrhea Treatment Recommendations and the 2021 Centers for Disease Control and Prevention Sexually Transmitted Infection Treatment Guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GISP data suggest that ceftriaxone minimal inhibitory concentrations (MICs) have remained stable in the United States"
    explanation: >-
      The GISP surveillance MIC data this node exists to generate are reported
      directly, establishing the role of culture-based susceptibility testing.
differential_diagnoses:
- name: Chlamydial urethritis and cervicitis
  description: >-
    Chlamydia trachomatis causes a clinically indistinguishable urethritis and
    cervicitis and frequently coinfects, which is why current guidance adds
    doxycycline when chlamydial coinfection has not been excluded.
- name: Non-gonococcal urethritis
  description: >-
    Mycoplasma genitalium, Trichomonas vaginalis, and Ureaplasma species cause
    urethritis with a typically less purulent discharge; distinguished by NAAT.
- name: Reactive arthritis
  description: >-
    Post-infectious reactive arthritis can follow gonococcal or chlamydial
    infection and mimics disseminated gonococcal arthritis, but joint cultures
    are sterile and the mechanism is immune-mediated rather than septic.
treatments:
- name: Ceftriaxone 500 mg intramuscular single dose
  description: >-
    Ceftriaxone 500 mg IM as a single dose is the recommended first-line
    treatment for uncomplicated gonorrhea at all anatomic sites, with 1 g for
    persons weighing 150 kg or more. The 2021 guidance raised the dose and
    returned to monotherapy, dropping the azithromycin component of the
    previous dual regimen because of rising macrolide resistance and
    antimicrobial stewardship considerations. Few alternatives exist for
    cephalosporin-allergic patients, and there are no recommended alternative
    regimens for pharyngeal infection.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: ceftriaxone
      term:
        id: CHEBI:29007
        label: ceftriaxone
  target_mechanisms:
  - target: Gonococcal Penicillin-Binding Protein Cross-Linking (Ceftriaxone Target)
    treatment_effect: INHIBITS
    description: >-
      Beta-lactam acylation of penicillin-binding proteins halts peptidoglycan
      cross-linking and is bactericidal.
  evidence:
  - reference: PMID:35416971
    reference_title: "Management of Neisseria gonorrhoeae in the United States: Summary of Evidence From the Development of the 2020 Gonorrhea Treatment Recommendations and the 2021 Centers for Disease Control and Prevention Sexually Transmitted Infection Treatment Guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 2021 CDC STI Treatment Guidelines now recommend 500mg ceftriaxone intramuscularly once for the treatment of uncomplicated gonorrhea at all anatomic sites."
    explanation: Gives the recommended regimen directly.
  - reference: PMID:35416971
    reference_title: "Management of Neisseria gonorrhoeae in the United States: Summary of Evidence From the Development of the 2020 Gonorrhea Treatment Recommendations and the 2021 Centers for Disease Control and Prevention Sexually Transmitted Infection Treatment Guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Few alternative therapies exist for persons with cephalosporin allergies; there are no recommended alternative therapies for N gonorrhoeae infection of the throat."
    explanation: >-
      Supports the constrained-alternatives caveat recorded in this
      description.
- name: Doxycycline cotreatment for possible chlamydial coinfection
  description: >-
    Doxycycline 100 mg orally twice daily for seven days is added when
    chlamydial coinfection has not been excluded. This is coverage of a
    coinfecting organism rather than gonococcal therapy - doxycycline is not
    adequate treatment for gonorrhea itself.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  target_mechanisms:
  - target: Gonococcal Ribosomal Translation (Macrolide and Tetracycline Target)
    treatment_effect: INHIBITS
    description: >-
      Doxycycline binds the 30S ribosomal subunit and arrests bacterial protein
      synthesis.
  evidence:
  - reference: PMID:35416971
    reference_title: "Management of Neisseria gonorrhoeae in the United States: Summary of Evidence From the Development of the 2020 Gonorrhea Treatment Recommendations and the 2021 Centers for Disease Control and Prevention Sexually Transmitted Infection Treatment Guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If coinfection with chlamydia has not been excluded, cotreatment with doxycycline 100mg twice daily for 7 days should be added."
    explanation: Gives the cotreatment indication and regimen directly.
- name: Meningococcal serogroup B outer-membrane-vesicle vaccination
  description: >-
    No gonorrhea-specific vaccine exists. Outer-membrane-vesicle meningococcal
    serogroup B vaccines, principally 4CMenB, confer partial cross-protection
    through antigenic homology between the two Neisseria species. A matched
    cohort study found gonorrhea rates 46% lower in 4CMenB recipients than in
    MenACWY recipients, and pooled meta-analysis supports a partial protective
    effect. This is partial, not sterilizing, protection - it reduces incidence
    rather than preventing infection.
  therapeutic_modality: VACCINE
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  evidence:
  - reference: PMID:35642527
    reference_title: "Prevention of Neisseria gonorrhoeae With Meningococcal B Vaccine: A Matched Cohort Study in Southern California."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In adjusted analyses, gonorrhea rates were 46% lower among recipients of 4CMenB vs MenACWY"
    explanation: >-
      Gives the matched-cohort effect estimate for 4CMenB against gonorrhea.
  - reference: PMID:40334533
    reference_title: "Evaluating cross-protection: Meningococcal vaccines show effectiveness in gonorrhoea prevention - A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "OMV vaccines offer moderate protection against gonorrhoea."
    explanation: >-
      States the meta-analysis conclusion directly: OMV vaccines confer
      moderate, not sterilizing, protection.
  - reference: PMID:38986746
    reference_title: "Vaccine effectiveness and impact of meningococcal vaccines against gonococcal infections: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Vaccine effectiveness and impact of meningococcal vaccines against gonococcal infections"
    explanation: >-
      A second independent systematic review of meningococcal vaccine
      effectiveness against gonococcal infection.
  - reference: PMID:42259835
    reference_title: "Pre-clinical efficacy of a candidate outer membrane vesicle gonococcal vaccine in comparison with 4CMenB."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Meningococcal vaccines MeNZB and 4CMenB (Bexsero), containing Neisseria meningitidis group B detergent-extracted outer membrane vesicles (dOMV), cross-protect against gonorrhoea with 31-59% effectiveness."
    explanation: >-
      States the cross-protection mechanism - detergent-extracted outer
      membrane vesicles - and the effectiveness range, and situates this
      partial protection against purpose-built gonococcal OMV candidates.
animal_models:
- species: Mouse
  description: >-
    Mice are naturally resistant to genital gonococcal infection, and the
    standard model therefore requires 17-beta-estradiol treatment to permit
    colonization of the female genital tract. This is the central caveat of
    gonococcal animal work: the model is a hormonally manipulated surrogate
    rather than a natural infection, and the organism is an obligate human
    pathogen with several key virulence factors that are human-specific.
  evidence:
  - reference: PMID:21747807
    reference_title: "Estradiol-Treated Female Mice as Surrogate Hosts for Neisseria gonorrhoeae Genital Tract Infections."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Genital tract infection can be established in female mice that are treated with 17β-estradiol, however, and many features of experimental murine infection mimic human infection."
    explanation: >-
      States both halves of the model's position - infection requires estradiol
      treatment, and many but not all features mimic human infection. The
      HUMAN_MODEL_MISMATCH discussion records where the resemblance breaks
      down.
  - reference: PMID:28886683
    reference_title: "Neisseria gonorrhoeae: Drug Resistance, Mouse Models, and Vaccine Development."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Refinements of the animal model have also improved its use as a surrogate host of human infection and accelerated the testing of novel therapeutic and prophylactic compounds against gonococcal infection."
    explanation: >-
      Independently characterizes the murine system as a surrogate host whose
      usefulness rests on refinements, corroborating the caveat this model
      entry records. Evidence source is OTHER because the citation is a
      review.
  - reference: PMID:2506350
    reference_title: "Resistance of mice to genital infection with Neisseria gonorrhoeae."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice of these strains, therefore, appear resistant to gonococcal infection of the genital tract."
    explanation: >-
      States the murine resistance directly, which is what makes hormonal
      manipulation necessary for the model to work.
discussions:
- discussion_id: gonorrhea_mouse_model_human_specificity
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    How much of gonococcal pathogenesis established in the estradiol-treated
    mouse transfers to human infection, given that mice are naturally resistant
    and that several key gonococcal virulence factors engage human-specific
    receptors?
  rationale: >-
    N. gonorrhoeae is an obligate human pathogen. Mice are naturally resistant
    to genital infection and must be treated with 17-beta-estradiol to be
    colonized at all. Several central virulence interactions curated in this
    entry are human-restricted - Opa binding to human CEACAM receptors, and
    iron acquisition from human transferrin and lactoferrin - so the surrogate
    host lacks the very receptors the mechanism depends on. Conclusions about
    colonization, immune evasion, and vaccine protection drawn from this model
    therefore carry an unusually large translational gap.
  attaches_to:
  - pathophysiology#Opa-CEACAM Engagement and Epithelial Invasion
  - pathophysiology#Anti-Phagocytic Survival Within Neutrophils
  proposed_experiments:
  - experiment_id: exp_gonorrhea_humanized_ceacam_mouse
    name: Human CEACAM-transgenic mouse challenge
    description: >-
      Compare colonization, neutrophil interaction, and vaccine protection
      between wild-type estradiol-treated mice and mice transgenic for human
      CEACAM receptors, to quantify how much of the observed phenotype depends
      on the human-specific receptor interaction absent from the standard
      model.
  evidence:
  - reference: PMID:2506350
    reference_title: "Resistance of mice to genital infection with Neisseria gonorrhoeae."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice of these strains, therefore, appear resistant to gonococcal infection of the genital tract."
    explanation: >-
      The natural murine resistance is the root of the mismatch this
      discussion poses: the model must be hormonally manipulated before it will
      support infection at all.
  - reference: PMID:21204865
    reference_title: "Opa proteins and CEACAMs: pathways of immune engagement for pathogenic Neisseria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Most immune interactions are mediated via binding to members of the carcinoembryonic antigen cell adhesion molecule (CEACAM) family."
    explanation: >-
      Establishes CEACAM engagement as the dominant immune interaction, the
      human-specific receptor family the murine model lacks.
- discussion_id: gonorrhea_omv_vaccine_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which antigens mediate the cross-protection that meningococcal OMV vaccines
    confer against gonorrhea, and can that protection be improved on
    deliberately?
  rationale: >-
    OMV meningococcal vaccines reduce gonorrhea incidence substantially, but
    the protection is partial and the responsible antigens are not definitively
    identified. Because the effect was discovered epidemiologically rather than
    designed, the mechanism is inferred from antigenic homology rather than
    demonstrated. Identifying the protective antigens would convert an
    incidental benefit into a rational vaccine target for an organism that has
    otherwise defeated every antimicrobial deployed against it.
  attaches_to:
  - pathophysiology#Absence of Protective Immunity and Reinfection
  proposed_experiments:
  - experiment_id: exp_gonorrhea_omv_antigen_deconvolution
    name: Antigen deconvolution of OMV cross-protection
    description: >-
      Use post-vaccination human sera to identify gonococcal antigens
      recognized after 4CMenB vaccination, then test them individually and in
      combination for protection, to determine whether the cross-protective
      response can be reproduced by a defined subunit vaccine.
  evidence:
  - reference: PMID:42259835
    reference_title: "Pre-clinical efficacy of a candidate outer membrane vesicle gonococcal vaccine in comparison with 4CMenB."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Meningococcal vaccines MeNZB and 4CMenB (Bexsero), containing Neisseria meningitidis group B detergent-extracted outer membrane vesicles (dOMV), cross-protect against gonorrhoea with 31-59% effectiveness."
    explanation: >-
      Establishes that cross-protection is real but partial and attributed to
      the dOMV fraction rather than to identified antigens, which is precisely
      the gap this discussion poses.
notes: >-
  GeneReviews is not applicable: gonorrhea is an acquired bacterial infection,
  and a PubMed search returned no chapter. No human host gene causes the
  disease; host genetic contributions are limited to complement pathway
  deficiencies that predispose to dissemination, curated as a risk factor
  within the dissemination node rather than as causal genetics.

  Relationship to the treponematoses curated alongside this entry: gonorrhea
  and syphilis are the two classical bacterial STIs and share a strategy of
  antigenic variation - pilin and Opa variation here, TprK gene conversion in
  T. pallidum - but diverge completely on antimicrobial resistance. That
  contrast is modelled explicitly in the Sequential Loss of Antimicrobial
  Classes node.

  Deep-research caveat: the claude_code report attributed the 4CMenB
  cross-protection finding to PMID:32218555, which is in fact "Metal Levels,
  Genetic Instability, and Renal Markers in Electronic Waste Workers in
  Thailand" - a real paper on an entirely unrelated subject. The vaccine claims
  in this entry are instead cited to PMID:35642527, PMID:40334533, and
  PMID:38986746, each fetched and verified. 21 of the 22 PMIDs the report cited
  were real and on-topic; this was the single misattribution.

  Correction to an earlier version of this note. The first draft of this entry
  justified several omissions on the grounds that no cached source quoted the
  claim. Review showed that premise was wrong for a number of them: quotes
  supporting tenosynovitis, skin lesions, chronic pelvic pain, ectopic
  pregnancy, tubal infertility, Fitz-Hugh-Curtis perihepatitis, and the
  asymptomatic-infection pattern were all sitting in already-cached abstracts.
  Those are now curated with real evidence items. The lesson is recorded here
  rather than quietly fixed, because an omission rationale that misstates the
  evidence base is worse than a plain omission - it discourages the next
  curator from looking.

  Still deliberately not asserted, this time verified against the cache: the
  specific resistance determinants (penA mosaic alleles, mtrR/MtrCDE efflux,
  23S rRNA A2059G/C2611T, gyrA/parC QRDR mutations); the pilS recombination and
  slipped-strand mispairing mechanisms of antigenic variation; IL-17C-driven
  fallopian tube damage; and the UK Health Security Agency's 2025 approval of
  4CMenB for gonorrhea prevention. Each is described in the deep-research
  report but sourced there to full text or web pages rather than to citable
  abstracts. The fluoroquinolone and DNA gyrase nodes are omitted for the same
  reason: the abandonment of ciprofloxacin is real and well known, but no
  source cached here states it. Adding a dedicated antimicrobial-resistance
  reference would let those nodes be curated with conformance to
  bacterial_dna_topoisomerase_inhibition.

  Two phenotypes carry a free-text preferred_term with no term binding because
  HPO has no suitable term: Fitz-Hugh-Curtis perihepatitis, and asymptomatic
  infection (an absence of phenotype rather than a phenotypic abnormality).
  Ectopic pregnancy is unbound for a different reason - HP:0031456 exists and
  is correct, but is not reachable from the PhenotypeTerm enum root.

  Complement gene coverage. PMID:1554498 names C6, C7 and C8 as the inherited
  terminal-component deficiencies. C6 and C7 therefore carry that sentence as a
  gene-level anchor. C8 is not a single gene - the protein is a heterotrimer
  and inherited deficiency arises from either the alpha-gamma (C8A) or beta
  (C8B) subunit - so both subunit genes are curated with the naming sentence
  marked PARTIAL, because the source does not say which it means. C9 is curated
  on the class-level association only: that abstract does not name C9 anywhere,
  so no gene-level anchor is claimed for it.

  Frequency bands are asserted nowhere in this entry. The disseminated-infection
  percentages quoted from PMID:6415361 are proportions of DGI subgroups, not of
  patients with gonorrhea, so they support the phenotype association but cannot
  be mapped to a FrequencyEnum band.

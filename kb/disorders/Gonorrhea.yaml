- name: CFI
  association: Complement factor I deficiency predisposing to disseminated gonococcal infection
  notes: >-
    Complement factor I deficiency causes uninhibited complement activation and consumption, depleting alternative and terminal pathway components. The resulting loss of complement-mediated bactericidal activity removes the principal barrier to gonococcal bloodstream survival and predisposes to disseminated gonococcal infection. This is host susceptibility to an exogenous infection, not a cause of gonorrhea.
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: CFI
    term:
      id: hgnc:5394
      label: CFI
  evidence:
  - reference: PMID:41607490
    reference_title: "Disseminated gonococcal infection secondary to a rare homozygous mutation resulting in complement factor I deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complement studies showed low total (CH50) and alternative pathway (AP50) activity and low levels of all alternative and terminal complement proteins and the complement inhibitors factor H and factor I (FI), suggesting uninhibited complement activation and complement consumption."
    explanation: >-
      Documents the complement profile in a patient with factor I deficiency
      who developed disseminated gonococcal infection.

- name: Azithromycin Resistance and the Retreat to Monotherapy
  biological_scale: MOLECULAR
  role: resistance_mechanism
  conforms_to: "bacterial_protein_synthesis_inhibition#Ribosomal Target Resistance"
  description: >-
    Azithromycin resistance rose rapidly after the 2015 dual-therapy
    recommendation, driven by 23S rRNA target mutations and by upregulation of
    the MtrC-MtrD-MtrE efflux pump. The consequence is a rare example of
    guideline retreat: the 2021 CDC guidelines dropped azithromycin and
    returned to ceftriaxone monotherapy at a higher dose, explicitly weighing
    antimicrobial stewardship against dual coverage.
  biological_processes:
  - preferred_term: response to antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
    modifier: INCREASED
  evidence:
  - reference: PMID:35416971
    reference_title: "Management of Neisseria gonorrhoeae in the United States: Summary of Evidence From the Development of the 2020 Gonorrhea Treatment Recommendations and the 2021 Centers for Disease Control and Prevention Sexually Transmitted Infection Treatment Guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since the release of the Centers for Disease Control and Prevention (CDC) 2015 STD Treatment Guidelines, azithromycin, part of the 2015 dual-drug treatment regimen, has had a rapid rise in resistance."
    explanation: >-
      Directly documents the rise in azithromycin resistance that drove the
      guideline change.
  - reference: PMID:35416971
    reference_title: "Management of Neisseria gonorrhoeae in the United States: Summary of Evidence From the Development of the 2020 Gonorrhea Treatment Recommendations and the 2021 Centers for Disease Control and Prevention Sexually Transmitted Infection Treatment Guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GISP documented a rapid rise in the proportion of isolates with an elevated MIC"
    explanation: Documents the rise in azithromycin MICs in US surveillance.
  notes: >-
    The specific determinants - 23S rRNA A2059G/C2611T and mtrR-mediated
    MtrCDE efflux upregulation - come from the deep-research report and are not
    quoted by any source cached here. They are asserted in the description
    without a dedicated evidence item.
- name: Sequential Loss of Antimicrobial Classes
  biological_scale: ORGANISM
  description: >-
    N. gonorrhoeae has developed resistance to every first-line therapy
    deployed against it in turn - sulfonamides, penicillins, tetracyclines, and
    fluoroquinolones - leaving ceftriaxone as the last reliably effective
    option against a thin development pipeline. This node captures the
    population-level trajectory that the individual resistance nodes are
    instances of, and it is the sharpest contrast with the treponematoses,
    where penicillin has remained curative for eight decades.
  evidence:
  - reference: PMID:35416971
    reference_title: "Management of Neisseria gonorrhoeae in the United States: Summary of Evidence From the Development of the 2020 Gonorrhea Treatment Recommendations and the 2021 Centers for Disease Control and Prevention Sexually Transmitted Infection Treatment Guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

name: Gonorrhea
creation_date: "2026-08-08T13:20:00Z"
category: Infectious Disease
description: >-
  Gonorrhea is a sexually transmitted infection caused by the Gram-negative
  diplococcus Neisseria gonorrhoeae, an obligate human pathogen with no
  environmental or animal reservoir. It colonizes the mucosal epithelium of the
  urethra, cervix, rectum, pharynx, and conjunctiva, and is frequently
  asymptomatic - particularly at rectal and pharyngeal sites - which sustains
  onward transmission. Ascending infection causes pelvic inflammatory disease
  and tubal infertility; haematogenous spread causes disseminated gonococcal
  infection; and perinatal transmission causes ophthalmia neonatorum. Two
  features dominate its pathophysiology. First, the organism varies its surface
  antigens continuously and subverts complement and phagocytic killing, so
  infection elicits no protective immunity and reinfection is the rule. Second,
  it has sequentially acquired resistance to every antimicrobial class deployed
  against it - sulfonamides, penicillins, tetracyclines, and fluoroquinolones -
  leaving ceftriaxone as the last reliably effective first-line agent. This is
  the mechanistic inverse of syphilis, which after eight decades has still
  never developed clinically significant penicillin resistance.
synonyms:
- gonococcal infection
- the clap
disease_term:
  preferred_term: gonorrhea
  term:
    id: MONDO:0004277
    label: gonorrhea
parents:

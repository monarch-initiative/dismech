transmission:
- name: Sexual mucosal transmission
  description: >-
    Transmission occurs by direct mucosal contact during vaginal, anal, or oral
    sex, seeding the urethral, cervical, rectal, or pharyngeal epithelium.
  evidence:
  - reference: PMID:35489793
    reference_title: "Neisseria gonorrhoeae physiology and pathogenesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The gonococcus initially colonises and adheres to host mucosal surfaces utilising a type IV pilus that helps with microcolony formation."
    explanation: >-
      Establishes mucosal surfaces as the site of initial colonization, which
      is what direct mucosal contact delivers the organism to.
- name: Perinatal transmission during delivery
  description: >-
    Passage through an infected birth canal inoculates the neonatal
    conjunctiva, producing gonococcal ophthalmia neonatorum.
  evidence:
  - reference: PMID:8771523
    reference_title: "The influence of perinatal infective factors on ophthalmia neonatorum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ophthalmia neonatorum still blinds approximately 10,000 babies annually worldwide."
    explanation: >-
      Establishes perinatally acquired ophthalmia neonatorum as a globally
      significant, sight-threatening consequence of maternal infection.
pathophysiology:
- name: Gonococcal Mucosal Attachment and Microcolony Formation
  biological_scale: TISSUE
  description: >-
    The gonococcus adheres to mucosal epithelium using type IV pili, which
    mediate initial long-range attachment and microcolony formation, with the
    porin PorB and the phase-variable outer membrane protein Opa providing
    additional adhesion. This is the trigger event of the pathograph.
  cell_types:
  - preferred_term: epithelial cell
    term:
      id: CL:0000066
      label: epithelial cell
  biological_processes:
  - preferred_term: cell adhesion
    term:
      id: GO:0007155
      label: cell adhesion
    modifier: INCREASED
  downstream:
  - target: Opa-CEACAM Engagement and Epithelial Invasion
    description: Adherent organisms engage host receptors and invade the epithelium.
    causal_link_type: DIRECT
  - target: Asymptomatic infection
    description: >-
      Colonization can persist without provoking the neutrophilic
      immunopathology that produces symptoms, which is the usual outcome at
      rectal and pharyngeal sites.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:35489793
    reference_title: "Neisseria gonorrhoeae physiology and pathogenesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The gonococcus initially colonises and adheres to host mucosal surfaces utilising a type IV pilus that helps with microcolony formation."
    explanation: >-
      Directly describes type IV pilus-mediated attachment and microcolony
      formation as the initiating step.
  - reference: PMID:35489793
    reference_title: "Neisseria gonorrhoeae physiology and pathogenesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Other adhesion strategies include the porin, PorB, and the phase variable outer membrane protein Opa."
    explanation: Names the additional adhesins this node carries.
- name: Opa-CEACAM Engagement and Epithelial Invasion
  biological_scale: CELLULAR
  description: >-
    Opa proteins bind CEACAM family receptors on epithelial cells, neutrophils,
    and lymphocytes, driving receptor-mediated invasion and transcytosis of the
    epithelial layer. CEACAM engagement is not obligatory - Opa-expressing
    gonococci can also adhere to and invade genital epithelial cells by a
    CEACAM-independent route - so this node models the dominant pathway rather
    than the only one.
  cell_types:
  - preferred_term: epithelial cell
    term:
      id: CL:0000066
      label: epithelial cell
  biological_processes:
  - preferred_term: symbiont entry into host
    term:
      id: GO:0044409
      label: symbiont entry into host
    modifier: INCREASED
  downstream:
  - target: Neutrophil Influx and Immunopathological Tissue Damage
    description: >-
      Epithelial invasion provokes the acute inflammatory response that
      produces the clinical disease.
    causal_link_type: DIRECT
  - target: Ascending Genital Tract Infection and Tubal Damage
    description: >-
      Invasion of the endocervical epithelium permits upward spread to the
      upper genital tract.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21204865
    reference_title: "Opa proteins and CEACAMs: pathways of immune engagement for pathogenic Neisseria."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These Opa variants are able to bind to different receptors of the CEACAM family on epithelial cells, neutrophils, and T and B lymphocytes, influencing the innate and adaptive immune responses."
    explanation: >-
      Establishes Opa-CEACAM binding across the cell types this node names.
      Evidence source is OTHER because the citation is a review.
  - reference: PMID:11580753
    reference_title: "CEACAM is not necessary for Neisseria gonorrhoeae to adhere to and invade female genital epithelial cells."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "when CEACAM is expressed, Opa+ gonococci exploit it for the adherence to and invasion of these cells."
    explanation: >-
      PARTIAL, and deliberately included as a qualifier rather than a support:
      it establishes that the CEACAM route is not obligatory, which is why this
      node is worded as the dominant pathway rather than the only one.
- name: Pilin and Opa Antigenic and Phase Variation
  biological_scale: MOLECULAR
  role: immune_evasion
  description: >-
    Pilin undergoes high-frequency antigenic variation by recombination with
    silent pilS loci, and the Opa paralogs undergo phase variation by
    slipped-strand mispairing. The resulting within-host antigenic diversity
    keeps the adaptive response chasing a moving target. This is the direct
    mechanistic counterpart of TprK gene conversion in Treponema pallidum - the
    same evolutionary solution reached by an unrelated organism.
  downstream:
  - target: Absence of Protective Immunity and Reinfection
    description: >-
      Continuous surface-antigen turnover prevents the development of
      protective immune memory.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21204865
    reference_title: "Opa proteins and CEACAMs: pathways of immune engagement for pathogenic Neisseria."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "These Opa variants are able to bind to different receptors of the CEACAM family on epithelial cells, neutrophils, and T and B lymphocytes, influencing the innate and adaptive immune responses."
    explanation: >-
      PARTIAL: establishes the existence of multiple Opa variants engaging
      immune cells, the substrate on which phase variation acts, without
      describing the variation mechanism itself.
  notes: >-
    The pilS recombination and slipped-strand mispairing mechanisms are
    described in the deep-research report but no cached source in this entry
    quotes them directly, so they are asserted in the description without a
    dedicated evidence item rather than propped up by an off-target quote.
- name: Lipooligosaccharide Sialylation and Complement Evasion
  biological_scale: MOLECULAR
  role: immune_evasion
  description: >-
    The gonococcus sialylates its lipooligosaccharide using host-derived
    CMP-N-acetylneuraminic acid, masking the molecule and blocking complement
    activation and opsonophagocytic killing. This serum resistance is what
    permits survival in the bloodstream during dissemination.
  biological_processes:
  - preferred_term: complement activation
    term:
      id: GO:0006956
      label: complement activation
    modifier: DECREASED
  downstream:
  - target: Anti-Phagocytic Survival Within Neutrophils
    description: >-
      Blocking opsonization is the first half of escaping phagocytic clearance.
    causal_link_type: DIRECT
  - target: Haematogenous Dissemination
    description: Serum resistance is the precondition for bloodstream survival.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:35489793
    reference_title: "Neisseria gonorrhoeae physiology and pathogenesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The gonococcus is able to subvert complement mediated killing and opsonisation by sialylation of its lipooligosaccharide and deploys a series of anti-phagocytic mechanisms."
    explanation: >-
      Directly states LOS sialylation as the mechanism subverting complement
      killing and opsonization.
- name: Anti-Phagocytic Survival Within Neutrophils
  biological_scale: CELLULAR
  role: immune_evasion
  description: >-
    The organism deploys a series of anti-phagocytic mechanisms that allow it
    to survive within neutrophils rather than be killed by them. The cells
    recruited to clear the infection become a niche for it, which is why a
    florid neutrophilic exudate coexists with persistent viable organisms.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  downstream:
  - target: Neutrophil Influx and Immunopathological Tissue Damage
    description: >-
      Failure of neutrophil killing sustains the inflammatory response that
      damages host tissue.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:35489793
    reference_title: "Neisseria gonorrhoeae physiology and pathogenesis."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The gonococcus is able to subvert complement mediated killing and opsonisation by sialylation of its lipooligosaccharide and deploys a series of anti-phagocytic mechanisms."
    explanation: Establishes the anti-phagocytic mechanisms this node represents.
- name: Neutrophil Influx and Immunopathological Tissue Damage
  biological_scale: TISSUE
  description: >-
    Gonococcal pathology is substantially immunopathological rather than
    directly cytotoxic. Sustained neutrophil influx that fails to clear the
    organism releases reactive oxygen species, proteases, and defensins that
    damage the host mucosa, producing the purulent discharge that is the
    clinical hallmark of infection.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: neutrophil degranulation
    term:
      id: GO:0043312
      label: neutrophil degranulation
    modifier: INCREASED
  downstream:
  - target: Urethritis
    description: Neutrophilic urethral inflammation produces purulent discharge and dysuria.
    causal_link_type: DIRECT
  - target: Cervicitis
    description: Neutrophilic endocervical inflammation produces mucopurulent cervicitis.
    causal_link_type: DIRECT
  - target: Abnormal vaginal discharge
    description: Cervical inflammatory exudate presents as abnormal discharge.
    causal_link_type: DIRECT
  - target: Dysuria
    description: Urethral inflammation causes painful micturition.
    causal_link_type: DIRECT
  - target: Epididymitis
    description: Retrograde spread from the urethra inflames the epididymis.
    causal_link_type: DIRECT
  - target: Pharyngitis
    description: >-
      Pharyngeal colonization may produce inflammation, though it is usually
      asymptomatic.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:35489793
    reference_title: "Neisseria gonorrhoeae physiology and pathogenesis."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "The gonococcus is able to subvert complement mediated killing and opsonisation by sialylation of its lipooligosaccharide and deploys a series of anti-phagocytic mechanisms."
    explanation: >-
      PARTIAL: supports the failure of phagocytic clearance that sustains the
      neutrophil influx, rather than the tissue-damage step itself.
- name: Absence of Protective Immunity and Reinfection
  biological_scale: ORGANISM
  description: >-
    Because surface antigens vary continuously and the organism subverts both
    complement and phagocytic killing, infection does not generate protective
    immunity. Reinfection after treatment is the rule rather than the
    exception, which is the central obstacle to both control and vaccine
    development.
  evidence:
  - reference: PMID:35642527
    reference_title: "Prevention of Neisseria gonorrhoeae With Meningococcal B Vaccine: A Matched Cohort Study in Southern California."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Prior observational studies have suggested that OMV-based meningococcal serogroup B vaccines confer protection against gonorrhea."
    explanation: >-
      PARTIAL: the reliance on a cross-protective meningococcal vaccine, in the
      absence of any gonorrhea-specific one, reflects the immunological problem
      this node describes without stating it directly.
- name: Ascending Genital Tract Infection and Tubal Damage
  biological_scale: TISSUE
  description: >-
    Spread from the endocervix to the endometrium and fallopian tubes produces
    salpingitis and pelvic inflammatory disease. Inflammatory damage to the
    tubal epithelium causes ciliated-cell loss, scarring, and eventual
    occlusion - the substrate for tubal-factor infertility and ectopic
    pregnancy.
  downstream:
  - target: Salpingitis
    description: Direct inflammation of the fallopian tube.
    causal_link_type: DIRECT
  - target: Female infertility
    description: Tubal scarring and occlusion cause tubal-factor infertility.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Ectopic pregnancy
    description: >-
      Tubal scarring impairs ovum transport, predisposing to tubal
      implantation.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Pelvic pain
    description: Chronic post-inflammatory change produces chronic pelvic pain.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Perihepatitis
    description: >-
      Transperitoneal spread from the tubes to the hepatic capsule produces
      the Fitz-Hugh-Curtis syndrome.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:12346974
    reference_title: "Immunopathogenesis of pelvic inflammatory disease and infertility -- what do we know and what shall we do?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chlamydia trachomatis, Neisseria gonorrhoeae, or both cause PID in at least 50% of cases."
    explanation: >-
      Directly attributes at least half of pelvic inflammatory disease to
      N. gonorrhoeae and C. trachomatis, the causal step this node asserts.
- name: Haematogenous Dissemination
  biological_scale: ORGANISM
  description: >-
    Serum-resistant strains that survive in the bloodstream seed distant sites,
    producing disseminated gonococcal infection - the classic triad of
    migratory polyarthralgia, tenosynovitis, and pustular dermatitis, with
    frank septic arthritis in a subset. Terminal complement pathway deficiency
    removes the principal bactericidal barrier and is a recognized host risk
    factor for recurrent or disseminated disease.
  genes:
  - preferred_term: CFI
    term:
      id: hgnc:5394
      label: CFI
  - preferred_term: C6
    term:
      id: hgnc:1339
      label: C6
  - preferred_term: C7
    term:
      id: hgnc:1346
      label: C7
  - preferred_term: C9
    term:
      id: hgnc:1358
      label: C9
  - preferred_term: CFH
    term:
      id: hgnc:4883
      label: CFH
  downstream:
  - target: Arthritis
    description: Seeding of joints produces gonococcal septic arthritis.
    causal_link_type: DIRECT
  - target: Tenosynovitis
    description: Seeding of tendon sheaths produces the tenosynovitis of the DGI triad.
    causal_link_type: DIRECT
  - target: Skin rash
    description: Seeding of skin produces the pustular dermatitis of the DGI triad.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:6415361
    reference_title: "Disseminated gonococcal infection: a prospective analysis of 49 patients and a review of pathophysiology and immune mechanisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There were 19 cases of suppurative arthritis (Group II) and 30 cases with only tenosynovitis, skin lesions, or both (Group I)."
    explanation: >-
      Quantifies the manifestation split across 49 prospectively studied
      patients, supporting all three downstream phenotypes of this node -
      arthritis, tenosynovitis, and skin lesions.
  - reference: PMID:41607490
    reference_title: "Disseminated gonococcal infection secondary to a rare homozygous mutation resulting in complement factor I deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complement studies showed low total (CH50) and alternative pathway (AP50) activity and low levels of all alternative and terminal complement proteins and the complement inhibitors factor H and factor I (FI), suggesting uninhibited complement activation and complement consumption."
    explanation: >-
      Documents a complement-deficient host developing disseminated infection,
      supporting complement integrity as the barrier whose loss permits
      dissemination.
- name: Perinatal Conjunctival Inoculation
  biological_scale: TISSUE
  description: >-
    Passage through an infected birth canal inoculates the neonatal
    conjunctiva, producing a hyperacute purulent conjunctivitis that can
    perforate the cornea and blind the infant within days if untreated. This is
    the rationale for universal neonatal ocular prophylaxis.
  downstream:
  - target: Conjunctivitis
    description: Conjunctival infection produces gonococcal ophthalmia neonatorum.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:8771523
    reference_title: "The influence of perinatal infective factors on ophthalmia neonatorum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ophthalmia neonatorum still blinds approximately 10,000 babies annually worldwide."
    explanation: >-
      Quantifies the blindness burden that makes perinatal conjunctival
      inoculation clinically consequential.
- name: Gonococcal Penicillin-Binding Protein Cross-Linking (Ceftriaxone Target)
  biological_scale: MOLECULAR
  role: therapeutic_vulnerability
  conforms_to: "bacterial_cell_wall_synthesis_inhibition#Peptidoglycan Cross-Linking by Penicillin-Binding Proteins"
  description: >-
    Gonococcal peptidoglycan cross-linking by penicillin-binding proteins is
    the target of ceftriaxone, the sole remaining recommended first-line agent.
    Beta-lactam acylation of the PBP active site halts cross-linking and is
    bactericidal.
  biological_processes:
  - preferred_term: peptidoglycan-based cell wall biogenesis
    term:
      id: GO:0009273
      label: peptidoglycan-based cell wall biogenesis
    modifier: DECREASED
  downstream:
  - target: penA Mosaic Alleles and Cephalosporin Resistance
    description: >-
      Alteration of the PBP2 target reduces beta-lactam binding affinity.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:35416971
    reference_title: "Management of Neisseria gonorrhoeae in the United States: Summary of Evidence From the Development of the 2020 Gonorrhea Treatment Recommendations and the 2021 Centers for Disease Control and Prevention Sexually Transmitted Infection Treatment Guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 2021 CDC STI Treatment Guidelines now recommend 500mg ceftriaxone intramuscularly once for the treatment of uncomplicated gonorrhea at all anatomic sites."
    explanation: >-
      Establishes ceftriaxone as the recommended first-line agent acting on
      this target.
- name: penA Mosaic Alleles and Cephalosporin Resistance
  biological_scale: MOLECULAR
  role: resistance_mechanism
  conforms_to: "bacterial_cell_wall_synthesis_inhibition#Acquired Resistance and Drug Inactivation"
  description: >-
    Mosaic penA alleles encode an altered penicillin-binding protein 2 with
    reduced beta-lactam binding affinity, giving reduced susceptibility or
    frank resistance to extended-spectrum cephalosporins. Mosaic alleles are
    assembled by horizontal transfer from commensal Neisseria species carried
    in the oropharynx, which makes pharyngeal infection an important site of
    resistance emergence. Ceftriaxone MICs have so far remained stable in US
    surveillance, but resistant strains have been reported internationally.
  biological_processes:
  - preferred_term: response to antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
    modifier: INCREASED
  evidence:
  - reference: PMID:35416971
    reference_title: "Management of Neisseria gonorrhoeae in the United States: Summary of Evidence From the Development of the 2020 Gonorrhea Treatment Recommendations and the 2021 Centers for Disease Control and Prevention Sexually Transmitted Infection Treatment Guidelines."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GISP data suggest that ceftriaxone minimal inhibitory concentrations (MICs) have remained stable in the United States"
    explanation: >-
      Gives the current US surveillance position on ceftriaxone susceptibility
      that this resistance node tracks against.
  notes: >-
    The specific molecular mechanism - mosaic penA encoding an altered PBP2,
    and horizontal acquisition from commensal Neisseria - is described in the
    deep-research report but is not quoted by any source cached in this entry.
    It is asserted in the description without a dedicated evidence item rather
    than supported by an off-target quote. A dedicated penA reference would
    strengthen this node.

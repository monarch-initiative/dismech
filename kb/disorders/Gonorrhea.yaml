- category: Gastrointestinal
  name: Perihepatitis
  description: >-
    The Fitz-Hugh-Curtis syndrome is perihepatitis complicating gonococcal
    pelvic infection, in which fibrinous inflammation over the liver capsule
    organizes into characteristic violin-string adhesions between the liver
    surface and the parietal peritoneum. It presents as right upper quadrant
    pain and is a classic mimic of biliary disease.
  phenotype_term:
    preferred_term: Fitz-Hugh-Curtis perihepatitis
  evidence:
  - reference: PMID:6769152
    reference_title: "[Gonorrhoic perihepatitis. Fitz-Hugh-Curtis syndrome]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Fitz-Hugh--Curtis syndrome is an extragenital manifestation of gonorrhea, characterized by fibrinous inflammation of the subphrenic area with violinstring-like adhesions between the liver surface and the parietal peritoneum."
    explanation: >-
      Defines the syndrome, its gonococcal aetiology, and the adhesion
      morphology this phenotype records.
  notes: >-
    No term binding: HPO has no perihepatitis or Fitz-Hugh-Curtis term, so a
    free-text preferred_term is used rather than forcing a broader hepatic or
    peritoneal term that would misdescribe the lesion. Candidate for an HPO
    new-term request.
- category: Constitutional
  name: Asymptomatic infection
  description: >-
    Most gonococcal infection is asymptomatic, especially at rectal and
    pharyngeal sites and in women. This is not an incidental observation but
    the central epidemiological fact about the disease: it is why screening
    programmes exist, why extragenital NAAT testing matters, and why infection
    is so often first detected at the stage of complications.
  phenotype_term:
    preferred_term: Asymptomatic infection
  evidence:
  - reference: PMID:15653780
    reference_title: "Sexually transmitted infections and increased risk of co-infection with human immunodeficiency virus."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "However, most sexually transmitted infections (STIs) are asymptomatic-contributing to underdiagnosis estimated at 50% or more."
    explanation: >-
      PARTIAL: establishes that most STIs are asymptomatic and that this drives
      underdiagnosis. The statement is across STIs rather than specific to
      gonorrhea, so it supports the pattern rather than a gonorrhea-specific
      proportion.
  notes: >-
    No term binding: HPO has no term for asymptomatic infection, which is an
    absence of phenotype rather than a phenotypic abnormality. Curated with a
    free-text preferred_term because omitting it entirely would misrepresent
    the disease.

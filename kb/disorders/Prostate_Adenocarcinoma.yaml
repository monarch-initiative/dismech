discussions:
- discussion_id: hmm_prostate_microbial_androgen_biosynthesis_castration_resistance
  prompt: >-
    In mice, gut commensals expand under androgen deprivation and supply an
    alternative source of active androgens: antibiotic ablation of the gut
    microbiota delays the emergence of castration resistance, and fecal
    transplant from castration-resistant donors confers it. In humans the same
    axis is so far only an association - the intestinal community of patients
    with castration-resistant prostate cancer is enriched for
    androgen-converting species, with no interventional human evidence. Does
    microbial
    androgen biosynthesis contribute to castration resistance in human prostate
    cancer, or is the mouse dependency amplified by a host in which adrenal
    androgen production is negligible?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Androgen Receptor Signaling Dependence
  - pathophysiology#Signaling Bypass and Castration Resistance
  - treatments#Androgen Deprivation Therapy
  rationale: >-
    This entry curates castration resistance as a tumor-intrinsic bypass - AR
    amplification, AR splice variants, and intratumoral steroidogenesis. The
    mouse evidence adds a host-external route the pathograph does not represent:
    the gut community itself converting circulating androgen precursors into
    active androgens, restoring ligand to the receptor the therapy was meant to
    starve. What keeps this from being curated as a mechanism node is a
    species difference that is mechanistically load-bearing rather than
    incidental. Mice produce little adrenal androgen, so a microbial
    precursor-conversion route faces little host competition there; in castrated
    men, adrenal DHEA and androstenedione remain a substantial precursor pool
    that intratumoral steroidogenesis already exploits, which is the rationale
    for abiraterone. A microbial contribution in humans therefore has to be
    shown to be non-redundant with a pathway this entry already models, not
    merely present. The human data reported alongside the mouse experiments are
    observational, and the cross-disease review that prompted this discussion
    still describes microbial metabolism of host hormonal precursors as
    hypothesized rather than established for endocrine-therapy resistance. Until
    a human intervention separates the two sources, an edge from a microbial
    node into castration resistance would assert translational validity that the
    evidence does not yet carry.
  proposed_experiments:
  - experiment_id: exp_prostate_microbial_androgen_conversion_human_intervention
    name: Human test of whether gut microbial androgen conversion is non-redundant with adrenal precursor supply
    description: >-
      In men starting androgen deprivation therapy, serially profile the fecal
      metagenome for androgen-converting gene content alongside serum and fecal
      steroid metabolomics, and test whether microbial conversion capacity
      predicts time to castration resistance independently of adrenal precursor
      levels. Nest a randomized microbiota-directed intervention (a
      narrow-spectrum antimicrobial or defined live biotherapeutic selected
      against the converting taxa) within the cohort, stratified by baseline
      adrenal androgen level, so that a microbial effect can be distinguished
      from the adrenal-precursor route that abiraterone already targets.
    experiment_type:
      preferred_term: randomized microbiota-directed intervention nested in a prospective cohort
    readouts:
    - name: Microbial androgen-conversion capacity and time to castration resistance
      target: pathophysiology#Signaling Bypass and Castration Resistance
      description: >-
        Association between baseline and on-treatment fecal androgen-converting
        gene content and time to biochemical castration resistance, adjusted for
        serum adrenal androgen precursors.
      assays:
      - preferred_term: shotgun metagenomic sequencing
      - preferred_term: targeted steroid mass spectrometry
    - name: Circulating active androgen after microbiota-directed intervention
      target: pathophysiology#Androgen Receptor Signaling Dependence
      description: >-
        Change in serum testosterone and dihydrotestosterone in the
        intervention arm relative to control, within adrenal-androgen strata.
      assays:
      - preferred_term: targeted steroid mass spectrometry
      direction: DECREASED
    decision_criterion: >-
      Translational validity is supported if microbial androgen-conversion
      capacity predicts earlier castration resistance independently of adrenal
      precursor levels AND the microbiota-directed intervention lowers active
      androgen and delays resistance in men with low adrenal androgen output. It
      is not supported if the association disappears after adjustment for
      adrenal precursors, or if the intervention alters community composition
      without changing androgen levels or outcome - in which case the mouse
      result should stay flagged as model-specific.
    would_support:
    - pathophysiology#Signaling Bypass and Castration Resistance
  evidence:
  - reference: PMID:34618582
    reference_title: "Commensal bacteria promote endocrine resistance in prostate cancer through androgen biosynthesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Ablation of the gut microbiota by antibiotic therapy delayed the emergence
      of castration resistance even in immunodeficient mice.
    explanation: >-
      The causal arm of the claim, and it is entirely murine: removing the
      microbiota changes the timing of castration resistance in mice.
  - reference: PMID:34618582
    reference_title: "Commensal bacteria promote endocrine resistance in prostate cancer through androgen biosynthesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Fecal microbiota transplantation (FMT) from CRPC mice and patients
      rendered mice harboring prostate cancer resistant to castration.
    explanation: >-
      Transfer experiment establishing sufficiency - but the readout organism is
      the mouse, including for the human-donor material, so it does not close
      the translational question.
  - reference: PMID:34618582
    reference_title: "Commensal bacteria promote endocrine resistance in prostate cancer through androgen biosynthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Specifically, the intestinal microbial community in mice and patients with
      CRPC was enriched for species capable of converting androgen precursors
      into active androgens.
    explanation: >-
      The human arm of the finding. The quoted sentence spans both mouse and
      patient cohorts and is tagged here for its human component, which is
      observational enrichment only - no human intervention was performed.
  - reference: PMID:42426614
    reference_title: "Microbiota-mediated modulation of the tumor microenvironment in urological cancers: crosstalk between gut and intratumoral microbiota."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Microbial metabolic pathways are also implicated in therapeutic
      resistance; microbial metabolism of host hormonal precursors is
      hypothesized as one mechanism contributing to resistance to endocrine
      therapies.
    explanation: >-
      A 2026 cross-disease review still frames this route as hypothesized rather
      than established for endocrine-therapy resistance, which is the
      field-level statement of the mismatch recorded here.
  notes: >-
    Recorded from monarch-initiative/dismech#6383. Typed HUMAN_MODEL_MISMATCH
    rather than KNOWLEDGE_GAP because the evidence is not absent - it is strong
    and causal in mice, and the open question is whether it transfers to human
    castration resistance. The PMID:42426614 item carries `evidence_source:
    OTHER` because that publication is a narrative review making a field-level
    synthesis claim rather than reporting primary data; see
    monarch-initiative/dismech#8184.
definitions:
- name: 13-CMB AI morphometric predictor of neoadjuvant ADT response
  definition_type: PHENOTYPE_ALGORITHM
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    A computable, image-derived predictor that classifies a prostate
    adenocarcinoma needle biopsy as a likely responder or non-responder to
    neoadjuvant androgen deprivation therapy (NADT) — the terminology used in
    the source publication. Inputs are the abundance
    levels of 13 cellular morphometric biomarkers (CMBs) — unsupervised,
    machine-learned cell-appearance prototypes extracted from H&E whole-slide
    images by the CMB-ML pipeline (stacked predictive sparse decomposition), NOT
    named histopathology findings — combined by a LASSO regression into a
    continuous treatment-resistance score that is dichotomized into responder
    versus non-responder. The predictor operationalizes the split
    that this entry's "Signaling Bypass and Castration Resistance" node captures:
    the non-responder state it flags converges on PI3K/AKT/mTORC1-hyperactive
    adaptive resistance (see conforms_to on that node,
    mtor_androgen_deprivation_resistance), which is why it also predicts
    potential benefit from adding an mTOR inhibitor in non-responders.
  scope: >-
    Research-grade, imaging-derived treatment-response predictor from routine
    H&E needle-biopsy whole-slide images. This is NOT an OHDSI/OMOP EHR
    case-finding query and NOT a consensus/validated clinical phenotype; it is a
    published AI biomarker validated retrospectively across independent cohorts.
    The 13 CMBs are latent learned features (cluster prototypes), so they are not
    individually ontology-mappable to NCIT histopathology terms; the biological
    correlates and the mTOR-resistance mechanism are what carry ontology grounding
    (on the pathophysiology nodes and the conformed module).
  attaches_to:
  - pathophysiology#Signaling Bypass and Castration Resistance
  validation_status:
    status: UNVALIDATED
    rationale: >-
      Executed and evaluated against treatment-response and outcome reference
      standards across four cohorts, but not against a prospective/consensus gold
      standard, so it is beyond PROPOSED yet short of VALIDATED_AGAINST_GOLD_STANDARD.
      Reported performance: AUC 0.981 for NADT-plus-enzalutamide response in the
      NCT02430480 training cohort (n = 37); significant stratification of pathologic
      complete response (p = 0.0005) and biochemical recurrence-free survival
      (p = 0.024) in an independent hospital cohort (n = 122); BCRFS (p = 0.031) in a
      second hospital cohort (n = 60); and progression-free survival (p = 0.0017) in
      TCGA-PRAD (n = 396), remaining significant and independent after adjustment
      for established clinical factors and the Decipher and Oncotype DX genomic
      biomarkers. Key limitations that keep it UNVALIDATED as a clinical assay:
      small training cohort (n = 37); validation confined to two independent
      hospital cohorts plus a public genomic cohort; and no prospective evaluation
      reported, the publication positioning the model as one that "could
      potentially serve as a robust solution for precision management".
  evidence:
  - reference: PMID:41887393
    reference_title: "AI-discovered cellular morphometric biomarkers in needle biopsy of prostate cancer predict neoadjuvant androgen deprivation therapy response and enable therapeutic targeting of mTOR in androgen deprivation therapy-resistant tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified 13 cellular morphometric biomarkers (CMBs), as a New Approach
      Methodology (NAM), from whole slide images of needle biopsies in clinical
      trial specimens (NCT02430480, n = 37) that accurately predicted response to
      neoadjuvant androgen deprivation therapy (NADT) plus enzalutamide
    explanation: >-
      Establishes the 13-CMB LASSO model as an AI predictor of NADT response
      derived from H&E whole-slide images of needle biopsies in the trial cohort.
  - reference: PMID:41887393
    reference_title: "AI-discovered cellular morphometric biomarkers in needle biopsy of prostate cancer predict neoadjuvant androgen deprivation therapy response and enable therapeutic targeting of mTOR in androgen deprivation therapy-resistant tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the 13-CMB model stratified PCa patients into responders and non-responders
      after NADT across two independent hospital cohorts.
    explanation: >-
      Supports independent-cohort validation of the responder/non-responder
      stratification this definition operationalizes.
  - reference: PMID:41887393
    reference_title: "AI-discovered cellular morphometric biomarkers in needle biopsy of prostate cancer predict neoadjuvant androgen deprivation therapy response and enable therapeutic targeting of mTOR in androgen deprivation therapy-resistant tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the 13-CMB model demonstrated significant and independent clinical value
      after adjustment for established clinical factors and commonly used genomic
      biomarkers, including Decipher and Oncotype DX.
    explanation: >-
      Supports the claim that the predictor adds value independent of standard
      clinical factors and the Decipher/Oncotype DX genomic assays.
  - reference: PMID:41887393
    reference_title: "AI-discovered cellular morphometric biomarkers in needle biopsy of prostate cancer predict neoadjuvant androgen deprivation therapy response and enable therapeutic targeting of mTOR in androgen deprivation therapy-resistant tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CMBs accurately predicted the molecular differences between stratified
      patient groups and the potential benefit from mTOR inhibitors in
      non-responders, which were validated through IHC staining and
      patient-derived organoids (n = 8), respectively.
    explanation: >-
      Grounds the attaches_to link to the resistance node and the
      mtor_androgen_deprivation_resistance module: the non-responder
      state predicts benefit from mTOR inhibition, validated by IHC and
      patient-derived organoids.
  notes: >-
    Schema-fit caveat (design-register item): dismech's derivation_basis enum has
    no value for an empirically-derived AI/imaging predictor. ESTABLISHED_CRITERIA
    is used here under its "validated computable phenotype" clause because the
    model is a published, cohort-validated computable predictor; its research-grade,
    not-yet-gold-standard maturity is carried separately (and honestly) by
    validation_status: UNVALIDATED. definition_type PHENOTYPE_ALGORITHM is likewise
    the closest available bucket — the model is a computable predictive algorithm,
    but on H&E whole-slide-image features rather than OMOP/EHR case-finding logic,
    so it cannot be expressed as inline criteria_sets. Provenance: Yan et al.,
    Cancer Letters 647 (2026) 218447, doi:10.1016/j.canlet.2026.218447, trial
    NCT02430480. A dedicated imaging/ML-biomarker definition_type and an
    EMPIRICAL_MODEL derivation_basis are proposed follow-ups for the design register.
notes: >-
  Localized prostate adenocarcinoma is frequently indolent enough for risk-adapted
  surveillance, but progression can produce metastatic and castration-resistant
  states with strong bone tropism and increasing pathway heterogeneity. The
  former Metastatic_Prostate_Cancer entry was folded into this entry's Metastatic
  stage (design decisions §3a);
  [`BRCA_Mutant_Prostate_Cancer.yaml`](kb/disorders/BRCA_Mutant_Prostate_Cancer.yaml)
  remains a separate molecularly defined entry.

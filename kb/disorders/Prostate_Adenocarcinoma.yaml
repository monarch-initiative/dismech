review_notes: >-
  From the folded Metastatic_Prostate_Cancer entry: its environmental section was
  removed. Its only entry was "Older age", which is a property of the patient
  rather than something the patient is exposed to, and which ECTO and XCO have no
  term for by design. Per dismech#8551 an age association belongs in a prevalence
  population stratifier; the entry carried no citation to carry across, so nothing
  was migrated and no new claim was manufactured.

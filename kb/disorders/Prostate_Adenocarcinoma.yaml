datasets:
- accession: ega:EGAS00001000451
  title: Plasma-Seq of patients with metastatic prostate cancer
  description: Study 1 In this study we analysed patients with metastatic prostate cancer to scan their tumor genomes noninvasively in plasma DNA. We wanted to make whole-genome analysis from plasma DNA amenable to clinical routine applications and developed an approach based on a benchtop high-throughput platform, i.e. Illuminas MiSeq instrument. We performed whole-genome sequencing from plasma at a shallow sequencing depth to establish a genome-wide copy number profile of the tumor at low costs within 2 days. The genome-wide profiling in the plasma of our patients revealed multiple copy number aberrations including those previously reported in prostate tumors, such as losses in 8p and gains in 8q.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:23561577
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Metastatic Prostate Cancer"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: ega:EGAS00001000453
  title: Identification of mutations and structural rearrangements in plasma DNA form metastatic prostate cancer patients
  description: 'In this study we analysed patients with metastatic prostate cancer to scan their tumor genomes noninvasively in plasma DNA. We enriched 1.3 Mbp of seven plasma DNAs (4 CRPC cases: CRPC1-3 and CRPC5; 3 CSPC cases: CSPC1-2 and CSPC4) including exonic sequences of 55 cancer genes and 38 introns of 18 genes, where fusion breakpoints have been described using Sure Select Custom DNA Kit.'
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Metastatic Prostate Cancer"); description-level mentions were not accepted. EGA study_type: Resequencing. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: ega:EGAS00001001018
  title: Whole-genome plasma sequencing reveals focal amplifications as a driving force in metastatic prostate cancer
  description: Genomic alterations in metastatic prostate cancer remain incompletely characterized. Here we analyze 493 prostate cancer cases from the TCGA database and perform whole-genome plasma sequencing on 95 plasma samples derived from 43 patients with metastatic prostate cancer. From these samples, we identify established driver aberrations in a cancer-related gene in nearly all cases (97.7%), including driver gene fusions (TMPRSS2:ERG), driver focal deletions (PTEN, RYBP, SHQ1), and driver amplifications (AR, MYC). In serial plasma analyses, we observe changes in focal amplifications in 40% of cases.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Metastatic Prostate Cancer"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'

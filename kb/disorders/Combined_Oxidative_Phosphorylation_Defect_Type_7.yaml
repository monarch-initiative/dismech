      SPG55 (OMIM 615035) is the same gene and the same disease as COXPD7 (OMIM 613559),
      registered separately because the two OMIM entries were minted from different first
      reports - Antonicka 2010 from a Leigh-like encephalomyopathy, Shimazaki 2012 from a
      spastic paraplegia. Both are biallelic truncating MTRFR, both sit inside the optic
      atrophy plus axonal neuropathy plus spastic paraparesis triad, and the 2025
      therapeutic work calls the condition MTRFR deficiency without using either number.

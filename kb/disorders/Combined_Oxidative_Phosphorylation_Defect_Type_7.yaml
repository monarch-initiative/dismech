mechanistic_hypotheses:
- hypothesis_group_id: mitoribosome_rescue_failure_model
  hypothesis_label: Failed mitoribosome rescue causing a global mitochondrial translation defect
  status: CANONICAL
  description: >-
    MTRFR is a member of the mitochondrial class I peptide release factor family and carries the
    GGQ motif those factors use, but it does not hydrolyse peptidyl-tRNA on bacterial ribosomes
    in vitro, so it is not a conventional stop-codon release factor. Structural work on stalled
    mitoribosomes places it in a quality-control pathway instead: MTRFR ejects the nascent chain
    from a mitoribosome that has stalled during elongation, while a partner protein ejects the
    peptidyl-tRNA. Losing that rescue step leaves ribosomes occupied, and the measured
    consequence in patient fibroblasts is a global and uniform decrease in mitochondrial
    translation, with no reduction in mitochondrial mRNAs, tRNAs, rRNAs, elongation factors or
    ribosomal proteins - so it is the process that fails, not its substrates or machinery.
  evidence:
  - reference: PMID:33243891
    reference_title: "Elongational stalling activates mitoribosome-associated quality control."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Release factor homolog C12orf65 (mtRF-R) and RNA binding protein C6orf203 (MTRES1) eject the nascent chain and peptidyl transfer RNA (tRNA), respectively, from stalled ribosomes."
    explanation: >-
      The molecular job, resolved by cryo-electron microscopy of trapped rescue intermediates.
      This is what makes MTRFR a rescue factor rather than a termination factor.
  - reference: PMID:20598281
    reference_title: "Mutations in C12orf65 in patients with encephalomyopathy and a mitochondrial translation defect."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, C12orf65 does not exhibit peptidyl-tRNA hydrolase activity in an in vitro assay with bacterial ribosomes."
    explanation: >-
      The negative biochemical result that ruled out conventional release-factor activity and
      pointed towards the rescue role later confirmed structurally.
  - reference: PMID:20598281
    reference_title: "Mutations in C12orf65 in patients with encephalomyopathy and a mitochondrial translation defect."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We suggest that it might play a role in recycling abortive peptidyl-tRNA species, released from the ribosome during the elongation phase of translation."
    explanation: >-
      The hypothesis the founding paper proposed from the translation data alone, ten years
      before the structures confirmed it.
pathophysiology:
- name: MTRFR Biallelic Loss of Function
  description: >-
    Biallelic truncating MTRFR alleles. The reported spectrum is uniformly null: nonsense,
    frameshift and splice-site changes, including one synonymous variant that acts as a
    frameshift by abolishing a splice site and retaining an intron. Eleven distinct pathogenic
    variants were catalogued across the first 27 reported patients.

    Position within the protein carries the severity. The GGQ-containing domain is encoded by
    the first coding exon, and truncations that disrupt it are expected to be more severe;
    C-terminal truncations, which leave more of the protein intact, tend to spare cognition.
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  genes:
  - preferred_term: MTRFR
    term:
      id: hgnc:26784
      label: MTRFR
  downstream:

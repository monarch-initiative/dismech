  evidence:
  - reference: PMID:20598281
    reference_title: "Mutations in C12orf65 in patients with encephalomyopathy and a mitochondrial translation defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified a 1 bp deletion in C12orf65 in one patient, and DNA sequence analysis showed a different 1 bp deletion in the second patient."
    explanation: >-
      The two founding alleles, from unrelated pedigrees, both single-base deletions predicting
      the same premature stop.
  - reference: PMID:24424123
    reference_title: "Delineation of C12orf65-related phenotypes: a genotype-phenotype relationship."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, a clear genotype-phenotype correlation is anticipated in which deleterious mutations which disrupt the GGQ-containing domain in the first coding exon are expected to result in a more severe phenotype, whereas down-stream C-terminal mutations may result in a more favorable phenotype, typically lacking cognitive impairment."
    explanation: >-
      The positional rule, stated with the authors' own hedge - anticipated, expected - which
      is why this entry describes it as a tendency rather than a prognostic tool.
  - reference: PMID:24080142
    reference_title: "Mutations in the mitochondrial gene C12ORF65 lead to syndromic autosomal recessive intellectual disability and show genotype phenotype correlation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Further, we confirm a genotype-phenotype correlation between increasing length of the truncated protein and decreasing severity of symptoms."
    explanation: >-
      The same rule stated in its general form - longer surviving protein, milder disease -
      from an independent family with a stop at codon 139.
- name: Failure of Mitoribosome Rescue
  description: >-
    Without MTRFR, a mitoribosome that stalls during elongation is not cleared. The nascent
    chain stays attached, the ribosome is not recycled, and the pool of ribosomes available for
    productive synthesis shrinks. This node is where the disease's specificity lies: MTRFR does
    not read stop codons, so the lesion is not a failure to finish normal proteins but a failure
    to recover from abnormal termination events.

    A sibling factor, ICT1, performs a related rescue and is additionally a structural protein
    of the mitochondrial large ribosomal subunit, which is why its loss is lethal where MTRFR
    loss is not. That difference is the reason a human can live with no MTRFR at all.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: rescue of stalled mitochondrial ribosome
    term:
      id: GO:7770016
      label: rescue of stalled mitochondrial ribosome
    modifier: DECREASED
  downstream:
  - target: Global Mitochondrial Translation Deficiency
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33243891
    reference_title: "Elongational stalling activates mitoribosome-associated quality control."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We report the discovery of a mitoribosome-associated quality control pathway that responds to interruptions during elongation, and we present structures at 3.1- to 3.3-angstrom resolution of mitoribosomal large subunits trapped during ribosome rescue."
    explanation: >-
      The pathway this node names and the structural evidence for it, at a resolution that shows
      the rescue intermediates directly.
  - reference: PMID:40376928
    reference_title: "Knockout of the mitoribosome rescue factors Ict1 or Mtrfr is viable in zebrafish but not mice: compensatory mechanisms underlying each factor's loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "ICT1 also functions as a ribosomal protein of the mitochondrial large ribosomal subunit (mtLSU) in mice and humans, and its deletion is lethal. In contrast, MTRFR does not share this role."
    explanation: >-
      Why the two rescue factors are not interchangeable, and why complete MTRFR loss is
      survivable in a person where complete ICT1 loss would not be.
- name: Global Mitochondrial Translation Deficiency
  description: >-
    Synthesis of all thirteen mitochondrially encoded polypeptides falls together, uniformly
    rather than selectively. Patient fibroblasts show that decrease directly, and the controls
    that make it interpretable are all negative: steady-state levels of mitochondrial mRNAs,
    tRNAs and rRNAs are not reduced, and neither are the mitochondrial translation elongation
    factors or the protein components of the mitoribosome. Nothing is missing from the
    apparatus; the apparatus is not turning over.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: mitochondrial translation
    term:
      id: GO:0032543
      label: mitochondrial translation
    modifier: DECREASED
  downstream:
  - target: Combined Respiratory Chain Complex Deficiency
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:20598281
    reference_title: "Mutations in C12orf65 in patients with encephalomyopathy and a mitochondrial translation defect."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The steady-state levels of mitochondrial mRNAs, tRNAs, and rRNAs were not reduced, nor were those of the mitochondrial translation elongation factors or the protein components of the mitochondrial ribosome."
    explanation: >-
      The set of negative controls that localises the defect to the translation process itself
      rather than to the availability of any of its components.
  - reference: PMID:23188110
    reference_title: "A homozygous mutation of C12orf65 causes spastic paraplegia with optic atrophy and neuropathy (SPG55)."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This mutation resulted in marked reduction of mitochondrial protein synthesis, followed by functional and structural defects in respiratory complexes I and IV."
    explanation: >-
      The same translation defect measured in fibroblasts from a patient with the spastic
      paraplegia presentation, which is what ties that clinical label to this mechanism.
- name: Combined Respiratory Chain Complex Deficiency
  description: >-
    The four complexes built partly from mitochondrially encoded subunits fail together, and
    complex II - encoded entirely in the nucleus - is spared. The pattern reported in the
    founding patients is a severe decrease in complexes I, IV and V with a smaller decrease in
    complex III. Individual patients depart from that: one had isolated complex IV deficiency
    at 40 percent of control values with complexes I, II and III normal, another had complex V
    assembly and activity reduced with a fall in respiration rate and mitochondrial membrane
    potential. A normal assay on one complex in one tissue therefore does not exclude the
    diagnosis.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex assembly
    term:
      id: GO:0033108
      label: mitochondrial respiratory chain complex assembly
    modifier: DECREASED
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  downstream:
  - target: Energy Failure in Long-Projection and Optic Neurons
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced ATP-generating capacity and mitochondrial membrane potential in cells with high and sustained energy demand
  - target: Increased Circulating Lactate
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Shift from oxidative phosphorylation to glycolysis when the respiratory chain cannot reoxidise NADH, raising the cytosolic lactate-to-pyruvate ratio
    description: >-
      The standard bioenergetic route from a respiratory chain defect to a raised lactate.
      Drawn with known intermediates rather than as direct because no study has measured the
      redox shift in an MTRFR patient; the step is the one assumed across mitochondrial
      disease, and the observation here is the endpoint - raised serum lactate and an MRS
      lactate peak - rather than the mechanism producing it.
  evidence:
  - reference: PMID:20598281
    reference_title: "Mutations in C12orf65 in patients with encephalomyopathy and a mitochondrial translation defect."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Analysis of the assembly of the oxidative phosphorylation complexes showed severe decreases of complexes I, IV, and V and a smaller decrease in complex III."
    explanation: >-
      The biochemical signature the disease is named for, and the graded pattern across the four
      affected complexes.
  - reference: PMID:24198383
    reference_title: "Novel C12orf65 mutations in patients with axonal neuropathy and optic atrophy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "complex V activity and stability (blue native gel assay), decrease in mitochondrial respiration rate and reduction of mitochondrial membrane potential."
    explanation: >-
      The bioenergetic consequences measured in patient cells from the neuropathy presentation:
      not only an assembly defect but reduced respiration and a lower membrane potential.
- name: Energy Failure in Long-Projection and Optic Neurons
  description: >-
    The clinical selectivity of COXPD7 is the selectivity of a bioenergetic disease. Retinal
    ganglion cells with long unmyelinated intraretinal axons, corticospinal tract neurons and
    long peripheral motor axons are the cells that fail, which is why the disease presents as
    optic atrophy plus spastic paraparesis plus axonal neuropathy rather than as a generalised
    encephalopathy. Nerve biopsy in one family showed loss of large myelinated and unmyelinated
    fibres, and electrophysiology in the Behr-phenotype series localised widespread lower motor
    neuron and anterior horn cell lesions.

    The cell-selectivity argument is inference. It is the standard reasoning applied to
    mitochondrial optic neuropathies and it fits the phenotype, but no study has measured
    respiratory chain function in a patient's retinal ganglion cells or corticospinal neurons,
    and the fibroblasts and lymphoblasts that were assayed are not the cells that die.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: retinal ganglion cell
    term:
      id: CL:0000740
      label: retinal ganglion cell
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron

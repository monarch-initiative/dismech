treatments:
- name: Multidisciplinary Supportive Care with Genetic Counselling
  description: >-
    There is no disease-modifying treatment. Management is supportive and multidisciplinary -
    low-vision support for the optic atrophy, physical therapy and orthoses for the spasticity
    and foot drop, and respiratory and nutritional surveillance in patients with bulbar
    involvement - together with counselling for a recessive condition carrying a 25 percent
    sibling recurrence risk.

    The mitochondrial vitamin cocktail routinely offered in mitochondrial disease has been
    given and reported not to alter the course in the severe Leigh presentation. That is a
    single patient, so it is recorded as an observation rather than as evidence against the
    practice.
  therapeutic_modality: OTHER

  - target: Global Mitochondrial Translation Deficiency
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      What the line does establish. One copy of a wild-type MTRFR transgene completely rescues
      the homozygous truncating genotype, and a partially functional transgene rescues less
      well - a dose-and-function relationship that is the argument for gene replacement being a
      coherent strategy for this gene.
    limitations: >-
      Rescue was prevention, delivered from conception by a transgene rather than to an affected
      animal. Nothing here shows that restoring MTRFR reverses established optic atrophy,
      neuropathy or spasticity, and the human diagnostic delay is a median of 17 years. The
      absence of overexpression toxicity in vivo is reassuring but was measured in animals whose
      alternative was death in utero.

  description: >-
    Biallelic truncating MTRFR variants, homozygous in consanguineous families and compound
    heterozygous otherwise. Of eleven patients pooled in one review, nine were homozygous and
    two compound heterozygous, and all the alleles were frameshift or nonsense changes.
  inheritance_term:

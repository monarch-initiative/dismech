    snippet: "C12orf65 belongs to a family of four mitochondrial class I peptide release factors, which also includes mtRF1a, mtRF1, and Ict1, all characterized by the presence of a GGQ motif at the active site."
    explanation: The protein family and the motif that defines it, from the founding paper.

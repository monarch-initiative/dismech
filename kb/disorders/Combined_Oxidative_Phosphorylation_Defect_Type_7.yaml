- name: Gene panel or exome sequencing across the mitochondrial, HSP and neuropathy panels
  description: >-
    The practical diagnostic problem in COXPD7 is not the test but the panel it sits on. The
    same gene is reached through a mitochondrial disease panel, a hereditary spastic paraplegia
    panel and an inherited neuropathy panel, and a patient presenting to any one specialty may
    be tested on a panel that omits it. The authors of the Behr series recommend screening the
    gene not only in patients with a demonstrated respiratory chain deficiency but in inherited
    peripheral neuropathies, spastic paraplegias and ataxias, especially where optic atrophy
    came first.

    Muscle biopsy and respiratory chain enzymology support the diagnosis but do not exclude it:
    the deficiency pattern varies between patients and complexes, and one reported patient had
    isolated complex IV deficiency with I, II and III normal.

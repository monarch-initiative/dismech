- name: mtrfr knockout zebrafish
  species: Zebrafish
  genotype: mtrfr -/- (CRISPR/Cas9 knockout)
  publication: PMID:40376928
  description: >-
    A viable complete null in a vertebrate, which is what the mouse cannot provide. Homozygous
    mtrfr knockout zebrafish are healthy and fertile under normal conditions. They differ from
    wild type in mitochondrial morphology in adult caudal fin cells, and their larvae survive
    starvation significantly less well - so the requirement for MTRFR shows up under
    metabolic stress rather than at baseline.
  genes:
  - preferred_term: MTRFR
    term:
      id: hgnc:26784
      label: MTRFR
  modeled_mechanisms:
  - target: Failure of Mitoribosome Rescue
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      The fish tolerates the genotype the mouse cannot and the human tolerates imperfectly, so
      it sits at the permissive extreme of a three-species range. What it contributes is a
      demonstration that losing mitoribosome rescue is survivable in a vertebrate and that the
      cost appears under stress - which is a candidate explanation for why the human disease is
      progressive and tissue-selective rather than lethal.
    limitations: >-
      Healthy and fertile knockouts do not develop optic atrophy, neuropathy or spasticity, so
      none of the disease's defining features is modelled. The authors invoke compensatory
      mechanisms specific to teleosts, including the observation that teleost Ict1 lacks the
      large-subunit binding motif found in most metazoans so that Mtrfr may partially compensate
      for Ict1 loss - a compensation structure that does not exist in humans. Whatever makes the
      fish healthy is therefore probably not what makes the human patient survive.
    readouts:
    - name: Larval survival under starvation
      target: Failure of Mitoribosome Rescue
      direction: DECREASED
      interpretation: >-
        The knockout's disadvantage is conditional: survival is reduced under starvation while
        baseline health is normal, locating the requirement for the rescue factor in metabolic
        stress.
      evidence:
      - reference: PMID:40376928
        reference_title: "Knockout of the mitoribosome rescue factors Ict1 or Mtrfr is viable in zebrafish but not mice: compensatory mechanisms underlying each factor's loss."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Additionally, the survival rates of the knockout line larvae were significantly lower than those of the wild-type larvae under starvation conditions."
        explanation: The conditional survival measurement behind this readout.
    evidence:
    - reference: PMID:40376928
      reference_title: "Knockout of the mitoribosome rescue factors Ict1 or Mtrfr is viable in zebrafish but not mice: compensatory mechanisms underlying each factor's loss."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, knockout zebrafish lines were successfully generated for both ict1 and mtrfr (ict1-/- and mtrfr-/-). Both knockout lines appeared healthy and fertile."
      explanation: >-
        The viability that makes this the only vertebrate null available, and the absence of a
        baseline phenotype that limits what it can model.
experimental_models:
- name: MTRFR-knockdown human iPSC-derived neurons with AAV9 rescue
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    Human induced pluripotent stem cell derived neurons with MTRFR knocked down, in which the
    mitochondrial phenotypes were corrected by AAV9-mediated delivery of MTRFR. This is the only
    human-cell arm of the replacement work and the only one in a neuronal cell type, which is
    the population that fails in patients.
  evidence:
  - reference: PMID:40452409
    reference_title: "Evaluating the feasibility of gene replacement strategies to treat MTRFR deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In human induced pluripotent stem cell (hiPSC)-derived knockdown neurons, mitochondrial phenotypes were corrected by AAV9-mediated delivery of MTRFR."
    explanation: >-
      The human-cell rescue, with the vector serotype that a clinical programme would use.
      Recorded as knockdown rather than knockout, which is the limitation this model carries.
discussions:
- discussion_id: mtrfr_species_tolerance_mismatch
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Mtrfr-null mice die as embryos, mtrfr-null zebrafish are healthy and fertile, and humans
    with biallelic truncating MTRFR alleles live into adult life with a progressive
    optic-atrophy-neuropathy-spasticity syndrome. What accounts for the three-way difference,
    and which species should a therapy be tested in?
  attaches_to:
  - animal_models#Mtrfr K155* knock-in mouse with human MTRFR transgene rescue
  - animal_models#mtrfr knockout zebrafish
  - pathophysiology#Failure of Mitoribosome Rescue
  rationale: >-
    This is not the ordinary complaint that a mouse model is imperfect. The mouse cannot carry
    the human genotype at all: a truncating Mtrfr allele of the same class as every reported
    human one is embryonic-lethal in homozygosity, and two independent groups have now failed to
    make a viable null line. Meanwhile the zebrafish carries the same genotype and is healthy
    and fertile, showing a deficit only under starvation. Humans sit between the two, surviving
    but degenerating slowly in three specific neuronal populations.

    The obvious explanation is compensation, and the zebrafish paper offers a concrete one for
    the fish: teleost Ict1 lacks the large-subunit binding motif that most metazoan orthologues
    carry, so Mtrfr may partially substitute for Ict1 there - a redundancy structure that does
    not exist in mammals and therefore cannot explain human survival. So the fish's tolerance is
    accounted for and the human's is not. Something lets a person live for decades without a
    mitoribosome rescue factor that a mouse embryo cannot do without, and nobody has identified
    it.

    That gap has a practical edge. The replacement strategy was necessarily tested by preventing
    a lethal embryonic phenotype in a rescued mouse, because no other mouse experiment is
    possible - there is no untreated null animal to treat. What a patient needs is the opposite
    experiment: intervention after a decade of accumulated optic atrophy and axonal loss, with a
    median diagnostic delay of 17 years between onset and molecular diagnosis. No model
    currently supports that experiment. The human iPSC-derived neurons come closest and are a
    knockdown rather than a knockout, in dissociated culture rather than in a projecting axon.

    The delivery problem underneath this is concrete rather than hypothetical, and the same
    authors name it: an intraocular approach could plausibly treat the optic neuropathy, and
    delivery to the eye would do nothing for the peripheral neuropathy. COXPD7 fails in
    retina, corticospinal tract and peripheral nerve, and no single route reaches all three.

    Answering the compensation question would do more than tidy the species table. If a
    mammalian factor partially substitutes for MTRFR in humans and not in mice, that factor is a
    therapeutic target in its own right, and one that would not require gene delivery to the
    retina and spinal cord at all.
  evidence:
  - reference: PMID:40452409
    reference_title: "Evaluating the feasibility of gene replacement strategies to treat MTRFR deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A truncating mutation (K155*) was generated in mice; however, homozygotes die embryonically whereas mice heterozygous for this K155* allele are normal."
    explanation: >-
      The mouse end of the range: a human-equivalent genotype that no mouse survives to be born
      with.
  - reference: PMID:40376928
    reference_title: "Knockout of the mitoribosome rescue factors Ict1 or Mtrfr is viable in zebrafish but not mice: compensatory mechanisms underlying each factor's loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, knockout zebrafish lines were successfully generated for both ict1 and mtrfr (ict1-/- and mtrfr-/-). Both knockout lines appeared healthy and fertile."
    explanation: The fish end of the range, with the same genotype and no baseline phenotype.
  - reference: PMID:40376928
    reference_title: "Knockout of the mitoribosome rescue factors Ict1 or Mtrfr is viable in zebrafish but not mice: compensatory mechanisms underlying each factor's loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Ict1 proteins from all teleosts, including zebrafish, lack the N-terminal mtLSU-binding motif found in most metazoans, suggesting that Ict1 does not function as a ribosomal protein in teleosts. Thus, Mtrfr may partially compensate for the loss of Ict1."
    explanation: >-
      The compensation mechanism proposed for the fish, which by its own terms cannot apply to
      humans and so leaves human tolerance unexplained.
  - reference: PMID:40452409
    reference_title: "Evaluating the feasibility of gene replacement strategies to treat MTRFR deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "An analogous approach could be feasible for treating the optic neuropathy associated with MTRFR deficiency; however, delivery directly to the eye would not treat the peripheral neuropathy and other symptoms of MTRFR deficiency."
    explanation: >-
      The delivery constraint the authors state themselves, and the practical reason the
      species-tolerance question matters: a route that reaches the eye does not reach the
      peripheral nerve, and this disease needs both.
  - reference: PMID:39962784
    reference_title: "[Combined oxidative phosphorylation deficiency type 7 caused by C12orf65 gene mutations: a case report and literature review]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "The age of onset ranged from 1 day to 2 years, and clinical manifestations included optic nerve atrophy and delays in intellectual and motor development."
    explanation: >-
      The human end of the range: postnatal onset of a progressive disease, not embryonic death.
      Indirect with respect to the species comparison, which no single study makes.
  proposed_experiments:
  - experiment_id: exp_coxpd7_compensation_screen_and_delayed_rescue
    name: Identify the human compensating factor, and test delayed MTRFR restoration
    description: >-
      Two linked arms. First, compare the mitoribosome quality control machinery of human,
      mouse and zebrafish cells depleted of MTRFR - quantitative proteomics of the mitoribosome
      and its associated factors, plus a CRISPR modifier screen in human MTRFR-null cells for
      genes whose additional loss becomes lethal - to identify what substitutes in humans and
      not in mice. Second, in human iPSC-derived retinal ganglion cells and motor neurons
      carrying a patient GGQ-domain truncating allele rather than a knockdown, allow the
      mitochondrial and axonal phenotypes to establish over an extended culture period, then
      deliver AAV9-MTRFR and measure whether respiration, membrane potential and axonal
      integrity recover or merely stop deteriorating.
    would_support:
    - pathophysiology#Failure of Mitoribosome Rescue
    supporting_outcome:
    - >-
      A human-specific factor is identified whose loss makes MTRFR essential, and delayed
      restoration in patient-genotype neurons recovers respiration and axonal integrity rather
      than only arresting decline, which would make post-diagnosis gene replacement a coherent
      clinical goal and would supply a second, non-delivery-dependent target.
    would_refute:
    - pathophysiology#Failure of Mitoribosome Rescue
    refuting_outcome:
    - >-
      No compensating factor distinguishes the species, and delayed restoration corrects the
      biochemistry without recovering axonal integrity, which would mean the neuronal loss is
      irreversible once established and would confine any replacement strategy to
      presymptomatic infants identified by family history or newborn genomic screening.
- discussion_id: coxpd7_nosology_behr_spg55_leigh
  kind: KNOWLEDGE_GAP
  prompt: >-
    Biallelic MTRFR loss is reported under at least five disease names - COXPD7, SPG55, Behr
    syndrome, Leigh syndrome and a CMT6-like neuropathy. Is there anything other than referral
    route that distinguishes them?
  attaches_to:
  - disease#Combined Oxidative Phosphorylation Defect Type 7
  - genetic#MTRFR
  - progression#Diagnostic delay
  rationale: >-
    The five names are not five diseases. They are the same recessive truncating-allele disorder
    named after whichever of its features presented first: an ophthalmologist sees optic atrophy
    and thinks Behr, a neurologist sees spastic paraparesis and thinks hereditary spastic
    paraplegia, a paediatrician sees a symmetrical brainstem lesion and thinks Leigh, and a
    biochemist sees a combined respiratory chain deficiency and calls it COXPD7. This entry
    curates them as one entity for that reason, and does not create subtypes.

    What is not settled is whether any real axis underlies the labels. The candidate is the
    positional genotype-phenotype rule: GGQ-domain truncations at the severe, Leigh-like,
    cognitively impaired end and C-terminal truncations at the milder, cognition-sparing end.
    That rule is stated as anticipated and expected by the authors who proposed it and was
    supported in a second family by the general observation that a longer surviving protein
    gives a milder phenotype - but it has never been tested against the whole reported cohort
    with a defined severity scale, and the review that classified 27 patients by severity found
    that severe variants were only *more likely* to affect the GGQ domain, not restricted to it.

    There is also a direct counter-observation. The identical p.V116* allele has been
    reported as Leigh syndrome in monozygotic twins and, previously, as Charcot-Marie-Tooth
    disease type 6 in an unrelated Indian family. One allele, two labels - so whatever the
    positional rule explains, it cannot be the whole determinant of which clinic a patient
    ends up in.

    Two things make this worth resolving rather than leaving as a nomenclature curiosity. The
    diagnostic delay is a median of 13 years, and a large part of it is that each specialty
    tests a panel built around its own label; establishing that these are one entity is what
    would put MTRFR on all of them. And if the positional rule holds, a family receiving a
    C-terminal truncation result could be told something useful about cognitive prognosis at
    diagnosis, which is currently not possible.

    There is also an unresolved disagreement to record rather than paper over. The 2015 series
    argues that classical Behr syndrome is typically an MTRFR disease and that the phenotype
    Behr described was probably not caused by the genes usually credited with it; dismech's own
    Behr Syndrome entry is organised around OPA1 with MTRFR listed as one of several phenocopy
    genes. Both cannot be the best description of the same concept.
  evidence:
  - reference: PMID:40993840
    reference_title: "Genetic and Clinical Investigations of C12orf65 Gene Mutations in Three Chinese Pedigrees."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic C12orf65 variants have been associated with various inherited neurological diseases, including Behr syndrome, Leigh syndrome, combined oxidative phosphorylation deficiency 7, and hereditary spastic paraplegia."
    explanation: The four labels attached to one gene, listed together in a recent series.
  - reference: PMID:26380172
    reference_title: "Behr's Syndrome is Typically Associated with Disturbed Mitochondrial Translation and Mutations in the C12orf65 Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However the classical phenotype reported by Behr was most likely due to a different genetic cause."
    explanation: >-
      The disagreement with the OPA1-centred reading of Behr syndrome, stated directly by the
      series that connected the phenotype to MTRFR.
  - reference: PMID:24424123
    reference_title: "Delineation of C12orf65-related phenotypes: a genotype-phenotype relationship."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, a clear genotype-phenotype correlation is anticipated in which deleterious mutations which disrupt the GGQ-containing domain in the first coding exon are expected to result in a more severe phenotype, whereas down-stream C-terminal mutations may result in a more favorable phenotype, typically lacking cognitive impairment."
    explanation: >-
      The candidate axis underlying the labels, in the words that make its status clear:
      anticipated and expected, not demonstrated.
  - reference: PMID:25995486
    reference_title: "Homozygous p.V116* mutation in C12orf65 results in Leigh syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Interestingly, the identical mutation was previously reported in an Indian family with Charcot-Marie Tooth disease type 6, which displayed some overlapping clinical features with the twins."
    explanation: >-
      The strongest single argument that the clinical labels are not genotype-determined: the
      same p.V116* allele is reported once as Leigh syndrome and once as CMT6. It does not
      refute the positional severity rule, but it does mean position cannot be the whole
      story, and it is why the proposed reanalysis tests label against position rather than
      assuming they agree.
  proposed_experiments:
  - experiment_id: exp_coxpd7_pooled_genotype_severity_analysis
    name: Pooled reanalysis of all reported MTRFR patients against variant position
    description: >-
      Assemble every published MTRFR patient with individual-level data, code each variant by
      the position of its predicted stop relative to the GGQ domain and by predicted residual
      protein length, and score each patient on a prespecified severity scale covering cognitive
      status, ambulation, bulbar involvement and MRI findings. Test whether residual protein
      length predicts severity, and separately whether the clinical label the patient was given
      predicts anything once variant position is accounted for.
    would_support:
    - genetic#MTRFR
    supporting_outcome:
    - >-
      Residual protein length predicts severity across the pooled cohort while the assigned
      clinical label adds nothing once position is included, which would confirm the five names
      as referral artefacts, put a usable prognostic statement into counselling, and justify
      adding MTRFR to every panel that any of the five labels routes a patient to.
    would_refute:
    - genetic#MTRFR
    refuting_outcome:
    - >-
      Severity is unrelated to variant position, which would retire the positional rule, leave
      the phenotypic heterogeneity unexplained by genotype, and redirect the search towards the
      modifier hypothesis raised by the co-occurring MT-ND4 and OPA1 variants in the Chinese
      pedigrees.

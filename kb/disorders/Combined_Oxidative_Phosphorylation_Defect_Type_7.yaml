diagnosis:
- name: Nuclear gene-encoded Leigh syndrome spectrum evaluation
  description: >-
    Patients who present at the severe end - developmental regression, a symmetrical
    brainstem and basal ganglia MRI, raised lactate - enter the diagnostic pathway for
    nuclear gene-encoded Leigh syndrome spectrum rather than one built around MTRFR, and that
    pathway is where most of them are found. There is no MTRFR-specific or COXPD7-specific
    GeneReviews chapter; the relevant chapter is the Nuclear Gene-Encoded Leigh Syndrome
    Spectrum Overview, which covers the genetic causes and evaluation strategy for the group
    this disease belongs to.

    Recorded so the negative is on file: the absence of a gene-specific chapter is not an
    absence of guidance, and a curator looking for one should stop at the group overview
    rather than concluding none exists.

name: Combined Oxidative Phosphorylation Defect Type 7
category: Mendelian
creation_date: "2026-09-01T00:00:00Z"
synonyms:
- COXPD7
- combined oxidative phosphorylation deficiency 7
- combined oxidative phosphorylation deficiency type 7
- combined oxidative phosphorylation deficiency caused by mutation in C12orf65
- C12orf65 combined oxidative phosphorylation deficiency
- MTRFR-related mitochondrial disease
- C12orf65-related mitochondrial disease
- MTRFR deficiency
- SPG55
- spastic paraplegia 55, autosomal recessive
- hereditary spastic paraplegia 55
description: >-
  COXPD7 is the autosomal recessive mitochondrial disease caused by biallelic loss of MTRFR,
  the gene formerly called C12orf65. MTRFR encodes a mitochondrial class I release factor
  homologue that does not terminate translation in the ordinary way; it rescues mitoribosomes
  that have stalled, ejecting the nascent chain so the ribosome can be recycled. Losing it
  leaves stalled ribosomes unrecovered, mitochondrial protein synthesis falls globally, and
  the four respiratory complexes containing mitochondrially encoded subunits are deficient
  together - which is what the disease is named for.

  The name is the least useful thing about the entity, because the biochemical label collects
  a clinical picture that is remarkably consistent. Optic atrophy comes first in almost every
  reported patient, followed by axonal peripheral neuropathy and spastic paraparesis; in a
  27-patient literature review optic atrophy was present in 92.3 percent, peripheral
  neuropathy in 80 percent and spasticity in 60 percent. Add ophthalmoplegia, nystagmus,
  variable cognitive impairment and, in the severe end, bulbar dysfunction and a Leigh-like
  brain MRI, and the phenotype is a triad with a tail.

  The same entity therefore appears in the literature under at least four other names -
  spastic paraplegia 55, Behr syndrome, Leigh syndrome and a CMT6-like axonal neuropathy with
  optic atrophy - according to which feature the referring specialty saw first. These are not
  separate diseases and this entry does not curate them as subtypes; they are the same allelic
  disorder read from different clinics. SPG55 has its own OMIM and MONDO identifiers, minted
  from a 2012 spastic paraplegia report rather than from the 2010 encephalomyopathy report
  that produced the COXPD7 number, and it is mapped here as a narrowMatch so the concept is
  covered rather than left open as a separate curation target. The Behr overlap deserves particular care: dismech's
  Behr Syndrome entry is built around OPA1 with MTRFR as one of several phenocopy genes, while
  the 2015 series that established the connection argues the reverse, that classical Behr
  syndrome is *typically* an MTRFR disease and that the phenotype Behr described in 1909 was
  probably not OPA1 at all. Both entries should be read as describing an unsettled boundary
  rather than a resolved one.

  Severity is not random. Every reported allele is truncating - nonsense, frameshift, or a
  splice change acting as one - and the anticipated genotype-phenotype relationship is by
  position: variants disrupting the GGQ-containing domain in the first coding exon produce the
  severe end, while downstream C-terminal truncations tend to spare cognition. The general form
  of the rule is that a longer surviving protein gives a milder disease.

  The animal side carries a mismatch that matters for therapy. Mtrfr knockout mice die
  embryonically and repeated attempts to make a viable line failed, yet humans homozygous for
  truncating alleles survive into adult life, and zebrafish knockouts are healthy and fertile.
  Whatever compensates in humans and fish does not compensate in mice, so the species that
  would ordinarily be used to test a treatment is the one that cannot tolerate the genotype at
  all. Gene replacement has nonetheless been shown feasible in a rescued mouse line and in
  patient-relevant human neurons, with no toxicity from overexpression - the opposite dosage
  situation from several other rare-disease replacement programmes.

  evidence:
  - reference: PMID:24424123
    reference_title: "Delineation of C12orf65-related phenotypes: a genotype-phenotype relationship."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study broadens the phenotypic spectrum of C12orf65 defects and highlights the triad of optic atrophy, axonal neuropathy and spastic paraparesis as its key clinical features."
    explanation: >-
      The three-system selectivity that this node exists to explain, named as the disease's
      defining triad.
  - reference: PMID:26380172
    reference_title: "Behr's Syndrome is Typically Associated with Disturbed Mitochondrial Translation and Mutations in the C12orf65 Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electrophysiology detected signs of anterior horn cell lesion localized to the C8/T1 region."
    explanation: >-
      Objective localisation of the lower motor neuron involvement in one patient, which is the
      neurophysiological counterpart of the long-axon vulnerability this node proposes.
phenotypes:
- name: Optic Atrophy
  category: Ophthalmologic
  frequency: VERY_FREQUENT
  description: >-
    The near-constant feature and, in almost every reported patient, the first one. Onset is in
    childhood - age 5 to 6 years in the Behr-phenotype siblings - and cranial MRI showed optic
    nerve atrophy in all eleven patients of one pooled series. In one series the optic atrophy
    remained stable while the other neurological signs progressed, so it is the presenting sign
    rather than the one that drives deterioration.

    Banded VERY_FREQUENT on the reported 92.3 percent, which falls in the 80 to 99 percent
    band. That figure is a proportion of published cases and is subject to ascertainment bias -
    a patient without optic atrophy is less likely to have been tested for this gene - so it
    should not be read as a population penetrance.
  phenotype_term:
    preferred_term: Optic atrophy
    term:
      id: HP:0000648
      label: Optic atrophy
    onset:
      onset_category: CHILDHOOD
  evidence:
  - reference: PMID:39962784
    reference_title: "[Combined oxidative phosphorylation deficiency type 7 caused by C12orf65 gene mutations: a case report and literature review]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cranial magnetic resonance imaging revealed optic nerve atrophy in all 11 patients, abnormal brainstem signals in 10 patients, and a lactate peak on brainstem magnetic resonance spectroscopy scans in 3 patients."
    explanation: >-
      Optic atrophy in every patient of a pooled series, established by imaging rather than by
      report.
  - reference: PMID:26380172
    reference_title: "Behr's Syndrome is Typically Associated with Disturbed Mitochondrial Translation and Mutations in the C12orf65 Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The first symptom in all patients was childhood-onset optic atrophy, followed by spastic paraparesis, distal weakness and motor neuropathy."
    explanation: >-
      The ordering: optic atrophy comes first, and the motor features follow. That sequence is
      what makes an ophthalmologist the usual first specialist to see these patients.
- name: Axonal Peripheral Neuropathy
  category: Neurologic
  frequency: VERY_FREQUENT
  description: >-
    A length-dependent axonal motor-predominant neuropathy, reported in 80 percent of the
    27-patient review, which places it in the 80 to 99 percent band. It is prominent enough
    that the disease reaches some patients through a neuromuscular clinic as a CMT6-like axonal
    neuropathy with optic atrophy. Distal weakness, foot drop and muscle wasting in the hands
    are the usual findings; electrophysiology shows a widespread lower motor neuron lesion.
  phenotype_term:
    preferred_term: Motor axonal neuropathy
    term:
      id: HP:0007002
      label: Motor axonal neuropathy
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:24424123
    reference_title: "Delineation of C12orf65-related phenotypes: a genotype-phenotype relationship."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study broadens the phenotypic spectrum of C12orf65 defects and highlights the triad of optic atrophy, axonal neuropathy and spastic paraparesis as its key clinical features."
    explanation: The neuropathy as one of the three defining features of the disease.
  - reference: PMID:32478789
    reference_title: "Leigh syndrome in a patient with a novel C12orf65 pathogenic variant: case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "from 27 patients showed that 92.3% presented with optic\natrophy, 80% with peripheral neuropathy"
    explanation: >-
      The count behind this record's band: 80 percent of 27 published patients, which falls in
      the 80 to 99 percent band. The line break is in the PDF-derived cache, not in the source
      sentence.
  - reference: PMID:26380172
    reference_title: "Behr's Syndrome is Typically Associated with Disturbed Mitochondrial Translation and Mutations in the C12orf65 Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was muscle wasting and weakness in the hands, with bilateral foot drop and deformed feet"
    explanation: >-
      The distal, length-dependent distribution on examination in one patient at age 13, which
      is what axonal means clinically here.
  - reference: PMID:28091420
    reference_title: "Compound Heterozygote Mutation of C12orf65 Causes Distal Motor Neuropathy and Optic Atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "distal motor neuropathy without sensory loss in the limbs."
    explanation: >-
      The motor-predominant, sensory-sparing character of the neuropathy, which is what makes
      the CMT6-like label a reasonable one for patients who present this way.
  - reference: PMID:28091420
    reference_title: "Compound Heterozygote Mutation of C12orf65 Causes Distal Motor Neuropathy and Optic Atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our patient had no evidence for spastic paraparesis."
    explanation: >-
      A patient with two of the three triad features and not the third, which is why the
      triad is curated as three separately banded phenotypes rather than as a syndrome that
      is present or absent.
- name: Spastic Paraparesis
  category: Neurologic
  frequency: FREQUENT
  description: >-
    Lower limb spasticity with pathologically brisk reflexes, present in 60 percent of the
    27-patient review - the 30 to 79 percent band. It is prominent enough that biallelic MTRFR
    variants were independently designated spastic paraplegia 55, and patients reach genetics
    through hereditary spastic paraplegia panels as often as through mitochondrial ones.
  phenotype_term:
    preferred_term: Lower limb spasticity
    term:
      id: HP:0002061
      label: Lower limb spasticity
    clinical_course: PROGRESSIVE

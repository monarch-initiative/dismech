  association: Biallelic null PSAP variants abolishing prosaposin and all saposins
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: PSAP
    term:
      id: hgnc:9498
      label: PSAP
  evidence:
  - reference: PMID:36969110
    reference_title: "Combined saposin deficiency: A rare occurrence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Combined saposin deficiency (OMIM #611721), an exceedingly rare lysosomal storage disorder, is caused by a mutation in the gene PSAP."
    explanation: "Biallelic PSAP variants cause combined saposin deficiency."
  - reference: PMID:11309366
    reference_title: "A novel mutation in the coding region of the prosaposin gene leads to a complete deficiency of prosaposin and saposins, and is associated with a complex sphingolipidosis dominated by lactosylceramide accumulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient was homozygous for a 1 bp deletion (c.803delG) within\nthe SAP-B domain of the prosaposin gene which leads to a frameshift and\npremature stop codon"
    explanation: A homozygous PSAP frameshift variant (c.803delG) abolishes prosaposin and all saposins.
diagnosis:
- name: PSAP molecular genetic testing
  presence: Biallelic loss-of-function variants in PSAP abolishing the prosaposin precursor and saposins A-D.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Diagnosis rests on PSAP sequencing; a combined pattern of multiple sphingolipid-activator
    deficiencies with normal individual hydrolase genes suggests prosaposin deficiency.
  evidence:
  - reference: PMID:36969110
    reference_title: "Combined saposin deficiency: A rare occurrence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Combined saposin deficiency (OMIM #611721), an exceedingly rare lysosomal storage disorder, is caused by a mutation in the gene PSAP."
    explanation: "PSAP sequencing provides molecular confirmation of combined saposin deficiency."
  - reference: PMID:36969110
    reference_title: "Combined saposin deficiency: A rare occurrence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report, to the best of our knowledge, the first Indian case with these clinical manifestations and confirmation by genetic and enzymatic testing."
    explanation: Confirms combined genetic and enzymatic testing in establishing the clinical diagnosis.
- name: Urinary Sphingolipid Profiling by Tandem Mass Spectrometry
  presence: Simultaneous marked elevation of multiple urinary sphingolipids (notably globotriaosylceramide, lactosylceramide, glucosylceramide, and sulfatides).
  diagnosis_term:
    preferred_term: urinary sphingolipid analysis
    term:
      id: NCIT:C61044
      label: Urine Chemistry Measurement
  description: >-
    Electrospray ionization tandem mass spectrometry of urinary sediment detects
    simultaneous elevation of multiple sphingolipid classes, providing a rapid
    biochemical screen that distinguishes combined prosaposin deficiency from
    single-hydrolase sphingolipidoses.
  evidence:
  - reference: DOI:10.1002/ajmg.a.32712
    reference_title: "Prosaposin deficiency and saposin B deficiency (activator‐deficient metachromatic leukodystrophy): Report on two patients detected by analysis of urinary sphingolipids and carrying novel PSAP gene mutations"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Screening for urinary sphingolipids was crucial to the diagnosis of both patients, with electrospray ionization tandem mass spectrometry also providing quantification."
    explanation: Establishes urinary sphingolipid screening and ESI-MS/MS quantification as a key diagnostic assay for prosaposin deficiency.
  - reference: DOI:10.1002/ajmg.a.32712
    reference_title: "Prosaposin deficiency and saposin B deficiency (activator‐deficient metachromatic leukodystrophy): Report on two patients detected by analysis of urinary sphingolipids and carrying novel PSAP gene mutations"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple sphingolipids were elevated, with globotriaosylceramide showing the greatest increase."
    explanation: Documents the multi-sphingolipid urinary elevation signature in neonatal prosaposin deficiency.
differential_diagnoses:
- name: Gaucher disease due to saposin C deficiency
  description: >-
    Isolated saposin C deficiency produces a Gaucher-like phenotype, versus the combined
    multi-sphingolipid disease of total prosaposin loss.
  disease_term:
    preferred_term: Gaucher disease due to saposin C deficiency
    term:
      id: MONDO:0012517
      label: Gaucher disease due to saposin C deficiency
  distinguishing_features:
  - Loss of a single saposin (C) versus loss of all four saposins in combined deficiency.
  evidence:
  - reference: PMID:36969110
    reference_title: "Combined saposin deficiency: A rare occurrence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "each of which has a role as a cofactor for the enzymes whose deficiency results in Krabbe disease, metachromatic leukodystrophy, Gaucher disease, and Farber disease"
    explanation: "Individual saposins underlie distinct single-deficiency diseases; combined deficiency loses all of them."
- name: Metachromatic leukodystrophy
  description: >-
    Saposin B is a cofactor for arylsulfatase A; isolated saposin B deficiency causes an
    MLD-like phenotype, one component of combined deficiency.
  disease_term:
    preferred_term: metachromatic leukodystrophy
    term:
      id: MONDO:0018868
      label: metachromatic leukodystrophy
  distinguishing_features:
  - A single-pathway sulfatide storage disorder, versus combined multi-sphingolipid storage in prosaposin deficiency.
  evidence:
  - reference: DOI:10.1002/ajmg.a.32712
    reference_title: "Prosaposin deficiency and saposin B deficiency (activator‐deficient metachromatic leukodystrophy): Report on two patients detected by analysis of urinary sphingolipids and carrying novel PSAP gene mutations"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Phenotypically, pSap‐d is a relatively uniform disease of the neonate, whereas SapB‐d is heterogeneous with a spectrum similar to that in metachromatic leukodystrophy."
    explanation: Contrasts uniform neonatal neurovisceral prosaposin deficiency against the metachromatic leukodystrophy spectrum.
treatments:
- name: Supportive Care
  description: >-
    No disease-modifying human therapy is established; neurological and visceral
    progression leads to early mortality in infancy with limited treatment
    options, so clinical management is supportive. In preclinical psap-knockout
    zebrafish, genetic reduction of acid sphingomyelinase via smpd1 mutagenesis
    prolonged lifespan, whereas pharmacological monomethyl fumarate (MMF)
    treatment did not.
  notes: >-
    Cached human case-report abstracts document the uniformly fatal neonatal
    and infantile course without detailing specific supportive care regimens.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: DOI:10.1242/dmm.049995
    reference_title: "A zebrafish model of combined saposin deficiency identifies acid sphingomyelinase as a potential therapeutic target"
    supports: SUPPORT
    directness: INDIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Like many LSDs, neurological involvement in sphingolipidoses leads to
      early mortality with limited treatment options.
    explanation: >-
      Notes the early mortality and lack of disease-modifying treatment options
      across neuropathic sphingolipidoses, leaving clinical management
      supportive.
  - reference: DOI:10.1242/dmm.049995
    reference_title: "A zebrafish model of combined saposin deficiency identifies acid sphingomyelinase as a potential therapeutic target"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      smpd1 mutagenesis, but not MMF treatment, prolonged lifespan in psap KO
      zebrafish, highlighting the modulation of acid sphingomyelinase activity
      as a potential path toward sphingolipidosis treatment.
    explanation: >-
      Demonstrates in psap-knockout zebrafish that genetic acid
      sphingomyelinase reduction (smpd1 mutagenesis) prolonged lifespan whereas
      pharmacological MMF treatment failed.
- name: Genetic Counseling
  description: >-
    Autosomal recessive genetic counseling for carrier parents (25% recurrence
    risk per pregnancy) and targeted prenatal or preimplantation testing once
    familial PSAP null alleles are identified.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:11309366
    reference_title: "A novel mutation in the coding region of the prosaposin gene leads to a complete deficiency of prosaposin and saposins, and is associated with a complex sphingolipidosis dominated by lactosylceramide accumulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Saposins were also deficient in this case, leading to its reclassification as prosaposin deficiency, and her mother was found to be a carrier for the same c.803delG mutation."
    explanation: >-
      Directly demonstrates molecular carrier identification of the familial
      c.803delG PSAP allele in an obligate carrier mother; the 25% sibling
      recurrence risk in description follows standard autosomal recessive
      inheritance.
definitions:
- name: Clinical case definition of combined saposin deficiency
  definition_type: CASE_DEFINITION
  description: >-
    Combined saposin (prosaposin) deficiency is defined by biallelic PSAP loss-of-function
    variants abolishing all four saposins, with combined multi-sphingolipid lysosomal
    accumulation and a fatal neonatal neurovisceral storage phenotype.
  scope: Disease-level case definition for combined prosaposin deficiency.
  evidence:
  - reference: PMID:36969110
    reference_title: "Combined saposin deficiency: A rare occurrence."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Combined saposin deficiency (OMIM #611721), an exceedingly rare lysosomal storage disorder, is caused by a mutation in the gene PSAP."
    explanation: "Anchors the case definition in PSAP-related combined saposin deficiency."

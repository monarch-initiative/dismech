      explanation: Establishes combined saposin deficiency as an inherited lysosomal storage disorder of sphingolipid metabolism.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:11309366
      reference_title: "A novel mutation in the coding region of the prosaposin gene leads to a complete deficiency of prosaposin and saposins, and is associated with a complex sphingolipidosis dominated by lactosylceramide accumulation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The patient was homozygous for a 1 bp deletion (c.803delG) within the SAP-B domain of the prosaposin gene which leads to a frameshift and premature stop codon."
      explanation: Establishes autosomal recessive monogenic etiology due to biallelic loss-of-function PSAP mutation.
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:11309366
      reference_title: "A novel mutation in the coding region of the prosaposin gene leads to a complete deficiency of prosaposin and saposins, and is associated with a complex sphingolipidosis dominated by lactosylceramide accumulation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The neuropathology was severe and featured neuronal storage and loss with a massive depopulation of cortical neurons and pronounced fibrillary astrocytosis."
      explanation: Documents severe central nervous system neuropathology with massive cortical neuronal depopulation and pronounced fibrillary astrocytosis.

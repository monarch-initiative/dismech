      snippet: "Sphingolipids, including monohexosylceramides (mainly glucosylceramide), dihexosylceramides (mainly lactosylceramide), globotriaosyl ceramide, sulphatides, ceramides and globotetraosyl ceramide, were stored in the tissues."
      explanation: Confirms generalized lysosomal accumulation of multiple sphingolipid classes (complex sphingolipidosis).

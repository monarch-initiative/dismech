- name: ASXL1 truncation dysregulates Wnt signaling and tissue patterning
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Multiomics studies in patient-derived cells show canonical and noncanonical
    Wnt pathway perturbation, including broad activation of canonical Wnt
    signaling and increased VANGL2 expression. The cell-level signal is
    replicated across blood and fibroblast assays, but its causal translation
    to embryonic craniofacial and organ phenotypes remains provisional because
    the study examined differentiated postnatal cells.

discussions:
- discussion_id: bos_truncation_molecular_consequence
  prompt: >-
    Do late ASXL1 truncating variants cause BOS mainly through loss of
    full-length repressive function, a dominant-negative effect, gain of
    function by a truncated protein, or a combination of these mechanisms?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#ASXL1 truncation disrupts epigenetic regulation of developmental gene expression
  rationale: >-
    The causal gene-disease relationship and the cross-tissue epigenomic
    disturbance are strong, but the variants should not be reduced to simple
    gene under-expression. The pathophysiology graph therefore records abnormal
    ASXL1 function and leaves the precise molecular consequence open.
  evidence:
  - reference: PMID:37053013
    reference_title: Multiomics of Bohring-Opitz syndrome truncating ASXL1 mutations identify canonical and noncanonical Wnt signaling dysregulation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our data show that regardless of cell type, ASXL1 mutations drive strong
      cross-tissue effects that disrupt multiple layers of the epigenome.
    explanation: >-
      Patient-derived cells establish a broad epigenomic consequence without
      resolving one exclusive dosage or protein-effect mechanism.

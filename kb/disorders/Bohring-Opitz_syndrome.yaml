progression:
- phase: Prenatal and neonatal presentation
  age_range: Prenatal period to birth
  notes: >-
    Intrauterine growth restriction and congenital anomalies may be evident
    before or at birth; dysmorphic features, hypotonia, and early feeding or
    respiratory difficulty commonly bring the disorder to attention.
  evidence:
  - reference: PMID:25921057
    reference_title: Clinical management of patients with ASXL1 mutations and Bohring-Opitz syndrome, emphasizing the need for Wilms tumor surveillance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bohring-Opitz syndrome has previously been associated with high infant
      mortality (11 out of 43 reported patients (26%), intrauterine growth
      retardation, feeding difficulties often requiring a feeding tube,
      failure to thrive, severe to profound developmental delays, recurrent
      infections, nonspecific brain abnormalities, variable microcephaly,
      distinctive facial features
    explanation: >-
      The published clinical series documents prenatal growth restriction and
      the major early-life manifestations.
- phase: High-burden infancy and early childhood
  age_range: Infancy through early childhood
  notes: >-
    Severe feeding intolerance, cyclic vomiting, aspiration, recurrent
    respiratory infections, growth failure, and profound developmental delay
    can drive repeated hospitalizations. Historical published cases included
    substantial infant mortality, but that estimate is vulnerable to reporting
    and ascertainment bias.
  evidence:
  - reference: PMID:25921057
    reference_title: Clinical management of patients with ASXL1 mutations and Bohring-Opitz syndrome, emphasizing the need for Wilms tumor surveillance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bohring-Opitz syndrome has previously been associated with high infant
      mortality (11 out of 43 reported patients (26%), intrauterine growth
      retardation, feeding difficulties often requiring a feeding tube,
      failure to thrive, severe to profound developmental delays, recurrent
      infections, nonspecific brain abnormalities, variable microcephaly,
      distinctive facial features
    explanation: >-
      This small published cohort supports a severe early-life course while
      also motivating caution about generalizing its mortality estimate.
- phase: Partial improvement with persistent neurodevelopmental disability
  age_range: Later childhood onward
  notes: >-
    Feeding difficulty, recurrent infection, and the characteristic BOS posture
    often become less prominent with age. Severe intellectual and adaptive
    disability generally persists, so improving medical stability does not
    imply resolution of the underlying developmental disorder.
  evidence:
  - reference: PMID:29446906
    reference_title: Bohring-Opitz Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The BOS posture, which is most striking in early childhood and often
      becomes less apparent with age, is characterized by flexion at the elbows
      with ulnar deviation and flexion of the wrists and metacarpophalangeal
      joints. Feeding difficulties in early childhood, including cyclic
      vomiting, have a significant impact on overall health; feeding tends to
      improve with age.
    explanation: >-
      GeneReviews documents age-related improvement of posture and feeding
      difficulty.
  - reference: PMID:29446906
    reference_title: Bohring-Opitz Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Affected individuals may experience recurrent infections, which also tend
      to improve with age.
    explanation: GeneReviews also documents improvement of recurrent infections.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    BOS combines profound lifelong neurodevelopmental disability with growth
    failure, feeding and aspiration risk, cyclic vomiting, respiratory
    morbidity, seizures, sleep-disordered breathing, repeated procedures or
    hospitalizations, and a childhood tumor-surveillance burden. Some medical
    complications improve with age, but early morbidity and care intensity can
    be substantial.
  evidence:
  - reference: PMID:25921057
    reference_title: Clinical management of patients with ASXL1 mutations and Bohring-Opitz syndrome, emphasizing the need for Wilms tumor surveillance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bohring-Opitz syndrome has previously been associated with high infant
      mortality (11 out of 43 reported patients (26%), intrauterine growth
      retardation, feeding difficulties often requiring a feeding tube,
      failure to thrive, severe to profound developmental delays, recurrent
      infections, nonspecific brain abnormalities, variable microcephaly,
      distinctive facial features
    explanation: >-
      The reported early mortality, feeding-tube dependence, growth failure, and
      severe developmental impairment support a high disease-level burden.

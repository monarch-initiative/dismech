pathophysiology:
- name: ASXL1 truncation disrupts epigenetic regulation of developmental gene expression
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Late protein-truncating ASXL1 variants disrupt the protein's chromatin
    regulatory function and alter developmental transcriptional programs across
    tissues. The variants should not be represented as simple ASXL1 depletion:
    available patient-cell data support escape from nonsense-mediated decay,
    while the relative contributions of lost full-length function,
    dominant-negative activity, and gain of function remain unresolved.

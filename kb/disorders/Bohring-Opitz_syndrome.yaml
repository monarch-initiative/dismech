  prompt: >-
    Does Wnt and VANGL2 dysregulation measured in postnatal blood and skin
    fibroblasts directly cause BOS craniofacial and organ-patterning phenotypes
    during embryogenesis?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#ASXL1 truncation dysregulates Wnt signaling and tissue patterning
  rationale: >-
    Cross-tissue multi-omics and protein data support Wnt-pathway dysregulation,
    but the disease-defining malformations arise in embryonic cell populations
    that were not assayed. The graph therefore marks the Wnt node provisional
    and its phenotype links as indirect with unknown intermediates.
  evidence:
  - reference: PMID:37053013
    reference_title: Multiomics of Bohring-Opitz syndrome truncating ASXL1 mutations identify canonical and noncanonical Wnt signaling dysregulation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We used primary cells from individuals with BOS (n = 18) and controls
      (n = 49) to dissect gene regulatory changes caused by ASXL1 mutations
      using comprehensive multiomics assays for chromatin accessibility
      (ATAC-seq), DNA methylation, histone methylation binding, and
      transcriptome in peripheral blood and skin fibroblasts.
    explanation: >-
      The assayed patient-derived specimens are blood and skin fibroblasts, not
      the embryonic progenitors in which the malformations originate.
- discussion_id: bos_wilms_tumor_risk_precision
  prompt: >-
    What is the age-specific absolute risk of Wilms tumor in molecularly
    confirmed BOS, and does it justify the same surveillance intensity for all
    affected children?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Nephroblastoma (Wilms tumor)
  - treatments#Wilms tumor renal-ultrasound surveillance
  rationale: >-
    Current surveillance is clinically actionable, but the published numerator
    comes from a tiny, selected literature cohort. A prospective molecularly
    confirmed registry with person-time denominators is needed to estimate
    absolute and age-specific risk.
  evidence:
  - reference: PMID:25921057
    reference_title: Clinical management of patients with ASXL1 mutations and Bohring-Opitz syndrome, emphasizing the need for Wilms tumor surveillance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Including the patients discussed herein, there are 43 published patients
      with BOS of which two had Wilms tumor and one had bilateral
      nephroblastomatosis in infancy, making the incidence of a renal
      neoplastic process 7% among published patients, although this may be
      inflated due to biased ascertainment.
    explanation: >-
      The original surveillance series explicitly identifies its small
      denominator and potential ascertainment inflation.
  - reference: PMID:29446906
    reference_title: Bohring-Opitz Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Isolated case reports suggest that individuals with BOS are at greater
      risk for Wilms tumor than the general population, but large-scale
      epidemiologic studies have not been conducted.
    explanation: GeneReviews confirms that population-scale risk data are absent.
review_notes: >-
  2026 re-review retained the strong ASXL1-centered core, changed the gene
  modifier from DECREASED to ABNORMAL to avoid encoding an unresolved
  truncation mechanism as simple haploinsufficiency, added explicit causal-link
  directness and mechanism confidence, natural history, high clinical burden,
  surveillance and supportive management, and two recruiting observational
  registries found in a ClinicalTrials.gov query checked on 2026-07-24. The
  disease-specific ASXL natural-history registry is distinguished from the
  broad CoRDS registry, and neither is represented as a therapeutic trial. The
  Wilms tumor recommendation is retained with its ascertainment-bias caveat.
  The disease-to-phenotype audit still reports 90 externally asserted granular
  phenotype gaps (30 carrying a PMID pointer); those rows were not bulk-imported
  because the local source cache does not provide exact support for most
  individual feature-frequency claims. Five clinically central features with
  direct cached support were added instead.
  The bundled Asta research report mixed unrelated disorders and was used only
  for source discovery; curated assertions were checked against the direct
  reference caches.

clinical_burden:
  burden_level: HIGH
  rationale: >-
    Lifelong severe disability from infancy: most children lose the ability to
    sit, none develops full speech, intellectual disability is moderate to
    severe and vision is impaired by optic atrophy, with scoliosis and
    respiratory and gastrointestinal problems requiring multidisciplinary
    care.
  evidence:
  - reference: PMID:41833177
    reference_title: "Clinical-genetic features of the TBCE-related spectrum disorders: A focus on the childhood-onset neurodegenerative phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "TBCE-related neurodegeneration is a severe multisystem disorder that requires multidisciplinary management."
    explanation: >-
      The 2026 cohort authors' assessment of disease burden.

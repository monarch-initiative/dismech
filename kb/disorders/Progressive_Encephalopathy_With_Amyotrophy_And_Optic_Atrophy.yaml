progression:
- phase: Infantile onset
  notes: >-
    Growth at birth is normal and early development is normal in most
    children. The first signs, at a mean age of six months, are hypotonia and
    developmental delay; spasticity is an early sign in some.
  evidence:
  - reference: PMID:39153170
    reference_title: "Expanding TBCE-related phenotype-novel variant causing rigid spine, eosinophilia, neutropenia, and nocturnal hypoxemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "All children in this group exhibited normal auxologic parameters, and development in infancy for the majority fell within the normal range (6/7, 85.7%)."
    explanation: >-
      Normal birth parameters and early development before onset.
  - reference: PMID:39153170
    reference_title: "Expanding TBCE-related phenotype-novel variant causing rigid spine, eosinophilia, neutropenia, and nocturnal hypoxemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Initial symptoms were observed on average at 6 months of age, primarily manifesting as hypotonia and developmental delay (5/7, 71.4%)."
    explanation: >-
      Mean age and signs at onset.
- phase: Progressive neurodegeneration
  notes: >-
    Slow progression through childhood: most children who learned to sit
    lose the ability, speech stays absent or severely dysarthric, and a
    spastic-ataxic tetraparesis with distal amyotrophy and foot drop, optic
    atrophy and moderate to severe intellectual disability develops. Iron
    deposits appear on MRI in older patients. Survival has not been reported.
  evidence:
  - reference: CGGV:assertion_3f9500f5-48e8-49dc-b29a-3845056778ab-2025-02-25T180000.000Z
    reference_title: "TBCE / encephalopathy, progressive, with amyotrophy and optic atrophy (Moderate)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Six probands from 4 unrelated Southern Italian families were described as having early onset slowly progressive distal motor neuropathy resembling spinal muscular atrophy with bilateral foot drop, spasticity, cerebellar ataxia and moderate to severe intellectual developmental disorder."
    explanation: >-
      A slowly progressive course after early onset.
  - reference: CGGV:assertion_3f9500f5-48e8-49dc-b29a-3845056778ab-2025-02-25T180000.000Z

- name: Impaired Alpha/Beta-Tubulin Heterodimer Assembly
  biological_scale: MOLECULAR
  description: >-
    Newly made alpha- and beta-tubulin pass from the chaperonin to the
    tubulin-specific cofactors: TBCE holds alpha-tubulin and TBCD
    beta-tubulin in a complex with ARL2 until TBCC triggers release of the
    native heterodimer. With less TBCE, the supply of assembled heterodimers
    that feeds microtubule growth is limited.
  biological_processes:
  - preferred_term: tubulin heterodimer assembly
    modifier: DECREASED
    term:
      id: GO:0007021
      label: tubulin complex assembly
  - preferred_term: post-chaperonin tubulin folding pathway

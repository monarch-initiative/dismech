name: Progressive Encephalopathy With Amyotrophy And Optic Atrophy
creation_date: "2026-11-11T21:58:17Z"
category: Mendelian
parents:
- hereditary disease
- Neurodegenerative Disease
description: >-
  Autosomal recessive early-onset neurodegenerative disorder caused by biallelic
  hypomorphic variants in TBCE, encoding tubulin-folding cofactor E, the
  chaperone that carries alpha-tubulin and, with TBCD, ARL2 and TBCC, assembles
  the alpha/beta-tubulin heterodimer. Patient fibroblasts contain less TBCE,
  less polymerized alpha-tubulin and abnormal mitotic spindles. In the pmn
  mouse, which carries a destabilizing Tbce missense allele, loss of
  Golgi-associated TBCE fragments the Golgi apparatus, interrupts the supply of
  tubulin to the axon and produces a dying-back motor axonopathy. Infants are
  normal at birth and develop hypotonia and developmental delay in the first
  year, then regress, with progressive spastic-ataxic tetraparesis, distal
  amyotrophy with foot drop from a distal spinal muscular atrophy-like motor
  neuronopathy, optic atrophy, moderate to severe intellectual disability and
  severe dysarthria or absent speech. Brain MRI shows cerebellar atrophy, a thin
  corpus callosum and white matter changes, with iron deposits in older
  patients. The first seven reported patients came from Southern Italy and
  carry the recurrent p.Ile155Asn allele. Unlike the allelic
  hypoparathyroidism-retardation-dysmorphism (Sanjad-Sakati) syndrome, growth
  at birth, facial features and calcium-phosphate metabolism are normal.
  Management is supportive. OMIM:617207.
synonyms:
- PEAMO
- encephalopathy, progressive, with amyotrophy and optic atrophy
- early-onset progressive encephalopathy with distal spinal muscular atrophy
disease_term:
  preferred_term: Progressive encephalopathy with amyotrophy and optic atrophy
  term:
    id: MONDO:0014968
    label: encephalopathy, progressive, with amyotrophy and optic atrophy
notes: >-
  No GeneReviews chapter covers TBCE, so the phenotype baseline is taken from
  the gene-discovery series (six patients from four Southern Italian families),
  the ClinGen evidence summary, a 2021 case report, the PEAMO column of a 2025
  systematic review, and the abstract of a 2026 three-centre cohort. That
  cohort describes TBCE-related neurodegeneration as a range from classic
  PEAMO to a milder complex spastic paraparesis; its abstract does not say
  which genotypes give the milder form, so the milder form is not modelled
  separately. Two other biallelic TBCE presentations are outside this entry
  and are listed as differential diagnoses: the
  hypoparathyroidism-retardation-dysmorphism (Sanjad-Sakati) and autosomal
  recessive Kenny-Caffey type 1 spectrum, curated as Sanjad-Sakati_Syndrome,
  and a milder Central and Eastern European phenotype with amyotrophy,
  testicular failure and normal brain MRI caused by the c.100+1G>A splice
  allele, which its authors describe as a new TBCE-related disorder. The steps
  between reduced TBCE and axon loss (Golgi fragmentation, impaired axonal
  tubulin routing and transport) are demonstrated in the pmn mouse and in
  TBCE-depleted cultured motor neurons, not in patient neurons.
prevalence:
- population: Worldwide (published cases)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A 2026 systematic review counted 335 reported patients with mono- or
    biallelic TBCE variants, of whom about 5% had the neurodegenerative
    phenotype and 85% had Sanjad-Sakati syndrome. The first seven reported
    patients with the neurodegenerative phenotype came from Southern Italy.
    No population-based prevalence has been measured.
  evidence:
  - reference: PMID:41833177
    reference_title: "Clinical-genetic features of the TBCE-related spectrum disorders: A focus on the childhood-onset neurodegenerative phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Sanjad-Sakati syndrome was the most frequent form (85%), while the neurodegenerative phenotype accounted for a minority (5%) of cases."
    explanation: >-
      The neurodegenerative phenotype is about 5% of all reported TBCE
      patients, the source of the case count.

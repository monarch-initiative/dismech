genetic:
- name: TBCE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: TBCE
    term:
      id: hgnc:11582
      label: TBCE
  notes: >-
    TBCE encodes tubulin-folding cofactor E, which binds
    alpha-tubulin through its N-terminal CAP-Gly domain and also carries
    leucine-rich repeats and a ubiquitin-like domain. The disease
    alleles reported so far are the recurrent missense c.464T>A (p.Ile155Asn),
    homozygous or in trans with the frameshifts c.924del (p.Leu309Ter) or
    c.1076del (p.Leu360Ter). TBCE is the only gene reported for this disease.
    ClinGen rates the pair Moderate (six probands, one recurrent allele, the
    pmn mouse), and relationship_type is left unset because its CAUSATIVE
    value is defined as corresponding to a ClinGen Definitive or Strong
    classification. Other TBCE allele classes cause different diseases: the
    Middle Eastern in-frame deletion c.155_166del causes Sanjad-Sakati
    syndrome, and the c.100+1G>A splice allele causes a milder amyotrophic
    phenotype.

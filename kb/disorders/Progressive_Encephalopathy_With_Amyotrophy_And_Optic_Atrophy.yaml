    limitations: >-
      Dividing dermal fibroblasts are not neurons; the effect of the same
      defect on long motor axons and central neurons is inferred.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        Polymerized alpha-tubulin and microtubule regrowth after nocodazole in
        fibroblasts stand in for microtubule supply and maintenance in motor
        axons, which depend on Golgi-derived tubulin routing that fibroblasts
        do not need.
    evidence:
    - reference: PMID:27666369
      reference_title: "TBCE Mutations Cause Early-Onset Progressive Encephalopathy with Distal Spinal Muscular Atrophy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "Primary fibroblasts obtained from affected subjects displayed a reduced level of polymerized α-tubulin, similarly to tail fibroblasts of pmn/pmn mice."
      explanation: >-
        The microtubule phenotype measured in patient cells.
differential_diagnoses:
- name: Progressive encephalopathy with brain atrophy and thin corpus callosum
  description: >-
    The disease of the partner cofactor TBCD: an early-onset progressive
    encephalopathy with regression, spastic tetraparesis, muscle weakness
    and atrophy, optic atrophy, cerebellar atrophy and a thin corpus
    callosum, which overlaps closely with this entry.
  disease_term:
    preferred_term: Progressive encephalopathy with brain atrophy and thin corpus callosum
    term:
      id: MONDO:0044646
      label: early-onset progressive diffuse brain atrophy-microcephaly-muscle weakness-optic atrophy syndrome
  distinguishing_features:
  - Biallelic TBCD rather than TBCE variants.
  - Postnatal microcephaly, growth retardation, intractable seizures and respiratory failure are prominent; seizures were reported in one of seven reviewed patients with the TBCE allele and microcephaly in one.
  evidence:
  - reference: PMID:27666374
    reference_title: "Biallelic TBCD Mutations Cause Early-Onset Neurodegenerative Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We describe four families with affected siblings showing unique clinical features: early-onset (before 1 year of age) progressive diffuse brain atrophy with regression, postnatal microcephaly, postnatal growth retardation, muscle weakness/atrophy, and respiratory failure."
    explanation: >-
      The overlapping clinical picture of TBCD disease, published alongside
      the TBCE discovery series.
- name: Hypoparathyroidism-retardation-dysmorphism syndrome
  description: >-
    The allelic Sanjad-Sakati syndrome, with autosomal recessive Kenny-Caffey
    syndrome type 1 at its severe end, caused by other TBCE alleles, mainly
    the Middle Eastern founder in-frame deletion c.155_166del. It is a
    developmental syndrome with congenital hypoparathyroidism rather than a
    neurodegenerative one.
  disease_term:
    preferred_term: Sanjad-Sakati syndrome
    term:
      id: MONDO:0009426
      label: hypoparathyroidism-retardation-dysmorphism syndrome
  distinguishing_features:
  - Congenital hypoparathyroidism with neonatal hypocalcemia and hyperphosphatemia; calcium-phosphate metabolism is normal in this entry's patients.
  - Intrauterine and postnatal growth failure, microcephaly and facial dysmorphism.
  - Middle Eastern founder in-frame deletion c.155_166del rather than p.Ile155Asn.
  evidence:
  - reference: PMID:12389028
    reference_title: "Mutation of TBCE causes hypoparathyroidism-retardation-dysmorphism and autosomal recessive Kenny-Caffey syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The syndrome of congenital hypoparathyroidism, mental retardation, facial dysmorphism and extreme growth failure (HRD or Sanjad-Sakati syndrome; OMIM 241410) is an autosomal recessive disorder reported almost exclusively in Middle Eastern populations."
    explanation: >-
      The defining features of the allelic syndrome.
  - reference: PMID:39153170
    reference_title: "Expanding TBCE-related phenotype-novel variant causing rigid spine, eosinophilia, neutropenia, and nocturnal hypoxemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Importantly, no endocrinological abnormalities in the form of hypocalcemia and hyperphosphatemia were observed."
    explanation: >-
      Patients with the c.464T>A allele have normal calcium-phosphate
      metabolism, which separates them from Sanjad-Sakati syndrome.
- name: TBCE c.100+1G>A-related amyotrophy with testicular failure
  description: >-
    A milder biallelic TBCE phenotype reported in Central and Eastern
    European patients homozygous or compound heterozygous for the splice
    allele c.100+1G>A, in which translation from an alternative reading frame
    produces a partially functional protein. Its authors describe it as a new
    TBCE-related disorder; it has no MONDO or OMIM term.
  distinguishing_features:
  - Onset at about five years with normal early motor and speech development.
  - Mainly proximal amyotrophy with a rigid spine, cryptorchidism or testicular failure, and recurrent infections, neutropenia and eosinophilia in some patients.
  - Normal brain MRI and no ataxia or cerebellar atrophy.
  evidence:
  - reference: PMID:39657131
    reference_title: "Out-of-frame Translation Rescues a Loss-of-function Variant in a Novel TBCE Phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We report 7 patients with a novel, milder TBCE phenotype, presenting with amyotrophy, testicular failure, and mild intellectual disability, with or without short stature."
    explanation: >-
      The milder allelic phenotype.
  - reference: PMID:39153170
    reference_title: "Expanding TBCE-related phenotype-novel variant causing rigid spine, eosinophilia, neutropenia, and nocturnal hypoxemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Homozygous carriers of the c.100 + 1G > A variant exhibit a markedly milder clinical course, with no deviations in the calcium-phosphate metabolism and central nervous system pathology in MRI studies."
    explanation: >-
      Normal brain MRI separates the splice-allele phenotype from this
      entry.
  - reference: PMID:39153170
    reference_title: "Expanding TBCE-related phenotype-novel variant causing rigid spine, eosinophilia, neutropenia, and nocturnal hypoxemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "In the case of patients with the c.100 + 1G > A variants, there were no signs of ataxia or cerebellar atrophy, but muscle atrophy and spasticity were present."
    explanation: >-
      No ataxia or cerebellar atrophy with the splice allele.
discussions:
- discussion_id: peamo_pmn_mouse_fidelity
  prompt: >-
    The steps between reduced TBCE and motor axon loss come from the pmn
    mouse. Do Golgi fragmentation and impaired axonal tubulin routing operate
    in patients with p.Ile155Asn, and does the mouse model the central
    encephalopathy at all?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Golgi Fragmentation in Motor Neurons
  - pathophysiology#Impaired Axonal Tubulin Routing and Transport
  - animal_models#Mouse
  rationale: >-
    The pmn mouse carries a different allele (Trp524Gly at the last residue)
    and dies at four to six weeks from a rapid motor neuronopathy with a
    sensory neuropathy and hearing loss. Patients have a slowly progressive
    distal motor neuronopathy with normal sensory conduction, plus cerebellar
    and cerebral atrophy, intellectual disability and optic atrophy, which
    the mouse studies do not describe. Golgi structure and axonal transport
    have not been studied in patient cells or patient-derived neurons, so the
    middle of the human pathograph rests on the mouse.
  evidence:
  - reference: PMID:27488538
    reference_title: "Sensory neuropathy in progressive motor neuronopathy (pmn) mice is associated with defects in microtubule polymerization and axonal transport."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "This study unravels sensory neuropathy as a pathological feature of mouse pmn, and discusses the potential contribution of cytoskeletal defects to sensory neuropathy in human motor neuron disease."
    explanation: >-
      The mouse has a sensory neuropathy.
  - reference: PMID:24120439
    reference_title: "Mutation of the TBCE gene causes disturbance of microtubules in the auditory nerve and cochlear outer hair cell degeneration accompanied by progressive hearing loss in the pmn/pmn mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "The progressive motor neuronopathy (pmn/pmn) mouse, an animal model for a fast developing human motor neuron disorder, is additionally characterized by simultaneous progressive sensorineural hearing loss."
    explanation: >-
      The mouse has progressive hearing loss, which has not been reported in
      patients.
  - reference: PMID:39153170
    reference_title: "Expanding TBCE-related phenotype-novel variant causing rigid spine, eosinophilia, neutropenia, and nocturnal hypoxemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Neurogenic features in distal and proximal leg muscles were observed in 85.7% of patients, alongside normal motor and sensory nerve conduction recordings."
    explanation: >-
      Sensory nerve conduction is normal in patients, unlike the mouse.
  posed_by: dismech curation
  posed_date: "2026-11-11T00:00:00Z"
- discussion_id: peamo_allele_specific_phenotypes
  prompt: >-
    Why does p.Ile155Asn cause neurodegeneration without hypoparathyroidism,
    while the c.155_166del deletion causes congenital hypoparathyroidism and
    growth failure without reported neurodegeneration, and the c.100+1G>A
    splice allele a third, milder phenotype?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic Hypomorphic TBCE Variants
  - pathophysiology#Reduced TBCE Protein Abundance
  rationale: >-
    The discovery authors call the disease alleles hypomorphic, and the
    splice allele is rescued by translation from an alternative reading
    frame, but residual TBCE has been measured only qualitatively and the
    tissue-specific consequences of each allele class (parathyroid and
    growth versus motor and central neurons) have not been explained. The
    2026 cohort reports a genotype-phenotype correlation without a
    mechanism.
  posed_by: dismech curation
  posed_date: "2026-11-11T00:00:00Z"

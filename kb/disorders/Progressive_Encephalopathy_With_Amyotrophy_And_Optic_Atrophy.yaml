animal_models:
- name: Progressive motor neuronopathy (pmn) mouse
  species: Mouse
  genotype: Tbce p.Trp524Gly homozygous (pmn/pmn), with or without a wild-type Tbce transgene
  publication: PMID:12389029
  description: >-
    Spontaneous mouse mutant homozygous for a Tbce missense allele at the
    last residue of the protein, which lowers TBCE stability. Motor axons
    degenerate from the endplate back to the cell body from two weeks of age,
    and the mice develop severe muscle weakness and respiratory failure and
    die at four to six weeks; a wild-type Tbce transgene restores a normal
    phenotype. The mice
    also have a sensory neuropathy and progressive hearing loss.
  modeled_mechanisms:
  - target: Distal Motor Axon Degeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      A dying-back motor axonopathy with microtubule loss, rescued by
      wild-type Tbce.
    limitations: >-
      A different allele in a different species with a much faster, lethal
      course. The human disease is a slowly progressive distal motor
      neuronopathy with normal sensory conduction, whereas the mouse also has
      a sensory neuropathy.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse motor axons degenerate within weeks of birth; patients with
        p.Ile155Asn lose motor function over years, so the timing and
        severity of the mouse axonopathy do not transfer.
    readouts:
    - name: Axonal microtubule number in sciatic and phrenic nerves
      target: Distal Motor Axon Degeneration
      direction: DECREASED
      interpretation: >-
        Microtubule loss in the degenerating motor nerves.
      evidence:
      - reference: PMID:12389029
        reference_title: "A missense mutation in Tbce causes progressive motor neuronopathy in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: "Electron microscopy of the sciatic and phrenic nerves of affected mice showed a reduced number of microtubules, probably due to defective stabilization."
        explanation: >-
          Electron microscopy of mutant nerves.
    evidence:
    - reference: PMID:12389029
      reference_title: "A missense mutation in Tbce causes progressive motor neuronopathy in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Transgenic complementation with a wildtype Tbce cDNA restored a normal phenotype in mutant mice."
      explanation: >-
        The phenotype is caused by the Tbce allele.
    - reference: CGGV:assertion_3f9500f5-48e8-49dc-b29a-3845056778ab-2025-02-25T180000.000Z
      reference_title: "TBCE / encephalopathy, progressive, with amyotrophy and optic atrophy (Moderate)"
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: "The gene-disease relationship is also supported by experimental evidence and specifically the mouse model pmn (PMID: 12446740), which is homozygous for the missense variant TBCE:p.Trp524Gly, and shares the same phenotypic features as those observed in affected individuals."
      explanation: >-
        ClinGen counts the pmn mouse as experimental evidence for this
        disease.
  - target: Golgi Fragmentation in Motor Neurons
    relationship: MEASURES
    fidelity: UNKNOWN
    model_scale: CELLULAR
    description: >-
      Golgi fragmentation and loss of Golgi-localized TBCE in motor neurons.
    limitations: >-
      Golgi structure has not been examined in neurons or fibroblasts from
      patients with p.Ile155Asn, so whether this step operates in the human
      disease is unknown.
    evidence:
    - reference: PMID:24951541
      reference_title: "Golgi fragmentation in pmn mice is due to a defective ARF1/TBCE cross-talk that coordinates COPI vesicle formation and tubulin polymerization."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "We here demonstrate severe and progressive Golgi fragmentation in motor neurons of progressive motor neuronopathy (pmn) mice due to loss of the Golgi-localized tubulin-binding cofactor E (TBCE)."
      explanation: >-
        The Golgi phenotype in the mouse.

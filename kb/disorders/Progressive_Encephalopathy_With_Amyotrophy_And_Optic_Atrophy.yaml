pathophysiology:
- name: Biallelic Hypomorphic TBCE Variants
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous germline TBCE variants combining the
    recurrent missense allele p.Ile155Asn with itself or with a frameshift
    allele. The missense protein is unstable rather than absent, and the
    disease differs from the developmental Sanjad-Sakati syndrome caused by
    other TBCE alleles, which the discovery authors interpret as hypomorphic
    variants driving neurodegeneration.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    description: >-
      Recurrent p.Ile155Asn on a shared Southern Italian background,
      homozygous or in trans with c.924del or c.1076del.
  genes:
  - preferred_term: TBCE
    term:
      id: hgnc:11582
      label: TBCE
  evidence:
  - reference: PMID:27666369
    reference_title: "TBCE Mutations Cause Early-Onset Progressive Encephalopathy with Distal Spinal Muscular Atrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Although loss of function of TBCE has been documented to impact multiple developmental processes, the present findings provide evidence that hypomorphic TBCE mutations primarily drive neurodegeneration."
    explanation: >-
      The discovery authors classify the disease alleles as hypomorphic.
  - reference: PMID:41833177
    reference_title: "Clinical-genetic features of the TBCE-related spectrum disorders: A focus on the childhood-onset neurodegenerative phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Genotype-phenotype correlation and a distinct geographic distribution were identified across phenotypes."
    explanation: >-
      Which TBCE phenotype results depends on genotype, consistent with an
      allele-class mechanism.
  downstream:
  - target: Reduced TBCE Protein Abundance
    causal_link_type: DIRECT
    description: >-
      The missense protein is degraded, lowering TBCE levels.
    evidence:
    - reference: PMID:27666369
      reference_title: "TBCE Mutations Cause Early-Onset Progressive Encephalopathy with Distal Spinal Muscular Atrophy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "Western blot analysis of patient fibroblasts documented a reduced amount of TBCE, suggestive of rapid degradation of the mutant protein, similarly to what was observed in pmn/pmn fibroblasts."
      explanation: >-
        Reduced TBCE protein in patient cells.
- name: Reduced TBCE Protein Abundance
  biological_scale: MOLECULAR
  description: >-
    Mutant TBCE is unstable, so patient fibroblasts contain less of the
    cofactor that captures alpha-tubulin for heterodimer assembly. The pmn
    mouse allele, a substitution at the last residue of the protein, likewise
    lowers TBCE stability.

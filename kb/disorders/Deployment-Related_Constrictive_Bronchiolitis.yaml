    term:
      id: CL:0000192
      label: smooth muscle cell
  locations:
  - preferred_term: membranous bronchiole
    term:
      id: UBERON:0002186
      label: bronchiole
  downstream:
  - target: Functional Small Airways Disease and Expiratory Air Trapping
  evidence:
  - reference: PMID:21774710
    reference_title: "Constrictive bronchiolitis in soldiers returning from Iraq and Afghanistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The case definition for constrictive bronchiolitis was the presence of extrinsic narrowing of the luminal wall caused by subepithelial fibrosis, smooth-muscle hypertrophy in membranous bronchioles (non-cartilaginous airways having a complete fibromuscular wall), or both in a patient with otherwise normal lung parenchyma."
    explanation: The case definition of the defining lesion, including its anatomical level.
  - reference: PMID:34954211
    reference_title: "Sustained Club Cell Injury in Mice Induces Histopathologic Features of Deployment-Related Constrictive Bronchiolitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most biopsies identified small airway disease, with a subset of 38 soldiers exhibiting histopathologic evidence of deployment-related constrictive bronchiolitis (DRCB), defined as a 20% increase in airway wall thickness with associated findings of chronic inflammation and peribronchiolar collagen deposition."
    explanation: Gives the quantitative histologic threshold now used to call DRCB.
- name: Distal Pulmonary Arterial Remodeling
  description: >-
    Pulmonary arteries running with the affected bronchovascular bundles are
    themselves remodeled: medial smooth-muscle hypertrophy plus adventitial
    thickening raise the wall-to-lumen ratio. In the sulfur dioxide mouse model
    this vascular limb, not the airway limb, is what produces pulmonary
    hypertension and reduced exercise tolerance, and it is driven by endothelial
    oxidative stress via isolevuglandin adducts and SOD2 acetylation.
  role: driver
  biological_scale: TISSUE
  cell_types:

phenotypes:
- category: Clinical
  name: Exertional dyspnea
  description: >-
    Breathlessness on exertion that appeared during or after deployment and
    prevents the individual from sustaining a previously achievable level of
    physical work. It persists over years of follow-up.
  phenotype_term:
    preferred_term: Exertional dyspnea
    term:
      id: HP:0002875
      label: Exertional dyspnea
    temporality: CHRONIC
  frequency: Universal in reported series (this is the presenting symptom)
  evidence:
  - reference: PMID:34081035
    reference_title: "Postdeployment Respiratory Syndrome in Soldiers With Chronic Exertional Dyspnea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical follow-up of 29 soldiers (ranging from 1 to 15 y) showed persistence of exertional dyspnea in all individuals and a decline in total lung capacity."
    explanation: Establishes the symptom and its persistence.
- category: Clinical
  name: Exercise intolerance
  description: >-
    Objective exercise limitation. In the index cohort, maximal oxygen consumption
    and anaerobic threshold sat at the lower limit of the normal population range
    but were clearly inferior to military control subjects, which is why testing
    against population norms misses the disease.
  phenotype_term:
    preferred_term: Exercise intolerance
    term:
      id: HP:0003546
      label: Exercise intolerance
  evidence:
  - reference: PMID:21774710
    reference_title: "Constrictive bronchiolitis in soldiers returning from Iraq and Afghanistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results of pulmonary-function and cardiopulmonary-exercise testing were generally within normal population limits but were inferior to those of the military control subjects."
    explanation: >-
      Shows the exercise limitation is real but only detectable against a fit
      military reference population.
- category: Physiological
  name: Decreased DLCO
  description: >-
    An isolated reduction in the carbon monoxide diffusing capacity with normal
    spirometry and lung volumes is the commonest pulmonary function abnormality,
    and matches the alveolar septal fibrosis and capillary rarefaction seen on
    morphometry.
  phenotype_term:
    preferred_term: Decreased DLCO
    term:
      id: HP:0045051
      label: Decreased DLCO
  evidence:
  - reference: PMID:21774710
    reference_title: "Constrictive bronchiolitis in soldiers returning from Iraq and Afghanistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spirometric values, lung volumes, and measures of carbon monoxide diffusing capacity were within normal limits in 13 soldiers; 19 had an isolated low carbon monoxide diffusing capacity with normal spirometric values and lung volumes."
    explanation: >-
      Gives the pulmonary-function pattern, including how often everything is
      normal.
- category: Clinical
  name: Wheezing
  description: >-
    Wheeze is the commonest chronic respiratory symptom reported by deployed
    veterans and, with chronic bronchitis, forms part of the broader
    deployment-related respiratory disease presentation from which biopsy-proven
    constrictive bronchiolitis is separated.
  phenotype_term:
    preferred_term: Wheezing
    term:
      id: HP:0030828
      label: Wheezing
  frequency: 15.6% in the past 12 months among deployed US veterans
  evidence:
  - reference: PMID:37968126
    reference_title: "Chronic respiratory symptoms following deployment-related occupational and environmental exposures among US veterans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exposure to VGDF was associated with dyspnoea (OR 1.29; 95% CI 1.14 to 1.58) and wheeze (OR 1.18; 95% CI 1.02 to 1.35)."
    explanation: Associates wheeze with the deployment occupational exposure.
histopathology:
- name: Extrinsic narrowing of membranous bronchioles by subepithelial fibrosis
  description: >-
    The diagnostic lesion, requiring surgical lung biopsy. Membranous bronchioles
    show mural thickening with mixed airway wall inflammation; larger airways and
    alveolar structures are otherwise normal on routine histology.
  finding_term:
    preferred_term: subepithelial fibrosis of membranous bronchioles
    term:
      id: NCIT:C3044
      label: Fibrosis
  diagnostic: true
  evidence:
  - reference: PMID:21774710
    reference_title: "Constrictive bronchiolitis in soldiers returning from Iraq and Afghanistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At low magnification, biopsy samples showed scattered small densities, which at higher magnification were identifiable as membranous bronchioles with variable mural thickening, mixed airway-wall inflammation, and peribronchiolar deposition of grayish black pigment."
    explanation: Describes the diagnostic histology as seen at biopsy.
  - reference: PMID:21774710
    reference_title: "Constrictive bronchiolitis in soldiers returning from Iraq and Afghanistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alveolar structures and larger airways were otherwise normal in all 38 soldiers."
    explanation: >-
      Records the negative finding that makes the lesion bronchiolocentric on
      routine histology, in contrast with the quantitative morphometry that later
      found alveolar and pleural changes.
- name: Squamous metaplasia of the bronchiolar epithelium
  description: >-
    Epithelial thinning with squamous metaplasia accompanies the airway wall
    thickening, and is the specific feature shared with the club-cell-injury mouse
    model.
  finding_term:
    preferred_term: squamous metaplasia
    term:
      id: NCIT:C3237
      label: Squamous Metaplasia
  evidence:
  - reference: PMID:34954211
    reference_title: "Sustained Club Cell Injury in Mice Induces Histopathologic Features of Deployment-Related Constrictive Bronchiolitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histopathologic analysis of this biopsy revealed findings of squamous metaplasia and airway wall thickening (Figure 5, C and D) similar to those observed in CC-DTA mice on protocol day 20."
    explanation: Records the finding in human DRCB tissue alongside the model comparison.
imaging_findings:
- name: Expiratory air trapping on high-resolution chest CT
  modality: CT
  description: >-
    Imaging is normal in most affected personnel. Mild air trapping or
    centrilobular nodules are present in roughly a quarter, so a normal
    high-resolution CT does not exclude the disease, which is precisely why
    surgical biopsy has been needed.
  imaging_finding_term:
    preferred_term: Expiratory air trapping
    term:
      id: HP:0032968
      label: Expiratory air trapping
  frequency: About one quarter of biopsy-proven cases
  evidence:
  - reference: PMID:21774710
    reference_title: "Constrictive bronchiolitis in soldiers returning from Iraq and Afghanistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All soldiers with constrictive bronchiolitis had normal results on chest radiography, but about one quarter were found to have mosaic air trapping or centrilobular nodules on chest CT."
    explanation: Gives both the finding and its low sensitivity.
  - reference: PMID:21774710
    reference_title: "Constrictive bronchiolitis in soldiers returning from Iraq and Afghanistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only a few soldiers had high-resolution CT showing the centrilobular nodularity or expiratory air trapping that can be associated with constrictive bronchiolitis."
    explanation: Restates the insensitivity of the classic CT signs in this population.
diagnosis:
- name: Surgical lung biopsy after an unrevealing noninvasive evaluation
  description: >-
    Because symptoms, examination, radiography and routine pulmonary function
    testing are all typically normal, the historical diagnostic pathway has been
    video-assisted thoracoscopic lung biopsy in symptomatic previously deployed
    personnel whose noninvasive workup found no explanation.
  diagnosis_term:
    preferred_term: surgical lung biopsy
    term:
      id: NCIT:C51748
      label: Lung Biopsy
  results: >-
    Extrinsic narrowing of membranous bronchioles by subepithelial fibrosis and/or
    smooth-muscle hypertrophy, with peribronchiolar pigment, in otherwise normal
    parenchyma.
  evidence:
  - reference: PMID:21774710
    reference_title: "Constrictive bronchiolitis in soldiers returning from Iraq and Afghanistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A total of 49 soldiers underwent thoracoscopic lung biopsy after noninvasive evaluation did not provide an explanation for their symptoms."
    explanation: Describes the diagnostic pathway as actually applied in the index cohort.
- name: Quantitative CT phenotyping as a noninvasive alternative
  description: >-
    A quantitative CT-derived probability index built on biopsy-proven DRCB
    identifies a subset of symptomatic formerly deployed veterans with
    small-airway abnormality and more intense self-reported exposure effects. This
    is a research phenotyping tool, not a validated diagnostic test.
  diagnosis_term:
    preferred_term: quantitative chest computed tomography
    term:
      id: NCIT:C17204
      label: Computed Tomography
  results: >-
    Elevated functional small airways disease and high attenuation area relative
    to controls; a DRCB probability index above 0.5 selects veterans with
    oscillometric and quantitative-CT small airways disease.
  evidence:
  - reference: PMID:40399908
    reference_title: "Use of quantitative CT chest imaging to derive and assess a radiographic phenotype of deployment-related constrictive bronchiolitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The FDSV subjects whose DRCB-PI was > 0.5 had greater evidence of small airways disease (assessed by oscillometry and QCT) and self-reported more intense immediate health effects to their exposures to military burn pit smoke, and sand and dust."
    explanation: Reports what the noninvasive index selects for.
differential_diagnoses:
- name: Asthma
  description: >-
    New-onset asthma is the other major post-deployment respiratory diagnosis and
    is the one for which the US Department of Veterans Affairs has issued a
    service-connection presumption. It is separated from constrictive
    bronchiolitis by bronchodilator responsiveness and by not requiring biopsy.
  distinguishing_features:
  - Reversible airflow obstruction with bronchodilator and controller response
  - Diagnosable noninvasively, without surgical lung biopsy
  - >-
    Constrictive bronchiolitis instead has fixed extrinsic airway narrowing,
    usually normal spirometry, and no approved pharmacotherapy
  evidence:
  - reference: PMID:35579689
    reference_title: "Histopathologic Insights into Distal Lung Injury and Inflammation following Military Deployment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the Department of Veterans Affairs acknowledged these exposure–disease linkages and issued a presumption connecting asthma, chronic rhinitis, and sinusitis diagnosed within 10 years of military service in veterans with particulate matter exposure during SWA military deployment (9)."
    explanation: >-
      Establishes asthma as the recognised alternative post-deployment respiratory
      diagnosis in the same exposed population.
- name: Other biopsy diagnoses in previously deployed personnel
  description: >-
    Eleven of the 49 biopsied soldiers in the index series had a different
    pathological diagnosis that explained their dyspnea. A previously deployed
    individual with unexplained dyspnea does not have constrictive bronchiolitis
    by default.
  distinguishing_features:
  - Established by the surgical lung biopsy itself
  - >-
    The Delphi consensus explicitly stresses considering alternative diagnoses
    before attributing symptoms to constrictive bronchiolitis
  evidence:
  - reference: PMID:21774710
    reference_title: "Constrictive bronchiolitis in soldiers returning from Iraq and Afghanistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the remaining 11 soldiers, diagnoses other than constrictive bronchiolitis that could explain the presenting dyspnea were established."
    explanation: Quantifies the alternative-diagnosis yield in the index biopsy series.
  - reference: PMID:36343686
    reference_title: "Consensus Statements on Deployment-Related Respiratory Disease, Inclusive of Constrictive Bronchiolitis: A Modified Delphi Study."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Twenty-five of 28 statements reached consensus, including the definition of CB as a histologic pattern of lung injury that occurs in some previously deployed individuals while recognizing the importance of considering alternative diagnoses."
    explanation: Expert consensus that alternative diagnoses must be actively considered.
treatments:
- name: Cessation of further inhalational exposure
  description: >-
    Removing the individual from continuing inhalational hazard is the only
    intervention with a clear mechanistic rationale, since the disease is driven
    by sustained epithelial injury from a modifiable exposure. It is preventive
    rather than restorative: the established fibrotic narrowing does not reverse.
  treatment_term:
    preferred_term: exposure cessation
    term:
      id: NCIT:C15843
      label: Preventive Intervention
  therapeutic_modality: BEHAVIORAL
  target_mechanisms:
  - target: Sustained Club Cell Injury in Membranous Bronchioles
    description: >-
      Ending the exposure removes the driver of continuing club cell injury, which
      is the step the mouse model identifies as sufficient to initiate the lesion.
  notes: >-
    No trial has tested exposure cessation as an intervention in this disease; the
    rationale is mechanistic and preventive, and is recorded as such rather than
    as evidenced clinical benefit.
- name: Symptom-directed and supportive management
  description: >-
    In the absence of disease-modifying therapy, care is symptom-directed. Inhaled
    bronchodilator and corticosteroid trials are commonly given but have no
    demonstrated effect on the constrictive lesion.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:35579689
    reference_title: "Histopathologic Insights into Distal Lung Injury and Inflammation following Military Deployment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "there is no currently approved pharmacotherapy for distal lung diseases such as post-deployment constrictive bronchiolitis."
    explanation: >-
      States the therapeutic vacuum this treatment entry exists to record; no
      disease-modifying option is claimed.
- name: Pulmonary rehabilitation
  description: >-
    Exercise-based rehabilitation for the exertional limitation that defines the
    presentation. Recorded as standard supportive management for a chronic
    exertional respiratory limitation; no trial in this specific population has
    been performed.
  treatment_term:
    preferred_term: pulmonary rehabilitation
    term:
      id: NCIT:C157966
      label: Pulmonary Rehabilitation
  therapeutic_modality: BEHAVIORAL
  target_phenotypes:
  - preferred_term: Exercise intolerance
    term:
      id: HP:0003546
      label: Exercise intolerance
  notes: >-
    Left deliberately without an evidence item: no study of pulmonary
    rehabilitation in deployment-related constrictive bronchiolitis was found, so
    there is no quotable result. Recorded because it is what patients receive, and
    flagged here rather than supported with a citation about a different disease.
animal_models:
- name: CC-DTA sustained club cell injury mouse
  species: Mouse
  genotype: >-
    CC-DTA (club-cell-restricted, doxycycline-inducible diphtheria toxin A),
    doxycycline for 10 consecutive days
  publication: PMID:34954211
  description: >-
    An inducible transgenic model in which diphtheria toxin A expression is
    restricted to club cells, producing sustained progenitor-cell injury without
    any inhaled toxicant. It reproduces the epithelial, inflammatory and fibrotic
    features of DRCB and allows the macrophage-TGF-beta limb to be tested
    interventionally.
  modeled_mechanisms:
  - target: Sustained Club Cell Injury in Membranous Bronchioles
    relationship: PERTURBS
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The model imposes the node directly, by targeted club cell death, rather
      than reproducing the exposure that is thought to cause it in humans.
    limitations: >-
      Club cell death is induced genetically by diphtheria toxin A, not by inhaled
      particulate matter, so the model asserts nothing about which deployment
      exposure produces club cell injury or at what dose. The authors chose this
      design precisely because the causative exposure type, dose and duration in
      humans are unknown.
    evidence:
    - reference: PMID:34954211
      reference_title: "Sustained Club Cell Injury in Mice Induces Histopathologic Features of Deployment-Related Constrictive Bronchiolitis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Ingestion of doxycycline by CC-DTA mice activates diphtheria toxin-A expression only in club cells, leading to targeted autonomous cell death."
      explanation: Describes how the model imposes the targeted club cell injury.
  - target: TGF-beta Activation and Myofibroblast Recruitment
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-

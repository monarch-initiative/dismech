    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gene expression analysis provides further insights into possible disease mechanisms, with upregulation of mainly Th-1 type pro-inflammatory pathways (e.g., NF-κB, Toll-like receptor, and T-cell signaling)."
    explanation: Names the signalling programs upregulated in affected airway tissue.
- name: Subepithelial Fibrosis and Smooth Muscle Hypertrophy Narrowing Membranous Bronchioles
  description: >-
    The defining lesion. Membranous (non-cartilaginous) bronchioles are narrowed
    from outside the lumen by subepithelial fibrosis, smooth-muscle hypertrophy or
    both, in a lung whose parenchyma is otherwise normal on routine histology.
    The operational histologic threshold used in later work is a 20% increase in
    airway wall thickness with chronic inflammation and peribronchiolar collagen.
  role: consequence
  conforms_to: "fibrotic_response#Architectural Distortion and Organ Dysfunction"
  biological_scale: TISSUE
  cell_types:

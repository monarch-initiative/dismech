- name: Lymphocytic Bronchiolitis and Lymphoid Follicle Formation
  description: >-
    Airway walls carry a more than three-fold increase in CD4 and CD8 T cells,
    with B-cell lymphoid follicles adjacent to small airways in 64% of affected
    soldiers and within alveolar tissue in 56%, against 12% and 6% in
    non-diseased controls. Airway tissue gene expression is skewed to Th1-type
    pro-inflammatory programs. This chronic adaptive immune activation is the
    reason the disease is suspected of being progressive rather than a fixed
    scar.

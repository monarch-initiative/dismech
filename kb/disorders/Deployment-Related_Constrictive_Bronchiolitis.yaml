    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, pleural involvement with inflammation and/or fibrosis was present in the majority (92%) of soldiers."
    explanation: Quantifies pleural involvement in the morphometric series.
- name: Functional Small Airways Disease and Expiratory Air Trapping
  description: >-
    The physiological expression of the narrowed bronchioles. Conventional
    spirometry and lung volumes are usually normal, so the abnormality is detected
    as functional small airways disease on quantitative expiratory CT and as
    abnormal reactance and distal airway resistance on impulse oscillometry.

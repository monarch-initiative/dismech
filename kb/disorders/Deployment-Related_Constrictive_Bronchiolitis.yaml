- name: Repetitive sulfur dioxide exposure mouse
  species: Mouse
  genotype: Wild-type, with a Sirtuin-3 overexpressing transgenic arm
  publication: PMID:38410870
  description: >-
    An inhalational model built around the sulfur dioxide exposure reported by the
    index cohort. It reproduces adaptive immune activation, airway wall remodeling
    and pulmonary vascular disease, and identifies endothelial oxidative stress
    (isolevuglandin adducts, SOD2 acetylation) as the driver of the vascular limb.
  modeled_mechanisms:
  - target: Distal Pulmonary Arterial Remodeling
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Repetitive sulfur dioxide produces pulmonary vascular remodeling that causes
      pulmonary hypertension and reduced exercise tolerance, and the remodeling is
      prevented by scavenging isolevuglandins or by Sirtuin-3 overexpression.
    limitations: >-
      Pulmonary hypertension has not been established as a feature of human DRCB;
      this model assigns the exercise limitation to the vascular compartment on the
      strength of a mouse phenotype. Sulfur dioxide is also only one of the
      candidate deployment exposures and was not reported by a substantial fraction
      of the index cohort.
    readouts:
    - name: Pulmonary vascular remodeling after isolevuglandin scavenging
      target: Distal Pulmonary Arterial Remodeling
      direction: ABOLISHED
      interpretation: >-
        Identifies the isolevuglandin-Sirt3-SOD2 oxidative axis as necessary for
        the vascular lesion in this model.
      evidence:
      - reference: PMID:38410870
        reference_title: "Repetitive sulfur dioxide exposure in mice models post-deployment respiratory syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In addition, 2-HOBA treatment or Siruin-3 overexpression in a transgenic mouse model prevented vascular remodeling following SO2 exposure."
        explanation: Reports the two interventions that prevented the vascular remodeling.
    evidence:
    - reference: PMID:38410870
      reference_title: "Repetitive sulfur dioxide exposure in mice models post-deployment respiratory syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "our results indicate that repetitive SO2 exposure recapitulates many aspects of PDRS and that oxidative stress appears to mediate PV remodeling in this model."
      explanation: >-
        The authors' statement of what the model recapitulates and the mediator it
        implicates.
  - target: Sustained Club Cell Injury in Membranous Bronchioles
    relationship: PERTURBS
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Inhaled sulfur dioxide is delivered by the physiological route and produces
      airway wall remodeling, so unlike the CC-DTA model it tests an actual
      deployment-relevant inhalational exposure.
    limitations: >-
      The model does not demonstrate club-cell-specific injury; it shows airway
      wall remodeling downstream of an inhalational exposure, so the mapping onto
      this specific node is inferred from the CC-DTA work rather than shown here.
    evidence:
    - reference: PMID:38410870
      reference_title: "Repetitive sulfur dioxide exposure in mice models post-deployment respiratory syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we developed a model of repetitive exposure to SO2 in mice that phenocopies many aspects of PDRS, including adaptive immune activation, airway wall remodeling, and pulmonary vascular (PV) disease."
      explanation: States the airway and immune features the inhalational model reproduces.
  evidence:
  - reference: PMID:38410870
    reference_title: "Repetitive sulfur dioxide exposure in mice models post-deployment respiratory syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "SO2 exposure led to increased formation of isolevuglandins (isoLGs) adducts and superoxide dismutase 2 (SOD2) acetylation in endothelial cells, which were attenuated by treatment with the isoLG scavenger 2-hydroxybenzylamine acetate (2-HOBA)."
    explanation: The molecular finding that makes this model informative beyond phenotype matching.
discussions:
- discussion_id: open_mondo_anchor
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Should a MONDO new-term request be filed for deployment-related constrictive
    bronchiolitis, or is `MONDO:0100127` toxic bronchiolitis obliterans an
    adequate home for it?
  attaches_to:
  - disease#Deployment-Related Constrictive Bronchiolitis
  rationale: >-
    MONDO has no class for this entity under any of its three names (DRCB, PDRS,
    DRRD). The nearest class, `MONDO:0100127` toxic bronchiolitis obliterans, is
    strictly broader and also covers diacetyl, nitrogen dioxide and sulfur mustard
    bronchiolitis. The argument for a distinct class is that this entity has a
    defining exposure setting, an operational histologic threshold (20% airway
    wall thickening), a distinctive normal-spirometry phenotype, and a
    multicompartmental pathology that ordinary toxic bronchiolitis obliterans does
    not carry. The argument against is that it may be the same lesion with a
    different exposure, in which case a MONDO class would encode an
    epidemiological grouping rather than a disease. The dismech agent cannot file
    in the MONDO tracker; this needs a curator to forward it.
  notes: >-
    Until this resolves, the entry has no `disease_term` and records
    `MONDO:0100127` as a `skos:narrowMatch` mapping instead.
- discussion_id: interp_drcb_pdrs_drrd_naming
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    Is this entry one disease with three names, or has the entity's scope
    genuinely widened from a bronchiolar lesion to a multicompartmental one?
  attaches_to:
  - disease#Deployment-Related Constrictive Bronchiolitis
  - pathophysiology#Subepithelial Fibrosis and Smooth Muscle Hypertrophy Narrowing Membranous Bronchioles
  - pathophysiology#Interalveolar Septal Fibrosis and Capillary Rarefaction
  - pathophysiology#Visceral Pleural Inflammation and Fibrosis
  rationale: >-
    The 2011 index series described a bronchiolocentric lesion in otherwise normal
    parenchyma. Quantitative morphometry of overlapping and later biopsies then
    found arterial, alveolar-septal and pleural changes in the same lungs, and the
    Vanderbilt group renamed the entity post-deployment respiratory syndrome to
    reflect that. A 2023 Delphi panel took a third position: it kept constrictive
    bronchiolitis as a histologic pattern and introduced deployment-related
    respiratory disease as a broad clinical descriptor subsuming it. These are not
    simply synonyms, because they disagree about whether the bronchiole is the
    seat of the disease. This entry is curated at the biopsy-defined entity and
    records all three names as synonyms, with the non-bronchiolar compartments as
    their own pathophysiology nodes so the disagreement is visible in the
    pathograph rather than buried in prose.
  evidence:
  - reference: PMID:36343686
    reference_title: "Consensus Statements on Deployment-Related Respiratory Disease, Inclusive of Constrictive Bronchiolitis: A Modified Delphi Study."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "deployment-related respiratory disease (DRRD) was proposed as a broad term to subsume a wide range of potential syndromes and conditions identified through noninvasive evaluation or when surgical lung biopsy reveals evidence of multicompartmental lung injury that may include CB."
    explanation: The consensus position that DRRD is the umbrella and CB one pattern within it.
  - reference: PMID:34081035
    reference_title: "Postdeployment Respiratory Syndrome in Soldiers With Chronic Exertional Dyspnea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diffuse fibrosis with excessive collagen accumulation in airway walls, blood vessel walls, alveolar tissue, and visceral pleura is a prominent pathologic feature detected in the lungs of soldiers with PDRS."
    explanation: The multicompartmental claim that motivated the PDRS renaming.
- discussion_id: kgap_particulate_causality
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the retained peribronchiolar particulate material causal, or only a marker
    of exposure intensity?
  attaches_to:
  - pathophysiology#Retained Peribronchiolar Particulate Burden
  rationale: >-
    Near every biopsy in the index series showed peribronchiolar pigment with
    polarizable material, and burn-pit combustion signatures are recoverable from
    lung tissue, but no study has shown that the retained material drives the
    fibrotic lesion rather than co-occurring with the exposure that does. The 2026
    ATS workshop names this explicitly as one of three outstanding gaps, and the
    leading mechanistic model deliberately bypasses the question by inducing club
    cell injury genetically.
  evidence:
  - reference: PMID:42360728
    reference_title: "Deployment-related respiratory health: bridging the gap between clinical and epidemiological associations and disease mechanisms: an official American Thoracic Society Workshop Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the contribution of exposure-related foreign material in the lung to clinical and pathologic findings"
    explanation: The ATS workshop's own statement of this gap.
- discussion_id: kgap_exposure_dose_response
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which specific deployment exposures, at what dose and duration, produce small
    airways disease?
  attaches_to:
  - environmental#Deployment inhalation of respirable particulate matter
  - pathophysiology#Distal Deposition of Respirable Deployment Particulate Matter
  rationale: >-
    Individual-level exposure was never measured during deployment, so every
    exposure-response analysis rests on retrospective self-report. The index cohort
    contains soldiers with an identified point-source exposure and soldiers with
    none whose disease was indistinguishable, so no single agent accounts for the
    entity. Closing this gap requires either historical exposure reconstruction or
    prospective monitoring in future deployments.
  evidence:
  - reference: PMID:42360728
    reference_title: "Deployment-related respiratory health: bridging the gap between clinical and epidemiological associations and disease mechanisms: an official American Thoracic Society Workshop Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the extent and mechanisms through which specific exposures result in impaired pulmonary function, small airways disease, and potentially future chronic pulmonary diseases"
    explanation: The ATS workshop's statement of the exposure-mechanism gap.
- discussion_id: hmm_pulmonary_hypertension_vascular_limb
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    The sulfur dioxide mouse attributes exercise limitation to pulmonary vascular
    disease rather than to the airway lesion; does that hold in humans, where
    pulmonary hypertension is not an established feature of this disease?
  attaches_to:
  - pathophysiology#Distal Pulmonary Arterial Remodeling
  - phenotypes#Exercise intolerance
  rationale: >-
    In the sulfur dioxide model, small airway abnormalities were explicitly not
    sufficient to alter lung mechanics, and it was pulmonary vascular remodeling
    that produced pulmonary hypertension and reduced exercise tolerance. Human
    morphometry does show arterial muscularization and raised wall-to-lumen ratio
    in the same lungs, so the substrate is present, but pulmonary hypertension is
    not a reported clinical feature of DRCB and the human exercise limitation is
    usually attributed to the airway lesion. If the mouse is right, the disease is
    being investigated in the wrong compartment and the diagnostic pathway, which
    is built around airway histology, is looking in the wrong place. If it is
    wrong, the model's headline physiological result does not transfer.
  proposed_experiments:
  - experiment_id: exp_drcb_exercise_hemodynamics
    name: Right heart catheterisation and cardiopulmonary exercise testing in biopsy-proven DRCB
    description: >-
      Measure pulmonary artery pressures and pulmonary vascular resistance at rest
      and during exercise in individuals with biopsy-proven DRCB, alongside
      quantitative-CT small airways measures, and test which better explains the
      exercise limitation.
    would_support:
    - pathophysiology#Distal Pulmonary Arterial Remodeling
    supporting_outcome:
    - >-
      Exercise pulmonary vascular resistance correlates with exercise limitation
      independently of quantitative-CT functional small airways disease.
    would_refute:
    - pathophysiology#Distal Pulmonary Arterial Remodeling
    refuting_outcome:
    - >-
      Pulmonary haemodynamics are normal at rest and on exercise, and the
      limitation tracks small airways measures alone.
  evidence:
  - reference: PMID:38410870
    reference_title: "Repetitive sulfur dioxide exposure in mice models post-deployment respiratory syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Although abnormalities in small airways were not sufficient to alter lung mechanics, PV remodeling resulted in the development of pulmonary hypertension and reduced exercise tolerance in SO2-exposed mice."
    explanation: The model result that creates the mismatch with the human framing.
- discussion_id: curation_todo_occupational_smallairway_module
  kind: CURATION_TODO
  status: OPEN
  prompt: >-
    Should the inhaled-particulate to small-airway-fibrosis chain be factored out
    into a mechanism module that this entry, Sulfur_Mustard_Poisoning and other
    inhalational bronchiolitis entries could conform to?
  attaches_to:
  - pathophysiology#Sustained Club Cell Injury in Membranous Bronchioles
  - pathophysiology#Subepithelial Fibrosis and Smooth Muscle Hypertrophy Narrowing Membranous Bronchioles
  rationale: >-
    Issue #10976 raised the module option alongside the disease-entry option. This
    entry took the disease-entry route because the entity has its own exposure
    setting, diagnostic criteria and natural history. A module remains attractive,
    since the club-cell-injury-to-peribronchiolar-fibrosis chain is not specific to
    deployment, but it needs at least two other entries with curated bronchiolar
    nodes to conform to it, and today only Sulfur_Mustard_Poisoning describes
    bronchiolitis obliterans mechanistically. The generic fibrotic chain is already
    covered by `conforms_to` links to `fibrotic_response` on five nodes here, so a
    new module would have to earn its place by adding the airway-specific steps
    (club cell progenitor loss, squamous metaplasia, extrinsic luminal narrowing)
    that `fibrotic_response` does not carry.
review_notes: >-
  Curated from issue #10976 (ATS workshop report PMID:42360728). Scope decision:
  curated as the biopsy-defined mechanistic entity rather than as the broad DRRD
  umbrella, because DRRD explicitly subsumes asthma and chronic rhinosinusitis,
  which are separate diseases with their own mechanisms, and a dismech Grouping
  needs existing member entries it does not yet have. See the
  `interp_drcb_pdrs_drrd_naming` discussion.

  Deliberately not curated here: pulmonary hypertension is NOT recorded as a human
  phenotype. It is a mouse result, and recording it as a human feature would be
  exactly the model-to-human over-reach the
  `hmm_pulmonary_hypertension_vascular_limb` discussion exists to flag. Genetic
  susceptibility is likewise absent; no gene-level work in this disease was found,
  and the entry says nothing rather than speculating.

  Every mouse-derived evidence item carries `evidence_source: MODEL_ORGANISM`, and
  those used to support a step in the human chain are additionally graded
  `directness: INDIRECT`. Human histopathology and physiology claims are all
  sourced to human series.

name: Deployment-Related Constrictive Bronchiolitis
creation_date: "2026-09-12T12:00:00Z"
category: Environmental
categories:
- Occupational and Environmental Lung Disease
- Toxic Exposure Disorder
- Small Airways Disease
parents:
- Occupational Lung Disease
- Bronchiolitis
synonyms:
- DRCB
- post-deployment respiratory syndrome
- PDRS
- deployment-related distal lung disease
- Iraq/Afghanistan war lung injury
- constrictive bronchiolitis in previously deployed military personnel
description: >-
  Deployment-related constrictive bronchiolitis (DRCB) is a biopsy-defined small
  airways disease of military personnel deployed to Iraq, Afghanistan and the
  wider Southwest Asia theatre, who inhaled high concentrations of respirable
  particulate matter from desert dust, open-air burn pit smoke, engine exhaust
  and occupational vapours, gases, dusts and fumes. Affected personnel present
  years after deployment with exertional dyspnea and an inability to sustain
  pre-deployment exercise performance, while chest radiography, spirometry and
  lung volumes are typically normal, so the diagnosis has historically required
  surgical lung biopsy. The defining lesion is extrinsic narrowing of membranous
  (non-cartilaginous) bronchioles by subepithelial fibrosis and smooth-muscle
  hypertrophy, accompanied by peribronchiolar deposition of grey-black, partly
  polarizable particulate pigment. Quantitative histomorphometry shows the injury
  is not confined to the airway: the same lungs carry CD4 and CD8 T cell
  infiltration of airway walls with B-cell lymphoid follicles, muscularized and
  collagen-rich distal pulmonary arteries, fibrotic interalveolar septa with
  reduced capillary density, and visceral pleural inflammation or fibrosis.
  Because of that multicompartmental pattern, the same entity is also reported as
  post-deployment respiratory syndrome (PDRS), and an expert Delphi panel placed
  both under the broader descriptor deployment-related respiratory disease
  (DRRD). Mechanistic work in mice implicates sustained injury to club cells, the
  progenitor cells of the distal airway epithelium, with alveolar macrophage
  accumulation, TGF-beta activation and peribronchiolar collagen deposition as
  the fibrotic limb, and oxidative stress in the endothelium as the vascular
  limb. There is no approved pharmacotherapy; management is exposure cessation,
  symptom-directed treatment and rehabilitation.
notes: >-
  This entry deliberately carries no `disease_term`. MONDO has no class for
  deployment-related constrictive bronchiolitis, for post-deployment respiratory
  syndrome, or for deployment-related respiratory disease: an OLS search of MONDO
  for "deployment related respiratory disease" returns nothing, and the nearest
  classes are `MONDO:0100123` toxic bronchiolitis and `MONDO:0100127` toxic
  bronchiolitis obliterans, both of which are broader inhalational-toxicant
  categories that also cover diacetyl (popcorn worker's) bronchiolitis, silo
  filler's disease and sulfur mustard injury. `MONDO:0100127` is recorded in
  `mappings.mondo_mappings` with `skos:narrowMatch` rather than being reused bare
  as this entry's anchor. A MONDO new-term request is the right follow-up; see
  the `open_mondo_anchor` discussion.
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0100127
      label: toxic bronchiolitis obliterans
    mapping_predicate: skos:narrowMatch
    mapping_source: manual curation
    notes: >-
      DRCB is one inhalational cause of toxic bronchiolitis obliterans, so the
      MONDO class is strictly broader than this entry. Recorded as a mapping, not
      as `disease_term`, so the entry does not claim a MONDO identity it does not
      have.
references:
- reference: PMID:21774710
  title: "Constrictive bronchiolitis in soldiers returning from Iraq and Afghanistan."
- reference: PMID:34081035
  title: "Postdeployment Respiratory Syndrome in Soldiers With Chronic Exertional Dyspnea."
- reference: PMID:42360728
  title: "Deployment-related respiratory health: bridging the gap between clinical and epidemiological associations and disease mechanisms: an official American Thoracic Society Workshop Report."
- reference: PMID:36343686
  title: "Consensus Statements on Deployment-Related Respiratory Disease, Inclusive of Constrictive Bronchiolitis: A Modified Delphi Study."
prevalence:
- population: >-
    US veterans deployed to Afghanistan and Southwest Asia (VA Cooperative Study
    "Service and Health Among Deployed Veterans", n=1960)
  measure_type: PERIOD_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 7300.0
  notes: >-
    Self-reported dyspnoea in the past 12 months in a deployed-veteran cohort.
    This is the symptom that brings personnel to evaluation, NOT the prevalence
    of biopsy-proven constrictive bronchiolitis, which is unknown because the
    diagnosis requires surgical lung biopsy and no population-based biopsy series
    exists.
  evidence:
  - reference: PMID:37968126
    reference_title: "Chronic respiratory symptoms following deployment-related occupational and environmental exposures among US veterans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of dyspnoea, chronic bronchitis and wheeze in the past 12 months was 7.3%, 8.2% and 15.6%, respectively."
    explanation: >-
      Gives the denominator-based symptom prevalence in a deployed veteran
      cohort, which is the population from which DRCB cases are drawn.
- population: >-
    Fort Campbell soldiers referred for unexplained post-deployment exertional
    dyspnea who proceeded to surgical lung biopsy (n=49)
  measure_type: UNKNOWN
  prevalence_class: COMMON
  notes: >-
    A referral-series proportion, not a population rate: 38 of 49 biopsied
    soldiers had constrictive bronchiolitis. It says how often the lesion
    explains otherwise-unexplained post-deployment dyspnea, and says nothing
    about how common the disease is among deployers.
  evidence:
  - reference: PMID:21774710
    reference_title: "Constrictive bronchiolitis in soldiers returning from Iraq and Afghanistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 49 soldiers who underwent lung biopsy, all biopsy samples were abnormal, with 38 soldiers having changes that were diagnostic of constrictive bronchiolitis."
    explanation: >-
      Source of the 38/49 referral-series proportion, and of the observation that
      every biopsy in the series was abnormal.
progression:
- phase: Deployment exposure
  notes: >-
    Land-based deployment to Afghanistan or Southwest Asia with repeated or
    sustained inhalation of respirable particulate matter. Median deployment
    duration in the VA cooperative cohort was 11.7 months.
  evidence:
  - reference: PMID:37968126
    reference_title: "Chronic respiratory symptoms following deployment-related occupational and environmental exposures among US veterans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cohort mean age was 40.7 years with a median deployment duration of 11.7 months."
    explanation: Establishes the duration of the exposure window in a large deployed cohort.
- phase: Post-deployment exertional limitation
  notes: >-
    Return from deployment with new exertional dyspnea and failure to meet a
    previously achievable physical-fitness standard, with a normal chest
    examination and normal chest radiograph.
  evidence:
  - reference: PMID:21774710
    reference_title: "Constrictive bronchiolitis in soldiers returning from Iraq and Afghanistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results of physical examination of the chest were normal in all the soldiers."
    explanation: >-
      Documents that the clinical examination is uninformative at the point of
      presentation, which is what drives the invasive diagnostic pathway.
- phase: Persistent chronic phase
  duration: 1 to 15 years of reported follow-up
  notes: >-
    Exertional dyspnea persists over years of follow-up and total lung capacity
    declines, without the parenchymal distortion or honeycombing of a
    conventional fibrosing interstitial pneumonia.
  evidence:
  - reference: PMID:34081035
    reference_title: "Postdeployment Respiratory Syndrome in Soldiers With Chronic Exertional Dyspnea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical follow-up of 29 soldiers (ranging from 1 to 15 y) showed persistence of exertional dyspnea in all individuals and a decline in total lung capacity."
    explanation: Establishes persistence and physiological decline over long follow-up.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    The disease ends military careers. In the original Fort Campbell series half
    of the affected soldiers left the service with a disability rating, and the
    symptom is by definition one that prevents meeting an occupational fitness
    requirement.
  evidence:
  - reference: PMID:21774710
    reference_title: "Constrictive bronchiolitis in soldiers returning from Iraq and Afghanistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the 38 soldiers with constrictive bronchiolitis, 19 (50%) had left the service with a disability rating"
    explanation: Quantifies occupational loss in the index cohort.
environmental:
- name: Deployment inhalation of respirable particulate matter
  description: >-
    Land-based deployers to Afghanistan and Southwest Asia inhaled high
    concentrations of respirable particulate matter from geologic desert dust,
    open-air burn pit smoke, engine and generator exhaust, and occupational
    vapours, gases, dusts and fumes. Individual-level exposure was never
    systematically measured during deployment, which is the principal limitation
    of every exposure-response analysis in this disease.
  exposure_term:
    preferred_term: exposure to respirable particulate matter during military deployment
    term:
      id: ECTO:7000116
      label: exposure to respirable suspended particulate matter
  exposure_classifications:
    hazard_agent_type:
    - classification_value: CHEMICAL
      notes: >-
        Respirable particulate matter is a chemical/mineral agent in the
        occupational-hygiene schemes, not a physical or biological agent.
    exposure_route:
    - classification_value: INHALATION
      notes: >-
        Only the respirable fraction reaching the membranous and respiratory
        bronchioles is relevant to this lesion.
    exposure_duration:
    - classification_value: INTERMEDIATE
      notes: >-
        ATSDR intermediate duration (15-364 days), matching the median 11.7 month
        deployment in the VA cooperative cohort; repeat deployments push some
        individuals into the chronic band.
    exposome_domain:
    - classification_value: SPECIFIC_EXTERNAL
      notes: >-
        An identifiable, occupationally bounded external agent in Wild's specific
        external domain.
  influences_mechanisms:
  - target: Distal Deposition of Respirable Deployment Particulate Matter
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Inhalation during deployment is the route by which the particulate burden
      reaches the distal airway, and is the initiating event of this entry.
    evidence:
    - reference: PMID:42360728
      reference_title: "Deployment-related respiratory health: bridging the gap between clinical and epidemiological associations and disease mechanisms: an official American Thoracic Society Workshop Report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Land-based military deployers to Afghanistan and/or Southwest Asia (SWA) encountered exposure to high concentrations of respirable particulate matter (PM) from multiple sources, including desert dust, burn pit smoke, and military occupations."
      explanation: Names the exposure and its sources in the deployed population this entry is about.
  evidence:
  - reference: PMID:42360728
    reference_title: "Deployment-related respiratory health: bridging the gap between clinical and epidemiological associations and disease mechanisms: an official American Thoracic Society Workshop Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Workshop participants agreed that there is substantial evidence linking deployment-related exposures to respiratory symptoms, pulmonary diagnoses, and lung pathology."
    explanation: >-
      ATS workshop consensus that the exposure-disease link is supported, which is
      the warrant for treating deployment exposure as causal here.
  - reference: PMID:37968126
    reference_title: "Chronic respiratory symptoms following deployment-related occupational and environmental exposures among US veterans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exposures to burn pit smoke and military occupational VGDF during deployment were associated with an increased odds of chronic respiratory symptoms among US Veterans."
    explanation: Quantitative exposure-symptom association in a 1960-veteran cohort.
- name: Open-air burn pit smoke
  description: >-
    Open-air waste burning on forward operating bases generated combustion
    products that are recoverable from lung tissue years later: polycyclic
    aromatic hydrocarbons, and oxidized titanium and iron. Burn pit smoke was
    among the most frequently reported heavy exposures in deployed cohorts.
  exposure_term:
    preferred_term: exposure to open-air burn pit smoke
    term:
      id: ECTO:7000059
      label: exposure to smoke
  influences_mechanisms:
  - target: Retained Peribronchiolar Particulate Burden
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Combustion products from burn pit smoke are physically retained in the lungs
      of affected personnel, which is the material basis of the peribronchiolar
      pigment seen at biopsy.
    evidence:
    - reference: PMID:36038588
      reference_title: "Iraq/Afghanistan war lung injury reflects burn pits exposure."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We detected the presence of polycyclic aromatic hydrocarbons (PAH)-which are products of incomplete combustion-in the lung tissue of all five warfighters."
      explanation: >-
        Directly links a burn-pit combustion signature to retained material in the
        lung tissue of biopsied deployers.
  evidence:
  - reference: PMID:37968126
    reference_title: "Chronic respiratory symptoms following deployment-related occupational and environmental exposures among US veterans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heavy exposures to multiple inhalational exposures were commonly reported, including burn pit smoke (72.7%) and VGDF (72.0%)."
    explanation: Establishes how widespread heavy burn-pit exposure was in the deployed population.
  - reference: PMID:36038588
    reference_title: "Iraq/Afghanistan war lung injury reflects burn pits exposure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All also had detectable titanium and iron in the lungs."
    explanation: >-
      Metal content of the retained material, supporting inhalation of burned
      metals rather than tobacco or ambient urban particulate.
- name: Sulfur-mine fire plume (Al-Mishraq, Mosul, 2003)
  description: >-
    A 2003 fire at a large sulfur mine near Mosul produced a sulfur dioxide plume
    over the area where much of the index Fort Campbell cohort was barracked.
    This is the single best-characterised point-source exposure in the disease,
    and it is the exposure the sulfur dioxide mouse model was built to mimic. It
    is not, however, necessary for the disease: soldiers with no sulfur-mine
    exposure had indistinguishable presentations and biopsies.
  exposure_term:
    preferred_term: inhalation of sulfur dioxide from the Al-Mishraq sulfur-mine fire
    term:
      id: ECTO:9000196
      label: exposure to sulfur dioxide
  influences_mechanisms:
  - target: Sustained Club Cell Injury in Membranous Bronchioles
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Inhaled sulfur dioxide at plume concentrations is an airway epithelial
      toxicant, and repetitive sulfur dioxide exposure reproduces the airway and
      vascular remodelling of this disease in mice.
    evidence:
    - reference: PMID:38410870
      reference_title: "Repetitive sulfur dioxide exposure in mice models post-deployment respiratory syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "we developed a model of repetitive exposure to SO2 in mice that phenocopies many aspects of PDRS, including adaptive immune activation, airway wall remodeling, and pulmonary vascular (PV) disease."
      explanation: >-
        Supports sulfur dioxide as a sufficient trigger for the syndrome's airway
        and vascular pathology; graded INDIRECT because the demonstration is in
        mice, not in exposed personnel.
  evidence:
  - reference: PMID:21774710
    reference_title: "Constrictive bronchiolitis in soldiers returning from Iraq and Afghanistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The plume had levels of sulfur dioxide as high as 125 ppm and extended for miles over the area where most of the Fort Campbell troops and other soldiers had been barracked."
    explanation: Quantifies the sulfur dioxide concentration and the population exposed.
  - reference: PMID:21774710
    reference_title: "Constrictive bronchiolitis in soldiers returning from Iraq and Afghanistan."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The presenting symptoms, smoking histories, evaluations, and biopsy samples of the 10 soldiers who did not report exposure to the sulfurmine fire were indistinguishable from those of the 28 soldiers who did report such exposure."
    explanation: >-
      Refutes the stronger claim that the sulfur-mine fire is the necessary cause;
      the same disease occurs without it, which is why the general particulate
      exposure rather than this plume is the entry's primary environmental
      trigger.
pathophysiology:
- name: Distal Deposition of Respirable Deployment Particulate Matter
  description: >-
    Respirable particulate matter inhaled during deployment penetrates to the
    membranous and respiratory bronchioles. Review of the deployment exposure
    literature identifies sandstorm dust, burn pit combustion products,
    improvised explosive device emissions and diesel exhaust particles as the
    principal contributors.
  role: trigger
  biological_scale: TISSUE
  locations:
  - preferred_term: bronchiole
    term:
      id: UBERON:0002186
      label: bronchiole
  downstream:
  - target: Retained Peribronchiolar Particulate Burden
  - target: Sustained Club Cell Injury in Membranous Bronchioles
  evidence:
  - reference: PMID:34808040
    reference_title: "Role of Particulate Matter from Afghanistan and Iraq in Deployment-Related Lung Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These include, but are not limited to, exposures to high levels of particulate matter (PM) from sandstorms, burn pit combustion products, improvised explosive devices, and diesel exhaust particles."
    explanation: Enumerates the particulate sources that constitute this initiating exposure.
- name: Retained Peribronchiolar Particulate Burden
  description: >-
    Inhaled material is not cleared. Biopsies show grey-black pigment deposited
    around membranous bronchioles, the great majority of it containing
    birefringent (polarizable) particulate, and lacy black pigment is visible on
    the visceral pleural surface at the time of surgery. Whether this retained
    material is causal or merely a marker of exposure intensity is one of the
    three knowledge gaps named by the 2026 ATS workshop.
  role: driver
  biological_scale: TISSUE
  locations:
  - preferred_term: bronchiole
    term:
      id: UBERON:0002186
      label: bronchiole
  downstream:
  - target: Sustained Club Cell Injury in Membranous Bronchioles
  - target: Peribronchiolar Myeloid and Alveolar Macrophage Accumulation
  evidence:
  - reference: PMID:21774710
    reference_title: "Constrictive bronchiolitis in soldiers returning from Iraq and Afghanistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty-seven of the biopsy samples showed the deposition of grayish black peribronchiolar pigment, with 36 showing polarizable material within the pigment."
    explanation: >-
      Establishes retained, birefringent particulate in a peribronchiolar
      distribution as a near-universal finding in the index biopsy series.
  - reference: PMID:21774710
    reference_title: "Constrictive bronchiolitis in soldiers returning from Iraq and Afghanistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lacy black pigment was noted on the visceral pleural surface during biopsy in 37 of the soldiers."
    explanation: >-
      Shows the retained material reaches the pleural surface, linking this node
      to the visceral pleural involvement recorded downstream.
- name: Sustained Club Cell Injury in Membranous Bronchioles
  description: >-
    Club cells are the local progenitor population that repairs the distal airway
    epithelium after inhaled toxicant injury. Sustained loss of that progenitor
    compartment is the mechanistic hypothesis for how a diffuse inhalational
    exposure becomes a fibrotic small-airway lesion, and in mice it is sufficient
    on its own: no external antigen and no lymphocyte activation is required to
    produce constrictive bronchiolitis.
  role: driver
  conforms_to: "fibrotic_response#Tissue Injury"
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: club cell
    term:
      id: CL:0000158
      label: club cell
  locations:
  - preferred_term: bronchiolar epithelium
    term:
      id: UBERON:0002051
      label: epithelium of bronchiole
  biological_processes:
  - preferred_term: Wound Healing
    term:
      id: GO:0042060
      label: wound healing
    modifier: DYSREGULATED
  downstream:
  - target: Peribronchiolar Myeloid and Alveolar Macrophage Accumulation
  - target: Bronchiolar Epithelial Thinning and Squamous Metaplasia
  evidence:
  - reference: PMID:34954211
    reference_title: "Sustained Club Cell Injury in Mice Induces Histopathologic Features of Deployment-Related Constrictive Bronchiolitis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Club cells are local progenitors critical for repairing the airway epithelium after exposure to various airborne toxins, and a prior study using an inducible transgenic murine model reported that 10 days of sustained targeted club cell injury causes constrictive bronchiolitis."
    explanation: >-
      States the progenitor role of club cells and that sustained injury to them
      is sufficient to cause constrictive bronchiolitis; INDIRECT because the
      sufficiency demonstration is a transgenic mouse, not a human exposure.
  - reference: PMID:34954211
    reference_title: "Sustained Club Cell Injury in Mice Induces Histopathologic Features of Deployment-Related Constrictive Bronchiolitis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "The current findings demonstrate that sustained club cell injury is sufficient to induce CB and that external antigenic stimuli accompanied by host lymphocyte activation is not required."
    explanation: >-
      Separates the epithelial-injury limb from the lymphocytic limb: the
      lymphocytic bronchiolitis seen in patients is not required for the fibrotic
      lesion to form.
- name: Bronchiolar Epithelial Thinning and Squamous Metaplasia
  description: >-
    Loss of the club-cell progenitor pool leaves a thinned bronchiolar epithelium
    that undergoes squamous metaplasia. The same epithelial change is seen in the
    mouse model and in human DRCB biopsies, which is the strongest single point
    of correspondence between the two.
  role: consequence
  biological_scale: CELLULAR
  locations:
  - preferred_term: bronchiolar epithelium
    term:
      id: UBERON:0002051
      label: epithelium of bronchiole
  downstream:
  - target: Subepithelial Fibrosis and Smooth Muscle Hypertrophy Narrowing Membranous Bronchioles
  evidence:
  - reference: PMID:34954211
    reference_title: "Sustained Club Cell Injury in Mice Induces Histopathologic Features of Deployment-Related Constrictive Bronchiolitis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Additional evidence that epithelial cell injury plays a role in the pathogenesis of DRCB stems from the observation that in both murine CB caused by sustained club cell injury and in DRCB, epithelial thinning and squamous cell metaplasia of the small airways was identified."
    explanation: >-
      Reports the same epithelial lesion in the model and in human DRCB tissue;
      INDIRECT because the human side is a small comparative sample rather than a
      controlled human series.
- name: Peribronchiolar Myeloid and Alveolar Macrophage Accumulation
  description: >-
    Epithelial injury recruits myeloid cells to the small airway wall and lumen.
    Alveolar and monocyte-derived exudate macrophages persist into the chronic
    phase and acquire an alternatively activated (CD206-high) phenotype;
    intraluminal collections of large foamy macrophages are present in both the
    mouse model and human DRCB biopsies.
  role: amplifier
  conforms_to: "fibrotic_response#Inflammatory Recruitment and Amplification"
  biological_scale: TISSUE
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  - preferred_term: monocyte-derived exudate macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: Inflammatory Response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  - preferred_term: Leukocyte Migration
    term:
      id: GO:0050900
      label: leukocyte migration
    modifier: INCREASED
  downstream:
  - target: TGF-beta Activation and Myofibroblast Recruitment
  evidence:
  - reference: PMID:34954211
    reference_title: "Sustained Club Cell Injury in Mice Induces Histopathologic Features of Deployment-Related Constrictive Bronchiolitis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Transition to a chronic phase was characterized by up-regulated expression of oxidative stress-associated genes, increased activation of transforming growth factor-β, accumulation of alternatively activated macrophages, and enhanced peribronchiolar collagen deposition."
    explanation: >-
      Links persistent alternatively activated macrophages and oxidative stress to
      the chronic fibrotic phase in the model.
  - reference: PMID:34954211
    reference_title: "Sustained Club Cell Injury in Mice Induces Histopathologic Features of Deployment-Related Constrictive Bronchiolitis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Peribronchiolar infiltrates were also present in DRCB (Figure 6, E and F), as were numerous collections of large intraluminal foamy macrophages (Figure 6, G and H)."
    explanation: >-
      Confirms the same peribronchiolar and intraluminal macrophage pattern in
      human DRCB tissue, not only in the mouse.
- name: TGF-beta Activation and Myofibroblast Recruitment
  description: >-
    Persistent macrophage accumulation raises free active TGF-beta1 in the
    airway, driving mesenchymal cell activation. Depleting alveolar macrophages in
    the mouse model lowers active TGF-beta1 and ameliorates the constrictive
    lesion, which makes this the most directly interventionally supported step in
    the chain.
  role: central_effector
  conforms_to: "fibrotic_response#Mesenchymal Cell Activation"
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: myofibroblast
    term:
      id: CL:0000186
      label: myofibroblast cell
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: TGF-beta Receptor Signaling
    term:
      id: GO:0007179
      label: transforming growth factor beta receptor signaling pathway
    modifier: INCREASED
  downstream:
  - target: Peribronchiolar Collagen Deposition
  evidence:
  - reference: PMID:34954211
    reference_title: "Sustained Club Cell Injury in Mice Induces Histopathologic Features of Deployment-Related Constrictive Bronchiolitis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Depletion of alveolar macrophages in mice decreased activation of transforming growth factor-β and ameliorated constrictive bronchiolitis."
    explanation: >-
      An interventional result placing macrophage-driven TGF-beta activation
      upstream of the constrictive lesion; INDIRECT because the intervention was
      performed in mice.
- name: Peribronchiolar Collagen Deposition
  description: >-
    Activated mesenchymal cells deposit collagen in the subepithelium and around
    the bronchiole. In affected soldiers, morphometry shows increased collagen
    density in the bronchiolar subepithelium with no change in epithelial height,
    adventitial thickness or subepithelial elastin: the matrix change is
    specifically collagen.
  role: effector
  conforms_to: "fibrotic_response#Excessive ECM Deposition"
  biological_scale: TISSUE
  cell_types:
  - preferred_term: myofibroblast
    term:
      id: CL:0000186
      label: myofibroblast cell
  biological_processes:
  - preferred_term: ECM Organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: INCREASED
  - preferred_term: Collagen Fibril Organization
    term:
      id: GO:0030199
      label: collagen fibril organization
    modifier: INCREASED
  downstream:
  - target: Subepithelial Fibrosis and Smooth Muscle Hypertrophy Narrowing Membranous Bronchioles
  evidence:
  - reference: PMID:34081035

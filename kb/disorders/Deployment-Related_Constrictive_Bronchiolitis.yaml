    evidence_source: HUMAN_CLINICAL
    snippet: "In alveolar parenchyma, collagen and elastin content were increased and capillary density was reduced in interalveolar septa from soldiers compared to control subjects."
    explanation: Establishes the alveolar matrix and capillary changes by morphometry.
  - reference: PMID:34081035
    reference_title: "Postdeployment Respiratory Syndrome in Soldiers With Chronic Exertional Dyspnea."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While we did not identify substantial distortion of lung parenchyma, honeycombing, or formation of fibroblast foci, we speculate that diffuse interstitial fibrosis, which replaces normal connective tissue with dense collagen deposits, may affect functional lung compliance and contribute to dyspnea on exertion."
    explanation: >-
      Marks the boundary with fibrosing interstitial pneumonia and records the
      authors' own hedge about the functional consequence.
- name: Visceral Pleural Inflammation and Fibrosis
  description: >-
    Visceral pleural inflammation, fibrosis or both are present in the large
    majority of affected soldiers, with diffuse CD4 and CD8 T cell infiltration
    extending into the pleura. Pleural involvement is one of the findings that
    puts this entity outside a purely bronchiolar diagnosis.

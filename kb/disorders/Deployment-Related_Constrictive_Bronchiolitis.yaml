    explanation: Establishes the arterial remodeling in human tissue.
  - reference: PMID:38410870
    reference_title: "Repetitive sulfur dioxide exposure in mice models post-deployment respiratory syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Although abnormalities in small airways were not sufficient to alter lung mechanics, PV remodeling resulted in the development of pulmonary hypertension and reduced exercise tolerance in SO2-exposed mice."
    explanation: >-
      Assigns the exercise limitation to the vascular rather than the airway
      compartment; INDIRECT because it is a mouse result being used to interpret a
      human symptom.
- name: Interalveolar Septal Fibrosis and Capillary Rarefaction
  description: >-
    Interalveolar septa in affected soldiers carry increased collagen and elastin
    together with reduced blood capillary density, but without the architectural
    distortion, honeycombing or fibroblast foci of a usual interstitial
    pneumonia. This is the alveolar compartment of the multicompartmental injury
    and a plausible contributor to the reduced diffusing capacity seen on
    pulmonary function testing.
  role: consequence
  biological_scale: TISSUE
  locations:
  - preferred_term: pulmonary alveolus
    term:
      id: UBERON:0002299
      label: alveolus of lung
  downstream:

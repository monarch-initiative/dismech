      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Recent studies suggest that biallelic pathogenic variants in ZNF526 may lead to Dentici‐Novelli neurodevelopmental syndrome, characterized by microcephaly, developmental delay, epilepsy, and ocular anomalies.
      explanation: >-
        Supports classification as a Mendelian genetic disorder caused by
        biallelic pathogenic variants in ZNF526.
prevalence:
- population: Global
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ultra-rare disorder; as of 2025, 12 cases of Dentici-Novelli
    neurodevelopmental syndrome with 11 unique ZNF526 variants have been
    reported in the medical literature.
  evidence:
  - reference: DOI:10.1002/mgg3.70089
    reference_title: "Novel Compound Heterozygous Variants in <scp><i>ZNF526</i></scp> Causing Dentici‐Novelli Neurodevelopmental Syndrome: A Case Report and Literature Review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among 12 cases of Dentici‐Novelli neurodevelopmental syndrome, 11 unique ZNF526 variants have been identified, with loss‐of‐function variants possibly linked to seizures.
    explanation: >-
      Literature review establishes that only 12 cases of Dentici-Novelli
      neurodevelopmental syndrome have been reported globally.
progression:
- phase: Prenatal and infantile onset
  age_range: Prenatal to infancy
  notes: >-
    Severe truncating ZNF526 variants present with prenatal and postnatal
    microcephaly (-4 SD to -8 SD), infantile-onset developmental delay,
    epilepsy, and progressive bilateral cataracts, whereas homozygous
    missense variants may present with postnatal microcephaly (-2 SD) and
    severe intellectual disability without structural MRI abnormalities.
  evidence:
  - reference: PMID:33397746
    reference_title: "Biallelic variants in ZNF526 cause a severe neurodevelopmental disorder with microcephaly, bilateral cataract, epilepsy and simplified gyration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Four had variants resulting in truncation of ZNF526; they were affected by severe prenatal and postnatal microcephaly (ranging from -4 SD to -8 SD), profound psychomotor delay, hypertonic-dystonic movements, epilepsy and simplified gyral pattern on MRI. All of them also displayed bilateral progressive cataracts.
    explanation: >-
      Documents prenatal- and postnatal-onset microcephaly and progressive
      bilateral cataracts in patients with truncating ZNF526 variants.
  - reference: PMID:33397746
    reference_title: "Biallelic variants in ZNF526 cause a severe neurodevelopmental disorder with microcephaly, bilateral cataract, epilepsy and simplified gyration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A fifth patient had a homozygous missense variant and a slightly less severe disorder, with postnatal microcephaly (-2 SD), progressive bilateral cataracts, severe intellectual disability and unremarkable brain MRI.
    explanation: >-
      Documents postnatal-onset microcephaly (-2 SD), progressive bilateral
      cataracts, and severe intellectual disability without structural MRI
      abnormalities in a patient with a homozygous missense ZNF526 variant.
  - reference: DOI:10.1002/mgg3.70089
    reference_title: "Novel Compound Heterozygous Variants in <scp><i>ZNF526</i></scp> Causing Dentici‐Novelli Neurodevelopmental Syndrome: A Case Report and Literature Review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The proband, a 7‐month‐old girl, exhibited developmental delay, microcephaly, limb hypotonia, abnormal brain imaging, and seizures.
    explanation: >-
      Demonstrates infantile clinical presentation by 7 months of age with
      developmental delay, microcephaly, hypotonia, and seizures.
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Dentici-Novelli neurodevelopmental syndrome is caused by biallelic
    pathogenic variants in ZNF526 and is inherited in an autosomal recessive
    pattern.

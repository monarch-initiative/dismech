    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RESULTS: We identified five patients from four unrelated families with homozygous ZNF526 variants by whole exome sequencing.
    explanation: This directly supports autosomal recessive inheritance through homozygous ZNF526 variants in multiple unrelated families.
  - reference: DOI:10.1002/mgg3.70089
    reference_title: "Novel Compound Heterozygous Variants in <scp><i>ZNF526</i></scp> Causing Dentici‐Novelli Neurodevelopmental Syndrome: A Case Report and Literature Review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These previously unreported variants are on separate alleles, forming a compound heterozygous state correlated with the clinical presentation.
    explanation: Confirms autosomal recessive inheritance via compound heterozygous ZNF526 variants.
pathophysiology:
- name: ZNF526-related transcriptional dysregulation
  role: trigger
  description: >-
    ZNF526 encodes a ubiquitously expressed Kruppel-type zinc finger protein
    crucial in transcriptional regulation. Biallelic pathogenic truncating or
    missense variants impair ZNF526-mediated transcriptional regulation in the
    developing brain and eye, initiating the syndrome.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Treatment involves wide surgical resection, with adjuvant radiation therapy in select cases. Radiation therapy may be employed in cases with close or positive margins, while conventional chemotherapy has limited utility.
    explanation: Directly supports adjuvant radiation therapy as an option for DFSP with close or positive surgical margins.

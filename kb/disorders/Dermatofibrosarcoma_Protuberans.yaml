progression:
- phase: Indolent cutaneous growth with local recurrence and rare fibrosarcomatous transformation
  age_range: Adulthood
  notes: DFSP typically exhibits indolent dermal and subcutaneous growth with a high propensity for local recurrence after incomplete excision, while distant metastasis (<5% of cases) almost always follows prior local relapses or high-grade fibrosarcomatous transformation.
  evidence:
  - reference: PMID:17397592
    reference_title: '[Dermatofibrosarcoma protuberans].'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Although the cases of metastatic DFSP do not reach 5 % of the total, almost all of them appear after previous local relapses. The prognosis for metastatic cases is very poor with a survival of less than 2 years following detection of metastatic disease.
    explanation: Describes the progression from local relapses to rare metastatic disease (<5%) and poor post-metastasis survival.
  - reference: PMID:38841035
    reference_title: 'Metastatic Fibrosarcomatous Transformation of Dermatofibrosarcoma Protuberans With Lung Metastasis: A Case Report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: DFSP is a rare soft tissue sarcoma characterized by indolent growth and low metastatic potential, except in fibrosarcomatous transformation cases.
    explanation: Confirms indolent baseline growth and increased metastatic risk upon fibrosarcomatous transformation.
has_subtypes:
- name: Classic DFSP
  description: The typical form presenting as a slow-growing, indurated plaque that progressively develops a multinodular or protuberant appearance. Low metastatic potential.
- name: Fibrosarcomatous DFSP
  description: A higher-grade variant with fibrosarcomatous transformation. Associated with increased local recurrence and metastatic potential. May lose imatinib sensitivity.
  evidence:
  - reference: PMID:38841035
    reference_title: 'Metastatic Fibrosarcomatous Transformation of Dermatofibrosarcoma Protuberans With Lung Metastasis: A Case Report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: In this study, we report a case of DFSP with fibrosarcomatous transformation, a rare but well-known phenomenon encountered in DFSP that is correlated with an increased risk of adverse outcomes in patients with DFSP.
    explanation: Directly supports fibrosarcomatous transformation as a recognized adverse-prognosis variant of DFSP.
- name: Pigmented DFSP (Bednar Tumor)
  description: A variant containing melanin-producing dendritic cells, giving the tumor a pigmented appearance. Shares the same COL1A1-PDGFB fusion and clinical behavior as classic DFSP.

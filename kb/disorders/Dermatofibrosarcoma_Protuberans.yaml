  description: Fluorescence in situ hybridization (PDGFB break-apart or fusion FISH) and multiplex reverse transcription PCR detect the COL1A1-PDGFB rearrangement in virtually all cases and confirm the diagnosis in atypical, fibrosarcomatous, or small biopsy specimens.

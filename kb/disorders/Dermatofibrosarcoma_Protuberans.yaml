treatments:
- name: Wide Local Excision
  description: Surgery with wide margins (2-4 cm) or Mohs micrographic surgery is the primary treatment. Mohs technique provides margin control and is associated with the lowest recurrence rates.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:17397592
    reference_title: '[Dermatofibrosarcoma protuberans].'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Treatment of localized disease consists in complete surgical excision of the lesion by conventional surgery with wide margins (>3 cm) or by micrographic Mohs surgery.
    explanation: Directly supports wide-margin surgical excision (or Mohs micrographic surgery) as the standard primary treatment of localized DFSP.
- name: Imatinib Targeted Therapy
  description: Imatinib mesylate, a PDGFR inhibitor, is highly effective for unresectable or metastatic DFSP. Response rates exceed 50%. Imatinib may also be used as neoadjuvant therapy to shrink tumors before surgery. Fibrosarcomatous transformation may confer imatinib resistance.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: imatinib
      term:
        id: CHEBI:45783
        label: imatinib
  target_mechanisms:
  - target: Autocrine PDGFR Signaling
    description: Inhibits PDGFR-beta receptor tyrosine kinase activity driven by the COL1A1-PDGFB fusion.
  evidence:
  - reference: PMID:17397592
    reference_title: '[Dermatofibrosarcoma protuberans].'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The demonstration of the oncogenic power of the translocation COL1A1-PDGFB in DFSP has allowed the successful introduction of drug therapy with antagonists of the PDGFB receptor for metastatic or locally advanced cases.
    explanation: Directly supports PDGFB receptor antagonism, including imatinib targeted therapy, for metastatic or locally advanced DFSP.
  - reference: DOI:10.3389/fonc.2024.1399486
    reference_title: Hotspots and future trends of dermatofibrosarcoma protuberans
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: Imatinib is clinically active against both localized and metastatic DFSP with chromosomal translocations; however, cases without fusion genes may not respond to imatinib
    explanation: Synthesizes the clinical activity of imatinib against both localized and metastatic translocation-positive DFSP.
- name: Radiation Therapy
  description: Adjuvant radiation may be considered for positive margins when re-excision is not feasible. Primary radiation is an option for unresectable cases not amenable to imatinib.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: Radiation Therapy
    term:
      id: NCIT:C15313

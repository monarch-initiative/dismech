name: Postinfectious Vasculitis
creation_date: "2026-05-05T11:41:54Z"
updated_date: "2026-10-16T22:55:00Z"
description: >-
  Postinfectious vasculitis is secondary vasculitis that follows or accompanies
  an infectious trigger. Infection-associated vascular inflammation can affect
  small, medium, or large vessels and may arise through direct or contiguous
  infection of vessel walls, immune-complex reactions (such as post-viral or
  post-streptococcal IgA vasculitis and cutaneous leukocytoclastic vasculitis),
  cell-mediated hypersensitivity, molecular mimicry, autoantibody production, or
  immune dysregulation triggered by microbial products and superantigens.
category: Complex
disease_term:
  preferred_term: postinfectious vasculitis
  term:
    id: MONDO:0018837
    label: postinfectious vasculitis
parents:
- Vascular disorder
synonyms:
- Post-infectious vasculitis
- Infection-associated vasculitis
has_subtypes:
- name: Infection-triggered IgA vasculitis
  display_name: Infection-triggered IgA vasculitis
  description: >-
    IgA vasculitis is a common postinfectious small-vessel vasculitis pattern,
    often following upper respiratory or viral infection triggers, characterized
    by vascular deposition of galactose-deficient IgA1 immune complexes.
  evidence:
  - reference: DOI:10.3390/jcm12020697
    reference_title: Viral Infections May Be Associated with Henoch–Schönlein Purpura
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Henoch–Schönlein purpura or IgA vasculitis is the most common type of pediatric vasculitis that may affect adults as well. It is classified as a type of small-vessel vasculitis. It can cause cutaneous and systemic symptoms with a minority of patients developing kidney failure.
    explanation: Supports infection-triggered IgA vasculitis as a recurrent post-viral small-vessel vasculitis pattern.
- name: Infection-associated cutaneous small-vessel vasculitis
  display_name: Infection-associated cutaneous small-vessel vasculitis
  description: >-
    Cutaneous leukocytoclastic vasculitis can occur 7 to 10 days after upper
    respiratory or other infectious triggers and is frequently self-limited and
    organ-limited to dermal postcapillary venules.
  evidence:
  - reference: PMID:33713282
    reference_title: "Diagnosis and management of leukocytoclastic vasculitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vasculitis tends to occur 7–10 days after exposure to a drug or infectious trigger.
    explanation: Supports infection-associated cutaneous leukocytoclastic vasculitis with characteristic post-exposure latency.
- name: Infectious or secondary CNS vasculitis
  display_name: Infectious or secondary CNS vasculitis
  description: >-
    Central nervous system vasculitis can occur secondary to viral, bacterial,
    or fungal infections, presenting with higher rates of fever, CSF
    hypoglycorrhachia, CSF oligoclonal bands, and cerebrovascular ischemia
    compared with primary CNS vasculitis.
  evidence:
  - reference: DOI:10.1177/19418744231223283
    reference_title: "Vasculitis in the Central Nervous System: Etiology, Characteristics, and Outcomes in a Large Single-Center Cohort"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared to primary CNS vasculitis, secondary CNS vasculitis exhibits higher fever incidence (observed in infectious and connective tissue disorder [CTD]-associated vasculitis), low glucose levels (mostly in infectious vasculitis) and unique cerebrospinal fluid oligoclonal bands (observed in infectious and CTD-associated vasculitis).
    explanation: Supports infectious CNS vasculitis as a distinct clinical subtype within CNS vasculitis cohorts.
prevalence:
- population: All-cause biopsy-proven leukocytoclastic vasculitis, United States
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 4.5
  rate_low: 3.5
  rate_high: 5.4
  rate_denominator: PERSON_YEARS
  notes: >-
    Population-based incidence of all-cause biopsy-proven leukocytoclastic
    vasculitis in the United States is 4.5 per 100,000 person-years; roughly
    half of cases have systemic or secondary causes, while the remaining 50% are
    split between single-organ cutaneous small-vessel vasculitis (usually drug-
    or infection-induced) and idiopathic/unclassifiable disease.
  evidence:
  - reference: PMID:33713282
    reference_title: "Diagnosis and management of leukocytoclastic vasculitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A recent pop- ulation wide study estimated an incidence of 4.5 per 100.000 person-years (95% CI, 3.5–5.4) for biopsy-proven LCV in the United States [8].
    explanation: Provides population-based annual incidence for all-cause biopsy-proven leukocytoclastic vasculitis in the United States.
  - reference: PMID:33713282
    reference_title: "Diagnosis and management of leukocytoclastic vasculitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An underlying cause or a systemic involvement is usu- ally found in around half of the cases of LCV, whereas the other 50% is split between a single-organ cutaneous SVV, usually drug or infection induced, or an idiopathic/unclas- sifiable LCV [10–14].
    explanation: Contextualizes the fraction of biopsy-proven LCV attributable to single-organ drug- or infection-induced cutaneous small-vessel vasculitis.

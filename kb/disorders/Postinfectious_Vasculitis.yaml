treatments:
- name: Antimicrobial therapy for active infection-associated vasculitis
  description: >-
    Management should identify and treat the infectious inciting factor when
    active, because eliminating the microbial trigger is often sufficient to
    resolve single-organ postinfectious vasculitis and immunosuppression without
    antimicrobial therapy can worsen morbidity.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Direct or contiguous vessel-wall infection
    treatment_effect: INHIBITS
    description: Pathogen-directed antimicrobial therapy eradicates the active microbial trigger driving mural infection and antigen supply.
  target_phenotypes:

progression:
- phase: Post-infectious latency and acute cutaneous eruption
  subtype: Infection-associated cutaneous small-vessel vasculitis
  incubation_days: "7-10"
  duration_days: "21-28"
  duration: "3-4 weeks per episode (individual lesions resolve over 2-3 weeks)"
  notes: >-
    Cutaneous leukocytoclastic vasculitis typically appears 7 to 10 days after
    an infectious trigger; individual skin lesions resolve over 2 to 3 weeks and
    most single-organ episodes resolve over 3 to 4 weeks, often leaving
    post-inflammatory hyperpigmentation without recurrence once the trigger is
    eliminated.
  evidence:
  - reference: PMID:33713282
    reference_title: "Diagnosis and management of leukocytoclastic vasculitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vasculitis tends to occur 7–10 days after exposure to a drug or infectious trigger.
    explanation: Establishes the characteristic 7-10 day latency after exposure to an infectious trigger.
  - reference: PMID:33713282
    reference_title: "Diagnosis and management of leukocytoclastic vasculitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The lesions resolve over 2–3 weeks and slowly fade away, leaving behind post-inflammatory hyperpigmentation.
    explanation: Documents the 2-3 week resolution timeline of individual cutaneous leukocytoclastic vasculitis lesions.
  - reference: PMID:33713282
    reference_title: "Diagnosis and management of leukocytoclastic vasculitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most episodes of single-organ cutaneous LCV are self-limited, resolve over 3–4 weeks, with or without residual hyperpigmentation, and do not recur [10], [12], [56].
    explanation: Establishes the typical 3-4 week self-limited episode duration for single-organ cutaneous leukocytoclastic vasculitis.
pathophysiology:
- name: Direct or contiguous vessel-wall infection
  description: >-
    Some infection-associated vasculitides arise when bacterial, viral, or
    fungal pathogens directly invade the endothelial lining or spread
    contiguously from adjacent meningitic, encephalitic, or soft-tissue foci to
    inflame the vascular wall.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Leukocyte-mediated vessel-wall injury
    description: Direct vascular infection or contiguous spread initiates mural inflammation and leukocyte recruitment.
  - target: Infection-associated vasculitis
    description: Direct pathogen invasion of vessel walls produces active infection-associated vasculitis across vessel calibers.
  - target: Vessel-size variable vasculitis mimicry
    description: Direct microbial arteritis or phlebitis can affect small, medium, or large vessels and mimic primary vasculitides.
  - target: Fever
    description: Infectious and contiguous CNS or systemic vessel-wall inflammation triggers pyrogenic cytokine release and fever.
  - target: Ischemic stroke
    description: Contiguous or direct infectious CNS arteritis causes vessel-wall narrowing, thrombosis, and cerebral infarction.
  evidence:
  - reference: PMID:26362741
    reference_title: Vasculitis related to viral and other microbial agents.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vasculitis due to infection may occur as a consequence of the inflammation of vessel walls due to direct or contiguous infection, type II or immune complex-mediated reaction, cell-mediated hypersensitivity, or inflammation due to immune dysregulation triggered by bacterial toxin and/or superantigen production.
    explanation: This review explicitly identifies direct or contiguous infection as one mechanism of infection-related vasculitis.
- name: Immune-complex vascular deposition after infection
  conforms_to: "necrotizing_vasculitis#Vessel Wall Immune Stimulus Deposition and Endothelial Activation"
  description: >-
    Infectious antigens can promote type II or immune-complex mediated vascular
    reactions; in postinfectious IgA vasculitis and cutaneous leukocytoclastic
    vasculitis, circulating antigen-antibody complexes (including aberrantly
    glycosylated IgA1-containing complexes) deposit in the walls of small
    vessels of the skin, kidney, gut, and joints and activate complement.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: immune response
    modifier: ABNORMAL
    term:
      id: GO:0006955
      label: immune response
  - preferred_term: complement activation
    modifier: INCREASED
    term:
      id: GO:0006956
      label: complement activation
  downstream:
  - target: Leukocyte-mediated vessel-wall injury
    description: Immune-complex deposition promotes complement activation and neutrophil effector injury in affected small vessels.
  evidence:
  - reference: PMID:26362741
    reference_title: Vasculitis related to viral and other microbial agents.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vasculitis due to infection may occur as a consequence of the inflammation of vessel walls due to direct or contiguous infection, type II or immune complex-mediated reaction, cell-mediated hypersensitivity, or inflammation due to immune dysregulation triggered by bacterial toxin and/or superantigen production.
    explanation: This review explicitly includes immune-complex mediated reactions among infection-related vasculitis mechanisms.
  - reference: DOI:10.3390/jcm12020697
    reference_title: Viral Infections May Be Associated with Henoch–Schönlein Purpura
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serum aberrant IgA1 may form large antigen–antibody complexes which, due to a defective clearance, are able to deposit in the small vessels of the skin, kidney, gut, and joints.
    explanation: This IgA vasculitis review supports infection-triggered immune-complex deposition in classic target tissues.
- name: Infection-triggered IgA endothelial and neutrophil injury
  description: >-
    IgA vasculitis mechanisms include aberrantly glycosylated IgA,
    anti-endothelial cell antibodies, and neutrophil effector activity after
    infection triggers.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: leukocyte migration
    modifier: INCREASED
    term:
      id: GO:0050900
      label: leukocyte migration
  downstream:
  - target: Leukocyte-mediated vessel-wall injury
    description: Neutrophil and anti-endothelial antibody mechanisms drive small-vessel mural inflammation after infection triggers.
  evidence:
  - reference: DOI:10.1002/kjm2.12852
    reference_title: "Immunoglobulin A vasculitis: The clinical features and pathophysiology"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disease mechanisms involve various factors, including the interplay of aberrantly glycosylated IgA, anti-endothelial cell antibodies, and neutrophils following infection triggers, which are the main pathogenic mechanisms of IgAV.
    explanation: This directly supports IgA, anti-endothelial antibody, and neutrophil mechanisms after infection triggers.
- name: Microbial toxin or superantigen immune dysregulation
  description: >-
    Bacterial toxins or superantigens can trigger immune dysregulation that
    promotes vascular inflammation after infection, including Kawasaki-like
    multisystem inflammatory vasculitis presentations.
  biological_processes:
  - preferred_term: immune response
    modifier: ABNORMAL
    term:
      id: GO:0006955
      label: immune response
  downstream:
  - target: Leukocyte-mediated vessel-wall injury
    description: Dysregulated immune activation feeds into inflammatory vessel-wall damage.
  - target: Abdominal pain
    description: Superantigen- or viral-triggered Kawasaki-like systemic vascular inflammation frequently presents with acute abdominal pain and gastrointestinal symptoms.
  - target: Fever
    description: Toxin- and superantigen-driven cytokine cascades induce persistent high fever.
  evidence:
  - reference: PMID:26362741
    reference_title: Vasculitis related to viral and other microbial agents.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Vasculitis due to infection may occur as a consequence of the inflammation of vessel walls due to direct or contiguous infection, type II or immune complex-mediated reaction, cell-mediated hypersensitivity, or inflammation due to immune dysregulation triggered by bacterial toxin and/or superantigen production.
    explanation: This review explicitly supports toxin or superantigen-triggered immune dysregulation.
- name: T- and B-cell activation after infection
  description: >-
    T- and B-cell activation is a proposed mechanism in infection-associated
    vasculitis, including postinfectious settings in which the pathogen has
    triggered ongoing adaptive immune inflammation.
  biological_processes:
  - preferred_term: adaptive immune response
    modifier: ABNORMAL
    term:
      id: GO:0002250
      label: adaptive immune response
  downstream:
  - target: Leukocyte-mediated vessel-wall injury
    description: Adaptive immune activation sustains vascular inflammation after infection.
  - target: Immune-complex vascular deposition after infection
    description: Infection-activated B cells generate circulating antibodies and immune complexes that deposit in small vessels.
  evidence:
  - reference: PMID:40089428
    reference_title: Infection associated Vasculitides.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The exact pathogenesis of infection associated vasculitis is not clear although direct spread, immune complex deposition and T/B cell activation are proposed.
    explanation: This supports T/B cell activation as a proposed infection-associated vasculitis mechanism while preserving uncertainty.
- name: Molecular mimicry and infection-induced autoantibodies
  description: >-
    Some infections can generate autoantibodies such as ANCA through molecular
    mimicry, confounding distinction between primary systemic vasculitis and
    infection-associated vasculitis.
  biological_processes:
  - preferred_term: adaptive immune response
    modifier: ABNORMAL
    term:
      id: GO:0002250
      label: adaptive immune response
  downstream:
  - target: Leukocyte-mediated vessel-wall injury
    description: Infection-associated autoantibody production amplifies neutrophil-mediated vascular injury.
  - target: Anti-neutrophil cytoplasmic antibody positivity
    description: Microbial molecular mimicry induces circulating cytoplasmic or perinuclear anti-neutrophil cytoplasmic antibodies.
  - target: Vessel-size variable vasculitis mimicry
    description: Infection-induced autoantibodies and immune responses produce clinical syndromes that closely mimic primary small-, medium-, or large-vessel vasculitides.
  evidence:
  - reference: PMID:40089428
    reference_title: Infection associated Vasculitides.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Infections can produce autoantibodies such as Anti-neutrophil cytoplasmic antibody through molecular mimicry and could confound clinical judgement.
    explanation: This supports molecular mimicry and autoantibody production as infection-associated vasculitis mechanisms.
- name: Leukocyte-mediated vessel-wall injury
  conforms_to: "necrotizing_vasculitis#Fibrinoid Necrosis of the Vessel Wall"
  description: >-
    Immune activation and neutrophil infiltration after infection damage the
    vascular wall with fibrinoid necrosis and leukocytoclasia, producing
    postinfectious vasculitic syndromes in skin, kidney, gut, joints, CNS, or
    other affected tissues.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: leukocyte migration
    modifier: INCREASED
    term:
      id: GO:0050900
      label: leukocyte migration
  downstream:
  - target: Necrotizing vasculitis
    description: Intramural neutrophil infiltration and degranulation produce fibrinoid necrosis and nuclear fragmentation (leukocytoclasia) of small vessel walls.
  - target: Infection-associated vasculitis
    description: Leukocyte-mediated mural inflammation is the shared effector lesion of infection-associated vasculitis.
  - target: Palpable purpura
    description: Neutrophilic leukocytoclastic injury of dermal postcapillary venules causes erythrocyte extravasation and palpable purpura.
  - target: Gastrointestinal symptoms
    description: Small-vessel mural injury in the gastrointestinal tract causes mucosal ischemia, edema, and gastrointestinal symptoms.
  - target: Abdominal pain
    description: Mesenteric and submucosal vascular inflammation produces colicky or acute abdominal pain.
  - target: Proteinuria
    description: Glomerular capillary wall inflammation impairs permselectivity and causes proteinuria.
  - target: Hematuria
    description: Glomerular necrotizing and endocapillary inflammation leads to glomerular hematuria.
  - target: Joint involvement
    description: Synovial and periarticular microvascular injury produces arthralgia and arthritis.
  - target: Fever
    description: Active mural leukocyte inflammation releases systemic pyrogenic cytokines that cause fever.
  - target: Ischemic stroke
    description: Inflammatory vessel-wall injury in cerebral arteries leads to luminal narrowing, thrombosis, and ischemic stroke.
  evidence:
  - reference: DOI:10.1002/kjm2.12852
    reference_title: "Immunoglobulin A vasculitis: The clinical features and pathophysiology"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Disease mechanisms involve various factors, including the interplay of aberrantly glycosylated IgA, anti-endothelial cell antibodies, and neutrophils following infection triggers, which are the main pathogenic mechanisms of IgAV.
    explanation: This supports neutrophil participation in infection-triggered IgA vasculitis mechanisms.
  - reference: PMID:33713282
    reference_title: "Diagnosis and management of leukocytoclastic vasculitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The leading clinical presentation of LCV is palpable purpura and the diagnosis relies on histopathological examination, in which the inflammatory infiltrate is composed of neutrophils with fibrinoid necrosis and disintegration of nuclei into fragments ("leukocytoclasia").
    explanation: Establishes neutrophilic vessel-wall infiltration with fibrinoid necrosis and leukocytoclasia as the defining lesion of leukocytoclastic vasculitis.
histopathology:
- name: Leukocytoclastic vasculitis with fibrinoid necrosis
  diagnostic: true
  description: >-
    Histopathological examination of affected dermal postcapillary venules in
    infection-associated cutaneous small-vessel vasculitis and IgA vasculitis
    demonstrates a neutrophilic inflammatory infiltrate with fibrinoid necrosis
    of the vessel wall and nuclear fragmentation (leukocytoclasia), accompanied
    by vascular IgA or complement deposition on direct immunofluorescence.
  finding_term:
    preferred_term: Fibrinoid necrosis of small-vessel walls
    term:
      id: NCIT:C35956
      label: Fibrinoid Necrosis
  notes: >-
    Bound to NCIT:C35956 (Fibrinoid Necrosis), the closest cached morphologic
    lesion in the HistopathologyFindingTerm value set (NCIT:C83490 and
    HP:0025461 branches); note that HP:0200043 resolves in HPO to Verrucae and
    HP:0200037 to Skin vesicle, whereas HP:6000253 (Necrotizing vasculitis) is
    bound in phenotypes.
  evidence:
  - reference: PMID:33713282
    reference_title: "Diagnosis and management of leukocytoclastic vasculitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The leading clinical presentation of LCV is palpable purpura and the diagnosis relies on histopathological examination, in which the inflammatory infiltrate is composed of neutrophils with fibrinoid necrosis and disintegration of nuclei into fragments ("leukocytoclasia").
    explanation: Defines the characteristic histopathologic lesion of leukocytoclastic vasculitis on biopsy.

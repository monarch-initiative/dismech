    snippet: >-
      A comprehensive history and detailed physical examination must be performed; platelet count, renal function and urinalysis, serological tests for hepatitis B and C viruses, autoantibodies (anti-nuclear antibodies and anti-neutrophil cytoplasmic antibodies), complement fractions and IgA staining in biopsy specimens are part of the usual workout of LCV.
    explanation: Includes renal function and urinalysis in the standard diagnostic workup of leukocytoclastic vasculitis.
  - reference: DOI:10.1002/kjm2.12852
    reference_title: "Immunoglobulin A vasculitis: The clinical features and pathophysiology"

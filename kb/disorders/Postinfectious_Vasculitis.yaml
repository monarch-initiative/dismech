    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As immunosuppressive therapy administered in the absence of antimicrobial therapy may increase morbidity and fail to effect the resolution of infection-associated vascular inflammation, it is important to consider infectious entities as potential inciting factors in vasculitis syndromes.
    explanation: This supports treating or excluding active infection before immunosuppression.
  - reference: PMID:33713282
    reference_title: "Diagnosis and management of leukocytoclastic vasculitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When the cause of LCV is obvious, such as infections or drugs, eliminating or treating the trigger whenever possible is crucial and often sufficient.
    explanation: Confirms that treating or eliminating the infectious trigger is crucial and often sufficient for resolution of infection-induced leukocytoclastic vasculitis.

    snippet: >-
      A comprehensive history and detailed physical examination must be performed; platelet count, renal function and urinalysis, serological tests for hepatitis B and C viruses, autoantibodies (anti-nuclear antibodies and anti-neutrophil cytoplasmic antibodies), complement fractions and IgA staining in biopsy specimens are part of the usual workout of LCV.
    explanation: Details the integrated serological, hematological, autoimmune, and complement workup required to evaluate leukocytoclastic vasculitis.
differential_diagnoses:
- name: Granulomatosis with polyangiitis and primary ANCA-associated vasculitis
  disease_term:
    preferred_term: granulomatosis with polyangiitis
    term:
      id: MONDO:0012105
      label: granulomatosis with polyangiitis
  description: >-
    Infections can induce circulating ANCA via molecular mimicry and produce
    small-vessel necrotizing vasculitis that mimics primary ANCA-associated
    vasculitides such as granulomatosis with polyangiitis or microscopic
    polyangiitis.
  distinguishing_features:
  - Active or antecedent infection on microbiological culture, PCR, or serology favors postinfectious vasculitis.
  - Immune-complex and complement or IgA deposition on direct immunofluorescence contrasts with classic pauci-immune staining in primary ANCA-associated vasculitis.
  - Resolution after antimicrobial clearance without prolonged maintenance immunosuppression favors infection-associated vasculitis.
  evidence:
  - reference: PMID:40089428
    reference_title: Infection associated Vasculitides.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Infections can produce autoantibodies such as Anti-neutrophil cytoplasmic antibody through molecular mimicry and could confound clinical judgement.
    explanation: Explains how infection-induced ANCA positivity mimics primary ANCA-associated vasculitis.
  - reference: PMID:33713282
    reference_title: "Diagnosis and management of leukocytoclastic vasculitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among systemic diseases, the most frequently associated with LCV are ANCA-associated vasculitides, connective tissue diseases, cryoglobulinemic vasculitis, IgA vasculitis (formerly known as Henoch-Schonlein purpura) and hypocomplementemic urticarial vasculitis (HUV).
    explanation: Identifies ANCA-associated vasculitides as a major systemic differential diagnosis when evaluating biopsy-proven leukocytoclastic vasculitis.
- name: Primary polyarteritis nodosa
  disease_term:
    preferred_term: primary polyarteritis nodosa
    term:
      id: MONDO:0018593
      label: primary polyarteritis nodosa
  description: >-
    Medium-vessel infection-associated arteritis (including hepatitis B virus-,
    streptococcal-, or other microbial-associated arteritis) closely mimics
    idiopathic primary polyarteritis nodosa.
  distinguishing_features:
  - Positive viral hepatitis serologies or antecedent microbial infection distinguishes infection-associated medium-vessel vasculitis from idiopathic primary polyarteritis nodosa.
  - Treatment requires pathogen eradication rather than isolated high-dose immunosuppression.
  evidence:
  - reference: PMID:40089428
    reference_title: Infection associated Vasculitides.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Infections can mimic small, medium or large vessel vasculitis.
    explanation: Supports medium-vessel vasculitis mimicry by infectious agents.
- name: Primary central nervous system vasculitis
  disease_term:
    preferred_term: primary central nervous system vasculitis
    term:
      id: MONDO:0015374
      label: primary central nervous system vasculitis
  description: >-
    Primary angiitis of the central nervous system shares cerebrovascular
    stenosis and stroke presentations with infectious CNS vasculitis but lacks
    an infectious trigger.
  distinguishing_features:
  - Infectious CNS vasculitis has higher incidence of fever, low CSF glucose (hypoglycorrhachia), and unique CSF oligoclonal bands compared with primary CNS vasculitis.
  - Microbial PCR, serology, or contiguous meningeal infection identifies secondary infectious CNS vasculitis.
  evidence:
  - reference: DOI:10.1177/19418744231223283
    reference_title: "Vasculitis in the Central Nervous System: Etiology, Characteristics, and Outcomes in a Large Single-Center Cohort"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared to primary CNS vasculitis, secondary CNS vasculitis exhibits higher fever incidence (observed in infectious and connective tissue disorder [CTD]-associated vasculitis), low glucose levels (mostly in infectious vasculitis) and unique cerebrospinal fluid oligoclonal bands (observed in infectious and CTD-associated vasculitis).
    explanation: Directly contrasts clinical and CSF laboratory features of infectious/secondary CNS vasculitis against primary CNS vasculitis.
- name: Infective endocarditis and septic embolic pseudovasculitis
  disease_term:
    preferred_term: infective endocarditis
    term:
      id: MONDO:0000565
      label: infective endocarditis
  description: >-
    Subacute bacterial endocarditis, meningococcemia, disseminated gonococcal
    infection, and rickettsial infections can present with palpable or
    nonpalpable purpura, septic emboli, and ANCA positivity, mimicking primary
    or postinfectious immune vasculitis.
  distinguishing_features:
  - Positive blood cultures, cardiac vegetations on echocardiography, or microvascular septic thrombi on biopsy identify infectious pseudovasculitis.
  - Inadvertent immunosuppression without antimicrobial therapy can be fatal in septic embolic mimics.
  evidence:
  - reference: PMID:33713282
    reference_title: "Diagnosis and management of leukocytoclastic vasculitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pseudovasculitis, presenting both as palpable or nonpalpable purpura, include several potentially severe dis- eases, such as infectious emboli (e.g., from endocarditis), acute meningococcemia, disseminated gonococcal infection, Rocky mountain spotted fever, disseminated intravascular coagulation, monoclonal paraproteinemias or Waldenstrom’s disease, thrombotic thrombocytopenic purpura (Moskow - itz’s disease), emboli due to cardiac myxoma and cholesterol emboli.
    explanation: Identifies infective endocarditis and disseminated bacterial/rickettsial infections as critical pseudovasculitis differentials presenting with purpura.
  - reference: PMID:40089428
    reference_title: Infection associated Vasculitides.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is very important for the clinician to be aware of the various infections which mimic vasculitis, since inadvertent immunosuppression in these patients can be fatal.
    explanation: Underscores the life-threatening risk of misdiagnosing infectious vasculitis mimics and administering immunosuppression alone.
inheritance:
- name: Sporadic postinfectious acquisition
  inheritance_term:
    preferred_term: Sporadic
    term:
      id: HP:0003745
      label: Sporadic
  description: >-
    Postinfectious vasculitis is an acquired, non-Mendelian condition triggered
    by exogenous microbial infections, with polygenic host susceptibility
    influencing immune-complex formation and clearance in subtypes such as IgA
    vasculitis.
  evidence:
  - reference: PMID:33713282
    reference_title: "Diagnosis and management of leukocytoclastic vasculitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An underlying cause or a systemic involvement is usu- ally found in around half of the cases of LCV, whereas the other 50% is split between a single-organ cutaneous SVV, usually drug or infection induced, or an idiopathic/unclas- sifiable LCV [10–14].
    explanation: Supports the acquired, infection- or drug-induced occurrence of cutaneous small-vessel vasculitis rather than Mendelian inheritance.
  - reference: DOI:10.3390/jcm12020697
    reference_title: Viral Infections May Be Associated with Henoch–Schönlein Purpura
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A variety of factors, including infectious agents, drugs, and vaccines, have been identified as potential triggers. The majority of cases are preceded by upper respiratory tract infections, and seasonal variations suggest a link with many pathogens.
    explanation: Supports exogenous infectious and environmental triggers driving sporadic postinfectious acquisition in IgA vasculitis.

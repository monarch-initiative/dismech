    term:
      id: NCIT:C51692
      label: Skin Biopsy
  description: >-
    Punch or excisional biopsy of a fresh purpuric lesion for routine
    histopathology and unfixed direct immunofluorescence (evaluating IgA, IgG,
    IgM, and complement C3 deposition) is the gold-standard diagnostic procedure
    to confirm leukocytoclastic vasculitis and identify IgA vasculitis or
    immune-complex subtypes.
  results: >-
    Neutrophilic infiltration of small dermal vessels with fibrinoid necrosis
    and nuclear fragmentation (leukocytoclasia) on light microscopy, with

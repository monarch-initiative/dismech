prevalence:
- population: Worldwide (general population)
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 1.0
  rate_low: 0.1
  rate_high: 1.5
  notes: >-
    The general-population figure, and the one a consumer aggregating on
    prevalence_class should see. Published estimates span 1 in 65,000 to 1 in
    1,000,000 (1.5 to 0.1 per 100,000) with a best estimate of 1 in 100,000.
    The guideline is explicit that no good prevalence studies exist and that
    the condition is almost certainly underdiagnosed, which is consistent with
    this entry's own KNOWLEDGE_GAP on indistinguishability from GSD IX - cases
    are missed because nothing on clinical grounds points at the diagnosis.
  evidence:
  - reference: PMID:30659246

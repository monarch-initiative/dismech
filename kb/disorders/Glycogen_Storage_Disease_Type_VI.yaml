    snippet: >-
      Published prevalence estimates for GSD VI range from 1 in 65,000 to 1 in
      1,000,000, but the best estimate is 1 in 100,000 individuals.
    explanation: >-
      The ACMG guideline's own best general-population estimate, with the range
      of published values it spans.

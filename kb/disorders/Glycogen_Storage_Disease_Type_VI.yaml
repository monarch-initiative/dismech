      clinical practice resource of the American College of Medical Genetics
      and Genomics (ACMG).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There are no good studies determining the prevalence of GSD VI or IX.
      There is a paucity of cases confirmed by genetic testing in the
      literature, and it is believed that these conditions are almost certainly
      underdiagnosed.
    explanation: >-
      The caveat that must travel with the number: it rests on no good study,
      and underdiagnosis is expected.
- population: Mennonite community
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 100.0
  notes: >-
    The one population known to be at increased risk, through a founder splice
    variant. 0.1% equals 1 in 1,000, i.e. 100 per 100,000. This is a founder
    population figure and must not be read as the general prevalence, which is
    about a hundredfold lower and is curated as the record above.
  evidence:
  - reference: PMID:9536091
    reference_title: >-
      Identification of a mutation in liver glycogen phosphorylase in glycogen
      storage disease type VI.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This mutation is estimated to be present on 3% of Mennonite chromosomes
      and the disease affects 0.1% of that population.
    explanation: >-
      Gives both the carrier frequency and the disease prevalence in the founder
      population.
treatments:
- name: Uncooked Cornstarch and High-Protein Dietary Therapy
  description: >-
    Management is dietary rather than pharmacological. Frequent feeds with
    uncooked cornstarch provide slow-release glucose that substitutes for the
    absent glycogenolytic output overnight and between meals; added dietary
    protein supplies gluconeogenic substrate, which works here precisely because
    gluconeogenesis is intact. Because the intervention replaces the missing
    hepatic glucose output rather than correcting the enzyme, it is curated as
    acting on the fasting-intolerance node, not on the enzymatic lesion.
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  therapeutic_modality: BEHAVIORAL
  target_mechanisms:
  - target: Fasting Intolerance with Preserved Ketogenesis
    treatment_effect: INHIBITS
    description: >-
      Supplies exogenous slow-release glucose and gluconeogenic substrate,
      bypassing the glycogenolytic block without restoring it.
    evidence:
    - reference: PMID:20301760
      reference_title: Glycogen Storage Disease Type VI.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Increasing protein intake may be necessary to provide an alternate
        substrate for gluconeogenesis.
      explanation: >-
        Directly evidences the mechanism claimed on this link, and this entry's
        central thesis: dietary protein works BECAUSE gluconeogenesis is intact,
        so it can supply an alternate substrate the glycogenolytic block cannot.
    - reference: PMID:20301760
      reference_title: Glycogen Storage Disease Type VI.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Even in those with no hypoglycemia, a bedtime dose of cornstarch and a
        high-protein diet improves energy and prevents ketosis.
      explanation: >-
        Shows the intervention acts on the fasting-intolerance node itself
        rather than only on frank hypoglycaemia - it prevents ketosis even in
        normoglycaemic patients, which is the node this link targets.
  evidence:
  - reference: PMID:20301760
    reference_title: Glycogen Storage Disease Type VI.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment with a high-protein, low-carbohydrate diet and cornstarch
      improves growth and stamina and ameliorates biochemical abnormalities
      including hypoglycemia and ketosis.
    explanation: >-
      The efficacy claim for the therapy itself, naming its effects on growth,
      stamina, hypoglycaemia and ketosis.
- name: Glucagon (contraindicated as hypoglycaemia rescue)
  description: >-
    Curated as a treatment NOT to give, because the reason is mechanistically
    central rather than incidental. Glucagon raises blood glucose by activating
    hepatic glycogen phosphorylase - the very enzyme that is missing here - so
    it cannot work in GSD VI, and reaching for it in a hypoglycaemic episode
    wastes time in which cornstarch or glucose would help. GeneReviews lists it
    among agents to avoid.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  therapeutic_modality: PEPTIDE
  evidence:
  - reference: PMID:20301760
    reference_title: Glycogen Storage Disease Type VI.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Agents/circumstances to avoid: Excessive amounts of simple sugars and a
      high-carbohydrate diet; glucagon administration as a rescue therapy for
      hypoglycemia; growth hormone therapy for short stature; contact sports
      when hepatomegaly is present.
    explanation: >-
      GeneReviews lists glucagon rescue among agents to avoid, alongside growth
      hormone for short stature and contact sports with hepatomegaly.
animal_models:
- name: Pygl-null mouse
  species: Mouse
  genotype: Pygl knockout, homozygous (Pygl-/-)
  publication: PMID:31701076
  description: >-
    A Pygl-deficient mouse that reproduces both arms of the human disease - the
    metabolic signature in young animals and the hepatic complications in old
    ones - and supplies the stellate-cell mechanism linking them.
  modeled_mechanisms:
  - target: Impaired Hepatic Glycogenolysis with Intact Synthesis and Gluconeogenesis
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces hepatomegaly, hepatic glycogen accumulation, low hepatic free
      glucose, fasting hypoglycaemia and elevated ketone bodies - including the
      preserved ketogenic response that distinguishes GSD VI from GSD I.
    limitations: >-
      A constitutive whole-body knockout, so it models complete enzyme absence;
      most patients carry missense alleles with variable residual activity, and
      the model therefore sits at the severe end of the human allelic spectrum.
    readouts:
    - name: Hepatic glycogen content
      target: Impaired Hepatic Glycogenolysis with Intact Synthesis and Gluconeogenesis
      direction: INCREASED
      interpretation: Direct measure of the blocked glycogenolytic step.
      evidence:
      - reference: PMID:31701076
        reference_title: >-
          Liver Glycogen Phosphorylase Deficiency Leads to Profibrogenic
          Phenotype in a Murine Model of Glycogen Storage Disease Type VI.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Pygl -/- mice exhibit hepatomegaly, excessive hepatic glycogen
          accumulation, and low hepatic free glucose along with lower fasting
          blood glucose levels and elevated blood ketone bodies.
        explanation: Reports hepatic glycogen accumulation in the knockout.
    - name: Blood ketone bodies during fasting
      target: Impaired Hepatic Glycogenolysis with Intact Synthesis and Gluconeogenesis
      direction: INCREASED
      interpretation: >-
        Confirms ketogenesis is preserved, so the hypoglycaemia is ketotic - the
        positive finding that separates this disease from GSD I.
      evidence:
      - reference: PMID:31701076
        reference_title: >-
          Liver Glycogen Phosphorylase Deficiency Leads to Profibrogenic
          Phenotype in a Murine Model of Glycogen Storage Disease Type VI.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          lower fasting blood glucose levels and elevated blood ketone bodies
        explanation: Reports co-occurring fasting hypoglycaemia and ketosis.
    evidence:
    - reference: PMID:31701076
      reference_title: >-
        Liver Glycogen Phosphorylase Deficiency Leads to Profibrogenic Phenotype
        in a Murine Model of Glycogen Storage Disease Type VI.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Collectively, the Pygl-deficient mouse recapitulates clinical features
        in patients with GSD-VI and provides a model to elucidate the mechanisms
        underlying hepatic complications associated with defective glycogen
        metabolism.
      explanation: >-
        The authors' own statement that the model is informative for the human
        disease.
  - target: Hepatic Stellate Cell Activation and Fibrogenesis
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Old knockout mice show increased alpha-SMA-positive activated stellate
      cells with periportal and perisinusoidal collagen deposition, portal
      inflammatory infiltrate, raised Ccl5 and Mcp-1, and elevated
      transaminases.
    limitations: >-
      Strictly age-dependent, appearing only after about 40 weeks, and the
      collagen deposition is graded minimal to mild - it is a profibrogenic
      state, not established cirrhosis, so the model supports the fibrogenesis
      node but not the cirrhosis endpoint seen in a minority of patients.
    readouts:
    - name: Alpha-SMA-positive activated hepatic stellate cells
      target: Hepatic Stellate Cell Activation and Fibrogenesis
      direction: INCREASED
      interpretation: >-
        Identifies the mesenchymal effector cell, which is what licenses the
        fibrotic_response module conformance on this node.
      evidence:
      - reference: PMID:31701076
        reference_title: >-
          Liver Glycogen Phosphorylase Deficiency Leads to Profibrogenic
          Phenotype in a Murine Model of Glycogen Storage Disease Type VI.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          immunohistochemical analysis showed the number of cells positive for
          alpha smooth muscle actin (α-SMA), a marker of activated hepatic
          stellate cells, was increased in the livers of old Pygl -/- mice
          compared with those of age-matched wild-type (WT) mice.
        explanation: Direct measurement of stellate cell activation.
    - name: Serum AST and ALT
      target: Hepatic Stellate Cell Activation and Fibrogenesis
      direction: INCREASED
      interpretation: Biochemical correlate of ongoing hepatocellular damage.
      evidence:
      - reference: PMID:31701076
        reference_title: >-
          Liver Glycogen Phosphorylase Deficiency Leads to Profibrogenic
          Phenotype in a Murine Model of Glycogen Storage Disease Type VI.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Serum levels of aspartate aminotransferase and alanine
          aminotransferase were elevated in old Pygl -/- mice, indicating liver
          damage.
        explanation: Reports the transaminase elevation accompanying the fibrogenic state.
    evidence:
    - reference: PMID:31701076
      reference_title: >-
        Liver Glycogen Phosphorylase Deficiency Leads to Profibrogenic Phenotype
        in a Murine Model of Glycogen Storage Disease Type VI.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Pygl deficiency results in progressive accumulation of hepatic glycogen
        with age and liver damage, inflammation, and collagen deposition, which
        can increase the risk of liver fibrosis.
      explanation: >-
        Supports treating the model as informative for the fibrogenesis node,
        with the authors' own hedge ("can increase the risk") preserved.
diagnosis:
- name: Biallelic PYGL molecular genetic testing
  presence: Positive
  description: >-
    The diagnosis is established by molecular genetic testing in a proband with
    characteristic clinical and laboratory findings. Enzyme analysis on liver
    biopsy is the fallback when sequencing is uninformative, which matters
    because a recurrent multi-exon PYGL deletion is described that standard
    panels can miss.
  evidence:
  - reference: PMID:20301760
    reference_title: Glycogen Storage Disease Type VI.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of GSD VI is established in a proband with characteristic
      clinical and laboratory findings and biallelic pathogenic variants in PYGL
      identified by molecular genetic testing. If molecular genetic testing
      cannot establish a diagnosis, analysis for hepatic glycogen phosphorylase
      activity deficiency can be considered on liver tissue biopsy.
    explanation: >-
      Gives both the primary molecular criterion and the enzymatic fallback.
- name: Metabolic and hepatic surveillance
  description: >-
    Surveillance is part of the diagnostic workflow here rather than an
    afterthought, because the disease's two risks run on different timescales:
    acute ketotic hypoglycaemia during catabolic stress, and slow hepatic
    fibrosis. The annual liver ultrasound from age five is the concrete response
    to the fibrosis and cirrhosis burden curated on the hepatic node.
  evidence:
  - reference: PMID:20301760
    reference_title: Glycogen Storage Disease Type VI.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Measure blood ketones and blood glucose concentrations at least several
      times per month and during times of stress including illness, intense
      activity, periods of rapid growth, or any time at which intake of food is
      reduced. Annual liver ultrasound beginning at age five years.
    explanation: >-
      Specifies both surveillance arms and the age at which hepatic imaging
      begins.
- name: Carrier and prenatal testing
  description: >-
    Autosomal recessive, so sibs carry a 25% recurrence risk; carrier and
    prenatal or preimplantation testing follow once the family's variants are
    known.
  evidence:
  - reference: PMID:20301760
    reference_title: Glycogen Storage Disease Type VI.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      If both parents are known to be heterozygous for a PYGL pathogenic
      variant, each sib of an affected individual has at conception a 25% chance
      of being affected, a 50% chance of being an asymptomatic carrier, and a
      25% chance of being unaffected and not a carrier.
    explanation: The recurrence risks underpinning genetic counselling.
references:
- reference: PMID:20301760
  title: Glycogen Storage Disease Type VI.
  tags:
  - GeneReviews
  findings: []
discussions:
- discussion_id: gap_gsd6_gsd9_clinically_indistinguishable
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Hepatic Glycogen Phosphorylase Deficiency
  prompt: >-
    Is there any clinical, biochemical or imaging feature that distinguishes GSD
    VI from GSD IX without enzymatic or genetic testing?
  rationale: >-
    The two diseases have adjacent but distinct lesions - PYGL is the substrate
    enzyme, phosphorylase kinase is its activating kinase - yet the largest
    systematic review states flatly that neither clinical nor laboratory
    findings allow differentiation, and the ACMG resource is a single joint
    guideline covering both. This matters for curation as well as for clinics:
    it means published cohorts described as "GSD VI" before molecular testing
    became routine may include GSD IX patients, so historical phenotype
    frequencies should be read with that in mind. It is also the reason a
    Hepatic_Phosphorylase_System_Deficiencies grouping over GSD VI and GSD IX
    would be well founded - two genuinely distinct diseases converging on one
    phenotype and one management pathway.
  evidence:
  - reference: PMID:34440378
    reference_title: The Phenotypic and Genetic Spectrum of Glycogen Storage Disease Type VI.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neither clinical nor laboratory findings allow for a differentiation
      between GSD VI and GSD IX.
    explanation: >-
      States the indistinguishability directly, from a review that compared the
      two deliberately.
  - reference: PMID:30659246
    reference_title: >-
      Diagnosis and management of glycogen storage diseases type VI and IX: a
      clinical practice resource of the American College of Medical Genetics
      and Genomics (ACMG).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glycogen storage disease types VI and IX have a wide spectrum of clinical
      manifestations and often cannot be distinguished from each other, or from
      other liver GSDs, on clinical presentation alone.
    explanation: >-
      Independently corroborates indistinguishability and widens it to the other
      hepatic GSDs.
- discussion_id: open_gsd6_severity_denominator
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Hepatic Fibrosis and Cirrhosis
  prompt: >-
    What fraction of ALL GSD VI patients, rather than of biopsied ones, develop
    hepatic fibrosis or cirrhosis?
  rationale: >-
    The 32.4% fibrosis and 10.8% cirrhosis figures come from 37 liver biopsies
    within a 63-patient systematic review. Biopsy is not performed at random -
    it is more likely in patients with abnormal biochemistry or imaging - so
    these proportions are almost certainly upper bounds on the population risk,
    while GeneReviews' "cirrhosis is rare" is a lower-bound-style clinical
    summary. Both are curated here, deliberately in tension, because averaging
    them would invent a number neither source supports. Resolving this needs
    prospective non-invasive fibrosis assessment applied to an unselected
    cohort.
  proposed_experiments:
  - experiment_id: exp_gsd6_unselected_elastography_cohort
    name: Non-invasive fibrosis staging in an unselected GSD VI cohort
    description: >-
      Apply transient elastography or MR elastography to a consecutive,
      genetically confirmed GSD VI cohort irrespective of biochemical status,
      with GSD IX patients staged alongside as a comparison arm, to estimate
      fibrosis prevalence on a denominator that is not conditioned on the
      decision to biopsy.
notes: >-
  Scope decision: GSD VI is curated as a separate Disease from GSD IX, not
  merged with it, even though the two are clinically indistinguishable and share
  a management guideline. The reason is mechanistic: PYGL encodes the substrate
  enzyme, phosphorylase kinase is the distinct activating kinase upstream of it,
  and they are different proteins with different genes. This is consistent with
  the reasoning in the GSD IX entry, which lumps PHKA1/PHKA2/PHKB/PHKG2 because
  those genes encode subunits of ONE enzyme complex - the same rule applied here
  separates VI from IX. The clinical convergence is real and is captured as a
  KNOWLEDGE_GAP discussion instead; a Hepatic_Phosphorylase_System_Deficiencies
  grouping over the two would be the right structure for it, and is left as a
  follow-up rather than being smuggled into this PR.

  MONDO's own definition of MONDO:0009294 describes the disease as "benign" and
  uses the obsolete sub-numbering "GSD 6b". Both look stale: "benign"
  understates the fibrosis and cirrhosis burden documented since 2014, and the
  a/b sub-numbering dates from when GSD VI and phosphorylase kinase deficiency
  were lumped under one number. Flagged here rather than acted on, since it is
  an upstream ontology matter.

  Curation provenance: a Perplexity deep-research report was generated
  (research/Glycogen_Storage_Disease_VI-deep-research-perplexity.md) and passed
  the NEC preflight against MONDO:0009294 - PYGL mentioned 109 times with no
  PHKA2/PHKB contamination, and report OMIM 232700 matching the MONDO xref. This
  was the entry where NEC risk was highest, because a report that drifted to
  phosphorylase kinase would have looked entirely coherent; it did not drift.
  The report was used as a lead-generation aid only, and every snippet here was
  verified against a cached abstract.

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic PYGL variants. Recurrent alleles differ by population - c.772+1G>A
    in Chinese families and c.1900G>C p.(Asp634His) in European families - so
    the genotypic spectrum is ancestry-dependent even though the phenotype is
    not.
  evidence:
  - reference: PMID:34440378
    reference_title: The Phenotypic and Genetic Spectrum of Glycogen Storage Disease Type VI.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Glycogen storage disease type VI (GSD VI) is an autosomal recessive
      disorder of glycogen metabolism due to mutations in the glycogen
      phosphorylase gene (PYGL), resulting in a deficiency of hepatic glycogen
      phosphorylase.
    explanation: States the inheritance mode, gene and enzymatic consequence.
  - reference: PMID:32892177
    reference_title: >-
      Glycogen storage disease type VI can progress to cirrhosis: ten Chinese
      patients with GSD VI and a literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, c.772+1G>A and c.1900G>C, p.(Asp634His) were recurrent in
      three Chinese families and four European families respectively indicating
      that the genotypic spectrum of PYGL gene may vary among the population.
    explanation: Supports population-specific recurrent PYGL alleles.
genetic:
- name: PYGL
  gene_term:
    preferred_term: PYGL
    term:
      id: hgnc:9725
      label: PYGL
  association: >-
    Biallelic loss-of-function variants in PYGL, encoding the liver isoform of
    glycogen phosphorylase, cause GSD VI. Missense variants predominate, and a
    recurrent multi-exon deletion is described that standard sequencing panels
    can miss.
  evidence:
  - reference: PMID:9536091
    reference_title: >-
      Identification of a mutation in liver glycogen phosphorylase in glycogen
      storage disease type VI.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study is the first to demonstrate that a mutation in the PYGL gene
      can cause GSD6.
    explanation: >-
      The paper that first established PYGL as the causal gene, in a Mennonite
      kindred with an intron 13 splice-donor variant.
  - reference: PMID:34440378
    reference_title: The Phenotypic and Genetic Spectrum of Glycogen Storage Disease Type VI.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early biochemical markers of disease severity or clear genotype phenotype
      correlations are missing.
    explanation: >-
      A negative result worth curating: no genotype-phenotype correlation is
      established, so allele identity does not currently predict severity.
pathophysiology:
- name: Hepatic Glycogen Phosphorylase Deficiency
  biological_scale: MOLECULAR
  description: >-
    Biallelic PYGL loss of function removes the liver isoform of glycogen
    phosphorylase, the rate-limiting enzyme of glycogenolysis, which cleaves the
    alpha-1,4 bonds of glycogen to release glucose-1-phosphate. The enzyme is
    the substrate enzyme of the hepatic phosphorylase system; its activating
    kinase, phosphorylase kinase, is a distinct protein whose deficiency causes
    the separate disease GSD IX.
  genes:
  - preferred_term: PYGL
    term:
      id: hgnc:9725
      label: PYGL
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic germline loss-of-function alleles. Residual enzyme activity is
      variable, which is one candidate explanation for the wide clinical range,
      though no clear genotype-phenotype correlation has been established.
  molecular_functions:
  - preferred_term: glycogen phosphorylase activity
    term:
      id: GO:0008184
      label: glycogen phosphorylase activity
    modifier: LOSS_OF_FUNCTION
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:30659246
    reference_title: >-
      Diagnosis and management of glycogen storage diseases type VI and IX: a
      clinical practice resource of the American College of Medical Genetics
      and Genomics (ACMG).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      GSD VI is caused by deficient activity of hepatic glycogen phosphorylase,
      an enzyme encoded by the PYGL gene.
    explanation: >-
      The ACMG practice resource states the enzymatic lesion and its gene.
  downstream:
  - target: Impaired Hepatic Glycogenolysis with Intact Synthesis and Gluconeogenesis
    causal_link_type: DIRECT
    description: >-
      Loss of the rate-limiting enzyme blocks glycogen breakdown specifically.
- name: Impaired Hepatic Glycogenolysis with Intact Synthesis and Gluconeogenesis
  biological_scale: CELLULAR
  description: >-
    This node is defined as much by what remains intact as by what fails.
    Glycogen breakdown is blocked, but glycogen synthesis, gluconeogenesis and
    fatty-acid oxidation are all preserved. That combination produces the two
    signatures of the disease: glycogen accumulates because synthesis continues
    unopposed, and fasting hypoglycaemia is comparatively mild and ketotic
    because gluconeogenesis can be upregulated and ketogenesis is available. The
    negative content of this node is the whole contrast with GSD I, where
    glucose-6-phosphatase failure blocks gluconeogenesis too and the
    hypoglycaemia is severe and non-ketotic.
  biological_processes:
  - preferred_term: glycogen catabolic process
    term:
      id: GO:0005980
      label: glycogen catabolic process
    modifier: DECREASED
  - preferred_term: gluconeogenesis
    term:
      id: GO:0006094
      label: gluconeogenesis
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:31701076
    reference_title: >-
      Liver Glycogen Phosphorylase Deficiency Leads to Profibrogenic Phenotype
      in a Murine Model of Glycogen Storage Disease Type VI.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Pygl -/- mice exhibit hepatomegaly, excessive hepatic glycogen
      accumulation, and low hepatic free glucose along with lower fasting blood
      glucose levels and elevated blood ketone bodies.
    explanation: >-
      The knockout reproduces the full biochemical signature including the
      preserved ketogenic response, confirming that ketosis is a positive
      consequence of intact fatty-acid oxidation rather than an incidental
      finding.
  downstream:
  - target: Hepatic Glycogen Accumulation
    causal_link_type: DIRECT
    description: >-
      Continued synthesis without breakdown expands hepatocyte glycogen stores.
  - target: Fasting Intolerance with Preserved Ketogenesis
    causal_link_type: DIRECT
    description: >-
      Loss of glycogenolytic glucose output is only partly compensated by
      gluconeogenesis.
- name: Hepatic Glycogen Accumulation
  biological_scale: TISSUE
  description: >-
    Hepatocytes accumulate structurally normal glycogen - diastase-sensitive and
    PAS-positive, not the abnormal polyglucosan of GSD IV. Glycogen content was
    increased in 89.2% of biopsies in the largest series, and in the Pygl-null
    mouse accumulation is progressive with age, which is the mechanistic link to
    the late hepatic complications.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:34440378
    reference_title: The Phenotypic and Genetic Spectrum of Glycogen Storage Disease Type VI.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Liver biopsies (n = 37) showed an increased glycogen content in 89.2%,
      liver fibrosis in 32.4% and early liver cirrhosis in 10.8% of cases,
      respectively.
    explanation: >-
      Quantifies glycogen accumulation and, in the same sentence, the fibrosis
      and cirrhosis burden that the "benign" framing understates.
  - reference: PMID:31701076
    reference_title: >-
      Liver Glycogen Phosphorylase Deficiency Leads to Profibrogenic Phenotype
      in a Murine Model of Glycogen Storage Disease Type VI.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Hepatic glycogen accumulation in Pygl -/- mice increases with age.
    explanation: >-
      Establishes that accumulation is progressive, supplying the temporal link
      to age-dependent hepatic complications.
  downstream:
  - target: Hepatomegaly
    causal_link_type: DIRECT
    description: Expanded hepatocyte glycogen stores enlarge the liver.
  - target: Hepatic Stellate Cell Activation and Fibrogenesis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Long-standing glycogen overload with hepatocyte injury and inflammation
      drives a profibrogenic response.
- name: Hepatomegaly
  biological_scale: ORGANISM
  description: >-
    Hepatomegaly with poor growth is the usual presenting combination, at a
    median age of 1.8 years.
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:34440378
    reference_title: The Phenotypic and Genetic Spectrum of Glycogen Storage Disease Type VI.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The main presenting symptoms were hepatomegaly and poor growth, while the
      most common laboratory findings at initial presentation comprised elevated
      activity of liver transaminases, hypertriglyceridemia, fasting
      hypoglycemia and postprandial hyperlactatemia.
    explanation: >-
      The presenting-feature set, including postprandial hyperlactataemia, which
      is temporally the opposite of GSD I's fasting lactic acidosis.
- name: Fasting Intolerance with Preserved Ketogenesis
  biological_scale: ORGANISM
  description: >-
    Reduced hepatic glucose output during fasting produces hypoglycaemia that is
    usually mild, because gluconeogenesis compensates. Intact fatty-acid
    oxidation shifts metabolism toward lipid, so ketone bodies rise. Ketosis is
    therefore a positive, expected finding here and can occur even when
    hypoglycaemia is slight - the discriminating feature against GSD I.
  biological_processes:
  - preferred_term: fatty acid beta-oxidation
    term:
      id: GO:0006635
      label: fatty acid beta-oxidation
  - preferred_term: ketone body biosynthetic process
    term:
      id: GO:0046951
      label: ketone body biosynthetic process
    modifier: INCREASED
  evidence:
  - reference: PMID:31701076
    reference_title: >-
      Liver Glycogen Phosphorylase Deficiency Leads to Profibrogenic Phenotype
      in a Murine Model of Glycogen Storage Disease Type VI.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      lower fasting blood glucose levels and elevated blood ketone bodies
    explanation: >-
      The knockout shows fasting hypoglycaemia and ketosis co-occurring, the
      signature this node describes.
  downstream:
  - target: Growth Restriction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Chronic fasting intolerance and catabolic shift impair growth.
- name: Growth Restriction
  biological_scale: ORGANISM
  description: >-
    Poor growth is a presenting feature alongside hepatomegaly, and short
    stature with delayed puberty is a recognised complication of suboptimal
    metabolic control.
  evidence:
  - reference: PMID:20301760
    reference_title: Glycogen Storage Disease Type VI.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      More common complications in the setting of suboptimal metabolic control
      include short stature, delayed puberty, osteopenia, and osteoporosis.
    explanation: >-
      Links growth and skeletal complications to metabolic control rather than
      to the enzyme defect directly, which is what makes them treatable.
- name: Hepatic Stellate Cell Activation and Fibrogenesis
  conforms_to: "fibrotic_response#Mesenchymal Cell Activation"
  biological_scale: TISSUE
  description: >-
    The mechanistic route from glycogen overload to the hepatic complications
    runs through activation of hepatic stellate cells. In aged Pygl-null mice
    the number of alpha-SMA-positive activated stellate cells is increased,
    with periportal and perisinusoidal collagen deposition, portal inflammatory
    infiltrates, raised Ccl5 and Mcp-1, and elevated transaminases. This is the
    conserved mesenchymal-activation step of the fibrotic response, substituting
    the hepatic stellate cell as the organ-specific effector.
  cell_types:
  - preferred_term: hepatic stellate cell
    term:
      id: CL:0000632
      label: hepatic stellate cell
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:31701076
    reference_title: >-
      Liver Glycogen Phosphorylase Deficiency Leads to Profibrogenic Phenotype
      in a Murine Model of Glycogen Storage Disease Type VI.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      immunohistochemical analysis showed the number of cells positive for alpha
      smooth muscle actin (α-SMA), a marker of activated hepatic stellate cells,
      was increased in the livers of old Pygl -/- mice compared with those of
      age-matched wild-type (WT) mice.
    explanation: >-
      Direct evidence for stellate cell activation as the mesenchymal effector,
      which is what licenses the fibrotic_response conformance.
  downstream:
  - target: Hepatic Fibrosis and Cirrhosis
    causal_link_type: DIRECT
    description: >-
      Activated stellate cells deposit collagen, producing fibrosis and, in a
      minority, cirrhosis.
- name: Hepatic Fibrosis and Cirrhosis
  biological_scale: TISSUE
  description: >-
    This is the node that contradicts the disease's reputation. Across 37
    biopsies in the largest systematic review, liver fibrosis was present in
    32.4% and early cirrhosis in 10.8%; a Chinese series independently found
    regenerative nodules in four of ten patients. Note the ascertainment caveat:
    these are proportions of BIOPSIED patients, not of all patients, and
    biopsy is not performed at random. The honest summary is that the typical
    course is mild and diet-responsive while fibrosis is common in those
    biopsied and cirrhosis is uncommon but real.
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:34440378
    reference_title: The Phenotypic and Genetic Spectrum of Glycogen Storage Disease Type VI.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our review demonstrates that GSD VI is a disorder with broad clinical
      heterogeneity and a small number of patients with a severe phenotype and
      liver cirrhosis.
    explanation: >-
      The authors' own summary: heterogeneous, with a genuine severe minority.
  - reference: PMID:32892177
    reference_title: >-
      Glycogen storage disease type VI can progress to cirrhosis: ten Chinese
      patients with GSD VI and a literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For the first time, we found that four Chinese patients showed cirrhosis
      in liver biopsy characterized by the formation of regenerative nodules.
    explanation: >-
      An independent series documenting histological cirrhosis, quoted from the
      abstract's results rather than from the paper's result-stating title.
  - reference: PMID:20301760
    reference_title: Glycogen Storage Disease Type VI.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hepatic fibrosis commonly develops in GSD VI, but cirrhosis and
      hypertrophic cardiomyopathy are rare.
    explanation: >-
      GeneReviews agrees fibrosis is common but grades cirrhosis as rare, which
      is a weaker claim than the 10.8% biopsy figure. Recorded as PARTIAL so the
      tension between a clinical-resource summary and a biopsy-series proportion
      stays visible rather than being averaged away.

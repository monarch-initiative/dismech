genetic:
- name: THG1L
  gene_term:
    preferred_term: THG1L
    term:
      id: hgnc:26053
      label: THG1L
  association: Causal biallelic variant
  notes: >-
    Reported disease-associated genotypes include homozygous p.Val55Ala
    (c.164T>C) in Ashkenazi Jewish families (mild ataxia end); compound
    heterozygous p.Val55Ala + p.Cys51Trp (severe epileptic-encephalopathy
    end); a homozygous p.Leu294Pro (c.881T>C) patient; and compound
    heterozygous c.224A>G / c.369-8T>G (moderate ataxia). p.Val55Ala spares
    the in vitro guanylyltransferase activity, so severity appears to track
    residual THG1L function (allele dosage) rather than a distinct molecular
    lesion. ClinGen classifies the THG1L-SCAR28 gene-disease relationship as
    Limited.
  evidence:
  - reference: PMID:27307223
    reference_title: "A mutation in the THG1L gene in a family with cerebellar ataxia and developmental delay."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we identified homozygous p.Val55Ala in the THG1L (tRNA-histidine
      guanylyltransferase 1 like) gene in three siblings
    explanation: Identifies THG1L as the causal gene via the founding homozygous variant.

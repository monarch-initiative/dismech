  - target: Severe Neurodevelopmental and Epileptic Encephalopathy
    description: >-
      When residual THG1L function falls below a threshold (e.g. p.Val55Ala in
      trans with the more severe p.Cys51Trp allele), mitochondrial dysfunction
      extends beyond the cerebellum to a severe global neurodevelopmental and
      epileptogenic process. This is modeled as a severity-gated distal branch
      of the same trunk rather than a separate mechanism: the severe cases still
      carry the shared cerebellar hypoplasia.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

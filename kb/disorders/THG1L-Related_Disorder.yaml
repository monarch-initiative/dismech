  display_name: Severe THG1L phenotype (p.Leu294Pro)
  description: >-
    A more severely affected end of the spectrum reported for a distinct
    homozygous THG1L allele (p.Leu294Pro). The MONDO nosology proposal in
    monarch-initiative/mondo#10172 suggests carving out a severe subtype,
    but the specific severe features are not fully delineated in the sources

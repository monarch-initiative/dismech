clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    The phenotype spans a severity spectrum: p.Val55Ala homozygotes have
    early-onset but largely non-progressive cerebellar ataxia with
    developmental delay, while a p.Leu294Pro homozygote was reported with a
    more severely affected phenotype. Motor and speech disability are the
    dominant sources of burden.
  evidence:
  - reference: PMID:31168944
    reference_title: "Refining the phenotype of the THG1L (p.Val55Ala mutation)-related mitochondrial autosomal recessive congenital cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A similar phenotype was recently reported for another, homozygous
      variant p.L294P was reported with a similar, but more severely
      affected phenotype
    explanation: >-
      The phenotype-refinement report documents that a distinct THG1L allele
      produces a more severe presentation, establishing a severity spectrum.

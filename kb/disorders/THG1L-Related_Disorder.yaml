    reference_title: "Genomic and phenotypic delineation of congenital microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The index (14DG0824) in family 91 was born with intrauterine growth
      restriction (IUGR) and diffuse cerebral and cerebellar atrophy (Table S3).
      Exome sequencing revealed a novel missense variant in THG1L that is
      predicted to be pathogenic
    explanation: >-
      This primary report directly anchors the severe THG1L case later

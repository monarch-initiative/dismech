clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    The phenotype spans a severity spectrum on one shared mechanism: p.Val55Ala
    homozygotes have early-onset but largely non-progressive cerebellar ataxia
    with mild developmental delay and near-normal cognition, while compound
    heterozygotes carrying p.Val55Ala plus the more severe p.Cys51Trp allele
    present at the catastrophic end (profound developmental delay, microcephaly,
    intractable epilepsy, cerebellar hypoplasia, and early death). Burden ranges
    from motor/speech disability to a lethal epileptic encephalopathy.
  evidence:
  - reference: PMID:33682303
    reference_title: "Severe epileptic encephalopathy associated with compound heterozygosity of THG1L variants in the Ashkenazi Jewish population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      presented with profound developmental delays, microcephaly, intractable
      epilepsy, and cerebellar hypoplasia
    explanation: >-
      The compound-heterozygous cohort defines the severe end of the burden
      spectrum, while the same report's homozygous siblings define the mild end.

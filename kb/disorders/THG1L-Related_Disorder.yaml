has_subtypes:
- name: SCAR28 classic
  display_name: SCAR28 / ATX-THG1L (p.Val55Ala)
  description: >-
    The classic, comparatively milder end of the spectrum, defined by
    homozygous p.Val55Ala in Ashkenazi Jewish families: early-onset but
    largely non-progressive cerebellar ataxia with developmental delay,
    dysarthria, pyramidal signs, and cerebellar atrophy/hypoplasia.
  evidence:
  - reference: PMID:31168944
    reference_title: "Refining the phenotype of the THG1L (p.Val55Ala mutation)-related mitochondrial autosomal recessive congenital cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Previously, three siblings with early onset cerebellar dysfunction,
      developmental delay, pyramidal signs, and cerebellar atrophy on brain
      magnetic resonance imaging (MRI) were reported to carry homozygous V55A
      mutations in THG1L.
    explanation: Defines the p.Val55Ala classic presentation.
- name: Severe
  display_name: Severe epileptic encephalopathy (p.Val55Ala / p.Cys51Trp)
  description: >-
    The severe end of the spectrum, best documented in p.Val55Ala/p.Cys51Trp
    compound heterozygotes: profound developmental delay, microcephaly,
    intractable epilepsy, and cerebellar hypoplasia, often with early death.
    Ataxia was not documented in these patients — plausibly because profound
    delay, epilepsy, and early death preclude gait assessment rather than
    because the cerebellar process is absent (cerebellar hypoplasia is
    shared with the classic end). A homozygous p.Leu294Pro patient sits at a
    similar severe pole. This is modeled as a severity-gated subtype of one
    disorder, not a separate disease: the MONDO/ClinGen nosology proposal
    (monarch-initiative/mondo#10172, PR 10477) carves the same spectrum into
    an umbrella plus subtypes.
  evidence:
  - reference: PMID:33682303
    reference_title: "Severe epileptic encephalopathy associated with compound heterozygosity of THG1L variants in the Ashkenazi Jewish population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      presented with profound developmental delays, microcephaly, intractable
      epilepsy, and cerebellar hypoplasia
    explanation: >-
      Defines the severe compound-heterozygous presentation, which retains the
      shared cerebellar hypoplasia.
  - reference: PMID:30214071
    reference_title: "Genomic and phenotypic delineation of congenital microcephaly."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The index (14DG0824) in family 91 was born with intrauterine growth
      restriction (IUGR) and diffuse cerebral and cerebellar atrophy (Table S3).
      Exome sequencing revealed a novel missense variant in THG1L that is
      predicted to be pathogenic
    explanation: >-
      The primary report of the severe THG1L case later identified as
      p.Leu294Pro independently anchors a disease pole with prenatal growth
      restriction and diffuse cerebral and cerebellar atrophy.

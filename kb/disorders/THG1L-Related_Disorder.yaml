mechanistic_hypotheses:
- hypothesis_group_id: thg1l_mitochondrial_dysfunction_model
  hypothesis_label: THG1L Loss and Mitochondrial Dysfunction Model
  status: CANONICAL
  description: >-
    THG1L is a mitochondrial protein with two candidate disease-relevant
    activities: catalysis of the 3'-5' (G-1) addition of guanine to the
    5'-end of tRNA-histidine (mitochondrial tRNA maturation), and
    participation in mitochondrial fusion via interaction with MFN2. Loss of
    function disturbs the mitochondrial network and is proposed to deprive
    cerebellar Purkinje dendrites of mitochondria, causing Purkinje cell
    degeneration and granule cell apoptosis.
  evidence:
  - reference: PMID:31168944
    reference_title: "Refining the phenotype of the THG1L (p.Val55Ala mutation)-related mitochondrial autosomal recessive congenital cerebellar ataxia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      tRNA-histidine guanylyltransferase 1 like (THG1L) localizes to the
      mitochondrion and catalyzes the 3'-5' addition of guanine to the
      5'-end of tRNA-histidine.
    explanation: >-
      Establishes the mitochondrial localization and canonical enzymatic
      activity of THG1L.
  - reference: PMID:27307223
    reference_title: "A mutation in the THG1L gene in a family with cerebellar ataxia and developmental delay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "THG1L protein was previously reported to participate in mitochondrial fusion via its interaction with MFN2."
    explanation: >-
      Establishes the alternative MFN2-dependent mitochondrial-fusion role
      implicated in the p.Val55Ala mechanism.
pathophysiology:
- name: THG1L Loss of Function
  biological_scale: MOLECULAR
  description: >-
    THG1L is a bifunctional protein with two separable activities, and disease
    can in principle arise from loss of either. (1) A tRNA-histidine
    guanylyltransferase that catalyzes the ancestral 3'-5' addition of a single
    guanylate (G-1) to the 5' end of tRNA-His after RNase P cleavage (GTP donor,
    ATP-activated 5' end, two catalytic Mg2+; active as a homotetramer), acting
    in both cytosol and mitochondrion and required for tRNA-His identity and
    translational fidelity. (2) A moonlighting mitofusin guanyl-nucleotide
    exchange factor at the mitochondrial outer membrane that binds MFN1/MFN2,
    enhances MFN2 GTP loading, and promotes mitochondrial fusion. Critically the
    two functions dissociate by allele: for p.Val55Ala the in vitro
    guanylyltransferase activity is preserved and disease tracks the impaired
    MFN2/fusion (GEF) role, whereas other alleles may compromise the enzymatic
    arm — the axis on which the mild-vs-severe spectrum likely turns.

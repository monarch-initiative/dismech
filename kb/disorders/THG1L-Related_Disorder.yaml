      label: Whole Exome Sequencing
  results: >-
    Biallelic pathogenic or likely pathogenic THG1L variants are consistent with
    THG1L-related disorder; variant interpretation remains important because
    ClinGen currently classifies the gene-disease relationship as Limited.
  evidence:
  - reference: PMID:31168944
    reference_title: "Refining the phenotype of the THG1L (p.Val55Ala mutation)-related mitochondrial autosomal recessive congenital cerebellar ataxia."
    supports: SUPPORT

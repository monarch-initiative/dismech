prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ultra-rare. Fewer than a dozen patients are reported across the founding
    Ashkenazi Jewish p.Val55Ala families, additional p.Val55Ala patients, a
    single p.Leu294Pro patient, and one compound-heterozygous patient. An
    Ashkenazi Jewish carrier rate of 0.8% for p.Val55Ala was estimated, but
    no homozygotes were found in that screen or in ExAC/gnomAD.
  evidence:
  - reference: PMID:31168944
    reference_title: "Refining the phenotype of the THG1L (p.Val55Ala mutation)-related mitochondrial autosomal recessive congenital cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A carrier rate of 0.8%, but no THG1L V55A homozygotes, was found in a
      cohort of 3,232 unrelated Ashkenazi Jewish individuals
    explanation: Quantifies the Ashkenazi Jewish carrier frequency for the founding allele.
discussions:
- discussion_id: disc_thg1l_function_gap
  prompt: >-
    Which molecular function of THG1L drives cerebellar disease: its
    MFN2-dependent mitochondrial-fusion role, or its mitochondrial
    tRNA-histidine (G-1) maturation activity?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#THG1L Loss of Function
  rationale: >-
    For p.Val55Ala the in vitro tRNA-histidine guanylyltransferase activity
    was preserved, so the founding report attributed disease to interference
    with the MFN2/mitochondrial-fusion role. A later compound-heterozygous
    case instead framed the mechanism as abnormal mitochondrial tRNA
    modification. Which activity is rate-limiting for cerebellar
    degeneration — and whether it differs by allele — remains unresolved.
  evidence:
  - reference: PMID:27307223
    reference_title: "A mutation in the THG1L gene in a family with cerebellar ataxia and developmental delay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "tRNAHis guanylyltransferase activity was excluded by the normal in vitro G-1 addition to either yeast tRNAHis or human mitochondrial tRNAHis in the presence of the THG1L mutation."
    explanation: Shows the enzymatic activity was intact for p.Val55Ala, motivating the fusion-role hypothesis.
- discussion_id: disc_thg1l_nosology_spectrum
  prompt: >-
    Should THG1L-related disorder be split into distinct subtypes (a mild
    SCAR28/ATX-THG1L ataxia versus a severe THG1L-related epileptic
    encephalopathy), and is the severe end genotype-correlated?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - has_subtypes#Severe
  rationale: >-
    MONDO issue monarch-initiative/mondo#10172 proposes an umbrella
    "THG1L-related disorder" with a mild SCAR28 subtype and a severe
    "THG1L-related epileptic encephalopathy" subtype, attributing the severe
    end to compound-heterozygous patients. The primary sources available
    here do not support that specific genotype-phenotype claim: the reported
    compound-heterozygous patient (Han et al. 2023) had moderate cerebellar
    ataxia, not epileptic encephalopathy, and the more severe phenotype was
    reported for a homozygous p.Leu294Pro allele. Delineating the severe
    phenotype and its genotype correlation requires the primary severe-case
    literature (e.g. Shaheen et al. 2019) before a subtype boundary is fixed.
  evidence:
  - reference: PMID:37670026
    reference_title: "Compound heterozygous variants of THG1L result in autosomal recessive cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in THG1L in a 6-year-old boy with moderate cerebellar ataxia."
    explanation: >-
      The compound-heterozygous patient had moderate ataxia, contradicting the
      framing that compound heterozygotes present with severe epileptic
      encephalopathy.

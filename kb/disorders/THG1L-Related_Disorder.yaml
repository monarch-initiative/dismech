mechanistic_hypotheses:
- hypothesis_group_id: thg1l_mitochondrial_dysfunction_model
  hypothesis_label: THG1L Loss and Mitochondrial Dysfunction Model
  status: CANONICAL
  description: >-
    THG1L is a mitochondrial protein with two candidate disease-relevant
    activities: catalysis of the 3'-5' (G-1) addition of guanine to the
    5'-end of tRNA-histidine (mitochondrial tRNA maturation), and
    participation in mitochondrial fusion via interaction with MFN2. Loss of
    function disturbs the mitochondrial network and is proposed to deprive
    cerebellar Purkinje dendrites of mitochondria, causing Purkinje cell
    degeneration and granule cell apoptosis.
  evidence:
  - reference: PMID:31168944
    reference_title: "Refining the phenotype of the THG1L (p.Val55Ala mutation)-related mitochondrial autosomal recessive congenital cerebellar ataxia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      tRNA-histidine guanylyltransferase 1 like (THG1L) localizes to the
      mitochondrion and catalyzes the 3'-5' addition of guanine to the
      5'-end of tRNA-histidine.
    explanation: >-
      Establishes the mitochondrial localization and canonical enzymatic
      activity of THG1L.
  - reference: PMID:27307223
    reference_title: "A mutation in the THG1L gene in a family with cerebellar ataxia and developmental delay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "THG1L protein was previously reported to participate in mitochondrial fusion via its interaction with MFN2."
    explanation: >-
      Establishes the alternative MFN2-dependent mitochondrial-fusion role
      implicated in the p.Val55Ala mechanism.
pathophysiology:
- name: THG1L Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic THG1L variants impair the mitochondrial THG1L protein. For
    p.Val55Ala, the in vitro tRNA-histidine guanylyltransferase activity was
    preserved, pointing to interference with the MFN2-dependent
    mitochondrial-fusion role rather than the enzymatic role; a
    compound-heterozygous case instead emphasizes abnormal mitochondrial
    tRNA modification.
  genes:
  - preferred_term: THG1L
    term:
      id: hgnc:26053
      label: THG1L
  molecular_functions:
  - preferred_term: tRNA guanylyltransferase activity
    term:
      id: GO:0008193
      label: tRNA guanylyltransferase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: mitochondrial fusion
    term:
      id: GO:0008053
      label: mitochondrial fusion
    modifier: DECREASED
  evidence:
  - reference: PMID:37670026
    reference_title: "Compound heterozygous variants of THG1L result in autosomal recessive cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dysfunction of THG1L results in abnormal mitochondrial tRNA modification and neurodevelopmental disorders."
    explanation: >-
      Directly frames THG1L dysfunction as impairing mitochondrial tRNA
      modification with a neurodevelopmental consequence.
  - reference: PMID:27307223
    reference_title: "A mutation in the THG1L gene in a family with cerebellar ataxia and developmental delay."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "tRNAHis guanylyltransferase activity was excluded by the normal in vitro G-1 addition to either yeast tRNAHis or human mitochondrial tRNAHis in the presence of the THG1L mutation."
    explanation: >-
      For p.Val55Ala the enzymatic activity was intact in vitro, so this
      allele's mechanism is attributed to the MFN2/fusion role rather than
      loss of guanylyltransferase activity.

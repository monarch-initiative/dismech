- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ultra-rare, concentrated in the Ashkenazi Jewish population. Reported
    patients include the founding p.Val55Ala homozygous families, four further
    p.Val55Ala homozygous siblings and three p.Val55Ala/p.Cys51Trp compound
    heterozygotes (Rabin 2021), a p.Leu294Pro patient, and a compound
    heterozygous ataxia patient (Han 2023). Both key Ashkenazi alleles are
    low-frequency and no p.Val55Ala homozygotes were found in ExAC/gnomAD.
  evidence:
  - reference: PMID:33682303
    reference_title: "Severe epileptic encephalopathy associated with compound heterozygosity of THG1L variants in the Ashkenazi Jewish population."
    supports: SUPPORT

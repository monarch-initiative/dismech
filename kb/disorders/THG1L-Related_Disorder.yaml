diagnosis:
- name: Molecular diagnosis by next-generation sequencing
  description: >-
    Children with congenital ataxia can be evaluated with an ataxia or
    mitochondrial-disease next-generation sequencing panel and preferably
    clinical whole-exome sequencing. Identification of biallelic pathogenic or
    likely pathogenic THG1L variants supports the diagnosis in the appropriate
    clinical context.
  diagnosis_term:
    preferred_term: clinical whole-exome sequencing
    term:

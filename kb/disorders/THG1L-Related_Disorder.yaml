  evidence:
  - reference: PMID:37670026
    reference_title: "Compound heterozygous variants of THG1L result in autosomal recessive cerebellar ataxia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dysfunction of THG1L results in abnormal mitochondrial tRNA modification and neurodevelopmental disorders."
    explanation: >-
      Directly frames THG1L dysfunction as impairing mitochondrial tRNA
      modification with a neurodevelopmental consequence.
  - reference: PMID:27307223
    reference_title: "A mutation in the THG1L gene in a family with cerebellar ataxia and developmental delay."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "tRNAHis guanylyltransferase activity was excluded by the normal in vitro G-1 addition to either yeast tRNAHis or human mitochondrial tRNAHis in the presence of the THG1L mutation."
    explanation: >-
      For p.Val55Ala the enzymatic activity was intact in vitro, so this
      allele's mechanism is attributed to the MFN2/fusion role rather than
      loss of guanylyltransferase activity.
  - reference: PMID:21059936
    reference_title: "The unique alpha-beta-fold of the tRNA(His) guanylyltransferase and its implications for enzyme function and evolution."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "tRNA(His) guanylyltransferase (THG1), a unique 3'-5' nucleotidyl transferase"
    explanation: >-
      Establishes THG1L's ancestral tRNA-His guanylyltransferase activity as a
      unique 3'-5' nucleotidyl transferase.
  - reference: PMID:25008184
    reference_title: "IHG-1 increases mitochondrial fusion and bioenergetic function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      enhances the GTP-binding capacity of Mfn2, suggesting that IHG-1 acts as
      a guanine nucleotide exchange factor
    explanation: >-
      Establishes the moonlighting mitofusin GEF activity — THG1L/IHG-1
      enhances MFN2 GTP loading — that underlies the fusion role.
  downstream:
  - target: Mitochondrial Network Disruption
    description: >-
      THG1L loss lowers MFN2 GTP loading (loss of its mitofusin GEF activity),
      disturbing the mitochondrial network and producing abnormal fragmentation
      and distribution in patient cells.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - reduced MFN2 GTP loading due to loss of THG1L mitofusin-GEF activity
    hypothesis_groups:
    - thg1l_mitochondrial_dysfunction_model
    evidence:
    - reference: PMID:25008184
      reference_title: "IHG-1 increases mitochondrial fusion and bioenergetic function."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        enhances the GTP-binding capacity of Mfn2, suggesting that IHG-1 acts as
        a guanine nucleotide exchange factor
      explanation: >-
        Identifies reduced MFN2 GTP loading as the molecular intermediate between
        THG1L loss and impaired fusion.
    - reference: PMID:27307223
      reference_title: "A mutation in the THG1L gene in a family with cerebellar ataxia and developmental delay."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Abnormal mitochondrial fragmentation, including mitochondria
        accumulation around the nuclei and confinement of the mitochondrial
        network to the nuclear vicinity, was observed when patient fibroblasts
        were cultured in galactose containing medium.
      explanation: >-
        Patient fibroblasts show a disturbed mitochondrial network under
        obligatory oxidative phosphorylation.

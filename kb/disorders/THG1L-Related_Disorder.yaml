discussions:
- discussion_id: disc_thg1l_function_gap
  prompt: >-
    Which molecular function of THG1L drives cerebellar disease: its
    MFN2-dependent mitochondrial-fusion role, or its mitochondrial
    tRNA-histidine (G-1) maturation activity?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#THG1L Loss of Function
  rationale: >-
    THG1L has two separable activities: a tRNA-His guanylyltransferase (enzyme)
    and a mitofusin GEF that enhances MFN2 GTP loading. For p.Val55Ala the in
    vitro guanylyltransferase activity is preserved, so disease in that allele
    tracks the MFN2/fusion (GEF) arm; a compound-heterozygous case instead
    framed the mechanism as abnormal mitochondrial tRNA modification (the
    enzymatic arm). Which activity is rate-limiting — and whether it differs by
    allele — remains unresolved, and this same functional dichotomy is the axis
    on which the mild-vs-severe spectrum (disc_thg1l_nosology_spectrum) most
    likely turns: fusion-selective loss (mild) vs additional enzymatic loss
    (severe). A single allele-resolved functional assay would inform both gaps.
  proposed_experiments:
  - experiment_id: exp_thg1l_allele_resolved_function
    name: Allele-resolved assay of THG1L guanylyltransferase vs mitofusin-GEF activity
    description: >-
      For each disease allele (p.Val55Ala, p.Cys51Trp, p.Leu294Pro, and the
      compound-heterozygous combinations), measure the two THG1L activities
      independently: (1) in vitro tRNA-His G-1 addition (guanylyltransferase),
      as in Edvardson 2016; and (2) MFN2 GTP-loading / mitochondrial-fusion
      rescue in a THG1L-null cell background (GEF activity), as in Hickey 2014.
      Test whether severity tracks combined residual function (dosage/threshold,
      supporting one disorder with a severity-gated subtype) or whether the
      severe alleles selectively ablate the enzymatic arm while sparing the GEF
      arm (a functional branch that would argue for splitting).
  evidence:
  - reference: PMID:27307223
    reference_title: "A mutation in the THG1L gene in a family with cerebellar ataxia and developmental delay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "tRNAHis guanylyltransferase activity was excluded by the normal in vitro G-1 addition to either yeast tRNAHis or human mitochondrial tRNAHis in the presence of the THG1L mutation."
    explanation: Shows the enzymatic activity was intact for p.Val55Ala, motivating the fusion-role hypothesis.
- discussion_id: disc_thg1l_nosology_spectrum
  prompt: >-
    Is the THG1L severity spectrum a dosage/threshold effect on one shared
    mechanism (lump), or does a specific allele (e.g. p.Cys51Trp) confer a
    qualitatively distinct molecular lesion that would justify splitting into
    separate diseases?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - has_subtypes#Severe
  - pathophysiology#Severe Neurodevelopmental and Epileptic Encephalopathy
  rationale: >-
    MONDO/ClinGen (monarch-initiative/mondo#10172, PR 10477) propose an
    umbrella "THG1L-related disorder" with a mild SCAR28 subtype and a severe
    epileptic-encephalopathy subtype. dismech models this as one pathograph
    with a severity-gated distal branch rather than two diseases, because the
    severe p.Val55Ala/p.Cys51Trp compound heterozygotes retain the shared
    cerebellar hypoplasia (the "no ataxia" is plausibly ascertainment — profound
    delay, intractable epilepsy, and early death preclude gait testing), and no
    functional data show p.Cys51Trp ablates a different THG1L activity than the
    hypomorphic, guanylyltransferase-sparing p.Val55Ala. That points to allele
    dosage / residual function crossing a threshold, not a mechanistic branch.
    The open question is whether direct functional characterization of
    p.Cys51Trp (enzymatic vs MFN2-fusion effect) confirms the dosage model or
    instead reveals a distinct lesion that would warrant a split. Note the
    compound-heterozygous label alone does not predict severity: a different
    compound-het genotype (Han 2023, c.224A>G/c.369-8T>G) gave only moderate
    ataxia.
  evidence:
  - reference: PMID:33682303
    reference_title: "Severe epileptic encephalopathy associated with compound heterozygosity of THG1L variants in the Ashkenazi Jewish population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      expand the phenotypic spectrum of THG1L-related disorders to include
      severe epileptic encephalopathy
    explanation: >-
      Frames the severe end as an extension of one THG1L phenotypic spectrum,
      supporting a lump-with-subtypes model over a split.

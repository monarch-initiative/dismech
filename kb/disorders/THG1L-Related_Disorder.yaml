name: THG1L-Related Disorder
creation_date: "2026-07-23T00:00:00Z"
description: >-
  THG1L-related disorder is an autosomal recessive mitochondrial
  cerebellar ataxia caused by biallelic pathogenic variants in THG1L
  (tRNA-histidine guanylyltransferase 1 like), also cataloged as
  spinocerebellar ataxia, autosomal recessive 28 (SCAR28) / ATX-THG1L.
  THG1L localizes to the mitochondrion, catalyzes the 3'-5' addition of
  guanine to the 5'-end of tRNA-histidine, and additionally participates
  in mitochondrial fusion through its interaction with MFN2. Loss of
  function is proposed to injure cerebellar Purkinje and granule cells,
  producing early-onset, largely non-progressive cerebellar ataxia with
  developmental delay, dysarthria, pyramidal signs, and cerebellar atrophy
  or hypoplasia on brain MRI. The disorder is ultra-rare: the founding
  reports describe homozygous p.Val55Ala in Ashkenazi Jewish families, a
  more severely affected homozygous p.Leu294Pro patient, and a
  compound-heterozygous Chinese patient with moderate ataxia. The gene
  carries only a Limited ClinGen gene-disease validity classification,
  reflecting the small number of reported families.
category: Mendelian
synonyms:
- SCAR28
- spinocerebellar ataxia, autosomal recessive 28
- THG1L-related autosomal recessive congenital cerebellar ataxia
- ATX-THG1L
- THG1L-related cerebellar ataxia
parents:

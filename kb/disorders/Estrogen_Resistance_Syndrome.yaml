name: Estrogen Resistance Syndrome
creation_date: "2026-09-29T20:15:26Z"
category: Mendelian
disease_term:
  preferred_term: estrogen resistance syndrome
  term:
    id: MONDO:0014148
    label: estrogen resistance syndrome
synonyms:
- estrogen resistance
- ESTRR
- oestrogen insensitivity
- oestrogen resistance
description: >-
  A rare endocrine disease in which biallelic loss-of-function variants in ESR1
  leave estrogen receptor alpha unable to transduce an estrogen signal. Estrogen
  is produced normally, and circulating estradiol and gonadotropins are high,
  but estrogen action is absent at its target tissues. The result is a hormone
  resistance syndrome rather than a hormone deficiency: absent or minimal breast
  development and primary amenorrhoea with a hypoplastic uterus and
  multifollicular ovaries in affected females, delayed bone maturation with
  unfused epiphyses, and low bone mineral density. Continued linear growth into
  adulthood and insulin resistance are reported in the male index case and were
  absent in the female index case, so both are recorded here as case-level
  findings rather than as features of the syndrome. It is distinct from
  aromatase deficiency, in which the receptor is intact and the ligand cannot be
  synthesised.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Reported patients carry biallelic ESR1 variants, homozygous in consanguineous
    families. Heterozygous carriers are not reported to be affected.
  evidence:
  - reference: PMID:8090165
    reference_title: "Estrogen resistance caused by a mutation in the estrogen-receptor gene in a man."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient's parents were heterozygous carriers of this mutation, and pedigree analysis revealed consanguinity."
    explanation: Homozygosity in the proband with unaffected heterozygous parents and documented consanguinity is the autosomal recessive pattern.
genetic:
- name: ESR1
  gene_term:
    preferred_term: ESR1
    term:
      id: hgnc:3467
      label: ESR1
  relationship_type: CAUSATIVE
  notes: >-
    ESR1 encodes estrogen receptor alpha. Biallelic loss-of-function variants are
    the only established cause of the syndrome, and the reported alleles are not
    all of one kind. The male index case is homozygous for a nonsense variant at
    codon 157 and is a true null. The two reported missense alleles, R394H in the
    Algerian family and the conserved-residue substitution in the female index
    case, leave the receptor expressed but unable to anchor estradiol or drive
    transcription. Both routes converge on absent receptor-mediated signalling,
    which is why the pathograph branches below a single transduction-failure node.
  evidence:
  - reference: PMID:27754803
    reference_title: "Familial Multiplicity of Estrogen Insensitivity Associated With a Loss-of-Function ESR1 Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 3 affected patients carried a homozygous mutation of a highly conserved arginine 394 for which histidine was substituted through an autosomal recessive mode of transmission."
    explanation: Three affected siblings homozygous for a conserved-residue ESR1 substitution establish ESR1 as the causative locus.
  - reference: PMID:8090165
    reference_title: "Estrogen resistance caused by a mutation in the estrogen-receptor gene in a man."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct sequencing of exon 2 revealed a cytosine-to-thymine transition at codon 157 of both alleles, resulting in a premature stop codon."
    explanation: Records the nonsense allele in the male index case, which is a null rather than a transcriptionally impaired receptor.
pathophysiology:
- name: Biallelic ESR1 Loss of Function
  description: >-
    Both ESR1 alleles carry a variant that disables estrogen receptor alpha. The
    consequence differs by allele: a nonsense variant truncates the receptor,
    while the reported missense variants leave it expressed but unable to anchor
    ligand or activate transcription.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: ESR1
    term:
      id: hgnc:3467
      label: ESR1
  downstream:
  - target: Failure of Nuclear Estrogen Receptor Signal Transduction
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27754803
      reference_title: "Familial Multiplicity of Estrogen Insensitivity Associated With a Loss-of-Function ESR1 Mutation."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: IN_VITRO
      snippet: "Structural and functional analysis of the mutant ERα revealed strongly reduced transcriptional activity and the inability to securely anchor the activating hormone, estradiol, compared with wild-type ERα."
      explanation: Bench characterisation of the patients' mutant receptor links the biallelic variant directly to loss of transactivation, which is the next node.
- name: Failure of Nuclear Estrogen Receptor Signal Transduction
  description: >-
    Estradiol reaches its receptor but no receptor-alpha-mediated transcriptional
    response follows. The consequences below are deprivations of estrogen action
    in the presence of ligand.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: nuclear estrogen receptor activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0030284
      label: nuclear estrogen receptor activity
  biological_processes:
  - preferred_term: estrogen receptor signaling pathway
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0030520
      label: estrogen receptor signaling pathway
  - preferred_term: cellular response to estradiol stimulus
    modifier: DECREASED
    description: >-
      Graded DECREASED rather than LOSS_OF_FUNCTION because this term covers the
      cell's whole response to estradiol, and the receptor-beta and
      membrane-initiated arms are intact in this disease. The two terms above are
      receptor-alpha functions and are qualitatively lost.
    term:
      id: GO:0071392
      label: cellular response to estradiol stimulus
  evidence:
  - reference: PMID:8090165
    reference_title: "Estrogen resistance caused by a mutation in the estrogen-receptor gene in a man."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient had no detectable response to estrogen administration, despite a 10-fold increase in the serum free estradiol concentration."
    explanation: A ten-fold rise in free estradiol producing no response is the defining demonstration that the block is at the receptor, not in ligand supply.
  - reference: PMID:42734155
    reference_title: "Estrogen insensitivity syndrome: the 'Upside Down' of ESR1 mutations."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In contrast, germline ESR1 mutations cause EIS by impairing ERα function and rendering peripheral tissues insensitive to circulating E2."
    explanation: States the mechanism of the syndrome as impaired receptor function with circulating ligand intact.
  downstream:
  - target: Loss of Estrogen Negative Feedback on the Gonadotropic Axis
    causal_link_type: DIRECT
  - target: Absent Estrogen Action at the Growth Plate
    causal_link_type: DIRECT
  - target: Impaired Estrogen-Dependent Bone Remodeling
    causal_link_type: DIRECT
  - target: Absent Estrogen Action in Breast Tissue
    causal_link_type: DIRECT
  - target: Absent Estrogen Action in the Uterus
    causal_link_type: DIRECT
  - target: Impaired Estrogen-Dependent Metabolic Regulation
    causal_link_type: DIRECT
- name: Loss of Estrogen Negative Feedback on the Gonadotropic Axis
  description: >-
    Estrogen normally restrains gonadotropin secretion at the hypothalamus and
    pituitary. With receptor alpha non-functional that restraint is absent and LH
    and FSH rise.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: negative regulation of gonadotropin secretion
    modifier: DECREASED
    term:
      id: GO:0032277
      label: negative regulation of gonadotropin secretion
  evidence:
  - reference: PMID:27754803
    reference_title: "Familial Multiplicity of Estrogen Insensitivity Associated With a Loss-of-Function ESR1 Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hormonal evaluation revealed extremely high plasma 17β-estradiol (>50-fold normal range) associated with elevated gonadotropin levels (greater than threefold normal range), highly suggestive of estrogen resistance."
    explanation: High estradiol together with high gonadotropins is the biochemical signature of lost negative feedback.
  downstream:
  - target: Elevated circulating follicle stimulating hormone level
    causal_link_type: DIRECT
  - target: Elevated circulating luteinizing hormone level
    causal_link_type: DIRECT
  - target: Gonadotropin-Driven Ovarian Steroidogenesis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23841731
      reference_title: "Delayed puberty and estrogen resistance in a woman with estrogen receptor α variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "With impaired estrogen-mediated negative feedback, the persistent, mildly elevated gonadotropin levels could stimulate and maintain multiple ovarian cysts producing estradiol and progesterone."
      explanation: Names the gonadotropin drive as the step between lost feedback and the ovarian findings.
- name: Gonadotropin-Driven Ovarian Steroidogenesis
  description: >-
    Unopposed gonadotropin drive stimulates the ovary, which raises circulating
    estradiol further and sustains multiple follicles. The ovary is responsive;
    it is the tissues downstream of the receptor that are not.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: granulosa cell
    term:
      id: CL:0000501
      label: granulosa cell
  downstream:
  - target: Increased serum estradiol
    causal_link_type: DIRECT
  - target: Multifollicular Ovarian Change
    causal_link_type: DIRECT
- name: Multifollicular Ovarian Change
  description: >-
    Sustained gonadotropin stimulation of an ovary whose own estrogen output
    cannot feed back produces multiple enlarged follicles.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:23841731
    reference_title: "Delayed puberty and estrogen resistance in a woman with estrogen receptor α variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We now describe an 18-year-old woman without breast development and with markedly elevated serum levels of estrogens and bilateral multicystic ovaries."
    explanation: Bilateral multicystic ovaries alongside high circulating estrogen in a confirmed ESR1 case.
  downstream:
  - target: Ovarian cyst
    causal_link_type: DIRECT
- name: Absent Estrogen Action at the Growth Plate
  description: >-
    Estrogen drives epiphyseal fusion at the end of puberty. Without
    receptor-mediated signalling the growth plate does not close and bone age
    lags chronological age. In the male index case linear growth continued into
    adulthood; the female index case had no pubertal growth spurt, so the
    direction of the height effect is not uniform across reported patients.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: growth plate chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: growth plate cartilage development
    modifier: DECREASED
    term:
      id: GO:0003417
      label: growth plate cartilage development
  - preferred_term: endochondral ossification
    modifier: DECREASED
    term:
      id: GO:0001958
      label: endochondral ossification
  evidence:
  - reference: PMID:8090165
    reference_title: "Estrogen resistance caused by a mutation in the estrogen-receptor gene in a man."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "had incomplete epiphyseal closure, with a history of continued linear growth into adulthood despite otherwise normal pubertal development"
    explanation: Unfused epiphyses with continued adult linear growth is the growth-plate consequence of absent estrogen action.
  downstream:
  - target: Unfused epiphyses
    causal_link_type: DIRECT
  - target: Delayed skeletal maturation
    causal_link_type: DIRECT
  - target: Tall stature
    causal_link_type: DIRECT
- name: Impaired Estrogen-Dependent Bone Remodeling
  description: >-
    Estrogen signalling through receptor alpha restrains osteoclastic resorption
    and keeps remodelling in balance. Its loss tips the balance toward
    resorption, and both reported index cases show biochemical evidence of
    increased bone turnover rather than a mineralisation defect.
  biological_scale: TISSUE
  conforms_to: "osteoporosis_bone_resorption#Bone Remodeling Imbalance"
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: bone remodeling
    modifier: INCREASED
    term:
      id: GO:0046849
      label: bone remodeling
  - preferred_term: bone resorption
    modifier: INCREASED
    term:
      id: GO:0045453
      label: bone resorption
  evidence:
  - reference: PMID:8090165
    reference_title: "Estrogen resistance caused by a mutation in the estrogen-receptor gene in a man."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "there was biochemical evidence of increased bone turnover"
    explanation: Increased turnover, rather than failed mineralisation, is the bone mechanism in this syndrome.
  - reference: PMID:8090165
    reference_title: "Estrogen resistance caused by a mutation in the estrogen-receptor gene in a man."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Estrogen is important for bone maturation and mineralization in men as well as women."
    explanation: The authors' conclusion that estrogen action is required for skeletal maintenance, drawn from this receptor-defective patient.
  downstream:
  - target: Reduced bone mineral density
    causal_link_type: DIRECT
  - target: Osteoporosis
    causal_link_type: DIRECT
- name: Absent Estrogen Action in Breast Tissue
  description: >-
    Breast ductal development at puberty requires receptor-mediated estrogen
    action, so secondary sexual characteristics do not develop despite high
    circulating estradiol.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:23841731
    reference_title: "Delayed puberty and estrogen resistance in a woman with estrogen receptor α variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient is an 18-year-old, adopted white woman who presented at the age of 15 years with absent breast development, primary amenorrhea, and intermittent lower abdominal pain."
    explanation: Absent breast development in a patient with a homozygous ESR1 variant.
  downstream:
  - target: Breast hypoplasia
    causal_link_type: DIRECT
  - target: Delayed puberty
    causal_link_type: DIRECT
- name: Absent Estrogen Action in the Uterus
  description: >-
    Endometrial proliferation is receptor-mediated, so the uterus remains
    hypoplastic with no endometrial development and no withdrawal bleeding.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:23841731
    reference_title: "Delayed puberty and estrogen resistance in a woman with estrogen receptor α variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ultrasonography revealed a small uterus with no clearly identifiable endometrial stripe and markedly enlarged multicystic ovaries"
    explanation: Direct human imaging of the hypoplastic uterus and absent endometrium in the female index case.
  - reference: PMID:23841731
    reference_title: "Delayed puberty and estrogen resistance in a woman with estrogen receptor α variant."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: "Female Esr1 knockout mice (α-ERKO) have hypoplastic uteri and hemorrhagic, multicystic ovaries without corpora lutea."
    explanation: The mouse orthologue knockout reproduces the uterine finding; quoted from this paper's introduction, which restates established mouse work.
  downstream:
  - target: Hypoplasia of the uterus
    causal_link_type: DIRECT
  - target: Primary amenorrhea
    causal_link_type: DIRECT
- name: Impaired Estrogen-Dependent Metabolic Regulation
  description: >-
    Estrogen action supports insulin sensitivity. Impaired glucose tolerance and
    hyperinsulinaemia were present in the male index case, who was also obese,
    and were explicitly absent in the female index case, so this arm is variable
    and its attribution to receptor loss is not settled.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:8090165
    reference_title: "Estrogen resistance caused by a mutation in the estrogen-receptor gene in a man."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glucose tolerance was impaired, and hyperinsulinemia was present."
    explanation: The metabolic findings in the male index case.
  - reference: PMID:23841731
    reference_title: "Delayed puberty and estrogen resistance in a woman with estrogen receptor α variant."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Our patient had normal levels of fasting glucose, insulin, and glycated hemoglobin and a normal HOMA-IR, indicating no impaired glucose tolerance."
    explanation: The female index case had no metabolic abnormality, which contradicts treating this arm as a constant feature of the syndrome.
  downstream:
  - target: Hyperinsulinemia
    causal_link_type: DIRECT
  - target: Impaired glucose tolerance
    causal_link_type: DIRECT

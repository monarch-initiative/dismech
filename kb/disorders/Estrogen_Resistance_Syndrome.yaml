name: Estrogen Resistance Syndrome
creation_date: "2026-09-29T20:15:26Z"
category: Mendelian
disease_term:
  preferred_term: estrogen resistance syndrome
  term:
    id: MONDO:0014148
    label: estrogen resistance syndrome
synonyms:
- estrogen resistance
- ESTRR
- oestrogen insensitivity
- oestrogen resistance
description: >-
  A rare endocrine disease in which biallelic loss-of-function variants in ESR1
  leave estrogen receptor alpha unable to transduce an estrogen signal. Estrogen
  is produced normally, and circulating estradiol and gonadotropins are high,
  but estrogen action is absent at its target tissues. The result is a hormone
  resistance syndrome rather than a hormone deficiency: absent or minimal breast
  development and primary amenorrhoea with a hypoplastic uterus and
  multifollicular ovaries in affected females, markedly delayed bone maturation
  with unfused epiphyses, continued linear growth and low bone mineral density in
  both sexes, and in some patients insulin resistance and dyslipidaemia. It is
  distinct from aromatase deficiency, in which the receptor is intact and the
  ligand cannot be synthesised.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Reported patients carry biallelic ESR1 variants, homozygous in consanguineous
    families. Heterozygous carriers are not reported to be affected.
  evidence:
  - reference: PMID:8090165
    reference_title: "Estrogen resistance caused by a mutation in the estrogen-receptor gene in a man."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient's parents were heterozygous carriers of this mutation, and pedigree analysis revealed consanguinity."
    explanation: Homozygosity in the proband with unaffected heterozygous parents and documented consanguinity is the autosomal recessive pattern.
genetic:
- name: ESR1
  gene_term:
    preferred_term: ESR1
    term:
      id: hgnc:3467
      label: ESR1
  relationship_type: CAUSATIVE
  notes: >-
    ESR1 encodes estrogen receptor alpha. Biallelic loss-of-function variants are
    the only established cause of the syndrome. Reported alleles impair ligand
    binding or transactivation rather than abolishing the protein, so the receptor
    is present but cannot transduce.
  evidence:
  - reference: PMID:27754803
    reference_title: "Familial Multiplicity of Estrogen Insensitivity Associated With a Loss-of-Function ESR1 Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 3 affected patients carried a homozygous mutation of a highly conserved arginine 394 for which histidine was substituted through an autosomal recessive mode of transmission."
    explanation: Three affected siblings homozygous for a conserved-residue ESR1 substitution establish ESR1 as the causative locus.
pathophysiology:
- name: Biallelic ESR1 Loss of Function
  description: >-
    Both ESR1 alleles carry a variant that disables estrogen receptor alpha. The
    receptor protein is generally expressed but cannot bind ligand or activate
    transcription at an estrogen response element.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: ESR1
    term:
      id: hgnc:3467
      label: ESR1
  downstream:
  - target: Failure of Nuclear Estrogen Receptor Signal Transduction
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:27754803
      reference_title: "Familial Multiplicity of Estrogen Insensitivity Associated With a Loss-of-Function ESR1 Mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: DIRECT
      snippet: "Structural and functional analysis of the mutant ERα revealed strongly reduced transcriptional activity and the inability to securely anchor the activating hormone, estradiol, compared with wild-type ERα."
      explanation: Links the biallelic variant directly to loss of receptor transactivation, which is the next node.
- name: Failure of Nuclear Estrogen Receptor Signal Transduction
  description: >-
    Estradiol reaches its receptor but no receptor-mediated transcriptional
    response follows. Every downstream consequence of the syndrome is a
    deprivation of estrogen action in the presence of ligand.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: nuclear estrogen receptor activity
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0030284
      label: nuclear estrogen receptor activity
  biological_processes:
  - preferred_term: estrogen receptor signaling pathway
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0030520
      label: estrogen receptor signaling pathway
  - preferred_term: cellular response to estradiol stimulus
    modifier: DECREASED
    term:
      id: GO:0071392
      label: cellular response to estradiol stimulus
  evidence:
  - reference: PMID:8090165
    reference_title: "Estrogen resistance caused by a mutation in the estrogen-receptor gene in a man."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient had no detectable response to estrogen administration, despite a 10-fold increase in the serum free estradiol concentration."
    explanation: A ten-fold rise in free estradiol producing no response is the defining demonstration that the block is at the receptor, not in ligand supply.
  - reference: PMID:42734155
    reference_title: "Estrogen insensitivity syndrome: the 'Upside Down' of ESR1 mutations."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In contrast, germline ESR1 mutations cause EIS by impairing ERα function and rendering peripheral tissues insensitive to circulating E2."
    explanation: States the mechanism of the syndrome as impaired receptor function with circulating ligand intact.
  downstream:
  - target: Loss of Estrogen Negative Feedback on the Gonadotropic Axis
    causal_link_type: DIRECT
  - target: Absent Estrogen Action at the Growth Plate
    causal_link_type: DIRECT
  - target: Impaired Estrogen-Dependent Bone Mineral Accrual
    causal_link_type: DIRECT
  - target: Absent Estrogen Action in Breast and Uterine Target Tissue
    causal_link_type: DIRECT
  - target: Multifollicular Ovarian Change
    causal_link_type: DIRECT
- name: Loss of Estrogen Negative Feedback on the Gonadotropic Axis
  description: >-
    Estrogen normally restrains gonadotropin secretion. With the receptor
    non-functional that restraint is absent, so LH and FSH rise, ovarian
    steroidogenesis is driven, and circulating estradiol rises with it. The
    biochemical signature is therefore high estradiol together with high
    gonadotropins, which is what separates this syndrome from estrogen
    deficiency.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: negative regulation of gonadotropin secretion
    modifier: DECREASED
    term:
      id: GO:0032277
      label: negative regulation of gonadotropin secretion
  evidence:
  - reference: PMID:27754803
    reference_title: "Familial Multiplicity of Estrogen Insensitivity Associated With a Loss-of-Function ESR1 Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hormonal evaluation revealed extremely high plasma 17β-estradiol (>50-fold normal range) associated with elevated gonadotropin levels (greater than threefold normal range), highly suggestive of estrogen resistance."
    explanation: High estradiol together with high gonadotropins is the biochemical signature of lost negative feedback.
  downstream:
  - target: Increased serum estradiol
  - target: Elevated circulating follicle stimulating hormone level
  - target: Elevated circulating luteinizing hormone level
- name: Absent Estrogen Action at the Growth Plate
  description: >-
    Estrogen drives epiphyseal fusion at the end of puberty. Without receptor
    signalling the growth plate does not close, bone age lags chronological age,
    and linear growth continues beyond the normal window.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: growth plate chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: growth plate cartilage development
    modifier: DECREASED
    term:
      id: GO:0003417
      label: growth plate cartilage development
  - preferred_term: endochondral ossification
    modifier: DECREASED
    term:
      id: GO:0001958
      label: endochondral ossification
  evidence:
  - reference: PMID:8090165
    reference_title: "Estrogen resistance caused by a mutation in the estrogen-receptor gene in a man."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "had incomplete epiphyseal closure, with a history of continued linear growth into adulthood despite otherwise normal pubertal development"
    explanation: Unfused epiphyses with continued adult linear growth is the growth-plate consequence of absent estrogen action.
  downstream:
  - target: Delayed epiphyseal ossification
  - target: Delayed skeletal maturation
  - target: Tall stature
- name: Impaired Estrogen-Dependent Bone Mineral Accrual
  description: >-
    Estrogen signalling through receptor alpha in bone restrains resorption and
    supports mineral accrual. Its loss leaves bone mineral density low despite
    high circulating estradiol.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: bone mineralization
    modifier: DECREASED
    term:
      id: GO:0030282
      label: bone mineralization
  evidence:
  - reference: PMID:8090165
    reference_title: "Estrogen resistance caused by a mutation in the estrogen-receptor gene in a man."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Estrogen is important for bone maturation and mineralization in men as well as women."
    explanation: The authors' conclusion that estrogen action is required for bone mineralization, drawn from this receptor-defective patient.
  downstream:
  - target: Reduced bone mineral density
  - target: Osteopenia
- name: Absent Estrogen Action in Breast and Uterine Target Tissue
  description: >-
    Breast ductal development and endometrial proliferation both require
    receptor-mediated estrogen action. Neither proceeds, so secondary sexual
    characteristics do not develop and the uterus remains hypoplastic with no
    withdrawal bleeding.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:23841731
    reference_title: "Delayed puberty and estrogen resistance in a woman with estrogen receptor α variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient is an 18-year-old, adopted white woman who presented at the age of 15 years with absent breast development, primary amenorrhea, and intermittent lower abdominal pain."
    explanation: Absent breast development with primary amenorrhoea in a patient with a homozygous ESR1 variant.
  - reference: PMID:23841731
    reference_title: "Delayed puberty and estrogen resistance in a woman with estrogen receptor α variant."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    directness: INDIRECT
    snippet: "Female Esr1 knockout mice (α-ERKO) have hypoplastic uteri and hemorrhagic, multicystic ovaries without corpora lutea."
    explanation: The mouse orthologue knockout reproduces the uterine and ovarian findings; quoted from this paper's introduction, which restates established mouse work.
  downstream:
  - target: Breast hypoplasia
  - target: Hypoplasia of the uterus
  - target: Primary amenorrhea
- name: Multifollicular Ovarian Change
  description: >-
    Sustained gonadotropin drive on an ovary that cannot respond to its own
    estrogen output produces multiple enlarged follicles.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: granulosa cell
    term:

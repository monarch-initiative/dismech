genetic:
- name: ESR1
  gene_term:
    preferred_term: ESR1
    term:
      id: hgnc:3467
      label: ESR1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Every reported case is homozygous. Variants: p.Arg157Ter (the 1994 index
    male), p.Gln375His (the first female, 2013), p.Arg394His (three Algerian
    siblings, 2017), p.Glu385Val (two Jordanian sisters, 2022), p.Met543Thr (a
    2025 case report) and an unspecified homozygous variant in a 13-year-old
    girl reported in 2024 (PMID:39295121). That report's abstract calls the
    syndrome autosomal dominant, which contradicts its own homozygous finding
    and related parents, and is not followed here. A heterozygous p.Ala207Thr
    variant reported in a woman
    with polycystic ovary syndrome and a poor gonadotropin response during IVF
    (PMID:36401248) is not counted here: it is heterozygous, functionally
    untested and in a patient with a different diagnosis.
  evidence:
  - reference: PMID:8090165
    reference_title: "Estrogen resistance caused by a mutation in the estrogen-receptor gene in a man."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct sequencing of exon 2 revealed a cytosine-to-thymine transition at codon 157 of both alleles, resulting in a premature stop codon."
    explanation: The index biallelic truncating variant.
  - reference: PMID:23841731
    reference_title: "Delayed puberty and estrogen resistance in a woman with estrogen receptor α variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She was found to have a homozygous loss-of-function ESR1 mutation in a completely conserved residue that interferes with estrogen signaling."
    explanation: The first female case, homozygous for a missense variant.
  - reference: PMID:39295121
    reference_title: "Estrogen-insensitivity syndrome (EIS) in a female adolescent patient - a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She was found to have a homozygous pathogenic variant in the ESR1 gene located on chromosome 6q25, which interferes with estrogen signaling."
    explanation: >-
      The sixth reported family, homozygous at the ESR1 locus. Cited for the
      variant and the locus only; this report's abstract also calls the
      syndrome autosomal dominant, which its own homozygous finding and
      related parents contradict, so it is not used for inheritance.

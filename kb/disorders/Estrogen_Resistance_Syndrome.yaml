    explanation: Elevated estradiol in the index case.
  readouts:
  - target: Loss of Estrogen Negative Feedback on the Gonadotropin Axis
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: High estradiol with high gonadotropins distinguishes receptor resistance from aromatase deficiency, where estradiol is low.
    evidence:
    - reference: PMID:27754803
      reference_title: "Familial Multiplicity of Estrogen Insensitivity Associated With a Loss-of-Function ESR1 Mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Hormonal evaluation revealed extremely high plasma 17β-estradiol (>50-fold normal range) associated with elevated gonadotropin levels (greater than threefold normal range), highly suggestive of estrogen resistance."
      explanation: The authors read the combination as the diagnostic signature of estrogen resistance.
- name: Estrogen-Regulated Hepatic Binding Proteins
  presence: NORMAL
  context: >-
    Corticosteroid-binding, sex-hormone-binding and thyroxine-binding globulins
    are not raised despite markedly elevated estrogen, which is the hepatic
    readout of the resistance itself: in any state of true estrogen excess these
    proteins rise.
  readouts:
  - target: Loss of Estrogen Receptor Signaling in Target Tissues
    relationship: READOUT_OF
    direction: NEGATIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Unchanged estrogen-regulated hepatic proteins in the presence of high
      estradiol report that the hormone is not being transduced.
    evidence:
    - reference: PMID:23841731
      reference_title: "Delayed puberty and estrogen resistance in a woman with estrogen receptor α variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Serum levels of corticosteroid-binding globulin, sex-hormone–binding globulin, thyroxine-binding globulin, prolactin, and triglycerides were not increased, despite elevated estrogen levels.
      explanation: >-
        The measurement behind this readout, and the cleanest biochemical
        demonstration that target tissues do not register the circulating
        hormone.

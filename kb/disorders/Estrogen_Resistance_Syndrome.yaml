phenotypes:
- name: Tall stature
  category: Skeletal
  description: >-
    Height above +2 SD from continued linear growth through unfused epiphyses in
    most reported patients; the index male measured 204 cm and a female case
    reached +3 SD at 28 years. It is not invariable: the Q375H proband lacked
    the pubertal growth spurt and stayed below the 50th height percentile.
  phenotype_term:
    preferred_term: Tall stature
    term:
      id: HP:0000098
      label: Tall stature
  evidence:

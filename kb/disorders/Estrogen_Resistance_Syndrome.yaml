- name: Unfused epiphyses
  category: Skeletal
  description: >-
    Failure of the epiphyseal growth plates to fuse at the end of puberty, with
    continued growth potential into adulthood.
  notes: >-
    Left unbound. HPO has no term for delayed or absent epiphyseal closure. An
    OLS search of hp for "epiphyseal closure" returns HP:0010588 Premature
    epimetaphyseal fusion, HP:0005616 Accelerated skeletal maturation,
    HP:0031016, HP:0003067 and HP:0032078; "delayed epiphyseal fusion" returns
    nothing; "unfused epiphyses" returns only HP:0031174 Double-layered patella.
    The only closure term is the opposite of this finding. HP:0002663 Delayed
    epiphyseal ossification was considered and rejected: its synonyms are about
    late appearance of the ossification centre, not failure of the physis to
    close. The bone-age lag is carried separately by Delayed skeletal maturation.
  evidence:

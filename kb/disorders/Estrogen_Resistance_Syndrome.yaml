treatments:
- name: Estrogen Administration
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Estrogen given to test or overcome the resistance. Transdermal estradiol
    for six months produced no detectable response in the index male, and
    ethinyl-estradiol followed by tamoxifen did not arrest bone loss in a
    female followed for eight years. Ethinyl-estradiol did improve insulin
    sensitivity, lower leptin and raise some estrogen-regulated liver proteins
    in that patient, so a partial metabolic benefit is documented while the
    skeletal phenotype is not treatable by this route. No effective therapy for
    the bone disease is known.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: estradiol
      term:
        id: CHEBI:23965
        label: estradiol
    - preferred_term: ethinylestradiol
      description: >-
        The agent used in the eight-year follow-up, where it improved insulin
        sensitivity without arresting bone loss.
      term:
        id: CHEBI:4903
        label: 17alpha-ethynylestradiol
    - preferred_term: diethylstilbestrol
      description: >-
        Tried for two and a half years in the first female case because it
        transactivated her variant receptor in vitro; it induced no secondary
        sexual characteristics.
      term:
        id: CHEBI:41922
        label: diethylstilbestrol
  target_mechanisms:
  - target: Insulin Resistance and Metabolic Dysregulation
    description: >-
      Ethinyl-estradiol improved insulin sensitivity and lowered leptin in one
      long-term follow-up.
    evidence:
    - reference: PMID:40032016
      reference_title: "Novel estrogen receptor-α gene inactivating missense variant in a woman: Therapeutic challenge and long-term follow-up data."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Treatment with ethinyl-estradiol improved insulin sensitivity, lowered leptinemia, increased some estrogen-regulated liver proteins and the E2/T ratio."
      explanation: The one documented benefit of estrogen administration in this disease.
  evidence:
  - reference: PMID:8090165
    reference_title: "Estrogen resistance caused by a mutation in the estrogen-receptor gene in a man."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient had no detectable response to estrogen administration, despite a 10-fold increase in the serum free estradiol concentration."
    explanation: Refutes estrogen administration as a treatment of the resistance itself in the index case.
  - reference: PMID:40032016
    reference_title: "Novel estrogen receptor-α gene inactivating missense variant in a woman: Therapeutic challenge and long-term follow-up data."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Osteoporosis worsened (Z-score -5.6 at the lumbar spine; Z-score -4.4 at the femoral neck) despite successive treatments with ethinyl-estradiol and tamoxifen (selective estrogen modulator)."
    explanation: >-
      Refutes estrogen administration as treatment of the skeletal disease. The
      same sentence also refutes the selective estrogen receptor modulator
      given after it, which is recorded as its own treatment below.
  - reference: PMID:40032016
    reference_title: "Novel estrogen receptor-α gene inactivating missense variant in a woman: Therapeutic challenge and long-term follow-up data."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, there are no effective therapeutic options."
    explanation: States the therapeutic gap that this treatment record documents.
  - reference: PMID:32152632
    reference_title: "Long-Term Follow-Up and Treatment of a Female With Complete Estrogen Insensitivity."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "DES transactivated the variant ESR1 in vitro."
    explanation: The rationale for the diethylstilbestrol trial, a ligand that activated the patient's variant receptor in a cell assay. Graded INDIRECT because in vitro transactivation is one inference step from a clinical response.
  - reference: PMID:32152632
    reference_title: "Long-Term Follow-Up and Treatment of a Female With Complete Estrogen Insensitivity."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "However, DES treatment did not induce secondary sexual characteristics in our patient."
    explanation: Refutes diethylstilbestrol as treatment even where the variant receptor is activatable in vitro.
  - reference: PMID:27754803
    reference_title: "Familial Multiplicity of Estrogen Insensitivity Associated With a Loss-of-Function ESR1 Mutation."
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "A group of other potential ER activating ligands were tested, but none overcame the estrogen insensitivity in these patients."
    explanation: >-
      Refutes the wider strategy this treatment record tests, not just the two
      agents tried in patients. A panel of alternative receptor-activating
      ligands was screened against the R394H receptor and none restored
      signalling, so the failure is a property of the receptor rather than of
      the particular ligand chosen.
- name: Selective Estrogen Receptor Modulator Therapy
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Tamoxifen was given after ethinyl-estradiol failed in the eight-year
    follow-up, on the rationale that a modulator might engage a receptor that
    estradiol could not. Bone loss continued through it. Recorded separately
    from estrogen administration because a selective modulator is a different
    pharmacological class, not a dose of estrogen.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: tamoxifen
      term:
        id: CHEBI:41774
        label: tamoxifen
  evidence:
  - reference: PMID:40032016
    reference_title: "Novel estrogen receptor-α gene inactivating missense variant in a woman: Therapeutic challenge and long-term follow-up data."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Osteoporosis worsened (Z-score -5.6 at the lumbar spine; Z-score -4.4 at the femoral neck) despite successive treatments with ethinyl-estradiol and tamoxifen (selective estrogen modulator)."
    explanation: >-
      Refutes the selective estrogen receptor modulator as treatment of the
      skeletal disease; bone density fell further while it was given.
- name: Progestin Suppression of Gonadotropin-Driven Ovarian Enlargement
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Norethisterone given to the first female case was temporally associated with
    falling estradiol and with reduction in ovarian volume and cyst number,
    which returned when it was stopped. The progesterone receptor is intact in
    this disease, so progestin feedback can restrain the gonadotropin drive that
    the absent estrogen feedback releases. This is the only reported
    intervention that changes a phenotype here, and it addresses the ovarian
    consequence rather than the receptor defect.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: norethisterone
      term:
        id: CHEBI:7627
        label: norethisterone
  target_mechanisms:
  - target: Loss of Estrogen Negative Feedback on the Gonadotropin Axis
    description: >-
      Progesterone-receptor-mediated negative feedback substitutes for the
      absent estrogen feedback and lowers the gonadotropin drive on the ovary.
    evidence:
    - reference: PMID:23841731
      reference_title: "Delayed puberty and estrogen resistance in a woman with estrogen receptor α variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In addition, the administration of norethindrone was temporally associated with reductions in ovarian volume and number of cysts, which suggests that negative feedback mediated by progesterone receptor was intact.
      explanation: >-
        The authors read the ovarian response as evidence that
        progesterone-receptor-mediated negative feedback was intact, which is
        the mechanism this treatment acts through.
  evidence:
  - reference: PMID:23841731
    reference_title: "Delayed puberty and estrogen resistance in a woman with estrogen receptor α variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, the administration of norethindrone was temporally associated with reductions in ovarian volume and number of cysts, which suggests that negative feedback mediated by progesterone receptor was intact.
    explanation: >-
      A single-patient, uncontrolled observation with an on-and-off course,
      which is why the treatment is recorded as documented rather than
      established.
diagnosis:
- name: ESR1 Sequencing with the High-Estradiol, High-Gonadotropin Profile
  description: >-
    The biochemical signature is markedly elevated estradiol together with
    elevated gonadotropins, which separates receptor resistance from aromatase
    deficiency: in that disease the same high gonadotropins accompany low or
    undetectable estradiol. Estrogen-regulated hepatic binding proteins are not
    raised despite the high estradiol, which is the confirmatory sign that the
    hormone is not being transduced. Diagnosis is completed by ESR1 sequencing,
    which in every reported case shows a homozygous variant.
  presence: Positive in affected individuals
  evidence:
  - reference: PMID:27754803
    reference_title: "Familial Multiplicity of Estrogen Insensitivity Associated With a Loss-of-Function ESR1 Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hormonal evaluation revealed extremely high plasma 17β-estradiol (>50-fold normal range) associated with elevated gonadotropin levels (greater than threefold normal range), highly suggestive of estrogen resistance."
    explanation: >-
      The authors read this combination as the diagnostic signature of estrogen
      resistance, which is what this record is built on.
  - reference: PMID:23841731
    reference_title: "Delayed puberty and estrogen resistance in a woman with estrogen receptor α variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serum levels of corticosteroid-binding globulin, sex-hormone–binding globulin, thyroxine-binding globulin, prolactin, and triglycerides were not increased, despite elevated estrogen levels.
    explanation: >-
      The confirmatory hepatic sign: in any state of true estrogen excess these
      proteins rise, so unchanged levels alongside high estradiol demonstrate
      that the hormone is not being transduced.
  - reference: PMID:39295121
    reference_title: "Estrogen-insensitivity syndrome (EIS) in a female adolescent patient - a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She was found to have a homozygous pathogenic variant in the ESR1 gene located on chromosome 6q25, which interferes with estrogen signaling."
    explanation: Genetic confirmation by ESR1 sequencing in a patient presenting with the profile above.
differential_diagnoses:
- name: Aromatase deficiency
  description: >-
    The ligand-supply counterpart: CYP19A1 loss leaves estradiol low or
    undetectable with high gonadotropins, and the skeletal phenotype of tall
    stature, open epiphyses and osteoporosis overlaps. Estradiol level
    separates the two, and estrogen replacement is effective in aromatase
    deficiency but not here.
  evidence:
  - reference: PMID:11305285
    reference_title: "Aromatase deficiency and estrogen resistance: from molecular genetics to clinic."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Thus far, one estrogen-resistant human, a man with a mutant estrogen receptor-alpha gene, has been described. His clinical presentation was similar to that of aromatase-deficient men."
    explanation: The clinical overlap that makes aromatase deficiency the principal differential.
  - reference: PMID:34538723
    reference_title: "Congenital disorders of estrogen biosynthesis and action."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "Germline loss-of-function variants in ESR1, the gene encoding estrogen receptor α, are known to cause of estrogen insensitivity/resistance."
    explanation: Places the two diseases side by side as the biosynthesis and action arms of congenital estrogen disorders; the sentence is quoted as the source prints it.
  - reference: PMID:9554463
    reference_title: "Pediatric endocrinology update: an overview. The essential roles of estrogens in pubertal growth, epiphyseal fusion and bone turnover: lessons from mutations in the genes for aromatase and the estrogen receptor."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Gonadotropin and androgen levels are elevated in patients with either estrogen deficiency (aromatase deficiency) or estrogen resistance (estrogen receptor mutation)."
    explanation: The shared gonadotropin elevation; estradiol, low in one and high in the other, is what separates them.
- name: ESR2-related estrogen resistance with ovarian dysgenesis
  description: >-
    A dominant-negative ESR2 variant produced complete lack of estrogen action
    with absent breast development, primary amenorrhea and osteoporosis, but
    with streak gonads, which ESR1-deficient patients do not have. It is a
    separate gene and a separate entity.
  evidence:
  - reference: PMID:30113650
    reference_title: "Early-Onset Complete Ovarian Failure and Lack of Puberty in a Woman With Mutated Estrogen Receptor β (ESR2)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, her gonads were clearly abnormal (streak), a finding not observed in ESR1-deficient patients."
    explanation: The distinguishing feature stated by the authors.
notes: >-
  Do not read "ESR1 mutation" here as the breast cancer finding of the same
  name. The two are opposite lesions in one gene: the germline biallelic
  variants that cause this syndrome disable the receptor, while the somatic
  ESR1 variants that emerge under endocrine therapy in breast cancer activate
  it without ligand. PMID:42734155, cited on the receptor-signalling node
  below, is the review that sets the two side by side. The practical
  consequence for curation is that a literature search on the gene symbol
  alone returns mostly the breast cancer variants, so searches for this
  disease need the syndrome name or the insensitivity phrasing.

  No GeneReviews chapter exists for this disease; PubMed returns no chapter for
  estrogen resistance or estrogen in the title within the GeneReviews book. The
  entry is built from the primary case reports and the receptor's functional
  literature. Orphanet:785 is cross-referenced by the MONDO class but is not in
  the pre-cached Orphadata leaf set, so no Orphanet row is quoted here.

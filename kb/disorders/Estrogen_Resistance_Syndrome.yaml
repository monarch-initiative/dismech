treatments:
- name: Estrogen Pharmacotherapy
  description: >-
    Estrogen replacement is ineffective by mechanism. The receptor cannot
    transduce the signal, so raising the ligand concentration does not restore
    estrogen action, and reported patients have not responded to it. Candidate
    alternative receptor ligands have been screened without success. This entry
    records the treatment as attempted and ineffective rather than as standard
    care.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: estradiol
      term:
        id: CHEBI:23965
        label: estradiol
  evidence:
  - reference: PMID:8090165
    reference_title: "Estrogen resistance caused by a mutation in the estrogen-receptor gene in a man."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient had no detectable response to estrogen administration, despite a 10-fold increase in the serum free estradiol concentration."
    explanation: Refutes estrogen replacement as effective therapy in this syndrome; the ligand reaches the tissue and nothing happens.
  - reference: PMID:27754803
    reference_title: "Familial Multiplicity of Estrogen Insensitivity Associated With a Loss-of-Function ESR1 Mutation."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "A group of other potential ER activating ligands were tested, but none overcame the estrogen insensitivity in these patients."
    explanation: Alternative receptor-activating ligands were screened and none restored signalling, so the failure is not specific to estradiol.
notes: >-
  No GeneReviews or StatPearls chapter names this disease; `just
  check-genereviews --online` returns NO_CHAPTER against the 2026-09-10
  Bookshelf index with the four MONDO synonyms present in this entry.

  Do not read "ESR1 mutation" here as the breast cancer finding of the same
  name. The two are opposite lesions in one gene: germline biallelic
  loss-of-function variants cause this syndrome by disabling the receptor,
  whereas the somatic ESR1 variants that emerge under endocrine therapy in
  breast cancer activate it without ligand. A literature search on the gene
  symbol alone returns mostly the latter.

  MONDO:0014148 cross-references OMIM:615363, the phenotype record. OMIM:133430
  is the ESR1 gene record and is not this disease; a MONDO lookup keyed on it
  returns nothing.

  The estrogen-insensitive state is a resistance syndrome, not a deficiency.
  Aromatase deficiency is the ligand-supply counterpart, with an intact receptor
  and absent estrogen, and is curated separately.

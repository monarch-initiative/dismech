name: Estrogen Resistance Syndrome
creation_date: "2026-09-29T20:30:00Z"
description: >-
  Estrogen resistance syndrome is a rare autosomal recessive endocrine disorder
  caused by biallelic loss-of-function variants in ESR1, the gene encoding
  estrogen receptor alpha. The receptor cannot transduce estrogen at
  physiological concentrations, so estradiol and gonadotropins are markedly
  elevated while estrogen action is absent or severely reduced in bone, the
  reproductive tract and metabolic tissues. The truncating allele abolishes the
  receptor; the ligand-binding-domain alleles leave one that still responds,
  but only far above the physiological estradiol range. Affected individuals of
  both sexes show delayed bone maturation, persistently open epiphyses and
  osteoporosis with increased bone turnover. Most reported patients grow
  continuously into adulthood and are tall, but not all: the first female
  reported lacked the pubertal growth spurt and stayed below the 50th height
  percentile. Affected females lack breast development and present with primary
  amenorrhea, a small uterus and enlarged multicystic ovaries; the index male
  was normally masculinized. Impaired glucose tolerance, hyperinsulinemia and
  acanthosis nigricans are reported in some patients and absent in others. Estrogen administration
  does not reverse the skeletal phenotype. Six families have been reported in
  the sources cited here. The disease is distinct from aromatase deficiency, a CYP19A1
  ligand-supply defect in which estradiol is low rather than high.
synonyms:
- estrogen resistance
- ESTRR
- oestrogen insensitivity
- oestrogen resistance
- estrogen insensitivity syndrome
- EIS
category: Mendelian
parents:
- Endocrine Disorder
disease_term:
  preferred_term: estrogen resistance syndrome
  description: >-
    Rare genetic endocrine disease of estrogen receptor insensitivity with
    elevated estrogen and gonadotropin serum levels.
  term:
    id: MONDO:0014148
    label: estrogen resistance syndrome
mappings:
  mondo_mappings:
  - term:
      id: MONDO:0014148
      label: estrogen resistance syndrome
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      The entry and the MONDO class denote the same ESR1-defined entity. MONDO
      cross-references the OMIM phenotype record OMIM:615363 and Orphanet:785;
      OMIM:133430, which the IEMbase comparison note recorded, is the ESR1 gene

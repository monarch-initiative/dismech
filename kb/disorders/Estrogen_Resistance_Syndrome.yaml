animal_models:
- name: Estrogen receptor-null mouse (alphaERKO, insertional disruption of Esr1)
  species: Mouse
  genotype: Esr1 insertional disruption, homozygous
  publication: PMID:8248223
  description: >-
    The first receptor-null mouse. Both sexes survive with normal external
    phenotypes; females are infertile with hypoplastic uteri and hyperemic
    ovaries lacking corpora lutea, and their uteri do not respond to estradiol.
  evidence:
  - reference: PMID:8248223
    reference_title: "Alteration of reproductive function but not prenatal sexual development after insertional disruption of the mouse estrogen receptor gene."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Both male and female animals survive to adulthood with normal gross external phenotypes. Females are infertile; males have a decreased fertility."
    explanation: Viability and the reproductive phenotype of the receptor-null mouse.
  modeled_mechanisms:
  - target: Loss of Estrogen Receptor Signaling in Target Tissues
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      Complete receptor loss with preserved viability and an unresponsive
      reproductive tract, the state the human disease was later shown to share.
    limitations: >-
      Insertional disruption rather than a patient variant; the mouse lacks the
      continued longitudinal growth of humans with open epiphyses, since rodent
      growth plates do not fuse.
    evidence:
    - reference: PMID:8248223
      reference_title: "Alteration of reproductive function but not prenatal sexual development after insertional disruption of the mouse estrogen receptor gene."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We have generated mutant mice lacking responsiveness to estradiol by disrupting the estrogen receptor gene by gene targeting."
      explanation: The model is defined by loss of estradiol responsiveness, which is the node's claim.
    readouts:
    - name: Uterine wet weight response to estradiol
      target: Loss of Estrogen Receptor Signaling in Target Tissues
      direction: ABOLISHED
      interpretation: Tissue-level estrogen responsiveness is absent in the receptor-null animal.
      evidence:
      - reference: PMID:8248223
        reference_title: "Alteration of reproductive function but not prenatal sexual development after insertional disruption of the mouse estrogen receptor gene."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In adult wild-type and heterozygous females, 3-day estradiol treatment at 40 micrograms/kg stimulates a 3- to 4-fold increase in uterine wet weight and alters vaginal cornification, but the uteri and vagina do not respond in the animals with the estrogen receptor gene disruption."
        explanation: The measurement behind the readout.
- name: Esr1-Q375H knock-in mouse (patient variant)
  species: Mouse
  genotype: Esr1 p.Gln375His homozygous, CRISPR/Cas9 knock-in
  publication: PMID:32242619
  description: >-
    A mouse carrying the human Q375H variant. Both sexes are infertile with
    phenotypes resembling the receptor-null mouse and corresponding to the
    patient the variant came from.
  evidence:
  - reference: PMID:32242619
    reference_title: "ESR1 Mutations Associated With Estrogen Insensitivity Syndrome Change Conformation of Ligand-Receptor Complex and Altered Transcriptome Profile."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, we generated a mouse model Esr1-Q harboring the human mutation using CRISPR/Cas9 genome editing."
    explanation: The model's construction from the patient variant.
  modeled_mechanisms:
  - target: ESR1 Loss-of-Function
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      The patient's own missense variant reproduces receptor loss of function in
      vivo rather than by gene deletion.
    limitations: >-
      Reported phenotypes are reproductive; skeletal and metabolic features of
      the human disease are not described in the abstract.
    evidence:
    - reference: PMID:32242619
      reference_title: "ESR1 Mutations Associated With Estrogen Insensitivity Syndrome Change Conformation of Ligand-Receptor Complex and Altered Transcriptome Profile."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Female and male Esr1-Q mice are infertile and have similar phenotypes to αERKO mice."
      explanation: The knock-in phenocopies the receptor-null animal.
    readouts:
    - name: Fertility of homozygous Q375H knock-in mice
      target: ESR1 Loss-of-Function
      direction: ABOLISHED
      interpretation: >-
        Both sexes are infertile, the same outcome as receptor deletion, which
        is what marks the patient's missense allele as a loss of function in

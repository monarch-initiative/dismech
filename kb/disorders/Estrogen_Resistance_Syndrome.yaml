    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient, first seen at the age of 21.3 years, presented with a tall stature (+2.2 SD), a delayed bone age (13 years)."
    explanation: Tall stature with delayed bone age in a female case.
  - reference: PMID:8090165
    reference_title: "Estrogen resistance caused by a mutation in the estrogen-receptor gene in a man."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient was tall (204 cm"
    explanation: >-
      The height of the index male, which the description quotes. Truncated
      before the parenthetical imperial conversion, since bracketed spans are
      stripped before snippet matching.
  - reference: PMID:23841731
    reference_title: "Delayed puberty and estrogen resistance in a woman with estrogen receptor α variant."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Her growth velocity indicated the lack of an estrogen-induced growth spurt at the time of puberty
    explanation: >-
      Refutes tall stature as a constant feature. This proband had no
      estrogen-driven pubertal acceleration and remained below the 50th height
      percentile, which is why the description reports tall stature in most
      patients rather than all.
- name: Absent pubertal growth spurt
  category: Skeletal
  description: >-
    The estrogen-driven acceleration of growth velocity at puberty does not
    occur, which is why continued growth from unfused epiphyses does not always
    produce tall stature.
  phenotype_term:
    preferred_term: Absent pubertal growth spurt
    term:
      id: HP:0031087
      label: Absent pubertal growth spurt
  evidence:
  - reference: PMID:9554463
    reference_title: "Pediatric endocrinology update: an overview. The essential roles of estrogens in pubertal growth, epiphyseal fusion and bone turnover: lessons from mutations in the genes for aromatase and the estrogen receptor."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "However, they lead to absence of the pubertal growth spurt, delayed bone maturation, unfused epiphyses, continued growth into adulthood and very tall adult stature in both sexes."
    explanation: Review synthesis naming the absent growth spurt in both estrogen resistance and aromatase deficiency.
  - reference: PMID:23841731

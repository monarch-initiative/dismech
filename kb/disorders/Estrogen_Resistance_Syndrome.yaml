inheritance:
- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Every reported case is homozygous for its ESR1 variant, and heterozygous
    carriers are unaffected. Parental relatedness is documented in four of the
    reported families; one proband was adopted with no parental samples
    available, and one report does not address it.
  evidence:
  - reference: PMID:27754803
    reference_title: "Familial Multiplicity of Estrogen Insensitivity Associated With a Loss-of-Function ESR1 Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 3 affected patients carried a homozygous mutation of a highly conserved arginine 394 for which histidine was substituted through an autosomal recessive mode of transmission."
    explanation: Three affected siblings homozygous for the same variant, with recessive transmission stated by the authors.
  - reference: PMID:8090165
    reference_title: "Estrogen resistance caused by a mutation in the estrogen-receptor gene in a man."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient's parents were heterozygous carriers of this mutation, and pedigree analysis revealed consanguinity."
    explanation: The index case was homozygous with heterozygous, unaffected parents in a consanguineous pedigree.
  - reference: PMID:18505767
    reference_title: "Impact on bone of an estrogen receptor-alpha gene loss of function mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ER-alpha heterozygosity appears to not impair spine aBMD."
    explanation: Heterozygous carriers in the extended kindred had no detectable skeletal phenotype, consistent with recessive inheritance.
  - reference: PMID:39295121
    reference_title: "Estrogen-insensitivity syndrome (EIS) in a female adolescent patient - a case report."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Estrogen insensitivity syndrome (EIS) is a rare genetic disorder characterized by an autosomal dominant inheritance pattern."
    explanation: >-
      Recorded as REFUTE because this sentence contradicts the recessive
      inheritance every reported case supports, including this report's own
      homozygous proband with related parents. Curated rather than omitted so a
      later curator does not read the claim as unexamined.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Reported cases are counted in families rather than in rates. Five patients
    from three families were known by 2022; the two sisters reported that year,
    an adolescent girl in 2024 and a woman with a ligand-binding-domain variant
    in 2025 bring the cited total to six families. No population estimate
    exists.
  evidence:
  - reference: PMID:35134944
    reference_title: "Estrogen Receptor α Inactivation in 2 Sisters: Different Phenotypic Severities for the Same Pathogenic Variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only 3 females and 2 males, from 3 families, with a loss of ERα function have been reported to date."
    explanation: A literature count at the time of the fourth family's report.
progression:
- phase: Onset
  age_range: Adolescence to young adulthood
  notes: >-
    Females present with absent pubertal breast development and primary
    amenorrhea in adolescence; the index male, normally masculinized, was
    recognised at 28 years from continued linear growth and open epiphyses.
  evidence:
  - reference: PMID:23841731
    reference_title: "Delayed puberty and estrogen resistance in a woman with estrogen receptor α variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We now describe an 18-year-old woman without breast development and with markedly elevated serum levels of estrogens and bilateral multicystic ovaries."
    explanation: Adolescent presentation with failed pubertal development in a female.
  - reference: PMID:8090165
    reference_title: "Estrogen resistance caused by a mutation in the estrogen-receptor gene in a man."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 28-year-old man whose estrogen resistance was caused by a disruptive mutation in the estrogen-receptor gene underwent studies of pituitary-gonadal function and bone density and received transdermal estrogen for six months."
    explanation: The index male was identified in adulthood.
- phase: Course
  age_range: Adulthood
  notes: >-
    Linear growth continues into the third decade and bone mineral density falls
    further despite estrogen or selective estrogen receptor modulator treatment.
  evidence:
  - reference: PMID:40032016
    reference_title: "Novel estrogen receptor-α gene inactivating missense variant in a woman: Therapeutic challenge and long-term follow-up data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient presented a continuous linear growth (height + 3SD at the age of 28.6 years)."
    explanation: Eight-year follow-up documents ongoing growth into the late twenties.
  - reference: PMID:18505767
    reference_title: "Impact on bone of an estrogen receptor-alpha gene loss of function mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Spine aBMD at age 28.5 yr (0.745 g/cm(2)) decreased to 0.684 g/cm(2) (Z score -3.85) in 3.5 yr."
    explanation: Longitudinal bone loss in the index male over three and a half years.
pathophysiology:
- name: ESR1 Loss-of-Function
  biological_scale: MOLECULAR
  description: >-
    Homozygous ESR1 variants abolish or severely reduce the transcriptional
    activity of estrogen receptor alpha. The index variant is a premature stop
    codon at codon 157 that truncates the receptor; the later missense variants
    (Q375H, E385V, R394H, M543T) sit in the ligand-binding domain and impair
    ligand anchoring, coactivator recruitment or nuclear translocation, so the
    receptor is present but cannot drive estrogen-responsive transcription.
  genes:
  - preferred_term: ESR1
    description: >-
      The gene encoding estrogen receptor alpha, the nuclear receptor whose
      biallelic loss defines the disease.
    term:
      id: hgnc:3467
      label: ESR1
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: nuclear estrogen receptor activity
    modifier: LOSS_OF_FUNCTION
    description: >-
      The receptor cannot transduce estradiol into transcriptional output. This
      is a qualitative loss in the receptor's own function rather than a lower
      level of a regulated activity, hence LOSS_OF_FUNCTION rather than
      DECREASED.
    term:
      id: GO:0030284
      label: nuclear estrogen receptor activity
  evidence:
  - reference: PMID:8090165
    reference_title: "Estrogen resistance caused by a mutation in the estrogen-receptor gene in a man."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Direct sequencing of exon 2 revealed a cytosine-to-thymine transition at codon 157 of both alleles, resulting in a premature stop codon."
    explanation: The index lesion, a biallelic truncating variant in the receptor gene.
  - reference: PMID:27754803
    reference_title: "Familial Multiplicity of Estrogen Insensitivity Associated With a Loss-of-Function ESR1 Mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Structural and functional analysis of the mutant ERα revealed strongly reduced transcriptional activity and the inability to securely anchor the activating hormone, estradiol, compared with wild-type ERα."
    explanation: Functional assay of the R394H receptor showing loss of transcriptional activity and of stable ligand anchoring.
  - reference: PMID:32963012
    reference_title: "A mutant form of ERα associated with estrogen insensitivity affects the coupling between ligand binding and coactivator recruitment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The identity of residue 375 greatly affected the sensitivity of the receptor to agonists without changing the ligand binding affinity."
    explanation: The Q375H receptor binds ligand normally but fails to couple binding to coactivator recruitment, a second molecular route to the same loss of function.
  - reference: PMID:35134944
    reference_title: "Estrogen Receptor α Inactivation in 2 Sisters: Different Phenotypic Severities for the Same Pathogenic Variant."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The transient expression of ERα-E385V in HEK293A and MDA-MB231 cells revealed highly impaired ERE-dependent transcriptional activation by E2."
    explanation: A third variant, E385V, with impaired estrogen-response-element transcription in cell assays.
  downstream:
  - target: Loss of Estrogen Receptor Signaling in Target Tissues
    causal_link_type: DIRECT
    description: >-
      A receptor that cannot drive estrogen-responsive transcription leaves
      every estrogen-dependent tissue unresponsive to circulating estradiol.
    evidence:
    - reference: PMID:32242619
      reference_title: "ESR1 Mutations Associated With Estrogen Insensitivity Syndrome Change Conformation of Ligand-Receptor Complex and Altered Transcriptome Profile."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Comparison of the transcriptome and deoxyribonucleic acid methylome from stable cell lines of both Q375H and R394H clinical mutants shows a differential profile compared with wild-type ERα, resulting in loss of estrogen responsiveness."
      explanation: Links the two patient variants to loss of the estrogen-responsive transcriptome.
- name: Loss of Estrogen Receptor Signaling in Target Tissues
  biological_scale: CELLULAR
  description: >-
    Cells in bone, the reproductive tract, the hypothalamic-pituitary axis and
    metabolic tissues receive abundant estradiol but mount no transcriptional
    response to it. The state is the mirror image of aromatase deficiency: the
    ligand is present in excess and the response is absent.
  biological_processes:
  - preferred_term: estrogen receptor signaling pathway
    modifier: DECREASED
    description: >-
      DECREASED rather than ABSENT because the hypomorphic ligand-binding-domain
      alleles retain measurable signalling at supraphysiological estradiol: the
      Q375H receptor's half-maximal concentration is 240-fold that of the
      wild-type receptor rather than unattainable, and a partially compensating
      route is invoked for the E385V sisters.
    term:
      id: GO:0030520
      label: estrogen receptor signaling pathway
  - preferred_term: cellular response to estradiol stimulus
    modifier: DECREASED
    term:
      id: GO:0071392
      label: cellular response to estradiol stimulus
  evidence:
  - reference: PMID:8090165
    reference_title: "Estrogen resistance caused by a mutation in the estrogen-receptor gene in a man."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient had no detectable response to estrogen administration, despite a 10-fold increase in the serum free estradiol concentration."
    explanation: Direct clinical demonstration that target tissues do not respond to estrogen even at supraphysiological exposure.
  - reference: PMID:42734155
    reference_title: "Estrogen insensitivity syndrome: the 'Upside Down' of ESR1 mutations."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: "In contrast, germline ESR1 mutations cause EIS by impairing ERα function and rendering peripheral tissues insensitive to circulating E2."
    explanation: Review statement of the tissue-level consequence of germline receptor loss, contrasted with somatic activating mutations in breast cancer.
  downstream:
  - target: Loss of Estrogen Negative Feedback on the Gonadotropin Axis
    causal_link_type: DIRECT
    description: >-
      Hypothalamic and pituitary cells cannot register estradiol, so the
      negative feedback that normally restrains gonadotropin release is lost.
  - target: Failure of Epiphyseal Fusion
    causal_link_type: DIRECT
    description: >-
      Growth plate cells cannot execute the estrogen-dependent program of
      pubertal maturation and epiphyseal fusion.
  - target: Increased Bone Resorption with Failed Mineral Accrual
    causal_link_type: DIRECT
    description: >-
      Bone cells lose the estrogen restraint on resorption and the support for
      mineral accrual.
  - target: Failure of Estrogen-Dependent Female Reproductive Development
    causal_link_type: DIRECT
    description: >-
      Mammary, uterine and ovarian tissue cannot respond to the estradiol that
      would normally drive pubertal development.
  - target: Insulin Resistance and Metabolic Dysregulation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of estrogen receptor alpha action in metabolic tissues is followed by
      impaired glucose tolerance and hyperinsulinemia in some patients. The path
      is not established: the phenotype is absent in at least one proband, and
      exogenous estrogen improves insulin sensitivity in a patient whose
      skeleton does not respond, so a residual estrogen-responsive route in
      metabolic tissue is likely and unmapped.
- name: Loss of Estrogen Negative Feedback on the Gonadotropin Axis
  biological_scale: ORGANISM
  description: >-
    Without receptor-mediated estrogen feedback, follicle-stimulating and
    luteinizing hormone secretion is disinhibited. Gonadotropins rise, the
    gonads are driven to produce estradiol, and estradiol accumulates to many
    times the normal range because nothing downstream registers it. In females
    the sustained gonadotropin drive produces enlarged multicystic ovaries.
  biological_processes:
  - preferred_term: negative regulation of gonadotropin secretion
    modifier: ABSENT
    term:
      id: GO:0032277
      label: negative regulation of gonadotropin secretion
  - preferred_term: gonadotropin secretion
    modifier: INCREASED
    term:
      id: GO:0032274
      label: gonadotropin secretion
  chemical_entities:
  - preferred_term: estradiol
    modifier: INCREASED
    term:
      id: CHEBI:23965
      label: estradiol
  locations:
  - preferred_term: hypothalamus
    term:
      id: UBERON:0001898
      label: hypothalamus
  - preferred_term: pituitary gland
    term:
      id: UBERON:0000007
      label: pituitary gland
  evidence:
  - reference: PMID:8090165
    reference_title: "Estrogen resistance caused by a mutation in the estrogen-receptor gene in a man."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum estradiol and estrone concentrations were elevated, and serum testosterone concentrations were normal. Serum follicle-stimulating hormone and luteinizing hormone concentrations were increased."
    explanation: The defining endocrine signature in the index male, high estrogens with high gonadotropins and normal testosterone.
  - reference: PMID:27754803
    reference_title: "Familial Multiplicity of Estrogen Insensitivity Associated With a Loss-of-Function ESR1 Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hormonal evaluation revealed extremely high plasma 17β-estradiol (>50-fold normal range) associated with elevated gonadotropin levels (greater than threefold normal range), highly suggestive of estrogen resistance."
    explanation: Quantifies the estradiol and gonadotropin elevation across three siblings.
  - reference: PMID:32152632
    reference_title: "Long-Term Follow-Up and Treatment of a Female With Complete Estrogen Insensitivity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Luteinizing hormone (LH) pulse studies demonstrated normal pulsatile LH secretion, elevated mean LH, and mildly elevated mean follicle-stimulating hormone (FSH) in the presence of markedly increased estrogens."
    explanation: Pulse studies show the axis is intact in pattern and raised in level, which is what loss of feedback rather than a hypothalamic lesion predicts.
  downstream:
  - target: Elevated circulating follicle stimulating hormone level
    description: Disinhibited FSH secretion.
  - target: Elevated circulating luteinizing hormone level
    description: Disinhibited LH secretion.
  - target: Increased serum estradiol
    description: Gonadotropin-driven estradiol production that nothing downstream registers.
  - target: Enlarged polycystic ovaries
    causal_link_type: DIRECT
    description: >-
      Unrestrained gonadotropin stimulation of ovaries that cannot respond to
      their own estradiol produces enlarged multicystic ovaries. This is the
      ovarian arm, distinct from the receptor's direct failure in breast and
      uterus, which reaches those tissues without passing through the
      gonadotropin axis.
    evidence:
    - reference: PMID:27754803
      reference_title: "Familial Multiplicity of Estrogen Insensitivity Associated With a Loss-of-Function ESR1 Mutation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The 2 sisters had enlarged multicystic ovaries."
      explanation: >-
        The ovarian phenotype in the two sisters whose gonadotropins the same
        report puts above threefold the normal range, which is the drive this
        edge carries.
    - reference: PMID:8248223
      reference_title: "Alteration of reproductive function but not prenatal sexual development after insertional disruption of the mouse estrogen receptor gene."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Females have hypoplastic uteri and hyperemic ovaries with no detectable corpora lutea."
      explanation: The receptor-null mouse reproduces the ovarian consequence; graded INDIRECT because it is the mouse orthologue rather than a patient observation.
- name: Failure of Epiphyseal Fusion
  biological_scale: TISSUE
  description: >-
    Estrogen acting through estrogen receptor alpha drives growth plate
    maturation and epiphyseal fusion at puberty. Without receptor signalling
    bone age lags chronological age by years and the epiphyses stay open, so
    linear growth continues into adulthood in most reported patients. The
    pubertal growth spurt itself is estrogen-driven and is absent, which is why
    continued growth does not always produce tall stature.
  cell_types:
  - preferred_term: growth plate chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: growth plate cartilage development
    modifier: ABNORMAL
    term:
      id: GO:0003417
      label: growth plate cartilage development
  locations:
  - preferred_term: epiphyseal plate
    term:
      id: UBERON:0002516
      label: epiphyseal plate
  evidence:
  - reference: PMID:8090165
    reference_title: "Estrogen resistance caused by a mutation in the estrogen-receptor gene in a man."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "had incomplete epiphyseal closure, with a history of continued linear growth into adulthood despite otherwise normal pubertal development."
    explanation: Open epiphyses and continued growth in an adult male with the receptor lesion.
  - reference: PMID:9554463
    reference_title: "Pediatric endocrinology update: an overview. The essential roles of estrogens in pubertal growth, epiphyseal fusion and bone turnover: lessons from mutations in the genes for aromatase and the estrogen receptor."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "However, they lead to absence of the pubertal growth spurt, delayed bone maturation, unfused epiphyses, continued growth into adulthood and very tall adult stature in both sexes."
    explanation: >-
      Review synthesis of the growth-plate consequence shared by estrogen
      resistance and aromatase deficiency, which places the lesion in estrogen
      action on the epiphysis.
  - reference: PMID:18505767
    reference_title: "Impact on bone of an estrogen receptor-alpha gene loss of function mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bone age advanced from 15-17.5 yr."
    explanation: >-
      Bone age in the index male remained in the mid-teens across a follow-up
      spanning his late twenties to early thirties.
  downstream:
  - target: Tall stature
    description: Continued linear growth from unfused epiphyses in most reported patients.
  - target: Delayed skeletal maturation
    description: Bone age lags chronological age by years.
  - target: Absent pubertal growth spurt
    description: The estrogen-driven pubertal acceleration of growth velocity does not occur.
- name: Increased Bone Resorption with Failed Mineral Accrual
  biological_scale: TISSUE
  description: >-
    Estrogen receptor alpha signalling restrains osteoclastic resorption and
    supports mineral accrual. Without it, trabecular and cortical bone are
    markedly undermineralized with a high-turnover signature on biopsy and
    raised turnover markers, and bone density continues to fall in adulthood
    despite estrogen or selective estrogen receptor modulator treatment.
    Periosteal circumference is spared.
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: bone resorption
    modifier: INCREASED
    term:
      id: GO:0045453
      label: bone resorption
  - preferred_term: bone mineralization
    modifier: DECREASED
    term:
      id: GO:0030282
      label: bone mineralization
  evidence:
  - reference: PMID:8090165
    reference_title: "Estrogen resistance caused by a mutation in the estrogen-receptor gene in a man."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The bone mineral density of the lumbar spine was 0.745 g per square centimeter, 3.1 SD below the mean for age-matched normal women; there was biochemical evidence of increased bone turnover."
    explanation: Undermineralized bone with a high-turnover signature.
  - reference: PMID:18505767
    reference_title: "Impact on bone of an estrogen receptor-alpha gene loss of function mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygous ER-alpha disruption markedly affects bone growth, mineral content, and structure but not periosteal circumference."
    explanation: >-
      Bone biopsy and quantitative computed tomography of the index case define
      the skeletal lesion and its one spared compartment.
  - reference: PMID:40032016
    reference_title: "Novel estrogen receptor-α gene inactivating missense variant in a woman: Therapeutic challenge and long-term follow-up data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Markers of bone turnover were increased and unresponsive to treatment."
    explanation: >-
      The same high-turnover skeletal state in a female with a
      ligand-binding-domain variant, unchanged by estrogen or tamoxifen.
  - reference: PMID:23841731
    reference_title: "Delayed puberty and estrogen resistance in a woman with estrogen receptor α variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Levels of both osteocalcin and C-telopeptide were elevated, suggesting increased bone turnover.
    explanation: >-
      Bone formation and resorption markers both elevated in the Q375H proband,
      which is the biochemical form of the high-turnover state this node names.
  downstream:
  - target: Osteoporosis
    description: Undermineralized, high-turnover bone.
- name: Failure of Estrogen-Dependent Female Reproductive Development
  biological_scale: TISSUE
  description: >-
    Breast development and uterine growth at puberty require estrogen receptor
    alpha, so affected females have no breast development, a small uterus and
    primary amenorrhea despite very high estradiol. This node is the receptor's
    direct failure in those target tissues. The ovarian enlargement of this
    disease is a separate mechanism and hangs off the gonadotropin-feedback
    node instead, because it is driven by unopposed gonadotropins rather than
    by the missing estrogen signal in the ovary.
  biological_processes:
  - preferred_term: mammary gland development
    modifier: ABSENT
    term:
      id: GO:0030879
      label: mammary gland development
  locations:
  - preferred_term: mammary gland
    term:
      id: UBERON:0001911
      label: mammary gland
  - preferred_term: uterus
    term:
      id: UBERON:0000995
      label: uterus
  evidence:
  - reference: PMID:23841731
    reference_title: "Delayed puberty and estrogen resistance in a woman with estrogen receptor α variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case shows that disruption of ESR1 causes profound estrogen resistance in women."
    explanation: The first female case establishes the reproductive phenotype as a consequence of ESR1 disruption.
  - reference: PMID:39295121
    reference_title: "Estrogen-insensitivity syndrome (EIS) in a female adolescent patient - a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, the case of a 13-year-old girl, with high estrogen and gonadotropin concentrations, lack of breast development, uterine growth and delayed bone age is described."
    explanation: >-
      Breast and uterine failure together in one patient, which is the pair of
      target tissues this node is now scoped to.
  downstream:
  - target: Breast aplasia
    description: No pubertal breast development despite high estradiol.
  - target: Primary amenorrhea
    description: No menarche.
  - target: Hypoplasia of the uterus
    description: Loss of the estrogen drive on uterine growth.
  - target: Delayed puberty
    description: Failure to enter estrogen-dependent puberty in females.
- name: Insulin Resistance and Metabolic Dysregulation
  biological_scale: ORGANISM
  description: >-
    Loss of estrogen receptor alpha action is accompanied by impaired glucose
    tolerance, hyperinsulinemia, reduced insulin sensitivity, raised leptin and
    axillary acanthosis nigricans. Exogenous ethinyl-estradiol improved insulin
    sensitivity in one long-term follow-up even though it did not help bone,
    suggesting a residual estrogen-responsive route in metabolic tissue that is
    absent in the skeleton.
  biological_processes:
  - preferred_term: cellular response to insulin stimulus
    modifier: DECREASED
    term:
      id: GO:0032869
      label: cellular response to insulin stimulus
  evidence:
  - reference: PMID:8090165
    reference_title: "Estrogen resistance caused by a mutation in the estrogen-receptor gene in a man."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Glucose tolerance was impaired, and hyperinsulinemia was present."
    explanation: The metabolic phenotype in the index case.
  - reference: PMID:40032016
    reference_title: "Novel estrogen receptor-α gene inactivating missense variant in a woman: Therapeutic challenge and long-term follow-up data."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The metabolic phenotype included insulin resistance, decreased insulin sensitivity and increased leptinemia."
    explanation: The same metabolic picture in a female case with eight years of follow-up.
  - reference: PMID:23841731
    reference_title: "Delayed puberty and estrogen resistance in a woman with estrogen receptor α variant."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our patient had normal levels of fasting glucose, insulin, and glycated hemoglobin and a normal HOMA-IR, indicating no impaired glucose tolerance.
    explanation: >-
      Refutes the metabolic phenotype as a constant feature. The Q375H proband
      had normal fasting glucose, insulin, glycated hemoglobin and insulin
      resistance index, which is why the node and the entry description report
      it in some patients rather than all.

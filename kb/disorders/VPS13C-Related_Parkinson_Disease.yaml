name: VPS13C-Related Parkinson Disease
creation_date: "2026-11-20T00:45:00Z"
category: Mendelian
description: >-
  VPS13C-related Parkinson disease (PARK23; autosomal recessive early-onset
  Parkinson disease 23) is an autosomal-recessive, early-onset parkinsonism
  caused by biallelic truncating variants in VPS13C. VPS13C is a large
  lipid-transfer protein that bridges the endoplasmic reticulum to other
  organelles at membrane contact sites and partly localizes to the outer
  mitochondrial membrane; loss of its function lowers the mitochondrial membrane
  potential, fragments mitochondria and exacerbates PINK1/parkin-dependent
  mitophagy. This places the disease on the mitochondrial / mitophagy arm of
  Parkinson pathophysiology alongside PRKN and PINK1, rather than on the
  presynaptic endocytic arm of SYNJ1 and DNAJC6. The phenotype is distinctive:
  rapid and severe progression with early cognitive decline, and the neuropathology
  is reminiscent of diffuse Lewy body disease.

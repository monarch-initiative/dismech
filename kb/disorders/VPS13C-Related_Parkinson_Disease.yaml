name: VPS13C-Related Parkinson Disease
creation_date: "2026-11-20T00:45:00Z"
category: Mendelian
description: >-
  VPS13C-related Parkinson disease (PARK23; autosomal recessive early-onset
  Parkinson disease 23) is an autosomal-recessive, early-onset parkinsonism
  caused by biallelic truncating variants in VPS13C. VPS13C is a large
  lipid-transfer protein that bridges the endoplasmic reticulum to other
  organelles at membrane contact sites, principally to late
  endosomes/lysosomes. Its loss has two complementary consequences: a
  mitochondrial limb (lower mitochondrial membrane potential, mitochondrial
  fragmentation and exacerbated PINK1/parkin-dependent mitophagy) that places
  the disease alongside PRKN and PINK1 rather than on the presynaptic endocytic
  arm of SYNJ1 and DNAJC6, and an endolysosomal limb (lysosomes accumulating
  with an altered lipid profile and activation of the mtDNA-dependent cGAS-STING
  innate-immune pathway). The phenotype is distinctive — rapid and severe
  progression with early cognitive decline — and the neuropathology is diffuse
  Lewy body disease, making VPS13C disease a genetic alpha-synucleinopathy.
parents:
- Movement Disorder
- Autosomal Recessive Early-Onset Parkinsonism
synonyms:

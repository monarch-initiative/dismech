pathophysiology:
- name: VPS13C Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The root lesion is biallelic loss of VPS13C, which encodes a large
    lipid-transfer protein of the VPS13 family that mediates bulk transfer of
    glycerophospholipids between the endoplasmic reticulum and apposed
    organelle membranes at membrane contact sites, and partly localizes to the
    outer mitochondrial membrane. The causal alleles are truncating, consistent
    with loss of function.

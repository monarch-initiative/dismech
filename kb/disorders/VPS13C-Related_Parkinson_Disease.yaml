      snippet: "exacerbated PINK1/Parkin-dependent mitophagy, and transcriptional upregulation of PARK2 in response to mitochondrial damage"
      explanation: The depolarized mitochondria drive exacerbated PINK1/parkin mitophagy, the next node.
  - target: Nigrostriatal Dopaminergic Neurodegeneration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Chronic mitochondrial dysfunction in dopaminergic neurons drives their degeneration, as in the other mitochondrial recessive parkinsonisms.

- name: Lysosomal Lipid Homeostasis Failure
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Because VPS13C is the lipid-transfer protein at ER-late endosome/lysosome
    contact sites, its loss disrupts lysosomal lipid delivery: lysosomes
    accumulate with an altered lipid profile, including di-22:6-BMP, a lipid
    biomarker shared with the LRRK2 G2019S form of Parkinson disease. This is
    the endolysosomal limb of VPS13C disease, complementary to the mitochondrial
    limb.
  biological_processes:
  - preferred_term: phospholipid homeostasis
    term:
      id: GO:0055091
      label: phospholipid homeostasis
    modifier: DECREASED
  evidence:
  - reference: PMID:35657605
    reference_title: "ER-lysosome lipid transfer protein VPS13C/PARK23 prevents aberrant mtDNA-dependent STING signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "VPS13C encodes a lipid transfer protein localized to contact sites between the ER and late endosomes/lysosomes"
    explanation: Establishes the ER-lysosome lipid-transfer role whose loss produces this lysosomal defect.
  - reference: PMID:35657605
    reference_title: "ER-lysosome lipid transfer protein VPS13C/PARK23 prevents aberrant mtDNA-dependent STING signaling."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "di-22:6-BMP, a biomarker of the PD-associated leucine-rich repeat kinase 2 (LRRK2) G2019S mutation"
    explanation: The altered lysosomal lipid (di-22:6-BMP) links VPS13C loss to a shared PD lysosomal-lipid signature.
  downstream:
  - target: mtDNA-Dependent cGAS-STING Innate Immune Activation
    causal_link_type: DIRECT
    description: Lysosomal dysfunction (with mitochondrial damage) leaves cytosolic mitochondrial DNA uncleared and blocks lysosome-dependent degradation of activated STING, activating the cGAS-STING innate-immune pathway.
    evidence:
    - reference: PMID:35657605
      reference_title: "ER-lysosome lipid transfer protein VPS13C/PARK23 prevents aberrant mtDNA-dependent STING signaling."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "This activation results from a combination of elevated mitochondrial DNA in the cytosol and a defect in the degradation of activated STING, a lysosome-dependent process."
      explanation: Mechanism linking the lysosomal defect to the cGAS-STING activation of the next node.
- name: mtDNA-Dependent cGAS-STING Innate Immune Activation
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    VPS13C depletion activates the DNA-sensing cGAS-STING innate-immune pathway,
    driven by elevated cytosolic mitochondrial DNA together with a failure to
    degrade activated STING. cGAS-STING has been implicated in Parkinson
    pathogenesis, so this is a candidate neuroinflammatory contributor to
    degeneration; the evidence is from a human cell model, not yet confirmed in
    VPS13C patient dopaminergic neurons.

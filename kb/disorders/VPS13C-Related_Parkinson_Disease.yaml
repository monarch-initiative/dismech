pathophysiology:
- name: VPS13C Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The root lesion is biallelic loss of VPS13C, which encodes a large
    lipid-transfer protein of the VPS13 family that mediates bulk transfer of
    glycerophospholipids between the endoplasmic reticulum and apposed organelle
    membranes at membrane contact sites. VPS13C tethers the ER principally to
    late endosomes/lysosomes (and to lipid droplets); an early cell-model report
    also found partial localization to the outer mitochondrial membrane. The
    causal alleles are truncating, consistent with loss of function.
  genes:
  - preferred_term: VPS13C
    term:
      id: hgnc:23594
      label: VPS13C
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic (homozygous or compound-heterozygous) truncating VPS13C
      variants in consanguineous and isolated early-onset parkinsonism cases.
  molecular_functions:
  - preferred_term: phospholipid transfer activity
    term:
      id: GO:0120014
      label: phospholipid transfer activity
    modifier: DECREASED
  evidence:
  - reference: PMID:26942284
    reference_title: "Loss of VPS13C Function in Autosomal-Recessive Parkinsonism Causes Mitochondrial Dysfunction and Increases PINK1/Parkin-Dependent Mitophagy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This work suggests that loss of function of VPS13C is a cause of autosomal-recessive early-onset parkinsonism with a distinctive phenotype of rapid and severe progression."
    explanation: Establishes biallelic VPS13C loss of function as the root cause of PARK23.
  - reference: PMID:26942284
    reference_title: "Loss of VPS13C Function in Autosomal-Recessive Parkinsonism Causes Mitochondrial Dysfunction and Increases PINK1/Parkin-Dependent Mitophagy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In cell models, VPS13C partly localized to the outer membrane of mitochondria."
    explanation: Localizes VPS13C to the outer mitochondrial membrane, the basis for its mitochondrial role.
  - reference: PMID:30093493
    reference_title: "VPS13A and VPS13C are lipid transport proteins differentially localized at ER contact sites."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "human VPS13A and VPS13C bind to the ER, tethering it to mitochondria (VPS13A), to late endosome/lysosomes (VPS13C), and to lipid droplets (both VPS13A and VPS13C)"
    explanation: Establishes VPS13C as an ER-to-late-endosome/lysosome (and lipid-droplet) tether, the contact-site identity of the lost protein.
  - reference: PMID:30093493
    reference_title: "VPS13A and VPS13C are lipid transport proteins differentially localized at ER contact sites."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These findings identify VPS13 as a lipid transporter between the ER and other organelles, implicating defects in membrane lipid homeostasis in neurological disorders resulting from their mutations."
    explanation: Identifies the lost phospholipid-transfer activity and ties its loss to membrane lipid-homeostasis defects.
  downstream:
  - target: Mitochondrial Dysfunction
    causal_link_type: DIRECT
    description: >-
      Loss of VPS13C lowers the mitochondrial membrane potential and fragments the
      mitochondrial network. VPS13C is partly present on the outer mitochondrial
      membrane but its principal contact site is ER-lysosome (VPS13A, not VPS13C,
      is the ER-mitochondria tether), so the route from the lysosomal contact site
      to this mitochondrial defect is not fully resolved.
    evidence:
    - reference: PMID:26942284
      reference_title: "Loss of VPS13C Function in Autosomal-Recessive Parkinsonism Causes Mitochondrial Dysfunction and Increases PINK1/Parkin-Dependent Mitophagy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Silencing of VPS13C was associated with lower mitochondrial membrane potential, mitochondrial fragmentation, increased respiration rates, exacerbated PINK1/Parkin-dependent mitophagy, and transcriptional upregulation of PARK2 in response to mitochondrial damage."
      explanation: VPS13C silencing lowers membrane potential and fragments mitochondria, the next node.
  - target: Lysosomal Lipid Homeostasis Failure
    causal_link_type: DIRECT
    description: Loss of VPS13C at ER-lysosome contact sites disrupts lysosomal lipid delivery, so lysosomes accumulate with an altered lipid profile.
    evidence:
    - reference: PMID:35657605
      reference_title: "ER-lysosome lipid transfer protein VPS13C/PARK23 prevents aberrant mtDNA-dependent STING signaling."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "depleting VPS13C in HeLa cells causes an accumulation of lysosomes with an altered lipid profile, including an accumulation of di-22:6-BMP"
      explanation: VPS13C depletion produces the lysosomal lipid-homeostasis defect of the next node.
- name: Mitochondrial Dysfunction
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    VPS13C loss lowers the mitochondrial membrane potential and fragments the
    mitochondrial network, with increased respiration rates — a bioenergetic and
    morphological mitochondrial defect shown in VPS13C-depleted cell models.
    This is the mitochondrial mechanism VPS13C shares with PRKN and PINK1, as
    distinct from the presynaptic endocytic mechanism of SYNJ1 and DNAJC6.

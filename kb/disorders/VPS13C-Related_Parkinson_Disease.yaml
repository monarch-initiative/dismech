differential_diagnoses:
- name: PRKN and PINK1 Early-Onset Parkinson Disease
  description: >-
    The common recessive early-onset parkinsonisms on the same mitochondrial /
    mitophagy arm: PRKN (parkin) and PINK1 act in the pathway VPS13C loss
    exaggerates. VPS13C disease is distinguished by its rapid, severe
    progression, early cognitive decline and diffuse Lewy body pathology.
- name: SYNJ1 and DNAJC6 Early-Onset Parkinson Disease
  description: >-
    The presynaptic, endocytic recessive parkinsonisms (PARK20, PARK19), which
    act through synaptic-vesicle endocytosis rather than mitochondrial quality
    control.
- name: VPS13A, VPS13B and VPS13D Disorders
  description: >-
    The other VPS13-family lipid-transfer diseases — chorea-acanthocytosis
    (VPS13A), Cohen syndrome (VPS13B) and the VPS13D movement disorder /
    spastic ataxia — distinct clinical entities caused by loss of paralogous
    membrane-contact-site lipid-transfer proteins.

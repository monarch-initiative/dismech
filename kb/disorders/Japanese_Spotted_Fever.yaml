diagnosis:
- name: qPCR plus immunofluorescence serology for Asian SFG rickettsiosis
  description: >-
    A pan-Asian spotted-fever-group rickettsiosis diagnostic review recommends
    tandem real-time qPCR and immunofluorescence assay, with qPCR more useful
    early before antibodies appear and serology more useful after antibodies are
    detectable.
  diagnosis_term:
    preferred_term: laboratory testing
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  results: >-
    Concordant molecular and serologic testing supports spotted-fever-group
    rickettsiosis confirmation; species-level JSF diagnosis still requires
    R. japonica-specific molecular or serologic interpretation.
  evidence:
  - reference: PMID:31587667
    reference_title: "Diagnosis of spotted fever group Rickettsia infections: the Asian perspective."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      It is likely that the best strategy is to use a real-time quantitative
      polymerase chain reaction (qPCR) and immunofluorescence assay in tandem.
    explanation: >-
      The pan-Asian SFG rickettsiosis review supports combined qPCR and IFA as
      the best currently available diagnostic strategy for Asian SFG infections
      such as JSF.

- name: Clinical suspicion before confirmatory testing
  description: >-
    JSF's fever-rash-eschar presentation is still often confused with other
    syndromes at first presentation, so clinicians in endemic areas must treat
    compatible cases empirically while awaiting confirmation.
  diagnosis_term:
    preferred_term: clinical diagnosis
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  results: >-
    A compatible acute illness after tick exposure in an endemic area should
    trigger suspicion even when JSF-specific laboratory confirmation is not yet
    available.
  evidence:
  - reference: PMID:39477520
    reference_title: "Clinical Characteristics and Risk Factors for Severe Japanese Spotted Fever: A Retrospective Multicenter Study in the Nagasaki Prefecture, Western Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirty-eight (60.3%) patients were initially diagnosed with non-JSF
      conditions.
    explanation: >-
      The multicenter Nagasaki series quantifies frequent initial misdiagnosis,
      supporting a diagnostic section that emphasizes clinical suspicion before
      confirmatory test results.

progression:
- phase: Delayed-treatment severe JSF
  notes: >-
    Longer delays from symptom onset to minocycline initiation increase the risk
    of severe JSF, and delayed initial treatment, advanced age, and male sex
    significantly increase severity risk.
  evidence:
  - reference: PMID:42576956
    reference_title: "Delayed Minocycline Initiation from Symptom Onset and Severe Outcomes in Japanese Spotted Fever: A Single-Center Retrospective Study in Eastern Hiroshima, Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In multivariable analysis, each 1-day delay in minocycline initiation was
      associated with higher odds of severe outcomes (adjusted odds ratio, 1.35;
      95% confidence interval, 1.01-1.81; p = 0.043).
    explanation: >-
      The PCR-confirmed eastern Hiroshima cohort directly links each additional
      onset-to-minocycline day to increased odds of severe outcomes.
  - reference: PMID:39477520
    reference_title: "Clinical Characteristics and Risk Factors for Severe Japanese Spotted Fever: A Retrospective Multicenter Study in the Nagasaki Prefecture, Western Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Delayed initial treatment, advanced age, and male sex significantly
      increase the risk of disease severity.
    explanation: >-
      The multicenter Nagasaki series independently supports delayed treatment
      and demographic factors as severe-JSF risk factors.

treatments:
- name: Early minocycline therapy
  description: >-
    Minocycline is a tetracycline used to treat JSF and should be given early,
    before fulminant illness can progress to shock, DIC, and multiorgan injury;
    fulminant case reports and recommendations describe prompt tetracycline plus
    new-quinolone combination therapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: minocycline
      term:
        id: CHEBI:50694
        label: minocycline
  target_mechanisms:
  - target: Rickettsial Ribosomal Translation (Tetracycline Target)
    treatment_effect: INHIBITS
    description: >-
      Minocycline arrests bacterial protein synthesis through the tetracycline
      class ribosomal target.
  - target: Intracytosolic Rickettsia japonica Niche
    treatment_effect: BYPASSES
    description: >-
      Minocycline can act against R. japonica in its intracellular cytosolic
      compartment.
  evidence:
  - reference: PMID:41341009
    reference_title: Combination of minocycline and ciprofloxacin enhances the inhibitory effect of tumor necrosis factor-alpha production in lipopolysaccharide-stimulated THP-1 monocytic cells.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Tetracyclines, such as minocycline (MINO), are widely used in the
      treatment of infectious diseases. Japanese spotted fever (JSF) is usually
      treated with MINO.
    explanation: >-
      The JSF treatment-model paper states that minocycline is the usual
      tetracycline therapy for Japanese spotted fever.
  - reference: PMID:26630793
    reference_title: "[Intravenous Minocycline and Levofloxacin for Treatment of Two Cases of Japanese Spotted Fever]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      In the treatment of fulminant JSF (body temperature > 39 degrees C) the
      prompt administration of a combination of tetracycline and new quinolone
      has been recommended.
    explanation: >-
      The case report supports prompt tetracycline-containing therapy, with
      fluoroquinolone combination considered for fulminant JSF.

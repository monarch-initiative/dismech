name: Japanese Spotted Fever
creation_date: "2026-09-27T08:33:00Z"
updated_date: "2026-09-27T08:33:00Z"
category: Infectious Disease
description: >-
  Japanese spotted fever is an acute tick-borne spotted-fever-group
  rickettsiosis caused by the obligately intracellular bacterium Rickettsia
  japonica. Infected Haemaphysalis ticks inoculate the organism into skin,
  where local infection can produce an eschar before systemic endothelial
  infection and small-vessel vasculitis drive fever, rash, purpura, hepatic
  enzyme elevation, and occasionally disseminated intravascular coagulation or
  multiorgan failure.

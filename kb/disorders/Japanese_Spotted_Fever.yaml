      reference_title: "Molecular survey of Rickettsia japonica in ticks and wild boars in Ibaraki Prefecture: a newly recognized endemic area of Japanese spotted fever in eastern Japan."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Japanese spotted fever (JSF) is a tick-borne disease caused by
        Rickettsia japonica, a member of the spotted fever group rickettsiae.
      explanation: >-
        The molecular survey frames Japanese spotted fever as a bacterial
        spotted-fever-group rickettsiosis, placing it in Harrison's Infectious
        Diseases Part.

infectious_agent:
- name: Rickettsia japonica
  infectious_agent_term:
    preferred_term: Rickettsia japonica
    term:
      id: NCBITaxon:35790
      label: Rickettsia japonica
  description: >-
    Obligate intracellular spotted-fever-group rickettsial bacterium that causes
    Japanese spotted fever after transmission by infected ticks.
  evidence:
  - reference: PMID:42697132
    reference_title: "Molecular survey of Rickettsia japonica in ticks and wild boars in Ibaraki Prefecture: a newly recognized endemic area of Japanese spotted fever in eastern Japan."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Japanese spotted fever (JSF) is a tick-borne disease caused by Rickettsia
      japonica, a member of the spotted fever group rickettsiae.
    explanation: >-
      The survey identifies R. japonica as the etiologic spotted-fever-group
      rickettsial species for JSF.

transmission:
- name: Haemaphysalis tick bite transmission
  description: >-
    Humans acquire Japanese spotted fever when infected ticks inoculate R.
    japonica during blood feeding; in Ibaraki Prefecture, Haemaphysalis
    hystricis carried R. japonica and wild boars were implicated as hosts that
    can transport infected ticks rather than as proven reservoirs.
  evidence:
  - reference: PMID:42697132
    reference_title: "Molecular survey of Rickettsia japonica in ticks and wild boars in Ibaraki Prefecture: a newly recognized endemic area of Japanese spotted fever in eastern Japan."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These results suggest that H. hystricis is a potential vector of R.
      japonica in Ibaraki Prefecture and that wild boars may potentially
      transport H. hystricis carrying R. japonica.
    explanation: >-
      The tick and wild-boar survey supports H. hystricis as a candidate local
      vector and restricts the wild-boar role to movement of infected ticks.

epidemiology:
- name: Rural agricultural tick exposure in endemic Japan
  description: >-
    Japanese spotted fever occurs in Japanese endemic areas where daily
    activities and agricultural work near vegetation bring residents into
    contact with infected ticks.
  factors:
  - residence near mountains and citrus cultivation
  - agricultural tick exposure
  - endemic Japanese tick exposure
  evidence:
  - reference: PMID:35545515
    reference_title: "[Infectious causes and management of Japanese spotted fever and severe fever thrombocytopenia syndrome in Ehime prefecture]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since 67.0% of the JSF patients resided near the mountains with citrus
      cultivations, there were high chances of contact with ticks during farm
      work or their daily routine even if they did not visit the mountain areas.
    explanation: >-
      The Ehime Prefecture clinical series ties JSF risk to ordinary residential
      or farming exposure near tick habitats in endemic regions.

pathophysiology:
- name: Tick-Borne Rickettsia japonica Inoculation
  role: trigger
  biological_scale: ORGANISM
  description: >-
    Infected ticks inject R. japonica into skin while feeding, seeding the local
    rickettsial infection that can create an eschar and disseminate
    systemically.
  biological_processes:
  - preferred_term: symbiont entry into host
    term:
      id: GO:0044409
      label: symbiont entry into host
  downstream:
  - target: Intracytosolic Rickettsia japonica Niche
    causal_link_type: DIRECT
    description: Tick inoculation delivers R. japonica to intracellular host-cell niches.
  - target: Inoculation Eschar
    causal_link_type: DIRECT
    description: Local dermal infection at the bite site can necrose into an eschar.
  evidence:
  - reference: PMID:42697132
    reference_title: "Molecular survey of Rickettsia japonica in ticks and wild boars in Ibaraki Prefecture: a newly recognized endemic area of Japanese spotted fever in eastern Japan."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Japanese spotted fever (JSF) is a tick-borne disease caused by Rickettsia
      japonica, a member of the spotted fever group rickettsiae.
    explanation: >-
      The study states that JSF is transmitted by ticks and caused by R.
      japonica, supporting infected-tick inoculation as the initiating exposure.

- name: Intracytosolic Rickettsia japonica Niche
  role: intrinsic_resistance
  conforms_to: >-
    intracellular_pathogen_persistence#Intracellular Niche and Beta-Lactam
    Exclusion
  biological_scale: CELLULAR
  description: >-
    R. japonica, like other spotted-fever-group rickettsiae, occupies the
    host-cell cytosol and depends on intracellular access to host metabolites,
    creating a need for cell-penetrant therapy.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: biological process involved in interaction with host
    term:
      id: GO:0051701
      label: biological process involved in interaction with host
  downstream:
  - target: Rickettsial Ribosomal Translation (Tetracycline Target)
    causal_link_type: DIRECT
    description: >-
      Intracellular R. japonica remains dependent on bacterial ribosomal protein
      synthesis.
  - target: Small-Vessel Vasculitis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Disseminated endothelial infection produces vasculitic tissue injury.
  evidence:
  - reference: PMID:30148688
    reference_title: "Pathogenesis of Rickettsial Diseases: Pathogenic and Immune Mechanisms of an Endotheliotropic Infection."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Residing free in the cytosol of the host cell, they acquire many
      necessary components via transport mechanisms instead of maintaining genes
      for synthesizing sugars, lipids, nucleotides, and amino acids.
    explanation: >-
      The rickettsial pathogenesis review supports the free cytosolic niche for
      Rickettsia species and the shared intracellular-pathogen persistence
      module.

- name: Rickettsial Ribosomal Translation (Tetracycline Target)
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  biological_scale: MOLECULAR
  description: >-
    R. japonica depends on bacterial ribosomal translation; tetracyclines such
    as minocycline inhibit the bacterial 30S ribosomal subunit and thereby
    arrest rickettsial protein synthesis.
  biological_processes:
  - preferred_term: Translation
    term:
      id: GO:0006412
      label: translation
  - preferred_term: response to antibiotic
    term:
      id: GO:0046677
      label: response to antibiotic
  evidence:
  - reference: PMID:24336183
    reference_title: Ribosome-targeting antibiotics and mechanisms of bacterial resistance.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The ribosome is one of the main antibiotic targets in the bacterial cell.
    explanation: >-
      Review evidence establishes the bacterial ribosome as the conserved target
      class for protein-synthesis inhibitors; the JSF treatment evidence below
      establishes minocycline use.

- name: Small-Vessel Vasculitis
  role: vascular_response
  biological_scale: TISSUE
  description: >-
    Systemic rickettsial spread injures the vascular endothelium and triggers
    small-vessel vasculitis, producing rash and purpura and marking severe
    pulmonary or multiorgan disease when it is widespread.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0002139
      label: endothelial cell of vascular tree
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  downstream:
  - target: Skin Rash
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Cutaneous microvascular inflammation contributes to the exanthem.
  - target: Purpura
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Vasculitic vascular injury permits purpuric hemorrhage into skin.
  - target: Hypercytokinemic Shock Response
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Disseminated endothelial inflammation amplifies systemic cytokine release.
  - target: Vasculitic Multiorgan Injury
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Widespread small-vessel injury can extend into renal, pulmonary, and hepatic organ injury.
  evidence:
  - reference: PMID:38043152
    reference_title: An autopsy case of fatal Japanese spotted fever in Wakayama.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The numerous inflammatory infiltrates were also observed in pulmonary
      interstitium, which were accompanied with histopathologic features of
      vasculitis.
    explanation: >-
      Fatal autopsy evidence directly links disseminated JSF to vasculitic
      pulmonary injury.

- name: Hypercytokinemic Shock Response
  role: inflammatory_amplification
  biological_scale: ORGANISM
  description: >-
    Severe Japanese spotted fever can couple the endothelial inflammatory
    response to excessive systemic cytokine signaling and shock.
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  downstream:
  - target: Severe Coagulation Activation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Cytokine-amplified severe disease predisposes to DIC.
  - target: Vasculitic Multiorgan Injury
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Fulminant inflammatory injury can progress to renal and pulmonary failure.
  evidence:
  - reference: PMID:11376087
    reference_title: Fulminant Japanese spotted fever associated with hypercytokinemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report a patient with Japanese spotted fever caused by Rickettsia
      japonica who developed shock associated with hypercytokinemia.
    explanation: >-
      The fulminant case links JSF caused by R. japonica to hypercytokinemic
      shock.

- name: Severe Coagulation Activation
  role: severe_complication
  biological_scale: ORGANISM
  description: >-
    In severe JSF, systemic vascular inflammation activates coagulation and
    progresses to disseminated intravascular coagulation with platelet
    consumption and, in a subset, purpura fulminans.
  biological_processes:
  - preferred_term: blood coagulation
    term:
      id: GO:0007596
      label: blood coagulation
    modifier: INCREASED
  downstream:
  - target: Disseminated Intravascular Coagulation
    causal_link_type: DIRECT
    description: Systemic consumptive coagulation manifests as DIC.
  - target: Thrombocytopenia
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Consumptive coagulation lowers the circulating platelet count.
  - target: Purpura Fulminans
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Severe DIC can produce purpura fulminans with ischemic skin injury.
  evidence:
  - reference: PMID:36386421
    reference_title: Fatal Rickettsia Japonica Infection Complicating Disseminated Intravascular Coagulation in Yichang, China.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Systemic manifestations such as vomiting (83%), neurological
      manifestations (100%), and disseminated intravascular coagulation (100%)
      were more frequently observed in the severe cases
    explanation: >-
      The severe Chinese JSF series identifies DIC as a frequent manifestation
      of severe disease.

- name: Vasculitic Multiorgan Injury
  role: severe_complication
  biological_scale: ORGANISM
  description: >-
    Fulminant JSF can disseminate the vasculitic injury to kidneys and lungs,
    producing acute renal failure, acute respiratory failure, and liver injury.
  downstream:
  - target: Elevated Hepatic Transaminases
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Severe systemic JSF commonly injures the liver.
  - target: Neurological Manifestations
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Fulminant systemic JSF can include neurological involvement.
  evidence:
  - reference: PMID:38043152
    reference_title: An autopsy case of fatal Japanese spotted fever in Wakayama.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, we diagnosed her cause of death as JSF which had been occurred
      multiorgan failure such as acute renal failure and possibly acute
      respiratory failure.
    explanation: Fatal autopsy evidence connects fulminant JSF to multiorgan failure.

phenotypes:
- name: Fever
  category: Constitutional
  frequency: VERY_FREQUENT
  description: Fever is a cardinal systemic manifestation of acute JSF.
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:35545515
    reference_title: "[Infectious causes and management of Japanese spotted fever and severe fever thrombocytopenia syndrome in Ehime prefecture]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The incidence of various clinical symptoms in the JSF patients was as
      follows: fever and systemic erythema, 100%; tick bite, 73.6%; liver
      dysfunction, 69.2%; disseminated intravascular coagulation (DIC), 14.3%;
      and neurological symptoms, 11.0%.
    explanation: >-
      Fever was present in all JSF cases in the Ehime Prefecture series.

- name: Skin Rash
  category: Dermatologic
  frequency: FREQUENT
  description: >-
    Japanese spotted fever commonly produces an erythematous cutaneous eruption.
  phenotype_term:
    preferred_term: Skin rash
    term:
      id: HP:0000988
      label: Skin rash
  evidence:
  - reference: PMID:39477520
    reference_title: "Clinical Characteristics and Risk Factors for Severe Japanese Spotted Fever: A Retrospective Multicenter Study in the Nagasaki Prefecture, Western Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Common symptoms included fever (87%), rash (48%), and fatigue (48%), with
      eschars detected in 50 (79.4%) patients.
    explanation: >-
      The multicenter Nagasaki series quantifies rash among common JSF
      presenting symptoms.

- name: Inoculation Eschar
  category: Dermatologic
  frequency: FREQUENT
  description: >-
    Necrosis at the infected tick-bite site commonly creates an inoculation
    eschar.
  phenotype_term:
    preferred_term: Eschar
    term:
      id: HP:6000793
      label: Eschar
  evidence:
  - reference: PMID:39477520
    reference_title: "Clinical Characteristics and Risk Factors for Severe Japanese Spotted Fever: A Retrospective Multicenter Study in the Nagasaki Prefecture, Western Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Common symptoms included fever (87%), rash (48%), and fatigue (48%), with
      eschars detected in 50 (79.4%) patients.
    explanation: >-
      Eschars were detected in most patients in the Nagasaki multicenter JSF
      series.

- name: Purpura
  category: Dermatologic
  description: >-
    Palmar, plantar, or other purpuric lesions are more typical of JSF than of
    scrub typhus in central Japan.
  phenotype_term:
    preferred_term: Purpura
    term:
      id: HP:0000979
      label: Purpura
  evidence:
  - reference: PMID:30124190
    reference_title: Distinguishing Japanese Spotted Fever and Scrub Typhus, Central Japan, 2004- 2015.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical findings more frequently observed in JSF than in ST patients were
      purpura, palmar/plantar rash, hyponatremia, organ damage, and delayed
      defervescence after treatment.
    explanation: >-
      The comparative Japanese cohort identifies purpura as a JSF-enriched skin
      feature relative to scrub typhus.


discussions:
- discussion_id: gap_ih_versus_narcolepsy_type_2_entity_validity
  kind: KNOWLEDGE_GAP
  prompt: >-
    Are idiopathic hypersomnia and narcolepsy type 2 one disorder or two?
  attaches_to:
  - pathophysiology#Unidentified Somnogenic Process
  rationale: >-
    The two diagnoses are separated by a single polysomnographic count - two or
    more sleep-onset REM periods on the multiple sleep latency test - applied to
    a test its own reviewers describe as neither sensitive nor specific, and the
    count is unstable on repeat testing. Neither disorder has a biological
    marker, both have normal CSF hypocretin-1, and they respond to the same
    drugs. This is not a nosological quibble: it determines whether mechanistic
    studies of either are being conducted in a homogeneous population, and a
    negative replication in a mixed cohort would be uninterpretable. It is the
    principal reason this entry's trigger node is curated as unknown rather than
    inheriting a mechanism from narcolepsy research.
  proposed_experiments:
  - experiment_id: exp_repeat_mslt_classification_stability
    name: Stability of the SOREMP-based classification on repeat testing
    description: >-
      Serial multiple sleep latency testing at intervals in a cohort meeting
      criteria for either diagnosis, quantifying how often patients cross the
      two-SOREMP boundary between tests, and testing whether any clinical,
      biochemical, or genetic variable segregates with the assigned label
      independently of that count.
- discussion_id: gap_gaba_potentiation_replication
  kind: KNOWLEDGE_GAP
  prompt: >-
    Has the CSF GABA-A-potentiating bioactivity been independently replicated,
    and what is the substance?
  attaches_to:
  - pathophysiology#Impaired Arousal from Sleep (Sleep Inertia)
  rationale: >-
    The gabaergic_potentiation hypothesis is the only mechanistic account of
    idiopathic hypersomnia with direct experimental support, and it is curated
    here as EMERGING rather than canonical for two specific reasons that are
    resolvable rather than permanent. The bioactive substance was characterised
    only as a trypsin-sensitive species of 500-3000 daltons and has never been
    identified, so there is no assay a second laboratory can run on the analyte
    itself; and the supporting clinical observation was open-label in seven
    patients. Until both are addressed, a conforming or citing entry should not
    treat GABA-A potentiation as established.
  proposed_experiments:
  - experiment_id: exp_csf_somnogen_identification
    name: Molecular identification of the CSF bioactivity
    description: >-
      Fractionation and mass-spectrometric identification of the
      GABA-A-potentiating component of hypersomnolent CSF, followed by a blinded
      multi-site assay of the identified analyte in patients meeting criteria for
      idiopathic hypersomnia, narcolepsy type 2, and matched controls.
  - experiment_id: exp_flumazenil_randomised_trial
    name: Randomised placebo-controlled trial of flumazenil
    description: >-
      A blinded, placebo-controlled crossover trial of flumazenil in
      hypersomnolent patients selected by CSF bioactivity status, with objective
      vigilance and sleep-inertia endpoints, to test whether the open-label
      response survives control and whether it segregates with the biomarker.

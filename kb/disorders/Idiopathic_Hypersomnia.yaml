  - reference: PMID:37409509
    reference_title: "Long-term efficacy and safety of low-sodium oxybate in an open-label extension period of a placebo-controlled, double-blind, randomized withdrawal study in adults with idiopathic hypersomnia."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-

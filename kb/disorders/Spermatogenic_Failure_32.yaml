- name: Genetic Counseling
  description: >-
    Counselling must address the unresolved inheritance: the recurrent allele
    acts recessively for sperm count in the best-documented case, while its
    heterozygous effect is uncertain. Every child of a homozygous father, and
    each child of a heterozygous father with 50% probability, inherits the
    variant. Daughters carry it as well as sons, which matters because
    biallelic SOHLH1 loss causes ovarian dysgenesis in women.
  therapeutic_modality: BEHAVIORAL

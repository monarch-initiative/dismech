  evidence:
  - reference: PMID:16564520
    reference_title: "Sohlh1 is essential for spermatogonial differentiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Loss of Sohlh1 causes infertility by disrupting spermatogonial differentiation into spermatocytes."
    explanation: Sohlh1-null male mice are infertile from a spermatogonial differentiation block.
  - reference: PMID:22056784
    reference_title: "SOHLH1 and SOHLH2 coordinate spermatogonial differentiation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The Sohlh1/Sohlh2 double mutant phenocopies single mutants, i.e., spermatogonia continue to proliferate but do not differentiate properly."
    explanation: Spermatogonia proliferate but fail to differentiate in Sohlh mutants.

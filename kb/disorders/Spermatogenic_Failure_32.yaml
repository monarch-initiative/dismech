name: Spermatogenic Failure 32
creation_date: "2026-10-22T13:25:13Z"
category: Mendelian
synonyms:
- SPGF32
- spermatogenic failure 32
- SOHLH1-related spermatogenic failure
- SOHLH1-related male infertility
description: >-
  Spermatogenic failure 32 (SPGF32) is male infertility from impaired sperm
  production caused by variants in SOHLH1, a germ-cell-specific basic
  helix-loop-helix transcription factor that drives spermatogonial
  differentiation, in part by activating KIT. Nearly all reported men carry
  the same splice-acceptor allele, c.346-1G>A, which uses a cryptic acceptor
  in exon 4 and truncates the bHLH domain.

  The disease was first described in two Korean and two Japanese men with
  non-obstructive azoospermia who were heterozygous for c.346-1G>A, and was
  catalogued as dominant. Later reports changed that reading. A man
  homozygous for the same allele had severe oligozoospermia with depleted,
  disordered germ cells and reduced testicular SOHLH1 protein, three
  heterozygous carriers had teratozoospermia with normal sperm counts, and a
  biallelic missense SOHLH1 variant was found in a consanguineous Pakistani
  family with azoospermia. The current evidence favours biallelic loss of
  function as the cause of quantitative spermatogenic failure, with the
  heterozygous allele's contribution unresolved. Sohlh1-null male mice are
  infertile because spermatogonia fail to differentiate into spermatocytes.
  ICSI with ejaculated sperm has produced pregnancies in carriers of either
  genotype.
disease_term:
  preferred_term: spermatogenic failure 32
  term:
    id: MONDO:0020855
    label: spermatogenic failure 32
parents:
- Spermatogenic Failure
- Genetic Disease
notes: >-
  The same gene causes ovarian dysgenesis 5 in 46,XX women homozygous for
  truncating SOHLH1 variants, curated as the ODG5 subtype of
  46_XX_Gonadal_Dysgenesis; SOHLH1 disease is therefore sex-dimorphic, with
  oocyte loss in women and spermatogenic failure in men, matching the Sohlh1
  knockout mouse. The human male evidence is small: two heterozygous Korean
  NOA cases (PMID:20506135), two heterozygous Japanese NOA cases
  (PMID:28718531), one homozygous Chinese severe-oligozoospermia case and
  three heterozygous teratozoospermia carriers (PMID:34448846), two
  heterozygous severe-oligoasthenospermia cases (PMID:39950040), and one
  biallelic missense family (PMID:39625557). In the homozygous case the
  father was a non-carrier and the mother was not tested. The deep-research
  report and OMIM describe Sertoli-cell-only histology in the original cases;
  no cached abstract or full text states this, so it is not encoded. ClinGen
  has not curated SOHLH1 for this disease, so no validity tier is recorded.
  The meiotic_prophase_failure module was considered and not used: SOHLH1
  acts before meiosis, at the spermatogonial differentiation step, and that
  module scopes itself to meiotic genes. No GeneReviews chapter covers this
  disorder.
inheritance:
- name: Autosomal recessive
  description: >-
    A man homozygous for c.346-1G>A had severe oligozoospermia with germ-cell
    depletion, while heterozygous carriers in the same study had normal sperm
    counts; a biallelic missense variant was reported in a consanguineous
    family with azoospermia.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:34448846
    reference_title: "The mutation c.346-1G > A in SOHLH1 impairs sperm production in the homozygous but not in the heterozygous condition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Collectively, our findings proved that the homozygous mutation was the direct genetic factor causing reduced sperm production and suggested that the c.346-1G > A mutation in SOHLH1 impaired sperm production in a recessive-inheritance pattern."
    explanation: >-
      One homozygous patient with severe oligozoospermia; segregation was
      incomplete (father non-carrier, mother untested).
  - reference: PMID:39625557
    reference_title: "Whole-exome sequencing identifies rare recessive variants in azoospermia patients from consanguineous Pakistani families."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We successfully identified five deleterious variants among five of the seven families, including three missense biallelic substitutions in WWC2, RPL10L, and SOHLH1"
    explanation: A biallelic SOHLH1 missense variant in a consanguineous azoospermia family.
- name: Autosomal dominant (contested)
  description: >-
    The disease was first catalogued as dominant on the strength of
    heterozygous c.346-1G>A carriers with non-obstructive azoospermia. Later
    carriers with normal sperm counts argue against a fully penetrant
    dominant cause of azoospermia; the heterozygous allele may still
    contribute to abnormal sperm morphology or count.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:28718531
    reference_title: "Next-generation sequencing for patients with non-obstructive azoospermia: implications for significant roles of monogenic/oligogenic mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These sequence alterations included a heterozygous splice site mutation in SOHLH1 and a hemizygous missense substitution in TEX11, which have been reported as causes of non-obstructive azoospermia."
    explanation: A heterozygous SOHLH1 splice variant in a Japanese NOA cohort, interpreted as causal.
  - reference: PMID:34448846
    reference_title: "The mutation c.346-1G > A in SOHLH1 impairs sperm production in the homozygous but not in the heterozygous condition."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In summary, our work identified a recessively inherited model of a SOHLH1 mutation in human male infertility that was associated with SOZ and also suggested that the SOHLH1 heterozygous c.346-1G > A mutation was associated with teratozoospermia but not a direct cause for NOA."
    explanation: Heterozygous carriers had normal sperm counts, against a dominant cause of azoospermia.
pathophysiology:
- name: SOHLH1 Transcription Factor Loss of Function
  description: >-
    The c.346-1G>A splice-acceptor variant activates a cryptic acceptor in
    exon 4 and produces SOHLH1 with a truncated bHLH domain. In the
    homozygous patient, SOHLH1 protein was reduced in testicular tissue.
    The molecular function bound here is SOHLH1's GO annotation
    (GO:0000981, ISA, GO_REF:0000113 in QuickGO for UniProt Q5JUK2); loss of
    transcription-factor activity was shown as failed KIT-promoter activation
    in transfected cells, not measured in patients.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: SOHLH1
    term:
      id: hgnc:27845
      label: SOHLH1
  molecular_functions:
  - preferred_term: bHLH DNA-binding transcription factor activity
    modifier: DECREASED
    term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
  evidence:
  - reference: PMID:20506135
    reference_title: "Mutations in SOHLH1 gene associate with nonobstructive azoospermia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Analysis of transcripts from minigenes carrying the c.346-1G>A revealed that splicing site variation leads to the partial deletion at a cryptic splicing site within exon 4. This deletion results in SOHLH1 with a truncated bHLH domain."
    explanation: Minigene assay showing the splice defect and bHLH truncation.
  - reference: PMID:34448846
    reference_title: "The mutation c.346-1G > A in SOHLH1 impairs sperm production in the homozygous but not in the heterozygous condition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Western blotting indicated the decrease of the SOHLH1 protein in patient’s testicular tissues compared to normal control"
    explanation: Reduced SOHLH1 protein in the homozygous patient's testis.
  downstream:
  - target: Reduced KIT Transcriptional Activation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20506135
      reference_title: "Mutations in SOHLH1 gene associate with nonobstructive azoospermia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Transient transfection assay showed that the SOHLH1 mutant with the truncated domain disrupted the transcriptional activity of KIT promoter"
      explanation: The truncated mutant fails to activate the KIT promoter in transfected cells.
- name: Reduced KIT Transcriptional Activation
  description: >-
    SOHLH1, with its partner SOHLH2, binds E-boxes in the Kit promoter and
    activates Kit transcription in postnatal spermatogonia. KIT signalling
    drives the differentiating spermatogonial stages.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: KIT
    term:
      id: hgnc:6342
      label: KIT
  biological_processes:
  - preferred_term: KIT transcriptional activation
    modifier: DECREASED
    term:
      id: GO:0045944
      label: positive regulation of transcription by RNA polymerase II
  evidence:
  - reference: PMID:22328502
    reference_title: "SOHLH1 and SOHLH2 control Kit expression during postnatal male germ cell development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In the male, deletion of each factor causes loss of Kit-expressing spermatogonia in the prepuberal testis."
    explanation: Sohlh1 deletion removes Kit-expressing spermatogonia in mice.
  - reference: PMID:22328502
    reference_title: "SOHLH1 and SOHLH2 control Kit expression during postnatal male germ cell development."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that E-box sequences within the Kit promoter and its first intron can be transactivated in transfection experiments overexpressing Sohlh1 or Sohlh2."
    explanation: SOHLH1 transactivates the Kit promoter in transfected cells.
  downstream:
  - target: Failure of Spermatogonial Differentiation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:22328502
      reference_title: "SOHLH1 and SOHLH2 control Kit expression during postnatal male germ cell development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our results suggest that SOHLH1 and SOHLH2 directly stimulate Kit transcription in postnatal spermatogonia, thus activating the signaling involved in spermatogonia differentiation and spermatogenetic progression."
      explanation: Kit activation by SOHLH1 is the signal for spermatogonial differentiation.
- name: Failure of Spermatogonial Differentiation
  description: >-
    Without SOHLH1, spermatogonia keep proliferating but do not progress to
    spermatocytes; SOHLH1 and SOHLH2 normally repress stem-cell maintenance
    genes such as Gfra1 and induce differentiation genes. This is shown in
    knockout mice; it has not been examined directly in human testis. GO has
    no spermatogonial differentiation term: an OLS search of GO for
    "spermatogonial differentiation" returned only CL:0000015, and searches
    for "spermatogonial cell" and "spermatogonium" returned GO:0007284
    spermatogonial cell division and germline stem-cell division terms, which
    describe division rather than differentiation. The node is therefore
    bound to the parent process GO:0007283 spermatogenesis.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: spermatogonium
    term:
      id: CL:0000020
      label: spermatogonium
  biological_processes:

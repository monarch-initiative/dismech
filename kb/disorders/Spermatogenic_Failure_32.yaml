animal_models:
- name: Sohlh1 knockout mouse
  species: Mouse
  genotype: Sohlh1-/- (targeted null), homozygous
  publication: PMID:16564520
  description: >-
    Null males are infertile because spermatogonia fail to differentiate into
    spermatocytes; null females lose oocytes. Seven-day-old null testes lack
    Lhx8 and have reduced Ngn3 expression.
  modeled_mechanisms:
  - target: Failure of Spermatogonial Differentiation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: The knockout shows the spermatogonial differentiation block.
    limitations: >-
      A complete null, whereas the recurrent human allele is an in-frame
      splice deletion that reduces rather than abolishes SOHLH1; heterozygous
      null mice are not reported to have the sperm defects seen in
      heterozygous human carriers.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The homozygous human patient still produced a few sperm, while the
        null mouse arrests before spermatocytes; the human allele is
        hypomorphic and human and mouse SOHLH1 share low sequence identity.
    evidence:
    - reference: PMID:16564520
      reference_title: "Sohlh1 is essential for spermatogonial differentiation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Loss of Sohlh1 causes infertility by disrupting spermatogonial differentiation into spermatocytes."
      explanation: Differentiation block in null males.
  - target: Reduced KIT Transcriptional Activation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Kit-expressing spermatogonia are lost in prepubertal null testes.
    evidence:
    - reference: PMID:22328502
      reference_title: "SOHLH1 and SOHLH2 control Kit expression during postnatal male germ cell development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In the male, deletion of each factor causes loss of Kit-expressing spermatogonia in the prepuberal testis."
      explanation: Loss of the Kit-positive spermatogonial population.

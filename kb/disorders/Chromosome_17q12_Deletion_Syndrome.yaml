inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >
    The deletion behaves as an autosomal dominant trait. About three quarters arise de novo
    and about a quarter are inherited from a parent, so a parental deletion should be looked
    for rather than assumed absent.
  de_novo_rate: "75%"
  evidence:
  - reference: PMID:27929632
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "17q12 recurrent deletion syndrome is inherited in an autosomal dominant manner, with approximately 75% of deletions occurring de novo and approximately 25% inherited from a parent."
    explanation: >-
      States both the inheritance pattern and the de novo proportion recorded here.
genetic:
- name: HNF1B
  gene_term:
    preferred_term: HNF1B
    term:
      id: hgnc:11630
      label: HNF1B
  association: CAUSATIVE
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >
    HNF1B lies inside the deleted interval, and its haploinsufficiency accounts for the
    renal and pancreatic phenotype. It is the gene whose point mutations cause renal cysts
    and diabetes syndrome, which is why the deletion reproduces that phenotype. It does not
    account for the neurodevelopmental phenotype.
  evidence:
  - reference: PMID:21055719
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We detected a recurrent 1.4 Mb deletion at 17q12, which harbors HNF1B, the gene responsible for renal cysts and diabetes syndrome (RCAD), in 18/15,749 patients, including several with ASD, but 0/4,519 controls."
    explanation: >-
      Places HNF1B inside the deleted interval and names it as the gene responsible for the
      renal cysts and diabetes phenotype.
  - reference: PMID:28420700
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The HNF1B syndrome is related to HNF1B mutations or to a 17q12 deletion spanning 15 genes, including HNF1B."
    explanation: >-
      Confirms that the deletion spans 15 genes and that HNF1B is one of them.
- name: Other genes in the 17q12 interval
  association: CAUSATIVE
  relationship_type: COOPERATING
  variant_origin: GERMLINE
  features: >
    Fourteen further genes are removed by the deletion. One or more of them is dosage
    sensitive for brain development, since the neuropsychiatric phenotype is present with
    the deletion and absent with an HNF1B point mutation, but which gene or genes has not
    been established. This record exists to hold that claim explicitly rather than let the
    entry imply HNF1B explains everything.
  evidence:
  - reference: PMID:21055719
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data demonstrate that deletion 17q12 is a recurrent, pathogenic CNV that confers a very high risk for ASD and schizophrenia and show that one or more of the 15 genes in the deleted interval is dosage sensitive and essential for normal brain development and function."
    explanation: >-
      Asserts dosage sensitivity of one or more interval genes for brain development without
      identifying which, which is exactly the claim this record carries.
mechanistic_hypotheses:
- hypothesis_group_id: contiguous_gene_model
  hypothesis_label: Contiguous gene syndrome extending beyond HNF1B
  status: CANONICAL
  description: >
    The renal and pancreatic phenotype is HNF1B haploinsufficiency; the neurodevelopmental
    and neuropsychiatric phenotype comes from loss of one or more of the other fourteen
    genes in the interval. The evidence for the split is a contrast rather than a positive
    identification: the deletion carries an ASD and schizophrenia risk that HNF1B point
    mutations do not, at case-control effect sizes large enough to survive correction in
    tens of thousands of controls. A second dataset reproduced the direction of the
    schizophrenia signal without reaching significance, so the replication is partial.
  evidence:
  - reference: PMID:21055719
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, the phenotypic features of patients with this CNV are consistent with a contiguous gene syndrome that extends beyond RCAD, which is caused by HNF1B mutations only."
    explanation: >-
      States the contiguous gene claim that defines this hypothesis group, and grounds it in
      the contrast with HNF1B point mutations.
  - reference: PMID:22130109
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Deletions at 17p12 and 17q12, were also more common in schizophrenia cases but not significantly so, while duplications at 16p13.1 were found at nearly the same rate as in previous schizophrenia samples."
    explanation: >-
      A replication attempt in a non-psychiatric reference set found the 17q12 deletion
      directionally more common in schizophrenia but did not reach significance, so it is
      consistent with the association without independently establishing it. Cited as the
      weaker of the two datasets, and graded INDIRECT for that reason.
pathophysiology:
- name: Recurrent 1.4 Mb Heterozygous Deletion at 17q12
  biological_scale: MOLECULAR
  description: >
    A recurrent heterozygous deletion of approximately 1.4 Mb removes about fifteen genes at
    chromosome 17q12. Its recurrence and fixed breakpoints are what make it detectable by
    chromosomal microarray and, equally, what make it invisible to the sequencing panels
    used to work up maturity-onset diabetes of the young. This node is the initiating lesion
    and branches into two mechanistically separate arms.
  downstream:
  - target: HNF1B Haploinsufficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21055719
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We detected a recurrent 1.4 Mb deletion at 17q12, which harbors HNF1B, the gene responsible for renal cysts and diabetes syndrome (RCAD), in 18/15,749 patients, including several with ASD, but 0/4,519 controls."
      explanation: >-
        Establishes that the deletion removes one copy of HNF1B, which is the causal step this
        edge asserts.
  - target: Haploinsufficiency of Additional Dosage-Sensitive Interval Genes
    causal_link_type: DIRECT
    hypothesis_groups:
    - contiguous_gene_model
  evidence:
  - reference: PMID:27929632
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis is established in a proband by detection of the 1.4-Mb heterozygous recurrent deletion at chromosome 17q12 by chromosomal microarray testing or other genomic methods."
    explanation: >-
      Gives the size and heterozygous state of the deletion and the method that detects it.
- name: HNF1B Haploinsufficiency
  biological_scale: MOLECULAR
  description: >
    One functional copy of HNF1B remains. HNF1B is a homeodomain transcription factor
    required for nephron and pancreatic development and for maintenance of tubular
    epithelial identity, so a halved dose is sufficient to derange kidney and pancreatic
    development. This is the arm of the mechanism shared with HNF1B point mutations.
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    modifier: DECREASED
  downstream:
  - target: Disrupted Nephron and Collecting System Development
    causal_link_type: DIRECT
  - target: Impaired Pancreatic Beta Cell Development and Insulin Secretion
    causal_link_type: DIRECT
  - target: Mullerian Duct Maldevelopment
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:30032214
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Maturity-onset diabetes of the young type 5 (MODY5) is caused by mutations of the hepatocyte nuclear factor 1 homeobox β gene (HNF1B)."
    explanation: >-
      Identifies HNF1B loss as the cause of the diabetes arm, supporting this node as the
      shared branch point.
  - reference: PMID:15085338
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutations in the hepatocyte nuclear factor-1 beta ( HNF-1 beta) gene result in disorders of renal development, typically involving renal cysts and early-onset diabetes (the RCAD syndrome/ MODY5)."
    explanation: >-
      Establishes that reduced HNF1B function produces both the renal developmental and the
      diabetic phenotype, which is the branch point this node records.
- name: Haploinsufficiency of Additional Dosage-Sensitive Interval Genes
  biological_scale: MOLECULAR
  description: >
    Fourteen further genes are lost in one copy. At least one is dosage sensitive for brain
    development, inferred from the fact that the deletion confers autism and schizophrenia
    risk while an HNF1B point mutation does not. The responsible gene is unidentified, so
    this node names the class of lesion rather than a molecule, and the entry does not
    pretend otherwise.
  downstream:
  - target: Impaired Neurodevelopment
    causal_link_type: DIRECT
    hypothesis_groups:
    - contiguous_gene_model
    evidence:
    - reference: PMID:21055719
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These data demonstrate that deletion 17q12 is a recurrent, pathogenic CNV that confers a very high risk for ASD and schizophrenia and show that one or more of the 15 genes in the deleted interval is dosage sensitive and essential for normal brain development and function."
      explanation: >-
        Asserts the causal link from interval gene dosage to abnormal brain development, which
        is the step this edge records.
- name: Disrupted Nephron and Collecting System Development
  biological_scale: TISSUE
  description: >
    Reduced HNF1B dose during kidney development gives multicystic dysplastic kidneys, renal
    cysts, hypoplasia and a range of other structural and functional abnormalities of the
    kidney and urinary tract. This is the commonest arm of the phenotype, present in 85 to
    90 per cent of affected individuals on ascertainment-corrected figures, and it also
    carries the tubular handling defects for magnesium, potassium and urate.
  biological_processes:
  - preferred_term: nephron development
    term:
      id: GO:0072006
      label: nephron development
    modifier: DECREASED
  locations:
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  downstream:
  - target: Multicystic kidney dysplasia
    causal_link_type: DIRECT
  - target: Chronic kidney disease
    causal_link_type: DIRECT
  - target: Hypomagnesemia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27929632
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the authors determined that multicystic kidneys and other structural and functional kidney anomalies occur in 85%-90% of affected individuals"
    explanation: >-
      Gives the frequency and nature of the renal developmental phenotype on this node.
  - reference: PMID:24204001
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: "HNF1B to costimulate the FXYD2 promoter, the activity of which is instrumental"
    explanation: >-
      Supplies the molecular route from reduced HNF1B dose to renal magnesium wasting: HNF1B
      drives the FXYD2 promoter, whose product mediates distal convoluted tubule magnesium
      reabsorption. Graded INDIRECT because the experiment interrogates PCBD1 loss rather than
      HNF1B haploinsufficiency, and is a cell-line overexpression system.
- name: Impaired Pancreatic Beta Cell Development and Insulin Secretion
  biological_scale: TISSUE
  description: >
    Reduced HNF1B dose impairs pancreatic development, giving maturity-onset diabetes of the
    young type 5 in roughly 40 per cent of affected individuals, most often diagnosed before
    age 25. Exocrine involvement occurs as well, so pancreatic insufficiency is part of the
    same lesion rather than a separate one. Clinically the diabetes is insulin-requiring in
    most patients despite some initial sulfonylurea responsiveness.
  biological_processes:
  - preferred_term: pancreas development
    term:
      id: GO:0031016
      label: pancreas development
    modifier: DECREASED
  locations:
  - preferred_term: pancreas
    term:
      id: UBERON:0001264
      label: pancreas
  downstream:
  - target: Maturity-onset diabetes of the young
    causal_link_type: DIRECT
  - target: Exocrine pancreatic insufficiency
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27929632
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MODY5 in approximately 40%, and some degree of developmental delay or learning disability in approximately 50%. MODY5 is most often diagnosed before age 25 years (range: age 10-50 years)."
    explanation: >-
      Gives the frequency and age at diagnosis of the diabetes arm recorded on this node.
  - reference: PMID:28420700
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although responsiveness to sulfonylureas/repaglinide was observed in 29 of the 51 tested, 111 of 140 patients (79%) were treated with insulin at follow-up."
    explanation: >-
      Supports the claim that the beta cell defect is severe enough that most patients end up
      insulin-treated despite partial oral responsiveness.
- name: Mullerian Duct Maldevelopment
  biological_scale: TISSUE
  description: >
    HNF1B is expressed in the developing mesonephric and paramesonephric ducts, and 17q12
    deletion is a recognised cause of Mullerian aplasia, presenting as primary amenorrhoea
    or as a uterine anomaly in pubertal females. This arm is easy to miss because it declares
    itself years after the renal and diabetic features.
  biological_processes:
  - preferred_term: mesonephric duct development
    term:
      id: GO:0072177
      label: mesonephric duct development
    modifier: DECREASED
  locations:
  - preferred_term: uterus
    term:
      id: UBERON:0000995
      label: uterus
  downstream:
  - target: Aplasia of the uterus
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27929632
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consider reevaluation for uterine and vaginal abnormalities related to müllerian duct aplasia in pubertal females with primary amenorrhea."
    explanation: >-
      Establishes Mullerian duct aplasia as a recognised feature requiring surveillance, which
      is the phenotype this node carries.
- name: Impaired Neurodevelopment
  biological_scale: ORGANISM
  description: >
    Developmental delay or learning disability affects roughly half of affected individuals,
    and the deletion carries a large excess risk of autism spectrum disorder and
    schizophrenia. The psychiatric end of the spectrum declares itself late, which is why
    surveillance guidance asks specifically about prodromal psychotic symptoms in
    adolescence. This is the arm that is not explained by HNF1B.
  downstream:
  - target: Global developmental delay
    causal_link_type: DIRECT
  - target: Autism spectrum disorder
    causal_link_type: DIRECT
  - target: Schizophrenia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21055719
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a large follow-up sample, the same deletion was identified in 2/1,182 ASD/neurocognitive impairment and in 4/6,340 schizophrenia patients, but in 0/47,929 controls (corrected p = 7.37 × 10⁻⁵)."
    explanation: >-
      Quantifies the neurodevelopmental and psychiatric excess with a case-control comparison,
      supporting this node as a real component of the syndrome.

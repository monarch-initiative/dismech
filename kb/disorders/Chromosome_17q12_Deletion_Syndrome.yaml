treatments:
- name: Insulin Therapy for MODY5
  description: >
    Most patients require insulin, though about half of those tested show some
    responsiveness to sulfonylureas or repaglinide. The oral response is partial and does not
    generally persist, which is the practical difference from the other MODY subtypes.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: insulin
      term:
        id: CHEBI:145810
        label: insulin
  therapeutic_modality: PEPTIDE
  target_mechanisms:
  - target: Impaired Pancreatic Beta Cell Development and Insulin Secretion
    description: >-
      Replaces the insulin the developmentally reduced beta cell mass cannot secrete; it does
      not address the developmental defect.
  evidence:
  - reference: PMID:28420700
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although responsiveness to sulfonylureas/repaglinide was observed in 29 of the 51 tested, 111 of 140 patients (79%) were treated with insulin at follow-up."
    explanation: >-
      Quantifies both the partial oral responsiveness and the eventual insulin requirement.
- name: Renal Replacement and Transplantation
  description: >
    End-stage renal disease occurs in a substantial minority and is managed by standard renal
    replacement. Transplantation carries a specific hazard here: it raises the risk of
    post-transplant diabetes in a population already predisposed, so an immunosuppressive
    regimen avoiding tacrolimus and mTOR inhibitors and minimising corticosteroids may be
    preferable in those not yet diabetic.
  treatment_term:
    preferred_term: Kidney Transplantation
    term:
      id: NCIT:C15265
      label: Kidney Transplantation
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Disrupted Nephron and Collecting System Development
    description: >-
      Replaces the failed organ; it does not alter the developmental lesion in other tissues.
  evidence:
  - reference: PMID:27929632
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because kidney transplantation increases the risk for post-transplant diabetes mellitus, an immunosuppressive regimen that avoids tacrolimus and mTOR inhibitors and reduces corticosteroid exposure may benefit those without preexisting diabetes mellitus."
    explanation: >-
      Records the GeneReviews agents-to-avoid guidance specific to transplantation in this
      disorder.
  - reference: PMID:28420700
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Renal cysts were present in 122 of 166 patients, chronic kidney disease stages 3-4 (CKD3-4) in 75 of 169 (44%), and end-stage renal disease (ESRD) in 36 of 169 (21%)."
    explanation: >-
      Quantifies the end-stage renal disease burden that makes renal replacement relevant.
- name: Avoidance of Lithium and Nephrotoxic or Hepatotoxic Agents
  description: >
    A drug-safety consideration rather than a therapy. Lithium and other agents affecting
    long-term kidney function need careful thought given the underlying structural and
    functional renal abnormality, and antipsychotics causing weight gain compound an already
    raised diabetes risk. Nephrotoxic and hepatotoxic drugs should be avoided in those with
    kidney or liver involvement.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER
  evidence:
  - reference: PMID:27929632
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mood stabilizers that affect kidney function in the long term, such as lithium, should be carefully considered in the setting of potential underlying anatomic and functional kidney abnormalities."
    explanation: >-
      Records the specific lithium caution from the GeneReviews agents-to-avoid section.
  - reference: PMID:27929632
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For individuals with mental health conditions (e.g., ASD, schizophrenia, or bipolar disorder), careful consideration of antipsychotic agents that may lead to weight gain, as this may lead to metabolic syndrome and diabetes mellitus, for which individuals with 17q12 recurrent deletion syndrome are at increased risk."
    explanation: >-
      Records the antipsychotic weight-gain caution, which is specific to the collision between
      this syndrome's psychiatric and diabetic arms.
- name: Genetic Counseling and Parental Testing
  description: >
    About a quarter of deletions are inherited, so a parental deletion should be sought
    rather than assumed absent, and at-risk relatives identified through the proband benefit
    from surveillance for renal, diabetic and developmental features.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  therapeutic_modality: BEHAVIORAL
  evidence:
  - reference: PMID:27929632
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If one of the proband's parents has the 17q12 recurrent deletion, it is appropriate to test older and younger sibs of the proband and other relatives at risk in order to identify those who would benefit from close assessment/monitoring for evidence of genitourinary structural or functional defects, MODY5, and developmental delays / intellectual disability."
    explanation: >-
      States the cascade testing recommendation this treatment record captures.
definitions:
- name: Chromosomal microarray detection of the 1.4 Mb 17q12 deletion
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >
    Diagnosis rests on detecting the recurrent 1.4 Mb heterozygous deletion by chromosomal
    microarray or another genomic method. The practical point is a negative one: sequencing
    panels used to work up maturity-onset diabetes of the young cannot see a 1.4 Mb deletion,
    so a MODY5 diagnosis reached by panel sequencing does not exclude this syndrome and a
    normal panel is not reassurance.
  evidence:
  - reference: PMID:27929632
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis is established in a proband by detection of the 1.4-Mb heterozygous recurrent deletion at chromosome 17q12 by chromosomal microarray testing or other genomic methods."
    explanation: >-
      States the diagnostic method this definition records.
  - reference: PMID:30032214
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because HNF1B deletions are virtually always part of a 17q12 deletion syndrome and common genetic analyses for evaluation of MODY5 are unable to detect the deletion of a 1.4-Mb chromosomal region, initial attention to the syndromal features at the stage of diagnosis is of considerable importance for establishing correct diagnosis, subsequent therapy, and interdisciplinary patient care."
    explanation: >-
      States that standard MODY5 genetic testing cannot detect the deletion, which is the
      ascertainment caveat this definition exists to record.
- name: HNF1B score for selecting patients for genetic testing
  definition_type: PHENOTYPE_ALGORITHM
  derivation_basis: ESTABLISHED_CRITERIA
  description: >
    A 17-item weighted clinical, imaging and biochemical score developed to decide who should
    be sent for HNF1B genetic testing, covering antenatal discovery, family history and
    kidney, pancreas, liver and genital tract involvement. It is a rule-out instrument rather
    than a diagnostic one: at the optimal cutoff of 8 its negative predictive value exceeds 99
    per cent with sensitivity 98.2 per cent, but specificity is only 41.1 per cent, so a score
    above threshold does not make the diagnosis. Note the scope caveat for this entry: the
    score is validated for HNF1B disease as a whole, not for the 17q12 deletion specifically,
    and a positive score is followed by sequencing, which cannot see the deletion.
  validation_status:
    status: VALIDATED_AGAINST_GOLD_STANDARD
    rationale: >-
      Assessed by ROC analysis in a 433-individual cohort containing 56 HNF1B cases, against
      genetic testing as the gold standard, giving an AUC of 0.78.
    evidence:
    - reference: PMID:24897035
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The performance of the score was assessed by a ROC curve analysis in a 433-individual cohort containing 56 HNF1B cases."
      explanation: >-
        Documents the validation cohort and method behind this status.
  evidence:
  - reference: PMID:24897035
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The optimal cutoff threshold for the negative predictive value to rule out HNF1B mutations in a suspected individual was 8 (sensitivity 98.2%, specificity 41.1%, and negative predictive value over 99%)."
    explanation: >-
      Gives the operating characteristics recorded in this definition, including the low
      specificity that makes it a rule-out rather than a diagnostic instrument.
  - reference: PMID:24897035
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The HNF1B score is calculated upon 17 items including antenatal discovery, family history, and organ involvement (kidney, pancreas, liver, and genital tract)."
    explanation: >-
      Lists the score's components, which is the content of this definition.
discussions:
- discussion_id: which_interval_gene_drives_ndd
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which of the fourteen non-HNF1B genes in the 17q12 interval is responsible for the
    neurodevelopmental and psychiatric phenotype?
  attaches_to:
  - pathophysiology#Haploinsufficiency of Additional Dosage-Sensitive Interval Genes
  - pathophysiology#Impaired Neurodevelopment
  rationale: >
    The evidence for a non-HNF1B contribution is a contrast, not an identification: the
    deletion confers autism and schizophrenia risk that HNF1B point mutations do not. Because
    the deletion has fixed recurrent breakpoints, human genetics offers almost no smaller
    deletions to narrow the interval with, so the question is not answerable by collecting
    more patients with the same CNV. Until it is resolved, the brain arm of this entry has a
    node that names a class of lesion rather than a molecule.
- discussion_id: deletion_milder_renal_than_point_mutation
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why do 17q12 deletion carriers have less advanced kidney disease than HNF1B
    point-mutation carriers, when the deletion removes the whole gene?
  attaches_to:
  - phenotypes#Chronic kidney disease
  - pathophysiology#HNF1B Haploinsufficiency
  rationale: >
    A 201-patient cohort found CKD stage 3-4 and end-stage renal disease significantly less
    frequent in deletion carriers than in point-mutation carriers, both at diagnosis and in
    the long term. A pure haploinsufficiency model predicts the two should be equivalent, and
    a dominant-negative effect of some missense alleles would explain the direction but has
    not been shown for the alleles in that cohort. Ascertainment is the competing explanation:
    deletion carriers are often found through neurodevelopmental or antenatal routes and
    point-mutation carriers through nephrology, which would bias renal severity the way
    observed. The study does not separate these, and no subsequent work has. A later
    prenatal-and-postnatal comparison across 82 studies asked the differentiation question
    directly in its title and concluded only that both mutation groups show high phenotypic
    heterogeneity, so the difference remains unexplained rather than refuted.
  evidence:
  - reference: PMID:31498910
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, both mutation groups showed a high phenotypic heterogeneity."
    explanation: >-
      A study set up to compare 17q12 microdeletions against intragenic HNF1B variants found
      heterogeneity in both rather than a clean genotype-phenotype split, which is why this gap
      is recorded as open.
prevalence:
- population: Unselected newborns (Norwegian Mother, Father and Child Cohort)
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 25.0
  notes: >-
    Approximately 1 in 4,000 live-born children, from array-based CNV calling in 12,252
    mother-father-child trios. This is the population figure and should be preferred over the
    referred-cohort rate below; the authors note it is higher than previously reported for this
    locus.
  evidence:
  - reference: PMID:32778765
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We provide prevalence estimates and inheritance information for each of the 26 NDD CNVs and find higher prevalence than previously reported for 1q21.1 deletions (~1:2000), 15q11.2 duplications (~1:4000), 15q13.3 microdeletions (~1:2500), 16p11.2 proximal microdeletions (~1:2000) and 17q12 deletions (~1:4000) and lower than previously reported prevalence for the 22q11.2 deletion (~1:12,000)."
    explanation: >-
      Gives the 1 in 4,000 newborn prevalence for 17q12 deletions behind this rate.
  - reference: PMID:32778765
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we perform array-based CNV calling in 12,252 mother-father-child trios from the Norwegian Mother, Father, and Child Cohort Study (MoBa) and analyse the inheritance pattern of 26 recurrent NDD CNVs in 13 genomic regions."
    explanation: >-
      Establishes that the estimate comes from an unselected trio cohort rather than a clinical
      referral series, which is what makes it a population prevalence.
- population: Patients referred for clinical neurodevelopmental cytogenomic testing
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 114.3
  notes: >-
    18 of 15,749 patients referred for neurodevelopmental testing, versus 0 of 4,519 controls.
    This is a referred-population frequency, not a population prevalence, and is inflated by
    the ascertainment route.
  evidence:
  - reference: PMID:21055719
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We detected a recurrent 1.4 Mb deletion at 17q12, which harbors HNF1B, the gene responsible for renal cysts and diabetes syndrome (RCAD), in 18/15,749 patients, including several with ASD, but 0/4,519 controls."
    explanation: >-
      Gives the numerator and denominator behind this rate.

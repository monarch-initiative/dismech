name: Chromosome 17q12 Deletion Syndrome
creation_date: "2026-09-03T15:05:00Z"
category: Mendelian
synonyms:
- 17q12 microdeletion syndrome
- 17q12 deletion syndrome
- 17q12 recurrent deletion syndrome
- monosomy 17q12
- Del(17)(q12)
description: >
  Chromosome 17q12 deletion syndrome is a recurrent 1.4 Mb heterozygous deletion spanning
  about fifteen genes, one of which is HNF1B. Its renal and pancreatic phenotype - cystic
  and dysplastic kidneys, and maturity-onset diabetes of the young type 5 - is HNF1B
  haploinsufficiency, and it is the same phenotype seen with an HNF1B point mutation. Its
  neurodevelopmental and neuropsychiatric phenotype is not.

  That asymmetry is the reason this deserves an entry of its own rather than a subtype line
  on HNF1B disease. A cytogenomic screen of 15,749 patients referred for neurodevelopmental
  testing found the deletion in 18, and in none of 4,519 controls; a follow-up sample found
  it in 4 of 6,340 patients with schizophrenia and in none of 47,929 controls. The authors'
  conclusion is the mechanistic claim this entry is built around: the phenotype is a
  contiguous gene syndrome that extends beyond renal cysts and diabetes syndrome, which
  HNF1B mutations alone cause. Which of the other fourteen genes carries the brain phenotype
  is not known, and the entry records that as a knowledge gap rather than guessing.

  A second contrast runs the other way, and it is counterintuitive enough to be worth
  stating. In a 201-patient cohort split evenly between HNF1B point mutations and 17q12
  deletions, the deletion carriers had advanced chronic kidney disease and end-stage renal
  disease *less* often than the mutation carriers, at diagnosis and in the long term. So
  the deletion is not simply the more severe lesion; it is a differently shaped one, milder
  in the kidney and broader in the brain. Any account that treats a whole-gene deletion as
  the maximal HNF1B allele has to answer that observation.

  Because the deletion is invisible to sequencing-based MODY panels, patients are routinely
  diagnosed with MODY5 without the syndrome being recognised. Ascertainment therefore skews
  by referral route, and reported frequencies depend heavily on whether a cohort was
  collected through nephrology, diabetology or developmental paediatrics. The frequencies
  curated below are taken from the GeneReviews figures, which were derived with a method
  intended to avoid exactly that bias.

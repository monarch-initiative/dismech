    snippet: "Here we show that mutation of MPV17 - a gene implicated in severe, infantile hepatocerebral mtDNA depletion disorders characterised by a loss of mtDNA copies - can also cause clonally-expanded mtDNA deletion and focal cytochrome c oxidase (COX) deficiency in skeletal muscle associated with an adult presentation of neuropathy and leukoencephalopathy."

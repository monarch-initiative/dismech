pathophysiology:
- name: MPV17 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic MPV17 variants remove or impair a small inner mitochondrial membrane
    protein. About half of the pathogenic variants are missense; nonsense, splice,
    frameshift and whole-exon deletion alleles are also reported. Patient fibroblasts
    show virtual absence of the protein. In vitro, recombinant MPV17 forms a
    non-selective channel, but which molecule it moves in vivo is not settled (see
    the discussion on MPV17 function).
  genes:
  - preferred_term: MPV17
    term:
      id: hgnc:7224
      label: MPV17
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic (homozygous or compound heterozygous) germline MPV17 variants.
  molecular_functions:
  - preferred_term: channel activity
    term:
      id: GO:0015267
      label: channel activity
    modifier: DECREASED
  downstream:
  - target: Mitochondrial Deoxynucleotide Insufficiency
    description: >-
      Loss of MPV17 lowers the mitochondrial dGTP and dTTP pools available for mtDNA
      synthesis.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26760297
      reference_title: "MPV17 Loss Causes Deoxynucleotide Insufficiency and Slow DNA Replication in Mitochondria."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In Mpv17 ablated mice, liver mitochondria showed substantial decreases in the levels of dGTP and dTTP and severe mitochondrial DNA depletion, whereas the dNTP pool was not significantly altered in kidney and brain mitochondria that had near normal levels of DNA."
      explanation: Measured mitochondrial dNTP loss in the knockout liver.
    - reference: PMID:26760297
      reference_title: "MPV17 Loss Causes Deoxynucleotide Insufficiency and Slow DNA Replication in Mitochondria."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Quiescent fibroblasts of MPV17-mutant patients recapitulate key features of the primary affected tissue of the Mpv17-/- mice, displaying virtual absence of the protein, decreased dNTP levels and mitochondrial DNA depletion."
      explanation: The same dNTP shortage in quiescent patient fibroblasts.
  evidence:
  - reference: PMID:16582910
    reference_title: "MPV17 encodes an inner mitochondrial membrane protein and is mutated in infantile hepatic mitochondrial DNA depletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found disease-segregating mutations in three families with hepatocerebral MDDS"
    explanation: Gene discovery by linkage and integrative genomics.
  - reference: PMID:25861990
    reference_title: "The Human Mitochondrial DNA Depletion Syndrome Gene MPV17 Encodes a Non-selective Channel That Modulates Membrane Potential."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we used electrophysiological measurements with recombinant MPV17 to reveal that this protein forms a non-selective channel with a pore diameter of 1.8 nm and located the channel's selectivity filter."
    explanation: Basis for the channel-activity annotation.
  - reference: PMID:29282788
    reference_title: "MPV17-related mitochondrial DNA maintenance defect: New cases and review of clinical, biochemical, and molecular aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Approximately half of the MPV17 pathogenic variants are missense."
    explanation: Allelic spectrum.
- name: Mitochondrial Deoxynucleotide Insufficiency
  biological_scale: MOLECULAR
  description: >-
    Mitochondrial dGTP and dTTP fall in tissues that depend on mtDNA replication
    with little de novo supply, most clearly in liver and in quiescent cells. The
    2018 review describes MPV17 as importing deoxynucleotides into mitochondria. The
    direct evidence is the measured pool deficit and its correction by
    deoxynucleoside supplementation; MPV17 has not been shown to transport a
    deoxynucleotide. A cell study also linked MPV17 loss to low mitochondrial folate
    and to uracil in mtDNA, consistent with poor thymidylate supply.
  chemical_entities:
  - preferred_term: mitochondrial dGTP
    term:
      id: CHEBI:16497
      label: dGTP
    modifier: DECREASED
  - preferred_term: mitochondrial dTTP
    term:
      id: CHEBI:18077
      label: dTTP
    modifier: DECREASED
  notes: >-
    The node binds the measured pool deficit (dGTP and dTTP) rather than a
    transport process, because MPV17 has not been shown to transport a
    deoxynucleotide. GO:0030302 deoxynucleotide transport would assert that
    unsettled mechanism.
  downstream:
  - target: Liver-Predominant mtDNA Depletion
    description: >-
      Too few deoxynucleotides slow mtDNA replication and lower mtDNA copy number.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26760297
      reference_title: "MPV17 Loss Causes Deoxynucleotide Insufficiency and Slow DNA Replication in Mitochondria."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The shortage of mitochondrial dNTPs in Mpv17-/- liver slows the DNA replication in the organelle, as evidenced by the elevated level of replication intermediates."
      explanation: Links the dNTP shortage to slowed mtDNA replication in liver.
    - reference: PMID:26760297
      reference_title: "MPV17 Loss Causes Deoxynucleotide Insufficiency and Slow DNA Replication in Mitochondria."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Notably, the mitochondrial DNA loss in the patients' quiescent fibroblasts was prevented and rescued by deoxynucleoside supplementation."
      explanation: Restoring precursors reverses the depletion, which places the dNTP shortage upstream of it.
  - target: Aberrant mtDNA Integrity
    description: >-
      Low or poor-quality dGTP raises ribonucleotide (rGMP) incorporation into mtDNA,
      and this is associated with multiple deletions in tissues with slow turnover.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:29106596
      reference_title: "Aberrant ribonucleotide incorporation and multiple deletions in mitochondrial DNA of the murine MPV17 disease model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The pattern of embedded ribonucleotides changes in a mouse model of Mpv17 deficiency, which displays a marked increase in rGMPs in mtDNA."
      explanation: Ribonucleotide misincorporation in the knockout mtDNA.
  evidence:
  - reference: PMID:29282788
    reference_title: "MPV17-related mitochondrial DNA maintenance defect: New cases and review of clinical, biochemical, and molecular aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "One of the mtDNA maintenance proteins is MPV17, which is a mitochondrial inner membrane protein involved in importing deoxynucleotides into the mitochondria."
    explanation: States the proposed import role; an introductory sentence, not a result of the case series.
  - reference: PMID:30385507
    reference_title: "The mitochondrial inner membrane protein MPV17 prevents uracil accumulation in mitochondrial DNA."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Depressed MPV17 expression reduced mitochondrial folate levels by 43% and increased uracil levels, a marker of impaired dTMP synthesis, in mtDNA by 3-fold."
    explanation: Evidence that thymidylate supply is affected in MPV17-deficient HeLa cells.
  - reference: PMID:26760297
    reference_title: "MPV17 Loss Causes Deoxynucleotide Insufficiency and Slow DNA Replication in Mitochondria."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Liver mitochondria of Mpv17-/- mice displayed reduced levels of dGTP (30% relative to the wild-type) and dTTP (35% of wild-type)"
    explanation: The measured mitochondrial dGTP and dTTP deficit in knockout liver, which is what the chemical-entity bindings record.
- name: Liver-Predominant mtDNA Depletion
  biological_scale: CELLULAR
  description: >-
    mtDNA copy number is severely reduced in liver in patients with hepatic disease;
    fibroblasts show mosaic depletion, and the knockout mouse shows severe depletion
    in liver with much less in muscle and little in brain or kidney. Why the liver is
    the most vulnerable tissue is not settled.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: mitochondrial DNA replication
    term:
      id: GO:0006264
      label: mitochondrial DNA replication
    modifier: DECREASED
  downstream:
  - target: Combined Respiratory Chain Deficiency
    description: >-
      Fewer mtDNA templates mean less synthesis of the mtDNA-encoded respiratory chain
      subunits.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16582910
      reference_title: "MPV17 encodes an inner mitochondrial membrane protein and is mutated in infantile hepatic mitochondrial DNA depletion."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "MPV17 is a mitochondrial inner membrane protein, and its absence or malfunction causes oxidative phosphorylation (OXPHOS) failure and mtDNA depletion"
      explanation: Pairs mtDNA depletion with OXPHOS failure in patients and mice.
  - target: Depletion of mitochondrial DNA in liver
    description: The tissue finding measured in liver biopsy.
    causal_link_type: DIRECT
  - target: Elevated circulating S-adenosyl methionine concentration
    description: >-
      Proposed: with mtDNA depletion, mitochondrial use of AdoMet falls and AdoMet
      accumulates and leaks into plasma. Stated as a working hypothesis by the
      reporting authors.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:22137549
      reference_title: "Two patients with hepatic mtDNA depletion syndromes and marked elevations of S-adenosylmethionine and methionine."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A working hypothesis is presented suggesting that with mitochondrial depletion the normal usage of AdoMet by mitochondria is impaired, AdoMet accumulates in the cytoplasm of affected cells poor in glycine N-methyltransferase activity, the accumulated AdoMet causes methionine to accumulate by inhibiting activity of methionine adenosyltransferase II, and that both AdoMet and methionine consequently leak abnormally into the plasma."
      explanation: The authors' proposed link from mtDNA depletion to raised AdoMet and methionine.
  - target: Hypermethioninemia
    description: >-
      Proposed: accumulated AdoMet inhibits methionine adenosyltransferase II, so
      methionine accumulates. A working hypothesis, as for the AdoMet edge.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:22137549
      reference_title: "Two patients with hepatic mtDNA depletion syndromes and marked elevations of S-adenosylmethionine and methionine."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A working hypothesis is presented suggesting that with mitochondrial depletion the normal usage of AdoMet by mitochondria is impaired, AdoMet accumulates in the cytoplasm of affected cells poor in glycine N-methyltransferase activity, the accumulated AdoMet causes methionine to accumulate by inhibiting activity of methionine adenosyltransferase II, and that both AdoMet and methionine consequently leak abnormally into the plasma."
      explanation: The authors' proposed link from mtDNA depletion to hypermethioninemia.
  evidence:
  - reference: PMID:23714749
    reference_title: "Clinical, biochemical, cellular and molecular characterization of mitochondrial DNA depletion syndrome due to novel mutations in the MPV17 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mtDNA depletion in liver was demonstrated in all seven cases where liver tissue was available."
    explanation: Liver depletion is consistent in patients.
  - reference: PMID:18818194
    reference_title: "Early-onset liver mtDNA depletion and late-onset proteinuric nephropathy in Mpv17 knockout mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found severe mtDNA depletion in liver and, albeit to a lesser extent, in skeletal muscle, whereas hardly any depletion was detected in brain and kidney, up to 1 year after birth."
    explanation: Tissue pattern of depletion in the knockout mouse.
- name: Combined Respiratory Chain Deficiency
  biological_scale: CELLULAR
  description: >-
    Loss of mtDNA-encoded subunits reduces oxidative phosphorylation in affected
    tissue, especially liver. This energy failure is proposed to drive hepatocellular
    injury and the lactic acidosis.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  biological_processes:
  - preferred_term: oxidative phosphorylation
    term:
      id: GO:0006119
      label: oxidative phosphorylation
    modifier: DECREASED
  downstream:
  - target: Hepatocellular Injury and Progressive Liver Failure
    description: >-
      Energy failure in hepatocytes leads to cholestasis, steatosis, fibrosis and
      liver failure.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Impaired Hepatic Fasting Glucose Homeostasis
    description: >-
      The failing liver cannot maintain glucose between feeds.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Lactic acidosis
    description: Impaired oxidative metabolism raises lactate.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:

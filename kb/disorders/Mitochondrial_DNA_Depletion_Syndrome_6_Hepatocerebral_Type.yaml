    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "MPV17-related mtDNA maintenance defect is inherited in an autosomal recessive manner."
    explanation: States the mode of inheritance.
  - reference: PMID:22593919
    reference_title: "MPV17-Related Mitochondrial DNA Maintenance Defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

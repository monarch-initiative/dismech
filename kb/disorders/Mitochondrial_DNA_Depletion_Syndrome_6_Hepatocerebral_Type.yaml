    explanation: Links ribonucleotide misincorporation to both depletion and deletions.
- name: Peripheral Nerve Involvement
  biological_scale: TISSUE
  description: >-
    A motor and sensory peripheral neuropathy that follows the metabolic and hepatic
    stage and dominates in longer survivors, most prominently in Navajo
    neurohepatopathy, where loss of sensation leads to corneal anaesthesia and acral
    mutilation. Whether the nerve disease reflects local mtDNA depletion, multiple
    deletions, or a secondary effect of liver failure is not established, so no edge
    is drawn from the depletion chain in the infantile form.

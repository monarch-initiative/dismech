    explanation: Ophthalmoparesis and ptosis in adult-onset disease.
progression:
- phase: Infantile metabolic and hepatic onset
  notes: >-
    Most present in the first months with metabolic derangement (hypoglycaemia,
    lactic acidosis) and liver dysfunction. In a UK liver-centre series liver
    involvement developed at a median of 2.5 months.
  evidence:
  - reference: PMID:18695062
    reference_title: "Hepatocerebral form of mitochondrial DNA depletion syndrome: novel MPV17 mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data confirm that MPV17 mutations are associated with a 2-stage syndrome. The first symptoms are metabolic and rapidly progress to hepatic failure."
    explanation: The first, metabolic and hepatic stage.
  - reference: PMID:37204315
    reference_title: "Hepatic presentations of mitochondrial DNA depletion syndrome in children: A single tertiary liver centre experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "liver involvement developed at a median age of 2.5 and 11 months with MPV17 and POLG patients, respectively."
    explanation: Age at liver involvement for MPV17.
- phase: Neurological involvement and outcome
  notes: >-
    Central and peripheral neurological involvement follows. Death from liver
    failure in infancy is common: half of ten MPV17 patients in one centre died at a
    median of 8 months, and none of 24 South African infants with c.106C>T survived
    infancy. Homozygous p.R50Q, p.P98L and p.R41Q are associated with longer
    survival.
  evidence:
  - reference: PMID:37204315
    reference_title: "Hepatic presentations of mitochondrial DNA depletion syndrome in children: A single tertiary liver centre experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seventeen patients died at a median age of 8 months (range, 1-312) after a median time of 5.6 months from presentation: 5/7 POLG at 53 months, 7/7 DGUOK at 8 months and 5/10 MPV17 at 8 months."
    explanation: Mortality and its timing in the MPV17 subgroup.
  - reference: PMID:29318572
    reference_title: "Identification of a single MPV17 nonsense-associated altered splice variant in 24 South African infants with mitochondrial neurohepatopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected infants all presented with infantile onset neurohepatopathy with none surviving beyond infancy."
    explanation: Uniform infant mortality with the c.106C>T allele.
  - reference: PMID:29282788
    reference_title: "MPV17-related mitochondrial DNA maintenance defect: New cases and review of clinical, biochemical, and molecular aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A genotype with biallelic missense variants, in particular homozygous p.R50Q, p.P98L, and p.R41Q, can carry a relatively better prognosis."
    explanation: Genotypes associated with longer survival.
histopathology:
- name: Liver histology
  description: >-
    Liver from children dying of hepatocerebral MTDPS (DGUOK, MPV17 and POLG) shows a
    moderately reproducible pattern of parenchymal damage; steatosis, cholestasis
    and fibrosis progressing to cirrhosis are described. Gene-specific MPV17
    frequencies are not given in the cited abstracts.
  evidence:
  - reference: PMID:30509056
    reference_title: "Histopathological liver findings in patients with hepatocerebral mitochondrial depletion syndrome with defined molecular basis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Material comprising eight autopsy and five liver biopsy specimens showed a moderately reproducible pattern of parenchymal damage, which we consider potentially helpful in the differential diagnosis and planning of the diagnostic investigation in families of children who died due to early-onset acute liver failure and encephalopathy."
    explanation: Liver pattern across the hepatocerebral MTDPS genes, including MPV17.
genetic:
- name: MPV17
  gene_term:
    preferred_term: MPV17
    term:
      id: hgnc:7224
      label: MPV17
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    ClinGen classifies MPV17 as Definitive for a lumped "mitochondrial disease"
    (MONDO:0044970) rather than for MONDO:0009747, so no gene_disease_validity tier
    is recorded here. Recurrent alleles: p.R50Q (Navajo and Italian, arisen
    independently), c.106C>T (Black South African, carrier frequency about
    1 in 68), which causes both exon 3 skipping and premature termination, and
    c.451dupC, carried by eight MPV17-deficient patients in a Japanese cohort.
  evidence:
  - reference: PMID:32703289
    reference_title: "Clinical and molecular basis of hepatocerebral mitochondrial DNA depletion syndrome in Japan: evaluation of outcomes after liver transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eight MPV17-deficient patients harbored c.451dupC and all three DGUOK-deficient patients harbored c.143-307_170del335."
    explanation: Recurrent c.451dupC allele in Japanese MPV17-deficient patients.
  - reference: CGGV:assertion_fc7c6e4d-1a22-4ab4-b1d5-8de6bcc3b961-2022-07-21T040000.000Z
    reference_title: "MPV17 / mitochondrial disease (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "MPV17 | HGNC:7224 | mitochondrial disease | MONDO:0044970 | AR | Definitive"
    explanation: ClinGen gene-disease validity row (lumped mitochondrial disease).
  - reference: PMID:16582910
    reference_title: "MPV17 encodes an inner mitochondrial membrane protein and is mutated in infantile hepatic mitochondrial DNA depletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found disease-segregating mutations in three families with hepatocerebral MDDS"
    explanation: Original gene discovery.
  - reference: PMID:29318572
    reference_title: "Identification of a single MPV17 nonsense-associated altered splice variant in 24 South African infants with mitochondrial neurohepatopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mRNA analysis revealed transcripts both with and without exon 3, indicating both reduced splice efficiency and premature termination as mechanisms for disease."
    explanation: Mechanism of the South African founder allele.
diagnosis:
- name: MPV17 molecular testing
  description: Biallelic pathogenic MPV17 variants establish the diagnosis.
  evidence:
  - reference: PMID:22593919
    reference_title: "MPV17-Related Mitochondrial DNA Maintenance Defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The diagnosis of MPV17-related mtDNA maintenance defect is established in a proband by the identification of biallelic pathogenic variants in MPV17 by molecular genetic testing."
    explanation: Diagnostic criterion.
- name: Brain MRI
  description: >-
    Reticular formation and reticulospinal tract lesions in an infant with liver
    dysfunction point toward MPV17 deficiency, which is useful where genetic testing
    is not readily available.
  evidence:
  - reference: PMID:40773069
    reference_title: "Retrospective observational study of the magnetic resonance imaging features of MPV17-related mitochondrial DNA depletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lesions in the reticular formation and reticulospinal tracts on brain MRI in a neonate or infant with hepatic dysfunction may represent a distinctive, albeit not specific, feature of MPV17-related mitochondrial DNA depletion syndrome."
    explanation: Proposed imaging marker.
- name: Hepatocellular carcinoma surveillance
  description: >-
    GeneReviews recommends monitoring serum alpha-fetoprotein and liver ultrasound,
    together with liver function, development, neurological and nutritional status.
  evidence:
  - reference: PMID:22593919
    reference_title: "MPV17-Related Mitochondrial DNA Maintenance Defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Serum alpha fetoprotein (AFP) concentration and hepatic ultrasound examination for evidence of hepatocellular carcinoma"
    explanation: Surveillance recommendation.
differential_diagnoses:
- name: Mitochondrial DNA depletion syndrome 3 (DGUOK deficiency)
  description: >-
    The same age group and the same infantile liver failure with neurological signs
    and liver mtDNA depletion; DGUOK patients more often have neonatal acute liver
    failure. Separated by gene testing.
  evidence:
  - reference: PMID:37204315
    reference_title: "Hepatic presentations of mitochondrial DNA depletion syndrome in children: A single tertiary liver centre experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mutations in DGUOK and MPV17 genes are associated with a severe clinical phenotype characterised by early-onset/neonatal ALF or rapidly progressive cholestasis and death before 12 months of age."
    explanation: DGUOK and MPV17 deficiency share the severe infantile hepatic phenotype.
- name: POLG-related hepatocerebral disease (Alpers-Huttenlocher syndrome)
  description: >-
    Hepatocerebral mtDNA depletion from POLG variants. Liver disease tends to begin
    later (median 11 months in one series) and can follow valproate exposure;
    refractory epilepsy is prominent.
  evidence:
  - reference: PMID:37204315
    reference_title: "Hepatic presentations of mitochondrial DNA depletion syndrome in children: A single tertiary liver centre experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Four POLG patients developed liver injury after starting sodium valproate"
    explanation: Valproate-associated liver injury distinguishes POLG disease.
- name: Tyrosinemia type 1
  description: >-
    Infants with hepatocerebral mtDNA depletion, including MPV17 deficiency, have been
    first diagnosed with tyrosinemia because jaundice, liver failure and abnormal
    amino acids overlap. Separated by gene testing.
  evidence:
  - reference: PMID:31664948
    reference_title: "Clinical and molecular characterization of three patients with Hepatocerebral form of mitochondrial DNA depletion syndrome: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These patients had overlapping clinical features with tyrosinemia. MDS should be considered a differential diagnosis in patients presenting with signs and symptoms of tyrosinemia."
    explanation: Initial tyrosinemia diagnosis in DGUOK- and MPV17-deficient infants.
- name: Charcot-Marie-Tooth disease type 2EE (MPV17-related axonal neuropathy)
  description: >-
    Juvenile- or adult-onset axonal sensorimotor neuropathy from biallelic MPV17
    variants without hepatocerebral involvement; curated as a subtype of
    Charcot-Marie-Tooth_Disease_Type_2.
treatments:
- name: Liver Transplantation
  description: >-
    The only treatment for liver failure. It is controversial because the disease is
    multisystemic and neuropathy can progress afterwards, but selected children do
    well: all three MPV17 patients transplanted in one UK centre were alive 3 to 19
    years later. In a Japanese cohort the transplanted children who died were those
    with marked neurological signs before transplant, and the MPV17-deficient
    survivors carried p.R50Q or p.P98L.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: liver transplantation
    term:
      id: NCIT:C15271
      label: Liver Transplantation
  target_mechanisms:
  - target: Hepatocellular Injury and Progressive Liver Failure
    description: Replaces the failing liver; does not correct extrahepatic tissues.
  evidence:
  - reference: PMID:22593919
    reference_title: "MPV17-Related Mitochondrial DNA Maintenance Defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Although liver transplantation remains the only treatment option for liver failure, it is controversial because of the multisystem involvement in this disorder."
    explanation: Status and controversy of transplantation.
  - reference: PMID:37204315
    reference_title: "Hepatic presentations of mitochondrial DNA depletion syndrome in children: A single tertiary liver centre experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three patients with MPV17 mutations received liver transplant (LT) at a median age of 24 months (range 5-132): all alive at 19, 18 and 3 years post-LT."
    explanation: Long-term survival after transplantation in a small series.
  - reference: PMID:32703289
    reference_title: "Clinical and molecular basis of hepatocerebral mitochondrial DNA depletion syndrome in Japan: evaluation of outcomes after liver transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the 12 transplanted patients, five, including one with mild intellectual disability, survived; while seven who had remarkable neurological symptoms before LT died. Five of the MPV17-deficient survivors had either c.149G > A or c.293C > T."
    explanation: Outcome after transplantation depends on pre-transplant neurological status and genotype (p.R50Q, p.P98L) in the Japanese cohort.
  - reference: PMID:35466509
    reference_title: "Outcomes after liver transplantation in MPV17 deficiency (Navajo neurohepatopathy): A single-center case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MPV17 deficiency should not be considered a contraindication to liver transplantation."
    explanation: Two neurologically normal infants remained neurologically normal after transplantation.
- name: Frequent Feeding and Fasting Avoidance
  description: >-
    Frequent feeds and uncooked cornstarch (1-2 g/kg/dose) to prevent hypoglycaemia;
    prolonged fasting is to be avoided. In one family liver function improved with
    three-hourly feeding or continuous glucose.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: frequent feeding with uncooked cornstarch
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Impaired Hepatic Fasting Glucose Homeostasis
    description: Supplies glucose between feeds so that hepatic glucose output is not needed.
  evidence:
  - reference: PMID:22593919
    reference_title: "MPV17-Related Mitochondrial DNA Maintenance Defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "prevention of hypoglycemia requires frequent feeds and uncooked cornstarch (1-2 g/kg/dose)"
    explanation: GeneReviews recommendation.
  - reference: PMID:19012992
    reference_title: "Glucose metabolism and diet-based prevention of liver dysfunction in MPV17 mutant patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Liver function tests improved when patients received continuous iv glucose infusion or were regularly fed every 3h."
    explanation: Observed improvement with regular feeding in one family.
  - reference: PMID:22593919
    reference_title: "MPV17-Related Mitochondrial DNA Maintenance Defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Agents/circumstances to avoid: Prolonged fasting."
    explanation: GeneReviews lists prolonged fasting as the circumstance to avoid.
- name: Deoxynucleoside Supplementation (preclinical)
  description: >-
    Proposed substrate therapy. Deoxynucleosides prevented and reversed mtDNA loss in
    quiescent patient fibroblasts. A mixture of deoxyguanosine, deoxyadenosine
    and deoxycytidine prevented depletion, and deoxyguanosine plus deoxycytidine
    alone was sufficient. No clinical data in MPV17 deficiency are cited here.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: deoxyguanosine
      term:
        id: CHEBI:17172
        label: 2'-deoxyguanosine
    - preferred_term: deoxycytidine
      term:
        id: CHEBI:15698
        label: 2'-deoxycytidine
    - preferred_term: deoxyadenosine
      term:
        id: CHEBI:17256
        label: 2'-deoxyadenosine
  target_mechanisms:
  - target: Mitochondrial Deoxynucleotide Insufficiency
    description: Raises the precursor supply for mtDNA synthesis.
  evidence:
  - reference: PMID:26760297
    reference_title: "MPV17 Loss Causes Deoxynucleotide Insufficiency and Slow DNA Replication in Mitochondria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Notably, the mitochondrial DNA loss in the patients' quiescent fibroblasts was prevented and rescued by deoxynucleoside supplementation."
    explanation: In vitro rescue in patient cells.
  - reference: PMID:26760297
    reference_title: "MPV17 Loss Causes Deoxynucleotide Insufficiency and Slow DNA Replication in Mitochondria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Supplementation of the culture medium with three deoxynucleosides, GdR, AdR and CdR prevented mtDNA depletion in three quiescent MPV17-deficient fibroblast lines"
    explanation: Names the three deoxynucleosides used in the fibroblast rescue.
  - reference: PMID:26760297
    reference_title: "MPV17 Loss Causes Deoxynucleotide Insufficiency and Slow DNA Replication in Mitochondria."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "an exception was GdR plus CdR, which was sufficient to prevent significant mtDNA depletion in all three MPV17-deficient fibroblast lines tested"
    explanation: Deoxyguanosine plus deoxycytidine alone was enough to prevent depletion.
- name: Liver-Directed MPV17 Gene Replacement (preclinical)
  description: >-
    AAV-mediated liver expression of human MPV17 restored liver mtDNA and OXPHOS in
    the knockout mouse and prevented ketogenic-diet-induced liver failure. Animal
    data only.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  target_mechanisms:
  - target: MPV17 Loss of Function
    description: Restores MPV17 in hepatocytes.
  evidence:
  - reference: PMID:24247928
    reference_title: "AAV-mediated liver-specific MPV17 expression restores mtDNA levels and prevents diet-induced liver failure."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, when expression of human MPV17 is carried out by adeno-associated virus (AAV)-mediated gene replacement, the Mpv17 knockout mice are able to reconstitute the Mpv17-containing supramolecular complex, restore liver mtDNA copy number and oxidative phosphorylation (OXPHOS) proficiency, and prevent liver failure induced by the KD."
    explanation: Rescue in the mouse model.
environmental:
- name: Perinatal zidovudine prophylaxis
  description: >-
    In a South African natural-history study, infants given antiretroviral
    prophylaxis at birth (7 of 8 with zidovudine) presented much earlier and more
    often developed liver failure. Zidovudine is a thymidine analogue with known
    mitochondrial toxicity. The data are observational, from 25 infants.
  exposure_term:
    preferred_term: perinatal zidovudine prophylaxis
    term:
      id: ECTO:2000062
      label: exposure to antiretroviral therapy
  notes: >-
    OLS search of ECTO for "zidovudine" returned no term; "antiretroviral" returned
    ECTO:2000062 exposure to antiretroviral therapy, which is bound here with the
    specific agent kept in preferred_term.
  influences_mechanisms:
  - target: Combined Respiratory Chain Deficiency
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Associated with earlier symptom onset and more liver failure, consistent with
      an added insult to mtDNA maintenance.
    evidence:
    - reference: PMID:42192320
      reference_title: "Neonatal HIV prophylaxis is associated with accelerated presentation and clinical progression of MPV17-related mitochondrial neurohepatopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Symptom onset occurred much earlier at a median of 3 days of age (IQR 0-10 days) in HIV-exposed infants compared to 60 days (IQR 14-90) in HIV-unexposed (p = 0.006). Infants exposed to HIV were more likely to develop liver failure (p = 0.02)."
      explanation: Earlier onset and more liver failure in infants given prophylaxis.
  evidence:
  - reference: PMID:42192320
    reference_title: "Neonatal HIV prophylaxis is associated with accelerated presentation and clinical progression of MPV17-related mitochondrial neurohepatopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Perinatal therapy with the nucleoside reverse transcriptase inhibitor zidovudine, a known mitochondrial toxin, was associated with accelerated clinical presentation and clinical course of MPV17 neurohepatopathy."
    explanation: Study conclusion.
- name: Intercurrent infection
  description: >-
    Recurrent metabolic acidosis with intercurrent infections is one of the defining
    features of Navajo neurohepatopathy; infection acts as a trigger for
    decompensation, not a cause.
  exposure_term:
    preferred_term: intercurrent infection
  notes: >-
    Left unbound. OLS ECTO searches for "infection" returned only agent-specific
    terms (ECTO:2000053 exposure to Human Papillomavirus Infection, ECTO:3000104
    exposure to Infectious bronchitis virus); "infectious agent" and "pathogen"
    returned no ECTO exposure term. ECTO:3000001 exposure to virus is narrower
    than the source, which does not name the agent.
  influences_mechanisms:
  - target: Combined Respiratory Chain Deficiency
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Intercurrent infection precipitates episodes of metabolic acidosis on a
      background of limited oxidative capacity.
    evidence:
    - reference: PMID:16909392
      reference_title: "Navajo neurohepatopathy is caused by a mutation in the MPV17 gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The major clinical features are hepatopathy, peripheral neuropathy, corneal anesthesia and scarring, acral mutilation, cerebral leukoencephalopathy, failure to thrive, and recurrent metabolic acidosis with intercurrent infections."
      explanation: Metabolic acidosis recurs with intercurrent infections in Navajo neurohepatopathy.
  evidence:
  - reference: PMID:16909392
    reference_title: "Navajo neurohepatopathy is caused by a mutation in the MPV17 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The major clinical features are hepatopathy, peripheral neuropathy, corneal anesthesia and scarring, acral mutilation, cerebral leukoencephalopathy, failure to thrive, and recurrent metabolic acidosis with intercurrent infections."
    explanation: Intercurrent infection is linked to metabolic decompensation in Navajo neurohepatopathy.
animal_models:
- name: Mpv17 knockout mouse
  species: Mouse
  genotype: Mpv17-/-
  publication: PMID:18818194
  description: >-
    Severe liver mtDNA depletion from early life, with less in muscle and little in
    brain or kidney. On a standard diet the liver does not fail; a ketogenic diet
    induces cirrhosis and liver failure. Late-onset focal segmental
    glomerulosclerosis, inner-ear degeneration and early greying are the main
    spontaneous phenotypes, and aged mice accumulate multiple mtDNA deletions in
    brain.
  modeled_mechanisms:
  - target: Liver-Predominant mtDNA Depletion
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: Liver-predominant mtDNA depletion matching the human tissue pattern.
    evidence:
    - reference: PMID:18818194
      reference_title: "Early-onset liver mtDNA depletion and late-onset proteinuric nephropathy in Mpv17 knockout mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We found severe mtDNA depletion in liver and, albeit to a lesser extent, in skeletal muscle, whereas hardly any depletion was detected in brain and kidney, up to 1 year after birth."
      explanation: Tissue pattern of depletion.
  - target: Mitochondrial Deoxynucleotide Insufficiency
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Low liver mitochondrial dGTP and dTTP.
    readouts:
    - name: Liver mitochondrial dGTP and dTTP
      target: Mitochondrial Deoxynucleotide Insufficiency
      direction: DECREASED
      evidence:
      - reference: PMID:26760297
        reference_title: "MPV17 Loss Causes Deoxynucleotide Insufficiency and Slow DNA Replication in Mitochondria."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In Mpv17 ablated mice, liver mitochondria showed substantial decreases in the levels of dGTP and dTTP and severe mitochondrial DNA depletion, whereas the dNTP pool was not significantly altered in kidney and brain mitochondria that had near normal levels of DNA."
        explanation: Measured pools.
  - target: Hepatocellular Injury and Progressive Liver Failure
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: No liver failure on a standard diet; liver failure only after a ketogenic diet.
    limitations: >-
      The human disease's defining liver failure does not occur spontaneously, so the
      model needs a dietary stress to study the hepatic outcome, and its spontaneous
      phenotype is renal and cochlear rather than hepatocerebral.
    evidence:
    - reference: PMID:18818194
      reference_title: "Early-onset liver mtDNA depletion and late-onset proteinuric nephropathy in Mpv17 knockout mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In spite of severe mtDNA depletion, only moderate decrease in respiratory chain enzymatic activities, and mild cytoarchitectural alterations, were observed in the Mpv17(-/-) livers, but neither cirrhosis nor failure ever occurred in this organ at any age."
      explanation: No spontaneous liver failure.
    - reference: PMID:24247928
      reference_title: "AAV-mediated liver-specific MPV17 expression restores mtDNA levels and prevents diet-induced liver failure."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "On a standard diet, Mpv17-/- mouse shows hardly any symptom of liver dysfunction, but a ketogenic diet (KD) leads these animals to liver cirrhosis and failure."
      explanation: Liver failure requires a ketogenic-diet stress.
  - target: Aberrant mtDNA Integrity
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Increased rGMP in mtDNA and late multiple deletions in brain.
    evidence:
    - reference: PMID:29106596
      reference_title: "Aberrant ribonucleotide incorporation and multiple deletions in mitochondrial DNA of the murine MPV17 disease model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Embedded rGMPs are expected to distort the mtDNA and impede its replication, and elevated rGMP incorporation is associated with early-onset mtDNA depletion in liver and late-onset multiple deletions in brain of Mpv17-/- mice."
      explanation: Ribonucleotide incorporation and deletions in the mouse.
- name: mpv17 null zebrafish (roy orbison / transparent casper)
  species: Zebrafish
  genotype: mpv17-/-
  publication: PMID:30833296
  description: >-
    The mpv17 null fish lacks iridophores (guanine-based reflective cells) and shows
    early ultrastructural damage to liver mitochondria with respiratory chain
    impairment. The pyrimidine precursor orotic acid increased iridophore number and
    mtDNA content.
  modeled_mechanisms:
  - target: Combined Respiratory Chain Deficiency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Liver mitochondrial damage and respiratory chain impairment.
    limitations: >-
      The authors judge the effect on mtDNA copy number to be secondary in the fish,
      unlike the human and mouse liver, and the most visible phenotype (iridophore
      loss) has no human counterpart.
    evidence:
    - reference: PMID:30833296
      reference_title: "The zebrafish orthologue of the human hepatocerebral disease gene MPV17 plays pleiotropic roles in mitochondria."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In this study, we characterized the mitochondrial phenotype of mpv17-/- larvae and found early and severe ultrastructural alterations in liver mitochondria, as well as significant impairment of the respiratory chain, leading to activation of the mitochondrial quality control."
      explanation: Liver mitochondrial and respiratory chain phenotype.
    - reference: PMID:30833296
      reference_title: "The zebrafish orthologue of the human hepatocerebral disease gene MPV17 plays pleiotropic roles in mitochondria."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our results provide evidence for zebrafish Mpv17 being essential for maintaining mitochondrial structure and functionality, while its effects on mtDNA copy number seem to be subordinate."
      explanation: mtDNA depletion is not the leading defect in the fish.
- name: Neuron-specific dMpv17 knockdown Drosophila
  species: Fruit fly
  genotype: Nervous-system knockdown of CG11077 (dMpv17)
  publication: PMID:36587049
  description: >-
    Neural knockdown of the fly MPV17 orthologue reduces mtDNA and ATP, raises
    lactate and reactive oxygen species, impairs larval locomotion and learning,
    and alters presynaptic neuromuscular junction morphology. The authors describe it
    as the first model to show the neurological defects the mouse, zebrafish and
    human cell models lack.
  modeled_mechanisms:
  - target: Central Nervous System Involvement
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Impaired locomotion and learning with neural mitochondrial dysfunction.
    limitations: >-
      An invertebrate knockdown confined to the nervous system, so it cannot show the
      liver disease or whether the human neurological disease is primary or
      secondary to liver failure; larval behaviour stands in for the human
      encephalopathy and leukoencephalopathy.
    evidence:
    - reference: PMID:36587049
      reference_title: "A Drosophila model of the neurological symptoms in Mpv17-related diseases."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The resulting dMpv17 knockdown larvae showed impaired locomotor activity and learning ability consistent with mitochondrial defects suggested by the reductions in mitochondrial DNA and ATP production and the increases in the levels of lactate and reactive oxygen species."
      explanation: Neurological and mitochondrial phenotype of the neural knockdown.
  - target: Peripheral Nerve Involvement
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: Abnormal presynaptic neuromuscular junction morphology.
    limitations: >-
      A larval neuromuscular junction defect is not a length-dependent sensorimotor
      neuropathy, and no sensory loss is measured.
    evidence:
    - reference: PMID:36587049
      reference_title: "A Drosophila model of the neurological symptoms in Mpv17-related diseases."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, an abnormal morphology of the neuromuscular junction, at the presynaptic terminal, was observed in dMpv17 knockdown larvae."
      explanation: Presynaptic neuromuscular junction defect in the knockdown.
discussions:
- discussion_id: mpv17_molecular_function
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What does MPV17 move across the inner mitochondrial membrane, and how does its
    loss lower mitochondrial dGTP and dTTP?
  attaches_to:
  - pathophysiology#MPV17 Loss of Function
  - pathophysiology#Mitochondrial Deoxynucleotide Insufficiency
  rationale: >-
    The dNTP deficit and its rescue by deoxynucleosides are established, but the
    protein's own activity is not. Recombinant MPV17 forms a non-selective channel
    in vitro; a cell study links it to mitochondrial folate and thymidylate supply;
    the zebrafish work links it to pyrimidine de novo synthesis through
    dihydroorotate dehydrogenase. These are not mutually exclusive and none shows
    transport of a deoxynucleotide directly. The answer decides whether substrate
    therapy (deoxynucleosides, orotic acid, folate) is aimed at the right step.
  evidence:
  - reference: PMID:25861990
    reference_title: "The Human Mitochondrial DNA Depletion Syndrome Gene MPV17 Encodes a Non-selective Channel That Modulates Membrane Potential."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "we used electrophysiological measurements with recombinant MPV17 to reveal that this protein forms a non-selective channel with a pore diameter of 1.8 nm and located the channel's selectivity filter."
    explanation: Channel hypothesis.
  - reference: PMID:30385507
    reference_title: "The mitochondrial inner membrane protein MPV17 prevents uracil accumulation in mitochondrial DNA."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results indicate that MPV17 provides a third dTMP source, potentially by serving as a transporter that transfers dTMP from the cytosol to mitochondria to sustain mtDNA synthesis."
    explanation: dTMP transporter hypothesis.
  - reference: PMID:30833296
    reference_title: "The zebrafish orthologue of the human hepatocerebral disease gene MPV17 plays pleiotropic roles in mitochondria."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Treatment with OA, an easily available food supplement, significantly increased both iridophore number and mtDNA content in mpv17-/- mutants, thus linking the loss of Mpv17 to pyrimidine de novo synthesis and opening a new simple therapeutic approach for MPV17-related MDS."
    explanation: Pyrimidine de novo synthesis hypothesis.
notes: >-
  MPV17 axonal neuropathy without hepatocerebral disease (CMT2EE) is curated as a
  subtype of Charcot-Marie-Tooth_Disease_Type_2 and is not repeated here. Orphanet
  ORPHA:255229 (the MONDO xref for this term) was not cited because the Orphadata
  bulk files were not available to build its cache record.

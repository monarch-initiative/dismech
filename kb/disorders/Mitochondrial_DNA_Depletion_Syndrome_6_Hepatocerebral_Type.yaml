name: Mitochondrial DNA Depletion Syndrome 6 (Hepatocerebral Type)
creation_date: "2026-10-27T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: mitochondrial DNA depletion syndrome 6 (hepatocerebral type)
  term:
    id: MONDO:0009747
    label: mitochondrial DNA depletion syndrome 6 (hepatocerebral type)
synonyms:
- MTDPS6
- MPV17-related mitochondrial DNA maintenance defect
- MPV17-related hepatocerebral mitochondrial DNA depletion syndrome
- MPV17 deficiency
- Navajo neurohepatopathy
- Navajo neuropathy
description: >-
  Autosomal recessive mitochondrial DNA (mtDNA) maintenance disorder caused by
  biallelic MPV17 variants. MPV17 is a small inner mitochondrial membrane protein.
  Its loss leaves mitochondria short of deoxynucleotides (dGTP and dTTP) for mtDNA
  synthesis, which produces severe mtDNA depletion, most marked in the liver, and a
  combined deficiency of the mtDNA-encoded respiratory chain complexes. Most patients
  present in infancy with an encephalohepatopathic disease: cholestatic liver
  dysfunction progressing to liver failure, fasting hypoglycaemia, lactic acidosis,
  failure to thrive and feeding difficulty, with hypotonia, developmental delay and a
  motor and sensory peripheral neuropathy that becomes more prominent in survivors.
  Progressive liver disease usually causes death in infancy or early childhood;
  hepatocellular carcinoma has been reported. Navajo neurohepatopathy, caused by
  homozygous p.R50Q, is the same disease with a longer course and prominent
  neuropathy, corneal anaesthesia and leukoencephalopathy. A rare later-onset
  neuromyopathic presentation with multiple mtDNA deletions in muscle is also
  reported. Liver transplantation is the only treatment for liver failure and is
  contested because the disease is multisystemic; frequent feeding to avoid fasting
  is the main supportive measure.
parents:
- mitochondrial DNA depletion syndrome, hepatocerebral form
- mitochondrial DNA maintenance defect
classifications:
  harrisons_chapter:
  - classification_value: GASTROINTESTINAL
    notes: >-
      Progressive liver disease is the leading feature and the usual cause of death,
      so the hepatology chapter is the primary placement.
    evidence:
    - reference: PMID:22593919
      reference_title: "MPV17-Related Mitochondrial DNA Maintenance Defect."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Progressive liver disease often leads to death in infancy or early childhood."
      explanation: Liver disease is the defining and usually fatal organ involvement.
  - classification_value: NEUROLOGIC
    notes: >-
      Neurological involvement (hypotonia, developmental delay, peripheral neuropathy,
      leukoencephalopathy) is part of the encephalohepatopathic form and dominates in
      longer survivors.
  icimd_category:
  - classification_value: nucleotide_pool_maintenance
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416): group "Nucleotide pool
      maintenance" under category "Mitochondrial DNA maintenance and replication",
      the same placement as DGUOK. MPV17 loss lowers mitochondrial dGTP and dTTP,
      which is the mechanism the group is defined by.
  mechanistic_category:
  - classification_value: mitochondrial disease
    evidence:
    - reference: PMID:16582910
      reference_title: "MPV17 encodes an inner mitochondrial membrane protein and is mutated in infantile hepatic mitochondrial DNA depletion."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "MPV17 is a mitochondrial inner membrane protein, and its absence or malfunction causes oxidative phosphorylation (OXPHOS) failure and mtDNA depletion"
      explanation: >-
        OXPHOS failure secondary to mtDNA depletion from a nuclear-gene defect places
        this among the primary mitochondrial diseases.
references:
- reference: PMID:22593919
  title: "MPV17-Related Mitochondrial DNA Maintenance Defect."
  tags:
  - GeneReviews
has_subtypes:
- name: Infantile Encephalohepatopathic
  display_name: Infantile encephalohepatopathic (hepatocerebral) form
  description: >-
    The usual presentation. Onset in the first months of life with liver
    dysfunction progressing to liver failure, hypoglycaemia, lactic acidosis, failure
    to thrive and neurological signs. Without liver transplantation most affected
    infants die in infancy. Some infants present with isolated, rapidly progressive
    liver failure and little neurological dysfunction.
  genes:
  - preferred_term: MPV17
    term:
      id: hgnc:7224
      label: MPV17
  evidence:
  - reference: PMID:29282788
    reference_title: "MPV17-related mitochondrial DNA maintenance defect: New cases and review of clinical, biochemical, and molecular aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The vast majority of affected individuals presented with an early-onset encephalohepatopathic disease characterized by hepatic and neurological manifestations, failure to thrive, lactic acidemia, and mtDNA depletion detected mainly in liver tissue."
    explanation: Defines the majority form across 100 reviewed patients.
  - reference: PMID:17694548
    reference_title: "Mutations in the MPV17 gene are responsible for rapidly progressive liver failure in infancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Importantly, 2 of these cases presented with isolated liver failure during infancy without notable neurologic dysfunction."
    explanation: Isolated liver failure is part of the infantile spectrum.
- name: Navajo Neurohepatopathy
  display_name: Navajo neurohepatopathy (homozygous p.R50Q)
  description: >-
    The form originally described in Navajo children in the southwestern United
    States, caused by homozygous MPV17 p.R50Q. Hepatopathy is accompanied by a
    prominent sensorimotor neuropathy, corneal anaesthesia and scarring, acral
    mutilation and leukoencephalopathy, and infantile, childhood and classic forms
    are described. Homozygous p.R50Q carries a relatively better prognosis than most
    other genotypes. The same variant arose independently in an Italian family.
  genes:
  - preferred_term: MPV17
    term:
      id: hgnc:7224
      label: MPV17
  evidence:
  - reference: PMID:16909392
    reference_title: "Navajo neurohepatopathy is caused by a mutation in the MPV17 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The major clinical features are hepatopathy, peripheral neuropathy, corneal anesthesia and scarring, acral mutilation, cerebral leukoencephalopathy, failure to thrive, and recurrent metabolic acidosis with intercurrent infections."
    explanation: Clinical definition of Navajo neurohepatopathy.
  - reference: PMID:16909392
    reference_title: "Navajo neurohepatopathy is caused by a mutation in the MPV17 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequencing of the MPV17 gene in six patients with NNH from five families revealed the homozygous R50Q mutation described elsewhere."
    explanation: Establishes homozygous p.R50Q as the cause.
  - reference: PMID:18261905
    reference_title: "Lack of founder effect for an identical mtDNA depletion syndrome (MDS)-associated MPV17 mutation shared by Navajos and Italians."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Complete discordance between Italian and Navajo haplotypes rules out the former hypothesis, suggesting that the mutation occurred independently in the two populations."
    explanation: p.R50Q is a recurrent rather than a single-founder allele.
- name: Later-Onset Neuromyopathic
  display_name: Later-onset neuromyopathic form
  description: >-
    Rare juvenile- or adult-onset disease with myopathy and peripheral neuropathy and
    little or no liver involvement, associated with multiple mtDNA deletions in
    skeletal muscle rather than depletion. Reported features include ptosis,
    ophthalmoparesis, leukoencephalopathy, diabetes, gastrointestinal dysmotility and
    parkinsonism. Isolated axonal neuropathy from biallelic MPV17 variants is curated
    separately as the CMT2EE subtype of Charcot-Marie-Tooth_Disease_Type_2.
  genes:
  - preferred_term: MPV17
    term:
      id: hgnc:7224
      label: MPV17
  evidence:
  - reference: PMID:29282788
    reference_title: "MPV17-related mitochondrial DNA maintenance defect: New cases and review of clinical, biochemical, and molecular aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rarely, MPV17 deficiency can cause a late-onset neuromyopathic disease characterized by myopathy and peripheral neuropathy with no or minimal liver involvement."
    explanation: Defines the later-onset neuromyopathic form.
  - reference: PMID:22964873
    reference_title: "MPV17 Mutations Causing Adult-Onset Multisystemic Disorder With Multiple Mitochondrial DNA Deletions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 65-year-old man with axonal sensorimotor peripheral neuropathy, ptosis, ophthalmoparesis, diabetes mellitus, exercise intolerance, steatohepatopathy, depression, parkinsonism, and gastrointestinal dysmotility."
    explanation: Adult-onset multisystem case.

    concentrate the disease in particular populations: p.R50Q in Navajo children and
    c.106C>T in Black South African infants.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:22593919

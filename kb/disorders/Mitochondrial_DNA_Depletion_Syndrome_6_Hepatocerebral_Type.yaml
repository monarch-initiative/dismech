    reference_title: "MPV17 encodes an inner mitochondrial membrane protein and is mutated in infantile hepatic mitochondrial DNA depletion."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MPV17 is a mitochondrial inner membrane protein, and its absence or malfunction causes oxidative phosphorylation (OXPHOS) failure and mtDNA depletion"
    explanation: OXPHOS failure accompanies the depletion.
- name: Hepatocellular Injury and Progressive Liver Failure
  biological_scale: TISSUE
  description: >-
    Liver dysfunction typically begins in the first months with cholestasis, raised
    transaminases, hepatomegaly and steatosis, and progresses to fibrosis, cirrhosis
    and liver failure. Hepatocellular carcinoma has been reported in survivors.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  downstream:

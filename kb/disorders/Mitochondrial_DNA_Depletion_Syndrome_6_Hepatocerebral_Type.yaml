    causal_link_type: DIRECT
  - target: Hepatocellular carcinoma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Impaired Hepatic Fasting Glucose Homeostasis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:22593919
    reference_title: "MPV17-Related Mitochondrial DNA Maintenance Defect."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Hepatic manifestations (liver dysfunction that typically progresses to liver failure, cholestasis, hepatomegaly, and steatosis)"
    explanation: GeneReviews summary of the hepatic disease.
- name: Impaired Hepatic Fasting Glucose Homeostasis
  biological_scale: ORGANISM
  description: >-
    Patients become hypoglycaemic within a few hours of a meal and do not respond to
    glucagon, which is consistent with failure of hepatic glucose release. Liver
    function tests improved with continuous glucose or three-hourly feeding in one
    family, the rationale for frequent feeding and uncooked cornstarch.
  downstream:

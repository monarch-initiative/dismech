    reference_title: "PLD3 and PLD4 synthesize S,S-BMP, a key phospholipid enabling lipid degradation in lysosomes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Deletion of PLD3 or PLD4 markedly reduced BMP levels in cells or in murine tissues where either enzyme is highly expressed (brain for PLD3; spleen for PLD4), leading to gangliosidosis and lysosomal abnormalities."

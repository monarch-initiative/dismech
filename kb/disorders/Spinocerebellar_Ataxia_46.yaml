    causal_link_type: DIRECT
  - target: Reduced Lysosomal S,S-BMP Synthesis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:30312375
    reference_title: PLD3 and spinocerebellar ataxia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, detection of the luminal domain of PLD3-L308P revealed a significantly reduced lysosomal localization, but increased co-localization with the ER marker KDEL, implicating sorting or folding defects due to the patient's point mutation."
    explanation: The mutant protein is retained in the ER instead of reaching lysosomes.
  - reference: PMID:30312375
    reference_title: PLD3 and spinocerebellar ataxia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In contrast, the PLD3-L308P mutation led to strikingly reduced proteolytic cleavage of full-length PLD3, and both the 50 kDa and 12 kDa fragment were almost completely absent"
    explanation: The mutant protein is not processed into its mature lysosomal form.
  - reference: PMID:29386126
    reference_title: Unconventional Trafficking of Mammalian Phospholipase D3 to Lysosomes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "PLD3 reaches lysosomes as a type II transmembrane protein via a (for mammalian cells) uncommon intracellular biosynthetic route that depends on the ESCRT (endosomal sorting complex required for transport) machinery."
    explanation: The normal trafficking route that the mutant fails to complete.
- name: Impaired Lysosomal Degradation of Single-Stranded Nucleic Acids
  biological_scale: CELLULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    PLD3 is the main acid 5' exonuclease in cultured cells, and its major
    physiological substrate is mitochondrial DNA. In PLD3-deficient neurons
    and cell lines, mtDNA builds up in lysosomes and leaks into the cytosol,
    where it activates cGAS-STING signalling. These consequences come from
    PLD3-deficient cells studied in an Alzheimer's disease context; none has
    been shown in SCA46 patients or tested for the L308P variant, so the node
    records the expected cellular result of losing PLD3 exonuclease
    activity.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: DNA catabolic process
    modifier: DECREASED
    term:
      id: GO:0006308
      label: DNA catabolic process
  cellular_components:
  - preferred_term: lysosome
    term:
      id: GO:0005764
      label: lysosome
  downstream:
  - target: Large-Fiber Sensory Axonal Degeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Cerebellar Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30312375
      reference_title: PLD3 and spinocerebellar ataxia.
      supports: REFUTE
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Importantly, we generated PLD3 knockout (KO) mice that do not present signs of cerebellar degeneration or spinocerebellar ataxia, challenging the interpretation of the suggested loss-of-function mechanism or PLD3 as the SCA46-causative gene."
      explanation: >-
        Complete loss of Pld3 in mice does not affect the cerebellum, which argues against this step.
    - reference: PMID:30312375
      reference_title: PLD3 and spinocerebellar ataxia.
      supports: REFUTE
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "We were surprised at the suggested causative role of PLD3 for cerebellar ataxia, since our protein expression data generated by immunoblot with a PLD3-specific antibody showed lowest PLD3 expression levels in the adult cerebellum compared to all other brain regions"
      explanation: >-
        Low cerebellar expression makes a cell-autonomous cerebellar effect of PLD3 loss less likely.
    - reference: PMID:34815492
      reference_title: Loss of zinc-finger protein 212 leads to Purkinje cell death and locomotive abnormalities with phospholipase D3 downregulation.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "We confirmed the reduction of Zfp212 and Pld3 in the Cb of an alcohol-induced cerebellar degeneration mouse model, suggesting that the ZNF212-PLD3 relationship is important for Purkinje cell survival."
      explanation: >-
        Reduced Pld3 accompanies Purkinje cell loss in Zfp212 knockout and alcohol-exposed mice; correlational, since Pld3 itself was not manipulated.
  evidence:
  - reference: PMID:33288674
    reference_title: "Quantification and characterization of the 5' exonuclease activity of the lysosomal nuclease PLD3 by a novel cell-based assay."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our experiments revealed PLD3 as the principal acid 5' exonuclease in HeLa cells, where it showed a markedly higher specific activity compared with PLD4."
    explanation: PLD3 is the main lysosomal enzyme of this kind in cultured cells.
  - reference: PMID:37225734
    reference_title: Phospholipase D3 degrades mitochondrial DNA to regulate nucleotide signaling and APP metabolism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We identified mitochondrial DNA (mtDNA) as a major physiological substrate and show its manifest build-up in lysosomes of PLD3-defective cells."
    explanation: Loss of PLD3 causes undegraded mtDNA to accumulate in lysosomes.
  - reference: PMID:37225734
    reference_title: Phospholipase D3 degrades mitochondrial DNA to regulate nucleotide signaling and APP metabolism.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Lysosomal leakage of mtDNA to the cytosol activates cGAS-STING signaling that upregulates autophagy and induces amyloid precursor C-terminal fragment (APP-CTF) and cholesterol accumulation."
    explanation: A downstream consequence shown in PLD3-deficient cells, studied in an Alzheimer's disease context.
- name: Reduced Lysosomal S,S-BMP Synthesis
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    PLD3 also synthesizes S,S-bis(monoacylglycero)phosphate (BMP), a lysosomal
    phospholipid needed to degrade lipids such as gangliosides. Pld3 deletion
    lowers brain BMP in mice. In transfected cells the L308P protein reached
    lysosomes poorly, was poorly processed and did not raise BMP levels, so
    the variant loses this function too. Whether reduced BMP contributes to
    neuropathy or ataxia in patients is unknown.
  genes:
  - preferred_term: PLD3
    term:
      id: hgnc:17158
      label: PLD3

pathophysiology:
- name: Heterozygous PLD3 Leu308Pro Variant
  biological_scale: MOLECULAR
  role: initiating genetic lesion
  mechanism_confidence: PROVISIONAL
  description: >-
    A heterozygous germline missense variant, PLD3 c.923T>C p.(Leu308Pro), in
    the second phosphodiesterase domain, found by exome sequencing in the
    Dutch family. It is the only variant with family segregation data. A
    different variant, p.(Ile26Thr), was reported in one Indian patient
    without segregation or zygosity data.
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Heterozygous germline missense. Loss of function rests on
      overexpression assays; a dominant-negative effect has not been tested.

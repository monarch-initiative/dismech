animal_models:
- name: Pld3 knockout mouse
  species: Mouse
  genotype: Pld3 -/-
  description: >-
    Mice lacking Pld3 have normal rotarod performance at 5 and 9 months, and
    at 20 months a normal-sized cerebellum with no Purkinje cell loss.
  publication: PMID:30312375
  modeled_mechanisms:
  - target: Cerebellar Dysfunction
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    limitations: >-
      The model is a homozygous null, whereas the patients are heterozygous
      for a missense variant, and the sensory nerves were not reported. The
      paralog Pld4 may compensate, and a mouse lifespan may be too short for a
      late-onset human disease.
    evidence:
    - reference: PMID:30312375
      reference_title: PLD3 and spinocerebellar ataxia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These data do not reveal a major degenerative phenotype of the cerebellum in PLD3 KO mice."
      explanation: The negative result that defines this link.
  evidence:
  - reference: PMID:30312375
    reference_title: PLD3 and spinocerebellar ataxia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "PLD3 expression in the cerebellum is low and PLD3 KO mice do not show any signs of cerebellar degeneration."
    explanation: Summary of the knockout phenotype.
- name: Pld3 Pld4 double knockout mouse
  species: Mouse
  genotype: Pld3 -/- Pld4 -/-
  description: >-
    Mice lacking both paralogs develop fatal liver inflammation in early life,
    showing that the two nucleases are needed in vivo; the phenotype is
    inflammatory, not neurological.
  publication: PMID:30111894
  modeled_mechanisms:
  - target: Impaired Lysosomal Degradation of Single-Stranded Nucleic Acids
    relationship: PERTURBS
    fidelity: LOW
    model_scale: ORGANISM
    limitations: >-
      Digenic loss in immune cells; it shows the in vivo exonuclease function
      but not a neurological phenotype.
    evidence:
    - reference: PMID:30111894
      reference_title: PLD3 and PLD4 are single-stranded acid exonucleases that regulate endosomal nucleic-acid sensing.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mice deficient in both PLD3 and PLD4 developed lethal liver inflammation in early life, which indicates that both enzymes are needed to regulate inflammatory cytokine responses via the degradation of nucleic acids."
      explanation: In vivo evidence for the nuclease function of PLD3 and PLD4.
  evidence:
  - reference: PMID:30111894
    reference_title: PLD3 and PLD4 are single-stranded acid exonucleases that regulate endosomal nucleic-acid sensing.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Although PLD4 and PLD3 were presumed to be phospholipases, we found that they are 5' exonucleases, probably identical to spleen phosphodiesterase, that break down TLR9 ligands."
    explanation: Establishes PLD3 as a 5' exonuclease.
discussions:
- discussion_id: sca46_pld3_causality
  kind: CONTROVERSY
  attaches_to:
  - genetic#PLD3
  prompt: >-
    Is PLD3 p.Leu308Pro the cause of SCA46, or a rare variant that happens to
    segregate in a single family?
  rationale: >-
    The association rests on one family. The variant abolishes exonuclease
    activity in transfected cells, but Pld3 knockout mice have no cerebellar
    phenotype and PLD3 is least expressed in the adult cerebellum. The
    challengers did not dispute the genetic data itself, and a reply from the
    original authors was published (PMID:30312384). The second reported
    patient carries a different variant, has a different phenotype (early
    onset, hearing loss, optic atrophy), has an unremarkable family history
    and has no segregation data, so it
    does not settle the question. Additional families with PLD3 variants
    segregating with a late-onset sensory-cerebellar ataxia would.
  evidence:
  - reference: PMID:30312375
    reference_title: PLD3 and spinocerebellar ataxia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our PLD3 KO mouse analysis challenges the interpretation of PLD3 mutations as the causative SCA46 gene and further characterization of additional patients will be required to clarify a role of PLD3 in spinocerebellar ataxia."
    explanation: The published statement of the dispute.
  - reference: PMID:30312375
    reference_title: PLD3 and spinocerebellar ataxia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "While there is little doubt about the genetic data, we have concerns regarding the cell biology follow up experiments, particularly the localization studies and functional assay for PLD3 performed by Nibbeling et al."
    explanation: The challenge concerns the functional evidence, not the segregation data.
  - reference: PMID:38059248
    reference_title: Spinocerebellar ataxia 46 in a young female.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her childhood medical history and family history were unremarkable."
    explanation: The second patient has no reported affected relatives, so she adds no segregation evidence.
- discussion_id: sca46_knockout_mismatch
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Cerebellar Dysfunction
  - pathophysiology#Large-Fiber Sensory Axonal Degeneration
  prompt: >-
    Why do Pld3 knockout mice lack the cerebellar phenotype, and do they have
    the sensory neuropathy that dominates the human disease?
  rationale: >-
    The knockout study examined the cerebellum and motor performance but did
    not report dorsal root ganglia or peripheral nerves, although sensory
    neuropathy is the predominant human feature. PLD4 compensation, the short
    mouse lifespan relative to onset after 40 in humans, and a possible
    dominant-negative action of the missense protein that a null allele would
    not reproduce could each explain the mismatch. A heterozygous L308P
    knock-in mouse examined for sensory nerve pathology in old age would
    address it.
  evidence:
  - reference: PMID:30312375
    reference_title: PLD3 and spinocerebellar ataxia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "suggest a dominant loss-of-function mechanism due to the PLD3-L308P mutation, suggesting that the PLD3 knockout reflects the situation observed in SCA patients."
    explanation: The premise under which the knockout should have reproduced the disease.
  - reference: PMID:39423811
    reference_title: "PLD3 and PLD4 synthesize S,S-BMP, a key phospholipid enabling lipid degradation in lysosomes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "How the PLD3 L308P mutation would act dominantly is currently unclear."
    explanation: The dominant mechanism of a heterozygous loss-of-function variant remains unexplained.
notes: >-
  The 1995 report (PMID:8595484) describes the same Dutch family before the
  gene was found. The detailed family data in the 2017 gene report (onset age
  range, segregation in eight affected carriers, enzyme activity values) are
  in its full text, which is not cached, so they are not quoted here. No
  GeneReviews chapter exists for SCA46 (just check-genereviews --online
  returned NO_CHAPTER). Orphanet lists the disease as ORPHA:589522, which is
  not cached and not cited.

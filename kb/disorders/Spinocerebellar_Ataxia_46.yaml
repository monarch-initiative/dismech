    snippet: "Importantly, we generated PLD3 knockout (KO) mice that do not present signs of cerebellar degeneration or spinocerebellar ataxia, challenging the interpretation of the suggested loss-of-function mechanism or PLD3 as the SCA46-causative gene."
    explanation: Published challenge to the gene-disease association.
  - reference: PMID:38059248
    reference_title: Spinocerebellar ataxia 46 in a young female.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical exome sequencing detected phospholipase D family member 3 (PLD3) mutation associated with spinocerebellar ataxia (SCA) 46, carrying the c.77T>C"
    explanation: >-
      A second, different PLD3 variant (p.Ile26Thr) in an atypical patient;
      segregation and zygosity are not reported, so it does not independently
      confirm the association.
  notes: >-
    No ClinGen gene-disease validity curation exists for PLD3 and MONDO
    records no causal gene for MONDO:0033481, so gene_disease_validity is left
    empty. The authors' reply to the challenge (PMID:30312384) has no abstract
    or full text in the reference cache and is not quoted.

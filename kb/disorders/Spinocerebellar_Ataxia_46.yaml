name: Spinocerebellar Ataxia 46
creation_date: "2026-10-08T00:00:00Z"
category: Mendelian
synonyms:
- SCA46
- spinocerebellar ataxia, 46, autosomal dominant, with sensory axonal neuropathy
- spinocerebellar ataxia with sensory axonal neuropathy
description: >-
  Spinocerebellar ataxia 46 (SCA46) is a late-onset, slowly progressive,
  autosomal dominant ataxia that combines sensory axonal neuropathy with mild
  cerebellar signs: gait ataxia, dysarthria and oculomotor abnormalities. The
  disease is defined by a single Dutch family, first described in 1995 as a
  dominant sensory ataxic neuropathy and later found to carry the heterozygous
  PLD3 missense variant p.Leu308Pro. PLD3 encodes a lysosomal 5' exonuclease
  that degrades single-stranded DNA. In cells the mutant protein is held in
  the endoplasmic reticulum and has lost exonuclease activity. The gene-disease
  link is provisional: no second family with segregation has been published,
  and Pld3 knockout mice show neither cerebellar degeneration nor ataxia. How
  loss of PLD3 would damage sensory neurons or the cerebellum is unknown.

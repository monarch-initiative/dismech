    explanation: ClinGen classifies the KANSL1-Koolen-de Vries syndrome gene-disease relationship as definitive with autosomal dominant inheritance.
biochemical:
- name: Blood DNA methylation episignature
  presence: Positive
  context: Diagnostic biomarker for molecular confirmation and missense/VUS classification
  notes: >
    Whole-blood DNA methylation profiling identifies a reproducible KdVS
    episignature that can support diagnosis and variant interpretation in the
    structurally complex KANSL1 region.
  evidence:
  - reference: PMID:38282074
    reference_title: "A new blood DNA methylation signature for Koolen-de Vries syndrome: Classification of missense KANSL1 variants and comparison to fibroblast cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, we identified a robust DNAm signature of 456 significant CpG sites in 8 individuals with KdVS, a pattern independently validated in an additional 7 individuals with KdVS."
    explanation: Supports a reproducible blood DNA methylation signature as a diagnostic biomarker in KdVS.
diagnosis:
- name: Chromosomal microarray copy number analysis of 17q21.31
  diagnosis_term:
    preferred_term: Microarray Analysis
    term:
      id: NCIT:C18477
      label: Microarray Analysis
  description: >
    Chromosomal microarray (CMA) detects the recurrent 500- to 650-kb 17q21.31
    microdeletion encompassing KANSL1 prenatally and postnatally (which cannot
    be identified by routine G-banded karyotyping), though low-copy repeats in
    the 17q21.31 region require attention to probe coverage and breakpoint
    interpretation.
  results: Heterozygous 17q21.31 microdeletion encompassing KANSL1.
  evidence:
  - reference: PMID:20301783
    reference_title: "Koolen-de Vries Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of KdVS is established in a proband who has either a heterozygous 500- to 650-kb deletion at chromosome 17q21.31 that includes KANSL1 or a heterozygous intragenic pathogenic variant in KANSL1. Note: The 17q21.31 deletion cannot be identified by analysis of G-banded chromosomes or other cytogenetic banding techniques."
    explanation: GeneReviews defines detection of the submicroscopic 500- to 650-kb 17q21.31 deletion encompassing KANSL1 as a primary diagnostic criterion.
  - reference: PMID:33733630
    reference_title: "Prenatal ultrasound findings in Koolen-de Vries foetuses: Central nervous system anomalies are frequent markers of this syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This kind of malformations raise the possibility of an underlying genetic conditions including 17q21.31 microdeletion; thus, CMA should be taken into consideration when offering prenatal genetic counselling."
    explanation: Supports chromosomal microarray analysis for detecting the 17q21.31 microdeletion in suspected cases.
  - reference: PMID:26306646
    reference_title: "The Koolen-de Vries syndrome: a phenotypic comparison of patients with a 17q21.31 microdeletion versus a KANSL1 sequence variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We provide guidance about the potential pitfalls in the laboratory testing and emphasise the challenges of KANSL1 variant calling and DNA copy number analysis in the complex 17q21.31 region."
    explanation: Highlights laboratory testing considerations for DNA copy number analysis in the 17q21.31 region.

  results: Focal or multifocal epileptiform discharges or continuous spike-wave in sleep.
  evidence:
  - reference: PMID:28440867
    reference_title: "The epileptology of Koolen-de Vries syndrome: Electro-clinico-radiologic findings in 31 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Electroencephalography (EEG) showed focal/multifocal epileptiform discharges in 20 of 26."

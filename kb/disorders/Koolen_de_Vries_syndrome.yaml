      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "In addition, hypoplasia of the hand muscles was described in multiple patients (29%) as well as slender lower limbs (41%), dislocation of the hip(s) (27%), and positional deformities of the feet (27%)."
      explanation: Documents hip dislocation in 27% of patients in the defining clinical series.
  - target: Hydronephrosis

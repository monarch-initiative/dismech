    snippet: "KANSL1 gene expression studies and comparative clinical analysis of patients with 17q21.31 deletions and intragenic KANSL1 gene defects indicate that KANSL1 dysfunction is associated with the full spectrum of the 17q21.31 microdeletion syndrome, which includes characteristic facial features, hypotonia, intellectual disability, and structural defects of the brain, heart and genitourinary system, as well as, musculoskeletal and neuroectodermal anomalies."
    explanation: Establishes that KANSL1 disruption drives multisystem developmental defects across cardiac, craniofacial, urogenital, and musculoskeletal systems.

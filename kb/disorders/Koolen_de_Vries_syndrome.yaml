  - preferred_term: KANSL1
    term:
      id: hgnc:24565
      label: KANSL1
  molecular_functions:
  - preferred_term: histone acetyltransferase regulator activity
    term:
      id: GO:0035034
      label: histone acetyltransferase regulator activity
    modifier: DECREASED
  - preferred_term: chromatin binding
    term:
      id: GO:0003682
      label: chromatin binding
    modifier: LOSS_OF_FUNCTION

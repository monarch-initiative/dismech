    evidence_source: HUMAN_CLINICAL
    snippet: "Based on our findings, an EEG capturing a prolonged period of sleep should be arranged in any child with KdVS presenting with developmental regression or plateau, particularly if they have a preceding history of seizures."
    explanation: Supports prolonged sleep EEG evaluation to detect continuous spike-wave in sleep in children with developmental regression or plateau.

      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "MRI studies of 13 patients were reviewed, and all had structural anomalies. Corpus callosum dysgenesis, abnormal hippocampi, and dilated ventricles were the most common, although periventricular nodular heterotopia, focal cortical dysplasia, abnormal sulcation, and brainstem and cerebellum abnormalities were also observed."
      explanation: Documents corpus callosum dysgenesis as one of the most common structural brain anomalies on MRI in KdVS.

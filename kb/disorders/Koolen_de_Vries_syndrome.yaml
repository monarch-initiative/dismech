      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "We propose that the cardinal features of KdVS in adulthood are ID (ranging from mild to severe, usually moderate), friendly behavior, musculoskeletal abnormalities (especially scoliosis), and facial dysmorphism (a long face and a pronounced pear-shape nose with bulbous overhanging nasal tip)."
      explanation: Identifies musculoskeletal abnormalities, especially scoliosis, as a cardinal manifestation of KdVS.
  - target: Generalized joint hypermobility
    description: KANSL1 haploinsufficiency leads to generalized joint hypermobility in childhood and young adulthood through unknown connective-tissue or neuromuscular intermediates.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:27852077
      reference_title: "Koolen-de Vries Syndrome: Clinical Report of an Adult and Literature Review."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Here, we report a patient in the fourth decade misdiagnosed in the past as classical Ehlers-Danlos syndrome for the presence of generalized joint hypermobility, who carried a 546-kb deletion in 17q21.31, and compare his phenotype with those of the few KdS adults (aged >18 years) described so far."
      explanation: Demonstrates generalized joint hypermobility as a prominent musculoskeletal feature of KdVS.
  - target: Hip dislocation

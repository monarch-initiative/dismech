  - target: Autophagosome accumulation in KANSL1-deficient neurons
    description: Reduced KANSL1 dosage perturbs transcriptional regulation of autophagy and antioxidant defense programs, culminating in autophagosome accumulation.
    evidence:
    - reference: PMID:34286667
      reference_title: "Imbalanced autophagy causes synaptic deficits in a human model for neurodevelopmental disorders."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Here, we investigate the role in autophagy of KANSL1, a member of the nonspecific lethal complex, which acetylates histone H4 on lysine 16 (H4K16ac) to facilitate transcriptional activation."
      explanation: Links KANSL1-mediated H4K16ac transcriptional activation directly to autophagy regulation in human neuronal models.
    - reference: DOI:10.1038/s41467-022-28613-0
      reference_title: "Kansl1 haploinsufficiency impairs autophagosome-lysosome fusion and links autophagic dysfunction with Koolen-de Vries syndrome in mice"
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mechanistic study shows that KANSL1 modulates autophagosome-lysosome fusion for cargo degradation via transcriptional regulation of autophagosomal gene, STX17."
      explanation: Demonstrates that KANSL1 regulates autophagosome clearance through transcriptional control of STX17.
  - target: Impaired neuroblast migration and axonal guidance
    description: KANSL1 dysfunction disrupts neuronal developmental programs governing neuroblast migration and axonal tract formation in the brain.
    evidence:
    - reference: PMID:28440867
      reference_title: "The epileptology of Koolen-de Vries syndrome: Electro-clinico-radiologic findings in 31 patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Structural brain abnormalities may be universal, including signs of abnormal neuroblast migration and abnormal axonal guidance."
      explanation: Neuroimaging across KdVS patients indicates widespread abnormalities of neuroblast migration and axonal guidance.
  - target: Disrupted developmental and morphogenetic signaling
    description: KANSL1 haploinsufficiency perturbs developmental pathways, including hypothesized effects on Ras/MAPK signaling, across cardiac, craniofacial, and musculoskeletal morphogenesis.
    evidence:
    - reference: PMID:26293599
      reference_title: "KANSL1 gene disruption associated with the full clinical spectrum of 17q21.31 microdeletion syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We hypothesize that the KANSL1 gene might have an effect on the Ras/mitogen-activated protein kinase (MAPK) pathway activity, which is known to be deregulated in the CFC syndrome. This pathway has a crucial role in the development of the heart and craniofacial morphology, as well as the skin, eye, brain and musculoskeletal systems."
      explanation: Connects KANSL1 disruption to developmental signaling pathways governing heart, craniofacial, brain, and musculoskeletal morphogenesis.
  - target: Global developmental delay
    description: KANSL1 haploinsufficiency directly underlies early-onset global developmental delay across both microdeletion and intragenic variant carriers.
    evidence:
    - reference: PMID:26306646
      reference_title: "The Koolen-de Vries syndrome: a phenotypic comparison of patients with a 17q21.31 microdeletion versus a KANSL1 sequence variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The Koolen-de Vries syndrome (KdVS; OMIM #610443), also known as the 17q21.31 microdeletion syndrome, is a clinically heterogeneous disorder characterised by (neonatal) hypotonia, developmental delay, moderate intellectual disability, and characteristic facial dysmorphism."
      explanation: Establishes developmental delay as a core consequence of KANSL1 haploinsufficiency.
  - target: Hypotonia
    description: KANSL1 haploinsufficiency leads to neonatal and childhood central hypotonia.
    evidence:
    - reference: PMID:22544363
      reference_title: "Mutations in the chromatin modifier gene KANSL1 cause the 17q21.31 microdeletion syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We show that haploinsufficiency of KANSL1 is sufficient to cause the 17q21.31 microdeletion syndrome, a multisystem disorder characterized by intellectual disability, hypotonia and distinctive facial features."
      explanation: Directly links KANSL1 haploinsufficiency to hypotonia.
  - target: Expressive language delay
    description: KANSL1 haploinsufficiency causes disproportionate impairment of expressive speech and language development.
    evidence:
    - reference: PMID:26306646
      reference_title: "The Koolen-de Vries syndrome: a phenotypic comparison of patients with a 17q21.31 microdeletion versus a KANSL1 sequence variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Expressive language development is particularly impaired compared with receptive language or motor skills."
      explanation: Supports disproportionate expressive language delay in patients with KANSL1 haploinsufficiency.
  evidence:
  - reference: PMID:22544367
    reference_title: "Mutations in KANSL1 cause the 17q21.31 microdeletion syndrome phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings indicate that 17q21.31 deletion syndrome is a monogenic disorder caused by haploinsufficiency of KANSL1."
    explanation: Establishes KANSL1 haploinsufficiency as the disease-defining mechanism.
  - reference: PMID:22544363
    reference_title: "Mutations in the chromatin modifier gene KANSL1 cause the 17q21.31 microdeletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The KANSL1 protein is an evolutionarily conserved regulator of the chromatin modifier KAT8, which influences gene expression through histone H4 lysine 16 (H4K16) acetylation."
    explanation: Supports the chromatin and transcriptional regulatory role of KANSL1 underlying KdVS biology.
- name: Autophagosome accumulation in KANSL1-deficient neurons
  description: >
    In KANSL1-deficient human neurons and mouse models, reduced SOD1 and
    decreased STX17-mediated autophagosome-lysosome fusion lead to oxidative
    stress, impaired clearance of damaged mitochondria, and autophagosome
    accumulation at excitatory synapses.

  - target: Happy demeanor
    description: KANSL1 haploinsufficiency is associated with a characteristic friendly, amiable, and cooperative behavioral disposition through unknown neurobiological intermediates.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:18628315
      reference_title: "Clinical and molecular delineation of the 17q21.31 microdeletion syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "In the vast majority of the patients (89%) the behaviour was described as friendly, amiable and cooperative with or without frequent laughing."
      explanation: Establishes friendly, amiable, and cooperative behavior with or without frequent laughing in 89% of patients.
  - target: Scoliosis
    description: KANSL1 haploinsufficiency predisposes to childhood- and adult-onset scoliosis through uncharacterized musculoskeletal and neuromuscular intermediates.

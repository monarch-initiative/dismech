- name: Impaired neuroblast migration and axonal guidance
  description: >
    KANSL1 haploinsufficiency disrupts central nervous system morphogenesis,
    producing neuroimaging hallmarks of abnormal neuroblast migration (such as
    periventricular nodular heterotopia and focal cortical dysplasia) and
    impaired axonal guidance (including corpus callosum dysgenesis and
    ventriculomegaly) that predispose to focal epilepsy.

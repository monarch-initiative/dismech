  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >
    Brain MRI evaluates structural central nervous system malformations
    including corpus callosum dysgenesis, hippocampal abnormalities,

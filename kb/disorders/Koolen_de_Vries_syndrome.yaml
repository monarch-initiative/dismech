  diagnosis_term:
    preferred_term: DNA Sequencing
    term:
      id: NCIT:C153598
      label: DNA Sequencing
  description: >
    Targeted or exome/genome sequencing identifies heterozygous intragenic
    pathogenic KANSL1 variants in individuals without the 17q21.31 deletion,
    requiring careful variant calling across homologous pseudogene-bearing
    segmental duplications.
  results: Heterozygous pathogenic or likely pathogenic intragenic KANSL1 sequence variant.
  evidence:
  - reference: PMID:20301783
    reference_title: "Koolen-de Vries Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of KdVS is established in a proband who has either a heterozygous 500- to 650-kb deletion at chromosome 17q21.31 that includes KANSL1 or a heterozygous intragenic pathogenic variant in KANSL1."
    explanation: GeneReviews establishes identification of a heterozygous intragenic KANSL1 pathogenic variant as diagnostic of KdVS.
  - reference: PMID:26306646
    reference_title: "The Koolen-de Vries syndrome: a phenotypic comparison of patients with a 17q21.31 microdeletion versus a KANSL1 sequence variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We provide guidance about the potential pitfalls in the laboratory testing and emphasise the challenges of KANSL1 variant calling and DNA copy number analysis in the complex 17q21.31 region."
    explanation: Supports molecular diagnosis via KANSL1 sequence variant analysis while noting variant-calling challenges in the 17q21.31 locus.
- name: Blood DNA methylation episignature profiling
  diagnosis_term:
    preferred_term: DNA Methylation Analysis
    term:
      id: NCIT:C63328
      label: DNA Methylation Analysis
  description: >
    Whole-blood DNA methylation analysis of a 456-CpG KdVS episignature enables
    diagnostic classification of KANSL1 variants of uncertain significance (including
    missense variants) and atypical clinical presentations.
  results: Positive Koolen-de Vries syndrome blood DNA methylation signature.
  markers: 456-CpG blood DNA methylation episignature
  evidence:
  - reference: PMID:38282074
    reference_title: "A new blood DNA methylation signature for Koolen-de Vries syndrome: Classification of missense KANSL1 variants and comparison to fibroblast cells."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this study, we identified a robust DNAm signature of 456 significant CpG sites in 8 individuals with KdVS, a pattern independently validated in an additional 7 individuals with KdVS. We also demonstrate the diagnostic utility of the signature and classify two KANSL1 VUS as well as four variants in individuals with atypical clinical presentation."
    explanation: Demonstrates diagnostic utility of blood DNA methylation profiling for classifying KANSL1 variants of uncertain significance and atypical presentations.

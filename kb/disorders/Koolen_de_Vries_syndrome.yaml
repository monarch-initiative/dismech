      explanation: Links KANSL1 haploinsufficiency to hypotonia in human patients.
  - target: Expressive language delay
    description: KANSL1 haploinsufficiency causes disproportionate impairment of expressive speech and language development through uncharacterized neural circuit intermediates.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:26306646
      reference_title: "The Koolen-de Vries syndrome: a phenotypic comparison of patients with a 17q21.31 microdeletion versus a KANSL1 sequence variant."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Expressive language development is particularly impaired compared with receptive language or motor skills."
      explanation: Supports disproportionate expressive language delay in patients with KANSL1 haploinsufficiency.
  - target: Bulbous nose
    description: KANSL1 haploinsufficiency causes characteristic craniofacial dysmorphism including a tubular or pear-shaped nose with a bulbous nasal tip through uncharacterized craniofacial developmental intermediates.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:18628315
      reference_title: "Clinical and molecular delineation of the 17q21.31 microdeletion syndrome."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Dysmorphic craniofacial features present in more than half of the individuals included a high/broad forehead, long face, upward slanting palpebral fissures, epicanthic folds, an abnormally formed nose (either “tubular” or “pear” shaped), bulbous nasal tip, large prominent ears, and everted lower lip and, in addition, abnormal hair pigmentation and texture was observed in 12 individuals (55%)."
      explanation: Documents bulbous nasal tip as a characteristic craniofacial feature in more than half of individuals with KdVS.
  - target: Long face
    description: KANSL1 haploinsufficiency leads to facial elongation through uncharacterized craniofacial morphogenetic intermediates.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:18628315
      reference_title: "Clinical and molecular delineation of the 17q21.31 microdeletion syndrome."
      supports: SUPPORT

      reference_title: "The epileptology of Koolen-de Vries syndrome: Electro-clinico-radiologic findings in 31 patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The typical epilepsy phenotype of KdVS involves childhood-onset focal seizures that are prolonged and have prominent autonomic features. Multifocal epileptiform discharges are the typical EEG pattern. Structural brain abnormalities may be universal, including signs of abnormal neuroblast migration and abnormal axonal guidance."
      explanation: Connects universal structural brain abnormalities of neuroblast migration and axonal guidance with childhood-onset focal epilepsy in KdVS.

name: Koolen-de Vries syndrome
creation_date: '2026-04-09T17:11:02Z'
category: Mendelian
description: >
  Koolen-de Vries syndrome is a multisystem neurodevelopmental disorder caused
  by KANSL1 haploinsufficiency, either through a recurrent 17q21.31
  microdeletion encompassing KANSL1 or a heterozygous pathogenic KANSL1
  variant. Core manifestations include hypotonia, global developmental delay,
  moderate intellectual disability, marked expressive language impairment, and a
  characteristic craniofacial and behavioral phenotype with additional
  structural brain, cardiac, urogenital, and musculoskeletal anomalies in a
  subset of affected individuals.
disease_term:
  preferred_term: Koolen-de Vries syndrome
  term:
    id: MONDO:0012496
    label: Koolen-de Vries syndrome
parents:
- Neurodevelopmental disorder
- Chromatin disorder
synonyms:
- KdVS
- 17q21.31 microdeletion syndrome
- KANSL1 haploinsufficiency syndrome
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:22544363
      reference_title: "Mutations in the chromatin modifier gene KANSL1 cause the 17q21.31 microdeletion syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We show that haploinsufficiency of KANSL1 is sufficient to cause the 17q21.31 microdeletion syndrome, a multisystem disorder characterized by intellectual disability, hypotonia and distinctive facial features."
      explanation: Establishes Koolen-de Vries syndrome as a Mendelian genetic disorder caused by KANSL1 haploinsufficiency.
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:28440867
      reference_title: "The epileptology of Koolen-de Vries syndrome: Electro-clinico-radiologic findings in 31 patients."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The typical epilepsy phenotype of KdVS involves childhood-onset focal seizures that are prolonged and have prominent autonomic features. Multifocal epileptiform discharges are the typical EEG pattern. Structural brain abnormalities may be universal, including signs of abnormal neuroblast migration and abnormal axonal guidance."
      explanation: Supports prominent neurological manifestations including childhood-onset focal epilepsy and structural brain abnormalities.
inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >
    KdVS is caused by heterozygous loss of KANSL1 function, usually arising de
    novo through either a recurrent 17q21.31 deletion or a loss-of-function
    KANSL1 sequence variant.
  evidence:
  - reference: PMID:20301783
    reference_title: "Koolen-de Vries Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "KdVS, caused by a heterozygous deletion at chromosome 17q21.31 or a heterozygous intragenic KANSL1 pathogenic variant, is an autosomal dominant disorder. Almost all affected individuals represent simplex cases (i.e., a single affected individual in the family)."
    explanation: GeneReviews establishes autosomal dominant inheritance due to a heterozygous 17q21.31 deletion or intragenic KANSL1 pathogenic variant, typically arising de novo in simplex cases.
  - reference: PMID:41457108
    reference_title: "Improving variant interpretation and diagnosis in Koolen-de Vries syndrome through a curated genotype-phenotype repository."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "(KdVS), an autosomal dominant NDD caused by KANSL1 haploinsufficiency"
    explanation: Supports autosomal dominant inheritance mediated by KANSL1 haploinsufficiency.
prevalence:
- population: Historically estimated general population prevalence
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 6.25
  percentage: ~1 in 16,000
  notes: >
    This estimate comes from early microdeletion ascertainment studies and is
    likely conservative because the syndrome was considered substantially
    underdiagnosed. True prevalence of all KANSL1-related molecular classes
    remains uncertain.
  evidence:
  - reference: PMID:18628315
    reference_title: "Clinical and molecular delineation of the 17q21.31 microdeletion syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We estimate the prevalence of the syndrome to be 1 in 16,000 and show that it is highly underdiagnosed."
    explanation: Provides the widely cited historical prevalence estimate and explicitly notes underdiagnosis.
progression:
- phase: Onset
  age_range: Prenatal to neonatal period
  notes: >
    Central nervous system anomalies, particularly ventriculomegaly on third-trimester
    ultrasound, can be detected prenatally, while neonatal hypotonia and global
    developmental delay typically manifest in infancy.
  evidence:
  - reference: PMID:33733630
    reference_title: "Prenatal ultrasound findings in Koolen-de Vries foetuses: Central nervous system anomalies are frequent markers of this syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prenatal CNS anomalies (mainly ventriculomegaly) at third trimester, in spite of isolate, should be considered a prenatal ultrasound marker of this syndrome."
    explanation: Demonstrates third-trimester prenatal onset of central nervous system ultrasound findings in KdVS fetuses.
  - reference: PMID:26306646
    reference_title: "The Koolen-de Vries syndrome: a phenotypic comparison of patients with a 17q21.31 microdeletion versus a KANSL1 sequence variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Koolen-de Vries syndrome (KdVS; OMIM #610443), also known as the 17q21.31 microdeletion syndrome, is a clinically heterogeneous disorder characterised by (neonatal) hypotonia, developmental delay, moderate intellectual disability, and characteristic facial dysmorphism."
    explanation: Supports neonatal onset of hypotonia and early developmental delay.
- phase: Childhood
  age_range: 1-9 years
  notes: >
    Epilepsy typically presents in early childhood (median onset 3.5 years; range
    1-7 years in adult follow-up series) with prolonged focal impaired awareness
    seizures and often achieves remission before late childhood.
  evidence:
  - reference: PMID:28440867
    reference_title: "The epileptology of Koolen-de Vries syndrome: Electro-clinico-radiologic findings in 31 patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median age at seizure onset was 3.5 years, and 9 of 22 had refractory seizures 2 years after onset. Focal impaired awareness seizures were the most frequent seizure type occurring in 20 of 31, usually with prominent autonomic features."
    explanation: Defines childhood seizure onset and clinical pattern in a 31-patient cohort.
  - reference: PMID:33361104
    reference_title: "Adult phenotype in Koolen-de Vries/KANSL1 haploinsufficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Epilepsy was diagnosed in four subjects (44%), with onset from 1 to 7 years and full remission before 9 years in 3/4 patients."
    explanation: Supports childhood onset of epilepsy (1 to 7 years) with frequent remission before 9 years of age.
- phase: Adulthood
  age_range: ">18 years"
  notes: >
    In adulthood, epilepsy and cardiovascular signs generally show a favorable
    prognosis and joint hypermobility diminishes with age, whereas scoliosis,
    friendly behavior, moderate intellectual disability, and post-pubertal
    overweight or obesity are prominent features.
  evidence:
  - reference: PMID:27852077
    reference_title: "Koolen-de Vries Syndrome: Clinical Report of an Adult and Literature Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We observed a favorable prognosis of epilepsy and cardiovascular signs and reduction of joint hypermobility with age, thus providing insight into the natural history of the disorder."
    explanation: Documents natural history improvements in epilepsy, cardiovascular signs, and joint hypermobility in adulthood.
  - reference: PMID:33361104
    reference_title: "Adult phenotype in Koolen-de Vries/KANSL1 haploinsufficiency syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overweight or true obesity did occur after puberty in six patients (67%)."
    explanation: Supports post-pubertal onset of overweight or obesity in the adult natural history series.
pathophysiology:
- name: KANSL1 haploinsufficiency
  description: >
    Heterozygous loss of KANSL1 is the core molecular lesion in KdVS. KANSL1 is
    a chromatin-associated regulator of the histone acetyltransferase KAT8
    within the NSL complex, linking reduced dosage to altered histone H4K16
    acetylation, chromatin organization, and transcriptional control during
    neurodevelopment and organogenesis.

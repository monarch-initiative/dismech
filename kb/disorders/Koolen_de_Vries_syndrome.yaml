      explanation: Confirms ventriculomegaly as the most frequent prenatal CNS anomaly in KdVS fetuses.
  - target: Seizures
    description: Malformations of cortical development, hippocampal anomalies, and abnormal neuroblast migration contribute to childhood-onset focal and multifocal epilepsy.

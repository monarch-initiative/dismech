      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Conventional and molecular karyotypes were performed on a female patient with intellectual disability, agenesis of the corpus callosum, heart defects, hydronephrosis, hypotonia, pigmentary skin anomalies and facial dysmorphic features."
      explanation: Links KANSL1 disruption to hydronephrosis as part of the urogenital malformation spectrum of KdVS.
  - target: Vesicoureteral reflux
    description: KANSL1 haploinsufficiency predisposes to vesicoureteral reflux via uncharacterized urinary tract developmental intermediates.

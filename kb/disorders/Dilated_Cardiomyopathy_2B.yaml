progression:
- phase: Adult onset and chronic course
  age_range: diagnosis at 50 to 57 years; followed for more than 20 years
  notes: >-
    The proband presented with heart failure at 50 and her sister was
    diagnosed at 53; both remained in NYHA class II more than two decades
    later on heart failure therapy. The brother had left ventricular
    enlargement at 57 and a borderline ejection fraction at 68, and died of
    cancer at 73. This is a single family, so the course is not a
    generalisable natural history.

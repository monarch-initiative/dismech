name: Dilated Cardiomyopathy 2B
creation_date: "2026-09-25T13:56:18Z"
category: Mendelian
synonyms:
- CMD2B
- cardiomyopathy, dilated, 2B
- cardiomyopathy, dilated, type 2B
- dilated cardiomyopathy type 2B
- GATAD1-related dilated cardiomyopathy
- familial isolated dilated cardiomyopathy caused by mutation in GATAD1
description: >-
  Dilated cardiomyopathy 2B (CMD2B) is an autosomal recessive, adult-onset,
  nonsyndromic dilated cardiomyopathy attributed to a homozygous missense
  variant, c.304T>C p.(Ser102Pro), in GATAD1, which encodes GATA zinc finger
  domain-containing protein 1. The entity rests on a single consanguineous
  family of Norwegian ancestry: two sisters developed dilated cardiomyopathy
  with heart failure at 50 and 53 years of age and their brother had
  idiopathic left ventricular enlargement at 57, all three homozygous for the
  variant, while thirteen heterozygous relatives had normal hearts into old
  age. The clinical course in that family resembled ordinary adult dilated
  cardiomyopathy and was chronic rather than fulminant, with the two sisters
  still in NYHA class II more than two decades after diagnosis on standard
  heart failure therapy.

  GATAD1 is a ubiquitously expressed protein, found in the nucleus and
  cytoplasm of cardiomyocytes, that co-purifies with the EMSY/KDM5A/SIN3B
  chromatin-regulatory complex, which binds H3K4me3-marked promoters,
  and the discovery paper proposed epigenetic dysregulation as the disease
  mechanism. How the variant damages the heart is not known. The proband's
  myocardium showed a disturbed extranuclear GATAD1 staining pattern and
  abnormally globular cardiomyocyte nuclei; Ser102 is a phosphorylation site whose phosphorylated form binds
  14-3-3 proteins, a binding the proline substitution abolishes in vitro; a
  gatad1 knockout zebrafish develops heart failure-like phenotypes only under
  added stress; and a cardiomyocyte-specific Gatad1 knockout mouse does not
  develop cardiomyopathy. ClinGen classifies the GATAD1-dilated cardiomyopathy
  relationship as Limited.

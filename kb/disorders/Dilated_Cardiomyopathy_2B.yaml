inheritance:
- name: Autosomal Recessive
  description: >-
    CMD2B is one of the few recessive forms of familial isolated dilated
    cardiomyopathy. Disease requires two GATAD1 alleles: the affected sisters were
    homozygous for p.Ser102Pro, whereas thirteen heterozygous relatives had no
    myocardial disease even at advanced ages, so carriers are not at recognized
    risk and there is no dominant-negative expression in the heterozygous state.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:21965549
    reference_title: Homozygosity mapping and exome sequencing reveal GATAD1 mutation in autosomal recessive dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirteen relatives were heterozygous mutation carriers with no evidence of
      myocardial disease, even at advanced ages.
    explanation: >-
      Directly establishes full recessiveness: heterozygotes are unaffected even
      after a lifetime of observation, so one intact allele is sufficient.
  - reference: PMID:38605029
    reference_title: Pathogenic mutations of human phosphorylation sites affect protein-protein interactions.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-

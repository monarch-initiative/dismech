notes: >-
  Evidence base. All human evidence for CMD2B comes from one family (three
  homozygous siblings, PMID:21965549). Screening the five GATAD1 exons in 273
  unrelated dilated cardiomyopathy probands in the same study found no
  previously unreported nonsynonymous variant. The ClinGen gene-disease validity classification is
  Limited (autosomal recessive; Dilated Cardiomyopathy Gene Curation Expert
  Panel, 2024-08-07), which is the same assertion the parent
  Dilated_Cardiomyopathy entry cites. Frequencies are therefore not assigned to
  phenotypes: three affected individuals cannot support a frequency band, and
  the counts are given in each description instead.

  Not cited as CMD2B evidence. A 2024 cohort of 95 patients with nonischemic
  dilated cardiomyopathy tested on a 233-gene panel reported that carriers of
  GATAD1 variants of uncertain significance had better cardiac function
  parameters than non-carriers (PMID:38664609). Those carriers are not
  described as biallelic and the variants are not described as S102P, so the
  study says nothing about this recessive entity and is not used here. Papers
  on GATAD1 in cancer, stroke-associated blood-brain barrier injury and
  myocardial ischemia-reperfusion concern other biology and are likewise not
  used.

  GeneReviews scope. There is no GATAD1-specific GeneReviews chapter. The
  disease-level "Dilated Cardiomyopathy Overview" (PMID:20301486) is tagged
  because it is the applicable GeneReviews resource for the evaluation of a
  proband with nonsyndromic dilated cardiomyopathy and of at-risk relatives;
  its cached PubMed record holds only the chapter's purpose statement, so it
  is quoted only for the relative-screening purpose on the genetic counselling
  treatment.

  Module conformance. The remodeling and heart-failure nodes conform to
  cardiomyopathy_maladaptive_remodeling. The variant node is deliberately not
  conformed to that module's Primary Cardiomyocyte Insult: the module frames
  the insult as a cardiomyocyte contractile lesion, and the cardiomyocyte
  knockout mouse (PMID:39641830) leaves open whether the GATAD1 lesion acts in
  cardiomyocytes at all. The systolic dysfunction node is not conformed to
  Progressive Contractile Dysfunction because the reported course was stable
  for more than twenty years on treatment rather than progressive.

  Do not confuse CMD2B (GATAD1, OMIM:614672) with the neighbouring recessive
  numbered loci, which are different diseases with different genes, among them
  CMD2A (TNNI3, Dilated_Cardiomyopathy_2A) and CMD2H (GET3/ASNA1,
  Cardiomyopathy_Dilated_2H).
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:

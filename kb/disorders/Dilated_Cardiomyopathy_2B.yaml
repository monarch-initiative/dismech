animal_models:
- name: Gatad1 cardiomyocyte-specific knockout mouse
  species: Mouse
  genotype: Gatad1 floxed (exons 2-4) with Xmlc2-Cre
  publication: PMID:39641830
  description: >-
    Cardiomyocyte deletion from embryonic day 7.5. Mice survived normally to
    18 months with normal echocardiographic function, heart weight, histology
    and cardiomyocyte nuclear shape, and responded normally to transverse
    aortic constriction, although Nppa and Nppb were mildly raised at 3 and
    15 months. Global Gatad1 knockout was lethal at embryonic day 8.5.
  modeled_mechanisms:
  - target: Left Ventricular Dilation and Remodeling
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Loss of Gatad1 in cardiomyocytes does not produce ventricular dilation
      or dysfunction at baseline or under pressure overload.
    limitations: >-
      A null allele confined to cardiomyocytes, whereas patients carry a
      full-length missense protein in every cell; it cannot test a
      mutation-specific effect of S102P, a non-cardiomyocyte contribution, or
      a requirement before Cre expression. Observation stopped at 18 months,
      and the authors note that genetic background modifiers may matter.
    evidence:
    - reference: PMID:39641830
      reference_title: Loss of GATAD1 in cardiomyocyte does not cause cardiomyopathy in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        Gatad1 cKO mutants exhibited normal cardiac function during the aging
        process up to 18 months of age.
      explanation: The negative result that makes this a failure to recapitulate.
  - target: Globular Cardiomyocyte Nuclei
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: CELLULAR
    description: Isolated knockout cardiomyocytes have normal nuclear shape.
    limitations: >-
      Tests loss of Gatad1, not the S102P protein, and only in mouse
      cardiomyocytes.
    evidence:
    - reference: PMID:39641830
      reference_title: Loss of GATAD1 in cardiomyocyte does not cause cardiomyopathy in mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        Unlike the abnormal nuclei shape observed in patients carrying GATAD1
        mutations, the nuclei shape of cardiomyocytes remained unaffected by the
        loss of Gatad1.
      explanation: The nuclear phenotype is not reproduced.
- name: gatad1 knockout zebrafish
  species: Zebrafish
  genotype: gatad1 13-bp frameshift deletion in exon 2 (TALEN), homozygous
  publication: PMID:28955713
  description: >-
    Homozygous knockouts had no phenotype at baseline. With embryonic ethanol
    exposure plus a high-cholesterol diet they showed reduced swimming
    capacity, reduced survival from about 7 months, and induction of nppb and
    vmhc; ventricle size did not differ significantly.
  modeled_mechanisms:
  - target: Chronic Systolic Heart Failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Heart failure-like phenotypes appear only under combined stress and
      without significant chamber enlargement.
    limitations: >-
      A null allele rather than the patient missense; phenotypes required
      ethanol and high-cholesterol stressors, and ejection fraction could not
      be measured in the small fish heart. Fish Gatad1 lacks the serine at the
      position of human Ser102.
    evidence:
    - reference: PMID:28955713
      reference_title: Modeling GATAD1-Associated Dilated Cardiomyopathy in Adult Zebrafish.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        Under stress conditions, longitudinal studies uncovered heart failure
        (HF)-like phenotypes in stable KO mutants and a tendency toward HF
        phenotypes in transgenic lines.
      explanation: Supports the knockout as partially informative for the heart-failure node.
- name: Tg(myl7:GATAD1-S102P) zebrafish
  species: Zebrafish
  genotype: Cardiomyocyte-specific transgenic expression of human GATAD1-S102P (myl7 promoter)
  publication: PMID:28955713
  description: >-
    Transgenic fish expressing human GATAD1-S102P in cardiomyocytes began to
    die at about 13 months, whereas fish expressing wild-type human GATAD1
    survived beyond 20 months; one of six mutant-transgenic hearts was
    enlarged. The authors call this a tendency needing a larger sample.
  modeled_mechanisms:
  - target: Chronic Systolic Heart Failure
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Reduced survival and a single enlarged heart in fish overexpressing the
      patient allele, suggesting a possible effect of the mutant protein
      itself.
    limitations: >-
      Overexpression of a human transgene on a wild-type fish background, not
      the homozygous state; small numbers, and the cardiac enlargement was
      seen in one of six fish.
    evidence:
    - reference: PMID:28955713
      reference_title: Modeling GATAD1-Associated Dilated Cardiomyopathy in Adult Zebrafish.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        the Tg(myl7:GATAD1S102P) fish started to die around 13 months of age,
        in contrast to Tg(myl7:GATAD1) fish that survived more than 20 months
        without any deaths
      explanation: Reduced survival of fish expressing the patient allele.
discussions:
- discussion_id: gatad1_mechanism_unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what mechanism does homozygous GATAD1 S102P cause dilated
    cardiomyopathy, and in which cell type does it act?
  attaches_to:
  - pathophysiology#Homozygous GATAD1 p.Ser102Pro Variant
  - pathophysiology#Perturbed GATAD1-Associated Chromatin Regulation
  - pathophysiology#Loss of Phospho-Ser102-Dependent 14-3-3 Binding
  rationale: >-
    Every step between the variant and the ventricle is unmeasured in human
    heart. The chromatin hypothesis is an inference from GATAD1's interaction
    partners, which the variant does not disrupt in HEK293 cells; the 14-3-3
    hypothesis rests on peptide binding and a crystal structure; and the
    abnormal GATAD1 distribution and globular nuclei come from one biopsy. The
    source papers name the experiments that would resolve it: an S102P
    knock-in and human iPSC-derived cardiomyocytes carrying the variant.
  proposed_experiments:
  - experiment_id: gatad1_s102p_ipsc_cardiomyocytes
    name: Human iPSC-derived cardiomyocytes carrying GATAD1 S102P
    description: >-
      Compare homozygous S102P, knockout and isogenic control iPSC-derived
      cardiomyocytes for GATAD1 localization, nuclear shape, 14-3-3 binding,
      chromatin occupancy, transcriptome and contractility.
    would_support:
    - mechanistic_hypotheses#gatad1_s102p_mutation_specific
  evidence:
  - reference: PMID:39641830
    reference_title: Loss of GATAD1 in cardiomyocyte does not cause cardiomyopathy in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Utilizing human iPSC-derived cardiomyocytes with GATAD1 knockout or
      mutation could be an excellent approach to assess the function of human
      GATAD1 in cardiomyocyte differentiation.
    explanation: The mouse study names human iPSC-cardiomyocyte models as the next step.
  - reference: PMID:38605029
    reference_title: Pathogenic mutations of human phosphorylation sites affect protein-protein interactions.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      However, neither the pathogenic mechanism nor the function of this GATAD1
      phosphorylation site are currently known.
    explanation: States that the mechanism is unknown.
- discussion_id: gatad1_mouse_model_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why does loss of Gatad1 in mouse cardiomyocytes cause no cardiomyopathy
    when homozygous S102P causes dilated cardiomyopathy in humans?
  attaches_to:
  - animal_models#Mouse
  - pathophysiology#Left Ventricular Dilation and Remodeling
  - mechanistic_hypotheses#gatad1_loss_of_function
  rationale: >-
    The mouse result can mean that S102P acts through a mutation-specific
    effect a null allele cannot model, that GATAD1 is required in cells other
    than cardiomyocytes or before the Cre driver switches on, that onset in
    mouse lies beyond 18 months, that strain background hides the phenotype,
    or that human and mouse GATAD1 differ in function. The zebrafish data do
    not settle it: the knockout needs stressors to show a phenotype, and fish
    Gatad1 lacks the Ser102 residue.
  proposed_experiments:
  - experiment_id: gatad1_s102p_knockin_mouse
    name: Gatad1 S102P knock-in mouse
    description: >-
      Homozygous S102P knock-in, aged beyond 18 months and on more than one
      inbred background, with echocardiography and nuclear morphology.
    would_support:
    - mechanistic_hypotheses#gatad1_s102p_mutation_specific
    would_refute:
    - mechanistic_hypotheses#gatad1_loss_of_function
  evidence:
  - reference: PMID:39641830
    reference_title: Loss of GATAD1 in cardiomyocyte does not cause cardiomyopathy in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      it is important to recognize that the function of GATAD1 in humans and
      mice may not be directly comparable. There could be unknown genetic
      modifiers necessary to manifest a cardiomyopathy phenotype.
    explanation: The authors' own statement of the species and modifier caveats.
  - reference: PMID:39641830
    reference_title: Loss of GATAD1 in cardiomyocyte does not cause cardiomyopathy in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: This possibility could be tested using an S102P knock-in mutant in future studies.
    explanation: Names the knock-in experiment.
- discussion_id: gatad1_single_family_evidence
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do other families with biallelic GATAD1 variants and dilated
    cardiomyopathy exist?
  attaches_to:
  - disease#Dilated Cardiomyopathy 2B
  - genetic#GATAD1
  rationale: >-
    The entity is defined by one family with one allele, and ClinGen
    classifies the gene-disease relationship as Limited. A second unrelated
    family, or a different biallelic allele, is what would move the
    classification and show the phenotypic range.

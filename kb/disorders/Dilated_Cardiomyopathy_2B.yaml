      strategies to identify GATAD1 as a gene for AR DCM.
    explanation: >-
      Describes the combined mapping-plus-exome strategy as the method that
      established the diagnosis and the gene.
differential_diagnoses:
- name: Dilated Cardiomyopathy (other genetic causes)
  description: >-
    The overwhelming majority of familial DCM is autosomal dominant and caused by
    variants in genes with far stronger evidence — TTN, LMNA, MYH7, FLNC and
    others — which should be excluded first. A recessive pedigree structure,
    consanguinity, and unaffected elderly heterozygous carriers are the features
    that make CMD2B worth considering at all; without them a GATAD1 finding is
    much more likely incidental.
  evidence:
  - reference: PMID:21965549
    reference_title: Homozygosity mapping and exome sequencing reveal GATAD1 mutation in autosomal recessive dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dilated cardiomyopathy (DCM) is a heritable, genetically heterogeneous
      disorder that typically exhibits autosomal dominant inheritance.
    explanation: >-
      Establishes that dominant genetic DCM is the expected background against
      which this recessive entity must be distinguished.
- name: Acquired and Nonischemic Dilated Cardiomyopathy
  description: >-
    Nongenetic causes of a dilated, hypocontractile ventricle — ischemic,
    myocarditic, toxic (alcohol, anthracycline), peripartum, and
    tachycardia-mediated — are far commoner than any Mendelian form and are
    excluded on clinical grounds before pursuing recessive gene discovery.
  evidence:
  - reference: PMID:31073128
    reference_title: Dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Dilated cardiomyopathy (DCM) is a clinical diagnosis characterized by left
      ventricular or biventricular dilation and impaired contraction that is not
      explained by abnormal loading conditions
    explanation: >-
      The definitional requirement to exclude abnormal loading conditions (and,
      in the same sentence, coronary artery disease) is what makes acquired DCM
      the primary differential.

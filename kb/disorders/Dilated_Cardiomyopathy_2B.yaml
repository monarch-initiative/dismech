mechanistic_hypotheses:
- hypothesis_group_id: gatad1_chromatin_dysregulation_model
  hypothesis_label: Epigenetic (H3K4me3-reader) dysregulation model
  status: CANONICAL
  description: >-
    The model proposed with the original gene discovery: GATAD1 is a chromatin
    reader that docks on the H3K4me3 mark and operates within an
    EMSY/KDM5A/SIN3B histone-modifying complex coupled to Sin3/HDAC activity. A
    variant altering a conserved GATAD1 residue is proposed to degrade this
    reader function in cardiomyocytes, so histone-mark-directed control of cardiac
    gene expression is lost and the myocardium remodels and dilates. The
    discoverers framed this as an inherited, epigenetic route to heart failure by
    analogy with murine DCM produced by disrupting histone deacetylases. It
    remains a hypothesis anchored on one family: no study has profiled the cardiac
    transcriptome or the H3K4me3 landscape of a GATAD1-variant heart, so the
    dysregulated gene program the model predicts has never been observed.
  evidence:
  - reference: PMID:21965549
    reference_title: Homozygosity mapping and exome sequencing reveal GATAD1 mutation in autosomal recessive dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Consistent with murine DCM caused by genetic disruption of histone
      deacetylases, the data implicate an inherited basis for epigenetic
      dysregulation in human heart failure.
    explanation: >-
      The authors' own statement of this hypothesis group — epigenetic
      dysregulation as the mechanistic class to which CMD2B belongs.
  - reference: PMID:26841866
    reference_title: Recruitment of the Mammalian Histone-modifying EMSY Complex to Target Genes Is Regulated by ZNF131.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Recent work from others and us revealed interactions between the Sin3/HDAC
      complex, the H3K4me3 demethylase KDM5A, GATAD1, and EMSY.
    explanation: >-
      Independent proteomic evidence placing GATAD1 in an H3K4me3-associated,
      Sin3/HDAC-coupled histone-modifying complex — the molecular machinery the
      hypothesis depends on. This is complex biochemistry in cell lines, not
      cardiac tissue, hence IN_VITRO.
  - reference: PMID:39641830
    reference_title: Loss of GATAD1 in cardiomyocyte does not cause cardiomyopathy in mice.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Together, these observations suggest that deletion of Gatad1 in
      cardiomyocytes does not induce cardiomyopathy during aging or affect the
      response to pressure overload stress in mice.
    explanation: >-
      Direct counter-evidence to this hypothesis group as usually stated. If
      disease arose from loss of GATAD1 reader function in cardiomyocytes, then
      deleting the protein from cardiomyocytes should have been sufficient; it was
      not. The group is retained as CANONICAL because it is the published model
      and no cardiac chromatin data have tested it directly, but it is recorded
      here as contradicted in the one mammalian in vivo test performed to date.
- hypothesis_group_id: gatad1_phospho_14_3_3_nls_model
  hypothesis_label: Ser102 phospho-switch, 14-3-3 binding, and NLS-masking model
  status: ALTERNATIVE
  description: >-
    An alternative model in which the disease lesion is loss of a regulatory
    phospho-switch rather than loss of the protein. Ser102 is a phosphorylation
    site; peptide interaction proteomics showed that phosphorylated Ser102
    mediates binding to 14-3-3 family proteins, isothermal titration calorimetry
    confirmed direct binding of the pSer102 peptide to 14-3-3 epsilon, and the
    disease-linked Ser102Pro peptide does not bind. The 14-3-3-binding region was
    then validated as a functional nuclear localization signal, and the authors
    propose that 14-3-3 engagement masks that signal and thereby governs GATAD1
    nucleocytoplasmic transport. Two features make this attractive as a disease
    model: it would explain the perturbed subcellular distribution of GATAD1 seen
    in patient cardiomyocytes, and — because the only reported evidence of Ser102
    phosphorylation comes from heart tissue — it offers a reason why a broadly
    expressed chromatin protein should produce a heart-restricted phenotype. It
    also explains why a null allele is the wrong experiment: deleting the protein
    cannot reproduce the dysregulation of a protein that is still present.

    The model is explicitly unvalidated in a disease-relevant setting. The authors
    state they could not test it for lack of a cellular model system, and their
    own cell data indicate the mutation does not by itself prevent nuclear
    translocation. It is curated as ALTERNATIVE rather than as an accepted
    mechanism.
  evidence:
  - reference: PMID:38605029
    reference_title: Pathogenic mutations of human phosphorylation sites affect protein-protein interactions.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We focused on a mutation of a serine phosphorylation site in the
      transcription factor GATAD1, which causes dilated cardiomyopathy. We find
      that this phosphorylation site mediates interaction with 14-3-3 family
      proteins.
    explanation: >-
      Establishes the core claim of this hypothesis group: the CMD2B residue is a
      phosphosite whose phosphorylation mediates 14-3-3 binding.
  - reference: PMID:38605029
    reference_title: Pathogenic mutations of human phosphorylation sites affect protein-protein interactions.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Follow-up experiments reveal the structural basis of this interaction and
      suggest that 14-3-3 binding affects GATAD1 nucleocytoplasmic transport by
      masking a nuclear localisation signal.
    explanation: >-
      States the proposed functional consequence — NLS masking and altered
      nucleocytoplasmic transport — that links the phospho-switch to the observed
      patient cell biology. Note the authors' own hedge ("suggest").
  - reference: PMID:38605029
    reference_title: Pathogenic mutations of human phosphorylation sites affect protein-protein interactions.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Nevertheless, due to the lack of a cellular model system, we are not able to
      experimentally validate this hypothesis.
    explanation: >-
      The authors' explicit statement that the NLS-masking mechanism is
      unvalidated — the reason this group is ALTERNATIVE and all downstream nodes
      are HYPOTHETICAL. PARTIAL because it qualifies rather than supports.
  - reference: PMID:39641830
    reference_title: Loss of GATAD1 in cardiomyocyte does not cause cardiomyopathy in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Unlike the abnormal nuclei shape observed in patients carrying GATAD1
      mutations, the nuclei shape of cardiomyocytes remained unaffected by the
      loss of Gatad1.
    explanation: >-
      Independent support for the central premise that the missense allele does
      something a deletion does not: the patient nuclear phenotype is not
      reproduced by loss of the protein.

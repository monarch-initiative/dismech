- name: Cardiomyocyte-specific Gatad1 knockout mouse
  description: >-
    The first mammalian Gatad1 loss-of-function model, generated specifically to
    test the cardiac hypothesis. It is a negative model: cKO mice had normal
    cardiac function to 18 months, normal cardiomyocyte nuclear shape, and a
    normal response to transverse aortic constriction. It is curated here as a
    first-class result rather than an inconvenience — it constrains the mechanism

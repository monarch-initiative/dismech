diagnosis:
- name: Echocardiography
  description: >-
    The first-line and, in the index family, the case-ascertaining test:
    systematic echocardiography of adult relatives established the dilated
    phenotype in the two affected sisters and detected isolated left ventricular
    enlargement in a third sibling who would otherwise have been called
    unaffected.
  evidence:
  - reference: PMID:21965549
    reference_title: Homozygosity mapping and exome sequencing reveal GATAD1 mutation in autosomal recessive dilated cardiomyopathy.
    supports: SUPPORT

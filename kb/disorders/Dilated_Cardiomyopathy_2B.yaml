pathophysiology:
- name: Homozygous GATAD1 p.Ser102Pro Variant
  description: >-
    The only reported CMD2B allele is c.304T>C in exon 2 of GATAD1, replacing
    serine 102 with proline. It was the single rare variant shared by the two
    exome-sequenced sisters inside the 7q21 homozygous interval, and it was
    absent from 1,558 control and proband chromosomes. The mutant protein is
    present in patient myocardium, so the allele does not act by abolishing
    GATAD1 protein. Whether it is a loss-of-function allele or has a
    mutation-specific effect is unresolved; both models are recorded under
    mechanistic_hypotheses.
  biological_scale: MOLECULAR

- name: Ventricular Remodeling and Left Ventricular Dilation
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"
  biological_scale: TISSUE
  role: effector
  description: >-
    Whichever upstream arm operates, the myocardium remodels along the shared
    dilated-cardiomyopathy route: the left ventricle enlarges and the chamber
    adopts the thin-walled, dilated geometry that defines the phenotype. In the
    index family this stage is visible as a graded phenotype — frank DCM in the
    two affected sisters and isolated idiopathic left ventricular enlargement in
    their brother, consistent with an adult-onset process captured at different
    points. The neurohormonal amplifier modeled in the
    cardiomyopathy_maladaptive_remodeling module is assumed rather than
    demonstrated for this genotype and is deliberately not instantiated as a node.
  cell_types:

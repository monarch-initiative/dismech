genetic:
- name: GATAD1
  gene_term:
    preferred_term: GATAD1
    term:
      id: hgnc:29941
      label: GATAD1
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    One allele reported: homozygous c.304T>C p.(Ser102Pro) in exon 2, in a
    consanguineous Norwegian-ancestry family. It was absent from HapMap, 1000
    Genomes, 474 ancestry-matched controls and 273 unrelated dilated
    cardiomyopathy probands. Thirteen heterozygous relatives, examined up to
    their eighties, had no myocardial disease.
  evidence:
  - reference: CGGV:assertion_56933afb-863f-46f5-884d-17522adb31a8-2024-08-07T160000.000Z
    reference_title: GATAD1 / dilated cardiomyopathy (Limited)
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "GATAD1 | HGNC:29941 | dilated cardiomyopathy | MONDO:0005021 | AR | Limited"
    explanation: ClinGen classifies the GATAD1-dilated cardiomyopathy relationship as Limited with autosomal recessive inheritance.
  - reference: PMID:21965549
    reference_title: Homozygosity mapping and exome sequencing reveal GATAD1 mutation in autosomal recessive dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The mutation, absent in HapMap, 1000 Genomes, and 474 ethnically matched
      controls, altered a conserved residue of GATAD1, encoding GATA zinc
      finger domain-containing protein 1. Thirteen relatives were heterozygous
      mutation carriers with no evidence of myocardial disease, even at
      advanced ages.
    explanation: Variant rarity, residue conservation and unaffected heterozygous carriers.
  notes: >-
    ClinGen Limited means the gene-disease relationship rests on too little
    genetic evidence to be used confidently in clinical interpretation. The
    gene is recorded as causative here because this entry is defined by the
    GATAD1-linked family, not because causation is settled.
variants:
- name: GATAD1 p.Ser102Pro
  description: >-
    The only CMD2B allele reported (NM_021167.5:c.304T>C), homozygous in three
    affected siblings. The residue lies in a stretch (Gly79 to Ile136) that is
    fully conserved across mammals; fish carry serines at the neighbouring
    positions instead. ClinVar (VCV000031656, retrieved 2026-09-25) lists it
    as Pathogenic for dilated cardiomyopathy 2B with the review status "no
    assertion criteria provided" on a single submission (SCV000045643); no
    clinical_significance is set here because that record is not an
    independent classification and ClinGen rates the gene-disease
    relationship Limited.

- name: Cascade Genetic Testing and Counseling
  description: >-
    Counseling for CMD2B differs materially from the usual dominant DCM
    conversation, and this difference is the main clinical value of the diagnosis:
    recurrence risk is 25% for siblings of a proband rather than 50% for
    offspring, and heterozygous relatives — thirteen of whom remained free of
    myocardial disease into advanced age in the index family — do not need the
    lifelong serial cardiac surveillance that at-risk relatives in dominant

genetic:
- name: GATAD1 Pathogenic Variants
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: GATAD1
    term:
      id: hgnc:29941
      label: GATAD1
  inheritance:
  - name: Autosomal Recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  features: >-
    The GATAD1 allelic spectrum for CMD2B is essentially a single variant. The
    locus was mapped to chromosome 7q21 by linkage and high-density homozygosity
    mapping in a consanguineous kindred, then resolved by exome sequencing of the
    two affected sisters to one shared homozygous missense change altering a
    conserved residue — p.Ser102Pro — absent from HapMap, 1000 Genomes, and 474
    ethnically matched controls. No second family and no additional pathogenic
    GATAD1 genotype has been reported since, so there is no allelic series and no
    genotype-phenotype correlation to state. Notably, Ser102 is a phosphorylation
    site rather than an arbitrary conserved residue, which is material for variant
    interpretation: a substitution that destroys a regulatory phosphosite is not
    mechanistically equivalent to a truncating or null allele, and predicted
    loss-of-function GATAD1 variants should not be assumed pathogenic by analogy
    to p.Ser102Pro. Heterozygous GATAD1 variants seen incidentally on DCM gene
    panels should also not be over-interpreted: in a 95-patient nonischemic DCM
    cohort, GATAD1 variants of uncertain significance were associated with better
    rather than worse cardiac function and morphometrics, consistent with the
    recessive model in which single-allele carriers are unaffected.
  variants:
  - name: GATAD1 p.Ser102Pro
    description: >-
      The founding and, to date, only reported CMD2B variant: a homozygous
      missense substitution of a conserved serine at position 102, identified by
      exome sequencing in two affected sisters within the 7q21 homozygosity
      interval and absent from HapMap, 1000 Genomes, and 474 matched controls. It
      is the allele expressed in cardiomyocytes in the transgenic zebrafish model.
      Subsequent interaction proteomics showed Ser102 is a phosphorylation site
      whose phosphorylated form binds 14-3-3 proteins in a region that functions
      as a nuclear localization signal; the proline substitution abolishes that
      phospho-dependent binding.

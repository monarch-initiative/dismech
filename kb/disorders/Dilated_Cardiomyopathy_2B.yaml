experimental_models:
- name: gatad1 knockout and GATAD1-S102P transgenic adult zebrafish
  description: >-
    TALEN-generated gatad1 knockout lines plus a transgenic line expressing the
    human GATAD1-S102P allele in cardiomyocytes, phenotyped longitudinally in
    adult (not larval) fish because the human disease is adult-onset. Knockout
    animals developed heart-failure-like phenotypes under stress conditions, with
    the S102P transgenics showing a weaker trend in the same direction. The same
    work localized Gatad1 protein to both the nucleus and the sarcomeric I-band in
    cardiomyocytes — an unexpected second compartment for a chromatin reader that
    has not been followed up in mammalian heart.
  evidence:
  - reference: PMID:28955713
    reference_title: Modeling GATAD1-Associated Dilated Cardiomyopathy in Adult Zebrafish.
    supports: SUPPORT

    snippet: >-
      Echocardiography in 17 adult descendants of first cousins revealed DCM in 2
      female siblings and idiopathic left ventricular enlargement in their
      brother.
    explanation: >-
      Documents echocardiography as the modality that ascertained and graded the
      cardiac phenotype across the pedigree.
- name: Exome Sequencing with Homozygosity Mapping
  description: >-
    The molecular diagnostic strategy that defined this entity, and the approach
    still indicated when recessive DCM is suspected in a consanguineous pedigree:
    genome-wide linkage plus high-density homozygosity mapping narrows the search
    to a shared homozygous interval, and exome sequencing of affected individuals
    then resolves the single shared homozygous variant within it. Because GATAD1
    sits at ClinGen Limited, a GATAD1 finding on a standard DCM panel is not on
    its own diagnostic; biallelic status and segregation must be established.
  evidence:
  - reference: PMID:21965549
    reference_title: Homozygosity mapping and exome sequencing reveal GATAD1 mutation in autosomal recessive dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

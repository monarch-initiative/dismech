- name: Aberrant Cardiomyocyte Nuclear Organization
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: HYPOTHETICAL
  description: >-
    In the CMD2B proband's left ventricular myocytes, GATAD1 was still nuclear but
    its subcellular distribution was abnormal and the nuclei themselves were
    morphologically aberrant — a cellular readout observed directly in human
    diseased myocardium by immunohistochemistry. The 14-3-3/NLS work was
    explicitly motivated by this observation and offers a candidate explanation
    for it. This node is also where the human missense phenotype and the mouse
    null phenotype demonstrably diverge: cardiomyocyte-specific Gatad1 deletion
    leaves nuclear shape unaffected. The abnormality is real and human-observed;
    its causal position — driver of remodeling versus accompaniment — is
    unresolved.

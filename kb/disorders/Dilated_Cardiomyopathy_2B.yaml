- name: Autosomal dominant familial dilated cardiomyopathy
  description: >-
    Clinically the GATAD1 family resembled ordinary autosomal dominant or
    sporadic dilated cardiomyopathy; only the consanguinity, the absence of
    disease in parents and offspring and the linkage analysis pointed to

  description: >-
    GATAD1 encodes GATA zinc finger domain-containing protein 1, a nuclear
    chromatin-associated protein originally identified as an interactor of histone
    H3 trimethylated at lysine 4 (H3K4me3) and subsequently characterized as a
    member of the EMSY/KDM5A/SIN3B complex that couples H3K4me3-marked promoters
    to Sin3/HDAC activity. It is not a sarcomeric protein, so the primary lesion
    in CMD2B is nuclear rather than contractile. The disease-associated homozygous
    missense variant p.Ser102Pro substitutes a proline for a conserved serine and
    was absent from HapMap, 1000 Genomes, and 474 ethnically matched controls.
    Whether the substitution inactivates the reader function or instead removes a
    regulatory phospho-switch on an otherwise intact protein is unresolved — hence
    the HYPOTHETICAL confidence and the two competing hypothesis groups carried on
    the downstream edges.

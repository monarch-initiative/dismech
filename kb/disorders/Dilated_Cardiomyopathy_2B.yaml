      label: Autosomal recessive inheritance
  description: >-
    Consanguineous kindred (the parents of the affected sibship were first
    cousins). All three affected siblings were homozygous for GATAD1 S102P;
    the six unaffected siblings were heterozygous or homozygous for the
    reference allele, and all eight offspring of the affected siblings were
    obligate heterozygotes without dilated cardiomyopathy on echocardiography.
    Linkage modelled as dominant, at any of three penetrance settings, found
    no locus.

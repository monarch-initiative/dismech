- name: Loss of Phospho-Ser102 14-3-3 Regulation
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Under the alternative model this is the proximal molecular event. Ser102 lies
    in an intrinsically disordered region and functions as a
    phosphorylation-dependent short linear motif: when phosphorylated it binds
    14-3-3 family proteins, a direct interaction confirmed by isothermal titration
    calorimetry against 14-3-3 epsilon. The p.Ser102Pro substitution destroys the
    phosphosite, so the phospho-dependent 14-3-3 interaction is lost. Because the
    region was independently validated as a functional nuclear localization
    signal, and 14-3-3 binding is proposed to mask it, losing the switch would
    deregulate GATAD1 nucleocytoplasmic transport rather than abolish GATAD1
    function. This node exists only under the alternative hypothesis and is
    unvalidated in cardiomyocytes.

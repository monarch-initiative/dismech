    is not straightforward loss of cardiomyocyte GATAD1.
  evidence:
  - reference: PMID:39641830
    reference_title: Loss of GATAD1 in cardiomyocyte does not cause cardiomyopathy in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Gatad1 cKO mutants exhibited normal cardiac function during the aging

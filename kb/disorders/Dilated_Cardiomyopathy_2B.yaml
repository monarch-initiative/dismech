      description of the model as negative under both baseline and stressed
      conditions.
discussions:
- discussion_id: gatad1_mouse_zebrafish_model_mismatch
  prompt: >-
    Why does cardiomyocyte-specific Gatad1 deletion leave mice with entirely
    normal hearts to 18 months and normal responses to pressure overload, when
    gatad1 knockout zebrafish develop heart-failure-like phenotypes under stress
    and homozygous human GATAD1 p.Ser102Pro carriers develop adult-onset dilated
    cardiomyopathy with abnormal myocyte nuclei?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#GATAD1 Chromatin Reader Dysfunction
  - pathophysiology#Loss of Phospho-Ser102 14-3-3 Regulation
  - pathophysiology#Aberrant Cardiomyocyte Nuclear Organization
  rationale: >-
    This is a mismatch about translational validity, not missing evidence:
    mammalian in vivo data exist and they are negative. Several readings are
    mechanistically distinct with different consequences for the pathograph.
    (1) The strongest reading is that the human allele is not a null. Ser102 is a
    regulatory phosphorylation site whose phosphorylated form binds 14-3-3 in a
    region that doubles as a nuclear localization signal; a missense that destroys
    that switch deregulates a protein that remains present, which a deletion
    cannot reproduce. The divergence in cardiomyocyte nuclear shape between mouse
    null and human missense is the sharpest evidence for this reading, and the
    reported restriction of Ser102 phosphorylation evidence to heart tissue would
    also explain why a broadly expressed chromatin protein gives a heart-limited
    phenotype. (2) The mouse knockout is cardiomyocyte-restricted, so a
    requirement for GATAD1 in non-myocyte cardiac lineages, or during development
    before the Cre driver acts, would be missed. (3) Species differences in
    cardiac chromatin regulation and lifespan-scaled exposure may mean 18 months
    of mouse aging does not correspond to the decades over which the human
    adult-onset phenotype emerges. (4) The human evidence is one consanguineous
    family at ClinGen Limited, so the possibility that GATAD1 is not the causal
    gene in that pedigree — with a linked variant elsewhere in the 7q21 homozygous
    interval responsible — cannot be excluded, and is resolved by the same
    experiments. Until this is settled both mechanistic chains in this entry are
    curated as HYPOTHETICAL.
  proposed_experiments:
  - experiment_id: exp_gatad1_s102p_knockin_mouse
    name: Gatad1 p.Ser102Pro knock-in mouse compared head-to-head with the null
    description: >-
      Generate a Gatad1 S102P knock-in mouse (germline and cardiomyocyte-specific)
      and phenotype it alongside the existing cKO in the same facility with the
      same readouts — cardiac function with aging, cardiomyocyte nuclear
      morphology, GATAD1 subcellular distribution, and response to transverse
      aortic constriction. This directly discriminates altered-function from
      loss-of-function: a knock-in that phenocopies the patients while the null
      stays normal would establish the phospho-switch model and retire the simple
      loss-of-function chain.
  - experiment_id: exp_gatad1_14_3_3_nls_cardiomyocyte_validation
    name: Validation of 14-3-3/NLS-dependent GATAD1 transport in cardiomyocytes
    description: >-
      Test the NLS-masking hypothesis in the disease-relevant cell type the
      original authors lacked: measure Ser102 phosphorylation stoichiometry,
      14-3-3 association, and GATAD1 nucleocytoplasmic distribution in human
      iPSC-derived and adult primary cardiomyocytes carrying p.Ser102Pro versus
      isogenic corrected and null controls, using maturation-promoting culture
      since an immature cardiomyocyte state may obscure the phenotype. The design
      must use genuine phosphorylation rather than S102D/S102E surrogates, because
      phosphomimetic substitutions at this site were shown not to reproduce the
      phosphorylated state.
  - experiment_id: exp_gatad1_cardiac_chromatin_profiling
    name: H3K4me3 and transcriptome profiling of GATAD1-variant cardiomyocytes
    description: >-
      Profile the H3K4me3 landscape, GATAD1/EMSY-complex occupancy, and the
      transcriptome of isogenic human cardiomyocytes carrying p.Ser102Pro versus
      corrected and null controls. The canonical hypothesis predicts a specific
      dysregulated cardiac gene program that has never been measured; a null
      result would undercut the epigenetic model in the human cell type of
      interest while leaving the transport model intact.
  - experiment_id: exp_gatad1_independent_family_ascertainment
    name: Ascertainment of independent biallelic GATAD1 families
    description: >-
      Query recessive-DCM and consanguineous cardiomyopathy cohorts and large
      biobanks for additional biallelic GATAD1 genotypes with segregation. A
      second independent family would move ClinGen's classification off Limited
      and simultaneously exclude the linked-variant alternative; continued absence
      across well-powered cohorts would argue the original association is not
      robust.
  evidence:
  - reference: PMID:39641830
    reference_title: Loss of GATAD1 in cardiomyocyte does not cause cardiomyopathy in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Together, these observations suggest that deletion of Gatad1 in
      cardiomyocytes does not induce cardiomyopathy during aging or affect the
      response to pressure overload stress in mice.
    explanation: >-
      The negative mammalian result that constitutes one half of the mismatch.
  - reference: PMID:28955713
    reference_title: Modeling GATAD1-Associated Dilated Cardiomyopathy in Adult Zebrafish.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Under stress conditions, longitudinal studies uncovered heart failure
      (HF)-like phenotypes in stable KO mutants and a tendency toward HF
      phenotypes in transgenic lines.
    explanation: >-
      The positive non-mammalian result that constitutes the other half — the same
      loss-of-function manipulation gives opposite answers in fish and mouse.
  - reference: PMID:21965549
    reference_title: Homozygosity mapping and exome sequencing reveal GATAD1 mutation in autosomal recessive dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immunohistochemistry demonstrated nuclear localization of GATAD1 in left
      ventricular myocytes, yet subcellular expression and nuclear morphology were
      aberrant in the proband.
    explanation: >-
      The human cellular phenotype that the mouse null explicitly fails to
      reproduce, anchoring the missense-versus-null reading of the mismatch.
  - reference: PMID:38605029
    reference_title: Pathogenic mutations of human phosphorylation sites affect protein-protein interactions.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Follow-up experiments reveal the structural basis of this interaction and
      suggest that 14-3-3 binding affects GATAD1 nucleocytoplasmic transport by
      masking a nuclear localisation signal.
    explanation: >-
      Supplies the concrete molecular reason a missense at Ser102 could act
      differently from a deletion, which is the leading resolution of the
      mismatch.
- discussion_id: gatad1_limited_gene_disease_validity
  prompt: >-
    Should CMD2B be curated as an established disease entity at all, given that
    the entire human evidence base is one consanguineous family and ClinGen's
    Dilated Cardiomyopathy GCEP classifies GATAD1-DCM as Limited?
  kind: INTERPRETATION
  status: OPEN
  attaches_to:
  - pathophysiology#GATAD1 Chromatin Reader Dysfunction
  rationale: >-
    MONDO maintains dilated cardiomyopathy 2B as a distinct gene-indexed node
    (MONDO:0013848, OMIM:614672) and dismech binds entries to MONDO, so the entity
    exists in the reference ontology regardless of its evidentiary strength. But a
    Limited ClinGen classification means the gene-disease relationship could be
    downgraded or disputed if no further families emerge — several DCM genes have
    followed exactly that path. The curatorial position taken here is to keep the
    entry, because a well-evidenced negative is more useful than silence: it gives
    a diagnostic laboratory encountering a GATAD1 variant one place to find the
    Limited classification, the recessive requirement, the single-family
    provenance, the phosphosite-not-null variant-interpretation caveat, and the
    failed mouse model together. The counterpart obligation is that every
    mechanistic node carries HYPOTHETICAL confidence and no clinical claim is
    stated more strongly than its source supports. If ClinGen moves GATAD1 to
    Disputed or Refuted, this entry should be revised to record that outcome
    rather than deleted.
  evidence:
  - reference: CGGV:assertion_56933afb-863f-46f5-884d-17522adb31a8-2024-08-07T160000.000Z
    reference_title: "GATAD1 / dilated cardiomyopathy (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      GATAD1 | HGNC:29941 | dilated cardiomyopathy | MONDO:0005021 | AR | Limited
    explanation: >-
      The classification that motivates the question, from the expert panel with
      DCM-specific remit.
  - reference: PMID:33947203
    reference_title: Evidence-Based Assessment of Genes in Dilated Cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      (63%), 25 (49%) had limited evidence, 4 (8%) were disputed, 2 (4%) had no
    explanation: >-
      Establishes that limited-evidence genes are the norm rather than the
      exception among genes proposed for DCM, and that a subset are ultimately
      disputed or refuted — the base rate against which GATAD1's Limited status
      should be read.
references:
- reference: PMID:20301486
  title: "Dilated Cardiomyopathy Overview"
  tags:
  - GeneReviews
notes: >-
  Curation notes.

  (1) Deep research: falcon (Edison) and claude_code were both run
  (research/Dilated_Cardiomyopathy_2B-deep-research-falcon.md and
  research/Dilated_Cardiomyopathy_2B-deep-research-claude_code.md). The two
  providers converged on the same sparse core (PMID:21965549 discovery,
  PMID:28955713 zebrafish, PMID:39641830 mouse), which is itself informative.
  Falcon additionally surfaced the 2024 phosphosite/14-3-3 interaction proteomics
  work (PMID:38605029) that the manual PubMed sweep had not connected to this
  disease; that lead was independently verified against the cached full text
  before use, and it materially changed the mechanistic model curated here.

  (2) GeneReviews baseline: there is no GATAD1-specific GeneReviews chapter. The
  applicable article is the disease-class-level "Dilated Cardiomyopathy Overview"
  (PMID:20301486), tagged in the references block above; its PubMed abstract is a
  scope/purpose statement with no Clinical Characteristics section, so it
  provides a genetic-evaluation and cascade-surveillance framework rather than a
  phenotype baseline to cross-reference. The phenotype set here is therefore
  drawn from the primary family report.

  (3) Named Entity Confusion preflight: performed and clean. MONDO:0013848 names
  GATAD1 as the causal gene (RO:0004003 HGNC:29941) and carries OMIM:614672; the
  GATAD1 literature is small and consistently reports the same 7q21 consanguineous
  kindred, so the numbered-series NEC risk that applies to the CMD1x/CMD2x allelic
  series (dilated cardiomyopathy is on the high-NEC-risk list) was checked
  explicitly against gene, OMIM, and synonyms and did not trigger. This entry is
  kept distinct from dilated cardiomyopathy 2A (MONDO:0012746), the adjacent
  number in the same series.

  (4) Evidence sparsity is real, not a curation gap. A PubMed sweep for GATAD1
  returns roughly 25 papers, most concerning GATAD1 in cancer, preeclampsia,
  ischemia-reperfusion, or blood-brain-barrier biology rather than inherited
  cardiomyopathy; only four publications bear directly on CMD2B (PMID:21965549
  gene discovery, PMID:28955713 zebrafish, PMID:38605029 phosphosite/14-3-3
  mechanism, PMID:39641830 mouse). No second family, no cardiac chromatin
  profiling, and no validated cellular disease model exist to cite. Claims were
  left unstated rather than padded with adjacent-topic citations.

  (5) The cardiomyopathy_maladaptive_remodeling module's Neurohormonal Activation
  node is intentionally not instantiated. Nothing in the CMD2B literature measures
  neurohormonal activation in these patients, and asserting the node solely
  because the module contains it would manufacture evidence. The entry conforms at
  the trigger, remodeling, and heart-failure nodes only.

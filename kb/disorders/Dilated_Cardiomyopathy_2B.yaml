name: Dilated Cardiomyopathy 2B
creation_date: "2026-08-02T00:00:00Z"
synonyms:
- CMD2B
- GATAD1 familial isolated dilated cardiomyopathy
- cardiomyopathy, dilated, 2B
- dilated cardiomyopathy type 2B
- familial isolated dilated cardiomyopathy caused by mutation in GATAD1
description: >-
  Dilated cardiomyopathy 2B (CMD2B) is the GATAD1-related form of familial
  isolated dilated cardiomyopathy and one of the few DCM entities that segregates
  as an autosomal recessive rather than an autosomal dominant trait. It was
  defined in a single consanguineous family in which homozygosity mapping placed
  an adult-onset recessive DCM locus at chromosome 7q21 and exome sequencing of
  two affected sisters resolved it to a homozygous missense variant (p.Ser102Pro)
  in GATAD1, encoding GATA zinc finger domain-containing protein 1. GATAD1 is not
  a sarcomeric or cytoskeletal protein — it is a chromatin "reader" originally
  identified as an interactor of histone H3 trimethylated at lysine 4 (H3K4me3)
  and a component of the EMSY/KDM5A/SIN3B histone-modifying complex — so CMD2B is
  a nuclear/epigenetic route to dilated cardiomyopathy rather than a defect of
  force generation or transmission. In the index family GATAD1 was still nuclear
  in left ventricular myocytes but its subcellular distribution and the nuclear
  morphology of those myocytes were aberrant in the proband; thirteen
  heterozygous relatives remained free of myocardial disease into old age,
  establishing a fully recessive phenotype.

  Two mechanistic models are curated in parallel rather than merged. The
  canonical model, proposed with the gene discovery, is loss of H3K4me3-directed
  epigenetic control of cardiac gene expression. An alternative model, arising
  from 2024 interaction proteomics, is that Ser102 is not merely a conserved
  residue but a regulatory phosphorylation site: phosphorylated Ser102 binds
  14-3-3 proteins, the binding region is a functional nuclear localization signal,
  and 14-3-3 engagement is proposed to mask that signal and govern GATAD1
  nucleocytoplasmic transport. The p.Ser102Pro substitution abolishes this
  phospho-dependent interaction, which would make CMD2B a disease of lost
  regulation of a still-present protein rather than of absent protein.

  The evidence base is deliberately curated as unsettled. Support rests on that
  one pedigree plus an adult zebrafish model in which gatad1 knockout fish
  developed heart-failure-like phenotypes under stress, while a 2024
  cardiomyocyte-specific Gatad1 knockout mouse showed normal cardiac function to
  18 months, normal cardiomyocyte nuclear shape, and a normal response to
  pressure overload — directly failing to reproduce the human phenotype. ClinGen's
  Dilated Cardiomyopathy Gene Curation Expert Panel classifies the GATAD1-DCM
  relationship as Limited (autosomal recessive). Every mechanistic node here
  therefore carries HYPOTHETICAL confidence, and the mouse-human discrepancy is
  recorded as a HUMAN_MODEL_MISMATCH discussion rather than smoothed over.

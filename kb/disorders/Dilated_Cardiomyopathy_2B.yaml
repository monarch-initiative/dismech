mechanistic_hypotheses:
- hypothesis_group_id: gatad1_epigenetic_dysregulation
  hypothesis_label: S102P disturbs GATAD1-dependent chromatin regulation in the heart
  status: EMERGING
  description: >-
    The model proposed with the gene discovery: GATAD1 works in an
    H3K4me3-associated chromatin-regulatory complex, and the variant perturbs
    cardiac gene expression, as combined loss of the complex partners Hdac1 and
    Hdac2 does in mouse heart. It is an inference from GATAD1's interaction
    partners. No GATAD1-dependent cardiac gene set has been measured, and the
    S102P protein keeps its complex partners in HEK293 cells.
  evidence:
  - reference: PMID:21965549
    reference_title: Homozygosity mapping and exome sequencing reveal GATAD1 mutation in autosomal recessive dilated cardiomyopathy.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      While the specific effects of GATAD1-S102P on nucleosome protein
      interactions and downstream gene expression are unknown, the mutation
      leads to a heart-specific phenotype and implicates epigenetic
      dysregulation as a novel basis for human DCM.
    explanation: States the hypothesis and that its molecular basis is unmeasured.
- hypothesis_group_id: gatad1_14_3_3_nucleocytoplasmic
  hypothesis_label: Loss of phospho-Ser102/14-3-3 binding alters GATAD1 nucleocytoplasmic distribution
  status: EMERGING
  description: >-
    Ser102, the residue the variant replaces, is a phosphorylation site whose
    phosphorylated form binds 14-3-3 proteins, possibly masking a nuclear
    localization signal. Losing it could explain the disturbed GATAD1
    distribution seen in the proband's myocardium. The binding is shown only
    with peptides and recombinant protein, and in HEK293 cells the tagged
    S102P protein still reached the nucleus.
  evidence:
  - reference: PMID:38605029
    reference_title: Pathogenic mutations of human phosphorylation sites affect protein-protein interactions.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Follow-up experiments reveal the structural basis of this interaction and
      suggest that 14-3-3 binding affects GATAD1 nucleocytoplasmic transport by
      masking a nuclear localisation signal.
    explanation: The hypothesis as proposed by the authors of the interaction study.
- hypothesis_group_id: gatad1_s102p_mutation_specific
  hypothesis_label: S102P acts through a mutation-specific effect rather than simple loss of GATAD1
  status: EMERGING
  description: >-
    The mutant protein is present in patient heart, the patient nuclear and
    localization abnormalities are absent from the Gatad1 cardiomyocyte
    knockout mouse, and that mouse has no cardiomyopathy. These observations
    favour an effect specific to the S102P protein over simple deficiency.
    Heterozygous carriers are unaffected, so any such effect would have to be
    dose-dependent. The authors of the mouse study propose testing it in an
    S102P knock-in.
  evidence:
  - reference: PMID:39641830
    reference_title: Loss of GATAD1 in cardiomyocyte does not cause cardiomyopathy in mice.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      While the recessive mutation is often considered a loss-of-function
      mutation, it remains possible that the S102P mutation could be a
      gain-of-function mutation with dose-dependent effects that impair
      cellular functions.
    explanation: The mouse study's reading of its negative result.
  - reference: PMID:21965549
    reference_title: Homozygosity mapping and exome sequencing reveal GATAD1 mutation in autosomal recessive dilated cardiomyopathy.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The similarity of GATAD1 staining patterns and nuclear morphology in
      TPM1-DCM and normal control tissues, distinct from the proband,
      indicates that GATAD1-S102P has a mutation-specific effect.
    explanation: The discovery paper's reading of the patient histology.
- hypothesis_group_id: gatad1_loss_of_function
  hypothesis_label: S102P is a recessive loss-of-function allele
  status: EMERGING
  description: >-
    Recessive inheritance with healthy heterozygotes is the usual signature of
    loss of function, and gatad1 knockout zebrafish develop heart
    failure-like phenotypes when stressed. Against it, the mutant protein is
    present in patient myocardium, and deleting Gatad1 in mouse cardiomyocytes
    causes no cardiomyopathy up to 18 months or after pressure overload. The
    mouse result does not exclude a requirement for GATAD1 in other cardiac
    cell types or in cardiomyocyte progenitors before the Cre driver acts. A
    separate myocardium-specific Gatad1 knockout fared worse after
    ischemia-reperfusion, with GATAD1 acting as a transcriptional regulator of
    fatty acid and glucose oxidation genes; like the zebrafish result, the
    requirement shows only under an added stress, and ischemic injury is not
    the disease modelled here.
  evidence:
  - reference: PMID:39626862
    reference_title: GATAD1 is involved in sphingosylphosphorylcholine-attenuated myocardial ischemia-reperfusion injury by modulating myocardial fatty acid oxidation and glucose oxidation.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      myocardium-specific Gatad1 knockout (Gatad1 CKO) significantly increased
      the myocardial infarct size, impaired cardiac function in I/R mice
    explanation: >-
      Loss of Gatad1 in mouse myocardium reduces tolerance of an acute ischemic
      stress; indirect for dilated cardiomyopathy, which this model does not
      test.
  - reference: PMID:28955713
    reference_title: Modeling GATAD1-Associated Dilated Cardiomyopathy in Adult Zebrafish.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Under stress conditions, longitudinal studies uncovered heart failure
      (HF)-like phenotypes in stable KO mutants and a tendency toward HF
      phenotypes in transgenic lines.
    explanation: Loss of gatad1 in zebrafish produces heart failure-like phenotypes under stress.
  - reference: PMID:39641830
    reference_title: Loss of GATAD1 in cardiomyocyte does not cause cardiomyopathy in mice.
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Together, these observations suggest that deletion of Gatad1 in
      cardiomyocytes does not induce cardiomyopathy during aging or affect the
      response to pressure overload stress in mice.
    explanation: Cardiomyocyte loss of Gatad1 is not sufficient for cardiomyopathy in mice.

- name: Loss of Phospho-Ser102-Dependent 14-3-3 Binding
  description: >-
    Phosphorylated Ser102 of GATAD1 binds 14-3-3 proteins with low-micromolar
    affinity, and a crystal structure of 14-3-3 epsilon with the
    phosphopeptide has been solved. Binding requires the phosphate: neither
    the unphosphorylated peptide, the S102P peptide nor phosphomimetic
    aspartate or glutamate peptides bind. Ser102 phosphorylation has been
    detected only in murine heart tissue, which the authors take as a hint of a
    heart-specific function. Full-length S102P GATAD1 in HEK293 cells kept the
    same interaction partners as wild type, so the known complexes are not
    disrupted; the effect of losing the 14-3-3 interaction in cardiomyocytes
    has not been tested.

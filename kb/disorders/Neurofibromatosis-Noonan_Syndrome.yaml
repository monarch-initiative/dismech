      caused by mutations of the NF1 gene
    explanation: >-
      NFNS is a variant of NF1, which is inherited in an autosomal dominant
      manner.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    NFNS is an extremely rare entity; a 2025 systematic review identified only 42
    eligible publications across the literature. A precise population prevalence
    has not been established.
  evidence:
  - reference: PMID:39643432
    reference_title: "Portraying the full picture of Neurofibromatosis-Noonan syndrome: a systematic review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neurofibromatosis-Noonan syndrome (NFNS) is an extremely rare genetic
      entity combining the clinical phenotype of two conditions
    explanation: Establishes the extreme rarity of NFNS.
treatments:
- name: Multidisciplinary Surveillance and Supportive Care
  description: >-
    Management is largely supportive and mirrors NF1/NS surveillance:
    dermatologic monitoring, cardiology evaluation for congenital heart defects,
    orthopedic assessment for scoliosis and pectus deformity, growth monitoring,
    and periodic evaluation for tumors given the NF1 tumor-predisposition
    component.
  treatment_term:
    preferred_term: supportive care
    term:
      id: MAXO:0000950
      label: supportive care
- name: Genetic Counseling
  description: >-
    Genetic counseling is indicated given autosomal dominant inheritance and the
    diagnostic complexity created by phenotypic overlap among NF1, NS, and NFNS,
    for which molecular genetic testing is often required.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: MAXO:0000079
      label: genetic counseling

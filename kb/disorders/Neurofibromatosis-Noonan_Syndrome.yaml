- name: RAS-MAPK Pathway Hyperactivation
  description: >-
    Reduced neurofibromin allows prolonged RAS-GTP accumulation and constitutive
    activation of the RAS-RAF-MEK-ERK cascade. This single biochemical
    derangement produces the dual clinical output of NFNS: the NF1 pigmentary
    and tumor features and the Noonan-like developmental phenotype, reflecting
    the convergence of the RASopathies on RAS-MAPK dysregulation.

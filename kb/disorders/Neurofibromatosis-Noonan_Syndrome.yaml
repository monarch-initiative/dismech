name: Neurofibromatosis-Noonan Syndrome
creation_date: "2026-07-12T00:00:00Z"
description: >-
  Neurofibromatosis-Noonan syndrome (NFNS) is a rare RASopathy that combines
  clinical features of neurofibromatosis type 1 (NF1) — cafe-au-lait macules,
  Lisch nodules, axillary/inguinal freckling, and neurofibromas — with features
  of Noonan syndrome (NS) — short stature, characteristic facial dysmorphism
  (hypertelorism, ptosis, downslanting palpebral fissures, low-set posteriorly
  rotated ears), a broad or webbed neck, pectus deformity, and congenital heart
  defects. Molecular studies show that heterozygous loss-of-function mutations in
  the NF1 gene are the major molecular event underlying NFNS, with a
  disproportionate share of in-frame mutations clustering in the GAP-related
  domain of neurofibromin; rare cases carry a PTPN11 mutation in addition to an
  NF1 mutation. NFNS is therefore considered a variant of NF1 within the RASopathy
  spectrum, converging on dysregulation of the RAS-MAPK signaling pathway. The
  phenotypic overlap between NF1, NS, and NFNS often makes molecular genetic
  testing necessary for a correct diagnosis.
category: Genetic
parents:
- RASopathy

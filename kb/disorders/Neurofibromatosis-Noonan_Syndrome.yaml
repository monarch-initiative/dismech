disease_term:
  preferred_term: neurofibromatosis-Noonan syndrome
  description: >-
    A RASopathy and variant of neurofibromatosis type 1 combining features of NF1
    and Noonan syndrome, caused predominantly by NF1 mutations that dysregulate
    RAS-MAPK signaling.
  term:
    id: MONDO:0011035
    label: neurofibromatosis-Noonan syndrome
pathophysiology:
- name: Neurofibromin RAS-GAP Loss of Function
  description: >-
    NFNS is caused predominantly by germline heterozygous loss-of-function
    mutations in NF1, which encodes neurofibromin, a RAS GTPase-activating protein
    (RAS-GAP). A high prevalence of in-frame defects affecting exons 24 and 25 —
    which encode a portion of the GAP-related domain — is observed in NFNS
    cohorts, implicating impaired RAS-GAP function of neurofibromin as the
    proximal molecular lesion. Reduced neurofibromin RAS-GAP activity removes the
    normal restraint on RAS, driving the RASopathy phenotype.
  genes:
  - preferred_term: NF1
    term:
      id: hgnc:7765
      label: NF1
  molecular_functions:
  - preferred_term: RAS GTPase activator activity
    term:
      id: GO:0005096
      label: GTPase activator activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: negative regulation of Ras protein signal transduction
    term:
      id: GO:0046580
      label: negative regulation of Ras protein signal transduction
    modifier: DECREASED
  evidence:
  - reference: PMID:16380919
    reference_title: "NF1 gene mutations represent the major molecular event underlying neurofibromatosis-Noonan syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous NF1 defects were identified in 16 of the 17 unrelated subjects
      included in the study, which provides evidence that mutations in NF1
      represent the major molecular event underlying this condition.
    explanation: >-
      Establishes NF1 loss-of-function mutations as the major molecular cause of
      NFNS.
  - reference: PMID:16380919
    reference_title: "NF1 gene mutations represent the major molecular event underlying neurofibromatosis-Noonan syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a high prevalence of inframe defects affecting exons 24 and 25, which
      encode a portion of the GAP-related domain of the protein, was observed
    explanation: >-
      Localizes a disproportionate share of NFNS mutations to the neurofibromin
      GAP-related (RAS-GAP) domain.
  - reference: PMID:25877329
    reference_title: "A RASopathy gene commonly mutated in cancer: the neurofibromatosis type 1 tumour suppressor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The NF1 gene encodes a RAS GTPase-activating protein called neurofibromin
      and is one of several genes that (when mutant) affect RAS-MAPK signalling,
      causing related diseases collectively known as RASopathies.
    explanation: >-
      Establishes neurofibromin as a RAS-GAP whose dysfunction produces a
      RASopathy.
  downstream:
  - target: RAS-MAPK Pathway Dysregulation
    description: >-
      Loss of neurofibromin RAS-GAP activity removes restraint on RAS, driving
      hyperactive RAS-MAPK signaling.
    causal_link_type: DIRECT
- name: RAS-MAPK Pathway Dysregulation
  description: >-
    Like the other RASopathies, NFNS converges on dysregulation of the RAS-MAPK
    (RAS/ERK) signal transduction pathway. NF1 and NS belong to a group of
    clinically related disorders that share this common pathogenesis, which
    accounts for the substantial phenotypic overlap between them and the mixed
    NF1/NS presentation that defines NFNS.
  biological_processes:
  - preferred_term: Ras protein signal transduction
    term:
      id: GO:0007265
      label: Ras protein signal transduction
    modifier: INCREASED
  - preferred_term: MAPK cascade
    term:
      id: GO:0000165
      label: MAPK cascade
    modifier: INCREASED
  evidence:
  - reference: PMID:19845691
    reference_title: "Noonan syndrome and neurofibromatosis type I in a family with a novel mutation in NF1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Noonan syndrome (NS) and neurofibromatosis type I (NF1) belong to a group
      of clinically related disorders that share a common pathogenesis,
      dysregulation of the RAS-MAPK pathway.
    explanation: >-
      Establishes RAS-MAPK dysregulation as the shared final common mechanism
      underlying NF1, NS, and NFNS.
- name: NFNS as a Variant of NF1
  description: >-
    Genetic screening of NFNS cohorts shows that NFNS is caused by mutations of
    the NF1 gene, some of which cause classic NF1 in other individuals, supporting
    the view that NFNS represents a variant of NF1 rather than a separate genetic
    entity. Rarely, an additional PTPN11 mutation is present alongside the NF1
    mutation, contributing the Noonan-syndrome component of the phenotype.
  genes:
  - preferred_term: NF1
    term:
      id: hgnc:7765
      label: NF1
  evidence:
  - reference: PMID:16380919
    reference_title: "NF1 gene mutations represent the major molecular event underlying neurofibromatosis-Noonan syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results support the view that NFNS represents a variant of NF1 and is
      caused by mutations of the NF1 gene, some of which have been demonstrated to
      cause classic NF1 in other individuals.
    explanation: >-
      Supports the nosological placement of NFNS as an NF1 variant.
  - reference: PMID:19845691
    reference_title: "Noonan syndrome and neurofibromatosis type I in a family with a novel mutation in NF1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The major gene causing NFNS is NF1. Rarely, a mutation in PTPN11 in
      addition to an NF1 mutation is present.
    explanation: >-
      Documents NF1 as the major NFNS gene and the rare co-occurrence of a PTPN11
      mutation.

genetic:
- name: NF1
  gene_term:
    preferred_term: NF1
    term:
      id: hgnc:7765
      label: NF1
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  notes: >-
    NF1 is the major gene underlying NFNS, with heterozygous loss-of-function
    mutations identified in the large majority of individuals (~87.5% in a
    systematic review; 16/17 in the seminal molecular cohort). Mutations include
    nonsense changes, out-of-frame deletions, missense changes, small in-frame
    deletions, and larger deletions, with a notable clustering of in-frame defects
    in the GAP-related domain (exons 24-25).
  evidence:
  - reference: PMID:39643432
    reference_title: "Portraying the full picture of Neurofibromatosis-Noonan syndrome: a systematic review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As for the genetic foundation of NFNS, NF1 gene mutations were depicted in
      87.5% of individuals.
    explanation: Quantifies the proportion of NFNS individuals with an NF1 mutation.
  - reference: PMID:19845691
    reference_title: "Noonan syndrome and neurofibromatosis type I in a family with a novel mutation in NF1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      revealing a novel missense mutation in exon 24, p.L1390F, affecting the
      GAP-domain
    explanation: >-
      Example of an NFNS-causing NF1 missense mutation in the GAP-related domain.
- name: PTPN11
  gene_term:
    preferred_term: PTPN11
    term:
      id: hgnc:9644
      label: PTPN11
  association: Pathogenic Variants
  relationship_type: MODIFIER
  notes: >-
    In rare NFNS cases a PTPN11 mutation is present in addition to an NF1
    mutation, contributing the Noonan-syndrome component of the phenotype. PTPN11
    is the most common Noonan-syndrome gene; here it acts as a rare additional
    (second-locus) contributor rather than the primary cause.
  evidence:
  - reference: PMID:19845691
    reference_title: "Noonan syndrome and neurofibromatosis type I in a family with a novel mutation in NF1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The major gene causing NFNS is NF1. Rarely, a mutation in PTPN11 in
      addition to an NF1 mutation is present.
    explanation: >-
      Documents rare PTPN11 co-occurrence with an NF1 mutation in NFNS.

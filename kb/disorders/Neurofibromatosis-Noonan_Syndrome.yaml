      reference_title: "Neurofibromatosis-Noonan syndrome: a prospective monocentric study of 26 patients and literature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Given the elevated risk of CHM, especially pulmonic stenosis, proactive
        cardiovascular assessment similar to other RASopathies is recommended
        for NS-NF patients, regardless of NF1 PV type.
      explanation: >-
        Congenital heart malformations, particularly pulmonic valve stenosis,
        are a defining organ-system complication requiring cardiovascular care.
  - classification_value: DERMATOLOGY
    evidence:
    - reference: PMID:39643432
      reference_title: "Portraying the full picture of Neurofibromatosis-Noonan syndrome: a systematic review of literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The hallmark features of NFNS at diagnosis were 'café au lait' macules,
        typical facial dysmorphia of NS, postnatal SS, pectus abnormalities,
        broad neck and lentigines.
      explanation: >-
        Multiple cafe-au-lait macules and lentigines/skinfold freckling are
        hallmark dermatologic presenting manifestations of NFNS, accompanied by
        cutaneous neurofibromas in most adults.
  mechanistic_category:
  - classification_value: RASopathy

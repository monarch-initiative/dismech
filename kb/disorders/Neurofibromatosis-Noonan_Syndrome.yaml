genetic:
- name: NF1
  gene_term:
    preferred_term: NF1
    term:
      id: hgnc:7765
      label: NF1
  relationship_type: CAUSATIVE
  association: Germline Loss-of-Function Mutations
  notes: >-
    Heterozygous loss-of-function variants in NF1, which encodes the RAS-GTPase
    activating protein neurofibromin, are the major molecular cause of NFNS. A
    notable enrichment of in-frame defects affecting the GAP-related domain
    (exons 24-25 in older nomenclature) has been reported in NFNS cohorts. PTPN11
    mutations, the most common cause of classic Noonan syndrome, are typically
    absent, indicating that NFNS and NS are genetically distinct.
  evidence:
  - reference: PMID:16380919
    reference_title: "NF1 gene mutations represent the major molecular event underlying neurofibromatosis-Noonan syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous NF1 defects were identified in 16 of the 17 unrelated
      subjects included in the study, which provides evidence that mutations in
      NF1 represent the major molecular event underlying this condition.
    explanation: >-
      Direct human cohort evidence that heterozygous NF1 variants are the major
      cause of NFNS.
  - reference: PMID:16380919
    reference_title: "NF1 gene mutations represent the major molecular event underlying neurofibromatosis-Noonan syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a high prevalence of inframe defects affecting exons 24 and 25, which
      encode a portion of the GAP-related domain of the protein, was observed.
    explanation: >-
      Documents the enrichment of GAP-related-domain in-frame NF1 defects in NFNS.
  - reference: PMID:39643432
    reference_title: "Portraying the full picture of Neurofibromatosis-Noonan syndrome: a systematic review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As for the genetic foundation of NFNS, NF1 gene mutations were depicted in
      87.5% of individuals.
    explanation: >-
      Systematic review confirms NF1 mutations underlie the large majority of NFNS cases.
pathophysiology:
- name: Neurofibromin RAS-GAP Loss
  description: >-
    Germline heterozygous NF1 loss-of-function variants reduce neurofibromin
    dosage. Neurofibromin is a RAS-GTPase activating protein (RAS-GAP) that
    accelerates hydrolysis of active RAS-GTP to inactive RAS-GDP. Reduced
    neurofibromin function removes this negative restraint on RAS, the shared
    initiating lesion of NFNS.

    description: Loss of neurofibromin RAS-GAP activity increases RAS effector signaling.
    causal_link_type: DIRECT
  - target: Somatic NF1 Second Hit
    description: Germline NF1 heterozygosity creates the single-hit background in which somatic inactivation of the remaining wild-type NF1 allele yields biallelic loss in Schwann-lineage cells.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: RAS-MAPK Pathway Hyperactivation
  biological_scale: MOLECULAR
  description: >-
    Reduced neurofibromin allows prolonged RAS-GTP accumulation and constitutive
    activation of the RAS-RAF-MEK-ERK cascade. This single biochemical
    derangement produces the dual clinical output of NFNS: the NF1 pigmentary
    and tumor features and the Noonan-like developmental phenotype, reflecting
    the convergence of the RASopathies on RAS-MAPK dysregulation.

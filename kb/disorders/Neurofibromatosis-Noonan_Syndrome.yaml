treatments:
- name: Multidisciplinary Surveillance and Supportive Care
  description: >-
    Management follows NF1 and Noonan syndrome supportive care: periodic
    cutaneous, ophthalmologic, cardiac, skeletal, and neurodevelopmental
    surveillance, with symptomatic management of complications.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: MEK Inhibitors
  description: >-
    MEK inhibitors such as selumetinib target the downstream effector of
    hyperactive RAS-MAPK signaling and are approved for symptomatic, inoperable
    plexiform neurofibromas in NF1; they are a rational option for the
    neurofibroma burden of NFNS given its shared NF1/RAS-MAPK basis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: targeted therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
  evidence:
  - reference: PMID:33395032
    reference_title: "MEK inhibitors in RASopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      selumetinib (Koselugo) received FDA approval for children 2 years of age
      and older with inoperable, symptomatic pNF.
    explanation: >-
      MEK inhibition is an approved targeted therapy for plexiform neurofibromas
      in the NF1/RASopathy spectrum to which NFNS belongs.
- name: Genetic Counseling
  description: >-
    Genetic counseling addresses the autosomal dominant NF1-based inheritance of
    NFNS and the recurrence risk in affected families.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
notes: >-
  NFNS (OMIM:601321, Orphanet:638) should be distinguished from classic NF1,
  classic Noonan syndrome, and Legius syndrome (SPRED1). It is caused
  predominantly by NF1 variants (so is an allelic variant of NF1), whereas
  classic Noonan syndrome is most often caused by PTPN11 and Legius syndrome by
  SPRED1. Neurofibromas and Lisch nodules favor the NF1/NFNS end of the
  spectrum, while their absence with isolated pigmentary features should prompt
  consideration of Legius syndrome. This is an initial entry created to complete
  the RASopathy set alongside Noonan syndrome, Costello syndrome,
  cardiofaciocutaneous syndrome, NF1, and NSLH; it can be enriched with
  additional cohort/frequency evidence in follow-up.

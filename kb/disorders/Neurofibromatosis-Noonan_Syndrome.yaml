diagnosis:
- name: Molecular genetic testing of NF1 and RASopathy genes
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Multigene RASopathy panel or NF1 sequencing and deletion/duplication
    analysis confirms heterozygous pathogenic NF1 variants (found in roughly
    87.5% of cases) and distinguishes NFNS from PTPN11-driven Noonan syndrome,
    SPRED1-related Legius syndrome, and rare digenic NF1/PTPN11 presentations.
  evidence:
  - reference: ORPHA:638
    reference_title: "Neurofibromatosis-Noonan syndrome"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      As these three entities have significant phenotypic overlap, molecular
      genetic testing is often necessary for a correct diagnosis (such as when
      café-au-lait spots are present in patients diagnosed with NS).
    explanation: >-
      Establishes molecular genetic testing as essential to resolve phenotypic
      overlap among NFNS, NF1, and Noonan syndrome.
  - reference: PMID:16380919
    reference_title: "NF1 gene mutations represent the major molecular event underlying neurofibromatosis-Noonan syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous NF1 defects were identified in 16 of the 17 unrelated
      subjects included in the study, which provides evidence that mutations in
      NF1 represent the major molecular event underlying this condition.
    explanation: >-
      Demonstrates molecular identification of pathogenic NF1 variants in the
      vast majority of clinically diagnosed NFNS probands.
- name: Cardiovascular evaluation and echocardiography
  diagnosis_term:
    preferred_term: Echocardiography Test
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  description: >-
    Baseline and periodic cardiovascular evaluation including echocardiography
    detects congenital heart malformations (present in 19.2% to 36.8% of NFNS
    patients), particularly pulmonic valve stenosis and mitral valve
    prolapse/dysplasia, as well as rare literature-reported hypertrophic
    cardiomyopathy (2.6%).
  evidence:
  - reference: PMID:40289159
    reference_title: "Neurofibromatosis-Noonan syndrome: a prospective monocentric study of 26 patients and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given the elevated risk of CHM, especially pulmonic stenosis, proactive
      cardiovascular assessment similar to other RASopathies is recommended for
      NS-NF patients, regardless of NF1 PV type.
    explanation: >-
      Recommends proactive RASopathy-style cardiovascular assessment in all
      patients with NFNS regardless of specific NF1 variant type.
  - reference: PMID:40289159
    reference_title: "Neurofibromatosis-Noonan syndrome: a prospective monocentric study of 26 patients and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mitral valves prolapse/dysplasia 7.7% (2/26) 5.6% (17/304)"
    explanation: >-
      Documents mitral valve prolapse or dysplasia in 7.7% of prospective and
      5.6% of literature NFNS patients on cardiac evaluation.
  - reference: PMID:40289159
    reference_title: "Neurofibromatosis-Noonan syndrome: a prospective monocentric study of 26 patients and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hypertrophic cardiomyopathy 0% (0/26) 2.6% (8/304)"
    explanation: >-
      Quantifies hypertrophic cardiomyopathy as a rare RASopathy cardiac
      manifestation reported in 2.6% (8/304) of NFNS literature cases.
- name: Clinical dysmorphology and dermatologic examination
  diagnosis_term:
    preferred_term: Physical Examination
    term:
      id: NCIT:C20989
      label: Physical Examination
  description: >-
    Structured physical, dermatologic, and ophthalmologic examination evaluates
    NIH NF1 criteria (cafe-au-lait macules, skinfold freckling, neurofibromas,
    Lisch nodules) alongside Noonan-like craniofacial dysmorphism (ptosis,
    hypertelorism, downslanted palpebral fissures, low-set posteriorly rotated
    ears) and pectus deformity.
  evidence:
  - reference: PMID:40289159
    reference_title: "Neurofibromatosis-Noonan syndrome: a prospective monocentric study of 26 patients and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presence of at least two facial abnormalities (e.g., low-set ears,
      downslanted palpebral fissures, hypertelorism, and ptosis) was
      consistently observed in 'typical' cases.
    explanation: >-
      Defines the clinical craniofacial signs used to recognize typical NFNS on
      physical examination.
  - reference: PMID:39643432
    reference_title: "Portraying the full picture of Neurofibromatosis-Noonan syndrome: a systematic review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The hallmark features of NFNS at diagnosis were 'café au lait' macules,
      typical facial dysmorphia of NS, postnatal SS, pectus abnormalities, broad
      neck and lentigines.
    explanation: >-
      Confirms that combined dermatologic, anthropometric, thoracic, and facial
      dysmorphology findings anchor clinical recognition at diagnosis.
treatments:
- name: Multidisciplinary Surveillance and Supportive Care
  description: >-
    Management combines NF1 and Noonan syndrome surveillance protocols: periodic
    cutaneous, ophthalmologic, proactive cardiac (echocardiographic), skeletal,
    and neurodevelopmental assessments, with symptomatic management of
    complications.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:40289159
    reference_title: "Neurofibromatosis-Noonan syndrome: a prospective monocentric study of 26 patients and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given the elevated risk of CHM, especially pulmonic stenosis, proactive
      cardiovascular assessment similar to other RASopathies is recommended for
      NS-NF patients, regardless of NF1 PV type.
    explanation: >-
      Supports proactive RASopathy-aligned cardiovascular surveillance in NFNS
      management.
  - reference: PMID:39643432
    reference_title: "Portraying the full picture of Neurofibromatosis-Noonan syndrome: a systematic review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on our findings, we emphasise on the importance of searching for NS
      features in patients with NF1 since the prognosis, comorbidities and
      consequently management could be altered.
    explanation: >-
      Highlights that identifying NFNS comorbidities alters clinical
      surveillance and multidisciplinary management relative to classic NF1.
- name: MEK Inhibitors
  description: >-
    MEK inhibitors such as selumetinib target the downstream effector of
    hyperactive RAS-MAPK signaling and are approved for symptomatic, inoperable
    plexiform neurofibromas in NF1; they are a rational targeted option for the
    plexiform neurofibroma burden of NFNS given its shared NF1/RAS-MAPK basis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Targeted Therapy
    term:
      id: NCIT:C93352
      label: Targeted Therapy
    therapeutic_agent:
    - preferred_term: selumetinib
      term:
        id: CHEBI:90227
        label: selumetinib
  target_phenotypes:
  - preferred_term: Plexiform neurofibroma
    term:
      id: HP:0009732
      label: Plexiform neurofibroma
  target_mechanisms:
  - target: RAS-MAPK Pathway Hyperactivation
    treatment_effect: INHIBITS
    description: Selective MEK1/2 inhibition blocks excessive downstream RAF-MEK-ERK signaling driven by neurofibromin loss.
    evidence:
    - reference: PMID:33395032
      reference_title: "MEK inhibitors in RASopathies."
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        MEKi represent promising therapies for RAS-driven neoplasias and
        RASopathies associated with increased Ras/MAPK activity.
      explanation: >-
        MEK inhibitors directly suppress elevated RAS-MAPK cascade activity in
        NF1 and related RASopathies.
  - target: Schwann Cell Neurofibroma Initiation
    treatment_effect: INHIBITS
    description: Selumetinib shrinks symptomatic, inoperable NF1-driven plexiform neurofibromas.
    evidence:
    - reference: PMID:33395032
      reference_title: "MEK inhibitors in RASopathies."
      supports: SUPPORT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The phase 2 trial (SPRINT) of selumetinib in pNF resulted in at least
        20% reduction in the size of pNF from baseline in 71% of patients and
        was associated with clinically meaningful improvements.
      explanation: >-
        Demonstrates clinical tumor shrinkage of NF1-spectrum plexiform
        neurofibromas with selumetinib.
  evidence:
  - reference: PMID:33395032
    reference_title: "MEK inhibitors in RASopathies."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On the basis of this trial, selumetinib (Koselugo) received FDA approval
      for children 2 years of age and older with inoperable, symptomatic pNF.
    explanation: >-
      MEK inhibition with selumetinib is an approved targeted therapy for
      plexiform neurofibromas in the NF1/RASopathy spectrum to which NFNS
      belongs.
- name: Genetic Counseling
  description: >-
    Genetic counseling addresses the autosomal dominant NF1-based inheritance of
    NFNS, variable expressivity within families, and cascade family evaluation.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:39643432
    reference_title: "Portraying the full picture of Neurofibromatosis-Noonan syndrome: a systematic review of literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As for the circumstance of discovery of NFNS, it was dominated by family
      investigation followed by neurofibromas, facial dysmorphia and short
      stature (SS).
    explanation: >-
      Because family investigation is the single most common route to NFNS
      diagnosis, genetic counseling and cascade family evaluation are central to
      clinical care.
notes: >-
  NFNS (OMIM:601321, ORPHA:638) should be distinguished from classic NF1,
  classic Noonan syndrome, cardiofaciocutaneous syndrome, and Legius syndrome
  (SPRED1). It is caused predominantly by germline heterozygous NF1 variants
  (making it an allelic phenotypic variant of NF1, often enriched for missense
  and in-frame GAP-related domain defects), whereas classic Noonan syndrome is
  most often caused by PTPN11 and Legius syndrome by SPRED1; rare digenic NF1
  plus PTPN11 cases account for a small minority of reported cohorts. Although
  Orphanet also lists MAP2K2 on ORPHA:638, MAP2K2 classically causes
  cardiofaciocutaneous syndrome and RASopathy multigene panel screening of NFNS
  cohorts has not supported MAP2K2 as an independent cause of NFNS.
  Neurofibromas and Lisch nodules favor the NF1/NFNS end of the spectrum, while
  their absence with isolated pigmentary features should prompt consideration
  of Legius syndrome.

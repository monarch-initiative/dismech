      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The NF1 gene encodes a RAS GTPase-activating protein called
        neurofibromin and is one of several genes that (when mutant) affect
        RAS-MAPK signalling, causing related diseases collectively known as
        RASopathies.
      explanation: >-
        Places NF1-driven RAS-MAPK dysregulation within the RASopathy mechanistic
        nosology.

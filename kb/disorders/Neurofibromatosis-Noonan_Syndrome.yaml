name: Neurofibromatosis-Noonan Syndrome
creation_date: "2026-07-14T00:00:00Z"
category: Genetic
description: >-
  Neurofibromatosis-Noonan syndrome (NFNS; OMIM:601321) is a rare RASopathy of
  the RAS-MAPK signaling pathway that combines clinical features of
  neurofibromatosis type 1 (NF1) - multiple cafe-au-lait macules, skinfold
  freckling, Lisch nodules, and neurofibromas - with features of Noonan syndrome
  (NS), including short stature, the characteristic Noonan-like facial
  dysmorphism (hypertelorism, ptosis, downslanting palpebral fissures, low-set
  posteriorly rotated ears), a broad or webbed neck, pectus deformity, and
  congenital heart defects such as pulmonic valve stenosis. Heterozygous germline
  NF1 loss-of-function variants are the major molecular cause, so NFNS is best
  understood as a phenotypic variant of NF1 rather than a distinct gene disorder;
  loss of the neurofibromin RAS-GTPase activating protein removes restraint on
  RAS, producing constitutive RAS-MAPK signaling that drives both the NF1
  pigmentary/tumor features and the Noonan-like developmental phenotype. Because
  NF1, NS, and NFNS overlap clinically, molecular genetic testing is often
  required for a correct diagnosis.

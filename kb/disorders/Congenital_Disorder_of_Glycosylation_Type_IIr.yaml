    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We identified three males and one female from three families with ATP6AP2 splicing variants and ID/DD, epilepsy, axial hypotonia, axonal neuropathy and microcephaly; the heterozygous female has a milder phenotype."
    explanation: >-
      Graded REFUTE against a strict reading of X-linked recessive for this gene. She has the
      splicing rather than the missense phenotype, so it does not overturn the inheritance of

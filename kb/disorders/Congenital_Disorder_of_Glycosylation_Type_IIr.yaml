name: Congenital Disorder of Glycosylation Type IIr
category: Mendelian
creation_date: "2026-09-22T00:00:00Z"
synonyms:
- CDG IIr
- CDG2R
- congenital disorder of glycosylation, type IIr, X-linked recessive
- ATP6AP2-CDG
- ATP6AP2-congenital disorder of glycosylation
disease_term:
  preferred_term: congenital disorder of glycosylation, type IIr
  term:
    id: MONDO:0026765
    label: congenital disorder of glycosylation, type IIr
description: >-
  ATP6AP2-CDG is the X-linked glycosylation disorder caused by missense variants in the accessory
  vacuolar H+-ATPase subunit ATP6AP2, presenting with liver disease, immunodeficiency, cutis laxa
  and psychomotor impairment. Four patients in three unrelated families are published with the
  CDG phenotype.

  The mechanism is one step removed from glycosylation itself. ATP6AP2 is an accessory subunit
  of the V-ATPase, the pump that acidifies organelles of the secretory and endocytic pathway.
  The missense substitutions sit in the extracellular domain, impair the protein's stability and
  its interaction with ATP6AP1 — a V0 assembly-complex member — and so impair assembly of the
  proton pore. Golgi acidification is what glycosyltransferases need, so the glycosylation
  defect is downstream of a pump defect rather than a defect in a glycosylation enzyme. That
  places this entity beside ATP6AP1-CDG and CCDC115-CDG rather than among the enzyme
  deficiencies.

  Three things about it are worth a reader's attention before the details.

  First, the disease is not the glycosylation. Autophagy is dysregulated, lysosomal
  acidification is impaired, and mTOR signalling is reduced — demonstrated in mouse liver, in
  Drosophila fat body, and in patient-derived cells — and the liver failure that dominates the
  clinical picture tracks those rather than the transferrin profile. The transferrin
  abnormality is real and mild: about half the molecules are correctly glycosylated.

  Second, this gene has a second, neurological disease. Splicing variants in ATP6AP2 cause
  X-linked intellectual disability Hedera type and X-linked parkinsonism with spasticity, with
  no hepatopathy. A 2026 study looked for glycosylation abnormalities in four patients with
  those splicing variants and found them, alongside reduced ATP6AP2 protein — which connects the
  two entities more closely than the allele classes suggested and is the reason this entry keeps
  them separate but linked rather than either merging or ignoring them.

  Third, that 2026 study describes the first affected female with ATP6AP2-related disease, a
  heterozygote with a milder phenotype. An X-linked disease described in four males across a
  decade now has a female patient, and any statement about carrier status in this gene needs
  updating rather than repeating.
parents:
- Congenital Disorder of Glycosylation
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A Mendelian, mechanism-defined metabolic disorder. It presents to hepatology and
      immunology, and is diagnosed as an inherited glycosylation disorder.
  icimd_category:
  - classification_value: multiple_glycosylation_pathways
    notes: >-
      The defect is in organelle acidification rather than in a glycosylation enzyme, and it
      affects both N- and O-glycosylation. That is the same placement ATP6AP1-CDG and
      CCDC115-CDG occupy, and it is why the transferrin profile is type II rather than type I.

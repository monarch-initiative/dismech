- name: Protein Hypoglycosylation
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    All patient sera show an abnormal transferrin profile — decreased tetrasialotransferrin with
    increased tri-, di- and monosialotransferrin — and HPLC put the correctly glycosylated
    fraction at about half in two patients. It is a type II pattern, meaning the defect is in
    processing rather than in assembly of the glycan.

    The magnitude is worth stating because it is modest, and because it is the finding that gets
    this disease its name while not being the finding that makes patients ill. Half-normal
    transferrin glycosylation does not explain micronodular cirrhosis at sixteen months.

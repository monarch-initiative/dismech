prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Four patients with the CDG phenotype in three unrelated families: a Portuguese boy and two
    German brothers reported in 2017, and a Chinese boy reported in 2023. All hemizygous males,
    three missense alleles, all in exon 3.

    Ascertainment is specific and worth recording: the 2017 patients came out of cohorts of
    unsolved CDG cases, so they were found by looking for a glycosylation disorder in patients
    already known to have one. That is a narrow net, and it is one reason the phenotype as
    described is hepatic and glycosylation-centred. A patient with the same genotype presenting
    to hepatology without a transferrin screen would not have been in that cohort.

    rate_per_100000 is left unset; no rate has been reported and none can be derived from four
    patients ascertained this way.
  evidence:
  - reference: PMID:29127204
    reference_title: "Mutations in the X-linked ATP6AP2 cause a glycosylation disorder with autophagic defects."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Two hemizygous mutations in ATP6AP2 were identified by whole exome sequencing in three male individuals from two unrelated families included in cohorts of unsolved CDG cases."
    explanation: >-
      The founding cohort and how the patients were found — the ascertainment this note is about.
  - reference: PMID:38075676
    reference_title: "Expanding the phenotype and metabolic basis of ATP6AP2-congenital disorder of glycosylation in a Chinese patient with a novel variant c.185G>A (p.Gly62Glu)."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "To date, only two missense mutations have been reported in three patients from two unrelated families."
    explanation: >-
      The size of the literature as counted by the fourth patient's report, which with that
      patient makes four. Graded BACKGROUND because it is the paper's summary of prior work.
progression:
- phase: Infantile hepatic presentation
  notes: >-
    The liver is where this disease declares itself and it does so early: severe liver failure at
    five months in one patient, cirrhosis on biopsy at sixteen months in another, transplantation
    at eleven months in a third. The immunological features and the cutis laxa are present
    alongside rather than after.
  evidence:
  - reference: PMID:29127204
    reference_title: "Mutations in the X-linked ATP6AP2 cause a glycosylation disorder with autophagic defects."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "P3 developed severe liver failure at 5 mo of age."
    explanation: The earliest hepatic decompensation in the series, with its age.
- phase: Variable course, from transplantation to stability on replacement
  notes: >-
    The four patients diverge sharply. One was transplanted at eleven months. One had cirrhosis
    at sixteen months and then improved infection-wise on weekly subcutaneous immunoglobulin. One
    had severe liver failure at five months. One has ultrasound-detected liver abnormality with
    only mildly raised transaminases and improved general health on IgG substitution.

    Nothing published explains the range, and with three alleles in four patients an allele-based
    explanation cannot be tested.
  evidence:
  - reference: PMID:29127204
    reference_title: "Mutations in the X-linked ATP6AP2 cause a glycosylation disorder with autophagic defects."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Treatment with weekly subcutaneous Ig led to decreased infection frequency."
    explanation: >-
      The one treatment response with a stated outcome in the 2017 series, in the patient who
      also has the most advanced liver disease of the three.
genetic:
- name: ATP6AP2
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: ATP6AP2
    term:
      id: hgnc:18305
      label: ATP6AP2
  notes: >-
    The single causal gene, and one with two distinct diseases decided by allele class.
    Missense variants in the exon 3 extracellular domain give this entity: hepatopathy,
    immunodeficiency, cutis laxa, mild intellectual disability, glycosylation defects. Splicing
    variants give X-linked intellectual disability Hedera type and X-linked parkinsonism with
    spasticity: intellectual disability or developmental delay, epilepsy, axial hypotonia, axonal
    neuropathy and microcephaly, without hepatopathy.

    The 2026 work makes that separation less clean rather than more. It finds defective splicing
    correlating with lowered ATP6AP2 protein and glycosylation abnormalities in four
    splicing-variant patients — so the neurological entity has the biochemical marker of the
    hepatic one. The authors call the disparity between the two an ongoing puzzle, and this entry
    does not resolve it.

    ATP6AP2 is also known as the (pro)renin receptor. Nothing in this literature connects the
    renin-angiotensin function to either disease, and this entry does not import it.
  evidence:
  - reference: PMID:41131679
    reference_title: "ATP6AP2-Related Disease Caused by Splicing Defects: Abnormal Glycosylation and the First Affected Female."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "ATP6AP2 splicing variants cause syndromic X-linked intellectual disability Hedera type (XPDS; OMIM#300423) and X-linked parkinsonism with spasticity (MRXSH; OMIM#300911). Alternatively, ATP6AP2 missense variants lead to hepatopathy, immunological abnormalities, cutis laxa and only mild intellectual disability with N-/O-glycosylation defects (ATP6AP2-CDG; OMIM#301045)."
    explanation: >-
      The allelic series stated explicitly, with the OMIM identity of each entity — the basis for
      curating this as a separate disease from the neurological ones rather than as their liver
      variant.
  - reference: PMID:41131679
    reference_title: "ATP6AP2-Related Disease Caused by Splicing Defects: Abnormal Glycosylation and the First Affected Female."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "RNA-Seq in patient-derived fibroblasts validated defective splicing, correlated with lowered ATP6AP2 protein levels in fibroblasts alongside glycosylation abnormalities."
    explanation: >-
      The finding that connects the two entities — glycosylation abnormality in patients who have
      the neurological rather than the hepatic disease.
diagnosis:
- name: Serum transferrin isoelectric focusing
  description: >-
    The screening test that finds this disease, and the reason the founding patients were in the
    cohort they were found in. It shows a type II pattern. Its limitation is stated in the same
    paper that reports it: a patient carrying one of the previously described exon-skipping
    ATP6AP2 variants had a normal transferrin profile with only slight undersialylation of total
    serum protein, so a normal transferrin screen does not exclude ATP6AP2-related disease.
  evidence:
  - reference: PMID:29127204
    reference_title: "Mutations in the X-linked ATP6AP2 cause a glycosylation disorder with autophagic defects."
    supports: REFUTE
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "analysis of protein glycosylation in a patient carrying one of the previously described exon-skipping variants in ATP6AP2 (Korvatska et al., 2013) showed a normal transferrin glycosylation profile and only a slight undersialylation of total serum proteins"
    explanation: >-
      Graded REFUTE against transferrin screening as a test for ATP6AP2-related disease in
      general. It finds the missense entity and misses the splicing one — which is exactly the
      boundary the 2026 paper then reopens by finding glycosylation abnormalities in splicing
      patients by other means.
- name: Whole exome sequencing
  description: >-
    How every published patient was diagnosed. The 2017 patients were sequenced as unsolved CDG
    cases; the Chinese patient by exome after presenting with liver disease.
  evidence:
  - reference: PMID:29127204
    reference_title: "Mutations in the X-linked ATP6AP2 cause a glycosylation disorder with autophagic defects."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Two hemizygous mutations in ATP6AP2 were identified by whole exome sequencing in three male individuals"
    explanation: The diagnostic method in the founding series.
- name: Liver biopsy with electron microscopy
  description: >-
    What establishes the hepatic pathology and, uniquely here, what shows the mechanism in
    tissue: electron micrographs of patient hepatocytes show lipid accumulation and enlarged
    vacuolar structures, which is the autophagic defect made visible. Light microscopy alone
    gives cirrhosis and steatosis and not that.
  evidence:
  - reference: PMID:29127204
    reference_title: "Mutations in the X-linked ATP6AP2 cause a glycosylation disorder with autophagic defects."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Liver biopsy from P1 displays micronodular cirrhosis (a; Masson’s trichrome staining, 100×) and macro- and microvacuolar steatosis (b; Gordon and Sweet's staining, 200×)."
    explanation: The light-microscopic findings with the stains that produced them.
experimental_models:
- name: Liver-specific Atp6ap2 knockout mouse
  experimental_model_type: OTHER
  description: >-
    Adeno-Cre injection to delete Atp6ap2 in mouse liver, against adeno-GFP controls. It tests
    whether losing ATP6AP2 in the liver is sufficient for the serum phenotype, which is the
    question a patient series cannot answer.
  modeled_mechanisms:
  - target: Protein Hypoglycosylation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Liver-restricted deletion produces hypoglycosylation of serum proteins and autophagy
      defects, establishing that the liver is a sufficient source of the circulating
      glycosylation abnormality.
    limitations: >-
      It is a complete knockout where the patients carry missense alleles that retain protein —
      in one case at normal abundance — so the model tests loss of the gene rather than the
      patients' lesion. It is also liver-restricted and acutely induced in an adult animal,
      where the human disease is germline and developmental, so nothing in it speaks to the
      cutis laxa, the immunodeficiency or the cognitive phenotype.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse hepatic glycosylation and serum glycoprotein composition differ from human, and the
        readout used clinically in patients is transferrin, which is not the same protein context.
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        Everything outside the liver is outside the model: the immune system, skin and central
        nervous system are wild-type, so three of the four clinical domains of the human disease
        are not represented.
    readouts:
    - name: Serum protein glycosylation by MALDI-TOF
      target: Protein Hypoglycosylation
      direction: ALTERED
      interpretation: >-
        Adeno-Cre animals show the biantennary glycan increase that the patient serum also shows,
        which is what makes the liver a sufficient source.
      evidence:
      - reference: PMID:29127204
        reference_title: "Mutations in the X-linked ATP6AP2 cause a glycosylation disorder with autophagic defects."
        supports: SUPPORT
        directness: DIRECT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: "Representative MALDI-TOF MS profiles of adeno-GFP- (n = 7) and adeno-CRE- (n = 5) injected mice"
        explanation: >-
          The experimental arms and their group sizes, quoted so the reader can see how small the
          experiment is.
    evidence:
    - reference: PMID:29127204
      reference_title: "Mutations in the X-linked ATP6AP2 cause a glycosylation disorder with autophagic defects."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "We show that ATP6AP2 deficiency in the mouse liver caused hypoglycosylation of serum proteins and autophagy defects."
      explanation: The model's two positive results, stated by the authors as their own finding.
animal_models:
- name: Drosophila carrying a patient ATP6AP2 substitution
  species: Drosophila melanogaster
  genotype: knock-in of one of the patient missense substitutions
  publication: PMID:29127204
  description: >-
    The model that localises the defect subcellularly. In the fat body — the fly's liver-like
    tissue — autophagic dysregulation is associated with defective lysosomal acidification and
    reduced mTOR signalling, and the flies show reduced survival and altered lipid metabolism.
  modeled_mechanisms:
  - target: Impaired V-ATPase V0 Assembly and Organelle Acidification
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      It is the only system in this literature in which lysosomal acidification itself is
      measured, which is the step the whole mechanism turns on.
    limitations: >-
      An invertebrate, and the fat body is a functional analogue of liver rather than liver.
      The substitution is introduced into the fly orthologue, so residue context and the
      ATP6AP1-equivalent interaction are not the human ones. Survival and lipid metabolism are
      organism-level readouts in a system whose life history has no counterpart in the human
      disease.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The substitution is modelled in the Drosophila orthologue. Sequence conservation at the
        affected residue is the argument for transferability, and conservation is not identity of
        interaction partners.
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The measured tissue is the fat body and the quantity of clinical interest is human
        hepatocyte lysosomal pH. The fat body is a liver analogue by function, not a liver.
    readouts:
    - name: Lysosomal acidification in the fat body
      target: Impaired V-ATPase V0 Assembly and Organelle Acidification
      direction: DECREASED
      interpretation: >-
        Directly supports the acidification step that the rest of this entry's chain is built on
        and that nothing in the human data measures.
      evidence:
      - reference: PMID:29127204
        reference_title: "Mutations in the X-linked ATP6AP2 cause a glycosylation disorder with autophagic defects."
        supports: SUPPORT
        directness: DIRECT
        evidence_source: MODEL_ORGANISM
        quote_role: PRIMARY_RESULT
        snippet: "in the liver-like fat body, the autophagic dysregulation was associated with defects in lysosomal acidification and mammalian target of rapamycin (mTOR) signaling"
        explanation: >-
          The measurement, with the authors' own "was associated with" — they do not claim to have
          ordered the three findings causally, and this entry does not either.
    evidence:
    - reference: PMID:29127204
      reference_title: "Mutations in the X-linked ATP6AP2 cause a glycosylation disorder with autophagic defects."
      supports: SUPPORT
      directness: DIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "The introduction of one of the missense mutations into Drosophila led to reduced survival and altered lipid metabolism."
      explanation: >-
        That the patient substitution is deleterious in an independent organism — which is
        stronger evidence of pathogenicity than any in-silico prediction.
treatments:
- name: Immunoglobulin Replacement Therapy
  therapeutic_modality: PROTEIN_REPLACEMENT
  description: >-
    Weekly subcutaneous immunoglobulin in the Portuguese patient, which decreased infection
    frequency; IgG substitution in one German brother, under which his general health improved.
    It treats the antibody deficit and does nothing for the liver.
  treatment_term:
    preferred_term: immunoglobulin replacement therapy
    term:
      id: NCIT:C62710
      label: Immunoglobulin Therapy
  target_mechanisms:
  - target: Hypogammaglobulinaemia
    description: >-
      Substitutes for antibody the patient does not make. It is recorded against the humoral
      phenotype because the pump defect that produces it is untouched.

- name: Liver Transplantation
  therapeutic_modality: SURGERY
  description: >-
    Performed in the Chinese patient at eleven months for cirrhosis with coagulopathy and
    anaemia. No outcome beyond the fact of the transplant is reported.

    Two things follow that a reader should weigh. A transplant replaces the organ but not the
    genotype, so the immunological, dermatological and cognitive features remain; and the serum
    glycosylation defect would be expected to correct, since the mouse experiment shows the liver
    is a sufficient source of it — which would make transferrin a useless marker of disease
    activity post-transplant. Neither point is addressed in any published source, and neither is
    asserted here as more than the reading it is.
  treatment_term:
    preferred_term: liver transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:

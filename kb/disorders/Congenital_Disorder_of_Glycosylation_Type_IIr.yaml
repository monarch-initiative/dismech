  notes: >-
    No disease-modifying therapy exists. Nothing in this literature reports any attempt to target
    the V-ATPase, autophagy or mTOR pathway in a patient, and this entry does not speculate about
    one.
discussions:
- discussion_id: cdg2r_two_diseases_one_gene
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Are ATP6AP2-CDG and the ATP6AP2 neurological diseases two entities or two ends of one, and
    does the 2026 glycosylation finding in splicing patients settle it?
  rationale: >-
    Until 2026 the separation looked clean and allele-based. Missense variants in exon 3 give
    hepatopathy, immunodeficiency, cutis laxa and mild intellectual disability with glycosylation
    defects; splicing variants give X-linked intellectual disability Hedera type or X-linked
    parkinsonism with spasticity, with no liver disease. The 2017 paper reinforced it by showing
    that a patient with a known exon-skipping variant had a normal transferrin profile.

    The 2026 study looked harder and found glycosylation abnormalities in four splicing-variant
    patients, alongside reduced ATP6AP2 protein — and concluded that abnormal glycosylation may
    be a consistent feature of the splicing variants and potentially part of their pathological
    mechanism. Its own authors call the disparity between the neurological and hepatic entities
    an ongoing puzzle.

    Three readings are live. One gene, two diseases, with the glycosylation finding incidental.
    One disease with a modifier that determines organ involvement. Or a dosage-versus-function
    distinction: splicing variants reduce how much protein there is, missense variants in one
    domain break what it does, and those are different lesions that happen to share a marker.

    dismech keeps them separate for now, with this entry naming the neurological entities and
    their OMIM identities so that a curator arriving from the other direction finds the link.
    What would settle it is liver assessment in splicing patients and neurological assessment in
    missense patients, neither of which has been done systematically.
  attaches_to:
  - disease#Congenital Disorder of Glycosylation Type IIr
  - genetic#ATP6AP2
  - diagnosis#Serum transferrin isoelectric focusing
- discussion_id: cdg2r_glycosylation_is_not_the_disease
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Is the glycosylation defect in ATP6AP2-CDG pathogenic, or a biomarker of the acidification
    defect that causes the disease by another route?
  rationale: >-
    The entity is named for its glycosylation and classified among the CDGs, and the
    glycosylation abnormality is what put its first patients in the cohort they were found in.
    But it is modest — about half of transferrin is correctly glycosylated — and it is hard to
    see half-normal transferrin sialylation producing micronodular cirrhosis at sixteen months.

    The autophagy branch looks more proportionate to the clinical disease: impaired lysosomal
    acidification, dysregulated autophagy, reduced mTOR signalling, lipid accumulation and
    enlarged vacuolar structures in hepatocytes, and downregulated lipid-metabolism metabolites.
    The second founding paper is titled for autophagic liver disease rather than for a
    glycosylation disorder, which suggests its authors saw the same thing.

    This entry draws both branches from the acidification node and does not rank them. The
    question matters practically: if glycosylation is a biomarker rather than a cause, then a
    normal transferrin profile should not reassure, and improvement in transferrin should not be
    read as improvement in disease.
  attaches_to:
  - pathophysiology#Protein Hypoglycosylation
  - pathophysiology#Autophagic Dysregulation with Reduced mTOR Signalling
- discussion_id: cdg2r_immunodeficiency_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    How does an accessory V-ATPase subunit defect produce hypogammaglobulinaemia and a T-cell
    subset shift?
  rationale: >-
    Two of four patients have an antibody deficiency, one with a poor polysaccharide response and
    a decreased CD4 with increased CD8 count. Nothing in this literature measures anything
    immunological below the level of the serum immunoglobulin and the flow count — no B-cell
    subset work, no class-switching, no plasma-cell study, and no measurement of organelle pH in
    a lymphocyte.

    The only argument available is by family resemblance: ATP6AP1 deficiency, the sibling
    V-ATPase CDG, also manifests with hypogammaglobulinaemia. That makes it look like a property
    of the pump. It is not a mechanism, and the node in this entry is graded HYPOTHETICAL
    accordingly.

    The negative in the same series is what makes the gap interesting rather than merely
    unfilled: the third 2017 patient has recurrent infections with a normal immunological status.
    Whatever the mechanism is, it is not obligate.
  attaches_to:
  - pathophysiology#Impaired Antibody Production
  - phenotypes#Hypogammaglobulinaemia
notes: >-
  Scope. This entry covers the missense, hepatic, glycosylation entity — ATP6AP2-CDG,
  OMIM#301045. The splicing-variant neurological entities in the same gene (XPDS, OMIM#300423;
  MRXSH, OMIM#300911) are separate diseases here and are named in the gene record and in the
  first discussion so the relationship is navigable. That separation is under active question as
  of 2026 and the entry says so rather than presenting it as settled.

  Patient count. Four patients with the CDG phenotype in three unrelated families: a Portuguese
  boy and two German brothers (PMID:29127204, 2017) and a Chinese boy (PMID:38075676, 2023).
  Three missense alleles, all in exon 3.

  What the deep-research report contributed, and where it stopped. The openscientist run
  committed alongside this entry supplied five references, all of which resolved, and two of them
  — the 2023 Chinese case and the 2026 splicing study — were the substance of this entry's
  updates to the 2017 founding picture. Its ATP6AP2 identifier, HGNC:18305, is correct, unlike
  the gene CURIEs in two of the four sibling runs in this batch. Its framing follows the 2017
  paper, so the questions this entry raises about whether the glycosylation defect is the disease
  are not from it.

  GeneReviews baseline: `just check-genereviews` reports NO_CHAPTER for both GeneReviews and
  StatPearls against the committed Bookshelf index (snapshot 2026-09-10).

  The (pro)renin receptor. ATP6AP2 has a second identity in the renin-angiotensin literature and
  a large body of work attached to it. Nothing in this disease's literature connects that
  function to either the hepatic or the neurological entity, and it is deliberately not imported.

  Ascertainment, and why the phenotype may be narrower than the disease. The 2017 patients came
  from cohorts of unsolved CDG cases — patients already known to have a glycosylation
  abnormality. A patient with the same genotype who presented to hepatology and never had a
  transferrin screen would not have been in that cohort. The phenotype as published is therefore
  conditioned on having the biomarker, which is worth holding in mind when reading the
  glycosylation-is-not-the-disease discussion above.

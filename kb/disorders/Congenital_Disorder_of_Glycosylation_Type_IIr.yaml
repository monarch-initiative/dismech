- name: Impaired Antibody Production
  biological_scale: ORGANISM
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Low immunoglobulins with a poor polysaccharide antibody response, decreased CD4 and increased
    CD8 lymphocytes in the Portuguese patient; IgG subclass deficiency with reduced IgG1 and IgG3
    in one German brother; normal immunological status in the other.

    How a V-ATPase accessory subunit defect produces an antibody deficiency is not established
    in this disease at all. The most this entry can say is that hypogammaglobulinaemia is a
    recurring feature of the V-ATPase-related CDGs — ATP6AP1 deficiency manifests with
    hypogammaglobulinaemia alongside liver and cognitive abnormalities — so it appears to be a
    property of the pump rather than of this subunit. Hence HYPOTHETICAL.

- name: Impaired ATP6AP2 Stability and ATP6AP1 Interaction
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    The V-ATPase is built in two sectors: the V0 proton pore, assembled in the endoplasmic
    reticulum under the control of a set of assembly factors, and the V1 ATP-hydrolysis domain,
    added in the Golgi. ATP6AP1 and ATP6AP2 are its two accessory subunits, and ATP6AP1 is the
    orthologue of the yeast V0 assembly factor Voa1.

    So a variant that weakens the ATP6AP2-ATP6AP1 interaction is a variant that interferes with
    V0 assembly at its earliest step. That is the hinge of this disease: everything downstream
    follows from a pump that is not properly built, not from anything ATP6AP2 does on its own.

      ATP6AP2 without qualification.
pathophysiology:
- name: Hemizygous ATP6AP2 Missense Variants
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Three missense alleles are published across three families, and all three fall in exon 3,
    in the extracellular domain of the protein: c.293T>C p.Leu98Ser de novo in the Portuguese
    patient, c.212G>A p.Arg71His in two brothers of a German family, and c.185G>A p.Gly62Glu in
    the Chinese patient. Neither of the first two appears in more than 60,000 ExAC controls.

    The clustering matters. The neurological ATP6AP2 diseases are caused by splicing variants
    that reduce the amount of normal protein; this entity is caused by missense substitutions in
    one domain that impair what the protein does. Allele class, not gene, is what decides which
    disease a patient gets — and even that separation is less clean than it looks, since the
    2026 work finds glycosylation abnormalities in splicing patients too.

    variant_origin: GERMLINE
    zygosity: HEMIZYGOUS
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    notes: >-
      PARTIAL_LOSS_OF_FUNCTION rather than LOSS_OF_FUNCTION, and the third allele is the reason
      to be careful about what "loss" means here. ATP6AP2 protein level was unchanged in the
      Chinese patient's liver and in cells carrying p.Gly62Glu, while autophagy and mTOR
      signalling were still dysregulated — so at least one allele impairs function without
      reducing abundance. The first two impair protein stability as well as the ATP6AP1
      interaction.

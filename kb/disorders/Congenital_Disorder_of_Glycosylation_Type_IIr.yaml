inheritance:
- name: X-linked recessive inheritance
  description: >-
    All four CDG patients are hemizygous males. The Portuguese patient's variant is de novo —
    absent from both parents and both brothers, with a neighbouring polymorphism confirming
    maternal transmission of the chromosome and so excluding a sample mix-up. The German family
    has two affected males, and the Chinese patient is a single case.

    The recessive label needs one qualification as of 2026: a heterozygous female with an
    ATP6AP2 splicing variant has a milder but real phenotype. That is the neurological entity
    rather than the CDG one, but it establishes that heterozygotes in this gene are not
    invariably unaffected.
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:

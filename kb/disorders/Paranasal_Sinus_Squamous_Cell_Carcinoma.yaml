prevalence:
- population: General population
  measure_type: UNKNOWN
  prevalence_class: RARE
  notes: >-
    Recorded qualitatively as RARE without a squamous-specific numeric rate:
    all sinonasal malignancies combined have an annual incidence of 0.5 to 1.0
    per 100,000, and paranasal sinus squamous cell carcinoma represents a
    site- and histology-defined subset of that total.
  evidence:
  - reference: DOI:10.3390/cancers13112835
    reference_title: Sinonasal Squamous Cell Carcinoma, a Narrative Reappraisal of the Current Evidence
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sinonasal squamous cell carcinoma is a rare tumor affecting the nasal
      cavity and paranasal sinuses.
    explanation: >-
      Directly characterizes sinonasal squamous cell carcinoma as a rare
      malignancy.
  - reference: DOI:10.3322/caac.21752
    reference_title: The contemporary management of cancers of the sinonasal tract in adults
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sinonasal malignancies make up <5% of all head and neck neoplasms, with an
      incidence of 0.5–1.0 per 100,000.
    explanation: >-
      Gives the combined annual incidence across all sinonasal malignancies,
      bounding the occurrence of the paranasal sinus squamous cell carcinoma
      subset within the rare range.
parents:

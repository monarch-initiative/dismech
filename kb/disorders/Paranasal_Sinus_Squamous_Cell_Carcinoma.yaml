has_subtypes:
- name: Maxillary Sinus SCC
  display_name: Maxillary sinus squamous cell carcinoma
  description: >-
    Tumor arising in the maxillary sinus, the most common paranasal sinus
    subsite for squamous cell carcinoma. Often presents late with cheek
    swelling, dental symptoms, or orbital involvement.
- name: Ethmoid Sinus SCC
  display_name: Ethmoid sinus squamous cell carcinoma
  description: >-
    Tumor arising in the ethmoid air cells. Proximity to the orbit and anterior
    skull base makes orbital and intracranial extension a frequent concern.
- name: Keratinizing SCC
  display_name: Keratinizing squamous cell carcinoma
  description: >-
    Conventional keratinizing squamous cell carcinoma histology, typically
    associated with tobacco and occupational carcinogen exposure rather than
    HPV.
- name: Non-keratinizing SCC
  display_name: Non-keratinizing squamous cell carcinoma
  description: >-
    Non-keratinizing sinonasal squamous cell carcinoma, a subset of which is
    associated with transcriptionally active high-risk human papillomavirus
    infection.
environmental:
- name: Occupational Wood Dust Exposure
  description: >-
    Occupational inhalation of wood dust is an established cause of sinonasal
    cancer, with prolonged exposure linked to malignant transformation of the
    sinonasal epithelium. The pooled association is far stronger for sinonasal
    adenocarcinoma than for squamous cell carcinoma, so wood dust is better
    read as a shared sinonasal carcinogen with a histology-dependent effect
    size than as the dominant driver of the squamous subtype.
  exposure_term:
    preferred_term: exposure to wood dust
    term:
      id: ECTO:7000135
      label: exposure to wood dust
  influences_mechanisms:
  - target: Carcinogen-Induced Sinonasal Epithelial Injury
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Inhaled wood dust deposits on and chronically injures the sinonasal
      epithelium; this is the route by which the mutagenic stress modeled by
      this node is established in occupationally exposed patients.
    evidence:
    - reference: PMID:25885319
      reference_title: "Occupational exposure and sinonasal cancer: a systematic review and meta-analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Exposure to wood dust results associated with SNC (RRpooled = 5.91, 95%
        CI: 4.31-8.11 for the case-control studies and 1.61, 95% CI: 1.10-2.37
        for the cohort studies), as well as to leather dust (11.89, 95% CI:
        7.69-18.36).
      explanation: >-
        Quantifies the pooled excess sinonasal cancer risk from occupational
        wood dust exposure, supporting wood dust as an initiating carcinogenic
        exposure acting on the sinonasal epithelium.
  evidence:
  - reference: PMID:35162168
    reference_title: Occupational Exposure to Wood Dust and the Burden of Nasopharynx and Sinonasal Cancer in Canada
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nasopharynx cancers (NPCs) and sinonasal cancers (SNCs) are two cancers
      that can be caused by occupational exposure to wood dust
    explanation: >-
      Supports occupational wood dust exposure as an established cause of
      sinonasal cancer.
  - reference: PMID:25885319
    reference_title: "Occupational exposure and sinonasal cancer: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although slight, a significant risk resulted also for SCC (RRpooled= 1.46,
      95% CI: 1.01-2.1).
    explanation: >-
      Establishes a small but statistically significant pooled wood-dust
      association with sinonasal squamous cell carcinoma, and quantifies the
      histology-dependent effect size asserted in this exposure's description.
  - reference: PMID:25885319
    reference_title: "Occupational exposure and sinonasal cancer: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The elevated risk found for AC (RRpooled= 29.43, 95% CI: 16.46-52.61)
      supports the findings of previous studies
    explanation: >-
      The adenocarcinoma pooled estimate from the same meta-analysis, given
      alongside the squamous one so the histology-dependent contrast the
      description draws is cited from a single comparable source.
- name: Occupational Nickel Compound Exposure
  description: >-
    Inhaled nickel compounds in refining, smelting, plating, cutlery and
    alkaline battery manufacture are an established cause of sinonasal cancer.
    Unlike wood dust, which is preferentially associated with adenocarcinoma,
    the nickel-associated tumors reported from refinery cohorts are
    predominantly squamous, making this the occupational exposure most
    specifically tied to the squamous subtype.
  exposure_term:
    preferred_term: exposure to nickel
    term:
      id: ECTO:9000063
      label: exposure to nickel
  influences_mechanisms:
  - target: Carcinogen-Induced Sinonasal Epithelial Injury
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Chronic inhalation of nickel compounds delivers a genotoxic metal burden
      to the sinonasal epithelium, establishing the mutagenic epithelial injury
      modeled by this node.
    evidence:
    - reference: PMID:27747921
      reference_title: "Cancer incidence among copper smelting and nickel refining workers in Finland."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        It is likely that exposure to nickel compounds is the main reason for
        elevated nasal cancer risk among the nickel refinery employees
      explanation: >-
        The authors attribute the observed sinonasal cancer excess in a
        nickel-refinery cohort to nickel exposure itself, supporting nickel as
        the initiating carcinogen acting on the sinonasal epithelium.
  evidence:
  - reference: PMID:27747921
    reference_title: "Cancer incidence among copper smelting and nickel refining workers in Finland."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In the most nickel-exposed work site (refinery), there were 14 lung
      cancers (SIR 2.01) and 3 sinonasal cancers (SIR 26.7, 95%).
    explanation: >-
      Gives the magnitude of the sinonasal cancer excess in the most heavily
      nickel-exposed workers of a Finnish refinery cohort.
  - reference: PMID:25885319
    reference_title: "Occupational exposure and sinonasal cancer: a systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      nickel and chromium compounds (18.0, 95% CI: 14.55-22.27) was found
    explanation: >-
      Independent pooled estimate across six studies confirming a large excess
      sinonasal cancer risk from nickel and chromium compound exposure.
- name: Tobacco Smoking
  description: >-
    Tobacco smoke exposes sinonasal squamous epithelium to carcinogens that
    promote DNA damage and malignant transformation.
  exposure_term:
    preferred_term: exposure to tobacco smoking
    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
  evidence:
  - reference: PMID:3435710
    reference_title: "Tobacco use and sinonasal cancer: a case-control study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The association was strongest for squamous cell carcinoma among recent users of tobacco (RR = 3.1, P less than 0.05, one-sided)"
    explanation: Case-control study directly links tobacco use to elevated risk of sinonasal squamous cell carcinoma specifically.
  notes: >-
    Deliberately left unlinked to a pathophysiology node, despite the cited
    case-control association. Tobacco carries no pooled sinonasal-specific risk
    estimate in the occupational meta-analysis this entry's other exposures are
    drawn from, so an `influences_mechanisms` edge would rest on a single
    study of a different design from the ones supporting the wood-dust and
    nickel edges. The exposure is retained and cited because tobacco is a
    recognized cofactor for the keratinizing subtype; what is withheld is the
    mechanism edge, not the association.
infectious_agent:
- name: Human Papillomavirus
  description: >-
    Transcriptionally active high-risk HPV (predominantly HPV16) is an etiologic
    contributor in a subset of sinonasal squamous cell carcinomas, which are
    characteristically non-keratinizing and p16-positive.
  infectious_agent_term:
    preferred_term: Human papillomavirus 16
    term:
      id: NCBITaxon:333760
      label: Human papillomavirus 16
  evidence:
  - reference: PMID:24030745
    reference_title: High-risk human papillomavirus is transcriptionally active in a subset of sinonasal squamous cell carcinomas
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fourteen carcinomas (20%) were positive for high-risk HPV by PCR: 13
      HPV16 and one HPV35.
    explanation: >-
      Supports high-risk HPV (mostly HPV16) infection in a subset (about 20%) of
      sinonasal squamous cell carcinomas.
pathophysiology:
- name: Carcinogen-Induced Sinonasal Epithelial Injury
  description: >-
    Chronic occupational dust and tobacco-associated injury exposes sinonasal
    squamous epithelial cells to mutagenic stress, promoting DNA damage and
    clonal selection.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: squamous epithelial cell
    term:
      id: CL:0000076
      label: squamous epithelial cell
  locations:
  - preferred_term: paranasal sinus
    term:
      id: UBERON:0001825
      label: paranasal sinus
  biological_processes:
  - preferred_term: DNA damage response
    modifier: ABNORMAL
    term:
      id: GO:0006974
      label: DNA damage response
  downstream:
  - target: TP53 Dysfunction
    description: Mutagenic injury selects for loss of p53-mediated genomic surveillance.
  evidence:
  - reference: PMID:35162168
    reference_title: Occupational Exposure to Wood Dust and the Burden of Nasopharynx and Sinonasal Cancer in Canada
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Nasopharynx cancers (NPCs) and sinonasal cancers (SNCs) are two cancers
      that can be caused by occupational exposure to wood dust
    explanation: >-
      Supports an environmental-carcinogen etiology for sinonasal cancer that
      drives epithelial injury and transformation.
- name: TP53 Dysfunction
  description: >-
    Recurrent TP53 alteration, frequently together with CDKN2A loss, compromises
    genome surveillance, apoptosis, and cell-cycle checkpoints, allowing damaged
    sinonasal epithelial clones to expand. Nearly all sinonasal carcinomas
    arising via malignant progression harbor a TP53 or CDKN2A alteration.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: LOSS_OF_FUNCTION
  cell_types:
  - preferred_term: squamous epithelial cell
    term:
      id: CL:0000076
      label: squamous epithelial cell
  locations:
  - preferred_term: paranasal sinus
    term:
      id: UBERON:0001825
      label: paranasal sinus
  genes:
  - preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  - preferred_term: CDKN2A
    term:
      id: hgnc:1787
      label: CDKN2A
  molecular_functions:

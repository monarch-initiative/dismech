- name: STEAP3
  gene_term:
    preferred_term: STEAP3
    term:
      id: hgnc:24592
      label: STEAP3
  association: Proposed erythroid-lineage modifier
  relationship_type: MODIFIER
  notes: >-
    STEAP3 is not mutated in this disease. It is recorded here as a proposed modifier
    because it is the candidate explanation for why erythroid cells largely escape a
    defect that cripples lymphocytes: the metalloreductase associates with TfR1 in
    erythroblasts and is proposed to supply an accessory internalization signal that the
    mutant motif cannot. Whether it modifies severity between patients has not been
    tested; the claim is about lineage, not about inter-individual variation.

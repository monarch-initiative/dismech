diagnosis:
- name: Immunological workup with TFRC sequencing
  description: >-
    The picture that should prompt testing is a combined immunodeficiency with normal
    lymphocyte counts but impaired lymphocyte function, hypogammaglobulinaemia, and
    cytopenias, in a child with recurrent sinopulmonary infection, chronic diarrhoea and
    failure to thrive. Raised surface TfR1 (CD71) and raised soluble serum TfR1 are
    directly informative, because they are the specific consequence of an internalization
    defect rather than of low receptor expression; sequencing TFRC confirms it.
  evidence:
  - reference: PMID:26642240
    reference_title: "A missense mutation in TFRC, encoding transferrin receptor 1, causes combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with a combined immunodeficiency characterized by normal numbers but
      impaired function of T and B cells
      had a homozygous p.Tyr20His substitution in transferrin receptor 1 (TfR1), encoded
      by TFRC.
    explanation: >-
      The immunological pattern that distinguishes this disorder from the combined
      immunodeficiencies with lymphopenia.
  - reference: PMID:26642240
    reference_title: "A missense mutation in TFRC, encoding transferrin receptor 1, causes combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Soluble TfR1, generated by cleavage of surface TfR1, was significantly elevated in
      the patients
    explanation: >-
      The serum marker that reflects the surface accumulation and is therefore a
      candidate diagnostic pointer.

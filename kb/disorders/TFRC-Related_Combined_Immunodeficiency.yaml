    explanation: >-
      Establishes how narrow the reported allelic and case literature was up to 2024.
pathophysiology:
- name: TFRC Internalization Motif Variant
  biological_scale: MOLECULAR
  description: >-
    Homozygous missense substitutions in the YTRF endocytic internalization motif of the
    TfR1 cytoplasmic tail. The motif requires an aromatic residue at the position altered
    by p.Tyr20His;
    the second reported allele, p.Arg22Trp, lies immediately adjacent and has the same
    functional consequence. Neither allele removes the receptor: the protein is made
    and reaches the surface, where it accumulates.
  genes:
  - preferred_term: TFRC
    term:
      id: hgnc:11763
      label: TFRC
  downstream:
  - target: Defective TfR1 Endocytosis with Surface Accumulation
    causal_link_type: DIRECT
    description: >-
      Disrupting the internalization motif is directly what prevents the receptor being
      taken up.
    evidence:
    - reference: PMID:26642240
      reference_title: "A missense mutation in TFRC, encoding transferrin receptor 1, causes combined immunodeficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The substitution disrupts the TfR1 internalization motif, resulting in defective
        receptor endocytosis and markedly increased TfR1 expression on the cell surface.
      explanation: >-
        States the molecular lesion and its immediate consequence.
  evidence:
  - reference: PMID:26642240
    reference_title: "A missense mutation in TFRC, encoding transferrin receptor 1, causes combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with a combined immunodeficiency characterized by normal numbers but
      impaired function of T and B cells had a homozygous p.Tyr20His substitution in
      transferrin receptor 1 (TfR1), encoded by TFRC.
    explanation: >-
      The founding description, and the observation that defines the disease's shape:
      normal cell numbers with impaired function.
  - reference: PMID:26642240
    reference_title: "A missense mutation in TFRC, encoding transferrin receptor 1, causes combined immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The TfR1-holotransferrin complex is internalized by receptor-mediated endocytosis,
      which requires an aromatic residue at the p.Y20 position mutated in the patients
    explanation: >-
      The structural requirement of the motif that the variant violates, naming the exact
      residue.
  - reference: PMID:38270687
    reference_title: A Novel Homozygous Germline Mutation in Transferrin Receptor 1 (TfR1) Leads to Combined Immunodeficiency and Provides New Insights into Iron-Immunity Axis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      TfR1R22W results in impaired TfR1 internalization similar to previously defined
      TfR1Y20H mutation.
    explanation: >-
      A second, independently ascertained allele in the same motif with the same
      functional consequence, which is what makes the motif rather than the residue the
      curated lesion.
- name: Defective TfR1 Endocytosis with Surface Accumulation
  biological_scale: CELLULAR
  description: >-
    The receptor is not internalized, so it accumulates at the plasma membrane: surface
    TfR1 was six-fold higher on patient than control fibroblasts, and soluble TfR1
    generated by cleavage of the surface receptor is correspondingly raised in serum.
    Crosslinking TfR1 clears it from the surface of control but not patient cells,
    demonstrating the internalization block directly.

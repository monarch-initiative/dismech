- name: Lymphocyte Proliferation and Activation Failure
  biological_scale: CELLULAR
  description: >-
    T cells fail to proliferate to TCR stimulation, and the failure is not corrected by
    CD28 co-stimulation or exogenous IL-2 and is not explained by increased apoptosis -
    a global proliferation defect rather than a signalling-specific one. B cells show
    defective proliferation and defective class-switch recombination. Cell numbers are
    normal, so the defect is functional. In the second reported allele, helper T cells
    additionally showed defective mitochondrial oxidative phosphorylation, consistent
    with an iron-dependent metabolic lesion.

- name: Impaired Iron Supply to Proliferating Marrow Progenitors
  biological_scale: TISSUE
  description: >-
    Haematopoietic progenitors depend on transferrin-mediated iron uptake to proliferate
    and differentiate, and the cytopenias of this disease are the marrow counterpart of
    the lymphocyte lesion. The evidence for the step is indirect: it comes from a mouse
    in which the receptor is deleted outright in haematopoietic stem cells, not from
    patient marrow with the hypomorphic allele. Notably, that model spares thrombocytes
    and B lymphocytes among the progenitor lineages, which does not obviously match the
    thrombocytopenia seen in patients - a discrepancy this entry records rather than
    smooths over.

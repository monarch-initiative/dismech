name: TFRC-related Combined Immunodeficiency
creation_date: "2026-09-01T14:07:00Z"
description: >-
  TFRC-related combined immunodeficiency (immunodeficiency 46) is an autosomal
  recessive inborn error of immunity caused by homozygous missense variants in the
  intracellular internalization motif of transferrin receptor 1. The reported alleles
  (p.Tyr20His and p.Arg22Trp) do not abolish the receptor; they prevent it from being
  endocytosed, so TfR1 accumulates on the cell surface while transferrin-bound iron is
  no longer delivered into the cell. The immunological consequence is unusual in shape:
  lymphocyte numbers are normal but their function is not, with defective T cell
  proliferation and defective B cell proliferation and class switching, producing
  hypogammaglobulinaemia and susceptibility to severe infection. The defect is
  correctable in vitro by iron citrate, which loads cells with iron independently of
  the receptor, establishing that it is the iron delivery and not another receptor
  function that is missing. Most striking is what is spared: despite the central role
  of TfR1 in erythropoiesis, anaemia is mild, and an accessory endocytosis signal
  provided by the erythroblast metalloreductase STEAP3 is the proposed reason.
synonyms:
- immunodeficiency 46
- IMD46
- combined immunodeficiency due to TFRC deficiency
- CID due to TfR1 deficiency
- transferrin receptor 1 deficiency

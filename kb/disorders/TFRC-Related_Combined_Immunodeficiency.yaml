  - reference: PMID:38270687
    reference_title: A Novel Homozygous Germline Mutation in Transferrin Receptor 1 (TfR1) Leads to Combined Immunodeficiency and Provides New Insights into Iron-Immunity Axis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, only one causative mutation (c.58T > C, p.Y20H) in the TFRC gene coding

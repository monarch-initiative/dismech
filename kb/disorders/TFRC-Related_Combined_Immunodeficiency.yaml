inheritance:
- name: Autosomal recessive inheritance
  penetrance: COMPLETE
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All reported patients are homozygous for a missense TFRC variant. The p.Tyr20His
    allele recurs across unrelated families and was found in all eight patients of the
    largest published cohort, drawn from six unrelated families, all of them products of
    consanguineous marriages. Penetrance is recorded as COMPLETE because every reported
    biallelic individual has been symptomatic and severely so; the qualification is that
    ascertainment has been entirely through symptomatic probands, so unaffected
    homozygotes would not have been found if they existed.
  evidence:
  - reference: PMID:32851577
    reference_title: Clinical and Immunological Characterization of Combined Immunodeficiency Due to TFRC Mutation in Eight Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients were products of consanguineous marriages, and there was a family
      history of early deaths in two families
    explanation: >-
      Consanguinity in every family, which is the route by which a rare recessive allele
      reaches homozygosity here.
  - reference: PMID:33096268
    reference_title: Hematopoietic Stem Cell Transplantation Is a Curative Therapy for Transferrin Receptor 1 (TFRC) Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical presentations have been severe in all reported cases, with symptoms
      including recurrent sinopulmonary infections, hypogammaglobulinemia, chronic
      diarrhea, and intermittent cytopenias.
    explanation: >-
      Severity in all reported cases is the basis for recording penetrance as complete.
      It is a statement about ascertained cases, not a population penetrance study.
  - reference: PMID:32851577
    reference_title: Clinical and Immunological Characterization of Combined Immunodeficiency Due to TFRC Mutation in Eight Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The same homozygous missense mutation c.58T>C:p.Y20H, in the TFRC gene, was
      detected in all patients.
    explanation: >-
      Establishes homozygosity for a single missense allele across the cohort's six
      unrelated families.

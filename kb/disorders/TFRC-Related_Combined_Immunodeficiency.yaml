animal_models:
- name: Treg-restricted CD71 (Tfrc) conditional knockout mouse
  species: Mouse
  genotype: Treg-restricted CD71 (Tfrc) conditional deletion
  publication: PMID:38954474
  description: >-
    A conditional model in which the same receptor is deleted only in regulatory T
    cells. It is not a model of this disease - the patients' allele is germline,
    hypomorphic and affects every cell - but it isolates one lineage's dependence on
    TfR1-mediated iron capture, and shows that the consequence there is autoimmunity
    rather than immunodeficiency.
  modeled_mechanisms:
  - target: Impaired Transferrin-Bound Iron Delivery
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Reproduces the loss of TfR1-mediated iron acquisition, but in a single lineage and
      by deletion rather than by an internalization-motif substitution. The resulting
      phenotype is a scurfy-like autoimmune disease from impaired perinatal Treg
      expansion, which is not what the patients have.
    limitations: >-
      Lineage-restricted complete deletion, not a germline hypomorphic allele, so the
      model cannot speak to the combined immunodeficiency phenotype or to the erythroid
      sparing. Its relevance here is as a demonstration that iron capture through this
      receptor is required for lymphocyte expansion generally, and as a pointer to why
      autoimmune-flavoured features such as vitiligo might occur in patients - a
      connection this entry does not otherwise assert.
    evidence:
    - reference: PMID:38954474
      reference_title: Iron capture through CD71 drives perinatal and tumor-associated Treg expansion.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mice with a Treg-restricted CD71 deficiency spontaneously developed a scurfy-like
        disease, caused by impaired perinatal Treg expansion.
      explanation: >-
        The model phenotype, which is autoimmune rather than immunodeficient and so
        diverges from the human disease.
    - reference: PMID:38954474
      reference_title: Iron capture through CD71 drives perinatal and tumor-associated Treg expansion.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        CD71-null Tregs displayed decreased proliferation and tissue-Treg signature loss.
      explanation: >-
        The cellular defect, which is the same proliferation failure seen in the patients'
        conventional lymphocytes.
- name: Tfrc Y20H knock-in mouse
  species: Mouse
  genotype: Tfrc(Y20H/Y20H)
  publication: PMID:26642240
  description: >-
    A knock-in mouse carrying the patients' internalization-motif substitution,
    generated to test whether that allele is sufficient to cause the immunological
    phenotype.
  modeled_mechanisms:
  - target: Lymphocyte Proliferation and Activation Failure
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The knock-in reproduces the immunological defects seen in patients, and reproduces
      the iron-citrate rescue, which is what makes it informative about mechanism rather
      than only about phenotype.
    limitations: >-
      The published characterisation covers the immunological phenotype. Nothing is
      reported here about whether the mouse reproduces the erythroid sparing, the
      cytopenias, or the non-haematological features, so the model should not be assumed
      to speak to those.
    readouts:
    - name: T cell proliferation to anti-CD3 and PMA with ionomycin
      target: Lymphocyte Proliferation and Activation Failure
      direction: DECREASED
      interpretation: >-
        The murine counterpart of the patients' global T cell proliferation defect.
      evidence:
      - reference: PMID:26642240
        reference_title: "A missense mutation in TFRC, encoding transferrin receptor 1, causes combined immunodeficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          However, TfrcY20H/Y20H T cells proliferated poorly to anti-CD3 and PMA+IO, which
          was significantly improved by addition of iron citrate
        explanation: >-
          Reports both the proliferation defect and its correction by receptor-independent
          iron loading.
    - name: T cell proliferation after iron citrate supplementation
      target: Lymphocyte Proliferation and Activation Failure
      direction: RESTORED
      interpretation: >-
        Receptor-independent iron delivery rescues the proliferation defect in the model,
        as it does in patient cells.
      evidence:
      - reference: PMID:26642240
        reference_title: "A missense mutation in TFRC, encoding transferrin receptor 1, causes combined immunodeficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          which was significantly improved by addition of iron citrate
        explanation: >-
          The rescue arm of the same experiment.
    evidence:
    - reference: PMID:26642240
      reference_title: "A missense mutation in TFRC, encoding transferrin receptor 1, causes combined immunodeficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Tfrc(Y20H/Y20H) mice recapitulated the immunological defects of patients.
      explanation: >-
        States the model's fidelity for the immunological phenotype, in the authors' own
        terms.
discussions:
- discussion_id: steap3_erythroid_sparing
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Does STEAP3 really provide the accessory endocytosis signal that spares erythroid
    cells in TFRC-related combined immunodeficiency, and if so why does the same
    redundancy not operate in lymphocytes?
  attaches_to:
  - pathophysiology#Erythroid Sparing via STEAP3
  - pathophysiology#Impaired Transferrin-Bound Iron Delivery
  rationale: >-
    The cell-type selectivity is the most interesting feature of this disease and the
    least well established. The proposal is specific and testable - STEAP3 associates
    with TfR1 and supplies an alternative internalization signal - but the supporting
    rescue was performed in patient fibroblasts, not in erythroid cells, so the
    experiment demonstrating the mechanism was done in the cell type the hypothesis is
    not about. The authors state the inference with hedging. Two things would settle it:
    showing the rescue in erythroid precursors, and showing that lymphocytes lack
    sufficient STEAP3 to do the same. Neither is reported. This matters beyond the
    disease: if correct, it identifies a lineage-restricted redundancy in
    receptor-mediated iron uptake that would be relevant wherever TfR1 trafficking is
    perturbed.
  evidence:
  - reference: PMID:26642240
    reference_title: "A missense mutation in TFRC, encoding transferrin receptor 1, causes combined immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      STEAP3, a metalloreductase expressed in erythroblasts, associates with TfR1 and
      partially rescues transferrin uptake in patient-derived fibroblasts
    explanation: >-
      The evidence for the hypothesis, and simultaneously the reason for the question:
      the rescue is shown in fibroblasts while the claim is about erythroblasts.
  - reference: PMID:26642240
    reference_title: "A missense mutation in TFRC, encoding transferrin receptor 1, causes combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      patients had only mild anemia and only slightly increased TfR1 expression in
      erythroid precursors
    explanation: >-
      The clinical observation the hypothesis exists to explain, including the cell-type
      difference in receptor accumulation that any explanation must account for.
- discussion_id: iron_supplementation_therapeutic_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Iron citrate corrects the lymphocyte defects in patient cells and in the knock-in
    mouse. Has any receptor-independent iron delivery strategy been tried in patients,
    and if not, what stands in the way?
  attaches_to:
  - pathophysiology#Impaired Transferrin-Bound Iron Delivery
  - treatments#
  rationale: >-
    The rescue result is unusually clean for a monogenic immunodeficiency: supplying
    iron by a route that bypasses the defective receptor corrects lymphocyte
    proliferation, immunoglobulin secretion and class-switch transcripts in patient cells,
    and improves T cell proliferation in the mouse carrying the patients' allele. That is
    a mechanistic argument for a non-transplant therapy. Yet the reported management is
    transplantation or prophylaxis, and the anaemia is explicitly described as resistant
    to iron supplementation - which is not the same intervention as supersaturating
    transferrin in culture, but does show that the naive version of the idea has been
    tried and failed for at least one phenotype. Nothing in the cited literature reports
    an attempt at receptor-independent iron delivery for the immune phenotype in
    patients, so this is recorded as a gap rather than a negative result. The attachment
    to the whole treatments section is deliberate: the gap is the absence of an
    intervention, not a defect in one that exists.
  evidence:
  - reference: PMID:26642240
    reference_title: "A missense mutation in TFRC, encoding transferrin receptor 1, causes combined immunodeficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Iron citrate rescued the lymphocyte defects, and expression of wild-type but not
      mutant TfR1 rescued impaired transferrin uptake in patient-derived fibroblasts.
    explanation: >-
      The in vitro rescue that motivates the question.
  - reference: PMID:26642240
    reference_title: "A missense mutation in TFRC, encoding transferrin receptor 1, causes combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      mild anemia resistant to iron supplementation
    explanation: >-
      Shows that conventional iron supplementation does not correct the haematological
      phenotype, which is the nearest thing to a negative clinical result and constrains
      how the in vitro rescue should be read.
- discussion_id: treg_model_direction_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Deleting this receptor in regulatory T cells causes autoimmunity in mouse, while
    losing its internalization in every cell causes immunodeficiency in humans. Does the
    mouse tell us anything about the patients, and is the vitiligo reported in patients
    the same phenomenon?
  attaches_to:
  - animal_models#Mouse
  - pathophysiology#Impaired Transferrin-Bound Iron Delivery
  - phenotypes#Vitiligo
  rationale: >-
    The Treg-restricted knockout is the clearest case in this entry of a model whose
    phenotype points the opposite way from the disease. Mice lacking CD71 only in
    regulatory T cells develop a scurfy-like autoimmune syndrome from failed perinatal
    Treg expansion; patients with a germline hypomorphic allele in every cell present
    with infection, not autoimmunity. Two readings are possible and the cited literature
    does not choose between them. Either the difference is dose - a hypomorph leaves
    enough residual uptake for Tregs while a deletion does not - or it is competition,
    with a whole-organism defect impairing conventional and regulatory lymphocytes alike
    so that no imbalance results. The question is not idle: several patients have
    autoimmune-flavoured features (vitiligo, Evans syndrome, an HLH-like presentation)
    that this entry currently records without a mechanism, and the Treg axis is the
    obvious candidate. Distinguishing the two readings needs Treg number and function
    measured in patients, which is not reported.
  evidence:
  - reference: PMID:38954474
    reference_title: Iron capture through CD71 drives perinatal and tumor-associated Treg expansion.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice with a Treg-restricted CD71 deficiency spontaneously developed a scurfy-like
      disease, caused by impaired perinatal Treg expansion.
    explanation: >-
      The model phenotype that runs opposite to the human disease.
  - reference: PMID:38270687
    reference_title: A Novel Homozygous Germline Mutation in Transferrin Receptor 1 (TfR1) Leads to Combined Immunodeficiency and Provides New Insights into Iron-Immunity Axis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, circulating NK, Treg, and MAIT cell populations were significantly
      decreased in the patient.
    explanation: >-
      The one human Treg measurement in this literature: Tregs are reduced in the patient
      with the second allele. That is consistent with the mouse at the cellular level
      while the clinical outcome still differs, which is what keeps the question open.
- discussion_id: myelodysplasia_risk
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Is the bone marrow dysmyelopoiesis reported before transplantation in TFRC deficiency
    a consequence of the iron-delivery defect itself, and does it carry a real risk of
    myelodysplastic syndrome?
  attaches_to:
  - pathophysiology#Erythroid Sparing via STEAP3
  - phenotypes#Decreased total neutrophil count
  rationale: >-
    The cytopenias in this disease are usually described as intermittent and benign, but
    the transplant series found signs of dysmyelopoiesis and dysplasia in all three
    patients who had a pre-transplant marrow examined, and one patient developed a clonal
    cytogenetic abnormality concerning for myelodysplastic syndrome. That is a small
    number and a selected population - patients referred for transplantation - so it is
    not a population risk estimate. It nonetheless sits awkwardly with the erythroid
    sparing recorded in the pathograph: if erythroid precursors largely escape the
    receptor defect, what accounts for a marrow phenotype spanning myeloid lineages? The
    question is whether this is a direct consequence of impaired iron delivery to
    proliferating marrow progenitors, a secondary effect of chronic infection and
    inflammation, or ascertainment.
  evidence:
  - reference: PMID:33096268
    reference_title: Hematopoietic Stem Cell Transplantation Is a Curative Therapy for Transferrin Receptor 1 (TFRC) Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      3 patients who underwent bone marrow evaluation before HSCT were found to have signs
      of dysmyelopoiesis and dysplasia
    explanation: >-
      The marrow finding, with its denominator, in the only series that examined it.
  - reference: PMID:33096268
    reference_title: Hematopoietic Stem Cell Transplantation Is a Curative Therapy for Transferrin Receptor 1 (TFRC) Deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One patient, who had a transplant at age 11 years, developed a clonal cytogenetic
      abnormality concerning for myelodysplastic syndrome.
    explanation: >-
      The single clonal event that raises the question. One patient is not a risk
      estimate, which is why this is recorded as an open question rather than as a
      phenotype.
notes: >-
  What makes this entry mechanistically distinctive. The lesion is not loss of a
  protein but loss of its internalization: the receptor is expressed, reaches the
  surface, and accumulates there. Several features of the disease follow from that
  distinction rather than from iron deficiency in general - the raised surface and
  soluble TfR1 that make useful diagnostic pointers, the resistance of the anaemia to
  iron supplementation, and the fact that erythroid cells are largely spared. The
  pathograph is built around the internalization block for that reason, with the
  erythroid sparing as its own node rather than as an absence of phenotype.

  Evidence base and its limits. This is a literature of roughly a dozen patients and two
  alleles. Frequency bands taken from the eight-patient cohort are reported percentages
  or "all patients" counts, but the denominator is eight; OBLIGATE here means "all
  patients in the only published series", not an established penetrance. The cellular
  mechanism is well supported - complementation, crosslinking, the iron-citrate rescue,
  and a knock-in mouse - and is graded IN_VITRO or MODEL_ORGANISM accordingly.

  Phenotype selection. The eight-patient cohort is cached as full text and its
  per-patient table has been curated down to the individual level, including features
  reported once (meningitis, multinodular goitre, optic nerve atrophy). Two things in
  that table are deliberately left uncurated as phenotypes: the HLH-like presentation in
  one patient and the Evans syndrome in another are recorded in the discussions instead,
  because both are composite clinical syndromes rather than single findings and binding
  either to one HPO term would lose what the source actually reports. Hepatitis B in two
  patients is not curated at all: it is an acquired infection in a transfused population
  and nothing in the source attributes it to the immunodeficiency.

  Not asserted. No mechanism is drawn for the non-haematological features - optic nerve
  atrophy, developmental delay, goitre, vitiligo. TfR1 is required for neurologic
  development, and an iron-dependent route to the neurological findings is plausible, but
  none of the cited sources traces one, so those phenotypes are recorded without an
  upstream pathophysiology edge rather than connected by assumption. Optic nerve atrophy
  in particular is reported in one of eight patients and the source does not say whether
  it is disease-attributable or incidental; it is curated because it recurs in the
  JAX-curated annotation set for this disease, not because causation is established. The
  autoimmune-flavoured features have a candidate mechanism through the Treg axis, which
  is recorded as an open model-mismatch question rather than drawn as an edge. No
  clinical trials or datasets are recorded, because none is reported.

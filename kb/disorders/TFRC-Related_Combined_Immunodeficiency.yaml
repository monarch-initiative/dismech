  notes: >-
    A diagnosed-case count, not a population prevalence estimate. The disorder was
    described in 2016; the largest series to date comprises eight patients from six
    unrelated families, and as of the 2024 report of the second allele only one causal
    mutation had previously been described.
  evidence:
  - reference: PMID:32851577
    reference_title: Clinical and Immunological Characterization of Combined Immunodeficiency Due to TFRC Mutation in Eight Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

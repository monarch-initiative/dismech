biochemical:
- name: Surface and soluble transferrin receptor 1
  presence: INCREASED
  context: >-
    The diagnostically distinctive laboratory finding, and the one that separates this
    disorder from every other cause of impaired cellular iron acquisition. Because the
    receptor cannot be internalized, it accumulates where it was made: surface TfR1 is
    13-fold and 7-fold higher on patient T and B cells respectively than on controls,
    and 6-fold higher on patient fibroblasts. Soluble TfR1, released by cleavage of the
    surface receptor, is correspondingly raised in serum. The direction is the
    counter-intuitive part - in ordinary iron deficiency TfR1 also rises, but here it
    rises because the receptor is stranded rather than because the cell is signalling
    for more iron, and the two contributions are not separated by any cited measurement.
  readouts:
  - target: Defective TfR1 Endocytosis with Surface Accumulation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Raised surface and soluble TfR1 is the direct observable consequence of the
      internalization block, and is what makes the mechanism visible in a patient sample.
    evidence:
    - reference: PMID:26642240
      reference_title: "A missense mutation in TFRC, encoding transferrin receptor 1, causes combined immunodeficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Likewise, surface TfR1 expression was 6-fold higher on patient than control
        fibroblasts
      explanation: >-
        A quantified surface accumulation in a non-immune cell type, showing the defect is
        not lymphocyte-specific.
  evidence:
  - reference: PMID:26642240
    reference_title: "A missense mutation in TFRC, encoding transferrin receptor 1, causes combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Surface TfR1 was minimally expressed on unstimulated control T and B cells, but was
      expressed on a large percentage of patients
    explanation: >-
      Establishes the contrast with controls in the cell types that carry the disease
      phenotype. The quote stops before the possessive, whose typographic apostrophe in
      the cached text does not round-trip reliably through YAML.
  - reference: PMID:26642240
    reference_title: "A missense mutation in TFRC, encoding transferrin receptor 1, causes combined immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Soluble TfR1, generated by cleavage of surface TfR1, was significantly elevated in
      the patients
    explanation: >-
      The serum-measurable form of the same accumulation, which is what makes this a
      practical diagnostic marker rather than a research assay.
genetic:
- name: TFRC pathogenic variants
  gene_term:
    preferred_term: TFRC
    term:
      id: hgnc:11763
      label: TFRC
  association: Causative
  relationship_type: CAUSATIVE
  notes: >-
    Two homozygous missense alleles have been reported, both in the intracellular
    internalization motif: c.58T>C (p.Tyr20His), found in every patient of the eight
    patient cohort and in the founding report, and c.64C>T (p.Arg22Trp), reported in a
    single Turkish patient in 2024. The allelic spectrum is therefore extremely narrow,
    and both alleles act by the same mechanism - impaired internalization of an
    otherwise expressed receptor - rather than by loss of the protein. That distinction
    matters clinically: complete absence of TfR1 would be expected to compromise
    erythropoiesis far more severely than is observed.
  evidence:
  - reference: PMID:32851577
    reference_title: Clinical and Immunological Characterization of Combined Immunodeficiency Due to TFRC Mutation in Eight Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The same homozygous missense mutation c.58T>C:p.Y20H, in the TFRC gene, was
      detected in all patients.
    explanation: >-
      The recurrent allele and its recurrence across the cohort's six families.
  - reference: PMID:38270687
    reference_title: A Novel Homozygous Germline Mutation in Transferrin Receptor 1 (TfR1) Leads to Combined Immunodeficiency and Provides New Insights into Iron-Immunity Axis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We herein identified a new disease-causing homozygous germline mutation in the
      TFRC gene (c.64C > T, p.R22W)
    explanation: >-
      The second reported allele, which doubled the known allelic spectrum.
  variants:
  - name: TFRC c.58T>C (p.Tyr20His)
    description: >-
      The founding and by far the commonest allele, homozygous in every patient of the
      eight-patient cohort and in both families of the original report. It substitutes
      the aromatic tyrosine required at the p.Y20 position of the YTRF internalization
      motif. The knock-in mouse establishes that it is hypomorphic rather than null:
      unlike Tfrc-null mice, homozygous knock-in animals are viable.
    gene:
      preferred_term: TFRC
      term:
        id: hgnc:11763
        label: TFRC
    type: MISSENSE
    clinical_significance: PATHOGENIC
    identifiers:
    - rs863225436
    - ClinVar:VCV000218163
    functional_effects:
    - function: TfR1 internalization
      description: >-
        Disrupts recognition of the YTRF motif by the clathrin adaptor machinery, so the
        receptor is not endocytosed and accumulates at the cell surface.
    evidence:
    - reference: PMID:26642240
      reference_title: "A missense mutation in TFRC, encoding transferrin receptor 1, causes combined immunodeficiency."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In contrast to Tfrc null mice12, TfrcY20H/Y20H mutant mice were viable, indicating
        that the mutation is hypomorphic.
      explanation: >-
        Establishes the allele as hypomorphic rather than null, by the survival contrast
        with the complete knockout. This distinction is what the mild anaemia and the
        preserved lymphocyte numbers are consistent with.
  - name: TFRC c.64C>T (p.Arg22Trp)
    description: >-
      The second reported allele, homozygous in a single Turkish patient. It lies two
      codons from p.Tyr20 in the same internalization motif and produces the same
      internalization defect.
    gene:
      preferred_term: TFRC
      term:
        id: hgnc:11763
        label: TFRC
    type: MISSENSE
    clinical_significance: LIKELY_PATHOGENIC
    identifiers:
    - rs373123870
    functional_effects:
    - function: TfR1 internalization
      description: >-
        Impairs TfR1 internalization in the same way as p.Tyr20His.
    evidence:
    - reference: PMID:38270687
      reference_title: A Novel Homozygous Germline Mutation in Transferrin Receptor 1 (TfR1) Leads to Combined Immunodeficiency and Provides New Insights into Iron-Immunity Axis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        TfR1R22W results in impaired TfR1 internalization similar to previously defined
        TfR1Y20H mutation.
      explanation: >-
        The functional equivalence to the founding allele. Recorded as LIKELY_PATHOGENIC

  description: >-
    Every reported patient carries two NDUFA9 variants: eleven of twelve are homozygous and one
    is compound heterozygous. Parental consanguinity is reported in ten of the twelve. In the
    2025 cohort the variants co-segregated with disease, and unaffected parents and siblings
    each carried a single variant. NDUFA9 is nuclear-encoded, so there is no maternal
    transmission.
  evidence:
  - reference: PMID:41069424
    reference_title: Biallelic NDUFA9 variants cause a progressive neurodevelopmental disorder with prominent dystonia and mitochondrial complex I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all new cases with genomic DNA available, segregation analysis revealed that biallelic NDUFA9 variants co-segregated with neurological disease phenotypes, whereas unaffected parents and siblings of affected individuals harboured one heterozygous NDUFA9 variant (Fig. 1A)."
    explanation: Recessive segregation across the new families.
  - reference: PMID:41069424
    reference_title: Biallelic NDUFA9 variants cause a progressive neurodevelopmental disorder with prominent dystonia and mitochondrial complex I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Parental consanguinity was reported in all but two affected individuals (10/12, 83.3%; F3-P1, F8-P1)."
    explanation: The high consanguinity rate expected of a rare recessive disorder.
  - reference: PMID:22114105
    reference_title: Defective NDUFA9 as a novel cause of neonatally fatal complex I disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using homozygosity mapping and subsequent positional candidate gene analysis, a total region of 255.8 Mb containing 136 possible mitochondrial genes was identified."
    explanation: The gene was first found by homozygosity mapping in a consanguineous family.
pathophysiology:
- name: Biallelic NDUFA9 Missense Variants
  conforms_to: "complex_i_deficiency#Complex I Biogenesis or Repair Failure"
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    The initiating lesion. Nine missense variants are known, all in the mature protein rather
    than the mitochondrial targeting presequence, and most lie in the last exon. Arg360 is
    changed in three unrelated families (to Cys, Gly and Leu) and has been proposed as a
    mutational hotspot. Two complementation experiments in patient fibroblasts, carrying the
    Arg321Pro and Arg360Cys alleles, show that wild-type NDUFA9 corrects the defect. That makes
    the variants causal and loss of function.
  genes:
  - preferred_term: NDUFA9
    term:
      id: hgnc:7693
      label: NDUFA9
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    description: >-
      Curated as loss of function because wild-type NDUFA9 rescues the fibroblast defect. The
      reported alleles are all missense, and the 2025 cohort authors suggest that complete loss
      of NDUFA9 may be incompatible with survival. If so, the human alleles are hypomorphs
      rather than nulls, but this has not been tested and PARTIAL_LOSS_OF_FUNCTION is not
      asserted. Zygosity is left unset at entry level because eleven of twelve patients are
      homozygous and one is compound heterozygous.

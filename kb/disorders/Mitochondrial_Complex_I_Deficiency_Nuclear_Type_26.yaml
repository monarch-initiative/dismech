name: Mitochondrial Complex I Deficiency, Nuclear Type 26
creation_date: "2026-10-01T20:20:38Z"
category: Mendelian
disease_term:
  preferred_term: Mitochondrial complex I deficiency, nuclear type 26
  term:
    id: MONDO:0032630
    label: mitochondrial complex I deficiency, nuclear type 26
description: >-
  Mitochondrial complex I deficiency nuclear type 26 (MC1DN26) is the isolated complex I
  deficiency caused by biallelic variants in NDUFA9, a nuclear-encoded accessory
  (supernumerary) subunit of the complex I Q module. NDUFA9 sits where the hydrophilic matrix
  arm meets the membrane arm. Knocking it out in human cells leaves a membrane-arm subcomplex
  with no matrix arm attached, so the protein is needed to hold the two arms together during a
  late step of assembly. Patient fibroblasts show the same thing from the other side: less
  fully assembled complex I, Q-module subassemblies piling up, and wild-type NDUFA9 rescuing
  both.

  The disease was first described in 2012 in a single neonate with fatal Leigh syndrome. By
  2025, twelve affected people from ten families were known, and the picture had widened into
  a progressive neurodevelopmental disorder with prominent dystonia and a Leigh syndrome
  pattern on brain MRI. Neurodevelopmental delay followed by motor deterioration and seizures is
  the usual presentation. Deterioration always starts in the first decade, dystonia was present
  in every patient who survived past early infancy, and the striatum (putamen and caudate) was
  abnormal on every MRI reviewed. The range runs from death in the first months of life to
  isolated generalized dystonia with survival into adulthood. Every disease-associated allele
  reported so far is a missense change, and three of them hit arginine 360.

  No disease-modifying treatment exists. Management is symptomatic, chiefly of the dystonia.

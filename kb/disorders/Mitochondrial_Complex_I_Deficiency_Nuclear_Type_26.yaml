  therapeutic_modality: SMALL_MOLECULE
  description: >-
    Trihexyphenidyl and clonazepam for dystonia. The only report is one adult, whose dystonia
    rating score improved by about 20 percent at one year on these drugs given together with a
    vitamin and cofactor cocktail. No controlled data exist, and the improvement cannot be
    assigned to either drug.

- name: NDUFA9 Misfolding and Loss of Membrane Anchoring
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    How a single amino-acid change in an accessory subunit could weaken the enzyme. Structural
    modelling on the human complex I structure predicts two kinds of damage. Most variants
    replace a positively charged arginine or lysine. Some of these break ion pairs, which leads
    to misfolding. The Arg360 variants instead remove a residue that binds negatively charged
    membrane phospholipids, and that binding is how NDUFA9 anchors the hydrophilic domain to the
    membrane. Steady-state NDUFA9 protein was reduced in fibroblasts from two brothers homozygous
    for Arg354Gln, but was normal in a compound heterozygote (Arg360Gly/Gly267Val) who still
    lost assembled complex I. So reduced protein is not the only route to disease.

    Marked PROVISIONAL because the misfolding and phospholipid-binding consequences come from
    in silico modelling and have not been measured for any variant.
  evidence:
  - reference: PMID:41069424
    reference_title: Biallelic NDUFA9 variants cause a progressive neurodevelopmental disorder with prominent dystonia and mitochondrial complex I deficiency.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Protein modelling suggested that variants cause NADH:ubiquinone oxidoreductase subunit A9 (NDUFA9) misfolding and/or disruption of binding interfaces."
    explanation: The in silico prediction this node rests on.
  - reference: PMID:41069424
    reference_title: Biallelic NDUFA9 variants cause a progressive neurodevelopmental disorder with prominent dystonia and mitochondrial complex I deficiency.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Additionally, Arginine has important interactions with negatively charged phospholipid headgroups when located on membrane-binding surface, such as Arg360, where they help to embed the subunit and anchor the hydrophilic domain of complex I."
    explanation: The modelled role of the Arg360 hotspot in membrane anchoring.
  - reference: PMID:41069424
    reference_title: Biallelic NDUFA9 variants cause a progressive neurodevelopmental disorder with prominent dystonia and mitochondrial complex I deficiency.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, decreased steady-state levels of NDUFA9 protein were detected in two related homozygotes for the variant Arg354Gln."
    explanation: Measured loss of the protein in patient fibroblasts for one allele.

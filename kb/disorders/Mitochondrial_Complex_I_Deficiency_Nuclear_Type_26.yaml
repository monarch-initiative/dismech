- name: Destabilized Matrix-Membrane Arm Junction and Stalled Complex I Assembly
  biological_scale: MOLECULAR
  role: central_effector
  mechanism_confidence: ESTABLISHED
  description: >-
    NDUFA9 joins complex I early, as one of the Q-module matrix-arm subunits (with NDUFS2 and
    NDUFS3) in the roughly 400 kDa intermediate that contains ND1 and the NDUFAF3/NDUFAF4
    assembly factors. This is the intermediate that fails to form in MC1DN18 (NDUFAF3). Its
    essential job, though, comes late. Human cells lacking NDUFA9 build a membrane-arm
    subcomplex that has no matrix arm attached, which places NDUFA9 at the junction that holds
    the two arms together.

    Patient fibroblasts show the same failure. Fully assembled complex I is reduced and Q-module
    subassemblies accumulate. In the most severely affected patient, P-module subassemblies
    accumulate as well, and in one 2025 patient a stalled, partially assembled intermediate was
    seen. Re-expressing wild-type NDUFA9 corrects assembly both in knockout cells and in patient
    cells.
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex I assembly
    modifier: DECREASED
    term:
      id: GO:0032981
      label: mitochondrial respiratory chain complex I assembly

    reference_title: "Childhood-Onset Generalized Dystonia Due to NDUFA9 Gene Mutation: An Expansion of Mutations Causing Leigh's Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "She was treated with carnitine, coenzyme Q10, riboflavin, thiamine, vitamin E, and biotin."
    explanation: Documents use in a single patient. It is not evidence of efficacy.
discussions:
- discussion_id: mc1dn26_genotype_severity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the severity of an NDUFA9 allele's assembly defect predict whether a patient dies in
    infancy or lives into adulthood with dystonia?
  attaches_to:
  - "pathophysiology#Destabilized Matrix-Membrane Arm Junction and Stalled Complex I Assembly"
  - "pathophysiology#Isolated Complex I Deficiency"
  rationale: >-
    The 2018 comparison of two patients concluded that clinical severity tracks the severity of
    the assembly defect. The neonatal patient had Q- and P-module subassembly accumulation and
    near-absent activity. The adult with dystonia had Q-module accumulation only and about 17
    percent activity. The 2025 cohort points the other way in one family: one affected brother
    homozygous for Arg354Gln had normal fibroblast complex I activity despite losing fully
    assembled complex I, and he died at 13. The 2025 authors state that correlations are limited
    by the small number of mostly private variants. Fibroblasts may also not reflect brain.
  evidence:
  - reference: PMID:28671271
    reference_title: NDUFA9 point mutations cause a variable mitochondrial complex I assembly defect.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "demonstrates that the severity of the clinical phenotype correlates with the severity of the effects of the different NDUFA9 variants on complex I assembly"
    explanation: The two-patient correlation.
  - reference: PMID:41069424
    reference_title: Biallelic NDUFA9 variants cause a progressive neurodevelopmental disorder with prominent dystonia and mitochondrial complex I deficiency.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "although surprisingly fibroblasts from F1-P2 showed normal complex I activity"
    explanation: An affected patient with normal fibroblast activity weakens activity as a severity marker.
  - reference: PMID:41069424
    reference_title: Biallelic NDUFA9 variants cause a progressive neurodevelopmental disorder with prominent dystonia and mitochondrial complex I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, such correlations have been hampered by the limited number of reported cases and variants, most of which are private."
    explanation: The authors' own statement of the limit.
  proposed_experiments:
  - experiment_id: exp_mc1dn26_isogenic_alleles
    name: Compare patient alleles in an isogenic NDUFA9-null background
    description: >-
      Re-express each of the nine patient alleles in NDUFA9-knockout human cells, or in
      iPSC-derived striatal neurons, and quantify NDUFA9 stability, subassembly accumulation and
      complex I activity side by side, to see whether the measurements rank the alleles in line
      with clinical severity.
- discussion_id: mc1dn26_striatal_vulnerability
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does a complex I assembly defect present in every cell select the striatum, and in only
    some patients the cerebral white matter?
  attaches_to:
  - "pathophysiology#Striatal and Brainstem Energy Failure"
  - "pathophysiology#Cerebral White Matter and Cortical Degeneration"
  rationale: >-
    Putamen and caudate are involved in every MRI, while white matter loss and cavitation occur
    in half. The source attributes the striatal pattern to selective vulnerability without
    proposing a mechanism. No neuropathology, animal model or neuronal model of NDUFA9 deficiency
    exists. Some deteriorations are triggered by infection or fever, which suggests a
    decompensation component that also has not been studied.
  evidence:
  - reference: PMID:41069424
    reference_title: Biallelic NDUFA9 variants cause a progressive neurodevelopmental disorder with prominent dystonia and mitochondrial complex I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "which suggests a selective vulnerability of these anatomical structures"
    explanation: The authors name selective vulnerability without proposing its basis.
- discussion_id: mc1dn26_null_allele_viability
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is complete loss of NDUFA9 lethal in humans, so that only hypomorphic missense alleles are
    seen in patients?
  attaches_to:
  - "pathophysiology#Biallelic NDUFA9 Missense Variants"
  rationale: >-
    All nine reported alleles are missense, none affects the presequence, and the knockout in
    human cell lines abolishes matrix-arm attachment. The 2025 authors suggest that complete loss
    of function may be incompatible with survival. With twelve patients this is an
    ascertainment-limited observation, not a demonstrated constraint, and no NDUFA9 animal model
    has been reported to test it.
  evidence:
  - reference: PMID:41069424
    reference_title: Biallelic NDUFA9 variants cause a progressive neurodevelopmental disorder with prominent dystonia and mitochondrial complex I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "From a genotypic perspective, all nine NDUFA9 variants linked to human disease so far are missense mutations, which might suggest that complete loss of function is not compatible with complex I assembly and/or functioning and ultimately with survival in humans."
    explanation: The hypothesis as stated by the source.
notes: >-
  A 2023 letter (PMID:36939934, "Additive effect of DNAJC30 and NDUFA9 mutations causing Leigh
  syndrome") reports a patient carrying variants in both NDUFA9 and the complex I repair
  chaperone DNAJC30. PubMed has no abstract for it, so it is not cited and no digenic
  inheritance is curated. A curator with access to the full text should check whether it
  supports a modifier or digenic relationship.

  The NDUFA9 protein accession appears in the 2025 cohort paper as both NP_004993.1 and
  NP_006805.2. The coding positions are given on NM_005002.5 throughout and are copied from
  there.

  No animal model of NDUFA9 deficiency has been reported, so animal_models is empty.

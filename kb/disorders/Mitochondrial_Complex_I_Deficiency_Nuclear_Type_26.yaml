experimental_models:
- name: NDUFA9 patient fibroblast complementation
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Fibroblasts from the Arg321Pro (neonatal) and Arg360Cys (adult dystonia) patients,
    transduced with wild-type NDUFA9 by lentivirus. This is the experiment that establishes
    causality and gives the clearest link between allele severity and assembly defect.
  modeled_mechanisms:
  - target: Destabilized Matrix-Membrane Arm Junction and Stalled Complex I Assembly
    relationship: RESCUES
    fidelity: HIGH
    model_scale: MOLECULAR
    description: >-
      Wild-type NDUFA9 corrected both the complex I deficiency and the accumulation of
      subassemblies in both patients' cells.
    limitations: >-
      Fibroblasts are not the affected tissue. The rescue establishes causality but says nothing
      about why the striatum is selectively vulnerable.
    readouts:
    - name: Complex I activity and assembly after wild-type NDUFA9 expression
      target: Destabilized Matrix-Membrane Arm Junction and Stalled Complex I Assembly
      direction: RESTORED
      evidence:
      - reference: PMID:28671271
        reference_title: NDUFA9 point mutations cause a variable mitochondrial complex I assembly defect.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Lentiviral complementation of both patient fibroblast cell lines with wild-type NDUFA9 rescued complex I deficiency and the assembly defects."
        explanation: The rescue measurement.
    evidence:
    - reference: PMID:22114105
      reference_title: Defective NDUFA9 as a novel cause of neonatally fatal complex I disease.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Complex I activity was restored in fibroblasts of the patient by lentiviral transduction with wild type but not mutant NDUFA9, confirming that the mutation causes the complex I deficiency and related disease."
      explanation: Wild type rescues and mutant does not, in the index patient's cells.
- name: NDUFA9 knockout HEK293T cells
  experimental_model_type: CELL_LINE
  description: >-
    TALEN-mediated knockout of NDUFA9 in human HEK293T cells. This is a complete null, which no
    patient is known to carry.
  modeled_mechanisms:
  - target: Destabilized Matrix-Membrane Arm Junction and Stalled Complex I Assembly
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Loss of NDUFA9 abolishes matrix-arm attachment, leaving a membrane-arm subcomplex. The
      cells cannot grow on galactose, and re-expression restores assembly.
    limitations: >-
      A null allele in a transformed kidney-derived line. Every patient allele is missense and
      some leave NDUFA9 protein at normal levels, so the knockout probably overstates the defect
      in patients.
    readouts:
    - name: Complex I assembly in NDUFA9-null cells
      target: Destabilized Matrix-Membrane Arm Junction and Stalled Complex I Assembly
      direction: DECREASED
      evidence:
      - reference: PMID:23223238
        reference_title: Gene knockout using transcription activator-like effector nucleases (TALENs) reveals that human NDUFA9 protein is essential for stabilizing the junction between membrane and matrix arms of complex I.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "A cell line lacking functional copies of both NDUFA9 alleles resulted in a loss of NDUFA9 protein expression, impaired assembly of complex I, and cells incapable of growth in galactose medium."
        explanation: The knockout assembly and growth phenotype.
    evidence:
    - reference: PMID:23223238
      reference_title: Gene knockout using transcription activator-like effector nucleases (TALENs) reveals that human NDUFA9 protein is essential for stabilizing the junction between membrane and matrix arms of complex I.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Re-expression of NDUFA9 restored the defects in complex I assembly."
      explanation: The defect is specific to NDUFA9 loss.
diagnosis:
- name: Exome Sequencing with Respiratory Chain Enzyme Testing
  description: >-
    Most patients are diagnosed by exome sequencing. Respiratory chain enzyme assay in muscle or
    fibroblasts shows isolated complex I deficiency, and blue-native gel analysis shows the
    assembly defect. The 2025 authors recommend including NDUFA9 in the diagnostic workup of
    complex movement disorders with dystonia and/or pyramidal features and a Leigh syndrome
    pattern on MRI. A normal lactate does not exclude the diagnosis.
  evidence:
  - reference: PMID:41069424
    reference_title: Biallelic NDUFA9 variants cause a progressive neurodevelopmental disorder with prominent dystonia and mitochondrial complex I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This evidence supports the inclusion of NDUFA9 variants in the diagnostic workup of complex movement disorders encompassing dystonia and/or pyramidal features and a LS pattern of brain MRI signal abnormalities."
    explanation: The authors' diagnostic recommendation.
differential_diagnoses:
- name: Other complex I deficiencies presenting with dystonia
  description: >-
    Prominent dystonia within a neurodevelopmental disorder is common in several other complex I
    deficiencies, both nuclear (NDUFS6, NDUFAF5, NDUFS7, NDUFA12, NDUFS1, NDUFS4) and
    mitochondrial (MT-ND1, MT-ND3). These cannot be told apart from MC1DN26 on clinical or
    imaging grounds, only by genotype.
  evidence:
  - reference: PMID:41069424
    reference_title: Biallelic NDUFA9 variants cause a progressive neurodevelopmental disorder with prominent dystonia and mitochondrial complex I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most NDUFA9 patients showed neurodevelopmental delay/intellectual disability and complex movement abnormalities, in keeping with the phenotypic spectrum reported for other mitochondrial disorders caused by mutations in nuclear and mitochondrial DNA genes encoding complex I subunits."
    explanation: The phenotype overlaps with other complex I subunit disorders.

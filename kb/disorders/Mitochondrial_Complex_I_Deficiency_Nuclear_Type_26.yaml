genetic:
- name: NDUFA9
  gene_term:
    preferred_term: NDUFA9
    term:
      id: hgnc:7693
      label: NDUFA9
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  notes: >-
    Nine disease-associated missense alleles (NM_005002.5): c.710A>T p.(Lys237Ile), c.727G>A
    p.(Val243Ile), c.800G>T p.(Gly267Val), c.962G>C p.(Arg321Pro), c.1061G>A p.(Arg354Gln),
    c.1069C>G p.(Arg357Gly), c.1078C>T p.(Arg360Cys), c.1078C>G p.(Arg360Gly) and c.1079G>T
    p.(Arg360Leu). Arg354Gln recurs in three families. The 2025 cohort paper writes the protein
    accession two different ways (NP_004993.1 in the abstract, NP_006805.2 in the variant table).
    The residue numbering is the same in both. No truncating allele has been reported.
  evidence:
  - reference: PMID:41069424
    reference_title: Biallelic NDUFA9 variants cause a progressive neurodevelopmental disorder with prominent dystonia and mitochondrial complex I deficiency.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "From a genotypic perspective, all nine NDUFA9 variants linked to human disease so far are missense mutations, which might suggest that complete loss of function is not compatible with complex I assembly and/or functioning and ultimately with survival in humans."
    explanation: All known alleles are missense.
  - reference: PMID:37970307
    reference_title: "Childhood-Onset Generalized Dystonia Due to NDUFA9 Gene Mutation: An Expansion of Mutations Causing Leigh's Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing showed a homozygous missense mutation in the NDUFA9 gene (NM_005002.5:c.727G >A (p.Val243Ile))."
    explanation: A further homozygous missense allele in an adult with dystonia.

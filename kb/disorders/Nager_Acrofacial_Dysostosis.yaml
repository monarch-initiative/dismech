discussions:
- discussion_id: nager_sf3b4_dose_species_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why does heterozygous loss of sf3b4 cause no craniofacial phenotype in
    Xenopus tropicalis when the same half dose of SF3B4 causes Nager syndrome in
    humans, and what does that imply for using the frog null as a model of a
    human haploinsufficiency disorder?
  attaches_to:
  - pathophysiology#SF3B4 Haploinsufficiency
  - animal_models#Xenopus tropicalis sf3b4 CRISPR mutant line
  rationale: >-
    Human Nager syndrome is a dominant haploinsufficiency: one truncating SF3B4
    allele is enough. In the frog, heterozygotes are transcriptionally and
    morphologically near-normal and only homozygous nulls show the crest and
    cartilage phenotype — which the authors themselves read as an autosomal
    recessive mode in X. tropicalis. So the genotype that models the disease
    biochemically is not the genotype that models it clinically. Either the frog
    tolerates a lower dose of Sf3b4 than humans do, or something outside gene
    dosage — a modifier, a threshold effect, or a difference in how long cranial
    crest is exposed to the deficit — sets the human threshold. Until that is
    resolved, mechanisms read off the null should be treated as showing what
    losing Sf3b4 can do, not as showing what patients' cells are doing. The
    same question sits underneath the disease's central puzzle, which is why a
    core spliceosome component fails in one lineage only.
  evidence:
  - reference: PMID:40126363
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "our data indicate that sf3b4 haploinsufficiency is compatible with normal development in X. tropicalis, whereas homozygous deletion of sf3b4 is detrimental to survival and the formation of NC-derived cartilage progenitors, consistent with an autosomal recessive mode of inheritance"
    explanation: States the species difference in dose sensitivity in the authors' own terms.
  - reference: PMID:22541558
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results suggest that most cases of Nager syndrome are caused by haploinsufficiency of SF3B4."
    explanation: The human side of the mismatch — one allele is sufficient to cause disease in people.
- discussion_id: nager_spliceosome_lineage_selectivity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does reduced dose of a ubiquitously required core spliceosome component
    damage cranial neural crest specifically, rather than every dividing tissue?
  attaches_to:
  - pathophysiology#Aberrant Pre-mRNA Splicing and Exon Skipping
  rationale: >-
    This is the defining unanswered question of the spliceosomopathies, and
    nothing in this entry's pathophysiology answers it — the chain from reduced
    SF3B4 to shortened crest streams describes what happens without explaining
    why the crest is where it happens. Candidate explanations include an
    unusually high transcriptional demand in migrating crest, particular
    sensitivity of specific transcripts to branch-point recognition, and a
    p53-linked apoptotic threshold that crest cells cross first. The frog line
    gives the tools to test these, since it separates the splicing change in time
    from the cellular failure.
  evidence:
  - reference: PMID:40126363
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "It is especially puzzling that variants of a core component of this largely ubiquitous cellular machinery result in such an exquisitely cell type- and lineage-specific defect."
    explanation: States the gap in the authors' own words.
notes: >-
  Entry created from the curation stub while adding the Xenopus tropicalis sf3b4
  CRISPR model from Disease Models & Mechanisms. Roughly 40% of clinically
  diagnosed Nager syndrome has no identified genetic cause, so this entry's
  pathophysiology describes the SF3B4 route only. Rodriguez syndrome is treated
  as an allelic differential rather than a subtype, since its lower-limb,
  cardiac and forebrain involvement puts it outside the acrofacial pattern this
  entry describes.

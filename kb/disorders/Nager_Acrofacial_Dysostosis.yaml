diagnosis:
- name: Molecular genetic testing of SF3B4
  description: >-
    Sequencing of SF3B4 confirms the diagnosis in roughly 60% of clinically
    diagnosed individuals; a negative result does not exclude Nager syndrome,
    since 40% of cases have no identified cause.
  evidence:
  - reference: PMID:40126363
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The remaining 40% of cases are of unknown cause."
    explanation: States the diagnostic yield limit that this recommendation turns on.
differential_diagnoses:
- name: Treacher Collins syndrome
  description: >-
    Shares the mandibulofacial dysostosis pattern but lacks preaxial limb
    involvement; the thumb and radial defects are what make Nager syndrome
    acrofacial. Neonatal courses also differ — tracheostomy and mortality rates
    are substantially higher in Nager syndrome.
  evidence:
  - reference: PMID:40280475
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Infants with NS had the highest rate of intubation at birth (91%) and tracheostomy placement (72.7%), and a higher mortality rate than TCS (27.3% vs 1.9%)."
    explanation: Quantifies the neonatal difference between the two syndromes in a shared cohort.
- name: Rodriguez syndrome
  description: >-
    Also caused by SF3B4 variants, with the same craniofacial pattern but more
    severe, and additionally involving the lower limbs, heart and forebrain.
  evidence:
  - reference: PMID:40126363
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Rodriguez syndrome (OMIM #201170) is another condition due to mutations in SF3B4"
    explanation: Establishes the shared gene that makes this the closest allelic differential.
treatments:
- name: Neonatal airway stabilization and tracheostomy
  description: >-
    Securing the airway is the first priority. Intubation is difficult because
    trismus restricts mouth opening, and a majority of affected neonates
    ultimately require tracheostomy.
  treatment_term:
    preferred_term: tracheotomy
    term:
      id: NCIT:C15341
      label: Tracheotomy
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:40280475
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Infants with NS had the highest rate of intubation at birth (91%) and tracheostomy placement (72.7%), and a higher mortality rate than TCS (27.3% vs 1.9%)."
    explanation: Quantifies how often airway intervention is needed in this population.
  - reference: PMID:18947886
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A case of a Nager Syndrome mother delivering a similarly afflicted fetus is presented, with approaches to maintaining both tenuous airways described."
    explanation: >-
      Airway management is the subject of this report; it is a single family, so
      it supports the practice rather than establishing an approach.
- name: Gastrostomy feeding support
  description: >-
    Micrognathia, restricted mouth opening and a secured airway together impair
    oral feeding, and enteral access is commonly needed in the mandibulofacial
    dysostosis population.
  treatment_term:
    preferred_term: gastrostomy tube placement
    term:
      id: NCIT:C157864
      label: Gastrostomy Tube Procedure
  therapeutic_modality: SURGERY
  evidence:
  - reference: PMID:40280475
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared with infants with micrognathia, those with TCS were more likely to undergo tracheostomy (54% vs 11%) and gastrostomy tube placement (67% vs 35%)"
    explanation: >-
      The reported gastrostomy rate is for the Treacher Collins arm of the same
      cohort, not the Nager arm, so this supports the practice in
      mandibulofacial dysostosis generally rather than quantifying it in Nager
      syndrome.
- name: Genetic counseling
  description: >-
    Counseling covers de novo occurrence in most cases, autosomal dominant

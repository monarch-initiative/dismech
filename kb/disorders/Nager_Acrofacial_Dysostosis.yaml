    explanation: The inheritance picture that counseling has to convey.
animal_models:
- name: Xenopus tropicalis sf3b4 CRISPR mutant line
  species: Xenopus tropicalis
  genotype: CRISPR/Cas9-generated sf3b4 deletion, heterozygous and homozygous null, with wild-type siblings
  category: Germline gene-edited mutant line
  publication: PMID:40126363
  description: >-
    A stable frog mutant line built to ask why a ubiquitous splicing factor
    produces a lineage-restricted disease. Its answer has two parts: the splicing
    lesion appears first as excess exon skipping and only later as broad
    transcriptional dysregulation, and the cellular failure is in cranial neural
    crest migration and survival rather than in crest induction. The line also
    delivers the field's clearest human-model mismatch — heterozygous frogs are
    indistinguishable from wild type and form normal craniofacial cartilage,
    while the corresponding human genotype is the disease.
  genes:
  - preferred_term: SF3B4
    term:
      id: hgnc:10771
      label: SF3B4
  modeled_mechanisms:
  - target: Aberrant Pre-mRNA Splicing and Exon Skipping
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Temporal RNA-seq of mutant embryos resolves the splicing lesion into an
      early exon-skipping phase and a later transcriptional collapse, which is
      the ordering this node asserts.
    limitations: >-
      The splicing phenotype is reported for null embryos; heterozygotes differ
      only minimally from wild type at the transcriptome level, so the model
      characterizes what total loss of Sf3b4 does to splicing rather than what
      the patient's half dose does.
    readouts:
    - name: Genes with atypical skipped exons in mutant embryos
      target: Aberrant Pre-mRNA Splicing and Exon Skipping
      direction: INCREASED
      interpretation: >-
        Exon skipping rises before general gene dysregulation, identifying it as
        the primary molecular consequence rather than a downstream effect.
      evidence:
      - reference: PMID:40126363
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Temporal RNA-sequencing analyses of mutant embryos identified an increase in exon-skipping events, followed by important transcriptional changes associated with an enrichment for terms consistent with defects in NC cell migration and survival."
        explanation: Reports both the measured increase and its temporal precedence.
    evidence:
    - reference: PMID:40126363
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "we generated a Xenopus tropicalis sf3b4 mutant line using CRISPR/Cas9 gene-editing technology"
      explanation: Establishes the model as a germline edit of the disease gene rather than a transient knockdown.
  - target: Cranial Neural Crest Migration Failure and Apoptosis
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Separates induction from migration: pre-migratory crest markers are normal,
      and the phenotype emerges at the migratory stage as shortened crest streams
      with increased head apoptosis.
    limitations: >-
      Severity is dose-dependent and the informative phenotype is largely in the
      null, which is not the human genotype. The apoptotic component is scored by
      TUNEL in the whole head region rather than in identified crest cells, so
      apoptosis of crest cells specifically is inferred.
    readouts:
    - name: Cranial neural crest stream length (sox9, sox10)
      target: Cranial Neural Crest Migration Failure and Apoptosis
      direction: DECREASED
      interpretation: >-
        Shorter streams at the migratory stage, with normal pre-migratory
        markers, place the defect in migration rather than specification.
      evidence:
      - reference: PMID:40126363
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Quantification of the phenotype showed a statistically significant reduction of the NC stream length (streams 2 and 3 for sox10, and streams 3 and 4 for sox9) in Het and Null embryos compared to WT siblings"
        explanation: The quantified migration readout.
    - name: TUNEL-positive cells in the head region
      target: Cranial Neural Crest Migration Failure and Apoptosis
      direction: INCREASED
      interpretation: >-
        Cell death rises only once migration begins, matching the stage at which
        the migration defect appears.
      evidence:
      - reference: PMID:40126363
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "at the migratory stage (NF stage 25), there was a significant increase in apoptosis in the head region of Het and Null embryos, with a greater number of TUNEL-positive cells in the Null compared to the Het animals"
        explanation: The quantified survival readout and its stage dependence.
    evidence:
    - reference: PMID:40126363
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM

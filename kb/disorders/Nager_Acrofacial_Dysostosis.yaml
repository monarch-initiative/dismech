name: Nager Acrofacial Dysostosis
creation_date: '2026-08-27T14:30:00Z'
description: >-
  Nager acrofacial dysostosis is the archetype of the acrofacial dysostoses: a
  congenital malformation syndrome combining mandibulofacial dysostosis
  (downslanted palpebral fissures, malar hypoplasia, micrognathia, external ear
  and middle-ear ossicle malformation) with preaxial upper-limb defects
  (hypoplastic or absent thumbs, radial hypoplasia). Roughly 60% of cases are
  caused by haploinsufficiency of SF3B4, which encodes SAP49, a component of the
  U2 subunit of the major spliceosome. The central mechanistic puzzle of the
  disease is why loss of one copy of a ubiquitous core splicing factor produces a
  defect confined to cranial neural crest and its derivatives; the disease is
  therefore curated as a spliceosomopathy whose selectivity, not whose
  biochemistry, is the open question. The neonatal course is dominated by
  airway obstruction from micrognathia, glossoptosis and trismus.
category: Congenital
parents:
- Acrofacial dysostosis
- Mandibulofacial dysostosis
- Spliceosomopathy
synonyms:
- Nager syndrome
- AFD1
- acrofacial dysostosis 1, Nager type
- mandibulofacial dysostosis with preaxial limb anomalies
- preaxial mandibulofacial dysostosis

inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Most SF3B4 variants are frameshifts acting through haploinsufficiency, and
    most cases are sporadic de novo events; vertical transmission from an
    affected parent is documented.
  evidence:
  - reference: PMID:40126363
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Most cases are sporadic, and both autosomal-dominant and autosomal-recessive inheritances have been reported"
    explanation: States the inheritance patterns reported for the syndrome.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >-
    Roughly 100 cases reported worldwide as of 2025; no population-based rate
    estimate exists, so the class is assigned from the case count rather than
    from a measured rate.
  evidence:
  - reference: PMID:40126363
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Nager syndrome is a rare disorder, with approximately 100 reported cases ever, worldwide."
    explanation: Gives the total reported case count that this record summarizes.
pathophysiology:
- name: SF3B4 Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    Heterozygous SF3B4 variants — nearly all frameshifts predicted to encode
    truncated protein — reduce the dose of SAP49, the U2 snRNP component that
    binds upstream of the intronic branch point and helps tether U2 to the
    pre-mRNA. Roughly 60% of Nager syndrome is explained this way; the remaining
    40% has no identified cause. The same gene, with more severe alleles, causes
    Rodriguez syndrome.
  genes:
  - preferred_term: SF3B4
    term:
      id: hgnc:10771
      label: SF3B4
  biological_processes:
  - preferred_term: U2 snRNP tethering to the pre-mRNA branch point
    modifier: DECREASED
    term:
      id: GO:0000387
      label: spliceosomal snRNP assembly
  evidence:
  - reference: PMID:22541558
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After Sanger sequencing of SF3B4 in a validation cohort, 20 of 35 (57%) families affected by Nager syndrome had 1 of 18 different mutations, nearly all of which were frameshifts."
    explanation: The discovery cohort establishing the mutation spectrum and its frameshift character.
  - reference: PMID:22541558
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results suggest that most cases of Nager syndrome are caused by haploinsufficiency of SF3B4."
    explanation: States the dosage mechanism this node asserts.
  downstream:
  - target: Aberrant Pre-mRNA Splicing and Exon Skipping
    description: >-
      Reduced U2 snRNP branch-point tethering degrades splice-site recognition,
      which surfaces first as skipped exons rather than as global splicing
      failure.
    evidence:
    - reference: PMID:40126363
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Temporal RNA-sequencing analyses of mutant embryos identified an increase in exon-skipping events, followed by important transcriptional changes associated with an enrichment for terms consistent with defects in NC cell migration and survival."
      explanation: Supplies the ordering — splicing change first, transcriptional dysregulation after — from the frog mutant time course.
- name: Aberrant Pre-mRNA Splicing and Exon Skipping
  biological_scale: MOLECULAR
  description: >-
    Loss of SF3B4 dose does not abolish splicing. It shifts splice-site choice,
    producing an excess of transcripts with atypically skipped exons, and only
    afterwards a broad dysregulation of gene expression enriched for splicing,
    apoptosis, cell cycle and neural crest migration. This two-step course is
    what turns a housekeeping defect into a developmental one.
  biological_processes:
  - preferred_term: mRNA splicing, via spliceosome
    modifier: ABNORMAL
    term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
  evidence:
  - reference: PMID:40126363
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "GO analysis of differentially expressed genes in sf3b4 Null embryos revealed an enrichment in terms pertaining to mRNA splicing, apoptosis, cell cycle and NC cell migration."
    explanation: Names the processes the downstream transcriptional change converges on.
  downstream:
  - target: Cranial Neural Crest Migration Failure and Apoptosis
    description: >-
      The transcriptional consequences of mis-splicing fall on migration and
      survival programmes, and the cranial neural crest is the lineage in which
      that shows.
    evidence:
    - reference: PMID:40126363
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "NC cell migration is disrupted at the tailbud stage, and coupled with an increase in apoptosis in the head region, a phenotype that is much more pronounced in Null than in Het animals."
      explanation: Establishes the edge from the splicing lesion to the two cellular failures.
- name: Cranial Neural Crest Migration Failure and Apoptosis
  biological_scale: CELLULAR
  description: >-
    Neural crest is induced normally — pre-migratory markers are unaffected — and
    the defect appears at the migratory stage: cranial crest streams entering the
    branchial arches are shortened, and apoptosis rises in the head region. This
    is the step that makes the disease craniofacial rather than global, and the
    intact induction is as informative as the failed migration.
  cell_types:
  - preferred_term: migratory cranial neural crest cell
    term:
      id: CL:0000333
      label: migratory neural crest cell
  biological_processes:
  - preferred_term: neural crest cell migration
    modifier: DECREASED
    term:
      id: GO:0001755
      label: neural crest cell migration
  - preferred_term: apoptotic process
    modifier: INCREASED
    term:
      id: GO:0006915
      label: apoptotic process
  locations:
  - preferred_term: branchial arch
    term:
      id: UBERON:0002539
      label: pharyngeal arch
  evidence:
  - reference: PMID:40126363
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We show that in the absence of Sf3b4 function NC induction is not affected."
    explanation: The negative half of the result, which localizes the defect to migration rather than specification.
  - reference: PMID:40126363
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Quantification of the phenotype showed a statistically significant reduction of the NC stream length (streams 2 and 3 for sox10, and streams 3 and 4 for sox9) in Het and Null embryos compared to WT siblings"
    explanation: Quantifies the shortened cranial crest streams.
  - reference: PMID:40126363
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "at the migratory stage (NF stage 25), there was a significant increase in apoptosis in the head region of Het and Null embryos, with a greater number of TUNEL-positive cells in the Null compared to the Het animals"
    explanation: Quantifies the apoptotic component and its dose dependence.
  downstream:
  - target: First and Second Branchial Arch Skeletal Hypoplasia
    description: >-
      Fewer crest cells reaching the arches, and fewer surviving there, leaves
      too little mesenchyme to build the arch-derived skeleton.
    evidence:
    - reference: PMID:40126363
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Homozygous deletion of sf3b4 is detrimental to the development of cranial neural crest (NC)-derived cartilage progenitors."
      explanation: Connects the migration and survival failure to the loss of the cartilage progenitor pool.
- name: First and Second Branchial Arch Skeletal Hypoplasia
  biological_scale: TISSUE
  description: >-
    The craniofacial structures affected in Nager syndrome — mandible, malar
    complex, external ear and middle-ear ossicles — are first- and
    second-branchial-arch derivatives built from cranial neural crest. Their
    hypoplasia is the anatomical substrate of both the facial appearance and the
    neonatal airway compromise.
  biological_processes:
  - preferred_term: embryonic cranial skeleton morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0048701
      label: embryonic cranial skeleton morphogenesis
  - preferred_term: chondrocyte differentiation
    modifier: DECREASED
    term:
      id: GO:0002062
      label: chondrocyte differentiation
  locations:
  - preferred_term: mandible
    term:
      id: UBERON:0001684
      label: mandible
  evidence:
  - reference: PMID:40126363
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The craniofacial structures affected in Nager syndrome are primarily derived from the first and second branchial arches"
    explanation: Identifies the developmental origin of the affected structures.
  - reference: PMID:40126363
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The craniofacial skeletal structures affected in Nager syndrome are neural crest (NC)-derived."
    explanation: Establishes the lineage that links the cellular node to the anatomical one.
  downstream:
  - target: Micrognathia
    description: Mandibular hypoplasia is the first-arch component of the arch skeletal defect.
    evidence:
    - reference: PMID:40126363
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Individuals with Nager syndrome specifically present with downslanting palpebral fissures, midface retrusion, micrognathia, defective middle ear ossicles, and hypoplastic or absent thumbs"
      explanation: Lists micrognathia among the defining features of the syndrome.
  - target: Neonatal upper airway obstruction
    description: >-
      Micrognathia displaces the tongue base and, with trismus, obstructs the
      neonatal airway.
    evidence:
    - reference: PMID:18947886
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Trismus and glossoptosis from mandibular abnormalities predisposes infants to life-threatening respiratory distress."
      explanation: States the mechanical route from mandibular hypoplasia to airway compromise.
  - target: Conductive hearing impairment
    description: >-
      Middle-ear ossicles are second-arch derivatives, so their malformation
      produces conductive rather than sensorineural loss.
    evidence:
    - reference: PMID:40126363
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Individuals with Nager syndrome specifically present with downslanting palpebral fissures, midface retrusion, micrognathia, defective middle ear ossicles, and hypoplastic or absent thumbs"
      explanation: Lists defective middle ear ossicles among the defining features.

classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    notes: >-
      Primary progressive aphasia is a focal cortical neurodegenerative syndrome
      presenting with insidious, initially isolated dissolution of language.
    evidence:
    - reference: PMID:19300609
      reference_title: "A review on primary progressive aphasia."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Primary progressive aphasia (PPA) is a neurodegenerative disease of
        insidious onset presenting with progressive isolated loss of language
        function, without significant impairment in other cognitive domains.
      explanation: >-
        Establishes primary progressive aphasia as a neurodegenerative language
        disorder belonging to neurologic medicine.
  mechanistic_category:
  - classification_value: proteotoxic disease
    notes: >-
      Syndromic PPA arises from heterogeneous underlying proteinopathies across
      its clinical variants, predominantly TDP-43 proteinopathy in semantic
      variant PPA, tauopathy in nonfluent/agrammatic PPA, and Alzheimer disease
      amyloid-tau pathology in logopenic PPA.
    evidence:
    - reference: DOI:10.1136/jnnp-2023-332862
      reference_title: "Clinicoradiological and neuropathological evaluation of primary progressive aphasia"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Three PPA variants correlate with distinct underlying pathologies:
        semantic variant PPA (svPPA) with transactive response DNA-binding
        protein of 43 kD (TDP-43) proteinopathy, agrammatic variant PPA (agPPA)
        with tau deposition and logopenic variant PPA (lvPPA) with Alzheimer’s
        disease (AD).
      explanation: >-
        Autopsy series of 82 PPA patients links the three canonical clinical
        variants to TDP-43, tau, and Alzheimer proteinopathies, placing the
        syndrome under proteotoxic disease rather than a single proteinopathy
        class.
description: >-
  Primary progressive aphasia is a neurodegenerative syndrome in which language
  impairment is the dominant and earliest clinical deficit, remaining isolated
  for at least the initial two years before wider cognitive or behavioral
  involvement emerges. Three canonical clinical variants—nonfluent/agrammatic,
  semantic, and logopenic—reflect asymmetric degeneration of left-hemisphere
  frontoinsular, anterior temporal, and temporoparietal language cortices and
  their connecting dorsal and ventral white matter tracts, driven most commonly
  by frontotemporal lobar degeneration (tau or TDP-43) or atypical Alzheimer
  disease pathology.

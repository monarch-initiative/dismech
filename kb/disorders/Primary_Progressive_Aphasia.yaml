notes: >
  MONDO:0011842, "GRN-related frontotemporal lobar degeneration with Tdp43
  inclusions", is listed by MONDO as a child of this entry's own disease_term
  MONDO:0019806, and is the gene-defined subtype a knowledge-graph comparison
  expects under this parent. It is not curated here. Its own MONDO definition
  opens "A
  frontotemporal dementia characterized by variable phenotypic expression
  typically including social, behavioral, or language deterioration", so the
  concept is a gene-and-pathology-defined frontotemporal dementia whose
  presentation is variable and typically behavioural, not a variant of
  progressive aphasia. MONDO itself gives it two parents, frontotemporal
  dementia (MONDO:0017276) as well as this entry, and the mechanism is already
  modelled at kb/disorders/Frontotemporal_Dementia.yaml, where GRN is a wired
  causal gene. The subtype row is therefore curated there, not here.

  This entry's genetic records are deliberately left unwired to the pathograph
  and carry case fractions instead. The one cohort that screened the three major
  FTD genes in PPA specifically (PMID:25765123, 100 patients) found GRN in 3 and
  C9ORF72 in 2, MAPT in none, for an overall molecular yield of 5%. PPA is a
  clinical syndrome that is mostly sporadic, and the molecular cascades these
  genes act through are modelled at the FTD entry rather than duplicated here.
  The single pathophysiology node in this entry is at the level of a brain
  network and names no molecular function for a gene edge to land on, so wiring
  a gene to it would state that a gene product acts on a network without saying
  what activity is lost. C9ORF72 is not yet a genetic record here even though
  the same cohort found it in 2 of 100 patients; that is a gap, not a decision.

  Two of the three variant rows are deliberately left without a subtype_term.
  The logopenic row is bound to MONDO:0016644, a direct child of this entry's
  term and bound nowhere else in the knowledge base. The semantic variant is
  MONDO:0010857, which is the disease_term of
  kb/disorders/Semantic_Dementia.yaml, and the nonfluent/agrammatic variant is
  MONDO:0015059, already a has_subtypes row on
  kb/disorders/Frontotemporal_Dementia.yaml; binding either here would give one
  concept a third home rather than curating anything.

  A structural problem in MONDO's own hierarchy below this entry's term.
  MONDO:0019806 has exactly two children, MONDO:0016644
  (logopenic) and MONDO:0011842 (GRN-related FTLD-TDP). The other two canonical
  PPA variants are reached only through MONDO:0011842: MONDO:0015059 progressive
  non-fluent aphasia has parents MONDO:0011842 and "movement disorder", and
  MONDO:0010857 semantic dementia has parents MONDO:0015059 and MONDO:0017160
  behavioral variant of frontotemporal dementia. So MONDO makes the
  nonfluent/agrammatic variant a subclass of a GRN-defined disease, and the
  semantic variant a subclass of both the nonfluent variant and the behavioural
  variant. Under the international consensus criteria the three PPA variants are
  siblings and bvFTD is a separate syndrome, so none of those three edges is a
  subtype relationship. The one gene-to-variant statement available here points
  the other way: PMID:26473392 reports that GRN carriers were more likely to
  present with non-fluent aphasia, which makes GRN a cause of one variant rather
  than the parent class of two.

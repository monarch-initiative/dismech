pathophysiology:
- name: Progressive Language Network Degeneration
  description: >-
    Neurodegenerative processes selectively affect language networks, leading to
    progressive loss of language function with initial sparing of other domains.
  evidence:
  - reference: PMID:19300609
    reference_title: "A review on primary progressive aphasia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Primary progressive aphasia (PPA) is a neurodegenerative disease of
      insidious onset presenting with progressive isolated loss of language function,
      without significant impairment in other cognitive domains."
    explanation: The abstract describes progressive, isolated language loss as
      the core neurodegenerative process.
  downstream:
  - target: Aphasia
    causal_link_type: DIRECT
    description: >-
      Degeneration of the language network is what produces the progressive,
      initially isolated loss of language function that defines the syndrome;
      the isolation of the deficit is what distinguishes it from the other
      frontotemporal dementia syndromes at onset.
    evidence:
    - reference: PMID:19300609
      reference_title: "A review on primary progressive aphasia."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Primary progressive aphasia (PPA) is a neurodegenerative disease of
        insidious onset presenting with progressive isolated loss of language
        function, without significant impairment in other cognitive domains.
      explanation: >-
        Places the neurodegenerative process upstream of the loss of language
        function, which is this edge. Evidence source is OTHER because the
        publication is a review.
  - target: Atypical Behavior
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Degeneration spreads beyond the language network as the disease progresses, recruiting behaviour, executive function and judgment.
    description: >-
      Behavioural involvement is a later consequence of the same degenerative
      process rather than a parallel one: the diagnostic criteria require
      language to remain isolated for at least two years, and behaviour is named
      among the domains the disease progresses into. The edge is marked indirect
      because the entry does not model that spread as a node of its own.
    evidence:
    - reference: PMID:19300609
      reference_title: "A review on primary progressive aphasia."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Current diagnostic criteria require the language dysfunction to remain
        isolated for at least two years, and to remain the salient feature as
        the disease progresses, usually to involve other domains such as
        behavior, executive functions, and judgment.
      explanation: >-
        Supplies both the direction of this edge and the delay recorded as its
        intermediate mechanism. Evidence source is OTHER because the publication
        is a review.

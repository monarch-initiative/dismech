genetic:
- name: MAPT
  gene_term:
    preferred_term: MAPT
    term:
      id: hgnc:6893
      label: MAPT
  association: Established frontotemporal lobar degeneration gene; not detected in
    the one PPA-specific screening cohort cited here
  review_notes: >-
    An established frontotemporal lobar degeneration gene that this entry does
    not treat as an established cause of the aphasia syndrome, and
    relationship_type is deliberately left unset rather than asserting either
    reading. The one cohort cited here that screened MAPT in PPA specifically
    did not detect it in any of 100 patients, and the sourced
    genotype-phenotype statement at kb/disorders/Frontotemporal_Dementia.yaml
    places MAPT with the behavioural variant rather than with aphasia. Absence
    in one cohort bounds the frequency rather than excluding causation: the
    authors state their series is limited by an over-representation of
    logopenic PPA, and MAPT-associated tauopathy presenting as nonfluent
    aphasia is reported elsewhere. The review snippet below names tau mutations
    in a paragraph about the FTD spectrum, not about PPA probands, which is why
    it is not enough on its own either.
  evidence:
  - reference: PMID:19300609
    reference_title: "A review on primary progressive aphasia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Pathogenic mutations in genes coding for the proteins tau and progranulin
      have been isolated."
    explanation: The abstract cites pathogenic mutations in the tau gene (MAPT).
  - reference: PMID:25765123
    reference_title: "Dominant frontotemporal dementia mutations in 140 cases of primary progressive aphasia and speech apraxia."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In comparison, 36% of the PPA patients had a family history and 5 (5%) had a genetic mutation detected: MAPT (n = 0), GRN (n = 3) and C9ORF72 (n = 2)."
    explanation: >-
      MAPT was not detected in any of the 100 PPA patients screened, while the
      other two genes were, which is why this record's association text and
      review_notes stop short of calling MAPT a cause of this syndrome. Graded
      REFUTE against that specific claim and not against MAPT causing aphasia at
      all: a null result in one series of this size bounds how common the gene
      can be in PPA rather than excluding it, and the review_notes records the
      cohort's stated limitation.
- name: GRN
  gene_term:
    preferred_term: GRN
    term:
      id: hgnc:4601
      label: GRN
  association: Causative; the only one of the three major FTD genes attributed to
    a PPA presentation by a cohort screened here
  relationship_type: CAUSATIVE
  review_notes: >-
    Bound but deliberately not wired into this entry's pathograph, and the
    reason is specific rather than general. Progranulin has no molecular
    function that the sources cited here state: the mechanism is
    haploinsufficiency of a secreted protein producing lysosomal abnormalities,
    microglial loss of homeostatic signature and cytoplasmic TDP-43
    aggregation, which is a cellular phenotype rather than a lost catalytic or
    binding activity. Binding a molecular-function term on that basis would read
    as sourced when it is inferred from the protein's name. The cascade itself
    is modelled at kb/disorders/Frontotemporal_Dementia.yaml, where GRN is a
    wired causal gene, and MONDO:0011842 is curated there as the gene-defined
    subtype row.
  case_fractions:
  - population: Primary progressive aphasia cohort of 100 patients (54 logopenic, 17 nonfluent/agrammatic, 16 semantic, 13 unclassifiable)
    case_fraction_percent: 3.0
    cohort_size: 100
    notes: >-
      GRN variants in 3 of 100 PPA patients screened for MAPT, GRN and C9ORF72;
      the overall molecular yield in that cohort was 5%. The paper does not
      report which PPA variant the three GRN carriers had.
    evidence:
    - reference: PMID:25765123
      reference_title: "Dominant frontotemporal dementia mutations in 140 cases of primary progressive aphasia and speech apraxia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In comparison, 36% of the PPA patients had a family history and 5 (5%) had a genetic mutation detected: MAPT (n = 0), GRN (n = 3) and C9ORF72 (n = 2)."
      explanation: >-
        Quantifies the GRN share of this PPA cohort, the figure recorded by this
        case fraction.
    - reference: PMID:25765123
      reference_title: "Dominant frontotemporal dementia mutations in 140 cases of primary progressive aphasia and speech apraxia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        we also assessed these mutations in 100 patients with primary
        progressive aphasia (PPA), including logopenic PPA (n = 54),
        nonfluent/agrammatic PPA (n = 17), semantic PPA (n = 16), and
        unclassifiable PPA (n = 13)
      explanation: >-
        Source for the cohort size and variant composition recorded as this case
        fraction's population.
  evidence:
  - reference: PMID:19300609
    reference_title: "A review on primary progressive aphasia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Pathogenic mutations in genes coding for the proteins tau and progranulin
      have been isolated."
    explanation: The abstract cites pathogenic mutations in the progranulin gene
      (GRN).
  - reference: PMID:38347588
    reference_title: "Progranulin haploinsufficiency mediates cytoplasmic TDP-43 aggregation with lysosomal abnormalities in human microglia."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Progranulin (PGRN) haploinsufficiency due to progranulin gene (GRN) variants can cause frontotemporal dementia (FTD) with aberrant TAR DNA-binding protein 43 (TDP-43) accumulation."
    explanation: >-
      States the mechanism by which GRN variants act - haploinsufficiency with
      TDP-43 accumulation - which is the claim the review_notes relies on when
      explaining why no molecular function is bound. The quoted sentence is the
      BACKGROUND paragraph of this publication's structured abstract and states
      the human genetic picture, so evidence_source is HUMAN_CLINICAL with
      quote_role BACKGROUND; the publication's own results are the cultured
      microglia experiments.

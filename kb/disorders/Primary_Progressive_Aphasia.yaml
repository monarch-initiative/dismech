    term:
      id: UBERON:0002998
      label: inferior frontal gyrus
  - preferred_term: left superior temporal gyrus
    term:
      id: UBERON:0002769
      label: superior temporal gyrus
  evidence:
  - reference: PMID:21666264
    reference_title: "White matter damage in primary progressive aphasias: a diffusion tensor tractography study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These clinical entities have been associated with characteristic patterns
      of focal grey matter atrophy in left posterior frontoinsular, anterior
      temporal and left temporoparietal regions, respectively.
    explanation: >-
      Identifies the variant-specific focal gray matter atrophy patterns in
      left-hemisphere language cortices.
  - reference: PMID:33085292
    reference_title: Primary Progressive Aphasia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In PPA, neuroanatomical changes primarily affect brain regions associated
      with language processing. The specific areas vary depending on the PPA
      subtype, but commonly involved brain regions affect left-hemisphere
      language functions.
    explanation: >-
      Confirms selective involvement of left-hemisphere language-processing
      cortical regions across PPA subtypes.
  downstream:
  - target: Dorsal and Ventral White Matter Language Tract Disconnection
    causal_link_type: DIRECT
    description: >-
      Focal cortical neuronal degeneration is accompanied by axonal degeneration
      along the dorsal (superior longitudinal fasciculus) and ventral (inferior
      longitudinal and uncinate fasciculi) language pathways.
    evidence:
    - reference: PMID:21666264
      reference_title: "White matter damage in primary progressive aphasias: a diffusion tensor tractography study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The most prominent white matter changes were found in the dorsal
        pathways in non-fluent patients, in the two ventral pathways and the
        temporal components of the dorsal pathways in semantic variant, and in
        the temporoparietal component of the dorsal bundles in logopenic
        patients.
      explanation: >-
        Diffusion tensor tractography demonstrates tract-specific white matter
        degeneration matching the focal cortical atrophy topography of each PPA
        variant.
  - target: Progressive Language Network Degeneration
    causal_link_type: DIRECT
    description: >-
      Focal left-hemisphere cortical atrophy and synaptic loss directly degrade
      regional metabolic activity and function across the distributed language
      network.
    evidence:
    - reference: DOI:10.1007/s12149-024-01958-w
      reference_title: "FDG-PET in the diagnosis of primary progressive aphasia: a systematic review"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The three PPA subtypes show distinct regions of hypometabolism in
        FDG-PET imaging with SD in the anterior temporal lobes, LPA in the left
        temporo-parietal junction, and nonfluent/agrammatic Variant PPA (nfvPPA)
        in the left inferior frontal gyrus and insula.
      explanation: >-
        Demonstrates regional cortical hypometabolism across the canonical
        language network hubs corresponding to each PPA variant.
- name: Dorsal and Ventral White Matter Language Tract Disconnection
  biological_scale: TISSUE
  description: >-
    Microstructural degeneration of major perisylvian and temporoparietal white
    matter tracts—including the superior longitudinal fasciculus (dorsal
    stream) and the inferior longitudinal and uncinate fasciculi (ventral
    stream)—disconnects frontal, insular, temporal, and parietal language nodes.
  locations:
  - preferred_term: cerebral hemisphere white matter
    term:
      id: UBERON:0002437
      label: cerebral hemisphere white matter
  evidence:
  - reference: PMID:21666264
    reference_title: "White matter damage in primary progressive aphasias: a diffusion tensor tractography study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most prominent white matter changes were found in the dorsal pathways
      in non-fluent patients, in the two ventral pathways and the temporal
      components of the dorsal pathways in semantic variant, and in the
      temporoparietal component of the dorsal bundles in logopenic patients.
    explanation: >-
      Probabilistic tractography in 48 participants establishes selective
      dorsal and ventral white matter pathway damage across the three PPA
      variants.
  downstream:
  - target: Progressive Language Network Degeneration
    causal_link_type: DIRECT
    description: >-
      Structural disconnection of dorsal and ventral white matter bundles
      correlates directly with impaired lexical retrieval and compounds cortical
      atrophy to produce network-level language dysfunction.
    evidence:
    - reference: DOI:10.3389/fneur.2013.00212
      reference_title: "White Matter Disease Correlates with Lexical Retrieval Deficits in Primary Progressive Aphasia"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We found widespread FA reductions in WM for both variants of PPA. FA was
        related to both confrontation naming and category naming ﬂuency
        performance in left uncinate fasciculus and corpus callosum in svPPA and
        left superior and inferior longitudinal fasciculi in lvPPA.
      explanation: >-
        Tract-specific diffusion tensor imaging directly links white matter
        fractional anisotropy reductions in ventral (uncinate) and dorsal
        (superior/inferior longitudinal) fasciculi to impaired lexical retrieval
        across PPA variants.
    - reference: PMID:34266501
      reference_title: "Language training for oral and written naming impairment in primary progressive aphasia: a review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        From the neuroimaging perspective, this disability is characterized by
        the left inferior fronto-insular atrophy and the involvement of
        white-matter fiber bundle in the dorsal language pathway [3, 9–11].
      explanation: >-
        Connects dorsal white-matter bundle involvement alongside fronto-insular
        atrophy to the clinical language disability of nonfluent/agrammatic PPA.
- name: Progressive Language Network Degeneration
  biological_scale: TISSUE
  description: >-
    Neurodegenerative processes selectively affect language networks, producing
    regional cortical FDG-PET hypometabolism (represented functionally by
    decreased cortical glucose metabolism) and progressive loss of language
    comprehension, word retrieval, sentence repetition, and grammar/speech
    production with initial sparing of non-language cognitive domains.
  notes: >-
    Decreased GO:0006006 (glucose metabolic process) serves as the metabolic
    process proxy for the variant-specific regional 18F-FDG-PET cortical
    hypometabolism observed across language network hubs.
  biological_processes:
  - preferred_term: glucose metabolic process
    term:
      id: GO:0006006
      label: glucose metabolic process
    modifier: DECREASED
  locations:
  - preferred_term: frontal cortex
    term:
      id: UBERON:0001870
      label: frontal cortex
  - preferred_term: temporal lobe
    term:
      id: UBERON:0001871
      label: temporal lobe
  evidence:
  - reference: PMID:19300609
    reference_title: "A review on primary progressive aphasia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Primary progressive aphasia (PPA) is a neurodegenerative disease of
      insidious onset presenting with progressive isolated loss of language function,
      without significant impairment in other cognitive domains."
    explanation: The abstract describes progressive, isolated language loss as
      the core neurodegenerative process.
  - reference: DOI:10.1007/s12149-024-01958-w
    reference_title: "FDG-PET in the diagnosis of primary progressive aphasia: a systematic review"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The three PPA subtypes show distinct regions of hypometabolism in FDG-PET
      imaging with SD in the anterior temporal lobes, LPA in the left
      temporo-parietal junction, and nonfluent/agrammatic Variant PPA (nfvPPA)
      in the left inferior frontal gyrus and insula.
    explanation: >-
      Demonstrates variant-specific regional hypometabolism within the
      left-hemisphere language network.
  downstream:
  - target: Aphasia
    causal_link_type: DIRECT
    description: >-
      Degeneration of the language network is what produces the progressive,
      initially isolated loss of language function that defines the syndrome;
      the isolation of the deficit is what distinguishes it from the other
      frontotemporal dementia syndromes at onset.
    evidence:
    - reference: PMID:19300609
      reference_title: "A review on primary progressive aphasia."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Primary progressive aphasia (PPA) is a neurodegenerative disease of
        insidious onset presenting with progressive isolated loss of language
        function, without significant impairment in other cognitive domains.
      explanation: >-
        Places the neurodegenerative process upstream of the loss of language
        function, which is this edge. Evidence source is OTHER because the
        publication is a review.
  - target: Anomia
    causal_link_type: DIRECT
    description: >-
      Disruption of left-hemisphere lexical-semantic and phonological retrieval
      networks produces early, persistent naming impairment across all three
      canonical PPA variants.
    evidence:
    - reference: PMID:34266501
      reference_title: "Language training for oral and written naming impairment in primary progressive aphasia: a review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Primary progressive aphasia (PPA) is a neurodegenerative disorder
        characterized by a gradual, insidious and progressive loss of language
        abilities, with naming difficulties being an early and persistent
        impairment common to all three variants.
      explanation: >-
        Establishes progressive naming difficulty (anomia) as a direct, shared
        consequence of language-network neurodegeneration across all three PPA
        variants.
  - target: Agrammatism and Effortful Speech
    causal_link_type: DIRECT
    description: >-
      Degeneration of the left posterior frontoinsular cortex and dorsal language
      stream in nonfluent/agrammatic PPA impairs syntactic encoding and speech
      fluency, producing agrammatism and effortful, halting speech.
    evidence:
    - reference: PMID:34266501
      reference_title: "Language training for oral and written naming impairment in primary progressive aphasia: a review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        nf/avPPA has main clinical features of agrammatism in language
        production and/or effortful halting speech [6].
      explanation: >-
        Identifies agrammatism in language production and effortful halting
        speech as the core language-network manifestations of
        nonfluent/agrammatic PPA.
  - target: Impaired Single-Word Comprehension
    causal_link_type: DIRECT
    description: >-
      Anterior temporal language-network degeneration in semantic variant PPA
      erodes lexical-semantic representations, causing progressive single-word
      comprehension loss.
    evidence:
    - reference: PMID:34266501
      reference_title: "Language training for oral and written naming impairment in primary progressive aphasia: a review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        svPPA is clinically characterized by a slow loss of semantic knowledge
        ... anomia, and single-word comprehension deficits, especially for
        low-frequency items
      explanation: >-
        Links semantic variant PPA directly to progressive loss of semantic
        knowledge and single-word comprehension deficits.
  - target: Surface Dyslexia
    causal_link_type: DIRECT
    description: >-
      Loss of irregular-word lexical-semantic representations in semantic variant
      PPA forces reliance on sublexical phonological decoding, producing surface
      dyslexia.
    evidence:
    - reference: PMID:34266501
      reference_title: "Language training for oral and written naming impairment in primary progressive aphasia: a review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Patients with svPPA are fluent in spontaneous speech and word repetition
        is spared, although they can exhibit surface dyslexia and dysgraphia
        [3, 6, 12].
      explanation: >-
        Documents surface dyslexia as a characteristic written-language
        manifestation of semantic variant PPA.
  - target: Impaired Sentence Repetition
    causal_link_type: DIRECT
    description: >-
      Degeneration of the left posterior temporoparietal phonological loop in
      logopenic variant PPA impairs phonological short-term memory, causing
      deficits in sentence and phrase repetition alongside word-retrieval pauses.
    evidence:
    - reference: PMID:34266501
      reference_title: "Language training for oral and written naming impairment in primary progressive aphasia: a review."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        l/phvPPA has core features of deficits in word retrieval and sentence
        repetition [6].
      explanation: >-
        Establishes impaired sentence repetition and word retrieval as the core
        clinical consequences of logopenic variant PPA.
  - target: Speech Apraxia
    causal_link_type: DIRECT
    description: >-
      Involvement of left posterior frontoinsular speech-motor planning regions
      in agrammatic/nonfluent PPA (especially 4R-tauopathy cases) produces
      concurrent apraxia of speech.
    evidence:
    - reference: DOI:10.1136/jnnp-2023-332862
      reference_title: "Clinicoradiological and neuropathological evaluation of primary progressive aphasia"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Apraxia of speech was associated with 4R-tauopathy in agPPA, while pure
        agrammatic PPA without apraxia was linked to 3R-tauopathy.
      explanation: >-
        Documents apraxia of speech as a direct clinical manifestation of
        agrammatic/nonfluent PPA driven by 4R-tauopathy.
  - target: Atypical Behavior
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Degeneration spreads beyond the language network as the disease progresses, recruiting behaviour, executive function and judgment.
    description: >-
      Behavioural involvement is a later consequence of the same degenerative
      process rather than a parallel one: the diagnostic criteria require
      language to remain isolated for at least two years, and behaviour is named
      among the domains the disease progresses into. The edge is marked indirect
      because the entry does not model that spread as a node of its own.
    evidence:
    - reference: PMID:19300609
      reference_title: "A review on primary progressive aphasia."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Current diagnostic criteria require the language dysfunction to remain
        isolated for at least two years, and to remain the salient feature as
        the disease progresses, usually to involve other domains such as
        behavior, executive functions, and judgment.
      explanation: >-
        Supplies both the direction of this edge and the delay recorded as its
        intermediate mechanism. Evidence source is OTHER because the publication
        is a review.

pathophysiology:
- name: Cortical Proteinopathy Accumulation in Language Regions
  biological_scale: MOLECULAR
  description: >-
    Misfolded pathogenic proteins—most commonly TDP-43 in semantic variant PPA,
    hyperphosphorylated tau in nonfluent/agrammatic PPA, or Alzheimer disease
    amyloid-beta and tau pathology in logopenic PPA—accumulate within left-hemisphere
    language-associated cortical regions.

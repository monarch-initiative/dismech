  evidence:
  - reference: DOI:10.1136/jnnp-2023-332862
    reference_title: "Clinicoradiological and neuropathological evaluation of primary progressive aphasia"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three PPA variants correlate with distinct underlying pathologies:
      semantic variant PPA (svPPA) with transactive response DNA-binding
      protein of 43 kD (TDP-43) proteinopathy, agrammatic variant PPA (agPPA)
      with tau deposition and logopenic variant PPA (lvPPA) with Alzheimer’s
      disease (AD).
    explanation: >-
      Neuropathological evaluation of 82 autopsied PPA patients establishes
      TDP-43, tau, and Alzheimer proteinopathies as the upstream molecular
      lesions across the three PPA variants.
  downstream:
  - target: Focal Left-Hemisphere Language Cortex Degeneration
    causal_link_type: DIRECT
    description: >-
      Cortical TDP-43, tau, or Alzheimer pathology drives asymmetric neuronal
      loss and focal cortical atrophy in left-hemisphere language regions.
    evidence:
    - reference: DOI:10.1136/jnnp-2023-332862
      reference_title: "Clinicoradiological and neuropathological evaluation of primary progressive aphasia"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        PPA variant distribution: 35 lvPPA (80% AD), 28 agPPA (89% tauopathy)
        and 18 svPPA (72% frontotemporal lobar degeneration-TAR DNA-binding
        protein (FTLD-TDP)).
      explanation: >-
        Connects the variant-specific molecular proteinopathies to the three
        anatomically defined cortical language-degeneration syndromes in
        autopsied patients.
- name: Focal Left-Hemisphere Language Cortex Degeneration
  biological_scale: TISSUE
  description: >-
    Asymmetric neuronal and synaptic degeneration produces focal gray matter
    atrophy in left-hemisphere language cortices, preferentially involving the
    left posterior frontoinsular cortex (including Broca area) in nonfluent/agrammatic
    PPA, the anterior temporal lobe in semantic PPA, and the left temporoparietal
    junction (including Wernicke area) in logopenic PPA.
  notes: >-
    GO:0008219 (cell death) is bound rather than GO:0051402 (neuron apoptotic
    process) because clinicopathological and neuroimaging studies establish
    cortical neuronal loss and atrophy without proving an apoptotic execution
    mechanism across PPA proteinopathies, and GO:0070997 (obsolete neuron death)
    is obsolete in Gene Ontology.
  cell_types:
  - preferred_term: cerebral cortex neuron
    term:
      id: CL:0010012
      label: cerebral cortex neuron
  biological_processes:
  - preferred_term: cell death
    term:
      id: GO:0008219
      label: cell death
    modifier: INCREASED
  - preferred_term: synapse organization
    term:
      id: GO:0050808
      label: synapse organization
    modifier: DECREASED

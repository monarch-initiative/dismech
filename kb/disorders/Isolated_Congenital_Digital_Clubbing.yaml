  evidence:
  - reference: PMID:18805827
    reference_title: "Mutation in the HPGD gene encoding NAD+ dependent 15-hydroxyprostaglandin dehydrogenase underlies isolated congenital nail clubbing (ICNC)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we investigated a large Pakistani family with 11 affected individuals having hereditary congenital nail clubbing as a single invariable clinical feature without any associated ectodermal, skeletal or systemic imperfection"
    explanation: >-
      Establishes congenital nail clubbing as the single invariable feature,
      present in every affected family member.

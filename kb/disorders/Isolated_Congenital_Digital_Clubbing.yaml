    explanation: Supports leaving toe involvement without a fixed frequency.
genetic:
- name: HPGD
  gene_term:
    preferred_term: HPGD
    term:
      id: hgnc:5154
      label: HPGD
  association: >-
    Homozygous HPGD c.577T>C (p.Ser193Pro) in one large consanguineous family
    with 11 affected members (two-point LOD 2.98, multipoint LOD 3.62).
  variant_origin: GERMLINE
  notes: >-
    relationship_type is left unset on purpose. The schema defines CAUSATIVE as a
    ClinGen Definitive or Strong relationship, and the isolated phenotype rests on
    a single family with no ClinGen gene-disease validity record (none found in
    cache/clingen/gene_validity.csv for HPGD). HPGD is also the PHO type 1 gene,
    where its causal role is replicated.
  variants:
  - name: c.577T>C (p.Ser193Pro)
    description: >-
      Missense variant in exon 6 of HPGD, homozygous in all affected members of
      the defining family. The same homozygous variant was later reported in a
      five-generation Pakistani family with full PHO, so it does not predict the
      isolated presentation.
    evidence:
    - reference: PMID:18805827
      reference_title: "Mutation in the HPGD gene encoding NAD+ dependent 15-hydroxyprostaglandin dehydrogenase underlies isolated congenital nail clubbing (ICNC)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "revealed a homozygous missense mutation (c.577T>C; p.S193P) in exon 6 of the human HPGD gene"
      explanation: The defining variant, with isolated clubbing.
    - reference: PMID:29282707
      reference_title: "A novel mutation in the HPGD gene causing primary hypertrophic osteoarthropathy with digital clubbing in a Pakistani family."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "revealed a novel homozygous missense mutation (c.577T˃C) of the human HPGD gene in all affected members of the family"
      explanation: >-
        The same allele homozygous in a family with PHO. The report calls the
        variant novel, although it is the c.577T>C allele reported for isolated
        clubbing in 2009; the quote is kept verbatim.
  evidence:
  - reference: PMID:18805827
    reference_title: "Mutation in the HPGD gene encoding NAD+ dependent 15-hydroxyprostaglandin dehydrogenase underlies isolated congenital nail clubbing (ICNC)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A maximum two point LOD score of 2.98 ( theta= 0.00) was obtained at marker D4S2368 while a maximum multipoint LOD score of 3.62 was obtained with several markers along the disease interval."
    explanation: Linkage strength behind the HPGD assignment, from a single family.
- name: SLCO2A1
  gene_term:
    preferred_term: SLCO2A1
    term:
      id: hgnc:10955
      label: SLCO2A1
  association: >-
    Locus heterogeneity. SLCO2A1 encodes the prostaglandin transporter that
    brings PGE2 into the cell for degradation by 15-PGDH. A biallelic missense
    variant in one Pakistani family, and a heterozygous stop variant in one
    individual, produced isolated nail clubbing; SLCO2A1 is otherwise the PHO
    type 2 gene.
  notes: >-
    MONDO's causal gene for MONDO:0007343 is HPGD only. The SLCO2A1 families are
    recorded here because the MONDO definition is gene-agnostic and these
    reports describe the same isolated phenotype. relationship_type is left
    unset for the same evidence-strength reason given for HPGD.
  evidence:
  - reference: PMID:36833358
    reference_title: "Homozygous Missense Variant in the Solute Carrier Organic Anion Transporter 2A1 (SLCO2A1) Gene Underlies Isolated Nail Clubbing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole exome sequencing data analysis revealed a novel biallelic sequence variant (c.155T>A; p.Phe52Tyr) in the SLCO2A1 gene."
    explanation: Biallelic SLCO2A1 variant in a family with isolated congenital nail clubbing.
  - reference: PMID:22331663
    reference_title: "Mutations in the prostaglandin transporter encoding gene SLCO2A1 cause primary hypertrophic osteoarthropathy and isolated digital clubbing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a third family, a heterozygous carrier of a stop mutation presents with isolated digital clubbing."
    explanation: A heterozygous SLCO2A1 stop variant presenting as isolated clubbing.
differential_diagnoses:
- name: Primary hypertrophic osteoarthropathy
  description: >-
    The allelic severe presentation of the same PGE2-clearance defect, caused by
    biallelic HPGD (type 1) or SLCO2A1 (type 2) variants. It is distinguished by
    periostosis, pachydermia and arthropathy; isolated clubbing is diagnosed only
    when these are absent. Curated in Primary_Hypertrophic_Osteoarthropathy.
  disease_term:
    preferred_term: primary hypertrophic osteoarthropathy
    term:
      id: MONDO:0016620
      label: primary hypertrophic osteoarthropathy
  evidence:
  - reference: PMID:22331663
    reference_title: "Mutations in the prostaglandin transporter encoding gene SLCO2A1 cause primary hypertrophic osteoarthropathy and isolated digital clubbing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Primary hypertrophic osteoarthropathy (PHO) is a rare hereditary disorder with variable digital clubbing as the most prominent feature, subperiosteal new bone formation, and arthropathy."
    explanation: Gives the skeletal and joint features whose absence defines the isolated form.
- name: Acquired (secondary) digital clubbing
  description: >-
    Clubbing secondary to an acquired disease. It is acquired rather than
    congenital and is accompanied by the underlying disease. A congenital,
    familial, stable presentation points to the inherited form and can spare a
    search for occult disease.
  evidence:
  - reference: PMID:22331663
    reference_title: "Mutations in the prostaglandin transporter encoding gene SLCO2A1 cause primary hypertrophic osteoarthropathy and isolated digital clubbing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Digital clubbing is usually secondary to different acquired diseases."
    explanation: Acquired causes account for most clubbing and must be excluded.
  - reference: PMID:18500342
    reference_title: "Mutations in 15-hydroxyprostaglandin dehydrogenase cause primary hypertrophic osteoarthropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Testing for HPGD mutations and biochemical testing for HPGD deficiency in patients with unexplained clubbing might help to obviate extensive searches for occult pathology."
    explanation: Supports genetic testing to separate inherited from acquired clubbing.
diagnosis:
- name: Clinical confirmation of clubbing
  description: >-
    Clubbing is confirmed by a phalangeal depth ratio above 1 (distal phalangeal
    depth exceeding interphalangeal depth) or by loss of the diamond-shaped
    window when the dorsal surfaces of opposing terminal phalanges are apposed
    (Schamroth sign). The inherited isolated form is then supported by congenital
    onset, family history and the absence of skeletal, skin and systemic disease.
  evidence:
  - reference: PMID:23243350
    reference_title: "Digital clubbing."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "A Phalangeal depth ratio of over 1 is indicative of clubbing."
    explanation: A quantitative bedside criterion for clubbing.
  - reference: PMID:23243350
    reference_title: "Digital clubbing."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In patients with clubbing, this diamond-shaped window gets obliterated."
    explanation: The Schamroth window sign.
- name: HPGD and SLCO2A1 genetic testing
  description: >-
    Sequencing of HPGD, with SLCO2A1 included because of locus heterogeneity,
    confirms the diagnosis. In PHO, urinary PGE-M is low in the HPGD form and
    high in the SLCO2A1 form; this pattern has not been validated for isolated
    clubbing, and the SLCO2A1 isolated-clubbing family had normal PGE2.
  evidence:
  - reference: PMID:36833358
    reference_title: "Homozygous Missense Variant in the Solute Carrier Organic Anion Transporter 2A1 (SLCO2A1) Gene Underlies Isolated Nail Clubbing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Mutations in two genes have been reported to cause isolated nail clubbing in humans, which are the SLCO2A1 gene and the HPGD gene."
    explanation: Names the two genes a molecular work-up should cover.
  - reference: PMID:31508314
    reference_title: "Safety and efficacy of cyclooxygenase-2 inhibition for treatment of primary hypertrophic osteoarthropathy: A single-arm intervention trial."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "For PHOAR1 patients, serum and urinary PGE-M levels were relatively low and demonstrated minimal response to COX-2 inhibition. Among PHOAR2 patients, mean serum and urinary levels of PGE-M presented at a high level at baseline"
    explanation: >-
      The PGE-M pattern that separates the HPGD and SLCO2A1 forms. INDIRECT
      because it was measured in PHO, not isolated clubbing.
  - reference: PMID:36833358
    reference_title: "Homozygous Missense Variant in the Solute Carrier Organic Anion Transporter 2A1 (SLCO2A1) Gene Underlies Isolated Nail Clubbing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biochemical tests were unremarkable (serum PGE2 (117 pg/mL) urinary PGE2 (131 pg/mL) (normal: 25–200 pg/mL)."
    explanation: >-
      Normal PGE2 in the SLCO2A1 isolated-clubbing family, which is why PGE2
      testing cannot exclude the diagnosis.
treatments:
- name: Reassurance and Genetic Counseling
  description: >-
    No specific treatment is established for isolated congenital clubbing.
    Management is to confirm the inherited, isolated nature of the clubbing,
    which avoids repeated searches for acquired causes, and to counsel on
    recurrence risk.
  notes: >-
    COX-2 inhibition with etoricoxib lowers PGE2 and improved clubbing in an
    uncontrolled PHO trial (PMID:31508314), but that trial had no
    isolated-clubbing subgroup and the treatment has not been studied in this
    disorder.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:18500342
    reference_title: "Mutations in 15-hydroxyprostaglandin dehydrogenase cause primary hypertrophic osteoarthropathy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Testing for HPGD mutations and biochemical testing for HPGD deficiency in patients with unexplained clubbing might help to obviate extensive searches for occult pathology."
    explanation: >-
      Supports the main management benefit, sparing a search for acquired
      causes once the inherited cause is shown. INDIRECT because it is a
      recommendation from a PHO study, not an outcome measured in isolated
      clubbing.
discussions:
- discussion_id: isolated_versus_pho_expressivity
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Chronic Prostaglandin E2 Excess
  - genetic#HPGD
  prompt: >-
    Why does homozygous HPGD c.577T>C produce isolated clubbing in one family
    and full primary hypertrophic osteoarthropathy in another?
  rationale: >-
    The entry's chain assumes that a smaller PGE2 excess restricts disease to the
    digits. No enzyme assay of the p.Ser193Pro protein is reported in the cited
    abstracts, and the urinary PGE2 measured in the isolated-clubbing family
    (indexed in MeSH but not reported in its abstract) could not be compared
    with the PHO family for this entry. Modifier genes, sex and age at
    examination are alternatives. The SLCO2A1 isolated-clubbing family with
    normal PGE2 shows that isolated clubbing does not always come with measurable
    PGE2 excess. Resolving this decides whether isolated clubbing is a stable
    entity or a mild presentation of PHO type 1.
  evidence:
  - reference: PMID:40140750
    reference_title: "Two cases of primary hypertrophic osteoarthropathy caused by HPGD variants: a case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Notably, the homozygous 577T > C variant exhibits variable penetrance linked to isolated clubbing or full PHO phenotypes"

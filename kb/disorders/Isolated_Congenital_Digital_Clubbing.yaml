name: Isolated Congenital Digital Clubbing
creation_date: "2026-10-23T15:00:00Z"
category: Mendelian
synonyms:
- isolated congenital nail clubbing
- ICNC
- isolated congenital acropachy
- hereditary isolated nail clubbing
description: >-
  Isolated congenital digital clubbing (isolated congenital nail clubbing, ICNC) is
  a rare inherited nail-bed disorder in which the terminal segments of the
  fingers, and usually the toes, are enlarged and carry thickened, curved nails
  from birth, with no skeletal, skin, cardiopulmonary or other systemic finding.
  The molecularly defined form is autosomal recessive and caused by a homozygous
  HPGD missense variant (c.577T>C, p.Ser193Pro) in a single large consanguineous
  Pakistani family with 11 affected members. HPGD encodes NAD(+)-dependent
  15-hydroxyprostaglandin dehydrogenase (15-PGDH), the enzyme that begins
  prostaglandin E2 (PGE2) inactivation.

  The disorder sits at the mild end of a prostaglandin-clearance spectrum whose
  severe end is primary hypertrophic osteoarthropathy (PHO). Biallelic HPGD loss
  causes PHO type 1, and the same homozygous c.577T>C allele was later found in
  a second Pakistani family with full PHO, so "isolated" describes a
  presentation rather than an allele class. SLCO2A1 variants, which impair PGE2
  uptake into the cell for degradation, also produce isolated nail clubbing:
  biallelic in one family and heterozygous in one individual. The working
  mechanism for the HPGD form is that chronic PGE2 excess drives
  connective-tissue proliferation between the nail matrix and the distal
  phalanx. That link is inferred from PHO and from clubbing biology; in the one
  SLCO2A1 isolated-clubbing family that was tested, serum and urinary PGE2 were
  within the normal range.
disease_term:
  preferred_term: isolated congenital digital clubbing
  term:
    id: MONDO:0007343
    label: isolated congenital digital clubbing
parents:
- inherited isolated nail anomaly
notes: >-
  Curated as its own Disease entry rather than as a subtype of
  Primary_Hypertrophic_Osteoarthropathy. MONDO places MONDO:0007343 under
  inherited isolated nail anomaly, not under primary hypertrophic
  osteoarthropathy (MONDO:0016620), and the entity is defined by the absence of
  periostosis, pachydermia and arthropathy. The shared PGE2-clearance mechanism
  and the allelic overlap with PHO type 1 are recorded in the description, the
  differential diagnosis and the knowledge-gap discussion. No GeneReviews chapter
  covers this disorder: `just check-genereviews` reports NO_CHAPTER against the
  2026-09-10 Bookshelf index, and the PubMed query "(digital clubbing OR
  hypertrophic osteoarthropathy) AND genereviews[book]" returned no record on
  2026-10-23.
inheritance:
- name: Autosomal recessive
  description: >-
    The HPGD form segregated as an autosomal recessive trait in a large
    consanguineous family in which all 11 affected members were homozygous for
    p.Ser193Pro. Autosomal dominant isolated digital clubbing is also described,
    but HPGD was excluded in the one dominant family tested, so dominant families
    are not attributed to HPGD. One heterozygous SLCO2A1 stop-variant carrier
    with isolated clubbing does not fit a strictly recessive model.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:18805827
    reference_title: "Mutation in the HPGD gene encoding NAD+ dependent 15-hydroxyprostaglandin dehydrogenase underlies isolated congenital nail clubbing (ICNC)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Isolated congenital nail clubbing (ICNC) is a rare autosomal recessive disorder characterised by enlargement of the terminal segments of fingers and toes with thickened nails"
    explanation: States the recessive inheritance of the disorder, from the background section of the gene-discovery report.
  - reference: PMID:19568269
    reference_title: "HPGD mutations cause cranioosteoarthropathy but not autosomal dominant digital clubbing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The failure to identify any mutation in a family with an autosomal dominant type of isolated digital clubbing suggests that HPGD is not the major gene for this condition."
    explanation: >-
      Supports restricting HPGD causality to the recessive form: a dominant
      isolated-clubbing family carried no HPGD variant.
pathophysiology:
- name: HPGD Biallelic Missense Variant
  description: >-
    The initiating lesion. Affected individuals are homozygous for HPGD
    c.577T>C (p.Ser193Pro) in exon 6, found by homozygosity mapping to
    4q32.3-q34.1 and candidate-gene sequencing. The abstract reports no enzyme
    assay for this allele, so its functional class (complete or partial loss of
    function) is inferred here rather than demonstrated.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
  downstream:
  - target: Reduced 15-PGDH Prostaglandin Catabolism
    causal_link_type: DIRECT
    description: >-
      HPGD encodes 15-PGDH, the main prostaglandin-degrading enzyme, so a
      pathogenic HPGD variant reduces prostaglandin catabolism. For p.Ser193Pro
      this step rests on the gene's function and on segregation, not on an
      enzyme assay of the allele.
    evidence:
    - reference: PMID:18500342
      reference_title: "Mutations in 15-hydroxyprostaglandin dehydrogenase cause primary hypertrophic osteoarthropathy."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "identified mutations in HPGD, encoding 15-hydroxyprostaglandin dehydrogenase, the main enzyme of prostaglandin degradation"
      explanation: >-
        Establishes what the HPGD product does. INDIRECT because the quote is
        from the PHO discovery study and concerns HPGD variants generally, not
        the p.Ser193Pro allele.
  evidence:
  - reference: PMID:18805827
    reference_title: "Mutation in the HPGD gene encoding NAD+ dependent 15-hydroxyprostaglandin dehydrogenase underlies isolated congenital nail clubbing (ICNC)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sequence analysis of the candidate genes, in the ICNC linkage interval, revealed a homozygous missense mutation (c.577T>C; p.S193P) in exon 6 of the human HPGD gene encoding NAD(+) dependent 15-hydroxyprostaglandin dehydrogenase (15-PGDH)."
    explanation: Identifies the causal homozygous HPGD variant in the defining family.
- name: Reduced 15-PGDH Prostaglandin Catabolism
  description: >-
    15-PGDH oxidizes the 15-hydroxyl group of PGE2 in the cytosol, the first
    step in PGE2 inactivation. Reduced 15-PGDH activity slows clearance of PGE2.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: HPGD
    term:
      id: hgnc:5154
      label: HPGD
  molecular_functions:
  - preferred_term: 15-hydroxyprostaglandin dehydrogenase (NAD+) activity
    term:
      id: GO:0016404
      label: 15-hydroxyprostaglandin dehydrogenase (NAD+) activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: prostaglandin catabolic process
    term:
      id: GO:1905344
      label: prostaglandin catabolic process
    modifier: DECREASED
  cellular_components:
  - preferred_term: cytosol
    term:
      id: GO:0005829
      label: cytosol
  downstream:
  - target: Chronic Prostaglandin E2 Excess
    causal_link_type: DIRECT
    description: >-
      Failure to degrade PGE2 raises its level. The rise is measured in
      HPGD-related PHO, where urinary PGE2 is high and its metabolite PGE-M is
      low. The isolated-clubbing report is MeSH-indexed for urinary PGE2
      (Dinoprostone/urine), but its abstract gives no value and its full text
      was not available to this curation, so the size of the rise in isolated
      clubbing is not recorded here.
    evidence:
    - reference: PMID:35813463
      reference_title: "Clinical and biochemical characteristics of 12 Chinese primary hypertrophic osteoarthropathy patients with HPGD mutations."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "our PHOAR1 patients have elevated urinary prostaglandin E2 (PGE2) levels (P<0.001) and decreased urinary prostaglandin E metabolite (PGE-M) levels (P=0.04) compared with healthy controls"
      explanation: >-
        Measured biochemical consequence of HPGD loss. INDIRECT because the
        patients have PHO rather than isolated clubbing.
  evidence:
  - reference: PMID:23243350
    reference_title: "Digital clubbing."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "15-PGDH is involved in the catabolism of prostaglandin E2 (PGE2)."
    explanation: Review statement of the enzyme's role in PGE2 catabolism.
- name: Chronic Prostaglandin E2 Excess
  description: >-
    Persistently raised PGE2 is the biochemical state of HPGD deficiency. In PHO
    type 1 it accompanies clubbing, periostosis and pachydermia; in the isolated
    form only the digital component is expressed, which may reflect a smaller
    PGE2 excess from a hypomorphic allele. That dose explanation is a hypothesis.
    This node is not assumed for the SLCO2A1 isolated-clubbing family, whose
    serum and urinary PGE2 were normal.
  biological_scale: ORGANISM
  chemical_entities:
  - preferred_term: prostaglandin E2
    term:
      id: CHEBI:15551
      label: prostaglandin E2
    modifier: INCREASED
  downstream:
  - target: Distal Digital Connective Tissue Proliferation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Raised PGE2 is proposed to drive the vascular and connective-tissue changes
      of the clubbed digit. The step is inferred from PHO and from clubbing
      biology, not shown directly in nail-bed tissue, and its intermediates are
      not established.
    evidence:
    - reference: PMID:23243350
      reference_title: "Digital clubbing."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Chronically elevated prostaglandin E2 levels may be responsible for various clinical manifestations of clubbing."
      explanation: >-
        A review's hedged synthesis linking PGE2 excess to clubbing. Graded
        INDIRECT and OTHER because it is a proposal, not a measurement.
  evidence:
  - reference: PMID:18500342
    reference_title: "Mutations in 15-hydroxyprostaglandin dehydrogenase cause primary hypertrophic osteoarthropathy."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Homozygous individuals develop PHO secondary to chronically elevated prostaglandin E(2) levels."
    explanation: >-
      Shows that biallelic HPGD loss produces chronic PGE2 elevation. INDIRECT
      because the phenotype studied is PHO, the severe allelic presentation.
- name: Distal Digital Connective Tissue Proliferation
  description: >-
    The tissue lesion of clubbing: connective tissue proliferates between the
    nail matrix and the distal phalanx, and the nail matrix functions abnormally,
    so the terminal pulp enlarges and the nail plate thickens and curves.
  biological_scale: TISSUE
  locations:
  - preferred_term: nail bed
    term:
      id: UBERON:0005273
      label: nail bed
  - preferred_term: nail matrix
    term:
      id: UBERON:0002283
      label: nail matrix
  downstream:
  - target: Clubbing of Fingers
    causal_link_type: DIRECT
    description: >-
      Expansion of the terminal pulp and thickening of the nail is what the
      clinical sign of finger clubbing consists of.
    evidence:
    - reference: PMID:18805827
      reference_title: "Mutation in the HPGD gene encoding NAD+ dependent 15-hydroxyprostaglandin dehydrogenase underlies isolated congenital nail clubbing (ICNC)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "enlargement of the terminal segments of fingers and toes with thickened nails due to proliferation of the connective tissues and abnormal function of the nail matrix"
      explanation: Attributes the enlarged terminal segments to the connective-tissue lesion.
  - target: Clubbing of Toes
    causal_link_type: DIRECT
    description: The same lesion in the terminal segments of the toes.
    evidence:
    - reference: PMID:18805827
      reference_title: "Mutation in the HPGD gene encoding NAD+ dependent 15-hydroxyprostaglandin dehydrogenase underlies isolated congenital nail clubbing (ICNC)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "enlargement of the terminal segments of fingers and toes with thickened nails due to proliferation of the connective tissues and abnormal function of the nail matrix"
      explanation: The same attribution covers the toes.
  evidence:
  - reference: PMID:23243350
    reference_title: "Digital clubbing."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Digital clubbing is characterized by a focal bulbous enlargement of the terminal segments of the fingers and/or toes due to proliferation of connective tissue between nail matrix and the distal phalanx."
    explanation: Locates the proliferating connective tissue anatomically.
phenotypes:
- category: Integumentary
  name: Clubbing of Fingers
  description: >-
    Congenital clubbing of the fingers with thickened nails. It is the only
    clinical feature of the disorder and was present in all 11 affected members
    of the defining family.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Clubbing of fingers
    term:
      id: HP:0100759
      label: Clubbing of fingers
    onset:

    clubbing can spare some toes, so no frequency is given.
  phenotype_term:
    preferred_term: Clubbing of toes
    term:
      id: HP:0100760
      label: Clubbing of toes
    onset:
      onset_category: CONGENITAL
  evidence:
  - reference: PMID:18805827
    reference_title: "Mutation in the HPGD gene encoding NAD+ dependent 15-hydroxyprostaglandin dehydrogenase underlies isolated congenital nail clubbing (ICNC)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Isolated congenital nail clubbing (ICNC) is a rare autosomal recessive disorder characterised by enlargement of the terminal segments of fingers and toes with thickened nails"
    explanation: Defines the disorder as affecting both fingers and toes.
  - reference: PMID:36833358
    reference_title: "Homozygous Missense Variant in the Solute Carrier Organic Anion Transporter 2A1 (SLCO2A1) Gene Underlies Isolated Nail Clubbing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

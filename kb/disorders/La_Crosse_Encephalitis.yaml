    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The most common presentation of LACV neuroinvasive disease is encephalitis
      (∼80%) followed by meningitis (∼20%).
    explanation: >-
      Establishes encephalitis and meningitis as the core neuroinvasive
      presentations.
  - reference: PMID:35607778
    reference_title: "La Crosse Virus Neuroinvasive Disease in Children: A Contemporary Analysis of Clinical/Neurobehavioral Outcomes and Predictors of Disease Severity."

name: La Crosse Encephalitis
creation_date: '2026-11-14T09:15:00Z'
synonyms:
- La Crosse virus disease
- LACV neuroinvasive disease
category: Infectious Disease
description: >-
  La Crosse encephalitis is a mosquito-borne neuroinvasive orthobunyavirus
  disease caused by La Crosse virus, a California-serogroup Peribunyaviridae
  virus that cycles between Aedes triseriatus and other mosquito vectors and
  small mammal amplifying hosts. Humans are incidental dead-end hosts infected
  by mosquito bite. Most recognized U.S. cases occur in children and are
  neuroinvasive, presenting as febrile illness, meningitis, or encephalitis with
  frequent headache, vomiting, seizures, occasional status epilepticus,
  lymphocytic CSF pleocytosis, hyponatremia, and sometimes cerebral edema.
  Death is uncommon, but epilepsy, hemiparesis, and cognitive or neurobehavioral
  sequelae can follow acute neuroinvasive disease.

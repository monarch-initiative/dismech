    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Management includes supportive care with early treatment of seizures,
      hyperthermia, hyponatremia, and any cerebral edema.
    explanation: >-
      Establishes supportive management of acute neuroinvasive complications.

diagnosis:
- name: La Crosse Virus Serology With Neutralization Confirmation
  description: >-
    LACV diagnosis is usually made by LACV-specific IgM in serum or CSF, with
    plaque reduction neutralization testing recommended to confirm probable
    serologic cases because California-serogroup arboviruses cross-react.
  diagnosis_term:
    preferred_term: Diagnostic Serology Testing
    term:
      id: NCIT:C217458
      label: Diagnostic Serology Testing
  evidence:
  - reference: PMID:35755222
    reference_title: "An Overview of La Crosse Virus Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Diagnosis is usually made by serology (i.e., a positive LACV-specific IgM
      test in serum and/or CSF).
    explanation: >-
      The overview identifies LACV-specific serum or CSF IgM as the usual
      diagnostic route.
  - reference: PMID:35755222
    reference_title: "An Overview of La Crosse Virus Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      because of significant antibody cross-reactivity among the California
      serogroup viruses, confirmation should be made through plaque reduction
      neutralization tests.
    explanation: >-
      Supports confirmatory neutralization testing to resolve
      California-serogroup serologic cross-reactivity.
treatments:
- name: Supportive Neurocritical Care
  description: >-
    No specific antiviral is currently recommended for LACV infection; acute
    management is supportive and focuses on seizures, hyperthermia,
    hyponatremia, and cerebral edema.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  therapeutic_modality: OTHER

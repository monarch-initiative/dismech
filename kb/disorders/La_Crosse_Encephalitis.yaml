    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      La Crosse virus (LACV) is a mosquito-borne orthobunyavirus first isolated
      in 1960 from brain tissue of a child with encephalitis from La Crosse,
      Wisconsin.
    explanation: >-
      The review identifies LACV as the mosquito-borne orthobunyavirus causing
      the encephalitis syndrome.
  - reference: PMID:34280142
    reference_title: "La Crosse Virus Disease in the United States, 2003-2019."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      La Crosse virus (LACV) is an arthropod-borne virus (arbovirus) in the
      California serogroup and the family Peribunyaviridae.
    explanation: >-
      Establishes the California-serogroup and Peribunyaviridae placement named
      in the description.
agent_life_cycle:
  description: >-
    LACV is maintained between mosquito vectors, especially the eastern treehole
    mosquito Aedes triseriatus, and small mammal amplifying hosts such as
    chipmunks and gray squirrels. Humans are incidental hosts infected by bites
    from infected mosquitoes and do not amplify onward transmission.
  hosts:
  - preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
    role: incidental dead-end host
  - preferred_term: Aedes triseriatus
    term:
      id: NCBITaxon:7162
      label: Ochlerotatus triseriatus
    role: vector
  evidence:
  - reference: PMID:34280142
    reference_title: "La Crosse Virus Disease in the United States, 2003-2019."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      La Crosse virus is maintained in its natural transmission cycle between
      mosquito vectors, primarily the eastern tree hole mosquito Aedes
      triseriatus, and small mammal amplifying hosts, including chipmunks and
      gray squirrels.
    explanation: >-
      Supports the mosquito-vector and small-mammal amplifying-host cycle.
  - reference: PMID:34280142
    reference_title: "La Crosse Virus Disease in the United States, 2003-2019."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Humans are considered incidental or dead-end hosts.
    explanation: >-
      Establishes humans as incidental dead-end hosts rather than amplifying
      hosts in the LACV life cycle.
transmission:
- name: Aedes mosquito vector transmission
  description: >-
    People acquire LACV when an infected Aedes mosquito inoculates virus during
    a blood meal.
  evidence:
  - reference: PMID:35607778
    reference_title: "La Crosse Virus Neuroinvasive Disease in Children: A Contemporary Analysis of Clinical/Neurobehavioral Outcomes and Predictors of Disease Severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Human disease transmission occurs through bites of infected Aedes
      triseriatus mosquitoes in the Midwestern, mid-Atlantic, and Southeastern
      US.
    explanation: >-
      Identifies infected Aedes triseriatus bites as the human transmission
      route in endemic U.S. regions.
prevalence:
- population: United States, 2003-2019
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.02
  rate_denominator: POPULATION_PER_YEAR
  notes: >-
    Passive U.S. ArboNET surveillance recorded a nationwide average annual
    neuroinvasive LACV disease incidence of 0.02 cases per 100,000 persons from
    2003-2019, based on 1,183 neuroinvasive disease cases among 1,281 reported
    human LACV disease cases. The true incidence is likely underestimated
    because clinician recognition, testing, and reporting are incomplete,
    especially for non-neuroinvasive cases.
  evidence:
  - reference: PMID:34280142
    reference_title: "La Crosse Virus Disease in the United States, 2003-2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      A total of 1,281 human LACV disease cases were reported, including 909
      (71%) confirmed and 372 (29%) probable cases.
    explanation: >-
      Gives the national passive-surveillance case count for human LACV disease
      over 2003-2019.
  - reference: PMID:34280142
    reference_title: "La Crosse Virus Disease in the United States, 2003-2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Among the 1,281 total cases, 1,183 (92%) were neuroinvasive disease cases,
      and 98 (8%) were non-neuroinvasive disease cases.
    explanation: >-
      Shows that the reported case pool was dominated by neuroinvasive disease.
  - reference: PMID:34280142
    reference_title: "La Crosse Virus Disease in the United States, 2003-2019."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      For this 17-year period, the nationwide average annual incidence of
      neuroinvasive LACV disease was 0.02 cases per 100,000 persons.
    explanation: >-
      Provides the denominator-based annual incidence rate for reported
      neuroinvasive LACV disease in U.S. ArboNET surveillance.
progression:
- phase: Acute Neuroinvasive Illness
  notes: >-
    After a 5-15 day incubation period, symptomatic infection ranges from a
    nonspecific febrile illness to aseptic meningitis and encephalitis.
    Encephalitis is the most common reported neuroinvasive presentation, and
    seizures are common in hospitalized children.
  evidence:
  - reference: PMID:34280142
    reference_title: "La Crosse Virus Disease in the United States, 2003-2019."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The incubation period for LACV disease is 5–15 days. The spectrum of
      clinical disease ranges from nonspecific febrile illness to meningitis and
      encephalitis.
    explanation: >-
      Defines the incubation period and the acute clinical spectrum.
- phase: Post-Encephalitic Neurologic Sequelae
  notes: >-
    Survivors can develop chronic neurologic sequelae, including post-infectious
    epilepsy, hemiparesis, and cognitive or neurobehavioral abnormalities.
  evidence:
  - reference: PMID:35755222
    reference_title: "An Overview of La Crosse Virus Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      While LACV infection is rarely fatal (< 1%), long-term neurologic sequelae
      such as epilepsy, hemiparesis, or cognitive/neurobehavioral abnormalities
      can result.
    explanation: >-
      The review summarizes post-encephalitic epilepsy, hemiparesis, and
      cognitive or neurobehavioral sequelae.
pathophysiology:
- name: Infected Aedes Mosquito Bite
  biological_scale: ORGANISM
  role: trigger
  description: >-
    Infected Aedes mosquitoes inoculate LACV into humans during a bite,
    initiating an incidental human infection that can progress from peripheral
    infection to central nervous system invasion.
  downstream:
  - target: Hematogenous Olfactory Bulb Neuroinvasion
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:35607778
    reference_title: "La Crosse Virus Neuroinvasive Disease in Children: A Contemporary Analysis of Clinical/Neurobehavioral Outcomes and Predictors of Disease Severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Human disease transmission occurs through bites of infected Aedes
      triseriatus mosquitoes in the Midwestern, mid-Atlantic, and Southeastern
      US.
    explanation: >-
      Supports the mosquito-bite inoculation route that triggers human LACV
      disease.
- name: Hematogenous Olfactory Bulb Neuroinvasion
  biological_scale: TISSUE
  description: >-
    In animal models, LACV reaches the central nervous system through blood-borne
    spread into brain regions whose capillaries are susceptible to viral
    activation. Olfactory-bulb capillary permeability permits virus-sized
    particles to leak into the brain, making the olfactory bulb an early portal
    for CNS invasion.
  locations:
  - preferred_term: olfactory bulb
    term:
      id: UBERON:0002264
      label: olfactory bulb
  - preferred_term: capillary
    term:
      id: UBERON:0001982
      label: capillary
  biological_processes:
  - preferred_term: positive regulation of blood-brain barrier permeability
    term:
      id: GO:1905605
      label: positive regulation of blood-brain barrier permeability
  - preferred_term: transport across blood-brain barrier
    term:
      id: GO:0150104
      label: transport across blood-brain barrier
  downstream:
  - target: Viral Meningoencephalitis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25956408
    reference_title: "Capillaries in the olfactory bulb but not the cortex are highly susceptible to virus-induced vascular leak and promote viral neuroinvasion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: >-
      Instead, we found that OB capillaries were compromised allowing leakage of
      virus-sized particles into the brain.
    explanation: >-
      A mouse LACV study found olfactory-bulb capillary compromise and leakage
      of virus-sized particles during neuroinvasion.
  - reference: PMID:25956408
    reference_title: "Capillaries in the olfactory bulb but not the cortex are highly susceptible to virus-induced vascular leak and promote viral neuroinvasion."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: >-
      LACV neuroinvasion occurs through hematogenous spread in specific brain
      regions where capillaries are prone to virus-induced activation such as
      the OB.
    explanation: >-
      Supports a hematogenous, capillary-permeability route for LACV CNS
      invasion in susceptible brain regions in mice.
- name: Viral Meningoencephalitis
  biological_scale: TISSUE
  role: central_effector
  description: >-
    LACV CNS invasion produces neuroinvasive disease that presents most often as
    encephalitis and less often as meningitis. The acute syndrome produces
    fever, headache, vomiting, lymphocytic CSF pleocytosis, hyponatremia, and
    cerebral edema in some patients, while seizures can escalate to status
    epilepticus and mark more severe pediatric disease.
  locations:
  - preferred_term: central nervous system
    term:
      id: UBERON:0001017
      label: central nervous system
  downstream:
  - target: Fever
    causal_link_type: DIRECT
  - target: Headache
    causal_link_type: DIRECT
  - target: Vomiting
    causal_link_type: DIRECT
  - target: Meningitis

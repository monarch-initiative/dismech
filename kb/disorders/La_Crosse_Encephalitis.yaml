  - target: Viral Encephalitis
    causal_link_type: DIRECT
  - target: CSF Pleocytosis
    causal_link_type: DIRECT
  - target: Hyponatremia
    causal_link_type: DIRECT
  - target: Cerebral Edema
    causal_link_type: DIRECT
  - target: Seizure
    causal_link_type: DIRECT
  - target: Status Epilepticus
    causal_link_type: DIRECT
  - target: Hemiparesis

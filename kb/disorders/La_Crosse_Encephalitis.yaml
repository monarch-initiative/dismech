- name: Syndrome of Inappropriate Antidiuretic Hormone Secretion
  biological_scale: ORGANISM
  description: >-
    Severe pediatric LACV neuroinvasive disease can include syndrome of
    inappropriate antidiuretic hormone secretion, creating a mechanistic route
    from acute CNS disease to hyponatremia.
  downstream:
  - target: Hyponatremia
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:35607778
    reference_title: "La Crosse Virus Neuroinvasive Disease in Children: A Contemporary Analysis of Clinical/Neurobehavioral Outcomes and Predictors of Disease Severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Seventeen (26%) patients required intubation and mechanical ventilation,
      14 (22%) received tube feedings (1 required parental nutrition), and 4
      (6%) were diagnosed with SIADH.
    explanation: >-
      The pediatric LACV neuroinvasive disease cohort observed SIADH among
      severely affected children, supporting this intermediate step upstream of
      hyponatremia.

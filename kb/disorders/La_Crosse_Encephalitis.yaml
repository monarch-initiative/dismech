diagnosis:
- name: La Crosse Virus Serology With Neutralization Confirmation
  description: >-
    LACV diagnosis is usually made by LACV-specific IgM in serum or CSF, with
    plaque reduction neutralization testing recommended to confirm probable
    serologic cases because California-serogroup arboviruses cross-react.
  diagnosis_term:
    preferred_term: Diagnostic Serology Testing
    term:
      id: NCIT:C217458
      label: Diagnostic Serology Testing
  evidence:
  - reference: PMID:35755222
    reference_title: "An Overview of La Crosse Virus Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Diagnosis is usually made by serology (i.e., a positive LACV-specific IgM
      test in serum and/or CSF).
    explanation: >-
      The overview identifies LACV-specific serum or CSF IgM as the usual
      diagnostic route.
  - reference: PMID:35755222
    reference_title: "An Overview of La Crosse Virus Disease."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      because of significant antibody cross-reactivity among the California
      serogroup viruses, confirmation should be made through plaque reduction
      neutralization tests.
    explanation: >-
      Supports confirmatory neutralization testing to resolve
      California-serogroup serologic cross-reactivity.
- name: Electroencephalography for Acute and Prognostic Assessment
  description: >-
    EEG is part of the neurodiagnostic evaluation in LACV neuroinvasive disease,
    and epileptiform discharges during hospitalization can identify children at
    higher risk for later epilepsy.
  diagnosis_term:
    preferred_term: Electroencephalography
    term:
      id: NCIT:C38054
      label: Electroencephalography
  evidence:
  - reference: PMID:35607778
    reference_title: "La Crosse Virus Neuroinvasive Disease in Children: A Contemporary Analysis of Clinical/Neurobehavioral Outcomes and Predictors of Disease Severity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Epileptiform discharges on electroencephalogram (EEG) were independently
      associated with epilepsy diagnosis at follow-up (OR, 13.45 [95% CI,
      1.4-128.77]; P = .024).
    explanation: >-
      Supports EEG as both an acute neurodiagnostic test and a prognostic
      marker for later epilepsy in pediatric LACV neuroinvasive disease.
- name: Brain Magnetic Resonance Imaging
  description: >-
    Brain MRI is used to characterize the focal T2 hyperintensities, restricted
    diffusion, and other intracranial abnormalities that can accompany LACV
    neuroinvasive disease.
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:35607778

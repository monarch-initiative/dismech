animal_models:
- name: Gnb5 knockout mouse
  species: Mouse
  genotype: Gnb5-/-
  publication: PMID:33172956
  description: >-
    Knockout mice lose all R7 RGS proteins. They have slow rod recovery and
    no ERG b-wave, impaired neurological development and hyperactivity, and
    profound carbachol-induced bradycardia with sinus arrhythmias. Resting
    heart rate is higher than in wild type, unlike patients.
  modeled_mechanisms:
  - target: Exaggerated Parasympathetic Slowing of Heart Rate
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      The mice show cholinergic bradycardia and sinus arrhythmias but a
      higher, not lower, resting heart rate, from reduced parasympathetic
      and increased sympathetic tone.
    evidence:
    - reference: PMID:33172956
      reference_title: "Inhibition of G-protein signalling in cardiac dysfunction of intellectual developmental disorder with cardiac arrhythmia (IDDCA) syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Lower autonomic nervous system modulation through diminished parasympathetic control and greater sympathetic regulation resulted in a higher baseline HR in Gnb5-/- mice."
      explanation: Records the resting heart-rate difference from patients.
  - target: Defective Retinal Photoreceptor and ON-Bipolar Cell Signaling
    relationship: RECAPITULATES
    fidelity: HIGH
    evidence:
    - reference: PMID:18094259
      reference_title: "Gbeta5 is required for normal light responses and morphology of retinal ON-bipolar cells."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These results indicate that Gbeta5-S is indispensable for OPL integrity and normal light responses of the retina."
      explanation: The knockout reproduces the ON-bipolar defect seen in the patient ERG.
  - target: Prolonged Inhibitory GPCR Signaling in Neurons
    relationship: RECAPITULATES
    fidelity: MODERATE
    evidence:
    - reference: PMID:21766168
      reference_title: "Gβ5-RGS complexes are gatekeepers of hyperactivity involved in control of multiple neurotransmitter systems."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Neurochemical studies indicated that Gβ5-RGS-deficient mice had higher sensitivity of inhibitory GPCR signaling and deficits in basal levels, release, and reuptake of dopamine."
      explanation: The knockout shows the neuronal signaling change.
- name: Zebrafish gnb5 knockout
  species: Zebrafish
  genotype: gnb5 knockout
  publication: PMID:27523599
  description: >-
    Zebrafish gnb5 knockouts reproduce the cardiac, neurological and
    ophthalmological features of patients.
  evidence:
  - reference: PMID:27523599
    reference_title: "GNB5 Mutations Cause an Autosomal-Recessive Multisystem Syndrome with Sinus Bradycardia and Cognitive Disability."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Zebrafish gnb5 knockouts recapitulated the phenotypic spectrum of affected individuals, including cardiac, neurological, and ophthalmological abnormalities, supporting a direct role of GNB5 in the control of heart rate, hypotonia, and vision."
    explanation: The fish knockout reproduces the human spectrum.
experimental_models:
- name: Isogenic GNB5 p.S81L hiPSC-derived cardiomyocytes
  experimental_model_type: IPSC_DERIVED_MODEL
  description: >-
    CRISPR/Cas9-edited isogenic human iPSC lines, wild type, heterozygous or
    homozygous for p.Ser81Leu, differentiated into cardiomyocytes that
    express I-K,ACh.
  publication: PMID:31208990
  modeled_mechanisms:
  - target: Enhanced Muscarinic IKACh Activation in Sinoatrial Node Cells
    relationship: RECAPITULATES
    fidelity: MODERATE
    limitations: >-
      iPSC-derived cardiomyocytes are a mixed, immature population rather
      than sinoatrial node cells, and the study tested only the mild-form
      missense allele.
    evidence:
    - reference: PMID:31208990
      reference_title: "Genetic variation in GNB5 causes bradycardia by augmenting the cholinergic response via increased acetylcholine-activated potassium current (I(K,ACh))."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "homozygous p.S81L hiPSC-CMs displayed an increased acetylcholine-activated potassium current (IK,ACh) density and a more pronounced decrease of spontaneous activity as compared to wild-type and heterozygous p.S81L hiPSC-CMs, explaining the bradycardia in homozygous carriers"
      explanation: The patient allele increases I-K,ACh in human cardiomyocytes.
discussions:
- discussion_id: epileptic_encephalopathy_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Epileptic spasm
  - pathophysiology#Prolonged Inhibitory GPCR Signaling in Neurons
  prompt: >-
    How does loss of Gbeta5-R7 RGS complexes, which strengthens inhibitory
    GPCR signaling, lead to epileptic spasms and focal seizures?
  rationale: >-
    Stronger inhibitory signaling would be expected to lower excitability, yet
    truncating GNB5 alleles cause a developmental and epileptic
    encephalopathy. No cited source connects the signaling defect to seizures,
    so the seizure phenotypes have no upstream edge in this entry.
- discussion_id: neurodevelopmental_feature_mechanism
  kind: KNOWLEDGE_GAP
  attaches_to:
  - phenotypes#Severe or profound intellectual disability
  - phenotypes#Delayed speech and language development
  - phenotypes#Hypotonia
  - phenotypes#Gastroesophageal reflux
  prompt: >-
    Which of the Gbeta5-R7 RGS signaling defects produces the intellectual
    disability, language disorder, hypotonia and gastrointestinal features?
  rationale: >-
    The mouse knockout shows abnormal neuronal development and motor
    deficits, but no cited source ties a specific signaling defect to
    intellectual disability, language, hypotonia or reflux in patients, so
    these phenotypes have no upstream edge here.

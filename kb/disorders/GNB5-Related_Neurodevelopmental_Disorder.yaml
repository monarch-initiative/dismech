notes: >-
  MONDO has no umbrella term for the GNB5 spectrum. It has two sibling terms,
  MONDO:0014953 (gnb5-related intellectual disability-cardiac arrhythmia
  syndrome, IDDCA) for the severe form and MONDO:0014957 (LADCI) for the mild
  form, each with GNB5 as its causal gene. The GeneReviews chapter
  (PMID:34436834) treats them as one disorder, GNB5-NDD, whose severity
  depends on the allele. This entry follows GeneReviews: it is anchored on
  MONDO:0014957 and carries both MONDO terms as has_subtypes. The two forms
  share the same gene, mechanism and cardiac phenotype, and differ in degree.
  MONDO cross-references MONDO:0014957 to OMIM 617182.
inheritance:
- name: Autosomal recessive
  description: >-
    Affected individuals carry homozygous or compound heterozygous GNB5
    variants. Heterozygous carriers are reported as asymptomatic.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:34436834
    reference_title: "GNB5-Related Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GNB5-NDD is inherited in an autosomal recessive manner."
    explanation: GeneReviews states the mode of inheritance.
  - reference: PMID:34436834
    reference_title: "GNB5-Related Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "If both parents are known to be heterozygous for a GNB5 pathogenic variant, each sib of an affected individual has at conception a 25% chance of being affected, a 50% chance of being an asymptomatic carrier, and a 25% chance of being unaffected and not a carrier."
    explanation: Gives the recessive recurrence risk and states that carriers are asymptomatic.
has_subtypes:
- name: IDDCA
  display_name: Severe form (IDDCA)
  description: >-
    Severe-to-profound intellectual disability with a developmental and
    epileptic encephalopathy, visual impairment, hypotonia, gastroesophageal
    reflux and sinus node dysfunction. Seen with biallelic loss-of-function
    (truncating) alleles.
  genes:
  - preferred_term: GNB5
    term:
      id: hgnc:4401
      label: GNB5
  subtype_term:
    preferred_term: gnb5-related intellectual disability-cardiac arrhythmia syndrome
    term:
      id: MONDO:0014953
      label: gnb5-related intellectual disability-cardiac arrhythmia syndrome
  evidence:
  - reference: PMID:27523599
    reference_title: "GNB5 Mutations Cause an Autosomal-Recessive Multisystem Syndrome with Sinus Bradycardia and Cognitive Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "individuals with loss-of-function alleles had more severe symptoms, including substantial developmental delay, speech defects, severe hypotonia, pathological gastro-esophageal reflux, retinal disease, and sinus-node dysfunction"
    explanation: Defines the severe form and ties it to loss-of-function alleles.
  - reference: PMID:31631344
    reference_title: "The epileptology of GNB5 encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All individuals had biallelic pathogenic variants in GNB5, predicted by in silico tools to result in protein truncation and loss-of-function."
    explanation: The epileptic encephalopathy cohort carries truncating alleles.
- name: LADCI
  display_name: Mild form (LADCI)
  description: >-
    Severe language delay, attention deficit hyperactivity disorder and motor
    delay with normal or mildly impaired cognition, with or without sinus
    bradycardia. First described in a consanguineous family homozygous for
    the missense variant p.Ser81Leu.
  genes:
  - preferred_term: GNB5
    term:
      id: hgnc:4401
      label: GNB5
  subtype_term:
    preferred_term: language delay and attention deficit-hyperactivity disorder/cognitive impairment with or without cardiac arrhythmia
    term:
      id: MONDO:0014957
      label: language delay and attention deficit-hyperactivity disorder/cognitive impairment with or without cardiac arrhythmia
  evidence:
  - reference: PMID:27677260
    reference_title: "GNB5 mutation causes a novel neuropsychiatric disorder featuring attention deficit hyperactivity disorder, severely impaired language development and normal cognition."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In an extended consanguineous family, we identified a novel neuropsychiatric phenotype characterized by severe speech impairment, variable expressivity of attention deficit hyperactivity disorder (ADHD), and motor delay."
    explanation: Defines the mild form in the original family.
  - reference: PMID:30631341
    reference_title: "A NGS-Targeted Autism/ID Panel Reveals Compound Heterozygous GNB5 Variants in a Novel Patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her clinical presentation is consistent with a moderate phenotype, corroborating the direct correlation between the type and pathogenic mechanism of the GNB5 genetic variant and the severity of related phenotype."
    explanation: A frameshift/missense compound heterozygote has an intermediate phenotype, supporting a severity gradient by allele type.
pathophysiology:
- name: GNB5 Loss of Function
  description: >-
    Biallelic GNB5 variants remove or reduce the G-beta-5 protein. Truncating
    alleles are loss-of-function. The p.Ser81Leu missense allele is
    hypomorphic: the mutant protein is poorly expressed. A deep intronic
    splice allele, c.628-6G>A, is also hypomorphic and gives about half the
    normal transcript.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: GNB5
    term:
      id: hgnc:4401
      label: GNB5
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Loss of Gbeta5-R7 RGS Complexes
    causal_link_type: DIRECT
    description: >-
      G-beta-5 is needed for the R7 RGS proteins to fold and stay stable, so
      losing it removes the whole complex.
    evidence:
    - reference: PMID:27677260
      reference_title: "GNB5 mutation causes a novel neuropsychiatric disorder featuring attention deficit hyperactivity disorder, severely impaired language development and normal cognition."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We demonstrate that these deficits originate from the impaired expression of the mutant Gβ5 protein, resulting in the decreased ability to stabilize regulator of G protein signaling complexes."
      explanation: The patient S81L allele lowers G-beta-5 expression and so destabilizes RGS complexes.
  evidence:
  - reference: PMID:27523599
    reference_title: "GNB5 Mutations Cause an Autosomal-Recessive Multisystem Syndrome with Sinus Bradycardia and Cognitive Disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We observed an association between the nature of the variants and clinical severity"
    explanation: Variant type (loss-of-function versus missense) tracks severity.
  - reference: PMID:37994112
    reference_title: "Inheritance of c.628-6G>A GNB5 hypomorphic allele uncovers another challenge in the pathogenic prediction of genomic variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional genomics studies showed that parents express 50% (nonsense-mediated decay, NMD) of the RNA/protein while the patient does not produce enough protein for normal development."
    explanation: Shows a hypomorphic splice allele and that disease depends on how much G-beta-5 protein is left.
- name: Loss of Gbeta5-R7 RGS Complexes
  description: >-
    G-beta-5 dimerizes with the R7 RGS proteins (RGS6, RGS7, RGS9, RGS11)
    through their G-gamma-like domain. The complexes are GTPase-accelerating
    proteins for Gi/o alpha subunits and switch off Gi/o-coupled receptor
    signaling. Knocking out Gnb5 in mice causes the whole Gbeta5-R7 family to
    be degraded.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: GNB5
    term:
      id: hgnc:4401
      label: GNB5
  molecular_functions:
  - preferred_term: GTPase activator activity of R7 RGS proteins
    modifier: DECREASED
    term:
      id: GO:0005096
      label: GTPase activator activity
  downstream:
  - target: Enhanced Muscarinic IKACh Activation in Sinoatrial Node Cells
    causal_link_type: DIRECT
    description: >-
      RGS6/Gbeta5 sets how fast the muscarinic m2 receptor-I-K,ACh response
      switches off in atrial and sinoatrial node cells.
    evidence:
    - reference: PMID:20884879
      reference_title: "RGS6/Gβ5 complex accelerates IKACh gating kinetics in atrial myocytes and modulates parasympathetic regulation of heart rate."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Loss of Rgs6 yielded profound delays in m(2)R-I(KACh) deactivation kinetics in both neonatal atrial myocytes and adult sinoatrial nodal cells."
      explanation: Losing the RGS partner of G-beta-5 slows the switch-off of I-K,ACh in sinoatrial node cells.
  - target: Prolonged Inhibitory GPCR Signaling in Neurons
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:21766168
      reference_title: "Gβ5-RGS complexes are gatekeepers of hyperactivity involved in control of multiple neurotransmitter systems."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Neurochemical studies indicated that Gβ5-RGS-deficient mice had higher sensitivity of inhibitory GPCR signaling and deficits in basal levels, release, and reuptake of dopamine."
      explanation: Without the complexes, inhibitory receptor signaling in brain is stronger.
  - target: Defective Retinal Photoreceptor and ON-Bipolar Cell Signaling
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12904457
      reference_title: "Prolonged photoresponses and defective adaptation in rods of Gbeta5-/- mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our results indicate that a complex containing RGS9-1-Gbeta5-L is essential for normal G-protein deactivation and rod function."
      explanation: The RGS9-1-Gbeta5-L complex is needed to switch off rod phototransduction.
  evidence:
  - reference: PMID:21804131
    reference_title: "Targeted deletion of one or two copies of the G protein β subunit Gβ5 gene has distinct effects on body weight and behavior in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Gβ5 is essential for stability of these complexes, so that its knockout (KO)causes degradation of the entire Gβ5-R7 family."
    explanation: Gnb5 knockout removes all R7 RGS complexes.
  - reference: PMID:27677260
    reference_title: "GNB5 mutation causes a novel neuropsychiatric disorder featuring attention deficit hyperactivity disorder, severely impaired language development and normal cognition."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we show that the S81L mutant form of Gβ5 has significantly impaired activity in terminating responses that are elicited by dopamine."
    explanation: The patient allele is less able to switch off dopamine receptor responses.
- name: Enhanced Muscarinic IKACh Activation in Sinoatrial Node Cells
  description: >-
    Acetylcholine released by the vagus nerve acts on m2 muscarinic receptors
    on pacemaker cells. The released G-beta-gamma opens the
    acetylcholine-activated potassium channel (I-K,ACh, a GIRK1/GIRK4
    channel), which slows the heart. Without Gbeta5-R7 RGS the response is
    larger and lasts longer. In isogenic iPSC-derived cardiomyocytes
    homozygous for p.Ser81Leu, the carbachol-induced I-K,ACh current is
    larger and spontaneous beating slows more. A specific I-K,ACh blocker
    almost fully reversed this.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: sinoatrial node myocyte
    term:
      id: CL:1000409
      label: myocyte of sinoatrial node
  biological_processes:
  - preferred_term: muscarinic acetylcholine receptor signaling
    modifier: INCREASED
    term:
      id: GO:0007213
      label: G protein-coupled acetylcholine receptor signaling pathway
  molecular_functions:
  - preferred_term: I-K,ACh channel activity
    modifier: INCREASED
    term:
      id: GO:0015467
      label: G-protein activated inward rectifier potassium channel activity
  downstream:
  - target: Exaggerated Parasympathetic Slowing of Heart Rate
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31208990
      reference_title: "Genetic variation in GNB5 causes bradycardia by augmenting the cholinergic response via increased acetylcholine-activated potassium current (I(K,ACh))."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "homozygous p.S81L hiPSC-CMs displayed an increased acetylcholine-activated potassium current (IK,ACh) density and a more pronounced decrease of spontaneous activity as compared to wild-type and heterozygous p.S81L hiPSC-CMs, explaining the bradycardia in homozygous carriers"
      explanation: The larger current slows beating, which the authors take as the cause of the bradycardia.
  evidence:
  - reference: PMID:31208990
    reference_title: "Genetic variation in GNB5 causes bradycardia by augmenting the cholinergic response via increased acetylcholine-activated potassium current (I(K,ACh))."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Application of the specific I(KACh) blocker XEN-R0703 resulted in near-complete reversal of the phenotype."
    explanation: Blocking I-K,ACh reverses the patient-allele phenotype, so the current mediates it.
  - reference: PMID:20884879
    reference_title: "RGS6/Gβ5 complex accelerates IKACh gating kinetics in atrial myocytes and modulates parasympathetic regulation of heart rate."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The cardiac Rgs6/Gβ5 complex modulates the timing of parasympathetic influence on atrial myocytes and heart rate in mice."
    explanation: Places the Rgs6/Gbeta5 complex in parasympathetic control of the pacemaker.
- name: Exaggerated Parasympathetic Slowing of Heart Rate
  description: >-
    The heart rate falls too far in response to vagal (cholinergic) input.
    In Gnb5-/- mice the resting heart rate was higher, but carbachol caused
    profound bradycardia and sinus arrhythmias were more frequent.
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: regulation of heart rate
    modifier: ABNORMAL
    term:
      id: GO:0002027
      label: regulation of heart rate
  downstream:
  - target: Sinus bradycardia
    causal_link_type: DIRECT
  - target: Sick sinus syndrome
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:33172956
    reference_title: "Inhibition of G-protein signalling in cardiac dysfunction of intellectual developmental disorder with cardiac arrhythmia (IDDCA) syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In contrast, Gnb5-/- mice exhibited profound bradycardia on treatment with carbachol, while sympathetic modulation of the cardiac stimulation was not altered."
    explanation: Cholinergic stimulation causes profound bradycardia in the knockout.
  - reference: PMID:33172956
    reference_title: "Inhibition of G-protein signalling in cardiac dysfunction of intellectual developmental disorder with cardiac arrhythmia (IDDCA) syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Homozygous Gnb5 loss resulted in significantly higher frequencies of sinus arrhythmias."
    explanation: Gnb5 loss causes sinus arrhythmias in mice.
- name: Prolonged Inhibitory GPCR Signaling in Neurons
  description: >-
    In neurons the Gbeta5-R7 RGS complexes shut off Gi/o-coupled receptors,
    including dopamine D2-like, GABA-B and mu-opioid receptors. RGS7-Gbeta5
    binds neuronal GIRK channels and sets the timing of GABA-B-GIRK
    inhibition. Without the complexes, inhibitory receptor signaling is
    stronger and lasts longer. In mice this goes with extreme hyperactivity,
    disturbed dopamine handling and motor learning deficits.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: dopamine receptor signaling
    modifier: INCREASED
    term:
      id: GO:0007212
      label: G protein-coupled dopamine receptor signaling pathway
  - preferred_term: GABA-B receptor signaling
    modifier: ABNORMAL
    term:
      id: GO:0007214
      label: gamma-aminobutyric acid signaling pathway
  downstream:
  - target: Attention deficit hyperactivity disorder
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Shown in mice only. Gnb5 knockout mice are strongly hyperactive, which
      the authors link to ADHD-like disorders.
    evidence:
    - reference: PMID:21766168
      reference_title: "Gβ5-RGS complexes are gatekeepers of hyperactivity involved in control of multiple neurotransmitter systems."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "Elimination of Gβ5-RGS complexes led to a striking level of hyperactivity that far exceeds activity levels previously observed in animal models."
      explanation: Mouse hyperactivity is the model counterpart of the ADHD seen with the S81L allele.
  evidence:
  - reference: PMID:20453851
    reference_title: "Gbeta5 recruits R7 RGS proteins to GIRK channels to regulate the timing of neuronal inhibitory signaling."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found that mouse RGS7-Gbeta5 complexes bound to G protein-gated potassium channels and facilitated their functional coupling to GABA(B) receptors in neurons."
    explanation: RGS7-Gbeta5 sets the coupling and timing of neuronal GABA-B-GIRK inhibition.
  - reference: PMID:21766168
    reference_title: "Gβ5-RGS complexes are gatekeepers of hyperactivity involved in control of multiple neurotransmitter systems."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Neurochemical studies indicated that Gβ5-RGS-deficient mice had higher sensitivity of inhibitory GPCR signaling and deficits in basal levels, release, and reuptake of dopamine."
    explanation: Gbeta5-RGS loss heightens inhibitory GPCR signaling and disturbs dopamine handling.
- name: Abnormal Neuronal Development in Cerebellum and Hippocampus
  description: >-
    Gnb5 knockout mice show abnormal neuronal development in cerebellum and
    hippocampus and dysregulated neuronal gene expression. The authors
    propose that G-beta-5 regulates dendritic arborization or synapse
    formation. This has not been shown in patient tissue.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The knockout mice have impaired development and motor learning and
      coordination deficits.
    evidence:
    - reference: PMID:21883221
      reference_title: "Knockout of G protein β5 impairs brain development and causes multiple neurologic abnormalities in mice."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "We show here that mice lacking Gβ5 have a markedly abnormal neurologic phenotype that includes impaired development, tiptoe-walking, motor learning and coordination deficiencies, and hyperactivity."
      explanation: The mouse developmental and motor phenotype parallels the developmental delay in patients.
  - target: Motor delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Shown in mice only. Gnb5 knockout mice have motor learning and
      coordination deficits.
    evidence:
    - reference: PMID:21883221
      reference_title: "Knockout of G protein β5 impairs brain development and causes multiple neurologic abnormalities in mice."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "We show here that mice lacking Gβ5 have a markedly abnormal neurologic phenotype that includes impaired development, tiptoe-walking, motor learning and coordination deficiencies, and hyperactivity."
      explanation: Mouse motor deficits are the model counterpart of the motor delay in patients.
  evidence:
  - reference: PMID:21883221
    reference_title: "Knockout of G protein β5 impairs brain development and causes multiple neurologic abnormalities in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We further show that Gβ5-deficient mice have abnormalities of neuronal development in cerebellum and hippocampus."
    explanation: Gnb5 loss disturbs neuronal development in the mouse brain.
- name: Defective Retinal Photoreceptor and ON-Bipolar Cell Signaling
  description: >-
    G-beta-5L with RGS9-1 switches off phototransduction in rods, and
    G-beta-5S with RGS11 and RGS7 works at the dendritic tips of ON-bipolar
    cells. Gnb5-/- mice have slow rod recovery, no ERG b-wave and fewer
    outer plexiform layer synapses. A child homozygous for the null allele
    p.Tyr344* had an electronegative dark-adapted ERG and absent rod
    responses, a combined defect resembling bradyopsia and rod ON-bipolar
    dysfunction.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: ON-bipolar cell
    term:
      id: CL:0000749
      label: ON-bipolar cell
  - preferred_term: rod photoreceptor
    term:
      id: CL:0000604
      label: retinal rod cell
  biological_processes:
  - preferred_term: phototransduction
    modifier: ABNORMAL
    term:
      id: GO:0007602
      label: phototransduction
  downstream:
  - target: Abnormal dark-adapted electroretinogram
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:18094259
    reference_title: "Gbeta5 is required for normal light responses and morphology of retinal ON-bipolar cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found that the electroretinogram of Gbeta5-/- mice lacks the b-wave component and that Gbeta5-S and RGS11 colocalize with Go alpha at the tips of the ON-bipolar cell dendrites."
    explanation: Gbeta5 loss removes the ON-bipolar-driven ERG b-wave in mice.
  - reference: PMID:22371490
    reference_title: "Defective retinal depolarizing bipolar cells in regulators of G protein signaling (RGS) 7 and 11 double null mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "By characterizing a complete RGS7 and RGS11 double knock-out (711dKO) mouse line, we found that Gβ5S expression in the retinal outer plexiform layer is eliminated, as is the ERG b-wave."
    explanation: Removing the R7 RGS partners of Gbeta5S gives the same ON-bipolar defect, so the defect runs through the Gbeta5-R7 RGS complex.
  - reference: PMID:31720979
    reference_title: "Unique retinal signaling defect in GNB5-related disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The observed phenotype is consistent with a dual retinal signaling defect reminiscent of features of bradyopsia and rod ON-bipolar dysfunction."
    explanation: The same two-site retinal signaling defect is seen in a patient.
phenotypes:

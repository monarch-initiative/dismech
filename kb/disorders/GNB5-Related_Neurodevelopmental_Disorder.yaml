name: GNB5-Related Neurodevelopmental Disorder
creation_date: "2026-10-25T02:45:37Z"
category: Mendelian
synonyms:
- GNB5-NDD
- Lodder-Merla syndrome
- LADCI
- IDDCA
- language delay and ADHD/cognitive impairment with or without cardiac arrhythmia
- intellectual developmental disorder with cardiac arrhythmia
- GNB5 encephalopathy
description: >-
  GNB5-related neurodevelopmental disorder is an autosomal recessive disorder
  caused by biallelic variants in GNB5, which encodes the atypical G protein
  beta subunit G-beta-5. G-beta-5 does not pair with a G-gamma subunit.
  Instead it forms an obligate complex with the R7 family of regulator of G
  protein signaling proteins (RGS6, RGS7, RGS9 and RGS11). These complexes
  speed the switch-off of inhibitory Gi/o-coupled receptor signaling in
  neurons, retinal photoreceptors and ON-bipolar cells, and cardiac pacemaker
  cells. Without G-beta-5 the R7 RGS proteins are degraded, so receptor
  signaling lasts too long.

  The neurodevelopmental phenotype ranges from severe-to-profound
  intellectual disability with a developmental and epileptic encephalopathy
  (epileptic spasms, focal seizures), visual impairment with nystagmus,
  hypotonia, feeding difficulty and gastroesophageal reflux, to normal
  intellect with severe language disorder and attention deficit
  hyperactivity disorder. Severity tracks the allele: truncating alleles
  give the severe form, and the hypomorphic missense allele p.Ser81Leu gives
  the mild form. Across the spectrum, sinus bradycardia from sinoatrial node
  dysfunction is nearly universal. It comes from an exaggerated vagal
  (muscarinic, I-K,ACh-mediated) slowing of the heart rate.
disease_term:
  preferred_term: language delay and attention deficit-hyperactivity disorder/cognitive impairment with or without cardiac arrhythmia
  term:

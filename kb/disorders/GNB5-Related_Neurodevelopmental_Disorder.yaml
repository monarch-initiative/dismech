    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A unique and specific feature of GNB5-NDD – regardless of neurodevelopmental phenotype – is nearly universal bradycardia caused by sinoatrial node dysfunction (sick sinus syndrome)."

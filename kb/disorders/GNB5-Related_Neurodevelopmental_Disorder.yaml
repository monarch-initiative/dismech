- name: Avoidance of Bradycardia-Potentiating Drugs
  description: >-
    Parasympathomimetics should be used with extreme caution because they
    may cause asystole, and drugs that worsen bradycardia, especially beta
    blockers, are best avoided. This follows from the exaggerated cholinergic
    slowing of the pacemaker.
  target_mechanisms:
  - target: Exaggerated Parasympathetic Slowing of Heart Rate
    treatment_effect: MODULATES
    description: Avoiding these drugs keeps from adding to the already exaggerated vagal slowing.
  evidence:
  - reference: PMID:34436834
    reference_title: "GNB5-Related Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Use parasympathomimetics with extreme caution because of the potential to cause asystole. It is best to avoid other drugs that can potentiate bradycardia, particularly beta blockers."
    explanation: GeneReviews agents and circumstances to avoid.

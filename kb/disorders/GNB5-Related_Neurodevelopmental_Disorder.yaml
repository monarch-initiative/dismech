    explanation: GeneReviews diagnostic criterion.
  - reference: PMID:37994112
    reference_title: "Inheritance of c.628-6G>A GNB5 hypomorphic allele uncovers another challenge in the pathogenic prediction of genomic variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional genomics studies showed that parents express 50% (nonsense-mediated decay, NMD) of the RNA/protein while the patient does not produce enough protein for normal development."
    explanation: RNA and protein studies were needed to show the intronic allele is pathogenic.

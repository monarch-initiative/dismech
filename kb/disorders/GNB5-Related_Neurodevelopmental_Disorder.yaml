genetic:
- name: GNB5
  notes: >-
    Reported alleles include truncating variants such as p.Tyr344* (severe
    form), the missense variant p.Ser81Leu (mild form, original family), the
    missense variant p.Cys153Tyr in trans with p.Tyr344*, and the hypomorphic
    splice variant c.628-6G>A, which caused a severe phenotype in trans with
    a frameshift allele. A father homozygous for c.628-6G>A was unaffected.
    One child with the severe form was homozygous for a 15q21.2 microdeletion
    removing GNB5 together with BCL2L10 and MYO5C.
  gene_term:
    preferred_term: GNB5
    term:
      id: hgnc:4401
      label: GNB5
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:34436834
    reference_title: "GNB5-Related Neurodevelopmental Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of GNB5-NDD is established in a proband with suggestive clinical findings and biallelic pathogenic variants in GNB5 identified by molecular genetic testing."
    explanation: Biallelic GNB5 variants define the disorder.
  - reference: PMID:32203251
    reference_title: "IDDCA syndrome in a Chinese infant due to GNB5 biallelic mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing showed that the infant had two compound heterozygous variants, NM_016194:c.458G>A/p.Cys153Tyr and NM_016194:c.1032C>A/p.Tyr344*, in GNB5."
    explanation: A further compound heterozygous severe case.
  - reference: PMID:37994112
    reference_title: "Inheritance of c.628-6G>A GNB5 hypomorphic allele uncovers another challenge in the pathogenic prediction of genomic variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We studied a patient with a severe phenotype carrying two GNB5 variants: c.514delT from the unaffected heterozygous mother and c.628-6G>A from the unaffected homozygous father."
    explanation: A hypomorphic allele causes disease only in trans with a null allele.
  - reference: PMID:32477400
    reference_title: "Severe Phenotype in a Patient With Homozygous 15q21.2 Microdeletion Involving BCL2L10, GNB5, and MYO5C Genes, Resembling Infantile Developmental Disorder With Cardiac Arrhythmias (IDDCA)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the first case of a patient carrying a homozygous 15q21.2 microdeletion, encompassing GNB5 and the two contiguous genes BCL2L10 and MYO5C."
    explanation: Whole-gene deletion gives the severe form, consistent with loss of function.

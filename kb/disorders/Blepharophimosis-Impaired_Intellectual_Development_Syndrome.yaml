    reduction in the VERTICAL distance between the upper and lower eyelids
    together with short (that is, horizontally reduced) palpebral fissures — both
    axes, not the horizontal one alone. This is the cardinal, disease-defining
    facial feature of BIS and gives the syndrome its name.
  frequency: VERY_FREQUENT
  notes: >

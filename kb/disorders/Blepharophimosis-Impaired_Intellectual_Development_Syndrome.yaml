    explanation: Independent confirmation of SMARCA2 as the BIS disease gene.
diagnosis:
- name: Molecular genetic testing for a de novo non-helicase-domain SMARCA2 variant
  description: >
    The diagnosis is established by identification of a heterozygous de novo
    SMARCA2 variant lying outside the helicase domains, in an
    individual with the BIS facial gestalt (blepharophimosis, epicanthal folds,
    downturned nasal tip) and developmental delay/intellectual disability. In the
    founding cohort the variants were found by next-generation (exome/genome)
    sequencing. Variant position within SMARCA2 is itself diagnostically
    informative because it separates BIS from Nicolaides-Baraitser syndrome.
  evidence:
  - reference: PMID:32694869
    reference_title: "De novo SMARCA2 variants clustered outside the helicase domain cause a new recognizable syndrome with intellectual disability and blepharophimosis distinct from Nicolaides-Baraitser syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By next-generation sequencing, we identified candidate variants in SMARCA2 in 20 individuals from 18 families"
    explanation: >
      Next-generation sequencing was the route by which the causal SMARCA2
      variants were identified in the founding BIS cohort.
- name: DNA methylation episignature testing
  description: >
    Genome-wide DNA methylation profiling of blood leukocytes yields a
    reproducible BIS episignature that separates BIS from Nicolaides-Baraitser
    syndrome and from SMARCA2-variant carriers with nonspecific phenotypes, and
    can therefore be used to resolve SMARCA2 variants of uncertain significance.
    Note an important interpretive caveat: the BIS episignature is NOT unique to
    SMARCA2 — it is shared with class II Helsmoortel-Van der Aa syndrome caused
    by truncating ADNP variants, so a positive episignature must be read together
    with the sequencing result.
  evidence:
  - reference: PMID:32694869
    reference_title: "De novo SMARCA2 variants clustered outside the helicase domain cause a new recognizable syndrome with intellectual disability and blepharophimosis distinct from Nicolaides-Baraitser syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Transcriptomic and DNA methylation signatures differentiated NCBRS from BIS and those with nonspecific phenotype."
    explanation: >
      Establishes that methylation (and transcriptomic) profiling discriminates
      BIS from NCBRS and from unclassified SMARCA2-variant carriers.
  - reference: PMID:38884529
    reference_title: "Blepharophimosis with intellectual disability and Helsmoortel-Van Der Aa Syndrome share episignature and phenotype."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "A distinct episignature was shared by 15 individuals with BIS-causing SMARCA2 pathogenic variants and 12 individuals with class II HVDAS caused by truncating pathogenic ADNP variants."
    explanation: >
      Supports the caveat rather than the assay's specificity: the BIS
      episignature is reproducible across 15 BIS individuals but is shared with
      ADNP-related class II HVDAS, so it is phenotype-specific rather than
      gene-specific. Recorded as PARTIAL because it qualifies, rather than
      simply endorses, the diagnostic claim.
- name: Yeast functional assay for SMARCA2 variant stratification
  description: >
    Heterologous expression of SMARCA2 variants in yeast produced growth
    phenotypes that separated NCBRS-causing from non-NCBRS SMARCA2 variants,
    providing an orthogonal functional readout used to stratify variant
    interpretation. This is a research assay, not a clinical test.
  evidence:
  - reference: PMID:32694869
    reference_title: "De novo SMARCA2 variants clustered outside the helicase domain cause a new recognizable syndrome with intellectual disability and blepharophimosis distinct from Nicolaides-Baraitser syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Yeast phenotype assays differentiated NCBRS from non-NCBRS SMARCA2 variants."
    explanation: >
      Documents the yeast assay and exactly what it discriminates. Classified
      IN_VITRO because the readout is a heterologous yeast growth assay, not a
      human clinical observation.
pathophysiology:
- name: Non-Helicase-Domain SMARCA2 Variants Perturb the BAF Chromatin Remodeling Complex
  biological_scale: MOLECULAR
  description: >
    SMARCA2 (BRM) encodes a catalytic ATPase subunit of the BAF (SWI/SNF)
    chromatin remodeling complex, which uses ATP hydrolysis to reposition
    nucleosomes and thereby control transcription. BIS-causing variants
    cluster outside the helicase (ATPase) domains, a
    positionally distinct class from the helicase-domain variants that cause
    Nicolaides-Baraitser syndrome. Yeast growth-phenotype assays separate the two
    variant classes functionally, indicating that BIS variants do not simply
    reproduce the NCBRS lesion. The precise biochemical consequence of the BIS
    variant class (for example, altered subunit assembly, altered targeting, or
    altered non-catalytic regulatory function rather than loss of ATPase
    activity) has not been resolved.
  biological_processes:
  - preferred_term: chromatin remodeling
    term:
      id: GO:0006338
      label: chromatin remodeling
    modifier: ABNORMAL
  molecular_functions:
  - preferred_term: ATP-dependent chromatin remodeler activity
    term:
      id: GO:0140658
      label: ATP-dependent chromatin remodeler activity
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: BAF (SWI/SNF) complex
    term:
      id: GO:0016514
      label: SWI/SNF complex
  downstream:
  - target: Altered Transcriptional and DNA Methylation Programs
    description: >-
      Perturbation of BAF-mediated nucleosome remodeling changes the
      transcriptional output and the genome-wide DNA methylation landscape of
      patient cells, producing the BIS-specific transcriptomic and episignature
      profiles measurable in blood leukocytes.
    evidence:
    - reference: PMID:32694869
      reference_title: "De novo SMARCA2 variants clustered outside the helicase domain cause a new recognizable syndrome with intellectual disability and blepharophimosis distinct from Nicolaides-Baraitser syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Transcriptomic and DNA methylation signatures differentiated NCBRS from BIS and those with nonspecific phenotype."
      explanation: >
        Demonstrates that the BIS variant class produces its own measurable
        transcriptomic and methylation consequence, distinct from that of NCBRS.
  - target: BAF Subunit Switching in Neural Development
    description: >-
      A SMARCA2 lesion is carried into the neural-progenitor BAF (npBAF)
      complexes in which BRM is an ATPase, so the remodeling defect is expressed
      in the compartment whose BAF composition is developmentally regulated.
    evidence:
    - reference: PMID:17640523
      reference_title: "An essential switch in subunit composition of a chromatin remodeling complex during neural development."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "are quantitatively associated with the \nSWI2/SNF2-like ATPases, Brg and Brm."
      explanation: >
        Establishes that BRM (SMARCA2) is a constituent ATPase of neural
        progenitor BAF complexes, which is what makes this edge possible.
        PARTIAL because the presence of BRM in npBAF is shown, not the behaviour
        of a BIS allele within it.
  evidence:
  - reference: PMID:38884529
    reference_title: "Blepharophimosis with intellectual disability and Helsmoortel-Van Der Aa Syndrome share episignature and phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SMARCA2, that encodes the catalytic subunit of the superfamily II helicase group of the BRG1 and BRM-associated factors (BAF) forming the BAF complex, a chromatin remodeling complex involved in transcriptional regulation"
    explanation: >
      Establishes SMARCA2 as the catalytic ATPase subunit of the BAF chromatin
      remodeling complex and its role in transcriptional regulation, supporting
      the GO chromatin-remodeling, remodeler-activity, and SWI/SNF-complex
      annotations on this node.
  - reference: PMID:32694869
    reference_title: "De novo SMARCA2 variants clustered outside the helicase domain cause a new recognizable syndrome with intellectual disability and blepharophimosis distinct from Nicolaides-Baraitser syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Yeast phenotype assays differentiated NCBRS from non-NCBRS SMARCA2 variants."
    explanation: >
      Functional (yeast) evidence that BIS-class SMARCA2 variants behave
      differently from NCBRS-class variants, supporting the claim that the BIS
      lesion is mechanistically distinct rather than a milder NCBRS.
  - reference: PMID:37500730
    reference_title: "Landscape of mSWI/SNF chromatin remodeling complex perturbations in neurodevelopmental disorders."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "whereas mutations within the SMARCA2 helicase \ncause NCBRS, SMARCA2 mutations outside of this domain are"
    explanation: >
      Independent confirmation, from a pan-mSWI/SNF structural and variant-landscape
      analysis by a different group, that the SMARCA2 positional dichotomy
      (helicase-domain versus non-helicase-domain) maps onto the NCBRS/BIS
      disease split. COMPUTATIONAL because this paper is a structural and
      variant-aggregation analysis, not a wet-lab assay of BIS alleles.
  - reference: PMID:37500730
    reference_title: "Landscape of mSWI/SNF chromatin remodeling complex perturbations in neurodevelopmental disorders."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "Non-truncating NDD-associated protein variants predominantly disrupt \nthe cBAF subcomplex and cluster in four key structural regions associated with \nhigh disease severity, including mSWI/SNF-nucleosome interfaces, the ATPase-core \nARID-armadillo repeat (ARM) module insertion site, the Arp module and \nDNA-binding domains."
    explanation: >
      Provides the structural framework within which the non-catalytic BIS
      variant cluster is interpretable — non-truncating mSWI/SNF NDD variants
      concentrate at inter-subunit and nucleosome-engagement interfaces rather
      than only at the catalytic core. PARTIAL because the statement is about
      mSWI/SNF NDD variants in aggregate, not specifically about the BIS allele
      set; the BIS alleles were not individually assayed here.
  - reference: PMID:9843504
    reference_title: "Altered control of cellular proliferation in the absence of mammalian brahma (SNF2alpha)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the BRM (SNF2alpha) and BRG1 (SNF2beta) proteins are \nmutually exclusive subunits that are believed to affect nucleosomal structures \nusing the energy of ATP hydrolysis."
    explanation: >
      Establishes the background biology asserted in this node and in the entry
      description: SMARCA2 (BRM) and SMARCA4 (BRG1) are the two mutually
      exclusive ATPase subunits of the SWI/SNF complex and act by ATP-driven
      nucleosome remodeling. Classified MODEL_ORGANISM because the publication
      reports a mouse Brm-knockout study.
- name: Altered Transcriptional and DNA Methylation Programs
  biological_scale: CELLULAR
  description: >
    Cells from individuals with BIS carry a reproducible, disease-specific
    transcriptomic profile and a genome-wide DNA methylation episignature that is
    detectable in peripheral blood leukocytes and that distinguishes BIS from
    NCBRS. Notably, the BIS episignature is shared with class II
    Helsmoortel-Van der Aa syndrome (truncating ADNP variants), consistent with
    known molecular interaction between ADNP and the BAF complex and with the
    overlapping narrow-palpebral-fissure craniofacial phenotype of the two
    conditions. This is the first reported instance of a phenotype-specific
    rather than gene-specific episignature.
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    modifier: ABNORMAL
  downstream:
  - target: Abnormal Craniofacial and Neurodevelopmental Patterning
    description: >-
      The shared BIS/HVDAS episignature tracks with a shared craniofacial
      phenotype (narrowing of the palpebral fissures), linking the altered
      chromatin/transcriptional program to the recognizable facial gestalt and
      the neurodevelopmental outcome.
    evidence:
    - reference: PMID:38884529
      reference_title: "Blepharophimosis with intellectual disability and Helsmoortel-Van Der Aa Syndrome share episignature and phenotype."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "an overlapping craniofacial phenotype with narrowing of the palpebral fissures in a subset of patients with HVDAS and BIS"
      explanation: >
        Ties the shared methylation program to a shared craniofacial outcome.
        PARTIAL because the correspondence is an observed association between
        episignature and phenotype, not a demonstrated causal chain from
        methylation change to facial morphogenesis.
  evidence:
  - reference: PMID:38884529
    reference_title: "Blepharophimosis with intellectual disability and Helsmoortel-Van Der Aa Syndrome share episignature and phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This represents first evidence of a sensitive phenotype-specific episignature biomarker shared across distinct genetic conditions that also exhibit unique gene-specific episignatures."
    explanation: >
      Characterizes the BIS methylation program as a phenotype-specific
      episignature shared with another genetic condition, which is the
      substantive claim of this node.
  - reference: PMID:38884529
    reference_title: "Blepharophimosis with intellectual disability and Helsmoortel-Van Der Aa Syndrome share episignature and phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to molecular interactions between ADNP and BAF complex"
    explanation: >
      Supports the mechanistic rationale for why a SMARCA2/BAF disorder and an
      ADNP disorder converge on the same methylation program.
  - reference: PMID:38751117
    reference_title: "DNA methylation analysis in patients with neurodevelopmental disorders improves variant interpretation and reveals complexity."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "common \nepisignatures affecting homologous residues in highly conserved paralogous \nproteins (SMARCA2 M856V and SMARCA4 M866V)"
    explanation: >
      Supports the narrower, directly quoted claim that a specific SMARCA2
      missense allele and its structurally homologous SMARCA4 counterpart
      converge on a common DNA methylation program — reinforcing that SMARCA2
      missense variants produce reproducible, residue-level epigenomic
      consequences. PARTIAL and deliberately scoped: this abstract does NOT
      state that its SMARCA2 M856V case has BIS. p.Met856Val is listed as a BIS
      allele in the Sarli et al. variant table, but that table is in the
      paywalled full text and is not quotable here, so the BIS attribution is
      flagged as inference rather than asserted.
- name: BAF Subunit Switching in Neural Development
  biological_scale: CELLULAR
  description: >
    The route from a BAF-complex lesion to a neurodevelopmental phenotype runs
    through the developmentally regulated subunit composition of neural BAF
    complexes. SMARCA2 (Brm) is one of the two ATPases found in the
    neural-progenitor BAF (npBAF) complex, and an obligatory switch in the
    accessory subunits of these complexes accompanies — and is required for —
    the transition from proliferating neural progenitors to postmitotic neurons.
    A SMARCA2 lesion therefore acts on a complex whose correct composition and
    activity are rate-limiting for neuronal differentiation.
  notes: >
    Scope caveat: this node is general BAF neurobiology, not BIS-specific. The
    cited work characterizes the npBAF-to-nBAF subunit switch in mouse neural
    stem/progenitor cells; no study has tested a BIS-class SMARCA2 allele in this
    system. It is included because it supplies the only published mechanistic
    bridge between BAF perturbation and a neurodevelopmental outcome, and its
    evidence items are marked PARTIAL accordingly.
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  biological_processes:
  - preferred_term: neuron differentiation
    term:
      id: GO:0030182
      label: neuron differentiation
    modifier: ABNORMAL
  cellular_components:
  - preferred_term: npBAF complex
    term:
      id: GO:0071564
      label: npBAF complex
  evidence:
  - reference: PMID:17640523
    reference_title: "An essential switch in subunit composition of a chromatin remodeling complex during neural development."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "are quantitatively associated with the \nSWI2/SNF2-like ATPases, Brg and Brm."
    explanation: >
      Places Brm (SMARCA2) in the neural progenitor BAF complex, which is the
      premise of this node. PARTIAL because it establishes SMARCA2's presence in
      npBAF, not the effect of a BIS allele. IN_VITRO because the subunit
      composition was determined by proteomic analysis of neural stem/progenitor
      cell complexes.
  - reference: PMID:17640523
    reference_title: "An essential switch in subunit composition of a chromatin remodeling complex during neural development."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Preventing the subunit switch impairs neuronal differentiation, \nindicating that this molecular event is essential for the transition from neural \nstem/progenitors to postmitotic neurons."
    explanation: >
      Establishes that correct BAF subunit composition is required for neuronal
      differentiation, which is why a BAF-subunit lesion can produce a
      neurodevelopmental disorder. PARTIAL: the perturbation tested was the
      subunit switch itself, not a SMARCA2 disease variant.
  downstream:
  - target: Abnormal Craniofacial and Neurodevelopmental Patterning
    description: >-
      Disruption of BAF activity in the neural progenitor compartment, where
      correct complex composition is required for the progenitor-to-neuron
      transition, is the proposed route to the developmental delay and
      intellectual disability arm of the BIS phenotype. This edge covers the
      neurodevelopmental arm only; no mechanism has been proposed linking
      SMARCA2 to periocular or midfacial morphogenesis.
    evidence:
    - reference: PMID:17640523
      reference_title: "An essential switch in subunit composition of a chromatin remodeling complex during neural development."
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "Preventing the subunit switch impairs neuronal differentiation, \nindicating that this molecular event is essential for the transition from neural \nstem/progenitors to postmitotic neurons."
      explanation: >
        Supports the causal step from perturbed neural BAF composition to
        impaired neuronal differentiation. PARTIAL because the link from this
        cell-biological defect to human intellectual disability in BIS is
        inferred, not demonstrated.
- name: Abnormal Craniofacial and Neurodevelopmental Patterning
  biological_scale: ORGANISM
  description: >
    The downstream clinical expression of the altered BAF-dependent
    transcriptional program is a recognizable, reproducible combination of
    periocular and midfacial dysmorphism (blepharophimosis, epicanthal folds,
    downturned nasal tip) with global developmental delay and intellectual
    disability of variable severity. The specific developmental programs and cell
    populations that translate BAF dysfunction into this particular facial
    gestalt have not been identified.
  biological_processes:
  - preferred_term: nervous system development
    term:
      id: GO:0007399
      label: nervous system development

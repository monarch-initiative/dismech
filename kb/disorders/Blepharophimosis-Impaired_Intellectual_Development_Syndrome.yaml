animal_models:
- species: mouse (Mus musculus)
  genotype: Germline Brm (Smarca2) knockout
  category: Germline loss-of-function model
  genes:
  - preferred_term: SMARCA2
    term:
      id: hgnc:11098
      label: SMARCA2
  description: >
    The only long-established Smarca2 mouse model is a germline Brm knockout.
    It is explicitly NOT a model of BIS: homozygous null mice develop normally,
    apparently because BRG1 (SMARCA4) is upregulated and functionally substitutes
    for BRM. This is doubly informative — it argues against simple SMARCA2
    haploinsufficiency as the BIS mechanism, and it means a knockout cannot test
    the actual BIS lesion: deleting the gene removes the protein entirely, so a
    null model cannot report on a heterozygous de novo allele whose defining,
    directly evidenced property is WHERE in SMARCA2 it sits (clustered outside
    the helicase domains as the founding paper partitions them). No BIS hotspot
    knock-in mouse has been reported.
  associated_phenotypes:
  - Normal development in homozygous null mice
  - Increased adult body weight (approximately 15 percent over littermates)
  - Impaired G0/G1 cell-cycle arrest in mutant embryonic fibroblasts
  evidence:
  - reference: PMID:9843504
    reference_title: "Altered control of cellular proliferation in the absence of mammalian brahma (SNF2alpha)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "BRM-/- mice develop normally, suggesting that an \nobserved up-regulation of the BRG1 protein can functionally replace BRM in the \nSWI-SNF complexes of mutant cells."
    explanation: >
      Documents both the normal phenotype of the Brm-null mouse and the proposed
      BRG1 compensation, which together explain why this model does not
      recapitulate a human SMARCA2 disorder.
  - reference: PMID:9843504
    reference_title: "Altered control of cellular proliferation in the absence of mammalian brahma (SNF2alpha)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "mutant embryonic fibroblasts were significantly deficient in their ability to arrest in \nthe G0/G1 phase of the cell cycle in response to cell confluency or DNA damage."
    explanation: >
      The one reproducible cellular phenotype of Brm loss in this model. Recorded
      for completeness; its relevance to BIS neurodevelopment is unproven.
mechanistic_hypotheses:
- hypothesis_group_id: bis_interface_perturbation_vs_ncbrs_catalysis
  hypothesis_label: >-
    BIS alleles perturb BAF inter-subunit interfaces, whereas NCBRS alleles
    impair ATPase catalysis
  status: EMERGING
  description: >
    The leading explanatory model for why two allelic SMARCA2 disorders exist is
    that the two variant classes damage different properties of the same
    protein. NCBRS variants localize to ultra-conserved catalytic ATPase motifs
    and are proposed to impair ATPase activity while leaving complex assembly
    intact. BIS variants localize outside those motifs, and non-truncating
    mSWI/SNF neurodevelopmental variants in general concentrate at inter-subunit
    and nucleosome-engagement interfaces — suggesting that BIS is an
    assembly/engagement lesion rather than a catalytic one. Both classes act
    dominantly from heterozygous de novo variants. The argument against simple
    SMARCA2 haploinsufficiency deliberately does NOT rest on the BIS variant
    consequence class, which this entry does not assert (see genetic[].notes).
    It rests on two other observations: complete germline loss of mouse Brm
    yields a phenotypically normal animal through BRG1 compensation, so pure
    loss of SMARCA2 is buffered rather than pathogenic; and BIS individuals
    nevertheless carry a reproducible DNA methylation episignature — a positive,
    directional change in the chromatin output of the complex, not a silent
    dosage reduction.
  notes: >
    Status is EMERGING, not CANONICAL, deliberately. The NCBRS arm rests on the
    founding paper's own stated inference ("likely do not impair SWI/SNF complex
    assembly but may be associated with disrupted ATPase activity"), not on a
    direct assembly assay. The BIS arm rests on variant position plus a
    pan-mSWI/SNF structural analysis that did not assay BIS alleles, plus a yeast
    growth assay that shows only that the two classes differ. No biochemical
    measurement of BAF assembly, subunit engagement, or nucleosome remodeling has
    been published for any BIS allele.
  evidence:
  - reference: PMID:22366787
    reference_title: "Heterozygous missense mutations in SMARCA2 cause Nicolaides-Baraitser syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "These alterations likely do not impair \nSWI/SNF complex assembly but may be associated with disrupted ATPase activity."
    explanation: >
      The NCBRS arm of the hypothesis, stated by the authors as an inference
      ("likely", "may be") from variant position rather than from a direct assay
      — hence PARTIAL.
  - reference: PMID:37500730
    reference_title: "Landscape of mSWI/SNF chromatin remodeling complex perturbations in neurodevelopmental disorders."
    supports: PARTIAL
    evidence_source: COMPUTATIONAL
    snippet: "Non-truncating NDD-associated protein variants predominantly disrupt \nthe cBAF subcomplex and cluster in four key structural regions associated with \nhigh disease severity, including mSWI/SNF-nucleosome interfaces, the ATPase-core \nARID-armadillo repeat (ARM) module insertion site, the Arp module and \nDNA-binding domains."
    explanation: >
      The interface arm of the hypothesis: non-truncating mSWI/SNF NDD variants
      concentrate at structural interfaces. PARTIAL because this is an aggregate
      structural analysis across the complex, not a demonstration for BIS alleles.
  - reference: PMID:32694869
    reference_title: "De novo SMARCA2 variants clustered outside the helicase domain cause a new recognizable syndrome with intellectual disability and blepharophimosis distinct from Nicolaides-Baraitser syndrome."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Yeast phenotype assays differentiated NCBRS from non-NCBRS SMARCA2 variants."
    explanation: >
      Functional support that the two allele classes are distinct, without
      identifying which property each one damages — the reason this hypothesis is
      EMERGING rather than CANONICAL.
discussions:
- discussion_id: gap_bis_smarca2_variant_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    What is the biochemical consequence of the BIS-class (non-helicase-domain)
    SMARCA2 variants, and is BIS a loss-of-function, gain-of-function, or
    dominant-negative disorder?
  rationale: >
    The BIS variant class is defined positionally (outside the helicase domains)
    and is known only to behave differently from NCBRS variants in a yeast growth
    assay. Whether these variants reduce ATPase-dependent remodeling, alter BAF
    complex assembly or genomic targeting, or perturb a non-catalytic regulatory
    function of SMARCA2 has not been established. Without this, the mechanism
    node in this entry can only be annotated as ABNORMAL rather than
    INCREASED/DECREASED, and no rational therapeutic target can be nominated.
  attaches_to:
  - pathophysiology#Non-Helicase-Domain SMARCA2 Variants Perturb the BAF Chromatin Remodeling Complex
  proposed_experiments:
  - experiment_id: exp_bis_baf_reconstitution
    name: Biochemical reconstitution of BIS-variant BAF complexes
    description: >-
      Reconstitute BAF complexes carrying BIS-class SMARCA2 variants and measure
      nucleosome remodeling and ATPase activity directly, in parallel with
      NCBRS-class variants and wild type.
  - experiment_id: exp_bis_baf_occupancy_chip
    name: Comparative BAF genomic occupancy in isogenic lines
    description: >-
      Perform ChIP-seq/CUT&RUN for BAF subunits in isogenic cell lines carrying
      BIS-class versus NCBRS-class SMARCA2 variants to test whether the BIS
      lesion alters genomic targeting rather than catalytic activity.
  - experiment_id: exp_bis_allele_series_organoid
    name: SMARCA2 allele-series modeling in human neural systems
    description: >-
      Model a SMARCA2 allele series (BIS variants, NCBRS variants, null) in human
      neural progenitors and cerebral organoids to test whether BIS variants
      phenocopy SMARCA2 knockout.
  evidence:
  - reference: PMID:32694869
    reference_title: "De novo SMARCA2 variants clustered outside the helicase domain cause a new recognizable syndrome with intellectual disability and blepharophimosis distinct from Nicolaides-Baraitser syndrome."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "Yeast phenotype assays differentiated NCBRS from non-NCBRS SMARCA2 variants."
    explanation: >
      Marks the current limit of functional knowledge: the only published
      functional discrimination of BIS-class SMARCA2 variants is a heterologous
      yeast growth phenotype, which establishes that they differ from NCBRS
      variants but not in which direction SMARCA2 function is altered. PARTIAL
      because it frames the gap rather than answering it.
- discussion_id: gap_bis_natural_history_and_management
  kind: KNOWLEDGE_GAP
  prompt: >-
    What is the natural history of BIS, and are there condition-specific
    surveillance or management recommendations?
  rationale: >
    BIS was delineated only in 2020 and has no GeneReviews chapter (searched:
    no GeneReviews article exists for BIS or for a SMARCA2 disorder other than
    the NCBRS chapter, PMID:26468571). Published data are cross-sectional
    dysmorphology and molecular analyses; there are no longitudinal outcome data,
    no reported adult outcomes, and no BIS-specific management or surveillance
    guideline. Management is therefore currently generic developmental-disability
    care, and this entry deliberately curates only genetic counseling rather than
    importing the NCBRS management plan.
  proposed_experiments:
  - experiment_id: exp_bis_natural_history_registry
    name: Prospective BIS natural-history registry
    description: >-
      Establish a prospective natural-history study or patient registry across
      the international BIS referral network, collecting uniform developmental,
      neurologic, ophthalmologic, and adult-outcome data.
  - experiment_id: exp_bis_ophthalmologic_assessment
    name: Systematic ophthalmologic assessment of BIS blepharophimosis
    description: >-
      Systematically assess visual axis obstruction, amblyopia risk, and surgical
      need in the blepharophimosis of BIS, to determine whether the eyelid
      surgery pathway used in other blepharophimosis syndromes applies here.
  evidence:
  - reference: PMID:38884529
    reference_title: "Blepharophimosis with intellectual disability and Helsmoortel-Van Der Aa Syndrome share episignature and phenotype."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Blepharophimosis with intellectual disability (BIS) is a recently recognized disorder"
    explanation: >
      Supports the premise of the gap: BIS was only recently delineated, which is
      why no longitudinal natural-history data or condition-specific management
      guideline yet exists. PARTIAL because it establishes the recency, not the
      absence of guidelines per se.
- discussion_id: mismatch_bis_smarca2_mouse_null
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Can any existing Smarca2 mouse model represent BIS, given that the germline
    Brm-null mouse develops normally through BRG1 compensation while BIS is
    caused by a heterozygous de novo allele clustered outside the helicase
    domains?
  rationale: >
    The available Smarca2 animal model is a germline knockout, and it does not
    reproduce a disease phenotype: Brm-null mice develop normally, apparently
    because BRG1 (SMARCA4) is upregulated and substitutes functionally. This is a
    genuine model/human mismatch rather than merely absent evidence. It matters in
    two directions. First, it is one of the strongest arguments that BIS is not
    caused by SMARCA2 haploinsufficiency, since removing the gene entirely in
    mouse produces nothing resembling the human disorder. Second, it means no
    existing in vivo system can test the actual BIS lesion, because a null allele
    cannot model a dominant, position-specific allele: complete deletion cannot
    report on a lesion whose only directly evidenced property is its location
    within SMARCA2. Nor does the null mouse produce the positive human readout
    of the BIS lesion, the DNA methylation episignature; whether a null allele
    could generate that signature has never been tested, which is itself part of
    the mismatch. (This entry does not assert the BIS variant consequence class;
    see genetic[].notes.) Any mouse-derived
    negative result about SMARCA2 loss must therefore not be read as evidence
    about BIS.
  attaches_to:
  - pathophysiology#Non-Helicase-Domain SMARCA2 Variants Perturb the BAF Chromatin Remodeling Complex
  proposed_experiments:
  - experiment_id: exp_bis_hotspot_knockin_mouse
    name: BIS hotspot knock-in mouse
    description: >-
      Generate heterozygous knock-in mice carrying a recurrent BIS hotspot allele
      (for example the Arg525 or Arg937 substitutions) rather than a null allele,
      and assess craniofacial morphogenesis, neurodevelopmental behaviour, and
      the blood methylation profile against the human episignature.
  - experiment_id: exp_bis_brg1_compensation_test
    name: Test BRG1 compensation in the presence of a BIS allele
    description: >-
      Determine whether SMARCA4/BRG1 upregulation can compensate for a BIS-class
      SMARCA2 allele as it does for a null allele, or whether the mutant BRM
      protein blocks compensation by occupying the complex.
  evidence:
  - reference: PMID:9843504
    reference_title: "Altered control of cellular proliferation in the absence of mammalian brahma (SNF2alpha)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "BRM-/- mice develop normally, suggesting that an \nobserved up-regulation of the BRG1 protein can functionally replace BRM in the \nSWI-SNF complexes of mutant cells."
    explanation: >
      Directly documents the mismatch: complete loss of mouse Brm gives a normal
      animal, so this model cannot represent a dominant human SMARCA2 missense
      disorder, and BRG1 compensation is the proposed reason.
notes: >
  NEC (named entity confusion) guardrail for future curators: SMARCA2 causes TWO
  distinct disorders. This entry is BIS (OMIM:619293, MONDO:0859139). The other
  is Nicolaides-Baraitser syndrome (OMIM:601358, MONDO:0011053 — MONDO labels it
  "intellectual disability-sparse hair-brachydactyly syndrome"), which accounts
  for the large majority of published SMARCA2 clinical literature. Before adding
  any SMARCA2 evidence to this file, confirm the individuals described are BIS
  and not NCBRS.

  Worked NEC exclusions from this curation round — these SMARCA2 papers were read
  and deliberately NOT used as BIS evidence:
  PMID:40513420 (Seizure 2025, genotype-phenotype in epilepsy patients with
  SMARCA2 variants) reports that 77.3 percent of variants across its combined
  cohort lie in the SNF2-ATPase domain, i.e. the NCBRS allele class, so its
  epilepsy and antiseizure-medication data describe NCBRS-type disease, not BIS.
  PMID:38877377 (Prenat Diagn 2024, caudal regression with a de novo SMARCA2
  variant) is framed within the NCBRS spectrum. PMID:42528014, PMID:34906496,
  PMID:34706719 and PMID:38751117 are multi-gene BAFopathy or chromatin-remodeling
  cohort papers whose abstracts do not state which SMARCA2 disorder their patients
  have. (PMID:38751117 is cited once, but only for a residue-level paralog
  observation, with the BIS attribution flagged as inference — see the
  episignature pathophysiology node.) PMID:26468571 is the GeneReviews chapter for
  NCBRS and is not applicable here.

  Two general-biology papers that are NOT about BIS are cited on purpose, each
  clearly scoped: PMID:17640523 (npBAF/nBAF subunit switching in mouse neural
  progenitors) and PMID:9843504 (Brm-null mouse). Their evidence items are
  PARTIAL or explicitly labelled as background/model-mismatch, never as BIS
  clinical data. PMID:37500730 is a pan-mSWI/SNF structural analysis that does
  contain an explicit BIS-versus-NCBRS statement, quoted directly.

  Evidence-base limitation: both primary BIS papers are paywalled and are not in
  PMC or Europe PMC, so only their abstracts are cached and quotable. This caps
  the phenotype detail that can be evidenced here. The HPO annotation of
  OMIM:619293 (all sourced to PMID:32694869) records a much richer feature list
  with n/N counts drawn from the paper's full-text tables — including hypotonia,
  thin upper lip vermilion, sparse eyebrows and eyelashes, wide nasal bridge,
  tapered fingers, hypertelorism, frontal bossing, and flexion contractures —
  none of which can be quoted verbatim from the abstracts. Those features are
  deliberately NOT curated as phenotype entries rather than being asserted
  without evidence; they are the obvious enrichment target if full text becomes
  available.

  Orphanet (ORPHA:637013) also indexes this disorder and would supply
  frequency-banded HPO annotations, but the pinned Orphadata snapshot in
  data/orphadata/MANIFEST.yaml no longer matches the upstream files (checksum
  mismatch on download), and bumping that manifest is out of scope for a
  single-disorder PR. No ORPHA evidence is therefore cited. A ClinGen
  gene-disease validity or dosage record for SMARCA2 is likewise not cited: no
  SMARCA2 record exists in this repository's ClinGen cache, and refreshing it
  would require touching data/clingen*/MANIFEST.yaml.

  No GeneReviews chapter exists for BIS. This was checked with three PubMed
  queries (blepharophimosis GeneReviews, SMARCA2 GeneReviews,
  Nicolaides-Baraitser GeneReviews); the only SMARCA2 chapter returned is
  PMID:26468571, "SMARCA2-Related Nicolaides-Baraitser Syndrome", which is the
  other disorder and is therefore not used as a phenotype baseline here.

  INVERSE-PHARMACOLOGY GUARDRAIL — SMARCA2-lowering oncology drugs are NOT a BIS
  therapy and must never be curated as one. A live clinical drug class targets
  SMARCA2 (BRM) for REMOVAL, as a synthetic-lethal strategy in SMARCA4
  (BRG1)-deficient cancers. Verified against ClinicalTrials.gov on 2026-08-01:
  the SMARCA2 degraders PRT7732 (NCT06560645, terminated), PRT3789 (NCT05639751,
  completed; and PRT3789 plus pembrolizumab, NCT06682806, terminated) and
  PLX-61639 (NCT07284186, recruiting, officially titled a first-in-human study
  of "the SMARCA2 Degrader, PLX-61639"), together with the selective SMARCA2/BRM
  INHIBITOR LY4050784 (NCT06561685, recruiting). Note that LY4050784 is an
  inhibitor rather than a degrader; both modalities reduce SMARCA2 function and
  both are therefore inverse to a SMARCA2-opathy. BIS is caused by a
  heterozygous de novo SMARCA2 variant, so lowering SMARCA2 dose or activity
  further is the opposite of therapeutic intent. The trial protocols themselves
  point the same way: NCT07284186 excludes participants with "Known SMARCA2
  mutation or loss of expression", and NCT06561685 excludes participants with
  known or likely SMARCA2 loss-of-function alteration. None of these agents is
  curated as a BIS treatment and none should be. An automated pipeline mining
  "SMARCA2 + drug" or "SMARCA2 + NCT" will surface this entire class; it must be
  filtered out of BIS treatment curation. Recorded per the deep-research
  report's explicit critical-negative instruction (section 12.3).

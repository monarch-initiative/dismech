    the founding delineation and the subsequent series describe BIS as presenting
    with blepharophimosis, and it is listed among the recurrent features of the
    recognizable phenotype. The HPO annotation of OMIM:619293 records
    blepharophimosis in 14/14 of the Cappuccio cohort, but that count is taken
    from the paper's full-text table (the article is not open access), so it
    cannot be quoted as a snippet here and is recorded only as provenance.

differential_diagnoses:
- name: Nicolaides-Baraitser syndrome
  disease_term:
    preferred_term: Nicolaides-Baraitser syndrome
    term:
      id: MONDO:0011053
      label: intellectual disability-sparse hair-brachydactyly syndrome
  description: >
    NCBRS is the other, far better known, SMARCA2-related disorder (OMIM 601358).
    It is allelic to BIS but is a separate clinical and molecular entity. This is
    the single most important named-entity distinction for this file: the large
    majority of published SMARCA2 clinical literature describes NCBRS, and NCBRS
    cohort data must NOT be attributed to BIS.
  distinguishing_features:
  - Variant position - NCBRS variants lie predominantly INSIDE the SMARCA2 helicase (ATPase) domains, whereas all reported BIS variants lie OUTSIDE them. Position within the gene is the primary molecular discriminator.
  - Ascertainment - the BIS cohort was deliberately assembled from individuals with a syndromic neurodevelopmental disorder judged NOT consistent with NCBRS, so the two entities were separated clinically before they were separated molecularly.
  - Facial gestalt - BIS is defined by blepharophimosis, epicanthal folds, and a downturned nasal tip; NCBRS is defined by sparse scalp hair and prominent interphalangeal joints.
  - Functional assay - yeast growth-phenotype assays differentiate NCBRS-causing from non-NCBRS SMARCA2 variants.
  - Episignature and transcriptome - blood-leukocyte transcriptomic and DNA methylation signatures differentiate NCBRS from BIS.
  - Seizure burden - epilepsy is a prominent feature of NCBRS but is not part of the BIS definition; no seizure frequency is curated in this entry because importing the NCBRS epilepsy burden would materially misstate the BIS phenotype.
  - Proposed molecular lesion differs in kind, not degree - the NCBRS variants sit in ultra-conserved catalytic ATPase motifs and are proposed to disrupt ATPase activity while leaving SWI/SNF assembly intact; the BIS variants sit outside those motifs, so the two allele classes are not a severity gradient of one lesion.
  evidence:
  - reference: PMID:32694869
    reference_title: "De novo SMARCA2 variants clustered outside the helicase domain cause a new recognizable syndrome with intellectual disability and blepharophimosis distinct from Nicolaides-Baraitser syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "phenotypically and molecularly distinct from NCBRS"
    explanation: >
      The founding report's own conclusion is that BIS is a distinct entity from
      NCBRS on both clinical and molecular grounds.
  - reference: PMID:32694869
    reference_title: "De novo SMARCA2 variants clustered outside the helicase domain cause a new recognizable syndrome with intellectual disability and blepharophimosis distinct from Nicolaides-Baraitser syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nontruncating variants in SMARCA2, encoding a catalytic subunit of SWI/SNF chromatin remodeling complex, cause Nicolaides-Baraitser syndrome (NCBRS), a condition with intellectual disability and multiple congenital anomalies."
    explanation: >
      Identifies NCBRS as the pre-existing SMARCA2 disorder from which BIS had to
      be distinguished.
  - reference: PMID:38884529
    reference_title: "Blepharophimosis with intellectual disability and Helsmoortel-Van Der Aa Syndrome share episignature and phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blepharophimosis with intellectual disability (BIS) is a recently recognized disorder distinct from Nicolaides-Baraister syndrome"
    explanation: >
      Independent restatement that BIS is a distinct disorder from NCBRS. (The
      cited abstract spells the eponym "Nicolaides-Baraister"; the snippet is
      reproduced verbatim.)
  - reference: PMID:22366787
    reference_title: "Heterozygous missense mutations in SMARCA2 cause Nicolaides-Baraitser syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nicolaides-Baraitser syndrome (NBS) is characterized by sparse hair, distinctive \nfacial morphology, distal-limb anomalies and intellectual disability."
    explanation: >
      Supplies the NCBRS clinical definition from its own founding paper, which
      is what makes sparse hair and distal-limb anomalies usable as
      discriminators against the BIS gestalt.
  - reference: PMID:22366787
    reference_title: "Heterozygous missense mutations in SMARCA2 cause Nicolaides-Baraitser syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "mutations cluster within sequences that encode ultra-conserved motifs in the \ncatalytic ATPase region of the protein. These alterations likely do not impair \nSWI/SNF complex assembly but may be associated with disrupted ATPase activity."
    explanation: >
      Supports the distinguishing feature that the NCBRS allele class is
      catalytic-motif-localized and proposed to impair ATPase activity rather
      than complex assembly — the mechanistic counterpart to the positional
      contrast with the non-catalytic BIS cluster.
- name: Helsmoortel-Van der Aa syndrome (ADNP syndrome), class II
  disease_term:
    preferred_term: ADNP-related multiple congenital anomalies - intellectual disability - autism spectrum disorder
    term:
      id: MONDO:0014379
      label: ADNP-related multiple congenital anomalies - intellectual disability - autism spectrum disorder
  description: >
    HVDAS is caused by variants in ADNP; the class II subgroup is caused by
    truncating ADNP variants. A subset of individuals with HVDAS shares the
    narrow-palpebral-fissure craniofacial phenotype with BIS, and class II HVDAS
    shares the BIS DNA methylation episignature. HVDAS is therefore both a
    clinical and an epigenetic mimic of BIS. MONDO additionally carries a
    dedicated entity for this overlap, MONDO:0979360 (ADNP-related
    blepharophimosis-intellectual disability syndrome).
  distinguishing_features:
  - Causal gene - HVDAS is caused by ADNP variants (specifically truncating variants for class II), not SMARCA2; sequencing resolves the two unambiguously.
  - Episignature does NOT discriminate - the shared episignature is phenotype-specific rather than gene-specific, so methylation testing alone cannot separate BIS from class II HVDAS and must be interpreted with the sequencing result.
  - Mechanistic basis of the overlap - ADNP interacts molecularly with the BAF complex of which SMARCA2 is the catalytic subunit, which is the proposed explanation for the convergent methylation profile.
  evidence:
  - reference: PMID:38884529
    reference_title: "Blepharophimosis with intellectual disability and Helsmoortel-Van Der Aa Syndrome share episignature and phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A distinct episignature was shared by 15 individuals with BIS-causing SMARCA2 pathogenic variants and 12 individuals with class II HVDAS caused by truncating pathogenic ADNP variants."
    explanation: >
      Establishes the shared episignature between BIS and class II HVDAS, which
      is what makes HVDAS a genuine epigenetic differential for BIS.
  - reference: PMID:38884529
    reference_title: "Blepharophimosis with intellectual disability and Helsmoortel-Van Der Aa Syndrome share episignature and phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals bearing variants within the bipartite nuclear localization (BNL) signal domain of ADNP present with the neurodevelopmental disorder known as Helsmoortel-Van Der Aa Syndrome (HVDAS)."
    explanation: Identifies ADNP as the causal gene of HVDAS, the discriminating feature.
- name: SMARCA2-variant carriers with a nonspecific dysmorphic phenotype
  description: >
    Not every individual with a rare SMARCA2 variant has BIS or NCBRS. In the
    founding cohort, six of twenty SMARCA2-variant carriers had only nonspecific
    dysmorphic features and could not be assigned to either syndrome even after
    functional, transcriptomic, and methylation analysis. Their variants remained
    unclassified. This group is a reminder that a rare SMARCA2 variant is not by
    itself a BIS diagnosis.
  distinguishing_features:
  - Absence of the recognizable BIS facial gestalt (blepharophimosis plus epicanthal folds plus downturned nasal tip).
  - Failure to match the BIS transcriptomic or DNA methylation signature.
  - Variant remains of uncertain significance after multimodal stratification.
  evidence:
  - reference: PMID:32694869
    reference_title: "De novo SMARCA2 variants clustered outside the helicase domain cause a new recognizable syndrome with intellectual disability and blepharophimosis distinct from Nicolaides-Baraitser syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the remaining six individuals with nonspecific dysmorphic features, clinical and molecular data did not permit variant reclassification."
    explanation: >
      Directly documents the unclassifiable subgroup and the limits of current
      SMARCA2 variant interpretation.

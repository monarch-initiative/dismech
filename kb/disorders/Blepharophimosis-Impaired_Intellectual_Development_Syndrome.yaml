name: Blepharophimosis-Impaired Intellectual Development Syndrome
creation_date: '2026-08-01T00:00:00Z'
category: Mendelian
synonyms:
- BIS
- Blepharophimosis intellectual disability syndrome
- Blepharophimosis with intellectual disability
- SMARCA2-related blepharophimosis-intellectual disability syndrome
description: >
  Blepharophimosis-impaired intellectual development syndrome (BIS; OMIM 619293)
  is a rare neurodevelopmental disorder caused by de novo SMARCA2 variants that
  cluster OUTSIDE the helicase (ATPase) domains. SMARCA2 (BRM) is a catalytic
  ATPase subunit of the BAF (SWI/SNF) chromatin remodeling complex. Affected
  individuals have a recognizable facial gestalt — blepharophimosis, epicanthal
  folds, and a downturned nasal tip — together with developmental delay and a
  variable degree of intellectual disability.

  BIS is a distinct entity from Nicolaides-Baraitser syndrome (NCBRS,
  OMIM 601358, MONDO:0011053), the other SMARCA2-related disorder. Most NCBRS
  variants lie inside the helicase domains, and NCBRS is characterized clinically
  by sparse scalp hair, prominent interphalangeal joints, and frequent seizures —
  none of which is a defining feature of BIS. The separation is not only clinical:
  yeast growth-phenotype assays, blood-leukocyte transcriptomic profiles, and
  genome-wide DNA methylation (episignature) analysis each independently
  discriminate BIS from NCBRS. Because the great majority of the SMARCA2
  clinical literature concerns NCBRS, cohort data from NCBRS series must not be
  imported into this entry.

prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Ultra-rare and only recently delineated (2020). The founding report described
    14 individuals meeting the BIS phenotype out of 20 SMARCA2-variant carriers
    ascertained from 18 families; a later episignature study analysed 15
    individuals with BIS-causing SMARCA2 variants, drawn from a partly
    overlapping international referral network. The two counts are therefore NOT
    additive and no denominator-based population estimate exists. No
    population-based incidence or prevalence figure has been published.
  evidence:
  - reference: PMID:32694869
    reference_title: "De novo SMARCA2 variants clustered outside the helicase domain cause a new recognizable syndrome with intellectual disability and blepharophimosis distinct from Nicolaides-Baraitser syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 20 individuals, 14 showed a recognizable phenotype with recurrent features including epicanthal folds, blepharophimosis, and downturned nasal tip along with variable degree of intellectual disability (or blepharophimosis intellectual disability syndrome [BIS])."
    explanation: >
      Documents the size of the founding BIS case series (14 individuals) at
      disease delineation, supporting a cases-in-literature measure rather than
      a population rate.
  - reference: PMID:38884529
    reference_title: "Blepharophimosis with intellectual disability and Helsmoortel-Van Der Aa Syndrome share episignature and phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A distinct episignature was shared by 15 individuals with BIS-causing SMARCA2 pathogenic variants"
    explanation: >
      The largest subsequent BIS series comprised 15 individuals, confirming that
      the total reported population remains in the tens.
inheritance:
- name: Autosomal dominant inheritance
  description: >
    BIS results from heterozygous SMARCA2 variants that arose de novo in the
    reported probands. Inheritance is autosomal dominant; because
    every reported BIS variant has been de novo, sibling recurrence risk is low
    but not zero (germline mosaicism has not been excluded).
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:32694869
    reference_title: "De novo SMARCA2 variants clustered outside the helicase domain cause a new recognizable syndrome with intellectual disability and blepharophimosis distinct from Nicolaides-Baraitser syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a novel recognizable syndrome named BIS associated with clustered de novo SMARCA2 variants outside the helicase domains"
    explanation: >
      The causal SMARCA2 variants are heterozygous and de novo, the pattern
      expected for a dominant disorder with reproductive fitness reduction.
genetic:
- name: SMARCA2
  notes: >
    De novo SMARCA2 variants that cluster OUTSIDE the helicase (ATPase) domains
    cause BIS. Variant location within SMARCA2 is the discriminating genotype
    feature: most Nicolaides-Baraitser syndrome variants fall INSIDE the helicase
    domains, whereas all BIS variants reported in the founding cohort fall
    outside them.

    Deliberate under-assertion: the specific variant consequence class for BIS
    (missense versus in-frame versus truncating) is NOT asserted here. The
    quotable abstract applies the word "nontruncating" to the NCBRS variant class,
    not explicitly to the BIS variant class, and the per-variant table lives in
    the paywalled full text. Positional clustering outside the helicase domains
    is the only variant property this entry claims, because it is the only one
    directly stated for BIS.

    Domain-boundary nuance (important for anyone auditing this entry for internal
    consistency): "outside the helicase domains" is the founding paper's
    FUNCTIONAL partition — the ultra-conserved catalytic ATPase motifs — and not
    UniProt's annotation boundary. UniProt P51531 annotates a Helicase
    ATP-binding domain spanning residues 736-901 (feature table checked
    2026-08-01), and two reported BIS alleles, p.(Met856Val) and p.(Leu766Val),
    fall INSIDE that span; p.(Leu766Val) is in fact the allele Sarli et al.
    label "BIS_atypical". This entry therefore reports the positional claim as
    the authors frame it and does NOT assert that every BIS residue lies outside
    UniProt's annotated DExx domain. This matters concretely here because the
    PMID:38751117 evidence item cited on the episignature pathophysiology node
    is about SMARCA2 M856V. The per-variant residue list comes from the Sarli
    et al. 2024 Table 1, which lives in full text that is not in this
    repository's reference cache, so it is recorded as provenance rather than
    quoted as a snippet.
  gene_term:
    preferred_term: SMARCA2
    term:
      id: hgnc:11098
      label: SMARCA2
  evidence:
  - reference: PMID:32694869
    reference_title: "De novo SMARCA2 variants clustered outside the helicase domain cause a new recognizable syndrome with intellectual disability and blepharophimosis distinct from Nicolaides-Baraitser syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast to most NCBRS variants, all SMARCA2 variants associated with BIS are localized outside the helicase domains."
    explanation: >
      Defines the BIS-specific SMARCA2 variant class and the positional contrast

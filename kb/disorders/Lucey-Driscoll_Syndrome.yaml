pathophysiology:
- name: Placental Transfer of Maternal Serum Inhibitor
  biological_scale: MOLECULAR
  description: >-
    The inhibitor originates as a maternal gestational factor and reaches the
    fetus across the placenta, which is why the inhibitory activity is present
    at birth and wanes once placental transfer ends after delivery.
  evidence:
  - reference: PMID:26595536
    reference_title: "Inherited disorders of bilirubin clearance."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Placental transfer of maternal serum inhibitor of UGT1A1"
    explanation: The review's summary table gives the molecular defect as placental transfer of a maternal UGT1A1 inhibitor.
  downstream:
  - target: Transient UGT1A1 Inhibition by a Serum Factor
    causal_link_type: DIRECT
    description: The transferred maternal inhibitor is what suppresses UGT1A1 activity in the infant.
- name: Transient UGT1A1 Inhibition by a Serum Factor
  biological_scale: MOLECULAR
  description: >-
    An unidentified inhibitor in the serum of affected infants and their
    mothers suppresses UGT1A1 glucuronosyltransferase activity. The inhibitory
    effect declines after delivery, which is why the disorder is transient.

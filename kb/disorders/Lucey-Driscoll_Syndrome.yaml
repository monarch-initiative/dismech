treatments:
- name: Aggressive Phototherapy
  description: >-
    Because of the risk of severe hyperbilirubinemia, affected infants are
    monitored closely during the first two weeks of life and treated with
    aggressive phototherapy if bilirubin approaches threshold levels, to
    prevent kernicterus. The condition is self-resolving as the maternal serum
    inhibitor clears.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: phototherapy
    term:
      id: NCIT:C15301
      label: Phototherapy
  target_mechanisms:
  - target: Neonatal unconjugated hyperbilirubinemia
    treatment_effect: MODULATES
    description: Phototherapy photoisomerizes bilirubin to water-soluble forms, lowering the unconjugated bilirubin that cannot be conjugated.
    evidence:
    - reference: PMID:26595536
      reference_title: "Inherited disorders of bilirubin clearance."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "these infants need to be monitored closely in the first two weeks of life and may need treatment with aggressive phototherapy and possibly exchange transfusion if threshold bilirubin levels are reached"
      explanation: The review prescribes close monitoring and aggressive phototherapy for Lucey-Driscoll syndrome specifically.
- name: Exchange Transfusion
  description: >-
    Exchange transfusion in the newborn period is used if threshold bilirubin
    levels are reached despite phototherapy, to prevent kernicterus.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: exchange transfusion
    term:
      id: NCIT:C15192
      label: Blood Transfusion
  target_mechanisms:
  - target: Neonatal unconjugated hyperbilirubinemia
    treatment_effect: MODULATES
    description: Exchange transfusion physically removes bilirubin-laden blood, lowering circulating unconjugated bilirubin.
    evidence:
    - reference: PMID:26595536
      reference_title: "Inherited disorders of bilirubin clearance."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Phototherapy and possible exchange transfusion in newborn period"
      explanation: The review's summary table lists phototherapy and possible exchange transfusion as the treatment for Lucey-Driscoll syndrome.
genetic:
- name: UGT1A1
  gene_term:
    preferred_term: UGT1A1
    term:
      id: hgnc:12530
      label: UGT1A1
  association: Unknown
  relationship_type: UNKNOWN
  features: >-
    UGT1A1 encodes the enzyme whose activity is inhibited in this disorder, and
    MONDO and OMIM (237900) map the entity to UGT1A1 via a gene-disease link.
    No germline UGT1A1 variant is demonstrated to cause the disease, however:
    the cited review's summary table gives the molecular defect as placental
    transfer of a maternal serum inhibitor of UGT1A1 and lists no inheritance
    pattern. The relationship is therefore recorded as UNKNOWN rather than
    CAUSATIVE, since the evidence establishes UGT1A1 only as the inhibited
    enzyme (already wired into the pathograph as the inhibited target) and not
    as a causal germline locus. Unlike Crigler-Najjar (constitutive UGT1A1 loss
    of function) and Gilbert syndrome (a promoter polymorphism), the mechanism
    here is transient inhibition of UGT1A1 by a maternal serum factor.
  evidence:
  - reference: PMID:26595536
    reference_title: "Inherited disorders of bilirubin clearance."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In vitro testing demonstrated that sera of affected infants and their mothers contained an unidentified inhibitor of UGT1A1 activity."
    explanation: Establishes UGT1A1 as the enzyme at the centre of the disease.
notes: >-
  The existence of Lucey-Driscoll syndrome as a distinct entity is uncertain.
  The 2016 review used here dates the original description to 1960 (Lucey,
  Driscoll and colleagues) and states: "Since its original description in 1960,
  additional cases of Lucey-Driscoll syndrome have not been reported in the
  literature and its existence has been questioned." The 1965 follow-up report
  in J Clin Invest (PMID:14332157, Arias et al.) is a later account, not the
  1960 original; it has no retrievable abstract and is not quoted.

  The condition is self-resolving as the maternal serum inhibitor clears, but
  the cited review treats it as needing active management: it recommends close
  monitoring in the first two weeks of life and aggressive phototherapy, with
  exchange transfusion if threshold bilirubin levels are reached, to prevent
  kernicterus. Those Lucey-Driscoll-specific recommendations are curated in the
  treatments block and prognosis is good with treatment. No GeneReviews chapter
  covers the disorder.

  category is kept as Mendelian because MONDO and OMIM (237900) list the entity
  in the UGT1A1 bilirubin-metabolism spectrum alongside Crigler-Najjar and
  Gilbert syndromes; the cited review gives no inheritance pattern for it, so
  this is a nosological placement rather than a demonstrated mode of
  inheritance.

  features: >-
    UGT1A1 encodes the enzyme whose inhibition causes the disease; MONDO and
    OMIM (237900) map the entity to UGT1A1. Unlike Crigler-Najjar (constitutive
    UGT1A1 loss of function) and Gilbert syndrome (a promoter polymorphism), the
    classic mechanism here is transient inhibition of UGT1A1 by a maternal serum
    factor rather than a defined germline variant.
  evidence:
  - reference: PMID:26595536
    reference_title: "Inherited disorders of bilirubin clearance."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "In vitro testing demonstrated that sera of affected infants and their mothers contained an unidentified inhibitor of UGT1A1 activity."
    explanation: Establishes UGT1A1 as the enzyme at the centre of the disease.
notes: >-
  The existence of Lucey-Driscoll syndrome as a distinct entity is uncertain.
  The 2016 review used here states: "Since its original description in 1960,
  additional cases of Lucey-Driscoll syndrome have not been reported in the
  literature and its existence has been questioned." The original 1965 report
  (PMID:14332157) has no retrievable abstract and is not quoted.

  No treatments block is given: the condition is self-resolving as the maternal
  serum inhibitor clears, and the review gives no Lucey-Driscoll-specific
  therapy. Severe neonatal unconjugated hyperbilirubinemia of any cause is
  managed with phototherapy and exchange transfusion to prevent kernicterus,
  but no Lucey-Driscoll-specific treatment evidence exists to cite. No
  GeneReviews chapter covers it.

name: Lucey-Driscoll Syndrome
creation_date: "2026-11-06T14:05:00Z"
category: Mendelian
synonyms:
- transient familial neonatal hyperbilirubinemia
- transient familial neonatal hyperbilirubinaemia
- transient familial hyperbilirubinemia
- maternal serum jaundice
description: >-
  Lucey-Driscoll syndrome (transient familial neonatal hyperbilirubinemia) is
  severe unconjugated hyperbilirubinemia in the first days of life. In the
  original description the sera of affected infants and their mothers contained
  an unidentified inhibitor of UGT1A1, the hepatic enzyme that conjugates
  bilirubin; the inhibition is transient, declining after delivery, so the
  jaundice is self-resolving, and survivors have no recurrence. Severe neonatal
  hyperbilirubinemia carries a risk of kernicterus.

  The entity sits at the edge of the UGT1A1 spectrum alongside Gilbert and
  Crigler-Najjar syndromes, and its status is genuinely uncertain: the 2016
  review used here notes that no additional cases have been reported since the
  1960 description and that its existence has been questioned. MONDO and OMIM
  nonetheless record UGT1A1 as the gene, and the classic mechanism is inhibition
  of the UGT1A1 enzyme by a maternal gestational factor rather than a proven
  recurrent germline variant.

name: Craniometadiaphyseal Osteosclerosis with Hip Dysplasia
creation_date: "2026-09-25T13:56:18Z"
category: Mendelian
synonyms:
- CMDOH
description: >-
  Craniometadiaphyseal osteosclerosis with hip dysplasia is an autosomal
  recessive sclerosing skeletal dysplasia caused by homozygous
  C-terminally truncating variants in AXIN1, the scaffold of the
  beta-catenin destruction complex. The founding report described seven
  individuals from four families with macrocephaly, cranial hyperostosis and
  sclerosis of the vertebral endplates; hip dysplasia, heart malformations,
  variable developmental delay and hematological anomalies, including anemia
  and pancytopenia, were also frequent.

  The truncating alleles remove the C-terminal DIX domain through which AXIN1
  polymerizes. In primary and genome-edited cells carrying them, AXIN1
  protein levels were reduced, DIX-mediated polymerization was impaired and
  basal canonical Wnt/beta-catenin signalling was increased, yet the
  truncated proteins kept part of their Wnt-inhibitory activity when
  overexpressed, so the alleles are hypomorphic rather than null. A
  tankyrase inhibitor attenuated the Wnt overactivity in these cell systems.
  Patient bone biopsy showed increased osteoblast and reduced osteoclast
  function at the growth-plate resorption zone, and the authors proposed
  that AXIN1 coordinates osteoblast and osteoclast activity; in mice,
  deleting Axin1 in osteoblast precursors reduced osteoclast formation
  through increased osteoprotegerin. How the extraskeletal features arise is
  unknown.

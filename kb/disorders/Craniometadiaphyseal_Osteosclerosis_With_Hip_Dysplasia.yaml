    snippet: >-
      OPG expression and the ratio of Opg to Rankl were significantly
      increased in osteoblasts of Axin1Osx KO mice.
    explanation: Osteoblast-lineage Axin1 loss changes the osteoblast signal to osteoclasts.
  - reference: PMID:32821442

mechanistic_hypotheses:
- hypothesis_group_id: axin1_osteoblast_osteoclast_coupling
  hypothesis_label: Hypomorphic AXIN1 shifts osteoblast-osteoclast coupling toward bone accrual
  status: EMERGING
  description: >-
    Reduced AXIN1 function raises canonical Wnt signalling in the skeleton,
    and this is proposed to act on osteoblasts and, through osteoblast-derived
    signals such as OPG, on osteoclast formation, so that net bone accrual
    produces the cranial and vertebral osteosclerosis. The human evidence is
    the cellular Wnt overactivity, the bone-biopsy finding of increased
    osteoblast and reduced osteoclast function (known here through OMIM's
    summary), and the authors' interpretation. The mechanistic link from
    osteoblast-lineage Axin1 loss to reduced osteoclastogenesis via OPG comes
    from a complete conditional knockout in mouse osteoblast precursors, a
    stronger loss of function than the human hypomorphic alleles.
  evidence:
  - reference: PMID:37582359
    reference_title: AXIN1 bi-allelic variants disrupting the C-terminal DIX domain cause craniometadiaphyseal osteosclerosis with hip dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data suggest that AXIN1 coordinates the action of osteoblasts and
      osteoclasts
    explanation: The authors' statement of the hypothesis.
  - reference: PMID:32821442
    reference_title: Inhibition of Axin1 in osteoblast precursor cells leads to defects in postnatal bone growth through suppressing osteoclast formation.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus, the loss of Axin1 in osteoblast precursor cells caused increased
      OPG and the decrease in osteoclast formation
    explanation: Mouse evidence for the osteoclast arm.

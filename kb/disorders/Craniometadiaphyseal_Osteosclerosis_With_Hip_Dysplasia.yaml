    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Bone biopsy shows evidence of increased osteoblast and reduced osteoclast
      function at the growth plate resorption zone, resulting in coarse
      trabeculae (Terhal et al., 2023).
    explanation: >-
      OMIM's summary of the patient bone biopsy in the founding paper: both

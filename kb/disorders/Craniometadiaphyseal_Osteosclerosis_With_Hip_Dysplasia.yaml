discussions:
- discussion_id: cmdoh_extraskeletal_mechanism_gap
  prompt: >-
    How does hypomorphic AXIN1 produce hip dysplasia, heart malformations,
    developmental delay and the hematological anomalies?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Hip Dysplasia
  - phenotypes#Heart Malformations
  - phenotypes#Developmental Delay
  - phenotypes#Anemia
  - phenotypes#Pancytopenia
  - phenotypes#Macrocephaly
  rationale: >-
    The founding report establishes excess canonical Wnt signalling in patient
    and edited cells, but the quotable sources do not connect it to any of the
    extraskeletal features, nor say whether macrocephaly reflects skull
    thickening alone. These phenotypes are therefore left without an upstream
    mechanism node. In particular, whether the anemia and pancytopenia
    reflect encroachment of sclerotic bone on the marrow space or a direct
    effect of AXIN1 loss on hematopoiesis has not been examined.
  evidence:
  - reference: PMID:37582359
    reference_title: AXIN1 bi-allelic variants disrupting the C-terminal DIX domain cause craniometadiaphyseal osteosclerosis with hip dysplasia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Other frequent findings included hip dysplasia, heart malformations,
      variable developmental delay, and hematological anomalies.
    explanation: The extraskeletal features whose mechanism is open.
- discussion_id: cmdoh_tankyrase_inhibitor_translation
  prompt: >-
    Would a tankyrase inhibitor reduce bone accrual in vivo in a model
    carrying a patient-equivalent Axin1 C-terminal truncation, at a dose that
    does not impair normal bone formation?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Enhanced Basal Canonical Wnt/Beta-Catenin Signaling
  - experimental_models#AXIN1-truncation primary and genome-edited cells
  rationale: >-
    Tankyrase inhibition attenuated the Wnt overactivity only in cultured
    cells, and the authors proposed it as a way to counter hypomorphic AXIN1.
    No animal model carrying a patient-equivalent allele exists; the only
    skeletal Axin1 model is a complete conditional deletion in osteoblast
    precursors, whose phenotype (delayed postnatal bone growth) differs from
    the human osteosclerosis. Stabilizing AXIN1 in normal bone is not
    neutral: mice lacking the ubiquitin ligase RNF146, which normally keeps
    AXIN1 levels low, in the osteoblast lineage accumulate AXIN1 and become
    severely osteopenic.
  evidence:
  - reference: PMID:37582359
    reference_title: AXIN1 bi-allelic variants disrupting the C-terminal DIX domain cause craniometadiaphyseal osteosclerosis with hip dysplasia.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      tankyrase inhibitors can attenuate the effects of AXIN1 hypomorphic
      variants
    explanation: The authors' therapeutic proposal, based on cell data.
  - reference: PMID:28581440
    reference_title: Ubiquitin ligase RNF146 coordinates bone dynamics and energy metabolism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Loss of RNF146 stabilized its substrate AXIN1, leading to impairment of
      WNT3a-induced β-catenin activation and reduced Fgf18 expression in
      osteoblasts.
    explanation: AXIN1 stabilization blunts Wnt signalling in osteoblasts.
  - reference: PMID:28581440
    reference_title: Ubiquitin ligase RNF146 coordinates bone dynamics and energy metabolism.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      mice with loss of RNF146 within the osteoblast lineage had increased fat
      stores and were glucose intolerant with severe osteopenia because of
      defective osteoblastogenesis
    explanation: Excess AXIN1 in normal osteoblasts causes bone loss, a safety consideration.

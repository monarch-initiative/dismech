notes: >-
  OMIM 620558 (the MONDO:0957832 cross-reference); CMDOH is the OMIM
  abbreviation shown in MedGen. The clinical and cellular description rests
  on a single report of seven individuals from four families
  (PMID:37582359). Only its PubMed abstract is quotable here: the reference
  fetcher declines the full text (full_text_declined: publisher_free in the
  cache frontmatter). Specific findings from the full paper are cited only
  where OMIM's definition, reproduced on the MedGen page
  (url:https://www.ncbi.nlm.nih.gov/medgen/1844026/), states them in a
  sentence: anemia and pancytopenia, and the bone-biopsy result. Per-feature
  counts, variant nomenclature and the further features listed in OMIM's
  clinical synopsis (among them hypertelorism, depressed nasal bridge,
  frontal bossing, proptosis, atrial and ventricular septal defects, patent
  ductus arteriosus, flared metaphyses, sandwich-appearance vertebral bodies,
  thickened calvaria and choanal stenosis) are not curated as phenotypes,
  because no quotable sentence states them; no phenotype carries a frequency
  band for the same reason.

  Name collision: craniometadiaphyseal dysplasia, wormian bone type
  (MONDO:0010014, OMIM 269300) is a different recessive disorder with
  cortical thinning and absent metaphyseal modelling rather than
  osteosclerosis, attributed to biallelic WRAP53 variants (PMID:34484289).
  Literature and database records for one should not be attached to the
  other.

  Allelic and context boundaries: rare heterozygous AXIN1 variants have been
  reported in nonsyndromic craniosynostosis (PMID:38905707), and somatic
  AXIN1 mutations occur in hepatocellular carcinoma (PMID:41550750). Neither
  is part of this entry. Neither the founding abstract nor OMIM's
  definition mentions cancer in affected individuals.

  The disorder was described after the 2023 revision of the ISDS Nosology of
  Genetic Skeletal Disorders (PMID:36779427), so no ISDS group is assigned.
  No mechanism module in kb/modules covers Wnt-driven high bone mass, so no
  node declares conforms_to. No treatment is curated: no source reports
  management of affected individuals, and the tankyrase inhibitor result is
  a cell-culture finding (see discussions).

  No GeneReviews chapter exists for this disease (just check-genereviews
  --online, Bookshelf index snapshot 2026-09-10: NO_CHAPTER). The ClinGen
  gene-disease validity download (search.clinicalgenome.org, retrieved
  2026-09-25) has no AXIN1 row, and no Orphanet record for this disorder is
  present in references_cache.

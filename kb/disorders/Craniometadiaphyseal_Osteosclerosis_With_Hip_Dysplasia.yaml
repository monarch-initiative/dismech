    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Thus, the loss of Axin1 in osteoblast precursor cells caused increased
      OPG and the decrease in osteoclast formation
    explanation: Reduced osteoclastogenesis downstream of osteoblast-lineage Axin1 loss.

- name: Imbalanced Osteoblast-Osteoclast Coupling
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Sclerosing skeletal dysplasias arise from an imbalance between bone
    formation and resorption. In this disorder, bone biopsy (as summarized by
    OMIM) showed increased osteoblast and reduced osteoclast function at the
    growth-plate resorption zone, and the authors proposed that AXIN1
    coordinates osteoblast and osteoclast activity. Mouse data support the
    osteoclast arm: deleting Axin1 in osteoblast precursors increased
    osteoblast osteoprotegerin (OPG) and the OPG-to-RANKL ratio and reduced
    osteoclast formation. PROVISIONAL because the human evidence is a biopsy
    finding known here only through a database summary, and the mouse model is
    a complete conditional deletion rather than the human hypomorphic allele.
  cell_types:

        id: MONDO:0859233
        label: epidermolysis bullosa, junctional 6, with pyloric atresia
      mapping_predicate: skos:closeMatch
      mapping_source: MONDO
      mapping_justification: >-
        The ITGA6 route to JEB with pyloric atresia. MONDO:0009183 carries the ITGB4
        association and is bound here; the ITGA6 term is a close match because both
        subunits of the same integrin heterodimer give the same clinical entity.
  description: >
    Caused by mutations in ITGA6 or ITGB4 encoding integrin alpha-6-beta-4.
    Presents with congenital pyloric atresia in addition to generalized skin
    blistering. Often lethal in infancy, though milder cases survive with
    surgical correction. Biallelic PLEC variants also cause epidermolysis bullosa
    with pyloric atresia, but PLEC encodes plectin, a component of the inner
    hemidesmosomal plaque rather than of the lamina lucida, and it is not curated as
    a junctional gene in this entry; it is bound in the Epidermolysis_Bullosa_Simplex
    entry.

notes: >-
  The has_subtypes rows are the clinical subtypes, not one row per gene. Three of the
  six span several genes, because the same gene reaches more than one severity class:
  homozygous null mutations in any of the three laminin-332 chain genes give the
  severe form, while MONDO records LAMB3, LAMA3, LAMC2, COL17A1 and ITGB4 routes into
  the intermediate form. The GeneReviews diagnostic panel is correspondingly a single
  five-gene list for JEB as a whole rather than one gene per severity class. Where
  MONDO splits a clinical subtype into gene-specific terms, the row binds one and
  records the siblings as skos:closeMatch, which deliberately does not retire them
  from the curation queue.

  For the same reason genetic[].subtype is set only where a gene maps to exactly one
  row - ITGA6 to JEB with pyloric atresia and ITGA3 to ILNEB. The slot is
  single-valued, so setting it on LAMB3, LAMA3, LAMC2, COL17A1, or ITGB4 would assert
  an exclusivity none of them has; the reciprocal link for those genes is the
  has_subtypes genes list.

  LOC syndrome and ILNEB are curated as rows here rather than as separate entries
  because both sources cited for them call the condition a subtype of junctional
  epidermolysis bullosa. Epidermolysis bullosa with pyloric atresia can also be caused
  by biallelic PLEC variants; plectin sits in the inner hemidesmosomal plaque rather
  than in the lamina lucida, and PLEC is bound in the Epidermolysis_Bullosa_Simplex
  entry, so it is not curated as a junctional gene here.

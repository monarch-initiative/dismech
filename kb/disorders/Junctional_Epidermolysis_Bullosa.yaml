    snippet: "Junctional epidermolysis bullosa (JEB) is a hereditary blistering disease caused by reduced dermal-epidermal adhesion due to deficiencies of one of the proteins, laminin-332, type XVII collagen, integrin α6β4 or integrin α3."
    explanation: Places integrin alpha-3 alongside the three proteins this entry already models as a separate JEB-causing deficiency, which is why it is a fourth node rather than an addition to the alpha-6-beta-4 node.
- name: Loss of Lamina Lucida Adhesion
  conforms_to: "dermal_epidermal_junction_adhesion_failure#Loss of Adhesive Integrity at a Defined Cleavage Plane"
  description: >
    The common downstream consequence of all JEB-causing mutations. Defective
    anchoring filaments and hemidesmosome components lead to tissue separation
    at the lamina lucida of the basement membrane zone, producing characteristic
    blistering with minimal mechanical trauma.
  biological_processes:

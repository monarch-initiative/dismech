name: Junctional Epidermolysis Bullosa
creation_date: '2026-03-10T12:00:00Z'
category: Mendelian
description: >-
  Junctional epidermolysis bullosa (JEB) is caused by mutations in genes
  encoding components of the dermal-epidermal junction at the lamina lucida,
  including laminin-332 (LAMA3, LAMB3, LAMC2), type XVII collagen (COL17A1),
  integrin alpha-6-beta-4 (ITGA6, ITGB4), and integrin alpha-3-beta-1 (ITGA3).
  All forms are autosomal recessive. JEB severe (Herlitz) carries near-90%
  first-year mortality, while JEB intermediate is a chronic but survivable
  blistering disorder. Two subtypes sit apart from that severity axis: LOC
  syndrome, in which only the LAMA3A transcript is affected and granulation
  tissue dominates, and ILNEB, in which nephrotic syndrome and interstitial lung
  disease dominate and the skin is only mildly fragile.

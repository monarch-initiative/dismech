- name: LOC Syndrome
  display_name: Laryngo-onycho-cutaneous syndrome (LAMA3A-specific)
  subtype_term:
    preferred_term: laryngo-onycho-cutaneous syndrome
    term:
      id: MONDO:0009513
      label: laryngo-onycho-cutaneous syndrome
  description: >
    A junctional EB subtype caused by mutations confined to the LAMA3A-specific
    exon, so only the laminin alpha-3a transcript is affected and the alpha-3b1 and
    alpha-3b2 isoforms are spared. Laminin-332 immunostaining at the dermal-epidermal
    junction is of normal intensity, which separates this entity mechanistically from
    the severe laminin-332-null forms. The dominant clinical feature is exuberant
    vascular granulation tissue in conjunctiva and larynx, with cutaneous erosions and
    nail dystrophy; the granulation tissue can cause laryngeal obstruction and
    blindness. The original founder mutation is not a null allele: it is rescued by an
    alternative downstream translation start, leaving an N-terminally truncated
    laminin alpha-3a.
  genes:
  - preferred_term: LAMA3
    term:
      id: hgnc:6483
      label: LAMA3
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:23869449
    reference_title: "A new homozygous nonsense mutation in LAMA3A underlying laryngo-onycho-cutaneous syndrome."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laryngo-onycho-cutaneous (LOC) syndrome is a subtype of autosomal recessive junctional epidermolysis bullosa in which there is prominent skin and mucosal granulation tissue that can lead to delayed wound healing, laryngeal obstruction and blindness."
    explanation: Establishes LOC syndrome as a junctional EB subtype rather than a separate entity, which is why it is a row here, and sources the granulation-tissue phenotype.
  - reference: PMID:23869449
    reference_title: "A new homozygous nonsense mutation in LAMA3A underlying laryngo-onycho-cutaneous syndrome."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "normal intensity laminin-332 immunostaining at the dermal-epidermal junction, and autosomal recessive mutations in the LAMA3A-specific exon"
    explanation: Sources both the isoform specificity and the preserved laminin-332 staining that distinguish this row from the severe laminin-332-null forms.
  - reference: PMID:12915477
    reference_title: "An unusual N-terminal deletion of the laminin alpha3a isoform leads to the chronic granulation tissue disorder laryngo-onycho-cutaneous syndrome."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The condition is characterized by cutaneous erosions, nail dystrophy and exuberant vascular granulation tissue in certain epithelia, especially conjunctiva and larynx."
    explanation: Sources the cutaneous, nail, and conjunctival/laryngeal features named in this row.
  - reference: PMID:12915477
    reference_title: "An unusual N-terminal deletion of the laminin alpha3a isoform leads to the chronic granulation tissue disorder laryngo-onycho-cutaneous syndrome."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Surprisingly, the 151insG mutation does not result in nonsense-mediated mRNA decay due to rescue of the transcript by an alternative translation start site 6 exons downstream."
    explanation: Sources the claim that the founder allele is not a null and leaves an N-terminally truncated protein.
  review_notes: >-
    The 2003 report describes LOC syndrome as confined to the Punjabi Muslim
    population, but a later pedigree from Iran carries a different LAMA3A-specific
    mutation, so ancestry restriction is not curated here as a current feature.
- name: JEB-ILNEB
  display_name: JEB with interstitial lung disease and nephrotic syndrome (ILNEB)
  subtype_term:
    preferred_term: junctional epidermolysis bullosa with interstitial lung disease and nephrotic syndrome
    term:
      id: MONDO:0013881
      label: epidermolysis bullosa, junctional 7, with interstitial lung disease and nephrotic syndrome
  description: >
    A junctional EB subtype caused by biallelic ITGA3 mutations that prevent
    biosynthesis of functional integrin alpha-3-beta-1. Unlike the other junctional
    subtypes, the dominant clinical features are extracutaneous: congenital nephrotic
    syndrome and interstitial lung disease, with the lung involvement accounting for
    the lethal course. Skin fragility is mild and is the finding that points to the
    diagnosis. Integrin alpha-3 partners integrin beta-1, not the beta-4 subunit of
    the hemidesmosomal receptor mutated in JEB with pyloric atresia, and the lesion is
    in basement-membrane assembly across kidney, lung, and skin rather than in
    hemidesmosome assembly.
  genes:
  - preferred_term: ITGA3
    term:
      id: hgnc:6139
      label: ITGA3
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:42285338
    reference_title: "An ITGB4 variant modifies the severity of ITGA3-associated interstitial lung disease, nephrotic syndrome, and epidermolysis bullosa (ILNEB)."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic ITGA3 variants cause a rare subtype of junctional epidermolysis bullosa named interstitial lung disease, nephrotic syndrome, and epidermolysis bullosa"
    explanation: Establishes ILNEB as a junctional EB subtype caused by biallelic ITGA3 variants, which is the basis for curating it as a row here.
  - reference: PMID:22512483
    reference_title: "Integrin α3 mutations with kidney, lung, and skin disease."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified three patients with homozygous mutations in the integrin α(3) gene that were associated with disrupted basement-membrane structures and compromised barrier functions in kidney, lung, and skin."
    explanation: Sources the three-organ basement-membrane lesion this row records.
  - reference: PMID:22512483
    reference_title: "Integrin α3 mutations with kidney, lung, and skin disease."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The renal and respiratory features predominated, and the lung involvement accounted for the lethal course of the disease. Although skin fragility was mild, it provided clues to the diagnosis."
    explanation: Sources the claim that the extracutaneous features dominate and that mild skin fragility is the diagnostic clue.
  - reference: PMID:23114595
    reference_title: "Gain of glycosylation in integrin α3 causes lung disease and nephrotic syndrome."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The laminin-binding integrin α3β1 is expressed at high levels in lung epithelium and in kidney podocytes."
    explanation: Sources the beta-1 partner subunit and the lung and kidney expression that explain the extracutaneous organ distribution.

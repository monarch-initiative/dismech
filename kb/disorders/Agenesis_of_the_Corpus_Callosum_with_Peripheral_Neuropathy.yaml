mechanistic_hypotheses:
- hypothesis_group_id: canonical_slc12a6_loss_axonopathy_model
  hypothesis_label: Canonical SLC12A6 Loss-of-Function and Axonopathy Model
  status: CANONICAL
  description: >
    Biallelic SLC12A6 variants abolish or impair KCC3 function. Human
    neuropathology and knockout-model physiology support KCC3 deficiency as the
    upstream lesion for peripheral nerve dysfunction and a central/peripheral
    axonopathy, although the molecular bridge from transporter loss to axonal
    degeneration remains incompletely defined.
  evidence:
  - reference: PMID:12368912
    reference_title: "The K-Cl cotransporter KCC3 is mutant in a severe peripheral neuropathy associated with agenesis of the corpus callosum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: |-
      Our findings identify mutations in
      SLC12A6 as the genetic lesion underlying ACCPN and suggest a critical role for
      SLC12A6 in the development and maintenance of the nervous system.
    explanation: Patient mutation evidence establishes SLC12A6 as the causal disease gene.
  - reference: PMID:27230413
    reference_title: "KCC3 axonopathy: neuropathological features in the central and peripheral nervous system."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: |-
      We conclude that the
      neurodegenerative deficits in HMSN/ACC are primarily caused by an axonopathy
      superimposed upon abnormal development
    explanation: Human autopsy evidence supports axonopathy superimposed on abnormal development.
- hypothesis_group_id: emerging_motoneuron_nmj_model
  hypothesis_label: Emerging Motoneuron Electrical and Neuromuscular-Junction Model
  status: EMERGING
  description: >
    Global and neuron-specific KCC3 loss in mice produces abnormal motoneuron
    electrical activity, Na+/K+-ATPase alpha-1 mislocalization, early
    neuromuscular-junction abnormalities, denervation, and muscle atrophy. This is a
    parallel model-supported branch, not yet a demonstrated human treatment
    mechanism.
  evidence:
  - reference: PMID:28647557
    reference_title: "KCC3 loss-of-function contributes to Andermann syndrome by inducing activity-dependent neuromuscular junction defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: |-
      neuron-specific KCC3 loss-of-function in mice leads to early neuromuscular
      junction (NMJ) abnormalities and muscular atrophy
    explanation: Mouse evidence supports a neuron-autonomous NMJ and muscle-atrophy branch.
- hypothesis_group_id: emerging_central_commissural_development_model
  hypothesis_label: Emerging Central Commissural Development Model
  status: EMERGING
  description: >
    Human neuropathology establishes commissural and corticospinal-tract
    hypoplasia, but the developmental intermediates downstream of KCC3 loss and
    the reason corpus-callosum dysgenesis is variable remain unknown.
  evidence:
  - reference: PMID:27230413
    reference_title: "KCC3 axonopathy: neuropathological features in the central and peripheral nervous system."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: |-
      Hypoplasia or absence of the major telencephalic commissures and a
      hypoplasia of corticospinal tracts to half the normal size
    explanation: Human autopsy tissue establishes the central developmental lesions.
  - reference: PMID:32765936
    reference_title: "A Novel Splice-Site Variant in SLC12A6 Causes Andermann Syndrome without Agenesis of the Corpus Callosum."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We confirm that ACC is not a mandatory feature"
    explanation: A genetically confirmed case shows that callosal agenesis is not obligatory.


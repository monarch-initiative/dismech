discussions:
- discussion_id: gap_kcc3_transport_to_human_axonopathy
  prompt: >
    Which molecular intermediates connect loss of KCC3 transport to the central
    and peripheral axonopathy observed in human disease?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#SLC12A6 KCC3 loss of function"
  - "pathophysiology#Central and peripheral axonopathy"
  rationale: >
    Genetic, functional, model, and human-pathology evidence establish both
    endpoints, but not the intervening causal sequence.
  evidence:
  - reference: PMID:29366908
    reference_title: "A role for KCC3 in maintaining cell volume of peripheral nerve fibers."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: |-
      we still do not understand how
      dysfunction of this cotransporter can lead to the pathophysiology of peripheral
      neuropathy.
    explanation: The review explicitly identifies the transporter-to-neuropathy mechanism as unresolved.
- discussion_id: mismatch_mouse_kcc3_motor_unit_to_human_neuropathy
  prompt: >
    To what extent do mouse impulse-propagation and motoneuron/NMJ mechanisms
    reproduce the human motor and sensory neuropathy?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - "pathophysiology#Peripheral nerve impulse-propagation failure"
  - "pathophysiology#Activity-dependent motoneuron and neuromuscular-junction dysfunction"
  rationale: >
    The strongest conduction and NMJ causal data are from mice, and both
    loss-of-function and gain-of-function mouse models can show
    peripheral-neuropathy-like phenotypes.
  evidence:
  - reference: PMID:29366908
    reference_title: "A role for KCC3 in maintaining cell volume of peripheral nerve fibers."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: |-
      recapitulated a peripheral neuropathy-like phenotype originating from a KCC3
      gain-of-function (GOF).
    explanation: The review notes that opposite KCC3 perturbations can converge on a neuropathy-like mouse phenotype.
  - reference: PMID:28647557
    reference_title: "KCC3 loss-of-function contributes to Andermann syndrome by inducing activity-dependent neuromuscular junction defects."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: |-
      here propose that abnormal motoneuron electrical activity contributes to the
      peripheral neuropathy observed in Andermann syndrome.
    explanation: The authors frame translation from mouse motoneuron biology to human neuropathy as a proposal.
- discussion_id: gap_variable_corpus_callosum_dysgenesis
  prompt: >
    Why is corpus-callosum dysgenesis variable or absent in some people with
    biallelic pathogenic SLC12A6 variants?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - "pathophysiology#Commissural and corticospinal developmental abnormalities"
  - "phenotypes#Agenesis of corpus callosum"
  rationale: >
    Variable callosal anatomy affects disease naming, diagnostic interpretation,
    and the developmental mechanism assigned to KCC3 deficiency.
  evidence:
  - reference: PMID:32765936
    reference_title: "A Novel Splice-Site Variant in SLC12A6 Causes Andermann Syndrome without Agenesis of the Corpus Callosum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We confirm that ACC is not a mandatory feature"
    explanation: A molecularly confirmed case demonstrates that callosal agenesis is not required.


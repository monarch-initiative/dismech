- name: Activity-dependent motoneuron and neuromuscular-junction dysfunction
  description: >
    In global and neuron-specific KCC3-loss mice, abnormal motoneuron electrical
    activity and Na+/K+-ATPase alpha-1 mislocalization accompany early
    neuromuscular-junction abnormalities, denervation, and muscle atrophy. This branch
    is supported by model-organism evidence.
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  locations:
  - preferred_term: spinal cord
    term:
      id: UBERON:0002240
      label: spinal cord
  biological_processes:
  - preferred_term: modulation of chemical synaptic transmission
    term:
      id: GO:0050804
      label: modulation of chemical synaptic transmission
    modifier: ABNORMAL
  - preferred_term: neuromuscular junction development
    term:
      id: GO:0007528
      label: neuromuscular junction development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:28647557
    reference_title: "KCC3 loss-of-function contributes to Andermann syndrome by inducing activity-dependent neuromuscular junction defects."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: |-
      KCC3 depletion does
      not modify chloride handling, but promotes an abnormal electrical activity among
      primary motoneurons and mislocalization of Na+/K+-ATPase α1 in spinal cord
      motoneurons.
    explanation: Mouse motoneuron evidence supports the electrical-activity and ATPase-localization defect, independent of altered chloride handling.
  downstream:
  - target: Skeletal muscle atrophy
    description: Early NMJ abnormalities, denervation, and muscle atrophy co-occur downstream of neuron-specific KCC3 loss in mice; their direct causal ordering is unresolved.
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - emerging_motoneuron_nmj_model
    evidence:
    - reference: PMID:28647557
      reference_title: "KCC3 loss-of-function contributes to Andermann syndrome by inducing activity-dependent neuromuscular junction defects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: |-
        neuron-specific KCC3 loss-of-function in mice leads to early neuromuscular
        junction (NMJ) abnormalities and muscular atrophy
      explanation: Conditional mouse genetics shows NMJ abnormalities and muscle atrophy together downstream of neuron-specific KCC3 loss, without proving direct ordering.
  - target: Progressive sensorimotor neuropathy
    description: Abnormal motoneuron activity is proposed to contribute to the human neuropathy, but this link remains model-derived.
    causal_link_type: UNKNOWN
    hypothesis_groups:
    - emerging_motoneuron_nmj_model
    evidence:
    - reference: PMID:28647557
      reference_title: "KCC3 loss-of-function contributes to Andermann syndrome by inducing activity-dependent neuromuscular junction defects."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: |-
        here propose that abnormal motoneuron electrical activity contributes to the
        peripheral neuropathy observed in Andermann syndrome.
      explanation: The authors explicitly frame this link as a proposal based on model-organism evidence.

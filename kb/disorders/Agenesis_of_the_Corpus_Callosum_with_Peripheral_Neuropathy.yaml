diagnosis:
- name: SLC12A6 molecular genetic testing
  description: >
    The diagnosis is established in a person with suggestive findings by
    identifying biallelic pathogenic SLC12A6 variants.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  results: Biallelic pathogenic SLC12A6 variants establish the molecular diagnosis.
  evidence:
  - reference: PMID:20301546
    reference_title: "Hereditary Motor and Sensory Neuropathy with Agenesis of the Corpus Callosum."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: |-
      suggestive findings and biallelic pathogenic variants in SLC12A6 identified by
      molecular genetic testing.
    explanation: GeneReviews directly supports biallelic SLC12A6 testing as confirmatory.
- name: Brain MRI
  description: >
    Brain MRI assesses complete or partial corpus-callosum dysgenesis and other
    structural abnormalities. A normal corpus callosum does not exclude
    SLC12A6-related disease.
  diagnosis_term:
    preferred_term: MRI of the brain
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  results: Corpus-callosum agenesis or dysgenesis is supportive but not obligatory.
  evidence:
  - reference: PMID:16606917
    reference_title: "Novel truncating and missense mutations of the KCC3 gene associated with Andermann syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: |-
      defects. The cerebral MRI reveals a variable degree of agenesis of the corpus
      callosum.
    explanation: A patient series supports MRI characterization of variable callosal agenesis.
  - reference: PMID:32765936
    reference_title: "A Novel Splice-Site Variant in SLC12A6 Causes Andermann Syndrome without Agenesis of the Corpus Callosum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain magnetic resonance imaging showed intact corpus callosum."
    explanation: A molecularly confirmed case establishes that intact callosal anatomy does not exclude the disease.


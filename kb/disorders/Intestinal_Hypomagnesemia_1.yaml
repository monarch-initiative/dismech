discussions:
- discussion_id: renal_trpm6_mouse_human_mismatch
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - pathophysiology#Impaired Distal Convoluted Tubule Magnesium Reabsorption
  prompt: >-
    Patients with HSH leak magnesium in the urine once supplemented, but mice
    lacking Trpm6 in the kidney keep normal serum and urinary magnesium. Is
    renal TRPM6 loss a cause of magnesium wasting in humans?
  rationale: >-
    The human renal leak is inferred from fractional excretion during
    treatment (PMID:16107578), when the intestine is also defective, while
    the mouse experiment isolates the kidney (PMID:27991852). If the mouse
    result holds in humans, the renal branch of this entry overstates the
    distal tubule's role, and treatment strategies would rest on intestinal
    absorption alone.
  proposed_experiments:
  - experiment_id: hsh_renal_magnesium_balance_on_parenteral_magnesium
    name: Renal magnesium handling during parenteral repletion
    description: >-
      Measure fractional magnesium excretion in TRPM6 patients during
      intravenous repletion to normal serum magnesium, with no oral load,
      compared with matched controls given the same infusion.
    would_support:
    - pathophysiology#Impaired Distal Convoluted Tubule Magnesium Reabsorption
    supporting_outcome:
    - Patients excrete a higher fraction of filtered magnesium than controls at matched serum magnesium.
    refuting_outcome:
    - Patients and controls excrete magnesium alike at matched serum magnesium.

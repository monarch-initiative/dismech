animal_models:
- name: Trpm6-null mouse
  species: Mouse
  genotype: Trpm6 homozygous null (Trpm6-/-)
  publication: PMID:19692351
  description: >-
    Global Trpm6 deletion is almost always lethal before weaning, many embryos
    dying by E12.5 and survivors to term showing exencephaly and spina bifida
    occulta. A high-magnesium maternal diet improves survival only marginally.
    Heterozygotes have mildly low plasma magnesium.
  modeled_mechanisms:
  - target: Systemic Magnesium Deficiency
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The null mouse dies in utero rather than presenting with infantile
      hypomagnesemia, so it does not model the human postnatal disease.
    limitations: >-
      Embryonic lethality and neural tube defects have no counterpart in
      patients. The lethality was later traced to loss of TRPM6 in placenta and
      yolk sac, which is a species-specific developmental dependency.
    evidence:
    - reference: PMID:19692351
      reference_title: "Mice defective in Trpm6 show embryonic mortality and neural tube defects."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Absence of Trpm6 produces an apparently different phenotype in mice than in humans."
      explanation: The authors state the mouse phenotype differs from the human disease.
    - reference: PMID:20814221
      reference_title: "Transient receptor potential melastatin 6 knockout mice are lethal whereas heterozygous deletion results in mild hypomagnesemia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Homozygous TRPM6 deletion is embryonic lethal in mice. Heterozygous deletion of TRPM6 results in a mild hypomagnesemia."
      explanation: An independent null line is also embryonic lethal.
- name: Trpm6 intestine-specific knockout mouse (Villin1-Cre)
  species: Mouse
  genotype: Trpm6 delta17/flox; Villin1-Cre
  publication: PMID:27991852
  description: >-
    Trpm6 deleted in intestinal epithelium in adult mice. The mice become
    hypomagnesemic with reduced bone magnesium and low urinary magnesium.
  modeled_mechanisms:
  - target: Intestinal Magnesium Malabsorption
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Intestinal loss of Trpm6 alone produces systemic magnesium deficiency.
    limitations: >-
      Mouse magnesium absorption depends mainly on the colon; the relative
      contribution of human small intestine and colon is not established.
    evidence:
    - reference: PMID:27991852
      reference_title: "Epithelial magnesium transport by TRPM6 is essential for prenatal development and adult survival."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In contrast, disruption of Trpm6 in the intestine resulted in hypomagnesemia, reduced bone Mg2+ content and lowered urinary Mg2+ excretion (Figure 5K–N), indicating that wildtype kidneys are not able to compensate for the ablation of intestinal TRPM6."
      explanation: The intestinal knockout reproduces magnesium malabsorption and deficiency.
- name: Trpm6 kidney-specific knockout mouse (Ksp-Cre)
  species: Mouse
  genotype: Trpm6 delta17/flox; Ksp-Cre
  publication: PMID:27991852
  description: >-
    Trpm6 deleted in kidney tubules. Serum magnesium and urinary magnesium
    excretion are unchanged.
  modeled_mechanisms:
  - target: Impaired Distal Convoluted Tubule Magnesium Reabsorption
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: TISSUE
    description: Renal Trpm6 deletion does not produce renal magnesium wasting in mice.
    limitations: >-
      Patients show a renal magnesium leak after supplementation, so the mouse
      kidney may compensate in a way the human kidney does not, or the human
      leak may reflect combined deficiency. The discrepancy is unresolved.
    evidence:
    - reference: PMID:27991852
      reference_title: "Epithelial magnesium transport by TRPM6 is essential for prenatal development and adult survival."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Surprisingly, conditional Trpm6 inactivation in the kidney neither impacted serum Mg2+ concentration nor urinary Mg2+ excretion, and bone Mg2+ content was only slightly reduced (Figure 5G–J)."
      explanation: The kidney knockout does not waste magnesium.

genetic:
- name: TRPM6
  gene_term:
    preferred_term: TRPM6
    term:
      id: hgnc:17995
      label: TRPM6
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    TRPM6 (9q21.13) encodes a channel-kinase of the melastatin TRP family,
    closely related to TRPM7. About 85% of the reported variants are truncating.
  evidence:
  - reference: PMID:12032568
    reference_title: "Hypomagnesemia with secondary hypocalcemia is caused by mutations in TRPM6, a new member of the TRPM gene family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using a positional candidate gene approach, we identified mutations in TRPM6 (also known as CHAK2), encoding TRPM6, in autosomal-recessive hypomagnesemia with secondary hypocalcemia (HSH, OMIM 602014), previously mapped to chromosome 9q22 (ref. 3)."
    explanation: Positional cloning of TRPM6.
  - reference: PMID:12032570
    reference_title: "Mutation of TRPM6 causes familial hypomagnesemia with secondary hypocalcemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report that mutation of TRPM6 causes hypomagnesemia with secondary hypocalcemia and show that individuals carrying mutations in this gene have abnormal renal magnesium excretion."
    explanation: Independent identification of TRPM6 in three inbred Israeli kindreds.
  - reference: ORPHA:30924
    reference_title: "Primary hypomagnesemia with secondary hypocalcemia"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "TRPM6 | transient receptor potential cation channel subfamily M member 6 | hgnc:17995 | Disease-causing germline mutation(s) in"
    explanation: Orphanet records TRPM6 as the disease-causing gene.
  variants:
  - name: TRPM6 p.Ser141Leu
    type: MISSENSE
    clinical_significance: PATHOGENIC
    description: >-
      Missense variant that prevents TRPM6 from assembling into channel
      complexes with TRPM7.
    evidence:
    - reference: PMID:14976260
      reference_title: "Disruption of TRPM6/TRPM7 complex formation by a mutation in the TRPM6 gene causes hypomagnesemia with secondary hypocalcemia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The naturally occurring S141L TRPM6 missense mutation abrogated the oligomeric assembly of TRPM6, thus providing a cell biological explanation for the human disease."
      explanation: Functional characterization of S141L.
  - name: TRPM6 p.Tyr1053Cys
    type: MISSENSE
    clinical_significance: PATHOGENIC
    description: >-
      Homozygous in a patient from a consanguineous family, with both parents
      heterozygous. The channel reaches the membrane but does not conduct.
    evidence:
    - reference: PMID:23942199
      reference_title: "New TRPM6 missense mutations linked to hypomagnesemia with secondary hypocalcemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Whereas patient F37.1 is homozygous for mutation Y1053C (both parents being heterozygous and bearing the Y1053C missense mutation), patients F35.1, F38.1, and F40.1 display truncating mutations on the second allele (stop and splice-site mutations)."
      explanation: Segregation of the homozygous Y1053C allele.

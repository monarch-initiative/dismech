      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Our data indicate that TRPM6 comprises all or part of the apical Mg2+ channel of Mg2+-absorbing epithelia."
      explanation: Places TRPM6 as the apical entry channel of absorbing epithelia.
  - target: Impaired Distal Convoluted Tubule Magnesium Reabsorption
    causal_link_type: DIRECT
    description: The missing channel is also the apical magnesium entry route of the distal convoluted tubule.

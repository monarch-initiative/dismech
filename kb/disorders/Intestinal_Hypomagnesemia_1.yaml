name: Intestinal Hypomagnesemia 1
creation_date: "2026-10-24T02:24:13Z"
category: Mendelian
description: >-
  Intestinal hypomagnesemia 1 (HOMG1), better known as hypomagnesemia with
  secondary hypocalcemia (HSH), is an autosomal recessive disorder of magnesium
  balance caused by biallelic loss-of-function variants in TRPM6. TRPM6 is a
  magnesium-permeable channel-kinase on the apical membrane of the small
  intestinal brush border and the renal distal convoluted tubule. Without it,
  transcellular magnesium uptake from the gut fails and the distal tubule cannot
  conserve filtered magnesium, so serum magnesium falls to very low values in
  the first weeks or months of life. Profound magnesium depletion then suppresses
  parathyroid hormone secretion and blunts the response of kidney and bone to
  the hormone, producing hypocalcemia with inappropriately low PTH. The
  combination of hypomagnesemia and hypocalcemia raises neuromuscular
  excitability, and infants present with generalized seizures, tetany and
  muscle spasms. Lifelong high-dose oral magnesium, after intravenous repletion
  in the acute phase, relieves the symptoms and normalizes calcium, although
  serum magnesium usually stays subnormal. Delayed diagnosis can leave permanent
  neurological damage.
notes: >-
  The entry is anchored on MONDO:0011176, which Orphanet maps as an exact match
  of ORPHA:30924 (primary hypomagnesemia with secondary hypocalcemia) and OMIM
  602014, with TRPM6 (hgnc:17995) as the causal gene.

  The relative weight of the intestinal and renal defects is not settled. The
  human studies describe a primary intestinal absorption defect with renal
  magnesium wasting that becomes visible once serum magnesium is restored
  (PMID:16107578). In mice, deleting Trpm6 in the intestine causes
  hypomagnesemia whereas deleting it in the kidney does not (PMID:27991852).
  Both branches are curated; the mouse result is recorded as a human-model
  mismatch discussion rather than used to drop the renal branch.

  Whether TRPM6 needs TRPM7 to reach the cell surface is also contested. One
  study found full-length TRPM6 retained intracellularly unless co-expressed
  with TRPM7 (PMID:14976260), while another recorded TRPM6 currents on its own
  (PMID:14576148). The pathophysiology node for loss of channel activity does
  not depend on which view is correct.

  No GeneReviews chapter covers this disease; the Bookshelf index lists only a
  StatPearls chapter on hypomagnesemia in general.

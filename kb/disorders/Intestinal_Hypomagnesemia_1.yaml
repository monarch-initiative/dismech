progression:
- phase: Neonatal or infantile presentation
  notes: >-
    Irritability and excessive crying can precede seizures by weeks; in one
    cohort the first symptoms appeared at a mean of 20 days and intractable
    seizures at a mean of about two months.
  evidence:
  - reference: PMID:40853861
    reference_title: "Clinical Spectrum of Primary Hypomagnesemia with Secondary Hypocalcemia due to TRPM6 Mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Irritability and excessive crying were the first symptoms (mean age = 20 days) followed by intractable seizures (mean age = 2.07 months) in our cohort."
    explanation: Gives the order and timing of the first manifestations.
  - reference: PMID:16107578
    reference_title: "Novel TRPM6 mutations in 21 families with primary hypomagnesemia and secondary hypocalcemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical evaluation revealed a homogeneous clinical picture at manifestation with onset in early infancy with generalized cerebral convulsions."
    explanation: Onset in early infancy across a 28-patient cohort.
- phase: Lifelong treated course
  notes: >-
    With intravenous and then lifelong oral magnesium, calcium and PTH
    normalize and seizures stop, but serum magnesium usually remains
    subnormal. Long-term follow-up of treated patients reports no severe
    complications.
  evidence:
  - reference: PMID:16107578
    reference_title: "Novel TRPM6 mutations in 21 families with primary hypomagnesemia and secondary hypocalcemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum magnesium levels remained in the subnormal range despite adequate therapy."
    explanation: Serum magnesium does not fully normalize under treatment.
  - reference: PMID:33565749
    reference_title: "Long-term Clinical Follow-up of Patients with Familial Hypomagnesemia with Secondary Hypocalcemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment compliance was good and there were no severe complications in the long-term follow-up of cases."
    explanation: Long-term outcome of treated patients.
pathophysiology:
- name: Biallelic TRPM6 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Most reported TRPM6 alleles are truncating (stop, frameshift, splice-site
    variants and exon deletions); a minority are missense variants that
    abolish channel function or assembly.
  genes:
  - preferred_term: TRPM6
    term:
      id: hgnc:17995
      label: TRPM6
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:12032568
    reference_title: "Hypomagnesemia with secondary hypocalcemia is caused by mutations in TRPM6, a new member of the TRPM gene family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using a positional candidate gene approach, we identified mutations in TRPM6 (also known as CHAK2), encoding TRPM6, in autosomal-recessive hypomagnesemia with secondary hypocalcemia (HSH, OMIM 602014), previously mapped to chromosome 9q22 (ref. 3)."
    explanation: Identifies TRPM6 as the causal gene.
  - reference: PMID:16107578
    reference_title: "Novel TRPM6 mutations in 21 families with primary hypomagnesemia and secondary hypocalcemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sixteen new TRPM6 mutations were identified, including stop mutations, frame-shift mutations, splice-site mutations, and deletions of exons."
    explanation: Describes the predominantly truncating variant spectrum.
  downstream:
  - target: Loss of TRPM6 Magnesium Channel Activity
    causal_link_type: DIRECT
    description: Mutant TRPM6 channels do not conduct current.
    evidence:
    - reference: PMID:16107578
      reference_title: "Novel TRPM6 mutations in 21 families with primary hypomagnesemia and secondary hypocalcemia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Electrophysiologic analysis of mutated ion channels after heterologous expression in Xenopus oocytes proved complete loss of function of TRPM6."
      explanation: Patient alleles abolish channel function in an expression system.
    - reference: PMID:23942199
      reference_title: "New TRPM6 missense mutations linked to hypomagnesemia with secondary hypocalcemia."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "All mutant channels, expressed in HEK293 cells, showed loss-of-function, whereas no severe trafficking impairment to the plasma membrane surface was observed."
      explanation: Missense alleles also abolish channel function, through gating rather than trafficking.
- name: Loss of TRPM6 Magnesium Channel Activity
  biological_scale: MOLECULAR
  description: >-
    TRPM6 is a constitutively active, Mg2+- and Ca2+-permeable cation channel
    with a C-terminal alpha-kinase domain, regulated by intracellular Mg2+.
    Patient alleles leave no conducting channel. The S141L missense variant
    acts by preventing TRPM6 from assembling with its homolog TRPM7.
  genes:
  - preferred_term: TRPM6
    term:
      id: hgnc:17995
      label: TRPM6
  molecular_functions:
  - preferred_term: magnesium ion transmembrane transporter activity
    term:
      id: GO:0015095
      label: magnesium ion transmembrane transporter activity
    modifier: DECREASED
  evidence:
  - reference: PMID:14576148
    reference_title: "TRPM6 forms the Mg2+ influx channel involved in intestinal and renal Mg2+ absorption."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Heterologous expression of wild-type TRPM6 but not TRPM6 mutants identified in HSH patients induces a Mg2+- and Ca2+-permeable cation channel tightly regulated by intracellular Mg2+ levels."
    explanation: Wild-type TRPM6 forms a magnesium-permeable channel; patient mutants do not.
  - reference: PMID:14976260
    reference_title: "Disruption of TRPM6/TRPM7 complex formation by a mutation in the TRPM6 gene causes hypomagnesemia with secondary hypocalcemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The naturally occurring S141L TRPM6 missense mutation abrogated the oligomeric assembly of TRPM6, thus providing a cell biological explanation for the human disease."
    explanation: Shows one missense route to the loss of channel activity.
  downstream:

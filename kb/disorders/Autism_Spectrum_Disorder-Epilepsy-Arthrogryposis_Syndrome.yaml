biochemical:
- name: Reduced highly branched N-glycans
  notes: >-
    The biochemical hallmark is a decrease in cell-surface highly branched
    (tri- and tetraantennary) N-glycans with a reciprocal increase in
    lower-branched glycoforms, reflecting the Golgi UDP-GlcNAc deficiency;
    patient biochemical testing confirms abnormal protein glycosylation
    consistent with a defective Golgi UDP-GlcNAc transporter. This is a type II
    CDG glycosylation signature. Because SLC35A3 primarily affects branching
    rather than whole-transferrin galactosylation/sialylation, routine serum
    transferrin screening may be less sensitive than direct N-glycan branching
    analysis.
  evidence:
  - reference: PMID:28777481
    reference_title: "A human case of SLC35A3-related skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "biochemical analysis confirmed abnormal protein glycosylation, consistent with a \ndefective Golgi UDP-GlcNAc transporter, validating the mutations."
    explanation: Patient biochemical testing confirms abnormal glycosylation from a defective Golgi UDP-GlcNAc transporter.

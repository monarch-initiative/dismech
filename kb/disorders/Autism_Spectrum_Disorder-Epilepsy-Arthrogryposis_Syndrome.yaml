  description: >-
    Autosomal recessive; affected individuals carry biallelic (homozygous or
    compound heterozygous) SLC35A3 variants. The disorder was first defined in a
    large kindred with eight affected individuals carrying deleterious SLC35A3
    variants; subsequent families have carried compound heterozygous or
    homozygous variants.
  evidence:
  - reference: PMID:28328131
    reference_title: "Recessive mutations in SLC35A3 cause early onset epileptic encephalopathy with skeletal defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "two siblings, a boy and a girl, \nmanifesting a severe epileptic encephalopathy (EE) with skeletal abnormalities, \ncarried novel SLC35A3 compound heterozygous mutations."
    explanation: Documents compound heterozygous (recessive) SLC35A3 variants in affected siblings.
pathophysiology:
- name: Impaired Golgi UDP-GlcNAc Transport
  description: >
    Biallelic pathogenic variants in SLC35A3 reduce transport of
    UDP-N-acetylglucosamine (UDP-GlcNAc), the nucleotide-sugar donor for
    N-acetylglucosaminylation, from the cytosol into the lumen of the Golgi
    apparatus. SLC35A3 is regarded as the major Golgi UDP-GlcNAc transporter in
    mammals, so loss of its activity is the primary biochemical lesion; in Golgi
    vesicles from patient fibroblasts, transport of the nucleotide sugar is
    significantly reduced.
  biological_processes:
  - preferred_term: UDP-N-acetylglucosamine transmembrane transport
    term:
      id: GO:1990569
      label: UDP-N-acetylglucosamine transmembrane transport
    modifier: DECREASED
  molecular_functions:
  - preferred_term: UDP-N-acetylglucosamine transmembrane transporter activity
    term:
      id: GO:0005462
      label: UDP-N-acetylglucosamine transmembrane transporter activity
    modifier: DECREASED
  cellular_components:
  - preferred_term: Golgi membrane
    term:
      id: GO:0000139
      label: Golgi membrane
  chemical_entities:
  - preferred_term: UDP-N-acetylglucosamine
    term:
      id: CHEBI:16264
      label: UDP-N-acetyl-alpha-D-glucosamine
  downstream:
  - target: Reduced N-Glycan Branching
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:24031089
    reference_title: "Mutations in SLC35A3 cause autism spectrum disorder, epilepsy and arthrogryposis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SLC35A3 encodes the major \nGolgi uridine diphosphate N-acetylglucosamine (UDP-GlcNAc) transporter. In Golgi \nvesicles isolated from patient fibroblasts the transport of the respective \nnucleotide sugar was significantly reduced"
    explanation: Establishes reduced Golgi UDP-GlcNAc transport as the core molecular defect in patient fibroblasts.
  - reference: PMID:23766508
    reference_title: "UDP-N-acetylglucosamine transporter (SLC35A3) regulates biosynthesis of highly branched N-glycans and keratan sulfate."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SLC35A3 is considered the main UDP-N-acetylglucosamine transporter (NGT) in \nmammals."
    explanation: Confirms SLC35A3 as the principal mammalian Golgi UDP-GlcNAc transporter whose loss is the primary lesion.
  - reference: PMID:41554664
    reference_title: "CDG due to Defective Membrane Transporters: Update."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Most CDG are enzymatic \ndeficiencies, but 13 (6.5%) are defects in the ER, Golgi apparatus (GA), and \nplasma membrane transporters."
    explanation: Places SLC35A3-CDG within the membrane-transporter subgroup of congenital disorders of glycosylation.
- name: Reduced N-Glycan Branching
  description: >
    Reduced lumenal UDP-GlcNAc limits the N-acetylglucosaminyltransferases
    (e.g., MGAT4/MGAT5) that add the GlcNAc branch points of complex N-glycans,
    causing a massive decrease in highly branched tri- and tetraantennary
    N-glycans at the cell surface and a reciprocal accumulation of lower-branched
    (mono- and diantennary) glycoforms. Follow-up biochemical testing in patients
    confirms abnormal protein glycosylation consistent with a defective Golgi
    UDP-GlcNAc transporter. This altered branching signature has been associated
    with growth arrest and induction of differentiation.
  biological_processes:
  - preferred_term: N-glycan processing
    term:
      id: GO:0006491
      label: N-glycan processing
    modifier: ABNORMAL
  chemical_entities:
  - preferred_term: UDP-N-acetylglucosamine
    term:
      id: CHEBI:16264
      label: UDP-N-acetyl-alpha-D-glucosamine
    modifier: DECREASED

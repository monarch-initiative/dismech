name: Autism Spectrum Disorder-Epilepsy-Arthrogryposis Syndrome
creation_date: "2026-07-30T00:00:00Z"
description: >-
  Autism spectrum disorder-epilepsy-arthrogryposis syndrome (SLC35A3-CDG) is a
  rare autosomal recessive congenital disorder of N-linked glycosylation caused
  by biallelic pathogenic variants in SLC35A3 (1p21), which encodes the major
  Golgi UDP-N-acetylglucosamine (UDP-GlcNAc) transporter. Loss of transporter
  activity reduces lumenal UDP-GlcNAc, the nucleotide-sugar donor for the
  N-acetylglucosaminyltransferases (GnTs) that build multiantennary N-glycans,
  producing a marked decrease in highly branched tri- and tetraantennary
  N-glycans and a reciprocal accumulation of lower-branched glycoforms at the
  cell surface (a type II CDG signature). The clinical spectrum is dominated by
  a neurodevelopmental triad of autism spectrum disorder, epilepsy (including
  early-onset epileptic encephalopathy with infantile spasms), and intellectual
  disability, combined with distal arthrogryposis and additional skeletal
  defects (vertebral anomalies, scoliosis, camptodactyly), acquired
  microcephaly, quadriplegia, and dysmorphic features. The human disease
  phenocopies the bovine SLC35A3 disorder Complex Vertebral Malformation
  syndrome. It is ultra-rare, reported in a small number of families since its
  2013 description.
category: Mendelian

    snippet: "SLC35A3 is considered the main UDP-N-acetylglucosamine transporter (NGT) in \nmammals."
    explanation: Confirms SLC35A3 as the principal mammalian Golgi UDP-GlcNAc transporter whose loss is the primary lesion.
- name: Reduced N-Glycan Branching
  description: >
    Reduced lumenal UDP-GlcNAc limits the N-acetylglucosaminyltransferases
    (e.g., MGAT4/MGAT5) that add the GlcNAc branch points of complex N-glycans,
    causing a massive decrease in highly branched tri- and tetraantennary
    N-glycans at the cell surface and a reciprocal accumulation of lower-branched
    (mono- and diantennary) glycoforms. Follow-up biochemical testing in patients
    confirms abnormal protein glycosylation consistent with a defective Golgi
    UDP-GlcNAc transporter. This altered branching signature has been associated
    with growth arrest and induction of differentiation.
  biological_processes:
  - preferred_term: N-glycan processing
    term:
      id: GO:0006491
      label: N-glycan processing
    modifier: ABNORMAL
  chemical_entities:
  - preferred_term: UDP-N-acetylglucosamine
    term:
      id: CHEBI:16264
      label: UDP-N-acetyl-alpha-D-glucosamine
    modifier: DECREASED

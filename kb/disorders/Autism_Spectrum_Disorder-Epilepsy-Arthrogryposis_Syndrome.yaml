discussions:
- discussion_id: slc35a3_sole_transporter_model_mismatch
  prompt: >-
    Is SLC35A3 truly the sole/primary Golgi UDP-GlcNAc transporter in humans, or
    do redundant transport routes compensate in a cell-type-dependent manner?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Golgi UDP-GlcNAc Transport
  rationale: >-
    Patient fibroblasts show reduced Golgi UDP-GlcNAc transport and loss of
    highly branched N-glycans, supporting SLC35A3 as the major transporter.
    However, CRISPR knockout of SLC35A3 in CHO, HEK293T, and HepG2 cell lines
    gives cell-context-dependent results: in CHO cells N-glycan branching was
    impaired even though vesicular UDP-GlcNAc transport was not decreased, and in
    HepG2 cells no qualitative N-glycan change was seen — implying redundant or
    alternative UDP-GlcNAc transport routes. Whether this redundancy operates in
    the human neural and skeletal tissues that drive the disease phenotype is
    unresolved, so a negative cell-line transport result should not be treated as
    disproof of the human patient-fibroblast lesion.
  evidence:
  - reference: PMID:32938718
    reference_title: "Biosynthesis of GlcNAc-rich N- and O-glycans in the Golgi apparatus does not require the nucleotide sugar transporter SLC35A3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These \nfindings suggest that SLC35A3 may not be the primary UDP-GlcNAc transporter \nand/or different mechanisms of UDP-GlcNAc transport into the Golgi apparatus may \nexist."
    explanation: Knockout cell-line data question whether SLC35A3 is the sole/primary UDP-GlcNAc transporter, defining the model-vs-human gap.
  - reference: PMID:32938718
    reference_title: "Biosynthesis of GlcNAc-rich N- and O-glycans in the Golgi apparatus does not require the nucleotide sugar transporter SLC35A3."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "in SLC35A3-knockout CHO cells, only limited \nchanges were observed; GlcNAc was still incorporated into N-glycans, but complex \ntype N-glycan branching was impaired, although UDP-GlcNAc transport into Golgi \nvesicles was not decreased."
    explanation: Shows the dissociation between branching defect and measurable transport in one knockout cell model, motivating the mismatch.
- discussion_id: slc35a3_lfng_notch_segmentation_untested
  prompt: >-
    Does SLC35A3 loss disrupt somite formation specifically by starving LFNG of
    UDP-GlcNAc and thereby dysregulating Notch segmentation-clock signaling in
    the presomitic mesoderm, or through another route?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Somite Segmentation
  rationale: >-
    The SLC35A3→LFNG→Notch segmentation-clock mechanism is currently inferred
    from Slc35a3 presomitic-mesoderm expression and the CVM-like vertebral
    phenotype of Slc35a3-null mice, not from direct measurement of Notch
    signaling. The originating study explicitly frames it as a hypothesis still
    requiring test: the expression of segmentation-clock Notch molecules in
    Slc35a3-null embryos has not yet been examined.
  proposed_experiments:
  - experiment_id: exp_slc35a3_notch_clock_psm
    name: Segmentation-clock Notch profiling in Slc35a3-null presomitic mesoderm
    description: >-
      Examine the expression and cyclic oscillation of Notch segmentation-clock
      molecules (e.g., Lfng, Hes7, and cyclic Notch target genes) in the
      presomitic mesoderm of Slc35a3-null embryos during somite formation,
      compared with wild-type littermates.
    decision_criterion: >-
      Disrupted or dampened cyclic Notch/Lfng expression in the Slc35a3-null PSM
      would support the LFNG-substrate-supply model; preserved oscillation would
      point to a Notch-independent route to malsegmentation.
  evidence:
  - reference: PMID:37053259
    reference_title: "Mice lacking nucleotide sugar transporter SLC35A3 exhibit lethal chondrodysplasia with vertebral anomalies and impaired glycosaminoglycan biosynthesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "To investigate this hypothesis, the expression of Notch signaling molecules involved in the segmentation clock should be examined in detail during somite formation"
    explanation: The originating mouse study frames the SLC35A3-LFNG-Notch segmentation-clock mechanism as an untested hypothesis requiring direct examination.
- discussion_id: slc35a3_neuronal_glycoprotein_targets_unknown
  prompt: >-
    Which specific neuronal glycoproteins, hypoglycosylated as a consequence of
    SLC35A3 deficiency, drive the autism / epilepsy / intellectual-disability
    phenotype?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Neurodevelopmental Dysfunction
  rationale: >-
    The neurodevelopmental phenotype is attributed to impaired glycosylation of
    central-nervous-system proteins, but the specific responsible glycoproteins
    remain unidentified and the causal link is stated only as a possibility.
    This is why Neurodevelopmental Dysfunction is deliberately modeled as a
    single coarse node rather than a resolved molecular cascade.
  proposed_experiments:
  - experiment_id: exp_slc35a3_neural_glycoproteomics
    name: Glycoproteomics of SLC35A3-deficient patient-derived neural cells
    description: >-
      Perform site-specific N-glycoproteomics (lectin/HILIC enrichment with mass
      spectrometry) on SLC35A3-patient-derived or iPSC-derived neurons versus
      isogenic controls to identify the neuronal glycoproteins whose branched
      N-glycans are selectively lost, prioritizing candidates in
      neurodevelopmental and synaptic pathways.
    decision_criterion: >-
      Reproducible loss of highly branched N-glycans on a defined set of
      CNS-expressed glycoproteins, enriched for neurodevelopmental function,
      would nominate specific molecular effectors of the phenotype; a diffuse,
      non-selective glycosylation shift would instead support a global,
      non-target-specific mechanism.
  evidence:
  - reference: PMID:28328131
    reference_title: "Recessive mutations in SLC35A3 cause early onset epileptic encephalopathy with skeletal defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurological symptoms and skeletal abnormalities might result from impaired \nglycosylation of proteins involved in normal development and function of the \ncentral nervous system"
    explanation: The mechanistic link to CNS-protein glycosylation is stated only as a possibility, leaving the specific target glycoproteins undefined.

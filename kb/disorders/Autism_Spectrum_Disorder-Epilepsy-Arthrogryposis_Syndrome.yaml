  description: >-
    Autosomal recessive; affected individuals carry biallelic (homozygous or
    compound heterozygous) SLC35A3 variants. The disorder was first defined in a
    large kindred with eight affected individuals carrying deleterious SLC35A3
    variants; subsequent families have carried compound heterozygous or
    homozygous variants.
  evidence:

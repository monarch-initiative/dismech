    explanation: In vitro NGT-deficient cells recapitulate the reduced multiantennary branching with accumulation of lower-branched glycans.
- name: Neurodevelopmental Dysfunction
  description: >
    Abnormal N-glycosylation of neural glycoproteins is proposed to impair normal
    development and function of the central nervous system, manifesting as autism
    spectrum disorder, epilepsy (including early-onset epileptic encephalopathy
    with infantile spasms and a suppression-burst EEG pattern), intellectual
    disability, and acquired microcephaly. The neurodevelopmental triad of
    autism, epilepsy, and intellectual disability is the clinical hallmark of the
    syndrome.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  evidence:
  - reference: PMID:24031089
    reference_title: "Mutations in SLC35A3 cause autism spectrum disorder, epilepsy and arthrogryposis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "eight patients from a \nlarge kindred, who suffered from autism spectrum disorder, arthrogryposis and \nepilepsy."
    explanation: Establishes the neurodevelopmental triad (autism, epilepsy) as the presenting phenotype of the founding kindred.
  - reference: PMID:28328131
    reference_title: "Recessive mutations in SLC35A3 cause early onset epileptic encephalopathy with skeletal defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurological symptoms and skeletal abnormalities might result from impaired \nglycosylation of proteins involved in normal development and function of the \ncentral nervous system and skeletal apparatus."
    explanation: Links the neurological phenotype mechanistically to impaired glycosylation of CNS proteins.
- name: Skeletal and Joint Dysgenesis
  description: >
    Impaired glycosylation of proteins required for normal skeletal and joint
    development produces distal arthrogryposis (congenital contractures
    predominant in the hands), vertebral anomalies (butterfly and hemivertebrae),
    scoliosis, camptodactyly, and additional skeletal defects. Beyond N-glycan
    branching, in vivo evidence implicates impaired glycosaminoglycan (GAG)
    biosynthesis: Slc35a3-null mice develop lethal chondrodysplasia with
    CVM-like vertebral anomalies, drastically reduced growth-plate cartilage
    extracellular matrix, and significantly decreased heparan sulfate, keratan
    sulfate, and chondroitin/dermatan sulfate. The bovine SLC35A3 disorder
    Complex Vertebral Malformation syndrome recapitulates the same
    arthrogryposis-with-skeletal-defects phenotype, supporting a conserved
    glycosylation-dependent mechanism of skeletal patterning.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: glycosaminoglycan biosynthetic process
    term:

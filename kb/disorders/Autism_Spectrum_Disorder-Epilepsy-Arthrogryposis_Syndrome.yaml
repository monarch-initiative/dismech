biochemical:
- name: Reduced highly branched N-glycans
  notes: >-
    The biochemical hallmark is a decrease in cell-surface highly branched
    (tri- and tetraantennary) N-glycans with a reciprocal increase in
    lower-branched glycoforms, reflecting the Golgi UDP-GlcNAc deficiency;
    patient biochemical testing confirms abnormal protein glycosylation
    consistent with a defective Golgi UDP-GlcNAc transporter. This is a type II
    CDG glycosylation signature. Because SLC35A3 primarily affects branching
    rather than whole-transferrin galactosylation/sialylation, routine serum
    transferrin screening may be less sensitive than direct N-glycan branching
    analysis.
  evidence:
  - reference: PMID:28777481
    reference_title: "A human case of SLC35A3-related skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "biochemical analysis confirmed abnormal protein glycosylation, consistent with a \ndefective Golgi UDP-GlcNAc transporter, validating the mutations."
    explanation: Patient biochemical testing confirms abnormal glycosylation from a defective Golgi UDP-GlcNAc transporter.
genetic:
- name: SLC35A3
  association: Loss of function mutation
  variant_origin: GERMLINE
  features: >-
    Autosomal recessive gene at 1p21 encoding the major Golgi UDP-GlcNAc
    transporter. Biallelic (homozygous or compound heterozygous) pathogenic
    variants (missense and other deleterious variants) reduce UDP-GlcNAc
    transport into the Golgi, impairing N-glycan branching.
  gene_term:
    preferred_term: SLC35A3
    term:
      id: hgnc:11023
      label: SLC35A3
  evidence:
  - reference: PMID:24031089
    reference_title: "Mutations in SLC35A3 cause autism spectrum disorder, epilepsy and arthrogryposis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified \ndeleterious mutations in SLC35A3 in these patients. SLC35A3 encodes the major \nGolgi uridine diphosphate N-acetylglucosamine (UDP-GlcNAc) transporter."
    explanation: Establishes SLC35A3 as the causal gene via linkage and exome sequencing.
  - reference: PMID:28328131
    reference_title: "Recessive mutations in SLC35A3 cause early onset epileptic encephalopathy with skeletal defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identified novel compound heterozygous mutations in SLC35A3 in both children."
    explanation: Independent family confirming recessive SLC35A3 variants as causal.

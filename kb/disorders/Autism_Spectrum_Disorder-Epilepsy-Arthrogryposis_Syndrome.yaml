    snippet: "SLC35A3 transports UDP-GlcNAc used for the sugar modification that is essential for somite formation"
    explanation: Implicates the UDP-GlcNAc supply defect in impaired somite formation, the segmentation-clock mechanism.
- name: Vertebral Malsegmentation
  biological_scale: TISSUE
  description: >
    Mis-specification of the metameric somite template produces vertebral
    malsegmentation — butterfly and hemivertebrae throughout the spine — the
    axial-skeletal outcome of the segmentation defect, phenocopying the bovine
    Complex Vertebral Malformation syndrome.
  conforms_to: "axial_segmentation_serial_homology#Vertebral and Costal Malsegmentation"
  evidence:
  - reference: PMID:28777481
    reference_title: "A human case of SLC35A3-related skeletal dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "anomalous vertebrae, including butterfly, and hemivertebrae \nthroughout the spine,"
    explanation: Documents the human vertebral malsegmentation outcome of the segmentation defect.
- name: Impaired Glycosaminoglycan Biosynthesis
  biological_scale: MOLECULAR
  description: >
    Beyond N-glycan branching, SLC35A3 loss reduces the UDP-GlcNAc supply for
    glycosaminoglycan (GAG) chain synthesis. In Slc35a3-null mice the amounts of
    heparan sulfate, keratan sulfate, and chondroitin/dermatan sulfate are all
    significantly decreased, implicating impaired GAG (and therefore proteoglycan)
    biosynthesis as a distinct arm of the skeletal pathology.
  biological_processes:
  - preferred_term: glycosaminoglycan biosynthetic process
    term:
      id: GO:0006024
      label: glycosaminoglycan biosynthetic process
    modifier: DECREASED
  downstream:
  - target: Growth Plate Cartilage ECM Deficiency
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37053259
    reference_title: "Mice lacking nucleotide sugar transporter SLC35A3 exhibit lethal chondrodysplasia with vertebral anomalies and impaired glycosaminoglycan biosynthesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "the amounts of heparan sulfate, keratan sulfate, and chondroitin sulfate/dermatan sulfate, were significantly decreased"
    explanation: Establishes decreased glycosaminoglycan biosynthesis as a discrete downstream lesion.
- name: Growth Plate Cartilage ECM Deficiency
  biological_scale: TISSUE
  description: >
    Decreased GAG/proteoglycan biosynthesis degrades the quality of the
    growth-plate cartilage extracellular matrix. In Slc35a3-null embryos the
    growth-plate extracellular space is drastically reduced and proliferative
    chondrocytes are reshaped, with proliferation, apoptosis, and differentiation
    unaffected — indicating the chondrodysplasia arises from abnormal ECM quality
    rather than chondrocyte loss.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  downstream:
  - target: Skeletal and Joint Dysgenesis
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37053259
    reference_title: "Mice lacking nucleotide sugar transporter SLC35A3 exhibit lethal chondrodysplasia with vertebral anomalies and impaired glycosaminoglycan biosynthesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "extracellular space was drastically reduced, and many flat proliferative chondrocytes were reshaped"
    explanation: Localizes the lesion to growth-plate cartilage ECM quality, the intermediate step to skeletal dysgenesis.
- name: Skeletal and Joint Dysgenesis
  biological_scale: TISSUE
  description: >
    Abnormal cartilage extracellular matrix and impaired glycosylation of
    proteins required for normal skeletal and joint development produce distal
    arthrogryposis (congenital contractures predominant in the hands), scoliosis,
    camptodactyly, chondrodysplasia, and additional skeletal defects. The bovine
    SLC35A3 disorder Complex Vertebral Malformation syndrome recapitulates the
    same arthrogryposis-with-skeletal-defects phenotype, supporting a conserved
    glycosylation-dependent mechanism of skeletal patterning.
  evidence:
  - reference: PMID:28328131
    reference_title: "Recessive mutations in SLC35A3 cause early onset epileptic encephalopathy with skeletal defects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "General examination showed \ndistal arthrogryposis predominant in the hands in both siblings and severe left \ndorso-lumbar convex scoliosis in one."
    explanation: Documents distal arthrogryposis and scoliosis as the skeletal/joint consequences.
  - reference: PMID:24031089
    reference_title: "Mutations in SLC35A3 cause autism spectrum disorder, epilepsy and arthrogryposis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Spontaneous mutation in SLC35A3 has been discovered in cattle \nworldwide, recapitulating the human phenotype with arthrogryposis and additional \nskeletal defects known as Complex Vertebral Malformation syndrome."
    explanation: Bovine SLC35A3 model recapitulates the human arthrogryposis and skeletal-defect phenotype.
  - reference: PMID:37053259
    reference_title: "Mice lacking nucleotide sugar transporter SLC35A3 exhibit lethal chondrodysplasia with vertebral anomalies and impaired glycosaminoglycan biosynthesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "perinatal lethal and exhibited chondrodysplasia recapitulating CVM-like vertebral anomalies"
    explanation: Slc35a3-null mice recapitulate the CVM-like chondrodysplasia/skeletal phenotype, providing in vivo causal evidence.

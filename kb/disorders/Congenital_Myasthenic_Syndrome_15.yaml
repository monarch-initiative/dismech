diagnosis:
- name: Repetitive nerve stimulation
  description: >-
    A decremental compound muscle action potential response localises the
    defect to the neuromuscular junction. It does not distinguish CMS15 from
    other congenital myasthenic syndromes, and in the severe infantile form the
    profound hypotonia and encephalopathy can make the myasthenic component
    easy to miss altogether.
  evidence:
  - reference: PMID:34971077
    reference_title: "The longest reported sibling survivors of a severe form of congenital
      myasthenic syndrome with the ALG14 pathogenic variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Repetitive nerve stimulation test showed an abnormal decrease in compound
      muscle action potential."
    explanation: Demonstrates the diagnostic electrophysiological finding.
- name: Exome or genome sequencing of ALG14
  description: >-
    Definitive diagnosis rests on identifying biallelic ALG14 variants. Because
    the severe form presents as an encephalopathy with contractures rather than
    as a myasthenia, it is frequently reached by broad sequencing rather than
    by a targeted neuromuscular panel.
  evidence:
  - reference: PMID:34971077
    reference_title: "The longest reported sibling survivors of a severe form of congenital
      myasthenic syndrome with the ALG14 pathogenic variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing indicated that the siblings had novel compound heterozygous
      missense variants, c.590T>G (p.Val197Gly) and c.433G>A (p.Gly145Arg), in exon
      4 of ALG14."
    explanation: Illustrates exome sequencing as the route to diagnosis.
treatments:
- name: Pyridostigmine
  description: >-
    An acetylcholinesterase inhibitor, the standard first-line treatment for
    postsynaptic congenital myasthenic syndromes. By slowing the hydrolysis of
    acetylcholine it prolongs transmitter dwell time in the cleft, partially
    compensating for the reduced number of endplate receptors. It does not
    address the glycosylation defect, which is why the response tracks the
    severity of the underlying allele: benefit was only temporary in the
    lethal infantile cohort, while long-surviving siblings gained
    respirator-free time.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pyridostigmine
      term:
        id: CHEBI:8665
        label: Pyridostigmine
  evidence:
  - reference: PMID:34971077
    reference_title: "The longest reported sibling survivors of a severe form of congenital
      myasthenic syndrome with the ALG14 pathogenic variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After treatment with pyridostigmine, the time off the respirator increased."
    explanation: Reports a measurable functional benefit of pyridostigmine in ALG14-related
      CMS.
  - reference: PMID:28733338
    reference_title: "Early and lethal neurodegeneration with myasthenic and myopathic
      features: A new-CDG."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "In 2 of our patients, electrophysiologic testing showed abnormal decrement,
      but treatment with pyridostigmine led only to temporary improvement."
    explanation: Records that the benefit was temporary in the severe form, which is
      why this evidence is graded partial rather than supporting.
- name: Cholinesterase inhibition across the glycosylation CMS group
  description: >-
    The founding study proposed that cholinesterase inhibition may help more
    broadly across congenital disorders of glycosylation affecting the
    neuromuscular junction. This is a suggestion made by the authors rather
    than a trial result, and is recorded as such.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:23404334
    reference_title: "Congenital myasthenic syndromes due to mutations in ALG2 and
      ALG14."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings suggest that treatment with cholinesterase inhibitors may
      improve muscle function in many of the congenital disorders of glycosylation."
    explanation: An authors' suggestion extrapolated from their findings, not a treatment
      study; graded partial for that reason.
discussions:
- discussion_id: alg14_spectrum_one_entity
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Should the limb-girdle myasthenic form and the lethal infantile
    neurodegenerative form of ALG14 deficiency be one dismech entry or two?
  attaches_to:
  - pathophysiology#Impaired Glycosylation in Neural Tissue
  rationale: >-
    They share a gene, a biochemical lesion and a MONDO term, which is the
    argument for one entry, and this entry takes that position. But they
    differ in nearly everything a clinician would use to recognise them: age
    of onset, whether the central nervous system is involved at all, survival,
    and whether the presenting problem looks myasthenic. The authors of the
    severe cohort described their patients as a new congenital disorder of
    glycosylation rather than as a congenital myasthenic syndrome, and MONDO
    places this term under both congenital myasthenic syndrome and
    ALG14-congenital disorder of glycosylation. If the KB later adopts a
    convention of splitting allelic series whose poles differ in organ
    involvement, this entry is a candidate for splitting into a myasthenic
    entry and a CDG entry linked by gene.
- discussion_id: neurodegeneration_intermediate_steps_unknown
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which hypoglycosylated proteins mediate the cerebral atrophy and epilepsy
    of severe ALG14 deficiency?
  attaches_to:
  - pathophysiology#Impaired Glycosylation in Neural Tissue
  rationale: >-
    The endplate arm of this disease has a named target: acetylcholine
    receptor surface expression falls when ALG14 is silenced, shown directly.
    The central nervous system arm has no equivalent. Cerebral atrophy,
    delayed myelination and refractory epilepsy are well documented, but no
    specific neural glycoprotein has been shown to be hypoglycosylated and no
    intermediate step between the biosynthetic defect and the neurodegeneration
    has been established. The pathophysiology node therefore asserts an
    association at tissue scale rather than a mechanism, and should not be read
    as more than that.
prevalence:

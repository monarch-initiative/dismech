name: Congenital Myasthenic Syndrome 15
creation_date: "2026-08-28T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: Congenital myasthenic syndrome 15
  term:
    id: MONDO:0014542
    label: congenital myasthenic syndrome 15
parents:
- Congenital Myasthenic Syndrome
synonyms:
- CMS15
- ALG14 congenital myasthenic syndrome
- congenital myasthenic syndrome caused by mutation in ALG14
- myasthenic syndrome, congenital, 15, without tubular aggregates
- ALG14-CDG
description: >-
  Congenital myasthenic syndrome 15 (CMS15) is an autosomal recessive disorder
  of neuromuscular transmission caused by biallelic variants in ALG14. It
  belongs to the small group of congenital myasthenic syndromes that are also
  congenital disorders of glycosylation: the defective protein is not a
  component of the neuromuscular junction at all, but a subunit of the
  multiglycosyltransferase complex that, with ALG13 and DPAGT1, catalyses the
  first committed steps of asparagine-linked (N-linked) protein glycosylation
  in the endoplasmic reticulum.

  The mechanism is therefore indirect, and that is the point of the entry. The
  acetylcholine receptor is structurally normal and its genes are intact; what
  fails is the post-translational modification the receptor subunits need in
  order to fold, assemble and reach the postsynaptic membrane in adequate
  numbers. Endplate acetylcholine receptor deficiency is the consequence of a
  housekeeping biosynthetic defect, not of a receptor lesion, which is why the
  disease can be a myasthenia at one end of its allelic spectrum and a
  multisystem neurodegenerative disorder at the other.

  That spectrum is wide and worth stating explicitly. The founding cohort had
  an inherited limb-girdle pattern of fatigable weakness with no central
  nervous system involvement. Subsequent reports described a severe infantile
  form with congenital contractures, therapy-refractory epilepsy, progressive
  cerebral atrophy and death within the first year, described by its authors as
  a new congenital disorder of glycosylation rather than as a myasthenia. Both
  ends carry biallelic ALG14 variants and both sit under this MONDO term, so
  the entry curates the whole spectrum and marks which pole each phenotype and
  each piece of evidence comes from.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Patients carry biallelic ALG14 variants, homozygous or compound
    heterozygous, with unaffected heterozygous carrier parents. Reported
    genotypes are predominantly missense; a complete null on both alleles has
    not been described, which is consistent with ALG14's essential
    housekeeping role.
  evidence:
  - reference: PMID:28733338
    reference_title: "Early and lethal neurodegeneration with myasthenic and myopathic
      features: A new-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In all cases, parents were found to be heterozygous carriers."
    explanation: Establishes recessive segregation with unaffected heterozygous parents
      across three families.
  - reference: PMID:34971077
    reference_title: "The longest reported sibling survivors of a severe form of congenital
      myasthenic syndrome with the ALG14 pathogenic variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exome sequencing indicated that the siblings had novel compound heterozygous
      missense variants, c.590T>G (p.Val197Gly) and c.433G>A (p.Gly145Arg), in exon
      4 of ALG14."
    explanation: Documents a compound heterozygous genotype, the other biallelic configuration
      seen in this disease.
genetic:
- name: ALG14
  gene_term:
    preferred_term: ALG14
    term:
      id: hgnc:28287
      label: ALG14
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    ALG14 encodes a subunit of the UDP-N-acetylglucosamine transferase complex
    that it forms with ALG13 and DPAGT1 on the cytoplasmic face of the
    endoplasmic reticulum. The complex catalyses the first two committed steps
    of the dolichol-linked oligosaccharide pathway that supplies N-linked
    glycans. Because the gene is a general component of that pathway rather
    than a synapse-specific protein, the neuromuscular phenotype reflects the
    particular sensitivity of the endplate to reduced glycosylation capacity,
    and the severity of an allele determines how far beyond the endplate the
    disease extends. Two of the other subunits of the same pathway, DPAGT1 and
    ALG2, are themselves congenital myasthenic syndrome genes.
  variants:
  - name: "ALG14 c.220G>A (p.Asp74Asn)"
    description: >-
      The recurrent allele in the severe infantile neurodegenerative form,
      found homozygously in two patients and heterozygously in three others
      across three families.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:28733338
      reference_title: "Early and lethal neurodegeneration with myasthenic and myopathic
        features: A new-CDG."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Causative mutations in ALG14 were identified in all patients."
      explanation: Attributes the severe phenotype in this cohort to ALG14 variants.
  evidence:
  - reference: PMID:23404334
    reference_title: "Congenital myasthenic syndromes due to mutations in ALG2 and
      ALG14."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identify ALG14 and ALG2 as novel genes in which mutations cause a
      congenital myasthenic syndrome."
    explanation: Establishes ALG14 as a congenital myasthenic syndrome gene, the finding
      that defines this disease entity.
pathophysiology:
- name: Biallelic ALG14 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic ALG14 variants reduce the function of the ALG13-ALG14-DPAGT1
    multiglycosyltransferase complex, which catalyses the first two committed
    steps of asparagine-linked protein glycosylation on the cytoplasmic face of
    the endoplasmic reticulum. Reported alleles are predominantly missense, so
    residual activity is retained; the amount retained appears to set where a
    patient falls on the phenotypic spectrum.
  genetic_context:
    genes:
    - preferred_term: ALG14
      term:
        id: hgnc:28287
        label: ALG14
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Homozygous or compound heterozygous germline missense variants, including
      the recurrent p.Asp74Asn allele of the severe form and the p.Val197Gly /
      p.Gly145Arg compound heterozygous pair reported in long-surviving
      siblings.
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
    modifier: DECREASED
  - preferred_term: dolichol-linked oligosaccharide biosynthetic process
    term:
      id: GO:0006488
      label: dolichol-linked oligosaccharide biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:23404334
    reference_title: "Congenital myasthenic syndromes due to mutations in ALG2 and
      ALG14."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ALG14 is thought to form a multiglycosyltransferase complex with ALG13
      and DPAGT1 that catalyses the first two committed steps of asparagine-linked
      protein glycosylation."
    explanation: Identifies the biochemical complex and pathway step that ALG14 loss
      of function impairs.
  downstream:
  - target: Hypoglycosylation of Endplate Proteins
    causal_link_type: DIRECT
    description: >-
      Reduced flux through the first committed steps of N-linked glycosylation
      leaves proteins that depend on that pathway incompletely glycosylated.

- name: Hypoglycosylation of Endplate Proteins
  biological_scale: MOLECULAR
  description: >-
    ALG14 is concentrated at the muscle motor endplate, so the postsynaptic
    membrane is a site where reduced N-glycosylation capacity is felt
    disproportionately. Acetylcholine receptor subunits require N-linked
    glycans for correct folding, pentameric assembly and export; when the
    glycan supply is limited, fewer complete receptors reach the surface. The
    receptor genes themselves are intact, so this is a failure of
    post-translational processing rather than a receptor lesion.
  cell_types:
  - preferred_term: Skeletal muscle fiber endplate
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  locations:
  - preferred_term: Neuromuscular junction
    term:
      id: GO:0031594
      label: neuromuscular junction
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
    modifier: DECREASED
  evidence:
  - reference: PMID:23404334
    reference_title: "Congenital myasthenic syndromes due to mutations in ALG2 and
      ALG14."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that ALG14 is concentrated at the muscle motor endplates and
      small interfering RNA silencing of ALG14 results in reduced cell-surface expression
      of muscle acetylcholine receptor expressed in human embryonic kidney 293 cells."
    explanation: Localises ALG14 to the endplate and shows experimentally that reducing
      it lowers surface acetylcholine receptor, which is the step this node asserts.
  downstream:
  - target: Endplate Acetylcholine Receptor Deficiency
    causal_link_type: DIRECT
  - target: Impaired Glycosylation in Neural Tissue
    causal_link_type: DIRECT
    description: >-
      The same biosynthetic deficit acts outside muscle. Whether it becomes
      clinically apparent depends on how much residual ALG14 activity an
      allele leaves, which is why this branch is silent in the limb-girdle
      form and dominant in the severe infantile form.

- name: Endplate Acetylcholine Receptor Deficiency
  biological_scale: TISSUE
  description: >-
    The postsynaptic membrane carries too few acetylcholine receptors to
    guarantee that each nerve impulse depolarises the muscle fibre to
    threshold. Transmission consequently fails intermittently and
    use-dependently, which is measured electrophysiologically as a decremental
    response of the compound muscle action potential to repetitive nerve
    stimulation.
  cell_types:
  - preferred_term: Skeletal muscle fiber endplate
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  locations:
  - preferred_term: Neuromuscular junction
    term:
      id: GO:0031594
      label: neuromuscular junction
  molecular_functions:
  - preferred_term: acetylcholine receptor activity
    term:
      id: GO:0015464
      label: acetylcholine receptor activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: neuromuscular synaptic transmission
    term:
      id: GO:0007274
      label: neuromuscular synaptic transmission
    modifier: DECREASED
  evidence:
  - reference: PMID:34971077
    reference_title: "The longest reported sibling survivors of a severe form of congenital
      myasthenic syndrome with the ALG14 pathogenic variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pathogenic variant in ALG14 results in a severe pathological form
      of CMS causing end-plate acetylcholine receptor deficiency."
    explanation: States endplate acetylcholine receptor deficiency as the neuromuscular
      lesion in ALG14-related CMS.
  - reference: PMID:34971077
    reference_title: "The longest reported sibling survivors of a severe form of congenital
      myasthenic syndrome with the ALG14 pathogenic variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Repetitive nerve stimulation test showed an abnormal decrease in compound
      muscle action potential."
    explanation: Electrophysiological confirmation that neuromuscular transmission
      fails on repetitive stimulation.
  downstream:
  - target: Fatigable Skeletal Muscle Weakness
    causal_link_type: DIRECT

- name: Fatigable Skeletal Muscle Weakness
  biological_scale: ORGANISM
  description: >-
    Clinically the transmission failure appears as weakness that worsens with
    sustained activity. In the founding cohort the distribution was
    limb-girdle, sparing the ocular and bulbar muscles that dominate many other
    congenital myasthenic syndromes. In the severe infantile form the weakness
    is present from birth as profound hypotonia with respiratory and swallowing
    failure.
  cell_types:
  - preferred_term: Skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  evidence:
  - reference: PMID:23404334
    reference_title: "Congenital myasthenic syndromes due to mutations in ALG2 and
      ALG14."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "patients with an inherited limb-girdle pattern of myasthenic weakness"
    explanation: Describes the limb-girdle distribution of fatigable weakness in the
      cohort in which ALG14 was identified.

- name: Impaired Glycosylation in Neural Tissue
  biological_scale: TISSUE
  description: >-
    In severely affected patients the glycosylation deficit is not confined to
    the endplate. Progressive cerebral atrophy, delayed myelination and
    therapy-refractory epilepsy accompany the neuromuscular disease, and the
    authors of that cohort classified the condition as a new congenital
    disorder of glycosylation rather than as a myasthenia. The specific
    glycoproteins whose hypoglycosylation drives the neurodegeneration have not
    been identified, so this node records an established association whose
    intermediate steps are not resolved.
  biological_processes:
  - preferred_term: protein N-linked glycosylation
    term:
      id: GO:0006487
      label: protein N-linked glycosylation
    modifier: DECREASED
  evidence:
  - reference: PMID:28733338
    reference_title: "Early and lethal neurodegeneration with myasthenic and myopathic
      features: A new-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All 5 patients showed severe muscular hypotonia, progressive cerebral
      atrophy, and therapy-refractory epilepsy."
    explanation: Documents the central nervous system involvement that defines the
      severe pole of the spectrum.
  - reference: PMID:28733338
    reference_title: "Early and lethal neurodegeneration with myasthenic and myopathic
      features: A new-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These cases broaden the phenotypic spectrum associated with ALG14 congenital
      disorders of glycosylation as previously only isolated myasthenia has been described."
    explanation: States that the central nervous system phenotype extends the previously
      myasthenia-only ALG14 spectrum.

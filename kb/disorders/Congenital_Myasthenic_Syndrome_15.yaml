  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Reported in small numbers since the gene was identified in 2013. The severe
    infantile cohort comprised five patients from three families; individual
    later reports have added single families. No population prevalence estimate
    has been published.
  evidence:
  - reference: PMID:28733338
    reference_title: "Early and lethal neurodegeneration with myasthenic and myopathic
      features: A new-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This case study of 5 patients from 3 families includes clinical phenotype,
      serial MRI, electrophysiologic testing, muscle biopsy, and full autopsy."
    explanation: Gives the size of the largest reported cohort of the severe form.
progression:
- phase: Lethal infantile course
  age_range: birth to 12 months
  notes: >-
    In the severe form, onset is at or before birth with hypotonia and
    contractures, followed by refractory epilepsy and progressive cerebral
    atrophy, with death during the first year of life. This is not the
    universal course: siblings with a different compound heterozygous genotype
    were clinically stable at ages five and two, which is the observation
    behind treating allele severity as the main determinant of outcome.
  evidence:
  - reference: PMID:28733338
    reference_title: "Early and lethal neurodegeneration with myasthenic and myopathic
      features: A new-CDG."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three patients had congenital contractures. All patients died during
      their first year of life."
    explanation: Documents the fatal first-year course of the severe form.
notes: >-
  Entity identity. CMS15 is the ALG14 congenital myasthenic syndrome. MONDO
  defines MONDO:0014542 as "Any congenital myasthenic syndrome in which the
  cause of the disease is a mutation in the ALG14 gene", with exact synonym
  "ALG14 congenital myasthenic syndrome" and cross-reference OMIM:616227. It
  was described together with CMS14 (ALG2, with tubular aggregates) in a single
  2013 study, and the MONDO synonym "without tubular aggregates" preserves that
  pairing. It is not the SLC18A3/VAChT congenital myasthenic syndrome, which is
  a separate entity with its own gene and OMIM entry.

  This matters because an openscientist deep-research report generated for this
  entry during curation was entirely about SLC18A3/VAChT while citing
  OMIM:616227, and none of its content was usable. The report was discarded
  rather than curated from, and the two tooling gaps it exposed are filed as
  issues #9888 (deep-research runs are dispatched with an empty mondo_id, so
  the provider has no ontology grounding) and #9889 (preflight-dr skips its
  gene-identity check when MONDO records no RO:0004003 gene, even where the
  MONDO definition names the gene in plain text).

  Scope. The entry covers the full ALG14 allelic spectrum under one MONDO term
  and marks which pole each phenotype comes from, rather than curating only the
  myasthenic end. The case for splitting it is recorded under discussions
  instead of being settled unilaterally here.

  name: Myalgia
  description: >-
    Severe generalised muscle pain, incapacitating and limiting usual activity.
    It is one of the two features the surveillance case definition requires, so
    it is reported in every case by construction.
  phenotype_term:
    preferred_term: Myalgia
    term:
      id: HP:0003326
      label: Myalgia
  evidence:

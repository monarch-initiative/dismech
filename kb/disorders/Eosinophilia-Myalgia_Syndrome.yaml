definitions:
- name: CDC 1989 surveillance case definition
  definition_type: CASE_DEFINITION
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    The definition used to count the epidemic: debilitating generalised myalgia
    with an absolute eosinophil count at or above 1.0 x 10^9 cells per litre,
    and no infection or neoplasm accounting for the findings. It was built for
    outbreak surveillance rather than for diagnosis, and every frequency in this
    entry is conditioned on it.
  validation_status:
    status: UNVALIDATED
    rationale: >-
      Never validated by an appropriate challenge, on the account of the working
      group that reviewed it, and routinely used for purposes it was not built
      for. A revised set of criteria was proposed in the same paper and is not
      curated here.
    evidence:
    - reference: PMID:8895176
      reference_title: Criteria for the definition of the eosinophilia-myalgia syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "The widely disseminated surveillance case definition of the eosinophilia-myalgia syndrome (EMS) recommended by the Centers for Disease Control in 1989 has never been validated by an appropriate challenge and has commonly been used for unintended purposes."
      explanation: The validation status of this definition, stated directly.
  criteria_sets:
  - name: Surveillance criteria
    minimum_required: 2
    core_clinical_characteristics:
    - preferred_term: debilitating generalised myalgia
      term:
        id: HP:0003326
        label: Myalgia
      description: Severe enough to limit usual activity.
    - preferred_term: absolute eosinophil count at or above 1.0 x 10^9 cells per litre
      term:
        id: HP:0001880
        label: Increased total eosinophil count
      description: The numeric threshold the definition sets.
    exclusion_criteria:
    - preferred_term: infection accounting for the findings
      description: >-
        Any infection that could explain the myalgia and the eosinophilia.
        Deliberately unbound: the exclusion is a class of alternative diagnosis
        rather than a single concept, and no cited sentence names a term for it.
    - preferred_term: neoplasm accounting for the findings
      description: >-
        Any neoplasm that could explain the findings, including the clonal
        eosinophilias. Unbound for the same reason.
    evidence:
    - reference: PMID:2398610
      reference_title: Eosinophilia-myalgia syndrome. Results of national surveillance.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "A case is defined by debilitating myalgias and absolute eosinophilia greater than or equal to 1.0 x 10(9) cells/L."
      explanation: >-
        The definition in the surveillance report's own words. `minimum_required`
        is 2 because both features are required, not one of two.
  notes: >-
    `minimum_required: 2` records that the definition is conjunctive. The
    exclusion clause is carried as free text because the quoted sentence states
    the two positive requirements only; the exclusion comes from the definition
    as described elsewhere in the same literature and is not separately cited
    here. The `case_definition_validity` discussion is where the consequences of
    this definition for every frequency in the entry are argued.
environmental:
- name: Ingestion of manufactured L-tryptophan supplement containing process impurities
  description: >-
    Over-the-counter L-tryptophan taken as a sleep or mood supplement, from lots
    produced by one manufacturer after a change of fermentation strain and a
    reduction in the carbon purification step. Withdrawal of the product from
    the United States market ended the epidemic.
  exposure_term:
    preferred_term: exposure to a manufactured dietary supplement carrying process impurities
    term:
      id: ECTO:9002126
      label: exposure to environmental food contaminant
  influences_mechanisms:
  - target: Ingestion of Contaminated Manufactured L-Tryptophan
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The exposure is the disease's cause on every published account. It was
      essentially universal among cases and rare among controls, and incidence
      fell away when the product was recalled.
    evidence:
    - reference: PMID:8895184
      reference_title: Tryptophan produced by Showa Denko and epidemic eosinophilia-myalgia syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "In case-control studies of EMS, LT exposure was essentially universal among cases but rare among controls."
      explanation: >-
        States the exposure-disease link this edge asserts, across the
        case-control literature rather than in one study.
  evidence:
  - reference: PMID:2398610
    reference_title: Eosinophilia-myalgia syndrome. Results of national surveillance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Since the recall of over-the-counter preparations of tryptophan in November 1989, the number of new cases of this potentially fatal disorder has fallen dramatically."
    explanation: >-
      Removing the exposure removed the disease, which is the strongest single
      statement about this exposure in the surveillance literature.
  - reference: PMID:21702023
    reference_title: Post-epidemic eosinophilia-myalgia syndrome associated with L-tryptophan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Following the ban by the Food and Drug Administration (FDA) on the sale of L-tryptophan, the incidence of EMS declined rapidly."
    explanation: >-
      BACKGROUND: this is the post-epidemic case report's framing of the
      established history rather than its own result, and it is cited here
      because the same paper reports a case occurring after that decline.
  notes: >-
    The bound term names a contaminant in an ingested product rather than
    tryptophan, and that is deliberate. ECTO does have a tryptophan exposure
    class, `ECTO:9002895 exposure to tryptophan`, returned by `runoak -i
    ols:ecto search "tryptophan"` - it is rejected on two grounds. Ordinary
    dietary tryptophan and uncontaminated manufactured tryptophan are not
    implicated in this disease, so binding the amino acid would assert what the
    epidemiology rules out; and that CURIE is not resolvable in the committed
    ECTO build (`runoak -i sqlite:obo:ecto info ECTO:9002895` returns no label),
    so it is not a member of the `ExposureTerm` enum and does not validate. The
    only other candidate, `ECTO:0070245 exposure to dietary supplement,
    vitamin(s) and fatty acids via ingestion` from `runoak -i ols:ecto search
    "dietary supplement"`, names a route and loses the contaminant.
    `preferred_term` carries the full concept.
genetic:
- name: HLA-DRB1 alleles as susceptibility markers
  relationship_type: RISK_FACTOR
  gene_term:
    preferred_term: HLA-DRB1
    term:
      id: hgnc:4948
      label: HLA-DRB1
  notes: >-
    Not a causal gene and not heritable disease. In a cohort of 94 documented
    L-tryptophan users, DRB1*03 and DRB1*04 were associated with developing the
    syndrome after exposure, with wide confidence intervals in a small
    retrospective sample. That pair is the all-sources analysis, and it does not
    carry over whole: restricted to users of the implicated lots, which is the
    exposure this entry is scoped to, DRB1*03 was not a risk factor and DRB1*04
    remained one. The qualification is curated as its own evidence item below,
    and an earlier draft of this note omitted it. An earlier 32-patient cohort
    found a non-significant trend towards DR4.
  evidence:
  - reference: PMID:19790128
    reference_title: Immunogenetic risk and protective factors for the development of L-tryptophan-associated eosinophilia-myalgia syndrome and associated symptoms.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "higher LT dose (odds ratio [OR] 1.4, 95% confidence interval [95% CI] 1.1-1.8), age >45 years (OR 3.0, 95% CI 1.0-8.8), and HLA-DRB1*03 (OR 3.9, 95% CI 1.2-15.2), DRB1*04 (OR 3.9, 95% CI 1.1-16.4), and DQA1*0601 (OR 13.7, 95% CI 1.3-1.8) were risk factors for the development of EMS"
    explanation: >-
      The positive associations with their own intervals, alongside dose and
      age, which is the point of the study and the reason this record is typed
      RISK_FACTOR rather than CAUSATIVE.
  - reference: PMID:19790128
    reference_title: Immunogenetic risk and protective factors for the development of L-tryptophan-associated eosinophilia-myalgia syndrome and associated symptoms.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Similar risk and protective factors were seen for developing EMS following ingestion of implicated LT, except that DRB1*03 was not a risk factor and DQA1*0201 was an additional protective factor."
    explanation: >-
      The implicated-lot analysis, which is the one this entry's scope actually
      needs, and its two departures from the all-sources result. It supports the
      record while narrowing it: among users of the lots that caused the
      epidemic, DRB1*03 was not a risk allele.
  - reference: PMID:1673503
    reference_title: Clinical follow-up and immunogenetic studies of 32 patients with eosinophilia-myalgia syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "HLA-class II typing revealed a non-significant trend towards an association with HLA-DR4."
    explanation: >-
      INDIRECT, and the weakest item on this record. An earlier and smaller
      cohort found the direction and not the significance, which is a failure to
      confirm rather than a contradiction: a non-significant trend the same way
      does not cut against the association. An earlier draft graded this REFUTE,
      which read a null result as a negative one.
  - reference: PMID:19790128
    reference_title: Immunogenetic risk and protective factors for the development of L-tryptophan-associated eosinophilia-myalgia syndrome and associated symptoms.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "In addition to the xenobiotic dose and subject age, polymorphisms in immune response genes may underlie the development of certain xenobiotic-induced immune-mediated disorders"
    explanation: >-
      INDIRECT: the authors' generalisation from their own associations to a
      class of xenobiotic-induced disease, which is the reading that makes this
      an immune-response-gene record rather than an HLA curiosity.
- name: HLA-DQA1 alleles as protective markers
  relationship_type: PROTECTIVE
  gene_term:
    preferred_term: HLA-DQA1
    term:
      id: hgnc:4942
      label: HLA-DQA1
  notes: >-
    In the same 94-user cohort, DQA1*0501 was protective overall and DQA1*0201
    additionally protective among users of implicated lots, while DQA1*0601 was
    a risk allele. One gene therefore carries alleles in both directions, which
    is why this record is separate from the DRB1 one rather than folded into it.
  evidence:
  - reference: PMID:19790128
    reference_title: Immunogenetic risk and protective factors for the development of L-tryptophan-associated eosinophilia-myalgia syndrome and associated symptoms.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "whereas DRB1*07 (OR 0.12, 95% CI 0.02-0.48) and DQA1*0501 (OR 0.23, 95% CI 0.05-0.85) were protective"
    explanation: >-
      The protective associations with their intervals. The sentence names a
      DRB1 allele too, which is why the DRB1 record above is typed for risk on a
      different sentence rather than this one.
treatments:
- name: Withdrawal of the Implicated Supplement
  description: >-
    Stopping the L-tryptophan product. It is the only intervention that
    addresses the cause, and in the index series it was followed by improvement
    while patients remained symptomatic months later. At population level the
    recall ended the epidemic.
  treatment_term:
    preferred_term: discontinuation of the causative supplement
    term:
      id: NCIT:C128535
      label: Pharmacotherapy Discontinuation
  evidence:
  - reference: PMID:2314421
    reference_title: Association of the eosinophilia-myalgia syndrome with the ingestion of tryptophan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The discontinuation of tryptophan and the initiation of glucocorticoid treatment resulted in improvement, but all three women were still symptomatic three to five months later."
    explanation: >-
      Improvement after withdrawal, and its limit. The same sentence bundles
      withdrawal with glucocorticoid, so neither can be credited alone from it.
  notes: >-
    `NCIT:C128535` Pharmacotherapy Discontinuation is defined as "The
    discontinuation of treatment with a drug", and it is reachable from the
    `TreatmentTerm` root: `C128535` is-a `C21090` Pharmacologic Management is-a
    `C49236` Therapeutic Procedure is-a `C25218` Clinical Intervention or
    Procedure. `preferred_term` names the supplement rather than a drug, which
    is the one respect in which the binding is broader than the action.

    An earlier draft bound `NCIT:C15747` Supportive Care here and justified it
    with a note claiming no reachable NCIT term for stopping a causative agent
    exists. That claim was false, and it was reached by searching the committed
    `cache/ncit/terms.csv`, which holds only CURIEs already bound elsewhere in
    `kb/`. An empty result there is silence rather than a negative answer, which
    is the same error CLAUDE.md records for `ECTO:9001524`. The term was found by
    asking the ontology: `runoak -i sqlite:obo:ncit search "l~discontinuation"`.
- name: Systemic Glucocorticoid Therapy
  description: >-
    Prednisone in the acute phase. It was reported helpful in 79% of the
    patients who received it, and it reduces muscle pain and the eosinophil
    count. It does not prevent the chronic disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: prednisone
      term:
        id: CHEBI:8382
        label: prednisone
  evidence:
  - reference: PMID:7741371
    reference_title: "The eosinophilia-myalgia syndrome: status of 205 patients and results of treatment 2 years after onset."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Prednisone was reported to be helpful in 79% of patients who received it during the acute phase of the syndrome."
    explanation: >-
      The acute-phase benefit, from physician-completed review of 205 patients.
      It is a report of helpfulness rather than a controlled comparison.
  - reference: PMID:2001136
    reference_title: Eosinophilia-myalgia syndrome. A clinical case series of 21 patients. New Mexico Eosinophilia-Myalgia Syndrome Study Group.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Seven patients were treated with prednisone, and six showed improvement in muscle pain and a decrease in eosinophilia."
    explanation: >-
      Six of seven improving on two named measures, in an independent series.
  - reference: PMID:1673503
    reference_title: Clinical follow-up and immunogenetic studies of 32 patients with eosinophilia-myalgia syndrome.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Early therapy with corticosteroids did not seem to prevent the development of chronic manifestations."
    explanation: >-
      REFUTE against corticosteroids as disease-modifying. There is deliberately
      no `target_mechanisms` edge on this treatment: the acute benefit is on
      symptoms and the eosinophil count, and the one cohort that looked for
      prevention of chronic disease did not find it.
- name: Steroid-Sparing Immunosuppression
  description: >-
    Mycophenolate, methotrexate and anakinra have been used in the one
    post-epidemic case reported in detail. Prednisone with mycophenolate cleared
    the eosinophilia and the pulmonary ground-glass change and improved strength
    and myalgia modestly, and the skin induration and neuropathy went on
    worsening through it. Methotrexate and then anakinra added nothing.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Immunosuppressive Therapy
    term:
      id: NCIT:C15261
      label: Immunosuppressive Therapy
    therapeutic_agent:
    - preferred_term: mycophenolate mofetil
      term:
        id: CHEBI:8764
        label: mycophenolate mofetil
    - preferred_term: methotrexate
      term:
        id: CHEBI:44185
        label: methotrexate
  evidence:
  - reference: PMID:21702023
    reference_title: Post-epidemic eosinophilia-myalgia syndrome associated with L-tryptophan.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Although treatment with prednisone and mycophenolate resulted in modest improvement in proximal muscle strength and myalgia along with prompt resolution of peripheral blood eosinophilia and ground glass opacifications seen on CT scans, skin induration and neuropathy progressed."
    explanation: >-
      The partial benefit, in one patient, and INDIRECT because the regimen
      bundles mycophenolate with prednisone so neither can be credited alone.
      The same sentence is carried as REFUTE below against the fibrosis and the
      neuropathy, which it says got worse regardless.
  - reference: PMID:21702023
    reference_title: Post-epidemic eosinophilia-myalgia syndrome associated with L-tryptophan.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Addition of methotrexate (20 mg weekly for 5 months) followed by daily injections of anakinra for 3 months failed to yield further improvement in myalgia, neuropathy, or skin induration."
    explanation: >-
      REFUTE against methotrexate and anakinra in this disease. It is one
      patient and an uncontrolled sequence, which is why `notes` says what this
      record does not establish.
  notes: >-
    One patient. Everything here comes from a single 2011 case report, so the
    record is an account of what was tried rather than evidence of efficacy, and
    there is deliberately no `target_mechanisms` edge: nothing here shows any of
    these agents acting on a node of the pathograph. Read the REFUTE item the
    same way, as a failed sequence in one person rather than a demonstration
    that the drugs do not work.
- name: Supportive and Symptomatic Care
  description: >-
    Analgesia, respiratory management and management of the chronic
    complications. It is the mainstay because no other treatment was found
    consistently beneficial, and because most symptoms improved with time
    whatever was given.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:7741371
    reference_title: "The eosinophilia-myalgia syndrome: status of 205 patients and results of treatment 2 years after onset."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "No other treatment was reported to be consistently beneficial."
    explanation: >-
      INDIRECT, and quoted for what it concedes: with prednisone the only agent
      reported to help and only in the acute phase, supportive care is what
      remains. It is not a study of supportive care.
- name: Rehabilitation
  description: >-
    For the myopathy, the neuropathic disability and the contractures of the
    chronic phase.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  evidence:
  - reference: PMID:1673503
    reference_title: Clinical follow-up and immunogenetic studies of 32 patients with eosinophilia-myalgia syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The chronic sequelae most often associated with long-term disability are sclerodermatous skin thickening (54%), sensorimotor polyneuropathy (61%), proximal myopathy (36%), and severe episodic myalgias (64%)."
    explanation: >-
      INDIRECT: the source establishes the disabling sequelae that
      rehabilitation addresses, not the efficacy of rehabilitation in this
      disease, which no cited source reports.
prevalence:
- population: United States, 1989-1990 epidemic
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    A point-source epidemic that ended with a product recall, so a population
    rate would mislead and no numeric slot is filled. `prevalence_class` is
    NOT_YET_DOCUMENTED because no rate has been documented, not because the
    epidemic went uncounted. Published death tolls differ with the surveillance
    cut-off: 27 by July 1990 and 36 by August 1991. Those are the same quantity
    at two dates and are reported with their dates rather than reconciled.
  evidence:
  - reference: PMID:2398610
    reference_title: Eosinophilia-myalgia syndrome. Results of national surveillance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "As of July 10, 1990, a total of 1531 cases had been reported nationwide, including 27 deaths."
    explanation: The case count and death toll with the surveillance date attached.
  - reference: PMID:2398610
    reference_title: Eosinophilia-myalgia syndrome. Results of national surveillance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "the highest rates of reported illness are concentrated in the western states, 68% are non-Hispanic white women aged 35 years and older"
    explanation: >-
      The demographic concentration of reported cases, which tracked supplement
      use rather than any inherited factor.
progression:
- phase: Acute phase
  notes: >-
    Subacute onset of incapacitating generalised myalgia with blood
    eosinophilia, and with rash, peripheral oedema, fever, arthralgia, cough or
    dyspnoea, raised aldolase and abnormal liver tests. Eosinophil granule
    proteins are detectable in serum, urine and tissue.
  evidence:
  - reference: PMID:2398610
    reference_title: Eosinophilia-myalgia syndrome. Results of national surveillance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The most frequent features include arthralgia (73%), rash (60%), cough or dyspnea (59%), peripheral edema (59%), elevated aldolase level (46%), and elevations in the results of liver function tests (43%)."
    explanation: The acute clinical picture with frequencies, from national surveillance.
- phase: Chronic fibrotic and neuromuscular phase
  notes: >-
    Sclerodermatous skin thickening, sensorimotor polyneuropathy, proximal
    myopathy and episodic myalgia, persisting after the eosinophilia has
    resolved. Nearly all findings improved over eighteen to twenty-four months
    except peripheral neuropathy, and cognitive change was reported worse in
    about a third.
  evidence:
  - reference: PMID:7741371
    reference_title: "The eosinophilia-myalgia syndrome: status of 205 patients and results of treatment 2 years after onset."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "After 18 to 24 months, all symptoms except cognitive changes were reported to have improved in most patients."
    explanation: The direction of the chronic phase and its one named exception.
  - reference: PMID:1673503
    reference_title: Clinical follow-up and immunogenetic studies of 32 patients with eosinophilia-myalgia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The chronic sequelae most often associated with long-term disability are sclerodermatous skin thickening (54%), sensorimotor polyneuropathy (61%), proximal myopathy (36%), and severe episodic myalgias (64%)."
    explanation: The four sequelae that disable, with frequencies, in a followed cohort.
- phase: Late outcome
  notes: >-
    Excess mortality concentrated early. All-cause mortality over follow-up was
    19% in definite cases against 3% in exposed-but-not-ill users, and two
    thirds of the deaths in definite cases happened within eighteen months of
    onset. Survivors kept reporting excess morbidity in six major symptoms, with
    severity falling over time.
  evidence:
  - reference: PMID:8624177
    reference_title: The natural history of eosinophilia-myalgia syndrome in a tryptophan-exposed cohort in South Carolina.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "During the follow-up interval, mortality from all causes was 19% in those with definite EMS, 7% in possible EMS, and 3% in those who were not ill."
    explanation: >-
      The mortality gradient across definite, possible and not-ill members of
      one tryptophan-exposed cohort, which is the comparison that makes the
      figure interpretable.
  - reference: PMID:8624177
    reference_title: The natural history of eosinophilia-myalgia syndrome in a tryptophan-exposed cohort in South Carolina.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Six deaths (66%) among the definite EMS case patients occurred during the 18 months immediately after symptom onset."
    explanation: The timing of the excess mortality, which is the prognostic point.
  - reference: PMID:8295183
    reference_title: "Eosinophilia-myalgia syndrome: mortality data from the US national surveillance system."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Older age and involvement of more than one organ system suggest a particularly poor prognosis"
    explanation: The two prognostic factors surveillance data identified.
animal_models:
- name: EBT-treated C57BL/6 mouse
  species: Mouse
  genotype: wild type
  publication: PMID:8163652
  description: >-
    Daily intraperitoneal EBT in female C57BL/6 mice produces inflammation and
    fibrosis of dermis and subcutis including fascia and perimysium, with
    increased and apparently degranulating mast cells, and with type I, III and
    VI collagen gene expression rising alongside dermal TGF-beta 1. It is the
    closest any animal comes to the human fibrosis.
  modeled_mechanisms:
  - target: Fascial and Dermal Fibrosis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Reproduces the tissue lesion in the right compartments from the candidate
      compound alone.
    limitations: >-
      Intraperitoneal rather than oral, which is not the route the disease took,
      and pure EBT rather than the contaminant mixture people ate. The mice do
      not develop the blood eosinophilia that defines the human syndrome, so the
      model reproduces the fibrosis without the disease. A review of every
      animal study in this disease concluded the models generally could not be
      reproduced.
    evidence:
    - reference: PMID:8163652
      reference_title: "A murine model of the eosinophilia-myalgia syndrome induced by 1,1'-ethylidenebis (L-tryptophan)."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "We report the development of inflammation and fibrosis affecting the dermis and subcutis, including the fascia and perimyseal tissues, after the daily intraperitoneal administration of EBT to female C57BL/6 mice."
      explanation: >-
        The measured lesion and its tissue distribution, which is what makes
        this link to the fibrosis node rather than to the whole disease.
    - reference: PMID:8163652
      reference_title: "A murine model of the eosinophilia-myalgia syndrome induced by 1,1'-ethylidenebis (L-tryptophan)."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "This murine model suggests that EBT may have been one of the mediators of EMS and should facilitate studies of the pathogenesis of EMS."
      explanation: >-
        INDIRECT, and the authors' own hedge: "one of the mediators", which is
        the level of claim this model supports.
  - target: Fibroblast Activation and Type I Collagen Overproduction
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      The collagen programme and its TGF-beta 1 association are reproduced in
      mouse skin, which is the human in vitro finding shown in vivo.
    limitations: >-
      Expression measured in whole dermis and subcutis rather than in isolated
      fibroblasts, so the cell of origin is inferred from location.
    evidence:
    - reference: PMID:8863345
      reference_title: A contaminant of L-tryptophan enhances expression of dermal collagen in a murine model of eosinophilia myalgia syndrome.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Increased procollagen gene expression was accompanied by evidence of enhanced TGF-beta 1 expression in the dermis and subcutis."
      explanation: >-
        Puts the collagen and TGF-beta 1 findings together in the same tissue,
        which is what the human node asserts.
  evidence:
  - reference: PMID:8163652
    reference_title: "A murine model of the eosinophilia-myalgia syndrome induced by 1,1'-ethylidenebis (L-tryptophan)."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Such changes are accompanied by increased numbers of mast cells, many of which appear to be degranulating."
    explanation: >-
      The mast cell finding, and the degranulation, which the mouse shows more
      clearly than any human specimen. Its human counterpart is now curated on
      `Inflammatory Infiltration of Fascia, Perimysium and Dermis` from
      `PMID:2273104`, which reports numerous mast cells in some patients. An
      earlier draft of this explanation said the finding had no human
      counterpart in the entry, which was true of the entry and not of the
      literature.
- name: EBT-treated Lewis rat
  species: Rat
  genotype: wild type
  publication: PMID:8450062
  description: >-
    Lewis rats given case-associated L-tryptophan or synthetic EBT develop
    myofascial thickening, and a separate study found perimysial and fascial
    thickening with lymphocytes, macrophages and sparse eosinophils plus sparse
    perineurial infiltrate. Control L-tryptophan produced a mild but significant
    thickening of its own.
  modeled_mechanisms:
  - target: Inflammatory Infiltration of Fascia, Perimysium and Dermis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Reproduces the fascial and perimysial infiltrate, including the sparse
      perineurial component, from the candidate compound.
    limitations: >-
      No rash and no weakness in either group, so the clinical syndrome is
      absent. Control L-tryptophan also thickened the myofascia significantly
      against vehicle, which weakens the attribution to the contaminant, and the
      authors say their own results do not exclude other impurities. The second
      study found the changes in two of three treated rats.
    evidence:
    - reference: PMID:7991132
      reference_title: "1,1'-Ethylidenebis[tryptophan] induces pathologic alterations in muscle similar to those observed in the eosinophilia-myalgia syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "In two rats, perimysium and fascia were abnormally thickened and infiltrated with lymphocytes, macrophages, and sparse eosinophils; two rats had sparse perineurial inflammatory cells."
      explanation: >-
        The infiltrate and its compartments, matching the human node this link
        targets, with the animal counts stated.
    - reference: PMID:7991132
      reference_title: "1,1'-Ethylidenebis[tryptophan] induces pathologic alterations in muscle similar to those observed in the eosinophilia-myalgia syndrome."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "No rash or weakness occurred in either group."
      explanation: >-
        REFUTE against this being a model of the disease. The tissue lesion
        appears and the illness does not, which is why fidelity is LOW.
  evidence:
  - reference: PMID:8450062
    reference_title: "Pathological and immunological effects of ingesting L-tryptophan and 1,1'-ethylidenebis (L-tryptophan) in Lewis rats."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "All animals treated for 6 wk with case-associated L-TRP or EBT developed significant myofascial thickening, compared with animals in the vehicle control and control L-TRP groups."
    explanation: The primary result, with its comparison groups.
  - reference: PMID:8450062
    reference_title: "Pathological and immunological effects of ingesting L-tryptophan and 1,1'-ethylidenebis (L-tryptophan) in Lewis rats."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "they do not rule out the possibility that other impurities in the EMS-case-associated L-TRP may also contribute to some of the features of EMS"
    explanation: >-
      INDIRECT, and the authors' own limit on what their positive result
      licenses. It is the reason the exposure node names contaminants in the
      plural.
discussions:
- kind: KNOWLEDGE_GAP
  discussion_id: unidentified_etiologic_agent
  prompt: >-
    Which constituent of the implicated L-tryptophan caused eosinophilia-myalgia
    syndrome, and by what molecular route does it start the disease?
  attaches_to:
  - pathophysiology#Systemic Exposure to L-Tryptophan Process Contaminants
  - pathophysiology#Type 2 Cytokine Response to Peak E
  rationale: >-
    The exposure is not in doubt and the agent is. Six compounds were associated
    with case lots. EBT has the most work behind it and is the only one with
    animal and fibroblast data, and its epidemiological association does not
    survive stratification by date of manufacture. Nothing traces a molecular
    route from any candidate compound to the first lesion, which is why the edge
    out of the exposure node carries unknown intermediates.
  evidence:
  - reference: PMID:8895185
    reference_title: Animal models of the eosinophilia-myalgia syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The precise cause of EMS remains unknown."
    explanation: >-
      States the gap, in the closing sentence of a review of every animal study
      in the disease. Graded OTHER rather than MODEL_ORGANISM because the
      sentence is a statement about the human disease's etiology, not an animal
      result; the same reference's two other snippets in this entry are animal
      findings and stay MODEL_ORGANISM.
  - reference: PMID:37453474
    reference_title: Safety concerns regarding impurities in L-Tryptophan associated with eosinophilia myalgia syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Many in vitro and in vivo studies have been conducted to assess the putative correlation between impurities in L-tryptophan preparations and EMS, but no clear and convincing conclusions have been drawn so far."
    explanation: >-
      The same gap thirty years later, after the experimental work the earlier
      review was asking for.
- kind: HUMAN_MODEL_MISMATCH
  discussion_id: animal_models_lack_eosinophilia
  prompt: >-
    Why does EBT produce the fibrosis of this disease in mice and rats without
    producing the eosinophilia that defines it, and what host factor is missing?
  attaches_to:
  - animal_models#Mouse
  - animal_models#Rat
  - pathophysiology#Eosinophil Expansion with Tissue Degranulation
  rationale: >-
    This is a mismatch and not an absence of evidence. Both animal models
    reproduce the fascial and perimysial lesion, and neither produces the blood
    eosinophilia, the rash or the weakness. So the compound can make the
    fibrosis without making the disease, and the eosinophil arm of the human
    pathograph has no animal counterpart. A critical review of the whole animal
    literature went further and doubted the models could be reproduced at all,
    which is why every fidelity in this entry is MODERATE or lower.
  evidence:
  - reference: PMID:8895185
    reference_title: Animal models of the eosinophilia-myalgia syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, a critical review of all the animal studies casts doubt on the validity of these assertions."
    explanation: >-
      The reviewers' verdict on the claim that these are models of the syndrome,
      which is the mismatch this discussion records.
  - reference: PMID:8895185
    reference_title: Animal models of the eosinophilia-myalgia syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "These studies could generally not be reproduced and had methodologic flaws that limited extrapolation of results."
    explanation: The stated basis of that verdict.
  - reference: PMID:7991132
    reference_title: "1,1'-Ethylidenebis[tryptophan] induces pathologic alterations in muscle similar to those observed in the eosinophilia-myalgia syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "No rash or weakness occurred in either group."
    explanation: >-
      The concrete instance of the mismatch: the tissue lesion without the
      illness, in the study whose own conclusion is that it replicates an
      important feature of the human disease.
- kind: KNOWLEDGE_GAP
  discussion_id: myalgia_without_myofiber_injury
  prompt: >-
    What produces the incapacitating myalgia of this disease, given that muscle
    shows minimal myofiber atrophy, regeneration or necrosis?
  attaches_to:
  - phenotypes#Myalgia
  - pathophysiology#Inflammatory Infiltration of Fascia, Perimysium and Dermis
  rationale: >-
    Myalgia is one of the two features that define the syndrome, and the muscle
    pathology does not account for it. Eleven biopsied cases showed minimal
    myofiber damage despite severe myalgia in almost all of them, and the
    inflammatory infiltrate sits in perimysium, epimysium and fascia rather than
    in the fibres. No cited source asserts a mechanism, so `Myalgia` has no
    incoming causal edge in this entry. Toxic oil syndrome records the same gap
    for the same reason.
  evidence:
  - reference: PMID:1563745
    reference_title: "Pathologic manifestations of the eosinophilia myalgia syndrome: analysis of 11 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Minimal myofiber atrophy, regeneration, or necrosis was seen despite the clinical history of severe myalgias in almost all patients."
    explanation: >-
      The authors state the dissociation themselves, in the same sentence as the
      clinical severity.
  - reference: PMID:8895179
    reference_title: Pathophysiology of the eosinophilia-myalgia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The pathophysiology of the chronic symptoms is poorly understood but may involve ischemia, neuropathy, and metabolic abnormalities."
    explanation: >-
      The three candidate routes named at review level, none of which any cited
      source ties to the myalgia.
- kind: KNOWLEDGE_GAP
  discussion_id: tryptophan_metabolism_abnormality
  prompt: >-
    Is the abnormal tryptophan metabolism reported in EMS patients a step in the
    disease, or a consequence of the inflammation?
  attaches_to:
  - pathophysiology#Systemic Exposure to L-Tryptophan Process Contaminants
  - pathophysiology#Type 2 Cytokine Response to Peak E
  rationale: >-
    Patients show abnormal handling of tryptophan, which a contemporary review
    reads as increased activity of indoleamine 2,3-dioxygenase, the rate-limiting
    enzyme of the kynurenine pathway. IDO is induced by inflammatory cytokines,
    so the finding sits on both sides of the question and no cited source settles
    which. Nothing is wired into the pathograph for it, and that is the point of
    recording the gap: an entry about a tryptophan-derived contaminant has an
    obvious temptation to draw an arrow here.
  evidence:
  - reference: PMID:8423409
    reference_title: "L-tryptophan and the eosinophilia-myalgia syndrome: current understanding of the etiology and pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Evidence of abnormal L-tryptophan metabolism has been described in patients with EMS, and most likely reflects increased activity of indoleamine 2,3-dioxygenase, the rate-limiting enzyme of tryptophan metabolism."
    explanation: >-
      The finding and the proposed enzyme, at review level. "Most likely
      reflects" is the review's own hedge and is why this is a gap rather than a
      node.
- kind: CONTROVERSY
  discussion_id: case_definition_validity
  prompt: >-
    Does the 1989 surveillance case definition identify the disease, or does it
    select a severe subset and make its two required features unmeasurable?
  attaches_to:
  - phenotypes#Myalgia
  - phenotypes#Peripheral eosinophilia
  rationale: >-
    Every frequency in this literature is conditioned on a definition that was
    built for outbreak surveillance and never validated. Myalgia and
    eosinophilia are reported at 100% because the definition requires them, and
    milder illness without one of them falls outside the counted population.
    This is why the two definitional phenotypes here carry no `frequency` at all
    and every other frequency names its cohort.
  evidence:
  - reference: PMID:8895176
    reference_title: Criteria for the definition of the eosinophilia-myalgia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The widely disseminated surveillance case definition of the eosinophilia-myalgia syndrome (EMS) recommended by the Centers for Disease Control in 1989 has never been validated by an appropriate challenge and has commonly been used for unintended purposes."
    explanation: >-
      States both halves of the problem: never validated, and used for things it
      was not built for.
- kind: OPEN_QUESTION
  discussion_id: five_htp_related_illness
  prompt: >-
    Is the illness that followed contaminated L-5-hydroxytryptophan the same
    disease as the 1989 L-tryptophan epidemic?
  attaches_to:
  - pathophysiology#Systemic Exposure to L-Tryptophan Process Contaminants
  rationale: >-
    One family became ill after taking L-5-HTP that contained an impurity absent
    from comparison samples. One member met criteria for the syndrome and two
    others had eosinophilia that resolved when the product was replaced. An NIH
    observational study was built around such cases. Whether this is the same
    disease reached through a different supplement is unsettled, and this entry
    stays scoped to the L-tryptophan epidemic rather than deciding it.
  evidence:
  - reference: PMID:7699627
    reference_title: An eosinophilia-myalgia syndrome related disorder associated with exposure to L-5-hydroxytryptophan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The L-5-HTP used by the family contained an impurity not present in samples from the other patient group."
    explanation: The chemical finding that makes the parallel worth recording.
  - reference: PMID:7699627
    reference_title: An eosinophilia-myalgia syndrome related disorder associated with exposure to L-5-hydroxytryptophan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "One member of the family had EMS, and 2 others had eosinophilia."
    explanation: >-
      The clinical extent, and its limit. One case meeting criteria is why the
      title of that paper says "related disorder".
  - reference: clinicaltrials:NCT00001918
    reference_title: "L-5-Hydroxy-Tryptophan-Related Eosinophilia-Myalgia Syndrome (EMS): Clinical Patient Evaluation"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "More recently, similar impurities have been detected in batches of a similar dietary supplement called L-5-hydroxytryptophan."
    explanation: >-
      An NIH study description recording that the same class of impurity turned
      up in 5-HTP. Graded OTHER because a trial registration document is not
      study evidence.
clinical_trials:
- name: NCT00001918
  phase: NOT_APPLICABLE
  status: COMPLETED
  description: >-
    An NIH observational study evaluating patients who developed
    eosinophilia-myalgia syndrome after taking L-5-hydroxytryptophan, with
    clinical, neurologic, psychiatric, imaging and laboratory assessment and
    chemical analysis of the patients' own supplement samples. Not a treatment
    trial.
  target_phenotypes:
  - preferred_term: Myalgia
    term:
      id: HP:0003326
      label: Myalgia
  - preferred_term: Increased total eosinophil count
    term:
      id: HP:0001880
      label: Increased total eosinophil count
  evidence:
  - reference: clinicaltrials:NCT00001918
    reference_title: "L-5-Hydroxy-Tryptophan-Related Eosinophilia-Myalgia Syndrome (EMS): Clinical Patient Evaluation"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This study is designed to learn more about EMS that develops in patients taking L-5-hydroxytryptophan."
    explanation: >-
      The study's own statement of purpose. Graded OTHER because a registration
      record is a description of a study rather than evidence from one.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Mortality concentrated early and ran through the neuromuscular disease. Over
    follow-up of a tryptophan-exposed cohort, all-cause mortality was 19% in
    definite cases against 3% in exposed users who did not fall ill, and two
    thirds of those deaths came within eighteen months of onset. Of 36 deaths
    reported to national surveillance, 92% had neuromuscular sequelae and the
    commonest fatal process was progressive polyneuropathy and myopathy leading
    to pneumonia, sepsis or respiratory failure. Chronic morbidity in survivors
    is the larger burden: survivors of definite disease kept reporting excess
    myalgia, arthralgia, weakness, rash, alopecia and sclerodermiform skin
    change against exposed controls, with severity diminishing over time.
  evidence:
  - reference: PMID:8295183
    reference_title: "Eosinophilia-myalgia syndrome: mortality data from the US national surveillance system."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Of the 36 patients who died, 33 (92%) had neuromuscular sequelae, 29 (81%) had pulmonary complications, and 23 (64%) had cardiac manifestations."
    explanation: The organ involvement among the deaths, counted.
  - reference: PMID:8624177
    reference_title: The natural history of eosinophilia-myalgia syndrome in a tryptophan-exposed cohort in South Carolina.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "survivors with definite EMS continued to report excess morbidity for 6 major EMS symptoms (myalgia, arthralgia, weakness, rash, alopecia, and sclerodermiform skin changes)"
    explanation: >-
      The six persisting symptoms, measured against exposed users who did not
      fall ill rather than against the general population.
datasets:
- accession: geo:GSE26934
  title: Post-epidemic eosinophilia myalgia syndrome associated with L-Tryptophan
  description: >-
    Expression profiling by array of lesional skin from the 2011 post-epidemic
    case, against comparison samples. This is the source of the TGF-beta and
    IL-4 signalling signature reported in PMID:21702023, and it is the only
    EMS-specific dataset in GEO.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: MICROARRAY
  sample_count: 6
  conditions:
  - lesional skin from L-tryptophan-associated eosinophilia-myalgia syndrome
  publication: PMID:21702023
  evidence:
  - reference: GEO:GSE26934
    reference_title: Post-epidemic eosinophilia myalgia syndrome associated with L-Tryptophan
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "The EMS epidemic in 1989 was linked to L-tryptophan consumption originating from a single source."
    explanation: >-
      The GEO record's own summary establishes the series is about this disease
      and this exposure, which is the relevance check an accession resolving
      does not supply.
  notes: >-
    Six samples from a single post-epidemic case and its comparisons, so the
    series is a case-level profiling experiment rather than a cohort. The
    signature it carries is curated on `Fibroblast Activation and Type I
    Collagen Overproduction` as a `PMID:21702023` evidence item; an earlier
    draft of this note said so before that item existed, which made the note a
    false statement about the entry. The evidence item quotes the publication
    rather than this GEO record because the GEO summary states the disease and
    the exposure and not the result.


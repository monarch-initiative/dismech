name: Eosinophilia-Myalgia Syndrome
creation_date: "2026-09-25T12:00:00Z"
category: Environmental
categories:
- Toxic Exposure Disorder
- Dietary Supplement Contamination Disorder
- Acquired Sclerodermiform Syndrome
synonyms:
- eosinophilia-myalgia syndrome
- EMS
- L-tryptophan-associated eosinophilia-myalgia syndrome
- tryptophan-associated eosinophilia-myalgia syndrome
description: >-
  Eosinophilia-myalgia syndrome is an acquired multisystem inflammatory and
  fibrosing disease caused by eating manufactured L-tryptophan that carried
  trace process impurities. It appeared as a point-source epidemic in the
  United States in the second half of 1989, and 1531 cases with 27 deaths had
  been reported to national surveillance by July 1990. New cases fell away
  after the product was recalled that November.

  The presenting illness is incapacitating generalised myalgia with a blood
  eosinophil count above 1.0 x 10^9 cells per litre, and those two features are
  the surveillance case definition rather than two findings among many.
  Arthralgia, rash, cough or dyspnoea, peripheral oedema, a raised aldolase and
  abnormal liver tests fill out the acute picture. Eosinophil granule proteins
  are deposited in tissue and recoverable from serum and urine, which is the
  evidence that the eosinophil is doing something rather than merely being
  counted.

  The chronic disease is a fibrosis. Biopsies show inflammatory infiltration of
  the septa, fascia and perimysium, dermal thickening with homogenised collagen
  indistinguishable from scleroderma, and cultured lesional fibroblasts that
  overproduce type I collagen and keep doing so years later. Sclerodermatous
  skin thickening, sensorimotor polyneuropathy, proximal myopathy and episodic
  myalgia are the sequelae that disable. Mortality concentrates in the first
  eighteen months and runs through progressive polyneuropathy and myopathy
  rather than through the fibrosis.

  The etiologic agent has never been settled. Six compounds were associated
  with case lots, and 1,1'-ethylidenebis[tryptophan], first named peak E, is
  the one with the most experimental work behind it. It activates fibroblasts
  and produces fascial fibrosis in mice and rats. It also failed to reach
  significance in the one study that stratified lots by date of manufacture,
  and no animal reproduces the human syndrome.
disease_term:
  preferred_term: eosinophilia-myalgia syndrome
  term:
    id: MONDO:0004941
    label: eosinophilia-myalgia syndrome
notes: >-
  **The etiologic agent is not established and this entry does not assert one.**
  The pathograph names the L-tryptophan process contaminants collectively and
  carries EBT as the worked candidate, because EBT is the compound with in
  vitro, murine and rat data behind it. `PMID:8356958` is curated as REFUTE
  against EBT as the sole agent: once case and non-case lots are stratified by
  time of manufacture the EBT association loses significance, and the authors
  raise a distinct compound as a live possibility. Both readings are in the
  entry, and the `unidentified_etiologic_agent` discussion states what is
  missing.

  **Myalgia and peripheral eosinophilia deliberately carry no `frequency`.**
  Both are reported at 100% in every series, and that figure is circular: the
  CDC surveillance definition requires them, so a cohort assembled under it
  cannot report anything else. `PMID:8895176` records that the definition was
  never validated and was routinely used for purposes it was not built for.
  Every other phenotype's frequency comes from a named cohort and says which.

  **The severity of the myalgia is not explained by the muscle pathology, and
  no edge asserts that it is.** `PMID:1563745` found minimal myofiber atrophy,
  regeneration or necrosis in 11 cases despite severe myalgia in almost all of
  them, and `PMID:8100551` found only rare degranulating eosinophils in fascia
  and perimysium that were nonetheless full of CD8+ cells and macrophages. The
  `myalgia_without_myofiber_injury` discussion carries the gap. This is the same
  gap the `Toxic_Oil_Syndrome` entry records for its own myalgia, and the two
  diseases are routinely discussed together for that reason.

  **Relation to toxic oil syndrome.** The two are separate epidemics with
  separate vehicles, and they are linked by chemistry rather than by exposure:
  PAP from the Spanish oil and PAA from the implicated L-tryptophan converge on
  a shared metabolite. That link is curated here as its own pathophysiology
  node with its own evidence (`PMID:8555405`, `PMID:17892268`). No toxic oil
  syndrome clinical finding is imported as an EMS finding.

  **A related illness followed L-5-hydroxytryptophan**, and it is not curated
  as EMS. `PMID:7699627` reports one family where one member met criteria for
  EMS and two had eosinophilia, with an impurity present in their 5-HTP and
  absent from comparison samples, and the NIH study `NCT00001918` was built
  around such cases. The `five_htp_related_illness` discussion records it; the
  disease entry stays scoped to the L-tryptophan epidemic.

  **Most phenotypes here are deliberately unwired, and connectivity is
  correspondingly low.** Run `just list-disconnected-phenotypes
  kb/disorders/Eosinophilia-Myalgia_Syndrome.yaml` for the current set rather
  than trusting a count written here. The rule is the one the rest of this entry
  follows: an edge goes in only where a cited source makes the causal link. The
  constitutional features (fever, fatigue, oral ulcer) have no named lesion in
  any cited source; the raised aldolase and transaminases are readouts nothing
  here explains; `Proximal myopathy` and `Myalgia` sit on the muscle-pathology
  gap the `myalgia_without_myofiber_injury` discussion states; and the cognitive
  findings have two competing readings in the one paper that imaged them. An
  edge added to raise that figure would be worse than the gap.

  **There is no `histopathology:` or `diagnosis:` section, deliberately.** The
  histology of this disease is dense and well reported, and it is carried as
  pathophysiology nodes because in EMS the histology *is* the mechanism: the
  septal and fascial infiltrate, the homogenised dermal collagen, the
  conduction-system fibrosis. Splitting it into a parallel descriptive section
  would state each finding twice and put the causal reading in only one of them.
  The case definition, which is the part of the diagnostic picture that carries
  real weight here, is curated as a `definitions:` entry instead, and the
  `case_definition_validity` discussion argues its consequences.

  No GeneReviews chapter exists and none is expected. This is an acquired
  point-source intoxication with no Mendelian basis; `just check-genereviews`
  returns NO_CHAPTER for both Bookshelf collections.
mechanistic_hypotheses:
- hypothesis_group_id: contaminant_driven_type2_immunity
  hypothesis_label: A contaminant drives a type 2 immune response that recruits and activates eosinophils
  status: CANONICAL
  description: >-
    On this account the impurity acts as an immunogen or adjuvant. Susceptible
    hosts mount a type 2 cytokine response, eosinophils are expanded, recruited
    and degranulated in tissue, and the fibrosis follows the inflammation. The
    strongest support is the cytokine work on peak E and the eosinophil granule
    proteins recoverable from patients.
  evidence:
  - reference: PMID:1727618
    reference_title: The cause and pathogenesis of the eosinophilia-myalgia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Eosinophil activation and the release of major basic protein and other eosinophil-derived toxic proteins into the extracellular space is a striking feature in the eosinophilia-myalgia syndrome and implicates eosinophils or their products in the pathogenesis."
    explanation: >-
      States the eosinophil-centred reading of the pathogenesis that this
      hypothesis group asserts.
  - reference: PMID:11703359
    reference_title: L-tryptophan contaminant 'peak E' induces the release of IL-5 and IL-10 by peripheral blood mononuclear cells from patients with functional somatic syndromes.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "six of the seven FSS patients reacting with peak E produced IL-5 and/or IL-10"
    explanation: >-
      INDIRECT: the type 2 cytokine response to peak E is measured, and it is
      measured in mononuclear cells from patients with functional somatic
      syndromes rather than from anyone with EMS.
- hypothesis_group_id: direct_fibroblast_activation
  hypothesis_label: The contaminant acts directly on fibroblasts
  status: ALTERNATIVE
  description: >-
    On this account the fibrosis does not require the immune response to reach
    it. Peak E stimulates dermal fibroblast DNA synthesis, procollagen
    transcription and gel contraction on its own, and L-tryptophan itself and
    the other major contaminant do not. The two hypotheses are not exclusive and
    the pathograph carries both edges.
  evidence:
  - reference: PMID:7593596
    reference_title: "Enhanced collagen synthesis and transcription by peak E, a contaminant of L-tryptophan preparations associated with the eosinophilia myalgia syndrome epidemic."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "We now report that peak E, a dimer of L-tryptophan, is a potent stimulus for human dermal fibroblast DNA and collagen synthesis."
    explanation: The direct fibroblast effect this hypothesis is named for.
  - reference: PMID:7593596
    reference_title: "Enhanced collagen synthesis and transcription by peak E, a contaminant of L-tryptophan preparations associated with the eosinophilia myalgia syndrome epidemic."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "No increase in procollagen mRNA levels was found after the addition of another major L-tryptophan contaminant, peak 5, or with L-tryptophan itself."
    explanation: >-
      The specificity control, and the reason the effect is attributed to peak E
      rather than to L-tryptophan or to contamination in general.
- hypothesis_group_id: t_cell_matrix_autoimmunity
  hypothesis_label: A T cell response against extracellular matrix sustains the chronic disease
  status: ALTERNATIVE
  description: >-
    On this account the chronic phase is not residual damage but an ongoing
    cell-mediated process. Fascia and perimysium contain CD8+ cells and
    macrophages with almost no intact eosinophils, most fibroblasts are
    activated and a third aberrantly express HLA-DR, and a repeat biopsy a year
    later showed less inflammation and more activated fibroblasts.
  evidence:
  - reference: PMID:8100551
    reference_title: Immune-mediated mechanisms and immune activation of fibroblasts in the pathogenesis of eosinophilia-myalgia syndrome induced by L-tryptophan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We conclude that in EMS there is a T-cell-mediated process against components of the extracellular matrix, including fibroblasts, in the fascia and the perimysium that persists even years after the drug is discontinued."
    explanation: The authors' own statement of this hypothesis, from their own immunocytochemistry.
pathophysiology:
- name: Ingestion of Contaminated Manufactured L-Tryptophan
  biological_scale: ORGANISM
  description: >-
    Oral L-tryptophan sold over the counter as a sleep and mood supplement. Case
    exposure traced to a single manufacturer whose fermentation process had
    changed, and the epidemic ended when the product was recalled.
  chemical_entities:
  - preferred_term: L-tryptophan
    term:
      id: CHEBI:16828
      label: L-tryptophan
  downstream:
  - target: Systemic Exposure to L-Tryptophan Process Contaminants
    causal_link_type: DIRECT
    description: >-
      The manufacturing conditions, not the amino acid, are what the
      case-control study associated with illness.
    evidence:
    - reference: PMID:2370887
      reference_title: An investigation of the cause of the eosinophilia-myalgia syndrome associated with tryptophan use.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "The outbreak of the eosinophilia-myalgia syndrome in 1989 resulted from the ingestion of a chemical constituent that was associated with specific tryptophan-manufacturing conditions at one company."
      explanation: >-
        Supports this specific step - that what was ingested carried a
        constituent tied to how it was made - rather than either node alone.
  evidence:
  - reference: PMID:2370887
    reference_title: An investigation of the cause of the eosinophilia-myalgia syndrome associated with tryptophan use.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "29 of 30 case patients (97 percent) and 21 of 35 controls (60 percent) had consumed tryptophan manufactured by a single company (odds ratio, 19.3; 95 percent confidence interval, 2.5 to 844.9; P less than 0.001)"
    explanation: >-
      The single-manufacturer association with its own odds ratio and interval,
      which is why this node names manufactured product rather than tryptophan.
  - reference: PMID:2370887
    reference_title: An investigation of the cause of the eosinophilia-myalgia syndrome associated with tryptophan use.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "This company used a fermentation process involving Bacillus amyloliquefaciens to manufacture tryptophan."
    explanation: Names the production route behind the implicated lots.
  - reference: PMID:8895184
    reference_title: Tryptophan produced by Showa Denko and epidemic eosinophilia-myalgia syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "There was a dose-response effect, with risk of illness increasing as a function of the amount of tryptophan consumed."
    explanation: >-
      The dose-response element of the causal argument, which an association
      with a manufacturer alone would not supply.
- name: Systemic Exposure to L-Tryptophan Process Contaminants
  biological_scale: ORGANISM
  description: >-
    Case lots carried more than one trace impurity. EBT, first reported as an
    HPLC peak and then characterised as a tryptophan dimer, is the compound with
    the most experimental work behind it and is carried here as the worked
    candidate rather than as the established agent.
  chemical_entities:
  - preferred_term: 1,1'-ethylidenebis[tryptophan]
    term:
      id: CHEBI:172675
      label: 1,1'-Ethylidenebistryptophan
  biological_processes:
  - preferred_term: response to xenobiotic stimulus
    term:
      id: GO:0009410
      label: response to xenobiotic stimulus
  downstream:
  - target: Type 2 Cytokine Response to Peak E
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - contaminant_driven_type2_immunity
    description: >-
      How peak E reaches a cytokine-producing cell is not described by any cited
      source. What is measured is the cytokine output of mononuclear cells
      exposed to it, in subjects who did not have EMS.
    evidence:
    - reference: PMID:11703359
      reference_title: L-tryptophan contaminant 'peak E' induces the release of IL-5 and IL-10 by peripheral blood mononuclear cells from patients with functional somatic syndromes.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "PBMC from seven of the 12 FSS patients, but only three of the 24 controls, produced cytokines after incubation with peak E (P < 0.05)."
      explanation: >-
        Supports the edge from contaminant exposure to a cytokine response, and
        INDIRECT because the responding cells came from patients with functional
        somatic syndromes rather than from EMS patients.
  - target: Eosinophil Chemotaxis and Endothelial Adhesion
    causal_link_type: DIRECT
    hypothesis_groups:
    - contaminant_driven_type2_immunity
    evidence:
    - reference: PMID:8906111
      reference_title: "Effect of L-tryptophan products on function of human eosinophils: investigation of the causal mechanisms of eosinophilia myalgia syndrome associated with L-tryptophan products."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "Contaminants in the L-tryptophan products, known as peak-E and peak-5, at a concentration of 1-10 micrograms/ml had the ability to elicit chemokinetic migration of eosinophils."
      explanation: >-
        The contaminants act on eosinophil migration directly in culture, which
        is exactly this edge.
  - target: Fibroblast Activation and Type I Collagen Overproduction
    causal_link_type: DIRECT
    hypothesis_groups:
    - direct_fibroblast_activation
    description: >-
      The edge that makes the alternative hypothesis a separate route rather
      than a restatement: peak E raises procollagen transcription in dermal
      fibroblasts with no immune cell in the dish.
    evidence:
    - reference: PMID:7593596
      reference_title: "Enhanced collagen synthesis and transcription by peak E, a contaminant of L-tryptophan preparations associated with the eosinophilia myalgia syndrome epidemic."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "peak E (0.5 to 100 microM) caused a progressive, more than threefold increase in alpha 1(I) procollagen mRNA levels and collagenous protein"
      explanation: >-
        The measured transcriptional and protein response, in a monolayer
        culture, which is the direct link this edge asserts.
  - target: T Cell Mediated Immunity Against Extracellular Matrix
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - t_cell_matrix_autoimmunity
    description: >-
      The contaminant reaches the inflammatory cells as well as the eosinophils.
      The review that states this names no intermediate step, so the link type
      records none.
    evidence:
    - reference: PMID:1727618
      reference_title: The cause and pathogenesis of the eosinophilia-myalgia syndrome.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Peak E or other, as yet unidentified, contaminants may trigger activation of eosinophils and inflammatory cells and increase biosynthesis of connective tissue components"
      explanation: >-
        The one cited sentence that runs from the contaminant to the
        inflammatory cells rather than to the eosinophil alone, which is what
        this edge asserts. INDIRECT because "may trigger" is the review's own
        hedge.
  evidence:
  - reference: PMID:2270484
    reference_title: "Characterization of \"peak E,\" a novel amino acid associated with eosinophilia-myalgia syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: "Spectral and chemical studies now demonstrate that peak E is 1,1'-ethylidenebis[tryptophan]."
    explanation: >-
      Establishes the chemical identity of the compound this node binds. Graded
      OTHER because it is an analytical chemistry result on product samples
      rather than a study of people, animals or cells.
  - reference: PMID:2270484
    reference_title: "Characterization of \"peak E,\" a novel amino acid associated with eosinophilia-myalgia syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: "This novel amino acid may be the etiological agent responsible for EMS, or it may be a marker of a still unidentified causal agent."
    explanation: >-
      The authors' own hedge in the paper that named the compound, and the
      reason this node is titled for the contaminants collectively.
  - reference: PMID:8356958
    reference_title: "Tryptophan contaminants associated with eosinophilia-myalgia syndrome. The Eosinophilia-Myalgia Studies of Oregon, New York and New Mexico."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "higher EBT levels were still associated with a lot's case status, but the association lacked statistical significance (p = 0.120, odds ratio = 1.56, 95% confidence interval 0.758-3.23)"
    explanation: >-
      REFUTE against EBT alone as the agent. Stratifying lots by date of
      manufacture removes the significance of the EBT association, which is the
      single strongest reason this node does not name one compound.
  - reference: PMID:8356958
    reference_title: "Tryptophan contaminants associated with eosinophilia-myalgia syndrome. The Eosinophilia-Myalgia Studies of Oregon, New York and New Mexico."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "they raise the possibility that other chemical contaminants in manufactured tryptophan modify the effects of EBT or that the causal agent of EMS is an entirely distinct compound"
    explanation: >-
      The two live alternatives the same authors name, both of which this node
      leaves open.
- name: Hepatic Conversion of PAP to 3-(Phenylamino)alanine
  biological_scale: MOLECULAR
  description: >-
    PAA was isolated from L-tryptophan associated with EMS, and liver tissue
    converts the toxic oil syndrome marker PAP into it. Bioactivation of PAA by
    human liver microsomes then yields 4-aminophenol through a quinoneimine,
    which is the same metabolite PAP yields. This node is the chemical bridge
    between the two epidemics.
  biological_processes:
  - preferred_term: response to xenobiotic stimulus
    term:
      id: GO:0009410
      label: response to xenobiotic stimulus
  evidence:
  - reference: PMID:8555405
    reference_title: "Biotransformation of 3-(phenylamino)-1,2-propanediol to 3-(phenylamino)alanine: a chemical link between toxic oil syndrome and eosinophilia-myalgia syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "A related aniline derivative, 3-(phenylamino)-L-alanine (PAA), was recently isolated from L-tryptophan associated with the onset of EMS."
    explanation: >-
      Establishes that PAA was present in the implicated product, which is what
      puts this node in an EMS entry at all.
  - reference: PMID:8555405
    reference_title: "Biotransformation of 3-(phenylamino)-1,2-propanediol to 3-(phenylamino)alanine: a chemical link between toxic oil syndrome and eosinophilia-myalgia syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Here, we demonstrate the biotransformation of PAP into PAA by both rat hepatocytes and human liver tissue."
    explanation: The measured conversion, in rat hepatocytes and human liver tissue.
  - reference: PMID:17892268
    reference_title: "Generation of quinoneimine intermediates in the bioactivation of 3-(N-phenylamino)alanine (PAA) by human liver microsomes: a potential link between eosinophilia-myalgia syndrome and toxic oil syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "These findings establish that EMS and TOS are linked by a common toxic metabolite (4-aminophenol)"
    explanation: >-
      Extends the link from a shared compound to a shared reactive metabolite,
      which is the claim this node makes.
  notes: >-
    This node is deliberately isolated, with no edge in and no edge out. Nothing
    in the cited literature traces a route from 4-aminophenol, or from PAA, to
    any lesion in either disease, so there is no downstream edge. An earlier
    draft drew an incoming edge from the exposure node typed UNKNOWN, whose own
    description then disclaimed the causation the arrow asserts: in EMS the PAA
    was already present in the product rather than made from PAP, so the
    conversion is the toxic oil syndrome route to the same molecule and not a
    step in this disease. That edge is removed. The chemical bridge is stated
    here and in the `unidentified_etiologic_agent` discussion instead.
- name: Type 2 Cytokine Response to Peak E
  biological_scale: MOLECULAR
  description: >-
    Mononuclear cells exposed to peak E release IL-5 and IL-10. IL-5 is the
    eosinophil growth and survival cytokine, and reviews of the syndrome name it
    and TGF-beta as the important mediators.
  biological_processes:
  - preferred_term: interleukin-5 production
    modifier: INCREASED
    term:
      id: GO:0032634
      label: interleukin-5 production
  - preferred_term: granulocyte macrophage colony-stimulating factor production
    term:
      id: GO:0032604
      label: granulocyte macrophage colony-stimulating factor production
  downstream:
  - target: Eosinophil Expansion with Tissue Degranulation
    causal_link_type: DIRECT
    hypothesis_groups:
    - contaminant_driven_type2_immunity
  evidence:
  - reference: PMID:8423409
    reference_title: "L-tryptophan and the eosinophilia-myalgia syndrome: current understanding of the etiology and pathogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Pathologic observations and experimental studies indicate that eosinophils, mononuclear inflammatory cells, and fibroblasts are potential effector cells, and interleukin-5 and transforming growth factor-beta are important mediators in the pathogenesis of the syndrome."
    explanation: >-
      Names IL-5 as a mediator of the syndrome, which is the cytokine this node
      is about. The word "potential" is the authors' own and is why the node's
      outgoing edge carries the hypothesis group.
  - reference: PMID:7797795
    reference_title: "Eosinophil-active cytokine from mononuclear cells cultured with L-tryptophan products: an unexpected consequence of endotoxin contamination."
    supports: REFUTE
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "this response is caused by endotoxin contamination of the L-tryptophan products and not by a specific L-tryptophan contaminant"
    explanation: >-
      REFUTE, and the most useful negative result in the entry. An earlier
      GM-CSF response to implicated L-tryptophan turned out to be driven by
      endotoxin in the product, so a cytokine response measured in this assay
      system is not by itself evidence about the EMS contaminant.
  notes: >-
    Two processes are bound because two cytokines are at issue, and an earlier
    draft got this wrong in a way no validator could see. It bound `GO:0032604`
    granulocyte macrophage colony-stimulating factor production under a
    `preferred_term` of interleukin-5 production, and defended the mismatch on
    the ground that the node had to carry the GM-CSF finding for the REFUTE item
    to attach to. That reasoning was wrong twice: an evidence item attaches to
    the node rather than to a process descriptor, and `biological_processes` is
    multivalued. `GO:0032634` is now the process the node is named for, and
    `GO:0032604` sits beside it, unmodified, as the process the refuting paper
    measured. Note the `modifier` is on the IL-5 descriptor only: no cited source
    reports GM-CSF production as raised in this disease, and the one that
    measured it attributed the response to endotoxin.
- name: Eosinophil Chemotaxis and Endothelial Adhesion
  biological_scale: CELLULAR
  description: >-
    The contaminants make eosinophils migrate and make them stick to
    endothelium. Adhesion to stimulated human umbilical vein endothelial cells
    is blocked by antibody to ICAM-1 and not by antibody to VCAM-1, and the
    eosinophils' own integrin expression does not change, so the effect is on
    the endothelial side.
  cell_types:
  - preferred_term: eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: eosinophil migration
    modifier: INCREASED
    term:
      id: GO:0072677
      label: eosinophil migration
  downstream:
  - target: Eosinophil Expansion with Tissue Degranulation
    causal_link_type: DIRECT
    hypothesis_groups:
    - contaminant_driven_type2_immunity
  evidence:
  - reference: PMID:8906111
    reference_title: "Effect of L-tryptophan products on function of human eosinophils: investigation of the causal mechanisms of eosinophilia myalgia syndrome associated with L-tryptophan products."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Purified eosinophils adhered to peak-E- or peak-5-stimulated human umbilical vein endothelial cells, and this adherence was inhibited by the presence of antibody to intercellular adhesion molecule-1"
    explanation: The adhesion step and the adhesion molecule it runs through.
  - reference: PMID:8906111
    reference_title: "Effect of L-tryptophan products on function of human eosinophils: investigation of the causal mechanisms of eosinophilia myalgia syndrome associated with L-tryptophan products."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Human peripheral blood mononuclear cells (PBMCs) produced eosinophil survival-enhancing activity when cultivated with peak-E, but not with medium alone, peak-5 or control tryptophan."
    explanation: >-
      Survival enhancement specific to peak E among the conditions tested, which
      is how a migration effect becomes an accumulation.
- name: Eosinophil Expansion with Tissue Degranulation
  biological_scale: CELLULAR
  description: >-
    Blood eosinophilia with extracellular deposition of eosinophil granule
    proteins in tissue, and raised major basic protein and eosinophil-derived
    neurotoxin in serum and urine. The count is the case definition; the granule
    proteins are the evidence of activity.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The chronic sequelae most often associated with long-term disability are sclerodermatous skin thickening (54%), sensorimotor polyneuropathy (61%), proximal myopathy (36%), and severe episodic myalgias (64%)."
    explanation: >-
      Cited here for the chronic form: episodic myalgia in 64% of a followed
      cohort, which is a different claim from the definitional acute myalgia.
- category: Hematologic
  name: Peripheral eosinophilia
  description: >-
    An absolute blood eosinophil count at or above 1.0 x 10^9 cells per litre in
    the surveillance definition, and at or above 2.0 x 10^9 in some series. It
    can resolve while the chronic disease continues, so a normal count does not
    establish remission.
  phenotype_term:
    preferred_term: Increased total eosinophil count
    term:
      id: HP:0001880
      label: Increased total eosinophil count
  evidence:
  - reference: PMID:2314421
    reference_title: Association of the eosinophilia-myalgia syndrome with the ingestion of tryptophan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "All three patients, who were women 37 to 44 years of age, had severe muscle pain, muscle weakness, mouth ulcers, and striking eosinophilia"
    explanation: >-
      The eosinophilia in the index series. As with myalgia, no `frequency` is
      recorded because the case definition requires it.
  - reference: PMID:21702023
    reference_title: Post-epidemic eosinophilia-myalgia syndrome associated with L-tryptophan.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Although treatment with prednisone and mycophenolate resulted in modest improvement in proximal muscle strength and myalgia along with prompt resolution of peripheral blood eosinophilia and ground glass opacifications seen on CT scans, skin induration and neuropathy progressed."
    explanation: >-
      The count and the disease coming apart, in one patient and one sentence:
      the eosinophilia resolved promptly while the skin and nerve disease got
      worse. It is the source for this record's claim that a normal count does
      not establish remission.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "All cases involved eosinophilia (eosinophil count, greater than or equal to 2.0 x 10(9)/L) and incapacitating myalgias."
    explanation: >-
      The severity in a defined case series. No `frequency` is recorded here
      because the definition requires the feature - see the entry `notes:`.
  - reference: PMID:1673503

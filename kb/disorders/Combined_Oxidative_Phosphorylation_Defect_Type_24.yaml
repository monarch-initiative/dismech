- category: Neurologic
  name: Alpers- or Leigh-type progressive encephalopathy
  description: >-
    The severe pole of the disease, and the presentation the founding Leigh
    syndrome family defines. Early-onset NARS2 encephalopathy takes an Alpers or
    Leigh shape, with bilateral symmetric brainstem and thalamic lesions in the
    Leigh cases, a more severe course and poorer survival than the other NARS2
    presentations.

    The binding is deliberately the generic HP:0002448 Progressive
    encephalopathy rather than a Leigh-specific term. HPO has no Leigh syndrome
    phenotype term, and the two narrower candidates are both wrong here:
    HP:0006976 Necrotizing encephalopathy would assert the Leigh lesion pattern
    in patients the source describes only as sharing features of Alpers *or*
    Leigh syndrome, and Alpers is not a necrotizing encephalopathy. HP:0002415,
    which the deep-research report offers for Leigh syndrome, is Leukodystrophy.
  phenotype_term:
    preferred_term: Alpers- or Leigh-type progressive encephalopathy
    term:
      id: HP:0002448
      label: Progressive encephalopathy
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:33596490
    reference_title: The phenotypic variability and natural history of NARS2 associated disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Early-onset mitochondrial encephalopathy due to NARS2 variants shared
      phenotypic features of Alpers or Leigh syndrome and was characterized by
      more severe disease course and poorer survival compared to the other NARS2
      associated phenotypes.
    explanation: >-
      The systematic review's characterization of the severe subgroup. It is the
      sentence this row's name comes from, and it is careful to say the patients
      shared features of Alpers or Leigh syndrome rather than that they had
      either diagnosis, which is why the binding stays generic.
  - reference: PMID:25807530
    reference_title: Mutations of human NARS2, encoding the mitochondrial asparaginyl-tRNA synthetase, cause nonsyndromic deafness and Leigh syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two brothers diagnosed with Leigh syndrome defined by symmetrical lesions
      in the brain stem and thalamus, had similar clinical courses including
      congenital auditory neuropathy followed by myoclonus, intractable seizures
      and early demise.
    explanation: >-
      The founding Leigh syndrome sibship, with the radiological definition and
      the course. This is the only place in the entry where the Leigh lesion
      distribution is stated, and it is what makes the severe pole a specific
      claim rather than a label.
- category: Metabolic
  name: Lactic acidosis
  description: >-
    Elevated lactate, the expected consequence of a respiratory chain block and a
    supporting rather than diagnostic finding. It is curated because it is what
    prompts mitochondrial testing, not because it distinguishes this disease from
    any other combined oxidative phosphorylation deficiency.
  phenotype_term:
    preferred_term: Lactic acidosis
    term:
      id: HP:0003128
      label: Lactic acidosis
  evidence:
  - reference: PMID:25807530
    reference_title: Mutations of human NARS2, encoding the mitochondrial asparaginyl-tRNA synthetase, cause nonsyndromic deafness and Leigh syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Mitochondrial respiratory chain (MRC) disease represents a large and
      heterogeneous group of energy deficiency disorders
    explanation: >-
      This is background framing, not a lactate measurement, and it is the
      honest support available: no source located reports a lactate value in a
      genotyped NARS2 patient. The phenotype is curated because the disease class
      predicts it, and this evidence item says exactly that and no more.
genetic:
- name: NARS2
  gene_term:
    preferred_term: NARS2
    term:
      id: hgnc:26274
      label: NARS2
  relationship_type: CAUSATIVE
  notes: >-
    NARS2 encodes the mitochondrial asparaginyl-tRNA synthetase. It is one of a
    group of mitochondrial aminoacyl-tRNA synthetase genes that between them
    cause a strikingly tissue-specific set of diseases; DARS2 causes LBSL, LARS2
    and HARS2 cause Perrault syndrome, RARS2 causes pontocerebellar hypoplasia
    type 6.

    The allele spectrum spans splice, nonsense and missense changes, and the
    reported molecular consequences differ between them in ways that have been
    measured rather than predicted: absent protein, reduced protein with
    disrupted dimerisation, and reduced protein with intact oligomerisation.
  variants:
  - name: c.822G>C
    description: >-
      Homozygous in the two founding siblings. Despite its nomenclature it acts as
      a splice variant, disrupting the 3' splice site of exon 7 and removing exon
      7 and part of exon 8 from the transcript.
  - name: c.637G>T, p.Val213Phe
    description: >-
      Homozygous in nonsyndromic hearing loss DFNB94. It does not affect NARS2
      oligomerisation, and overexpressing it fails to rescue oxygen consumption
      and electron transport chain activity in Leigh syndrome fibroblasts.
  - name: c.969T>A, p.Tyr323*
    description: >-
      One of the two compound heterozygous Leigh syndrome alleles. The predicted
      truncated protein is not detectable.
  - name: c.1142A>G, p.Asn381Ser
    description: >-
      The second Leigh syndrome allele. It further decreases NARS2 protein levels
      and disrupts dimerisation.
  - name: p.Pro214Leu
    description: >-
      Homozygous in three Scandinavian patients with early-onset mitochondrial
      encephalopathy and a variable disease course.
  - name: p.(Phe216Leu)
    description: >-
      Homozygous in four of the eight children found by screening 397 cases of
      early-onset diabetes of unknown genetic cause. The most frequent allele in
      the neonatal diabetes group; no functional characterisation is published.
  - name: p.(Thr180Asn)
    description: >-
      Homozygous in three of the same eight neonatal diabetes children. No
      functional characterisation is published.
  - name: p.(Val440Leu)
    description: >-
      Homozygous in one of the same eight neonatal diabetes children. No
      functional characterisation is published.
  evidence:
  - reference: PMID:25807530
    reference_title: Mutations of human NARS2, encoding the mitochondrial asparaginyl-tRNA synthetase, cause nonsyndromic deafness and Leigh syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings establish lesions in NARS2 as a new cause for nonsyndromic
      hearing loss and Leigh syndrome.
    explanation: The gene-disease assertion, covering both ends of the range at once.
  - reference: PMID:25385316
    reference_title: Two siblings with homozygous pathogenic splice-site variant in mitochondrial asparaginyl-tRNA synthetase (NARS2).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To conclude, the reported variant in NARS2 results in a combined OXPHOS
      complex deficiency involving complex I and IV, making NARS2 a new member of
      disease-associated aaRS2.
    explanation: >-
      The founding gene-disease conclusion, which places NARS2 in the
      mitochondrial aminoacyl-tRNA synthetase disease group.
diagnosis:
- name: Exome or genome sequencing for biallelic NARS2 variants
  description: >-
    The diagnosis is molecular. Supporting findings are elevated lactate, a
    Leigh-type or Alpers-type MRI, and combined complex I and IV deficiency on
    muscle biopsy, but none is specific to NARS2 among the combined oxidative
    phosphorylation deficiencies.
  evidence:
  - reference: PMID:25385316
    reference_title: Two siblings with homozygous pathogenic splice-site variant in mitochondrial asparaginyl-tRNA synthetase (NARS2).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Considering the consanguineous descent, homozygosity mapping and
      whole-exome sequencing were combined revealing the presence of one single
      missense mutation in the shared homozygous region.
    explanation: The method that found the gene and the route to diagnosis since.
- name: Consider NARS2 in unexplained diabetes diagnosed under two years
  description: >-
    A specific, actionable diagnostic recommendation rather than a general one:
    the screening study that found eight cases in 397 children argues NARS2
    should be on the panel for early-onset diabetes of unknown genetic cause. The
    neurological features that accompany it are what distinguish this from
    isolated neonatal diabetes.
  evidence:
  - reference: PMID:40887432
    reference_title: Neonatal diabetes mellitus is a significant feature of COXPD-24 caused by recessive NARS2 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results confirm NARS2 variants as a cause of syndromic neonatal
      diabetes, which should be considered when performing genetic testing for
      this condition.
    explanation: >-
      The authors' testing recommendation, with "syndromic" doing the work of
      saying which patients it applies to.
treatments:
- name: Multidisciplinary supportive management
  description: >-
    No disease-modifying therapy exists. Management is symptom-directed:
    antiepileptic treatment, hearing rehabilitation, developmental therapy,
    nutritional support, and insulin in the diabetic subgroup.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: multidisciplinary supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Energy Failure in High-Demand Post-Mitotic Tissue
    description: >-
      Addresses the organ consequences. Nothing available restores mitochondrial
      translation.
  evidence:
  - reference: PMID:33596490
    reference_title: The phenotypic variability and natural history of NARS2 associated disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      NARS2 variants present with a spectrum of clinical severity from a severe,
      infantile-onset, progressive disease to a mild, non-progressive disease,
      without strong association between the genotype and the disease outcome.
    explanation: >-
      The natural history that supportive management has to plan against, and the
      reason it cannot be planned from the genotype.
- name: Insulin therapy
  description: >-
    Insulin for the neonatal diabetes subgroup. All eight children in the
    screening cohort had insulin-dependent diabetes, so this is a
    disease-associated requirement rather than an option.
  therapeutic_modality: PEPTIDE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Diabetes mellitus
    description: >-
      Replaces the insulin the failing beta cell does not secrete. It does not
      address the beta cell defect.
  evidence:
  - reference: PMID:40887432
    reference_title: Neonatal diabetes mellitus is a significant feature of COXPD-24 caused by recessive NARS2 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 8 individuals were diagnosed with insulin-dependent diabetes before 6
      months of age (neonatal diabetes, NDM) with the median age at diagnosis
      being 4 weeks (range: 1 to 20 weeks).
    explanation: >-
      Insulin dependence in every affected child of the cohort. No trial evidence
      exists for any treatment in this disease, so this is the strongest claim
      available and it is a description of practice, not of efficacy.
experimental_models:
- name: LS06 patient fibroblasts with lentiviral wild-type and p.Val213Phe NARS2 complementation
  experimental_model_type: PRIMARY_CELL_CULTURE
  publication: PMID:25807530
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: dermal fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  cell_source: >-
    Dermal fibroblasts from proband II.1 of family LS06, compound heterozygous for
    c.969T>A p.Tyr323* and c.1142A>G p.Asn381Ser, stably transduced by lentivirus
    with cDNA encoding either wild-type NARS2 or the DFNB94 allele p.Val213Phe.
  culture_system: >-
    Adherent monolayer. Respiration measured on a Seahorse XF24 analyser with the
    Mitostress substrate and inhibitor sequence, alongside spectrophotometric
    respiratory-chain enzymology and Northern blot for steady-state mt-tRNA-Asn.
  description: >-
    The only model system in this disease that does more than describe it. It has
    two arms, and the second is what makes it worth recording: re-expressing
    wild-type NARS2 in the patient's own fibroblasts raises oxygen consumption
    and complex I, III and IV activity, while re-expressing the hearing-loss
    allele p.Val213Phe in the same cells does not. That pairing is what converts
    a correlation between genotype and biochemistry into a causal claim, and it
    simultaneously grades the DFNB94 allele as pathogenic in a system where no
    DFNB94 patient tissue is available.
  modeled_mechanisms:
  - target: Combined Complex I and Complex IV Deficiency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The untransduced patient line reproduces the disease's biochemical
      signature: reduced oxygen consumption and reduced activity of the
      mtDNA-dependent complexes, with complex II, which is entirely nuclear
      encoded, unaffected.
    limitations: >-
      The complex profile is not the one the muscle shows. Patient muscle
      enzymology gives a combined complex I and IV deficiency, which is what this
      disease is named for; the fibroblasts have complexes I, III and IV reduced.
      Fibroblasts are also not a tissue this disease damages, so the model
      reports the ubiquitous biochemical lesion and says nothing about why the
      damage falls on cochlea, brain and beta cell.
    readouts:
    - name: Oxygen consumption rate in intact cells
      target: Combined Complex I and Complex IV Deficiency
      direction: DECREASED
      interpretation: >-
        Functional respiratory deficit in the patient line before any
        complementation.
      evidence:
      - reference: PMID:25807530
        reference_title: Mutations of human NARS2, encoding the mitochondrial asparaginyl-tRNA synthetase, cause nonsyndromic deafness and Leigh syndrome.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          In these cells we show that a decrease in oxygen consumption rates
          (OCR) and electron transport chain (ETC) activity can be rescued by
          overexpression of wild type NARS2.
        explanation: >-
          States both the deficit and its reversibility in one sentence, which is
          why it is cited on this readout and on the rescue link below.
    - name: Respiratory-chain complex enzyme activity
      target: Combined Complex I and Complex IV Deficiency
      direction: DECREASED
      interpretation: >-
        Complexes I, III and IV are reduced and complex II, which has no
        mtDNA-encoded subunit, is not. The internal control is the point: it
        places the lesion in mitochondrial translation rather than in the
        respiratory chain proteins themselves.
      evidence:
      - reference: PMID:25807530
        reference_title: Mutations of human NARS2, encoding the mitochondrial asparaginyl-tRNA synthetase, cause nonsyndromic deafness and Leigh syndrome.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          No significant difference was observed in the activity of complex II,
          which does not have mtDNA encoded subunits.
        explanation: >-
          The negative control that makes the other three complexes' deficit
          mean what the pathograph says it means.
  - target: NARS2 Loss of Function
    relationship: RESCUES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Lentiviral wild-type NARS2 restores respiration and complex I, III and IV
      activity in the patient line, and the DFNB94 allele p.Val213Phe does not.
      The paired arms establish that the biochemical deficit follows from the
      NARS2 lesion, and grade p.Val213Phe as functionally deficient.
    limitations: >-
      Rescue is incomplete and the authors say so, offering several candidate
      reasons including a heteroplasmic mt-tRNA-Cys variant they found in the
      same patient. Overexpression from a lentiviral construct is also not
      restoration of endogenous dosage, so the arm shows that supplying
      functional NARS2 helps, not that the deficit is quantitatively explained
      by the amount of NARS2 lost.
    readouts:
    - name: Oxygen consumption rate after wild-type NARS2 transduction
      target: NARS2 Loss of Function
      direction: RESTORED
      interpretation: >-
        Partial functional rescue, with the mutant-allele arm as the
        discriminating comparator.
      evidence:
      - reference: PMID:25807530
        reference_title: Mutations of human NARS2, encoding the mitochondrial asparaginyl-tRNA synthetase, cause nonsyndromic deafness and Leigh syndrome.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          The oxygen consumption rate (OCR) was significantly higher in the cell
          line expressing wild type NARS2 although rescue was not complete
        explanation: >-
          The rescue result with its own caveat attached, quoted rather than
          summarised so the incompleteness is not lost.
    - name: Oxygen consumption rate after p.Val213Phe transduction
      target: NARS2 Loss of Function
      direction: UNCHANGED
      interpretation: >-
        The hearing-loss allele fails to complement, which is the negative arm
        that makes the wild-type result interpretable and is the functional
        evidence for that allele's pathogenicity.
      evidence:
      - reference: PMID:25807530
        reference_title: Mutations of human NARS2, encoding the mitochondrial asparaginyl-tRNA synthetase, cause nonsyndromic deafness and Leigh syndrome.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          However, overexpression of the hearing loss associated p.Val213Phe
          mutant protein in these fibroblasts cannot complement the OCR and ETC
          defects.
        explanation: >-
          A negative result reported as such, and the only functional test of
          the DFNB94 allele in any system.
  - target: Reduced Charged Mitochondrial tRNA-Asn
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      Northern blot for steady-state mt-tRNA-Asn in the patient fibroblasts,
      against the parents and a control.
    limitations: >-
      What this model measures is the size of the mt-tRNA-Asn pool, not the
      fraction of it that is charged. The same paper measured the charged to
      uncharged ratio in the same cells and found it normal, so the node's claim
      that less charged tRNA-Asn reaches the ribosome rests on the reduced pool
      here plus the directly reduced charged fraction that the founding family's
      lymphoblasts show, and not on this measurement alone. High passage number
      also prevented the measurement in the second proband, so n is one patient.
    readouts:
    - name: Steady-state mt-tRNA-Asn level
      target: Reduced Charged Mitochondrial tRNA-Asn
      direction: DECREASED
      interpretation: >-
        The tRNA pool available to mitochondrial translation is smaller in the
        patient than in the carrier parents or a control.
      evidence:
      - reference: PMID:25807530
        reference_title: Mutations of human NARS2, encoding the mitochondrial asparaginyl-tRNA synthetase, cause nonsyndromic deafness and Leigh syndrome.
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: >-
          Additionally we demonstrate decreased steady-state levels of
          mt-tRNAAsn in fibroblasts from the Leigh syndrome patients.
        explanation: The measurement itself, in the severe-phenotype patients.
  evidence:
  - reference: PMID:25807530
    reference_title: Mutations of human NARS2, encoding the mitochondrial asparaginyl-tRNA synthetase, cause nonsyndromic deafness and Leigh syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      To test whether the NARS2 mutations in family LS06 are directly correlated
      with MRC (Mitochondrial Respiratory Chain) dysfunction, we reasoned that
      the reintroduction of wild type NARS2 would correct a hypothetical defect
      in mtDNA encoded mitochondrial protein translation.
    explanation: >-
      The authors' stated design, which is what makes this a complementation
      experiment rather than a description of patient cells.
  notes: >-
    Curated as an experimental_models entry because patient fibroblasts are a
    non-animal system. No animal model of NARS2 disease is published, so this is
    the only model the entry has. The EBV-transformed lymphoblast line from the
    founding family (PMID:25385316), in which the reduced charged mt-tRNA-Asn was
    first shown, is not recorded as a separate model: that paper reports it as a
    single measurement in patient material rather than as a manipulable system,
    and its result is already curated as evidence on the tRNA node.
discussions:
- discussion_id: gap_coxpd24_genotype_phenotype
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does NARS2 genotype predict where on the severity range a patient will sit?
  attaches_to:
  - "pathophysiology#NARS2 Loss of Function"
  - "genetic#NARS2"
  rationale: >-
    The two best sources disagree and both are curated on this entry. The report
    that described the two poles argued that the severity of the genetic lesions
    and their effect on protein structure cosegregate with the phenotype, and
    backed it with a functional experiment: the hearing-loss allele p.Val213Phe
    leaves oligomerisation intact and fails to rescue oxygen consumption in Leigh
    fibroblasts, where the Leigh alleles abolish or destabilise the protein. The
    systematic review across seventeen patients concluded there is no strong
    association between genotype and disease outcome.

    The two are not straightforwardly reconcilable, and the founding family is
    the reason: two siblings homozygous for the same allele, one with mild
    intellectual disability and epilepsy and the other with severe myopathy.
    Whatever sets severity, it is not only the genotype. The practical stake is
    prognostic counselling at diagnosis, which is when a family most wants a
    prediction and when the genotype is the only information available.
  proposed_experiments:
  - experiment_id: exp_coxpd24_residual_charging_versus_severity
    name: Residual mt-tRNA-Asn charging against clinical severity across alleles
    description: >-
      Measure residual mt-tRNA-Asn aminoacylation in patient-derived cells across
      the reported allele series and test it, rather than the allele class,
      against clinical severity. A quantitative biochemical intermediate might
      predict outcome where the genotype does not, and would also explain the
      discordant siblings if their residual charging differs.
- discussion_id: gap_coxpd24_tissue_specificity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does loss of a ubiquitously expressed mitochondrial synthetase produce
    disease concentrated in cochlea, brain and pancreatic beta cell?
  attaches_to:
  - "pathophysiology#Energy Failure in High-Demand Post-Mitotic Tissue"
  rationale: >-
    This is stated as an open problem in the NARS2 literature itself, and for the
    whole mitochondrial aminoacyl-tRNA synthetase class rather than this gene
    alone: a deficiency in a ubiquitously expressed enzyme should affect all
    tissue types, and it does not. Each synthetase in the group has its own
    tissue signature, which argues against a simple energy-demand threshold
    explanation, since the tissues with the highest oxidative demand are the same
    for all of them. Candidate explanations include tissue differences in tRNA
    pool size, in synthetase expression level relative to demand, or in
    moonlighting functions outside translation. The stake for this entry is that
    its penultimate node is a placeholder for the missing explanation, which is
    why every edge out of it is unqualified as to intermediates.
  proposed_experiments:
  - experiment_id: exp_coxpd24_cross_synthetase_tissue_comparison
    name: Comparative tissue transcript and tRNA-pool profiling across mt-aaRS diseases
    description: >-
      Profile mitochondrial tRNA pools and synthetase abundance across cochlea,
      brain, pancreatic islet and skeletal muscle, and test whether the
      tissue-specific vulnerability of each mt-aaRS disease tracks the ratio of
      its enzyme to its cognate tRNA pool in that tissue.
notes: >-
  Scope. MONDO:0014547 was bound nowhere in kb/ and no entry binds NARS2.
  Numbered siblings in this series already exist (Combined_Oxidative_Phosphorylation_Defect_Type_4,
  _7, _13, _21, _23, _26, _30, _37), so a per-type entry is the settled shape.

  Lump or split. The NARS2 phenotypic range spans isolated nonsyndromic hearing
  loss to lethal infantile encephalopathy, which is wide enough that has_subtypes
  was a real option. It is not used here, for a reason the sources supply rather
  than a stylistic one: the founding family has two siblings with the same
  homozygous allele and two different phenotypes, and the systematic review found
  no strong genotype-outcome association. Subtypes would need a partition, and
  nothing published supports one. If a later study finds a biochemical predictor,
  that is when this entry should be split.

  Where a percentage comes from, and what it means. Two cohorts contribute
  numbers and they are ascertained very differently. The systematic review is
  seventeen patients assembled from the literature and is the source for the
  qualitative claims. The neonatal diabetes study screened 397 children already
  selected for diabetes under 24 months with no known genetic cause, so its 8/8
  insulin dependence, 7/8 epilepsy and 6/8 low birthweight describe that
  subgroup and not the disease. Every record here says which. The screening
  record carries no rate_per_100000 at all: 2.0% of a cohort selected for
  diabetes under 24 months is a diagnostic yield, its denominator is an
  ascertainment denominator, and no RateDenominatorEnum value describes one. A
  structured slot that distinguishes a yield from an occurrence rate does not
  exist, and until it does the figure belongs in notes and in the snippet, where
  it is, rather than in a slot machines read as population occurrence.

  What no frequency band was assigned to. Only sensorineural hearing impairment
  carries VERY_FREQUENT, on the review's word "cardinal", and seizure and
  developmental delay carry FREQUENT on the diabetes cohort's counts with that
  cohort's caveat attached. Diabetes itself carries no band, because the only
  cohort that quantifies it selected for it. Nor does the Alpers- or Leigh-type
  encephalopathy row: the review describes it as the early-onset subgroup's
  shape without saying what fraction of NARS2 patients fall in that subgroup.

  The lactate phenotype and its weak evidence. Lactic acidosis is curated with an
  evidence item that is explicitly background framing about mitochondrial disease
  as a class, because no source located reports a lactate value in a genotyped
  NARS2 patient. The item says so in its explanation rather than being dressed up.
  A reviewer who thinks that is too thin to curate has a fair point; the argument
  for keeping it is that elevated lactate is what routes a patient to
  mitochondrial testing, so a reader looking for it should find it with its
  provenance visible.

  Deep research. One OpenScientist run, committed; reference validation reports
  13 of 13 references resolved. Its term validation sets needs_review with one
  unresolved term, HP:0007303, which is not bound here. Its four reported label
  mismatches are a parsing artifact rather than real mis-bindings: the report
  presents phenotypes in a table whose notes column the validator read as the
  term's name, so HP:0000407 appears named "Cardinal feature; isolated (DFNB94)
  or with CNS disease". The identifiers themselves are correct, and this is worth
  knowing because the same artifact could hide a real mismatch in a table-heavy
  report.

  `just preflight-dr` returned SKIP, which means unchecked, because MONDO records
  no causal gene for MONDO:0014547. Manual fallback: NARS2 dominates the report's
  gene mentions and its OMIM identifier is COXPD24's. Right entity.

  Review round 1. The screening-yield rate is deleted, as above. The severe pole
  of the disease was described in four places and modelled in none, and is now a
  phenotype row bound to the generic HP:0002448 Progressive encephalopathy; the
  narrower candidates are argued down in that row's own description, because HPO
  has no Leigh syndrome phenotype term and the source says the patients shared
  features of Alpers *or* Leigh syndrome rather than having either diagnosis. The
  diabetes row is rebound from HP:0000819 to HP:0000857, which matches its own
  preferred_term. Intellectual disability, the entry's one disconnected
  phenotype, is wired. The three neonatal-diabetes alleles the prevalence
  evidence already quoted are added to variants. An experimental_models block
  records the fibroblast complementation experiment, which is the only place this
  disease has a manipulable system rather than a description.

  What is deliberately absent. No animal_models: block. The report describes no
  NARS2 animal model, and none was located; for a disease whose central puzzle is
  tissue specificity, that absence is itself informative and is why the second
  knowledge gap proposes tissue profiling rather than a mouse. No datasets:
  block. No clinical_trials: block; the report mentions that class-level
  amino-acid supplementation trials in related mt-aaRS disorders have not met
  efficacy endpoints, but no NARS2 trial exists and the substrate-supplementation
  idea is explicitly unproven, so neither is curated as a treatment. No
  GeneReviews chapter exists for this disorder; `just check-genereviews` reports
  NO_CHAPTER.

- population: Children diagnosed with diabetes under 24 months of unknown genetic cause, 397 screened
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Eight of 397 children with early-onset diabetes of unknown genetic cause
    carried homozygous NARS2 variants, which is 2.0% of that cohort. That
    proportion is deliberately not normalised into rate_per_100000: it is the
    yield of a targeted sequencing screen in a group already selected for
    diabetes before 24 months and for having no known genetic cause, so its
    denominator is an ascertainment denominator and not a population. None of the
    RateDenominatorEnum values describes it. It says how often NARS2 explains an
    unsolved neonatal diabetes case, and nothing about how common COXPD24 is.
  evidence:
  - reference: PMID:40887432
    reference_title: Neonatal diabetes mellitus is a significant feature of COXPD-24 caused by recessive NARS2 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We used genome and targeted next-generation sequencing to screen for rare,
      coding biallelic NARS2 variants in a cohort of 397 individuals diagnosed
      with diabetes <24 months of age of unknown genetic cause.
    explanation: >-
      The denominator and its selection criteria, which is what makes the eight
      cases a diagnostic yield rather than a prevalence.
  - reference: PMID:40887432
    reference_title: Neonatal diabetes mellitus is a significant feature of COXPD-24 caused by recessive NARS2 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 8 individuals with homozygous disease-causing missense
      variants in NARS2 (4 individuals with the p.(Phe216Leu) variant, 3 with
      p.(Thr180Asn) and one with p.(Val440Leu)).
    explanation: The numerator, with the three alleles that account for it.
progression:
- phase: Neonatal and infantile presentation
  notes: >-
    The severe end presents in the neonatal period or infancy. In the neonatal
    diabetes cohort every affected child was diagnosed before six months, at a
    median of four weeks, and most were small for gestational age, so the
    disorder is already expressed at birth in that group.
  evidence:
  - reference: PMID:40887432
    reference_title: Neonatal diabetes mellitus is a significant feature of COXPD-24 caused by recessive NARS2 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All 8 individuals were diagnosed with insulin-dependent diabetes before 6
      months of age (neonatal diabetes, NDM) with the median age at diagnosis
      being 4 weeks (range: 1 to 20 weeks).
    explanation: >-
      The onset distribution in the diabetes-ascertained group, with its range
      rather than only its median.
- phase: Progressive encephalopathy, or a non-progressive course
  notes: >-
    The two possible trajectories are not variants of one course but different
    diseases in practice. Early-onset mitochondrial encephalopathy takes an
    Alpers or Leigh shape with a more severe course and poorer survival; the
    milder phenotypes are non-progressive and compatible with long survival.
    Which a given patient follows is what the genotype-phenotype question below
    is about.
  evidence:
  - reference: PMID:33596490
    reference_title: The phenotypic variability and natural history of NARS2 associated disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Early-onset mitochondrial encephalopathy due to NARS2 variants shared
      phenotypic features of Alpers or Leigh syndrome and was characterized by
      more severe disease course and poorer survival compared to the other NARS2
      associated phenotypes.
    explanation: >-
      The natural history of the severe subgroup, stated against the other
      phenotypes rather than in isolation.
  - reference: PMID:33596490
    reference_title: The phenotypic variability and natural history of NARS2 associated disease.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      NARS2 variants present with a spectrum of clinical severity from a severe,
      infantile-onset, progressive disease to a mild, non-progressive disease,
      without strong association between the genotype and the disease outcome.
    explanation: >-
      The review's conclusion, including the negative genotype-outcome finding
      that this entry curates against the founding paper's cosegregation claim.
pathophysiology:
- name: NARS2 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic NARS2 variants reduce or abolish mitochondrial asparaginyl-tRNA
    synthetase. The reported mechanisms differ by allele and are not all the
    same: the founding c.822G>C change disrupts the 3' splice site of exon 7 and
    removes exon 7 and part of exon 8 from the transcript; p.Tyr323* yields no
    detectable protein; p.Asn381Ser lowers protein level and disrupts
    dimerisation; and p.Val213Phe, the hearing-loss allele, leaves oligomerisation
    intact.
  genes:
  - preferred_term: NARS2
    term:
      id: hgnc:26274
      label: NARS2
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: asparagine-tRNA ligase activity
    modifier: DECREASED
    term:
      id: GO:0004816
      label: asparagine-tRNA ligase activity
  downstream:
  - target: Reduced Charged Mitochondrial tRNA-Asn
    causal_link_type: DIRECT
    description: >-
      Measured directly in patient cells rather than inferred: charged mt-tRNA-Asn
      is specifically decreased in patient lymphoblasts, and steady-state
      mt-tRNA-Asn is decreased in Leigh-syndrome fibroblasts.
    evidence:
    - reference: PMID:25385316
      reference_title: Two siblings with homozygous pathogenic splice-site variant in mitochondrial asparaginyl-tRNA synthetase (NARS2).
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        In EBV-transformed lymphoblasts, a specific decrease in the amount of
        charged mt-tRNA(Asn) was demonstrated as compared with controls.
      explanation: >-
        The charging defect measured in patient-derived cells, and the experiment
        the authors themselves describe as confirming pathogenicity.
  evidence:
  - reference: PMID:25385316
    reference_title: Two siblings with homozygous pathogenic splice-site variant in mitochondrial asparaginyl-tRNA synthetase (NARS2).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The c.822G>C variant affects the 3' splice site of exon 7, leading to
      skipping of the whole exon 7 and a part of exon 8 in the NARS2 mRNA.
    explanation: >-
      The molecular consequence of the founding allele, which is a splice defect
      rather than the missense change its nomenclature suggests.
  - reference: PMID:25807530
    reference_title: Mutations of human NARS2, encoding the mitochondrial asparaginyl-tRNA synthetase, cause nonsyndromic deafness and Leigh syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      A hypothetical truncated NARS2 protein, secondary to the Leigh syndrome
      mutation p.Tyr323* is not detectable and p.Asn381Ser further decreases
      NARS2 protein levels in patient fibroblasts.
    explanation: >-
      Protein-level consequences of the two Leigh syndrome alleles, measured in
      patient fibroblasts.
- name: Reduced Charged Mitochondrial tRNA-Asn
  biological_scale: MOLECULAR
  description: >-
    Less aminoacylated mt-tRNA-Asn available to the mitochondrial ribosome. This
    is the step that makes the disease a translation disorder rather than an
    enzyme-deficiency disorder in the usual metabolic sense: nothing accumulates
    upstream and no substrate is diverted, the ribosome simply stalls more often.
  biological_processes:
  - preferred_term: tRNA aminoacylation for protein translation
    modifier: DECREASED
    term:
      id: GO:0006418
      label: tRNA aminoacylation for protein translation
  locations:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  downstream:
  - target: Failure of Mitochondrial Translation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25807530
    reference_title: Mutations of human NARS2, encoding the mitochondrial asparaginyl-tRNA synthetase, cause nonsyndromic deafness and Leigh syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Additionally we demonstrate decreased steady-state levels of mt-tRNAAsn in
      fibroblasts from the Leigh syndrome patients.
    explanation: >-
      The tRNA measurement in the severe-phenotype patients, which is the same
      lesion the milder founding family shows as reduced charging.
- name: Failure of Mitochondrial Translation
  biological_scale: CELLULAR
  description: >-
    Mitochondrial protein synthesis falls. Because the mitochondrial genome
    encodes only respiratory chain subunits, the consequence is confined to the
    respiratory chain, which is why a single synthetase defect gives a combined
    rather than a scattered biochemical phenotype.
  biological_processes:
  - preferred_term: mitochondrial translation
    modifier: DECREASED
    term:
      id: GO:0032543
      label: mitochondrial translation
  downstream:
  - target: Combined Complex I and Complex IV Deficiency
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:25807530
    reference_title: Mutations of human NARS2, encoding the mitochondrial asparaginyl-tRNA synthetase, cause nonsyndromic deafness and Leigh syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The primary function of mt-aaRSs is to charge mitochondrial tRNA (mt-tRNA)
      molecules with their cognate amino acids
    explanation: >-
      The general statement of what this class of enzyme does. It is background
      in its own paper, not that paper's finding, and it is the premise this node
      rests on.
    quote_role: BACKGROUND
- name: Combined Complex I and Complex IV Deficiency
  biological_scale: CELLULAR
  description: >-
    The biochemical signature of the disease, demonstrated in skeletal muscle by
    enzymology and confirmed by in-gel activity staining after blue native PAGE,
    which additionally showed complex V subcomplexes. Functionally it presents as
    reduced oxygen consumption and electron transport chain activity in patient
    fibroblasts, and that deficit is rescued by wild-type NARS2.
  downstream:
  - target: Energy Failure in High-Demand Post-Mitotic Tissue
    causal_link_type: DIRECT
  - target: Lactic acidosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:25385316
    reference_title: Two siblings with homozygous pathogenic splice-site variant in mitochondrial asparaginyl-tRNA synthetase (NARS2).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Biochemical analysis of the oxidative phosphorylation (OXPHOS) complexes in
      both siblings revealed a combined complex I and IV deficiency in skeletal
      muscle.
    explanation: >-
      The defining biochemical finding, in patient muscle, and the observation
      that places this disease in the combined oxidative phosphorylation
      deficiency series.
  - reference: PMID:25385316
    reference_title: Two siblings with homozygous pathogenic splice-site variant in mitochondrial asparaginyl-tRNA synthetase (NARS2).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In-gel activity staining after blue native-polyacrylamide gel
      electrophoresis confirmed the decreased activity of complex I and IV, and,
      in addition, showed the presence of complex V subcomplexes.
    explanation: >-
      An independent method confirming the same deficiency, plus a complex V
      assembly abnormality the enzymology did not show.
  - reference: PMID:25807530
    reference_title: Mutations of human NARS2, encoding the mitochondrial asparaginyl-tRNA synthetase, cause nonsyndromic deafness and Leigh syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In these cells we show that a decrease in oxygen consumption rates (OCR)
      and electron transport chain (ETC) activity can be rescued by overexpression
      of wild type NARS2.
    explanation: >-
      A rescue experiment, which is the strongest available evidence that the
      respiratory deficit is caused by the NARS2 lesion and not merely correlated
      with it.
- name: Energy Failure in High-Demand Post-Mitotic Tissue
  biological_scale: ORGANISM
  description: >-
    The step from a ubiquitous biochemical defect to a tissue-restricted clinical
    picture, and the one this disease does not explain. A synthetase expressed in
    every cell produces disease concentrated in cochlea, brain and the pancreatic
    beta cell, and the founding literature names that tissue specificity as
    unexpected and unexplained. The node is therefore coarse on purpose and its
    outgoing edges carry no claimed intermediates.
  cell_types:
  - preferred_term: pancreatic beta cell
    term:
      id: CL:0000169
      label: type B pancreatic cell
  locations:
  - preferred_term: brain
    term:
      id: UBERON:0000955
      label: brain
  downstream:
  - target: Sensorineural hearing impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Seizure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Diabetes mellitus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Myopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Small for gestational age
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Intellectual disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Alpers- or Leigh-type progressive encephalopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:25807530
    reference_title: Mutations of human NARS2, encoding the mitochondrial asparaginyl-tRNA synthetase, cause nonsyndromic deafness and Leigh syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      The significant tissue specificity and phenotypic heterogeneity of mutated
      mt-aaRSs was unexpected, considering that a deficiency in these
      ubiquitously expressed enzymes should affect all tissue types
    explanation: >-
      States the problem this node stands in for. The authors raise it as an open
      question about the whole enzyme class rather than answering it, which is why
      nothing downstream of this node claims a known intermediate.
  - reference: PMID:40887432
    reference_title: Neonatal diabetes mellitus is a significant feature of COXPD-24 caused by recessive NARS2 variants.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Taken together with previously published cases, this study shows that NDM
      is an important feature of COXPD-24 and highlights a critical role for
      NARS2 in the insulin-secreting pancreatic beta-cell.
    explanation: >-
      Adds the beta cell to the list of tissues that depend on this enzyme
      disproportionately, which is a datum about the tissue specificity rather
      than an explanation of it.

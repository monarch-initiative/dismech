name: Combined Oxidative Phosphorylation Defect Type 24
creation_date: "2026-09-17T16:17:48Z"
description: >-
  COXPD24 is the autosomal recessive mitochondrial disease caused by biallelic
  NARS2 variants. NARS2 encodes the mitochondrial asparaginyl-tRNA synthetase,
  which charges mitochondrial tRNA-Asn. Charging is an obligatory step in
  mitochondrial translation, and mitochondrial translation makes only thirteen
  proteins, all of them respiratory chain subunits. So a synthetase defect
  produces a *combined* respiratory chain deficiency rather than a single-complex
  one, and the biochemical signature in muscle is deficiency of complex I and
  complex IV together.

  What makes this entry difficult is not the mechanism but the range. The same
  gene produces isolated nonsyndromic sensorineural hearing loss at one end
  (DFNB94) and Alpers- or Leigh-type encephalopathy with refractory epilepsy and
  early death at the other, and more recently neonatal insulin-dependent diabetes
  as a third presentation. Sensorineural hearing impairment is the feature that
  runs through the whole range and is described as cardinal.

  Whether genotype predicts which end of the range a patient sits at is contested
  in the sources themselves, and this entry does not resolve it. The paper that
  described the two poles argued that lesion severity cosegregates with
  phenotype, with a functional experiment to support it: the hearing-loss variant
  fails to rescue oxygen consumption in Leigh-syndrome fibroblasts. The
  systematic review that followed, across seventeen patients, concluded there is
  no strong genotype-outcome association. Both are curated.

  There is no disease-modifying therapy. Management is supportive.

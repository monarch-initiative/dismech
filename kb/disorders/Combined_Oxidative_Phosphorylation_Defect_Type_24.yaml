- name: Autosomal recessive inheritance
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic NARS2 variants, homozygous in consanguineous families and compound
    heterozygous elsewhere. The gene was found by homozygosity mapping combined
    with exome sequencing in a consanguineous sibship.
  evidence:
  - reference: PMID:25385316
    reference_title: Two siblings with homozygous pathogenic splice-site variant in mitochondrial asparaginyl-tRNA synthetase (NARS2).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A homozygous missense mutation (c.822G>C) was found in the gene encoding
      the mitochondrial asparaginyl-tRNA synthetase (NARS2) in two siblings born
      to consanguineous parents.
    explanation: >-
      Homozygosity in a consanguineous sibship, which is the segregation argument
      for recessive inheritance and the founding NARS2 observation.
  - reference: PMID:25807530
    reference_title: Mutations of human NARS2, encoding the mitochondrial asparaginyl-tRNA synthetase, cause nonsyndromic deafness and Leigh syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we demonstrate association of variants in the mitochondrial
      asparaginyl-tRNA synthetase NARS2 with human hearing loss and Leigh
      syndrome.
    explanation: >-
      The two poles of the phenotypic range in one sentence. The paper's
      allele-level sentence states the homozygous and compound heterozygous
      configurations explicitly; it is not quoted here because its variant
      nomenclature is bracketed and the reference validator strips bracketed
      spans before matching, so quoting it would leave an unverifiable snippet.
      The alleles themselves are recorded under genetic[].variants.

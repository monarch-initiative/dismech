  evidence:
  - reference: PMID:14579544
    reference_title: "Occupational methaemoglobinaemia. Mechanisms of production, features, diagnosis and management including the use of methylene blue."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Arterial blood gas analysis is mandatory in severe poisoning and reveals
      normal partial pressures of oxygen (pO2) and carbon dioxide (pCO2,), a
      normal 'calculated' haemoglobin oxygen saturation, an increased
      methaemoglobin concentration and possibly a metabolic acidosis.
    explanation: >-
      Names the acidosis as a possible finding, alongside the normal oxygen
      tension that makes the picture recognisable.
- name: Dyspnea
  phenotype_term:
    preferred_term: Dyspnea
    term:
      id: HP:0002094
      label: Dyspnea
    temporality: ACUTE
  evidence:
  - reference: PMID:21852596
    reference_title: "Dapsone-induced methemoglobinemia: a primer for clinicians."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Excluding overdose situations, 18 described symptomatic dapsone-associated
      methemoglobinemia and clinical presentation ranging from cyanosis to
      dyspnea.
    explanation: >-
      Gives the symptomatic range in the dapsone case series.
progression:
- phase: Delayed onset after low-level exposure
  duration: hours to days
  notes: >-
    Not every case declares quickly. Where exposure is to low concentrations, by
    inhalation or repeated skin contact, features build over hours or days. That
    matters clinically because the exposure may have stopped before the patient
    presents, and because a single reassuring measurement early does not settle
    the question.
  evidence:
  - reference: PMID:14579544
    reference_title: "Occupational methaemoglobinaemia. Mechanisms of production, features, diagnosis and management including the use of methylene blue."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Features of toxicity may develop over hours or even days when exposure,
      whether by inhalation or repeated skin contact, is to relatively low
      concentrations of inducing chemical(s).
    explanation: >-
      Gives the timescale and the exposure conditions that produce it.
environmental:
- name: Oxidant drug or chemical exposure
  description: >-
    A heterogeneous set that sorts by oxidation route rather than by drug class.
    Nitrites act by co-oxidation. Aromatic amino and nitro compounds act after
    biotransformation to an active intermediate, and their lipophilicity and
    volatility make skin and inhalation the routes that matter at work. Dapsone
    is the recurring therapeutic culprit, and it does this at therapeutic doses
    rather than only in overdose.
  exposure_term:
    preferred_term: exposure to oxidant drug or chemical
    term:
      id: ECTO:0000509
      label: exposure to drug
  exposure_classifications:
    hazard_agent_type:
    - classification_value: CHEMICAL
    exposure_route:
    - classification_value: ORAL
    - classification_value: DERMAL
    - classification_value: INHALATION
  influences_mechanisms:
  - target: Systemic Oxidant Exposure
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Exposure is what raises the rate of formation past the recovery capacity.
    evidence:
    - reference: PMID:14579544
      reference_title: "Occupational methaemoglobinaemia. Mechanisms of production, features, diagnosis and management including the use of methylene blue."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Aromatic compounds are responsible for most cases, their lipophilic nature
        and volatility facilitating absorption during dermal and inhalational
        exposure, the principal routes implicated in the workplace.
      explanation: >-
        Names the dominant chemical class and the routes, which is what the
        exposure_classifications record.
  evidence:
  - reference: PMID:21852596
    reference_title: "Dapsone-induced methemoglobinemia: a primer for clinicians."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the majority of publications describing methemoglobinemia associated with
      dapsone use reported this adverse effect at therapeutic doses
    explanation: >-
      Establishes that a therapeutic dose is enough, which is why this is a drug
      toxicity and not only a poisoning.
  - reference: PMID:22024786
    reference_title: "Methemoglobinemia: pathogenesis, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A variety of frequently used medications are capable of inducing
      methemoglobinemia, with dapsone and benzocaine being common culprits.
    explanation: >-
      Names benzocaine alongside dapsone. The local anaesthetics are a culprit
      class this entry otherwise did not carry, and they matter because the
      exposure is topical and often incidental to a procedure.
  notes: >-
    Bound to ECTO:0000509 exposure to drug, which covers the therapeutic culprits
    and not the occupational chemicals or the well water that also cause this
    disease. ECTO was searched through this repository's adapter
    (sqlite:obo:ecto) and has no class for an oxidant chemical as a group. The
    entry keeps one exposure record rather than splitting by route, because the
    sources sort the culprits by oxidation mechanism rather than by setting.
treatments:
- name: Methylene blue
  description: >-
    The antidote, and one whose mechanism carries its own contraindication. It
    works by being reduced inside the red cell and then handing that reduction to
    ferric haem, and the reducing power comes from NADPH. So the antidote depends
    on a pathway the patient may not have. In glucose-6-phosphate dehydrogenase
    deficiency it is less effective or ineffective, and in the presence of
    haemolysis a high dose can make methemoglobin instead of clearing it. The
    same oxidising chemistry that treats the disease can cause it.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: methylene blue
      term:
        id: CHEBI:6872
        label: methylene blue
  target_mechanisms:
  - target: Methemoglobin Accumulation
    treatment_effect: INHIBITS
    description: >-
      Accelerates the conversion of ferric haem back to ferrous, roughly six-fold
      over the intrinsic rate. It acts on the accumulated pool rather than on the
      oxidant, so it does not stop ongoing formation while exposure continues.
    evidence:
    - reference: PMID:14579544
      reference_title: "Occupational methaemoglobinaemia. Mechanisms of production, features, diagnosis and management including the use of methylene blue."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        clinical experience suggests that methylene blue can increase the rate of
        methaemoglobin conversion to haemoglobin some 6-fold
      explanation: >-
        Gives the magnitude of the effect. Note the source's own hedge: this is
        clinical experience, and the same review states that no controlled trial
        of efficacy has been performed.
  evidence:
  - reference: PMID:34463662
    reference_title: "Methylene Blue: An Antidote for Methemoglobinemia and Beyond."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Methylene blue has been in medicinal use for centuries and is best known as
      an antidotal treatment for acquired methemoglobinemia (MetHB).
    explanation: >-
      Establishes the antidotal role in this disease specifically.
  - reference: PMID:34463662
    reference_title: "Methylene Blue: An Antidote for Methemoglobinemia and Beyond."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Methylene blue's mechanism of action is somewhat complex and based partly on
      its oxidizing capabilities, ironically the same mechanism that causes MetHB.
    explanation: >-
      Supports the description's point that the antidote and the poison share
      chemistry, which is what makes the high-dose reversal possible.
  - reference: PMID:14579544
    reference_title: "Occupational methaemoglobinaemia. Mechanisms of production, features, diagnosis and management including the use of methylene blue."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients with features and/or methaemoglobin concentrations of 30-50%,
      should be administered methylene blue 1-2 mg/kg/bodyweight intravenously
    explanation: >-
      Gives the treatment threshold and dose.
  - reference: PMID:14579544
    reference_title: "Occupational methaemoglobinaemia. Mechanisms of production, features, diagnosis and management including the use of methylene blue."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Symptomatic improvement usually occurs within 30 minutes
    explanation: >-
      Gives the expected time to response, which is what makes a non-response
      informative.
  notes: >-
    The NADPH dependence stated in this description is the mechanism behind the
    G6PD contraindication, and the cited source gives it as a dependence on NADP+
    rather than tracing the pathway to glucose-6-phosphate dehydrogenase. The
    entry does not assert the pentose phosphate pathway step, which no source
    cited here states.
- name: Methylene blue failure in G6PD deficiency
  description: >-
    Curated as a treatment entry in its own right, because a patient who does not
    respond to the antidote is a recognisable clinical situation with its own
    management rather than an absence of treatment. Methylene blue is less
    effective or ineffective here, and at high dose in the presence of haemolysis
    it can generate methemoglobin. Exchange transfusion is what the source offers
    instead.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  evidence:
  - reference: PMID:14579544
    reference_title: "Occupational methaemoglobinaemia. Mechanisms of production, features, diagnosis and management including the use of methylene blue."
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      Methylene blue is less effective or ineffective in the presence of
      glucose-6-phosphate dehydrogenase deficiency since its antidotal action is
      dependent on nicotinamide-adenine dinucleotide phosphate (NADP+).
    explanation: >-
      Curated as REFUTE against the proposition that methylene blue treats this
      disease in a G6PD-deficient patient, with the reason given.
  - reference: PMID:14579544
    reference_title: "Occupational methaemoglobinaemia. Mechanisms of production, features, diagnosis and management including the use of methylene blue."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      in the presence of haemolysis, high dose methylene blue (20-30 mg/kg) can
      itself initiate methaemoglobin formation
    explanation: >-
      Establishes the dose-dependent reversal, which is why the failure is not
      merely a lack of benefit.
  - reference: PMID:14579544
    reference_title: "Occupational methaemoglobinaemia. Mechanisms of production, features, diagnosis and management including the use of methylene blue."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Exchange transfusion may have a role in the management of severe haemolysis
      or in G-6-P-D deficiency associated with life-threatening
      methaemoglobinaemia where methylene blue is relatively contraindicated.
    explanation: >-
      Gives the alternative, and the source's own framing of the contraindication
      as relative rather than absolute.
- name: Exposure removal, decontamination and high-flow oxygen
  description: >-
    The measures that address the production side rather than the pool. Removing
    the oxidant is what allows an intact reductase to win the balance back, which
    is the reason this disease resolves and the hereditary one does not. Oxygen
    does not correct the cyanosis, and is given to make the most of the ferrous
    haem that remains.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Systemic Oxidant Exposure
    treatment_effect: INHIBITS
    description: >-
      Removing the exposure stops the accelerated formation at its source.
    evidence:
    - reference: PMID:14579544
      reference_title: "Occupational methaemoglobinaemia. Mechanisms of production, features, diagnosis and management including the use of methylene blue."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Following decontamination, high-flow oxygen should be given to maximise
        oxygen carriage by remaining ferrous haem.
      explanation: >-
        Places decontamination first and states what the oxygen is for, which is
        the distinction this treatment is built on.
- name: Ascorbic acid, N-acetylcysteine and tocopherol
  description: >-
    Curated as treatments without confirmed benefit. They are used as adjuvants or
    alternatives to methylene blue, which makes them worth recording, and the
    cited review says plainly that the benefit is unconfirmed.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:14579544
    reference_title: "Occupational methaemoglobinaemia. Mechanisms of production, features, diagnosis and management including the use of methylene blue."
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      Supplemental antioxidants such as ascorbic acid (vitamin C),
      N-acetylcysteine and tocopherol (vitamin E) have been used as adjuvants or
      alternatives to methylene blue with no confirmed benefit.
    explanation: >-
      An explicit statement of unconfirmed benefit, curated as REFUTE against the
      claim that these agents treat the disease.

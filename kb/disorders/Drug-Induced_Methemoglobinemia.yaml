name: Drug-Induced Methemoglobinemia
creation_date: '2026-09-02T18:00:00Z'
description: >-
  Haemoglobin iron is oxidised all the time. Ferrous haem sits in high oxygen and
  slowly gives up an electron, and the red cell reduces it back so efficiently
  that almost none of the oxidised form is ever present. Drug-induced
  methemoglobinemia is that balance losing on the production side. An oxidant
  drug or chemical raises the rate of formation past what an intact reductase can
  recover, and ferric haem accumulates. Ferric haem does not carry oxygen, so
  carrying capacity falls in proportion to the fraction converted.


  The entry is curated as a phenocopy. Hereditary methemoglobinemia reaches the
  same accumulated ferric haem by losing the reductase, and this disease reaches
  it by outrunning one that works. The measurement at the bedside is identical:
  cyanosis that oxygen does not fix, a pulse oximeter that cannot be trusted, and
  a normal arterial oxygen tension beside it. What separates them is the exposure
  and the fact that this one ends when the exposure does.
categories:
- Toxic Exposure Disorder
- Treatment Toxicity
category: Complex
parents:
- Poisoning
disease_term:
  preferred_term: drug-induced methemoglobinemia
  term:
    id: MONDO:0018740
    label: drug-induced methemoglobinemia
pathophysiology:
- name: Baseline Haemoglobin Autoxidation
  description: >-
    The standing condition this disease perturbs, curated as a node because
    without it the disease looks like the appearance of something abnormal rather
    than the failure of an existing balance. Ferrous haem is continuously oxidised
    simply by sitting in oxygen.
  role: trigger
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:8416301
    reference_title: "Concise review: methemoglobinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The ferrous iron of hemoglobin is exposed continuously to high
      concentrations of oxygen and, thereby, is oxidized slowly to methemoglobin,
      a protein unable to carry oxygen.
    explanation: >-
      Establishes that the oxidation is continuous and physiological, and that the
      product cannot carry oxygen.
  downstream:
  - target: Methemoglobin Accumulation
    causal_link_type: DIRECT
    description: >-
      Baseline oxidation feeds the pool that the reductase drains. On its own it
      never accumulates, which is what the next node explains.
- name: NADH-Cytochrome b5 Reductase Recovery Capacity
  description: >-
    The draining side of the balance, and the reason baseline oxidation is
    invisible. Red cell NADH-cytochrome b5 reductase reduces ferric haem back so
    efficiently that circulating methemoglobin is insignificant. In this disease
    the enzyme is intact and simply outpaced. In the hereditary disease it is
    deficient. That is the whole difference between the two.
  role: modifier
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: NADH-cytochrome b5 reductase activity
    term:
      id: GO:0004128
      label: cytochrome-b5 reductase activity, acting on NAD(P)H
  evidence:
  - reference: PMID:8416301
    reference_title: "Concise review: methemoglobinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Under physiological conditions, methemoglobin reduction is accomplished
      mainly by red cell NADH-cytochrome b5 reductase (NADH-methemoglobin
      reductase) so efficiently that there is insignificant amounts of
      methemoglobin in the circulating blood.
    explanation: >-
      Names the enzyme and states that its efficiency is why the baseline pool
      stays negligible.
  - reference: PMID:8416301
    reference_title: "Concise review: methemoglobinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, should methemoglobin formation be increased--e.g., due to the
      presence of oxidant drugs, or an abnormal methemoglobin not amenable to
      reduction (hemoglobin M), or a deficiency in red cell cytochrome b5
      reductase--methemoglobinemia will result.
    explanation: >-
      The phenocopy sentence. It names increased formation by oxidant drugs and
      reductase deficiency as alternative routes to the same endpoint, which is
      the structure this entry and Hereditary_Methemoglobinemia share.
  downstream:
  - target: Methemoglobin Accumulation
    causal_link_type: DIRECT
    description: >-
      Recovery capacity sets the level at which formation becomes accumulation.
      The edge is drawn from the capacity node because in this disease the
      capacity is what is exceeded, not what is lost.
- name: Systemic Oxidant Exposure
  description: >-
    The oxidant present in the circulation, before anything has happened to haem.
    Separated from the oxidation it causes because the compounds divide here into
    two kinds: those that oxidise haem as they are, and those that must be
    converted to something else first.
  role: trigger
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:14579544
    reference_title: "Occupational methaemoglobinaemia. Mechanisms of production, features, diagnosis and management including the use of methylene blue."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Aromatic compounds are responsible for most cases, their lipophilic nature
      and volatility facilitating absorption during dermal and inhalational
      exposure, the principal routes implicated in the workplace.
    explanation: >-
      Names the dominant chemical class and how it is absorbed, which is what this
      node holds before any oxidation occurs.
  downstream:
  - target: Direct Oxidation of Ferrous Haem
    causal_link_type: DIRECT
    description: >-
      Compounds that oxidise haem directly act from here.
  - target: Co-Oxidation of Ferrous Haem
    causal_link_type: DIRECT
    description: >-
      Compounds acting by co-oxidation, such as nitrites, act from here.
  - target: Biotransformation to an Oxidising Intermediate
    causal_link_type: DIRECT
    description: >-
      Compounds that are not themselves the oxidant enter this route instead. The
      parent chemical is a protoxin.
  - target: Hemolytic anemia
    causal_link_type: DIRECT
    description: >-
      The oxidant damages the red cell as well as its haem, and this edge is drawn
      from the exposure rather than from the accumulated methemoglobin on purpose.
      The cited source states that not every feature belongs to the methemoglobin,
      and names chlorates as a case where the haemolysis is the greater threat to
      life. Modelling the haemolysis as downstream of the methemoglobin would
      assert a causal claim the source contradicts.
- name: Biotransformation to an Oxidising Intermediate
  description: >-
    Conversion of a chemical to an active intermediate that then initiates
    methemoglobin formation. This is a distinct step and not a manner of
    oxidising: the parent compound is inert toward haem and the metabolism is
    what makes it dangerous. It is how most aromatic amino and nitro compounds
    act, which is the group responsible for most occupational cases.
  role: intermediate
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:14579544
    reference_title: "Occupational methaemoglobinaemia. Mechanisms of production, features, diagnosis and management including the use of methylene blue."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Thirdly, biotransformation of a chemical to an active intermediate that
      initiates methaemoglobin formation by a variety of mechanisms.
    explanation: >-
      States the conversion step and that what follows it varies, which is why
      this node ends at the intermediate rather than naming a single downstream
      chemistry.
  downstream:
  - target: Direct Oxidation of Ferrous Haem
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The intermediate then oxidises haem. The source says it does so by a variety
      of mechanisms and does not say which, so this edge is drawn to the direct
      route without asserting that the intermediate acts only that way.
- name: Direct Oxidation of Ferrous Haem
  description: >-
    Electrons pass straight from ferrous haem to the oxidising compound, with no
    intermediary and no requirement for bound oxygen. The source notes it
    proceeds most readily in the absence of oxygen, which is the property that
    separates it from co-oxidation and the reason the two are curated apart.
  role: central_effector
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:14579544
    reference_title: "Occupational methaemoglobinaemia. Mechanisms of production, features, diagnosis and management including the use of methylene blue."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Firstly, direct oxidation of ferrohaemoglobin, which involves the transfer
      of electrons from ferrous haem to the oxidising compound.
    explanation: >-
      Names the route and the electron transfer that defines it.
  - reference: PMID:14579544
    reference_title: "Occupational methaemoglobinaemia. Mechanisms of production, features, diagnosis and management including the use of methylene blue."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This mechanism proceeds most readily in the absence of oxygen.
    explanation: >-
      Gives the oxygen dependence, which is what distinguishes this node from
      co-oxidation rather than merely describing it.
  downstream:
  - target: Methemoglobin Accumulation
    causal_link_type: DIRECT
    description: >-
      Formation exceeding recovery is what accumulation means here.
- name: Co-Oxidation of Ferrous Haem
  description: >-
    Oxidation that requires haemoglobin-bound oxygen, so it needs the very thing
    direct oxidation does better without. This is how nitrites act, and it is the
    reason the two routes are separate nodes rather than one: their oxygen
    requirements are opposite.
  role: central_effector
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:14579544
    reference_title: "Occupational methaemoglobinaemia. Mechanisms of production, features, diagnosis and management including the use of methylene blue."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Secondly, indirect oxidation, a process of co-oxidation which requires
      haemoglobin-bound oxygen and is involved, for example, in nitrite-induced
      methaemoglobinaemia.
    explanation: >-
      Gives the oxygen requirement and the nitrite example, both of which this
      node is built on.
  downstream:
  - target: Methemoglobin Accumulation
    causal_link_type: DIRECT
    description: >-
      Formation exceeding recovery is what accumulation means here.
- name: Methemoglobin Accumulation
  description: >-
    Ferric haem present at a level that matters. This is the node the hereditary
    disease and this one share, and everything below it is common to both. Most
    accumulation is not clinically important; concentrations around 80 percent are
    life-threatening.
  role: central_effector
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:14579544
    reference_title: "Occupational methaemoglobinaemia. Mechanisms of production, features, diagnosis and management including the use of methylene blue."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Methaemoglobinaemia presents clinically with symptoms and signs of tissue
      hypoxia. Concentrations around 80% are life-threatening.
    explanation: >-
      Gives the clinical consequence and the concentration at which it becomes
      lethal.
  - reference: PMID:8416301
    reference_title: "Concise review: methemoglobinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most methemoglobinemias have no adverse clinical consequences and need not
      be treated.
    explanation: >-
      The counterweight, and the reason this entry does not treat accumulation and
      illness as the same thing.
  downstream:
  - target: Impaired Oxygen Delivery
    causal_link_type: DIRECT
    description: >-
      Ferric haem cannot bind oxygen, so the carrying capacity falls in proportion
      to the fraction converted.
- name: Reduced Oxygen Transport Reserve
  description: >-
    What the patient brings to the poisoning. The same methemoglobin fraction is
    tolerated or not depending on whether oxygen transport was already impaired,
    so a level that is asymptomatic in one patient warrants treatment in another.
    Curated as a modifier on delivery rather than folded into it, because it
    changes the threshold at which accumulation becomes illness without changing
    the accumulation.
  role: modifier
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:22024786
    reference_title: "Methemoglobinemia: pathogenesis, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In the presence of comorbid conditions that impair oxygen transport,
      however, low-grade methemoglobinemia can become symptomatic and may warrant
      treatment.
    explanation: >-
      States the modifying effect and its clinical consequence, which is a change
      in the treatment threshold rather than in the biochemistry.
  - reference: PMID:22024786
    reference_title: "Methemoglobinemia: pathogenesis, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Typically, symptoms correlate with the methemoglobin level, and treatment
      with methylene blue is reserved for patients with significantly elevated
      methemoglobin levels.
    explanation: >-
      Gives the default the modifier departs from: symptoms usually track the
      level, and this node is why sometimes they do not.
  downstream:
  - target: Impaired Oxygen Delivery
    causal_link_type: DIRECT
    description: >-
      Less reserve means the same loss of carrying capacity produces more
      shortfall.
- name: Impaired Oxygen Delivery
  description: >-
    Tissue hypoxia with a normal arterial oxygen tension, which is the
    contradiction that identifies this disease. The oxygen is dissolved and
    measurable; it is the carrier that is missing.
  role: outcome
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:8416301
    reference_title: "Concise review: methemoglobinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The ferrous iron of hemoglobin is exposed continuously to high
      concentrations of oxygen and, thereby, is oxidized slowly to methemoglobin,
      a protein unable to carry oxygen.
    explanation: >-
      Supports the inability to carry oxygen that this node rests on. The source
      states it as a property of the molecule rather than measuring delivery.
  downstream:
  - target: Cyanosis
    causal_link_type: DIRECT
    description: >-
      Ferric haem gives the blood its colour change, which is why the cyanosis
      appears without the oxygen tension falling.
  - target: Dyspnea
    causal_link_type: DIRECT
    description: >-
      Breathlessness from the fall in delivered oxygen.
  - target: Metabolic acidosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Tissue hypoxia drives anaerobic metabolism. The intermediate is lactate, and
      the cited source reports the acidosis as a possible finding without
      assigning its origin.
discussions:
- discussion_id: darling_roughton_affinity_shift
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does oxidation of part of the haemoglobin tetramer raise oxygen affinity at
    the remaining ferrous sites, and if so does that contribute materially to the
    hypoxia in this disease?
  attaches_to:
  - pathophysiology#Impaired Oxygen Delivery
  rationale: >-
    The standard account has two arms rather than one. Ferric haem cannot carry
    oxygen, which is the arm this entry curates. The second arm, named the
    Darling-Roughton effect, holds that oxidising part of a tetramer raises the
    affinity of the ferrous subunits that remain, so the oxygen still carried is
    released less readily and the dissociation curve shifts left. If that holds,
    the patient loses delivery twice over and the hypoxia is worse than the
    methemoglobin fraction alone predicts.


    An earlier draft of this entry asserted the affinity shift in its description.
    It was removed because none of the four references cited here states it, and
    targeted searching did not find a source. It is recorded here rather than
    dropped, because the effect is named in the secondary literature and the
    oxygen delivery node would be a better model with it than without.
  proposed_experiments:
  - experiment_id: dissociation_curve_in_acquired_methemoglobinemia
    name: Measure the oxygen dissociation curve against methemoglobin fraction
    description: >-
      Determine P50 across a range of methemoglobin fractions in human blood,
      acquired rather than congenital, and test whether the shift exceeds what
      loss of carrying capacity alone accounts for.
    decision_criterion: >-
      P50 falls as methemoglobin fraction rises, beyond the change predicted by
      reduced functional haem alone.
    supporting_outcome:
    - The Impaired Oxygen Delivery node needs a second arm for impaired unloading,
      and the hypoxia is worse than the fraction predicts.
    refuting_outcome:
    - Loss of carrying capacity is the whole of the delivery defect and the single
      arm curated here is complete.
  notes: >-
    Raised from a falcon deep-research report that stated the effect as an ordered
    step in its causal chain, citing sources this entry does not hold. The claim
    may well be correct. It is not curated because it is not verified here.
differential_diagnoses:
- name: Hereditary methemoglobinemia
  disease_term:
    preferred_term: hereditary methemoglobinemia
    term:
      id: MONDO:0018963
      label: hereditary methemoglobinemia
  description: >-
    The genetic phenocopy, and the closest one in this knowledge base because the
    two diseases share their central node outright. Both end at accumulated
    ferric haem and both present with cyanosis unresponsive to oxygen beside a
    normal arterial oxygen tension. They arrive from opposite sides of one
    balance: biallelic CYB5R3 variants remove the reductase, and an oxidant drug
    outruns a reductase that works. No measurement of the methemoglobin itself
    separates them.
  distinguishing_features:
  - Exposure history, and resolution when the exposure is removed
  - Lifelong cyanosis from infancy in the hereditary form, against acute onset here
  - Cytochrome b5 reductase activity, which is reduced in the hereditary form and
    normal here
  - CYB5R3 sequencing
  evidence:
  - reference: PMID:8416301
    reference_title: "Concise review: methemoglobinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, should methemoglobin formation be increased--e.g., due to the
      presence of oxidant drugs, or an abnormal methemoglobin not amenable to
      reduction (hemoglobin M), or a deficiency in red cell cytochrome b5
      reductase--methemoglobinemia will result.
    explanation: >-
      One sentence naming both routes to the same endpoint, which is what makes
      this a phenocopy rather than a resemblance.
- name: Hemoglobin M disease
  description: >-
    The third route named in the same sentence, and the one this entry does not
    curate. A structurally abnormal haemoglobin holds iron in the ferric state and
    is not amenable to reduction, so the reductase is neither absent nor outrun.
    It is a third way to reach the same node and belongs on the list for that
    reason.
  distinguishing_features:
  - Haemoglobin electrophoresis or sequencing
  - No exposure history, and no response to methylene blue, since the lesion is in
    the globin rather than in the reducing capacity
  evidence:
  - reference: PMID:8416301
    reference_title: "Concise review: methemoglobinemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, should methemoglobin formation be increased--e.g., due to the
      presence of oxidant drugs, or an abnormal methemoglobin not amenable to
      reduction (hemoglobin M), or a deficiency in red cell cytochrome b5
      reductase--methemoglobinemia will result.
    explanation: >-
      Names haemoglobin M as a distinct route. The non-response to methylene blue
      in this entry's distinguishing features follows from where the lesion sits
      and is not stated by this source.
- name: Cyanotic cardiac or pulmonary disease
  description: >-
    What the patient is usually assumed to have. Two bedside observations point
    away from it: the patient looks better than the cyanosis suggests, and the
    cyanosis does not improve on oxygen.
  distinguishing_features:
  - Cyanosis unresponsive to oxygen therapy
  - Arterial blood gas showing a normal oxygen tension beside the cyanosis
  - Pulse oximetry unreliable rather than simply low
  evidence:
  - reference: PMID:14579544
    reference_title: "Occupational methaemoglobinaemia. Mechanisms of production, features, diagnosis and management including the use of methylene blue."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the victim is often less unwell than one would expect from the severity of
      'cyanosis' and, secondly, the 'cyanosis' is unresponsive to oxygen therapy
    explanation: >-
      Gives both discriminating observations, in the source's own framing as
      clinical clues.
diagnosis:
- name: Recognition from cyanosis with a saturation gap
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  description: >-
    The diagnosis is a contradiction noticed at the bedside. The patient is
    cyanosed and looks better than the cyanosis suggests, the cyanosis does not
    improve on oxygen, and the blood is chocolate brown. Between the pulse
    oximeter and the arterial gas there is a gap that should not exist.
  results: >-
    Cyanosis with a saturation gap and chocolate-brown blood raises the
    suspicion; an elevated methemoglobin concentration confirms it.
  evidence:
  - reference: PMID:22024786
    reference_title: "Methemoglobinemia: pathogenesis, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Unique features, such as a saturation gap and chocolate-brown-colored blood,
      can raise suspicion for methemoglobinemia.
    explanation: >-
      Names the two signs this diagnosis turns on. The sibling entry
      Hereditary_Methemoglobinemia cites the same sentence, which is appropriate:
      the diagnostic picture is shared and the exposure history is what separates
      the two diseases.
  - reference: PMID:22024786
    reference_title: "Methemoglobinemia: pathogenesis, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of methemoglobinemia should be considered in patients
      presenting with cyanosis and hypoxia.
    explanation: >-
      States when to think of it at all, which is the step before any measurement.
- name: Pulse oximetry is unreliable
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  description: >-
    Curated as its own diagnostic entry because the instrument does not simply
    read low, it reads wrongly, and a clinician who trusts it is misled rather
    than merely uninformed. This is what creates the saturation gap against the
    arterial gas.
  results: >-
    Oximetry readings cannot be used to gauge severity or response in this
    disease.
  evidence:
  - reference: PMID:14579544
    reference_title: "Occupational methaemoglobinaemia. Mechanisms of production, features, diagnosis and management including the use of methylene blue."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pulse oximetry is unreliable in the presence of methaemoglobinaemia.
    explanation: >-
      States the unreliability directly. The entry's description and its cyanotic
      cardiac differential both depend on this, and this is where it is now
      carried.
- name: Arterial blood gas with co-oximetry
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  description: >-
    The confirmatory test, and the one that makes the contradiction explicit. The
    dissolved oxygen tension is normal, the calculated saturation is normal, and
    the measured methemoglobin is raised. Normal numbers beside a blue patient are
    the finding.
  results: >-
    Normal pO2 and calculated saturation with an increased methemoglobin
    concentration, and possibly a metabolic acidosis.
  evidence:
  - reference: PMID:14579544
    reference_title: "Occupational methaemoglobinaemia. Mechanisms of production, features, diagnosis and management including the use of methylene blue."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Arterial blood gas analysis is mandatory in severe poisoning and reveals
      normal partial pressures of oxygen (pO2) and carbon dioxide (pCO2,), a
      normal 'calculated' haemoglobin oxygen saturation, an increased
      methaemoglobin concentration and possibly a metabolic acidosis.
    explanation: >-
      Gives the full expected panel, including the normal values that make the
      raised methemoglobin interpretable.
- name: Exposure history
  diagnosis_term:
    preferred_term: clinical assessment
    term:
      id: NCIT:C124351
      label: Clinical Evaluation
  description: >-
    What separates this disease from its genetic phenocopy, and the source is
    blunt that taking it makes the diagnosis straightforward. Dapsone and
    benzocaine are the common culprits among medications.
  results: >-
    A history of an oxidant drug, chemical or occupational exposure, absent in the
    hereditary form.
  evidence:
  - reference: PMID:14579544
    reference_title: "Occupational methaemoglobinaemia. Mechanisms of production, features, diagnosis and management including the use of methylene blue."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      If an occupational history is taken, the diagnosis of methaemoglobinaemia
      should be relatively straightforward.
    explanation: >-
      States the diagnostic value of the history, with the conditional that makes
      it a failure of asking rather than of testing.
  - reference: PMID:22024786
    reference_title: "Methemoglobinemia: pathogenesis, diagnosis, and management."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A variety of frequently used medications are capable of inducing
      methemoglobinemia, with dapsone and benzocaine being common culprits.
    explanation: >-
      Names the two commonest medication culprits, which is what the history is
      looking for.

diagnosis:
- name: Netchine-Harbison clinical scoring system with molecular confirmation
  description: >-
    SRS is diagnosed clinically using SGA plus growth, craniofacial, asymmetry,
    and feeding criteria, with molecular testing used to confirm and identify
    subtypes. A negative molecular test does not exclude the clinical diagnosis.
  evidence:
  - reference: PMID:17504900
    reference_title: "11p15 imprinting center region 1 loss of methylation is a common and specific cause of typical Russell-Silver syndrome: clinical scoring system and epigenetic-phenotypic correlations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical diagnosis of RSS was established when the criterion of being SGA was associated with at least three of five criteria: postnatal growth retardation, relative macrocephaly, prominent forehead, body asymmetry, and feeding difficulties."
    explanation: Defines the core clinical scoring features used in the Netchine-Harbison framework.
  - reference: PMID:27585961
    reference_title: "Diagnosis and management of Silver-Russell syndrome: first international consensus statement."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SRS is primarily a clinical diagnosis; however, molecular testing enables confirmation of the clinical diagnosis and defines the subtype."
    explanation: Supports clinical diagnosis plus molecular confirmation/subtyping.
  - reference: PMID:20301499
    reference_title: Silver-Russell Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The Netchine-Harbison Clinical Scoring System (NH-CSS) is a sensitive diagnostic scoring system."
    explanation: GeneReviews identifies the NH-CSS as the diagnostic scoring system for SRS.
  - reference: PMID:20301499
    reference_title: Silver-Russell Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, approximately 30%-40% of individuals who meet NH-CSS clinical criteria for SRS have negative molecular and/or cytogenetic testing."
    explanation: Supports that a negative molecular test does not exclude a clinical diagnosis.
- name: 11p15 and chromosome 7 molecular testing
  description: >-
    First-line molecular evaluation typically targets 11p15 methylation defects
    and maternal UPD7, with broader methylation, copy-number, and sequencing
    approaches considered when clinical suspicion remains.
  evidence:
  - reference: PMID:36662731
    reference_title: Executive functioning in adolescents and adults with Silver-Russell syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The two principal causes of SRS are loss of methylation on chromosome 11p15 (11p15 LOM) and maternal uniparental disomy of chromosome 7 (UPD(7)mat)."
    explanation: Supports first-line testing for the two principal molecular causes.
  - reference: PMID:20301499
    reference_title: Silver-Russell Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Hypomethylation of the imprinting control region 1 (ICR1) at 11p15.5 causes SRS in 35%-67% of individuals, and maternal uniparental disomy of chromosome 7 (upd(7)mat) causes SRS in 7%-10% of individuals."
    explanation: GeneReviews gives the yield of the two first-line molecular tests, ICR1 methylation and upd(7)mat.
  - reference: PMID:20301499
    reference_title: Silver-Russell Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Genetic testing confirms clinical diagnosis in approximately 60% of affected individuals."
    explanation: Supports molecular testing as confirmatory rather than definitional.
differential_diagnoses:
- name: Beckwith-Wiedemann syndrome
  disease_term:
    preferred_term: Beckwith-Wiedemann syndrome
    term:
      id: MONDO:0007534
      label: Beckwith-Wiedemann syndrome
  description: >-
    Beckwith-Wiedemann syndrome (BWS) is the mirror-image 11p15.5 congenital
    imprinting disorder characterized by overgrowth rather than growth
    restriction.
  distinguishing_features:
  - Caused by opposite 11p15.5 epigenetic/genetic alterations (such as IC1 gain of methylation or paternal UPD11) that increase IGF2 or reduce CDKN1C activity.
  - Presents with prenatal/postnatal overgrowth, macroglossia, and embryonal tumor risk rather than intrauterine and postnatal growth retardation with relative macrocephaly.
  evidence:
  - reference: PMID:31466347
    reference_title: "Molecular and Clinical Opposite Findings in 11p15.5 Associated Imprinting Disorders: Characterization of Basic Mechanisms to Improve Clinical Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Silver-Russell and Beckwith-Wiedemann syndromes (SRS, BWS) are rare congenital human disorders characterized by opposite growth disturbances."
    explanation: Establishes BWS and SRS as clinically opposite 11p15.5 imprinting disorders.
  - reference: PMID:31466347
    reference_title: "Molecular and Clinical Opposite Findings in 11p15.5 Associated Imprinting Disorders: Characterization of Basic Mechanisms to Improve Clinical Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "With the increasing knowledge on the molecular basis of SRS and BWS, it has become obvious that the disorders mirror opposite alterations at the same genomic loci in 11p15.5."
    explanation: Contrasts BWS and SRS as mirror-image disorders arising from opposite molecular alterations at 11p15.5.
- name: Temple syndrome
  disease_term:
    preferred_term: Temple syndrome
    term:
      id: MONDO:0100507
      label: multiple congenital anomalies due to 14q32.2 paternally expressed gene defect
  description: >-
    Temple syndrome caused by chromosome 14q32.2 imprinted-region disruption
    shows major clinical overlap with Silver-Russell syndrome, including
    prenatal and postnatal growth retardation and early feeding difficulties.
  distinguishing_features:
  - Caused by 14q32.2 imprinting defects (maternal UPD14, paternal deletion, or MEG3/DLK1 hypomethylation) rather than 11p15.5 or chromosome 7 imprinting defects.
  - Puberty starts early (mean onset 7.2 years in girls and 9.6 years in boys in one series) and premature pubarche is frequent, so early puberty needs particular attention.
  evidence:
  - reference: PMID:29659920
    reference_title: Chromosome 14q32.2 Imprinted Region Disruption as an Alternative Molecular Diagnosis of Silver-Russell Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Silver-Russell syndrome (SRS) (mainly secondary to 11p15 molecular disruption) and Temple syndrome (TS) (secondary to 14q32.2 molecular disruption) are imprinting disorders with phenotypic (prenatal and postnatal growth retardation, early feeding difficulties) and molecular overlap."
    explanation: Identifies Temple syndrome (14q32.2 disruption) as a key differential diagnosis with phenotypic overlap with SRS.
  - reference: PMID:29659920
    reference_title: Chromosome 14q32.2 Imprinted Region Disruption as an Alternative Molecular Diagnosis of Silver-Russell Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean age at puberty onset was 7.2 years in girls and 9.6 years in boys; 37.5% had premature pubarche."
    explanation: Supports early puberty onset and frequent premature pubarche in 14q32.2 disruption.

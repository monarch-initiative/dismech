      explanation: Adrenarche, central puberty and insulin resistance are endocrine and metabolic surveillance targets in SRS.
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:27585961
      reference_title: "Diagnosis and management of Silver-Russell syndrome: first international consensus statement."
      supports: SUPPORT

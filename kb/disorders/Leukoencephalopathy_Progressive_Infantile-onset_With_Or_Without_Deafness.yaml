  modeled_mechanisms:
  - target: Reduced Lysyl-tRNA Synthetase Aminoacylation Activity
    relationship: RECAPITULATES
    fidelity: LOW
    model_scale: MOLECULAR
    description: >-
      Reproduces the reduced enzymatic activity of the mutant proteins and
      shows an abnormal central nervous system in the embryo.
    limitations: >-
      An amphibian embryo assayed for gross CNS abnormality is a long way from
      an infantile human leukoencephalopathy. It supports the molecular node,
      not the tissue-level or clinical ones, and the abstract reports the CNS
      result without the phenotypic detail that would let it stand for the
      human white matter phenotype.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Xenopus CNS development differs substantially from human in myelination
        timing and white matter organisation, which are the features this
        disease is defined by. The model can show that disrupted LysRS is
        damaging to a developing nervous system; it cannot show that the damage
        takes the form of human leukoencephalopathy.
    - divergence_type: SCALE_EXTRAPOLATION
      materiality: QUALIFYING
      description: >-
        The link is made at the molecular node, where the readout is enzyme
        activity. The accompanying "abnormal CNS" observation is at organ scale
        and is not what this link is cited for.
    evidence:
    - reference: PMID:30715177
      reference_title: "Biallelic KARS pathogenic variants cause an early-onset progressive leukodystrophy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Moreover, similarly disrupted lysyl-tRNA synthetase (LysRS) proteins showed reduced enzymatic activities and abnormal CNSs in Xenopus embryos."
      explanation: The single sentence reporting this model and its result.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Seven patients from five unrelated Japanese families in the defining
    cohort, four further unrelated families in an independent leukoencephalopathy
    series, plus individual case reports. No population estimate exists.
  evidence:
  - reference: PMID:30715177
    reference_title: "Biallelic KARS pathogenic variants cause an early-onset progressive leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We clinically and genetically studied seven patients (six male and one female; aged 2 to 12 years) from five unrelated families"
    explanation: The size of the cohort that defined the phenotype.
differential_diagnoses:
- name: Leukoencephalopathy with Calcifications and Cysts
  description: >-
    Also infantile-onset, also progressive, also with intracranial
    calcification - but caused by biallelic SNORD118 variants and distinguished
    by parenchymal cysts. Worth naming explicitly because the deep-research
    report for this entry cited an SNORD118 case report among its sources, and
    the two diseases are separable on imaging and on gene.
- name: Congenital Deafness with Adult-Onset Progressive Leukoencephalopathy
  description: >-
    The same gene with a different course: deafness from infancy, but
    neurological deterioration deferred to the second or third decade. Onset and
    tempo are the discriminators, not the variant.
review_notes: >-
  Scope: this entry is the infantile-onset leukoencephalopathy end of the KARS1
  allelic series. The other KARS1 phenotypes - CMT, nonsyndromic hearing
  impairment, congenital visual impairment with microcephaly, and the
  adult-onset leukoencephalopathy - are separate diseases and are not absorbed
  here. They are named in the genetic notes and one is recorded as a
  differential, because the same residue can turn up in more than one, so a
  reader arriving from a variant needs to know the boundary is clinical.

  Not curated: treatment, because there is none beyond supportive care and none
  of the sources reviewed here makes a treatment claim specific to this
  disease; and the non-canonical transcriptional and immune-response roles of
  LysRS, which the defining paper raises as a speculation about why the
  phenotype is severe and which no source here tests.

  Four systemic features previously deferred as unquotable are now curated,
  after review pointed out that the PMID:31192300 cache is full text rather
  than an abstract: failure to thrive, microcephaly, visual impairment and an
  abnormal liver ultrasound, all from the patient 3 paragraph, and all in a
  patient carrying the same recurrent c.1786C>T (p.L596F) allele as the
  defining cohort. They are single-patient observations, so none carries a
  frequency. The earlier claim in these notes that none of this was quotable
  was wrong; it was made after searching the two abstract caches and
  generalising to the third.

  Still not curated, and still worth naming: spastic tetraplegia, microcytic
  anemia, brainstem and spinal calcification, and mortality (5 of 7 in the
  defining cohort died between 2 and 12 years). These remain unquotable from
  the cached set. The mortality figure in particular deserves a
  clinical_burden section once an ORPHA record is cached.

  The same paragraph lists febrile seizures. That is deliberately not used:
  febrile seizures are not the same claim as regression precipitated by
  intercurrent illness, and pressing the sentence into that service would
  reintroduce through a quote the claim removed below.

  One claim was removed after review: the Oxidative Phosphorylation Deficiency
  node had asserted that intercurrent fever and infection precipitate
  regression. That is a standard statement about mitochondrial disease and it
  is very likely true here, but it traces to the deep-research report's
  aggregator sources rather than to any cited abstract, and it had no
  corresponding environmental entry. The first removal pass missed a second
  copy of the same claim in the Global Developmental Delay and Regression
  phenotype description, and this note asserted the claim was gone while the
  file still carried it; review caught that. Both are now gone rather than
  downgraded. If a quotable source turns up, the right shape is an
  environmental entry with influences_mechanisms and environmental_effect:
  EXACERBATES, not a sentence in a node description.

  The two imaging phenotypes attach through reports_on rather than downstream.
  Their edge descriptions had always said the radiologic finding is the white
  matter node observed rather than caused by it, while the edges themselves
  sat on downstream with causal_link_type: DIRECT, which asserts the opposite
  of what the prose said.

  One citation from the deep-research report was not used: PMID:36660574, a
  case report of infantile leukoencephalopathy with calcifications and cysts
  caused by biallelic SNORD118 variants - a different gene and a different
  disease. It appeared among the report's seven validated references and was
  not flagged, which is consistent with what relevance scoring can do: the
  paper shares most of this disease's clinical vocabulary while being about
  something else. It is recorded as a differential diagnosis instead.

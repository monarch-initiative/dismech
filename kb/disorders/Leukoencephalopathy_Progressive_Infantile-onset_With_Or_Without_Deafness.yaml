- name: Reduced Lysyl-tRNA Synthetase Aminoacylation Activity
  biological_scale: MOLECULAR
  description: >-
    Lysyl-tRNA synthetase charges tRNA-Lys with lysine, the committed step that
    makes lysine available to the ribosome. Mutant enzymes show reduced
    aminoacylation activity in vitro, and the same reduction is seen in yeast
    complementation assays.
  molecular_functions:
  - preferred_term: lysine-tRNA ligase activity
    term:
      id: GO:0004824
      label: lysine-tRNA ligase activity
    modifier: DECREASED

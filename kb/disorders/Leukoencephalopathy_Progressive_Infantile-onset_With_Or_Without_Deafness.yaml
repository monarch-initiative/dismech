genetic:
- name: KARS1
  gene_term:
    preferred_term: KARS1
    term:
      id: hgnc:6215
      label: KARS1
  relationship_type: CAUSATIVE
  notes: >-
    Encodes both the cytosolic and the mitochondrial lysyl-tRNA synthetase from
    one locus. The KARS1 allelic series spans Charcot-Marie-Tooth disease,
    nonsyndromic hearing impairment, congenital visual impairment with
    microcephaly, and congenital deafness with adult-onset leukoencephalopathy
    in addition to LEPID; the same residue can appear in more than one
    phenotype, so the genotype does not by itself assign the disease.
  evidence:
  - reference: PMID:30252186
    reference_title: "Inhibition of mitochondrial translation in fibroblasts from a patient expressing the KARS p.(Pro228Leu) variant and presenting with sensorineural deafness, developmental delay, and lactic acidosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Mutations in the KARS gene, which encodes both the cytosolic and mitochondrial isoform of lysyl-tRNA synthetase, cause predominantly neurological diseases that often involve deafness, but have also been linked to cardiomyopathy, developmental delay, and lactic acidosis."
    explanation: States the dual-isoform architecture of the gene and the breadth of its phenotypes. This is the fibroblast paper's opening framing sentence rather than a result it produced, which is what quote_role records here.
  - reference: PMID:31192300
    reference_title: "Loss-of-function mutations in Lysyl-tRNA synthetase cause various leukoencephalopathy phenotypes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Six previously unreported and 1 known KARS mutations were identified and cosegregated in these families."
    explanation: Independent families with cosegregating KARS1 variants and a leukoencephalopathy phenotype.

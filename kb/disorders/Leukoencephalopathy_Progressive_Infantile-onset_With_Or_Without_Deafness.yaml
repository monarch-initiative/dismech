- name: Biallelic KARS1 Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Homozygous or compound heterozygous KARS1 variants, mostly missense with
    occasional splice-site and frameshift alleles. The Japanese cohort that
    defined the phenotype shared one position across all seven patients,
    p.Leu568Phe in isoform 2, in either the homozygous or compound heterozygous
    state.

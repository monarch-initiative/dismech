name: Leukoencephalopathy Progressive Infantile-onset With Or Without Deafness
creation_date: "2026-09-15T00:00:00Z"
category: Mendelian
synonyms:
- LEPID
- KARS1-related infantile-onset progressive leukoencephalopathy
- infantile-onset progressive leukoencephalopathy with deafness
- KARS-related early-onset progressive leukodystrophy
disease_term:
  preferred_term: leukoencephalopathy, progressive, infantile-onset, with or without deafness
  term:
    id: MONDO:0030893
    label: leukoencephalopathy, progressive, infantile-onset, with or without deafness
parents:
- Aminoacyl-tRNA Synthetase Disorder
- Leukodystrophy
description: >-
  LEPID is an autosomal recessive leukodystrophy caused by biallelic variants in
  KARS1, which encodes lysyl-tRNA synthetase. Children present in infancy with
  severe developmental delay or arrest, deafness, hypotonia and absent speech,
  then develop intractable epilepsy and nystagmus, on a background of white
  matter signal abnormality with intracranial calcification and raised lactate.

  KARS1 is the interesting part. One gene encodes both the cytosolic and the
  mitochondrial isoform of the enzyme, so a single pair of alleles can impair
  cytosolic translation, mitochondrial translation, or both - and which one is
  impaired appears to decide which disease the patient gets. In the most fully
  dissected case, patient fibroblasts showed a multiple oxidative
  phosphorylation deficiency from impaired mitochondrial translation with no
  evidence of any cytosolic translation defect, and re-introducing the
  mitochondrial isoform rescued it while the cytosolic isoform did not. That
  experiment is what makes the mitochondrial arm a demonstrated mechanism here
  rather than an inference from the gene's dual localisation.

  KARS1 has a wide allelic series - Charcot-Marie-Tooth disease, nonsyndromic
  hearing impairment, congenital visual impairment with microcephaly, and
  congenital deafness with adult-onset leukoencephalopathy are all separate
  KARS1 phenotypes. This entry is the infantile leukoencephalopathy end, and
  the boundary is drawn at onset and course rather than at the variant, because
  the same residue can appear in more than one phenotype.

  evidence:
  - reference: PMID:30715177
    reference_title: "Biallelic KARS pathogenic variants cause an early-onset progressive leukodystrophy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Moreover, similarly disrupted lysyl-tRNA synthetase (LysRS) proteins showed reduced enzymatic activities and abnormal CNSs in Xenopus embryos."
    explanation: Independent demonstration of reduced enzymatic activity for the disrupted protein, alongside a CNS phenotype in a model organism.
- name: Impaired Mitochondrial Translation
  biological_scale: CELLULAR
  description: >-
    KARS1 produces both the cytosolic and the mitochondrial enzyme, and in the
    patient in whom the two compartments were separated experimentally, only
    the mitochondrial one was affected: patient fibroblasts had a multiple
    oxidative phosphorylation deficiency from impaired mitochondrial
    translation, with no cytosolic translation defect, and only the
    mitochondrial isoform rescued it.
  cell_types:
  - preferred_term: Fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: mitochondrial translation
    term:
      id: GO:0032543
      label: mitochondrial translation
    modifier: DECREASED
  downstream:
  - target: Oxidative Phosphorylation Deficiency
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:30252186
    reference_title: "Inhibition of mitochondrial translation in fibroblasts from a patient expressing the KARS p.(Pro228Leu) variant and presenting with sensorineural deafness, developmental delay, and lactic acidosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Molecular characterization of patient fibroblasts revealed a multiple oxidative phosphorylation deficiency due to impaired mitochondrial translation, but no evidence of inhibition of cytosolic translation."
    explanation: Localises the translation defect to the mitochondrial compartment in patient cells, which is what this node claims.
  - reference: PMID:30252186
    reference_title: "Inhibition of mitochondrial translation in fibroblasts from a patient expressing the KARS p.(Pro228Leu) variant and presenting with sensorineural deafness, developmental delay, and lactic acidosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Reintroduction of wild-type mitochondrial KARS, but not the cytosolic isoform, rescued this phenotype confirming the disease-causing nature of p.(Pro228Leu) exchange and demonstrating the mitochondrial etiology of the disease."
    explanation: Isoform-specific rescue - the experiment that makes the mitochondrial arm a demonstrated mechanism rather than an inference from dual localisation.
- name: Oxidative Phosphorylation Deficiency
  biological_scale: CELLULAR
  description: >-
    Failure of mitochondrial translation leaves the respiratory chain short of
    its mitochondrially encoded subunits, giving a combined complex deficiency
    and a shift toward anaerobic metabolism. Clinically this surfaces as
    elevated lactate and pyruvate. The tissues that fail first are the ones
    with the highest oxidative demand, which is the conventional explanation
    for why a translation defect of this kind presents with cochlear and
    central nervous system disease; no source cited here demonstrates that
    ordering for KARS1 specifically.
  biological_processes:
  - preferred_term: aerobic respiration
    term:
      id: GO:0009060
      label: aerobic respiration
    modifier: DECREASED
  downstream:
  - target: White Matter Injury and Intracranial Calcification
    causal_link_type: DIRECT
  - target: Lactic Acidosis
    causal_link_type: DIRECT
  - target: Sensorineural Hearing Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Every patient in the defining cohort was deaf, and the cochlea is among
      the most oxidative-phosphorylation-dependent tissues in the body, which
      is why mitochondrial translation defects so often present audiologically.
      The intermediate steps between the respiratory-chain deficit and hair-cell
      or spiral-ganglion failure are not established for KARS1, so the edge is
      recorded as indirect with unknown intermediates and carries no evidence of
      its own.
  evidence:
  - reference: PMID:30252186
    reference_title: "Inhibition of mitochondrial translation in fibroblasts from a patient expressing the KARS p.(Pro228Leu) variant and presenting with sensorineural deafness, developmental delay, and lactic acidosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We propose that mitochondrial translation deficiency is the probable disease culprit in this and possibly other patients with mutations in KARS."
    explanation: States the authors' mechanistic conclusion linking the translation defect to the disease, which is the step this node sits on.

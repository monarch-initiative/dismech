- accession: geo:GSE291247
  title: DLEU2 promotes cell motility and immune infiltration in cervical squamous cell carcinoma through reciprocal feed-forward activation of E2F1
  description: Cancer metastasis is the primary cause of high mortality in patients with cervical squamous cell carcinoma (CESC). The invasive ability of cancer cells is enhanced by increased cell motility, which contributes to their distant metastasis. The oncogenic lncRNA DLEU2, implicated in tumor progression and prognosis, remains understudied in CESC. This study investigated how DLEU2 enhances cell motility and regulates immune infiltration in CESC. We found that DLEU2 was upregulated in CESC tissues and correlated with poor prognosis in advanced-stage patients. Functionally, DLEU2 knockdown suppressed cell migration and invasion, while its overexpression enhanced motility.

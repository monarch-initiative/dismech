      explanation: Establishes squamous cell carcinoma morphology as the predominant malignant cervical histology.
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY
    notes: >-
      Cervical squamous cell carcinoma is managed as a gynecologic solid-tumor

- name: E6/E7 Inactivation of p53 and pRB
  biological_scale: MOLECULAR
  conforms_to: "viral_oncogenesis#Host Tumor Suppressor Inactivation and Signaling Hijack"
  description: >-
    HPV E6 promotes ATP- and ubiquitin-dependent proteasomal degradation of
    p53, impairing DNA-damage checkpoints and apoptosis, while HPV E7 binds and
    inactivates the retinoblastoma protein (pRB), releasing E2F-driven G1/S
    cell-cycle progression. Combined loss of p53 and pRB removes the principal
    checkpoints restraining proliferation of genetically damaged squamous cells.
  evidence:
  - reference: PMID:2175676
    reference_title: "The E6 oncoprotein encoded by human papillomavirus types 16 and 18 promotes the degradation of p53."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In this study we demonstrate that the E6 proteins of the oncogenic HPVs that bind p53 stimulate the degradation of p53."
    explanation: >-
      Primary biochemical study demonstrating oncogenic HPV-16/18 E6-stimulated
      p53 degradation.
  - reference: PMID:2537532
    reference_title: "The human papilloma virus-16 E7 oncoprotein is able to bind to the retinoblastoma gene product."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These assays have been used to demonstrate that the E7 oncoprotein of the human papilloma virus type-16 can form similar complexes with p105-RB."
    explanation: >-
      Primary biochemical study demonstrating direct complex formation between
      HPV-16 E7 and pRB.
  - reference: PMID:40216282
    reference_title: "Novel therapeutic strategies for targeting E6 and E7 oncoproteins in cervical cancer."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The E6 protein causes degradation of p53 leading to impaired cellular stress response. In contrast, the E7 protein impairs the activity of retinoblastoma protein (pRb) resulting in continuous cell cycle propagation."
    explanation: >-
      Summarizes the combined E6/p53 degradation and E7/pRB inactivation
      mechanisms in cervical carcinogenesis.

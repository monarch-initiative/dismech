      explanation: Demonstrates phase 3 survival and local-control benefit of cisplatin-sensitized EBRT plus brachytherapy against locally invasive disease.
- name: Pembrolizumab
  description: >-
    Anti-PD-1 monoclonal antibody approved in combination with platinum-based
    chemotherapy (with or without bevacizumab) for persistent, recurrent, or
    metastatic PD-L1-positive (CPS >= 1) cervical cancer (KEYNOTE-826) and in
    combination with chemoradiation for high-risk locally advanced cervical
    cancer (KEYNOTE-A18).
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
    therapeutic_agent:

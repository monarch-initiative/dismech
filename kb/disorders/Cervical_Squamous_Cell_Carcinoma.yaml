      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Stromal invasion and lymphovascular space involvement (LVSI) from pretreatment biopsy identify candidates for surgery, particularly for simple hysterectomy."
      explanation: Connects surgical resection eligibility and extent directly to stromal invasion and LVSI status.
- name: Concurrent Chemoradiation
  description: >-
    Concurrent weekly cisplatin-based chemotherapy with external beam
    radiotherapy followed by brachytherapy is the cornerstone curative regimen
    for locally advanced cervical squamous cell carcinoma, with pembrolizumab
    added for high-risk locally advanced disease (KEYNOTE-A18).
  evidence:
  - reference: DOI:10.3390/jcm13154351
    reference_title: "The Polish Society of Gynecological Oncology Guidelines for the Diagnosis and Treatment of Cervical Cancer (v2024.0)"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Locally Advanced Cancer: concurrent chemoradiation (CCRT) followed by brachytherapy (BRT) is the cornerstone treatment."
    explanation: National guideline establishing CCRT plus brachytherapy as cornerstone therapy for locally advanced cervical cancer.
  - reference: DOI:10.3390/curroncol33010048
    reference_title: "Advances in Screening, Immunotherapy, Targeted Agents, and Precision Surgery in Cervical Cancer: A Comprehensive Clinical Review (2018–2025)"
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "For locally advanced disease, KEYNOTE-A18 establishes pembrolizumab plus chemoradiation as a new curative standard"
    explanation: Clinical review summarizing KEYNOTE-A18 establishing pembrolizumab plus chemoradiation in high-risk locally advanced cervical cancer.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: radiation therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy

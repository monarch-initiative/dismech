  - reference: PMID:39215938
    reference_title: "SEOM-GEICO Clinical Guidelines on cervical cancer (2023)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "To determine if the immune checkpoint inhibitors after failure to platinum therapy were superior to standard ChT in terms of OS, the phase 3 GOG 3016/ENGOT-cx9 (EMPOWER Cervical-1) trial randomized 608 patients to receive cemiplimab or investigator’s choice of intravenous ChT. Cemiplimab exhibited a statistically significant improvement in OS compared to ChT (12.0 months vs 8.5 months; HR 0.69; 95% CI 0.56–0.84; p < 0.001), in both SCC and the entire population, regardless of PD-L1 status."
    explanation: Phase 3 EMPOWER-Cervical 1 trial synthesis demonstrating significant overall survival improvement with second-line cemiplimab monotherapy in cervical squamous cell carcinoma and overall recurrent/metastatic cervical cancer.

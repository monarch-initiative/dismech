      explanation: Directly links APOBEC mutagenesis during genomic instability to recurrent PIK3CA helical-domain driver mutations in primary cervical tumors.
  - target: TGFBR2 Loss-of-Function Alteration
    description: Somatic mutation and focal 3p24.1 deletion inactivate TGFBR2 growth-inhibitory signaling in squamous tumors.
    evidence:
    - reference: PMID:28112728
      reference_title: "Integrated genomic and molecular characterization of cervical cancer."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "mutations in HLA-A, HLA-B, NFE2L2, MAPK1, CASP8, SHKBP1 and TGFBR2 were found exclusively in squamous tumours."
      explanation: TCGA exome sequencing shows squamous-specific accumulation of somatic TGFBR2 mutations in cervical squamous cell carcinoma.
  - target: CD274/PDCD1LG2 9p24.1 Amplification
    description: Chromosomal instability generates recurrent 9p24.1 focal amplifications encompassing CD274 (PD-L1) and PDCD1LG2 (PD-L2).
    evidence:
    - reference: PMID:28112728
      reference_title: "Integrated genomic and molecular characterization of cervical cancer."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Novel recurrent focal amplification events were identified (in genomic order) at 7p11.2 (EGFR, 17%), 9p24.1 (CD274, PDCD1LG2, 21%), 13q22.1 (KLF5, 18%) and 16p13.13 (BCAR4, 20%)."
      explanation: TCGA copy-number profiling demonstrates recurrent 9p24.1 CD274/PDCD1LG2 amplification arising from somatic copy-number instability.
  - target: Stromal Invasion
    description: Dysplastic squamous epithelial cells acquire additional genetic and epigenetic alterations that breach the basement membrane and invade cervical stroma.
    evidence:
    - reference: PMID:39215938
      reference_title: "SEOM-GEICO Clinical Guidelines on cervical cancer (2023)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "These tumors arise in dividing epithelial cells in high-grade squamous intraepithelial lesions (HSIL), a so-called transforming infection. The progression of high-grade lesions to SCC requires the accumulation of additional, yet incompletely understood, genetic and epigenetic alterations, a process that may take up to 20–30 years."
      explanation: Describes progression from HSIL/CIN3 to invasive cervical squamous cell carcinoma through accumulated somatic alterations.

- name: Cemiplimab
  description: >-
    Anti-PD-1 monoclonal antibody approved as second-line monotherapy for
    recurrent or metastatic cervical cancer progressing on or after
    platinum-based chemotherapy, improving overall survival in both the squamous
    cell carcinoma subgroup and the overall population regardless of PD-L1
    status (EMPOWER-Cervical 1 / GOG-3016).
  therapeutic_modality: MONOCLONAL_ANTIBODY
  treatment_term:
    preferred_term: immunotherapy
    term:
      id: NCIT:C15262

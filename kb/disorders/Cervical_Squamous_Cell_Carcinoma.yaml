      label: exposure to Human immunodeficiency virus
  effect: HARMFUL
  description: >-
    HIV-associated immunosuppression impairs cell-mediated clearance of
    oncogenic HPV, substantially increasing high-risk HPV persistence,
    progression of squamous intraepithelial lesions, and invasive cervical
    cancer burden (accounting for 65.1% of patients in high-HIV-prevalence
    sub-Saharan African cohorts).

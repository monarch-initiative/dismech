diagnosis:
- name: High-Risk HPV Testing and Cervical Cytology Screening
  description: >-
    Primary high-risk HPV DNA nucleic acid amplification testing and/or
    Papanicolaou cervical cytology detect preinvasive high-grade squamous
    intraepithelial lesions and asymptomatic early cervical squamous cell
    carcinoma, triaging positive results to colposcopy.
  diagnosis_term:
    preferred_term: Nucleic Acid Amplification Test
    term:
      id: NCIT:C20055
      label: Nucleic Acid Amplification Test
  markers: High-risk HPV DNA (especially genotypes 16 and 18) and squamous cytologic atypia
  results: Positive high-risk HPV genotype or abnormal squamous cytology (HSIL/ASC-H) prompting colposcopy and biopsy
  evidence:
  - reference: PMID:39215938
    reference_title: "SEOM-GEICO Clinical Guidelines on cervical cancer (2023)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "On the other hand, advances in secondary prevention, with the introduction of highly sensitive HPV DNA testing, has improved the effectiveness of traditional Papanicolaou cytology in screening programs."
    explanation: Clinical oncology guideline establishing HPV DNA testing alongside Papanicolaou cytology for early detection of cervical neoplasia.
- name: Colposcopy-Directed Cervical Biopsy and Conization
  description: >-
    Definitive diagnosis of invasive cervical squamous cell carcinoma requires
    histopathologic confirmation on colposcopy-directed punch biopsy, direct
    biopsy of a visible cervical lesion, or diagnostic conization/LEEP, which
    also assesses depth of stromal invasion and lymphovascular space
    involvement.
  diagnosis_term:
    preferred_term: Biopsy Procedure
    term:
      id: NCIT:C15189
      label: Biopsy Procedure
  results: Invasive squamous cell carcinoma with measured stromal invasion depth and LVSI status
  evidence:
  - reference: PMID:39215938
    reference_title: "SEOM-GEICO Clinical Guidelines on cervical cancer (2023)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Abnormal cervical cytology or a positive high-risk HPV test should prompt the performance of colposcopy and biopsy, or excisional procedures such as loop electrosurgical excision and conization."
    explanation: Establishes colposcopy-guided cervical biopsy or diagnostic conization/LEEP as the definitive diagnostic tissue procedure.
- name: p16 and PD-L1 Immunohistochemistry
  description: >-
    Diffuse block-type p16INK4a immunohistochemistry serves as the WHO-endorsed
    pathologic surrogate marker distinguishing HPV-associated from
    HPV-independent cervical squamous cell carcinoma, while PD-L1 (CPS)
    immunohistochemistry identifies candidates for PD-1 checkpoint blockade in
    recurrent or metastatic disease.
  diagnosis_term:
    preferred_term: Immunohistochemistry Staining Method
    term:
      id: NCIT:C23020
      label: Immunohistochemistry Staining Method
  markers: p16INK4a block positivity; PD-L1 combined positive score (CPS)
  results: Block-positive nuclear/cytoplasmic p16 confirming HPV-associated SCC; PD-L1 CPS >= 1 guiding pembrolizumab eligibility
  evidence:
  - reference: DOI:10.1055/a-1545-4279
    reference_title: "2020 WHO Classification of Female Genital Tumors"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Immunohistochemical p16 expression is considered to be a surrogate marker for HPV association."
    explanation: WHO 2020 endorses p16 immunohistochemistry to classify HPV-associated versus HPV-independent cervical squamous cell carcinoma.
  - reference: PMID:39215938
    reference_title: "SEOM-GEICO Clinical Guidelines on cervical cancer (2023)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "PD-L1 Testing: PD-L1 expression testing is recommended in patients with recurrent, progressive, or metastatic cervical cancer."
    explanation: Recommends diagnostic PD-L1 expression testing to guide checkpoint inhibitor selection.
- name: Pelvic Magnetic Resonance Imaging for Staging
  description: >-
    Pelvic MRI is the preferred imaging modality to evaluate primary cervical
    tumor size, depth of stromal invasion, and local extension into the vagina
    or parametrium for 2018 FIGO staging.
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  results: Local tumor dimensions, parametrial/vaginal extension, and regional pelvic nodal assessment
  evidence:
  - reference: PMID:39215938
    reference_title: "SEOM-GEICO Clinical Guidelines on cervical cancer (2023)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Recommended radiological imaging include pelvic magnetic resonance imaging (MRI) to evaluate local disease extension (preferred for FIGO stage IB1–IB3)."
    explanation: Establishes pelvic MRI as the standard staging imaging test for local cervical tumor extension.

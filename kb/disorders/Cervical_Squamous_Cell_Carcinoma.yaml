      explanation: Medical oncology practice guideline confirming solid-tumor multimodal oncologic management across early and locally advanced stages.
parents:
- Cervical Cancer
description: >-
  Cervical squamous cell carcinoma (CSCC) is the most common histologic type
  of cervical cancer, accounting for approximately 80% of cases. It arises
  from the non-keratinized stratified squamous epithelium of the ectocervix,
  predominantly at the squamocolumnar junction (the transformation zone).
  More than 95% of cases are caused by persistent infection with high-risk
  human papillomavirus (HPV), with HPV-16 and HPV-18 responsible for roughly
  70% of cases. The HPV oncoproteins E6 and E7 inactivate the tumor
  suppressors p53 and pRB, respectively, driving APOBEC-associated genomic
  instability, recurrent secondary alterations in PIK3CA, TGFBR2, and CD274
  (PD-L1), and malignant transformation through a stepwise progression from
  cervical intraepithelial neoplasia (CIN1 -> CIN2 -> CIN3) to invasive
  carcinoma.
infectious_agent:
- name: Human Papillomavirus 16
  description: >-
    High-risk oncogenic HPV genotypes cause more than 95% of cervical squamous
    cell carcinomas, with HPV-16 as the dominant genotype and HPV-16 plus
    HPV-18 together accounting for approximately 70% of all cervical SCCs.
  infectious_agent_term:
    preferred_term: Human papillomavirus 16
    term:
      id: NCBITaxon:333760
      label: Human papillomavirus 16
  evidence:
  - reference: PMID:39215938
    reference_title: "SEOM-GEICO Clinical Guidelines on cervical cancer (2023)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Hight-risk HPV genotypes cause the vast majority (> 95%) of SCC. Twelve HPV types are classified by WHO as oncogenic: 16, 18, 31, 33, 35, 39, 45, 51, 52, 56, 58, and 59. However, two types (16 and 18) alone are responsible for 70% of all SCC."
    explanation: Quantifies oncogenic HPV attribution (>95% overall; 70% from HPV-16 and HPV-18) specifically in cervical squamous cell carcinoma.
- name: Human Papillomavirus 18
  description: >-
    Second most frequent oncogenic HPV genotype in cervical squamous cell
    carcinoma; together with HPV-16, HPV-18 accounts for approximately 70% of
    all cervical SCCs and exhibits host genome integration across all
    HPV-18-related tumors in TCGA.
  infectious_agent_term:
    preferred_term: Human papillomavirus 18
    term:
      id: NCBITaxon:333761
      label: human papillomavirus 18
  evidence:
  - reference: PMID:39215938
    reference_title: "SEOM-GEICO Clinical Guidelines on cervical cancer (2023)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Hight-risk HPV genotypes cause the vast majority (> 95%) of SCC. Twelve HPV types are classified by WHO as oncogenic: 16, 18, 31, 33, 35, 39, 45, 51, 52, 56, 58, and 59. However, two types (16 and 18) alone are responsible for 70% of all SCC."
    explanation: Establishes HPV-18 alongside HPV-16 as one of the two genotypes responsible for 70% of cervical squamous cell carcinomas.
  - reference: PMID:28112728
    reference_title: "Integrated genomic and molecular characterization of cervical cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Integration of human papilloma virus (HPV) was observed in all HPV18-related samples and 76% of HPV16-related samples, and was associated with structural aberrations and increased target-gene expression."
    explanation: TCGA primary tumor sequencing demonstrates viral integration into the host genome in 100% of HPV18-related cervical carcinomas.
has_subtypes:
- name: HPV-Associated SCC
  display_name: HPV-Associated Cervical Squamous Cell Carcinoma
  description: >-
    The dominant subtype, accounting for more than 95% of cervical squamous
    cell carcinomas. Defined by persistent infection with high-risk HPV and
    identified pathologically by diffuse block-type p16 immunohistochemistry
    as a surrogate marker for high-risk HPV.
  evidence:
  - reference: DOI:10.1055/a-1545-4279
    reference_title: "2020 WHO Classification of Female Genital Tumors"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "AbstractThe 2020 WHO classification is focused on the distinction between HPV-associated and HPV-independent squamous cell carcinoma of the lower female genital organs."
    explanation: The 2020 WHO classification codifies HPV-associated cervical SCC as a distinct etiologic subtype, with p16 IHC as the surrogate marker.
  - reference: PMID:39215938
    reference_title: "SEOM-GEICO Clinical Guidelines on cervical cancer (2023)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Hight-risk HPV genotypes cause the vast majority (> 95%) of SCC."
    explanation: Supports the >95% predominance of HPV-associated cervical squamous cell carcinoma.
- name: HPV-Independent SCC
  display_name: HPV-Independent Cervical Squamous Cell Carcinoma
  description: >-
    A rare minority of cervical SCCs without high-risk HPV association and
    without a recognized precancerous intraepithelial precursor lesion. The
    2020 WHO classification distinguishes HPV-independent from HPV-associated
    cervical SCC using p16 immunohistochemistry as a surrogate marker, while
    permitting "squamous cell carcinoma, NOS" when HPV status cannot be
    established.
  evidence:
  - reference: DOI:10.1055/a-1545-4279
    reference_title: "2020 WHO Classification of Female Genital Tumors"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Immunohistochemical p16 expression is considered to be a surrogate marker for HPV association."
    explanation: WHO 2020 establishes the HPV-associated vs HPV-independent dichotomy using p16 IHC, the basis for defining the HPV-independent subtype.
  - reference: DOI:10.1055/a-1545-4279
    reference_title: "2020 WHO Classification of Female Genital Tumors"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "For the very rare HPV-negative squamous cell carcinoma ... there is no known precancerous lesion."
    explanation: Confirms the rarity of HPV-independent cervical SCC and absence of a defined precursor lesion.
stages:
- name: CIN1
  description: >-
    Cervical intraepithelial neoplasia grade 1 (low-grade squamous
    intraepithelial lesion), typically reflecting productive high-risk HPV
    infection of the cervical squamous epithelium; most CIN1 lesions
    regress spontaneously.
- name: CIN2
  description: >-
    Cervical intraepithelial neoplasia grade 2, an intermediate-grade
    precancerous lesion with dysplastic changes extending into the middle
    third of the epithelium, considered part of the high-grade squamous
    intraepithelial lesion (HSIL) category in two-tier systems.
- name: CIN3
  description: >-
    Cervical intraepithelial neoplasia grade 3 (high-grade squamous
    intraepithelial lesion), with dysplastic cells occupying the full
    thickness of the squamous epithelium. CIN3 is the immediate precursor
    lesion to invasive cervical squamous cell carcinoma.
- name: Invasive Squamous Cell Carcinoma
  description: >-
    Invasive cervical squamous cell carcinoma, defined by breach of the
    basement membrane and stromal invasion by malignant squamous cells.
    Invasion permits lymphovascular spread and distant metastasis.
pathophysiology:
- name: Persistent High-Risk HPV Infection
  biological_scale: CELLULAR
  conforms_to: "viral_oncogenesis#Persistent Oncogenic Virus Infection"
  description: >-
    Persistent infection of basal squamous epithelial cells at the cervical
    transformation zone by high-risk HPV (most commonly HPV-16 and HPV-18) is
    the initiating etiological event in cervical squamous cell carcinoma.
    Persistent infection commits infected epithelial cells to a transforming
    viral cycle with continuous expression of the E6 and E7 oncoproteins.
  evidence:
  - reference: PMID:40216282
    reference_title: "Novel therapeutic strategies for targeting E6 and E7 oncoproteins in cervical cancer."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The main aetiological factor for developing cervical cancer is the persistent infection of Human papillomavirus (HPV)."
    explanation: >-
      Ranasinghe & McMillan 2025 identify persistent high-risk HPV infection as
      the main etiological event in cervical cancer.
  - reference: PMID:39215938
    reference_title: "SEOM-GEICO Clinical Guidelines on cervical cancer (2023)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Hight-risk HPV genotypes cause the vast majority (> 95%) of SCC."
    explanation: >-
      Confirms that high-risk HPV infection initiates >95% of cervical squamous
      cell carcinomas specifically.

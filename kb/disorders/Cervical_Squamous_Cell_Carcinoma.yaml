  - reference: PMID:39215938
    reference_title: "SEOM-GEICO Clinical Guidelines on cervical cancer (2023)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The KEYNOTE-A18 study has recently been published that examined the efficacy of adding pembrolizumab to standard CRT in patients with high-risk, locally advanced CC (FIGO 2014 stage IB2-IIB with node-positive disease or stage III-IVA). The results revealed an increase in PFS with a HR 0.70 (0.55–0.89, p = 0.0020) and 24-month OS of 87% in the pembrolizumab-chemoradiotherapy group and 81% in the placebo-chemoradiotherapy group."
    explanation: Phase 3 KEYNOTE-A18 trial synthesis demonstrating improved PFS (HR 0.70) and 24-month OS with pembrolizumab added to chemoradiotherapy in high-risk locally advanced cervical cancer.

- accession: geo:GSE197461
  title: 'Decipher heterogeneity of cervical squamous cell carcinoma and adenocarcinoma with different HPV status: combining scRNA and TCR-seq with 3D organoid'
  description: Although adenocarcinoma of the cervix (ADC) exhibits a more malignant phenotype and poorer prognosis than squamous cell carcinoma (SCC), they are treated identically. This clinical dilemma calls for deeper investigation into differences between SCC and ADC. We studied 3 human papillomavirus (HPV)-positive SCC, 3 HPV-associated (HPVA) and 2 non-HPV-associated (NHPVA) ADC samples with single-cell RNA and T cell receptor sequencing plus 3D organoid verification. Notably, we revealed the malignant origin of epithelial cells characterized by stemness and poor differentiation and the potential mechanism of HPVA and NHPVA oncogenesis, deciphering differences between SCC and ADC.

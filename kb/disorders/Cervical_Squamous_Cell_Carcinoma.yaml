  effect: HARMFUL
  description: >-
    Cigarette smoking is an established risk factor for HPV persistence and
    cervical carcinogenesis, showing a dose-response relationship with
    pack-years and smoking duration and risk normalization roughly 15 years
    after smoking cessation. A 109-study meta-analysis found pooled RR 1.70
    (95% CI 1.53-1.88) for invasive cervical cancer in current vs never smokers.
  evidence:
  - reference: DOI:10.1097/CEJ.0000000000000773
    reference_title: "Dose-risk relationships between cigarette smoking and cervical cancer: a systematic review and meta-analysis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We included 109 studies providing a pooled RR of invasive CC and preinvasive lesions, respectively, of 1.70 [95% confidence interval (CI), 1.53–1.88] and 2.11 (95% CI, 1.85–2.39) for current versus never smokers"
    explanation: Meta-analytic pooled RR establishing cigarette smoking as a risk factor for invasive cervical cancer.
  - reference: DOI:10.1097/CEJ.0000000000000773
    reference_title: "Dose-risk relationships between cigarette smoking and cervical cancer: a systematic review and meta-analysis"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The risk of CC increased with pack-years and smoking duration and decreased linearly with time since quitting, reaching that of never smokers about 15 years after quitting."
    explanation: Establishes dose-response and ~15-year cessation window for risk normalization.
  influences_mechanisms:
  - target: Persistent High-Risk HPV Infection
    environmental_effect: PREDISPOSES
    description: Cigarette smoking promotes high-risk HPV persistence and progression of cervical squamous neoplasia.
    evidence:
    - reference: PMID:39215938
      reference_title: "SEOM-GEICO Clinical Guidelines on cervical cancer (2023)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Several factors have been linked to an increased risk of HPV persistence and progression, including immunosuppression (particularly due to human immunodeficiency virus), multiparity, smoking, and the use of oral contraceptives [9]."
      explanation: Directly links smoking to increased risk of oncogenic HPV persistence and neoplastic progression.

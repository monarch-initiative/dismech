      reference_title: "Novel therapeutic strategies for targeting E6 and E7 oncoproteins in cervical cancer."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "The E7 protein impairs the activity of retinoblastoma protein (pRb) resulting in continuous cell cycle propagation."
      explanation: >-
        Continuous cell-cycle propagation driven by E7-mediated pRB inactivation
        enables accumulation of DNA damage and secondary somatic alterations.
    - reference: PMID:39215938
      reference_title: "SEOM-GEICO Clinical Guidelines on cervical cancer (2023)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "The HPV viral oncoproteins E6 and E7 inactivate p53 and RB1, respectively. This inactivation is associated with the integration of HPV into the host genome, resulting in genomic instability and the accumulation of somatic mutations."
      explanation: Connects E6/E7 inactivation of p53 and RB1 directly to genomic instability and somatic mutation accumulation.
- name: APOBEC Mutagenesis and Genomic Instability
  biological_scale: CELLULAR
  conforms_to: "viral_oncogenesis#Genomic Instability and Deregulated Proliferation"
  description: >-
    Unchecked proliferation of E6/E7-expressing cervical squamous epithelial
    cells permits APOBEC cytidine deaminase mutagenesis and somatic copy-number
    instability, generating the secondary driver mutations and focal
    amplifications/deletions that fuel malignant progression from intraepithelial
    dysplasia to invasive carcinoma.
  evidence:
  - reference: PMID:28112728
    reference_title: "Integrated genomic and molecular characterization of cervical cancer."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "suggesting that APOBEC mutagenesis is the predominant source of mutations in cervical cancers."
    explanation: >-
      TCGA whole-exome sequencing identifies APOBEC mutagenesis as the
      predominant somatic mutational process driving genomic evolution in
      cervical cancers.
  - reference: PMID:40216282
    reference_title: "Novel therapeutic strategies for targeting E6 and E7 oncoproteins in cervical cancer."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The E7 protein impairs the activity of retinoblastoma protein (pRb) resulting in continuous cell cycle propagation."
    explanation: >-
      Sustained cell-cycle propagation underpins dysplastic squamous epithelial
      expansion and ongoing somatic mutagenesis.

  conforms_to: "viral_oncogenesis#Viral Oncoprotein Expression and Genome Integration"
  description: >-
    Integration of high-risk HPV DNA into the host squamous epithelial genome
    occurs in the majority of HPV-16-positive and nearly all HPV-18-positive
    cervical tumors, generating local structural aberrations, dysregulated viral
    E6/E7 expression, and altered adjacent host gene expression.

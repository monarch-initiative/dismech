- name: High-Risk HPV Infection
  effect: CAUSAL
  exposure_term:
    preferred_term: exposure to Human Papillomavirus Infection
    term:
      id: ECTO:2000053
      label: exposure to Human Papillomavirus Infection
  influences_mechanisms:
  - target: Persistent High-Risk HPV Infection
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Persistent infection of the cervical squamous epithelium by a high-risk
      HPV type is the initiating event of this disease; there is no host genetic
      lesion at the point of initiation, so the exposure link is what marks the
      origin.
    evidence:
    - reference: PMID:40216282
      reference_title: "Novel therapeutic strategies for targeting E6 and E7 oncoproteins in cervical cancer."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "The main aetiological factor for developing cervical cancer is the persistent infection of Human papillomavirus (HPV)."
      explanation: >-
        Identifies persistent HPV infection as the main aetiological factor,
        supporting this exposure as the initiating event acting on the
        persistent-infection node.
  description: >-
    Persistent infection with high-risk human papillomavirus (HPV) causes more
    than 95% of cervical squamous cell carcinomas, with HPV-16 and HPV-18
    together responsible for 70% of cases.
  evidence:
  - reference: PMID:40216282
    reference_title: "Novel therapeutic strategies for targeting E6 and E7 oncoproteins in cervical cancer."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The main aetiological factor for developing cervical cancer is the persistent infection of Human papillomavirus (HPV)."
    explanation: >-
      Identifies persistent HPV infection as the main aetiological factor for
      cervical cancer.
  - reference: PMID:39215938
    reference_title: "SEOM-GEICO Clinical Guidelines on cervical cancer (2023)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Hight-risk HPV genotypes cause the vast majority (> 95%) of SCC. Twelve HPV types are classified by WHO as oncogenic: 16, 18, 31, 33, 35, 39, 45, 51, 52, 56, 58, and 59. However, two types (16 and 18) alone are responsible for 70% of all SCC."
    explanation: Directly verifies both the >95% overall high-risk HPV causal fraction and the 70% HPV-16/18 share in cervical squamous cell carcinoma.
treatments:
- name: Radical Hysterectomy
  description: >-
    Open radical hysterectomy with pelvic lymph node staging (sentinel lymph
    node mapping and/or pelvic lymphadenectomy) is primary surgical management
    for early-stage invasive cervical squamous cell carcinoma (FIGO stages IB1,
    IB2, and IIA1), while simple hysterectomy or conization may be used in
    selected low-risk <=2 cm disease.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: surgical procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  evidence:
  - reference: PMID:39215938
    reference_title: "SEOM-GEICO Clinical Guidelines on cervical cancer (2023)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "For patients diagnosed with stage IB1, IB2, or IIA1, surgery stands as the most suitable choice [I, A]."
    explanation: SEOM-GEICO clinical guideline establishing primary surgical resection for stage IB1-IIA1 cervical carcinoma.
  - reference: PMID:39215938
    reference_title: "SEOM-GEICO Clinical Guidelines on cervical cancer (2023)."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Based on the LACC trial findings, laparotomy remains the recommended approach for radical parametrectomy procedures due to the higher risk of relapse associated with minimally invasive surgery (MIS) [I, A] [ 22]."
    explanation: Confirms open radical hysterectomy/parametrectomy as standard surgical technique for early-stage invasive disease.
  target_mechanisms:
  - target: Stromal Invasion
    treatment_effect: INHIBITS
    description: Radical excision of the uterus, cervix, parametria, and upper vagina removes locally invasive cervical tumor and regional nodal drainage basins.

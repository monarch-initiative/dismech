- accession: geo:GSE318000
  title: Lnc-GATS-3:3/MCM7 promotes the proliferation and invasion of cervical squamous cell carcinoma cells by regulating the CDK/Rb/E2F signaling pathway
  description: This study investigated the role and mechanism of lnc-GATS-3:3/Mini-chromosome maintenance protein 7 (MCM7) in the proliferation, invasion, migration, and apoptosis of SiHa cervical cancer cells. Whole transcriptome sequencing was conducted on matched pairs of cervical cancer and normal tissue samples, followed by GO and KEGG enrichment analysis. The cis method was utilized to identify lncRNAs and mRNAs associated with the cell cycle. The expression levels of lnc-GATS-3:3 and MCM7 in cervical cancer and normal tissues were measured using qRT-PCR.

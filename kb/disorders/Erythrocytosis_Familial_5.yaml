    reference_title: Detection of a Distinct Erythropoietin (EPO) Profile After Isoelectric Focusing in Patients With Familial Erythrocytosis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "This specific form of EPO was associated with a higher activation of EPOR signaling in vitro and could thus be involved in the development of erythrocytosis."
    explanation: >-
      States the increased receptor activation by patient erythropoietin and its
      proposed role in the erythrocytosis.
  - reference: PMID:41574959
    reference_title: Autosomal Dominant Erythrocytosis Caused by Non-Renal Erythropoietin (EPO) Due to EPO c.-136 G>A Germline Mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the supernatant from EPO c.-136 G>A mutant clones induced a stronger proliferative response in EPO-dependent Ba/F3-EPOR cells than supernatant from wild-type cells"

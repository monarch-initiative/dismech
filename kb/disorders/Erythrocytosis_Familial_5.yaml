diagnosis:
- name: Serum erythropoietin measurement
  description: >-
    Erythropoietin is measured in every erythrocytosis workup, but in ECYT5 it
    does not behave as it does in the other secondary erythrocytoses. In the
    noncoding-variant families it is low to normal, and in the promoter-variant
    kindred it is only moderately raised for the hematocrit while staying inside
    the reference interval. A concentration that is not suppressed, in a patient
    whose red cell mass should have suppressed it, is the finding that argues
    against ECYT1 and for a drive on the hormone side.
  diagnosis_term:
    preferred_term: serum erythropoietin measurement
    term:
      id: NCIT:C74855
      label: Erythropoietin Measurement
  evidence:
  - reference: PMID:41713879
    reference_title: Detection of a Distinct Erythropoietin (EPO) Profile After Isoelectric Focusing in Patients With Familial Erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EPO concentration in blood were in the low to normal range"
    explanation: >-

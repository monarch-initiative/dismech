  description: >-
    A single heterozygous EPO variant is sufficient. The c.32delG exon 2
    deletion cosegregated with erythrocytosis in a family with a logarithm of
    the odds score of 3.3, and the c.-136G>A promoter variant segregated with
    the phenotype across a five-generation kindred, affected members being
    heterozygous and unaffected relatives negative.
  evidence:
  - reference: PMID:29514032
    reference_title: A Gain-of-Function Mutation in EPO in Familial Erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a mutation in EPO that cosegregated with disease with a logarithm of the odds (LOD) score of 3.3 in a family with autosomal dominant erythrocytosis."
    explanation: >-
      Linkage of an EPO variant to erythrocytosis in a family transmitting the
      trait as an autosomal dominant.
  - reference: PMID:41574959
    reference_title: Autosomal Dominant Erythrocytosis Caused by Non-Renal Erythropoietin (EPO) Due to EPO c.-136 G>A Germline Mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We studied nine affected and 13 non-affected relatives from a five-generation kindred with autosomal dominant familial erythrocytosis"
    explanation: >-
      A second, independent EPO-variant family in which the trait is transmitted
      as an autosomal dominant over five generations.
  - reference: PMID:41574959
    reference_title: Autosomal Dominant Erythrocytosis Caused by Non-Renal Erythropoietin (EPO) Due to EPO c.-136 G>A Germline Mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation segregated with the erythrocytosis phenotype in 15 examined family members"
    explanation: >-
      Cosegregation of the heterozygous promoter variant with the phenotype in
      the examined relatives.
genetic:
- name: EPO variants
  gene_term:
    preferred_term: EPO
    term:
      id: hgnc:3415
      label: EPO
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    Heterozygous germline variants in EPO. Two kinds have been reported: single
    nucleotide deletions in exon 2, which act by bringing a normally noncoding
    intron 1 transcript into the erythropoietin reading frame, and noncoding
    variants in the main promoter and in intron 1, which increase transcription
    from hypoxia-responsive regulatory elements. Both act as gain of function
    with respect to erythropoietin output or activity, and in both the lesion
    is extrinsic to the erythroid progenitor.
  notes: >-
    The OMIM designation ECYT5 was created for the exon 2 frameshift family. The
    noncoding promoter and intron 1 variants were reported later and are curated
    here under the same concept because the gene, the mode of transmission and
    the clinical picture are the same; no nosology has formally placed them. See
    the discussion on whether the two routes are one disease entity.
  variants:
  - name: c.32delG
    description: >-
      The sentinel allele. A single G deletion in exon 2 that truncates the
      erythropoietin signal peptide and frameshifts the normally noncoding
      intron 1 transcript into the erythropoietin coding frame.
  - name: c.19delC
    description: >-
      A single C deletion in exon 2, 13 nucleotides upstream of c.32delG,
      reported in a father and daughter and originally of unknown significance.
      Transfected constructs carrying it produced high amounts of biologically
      active erythropoietin, the same mechanism as c.32delG.
  - name: c.-136G>A
    description: >-
      A 5-prime untranslated region promoter variant that increases EPO
      transcription and secretion in CRISPR-edited Hep3B cells and is associated
      with a non-renal circulating erythropoietin glycosylation profile in
      carriers.
  - name: c.-252C>T
    description: >-
      A variant in the main EPO promoter, one of three noncoding variants found
      in families with erythrocytosis and normal-range circulating
      erythropoietin.
  - name: c.14-26A>G
    description: >-
      An intron 1 variant from the same series of noncoding EPO variants.
  - name: c.14-28T>C
    description: >-
      A second intron 1 variant from the same series of noncoding EPO variants.
  evidence:
  - reference: PMID:29514032
    reference_title: A Gain-of-Function Mutation in EPO in Familial Erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation, a single-nucleotide deletion (c.32delG), introduces a frameshift in exon 2 that interrupts translation of the main EPO messenger RNA (mRNA) transcript but initiates excess production of erythropoietin from what is normally a noncoding EPO mRNA transcribed from an alternative promoter located in intron 1."
    explanation: >-
      Identifies the causal exon 2 deletion and states its consequence for
      erythropoietin production.
  - reference: PMID:31350093
    reference_title: "Update on mutations in the HIF: EPO pathway and their role in erythrocytosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Familial erythrocytosis caused by mutations in the EPO gene has now been designated as ECYT5 in the MIM classification"
    explanation: >-
      Establishes that EPO-gene familial erythrocytosis is the concept labeled
      ECYT5, which is the identity of this entry.
  - reference: PMID:31350093
    reference_title: "Update on mutations in the HIF: EPO pathway and their role in erythrocytosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "a father and daughter with a single C nucleotide deletion (ΔC) of unknown significance located in EPO exon 2"
    explanation: >-
      Source for the second exon 2 deletion, c.19delC, and for its report in two
      relatives.
  - reference: PMID:40305710
    reference_title: Identification of Hepatic-like EPO as a Cause of Polycythemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three novel variants were identified in the noncoding regions of EPO."
    explanation: >-
      Source for the noncoding class of EPO variants, found across six
      erythrocytosis families.
  - reference: PMID:41713879
    reference_title: Detection of a Distinct Erythropoietin (EPO) Profile After Isoelectric Focusing in Patients With Familial Erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The only mutations detected were in noncoding parts of the EPO gene"
    explanation: >-
      Names the variant class carried by the patients whose erythropoietin was
      profiled, quoted from this paper's account of the earlier genetic report.
pathophysiology:
- name: EPO Exon 2 Frameshift Deletion
  biological_scale: MOLECULAR
  description: >-
    A heterozygous single-nucleotide deletion in exon 2 of EPO: c.32delG in the
    index family and c.19delC in a second report. The deletion frameshifts the
    canonical transcript, truncating the erythropoietin signal peptide and
    terminating translation after a novel peptide, so the canonical transcript
    no longer yields the hormone.
  genes:
  - preferred_term: EPO
    term:
      id: hgnc:3415
      label: EPO
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: GAIN_OF_FUNCTION
  evidence:
  - reference: PMID:31350093
    reference_title: "Update on mutations in the HIF: EPO pathway and their role in erythrocytosis."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The deletion causes a frameshift that truncates the EPO signal peptide and generates a novel peptide which is terminated after an additional 51 amino acids"
    explanation: >-
      States what the exon 2 deletion does to the canonical erythropoietin
      reading frame.
  downstream:
  - target: Translation of Erythropoietin from the Intron 1 P2 Transcript
    causal_link_type: DIRECT
    description: >-
      The same frameshift that destroys the canonical reading frame brings the
      alternative intron 1 transcript into frame with the erythropoietin coding
      sequence.
    evidence:
    - reference: PMID:29514032
      reference_title: A Gain-of-Function Mutation in EPO in Familial Erythrocytosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "introduces a frameshift in exon 2 that interrupts translation of the main EPO messenger RNA (mRNA) transcript but initiates excess production of erythropoietin from what is normally a noncoding EPO mRNA transcribed from an alternative promoter located in intron 1"
      explanation: >-
        The discovery report attributes the switch to the intron 1 transcript
        directly to the exon 2 frameshift.
- name: EPO Noncoding Regulatory Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous variant in the EPO main promoter (c.-252C>T, c.-136G>A) or in
    intron 1 (c.14-26A>G, c.14-28T>C). The protein sequence is unchanged; the
    variants fall in cis-regulatory elements of the gene.
  genes:
  - preferred_term: EPO
    term:
      id: hgnc:3415
      label: EPO
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: GAIN_OF_FUNCTION
  evidence:
  - reference: PMID:41713879
    reference_title: Detection of a Distinct Erythropoietin (EPO) Profile After Isoelectric Focusing in Patients With Familial Erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "while the amino acid sequence of the protein was not affected, although regulatory elements appeared to be impacted"
    explanation: >-
      States that this variant class leaves the protein sequence intact and acts
      on regulatory elements.
  downstream:
  - target: Increased EPO Transcription from Hypoxia-Responsive Regulatory Elements
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:40305710
      reference_title: Identification of Hepatic-like EPO as a Cause of Polycythemia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Experiments with reporter assays and iPSC-derived hepatocyte-like cells showed that the variants targeted previously uncharacterized regulatory elements of the gene, which, when the variants were present, showed high responsiveness to hypoxia."
      explanation: >-
        Reporter assays and patient-derived hepatocyte-like cells tie the
        noncoding variants to activation of hypoxia-responsive regulatory
        elements.
- name: Translation of Erythropoietin from the Intron 1 P2 Transcript
  biological_scale: MOLECULAR
  description: >-
    EPO carries a second promoter, P2, inside intron 1, whose transcripts are
    normally noncoding. With the exon 2 frameshift the downstream start codon of
    the P2 transcript comes into frame with the erythropoietin coding sequence
    and initiates translation of biologically active hormone, with a shortened
    signal peptide and a novel amino terminus.
  biological_processes:
  - preferred_term: translation of erythropoietin from the alternative P2 transcript
    modifier: INCREASED
    term:
      id: GO:0042446
      label: hormone biosynthetic process
  evidence:
  - reference: PMID:31350093
    reference_title: "Update on mutations in the HIF: EPO pathway and their role in erythrocytosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "In addition to the expected transcripts derived from the canonical promoter P1 upstream of exon 1 they discovered unexpected EPO mRNA transcripts which originate from an alternative promoter (P2) in intron 1"
    explanation: >-
      Establishes the alternative intron 1 promoter transcript that this node is
      about.
  - reference: PMID:31350093
    reference_title: "Update on mutations in the HIF: EPO pathway and their role in erythrocytosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "Cells transfected with ΔG P2 produced more EPO than those transfected with wild-type P1 cDNA and the EPO was biologically active"
    explanation: >-
      Transfection shows the mutant P2 transcript produces more erythropoietin
      than the wild-type canonical transcript, and that it is bioactive.
  - reference: PMID:31350093
    reference_title: "Update on mutations in the HIF: EPO pathway and their role in erythrocytosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "The P2 transcripts with the ΔC mutation produced high amounts of biologically active EPO, demonstrating that the EPO ΔC causes erythrocytosis by the same mechanism as the EPO ΔG mutation"
    explanation: >-
      The second exon 2 deletion acts through the same P2 route, so this node
      covers both alleles.
  downstream:
  - target: Excess Bioactive Circulating Erythropoietin
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29514032
      reference_title: A Gain-of-Function Mutation in EPO in Familial Erythrocytosis.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "initiates excess production of erythropoietin from what is normally a noncoding EPO mRNA"
      explanation: >-
        The discovery report states that the alternative transcript is what
        produces the excess hormone.
- name: Increased EPO Transcription from Hypoxia-Responsive Regulatory Elements
  biological_scale: MOLECULAR
  description: >-
    The noncoding variants raise EPO transcription from cis-regulatory elements
    of the gene. For c.-136G>A, CRISPR-edited hepatoma cells carry more EPO mRNA
    and protein in normoxia with a further rise in hypoxia, and the mutant
    promoter drives more reporter activity. Which transcription factor mediates
    this is unsettled: the variant creates a predicted hypoxia response element,
    but chromatin immunoprecipitation at the native locus did not confirm HIF-1
    or HIF-2 binding.
  biological_processes:
  - preferred_term: EPO transcription from a variant cis-regulatory element
    modifier: INCREASED
    term:
      id: GO:0045944
      label: positive regulation of transcription by RNA polymerase II
  cell_types:
  - preferred_term: hepatocyte-like erythropoietin-producing cell
    term:
      id: CL:0000182
      label: hepatocyte
  evidence:
  - reference: PMID:41574959
    reference_title: Autosomal Dominant Erythrocytosis Caused by Non-Renal Erythropoietin (EPO) Due to EPO c.-136 G>A Germline Mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the mutant promoter increased transcription of EPO mRNA and its translated protein even under normoxia, with further augmentation during hypoxia"
    explanation: >-
      Direct transcriptional gain of function for the promoter variant in an
      edited erythropoietin-producing cell line.
  - reference: PMID:41574959
    reference_title: Autosomal Dominant Erythrocytosis Caused by Non-Renal Erythropoietin (EPO) Due to EPO c.-136 G>A Germline Mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Hypoxia induced a 2.7-fold increase in EPO production in mutant cells compared to wild-type Hep3B cells"
    explanation: >-
      Quantifies the increase in secreted erythropoietin from the edited cells
      under hypoxia.
  - reference: PMID:41574959
    reference_title: Autosomal Dominant Erythrocytosis Caused by Non-Renal Erythropoietin (EPO) Due to EPO c.-136 G>A Germline Mutation.
    supports: REFUTE
    evidence_source: IN_VITRO
    snippet: "However, ChIP experiments failed to confirm direct HIF-2 or HIF-1 binding to the mutated EPO promoter"
    explanation: >-
      Contradicts the simplest reading of this node, that the variant works by
      creating a bound HIF response element.
  downstream:
  - target: Hepatic-Type Erythropoietin Glycosylation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Carriers of these variants have circulating erythropoietin with a
      non-renal glycosylation pattern, read as a shift in the tissue producing
      the hormone. The producing tissue has not been identified directly.
    evidence:
    - reference: PMID:40305710
      reference_title: Identification of Hepatic-like EPO as a Cause of Polycythemia.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "EPO samples from all the patients showed a modified isoelectric-focusing profile, identical to hepatic EPO that is expressed in premature neonates and in patients with acquired erythrocytosis associated with liver diseases."
      explanation: >-
        The hormone circulating in variant carriers carries the hepatic rather
        than the renal glycosylation signature.
  - target: Excess Bioactive Circulating Erythropoietin
    causal_link_type: DIRECT
    description: >-
      In the c.-136G>A family circulating erythropoietin is not frankly high but
      is moderately increased for the degree of erythrocytosis, so this node is
      reached in a quantitatively milder form than by the exon 2 route.
    evidence:
    - reference: PMID:41574959
      reference_title: Autosomal Dominant Erythrocytosis Caused by Non-Renal Erythropoietin (EPO) Due to EPO c.-136 G>A Germline Mutation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "these patients demonstrated moderately increased EPO levels for their elevated HCT but remaining within the normal range"
      explanation: >-
        Erythropoietin is inappropriately normal rather than suppressed, which is
        what a continuing drive from the variant allele predicts.
- name: Hepatic-Type Erythropoietin Glycosylation
  biological_scale: MOLECULAR
  description: >-
    Erythropoietin from carriers of the noncoding variants runs as a more basic
    set of isoforms on isoelectric focusing, matching hepatic rather than renal
    erythropoietin. Which carbohydrate change this reflects is disputed, with
    reduced sialylation and reduced N-glycan sulfation both proposed. The
    profile is stable over years in a given patient.
  evidence:
  - reference: PMID:41713879
    reference_title: Detection of a Distinct Erythropoietin (EPO) Profile After Isoelectric Focusing in Patients With Familial Erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Plasma EPO profile from all the patients showed a basic profile"
    explanation: >-
      Confirms the basic isoform profile in every noncoding-variant patient
      examined by an independent laboratory.
  - reference: PMID:41574959
    reference_title: Autosomal Dominant Erythrocytosis Caused by Non-Renal Erythropoietin (EPO) Due to EPO c.-136 G>A Germline Mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The IEF profile of EPO c.-136 G>A shows a shift in the distribution of EPO isoforms toward the basic region, compared to endogenous EPO from non-affected family members"
    explanation: >-
      The same basic shift in the promoter-variant kindred, against unaffected
      relatives as the internal comparison.
  downstream:
  - target: Increased Erythropoietin Receptor Signaling in Erythroid Progenitors
    causal_link_type: DIRECT
    description: >-
      Erythropoietin purified from patient plasma signals more strongly through
      its receptor than wild-type hormone, which the authors attribute to the
      liver-type glycosylation.
    evidence:
    - reference: PMID:40305710
      reference_title: Identification of Hepatic-like EPO as a Cause of Polycythemia.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "EPO that was purified from patient plasma and umbilical-cord blood samples showed enhanced EPO receptor signaling activity in vitro, which suggests a potential gain of function linked to the liver-type glycosylation of EPO."
      explanation: >-
        Links the altered glycosylation to stronger receptor signaling, the step
        this edge asserts.
- name: Excess Bioactive Circulating Erythropoietin
  biological_scale: ORGANISM
  description: >-
    More biologically active erythropoietin reaching the marrow than the red
    cell mass warrants. The two variant classes differ in how this presents in
    the laboratory: the exon 2 route was described as excess production, while
    in the noncoding families circulating concentrations stay inside the
    reference interval and the excess is one of activity rather than amount.
    What is raised is the hormone's own action: in the noncoding families the
    protein sequence is unchanged, and erythropoietin purified from patient
    plasma signals more strongly through its receptor than wild-type hormone,
    which is a quantitative increase in an otherwise normal activity rather
    than a new one.

- name: Increased Erythropoietin Receptor Signaling in Erythroid Progenitors
  biological_scale: CELLULAR
  description: >-
    Erythropoietin receptor signaling in marrow erythroid progenitors is driven
    above its normal set point. Unlike ECYT1 the receptor itself is intact, so
    the excess sits on the ligand side: hormone from patients, or from cells
    carrying the promoter variant, produces a stronger response in
    erythropoietin-dependent reporter cells than wild-type hormone. No
    progenitor culture from an EPO-variant patient has been reported, so the
    cell type here is the one erythropoietin is known to act on rather than one
    assayed in these families.
  cell_types:
  - preferred_term: erythroid progenitor cell
    term:
      id: CL:0000038
      label: erythroid progenitor cell
  biological_processes:
  - preferred_term: erythropoietin-mediated signaling pathway
    modifier: INCREASED

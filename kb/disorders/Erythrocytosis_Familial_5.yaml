    explanation: >-
      Grounds the molecular function on this node: hormone taken from patients
      acts more strongly on its receptor than wild-type hormone does.
  - reference: PMID:40305710
    reference_title: Identification of Hepatic-like EPO as a Cause of Polycythemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified six families with erythrocytosis that was associated with circulating EPO levels within the normal range"
    explanation: >-

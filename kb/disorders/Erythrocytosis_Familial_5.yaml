    snippet: "Serum erythropoietin (Epo) levels are variably informative."
    explanation: >-
      Current guidance states the limited discriminating value of the measurement
      in JAK2-unmutated erythrocytosis.
- name: Erythropoietin isoelectric focusing profile
  description: >-
    Isoelectric focusing of plasma or urine erythropoietin separates charge
    isoforms. In EPO noncoding-variant carriers the profile shifts to the basic
    region, matching non-renal hormone, and it is stable over years. This is a
    research assay borrowed from antidoping laboratories rather than a routine
    diagnostic test, and those laboratories have shown the pattern does not meet
    current criteria for recombinant erythropoietin, so it should not be read as
    doping.
  diagnosis_term:

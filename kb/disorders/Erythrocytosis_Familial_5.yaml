treatments:
- name: Therapeutic phlebotomy
  description: >-
    Repeated phlebotomy is what the reported EPO-variant patients received, at
    intervals of a few months. It lowers the red cell mass and so relieves
    hyperviscosity symptoms without touching the cause. No trial has been run in
    this disease; the practice follows general guidance for JAK2-unmutated
    erythrocytosis, which also advises against cytoreductive therapy.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: phlebotomy
    term:
      id: NCIT:C28221
      label: Phlebotomy
  target_mechanisms:
  - target: Increased Red Cell Mass
    treatment_effect: INHIBITS
    description: >-
      Phlebotomy removes circulating erythrocytes, so it acts only on the last
      node of the chain and leaves the erythropoietin drive intact.
  evidence:
  - reference: PMID:41713879
    reference_title: Detection of a Distinct Erythropoietin (EPO) Profile After Isoelectric Focusing in Patients With Familial Erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They were treated by repeated phlebotomies every couple of months."
    explanation: >-
      Records the treatment actually given to patients carrying noncoding EPO
      variants.
  - reference: PMID:41123216
    reference_title: "JAK2 Unmutated Erythrocytosis: 2026 Update on Diagnosis and Management."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Cytoreductive therapy should be avoided. Phlebotomy should be considered for symptom control."
    explanation: >-
      Current guidance for JAK2-unmutated erythrocytosis, the class this disease
      falls in.
- name: Low-dose aspirin and cardiovascular risk reduction
  description: >-
    Low-dose aspirin with cardiovascular risk-factor optimization is advised for
    JAK2-unmutated erythrocytosis in general. There is no ECYT5-specific
    evidence, and the thrombotic risk of EPO-variant erythrocytosis has not been
    quantified in a cohort, so this row records inherited guidance rather than a
    result in this disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy

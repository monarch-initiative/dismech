    explanation: >-
      The source of the recommendation, stated for JAK2-unmutated erythrocytosis
      as a class rather than for EPO variants specifically.
animal_models:
- name: tg6 human EPO-overexpressing transgenic mouse
  species: Mouse
  genotype: Transgenic for human EPO under a constitutive, hypoxia-independent promoter (line tg6)
  publication: PMID:16690772
  description: >-
    The tg6 line carries a human EPO transgene expressed independently of
    oxygen tension, so erythropoietin drive is permanently uncoupled from the
    hypoxia signal that normally gates it. That is the same uncoupling the EPO
    variants produce in patients, which is why the model is informative here;
    the model reaches it by a transgene rather than by an EPO allele, and at a
    far higher hematocrit than patients carry. Beyond the red cell mass the
    model also develops hepatic, renal, neuronal and muscular degeneration, a
    reduced lifespan, endothelial activation with reduced brain vessel density,
    and near-loss of the endothelial glycocalyx. None of those is a reported
    feature of human ECYT5 and none is curated as a phenotype of this disease;
    see the HUMAN_MODEL_MISMATCH discussion.
  modeled_mechanisms:
  - target: Excess Bioactive Circulating Erythropoietin
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Constitutive, hypoxia-independent erythropoietin excess, which is the node
      this entry's two variant classes converge on.
    limitations: >-
      The excess is produced by a human EPO transgene rather than by a
      regulatory or coding EPO variant, and plasma erythropoietin is raised
      roughly twelve-fold, far beyond the normal-range or modestly raised
      concentrations reported in patients.
    divergences:
    - divergence_type: CAUSE_UNREPRESENTED
      materiality: QUALIFYING
      description: >-
        The disease lesion is absent. Erythropoietin excess is imposed by a
        transgene, so nothing in the model corresponds to the exon 2 frameshift
        or to the promoter and intron 1 variants, and the model can say nothing
        about how either lesion produces the excess.
    - divergence_type: OTHER
      materiality: QUALIFYING
      description: >-
        The degree is supraphysiological. Plasma erythropoietin is about
        twelve-fold elevated and hematocrit reaches 0.85 to 0.89, where
        reported patients sit between roughly 0.50 and 0.63, so the model
        exaggerates whatever is dose-dependent. The taxonomy has no value for a
        supraphysiological level of an otherwise correctly modelled quantity.
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Murine erythropoiesis and vasculature, carrying a human EPO transgene.
    readouts:
    - name: Plasma erythropoietin concentration
      target: Excess Bioactive Circulating Erythropoietin
      direction: INCREASED
      interpretation: Confirms that the model reproduces circulating hormone excess.
      evidence:
      - reference: PMID:18256329
        reference_title: Abortion in mice with excessive erythrocytosis is due to impaired arteriogenesis of the uterine arcade.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "pregnant human erythropoietin-overexpressing (plasma levels elevated 12-fold) mice (termed tg6 mice) suffering from excessive erythrocytosis generally abort at midgestation unless their hematocrit of 0.85 is drastically lowered"
        explanation: States the measured degree of plasma erythropoietin elevation in the line.
    evidence:
    - reference: PMID:16690772
      reference_title: Excessive erythrocytosis in adult mice overexpressing erythropoietin leads to hepatic, renal, neuronal, and muscular degeneration.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "transgenic mouse line (tg6) that constitutively overexpresses erythropoietin (Epo) in a hypoxia-independent manner, thereby reaching hematocrit levels of up to 0.89"
      explanation: >-
        Establishes the model as hypoxia-independent erythropoietin excess, which
        is what makes it informative for this node.
  - target: Increased Red Cell Mass
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Erythropoietin-driven expansion of the red cell compartment, reached
      through the same hormonal route as in patients.
    limitations: >-
      Hematocrit reaches 0.85 to 0.89, above the range reported in EPO-variant
      patients, so the model's downstream organ and vascular findings cannot be
      read as the expected course of human ECYT5.
    divergences:
    - divergence_type: OTHER
      materiality: INVALIDATING
      description: >-
        The red cell mass is far above the patient range, which is the variable
        the model's own authors tie the organ damage to. Any claim about
        consequences carried from this model to patients is therefore invalid at
        this degree, although the existence of the expansion itself is faithful.
    readouts:
    - name: Hematocrit
      target: Increased Red Cell Mass
      direction: INCREASED
      interpretation: >-
        The direct measure of the node, and the variable the model's organ
        pathology tracks with.
      evidence:
      - reference: PMID:16690772
        reference_title: Excessive erythrocytosis in adult mice overexpressing erythropoietin leads to hepatic, renal, neuronal, and muscular degeneration.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "thereby reaching hematocrit levels of up to 0.89"
        explanation: The measured hematocrit in the line.
    evidence:
    - reference: PMID:16690772
      reference_title: Excessive erythrocytosis in adult mice overexpressing erythropoietin leads to hepatic, renal, neuronal, and muscular degeneration.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Taken together, chronically increased Epo levels inducing excessive erythrocytosis leads to multiple organ degeneration and reduced life expectancy."
      explanation: >-
        The authors' own summary, which attributes the outcome to erythropoietin
        driven excessive erythrocytosis.
  notes: >-
    The line was built to study excessive erythrocytosis generically, and its
    own authors frame it as a model for polycythemia vera, chronic mountain
    sickness and erythropoietin doping rather than for a hereditary EPO
    variant. It is cited here for the hormone-excess and red-cell-mass nodes
    only. No knock-in mouse carrying a patient EPO allele has been reported.
discussions:
- discussion_id: epo_producing_tissue_unidentified
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Increased EPO Transcription from Hypoxia-Responsive Regulatory Elements
  - pathophysiology#Hepatic-Type Erythropoietin Glycosylation
  prompt: >-
    Which tissue produces the excess erythropoietin in carriers of noncoding EPO
    variants, and is the hepatic glycosylation signature evidence of hepatocyte
    origin or only of a non-renal one?
  rationale: >-
    Both reported noncoding series infer the producing tissue from the charge of
    circulating erythropoietin rather than from the tissue itself. The
    glycosylation argument establishes that the hormone is not renal; reading it
    as hepatic is a further step, and a promoter variant could instead switch on
    transcription in several non-renal tissues. The two groups also disagree on
    which carbohydrate change the isoelectric shift reflects, which matters
    because sialylation and sulfation have different consequences for clearance
    and activity. A mouse carrying one of these alleles, or spatial
    transcriptomics on patient tissue, would settle it, and neither exists. The
    one mouse line curated here drives erythropoietin from a transgene, so it
    has nothing to say about which tissue a variant allele switches on.
  evidence:
  - reference: PMID:41574959
    reference_title: Autosomal Dominant Erythrocytosis Caused by Non-Renal Erythropoietin (EPO) Due to EPO c.-136 G>A Germline Mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the direct identification of the EPO producing tissue is currently lacking"
    explanation: >-
      The authors state the gap for their own variant and, in the same passage,
      for the earlier noncoding series.
- discussion_id: two_routes_one_entity
  kind: KNOWLEDGE_GAP
  attaches_to:
  - disease#Familial Erythrocytosis 5
  - pathophysiology#EPO Exon 2 Frameshift Deletion
  - pathophysiology#EPO Noncoding Regulatory Variant
  prompt: >-
    Are the exon 2 frameshift and the noncoding regulatory EPO variants one
    disease, given that one was described as producing excess erythropoietin and
    the other as producing a normal amount of hyperactive erythropoietin?
  rationale: >-
    The OMIM concept ECYT5 was created for the exon 2 frameshift family and the
    noncoding variants arrived later. They share the gene, the dominant
    transmission and the clinical picture, which is why they are curated
    together here, but the lesion differs in kind: a reading-frame rescue of an
    alternative transcript versus activation of a cis-regulatory element. The
    laboratory phenotypes differ too, with circulating hormone described as
    frankly increased in the one account and inside the reference interval in the
    other. If the two diverge on natural history or management they would be
    better carried as subtypes, which is the shape to revisit once more families
    are reported.
  evidence:
  - reference: PMID:29514032
    reference_title: A Gain-of-Function Mutation in EPO in Familial Erythrocytosis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "initiates excess production of erythropoietin from what is normally a noncoding EPO mRNA"
    explanation: >-
      The exon 2 route is described as producing excess hormone.
  - reference: PMID:40305710
    reference_title: Identification of Hepatic-like EPO as a Cause of Polycythemia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "erythrocytosis that was associated with circulating EPO levels within the normal range"
    explanation: >-
      The noncoding route presents with normal circulating concentrations, the
      contrast this gap is about.
- discussion_id: mouse_organ_damage_at_supraphysiological_hematocrit
  kind: HUMAN_MODEL_MISMATCH
  attaches_to:
  - animal_models#Mouse
  - pathophysiology#Increased Red Cell Mass
  prompt: >-
    Does an erythropoietin-driven red cell mass at the hematocrit human
    EPO-variant carriers actually reach cause the organ and endothelial damage
    the tg6 mouse develops, or is that damage a property of the degree the model
    exaggerates?
  rationale: >-
    This is a mismatch rather than an absence, which is why it is typed
    HUMAN_MODEL_MISMATCH rather than KNOWLEDGE_GAP. The model evidence is good
    and it is consistent across four studies: chronic erythropoietin-driven
    erythrocytosis in the tg6 mouse produces hepatic, renal, neuronal and
    muscular degeneration with a reduced lifespan, reduced brain vessel density
    with endothelial activation, and near-abolition of the endothelial
    glycocalyx. What is uncertain is whether any of it transfers. The model runs
    at a hematocrit of 0.85 to 0.89 and the reported patients sit between
    roughly 0.50 and 0.63, and the model's own authors attribute the damage to
    the degree of erythrocytosis rather than to erythropoietin itself, so the
    one variable that would decide the question is the one that does not match.
    The human side is empty rather than negative: no cohort of EPO-variant
    carriers has been followed for vascular or end-organ outcomes, which is also
    why this entry curates no thrombotic or hyperviscosity phenotype. A tg6
    arm held at a patient-range hematocrit, or an outcome study in the known
    kindreds, would resolve it; neither has been reported.
  evidence:
  - reference: PMID:16690772
    reference_title: "Excessive erythrocytosis in adult mice overexpressing erythropoietin leads to hepatic, renal, neuronal, and muscular degeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Taken together, chronically increased Epo levels inducing excessive erythrocytosis leads to multiple organ degeneration and reduced life expectancy."
    explanation: >-
      The model finding whose transfer to human ECYT5 is the open question.
  - reference: PMID:16254128
    reference_title: Chronic excessive erythrocytosis induces endothelial activation and damage in mouse brain.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We propose that chronic excessive erythrocytosis and sustained high hematocrit cause endothelial damage, which may, ultimately, increase susceptibility to vascular disease."
    explanation: >-
      The authors tie the damage to sustained high hematocrit, which is the
      quantity that differs between the model and patients.
  - reference: PMID:21859826
    reference_title: Excessive erythrocytosis compromises the blood-endothelium interface in erythropoietin-overexpressing mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In a transgenic mouse (tg6) model exhibiting systemic Hct levels of about 0.85 the glycocalyx/ESL was nearly abolished."
    explanation: >-
      A third endothelial finding, reported at the model's hematocrit of about
      0.85 rather than at a patient-range value.
- discussion_id: promoter_variant_transcription_factor
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Increased EPO Transcription from Hypoxia-Responsive Regulatory Elements
  prompt: >-
    If the c.-136G>A promoter variant does not work by creating a bound HIF
    response element, which transcription factor mediates its effect?
  rationale: >-
    The variant creates a predicted hypoxia response element and behaves like one
    in reporter assays, where added HIF-2 alpha augments it, yet chromatin
    immunoprecipitation at the native locus did not detect HIF-1 or HIF-2
    binding. The authors cannot exclude a technical failure in this GC-rich
    region, and they offer predicted KLF-family and SOX18 sites as alternatives,
    with only KLF9 enrichment confirmed and no evidence that KLF9 acts on
    erythropoiesis. The node is therefore established at the level of output and
    not of the factor involved.
  evidence:
  - reference: PMID:41574959
    reference_title: Autosomal Dominant Erythrocytosis Caused by Non-Renal Erythropoietin (EPO) Due to EPO c.-136 G>A Germline Mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "However, ChIP experiments failed to confirm direct HIF-2 or HIF-1 binding to the mutated EPO promoter"
    explanation: >-
      The negative binding result that leaves the mediating factor open.
notes: >-
  Lump and split. The entry covers both reported classes of causal EPO variant
  under the single MONDO concept, with the case for splitting recorded as a
  knowledge gap rather than acted on. The noncoding series is described by its
  own authors as a cause of secondary erythrocytosis, which is consistent with
  the lesion being extrinsic to the erythroid progenitor, and is why this entry
  sits beside the oxygen-sensing erythrocytoses rather than beside ECYT1.
  Thrombotic risk is deliberately not curated as a phenotype. Hyperviscosity and
  vascular complications are the expected consequence of a raised red cell mass
  and are mentioned in passing in the sources, but no cohort has reported
  vascular event rates in EPO-variant carriers, so no phenotype row is written
  for them. Headache, pruritus, erythromelalgia and visual disturbance are left
  out for the same reason and a sharper one: the sources that name them are
  describing polycythemia vera or erythrocytosis as a class, not EPO-variant
  carriers, and importing them here would attribute another disease's symptom
  list to this one. The tg6 mouse's organ and endothelial damage is left out
  too; it is recorded against the model, with the transfer question typed as a
  HUMAN_MODEL_MISMATCH discussion.
  No GeneReviews chapter covers EPO-related erythrocytosis. A search of the
  committed Bookshelf index and a live PubMed title search over this entry's
  name, disease term and synonyms return no chapter. The nearest chapter,
  Primary Familial and Congenital Erythrocytosis, is about EPOR; it defines its
  own subject as erythrocytosis in the absence of disorders causing secondary
  erythrocytosis, which excludes this disease, so it is not a baseline here and
  is deliberately not cited. The EPOR entry in this knowledge base carries it.
  Serum erythropoietin in the exon 2 frameshift family is not recorded here: the
  cached record for PMID:29514032 is abstract only and the abstract does not give
  that family's concentrations, so the entry states only what the noncoding
  families' measurements show.

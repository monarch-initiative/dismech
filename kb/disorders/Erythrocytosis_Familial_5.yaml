name: Familial Erythrocytosis 5
creation_date: "2026-10-15T17:00:00Z"
category: Mendelian
categories:
- Disorder of Erythropoietin Production
parents:
- Hereditary Erythrocytosis
- Congenital Secondary Erythrocytosis
synonyms:
- ECYT5
- EPO familial polycythemia
- erythrocytosis, familial, 5
- familial erythrocytosis type 5
- familial polycythemia caused by mutation in EPO
- EPO-related erythrocytosis
description: >-
  Familial erythrocytosis 5 (ECYT5) is an autosomal dominant erythrocytosis
  caused by germline variants in EPO, the gene encoding erythropoietin itself.
  It is the form of hereditary erythrocytosis in which the lesion sits in the
  hormone rather than in its receptor (ECYT1, EPOR) or in the oxygen-sensing
  machinery that controls EPO transcription (VHL, EGLN1 and EPAS1). Two classes
  of EPO variant have been reported and they reach the same endpoint by
  different molecular routes. A single-nucleotide deletion in exon 2 (c.32delG)
  interrupts translation of the canonical EPO transcript but shifts the reading
  frame of a normally noncoding transcript initiated from an alternative
  promoter in intron 1, so that this second transcript starts to produce
  biologically active erythropoietin; a neighboring exon 2 deletion, c.19delC,
  behaves the same way when tested in transfected cells. Separately, noncoding
  variants in the EPO promoter and in intron 1 act on regulatory elements that
  are strongly hypoxia responsive, raising EPO transcription and yielding
  circulating erythropoietin with a hepatic rather than renal glycosylation
  pattern and with increased erythropoietin receptor signaling activity in
  vitro. In both routes the shared downstream path is excess or hyperactive
  erythropoietin acting on EPOR on erythroid progenitors, increased erythroid
  output and a raised red cell mass, presenting as a longstanding isolated
  erythrocytosis with high hematocrit and hemoglobin and, in the kindred where
  this was looked for, without leukocytosis, thrombocytosis or splenomegaly.
  Serum erythropoietin is not a reliable
  discriminator here: in the reported noncoding-variant families it is low to
  normal, or only moderately raised for the degree of erythrocytosis, so a
  concentration that is inappropriately normal rather than frankly elevated is
  what points to the diagnosis. Reported management is repeated phlebotomy;
  current guidance for JAK2-unmutated erythrocytosis in general is phlebotomy
  for symptom control with cytoreductive therapy avoided, alongside low-dose
  aspirin and cardiovascular risk reduction.

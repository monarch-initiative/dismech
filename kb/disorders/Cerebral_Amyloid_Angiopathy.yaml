animal_models:
- name: APPswe/PSEN1dE9 mouse model of vascular amyloid and clearance
  species: Mouse
  genotype: APPswe/PSEN1dE9
  publication: PMID:31810839
  description: >-
    Transgenic mice expressing mutant human APP and PSEN1 develop parenchymal and vascular amyloid. Awake
    two-photon imaging at 8–10 months linked impaired visually evoked vascular reactivity to slower paravascular
    tracer clearance; spontaneous resting vasomotion and resting clearance were relatively preserved at
    that age.
  modeled_mechanisms:
  - target: Impaired cerebrovascular reactivity
    relationship: PARTIALLY_RECAPITULATES
    description: >-
      Evoked vascular responses are impaired during visual stimulation, while the neuronal response to
      the same stimulus is preserved.
    fidelity: MODERATE
    limitations: >-
      A transgenic amyloid-overproduction model with parenchymal plaques differs from typical sporadic
      human CAA. Age and stimulation conditions affect the findings.
    evidence:
    - &id017
      reference: PMID:31810839
      reference_title: Vasomotion as a Driving Force for Paravascular Clearance in the Awake Mouse Brain.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: >-
        In contrast, evoked vascular reactivity recorded over 5 minutes was significantly impaired in
        8–10 months old Tg mice compared to WT, as suggested by the averaged hemodynamic response functions
        to the checkerboard stimulation (Figure 5A), and the quantification of the maximum amplitude of
        the power at 0.05 Hz after Fourier transform (0.043 ± 0.034 1/Hz (n=22 vessels in 5 Tg mice) vs.
        0.13 ± 0.069 1/Hz (n=18 vessels in 9 WT mice), p<0.0001) (Figure 5B).
      explanation: >-
        Shows impaired evoked responses in APP/PS1 mice, with age and stimulation conditions specified.
  - target: Impaired perivascular amyloid-beta clearance
    relationship: MEASURES
    description: >-
      Fluorescent dextran decay near arterioles provides a surrogate of paravascular solute drainage.
    fidelity: LOW
    limitations: >-
      Amyloid-beta clearance was not directly measured. Optical resolution did not resolve intramural
      drainage; focal laser irradiation and tracer delivery can alter local physiology.
    evidence:
    - *id016

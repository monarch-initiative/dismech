name: Cerebral Amyloid Angiopathy
creation_date: "2026-06-03T12:00:00Z"
category: Complex
synonyms:
- CAA
- cerebral beta-amyloid angiopathy
- congophilic angiopathy
- hereditary cerebral hemorrhage with amyloidosis
description: >-
  Cerebral amyloid angiopathy (CAA) is an age-related cerebral small-vessel disease most commonly characterized
  by deposition of amyloid-beta (Abeta) in the walls of cortical and leptomeningeal small arteries, arterioles,
  and capillaries. Progressive vascular amyloid deposition with smooth muscle cell loss and vessel-wall
  fragility predisposes to spontaneous strictly lobar intracerebral hemorrhage (often recurrent), strictly
  lobar cerebral microbleeds, convexity subarachnoid hemorrhage, cortical superficial siderosis, transient
  focal neurological episodes ("amyloid spells"), and progressive cognitive decline. Non-hemorrhagic markers
  include white matter hyperintensities and enlarged centrum semiovale perivascular spaces. The common
  sporadic form increases in prevalence with age and is strongly associated with the APOE genotype (ε4
  increases risk; ε2 is associated with vessel fragility/hemorrhage), while rare hereditary forms are
  caused by mutations in APP (e.g. Dutch-type HCHWA-D, APP p.E693Q) and in non-Abeta genes such as CST3
  (cystatin C / Icelandic-type ACys). A rare iatrogenic form arises from prion-like Abeta "seeding" after
  exposure to cadaveric tissue (dura mater grafts, pituitary-derived growth hormone) decades earlier.
  Diagnosis in life relies on the Boston criteria v2.0 (clinical and MRI markers); definitive diagnosis
  requires histopathology. There is no targeted disease-modifying therapy; management is supportive and
  centered on hemorrhage-risk mitigation.

diagnosis:
- name: Brain MRI with hemorrhage-sensitive sequences
  description: >-
    Clinical investigation of suspected CAA uses brain MRI including T2*-weighted gradient echo or susceptibility-weighted
    imaging, together with sequences that assess white-matter and ischemic lesions.
  evidence:
  - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Patients suspected of CAA should have brain MRI with T2*-weighted sequences sensitive to hemorrhagic
      lesions
    explanation: >-
      Specifies the hemorrhage-sensitive MRI requirement.
- name: Boston criteria v2.0 for probable sporadic CAA
  description: >-
    In a symptomatic person aged at least 50 years, probable CAA requires either at least two strictly
    lobar hemorrhagic lesions in any combination, or one such lesion plus a qualifying white-matter feature:
    severe centrum semiovale perivascular spaces or multispot white-matter hyperintensities. Deep hemorrhagic
    lesions and alternative explanations must be absent. Cerebellar hemorrhages count as neither lobar
    nor deep. These are clinical-radiological criteria, not a genetic or histopathological definition.
  evidence:
  - reference: PMID:40566003
    reference_title: Clinical Management of Cerebral Amyloid Angiopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Age ≥ 50 years • Presentation with spontaneous ICH, TFNEs, or CI/Dementia • ≥2 of the following
      strictly lobar hemorrhagic lesions on T2*-weighted MRI, in any combination: ICH, CMB, cSS/cSAH foci
      OR • 1 lobar hemorrhagic lesion + 1 white matter feature (Severe CSO-PVS or WMH-MS)
    explanation: >-
      Reproduces the age, presentation and alternative imaging combinations for probable CAA.
  - reference: PMID:40566003
    reference_title: Clinical Management of Cerebral Amyloid Angiopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Absence of any deep hemorrhagic lesion
    explanation: >-
      Requires absence of deep hemorrhagic lesions; cerebellar classification is supplied separately by
      the original criteria.
  - reference: PMID:35841910
    reference_title: 'The Boston criteria version 2.0 for cerebral amyloid angiopathy: a multicentre, retrospective, MRI-neuropathology diagnostic accuracy study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Haemorrhagic lesion in cerebellum not counted as either lobar or deep haemorrhagic lesion
    explanation: >-
      Table 2 of the original Boston v2.0 study states the cerebellar counting rule directly.
- name: Boston criteria v2.0 for possible sporadic CAA
  description: >-
    The possible category requires the age and clinical presentation criteria with one strictly lobar
    hemorrhagic lesion or one qualifying white-matter feature, no deep hemorrhagic lesions, and no other
    cause. It conveys lower diagnostic certainty than probable CAA.
  evidence:
  - reference: PMID:40566003
    reference_title: Clinical Management of Cerebral Amyloid Angiopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      1 strictly lobar hemorrhagic lesion on T2*-weighted MRI: ICH, CMB, cSS/cSAH focus OR • 1 white matter
      feature (Severe CSO-PVS or WMH-MS) • Absence of any deep hemorrhagic lesions (ICH, CMB) on T2*-weighted
      MRI
    explanation: >-
      Specifies the lower imaging threshold for possible CAA, not probable CAA.
- name: Population-dependent diagnostic performance
  description: >-
    Boston v2.0 sensitivity is limited in community-based older populations. In the Rush community-based
    study of 134 individuals, including 49 pathology-proven definite cases, sensitivity was 38.8% and
    specificity 83.5%. These estimates must not be generalized to symptomatic hospital cohorts.
  evidence:
  - reference: PMID:38165367
    reference_title: Sensitivity and Specificity of the Boston Criteria Version 2.0 for the Diagnosis of Cerebral Amyloid Angiopathy in a Community-Based Sample.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In total, 134 individuals were included in the study (mean age = 82.4 ± 6.0 years; 69.4% F), and
      49 of them were considered pathology-proven definite cases with CAA
    explanation: >-
      Defines the community-sample denominator and pathology-positive group.
  - reference: PMID:38165367
    reference_title: Sensitivity and Specificity of the Boston Criteria Version 2.0 for the Diagnosis of Cerebral Amyloid Angiopathy in a Community-Based Sample.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The recently released Boston criteria v2.0 offered higher sensitivity (38.8%) and slightly lower
      specificity (83.5%).
    explanation: >-
      Reports performance in this sample, not a universal diagnostic accuracy.
- name: CT-based simplified Edinburgh criteria
  description: >-
    For lobar intracerebral hemorrhage when MRI is not feasible, the simplified Edinburgh criteria provide
    a CT-based alternative. They use hemorrhage morphology and subarachnoid extension; they do not replace
    MRI assessment in all CAA presentations.
  evidence:
  - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      For patients with a lobar ICH and CT only, where MRI is not feasible, the simplified Edinburgh Criteria
      are a reasonable alternative for diagnosis
    explanation: >-
      Scopes the CT alternative to lobar ICH when MRI is unavailable.
- name: Amyloid biomarkers as selected adjuncts
  description: >-
    CSF amyloid-beta measurements and amyloid PET are generally unnecessary for routine CAA diagnosis.
    They may help selected cases in which Boston criteria cannot be applied or competing causes remain.
    Amyloid PET cannot distinguish vascular from parenchymal deposition, and neither PET nor CSF anti-amyloid
    antibodies establishes CAA-related inflammation as a routine validated test.
  evidence:
  - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Amyloid biomarker testing, by CSF or PET, is generally not needed to diagnose CAA. However, amyloid
      biomarker testing could be considered in cases where the Boston criteria cannot be applied (e.g.
      in patients with mixed lobar and deep ICH or patients less than 50 years old with neurosurgical
      history) or when competing causes are possible.
    explanation: >-
      The guideline limits biomarker use to selected diagnostic problems.
  - reference: PMID:40566003
    reference_title: Clinical Management of Cerebral Amyloid Angiopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Unfortunately, it is known that vascular amyloid deposition, a hallmark of CAA, cannot be discriminated
      from the parenchymal amyloid deposition, characteristic of AD, on amyloid-PET [13].
    explanation: >-
      Explains why a positive amyloid PET is not specific for CAA.
  - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The detection of CSF anti-Aβ antibodies in CAA-ri is an important research topic, but testing is
      not validated for routine clinical diagnostic use.
    explanation: >-
      Distinguishes a research antibody marker from a validated clinical test.
- name: Early-onset and familial CAA investigation
  description: >-
    A detailed family history and consideration of genetic testing are indicated for suggestive clinical
    and imaging findings before age 50 or multiple affected first-degree relatives. Prior exposure to
    cadaveric tissue is also relevant to early-onset cases. APOE genotyping is not routinely indicated
    to diagnose CAA or predict hemorrhage risk, except in the specific Edinburgh-criteria or anti-amyloid-immunotherapy
    contexts described in the guideline. APP sequencing and copy-number coverage are important; concomitant
    cognitive symptoms or family dementia history broaden consideration to PSEN1 and PSEN2 and other amyloidoses
    according to phenotype.
  evidence:
  - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      For patients with potential CAA-related clinical and imaging findings who are <50 years of age or
      have multiple affected first-degree family members, a detailed family history should be taken with
      consideration of genetic testing for autosomal dominant mutations that cause CAA.
    explanation: >-
      Defines the clinical context for family history and monogenic testing.
  - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Testing for APOE genotype is not indicated to diagnose CAA or predict CAA-related ICH risk, except
      when applying the Edinburgh criteria or evaluating patients with AD for anti-Aβ immunotherapies
      such as lecanemab or donanemab.
    explanation: >-
      Limits susceptibility-genotype testing; it is not a Mendelian diagnostic assay.
  - reference: PMID:37280119
    reference_title: Clinical considerations in early-onset cerebral amyloid angiopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In people with haemorrhagic markers of CAA but no cognitive symptoms, and no family history of dementia,
      focused initial testing of APP (to include both missense and copy number variants) is likely to
      have the highest yield. In people with cognitive symptoms as well as haemorrhagic CAA, or cases
      where there is a family history, testing of APP (missense mutations and copy number variants), PSEN1
      and PSEN2 is needed.
    explanation: >-
      Specifies the phenotype-dependent testing strategy and inclusion of APP copy-number changes.
- name: CAA-related inflammation investigation
  description: >-
    Suspect CAA-related inflammation with subacute encephalopathy, cognitive change, headache, seizures
    or focal findings and asymmetric corticosubcortical FLAIR lesions, lobar hemorrhagic markers or leptomeningeal
    enhancement. MRI and CSF investigation should exclude competing infectious, autoimmune and neoplastic
    causes. Consider brain biopsy for unresolved diagnostic doubt or failure of first-line immunotherapy.
    Reserve ABRA for pathologically demonstrated angio-destructive vasculitis.
  evidence:
  - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Patients suspected of CAA-ri should have MRI including FLAIR, T2*-weighted imaging (e.g. susceptibility
      sensitive SWI sequences), diffusion- weighted imaging, and contrast-enhanced T1- weighted or FLAIR
      MR imaging.
    explanation: >-
      Specifies multimodal MRI for the inflammatory presentation.
  - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In suspected CAA-ri, CSF testing should be performed to seek evidence of alternative diagnoses including
      other autoimmune or infectious diseases.
    explanation: >-
      Exclusion of alternative causes is part of diagnosis.
  - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If there is diagnostic doubt regarding CAA-ri after detailed non-invasive tests, or a lack of response
      to first-line immunotherapy, then a brain biopsy should be considered after evaluating the risks
      and benefits.
    explanation: >-
      Scopes the indication for tissue confirmation.
  - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The term CAA-related inflammation (CAA-ri) is preferred for all cases, with the terms amyloid- beta
      related angiitis (ABRA) or CAA-related vasculitis reserved (as an additional descriptor) only where
      there is clear pathological evidence of an angio-destructive vasculitis.
    explanation: >-
      Distinguishes the umbrella inflammatory syndrome from histologically confirmed ABRA.
- name: Neuropathological confirmation
  description: >-
    Histopathology demonstrates vascular amyloid and associated vasculopathy. Definite CAA under Boston
    criteria requires full postmortem examination; cortical biopsy or tissue obtained during hematoma
    evacuation can support probable CAA. If evacuation is undertaken, tissue should be submitted for analysis.
  evidence:
  - reference: PMID:40566003
    reference_title: Clinical Management of Cerebral Amyloid Angiopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Full post-mortem examination demonstrating the following: • Presentation with spontaneous ICH, TFNEs,
      cSAH, or CI/Dementia • Severe CAA with vasculopathy • Absence of other diagnostic lesion
    explanation: >-
      Defines the definite pathological category.
  - reference: PMID:40566003
    reference_title: Clinical Management of Cerebral Amyloid Angiopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Clinical data and pathologic tissue (evacuated hematoma or cortical biopsy) demonstrating the following:
      • Presentation with spontaneous ICH, TFNEs, cSAH, or CI/Dementia • Some degree of CAA in specimen
      • Absence of other diagnostic lesion
    explanation: >-
      Distinguishes supporting biopsy/evacuation pathology from the definite autopsy category.
  - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      When hematoma evacuation is performed, obtaining tissue for histopathological analysis
    explanation: >-
      Recommends obtaining tissue during an indicated procedure.
- name: Anti-amyloid immunotherapy safety assessment
  description: >-
    Anti-amyloid monoclonal antibodies should not be used to treat CAA outside research trials. In concomitant
    early Alzheimer disease, assess CAA-related hemorrhagic markers and ARIA risk against treatment-specific
    eligibility recommendations; this entry does not represent them as established CAA therapy.
  evidence:
  - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      CAA appears to be associated with increased risk for adverse effects of anti-Aβ immunotherapy. As
      such, these treatments should not be used for the purpose of treating CAA outside the context of
      a research trial.
    explanation: >-
      The guideline explicitly restricts CAA-directed use to research settings.
experimental_models:
- name: HEK293T cells expressing wild-type or L68Q cystatin C
  description: >-
    Stable engineered HEK293T lines overexpress and secrete wild-type or L68Q cystatin C. Nonreducing
    immunoblots and sucrose gradients detect mutant high-molecular-weight species; NAC, glutathione and
    NAC derivatives reduce aggregate readouts in cell-derived preparations or cultures. This system tests
    aggregation and compound effects, not human cerebral hemorrhage.
  experimental_model_type: CELL_LINE
  cell_source: Engineered immortalized human HEK293T cells
  publication: PMID:33758187
  modeled_mechanisms:
  - target: Cystatin C amyloid aggregation
    relationship: PARTIALLY_RECAPITULATES
    description: >-
      Models secretion and oligomerization of overexpressed mutant cystatin C and permits pharmacological
      perturbation.
    fidelity: MODERATE
    model_scale: MOLECULAR
    limitations: >-
      Nonvascular cells with supraphysiological expression lack cerebral vessel architecture and do not
      establish formation or removal of mature brain amyloid or prevention of stroke.
    evidence:
    - *id013
    - *id014
  evidence:
  - *id013
  - *id014
- name: Astrocyte Csf1-knockdown and endothelial co-culture
  description: >-
    Mouse C8-D1A astrocytes with siRNA-mediated Csf1 knockdown were co-cultured with bEnd.3 brain microvascular
    endothelial cells. Endothelial ZO-1, occludin, VE-cadherin and CD31 expression decreased. This perturbation
    tests a candidate astrocyte-support mechanism for vascular dysfunction suggested by the human transcriptomic
    study; it does not reproduce cerebral amyloid deposition or demonstrate human genetic causation.
  experimental_model_type: CO_CULTURE
  cell_source: Mouse C8-D1A astrocyte and bEnd.3 endothelial cell lines
  publication: PMID:39571157
  modeled_mechanisms:
  - target: Blood-brain barrier leakage
    relationship: PARTIALLY_RECAPITULATES
    description: >-
      Recapitulates reduced expression of endothelial junction-associated proteins, an upstream molecular
      component of barrier dysfunction.
    fidelity: LOW
    model_scale: CELLULAR
    limitations: >-
      The reported readouts are expression markers, not direct barrier permeability, vessel-wall amyloid
      or cerebral hemorrhage. The model does not establish that CSF1 deficiency initiates CAA in humans.
      Human AD and CAA cohorts showed different CSF1-expression patterns.
    evidence:
    - &id015
      reference: PMID:39571157
      reference_title: "Differential Roles of Astrocytic CSF1 in Alzheimer's Disease and Cerebral Amyloid Angiopathy: Insights from Transcriptomic Analysis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        Transcription and protein levels of endothelial tight junction markers, including ZO-1, Occludin,
        VE-Cadherin, and the endothelial cell marker CD31, were significantly downregulated in bEnd.3
        cells co-cultured with C8-D1A-siCSF1 cells (Fig. 5G).
      explanation: >-
        Reports reduced junction-associated marker expression after astrocyte Csf1 knockdown; it is not
        a direct permeability or hemorrhage measurement.
  evidence:
  - reference: PMID:39571157
    reference_title: "Differential Roles of Astrocytic CSF1 in Alzheimer's Disease and Cerebral Amyloid Angiopathy: Insights from Transcriptomic Analysis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Using C8-D1A and bEnd.3 (mouse brain microvascular endothelial cells), we established a co-culture
      to assess how the significant reduction of CSF1 in astrocytes may affect endothelial cell function
      (Fig. 5F).

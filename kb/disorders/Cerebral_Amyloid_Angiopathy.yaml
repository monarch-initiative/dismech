      CAA-ri presents with a variety of clinical manifestations, including cognitive decline as the most
      prevalent, focal neurological deficits, encephalopathy, headache, epileptic seizures and psychiatric
      symptoms [16].
    explanation: >-
      Includes encephalopathy in the inflammatory presentation.

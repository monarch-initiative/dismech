notes: >-
  The entry includes common sporadic amyloid-beta CAA and hereditary vascular amyloidoses with a CAA-predominant
  phenotype. Other neurodegenerative amyloidoses can include vascular amyloid but require their own disease
  context. Boston criteria address sporadic clinical-radiological diagnosis and do not exclude early-onset
  genetic or iatrogenic disease when their age or imaging requirements are unmet. The DZNE PDF is the
  published 2025 International CAA Association/World Stroke Organization statement (PMID:40721902). The
  UCL eprint is the accepted manuscript of Progression of cerebral amyloid angiopathy: a pathophysiological
  framework (PMID:37236210). PSEN1/PSEN2 familial Alzheimer disease, ITM2B familial dementias, gelsolin,
  inherited prion and transthyretin amyloidoses are relevant differential or overlapping diagnoses; their
  systemic and parenchymal manifestations are not generalized to sporadic CAA. The mapped APP subtypes
  are retained even when a cognitive rather than hemorrhagic phenotype predominates, and that distinction
  is stated explicitly.

environmental:
- name: Iatrogenic Abeta exposure
  description: >-
    Medical exposure to Abeta-contaminated cadaveric tissue — cadaveric dura
    mater grafts (e.g. Lyodura), pituitary-derived human growth hormone, and
    neurosurgical instrumentation — can transmit Abeta pathology and cause
    iatrogenic CAA after a latency of decades.
  evidence:
  - reference: PMID:37214406
    reference_title: "Case report of iatrogenic cerebral amyloid angiopathy after exposure to Lyodura: an Australian perspective."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Archived surgical notes confirmed exposure to Lyodura in 1985 and 1986."
    explanation: >-
      Case report documenting Lyodura (cadaveric dura mater) exposure preceding
      biopsy-confirmed iatrogenic CAA.
  - reference: DOI:10.1038/s41591-023-02729-2
    reference_title: Iatrogenic Alzheimer’s disease in recipients of cadaveric pituitary-derived growth hormone
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      We previously reported human transmission of Aβ pathology and CAA in relatively young adults who
      had died of iatrogenic Creutzfeldt–Jakob disease (iCJD) after childhood treatment with cadaver-derived
      pituitary growth hormone (c-hGH) contaminated with both CJD prions and Aβ seeds.
    explanation: >-
      The primary clinical report summarizes earlier transmission evidence from c-hGH recipients with
      iatrogenic CJD. Its new AD-spectrum cases are not all treated as confirmed clinical CAA.
  influences_mechanisms:
  - target: Iatrogenic prion-like Abeta seeding
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Historical contaminated cadaveric-tissue exposure introduces exogenous amyloid-beta seeds.
    evidence:
    - *id003
  exposure_term:
    preferred_term: Iatrogenic exposure to amyloid-beta
    term:
      id: ECTO:9000501
      label: exposure to beta-amyloid
  notes: >-
    ECTO:9000501 binds the beta-amyloid exposure itself; the cadaveric-tissue route and historical medical
    context are specified in the description and evidence.
- name: Hypertension
  description: >-
    Inadequate blood-pressure control is associated with recurrent lobar intracerebral hemorrhage. Blood
    pressure is a modifiable hemorrhagic-risk factor; this does not establish hypertension as the cause
    of vascular amyloid deposition.
  evidence:
  - &id004
    reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Long-term BP control is inadequate in ICH patients, including those with CAA, 62 and is asso- ciated
      with higher risk for ICH recurrence.
    explanation: >-
      The guideline relates inadequate pressure control to recurrence, without asserting that hypertension
      initiates amyloid deposition.
  influences_mechanisms:
  - target: Cerebral vascular hemorrhage
    environmental_effect: EXACERBATES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Poor blood-pressure control increases recurrent hemorrhagic risk in established CAA.
    evidence:
    - *id004
treatments:
- name: Vascular risk factor control (blood pressure management)
  description: >-
    For intracerebral hemorrhage attributed to CAA, the 2025 scientific statement recommends regular blood-pressure
    monitoring and a long-term target at or below 130/80 mmHg to reduce recurrence. Home monitoring can
    support adherence and detection of variability. This is secondary hemorrhage prevention, not an amyloid-clearing
    therapy.
  treatment_term:
    preferred_term: Antihypertensive Therapy
    term:
      id: NCIT:C172184
      label: Antihypertensive Therapy
  evidence:
  - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In patients with ICH attributed to CAA, blood pressure (BP) should be regularly monitored to maintain
      a long-term target of ⩽130/80 mm Hg to reduce risk of ICH recurrence. Home BP monitoring may be
      helpful to empower patients, improve medication adherence, and allow more frequent and accurate
      BP measurements to avoid BP variability.
    explanation: >-
      Directly supports the target, monitoring and recurrence-prevention indication.
- name: Immunosuppressive therapy for CAA-related inflammation
  description: >-
    Early corticosteroid immunosuppression is recommended for diagnosed CAA-related inflammation, followed
    by a gradual oral taper. Clinical and MRI response should be monitored, with blood monitoring and
    prevention of steroid complications as appropriate. Observational evidence supports this approach;
    efficacy is not established by a randomized CAA-ri trial.
  treatment_term:
    preferred_term: immunosuppressive therapy
    term:
      id: NCIT:C15261
      label: Immunosuppressive Therapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  evidence:
  - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Early immunosuppression (as soon as possible after diagnosis) with corticosteroids is recommended
      (e.g. intravenous or oral methylprednisolone 1 g/ day for 5 days, followed by an oral steroid taper,
      typically over 3–6 months.
    explanation: >-
      The guideline recommends initial corticosteroids followed by a taper.
  - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Response to treatment of CAA-ri should be monitored with clinical assessments (neurological and
      cognitive examination), repeat MRI, and blood test monitoring as needed.
    explanation: >-
      Specifies clinical, MRI and laboratory follow-up.
  - reference: PMID:40566003
    reference_title: Clinical Management of Cerebral Amyloid Angiopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Unfortunately, there are no data from randomized-controlled clinical trials investigating therapeutic
      options for CAA-ri. Evidence from observational studies suggest that immunosuppression may be beneficial,
      especially when initiated early [197].
    explanation: >-
      States the observational basis and randomized-trial evidence gap.
  target_mechanisms:
  - target: CAA-related immune inflammation
    treatment_effect: INHIBITS
    description: >-
      Corticosteroids suppress the inflammatory syndrome; this does not establish removal of the underlying
      vascular amyloid.
    evidence:
    - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
      reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Early immunosuppression (as soon as possible after diagnosis) with corticosteroids is recommended
        (e.g. intravenous or oral methylprednisolone 1 g/ day for 5 days, followed by an oral steroid
        taper,
        typically over 3–6 months.
      explanation: >-
        The guideline recommends initial corticosteroids followed by a taper.
- name: Supportive care
  description: >-
    Acute CAA-related lobar hemorrhage follows established intracerebral-hemorrhage management, including
    blood-pressure management, anticoagulant reversal when indicated, supportive care and rehabilitation.
    CAA alone is not a contraindication to indicated hematoma evacuation.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Standard acute ICH management guidelines apply to CAA-related lobar ICH.
    explanation: >-
      Applies standard acute hemorrhage care to CAA.
  - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In patients who are eligible for hematoma evacuation, CAA should not be considered a contraindication.
    explanation: >-
      CAA does not by itself exclude hematoma evacuation.
- name: Genetic counseling
  description: >-
    Offer clinical genetics involvement for a monogenic diagnosis, including counseling for relatives
    who wish to consider predictive or diagnostic testing and reproductive options. Pre-test counseling
    for exome or genome sequencing should address uncertain and secondary findings.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:37280119
    reference_title: Clinical considerations in early-onset cerebral amyloid angiopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of a monogenic form of CAA has implications for the patient but also for their families,
      who may benefit from early involvement of a clinical genetics team. Related individuals should,
      if they wish, be given access to genetic counselling to explore their choices in a variety of areas
      including predictive (pre-symptomatic) or diagnostic genetic testing, and reproductive options such
      as pre-implantation genetic diagnosis.
    explanation: >-
      Directly supports counseling for patients and relatives, predictive testing and reproductive choices.
  - reference: PMID:37280119
    reference_title: Clinical considerations in early-onset cerebral amyloid angiopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      For both whole exome and whole genome approaches, careful pre-test discussions regarding variants
      of uncertain significance and secondary findings (mutations unrelated to the condition being investigated,
      which could have implications for future health) should be included as part of the informed consent
      process.272
    explanation: >-
      Supports informed consent about uncertain variants and secondary findings.
- name: Individualized antithrombotic management
  description: >-
    Balance the established ischemic indication, prior ICH or convexity SAH, imaging markers, bleeding
    risk and patient preferences. Antiplatelets are not recommended solely for primary prevention in probable
    CAA. Antithrombotics can be reasonable for a compelling indication in selected lower-risk patients;
    this is not a blanket prohibition.
  treatment_term:
    preferred_term: Individualized antithrombotic management
  evidence:
  - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In patients with probable CAA, we do not recommend antiplatelet treatment in the absence of prior
      symptomatic ischemic stroke, cardiovascular disease, or peripheral vascular disease (i.e. for primary
      prevention).
    explanation: >-
      Specifies the primary-prevention restriction.
  - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In patients with probable CAA who have not experienced a prior symptomatic ICH or cSAH and are not
      known to have disseminated or multifocal cSS on MRI, antiplatelet or anticoagulation is reasonable
      where there is an established indication for secondary prevention of major ischemic vascular events
      or ischemic stroke prevention
    explanation: >-
      Preserves the qualified secondary-prevention recommendation for patients without the listed high-risk
      hemorrhagic features.
- name: Anticoagulation decisions after CAA-related hemorrhage
  description: >-
    For CAA-related ICH or convexity SAH with high-risk atrial fibrillation, the benefit of resuming anticoagulation
    remains uncertain and avoidance may be considered. If anticoagulation is chosen, the guideline favors
    a direct oral anticoagulant over a vitamin K antagonist. Mechanical valves and other compelling indications
    require separate individualized multidisciplinary assessment.
  treatment_term:
    preferred_term: Anticoagulation decisions after CAA-related hemorrhage
  evidence:
  - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      it is unclear whether anticoagulation should be resumed or avoided. Based on the current evidence,
      anticoagulation may be avoided in this situation. If anticoagulation is considered, a direct oral
      anticoagulant (DOAC) is preferable to a vitamin K antagonist (VKA).
    explanation: >-
      Records uncertainty after hemorrhage and the conditional DOAC preference.
  - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In patients with probable CAA and a mechanical heart valve and additional cardioembolic risk factors
      (such as greater age or prior valve-related stroke), VKAs should be considered because the high
      risk of cardiogenic emboli likely outweighs the risk of ICH.
    explanation: >-
      Preserves the important mechanical-valve exception.
- name: Left atrial appendage closure in selected atrial fibrillation
  description: >-
    May be considered for selected patients with CAA-related ICH and high-risk atrial fibrillation when
    balancing long-term anticoagulation risks. Its net benefit over medical management in this setting
    remains uncertain.
  evidence:
  - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      clinicians might consider left atrial appendage closure, although it is unclear whether left atrial
      appendage closure provides greater net benefit than medical management in this setting.
    explanation: >-
      Provides the weak conditional recommendation and its uncertainty.
  treatment_term:
    preferred_term: Left Atrial Appendage Closure
    term:
      id: NCIT:C157905
      label: Left Atrial Appendage Closure
- name: Symptomatic treatment of distressing recurrent TFNEs
  description: >-
    A short course of an antiseizure drug such as topiramate, lamotrigine or levetiracetam may be considered
    for frequent distressing episodes. The rationale is symptom control; TFNEs are not necessarily seizures
    and randomized trials of this use are lacking.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: topiramate
      term:
        id: CHEBI:63631
        label: topiramate
    - preferred_term: lamotrigine
      term:
        id: CHEBI:6367
        label: lamotrigine
    - preferred_term: levetiracetam
      term:
        id: CHEBI:6437
        label: levetiracetam
  evidence:
  - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      While CAA-related TFNEs are usually self- limited, in patients with multiple attacks causing distress,
      it is reasonable to consider a short course (e.g. 3–6 months) of an antiseizure drug, particularly
      those also effective against migraine (e.g. topiramate, lamotrigine, and levetiracetam).
    explanation: >-
      Scopes treatment to recurrent distressing episodes.
  - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      However, no randomized trials have evaluated antiseizure therapy for TFNEs, and treatment should
      be individualized based on symptom burden.
    explanation: >-
      Limits certainty of treatment benefit.
  target_mechanisms:
  - target: Transient focal neurological episodes
    treatment_effect: MODULATES
    description: >-
      Symptomatic reduction of recurrent distressing episodes, with no randomized efficacy evidence.
    evidence:
    - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
      reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        While CAA-related TFNEs are usually self- limited, in patients with multiple attacks causing distress,
        it is reasonable to consider a short course (e.g. 3–6 months) of an antiseizure drug, particularly
        those also effective against migraine (e.g. topiramate, lamotrigine, and levetiracetam).
      explanation: >-
        Scopes treatment to recurrent distressing episodes.
  notes: >-
    NCIT:C64172 Anticonvulsant Therapy is defined for seizure or convulsion control. Pharmacotherapy with
    explicit agents is retained here because the indication is a non-epileptic transient focal neurological
    syndrome. The listed agents are alternatives, not a combination regimen.
- name: Second-line immunosuppression for refractory CAA-related inflammation
  description: >-
    With a secure diagnosis, consider cyclophosphamide, azathioprine or mycophenolate for inadequate steroid
    response, poor tolerability or relapse. Benefit and toxicity require individualized assessment. Efficacy
    of rituximab, plasma exchange and intravenous immunoglobulin remains uncertain.
  treatment_term:
    preferred_term: Immunosuppressive Therapy
    term:
      id: NCIT:C15261
      label: Immunosuppressive Therapy
    therapeutic_agent:
    - preferred_term: cyclophosphamide
      term:
        id: CHEBI:4027
        label: cyclophosphamide
    - preferred_term: azathioprine
      term:
        id: CHEBI:2948
        label: azathioprine
    - preferred_term: Mycophenolate
      term:
        id: NCIT:C29272
        label: Mycophenolate
  evidence:
  - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If there is a limited response, poor tolerability, or relapse with corticosteroids, and the diagnosis
      is secure, then alternative second-line longer- term immunosuppression should be considered; reasonable
      options include cyclophosphamide, azathioprine, or mycophenolate.
    explanation: >-
      Defines the indication and candidate second-line agents.
  - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The efficacy of monoclonal antibodies (e.g. rituximab), plasma exchange and intravenous immunoglobulin
      in CAA-ri are unknown; further research is required.
    explanation: >-

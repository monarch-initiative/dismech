- name: Investigational ponezumab immunotherapy
  description: >-
    The anti-amyloid-beta 1-40 antibody ponezumab was tested in a phase II randomized placebo-controlled
    trial in 36 adults with probable CAA. It did not meet the prespecified cerebrovascular-reactivity
    efficacy criteria at day 2 or day 90. The day-90 fMRI trend was opposite to the hypothesized benefit,
    but did not establish clinical worsening. One asymptomatic ARIA-E event occurred in the treated group.
    This study does not establish prevention of hemorrhage or cognitive decline, and ponezumab is not
    an established CAA treatment.

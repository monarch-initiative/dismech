genetic:
- name: APOE
  association: Genetic Risk Factor
  relationship_type: RISK_FACTOR
  subtype: Sporadic
  gene_term:
    preferred_term: APOE
    term:
      id: hgnc:613
      label: APOE
  notes: >-
    APOE epsilon4 is associated with greater vascular amyloid burden and CAA severity. Epsilon2 is associated
    with vessel fragility and hemorrhage despite different effects on amyloid aggregation; it should not
    be described as uniformly protective against clinical CAA. APOE is a susceptibility modifier, not
    a Mendelian diagnostic test.
  evidence:
  - reference: PMID:40566003
    reference_title: Clinical Management of Cerebral Amyloid Angiopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Despite that APOE2 has been associated with the inhibition of Aβ oligomers and protofibrils deposition,
      APOE2 is related to increased vascular fragility and bleeding
    explanation: >-
      Separates effects on amyloid deposition from the vascular fragility and bleeding associated with
      epsilon2.
  - reference: PMID:40566003
    reference_title: Clinical Management of Cerebral Amyloid Angiopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Similarly, APOE4 has also been associated with increased risk of sporadic CAA and CAA-related cerebral
      micro- or macrohemorrhages, as well as with increased risk of a more severe CAA pathology [93,95].
    explanation: >-
      Supports epsilon4 as a modifier of CAA risk and severity.
- name: APP
  association: Genetic Mutation
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: APP
    term:
      id: hgnc:620
      label: APP
  inheritance:
  - name: Autosomal dominant
  notes: >-
    Pathogenic APP missense variants within the amyloid-beta coding region include Dutch E693Q, Italian
    E693K, Flemish A692G, Iowa D694N, Piedmont L705V and Arctic E693G, with different hemorrhagic and
    cognitive phenotypes. APP duplications and rare triplications can produce early-onset Alzheimer disease
    with prominent CAA. Copy-number analysis must be included in the diagnostic method; not all sequencing
    panels detect duplications.
  evidence:
  - reference: PMID:37280119
    reference_title: Clinical considerations in early-onset cerebral amyloid angiopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      There are six mutations with confirmed pathogenicity (Fig. 3) and several of uncertain pathogenicity,
      described in detail below.
    explanation: >-
      Defines the established variant group, with identities supported individually in the subtype section.
  - reference: PMID:37280119
    reference_title: Clinical considerations in early-onset cerebral amyloid angiopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      APP duplications are associated with early onset Alzheimer’s disease and prominent CAA,5,112-118
      with ICH described in approximately one-third of cases.119
    explanation: >-
      Identifies a copy-number mechanism and its mixed clinical context.
  - reference: PMID:37280119
    reference_title: Clinical considerations in early-onset cerebral amyloid angiopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      More recently, two related cases of APP triplication have been described,126 both of whom presented
      with early onset dementia; in one of these cases, seizures and recurrent ICH developed during the
      disease course.
    explanation: >-
      Supports the rare triplication observation without assuming a broad prevalence.
  - reference: PMID:37280119
    reference_title: Clinical considerations in early-onset cerebral amyloid angiopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In cases where gene panel testing is requested, it is important to ensure that the method allows
      duplications (and other copy number variants) to be identified, as this is not universally the case.
    explanation: >-
      Directly supports explicit copy-number coverage in genetic testing.
- name: CST3
  association: Genetic Mutation
  relationship_type: CAUSATIVE

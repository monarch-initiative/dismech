- phase: Dutch-type symptomatic hemorrhagic disease
  subtype: Dutch-type
  age_range: Mean first lobar ICH at approximately 54 years
  notes: >-
    The cited Dutch-type cohorts have annual recurrence greater than 20% after the first ICH. This is
    a cohort summary, not a prediction for an individual carrier.
  evidence:
  - reference: url:https://discovery.ucl.ac.uk/id/eprint/10173198/1/Werring_Pathophysiological%20framework%20for%20CAA%20-%20FINAL.pdf
    reference_title: https://discovery.ucl.ac.uk/id/eprint/10173198/1/Werring_Pathophysiological%20framework%20for%20CAA%20-%20FINAL.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      First lobar ICH in D-CAA mutation carriers occurs at a mean age of approximately 54 with annual
      recurrence of greater than 20%.13
    explanation: >-
      Gives the Dutch-type mean onset and annual recurrence, scoped to mutation carriers.
- phase: Recurrent CAA-related lobar hemorrhage
  notes: >-
    The review summarizes annual lobar-ICH recurrence at approximately 7.4% in CAA-related lobar ICH cohorts.
    This post-hemorrhage recurrence estimate is distinct from incidence of a first hemorrhage in an asymptomatic
    carrier.
  evidence:
  - reference: url:https://discovery.ucl.ac.uk/id/eprint/10173198/1/Werring_Pathophysiological%20framework%20for%20CAA%20-%20FINAL.pdf
    reference_title: https://discovery.ucl.ac.uk/id/eprint/10173198/1/Werring_Pathophysiological%20framework%20for%20CAA%20-%20FINAL.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      CAA-related lobar ICH carries high morbidity and mortality3 and recurs at an annual incidence of
      approximately 7.4%,4 higher than almost any other identified stroke subtype.
    explanation: >-
      Reports a recurrence estimate among patients already affected by CAA-related lobar ICH.
biochemical:
- name: CSF amyloid-beta 40
  presence: Decreased
  subtype: Dutch-type
  context: CSF in presymptomatic and symptomatic Dutch-type CAA
  notes: >-
    Reduced CSF concentrations are an early group-level biomarker in Dutch-type carriers, reported from
    the mid-20s. The precise onset is undetermined and these observations do not establish a stand-alone
    clinical diagnostic cutoff.
  evidence:
  - reference: url:https://discovery.ucl.ac.uk/id/eprint/10173198/1/Werring_Pathophysiological%20framework%20for%20CAA%20-%20FINAL.pdf
    reference_title: https://discovery.ucl.ac.uk/id/eprint/10173198/1/Werring_Pathophysiological%20framework%20for%20CAA%20-%20FINAL.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Abnormally low concentrations of A42 and A40 have been consistently reported in sporadic CAA26
      and in both the presymptomatic and symptomatic stages of D-CAA.20,23,27
    explanation: >-
      The framework reports reductions of both CSF amyloid-beta species in presymptomatic and symptomatic
      Dutch-type CAA.
  - reference: url:https://discovery.ucl.ac.uk/id/eprint/10173198/1/Werring_Pathophysiological%20framework%20for%20CAA%20-%20FINAL.pdf
    reference_title: https://discovery.ucl.ac.uk/id/eprint/10173198/1/Werring_Pathophysiological%20framework%20for%20CAA%20-%20FINAL.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Decreases in both A species are detectable in D-CAA mutation carriers in their mid-20s, close to
      30 years prior to the average age of symptomatic ICH in this population, and then further decrease
      as the carriers move closer to the age of ICH (Fig. 1). Indeed no study to date has reported an
      age at which CSF A concentrations are normal in mutation carriers, precluding a determination of
      the precise age at which CSF A reductions begin.
    explanation: >-
      The observed mid-20s reductions precede mean first ICH, but no normal baseline age has been established.

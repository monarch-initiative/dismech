    The agents are alternative second-line choices; the list does not assert simultaneous combination
    treatment.
- name: Medication and lifestyle risk review
  description: >-
    The guideline advises avoiding regular long-term NSAID use, avoiding excessive alcohol, and smoking
    cessation. Decisions on statins and SSRIs remain individualized because CAA-specific benefit-risk
    evidence is uncertain; significant depression and established cardiovascular indications remain relevant.
  treatment_term:
    preferred_term: Medication and lifestyle risk review
  evidence:
  - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Regular long-term use of non-steroidal anti- inflammatory drugs (NSAIDs) in patients with CAA should
      be avoided because of increased ICH risk.
    explanation: >-
      Supports the specific NSAID precaution.
  - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    supports: SUPPORT

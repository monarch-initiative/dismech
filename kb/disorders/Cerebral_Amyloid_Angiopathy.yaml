      snippet: >-
        These results provide evidence, from an independent biochemical method, that NAC is capable of
        breaking HMW complexes of L68Q-hCC into smaller or less-dense species.
      explanation: >-
        Sucrose-gradient analysis supports disruption of cystatin C aggregates in vitro.
    - reference: PMID:33758187

- name: CAA-related inflammation
  description: >-
    Inflammatory complication of amyloid-beta CAA with perivascular inflammatory infiltrates or pathologically
    demonstrated angio-destructive amyloid-beta-related angiitis (ABRA). Presentation may include subacute
    cognitive change, encephalopathy, headache, seizures and asymmetric white-matter lesions. ABRA is
    a histological descriptor within this inflammatory spectrum.
  evidence:
  - reference: url:https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    reference_title: https://pub.dzne.de/record/281348/files/DZNE-2025-01095.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The term CAA-related inflammation (CAA-ri) is preferred for all cases, with the terms amyloid- beta
      related angiitis (ABRA) or CAA-related vasculitis reserved (as an additional descriptor) only where
      there is clear pathological evidence of an angio-destructive vasculitis.
    explanation: >-
      The guideline specifies the inflammatory umbrella term and reserves ABRA for destructive vasculitis.
  - reference: PMID:40566003
    reference_title: Clinical Management of Cerebral Amyloid Angiopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      CAA-ri presents with a variety of clinical manifestations, including cognitive decline as the most
      prevalent, focal neurological deficits, encephalopathy, headache, epileptic seizures and psychiatric
      symptoms [16].
    explanation: >-
      Summarizes the inflammatory clinical presentation.
pathophysiology:
- name: Impaired perivascular amyloid-beta clearance
  description: >-
    Impaired drainage of soluble amyloid-beta along perivascular pathways is a proposed contributor to
    its vascular accumulation. Vascular dysfunction may further reduce clearance, creating a feedback
    loop; the initiating factors in sporadic CAA remain incompletely understood.
  biological_processes:
  - preferred_term: amyloid-beta clearance
    term:
      id: GO:0097242
      label: amyloid-beta clearance
    modifier: DECREASED
  downstream:
  - target: Vascular amyloid-beta deposition
    description: >-
      Reduced perivascular removal can favor vascular amyloid-beta accumulation; the precise initiation
      of sporadic deposits remains uncertain.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:40566003
      reference_title: Clinical Management of Cerebral Amyloid Angiopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Key-role in the evolution of CAA plays the impairment of the perivascular drainage system, leading
        to an aging brain due to a progressively increasing Aβ entrapment and deposition in the walls
        of small arteries [17,20].
      explanation: >-
        The review describes failed perivascular drainage as a proposed contributor to vascular amyloid
        deposition.
  - target: Enlarged centrum semiovale perivascular spaces
    description: >-
      CAA-related impaired perivascular fluid drainage is a proposed explanation for enlarged centrum
      semiovale perivascular spaces; the spatial association does not prove causation.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: url:https://discovery.ucl.ac.uk/id/eprint/10173198/1/Werring_Pathophysiological%20framework%20for%20CAA%20-%20FINAL.pdf
      reference_title: https://discovery.ucl.ac.uk/id/eprint/10173198/1/Werring_Pathophysiological%20framework%20for%20CAA%20-%20FINAL.pdf
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "The observed proximity of enlarged CSO-PVS to overlying CAA in individual arterioles63 raises the intriguing possibility that perivascular space enlargement may be a direct result of CAA- related impairment in perivascular fluid clearance."
      explanation: >-
        The framework explicitly proposes this link as a possibility.
  evidence:
  - reference: PMID:40566003
    reference_title: Clinical Management of Cerebral Amyloid Angiopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Key-role in the evolution of CAA plays the impairment of the perivascular drainage system, leading
      to an aging brain due to a progressively increasing Aβ entrapment and deposition in the walls of
      small arteries [17,20].
    explanation: >-
      The review describes failed perivascular drainage as a proposed contributor to vascular amyloid
      deposition.
- name: Vascular amyloid-beta deposition
  description: >-
    Amyloid-beta accumulates in cortical and leptomeningeal vessel walls, principally arterioles and less
    often capillaries and venules. This is deposition of an APP-derived peptide, not necessarily increased
    peptide synthesis; substantial overproduction is not established for sporadic or Dutch-type disease.
  genes:
  - preferred_term: APP
    term:
      id: hgnc:620
      label: APP
  cell_types:
  - preferred_term: smooth muscle cell of the brain vasculature
    term:
      id: CL:0002590
      label: smooth muscle cell of the brain vasculature
  downstream:
  - target: Cerebral vascular smooth muscle cell degeneration
    description: >-
      Amyloid deposition is associated with loss of vascular smooth muscle cells; tissue studies and experimental
      models support this step.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:36267331
      reference_title: Blood-brain barrier leakage and perivascular inflammation in cerebral amyloid angiopathy.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT

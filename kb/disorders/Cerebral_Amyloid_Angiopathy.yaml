- name: Investigational tramiprosate therapy
  description: >-
    Tramiprosate was evaluated in a 12-week phase II study of 24 adults with possible or probable CAA
    and prior lobar hemorrhage. Participants were randomized among three oral doses. The study assessed
    safety, tolerability and pharmacokinetics; nausea and vomiting were more frequent at higher doses,
    and nine participants developed symptomatic or asymptomatic hemorrhages. It did not establish prevention
    of hemorrhage or cognitive decline and does not support routine CAA treatment.
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Investigational tramiprosate therapy
    term:

- name: Investigational N-acetylcysteine for cystatin C amyloid angiopathy
  description: >-
    Oral N-acetylcysteine (NAC) has been investigated in ACys/HCCAA, not established as a disease-modifying
    treatment. An open-label phase IIa study enrolled 17 CST3 L68Q carriers and administered 2400 mg daily
    for nine months. Plasma high-molecular-weight cystatin C and several skin fibrosis/cell-activation
    biomarkers decreased, but the reduction in skin cystatin C staining was not statistically significant
    (P=0.27). Five participants had cerebral bleeds during treatment. The small uncontrolled study, prior
    NAC use by nine participants and subjective biomarker scoring limit inference; prevention of hemorrhage,
    dementia or death and benefit in amyloid-beta CAA remain unproven.

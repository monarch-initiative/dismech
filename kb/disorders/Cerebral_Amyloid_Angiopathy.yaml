epidemiology:
- name: CAA-attributed fraction of spontaneous intracerebral hemorrhage
  description: >-
    Approximately 12% of spontaneous ICH cases are attributed to sporadic CAA in the cited review. This
    is a fraction among ICH cases, not general-population CAA prevalence.
  minimum_value: 12
  maximum_value: 12
  unit: percent of spontaneous ICH cases
  evidence:
  - reference: PMID:40566003
    reference_title: Clinical Management of Cerebral Amyloid Angiopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Sporadic CAA represents one of the most common forms of cerebral small vessel disease and is a major
      cause of non-traumatic lobar intracerebral hemorrhage (ICH), accounting for 12% of cases with spontaneous
      ICH cases [2,4].
    explanation: >-
      The denominator is spontaneous ICH cases; the approximate causal fraction is distinct from age-stratified
      autopsy prevalence.
progression:
- phase: Initial vascular amyloid deposition
  notes: >-
    Stage 1 of the proposed amyloid-beta CAA framework. The overall sequence is proposed to evolve over
    two to three decades, drawing heavily on Dutch-type biomarker data. Stages may overlap and timings
    are not fixed for individual patients or validated across all CAA forms; the framework does not apply
    to CST3-related ACys.
  evidence:
  - &id019
    reference: PMID:37236210
    reference_title: 'Progression of cerebral amyloid angiopathy: a pathophysiological framework.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Key stages that appear to evolve sequentially over two to three decades are (stage one) initial
      vascular amyloid deposition, (stage two) alteration of cerebrovascular physiology, (stage three)
      non-haemorrhagic brain injury, and (stage four) appearance of haemorrhagic brain lesions.
    explanation: >-
      The authors propose four sequential stages over two to three decades; this is a framework rather
      than a validated fixed trajectory for every patient.
  - &id020
    reference: url:https://discovery.ucl.ac.uk/id/eprint/10173198/1/Werring_Pathophysiological%20framework%20for%20CAA%20-%20FINAL.pdf
    reference_title: https://discovery.ucl.ac.uk/id/eprint/10173198/1/Werring_Pathophysiological%20framework%20for%20CAA%20-%20FINAL.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A second notable limitation is that findings from D-CAA may not be fully generalizable to the more
      common condition of sporadic CAA. D-CAA appears to have more aggressive progression of its haemorrhagic
      stage,13 potentially foreshortening the period of non-haemorrhagic brain injury, as well as a relative
      paucity of AD pathology.14
    explanation: >-
      The authors explicitly limit extrapolation of the Dutch-type timeline to sporadic CAA.
- phase: Alteration of cerebrovascular physiology
  notes: >-

treatments:
- name: Antiseizure Medication
  description: >-
    Symptomatic seizure control with multiple antiseizure medications
    (levetiracetam most often, valproate, topiramate, and ACTH in one infant
    with spasms) is the main treatment and is usually unsuccessful.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: anticonvulsant therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
  target_mechanisms:
  - target: Seizure
    treatment_effect: MODULATES
    description: Symptomatic; does not address the GPI anchoring defect.
  evidence:
  - reference: PMID:37035392
    reference_title: "Identification of a novel splicing variant in the phosphatidylinositol glycan class S (PIGS) gene that is associated with early onset epilepsy, severe developmental delay, and ventricular septal defect: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common antiseizure medication was levetiracetam, which was administered in 9 cases, while valproate or topiramate were administered in 5 cases."
    explanation: Antiseizure medications used across published patients.
  - reference: PMID:37035392
    reference_title: "Identification of a novel splicing variant in the phosphatidylinositol glycan class S (PIGS) gene that is associated with early onset epilepsy, severe developmental delay, and ventricular septal defect: a case report."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The epilepsy in 10 cases was refractory, and 2 cases achieved partial control."
    explanation: Refutes adequate seizure control with standard medication in most patients.
- name: Pyridoxine Supplementation
  description: >-
    Five published patients have received pyridoxine. Seizures decreased in
    the founding proband and in patient 1 of the 2021 series, the 2023
    patient became seizure-free, patient 6 of the 2021 series improved
    developmentally (both 2021 patients also received folinic acid), and the
    outcome was not reported for the fifth. These are uncontrolled
    single-patient observations; cerebrospinal fluid pyridoxal 5'-phosphate
    could not be measured in the 2021 series, and the 2023 authors state it
    is unclear whether PIGS-related epilepsy is pyridoxine-responsive.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: pyridoxine
      term:
        id: CHEBI:16709
        label: pyridoxine
  target_mechanisms:
  - target: Seizure
    treatment_effect: MODULATES
    description: Seizure reduction in three uncontrolled single-patient reports; mechanism in PIGS deficiency not established.
  evidence:
  - reference: PMID:30269814
    reference_title: "Mutations in PIGS, Encoding a GPI Transamidase, Cause a Neurological Syndrome Ranging from Fetal Akinesia to Epileptic Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is noteworthy that pyridoxine hydrochloride improved the seizures in one of the affected probands."
    explanation: Seizure improvement with pyridoxine in a founding patient.
  - reference: PMID:33410539
    reference_title: "Expanding the phenotype of PIGS-associated early onset epileptic developmental encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although seizure management with AEDs is challenging, Patients 1 and 6 improved with pyridoxine (15 mg/kg/day) and folinic acid (1 mg/kg/day)."
    explanation: >-
      Improvement in two patients on pyridoxine plus folinic acid; the paper
      reports reduced seizure frequency in one and better developmental
      progress in the other.
  - reference: PMID:37035392
    reference_title: "Identification of a novel splicing variant in the phosphatidylinositol glycan class S (PIGS) gene that is associated with early onset epilepsy, severe developmental delay, and ventricular septal defect: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "After administration of daily oral pyridoxine (7 mg/kg/day), the patient was more active and gradually became seizure-free."
    explanation: Seizure freedom on pyridoxine in the 2023 patient.
  - reference: PMID:37035392
    reference_title: "Identification of a novel splicing variant in the phosphatidylinositol glycan class S (PIGS) gene that is associated with early onset epilepsy, severe developmental delay, and ventricular septal defect: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, it remains unclear whether PIGS associated epilepsy can be considered as a pyridoxine-responsive epilepsy. There have been 5 reported PIGS cases who received vitamin B6 therapy."
    explanation: Five treated patients in total, and the authors' caution that a true pyridoxine-responsive epilepsy is not established.
- name: Folinic Acid Supplementation
  description: >-
    Given together with pyridoxine to two patients of the 2021 series who
    improved; the separate contribution of folinic acid is unknown.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: folinic acid
      term:
        id: CHEBI:15640
        label: 5-formyltetrahydrofolic acid
  evidence:
  - reference: PMID:33410539
    reference_title: "Expanding the phenotype of PIGS-associated early onset epileptic developmental encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although seizure management with AEDs is challenging, Patients 1 and 6 improved with pyridoxine (15 mg/kg/day) and folinic acid (1 mg/kg/day)."
    explanation: Documents folinic acid given with pyridoxine to two patients who improved; the combination does not isolate folinic acid's own effect.
experimental_models:
- name: Pigs-knockout mouse F9 cells
  experimental_model_type: CELL_LINE
  description: >-
    Mouse F9 teratocarcinoma cells in which Pigs was disrupted by homologous
    recombination, used to establish that PIG-S is a GPI transamidase subunit
    required for attaching the anchor to protein.
  publication: PMID:11483512
  organism:
    preferred_term: mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  modeled_mechanisms:
  - target: Impaired GPI Anchor Attachment to Precursor Proteins
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Complete loss of Pigs abolishes transfer of GPI to proteins at the carbonyl-intermediate step.
    limitations: >-
      A complete knockout in a mouse cell line; patient alleles are
      hypomorphic, and the system does not report neural or developmental
      consequences.
    readouts:
    - name: Transfer of GPI to proteins
      target: Impaired GPI Anchor Attachment to Precursor Proteins
      direction: DECREASED
      interpretation: Knockout cells fail to transfer GPI to proteins, particularly at carbonyl-intermediate formation.
      evidence:
      - reference: PMID:11483512
        reference_title: "PIG-S and PIG-T, essential for GPI anchor attachment to proteins, form a complex with GAA1 and GPI8."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "PIG-S and PIG-T knockout cells were defective in transfer of GPI to proteins, particularly in formation of the carbonyl intermediates."
        explanation: Measured defect in GPI transfer in Pigs-knockout F9 cells.
    evidence:
    - reference: PMID:11483512
      reference_title: "PIG-S and PIG-T, essential for GPI anchor attachment to proteins, form a complex with GAA1 and GPI8."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "To determine roles for PIG-S and PIG-T, we disrupted these genes in mouse F9 cells by homologous recombination."
      explanation: Establishes the knockout cell system used to study the anchor-attachment step.
- name: PIGS-knockout HEK293 cells expressing patient PIGS alleles
  experimental_model_type: CELL_LINE
  description: >-
    CRISPR-Cas9 PIGS-knockout HEK293 cells transfected with wild-type or
    patient-variant PIGS under promoters of different strength, used to
    measure how far each allele restores cell-surface GPI-anchored proteins.
  publication: PMID:30269814
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  modeled_mechanisms:
  - target: Reduced Cell-Surface GPI-Anchored Proteins
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Rescue assay grading the residual activity of founding-family alleles by surface GPI-anchored protein expression.
    limitations: >-
      Overexpression from transfected constructs in a kidney-derived cell line;
      expression differs from the endogenous gene, and the assay reports
      surface protein only.
    readouts:
    - name: Cell-surface GPI-anchored proteins after p.Trp36* rescue
      target: Reduced Cell-Surface GPI-Anchored Proteins
      direction: DECREASED
      interpretation: The p.Trp36* allele restores surface GPI-anchored proteins only partly compared with wild-type PIGS.
      evidence:
      - reference: PMID:30269814
        reference_title: "Mutations in PIGS, Encoding a GPI Transamidase, Cause a Neurological Syndrome Ranging from Fetal Akinesia to Epileptic Encephalopathy."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Expression of the p.Trp36∗ variant in PIGS-deficient HEK293 cells revealed only partial restoration of cell-surface GPI-APs."
        explanation: Partial rescue by a founding-family allele.
    evidence:
    - reference: PMID:30269814
      reference_title: "Mutations in PIGS, Encoding a GPI Transamidase, Cause a Neurological Syndrome Ranging from Fetal Akinesia to Epileptic Encephalopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "To study the role of each mutation found in individuals 1a and 1b, we established PIGS-knockout HEK293 cells with the CRISPR-Cas9 system and transfected them with wild-type or mutant pME-FLAG hPIGS (a strong SRαpromoter), pTK-FLAG hPIGS (a weaker, thymidine kinase promoter), or pTA-FLAG hPIGS (a weak TATA-box-only promoter)."
      explanation: Describes the knockout-and-rescue system used to grade patient alleles.
animal_models:
- name: Drosophila PIG-S loss-of-function mutant
  species: Fruit fly (Drosophila melanogaster)
  genotype: PIG-S knockout or knockdown
  description: >-
    Knockout or knockdown mutants for each fly transamidase subunit were used
    to test subunit protein stability; loss of PIG-S reduced the stability of
    PIG-K and left the other subunits unaffected.
  publication: PMID:30914202
  modeled_mechanisms:
  - target: Impaired GPI Anchor Attachment to Precursor Proteins
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: MOLECULAR
    description: Captures destabilization of the catalytic subunit PIG-K when PIG-S is lost.
    limitations: >-
      The cached abstract reports subunit protein stability only, not GPI
      anchoring or any organismal phenotype, and the model uses fly
      orthologues rather than patient alleles.
    readouts:
    - name: PIG-K protein stability
      target: Impaired GPI Anchor Attachment to Precursor Proteins
      direction: DECREASED
      interpretation: Loss of PIG-S lowers PIG-K stability; the other subunits are unaffected.
      evidence:
      - reference: PMID:30914202
        reference_title: "Stability of the transamidase complex catalyzing GPI anchoring of proteins."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        directness: INDIRECT
        snippet: "By contrast, loss of PIG-S reduced the stability of PIG-K and left the other subunits unaffected."
        explanation: PIG-K destabilization in PIG-S mutant flies; relevance to human alleles is inferred.
    evidence:
    - reference: PMID:30914202
      reference_title: "Stability of the transamidase complex catalyzing GPI anchoring of proteins."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Herein, we analyzed the stability of TAC in knockout and/or knockdown mutants for each subunit."
      explanation: Describes the fly loss-of-function mutants used.

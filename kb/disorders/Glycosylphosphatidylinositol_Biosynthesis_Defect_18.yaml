progression:
- phase: Early childhood mortality
  age_range: Infancy to early childhood
  notes: >-
    Four of six patients in the 2021 series died, at about 1 to 2 years, of
    neurological complications including recurrent respiratory infections, and
    the 2020 patient died at 15 months of asphyxia during a seizure.
    Mortality is recorded here rather than as a phenotype because HP:0003819
    "Death in childhood" lies under Clinical modifier, outside the phenotypic
    abnormality branch the phenotype slot accepts.
  evidence:
  - reference: PMID:33410539
    reference_title: "Expanding the phenotype of PIGS-associated early onset epileptic developmental encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

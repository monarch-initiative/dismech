- name: Impaired Neural GPI-Anchored Protein Function
  biological_scale: CELLULAR
  description: >-
    Many GPI-anchored proteins act in synaptic function, central nervous
    system development and plasticity. Their reduction is the proposed route to
    the developmental encephalopathy, but no study has attributed any feature
    of PIGS deficiency to a particular GPI-anchored protein.

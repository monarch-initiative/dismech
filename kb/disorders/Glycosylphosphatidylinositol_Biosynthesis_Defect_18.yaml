diagnosis:
- name: Flow cytometry for GPI-anchored protein surface expression
  description: >-
    Reduced CD16 and FLAER on granulocytes are the most consistent findings;
    CD55 and CD59 may be normal. A reduced profile supports the pathogenicity
    of PIGS variants found by sequencing but is shared with other inherited
    GPI deficiencies.
  diagnosis_term:
    preferred_term: flow cytometry
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  evidence:
  - reference: PMID:33410539
    reference_title: "Expanding the phenotype of PIGS-associated early onset epileptic developmental encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There was no decrease for CD55 and CD59 in granulocytes, but these are less sensitive markers of inherited GPI deficiency."
    explanation: Shows CD55 and CD59 can be normal.
  - reference: PMID:30269814
    reference_title: "Mutations in PIGS, Encoding a GPI Transamidase, Cause a Neurological Syndrome Ranging from Fetal Akinesia to Epileptic Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Laboratory findings that can help distinguish PIGS-associated disorders from other Mendelian disorders include flow-cytometry analysis with reduced CD16 expression (with or without reduced CD55 expression), a lack of elevated serum tissue-nonspecific alkaline phosphatase (observed to be elevated in a number of other IGDs but normal in others), a lack of 2-oxoglutaric aciduria (occasionally seen with TBC1D24 mutations), and normal serum transferrin isoelectric focusing (abnormal with several CDGs)."
    explanation: Supporting laboratory profile proposed by the founding authors.

mechanistic_hypotheses:
- hypothesis_group_id: canonical_gpi_transamidase_deficiency_model
  hypothesis_label: Canonical GPI Transamidase Deficiency Model
  status: CANONICAL
  description: >-
    Biallelic loss-of-function PIGS variants lower GPI transamidase activity,
    so fewer proteins receive a GPI anchor and the surface density of the
    GPI-anchored protein class falls. Because that class is important in
    neural development, the result is a developmental and epileptic
    encephalopathy with brain atrophy. Supported by reduced GPI-anchored
    proteins on patient blood cells and amniocytes and by incomplete rescue
    with a patient allele in PIGS-knockout cells.
discussions:
- discussion_id: pigs_no_animal_model
  kind: KNOWLEDGE_GAP
  prompt: >-
    How does partial loss of PIGS produce progressive cerebellar and
    frontotemporal atrophy, given that no animal model carrying patient PIGS
    variants has been described?
  attaches_to:
  - pathophysiology#Progressive Brain Atrophy
  rationale: >-
    The founding authors proposed knocking human PIGS variants into mice
    because complete loss of GPI-anchored proteins is often lethal in knockout
    mice. The brain mechanism currently rests on patient imaging.
- discussion_id: pigs_pyridoxine_response
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why do seizures in some PIGS patients respond to pyridoxine, and does
    PIGS-related epilepsy count as a pyridoxine-responsive epilepsy?
  attaches_to:
  - pathophysiology#Impaired Neural GPI-Anchored Protein Function
  rationale: >-
    Seizures decreased with pyridoxine in three patients across three reports,
    but cerebrospinal fluid pyridoxal 5'-phosphate could not be measured in
    the 2021 series and the 2023 report states it is unclear whether the
    epilepsy is truly pyridoxine-responsive.

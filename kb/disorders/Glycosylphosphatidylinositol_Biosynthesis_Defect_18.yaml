- name: Progressive Brain Atrophy
  biological_scale: TISSUE
  description: >-
    Cerebellar atrophy (including early superior vermian atrophy) and cerebral
    atrophy that is worst in the frontal and anterior temporal lobes, with
    pontine hypoplasia in some patients. In one boy MRI was unremarkable at 5
    months and showed mild cerebellar atrophy at 13 months, so a normal early
    scan does not exclude the diagnosis. Frontal atrophy produced bilateral
    subdural hygromas in one patient.

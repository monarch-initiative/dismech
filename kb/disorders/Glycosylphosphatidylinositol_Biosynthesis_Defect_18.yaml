    reference_title: "Expanding the phenotype of PIGS-associated early onset epileptic developmental encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "all subjects showed EEG recording indicative of a severe developmental epileptic encephalopathy, that is, pseudohypsarrhythmia with runs of high amplitude and slow waves predominant over posterior regions associated with multifocal epileptic abnormalities within a diffusely slowed high amplitude during wakefulness and sleep or within a burst‐suppression pattern."
    explanation: EEG findings across the 2021 series.
  - reference: PMID:37035392
    reference_title: "Identification of a novel splicing variant in the phosphatidylinositol glycan class S (PIGS) gene that is associated with early onset epilepsy, severe developmental delay, and ventricular septal defect: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although the types and frequencies of the seizures were progressive, his EEG initially showed no seizure activity."
    explanation: An early EEG may be normal.
- name: Brain MRI
  description: >-
    Cerebellar (vermian) atrophy, frontotemporal-predominant cerebral atrophy
    and pontine hypoplasia; one patient of the 2021 series also had reduced
    cerebral white matter volume with corpus callosum hypoplasia. Atrophy may
    appear after a normal first scan.
  diagnosis_term:
    preferred_term: brain magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:33410539
    reference_title: "Expanding the phenotype of PIGS-associated early onset epileptic developmental encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All of the individuals in this cohort had abnormal findings on brain magnetic resonance imaging, including atrophy of the frontal and anterior temporal lobes, with or without generalized brain atrophy."
    explanation: MRI abnormal in every patient of the 2021 series.
- name: Exome or genome sequencing
  description: >-
    All published patients were diagnosed by exome or genome sequencing. The
    phenotype is not specific among inherited GPI deficiencies, and PIGS was
    absent from most epilepsy gene panels when the 2021 series was published.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing

- name: Serum alkaline phosphatase
  presence: Usually normal
  notes: >-
    Normal in the founding patients and in the 2023 patient; normal in one and
    mildly raised (445 U/L) in one of two tested in the 2021 series. A 2024
    multi-gene cohort found abnormal values in two of three PIGS patients, so
    the value is not a reliable discriminator.
  evidence:
  - reference: PMID:33410539

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present a study of six individuals from three unrelated families in which WES or WGS identified bi-allelic phosphatidylinositol glycan class S (PIGS) biosynthesis mutations."
    explanation: Diagnostic method used in the founding cohort.
  - reference: PMID:33410539
    reference_title: "Expanding the phenotype of PIGS-associated early onset epileptic developmental encephalopathy."

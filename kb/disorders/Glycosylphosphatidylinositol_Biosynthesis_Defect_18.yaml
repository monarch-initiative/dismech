    snippet: "In our cohort, only one of two tested patients showed mildly elevated alkaline phosphatase levels, supporting the evidence that increased alkaline phosphatase levels are not observed in all GPI deficiencies."
    explanation: Alkaline phosphatase results in the 2021 series.

name: Glycosylphosphatidylinositol Biosynthesis Defect 18
creation_date: "2026-10-19T12:00:00Z"
category: Mendelian
synonyms:
- GPIBD18
- developmental and epileptic encephalopathy 95
- DEE95
- PIGS deficiency
- PIGS-related disorder
disease_term:
  preferred_term: glycosylphosphatidylinositol biosynthesis defect 18
  term:
    id: MONDO:0029140
    label: glycosylphosphatidylinositol biosynthesis defect 18
parents:
- Disorder of GPI Anchor Biosynthesis
- Congenital Disorder of Glycosylation
- Inborn Error of Metabolism
- Epilepsy
description: >-
  Glycosylphosphatidylinositol biosynthesis defect 18 (GPIBD18, also
  developmental and epileptic encephalopathy 95) is an autosomal recessive
  inherited GPI deficiency caused by biallelic variants in PIGS. PIGS is one of
  the five subunits of the GPI transamidase complex (PIGK, GPAA1, PIGS, PIGT,
  PIGU), which in the endoplasmic reticulum replaces the C-terminal GPI
  attachment signal of precursor proteins with the preassembled GPI anchor;
  loss of any one subunit abolishes the activity. Patient granulocytes,
  lymphocytes and amniocytes show reduced cell-surface GPI-anchored proteins,
  with CD16 and FLAER the most sensitive markers. The disorder is a severe
  developmental and epileptic encephalopathy: profound global developmental
  delay with absent speech, hypotonia, intractable epilepsy beginning in the
  first year of life, microcephaly, cerebellar and cerebral (frontotemporal
  predominant) atrophy, visual and hearing impairment and coarse facial
  features, with early death from neurological or respiratory complications in
  several patients. At the severe end, two fetuses had multiple joint
  contractures consistent with fetal akinesia. Seizures improved with
  pyridoxine in a few patients. Serum alkaline phosphatase is usually normal.
  About fourteen individuals from ten families have been published in four
  reports.
notes: >-
  Case counts, not cohort frequencies. Nguyen et al. 2018 (PMID:30269814)
  reported six individuals from three families, two of them terminated fetuses;
  Zhang et al. 2020 (PMID:32612635) one Chinese boy; Efthymiou et al. 2021
  (PMID:33410539) six individuals from five families; and a 2023 case report
  (PMID:37035392) one Chinese boy and a summary table of fourteen published
  individuals. A 2024 multi-gene inherited GPI deficiency cohort
  (PMID:38456468) includes three PIGS individuals whose overlap with the
  earlier reports is not stated in the cached text, so they are not added to
  the count. Frequencies are therefore given only where a series states them,
  and fractions are over very small denominators.

  Gene-disease validity is copied from the ClinGen record filed against
  MONDO:0029140 itself (Definitive, Congenital Disorders of Glycosylation GCEP,
  2025), not assigned here.

  No GeneReviews chapter covers PIGS or the inherited GPI deficiencies as a
  group.
classifications:
  icimd_category:
  - classification_value: lipid_glycosylation
    notes: >-
      ICIMD (Ferreira et al. 2021, PMID:33340416) group "Disorders of lipid
      glycosylation", which the classification scopes to include
      glycosylphosphatidylinositol biosynthesis. PIGS acts at the transamidase
      step that attaches the completed anchor to protein.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Affected individuals are homozygous or compound heterozygous for PIGS
    variants, with parents heterozygous carriers. Parental consanguinity was
    reported in four of the five families of the 2021 series, all homozygous.
  evidence:
  - reference: PMID:30269814
    reference_title: "Mutations in PIGS, Encoding a GPI Transamidase, Cause a Neurological Syndrome Ranging from Fetal Akinesia to Epileptic Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe a recessive genetic GPI biosynthesis disorder caused by bi-allelic PIGS mutations that result in loss of function and decreased GPI-AP expression on flow cytometry."
    explanation: States recessive inheritance of biallelic PIGS variants.
  - reference: PMID:33410539
    reference_title: "Expanding the phenotype of PIGS-associated early onset epileptic developmental encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Parental consanguinity was reported in four of the five families, all of whom had homozygous variants in PIGS."
    explanation: Homozygosity in consanguineous families is consistent with recessive inheritance.
  - reference: CGGV:assertion_38cb0b29-5a46-44c4-a92b-67d69e3347c4-2025-06-06T160000.000Z
    reference_title: "PIGS / glycosylphosphatidylinositol biosynthesis defect 18 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "PIGS | HGNC:14937 | glycosylphosphatidylinositol biosynthesis defect 18 | MONDO:0029140 | AR | Definitive"
    explanation: ClinGen records autosomal recessive inheritance for this gene-disease pair.
prevalence:
- population: Worldwide, published cases
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Fourteen individuals (twelve liveborn, two terminated fetuses) from ten
    families in four reports to 2023. The 2021 authors note that PIGS was not
    on most clinical epilepsy panels and suggest the disorder may be
    under-recognized.
  evidence:
  - reference: PMID:37035392
    reference_title: "Identification of a novel splicing variant in the phosphatidylinositol glycan class S (PIGS) gene that is associated with early onset epilepsy, severe developmental delay, and ventricular septal defect: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, 14 cases with PIGS variants have been reported (Table 1), but two cases were terminated during pregnancy."
    explanation: Published case count including the 2023 report.
  - reference: PMID:33410539
    reference_title: "Expanding the phenotype of PIGS-associated early onset epileptic developmental encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Finally, PIGS is not found on most clinically utilized epilepsy gene panels, suggesting that it may be a more frequent cause of early infantile epilepsy than reported."
    explanation: Authors' suggestion that the case count underestimates the true frequency.
pathophysiology:
- name: Biallelic PIGS Loss-of-Function Variants
  biological_scale: MOLECULAR
  description: >-
    Germline biallelic PIGS variants. The published alleles are missense,
    nonsense, in-frame indel or duplication, and splice variants (including a
    canonical splice-donor allele and exonic and intronic alleles shown by RNA
    studies to cause exon skipping). In the founding family the p.Trp36*
    allele lowered PIGS mRNA and protein, and downstream methionines produced
    truncated isoforms with some residual activity. PIGS is not the catalytic
    subunit, so the activity lost is that of the whole transamidase complex.
  molecular_functions:
  - preferred_term: GPI-anchor transamidase activity
    modifier: DECREASED
    term:
      id: GO:0003923
      label: GPI-anchor transamidase activity
  genes:
  - preferred_term: PIGS
    term:
      id: hgnc:14937
      label: PIGS
    modifier: DECREASED
  genetic_context:
    description: >-
      Germline biallelic PIGS alleles; both homozygous and compound
      heterozygous patients are reported, so zygosity is left unset.
    allelic_events:
    - MISSENSE_VARIANT
    - NONSENSE_VARIANT
    - SPLICE_SITE_VARIANT
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  downstream:
  - target: Impaired GPI Anchor Attachment to Precursor Proteins
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11483512
      reference_title: "PIG-S and PIG-T, essential for GPI anchor attachment to proteins, form a complex with GAA1 and GPI8."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "PIG-S and PIG-T knockout cells were defective in transfer of GPI to proteins, particularly in formation of the carbonyl intermediates."
      explanation: Knocking out Pigs in mouse F9 cells blocks transfer of GPI to proteins.
    - reference: PMID:34576938
      reference_title: "Functional Analysis of the GPI Transamidase Complex by Screening for Amino Acid Mutations in Each Subunit."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "GPI-TA consists of five subunits: PIGK, GPAA1, PIGT, PIGS, and PIGU, and the absence of any subunit leads to the loss of activity."
      explanation: Losing PIGS removes transamidase activity.
    - reference: PMID:30914202
      reference_title: "Stability of the transamidase complex catalyzing GPI anchoring of proteins."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      directness: INDIRECT
      snippet: "By contrast, loss of PIG-S reduced the stability of PIG-K and left the other subunits unaffected."
      explanation: >-
        In Drosophila, loss of PIG-S destabilizes PIG-K, the catalytic subunit.
        This is a fly result, so how it applies to human patient alleles is
        inferred.
  evidence:
  - reference: PMID:30269814
    reference_title: "Mutations in PIGS, Encoding a GPI Transamidase, Cause a Neurological Syndrome Ranging from Fetal Akinesia to Epileptic Encephalopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present a study of six individuals from three unrelated families in which WES or WGS identified bi-allelic phosphatidylinositol glycan class S (PIGS) biosynthesis mutations."
    explanation: Founding report establishing biallelic PIGS variants as the cause.
  - reference: PMID:30269814
    reference_title: "Mutations in PIGS, Encoding a GPI Transamidase, Cause a Neurological Syndrome Ranging from Fetal Akinesia to Epileptic Encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The results indicated a decrease in PIGS expression of up to 50% in qPCR and a significant decrease in protein levels in western blotting"
    explanation: Patient lymphoblastoid cells carrying the p.Trp36* allele have reduced PIGS mRNA and protein.
  - reference: PMID:30269814
    reference_title: "Mutations in PIGS, Encoding a GPI Transamidase, Cause a Neurological Syndrome Ranging from Fetal Akinesia to Epileptic Encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This indicates that the PIGS proteins that start from the downstream methionines have some residual activities."
    explanation: The founding nonsense allele is hypomorphic rather than null.
  - reference: PMID:33410539
    reference_title: "Expanding the phenotype of PIGS-associated early onset epileptic developmental encephalopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The amplicon with the homozygous c.174G>C variant revealed only exon 3 (369 bp), indicating a skipping of exon 2"
    explanation: An exonic variant first read as missense causes exon 2 skipping, a frameshifting loss-of-function effect.
  - reference: PMID:37035392
    reference_title: "Identification of a novel splicing variant in the phosphatidylinositol glycan class S (PIGS) gene that is associated with early onset epilepsy, severe developmental delay, and ventricular septal defect: a case report."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "It is a novel splicing variant which leads to the skipping of exon 10 in the PIGS gene."
    explanation: An intronic variant causes exon 10 skipping in patient RNA.
- name: Impaired GPI Anchor Attachment to Precursor Proteins
  biological_scale: MOLECULAR
  description: >-
    The GPI transamidase in the endoplasmic reticulum cleaves the C-terminal
    GPI attachment signal of precursor proteins, forms a carbonyl intermediate
    with the substrate, and transfers the preassembled GPI to the new C
    terminus. PIGK carries the catalytic triad; PIGS and PIGT are required for
    formation of the carbonyl intermediate. Without PIGS the anchor is still
    synthesized but is not transferred to protein; in Drosophila, loss of PIG-S
    destabilizes PIG-K.
  biological_processes:
  - preferred_term: attachment of GPI anchor to protein
    term:
      id: GO:0016255
      label: attachment of GPI anchor to protein
    modifier: DECREASED
  protein_complexes:
  - preferred_term: GPI-anchor transamidase complex
    term:
      id: GO:0042765
      label: GPI-anchor transamidase complex
  downstream:
  - target: Reduced Cell-Surface GPI-Anchored Proteins
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30269814
      reference_title: "Mutations in PIGS, Encoding a GPI Transamidase, Cause a Neurological Syndrome Ranging from Fetal Akinesia to Epileptic Encephalopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We conclude that insufficient amounts of PIGS and/or defective PIGS function in individual cells leads to reduced amounts of GPI-AP at the cell surface."
      explanation: Links defective PIGS function to reduced surface GPI-anchored proteins.
  evidence:
  - reference: PMID:11483512
    reference_title: "PIG-S and PIG-T, essential for GPI anchor attachment to proteins, form a complex with GAA1 and GPI8."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We also demonstrate that PIG-S and PIG-T form a protein complex with GAA1 and GPI8, and that PIG-T maintains the complex by stabilizing the expression of GAA1 and GPI8."
    explanation: Establishes PIGS as a component of the GPI transamidase complex.
  - reference: PMID:11483512
    reference_title: "PIG-S and PIG-T, essential for GPI anchor attachment to proteins, form a complex with GAA1 and GPI8."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Therefore, PIG-S and PIG-T are not required for GPI synthesis."
    explanation: The anchor itself is still made without PIGS; the defect is in attaching it to protein.
  - reference: PMID:35165458
    reference_title: "Structure of human glycosylphosphatidylinositol transamidase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The PIGK subunit functions as the catalytic component, in which we identified a C206-H164-N58 triad that is critical for the transamination reaction."
    explanation: Identifies PIGK, not PIGS, as the catalytic subunit of the complex.
  - reference: PMID:30269814
    reference_title: "Mutations in PIGS, Encoding a GPI Transamidase, Cause a Neurological Syndrome Ranging from Fetal Akinesia to Epileptic Encephalopathy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: "This disorder results from the failure of the GPI transamidase complex, which includes PIGS,45 to transfer the GPI anchor to the precursor protein bearing a GPI-attachment signal sequence."
    explanation: Authors' statement of the mechanistic step that fails in the disorder.
- name: Reduced Cell-Surface GPI-Anchored Proteins
  biological_scale: CELLULAR
  description: >-
    Precursor proteins that are not anchored do not reach the cell surface as
    GPI-anchored proteins. Patient granulocytes showed reduced CD16 in all
    tested individuals and reduced FLAER; CD55 and CD59 were reduced in some
    patients and normal in others. Amniocytes from an affected fetus showed
    reduced signal for every GPI-anchored marker tested, the lowest being CD24
    at 85% below control. In PIGS-knockout HEK293 cells the founding
    p.Trp36* allele only partly restored surface GPI-anchored proteins. With
    over 150 GPI-anchored proteins, no single one has been shown to account for
    any clinical feature.
  cell_types:
  - preferred_term: granulocyte
    term:
      id: CL:0000094
      label: granulocyte
  - preferred_term: lymphocyte
    term:
      id: CL:0000542
      label: lymphocyte
  downstream:
  - target: Impaired Neural GPI-Anchored Protein Function
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Fetal akinesia sequence
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30269814
      reference_title: "Mutations in PIGS, Encoding a GPI Transamidase, Cause a Neurological Syndrome Ranging from Fetal Akinesia to Epileptic Encephalopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The low signals seen for all GPI-AP markers in individual 3b amniocytes correlates with the severe phenotypes caused by the mutations found in individuals 3a and 3b."
      explanation: >-
        The fetuses with the most severe (prenatal) phenotype had the deepest
        GPI-anchored protein deficit. This is a correlation in one family, not
        a demonstrated mechanism.

- name: Disturbed Development of Non-Neural Tissues
  biological_scale: TISSUE
  description: >-
    Craniofacial, distal limb, renal, cardiac and lymphatic anomalies seen in
    some patients and in the two fetuses. They are attributed to GPI-anchored
    protein deficiency during embryonic development by analogy with other
    inherited GPI deficiencies; no tissue-level mechanism has been studied
    for PIGS, and most anomalies are reported in one or a few individuals.

  notes: >-
    CAUSATIVE follows ClinGen's Definitive classification for this exact
    MONDO term. The ClinGen curation scored eleven variants in nine probands
    from three publications. PIGS encodes a non-catalytic subunit of the GPI
    transamidase (PIGK, GPAA1, PIGS, PIGT, PIGU); defects in the other subunits
    cause related inherited GPI deficiencies with overlapping neurological
    phenotypes.

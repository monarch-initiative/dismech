name: Cardiofacioneurodevelopmental Syndrome
creation_date: '2026-08-01T00:00:00Z'
category: Mendelian
synonyms:
- CFNDS
- cardio-facio-neuro-developmental syndrome
- CCDC32-related cardiofacioneurodevelopmental syndrome
- C15orf57-related multiple congenital anomaly syndrome
description: >-
  Cardiofacioneurodevelopmental syndrome (CFNDS) is an ultra-rare autosomal
  recessive multiple congenital anomaly syndrome caused by biallelic
  loss-of-function variants in CCDC32 (formerly C15orf57). Its recurring core is
  developmental delay together with bilateral cleft lip and palate, on a
  background of variable craniofacial, cardiac, laterality, brain, digital and
  growth anomalies. Reported brain findings include hypoplasia of the corpus
  callosum, cerebellar hypoplasia and microcephaly. CCDC32 encodes a small
  185-amino-acid coiled-coil protein that acts as an assembly chaperone for the
  AP-2 clathrin adaptor complex, the principal cargo adaptor of
  clathrin-mediated endocytosis; the disease alleles reported to date truncate
  the protein before the alpha-helix required for AP-2 binding. A parallel
  ciliary arm of the pathomechanism was proposed in the original report, in
  which zebrafish ccdc32 depletion recapitulated the human phenotypes and
  impaired ciliogenesis. Which of these two arms, or what combination of them,
  accounts for the human malformations is not yet settled. Fewer than ten
  affected individuals have been reported worldwide.
disease_term:
  preferred_term: cardiofacioneurodevelopmental syndrome
  term:
    id: MONDO:0030873
    label: cardiofacioneurodevelopmental syndrome
parents:
- Multiple congenital anomaly syndrome
- Orofacial clefting syndrome
- Mendelian neurodevelopmental disorder
- Disorder of clathrin-mediated endocytosis
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    evidence:
    - reference: PMID:32307552
      reference_title: Loss of function mutations in CCDC32 cause a congenital syndrome
        characterized by craniofacial, cardiac and neurodevelopmental anomalies.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Using whole exome sequencing, we identified homozygous frameshift CCDC32
        variants in three affected individuals.
      explanation: >-
        A monogenic recessive malformation syndrome defined and diagnosed by
        exome sequencing belongs to the genetics chapter.
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:41639596
      reference_title: Two siblings with CCDC32-related cardiofacioneurodevelopmental
        syndrome diagnosed by clinical RNA-sequencing and review of literature.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: the clinical phenotype can include microcephaly, facial malformations,
        developmental delay, cerebellar hypoplasia, and cardiac anomalies
      explanation: >-
        Developmental delay, microcephaly and cerebellar hypoplasia place the
        entity in the neurology chapter alongside its malformation features.
  - classification_value: CARDIOVASCULAR
    evidence:
    - reference: PMID:32307552
      reference_title: Loss of function mutations in CCDC32 cause a congenital syndrome
        characterized by craniofacial, cardiac and neurodevelopmental anomalies.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: we investigated the genetic and mechanistic cause of disease in two
        independent consanguineous families affected by overlapping craniofacial,
        cardiac, laterality and neurodevelopmental anomalies
      explanation: >-
        Congenital cardiac and laterality anomalies are part of the defining
        phenotype, so the entry also belongs to the cardiovascular chapter.
notes: >-
  Scope, naming, evidence and provenance notes for this entry.


  (1) NAMED-ENTITY CONFUSION RISK - READ THIS FIRST. "Cardiofacioneurodevelopmental
  syndrome" (CFNDS, MONDO:0030873, OMIM:619123, CCDC32/HGNC:28295) is one letter
  group away from "cardiofaciocutaneous syndrome" (CFC, MONDO:0015280,
  OMIMPS:115150, a RASopathy caused by BRAF, MAP2K1, MAP2K2 and KRAS), which is
  already curated in this repository as `Cardiofaciocutaneous_Syndrome`. The two
  are unrelated in gene, mechanism and management, and both abbreviate to a
  four-letter acronym beginning "CF". Before this entry was written the MONDO
  record was pulled directly (`runoak -i sqlite:obo:mondo info MONDO:0030873 -O
  obo`) and returned `relationship: RO:0004003 HGNC:28295 ! CCDC32` and `xref:
  OMIM:619123`, and `runoak relationships HGNC:28295` returned MONDO:0030873 as
  the only disease linked to CCDC32. Every clinical PMID cited here
  (PMID:32307552, PMID:35451546, PMID:38818818, PMID:41639596) names CCDC32 in
  its title or abstract, and PMID:41639596 states the OMIM number explicitly as
  MIM:619123. No RASopathy gene appears anywhere in this entry except in the
  differential-diagnosis block, where CFC is recorded precisely so that the
  confusion is documented rather than latent.


  (2) HOW THE DEEP-RESEARCH RUN WAS AND WAS NOT USED. `just research-disorder
  claude_code Cardiofacioneurodevelopmental_Syndrome` was run and its output is
  committed at
  `research/Cardiofacioneurodevelopmental_Syndrome-deep-research-claude_code.md`.
  The NEC preflight on that report passed: a case-insensitive gene-mention count
  over the report body returns 123 hits for CCDC32 plus its old symbol C15orf57
  against 3 genuine hits for BRAF, 2 for MAP2K1, 2 for KRAS and 1 for MAP2K2, all
  of which occur inside a differential-diagnosis row for cardiofaciocutaneous
  syndrome. (A naive grep for "braf" also matches 19 occurrences of the substring
  inside "zebrafish" - the raw count is misleading and was inspected in context.)
  The report asserts OMIM:619123 ten times and mentions 115150 once, again only
  in the cardiofaciocutaneous row. Dominant gene and OMIM therefore both match
  MONDO:0030873, so the report is NOT NEC-suspect. Despite that, the entry was
  drafted from primary literature before the report finished, and the report was
  used only (a) as a cross-check on coverage, (b) as the source of the leads in
  notes (10) and (11), each of which was then independently re-verified against
  the primary source named there, and (c) for nothing else. No PMID, snippet or
  ontology identifier in this entry was taken from the report on trust; every one
  was fetched with `just fetch-reference` and checked against the cached body, or
  resolved with `runoak`.


  (3) NO GENEREVIEWS CHAPTER EXISTS FOR THIS DISEASE. PubMed searches run on
  2026-08-01 for "CCDC32[All Fields] AND GeneReviews[All Fields]" and
  "cardiofacioneurodevelopmental syndrome GeneReviews[All Fields]" each returned
  zero records. The mandatory GeneReviews phenotype baseline therefore does not
  apply. NOTE that one GeneReviews chapter IS cited in this entry, PMID:20301365,
  but it is the chapter for cardiofaciocutaneous syndrome and is used ONLY inside
  the differential-diagnosis block; it is not a source for any CFNDS claim. It
  carries a `GeneReviews` tag in the top-level `references:` block because it is
  genuinely a GeneReviews article, which is what that tag records - the tag must
  not be read as meaning that CFNDS has a chapter. The phenotype baseline
  actually used is the 2026 literature review in PMID:41639596, the phenotype
  synthesis in PMID:35451546, and the HPO annotation set described in note (10).


  (4) NO FREQUENCY BANDS ARE ASSERTED ANYWHERE IN THIS ENTRY, AND THAT IS
  DELIBERATE. The total published denominator is fewer than ten individuals.
  PMID:41639596 states that before its own report CFNDS "has only been described
  in four living individuals and one terminated fetus from four families", and
  adds two siblings, which resolves to six living individuals plus one fetus from
  five families. Every per-feature count available is therefore a fraction of a
  single-digit denominator drawn from four separate case reports with
  non-uniform ascertainment and non-uniform investigation (not every patient had
  brain MRI, echocardiography or audiometry reported). Converting, say, "the
  three individuals with CFNDS" into VERY_FREQUENT would present a 3/3 count
  from 2022 as a population band, and the denominator has since grown. Raw counts
  and the paper each came from are recorded in the individual phenotype `notes:`
  instead. `diagnostic: true` is set only on the two features PMID:35451546
  explicitly calls the core phenotype.


  (5) PMID:38818818 HAS NO ABSTRACT IN PUBMED, AND IS CITED ACCORDINGLY. The Clin
  Dysmorphol report of the fourth patient is indexed without an abstract, so the
  cached reference body contains only the bibliographic header. The single
  evidence item that cites it quotes the article TITLE verbatim, and its
  `explanation` says so. The title is a substantive assertion (a novel homozygous
  CCDC32 deletion causing CFNDS in a fourth patient) and no clinical detail from
  that paper is asserted anywhere in this entry, because none is quotable.


  (6) TWO MECHANISM ARMS, BOTH CURATED, NEITHER PRESENTED AS SETTLED. The
  endocytic arm (CCDC32 as an AP-2 assembly chaperone) is now supported by three
  independent structural and cell-biological papers (PMID:39145939,
  PMID:41489497, PMID:42234739) plus the co-essentiality screen that first
  connected the gene to AP2 (PMID:33859415), and is modelled with
  `mechanism_confidence: ESTABLISHED` at the molecular level. The ciliary arm
  rests on the zebrafish and cell-culture data in the original report
  (PMID:32307552), was described by its own authors as "at least partially"
  involved, and has not been independently replicated in the six years since; it
  is modelled with `mechanism_confidence: PROVISIONAL`. Critically, NEITHER arm
  has been shown to produce the human craniofacial, cardiac or brain
  malformations - both edges into the morphogenesis node are
  INDIRECT_UNKNOWN_INTERMEDIATES. See the `mechanistic_hypotheses` block and the
  `ccdc32_ap2_versus_cilia` discussion.


  (7) THE THREE AP-2 MECHANISM PAPERS DISAGREE WITH EACH OTHER ON DETAIL, AND
  THE DISAGREEMENT IS CURATED RATHER THAN SMOOTHED OVER. PMID:39145939 reports
  CCDC32 as a transient assembly chaperone released before AP2 matures, and
  could not detect binding between tagged CCDC32 and the mature complex.
  PMID:41489497 reports the opposite for the mature complex, showing CCDC32
  binding full-length AP2 in cells and being recruited to clathrin-coated pits.
  PMID:42234739 finds that in solution CCDC32 actively disassembles AP-2
  tetramers and that PIP2-containing membrane is what permits assembly to
  complete. All three are cited; the tension is recorded in the
  `ccdc32_ap2_chaperone_mechanism` discussion and is not resolved by this entry.


  (8) NO ORPHANET, CLINGEN OR OMIM STRUCTURED-SOURCE RECORD IS CITED, AND THE
  ABSENCE WAS CHECKED. `grep -il -e CCDC32 -e CFNDS -e cardiofacioneuro
  references_cache/ORPHA_*.md references_cache/CGGV_*.md references_cache/CGDS_*.md`
  returns nothing, while the cache does contain hundreds of ORPHA and CGGV
  records generally, so the absence is specific to this disease rather than a
  missing source. For Orphanet the absence appears to be real rather than a cache
  gap: the MONDO record for MONDO:0030873 carries only MEDGEN, OMIM and UMLS
  xrefs and no `Orphanet:` xref, whereas MONDO:0015280 (cardiofaciocutaneous
  syndrome) does carry `Orphanet:1340`. For ClinGen the record exists upstream
  but is not in the local cache; see note (11). Generating either missing record
  would require bumping a `data/*/MANIFEST.yaml` pin, which the curation PR scope
  check forbids. The OMIM number is nonetheless verified twice over: it is the
  MONDO xref and it is stated in the text of PMID:41639596.


  (10) THE HPO ANNOTATION SET IS RICHER THAN THIS ENTRY, AND THE REASON IS
  QUOTABILITY. The HPO annotation for OMIM:619123 was retrieved directly from
  `https://ontology.jax.org/api/network/annotation/OMIM:619123` on 2026-08-01 and
  contains 25 terms with literal patient-count frequencies, all sourced from
  PMID:32307552. Every one of those counts comes from the FULL TEXT of that
  paper, and its abstract - which is all that `just fetch-reference` could
  retrieve, since both the OUP and the PMC routes returned HTTP 403 - names none
  of them. The retrieved set is: Global developmental delay 2/2, Microcephaly
  2/2, Cleft lip 2/2, Cleft palate 2/2, Protruding ear 2/2, Clinodactyly of the
  5th finger 2/2, Feeding difficulties in infancy 2/2, Congenital onset 2/2,
  Cerebellar vermis hypoplasia 1/1, Cryptorchidism 1/1, Atrioventricular canal
  defect 1/2, Ventricular septal defect 1/2, Pulmonic stenosis 1/2, Asplenia 1/2,
  Abdominal situs inversus 1/2, Hypertelorism 1/2, Hypotelorism 1/2, Upslanted
  palpebral fissure 1/2, Micrognathia 1/2, Brachydactyly 1/2, Camptodactyly 1/2,
  Aplasia/Hypoplasia of the nails 1/2, Abnormal dermatoglyphics 1/2, Kyphosis
  1/2, and Autosomal recessive inheritance. Nine of these were promoted into the
  `phenotypes:` list WITHOUT an evidence item, each carrying a `notes:` naming
  HPOA, the count and the source PMID; the selection rule was "changes management
  or bears on the mechanism", which is why the cardiac lesions, asplenia, situs
  inversus, feeding difficulties, cryptorchidism, cerebellar vermis hypoplasia
  and hypotelorism were promoted and the remaining single-observation dysmorphic
  descriptors (protruding ear, upslanted palpebral fissure, micrognathia,
  brachydactyly, clinodactyly, camptodactyly, nail hypoplasia, abnormal
  dermatoglyphics, kyphosis) were left in this note. These nine are the ONLY
  assertions in the entry without an evidence item, and they are flagged as such
  in every one of their `notes:` fields. HYPERTELORISM AND HYPOTELORISM ARE BOTH
  ANNOTATED AT 1/2, WHICH IS NOT AN ERROR: the two index individuals were
  discordant in opposite directions on the same midline measurement. The
  hypertelorism entry is separately evidenced from PMID:35451546.


  (10a) THREE FURTHER PHENOTYPES ARE DELIBERATELY NOT PROMOTED, AND THE REASON IS
  NOT THAT THEY ARE UNIMPORTANT. The deep-research artifact for this entry lists
  three additional features from the full text of PMID:32307552 that are not in
  HPOA: HP:0012110 Hypoplasia of the pons (fetus A-II-2), HP:0000286 Epicanthus
  (individual B-II-1) and HP:0000752 Hyperactivity (individual B-II-1). All three
  are plausible, and pontine hypoplasia in particular would sit naturally beside
  the already-promoted cerebellar vermis hypoplasia as a second posterior-fossa
  finding. They are not promoted because they fail BOTH routes into this entry.
  (a) They are not in the HPO annotation set, so they cannot be promoted on the
  same provenance as the other nine unevidenced phenotypes: the HPO API
  (https://ontology.jax.org/api/network/annotation/OMIM:619123) was re-queried on
  2026-08-01 and returned exactly the 25 terms listed above; none of the three
  appears. (b) They are not quotable, so they cannot be evidenced: PMID:32307552
  was re-fetched with `just fetch-reference PMID:32307552` on 2026-08-01 and the
  tool reported "Content type: abstract_only", and `grep -ni
  "pons\|pontine\|epicanth\|hyperactiv"` across every cached reference used by
  this entry (PMID_32307552, PMID_35451546, PMID_38818818, PMID_41489497,
  PMID_41639596) returns no clinical hit. Promoting them would therefore mean
  asserting three clinical findings on the deep-research report's word alone,
  which is precisely the failure mode the rest of this entry is built to avoid.
  They are recorded here so that a future curator who obtains the full text can
  promote them immediately, with the HPO identifiers already verified.


  (11) CLINGEN CLASSIFIES THE GENE-DISEASE RELATIONSHIP AS MODERATE, AND THIS WAS
  VERIFIED INDEPENDENTLY OF THE DEEP-RESEARCH REPORT. The ClinGen curation page
  for the gene (https://search.clinicalgenome.org/kb/genes/HGNC:28295) was
  fetched during curation on 2026-08-01 and its gene-validity table reads
  "CCDC32 | cardiofacioneurodevelopmental syndrome MONDO:0030873 | AR | Syndromic
  Disorders GCEP | Moderate". Moderate, not Definitive, is the appropriate
  epistemic level for a five-family disease and is consistent with the caution
  taken throughout this entry. No `CGGV:` evidence item is attached because no
  `references_cache/CGGV_*.md` record for this assertion exists locally and
  generating one would require refreshing `data/clingen/MANIFEST.yaml`, which the
  PR scope check forbids. ClinGen has no dosage-sensitivity curation for CCDC32.


  (12) NO `conforms_to` MODULE DECLARATION IS MADE, AND THAT IS A DECISION RATHER
  THAN AN OVERSIGHT. The nearest existing dismech module,
  `pharyngeal_arch_patterning_serial_homology`, is a conceptual neighbour
  (cranial-neural-crest-derived multi-element craniofacial malformation) but the
  lesion here is a vesicle-trafficking assembly chaperone rather than an
  arch-patterning, ribosome or spliceosome lesion, and the CFNDS malformation
  bundle is not confined to arch derivatives - it includes laterality, cardiac
  septation and posterior-fossa components. Forcing conformance would assert a
  mechanism the literature does not support. `ciliopathy_dysfunction` was also
  considered and rejected: CFNDS lacks every cardinal ciliopathy feature (cystic
  kidney disease, retinal dystrophy, postaxial polydactyly), and the ciliary arm
  here is PROVISIONAL rather than established. The genuinely correct target would
  be a new "AP-2 adaptor assembly / clathrin-mediated endocytosis deficiency"
  module, which would have several worked conformers across the pathway (CCDC32
  in this disease, AP2M1 in MONDO:0032823, and the other AP-2-subunit and AAGAB
  disorders). Creating that module is out of scope for this PR.


  (13) THE TERMINAL "DISRUPTED CRANIOFACIAL, CARDIAC AND NEURAL MORPHOGENESIS"
  NODE IS DELIBERATELY LEFT AS ONE NODE. Splitting it into three organ-specific
  outcome nodes was considered and rejected. Splitting a node is warranted when
  the branches carry different evidence or different upstream mechanisms; here
  they would not. Both inbound edges are INDIRECT_UNKNOWN_INTERMEDIATES, and
  neither the AP-2 arm nor the ciliary arm has been connected to ANY of the three
  organ outcomes specifically - there is no craniofacial-specific edge, no
  cardiac-specific edge and no neural-specific edge to be had, and three copies
  of the same two unresolved edges would assert an organ-level resolution the
  literature does not contain. The per-organ detail that would justify a split is
  already carried at the correct granularity in the `phenotypes:` list, where the
  clefts, the septal defects and the vermis hypoplasia are separate entries with
  their own terms and evidence. Revisit this if a study ever attributes a
  specific organ malformation to a specific arm.


  (9) WHAT IS KNOWINGLY ABSENT. No treatment in this entry is disease-modifying,
  and no treatment carries an evidence item, because none exists: a PubMed search
  on 2026-08-01 for "(cardiofacioneurodevelopmental OR CFNDS) AND (management OR
  treatment OR guideline)" returned one record, on nanodiamond toxicology, which
  is unrelated. The treatments listed are generic supportive measures inferred
  from the phenotype and are labelled as such. No prevalence rate, survival
  figure, genotype-phenotype correlation or recurrence-risk figure beyond the
  standard autosomal recessive 25% is asserted. No mouse model of Ccdc32
  deficiency was located. The zebrafish work is curated under `animal_models` and
  its evidence items are tagged MODEL_ORGANISM so they can never be mistaken for
  human data. Facial dysmorphism is curated only at the level of the two specific
  features that are quotable (hypertelorism, and the orofacial clefts); the
  detailed gestalt described in the individual case reports is not transcribed,
  because those descriptions are in full texts that are not in the reference
  cache.
inheritance:
- name: Autosomal recessive
  description: >-
    CFNDS requires two damaged CCDC32 alleles. Every family reported to date has
    been either consanguineous with a homozygous variant or has carried a
    biallelic deletion; heterozygous parents are unaffected.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:41639596
    reference_title: Two siblings with CCDC32-related cardiofacioneurodevelopmental
      syndrome diagnosed by clinical RNA-sequencing and review of literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Cardiofacioneurodevelopmental syndrome (CFNDS, MIM:619123) is a rare genetic
      disorder caused by bi-allelic pathogenic variants in CCDC32.
    explanation: >-
      States the biallelic requirement directly, and anchors the OMIM identifier
      used for the NEC check.
  - reference: PMID:32307552
    reference_title: Loss of function mutations in CCDC32 cause a congenital syndrome
      characterized by craniofacial, cardiac and neurodevelopmental anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we investigated the genetic and mechanistic cause of disease in two independent
      consanguineous families affected by overlapping craniofacial, cardiac, laterality
      and neurodevelopmental anomalies
    explanation: >-
      The founding report ascertained two consanguineous families, the classic
      setting for a recessive disorder.
prevalence:
- population: Global
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence, birth prevalence or carrier frequency has ever
    been published for CFNDS, so the qualitative ULTRA_RARE tier is used and the
    case count is recorded here rather than converted into a rate. As of the 2026
    review, four living individuals and one terminated fetus from four families
    had been described (PMID:41639596); that same paper adds a sibling pair,
    which resolves to six living individuals plus one fetus from five families.
    The reports are PMID:32307552 (two consanguineous families), PMID:35451546
    (a ninth-year-old girl, described by its authors as a novel patient),
    PMID:38818818 (described by its authors as the fourth patient) and
    PMID:41639596 (two siblings).
  evidence:
  - reference: PMID:41639596
    reference_title: Two siblings with CCDC32-related cardiofacioneurodevelopmental
      syndrome diagnosed by clinical RNA-sequencing and review of literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: So far, CFNDS has only been described in four living individuals and one
      terminated fetus from four families
    explanation: >-
      Gives the published denominator immediately before this report, which is
      the basis for the ultra-rare tier.
progression:
- age_range: Prenatal to birth
  notes: >-
    The defining lesions are structural malformations that are established during
    embryogenesis and are present at birth: orofacial clefting, congenital
    cardiac anomalies, laterality anomalies and brain malformations. One of the
    reported conceptions was a terminated fetus, so the phenotype can be severe
    enough to be recognised prenatally.
  evidence:
  - reference: PMID:32307552
    reference_title: Loss of function mutations in CCDC32 cause a congenital syndrome
      characterized by craniofacial, cardiac and neurodevelopmental anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we investigated the genetic and mechanistic cause of disease in two independent
      consanguineous families affected by overlapping craniofacial, cardiac, laterality
      and neurodevelopmental anomalies
    explanation: >-
      Craniofacial, cardiac and laterality anomalies are congenital structural
      defects, fixing the onset of the malformation component at birth or before.
- age_range: Infancy through childhood
  notes: >-
    The neurodevelopmental component becomes apparent postnatally as
    developmental delay and later intellectual disability, and growth
    impairment or microcephaly may become evident after birth rather than being
    present at delivery. The oldest individual reported in detail was nine years
    old at publication. No natural-history study, and no data on adult outcome or
    life expectancy, has been published.
  evidence:
  - reference: PMID:35451546
    reference_title: "Cardiofacioneurodevelopmental syndrome: Report of a novel patient\
      \ and expansion of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Variable abnormalities of the face, brain, heart, fingers, and toes and
      postnatal growth retardation or microcephaly can be present.
    explanation: >-
      Identifies growth retardation and microcephaly as postnatal rather than
      necessarily congenital findings.
mechanistic_hypotheses:
- hypothesis_group_id: ccdc32_ap2_endocytic_model
  hypothesis_label: AP-2 Assembly Chaperone / Clathrin-Mediated Endocytosis Model
  status: CANONICAL
  description: >-
    The best-supported model is that CCDC32 is a dedicated assembly factor for the
    AP-2 clathrin adaptor complex, and that loss of CCDC32 causes a cell-wide
    deficit in clathrin-mediated endocytosis which in turn disrupts the
    signalling and receptor-trafficking events on which craniofacial, cardiac and
    neural development depend. The model is supported by an unbiased
    co-essentiality screen that first linked the gene to AP2, by biochemical
    reconstitution of the AAGAB-to-CCDC32 handover that builds AP2, by live-cell
    imaging showing that CCDC32 depletion destabilises clathrin-coated pits, and
    by structural work showing that CCDC32 deletion causes loss of all AP-2
    subunits in vivo. It is further supported by the observation that all the
    disease alleles characterised to date truncate CCDC32 before the alpha-helix
    that mediates AP-2 binding.
  evidence:
  - reference: PMID:39145939
    reference_title: An AAGAB-to-CCDC32 handover mechanism controls the assembly of
      the AP2 adaptor complex.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We identified CCDC32 as another chaperone regulating AP2 assembly.
    explanation: Establishes the core molecular role of the protein.
  - reference: PMID:39145939
    reference_title: An AAGAB-to-CCDC32 handover mechanism controls the assembly of
      the AP2 adaptor complex.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: The AP2-regulating function of CCDC32 is disrupted by a disease-causing
      mutation.
    explanation: >-
      Directly connects the chaperone function to a disease allele rather than
      leaving the link inferential.
  - reference: PMID:41489497
    reference_title: CCDC32 stabilizes clathrin-coated pits and drives their invagination.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These findings show that this loss-of-function nonsense mutation in CCDC32
      abolishes its interactions with AP2 and inhibits CME, likely contributing to
      the development of CFNDS.
    explanation: >-
      Tests a patient-derived truncation directly and reports that it abolishes
      AP2 binding and inhibits endocytosis.
- hypothesis_group_id: ccdc32_ciliary_model
  hypothesis_label: Ciliary Contribution Model
  status: ALTERNATIVE
  description: >-
    The original disease report proposed that CFNDS is at least partly a
    ciliopathy. Its authors noted that several patient features overlap defects
    common to ciliopathies, showed that zebrafish ccdc32 depletion recapitulates
    the human phenotypes, and showed that ccdc32 is required for normal cilium
    formation in zebrafish embryos and in mammalian cell culture. The presence of
    laterality anomalies in the original families is the clinical observation that
    most strongly favours a ciliary contribution, since laterality determination
    is a canonical motile-cilium-dependent process.
  notes: >-
    Classified ALTERNATIVE rather than CANONICAL, and carried on a PROVISIONAL
    pathophysiology node, because the finding has not been independently
    replicated since 2020, its own authors phrased the conclusion as ciliary
    defects being "at least partially" involved, and none of the three subsequent
    mechanistic papers on CCDC32 examined cilia at all. The two models are not
    mutually exclusive: AP-2 and clathrin-mediated endocytosis have documented
    roles in ciliary membrane trafficking, so an endocytic primary defect could
    produce a secondary ciliary phenotype.
  evidence:
  - reference: PMID:32307552
    reference_title: Loss of function mutations in CCDC32 cause a congenital syndrome
      characterized by craniofacial, cardiac and neurodevelopmental anomalies.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: we show that ccdc32 is required for normal cilia formation in zebrafish
      embryos and mammalian cell culture, arguing that ciliary defects are at least
      partially involved in the pathomechanism of this disorder
    explanation: >-
      The single primary source for the ciliary model, stated by its own authors
      as a partial rather than complete explanation.
pathophysiology:
- name: Biallelic CCDC32 Loss of Function
  description: >-
    Homozygous or compound-heterozygous loss-of-function variants in CCDC32
    (also known as C15orf57, at 15q15.1) remove or truncate a small
    185-amino-acid coiled-coil protein. The alleles characterised to date are
    frameshift or nonsense variants that terminate translation after the first
    9, 54 or 80 residues, and whole-gene or multi-exon deletions. All of the
    characterised truncations lie upstream of the alpha-helix formed by residues
    78 to 98, which is the segment required for binding the AP-2 alpha subunit.
  role: root
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  gene:
    preferred_term: CCDC32
    term:
      id: hgnc:28295
      label: CCDC32
  molecular_functions:
  - preferred_term: AP-2 adaptor complex binding
    term:
      id: GO:0035612
      label: AP-2 adaptor complex binding
    modifier: ABSENT
  downstream:
  - target: Failure of AP-2 Adaptor Complex Assembly
    causal_link_type: DIRECT
    description: >-
      CCDC32 is the assembly chaperone that templates AP-2 tetramer formation, so
      its loss is directly a failure of that assembly step.
    evidence:
    - reference: PMID:42234739
      reference_title: CCDC32 collaborates with the membrane to assemble the AP-2 clathrin
        adaptor complex.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: coiled-coil domain-containing protein 32 (CCDC32), whose deletion causes
        loss of all AP-2 subunits in vivo
      explanation: >-
        Deleting CCDC32 abolishes the assembled complex, which is the causal
        step this edge asserts.
  - target: Defective Ciliogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Depletion of the zebrafish orthologue impairs cilium formation, but no
      molecular route from the CCDC32 defect to the ciliary phenotype has been
      identified, and it is not known whether the ciliary effect is downstream of
      the endocytic one.
    evidence:
    - reference: PMID:32307552
      reference_title: Loss of function mutations in CCDC32 cause a congenital syndrome
        characterized by craniofacial, cardiac and neurodevelopmental anomalies.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: we show that ccdc32 is required for normal cilia formation in zebrafish
        embryos and mammalian cell culture
      explanation: >-
        Establishes that loss of the gene product impairs ciliogenesis. PARTIAL
        because the experiments do not identify any intermediate step, which is
        why the edge is typed INDIRECT_UNKNOWN_INTERMEDIATES.
  evidence:
  - reference: PMID:32307552
    reference_title: Loss of function mutations in CCDC32 cause a congenital syndrome
      characterized by craniofacial, cardiac and neurodevelopmental anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Using whole exome sequencing, we identified homozygous frameshift CCDC32
      variants in three affected individuals.
    explanation: The founding identification of biallelic loss-of-function alleles.
  - reference: PMID:41489497
    reference_title: CCDC32 stabilizes clathrin-coated pits and drives their invagination.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Clinical genome sequencing of three patients with cardio-facio-neuro-developmental
      syndrome (CFNDS) revealed three homozygous nonsense mutations that only express
      the first 9, 54, and 80 aa of CCDC32, respectively
    explanation: >-
      Specifies the residue positions at which the reported disease alleles
      truncate the protein.
  - reference: PMID:41489497
    reference_title: CCDC32 stabilizes clathrin-coated pits and drives their invagination.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Deletion of aa78-98 in CCDC32, corresponding to a predicted alpha-helix,
      abrogates AP2 binding
    explanation: >-
      Identifies the protein segment that all reported disease truncations
      remove, explaining why they are loss of function for AP-2 binding.
- name: Failure of AP-2 Adaptor Complex Assembly
  description: >-
    AP-2 is a heterotetramer of alpha, beta2, mu2 and sigma2 subunits and is the
    principal cargo adaptor of clathrin-mediated endocytosis. Its assembly is a
    chaperoned, ordered process: AAGAB first stabilises the alpha and sigma2
    subunits, CCDC32 then displaces AAGAB to form an alpha-sigma2-CCDC32 ternary
    template, and that template sequentially recruits mu2 and beta2 before CCDC32
    is released. Without CCDC32 the handover cannot occur and cells lose AP-2
    complexes.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  cellular_components:
  - preferred_term: AP-2 adaptor complex
    term:
      id: GO:0030122
      label: AP-2 adaptor complex
  protein_complexes:
  - preferred_term: AP-2 clathrin adaptor complex
    term:
      id: GO:0030122
      label: AP-2 adaptor complex
  downstream:
  - target: Clathrin-Coated Pit Destabilization
    causal_link_type: DIRECT
    description: >-
      AP-2 nucleates and stabilises nascent clathrin-coated pits, so depletion of
      assembled AP-2 is directly a coated-pit stability defect.
    evidence:
    - reference: PMID:41489497
      reference_title: CCDC32 stabilizes clathrin-coated pits and drives their invagination.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: We show by quantitative live cell imaging that siRNA-mediated knockdown
        of CCDC32, a poorly characterized endocytic accessory protein, leads to the
        accumulation of unstable flat clathrin assemblies.
      explanation: >-
        Losing CCDC32 function produces the coated-pit instability that this
        edge asserts.
  evidence:
  - reference: PMID:39145939
    reference_title: An AAGAB-to-CCDC32 handover mechanism controls the assembly of
      the AP2 adaptor complex.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: These findings demonstrate that AP2 is assembled by a handover mechanism
      switching from AAGAB-based initiation complexes to CCDC32-based template complexes.
    explanation: >-
      A complete sentence stating the ordered, chaperoned nature of AP2 assembly
      and CCDC32's position in it, which is what this edge asserts. This replaces
      an earlier mid-clause fragment ("Here, we found that AAGAB initiates AP2
      assembly by stabilizing its") that had been truncated to avoid quoting the
      Greek-lettered subunit names; the substituted sentence carries the same
      claim, is ASCII throughout, and does not end mid-predicate.
  - reference: PMID:42234739
    reference_title: CCDC32 collaborates with the membrane to assemble the AP-2 clathrin
      adaptor complex.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: coiled-coil domain-containing protein 32 (CCDC32), whose deletion causes
      loss of all AP-2 subunits in vivo
    explanation: >-
      States the consequence of losing CCDC32 for the complex as a whole, which
      is the step this node models.
  - reference: PMID:33859415
    reference_title: A genome-wide atlas of co-essential modules assigns function to
      uncharacterized genes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We also show that C15orf57 encodes a protein that binds the AP2 complex,
      localizes to clathrin-coated pits and enables efficient transferrin uptake.
    explanation: >-
      The unbiased co-essentiality screen that first assigned CCDC32 (C15orf57)
      to the AP2 module.
- name: Clathrin-Coated Pit Destabilization
  description: >-
    Loss of CCDC32 function leaves the plasma membrane populated by flat,
    short-lived clathrin assemblies that fail to curve and invaginate. Invagination
    of the nascent coated pit is the checkpoint that determines whether a pit
    matures productively or aborts, so this is the point at which the molecular
    defect becomes a cell-biological one.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  cellular_components:
  - preferred_term: Clathrin-coated pit
    term:
      id: GO:0005905
      label: clathrin-coated pit
  downstream:
  - target: Deficient Clathrin-Mediated Endocytosis
    causal_link_type: DIRECT
    description: >-
      Coated pits that cannot invaginate cannot become coated vesicles, so cargo
      internalisation falls.
    evidence:
    - reference: PMID:41489497
      reference_title: CCDC32 stabilizes clathrin-coated pits and drives their invagination.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: our data demonstrate the function of a novel endocytic accessory protein,
        CCDC32, in regulating CCP stabilization and invagination, critical early stages
        of CME
      explanation: >-
        States the coupling between coated-pit stabilisation and invagination
        and the endocytic pathway as a whole.
  evidence:
  - reference: PMID:41489497
    reference_title: CCDC32 stabilizes clathrin-coated pits and drives their invagination.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We show by quantitative live cell imaging that siRNA-mediated knockdown

- name: Failure of AP-2 Adaptor Complex Assembly
  description: >-
    CCDC32 participates in chaperoned AP-2 assembly after AAGAB-dependent stabilization of the alpha/sigma2
    intermediate. Reconstitution shows an AAGAB-to-CCDC32 handover. Later structural work shows that CCDC32
    can prevent or reverse tetramer assembly in solution, whereas binding to PIP2-containing membranes
    relieves this inhibition and stabilizes assembled AP-2. Thus assembly depends on membrane context
    as well as the handover. Engineered CCDC32 knockout reduces AP-2 subunit abundance.
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED

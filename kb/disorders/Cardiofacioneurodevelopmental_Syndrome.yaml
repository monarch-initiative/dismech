prevalence:
- population: Global
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    The 2026 report describes two siblings in addition to four living individuals and one electively terminated
    fetus from four previously reported families: six living individuals and one fetus from five families
    within that literature review. This is a dated literature count, not a current worldwide census or
    a population rate.
  evidence:
  - reference: PMID:41639596
    reference_title: Two siblings with CCDC32-related cardiofacioneurodevelopmental syndrome diagnosed by clinical RNA-sequencing and review of literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      So far, CFNDS has only been described in four living individuals and one terminated fetus from four
      families
    explanation: >-
      Gives the published denominator immediately before this report, which is
      the basis for the ultra-rare tier.
progression:
- age_range: Prenatal to birth
  notes: >-
    Structural malformations can be detected prenatally. Ultrasound in fetus A-II-2 showed bilateral cleft
    lip, vermian and pontine hypoplasia, and an abnormal cisterna magna. The pregnancy was terminated
    electively; this observation does not establish fetal lethality.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7268788/
    reference_title: "Loss of function mutations in CCDC32 cause a congenital syndrome characterized by craniofacial, cardiac and neurodevelopmental anomalies - PMC"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A sibling fetus in Family A (A-II-2) had bilateral cleft lip, vermian hypoplasia, hypoplastic pons
      and abnormal cisterna magna that were detected by ultrasound, and the pregnancy was terminated electively.
    explanation: >-
      Direct prenatal imaging observations in the founding family.
- age_range: Infancy through childhood
  notes: >-
    Feeding difficulties and developmental delay were reported in childhood, and intellectual disability
    was documented in the nine-year-old patient reported in 2022. Growth, head size and structural findings
    vary. These small case reports do not establish adult prognosis or a progressive neurodegenerative
    course.
  evidence:
  - reference: PMID:35451546
    reference_title: "Cardiofacioneurodevelopmental syndrome: Report of a novel patient and expansion of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variable abnormalities of the face, brain, heart, fingers, and toes and postnatal growth retardation
      or microcephaly can be present.
    explanation: >-
      Identifies growth retardation and microcephaly as postnatal rather than
      necessarily congenital findings.
mechanistic_hypotheses:
- hypothesis_group_id: ccdc32_ap2_endocytic_model
  hypothesis_label: AP-2 assembly and coated-pit function model
  status: CANONICAL
  description: >-
    CCDC32 supports AP-2 assembly in knockout/reconstitution studies and also regulates coated-pit stability
    and invagination under partial-knockdown conditions that preserve AP-2 protein levels. Impaired receptor
    uptake is demonstrated in engineered cells. These molecular functions are established, while their
    contribution to each human malformation remains a hypothesis. The engineered CCDC32(1-54) disease
    mimic is defective in AP-2 binding and uptake rescue but is not the exact frameshift protein predicted
    in the founding patient.
  evidence:
  - reference: PMID:39145939
    reference_title: An AAGAB-to-CCDC32 handover mechanism controls the assembly of the AP2 adaptor complex.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We identified CCDC32 as another chaperone regulating AP2 assembly.
    explanation: Establishes the core molecular role of the protein.
  - reference: PMID:39145939
    reference_title: An AAGAB-to-CCDC32 handover mechanism controls the assembly of the AP2 adaptor complex.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The AP2-regulating function of CCDC32 is disrupted by a disease-causing mutation.
    explanation: >-
      A disease-mimicking mutant disrupts the AP-2-regulating function in an engineered assay; this is
      not a direct measurement of patient protein.
  - reference: PMID:41489497
    reference_title: CCDC32 stabilizes clathrin-coated pits and drives their invagination.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These findings show that this loss-of-function nonsense mutation in CCDC32 abolishes its interactions
      with AP2 and inhibits CME, likely contributing to the development of CFNDS.
    explanation: >-
      The experimental truncation supports a loss-of-function model; the construct omits both an N-terminal
      segment and the patient frameshift tail.
- hypothesis_group_id: ccdc32_ciliary_model
  hypothesis_label: Ciliary Contribution Model
  status: ALTERNATIVE
  description: >-
    The founding study found reduced Kupffer vesicle cilia number and length in mosaic CRISPR-edited zebrafish
    embryos, and impaired ciliogenesis after siRNA knockdown in mouse IMCD3 cells. Abnormal southpaw expression
    and cardiac looping support a contribution to left-right patterning in fish. A corresponding causal
    chain has not been demonstrated in patient tissue.
  notes: >-
    The ciliary and endocytic models need not be mutually exclusive. The 2022 case report cites the 2020
    zebrafish experiments; it does not provide independent replication. How CCDC32 affects cilia and whether
    this depends on AP-2 remain unresolved.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7268788/
    reference_title: "Loss of function mutations in CCDC32 cause a congenital syndrome characterized by craniofacial, cardiac and neurodevelopmental anomalies - PMC"
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      KV cilia were reduced significantly in both number and length in crispants at the 10 somite stage
    explanation: >-
      Ciliary number and length were measured in mosaic CRISPR-edited zebrafish embryos.
  - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7268788/
    reference_title: "Loss of function mutations in CCDC32 cause a congenital syndrome characterized by craniofacial, cardiac and neurodevelopmental anomalies - PMC"
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Cilia formation was similarly impaired in ciliated mouse inner medullary collecting duct cells with
      GFP-labeled cilia (IMCD3 5-HT6-GFP) following siRNA-mediated knockdown
    explanation: >-
      The mouse experiment used cultured cells, not an intact mouse model.
pathophysiology:
- name: Biallelic CCDC32 Loss of Function
  description: >-
    Biallelic frameshift and deletion alleles disrupt CCDC32. The founding paper describes two frameshifts
    on NM_001080791.2, c.54dupT and c.189_190dupGG; later reports include a 32,583-bp deletion and a deletion
    of exons 3 and 4. Predicted loss of function is not proof that every allele abolishes all protein
    activity. Patient transcript downregulation is documented for the exon-3/4 deletion, while residual
    protein function across genotypes remains unknown.

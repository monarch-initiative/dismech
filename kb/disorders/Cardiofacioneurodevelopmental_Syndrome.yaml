diagnosis:
- name: Exome or genome sequencing
  description: >-
    Molecular diagnosis requires compatible findings and biallelic pathogenic CCDC32 variants. Exome sequencing
    identified the founding frameshifts; analysis should also consider exon-level and larger deletions.
    Developmental delay with orofacial clefting and additional cardiac, laterality or brain findings can
    prompt consideration of CCDC32, but no formal clinical scoring criteria are established.
  evidence:
  - reference: PMID:32307552
    reference_title: Loss of function mutations in CCDC32 cause a congenital syndrome characterized by craniofacial, cardiac and neurodevelopmental anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using whole exome sequencing, we identified homozygous frameshift CCDC32 variants in three affected
      individuals.
    explanation: >-
      Exome sequencing was the method that established the diagnosis in the
      founding families.
- name: RNA sequencing when DNA-based testing is uninformative
  description: >-
    In the 2026 siblings, RNA sequencing identified marked CCDC32 downregulation and loss of exons 3 and
    4 after SNP array and trio exome testing had been uninformative. CCDC32 was absent from the intellectual-disability
    and congenital-malformation panels used in the earlier analysis. Review of WES tracks and genomic
    PCR/Sanger sequencing then confirmed the deletion. RNA analysis can complement a negative work-up,
    but this case does not establish that DNA testing is intrinsically unable to detect the allele.
  evidence:
  - reference: PMID:41639596
    reference_title: Two siblings with CCDC32-related cardiofacioneurodevelopmental syndrome diagnosed by clinical RNA-sequencing and review of literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We present a family with two affected individuals who were diagnosed through clinical RNA sequencing
      (RNA-seq) after conventional DNA diagnostics did not yield a molecular cause.
    explanation: >-
      States precisely the diagnostic claim made here: RNA sequencing made the
      diagnosis after DNA-based testing had failed.
  - reference: PMID:41639596
    reference_title: Two siblings with CCDC32-related cardiofacioneurodevelopmental syndrome diagnosed by clinical RNA-sequencing and review of literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This deletion was not detected in previous SNP array analyses and trio exome sequencing focusing
      on genes related to intellectual disability and congenital malformations, highlighting the complementary
      value of RNA-seq.
    explanation: >-
      Documents that both SNP array and trio exome sequencing missed the causal
      allele, which is the reason RNA sequencing is recommended here.
  - reference: url:https://www.nature.com/articles/s41431-026-02023-y/figures/2
    reference_title: "Fig. 2: Deletion of exon 3 and 4 of CCDC32 in affected individuals. | European Journal of Human Genetics | European Journal of Human Genetics"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      (not included in the ID and MCA panels) exhibited notable downregulation with a Z-score of -8.20.
    explanation: >-
      Panel membership explains part of the diagnostic blind spot; the RNA outlier is patient-specific.
- name: Brain magnetic resonance imaging
  description: >-
    Brain MRI can characterize the reported callosal, cerebellar and brainstem abnormalities. The 2026
    figure also reports anterior pituitary hypoplasia, a thin optic nerve and absent right internal carotid
    artery. Imaging observations should not be converted into unmeasured endocrine or visual dysfunction.
  evidence:
  - reference: PMID:35451546
    reference_title: "Cardiofacioneurodevelopmental syndrome: Report of a novel patient and expansion of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Brain imaging disclosed hypoplastic corpus callosum.
    explanation: >-
      Brain imaging revealed a structural anomaly that would otherwise have been
      missed.
  - reference: url:https://www.nature.com/articles/s41431-026-02023-y/figures/1
    reference_title: "Fig. 1: Clinical hallmarks of Cardiofacioneurodevelopmental syndrome (CFNDS). | European Journal of Human Genetics | European Journal of Human Genetics"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Bottom-right image indicates a complete but thin corpus callosum with abnormalities in sinuses.
    explanation: >-
      A complete but thin corpus callosum is separately reported in the 2026 MRI figure; this is not agenesis.
- name: Cardiac, visceral situs and hearing assessment
  description: >-
    Phenotype-directed assessment includes cardiac anatomy, abdominal organ position and spleen presence,
    and hearing. This is inferred from the reported defects rather than a validated CFNDS screening schedule.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7268788/
    reference_title: "Loss of function mutations in CCDC32 cause a congenital syndrome characterized by craniofacial, cardiac and neurodevelopmental anomalies - PMC"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      atrioventricular (AV) canal defect and abdominal ... situs inversus ... with asplenia. Physical
      examination revealed borderline microcephaly
    explanation: >-
      Asplenia accompanied abdominal situs inversus in A-II-1. Infection prevention is an actionable consequence
      of this finding.
  - reference: PMID:35451546
    reference_title: "Cardiofacioneurodevelopmental syndrome: Report of a novel patient and expansion of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      She had bilateral conductive hearing loss, small hands and feet, and finger abnormalities.
    explanation: Direct documentation in a genotyped patient.
treatments:
- name: Antimicrobial prophylaxis and immunisation for asplenia
  description: >-
    Individuals with asplenia need infection-prevention planning, vaccination and prompt assessment of
    febrile illness under general asplenia care. Antibiotic prophylaxis duration depends on age and individual
    risk; lifelong infection susceptibility does not mean that every patient requires lifelong daily antibiotics.
    These are general asplenia recommendations, not CFNDS-specific trial outcomes.

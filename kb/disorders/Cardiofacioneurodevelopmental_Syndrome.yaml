name: Cardiofacioneurodevelopmental Syndrome
creation_date: '2026-08-01T00:00:00Z'
category: Mendelian
synonyms:
- CFNDS
- cardio-facio-neuro-developmental syndrome
- CCDC32-related cardiofacioneurodevelopmental syndrome
- C15orf57-related multiple congenital anomaly syndrome
description: >-
  Cardiofacioneurodevelopmental syndrome (CFNDS) is an ultra-rare autosomal recessive congenital anomaly
  syndrome associated with biallelic CCDC32 loss-of-function variants. Developmental delay and orofacial
  clefting recur alongside variable cardiac, laterality, brain, digital and growth abnormalities. CCDC32
  regulates assembly of the AP-2 clathrin adaptor complex and the stabilization and invagination of clathrin-coated
  pits. Knockout and partial-knockdown experiments reveal distinct effects on AP-2 abundance and pit dynamics.
  Zebrafish and cultured mouse-cell experiments also implicate ciliogenesis, but the links from either
  cellular defect to individual human malformations remain incompletely resolved. Patient fibroblast RNA
  sequencing has demonstrated transcript downregulation and loss of exons 3 and 4 in one family.

diagnosis:
- name: Exome or genome sequencing
  description: >-
    The diagnosis is molecular. Every reported family was solved by sequencing,
    and in the consanguineous families homozygosity for a truncating CCDC32
    allele was the finding. A child with bilateral cleft lip and palate together
    with developmental delay, and particularly one with additional cardiac,
    laterality or posterior-fossa findings, is the phenotype in which CCDC32
    should be considered.
  evidence:
  - reference: PMID:32307552
    reference_title: Loss of function mutations in CCDC32 cause a congenital syndrome
      characterized by craniofacial, cardiac and neurodevelopmental anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Using whole exome sequencing, we identified homozygous frameshift CCDC32
      variants in three affected individuals.
    explanation: >-
      Exome sequencing was the method that established the diagnosis in the
      founding families.
- name: RNA sequencing when DNA-based testing is uninformative
  description: >-
    Because a substantial share of CFNDS alleles are structural deletions, DNA
    based first-line testing can miss the diagnosis. In one family a biallelic
    deletion of exons 3 and 4 was invisible to both SNP array and trio exome
    sequencing and was found only because clinical RNA sequencing detected
    skipping of the two exons in the CCDC32 transcript. RNA sequencing should
    therefore be considered in a phenotypically compatible child whose DNA-based
    work-up is negative.
  evidence:
  - reference: PMID:41639596
    reference_title: Two siblings with CCDC32-related cardiofacioneurodevelopmental
      syndrome diagnosed by clinical RNA-sequencing and review of literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We present a family with two affected individuals who were diagnosed through
      clinical RNA sequencing (RNA-seq) after conventional DNA diagnostics did not yield
      a molecular cause.
    explanation: >-
      States precisely the diagnostic claim made here: RNA sequencing made the
      diagnosis after DNA-based testing had failed.
  - reference: PMID:41639596
    reference_title: Two siblings with CCDC32-related cardiofacioneurodevelopmental
      syndrome diagnosed by clinical RNA-sequencing and review of literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: This deletion was not detected in previous SNP array analyses and trio
      exome sequencing focusing on genes related to intellectual disability and congenital
      malformations, highlighting the complementary value of RNA-seq.
    explanation: >-
      Documents that both SNP array and trio exome sequencing missed the causal
      allele, which is the reason RNA sequencing is recommended here.
- name: Brain magnetic resonance imaging
  description: >-
    Brain imaging is indicated because midline and posterior-fossa anomalies are
    part of the phenotype and are not detectable clinically. Hypoplasia of the
    corpus callosum and cerebellar hypoplasia have both been reported.
  evidence:
  - reference: PMID:35451546
    reference_title: "Cardiofacioneurodevelopmental syndrome: Report of a novel patient\
      \ and expansion of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Brain imaging disclosed hypoplastic corpus callosum.
    explanation: >-
      Brain imaging revealed a structural anomaly that would otherwise have been
      missed.
treatments:
- name: Antimicrobial prophylaxis and immunisation for asplenia
  description: >-
    In the subset of individuals with asplenia, lifelong antibiotic prophylaxis
    (conventionally penicillin), an asplenia immunisation schedule against
    encapsulated organisms, and a low threshold for empiric treatment of febrile
    illness are indicated. This is the only pharmacological intervention in the
    syndrome with a specific indication rather than a purely symptomatic one, and
    it is the reason abdominal imaging for spleen and situs belongs in the
    baseline evaluation. It follows generic asplenia protocols; no CFNDS-specific
    protocol exists.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Asplenia
    term:
      id: HP:0001746
      label: Asplenia
- name: Cleft palate repair
  description: >-
    Surgical closure of the palatal cleft (palatoplasty/palatorrhaphy), typically
    at around 9 to 18 months and timed to speech development, within a
    multidisciplinary cleft team that also manages feeding, hearing and
    dentition. This is standard cleft care and is not specific to CFNDS; no
    CFNDS-specific surgical outcome data exist. The timing relative to speech
    acquisition is why this treatment is coordinated with the speech and language
    therapy entry below.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: palatorrhaphy
    term:
      id: NCIT:C168380
      label: Palatorrhaphy
  target_phenotypes:
  - preferred_term: Cleft palate
    term:
      id: HP:0000175
      label: Cleft palate
- name: Cleft lip repair
  description: >-
    Surgical closure of the cleft lip (cheiloplasty), conventionally in the first
    months of life, addressing lip competence, feeding and facial appearance.
    Split from palatal repair because the two procedures have different timing,
    different functional targets and different NCIT identities; NCIT has no
    cheiloplasty-specific clinical-action term reachable from NCIT:C25218 that
    `just validate-terms` accepts, so the generic surgical-procedure term is
    retained here while the palatal arm uses the specific term. Standard cleft
    care, not CFNDS-specific.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cleft lip repair (cheiloplasty)
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Cleft lip
    term:
      id: HP:0410030
      label: Cleft lip
- name: Nutritional and feeding support in infancy
  description: >-
    Feeding difficulties in infancy are reported in every fully described CFNDS
    infant and have two convergent causes here: the orofacial cleft itself, which
    prevents an effective seal, and the neurodevelopmental component. Management
    is cleft-specific feeding equipment and positioning, calorie supplementation
    and growth monitoring, escalating to gastrostomy if feeding failure is
    severe. This closes the loop on the promoted Feeding difficulties in infancy
    phenotype: it was promoted from the HPO annotation set under the
    "changes management" rule in entry note (10), and this is the management it
    changes. Generic supportive care, not CFNDS-specific.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: nutritional support
    term:
      id: NCIT:C15433
      label: Nutritional Support
  target_phenotypes:
  - preferred_term: Feeding difficulties in infancy
    term:
      id: HP:0008872
      label: Feeding difficulties in infancy
- name: Orchidopexy for cryptorchidism
  description: >-
    Surgical orchidopexy for undescended testis, conventionally between 6 and 18
    months of age, following general paediatric urology practice rather than any
    CFNDS-specific protocol. Included because cryptorchidism was promoted into
    the `phenotypes:` list under the "changes management" rule in entry note
    (10), and this is the management it changes: the phenotype is only worth
    recording if it triggers examination and referral within the window in which
    orchidopexy protects fertility and reduces malignancy risk. Reported in one
    of the two index individuals (HPO annotation 1/1); no CFNDS-specific
    urological outcome data exist.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: orchiopexy
    term:
      id: NCIT:C111066
      label: Orchiopexy
  target_phenotypes:
  - preferred_term: Cryptorchidism
    term:
      id: HP:0000028
      label: Cryptorchidism
- name: Audiological surveillance and hearing support
  description: >-
    Bilateral conductive hearing loss has been reported and is expected in a
    child with cleft palate. Regular audiometry, treatment of middle-ear effusion
    and amplification where indicated protect the speech and language development
    that is already at risk from the neurodevelopmental component.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Speech and language therapy
  description: >-
    A high priority in this syndrome specifically, because three separate
    contributors converge on speech: the palatal cleft itself, the conductive
    hearing loss that accompanies it, and the global developmental delay. Therapy
    should be coordinated with the timing of palatoplasty and with audiological
    management.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: speech therapy
    term:
      id: NCIT:C159273
      label: Speech Language Therapy
- name: Developmental and educational therapy
  description: >-
    Early intervention, physical and occupational therapy, and an individualised
    educational programme, directed at the developmental delay and intellectual
    disability. Symptomatic and supportive only.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
- name: Cardiac evaluation and management
  description: >-
    Echocardiography at diagnosis, with cardiology follow-up and surgical repair
    of any structural lesion according to standard congenital heart disease
    practice. No lesion pattern specific to CFNDS has been defined.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
- name: Genetic counselling
  description: >-
    CFNDS is autosomal recessive, so unaffected carrier parents have a 25%
    recurrence risk in each pregnancy. Several reported families were
    consanguineous. Once the familial alleles are known, carrier testing and
    prenatal or preimplantation testing become available. Counselling should note
    that structural deletions are a common allele class and that a targeted
    deletion assay, rather than sequencing alone, may be needed for accurate
    carrier testing.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
differential_diagnoses:
- name: Cardiofaciocutaneous syndrome
  description: >-
    A RASopathy caused by heterozygous gain-of-function variants in BRAF,
    MAP2K1, MAP2K2 or KRAS. It is included here primarily as a NAMING hazard
    rather than a close clinical mimic: "cardiofaciocutaneous" and
    "cardiofacioneurodevelopmental" differ by one word element, both abbreviate
    to a CF acronym, and a literature search or an automated entity resolver can
    silently substitute one for the other. Clinically the two do share
    craniofacial dysmorphism, congenital heart disease, growth retardation and
    intellectual disability, so the distinction also matters at the bedside. The
    discriminators are the ectodermal features and the inheritance pattern.
  distinguishing_features:
  - Autosomal dominant, usually de novo, versus autosomal recessive for CFNDS
  - Caused by RAS-MAPK pathway genes (BRAF, MAP2K1, MAP2K2, KRAS), not CCDC32
  - Hyperkeratotic skin and sparse curly hair are cardinal, and have not been reported
    in CFNDS
  - Bilateral cleft lip and palate is the core craniofacial feature of CFNDS but is
    not characteristic of cardiofaciocutaneous syndrome
  - Pulmonic stenosis and hypertrophic cardiomyopathy are the characteristic RASopathy
    cardiac lesions
  disease_term:
    preferred_term: cardiofaciocutaneous syndrome
    term:
      id: MONDO:0015280
      label: cardiofaciocutaneous syndrome
  notes: >-
    Verified not to be an ancestor of MONDO:0030873. `runoak -i sqlite:obo:mondo
    ancestors MONDO:0030873` returns only MONDO:0003847 (hereditary disease),
    MONDO:7770008, MONDO:7770009, MONDO:0000001 and MONDO:0700096 above this
    entry, none of which is MONDO:0015280.
  evidence:
  - reference: PMID:20301365
    reference_title: Cardiofaciocutaneous Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CLINICAL CHARACTERISTICS: Cardiofaciocutaneous (CFC) syndrome is characterized\
      \ by cardiac abnormalities (pulmonic stenosis and other valve dysplasias, septal\
      \ defects, hypertrophic cardiomyopathy, rhythm disturbances), distinctive craniofacial\
      \ appearance, and cutaneous abnormalities"
    explanation: >-
      The GeneReviews definition of the differential, showing that the cutaneous
      component is cardinal to it and absent from CFNDS.
  - reference: PMID:20301365
    reference_title: Cardiofaciocutaneous Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The diagnosis of CFC syndrome is established in a proband with suggestive
      clinical findings by the identification of a heterozygous pathogenic variant in
      BRAF, MAP2K1, MAP2K2, or KRAS by molecular genetic testing.
    explanation: >-
      Establishes the genetic discriminator: heterozygous RAS-MAPK pathway
      variants rather than biallelic CCDC32 variants.
  - reference: PMID:20301365
    reference_title: Cardiofaciocutaneous Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: CFC syndrome is inherited in an autosomal dominant manner.
    explanation: Establishes the inheritance discriminator.
- name: AP2M1-related intellectual developmental disorder with seizures
  description: >-
    Caused by heterozygous de novo variants in AP2M1, which encodes the mu2
    subunit of the same AP-2 complex that CCDC32 assembles. This is the
    mechanistically closest human disorder: it disrupts the same endpoint from
    inside the complex rather than from the chaperone that builds it. The
    phenotypes diverge, which is itself informative, since AP2M1 disease is a
    dominant epileptic-encephalopathy-like neurodevelopmental phenotype without
    the orofacial clefting and laterality anomalies that define CFNDS.
  distinguishing_features:
  - Autosomal dominant de novo, versus autosomal recessive for CFNDS
  - Caused by AP2M1 (HGNC:564), an AP-2 subunit, rather than CCDC32, the AP-2 assembly
    chaperone
  - Seizures are a defining feature, and have not been reported in CFNDS
  - Orofacial clefting, laterality anomalies and congenital cardiac malformation are
    not features
  disease_term:
    preferred_term: AP2M1-related intellectual developmental disorder with seizures
    term:
      id: MONDO:0032823
      label: intellectual developmental disorder 60 with seizures
  notes: >-
    The MONDO binding was verified by `runoak -i sqlite:obo:mondo relationships
    --direction both HGNC:564`, which returns MONDO:0032823 with predicate
    RO:0004003 for AP2M1. The evidence items below characterise the DIFFERENTIAL
    entity, not CFNDS; no claim about CFNDS is sourced from them.
  evidence:
  - reference: PMID:31104773
    reference_title: A Recurrent Missense Variant in AP2M1 Impairs Clathrin-Mediated
      Endocytosis and Causes Developmental and Epileptic Encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We subsequently found the same de novo variant in two individuals with
      neurodevelopmental disorders and generalized epilepsy in a cohort of 2,310 individuals
      who underwent diagnostic whole-exome sequencing.
    explanation: >-
      Establishes the de novo dominant inheritance and the epilepsy-dominated
      phenotype that discriminate this disorder from CFNDS.
  - reference: PMID:31104773
    reference_title: A Recurrent Missense Variant in AP2M1 Impairs Clathrin-Mediated
      Endocytosis and Causes Developmental and Epileptic Encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We identified a de novo c.508C>T (p.Arg170Trp) variant in AP2M1 in two
      individuals with a phenotypic similarity that was higher than expected by chance
      (p = 0.003) and a phenotype related to epilepsy with myoclonic-atonic seizures.
    explanation: >-
      Names the recurrent allele and the seizure phenotype, neither of which has
      a counterpart in CFNDS.
- name: Ciliopathy with craniofacial, cardiac and laterality involvement
  description: >-
    The founding report explicitly framed CFNDS as overlapping the ciliopathies,
    on the basis of the laterality anomalies and the craniofacial and brain
    findings. In practice a child with orofacial clefting, a congenital cardiac
    lesion, situs abnormality and posterior-fossa anomaly will be worked up for
    the ciliopathy spectrum, and CCDC32 should be in that differential rather
    than outside it. No single MONDO grouping term is bound here because the
    candidate entities span several distinct disorders rather than one, and
    picking any one of them would assert a specific alternative diagnosis that
    the source does not support.
  distinguishing_features:
  - Retinal degeneration, cystic kidney disease and postaxial polydactyly are cardinal
    in the classic ciliopathies and have not been reported in CFNDS
  - Bilateral cleft lip and palate is the core CFNDS feature and is not typical of
    the classic ciliopathies
  - CFNDS is caused by CCDC32, which is an AP-2 assembly chaperone rather than a
    structural or transport component of the cilium
  evidence:
  - reference: PMID:32307552
    reference_title: Loss of function mutations in CCDC32 cause a congenital syndrome
      characterized by craniofacial, cardiac and neurodevelopmental anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Because some of the patient phenotypes overlap defects common to ciliopathies,
      we asked if loss of CCDC32 might contribute to the dysfunction of this organelle.
    explanation: >-
      The authors themselves note the phenotypic overlap with ciliopathies, which
      is the reason this differential is listed.
animal_models:
- species: Danio rerio
  genotype: Morpholino and deletion depletion of ccdc32 in zebrafish embryos
  description: >-
    Depletion of the zebrafish orthologue of CCDC32 reproduces the human
    malformation pattern and impairs cilium formation. This is the only in vivo
    model of the disorder that has been published, and it is the sole source of
    the ciliary arm of the proposed pathomechanism. A second, independent
    zebrafish deletion experiment was reported in PMID:35451546. No mouse model
    of Ccdc32 deficiency was located during curation.
  genes:

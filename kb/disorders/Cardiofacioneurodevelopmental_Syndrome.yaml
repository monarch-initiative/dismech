notes: >-
  CFNDS (MONDO:0030873, OMIM:619123) is the CCDC32-related recessive syndrome, distinct from cardiofaciocutaneous
  syndrome, a RASopathy. The GeneReviews reference in the differential section concerns that different
  disease. The small, variably investigated clinical series supports individual observations, not population
  frequency bands or genotype-based prognosis. Mechanistic experiments use engineered cell lines or zebrafish
  except for the explicitly identified patient fibroblast RNA study; neither a specific developmental
  receptor nor a complete causal route to the human malformations has been established. Supportive interventions
  are phenotype-directed extrapolations unless a source states otherwise.

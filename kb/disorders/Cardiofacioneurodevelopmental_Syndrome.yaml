      evidence_source: MODEL_ORGANISM
      snippet: arguing that ciliary defects are at least partially involved in the
        pathomechanism of this disorder
      explanation: >-
        The authors own statement of the edge, quoted with their hedge intact.
        PARTIAL because "at least partially" is exactly the uncertainty this
        edge type encodes.
  evidence:

- name: CCDC32
  gene_term:
    preferred_term: CCDC32
    term:
      id: hgnc:28295
      label: CCDC32
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Biallelic loss-of-function variants
  notes: >-
    CCDC32 (HGNC:28295) lies at 15q15.1 and was previously designated C15orf57;
    the older symbol is still used in some of the mechanistic literature and in
    PMID:33859415, and searching only for the current symbol will miss that
    paper. The gene encodes a 185-amino-acid coiled-coil protein. It is the only
    gene linked to this disease in MONDO: `runoak -i sqlite:obo:mondo
    relationships HGNC:28295` returns MONDO:0030873 as the sole disease
    relationship. No genotype-phenotype correlation has been proposed, and with
    fewer than ten reported individuals none could be established.


    TRANSCRIPT-VERSION HAZARD - READ BEFORE COMPARING HGVS STRINGS. The two
    founding frameshift alleles are published in PMID:32307552 as
    NM_001080791.2:c.54dupT p.(Thr19Tyrfs*12) and NM_001080791.2:c.189_190dupGG
    p.(Glu64Glyfs*12), but every CURRENT RefSeq transcript for CCDC32 numbers the
    same two alleles 27 nucleotides (9 codons) lower, as c.27dup p.Thr10fs and
    c.162_163dup p.Glu55fs. This is a transcript-VERSION difference, not a
    transcript-CHOICE difference: the ClinVar records for these alleles
    (VCV000988600.1 and VCV000988601.1, retrieved from the NCBI eutils ClinVar
    esummary and VCV efetch endpoints on 2026-08-01) list c.27dup and
    c.162_163dup identically on NM_001080791.4, NM_001080792.4 (MANE Select),
    NM_052849.5 and ten further variants, so no currently distributed transcript
    reproduces the published numbering. The 9-residue offset is the same one that
    explains the 194-versus-185-amino-acid protein-length discrepancy in the
    literature, and PMID:41489497 documents it directly (see the evidence item on
    the Family B variant below). A search for the published `c.54dupT` string
    will therefore return nothing in ClinVar; search the ClinVar or dbSNP
    identifier instead.


    GENE-LEVEL CONSTRAINT. gnomAD GRCh38 constraint for CCDC32
    (ENSG00000128891), retrieved from the gnomAD GraphQL API
    (https://gnomad.broadinstitute.org/api) on 2026-08-01, is pLI = 0.16 and
    LOEUF (`oe_lof_upper`) = 0.78, from 9 observed against 20.1 expected
    loss-of-function alleles. Both values indicate the gene is TOLERANT of
    heterozygous loss of function - the expected signature for a recessive
    disease gene, and consistent with the unaffected heterozygous parents and
    sibs reported in every family. LOEUF 0.78 sits well above the conventional
    <0.6 threshold used to flag dominant-acting Mendelian genes, so a
    heterozygous CCDC32 loss-of-function finding should NOT be reported as
    disease-causing on constraint grounds. (These are the values returned today;
    the deep-research artifact for this entry quotes pLI 0.19 / LOEUF 0.76 from an
    earlier gnomAD release, and the numbers recorded here are the ones actually
    verified rather than the ones taken from the report.)


    NO CLINGEN VARIANT-LEVEL CURATION EXISTS. `CCDC32[gene]` in the NCBI ClinVar
    esearch endpoint on 2026-08-01 returned 29 variation records, of which five
    are asserted against cardiofacioneurodevelopmental syndrome: four Pathogenic
    (the two frameshift duplications and the two large deletions, all with
    "criteria provided, single submitter" or "no assertion criteria provided"
    review status - none expert-panel reviewed) and one nonsense VUS. No ClinGen
    variant-curation expert-panel assertion and no ClinGen dosage-sensitivity
    curation exists for this gene; see entry note (11).

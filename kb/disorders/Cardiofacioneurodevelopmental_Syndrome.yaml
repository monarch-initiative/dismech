- name: Disrupted Craniofacial, Cardiac and Neural Morphogenesis
  description: >-
    The convergent developmental outcome. Failure of the endocytic and possibly
    ciliary machinery during embryogenesis produces the syndrome: failure of
    fusion of the facial prominences giving bilateral cleft lip and palate,
    congenital cardiac malformation, disturbed left-right patterning, and
    maldevelopment of midline and posterior-fossa brain structures giving
    corpus-callosum hypoplasia and cerebellar hypoplasia.

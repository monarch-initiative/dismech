    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These findings demonstrate that AP2 is assembled by a handover mechanism switching from AAGAB-based
      initiation complexes to CCDC32-based template complexes.
    explanation: >-
      Biochemical reconstitution supports ordered handover between assembly factors.
  - reference: PMID:42234739
    reference_title: CCDC32 collaborates with the membrane to assemble the AP-2 clathrin adaptor complex.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      coiled-coil domain-containing protein 32 (CCDC32), whose deletion causes loss of all AP-2 subunits
      in vivo
    explanation: >-
      States the consequence of losing CCDC32 for the complex as a whole, which
      is the step this node models.
  - reference: PMID:33859415
    reference_title: A genome-wide atlas of co-essential modules assigns function to uncharacterized genes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-

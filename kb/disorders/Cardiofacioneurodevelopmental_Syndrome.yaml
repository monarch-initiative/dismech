differential_diagnoses:
- name: Cardiofaciocutaneous syndrome
  description: >-
    A RASopathy caused by heterozygous gain-of-function variants in BRAF,
    MAP2K1, MAP2K2 or KRAS. It is included here primarily as a NAMING hazard
    rather than a close clinical mimic: "cardiofaciocutaneous" and
    "cardiofacioneurodevelopmental" differ by one word element, both abbreviate
    to a CF acronym, and a literature search or an automated entity resolver can
    silently substitute one for the other. Clinically the two do share
    craniofacial dysmorphism, congenital heart disease, growth retardation and
    intellectual disability, so the distinction also matters at the bedside. The
    discriminators are the ectodermal features and the inheritance pattern.
  distinguishing_features:
  - Autosomal dominant, usually de novo, versus autosomal recessive for CFNDS
  - Caused by RAS-MAPK pathway genes (BRAF, MAP2K1, MAP2K2, KRAS), not CCDC32
  - Cutaneous abnormalities are central to the CFC GeneReviews description; the small CFNDS series does not establish their universal absence.
  - Bilateral cleft lip and palate is the core craniofacial feature of CFNDS but is not characteristic of cardiofaciocutaneous syndrome
  - Pulmonic stenosis and hypertrophic cardiomyopathy are the characteristic RASopathy cardiac lesions
  disease_term:
    preferred_term: cardiofaciocutaneous syndrome
    term:
      id: MONDO:0015280
      label: cardiofaciocutaneous syndrome
  evidence:
  - reference: PMID:20301365
    reference_title: Cardiofaciocutaneous Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CLINICAL CHARACTERISTICS: Cardiofaciocutaneous (CFC) syndrome is characterized by cardiac abnormalities
      (pulmonic stenosis and other valve dysplasias, septal defects, hypertrophic cardiomyopathy, rhythm
      disturbances), distinctive craniofacial appearance, and cutaneous abnormalities
    explanation: >-
      GeneReviews characterizes the different RASopathy, including its cutaneous component; it cannot
      prove absence of those findings in CFNDS.
  - reference: PMID:20301365
    reference_title: Cardiofaciocutaneous Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of CFC syndrome is established in a proband with suggestive clinical findings by the
      identification of a heterozygous pathogenic variant in BRAF, MAP2K1, MAP2K2, or KRAS by molecular
      genetic testing.
    explanation: >-
      Establishes the genetic discriminator: heterozygous RAS-MAPK pathway
      variants rather than biallelic CCDC32 variants.
  - reference: PMID:20301365
    reference_title: Cardiofaciocutaneous Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CFC syndrome is inherited in an autosomal dominant manner.
    explanation: Establishes the inheritance discriminator.
- name: AP2M1-related intellectual developmental disorder with seizures
  description: >-
    AP2M1 encodes the mu2 subunit of AP-2. A recurrent heterozygous de novo p.Arg170Trp allele causes
    a developmental and epileptic encephalopathy, providing a mechanistic differential. Different AP-2
    pathway defects need not produce identical organ phenotypes.
  distinguishing_features:
  - Autosomal dominant de novo, versus autosomal recessive for CFNDS
  - Caused by AP2M1 (HGNC:564), an AP-2 subunit, rather than CCDC32, the AP-2 assembly chaperone
  - Generalized epilepsy is central to the cited AP2M1 series; absence of seizures is not established as an exclusion criterion for CFNDS.
  disease_term:
    preferred_term: AP2M1-related intellectual developmental disorder with seizures
    term:
      id: MONDO:0032823
      label: intellectual developmental disorder 60 with seizures
  evidence:
  - reference: PMID:31104773
    reference_title: A Recurrent Missense Variant in AP2M1 Impairs Clathrin-Mediated Endocytosis and Causes Developmental and Epileptic Encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We subsequently found the same de novo variant in two individuals with neurodevelopmental disorders
      and generalized epilepsy in a cohort of 2,310 individuals who underwent diagnostic whole-exome sequencing.
    explanation: >-
      Establishes the de novo dominant inheritance and the epilepsy-dominated
      phenotype that discriminate this disorder from CFNDS.
  - reference: PMID:31104773
    reference_title: A Recurrent Missense Variant in AP2M1 Impairs Clathrin-Mediated Endocytosis and Causes Developmental and Epileptic Encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a de novo c.508C>T (p.Arg170Trp) variant in AP2M1 in two individuals with a phenotypic
      similarity that was higher than expected by chance (p = 0.003) and a phenotype related to epilepsy
      with myoclonic-atonic seizures.
    explanation: >-
      Identifies the recurrent AP2M1 allele and its seizure phenotype.
- name: Ciliopathy with craniofacial, cardiac and laterality involvement
  description: >-
    The founding report explicitly framed CFNDS as overlapping the ciliopathies,
    on the basis of the laterality anomalies and the craniofacial and brain
    findings. In practice a child with orofacial clefting, a congenital cardiac
    lesion, situs abnormality and posterior-fossa anomaly will be worked up for
    the ciliopathy spectrum, and CCDC32 should be in that differential rather
    than outside it. No single MONDO grouping term is bound here because the
    candidate entities span several distinct disorders rather than one, and
    picking any one of them would assert a specific alternative diagnosis that
    the source does not support.
  distinguishing_features:
  - Different ciliopathies have different retinal, renal, skeletal and laterality findings; there is no universal distinguishing feature across this group.
  - Ophthalmologic and renal evaluations were normal in the two liveborn founding CFNDS individuals, which does not establish lifelong or universal absence of disease in these organs.
  - CCDC32 regulates AP-2 and coated-pit function; the biochemical route to its reported ciliary phenotype remains unresolved.
  evidence:
  - reference: PMID:32307552
    reference_title: Loss of function mutations in CCDC32 cause a congenital syndrome characterized by craniofacial, cardiac and neurodevelopmental anomalies.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because some of the patient phenotypes overlap defects common to ciliopathies, we asked if loss
      of CCDC32 might contribute to the dysfunction of this organelle.
    explanation: >-
      The authors themselves note the phenotypic overlap with ciliopathies, which
      is the reason this differential is listed.
animal_models:
- species: Danio rerio
  genotype: Mosaic F0 ccdc32 CRISPR/Cas9 disruption using two independent exon-2 sgRNAs
  description: >-
    One 2020 study used two independently targeted mosaic F0 zebrafish cohorts. Findings included reduced
    head size, altered craniofacial cartilage angle, hypoplastic cerebella, abnormal cardiac looping and
    southpaw expression, and fewer, shorter Kupffer vesicle cilia. The two sgRNAs are experimental replication
    within this paper. The 2022 clinical report cites the same study. These fish do not directly model
    human cleft lip/palate fusion, chamber septation or digital abnormalities.
  associated_phenotypes:
  - Reduced head size
  - Altered craniofacial cartilage angle
  - Hypoplastic cerebellum
  - Abnormal cardiac looping
  - Abnormal southpaw expression
  - Reduced Kupffer vesicle cilia number and length

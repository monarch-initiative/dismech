    explanation: >-
      Direct live-cell demonstration of the coated-pit phenotype caused by loss
      of CCDC32.
- name: Deficient Clathrin-Mediated Endocytosis
  description: >-
    The functional read-out of the coated-pit defect is reduced receptor-mediated
    internalisation, measured in the primary literature as impaired transferrin
    receptor uptake. Clathrin-mediated endocytosis controls the surface residence
    and signalling output of most developmental receptors, and its failure is the
    proposed bridge between the molecular lesion and the malformation phenotype.
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: Clathrin-dependent endocytosis
    term:
      id: GO:0072583
      label: clathrin-dependent endocytosis
    modifier: DECREASED
  downstream:
  - target: Disrupted Craniofacial, Cardiac and Neural Morphogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      No specific receptor, signalling pathway or cell population has been shown
      to link the endocytic deficit to the human malformations. The supporting
      argument is comparative: mice lacking individual AP2 subunits develop cleft
      palate and cardiac defects, and the clinical features of CCDC32 loss
      resemble those of AP2 loss-of-function mutations.
    evidence:
    - reference: PMID:41489497
      reference_title: CCDC32 stabilizes clathrin-coated pits and drives their invagination.
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: it is interesting that the clinical features of CCDC32 loss-of-function
        are similar to those resulting from AP2 loss-of-function mutations
      explanation: >-
        The comparative argument that the endocytic lesion explains the clinical
        picture. PARTIAL because resemblance between two disease phenotypes is
        an analogy, not a demonstrated causal chain, which is why this edge is
        typed INDIRECT_UNKNOWN_INTERMEDIATES.
  evidence:
  - reference: PMID:33859415
    reference_title: A genome-wide atlas of co-essential modules assigns function to
      uncharacterized genes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We also show that C15orf57 encodes a protein that binds the AP2 complex,

      pits and enables efficient transferrin uptake.
    explanation: >-
      The unbiased co-essentiality screen that first assigned CCDC32 (C15orf57)
      to the AP2 module.
  - reference: PMID:42234739
    reference_title: CCDC32 collaborates with the membrane to assemble the AP-2 clathrin adaptor complex.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Unexpectedly, in solution, CCDC32 prevents complex assembly and actively disassembles AP-2 tetramers.
      Inhibition requires the amphipathic helices of CCDC32, which also mediate binding to phosphatidylinositol
      4,5-bisphosphate (PIP2)-containing membranes. The presence of PIP2-containing membrane stabilizes
      the final stages of assembly.
    explanation: >-
      Biochemical reconstitution establishes the membrane dependence of the assembly process; this is
      not a direct patient membrane-binding assay.

discussions:
- discussion_id: ccdc32_ap2_versus_cilia
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Do the craniofacial, cardiac and brain malformations of CFNDS arise from the
    endocytic consequences of failed AP-2 assembly, from a ciliary defect, or
    from both?
  attaches_to:
  - pathophysiology#Defective Ciliogenesis
  - pathophysiology#Deficient Clathrin-Mediated Endocytosis
  rationale: >-
    The endocytic arm has by far the stronger molecular evidence: three
    independent structural and cell-biological studies published between 2024 and
    2026 converge on CCDC32 being the assembly chaperone of AP-2, and a
    patient-derived truncation has been shown directly to abolish AP2 binding and
    inhibit endocytosis. The ciliary arm rests on one 2020 paper, has not been
    replicated, and was hedged by its own authors as being "at least partially"
    involved. But the endocytic arm has never been connected to a human
    malformation: its supporting argument for the developmental phenotype is the
    resemblance between CFNDS and mouse AP2-subunit knockouts, which is an
    analogy rather than a demonstration. Meanwhile the laterality anomalies in the
    founding families are hard to explain from endocytosis alone and are the
    canonical readout of motile-cilium dysfunction. The two models are not
    mutually exclusive, because clathrin-mediated endocytosis participates in
    ciliary membrane trafficking, so an endocytic primary defect could produce a
    secondary ciliary phenotype. Resolving this would require examining cilia in
    cells carrying a patient CCDC32 genotype, which no published study has done.
  notes: >-
    Both edges into the morphogenesis node are curated as
    INDIRECT_UNKNOWN_INTERMEDIATES precisely because of this gap.
  evidence:
  - reference: PMID:32307552
    reference_title: Loss of function mutations in CCDC32 cause a congenital syndrome
      characterized by craniofacial, cardiac and neurodevelopmental anomalies.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: arguing that ciliary defects are at least partially involved in the pathomechanism
      of this disorder
    explanation: >-
      The ciliary side of the question, stated by its own authors as a partial
      explanation, which is the hedge that keeps the question open.
  - reference: PMID:41489497
    reference_title: CCDC32 stabilizes clathrin-coated pits and drives their invagination.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Our results suggest that the inability to bind mature AP2 and hence to
      be recruited to nascent CCSs inhibits critical early stages of CME and contributes
      to the development of CFNDS.
    explanation: >-
      The endocytic side of the question, also phrased as a suggestion and a
      contribution rather than as a demonstrated cause.
- discussion_id: ccdc32_ap2_chaperone_mechanism
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is CCDC32 a transient assembly chaperone that is released before AP-2
    matures, or does it also bind the mature complex and act at clathrin-coated
    pits?
  attaches_to:
  - pathophysiology#Failure of AP-2 Adaptor Complex Assembly
  - pathophysiology#Clathrin-Coated Pit Destabilization
  rationale: >-
    PMID:39145939 reconstituted an ordered handover in which AAGAB initiates
    assembly, CCDC32 forms a ternary template that recruits the remaining
    subunits, and CCDC32 is then released; those authors could not detect
    interaction between a C-terminally tagged CCDC32 and the mature AP2 complex.
    PMID:41489497 reports the opposite on that point, finding that CCDC32 binds
    full-length AP2 complexes in cells, is recruited to clathrin-coated pits, and
    is required for their stabilisation and invagination, and it notes the
    discrepancy explicitly. PMID:42234739 adds a third layer: in solution CCDC32
    prevents assembly and actively disassembles AP-2 tetramers, and it is the
    presence of PIP2-containing membrane that permits assembly to complete, so
    the protein is proposed to be an inhibitor released by a membrane switch. The
    disagreement may be partly technical, since the tagging strategy differs
    between studies, but it is unresolved. For CFNDS the practical consequence is
    limited: on all three models, a truncation that removes the AP-2-binding
    helix is loss of function.
  evidence:
  - reference: PMID:42234739
    reference_title: CCDC32 collaborates with the membrane to assemble the AP-2 clathrin
      adaptor complex.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Unexpectedly, in solution, CCDC32 prevents complex assembly and actively
      disassembles AP-2 tetramers.
    explanation: >-
      The third and most recent model, in which CCDC32 is inhibitory until
      membrane relieves the inhibition.
  - reference: PMID:42234739
    reference_title: CCDC32 collaborates with the membrane to assemble the AP-2 clathrin
      adaptor complex.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: We propose that the membrane acts as a molecular switch to release inhibitory
      interactions, allowing for full complex assembly to proceed.
    explanation: The proposed reconciliation, which is itself a hypothesis.
- discussion_id: ccdc32_hypomorph_versus_null
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Are the reported CFNDS alleles true nulls, or must they retain residual
    function for the pregnancy to be viable?
  attaches_to:
  - pathophysiology#Biallelic CCDC32 Loss of Function
  rationale: >-
    Complete loss of CCDC32 abolishes AP-2 complexes, and complete loss of AP2
    has been reported to be embryonic lethal in Drosophila and zebrafish. The
    authors of PMID:41489497 therefore argue that the human CFNDS alleles must be
    hypomorphic rather than null, while acknowledging that nonsense-mediated
    decay could instead mean the truncated proteins are simply not expressed. One
    of the reported CFNDS conceptions was a terminated fetus, which is at least
    consistent with severe alleles being poorly tolerated. Distinguishing these
    possibilities requires measuring CCDC32 transcript and protein in patient
    cells, which has not been reported.
  notes: >-
    This question bears directly on whether a constitutive knockout would be a
    valid model of the human disease. No such model has been published, so the
    issue is recorded rather than resolved.
  evidence:
  - reference: PMID:41489497
    reference_title: CCDC32 stabilizes clathrin-coated pits and drives their invagination.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: we suggest that the disease-associated CFNDS mutants are hypomorphic
    explanation: The hypomorph side of the question, phrased by its authors as a suggestion.
  - reference: PMID:41489497
    reference_title: CCDC32 stabilizes clathrin-coated pits and drives their invagination.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: While we cannot rule out nonsense-mediated decay and resulting loss of
      expression of the truncated human mutations
    explanation: >-
      The competing possibility, that the alleles are effectively null because
      the transcripts are degraded, acknowledged by the same authors.
- discussion_id: ccdc32_recurrent_15q15_deletion
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Are the two large CCDC32 deletions a single recurrent allele generated by
    non-allelic homologous recombination at 15q15.1, or a founder allele, or
    coincidentally similar independent events?
  attaches_to:
  - pathophysiology#Biallelic CCDC32 Loss of Function
  rationale: >-
    Three of the five reported CFNDS families carry a structural deletion rather
    than a point mutation, which is an unusually high proportion for a gene this
    small, and two of those deletions have near-identical breakpoints. ClinVar
    records the Abdalla allele as NC_000015.10:g.40529942_40562524del
    (VCV001690313) and the Fernandes da Rocha allele as
    NC_000015.10:g.(40529939_40562522)del (VCV002431643) - a difference of 3 bp at
    the proximal breakpoint and 2 bp at the distal one, between patients
    ascertained independently in Egypt/Hamburg and in Porto. Two mechanisms would
    explain that: a repeat-mediated recurrent rearrangement, in which flanking
    low-copy repeats at 15q15.1 make the same deletion arise repeatedly by
    non-allelic homologous recombination, or a shared founder haplotype. The two
    have opposite consequences for practice. A recurrent NAHR allele would mean
    the deletion arises de novo at appreciable frequency in any population, that
    a targeted breakpoint assay would be a worthwhile first-line test worldwide,
    and that carrier screening cannot be restricted by ancestry. A founder allele
    would confine that reasoning to one population. Nothing published
    distinguishes them: no segmental-duplication analysis of the interval has
    been reported, neither paper reports a breakpoint junction sequence, no
    haplotype has been typed across the two families, and the difference of a few
    base pairs may be nothing more than differing CNV-calling resolution between
    two laboratories rather than a real difference in the alleles. Resolving this
    needs breakpoint-junction sequencing in both families plus a repeat-content
    analysis of 15q15.1; both are straightforward and neither has been done.
  notes: >-
    THIS IS A HYPOTHESIS, NOT A FINDING, AND IS CURATED AS A KNOWLEDGE GAP FOR
    THAT REASON. The breakpoint coordinates quoted in the rationale are ClinVar
    record fields retrieved from the NCBI eutils ClinVar esummary endpoint on
    2026-08-01, not statements made by either publication; the Fernandes da Rocha
    report (PMID:38818818) is indexed in PubMed without an abstract and its full
    text is not in the reference cache, so no evidence item can quote its
    breakpoints and the inference is explicitly not attributed to its authors.
    The ClinVar coordinates for that allele are additionally parenthesised, which
    in HGVS notation means the breakpoints are uncertain - so the apparent
    2-to-3-bp difference may not be a real difference at all. The lead was raised
    in section 4.2 of the deep-research artifact for this entry and is recorded
    here rather than dropped, with its provenance and its unresolved status
    stated, because it is testable and consequential.
  evidence:
  - reference: PMID:35451546
    reference_title: "Cardiofacioneurodevelopmental syndrome: Report of a novel patient\
      \ and expansion of the phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: We report a 9-year-old female patient with CFNDS caused by a homozygous
      32,583-bp deletion affecting CCDC32.
    explanation: >-
      The first of the two deletion alleles whose breakpoints are being compared,
      and the only one whose size is stated in a quotable published text.
  - reference: PMID:38818818
    reference_title: "A novel homozygous deletion in CCDC32 gene causing cardiofacioneurodevelopmental\
      \ syndrome: the fourth patient reported."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel homozygous deletion in CCDC32 gene causing cardiofacioneurodevelopmental\
      \ syndrome: the fourth patient reported."
    explanation: >-
      Establishes that a second, independently ascertained homozygous CCDC32
      deletion exists. The quoted text is the article title, because this report
      is indexed without an abstract; see entry note (5). Note that the authors
      call their allele "novel", which is a claim of independence rather than of
      recurrence, and that they had no way to compare breakpoints with the
      earlier report.
- discussion_id: ccdc32_expressivity_with_loss_of_function_alleles
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Why is expressivity so variable between individuals when every reported
    allele is a complete loss of function?
  attaches_to:
  - pathophysiology#Biallelic CCDC32 Loss of Function
  - phenotypes#Hypertelorism
  rationale: >-
    Every CFNDS allele reported to date is a truncation or a deletion, so there
    is no obvious allelic-series explanation for phenotypic differences. Yet the
    two index individuals differed in opposite directions on the same midline
    measurement, one being hypoteloric and the other hyperteloric, and the
    cardiac phenotype ranged from an atrioventricular canal defect with asplenia
    and abdominal situs inversus in one to an isolated ventricular septal defect
    with pulmonic stenosis in the other. Candidate explanations are unmapped
    modifier loci, differences in residual transcript escaping nonsense-mediated
    decay, and stochastic variation in a threshold-sensitive developmental
    process. None has been tested. The practical consequence is that no
    genotype-based prognostic counselling is possible.
  notes: >-
    The hypertelorism/hypotelorism discordance is taken from the HPO annotation
    for OMIM:619123 (both at 1/2, source PMID:32307552) and from the separately
    evidenced hypertelorism in PMID:35451546; it is recorded in the `notes:` of
    the two corresponding phenotypes rather than as an evidence item, because the
    underlying counts come from a full text that is not in the reference cache.
- discussion_id: ccdc32_phenotype_denominator_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the true frequency of each CFNDS feature, and what is the natural
    history beyond childhood?
  rationale: >-
    Fewer than ten affected individuals have been reported, in four separate
    papers, with non-uniform investigation: not every patient is documented as
    having had brain imaging, echocardiography or audiometry, so an apparent
    absence of a feature may be an absence of testing. No prospective natural
    history study, no survival data, no adult outcome and no population
    prevalence or carrier frequency exists. This entry therefore asserts no
    frequency band on any phenotype and no prevalence rate. The gap will close
    only through a multicentre case collection, which the diagnostic difficulty
    documented in PMID:41639596 suggests is likely to keep growing as RNA
    sequencing enters routine practice.
  evidence:
  - reference: PMID:41639596
    reference_title: Two siblings with CCDC32-related cardiofacioneurodevelopmental
      syndrome diagnosed by clinical RNA-sequencing and review of literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: So far, CFNDS has only been described in four living individuals and one
      terminated fetus from four families
    explanation: >-
      Quantifies the denominator problem: no frequency or natural-history claim
      can be made from a cohort of this size.

discussions:
- discussion_id: ccdc32_ap2_versus_cilia
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Do the craniofacial, cardiac and brain malformations of CFNDS arise from the
    endocytic consequences of failed AP-2 assembly, from a ciliary defect, or
    from both?
  attaches_to:
  - pathophysiology#Defective Ciliogenesis
  - pathophysiology#Deficient Clathrin-Mediated Endocytosis
  rationale: >-
    AP-2 assembly and coated-pit regulation have direct biochemical and cell-biological support. Ciliary
    changes and altered left-right patterning are demonstrated in the founding zebrafish and mouse-cell
    experiments. Their relationship remains unknown: neither a cilia-independent developmental route nor
    endocytosis-dependent disruption of cilia has been established in patient tissue.
  notes: >-
    Both proposed routes retain indirect edges to organ-level abnormalities.
  evidence:
  - reference: PMID:32307552
    reference_title: Loss of function mutations in CCDC32 cause a congenital syndrome characterized by craniofacial, cardiac and neurodevelopmental anomalies.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      arguing that ciliary defects are at least partially involved in the pathomechanism of this disorder
    explanation: >-
      The ciliary side of the question, stated by its own authors as a partial
      explanation, which is the hedge that keeps the question open.
  - reference: PMID:41489497
    reference_title: CCDC32 stabilizes clathrin-coated pits and drives their invagination.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our results suggest that the inability to bind mature AP2 and hence to be recruited to nascent CCSs
      inhibits critical early stages of CME and contributes to the development of CFNDS.
    explanation: >-
      The endocytic side of the question, also phrased as a suggestion and a
      contribution rather than as a demonstrated cause.
- discussion_id: ccdc32_ap2_chaperone_mechanism
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is CCDC32 a transient assembly chaperone that is released before AP-2
    matures, or does it also bind the mature complex and act at clathrin-coated
    pits?
  attaches_to:
  - pathophysiology#Failure of AP-2 Adaptor Complex Assembly
  - pathophysiology#Clathrin-Coated Pit Destabilization
  rationale: >-
    The 2024 reconstitution study describes ordered AAGAB-to-CCDC32 handover and release of CCDC32 during
    assembly. The 2026 coated-pit study detects recruitment and association with native AP-2, using different
    tagging and imaging conditions. The structural study adds a membrane-dependent switch: CCDC32 stabilizes
    alpha/sigma2 and prevents or reverses tetramer assembly in solution, while PIP2 membranes relieve
    inhibition. These observations allow context-dependent assembly and post-assembly roles. Partial knockdown
    leaves AP-2 abundance intact despite pit defects, whereas knockout reduces subunit abundance.
  evidence:
  - reference: PMID:42234739
    reference_title: CCDC32 collaborates with the membrane to assemble the AP-2 clathrin adaptor complex.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Unexpectedly, in solution, CCDC32 prevents complex assembly and actively disassembles AP-2 tetramers.
    explanation: >-
      The third and most recent model, in which CCDC32 is inhibitory until
      membrane relieves the inhibition.
  - reference: PMID:42234739
    reference_title: CCDC32 collaborates with the membrane to assemble the AP-2 clathrin adaptor complex.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We propose that the membrane acts as a molecular switch to release inhibitory interactions, allowing
      for full complex assembly to proceed.
    explanation: The proposed reconciliation, which is itself a hypothesis.
- discussion_id: ccdc32_hypomorph_versus_null
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    How much CCDC32 protein and activity remains for each patient genotype?
  attaches_to:
  - pathophysiology#Biallelic CCDC32 Loss of Function
  rationale: >-
    The coated-pit study discusses possible residual function and nonsense-mediated decay, but its 1-54
    construct is not an exact patient frameshift product. Patient RNA downregulation and exon skipping
    are now reported for the 2026 deletion family. These data do not quantify residual protein or AP-2/cilia
    function across alleles. Elective termination of the affected founding fetus is not evidence of biological
    lethality.
  notes: >-
    Constitutive engineered knockout and a patient truncation or exon deletion may have different consequences;
    matched patient-protein and functional assays would resolve this.
  evidence:
  - reference: PMID:41489497
    reference_title: CCDC32 stabilizes clathrin-coated pits and drives their invagination.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      our disease mimic construct CCDC32(1-54) does not contain a 9 aa peptide (VRGSCLRFQ) in the N-terminus
      and an extra 12 aa in the C-terminus when CFNDS patient mutation was described (p.(Glu64Glyfs∗12))
    explanation: >-
      Explicit limits of transferring results from the engineered construct to the patient protein.
  - reference: url:https://www.nature.com/articles/s41431-026-02023-y/figures/2
    reference_title: "Fig. 2: Deletion of exon 3 and 4 of CCDC32 in affected individuals. | European Journal of Human Genetics | European Journal of Human Genetics"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      (not included in the ID and MCA panels) exhibited notable downregulation with a Z-score of -8.20.
    explanation: >-
      Panel membership explains part of the diagnostic blind spot; the RNA outlier is patient-specific.
- discussion_id: ccdc32_recurrent_15q15_deletion
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What are the verified breakpoints and phase of the reported structural alleles?
  attaches_to:
  - pathophysiology#Biallelic CCDC32 Loss of Function
  rationale: >-
    The 2022 deletion spans 32,583 bp, and the 2026 siblings have an exon-3/4 deletion confirmed by PCR
    and Sanger sequencing. For the 2024 fourth patient, the paper title and ClinGen assessment differ:
    ClinGen describes suspected 21-kb and 9.7-kb deletions in trans and excluded the proband from scoring.
    Near-matching uncertain registry coordinates do not establish a recurrent rearrangement, shared founder
    allele or a first-line worldwide breakpoint assay.
  notes: >-
    Primary breakpoint and segregation data are needed before treating different structural records as
    the same allele.
  evidence:
  - reference: url:https://search.clinicalgenome.org/kb/gene-validity/CGGV:assertion_29c6c0dd-bbaf-45ce-92af-4c67059cac8f-2024-10-18T16:00:00.000Z
    reference_title: curation results for Gene-Disease Validity
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      An additional 21 kb deletion was reported in a fourth proband (PMID: 38818818) but was not included
      in this curation.
    explanation: >-
      ClinGen records an unscored fourth case; the primary report has no accessible abstract in the cache.
  - reference: url:https://search.clinicalgenome.org/kb/gene-validity/CGGV:assertion_29c6c0dd-bbaf-45ce-92af-4c67059cac8f-2024-10-18T16:00:00.000Z
    reference_title: curation results for Gene-Disease Validity
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the following suspected deletions in trans: a 21 kb deletion ... and a 9.7 kb deletion
    explanation: >-
      The ClinGen case-level explanation describes two suspected deletions in trans, rather than a proven
      recurrence of the 2022 allele.
- discussion_id: ccdc32_expressivity_with_loss_of_function_alleles
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Which factors account for variable expressivity among individuals with predicted loss-of-function
    alleles?
  attaches_to:
  - pathophysiology#Biallelic CCDC32 Loss of Function
  - phenotypes#Hypertelorism
  rationale: >-
    The founding individuals differ in interorbital distance, cardiac lesions and laterality. Their variants
    are predicted loss-of-function alleles, but equivalent complete loss of every CCDC32 activity has
    not been measured. Residual transcript or protein, modifier loci and developmental variability are
    possible explanations, not established mechanisms or prognostic markers.
  notes: >-
    The discordant facial and cardiac observations are directly described in the 2020 clinical full text.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7268788/
    reference_title: "Loss of function mutations in CCDC32 cause a congenital syndrome characterized by craniofacial, cardiac and neurodevelopmental anomalies - PMC"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dysmorphic features included hypotelorism, upslanting palpebral fissures, a stiff upper lip, missing
      teeth attributed to the clefting, vaulted palate with cleft, prominent ears, underdeveloped helices
      and micrognathia.
    explanation: >-
      A-II-1 had hypotelorism.
  - reference: url:https://www.ncbi.nlm.nih.gov/pmc/articles/PMC7268788/
    reference_title: "Loss of function mutations in CCDC32 cause a congenital syndrome characterized by craniofacial, cardiac and neurodevelopmental anomalies - PMC"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dysmorphic features included brachydactyly, hypertelorism, epicanthal folds, broad nasal root, a
      prominent large nose and malformed protruded ears.
    explanation: >-
      B-II-1 had hypertelorism.
- discussion_id: ccdc32_phenotype_denominator_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the true frequency of each CFNDS feature, and what is the natural
    history beyond childhood?
  rationale: >-
    The 2026 review describes six living individuals and one fetus across five families after including
    its two siblings. Ascertainment and investigations differ between reports. These data do not establish
    population prevalence, reliable per-feature frequencies, adult outcome or survival. Prospective standardized
    phenotyping and follow-up would address the gap.
  evidence:
  - reference: PMID:41639596
    reference_title: Two siblings with CCDC32-related cardiofacioneurodevelopmental syndrome diagnosed by clinical RNA-sequencing and review of literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      So far, CFNDS has only been described in four living individuals and one terminated fetus from four
      families
    explanation: >-
      Quantifies the denominator problem: no frequency or natural-history claim
      can be made from a cohort of this size.

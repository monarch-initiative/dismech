      reference_title: Two siblings with CCDC32-related cardiofacioneurodevelopmental syndrome diagnosed by clinical RNA-sequencing and review of literature.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Cardiofacioneurodevelopmental syndrome (CFNDS, MIM:619123) is a rare genetic disorder caused by
        bi-allelic pathogenic variants in CCDC32.

      id: hgnc:28295
      label: CCDC32
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: Biallelic loss-of-function variants
  notes: >-
    CCDC32, formerly C15orf57, is located at 15q15.1. The 2020 paper uses NM_001080791.2:c.54dupT, p.(Thr19Tyrfs*12)
    and c.189_190dupGG, p.(Glu64Glyfs*12). The 2024 ClinGen assertion represents the founding alleles
    on NM_001080792.4 as c.27dup, p.Thr10TyrfsTer12 and c.162_163dup, p.Glu55GlyfsTer12. Transcript accession
    and version must accompany comparisons. ClinGen classified the recessive gene-disease relationship
    as Moderate on 2024-10-18; this is a gene-level assessment, not a variant-level classification or
    a claim that all molecular functions are unresolved. Residual protein function and genotype-phenotype
    correlations remain uncertain.
  inheritance:
  - name: Autosomal recessive

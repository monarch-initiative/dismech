inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous SLC12A2 exon 21 variants, transmitted dominantly in familial cases and
    arising de novo in others. Segregation across three generations of one family
    establishes the dominant pattern; an independent de novo case establishes that a single
    new exon-21 allele is sufficient.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  evidence:
  - reference: PMID:34374074
    reference_title: "PNPT1, MYO15A, PTPRQ, and SLC12A2-associated genetic and phenotypic heterogeneity among hearing impaired assortative mating families in Southern India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the fourth family, the SLC12A2 novel variant was found to segregate with severe-to-profound HL causing DFNA78, across three generations."
    explanation: Dominant segregation over three generations in a single pedigree.
  - reference: PMID:40503591
    reference_title: "De Novo SLC12A2 Variant Presenting as Congenital Hearing Loss With Vestibular Areflexia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a patient with profound congenital hearing loss and vestibular areflexia with a de novo variant in SLC12A2 located in the splice donor site: NM_001046.2: c.2977+4_2977+7del causing an in-frame skip of exon 21, as shown by cDNA analysis."
    explanation: >-
      A de novo heterozygous allele producing the full phenotype, which is what shows one
      mutant copy is sufficient rather than merely co-segregating.
pathophysiology:
- name: SLC12A2 Exon 21 Variant
  biological_scale: MOLECULAR
  description: >-
    A heterozygous variant confined to exon 21 of SLC12A2 - either a missense substitution
    within the exon or a splice-site change that removes it. The reported splice alleles lie
    on both sides of the exon (a 3' splice-site change and a splice-donor deletion), and the
    consequence established by cDNA analysis is an in-frame skip rather than a frameshift, so
    the product is a shortened cotransporter rather than an absent one.
  genes:
  - preferred_term: SLC12A2
    term:
      id: hgnc:10911
      label: SLC12A2
  genetic_context:
    allele_type: missense within exon 21, or splice-site variant causing in-frame skipping of exon 21
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      LOSS_OF_FUNCTION records what was measured: chloride influx was significantly decreased
      for every DFNA78 variant tested in oocytes, and an independent cohort reproduced reduced
      cotransporter function for all its tested alleles. It deliberately does not record
      DOMINANT_NEGATIVE, even though the disease is dominant and NKCC1 is a dimer. The two
      allele classes may not share a route to dominance - the splice allele was shown to make
      an exon-21-skipped transcript present at much lower levels than the exon-21-included one
      in cochlea, which reads as isoform dose rather than as a poisoned dimer, while a missense
      subunit could act either way. That question is carried in
      discussions#dfna78_dominant_mechanism rather than settled by this tag.
  downstream:
  - target: Loss of the Inner-Ear-Restricted NKCC1 Exon 21 Isoform
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:40295800
    reference_title: "Complete omission of exon 21 from Slc12a2 transcripts in mice results in hearing loss."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "SLC12A2 is linked to autosomal dominant nonsyndromic hearing loss, DFNA78, with all the pathogenic variants affecting the exon 21."
    explanation: >-
      The confinement of the human allelic spectrum to one exon, which is the fact this whole
      entry is organised around. Graded OTHER: it is an introductory summary of the human
      genetic literature in a mouse paper, so the publication presents neither human clinical
      data nor mouse data for this particular statement.
  - reference: PMID:40503591
    reference_title: "De Novo SLC12A2 Variant Presenting as Congenital Hearing Loss With Vestibular Areflexia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, the published pathogenic variants causing DFNA78 are missense mutations located within exon 21 or in the 3' splice site of exon 21."
    explanation: >-
      Independent statement of the same restriction, and the source for the two allele classes
      recorded in genetic_context.
  - reference: PMID:32294086
    reference_title: "Variants encoding a restricted carboxy-terminal domain of SLC12A2 cause hereditary hearing loss in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All identified SLC12A2 variants mapped to exon 21 or its 3'-splice site."
    explanation: >-
      The original observation of the exon-21 restriction, in the cohort that established the
      entity.
  - reference: PMID:32294086
    reference_title: "Variants encoding a restricted carboxy-terminal domain of SLC12A2 cause hereditary hearing loss in humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro functional analysis demonstrated that Cl- influx was significantly decreased in all SLC12A2 variants studied."
    explanation: >-
      The measured functional consequence that LOSS_OF_FUNCTION in genetic_context records.
      Graded IN_VITRO because it is an oocyte transport assay, not a patient measurement.
  - reference: PMID:32658972
    reference_title: "SLC12A2 variants cause a neurodevelopmental disorder or cochleovestibular defect."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All tested variants were shown to reduce co-transporter function in Xenopus laevis oocytes."
    explanation: >-
      Independent replication of reduced cotransport in a separate cohort and laboratory, which
      is what makes the loss-of-transport claim more than a single-assay result.
- name: Loss of the Inner-Ear-Restricted NKCC1 Exon 21 Isoform
  biological_scale: MOLECULAR
  description: >-
    SLC12A2 produces several isoforms, only one of which contains exon 21. That isoform is
    almost exclusively expressed in the inner ear and is the one required for endolymph
    homeostasis. An exon-21 lesion therefore removes or corrupts a cochlea-specific form of
    the transporter while leaving the widely expressed forms intact - the structural reason a
    gene active in neurons, glia, trachea, salivary glands, intestine and sweat glands yields
    a hearing-only phenotype.
  molecular_functions:
  - preferred_term: NKCC1 sodium-potassium-chloride cotransport
    modifier: LOSS_OF_FUNCTION
    term:
      id: GO:0008511
      label: sodium:potassium:chloride symporter activity
  downstream:
  - target: Failure of Basolateral Potassium Uptake by Strial Marginal Cells
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:40503591
    reference_title: "De Novo SLC12A2 Variant Presenting as Congenital Hearing Loss With Vestibular Areflexia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SLC12A2 functions as a dimer and has several isoforms; only one isoform contains exon 21, and this isoform is almost exclusively expressed in the inner ear/cochlea."
    explanation: >-
      Both halves of this node: the tissue restriction of the exon-21 isoform, and the dimeric
      assembly that the dominant-negative reading depends on.
  - reference: PMID:40503591
    reference_title: "De Novo SLC12A2 Variant Presenting as Congenital Hearing Loss With Vestibular Areflexia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This isoform is necessary for homeostasis of the endolymph."
    explanation: Assigns the endolymph function specifically to the exon-21-containing isoform.
  - reference: PMID:40503591
    reference_title: "De Novo SLC12A2 Variant Presenting as Congenital Hearing Loss With Vestibular Areflexia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our case adds to the evidence that loss of exon 21 of SLC12A2 leads to a cochlear restricted phenotype."
    explanation: >-
      The clinical counterpart of the expression argument: exon-21 loss confines the disease to
      the cochlea.
  - reference: PMID:32294086
    reference_title: "Variants encoding a restricted carboxy-terminal domain of SLC12A2 cause hereditary hearing loss in humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro analysis indicated that the splice-site variant generates an exon 21-skipped SLC12A2 mRNA transcript expressed at much lower levels than the exon 21-included transcript in the cochlea, suggesting a tissue-specific role for the exon 21-encoded region in the carboy-terminal domain."
    explanation: >-
      Transcript-level demonstration that the splice allele reduces the cochlear isoform rather
      than merely altering it, and the authors' own inference of a tissue-specific role for the
      exon-21 region. The source prints "carboy-terminal"; the snippet reproduces it exactly.
  notes: >-
    The molecular function is bound to sodium:potassium:chloride symporter activity, which is
    NKCC1's exact activity. What the ontology cannot express is that the lesion removes one
    isoform rather than the activity as a whole; that restriction is carried in the node
    description and in genetic_context.
- name: Failure of Basolateral Potassium Uptake by Strial Marginal Cells
  biological_scale: CELLULAR
  description: >-
    Strial marginal cells take up potassium across their basolateral membrane and secrete it
    apically into the endolymph. NKCC1 is the basolateral entry step, and it is described as
    crucial for regulating intracellular osmotic pressure and for producing endolymph. Losing
    the inner-ear isoform removes that entry step.
  cell_types:
  - preferred_term: strial marginal cell
    term:
      id: CL:0002492
      label: strial marginal cell
  biological_processes:
  - preferred_term: basolateral potassium ion transmembrane transport
    modifier: DECREASED
    term:
      id: GO:0071805
      label: potassium ion transmembrane transport
  locations:
  - preferred_term: stria vascularis of cochlear duct
    term:
      id: UBERON:0002282
      label: stria vascularis of cochlear duct
  downstream:
  - target: Reduced Endolymph Production
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:40295800
    reference_title: "Complete omission of exon 21 from Slc12a2 transcripts in mice results in hearing loss."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The gene encodes a cotransporter NKCC1 crucial for regulating intracellular osmotic pressure and producing endolymph in the cochlea."
    explanation: >-
      The transporter's function in the cochlea, stated as background in the introduction of a
      mouse paper. Graded OTHER because the publication presents no data of its own for this
      statement.
  - reference: PMID:40503591
    reference_title: "De Novo SLC12A2 Variant Presenting as Congenital Hearing Loss With Vestibular Areflexia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the inner ear, K+ transport is required for the mechano-transduction of auditory stimuli."
    explanation: >-
      Connects potassium handling to hearing rather than leaving it as generic ion transport.
  - reference: PMID:32294086
    reference_title: "Variants encoding a restricted carboxy-terminal domain of SLC12A2 cause hereditary hearing loss in humans."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Immunohistochemistry revealed that SLC12A2 is located on the plasma membrane of several types of cells in the cochlea, including the strial marginal cells,"
    explanation: >-
      Localises the protein to the cell type this node is about. Graded MODEL_ORGANISM, not
      HUMAN_CLINICAL: the abstract does not name a species, and the paper's methods state the
      cochleae came from Macaca fascicularis. So the anatomical anchor of this mechanism rests
      on non-human primate tissue, and the grading now says so.
- name: Reduced Endolymph Production
  biological_scale: TISSUE
  description: >-
    The secretory failure itself. In mice with complete exon 21 skipping, endolymph is already
    reduced by postnatal day 1 - before hearing onset - which places the defect in endolymph
    production rather than in a later degeneration.
  locations:
  - preferred_term: stria vascularis of cochlear duct
    term:
      id: UBERON:0002282
      label: stria vascularis of cochlear duct
  biological_processes:
  - preferred_term: potassium ion homeostasis
    modifier: DECREASED
    term:
      id: GO:0055075
      label: potassium ion homeostasis
  downstream:
  - target: Stria Vascularis Atrophy
    causal_link_type: DIRECT
  - target: Sensorineural Hearing Impairment
    causal_link_type: DIRECT
  - target: Vestibular Areflexia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:40295800
    reference_title: "Complete omission of exon 21 from Slc12a2 transcripts in mice results in hearing loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "mice with complete skip of the exon 21 showed reduced endolymph on postnatal day 1 (P1), reduced stria vascularis (StV) and no auditory brainstem responses at 4 weeks."
    explanation: >-
      The endolymph reduction and its timing at P1, together with the auditory endpoint. The
      same sentence also reports the strial change, which is curated on the downstream node.
  notes: >-
    Every measurement here comes from the homozygous mouse. Human DFNA78 is a heterozygous
    disease and no equivalent human endolymph measurement exists, which is the substance of
    discussions#dfna78_mouse_dose_mismatch.
- name: Stria Vascularis Atrophy
  biological_scale: TISSUE
  description: >-
    The stria itself is smaller in the exon-21-skip mouse, and the authors read that as a
    consequence of the osmotic change rather than as primary degeneration - a rebalancing of
    osmotic pressure, with RNA-seq showing upregulation of Cldn9 interpreted as tissue repair of
    the gaps left by reduced cell size. Curated as its own node because that ordering is a
    substantive claim: it makes strial shrinkage downstream of the secretory defect rather than
    an independent lesion.
  locations:
  - preferred_term: stria vascularis of cochlear duct
    term:
      id: UBERON:0002282
      label: stria vascularis of cochlear duct
  evidence:
  - reference: PMID:40295800
    reference_title: "Complete omission of exon 21 from Slc12a2 transcripts in mice results in hearing loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Reduced StV size was considered to be due to rebalance osmotic pressure, and upregulation of Cldn9 revealed by RNA-seq was considered as tissue response to repair the gaps from reduced cell sizes"
    explanation: >-
      The authors' interpretation of the strial shrinkage, quoted because it changes what the
      finding means: an osmotic adjustment downstream of the endolymph defect, not cell death.
  notes: >-
    This node has no downstream edge. The strial change is a readout of the secretory failure
    rather than a further step toward the phenotype, and the hearing loss is drawn from the
    upstream node accordingly.

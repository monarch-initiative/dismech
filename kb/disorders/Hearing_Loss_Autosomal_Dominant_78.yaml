    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In 2020, heterozygous variants in SLC12A2 were identified as a cause of non-syndromic deafness associated with vestibular areflexia (DFNA78; MIM 619081)."
    explanation: >-
      Vestibular areflexia as part of the original entity definition, not an incidental finding
      in one patient.
  - reference: PMID:40503591
    reference_title: "De Novo SLC12A2 Variant Presenting as Congenital Hearing Loss With Vestibular Areflexia."

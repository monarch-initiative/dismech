name: Hearing Loss Autosomal Dominant 78
category: Mendelian
creation_date: "2026-09-03T19:00:00Z"
synonyms:
- DFNA78
- deafness, autosomal dominant 78
- SLC12A2-related autosomal dominant nonsyndromic hearing loss
- nonsyndromic deafness with vestibular areflexia
description: >-
  DFNA78 is dominantly inherited nonsyndromic sensorineural hearing loss caused by
  heterozygous variants in SLC12A2, which encodes the Na-K-2Cl cotransporter NKCC1. NKCC1
  loads potassium into strial marginal cells across their basolateral membrane, and that
  uptake is the first step in secreting endolymph and sustaining the endocochlear potential
  on which mechanotransduction depends.

  What makes this entity worth a separate entry rather than a line on the SLC12A2 gene page is
  that its variants are not distributed across the gene: every published pathogenic DFNA78
  allele sits in exon 21, either as a missense change inside it or as a splice variant that
  removes it. Exon 21 is not an ordinary exon. SLC12A2 has several isoforms and only one
  contains exon 21; that isoform is almost exclusively expressed in the inner ear, and it is
  the one required for endolymph homeostasis. So a lesion confined to exon 21 is a lesion
  confined, in practice, to the cochlea - which is why a cotransporter expressed in neurons,
  glia, trachea, salivary glands, intestine and sweat glands produces a hearing-only disease
  here.

  The genetics rule out haploinsufficiency of the *gene*, and that argument is available from
  the published phenotypes without any new experiment. The first SLC12A2 patient described
  carried a de novo heterozygous loss-of-function variant and had normal hearing. Biallelic loss
  of function causes Kilquist syndrome, a severe recessive disorder. Heterozygous *exon 21*
  alteration, by contrast, causes deafness on its own.

  What each variant does to the protein has been measured - chloride influx is significantly
  reduced for every tested allele, in two independent cohorts - so this entry records the
  variants as LOSS_OF_FUNCTION. What it deliberately does not record is DOMINANT_NEGATIVE. The
  disease is dominant and NKCC1 is a dimer, so a poisoned subunit is the natural story, but the
  splice allele argues the other way: its exon-21-skipped transcript is present at much lower
  levels than the normal one in cochlea, which is isoform dose rather than a spoiled partner. A
  missense subunit could go either way and nobody has tested it, so the route to dominance is
  carried as an open question rather than asserted.

  Two clinical points follow. Vestibular areflexia accompanies the hearing loss often enough
  that DFNA78 belongs on the differential for hearing loss with vestibular failure, a list
  otherwise dominated by Usher syndrome. And the severity range is wide - severe-to-profound
  postlingual loss segregating across three generations in one family, profound congenital
  loss in a de novo case - so age at presentation does not exclude the gene.

  The mouse work is the clearest support for the mechanism and, at the same time, the clearest
  translational gap. Mice engineered to skip exon 21 completely have reduced endolymph on
  postnatal day 1, a smaller stria vascularis, and no auditory brainstem response at four
  weeks - but that is the homozygote. The heterozygous mouse shows only mild threshold
  elevation, in females, at some frequencies, whereas the human heterozygote is deaf. The
  entry records that as a HUMAN_MODEL_MISMATCH rather than treating the mouse as a
  straightforward model of the dominant human disease.

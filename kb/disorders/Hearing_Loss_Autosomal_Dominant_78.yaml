diagnosis:
- name: SLC12A2 sequencing with exon 21 coverage
  description: >-
    Sequencing SLC12A2 with attention to exon 21 and both of its splice boundaries. Because
    the reported splice alleles act by skipping rather than by frameshift, a variant a few
    bases into the intron can be the whole cause, and cDNA analysis is what establishes it.
  evidence:
  - reference: PMID:40503591
    reference_title: "De Novo SLC12A2 Variant Presenting as Congenital Hearing Loss With Vestibular Areflexia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report a patient with profound congenital hearing loss and vestibular areflexia with a de novo variant in SLC12A2 located in the splice donor site: NM_001046.2: c.2977+4_2977+7del causing an in-frame skip of exon 21, as shown by cDNA analysis."
    explanation: >-
      An intronic +4 to +7 deletion whose consequence needed cDNA to demonstrate - the case for
      not stopping at the coding sequence.
- name: Broad hearing-loss gene panel in vestibular areflexia
  description: >-
    When sensorineural hearing loss presents with vestibular areflexia, testing narrowed to
    Usher syndrome genes will miss DFNA78.
  evidence:
  - reference: PMID:40503591
    reference_title: "De Novo SLC12A2 Variant Presenting as Congenital Hearing Loss With Vestibular Areflexia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This underscores the need for a broad sequencing approach when faced with this clinical scenario."
    explanation: The authors' testing recommendation for exactly this presentation.
animal_models:
- name: Slc12a2 exon 21 skip mouse (Em2)
  species: Mouse
  genotype: Slc12a2Em2/Em2 (c.2912-4_2913del), complete skipping of exon 21
  publication: PMID:40295800
  description: >-
    A CRISPR-engineered splice-site allele that removes exon 21 from Slc12a2 transcripts
    entirely. Homozygotes reproduce the cochlear phenotype; heterozygotes largely do not.
  modeled_mechanisms:
  - target: Reduced Endolymph Production
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the tissue-level lesion this entry attributes to loss of the exon-21 isoform:
      reduced endolymph volume in the first postnatal day, a smaller stria vascularis, and
      absent auditory brainstem responses.
    limitations: >-
      Only the homozygote does. Human DFNA78 is heterozygous, and the heterozygous mouse shows
      only mild threshold elevation, in females, at some frequencies. The model therefore
      supports the isoform's function well and the dominant mechanism poorly. A second species
      difference is intrinsic to the model: a single nucleotide difference between human and
      mouse at the 5' end of exon 21 alters how the exon is spliced, so exon-21 handling is not
      identical between the two organisms.
    readouts:
    - name: Endolymph volume at postnatal day 1
      target: Reduced Endolymph Production
      direction: DECREASED
      interpretation: >-
        Direct measurement of the secretory failure the mechanism predicts, at an age before
        hearing onset.
      evidence:
      - reference: PMID:40295800
        reference_title: "Complete omission of exon 21 from Slc12a2 transcripts in mice results in hearing loss."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "mice with complete skip of the exon 21 showed reduced endolymph on postnatal day 1 (P1), reduced stria vascularis (StV) and no auditory brainstem responses at 4 weeks."
        explanation: Reports the endolymph reduction and its timing.
    - name: Auditory brainstem response at 4 weeks
      target: Reduced Endolymph Production
      direction: ABOLISHED
      interpretation: Functional deafness in the homozygote, the auditory endpoint of the chain.
      evidence:
      - reference: PMID:40295800
        reference_title: "Complete omission of exon 21 from Slc12a2 transcripts in mice results in hearing loss."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "no auditory brainstem responses at 4 weeks"
        explanation: The absent ABR that defines the model's auditory phenotype.
    evidence:
    - reference: PMID:40295800
      reference_title: "Complete omission of exon 21 from Slc12a2 transcripts in mice results in hearing loss."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "mouse is proposed as a model for studying DFNA78 pathology."
      explanation: >-
        The authors' own claim that this strain models DFNA78, which is what makes the link
        informative for the node rather than merely concurrent.
treatments:
- name: Cochlear Implantation
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: cochlear device implantation
    term:
      id: NCIT:C15329
      label: Surgical Procedure
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: cochlear implant
        term:
          id: NCIT:C157820
          label: Cochlear Implant
  description: >-
    The intervention for the severe-to-profound end of the range, and the mechanism supports it
    cleanly: the lesion is in strial endolymph secretion, entirely upstream of the spiral
    ganglion an implant stimulates, and no cochlear structural malformation is described in
    DFNA78. No DFNA78-specific implant outcome data exist.
  target_mechanisms:
  - target: Sensorineural Hearing Impairment
    treatment_effect: BYPASSES
    description: >-
      Stimulates the auditory nerve directly, bypassing the failed endolymph-dependent
      transduction step rather than correcting it.
  notes: >-
    Carries no evidence item deliberately. None of the cached DFNA78 references reports implant
    outcomes, and quoting the general cochlear-implant literature would attribute to this
    disease something not measured in it. The mechanistic rationale above is this entry's
    inference and is labelled as such.

    The treatment term is the generic surgical action. NCIT:C157820 names the device rather than
    a clinical action and is not reachable from NCIT:C25218, so it cannot be the term: of a
    TreatmentTerm; it is attached as a qualifier so the device stays queryable.
- name: Hearing Aid Amplification
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid amplification
    term:
      id: NCIT:C15315
      label: Rehabilitation
  description: >-
    Amplification for the milder and earlier part of the course, before thresholds reach the
    implant range. As with implantation there are no DFNA78-specific data.
  notes: >-
    No evidence item, for the same reason as cochlear implantation. NCIT has no clinical-action
    term for hearing aid usage, so the bound term is the generic rehabilitation action and the
    specificity sits in preferred_term.
- name: Vestibular Rehabilitation
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: vestibular rehabilitation
    term:
      id: NCIT:C15302
      label: Physical Therapy
  description: >-
    Relevant to the subgroup with vestibular areflexia. Bilateral areflexia is compensated for
    by vision and proprioception rather than recovered from, and balance training targets that
    compensation.
  target_phenotypes:
  - preferred_term: Vestibular areflexia
    term:
      id: HP:0008568
      label: Vestibular areflexia
  notes: >-
    No evidence item; standard practice for bilateral vestibular loss, not a DFNA78 finding.
- name: Avoidance of Loop Diuretics
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: avoidance of loop diuretic exposure
    term:
      id: NCIT:C15747
      label: Supportive Care
  description: >-
    Recorded because the pharmacology is unusually pointed here rather than because outcomes are
    known. Loop diuretics such as bumetanide and furosemide act by inhibiting NKCC1 - the
    transporter this disease has already crippled in the cochlea - and are recognised ototoxins.
    A DFNA78 patient therefore has a mechanistic reason to avoid the drug class that targets
    their own defective protein.
  notes: >-
    Carries no evidence item. None of the cached DFNA78 references discusses loop diuretics; the
    NKCC1-inhibition pharmacology and loop-diuretic ototoxicity are both established general
    knowledge, and the inference joining them to this disease is this entry's, labelled as such.
    It is recorded rather than omitted because a drug class whose target is the disease protein
    is exactly the kind of link this knowledge base exists to make queryable, and it would be a
    poor outcome for that to survive only as prose in a research report.
discussions:
- discussion_id: dfna78_dominant_mechanism
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    Is DFNA78 dominant because an exon-21 mutant subunit poisons the NKCC1 dimer, or because
    the cochlear exon-21 isoform is uniquely dose-sensitive - and do the missense and splice
    alleles reach dominance by the same route?
  attaches_to:
  - pathophysiology#SLC12A2 Exon 21 Variant
  - pathophysiology#Loss of the Inner-Ear-Restricted NKCC1 Exon 21 Isoform
  rationale: >-
    The entry tags the variants LOSS_OF_FUNCTION because that is what the oocyte assays
    measured, and deliberately does not tag them DOMINANT_NEGATIVE, because the dominance is
    not explained by any published experiment. What is published: a de novo heterozygous
    SLC12A2 loss-of-function variant produced normal hearing; biallelic loss of function
    produces Kilquist syndrome; heterozygous exon-21 alteration produces deafness; NKCC1
    functions as a dimer; and every tested DFNA78 allele reduces chloride influx. Those facts
    rule out simple haploinsufficiency of the *gene*, but they do not distinguish a poisoned
    dimer from a cochlear isoform whose function collapses at half dose - the reported
    gene-level LoF alleles need not have affected the exon-21 transcript at all.

    The splice allele actually argues for the dose model over the poison model: its
    exon-21-skipped transcript is present at much lower levels than the exon-21-included one in
    cochlea, so what that patient loses is isoform quantity. A missense subunit is the case
    that could go either way, and it is the one nobody has tested. A co-expression assay
    measuring mutant-on-wild-type interference, or an exon-21-specific heterozygous null, would
    separate them. Neither has been reported.
  evidence:
  - reference: PMID:40503591
    reference_title: "De Novo SLC12A2 Variant Presenting as Congenital Hearing Loss With Vestibular Areflexia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The first report concerned a child with a complex syndrome marked by metabolic derangement but normal hearing and cognition and a de novo heterozygous loss of function variant."
    explanation: >-
      The observation that does the work: heterozygous loss of function in this gene is
      compatible with normal hearing, so DFNA78 dominance needs an explanation beyond dose.
  - reference: PMID:40503591
    reference_title: "De Novo SLC12A2 Variant Presenting as Congenital Hearing Loss With Vestibular Areflexia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SLC12A2 functions as a dimer and has several isoforms; only one isoform contains exon 21, and this isoform is almost exclusively expressed in the inner ear/cochlea."
    explanation: >-
      Supplies both candidate explanations at once - the dimer that a mutant subunit could
      poison, and the isoform restriction that could make the cochlea uniquely dose-sensitive.
  - reference: PMID:32294086
    reference_title: "Variants encoding a restricted carboxy-terminal domain of SLC12A2 cause hereditary hearing loss in humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro analysis indicated that the splice-site variant generates an exon 21-skipped SLC12A2 mRNA transcript expressed at much lower levels than the exon 21-included transcript in the cochlea, suggesting a tissue-specific role for the exon 21-encoded region in the carboy-terminal domain."
    explanation: >-
      The observation that tips the splice allele toward an isoform-dose explanation rather
      than a poisoned dimer, and so splits the question by allele class.
- discussion_id: dfna78_mouse_dose_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why is the heterozygous exon-21-skip mouse near-normal when the heterozygous human is
    severely to profoundly deaf?
  attaches_to:
  - animal_models#Mouse
  - pathophysiology#Reduced Endolymph Production
  rationale: >-
    The mouse reproduces the mechanism convincingly in the homozygous state - reduced
    endolymph, smaller stria, no ABR - and that is why the model is used here. But the
    dominance does not carry across. Heterozygous mice show only mild ABR threshold elevation,
    in females, at some frequencies, whereas heterozygous humans are deaf. The paper itself
    supplies one candidate explanation, which is that human and mouse differ by a single
    nucleotide at the 5' end of exon 21 and that this difference affects exon 21 splicing, so
    the mouse allele may not produce the same transcript mix. A second possibility is that the
    engineered skip is a null for the isoform while the human missense alleles make an
    interfering product - which would also resolve
    discussions#dfna78_dominant_mechanism. Until that is tested, homozygous-mouse results
    should not be read as evidence about the human heterozygous mechanism.
  evidence:
  - reference: PMID:40295800
    reference_title: "Complete omission of exon 21 from Slc12a2 transcripts in mice results in hearing loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Female Slc12a2Em2/+ mice also exhibited mild elevation of ABR thresholds in several sound frequencies."
    explanation: >-
      The heterozygous mouse phenotype, which is the mismatch: mild, sex-limited and
      frequency-limited against severe-to-profound human loss.
  - reference: PMID:40295800
    reference_title: "Complete omission of exon 21 from Slc12a2 transcripts in mice results in hearing loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Minigene assays indicated that a single nucleotide difference between humans and mice at the 5' end of the exon 21 affects exon 21 splicing."
    explanation: >-
      The species difference the authors identify in exon-21 handling, which is a concrete
      mechanism for the mismatch rather than a generic caveat.
notes: >-
  Relationship to the other SLC12A2 entries in this knowledge base. Delpire-McNeill Syndrome
  and Kilquist Syndrome are the syndromic SLC12A2 disorders, and Autosomal Recessive
  Nonsyndromic Hearing Loss 103 is a recessive hearing-only entry that cites SLC12A2
  functional work. DFNA78 is the dominant hearing-only form, and what separates it from all
  three is the exon-21 restriction rather than the phenotype alone. That is curated here as
  the defining feature rather than as a footnote.

  PMID:36035115 reports cell-based analysis of an SLC12A2 p.(E979K) variant from a Ghanaian
  hearing-impairment family and is cached alongside this entry, but is not cited in it: the
  paper does not state that family's inheritance mode, so attributing its functional result to
  DFNA78 rather than to another SLC12A2 hearing phenotype would be an assumption. It is
  recorded here so the next curator does not have to rediscover the reason.

name: Sheehan Syndrome
creation_date: "2026-09-05T00:00:00Z"
category: Acquired
disease_term:
  preferred_term: Sheehan syndrome
  term:
    id: MONDO:0019618
    label: Sheehan syndrome
parents:
- syndromic disease
synonyms:
- Sheehan's syndrome
- postpartum hypopituitarism
- postpartum pituitary necrosis
- postpartum panhypopituitarism
description: >-
  Sheehan syndrome is acquired hypopituitarism caused by ischaemic infarction and
  necrosis of the anterior pituitary in the setting of severe postpartum
  haemorrhage. During pregnancy the anterior lobe enlarges through
  oestrogen-driven lactotroph hyperplasia while remaining confined within the
  bony sella turcica and dependent on the low-pressure hypophyseal portal
  circulation, so peripartum hypovolaemia and portal vasospasm can infarct it.
  Trophic hormone secretion is then lost, classically beginning with prolactin
  and growth hormone and extending to the gonadotropins, thyroid-stimulating
  hormone and adrenocorticotropic hormone, while the separately supplied
  posterior lobe is comparatively preserved. Presentation is dominated by
  failure of postpartum lactation, amenorrhoea and non-specific fatigue, so
  diagnosis is typically delayed by years to decades and may first be made when
  an intercurrent illness precipitates adrenal crisis. It is a leading cause of
  hypopituitarism where obstetric care is limited and is uncommon where
  postpartum haemorrhage is well managed.
notes: >-
  This entry is deliberately distinct from
  Combined_Pituitary_Hormone_Deficiencies_Genetic_Form, which models congenital
  hypopituitarism arising from germline defects in pituitary organogenesis and
  lineage specification. The two converge on a shared endocrine deficiency state
  but have unrelated proximate mechanisms: Sheehan syndrome is a peripartum
  vascular lesion of a structurally normal, physiologically enlarged gland, and
  its pathophysiology chain is therefore modelled from pregnancy-induced
  hyperplasia through infarction, not from developmental transcription-factor
  failure.

  No animal, organoid or computational model reproducing the full sequence -
  pregnancy-associated pituitary enlargement, obstetric haemorrhagic shock,
  selective postpartum infarction, empty sella and multi-axis failure - was
  found during curation, so the model sections are deliberately empty rather
  than populated with partial surrogates such as hypophysectomy or generic
  haemorrhagic-shock preparations. There is no causal gene, so no genetic model
  is possible in principle.

diagnosis:
- name: Dynamic Prolactin Testing
  description: >-
    Basal prolactin plus a thyrotropin-releasing hormone stimulation test
    discriminates lactotroph reserve, and was reported to have high sensitivity
    and specificity for prolactin deficiency in Sheehan syndrome.
  evidence:
  - reference: PMID:24917653
    reference_title: "Extensive investigation of 114 patients with Sheehan's syndrome: a continuing disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, the TRH stimulation test was found to have a high sensitivity and specificity to recognize PRL deficiency."
    explanation: >-
      States the diagnostic performance of the test in this cohort.
- name: Clinical Diagnosis on Obstetric History and Hormone Testing
  description: >-
    Diagnosis rests on the combination of a history of severe postpartum
    haemorrhage with basal hormone levels and, where needed, stimulation tests.
  evidence:
  - reference: PMID:28004764
    reference_title: Sheehan syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Diagnosis is based on clinical manifestations combined with a history of severe PPH; hormone levels and/or stimulation tests can confirm clinical suspicion."
    explanation: >-
      States the diagnostic approach.
differential_diagnoses:
- name: Lymphocytic hypophysitis
  description: >-
    Autoimmune hypophysitis also causes peripartum hypopituitarism, but it is
    not preceded by obstetric haemorrhage and typically shows a symmetrically
    enlarged, homogeneously enhancing gland with stalk thickening rather than an
    infarct progressing to an empty sella.
  distinguishing_features:
  - Absence of severe postpartum haemorrhage in the index pregnancy
  - Pituitary enlargement rather than infarction and later atrophy
  evidence:
  - reference: PMID:9880116
    reference_title: Pituitary diseases in pregnancy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Hypopituitarism arising postpartum may be caused by either lymphocytic hypophysitis or Sheehan's syndrome, and the latter may present as an acute or chronic syndrome."
    explanation: >-
      Names lymphocytic hypophysitis as the alternative cause of postpartum
      hypopituitarism that must be distinguished.
- name: Postpartum depression
  description: >-
    The non-specific fatigue, low mood and weight change of untreated
    hypopituitarism are commonly attributed to postpartum depression, which is
    a principal reason for the long diagnostic delay.
  distinguishing_features:
  - Failure of lactation and failure to resume menses
  - Biochemical multi-axis pituitary hormone deficiency
  evidence:
  - reference: PMID:41116860
    reference_title: "A Decade With Sheehan's Syndrome: A Case Report and Personal Experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diagnosis is often delayed due to its nonspecific presentation and overlap with conditions like postpartum depression and chronic fatigue syndrome."
    explanation: >-
      Names postpartum depression as the condition Sheehan syndrome is commonly
      mistaken for.
treatments:
- name: Lifelong Pituitary Hormone Replacement
  description: >-
    There is no way to restore the infarcted gland, so management is lifelong
    replacement of the deficient target hormones, adjusted for stress and
    reviewed as further axes fail.
  therapeutic_modality: OTHER
  action_category: THERAPEUTIC
  treatment_term:
    preferred_term: Hormone Replacement Therapy
    term:
      id: NCIT:C15599
      label: Hormone Replacement Therapy
  target_mechanisms:
  - target: Loss of Anterior Pituitary Trophic Hormone Secretion
    treatment_effect: BYPASSES
    description: >-

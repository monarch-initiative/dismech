- name: Central Hypothyroidism from Thyroid-Stimulating Hormone Deficiency
  role: consequence
  biological_scale: ORGANISM
  conforms_to: "hypothyroidism_thyroid_hormone_deficiency#Impaired Thyroid Hormone Synthesis"
  description: >-
    Thyrotroph loss removes the pituitary drive to the thyroid, so thyroid
    hormone synthesis falls without the compensatory rise in thyroid-stimulating
    hormone that characterises primary hypothyroidism. This node substitutes the
    disorder-specific lesion, central thyroid-stimulating hormone deficiency, for
    the module's generic impairment of thyroid hormone synthesis.

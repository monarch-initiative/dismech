- name: Secondary Adrenal Insufficiency from Corticotropin Deficiency
  role: consequence
  biological_scale: ORGANISM
  description: >-
    Corticotroph loss removes adrenocorticotropic hormone drive to the adrenal
    cortex. Because it usually requires more extensive necrosis, it appears later
    than prolactin and gonadotropin loss, but it is the deficiency that makes the
    disease lethal: an intercurrent illness in an unreplaced patient can
    precipitate adrenal crisis.

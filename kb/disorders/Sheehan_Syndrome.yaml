discussions:
- discussion_id: sheehan-autoimmune-perpetuation
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does an autoimmune response to pituitary and hypothalamic antigens released
    by the infarcted gland actively perpetuate and extend hormone loss in Sheehan
    syndrome, or are anti-pituitary and anti-hypothalamus antibodies a
    non-causal marker of the necrosis that has already occurred?
  attaches_to:
  - pathophysiology#Ischaemic Infarction and Necrosis of the Anterior Pituitary
  - pathophysiology#Loss of Anterior Pituitary Trophic Hormone Secretion
  rationale: >-
    Hormone deficiencies accumulate for years to decades after a single
    peripartum vascular insult, and a secondary autoimmune process against
    antigens released by the necrotic gland is the leading proposed explanation.
    Anti-pituitary antibodies are found in roughly a third of long-standing
    cases and anti-hypothalamus antibodies in about 40%, but these are
    cross-sectional associations in small cohorts with no demonstration that the
    antibodies precede the additional hormone loss or are pathogenic. Because the
    evidence does not establish direction, this entry does not draw a causal edge
    from autoimmunity to progressive hormone loss; the autoimmune contribution is
    recorded here as an open question instead. Resolving it matters clinically:
    if the process is active and antibody-mediated, antibody status might
    identify patients whose remaining axes are at risk, which nothing in current
    practice does.
  evidence:
  - reference: PMID:18230820
    reference_title: "Anti-hypothalamus and anti-pituitary antibodies may contribute to perpetuate the hypopituitarism in patients with Sheehan's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "AHAs were found in 8 out of 20 (40%) and APAs in 7 out of 20 (35%) patients with titers ranging from 1:32 to 1:128 and 1:16 to 1:32 respectively; however, in none of these positive patients AHA immunostained vasopressin cells."
    explanation: >-
      Establishes that the antibodies are present in a substantial minority of
      patients, which is the observation the open question is about.
  - reference: PMID:18230820
    reference_title: "Anti-hypothalamus and anti-pituitary antibodies may contribute to perpetuate the hypopituitarism in patients with Sheehan's syndrome."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Antibodies to unknown hypothalamic cells (releasing factor-secreting cells) other than APAs suggest that an autoimmune process involving both the hypothalamus and pituitary gland may contribute to late pituitary dysfunction in SS patients."
    explanation: >-
      The authors themselves phrase the causal contribution as a suggestion
      inferred from an association, not a demonstrated mechanism, which is why
      this is curated as a knowledge gap rather than a causal edge.
  - reference: PMID:28004764
    reference_title: Sheehan syndrome.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "Small sella turcica size, vasospasms (caused by PPH) and/or thrombosis (associated with pregnancy or coagulation disorders) are predisposing factors; autoimmunity might be involved in the progressive worsening of pituitary functions."
    explanation: >-
      The primary review hedges the autoimmune contribution as "might be
      involved", in contrast to the predisposing factors it states outright.
  - reference: PMID:24917653
    reference_title: "Extensive investigation of 114 patients with Sheehan's syndrome: a continuing disorder."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The number of deficient hormones was found to be increased over the years."
    explanation: >-
      Establishes the progressive hormone loss that any perpetuating mechanism,
      autoimmune or otherwise, would have to explain.
  - reference: PMID:39863703
    reference_title: "Sheehan syndrome: a current approach to a dormant disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Following necrosis of the pituitary gland, autoimmunity may come to the scene either as a cause or consequence of development and deterioration of hypopituitarism"
    explanation: >-
      States the unresolved direction of the association explicitly, which is
      precisely the open question recorded here.
  - reference: PMID:39863703
    reference_title: "Sheehan syndrome: a current approach to a dormant disease."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "On the other hand, in a prospective study, 20 pregnant women with postpartum hemorrhage were followed up for 6 months and hypopituitarism developed in 25% of them and none of the patients were positive for pituitary antibodies"
    explanation: >-
      A prospective cohort in which post-haemorrhage hypopituitarism developed
      without any detectable pituitary antibodies argues against an obligatory
      autoimmune step, and is the main reason this is curated as an open
      question rather than a causal edge. Graded HUMAN_CLINICAL because the
      review is reporting the design and result of a prospective patient cohort
      here rather than offering an expert synthesis.
review_notes: >-
  Curated de novo. Every snippet was checked against the local reference cache.
  The posterior-pituitary node deliberately carries one REFUTE item: formal
  water-deprivation testing shows measurable neurohypophyseal impairment, so the
  common statement that the posterior lobe is "spared" is true only in the
  relative, clinical sense recorded in that node's description.
  `just discover-datasets Sheehan_Syndrome` returned no GEO candidates, so the
  entry carries no `datasets:` block; this is the expected result for a
  non-genetic rare disease with no molecular assay literature, not an omission.

- population: Parous women aged 20 years and over, Kashmir valley, India
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 3000.0
  rate_denominator: POPULATION
  notes: >-
    Community screening of parous women in the Kashmir valley found around 3%
    of women over 20 years of age affected, roughly 600-fold the Icelandic
    figure. The contrast is the burden signal for this disease.
  evidence:

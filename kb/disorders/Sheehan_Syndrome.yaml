    reference_title: "Epidemiologic aspects of postpartum pituitary hypofunction (Sheehan's syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At these rates, the projected number of women with Sheehan's syndrome among a total population of parous females aged > or =20 years (12,32,827, as per census data) would be 38,691 in the Kashmir valley of the Indian subcontinent."
    explanation: >-
      Community-based screening study projecting the affected population in a
      setting with historically limited obstetric care.
  - reference: PMID:36742387
    reference_title: "Sheehan syndrome: Cardiovascular and metabolic comorbidities."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "whereas the prevalence of SS among 11,700 women >20 years of age was around 3% in northern India"
    explanation: >-
      States the northern-India prevalence as approximately 3%, the value
      normalised into rate_per_100000 here.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Untreated Sheehan syndrome carries a risk of fatal adrenal crisis, and even
    treated patients accumulate metabolic and cardiovascular morbidity. The
    burden is concentrated where obstetric haemorrhage is poorly managed, and is
    compounded by a diagnostic delay measured in years to decades.
  evidence:
  - reference: PMID:36742387
    reference_title: "Sheehan syndrome: Cardiovascular and metabolic comorbidities."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The lower prevalence of SS in developed countries is a result of better obstetric care facilities in these countries and possibly disease unawareness and missed diagnosis."
    explanation: >-
      Attributes the geographic skew in disease burden to the quality of
      obstetric care rather than to any biological difference in susceptibility.
  - reference: PMID:28004764
    reference_title: Sheehan syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Sheehan syndrome is an important cause of hypopituitarism in developing countries, but has become rare in developed countries."
    explanation: >-
      Confirms that the disease burden falls disproportionately on settings with
      limited obstetric care.
  - reference: PMID:39863703
    reference_title: "Sheehan syndrome: a current approach to a dormant disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The diagnostic delay makes the patients to expose hypopituitarism without essential replacement therapies leading to increased morbidity and mortality of the patients."
    explanation: >-
      Connects the diagnostic delay directly to excess morbidity and mortality,
      which is why the burden is rated HIGH despite an effective treatment
      existing.
progression:
- phase: Peripartum insult
  notes: >-
    Severe postpartum haemorrhage with hypovolaemia; the anterior lobe may be
    swollen on contrast MRI in the first days to weeks after delivery.
  evidence:
  - reference: PMID:24162077
    reference_title: "A novel hook-shaped enhancement on contrast-enhanced sagittal magnetic resonance image in acute Sheehan's syndrome: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MR image of the pituitary gland on postpartum day 10 revealed swelling of the anterior lobe."
    explanation: >-
      Documents the acute-phase appearance of the infarcted anterior lobe within
      days of the haemorrhage.
- phase: Acute Sheehan syndrome (rare)
  notes: >-
    A minority of patients decompensate within days to weeks of delivery rather
    than presenting years later. In a review of 21 reported acute cases the
    median time from delivery to presentation was under three weeks, and adrenal
    insufficiency was the commonest presenting picture.
  evidence:
  - reference: PMID:28615049
    reference_title: "A case of acute Sheehan's syndrome and literature review: a rare but life-threatening complication of postpartum hemorrhage."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An electronic search of the literature yielded 21 cases of acute Sheehan's syndrome. Presenting signs varied, including adrenal insufficiency (12 cases), diabetes insipidus (4 cases), hypothyroidism (2 cases), and panhypopituitarism (3 cases), with a median time of presentation after delivery for each of those conditions being 7.9, 4, 18, and 9 days, respectively."
    explanation: >-
      Gives the presenting syndromes and their median timing in the acute form.
  - reference: PMID:28004764
    reference_title: Sheehan syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Symptoms usually become evident years after delivery, but can, in rare cases, develop acutely."
    explanation: >-
      Confirms that acute presentation is the rare exception to the usual latent
      course.
- phase: Latent hypopituitarism
  notes: >-
    Failure to lactate and failure to resume menses are usually the earliest
    manifestations, followed by years of non-specific fatigue that are commonly
    misattributed to postpartum depression or chronic fatigue.
  evidence:
  - reference: PMID:41116860
    reference_title: "A Decade With Sheehan's Syndrome: A Case Report and Personal Experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Initially, she experienced failure to lactate, followed by amenorrhea, frontal balding, weight loss, hypotension, chronic fatigue, mood swings, and polyuria."
    explanation: >-
      Illustrates the ordered emergence of deficiency symptoms in the latent
      phase.
- phase: Diagnosis, often years to decades later
  notes: >-
    Diagnosis is typically made only after a long delay, and in a substantial
    minority is triggered by an acute adrenal decompensation.
  evidence:
  - reference: PMID:24917653
    reference_title: "Extensive investigation of 114 patients with Sheehan's syndrome: a continuing disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean period of diagnostic delay was 19.7 years in patients with SS."
    explanation: >-
      Quantifies the diagnostic delay in the largest reported single-centre
      series.
  - reference: PMID:26323346
    reference_title: "Sheehan's syndrome: new insights into an old disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Additionally, the diagnosis of SS has often been overlooked and thus delayed for long years due to its nonspecific signs and symptoms."
    explanation: >-
      Attributes the delay to the non-specific presentation, which is the reason
      this phase exists as a distinct step.
  - reference: PMID:39863703
    reference_title: "Sheehan syndrome: a current approach to a dormant disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "most patients present with nonspecific symptoms leading to a variable delay in diagnosis about 7–19 years"
    explanation: >-
      Gives the range of reported diagnostic delays across published series,
      complementing the single-cohort mean above.
- phase: Progressive multi-axis failure
  notes: >-
    The number of deficient axes increases with time from the index haemorrhage,
    so partial hypopituitarism at presentation does not exclude later
    panhypopituitarism.
  evidence:
  - reference: PMID:24917653
    reference_title: "Extensive investigation of 114 patients with Sheehan's syndrome: a continuing disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The number of deficient hormones was found to be increased over the years."
    explanation: >-
      Directly supports progressive rather than static endocrine loss.
pathophysiology:
- name: Pregnancy-Induced Lactotroph Hyperplasia and Anterior Pituitary Enlargement
  role: trigger
  biological_scale: CELLULAR
  description: >-
    Rising oestrogen through gestation drives hyperplasia of the
    prolactin-secreting lactotrophs of the anterior lobe, so the gland enlarges
    substantially by term. This is normal physiology preparing for lactation,
    but it is the reason the anterior pituitary enters the peripartum period
    with an increased metabolic demand.
  locations:
  - preferred_term: anterior pituitary lobe
    term:
      id: UBERON:0002196
      label: adenohypophysis
  cell_types:
  - preferred_term: lactotroph
    term:
      id: CL:0000439
      label: prolactin secreting cell
  biological_processes:
  - preferred_term: lactotroph proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: INCREASED
  downstream:
  - target: Portal Perfusion and Fixed Sellar Volume Constrain Anterior Pituitary Blood Supply
    causal_link_type: DIRECT
    description: >-
      An enlarged gland inside an unyielding sella and fed by a portal system
      has less perfusion reserve than a non-pregnant one.
    evidence:
    - reference: PMID:28004764
      reference_title: Sheehan syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The initial insult is caused by massive postpartum haemorrhage (PPH), leading to impaired blood supply to the pituitary gland, which has become enlarged during pregnancy."
      explanation: >-
        Links the pregnancy-associated enlargement directly to the impaired
        blood supply that follows haemorrhage.
  evidence:
  - reference: PMID:19934270
    reference_title: Pregnancy and pituitary disorders.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The pituitary gland is enlarged as a result of lactotroph hyperplasia."
    explanation: >-
      States the cellular basis of the pregnancy-associated enlargement modelled
      by this node.
  - reference: PMID:31869188
    reference_title: "Physiology, Pituitary Issues During Pregnancy."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The pituitary gland enlarges by about one-third to achieve these functional changes, with the major component of this growth being the estrogen-induced hyperplasia of the lactotroph cells."
    explanation: >-
      Quantifies the enlargement and attributes it to oestrogen-induced
      lactotroph hyperplasia.
  - reference: PMID:39863703
    reference_title: "Sheehan syndrome: a current approach to a dormant disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The pituitary gland is enlarged markedly during 3rd trimester of pregnancy and reaches to its highest volume in the early postpartum days leading to increased demand of blood supply"
    explanation: >-
      Places the peak of the enlargement in the early postpartum days, which is
      exactly when the haemorrhagic insult occurs, and states the resulting
      increase in blood-supply demand.
- name: Portal Perfusion and Fixed Sellar Volume Constrain Anterior Pituitary Blood Supply
  role: predisposing factor
  biological_scale: TISSUE
  description: >-
    The bulk of the anterior lobe is not supplied by direct arterial branches but
    by the long hypophyseal portal veins descending from the median eminence,
    whose tributaries arise far from the internal carotid artery; the posterior
    lobe and the marginal zone of the anterior lobe retain a more direct arterial
    supply. Because the whole gland is enclosed by the bony sella turcica, an
    enlarged gland in a small sella has little room to swell without further
    compromising this low-pressure inflow. Small sella volume is a documented
    predisposing factor.
  locations:
  - preferred_term: sella turcica
    term:
      id: UBERON:0003689
      label: sella turcica
  downstream:
  - target: Ischaemic Infarction and Necrosis of the Anterior Pituitary
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The portal-dependent central anterior lobe is the territory that infarcts
      when perfusion pressure falls.
    evidence:
    - reference: PMID:24162077
      reference_title: "A novel hook-shaped enhancement on contrast-enhanced sagittal magnetic resonance image in acute Sheehan's syndrome: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Anatomically, blood supply to these unenhanced portions of the anterior lobe was via the hypophyseal long portal vein and trabecular artery, which are tributaries of the superior hypophyseal artery that originate far from the internal carotid artery."
      explanation: >-
        Maps the non-perfused territory in acute Sheehan syndrome onto the
        portal-dependent vascular supply, supporting this edge specifically.
  - target: Relative Preservation of Posterior Pituitary Perfusion
    causal_link_type: DIRECT
    description: >-
      The posterior lobe, supplied more directly, remains enhanced when the
      portal-dependent anterior territory does not.
    evidence:
    - reference: PMID:24162077
      reference_title: "A novel hook-shaped enhancement on contrast-enhanced sagittal magnetic resonance image in acute Sheehan's syndrome: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The pituitary stalk, majority of the marginal zone of the anterior lobe, the anterior lobe just in front of the posterior lobe, and posterior lobe were well enhanced."
      explanation: >-
        Shows preserved posterior-lobe perfusion in the same gland and at the
        same time as the anterior infarct, which is the contrast this edge
        asserts.
  evidence:
  - reference: PMID:24917653
    reference_title: "Extensive investigation of 114 patients with Sheehan's syndrome: a continuing disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, small sella size may have an important contributing role in the etiopathogenesis of SS."
    explanation: >-
      Case-control sella volumetry supporting fixed sellar volume as a
      predisposing anatomical factor.
  - reference: PMID:24162077
    reference_title: "A novel hook-shaped enhancement on contrast-enhanced sagittal magnetic resonance image in acute Sheehan's syndrome: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The characteristic hook-shaped enhancement in Sheehan's syndrome well reflected the vulnerability to massive bleeding based on the complex pituitary vasculature, which has not been reported previously."
    explanation: >-
      States that the pituitary's vascular architecture is what makes it
      vulnerable to massive bleeding.
  - reference: PMID:37772209
    reference_title: Adrenal Crisis in a Delayed Diagnosis of Sheehan Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Maternal gestational changes and adaptations include relative hyperplasia of the pituitary gland with minimal increase in blood supply to the hypothalamohypophyseal portal system due to increased blood flow being prioritized to reproductive organs."
    explanation: >-
      States the mismatch this node models: the gland grows while its portal
      inflow does not keep pace.
  - reference: PMID:39863703
    reference_title: "Sheehan syndrome: a current approach to a dormant disease."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Little changes in blood flow can lead to ischemia of the pituitary gland."
    explanation: >-
      States the low perfusion reserve that is the substance of this node.
- name: Postpartum Haemorrhage with Hypovolaemia and Portal Vasospasm
  role: trigger
  biological_scale: ORGANISM
  description: >-
    Massive obstetric haemorrhage produces systemic hypovolaemia and hypotension;
    vasospasm of the hypothalamic portal vessels, and in some patients
    pregnancy-associated or inherited thrombotic tendency, further reduce inflow
    to the anterior lobe.
  downstream:
  - target: Ischaemic Infarction and Necrosis of the Anterior Pituitary
    causal_link_type: DIRECT
    description: >-
      Loss of perfusion pressure across the portal supply is the proximate cause
      of anterior-lobe infarction.
    evidence:
    - reference: PMID:36742387
      reference_title: "Sheehan syndrome: Cardiovascular and metabolic comorbidities."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "It is primarily caused by vasospasm of hypothalamic portal vessels following massive postpartum hemorrhage (PPH), resulting in complete or partial loss of anterior pituitary gland cells."
      explanation: >-
        Names portal vasospasm after haemorrhage as the cause of anterior
        pituitary cell loss, which is exactly this edge.
  evidence:
  - reference: PMID:28004764
    reference_title: Sheehan syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Small sella turcica size, vasospasms (caused by PPH) and/or thrombosis (associated with pregnancy or coagulation disorders) are predisposing factors; autoimmunity might be involved in the progressive worsening of pituitary functions."
    explanation: >-
      Enumerates the haemodynamic and thrombotic contributors modelled by this
      node.
- name: Ischaemic Infarction and Necrosis of the Anterior Pituitary
  role: consequence
  biological_scale: TISSUE
  description: >-
    Sustained hypoperfusion of the portal-dependent anterior lobe produces
    ischaemic necrosis of the hormone-secreting cell populations. This is the
    defining lesion of the disease.
  locations:
  - preferred_term: anterior pituitary lobe
    term:
      id: UBERON:0002196
      label: adenohypophysis
  cell_types:
  - preferred_term: pituitary gland cell
    term:
      id: CL:2000004
      label: pituitary gland cell
  biological_processes:
  - preferred_term: cellular response to hypoxia
    term:
      id: GO:0071456
      label: cellular response to hypoxia
    modifier: INCREASED
  downstream:
  - target: Loss of Anterior Pituitary Trophic Hormone Secretion
    causal_link_type: DIRECT
    description: >-
      Destruction of the secretory cell populations removes their hormone output.
    evidence:
    - reference: PMID:28004764
      reference_title: Sheehan syndrome.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Sheehan syndrome or postpartum hypopituitarism is a condition characterized by hypopituitarism due to necrosis of the pituitary gland."
      explanation: >-
        States that the hypopituitarism is caused by the necrosis, which is the
        claim this edge makes.
  - target: Progressive Pituitary Atrophy and Empty Sella Formation
    causal_link_type: DIRECT
    description: >-
      The infarcted lobe involutes over months to years, leaving a partially or
      completely empty sella.
    evidence:
    - reference: PMID:24162077
      reference_title: "A novel hook-shaped enhancement on contrast-enhanced sagittal magnetic resonance image in acute Sheehan's syndrome: a case report."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Follow-up MR image revealed marked atrophy of the anterior lobe."
      explanation: >-
        Follow-up imaging in the same patient shows the infarcted lobe
        progressing to atrophy.
  evidence:
  - reference: PMID:42175518
    reference_title: "A rare presentation of Sheehan's syndrome with recurrent hypoglycemia: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sheehan syndrome is a rare but potentially fatal cause of hypopituitarism resulting from ischemic necrosis of the anterior pituitary following severe postpartum hemorrhage."
    explanation: >-
      States the defining lesion modelled by this node.
- name: Relative Preservation of Posterior Pituitary Perfusion
  role: modifier
  biological_scale: TISSUE
  description: >-
    Because the neurohypophysis is supplied more directly than the
    portal-dependent anterior lobe, it is comparatively spared, and clinically
    overt central diabetes insipidus is not part of the usual presentation. The
    sparing is relative rather than absolute: formal water-deprivation testing
    detects partial neurohypophyseal impairment in a substantial minority of
    patients who have no symptoms of diabetes insipidus, and rare cases present
    with overt central diabetes insipidus.
  locations:
  - preferred_term: posterior pituitary lobe
    term:
      id: UBERON:0002198
      label: neurohypophysis
  evidence:
  - reference: PMID:18230820
    reference_title: "Anti-hypothalamus and anti-pituitary antibodies may contribute to perpetuate the hypopituitarism in patients with Sheehan's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of them had clinical central diabetes insipidus."
    explanation: >-
      In a cohort of 20 women with long-standing Sheehan syndrome, none had
      clinical diabetes insipidus, supporting relative posterior-lobe sparing.
  - reference: PMID:17468192
    reference_title: "Posterior pituitary function in Sheehan's syndrome."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings demonstrated that patients with Sheehan's syndrome have an impairment of neurohypophyseal function."
    explanation: >-
      Formal testing contradicts a strong reading of posterior-lobe sparing:
      neurohypophyseal function is measurably impaired even when patients are
      asymptomatic. Recorded as REFUTE against the absolute claim so the
      qualification in this node's description is auditable.
  - reference: PMID:17468192
    reference_title: "Posterior pituitary function in Sheehan's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "According to dehydration test, 8 (29.6%) patients had partial diabetes insipidus (PDI group) and 19 (70.3%) had normal response (non-DI group)."
    explanation: >-
      Quantifies the sparing: about 70% of tested patients had a normal
      water-deprivation response and the remainder had only partial impairment.
- name: Loss of Anterior Pituitary Trophic Hormone Secretion
  role: consequence
  biological_scale: ORGANISM
  description: >-
    Necrosis removes trophic hormone output in a characteristic order that tracks
    the position of each cell type relative to the vasculature: prolactin and
    growth hormone secretion are lost first and most often, then the
    gonadotropins, and only with more extensive necrosis thyroid-stimulating
    hormone and adrenocorticotropic hormone. Deficiency may be partial at
    presentation and accumulate over subsequent years.
  locations:
  - preferred_term: anterior pituitary lobe
    term:
      id: UBERON:0002196
      label: adenohypophysis
  downstream:
  - target: Prolactin Deficiency
    causal_link_type: DIRECT
  - target: Growth Hormone Deficiency
    causal_link_type: DIRECT
  - target: Gonadotropin Deficiency
    causal_link_type: DIRECT
  - target: Central Hypothyroidism from Thyroid-Stimulating Hormone Deficiency
    causal_link_type: DIRECT
  - target: Secondary Adrenal Insufficiency from Corticotropin Deficiency
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:28004764
    reference_title: Sheehan syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In accordance with the location of hormone-secreting cells relative to the vasculature, the secretion of growth hormone and prolactin is most commonly affected, followed by follicle-stimulating hormone and luteinizing hormone; severe necrosis of the pituitary gland also affects the secretion of thyroid-stimulating hormone and adrenocorticotropic hormone."
    explanation: >-
      States both the ordering of axis loss and its vascular-anatomical basis.
  - reference: PMID:36243797
    reference_title: "Long-term hepatic and cardiac health in patients diagnosed with Sheehan's syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multiple (≥ 2) hormone deficiencies were present in 68.8% of patients, with hypothyroidism (91.4%), hypocortisolism (88.3%), and growth hormone (GH) deficiency (85.7%) being the most common."
    explanation: >-
      Quantifies multi-axis involvement in a 60-patient Sheehan syndrome cohort.
- name: Prolactin Deficiency
  role: consequence
  biological_scale: ORGANISM
  description: >-
    Loss of lactotrophs abolishes the prolactin surge required to initiate
    lactation. Because it presents immediately after the index delivery, it is
    the earliest available clinical clue.
  cell_types:
  - preferred_term: lactotroph
    term:
      id: CL:0000439
      label: prolactin secreting cell
  biological_processes:
  - preferred_term: prolactin secretion
    term:
      id: GO:0070459
      label: prolactin secretion
    modifier: DECREASED
  downstream:
  - target: Failure of Postpartum Lactation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:24917653
    reference_title: "Extensive investigation of 114 patients with Sheehan's syndrome: a continuing disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "None of the patients whose basal prolactin was below 4.0 ng/ml had adequate prolactin responses to TRH test, while all patients whose basal prolactin was above 7.8 ng/ml had adequate responses."
    explanation: >-
      Documents deficient lactotroph reserve on dynamic testing in this cohort.
- name: Growth Hormone Deficiency
  role: consequence
  biological_scale: ORGANISM
  description: >-
    Somatotroph loss occurs in nearly all patients and is unusually severe in
    Sheehan syndrome compared with hypopituitarism of other causes. It is the
    principal driver of the adverse body-composition, lipid and hepatic
    phenotype that persists even on adequate glucocorticoid and thyroid
    replacement.
  cell_types:
  - preferred_term: somatotroph
    term:
      id: CL:0002312
      label: somatotroph
  biological_processes:
  - preferred_term: growth hormone secretion
    term:
      id: GO:0030252
      label: growth hormone secretion
    modifier: DECREASED
  downstream:
  - target: Hepatic Steatosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-

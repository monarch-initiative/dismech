prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    No population rate has been established. The largest comparative series identified 38
    patients with dominant partial IFN-gammaR1 deficiency (against 22 with recessive complete
    deficiency) assembled from a worldwide cohort. Reported cases span Europe, Japan and other
    regions; recurrent origin of the 818del4 hotspot rather than a single founder event
    accounts for its spread. Recorded as a literature case count rather than a rate for that
    reason.
  evidence:
  - reference: PMID:15589309
    reference_title: "Clinical features of dominant and recessive interferon gamma receptor 1 deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 22 patients with recessive complete IFNgammaR1 deficiency and 38 with
      dominant partial deficiency.
    explanation: >-
      Gives the size of the largest reported dominant partial cohort, the basis for recording
      occurrence as a literature case count.
clinical_burden:
  burden_level: MODERATE
  rationale: >-
    Recurrent BCG and environmental mycobacterial infection — most characteristically
    multifocal osteomyelitis with lymphadenopathy — causes substantial morbidity: chronic
    bone pain, deformity, repeated surgery and prolonged multidrug chemotherapy. The burden is
    tempered relative to the recessive complete form, however, by the later onset, the
    relapsing-remitting rather than fulminant course, the responsiveness to antimycobacterial
    therapy with adjunctive IFN-gamma, and survival into adulthood in most patients. That
    combination places the disease-level burden at MODERATE.
  evidence:
  - reference: PMID:15589309
    reference_title: "Clinical features of dominant and recessive interferon gamma receptor 1 deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      M avium complex osteomyelitis was more frequent in dominant than in recessive patients
      (22/28 [79%] vs 1/8 [13%], p=0.002), and this disorder without other organ involvement
      arose only in dominant patients (9/28 [32%]).
    explanation: >-
      Establishes multifocal M. avium osteomyelitis as the dominant-form-defining morbidity
      driving the burden assessment.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  description: >
    Disease results from a single heterozygous truncating IFNGR1 allele acting
    dominant-negatively over the wild-type allele. Multigenerational transmission is documented,
    and de novo occurrence is also reported. Penetrance is incomplete and age-dependent, and
    expressivity is variable — from isolated osteomyelitis at a single site to disseminated
    disease — so a clinically unaffected relative may carry the same allele. Consanguinity is
    not a feature, distinguishing the pedigrees from the recessive forms.
  evidence:
  - reference: PMID:10192386
    reference_title: "A human IFNGR1 small deletion hotspot associated with dominant susceptibility to mycobacterial infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe 18 patients from several generations of 12 unrelated families who were
      heterozygous for 1 to 5 overlapping IFNGR1 frameshift small deletions and a wild-type
      IFNGR1 allele.
    explanation: >-
      Documents the heterozygous, multigenerational (dominant) transmission of the causal
      IFNGR1 deletions alongside a retained wild-type allele.
genetic:
- name: IFNGR1
  gene_term:
    preferred_term: IFNGR1
    term:
      id: hgnc:5439
      label: IFNGR1
  association: CAUSATIVE
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >
    IFNGR1 encodes the ligand-binding alpha chain of the IFN-gamma receptor. The dominant
    partial form is caused by heterozygous frameshift truncating mutations clustered in exon 6
    that introduce a premature stop codon in the intracellular domain. The 4-bp microdeletion
    818del4 is a recurrent small-deletion hotspot and the commonest allele; the related 811del4
    and 774del4 deletions produce the same clinical picture. The resulting receptors lack the
    cytoplasmic domain and its recycling/degradation and STAT1-docking motifs, accumulate at
    the cell surface, bind IFN-gamma, but cannot transduce the signal, exerting a
    dominant-negative effect.
  evidence:
  - reference: PMID:10192386
    reference_title: "A human IFNGR1 small deletion hotspot associated with dominant susceptibility to mycobacterial infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We thus report a hotspot for human IFNGR1 small deletions that confer dominant
      susceptibility to infections caused by poorly virulent mycobacteria.
    explanation: >-
      Identifies the IFNGR1 small-deletion hotspot as the causal, dominantly-acting lesion of
      this disease.
  - reference: PMID:17513528
    reference_title: "The novel IFNGR1 mutation 774del4 produces a truncated form of interferon-gamma receptor 1 and has a dominant-negative effect on interferon-gamma signal transduction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Dominant forms of IFNgammaR1 deficiency are known to be associated with mutations that
      introduce a premature stop codon in the intracellular domain of IFNgammaR1.
    explanation: >-
      Establishes that the dominant alleles are intracellular-domain-truncating premature stop
      mutations, the shared molecular class in this entry.
  - reference: PMID:11865431
    reference_title: "Genetic basis of patients with bacille Calmette-Guérin osteomyelitis in Japan: identification of dominant partial interferon-gamma receptor 1 deficiency as a predominant type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous small deletions with frameshift (818del4 and 811del4) that are consistent
      with the diagnosis of partial dominant IFN-gamma receptor 1 (IFN-gammaR1) deficiency were
      detected in 3 unrelated patients.
    explanation: >-
      Documents the heterozygous exon-6 frameshift deletions (818del4/811del4) as the recurrent
      causal alleles.
pathophysiology:
- name: Heterozygous IFNGR1 Exon 6 Truncating Mutation
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
  description: >
    The initiating lesion is a single heterozygous frameshift deletion in exon 6 of IFNGR1
    (the 818del4 hotspot, or the equivalent 811del4/774del4 alleles) that introduces a
    premature stop codon and removes the intracellular domain of the receptor. The wild-type
    allele is retained, so the cell expresses both full-length and truncated receptor chains.
  downstream:
  - target: Cell-Surface Accumulation of Truncated IFN-gammaR1
    causal_link_type: DIRECT
    description: >-
      The truncated chain lacks the membrane-proximal region needed for receptor
      internalisation and degradation, so it is not cleared and builds up at the cell surface.
    evidence:
    - reference: PMID:10192386
      reference_title: "A human IFNGR1 small deletion hotspot associated with dominant susceptibility to mycobacterial infection."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The mutant alleles encode cell-surface IFNgamma receptors that lack the intra-cytoplasmic
        domain, which, through a combination of impaired recycling, abrogated signalling and
        normal binding to IFNgamma exert a dominant-negative effect.
      explanation: >-
        States that the truncated receptors reach the cell surface with impaired recycling, the
        step this edge describes.
  evidence:
  - reference: PMID:17513528
    reference_title: "The novel IFNGR1 mutation 774del4 produces a truncated form of interferon-gamma receptor 1 and has a dominant-negative effect on interferon-gamma signal transduction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Dominant forms of IFNgammaR1 deficiency are known to be associated with mutations that
      introduce a premature stop codon in the intracellular domain of IFNgammaR1.
    explanation: >-
      Establishes the intracellular-domain-truncating heterozygous mutation as the initiating
      molecular lesion.
- name: Cell-Surface Accumulation of Truncated IFN-gammaR1
  biological_scale: MOLECULAR
  description: >
    Because the truncated receptor cannot be internalised and degraded, it is stably retained
    and overexpressed on the cell surface — measurably increased on monocytes. The accumulated
    non-functional chains compete with wild-type receptor for ligand, which is the structural
    basis of the dominant-negative effect and the diagnostic flow-cytometry signature.
  biological_processes:
  - preferred_term: receptor catabolic process
    term:
      id: GO:0032801
      label: receptor catabolic process
    modifier: DECREASED
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  downstream:
  - target: Dominant-Negative Impairment of IFN-gamma Signaling
    causal_link_type: DIRECT
    description: >-
      The accumulated truncated receptors, lacking the JAK1/STAT1-docking motifs, compete with
      the wild-type receptor and blunt downstream signalling.
    evidence:
    - reference: PMID:17513528
      reference_title: "The novel IFNGR1 mutation 774del4 produces a truncated form of interferon-gamma receptor 1 and has a dominant-negative effect on interferon-gamma signal transduction."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        found that these mutants overexpressed IFNgammaR1 on the cell surface because of impaired
        receptor stability, which resulted in a dominant-negative effect on IFNgamma signal
        transduction.
      explanation: >-
        Directly links cell-surface overexpression of the truncated receptor to a
        dominant-negative signalling defect, the next node.
  evidence:
  - reference: PMID:11865431
    reference_title: "Genetic basis of patients with bacille Calmette-Guérin osteomyelitis in Japan: identification of dominant partial interferon-gamma receptor 1 deficiency as a predominant type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Expression of IFN-gammaR1 on monocytes was significantly increased in all 3 patients.
    explanation: >-
      Documents the increased cell-surface IFN-gammaR1 on patient monocytes that defines this
      node.
- name: Dominant-Negative Impairment of IFN-gamma Signaling
  biological_scale: MOLECULAR
  description: >
    The truncated receptor cannot be phosphorylated to create a STAT1 docking site, so
    IFN-gamma binding produces reduced STAT1 phosphorylation and attenuated transcription of
    interferon-stimulated genes. Signalling is diminished but not abolished — partial STAT1
    activation persists — which is the molecular correlate of the disease being partial rather
    than complete.
  biological_processes:
  - preferred_term: type II interferon-mediated signaling pathway
    term:
      id: GO:0060333
      label: type II interferon-mediated signaling pathway
    modifier: DECREASED
  downstream:
  - target: Insufficient IFN-gamma-Dependent Macrophage Activation
    causal_link_type: DIRECT
    description: >-
      Reduced STAT1 signalling fails to deliver the full macrophage-activating program in
      response to IFN-gamma.
  evidence:
  - reference: PMID:17513528
    reference_title: "The novel IFNGR1 mutation 774del4 produces a truncated form of interferon-gamma receptor 1 and has a dominant-negative effect on interferon-gamma signal transduction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      IFNgammaR1 was overexpressed on the surfaces of CD14-positive cells from the peripheral
      blood of this patient, and STAT1 phosphorylation in response to high doses of IFNgamma was
      partially deficient.
    explanation: >-
      Documents the partial (not absent) STAT1 phosphorylation defect that defines this node.
- name: Insufficient IFN-gamma-Dependent Macrophage Activation
  biological_scale: CELLULAR
  description: >
    IFN-gamma is the signal that licenses macrophages to kill the intracellular mycobacteria
    they harbour. With signalling blunted below the protective threshold, infected macrophages
    are only partially activated and cannot restrict mycobacterial growth. This is the shared
    final mechanism of MSMD, reached here through an impaired response to the cytokine rather
    than through impaired production of it.
  biological_processes:
  - preferred_term: macrophage activation
    term:
      id: GO:0042116
      label: macrophage activation
    modifier: DECREASED
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  downstream:
  - target: Impaired Control of Intramacrophagic Mycobacteria
    causal_link_type: DIRECT
    description: >-
      Partially activated macrophages fail to kill ingested mycobacteria, which replicate and
      disseminate.
  evidence:
  - reference: PMID:38025345
    reference_title: "Mendelian susceptibility to mycobacterial diseases: State of the puzzle."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      almost all genetic etiologies of MSMD alter the interferon-gamma (IFN-γ)- mediated
      immunity by impairing or abolishing IFN-γ production or the response to this cytokine.
    explanation: >-
      Establishes impaired IFN-gamma-mediated immunity as the convergent MSMD mechanism that
      fails at this node; this entry is on the response arm.
- name: Impaired Control of Intramacrophagic Mycobacteria
  biological_scale: ORGANISM
  description: >
    The organism-level consequence is recurrent or disseminated infection by intracellular
    pathogens a competent IFN-gamma response would contain: the BCG vaccine strain,
    environmental non-tuberculous mycobacteria (chiefly Mycobacterium avium complex),
    Mycobacterium tuberculosis, and — rarely — the dimorphic fungus Histoplasma capsulatum.
    This node initiates the infectious phenotypes; bone and lymph node, macrophage-rich sites
    with slow local clearance, are characteristically involved.
  downstream:
  - target: Multifocal mycobacterial osteomyelitis
  - target: BCG-associated disease
  - target: Non-tuberculous mycobacterial infection
  - target: Mycobacterium avium complex infection
  - target: Granulomatous lymphadenitis
  - target: Cutaneous mycobacterial granuloma
  - target: Tuberculosis
  - target: Disseminated histoplasmosis
  evidence:
  - reference: PMID:15589309
    reference_title: "Clinical features of dominant and recessive interferon gamma receptor 1 deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In dominant patients, 30 (79%) had environmental mycobacterial disease and 11 (73%) of 15
      BCG-vaccinated patients had BCG disease.
    explanation: >-
      Quantifies environmental mycobacterial and BCG disease as the dominant clinical outcomes of
      the failed macrophage control at this node.
phenotypes:
- category: Infectious
  name: Multifocal mycobacterial osteomyelitis
  description: >
    The prototypical manifestation. BCG or environmental mycobacterial infection presents as
    unifocal or, characteristically, multifocal osteomyelitis of long bones, vertebrae, ribs
    and skull, often without other organ involvement. Mycobacterium avium complex osteomyelitis
    is the classic form, and bone-only disease occurs almost exclusively in the dominant
    partial rather than the recessive complete form.
  phenotype_term:
    preferred_term: Multifocal mycobacterial osteomyelitis
    term:
      id: HP:5210276
      label: Unusual mycobacterial osteomyelitis
  evidence:
  - reference: PMID:15589309
    reference_title: "Clinical features of dominant and recessive interferon gamma receptor 1 deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      M avium complex osteomyelitis was more frequent in dominant than in recessive patients
      (22/28 [79%] vs 1/8 [13%], p=0.002), and this disorder without other organ involvement
      arose only in dominant patients (9/28 [32%]).
    explanation: >-
      Establishes multifocal M. avium osteomyelitis, frequently bone-only, as the dominant-form
      hallmark phenotype.
- category: Infectious
  name: BCG-associated disease
  description: >
    Disease caused by the live M. bovis BCG vaccine strain after routine vaccination, ranging
    from local BCGitis to disseminated BCGosis, but in this disorder most characteristically
    manifesting as BCG osteomyelitis. It is the presenting event in vaccinated children.
  phenotype_term:
    preferred_term: BCG osteomyelitis
    term:
      id: HP:5210408
      label: BCG-associated disease
  evidence:
  - reference: PMID:11865431
    reference_title: "Genetic basis of patients with bacille Calmette-Guérin osteomyelitis in Japan: identification of dominant partial interferon-gamma receptor 1 deficiency as a predominant type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      partial dominant IFN-gammaR1 deficiency was the most common in Japanese patients who showed
      predisposition to curable BCG osteomyelitis.
    explanation: >-
      Establishes BCG (osteomyelitic) disease as the defining, and treatable, presentation of the
      dominant partial form.
- category: Infectious
  name: Non-tuberculous mycobacterial infection
  description: >
    Susceptibility to weakly virulent environmental non-tuberculous mycobacteria — the usual
    precipitant in unvaccinated patients. Environmental mycobacterial disease affected about
    four-fifths of dominant patients in the largest series.
  phenotype_term:
    preferred_term: Non-tuberculous mycobacterial infection
    term:
      id: HP:5210115
      label: Non-tuberculous mycobacterial infection
  evidence:
  - reference: PMID:15589309
    reference_title: "Clinical features of dominant and recessive interferon gamma receptor 1 deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In dominant patients, 30 (79%) had environmental mycobacterial disease and 11 (73%) of 15
      BCG-vaccinated patients had BCG disease.
    explanation: >-
      Quantifies environmental (non-tuberculous) mycobacterial disease as a core feature of the
      dominant form.
- category: Infectious
  name: Mycobacterium avium complex infection
  description: >
    Mycobacterium avium complex is the commonest environmental mycobacterial agent, causing
    disseminated infection with multifocal osteomyelitis and necrotizing granulomatous
    lymphadenitis.
  phenotype_term:
    preferred_term: Mycobacterium avium complex infection
    term:
      id: HP:5210364
      label: Unusual Mycobacterium avium complex infection
  evidence:
  - reference: PMID:26054576
    reference_title: "Disseminated Mycobacterium avium complex infection in a child with partial dominant interferon gamma receptor 1 deficiency in India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      disseminated infection due to Mycobacterium avium intracellulare (MAC) including multifocal

- name: Cell-Surface Accumulation of Truncated IFN-gammaR1
  biological_scale: MOLECULAR
  description: >-
    Truncated IFN-gammaR1 shows impaired turnover and increased surface abundance. In transiently transfected
    HEK293 cells, 774del4 and 818del4 proteins persisted after cycloheximide blocked new synthesis. This
    is increased persistence of an abnormal protein, not evidence of increased IFNGR1 transcription.
  biological_processes:
  - preferred_term: receptor catabolic process
    term:
      id: GO:0032801
      label: receptor catabolic process
    modifier: DECREASED
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  downstream:
  - target: Dominant-Negative Impairment of IFN-gamma Signaling
    causal_link_type: DIRECT
    description: >-
      The accumulated truncated receptors, lacking the JAK1/STAT1-docking motifs, compete with
      the wild-type receptor and blunt downstream signalling.
    evidence:
    - reference: PMID:17513528
      reference_title: "The novel IFNGR1 mutation 774del4 produces a truncated form of interferon-gamma receptor 1 and has a dominant-negative effect on interferon-gamma signal transduction."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        found that these mutants overexpressed IFNgammaR1 on the cell surface because of impaired
        receptor stability, which resulted in a dominant-negative effect on IFNgamma signal
        transduction.
      explanation: >-
        Directly links cell-surface overexpression of the truncated receptor to a
        dominant-negative signalling defect, the next node.
  evidence:
  - reference: PMID:11865431
    reference_title: "Genetic basis of patients with bacille Calmette-Guérin osteomyelitis in Japan: identification of dominant partial interferon-gamma receptor 1 deficiency as a predominant type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Expression of IFN-gammaR1 on monocytes was significantly increased in all 3 patients.
    explanation: >-
      Documents the increased cell-surface IFN-gammaR1 on patient monocytes that defines this
      node.
  - reference: PMID:17513528
    reference_title: The novel IFNGR1 mutation 774del4 produces a truncated form of interferon-gamma receptor 1 and has a dominant-negative effect on interferon-gamma signal transduction.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      The 774del4 and 818del4 mutant versions of IFNγR1 were consistently detected, even after the inhibition
      of translation by cycloheximide
    explanation: >-
      Transfected HEK293 cells retained the truncated proteins after translation blockade, directly supporting
      impaired receptor turnover.
- name: Dominant-Negative Impairment of IFN-gamma Signaling
  biological_scale: MOLECULAR
  description: >-
    Surface-accumulating truncated receptors interfere with signaling by the retained wild-type receptor.
    Patient-cell stimulation shows reduced but detectable STAT1 Tyr701 phosphorylation. The dominant-negative
    receptor mechanism is established, while the exact composition of nonproductive receptor complexes
    is not resolved by the 774del4 stability experiments.
  biological_processes:
  - preferred_term: type II interferon-mediated signaling pathway
    term:
      id: GO:0060333
      label: type II interferon-mediated signaling pathway
    modifier: DECREASED
  downstream:
  - target: Insufficient IFN-gamma-Dependent Macrophage Activation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced STAT1 signalling fails to deliver the full macrophage-activating program in
      response to IFN-gamma.
    evidence:
    - reference: PMID:17513528
      reference_title: The novel IFNGR1 mutation 774del4 produces a truncated form of interferon-gamma receptor 1 and has a dominant-negative effect on interferon-gamma signal transduction.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: >-
        The CD14‐positive cells from the patient produced a lower level of TNFα in response to IFNγ stimulation,
        regardless of the dose
      explanation: >-
        Purified patient CD14-positive cells were stimulated with LPS and graded IFN-gamma for 48 hours.
        TNF-alpha output was reduced relative to control cultures.
  evidence:
  - reference: PMID:17513528
    reference_title: "The novel IFNGR1 mutation 774del4 produces a truncated form of interferon-gamma receptor 1 and has a dominant-negative effect on interferon-gamma signal transduction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      IFNgammaR1 was overexpressed on the surfaces of CD14-positive cells from the peripheral
      blood of this patient, and STAT1 phosphorylation in response to high doses of IFNgamma was
      partially deficient.
    explanation: >-
      Documents the partial (not absent) STAT1 phosphorylation defect that defines this node.
- name: Insufficient IFN-gamma-Dependent Macrophage Activation
  biological_scale: CELLULAR
  description: >-
    Defective IFN-gamma signaling weakens the monocyte/macrophage cytokine activation program supporting
    antimycobacterial immunity. Patient CD14-positive cells carrying 774del4 produced less TNF-alpha after
    LPS plus IFN-gamma stimulation. A separate 818del4 family showed reduced IL-12 responses to IFN-gamma.
    These functional assays support impaired activation, but do not directly measure intracellular mycobacterial
    killing.
  biological_processes:
  - preferred_term: macrophage activation
    term:
      id: GO:0042116
      label: macrophage activation
    modifier: DECREASED
  cell_types:
  - preferred_term: macrophage
    term:
      id: CL:0000235
      label: macrophage
  downstream:

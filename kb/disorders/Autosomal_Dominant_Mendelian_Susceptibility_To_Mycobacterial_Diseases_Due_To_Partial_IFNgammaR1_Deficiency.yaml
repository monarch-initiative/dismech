treatments:
- name: Antimycobacterial Therapy
  description: >-
    Prolonged multidrug antimycobacterial treatment is selected by organism and susceptibility. Reported
    combinations include rifampicin, isoniazid, ethambutol and macrolides, with levofloxacin in refractory
    BCG disease. One severe MAC case received azithromycin, linezolid, moxifloxacin and bedaquiline; bedaquiline
    was stopped for QT prolongation and clofazimine was added. These are case-specific regimens, not a
    single standard combination for every pathogen.

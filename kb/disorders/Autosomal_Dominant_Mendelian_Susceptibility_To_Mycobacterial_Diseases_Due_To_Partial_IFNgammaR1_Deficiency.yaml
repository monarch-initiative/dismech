    reference_title: Two cases of partial dominant interferon-γ receptor 1 deficiency that presented with different clinical courses of bacille Calmette-Guérin multiple osteomyelitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Case 2: an 18-month-old girl developed multiple osteomyelitis 9 months after BCG inoculation.
    explanation: >-
      Directly documents vaccination preceding BCG osteomyelitis in a child with partial dominant IFNGR1
      deficiency.
  influences_mechanisms:
  - target: Susceptibility to Intracellular Pathogen Infection
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The live BCG strain is the mycobacterial challenge the partially deficient host cannot
      reliably clear, initiating BCG disease.
    evidence:
    - reference: PMID:11865431
      reference_title: "Genetic basis of patients with bacille Calmette-Guérin osteomyelitis in Japan: identification of dominant partial interferon-gamma receptor 1 deficiency as a predominant type."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        partial dominant IFN-gammaR1 deficiency was the most common in Japanese patients who showed
        predisposition to curable BCG osteomyelitis.
      explanation: >-
        Ties BCG (vaccine) exposure to the osteomyelitic disease that defines the dominant partial
        form.
differential_diagnoses:
- name: Autosomal recessive complete IFN-gammaR1 deficiency
  disease_term:
    preferred_term: Mendelian susceptibility to mycobacterial diseases due to complete IFNgammaR1 deficiency
    term:
      id: MONDO:0020530
      label: Mendelian susceptibility to mycobacterial diseases due to complete IFNgammaR1 deficiency
  description: >-
    The allelic recessive disorder abolishing the response to IFN-gamma. It is a separate MONDO
    concept, distinguished by much earlier onset, disseminated rather than bone-limited disease,
    and a severe, often fatal course; unlike the dominant partial form it may be curable by
    hematopoietic stem-cell transplantation.
  distinguishing_features:
  - Earlier first environmental-mycobacterial disease in the comparative series (mean 3.1 vs 13.4 years)
  - More disseminated and severe disease
  - Biallelic (recessive) inheritance and no residual IFN-gamma signalling
  evidence:
  - reference: PMID:15589309
    reference_title: "Clinical features of dominant and recessive interferon gamma receptor 1 deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      those with recessive deficiency were younger at onset of first environmental mycobacterial
      disease
    explanation: >-
      States the earlier onset of the recessive complete form, the axis on which it is
      distinguished from this dominant partial entry.
- name: Autosomal recessive partial IFN-gammaR1 deficiency
  disease_term:
    preferred_term: autosomal recessive Mendelian susceptibility to mycobacterial diseases due to partial IFNgammaR1 deficiency
    term:
      id: MONDO:0017901
      label: autosomal recessive Mendelian susceptibility to mycobacterial diseases due to partial IFNgammaR1 deficiency
  description: >-
    A separate MONDO concept caused by specific homozygous missense alleles (I87T, V63G, M1K) in
    which the receptor is expressed but hyporesponsive. It shares the partial, favourable phenotype
    but is recessive rather than dominant-negative.
  distinguishing_features:
  - Biallelic (recessive) missense genotype rather than a single heterozygous truncating allele
  - The receptor is not overexpressed at the cell surface
  evidence:
  - reference: PMID:32676075
    reference_title: "Transient Decrease of Circulating and Tissular Dendritic Cells in Patients With Mycobacterial Disease and With Partial Dominant IFNγR1 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with AR partial IFNγR1 deficiency, homozygous mutations include specifically the
      I87T, V63G, and M1K mutations
    explanation: >-
      Names the recessive partial genotypes, distinguishing them from this entry's heterozygous
      dominant-negative alleles.
    quote_role: BACKGROUND
- name: Other MSMD etiologies
  description: >-
    The rest of the MSMD gene set (IFNGR2, IL12B, IL12RB1, STAT1, IRF8, NEMO, and others) produces
    an overlapping mycobacterial-susceptibility picture. They are distinguished by the functional
    arm affected (IFN-gamma production versus response) and by genetic testing; some, such as
    IL12RB1 deficiency, add prominent salmonellosis and candidiasis.
  distinguishing_features:
  - Functional localisation of the lesion (IFN-gamma production versus response)
  - Gene-specific molecular testing
  evidence:
  - reference: PMID:19084105
    reference_title: "The genetic heterogeneity of mendelian susceptibility to mycobacterial diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mendelian susceptibility to mycobacterial diseases (MSMD) displays a high level of genetic
      heterogeneity.
    explanation: >-
      Establishes the genetic heterogeneity of MSMD, the basis for the other-etiology genetic
      differential diagnosis.
    quote_role: REVIEW_SYNTHESIS
- name: Langerhans cell histiocytosis
  disease_term:
    preferred_term: Langerhans cell histiocytosis
    term:
      id: MONDO:0018310
      label: Langerhans cell histiocytosis
  description: >-
    A non-infectious mimic. Multifocal osteolytic bone disease has led to IFN-gammaR1-deficient
    patients being misdiagnosed with Langerhans cell histiocytosis and treated with cytotoxic
    chemotherapy before the mycobacterial etiology was recognised.
  distinguishing_features:
  - Mycobacterial culture or PCR positivity
  - Granulomatous rather than histiocytic histology
  - Response to antimycobacterial therapy
  evidence:
  - reference: PMID:17513528
    reference_title: "The novel IFNGR1 mutation 774del4 produces a truncated form of interferon-gamma receptor 1 and has a dominant-negative effect on interferon-gamma signal transduction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      initially misdiagnosed as having accompanying Langerhans cell histiocytosis and were treated
      with cytotoxic chemotherapy
    explanation: >-
      Documents the reported misdiagnosis of multifocal osteomyelitis as Langerhans cell
      histiocytosis, the reason this is a differential.
    quote_role: BACKGROUND
discussions:
- discussion_id: ifngr1_ad_penetrance_prevalence_unquantified
  kind: KNOWLEDGE_GAP
  prompt: >-
    How does clinical penetrance vary with age and mycobacterial exposure, and what is the population
    prevalence of dominant partial IFNGR1 deficiency?
  attaches_to:
  - inheritance#Autosomal dominant
  rationale: >-
    The 2014 synthesis includes four asymptomatic individuals among 68 genetically affected individuals,
    establishing incomplete penetrance at ascertainment. Clinically ascertained series do not establish
    unbiased lifetime or age-specific risk, nor a population prevalence.
notes: >-
  The recessive complete and recessive partial IFNGR1 disorders remain separate allelic diagnoses. Receptor
  accumulation represents impaired turnover of a signaling-defective protein, not a gain of receptor signaling
  or simple reduced gene dosage. The proposed Ile183Val missense/splicing effect has not been functionally
  established in the 2016 osteoarticular-lesion screen and is not treated as an established dominant-negative
  allele here.
experimental_models:
- name: HEK293 cells expressing truncated IFN-gammaR1
  experimental_model_type: CELL_LINE
  cell_source: HEK293 cells transiently transfected with wild-type, 774del4 or 818del4 IFNGR1 constructs
  description: >-
    Cycloheximide blockade of protein synthesis followed by flow cytometry and immunoblotting demonstrated
    persistence of truncated receptors. This heterologous expression model addresses receptor stability;
    it does not reproduce the full immune phenotype.
  modeled_mechanisms:
  - target: Cell-Surface Accumulation of Truncated IFN-gammaR1
    relationship: PARTIALLY_RECAPITULATES
    limitations: Transient heterologous overexpression does not establish receptor-complex stoichiometry in patient macrophages.
  evidence:
  - reference: PMID:17513528
    reference_title: The novel IFNGR1 mutation 774del4 produces a truncated form of interferon-gamma receptor 1 and has a dominant-negative effect on interferon-gamma signal transduction.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      The 774del4 and 818del4 mutant versions of IFNγR1 were consistently detected, even after the inhibition
      of translation by cycloheximide
    explanation: >-
      Transfected HEK293 cells retained the truncated proteins after translation blockade, directly supporting
      impaired receptor turnover.
- name: Patient-derived IFN-gamma stimulation cultures
  experimental_model_type: PRIMARY_CELL_CULTURE
  cell_source: PBMCs and purified CD14-positive cells from the 774del4 patient and controls
  description: >-
    Cultured patient PBMCs showed diminished STAT1 phosphorylation after IFN-gamma stimulation, while
    purified CD14-positive cells produced reduced TNF-alpha after LPS plus IFN-gamma. These are functional
    cytokine assays rather than direct intracellular-pathogen killing experiments.
  modeled_mechanisms:
  - target: Dominant-Negative Impairment of IFN-gamma Signaling
    relationship: RECAPITULATES
  - target: Insufficient IFN-gamma-Dependent Macrophage Activation
    relationship: PARTIALLY_RECAPITULATES
    limitations: Cytokine readouts do not measure mycobacterial killing directly.
  evidence:
  - reference: PMID:17513528
    reference_title: "The novel IFNGR1 mutation 774del4 produces a truncated form of interferon-gamma receptor 1 and has a dominant-negative effect on interferon-gamma signal transduction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      IFNgammaR1 was overexpressed on the surfaces of CD14-positive cells from the peripheral
      blood of this patient, and STAT1 phosphorylation in response to high doses of IFNgamma was
      partially deficient.
    explanation: >-
      Documents the partial (not absent) STAT1 phosphorylation defect that defines this node.
  - reference: PMID:17513528
    reference_title: The novel IFNGR1 mutation 774del4 produces a truncated form of interferon-gamma receptor 1 and has a dominant-negative effect on interferon-gamma signal transduction.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      The CD14‐positive cells from the patient produced a lower level of TNFα in response to IFNγ stimulation,
      regardless of the dose
    explanation: >-
      Purified patient CD14-positive cells were stimulated with LPS and graded IFN-gamma for 48 hours.
      TNF-alpha output was reduced relative to control cultures.

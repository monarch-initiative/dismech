    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Reduced IFN-gamma-dependent activation contributes to susceptibility to mycobacterial infection;
      direct pathogen-killing measurements were not part of these cytokine assays.
    evidence:
    - reference: PMID:17513528
      reference_title: The novel IFNGR1 mutation 774del4 produces a truncated form of interferon-gamma receptor 1 and has a dominant-negative effect on interferon-gamma signal transduction.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND

      autosomal dominant IFN-γ receptor 1 deficiency.
    explanation: >-
      Describes the flow-cytometry finding that localises the defect to the dominant IFN-gammaR1
      form.
- name: IFNGR1 sequencing
  description: >-
    Sequencing identifies a heterozygous truncating IFNGR1 allele in the appropriate clinical and functional
    context. Results support family testing and differentiation from recessive IFNGR1 and other MSMD etiologies.
  evidence:

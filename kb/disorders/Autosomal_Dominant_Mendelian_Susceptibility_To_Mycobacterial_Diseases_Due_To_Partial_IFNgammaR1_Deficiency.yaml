    reference_title: "Disseminated histoplasmosis in persons with interferon-gamma receptor 1 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a patient with recurrent disseminated Histoplasma capsulatum osteomyelitis who
      had an autosomal dominant form of IFN-gamma receptor 1 deficiency (i.e., a 4-bp deletion at
      or near base 818).
    explanation: >-
      A worked case of disseminated histoplasmosis in a patient with the 818-region autosomal
      dominant IFNGR1 deletion.

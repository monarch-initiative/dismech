- name: Susceptibility to Intracellular Pathogen Infection
  biological_scale: ORGANISM
  description: >-
    Impaired IFN-gamma immunity predisposes to BCG and environmental mycobacteria, with occasional tuberculosis,
    Salmonella or dimorphic fungal disease. Bone, lymph nodes and skin may be involved. These clinical
    outcomes support deficient host control without establishing a bone-specific macrophage mechanism.
  downstream:

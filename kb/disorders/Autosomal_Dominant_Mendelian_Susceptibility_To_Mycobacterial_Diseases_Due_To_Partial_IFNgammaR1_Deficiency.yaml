- category: Infectious
  name: Disseminated histoplasmosis
  description: >
    A rarer non-mycobacterial manifestation. IFN-gamma-dependent macrophage activation is also
    required to control the dimorphic fungus Histoplasma capsulatum, and disseminated
    histoplasmosis with osteomyelitis is reported in the dominant partial form.
  phenotype_term:

name: Autosomal Dominant Mendelian Susceptibility To Mycobacterial Diseases Due To Partial IFNgammaR1 Deficiency
creation_date: "2026-09-30T00:00:00Z"
category: Mendelian
synonyms:
- immunodeficiency 27B
- IMD27B
- autosomal dominant MSMD due to partial interferon gamma receptor 1 deficiency
- autosomal dominant MSMD due to partial IFNgammaR1 deficiency
- IFNGR1 deficiency, autosomal dominant
- Mycobacteriosis, autosomal dominant
description: >-
  Autosomal dominant partial interferon-gamma receptor 1 deficiency is an inherited immune defect causing
  susceptibility to BCG and environmental mycobacteria, often with osteomyelitis and granulomatous lymphadenitis.
  Heterozygous truncating IFNGR1 variants clustered in exon 6 produce surface-accumulating receptors with
  impaired intracellular signaling. These interfere with the retained wild-type receptor through a dominant-negative
  mechanism. Residual IFN-gamma responses distinguish this disorder from autosomal recessive complete
  IFN-gammaR1 deficiency. Clinical severity is variable and some carriers remain asymptomatic. In a 2004
  comparative series, the mean age at the first environmental-mycobacterial episode was 13.4 years; BCG-associated
  illness can begin in infancy. Management centers on prolonged, organism-directed antimycobacterial therapy,
  sometimes with adjunctive recombinant IFN-gamma. Severe refractory cases are reported despite the generally
  milder course relative to complete receptor deficiency. This entry covers IMD27B (OMIM:615978; MONDO:0014429);
  recessive complete and recessive partial IFNGR1 deficiencies are separate disorders.

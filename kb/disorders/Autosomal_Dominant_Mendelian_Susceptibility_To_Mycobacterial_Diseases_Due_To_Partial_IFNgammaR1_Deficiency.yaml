      term:
        id: hgnc:5439
        label: IFNGR1
    variant_type: deletion
    genomic_contexts:
    - coding sequence
  description: >-
    A heterozygous small coding deletion in IFNGR1 exon 6, such as legacy 818del4, 811del4 or 774del4,
    shifts the reading frame and truncates the intracellular receptor domain. The retained wild-type allele
    supplies full-length receptor.
  downstream:
  - target: Cell-Surface Accumulation of Truncated IFN-gammaR1
    causal_link_type: DIRECT
    description: >-
      Intracellular truncation disrupts receptor turnover and permits accumulation of the shortened receptor
      at the surface.
    evidence:
    - reference: PMID:10192386
      reference_title: "A human IFNGR1 small deletion hotspot associated with dominant susceptibility to mycobacterial infection."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        The mutant alleles encode cell-surface IFNgamma receptors that lack the intra-cytoplasmic
        domain, which, through a combination of impaired recycling, abrogated signalling and
        normal binding to IFNgamma exert a dominant-negative effect.
      explanation: >-
        States that the truncated receptors reach the cell surface with impaired recycling, the
        step this edge describes.
  evidence:
  - reference: PMID:10192386

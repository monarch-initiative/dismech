prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: UNKNOWN
  notes: >-
    No population prevalence is established. The 2004 comparative series included 38 dominant partial
    cases. A 2014 literature synthesis counted 68 genetically affected individuals in 43 families, including
    four asymptomatic for the MSMD case-definition phenotype. These historical, clinically ascertained
    totals are not population rates.
  evidence:
  - reference: PMID:15589309
    reference_title: "Clinical features of dominant and recessive interferon gamma receptor 1 deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 22 patients with recessive complete IFNgammaR1 deficiency and 38 with
      dominant partial deficiency.
    explanation: >-
      The 38 dominant partial patients are the 2004 comparative cohort, not a current worldwide case total.
  - reference: PMID:25453225
    reference_title: "Mendelian susceptibility to mycobacterial disease: genetic, immunological, and clinical features of inborn errors of IFN-γ immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In total, 43 families containing 68 patients have been described, including four asymptomatic patients
      for the case-definition MSMD phenotype
    explanation: >-
      The 2014 synthesis establishes incomplete clinical penetrance; this ascertained case series is not
      a population prevalence or lifetime penetrance estimate.
clinical_burden:
  burden_level: MODERATE
  rationale: >-
    Recurrent mycobacterial infection and osteomyelitis require prolonged multidrug therapy. The dominant
    partial group had fewer infections and better survival than recessive complete deficiency in the comparative
    cohort. MODERATE summarizes this relative burden; severe disseminated and refractory cases can cause
    major disability and interrupted schooling.
  evidence:
  - reference: PMID:15589309
    reference_title: "Clinical features of dominant and recessive interferon gamma receptor 1 deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      M avium complex osteomyelitis was more frequent in dominant than in recessive patients
      (22/28 [79%] vs 1/8 [13%], p=0.002), and this disorder without other organ involvement
      arose only in dominant patients (9/28 [32%]).
    explanation: >-
      In the MAC-infected subgroup, osteomyelitis occurred in 22/28 dominant partial cases and bone-only
      disease in 9/28; this supports substantial skeletal morbidity without measuring quality of life.
  - reference: PMID:36193331
    reference_title: "Mendelian Susceptibility to Mycobacterial Diseases (MSMD) in a 13-Year-Old Ethiopian Girl with Autosomal Dominant Interferon Gamma Receptor 1(IFN-γ R1) Defect: A Clinical Diagnostic and Treatment Challenge."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      She was a fourth-grade student with average performance but has now discontinued school because
      of her illness.
    explanation: >-
      A severe case illustrates educational disability; it is not a frequency estimate.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Heterozygous truncating IFNGR1 variants act dominantly over a retained wild-type allele. Multigenerational
    transmission and de novo variants are documented. Clinical expression ranges from no MSMD manifestations
    to localized osteomyelitis or disseminated recurrent infection. Four of 68 individuals in the 2014
    synthesis were asymptomatic for the case-definition phenotype; age- and exposure-specific risk remains
    uncertain.
  evidence:
  - reference: PMID:10192386
    reference_title: "A human IFNGR1 small deletion hotspot associated with dominant susceptibility to mycobacterial infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We describe 18 patients from several generations of 12 unrelated families who were
      heterozygous for 1 to 5 overlapping IFNGR1 frameshift small deletions and a wild-type
      IFNGR1 allele.
    explanation: >-
      Documents the heterozygous, multigenerational (dominant) transmission of the causal
      IFNGR1 deletions alongside a retained wild-type allele.
  - reference: PMID:42702282
    reference_title: "Mycobacterial infections and recurrent osteomyelitis in a patient with an autosomal dominant mutation in IFN-gamma receptor 1 with overexpression of the receptor."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sanger sequencing identified the heterozygous IFNGR1 c.805delT (p.Tyr269Ilefs*8) variant
      in the patient but not in his parents, consistent with a de novo event.
    explanation: >-
      Documents de novo occurrence of a dominant IFNGR1 truncating allele.
  - reference: PMID:25453225
    reference_title: "Mendelian susceptibility to mycobacterial disease: genetic, immunological, and clinical features of inborn errors of IFN-γ immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In total, 43 families containing 68 patients have been described, including four asymptomatic patients
      for the case-definition MSMD phenotype
    explanation: >-
      The 2014 synthesis establishes incomplete clinical penetrance; this ascertained case series is not
      a population prevalence or lifetime penetrance estimate.
  penetrance: INCOMPLETE
genetic:
- name: IFNGR1
  gene_term:
    preferred_term: IFNGR1
    term:
      id: hgnc:5439
      label: IFNGR1
  association: CAUSATIVE
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  features: >-
    IFNGR1 encodes the ligand-binding chain of the IFN-gamma receptor. Established dominant partial alleles
    truncate the intracellular domain in exon 6. They include small frameshift deletions (legacy 818del4,
    811del4 and 774del4), the reported insertion 817insA, and the nonsense substitution E278X. Impaired
    receptor turnover and dominant-negative signaling distinguish these alleles from simple haploinsufficiency.
    These legacy names are retained without assigning an unreported transcript or converting coordinates.
  evidence:
  - reference: PMID:10192386
    reference_title: "A human IFNGR1 small deletion hotspot associated with dominant susceptibility to mycobacterial infection."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We thus report a hotspot for human IFNGR1 small deletions that confer dominant
      susceptibility to infections caused by poorly virulent mycobacteria.
    explanation: >-
      Identifies the IFNGR1 small-deletion hotspot as the causal, dominantly-acting lesion of
      this disease.
  - reference: PMID:17513528
    reference_title: "The novel IFNGR1 mutation 774del4 produces a truncated form of interferon-gamma receptor 1 and has a dominant-negative effect on interferon-gamma signal transduction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Dominant forms of IFNgammaR1 deficiency are known to be associated with mutations that
      introduce a premature stop codon in the intracellular domain of IFNgammaR1.
    explanation: >-
      Establishes that the dominant alleles are intracellular-domain-truncating premature stop
      mutations, the shared molecular class in this entry.
  - reference: PMID:11865431
    reference_title: "Genetic basis of patients with bacille Calmette-Guérin osteomyelitis in Japan: identification of dominant partial interferon-gamma receptor 1 deficiency as a predominant type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous small deletions with frameshift (818del4 and 811del4) that are consistent
      with the diagnosis of partial dominant IFN-gamma receptor 1 (IFN-gammaR1) deficiency were
      detected in 3 unrelated patients.
    explanation: >-
      Documents the heterozygous exon-6 frameshift deletions (818del4/811del4) as the recurrent
      causal alleles.
  - reference: PMID:25453225
    reference_title: "Mendelian susceptibility to mycobacterial disease: genetic, immunological, and clinical features of inborn errors of IFN-γ immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Other mutations in the immediate vicinity of 818del4 may also underlie AD IFN-γR1 deficiency (818delT,
      794delT, E278X, 811del4, 774del4 and 805delT)
    explanation: >-
      The reviewed allelic series includes a nonsense allele as well as frameshift deletions.
  - reference: PMID:17513528
    reference_title: The novel IFNGR1 mutation 774del4 produces a truncated form of interferon-gamma receptor 1 and has a dominant-negative effect on interferon-gamma signal transduction.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      In addition, the 811del4, 817insA, 818delT and G832T mutations have been reported.
    explanation: >-
      The introduction reports an insertion and a substitution in the dominant allelic series; these are
      background, not new alleles from the 774del4 experiment.

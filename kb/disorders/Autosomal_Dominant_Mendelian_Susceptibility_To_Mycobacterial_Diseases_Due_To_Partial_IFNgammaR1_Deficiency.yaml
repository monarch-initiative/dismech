- name: Recombinant Interferon Gamma
  description: >-
    Adjunctive recombinant IFN-gamma has been used with antimycobacterial therapy in refractory dominant
    partial deficiency, where residual receptor signaling remains. Benefit is variable: one BCG case had
    only transient improvement on high-dose antimycobacterial drugs plus IFN-gamma before remission with
    a levofloxacin-containing combination. Administration supplements signaling; it does not replace the
    defective receptor.

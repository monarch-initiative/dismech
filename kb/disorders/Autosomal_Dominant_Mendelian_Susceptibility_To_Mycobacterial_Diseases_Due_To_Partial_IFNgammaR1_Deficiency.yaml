- category: Infectious
  name: Granulomatous lymphadenitis
  description: >
    Regional or generalized lymphadenopathy with granulomatous, sometimes necrotizing,
    lymphadenitis accompanies mycobacterial disease and may be the presenting sign.
  phenotype_term:
    preferred_term: Necrotizing granulomatous lymphadenitis
    term:

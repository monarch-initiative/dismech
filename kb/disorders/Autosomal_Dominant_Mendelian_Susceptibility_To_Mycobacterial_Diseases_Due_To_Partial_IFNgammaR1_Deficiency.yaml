name: Autosomal Dominant Mendelian Susceptibility To Mycobacterial Diseases Due To Partial IFNgammaR1 Deficiency
creation_date: "2026-09-30T00:00:00Z"
category: Mendelian
synonyms:
- immunodeficiency 27B
- IMD27B
- autosomal dominant MSMD due to partial interferon gamma receptor 1 deficiency
- autosomal dominant MSMD due to partial IFNgammaR1 deficiency
- IFNGR1 deficiency, autosomal dominant
- Mycobacteriosis, autosomal dominant
description: >
  Autosomal dominant partial interferon-gamma receptor 1 (IFN-gammaR1) deficiency is an
  inborn error of immunity and one of the genetic etiologies of Mendelian susceptibility to
  mycobacterial disease (MSMD): a selective predisposition to clinical disease caused by
  weakly virulent mycobacteria — the Bacille Calmette-Guerin (BCG) vaccine strain and
  environmental non-tuberculous mycobacteria (NTM) — in individuals whose routine
  immunological work-up is otherwise unremarkable.

  Almost every genetic etiology of MSMD converges on interferon gamma (IFN-gamma), either
  impairing production of the cytokine or the cellular response to it. This disorder sits on
  the response arm. It is caused by heterozygous truncating mutations of IFNGR1 clustered in
  exon 6, of which the 4-bp microdeletion 818del4 is a recurrent hotspot; the related 811del4
  and 774del4 alleles behave identically. Each introduces a premature stop codon in the
  intracellular domain, producing a receptor that binds IFN-gamma normally but lacks the
  cytoplasmic JAK1-docking and STAT1-docking motifs and the membrane-proximal region required
  for receptor internalisation and degradation. The truncated receptors are therefore not
  recycled or degraded and accumulate at the cell surface, where they compete with the
  wild-type receptor encoded by the intact allele for ligand and receptor-complex formation.
  This is the dominant-negative mechanism: a single mutant allele blunts signalling below the
  protective threshold even though one wild-type allele remains. Residual IFN-gamma signalling
  persists — partial STAT1 phosphorylation and HLA class II induction are detectable — which
  is why the disease is milder and later in onset than autosomal recessive complete IFN-gammaR1
  deficiency.

  The clinical hallmark is BCG or environmental mycobacterial disease presenting as unifocal
  or multifocal osteomyelitis, often with regional or generalized lymphadenopathy; Mycobacterium
  avium complex is the commonest environmental agent. Onset is later than in the recessive
  complete form (mean 13.4 years against 3.1 years in the largest comparative series), and the course is relapsing-remitting but generally survivable, in contrast to
  the early, often fatal disseminated disease of the recessive complete form. Because residual
  receptor function is present, prolonged antimycobacterial chemotherapy plus, where needed,
  adjunctive recombinant IFN-gamma is the mainstay, and live BCG vaccine is contraindicated in
  affected individuals and at-risk relatives. Hematopoietic stem-cell transplantation is
  reserved for MSMD patients whose response to IFN-gamma is abolished, which is not the case in
  this partial form.

  This entry curates the autosomal dominant partial IFN-gammaR1 deficiency (IMD27B,
  MONDO:0014429) only. Autosomal recessive complete IFN-gammaR1 deficiency (MONDO:0020530) and
  autosomal recessive partial IFN-gammaR1 deficiency (MONDO:0017901) are distinct MONDO concepts
  and appear here only as differential diagnoses.

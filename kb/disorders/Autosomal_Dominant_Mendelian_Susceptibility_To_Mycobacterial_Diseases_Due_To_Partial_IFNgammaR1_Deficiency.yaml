diagnosis:
- name: Functional IFN-gamma signaling assay with IFN-gammaR1 surface expression
  description: >-
    Flow cytometry of monocyte surface IFN-gammaR1 and stimulation assays assess receptor accumulation
    and residual signaling. Reduced STAT1 phosphorylation or downstream cytokine output after IFN-gamma
    helps distinguish partial from complete deficiency; findings require interpretation with IFNGR1 sequencing.
  evidence:
  - reference: PMID:23036270
    reference_title: "Impact of molecular diagnosis on treating Mendelian susceptibility to mycobacterial diseases."
    supports: SUPPORT

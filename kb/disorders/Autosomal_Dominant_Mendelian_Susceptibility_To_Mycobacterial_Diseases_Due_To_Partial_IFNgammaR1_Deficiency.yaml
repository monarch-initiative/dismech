diagnosis:
- name: Functional IFN-gamma signaling assay with IFN-gammaR1 surface expression
  description: >
    The functional work-up localises the lesion. Cell-surface IFN-gammaR1 is measured by flow
    cytometry — overexpression on monocytes points to the dominant partial form — and the
    cellular response to IFN-gamma (STAT1 phosphorylation, HLA class II induction, downstream
    cytokine induction) is assessed and found partially, not completely, deficient.
  evidence:
  - reference: PMID:23036270
    reference_title: "Impact of molecular diagnosis on treating Mendelian susceptibility to mycobacterial diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cell-surface receptor analysis showed IFN-γ receptor 1 overexpression, suggesting an
      autosomal dominant IFN-γ receptor 1 deficiency.
    explanation: >-
      Describes the flow-cytometry finding that localises the defect to the dominant IFN-gammaR1
      form.
- name: IFNGR1 sequencing
  description: >
    Molecular confirmation identifies the heterozygous exon-6 truncating IFNGR1 allele and
    assigns the etiology, which matters because it determines management (adjunctive IFN-gamma,
    contraindication of BCG, and that HSCT, reserved for abolished IFN-gamma responses, is not
    the first-line option).
  evidence:
  - reference: PMID:23036270
    reference_title: "Impact of molecular diagnosis on treating Mendelian susceptibility to mycobacterial diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      cDNA sequencing identified the IFNGR1 818del4 mutation in three members of the family with
      known MSMD
    explanation: >-
      Illustrates genetic confirmation of the heterozygous IFNGR1 818del4 allele establishing the
      diagnosis.
treatments:
- name: Antimycobacterial Therapy
  description: >
    Prolonged multidrug antimycobacterial chemotherapy is the mainstay for the infection
    itself, guided by species identification and susceptibility. Regimens combine agents such
    as rifampicin, isoniazid, ethambutol and a macrolide (clarithromycin), and refractory
    disease may require second-line agents such as levofloxacin. It treats the organism, not
    the immune defect, and courses are long because of the chronic, relapsing nature of the
    disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: multidrug antimycobacterial chemotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
    - preferred_term: isoniazid
      term:
        id: CHEBI:6030
        label: isoniazide
    - preferred_term: ethambutol
      term:
        id: CHEBI:4877
        label: ethambutol
    - preferred_term: clarithromycin
      term:
        id: CHEBI:3732
        label: clarithromycin
  target_mechanisms:
  - target: Impaired Control of Intramacrophagic Mycobacteria
    treatment_effect: INHIBITS
    description: >-
      Antimycobacterial drugs act directly on the organism, substituting pharmacological
      killing for the macrophage-mediated killing the host performs only partially.
  evidence:
  - reference: PMID:23053508
    reference_title: "Two cases of partial dominant interferon-γ receptor 1 deficiency that presented with different clinical courses of bacille Calmette-Guérin multiple osteomyelitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      complete remission has since been achieved by combination antimycobacterial therapy,
      including levofloxacin.
    explanation: >-
      Documents multidrug antimycobacterial therapy, escalated with levofloxacin, achieving
      remission in a dominant partial patient.
- name: Recombinant Interferon Gamma
  description: >
    Because residual receptor function is present, adjunctive subcutaneous recombinant
    IFN-gamma engages the retained wild-type receptor and augments the macrophage-activating
    signal; it is added to antibiotics in refractory disease. This is the therapeutic dividing
    line within MSMD, and it is where the dominant partial form differs from the recessive
    complete form, in which the response to IFN-gamma is abolished and hematopoietic stem-cell
    transplantation is the treatment option.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: interferon gamma-1b
      term:
        id: NCIT:C100089
        label: Interferon Gamma-1b
  target_mechanisms:
  - target: Insufficient IFN-gamma-Dependent Macrophage Activation
    treatment_effect: ACTIVATES
    description: >-
      Exogenous recombinant IFN-gamma drives the residual wild-type receptor above the signalling
      threshold, restoring part of the macrophage-activating program.
    evidence:
    - reference: PMID:17513528
      reference_title: "The novel IFNGR1 mutation 774del4 produces a truncated form of interferon-gamma receptor 1 and has a dominant-negative effect on interferon-gamma signal transduction."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        adjunctive therapeutic administration of IFNγ is beneficial for patients with dominant
        forms of IFNγR1 deficiency
      explanation: >-
        States that adjunctive IFN-gamma is beneficial specifically in the dominant forms, the
        rationale for this treatment acting on residual receptor.
  evidence:
  - reference: PMID:26054576
    reference_title: "Disseminated Mycobacterium avium complex infection in a child with partial dominant interferon gamma receptor 1 deficiency in India."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      subcutaneous IFN-γ was added as a modality of treatment for resistant MAC infection.
    explanation: >-
      Documents adjunctive subcutaneous recombinant IFN-gamma used for resistant infection in the
      dominant partial form.
- name: Avoidance of BCG Vaccination
  description: >
    The live BCG vaccine is the commonest trigger of disease, so it is contraindicated in an
    affected individual and should be withheld from at-risk relatives pending genetic testing.
    Early diagnosis allowing BCG to be avoided prevents BCG osteomyelitis.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: avoidance of live BCG vaccination
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Impaired Control of Intramacrophagic Mycobacteria
    treatment_effect: INHIBITS
    description: >-
      Withholding the live vaccine removes the mycobacterial challenge the partially deficient
      host cannot reliably contain.
  evidence:
  - reference: PMID:35074548
    reference_title: "Early diagnosis of partial interferon-γ receptor 1 deficiency prevents the development of Bacille de Calmette et Guérin osteomyelitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      He avoided BCG vaccination and has been disease-free since then.
    explanation: >-
      A worked case in which avoiding BCG in a diagnosed carrier prevented disease.
- name: Genetic Counseling
  description: >
    Autosomal dominant inheritance carries a 50% transmission risk, and cascade testing of
    relatives identifies carriers who should avoid live BCG. Genetic counseling is therefore a
    core management element.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:35074548
    reference_title: "Early diagnosis of partial interferon-γ receptor 1 deficiency prevents the development of Bacille de Calmette et Guérin osteomyelitis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early diagnosis is considered to be useful for genetic counseling and essential for
      preventing BCG osteomyelitis.
    explanation: >-
      States the role of genetic counseling and early diagnosis in preventing BCG disease in this
      disorder.
environmental:
- name: Bacille Calmette-Guerin (BCG) vaccination
  description: >
    Routine BCG immunisation is the sentinel exposure. The attenuated M. bovis BCG strain is
    harmless to immunocompetent infants but is not reliably contained by the partially deficient
    host, in whom it causes BCG disease — most characteristically osteomyelitis. In countries
    that vaccinate at birth the exposure precedes any possibility of diagnosis.
  exposure_term:
    preferred_term: exposure to Bacille Calmette-Guerin vaccine
    term:
      id: ECTO:2000129
      label: exposure to vaccination
  influences_mechanisms:
  - target: Impaired Control of Intramacrophagic Mycobacteria
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The live BCG strain is the mycobacterial challenge the partially deficient host cannot
      reliably clear, initiating BCG disease.
    evidence:
    - reference: PMID:11865431
      reference_title: "Genetic basis of patients with bacille Calmette-Guérin osteomyelitis in Japan: identification of dominant partial interferon-gamma receptor 1 deficiency as a predominant type."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        partial dominant IFN-gammaR1 deficiency was the most common in Japanese patients who showed
        predisposition to curable BCG osteomyelitis.
      explanation: >-
        Ties BCG (vaccine) exposure to the osteomyelitic disease that defines the dominant partial
        form.
differential_diagnoses:
- name: Autosomal recessive complete IFN-gammaR1 deficiency
  disease_term:
    preferred_term: Mendelian susceptibility to mycobacterial diseases due to complete IFNgammaR1 deficiency
    term:
      id: MONDO:0020530
      label: Mendelian susceptibility to mycobacterial diseases due to complete IFNgammaR1 deficiency
  description: >-
    The allelic recessive disorder abolishing the response to IFN-gamma. It is a separate MONDO
    concept, distinguished by much earlier onset, disseminated rather than bone-limited disease,
    and a severe, often fatal course; unlike the dominant partial form it may be curable by
    hematopoietic stem-cell transplantation.
  distinguishing_features:
  - Earlier age at onset (mean 3.1 vs 13.4 years)
  - More disseminated and severe disease
  - Biallelic (recessive) inheritance and no residual IFN-gamma signalling
  evidence:
  - reference: PMID:15589309
    reference_title: "Clinical features of dominant and recessive interferon gamma receptor 1 deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      those with recessive deficiency were younger at onset of first environmental mycobacterial
      disease
    explanation: >-
      States the earlier onset of the recessive complete form, the axis on which it is
      distinguished from this dominant partial entry.
- name: Autosomal recessive partial IFN-gammaR1 deficiency
  disease_term:
    preferred_term: autosomal recessive Mendelian susceptibility to mycobacterial diseases due to partial IFNgammaR1 deficiency
    term:
      id: MONDO:0017901
      label: autosomal recessive Mendelian susceptibility to mycobacterial diseases due to partial IFNgammaR1 deficiency
  description: >-
    A separate MONDO concept caused by specific homozygous missense alleles (I87T, V63G, M1K) in
    which the receptor is expressed but hyporesponsive. It shares the partial, favourable phenotype
    but is recessive rather than dominant-negative.
  distinguishing_features:
  - Biallelic (recessive) missense genotype rather than a single heterozygous truncating allele
  - The receptor is not overexpressed at the cell surface
  evidence:
  - reference: PMID:32676075
    reference_title: "Transient Decrease of Circulating and Tissular Dendritic Cells in Patients With Mycobacterial Disease and With Partial Dominant IFNγR1 Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In patients with AR partial IFNγR1 deficiency, homozygous mutations include specifically the
      I87T, V63G, and M1K mutations
    explanation: >-
      Names the recessive partial genotypes, distinguishing them from this entry's heterozygous
      dominant-negative alleles.
- name: Other MSMD etiologies
  description: >-
    The rest of the MSMD gene set (IFNGR2, IL12B, IL12RB1, STAT1, IRF8, NEMO, and others) produces
    an overlapping mycobacterial-susceptibility picture. They are distinguished by the functional
    arm affected (IFN-gamma production versus response) and by genetic testing; some, such as
    IL12RB1 deficiency, add prominent salmonellosis and candidiasis.
  distinguishing_features:
  - Functional localisation of the lesion (IFN-gamma production versus response)
  - Gene-specific molecular testing
  evidence:
  - reference: PMID:19084105
    reference_title: "The genetic heterogeneity of mendelian susceptibility to mycobacterial diseases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mendelian susceptibility to mycobacterial diseases (MSMD) displays a high level of genetic
      heterogeneity.
    explanation: >-
      Establishes the genetic heterogeneity of MSMD, the basis for the other-etiology genetic
      differential diagnosis.
- name: Langerhans cell histiocytosis
  disease_term:
    preferred_term: Langerhans cell histiocytosis
    term:
      id: MONDO:0018310
      label: Langerhans cell histiocytosis
  description: >-
    A non-infectious mimic. Multifocal osteolytic bone disease has led to IFN-gammaR1-deficient
    patients being misdiagnosed with Langerhans cell histiocytosis and treated with cytotoxic
    chemotherapy before the mycobacterial etiology was recognised.
  distinguishing_features:
  - Mycobacterial culture or PCR positivity
  - Granulomatous rather than histiocytic histology
  - Response to antimycobacterial therapy
  evidence:
  - reference: PMID:17513528
    reference_title: "The novel IFNGR1 mutation 774del4 produces a truncated form of interferon-gamma receptor 1 and has a dominant-negative effect on interferon-gamma signal transduction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      initially misdiagnosed as having accompanying Langerhans cell histiocytosis and were treated
      with cytotoxic chemotherapy
    explanation: >-
      Documents the reported misdiagnosis of multifocal osteomyelitis as Langerhans cell
      histiocytosis, the reason this is a differential.
discussions:
- discussion_id: ifngr1_ad_penetrance_prevalence_unquantified
  kind: KNOWLEDGE_GAP
  prompt: >-
    What is the age-dependent penetrance of the dominant IFNGR1 truncating alleles, and what is
    the true population prevalence given that clinically unaffected carriers exist?
  attaches_to:
  - inheritance#Autosomal dominant
  rationale: >-
    Inheritance is dominant with incomplete, age-dependent penetrance and variable expressivity,
    and unaffected relatives carrying the same allele are documented, so the number of genetic
    carriers exceeds the number of diagnosed patients. But the cited primary sources report cohort
    counts and clinical series rather than a penetrance curve or a population rate for this specific
    etiology, so both the penetrance figure and the prevalence remain unquantified from the evidence
    curated here. This matters clinically because it governs whether an asymptomatic carrier
    identified by cascade testing should avoid live BCG.
notes: >-
  Scope. This entry curates the autosomal dominant partial IFN-gammaR1 deficiency (IMD27B,
  MONDO:0014429) only. The autosomal recessive complete (MONDO:0020530) and autosomal recessive
  partial (MONDO:0017901) IFNGR1 deficiencies are distinct MONDO concepts and are carried here only
  as differential diagnoses, not merged in.

  Term concept-fit. Granulomatous lymphadenitis is bound to HP:0002840 Lymphadenitis, the closest
  available HP term; the source describes necrotizing granulomatous lymphadenitis, and preferred_term
  records that specificity. Two laboratory phenotypes (increased cell-surface IFN-gammaR1 on
  monocytes; partially deficient STAT1 phosphorylation) carry no term because no HP term names
  the flow-cytometry receptor-overexpression or the partial-STAT1-phosphorylation assay reading; each
  keeps a descriptive preferred_term and is wired to its mechanism node via reports_on.

  functional_impact_category is DOMINANT_NEGATIVE rather than PARTIAL_LOSS_OF_FUNCTION: the mechanism
  is competition by an accumulated non-signalling receptor over a retained wild-type allele, which the
  sources state explicitly, not simple reduced dosage.

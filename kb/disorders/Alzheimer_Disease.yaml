- discussion_id: controversy_senescent_cell_identity_glia_versus_neurons
  prompt: >-
    Which cells are senescent in the human Alzheimer brain — astrocytes and
    microglia, plaque-associated oligodendrocyte progenitor cells, or excitatory
    neurons — and does the answer invalidate the therapeutic rationale for
    senolytics in Alzheimer disease?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Senescent Cell Accumulation
  rationale: >-
    The evidence conflicts on cell identity, and the conflict is consequential
    rather than academic, because senolytics work by killing the cells they
    target. Note first what the conflict is NOT: it is not a species split. A
    fourth study (PMID:30126037) reports both that microdissected tangle-bearing
    neurons from human post-mortem Alzheimer brain carry a senescence expression
    profile, and that in four transgenic mouse models it is neurofibrillary
    tangles rather than amyloid plaques that show the senescence-like phenotype.
    That is mouse and human evidence agreeing on NEURONS. The disagreement is
    between studies, not between model systems. Four studies give three answers. Genetic clearance of p16INK4A-positive
    cells in a tau mouse model attributes the pathology to senescent astrocytes
    and microglia and shows that removing them prevents tangle deposition and
    neuronal loss (PMID:30232451). A senolytic study in an amyloid model finds the
    senescent cell to be the plaque-associated oligodendrocyte progenitor cell and
    states explicitly that astrocytes, microglia and oligodendrocytes do not show
    the phenotype (PMID:30936558) — a direct contradiction of the first study's
    assignment, not merely a different emphasis. The largest human dataset, a
    senescence-eigengene analysis of roughly 140,000 nuclei from 76 postmortem
    brains, assigns more than 97% of senescent cells to excitatory neurons
    overlapping with neurofibrillary tangles (PMID:35531351).
    If the human result is right, a senolytic given for Alzheimer disease would be
    directed at postmitotic neurons rather than at dispensable glia, which is a
    different risk-benefit calculation from the one the mouse studies motivate.
    Both mouse results are causal and both human-relevant readings cannot be
    correct as stated. The main methodological objection to the human study is
    that it identifies senescence by a derived eigengene rather than a
    gold-standard marker; the main objection to the mouse studies is that the
    markers and models differ between them.
    Two further facts about the human study bear on how much weight it can carry,
    both checkable in its own methods. First, it is not an independent cohort: it
    generated no new sequencing data and re-scored two existing dorsolateral
    prefrontal cortex datasets, stating that "Datasets were accessed through
    Accelerating Medicines Partnership - AD (AMP-AD41) with Synapse IDs
    syn18485175 and syn21126462" — Mathys and Zhou respectively. Its cell-type
    call therefore inherits those studies' cell-type annotations and the
    neuron-versus-glia capture characteristics of their single-nucleus
    preparations. Second, to compare cell types it oversampled to equalize them,
    reporting that "we repeated the data of each astrocyte 104, endothelial cell
    2,919, excitatory neuron 10". Nominal counts are then balanced, but the
    effective number of independent observations behind a rare glial or vascular
    cell type is far smaller than behind an excitatory neuron. That is a reason to
    treat a negative result in the rarer types cautiously, rather than a
    demonstration that the positive result in neurons is an artifact.
    A further consideration now bears on the therapeutic stake: the first human
    senolytic trial in Alzheimer disease has reported (SToMP-AD, NCT04063124;
    PMID:37679434, PMID:40274471). It was open-label and uncontrolled in five
    participants, so it cannot test efficacy, but it establishes that the question
    is no longer purely preclinical and that a trial can be run before the
    cell-identity question is settled. Its biomarker result — stable CSF
    amyloid-beta and tau alongside a rise in CSF interleukin-6 — is not what a
    simple "clear the senescent cells, lower the SASP, reduce pathology" reading
    predicts, and is a further reason not to treat the mouse clearance results as
    directly transferable.
    Resolving this needs marker-agnostic
    single-cell senescence profiling in human tissue with orthogonal confirmation,
    and ideally a cell-type-restricted clearance experiment. The most direct
    available test is to re-score senescence signatures per cell type in a cohort
    with enough nuclei per glial class to give the glial hypotheses a fair chance —
    synapse:syn26223298 (SEA-AD, 84 donors, 139 molecular cell types, openly
    downloadable matrices) — and to check the neuron arm against geo:GSE129308,
    where tangle-bearing and tangle-free somas from the same donors make the
    senescence-overlaps-tangles claim testable against measured rather than
    inferred tangle status. Both are curated in this entry's `datasets:` block.
    Until then the
    Senescent Cell Accumulation node deliberately lists all four candidate cell
    types rather than choosing one.
  notes: >-
    Raised during a cell-biology review of this entry. All three references were
    fetched into references_cache/ and their snippets verified as exact
    substrings before curation; the two quoted methods statements were read from
    the cached full text of PMID:35531351. Note the entry separately carries an
    oligodendrocyte precursor cell plasma proteomic age gap biomarker, which is
    consistent with — but does not adjudicate — the OPC arm of this dispute.
- discussion_id: controversy_plaque_origin_intraneuronal_versus_secreted
  prompt: >-
    Does the senile plaque form from amyloid-beta secreted into the extracellular
    space, or is it the residue of a single neuron that accumulated amyloid-beta
    in de-acidified autolysosomes and then ruptured?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Neuronal Endosomal-Lysosomal Acidification Failure
  - pathophysiology#Amyloid Plaque Formation
  rationale: >-
    The two accounts make incompatible claims about where amyloid pathology
    begins, and they imply different therapeutic targets. The extracellular
    account, which the Amyloid Plaque Formation node and the amyloid_cascade_model
    encode, treats the plaque as a deposit of secreted peptide produced by
    sequential beta- and gamma-secretase cleavage of amyloid precursor protein;
    it is the premise of amyloid-directed monoclonal antibody therapy, which acts
    in the extracellular compartment. The inside-out account holds that
    autolysosome acidification declines in neurons well before extracellular
    deposition, that amyloid-beta and APP-βCTF build up inside enlarged
    de-acidified autolysosomes, and that individual neurons showing the resulting
    PANTHOS pattern are the principal source of senile plaques (PMID:35654956).
    Its human support is genuine but narrower than its mouse support: enlarged
    Rab5-positive endosomes are the earliest known intraneuronal change in
    sporadic disease and are present at preclinical stages (PMID:10880397), and
    intraneuronal amyloid-beta localizes principally to those endosomes
    (PMID:15465622), but the only verified human claim about PANTHOS itself is
    that the pattern is present in Alzheimer brains — not that it is the source of
    human plaques, a claim its authors scope to amyloid precursor protein
    transgenic models where APP is overexpressed.
    A further complication sits inside the human data: endosomes were of normal
    size in advanced presenilin-mutation familial disease (PMID:10880397), so the
    endosomal route does not generalize across Alzheimer genetic subtypes, even
    though PSEN1 is independently required for lysosomal acidification
    (PMID:20541250). Deciding this needs quantitative human neuropathology
    establishing what fraction of plaques have a neuronal origin, in brains not
    overexpressing APP.
  notes: >-
    Raised during a cell-biology review of this entry. Curated as a CONTROVERSY
    rather than a KNOWLEDGE_GAP because the two accounts are both actively
    defended and make opposing claims, rather than one of them being simply
    unstudied. The PANTHOS phenotype and the APP-βCTF/v-ATPase mechanism come from
    the same laboratory and are not independent replications of one another.
- discussion_id: mismatch_complement_synapse_pruning_mouse_versus_human_opsonin
  prompt: >-
    Does the C1q/C3/CR3 complement pathway that mediates microglial synapse
    elimination in Alzheimer mouse models operate in the human Alzheimer brain,
    where the only direct evidence of glial synapse ingestion implicates MFG-E8
    and involves astrocytes as well as microglia?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Complement-Mediated Microglial Synapse Elimination
  rationale: >-
    The necessity evidence for the complement route is entirely murine, and it is
    strong: blocking C1q, C3, or the microglial receptor CR3 each reduces early
    synapse loss (PMID:27033548), and a C1q-blocking antibody rescues synapse
    density in a tau model (PMID:30392797). The human evidence establishes the
    phenomenon but not the pathway. The study that directly demonstrates glial
    synapse ingestion in human Alzheimer tissue states that direct human evidence
    for glial involvement in synapse removal remained to be established, and finds
    that blocking MFG-E8 — not complement — reverses the elevated engulfment, with
    astrocytes participating alongside microglia (PMID:37652017). Human
    corroboration of complement specifically is limited to C1q accumulating in
    postsynaptic densities of Alzheimer patients, reported within a mouse study.
    This matters because anti-C1q antibody therapy is in clinical development on
    the strength of the mouse pathway. If the dominant human opsonin is MFG-E8, or
    if astrocytes rather than microglia are the principal effector, the mouse
    result could be real and the therapy still miss its target. A second, separate
    caution comes from within the mouse literature itself: C3 deletion protects
    synapses and cognition while increasing plaque burden (PMID:28566429), so
    complement inhibition trades amyloid clearance against synapse preservation
    rather than being unambiguously beneficial.
    Resolving this needs human tissue or human cellular models in which the
    complement and MFG-E8 routes are blocked separately and compared, and ideally
    a synaptic-density readout from the ongoing anti-C1q trials.
  notes: >-
    Raised during a cell-biology review of this entry. All four references were
    fetched into references_cache/ and their snippets verified as exact substrings
    before curation. The MFGE8 gene is listed on the pathophysiology node
    alongside the complement genes to keep this alternative visible at the point
    of use.

      cross-sectional design cannot distinguish whether HSV-1 reactivation
      drives the loss of RORB+ neurons or merely marks neurons destined to
      die.
  - reference: PMID:41405855
    reference_title: "Valacyclovir Treatment of Early Symptomatic Alzheimer Disease: The VALAD Randomized Clinical Trial."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "greater cognitive worsening with valacyclovir than placebo"
    explanation: >-
      The phase II VALAD randomized controlled trial (JAMA 2026) of
      valacyclovir 4 g/day vs placebo over 78 weeks in HSV-seropositive early
      symptomatic AD found no cognitive benefit and, if anything, greater
      decline in the treatment arm (between-group ADAS-Cog difference 3.93, 95%
      CI 1.03-6.83, P=.01). Direct interventional evidence that anti-HSV
      therapy does not help ESTABLISHED symptomatic AD — refuting the treatment
      corollary while leaving the upstream reactivation hypothesis and the
      pre-symptomatic-prevention question open (the same treatment-vs-prevention
      split seen in the zoster-vaccine natural experiments).
  - reference: PMID:41467972
    reference_title: "Anti-herpetic treatment reduces dementia risk: A systematic review and meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "diagnosed and treated versus diagnosed but untreated (aHR=0.77, 95%"
    explanation: >-
      Meta-analysis of 14 cohort studies in non-demented adults >=50 covering
      HSV and VZV finds anti-herpetic treatment associated with lower incident
      dementia (aHR 0.77 for diagnosed-and-treated vs diagnosed-but-untreated).

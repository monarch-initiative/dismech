- discussion_id: gap_ad_tcell_antigen_identity
  prompt: >-
    Do the clonally expanded, cytotoxic CD8+ T cells that drive tau-associated
    neurodegeneration recognize a tau-derived (or other brain) antigen, or are
    they antigen-independent (e.g., age-expanded virtual-memory CD8 T cells)?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Adaptive Immune T Cell Response to Tau Pathology
  rationale: >-
    The adaptive_immune_tcell_model reads "restricted TCR clonality" as evidence
    of an antigen-driven CD8 response, and cDC1 cross-presentation is now
    established as the priming route (PMID:41890046) — but the recognized
    antigen(s) remain unidentified. Two findings keep the antigen-driven
    interpretation open: aging independently expands antigen-independent
    virtual-memory CD8 T cells that are clonal and cytotoxic without foreign-antigen
    priming (PMID:42432776); and the clonally expanded CD8 TCRs recovered from
    human AD CSF were shown to be specific to Epstein-Barr virus antigens rather
    than tau (PMID:31915375). Distinguishing a tau-antigen-driven response from an
    antigen-independent (or virally-primed) bystander clonal expansion is the
    single most important unresolved edge in this model and gates whether
    tau-antigen-directed tolerization is even a coherent therapeutic strategy.
  proposed_experiments:
  - experiment_id: exp_ad_tcell_antigen_discovery
    name: Brain-infiltrating CD8 clone antigen-discovery screen
    description: >-
      Isolate brain- and CSF-infiltrating CD8+ T cell clones from tauopathy mice
      and human AD/primary-tauopathy tissue, pair single-cell TCR sequencing with
      peptide-MHC tetramer and pMHC-screen reactivity assays against tau-derived
      peptides, candidate self-antigens, and viral (EBV) antigens, and fate-map
      virtual-memory versus conventional-memory origin.
    experiment_type:
      preferred_term: antigen-specificity T cell reactivity screen
    assays:
    - preferred_term: single-cell T cell receptor sequencing
    - preferred_term: peptide-MHC tetramer binding assay
    readouts:
    - name: Dominant-clone antigen specificity
      target: pathophysiology#Adaptive Immune T Cell Response to Tau Pathology
      description: >-
        Fraction of dominant brain-infiltrating CD8 clones with demonstrable
        reactivity to tau-derived peptides versus viral/self antigens versus no
        detectable cognate antigen (virtual-memory phenotype).
      direction: POSITIVE
      interpretation: >-
        Dominant clones reactive to tau peptides would support a tau-antigen-driven
        response; predominance of viral-reactive or antigen-inexperienced
        virtual-memory clones would reframe the arm as cytotoxic-lymphocyte- rather
        than tau-antigen-driven.
  posed_date: "2026-07-11T00:00:00Z"
  notes: >-
    Seeded from an OpenScientist hypothesis deep-research run on
    adaptive_immune_tcell_model; all cited PMIDs independently verified against
    their abstracts before curation.
- discussion_id: gap_ad_tcell_ifng_pd1_valence_and_source
  prompt: >-
    Is IFN-gamma/PD-1 signaling net-neurotoxic or net-protective in Alzheimer
    disease, and how much of the IFN-gamma effect attributed to clonal CD8 T cells
    is actually contributed by NK cells?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Adaptive Immune T Cell Response to Tau Pathology
  - pathophysiology#Neuroinflammation
  rationale: >-
    The model predicts IFN-gamma/PD-1 blockade is neuroprotective, based on mouse
    tauopathy where inhibiting IFN-gamma or PD-1 ameliorates brain atrophy
    (PMID:36890231). But the therapeutic valence reverses by pathology: in an
    amyloid context, PD-1 checkpoint blockade drives an IFN-gamma-dependent myeloid
    response that clears Aβ and improves cognition (PMID:26779813), so a universal
    "block IFN-gamma/PD-1" prescription is not supported. Separately, IFN-gamma is
    not CD8-exclusive — NK cells produce IFN-gamma/TNF-alpha that negatively
    correlates with cognition in AD (PMID:11268360) — so some effects attributed to
    clonal CD8 may be innate-lymphoid in origin. Resolving the context-dependent
    valence and the true cellular source of pathogenic IFN-gamma is required before
    the node's therapeutic predictions can be curated as directional.
  proposed_experiments:
  - experiment_id: exp_ad_ifng_source_valence_matched_models
    name: Cell-type-resolved IFN-gamma modulation across tau vs amyloid models
    description: >-
      Apply matched IFN-gamma/PD-1 modulation and cell-type-specific conditional
      Ifng deletion (CD8-restricted vs NK-restricted vs total) across tau-only,
      amyloid-only, and mixed mouse models, reading neurodegeneration and cognition
      to separate the direction of the IFN-gamma effect from its cellular source.
    experiment_type:
      preferred_term: comparative conditional-knockout intervention study
    assays:
    - preferred_term: conditional gene knockout
    - preferred_term: neuropsychological assessment
    readouts:
    - name: IFN-gamma source-and-valence effect on neurodegeneration
      target: pathophysiology#Adaptive Immune T Cell Response to Tau Pathology
      description: >-
        Change in atrophy/neuronal loss when IFN-gamma is deleted from CD8 versus
        NK cells, and when IFN-gamma/PD-1 is blocked, in tau-only versus amyloid-only
        contexts.
      direction: NEGATIVE
      interpretation: >-
        Protection only with CD8-restricted IFN-gamma loss in the tau context (with
        harm or no benefit in amyloid) would confirm a tau-scoped, CD8-driven
        pathogenic axis; protection with NK-restricted loss would reassign part of
        the effect to innate lymphocytes.
  posed_date: "2026-07-11T00:00:00Z"
  notes: >-
    Seeded from an OpenScientist hypothesis deep-research run on
    adaptive_immune_tcell_model; all cited PMIDs independently verified against

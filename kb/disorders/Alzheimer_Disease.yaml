  - reference: PMID:27696483
    reference_title: "Incidence and impact of subclinical epileptiform activity in Alzheimer's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subclinical epileptiform activity was detected in 42.4% of AD patients and 10.5% of controls (p = 0.02)."
    explanation: >-
      Prospective blinded extended EEG and MEG monitoring quantifying the predicted

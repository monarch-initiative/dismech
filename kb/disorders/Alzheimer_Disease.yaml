name: Alzheimer Disease
creation_date: '2025-12-04T16:57:31Z'
description: >
  Alzheimer disease is a progressive neurodegenerative disorder characterized by
  cognitive decline, memory loss, and behavioral changes. It is the most common cause
  of dementia, involving the accumulation of amyloid-beta plaques and neurofibrillary
  tangles in the brain, leading to neuronal death and brain atrophy.
disease_term:
  preferred_term: Alzheimer disease
  term:
    id: MONDO:0004975
    label: Alzheimer disease
gene_sets:
- gene_set: MYGENESET:KEGG_ALZHEIMERS_DISEASE
  relationship: CANONICAL_PATHWAY
  note: >-
    KEGG Alzheimer disease pathway.
- gene_set: MYGENESET:WP_ALZHEIMERS_DISEASE
  relationship: CANONICAL_PATHWAY
  note: >-
    WikiPathways Alzheimer disease pathway.
category: Neurodegenerative Disorder
parents:
- Dementia
- Neurodegenerative Disease
has_subtypes:
- name: Early-Onset Alzheimer's Disease
  display_name: Early-Onset Alzheimer's Disease
  description: Type of Alzheimer's that occurs in individuals younger than 65 and is often associated with genetic factors.
  evidence:
  - reference: PMID:30707186
    reference_title: "Early-onset Alzheimer Disease and Its Variants."
    supports: SUPPORT
    snippet: Early-onset Alzheimer disease (AD) is defined as having an age of onset younger than 65 years. ... Early-onset AD comprises about 5% to 6% of cases of AD and includes a substantial percentage of phenotypic variants that differ from the usual amnestic presentation of typical AD. Characteristics of early-onset AD in comparison to late-onset AD include a larger genetic predisposition (familial mutations and summed polygenic risk)
    explanation: This reference clearly supports the definition of Early-Onset Alzheimer's Disease as occurring in individuals younger than 65 and being often associated with genetic factors.
  - reference: PMID:25998117
    reference_title: "Genetic testing and counseling in the diagnosis and management of young-onset dementias."
    supports: SUPPORT
    snippet: Young-onset dementia is hereditary, multifactorial, or sporadic. The most common hereditary dementias include Alzheimer disease.
    explanation: This reference supports the idea that early-onset Alzheimer's disease can be hereditary, aligning with the statement's mention of genetic factors.
- name: Late-Onset Alzheimer's Disease
  display_name: Late-Onset Alzheimer's Disease
  description: The most common form of Alzheimer's, occurring in those aged 65 and older.
  evidence:
  - reference: PMID:24429902
    reference_title: "Etiology and pathogenesis of late-onset Alzheimer's disease."
    supports: SUPPORT
    snippet: In both cases, the disease results in severe cognitive dysfunction, among other problems, and the late-onset form of the disease is now considered to be the most common cause of dementia among the elderly.
    explanation: The literature confirms that late-onset Alzheimer's Disease is the most common form of Alzheimer's and primarily affects those aged 65 and older.
  - reference: PMID:34120901
    reference_title: "Time to Diagnosis in Young Onset Alzheimer's Disease: A Population-Based Study from Central Norway."
    supports: SUPPORT
    snippet: 'BACKGROUND: Young onset dementia is associated with a longer time to diagnosis compared to late onset dementia.'
    explanation: The study differentiates between young onset and late onset Alzheimer's Disease, with late onset typically affecting older adults.
  - reference: PMID:18667359
    reference_title: "Alzheimer's disease and vascular dementia in developing countries: prevalence, management, and risk factors."
    supports: SUPPORT
    snippet: Alzheimer's disease accounts for 60% whereas vascular dementia accounts for approximately 30% of the prevalence. Early-onset familial forms of dementia with single-gene defects occur in Latin America, Asia, and Africa.
    explanation: Supports Alzheimer's disease as the leading cause of dementia (~60% of cases); early-onset familial single-gene forms are noted as a distinct minority category, consistent with late-onset being the predominant form.
prevalence:
- population: Global
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 480
  rate_low: 447
  rate_high: 521
  notes: >-
    An estimated 57.4 million people worldwide were living with dementia in 2019
    (GBD 2019; PMID:34998485), projected to reach 152.8 million by 2050. Alzheimer
    disease accounts for 60–70% of dementia cases. Applying 60–70% to the 2019
    global dementia prevalence of ~745 per 100,000 (57.4 M / 7.7 B population)
    yields an AD-specific point prevalence of approximately 447–521 per 100,000
    (midpoint ~480); this is a derived estimate, not directly quoted from a single source.
  evidence:
  - reference: PMID:34998485
    reference_title: "Estimation of the global prevalence of dementia in 2019 and forecasted prevalence in 2050: an analysis for the Global Burden of Disease Study 2019."
    supports: SUPPORT
    snippet: We estimated that the number of people with dementia would increase from 57.4 (95% uncertainty interval 50.4-65.1) million cases globally in 2019 to 152.8 (130.8-175.9) million cases in 2050.
    explanation: Global Burden of Disease Study 2019 analysis providing country-level estimates of dementia prevalence and forecasts to 2050.
  - reference: PMID:31072403
    reference_title: "Alzheimer's disease: risk factors and potentially protective measures."
    supports: SUPPORT
    snippet: Alzheimer's disease (AD) is the most common type of dementia and typically manifests through a progressive loss of episodic memory and cognitive function, subsequently causing language and visuospatial skills deficiencies
    explanation: Review confirming that AD is the most common type of dementia, consistent with estimates that 60-70% of dementia cases are attributable to AD.
mechanistic_hypotheses:
- hypothesis_group_id: amyloid_cascade_model
  hypothesis_label: Amyloid Cascade Model
  status: CANONICAL
  description: >-
    Amyloid-beta production, oligomerization, and plaque deposition are modeled
    as upstream drivers of tau pathology, synaptic toxicity, glial activation,
    and progressive cognitive decline, especially in APP/PSEN-associated
    familial Alzheimer disease.
  applies_to_subtypes:
  - Early-Onset Alzheimer's Disease
  - Late-Onset Alzheimer's Disease
  evidence:
  - reference: PMID:25941885
    reference_title: "Preventing the spread of Alzheimer's disease neuropathology: a role for calcilytics?"
    supports: SUPPORT
    snippet: "The 'amyloid cascade hypothesis' posits that an extracellular build-up of amyloid-beta oligomers (Abeta-os) and polymers (fibrils) subsequently inducing toxic hyperphosphorylated (p)-Tau oligomers (p-Tau-os) and neurofibrillary tangles starts the sporadic late-onset Alzheimer's disease (LOAD)..."
    explanation: Supports amyloid-beta accumulation as an upstream causal model that induces downstream tau pathology.
  - reference: PMID:22351073
    reference_title: "Synaptic dysfunction in Alzheimer's disease."
    supports: SUPPORT
    snippet: "Generation of amyloid peptide (Abeta) is at the beginning of a cascade that leads to Alzheimer's disease (AD)... soluble assembly states of Abeta peptides can cause cognitive problems by disrupting synaptic function..."
    explanation: Supports amyloid-beta generation as an initiating cascade event with synaptic consequences.
  notes: >-
    Retained as CANONICAL, but not sufficient as a complete disease explanation:
    tau burden, vascular injury, immune state, lysosomal clearance, aging, and
    genetic background modulate how amyloid pathology maps to symptoms.
- hypothesis_group_id: tau_neurodegeneration_model
  hypothesis_label: Tau Neurodegeneration Model
  status: CANONICAL
  description: >-
    Tau hyperphosphorylation and aggregation into neurofibrillary tangles are
    modeled as proximate drivers of neuronal dysfunction, microtubule disruption,
    neurodegeneration, and clinical progression.
  applies_to_subtypes:
  - Early-Onset Alzheimer's Disease
  - Late-Onset Alzheimer's Disease
  evidence:
  - reference: PMID:21509508
    reference_title: "Tau mediated neurodegeneration: an insight into Alzheimer's disease pathology."
    supports: SUPPORT
    snippet: "Extracellular accumulations of Abeta, hyperphosphorylation of tau and intracellular neurofibrillary tangle formation have been the hallmarks of Alzheimer's Disease (AD)."
    explanation: Supports tau hyperphosphorylation and tangle formation as central Alzheimer disease pathology.
  - reference: PMID:19542604
    reference_title: "The microtubule-associated protein tau is also phosphorylated on tyrosine."
    supports: SUPPORT
    snippet: "Tau protein is the principal component of the neurofibrillary tangles found in Alzheimer's disease (AD), where it is hyperphosphorylated on serine and threonine residues."
    explanation: Identifies hyperphosphorylated tau as the principal neurofibrillary tangle component in Alzheimer disease.
- hypothesis_group_id: synaptic_failure_convergence_model
  hypothesis_label: Synaptic Failure Convergence Model
  status: CANONICAL
  description: >-
    Amyloid-beta, tau, inflammatory, vascular, oxidative, and infectious
    stressors converge on synaptic plasticity, neurotransmitter release, and
    network function, producing cognitive decline.
  applies_to_subtypes:
  - Early-Onset Alzheimer's Disease
  - Late-Onset Alzheimer's Disease
  evidence:
  - reference: PMID:27662312
    reference_title: "Stress-Induced Synaptic Dysfunction and Neurotransmitter Release in Alzheimer's Disease: Can Neurotransmitters and Neuromodulators be Potential Therapeutic Targets?"
    supports: SUPPORT
    snippet: "Compelling evidence suggests that soluble amyloid-beta (Abeta) and hyperphosphorylated tau serve as toxins in the dysfunction of synaptic plasticity and aberrant neurotransmitter (NT) release at synapses consequently causing a cognitive decline in Alzheimer's disease (AD)."
    explanation: Directly supports synaptic dysfunction as a convergence point downstream of amyloid-beta and tau toxicity.
  - reference: PMID:12973746
    reference_title: "Glutamatergic systems in Alzheimer's disease."
    supports: SUPPORT
    snippet: "Histological studies indicate loss of pyramidal neurones and their synapses in Alzheimer's disease (AD), this together with biochemical evidence suggests presynaptic (and postsynaptic) glutamatergic hypoactivity."
    explanation: Supports loss of synapses and altered neurotransmission in Alzheimer disease.
- hypothesis_group_id: neuroimmune_glial_amplification_model
  hypothesis_label: Neuroimmune-Glial Amplification Model
  status: ALTERNATIVE
  description: >-
    Microglia, astrocytes, complement, and inflammasome pathways are modeled as
    stage-dependent disease-modifying mechanisms that can respond to amyloid-beta
    and tau pathology, reinforce amyloid aggregation and inflammatory injury, or
    restrain amyloid-associated tau spread through protective phagocytic and
    plaque-barrier functions.
  applies_to_subtypes:
  - Early-Onset Alzheimer's Disease
  - Late-Onset Alzheimer's Disease
  evidence:
  - reference: PMID:28019679
    reference_title: "Inflammasome activation and innate immunity in Alzheimer's disease."
    supports: SUPPORT
    snippet: "NOD-like receptor (NLR) family, pyrin domain containing 3 and 1 inflammasomes, present in myeloid cells and neurons, respectively, represent key components of the innate immune reaction observed in Alzheimer patient brains."
    explanation: Supports inflammasome-mediated innate immune activation in Alzheimer disease brains.
  - reference: PMID:23930978
    reference_title: "Microglia, neuroinflammation, and beta-amyloid protein in Alzheimer's disease."
    supports: SUPPORT
    snippet: "A vicious cycle of inflammation has been formed between Abeta accumulation, activated microglia, and microglial inflammatory mediators, which enhance Abeta deposition and neuroinflammation."
    explanation: Supports a self-reinforcing loop between amyloid-beta deposition and microglial inflammation.
  - reference: PMID:36361780
    reference_title: "Microglia and Alzheimer's Disease."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Microglia work to reestablish efficiency and stop further degeneration in the early stages of AD but mainly fail in the illness's later phases."
    explanation: >-
      Review-level support for treating microglial activation as stage-dependent
      rather than uniformly protective or uniformly damaging.
  - reference: PMID:34100905
    reference_title: "Activated microglia mitigate Aβ-associated tau seeding and spreading."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "We show that both TREM2KO and microglial ablation dramatically enhance tau seeding and spreading around plaques."
    explanation: >-
      Qualifies the amplification model by showing that TREM2-dependent activated
      microglia can restrain amyloid-associated tau propagation in mouse models.
  notes: >-
    Retained as ALTERNATIVE despite strong GWAS support because microglial and
    astrocyte programs appear context-dependent: the same innate immune pathways
    can mediate protective amyloid/tau clearance or pathogenic complement,
    inflammasome, and synapse-loss amplification depending on disease stage,
    cell state, and genetic background.
- hypothesis_group_id: vascular_bbb_clearance_model
  hypothesis_label: Vascular and Blood-Brain Barrier Clearance Model
  status: ALTERNATIVE
  description: >-
    Cerebral blood flow changes, neurovascular-unit injury, blood-brain barrier
    dysfunction, and impaired amyloid-beta clearance are modeled as causal or
    reinforcing contributors to Alzheimer disease progression.
  applies_to_subtypes:
  - Late-Onset Alzheimer's Disease
  evidence:
  - reference: PMID:28902142
    reference_title: "Blood-Brain Barrier Dysfunction and the Pathogenesis of Alzheimer's Disease."
    supports: SUPPORT
    snippet: "Thus, current evidence suggests that BBB dysfunction may causatively and consequently contribute to AD pathogenesis, forming a vicious cycle between brain Abeta accumulation and neurovascular unit impairments during disease progression."
    explanation: Supports a bidirectional causal cycle between blood-brain barrier dysfunction, amyloid-beta accumulation, and neurovascular injury.
  - reference: PMID:26898552
    reference_title: "The Utility of Cerebral Blood Flow as a Biomarker of Preclinical Alzheimer's Disease."
    supports: SUPPORT
    snippet: "There is accumulating evidence suggesting that changes in brain perfusion are present long before the clinical symptoms of Alzheimer's disease (AD), perhaps even before amyloid-beta accumulation or brain atrophy."
    explanation: Supports early cerebral perfusion changes as part of the vascular model.
- hypothesis_group_id: glymphatic_clearance_model
  hypothesis_label: Glymphatic Clearance Model
  status: EMERGING
  description: >-
    Failure of the sleep-dependent perivascular (glymphatic) clearance route is
    modeled as an upstream contributor to amyloid-beta accumulation, acting
    through reduced CSF-interstitial fluid exchange rather than through
    transcytotic blood-brain-barrier efflux (vascular_bbb_clearance_model) or
    intracellular degradation (autophagy_lysosomal_clearance_model). Held as
    EMERGING because the human evidence is dominated by imaging surrogates and
    small intrathecal-tracer cohorts, and because the microscopic transport mode
    underpinning the mechanism is itself contested; see the
    glymphatic_dysfunction module for the curated controversy.
  applies_to_subtypes:
  - Late-Onset Alzheimer's Disease
  evidence:
  - reference: PMID:27893874
    reference_title: "Association of Perivascular Localization of Aquaporin-4 With Cognition and Alzheimer Disease in Aging Brains."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      When controlling for age, loss of perivascular AQP4 localization was
      associated with increased amyloid-β burden
    explanation: >-
      Human postmortem dose-response between loss of the glymphatic conduit
      protein and amyloid burden, the core claim of this hypothesis group.
  - reference: PMID:33004510
    reference_title: "Glymphatic failure as a final common pathway to dementia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The glymphatic system, which clears the brain of protein waste products,
      is mostly active during sleep.
    explanation: >-
      Establishes the sleep-gated clearance premise that distinguishes this
      hypothesis group from the other clearance models in this entry.
  notes: >-
    Deliberately kept separate from vascular_bbb_clearance_model. The two
    describe different anatomical routes for amyloid-beta egress (perivascular
    CSF-ISF exchange versus receptor-mediated transcytosis across the
    blood-brain barrier) and should not be merged even though both are
    "clearance" models.
- hypothesis_group_id: autophagy_lysosomal_clearance_model
  hypothesis_label: Autophagy-Lysosomal Clearance Model
  status: EMERGING
  description: >-
    Defective autophagic flux, lysosomal transport, mitophagy, and aggregate
    clearance are modeled as mechanisms that promote amyloid-beta accumulation,
    tau accumulation, mitochondrial stress, and downstream cognitive impairment.
  applies_to_subtypes:
  - Early-Onset Alzheimer's Disease
  - Late-Onset Alzheimer's Disease
  evidence:
  - reference: PMID:20541250
    reference_title: "Lysosomal proteolysis and autophagy require presenilin 1 and are disrupted by Alzheimer-related PS1 mutations."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In PS1 null blastocysts, neurons from mice hypomorphic for PS1 or conditionally depleted of PS1, substrate proteolysis and autophagosome clearance during macroautophagy are prevented as a result of a selective impairment of autolysosome acidification and cathepsin activation. These deficits are caused by failed PS1-dependent targeting of the v-ATPase V0a1 subunit to lysosomes."
    explanation: >-
      Demonstrates that PS1 is required for v-ATPase V0a1 targeting to
      lysosomes; PSEN1 dysfunction therefore directly impairs lysosomal
      acidification and autophagosome clearance, anchoring the early-onset
      Alzheimer disease mechanism for this hypothesis group.
  - reference: PMID:30742114
    reference_title: "Mitophagy inhibits amyloid-β and tau pathology and reverses cognitive deficits in models of Alzheimer's disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mitophagy diminishes insoluble Aβ1-42 and Aβ1-40 and prevents cognitive impairment in an APP/PS1 mouse model through microglial phagocytosis of extracellular Aβ plaques and suppression of neuroinflammation."
    explanation: >-
      Supports mitophagy as a mitochondrial quality-control mechanism that can
      alter amyloid burden, neuroinflammation, and cognitive impairment in an
      Alzheimer disease mouse model.
  notes: >-
    Retained as EMERGING because PSEN1-linked lysosomal acidification evidence
    provides a strong mechanistic anchor and mitophagy perturbation links
    mitochondrial quality control to amyloid, tau, inflammatory, and cognitive
    readouts. The broader contribution of autophagy-lysosomal and mitochondrial
    clearance defects to late-onset Alzheimer disease remains incompletely
    resolved in human longitudinal data.
- hypothesis_group_id: hsv1_reactivation_model
  hypothesis_label: HSV-1 Reactivation Model
  status: EMERGING
  description: >-
    Latent HSV-1 reactivation in selectively vulnerable RORB+ glutamatergic
    neurons is modeled as a possible upstream contributor to neuronal
    vulnerability and later synaptic-network failure.
  applies_to_subtypes:
  - Late-Onset Alzheimer's Disease
  evidence:
  - reference: PMID:42094473
    reference_title: "Resolving human neuronal herpesvirus reactivation via petabase-scale association studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Integrative single-nucleus analyses resolve direct evidence of HSV-1 expression in RORB+ glutamatergic neurons, implicating viral reactivation in a neuronal population progressively lost during dementia."
    explanation: Supports HSV-1 reactivation in a selectively vulnerable Alzheimer-relevant neuronal population.
  - reference: PMID:42094473
    reference_title: "Resolving human neuronal herpesvirus reactivation via petabase-scale association studies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "identifying recurrent herpes simplex virus 1 (HSV-1) reactivation in healthy but not pathological post-mortem human brain tissue"
    explanation: Supports the temporal interpretation that HSV-1 reactivation may precede loss of vulnerable neurons rather than simply appear in end-stage pathological tissue.
  notes: >-
    Retained as EMERGING. The evidence is human, cell-type-resolved, and
    hypothesis-generating, but causality between HSV-1 expression and Alzheimer
    disease progression remains unresolved.
- hypothesis_group_id: ev_mediated_tau_propagation_model
  hypothesis_label: Arc-Dependent EV-Mediated Tau Propagation Model
  status: EMERGING
  description: >-
    Cell-to-cell (prion-like) spread of tau pathology is modeled as being driven,
    in part, by packaging of pathological tau into neuronal extracellular vesicles
    (EVs). The activity-regulated, capsid-forming neuronal protein Arc binds tau
    directly and is required for efficient release of tau in EVs; Arc-tau
    co-packaging seeds tau aggregation in recipient neurons, propagating tangle
    pathology along connected circuits. In this model EV-tau release is partly
    protective for the donor neuron (eliminating toxic intracellular tau) but
    drives intercellular transmission of seed-competent tau.
  applies_to_subtypes:
  - Early-Onset Alzheimer's Disease
  - Late-Onset Alzheimer's Disease
  evidence:
  - reference: PMID:42372723
    reference_title: "Arc mediates intercellular tau transmission via extracellular vesicles."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Strikingly, intercellular tau transmission is almost absent in Arc KO mice."
    explanation: >-
      Loss of Arc nearly abolishes neuron-to-neuron tau transmission in mice,
      supporting Arc-dependent EV packaging as a mechanism of prion-like tau
      spread.
  - reference: PMID:42372723
    reference_title: "Arc mediates intercellular tau transmission via extracellular vesicles."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, Arc levels in brain-derived EVs isolated from human Alzheimer's disease (AD) brains show a strong positive correlation with phosphorylated EV-tau levels."
    explanation: >-
      Human AD brain-derived EVs link Arc levels to phosphorylated EV-tau,
      extending the EV-mediated propagation model to human disease.
  - reference: PMID:29328916
    reference_title: "The Neuronal Gene Arc Encodes a Repurposed Retrotransposon Gag Protein that Mediates Intercellular RNA Transfer."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Endogenous Arc protein is released from neurons in extracellular vesicles that mediate the transfer of Arc mRNA into new target cells"
    explanation: >-
      Arc self-assembles into virus-like capsids and is released from neurons in
      EVs that transfer cargo to recipient cells, establishing the biological
      plausibility for Arc packaging tau into EVs.
  - reference: PMID:27030011
    reference_title: "Extracellular Vesicles Isolated from the Brains of rTg4510 Mice Seed Tau Protein Aggregation in a Threshold-dependent Manner."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "extracellular vesicles derived from transgenic mice were capable of seeding tau aggregation in a threshold-dependent manner"
    explanation: >-
      Brain-derived EVs from tau-transgenic mice seed aggregation of monomeric
      tau in recipient cells, supporting EVs as vehicles for seed-competent tau.
  - reference: PMID:33417012
    reference_title: "Exosomes induce endolysosomal permeabilization as a gateway by which exosomal tau seeds escape into the cytosol."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "tau aggregation was only induced in cells that exhibited permeabilization"
    explanation: >-
      Endolysosomal permeabilization is the gating step by which internalized
      exosomal tau seeds escape into the cytosol to template aggregation,
      supplying the downstream seeding mechanism the model requires.
  - reference: PMID:29495441
    reference_title: "Detection of Aggregation-Competent Tau in Neuron-Derived Extracellular Vesicles."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: "In each case, most tau was free-floating with a small component inside EVs."
    explanation: >-
      Across iPSC-neuron media, CSF, and plasma most extracellular tau is
      free-floating rather than EV-encapsulated, qualifying the quantitative in
      vivo contribution of the EV-tau route.
  - reference: PMID:19556514
    reference_title: "Independent effects of intra- and extracellular Abeta on learning-related gene expression."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "reductions in both the number of Arc-activated neurons and the levels of Arc mRNA were seen in the neocortices of depositing mice from all transgenic lines (deficits ranging from 14 to 26%)"
    explanation: >-
      Amyloid-beta deposition suppresses activity-induced Arc expression, so the
      Arc-dependent EV-tau mechanism may be attenuated precisely in plaque-rich
      regions (the "Abeta-Arc paradox").
  notes: >-
    EMERGING. Demonstrated in primary neurons, rTg4510 tau-transgenic / Arc-KO
    mice, and human postmortem brain EVs (Tyagi et al., Cell 2026). EV-tau is one
    of several proposed routes of tau spread (free/naked tau uptake via LRP1,
    tunneling nanotubes, trans-synaptic transfer); the relative in vivo
    contribution of each, and how Arc levels modulate EV-tau release as disease
    progresses, remain to be resolved. By 8 months in the transgenic model, tau
    pathology was similar between Arc-KO and control, so Arc loss does not overtly
    accelerate late-stage pathology despite blocking transmission.
    OpenScientist deep research (July 2026;
    kb/hypotheses/Alzheimer_Disease/ev_mediated_tau_propagation_model) judged the
    model PARTIALLY SUPPORTED (EMERGING), with the following qualifications:
    (1) the Arc-tau binding and Arc-KO transmission phenotype rest on a single
    source (Tyagi et al., 2026) with no independent replication; (2) most
    extracellular tau is free-floating rather than EV-encapsulated (PMID:29495441),
    so the quantitative in vivo weight of the EV route versus LRP1/HSPG free-tau
    uptake and tunneling nanotubes is unresolved; (3) Abeta deposition suppresses
    Arc expression by 14-58% (PMID:19556514), potentially attenuating the mechanism
    in plaque-rich regions; and (4) the model was tested with P301L (4R) tau, not
    authentic AD-type 3R/4R paired helical filaments, and ARC carries no GWAS/GenCC
    association with AD. Supporting biology (Arc capsid EV transfer, PMID:29328916;
    EV-tau seeding, PMID:27030011; endolysosomal-escape gating, PMID:33417012) is
    independently established.
- hypothesis_group_id: apoe_risk_modulation_model
  hypothesis_label: APOE Risk-Modulation Model
  status: ALTERNATIVE
  description: >-
    Apolipoprotein E (APOE) genotype is modeled as the strongest common-variant
    modifier of late-onset Alzheimer disease risk, acting upstream of and across
    multiple pathologies rather than through a single pathway. In proportion to
    APOE4 gene dose, APOE4 accelerates amyloid-beta seeding/aggregation and
    impairs its clearance, exacerbates tau-mediated neurodegeneration and
    neuroinflammation, promotes glial lipid/cholesterol accumulation, and impairs
    blood-brain-barrier integrity, whereas APOE2 and the rare protective variants
    APOE3 Christchurch (R136S) and APOE3 Jacksonville (V236E) blunt these effects.
    The model predicts that lowering or structurally modifying APOE — especially
    APOE4 — should ameliorate several AD pathologies simultaneously, motivating
    APOE-directed therapeutics (ASO knockdown, AAV-APOE2, anti-aggregation small
    molecules).
  applies_to_subtypes:
  - Late-Onset Alzheimer's Disease
  evidence:
  - reference: PMID:28959956
    reference_title: "ApoE4 markedly exacerbates tau-mediated neurodegeneration in a mouse model of tauopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "P301S/E4 mice develop markedly more brain atrophy and neuroinflammation than P301S/E2 and P301S/E3 mice, whereas P301S/EKO mice are largely protected from these changes."
    explanation: >-
      Isoform-dependent modulation of tau-driven neurodegeneration and
      neuroinflammation (E4 > E3/E2, and near-protection when APOE is absent)
      anchors APOE as a cross-pathology risk modifier acting beyond amyloid.
  - reference: PMID:31686034
    reference_title: "Resistance to autosomal dominant Alzheimer's disease in an APOE3 Christchurch homozygote: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The individual had two copies of the APOE3 Christchurch (R136S) mutation, unusually high brain amyloid levels and limited tau and neurodegenerative measurements."
    explanation: >-
      A homozygous APOE3 Christchurch carrier resisted autosomal-dominant AD for
      roughly three decades despite heavy amyloid, dissociating amyloid burden
      from tau and neurodegeneration and implicating APOE receptor-binding avidity
      as a protective lever.
  notes: >-
    ALTERNATIVE. APOE modulation overlaps and interacts with the amyloid, tau,
    neuroimmune, vascular/BBB, and lipid models rather than competing with them;
    it is curated as a distinct hypothesis because the protective-variant
    (Christchurch/Jacksonville) and APOE-lowering evidence points to APOE itself
    as an actionable node upstream of multiple pathologies. Sex- and
    ancestry-dependent APOE risk and the precise molecular mechanism (aggregation,
    receptor binding, lipidation) remain incompletely resolved.
- hypothesis_group_id: adaptive_immune_tcell_model
  hypothesis_label: Adaptive Immune (T Cell) Neurodegeneration Model
  status: EMERGING
  description: >-
    Beyond innate microglial responses, a clonally expanded, predominantly
    cytotoxic (CD8+) T cell response is modeled as an active driver of
    tau-associated neurodegeneration. In tauopathy — but not pure amyloidosis —
    microglia are required to recruit T cells to sites of tau pathology;
    infiltrating T cells transition from activated to exhausted states with
    restricted TCR clonality, and IFN-gamma/PD-1 signaling amplifies neuronal
    loss. In the tau context the model predicts that depleting T cells or blocking
    IFN-gamma/PD-1 signaling should be neuroprotective. Critically, this
    therapeutic valence is tau-scoped, not universal: in a pure-amyloid context
    PD-1 checkpoint blockade instead drives an IFN-gamma-dependent myeloid
    response that clears Aβ and improves cognition, so "block IFN-gamma/PD-1" is
    not a general prescription. The model frames the cytotoxic-CD8 arm as a
    shared, targetable axis across tau-driven neurodegenerative disease.
  applies_to_subtypes:
  - Early-Onset Alzheimer's Disease
  - Late-Onset Alzheimer's Disease
  evidence:
  - reference: PMID:36890231
    reference_title: "Microglia-mediated T cell infiltration drives neurodegeneration in tauopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We found that mice with tauopathy but not those with amyloid deposition developed a unique innate and adaptive immune response and that depletion of microglia or T cells blocked tau-mediated neurodegeneration."
    explanation: >-
      Depletion of either microglia or T cells blocks tau-mediated
      neurodegeneration in a tauopathy model, establishing the adaptive T cell
      arm as functionally required rather than a bystander.
  - reference: PMID:36890231
    reference_title: "Microglia-mediated T cell infiltration drives neurodegeneration in tauopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Inhibition of interferon-γ and PDCD1 signalling both significantly ameliorated brain atrophy."
    explanation: >-
      IFN-gamma and PD-1 (PDCD1) blockade reduce brain atrophy, nominating
      specific, druggable nodes within the adaptive-immune neurodegeneration axis.
  - reference: PMID:41890046
    reference_title: "CD8+ T cells are primed by cDC1 and exacerbate tau-mediated neurodegeneration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We demonstrate that tauopathy mice deficient in cDC1 are markedly protected against tau-mediated neurodegeneration and display a selective decrease in brain CD8+ T cell infiltration and glial reactivity."
    explanation: >-
      Independent Holtzman-group follow-up: ablating conventional type-1 dendritic
      cells (cDC1) — the cross-presenting antigen-presenting cell — protects
      tauopathy mice and reduces brain CD8+ T cell infiltration, resolving the
      antigen-presenting route that primes the pathogenic CD8 response.
  - reference: PMID:26779813
    reference_title: "PD-1 immune checkpoint blockade reduces pathology and improves memory in mouse models of Alzheimer's disease."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "When induced in mice with established pathology, this immunological response leads to clearance of cerebral amyloid-β (Aβ) plaques and improved cognitive performance."
    explanation: >-
      Qualifies the model's therapeutic prediction: in an amyloid context PD-1
      blockade is beneficial (IFN-gamma-dependent Aβ clearance), the opposite of
      the tau-context prediction — so the IFN-gamma/PD-1 valence is tau-scoped,
      not universal.
  notes: >-
    EMERGING. The core functional evidence (T cell depletion, IFN-gamma/PD-1
    inhibition, cDC1 ablation) is from mouse tauopathy models, with correlative
    human support (increased cytotoxic T cells in AD brain/CSF tracking tau, not
    amyloid). The antigen-presenting route is now resolved to cDC1
    cross-presentation (PMID:41890046), but the recognized antigen(s) remain
    unidentified — and two findings temper the "antigen-driven clonal CD8" reading:
    aging expands antigen-independent virtual-memory CD8 T cells that are clonal
    and cytotoxic without priming (PMID:42432776), and the clonally expanded CD8
    TCRs recovered from human AD CSF were specific to Epstein-Barr virus antigens,
    not tau (PMID:31915375). IFN-gamma is also not CD8-exclusive (NK cells are a
    parallel source tracking cognitive decline, PMID:11268360), and whether B cells
    contribute remains open. See the antigen-identity and IFN-gamma-valence
    knowledge-gap discussions. Complements — does not replace — the innate
    neuroimmune_glial_amplification_model.
- hypothesis_group_id: anticholinergic_muscarinic_burden_model
  hypothesis_label: Anticholinergic Muscarinic Burden Model
  status: EMERGING
  description: >-
    Sustained pharmacologic blockade of central muscarinic acetylcholine
    receptors — the property shared by first-generation antihistamines
    (diphenhydramine), tricyclic antidepressants, bladder antimuscarinics, and
    antiparkinson anticholinergics — is modeled as removing M1-dependent tonic
    restraint on amyloidogenic APP processing and on GSK3-beta-mediated tau
    phosphorylation. Under this model, cumulative anticholinergic exposure is a
    modifiable disease-risk factor rather than only a cause of the reversible
    cognitive impairment classically attributed to these drugs.
  evidence:
  - reference: PMID:16504943
    reference_title: M1 receptors play a central role in modulating AD-like pathology in transgenic mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We further demonstrate that administration of dicyclomine, an M1 antagonist, exacerbates the Abeta and tau pathologies."
    explanation: >-
      Pharmacologic M1 antagonism — not merely genetic loss — worsens both
      amyloid and tau pathology, which is the mechanistic premise the model
      extrapolates from to chronic human anticholinergic exposure.
  - reference: PMID:25621434
    reference_title: "Cumulative use of strong anticholinergics and incident dementia: a prospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 10-year cumulative dose-response relationship was observed for dementia and Alzheimer disease"
    explanation: >-
      The cumulative dose-response in a prospective cohort is the human
      observation the model is built to explain.
  - reference: PMID:38063254
    reference_title: Anticholinergic deprescribing interventions for reducing risk of cognitive decline or dementia in older adults with and without prior cognitive impairment.
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: "The evidence from RCTs was of very low certainty so cannot support or refute the hypothesis that actively reducing or stopping prescription of medications with anticholinergic properties can improve cognitive outcomes in older people."
    explanation: >-
      The interventional test of the model is uninformative in both directions,
      which is why this hypothesis group is curated EMERGING rather than
      ALTERNATIVE or CANONICAL.
  notes: >-
    EMERGING, and deliberately not promoted further. The mechanistic arm is
    MODEL_ORGANISM only (M1 knockout and dicyclomine in 3xTg-AD/Tg-SwDI mice);
    the human arm is entirely observational and has two unresolved threats.
    (1) Reverse causation: prodromal dementia produces insomnia, depression,
    and urinary urgency, which are the indications for these drugs. (2) Class
    specificity: the largest UK studies concentrate the signal in
    antidepressant, urological, and antiparkinson anticholinergics, with
    antipsychotics and antiepileptics significant in QResearch
    (PMID:31233095) but antipsychotics null in CPRD (PMID:29695481), and the
    largest antihistamine-specific cohort finds a dose-response for
    second-generation agents that barely enter the CNS as well as for
    first-generation ones (PMID:38935035). Read that last result carefully in
    both directions: the gradient is steeper for the CNS-penetrant class
    (first-generation 1.13/1.29/1.51 across rising cumulative dose versus
    second-generation 1.11/1.19/1.26, the authors concluding that
    first-generation agents carry the higher risk), which is what a central
    mechanism predicts, while the residual non-null second-generation signal
    is left unexplained by that mechanism and is the open puzzle. Do NOT read the
    antihistamine nulls as a clean negative: the CPRD analysis records only
    prescriptions, and its authors note that over-the-counter supply is
    invisible in their data and that antihistamine use is therefore
    underestimated, which matters most for exactly the drug that prompted this
    curation. See the two attached discussions before strengthening any claim
    here.
- hypothesis_group_id: complement_synaptic_pruning_model
  hypothesis_label: Complement-Dependent Microglial Synapse Elimination Model
  status: ALTERNATIVE
  description: >-
    Synapse loss — the pathological change that correlates best with cognitive
    decline — is modeled as an active, receptor-mediated phagocytic process
    rather than as passive degeneration secondary to amyloid or tau toxicity.
    The classical complement cascade that prunes surplus synapses during
    development (C1q tagging, C3 opsonization, microglial CR3 engagement) is
    modeled as being reactivated early in disease, so that microglia engulf
    structurally intact synapses. Soluble amyloid-beta oligomers and
    phosphorylated tau both act as upstream triggers, which makes this the
    mechanism by which two otherwise separate proteinopathies converge on the
    same cellular endpoint.
  applies_to_subtypes:
  - Early-Onset Alzheimer's Disease
  - Late-Onset Alzheimer's Disease
  evidence:
  - reference: PMID:27033548
    reference_title: "Complement and microglia mediate early synapse loss in Alzheimer mouse models."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "C1q, the initiating protein of the classical complement cascade, is increased and associated with synapses before overt plaque deposition."
    explanation: >-
      Places complement tagging of synapses upstream of plaque deposition, which
      is what distinguishes this model from synapse loss as a late consequence of
      established amyloid pathology.
  - reference: PMID:27033548
    reference_title: "Complement and microglia mediate early synapse loss in Alzheimer mouse models."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Inhibition of C1q, C3, or the microglial complement receptor CR3 reduces the number of phagocytic microglia, as well as the extent of early synapse loss."
    explanation: >-
      Blocking three separate steps of the same cascade each reduces synapse
      loss, establishing the pathway as required rather than merely present.
  - reference: PMID:30392797
    reference_title: "Changes in the Synaptic Proteome in Tauopathy and Rescue of Tau-Induced Synapse Loss by C1q Antibodies."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "At synapses, C1q decorated perisynaptic membranes, accumulated in correlation with phospho-Tau, and was associated with augmented microglial engulfment of synapses and decline of synapse density."
    explanation: >-
      Independent laboratory, and a tau rather than amyloid driver, reaching the
      same C1q-microglia-synapse axis — the strongest evidence that the model is
      not specific to amyloid models.
  - reference: PMID:28566429
    reference_title: "Complement C3 deficiency protects against neurodegeneration in aged plaque-rich APP/PS1 mice."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "We found that 16-month-old APP/PS1;C3 KO mice performed better on a learning and memory task than did APP/PS1 mice, despite having more cerebral Aβ plaques."
    explanation: >-
      Qualifies the model in an important direction: removing complement protects
      synapses and cognition while *increasing* plaque burden, so complement is
      simultaneously protective for amyloid clearance and harmful for synapses.
      The model must not be read as "complement is uniformly pathogenic".
  - reference: PMID:37652017
    reference_title: "Human astrocytes and microglia show augmented ingestion of synapses in Alzheimer's disease via MFG-E8."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we observe astrocytes and microglia from human brains contain greater amounts of synaptic protein in AD compared with non-disease controls, and that proximity to amyloid-β plaques and the APOE4 risk gene exacerbate this effect."
    explanation: >-
      Confirms in human tissue that glia ingest synapses in Alzheimer disease, but
      nominates MFG-E8 rather than complement as the opsonin and puts astrocytes
      alongside microglia — so it corroborates the phenomenon while leaving the
      molecular pathway open in humans.
  notes: >-
    ALTERNATIVE rather than CANONICAL. The necessity evidence (C1q, C3 and CR3
    blockade) is entirely mouse; the same paper that supplies the best human
    evidence for glial synapse ingestion states that direct human evidence for
    glial involvement in synapse removal remained to be established, and
    implicates MFG-E8 rather than complement. Curated as a distinct hypothesis
    group rather than folded into neuroimmune_glial_amplification_model because
    it makes a specific, falsifiable claim about a named cascade acting on a
    named substrate (the synapse), and because its therapeutic prediction —
    anti-C1q antibody — is being tested clinically. See the attached
    HUMAN_MODEL_MISMATCH discussion before strengthening the human claim.
- hypothesis_group_id: endolysosomal_origin_model
  hypothesis_label: Endolysosomal Origin ("Inside-Out" Amyloid) Model
  status: EMERGING
  description: >-
    Amyloid pathology is modeled as beginning inside the neuron rather than in
    the extracellular space. Endocytic-pathway activation with enlargement of
    Rab5-positive early endosomes is the earliest recognized neuronal change in
    sporadic Alzheimer disease, preceding plaque deposition; APP-beta-C-terminal
    fragment accumulation then inhibits the lysosomal v-ATPase, autolysosomes
    fail to acidify, and amyloid-beta builds up within de-acidified autolysosomes
    until the neuron ruptures and its contents become the plaque core (the
    PANTHOS pattern). Under this model the senile plaque is the tombstone of a
    dead neuron, not a deposit of secreted peptide, which inverts the direction
    of the classical extracellular cascade.
  applies_to_subtypes:
  - Early-Onset Alzheimer's Disease
  - Late-Onset Alzheimer's Disease
  evidence:
  - reference: PMID:10880397
    reference_title: "Endocytic pathway abnormalities precede amyloid beta deposition in sporadic Alzheimer's disease and Down syndrome: differential effects of APOE genotype and presenilin mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These abnormalities were evident in pyramidal neurons of the neocortex at preclinical stages of disease when Alzheimer-like neuropathology, such as Abeta deposition, was restricted to the entorhinal region."
    explanation: >-
      Human postmortem evidence that neuronal endosomal abnormality is present at
      preclinical stages, before neocortical amyloid deposition — the temporal
      ordering the model requires.
  - reference: PMID:10880397
    reference_title: "Endocytic pathway abnormalities precede amyloid beta deposition in sporadic Alzheimer's disease and Down syndrome: differential effects of APOE genotype and presenilin mutations."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "By contrast, endosomes were normal in size at advanced stages of familial AD caused by mutations of presenilin 1 or 2, indicating that altered endocytosis is not a consequence of Abeta deposition."
    explanation: >-
      The paper's own internal control cuts both ways: it shows the endosomal
      phenotype is not merely downstream of amyloid, but also that it is absent in
      presenilin-mutation familial disease, so the mechanism is not universal
      across Alzheimer genetic subtypes.
  - reference: PMID:15465622
    reference_title: "Abeta localization in abnormal endosomes: association with earliest Abeta elevations in AD and Down syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Double-immunofluorescence using numerous Abeta antibodies showed that intracellular Abeta localized principally to rab5-positive endosomes in neurons from AD brains and was prominent in enlarged endosomes."
    explanation: >-
      Locates amyloid-beta inside the enlarged endosomal compartment in human
      Alzheimer brain, connecting the endosomal lesion to the peptide itself.
  - reference: PMID:35654956
    reference_title: "Faulty autolysosome acidification in Alzheimer's disease mouse models induces autophagic build-up of Aβ in neurons, yielding senile plaques."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Quantitative analyses confirm that individual neurons exhibiting PANTHOS are the principal source of senile plaques in amyloid precursor protein AD models."
    explanation: >-
      The load-bearing claim of the model — that the plaque originates from a
      single dying neuron — stated for amyloid precursor protein transgenic mouse
      models. The corresponding human claim in the same work is presence of the
      pattern, not that it is the source of human plaques.
  - reference: PMID:37494443
    reference_title: "Lysosomal dysfunction in Down syndrome and Alzheimer mouse models is caused by v-ATPase inhibition by Tyr(682)-phosphorylated APP βCTF."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Lowering APP-βCTF Tyr682 phosphorylation restores v-ATPase and lysosome function in DS fibroblasts and in vivo in brains of DS model mice."
    explanation: >-
      Supplies the molecular mechanism and its genetic rescue: APP-βCTF
      competitively inhibits the v-ATPase V0a1 subunit, so the acidification
      failure is caused by an APP fragment upstream of amyloid-beta itself.
  notes: >-
    EMERGING, and deliberately curated as a competitor to — not a restatement of
    — autophagy_lysosomal_clearance_model. That model says defective clearance
    lets amyloid accumulate; this one says the plaque is *generated* inside the
    autolysosomal compartment of a neuron that then dies. The distinction is
    testable and matters therapeutically: it predicts that lowering APP-βCTF or
    restoring v-ATPase activity acts upstream of anything an anti-amyloid antibody
    can reach. Held EMERGING because the human evidence is strong for the
    endosomal lesion (Cataldo, human postmortem) but thin for PANTHOS itself,
    where the only verified human statement is that the pattern is present in
    Alzheimer brains. The v-ATPase mechanism and the PANTHOS phenotype come from
    the same laboratory, so they are not independent replications of each other.
- hypothesis_group_id: selective_neuronal_vulnerability_model
  hypothesis_label: Selective Neuronal Vulnerability Model
  status: EMERGING
  description: >-
    Alzheimer disease is modeled as a disease of specific, molecularly definable
    neuronal populations rather than of the cortex as a whole: locus coeruleus
    noradrenergic neurons and entorhinal cortex layer II excitatory neurons
    degenerate first and disproportionately, and within the entorhinal cortex the
    vulnerable excitatory population is marked by RORB. Under this model the
    question "why these cells?" is a mechanistic question in its own right —
    cell-intrinsic properties determine where tau pathology and neuronal loss
    begin, so aggregate burden alone cannot explain the anatomy of the disease.
  applies_to_subtypes:
  - Late-Onset Alzheimer's Disease
  evidence:
  - reference: PMID:33432193
    reference_title: "Molecular characterization of selectively vulnerable neurons in Alzheimer's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified RORB as a marker of selectively vulnerable excitatory neurons in the entorhinal cortex and subsequently validated their depletion and selective susceptibility to neurofibrillary inclusions during disease progression using quantitative neuropathological methods."
    explanation: >-
      Single-nucleus transcriptomics of human postmortem brain identifies the
      vulnerable population molecularly and confirms its depletion by independent
      quantitative neuropathology.
  - reference: PMID:8699259
    reference_title: "Profound loss of layer II entorhinal cortex neurons occurs in very mild Alzheimer's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Decreases in individual lamina were even more dramatic, with the number of neurons in layer II decreasing by 60% and in layer IV by 40% compared with controls."
    explanation: >-
      Stereological neuron counts showing that laminar loss is already severe at
      the mildest clinically detectable stage, establishing selectivity as an
      early rather than end-stage feature.
  - reference: PMID:27513978
    reference_title: "Locus coeruleus volume and cell population changes during Alzheimer's disease progression: A stereological study in human postmortem brains with potential implication for early-stage biomarker discovery."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The long gap between NFT accumulation and neuronal loss suggests that a second trigger may be necessary to induce neuronal death in AD."
    explanation: >-
      Qualifies any simple "tangles kill the vulnerable cell" reading: in the
      locus coeruleus, tangle accumulation and neuronal loss are separated by a
      long interval, so vulnerability to tau inclusion and vulnerability to death
      are not the same property. Stated by the authors as an interpretation, not a
      measurement.
  notes: >-
    EMERGING as a mechanistic model, though the underlying observations are
    long-established and essentially uncontested as *descriptions*. What is
    unresolved is the mechanism: RORB marks a population, it is not known to be
    the cause of that population's vulnerability, and no experiment has yet shown
    that manipulating it changes susceptibility. This group is curated separately
    from the amyloid and tau models because it addresses a question neither
    answers — the anatomical selectivity of the disease — and because it supplies
    the missing link to the entry's HSV-1 node, which is built on the same RORB+
    population but cited only through the viral-reactivation work.
- hypothesis_group_id: necroptosis_model
  hypothesis_label: Necroptosis Model of Neuronal Death
  status: EMERGING
  description: >-
    The mode of neuronal death in Alzheimer disease is modeled as necroptosis —
    RIPK1/RIPK3-triggered, MLKL-executed programmed necrosis — rather than
    apoptosis. Activated necrosome components are found in granulovacuolar
    degeneration bodies, a long-recognized but mechanistically unexplained
    Alzheimer lesion, and their regional burden tracks neuronal loss. This model
    is significant because it names an executioner: it makes neuronal death a
    druggable step rather than the passive endpoint of upstream pathology.
  applies_to_subtypes:
  - Early-Onset Alzheimer's Disease
  - Late-Onset Alzheimer's Disease
  evidence:
  - reference: PMID:28758999
    reference_title: "Necroptosis activation in Alzheimer's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that necroptosis was activated in postmortem human AD brains, positively correlated with Braak stage, and inversely correlated with brain weight and cognitive scores."
    explanation: >-
      Human postmortem dose-response between necroptosis activation and both
      pathological stage and cognitive outcome.
  - reference: PMID:31802237
    reference_title: "Necrosome complex detected in granulovacuolar degeneration is associated with neuronal loss in Alzheimer's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GVDn + neurons inversely correlated with neuronal density in the early affected CA1 region of the hippocampus and in the late affected frontal cortex layer III."
    explanation: >-
      Anchors the mechanism to a specific, classically recognized neuropathological
      lesion and shows its burden tracks neuronal density in both an early- and a
      late-affected region.
  - reference: PMID:37708272
    reference_title: "MEG3 activates necroptosis in human neuron xenografts modeling Alzheimer's disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Down-regulation of MEG3 and inhibition of necroptosis using pharmacological or genetic manipulation of receptor-interacting protein kinase 1 (RIPK1), RIPK3, or mixed lineage kinase domain-like protein (MLKL) rescued neuronal cell loss in xenografted human neurons."
    explanation: >-
      Converts the human correlation into a causal claim: blocking three separate
      necroptosis effectors each rescues loss of human neurons in vivo.
  - reference: PMID:32949047
    reference_title: "Necrosome-positive granulovacuolar degeneration is associated with TDP-43 pathological lesions in the hippocampus of ALS/FTLD cases."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Necrosome-positive GVD was primarily observed in hippocampal regions of ALS/FTLD cases and was associated with hippocampal TDP-43 inclusions as the main predictor of the pMLKL-GVD stage, as well as with the Braak stage of neurofibrillary tangle pathology."
    explanation: >-
      Boundary condition: necrosome-positive granulovacuolar degeneration is not
      specific to Alzheimer disease but tracks proteinopathy more generally, so
      necroptosis is better modeled as a shared execution mechanism than as an
      Alzheimer-defining one.
  notes: >-
    EMERGING. The human evidence is correlative and rests substantially on
    phospho-MLKL and phospho-RIPK immunostaining of postmortem tissue, where
    antibody specificity and postmortem interval are known problems. The causal
    arm comes from human neurons xenografted into a mouse amyloid brain — a system
    whose own headline finding is that mouse neurons in the same brain do not show
    the phenotype, which is an argument for the model's human relevance and a
    reminder that rodent neurodegeneration models may miss the death mechanism
    entirely. Distinct from, and not yet reconciled with, the PARP1 parthanatos
    route curated in this entry; both are caspase-independent regulated necrosis
    and no work has established which dominates, or whether they act in different
    cells or stages.
- hypothesis_group_id: cellular_senescence_model
  hypothesis_label: Cellular Senescence Model
  status: EMERGING
  description: >-
    Accumulation of senescent cells — permanently cell-cycle-arrested but
    metabolically active, and secreting a proinflammatory senescence-associated
    secretory phenotype — is modeled as an active driver of tau pathology,
    neuroinflammation, and neuronal loss rather than a passive marker of brain
    aging. The model's distinguishing prediction is therapeutic and unusually
    direct: removing senescent cells, genetically or with senolytic drugs, should
    reduce pathology and preserve cognition even when the senescent cells are a
    small fraction of the tissue.
  applies_to_subtypes:
  - Late-Onset Alzheimer's Disease
  evidence:
  - reference: PMID:30232451
    reference_title: "Clearance of senescent glial cells prevents tau-dependent pathology and cognitive decline."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we show a causal link between the accumulation of senescent cells and cognition-associated neuronal loss."
    explanation: >-
      Genetic clearance of p16-positive cells as they arise prevents tau
      pathology and neuronal loss, which is the causal claim the model rests on.
  - reference: PMID:30936558
    reference_title: "Senolytic therapy alleviates Aβ-associated oligodendrocyte progenitor cell senescence and cognitive deficits in an Alzheimer's disease model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Senolytic treatment of AD mice selectively removed senescent cells from the plaque environment, reduced neuroinflammation, lessened Aβ load, and ameliorated cognitive deficits."
    explanation: >-
      Pharmacological rather than genetic clearance, in an amyloid rather than tau
      model, reaching the same endpoint — the independent replication the
      therapeutic prediction needs.
  - reference: PMID:35531351
    reference_title: "Profiling senescent cells in human brains reveals neurons with CDKN2D/p19 and tau neuropathology."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "More than 97% of the senescent cells were excitatory neurons and overlapped with tau-containing neurofibrillary tangles (NFTs)."
    explanation: >-
      The largest human survey supports senescence being present and
      tangle-associated, but assigns it overwhelmingly to excitatory neurons —
      contradicting the glial cell-type assignment on which both mouse clearance
      experiments are built.
  - reference: PMID:30126037
    reference_title: "Tau protein aggregation is associated with cellular senescence in the brain."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Transcriptomic analyses of NFT-containing neurons microdissected from postmortem AD brain revealed an expression profile consistent with cellular senescence."
    explanation: >-
      An independent human postmortem observation, predating the eigengene survey
      and using microdissected tangle-bearing neurons rather than a derived
      signature, that also places the senescent state in neurons.
  - reference: PMID:30126037
    reference_title: "Tau protein aggregation is associated with cellular senescence in the brain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Using four AD transgenic mouse models, we found that NFTs, but not Aβ plaques, display a senescence-like phenotype."
    explanation: >-
      A third mouse clearance study, and one whose cell-type answer is neuronal
      and tau-specific rather than glial, so the dispute is not simply mouse glia
      versus human neurons.
  - reference: PMID:37679434
    reference_title: "Senolytic therapy in mild Alzheimer's disease: a phase 1 feasibility trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Secondary cognitive and neuroimaging endpoints did not significantly differ from baseline to post-treatment further supporting a favorable safety profile."
    explanation: >-
      The first human test of the model's distinguishing therapeutic prediction.
      It is an open-label, uncontrolled feasibility study in five participants and
      was not powered for efficacy, so the absent cognitive and imaging signal
      neither confirms nor refutes the model — but the model can no longer be
      described as untested in people.
  - reference: PMID:40274471
    reference_title: "Evaluation of exploratory fluid biomarkers from a phase 1 senolytic trial in mild Alzheimer's disease."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Mass spectrometry indicated stable levels of amyloid β and tau proteins in CSF, unchanged urinary metabolites, and modest treatment-associated lipid profile changes."
    explanation: >-
      Exploratory biomarkers from the same trial: senolytic treatment left CSF
      amyloid-beta and tau unchanged, which sits awkwardly with a simple "clear
      senescent cells, lower the SASP, reduce pathology" reading of the model.
  notes: >-
    EMERGING. Causal evidence remains murine, but it is three independent
    clearance experiments rather than two: genetic p16 ablation in tauopathy
    (PMID:30232451), senolytic clearance of plaque-associated oligodendrocyte
    progenitor cells (PMID:30936558), and senolytic treatment of late-stage tau
    mice reducing tangle density and neuron loss (PMID:30126037).
    The cell-of-origin question is the real dispute, and framing it as "mouse says
    glia, human says neurons" is too clean: PMID:30126037 is a mouse and human
    study placing the senescent state in tangle-bearing neurons, agreeing with the
    human eigengene survey (PMID:35531351) and disagreeing with both other mouse
    studies. What conflicts is the cell-type assignment across studies, not the
    species. It matters because senolytics kill the cells they target: a therapy
    validated against senescent glia would, on the neuronal reading, be aimed at
    postmitotic neurons.
    Human interventional data now exist and are uninformative in both directions —
    the SToMP-AD phase 1 open-label trial (NCT04063124, n=5) established central
    nervous system penetrance of dasatinib and acceptable safety, with no change in
    cognition or imaging and stable CSF amyloid-beta and tau. See the attached
    CONTROVERSY discussion. The standing methodological objection to the human
    survey is that it identifies senescence with a derived eigengene rather than a
    gold-standard marker; note separately that canonical CDKN2A/p16 is badly
    under-detected in single-nucleus data, which cuts against any negative call in
    the rarer cell types.
- hypothesis_group_id: myelin_oligodendrocyte_model
  hypothesis_label: Myelin and Oligodendrocyte Dysfunction Model
  status: EMERGING
  description: >-
    Age-related breakdown of myelin and of oligodendrocyte support for the axon
    is modeled as an upstream risk factor for amyloid deposition rather than a
    downstream consequence of it. Myelin damage concentrates the amyloidogenic
    processing machinery in axonal swellings and increases cleavage of amyloid
    precursor protein; separately, it diverts disease-associated microglia toward
    myelin debris and away from plaques, so the same lesion both raises amyloid
    production and lowers its clearance. APOE4 is modeled as acting partly through
    this route, via aberrant cholesterol deposition in oligodendrocytes and
    reduced myelination.
  applies_to_subtypes:
  - Late-Onset Alzheimer's Disease
  evidence:
  - reference: PMID:37258678
    reference_title: "Myelin dysfunction drives amyloid-β deposition in models of Alzheimer's disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we identify genetic pathways of myelin dysfunction and demyelinating injuries as potent drivers of amyloid deposition in mouse models of AD."
    explanation: >-
      Multiple independent myelin-mutant crosses each increase amyloid deposition,
      establishing the direction of causation in the mouse.
  - reference: PMID:37258678
    reference_title: "Myelin dysfunction drives amyloid-β deposition in models of Alzheimer's disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mechanistically, myelin dysfunction causes the accumulation of the Aβ-producing machinery within axonal swellings and increases the cleavage of cortical amyloid precursor protein."
    explanation: >-
      Supplies the subcellular mechanism linking the myelin lesion to increased
      amyloid production.
  - reference: PMID:36385529
    reference_title: "APOE4 impairs myelination via cholesterol dysregulation in oligodendrocytes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We show that altered cholesterol localization in the APOE4 brain coincides with reduced myelination."
    explanation: >-
      Human postmortem evidence that oligodendrocyte and myelin pathology is real
      in the APOE4 brain, supplying the human leg the mouse causal work lacks.
  notes: >-
    EMERGING. The causal claim — myelin dysfunction drives amyloid deposition — is
    mouse-only; the human work establishes that oligodendrocyte cholesterol
    dysregulation and reduced myelination occur in APOE4 carriers but not that
    they cause amyloid deposition in people. The "microglial distraction" half of
    the mechanism is the more novel and less independently replicated part. This
    group is curated in part because the entry already carries an oligodendrocyte
    precursor cell plasma proteomic age gap as a biomarker without any
    oligodendrocyte-lineage mechanism to attach it to.
- hypothesis_group_id: network_hyperexcitability_model
  hypothesis_label: Network Hyperexcitability and Interneuron Dysfunction Model
  status: EMERGING
  description: >-
    Cognitive decline is modeled as arising in part from a failure of inhibition
    rather than only from loss of excitatory synapses: amyloid-beta impairs
    parvalbumin-expressing inhibitory interneurons through reduced levels of the
    interneuron-predominant voltage-gated sodium channel subunit Nav1.1,
    degrading gamma oscillations and permitting network hypersynchrony and
    epileptiform activity. The model predicts that subclinical epileptiform
    activity should be common in Alzheimer disease, should track faster decline,
    and should be a treatable contributor to symptoms rather than an incidental
    finding.
  applies_to_subtypes:
  - Early-Onset Alzheimer's Disease
  - Late-Onset Alzheimer's Disease
  evidence:
  - reference: PMID:22541439
    reference_title: "Inhibitory interneuron deficit links altered network activity and cognitive dysfunction in Alzheimer model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Restoring Nav1.1 levels in hAPP mice by Nav1.1-BAC expression increased inhibitory synaptic activity and gamma oscillations and reduced hypersynchrony, memory deficits, and premature mortality."
    explanation: >-
      Gain-of-function rescue of a single interneuron-specific channel subunit
      corrects oscillations, hypersynchrony and memory, establishing interneuron
      failure as causal rather than correlative in this model.
  - reference: PMID:27696483
    reference_title: "Incidence and impact of subclinical epileptiform activity in Alzheimer's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subclinical epileptiform activity was detected in 42.4% of AD patients and 10.5% of controls (p = 0.02)."
    explanation: >-
      Prospective, blinded extended EEG/MEG monitoring showing the predicted
      hyperexcitability is present in a large minority of patients with no seizure
      history.
  - reference: PMID:27696483
    reference_title: "Incidence and impact of subclinical epileptiform activity in Alzheimer's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, patients with subclinical epileptiform activity showed faster declines in global cognition, determined by the Mini-Mental State Examination (3.9 points/year in patients with epileptiform activity vs 1.6 points/year in patients without; p = 0.006), and in executive function (p = 0.01)."
    explanation: >-
      Links the electrophysiological finding to the clinical outcome the model
      predicts it should affect.
  - reference: PMID:38263073
    reference_title: "Subclinical epileptiform activity in the Alzheimer continuum: association with disease, cognition and detection method."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found an increased prevalence of SEA in AD subjects (31%) as compared to controls (8%) (p = 0.041; Fisher's exact test), with increasing prevalence over the disease course (50% in dementia, 27% in MCI and 25% in preclinical AD)."
    explanation: >-
      Independent replication of the prevalence excess in a separate cohort, and
      an extension of it: subclinical epileptiform activity is already present in
      preclinical Alzheimer disease and rises across the continuum, which is what
      an early network mechanism predicts rather than a late consequence.
  - reference: PMID:21228179
    reference_title: "Amyloid-β/Fyn-induced synaptic, network, and cognitive impairments depend on tau levels in multiple mouse models of Alzheimer's disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Using electroencephalography to examine network effects, we found that tau reduction prevented spontaneous epileptiform activity in multiple lines of hAPP mice."
    explanation: >-
      A second, mechanistically independent perturbation reaching the same
      endpoint: removing tau, rather than restoring an interneuron channel,
      also abolishes epileptiform activity. Two unrelated interventions
      converging on restored inhibition is stronger than either alone.
  - reference: PMID:38356475
    reference_title: "The HOPE4MCI study: A randomized double-blind assessment of AGB101 for the treatment of MCI due to AD."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The estimated difference between arms is -0.10 (95% CI: -0.85, 0.58), which was not statistically significant."
    explanation: >-
      The largest and longest test of the model's therapeutic prediction — 164
      participants over 78 weeks, using a drug selected for its ability to
      normalize hippocampal hyperactivity — was negative on its primary endpoint
      in an unselected population. This is the single strongest reason the
      treatability claim cannot be called established.
  - reference: PMID:34570177
    reference_title: "Effect of Levetiracetam on Cognition in Patients With Alzheimer Disease With and Without Epileptiform Activity: A Randomized Clinical Trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, treatment with levetiracetam did not change NIH-EXAMINER composite scores (mean difference vs placebo, 0.07 points; 95% CI, -0.18 to 0.32 points; P = .55) or secondary measures."
    explanation: >-
      Null on its primary endpoint in unselected patients, with the reported
      benefit confined to the prespecified epileptiform-positive subgroup. Read
      together with the negative HOPE4MCI trial, the pattern is that any benefit
      is restricted to a hyperexcitable subgroup rather than to Alzheimer disease
      generally — which is a testable refinement of the model, not a rescue of it.
  - reference: PMID:22592800
    reference_title: "Critical role of soluble amyloid-β for early hippocampal hyperactivity in a mouse model of Alzheimer's disease."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "Remarkably, in the hippocampus of young mice, we observed a selective increase in hyperactive neurons already before the formation of plaques, suggesting that soluble species of Aβ may underlie this impairment."
    explanation: >-
      Qualifies where the initiating lesion sits. Neuronal hyperactivity appears
      before plaques and is inducible by soluble amyloid-beta directly, so the
      network phenotype can arise upstream of, or in parallel with, interneuron
      failure rather than requiring it as the first step.
  notes: >-
    EMERGING, and the therapeutic arm should be read as qualified rather than
    merely "mixed". The mechanistic case in mice is strong: two independent
    perturbations — restoring Nav1.1 (PMID:22541439) and reducing tau
    (PMID:21228179) — each restore inhibition and abolish epileptiform activity.
    The human limb of the Nav1.1 claim remains a postmortem protein-level
    observation. The prevalence claim is now replicated in an independent cohort
    with detection across the Alzheimer continuum including preclinical disease
    (PMID:38263073), which strengthens it considerably beyond the single seed
    study.
    The treatability prediction is where the model is weakest. The largest and
    longest trial, HOPE4MCI (164 participants, 78 weeks, low-dose extended-release
    levetiracetam), was negative on its primary endpoint (PMID:38356475), and the
    LEV-AD crossover trial was null overall with benefit confined to its
    prespecified epileptiform-positive subgroup (PMID:34570177). The honest
    reading is that any benefit is subgroup-restricted and that this has not yet
    been tested prospectively in a biomarker-selected population.
    A competing account also has to be carried: neuronal hyperactivity appears
    before plaque formation and is inducible by soluble amyloid-beta directly
    (PMID:22592800), so interneuron failure may be one component of an
    amyloid-initiated network phenotype rather than its first step. Curated
    separately from synaptic_failure_convergence_model because it still makes the
    opposite claim about what fails first: inhibition, not excitation.

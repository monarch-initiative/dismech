    term:
      id: hgnc:1950
      label: CHRM1
  - preferred_term: ADAM17
    term:
      id: hgnc:195
      label: ADAM17
  - preferred_term: GSK3B
    term:
      id: hgnc:4617
      label: GSK3B
  mechanisms:
  - Loss of M1-dependent activation of ADAM17 (alpha-secretase), diverting APP from the non-amyloidogenic to the amyloidogenic cleavage route.
  - Loss of M1-dependent restraint on GSK3-beta and protein kinase C activity, permitting tau hyperphosphorylation.
  consequences:
  - Amyloid Plaque Formation
  - Neurofibrillary Tangle Formation
  downstream:
  - target: Amyloid Plaque Formation
    description: >-
      Withdrawal of M1 signaling shifts APP processing away from the
      ADAM17/alpha-secretase route toward amyloidogenic cleavage, increasing
      amyloid-beta available for deposition.
    hypothesis_groups:
    - anticholinergic_muscarinic_burden_model
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Reduced ADAM17 (alpha-secretase) activation and consequent diversion of APP to beta/gamma-secretase cleavage.
    evidence:
    - reference: PMID:16504943
      reference_title: M1 receptors play a central role in modulating AD-like pathology in transgenic mice.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The mechanism underlying the effect on the Abeta pathology was caused by the selective activation of ADAM17, thereby shifting APP processing toward the nonamyloidogenic pathway, whereas the reduction in tau pathology is mediated by decreased GSK3beta activity."
      explanation: >-
        Identifies ADAM17 as the effector coupling M1 signaling to
        non-amyloidogenic APP processing, so loss of M1 signaling is the
        directional inverse of this rescue.
    - reference: PMID:21704011
      reference_title: "Loss of muscarinic M1 receptor exacerbates Alzheimer's disease-like pathology and cognitive decline."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Ablating the M(1)R increased plaque and tangle levels in the brains of 3xTgAD mice"
      explanation: >-
        Genetic removal of M1 increases plaque burden in an AD model, the
        loss-of-signaling direction this edge asserts.
  - target: Neurofibrillary Tangle Formation
    description: >-
      Loss of M1 signaling de-represses GSK3-beta and alters protein kinase C
      activity, promoting tau hyperphosphorylation and tangle formation.
    hypothesis_groups:
    - anticholinergic_muscarinic_burden_model
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Increased GSK3-beta activity and altered protein kinase C signaling driving tau hyperphosphorylation.
    evidence:
    - reference: PMID:21704011
      reference_title: "Loss of muscarinic M1 receptor exacerbates Alzheimer's disease-like pathology and cognitive decline."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "tau hyperphosphorylation and potentiation of amyloidogenic processing in the mice with AD lacking M(1)R were attributed to changes in the glycogen synthase kinase 3β and protein kinase C activities"
      explanation: >-
        Names GSK3-beta and PKC as the kinases mediating tau
        hyperphosphorylation downstream of M1 loss.
  evidence:
  - reference: PMID:16504943
    reference_title: M1 receptors play a central role in modulating AD-like pathology in transgenic mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We further demonstrate that administration of dicyclomine, an M1 antagonist, exacerbates the Abeta and tau pathologies."
    explanation: >-
      Establishes that pharmacologic M1 blockade, not only genetic ablation,
      worsens AD-like pathology.
  notes: >-
    Curated as EMERGING (anticholinergic_muscarinic_burden_model), not as part
    of the canonical cholinergic-deficit account of AD symptoms. Every edge here
    rests on MODEL_ORGANISM evidence in 3xTg-AD/Tg-SwDI mice. Two limits matter
    for anyone reusing this node to reason about drug exposure: dicyclomine and
    the M1 knockout are M1-selective, whereas the drugs driving the human
    epidemiology (diphenhydramine, tricyclics, oxybutynin) are non-selective
    across M1-M5 and additionally block H1; and the mouse work manipulates M1
    against an existing transgenic amyloid/tau burden, which is not the same
    experiment as exposing a pathology-free brain. See the attached
    HUMAN_MODEL_MISMATCH discussion.
phenotypes:
- category: Cognitive
  name: Memory Loss
  frequency: VERY_FREQUENT
  diagnostic: true
  notes: The earliest and most prominent symptom.
  evidence:
  - reference: PMID:31724515
    reference_title: "Assessment of Memory Impairment in Early Diagnosis of Alzheimer's Disease."
    supports: SUPPORT
    snippet: Memory impairment has been considered as one of the earliest clinical hallmarks of Alzheimer's disease.
    explanation: This reference supports the statement that memory loss is a very frequent and early diagnostic symptom of Alzheimer's disease.
  phenotype_term:
    preferred_term: Memory impairment
    term:
      id: HP:0002354
      label: Memory impairment
- category: Cognitive
  name: Executive Dysfunction
  frequency: VERY_FREQUENT
  notes: Difficulty in planning, decision-making, and judgment.
  evidence:
  - reference: PMID:24011643
    reference_title: "Executive functions in clinical and preclinical Alzheimer's disease."
    supports: SUPPORT
    snippet: Impairment of executive functions is common in neurodegenerative disorders such as Alzheimer's disease.
    explanation: The literature states that executive dysfunction, which includes difficulties in planning, decision-making, and judgment, is common in Alzheimer's disease.
  phenotype_term:
    preferred_term: Impaired executive functioning
    term:
      id: HP:0033051
      label: Impaired executive functioning
- category: Psychiatric
  name: Behavioral Changes
  frequency: FREQUENT
  notes: Includes irritability, depression, and apathy.
  evidence:
  - reference: PMID:38157881
    reference_title: "Behavioral or neuropsychiatric symptoms of Alzheimer's disease: from psychopathology to pharmacological management."
    supports: SUPPORT
    snippet: Neuropsychiatric or behavioral symptoms of dementia encompass a series of disorders, such as anxiety, depression, apathy, psychosis, and agitation, all commonly present in individuals living with dementia.
    explanation: The abstract confirms that behavioral changes, including irritability, depression, and apathy, are common in Alzheimer's disease.
  - reference: PMID:28413709
    reference_title: "Awareness, apathy, and depression in Alzheimer's disease and mild cognitive impairment."
    supports: SUPPORT
    snippet: 'Using the median split approach, greater apathy and lower depression were associated with poorer awareness on the Self-Consciousness Scale (respectively: odds ratio ... = 4.8, p = .03; OR = 4.84, p = .04), and the PCRS (only apathy: OR = 9.3, p = .003).'
    explanation: This study indicates that apathy and depression are significant behavioral symptoms in Alzheimer's disease.
  phenotype_term:
    preferred_term: Behavioral abnormality
    term:
      id: HP:0000708
      label: Atypical behavior
- category: Neurologic
  name: Aphasia
  frequency: FREQUENT
  notes: Difficulty with speech and understanding language.
  evidence:
  - reference: PMID:24035593
    reference_title: "Aphasia(s) in Alzheimer."
    supports: SUPPORT
    snippet: Language disorders of degenerative origin are frequently tied to Alzheimer disease (AD) the different variants of which can result in primary and secondary aphasia syndromes.
    explanation: The literature clearly supports that aphasia, which involves difficulty with speech and understanding language, is a frequent neurologic symptom in Alzheimer's Disease.
  phenotype_term:
    preferred_term: Aphasia
    term:
      id: HP:0002381
      label: Aphasia
- category: Neurologic
  name: Apraxia
  frequency: OCCASIONAL
  notes: Difficulty with motor tasks despite intact motor function.
  evidence:
  - reference: PMID:36375032
    reference_title: "The dementia apraxia test can detect early-onset Alzheimer's disease."
    supports: SUPPORT
    snippet: Limb apraxia is a common early sign of Alzheimer's disease (AD) and is thought to occur specifically in early-onset (before the age of 65) AD.
    explanation: The literature indicates that limb apraxia is a common early sign of Alzheimer's disease, supporting the statement that apraxia can occur in Alzheimer's disease.
  phenotype_term:
    preferred_term: Apraxia
    term:
      id: HP:0002186
      label: Apraxia
- category: Neurologic
  name: Agnosia
  phenotype_term:
    preferred_term: Agnosia
    term:
      id: HP:0010524
      label: Disturbed sensory perception
  frequency: OCCASIONAL
  notes: Inability to recognize objects or people.
  evidence:
  - reference: PMID:31449049
    reference_title: "[Visual perceptual disorders in Alzheimer's disease]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "both low-level and high-level visual perception disorders seem quite common in Alzheimer's disease, including, on a low-level, loss of visual field, decreased acuity and contrast sensitivity, and impaired color vision, and on a high-level, impaired color vision, motion perception, visuospatial deficits, object agnosia, prosopagnosia and impaired recognition of facial emotional expressions."
    explanation: Review of visual-perceptual deficits in Alzheimer's disease reporting that high-level disorders including object agnosia and prosopagnosia are common, directly supporting agnosia as a recognized (occasional) neurologic feature of the disease.
biochemical:
- name: Amyloid Beta (Aβ42)
  presence: Elevated
  context: Found in cerebrospinal fluid and brain tissue.
  evidence:
  - reference: PMID:19661632
    reference_title: "Cerebrospinal fluid biomarkers for Alzheimer's disease."
    supports: SUPPORT
    snippet: The core candidate CSF biomarkers Abeta42, total tau (T-tau), and phosphorylated tau (P-tau) have been shown to have a high diagnostic performance to identify AD also in the early phase of the disease.
    explanation: The literature confirms that Abeta42 is a core biomarker found in cerebrospinal fluid (CSF) and is elevated in Alzheimer's disease.
  - reference: PMID:31958088
    reference_title: "Aluminum and Amyloid-β in Familial Alzheimer's Disease."
    supports: SUPPORT
    snippet: Genetic predispositions associated with metabolism of the amyloid-beta protein precursor underlie familial Alzheimer's disease; a form of dementia characterized by early disease onset and elevated levels of cortical amyloid-beta.
    explanation: The literature confirms that elevated levels of amyloid-beta, including Abeta42, are found in the brain tissue of individuals with Alzheimer's disease.
  - reference: PMID:38987603
    reference_title: "CryoET of β-amyloid and tau within postmortem Alzheimer's disease brain."
    supports: SUPPORT
    snippet: beta-amyloid plaques contained a mixture of fibrils, some of which were branched, and protofilaments, arranged in parallel arrays and lattice-like structures.
    explanation: This reference supports the presence of beta-amyloid in brain tissue, which includes Abeta42, in Alzheimer's disease.
  - reference: PMID:33080124
    reference_title: "Amyloid-β PET and CSF in an autopsy-confirmed cohort."
    supports: SUPPORT
    snippet: Accumulation of amyloid-β is among the earliest changes in Alzheimer's disease (AD). Amyloid-β positron emission tomography (PET) and Aβ42 in cerebrospinal fluid (CSF) both assess amyloid-β pathology in-vivo
    explanation: This literature supports the presence and elevation of Abeta42 in both cerebrospinal fluid and brain tissue in Alzheimer's disease.
- name: Astrocyte Plasma Proteomic Age Gap
  biomarker_term:
    preferred_term: astrocyte plasma proteomic aging clock (age gap)
    term:
      id: NCIT:C97139
      label: Proteomic Profile
  presence: Elevated
  context: >-
    Blood-based cell-type-specific aging clock. Plasma proteins are mapped to
    their putative cell of origin using Human Protein Atlas single-cell
    transcriptomic data, and a machine-learning model estimates astrocyte
    biological age; the age gap is the difference between that estimate and
    chronological age. "Extreme" agers are those in the upper tail of the age-gap
    distribution and "youthful" agers the lower tail.
  cell_types:
  - preferred_term: Astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  notes: >-
    Astrocyte age gap was the strongest cellular-aging predictor of incident
    Alzheimer disease in UK Biobank over 15 years of follow-up, and stratified
    risk within every APOE genotype stratum, including APOE4 homozygotes. Note
    that the headline 12.59-fold figure is an extreme-versus-youthful contrast;
    in the separate comparison against established risk factors the excess risk
    of extreme astrocyte aging was HR 5.16 (95% CI 4.06-6.56), comparable to
    APOE4 carrier status (HR 5.30) and exceeding the AD polygenic risk score
    (HR 2.14). This is a prognostic association from observational cohorts, not
    a demonstration that astrocyte aging causes Alzheimer disease.
  evidence:
  - reference: PMID:42297981
    reference_title: "Plasma proteomic signatures of cellular aging predict human disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Individuals with extreme astrocyte aging demonstrated a 12.59-fold increased risk of incident AD compared to those with youthful aging.
    explanation: >-
      Quantifies the prognostic association between the astrocyte plasma
      proteomic age gap and incident Alzheimer disease over 15 years of UK
      Biobank follow-up.
  - reference: PMID:42297981
    reference_title: "Plasma proteomic signatures of cellular aging predict human disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Individuals who were homozygous for APOE4 and had extreme astrocyte aging showed the highest cumulative incidence of 38.3% over 15 years of follow-up, compared to 12.6% for homozygotes with normal astrocyte aging.
    explanation: >-
      Shows that astrocyte aging status stratifies absolute AD incidence within
      the highest-risk APOE genotype, supporting use of the age gap as a risk
      modifier on top of genotype.
  - reference: PMID:42297981
    reference_title: "Plasma proteomic signatures of cellular aging predict human disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: extreme astrocyte aging consistently identified individuals at elevated AD risk compared to those with normal and youthful astrocyte aging, demonstrating that astrocyte aging provides independent risk stratification beyond APOE genotype
    explanation: >-
      States the authors' conclusion that the astrocyte age gap adds risk
      information independent of APOE genotype.
  - reference: PMID:42297981
    reference_title: "Plasma proteomic signatures of cellular aging predict human disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Possessing both APOE4 and astrocyte extreme aging conferred a greater increase in AD risk for women
    explanation: >-
      Records the sex difference in the APOE4-by-astrocyte-aging interaction
      (HR 14.23, 95% CI 9.86-20.54 in women versus 10.95 in men), relevant to how
      the biomarker would be applied in stratification.
  readouts:
  - target: Neuroinflammation
    relationship: PREDICTS
    direction: POSITIVE
    endpoint_context: PROGNOSTIC
    interpretation: >-
      An elevated astrocyte age gap reports an aged astrocyte proteomic state and
      predicts incident Alzheimer disease years before diagnosis. It is linked to
      the astrocytic arm of the neuroinflammation node, but the study measures
      plasma protein signatures rather than brain astrocyte reactivity directly.
    evidence:
    - reference: PMID:42297981
      reference_title: "Plasma proteomic signatures of cellular aging predict human disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Individuals with extreme astrocyte aging demonstrated a 12.59-fold increased risk of incident AD compared to those with youthful aging.
      explanation: >-
        Supports treating the astrocyte age gap as a prognostic readout that
        anticipates clinical Alzheimer disease.
  - target: Neurofibrillary Tangle Formation
    relationship: CORRELATES_WITH
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      In the NSHD Insight-46 substudy the astrocyte age gap tracked plasma
      pTau-217 burden, an orthogonal blood measure of amyloid and tau pathology,
      linking the clock to tau pathology rather than to cognition alone.
    evidence:
    - reference: PMID:42297981
      reference_title: "Plasma proteomic signatures of cellular aging predict human disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: we found significant associations between plasma phosphorylated tau-217 (pTau-217) burden and several neuronal and glial cell types, including astrocytes
      explanation: >-
        Provides the orthogonal pathology correlate for the astrocyte age gap,
        supporting a correlational readout against the tau pathology node.
- name: Oligodendrocyte Precursor Cell Plasma Proteomic Age Gap
  biomarker_term:
    preferred_term: oligodendrocyte precursor cell plasma proteomic aging clock (age gap)
    term:
      id: NCIT:C97139
      label: Proteomic Profile
  presence: Elevated
  context: >-
    Blood-based cell-type-specific aging clock (see Astrocyte Plasma Proteomic
    Age Gap for the derivation). Oligodendrocyte precursor cells were the most
    prominent cross-sectional association with clinical Alzheimer disease in the
    Global Neurodegeneration Proteomics Consortium cohort, though pancreatic
    endocrine cells and inhibitory neurons showed a comparable effect size.
  cell_types:
  - preferred_term: Oligodendrocyte precursor cell
    term:
      id: CL:0002453
      label: oligodendrocyte precursor cell
  notes: >-
    Unlike the astrocyte clock, whose value in this study is prognostic for
    incident disease, the oligodendrocyte precursor cell age gap behaves as a
    severity-tracking marker: it rises stepwise with Clinical Dementia Rating
    score and is among the strongest correlates of a worse Preclinical Alzheimer
    Cognitive Composite.
  evidence:
  - reference: PMID:42297981
    reference_title: "Plasma proteomic signatures of cellular aging predict human disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: AD was associated with accelerated aging across a wide range of cell types, most prominently oligodendrocyte precursor cells
    explanation: >-
      Establishes the cross-sectional case/control association in the GNPC cohort
      and the relative prominence of the oligodendrocyte precursor cell signal.
  - reference: PMID:42297981
    reference_title: "Plasma proteomic signatures of cellular aging predict human disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: oligodendrocyte precursor cell aging showed a consistent stepwise increase with worsening cognitive impairment
    explanation: >-
      Establishes the graded relationship between the oligodendrocyte precursor
      cell age gap and Clinical Dementia Rating stage.
  - reference: PMID:42297981
    reference_title: "Plasma proteomic signatures of cellular aging predict human disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: we observed an association between worsened cognition and elevated age gaps across a variety of cell types, with oligodendrocyte precursor cells demonstrating one of the strongest associations
    explanation: >-
      Independent cohort (NSHD Insight-46) association with the Preclinical
      Alzheimer Cognitive Composite, supporting the marker as a correlate of
      early cognitive decline.
  readouts:
  - target: Neurofibrillary Tangle Formation
    relationship: CORRELATES_WITH
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      The oligodendrocyte precursor cell age gap tracked plasma pTau-217 burden
      in the Insight-46 substudy, tying this glial clock to measured tau
      pathology as well as to cognitive stage.
    evidence:
    - reference: PMID:42297981
      reference_title: "Plasma proteomic signatures of cellular aging predict human disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: we found significant associations between plasma phosphorylated tau-217 (pTau-217) burden and several neuronal and glial cell types, including astrocytes (coefficient beta (ꞵ) = 1.08, adjusted P = 3.92 × 10−7), oligodendrocyte precursor cells (ꞵ = 1.02, adjusted P = 1.19 × 10−6)
      explanation: >-
        Names oligodendrocyte precursor cells explicitly, with a pTau-217
        regression coefficient comparable to that of astrocytes, in the NSHD
        Insight-46 substudy.
- name: Inhibitory Neuron Plasma Proteomic Age Gap
  biomarker_term:
    preferred_term: inhibitory neuron plasma proteomic aging clock (age gap)
    term:
      id: NCIT:C97139
      label: Proteomic Profile
  presence: Elevated
  context: >-
    Blood-based cell-type-specific aging clock (see Astrocyte Plasma Proteomic
    Age Gap for the derivation). The finding is notable for its selectivity:
    inhibitory neuron aging associated with Alzheimer disease while excitatory
    neuron aging did not.
  cell_types:
  - preferred_term: Inhibitory (GABAergic) neuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  notes: >-
    The inhibitory-but-not-excitatory pattern is concordant with the selective
    interneuron vulnerability and excitation/inhibition imbalance literature in
    Alzheimer disease, though this study measures a plasma proteomic signature
    and does not itself demonstrate interneuron loss.
  evidence:
  - reference: PMID:42297981
    reference_title: "Plasma proteomic signatures of cellular aging predict human disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: while aging of inhibitory neurons was linked to AD, aging of excitatory neurons was not
    explanation: >-
      Establishes the cell-type selectivity that distinguishes this marker from a
      generic neuronal aging signal.
  - reference: PMID:42297981
    reference_title: "Plasma proteomic signatures of cellular aging predict human disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: inhibitory neuron age gaps increased with higher CDR scores across cohorts
    explanation: >-
      Shows the inhibitory neuron age gap tracks dementia severity stage, not
      only case/control status.
  readouts:
  - target: Synaptic Dysfunction
    relationship: CORRELATES_WITH
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      An elevated inhibitory neuron age gap, in the absence of a matching
      excitatory neuron signal, is read as a plasma correlate of the selective
      interneuron vulnerability that contributes to excitation/inhibition
      imbalance and synaptic dysfunction in Alzheimer disease.
    evidence:
    - reference: PMID:42297981
      reference_title: "Plasma proteomic signatures of cellular aging predict human disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: while aging of inhibitory neurons was linked to AD, aging of excitatory neurons was not
      explanation: >-
        The selectivity of the association is what licenses reading this marker
        against the interneuron/synaptic arm rather than neurodegeneration
        generally.
genetic:
- name: APP
  gene_term:
    preferred_term: APP
    term:
      id: hgnc:620
      label: APP
  association: Genetic Mutation
  subtype: Early-Onset Alzheimer's Disease
  evidence:
  - reference: PMID:1365885
    reference_title: "Alzheimer's disease untangled."
    supports: SUPPORT
    snippet: Four mutations involving amino acid substitutions in exons 16 and 17 of the amyloid precursor protein (APP) gene, have been identified which co-segregate with the disease in some families multiply affected by early onset Alzheimer's disease.
    explanation: This reference supports the association of APP genetic mutations with early-onset Alzheimer's disease.
  - reference: PMID:33789815
    reference_title: "Low-degree trisomy 21 mosaicism promotes early-onset Alzheimer disease."
    supports: SUPPORT
    snippet: This is the first case demonstrating that a low-degree APP gene-dose increase suffices to cause EOAD with prominent amyloid-beta/tau pathology.
    explanation: This reference supports the role of APP gene mutations in causing early-onset Alzheimer's disease.
  - reference: PMID:36306459
    reference_title: "Screening for Genetic Mutations Associated with Early-Onset Alzheimer's Disease in Han Chinese."
    supports: SUPPORT
    snippet: Numerous mutations in amyloid precursor protein (APP) and presenilin 1 and 2 (PSEN1 and PSEN2) have been identified for EOAD, but they can only account for a small proportion of EOAD cases.
    explanation: This reference supports the association of APP genetic mutations with early-onset Alzheimer's disease.
  - reference: PMID:31623876
    reference_title: "Novel amyloid precursor protein mutation, Val669Leu (\"Seoul APP\"), in a Korean patient with early-onset Alzheimer's disease."
    supports: SUPPORT
    snippet: In this study, a novel mutation in APP gene, Val669Leu ('Seoul APP'), was reported in a Korean female patient with Alzheimer's disease.
    explanation: This reference supports the association of APP genetic mutations with early-onset Alzheimer's disease.
  - reference: PMID:26243569
    reference_title: "A genetic cause of Alzheimer disease: mechanistic insights from Down syndrome."
    supports: SUPPORT
    snippet: It is thought that this risk is conferred by the presence of three copies of the gene encoding amyloid precursor protein (APP)--an Alzheimer disease risk factor.
    explanation: This reference supports the association of APP genetic mutations with early-onset Alzheimer's disease.
  - reference: PMID:22727994
    reference_title: "Good gene, bad gene: new APP variant may be both."
    supports: SUPPORT
    snippet: APP mutations cause Alzheimer disease (AD) with virtually complete penetrance.
    explanation: This reference supports the association of APP genetic mutations with early-onset Alzheimer's disease.
- name: PSEN1
  gene_term:
    preferred_term: PSEN1
    term:
      id: hgnc:9508
      label: PSEN1
  association: Genetic Mutation
  subtype: Early-Onset Alzheimer's Disease
  evidence:
  - reference: PMID:31296348
    reference_title: "A patient with early-onset Alzheimer's disease with a novel PSEN1 p.Leu424Pro mutation."
    supports: SUPPORT
    snippet: Presenilin 1 (PSEN1) gene mutations are the major known genetic cause of early-onset Alzheimer's disease.
    explanation: The study reports a novel PSEN1 mutation associated with early-onset Alzheimer's disease, supporting the genetic association.
  - reference: PMID:35487021
    reference_title: "A review ofimaging genetics in Alzheimer's disease."
    supports: SUPPORT
    snippet: At present, three early-onset AD genes (APP, PSEN1, PSEN2) and one late-onset AD susceptibility gene apolipoprotein E (APOE) have been determined.
    explanation: The reference confirms that PSEN1 is one of the genes associated with early-onset Alzheimer's disease.
  - reference: PMID:36951251
    reference_title: "Genetic associations with age at dementia onset in the PSEN1 E280A Colombian kindred."
    supports: SUPPORT
    snippet: A genetic association study was conducted to examine ADAD AAO in 340 individuals with the PSEN1 E280A mutation.
    explanation: The study discusses a large cohort with a specific PSEN1 mutation associated with early-onset Alzheimer's disease, reinforcing the genetic link.
  - reference: PMID:36641620
    reference_title: "Embryo Selection for a Carrier of an Early-Onset Alzheimer's Disease-Associated Mutation in the PSEN1 Gene."
    supports: SUPPORT
    snippet: Early-onset AD represents about 5.5% of the total cases and occurs in patients under age 65. The EOAD progresses more aggressively and has a shorter life expectancy due to a greater pathogenic load.
    explanation: The reference discusses early-onset Alzheimer's disease and mentions PSEN1 mutations, supporting the genetic association.
  - reference: PMID:35430993
    reference_title: "Clinical and Molecular Findings in a Turkish Family Who Had a (c.869- 1G>A) Splicing Variant in PSEN1 Gene with A Rare Condition: The Variant Alzheimer's Disease with Spastic Paraparesis."
    supports: SUPPORT
    snippet: Early-onset Alzheimer's disease (EOAD) is commonly diagnosed with an onset age of earlier than 65 years and accounts for 5-10% of all Alzheimer's disease (AD) cases.
    explanation: The study highlights the occurrence of early-onset Alzheimer's disease and mentions PSEN1 mutations, supporting the genetic link.
  - reference: PMID:30549411
    reference_title: "Gene mutations in a Han Chinese Alzheimer's disease cohort."
    supports: SUPPORT
    snippet: The gene mutations in the amyloid precursor protein (APP), presenilin 1 (PSEN1), and presenilin 2 (PSEN2) are the frequent causes of AD.
    explanation: The reference confirms that PSEN1 mutations are a frequent cause of early-onset Alzheimer's disease.
- name: PSEN2
  gene_term:
    preferred_term: PSEN2
    term:
      id: hgnc:9509
      label: PSEN2
  association: Genetic Mutation
  subtype: Early-Onset Alzheimer's Disease
  evidence:
  - reference: PMID:35491795
    reference_title: "PSEN2 Mutation Spectrum and Novel Functionally Validated Mutations in Alzheimer's Disease: Data from PUMCH Dementia Cohort."
    supports: SUPPORT
    snippet: The established causative mutations in the APP, PSEN1, and PSEN2 can explain less than 1%, Alzheimer's disease (AD) patients. Of the identified variants, the PSEN2 mutations are even less common.
    explanation: The reference confirms that PSEN2 mutations are among the causative factors for early-onset Alzheimer's disease.
  - reference: PMID:36701017
    reference_title: "PSEN2 and ABCA7 variants causing early-onset preclinical pathological changes in Alzheimer's disease: a case report and literature review."
    supports: SUPPORT
    snippet: Early-onset AD (EOAD) was defined as AD occurring before age 65. Although it has a high genetic risk, EOAD due to PSEN2 variation is very rare.
    explanation: The reference supports the association of PSEN2 with early-onset Alzheimer's disease, although it notes that such cases are rare.
  - reference: PMID:32741831
    reference_title: "Early-Onset Familial Alzheimer Disease Variant PSEN2 N141I Heterozygosity is Associated with Altered Microglia Phenotype."
    supports: SUPPORT
    snippet: Early-onset familial Alzheimer disease (EOFAD) is caused by heterozygous variants in the presenilin 1 (PSEN1), presenilin 2 (PSEN2), and APP genes.
    explanation: The reference explicitly states that early-onset familial Alzheimer's disease can be caused by PSEN2 mutations.
- name: APOE
  gene_term:
    preferred_term: APOE
    term:
      id: hgnc:613
      label: APOE
  association: Risk Factor
  subtype: Late-Onset Alzheimer's Disease
  notes: >-
    APOE is the strongest common-variant genetic risk factor for late-onset
    Alzheimer's disease. The APOE4 allele increases risk and accelerates onset in
    a gene-dose-dependent manner (relative to the common APOE3), while APOE2 is
    protective. Beyond amyloid, APOE4 exacerbates tau-mediated neurodegeneration,
    neuroinflammation, glial lipid/cholesterol accumulation, and dysfunction of
    the blood-brain barrier. Rare protective coding variants illuminate mechanism
    and
    are therapeutic templates: APOE3 Christchurch (R136S) reduces receptor-binding
    avidity and limits tau seeding/spreading (a homozygous carrier resisted
    autosomal-dominant AD for ~3 decades despite heavy amyloid), and APOE3
    Jacksonville (V236E) reduces APOE self-aggregation and amyloid pathology.
    Preclinically, lowering APOE4 (e.g., with antisense oligonucleotides) reduces
    tau pathology, neurodegeneration, and neuroinflammation, motivating
    APOE-directed therapeutics. See the apoe_risk_modulation_model mechanistic
    hypothesis.
  evidence:
  - reference: PMID:28959956
    reference_title: "ApoE4 markedly exacerbates tau-mediated neurodegeneration in a mouse model of tauopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "APOE4 is the strongest genetic risk factor for late-onset Alzheimer disease."
    explanation: Establishes APOE4 as the leading genetic risk factor for late-onset AD.
  - reference: PMID:31686034
    reference_title: "Resistance to autosomal dominant Alzheimer's disease in an APOE3 Christchurch homozygote: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The individual had two copies of the APOE3 Christchurch (R136S) mutation, unusually high brain amyloid levels and limited tau and neurodegenerative measurements."
    explanation: >-
      The homozygous APOE3 Christchurch (R136S) variant is associated with
      resistance to autosomal-dominant AD despite high amyloid, evidence for a
      protective APOE variant acting on tau/neurodegeneration.
  - reference: PMID:34586832
    reference_title: "APOE3-Jacksonville (V236E) variant reduces self-aggregation and risk of dementia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice expressing APOE3-Jac have reduced amyloid pathology, plaque-associated immune responses, and neuritic dystrophy."
    explanation: >-
      The APOE3-Jacksonville (V236E) variant reduces APOE aggregation and amyloid
      pathology, a second protective APOE variant supporting APOE aggregation as a
      therapeutic target.
  - reference: PMID:33550655
    reference_title: "Apolipoprotein E4 Reduction with Antisense Oligonucleotides Decreases Neurodegeneration in a Tauopathy Model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We conclude that reducing ApoE4 levels should be explored further as a therapeutic approach for APOE4 carriers with tauopathy including Alzheimer's disease."
    explanation: >-
      APOE4-lowering antisense oligonucleotides reduce tau pathology,
      neurodegeneration, and neuroinflammation, supporting APOE as an actionable
      therapeutic node.
- name: BIN1
  gene_term:
    preferred_term: BIN1
    term:
      id: hgnc:1052
      label: BIN1
  association: Risk Factor
  subtype: Late-Onset Alzheimer's Disease
  notes: >-
    BIN1 encodes bridging integrator 1, a phosphoinositide-binding adaptor protein involved in membrane dynamics, endocytosis, and synaptic function. Identified as the strongest broad AD-risk anchor across blood and brain-region eQTL layers (whole blood, cortex, hippocampus, cerebellum). The locus shows distinct causal variants (H3-dominated colocalization) across tissues, indicating region-specific regulatory mechanisms rather than a single shared causal variant. Disease-state brain-expression support shows reduced BIN1 expression in Alzheimer disease versus control tissue.
  evidence:
  - reference: PPR:PPR1263744
    reference_title: "Brain-region-aware genetic prioritization separates Alzheimer disease risk from APOE-sensitive β-amyloid burden in public genetic and expression quantitative trait locus resources"
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "eQTLGen tested 16,875 genes for AD risk and identiﬁed 204 FDR-signiﬁcant genes, led by BIN1."
    explanation: eQTLGen blood eQTL analysis identified BIN1 as the lead AD-risk gene among 204 FDR-significant hits, establishing it as a primary genetic risk factor distinct from amyloid-burden genetics.
  - reference: PPR:PPR1263744
    reference_title: "Brain-region-aware genetic prioritization separates Alzheimer disease risk from APOE-sensitive β-amyloid burden in public genetic and expression quantitative trait locus resources"
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "CEACAM16-AS1 led cortex, frontal cortex BA9, anterior cingulate BA24, and hippocampus, whereas BIN1 led cerebellum"
    explanation: Multi-region eQTL analysis (cortex, frontal cortex BA9, anterior cingulate BA24, hippocampus, cerebellum) confirms BIN1 as the lead gene in cerebellum, establishing brain-region-specific eQTL support.
  - reference: PPR:PPR1263744
    reference_title: "Brain-region-aware genetic prioritization separates Alzheimer disease risk from APOE-sensitive β-amyloid burden in public genetic and expression quantitative trait locus resources"
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "BIN1 is the strongest broad AD-risk anchor and has external disease-state expression support."
    explanation: Integrated analysis across eQTL, colocalization, MetaBrain, and disease-state expression layers converges on BIN1 as the primary non-APOE AD-risk architecture anchor.
  - reference: PPR:PPR1263744
    reference_title: "Brain-region-aware genetic prioritization separates Alzheimer disease risk from APOE-sensitive β-amyloid burden in public genetic and expression quantitative trait locus resources"
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "BIN1 was testable in 10 region-dataset pairs across GSE5281 and GSE48350 and showed four nominally signiﬁcant AD–control differences, all of which survived FDR correction."
    explanation: Disease-state expression analysis supports altered BIN1 expression in Alzheimer disease post-mortem brain tissue, validating the genetic risk association with disease-relevant molecular change.
  - reference: PMID:24162737
    reference_title: "Meta-analysis of 74,046 individuals identifies 11 new susceptibility loci for Alzheimer's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the already known, GWAS-defined genes (ABCA7, BIN1, CD33, CLU, CR1, CD2AP, EPHA1"
    explanation: The IGAP genome-wide association meta-analysis (74,046 individuals) lists BIN1 among the established GWAS-defined late-onset Alzheimer disease susceptibility genes, providing peer-reviewed foundational support for the BIN1 risk association beyond the eQTL preprint.
- name: TREM2
  gene_term:
    preferred_term: TREM2
    term:
      id: hgnc:17761
      label: TREM2
  association: Risk Factor
  subtype: Late-Onset Alzheimer's Disease
  notes: Microglial receptor that influences disease-associated microglial phenotypes, phagocytosis, and immune responses to Aβ pathology.
- name: NLRP3
  gene_term:
    preferred_term: NLRP3
    term:
      id: hgnc:16400
      label: NLRP3
  association: Genetic Variant
  notes: Encodes the NLRP3 inflammasome sensor in microglia that drives IL-1β production, pyroptosis, and neuroinflammation in response to Aβ and tau aggregates.
- name: PYCARD
  gene_term:
    preferred_term: PYCARD
    term:
      id: hgnc:16608
      label: PYCARD
  association: Genetic Variant
  notes: Encodes ASC (apoptosis-associated speck-like protein containing a CARD), the inflammasome adaptor required for NLRP3 signaling and IL-1β maturation.
- name: LRP1
  gene_term:
    preferred_term: LRP1
    term:
      id: hgnc:6692
      label: LRP1
  association: Genetic Variant
  notes: Low-density lipoprotein receptor-related protein 1, mediates Aβ clearance across the blood-brain barrier. Variants and reduced expression impair Aβ efflux.
environmental:
- name: Cumulative exposure to strong central anticholinergic medication
  exposure_term:
    preferred_term: exposure to muscarinic antagonist
    term:
      id: ECTO:9001824
      label: exposure to muscarinic antagonist
  description: >-
    Years of cumulative exposure to CNS-penetrant muscarinic antagonists —
    first-generation antihistamines such as diphenhydramine, tricyclic
    antidepressants, bladder antimuscarinics, and antiparkinson
    anticholinergics — is associated with incident dementia and Alzheimer
    disease in a dose-dependent manner across several large observational
    cohorts. Curated as a candidate modifiable risk factor, NOT as an
    established cause; see notes and the attached discussions.
  evidence:
  - reference: PMID:25621434
    reference_title: "Cumulative use of strong anticholinergics and incident dementia: a prospective cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common anticholinergic classes used were tricyclic antidepressants, first-generation antihistamines, and bladder antimuscarinics."
    explanation: >-
      Identifies the drug classes constituting the exposure, including the
      first-generation antihistamines of which diphenhydramine is the exemplar.
  - reference: PMID:40707785
    reference_title: "Systemic medications and dementia risk: a systematic umbrella review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "moderate certainty of increased risk with anticholinergics"
    explanation: >-
      A GRADE-rated umbrella review across 68 meta-analyses places the
      anticholinergic-dementia association at moderate certainty, the current
      ceiling for this exposure.
  - reference: PMID:11570937
    reference_title: Cognitive and other adverse effects of diphenhydramine use in hospitalized older patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Diphenhydramine administration in older hospitalized patients is associated with an increased risk of cognitive decline and other adverse effects with a dose-response relationship."
    explanation: >-
      Establishes drug-specific, dose-responsive acute cognitive harm from
      diphenhydramine — the well-supported near-term effect, distinct from the
      contested long-term dementia claim.
  - reference: PMID:42250644
    reference_title: "Second-Generation H1-Antihistamines Do Not Alter Dementia Risk in Type 2 Inflammatory Diseases: A Target Trial Emulation Using Real-World Data."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Across all comparisons, no increased dementia risk was observed for users of any AH versus non-AH controls."
    explanation: >-
      A propensity-matched target trial emulation finds no dementia signal for
      antihistamines, including first-generation agents, which argues against
      the antihistamine arm of this exposure. PARTIAL rather than REFUTE for
      three reasons: it is a null in an indication cohort (chronic urticaria,
      chronic sinusitis, allergic rhinitis) rather than in the general older
      population this exposure describes; the exposure covers all strong
      central anticholinergics, not antihistamines alone; and TriNetX records
      dispensing-linked EHR data, so it shares the over-the-counter blind spot
      this entry's notes hold against the prescription databases.
  influences_mechanisms:
  - target: Muscarinic M1 Receptor Signaling Loss
    environmental_effect: PREDISPOSES
    causal_link_type: DIRECT
    description: >-
      Chronic anticholinergic exposure is the pharmacologic route by which M1
      muscarinic signaling is persistently withdrawn, the state the mouse work
      links to accelerated amyloid and tau pathology. PREDISPOSES rather than
      TRIGGERS: the human evidence is observational, dose-dependent, and does
      not establish that the exposure initiates disease.
    evidence:
    - reference: PMID:25621434
      reference_title: "Cumulative use of strong anticholinergics and incident dementia: a prospective cohort study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A 10-year cumulative dose-response relationship was observed for dementia and Alzheimer disease"
      explanation: >-
        Cumulative-dose dependence is the signature expected if sustained
        receptor blockade, rather than transient pharmacologic effect, is what
        matters.
    - reference: PMID:32878992
      reference_title: Association of anticholinergic medications and AD biomarkers with incidence of MCI among cognitively normal older adults.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "aCH+ participants had increased risk of progression to MCI"
      explanation: >-
        Anticholinergic exposure predicts incident MCI in cognitively normal
        adults, with the effect amplified by APOE4 and CSF AD pathology —
        interaction with AD biology rather than an independent cognitive effect.
  notes: >-
    Curated deliberately as PREDISPOSES, not as an established cause. Three
    findings keep it there. First, no randomized evidence: the Cochrane review
    of anticholinergic deprescribing found very low certainty evidence that can
    neither support nor refute a cognitive benefit of stopping these drugs
    (PMID:38063254). Second, class specificity: the large UK studies
    concentrate the signal in antidepressant, urological and antiparkinson
    drugs (PMID:29695481, PMID:31233095), and a propensity-matched target trial
    emulation finds no antihistamine signal (PMID:42250644). Third, the one
    large cohort reporting an antihistamine dose-response reports it for
    second-generation agents too (PMID:38935035), which do not meaningfully
    enter the CNS. That third point cuts both ways and should not be quoted as
    a failed negative control: the gradient is steeper for the
    first-generation, CNS-penetrant class (1.13/1.29/1.51 across rising
    cumulative dose versus 1.11/1.19/1.26 for second-generation), which is
    concordant with a central mechanism; it is the residual non-null
    second-generation signal, not the comparison between the classes, that the
    muscarinic mechanism fails to account for.
    IMPORTANT COUNTERWEIGHT, from the CPRD full text rather than its abstract:
    the antihistamine null there is weaker than it looks. Antihistamines were
    tested and were not significant on any-prescription exposure, but the
    authors report a tentative effect above 365 defined daily doses, describe
    the overall antihistamine association as small and short of their
    significance threshold, state that over-the-counter supply is not captured
    in the database so antihistamine use is underestimated, and call for
    independent confirmation specifically for antihistamines. Since
    diphenhydramine is predominantly an over-the-counter drug, exposure
    measures built from prescriptions systematically undercount precisely the
    exposure of interest, so the antihistamine nulls are substantially nulls of
    exposure misclassification rather than clean refutations. The claim that
    survives all of this unambiguously is the acute one (PMID:11570937), which
    is why diphenhydramine is listed as potentially inappropriate in older
    adults regardless of how the dementia question resolves.
diagnosis:
- name: Neuropsychological Tests
  notes: Assess cognitive function including memory, language, and problem-solving.
  evidence:
  - reference: PMID:23072720
    reference_title: "Neuropsychology of Alzheimer's disease."
    supports: SUPPORT
    snippet: A comprehensive neuropsychological examination encompassing several cognitive domains can provide a pattern of altered and preserved functions that is helpful to early detection, differential diagnosis and even prognosis of progression in predementia stages.
    explanation: The article mentions that neuropsychological tests encompass several cognitive domains, which include memory, language, and problem-solving.
  - reference: PMID:29851873
    reference_title: "Bedside Approach to the Mental Status Assessment."
    supports: SUPPORT
    snippet: The focused history and mental status examination remain essential tools for the evaluation and diagnosis of neurologic disorders affecting cognition, language, and behavior.
    explanation: The article highlights the importance of mental status examinations, which are part of neuropsychological tests, in assessing cognitive functions including memory, language, and behavior.
  - reference: PMID:37244373
    reference_title: "Association between dual-task function and neuropsychological testing in older adults with cognitive impairment."
    supports: SUPPORT
    snippet: The results demonstrate significant correlations between UEF cognitive score and mini-mental state examination (MMSE), Mini-Cog, Category fluency, Benson complex figure copy, Trail making test, and Montreal cognitive assessment (MOCA).
    explanation: The study shows that neuropsychological tests like MMSE, Mini-Cog, and others are used to assess cognitive functions, which include memory, language, and problem-solving.
  - reference: PMID:35308911
    reference_title: "Cognitive Function Characterization Using Electronic Health Records Notes."
    supports: SUPPORT
    snippet: Assessing cognitive impairment is important for diagnostic, clinical management, and research purposes. The Folstein Mini-Mental State Examination (MMSE) is the most common screening measure of cognitive function.
    explanation: The article supports the use of neuropsychological tests, such as the MMSE, for assessing cognitive functions including memory, language, and problem-solving.
- name: Brain Imaging
  notes: MRI and PET scans to detect brain changes such as shrinkage and amyloid plaques.
  evidence:
  - reference: PMID:22173295
    reference_title: "Brain imaging in the study of Alzheimer's disease."
    supports: SUPPORT
    snippet: Brain imaging researchers have contributed to the scientific understanding, early detection and tracking of AD. ... They have developed ground-breaking methods, including positron emission tomography (PET) ligands to measure fibrillar amyloid-β (Aβ) deposition, new magnetic resonance imaging (MRI) pulse sequences, and powerful image analysis techniques
    explanation: The literature supports the use of MRI and PET scans for detecting brain changes such as shrinkage and amyloid plaques in Alzheimer's Disease.
  - reference: PMID:33640881
    reference_title: "Evaluating the association between brain atrophy, hypometabolism, and cognitive decline in Alzheimer's disease: a PET/MRI study."
    supports: SUPPORT
    snippet: Glucose metabolism reduction and brain volume losses are widely reported in Alzheimer's disease (AD). ... The AD group had significantly reduced volume in the hippocampus and DMN regions (P < 0.001) relative to that of normal controls determined by using ROI analysis.
    explanation: The literature supports the use of brain imaging techniques like MRI and PET to detect brain changes such as shrinkage and amyloid plaques in Alzheimer's Disease.
  - reference: PMID:34127752
    reference_title: "In vivo multi-parametric manganese-enhanced MRI for detecting amyloid plaques in rodent models of Alzheimer's disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Amyloid plaques are a hallmark of Alzheimer's disease (AD) that develop in its earliest stages. Thus, non-invasive detection of these plaques would be invaluable for diagnosis and the development and monitoring of treatments.
    explanation: The literature supports the use of MRI and PET scans for detecting amyloid plaques in Alzheimer's Disease.
  - reference: PMID:18694837
    reference_title: "Multitracer PET imaging of amyloid plaques and neurofibrillary tangles in Alzheimer's disease."
    supports: SUPPORT
    snippet: Recently developed positron emission tomography (PET) tracers, such as PIB and FDDNP, help to visualize amyloid plaques and neurofibrillary tangles in living subjects.
    explanation: The literature supports the use of PET scans to detect amyloid plaques and neurofibrillary tangles in Alzheimer's Disease.
- name: Cerebrospinal Fluid Analysis
  notes: Measurement of amyloid-beta, total tau, and phosphorylated tau levels.
  evidence:
  - reference: PMID:19661632
    reference_title: "Cerebrospinal fluid biomarkers for Alzheimer's disease."
    supports: SUPPORT
    snippet: The core candidate CSF biomarkers Abeta42, total tau (T-tau), and phosphorylated tau (P-tau) have been shown to have a high diagnostic performance to identify AD also in the early phase of the disease.
    explanation: This reference explicitly mentions the use of amyloid-beta, total tau, and phosphorylated tau levels in cerebrospinal fluid for diagnosing Alzheimer's disease.
  - reference: PMID:12975285
    reference_title: "Total tau and phosphorylated tau 181 levels in the cerebrospinal fluid of patients with frontotemporal dementia due to P301L and G272V tau mutations."
    supports: SUPPORT
    snippet: Total tau, Ptau-181, and amyloid-beta1-42 levels in CSF, obtained by lumbar puncture, were determined by sandwich enzyme-linked immunosorbent assay.
    explanation: This study evaluates levels of total tau, phosphorylated tau 181, and amyloid-beta in the cerebrospinal fluid of patients with Alzheimer's disease, supporting the statement.
  - reference: PMID:36510321
    reference_title: "Antibody-free measurement of cerebrospinal fluid tau phosphorylation across the Alzheimer's disease continuum."
    supports: SUPPORT
    snippet: Alzheimer's disease is characterized by an abnormal increase of phosphorylated tau (pTau) species in the CSF.
    explanation: This reference supports the statement by discussing the increase of phosphorylated tau in cerebrospinal fluid in Alzheimer's disease.
  - reference: PMID:37924152
    reference_title: "Clinical and biological relevance of glial fibrillary acidic protein in Alzheimer's disease."
    supports: SUPPORT
    snippet: Brain amyloid was strongly associated with plasma GFAP and ptau-181 and to a lesser extent with plasma NfL.
    explanation: This study shows the association of brain amyloid and phosphorylated tau-181 with Alzheimer's disease, supporting the use of these markers in CSF analysis.
  - reference: PMID:32929646
    reference_title: "Amyloid, tau and risk of Alzheimer's disease: a Mendelian randomization study."
    supports: SUPPORT
    snippet: Plasma amyloid species, CSF total tau and phosphorylated tau181 were not associated with Alzheimer's disease.
    explanation: While this study finds no association with Alzheimer's disease, it still measures total tau and phosphorylated tau181 in cerebrospinal fluid, supporting the statement about the measurement.
  - reference: PMID:35841250
    reference_title: "Elecsys Cerebrospinal Fluid Assays Accurately Distinguish Alzheimer's Disease from Frontotemporal Lobar Degeneration."
    supports: SUPPORT
    snippet: CSF diagnostic assays for the differentiation of AD and FTLD may increase diagnostic accuracy.
    explanation: This reference supports the statement by discussing the use of cerebrospinal fluid diagnostic assays for Alzheimer's disease, which include measurements of amyloid-beta and tau proteins.
  - reference: PMID:38431278
    reference_title: "CSF Biomarkers in Longitudinal Alzheimer Disease Cohorts: Pre-Analytic Challenges."
    supports: SUPPORT
    snippet: Levels of amyloid beta 1-42 (Abeta42), phosphorylated tau 181 (pTau181), and total tau (tTau) were obtained using an Elecsys cobas e 601 platform.
    explanation: This reference supports the statement by discussing the measurement of amyloid-beta, total tau, and phosphorylated tau levels in cerebrospinal fluid.
- name: Blood-Based Biomarkers (plasma p-tau217)
  notes: >-
    Minimally invasive plasma assays now approach the accuracy of amyloid-PET and
    CSF for detecting AD pathology, greatly expanding access to biomarker-based
    diagnosis. Plasma phosphorylated-tau 217 (p-tau217) and the p-tau217/Aβ42
    ratio are the strongest performers for classifying amyloid status and
    predicting progression; the plasma Aβ42/40 ratio shows the earliest
    detectable abnormalities. In May 2025 the first blood test for brain amyloid
    (a p-tau217/β-amyloid 1-42 ratio) received FDA approval. Blood biomarkers
    complement — and are increasingly used to triage before — CSF and PET testing,
    which remains relevant given that anti-amyloid immunotherapies require
    confirmed amyloid positivity.
  evidence:
  - reference: PMID:32722745
    reference_title: "Discriminative Accuracy of Plasma Phospho-tau217 for Alzheimer Disease vs Other Neurodegenerative Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among 1402 participants from 3 selected cohorts, plasma P-tau217 discriminated AD from other neurodegenerative diseases, with significantly higher accuracy than established plasma- and MRI-based biomarkers, and its performance was not significantly different from key CSF- or PET-based measures."
    explanation: >-
      Plasma p-tau217 discriminates AD from other neurodegenerative diseases with
      accuracy exceeding other blood/MRI biomarkers and comparable to CSF/PET,
      supporting its use as a blood-based diagnostic biomarker.
  - reference: PMID:32722745
    reference_title: "Discriminative Accuracy of Plasma Phospho-tau217 for Alzheimer Disease vs Other Neurodegenerative Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To examine plasma tau phosphorylated at threonine 217 (P-tau217) as a diagnostic biomarker for AD."
    explanation: >-
      Establishes plasma p-tau217 (tau phosphorylated at threonine 217) as the
      diagnostic biomarker evaluated in this study.
treatments:
- name: Cholinesterase Inhibitors
  description: Medications that slow the breakdown of acetylcholine to help with memory and cognitive function (e.g., donepezil, rivastigmine).
  evidence:
  - reference: PMID:24807367
    reference_title: "[Acetylcholinesterase inhibitors for treatment of Alzheimer's disease]."
    supports: SUPPORT
    snippet: Donepezil, galantamine and rivastigmine are commonly used AChEIs in pharmacotherapy for AD, slowing the progression and controlling the symptoms of AD.
    explanation: The literature supports that cholinesterase inhibitors, including donepezil and rivastigmine, are used to help with symptoms of Alzheimer's disease by slowing the progression and controlling cognitive symptoms.
  - reference: PMID:28671413
    reference_title: "Alzheimer Disease: Pharmacologic and Nonpharmacologic Therapies for Cognitive and Functional Symptoms."
    supports: SUPPORT
    snippet: Cholinesterase inhibitors, memantine, and a combination of a cholinesterase inhibitor and memantine have produced statistically significant but clinically small delays in various domains of cognitive and functional decline in select patients with Alzheimer disease.
    explanation: The literature supports the use of cholinesterase inhibitors in delaying cognitive decline in Alzheimer's disease.
  - reference: PMID:35608903
    reference_title: "Withdrawal or continuation of cholinesterase inhibitors or memantine or both, in people with dementia."
    supports: SUPPORT
    snippet: Two classes of drug - cholinesterase inhibitors (donepezil, galantamine and rivastigmine) and memantine - are widely licensed for dementia due to Alzheimer's disease.
    explanation: The literature confirms that cholinesterase inhibitors are licensed for use in Alzheimer's disease to alleviate symptoms and delay disease progression.
  - reference: PMID:36412156
    reference_title: "[Capabilities of combined therapy of Alzheimer's disease]."
    supports: SUPPORT
    snippet: 'Currently approved medications are symptomatic and include two classes: cholinesterase inhibitors, such as donepezil, and NMDA receptor antagonist memantine.'
    explanation: The literature supports that cholinesterase inhibitors are approved symptomatic treatments for Alzheimer's disease.
  - reference: PMID:9108896
    reference_title: "Donepezil."
    supports: SUPPORT
    snippet: Donepezil is a specific and potent acetylcholinesterase inhibitor... Donepezil 5 or 10 mg/day was associated with significant improvements in cognitive function.
    explanation: The literature supports that donepezil, a cholinesterase inhibitor, helps improve cognitive function in Alzheimer's disease.
  treatment_term:
    preferred_term: cholinesterase inhibitor therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
- name: Anti-Amyloid Monoclonal Antibody Therapy
  description: >-
    Amyloid-beta-directed monoclonal antibodies (lecanemab, donanemab) are
    disease-modifying immunotherapies for early Alzheimer disease (mild cognitive
    impairment or mild dementia with confirmed amyloid pathology). They clear
    brain amyloid-beta and produce a modest slowing of cognitive and functional
    decline; use is limited by amyloid-related imaging abnormalities (ARIA) and
    infusion reactions, and requires amyloid confirmation plus MRI monitoring.
  therapeutic_modality: MONOCLONAL_ANTIBODY
  evidence:
  - reference: PMID:36449413
    reference_title: "Lecanemab in Early Alzheimer's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lecanemab, a humanized IgG1 monoclonal antibody that binds with high affinity to Aβ soluble protofibrils, is being tested in persons with early Alzheimer's disease."
    explanation: Identifies lecanemab as an amyloid-beta protofibril-directed monoclonal antibody developed for early Alzheimer disease.
  - reference: PMID:36449413
    reference_title: "Lecanemab in Early Alzheimer's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lecanemab reduced markers of amyloid in early Alzheimer's disease and resulted in moderately less decline on measures of cognition and function than placebo at 18 months but was associated with adverse events."
    explanation: Phase 3 CLARITY-AD trial (NCT03887455) shows lecanemab lowers amyloid burden and modestly slows cognitive/functional decline versus placebo, supporting the disease-modifying anti-amyloid immunotherapy class.

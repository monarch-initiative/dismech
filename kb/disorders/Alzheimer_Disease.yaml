- name: Muscarinic M1 Receptor Signaling Loss
  biological_scale: MOLECULAR
  description: >-
    Loss of signaling through the M1 muscarinic acetylcholine receptor, arising
    either from degeneration of basal forebrain cholinergic input or from
    sustained pharmacologic antagonism by anticholinergic drugs. M1 signaling
    tonically favors non-amyloidogenic ADAM17/alpha-secretase cleavage of APP

  - reference: PMID:36701017
    reference_title: "PSEN2 and ABCA7 variants causing early-onset preclinical pathological changes in Alzheimer's disease: a case report and literature review."
    supports: SUPPORT
    snippet: Early-onset AD (EOAD) was defined as AD occurring before age 65. Although it has a high genetic risk, EOAD due to PSEN2 variation is very rare.
    explanation: The reference supports the association of PSEN2 with early-onset Alzheimer's disease, although it notes that such cases are rare.
  - reference: PMID:32741831
    reference_title: "Early-Onset Familial Alzheimer Disease Variant PSEN2 N141I Heterozygosity is Associated with Altered Microglia Phenotype."
    supports: SUPPORT
    snippet: Early-onset familial Alzheimer disease (EOFAD) is caused by heterozygous variants in the presenilin 1 (PSEN1), presenilin 2 (PSEN2), and APP genes.
    explanation: The reference explicitly states that early-onset familial Alzheimer's disease can be caused by PSEN2 mutations.
- name: APOE
  gene_term:
    preferred_term: APOE
    term:
      id: hgnc:613
      label: APOE
  association: Risk Factor
  subtype: Late-Onset Alzheimer's Disease
  notes: >-
    APOE is the strongest common-variant genetic risk factor for late-onset
    Alzheimer's disease. The APOE4 allele increases risk and accelerates onset in
    a gene-dose-dependent manner (relative to the common APOE3), while APOE2 is
    protective. Beyond amyloid, APOE4 exacerbates tau-mediated neurodegeneration,
    neuroinflammation, glial lipid/cholesterol accumulation, and dysfunction of
    the blood-brain barrier. Rare protective coding variants illuminate mechanism
    and
    are therapeutic templates: APOE3 Christchurch (R136S) reduces receptor-binding
    avidity and limits tau seeding/spreading (a homozygous carrier resisted
    autosomal-dominant AD for ~3 decades despite heavy amyloid), and APOE3
    Jacksonville (V236E) reduces APOE self-aggregation and amyloid pathology.
    Preclinically, lowering APOE4 (e.g., with antisense oligonucleotides) reduces
    tau pathology, neurodegeneration, and neuroinflammation, motivating
    APOE-directed therapeutics. See the apoe_risk_modulation_model mechanistic
    hypothesis.
  evidence:
  - reference: PMID:28959956
    reference_title: "ApoE4 markedly exacerbates tau-mediated neurodegeneration in a mouse model of tauopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "APOE4 is the strongest genetic risk factor for late-onset Alzheimer disease."
    explanation: Establishes APOE4 as the leading genetic risk factor for late-onset AD.
  - reference: PMID:31686034
    reference_title: "Resistance to autosomal dominant Alzheimer's disease in an APOE3 Christchurch homozygote: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The individual had two copies of the APOE3 Christchurch (R136S) mutation, unusually high brain amyloid levels and limited tau and neurodegenerative measurements."
    explanation: >-
      The homozygous APOE3 Christchurch (R136S) variant is associated with
      resistance to autosomal-dominant AD despite high amyloid, evidence for a
      protective APOE variant acting on tau/neurodegeneration.
  - reference: PMID:34586832
    reference_title: "APOE3-Jacksonville (V236E) variant reduces self-aggregation and risk of dementia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice expressing APOE3-Jac have reduced amyloid pathology, plaque-associated immune responses, and neuritic dystrophy."
    explanation: >-
      The APOE3-Jacksonville (V236E) variant reduces APOE aggregation and amyloid
      pathology, a second protective APOE variant supporting APOE aggregation as a
      therapeutic target.
  - reference: PMID:33550655
    reference_title: "Apolipoprotein E4 Reduction with Antisense Oligonucleotides Decreases Neurodegeneration in a Tauopathy Model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We conclude that reducing ApoE4 levels should be explored further as a therapeutic approach for APOE4 carriers with tauopathy including Alzheimer's disease."
    explanation: >-
      APOE4-lowering antisense oligonucleotides reduce tau pathology,
      neurodegeneration, and neuroinflammation, supporting APOE as an actionable
      therapeutic node.
- name: BIN1
  gene_term:
    preferred_term: BIN1
    term:
      id: hgnc:1052
      label: BIN1
  association: Risk Factor
  subtype: Late-Onset Alzheimer's Disease
  notes: >-
    BIN1 encodes bridging integrator 1, a phosphoinositide-binding adaptor protein involved in membrane dynamics, endocytosis, and synaptic function. Identified as the strongest broad AD-risk anchor across blood and brain-region eQTL layers (whole blood, cortex, hippocampus, cerebellum). The locus shows distinct causal variants (H3-dominated colocalization) across tissues, indicating region-specific regulatory mechanisms rather than a single shared causal variant. Disease-state brain-expression support shows reduced BIN1 expression in Alzheimer disease versus control tissue.
  evidence:
  - reference: PPR:PPR1263744
    reference_title: "Brain-region-aware genetic prioritization separates Alzheimer disease risk from APOE-sensitive β-amyloid burden in public genetic and expression quantitative trait locus resources"
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "eQTLGen tested 16,875 genes for AD risk and identiﬁed 204 FDR-signiﬁcant genes, led by BIN1."
    explanation: eQTLGen blood eQTL analysis identified BIN1 as the lead AD-risk gene among 204 FDR-significant hits, establishing it as a primary genetic risk factor distinct from amyloid-burden genetics.
  - reference: PPR:PPR1263744
    reference_title: "Brain-region-aware genetic prioritization separates Alzheimer disease risk from APOE-sensitive β-amyloid burden in public genetic and expression quantitative trait locus resources"
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "CEACAM16-AS1 led cortex, frontal cortex BA9, anterior cingulate BA24, and hippocampus, whereas BIN1 led cerebellum"
    explanation: Multi-region eQTL analysis (cortex, frontal cortex BA9, anterior cingulate BA24, hippocampus, cerebellum) confirms BIN1 as the lead gene in cerebellum, establishing brain-region-specific eQTL support.
  - reference: PPR:PPR1263744
    reference_title: "Brain-region-aware genetic prioritization separates Alzheimer disease risk from APOE-sensitive β-amyloid burden in public genetic and expression quantitative trait locus resources"
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "BIN1 is the strongest broad AD-risk anchor and has external disease-state expression support."
    explanation: Integrated analysis across eQTL, colocalization, MetaBrain, and disease-state expression layers converges on BIN1 as the primary non-APOE AD-risk architecture anchor.
  - reference: PPR:PPR1263744
    reference_title: "Brain-region-aware genetic prioritization separates Alzheimer disease risk from APOE-sensitive β-amyloid burden in public genetic and expression quantitative trait locus resources"
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "BIN1 was testable in 10 region-dataset pairs across GSE5281 and GSE48350 and showed four nominally signiﬁcant AD–control differences, all of which survived FDR correction."
    explanation: Disease-state expression analysis supports altered BIN1 expression in Alzheimer disease post-mortem brain tissue, validating the genetic risk association with disease-relevant molecular change.
  - reference: PMID:24162737
    reference_title: "Meta-analysis of 74,046 individuals identifies 11 new susceptibility loci for Alzheimer's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the already known, GWAS-defined genes (ABCA7, BIN1, CD33, CLU, CR1, CD2AP, EPHA1"
    explanation: The IGAP genome-wide association meta-analysis (74,046 individuals) lists BIN1 among the established GWAS-defined late-onset Alzheimer disease susceptibility genes, providing peer-reviewed foundational support for the BIN1 risk association beyond the eQTL preprint.

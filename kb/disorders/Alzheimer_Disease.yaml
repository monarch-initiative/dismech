- name: Interneuron Dysfunction and Network Hypersynchrony
  biological_scale: TISSUE
  mechanism_confidence: PROVISIONAL
  description: >-
    Amyloid-beta impairs parvalbumin-expressing inhibitory interneurons, in part
    through reduced levels of Nav1.1 (SCN1A), the voltage-gated sodium channel
    subunit these cells depend on to fire at high frequency. Loss of
    parvalbumin-cell output degrades gamma oscillations and releases the network
    into hypersynchrony, producing epileptiform activity. In patients this appears
    as subclinical epileptiform discharges detectable in a large minority of people
    with Alzheimer disease who have never had a clinical seizure, and their
    presence tracks faster cognitive decline. The node models cognitive impairment
    as arising partly from failure of inhibition, not only from loss of excitatory
    synapses.

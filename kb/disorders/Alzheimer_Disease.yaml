- name: Microglial Lipid Droplet Accumulation
  biological_scale: CELLULAR
  role: amplifier
  mechanism_confidence: PROVISIONAL
  description: >-
    A distinct microglial state defined by accumulation of cytoplasmic lipid
    droplets. In the aging brain these lipid-droplet-accumulating microglia are
    defective in phagocytosis, generate high levels of reactive oxygen species and
    secrete proinflammatory cytokines. In Alzheimer disease the corresponding
    human state is marked by the lipid-droplet-associated enzyme ACSL1 and is most
    abundant in APOE4 homozygotes; fibrillar amyloid-beta induces it in an
    APOE-dependent manner, and factors secreted by these microglia phosphorylate
    tau and are neurotoxic. The state therefore couples the strongest common
    genetic risk factor to a specific, dysfunctional glial phenotype.

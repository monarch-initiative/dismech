  mechanisms:
  - Endocytic pathway activation with enlargement of Rab5-positive early endosomes
  - APP-βCTF binding to the v-ATPase V0a1 subunit and competitive inhibition of V1 assembly
  - Failure of autolysosome acidification and cathepsin activation
  - Intraneuronal amyloid-beta accumulation within de-acidified autolysosomes

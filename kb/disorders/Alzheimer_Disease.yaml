- category: Neurologic
  name: Seizures
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  frequency: OCCASIONAL
  notes: >-
    Usually non-motor and therefore easily missed. Clinically overt epilepsy is
    the visible fraction of a much larger network-hyperexcitability problem:
    extended EEG and MEG monitoring detects subclinical epileptiform activity in
    roughly 42% of patients with no seizure history, against about 10% of
    controls (PMID:27696483). Mechanistically linked to the Interneuron
    Dysfunction and Network Hypersynchrony node.
  evidence:
  - reference: PMID:23835471
    reference_title: "Seizures and epileptiform activity in the early stages of Alzheimer disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Epilepsies were most often complex partial seizures (47%) and more than half were nonconvulsive (55%)."
    explanation: >-
      Characterizes the seizure semiology in Alzheimer disease as predominantly
      complex partial and nonconvulsive, which is why the phenotype is
      under-recognized clinically.
  - reference: PMID:23835471
    reference_title: "Seizures and epileptiform activity in the early stages of Alzheimer disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with AD who had epilepsy presented with cognitive decline 5.5 years earlier than patients with AD who did not have epilepsy (64.8 vs 70.3 years; P = .001)."
    explanation: >-
      Associates the presence of epilepsy with earlier onset of cognitive decline.

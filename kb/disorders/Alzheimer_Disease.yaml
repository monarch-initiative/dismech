  - preferred_term: Memory impairment
    term:
      id: HP:0002354
      label: Memory impairment
  evidence:
  - reference: PMID:38356475
    reference_title: "The HOPE4MCI study: A randomized double-blind assessment of AGB101 for the treatment of MCI due to AD."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The estimated difference between arms is -0.10 (95% CI: -0.85, 0.58), which was not statistically significant."
    explanation: >-
      Negative on the primary endpoint (Clinical Dementia Rating Sum of Boxes) in
      an unselected population, which is the strongest single constraint on the
      claim that normalizing network activity is therapeutically actionable.
  - reference: PMID:38356475

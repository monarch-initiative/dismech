  notes: >-
    PROVISIONAL. The human evidence is strong for the endosomal lesion and its
    timing (Cataldo and colleagues, postmortem cohorts spanning preclinical
    disease) and for the βCTF/v-ATPase mechanism in human Down syndrome
    fibroblasts. It is much weaker for PANTHOS: the only verified human statement
    is that the pattern is present in Alzheimer brains, and the claim that such
    neurons are the principal source of plaques is scoped by its authors to
    amyloid precursor protein transgenic models, where APP is overexpressed. The
    PANTHOS phenotype and the v-ATPase mechanism come from the same laboratory and
    are not independent of each other. Note the negative result inside the human
    data: endosomes were of normal size in advanced presenilin-mutation familial
    disease, so this mechanism does not generalize across all Alzheimer genetic
    subtypes — which sits awkwardly beside the separate finding that PSEN1 is
    required for lysosomal acidification (PMID:20541250), curated on the
    Autophagy-Lysosomal Dysfunction node. See the attached CONTROVERSY discussion
    on plaque origin.
- name: Selective Vulnerability of RORB+ Entorhinal Excitatory Neurons
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Neuronal loss in Alzheimer disease is not uniform. Entorhinal cortex layer II
    excitatory neurons and locus coeruleus noradrenergic neurons degenerate first
    and disproportionately, and within the entorhinal cortex the vulnerable
    excitatory population is marked by RORB. These neurons are selectively
    susceptible to neurofibrillary inclusion and are depleted as pathology
    advances, while neighbouring populations in the same tissue are relatively
    spared. This node models cell-intrinsic vulnerability as a determinant of
    where the disease starts, which aggregate burden alone does not explain.

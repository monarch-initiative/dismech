      label: CDKN2A
  mechanisms:
  - Amyloid-beta-induced senescence of plaque-associated oligodendrocyte progenitor cells
  - Accumulation of p16INK4A-positive senescent glia in tauopathy
  - Senescence-associated secretory phenotype driving neuroinflammation
  consequences:
  - Neurofibrillary Tangle Formation
  - Neuroinflammation
  evidence:
  - reference: PMID:30232451
    reference_title: "Clearance of senescent glial cells prevents tau-dependent pathology and cognitive decline."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we show a causal link between the accumulation of senescent cells and cognition-associated neuronal loss."
    explanation: >-
      Genetic clearance of p16-positive cells as they arise prevents tau pathology
      and neuronal loss, establishing senescence as causal in this model.
  - reference: PMID:30936558
    reference_title: "Senolytic therapy alleviates Aβ-associated oligodendrocyte progenitor cell senescence and cognitive deficits in an Alzheimer's disease model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Senolytic treatment of AD mice selectively removed senescent cells from the plaque environment, reduced neuroinflammation, lessened Aβ load, and ameliorated cognitive deficits."
    explanation: >-
      Pharmacological rather than genetic clearance, in an amyloid rather than a
      tau model, reproducing the same set of benefits.
  - reference: PMID:30936558
    reference_title: "Senolytic therapy alleviates Aβ-associated oligodendrocyte progenitor cell senescence and cognitive deficits in an Alzheimer's disease model."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Direct exposure of cultured OPCs to aggregating Aβ triggered cell senescence."
    explanation: >-
      Identifies aggregating amyloid-beta as a sufficient senescence-inducing
      stimulus for oligodendrocyte progenitor cells, supplying the upstream trigger.
  - reference: PMID:35531351
    reference_title: "Profiling senescent cells in human brains reveals neurons with CDKN2D/p19 and tau neuropathology."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "More than 97% of the senescent cells were excitatory neurons and overlapped with tau-containing neurofibrillary tangles (NFTs)."
    explanation: >-
      Supports senescence being present in human Alzheimer brain and associated
      with tangles, while contradicting the glial cell-type assignment on which
      both mouse clearance experiments rest.
  - reference: PMID:30126037
    reference_title: "Tau protein aggregation is associated with cellular senescence in the brain."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Cdkn2a transcript level, a hallmark measure of senescence, directly correlated with brain atrophy and NFT burden in mice."
    explanation: >-
      Relates a canonical senescence marker quantitatively to both tangle burden
      and brain atrophy, tying this node to the tangle and neurodegeneration arms
      of the entry.
  downstream:
  - target: Neurofibrillary Tangle Formation
    description: >-
      Senescent cells are modeled as promoting tau hyperphosphorylation and tangle
      deposition; the direction is established by the inverse experiment, in which

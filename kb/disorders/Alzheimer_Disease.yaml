  - reference: DOI:10.64898/2026.07.20.26358345
    reference_title: "Eligibility for shingles vaccination and hospital-coded dementia in England and Wales: a regression discontinuity analysis in England"
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL

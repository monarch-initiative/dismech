- name: Tau-Directed Antisense Oligonucleotide Therapy
  description: >-
    Diranersen (BIIB080 / IONIS-MAPTRx) is an investigational, intrathecally
    administered antisense oligonucleotide that binds MAPT mRNA and recruits
    RNase H1 to degrade it, lowering production of both intracellular and
    extracellular tau. It is the first tau-lowering strategy to demonstrate
    target engagement in Alzheimer disease and represents a mechanistically
    distinct disease-modifying approach from the anti-amyloid antibodies:
    rather than clearing extracellular amyloid-beta, it reduces the tau
    substrate that hyperphosphorylates and aggregates into neurofibrillary
    tangles, the pathology most tightly correlated with cognitive decline. The
    phase 1b MAPTRx trial (NCT03186989) showed dose-dependent >50% mean
    reductions in CSF total-tau, and the phase 2 CELIA study (NCT05399888) in
    mild cognitive impairment / mild AD dementia used the Clinical Dementia
    Rating-Sum of Boxes (CDR-SB) as its primary endpoint. Per Biogen/Ionis
    topline results reported at AAIC 2026, CELIA reduced CSF total-tau by
    ~50-65% across doses and showed a slowing of clinical decline versus
    placebo, although it did not meet its primary endpoint; the FDA granted
    diranersen Fast Track designation in 2025.
  therapeutic_modality: ANTISENSE_OLIGONUCLEOTIDE
  aso_details:
    aso_mechanism: RNASE_H_KNOCKDOWN
    target_gene:
      preferred_term: MAPT
      term:
        id: hgnc:6893
        label: MAPT
    target_transcript: MAPT mRNA
    aso_chemistry: TWO_PRIME_O_METHOXYETHYL
    conjugation: UNCONJUGATED
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: diranersen
      term:
        id: NCIT:C1291
        label: Antisense Oligonucleotides
  evidence:
  - reference: PMID:37095250
    reference_title: "Tau-targeting antisense oligonucleotide MAPTRx in mild Alzheimer's disease: a phase 1b, randomized, placebo-controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We sought to inhibit MAPT expression with a tau-targeting antisense oligonucleotide (MAPTRx) and reduce tau levels in patients with mild AD."
    explanation: Phase 1b MAPTRx trial establishes diranersen as an antisense oligonucleotide that lowers tau by inhibiting MAPT expression in mild Alzheimer disease.
  - reference: PMID:37095250
    reference_title: "Tau-targeting antisense oligonucleotide MAPTRx in mild Alzheimer's disease: a phase 1b, randomized, placebo-controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Dose-dependent reduction in the CSF total-tau concentration was observed with greater than 50% mean reduction from baseline at 24 weeks post-last dose in the 60 mg (four doses) and 115 mg (two doses) MAPTRx groups."
    explanation: Demonstrates dose-dependent CSF total-tau lowering (target engagement) with MAPTRx, the pharmacodynamic basis for the tau-directed ASO approach.
  - reference: PMID:37095250
    reference_title: "Tau-targeting antisense oligonucleotide MAPTRx in mild Alzheimer's disease: a phase 1b, randomized, placebo-controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "randomized 3:1 to intrathecal bolus administrations of MAPTRx or placebo every 4 or 12 weeks during the 13-week treatment period"
    explanation: Documents the intrathecal (CSF) route of administration required for CNS delivery of the unconjugated ASO.
  target_mechanisms:
  - target: Neurofibrillary Tangle Formation
    treatment_effect: INHIBITS
    description: >-
      Diranersen indirectly inhibits this mechanism upstream rather than
      blocking aggregate assembly directly: RNase H1-mediated MAPT mRNA
      knockdown lowers the total tau available to become hyperphosphorylated and
      aggregate into neurofibrillary tangles.
- name: NMDA Receptor Antagonist
  description: Medication that regulates glutamate activity to improve symptoms (e.g., memantine).
  evidence:
  - reference: PMID:12768511
    reference_title: "[Memantine]."
    supports: SUPPORT
    snippet: Memantine, an antagonist of the glutamatergic NMDA receptor, has been recently approved for the treatment of advanced AD. Due to its action mechanism, memantine is considered a neuroprotective drug, whose utility has been demonstrated in preclinical studies, and a useful symptomatic treatment for AD and vascular dementia.
    explanation: The abstract confirms that memantine, an NMDA receptor antagonist, is used to treat Alzheimer's Disease by regulating glutamate activity.
  - reference: PMID:27662322
    reference_title: "Role of Glutamate and NMDA Receptors in Alzheimer's Disease."
    supports: SUPPORT
    snippet: Studies indicate that the distinct outcomes of NMDAR-mediated responses are induced by regionalized receptor activities, followed by different downstream signaling pathways. The activation of synaptic NMDARs initiates plasticity and stimulates cell survival. In contrast, the activation of extrasynaptic NMDARs promotes cell death and thus contributes to the etiology of AD, which can be blocked by an AD drug, memantine, an NMDAR antagonist that selectively blocks the function of extrasynaptic NMDARs.
    explanation: This abstract highlights that memantine, an NMDA receptor antagonist, helps in blocking the negative effects of excessive NMDAR activity in Alzheimer's Disease.
  - reference: PMID:20943326
    reference_title: "Targeting glutamate mediated excitotoxicity in Huntington's disease: neural progenitors and partial glutamate antagonist--memantine."
    supports: SUPPORT
    snippet: The hypothesis proposed is restoration of medium spiny neurons in Huntington's disease using neural progenitor cell implantation and attenuation of glutamate mediated excitotoxicity using a partial glutamate antagonist - Memantine. Memantine can block the NMDA receptors and will prevent excess calcium influx into the neurons decreases the vulnerability of medium spiny neurons to glutamate mediated excitotoxicity.
    explanation: Although primarily discussing Huntington's Disease, this abstract supports the idea that memantine, an NMDA receptor antagonist, regulates glutamate activity, which is relevant to Alzheimer's Disease treatment.

  - Amyloid Plaque Formation
  - Autophagy-Lysosomal Dysfunction
  evidence:
  - reference: PMID:10880397
    reference_title: "Endocytic pathway abnormalities precede amyloid beta deposition in sporadic Alzheimer's disease and Down syndrome: differential effects of APOE genotype and presenilin mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These results identify EP activation as the earliest known intraneuronal change to occur in sporadic AD, the most common form of AD."
    explanation: >-

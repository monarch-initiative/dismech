      snippet: "Our findings suggest a role for Aβ-induced OPC cell senescence in neuroinflammation and cognitive deficits in AD, and a potential therapeutic benefit of senolytic treatments."
      explanation: >-
        States the modeled edge from amyloid-induced progenitor senescence to
        neuroinflammation and cognitive deficit.
  notes: >-
    PROVISIONAL. All causal evidence is murine; the human evidence is a single
    postmortem observation of senescent oligodendrocyte progenitor cells plus a
    much larger transcriptomic survey that reaches a different cell-type answer.

    - reference: PMID:30232451
      reference_title: "Clearance of senescent glial cells prevents tau-dependent pathology and cognitive decline."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Collectively, these results show that senescent cells have a role in the initiation and progression of tau-mediated disease, and suggest that targeting senescent cells may provide a therapeutic avenue for the treatment of these pathologies."
      explanation: >-
        States the causal role of senescent cells in initiating and progressing
        tau-mediated disease.
  - target: Neuroinflammation
    description: >-
      The senescence-associated secretory phenotype is modeled as a chronic
      proinflammatory input to glial activation; senolytic clearance reduces
      neuroinflammation.
    hypothesis_groups:
    - cellular_senescence_model
    - neuroimmune_glial_amplification_model

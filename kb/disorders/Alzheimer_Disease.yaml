    reference_title: "Locus coeruleus volume and cell population changes during Alzheimer's disease progression: A stereological study in human postmortem brains with potential implication for early-stage biomarker discovery."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "As the Braak stage increases by 1 unit, the LC volume decreases by 8.4%."
    explanation: >-
      Quantifies stage-wise loss in a second selectively vulnerable population, the
      locus coeruleus. Partial for this node because the population is
      noradrenergic rather than the RORB+ entorhinal one named here.
  downstream:
  - target: Neurofibrillary Tangle Formation
    description: >-
      Cell-intrinsic vulnerability of RORB+ entorhinal excitatory neurons is
      modeled as determining where neurofibrillary inclusions first form, giving
      tau pathology its characteristic anatomical starting point.
    hypothesis_groups:
    - selective_neuronal_vulnerability_model
    - tau_neurodegeneration_model
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:33432193
      reference_title: "Molecular characterization of selectively vulnerable neurons in Alzheimer's disease."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Alzheimer's disease (AD) is characterized by the selective vulnerability of specific neuronal populations, the molecular signatures of which are largely unknown."
      explanation: >-
        States the selectivity premise while making explicit that the molecular
        basis is unknown, which is why this edge is curated with unknown
        intermediates.
  notes: >-
    PROVISIONAL as a mechanism, though the underlying observations are
    long-established and essentially uncontested as descriptions. RORB marks the
    vulnerable population; it has not been shown to cause the vulnerability, and no
    perturbation experiment has yet tested it. Two caveats worth carrying: the
    locus coeruleus data show a long gap between tangle accumulation and neuronal
    loss, so susceptibility to inclusion and susceptibility to death are separable
    properties; and the entorhinal cohort is small, as postmortem single-nucleus
    cohorts are. This node also supplies the population-level anchor that the
    HSV-1 Reactivation node depends on — that node's RORB+ glutamatergic neurons
    are selectively vulnerable independently of any viral claim.
- name: Necroptotic Neuronal Death
  biological_scale: CELLULAR
  role: effector
  mechanism_confidence: PROVISIONAL
  description: >-
    Neurons die by necroptosis — a caspase-independent, programmed form of
    necrosis in which RIPK1 and RIPK3 assemble a necrosome that phosphorylates and
    activates MLKL, which then permeabilizes the plasma membrane. Activated
    necrosome components are detectable in granulovacuolar degeneration bodies, a
    classical Alzheimer lesion that had no mechanistic account, and their regional
    burden is inversely correlated with neuronal density. The mechanism gives the
    entry an explicit terminal cell-death step, which the amyloid, tau, and
    synaptic nodes otherwise leave unstated.

      cognitive decline rather than at end stage, consistent with hyperexcitability
      being an early network event.
  downstream:
  - target: Memory Loss
    description: >-
      Loss of inhibitory control and network hypersynchrony are modeled as direct
      contributors to cognitive impairment; restoring Nav1.1 in a model reverses
      both the hypersynchrony and the memory deficit.
    hypothesis_groups:
    - network_hyperexcitability_model
    - synaptic_failure_convergence_model
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Degraded gamma oscillations and hippocampal-cortical network hypersynchrony.
    evidence:
    - reference: PMID:22541439
      reference_title: "Inhibitory interneuron deficit links altered network activity and cognitive dysfunction in Alzheimer model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Restoring Nav1.1 levels in hAPP mice by Nav1.1-BAC expression increased inhibitory synaptic activity and gamma oscillations and reduced hypersynchrony, memory deficits, and premature mortality."
      explanation: >-
        Gain-of-function rescue of a single interneuron channel subunit corrects
        oscillations, hypersynchrony and memory, establishing the edge as causal in
        this model.
    - reference: PMID:27696483
      reference_title: "Incidence and impact of subclinical epileptiform activity in Alzheimer's disease."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "However, patients with subclinical epileptiform activity showed faster declines in global cognition, determined by the Mini-Mental State Examination (3.9 points/year in patients with epileptiform activity vs 1.6 points/year in patients without; p = 0.006), and in executive function (p = 0.01)."
      explanation: >-
        Human correlate of the same edge: hyperexcitability is associated with more
        than twice the annual rate of cognitive decline.
  notes: >-
    PROVISIONAL. The mechanistic arm is entirely in amyloid precursor protein
    transgenic mice, and the human Nav1.1 limb is a postmortem protein-level
    observation reported within the same paper rather than an independent human
    study. The clinical association is prospective and blinded but small — 33
    patients at a single centre, mean age 62 and so skewed toward young-onset
    disease — and observational, so whether epileptiform activity accelerates
    decline or marks a more aggressive phenotype is unresolved; levetiracetam
    trials have been mixed. Curated separately from the synaptic-failure
    convergence account because it makes the opposite claim about what fails
    first: inhibition rather than excitation.
- name: Tau-Induced Nucleocytoplasmic Transport Failure
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Pathological tau binds nucleoporins of the nuclear pore complex and disrupts
    their structural and functional integrity, impairing nuclear import and export
    in both tau-transgenic mouse brain and human Alzheimer brain tissue. Nup98
    mislocalizes from the nuclear envelope into the cytoplasm of tangle-bearing
    neurons and, once there, accelerates tau aggregation in vitro — a feed-forward
    arrangement in which the transport lesion promotes the aggregation that caused
    it. The same Nup98 mislocalization is found across primary tauopathies and
    tracks regional tau burden.
  cell_types:
  - preferred_term: Neurons
    term:
      id: CL:0000540
      label: neuron
  biological_processes:
  - preferred_term: Nucleocytoplasmic transport
    modifier: DECREASED
    term:
      id: GO:0006913
      label: nucleocytoplasmic transport
  cellular_components:
  - preferred_term: Nuclear pore complex
    term:
      id: GO:0005643
      label: nuclear pore
  locations:
  - preferred_term: Cerebral Cortex
  - preferred_term: Hippocampus
  genes:
  - preferred_term: MAPT
    term:
      id: hgnc:6893
      label: MAPT
  - preferred_term: NUP98
    term:
      id: hgnc:8068
      label: NUP98
  mechanisms:
  - Direct binding of tau to nuclear pore complex nucleoporins
  - Impairment of nuclear import and export in tangle-bearing neurons
  - Cytoplasmic mislocalization of Nup98 and Nup98-facilitated tau aggregation
  consequences:
  - Neurofibrillary Tangle Formation
  evidence:
  - reference: PMID:30189209
    reference_title: "Tau Protein Disrupts Nucleocytoplasmic Transport in Alzheimer's Disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here, we show that tau can directly interact with nucleoporins of the nuclear pore complex (NPC) and affect their structural and functional integrity."
    explanation: >-
      Establishes the direct physical interaction between tau and nuclear pore
      complex components.
  - reference: PMID:30189209
    reference_title: "Tau Protein Disrupts Nucleocytoplasmic Transport in Alzheimer's Disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathological tau impairs nuclear import and export in tau-overexpressing transgenic mice and in human AD brain tissue."
    explanation: >-
      Demonstrates the functional transport deficit in human Alzheimer brain tissue
      as well as in the mouse model.
  - reference: PMID:36601621
    reference_title: "Altered localization of nucleoporin 98 in primary tauopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the occipital cortex, which is relatively spared from pathological tau accumulations in these primary tauopathies, the localization of nucleoporin 98 was not significantly altered."
    explanation: >-
      Regional internal control in human tissue: the nucleoporin lesion is absent
      where tau pathology is absent, tying it specifically to tau burden rather
      than to neurodegeneration generally.
  downstream:
  - target: Neurofibrillary Tangle Formation
    description: >-
      Nup98 mislocalized into the neuronal cytoplasm facilitates tau aggregation,
      closing a feed-forward loop in which tau-driven transport failure promotes
      further tau aggregation.
    hypothesis_groups:
    - tau_neurodegeneration_model
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Cytoplasmic Nup98 acting as an aggregation-promoting factor.
    evidence:
    - reference: PMID:30189209
      reference_title: "Tau Protein Disrupts Nucleocytoplasmic Transport in Alzheimer's Disease."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Furthermore, the nucleoporin Nup98 accumulates in the cell bodies of some tangle-bearing neurons and can facilitate tau aggregation in vitro."
      explanation: >-
        Supports the feed-forward edge from mislocalized Nup98 back onto tau
        aggregation.
  notes: >-
    PROVISIONAL. Unusually for a mechanism at this level of cell-biological
    detail, part of the primary dataset is human Alzheimer brain tissue rather
    than model systems alone, and the tauopathy follow-up is entirely human with a
    genuine regional negative control. What is not established is the causal
    contribution to neurodegeneration: the authors state only that the findings
    raise the possibility that nuclear pore dysfunction contributes to
    tau-induced neurotoxicity, and the mouse arm relies on tau overexpression. The
    two studies share a senior author, so they are not independent laboratories.

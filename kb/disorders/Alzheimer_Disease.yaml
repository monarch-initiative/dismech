  evidence:
  - reference: PMID:28758999
    reference_title: "Necroptosis activation in Alzheimer's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found that necroptosis was activated in postmortem human AD brains, positively correlated with Braak stage, and inversely correlated with brain weight and cognitive scores."
    explanation: >-
      Human postmortem evidence relating necroptosis activation to both
      pathological stage and clinical severity.
  - reference: PMID:31802237
    reference_title: "Necrosome complex detected in granulovacuolar degeneration is associated with neuronal loss in Alzheimer's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We demonstrated that all three activated necrosome components can be detected in GVD lesions (GVDn+, i.e. GVD with activated necrosome) in neurons, that they colocalize with classical GVD markers, such as pTDP-43 and CK1δ, and similarly to these markers detect GVD lesions."
    explanation: >-
      Localizes the complete activated necrosome to granulovacuolar degeneration
      bodies in human neurons, connecting the mechanism to an established lesion.
  - reference: PMID:31802237
    reference_title: "Necrosome complex detected in granulovacuolar degeneration is associated with neuronal loss in Alzheimer's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "GVDn + neurons inversely correlated with neuronal density in the early affected CA1 region of the hippocampus and in the late affected frontal cortex layer III."
    explanation: >-
      Relates necrosome burden to neuronal density in both an early- and a
      late-affected region, supporting the link to actual neuron loss.
  - reference: PMID:37708272
    reference_title: "MEG3 activates necroptosis in human neuron xenografts modeling Alzheimer's disease."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Down-regulation of MEG3 and inhibition of necroptosis using pharmacological or genetic manipulation of receptor-interacting protein kinase 1 (RIPK1), RIPK3, or mixed lineage kinase domain-like protein (MLKL) rescued neuronal cell loss in xenografted human neurons."
    explanation: >-
      Causal evidence: blocking three separate necroptosis effectors each rescues
      loss of human neurons in an amyloid-rich brain.
  - reference: PMID:32949047
    reference_title: "Necrosome-positive granulovacuolar degeneration is associated with TDP-43 pathological lesions in the hippocampus of ALS/FTLD cases."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Necrosome-positive GVD was primarily observed in hippocampal regions of ALS/FTLD cases and was associated with hippocampal TDP-43 inclusions as the main predictor of the pMLKL-GVD stage, as well as with the Braak stage of neurofibrillary tangle pathology."
    explanation: >-
      Establishes that necrosome-positive granulovacuolar degeneration is not
      specific to Alzheimer disease, so this node models a shared execution
      mechanism rather than a disease-defining lesion.
  downstream:
  - target: Neuroinflammation
    description: >-
      Necroptosis is lytic: unlike apoptosis it releases intracellular contents,
      so necroptotic neuronal death is modeled as feeding the glial inflammatory
      response rather than being silently cleared.
    hypothesis_groups:
    - necroptosis_model
    - neuroimmune_glial_amplification_model
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:28758999
      reference_title: "Necroptosis activation in Alzheimer's disease."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "In addition, we found that the set of genes regulated by RIPK1 overlapped significantly with multiple independent AD transcriptomic signatures, indicating that RIPK1 activity could explain a substantial portion of transcriptomic changes in AD."
      explanation: >-
        Supports RIPK1 activity shaping the broader Alzheimer transcriptional
        state, of which the inflammatory response is a major component. The
        specific edge to glial activation remains inferred, hence unknown
        intermediates.
  notes: >-
    PROVISIONAL. The human evidence is correlative and depends heavily on
    phospho-MLKL and phospho-RIPK immunodetection in postmortem tissue, where
    antibody specificity and postmortem interval are recognized problems. The
    causal arm comes from human neurons xenografted into a mouse amyloid brain,
    a system whose headline result is that mouse neurons in the same brain do not
    show the phenotype — evidence for human relevance, and a caution that rodent
    models may miss the death mechanism altogether. Relationship to the entry's
    PARP1-Mediated Parthanatos node is unresolved: both are caspase-independent
    regulated necrosis, and nothing establishes which dominates, or whether they
    operate in different cells or at different stages.
- name: Senescent Cell Accumulation
  biological_scale: CELLULAR
  role: amplifier
  mechanism_confidence: PROVISIONAL
  conforms_to: "cellular_senescence#Senescent Cell Accumulation"
  description: >-
    Cells that have entered an irreversible cell-cycle arrest but remain
    metabolically active accumulate in the aging and Alzheimer brain, expressing
    p16INK4A/CDKN2A and p21/CDKN1A and secreting a proinflammatory
    senescence-associated secretory phenotype. Clearing them — genetically or with
    senolytic drugs — prevents gliosis, tau hyperphosphorylation and tangle
    deposition, reduces amyloid load and neuroinflammation, and preserves
    cognition in mouse models. Which cell type is senescent is genuinely
    unresolved: mouse work implicates astrocytes and microglia in tauopathy and
    oligodendrocyte progenitor cells around plaques, while the largest human
    survey assigns over 97% of senescent cells to excitatory neurons.

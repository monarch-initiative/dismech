- name: Oligodendrocyte and Myelin Dysfunction
  biological_scale: TISSUE
  role: initiator
  mechanism_confidence: PROVISIONAL
  conforms_to: "cns_myelin_failure#Deficient or Unstable CNS Myelin Sheath"
  description: >-
    Age-related loss of myelin integrity and of oligodendrocyte metabolic support
    for the axon is modeled as an upstream contributor to amyloid deposition
    rather than a consequence of it. Myelin damage concentrates the amyloidogenic
    processing machinery within axonal swellings and increases cleavage of
    cortical amyloid precursor protein, while simultaneously diverting
    disease-associated microglia toward myelin debris and away from plaques — so
    one lesion both raises amyloid production and lowers its clearance. In APOE4
    carriers, cholesterol is aberrantly retained in oligodendrocytes and
    myelination is reduced, giving the strongest genetic risk factor a route
    through this cell type.

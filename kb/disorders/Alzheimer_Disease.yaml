- discussion_id: mismatch_ad_tcell_arm_not_inherited_risk
  prompt: >-
    Does the cytotoxic CD8+ T-cell arm that is functionally required for
    tau-mediated neurodegeneration in mouse tauopathy actually contribute to human
    Alzheimer disease, given that adaptive-immune/CD8/IFN-gamma/MHC-I genes carry
    no detectable inherited AD risk while innate-microglial genes dominate the
    human genetic-association signal?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Adaptive Immune T Cell Response to Tau Pathology
  rationale: >-
    In mouse tauopathy the adaptive CD8+ T-cell arm is functionally required —
    T-cell depletion, IFN-gamma/PD-1 inhibition, and cDC1 ablation are each
    neuroprotective (PMID:36890231, PMID:41890046) — yet human inherited AD risk
    shows no adaptive-immune signal. A gene-set enrichment of Alzheimer disease
    genetic-association targets from the Open Targets Platform (disease
    MONDO:0004975; the top 200 of 13,367 targets ranked by the genetic_association
    datatype score; retrieved and independently reproduced on 2026-07-11) finds a
    curated 35-gene innate-microglial set strongly over-represented (18/35 overlap;
    odds ratio 115.1; Fisher one-sided p = 1.79e-27; the overlap includes TREM2,
    PLCG2, INPP5D, ABCA7, BIN1, SORL1, CR1, CD33, APOE, CLU, MS4A6A, PICALM),
    while a 46-gene adaptive-immune/CD8/IFN-gamma/MHC-I set is not enriched at all
    (0/46 overlap; odds ratio 0.0; p = 1.0). The null adaptive signal is robust
    across top-N cutoffs (100-1000) and gene-background choices (19,000/20,000),
    and adaptive-immune genes are absent even from the top 2,000 ranked targets.
    This coheres with the published human-genetics consensus that microglia and
    innate immunity are the central inherited determinants of AD susceptibility
    (PMID:41888907) and that AD risk loci act specifically through microglial
    eQTLs (PMID:40670704). The mismatch is mechanistically meaningful: it implies
    the pathogenic adaptive T-cell arm — potent in mouse tauopathy — is most
    plausibly an acquired/downstream response to tau pathology rather than an
    upstream heritable driver of AD, reconciling the mouse functional data with the
    absence of adaptive-immune inherited risk and cohering with the model's own
    caveats (EBV-specific CSF TCRs, age-expanded antigen-independent virtual-memory
    CD8). Caveats: this is a coarse gene-set enrichment (not colocalization or
    fine-mapping); most AD GWAS are amyloid-weighted diagnosis studies whereas the
    model is tau-scoped; and the LD-complex MHC region may be under-represented at
    target-level association scores.
  proposed_experiments:
  - experiment_id: exp_ad_celltype_coloc_adaptive_vs_microglial
    name: Cell-type-resolved colocalization of AD GWAS loci with CD8 T-cell vs microglial QTLs
    description: >-
      Move beyond coarse enrichment to statistically colocalize Alzheimer disease
      GWAS loci with CD8+ T-cell versus microglial eQTL/caQTL maps, directly testing
      whether any adaptive-immune regulatory variants influence inherited AD risk
      rather than acting only downstream of established tau pathology.
    experiment_type:
      preferred_term: GWAS-QTL colocalization analysis
    assays:
    - preferred_term: expression quantitative trait locus colocalization
    - preferred_term: chromatin accessibility quantitative trait locus mapping
    readouts:
    - name: Adaptive-immune vs microglial colocalization signal
      target: pathophysiology#Adaptive Immune T Cell Response to Tau Pathology
      description: >-
        Number and posterior probability of AD loci colocalizing with CD8+ T-cell
        QTLs versus microglial QTLs.
      direction: POSITIVE
      interpretation: >-
        Robust colocalization of AD loci with CD8 T-cell QTLs would revise the
        downstream-only reading and support an inherited adaptive-immune
        contribution; continued microglia-exclusive colocalization would confirm the
        acquired/downstream interpretation of the T-cell arm.
  - experiment_id: exp_ad_tau_stratified_genetic_enrichment
    name: Tau-endophenotype-stratified genetic enrichment
    description: >-
      Repeat the adaptive-immune-vs-microglial enrichment against genetic-association
      scores derived from tau-PET or CSF-tau endophenotype GWAS rather than
      amyloid-weighted clinical-diagnosis GWAS, the fairer test of the tau-scoped
      model.
    experiment_type:
      preferred_term: gene-set enrichment analysis
    assays:
    - preferred_term: genome-wide association study
    readouts:
    - name: Adaptive-immune enrichment under tau-endophenotype GWAS
      target: pathophysiology#Adaptive Immune T Cell Response to Tau Pathology
      description: >-
        Odds ratio and significance of adaptive-immune gene-set enrichment when
        targets are ranked by tau-endophenotype genetic association.
      direction: POSITIVE
      interpretation: >-
        Emergence of adaptive-immune enrichment specifically under tau-endophenotype
        GWAS (absent under amyloid-weighted diagnosis GWAS) would indicate the
        coarse diagnosis-GWAS null understated a tau-specific inherited contribution.
  posed_date: "2026-07-11T00:00:00Z"
  notes: >-
    Seeded from a scoped OpenScientist code-execution deep-research run on
    adaptive_immune_tcell_model that queried the Open Targets Platform GraphQL API
    and computed the enrichment. The reported numbers (13,367 total targets; top-200
    genetic_association score range 0.461-0.954; first-15 targets PSEN1, APP, CR1,
    PSEN2, APOE, TREM2, PLCG2, MS4A6A, HFE, EPHA1, APH1B, ACE, H2BC4, BIN1, MPO;
    innate OR 115.1 p 1.79e-27; adaptive OR 0.0 p 1.0) were independently reproduced
    to the digit by re-running the same GraphQL query and Fisher exact test before
    curation. Query: disease(efoId ->MONDO_0004975) associatedTargets
    orderByScore:"genetic_association", top 200 with score > 0; background 20,000
    protein-coding genes; one-sided Fisher exact per gene set.
- discussion_id: mismatch_ad_ldir_dose_regimen_translation
  prompt: >-
    Do preclinical reports that low-dose ionizing radiation below 100 mSv, at
    selected doses and regimens, reduce Alzheimer-relevant amyloid burden and
    neuroinflammation or improve cognition in humans without delayed harm, and
    where does the response change from potentially protective to neurotoxic?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Amyloid Plaque Formation
  - pathophysiology#Neuroinflammation
  - pathophysiology#Synaptic Dysfunction
  - phenotype#Memory Loss
  rationale: >-
    A 2026 review describes potentially protective effects only at specific
    low-dose regimens and explicitly reports no consensus on the dual mechanisms,
    safety threshold, or long-term outcomes because of small samples, ethical
    constraints, and inter-model variability. The abstract synthesizes
    preclinical evidence and prospective applications rather than establishing a
    reproducible human Alzheimer disease response. This entry therefore does not
    assert a protective environmental edge or add low-dose-radiation mechanism
    nodes. A single descriptor modifier would also be misleading: modifiers encode
    one biological state, not a dose- and regimen-conditioned reversal of effect.
    If the response is later established, detrimental and protective arms should
    be represented separately with explicit exposure context and arm-specific
    evidence. The question is kept at entry level because the reported reduction
    in amyloid-beta deposition maps directly to the existing Alzheimer pathograph;
    a reusable hormesis module would require a conserved causal chain, a key
    conformance target, and validated recurrence across at least two disorders,
    none of which this single review establishes.
  evidence:
  - reference: PMID:42551708
    reference_title: "Low-dose ionizing radiation and cognitive function: evidence, mechanisms, and controversies."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Nevertheless, emerging evidence indicates that LDIR administered at specific doses and regimens may exert neuroprotective effects via hormesis: it reduces Aβ deposition, promotes anti-inflammatory microglial polarization, and enhances hippocampal neurogenesis, thereby ameliorating cognitive impairment.
    explanation: >-
      The review motivates the protective arm of the question but limits it to
      selected doses and regimens; it does not establish a human Alzheimer disease
      mechanism or a safe intervention threshold.
  - reference: PMID:42551708
    reference_title: "Low-dose ionizing radiation and cognitive function: evidence, mechanisms, and controversies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Constrained by ethical considerations, sample size limitations, and inter-model variability, no consensus has been reached regarding its dual mechanisms, safety thresholds, and long-term outcomes.
    explanation: >-
      Directly supports retaining this as an open model-to-human mismatch rather
      than asserting either a protective pathograph or a general hormesis module.
  proposed_experiments:
  - experiment_id: exp_ad_ldir_dose_regimen_translation
    name: Harmonized low-dose ionizing-radiation dose-response study
    description: >-
      Apply a harmonized absorbed-dose, dose-rate, radiation-quality, and
      fractionation matrix across human iPSC-derived hippocampal
      neuron-astrocyte-microglia cultures and an Alzheimer-relevant in vivo model,
      then compare the prespecified biomarker directions with longitudinal data
      from consented cohorts receiving clinically indicated imaging or occupational
      monitoring. Report absorbed dose in mGy for experimental systems and
      effective dose in mSv for human cohorts rather than treating the units as
      interchangeable. No participant should receive radiation solely for this study.
      Follow-up must be long enough to detect delayed neurocognitive or genotoxic
      harm rather than stopping at an acute adaptive response.
    experiment_type:
      preferred_term: harmonized cross-model dose-response study
    perturbations:
    - name: Low-dose ionizing-radiation dose and regimen matrix
      target: pathophysiology#Amyloid Plaque Formation
      exposure_term:
        preferred_term: exposure to ionizing radiation
        term:
          id: ECTO:7000047
          label: exposure to ionizing radiation
      description: >-
        Compare sham exposure with prespecified single and fractionated doses
        spanning an absorbed-dose range chosen to correspond to the review's
        below-100-mSv human exposure definition while holding radiation quality
        and dosimetry constant; include a higher-dose positive-control arm only in
        non-participant experimental systems, never in observational cohorts.
    readouts:
    - name: Amyloid-beta deposition response
      target: pathophysiology#Amyloid Plaque Formation
      description: >-
        Quantify soluble and deposited amyloid-beta across dose, dose-rate, and
        fractionation conditions and in longitudinal human biomarkers.
      assays:
      - preferred_term: amyloid-beta quantification
      direction: NEGATIVE
      interpretation: >-
        A replicated decrease confined to a defined low-dose window would support
        the proposed protective amyloid arm; a monotonic increase or failure to
        replicate would not.
    - name: Microglial inflammatory-state response
      target: pathophysiology#Neuroinflammation
      description: >-
        Measure microglial inflammatory-state markers, cytokines, and phagocytic
        function across the harmonized exposure matrix.
      assays:
      - preferred_term: single-cell transcriptomic profiling
      - preferred_term: cytokine profiling
      direction: NEGATIVE
      interpretation: >-
        Reduced inflammatory signaling together with preserved phagocytic
        function would support an anti-inflammatory arm; a transient marker shift
        without functional benefit would not.
    - name: Synaptic and cognitive outcome
      target: pathophysiology#Synaptic Dysfunction
      description: >-
        Measure synaptic plasticity and network activity in experimental systems
        and longitudinal cognitive change in the observational human cohorts.
      assays:
      - preferred_term: electrophysiological recording
      - preferred_term: neuropsychological assessment
      direction: NEGATIVE
      interpretation: >-
        Molecular changes count as neuroprotective only if they accompany improved
        or preserved synaptic function and a concordant human cognitive direction.
    - name: Delayed oxidative and genotoxic injury
      target: pathophysiology#Oxidative Stress
      description: >-
        Measure persistent oxidative stress, DNA damage, and delayed neuronal or
        cognitive injury after the acute response window.
      assays:
      - preferred_term: DNA damage assay
      - preferred_term: oxidative stress biomarker profiling
      direction: POSITIVE
      interpretation: >-
        Delayed injury at a nominally protective dose would refute a net-benefit
        interpretation even if acute amyloid or inflammatory markers improve.
    controls:
    - name: Sham-exposed matched controls
      description: >-
        Isogenic cultures and matched animals handled identically without
        ionizing-radiation exposure, plus unexposed comparison participants for
        the observational cohorts.
    - name: Dosimetry and regimen controls
      description: >-
        Match radiation quality, absorbed dose, dose rate, fractionation, age, and
        disease stage as closely as each system permits, and publish the conversion
        assumptions, so a unit or regimen difference is not misread as a species
        effect.
    decision_criterion: >-
      Promote an Alzheimer-specific protective arm only if a preregistered
      non-monotonic dose-response is independently replicated, improves amyloid,
      inflammatory, and synaptic outcomes without delayed harm, and shows a
      directionally concordant human signal. Define separate harmful and
      protective exposure-mechanism links only after their dose and regimen
      boundaries are supported; do not infer a clinical safety threshold from
      model-system data alone.
  posed_date: "2026-08-08T00:00:00Z"
  notes: >-
    Scope resolution for GitHub issue 8135: entry-level structured uncertainty was
    chosen over asserted mechanism nodes or a cross-disease hormesis module.
- discussion_id: mismatch_m1_antagonism_mouse_vs_human_anticholinergic_exposure
  prompt: >-
    Does chronic exposure to the non-selective anticholinergic drugs used by
    older adults reproduce, in the human brain, the acceleration of amyloid and
    tau pathology that M1-selective antagonism and M1 ablation produce in
    transgenic mouse models?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Muscarinic M1 Receptor Signaling Loss
  rationale: >-
    The mechanistic case that anticholinergic burden is disease-modifying rather
    than merely symptom-masking rests on mouse work that differs from human
    exposure in three ways. (1) Receptor selectivity: dicyclomine and the
    M1(-/-) allele isolate M1, whereas diphenhydramine, tricyclics and
    oxybutynin block M1-M5 and, in the antihistamine case, H1 as well — so the
    human exposure engages targets whose net effect on APP processing is not
    established, and the mouse result cannot simply be scaled up. (2) Baseline
    pathology: the mouse experiments manipulate M1 against a pre-existing
    transgenic amyloid/tau burden, so they demonstrate acceleration of ongoing
    pathology, not initiation in a healthy brain, which is what the
    population-level risk claim requires. (3) CNS exposure: the human
    epidemiology assigns risk by dispensing records, not by brain receptor
    occupancy, and the one large antihistamine cohort finds a dose-response for
    second-generation agents that do not appreciably cross the blood-brain
    barrier, alongside a steeper one for first-generation agents that do
    (1.13/1.29/1.51 versus 1.11/1.19/1.26 across rising cumulative dose). The
    between-class ordering is what a CNS-penetration-dependent mechanism
    predicts; what it does not predict is that the second-generation arm is
    non-null at all, and distinguishing residual confounding by indication from
    a genuine peripheral or non-muscarinic contribution needs measured central
    occupancy rather than dispensing proxies. Resolving this determines whether
    reducing anticholinergic burden is a prevention strategy or only good
    symptomatic geriatric practice.
  proposed_experiments:
  - experiment_id: exp_anticholinergic_occupancy_biomarker_cohort
    name: Muscarinic occupancy and AD biomarker trajectory under chronic anticholinergic exposure
    description: >-
      Follow cognitively normal older adults initiating chronic CNS-penetrant
      anticholinergics, matched initiators of peripherally restricted or
      second-generation comparators, and non-users, with serial plasma and CSF
      amyloid and phospho-tau measures and amyloid/tau PET. Quantify actual
      central muscarinic receptor occupancy in a subset by PET rather than
      inferring CNS exposure from dispensing data, and test whether biomarker
      trajectory tracks occupancy rather than prescription class.
    experiment_type:
      preferred_term: prospective biomarker cohort study with receptor occupancy imaging
    assays:
    - preferred_term: muscarinic receptor positron emission tomography
    - preferred_term: amyloid positron emission tomography
    - preferred_term: tau positron emission tomography
    - preferred_term: cerebrospinal fluid biomarker profiling
    - preferred_term: plasma biomarker profiling
    readouts:
    - name: Amyloid trajectory versus central muscarinic occupancy
      target: pathophysiology#Muscarinic M1 Receptor Signaling Loss
      description: >-
        Rate of change in amyloid PET signal and plasma amyloid-beta 42/40
        modeled against measured central muscarinic occupancy, with prescription
        class as a competing predictor.
      assays:
      - preferred_term: amyloid positron emission tomography
      - preferred_term: plasma amyloid-beta 42/40 measurement
      direction: POSITIVE
      interpretation: >-
        Amyloid accumulation scaling with measured central occupancy would
        support the muscarinic mechanism in humans; accumulation tracking
        prescription class irrespective of occupancy would instead implicate
        confounding by indication.
- discussion_id: controversy_anticholinergic_dementia_reverse_causation_class_specificity
  prompt: >-
    Is the observed association between cumulative anticholinergic exposure and
    incident dementia causal, or is it produced by reverse causation and
    confounding by indication — and why is the signal concentrated in drug
    classes other than the antihistamines?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Muscarinic M1 Receptor Signaling Loss
  rationale: >-
    The evidence is genuinely conflicting rather than merely thin. Supporting a
    causal reading: a cumulative dose-response in a prospective cohort with the
    most recent 12 months of exposure excluded (PMID:25621434); persistence of
    the association in windows 5-20 years before diagnosis (PMID:31233095); a
    dose-response that survives an active comparator, with bladder
    anticholinergics carrying higher dementia risk than mirabegron in patients
    who all have overactive bladder (PMID:41066055); and interaction with APOE4
    and CSF AD pathology rather than an APOE-independent effect (PMID:32878992).
    Against it: prodromal dementia causes insomnia, depression and urinary
    urgency, which are these drugs' indications, and the Richardson analysis
    explicitly names this as an alternative reading of its own result
    (PMID:29695481); the class distribution is wrong for a shared muscarinic
    mechanism, since gastrointestinal anticholinergics were null while
    antidepressant, urological and antiparkinson drugs were not; the largest
    antihistamine-specific cohort finds a non-null dose-response even for
    second-generation agents that lack meaningful CNS penetration
    (PMID:38935035, though its gradient is steeper for the first-generation
    class, 1.13/1.29/1.51 versus 1.11/1.19/1.26, so the between-class ordering
    is concordant with a central mechanism and only the non-null
    second-generation arm is anomalous); a propensity-matched target trial emulation finds no
    antihistamine signal (PMID:42250644); an inhaled peripherally restricted
    antimuscarinic shows an effect of questionable clinical importance and a
    null as-treated estimate (PMID:40388132); and the only randomized test,
    deprescribing, is uninformative (PMID:38063254). A third position is that
    the antihistamine-specific nulls are not informative either way. The CPRD
    full text reports that antihistamines were non-significant on
    any-prescription exposure but showed a tentative effect above 365 defined
    daily doses, that only about 0.3% of the sample reached that exposure on
    prescription, that over-the-counter supply is invisible to the database so
    antihistamine use is underestimated, and that the antihistamine result
    needs independent confirmation. Because diphenhydramine is largely bought
    over the counter, every prescription-database study in this literature is
    weakest exactly where the public question is strongest, and the two studies
    that do capture antihistamine exposure directly disagree with each other
    (PMID:38935035 positive and dose-dependent, PMID:42250644 null). Curation
    consequence: the exposure is recorded as PREDISPOSES, and the entry should
    not be strengthened to a causal claim on observational evidence alone —
    nor weakened to "refuted for antihistamines" on the strength of nulls drawn
    from data that cannot see the exposure.
  proposed_experiments:
  - experiment_id: exp_anticholinergic_deprescribing_dementia_rct
    name: Long-horizon anticholinergic deprescribing trial with dementia endpoints
    description: >-
      Randomize older adults with high anticholinergic burden and no cognitive
      impairment to structured deprescribing with non-anticholinergic
      substitution versus usual care, powered for incident MCI and dementia over
      at least five years rather than the one-to-three-month cognitive test
      outcomes of existing trials. Stratify by APOE4 and baseline amyloid status,
      and include a prespecified negative-control arm substituting a
      peripherally restricted agent, so that a null result can distinguish "no
      causal effect" from "insufficient CNS exposure contrast".
    experiment_type:
      preferred_term: randomized controlled deprescribing trial
    assays:
    - preferred_term: neuropsychological assessment
    - preferred_term: amyloid positron emission tomography
    - preferred_term: plasma biomarker profiling
    readouts:

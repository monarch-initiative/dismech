- name: Complement-Mediated Microglial Synapse Elimination
  biological_scale: CELLULAR
  role: amplifier
  mechanism_confidence: PROVISIONAL
  description: >-
    Microglia actively engulf and remove structurally intact synapses after those
    synapses are tagged by the classical complement cascade. C1q binds
    perisynaptic membranes, C3 opsonizes the synapse, and microglia engage it
    through complement receptor 3 (CR3, the ITGAM/ITGB2 heterodimer). This is the
    same pathway that prunes surplus synapses during normal development,
    reactivated in the adult brain. Both soluble amyloid-beta oligomers and
    phosphorylated tau drive it, so it is a point at which the two proteinopathies
    converge on one cellular execution step. Because synapse loss is the
    pathological change that correlates best with cognitive decline, this node
    supplies the cellular mechanism that the Synaptic Dysfunction node otherwise
    leaves implicit.

- name: Glymphatic Clearance Failure
  description: >-
    Failure of the sleep-dependent perivascular (glymphatic) route by which
    cerebrospinal fluid exchanges with interstitial fluid and carries
    interstitial amyloid-beta out of the brain. This is a clearance arm distinct
    from the transcytotic blood-brain-barrier / LRP1 efflux route modeled in
    Vascular Dysfunction: it operates along perivascular spaces and depends on
    perivascular polarization of astroglial aquaporin-4, which is lost in aged
    and Alzheimer brains independently of age. Reduced clearance raises the
    steady-state interstitial amyloid-beta concentration and so feeds amyloid
    plaque formation rather than replacing it.

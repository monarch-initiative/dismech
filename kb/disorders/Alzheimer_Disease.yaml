      treatment trial and bridging to the zoster-vaccine evidence (VZV
      included).
  - reference: PMID:41779765
    reference_title: "Antiviral Treatment of Herpes Simplex Virus Decreases the Risk of Alzheimer's Disease and Dementia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "significantly reduced the risk of AD (RR 0.87; 95% CI 0.73-0.92) and dementia"
    explanation: >-
      Propensity-matched TriNetX retrospective cohort (231,277 matched pairs)
      finds antiviral therapy for oral/mucocutaneous HSV associated with lower
      subsequent risk of AD (RR 0.87) and dementia (RR 0.83). A second
      observational prevention-side signal; confounding by indication and
      healthy-user bias cannot be excluded.

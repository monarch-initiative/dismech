- name: Adaptive Immune T Cell Response to Tau Pathology
  description: >-
    Downstream of tau pathology and microglial activation, clonally expanded
    T cells — predominantly CD8+ cytotoxic T cells — infiltrate the brain in a
    spatiotemporal pattern that tracks tau (not amyloid) pathology and correlates
    with neuronal loss. Microglia are required to recruit these T cells; once in
    the parenchyma the cells shift from activated toward exhausted states with
    restricted TCR clonality, and IFN-gamma/PD-1 signaling amplifies
    neurodegeneration. Depletion of T cells (or of microglia) is neuroprotective
    in tauopathy models, and IFN-gamma or PD-1 blockade reduces brain atrophy,
    identifying the adaptive immune response as an active, druggable contributor
    to tau-driven neurodegeneration rather than a bystander.

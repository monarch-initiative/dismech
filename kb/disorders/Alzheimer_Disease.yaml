- name: Neuronal Endosomal-Lysosomal Acidification Failure
  biological_scale: CELLULAR
  role: initiator
  mechanism_confidence: PROVISIONAL
  description: >-
    Activation and enlargement of Rab5-positive early endosomes is the earliest
    recognized intraneuronal change in sporadic Alzheimer disease, present in
    neocortical pyramidal neurons at preclinical stages and, in Down syndrome,
    decades before classical neuropathology. The APP beta-C-terminal fragment
    (APP-βCTF) — not amyloid-beta itself — binds the v-ATPase V0a1 subunit and
    competitively blocks assembly of the V1 subcomplex, so autolysosomes fail to
    acidify and cathepsins are not activated. Amyloid-beta then accumulates inside
    enlarged, de-acidified autolysosomes; in the most compromised neurons these
    vacuoles pack into perikaryal rosettes (the PANTHOS pattern) before lysosomal
    membrane permeabilization kills the cell. This node therefore models amyloid
    pathology as beginning inside the neuron.
  conforms_to: "disabled_macroautophagy#Failure of Cytoplasmic Quality Control"
  cell_types:
  - preferred_term: Neurons
    term:
      id: CL:0000540
      label: neuron
  - preferred_term: Pyramidal neuron
    term:
      id: CL:0000598
      label: pyramidal neuron

    explanation: Size of the largest published series, which includes the founding family.
pathophysiology:
- name: Loss of Muscle-Specific FXR1 Isoforms
  description: >-
    Cardiac and skeletal muscle express FXR1P isoforms P82 and P84 that contain
    exon 15, while other tissues express shorter isoforms that skip it. The
    CMYO9B variants are frameshifts at the 5' end of exon 15, so the muscle
    isoforms lose most of their exon-15 sequence while the ubiquitous isoforms
    are untouched, which fits the restriction of disease to muscle. In a mouse
    5' exon-15 frameshift (dupA) the mutant transcript was reduced to about 31%
    of control and little P82/P84 protein remained. The biopsy of the founding
    family lacked the mutant-protein granules seen with the 3' allele that
    causes CMYO9A, which the authors attribute to low P82/P84 expression.
    Protein levels have not been measured in CMYO9B patient muscle.

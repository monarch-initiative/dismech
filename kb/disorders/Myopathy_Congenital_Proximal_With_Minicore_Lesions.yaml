differential_diagnoses:
- name: Myopathy, congenital, with respiratory insufficiency and bone fractures (CMYO9A)
  disease_term:
    preferred_term: congenital myopathy 9A
    term:
      id: MONDO:0032936
      label: myopathy, congenital, with respiratory insufficiency and bone fractures
  description: >-
    The allelic FXR1 disorder caused by a 3' exon-15 frameshift that escapes
    nonsense-mediated decay and produces aggregating mutant protein. It
    presents with reduced fetal movement, severe neonatal hypotonia, long-bone
    fractures and respiratory failure, with death in infancy.
  distinguishing_features:
  - Long-bone fractures and death in infancy in CMYO9A; survival into adulthood in CMYO9B
  - 3' exon-15 allele producing insoluble mutant-protein granules in CMYO9A; 5' exon-15 alleles in CMYO9B
  evidence:
  - reference: PMID:35393337
    reference_title: "FXR1-related congenital myopathy: expansion of the clinical and genetic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic pathogenic variants in FXR1 have recently been associated with two congenital myopathy phenotypes: a severe form associated with hypotonia, long bone fractures, respiratory insufficiency and infantile death, and a milder form characterised by proximal muscle weakness with survival into adulthood."
    explanation: Contrasts the two FXR1 phenotypes.

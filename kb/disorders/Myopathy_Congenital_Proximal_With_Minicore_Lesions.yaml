name: Myopathy Congenital Proximal With Minicore Lesions
creation_date: "2026-10-27T14:45:00Z"
category: Mendelian
synonyms:
- Congenital myopathy 9B, proximal, with minicore lesions
- CMYO9B
- MYOPMIL
- FXR1-related congenital myopathy
description: >-
  Autosomal recessive congenital myopathy caused by homozygous frameshift
  variants at the 5' end of FXR1 exon 15, the 81-nucleotide exon that is
  spliced only into the muscle-specific FXR1P isoforms P82 and P84. Patients
  have neonatal hypotonia and delayed gross motor milestones, followed by
  slowly progressive neck and proximal limb-girdle weakness with survival into
  adulthood. Serum creatine kinase is normal, EMG is myopathic, and muscle MRI
  shows diffuse atrophy with relative sparing of the quadriceps femoris.
  Respiratory involvement (obstructive sleep apnea, respiratory insufficiency
  needing BiPAP) is variable even between patients homozygous for the same
  variant. Muscle biopsy shows multi-minicores, type 1 fiber predominance and
  increased internal nuclei. Facial, extraocular and cardiac muscles have been
  spared in every reported patient. Eight patients from four families have
  been reported.

classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
notes: >-
  Kept separate from Multiminicore_Disease, which covers the RYR1- and
  SELENON-related forms: MONDO places this term directly under congenital
  myopathy, with its own OMIM number (618823) and causal gene. No GeneReviews
  chapter covers FXR1. Normal serum creatine kinase is a consistent feature
  and helps separate this disorder from muscular dystrophies. Cardiac function
  was normal in every patient, although P82/P84 are the main FXR1 isoforms in
  heart and Fxr1 loss causes cardiac defects in mouse and zebrafish models;
  the founding study notes that a cardiac effect cannot be excluded. All three
  siblings of one family had psychiatric diagnoses (depression, bipolar
  disorder, anxiety, attention deficit disorder); the authors state that the
  link to FXR1 needs further study, so these are not annotated. Bilateral
  cryptorchidism was reported in a single patient and is not annotated.

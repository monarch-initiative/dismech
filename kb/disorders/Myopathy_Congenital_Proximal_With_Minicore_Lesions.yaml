genetic:
- name: FXR1
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_term:
    preferred_term: FXR1
    term:
      id: hgnc:4023
      label: FXR1
  notes: >-
    Reported CMYO9B alleles (XM_005247813.3), all homozygous frameshifts at the
    5' end of exon 15: c.1707delA p.(Lys569Asnfs*57) in the founding
    Argentinian/Turkish family; c.1707dupA p.(Pro570Thrfs*7) in an unrelated
    British and a Spanish family; c.1699dupG p.(Glu567Glyfs*10) in a
    consanguineous Turkish family. No homozygotes for these alleles are listed
    in gnomAD. The 3' exon-15 frameshift c.1764_1767delACAG p.(Arg588Serfs*37)
    causes the lethal sibling disorder CMYO9A (MONDO:0032936), not this one.
    No ClinGen gene-disease validity record for FXR1 is present in the
    reference cache.
  evidence:
  - reference: PMID:30770808
    reference_title: "Recessive mutations in muscle-specific isoforms of FXR1 cause congenital multi-minicore myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In family 2 we applied WES to four members of the family (the three affected siblings and the mother), which revealed a homozygous single nucleotide deletion also in exon-15 of FXR1 (XM_005247813.3: c.1707delA (delA); p.Lys569Asnfs*57) in all three affected siblings."
    explanation: First CMYO9B allele, in the founding family.
  - reference: PMID:35393337
    reference_title: "FXR1-related congenital myopathy: expansion of the clinical and genetic spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition to detailed clinical descriptions of patients with previously reported p.Lys569Asnfs*57 FXR1 variants, we report three patients from two families with a novel homozygous p.Pro570Thrfs*7 variant and two siblings with a novel homozygous p.Glu567Glyfs*10 variant."
    explanation: Two further CMYO9B alleles in three further families.
animal_models:
- name: Fxr1 exon-15 dupA knock-in mouse
  species: Mus musculus
  genotype: Fxr1 NM_001113188.1:c.1766dupA p.(Pro590Alafs*10) homozygous
  description: >-
    CRISPR-generated 5' exon-15 frameshift predicted to undergo nonsense-mediated
    decay. Viable, with mildly reduced body weight, smaller fibers, more central
    nuclei, type 1 fiber predominance, Z-line irregularities and only sporadic
    cores.
  publication: PMID:30770808
  modeled_mechanisms:
  - target: Loss of Muscle-Specific FXR1 Isoforms
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: Nearly complete loss of P82/P84 protein in muscle from a 5' exon-15 frameshift.
    limitations: >-
      The mouse allele is not one of the human alleles, and whether the human
      5' frameshifts also trigger nonsense-mediated decay has not been
      measured in patient muscle.
    evidence:
    - reference: PMID:30770808
      reference_title: "Recessive mutations in muscle-specific isoforms of FXR1 cause congenital multi-minicore myopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This demonstrated a marked decrease in the levels of FXR1P isoforms in dupA mice, with just a faint band corresponding to the dupA P82,84 molecular weight detectable in the soluble fraction of muscle extracts."
      explanation: Muscle-isoform loss in the dupA line.
  - target: Multi-Minicore Lesion Formation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Z-line irregularities and occasional Z-streaming, but cores are only sporadic.
    limitations: >-
      Cores are rare in this line, whereas multi-minicores are present in every
      patient biopsy.
    evidence:
    - reference: PMID:30770808
      reference_title: "Recessive mutations in muscle-specific isoforms of FXR1 cause congenital multi-minicore myopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "NADH-TR histochemistry identified areas with no enzymatic activity (cores) in multiple delACAG fibers, while cores were very sporadically detected in dupA mice."
      explanation: Cores are sporadic in dupA muscle.
- name: Fxr1 exon-15 delACAG knock-in mouse
  species: Mus musculus
  genotype: Fxr1 NM_001113188.1:c.1764_1767delACAG p.(Arg588Serfs*37) homozygous
  description: >-
    Orthologue of the human CMYO9A allele. Viable, lean and weak, with reduced
    bone mineral density and a multicore myopathy with central nuclei and type
    1 fiber predominance; mutant P82/P84 collect in insoluble mRNA-containing
    granules.
  publication: PMID:30770808
  modeled_mechanisms:
  - target: Multi-Minicore Lesion Formation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Multiple cores with Z-band disintegration and absent oxidative activity.
    limitations: >-
      The allele is the 3' frameshift of the lethal sibling disorder CMYO9A, not
      a CMYO9B allele, and adds a mutant-protein granule pathology not seen in
      CMYO9B muscle.
    evidence:
    - reference: PMID:30770808
      reference_title: "Recessive mutations in muscle-specific isoforms of FXR1 cause congenital multi-minicore myopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "DelACAG mice reproduced the effect of the human mutation on the protein and demonstrated pathologic features very similar to those of family 2 patients, specifically muscle atrophy, multicore lesions, central nuclei and type I fiber predominance."
      explanation: The authors compare the mouse pathology directly with the CMYO9B family.
  - target: Myofiber Atrophy and Type 1 Fiber Predominance
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reduced fiber size, central nuclei and strong type 1 fiber predominance.
    limitations: >-
      CMYO9A allele rather than a CMYO9B allele; the mouse phenotype is milder
      than human CMYO9A, which is lethal in infancy.
    evidence:
    - reference: PMID:30770808
      reference_title: "Recessive mutations in muscle-specific isoforms of FXR1 cause congenital multi-minicore myopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Relative frequency of type I fibers in the soleus was 43.3% in wt, 90.4% in delACAG and 53.3% in dupA mutants (Fig. 4a–e)."
      explanation: Type 1 fiber predominance in both exon-15 lines, strongest in delACAG.

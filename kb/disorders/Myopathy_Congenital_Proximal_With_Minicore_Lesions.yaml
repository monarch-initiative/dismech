- name: Disrupted FXR1-Mediated Translational Repression at the Z-Line
  description: >-
    Wild-type P82/P84 sit immediately adjacent to Z-lines and at costameres.
    FXR1P is proposed to hold specific structural mRNAs in a translationally
    repressed state there, as shown for desmoplakin and talin2 in heart, where
    Fxr1 loss raised both proteins and disrupted costamere architecture. The
    authors of the founding study propose that deregulated translation of
    Z-line mRNAs underlies the minicores; the specific skeletal-muscle target
    mRNAs have not been identified.

    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "ER export of procollagen was inefficient and that ER tubules were dilated"
    explanation: Fibroblast microscopy shows the COPII-dependent procollagen export defect underlying CCS2.
  downstream:

name: Cole-Carpenter syndrome
category: Mendelian
creation_date: "2026-07-11T15:00:00Z"
synonyms:
- Cole-Carpenter syndrome
- CCS
- Bone fragility-craniosynostosis-proptosis-hydrocephalus syndrome
- Cole-Carpenter syndrome 1
- Cole-Carpenter syndrome 2
description: >
  Cole-Carpenter syndrome (CCS) is an extremely rare Mendelian skeletal dysplasia
  in the osteogenesis imperfecta spectrum, characterized by severe bone fragility
  with recurrent fractures, craniosynostosis, ocular proptosis, hydrocephalus,
  growth failure, and distinctive craniofacial features (frontal bossing, midface
  hypoplasia, and micrognathia). It is genetically heterogeneous: Cole-Carpenter
  syndrome 1 (CCS1) is caused by heterozygous (autosomal dominant) missense
  variants in P4HB, which encodes protein disulfide isomerase (PDI/PDIA1), while
  Cole-Carpenter syndrome 2 (CCS2) is caused by biallelic (autosomal recessive)
  variants in SEC24D, a component of the COPII protein-export machinery. Both
  genetic forms converge on defective type I collagen biosynthesis and secretion,
  producing a common osteogenesis-imperfecta-like skeletal phenotype.

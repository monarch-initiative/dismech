    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "CCS mice exhibited reduced circulating levels of procollagen type I N-terminal propeptide (PINP I), indicating decreased type I collagen biosynthesis."
    explanation: The mouse model shows reduced PINP, a direct biomarker of decreased type I collagen biosynthesis.
  - reference: PMID:42425402

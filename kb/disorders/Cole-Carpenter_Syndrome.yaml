genetic:
- name: P4HB
  association: Disease-causing germline variant (CCS1)
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: P4HB
    term:
      id: hgnc:8548
      label: P4HB
  features: >
    P4HB encodes protein disulfide isomerase (PDI/PDIA1), a multifunctional
    endoplasmic reticulum enzyme required for oxidative protein folding, including
    type I collagen maturation. The recurrent CCS1 variant p.Tyr393Cys lies in the
    C-terminal disulfide isomerase domain and impairs PDI enzymatic activity.
  evidence:
  - reference: PMID:25683117
    reference_title: "Cole-Carpenter syndrome is caused by a heterozygous missense mutation in P4HB."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cole-Carpenter syndrome is caused by a specific de novo mutation in P4HB that impairs the disulfide isomerase activity of PDI."
    explanation: This directly establishes P4HB (PDI) loss of disulfide isomerase activity as the cause of CCS1.
  - reference: PMID:42425402
    reference_title: "Generation of a P4hb(Y393C) mouse model of cole-carpenter syndrome and therapeutic proof-of-concept."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic variants in P4HB, encoding protein disulfide isomerase A1 (PDIA1), represent the most frequent cause of CCS."
    explanation: P4HB is the most frequent causative gene for Cole-Carpenter syndrome.
- name: SEC24D
  association: Disease-causing germline variant (CCS2)
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: SEC24D
    term:
      id: hgnc:10706
      label: SEC24D
  features: >
    SEC24D encodes a cargo-selective subunit of the COPII vesicle coat that
    packages secretory cargo, including procollagen, for export from the
    endoplasmic reticulum. Biallelic SEC24D variants impair COPII-dependent
    procollagen export and cause the recessive CCS2 form.
  evidence:
  - reference: PMID:25683121
    reference_title: "Mutations in SEC24D, encoding a component of the COPII machinery, cause a syndromic form of osteogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we report three mutant alleles in SEC24D, a gene encoding a component of the COPII complex involved in protein export from the ER"
    explanation: SEC24D is a COPII protein-export gene whose mutation causes the syndromic osteogenesis imperfecta underlying CCS2.
pathophysiology:
- name: P4HB/PDI disulfide isomerase dysfunction
  description: >
    In CCS1, the P4HB p.Tyr393Cys variant sits in the C-terminal disulfide
    isomerase domain of PDI, close to the enzymatic center, and reduces disulfide
    isomerase activity. Because PDI mediates oxidative folding in the endoplasmic
    reticulum, the defect perturbs ER proteostasis and provokes ER stress.
  genes:
  - preferred_term: P4HB
    term:
      id: hgnc:8548
      label: P4HB
  biological_processes:
  - preferred_term: protein folding
    modifier: DECREASED
    term:
      id: GO:0006457
      label: protein folding
  - preferred_term: response to endoplasmic reticulum stress
    modifier: INCREASED
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  evidence:
  - reference: PMID:25683117
    reference_title: "Cole-Carpenter syndrome is caused by a heterozygous missense mutation in P4HB."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutation was located in the C-terminal disulfide isomerase domain of PDI, sterically close to the enzymatic center, and affected disulfide isomerase activity in vitro."
    explanation: The CCS1 variant impairs PDI disulfide isomerase activity, the proximal molecular defect.
  - reference: PMID:25683117
    reference_title: "Cole-Carpenter syndrome is caused by a heterozygous missense mutation in P4HB."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Skin fibroblasts showed signs of increased endoplasmic reticulum stress"
    explanation: Patient fibroblasts show increased ER stress downstream of impaired PDI function.
  downstream:
  - target: Defective type I collagen biosynthesis
    description: PDI dysfunction and ER stress impair oxidative folding needed for type I collagen production.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: SEC24D/COPII-dependent procollagen ER export failure
  description: >
    In CCS2, biallelic SEC24D variants disrupt the COPII coat that loads
    procollagen into transport vesicles, so procollagen export from the
    endoplasmic reticulum becomes inefficient and ER tubules dilate.

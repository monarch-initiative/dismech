has_subtypes:
- name: CCS1
  display_name: Cole-Carpenter syndrome 1 (P4HB)
  subtype_term:
    preferred_term: Cole-Carpenter syndrome 1
    term:
      id: MONDO:0007204
      label: Cole-Carpenter syndrome 1
  description: >
    Autosomal dominant form caused by a recurrent heterozygous missense variant in
    P4HB (protein disulfide isomerase, PDI). The two individuals of the original
    Cole-Carpenter description both carried the same P4HB c.1178A>G (p.Tyr393Cys)
    variant, arising de novo in one and inherited from a mosaic unaffected father
    in the other.
  genes:
  - preferred_term: P4HB
    term:
      id: hgnc:8548
      label: P4HB
  evidence:
  - reference: PMID:25683117
    reference_title: "Cole-Carpenter syndrome is caused by a heterozygous missense mutation in P4HB."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The two unrelated individuals had the same heterozygous missense mutation in exon 9 of P4HB"
    explanation: Whole-exome sequencing of the two originally described individuals identified the recurrent heterozygous P4HB missense variant defining CCS1.
- name: CCS2
  display_name: Cole-Carpenter syndrome 2 (SEC24D)
  subtype_term:
    preferred_term: Cole-Carpenter syndrome 2
    term:
      id: MONDO:0014573
      label: Cole-Carpenter syndrome 2
  description: >
    Autosomal recessive form caused by biallelic (compound heterozygous) variants
    in SEC24D, a component of the COPII complex that mediates procollagen export
    from the endoplasmic reticulum. Reported patients present with a
    Cole-Carpenter-like phenotype of disturbed skull ossification, prenatal-onset
    fractures, short stature, and craniofacial malformation.
  genes:
  - preferred_term: SEC24D
    term:
      id: hgnc:10706
      label: SEC24D
  evidence:
  - reference: PMID:30462379
    reference_title: "Japanese patient with Cole-carpenter syndrome with compound heterozygous variants of SEC24D."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We will report a patient with compound heterozygous variants of SEC24D causing Cole-Carpenter syndrome type 2."
    explanation: A compound-heterozygous SEC24D genotype produced Cole-Carpenter syndrome type 2, establishing SEC24D as the CCS2 gene.
  - reference: PMID:25683121
    reference_title: "Mutations in SEC24D, encoding a component of the COPII machinery, cause a syndromic form of osteogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three individuals from two families affected by a similar skeletal phenotype were each compound heterozygous for two of these mutant alleles"
    explanation: The foundational SEC24D cohort was biallelic (compound heterozygous), consistent with autosomal recessive inheritance of CCS2.
inheritance:
- name: Autosomal dominant inheritance (CCS1)
  description: >
    Cole-Carpenter syndrome 1 (P4HB) is inherited in an autosomal dominant manner;
    the recurrent P4HB p.Tyr393Cys variant occurs de novo or is transmitted from a
    mosaic carrier parent.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:25683117
    reference_title: "Cole-Carpenter syndrome is caused by a heterozygous missense mutation in P4HB."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In one individual, the P4HB mutation had arisen de novo, whereas in the other the mutation was transmitted from the clinically unaffected father who was a mosaic carrier of the variant."
    explanation: A heterozygous variant that is de novo or transmitted from a mosaic carrier indicates dominant action of the P4HB allele in CCS1.
- name: Autosomal recessive inheritance (CCS2)
  description: >
    Cole-Carpenter syndrome 2 (SEC24D) is inherited in an autosomal recessive
    manner, with affected individuals carrying biallelic (compound heterozygous)
    SEC24D variants.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:25683121
    reference_title: "Mutations in SEC24D, encoding a component of the COPII machinery, cause a syndromic form of osteogenesis imperfecta."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three individuals from two families affected by a similar skeletal phenotype were each compound heterozygous for two of these mutant alleles"
    explanation: Biallelic (compound heterozygous) SEC24D genotypes indicate autosomal recessive inheritance of CCS2.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >
    Cole-Carpenter syndrome is extremely rare, with only a small number of
    genetically confirmed cases reported worldwide across the two subtypes.
  evidence:
  - reference: PMID:30462379
    reference_title: "Japanese patient with Cole-carpenter syndrome with compound heterozygous variants of SEC24D."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Only 3 and 6 variants in SEC24D have been reported in patients with Cole-Carpenter syndrome type 2 and autosomal recessive OI, respectively."

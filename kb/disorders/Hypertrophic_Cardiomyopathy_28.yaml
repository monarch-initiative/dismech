    term:
      id: HP:0011675
      label: Arrhythmia
  notes: >-
    Deliberately carries no evidence item. No FHOD3-specific ICD outcome data
    or risk model exist and the CMH28 literature does not evaluate device
    therapy; indications are guideline-generic.
- name: Guideline-Directed Heart Failure Therapy
  description: >-
    Standard medical therapy for systolic dysfunction and heart failure, with
    anticoagulation for ventricular thrombus; in the noncompaction family this
    stabilised the proband for a time.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Congestive heart failure
    term:
      id: HP:0001635
      label: Congestive heart failure
  evidence:
  - reference: PMID:35205353
    reference_title: "A Case of Severe Left-Ventricular Noncompaction Associated with Splicing Altering Variant in the FHOD3 Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient refused immunosuppressive therapy for myocarditis; he received the standard therapy for heart failure, due to which his condition stabilized."
    explanation: Single-patient report of stabilisation on standard heart-failure therapy.
- name: Omecamtiv Mecarbil (Preclinical)
  description: >-
    The cardiac myosin activator omecamtiv mecarbil partially restored
    contractility in FHOD3-knockout human stem-cell-derived cardiomyocytes
    without correcting calcium handling. This is a single in vitro result in
    a loss-of-function model, not in patients or with patient alleles, and is
    recorded as a hypothesis-generating preclinical finding only.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: omecamtiv mecarbil
      term:
        id: CHEBI:188664
        label: omecamtiv mecarbil
  target_mechanisms:
  - target: Reduced Cardiomyocyte Contractility
    treatment_effect: INHIBITS
    description: Myosin activation counteracts the contractile deficit downstream of sarcomere loss, without addressing the sarcomeric lesion itself.
    evidence:
    - reference: PMID:41540467
      reference_title: "FHOD3 deficiency disrupts sarcomere organization and activates caMKII signaling in human stem cell-derived cardiomyocytes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Treatment with the myosin activator Omecamtiv mecarbil (OM) partially restored contractility without affecting calcium handling, highlighting its potential as a therapeutic strategy."
      explanation: Partial rescue of contractility in FHOD3-knockout human cardiomyocytes.
  evidence:
  - reference: PMID:41540467
    reference_title: "FHOD3 deficiency disrupts sarcomere organization and activates caMKII signaling in human stem cell-derived cardiomyocytes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Treatment with the myosin activator Omecamtiv mecarbil (OM) partially restored contractility without affecting calcium handling, highlighting its potential as a therapeutic strategy."
    explanation: In vitro only; no clinical use in CMH28 is reported.
animal_models:
- name: Fhod3 constitutive knockout mouse
  species: Mouse
  genotype: Fhod3-/- (germline null); Fhod3+/- heterozygotes
  publication: PMID:23213483
  description: >-
    Germline Fhod3 nulls die by E11.5 because premyofibrils fail to mature and
    chamber formation and trabeculation abort. Heterozygotes, the genotype
    closest to the human dosage, are phenotypically normal. Transgenic cardiac
    re-expression of wild-type Fhod3 rescues the embryos.
  evidence:
  - reference: PMID:23213483
    reference_title: "Mammalian formin Fhod3 plays an essential role in cardiogenesis by organizing myofibrillogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "However, these premyofibrils fail to mature and myocardial development does not continue, leading to embryonic lethality by E11.5."
    explanation: Establishes the embryonic lethal null phenotype.
  modeled_mechanisms:
  - target: Impaired Ventricular Trabecular Compaction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: Trabecular myocardial development aborts in null embryos.
    limitations: >-
      A complete embryonic-lethal null; patients are heterozygous for mostly
      non-truncating alleles and present with adult hypertrabeculation, and
      heterozygous mice are normal.
    readouts:
    - name: Embryonic trabecular development
      target: Impaired Ventricular Trabecular Compaction
      direction: DECREASED
      interpretation: Trabeculation fails in the absence of FHOD3.
      evidence:
      - reference: PMID:23213483
        reference_title: "Mammalian formin Fhod3 plays an essential role in cardiogenesis by organizing myofibrillogenesis."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Although the developing heart tube of Fhod3−/− embryos initiates rightward looping, subsequent chamber formation and myocardial development with trabeculation are aborted."
        explanation: Reports the trabeculation measurement.
    evidence:
    - reference: PMID:23213483
      reference_title: "Mammalian formin Fhod3 plays an essential role in cardiogenesis by organizing myofibrillogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Although the developing heart tube of Fhod3−/− embryos initiates rightward looping, subsequent chamber formation and myocardial development with trabeculation are aborted."
      explanation: Supports the model as informative for the trabeculation node.
  - target: Heterozygous FHOD3 Non-Truncating Variant
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: Halving Fhod3 dosage produces no overt phenotype.
    limitations: >-
      A null allele, not a patient non-truncating allele, and mouse lifespan
      and haemodynamics differ; it rules out haploinsufficiency only for the
      mouse.
    evidence:
    - reference: PMID:23213483
      reference_title: "Mammalian formin Fhod3 plays an essential role in cardiogenesis by organizing myofibrillogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Adult heterozygous Fhod3+/− mice appeared phenotypically normal and fertile."
      explanation: The heterozygous null does not model the dominant human disease.
- name: Cardiac Fhod3 I1127A transgenic mouse
  species: Mouse
  genotype: alpha-MHC-driven Fhod3 I1127A (actin-assembly-defective) transgene on a wild-type background
  publication: PMID:23213483
  description: >-
    Overexpression of an actin-assembly-defective FHOD3 in the heart causes
    cardiomyopathic changes with immature myofibrils despite wild-type Fhod3.
  modeled_mechanisms:
  - target: Sarcomere Disorganization and Impaired Myofibril Maintenance
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: A defective FHOD3 disturbs myofibrils in the presence of the wild-type protein.
    limitations: >-
      Engineered point mutant in the FH2 domain, expressed from a transgene at
      non-physiological levels; it is not a patient allele or a hotspot

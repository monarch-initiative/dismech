inheritance:
- name: Autosomal dominant
  description: >-
    Heterozygous FHOD3 variants segregate with HCM as an autosomal dominant
    trait, with very strong combined cosegregation across 17 families in the
    founding cohort. Penetrance is incomplete and expressivity is variable: age
    at onset in the Balkan founder families ranged from 4 to 63 years. The
    recurrent p.Arg637Gln allele is the exception to simple dominance - an
    intermediate-effect allele with penetrance of about 1% in heterozygotes and
    a severe early phenotype in most homozygotes - and is curated as a separate
    risk-factor genetic record rather than as recessive inheritance.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  expressivity: VARIABLE

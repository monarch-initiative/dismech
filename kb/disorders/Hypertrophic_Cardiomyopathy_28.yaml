mechanistic_hypotheses:
- hypothesis_group_id: fhod3_allele_mechanism
  hypothesis_label: Non-truncating FHOD3 alleles act through an altered (interfering) protein rather than haploinsufficiency
  status: EMERGING
  description: >-
    Three observations point away from simple haploinsufficiency: the disease
    alleles are overwhelmingly non-truncating and clustered in regulatory and
    sarcomere-targeting regions; all known splice alleles are predicted to
    skip in-frame cardiac exons; and Fhod3 heterozygous mice are normal. An
    overexpressed actin-assembly-dead FHOD3 causes cardiomyopathic changes in
    mice despite a wild-type allele, which shows that a defective FHOD3 can
    interfere in vivo. None of this tests a patient allele, so the hypothesis
    remains open; it is not encoded as DOMINANT_NEGATIVE on the pathway.
  evidence:
  - reference: PMID:35205353
    reference_title: "A Case of Severe Left-Ventricular Noncompaction Associated with Splicing Altering Variant in the FHOD3 Gene."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: COMPUTATIONAL
    snippet: "Along with the predominance of missense variants in previous FHOD3 studies, this allows us to speculate that the mechanism of FHOD3 malfunctioning is dominant-negative rather than haploinsufficiency, although there are still not enough data to make that assertion with confidence."
    explanation: The explicit, self-qualified statement of the hypothesis.
  - reference: PMID:23213483
    reference_title: "Mammalian formin Fhod3 plays an essential role in cardiogenesis by organizing myofibrillogenesis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: MODEL_ORGANISM
    snippet: "Adult heterozygous Fhod3+/− mice appeared phenotypically normal and fertile."
    explanation: Halving Fhod3 dosage in mice produces no overt phenotype, which argues against haploinsufficiency as the disease mechanism (with the caveat of species difference).

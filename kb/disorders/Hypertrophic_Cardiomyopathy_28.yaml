- name: Impaired Ventricular Trabecular Compaction
  description: >-
    A minority of carriers have left ventricular hypertrabeculation, and one
    family presented with predominant noncompaction. Fhod3-null mouse embryos
    fail to form trabeculae, so a developmental myocardial-architecture
    defect is a candidate explanation. This node is HYPOTHETICAL: it rests on
    a complete embryonic knockout, whereas patients are heterozygous and
    hypertrabeculation may be under-ascertained without cardiac MRI.

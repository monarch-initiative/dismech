    snippet: "Although the developing heart tube of Fhod3−/− embryos initiates rightward looping, subsequent chamber formation and myocardial development with trabeculation are aborted."
    explanation: Complete loss of FHOD3 in mouse embryos aborts trabecular myocardial development.

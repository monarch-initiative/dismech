pathophysiology:
- name: Heterozygous FHOD3 Non-Truncating Variant
  description: >-
    The initiating lesion is a heterozygous germline FHOD3 variant. Most
    reported disease alleles are non-truncating - missense, in-frame indels,
    canonical splice-site variants predicted to skip in-frame cardiac exons,
    and in-frame deletions of exons 15-16 - and they cluster in a conserved
    coiled-coil segment (amino acids 622-655), the diaphanous inhibitory domain
    and the cardiac-specific exon 12. The genetic association itself is
    established; what the alleles do to the protein is not. The clustering and
    the absence of a phenotype in Fhod3 heterozygous mice argue against simple
    haploinsufficiency, but no patient allele has been tested biochemically, so
    the functional impact is recorded as UNKNOWN rather than as dominant
    negative.

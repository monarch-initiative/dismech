- name: Maladaptive Hypertrophic Remodeling
  description: >-
    The ventricular myocardium responds with cardiomyocyte hypertrophy and a
    fetal gene programme, producing the asymmetric, septum-predominant wall
    thickening that defines the clinical disease. In adult Fhod3-deleted mice
    the hypertrophic gene response to a pressor stimulus is exaggerated,
    suggesting FHOD3 restrains hypertrophic remodelling; whether patient
    alleles act the same way is inferred. Fibrosis and, in a minority,
    systolic dysfunction follow.

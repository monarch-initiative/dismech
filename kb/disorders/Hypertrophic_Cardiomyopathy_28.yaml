discussions:
- discussion_id: fhod3_patient_allele_mechanism
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    What do heterozygous non-truncating FHOD3 patient alleles actually do to
    FHOD3 activity and localisation in adult cardiomyocytes?
  attaches_to:
  - pathophysiology#Heterozygous FHOD3 Non-Truncating Variant
  - pathophysiology#Perturbed FHOD3-Directed Actin Assembly in the Cardiac Sarcomere
  - animal_models#Fhod3 constitutive knockout mouse
  rationale: >-
    Every functional system used so far removes FHOD3 (knockdown, knockout,
    conditional deletion) or overexpresses an engineered mutant, whereas
    patients are heterozygous for mostly non-truncating alleles clustered in
    the coiled-coil/DID region and exon 12. Null mice die as embryos and
    heterozygous nulls are normal, so neither reproduces adult-onset HCM, and
    ClinGen explicitly notes that no study has demonstrated a clear HCM
    phenotype in a model. The mechanism chain in this entry is therefore
    built from loss-of-function systems, and the allele-to-protein step is
    UNKNOWN. A patient-allele knock-in (for example a coiled-coil missense,
    p.Arg637Gln, or the exon 15-16 deletion) in mice or isogenic iPSC-derived
    cardiomyocytes would test whether these alleles reduce actin assembly,
    mislocalise FHOD3 away from the C-zone, or interfere with the wild-type
    protein.
  evidence:
  - reference: PMID:39132495
    reference_title: "ClinGen Hereditary Cardiovascular Disease Gene Curation Expert Panel: Reappraisal of Genes associated with Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, it should be noted that while experimental studies have shown an important role for FHOD3 in heart and sarcomeric development, no studies have demonstrated a clear HCM phenotype."
    explanation: Expert-panel statement of the model gap.
  - reference: PMID:23213483
    reference_title: "Mammalian formin Fhod3 plays an essential role in cardiogenesis by organizing myofibrillogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Adult heterozygous Fhod3+/− mice appeared phenotypically normal and fertile."
    explanation: The dosage-matched null mouse has no phenotype.
- discussion_id: fhod3_expression_direction_in_cardiomyopathy
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is FHOD3 expression increased or decreased in diseased human myocardium,
    and does mislocalised FHOD3 contribute to hypertrophy?
  attaches_to:
  - pathophysiology#Perturbed FHOD3-Directed Actin Assembly in the Cardiac Sarcomere
  rationale: >-
    One group found FHOD3 expression increased in HCM myectomy tissue; another
    found reduced FHOD3 with an isoform switch in murine and human
    cardiomyopathy. In cMyBP-C-null mice, where FHOD3 is mislocalised,
    overexpressing FHOD3 worsened and reducing it partially relieved the
    cardiomyopathy, which suggests mislocalised FHOD3 can be harmful rather
    than merely insufficient. These observations come from different disease
    contexts (not FHOD3-variant hearts) and are not reconciled, which is why
    the pathway does not commit to a single direction of FHOD3 dysfunction.
  evidence:
  - reference: PMID:23255317
    reference_title: "Formin homology 2 domain containing 3 variants associated with hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FHOD3 expression is increased in the setting of HCM, and both alleles of FHOD3-V1151I were detected in HCM myectomy tissue."
    explanation: Increased FHOD3 expression in human HCM tissue.
  - reference: PMID:21149568
    reference_title: "Formin follows function: a muscle-specific isoform of FHOD3 is regulated by CK2 phosphorylation and promotes myofibril maintenance."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In murine and human cardiomyopathy, we observe reduced FHOD3 expression with a concomitant isoform switch and change of subcellular targeting."
    explanation: Reduced FHOD3 expression in cardiomyopathic myocardium, the opposite direction. The sentence pools mouse and human tissue; HUMAN_CLINICAL is kept because the human samples are the part relevant here, but the observation is not human-only.
  - reference: PMID:29686099
    reference_title: "Interaction between cardiac myosin-binding protein C and formin Fhod3."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The cardiomyopathic phenotype of cMyBP-C-null mice was further exacerbated by Fhod3 overexpression with a defect of sarcomere integrity, whereas that was partially ameliorated by a reduction in the Fhod3 protein levels, suggesting that Fhod3 has a deleterious effect on cardiac function under cMyBP-C-null conditions where Fhod3 is aberrantly mislocalized."
    explanation: Mislocalised FHOD3 is deleterious in a mouse HCM model, supporting a toxic-mislocalisation branch.
- discussion_id: fhod3_dcm_association
  kind: OPEN_QUESTION
  status: OPEN
  prompt: Do FHOD3 variants also cause dilated cardiomyopathy?
  attaches_to:
  - genetic#FHOD3
  rationale: >-
    A single FHOD3 missense variant (p.Tyr1249Asn) was reported in a Japanese
    adult-onset DCM case with in vitro functional impairment, and the
    noncompaction family showed moderate dilatation late in its course, but
    the DCM association is regarded as unproven. DCM is therefore not
    curated as a CMH28 phenotype.
  evidence:
  - reference: PMID:24088304
    reference_title: "Dilated cardiomyopathy-associated FHOD3 variant impairs the ability to induce activation of transcription factor serum response factor."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional studies revealed that the DCM-associated mutation significantly reduced the ability to induce actin dynamics-dependent activation of serum response factor, although no remarkable change in the cellular localization was induced in neonatal rat cardiomyocytes transfected with a mutant construct of FHOD3."
    explanation: The single-case functional evidence for a DCM association.
  - reference: PMID:38051749
    reference_title: "A novel splice-site FHOD3 founder variant is a common cause of hypertrophic cardiomyopathy in the population of the Balkans-A cohort study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "while the role of rare FHOD3 variants in dilated cardiomyopathy remains as yet unproven"
    explanation: States that the DCM association is unproven.
notes: >-
  GeneReviews: no FHOD3- or CMH28-specific chapter exists. The Nonsyndromic
  Hypertrophic Cardiomyopathy Overview chapter (PMID:20301725) covers HCM
  generally; its cached abstract only states the chapter's purpose and has no
  quotable findings, so it is tagged in references but carries no evidence
  items. ClinGen
  gene-disease validity is not recorded in gene_disease_validity because the
  Definitive FHOD3 assertion is for generic hypertrophic cardiomyopathy
  (MONDO:0005045), not MONDO:0030317; it is cited as evidence instead.
  Symptom and arrhythmia data come from small series only: the Balkan founder
  cohort reports that half of carriers were asymptomatic at diagnosis, with
  chest pain, exertional dyspnoea, fatigue, palpitations and syncope in the
  others, nonsustained VT in 3 of 13 and no atrial fibrillation; the
  noncompaction family adds atrial fibrillation and nonsustained VT. No
  frequency bands are assigned because none come from a large cohort. Sudden cardiac death is not
  curated as a phenotype: the founding cohort reports annual cardiovascular
  death (about 1%) without separating sudden death. No CMH28-specific
  treatment trial exists; management is general HCM care. Septal reduction
  therapy and aficamten are deliberately not listed: outflow obstruction, their
  indication, was not observed in the Balkan founder cohort, and no
  FHOD3-specific data exist for either.

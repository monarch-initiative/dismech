diagnosis:
- name: Echocardiography
  description: >-
    Imaging for unexplained left ventricular wall thickening, most often
    asymmetric septal hypertrophy, and for systolic function.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:42291545
    reference_title: "A novel FHOD3 splice-site variant in a Chinese family with hypertrophic cardiomyopathy: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we report a young male patient with asymmetric myocardial hypertrophy assessed by echocardiography, who was asymptomatic."
    explanation: Echocardiography detected asymmetric hypertrophy in an asymptomatic FHOD3 carrier.
- name: Cardiac Magnetic Resonance Imaging
  description: >-
    Cardiac MRI characterises hypertrabeculation or noncompaction and
    myocardial fibrosis. In the reported noncompaction family, both affected
    siblings were first diagnosed with HCM and reclassified only after MRI.
  diagnosis_term:
    preferred_term: cardiac MRI
    term:
      id: NCIT:C137915
      label: Magnetic Resonance Imaging of the Heart
  evidence:
  - reference: PMID:35205353
    reference_title: "A Case of Severe Left-Ventricular Noncompaction Associated with Splicing Altering Variant in the FHOD3 Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It should be noted that, in the present case, the proband and his sister were initially diagnosed with HCM, and the diagnosis of LVNC was clarified after the cMRI analysis was performed."
    explanation: MRI changed the diagnosis from HCM to noncompaction in FHOD3 carriers.
- name: Molecular Genetic Testing Including FHOD3 and CNV Analysis
  description: >-
    Multigene HCM panel or exome sequencing that includes FHOD3, with
    copy-number analysis so that in-frame exon 15-16 deletions are not
    missed. Interpretation should distinguish Mendelian alleles from the
    intermediate-effect p.Arg637Gln allele.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:30442288
    reference_title: "Formin Homology 2 Domain Containing 3 (FHOD3) Is a Genetic Basis for Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The FHOD3 gene should be routinely included in hypertrophic cardiomyopathy genetic testing panels."
    explanation: Recommendation to include FHOD3 in HCM gene panels.
  - reference: PMID:32335906
    reference_title: "Deletions of specific exons of FHOD3 detected by next-generation sequencing are associated with hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study highlights the importance of performing CNV analysis systematically in NGS genetic testing panels for HCM, and reinforces the relevance of the FHOD3 gene in the disease."
    explanation: Supports routine CNV analysis to detect FHOD3 exon deletions.
progression:
- phase: Genotype-positive relative before age 30
  notes: >-
    Clinical events are rare before age 30 and mean age at diagnosis is in the
    mid-forties, but onset as early as 4 years is reported for the Balkan
    founder allele, so carriers need longitudinal surveillance from childhood.
  evidence:
  - reference: PMID:30442288
    reference_title: "Formin Homology 2 Domain Containing 3 (FHOD3) Is a Genetic Basis for Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Events were rare before age 30 years, with an annual cardiovascular death incidence of 1% during follow-up."
    explanation: Low event rate before 30 defines the early pre-event phase.
  - reference: PMID:38051749
    reference_title: "A novel splice-site FHOD3 founder variant is a common cause of hypertrophic cardiomyopathy in the population of the Balkans-A cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals with this variant had a wide range of ages at onset of the disease (4-63 years)."
    explanation: Onset can occur in childhood.
- phase: Established hypertrophic cardiomyopathy
  notes: >-
    Course and event rate resemble unselected HCM in the founding cohort, with
    annual cardiovascular death about 1%. Outcome data conflict: Balkan founder
    carriers had no adverse cardiac events, while a Chinese cohort associated
    candidate variants with higher mortality. A minority progress to systolic
    dysfunction and heart failure.
  evidence:
  - reference: PMID:30442288
    reference_title: "Formin Homology 2 Domain Containing 3 (FHOD3) Is a Genetic Basis for Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The phenotype and the rate of cardiovascular events are similar to those reported in unselected cohorts."
    explanation: Overall prognosis is that of unselected HCM.
  - reference: PMID:38051749
    reference_title: "A novel splice-site FHOD3 founder variant is a common cause of hypertrophic cardiomyopathy in the population of the Balkans-A cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No adverse cardiac events were observed."
    explanation: Benign course among founder-allele carriers, one side of the conflicting outcome data.
treatments:
- name: Cascade Screening and Cardiac Surveillance of At-Risk Relatives
  description: >-
    Predictive testing of first-degree relatives for the familial FHOD3
    variant, followed by serial cardiac evaluation of carriers. Strong
    cosegregation makes a relative's genotype informative; incomplete
    penetrance and adult onset mean an unaffected young carrier is not
    discharged. The intermediate-effect p.Arg637Gln allele is a special case:
    with about 1% heterozygous penetrance, a positive cascade result conveys
    only modest risk.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: cascade genetic and cardiac screening of at-risk relatives
    term:
      id: NCIT:C168126
      label: Cardiac Disease Screening
  evidence:
  - reference: PMID:30442288
    reference_title: "Formin Homology 2 Domain Containing 3 (FHOD3) Is a Genetic Basis for Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FHOD3 mutations cosegregated with hypertrophic cardiomyopathy in 17 families, with a combined logarithm of the odds score of 7.92, indicative of very strong segregation."
    explanation: Cosegregation is what makes cascade genotyping of relatives informative.
  - reference: PMID:31742804
    reference_title: "Exome sequencing identifies a FHOD3 p.S527del mutation in a Chinese family with hypertrophic cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The present study could enable the provision of genetic counseling for this family and provide a basis for future genetic and functional studies."
    explanation: Identifying the familial allele enables family-based counselling and testing.
- name: Genetic Counseling
  description: >-
    Counselling should convey autosomal dominant transmission, incomplete penetrance with onset from childhood to late adulthood,
    and the distinct low-penetrance, dosage-sensitive behaviour of
    p.Arg637Gln, whose homozygotes are at risk of early severe disease.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:38160043
    reference_title: "Intermediate-effect size p.Arg637Gln in FHOD3 increases risk of HCM and is associated with an aggressive phenotype in homozygous carriers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All this information suggest that p.Arg637Gln variant in FHOD3 is a low-penetrant variant, with an intermediate effect, that contributes to the development of HCM in simple heterozygosis, being associated with a more severe phenotype in homozygous carriers."
    explanation: Supplies the allele-specific penetrance and dosage information counselling must convey.
- name: Pharmacotherapy for Symptomatic Hypertrophic Cardiomyopathy
  description: >-
    Standard HCM pharmacotherapy (beta-blockers, non-dihydropyridine calcium
    channel blockers, disopyramide) for symptoms and outflow obstruction.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: metoprolol
      term:
        id: CHEBI:6904
        label: metoprolol
    - preferred_term: verapamil
      term:
        id: CHEBI:9948
        label: verapamil
    - preferred_term: disopyramide
      term:
        id: CHEBI:4657
        label: disopyramide
  notes: >-
    Deliberately carries no evidence item. No FHOD3-specific treatment study
    exists; management follows general HCM guidelines (2024 AHA/ACC,
    PMID:38718139), whose cached abstract contains no quotable recommendation
    text, so no snippet is claimed.
- name: Cardiac Myosin Inhibitor Therapy
  description: >-
    Mavacamten improves exercise capacity and outflow obstruction in
    symptomatic obstructive HCM. The pivotal trial was not genotype
    stratified, no FHOD3 carriers are reported separately, and FHOD3
    knockout cardiomyocytes are hypocontractile, so whether myosin inhibition
    suits FHOD3 disease is untested; it is listed as general obstructive-HCM
    therapy, not as an FHOD3-directed one. Outflow obstruction, the indication,
    was not observed among the Balkan founder carriers, so it may be
    relevant to a minority of FHOD3 patients only.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mavacamten
      term:
        id: CHEBI:756998
        label: mavacamten
  evidence:
  - reference: PMID:32871100
    reference_title: "Mavacamten for treatment of symptomatic obstructive hypertrophic cardiomyopathy (EXPLORER-HCM): a randomised, double-blind, placebo-controlled, phase 3 trial."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with mavacamten improved exercise capacity, LVOT obstruction, NYHA functional class, and health status in patients with obstructive hypertrophic cardiomyopathy."
    explanation: Efficacy in obstructive HCM generally; applying it to FHOD3 carriers is an inference.
  - reference: PMID:38051749
    reference_title: "A novel splice-site FHOD3 founder variant is a common cause of hypertrophic cardiomyopathy in the population of the Balkans-A cohort study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Left outflow obstruction, severely impaired left ventricular filling pattern, apical aneurysm, reduced left ventricular ejection fraction, and atrial fibrillation were not observed."
    explanation: Outflow obstruction, the indication for myosin inhibition, was absent in the Balkan founder carriers.
- name: Implantable Cardioverter-Defibrillator
  description: >-
    Primary or secondary prevention of sudden death on standard HCM risk
    criteria. Annual cardiovascular mortality of about 1% in the founding
    cohort, and nonsustained ventricular tachycardia in the noncompaction
    family, keep arrhythmic risk stratification in scope.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: Implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  target_phenotypes:

    - reference: PMID:29158260
      reference_title: "The actin-organizing formin protein Fhod3 is required for postnatal development and functional maintenance of the adult heart in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, adult Fhod3-deleted mice exhibited a slight cardiomegaly and mild impairment of cardiac function, conditions that were sustained over 1 year without compensation during aging."
      explanation: Reports reduced cardiac function in the adult deletion model.

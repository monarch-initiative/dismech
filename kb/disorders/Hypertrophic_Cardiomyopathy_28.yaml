    evidence:
    - reference: PMID:23213483
      reference_title: "Mammalian formin Fhod3 plays an essential role in cardiogenesis by organizing myofibrillogenesis."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Moreover, cardiomyopathic changes with immature myofibrils are caused in mice overexpressing a mutant Fhod3, defective in binding to actin."
      explanation: Reports the myofibrillar and cardiomyopathic phenotype of the mutant transgene.
- name: Cardiac Fhod3 conditional knockout mouse (perinatal and adult inducible)
  species: Mouse
  genotype: floxed Fhod3 with cardiac Cre (perinatal) or tamoxifen-inducible cardiac Cre (adult)
  publication: PMID:29158260
  description: >-
    Perinatal cardiac deletion causes juvenile death with enlarged hearts and
    severely impaired myofibrils; adult deletion causes slight cardiomegaly,
    mild dysfunction and an exaggerated fetal-gene response to phenylephrine,
    without sarcomere disruption.
  modeled_mechanisms:
  - target: Maladaptive Hypertrophic Remodeling
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Adult deletion yields slight cardiomegaly and an exaggerated hypertrophic gene response to stress.
    limitations: >-
      Complete cardiac deletion rather than a heterozygous patient allele; the
      adult hearts show slight cardiomegaly, not asymmetric septal
      hypertrophy, and ClinGen notes that no model has shown a clear HCM
      phenotype.
    readouts:
    - name: Fetal cardiac gene expression after phenylephrine
      target: Maladaptive Hypertrophic Remodeling
      direction: INCREASED
      interpretation: The hypertrophic gene programme is exaggerated without FHOD3.
      evidence:
      - reference: PMID:29158260
        reference_title: "The actin-organizing formin protein Fhod3 is required for postnatal development and functional maintenance of the adult heart in mice."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In addition to these age-related changes, systemic stimulation with the α1-adrenergic receptor agonist phenylephrine, which induces sustained hypertension and hypertrophy development, induced expression of fetal cardiac genes that was more pronounced in adult Fhod3-deleted mice than in the control mice, suggesting that Fhod3 modulates hypertrophic changes in the adult heart."
        explanation: Reports the fetal-gene readout.
    evidence:
    - reference: PMID:29158260
      reference_title: "The actin-organizing formin protein Fhod3 is required for postnatal development and functional maintenance of the adult heart in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, adult Fhod3-deleted mice exhibited a slight cardiomegaly and mild impairment of cardiac function, conditions that were sustained over 1 year without compensation during aging."
      explanation: Adult deletion produces a mild cardiomyopathy, partially modelling remodelling.
  - target: Reduced Cardiomyocyte Contractility
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM

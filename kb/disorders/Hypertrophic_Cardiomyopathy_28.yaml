    explanation: Places FHOD3 among the minor, non-sarcomeric HCM genes.
  - reference: PMID:33586461
    reference_title: "Variant Spectrum of Formin Homology 2 Domain-Containing 3 Gene in Chinese Patients With Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Furthermore, the FHOD3 candidate variant experienced significantly more risk of cardiovascular death and all-cause death (adjusted hazard ratio [HR], 3.71; 95%, 1.32-8.59; P=0.016; and adjusted HR, 3.02; 95% CI, 1.09-6.85; P=0.035, respectively)."
    explanation: Prognostic association in a Chinese cohort; the variant set includes variants of uncertain significance.
- name: FHOD3 p.Arg637Gln
  gene_term:
    preferred_term: FHOD3
    term:
      id: hgnc:26178
      label: FHOD3
  association: Intermediate-effect risk allele
  relationship_type: RISK_FACTOR
  variant_origin: GERMLINE
  notes: >-
    A recurrent coiled-coil missense allele, enriched about five-fold in an
    Iberian HCM cohort but with an estimated heterozygous penetrance of only
    about 1%, so on its own it is a predisposing intermediate-effect variant
    rather than a Mendelian cause. Six of seven homozygotes had early, severe
    HCM, which is a dosage effect of this allele and is not recorded as
    autosomal recessive inheritance. In a larger multi-gene analysis,
    intermediate-effect variants (p.Arg637Gln accounting for about half of
    carriers) worsened outcomes when combined with a monogenic variant.
  case_fractions:
  - population: Unrelated hypertrophic cardiomyopathy probands, Spain (single-centre NGS series)
    case_fraction_percent: 2.94
    cohort_size: 9668
    notes: Heterozygous p.Arg637Gln carriers; 0.58% of gnomAD controls carried the allele.
    evidence:
    - reference: PMID:38160043
      reference_title: "Intermediate-effect size p.Arg637Gln in FHOD3 increases risk of HCM and is associated with an aggressive phenotype in homozygous carriers."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The p.Arg637Gln variant in FHOD3 was enriched in our HCM cohort (284 of 9668 probands; 2.94%) compared with internal controls (64 of 11 480; 0.59%) and gnomAD controls (373 of 64 409; 0.58%), with ORs of 5.40 (95% CI: 4.11 to 7.09) and 5.19 (95% CI: 4.44 to 6.07)."
      explanation: Carrier frequency and enrichment of the allele among HCM probands.
  evidence:
  - reference: PMID:38160043
    reference_title: "Intermediate-effect size p.Arg637Gln in FHOD3 increases risk of HCM and is associated with an aggressive phenotype in homozygous carriers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variant affects a highly conserved residue localised in a supercoiled alpha helix considered a clustering site for HCM variants, and in heterozygosis can act as a predisposing factor (intermediate-effect variant) for HCM, with an estimated penetrance of around 1%."
    explanation: Establishes low heterozygous penetrance and the risk-factor character of the allele.
  - reference: PMID:38160043
    reference_title: "Intermediate-effect size p.Arg637Gln in FHOD3 increases risk of HCM and is associated with an aggressive phenotype in homozygous carriers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Additionally, seven homozygous carriers of p.Arg637Gln in FHOD3 were identified. All but one (unaffected) showed an early presentation and a severe HCM phenotype."
    explanation: Homozygosity produces a more severe, earlier phenotype.
  - reference: PMID:40879562
    reference_title: "Redefining the Genetic Architecture of Hypertrophic Cardiomyopathy: Role of Intermediate-Effect Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: "IEVs also modified disease expression in individuals with monogenic variants, causing a more aggressive phenotype than in individuals from the monogenic-only group with HCM onset at younger age and a higher left ventricular maximum wall thickness (all P<0.0001), with major adverse cardiac event-free survival being significantly lower (93.3% versus 69.3% at 70 years of age; P<0.0001)."
    explanation: Pooled across genes (FHOD3 is one of five non-sarcomeric genes analysed), intermediate-effect variants act as modifiers of monogenic disease; the sentence does not name FHOD3, hence INDIRECT.
  - reference: PMID:40879562
    reference_title: "Redefining the Genetic Architecture of Hypertrophic Cardiomyopathy: Role of Intermediate-Effect Variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because the FHOD3:p.Arg637Gln variant was identified in 50% of probands carrying IEVs, we compared its effects with the other IEVs."
    explanation: p.Arg637Gln accounts for half of intermediate-effect-variant carriers in this cohort, which is what links the pooled finding above to this allele.

genetic:
- name: FHOD3
  gene_term:
    preferred_term: FHOD3
    term:
      id: hgnc:26178
      label: FHOD3
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  review_notes: >-
    FHOD3 (18q12.2) encodes a diaphanous-related formin with GBD, DID,
    coiled-coil, FH1, FH2 and DAD domains; the heart-enriched long isoform
    includes exon 12, which encodes the cMyBP-C-binding region. Pathogenic HCM
    alleles are mostly non-truncating and cluster in the coiled-coil segment
    (aa 622-655, exons 15-16), the DID and exon 12. Recurrent or founder
    alleles include the Balkan splice-donor c.1646+2T>C (estimated to have
    arisen about 58 generations ago), exon-12 p.Ser527del and p.Tyr528Cys,
    the Chinese splice allele c.1286+2delT, and in-frame exon 15-16 deletions
    that are only detected if CNV analysis is performed.
  notes: >-
    gene_disease_validity is deliberately left empty. ClinGen's Hereditary
    Cardiovascular Disease GCEP classifies FHOD3 as Definitive (AD), but that
    assertion is filed against generic hypertrophic cardiomyopathy
    (MONDO:0005045), not against MONDO:0030317, so under the repository rule it
    is a different disease pair (other_disease); it is cited as ordinary
    evidence below. CAUSATIVE is consistent with that Definitive tier. ClinGen
    also notes that experimental studies show FHOD3's role in sarcomere
    development but that no model has yet shown a clear HCM phenotype.
    A Chinese whole-exome cohort found that carriers of FHOD3 candidate
    variants (a set that includes variants of uncertain significance) had a
    higher adjusted risk of cardiovascular and all-cause death; this conflicts
    with the founding cohort's conclusion that event rates resemble unselected
    HCM and with the absence of adverse events among Balkan founder carriers.
  case_fractions:
  - population: Unrelated hypertrophic cardiomyopathy probands, Spain and UK (founding cohort)
    case_fraction_low: 1.0
    case_fraction_high: 2.0
    cohort_size: 3189
    notes: >-
      Authors' summary estimate of the FHOD3-attributable share. Candidate
      protein-altering variants were present in 2.32% of probands versus 0.65%
      of disease controls, so the raw candidate-variant rate overstates the
      attributable share.
    evidence:
    - reference: PMID:30442288
      reference_title: "Formin Homology 2 Domain Containing 3 (FHOD3) Is a Genetic Basis for Hypertrophic Cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "FHOD3 is a novel disease gene in hypertrophic cardiomyopathy, accounting for approximately 1% to 2% of cases."
      explanation: The FHOD3 share of HCM cases in the founding cohort.
  - population: Chinese hypertrophic cardiomyopathy patients (whole-exome cohort)
    case_fraction_percent: 3.3
    cohort_size: 1000
    notes: >-
      Candidate variants, not curated pathogenic variants; 1.6% of controls
      also carried candidates, so this is an upper bound on the attributable
      share.
    evidence:
    - reference: PMID:33586461
      reference_title: "Variant Spectrum of Formin Homology 2 Domain-Containing 3 Gene in Chinese Patients With Hypertrophic Cardiomyopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In detail, there were 27 candidate variants detected in 33 (3.3%) patients with HCM, which was significantly higher than in the 12 controls (3.3% versus 1.6%; odds ratio, 2.13; P<0.05)."
      explanation: Candidate-variant frequency in Chinese HCM patients versus controls.
  - population: Genetically solved hypertrophic cardiomyopathy probands, Balkans (Slovenia and neighbouring populations)
    case_fraction_percent: 16
    notes: >-
      A single founder allele (c.1646+2T>C) in 8 of 134 exome-sequenced
      probands; the 16% denominator is probands with a known genetic cause,
      not all HCM probands.
    evidence:
    - reference: PMID:38051749
      reference_title: "A novel splice-site FHOD3 founder variant is a common cause of hypertrophic cardiomyopathy in the population of the Balkans-A cohort study."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A founder FHOD3 c.1646+2T>C variant is the second most common genetic variant in our cohort of patients with HCM, occurring in 16% of probands with a known genetic cause of HCM, which represents a substantially higher proportion than the currently estimated 0.5-2% for causal FHOD3 variants."
      explanation: Founder-population case fraction, contrasted by the authors with the 0.5-2% estimate elsewhere.
  evidence:
  - reference: PMID:30442288
    reference_title: "Formin Homology 2 Domain Containing 3 (FHOD3) Is a Genetic Basis for Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variants' frequencies were significantly higher in patients with hypertrophic cardiomyopathy (74 of 3,189 [2.32%]) than in disease control subjects (18 of 2,777 [0.65%]; p < 0.001) or in the gnomAD database (1,049 of 138,606 [0.76%]; p < 0.001)."
    explanation: Case-control burden evidence for FHOD3 in HCM.
  - reference: PMID:30442288
    reference_title: "Formin Homology 2 Domain Containing 3 (FHOD3) Is a Genetic Basis for Hypertrophic Cardiomyopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FHOD3 mutations cosegregated with hypertrophic cardiomyopathy in 17 families, with a combined logarithm of the odds score of 7.92, indicative of very strong segregation."

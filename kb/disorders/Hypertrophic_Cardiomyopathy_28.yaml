- name: Perturbed FHOD3-Directed Actin Assembly in the Cardiac Sarcomere
  description: >-
    The heart-enriched long isoform FHOD3L nucleates actin and elongates
    filaments, and its elongation activity specifically is required for
    sarcomere formation and contraction. Its sarcomeric position depends on
    the cardiac-specific N-terminal region, which binds cardiac myosin-binding
    protein C and directs FHOD3 to the C-zone of the A-band; myofibril
    targeting is also regulated by CK2 phosphorylation of a muscle-specific
    exon. Disease alleles are predicted to disturb this localised actin
    assembly, either by reducing activity or by mislocalising it, but which of
    these happens for patient alleles is unknown. All evidence for this node
    is from cell-culture and animal systems.

      explanation: >-
        An actin-assembly-defective FHOD3 disturbs myofibrils in vivo despite a
        wild-type allele, the closest model evidence for an interfering mutant
        protein. It is an overexpressed engineered mutant, not a patient allele.
- name: Sarcomere Disorganization and Impaired Myofibril Maintenance
  description: >-
    Without adequate FHOD3 activity, thin filaments are lost and the sarcomere
    is disorganised and degraded; in human stem-cell-derived cardiomyocytes
    this is accompanied by impaired calcium handling and mitochondrial
    function. This is the primary cardiomyocyte insult from which the
    hypertrophic and contractile consequences follow. The evidence is from
    knockdown and knockout systems, which remove FHOD3 rather than express a
    patient allele.

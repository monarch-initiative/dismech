    term:
      id: NCIT:C64430
      label: Protein or Enzyme Type Measurement
  description: >-
    Quantitative measurement of serum and/or plasma vascular endothelial growth
    factor facilitates rapid diagnosis of POEMS syndrome and differentiates it
    from CIDP, MGUS neuropathy, and AL amyloidosis before irreversible axonal
    loss develops.
  evidence:
  - reference: PMID:30264176
    reference_title: "An update on the diagnosis and management of the polyneuropathy of POEMS syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Measurement of VEGF levels in the serum and plasma may help to make a rapid diagnosis"
    explanation: >-
      Establishes serum and plasma VEGF measurement as a key diagnostic assay
      for rapid identification of POEMS syndrome.
- name: Serum and Urine Protein Electrophoresis and Immunofixation
  diagnosis_term:

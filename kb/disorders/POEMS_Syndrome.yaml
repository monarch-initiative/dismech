- name: VEGF Overproduction
  description: >-
    Markedly elevated vascular endothelial growth factor (VEGFA) expression in
    bone marrow plasma cells and systemic circulation is a major diagnostic
    criterion and key downstream paraneoplastic mediator of POEMS syndrome,
    acting on endothelial receptors to increase microvascular permeability and
    angiogenesis. However, isolated anti-VEGF neutralization with bevacizumab
    has yielded ambiguous or worsening clinical outcomes, indicating that VEGF
    acts as a downstream mediator alongside other proinflammatory/angiogenic
    cytokines rather than as a sufficient sole initiating factor.

    evidence_source: HUMAN_CLINICAL
    snippet: "Consistent plasma cell disorders include a monoclonal component, often in small quantities with a lambda light chain isotype, and plasmacytoma, often solitary lesions."
    explanation: >-
      Documents the small-quantity lambda-restricted monoclonal gammopathy and
      solitary or multifocal plasmacytoma lesions characteristic of the clone.
  - reference: PMID:18497319
    reference_title: "Restrictive usage of monoclonal immunoglobulin lambda light chain germline in POEMS syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Searching for homologies with IGL germlines revealed that 2 germlines,
      IGLV1-44*01 (9/11) and IGLV1-40*01 (2/10), were identified, with an
      average homology of 91.1%.
    explanation: >-
      Demonstrates near-exclusive restriction of monoclonal plasma cell lambda
      light chains to the IGLV1-44 and IGLV1-40 germline alleles in POEMS
      syndrome.
  - reference: PMID:23957213
    reference_title: "14q32 translocations and 13q14 deletions are common cytogenetic abnormalities in POEMS syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      The 14q32 (IGH) translocation was observed in 45% of the cases and
      included the t(4;14) and t(11;14) translocation (15% and 25% of the
      cases, respectively). In addition, 25% of the patients had deletions of
      13q14 and 20% had an amplification of 1q21.
    explanation: >-
      Characterizes recurrent 14q32 (IGH) translocations and 13q14 deletions in
      purified CD138-positive bone marrow plasma cells from POEMS patients.
  - reference: PMID:33262528
    reference_title: "A highly heterogeneous mutational pattern in POEMS syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Three significantly mutated genes-LILRB1 (10%), HEATR9 (20%), and FMNL2
      (10%)-and eight mutated known driver genes (MYD88, NFKB2, CHD4, SH2B3,
      POLE, STAT3, CHD3, and CUX1) were identified.
    explanation: >-
      Establishes the heterogeneous somatic exome mutational landscape of
      purified bone marrow plasma cells in POEMS syndrome.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Computed tomography (CT) scans can show both densely sclerotic or lytic lesions with a sclerotic rim; mixed lesions with soap-bubble appearance have also been observed."
    explanation: >-
      Establishes CT imaging for identifying characteristic osteosclerotic and
      sclerotic-rimmed bone lesions in POEMS syndrome.
differential_diagnoses:
- name: Chronic Inflammatory Demyelinating Polyradiculoneuropathy
  disease_term:
    preferred_term: chronic inflammatory demyelinating polyradiculoneuropathy
    term:
      id: MONDO:0006702
      label: chronic inflammatory demyelinating polyradiculoneuropathy
  description: >-
    CIDP is the most common misdiagnosis of POEMS syndrome because both present
    with a chronic demyelinating polyradiculoneuropathy and elevated CSF
    protein; intermediate-segment conduction slowing, severe distal axonal loss,
    lack of response to IVIG/plasmapheresis, sclerotic bone lesions, clonal
    lambda plasma cells, and markedly elevated VEGF distinguish POEMS.
  distinguishing_features:
  - POEMS has a clonal plasma cell disorder and markedly elevated VEGF; CIDP does not
  - Sclerotic bone lesions and multiorgan POEMS features are absent in CIDP
  - POEMS nerve conduction slowing is predominantly intermediate without frequent conduction block, whereas CIDP is multifocal with macrophage-mediated demyelination
  evidence:
  - reference: PMID:31012139
    reference_title: "POEMS Syndrome: 2019 Update on diagnosis, risk-stratification, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnoses are often delayed because the syndrome is rare and can be
      mistaken for other neurologic disorders, most commonly chronic
      inflammatory demyelinating polyradiculoneuropathy.
    explanation: >-
      CIDP is identified as the most common neurologic disorder for which POEMS
      syndrome is mistaken.
- name: Castleman Disease Variant of POEMS
  description: >-
    The Castleman disease variant of POEMS has no clonal plasma cell disorder and
    typically little to no peripheral neuropathy, but shares several minor
    criteria; it must be distinguished from classic POEMS.
  distinguishing_features:
  - Castleman-variant POEMS lacks a clonal plasma cell disorder
  - Castleman-variant POEMS has little to no peripheral neuropathy
  evidence:
  - reference: PMID:31012139
    reference_title: "POEMS Syndrome: 2019 Update on diagnosis, risk-stratification, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "POEMS syndrome should be distinguished from the Castleman disease variant of POEMS syndrome, which has no clonal PCD and typically little to no peripheral neuropathy"
    explanation: >-
      Distinguishes classic POEMS from its Castleman disease variant.
- name: Idiopathic multicentric Castleman disease
  description: >-
    Both can present with multicentric lymphadenopathy, Castleman
    histopathology, organomegaly, extravascular volume overload, thrombocytosis
    and elevated VEGF, and POEMS is a formal exclusion in the international iMCD
    diagnostic criteria. The discriminators are the clonal plasma cell disorder
    with its monoclonal (usually lambda-restricted) paraprotein, the
    polyradiculoneuropathy, and sclerotic bone lesions - none of which belong to
    iMCD, where the immunoglobulin elevation is polyclonal.
  disease_term:
    preferred_term: idiopathic multicentric Castleman disease
    term:
      id: MONDO:0035838
      label: idiopathic multicentric Castleman disease
  distinguishing_features:
  - >-
    Monoclonal plasma cell disorder with a paraprotein, polyradiculoneuropathy,
    and sclerotic bone lesions; polyclonal hypergammaglobulinemia argues for iMCD
    instead.
  evidence:
  - reference: DOI:10.1002/art.43269
    reference_title: "Expert Perspective: Diagnosis and Treatment of Castleman Disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "MCD can be associated with excessive cytokine production due to a plasma cell neoplasm (MCD–polyneuropathy, organomegaly, endocrinopathy, monoclonal paraprotein, skin changes) or uncontrolled human herpesvirus‐8 infection (HHV‐8) (HHV‐8–positive MCD), but more than half of cases are idiopathic."
    explanation: >-
      States the etiologic split that separates POEMS-associated from idiopathic
      multicentric Castleman disease.
- name: AL Amyloidosis
  disease_term:
    preferred_term: AL amyloidosis
    term:
      id: MONDO:0019438
      label: AL amyloidosis
  description: >-
    Primary light-chain (AL) amyloidosis also arises from a commonly
    lambda-restricted clonal plasma cell dyscrasia with multisystem involvement
    and peripheral neuropathy, but causes predominantly axonal and prominent
    autonomic neuropathy from tissue amyloid fibril deposition rather than
    demyelinating polyradiculoneuropathy, osteosclerotic lesions, and marked
    VEGF elevation.
  distinguishing_features:
  - Tissue Congo-red-positive amyloid deposition and prominent autonomic axonal neuropathy characterize AL amyloidosis
  - Markedly elevated plasma/serum VEGF, osteosclerotic bone lesions, and demyelinating intermediate-segment slowing distinguish POEMS syndrome
  evidence:
  - reference: PMID:30264176
    reference_title: "An update on the diagnosis and management of the polyneuropathy of POEMS syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Bone marrow findings and the plasma or serum VEGF level are fundamental to distinguish POEMS syndrome from AL [9, 29]."
    explanation: >-
      Highlights AL amyloidosis as a key monoclonal lambda plasma cell mimic
      distinguished from POEMS by bone marrow pathology and plasma or serum VEGF
      levels.
  - reference: PMID:30264176
    reference_title: "An update on the diagnosis and management of the polyneuropathy of POEMS syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The diagnosis of amyloid neuropathy depends on the demonstration of
      amyloid deposits in nerve biopsies ... Congo red staining can show amyloid
      deposits
    explanation: >-
      Confirms tissue biopsy with Congo red demonstration of amyloid deposits as
      the definitive pathological discriminator for AL amyloidosis.
treatments:
- name: Radiation Therapy
  description: >-
    For patients with a dominant localized osteosclerotic plasmacytoma (one to
    two isolated bone lesions without disseminated marrow involvement),
    definitive focal irradiation is first-line curative-intent therapy.
  action_category: THERAPEUTIC
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: Radiation Therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
  target_mechanisms:
  - target: Clonal Plasma Cell Neoplasm
    treatment_effect: INHIBITS
    description: >-
      Targeted ionizing radiation eradicates the localized osteosclerotic
      plasmacytoma clone driving paraneoplastic VEGF production.
    evidence:
    - reference: PMID:37732822
      reference_title: "POEMS syndrome: Update on diagnosis, risk-stratification, and management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "For those patients with a dominant plasmacytoma, first-line therapy is irradiation."
      explanation: >-
        Focal irradiation directly targets the localized dominant plasmacytoma
        lesion in limited-stage POEMS syndrome.
  evidence:
  - reference: PMID:37732822
    reference_title: "POEMS syndrome: Update on diagnosis, risk-stratification, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For those patients with a dominant plasmacytoma, first-line therapy is irradiation."
    explanation: >-
      Radiation is first-line therapy for POEMS with a dominant plasmacytoma.
- name: Alkylator and Lenalidomide-Based Systemic Therapy
  description: >-
    For diffuse sclerotic lesions or disseminated bone marrow involvement,
    systemic anti-plasma-cell pharmacotherapy with lenalidomide (plus
    dexamethasone) or alkylating agents such as melphalan is the mainstay of
    therapy, lowering serum VEGF and improving neuropathy and extravascular
    volume overload without thalidomide-associated neurotoxicity.
  action_category: THERAPEUTIC
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: lenalidomide
      term:
        id: CHEBI:63791
        label: lenalidomide
    - preferred_term: melphalan
      term:
        id: CHEBI:28876
        label: melphalan
  target_mechanisms:
  - target: Clonal Plasma Cell Neoplasm
    treatment_effect: INHIBITS
    description: >-
      Alkylators and lenalidomide suppress the disseminated clonal plasma cell
      population.
    evidence:
    - reference: PMID:37732822
      reference_title: "POEMS syndrome: Update on diagnosis, risk-stratification, and management."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Corticosteroids are temporizing, but alkylators and lenalidomide are the mainstays of treatment"
      explanation: >-
        Establishes alkylators and lenalidomide as mainstay systemic therapies
        directed against the underlying plasma cell neoplasm.
  - target: VEGF Overproduction
    treatment_effect: INHIBITS
    description: >-
      Lenalidomide suppresses VEGF and proinflammatory cytokine production,
      reducing serum VEGF levels and improving edema and neuropathy.
    evidence:
    - reference: PMID:30264176
      reference_title: "An update on the diagnosis and management of the polyneuropathy of POEMS syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Lenalidomide has a much lower risk of a peripheral neuropathy and has been shown to be effective against neuropathy and edema, reducing the serum levels of VEGF [34–36]."
      explanation: >-
        Demonstrates that lenalidomide reduces serum VEGF levels alongside
        clinical improvement in edema and neuropathy.
  evidence:
  - reference: PMID:37732822
    reference_title: "POEMS syndrome: Update on diagnosis, risk-stratification, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Corticosteroids are temporizing, but alkylators and lenalidomide are the mainstays of treatment"
    explanation: >-
      Alkylators and lenalidomide are the mainstays of systemic therapy for POEMS
      syndrome.
  - reference: PMID:30264176
    reference_title: "An update on the diagnosis and management of the polyneuropathy of POEMS syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lenalidomide has a much lower risk of a peripheral neuropathy and has been shown to be effective against neuropathy and edema, reducing the serum levels of VEGF [34–36]."
    explanation: >-
      Documents efficacy and low neurotoxicity of lenalidomide in disseminated
      POEMS syndrome.
- name: Autologous Stem Cell Transplantation
  description: >-
    High-dose melphalan conditioning followed by autologous hematopoietic stem
    cell transplantation is a frontline standard of care for transplant-eligible
    patients with disseminated POEMS syndrome, achieving durable hematologic
    control, VEGF normalization, neurological improvement, and prolonged
    progression-free survival.
  action_category: THERAPEUTIC
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: Autologous Hematopoietic Stem Cell Transplantation
    term:
      id: NCIT:C16039
      label: Autologous Hematopoietic Stem Cell Transplantation
  target_mechanisms:
  - target: Clonal Plasma Cell Neoplasm
    treatment_effect: INHIBITS
    description: >-
      High-dose myeloablative chemotherapy with autologous stem cell rescue
      deeply eradicates the bone marrow plasma cell clone, driving durable
      hematologic and neurologic remission.
    evidence:
    - reference: PMID:30264176
      reference_title: "An update on the diagnosis and management of the polyneuropathy of POEMS syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "autologous stem cell transplantation is the current gold standard treatment for POEMS syndrome, showing good hematological control, neurological response, with improvement of the neuropathy, and good survival"
      explanation: >-
        Confirms hematologic clone control and downstream neuropathy recovery
        achieved by autologous stem cell transplantation.
  evidence:
  - reference: PMID:30264176
    reference_title: "An update on the diagnosis and management of the polyneuropathy of POEMS syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "autologous stem cell transplantation is the current gold standard treatment for POEMS syndrome, showing good hematological control, neurological response, with improvement of the neuropathy, and good survival"
    explanation: >-
      Establishes high-dose chemotherapy with autologous stem cell

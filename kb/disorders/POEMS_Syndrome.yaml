- name: Endoneurial Microvascular Injury and Blood-Nerve Barrier Breakdown
  description: >-
    Abnormal VEGF- and cytokine-mediated activation of endoneurial microvascular
    endothelial cells causes endothelial cytoplasmic hypertrophy, opening of
    inter-endothelial tight junctions, increased pinocytic vesicular transport,
    breakdown of the blood-nerve barrier, and secondary ischemic endoneurial
    microangiopathy with hypoxia-inducible HIF-1alpha amplification of local
    VEGF.

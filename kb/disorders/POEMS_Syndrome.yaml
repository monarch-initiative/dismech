progression:
- phase: Outcome stratified by osteosclerotic lesions
  notes: >-
    Among Castleman-associated cases, survival separates sharply on whether
    osteosclerotic bone lesions are present. In a 113-patient series, 5-year
    overall survival was 90% for multicentric Castleman disease with the
    osteosclerotic POEMS variant but 27% for multicentric Castleman disease with
    POEMS and no osteosclerotic lesions - the worst outcome of any Castleman
    category, and worse than multicentric disease without POEMS at 65%.
  evidence:
  - reference: PMID:22791417
    reference_title: "The clinical spectrum of Castleman's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "(1) unicentric CD (91%); (2) multicentric CD associated with the osteosclerotic variant of POEMS syndrome (90%); (3); multicentric CD without POEMS syndrome (65%); and (4) multicentric CD with POEMS syndrome without osteosclerotic lesions (27%)."
    explanation: Gives the category-specific 5-year survival stratification quoted here.
diagnosis:
- name: POEMS Dispenzieri Diagnostic Criteria
  description: >-
    Diagnosis requires three of the five major criteria — two of which must be
    polyradiculoneuropathy and a clonal plasma cell disorder (the other three
    being sclerotic bone lesions, elevated VEGF, and Castleman disease) — plus
    at least one of the six minor criteria (organomegaly, endocrinopathy,
    characteristic skin changes, papilledema, extravascular volume overload, or
    thrombocytosis/polycythemia).
  evidence:
  - reference: PMID:37732822
    reference_title: "POEMS syndrome: Update on diagnosis, risk-stratification, and management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of POEMS syndrome is made with three of the major criteria, two of which must include polyradiculoneuropathy and clonal plasma cell disorder, and at least one of the minor criteria."
    explanation: >-
      Defines the mandatory and supporting criteria for diagnosing POEMS
      syndrome.
- name: Serum and Plasma VEGF Measurement
  diagnosis_term:

description: >-
  POEMS syndrome is a rare, life-threatening paraneoplastic multisystem disorder
  arising from an underlying clonal plasma cell neoplasm, characteristically
  restricted to lambda light chains (IGLV1-40 and IGLV1-44) and associated with
  osteosclerotic bone lesions. Its name is an acronym for Polyneuropathy,
  Organomegaly, Endocrinopathy, Monoclonal plasma cell disorder, and Skin
  changes, while formal diagnosis requires both polyradiculoneuropathy and a
  clonal plasma cell disorder plus at least one additional major criterion
  (sclerotic bone lesions, elevated vascular endothelial growth factor, or
  Castleman disease) and at least one minor criterion. Coordinated overproduction
  of proinflammatory cytokines (including IL-6, TNF-alpha, and IL-12) and
  downstream vascular endothelial growth factor (VEGF) mediates endoneurial
  blood-nerve barrier disruption, demyelination with length-dependent axonal
  degeneration, systemic microvascular hyperpermeability, aberrant angiogenesis,
  and multiorgan manifestations.
pathophysiology:
- name: Clonal Plasma Cell Neoplasm
  description: >-
    POEMS syndrome originates from a somatic clonal plasma cell proliferation in
    bone marrow or focal plasmacytoma lesions, almost invariably expressing a
    lambda light-chain-restricted IgA or IgG monoclonal immunoglobulin with
    highly restricted IGLV1-44 or IGLV1-40 germline usage, frequent 14q32 (IGH)
    translocations and 13q14 deletions, and a heterogeneous somatic mutational
    profile. Unlike classic multiple myeloma, clonal plasma cell burden is
    typically low, yet eradication of the clone reverses the paraneoplastic
    syndrome.
  biological_scale: CELLULAR
  genetic_context:
    variant_origin: SOMATIC

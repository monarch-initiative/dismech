histopathology:
- name: Castleman-Type Angiofollicular Lymph Node Hyperplasia
  description: >-
    A subset of POEMS patients have lymph nodes showing the angiofollicular
    hyperplasia of Castleman disease, historically called POEMS-associated
    multicentric Castleman disease (POEMS-MCD) and treated as one of the four
    Castleman subtypes. The mechanism here is the clonal plasma cell neoplasm
    and its VEGF output, not the unknown trigger of idiopathic MCD or the
    uncontrolled KSHV replication of the HHV-8-associated form, which is why
    POEMS-MCD is curated inside this entry rather than as a Castleman entry.
    In a 113-patient Castleman series, 32% of multicentric cases met criteria
    for POEMS syndrome.
  evidence:
  - reference: DOI:10.1182/blood.2019000931
    reference_title: "Overview of Castleman disease"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CD includes unicentric CD (UCD) and multicentric CD (MCD), the latter of which is divided into idiopathic MCD (iMCD), human herpes virus-8 (HHV8)-associated MCD (HHV8-MCD), and polyneuropathy, organomegaly, endocrinopathy, monoclonal plasma cell disorder, skin changes (POEMS)-associated MCD (POEMS-MCD)."
    explanation: Establishes POEMS-associated MCD as one of the recognized Castleman subtypes.
  - reference: PMID:22791417
    reference_title: "The clinical spectrum of Castleman's disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the patients with multicentric CD, 32% had criteria sufficient for a diagnosis of POEMS syndrome."
    explanation: Quantifies how often multicentric Castleman disease is POEMS-associated.

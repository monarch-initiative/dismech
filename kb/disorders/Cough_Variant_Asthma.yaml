    evidence_source: HUMAN_CLINICAL
    snippet: "Wheezing developed in six (15%) patients with cough variant asthma, who were sensitized to larger numbers of allergens (P=0.02) and had higher rates of sensitization to HDM (P=0.01) and dog dander (P=0.02) than the 34 patients in whom wheezing did not develop."
    explanation: Multi-allergen sensitization in CVA patients is directly linked to progression risk, establishing allergens as clinically relevant triggers.
- name: Cold Air Exposure
  exposure_term:
    preferred_term: cold air exposure
    term:
      id: ECTO:0001055
      label: exposure to decreased air temperature
  description: Inhalation of cold dry air is a well-recognized trigger of cough in CVA patients.
  evidence:
  - reference: PMID:39828728
    reference_title: "Development and validation of a nomogram for predicting cough variant asthma diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Multivariate analysis identified several independent predictors of CVA, including cough triggered by cold air (OR = 12.493, P = 0.019)"
    explanation: Retrospective cohort study identifying cold-air-triggered cough as an independent predictor of CVA diagnosis.
- name: Upper Respiratory Infections
  exposure_term:
    preferred_term: viral infection exposure
    term:
      id: ECTO:3000001
      label: exposure to virus
  evidence:
  - reference: PMID:39557293
    reference_title: "Cough-Variant Asthma: A Review of Clinical Characteristics, Diagnosis, and Pathophysiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "it is triggered by exposure to various allergens, viral respiratory tract infections, cold air, environmental irritants, and other factors"
    explanation: Review of CVA clinical characteristics identifying viral respiratory tract infections as a recognized cough trigger.
  description: Viral upper respiratory tract infections frequently precede the onset of CVA or trigger exacerbations.
treatments:
- name: Inhaled Corticosteroids
  description: >-
    First-line treatment that reduces eosinophilic airway inflammation, inflammatory
    cytokines, and cough symptom scores. Budesonide inhalation achieves complete
    remission in approximately 56% and partial remission in 36% of CVA patients at
    8 weeks.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: inhaled corticosteroid agent therapy
    term:
      id: NCIT:C121367
      label: Localized Corticosteroid Therapy
    therapeutic_agent:
    - preferred_term: budesonide
      term:
        id: CHEBI:3207
        label: budesonide
  target_mechanisms:
  - target: Eosinophilic Airway Inflammation
    treatment_effect: INHIBITS
    description: >-
      Inhaled corticosteroids such as budesonide suppress eosinophilic airway
      inflammation and proinflammatory cytokines in CVA.
    evidence:
    - reference: PMID:38566832
      reference_title: "The Effects of Budesonide Inhalation Treatment on the Expression Levels of Serum IL-6, TGF-β1, and IgE and Pulmonary Function in Patients with Cough Variant Asthma and an Evaluation of Treatment Efficacy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In the three groups of CVA patients, after receiving budesonide inhalation combined with conventional symptomatic treatment, the expression levels of serum IL-5, IL-6, IL-8, TNF-α, TGF-β1, and IgE and number of eosinophils significantly decreased (P <0.05)."
      explanation: Demonstrates significant reduction of eosinophil counts and inflammatory cytokines with inhaled budesonide.
  evidence:
  - reference: PMID:38566832
    reference_title: "The Effects of Budesonide Inhalation Treatment on the Expression Levels of Serum IL-6, TGF-β1, and IgE and Pulmonary Function in Patients with Cough Variant Asthma and an Evaluation of Treatment Efficacy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Budesonide inhalation combined with conventional symptomatic treatment can significantly reduce the levels of serum inflammatory factors in patients with CVA to reduce inflammation and the allergic response, thereby reducing the cough symptom score, improving pulmonary function, and improving therapeutic efficacy."
    explanation: Demonstrates efficacy of inhaled budesonide in reducing inflammation and improving symptoms in CVA, with biomarker-guided early response prediction.
  - reference: PMID:34164212
    reference_title: "Narrative Review: how long should patients with cough variant asthma or non-asthmatic eosinophilic bronchitis be treated?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inhaled corticosteroids (ICSs) are the first-line treatment, and leukotriene receptor antagonists are also effective, in patients with both CVA and NAEB."
    explanation: Confirms ICS as first-line treatment for CVA.
- name: Bronchodilator Therapy
  description: >-
    Short-acting beta-2 agonists provide symptomatic relief, and cough responsiveness
    to bronchodilators is a distinguishing feature of CVA versus non-asthmatic
    eosinophilic bronchitis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: bronchodilator therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: short-acting beta-2 agonist
      term:
        id: NCIT:C48149
        label: Beta-Adrenergic Agonist
  target_mechanisms:
  - target: Beta2 Agonist Occupancy of Airway Smooth Muscle Receptors
    treatment_effect: ACTIVATES
    description: >-
      The inhaled short-acting agonist establishes receptor occupancy at this node, which is the
      beta2_adrenergic_receptor_agonism module's trigger. ACTIVATES because what the treatment
      brings about is the occupancy itself; the smooth muscle relaxation it produces is modelled
      inside that module.
    evidence:
    - reference: PMID:9817738
      reference_title: The beta-adrenoceptor.
      supports: SUPPORT
      evidence_source: OTHER
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      snippet: beta2-receptors being widely distributed in the respiratory tract, particularly in airway smooth muscle
      explanation: Supports this agent acting at the beta2 receptor on airway smooth muscle, which is what this link asserts.
  evidence:
  - reference: PMID:34164212
    reference_title: "Narrative Review: how long should patients with cough variant asthma or non-asthmatic eosinophilic bronchitis be treated?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Coughing is responsive to bronchodilators such as beta-agonists in CVA, but such feature has not been clarified in NAEB."
    explanation: Confirms bronchodilator responsiveness of cough as a diagnostic feature of CVA.
- name: Leukotriene Receptor Antagonists
  description: >-
    Montelukast and similar agents are effective adjunctive or second-line therapy for
    CVA, inhibiting eosinophilic inflammation and attenuating heightened cough reflex
    sensitivity.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: antileukotriene agent therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: montelukast
      term:
        id: CHEBI:50730
        label: montelukast
  target_mechanisms:
  - target: Eosinophilic Airway Inflammation
    treatment_effect: INHIBITS
    description: >-
      Leukotriene receptor antagonists inhibit cysteinyl leukotriene-driven
      eosinophilic airway inflammation.
    evidence:
    - reference: PMID:34164212
      reference_title: "Narrative Review: how long should patients with cough variant asthma or non-asthmatic eosinophilic bronchitis be treated?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "LTRAs also exert inhibitory effects on eosinophilic inflammation, and uniquely, on CRS (19,29,30)."
      explanation: Establishes inhibitory action of LTRAs on both eosinophilic airway inflammation and cough reflex sensitivity.
  - target: Cough Reflex Hypersensitivity
    treatment_effect: INHIBITS
    description: >-
      Leukotriene receptor antagonists reduce capsaicin cough reflex sensitivity
      in CVA patients.
    evidence:
    - reference: PMID:39557293
      reference_title: "Cough-Variant Asthma: A Review of Clinical Characteristics, Diagnosis, and Pathophysiology."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "LTRA improved cough and reduced CRS severity (logC5 increased from 1.2 to 2.2) despite no measured improvements in respiratory function.130,132,134,136,137"
      explanation: Demonstrates that LTRA therapy directly reduces cough reflex sensitivity severity in CVA.
  evidence:
  - reference: PMID:34164212
    reference_title: "Narrative Review: how long should patients with cough variant asthma or non-asthmatic eosinophilic bronchitis be treated?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inhaled corticosteroids (ICSs) are the first-line treatment, and leukotriene receptor antagonists are also effective, in patients with both CVA and NAEB."
    explanation: Confirms leukotriene receptor antagonists as an effective treatment for CVA.
prevalence:
- population: Global
  percentage: 25-42% of chronic cough cases
  measure_type: POINT_PREVALENCE
  prevalence_class: COMMON
  notes: >-
    CVA is consistently one of the most common causes of chronic cough worldwide,
    estimated to account for 25% to 42% of chronic cough cases. The prevalence of
    chronic cough in asthma ranges from 8-58% across cohorts.
  evidence:
  - reference: PMID:39557293
    reference_title: "Cough-Variant Asthma: A Review of Clinical Characteristics, Diagnosis, and Pathophysiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is an important cause of chronic cough, estimated to account for 25% to 42% of cases, but likely underdiagnosed due to delayed recognition and pitfalls of diagnostic testing."
    explanation: Quantifies CVA as accounting for 25-42% of chronic cough cases.
  - reference: PMID:37969279
    reference_title: "Cough in chronic lung disease: a state of the art review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of CC in respiratory diseases is poorly described, but estimates have been reported: asthma (8-58%)"
    explanation: Provides prevalence estimates for chronic cough in asthma populations, contextualizing CVA within the broader asthma spectrum.
  - reference: PMID:34164212
    reference_title: "Narrative Review: how long should patients with cough variant asthma or non-asthmatic eosinophilic bronchitis be treated?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cough variant asthma (CVA) is a phenotype of asthma which lacks wheezing or dyspnea, and consistently one of the most common causes of chronic cough worldwide."
    explanation: Establishes CVA as a globally common cause of chronic cough.
diagnosis:
- name: Methacholine Bronchial Provocation Test
  diagnosis_term:
    preferred_term: Pulmonary Function Test
    term:
      id: NCIT:C38081
      label: Pulmonary Function Test
  description: >-
    Demonstration of airway hyperresponsiveness via positive methacholine challenge
    (PC20 <16 mg/mL) is a key diagnostic criterion for CVA, distinguishing it from
    non-asthmatic eosinophilic bronchitis.
  evidence:
  - reference: PMID:34164212
    reference_title: "Narrative Review: how long should patients with cough variant asthma or non-asthmatic eosinophilic bronchitis be treated?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The distinctive characteristic of these conditions is the presence of airway hyperresponsiveness in CVA but not in NAEB."
    explanation: Explicitly identifies airway hyperresponsiveness (demonstrated by methacholine challenge) as the defining diagnostic feature that distinguishes CVA from non-asthmatic eosinophilic bronchitis.
- name: Therapeutic Trial Response
  description: >-
    Resolution of cough with bronchodilator or inhaled corticosteroid therapy confirms
    the diagnosis of CVA. Response to anti-asthma treatment at 6 months validates
    the phenotype classification.
  evidence:
  - reference: PMID:34164212
    reference_title: "Narrative Review: how long should patients with cough variant asthma or non-asthmatic eosinophilic bronchitis be treated?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Coughing is responsive to bronchodilators such as beta-agonists in CVA"
    explanation: Bronchodilator responsiveness of cough is a diagnostic feature distinguishing CVA from other chronic cough causes.
differential_diagnoses:
- name: Non-Asthmatic Eosinophilic Bronchitis
  description: >-
    Non-asthmatic eosinophilic bronchitis (NAEB) shares chronic nonproductive cough,
    sputum eosinophilia, and responsiveness to inhaled corticosteroids and leukotriene
    receptor antagonists with cough variant asthma.
  distinguishing_features:
  - >-
    Distinguished from cough variant asthma by the absence of airway hyperresponsiveness
    on methacholine bronchoprovocation testing, lack of mast cell infiltration within
    airway smooth muscle, and lack of consistent cough response to bronchodilators.
  evidence:
  - reference: PMID:34164212
    reference_title: "Narrative Review: how long should patients with cough variant asthma or non-asthmatic eosinophilic bronchitis be treated?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The distinctive characteristic of these conditions is the presence of airway hyperresponsiveness in CVA but not in NAEB."
    explanation: Establishes absence of airway hyperresponsiveness as the key physiological discriminator between NAEB and CVA.
  - reference: PMID:39557293
    reference_title: "Cough-Variant Asthma: A Review of Clinical Characteristics, Diagnosis, and Pathophysiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with NAEB are also characterized by a chronic, nonproductive cough, eosinophilic inflammation, and risk of progression to CA, as in CVA."
    explanation: Summarizes the overlapping clinical and inflammatory presentation of NAEB and CVA.
- name: Refractory Chronic Cough
  description: >-
    Refractory or unexplained chronic cough (RCC) shares heightened cough reflex
    sensitivity, cough triggers (allotussia/hypertussia), and abnormal laryngopharyngeal
    sensations with cough variant asthma.
  distinguishing_features:
  - >-
    Distinguished from cough variant asthma by lower fractional exhaled nitric oxide
    (FeNO) levels, absence of objective eosinophilic type 2 airway inflammation or
    reversible airflow limitation, and persistence of cough despite etiology-specific
    anti-asthmatic therapy.
  evidence:
  - reference: PMID:39534772
    reference_title: "Could cough hypersensitivity symptom profile differentiate phenotypes of chronic cough?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared with those with RCC, patients with asthmatic cough had higher levels of FENO (median 27 ppb (IQR 17–37) versus 18 ppb (IQR 12–27); p<0.001)."
    explanation: Demonstrates that higher FeNO and response to anti-asthmatic therapy differentiate asthmatic cough (CVA) from refractory chronic cough.
classifications:
  harrisons_chapter:
  - classification_value: RESPIRATORY
notes: >-
  CVA research is still in development with no unified definition of pathogenesis, diagnostic
  criteria or treatment strategies. Approximately 30% of untreated CVA patients may progress
  to classic asthma with wheezing over 3-5 years, with early inhaled corticosteroid therapy
  potentially reducing this risk. Long-term treatment may be necessary to prevent airway
  remodeling from mechanical stress of chronic coughing.

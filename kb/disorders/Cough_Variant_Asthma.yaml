name: Cough Variant Asthma
creation_date: "2026-03-04T12:00:00Z"
description: >-
  Cough variant asthma is a phenotype of asthma in which chronic dry cough is the
  sole or predominant symptom, without the wheeze and dyspnea of classic asthma.
  It shares the underlying eosinophilic airway inflammation and bronchial
  hyperresponsiveness of typical asthma, but the airway narrowing and cough
  reflex sensitization are insufficient to produce overt wheeze. Diagnosis rests
  on demonstrating reversible airflow limitation or airway hyperresponsiveness
  and a response to bronchodilator and inhaled corticosteroid therapy, and a
  substantial proportion of untreated patients progress to classic asthma.
category: Complex
disease_term:
  preferred_term: cough variant asthma
  term:
    id: MONDO:0001491
    label: cough variant asthma
parents:
- Respiratory Disease
- Asthma
synonyms:
- cough-variant asthma
- CVA
- Corrao syndrome
has_subtypes:
- name: Atopic Cough Variant Asthma
  description: CVA associated with allergic sensitization and elevated IgE levels, triggered by aeroallergens. Similar proportion of atopy is seen in CVA as in classic asthma.
  evidence:
  - reference: PMID:35127763
    reference_title: "Clinical and Inflammatory Characteristics of the Chinese APAC Cough Variant Asthma Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Despite lower total serum IgE levels in CVA, there was similar proportion of atopy in both groups.
    explanation: Confirms atopic sensitization is common in CVA, supporting the existence of an atopic subtype.
- name: Non-Atopic Cough Variant Asthma
  description: CVA occurring without allergic sensitization, often triggered by respiratory infections, cold air, or irritants.
pathophysiology:
- name: Eosinophilic Airway Inflammation
  role: trigger
  biological_scale: TISSUE
  description: >-
    Eosinophilic infiltration of the bronchial mucosa with release of cytotoxic mediators causing
    epithelial damage and airway hyperresponsiveness. CVA shares type 2 inflammatory biology with
    classic asthma but typically shows lower eosinophilic biomarker levels despite comparable or
    greater cough burden, suggesting cough generation is not a simple linear function of eosinophil
    load.
  cell_types:
  - preferred_term: eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  - preferred_term: T-helper 2 cell
    term:
      id: CL:0000546
      label: T-helper 2 cell
  - preferred_term: mast cell
    term:
      id: CL:0000097
      label: mast cell
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
  - preferred_term: eosinophil migration
    term:
      id: GO:0072677
      label: eosinophil migration
  locations:
  - preferred_term: bronchus
    term:
      id: UBERON:0002185
      label: bronchus
  evidence:
  - reference: PMID:35127763
    reference_title: "Clinical and Inflammatory Characteristics of the Chinese APAC Cough Variant Asthma Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cough variant asthma is distinctive from classic asthma in regard to clinical features, lung function, and airway inflammation."
    explanation: Large multicenter APAC cohort demonstrates that CVA has measurable but lower type 2 inflammatory markers compared to classic asthma.
  - reference: PMID:35127763
    reference_title: "Clinical and Inflammatory Characteristics of the Chinese APAC Cough Variant Asthma Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No correlation was found between cough assessment outcomes and sputum eosinophil count, blood eosinophil count, FENO, spirometry variables, or PD20-FEV1."
    explanation: Demonstrates that cough severity in CVA is dissociated from eosinophilic inflammation intensity, suggesting additional cough-driving mechanisms beyond eosinophilia.
  - reference: PMID:38566832
    reference_title: "The Effects of Budesonide Inhalation Treatment on the Expression Levels of Serum IL-6, TGF-β1, and IgE and Pulmonary Function in Patients with Cough Variant Asthma and an Evaluation of Treatment Efficacy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the three groups of CVA patients, after receiving budesonide inhalation combined with conventional symptomatic treatment, the expression levels of serum IL-5, IL-6, IL-8, TNF-α, TGF-β1, and IgE and number of eosinophils significantly decreased (P <0.05)."
    explanation: Confirms the presence of eosinophilic and cytokine-mediated inflammation in CVA that responds to inhaled corticosteroid treatment.
  - reference: PMID:34164212
    reference_title: "Narrative Review: how long should patients with cough variant asthma or non-asthmatic eosinophilic bronchitis be treated?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "approximately 30% to 50% of people with chronic cough have eosinophilic airway inflammation, the presence of which can be confirmed by sputum eosinophilia or elevated exhaled nitric-oxide levels."
    explanation: Establishes eosinophilic airway inflammation as a common feature of chronic cough conditions including CVA.
  downstream:
  - target: Airway Hyperresponsiveness
    causal_link_type: DIRECT
    description: >-
      Eosinophilic and mast-cell airway inflammation promotes bronchial remodeling
      and heightened smooth-muscle bronchoconstrictor responsiveness.
    evidence:
    - reference: PMID:39557293
      reference_title: "Cough-Variant Asthma: A Review of Clinical Characteristics, Diagnosis, and Pathophysiology."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The cough, wheeze, and dyspnea associated with CA are thought to result from BHR and eosinophilic airway inflammation, where persistent inflammation leads to airway remodeling and results in BHR."
      explanation: Links persistent eosinophilic airway inflammation and remodeling to bronchial hyperresponsiveness.
  - target: Cough Reflex Hypersensitivity
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Airway eosinophilia and inflammatory mediators sensitize peripheral airway
      cough receptors and heighten cough reflex sensitivity.
    evidence:
    - reference: PMID:35127763
      reference_title: "Clinical and Inflammatory Characteristics of the Chinese APAC Cough Variant Asthma Cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Allergen-induced bronchoconstriction and airway eosinophilia result in increased cough reflex sensitivity associated with an increased cough (35)."
      explanation: Connects airway eosinophilia and allergen-induced bronchoconstriction to increased cough reflex sensitivity.
  - target: Small Airway Dysfunction
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Chronic eosinophilic inflammation and remodeling of peripheral airways (<2 mm
      internal diameter) contribute to small airway dysfunction.
    evidence:
    - reference: PMID:39557293
      reference_title: "Cough-Variant Asthma: A Review of Clinical Characteristics, Diagnosis, and Pathophysiology."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Remodeling in asthma can affect both the large and small airways, with small airways being defined as <2 mm in internal diameter.74 Small airway remodeling contributes to small airway dysfunction (SAD), which is difficult to assess."
      explanation: Links inflammatory airway remodeling in small airways to small airway dysfunction.
- name: Airway Hyperresponsiveness
  role: central_effector
  biological_scale: TISSUE
  description: >-
    Enhanced bronchoconstrictor response to nonspecific stimuli such as methacholine,
    representing the hallmark physiologic abnormality that distinguishes CVA from
    non-asthmatic eosinophilic bronchitis. CVA typically shows milder AHR than classic
    asthma but it remains a defining diagnostic criterion.
  cell_types:
  - preferred_term: bronchial smooth muscle cell
    term:
      id: CL:0002598
      label: bronchial smooth muscle cell
  - preferred_term: bronchial epithelial cell
    term:
      id: CL:0002328
      label: bronchial epithelial cell
  biological_processes:
  - preferred_term: smooth muscle contraction
    term:
      id: GO:0006939
      label: smooth muscle contraction
  locations:
  - preferred_term: bronchus
    term:
      id: UBERON:0002185
      label: bronchus
  evidence:
  - reference: PMID:35127763
    reference_title: "Clinical and Inflammatory Characteristics of the Chinese APAC Cough Variant Asthma Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CVA subjects showed a higher proportion of female (67.1 vs. 55.3%, P = 0.0084), abnormal laryngopharyngeal sensations (71 vs. 51%, p < 0.0001) than CA, but presented with near normal spirometry and higher methacholine PD20-FEV1 values"
    explanation: Demonstrates AHR in CVA (positive methacholine challenge) but at milder levels than classic asthma, with higher PD20-FEV1 values.
  - reference: PMID:34164212
    reference_title: "Narrative Review: how long should patients with cough variant asthma or non-asthmatic eosinophilic bronchitis be treated?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The distinctive characteristic of these conditions is the presence of airway hyperresponsiveness in CVA but not in NAEB."
    explanation: Establishes AHR as the key distinguishing feature between CVA and non-asthmatic eosinophilic bronchitis.
  downstream:
  - target: Chronic Dry Cough
    causal_link_type: DIRECT
    description: >-
      Mild bronchoconstriction arising from airway hyperresponsiveness triggers
      bronchodilator-responsive chronic cough in CVA.
    evidence:
    - reference: PMID:34164212
      reference_title: "Narrative Review: how long should patients with cough variant asthma or non-asthmatic eosinophilic bronchitis be treated?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Mild diurnal change of PEF or its fluctuation in parallel with coughing may be observed, and cough is responsive to bronchodilators, suggesting that coughing of CVA results from bronchoconstriction based on airway inflammation and mild AHR."
      explanation: Establishes that bronchoconstriction from mild AHR drives chronic coughing in CVA.
    - reference: PMID:35127763
      reference_title: "Clinical and Inflammatory Characteristics of the Chinese APAC Cough Variant Asthma Cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "CVA also showed heightened cough response to bronchoconstriction, and coughing occurred with even mild bronchoconstriction (36)."
      explanation: Confirms that even mild bronchoconstriction evokes coughing in CVA.
  - target: Wheezing
    causal_link_type: DIRECT
    description: >-
      Greater bronchial hyperresponsiveness predisposes a subset of CVA patients
      to develop overt wheezing and progress to classic asthma.
    evidence:
    - reference: PMID:39557293
      reference_title: "Cough-Variant Asthma: A Review of Clinical Characteristics, Diagnosis, and Pathophysiology."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Clinical features linked to CVA progression to CA include increased sputum eosinophilia,19 longer disease duration,20 bronchial hyper-reactivity (BHR),11,21 sensitization to a greater number of aeroallergens,16 and failure to use inhaled corticosteroids (ICS) early in treatment.10,11"
      explanation: Links bronchial hyperreactivity to the development of wheezing and progression to classic asthma.
- name: Cough Reflex Hypersensitivity
  role: central_effector
  biological_scale: TISSUE
  description: >-
    Heightened sensitivity of airway cough receptors including vagal C-fibers and rapidly
    adapting receptors, leading to exaggerated cough responses to normally innocuous stimuli.
    Cough hypersensitivity symptom profiles are similar between asthmatic cough and refractory
    chronic cough, suggesting a shared neuronal mechanism across chronic cough phenotypes.
  cell_types:
  - preferred_term: bronchial epithelial cell
    term:
      id: CL:0002328
      label: bronchial epithelial cell
  locations:
  - preferred_term: bronchus
    term:
      id: UBERON:0002185
      label: bronchus
  evidence:
  - reference: PMID:39534772
    reference_title: "Could cough hypersensitivity symptom profile differentiate phenotypes of chronic cough?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The symptoms of cough hypersensitivity may not distinguish between asthmatic cough and RCC. This suggests that chronic cough is the primary diagnosis in both phenotypes. It indicates a shared mechanism in their cough pathogenesis, despite having potentially different treatable traits."
    explanation: Demonstrates that cough hypersensitivity is a shared mechanism between CVA and refractory chronic cough, supporting cough reflex hypersensitivity as a core feature of CVA.
  - reference: PMID:37969279
    reference_title: "Cough in chronic lung disease: a state of the art review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cough reflex hypersensitivity (CRH) has also been reported in asthma, COPD, bronchiectasis, ILD and sarcoidosis."
    explanation: State-of-the-art review confirms cough reflex hypersensitivity in asthma, supporting it as a mechanism in CVA.
  - reference: PMID:35127763
    reference_title: "Clinical and Inflammatory Characteristics of the Chinese APAC Cough Variant Asthma Cohort."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "abnormal laryngopharyngeal sensations (71 vs. 51%, p < 0.0001) than CA"
    explanation: Higher prevalence of abnormal laryngopharyngeal sensations in CVA compared to classic asthma supports heightened cough reflex sensitivity as a prominent feature.
  downstream:
  - target: Chronic Dry Cough
    causal_link_type: DIRECT
    description: >-
      Heightened cough reflex sensitivity directly drives persistent chronic cough
      in CVA.
    evidence:
    - reference: PMID:35127763
      reference_title: "Clinical and Inflammatory Characteristics of the Chinese APAC Cough Variant Asthma Cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Although we did not measure cough challenge sensitivity, such as capsaicin inhalation challenge, cough hypersensitivity has been reported to be enhanced in the patients with CVA (11, 20), as well as in CA (38). Therefore, cough hypersensitivity may underlie the asthmatic cough."
      explanation: Identifies enhanced cough hypersensitivity as an underlying mechanism of chronic cough in CVA.
  - target: Nonproductive Cough
    causal_link_type: DIRECT
    description: >-
      Sensitized airway cough receptors trigger dry, nonproductive paroxysms of
      coughing in response to trivial stimuli.
    evidence:
    - reference: PMID:34164212
      reference_title: "Narrative Review: how long should patients with cough variant asthma or non-asthmatic eosinophilic bronchitis be treated?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "However, recent evidence strongly indicates an important involvement of heightened cough reflex sensitivity (CRS), commonly assessed by capsaicin inhalation (19)."
      explanation: Links heightened cough reflex sensitivity to the dry cough phenotype of CVA.
  - target: Abnormal Laryngopharyngeal Sensations
    causal_link_type: DIRECT
    description: >-
      Sensitization of laryngeal and pharyngeal vagal afferents manifests clinically
      as throat tickle, itching, or foreign-body sensation (laryngeal paraesthesia).
    evidence:
    - reference: PMID:35127763
      reference_title: "Clinical and Inflammatory Characteristics of the Chinese APAC Cough Variant Asthma Cohort."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Compared with CA, a higher proportion of the patients with CVA experience cough-related laryngopharyngeal symptoms, indicating cough hypersensitivity in CVA."
      explanation: Directly links cough hypersensitivity to cough-related laryngopharyngeal sensations in CVA.
    - reference: PMID:39534772
      reference_title: "Could cough hypersensitivity symptom profile differentiate phenotypes of chronic cough?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This hypersensitivity can manifest as an exaggerated cough response to trivial stimuli such as cold air, perfume, talking or eating (referred to as allotussia); an increased cough response upon tussigen inhalation (hypertussia); or abnormal throat sensations like itching or tickling (laryngeal paraesthesia) [11, 12]."
      explanation: Confirms that cough reflex hypersensitivity manifests as abnormal throat sensations.
- name: Small Airway Dysfunction
  role: consequence
  biological_scale: TISSUE
  description: >-
    Small airway dysfunction is highly prevalent in CVA and frequently persists after
    short-term antiasthmatic treatment despite improvement in symptoms and inflammatory
    markers. This may contribute to disease chronicity and risk of progression to classic
    asthma.
  locations:
  - preferred_term: bronchiole
    term:
      id: UBERON:0002186
      label: bronchiole
  evidence:
  - reference: PMID:35095550
    reference_title: "Small Airway Dysfunction in Cough Variant Asthma: Prevalence, Clinical, and Pathophysiological Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SAD occurred in 73 (60.8%) patients with CVA before treatment."
    explanation: Demonstrates high prevalence of small airway dysfunction in corticosteroid-naive CVA patients.
  - reference: PMID:35095550
    reference_title: "Small Airway Dysfunction in Cough Variant Asthma: Prevalence, Clinical, and Pathophysiological Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among 105 patients who completed 2 months of antiasthmatic treatment and repeatedly experienced spirometry measurement, 57 (54.3%) patients still had SAD, despite a significant improvement in cough VAS, sputum eosinophils, FeNO, FEF50% pred, and PEF% pred (all p < 0.01)."
    explanation: SAD persists in over half of CVA patients after 2 months of treatment despite improvement in other parameters, suggesting a treatment-resistant component.
  - reference: PMID:35095550
    reference_title: "Small Airway Dysfunction in Cough Variant Asthma: Prevalence, Clinical, and Pathophysiological Features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Small airway dysfunction occurred in over half of patients with CVA and persisted after short-term antiasthmatic treatment, which showed distinctive clinical and pathophysiological features."
    explanation: Confirms SAD as a distinct pathophysiological feature of CVA.
  downstream:
  - target: Wheezing
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Small airway dysfunction in CVA is associated with lower FEV1 and PD20 and
      is a candidate marker for progression to wheezing and classic asthma.
    evidence:
    - reference: PMID:39557293
      reference_title: "Cough-Variant Asthma: A Review of Clinical Characteristics, Diagnosis, and Pathophysiology."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      snippet: "Patients with SAD versus those without trended toward having higher rates of the development of wheeze and therefore CA."
      explanation: Documents the association between small airway dysfunction and subsequent development of wheezing in CVA.
- name: Beta2 Agonist Occupancy of Airway Smooth Muscle Receptors
  role: therapeutic_vulnerability
  biological_scale: MOLECULAR
  conforms_to: "beta2_adrenergic_receptor_agonism#Beta2 Adrenergic Receptor Agonist Occupancy"
  description: >-
    Where the inhaled short-acting beta-2 agonist acts in this disease: it occupies and activates
    the beta2 adrenergic receptor on airway smooth muscle, relaxing the muscle and reversing the
    bronchoconstriction that the hyperresponsive airway of the Airway Hyperresponsiveness node
    above produces. The hyperresponsiveness itself, the airway's tendency to over-react, is not
    altered by the drug. In CVA that reversal is also diagnostic rather than only therapeutic,
    since cough responsiveness to a bronchodilator is what distinguishes CVA from non-asthmatic
    eosinophilic bronchitis. The node is the drug's point of attack rather than a step in CVA
    pathogenesis, and it carries no downstream edge, because the relation to the bronchoconstriction
    is relief and a downstream edge would assert that agonist occupancy causes it.
  molecular_functions:
  - preferred_term: beta2 receptor activation by an inhaled agonist
    term:
      id: GO:0004941
      label: beta2-adrenergic receptor activity
    modifier: INCREASED
  cell_types:
  - preferred_term: bronchial smooth muscle cell
    term:
      id: CL:0002598
      label: bronchial smooth muscle cell
  locations:
  - preferred_term: bronchus
    term:
      id: UBERON:0002185
      label: bronchus
  genes:
  - preferred_term: ADRB2
    term:
      id: hgnc:286
      label: ADRB2
  evidence:
  - reference: PMID:9817738
    reference_title: The beta-adrenoceptor.
    supports: SUPPORT
    evidence_source: OTHER
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: beta2-receptors being widely distributed in the respiratory tract, particularly in airway smooth muscle
    explanation: Establishes that the receptor this node describes sits on airway smooth muscle, which is what makes it the site an inhaled agonist acts on.
progression:
- phase: Progression to Classic Asthma with Wheezing
  notes: >-
    Without inhaled corticosteroid treatment, approximately 30% to 40% of adult CVA
    patients develop wheezing and progress to classic asthma, whereas early ICS
    treatment reduces the progression rate to approximately 15%.
  evidence:
  - reference: PMID:34164212
    reference_title: "Narrative Review: how long should patients with cough variant asthma or non-asthmatic eosinophilic bronchitis be treated?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A subset of patients with CVA develop wheezing and progresses to classic asthma. If ICS is not introduced, the progression rate is 30% to 40% in adults (56,57), and may be even higher in children (Table 1)."
    explanation: Quantifies the 30-40% progression rate of untreated CVA to classic asthma.
  - reference: PMID:39557293
    reference_title: "Cough-Variant Asthma: A Review of Clinical Characteristics, Diagnosis, and Pathophysiology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CVA progresses to CA in 30% to 40% of patients.10,11 Clinical features linked to CVA progression to CA include increased sputum eosinophilia,19 longer disease duration,20 bronchial hyper-reactivity (BHR),11,21 sensitization to a greater number of aeroallergens,16 and failure to use inhaled corticosteroids (ICS) early in treatment.10,11"
    explanation: Summarizes the natural history of CVA progression to classic asthma and its clinical predictors.
  - reference: PMID:17941915
    reference_title: "Atopic features of cough variant asthma and classic asthma with wheezing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Wheezing developed in six (15%) patients with cough variant asthma, who were sensitized to larger numbers of allergens (P=0.02) and had higher rates of sensitization to HDM (P=0.01) and dog dander (P=0.02) than the 34 patients in whom wheezing did not develop."
    explanation: Demonstrates a 15% 2-year progression rate to wheezing among ICS-treated CVA patients, associated with broader allergen sensitization.

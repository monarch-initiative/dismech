    quote_role: BACKGROUND
    snippet: >-
      Diagnosis of AK deficiency depends on the decreased level of enzyme
      activity in red cell and identification of a mutation in the AK1 gene.
    explanation: States the two components of diagnosis.
- name: AK1 sequencing
  description: >-
    Sequencing of AK1, now usually within a hereditary hemolytic anemia gene

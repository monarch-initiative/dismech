- name: AK1 Core Destabilizing Variants
  description: >-
    Missense alleles at buried residues of the CORE domain, away from the
    nucleotide sites, that are expected to act by destabilizing the fold and
    lowering the amount of enzyme in the red cell. Tyr164 is fully buried
    (relative side-chain accessibility 0.01 in PDB 1Z83, 11.8 A from Ap5A) and
    packs against Phe12, Leu115, Val160 and Ile161; it is invariant from
    Escherichia coli adenylate kinase to human AK1. Recombinant Tyr164Cys
    is grossly unstable, and the homozygous
    patient had no detectable erythrocyte enzyme protein on electrophoresis.
    The c.518T>G allele, which changes the buried strand residue Val173 to
    glycine on the canonical transcript, is placed in this class on structural
    grounds only. A mature red cell cannot replace an unstable protein, so
    instability becomes absence of activity as the cell ages.

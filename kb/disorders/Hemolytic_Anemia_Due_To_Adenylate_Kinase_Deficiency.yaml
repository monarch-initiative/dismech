  evidence:
  - reference: PMID:17662886
    reference_title: "Erythrocyte adenylate kinase deficiency: characterization of recombinant mutant forms and relationship with nonspherocytic hemolytic anemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Four mutant enzymes (Gly40Arg, Gly64Arg, Arg128Trp, Asp140del) were
      severely affected in activity, displaying a catalytic efficiency of four
      orders of magnitude lower than the wild-type; one (Tyr164Cys) was grossly
      perturbed in protein stability.
    explanation: >-
      Purified recombinant enzymes carrying four patient alleles at
      nucleotide-site residues are almost inactive, which is direct evidence of
      loss of catalytic function.
  - reference: PMID:43093599
    reference_title: "Mechanistic Insights into the Pathogenicity of Human Adenylate Kinase 1 Mutant R97W."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      R97W exhibited an approximately 89% reduction in catalytic efficiency and
      markedly decreased binding affinities for Mg2+·ATP, AMP, and Mg2+·ADP.
    explanation: >-
      Kinetic and binding measurements on recombinant human AK1 show that the
      Arg97Trp allele is a partial loss of catalytic function through weakened
      substrate binding.
  - reference: PMID:30918013
    reference_title: "Red cell adenylate kinase deficiency in India: identification of two novel missense mutations (c.71A>G and c.413G>A)."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Molecular modelling suggests that the structural changes induced by
      p.Gln24Arg and p.Arg138His are pathogenic variants having a direct impact
      on the structural arrangement of the region close to the active site of
      the enzyme.
    explanation: >-
      Modelling places Gln24Arg and Arg138His beside the active site; this is a
      prediction and neither allele has been tested as a recombinant enzyme.
  downstream:

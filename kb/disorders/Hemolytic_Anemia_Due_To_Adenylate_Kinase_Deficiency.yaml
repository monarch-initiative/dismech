- name: Neuronal Phosphotransfer Deficit
  description: >-
    A proposed consequence of AK1 loss in the brain, where AK1 is among the
    most highly expressed adenylate kinases: reduced adenylate kinase
    phosphotransfer and AMP signaling in neurons during development. It is
    offered as the basis of the intellectual disability and psychomotor
    impairment seen in a minority of patients. The supporting observation is
    only that neurological features cluster in patients with absent or very
    low erythrocyte activity (homozygous Arg107Ter, Arg97Trp, and compound
    heterozygotes carrying Arg138His); patients with equally absent activity
    and normal development are also on record, and severe neonatal
    hyperbilirubinemia is a competing explanation that the case reports do not
    exclude.

- name: AK1 Truncating Variants
  description: >-
    Nonsense and frameshift alleles that remove or replace the C-terminal part
    of the enzyme. Arg107Ter and the frameshifts Val47SerfsTer45 (reported as
    delG138) and Met75AsnfsTer19 stop translation before the LID domain and
    before the nucleotide-site residues Arg128, Arg132 and Gly177, so any product
    lacks a complete active site; these transcripts are also expected to be
    subject to nonsense-mediated decay. Arg107 itself is a surface residue
    (relative accessibility 0.59, 14.7 A from Ap5A) that is not conserved in
    chicken or mouse AK1, so the nonsense change acts through truncation and
    not through loss of that side chain. Lys155ArgfsTer39 is different: the
    new stop falls at codon 193, one codon before the native stop, so the
    transcript should escape decay and encode a full-length protein whose last
    forty residues, including the C-terminal helix and the ATP-site residue
    Gly177, are replaced by unrelated sequence. Siblings homozygous for
    Arg107Ter had undetectable erythrocyte activity.
  biological_scale: MOLECULAR
  gene:
    preferred_term: AK1
    term:
      id: hgnc:361
      label: AK1
  genetic_context:

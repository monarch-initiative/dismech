      explanation: Identification of the allele.
  - name: NM_000476.3:c.518T>G (p.Val173Gly)
    type: missense
    variant_type: single nucleotide variant
    description: >-
      Reported in a child with severe hemolytic anemia (PMID:37782390, a
      letter with no abstract to quote). The protein change given here was
      computed from the published nucleotide change on NM_000476.3 and has not
      been checked against the letter's own wording. Val173 is on a CORE
      beta-strand (residues 170-174), fully buried (relative accessibility
      0.00), 9.9 A from Ap5A, and packs against Tyr117, Val118 and His189; the
      position is hydrophobic in every ortholog examined. Glycine would leave
      a cavity in the sheet, so a stability defect is the expected mechanism.
      Not tested as a recombinant enzyme.
  evidence:
  - reference: PMID:17662886
    reference_title: "Erythrocyte adenylate kinase deficiency: characterization of recombinant mutant forms and relationship with nonspherocytic hemolytic anemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-

- name: Loss of AK1 Adenylate Kinase Activity
  description: >-
    AK1 is the major cytosolic adenylate kinase. It catalyzes the reversible,
    magnesium-dependent transfer of the terminal phosphate of ATP to AMP
    (AMP + ATP = 2 ADP), which is the only route by which a cell returns AMP
    to the ADP and ATP pool without degrading it, and it sets the AMP signal
    that reports cellular energy state. In affected individuals erythrocyte
    adenylate kinase activity is undetectable or reduced to between roughly a
    fifth and a half of normal, and heterozygous parents have about half-normal
    activity. Erythrocyte activity is the feature the disease is defined by.
    Other cell types keep part of their adenylate kinase activity through the
    genetically independent isozyme AK2, which is not thought to be present in
    erythrocytes in more than trace amounts.

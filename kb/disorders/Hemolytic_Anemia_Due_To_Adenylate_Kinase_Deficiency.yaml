- name: Premature Erythrocyte Destruction
  description: >-
    Red cells are removed from the circulation early, chiefly in the spleen.
    The evidence for the site is therapeutic: splenectomy ended the hemolytic
    process in five members of one kindred. Red-cell morphology shows no

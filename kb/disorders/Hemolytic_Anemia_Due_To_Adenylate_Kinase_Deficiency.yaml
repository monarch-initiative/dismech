genetic:
- name: AK1
  gene_term:
    preferred_term: AK1
    term:
      id: hgnc:361
      label: AK1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive
  features: >-
    All genotyped patients are homozygous or compound heterozygous for AK1
    variants; heterozygous relatives have about half-normal erythrocyte
    activity and no hemolysis. Thirteen distinct alleles have been published.
    Residue numbering follows UniProt P00568 and the MANE Select transcript
    NM_000476.3 (ENST00000644144), whose coding sequence translates exactly to
    the canonical 194-residue protein; every published change was recomputed
    on that transcript for this entry. Three points of nomenclature follow
    from that check. The in-frame deletion published as Asp140del and listed
    in ClinVar as Asp141del is one allele: residues 140 and 141 are both
    aspartate and deleting either codon gives the same protein. The frameshift
    published as delG138 is c.139del in current numbering and gives
    Val47SerfsTer45, with the stop at codon 91 as originally reported. The
    allele published as c.518T>G changes codon 173 from valine to glycine on
    this transcript.
  notes: >-
    Population data (gnomAD v4.1, queried 2026-11-26): AK1 tolerates
    heterozygous loss (pLI 0.01, LOEUF 0.86, missense Z 1.10). On the
    MANE Select transcript, high-confidence predicted loss-of-function
    variants (31 with a nonzero allele count) have a combined allele count of
    98 in about 1.46 million alleles, with no homozygotes. Published disease alleles
    are each very rare and none is seen in the homozygous state: Arg97Trp 40
    alleles, Arg138His 10, Gly64Arg 6, Asp141del 6, Arg128Trp 5, Gly40Arg 4,
    and Gln101Lys, Arg107Ter, Tyr164Cys and Val47SerfsTer45 one each. The
    common missense variant Glu123Gln (1,477 homozygotes) is benign. ClinVar
    additionally lists Arg132His (VCV001175800) and Lys56Ter (VCV004081098) as
    likely pathogenic without a published case; Arg132 is an ATP-site residue
    of the LID domain, 2.8 A from the ligand in PDB 1Z83. No ClinGen
    gene-disease validity classification exists for AK1 in the committed
    ClinGen export, so no validity tier is recorded here.
  variants:
  - name: NM_000476.3:c.382C>T (p.Arg128Trp)
    type: missense
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    identifiers:
    - ClinVar:VCV000018263
    description: >-
      The first allele identified. Arg128 lies on a CORE-domain helix (residues
      122-133); its guanidinium group is 3.4 A from Ap5A in PDB 1Z83 and it
      contacts Gly18 and Ser19 of the phosphate-binding loop. It is invariant
      in vertebrate AK1 and in E. coli and yeast adenylate kinase. Tryptophan
      removes a phosphate-binding positive charge and adds bulk beside the
      P-loop; the recombinant human enzyme has about one ten-thousandth of
      wild-type catalytic efficiency and the chicken equivalent is also less
      soluble.
    evidence:
    - reference: PMID:2542324
      reference_title: "Human adenylate kinase deficiency associated with hemolytic anemia. A single base substitution affecting solubility and catalytic activity of the cytosolic adenylate kinase."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A transition (C----T) was found in exon 6 on an allele, which resulted
        in an Arg to Trp (CGG----TGG) substitution at the 128th residue of AK1.
      explanation: Original identification of the allele in a patient.
  - name: NM_000476.3:c.491A>G (p.Tyr164Cys)
    type: missense
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    identifiers:
    - ClinVar:VCV000018265
    description: >-
      Tyr164 is on a CORE helix (residues 158-167), fully buried (relative
      accessibility 0.01) and 11.8 A from Ap5A; it packs against Phe12, Leu115,
      Val160 and Ile161 and is invariant from E. coli to human. Cysteine leaves
      a cavity in the hydrophobic core. The recombinant enzyme is grossly
      perturbed in stability, unlike the catalytic-site alleles tested beside
      it, and the homozygous patient had no detectable enzyme.
    evidence:
    - reference: PMID:9432020
      reference_title: "Severe erythrocyte adenylate kinase deficiency due to homozygous A-->G substitution at codon 164 of human AK1 gene associated with chronic haemolytic anaemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The subsequent sequence analysis of this abnormal fragment revealed
        homozygous and heterozygous A-->G substitutions in the proband and in
        the parents and brother respectively at codon 164, corresponding to a
        tyrosine-->cysteine substitution in the AK protein.
      explanation: Identification and segregation of the allele.
  - name: NM_000476.3:c.319C>T (p.Arg107Ter)
    type: nonsense
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    identifiers:
    - ClinVar:VCV000018264
    description: >-
      Stops translation after residue 106, removing residues 107-194: the LID
      domain, the nucleotide-site residues Arg128, Arg132, Arg138, Arg149 and
      Gly177. Homozygous siblings had undetectable
      activity, mild anemia and psychomotor impairment.
    evidence:
    - reference: PMID:10233365
      reference_title: "A case of complete adenylate kinase deficiency due to a nonsense mutation in AK-1 gene (Arg 107 --> Stop, CGA --> TGA) associated with chronic haemolytic anaemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The sequence of complete erythrocyte AK-1 cDNA showed the presence of a
        nonsense homozygous mutation at codon 107 (CGA --> TGA, Arg --> Stop) in
        the siblings.
      explanation: Identification of the allele.
  - name: NM_000476.3:c.118G>A (p.Gly40Arg)
    type: missense
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    identifiers:
    - ClinVar:VCV000018266
    description: >-
      Gly40 begins the first helix of the NMP-binding domain, next to the
      AMP-site residue Thr39; its alpha-carbon is 3.5 A from an Ap5A phosphate
      in PDB 1Z83 (3.2 A in 2C95). There is no room for a side chain here, so
      arginine must clash with the bound nucleotide or displace the helix.
      Recombinant catalytic efficiency is about one ten-thousandth of
      wild-type. Found in trans with Gly64Arg.
    evidence:
    - reference: PMID:12649162
      reference_title: "Red cell adenylate kinase deficiency: molecular study of 3 new mutations (118G>A, 190G>A, and GAC deletion) associated with hereditary nonspherocytic hemolytic anemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The first patient was found to be a compound heterozygote for 2
        different missense mutations, 118G>A(Gly40Arg) and 190G>A(Gly64Arg)
      explanation: Identification of the two alleles in one patient.
  - name: NM_000476.3:c.190G>A (p.Gly64Arg)
    type: missense
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    identifiers:
    - ClinVar:VCV000018267
    description: >-
      Gly64 is in the NMP-binding domain immediately before the AMP-site
      residues 65-67, 4.4 A from the AMP ribose of Ap5A and in contact with
      Met61 and Arg149. It is invariant in every ortholog examined. Arginine
      here intrudes on the AMP pocket; recombinant catalytic efficiency is
      about one ten-thousandth of wild-type.
    evidence:
    - reference: PMID:12649162
      reference_title: "Red cell adenylate kinase deficiency: molecular study of 3 new mutations (118G>A, 190G>A, and GAC deletion) associated with hereditary nonspherocytic hemolytic anemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The first patient was found to be a compound heterozygote for 2
        different missense mutations, 118G>A(Gly40Arg) and 190G>A(Gly64Arg)
      explanation: Identification of the two alleles in one patient.
  - name: NM_000476.3:c.421_423del (p.Asp141del)
    type: in-frame deletion
    variant_type: deletion
    clinical_significance: PATHOGENIC
    synonyms:
    - Asp140del
    - c.418_420delGAC
    identifiers:
    - ClinVar:VCV000018268
    description: >-
      Removes one of two adjacent aspartates at the end of the LID domain.
      Asp140 and Asp141 are both buried (relative accessibility 0.08 and 0.05)
      and form the salt-bridge network that positions Arg132, Arg138 and
      Arg149 on the phosphates; Asp140 is 4.0 A from Ap5A. Losing one residue
      shifts the register of the LID return strand and breaks that network.
      Recombinant catalytic efficiency is about one ten-thousandth of
      wild-type.
    evidence:
    - reference: PMID:12649162
      reference_title: "Red cell adenylate kinase deficiency: molecular study of 3 new mutations (118G>A, 190G>A, and GAC deletion) associated with hereditary nonspherocytic hemolytic anemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The second patient was homozygous for an in-frame deletion (GAC) from
        nucleotide (nt) 498 to 500 or nt 501 to 503 of the cDNA sequence,
        predicting deletion of either aspartic acid (Asp) 140 or 141.
      explanation: >-
        Identification of the allele; the cDNA positions in the quote use the
        numbering of the 1989 cDNA clone, not coding-sequence numbering.
  - name: NM_000476.3:c.139del (p.Val47SerfsTer45)
    type: frameshift
    variant_type: deletion
    clinical_significance: PATHOGENIC
    synonyms:
    - delG138
    identifiers:
    - ClinVar:VCV000018269
    description: >-
      Frameshift after residue 46 with a stop at codon 91; nothing beyond the
      first helix of the NMP-binding domain is native. The homozygous patient
      nevertheless had 22% of normal erythrocyte activity, which the report
      does not explain and which may reflect transfused cells or assay
      background.
    evidence:
    - reference: PMID:15315793
      reference_title: "A new variant of adenylate kinase (delG138) associated with severe hemolytic anemia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The sequence of erythrocyte AK-1 gene showed a new homozygous mutation
        (delG138) determining a frameshift and a premature stop at codon 91.
      explanation: Identification of the allele.
  - name: NM_000476.3:c.289C>T (p.Arg97Trp)
    type: missense
    variant_type: single nucleotide variant
    description: >-
      Arg97 is one of the AMP-site residues 94-97 of the CORE domain; its side
      chain is 3.5 A from the AMP adenine in PDB 1Z83 (2.9 A in 2C95) and it
      contacts Leu66, Gln101 and Tyr153. It is invariant in vertebrate AK1 and
      in E. coli and yeast adenylate kinase. The recombinant enzyme loses about
      89% of catalytic efficiency with weaker binding of ATP, AMP and ADP. A
      published tabulation lists the allele in a Japanese child with severe
      anemia and psychomotor delay (PMID:40016400); the likely primary report,
      a Japanese letter on splenectomy in this disease (PMID:28211224), has no
      abstract and could not be checked as its source.
      It is the most frequent published disease allele in gnomAD (40 alleles,
      no homozygotes).
    evidence:
    - reference: PMID:43093599
      reference_title: "Mechanistic Insights into the Pathogenicity of Human Adenylate Kinase 1 Mutant R97W."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Compared with wild-type hAK1, R97W revealed a more pronounced
        outward-open conformation of the NMP domain, disruption of the R97-E98
        salt bridge and the E98-Q101 hydrogen bond, and partial unfolding of
        the α6 helix into a disordered loop near the substrate-binding pocket.
      explanation: Structural consequences of the allele measured on recombinant enzyme.
    - reference: PMID:43093599
      reference_title: "Mechanistic Insights into the Pathogenicity of Human Adenylate Kinase 1 Mutant R97W."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        The human adenylate kinase 1 (hAK1) R97W mutation is associated with
        severe hereditary hemolytic anemia and progressive neuropsychomotor
        impairment.
      explanation: >-
        States the clinical association of the allele; the clinical observation
        was made in an earlier case report.
  - name: NM_000476.3:c.71A>G (p.Gln24Arg)
    type: missense
    variant_type: single nucleotide variant
    description: >-
      Gln24 is the first residue after the phosphate-binding loop (ATP-site
      residues 18-23), buried (relative accessibility 0.04), 5.2 A from an Ap5A
      phosphate and packed against Val179, Val182, Phe183 and Val186 of the
      C-terminal helix. It is conserved in vertebrate AK1 and in E. coli and
      yeast adenylate kinase. A buried charge here would disturb the packing
      that holds the P-loop against the C-terminal helix. Not tested as a
      recombinant enzyme. Found in trans with Arg138His.
    evidence:
    - reference: PMID:30918013
      reference_title: "Red cell adenylate kinase deficiency in India: identification of two novel missense mutations (c.71A>G and c.413G>A)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL

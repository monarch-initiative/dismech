discussions:
- discussion_id: controversy_ak1_deficiency_sufficient_for_hemolysis
  prompt: >-
    Is loss of AK1 activity sufficient to cause hemolytic anemia, or is a
    second red-cell defect required?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Erythrocyte Adenine Nucleotide Interconversion
  - pathophysiology#Premature Erythrocyte Destruction
  - mechanistic_hypotheses#ak1_loss_sufficient_for_hemolysis
  - mechanistic_hypotheses#additional_defect_required_for_hemolysis
  rationale: >-
    The genetics favor sufficiency: thirteen independent AK1 alleles in
    unrelated recessive families, each functionally damaging where tested.
    Against it stand a sibling with profound deficiency and no hemolysis,
    preserved adenine nucleotide turnover in enzyme-null red cells, no
    relation between residual activity and severity, and worse anemia when
    G6PD deficiency or thalassemia is co-inherited. The older biochemical
    studies had no genotypes, and the genotyped reports did not look for a
    second lesion, so the two bodies of evidence have never been tested
    against each other. The answer determines whether an AK1 genotype alone
    predicts disease in a sibling or fetus.
  evidence:
  - reference: PMID:6308059
    reference_title: "Metabolic compensation for profound erythrocyte adenylate kinase deficiency. A hereditary enzyme defect without hemolytic anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The cause of hemolysis in the proband was not identified.
    explanation: >-
      The study that found a non-hemolyzing deficient sibling could not explain
      the hemolysis of the proband.
  proposed_experiments:
  - experiment_id: ak1_null_erythrocyte_survival
    name: Red-cell survival and metabolism in AK1-null erythroid cells
    description: >-
      Measure red-cell lifespan, adenine nucleotide levels under metabolic and
      oxidative stress, and deformability in Ak1-null mice and in AK1-knockout
      human erythroid cells differentiated in vitro, with and without a second
      lesion such as G6PD deficiency.
    would_support:
    - mechanistic_hypotheses#ak1_loss_sufficient_for_hemolysis
    would_refute:
    - mechanistic_hypotheses#additional_defect_required_for_hemolysis
    supporting_outcome:
    - >-
      Shortened survival or stress-induced loss of ATP in AK1-null red cells
      that have no other defect.
    refuting_outcome:
    - >-
      Normal survival of AK1-null red cells unless a second lesion is added.
- discussion_id: gap_ak1_neurological_involvement
  prompt: >-
    Why do only some patients with absent AK1 activity have intellectual
    disability or psychomotor impairment, and is the cause neuronal AK1 loss
    or neonatal hyperbilirubinemia?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Neuronal Phosphotransfer Deficit
  - phenotypes#Intellectual Disability
  - phenotypes#Psychomotor Impairment
  rationale: >-
    Neurological features are reported with truncating alleles and with
    Arg97Trp and Arg138His, but patients with undetectable activity from
    Tyr164Cys or with catalytically dead Gly40Arg/Gly64Arg developed
    normally. No report gives peak neonatal bilirubin alongside developmental
    outcome, and no neuronal or brain measurement of AK1 function exists in
    patients or in the knockout mouse literature cited here.
  evidence:
  - reference: PMID:40016400
    reference_title: "Novel AK-1 gene variants combined with thalassemia causing rare hereditary non-spherocytic hemolytic anemia in a Chinese family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      To date, five cases of neuromotor disorders have been reported, all
      exhibiting extremely low or absent AK enzyme activity.
    explanation: Summarizes the small and unexplained neurological subset.

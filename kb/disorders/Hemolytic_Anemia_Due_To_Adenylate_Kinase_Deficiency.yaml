animal_models:
- name: Ak1 knockout mouse
  species: Mouse
  genotype: Ak1 homozygous null
  genes:
  - preferred_term: Ak1
    term:
      id: MGI:87977
      label: Ak1
  publication: PMID:11101510
  description: >-
    Mice lacking Ak1 are viable. Published studies describe skeletal muscle
    and heart: the enzyme defect is reproduced and energetic economy is
    reduced under load, with compensation by glycolytic, guanylate kinase and
    creatine kinase phosphotransfer. Red-cell survival, hematology and
    neurodevelopment are not described in the papers cited here, so the model
    informs the enzyme-level defect and the capacity for compensation, not
    the hemolytic phenotype.
  modeled_mechanisms:
  - target: Loss of AK1 Adenylate Kinase Activity
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Complete genetic loss of Ak1 reproduces the enzyme defect, studied in
      muscle and heart.
    limitations: >-
      The cited studies examine muscle and heart, which retain other
      adenylate kinase isozymes and creatine kinase; the red cell, which has
      neither, was not examined.
    divergences:
    - divergence_type: INCOMPLETE_PHENOTYPE
      materiality: QUALIFYING
      description: >-
        Hemolytic anemia, the defining human feature, is not reported in the
        cited knockout studies; they neither show nor exclude it.
    evidence:
    - reference: PMID:11101510
      reference_title: "Adenylate kinase 1 gene deletion disrupts muscle energetic economy despite metabolic rearrangement."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Here, we provide evidence that genetic disruption of AK1-catalyzed
        ss-phosphoryl transfer in mice decreases the potential of myofibers to
        sustain nucleotide ratios despite up-regulation of high-energy
        phosphoryl flux through glycolytic, guanylate and creatine kinase
        phosphotransfer pathways.
      explanation: >-
        Shows the consequence of Ak1 loss for adenine nucleotide handling and
        the compensating phosphotransfer routes in muscle.
    - reference: PMID:12124227
      reference_title: "Adenylate kinase AK1 knockout heart: energetics and functional performance under ischemia-reperfusion."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        On reperfusion, AK1 knockout hearts demonstrated reduced nucleotide
        salvage, resulting in lower ATP, GTP, ADP, and GDP levels and an
        altered metabolic steady state associated with diminished ATP-to-P(i)
        and creatine phosphate-to-P(i) ratios.
      explanation: >-
        Under metabolic stress, Ak1-null heart fails to preserve its nucleotide
        pools, the kind of defect proposed for the stressed red cell.

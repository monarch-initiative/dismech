notes: >-
  No GeneReviews chapter covers this disease or AK1; the phenotype baseline is
  the set of genotyped case reports and the 2025 tabulation of published cases
  (PMID:40016400). Structural statements in this entry (distances to the bound
  nucleotide analog, relative solvent accessibility, residue contacts and
  ortholog conservation) were computed from PDB 1Z83 and 2C95, the AlphaFold
  model AF-P00568-F1 and UniProt sequences of pig, cow, mouse, rat, chicken and
  carp AK1 and of E. coli and yeast adenylate kinase; they are not quoted from
  the cited papers.

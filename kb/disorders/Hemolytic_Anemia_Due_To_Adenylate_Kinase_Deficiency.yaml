- name: Impaired Erythrocyte Adenine Nucleotide Interconversion
  description: >-
    The mature erythrocyte has no mitochondria and cannot synthesize purines
    de novo, so its adenine nucleotide pool depends on glycolytic ATP
    production, adenine salvage, and adenylate kinase to return AMP to ADP.
    In enzyme-deficient red cells the transfer of phosphate between ATP and
    ADP continues at a small fraction of the normal rate (about 1/2,000 of
    normal activity in one study), and labeled adenine still enters ADP and
    ATP at about half the expected rate. The residual flux has been attributed
    to trace AK2, to guanylate kinase accepting AMP, or to an AMP:GTP
    phosphotransferase. Steady-state ATP is normal or raised in most patients
    studied, which reflects the young red-cell population, so a simple fall in
    ATP does not explain the hemolysis; reported abnormalities are instead
    raised 2,3-diphosphoglycerate and, in one patient, reduced AMP.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL

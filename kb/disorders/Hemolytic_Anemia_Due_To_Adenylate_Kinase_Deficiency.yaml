  - name: NM_000476.3:c.464del (p.Lys155ArgfsTer39)
    type: frameshift
    variant_type: deletion
    synonyms:
    - c.464delA
    description: >-
      Late frameshift whose new stop is at codon 193, one codon before the
      native stop. The predicted product is full length with residues 155-192
      replaced, which removes the last CORE helix and strands, the ATP-site
      residue Gly177 and the C-terminal helix that packs against the P-loop.
      The homozygous proband also carried alpha- and beta-thalassemia trait
      and had about 60% of the reference enzyme level by an immunoassay, so
      the contribution of this allele to his severe anemia is uncertain.
    evidence:
    - reference: PMID:40016400
      reference_title: "Novel AK-1 gene variants combined with thalassemia causing rare hereditary non-spherocytic hemolytic anemia in a Chinese family."
      supports: SUPPORT

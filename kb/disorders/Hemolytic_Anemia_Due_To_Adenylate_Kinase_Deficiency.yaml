name: Hemolytic Anemia Due to Adenylate Kinase Deficiency
creation_date: "2026-11-26T19:00:00Z"
category: Mendelian
synonyms:
- hemolytic anemia due to adenylate kinase deficiency
- adenylate kinase deficiency, hemolytic anemia due to
- erythrocyte adenylate kinase deficiency
- red cell adenylate kinase deficiency
- AK1 deficiency
- congenital nonspherocytic hemolytic anemia 3
- CNSHA3
description: >-
  A very rare autosomal recessive red-cell enzymopathy caused by biallelic
  loss-of-function variants in AK1, which encodes the cytosolic adenylate kinase
  that interconverts adenine nucleotides (AMP + ATP = 2 ADP). Affected
  individuals have reduced or undetectable erythrocyte adenylate kinase activity
  and a chronic nonspherocytic hemolytic anemia of variable severity, usually
  presenting with neonatal jaundice and splenomegaly. A minority, mostly those
  with absent enzyme activity, also have intellectual disability or psychomotor
  impairment. How the enzyme defect shortens red-cell survival is not
  established, and whether adenylate kinase deficiency is sufficient on its own
  to cause hemolysis has been questioned since the first biochemical studies.

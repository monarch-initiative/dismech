diagnosis:
- name: Erythrocyte adenylate kinase activity assay
  description: >-
    Spectrophotometric assay of adenylate kinase in a hemolysate, run with
    other red-cell enzymes in the work-up of an unexplained nonspherocytic
    hemolytic anemia. A reduced value should be confirmed by AK1 sequencing,
    because recent transfusion can raise the result.
  markers: Erythrocyte adenylate kinase activity
  results: Undetectable or reduced activity in patients; about half-normal in carriers.
  evidence:
  - reference: PMID:30918013

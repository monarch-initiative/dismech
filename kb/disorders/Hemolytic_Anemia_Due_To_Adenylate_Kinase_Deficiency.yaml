      explanation: Identification of the two alleles in one patient.
  - name: NM_000476.3:c.413G>A (p.Arg138His)
    type: missense
    variant_type: single nucleotide variant
    description: >-
      Arg138 is a LID-domain arginine that binds the transferred phosphate
      (3.2 A from Ap5A in PDB 1Z83, 2.9 A in 2C95) and is held by Asp140 and
      Asp141; it is invariant in every ortholog examined. Histidine is too
      short to reach the phosphate. Reported in two unrelated compound
      heterozygous patients, from India and China, both with psychomotor
      delay. Not tested as a recombinant enzyme.
    evidence:
    - reference: PMID:35509045
      reference_title: "Red cell adenylate kinase deficiency in China: molecular study of 2 new mutations (413G > A, 223dupA)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        A molecular study of the patient's AK gene revealed 2 different
        mutations: a heterozygous missense mutation in exon 6 (c.413G > A) and
        a heterozygous frameshift mutation in exon 5 (c.223dupA).
      explanation: Second, independent report of the allele.
    - reference: PMID:30918013
      reference_title: "Red cell adenylate kinase deficiency in India: identification of two novel missense mutations (c.71A>G and c.413G>A)."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We are reporting two novel missense mutation (c.71A > G and c.413G > A)

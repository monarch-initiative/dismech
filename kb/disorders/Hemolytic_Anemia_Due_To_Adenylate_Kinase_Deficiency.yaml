  - name: NM_000476.3:c.301C>A (p.Gln101Lys)
    type: missense
    variant_type: single nucleotide variant
    clinical_significance: PATHOGENIC
    identifiers:
    - ClinVar:VCV001162194
    description: >-
      Gln101 is an AMP-site residue: its side-chain amide is 3.1 A from N1 of
      the AMP adenine in PDB 1Z83 and it is buried (relative accessibility
      0.04). It is conserved in vertebrate AK1 and in E. coli and yeast
      adenylate kinase. Lysine cannot make the paired hydrogen bonds that read
      the adenine base and introduces a charge in the pocket. Not tested as a
      recombinant enzyme; the homozygous patient had about 12% of normal
      erythrocyte activity.
    evidence:
    - reference: PMID:34321014
      reference_title: "Rare hereditary nonspherocytic hemolytic anemia caused by a novel homozygous mutation, c.301C > A, (Q101K), in the AK1 gene in an Indian family."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        t-NGS revealed a homozygous variant (c.301C > A, p. Gln101Lys) in the

mechanistic_hypotheses:
- hypothesis_group_id: ak1_loss_sufficient_for_hemolysis
  hypothesis_label: AK1 loss of function is sufficient to cause hemolysis
  status: CANONICAL
  description: >-
    Biallelic AK1 variants abolish or destabilize erythrocyte adenylate kinase,
    and that loss alone shortens red-cell survival. The model rests on
    segregation in recessive families, on the recurrence of independent AK1
    alleles in unrelated patients with hemolysis, and on recombinant enzymes
    that show each tested disease allele to be catalytically crippled or
    unstable. It does not yet name the step between the enzyme defect and
    red-cell destruction.
  evidence:
  - reference: PMID:17662886
    reference_title: "Erythrocyte adenylate kinase deficiency: characterization of recombinant mutant forms and relationship with nonspherocytic hemolytic anemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The altered properties displayed by the mutant enzymes support the
      cause-effect relationship between AK1 mutations and hemolytic anemia.
    explanation: >-
      The authors of the recombinant-enzyme study conclude that the functional
      defects of five patient alleles support a causal role for AK1 variants.
- hypothesis_group_id: additional_defect_required_for_hemolysis
  hypothesis_label: Hemolysis requires a defect in addition to AK1 deficiency
  status: ALTERNATIVE
  description: >-
    Adenylate kinase deficiency is tolerated by the red cell, and hemolysis
    appears only when a second lesion is present: another phosphotransferase
    defect, a co-inherited enzymopathy such as G6PD deficiency, or a
    hemoglobinopathy. The model rests on a sibling with equally profound
    enzyme deficiency and no hemolysis, on residual adenine nucleotide
    turnover in enzyme-null red cells, and on the more severe anemia of
    patients who also carry G6PD deficiency or thalassemia.
  evidence:
  - reference: PMID:6308059
    reference_title: "Metabolic compensation for profound erythrocyte adenylate kinase deficiency. A hereditary enzyme defect without hemolytic anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A child with hemolytic anemia was found to have severe erythrocyte
      adenylate kinase (AK) deficiency, but an equally enzyme-deficient sibling
      had no evidence of hemolysis.
    explanation: >-
      Discordance for hemolysis between two equally enzyme-deficient siblings is
      the primary observation behind the two-defect model.
  - reference: PMID:1646049
    reference_title: "Hereditary erythrocyte adenylate kinase deficiency: a defect of multiple phosphotransferases?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These additional biochemical defects in the AK-deficient RBC further
      support the concept that AK deficiency per se may not cause hemolytic
      anemia.
    explanation: >-
      A second kindred study reached the same conclusion from additional
      phosphotransferase abnormalities in the deficient red cells.
  notes: >-
    Neither of the two supporting studies had a molecular diagnosis; both
    predate AK1 sequencing in this disease, so the genotype of the
    non-hemolyzing sibling is unknown.
- hypothesis_group_id: neuronal_ak1_deficiency
  hypothesis_label: Neurodevelopmental features arise from AK1 loss in neurons
  status: EMERGING
  description: >-
    Intellectual disability and psychomotor impairment in a subset of patients
    result from loss of AK1 phosphotransfer in the brain, where AK1 is highly
    expressed, and are not secondary to anemia or neonatal hyperbilirubinemia.
    The model is supported only by the association of neurological features
    with absent or very low enzyme activity; no patient brain tissue, neuronal
    model, or imaging correlate has been reported.
  evidence:
  - reference: PMID:40016400
    reference_title: "Novel AK-1 gene variants combined with thalassemia causing rare hereditary non-spherocytic hemolytic anemia in a Chinese family."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      To date, five cases of neuromotor disorders have been reported, all
      exhibiting extremely low or absent AK enzyme activity.
    explanation: >-
      A literature tabulation associates neurological involvement with the most
      severe enzyme deficiency, which is the correlation the neuronal model is
      built on; it does not show a neuronal mechanism.
pathophysiology:
- name: AK1 Nucleotide-Binding Site Variants
  description: >-
    Missense and single-residue deletion alleles that alter residues lining the
    AMP and ATP sites of AK1. AK1 is a 194-residue monomer with a central CORE
    domain, an NMP-binding domain (residues 38-67) and a LID domain (residues
    131-141) that close over the two nucleotides during phosphoryl transfer.
    In the crystal structure of human AK1 with the bisubstrate analog Ap5A
    (PDB 1Z83, chain A; distances computed for this entry), Gly40 (3.5 A),
    Gly64 (4.4 A), Arg97 (3.5 A), Gln101 (3.1 A), Arg128 (3.4 A), Arg138
    (3.2 A) and Asp140 (4.0 A) all lie within 4.5 A of the ligand, and Gln24
    sits 5.2 A away on the helix that follows the phosphate-binding loop. The
    recombinant Gly40Arg, Gly64Arg, Arg128Trp and Asp140del enzymes retain
    about one ten-thousandth of wild-type catalytic efficiency, and Arg97Trp
    loses about 89% of catalytic efficiency with weakened binding of all three
    nucleotides. These are loss-of-function alleles; affected individuals are
    homozygous or compound heterozygous and carriers are healthy, so there is
    no evidence of a dominant-negative or gain-of-function effect.
  biological_scale: MOLECULAR
  gene:
    preferred_term: AK1
    term:
      id: hgnc:361
      label: AK1
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    allele_type: missense or in-frame deletion
    description: >-
      Biallelic (homozygous or compound heterozygous) alleles Gln24Arg,
      Gly40Arg, Gly64Arg, Arg97Trp, Gln101Lys, Arg128Trp, Arg138His and
      Asp140del.

      component U4atac snRNA.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified four point mutations in the U4atac snRNA component of the
      minor spliceosome in patients with brain and bone malformations and
      unexplained postnatal death
    explanation: >-
      Independent, simultaneously published gene-discovery evidence in TALS.
  - reference: PMID:24865609
    reference_title: >-
      Biochemical defects in minor spliceosome function in the developmental
      disorder MOPD I.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We find that only one mutation, 124G>A, leads to significantly reduced
      expression of U4atac snRNA, whereas four mutations, 30G>A, 50G>A, 50G>C
      and 51G>A, show impaired binding of essential protein components of the
      U4atac/U6atac di-snRNP in vitro and in vivo.
    explanation: >-
      Establishes two distinct molecular modes of action across the variant
      spectrum.

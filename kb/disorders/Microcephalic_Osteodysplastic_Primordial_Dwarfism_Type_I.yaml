  - reference: PMID:21474760
    reference_title: >-
      Mutations in U4atac snRNA, a component of the minor spliceosome, in the
      developmental disorder MOPD I.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By means of homozygosity mapping and deep sequencing, we show that a gene
      encoding U4atac snRNA, a component of the minor U12-dependent spliceosome,
      is mutated in individuals with microcephalic osteodysplastic primordial
      dwarfism type I (MOPD I), a severe developmental disorder characterized by
      extreme intrauterine growth retardation and multiple organ abnormalities.
    explanation: >-
      Gene-discovery evidence establishing RNU4ATAC/U4atac as the causal locus.
  - reference: PMID:21474761

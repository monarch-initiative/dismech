- name: Minor Spliceosome Tri-snRNP Assembly Failure
  description: >-
    Destabilized U4atac reduces formation of the U4atac/U6atac.U5 tri-snRNP,
    the catalytic core of the minor spliceosome. Patient fibroblasts and iPS
    cells homozygous for the common n.51G>A allele show reduced tri-snRNP
    levels, and the resulting splicing defect is a direct consequence of that
    assembly failure rather than of reduced snRNA transcription.

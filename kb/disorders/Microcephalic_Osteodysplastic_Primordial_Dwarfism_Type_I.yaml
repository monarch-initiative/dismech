    modifier: ABNORMAL
  - preferred_term: cell population proliferation
    term:
      id: GO:0008283
      label: cell population proliferation
    modifier: DECREASED
  downstream:
  - target: Extreme Intrauterine Growth Restriction
    description: >-
      Prenatal arm of the proliferation deficit across tissues.
  - target: Postnatal Growth Failure and Short Stature
    description: >-
      Postnatal arm of the same deficit; there is no catch-up phase.
  - target: Severe Microcephaly
    description: >-
      Neural progenitor populations are among the most
      proliferation-dependent, which is why the brain deficit is disproportionate.
  - target: Structural Brain Malformation
    description: >-
      Failure of progenitor expansion during corticogenesis.
  - target: Abnormal Cortical Gyration
    description: >-
      Consequence of reduced cortical neuron output and disturbed progenitor
      dynamics.
  - target: Corpus Callosum Malformation
    description: >-
      Commissural axon guidance depends on the cell populations this node
      describes; grouped with the other structural brain findings.
  - target: Cerebellar Vermis Hypoplasia
    description: >-
      Cerebellar granule progenitors are highly proliferative; grouped with
      the other structural brain findings.
  - target: Cognitive Impairment
    description: >-
      Functional consequence of the structural brain deficits.
  - target: Seizures
    description: >-
      Grouped with the cortical malformations, which are the usual substrate
      for the epilepsy in this disorder.
  - target: Skeletal Dysplasia
    description: >-
      Growth-plate chondrocyte proliferation shares the same deficit, giving
      the osteodysplastic component of the name.
  - target: Facial Dysmorphism
    description: >-
      Craniofacial consequence of impaired progenitor proliferation; no
      specific route is established.
  - target: Immunodeficiency
    description: >-
      Lymphoid development is minor-intron sensitive; in the milder RNU4ATAC
      phenotypes this arm dominates, and it is present here too.
  evidence:
  - reference: PMID:21474761
    reference_title: >-
      Association of TALS developmental disorder with defect in minor splicing
      component U4atac snRNA.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Expression of a subgroup of genes, possibly linked to the disease
      phenotype, and minor intron splicing were affected in cell lines derived
      from TALS patients.
    explanation: >-
      Links the minor splicing defect in patient cells to altered expression of
      a disease-relevant gene subgroup.
  - reference: PMID:21474761
    reference_title: >-
      Association of TALS developmental disorder with defect in minor splicing
      component U4atac snRNA.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our findings demonstrate a crucial role of the minor spliceosome component
      U4atac snRNA in early human development and postnatal survival.
    explanation: >-
      Connects the molecular lesion to the developmental and survival phenotype.
  - reference: PMID:21979914
    reference_title: Mechanisms and pathways of growth failure in primordial dwarfism.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      mRNA splicing (U4atac), and centrosome function (CEP152, PCNT, and CPAP)
    explanation: >-
      Places U4atac in the mRNA-splicing class of microcephalic primordial
      dwarfism genes, distinct from the centrosomal class that includes PCNT
      (MOPD II).

genetic:
- name: RNU4ATAC
  gene_term:
    preferred_term: RNU4ATAC
    term:
      id: hgnc:34016
      label: RNU4ATAC
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    RNU4ATAC (2q14.2) is a single-copy, non-protein-coding gene encoding the
    U4atac small nuclear RNA of the minor spliceosome. All reported pathogenic
    variants are single-nucleotide substitutions clustering in the 5' stem-loop
    and Stem II structural domains. n.51G>A is an Old Order Amish founder allele
    and the most frequently reported pathogenic variant. Allele combination is
    the principal determinant of where an individual falls on the RNU4ATAC
    spectrum: variants that overlap MOPD I-implicated structural elements paired
    with a milder second allele shift the phenotype toward Roifman or Lowry-Wood
    syndrome. Because complete U4atac loss is expected to be lethal, disease
    alleles are hypomorphic.
  evidence:
  - reference: PMID:21474760
    reference_title: >-
      Mutations in U4atac snRNA, a component of the minor spliceosome, in the
      developmental disorder MOPD I.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Functional assays showed that mutations (30G>A, 51G>A, 55G>A, and 111G>A)
      associated with MOPD I cause defective U12-dependent splicing.
    explanation: >-
      Names the founding MOPD I variant set and demonstrates their functional
      consequence.
  - reference: PMID:26522830
    reference_title: >-
      Compound heterozygous mutations in the noncoding RNU4ATAC cause Roifman
      Syndrome by disrupting minor intron splicing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Strikingly, all six of the Roifman Syndrome cases have one variant that
      overlaps MOPD1-implicated structural elements, while the other variant
      overlaps a highly conserved structural element not previously implicated
      in disease.
    explanation: >-
      Supports allele combination as the determinant of position on the
      RNU4ATAC phenotypic spectrum.
has_subtypes:
- name: MOPD III
  display_name: MOPD type III (historical designation)
  description: >-
    MOPD type III was originally described as a separate entity from MOPD I on
    radiological criteria (small differences in pelvic and long bone structure).
    It is now regarded as a different mode of expression of the same syndrome,
    caused by the same gene, and is subsumed here rather than curated as a
    separate dismech entry. Orphanet and MONDO both carry a combined
    "MOPD types I and III" concept (MONDO:0016994) reflecting this merge. No
    PMID-citable abstract stating the MOPD I / MOPD III merge was recoverable
    during this curation session, so this subtype carries no evidence item; the
    merge is documented in the MONDO:0016994 term definition (sourced to
    Orphanet:2636) and in the GeneReviews "MOPD type I/III" naming convention.
  subtype_term:
    preferred_term: microcephalic osteodysplastic primordial dwarfism, type 3
    term:
      id: MONDO:0008873
      label: microcephalic osteodysplastic primordial dwarfism, type 3
progression:
- phase: Prenatal-onset deficit with historically infantile-lethal course
  notes: >-
    Growth restriction, microcephaly, and brain malformation are established
    prenatally and are already complete at birth. The course is chronic and
    non-remitting, punctuated by acute neurologic events precipitated by
    physiologic stress. Historically MOPD I has been lethal in infancy or early
    childhood, with death from overwhelming infection or acute neurologic
    events; GeneReviews notes that adults with RNU4atac-opathy have now been
    reported, so survival is genotype- and management-dependent rather than
    uniformly infantile-lethal. The HPO term for death in infancy
    (HP:0001522) sits in the Mortality/Aging branch rather than under Phenotypic
    abnormality, so this natural-history claim is curated here rather than as a
    phenotype.
  evidence:
  - reference: PMID:21474760
    reference_title: >-
      Mutations in U4atac snRNA, a component of the minor spliceosome, in the
      developmental disorder MOPD I.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The main features of MOPD I patients are extreme intrauterine growth
      retardation, abnormalities in multiple organs, and death in infancy or
      early childhood
    explanation: >-
      States death in infancy or early childhood as a main feature of MOPD I.
  - reference: PMID:21474761
    reference_title: >-
      Association of TALS developmental disorder with defect in minor splicing
      component U4atac snRNA.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified four point mutations in the U4atac snRNA component of the
      minor spliceosome in patients with brain and bone malformations and
      unexplained postnatal death
    explanation: >-
      Independent documentation of unexplained postnatal death in the TALS
      cohort.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    MOPD I is among the rarest forms of primordial dwarfism; no population-based
    prevalence estimate exists, and the published experience consists of case
    reports and small series plus an Old Order Amish founder cohort. The Amish
    n.51G>A founder allele produces locally elevated carrier frequency: it was found in 16 of 281 Ohio Amish controls but in none of 180
    Pennsylvania Amish controls.
  evidence:
  - reference: PMID:21474760
    reference_title: >-
      Mutations in U4atac snRNA, a component of the minor spliceosome, in the
      developmental disorder MOPD I.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This mutation was found in 16/281 Ohio Amish controls but in none of 180
      Pennsylvania Amish controls.
    explanation: >-
      Documents the geographically restricted Amish founder-allele carrier
      frequency.
diagnosis:
- name: Molecular Genetic Testing of RNU4ATAC
  description: >-
    Diagnosis is established in a proband with suggestive findings by
    identification of biallelic pathogenic or likely pathogenic RNU4ATAC
    variants. Because RNU4ATAC is a small non-coding gene, standard exome
    capture may under-represent it, so a targeted or genome-based approach may
    be required when the diagnosis is not clinically suspected.
  evidence:
  - reference: PMID:36795902
    reference_title: "RNU4atac-opathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of RNU4atac-opathy is established in a proband with
      suggestive findings and biallelic pathogenic (or likely pathogenic)
      variants in RNU4ATAC identified by molecular genetic testing.
    explanation: >-
      GeneReviews diagnostic criterion.
- name: Antenatal Ultrasound Recognition
  description: >-
    Severe intrauterine growth restriction with microcephaly and brain
    malformation can be recognized antenatally, allowing the diagnosis to be
    suspected before birth in informative pregnancies.
  evidence:
  - reference: PMID:27040866
    reference_title: Refining the phenotypical and mutational spectrum of Taybi-Linder syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We provide antenatal descriptions of this rare syndrome including unusual
      features found in two twin foetuses with compound heterozygosity for two
      rare mutations who presented with mild intrauterine growth retardation and
      atypical dysmorphic facial features.
    explanation: >-
      Documents antenatal characterization of TALS, including atypical
      presentations that widen the antenatal differential.
treatments:
- name: Multidisciplinary Supportive Care
  description: >-
    There is no disease-modifying therapy. Care is supportive and
    multidisciplinary, aimed at quality of life, function, and complication
    reduction — notably orthopedic monitoring of the skeletal dysplasia and
    immunologic management, including immunoglobulin replacement where
    indicated, to avoid life-threatening infections.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:36795902
    reference_title: "RNU4atac-opathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This ideally involves multidisciplinary care by specialists in relevant
      fields, including orthopedists to monitor the associated skeletal
      dysplasia and immunologists to manage antibiotic treatment of infections
      and use of immunoglobulin replacement therapy as indicated to avoid
      life-threatening infections.
    explanation: >-
      GeneReviews treatment-of-manifestations statement.
- name: Immunologic Evaluation Before Live Vaccines
  description: >-
    Because immunodeficiency occurs across the RNU4ATAC spectrum, GeneReviews
    directs that immunologic evaluation be performed before any live vaccine is
    administered. This is a safety precaution rather than a therapy.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:36795902
    reference_title: "RNU4atac-opathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Perform immunologic evaluation prior to administration of live vaccines.
    explanation: >-
      Records the GeneReviews agents/circumstances-to-avoid instruction.
- name: Minimization of Physiologic Stress and Anesthesia
  description: >-
    For individuals with MOPD I specifically, medically stressful situations —
    including anesthesia — should be minimized because of the risk of
    energy-related strokes. This is a disease-specific perioperative safety
    warning.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Stroke
    term:
      id: HP:0001297
      label: Stroke
  evidence:
  - reference: PMID:36795902
    reference_title: "RNU4atac-opathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For those with MOPDI, minimize medically stressful situations as much as
      possible, including stress during anesthesia, due to energy-related
      strokes.
    explanation: >-
      Records the MOPD I-specific GeneReviews agents-to-avoid warning verbatim.
- name: Genetic Counseling
  description: >-
    Counseling for autosomal recessive recurrence risk, with carrier testing for
    at-risk relatives and prenatal or preimplantation genetic testing available
    once the familial RNU4ATAC variants are known. Counseling should include the
    observation that siblings with identical genotypes can differ clinically.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:36795902
    reference_title: "RNU4atac-opathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Once the RNU4ATAC pathogenic variants have been identified in an affected
      family member, carrier testing for at-risk relatives and
      prenatal/preimplantation genetic testing are possible.
    explanation: >-
      GeneReviews genetic-counseling statement.
differential_diagnoses:
- name: Microcephalic Osteodysplastic Primordial Dwarfism Type II
  description: >-
    The other numbered MOPD entity. Despite the shared clinical name and shared
    membership in the microcephalic primordial dwarfism group, MOPD II is a
    mechanistically unrelated disorder caused by biallelic PCNT loss of
    function, a centrosomal rather than spliceosomal lesion. It is the single
    most important differential because the names invite conflation.
  disease_term:
    preferred_term: microcephalic osteodysplastic primordial dwarfism type II
    term:
      id: MONDO:0008872
      label: microcephalic osteodysplastic primordial dwarfism type II
  distinguishing_features:
  - MOPD I has profound cognitive impairment; MOPD II has near-normal intelligence
  - MOPD I has structural brain malformation; the MOPD II brain is small but structurally unremarkable
  - MOPD I is historically lethal in infancy or early childhood; MOPD II permits survival into adulthood
  - MOPD II carries a distinctive later-onset vasculopathy, abnormal dentition, and insulin resistance not characteristic of MOPD I
  - Causal gene differs (RNU4ATAC vs PCNT), as does the cellular mechanism (minor spliceosome vs centrosome)
  evidence:
  - reference: PMID:21979914
    reference_title: Mechanisms and pathways of growth failure in primordial dwarfism.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      mRNA splicing (U4atac), and centrosome function (CEP152, PCNT, and CPAP)
    explanation: >-
      Places U4atac (MOPD I) and PCNT (MOPD II) in distinct mechanistic classes
      within the same clinical group, which is the basis for curating them as
      separate entries.
- name: Roifman Syndrome
  description: >-
    An allelic RNU4ATAC disorder at the milder end of the same spectrum,
    characterized by growth retardation, cognitive delay, spondyloepiphyseal
    dysplasia, and antibody deficiency. It is distinguished from MOPD I by
    milder growth and cognitive involvement and by prominent humoral
    immunodeficiency, and typically arises from compound heterozygosity pairing
    a MOPD I-type structural variant with a milder second allele. Curated as a
    separate dismech entry (Roifman-syndrome).
  disease_term:
    preferred_term: Roifman syndrome
    term:
      id: MONDO:0014722
      label: Roifman syndrome
  distinguishing_features:
  - Roifman syndrome has prominent antibody deficiency as a defining feature
  - Growth and cognitive involvement are milder than in MOPD I
  - Spondyloepiphyseal dysplasia rather than the severe MOPD I skeletal dysplasia
  - Typically compound heterozygous, pairing a MOPD I-implicated structural element variant with a milder allele
  evidence:
  - reference: PMID:26522830
    reference_title: >-
      Compound heterozygous mutations in the noncoding RNU4ATAC cause Roifman
      Syndrome by disrupting minor intron splicing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RNU4ATAC rare variants have been recently reported to cause microcephalic
      osteodysplastic primordial dwarfism, type I (MOPD1), whose phenotype is
      distinct from Roifman Syndrome.
    explanation: >-
      States explicitly that the Roifman and MOPD I phenotypes are distinct
      despite being allelic.
  - reference: PMID:26522830
    reference_title: >-
      Compound heterozygous mutations in the noncoding RNU4ATAC cause Roifman
      Syndrome by disrupting minor intron splicing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Roifman Syndrome is a rare congenital disorder characterized by growth
      retardation, cognitive delay, spondyloepiphyseal dysplasia and antibody
      deficiency.
    explanation: >-
      Defines the Roifman clinical picture used as the discriminator.
- name: Lowry-Wood Syndrome
  description: >-
    The third allelic RNU4ATAC presentation, defined by multiple epiphyseal
    dysplasia, microcephaly, and retinal dystrophy, with milder growth
    restriction than MOPD I. Its genetic cause was established by identification
    of biallelic RNU4ATAC variants in affected individuals.
  disease_term:
    preferred_term: Lowry-Wood syndrome
    term:
      id: MONDO:0009191
      label: Lowry-Wood syndrome
  distinguishing_features:
  - Multiple epiphyseal dysplasia is the characteristic skeletal pattern
  - Milder growth restriction and cognitive involvement than MOPD I
  - Retinal dystrophy is a defining feature
  evidence:
  - reference: PMID:29265708
    reference_title: >-
      The expanding phenotype of RNU4ATAC pathogenic variants to Lowry Wood
      syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe three patients with Lowry Wood syndrome with biallelic
      RNU4ATAC pathogenic variants.
    explanation: >-
      Establishes Lowry-Wood syndrome as an RNU4ATAC-related disorder.
  - reference: PMID:29265708
    reference_title: >-
      The expanding phenotype of RNU4ATAC pathogenic variants to Lowry Wood
      syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Characteristic features include multiple epiphyseal dysplasia and
      microcephaly.
    explanation: >-
      Names the discriminating skeletal feature.
- name: Joubert Syndrome
  description: >-
    Biallelic RNU4ATAC variants — specifically the Stem II n.16G>A allele — have
    been reported in individuals presenting with Joubert-syndrome-like features,
    reflecting the secondary ciliary dysfunction arm of the disease. RNU4ATAC
    therefore belongs in the differential for a Joubert-like presentation that
    also carries TALS-spectrum features.
  disease_term:
    preferred_term: Joubert syndrome
    term:
      id: MONDO:0018772
      label: Joubert syndrome
  distinguishing_features:
  - RNU4ATAC-related Joubert-like presentations also carry TALS/Roifman/Lowry-Wood spectrum features
  - All five reported cases carried the n.16G>A Stem II allele
  evidence:
  - reference: PMID:36802443
    reference_title: >-
      Deficiency of the minor spliceosome component U4atac snRNA secondarily
      results in ciliary defects in human and zebrafish.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report bi-allelic RNU4ATAC mutations in five patients presenting
      with traits suggestive of the Joubert syndrome (JBTS), a well-characterized
      ciliopathy.
    explanation: >-
      Documents the Joubert-like presentation within the RNU4ATAC spectrum.
  - reference: PMID:36802443
    reference_title: >-
      Deficiency of the minor spliceosome component U4atac snRNA secondarily
      results in ciliary defects in human and zebrafish.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Intriguingly, all five patients carry the n.16G>A mutation, in the Stem II
      domain, either at the homozygous or compound heterozygous state.
    explanation: >-
      Ties the Joubert-like presentation to a specific allele.
discussions:
- discussion_id: mopd1_zebrafish_hypomorph_translation
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the u4atac zebrafish model faithfully represent human MOPD I, given
    that complete deletion of zebrafish rnu4atac is embryonic-lethal and the
    informative phenotypes come from graded hypomorphic knockdown rather than
    from a genotype matching a human patient?
  attaches_to:
  - "pathophysiology#Secondary Primary Cilium Dysfunction"
  rationale: >-
    The zebrafish work is the strongest in vivo support for the ciliary arm of
    RNU4ATAC disease, but its design is dose-titration of an essential gene
    rather than modeling of a specific patient allele, and the human phenotypes
    it reproduces best (pronephric cysts, otolith defects, body-axis curvature)
    are not the phenotypes that dominate human MOPD I (microcephaly, skeletal
    dysplasia, growth restriction). Whether the ciliary mechanism carries the
    same weight in human brain and skeletal development as it does in the fish
    phenotypes is therefore an open translational question, not a settled one.
  proposed_experiments:
  - experiment_id: mopd1_allele_specific_cilium_readout
    name: Allele-specific ciliary and progenitor readouts in human cells
    description: >-
      Compare primary cilium function and neural progenitor behavior across
      isogenic human cell and organoid lines carrying the individual RNU4ATAC
      alleles (n.51G>A, n.55G>A, n.16G>A, n.124G>A) to test whether ciliary
      impairment tracks with position on the human phenotypic spectrum, and
      whether it contributes to the microcephaly and skeletal phenotypes rather
      than only to the Joubert-like traits.
- discussion_id: mopd1_minor_intron_effector_genes
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which specific minor-intron-containing genes mediate the microcephaly and
    skeletal dysplasia of MOPD I, and why do those tissues bear the brunt when
    the splicing lesion is ubiquitous?
  attaches_to:
  - "pathophysiology#Impaired Development of Proliferative and Ciliated Cell Populations"
  rationale: >-
    The proximal molecular defect is established with unusual clarity, but the
    step from genome-wide minor-intron mis-splicing to the specific
    brain-and-bone phenotype is inferred from the functional enrichment of
    minor-intron-containing genes rather than demonstrated for named effectors.
    Transcriptomic work moreover shows that mRNA levels are mostly unchanged, so
    a simple dosage model of the intervening step is not supported.
  proposed_experiments:
  - experiment_id: mopd1_effector_gene_mapping
    name: Tissue-resolved minor intron retention mapping
    description: >-
      Map minor intron retention in human fetal cortex and growth plate versus
      other tissues, and test candidate effector genes by isolated perturbation,
      to identify which minor-intron-containing transcripts are both
      preferentially affected and sufficient to produce the tissue phenotype.
notes: >-
  MOPD I and MOPD type II share a clinical name and a place in the microcephalic
  primordial dwarfism group but are distinct diseases with distinct genes
  (RNU4ATAC vs PCNT), distinct mechanisms (minor spliceosome vs centrosome),
  distinct natural histories, distinct MONDO and OMIM identifiers, and separate
  GeneReviews chapters. They are therefore curated as two dismech entries, not
  one; see the differential_diagnoses block and the
  Microcephalic_Osteodysplastic_Primordial_Dwarfism_Type_II entry.

  Scope of this entry: MOPD III is subsumed here as a historical subtype
  (see has_subtypes), following the Orphanet/MONDO "MOPD types I and III"
  merge (MONDO:0016994). Roifman syndrome and Lowry-Wood syndrome are allelic
  RNU4ATAC disorders but are kept OUT of this entry and recorded as
  differential diagnoses, because they are clinically distinct entities with
  their own MONDO terms; the umbrella "RNU4atac-opathy" concept used by
  GeneReviews spans all three and would be a candidate for a separate dismech
  Grouping rather than for blending into this Disease entry.

  Sparse/absent hair (HP:0008070) and dry skin (HP:0000958) appear in the
  deep-research report as "Common" and were requested in PR review, but they are
  NOT curated here: no cached reference in this entry's citation set contains a
  quotable statement of them. The specific quote proposed in review
  ("absent or sparse hair", attributed to PMID:26522830) does not occur in that
  cached abstract, which is about Roifman syndrome and does not mention hair. The
  hair/skin finding that IS attestable in RNU4ATAC-confirmed MOPD I is
  pigmentary rather than structural — yellowish-gray hair and unusually fair
  complexion with abnormal melanin function — and is curated as the
  "Hair Hypopigmentation", "Skin Hypopigmentation", and "Fundus
  Hypopigmentation" phenotypes from PMID:21990275 and PMID:23794361 — the three
  arms of the pigmentary triad both sources describe together.

  No frequency band is asserted on any of the three pigmentary phenotypes. The
  only denominators available are two small series from a single group
  (five patients and a sib pair), and PMID:21990275 reports the pigmentary
  finding as newly associated with MOPD I, so there is no basis for a
  disease-level rate. Per docs/frequency-evidence-guidelines.md, frequency is
  omitted rather than derived from a within-series proportion that would not
  generalize. An earlier revision of this entry asserted OCCASIONAL on a
  "two of five" derivation, which is arithmetically 40% and therefore the
  FREQUENT band — that justification was wrong and has been removed rather than
  reworded. If a citable source for structural hair sparsity is identified,
  it should be added as a separate phenotype.

  Deep-research provenance: research/Microcephalic_Osteodysplastic_Primordial_Dwarfism_Type_I-deep-research-claude_code.md
  (claude_code provider; the falcon/Edison provider returned HTTP 402 Payment
  Required and could not be run). Errors in that report caught during curation:
  the MONDO ID (report said MONDO:0009338; the correct term verified with OAK is
  MONDO:0008871), and the claim that GeneReviews chapters carry no PMID (the
  RNU4atac-opathy chapter is PMID:36795902, fetched and cited here). Several
  HPO terms suggested by the report were also wrong on verification and were not
  used (HP:0007099 is Chiari type I malformation, not lissencephaly; HP:0003021
  is metaphyseal cupping, not hip dislocation; HP:0001377 is limited elbow
  extension; HP:0002850 is decreased circulating total IgM). The report's
  iPSC cerebral-organoid spindle-orientation finding was NOT curated as
  pathophysiology because its only source is an unrefereed bioRxiv preprint with
  no PMID; the open question it bears on is recorded as a KNOWLEDGE_GAP
  discussion instead.

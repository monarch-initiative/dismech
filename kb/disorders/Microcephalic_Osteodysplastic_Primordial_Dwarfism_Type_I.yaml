name: Microcephalic Osteodysplastic Primordial Dwarfism Type I
creation_date: "2026-07-31T00:00:00Z"
description: >-
  Microcephalic osteodysplastic primordial dwarfism type I (MOPD I, Taybi-Linder
  syndrome / TALS) is a severe autosomal recessive microcephalic primordial
  dwarfism caused by biallelic variants in RNU4ATAC, the non-coding gene
  encoding the U4atac small nuclear RNA of the minor (U12-dependent)
  spliceosome. The variants destabilize U4atac and impair assembly of the
  U4atac/U6atac.U5 tri-snRNP, so the ~700 human genes carrying a U12-type
  (minor) intron are misspliced while major-spliceosome splicing is spared.
  Because minor-intron-containing genes are enriched for fundamental processes
  including cell-cycle control, DNA replication and repair, and cilium
  assembly, the consequence is extreme intrauterine growth restriction, severe
  microcephaly with structural brain malformation, skeletal dysplasia, profound
  cognitive impairment, variable immunodeficiency and ophthalmologic
  involvement, and — historically — death in infancy or early childhood. The historically separate MOPD type III
  is now regarded as the same entity, and MOPD I sits at the severe end of the
  RNU4ATAC spectrum ("RNU4atac-opathy") that also includes Roifman syndrome and
  Lowry-Wood syndrome. It is mechanistically unrelated to MOPD type II, which
  is a PCNT centrosomal disorder.

  - reference: PMID:36802443
    reference_title: >-
      Deficiency of the minor spliceosome component U4atac snRNA secondarily
      results in ciliary defects in human and zebrafish.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      as well as by u4atac zebrafish model, which exhibits ciliopathy-related
      phenotypes and ciliary defects
    explanation: >-
      Zebrafish model evidence for the ciliary arm, split from the patient-cell
      half of the same sentence.
  - reference: PMID:36802443
    reference_title: >-
      Deficiency of the minor spliceosome component U4atac snRNA secondarily
      results in ciliary defects in human and zebrafish.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Altogether, our data indicate that alteration of cilium biogenesis is part
      of the physiopathological mechanisms of TALS/RFMN/LWS, secondarily to

classifications:
  isds_skeletal_category:
  - classification_value: primordial_dwarfism_and_slender_bones
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 21 "Primordial dwarfism and slender bone
      dysplasias", NOS 21-0080 "Microcephalic osteodysplastic primordial
      dwarfism, RNU4ATAC-related" (OMIM 210710). This re-verifies against the
      2023 table an assignment first taken from the 2019 revision (Mortier et
      al., PMID:31633310), Table 1 group 19 "Primordial dwarfism and slender
      bones group", listed there as "Microcephalic osteodysplastic primordial
      dwarfism type 1/3 (MOPD1)". Both revisions treat MOPD I and the
      historically separate MOPD III as one entity, which is the scope this
      entry curates. RNU4ATAC's other two phenotypes are listed separately and
      must not be folded in: Roifman syndrome at NOS 21-0090, curated as its
      own dismech entry, and Lowry-Wood syndrome, which the 2023 revision moved
      out of this group altogether to group 9, NOS 09-0110 "Multiple epiphyseal
      dysplasia with microcephaly and nystagmus (Lowry-Wood syndrome),
      RNU4ATAC-related". A shared gene is not a shared group here.
pathophysiology:
- name: Biallelic RNU4ATAC Variants Destabilizing U4atac snRNA
  description: >-
    Pathogenic variants in RNU4ATAC (2q14.2) are single-nucleotide substitutions
    in a non-protein-coding snRNA gene, clustering in two structurally critical
    regions of U4atac — the 5' stem-loop (n.30G>A, n.50G>A/C, n.51G>A, n.55G>A;
    n.51G>A is an Old Order Amish founder allele) and the Stem II domain
    (n.16G>A, n.111G>A, n.124G>A). Most act by disrupting the snRNA's secondary
    structure and its binding of essential di-snRNP protein components; n.124G>A
    acts differently, by reducing U4atac abundance. Complete loss of U4atac is
    expected to be lethal, so disease alleles are hypomorphic rather than null.

    A 2026 reevaluation of every published RNU4ATAC case makes the
    genotype-phenotype relationship explicit and gives it a structural basis:
    genotypes in which the variants are located *exclusively* in the 5'
    stem-loop produce the severe, lethal MOPD I end of the spectrum, while a
    genotype carrying at least one variant that spares the 5' stem-loop gives a
    milder phenotype with later onset - Roifman or Lowry-Wood syndrome. The
    reason is that the 5' stem-loop is where U4atac binds the essential
    di-snRNP proteins NHP2L1 and PRPF31, so sparing it preserves partial
    function. This is the single most useful predictive rule in the
    RNU4ATAC-opathies, and it is why the three disorders are separate dismech
    entries rather than subtypes of one.

    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      A gene ontology term enrichment analysis on minor intron-containing genes
      reveals that the cilium assembly process is over-represented, with no less
      than 86 cilium-related genes containing at least one minor intron, among
      which there are 23 ciliopathy-related genes.
    explanation: >-
      Provides the transcript-level basis for a ciliary consequence of minor
      splicing failure. This is an in-silico gene-set enrichment analysis with no
      wet-lab component, so it is classified COMPUTATIONAL.
  - reference: PMID:36802443
    reference_title: >-
      Deficiency of the minor spliceosome component U4atac snRNA secondarily
      results in ciliary defects in human and zebrafish.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The link between RNU4ATAC mutations and ciliopathy traits is supported by

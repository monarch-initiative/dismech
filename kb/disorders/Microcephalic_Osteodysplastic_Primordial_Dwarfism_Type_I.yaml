    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Endogenous U12-dependent but not U2-dependent introns were found to be
      poorly spliced in MOPD I patient fibroblast cells.
    explanation: >-
      Demonstrates the selectivity of the splicing defect for minor introns.
  - reference: PMID:21474760
    reference_title: >-
      Mutations in U4atac snRNA, a component of the minor spliceosome, in the
      developmental disorder MOPD I.
    supports: SUPPORT

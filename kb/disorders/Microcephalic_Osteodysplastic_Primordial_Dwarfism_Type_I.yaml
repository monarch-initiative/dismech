    explanation: >-
      States explicitly that the ciliary defect is secondary to the minor
      splicing defect, which is why it is modeled downstream here.

- name: Impaired Development of Proliferative and Ciliated Cell Populations
  description: >-
    Because minor introns are concentrated in genes governing DNA replication
    and repair, transcription, RNA processing, and translation, minor splicing
    failure compromises the cell populations most dependent on those processes
    during embryogenesis — cortical neural progenitors and growth plate
    chondrocytes above all. The result is the combined brain-and-bone phenotype:
    severe microcephaly with structural cortical malformation and a generalized
    skeletal dysplasia, on a background of extreme prenatal growth restriction.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:

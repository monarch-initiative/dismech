    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Concerning RNU4ATAC-mutated patients, we show that as expected, they
      display distinct U12-type intron splicing profiles compared to controls,
      but that rather unexpectedly mRNA expression levels are mostly unchanged.
    explanation: >-
      Transcriptome-wide characterization showing the lesion is at the level of
      splicing rather than transcript abundance.
  downstream:
  - target: Impaired Development of Proliferative and Ciliated Cell Populations
  - target: Secondary Primary Cilium Dysfunction

- name: Secondary Primary Cilium Dysfunction
  description: >-
    Minor-intron-containing genes are significantly enriched for cilium assembly
    functions, so minor splicing failure secondarily impairs primary cilium
    biogenesis. This is supported by altered cilium function in patient
    fibroblasts and by a u4atac zebrafish model with ciliopathy-related
    phenotypes rescued by wild-type but not variant human U4atac, and it
    explains why some individuals with biallelic RNU4ATAC variants present with
    Joubert-syndrome-like features. This is a secondary (downstream) arm, not
    the primary lesion.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: cilium assembly
    term:
      id: GO:0060271
      label: cilium assembly
    modifier: DECREASED
  downstream:
  - target: Retinal Dystrophy
    description: >-
      Photoreceptor outer segments are modified primary cilia, so ciliary
      dysfunction is the direct route to the retinal phenotype.
  - target: Hair Hypopigmentation
    description: >-
      Grouped with the other hypopigmentation findings, which are
      characteristic of MOPD I; no mechanism has been established, and the
      ciliary attribution is provisional.
  - target: Skin Hypopigmentation
    description: >-
      As for hair hypopigmentation: characteristic but mechanistically
      unexplained.
  - target: Fundus Hypopigmentation
    description: >-
      As for the other hypopigmentation findings, and additionally part of the
      ocular involvement.
  - target: Stroke
    description: >-
      Reported in this disorder and grouped provisionally with the vascular
      arm. A cerebrovascular mechanism is established for the related PCNT
      disorder MOPD II but not for RNU4ATAC, so this edge records the
      association rather than a demonstrated route.

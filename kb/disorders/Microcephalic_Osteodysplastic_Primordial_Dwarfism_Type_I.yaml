    explanation: >-
      Links the assembly failure causally to the downstream splicing defect.
  downstream:
  - target: Defective U12-Type Minor Intron Splicing

- name: Defective U12-Type Minor Intron Splicing
  description: >-
    The functional consequence is selective mis-splicing of U12-type (minor)
    introns, present in roughly 700 human genes, while U2-dependent (major)
    intron splicing is unaffected. The defect is selective at the level of
    splicing rather than expression: transcriptomic analysis of TALS
    patient-derived cells shows distinct U12-type intron splicing profiles
    versus controls but largely unchanged mRNA levels. The specificity of the
    lesion is demonstrated by rescue — introducing wild-type U4atac into MOPD I
    cells restores U12-dependent splicing.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: skin fibroblast
    term:

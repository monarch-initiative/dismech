name: White-Sutton Syndrome
creation_date: "2026-07-31T00:00:00Z"
description: >-
  White-Sutton syndrome (WHSUS;
  intellectual disability-microcephaly-strabismus-behavioral abnormalities
  syndrome; OMIM 616364) is an autosomal dominant
  neurodevelopmental disorder caused by heterozygous, usually de novo,
  pathogenic variants in POGZ (1q21.3), most of which are sequence-classified as
  loss of function. POGZ encodes pogo transposable element-derived protein with
  zinc finger domain, a multidomain chromatin-binding nuclear protein that acts in
  transcriptional regulation and neuronal development. The phenotype spans a wide cognitive range, from learning
  difficulties with a distinctive dysexecutive/attentional profile through to
  severe intellectual disability, and is accompanied by developmental delay that
  is disproportionately marked in speech and language, hypotonia, autism spectrum
  disorder and other behavioural problems. Commonly reported additional features
  are seizures, refractive errors and strabismus, hearing loss, sleep disturbance
  (particularly obstructive sleep apnoea), feeding and gastrointestinal problems,
  mild male genital abnormalities and urinary tract involvement. Increased body
  mass index, craniofacial dysmorphism (microcephaly, broad forehead, midface
  hypoplasia, flat nasal bridge, triangular mouth) and structural brain
  malformations are also documented. In one referral diagnostic laboratory, POGZ
  variants accounted for roughly 0.14% of clinical exomes performed for
  neurological indications; that figure is a diagnostic yield, not population
  prevalence.
category: Mendelian
parents:
- Neurodevelopmental Disorder
- Syndromic Intellectual Disability
notes: >-
  Scope and disambiguation. POGZ is one of the most recurrently de novo mutated
  genes in large autism and neurodevelopmental-disorder exome studies, so the
  literature contains a great deal of generic ASD/chromatin-gene material in which
  POGZ appears only as one entry in a candidate-gene list. This entry is anchored
  on White-Sutton syndrome as a clinical entity (MONDO:0014606 / OMIM 616364), and
  evidence was taken from WHSUS-specific cohorts, case series and the GeneReviews
  chapter rather than from generic autism gene-discovery papers. POGZ also has a
  separate, unrelated literature as a homology-directed DNA-repair factor and in
  cancer contexts; that work was excluded.
  Module conformance. No module in kb/modules/ captures a
  chromatin/transcription-regulator neurodevelopmental chain. The existing
  neurodevelopmental modules
  specify machinery (microtubule motors, Reelin, centrosome/spindle, interneuron
  fate) that the POGZ evidence does not implicate.
  `epilepsy_excitation_inhibition_imbalance` was evaluated more seriously, because
  the Pogz mouse work shows elevated cell excitability whose compensatory
  inhibition rescues social deficits; it was still declined, because that finding
  concerns social behaviour in a mouse rather than a curated
  seizure-generation/epileptogenesis chain in humans, and the human epilepsy here
  is a frequent comorbidity rather than a modelled E/I mechanism. The excitability
  finding is instead curated as its own node with MODEL_ORGANISM evidence.

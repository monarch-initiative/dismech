discussions:
- discussion_id: whsus_allelic_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do pathogenic POGZ alleles act uniformly through haploinsufficiency, or do
    stable NMD-escaping truncations produce additional dominant-negative or
    gain-of-function effects that explain their greater clinical severity?
  attaches_to:
  - pathophysiology#Pathogenic POGZ Variant Dysfunction
  rationale: >-
    Heterozygous loss-of-function variants establish reduced POGZ activity as a
    major disease mechanism, but the strongest genotype-phenotype study found
    greater severity for truncations predicted to escape NMD and explicitly
    proposed dominant-negative or gain-of-function effects. That proposal is an
    inference from variant position and clinical severity, not a direct
    demonstration of mutant-transcript stability, truncated-protein abundance or
    altered chromatin occupancy. Resolving the allelic mechanism is important for
    interpreting genotype-severity associations and for deciding whether simple
    restoration of POGZ dosage would address all pathogenic allele classes.
  proposed_experiments:
  - experiment_id: whsus_isogenic_allelic_mechanism
    name: Isogenic comparison of NMD-triggering and NMD-escaping POGZ alleles
    description: >-
      Introduce representative NMD-triggering and NMD-escaping truncations into
      the same human iPSC background, differentiate them into neural progenitors
      and neurons, and compare allele-specific RNA, mutant-protein abundance,
      nuclear localisation, POGZ/HP1 chromatin occupancy, transcriptional output,
      neuronal differentiation and migration. Include correction of patient
      alleles and selective knockdown of the mutant transcript.
    decision_criterion: >-
      Phenotypes proportional to total functional POGZ dosage and rescued by
      wild-type restoration would support haploinsufficiency; effects unique to
      NMD-escaping alleles that improve after mutant-selective knockdown would
      support an additional dominant-negative or gain-of-function mechanism.
  evidence:
  - reference: PMID:35052493
    reference_title: "Genotype-Phenotype Comparison in POGZ-Related Neurodevelopmental Disorders by Using Clinical Scoring."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study suggests that gain-of-function or dominant negative effect through escaping NMD and the location of the variants in the prolin-rich domain of the protein may play an important role in the severity of manifestations of POGZ-associated neurodevelopmental disorders."
    explanation: The authors explicitly frame the alternative allelic mechanism as a suggestion, identifying a material unresolved causal question rather than a demonstrated mechanism.
- discussion_id: whsus_excitability_reversibility
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Does the reversibility of social deficits by compensatory inhibition of
    elevated neuronal excitability in the Pogz mouse translate to any tractable
    intervention in humans with White-Sutton syndrome?
  attaches_to:
  - pathophysiology#Elevated Neuronal Excitability
  rationale: >-
    The mouse result is unusual and important: it shows that at least one
    behavioural consequence of a developmental chromatin-regulator lesion is not
    fixed at birth but depends on an ongoing, pharmacologically addressable
    circuit state. If that held in humans it would change the therapeutic framing
    of the disorder from purely supportive to potentially modifiable. But there
    are no human data at all - no measurement of cortical excitability in
    individuals with POGZ variants, and no trial of any excitability-reducing
    agent for the social or cognitive phenotype. The mismatch is mechanistically
    meaningful because the human phenotype includes established structural brain
    malformations that the excitability model does not address, so even a true
    excitability contribution would explain only part of the picture. It is
    further complicated by direct disagreement between the two published Pogz
    mouse models: the knock-in model shows social DEFICITS rescued by inhibiting
    excitability, whereas the brain-specific conditional knockout reports
    INCREASED sociability alongside a cerebellar Purkinje cell defect. Any
    translational claim must account for that contradiction rather than
    generalising from one model.
  proposed_experiments:
  - experiment_id: whsus_human_excitability_measurement
    name: Cortical excitability measurement in POGZ variant carriers
    description: >-
      Use transcranial magnetic stimulation measures of cortical excitability
      and quantitative EEG in individuals with pathogenic POGZ variants versus
      matched neurodevelopmental controls.
    decision_criterion: >-
      Demonstrating elevated cortical excitability in humans would justify a
      trial of an excitability-reducing agent; normal excitability would confine
      the mouse finding to that model.
  - experiment_id: whsus_patient_ipsc_excitability
    name: Excitability phenotyping and rescue in patient-derived neurons
    description: >-
      Extend the existing patient iPSC work to mature cortical neurons and test
      whether elevated excitability is present and whether the same compensatory
      inhibition used in the mouse normalises network activity.
    decision_criterion: >-
      Reproduction and rescue in human neurons would bridge the model-to-human
      gap without requiring a clinical trial first.

    snippet: "White-Sutton syndrome is a neurodevelopmental disorder characterized by a wide spectrum of cognitive dysfunction, developmental delays (particularly in speech and language acquisition), hypotonia, autism spectrum disorder, and other behavioral problems."
    explanation: GeneReviews lists developmental delay among the defining features of the syndrome.
  - reference: PMID:34645992
    reference_title: "Further delineation of the clinical spectrum of White-Sutton syndrome: 12 new individuals and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

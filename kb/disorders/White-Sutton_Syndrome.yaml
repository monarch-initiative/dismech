prevalence:
- population: Published individuals worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Case counts rose from over 50 reported worldwide in 2019 to about 80 by 2023;
    a 2022 genotype-phenotype analysis pooled 117 individuals. No population
    prevalence estimate has been established.
  evidence:
  - reference: PMID:35052493
    reference_title: "Genotype-Phenotype Comparison in POGZ-Related Neurodevelopmental Disorders by Using Clinical Scoring."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, 117 POGZ patients' genotype and phenotype data were included in the analysis, including 12 novel patients."
    explanation: Quantifies the pooled published caseload as of 2022, supporting an ultra-rare classification.
  - reference: PMID:37016333
    reference_title: "White-Sutton syndrome and congenital heart disease: case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, 80 cases have been reported in the literature; however, the phenotypic characterizations remain incomplete."
    explanation: Independently reports the published caseload and notes that phenotypic characterisation is still incomplete.
inheritance:
- name: Autosomal dominant, typically de novo
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >-
    White-Sutton syndrome is autosomal dominant and in most cases arises from a de
    novo POGZ variant. Inheritance from a heterozygous parent who has
    developmental delay and/or mild intellectual disability is documented but
    rare, so parental testing is required before counselling recurrence risk.
    Expressivity is markedly variable even within families, spanning learning
    difficulties to severe intellectual disability.
  evidence:
  - reference: PMID:34529370
    reference_title: "White-Sutton Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "White-Sutton syndrome is an autosomal dominant disorder typically caused by a de novo pathogenic variant. Most probands reported to date whose parents have undergone molecular genetic testing have the disorder as the result of a de novo POGZ pathogenic variant. Rarely, individuals with White-Sutton syndrome have the disorder as the result of a POGZ pathogenic variant inherited from a heterozygous parent with features such as developmental delay and/or mild intellectual disability."
    explanation: GeneReviews states the autosomal dominant, predominantly de novo mechanism and the rare inherited exception with a mildly affected transmitting parent.
  - reference: PMID:34645992
    reference_title: "Further delineation of the clinical spectrum of White-Sutton syndrome: 12 new individuals and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified 12 individuals from 10 families with pathogenic or likely pathogenic variants in POGZ (eight de novo and two inherited)"
    explanation: Quantifies the de novo versus inherited split in a clinical series, documenting that familial transmission occurs.
pathophysiology:
- name: Pathogenic POGZ Variant Dysfunction
  biological_scale: MOLECULAR
  description: >-
    Heterozygous nonsense, frameshift and splice variants, and a minority of
    missense variants, in POGZ reduce or alter the function of a multidomain
    nuclear protein. The genotype-phenotype relationship is not a simple dosage
    gradient: missense variants are associated with milder phenotypes, while
    truncating variants predicted to ESCAPE nonsense-mediated decay produce the
    most severe phenotypes, and within that group variants in the proline-rich
    region are the most severe of all. The authors infer that a gain-of-function
    or dominant-negative effect from a stable truncated protein may contribute to
    the severe end of the spectrum, but this allelic mechanism has not been
    demonstrated experimentally.
  genes:
  - preferred_term: POGZ
    term:
      id: hgnc:18801
      label: POGZ
  molecular_functions:
  - preferred_term: chromatin binding
    term:
      id: GO:0003682
      label: chromatin binding
    modifier: ABNORMAL
  downstream:
  - target: Loss of POGZ-HP1 Heterochromatin Repression
    causal_link_type: DIRECT
    description: >-
      Altered POGZ function compromises the HP1-dependent repressive activity
      that POGZ exerts at pericentric heterochromatin.
  - target: Premature Cell-Cycle Exit in Cortical Progenitors
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Independently of its transcriptional-repressor role, POGZ is required for
      normal mitotic progression, so its loss reduces the number of dividing
      cortical progenitors. Curated as a separate arm from the transcriptional
      node because the reported intermediates are mitotic (kinetochore assembly
      and chromosome segregation) rather than transcriptional.
  - target: Disrupted POGZ-Dependent Transcriptional Regulation
    causal_link_type: DIRECT
    description: >-
      Altered POGZ function perturbs its transcriptional-regulatory role in the
      nucleus.
  evidence:
  - reference: PMID:34645992
    reference_title: "Further delineation of the clinical spectrum of White-Sutton syndrome: 12 new individuals and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "White-Sutton syndrome (WHSUS) is a neurodevelopmental disorder caused by heterozygous loss-of-function variants in POGZ."
    explanation: Establishes heterozygous POGZ loss-of-function variants as a major cause of the disorder, while the neutral node name also accommodates pathogenic missense alleles and unresolved effects of NMD-escaping truncations.
  - reference: PMID:35052493
    reference_title: "Genotype-Phenotype Comparison in POGZ-Related Neurodevelopmental Disorders by Using Clinical Scoring."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Missense variants were more often associated with mild phenotypes (p = 0.0421) and truncating variants predicted to escape NMD presented with more severe phenotypes (p < 0.0001). Within this group, variants in the prolin-rich region of the POGZ protein were associated with the most severe phenotypes (p = 0.0004)."
    explanation: Provides the quantitative genotype-phenotype correlation underlying the non-simple-dosage claim in this node.
  - reference: PMID:35052493
    reference_title: "Genotype-Phenotype Comparison in POGZ-Related Neurodevelopmental Disorders by Using Clinical Scoring."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study suggests that gain-of-function or dominant negative effect through escaping NMD and the location of the variants in the prolin-rich domain of the protein may play an important role in the severity of manifestations of POGZ-associated neurodevelopmental disorders."
    explanation: The gain-of-function/dominant-negative interpretation is offered by the authors as a suggestion inferred from statistical association rather than demonstrated functionally, so it is curated as partial support.
- name: Loss of POGZ-HP1 Heterochromatin Repression
  biological_scale: MOLECULAR
  description: >-
    POGZ localises to pericentric heterochromatin in the same distribution as
    HP1-alpha and represses transcription in a dual-luciferase reporter assay.
    That repression is HP1-dependent: an H840A substitution in the HP1-binding
    zinc-finger-like (HPZ) domain, which abolishes the POGZ-HP1-alpha
    interaction, also abolishes repression. The HP1-binding step is therefore
    the molecular mechanism by which POGZ acts as a negative regulator of
    transcription, and is the specific activity lost in White-Sutton syndrome.
    The evidence is in vitro (HEK293 reporter assay, N2A immunofluorescence),
    so this node is curated at provisional confidence.
  mechanism_confidence: PROVISIONAL
  molecular_functions:
  - preferred_term: transcription corepressor activity
    term:
      id: GO:0003714
      label: transcription corepressor activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: heterochromatin formation
    term:
      id: GO:0031507
      label: heterochromatin formation
    modifier: ABNORMAL
  downstream:
  - target: Disrupted POGZ-Dependent Transcriptional Regulation
    causal_link_type: DIRECT
    description: >-
      Loss of the HP1-dependent repressive activity is the molecular basis for
      the transcriptional dysregulation - most conspicuously gene upregulation -
      seen when POGZ function is lost.
  evidence:
  - reference: PMID:33203851
    reference_title: "Pogz deficiency leads to transcription dysregulation and impaired cerebellar activity underlying autism-like behavior in mice."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "POGZ localizes to pericentric chromatin and represses transcription depending on HPZ."
    explanation: States the localisation and the HPZ dependence of repression that this node represents.
  - reference: PMID:33203851
    reference_title: "Pogz deficiency leads to transcription dysregulation and impaired cerebellar activity underlying autism-like behavior in mice."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "To test if the interaction with HP1 is essential for transcription repression, we used POGZ with H840A mutation in the HPZ domain"
    explanation: Describes the HPZ-domain point mutation used to isolate the HP1-binding requirement.
  - reference: PMID:33203851
    reference_title: "Pogz deficiency leads to transcription dysregulation and impaired cerebellar activity underlying autism-like behavior in mice."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "POGZ functions as a negative regulator of transcription depending on the interaction with HP1 proteins."
    explanation: The authors' conclusion that POGZ-mediated repression requires the HP1 interaction, which is the claim this node asserts.
- name: Disrupted POGZ-Dependent Transcriptional Regulation
  biological_scale: MOLECULAR
  description: >-
    POGZ is a multidomain nuclear protein that binds chromatin and participates in
    transcriptional regulation. Loss of normal POGZ function therefore perturbs
    the transcriptional programs it controls in the developing nervous system,
    which is the proximate step linking the genetic lesion to abnormal cortical
    development.
  biological_processes:
  - preferred_term: regulation of DNA-templated transcription
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
    modifier: ABNORMAL
  downstream:
  - target: Impaired Cortical Neuronal Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Perturbed transcriptional output in neural progenitors and developing
      neurons impairs cortical development.
  - target: Cerebellar Purkinje Cell Circuit Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of POGZ's negative transcriptional regulation produces the largest gene
      upregulation in cerebellum, with a corresponding Purkinje cell defect.
  evidence:
  - reference: PMID:31136090
    reference_title: "POGZ-related epilepsy: Case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "POGZ (# 614787) encodes a multidomain nuclear protein involved in transcriptional regulation and its defective function has been recently associated with a syndromic neurodevelopmental disorder, known as White-Sutton syndrome (# 616364)."
    explanation: Establishes POGZ's identity as a multidomain nuclear transcriptional regulator and links defective function to White-Sutton syndrome, confirming the OMIM identity (616364) that matches the MONDO xref.
  - reference: PMID:32103003
    reference_title: "Pathogenic POGZ mutation causes impaired cortical development and reversible autism-like phenotypes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we show that POGZ regulates neuronal development and that ASD-related de novo mutations impair neuronal development in the developing mouse brain"
    explanation: Demonstrates in the developing mouse brain that POGZ regulates neuronal development and that disease-associated variants impair it.
  - reference: PMID:32103003
    reference_title: "Pathogenic POGZ mutation causes impaired cortical development and reversible autism-like phenotypes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "impair neuronal development in the developing mouse brain and induced pluripotent cell lines from an ASD patient"
    explanation: The same finding was reproduced in induced pluripotent cell lines from a patient, providing the human cellular arm; split from the mouse item so each carries a single evidence source.
  - reference: PMID:33203851
    reference_title: "Pogz deficiency leads to transcription dysregulation and impaired cerebellar activity underlying autism-like behavior in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "At the molecular level, luciferase reporter assay indicates that POGZ is a negative regulator of transcription. In accordance, in Pogz deficient mice we find a significant upregulation of gene expression, most notably in the cerebellum."
    explanation: Identifies the direction of POGZ's transcriptional role - it is a negative regulator, so loss of function causes gene upregulation, most markedly in cerebellum.
- name: Premature Cell-Cycle Exit in Cortical Progenitors
  biological_scale: CELLULAR
  description: >-
    In the embryonic (E15.5) cerebral cortex of Pogz-deficient mice the number
    of pHH3-positive mitotic cells is significantly reduced and the Tbr2-positive
    intermediate-progenitor layer is correspondingly expanded, while the
    Pax6-positive apical-progenitor layer is unchanged. The authors interpret
    this as accelerated exit from the cell cycle - a shift from symmetric
    proliferative to asymmetric differentiative division - which depletes the
    progenitor pool available to generate cortical neurons. The finding is
    mouse-only, so this node is curated at provisional confidence.
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  biological_processes:
  - preferred_term: cell proliferation in forebrain
    term:
      id: GO:0021846
      label: cell proliferation in forebrain
    modifier: DECREASED
  - preferred_term: mitotic cell cycle
    term:
      id: GO:0000278
      label: mitotic cell cycle
    modifier: ABNORMAL
  downstream:
  - target: Impaired Cortical Neuronal Development
    causal_link_type: DIRECT
    description: >-
      Early depletion of the cycling progenitor pool reduces the neurons
      available to build the cortex, which is the developmental lesion the
      downstream node represents.
  evidence:
  - reference: PMID:33203851
    reference_title: "Pogz deficiency leads to transcription dysregulation and impaired cerebellar activity underlying autism-like behavior in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we stained the sections for phospho-histone H3 (pHH3), which marks mitotic cells with condensed chromosomes"
    explanation: Identifies the mitotic marker used to quantify dividing progenitors in the embryonic cortex.
  - reference: PMID:33203851
    reference_title: "Pogz deficiency leads to transcription dysregulation and impaired cerebellar activity underlying autism-like behavior in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our study shows that depletion of POGZ results in accelerated exit from the cell cycle in the developing cerebral cortex and a reduction in the number of cells in mitosis, which is consistent with the premature mitotic exit observed when POGZ was knockdown in human cells"
    explanation: States the reduced mitotic index and accelerated cell-cycle exit in the developing cortex that this node represents, and notes concordance with human-cell knockdown.
  - reference: PMID:33203851
    reference_title: "Pogz deficiency leads to transcription dysregulation and impaired cerebellar activity underlying autism-like behavior in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "POGZ was previously found to be essential for normal kinetochore assembly, mitotic chromosome segregation, and for normal mitotic progression"
    explanation: Provides the known mitotic function of POGZ that makes the reduced progenitor mitosis mechanistically interpretable.
- name: Impaired Cortical Neuronal Development
  biological_scale: CELLULAR
  description: >-
    Disease-associated de novo POGZ variants impair neuronal development in the
    developing mouse brain and in induced pluripotent cell lines derived from a
    patient. The consequence in the mature animal is impaired cortical network
    function, which is the cellular substrate proposed for the cognitive and
    behavioural phenotype.
  cell_types:
  - preferred_term: neural progenitor cell
    term:
      id: CL:0011020
      label: neural progenitor cell
  - preferred_term: cerebral cortex neuron
    term:
      id: CL:0010012
      label: cerebral cortex neuron
  biological_processes:
  - preferred_term: cerebral cortex neuron differentiation
    term:
      id: GO:0021895
      label: cerebral cortex neuron differentiation
    modifier: ABNORMAL
  downstream:
  - target: Elevated Neuronal Excitability
    causal_link_type: DIRECT
    description: >-
      Abnormal cortical development yields neurons with elevated intrinsic
      excitability.
  - target: Intellectual Disability
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Impaired cortical development underlies the cognitive impairment.
  - target: Structural Brain Malformation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same developmental lesion produces the structural brain abnormalities
      documented on imaging.
  - target: Seizures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Abnormal cortical development is the presumed substrate for the epilepsy;
      the intermediates are not established and no excitation/inhibition-imbalance
      claim is asserted.
  evidence:
  - reference: PMID:32103003
    reference_title: "Pathogenic POGZ mutation causes impaired cortical development and reversible autism-like phenotypes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We established iPSC lines using immortalized B cells obtained from that patient and an unaffected healthy control (Supplementary Fig. 6) and differentiated each iPSC lines into NSCs."
    explanation: Establishes the patient-derived and control human iPSC neural-stem-cell system used to test the cellular developmental phenotype.
  - reference: PMID:32103003
    reference_title: "Pathogenic POGZ mutation causes impaired cortical development and reversible autism-like phenotypes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the neuronal differentiation is impaired in patient-derived NSCs."
    explanation: Directly supports impaired neuronal differentiation in the patient-derived human neural model.
  - reference: PMID:32103003
    reference_title: "Pathogenic POGZ mutation causes impaired cortical development and reversible autism-like phenotypes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results provide insight into how de novo mutations on high-confidence ASD genes lead to impaired mature cortical network function, which underlies the cellular pathogenesis of NDDs, including ASD."
    explanation: States the impaired-mature-cortical-network outcome that this node represents.
  - reference: PMID:32103003
    reference_title: "Pathogenic POGZ mutation causes impaired cortical development and reversible autism-like phenotypes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We also develop the first mouse model heterozygous for a de novo POGZ mutation identified in a patient with ASD, and we identify ASD-like abnormalities in the mice."
    explanation: Establishes the heterozygous knock-in mouse that reproduces disease-relevant behavioural abnormalities.
- name: Cerebellar Purkinje Cell Circuit Dysfunction
  biological_scale: CELLULAR
  description: >-
    A second, independent mouse model - brain-specific conditional Pogz knockout -
    localises the strongest transcriptional consequence of Pogz loss to the
    cerebellum and shows a corresponding physiological defect: reduced simple- and
    complex-spike firing frequency and increased inhibitory synaptic input
    amplitude in Purkinje cells. This model also reproduces microcephaly and
    growth impairment, matching the human phenotype. It is curated as a parallel
    arm to the cortical node rather than subsumed into it, because the two models
    implicate different circuits and, notably, report opposite social phenotypes.
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  downstream:
  - target: Microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same conditional-knockout model that shows the cerebellar defect also
      reproduces microcephaly and growth impairment.
  evidence:
  - reference: PMID:33203851
    reference_title: "Pogz deficiency leads to transcription dysregulation and impaired cerebellar activity underlying autism-like behavior in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Physiologically, Pogz deficiency is associated with a reduction in the firing frequency of simple and complex spikes and an increase in amplitude of the inhibitory synaptic input in cerebellar Purkinje cells."
    explanation: Direct electrophysiological characterisation of the Purkinje cell defect in the conditional knockout.
  - reference: PMID:33203851
    reference_title: "Pogz deficiency leads to transcription dysregulation and impaired cerebellar activity underlying autism-like behavior in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We demonstrate that Pogz deficient mice show microcephaly, growth impairment, increased sociability, learning and motor deficits, mimicking several of the human symptoms."
    explanation: Establishes construct and partial face validity of this model, and records that it shows INCREASED sociability, the opposite direction to the other published Pogz mouse.
  - reference: PMID:33203851
    reference_title: "Pogz deficiency leads to transcription dysregulation and impaired cerebellar activity underlying autism-like behavior in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our findings support a mechanism linking heterochromatin dysregulation to cerebellar circuit dysfunction and behavioral abnormalities in ASD."
    explanation: States the heterochromatin-to-cerebellar-circuit mechanism this node represents.
- name: Elevated Neuronal Excitability
  biological_scale: CELLULAR
  description: >-
    In the heterozygous Pogz mouse, social deficits can be treated by compensatory
    inhibition of elevated cell excitability, identifying raised neuronal
    excitability as a functionally causal and pharmacologically reversible node
    rather than a fixed developmental endpoint. This is the single most
    therapeutically interesting finding in the disorder and is the reason a
    reversibility discussion is recorded. It is currently mouse-only.
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: cerebral cortex neuron
    term:
      id: CL:0010012
      label: cerebral cortex neuron
  downstream:
  - target: Autistic Behavior
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Elevated excitability underlies the social deficits in the mouse model, the
      behavioural correlate of the human autistic phenotype.
  evidence:
  - reference: PMID:32103003
    reference_title: "Pathogenic POGZ mutation causes impaired cortical development and reversible autism-like phenotypes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Importantly, social deficits can be treated by compensatory inhibition of elevated cell excitability in the mice."
    explanation: Demonstrates that elevated neuronal excitability is causal for the social phenotype in the mouse and that the deficit is pharmacologically reversible in that model.
phenotypes:
- category: Cognitive
  name: Intellectual Disability
  description: >-
    Cognitive impairment spans a wide range. In an unbiased national cohort of 19
    individuals, 14 had frank intellectual disability (6 mild, 5 moderate, 3
    severe) and the remaining 5 had learning disabilities with a shared
    neurocognitive profile of language difficulties, dysexecutive syndrome,
    attention disorders, slowness and social difficulties. Milder presentations
    are therefore likely to be under-ascertained.
  frequency: FREQUENT
  diagnostic: true
  phenotype_term:
    preferred_term: Intellectual disability
    term:
      id: HP:0001249
      label: Intellectual disability
  evidence:
  - reference: PMID:33277917
    reference_title: "Neuropsychological study in 19 French patients with White-Sutton syndrome and POGZ mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among the 19 patients, 14 patients exhibited ID (six mild, five moderate and three severe)."
    explanation: Quantifies frank intellectual disability at 14 of 19 (74%) in an unbiased national cohort, which falls in the FREQUENT (30-79%) band. The remaining 5 individuals had learning disabilities rather than intellectual disability, so the band is set on the HP:0001249 claim itself and not widened to cognitive impairment generally.
  - reference: PMID:33277917
    reference_title: "Neuropsychological study in 19 French patients with White-Sutton syndrome and POGZ mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study reveals that the cognitive phenotype of patients with POGZ pathogenic variants can range from learning disabilities to severe ID."
    explanation: Establishes the breadth of the cognitive range, which is why the entry does not assert a single severity level.

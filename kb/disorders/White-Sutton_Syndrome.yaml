    reference_title: "Further delineation of the clinical spectrum of White-Sutton syndrome: 12 new individuals and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "seizures, and structural brain malformations"
    explanation: Establishes structural brain malformations as part of the reported clinical spectrum.
  - reference: PMID:31136090
    reference_title: "POGZ-related epilepsy: Case report and review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "major brain MR features include cortical and cerebellar atrophy, delayed myelination, and brainstem hypoplasia"
    explanation: Enumerates the MRI appearances represented by this imaging finding.
genetic:
- name: POGZ
  gene_term:
    preferred_term: POGZ
    term:
      id: hgnc:18801
      label: POGZ
  association: Causal - heterozygous pathogenic variants
  relationship_type: CAUSATIVE
  presence: Positive
  notes: >-
    POGZ is at 1q21.3. Most pathogenic variants are heterozygous and de novo, and
    are nonsense, frameshift or splice alleles; missense variants also occur and
    are associated with milder phenotypes. The severity gradient does not follow a
    simple loss-of-function dosage model: truncating variants predicted to escape
    nonsense-mediated decay give the most severe phenotypes, and among those,
    variants in the proline-rich region are the most severe, suggesting a
    gain-of-function or dominant-negative contribution from a stable truncated
    protein. Familial transmission from a mildly affected heterozygous parent is
    documented, so both parents should be tested. Note that the two published Pogz
    mouse models disagree on the direction of the social phenotype; that is
    recorded in `discussions`.
  evidence:
  - reference: PMID:31782611
    reference_title: "Phenotypic expansion of POGZ-related intellectual disability syndrome (White-Sutton syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here we report the clinical features of 22 individuals with 21 unique loss of function POGZ variants."
    explanation: Documents the loss-of-function variant spectrum across a 22-person series with near-unique variants.
  - reference: PMID:35052493
    reference_title: "Genotype-Phenotype Comparison in POGZ-Related Neurodevelopmental Disorders by Using Clinical Scoring."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Missense variants were more often associated with mild phenotypes (p = 0.0421) and truncating variants predicted to escape NMD presented with more severe phenotypes (p < 0.0001)."
    explanation: Establishes the statistically supported genotype-severity relationship, including the NMD-escape effect.
  - reference: PMID:34645992
    reference_title: "Further delineation of the clinical spectrum of White-Sutton syndrome: 12 new individuals and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our work further delineates the phenotypic spectrum of WHSUS highlighting the variable severity of this disorder and the observation of familial pathogenic POGZ variants."
    explanation: Documents both the variable severity and the occurrence of familial (inherited) pathogenic POGZ variants.
diagnosis:
- name: Molecular Genetic Testing for POGZ
  description: >-
    The diagnosis is established by identifying a heterozygous pathogenic POGZ
    variant in an individual with suggestive findings, typically on exome or
    genome sequencing or a neurodevelopmental gene panel. Because the cognitive
    phenotype extends down to learning difficulties, the authors of the French
    cohort argue that children with learning disabilities may benefit from
    next-generation sequencing rather than being excluded from testing. In one
    diagnostic laboratory, POGZ variants accounted for approximately 0.14% of
    clinical exomes referred for neurological indications; this is a referral
    yield, not a population prevalence estimate.
  presence: Positive in affected individuals
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:34529370
    reference_title: "White-Sutton Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of White-Sutton syndrome is established in a proband with suggestive findings and a heterozygous pathogenic variant in POGZ identified by molecular genetic testing."
    explanation: GeneReviews states the molecular diagnostic criterion.
  - reference: PMID:33277917
    reference_title: "Neuropsychological study in 19 French patients with White-Sutton syndrome and POGZ mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It highlights that pathogenic variations in the same genes can be reported in a large spectrum of neurocognitive profiles, and that children with learning disabilities could benefit from next generation sequencing techniques."
    explanation: Supports extending genomic testing to milder learning-disability presentations, which is a direct diagnostic-strategy implication of the phenotypic range.
  - reference: PMID:31782611
    reference_title: "Phenotypic expansion of POGZ-related intellectual disability syndrome (White-Sutton syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Analysis of the Baylor Genetics clinical laboratory database revealed that POGZ variants were implicated in approximately 0.14% of cases who underwent clinical exome sequencing for neurological indications with or without involvement of other body systems."
    explanation: Records the diagnosis yield in an ascertained referral laboratory while explicitly keeping it separate from population occurrence.
- name: Sleep-Disordered-Breathing Assessment
  description: >-
    Sleep symptoms should be assessed as part of routine specialist follow-up.
    In one small cohort, a validated sleep-disordered-breathing questionnaire
    identified obstructive-sleep-apnoea symptoms in 4 of 12 individuals; this
    establishes a screening observation, not the accuracy of a diagnostic test or
    a syndrome-specific treatment protocol.
  results: Questionnaire symptoms of obstructive sleep apnea were identified in 4 of 12 individuals screened.
  evidence:
  - reference: PMID:31782611
    reference_title: "Phenotypic expansion of POGZ-related intellectual disability syndrome (White-Sutton syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A validated sleep disordered breathing questionnaire identified symptoms of obstructive sleep apnea in 4/12 (33%) individuals."
    explanation: Documents questionnaire-based detection of obstructive-sleep-apnoea symptoms while not claiming polysomnographic confirmation or management efficacy.
  - reference: PMID:34529370
    reference_title: "White-Sutton Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Surveillance: Follow up of the common manifestations at each clinic visit."
    explanation: Supports routine follow-up of common manifestations, including the sleep disturbance identified elsewhere in the same GeneReviews abstract, but does not prescribe a sleep-specific protocol.
differential_diagnoses:
- name: Other Syndromic Intellectual Disability with Autism
  description: >-
    White-Sutton syndrome has no pathognomonic feature; the combination of
    speech-predominant developmental delay, autism, hypotonia, ocular findings and
    increased BMI is suggestive but the diagnosis is molecular. Broad genomic
    testing rather than targeted single-gene testing is the practical approach.
  evidence:
  - reference: PMID:38019139
    reference_title: "Discriminative features in White-Sutton syndrome: literature review and first report in Iran."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "White-Sutton Syndrome is one of the rare neurodevelopmental disorder inherited in an autosomal dominant manner, mainly caused by de novo mutations in the POGZ gene and shows many phenotypic signs such as intellectual disability, Autism Spectrum Disorder and other spectra."
    explanation: A literature review specifically framed around discriminative features concludes the presentation is a nonspecific intellectual-disability/autism spectrum, which is why the differential is broad and the diagnosis molecular.
  - reference: PMID:38019139
    reference_title: "Discriminative features in White-Sutton syndrome: literature review and first report in Iran."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results of Whole Exome Sequencing test, performed for the patient, declared the presence of a de novo mutation in POGZ gene and confirmed the White-Sutton Syndrome diagnosis."
    explanation: Illustrates the practical point that broad sequencing rather than clinical discrimination establishes the diagnosis.
- name: Nonsyndromic Autism Spectrum Disorder
  description: >-
    POGZ is one of the most recurrently de novo mutated genes in autism cohorts,
    so individuals may first be labelled with idiopathic ASD; the associated
    dysmorphism, ocular, auditory, gastrointestinal and genitourinary findings
    should prompt genomic testing.
- name: Helsmoortel-Van der Aa Syndrome (ADNP)
  disease_term:
    preferred_term: ADNP-related syndrome
    term:
      id: MONDO:0014379
      label: ADNP-related multiple congenital anomalies - intellectual disability - autism spectrum disorder
  description: >-
    The most mechanistically apposite differential. ADNP, like POGZ, is a
    high-confidence de novo autism gene whose product participates in
    HP1-binding chromatin complexes, and the two disorders converge clinically
    on speech-predominant developmental delay, autism, hypotonia, feeding
    difficulty, visual problems and a recognisable but non-specific facial
    gestalt. The disorders are separated by molecular testing, not by phenotype.
  distinguishing_features:
  - The causative gene - ADNP versus POGZ - identified by exome or genome sequencing is the only reliable discriminator; the two are not separable on clinical grounds.
  evidence:
  - reference: PMID:33203851
    reference_title: "Pogz deficiency leads to transcription dysregulation and impaired cerebellar activity underlying autism-like behavior in mice."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "heterochromatin formation, or participate in complexes that bind different isotypes of the human heterochromatin protein 1 (HP1) (e.g. SUV420H113, ADNP14 and POGZ15–19)."
    explanation: The paper explicitly names ADNP and POGZ among high-confidence ASD-risk genes linked to HP1-binding chromatin biology, supporting mechanistic proximity while not establishing clinical indistinguishability.
- name: Other Chromatinopathy-Associated Neurodevelopmental Disorders
  description: >-
    CHAMP1, CHD8, KBG syndrome (ANKRD11), Coffin-Siris syndrome (BAF complex)
    and Wiedemann-Steiner syndrome (KMT2A) all produce syndromic intellectual
    disability with autism through lesions in chromatin regulators and overlap
    substantially with White-Sutton syndrome. They are listed as a group because
    none is separable from POGZ-related disease on clinical grounds; exome or
    genome sequencing is the discriminator.
- name: Smith-Magenis Syndrome (RAI1)
  description: >-
    Shares intellectual disability, behavioural problems including self-injury,
    sleep disturbance and obesity; distinguished by molecular testing.
- name: Prader-Willi Syndrome
  description: >-
    Shares hypotonia, developmental delay, behavioural difficulties and obesity;
    distinguished by methylation testing of the 15q11-q13 region.
progression:
- phase: Neurodevelopmental presentation and clinical recognition
  age_range: First evaluation from one week to 28 years in one reported cohort
  notes: >-
    The disorder is developmental, but age at recognition is broad and diagnostic
    delay can be prolonged. One cohort reported first medical evaluation from the
    neonatal period to adulthood and a delay from first concern to molecular
    diagnosis of more than 15 years in some individuals. Published cohorts do not
    yet define adult longitudinal progression, mortality or life expectancy.
  evidence:
  - reference: PMID:31782611
    reference_title: "Phenotypic expansion of POGZ-related intellectual disability syndrome (White-Sutton syndrome)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ages at first medical evaluation ranged from one week (presenting with birth defects) to 28 years (subject seen for calcinosis cutis, and noted to have mild intellectual disability and polydactyly). Median age at diagnosis was eight years, and the time from initial concern to diagnosis ranged from two months to over 15 years."
    explanation: Directly supports the broad recognition range and prolonged diagnostic delay; it does not establish the natural history of manifestations in adulthood.
  - reference: PMID:34529370
    reference_title: "White-Sutton Syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "White-Sutton syndrome is a neurodevelopmental disorder characterized by a wide spectrum of cognitive dysfunction, developmental delays (particularly in speech and language acquisition), hypotonia, autism spectrum disorder, and other behavioral problems."
    explanation: Establishes the developmental nature of the presentation but does not provide longitudinal adult-course data.
treatments:
- name: Multidisciplinary Standard-of-Care Management
  description: >-
    There is no disease-modifying therapy. Developmental delay and intellectual
    disability, speech and language acquisition, behavioural issues, seizures,
    refractive errors and strabismus, hearing impairment, sleep disturbance,
    feeding and gastrointestinal issues, and genitourinary problems are each
    managed by the relevant specialists per standard care, with follow-up of the
    common manifestations at every clinic visit.

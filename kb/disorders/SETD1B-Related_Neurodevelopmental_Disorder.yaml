    modifier: DECREASED
  evidence:
  - reference: PMID:34345025
    reference_title: Delineating the molecular and phenotypic spectrum of the SETD1B-related syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data present evidence for a loss-of-function mechanism of SETD1B variants, resulting in a core clinical phenotype of global developmental delay, language delay including regression, intellectual disability, autism and other behavioral issues, and variable epilepsy phenotypes.
    explanation: >-
      Largest published cohort supports a loss-of-function mechanism for
      pathogenic SETD1B variants.
  - reference: PMID:31110234
    reference_title: A novel de novo frameshift variant in SETD1B causes epilepsy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a de novo frameshift variant (NM_015048.1:c.5644_5647del:p.(Ile1882Serfs*118)) in the last exon of SETD1B in a Japanese patient with autistic behavior, developmental delay, intellectual disability, and myoclonic seizures.
    explanation: >-
      Documents a de novo frameshift predicted to disrupt the conserved
      carboxyl-terminus SET domain.
  - reference: PMID:34345025
    reference_title: Delineating the molecular and phenotypic spectrum of the SETD1B-related syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Selected variants were functionally tested using in vitro and genome-wide methylation assays.
    explanation: >-
      Adds assay-based functional evidence for selected SETD1B variants to the
      cohort evidence supporting a loss-of-function mechanism.
  downstream:
  - target: Reduced H3K4 Methylation
    description: >-

discussions:
- discussion_id: gap_setd1b_sex_bias
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why are males overrepresented and reportedly more severely affected in
    SETD1B-NDD cohorts, and are there sex-linked modifiers of penetrance or
    expressivity?
  rationale: >-
    Published cohorts and GeneReviews-era summaries note male
    overrepresentation and more severe male phenotypes as an open mechanistic
    question without a demonstrated molecular explanation.
  evidence:
  - reference: PMID:34345025
    reference_title: Delineating the molecular and phenotypic spectrum of the SETD1B-related syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Males are significantly overrepresented and more severely affected, and we speculate that sex-linked traits could affect susceptibility to penetrance and the clinical spectrum of SETD1B variants.
    explanation: >-
      Directly supports the observed sex bias while preserving the authors'
      explicit characterization of its mechanism as speculative.
  attaches_to:
  - "pathophysiology#SETD1B Loss of Function"

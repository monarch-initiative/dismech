name: SETD1B-Related Neurodevelopmental Disorder
creation_date: "2026-07-25T01:27:23Z"
category: Mendelian
synonyms:
- SETD1B-NDD
- SETD1B-related neurodevelopmental disorder
- intellectual developmental disorder with seizures and language delay
- IDDSELD
description: >-
  SETD1B-related neurodevelopmental disorder (SETD1B-NDD; also known as
  intellectual developmental disorder with seizures and language delay,
  IDDSELD; OMIM 619000) is an autosomal dominant Mendelian disorder caused by
  heterozygous loss-of-function variants in SETD1B, which encodes a lysine-specific
  histone H3K4 methyltransferase catalytic subunit of the SET1 complex.
  Haploinsufficiency dysregulates neuronal gene expression and neurodevelopment,
  producing a core phenotype of global developmental delay (speech and language
  predominant), intellectual disability, autism spectrum disorder or autism-like
  behaviors, variable epilepsy (including myoclonic absences in some individuals),
  and additional behavioral concerns. Most pathogenic variants arise de novo.

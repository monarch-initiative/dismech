pathophysiology:
- name: SETD1B Loss of Function
  biological_scale: MOLECULAR
  description: >-
    De novo heterozygous variants in SETD1B (frameshift, nonsense, and missense
    alleles concentrated in functional domains including the SET domain) act
    through a loss-of-function / haploinsufficiency mechanism, reducing the
    catalytic histone H3K4 methyltransferase activity of the SET1 complex.

- name: Reduced H3K4 Methylation
  biological_scale: MOLECULAR
  description: >-
    SETD1B is a catalytic component of the SET1 complex that deposits H3K4
    methyl marks. Reduced H3K4 methylation is the expected biochemical
    consequence of SETD1B loss of function, but it has not been directly
    measured in disease-relevant neurons from affected individuals.
  evidence:
  - reference: PMID:29322246
    reference_title: "De novo variants in SETD1B are associated with intellectual disability, epilepsy and autism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SETD1B (SET domain containing 1B) is a component of SET1 histone methyltransferase complex, which mediates the methylation of histone H3 on lysine 4 (H3K4).
    explanation: >-
      Establishes the biochemical premise for reduced H3K4 methylation after
      SETD1B loss of function; the disease-state reduction remains a mechanistic
      inference.
  downstream:
  - target: Dysregulated Neuronal Gene Expression
    description: >-
      Altered H3K4 methylation is expected to disrupt transcriptional regulation
      at SETD1B target loci.
    evidence:

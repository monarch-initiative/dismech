differential_diagnoses:
- name: 12q24.31 Microdeletion Syndrome
  description: >-
    Overlapping neurodevelopmental phenotype with SETD1B as a critical gene in
    the 12q24.31 deletion interval.
  distinguishing_features:
  - >-
    Contiguous-gene 12q24.31 deletions may include additional genes beyond
    SETD1B, whereas SETD1B-NDD is defined by a pathogenic SETD1B sequence
    variant (molecular distinction).
  evidence:
  - reference: PMID:29322246
    reference_title: "De novo variants in SETD1B are associated with intellectual disability, epilepsy and autism."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our cases showed epilepsy, developmental delay, intellectual disabilities, autistic behavior and craniofacial dysmorphic features, which are consistent with those of individuals with de novo 12q24.31 deletions.
    explanation: >-
      Links SETD1B point-variant phenotype to the 12q24.31 deletion phenotype.
- name: Epilepsy with Myoclonic Absences
  description: >-
    Electroclinical syndrome that can be caused by several genes; SETD1B is one
    genetic etiology associated with this seizure type in some individuals.
  distinguishing_features:
  - >-
    EMA is an electroclinical diagnosis; SETD1B-NDD is defined by the SETD1B
    pathogenic variant plus the broader neurodevelopmental phenotype.
  evidence:
  - reference: PMID:31440728
    reference_title: "De novo variants in SETD1B cause intellectual disability, autism spectrum disorder, and epilepsy with myoclonic absences."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Epilepsy with myoclonic absences is a specific seizure type characterized by bilateral rhythmic clonic jerks with impairment of consciousness.
    explanation: >-
      Establishes EMA as an electroclinical seizure syndrome that must be
      distinguished from the broader molecularly defined SETD1B-NDD.

    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Dominant transmission was established in the index Algerian family, in which
    five members were affected. The two molecularly characterised patients since
    have been sporadic, each carrying a heterozygous COL2A1 variant, consistent
    with a de novo dominant allele.

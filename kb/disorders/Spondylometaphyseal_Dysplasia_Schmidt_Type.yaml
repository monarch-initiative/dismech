      where the gene symbol has been run together with the following word;
      the sentence reads "COL2A1 mutations create a multiplicity of clinical
      entities collectively termed type II collagenopathy."
- name: Metaphyseal Growth Plate Dysplasia
  biological_scale: TISSUE
  description: >-
    Disordered endochondral ossification at the metaphyses of the long bones,
    most severe at the hip and knee and only minimally affecting the short tubular
    bones of the hands and feet. Radiologically it appears as irregular
    radiolucencies intermingled with radiodensities, partial fragmentation, and
    metaphyseal corner fractures, and mechanically it produces the severe valgus
    deformity that names the entity in the skeletal dysplasia nosology.
  biological_processes:
  - preferred_term: endochondral ossification
    modifier: DECREASED
    term:
      id: GO:0001958
      label: endochondral ossification
  downstream:
  - target: Metaphyseal Dysplasia
    causal_link_type: DIRECT
  - target: Metaphyseal Irregularity
    causal_link_type: DIRECT
  - target: Metaphyseal Corner Fracture

  evidence:
  - reference: PMID:23653587
    reference_title: "COL2A1 Mutation in Spondylometaphyseal Dysplasia Algerian Type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      COL2A1mutations create a multiplicity of clinical entities collectively termed type II collagenopathy.
    explanation: >-
      Places the disorder in the allelic series whose shared substrate is

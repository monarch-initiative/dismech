name: Spondylometaphyseal Dysplasia, Schmidt Type
creation_date: "2026-09-09T00:00:00Z"
category: Mendelian
description: >-
  Spondylometaphyseal dysplasia, Schmidt type - almost always written in the
  modern literature as spondylometaphyseal dysplasia Algerian type, SMD-A, and
  listed in the skeletal dysplasia nosology as "SMD with severe genu valgum" - is
  an autosomal dominant type II collagenopathy caused by heterozygous COL2A1
  variants. The phenotype is a short trunk with severe genu valgum, progressive
  kyphoscoliosis, wrist deformity and myopia, on a radiological background of
  moderate platyspondyly with dorsal vertebral flattening, short ilia with narrow
  greater sciatic notches, and generalised metaphyseal dysplasia that is most
  conspicuous at the hip and knee. The hands and feet are barely affected.

  The mechanism is the standard type II collagenopathy one. Both reported COL2A1
  alleles are glycine substitutions in the Gly-X-Y repeat of the triple-helical
  domain - Gly861Val in exon 39 and Gly1092Asp in exon 47 - the class of change
  that prevents an obligatory glycine from occupying the sterically constrained
  interior position of the collagen triple helix. The consequence is an abnormal
  type II collagen network in the hyaline cartilage of the growth plate and the
  vertebral bodies, which is why the disease is a growth disorder of endochondral
  bone rather than a metabolic one, and why the eye is involved at all.

  What is specific to this entry is its nosological position rather than its
  mechanism, and it is genuinely unsettled. Kozlowski's 1988 report of an Algerian
  family proposed the disorder as a distinct skeletal dysplasia and suggested that
  a 1963 case of Schmidt's was the same entity, which is where the eponym in the
  MONDO label comes from. The 2013 report that first found a COL2A1 allele in the
  phenotype went further and argued that SMD-A and spondyloepimetaphyseal
  dysplasia Strudwick type should be lumped, on the grounds that dorsal vertebral
  flattening, iliac hypoplasia, extensive metaphyseal dysplasia and near-normal
  short tubular bones are shared, and that the one apparent difference - normal
  proximal femoral epiphyses in SMD-A - dissolved in their own patient, whose
  mottled femoral heads improved with age. This entry is curated separately
  because MONDO, OMIM and Orphanet all keep the concept distinct and dismech
  already curates Strudwick type as its own entry; the argument for merging them
  is recorded in `notes` rather than acted on.

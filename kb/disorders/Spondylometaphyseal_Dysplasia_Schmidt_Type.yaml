genetic:
- name: COL2A1
  gene_term:
    preferred_term: COL2A1
    term:
      id: hgnc:2200
      label: COL2A1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  notes: >-
    Two alleles have been reported, both heterozygous glycine substitutions in
    the triple-helical domain: c.2582G>T p.Gly861Val in exon 39, and c.3275G>A
    p.Gly1092Asp in exon 47. The second patient additionally carried an intronic
    variant of uncertain significance, c.1366-13C>A, which the authors raised as
    a possible modifier of severity rather than as a second causal allele; this
    entry does not treat it as causal. No functional study of either allele has
    been published, so the dominant-negative mechanism usually invoked for
    glycine substitutions in this gene is an inference from the allele class
    here, not a measurement.
  evidence:
  - reference: PMID:23653587
    reference_title: "COL2A1 Mutation in Spondylometaphyseal Dysplasia Algerian Type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report a 7-year-old Japanese boy with a heterozygous missense mutation in COL2A1, 2582G>T (Gly861Val), whose phenotype matched that of SMD-A.
    explanation: The first COL2A1 allele reported in this phenotype.
  - reference: PMID:38162154
    reference_title: "A Severe Case of Spondylometaphyseal Dysplasia Algerian Type with Two Mutations in COL2A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient has a c.3275G > A; p.Gly1092Asp mutation in exon 47 of the COL2A1 gene and a variant of unknown significance in c.1366-13C > A in intron 21.
    explanation: >-
      The second reported allele, plus the intronic variant of uncertain
      significance this entry declines to treat as causal.

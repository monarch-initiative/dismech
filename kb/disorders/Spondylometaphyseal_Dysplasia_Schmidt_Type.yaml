  - target: Genu Valgum
    causal_link_type: DIRECT
  - target: Wrist Deformity
    causal_link_type: DIRECT
  - target: Short Stature
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:23653587
    reference_title: "COL2A1 Mutation in Spondylometaphyseal Dysplasia Algerian Type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The metaphyseal changes are most conspicuous in the hip and knee, and are associated with coxa vara and severe genu valgum.
    explanation: >-
      Locates the metaphyseal lesion and links it to the two deformities it
      produces.
  - reference: PMID:23653587
    reference_title: "COL2A1 Mutation in Spondylometaphyseal Dysplasia Algerian Type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The metaphyses of the long bones manifested irregular radiolucencies intermingled with radiodensities and were in part fragmented.
    explanation: The radiological appearance of the metaphyseal lesion in a solved patient.
- name: Vertebral Body Growth Failure
  biological_scale: TISSUE
  description: >-
    Reduced and disordered growth of the cartilaginous vertebral bodies, giving
    moderate platyspondyly with a characteristic dorsal flattening. The short
    trunk of this disorder follows from it, as do the progressive spinal
    deformities.
  biological_processes:
  - preferred_term: bone development
    modifier: DECREASED
    term:
      id: GO:0060348
      label: bone development
  downstream:
  - target: Platyspondyly
    causal_link_type: DIRECT
  - target: Disproportionate Short-Trunk Short Stature
    causal_link_type: DIRECT
  - target: Kyphoscoliosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Lumbar Hyperlordosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:23653587
    reference_title: "COL2A1 Mutation in Spondylometaphyseal Dysplasia Algerian Type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The radiological hallmarks of SMD-A include moderate platyspondyly particularly with dorsal vertebral flattening, short ilia with narrow greater sciatic notches and generalized metaphyseal dysplasia of the long bones.
    explanation: >-
      The spinal component of the radiological definition of the entity.
- name: Pelvic and Proximal Femoral Dysplasia
  biological_scale: TISSUE
  description: >-
    Short, broad ilia with narrow greater sciatic notches, irregular acetabula,
    and a short varus femoral neck. The proximal femoral epiphyses may be mottled
    early and then improve with age, which is the observation that undermined the
    "normal epiphyses" criterion once used to separate this entity from
    spondyloepimetaphyseal dysplasia Strudwick type.
  downstream:
  - target: Hypoplastic Ilia
    causal_link_type: DIRECT
  - target: Narrow Greater Sciatic Notch
    causal_link_type: DIRECT
  - target: Coxa Vara
    causal_link_type: DIRECT
  - target: Delayed Proximal Femoral Epiphyseal Ossification
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:23653587
    reference_title: "COL2A1 Mutation in Spondylometaphyseal Dysplasia Algerian Type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ilia were broad and short with narrow greater sciatic notches. The iliac crests and acetabula appeared irregular. The proximal femoral epiphyses were mottled together with horizontal clefts. Coxa vara and short femoral necks were noted.
    explanation: >-
      The pelvic and proximal femoral findings in the molecularly solved Japanese
      patient.
- name: Abnormal Vitreous Collagen
  biological_scale: TISSUE
  description: >-
    Type II collagen is also the structural collagen of the vitreous humor, which
    is why an otherwise skeletal disorder carries an ocular component. Myopia was
    part of the original clinical definition and was present in the solved patient.
  downstream:
  - target: Myopia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Myopia is consistently reported in this disorder and in the type II
      collagenopathies generally, but no study cited here traces the refractive
      error to a measured vitreous or scleral collagen abnormality in these
      patients, so the step is recorded as indirect.
  evidence:
  - reference: PMID:23653587
    reference_title: "COL2A1 Mutation in Spondylometaphyseal Dysplasia Algerian Type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Myopia may be a syndromic component."
    explanation: Myopia in the clinical definition of the entity.
  - reference: PMID:30696995
    reference_title: "Best practice guidelines regarding diagnosis and management of patients with type II collagen disorders."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "Myopia is a common feature of type II collagen disorders"
    explanation: >-
      The ocular involvement of the disorder class. Graded indirect and OTHER
      because it is an expert-consensus statement about type II collagen
      disorders as a group, not about this entity.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A new, dominantly inherited, severe form of spondylometaphyseal dysplasia in five members of an Algerian family is reported.
    explanation: Dominant transmission in the family that defines the entity.
  - reference: PMID:38162154
    reference_title: "A Severe Case of Spondylometaphyseal Dysplasia Algerian Type with Two Mutations in COL2A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Spondylometaphyseal dysplasia Algerian type (MIM no.: 184253) is an uncommon autosomal dominant skeletal dysplasia caused by heterozygous mutations in the COL2A1 gene (MIM no.: 120140).
    explanation: >-
      States the mode of inheritance together with the gene and the OMIM
      identifier this entry is keyed to.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No population estimate exists. The published series is one Algerian family
    with five affected members, a sporadic Polish boy, a sporadic Japanese boy and
    a sporadic Tunisian boy, so the denominator for any rate is unknown. This is
    also why no phenotype in this entry carries a frequency band.
  evidence:
  - reference: PMID:23653587
    reference_title: "COL2A1 Mutation in Spondylometaphyseal Dysplasia Algerian Type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SMD-A is an autosomal dominant disorder, and the phenotypic definition is derived from 5 affected sibs in an Algerian family and a sporadic case of a Polish boy
    explanation: The size of the case base from which the entity was defined.
  - reference: PMID:23653587
    reference_title: "COL2A1 Mutation in Spondylometaphyseal Dysplasia Algerian Type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Afterwards, however, no additional report has emerged to date."
    explanation: >-
      Records that a quarter of a century passed with no further published case,
      which is the reason no rate can be given.
pathophysiology:
- name: Heterozygous COL2A1 Glycine Substitution
  biological_scale: MOLECULAR
  description: >-
    A single heterozygous missense change replacing an obligatory glycine of the
    Gly-X-Y repeat in the triple-helical domain of the pro-alpha-1(II) collagen
    chain. Both molecularly solved patients carry one: Gly861Val in exon 39 and
    Gly1092Asp in exon 47.
  genes:
  - preferred_term: COL2A1
    term:
      id: hgnc:2200
      label: COL2A1
  downstream:
  - target: Disrupted Type II Collagen Triple-Helix Assembly
    causal_link_type: DIRECT
    description: >-
      Glycine is the only residue small enough for the interior position of the
      collagen triple helix, so substituting a bulkier side chain obstructs
      helix formation.
  evidence:
  - reference: PMID:23653587
    reference_title: "COL2A1 Mutation in Spondylometaphyseal Dysplasia Algerian Type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This mutation was assumed to substitute valine for a glycine in the triple helical domain (Gly861Val).
    explanation: >-
      The first COL2A1 allele found in this phenotype, and the reason the
      disorder is classed as a type II collagenopathy at all.
  - reference: PMID:38162154
    reference_title: "A Severe Case of Spondylometaphyseal Dysplasia Algerian Type with Two Mutations in COL2A1."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient has a c.3275G > A; p.Gly1092Asp mutation in exon 47 of the COL2A1 gene and a variant of unknown significance in c.1366-13C > A in intron 21.
    explanation: >-
      The second reported allele, an independent glycine substitution in the same
      domain.
- name: Disrupted Type II Collagen Triple-Helix Assembly
  biological_scale: MOLECULAR
  description: >-
    The mutant pro-alpha-1(II) chain interferes with assembly of the type II
    procollagen triple helix. Glycine substitutions of this class are the
    recognised pathogenic mechanism across the type II collagenopathies and are
    shared with spondyloepimetaphyseal dysplasia Strudwick type and with
    hypochondrogenesis / spondyloepiphyseal dysplasia congenita.
  biological_processes:
  - preferred_term: collagen fibril organization
    modifier: DECREASED
    term:
      id: GO:0030199
      label: collagen fibril organization
  downstream:
  - target: Abnormal Cartilage Extracellular Matrix
    causal_link_type: DIRECT
    description: >-
      Type II collagen is the principal fibrillar collagen of hyaline cartilage,
      so a defective helix yields a defective cartilage matrix.
  evidence:
  - reference: PMID:23653587
    reference_title: "COL2A1 Mutation in Spondylometaphyseal Dysplasia Algerian Type."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      It is well known that single nucleotide transitions that change an obligatory glycine residue in the Gly-X-Y triplet repeats to another bulkier amino acid are pathogenic.
    explanation: >-
      States the mechanism of this allele class. Graded indirect because it is
      the paper's framing of established collagen biochemistry rather than an
      experiment on this patient's protein; no functional study of either allele
      has been published.
- name: Abnormal Cartilage Extracellular Matrix
  biological_scale: TISSUE
  description: >-
    A structurally defective type II collagen network in hyaline cartilage. The
    consequences track the tissues in which type II collagen is the dominant
    structural protein: the growth plates of the long bones, the cartilaginous
    vertebral bodies and pelvis, and the vitreous humor.
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: extracellular matrix organization
    modifier: DECREASED
    term:
      id: GO:0030198
      label: extracellular matrix organization
  downstream:
  - target: Metaphyseal Growth Plate Dysplasia
    causal_link_type: DIRECT
  - target: Vertebral Body Growth Failure
    causal_link_type: DIRECT
  - target: Pelvic and Proximal Femoral Dysplasia
    causal_link_type: DIRECT
  - target: Abnormal Vitreous Collagen

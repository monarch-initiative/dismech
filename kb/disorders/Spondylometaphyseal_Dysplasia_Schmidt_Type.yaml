notes: >-
  Seven things about this entry are deliberate.

  First, **it is a standalone Disease entry rather than a subtype of another.**
  MONDO, OMIM (184253) and Orphanet (93316) all keep the concept distinct;
  dismech already curates five spondylometaphyseal dysplasias by eponym
  (Kozlowski, corner fracture, Megarbane, with cone-rod dystrophy, with corneal
  dystrophy); and the closest precedent for a COL2A1 eponym is multiple
  epiphyseal dysplasia Beighton type, curated standalone in #10987 with the type
  II collagenopathy spectrum argued in its own notes.

  Second, **the strongest argument against that decision is recorded rather than
  buried.** The 2013 report that supplied the first COL2A1 allele concluded that
  it is rational to lump this entity with spondyloepimetaphyseal dysplasia
  Strudwick type, which dismech curates separately as
  `Spondyloepimetaphyseal_Dysplasia_Strudwick_Type`. Its argument is that the
  two share dorsal vertebral flattening, iliac hypoplasia, extensive metaphyseal
  dysplasia and near-normal short tubular bones, and that the one discriminator,
  normal proximal femoral epiphyses, failed in their own patient whose mottled
  femoral heads improved with age. That improvement is curated here as the
  `Delayed Proximal Femoral Epiphyseal Ossification` phenotype precisely because
  it is the nosologically load-bearing observation. Anyone revisiting the
  lump/split call should start there.

  Third, **the eponym in the MONDO label is a 1988 attribution, not a
  historical fact this entry endorses.** Kozlowski's group proposed that a 1963
  case reported by Schmidt might be the same disorder; the modern literature
  writes the entity as Algerian type, and the 1963 paper is not cited here
  because it has no PubMed record with quotable content. "Schmidt type" is also
  ambiguous outside skeletal dysplasia, where Schmidt syndrome names autoimmune
  polyglandular syndrome type II, so anything sourced by this entry's name alone
  needs the OMIM number or COL2A1 attached.

  Fourth, **no phenotype carries a `frequency` band.** The entire literature is
  one Algerian family of five, a Polish boy, a Japanese boy and a Tunisian boy.
  Several phenotypes here rest on a single patient and say so in their
  `explanation`; a frequency band computed from that would be fiction.

  Fifth, **every treatment and surveillance record is class-level and graded
  that way.** No management study addresses this entity. What exists is the
  Skeletal Dysplasia Management Consortium's best-practice guideline for type II
  collagen disorders, so all three records carry `evidence_source: OTHER`
  (expert consensus, not a study) and `directness: INDIRECT`, and each says so
  in its own explanation. Retinal detachment is deliberately not curated as a
  phenotype for the same reason: the risk is asserted for the class and no
  source reports it in a patient with this disorder.

  Sixth, **the dominant-negative mechanism is not asserted as measured.** No
  functional study of Gly861Val or Gly1092Asp exists. The triple-helix node is
  supported by the 2013 paper's statement of the general allele-class mechanism
  and is graded `directness: INDIRECT` for that reason, and the `genetic` record
  says explicitly that the mechanism is inferred from the allele class.

  Seventh, **one phenotype is deliberately unwired.** `Cleft Soft Palate` has no
  incoming edge and its own `notes` says why: no node in this entry covers
  craniofacial development and no cited source connects the palate to the
  cartilage matrix defect in this disorder. Every other phenotype is the target
  of exactly one pathophysiology node.

  Two follow-ups left out of this pull request on purpose. Adding the entry to
  the `Type_2_Collagenopathies` grouping is a natural next step and belongs in
  its own PR so the grouping change can be reviewed on its own, exactly as the
  multiple epiphyseal dysplasia Beighton type entry left it. And
  `PMID:31021589`, the GeneReviews *Type II Collagen Disorders Overview*, is
  listed in `references` with a GeneReviews tag but carries no evidence item:
  the cached record is the chapter's scope statement only, with no clinical or
  management text to quote.

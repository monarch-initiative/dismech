treatments:
- name: Non-Invasive Ventilation for Obstructive Sleep Apnoea
  description: >-
    Management of HSS-related obstructive sleep apnoea is poorly documented, and
    tracheostomy has been the default when obstruction is severe. Non-invasive
    ventilation is the alternative worth trying first: in a reported infant with
    an obstructive apnoea-hypopnoea index of 140 per hour, for whom tracheostomy
    had been proposed, NIV was chosen after multidisciplinary discussion and
    succeeded. One case is not a guideline, but it is the best-documented
    airway option in a disorder where the airway is the main threat in infancy.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: non-invasive mechanical ventilation
    term:
      id: NCIT:C171457
      label: Non-Invasive Mechanical Ventilation
  target_phenotypes:
  - preferred_term: Obstructive sleep apnea
    term:
      id: HP:0002870
      label: Obstructive sleep apnea
  evidence:
  - reference: PMID:36405833
    reference_title: "Long term NIV in an infant with Hallermann-Streiff syndrome: A case report and overview of respiratory morbidity."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the case of an infant with HSS complicated by severe and early OSAS successfully managed with non-invasive ventilation (NIV)"
    explanation: >-
      A single successful case. PARTIAL because one case cannot establish
      efficacy, which is also why the description says so.
  - reference: PMID:36405833
    reference_title: "Long term NIV in an infant with Hallermann-Streiff syndrome: A case report and overview of respiratory morbidity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The management of these severe OSAS is difficult and poorly documented in literature."
    explanation: >-
      Establishes that no better-evidenced option exists, which is the context
      in which a single case report carries weight here.
- name: Anaesthetic Airway Precautions
  description: >-
    Recognizing the syndrome should itself change anaesthetic planning.
    Mandibular hypoplasia and microstomia make intubation difficult, and
    difficulty maintaining airway patency during induction has been reported.
    This is a safety instruction attached to any procedure requiring anaesthesia,
    not a treatment of the disorder.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Micrognathia
    term:
      id: HP:0000347
      label: Micrognathia
  evidence:
  - reference: PMID:9136243
    reference_title: "Hallermann-Streiff syndrome: airway problems during anaesthesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the patients with Hallermann-Streiff Syndrome, presence of mandibular hypoplasia and microstomia results in difficult intubation."
    explanation: >-
      States the anatomical basis of the anaesthetic risk.
  - reference: PMID:9136243
    reference_title: "Hallermann-Streiff syndrome: airway problems during anaesthesia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recognition of this syndrome should alert the physician to the possibility of difficulty in airway maintenance."
    explanation: >-
      The actionable instruction this treatment entry records.
- name: Multidisciplinary Craniofacial and Dental Reconstruction
  description: >-
    Staged craniofacial and dental management across the growth period. A
    20-year single-patient follow-up reports early genioplasty to improve facial
    growth and dental implantation before growth completion to provide
    orthodontic anchorage, with complementary orthognathic surgery. The evidence
    is one patient followed well, not a cohort.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_phenotypes:
  - preferred_term: Abnormality of the dentition
    term:
      id: HP:0000164
      label: Abnormality of the dentition
  evidence:
  - reference: PMID:29578805
    reference_title: "Diagnosis and Innovative Multidisciplinary Management of Hallermann-Streiff Syndrome: 20-Year Follow-Up of a Patient."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "early genioplasty and dental implantation before growth completion were performed. These steps allowed to improve facial growth and to provide orthodontic anchorage, respectively."
    explanation: >-
      Describes the staged approach and its stated benefits. PARTIAL because it
      is a single patient, which the authors themselves frame as a proposal for
      consideration rather than an established modality.
discussions:
- discussion_id: hss_entity_heterogeneity
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Unresolved Etiology
  prompt: >-
    Is Hallermann-Streiff syndrome one disease? If the original reports
    described patients with heterogeneous conditions, what fraction of the
    ~200 published cases would a molecular diagnosis reassign to some other
    entity?
  rationale: >-
    This is a gap about the entity, not only about its mechanism. A 2026 review
    concludes that the phenotype is consistent but that the original reports
    likely described heterogeneous conditions, and that HSS overlaps clinically
    with other genetic conditions - osteocraniostenosis among them. Without a
    genetic test, there is no way to tell a true HSS case from a phenocopy, so
    any mechanism curated for "HSS" risks being a mechanism for whatever mixture
    the label currently denotes.
  evidence:
  - reference: PMID:41742277
    reference_title: "A review of Hallermann-Streiff syndrome demonstrates clinical overlap with other conditions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is also likely that the original reports of HSS described patients with heterogeneous conditions."
    explanation: >-
      The review's own statement that the diagnostic category may not be a
      single entity.

      is asserted here because none is established.
pathophysiology:
- name: Unresolved Etiology
  biological_scale: ORGANISM
  role: trigger
  description: >-
    No mechanism is known. HSS is suspected to have a genetic basis, and
    non-recurrent deleterious variants in GJA1, CHD6 and ZMPSTE24 have been
    noted in individuals carrying the diagnosis, but none recurs across
    patients and the etiology of almost all cases remains unknown. There is no
    genetic test and no biomarker, which has itself hampered accurate
    delineation of the condition. This node exists to record the gap explicitly
    rather than to leave the pathophysiology section empty or to promote a
    candidate gene to a causal claim it cannot support.
  mechanism_confidence: HYPOTHETICAL
  evidence:
  - reference: PMID:41742277
    reference_title: "A review of Hallermann-Streiff syndrome demonstrates clinical overlap with other conditions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although HSS is suspected to have a genetic basis and non-recurrent deleterious variants in genes such as GJA1, CHD6, and ZMPSTE24 have been noted in patients diagnosed with HSS, the etiology for almost all cases remains unknown."
    explanation: >-
      States both the candidate genes and the fact that they do not amount to an
      etiology, which is exactly the claim this node makes.
  - reference: PMID:41742277
    reference_title: "A review of Hallermann-Streiff syndrome demonstrates clinical overlap with other conditions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the lack of a genetic test or other biomarker has complicated an accurate delineation of the condition"
    explanation: >-
      Explains why the entity itself, not just its mechanism, is imprecisely
      defined.

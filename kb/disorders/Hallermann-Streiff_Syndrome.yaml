    Almost all reported cases are sporadic. No inheritance mode is established,
    and the ISDS Nosology prints none. A genetic basis is suspected but not
    demonstrated.
  evidence:
  - reference: PMID:41742277
    reference_title: "A review of Hallermann-Streiff syndrome demonstrates clinical overlap with other conditions."
    supports: SUPPORT

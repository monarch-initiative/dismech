name: Hallermann-Streiff Syndrome
creation_date: "2026-08-27T04:30:00Z"
category: Mendelian
synonyms:
- HSS
- Francois dyscephalic syndrome
- Hallermann-Streiff-Francois syndrome
- oculomandibulodyscephaly with hypotrichosis
description: >-
  Hallermann-Streiff syndrome is defined by seven cardinal findings - congenital
  cataracts, microphthalmia, a recognizable facial gestalt, sparse hair with
  hypotrichosis, skin atrophy, dental anomalies and short stature. It is the
  outlier of its nosology group in a specific and important way: it is the only
  ISDS group-21 row with neither an inheritance mode nor a gene printed. About
  200 patients have been reported and almost all cases are sporadic, but no
  genetic test or biomarker exists, and the etiology of almost all cases remains
  unknown. Non-recurrent deleterious variants in GJA1, CHD6 and ZMPSTE24 have
  been noted in individuals diagnosed with HSS, none of them recurrent enough to
  constitute a molecular diagnosis.

  This entry is therefore deliberately mechanism-light. The pathophysiology
  section is a single node recording that the mechanism is unknown, and the
  entry does not import a candidate gene as if it were causal. A 2026 review
  makes the further point that the original reports probably described patients
  with heterogeneous conditions - so the diagnostic category may not correspond
  to a single disease at all. The differential includes osteocraniostenosis,
  which shares skull and long-bone anomalies but is usually lethal and adds the
  OCS facies and splenic hypoplasia that HSS lacks.

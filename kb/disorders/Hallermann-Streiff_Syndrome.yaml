classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
  isds_skeletal_category:
  - classification_value: primordial_dwarfism_and_slender_bones
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 21 "Primordial dwarfism and slender bone
      dysplasias", NOS 21-0070 "Hallermann-Streiff syndrome" (OMIM 234100). This
      is the only row in the group that prints neither an inheritance mode nor a
      gene - the committee lists the entity as clinically recognized but
      genetically unresolved. That is a statement about the nosology's inclusion
      criteria being clinical as well as molecular, and it is why this entry
      carries no causal gene.

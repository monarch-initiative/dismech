discussions:
- discussion_id: hss_entity_heterogeneity
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Unresolved Etiology
  prompt: >-
    Is Hallermann-Streiff syndrome one disease? If the original reports
    described patients with heterogeneous conditions, what fraction of the
    ~200 published cases would a molecular diagnosis reassign to some other
    entity?
  rationale: >-
    This is a gap about the entity, not only about its mechanism. A 2026 review
    concludes that the phenotype is consistent but that the original reports
    likely described heterogeneous conditions, and that HSS overlaps clinically
    with other genetic conditions - osteocraniostenosis among them. Without a
    genetic test, there is no way to tell a true HSS case from a phenocopy, so
    any mechanism curated for "HSS" risks being a mechanism for whatever mixture
    the label currently denotes.
  evidence:
  - reference: PMID:41742277
    reference_title: "A review of Hallermann-Streiff syndrome demonstrates clinical overlap with other conditions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It is also likely that the original reports of HSS described patients with heterogeneous conditions."
    explanation: >-
      The review's own statement that the diagnostic category may not be a
      single entity.

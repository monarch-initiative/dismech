datasets:
- accession: geo:GSE73336
  title: Transplantation of gastric organoid-derived spasmolytic polypeptide/TFF2-expressing metaplasia (SPEM) cell lineage promotes ulcer repair in the aged stomach
  description: 'Background & Aims: Spasmolytic polypeptide/TFF2-expressing metaplasia (SPEM) is known to emerge following parietal cell loss and during Helicobacter pylori infection, however its role in gastric ulcer repair is unknown. Therefore, we sought to investigate if SPEM plays a role in epithelial regeneration. Methods: Acetic acid ulcers were induced in young (2-3 months) C57BL/6 mice to determine the quality of ulcer repair. Gastric tissue was collected and analyzed to determine the expression of SPEM within the regenerating epithelium. As a comparison to native tissue the expression of SPEM was also identified within cultured gastric mouse-derived organoids.'

pathophysiology:
- name: H. pylori infection and Gastric Microbiota Dysbiosis
  description: >-
    H. pylori infection drives gastric microbiota dysbiosis through selective
    depletion of protective bacterial taxa. The healthy gastric microbiota is
    organized into two antagonistic communities: CST1A (enriched in non-ulcer
    controls, associated with motility-related processes) and CST1B (enriched
    in gastroduodenal disease, favoring nucleotide and peptidoglycan
    biosynthesis pathways). H. pylori infection depletes CST1A taxa, allowing
    pathogenic CST1B dominance and loss of protective CST1A-derived Achromobacter
    spanius, which normally alleviates gastric mucosal injury through
    anti-inflammatory mechanisms.
  role: trigger
  evidence:
  - reference: PMID:42413498
    reference_title: "Core gastric microbiota linked to pathogenesis and preserved across age-stratified cohorts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CST1A is enriched in non-ulcer controls, whereas CST1B is associated with gastroduodenal disease"
    explanation: >-
      Identifies the two antagonistic core gastric microbiota communities
      (CST1A and CST1B) and their association with disease/control status.
  - reference: PMID:42413498
    reference_title: "Core gastric microbiota linked to pathogenesis and preserved across age-stratified cohorts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Helicobacter pylori infection depletes CST1A taxa"
    explanation: >-
      Documents H. pylori's direct role in depleting the protective CST1A
      microbiota community.
  - reference: PMID:42413498
    reference_title: "Core gastric microbiota linked to pathogenesis and preserved across age-stratified cohorts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CST1A-derived Achromobacter spanius alleviates gastric mucosal injury by modulating inflammatory responses"
    explanation: >-
      Demonstrates a specific protective mechanism where CST1A-derived
      Achromobacter spanius mitigates mucosal injury through
      anti-inflammatory pathways.
  - reference: PMID:42413498
    reference_title: "Core gastric microbiota linked to pathogenesis and preserved across age-stratified cohorts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cross-cohort validation across eight datasets (n = 1,299) confirms the persistent relevance of the CST1A-CST1B structure across disease stages"
    explanation: >-
      Large-scale, age-stratified cross-cohort validation demonstrates the
      robustness and clinical relevance of the CST1A-CST1B dysbiosis framework
      across diverse populations and life stages.
- name: H. pylori and NSAID-associated mucosal injury
  description: Gastric ulceration commonly relates to H. pylori infection or
    NSAID exposure, reflecting mucosal injury pathways.
  evidence:
  - reference: PMID:28242110
    reference_title: "Peptic ulcer disease."
    supports: PARTIAL
    snippet: "Peptic ulcers not associated with H pylori infection or the use of non-steroidal
      anti-inflammatory drugs are now also imposing substantial diagnostic and therapeutic
      challenges."
    explanation: The review notes H. pylori infection and NSAID use as key
      etiologic contexts for peptic ulcers.

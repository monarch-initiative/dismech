name: Gastric Ulcer
creation_date: '2026-02-02T00:16:36Z'
description: >-
  Gastric ulcer is a localized defect in the stomach lining that extends through the
  muscularis mucosae, arising when aggressive luminal factors overwhelm mucosal
  defense. The two dominant causes are Helicobacter pylori infection and the use of
  nonsteroidal anti-inflammatory drugs, both of which disrupt the protective
  mucus-bicarbonate barrier and prostaglandin-mediated cytoprotection. Patients
  typically present with epigastric pain, and serious complications include
  upper gastrointestinal bleeding and perforation.
category: Complex
parents:
- Peptic Ulcer Disease
disease_term:
  preferred_term: gastric ulcer
  term:
    id: MONDO:0001126
    label: gastric ulcer
pathophysiology:
- name: H. pylori-Driven CST1A Depletion
  description: >-
    H. pylori infection selectively depletes CST1A bacterial taxa from the
    gastric microbiota. CST1A communities are enriched in non-ulcer controls
    and linked to protective motility-related processes; their depletion is
    the primary microbiota-disrupting effect of H. pylori.
  role: trigger
  evidence:
  - reference: PMID:42413498
    reference_title: "Core gastric microbiota linked to pathogenesis and preserved across age-stratified cohorts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Helicobacter pylori infection depletes CST1A taxa"
    explanation: >-
      Documents H. pylori's direct role in depleting the protective CST1A
      microbiota community in a pediatric 16S sequencing cohort.
  downstream:
  - target: CST1B Pathogenic Community Dominance
- name: CST1B Pathogenic Community Dominance
  description: >-
    Depletion of CST1A allows pathogenic CST1B communities to dominate the
    gastric microbiota. CST1B is enriched in gastroduodenal disease and
    favors nucleotide and peptidoglycan biosynthesis pathways. The
    CST1A-CST1B imbalance is preserved across age cohorts and disease stages.
  evidence:
  - reference: PMID:42413498
    reference_title: "Core gastric microbiota linked to pathogenesis and preserved across age-stratified cohorts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CST1A is enriched in non-ulcer controls, whereas CST1B is associated with gastroduodenal disease"
    explanation: >-
      Identifies the two antagonistic core gastric microbiota communities
      and their association with disease versus control status.
  - reference: PMID:42413498
    reference_title: "Core gastric microbiota linked to pathogenesis and preserved across age-stratified cohorts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cross-cohort validation across eight datasets (n = 1,299) confirms the persistent relevance of the CST1A-CST1B structure across disease stages"
    explanation: >-
      Large-scale cross-cohort validation confirms the robustness of the
      CST1A-CST1B dysbiosis framework across diverse populations and life stages.
  downstream:
  - target: Loss of Achromobacter spanius Mucosal Protection
- name: Loss of Achromobacter spanius Mucosal Protection
  description: >-
    Depletion of CST1A taxa eliminates CST1A-derived Achromobacter spanius,
    which normally alleviates gastric mucosal injury through anti-inflammatory
    mechanisms. Loss of this protective commensal removes a key mucosal
    safeguard and contributes to ulceration.
  evidence:
  - reference: PMID:42413498
    reference_title: "Core gastric microbiota linked to pathogenesis and preserved across age-stratified cohorts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro and in vivo experiments demonstrate that CST1A-derived Achromobacter spanius alleviates gastric mucosal injury by modulating inflammatory responses"
    explanation: >-
      In vitro experiments establish Achromobacter spanius as a protective
      anti-inflammatory agent for the gastric mucosa.
  - reference: PMID:42413498
    reference_title: "Core gastric microbiota linked to pathogenesis and preserved across age-stratified cohorts."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In vitro and in vivo experiments demonstrate that CST1A-derived Achromobacter spanius alleviates gastric mucosal injury by modulating inflammatory responses"
    explanation: >-
      In vivo animal model experiments corroborate Achromobacter spanius's
      protective anti-inflammatory role in the gastric mucosa.
  downstream:
  - target: H. pylori and NSAID-associated mucosal injury
- name: H. pylori and NSAID-associated mucosal injury
  description: Gastric ulceration commonly relates to H. pylori infection or
    NSAID exposure, reflecting mucosal injury pathways.
  evidence:
  - reference: PMID:28242110
    reference_title: "Peptic ulcer disease."
    supports: PARTIAL
    snippet: "Peptic ulcers not associated with H pylori infection or the use of non-steroidal
      anti-inflammatory drugs are now also imposing substantial diagnostic and therapeutic
      challenges."
    explanation: The review notes H. pylori infection and NSAID use as key
      etiologic contexts for peptic ulcers.
- name: Gastric Microbiota Dysbiosis with CST1A Depletion
  description: >
    The gastric core microbiota is organized into two antagonistic community state
    types, CST1A and CST1B. CST1A is enriched in non-ulcer controls and linked by
    functional profiling to motility-related processes, whereas CST1B is associated
    with gastroduodenal disease. H. pylori infection depletes CST1A taxa, shifting
    the community toward CST1B dominance. Note that this core structure was defined
    in a discovery cohort of 255 pediatric samples; its persistence across disease
    stages rests on cross-cohort validation over eight further datasets
    (n = 1,299), not on the primary cohort.
  biological_scale: TISSUE
  downstream:
  - target: Loss of CST1A-Mediated Mucosal Protection
    causal_link_type: DIRECT
    description: >-
      Depletion of the CST1A community removes the CST1A-derived taxa that
      restrain gastric mucosal inflammation.
  evidence:
  - reference: PMID:42413498
    reference_title: "Core gastric microbiota linked to pathogenesis and preserved across age-stratified cohorts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using full-length 16S and ITS sequencing of 255 pediatric samples, this study
      identifies 11 core bacterial genera organized into two antagonistic communities, CST1A and CST1B. CST1A is
      enriched in non-ulcer controls, whereas CST1B is associated with gastroduodenal
      disease"
    explanation: Primary evidence for the protective CST1A microbiota composition and disease-associated CST1B shift, in a pediatric discovery cohort.
  - reference: PMID:42413498
    reference_title: "Core gastric microbiota linked to pathogenesis and preserved across age-stratified cohorts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stratified analyses show that Helicobacter pylori infection depletes CST1A taxa"
    explanation: Direct evidence that H. pylori infection causes CST1A depletion in gastric dysbiosis.
  - reference: PMID:42413498
    reference_title: "Core gastric microbiota linked to pathogenesis and preserved across age-stratified cohorts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Functional profiling indicates that CST1A is linked to motility-related processes, while CST1B favors nucleotide and peptidoglycan biosynthesis"
    explanation: Supports the motility-related functional characterization of CST1A and the contrasting biosynthetic profile of CST1B.
  - reference: PMID:42413498
    reference_title: "Core gastric microbiota linked to pathogenesis and preserved across age-stratified cohorts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cross-cohort validation across eight datasets (n = 1,299) confirms the persistent relevance of the CST1A-CST1B structure across disease stages"
    explanation: Establishes that n=1,299 is the cross-cohort validation set rather than the pediatric discovery cohort.
- name: Loss of CST1A-Mediated Mucosal Protection
  description: >
    CST1A-derived taxa, notably Achromobacter spanius, protect the gastric mucosa
    by modulating inflammatory responses. Their depletion removes that
    anti-inflammatory brake, so the mucosal inflammatory response rises and
    susceptibility to mucosal injury increases.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  downstream:
  - target: H. pylori and NSAID-associated mucosal injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of the protective CST1A taxa aggravates gastric mucosal injury. The
      protective direction is established in animal and cell-culture models; the
      intermediates linking it to human ulceration are not resolved.
    evidence:
    - reference: PMID:42413498
      reference_title: "Core gastric microbiota linked to pathogenesis and preserved across age-stratified cohorts."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In vitro and in vivo experiments demonstrate that CST1A-derived Achromobacter spanius alleviates gastric mucosal injury by modulating inflammatory responses"
      explanation: In vivo animal data that the CST1A-derived taxon alleviates gastric mucosal injury, so its loss aggravates injury.
  evidence:
  - reference: PMID:42413498
    reference_title: "Core gastric microbiota linked to pathogenesis and preserved across age-stratified cohorts."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In vitro and in vivo experiments demonstrate that CST1A-derived Achromobacter spanius alleviates gastric mucosal injury by modulating inflammatory responses"
    explanation: In vivo animal evidence for the protective, inflammation-modulating mechanism of the CST1A-derived bacterium.
  - reference: PMID:42413498
    reference_title: "Core gastric microbiota linked to pathogenesis and preserved across age-stratified cohorts."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro and in vivo experiments demonstrate that CST1A-derived Achromobacter spanius alleviates gastric mucosal injury by modulating inflammatory responses"
    explanation: Cell-culture arm of the same experiments supporting the protective, inflammation-modulating mechanism.

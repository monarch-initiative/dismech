    reference_title: "Orbitofrontal cortical dysfunction in akinetic catatonia: a functional magnetic resonance imaging study during negative emotional stimulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Catatonic patients showed alterations in the orbitofrontal cortical
      activation pattern and in functional connectivity to the premotor cortex
      in negative and positive emotions compared to psychiatric and healthy
      controls.
    explanation: >-
      Associational functional imaging localizes a candidate circuit disturbance; it does not
      demonstrate a causal emotional-motor lesion.
    quote_role: PRIMARY_RESULT
    directness: INDIRECT

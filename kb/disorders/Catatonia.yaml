  - target: Glutamatergic NMDA Receptor Perturbation and Neuroinflammation
    causal_link_type: DIRECT
    hypothesis_groups:
    - immune_mediated_model
    description: >-
      In the autoimmune subgroup the upstream condition acts directly, through

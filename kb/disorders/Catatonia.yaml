- name: Orbitofrontal Emotional-Motor Processing Dysfunction
  biological_scale: TISSUE
  description: >-
    A small emotional-task fMRI study of postacute akinetic catatonia found altered orbitofrontal
    activation and functional connectivity with premotor cortex. Behavioral and affective symptom
    scores correlated with orbitofrontal activity, while motor symptoms were related to medial
    prefrontal activity. A persistent trait abnormality is one interpretation, but postacute
    sampling cannot distinguish predisposition from consequences of illness or treatment.
  locations:

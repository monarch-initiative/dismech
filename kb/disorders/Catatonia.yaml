name: Catatonia
creation_date: '2026-08-14T09:00:00Z'
category: Psychiatric
synonyms:
- catatonic syndrome
- catatonic state
- catatonic disorder
description: >-
  Catatonia is a transdiagnostic psychomotor syndrome that arises across
  psychiatric, neurologic, neurodevelopmental, autoimmune, and general medical
  conditions rather than belonging to any one of them. It is defined
  clinically by a cluster of motor, volitional, affective, and behavioral signs
  — stupor, mutism, catalepsy and posturing, negativism, stereotypy, echolalia,
  grimacing, and agitation — and it is internally heterogeneous, with
  hypokinetic, hyperkinetic, and aberrant-volitional components that may
  overlap within a single episode.

  The mechanism is best described as convergence rather than as a single causal
  chain. Diverse upstream liabilities — a psychiatric illness, autoimmune
  encephalitis, a metabolic derangement, or exposure to and withdrawal from
  dopamine-blocking drugs — destabilize a shared set of psychomotor networks
  (cortico-striatal-thalamic, cortico-cerebellar, orbitofrontal, cingulate, and
  motor-premotor). Neurochemically, the best-evidenced disturbances are a
  cortical GABA-A receptor deficit (the direct correlate of the syndrome's
  near-immediate response to lorazepam), reduced striatal dopaminergic
  transmission, and glutamatergic/NMDA-mediated dysfunction, with immune
  mechanisms specifically relevant in autoimmune subgroups. Importantly, no
  single biomarker or unified mechanism accounts for catatonia across all
  contexts, and this entry models that heterogeneity explicitly as competing
  and complementary hypotheses rather than collapsing it into one chain.

  Treatment is unusually mechanism-legible for a psychiatric syndrome:
  benzodiazepines (lorazepam) and electroconvulsive therapy are both
  first-line and both act on the nodes curated here. Malignant catatonia — the
  form with autonomic instability — is life-threatening and is the principal
  indication for urgent ECT.

name: Catatonia
creation_date: '2026-08-14T09:00:00Z'
category: Psychiatric
synonyms:
- catatonic syndrome
- catatonic state
- catatonic disorder
description: >-
  Catatonia is a transdiagnostic psychomotor syndrome affecting movement, speech, affect and
  behavior. It occurs with psychiatric, neurological, neurodevelopmental and general medical
  conditions. Hypokinetic, hyperkinetic and qualitatively abnormal motor signs can overlap or
  fluctuate within an episode. Malignant catatonia includes clinically significant autonomic
  dysfunction and can be life-threatening. Imaging and pharmacological observations implicate
  interacting GABAergic, glutamatergic, dopaminergic and distributed network disturbances, but
  no single mechanism or diagnostic biomarker accounts for all presentations. Benzodiazepines
  and electroconvulsive therapy are first-line treatments; treatment of the underlying condition
  and prevention of medical complications are also required.

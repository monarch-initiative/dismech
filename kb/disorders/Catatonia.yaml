- name: Patient and caregiver education
  description: >-
    Explain that catatonia is treatable and can impair communication and voluntary initiation.
    Teach families to recognize new motor or behavioral changes and recurrence, and coordinate
    psychiatric, neurological, nursing and rehabilitation care.

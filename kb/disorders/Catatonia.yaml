- name: Reduced Striatal Dopaminergic Transmission
  biological_scale: CELLULAR
  description: >-
    Reduced dopaminergic transmission in the dorsal striatum shifts the balance
    of basal-ganglia direct and indirect pathway output toward inhibition of
    movement initiation and speed. The clinical signature is bidirectional:
    dopamine antagonists can induce catatonia and parkinsonism, and
    dopaminergic medication can relieve catatonia. This node is also the
    proposed point of contact between catatonia and neuroleptic malignant
    syndrome, which share precipitants and an overlapping motor phenotype.

mechanistic_hypotheses:
- hypothesis_group_id: distributed_psychomotor_network_model
  hypothesis_label: Catatonia as distributed psychomotor network dysfunction, not a single-lesion disorder
  status: CANONICAL
  description: >-
    The best-supported current model treats catatonia as a final common
    phenotype of disturbed psychomotor regulation. Heterogeneous upstream
    liabilities converge on a shared set of networks — cortico-striatal-thalamic,
    cortico-cerebellar, orbitofrontal, cingulate, and motor-premotor —
    destabilizing them and producing a recognizable but internally
    heterogeneous syndrome. The model's explanatory strength is that it
    accommodates the syndrome's transdiagnostic breadth, which any
    schizophrenia-centered or single-transmitter account fails to do. Its
    principal weakness is sampling: the imaging literature is dominated by
    schizophrenia-spectrum cohorts and by post-acute rather than acute states.
  evidence:
  - reference: PMID:42431537
    reference_title: "Toward a systems model of catatonia: Circuits, neurochemistry, immune perturbation, and biological heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The best-supported mechanistic model to date comes from neuroimaging
      studies implicating cortico-striatal-thalamic, cortico-cerebellar,
      orbitofrontal, cingulate, and motor-premotor networks.
    explanation: >-
      States the network membership of the canonical model and its evidential
      basis in neuroimaging.
  - reference: PMID:42431537
    reference_title: "Toward a systems model of catatonia: Circuits, neurochemistry, immune perturbation, and biological heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the evidence supports a convergent model in which diverse upstream
      liabilities destabilize shared psychomotor networks, producing a
      recognizable but heterogeneous syndrome
    explanation: >-
      The convergence claim that justifies modeling catatonia as one entity
      with many entry points rather than as many disease-specific mechanisms.
- hypothesis_group_id: gabaergic_deficit_model
  hypothesis_label: Cortical GABA-A receptor deficit as the proximate substrate of the akinetic form
  status: ALTERNATIVE
  description: >-
    The oldest mechanistically specific account starts from the syndrome's most
    striking pharmacological fact — akinesia and anxiety that remit within
    minutes of lorazepam — and locates the lesion at the GABA-A receptor.
    In vivo benzodiazepine-receptor SPECT in akinetic catatonia found reduced
    iomazenil binding in the left sensorimotor cortex, interpreted as decreased
    GABA-A receptor density, with symptom severity correlating with the binding
    deficit. This is recorded as ALTERNATIVE rather than CANONICAL because it
    is a single small study of the akinetic subtype, and because the broader
    neurochemical evidence points to interacting rather than single-transmitter
    disturbance.
  evidence:
  - reference: PMID:10486389
    reference_title: "Decreased density of GABA-A receptors in the left sensorimotor cortex in akinetic catatonia: investigation of in vivo benzodiazepine receptor binding."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Reduced iomazenil binding suggests decreased density of GABA-A receptors
      in the left sensorimotor cortex in akinetic catatonia.
    explanation: >-
      Direct in vivo receptor-imaging evidence for the GABA-A deficit this
      hypothesis is built on.
  - reference: PMID:42431537
    reference_title: "Toward a systems model of catatonia: Circuits, neurochemistry, immune perturbation, and biological heterogeneity."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neurochemical evidence supports the notion of interacting disturbances in
      GABAergic inhibition, glutamatergic/NMDA-mediated excitation, and
      dopaminergic modulation rather than a single-transmitter explanation.
    explanation: >-
      Qualifies the GABA-only account: the contemporary synthesis treats
      GABAergic inhibition as one interacting term, not the whole mechanism.
- hypothesis_group_id: striatal_dopamine_hypofunction_model
  hypothesis_label: Reduced striatal dopaminergic transmission as a transdiagnostic psychomotor substrate
  status: ALTERNATIVE
  description: >-
    A parallel account places the proximate lesion in the dorsal striatum,
    proposing that reduced dopaminergic transmission is a transdiagnostic
    substrate for psychomotor retardation shared by Parkinson disease,
    drug-induced parkinsonism, neuroleptic malignant syndrome, catatonia, and
    depression. Two clinical observations anchor it: dopamine antagonists can
    induce catatonia, and dopaminergic medication can relieve it. It is
    recorded as ALTERNATIVE because the primary evidence is a hypothesis-level
    synthesis about psychomotor retardation broadly rather than catatonia
    specifically, and because CSF dopamine-catabolite measurement has been
    inconsistent and nonspecific.
  evidence:
  - reference: PMID:40966690
    reference_title: Reduced striatal dopamine transmission as a transdiagnostic substrate of psychomotor retardation.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we discuss the hypothesis that reduced striatal dopaminergic transmission
      is a transdiagnostic substrate for psychomotor retardation underlying the
      motor features of conditions such as Parkinson's disease, drug-induced
      parkinsonism, neuroleptic malignant syndrome, catatonia and depression
    explanation: >-
      States the hypothesis and explicitly includes catatonia among the
      conditions it is proposed to cover. Marked PARTIAL because the authors
      present it as a hypothesis under review, not an established finding.
  - reference: PMID:40966690
    reference_title: Reduced striatal dopamine transmission as a transdiagnostic substrate of psychomotor retardation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Parkinson's disease and catatonia generally respond well to dopaminergic
      medication. In contrast, dopamine antagonists can induce both parkinsonism
      and catatonia.
    explanation: >-
      The bidirectional pharmacological argument — dopamine blockade induces,
      dopaminergic treatment relieves — that motivates the striatal dopamine
      arm.
- hypothesis_group_id: immune_mediated_model
  hypothesis_label: Immune-mediated NMDA receptor perturbation in autoimmune subgroups
  status: EMERGING
  description: >-
    In a mechanistically distinct subgroup, catatonia arises from autoimmune
    perturbation of glutamatergic signaling — most clearly in NMDA receptor
    antibody encephalitis, where catatonia is present in a majority of reported
    cases. The subgroup matters clinically because its treatment is
    immunotherapy directed at the antibody-mediated process, not only
    benzodiazepines. The arm is EMERGING rather than established as a general
    mechanism because it accounts for a subgroup rather than the syndrome, and
    because peripheral inflammatory biomarkers remain nonspecific.
  evidence:
  - reference: PMID:42431537
    reference_title: "Toward a systems model of catatonia: Circuits, neurochemistry, immune perturbation, and biological heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immune mechanisms are particularly relevant in subgroups, especially in
      autoimmune encephalitis and inflammatory CNS conditions, whereas
      peripheral biomarkers remain nonspecific.
    explanation: >-
      Scopes the immune arm to subgroups and records the biomarker limitation
      that keeps it from generalizing.
  - reference: PMID:32070914
    reference_title: "Catatonia in N-methyl-d-aspartate receptor antibody encephalitis: Phenomenological characteristics from a systematic review of case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Catatonia was present in 60% of these cases.
    explanation: >-
      Quantifies how strongly catatonia tracks with NMDA receptor antibody
      encephalitis in the published case literature.
pathophysiology:
- name: Heterogeneous Upstream Liability
  biological_scale: ORGANISM
  description: >-
    The entry point to catatonia is not a single lesion but any of a wide range
    of upstream conditions: mood disorders, schizophrenia-spectrum illness,
    autism, autoimmune encephalitis (particularly NMDA receptor encephalitis),
    systemic lupus erythematosus, thyroid disease, epilepsy, and
    medication-induced or withdrawal states. This node exists so that the
    downstream mechanism can be curated once and referenced from the many
    disorders in which catatonia appears, rather than duplicated per disease.
    Genetic and developmental data are consistent with this framing: they
    support vulnerability rather than a single syndrome-specific architecture.
  evidence:
  - reference: PMID:42431537
    reference_title: "Toward a systems model of catatonia: Circuits, neurochemistry, immune perturbation, and biological heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Catatonia is a transdiagnostic psychomotor syndrome that occurs across
      psychiatric, neurologic, neurodevelopmental, autoimmune, and general
      medical conditions.
    explanation: >-
      Establishes the breadth of upstream conditions this node stands for.
  - reference: PMID:37236789
    reference_title: The diagnosis and treatment of catatonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It can occur in a wide range of psychiatric and neurological conditions,
      including depression, mania, schizophrenia, autism, autoimmune
      encephalitis (particularly NMDAR encephalitis), systemic lupus
      erythematosus, thyroid disease, epilepsy and medication-induced and
      -withdrawal states.
    explanation: >-
      Enumerates the specific upstream conditions, which is what makes this
      node a genuine convergence point rather than a placeholder.
  - reference: PMID:42431537
    reference_title: "Toward a systems model of catatonia: Circuits, neurochemistry, immune perturbation, and biological heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic and developmental data support vulnerability rather than
      unitarity, implicating synaptic, GABAergic, and microglial processes
      without a single syndrome-specific architecture.
    explanation: >-
      Supports treating the upstream layer as liability rather than as a
      unitary cause.
  downstream:
  - target: Cortical GABA-A Receptor-Mediated Inhibition Deficit
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - gabaergic_deficit_model
    description: >-

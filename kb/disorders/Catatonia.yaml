  - target: Distributed Psychomotor Network Destabilization
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - distributed_psychomotor_network_model
    description: >-
      The summary edge of the canonical model: heterogeneous liabilities reach
      the shared networks through the neurochemical nodes curated above.
- name: Cortical GABA-A Receptor-Mediated Inhibition Deficit
  biological_scale: MOLECULAR
  description: >-
    Reduced GABA-A receptor-mediated inhibition in sensorimotor and adjacent
    cortex is the proximate molecular substrate most directly evidenced in
    akinetic catatonia. In vivo SPECT with iodine-123-iomazenil, a
    benzodiazepine-site ligand, showed significantly lower binding in the left
    sensorimotor cortex in catatonic patients than in psychiatric controls
    matched for age, sex, medication, and underlying diagnosis — so the finding
    is not attributable to the underlying psychiatric illness or its treatment.
    Catatonic motor and affective symptom severity correlated with the binding
    deficit. Regional cerebral blood flow was separately reduced in right lower
    prefrontal and parietal cortex, implicating a second, perfusion-level site.
    This node is the molecular target of benzodiazepine treatment.

    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Prompt recognition and treatment of catatonia are crucial because malignant
      catatonia may be fatal without treatment.
    explanation: >-
      Records the outcome that makes this node the highest-stakes branch of the
      graph.

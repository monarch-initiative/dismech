differential_diagnoses:
- name: Neuroleptic malignant syndrome
  description: >-
    Neuroleptic malignant syndrome overlaps with malignant catatonia in rigidity, hyperthermia,
    altered mental state and autonomic dysfunction. Some experts consider dopamine-blocker-associated
    NMS a form of malignant catatonia.
  distinguishing_features:
  - A temporal relationship to a dopamine receptor blocking medication supports NMS; malignant catatonia can occur without this exposure.
  - Suspected NMS requires immediate cessation of dopamine blocking medications and urgent treatment.
  evidence:
  - reference: url:https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    reference_title: https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      many experts consider neuroleptic malignant syndrome (NMS) to be a type of malignant catatonia
      that is precipitated by dopamine receptor blocking agents.
    explanation: >-
      The resource document describes the exposure relationship and diagnostic overlap.
  - reference: url:https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    reference_title: https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      When NMS is suspected, immediate cessation of antipsychotic and other dopamine blocking
      medications is imperative.
    explanation: >-
      Identifies an immediate management implication of this differential.
- name: Delirium
  description: >-
    Hypoactive delirium can resemble hypokinetic catatonia, and hyperactive delirium can resemble
    excited catatonia. The conditions can coexist; diagnostic manuals differ in how this is
    represented.
  distinguishing_features:
  - Fluctuating arousal, impaired attention and cognitive disturbance favor delirium; additional catalepsy, posturing or echophenomena support assessment for coexisting catatonia.
  - An EEG may support delirium assessment, but does not replace clinical evaluation.
  evidence:
  - reference: url:https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    reference_title: https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Distinguishing features of delirium include impaired or fluctuating level of arousal,
      attention, and other cognitive disturbances. EEG can be helpful to confirm the diagnosis
      of delirium.
    explanation: >-
      Supports the cognitive distinction in hyperactive presentations.
  - reference: url:https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    reference_title: https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Classic findings more specific to catatonia are often helpful in identifying catatonia
      in patients with or at risk for delirium.
    explanation: >-
      Supports assessment for both conditions rather than treating them as mutually exclusive.
  - reference: url:https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    reference_title: https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the ICD-11 recognizes catatonia as a distinct condition and allows for the co-diagnosis
      of both delirium and catatonia if they occur simultaneously.
    explanation: >-
      Clarifies that the nosological distinction is not a biological exclusion.
- name: Akinetic mutism and abulia
  description: >-
    Reduced volition after neurological injury can markedly reduce spontaneous movement and
    speech, resembling hypokinetic catatonia.
  distinguishing_features:
  - Neurological injury and severe reduction in spontaneous movement and speech support an abulic or akinetic-mutism syndrome.
  - Additional positive catatonic signs, particularly catalepsy, posturing or echophenomena, favor a catatonic component; a lorazepam response alone is not a specific discriminator.
  evidence:
  - reference: url:https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    reference_title: https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This disorder, characterized by reduced or absent volition, is typically due to neurologic
      injury affecting the ventromedial prefrontal cortex or anterior cingulate cortex (e.g.,
      stroke, traumatic brain injury). Patients exhibit severe reductions in spontaneous movement
      and speech, which can resemble catatonia.
    explanation: >-
      Describes the neurological context and clinical overlap without treating reduced speech
      as an exclusion.
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the positive features of catatonia (such as echophenomena, catalepsy and posturing) may
      have greater discriminatory value than some of the negative features (such as mutism and
      stupor). Challenge tests are useful in many situations
    explanation: >-
      General differential principle from the BAP guideline, not a test validated specifically
      against abulia.
- name: Late-stage Parkinson disease
  description: >-
    Advanced Parkinson disease may cause immobility, rigidity and markedly reduced speech that
    resemble hypokinetic catatonia.
  distinguishing_features:
  - Established Parkinson disease, resting tremor, postural instability, levodopa responsiveness and supportive dopamine transporter imaging help distinguish the underlying movement disorder.
  - These findings do not establish a shared degenerative mechanism for catatonia.
  evidence:
  - reference: url:https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    reference_title: https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      These patients have a known diagnosis of PD and other distinguishing features of PD, including
      resting tremor, positive response to levodopa and postural instability, and/or a positive
      dopamine transporter scan
    explanation: >-
      The document identifies disease history and parkinsonian features as discriminators, not
      a universal catatonia mechanism.
- name: Locked-in syndrome
  description: >-
    Patients can be immobile and mute while retaining the motivation to communicate.
  distinguishing_features:
  - Attempts to communicate through preserved eye movements support locked-in syndrome.
  - Brain MRI can identify the responsible brainstem lesion.
  evidence:
  - reference: url:https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    reference_title: https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      These patients are often motivated to try to communicate with eye movements (which may
      be their only residual voluntary movements)
    explanation: >-
      Identifies a useful bedside feature without claiming every patient retains identical movements.
  - reference: url:https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    reference_title: https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Locked-in syndrome is caused by brainstem lesions identified on brain MRI.
    explanation: >-
      Supports structural imaging in the differential.
- name: Serotonin syndrome
  description: >-
    Serotonin syndrome can resemble malignant catatonia through autonomic instability, hyperthermia
    and rigidity.
  distinguishing_features:
  - A history of serotonergic agents and their doses is central to assessment.
  - Hyperreflexia, myoclonus and gastrointestinal symptoms support serotonin syndrome.
  evidence:
  - reference: url:https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    reference_title: https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Hyperreflexia, myoclonus, and gastrointestinal symptoms can help to identify SS. Quantification
      of use and doses of all serotoninergic agents taken prior to presentation is necessary.
    explanation: >-
      Provides specific distinguishing features and the relevant exposure history.
- name: Stiff-person syndrome
  description: >-
    Muscle stiffness and spasms can limit movement and resemble catatonic rigidity. Both syndromes
    may improve with benzodiazepines.
  distinguishing_features:
  - Emotional stress can exacerbate stiffness and spasms in stiff-person syndrome.
  - Preserved speech and cognition are typical, and elevated glutamic acid decarboxylase antibodies support the diagnosis.
  - Benzodiazepine responsiveness does not separate these conditions.
  evidence:
  - reference: url:https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    reference_title: https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The condition is exacerbated by emotional stress. Symptoms such as limited movement and
      positive response to benzodiazepines in SPS can somewhat resemble hypoactive catatonia.
      SPS differs from catatonia in that these patients are verbal and are typically fully cognitively
      intact. A diagnosis of SPS is supported by elevated levels of glutamic acid decarboxylase
      (GAD) antibodies
    explanation: >-
      Supports clinical and antibody distinctions while qualifying the nonspecific treatment
      response.
- name: Akathisia
  description: >-
    Motor restlessness can resemble excited catatonia, including after dopamine blocking medication
    exposure.
  distinguishing_features:
  - Patients often describe inner restlessness and discomfort driving the movements.
  - Other catatonic signs are usually absent.
  evidence:
  - reference: url:https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    reference_title: https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      patients with akathisia will often describe an inner state of restlessness and discomfort
      that leads to and perpetuates the motor symptoms.
    explanation: >-
      Supports the subjective restlessness distinction.
  - reference: url:https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    reference_title: https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      patients with akathisia will not typically exhibit any other signs of catatonia.
    explanation: >-
      Qualifies the distinction as typical rather than absolute.
- name: Major neurocognitive disorders
  description: >-
    Advanced neurocognitive disorders may cause hypokinesis and mutism. Catatonia can also occur
    as a superimposed syndrome.
  distinguishing_features:
  - Longitudinal cognitive decline across multiple domains supports an underlying neurocognitive disorder.
  - Posturing, catalepsy and waxy flexibility suggest coexisting catatonia rather than dementia alone.
  evidence:
  - reference: url:https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    reference_title: https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In later stages of major neurocognitive disorder (MNCD)/dementia, patients can develop
      hypokinesis and mutism. However, they do not develop classic specific catatonia symptoms
      such as posturing, catalepsy and waxy flexibility unless comorbid catatonia is present.
    explanation: >-
      Supports assessment for a superimposed catatonic syndrome.
  - reference: url:https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    reference_title: https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Obtaining a chronological history of clinical progression can be clarifying, given that
      most MNCDs tend to develop and worsen over time.
    explanation: >-
      Supports the longitudinal distinction without claiming all catatonia is acute or episodic.
- name: Mania
  description: >-
    Mania and hyperkinetic catatonia can both produce agitation, excitation and excessive or
    disorganized speech. Severe mania may coexist with catatonia.
  distinguishing_features:
  - Manic agitation may be goal-directed, whereas catatonic agitation is not.
  - The presence of mania does not exclude additional catatonic signs.
  evidence:
  - reference: url:https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    reference_title: https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      One distinguishing feature is that agitation in catatonia is not goal-directed, whereas
      a manic episode may include goal-directed agitation. It is important to keep in mind that
      a severe manic episode and catatonia may co-occur.
    explanation: >-
      Retains the conditional nature of the clinical distinction.
- name: Anti-NMDA receptor encephalitis
  description: >-
    Anti-NMDA receptor encephalitis can cause a full catatonic syndrome or some overlapping
    signs, including autonomic instability. It is an etiological consideration as well as a
    diagnostic overlap.
  distinguishing_features:
  - A partial or absent lorazepam response does not exclude catatonia associated with anti-NMDA receptor encephalitis.
  - When the cause of catatonia is unclear, the etiological workup may include serum and CSF neuronal autoantibodies.
  evidence:
  - reference: url:https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    reference_title: https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      This condition may present with full spectrum catatonia, or patients may have only some
      of the classic symptoms of catatonia, including autonomic instability
    explanation: >-
      Identifies encephalitis as a potential cause of catatonia, not solely a mimic.
  - reference: url:https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    reference_title: https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      incomplete response to a lorazepam challenge test, and some patients
      with catatonia may not experience a clinical response to lorazepam at all.
    explanation: >-
      Limits the interpretation of a negative challenge test.
- name: Nonconvulsive status epilepticus
  description: >-
    Nonconvulsive status epilepticus may present as catatonia and can be clinically difficult
    to distinguish.
  distinguishing_features:
  - Subtle facial or limb twitching, neurological disease and medication changes affecting seizure threshold increase suspicion.
  - EEG is important when this differential is suspected.
  - Improvement with a lorazepam challenge is not specific because both conditions may respond.
  evidence:
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      there is a clear case for an electroencephalogram (EEG) in the context of possible non-convulsive
      status epilepticus (NCSE), which can present as catatonia
    explanation: >-
      Supports EEG assessment for this potentially treatable mimic.
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Red flags for NCSE include subtle ictal phenomena (such as twitching of the face or extremities),
      comorbid neurological disease and a change in medications that affect seizure threshold
    explanation: >-
      Supplies specific clues to seizure activity.
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      stiff person syndrome and NCSE are likely to improve with a lorazepam challenge.
    explanation: >-
      A positive challenge alone cannot distinguish these syndromes.
discussions:
- discussion_id: catatonia_no_unified_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Distributed Psychomotor Network Destabilization
  prompt: >-
    Is there a single mechanism or biomarker that accounts for catatonia across
    its psychiatric, neurologic, autoimmune, and medical contexts, or is the
    convergent-network account the correct final level of explanation?
  rationale: >-
    Catatonia occurs across heterogeneous etiologies, and the available imaging and pharmacological
    observations do not establish a single causal mechanism. The distributed-network model is
    an integrative hypothesis. Studies across causes and acute clinical states are needed to
    test shared network changes and determine whether useful biomarkers are syndrome-wide or
    restricted to particular etiologies.
  proposed_experiments:
  - experiment_id: exp_catatonia_acute_state_multimodal_cohort
    name: Prospective acute-state multimodal phenotyping across upstream causes
    description: >-
      Recruit an acute-state catatonia cohort stratified by upstream cause
      (mood disorder, schizophrenia-spectrum, autoimmune encephalitis, medical
      or drug-induced) and acquire the same multimodal battery in every stratum:
      resting-state and emotional-task fMRI, GABA-A receptor imaging, striatal
      dopaminergic imaging, CSF and serum neuronal autoantibodies, and
      dimensional Bush-Francis and Northoff scale scoring. The discriminating
      test is whether the network signature is shared across strata while the
      neurochemical signature differs by stratum — the prediction of the
      convergent model — or whether each stratum has its own network signature.
  evidence:
  - reference: PMID:42431537
    reference_title: "Toward a systems model of catatonia: Circuits, neurochemistry, immune perturbation, and biological heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No single biomarker or unified mechanism fully accounts for catatonia
      across contexts.
    explanation: >-
      The explicit statement of the gap this discussion records.
  - reference: PMID:42431537
    reference_title: "Toward a systems model of catatonia: Circuits, neurochemistry, immune perturbation, and biological heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Future progress will depend on dimensional phenotyping, multimodal
      biomarker integration, and subtype-sensitive treatment research.
    explanation: >-
      The authors' own statement of what would close the gap, which the
      proposed experiment operationalizes.
- discussion_id: catatonia_sampling_and_acute_state_bias
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Distributed Psychomotor Network Destabilization
  - pathophysiology#Orbitofrontal Emotional-Motor Processing Dysfunction
  prompt: >-
    How much of the imaging evidence for the distributed-network model is an
    artifact of studying schizophrenia-spectrum patients in the post-acute
    state rather than catatonia in the acute state across its full diagnostic
    range?
  rationale: >-
    Schizophrenia-spectrum and postacute samples dominate the cited imaging studies. Persistent
    orbitofrontal changes could reflect predisposition, illness consequences or treatment; the
    study design does not establish which. Generalization to acute catatonia across etiologies
    requires prospective comparison.
  evidence:
  - reference: PMID:42431537
    reference_title: "Toward a systems model of catatonia: Circuits, neurochemistry, immune perturbation, and biological heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      key limitations remain, including the overrepresentation of
      schizophrenia-spectrum samples and limited acute-state data
    explanation: >-
      Names both sampling limitations directly.
  - reference: PMID:15279056
    reference_title: "Orbitofrontal cortical dysfunction in akinetic catatonia: a functional magnetic resonance imaging study during negative emotional stimulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because we investigated postacute patients, orbitofrontal cortical
      alterations may be interpreted as a trait marker predisposing for
      development of catatonic syndrome
    explanation: >-
      A worked instance of the acute-state limitation, stated by the original
      authors.
- discussion_id: catatonia_evidence_quality_ceiling
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Distributed Psychomotor Network Destabilization
  prompt: >-
    Can adequately controlled and reported trials improve the predominantly observational treatment
    evidence for catatonia?
  rationale: >-
    The BAP guideline identifies several randomized trials but describes small samples, high
    risk of bias, incomplete reporting and restricted populations. The quoted lorazepam response
    proportion comes from an open prospective study, not a controlled treatment effect. A small
    number of trials should not be described as an absence of randomized research.
  evidence:
  - reference: PMID:37039129
    reference_title: "Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical trials were uncommon, and the recommendations in this guideline
      are mainly informed by small observational studies, case series and case
      reports, which highlights the need for randomised controlled trials and
      prospective cohort studies in this area.
    explanation: >-
      The guideline's own statement of the evidence ceiling.
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Several RCTs have been conducted, but they have usually been at high risk of bias, inadequately
      reported, using outdated treatments or applicable to only a small subset of patients with
      catatonia
    explanation: >-
      Distinguishes a limited trial literature from no randomized evidence.
- discussion_id: catatonia_malignant_vs_nms
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Autonomic Decompensation
  - pathophysiology#Reduced Striatal Dopaminergic Transmission
  prompt: >-
    Does neuroleptic malignant syndrome represent a medication-triggered form of malignant catatonia,
    or do the overlapping clinical syndromes have distinguishable mechanisms?
  rationale: >-
    The syndromes overlap in rigidity, hyperthermia, altered mental state and autonomic dysfunction.
    Dopamine-blocker exposure supports NMS, whereas malignant catatonia can arise without it.
    Some experts consider NMS a form of malignant catatonia; the shared-dopamine model remains
    a hypothesis rather than an established mechanistic discriminator.
  evidence:
  - reference: PMID:40966690
    reference_title: Reduced striatal dopamine transmission as a transdiagnostic substrate of psychomotor retardation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, there are close epidemiological relationships between
      depression and Parkinson's disease, and between catatonia and neuroleptic
      malignant syndrome.
    explanation: >-
      Records the epidemiological relationship that a shared-substrate account
      would explain.
  - reference: PMID:35861966
    reference_title: "Malignant Catatonia: A Review for the Intensivist."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Malignant catatonia describes catatonia that presents with clinically
      significant autonomic abnormalities including change in temperature, blood
      pressure, heart rate, and respiratory rate.
    explanation: >-
      Supplies the definition of the entity on the catatonia side of the
      controversy.
  - reference: url:https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    reference_title: https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      many experts consider neuroleptic malignant syndrome (NMS) to be a type of malignant catatonia
      that is precipitated by dopamine receptor blocking agents.
    explanation: >-
      The resource document describes the exposure relationship and diagnostic overlap.
- discussion_id: catatonia_hpo_term_gap
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - pathophysiology#Hypokinetic Psychomotor Output
  prompt: >-
    How should unbound catatonic signs be represented until specific HPO concepts are available?
  rationale: >-
    OLS4 HP searches on 2026-10-04 for catatonia, catalepsy and waxy flexibility returned no
    hits. Stupor returned coma and akinetic mutism, which are not equivalent; mannerism returned
    motor stereotypy and broader behavior terms. Echopraxia (HP:0020124) and Pressure ulcer
    (HP:0012399) have specific matching terms and are included. Query pattern: https://www.ebi.ac.uk/ols4/api/search?ontology=hp&q=catatonia;
    substitute each listed phrase, URL-encoding spaces. Unbound descriptors retain clinically
    important signs without false equivalences.
  notes: >-
    Upstream ontology gap, not a dismech bug. Recorded here so the decision is
    auditable rather than rediscovered.
notes: >-
  Catatonia is retained as a standalone transdiagnostic syndrome under MONDO:0800105. The organizing
  network model and transmitter-specific models remain incompletely established, and their causal
  links are explicitly provisional. Clinical signs, etiological associations and complications
  are distinguished from molecular mechanisms. Epidemiological estimates are scoped to their
  settings and case definitions. Treatment recommendations draw heavily on observational evidence
  and expert consensus, although a limited randomized-trial literature exists. The StatPearls
  overview contains inconsistent NMDA activation/hypofunction statements and describes specific
  periodic-catatonia mutations; the cited primary and specialist sources do not substantiate
  those assertions. Drug trials and selected mechanistic neuromodulation studies are distinguished
  from demonstrated treatment efficacy. Hypokinetic, hyperkinetic and parakinetic presentations
  are overlapping motor dimensions. Malignant catatonia is identified by autonomic decompensation
  and can accompany any motor presentation; periodic catatonia describes a recurrent course,
  with historical familial linkage evidence restricted to selected pedigrees. PMID:28613592
  and the NCBI NBK430842 URL identify the same StatPearls chapter; PMID:29140521 and the PMC6101628
  URL identify the same Solmi meta-analysis. The alternate URLs provide full text and are not
  independent publications.

diagnosis:
- name: Clinical assessment and diagnostic criteria
  description: >-
    Diagnosis is clinical, requiring three or more catatonic signs under DSM-5-TR or ICD-11.
    DSM-5-TR lists stupor, catalepsy, waxy flexibility, mutism, negativism, posturing, mannerism,
    stereotypy, agitation, grimacing, echolalia and echopraxia. Observation, elicitation and
    physical examination are complementary, and collateral history helps identify fluctuating
    signs and underlying conditions. In autism, a marked change from baseline is required.
  evidence:
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Catatonia should be diagnosed based on the presence of three or more catatonic signs,
      as in DSM-5-TR or ICD-11.
    explanation: >-
      The guideline recommends a clinical sign threshold; a response to medication is not required.
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Diagnosis of catatonia in autism spectrum disorder requires a marked change from baseline
      presentation.
    explanation: >-
      Distinguishes a new catatonic syndrome from overlapping baseline autistic features.
- name: Bush-Francis Catatonia Rating Scale
  description: >-
    The BFCRS is a widely used instrument for screening and quantifying catatonic signs and
    tracking treatment response. Its first 14 items form the screening instrument; the full
    scale has 23 items. Scale findings should be translated into diagnostic criteria, since
    definitions of motor signs differ between instruments.
  evidence:
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-

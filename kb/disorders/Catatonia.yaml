genetic:
- name: Chromosome 15q15 periodic catatonia susceptibility locus
  presence: Linkage confirmed in a subset of multiplex families
  relationship_type: SUSCEPTIBILITY
  association: >-
    Periodic catatonia, a familial sub-phenotype with recurrent hyperkinetic
    and akinetic psychomotor episodes, maps to a major susceptibility locus on
    chromosome 15q15, confirmed in a second independent genome scan. No causal
    gene has been established at the locus, and the same study demonstrated
    genetic heterogeneity between families, so this is recorded as a
    susceptibility locus rather than as a catatonia gene.
  evidence:
  - reference: PMID:12384773
    reference_title: "Periodic catatonia: confirmation of linkage to chromosome 15 and further evidence for genetic heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we confirm mapping of a major gene locus on chromosome 15q15 in a
      second genome scan in a new set of four multiplex families.
    explanation: >-
      Independent confirmation of the linkage signal in a new family set.
  - reference: PMID:12384773
    reference_title: "Periodic catatonia: confirmation of linkage to chromosome 15 and further evidence for genetic heterogeneity."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of individual families showed that one large family showed
      linkage, whereas two others could be clearly excluded, confirming genetic
      heterogeneity.
    explanation: >-
      The heterogeneity caveat: the locus explains some families and is
      excluded in others, so it cannot be read as a general catatonia gene.
  notes: >-
    Linkage-era evidence. The locus has not been resolved to a gene, and
    subsequent candidate-gene work in the region was negative; treat as
    historical support for familial aggregation in a sub-phenotype rather than
    as an actionable genetic finding.
prevalence:
- population: Clinical samples worldwide (psychiatric and medical settings)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 9000.0
  rate_low: 6900.0
  rate_high: 11700.0
  notes: >-
    Pooled mean of 9.0% across 74 studies (k = 80, n = 110,764), 95% CI
    6.9-11.7%. Heterogeneity was very high (I2 = 98%) with evidence of
    publication bias, so the point estimate should be read as an order of
    magnitude rather than a precise rate.

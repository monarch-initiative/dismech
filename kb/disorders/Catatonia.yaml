      (BFCSI).
    explanation: >-
      Defines the screening subset.
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The full 23-item scale evaluates all ICD-11 catatonia criteria.
    explanation: >-
      Defines the full scale coverage.
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The results of a catatonia rating scale should be converted to diagnostic criteria for
      clinical diagnosis
    explanation: >-
      Scale thresholds and formal diagnostic criteria are not interchangeable.
  - reference: PMID:8686484
    reference_title: Catatonia. II. Treatment with lorazepam and electroconvulsive therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: >-
      The rating scale has predictive value and displays sensitivity to change in clinical status.
    explanation: >-
      The prospective treatment study supports using the scale to monitor change.
- name: Lorazepam challenge test
  description: >-
    A lorazepam challenge can support an uncertain diagnosis and help predict benzodiazepine
    response. A reduction in catatonic signs supports catatonia but is not fully specific: nonconvulsive
    status epilepticus and stiff-person syndrome may also improve. A negative response does
    not by itself establish another diagnosis.
  evidence:
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A positive response to a lorazepam challenge, commonly defined as a 50% reduction in catatonic
      signs on a standardised scale, makes a diagnosis of catatonia more likely, but it is not
      100% specific.
    explanation: >-
      The guideline supplies an operational response threshold and its specificity limit.
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Challenge tests are useful in many situations
    explanation: >-
      The challenge supplements clinical assessment.
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      stiff person syndrome and NCSE are likely to improve with a lorazepam challenge.
    explanation: >-
      Benzodiazepine responsiveness also occurs in important mimics.
  - reference: PMID:8686484
    reference_title: Catatonia. II. Treatment with lorazepam and electroconvulsive therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: >-
      A positive response to an initial parenteral challenge predicted final lorazepam response,
      as did length of catatonic symptoms prior to treatment.
    explanation: >-
      Predictive association in an open prospective treatment protocol.
- name: Investigation of underlying conditions and mimics
  description: >-
    Investigations are selected according to history, examination, severity and suspected causes.
    A first or unexplained episode warrants consideration of brain CT or MRI and serum and CSF
    neuronal autoantibodies, including NMDA receptor antibodies. EEG is considered where seizures,
    encephalitis or nonconvulsive status epilepticus are suspected. These tests investigate
    causes and mimics; none is a general diagnostic biomarker for catatonia.
  evidence:
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In patients experiencing a first episode of catatonia or where the diagnosis underlying
      catatonia is unclear, consider a CT or MRI scan of the brain.
    explanation: >-
      Neuroimaging is part of etiological evaluation rather than a confirmatory catatonia test.
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In patients experiencing a first episode of catatonia or where the diagnosis underlying
      catatonia is unclear, consider assessing for the presence of antibodies to the NMDA receptor
      and other relevant autoantibodies in serum and CSF.
    explanation: >-
      Supports testing for autoimmune causes when the presentation warrants investigation.
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In patients with risk factors for seizures, possible evidence of a seizure or possible
      encephalitis, consider performing an EEG (with continuous monitoring if available).
    explanation: >-
      Scopes EEG to clinical indications.
- name: Assessment of medical complications
  description: >-
    Physical assessment includes hydration, nutritional intake, temperature and other vital
    signs, pressure areas, and signs of venous thrombosis. Laboratory investigations and monitoring
    are guided by suspected complications. Reduced responsiveness should not be assumed to mean
    absent awareness or deliberate refusal of care.
  evidence:
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Physical examination should include assessment for catatonic signs, signs of medical conditions
      that may have led to the catatonia and signs of medical complications of catatonia.
    explanation: >-
      Medical examination addresses both causes and consequences.
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      When assessing a patient with catatonia, clinicians should interact with the person as
      if they are able to understand what is being said to them.
    explanation: >-
      Impaired motor or verbal output does not establish absent comprehension.
treatments:
- name: Lorazepam
  description: >-
    Lorazepam is a positive allosteric modulator of GABA-A receptors and a first-line treatment
    for catatonia. In an open prospective study, signs resolved in 16 of 21 patients completing
    a lorazepam trial; this is an uncontrolled response proportion. Treatment is titrated to
    clinical response and tolerability, with attention to sedation and respiratory effects.
    Benzodiazepines are tapered rather than stopped abruptly because withdrawal can precipitate
    recurrence. Response varies with clinical context and may be less reliable in chronic catatonia
    associated with schizophrenia. When catatonia follows benzodiazepine withdrawal, a benzodiazepine
    can be reinstated. Older adults may respond to lower doses.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: lorazepam
      term:
        id: CHEBI:6539
        label: Lorazepam
  target_mechanisms:
  - target: Cortical GABA-A Receptor-Mediated Inhibition Deficit
    treatment_effect: MODULATES
    description: >-
      Lorazepam enhances GABA-A receptor signaling. Its clinical efficacy is compatible with
      a GABAergic contribution to catatonia but does not demonstrate restoration of receptor
      density or establish a universal inhibitory deficit.
    evidence:
    - reference: PMID:37039129
      reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Lorazepam is a non-selective positive allosteric modulator of GABA-A receptors.
      explanation: >-
        The drug action is established; its linkage to the proposed disease deficit is indirect.
  evidence:
  - reference: PMID:8686484
    reference_title: "Catatonia. II. Treatment with lorazepam and electroconvulsive therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 16 of 21 patients (76%) who received a complete trial of lorazepam (11
      with initial intravenous challenge), catatonic signs resolved.
    explanation: >-
      The prospective, quantitatively monitored response rate underpinning
      first-line status.
    quote_role: PRIMARY_RESULT
  - reference: PMID:37236789
    reference_title: The diagnosis and treatment of catatonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      First-line treatment comprises benzodiazepines and/or electroconvulsive
      therapy. The benzodiazepine of choice is lorazepam, which is sometimes
      used in very high doses.
    explanation: >-
      Current guideline statement of first-line status and the drug of choice.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Benzodiazepines for catatonia should not be stopped abruptly but rather tapered down.
    explanation: >-
      Addresses withdrawal and recurrence risk.
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Where lorazepam is used for catatonia, high doses above the licensed maximum may be necessary
      to achieve maximal effect.
    explanation: >-
      The guideline permits specialist titration; a high dose is not required when symptoms
      resolve or side effects limit treatment.
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Where catatonia has resulted from benzodiazepine withdrawal, restart a benzodiazepine.
    explanation: >-
      Specific withdrawal-related indication.
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      First-line treatment of catatonia in the older adults consists of benzodiazepines, often
      at lower doses than among younger adults, and ECT.
    explanation: >-
      Population-specific dosing and treatment considerations.
- name: Electroconvulsive therapy
  description: >-
    ECT is a first-line option alongside benzodiazepines and is recommended when benzodiazepines
    have not produced remission. Choice and urgency depend on severity, underlying illness,
    tolerability and availability. Malignant catatonia may require urgent ECT when lorazepam
    is not rapidly effective. Four lorazepam nonresponders improved with ECT in an open prospective
    study, but this does not identify the biological mechanism of ECT. Severe respiratory disease
    may favor ECT as the initial treatment. Selected patients require maintenance ECT to prevent
    relapse.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: electroconvulsive therapy
    term:
      id: NCIT:C93303
      label: Electroconvulsive Therapy
  evidence:
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Where benzodiazepines have not resulted in remission, ECT should be used.
    explanation: >-
      Guideline recommendation after inadequate benzodiazepine response.
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      if benzodiazepines are not rapidly effective, ECT should be started within 48–72 h following
      the onset of malignant catatonia
    explanation: >-
      Addresses the urgency of escalation in malignant catatonia.
  - reference: PMID:8686484
    reference_title: Catatonia. II. Treatment with lorazepam and electroconvulsive therapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    snippet: >-
      Four patients failing lorazepam responded promptly to ECT.
    explanation: >-
      Small uncontrolled treatment observation, not evidence of a particular network or transmitter
      mechanism.
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In severe respiratory disease, consider giving ECT as a first-line treatment rather than
      benzodiazepines.
    explanation: >-
      Conditional respiratory-disease recommendation.
  - reference: url:https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    reference_title: https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      For certain patients, maintenance ECT following response to the acute course of ECT can
      help prevent relapse of catatonia.
    explanation: >-
      Supports a maintenance role in selected patients.
- name: Treatment of the underlying condition
  description: >-
    Treat an identified underlying psychiatric or medical disorder alongside catatonia-specific
    treatment and supportive care. Management depends on the cause and may include immunotherapy
    for autoimmune encephalitis or removal of a precipitating medication. Catatonia treatment
    need not await every investigation result.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  evidence:
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Catatonia treatment should consist of specific treatment for the catatonia, treatment
      of any underlying disorder and prevention and management of complications of catatonia.
    explanation: >-
      The guideline explicitly describes all three components of management.
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Treatment for catatonia should be instituted quickly after identification of catatonia
      and it is not always necessary to await results of all investigations before commencing
      treatment.
    explanation: >-
      Etiological evaluation and urgent symptomatic treatment can proceed together.
- name: Amantadine and memantine
  description: >-
    Amantadine or memantine may be considered when first-line benzodiazepine and ECT approaches
    are unavailable, cautioned, ineffective or only partly effective. Both antagonize NMDA receptors;
    amantadine also has dopaminergic effects. Proposed circuit explanations remain hypotheses.
    Reported benefits mainly come from case reports and small series, with possible publication
    bias. Their use does not establish NMDA hyperactivity as a general cause of catatonia or
    a mechanism-specific treatment for anti-NMDA receptor encephalitis. Amantadine requires
    particular caution in patients at seizure risk or with renal disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: amantadine
      term:
        id: CHEBI:2618
        label: amantadine
    - preferred_term: memantine
      term:
        id: CHEBI:64312
        label: memantine
  evidence:
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Where first-line therapies for catatonia are unavailable, cautioned, ineffective or only
      partially effective, consider a trial of an NMDA receptor antagonist, either amantadine
      or memantine.
    explanation: >-
      Recommendation includes the availability and tolerability of first-line options, not just
      lorazepam failure.
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A bias towards the non-reporting of negative results must be considered, making the lack
      of RCTs and controlled studies an important shortcoming.
    explanation: >-
      The guideline qualifies its synthesis of amantadine and memantine reports.
  - reference: url:https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    reference_title: https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Amantadine lowers the seizure threshold and should be used cautiously in patients at increased
      risk for seizures, including epilepsy and anti-NMDA receptor antibody encephalitis
    explanation: >-
      Clinical caution is particularly relevant to the autoimmune subgroup.
  - reference: url:https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    reference_title: https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Amantadine is not dialyzable and thus should also be used cautiously in patients with
      renal disease.
    explanation: >-
      Supports the renal-disease caution.
  notes: >-
    The BAP guideline summarizes uncontrolled reports. Its proposed NMDA circuit mechanism is
    distinct from antibody-associated receptor dysfunction and is not treated as proof of a
    shared mechanism.
- name: Antipsychotic medication review
  description: >-
    Antipsychotics can induce or worsen catatonia and increase concern for neuroleptic malignant
    syndrome. Avoid them when there is no underlying psychotic disorder; discontinue dopamine
    antagonists in malignant catatonia. When treating coexisting psychosis, the guideline allows
    cautious second-generation antipsychotic use after an individual assessment, gradual titration
    and consideration of a benzodiazepine. For antipsychotic-induced catatonia, discontinuation
    is the primary intervention; if an antipsychotic remains necessary after treatment, restart
    cautiously.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Antipsychotic medications should be avoided where there is no underlying psychotic disorder.
    explanation: >-
      Avoidance is context-specific.
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In malignant catatonia, discontinue all dopamine antagonists.
    explanation: >-
      Malignant catatonia requires a stronger avoidance recommendation.
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If antipsychotic medications are used, a SGA should be used with gradual titration, and
      co-administration of a benzodiazepine should be considered.
    explanation: >-
      The guideline permits carefully assessed treatment of underlying psychosis.
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      When catatonia is attributed to antipsychotic administration, consider discontinuing the
      antipsychotic.
    explanation: >-
      Supports withdrawal of the precipitating medication.
- name: Supportive care and prevention of complications
  description: >-
    Provide hydration and nutritional support according to need, assess swallowing and consider
    assisted feeding, prevent pressure injury, and assess venous thromboembolism risk with prophylaxis
    when appropriate. Monitoring and supportive care accompany treatment of catatonia and its
    underlying cause.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Guidance has been developed for averting such complications, which include recommendations
      such as pharmacological thromboprophylaxis, frequent assessment of pressure areas, stretching
      to avoid muscle contractures and consideration of artificial feeding
    explanation: >-
      Guideline synthesis of measures that prevent complications of prolonged catatonia.
- name: Clozapine in selected contexts
  description: >-
    Restarting clozapine is recommended when its withdrawal precipitates catatonia, if clinically
    feasible, with re-titration after an interruption. ECT is another option. Clozapine may
    also be considered for chronic mild catatonia associated with schizophrenia. These indications
    do not justify routine antipsychotic treatment of catatonia without psychosis; the evidence
    is largely uncontrolled.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: clozapine
      term:
        id: CHEBI:3766
        label: clozapine
  evidence:
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Where catatonia has resulted from clozapine withdrawal, restart clozapine if possible
      and, if necessary, use ECT.
    explanation: >-
      Specific withdrawal-related recommendation.
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If catatonia is chronic and mild in the context of schizophrenia, consider a trial of
      clozapine.
    explanation: >-
      A separate, restricted clinical context for clozapine.
  - reference: url:https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    reference_title: https://www.psychiatry.org/getattachment/bd1b5149-2c2e-472c-8fa9-1e5e79aeb4d5/Resource-Document-on-Catatonia.pdf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      If clozapine therapy is interrupted for more than 48 hours, re-titration from a typical
      starting dose
    explanation: >-
      Re-initiation must account for the interruption rather than simply restoring a previous
      maintenance dose.
- name: Lithium maintenance for periodic catatonia
  description: >-
    Lithium may be considered to prevent recurrent episodes of periodic catatonia. This maintenance
    indication rests on case reports and small case series, rather than controlled proof of
    efficacy for catatonia generally.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: lithium(1+)
      term:
        id: CHEBI:49713
        label: lithium(1+)
  evidence:
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In the maintenance phase of periodic catatonia, consider prophylactic treatment with lithium.
    explanation: >-
      Conditional maintenance recommendation.
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Lithium is the most frequently reported agent used in the maintenance of periodic catatonia,
      but even this evidence relies only on case reports and small case series
    explanation: >-
      States the evidence limitation.
- name: Zolpidem
  description: >-
    Zolpidem has been used as a diagnostic or therapeutic challenge and as an alternative treatment
    in case reports, including after inadequate lorazepam or ECT response. Reported effects
    are often transient; this is not an established substitute for first-line treatment.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: zolpidem
      term:
        id: CHEBI:10125
        label: zolpidem
  evidence:
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      When a diagnosis of catatonia is uncertain, a diagnostic challenge using zolpidem may
      be considered.
    explanation: >-
      Conditional diagnostic use.
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Mastain et al. (1995) described a serendipitous dramatic response to oral zolpidem 10
      mg in a woman with a subcortical stroke whose catatonia was largely unresponsive to lorazepam
      or ECT.
    explanation: >-
      The guideline describes an uncontrolled treatment observation.
  - reference: PMID:37039129
    reference_title: 'Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The response is transitory, as with benzodiazepines, and is usually observed for 3–6 h
    explanation: >-
      Limits interpretation of the reported response duration.
- name: Carbamazepine
  description: >-
    Carbamazepine is a lower-evidence option when first-line treatments and NMDA receptor antagonists
    are unavailable, cautioned or insufficient. Evidence consists of case reports and small

- name: Hyperkinetic and Aberrant-Volitional Output
  biological_scale: ORGANISM
  description: >-
    The hyperkinetic and aberrant-volitional pole — excitement, agitation not
    prompted by external stimuli, stereotypy, mannerism, echolalia and
    echopraxia. Dimensional work identifies these as components that overlap
    with the hypokinetic pole within a single episode, so an entry that modeled
    catatonia as either akinetic or excited would misrepresent the syndrome.
  biological_processes:
  - preferred_term: locomotory behavior
    term:
      id: GO:0007626
      label: locomotory behavior
    modifier: INCREASED
  evidence:
  - reference: PMID:42431537
    reference_title: "Toward a systems model of catatonia: Circuits, neurochemistry, immune perturbation, and biological heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      catatonia is internally heterogeneous, with hypokinetic, hyperkinetic, and
      aberrant-volitional components that often overlap within the same episode
    explanation: >-
      The dimensional claim that justifies curating hyperkinetic and
      aberrant-volitional features as a distinct but co-occurring output.
  - reference: PMID:32070914
    reference_title: "Catatonia in N-methyl-d-aspartate receptor antibody encephalitis: Phenomenological characteristics from a systematic review of case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, excitement often co-occurred in these patients suggesting that
      fluctuations in catatonic semiology may be frequent.
    explanation: >-
      Empirical support for within-episode fluctuation between the two poles.
- name: Autonomic Decompensation
  biological_scale: ORGANISM
  description: >-
    Malignant catatonia is catatonia with clinically significant autonomic
    abnormality — disturbance of temperature, blood pressure, heart rate, and
    respiratory rate. It is a life-threatening form of acute brain dysfunction
    and is the principal reason catatonia is a medical emergency rather than
    only a psychiatric one; untreated, it may be fatal. Its phenotypic overlap
    with neuroleptic malignant syndrome is longstanding and unresolved.
  evidence:
  - reference: PMID:35861966
    reference_title: "Malignant Catatonia: A Review for the Intensivist."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Malignant catatonia describes catatonia that presents with clinically
      significant autonomic abnormalities including change in temperature, blood
      pressure, heart rate, and respiratory rate.
    explanation: >-
      Defines the autonomic decompensation this node represents.

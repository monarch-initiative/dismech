genetic:
- name: Chromosome 15q15 periodic catatonia susceptibility locus
  presence: Linkage confirmed in a subset of multiplex families
  relationship_type: SUSCEPTIBILITY
  association: >-
    Periodic catatonia, a familial sub-phenotype with recurrent hyperkinetic and akinetic psychomotor
    episodes, maps to a major susceptibility locus on chromosome 15q15, confirmed in a second
    independent genome scan. The linkage study did not identify a causal gene, and it demonstrated
    genetic heterogeneity between families, so this is recorded as a susceptibility locus rather
    than as a catatonia gene.
  evidence:
  - reference: PMID:12384773
    reference_title: "Periodic catatonia: confirmation of linkage to chromosome 15 and further evidence for genetic heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we confirm mapping of a major gene locus on chromosome 15q15 in a
      second genome scan in a new set of four multiplex families.
    explanation: >-
      Independent confirmation of the linkage signal in a new family set.
  - reference: PMID:12384773
    reference_title: "Periodic catatonia: confirmation of linkage to chromosome 15 and further evidence for genetic heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis of individual families showed that one large family showed
      linkage, whereas two others could be clearly excluded, confirming genetic
      heterogeneity.
    explanation: >-
      The heterogeneity caveat: the locus explains some families and is
      excluded in others, so it cannot be read as a general catatonia gene.
  notes: >-
    Historical linkage evidence in multiplex families selected for periodic catatonia. The cited
    study reports locus heterogeneity and does not establish a causal gene or a genetic test
    for catatonia as a whole.

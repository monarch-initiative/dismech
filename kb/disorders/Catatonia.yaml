mechanistic_hypotheses:
- hypothesis_group_id: distributed_psychomotor_network_model
  hypothesis_label: Distributed psychomotor network model
  status: CANONICAL
  description: >-
    A leading integrative model proposes that heterogeneous upstream conditions disturb interacting
    psychomotor networks. Imaging associations provide candidate circuit locations, but the
    evidence is enriched for schizophrenia-spectrum cohorts and postacute states. Its designation
    as the organizing model does not establish a common causal pathway or a validated biomarker
    across etiologies.
  evidence:
  - reference: PMID:42431537
    reference_title: "Toward a systems model of catatonia: Circuits, neurochemistry, immune perturbation, and biological heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The best-supported mechanistic model to date comes from neuroimaging
      studies implicating cortico-striatal-thalamic, cortico-cerebellar,
      orbitofrontal, cingulate, and motor-premotor networks.
    explanation: >-
      States the network membership of the canonical model and its evidential
      basis in neuroimaging.
  - reference: PMID:42431537
    reference_title: "Toward a systems model of catatonia: Circuits, neurochemistry, immune perturbation, and biological heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the evidence supports a convergent model in which diverse upstream
      liabilities destabilize shared psychomotor networks, producing a
      recognizable but heterogeneous syndrome
    explanation: >-
      The convergence claim that justifies modeling catatonia as one entity
      with many entry points rather than as many disease-specific mechanisms.
- hypothesis_group_id: gabaergic_deficit_model
  hypothesis_label: Reduced cortical GABA-A-mediated inhibition in akinetic catatonia
  status: ALTERNATIVE
  description: >-
    Benzodiazepine responses and reduced iomazenil binding motivate a GABAergic hypothesis.
    The small receptor-imaging study identifies altered ligand binding, not a demonstrated receptor
    lesion or direct measurement of inhibitory transmission. GABAergic mechanisms may interact
    with other signaling systems and need not explain every clinical presentation.
  evidence:
  - reference: PMID:10486389
    reference_title: "Decreased density of GABA-A receptors in the left sensorimotor cortex in akinetic catatonia: investigation of in vivo benzodiazepine receptor binding."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Reduced iomazenil binding suggests decreased density of GABA-A receptors
      in the left sensorimotor cortex in akinetic catatonia.
    explanation: >-
      The authors interpret reduced ligand binding as suggesting lower receptor density; causality
      and functional impairment are not established.
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
  - reference: PMID:42431537
    reference_title: "Toward a systems model of catatonia: Circuits, neurochemistry, immune perturbation, and biological heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neurochemical evidence supports the notion of interacting disturbances in
      GABAergic inhibition, glutamatergic/NMDA-mediated excitation, and
      dopaminergic modulation rather than a single-transmitter explanation.
    explanation: >-
      Qualifies the GABA-only account: the contemporary synthesis treats
      GABAergic inhibition as one interacting term, not the whole mechanism.
- hypothesis_group_id: striatal_dopamine_hypofunction_model
  hypothesis_label: Reduced striatal dopaminergic transmission as a transdiagnostic psychomotor substrate
  status: ALTERNATIVE
  description: >-
    Reduced striatal dopamine signaling is proposed as one contributor to the hypokinetic presentation.
    Catatonia-specific imaging evidence is sparse, and evidence from Parkinson disease cannot
    establish an identical mechanism. The review includes single catatonic subjects within PET
    studies and a small longitudinal DAT-SPECT series. CSF homovanillic acid findings are inconsistent,
    including elevation in catatonia; these measurements lack regional and temporal specificity.
    Dopaminergic treatment reports remain preliminary, and the hypothesis does not explain all
    excited or alternating presentations.
  evidence:
  - reference: PMID:40966690
    reference_title: Reduced striatal dopamine transmission as a transdiagnostic substrate of psychomotor retardation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Evidence for drug-induced parkinsonism, neuroleptic malignant syndrome, catatonia, obsessional
      slowness and hyperkinetic disorders is less comprehensive and requires further research.
    explanation: >-
      The review explicitly limits the imaging evidence for catatonia.
  - reference: PMID:40966690
    reference_title: Reduced striatal dopamine transmission as a transdiagnostic substrate of psychomotor retardation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In catatonia, one study found increased HVA levels relative to healthy controls.
    explanation: >-
      A conflicting biochemical finding prevents treating low CSF dopamine metabolites as an
      established general feature.
  - reference: PMID:40966690
    reference_title: Reduced striatal dopamine transmission as a transdiagnostic substrate of psychomotor retardation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      However, the evidence in catatonia and depression remains preliminary with small sample
      sizes and a lack of well-conducted clinical trials.
    explanation: >-
      Qualifies pharmacological support for the proposed mechanism.
- hypothesis_group_id: immune_mediated_model
  hypothesis_label: Immune-mediated NMDA receptor perturbation in autoimmune subgroups
  status: EMERGING
  description: >-
    In a mechanistically distinct subgroup, catatonia arises from autoimmune
    perturbation of glutamatergic signaling — most clearly in NMDA receptor
    antibody encephalitis, where catatonia is present in a majority of reported
    cases. The subgroup matters clinically because its treatment is
    immunotherapy directed at the antibody-mediated process, not only
    benzodiazepines. The arm is EMERGING rather than established as a general
    mechanism because it accounts for a subgroup rather than the syndrome, and
    because peripheral inflammatory biomarkers remain nonspecific.
  evidence:
  - reference: PMID:42431537
    reference_title: "Toward a systems model of catatonia: Circuits, neurochemistry, immune perturbation, and biological heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immune mechanisms are particularly relevant in subgroups, especially in
      autoimmune encephalitis and inflammatory CNS conditions, whereas
      peripheral biomarkers remain nonspecific.
    explanation: >-
      Scopes the immune arm to subgroups and records the biomarker limitation
      that keeps it from generalizing.
  - reference: PMID:32070914
    reference_title: "Catatonia in N-methyl-d-aspartate receptor antibody encephalitis: Phenomenological characteristics from a systematic review of case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Catatonia was present in 60% of these cases.
    explanation: >-
      Quantifies how strongly catatonia tracks with NMDA receptor antibody
      encephalitis in the published case literature.
pathophysiology:
- name: Cortical GABA-A Receptor-Mediated Inhibition Deficit
  biological_scale: MOLECULAR
  description: >-
    Reduced cortical GABA-A-mediated inhibition is a hypothesis motivated by benzodiazepine
    responses and reduced iomazenil binding in a small study of akinetic catatonia. Receptor-ligand
    binding is a proxy for receptor availability, not a direct measure of inhibitory synaptic
    transmission. Matching psychiatric controls for diagnosis and medication strengthens the
    comparison but does not eliminate residual confounding or establish causality.
  locations:
  - preferred_term: sensorimotor cortex
  biological_processes:
  - preferred_term: gamma-aminobutyric acid signaling pathway
    term:
      id: GO:0007214
      label: gamma-aminobutyric acid signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:10486389
    reference_title: "Decreased density of GABA-A receptors in the left sensorimotor cortex in akinetic catatonia: investigation of in vivo benzodiazepine receptor binding."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Catatonic patients showed significantly lower iomazenil binding and
      altered right-left relations in the left sensorimotor cortex compared with
      psychiatric (p<0.001) and healthy (p<0.001) controls.
    explanation: >-
      A regional binding difference supports the GABAergic hypothesis indirectly; it does not
      directly measure receptor function or exclude all confounding.
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
  - reference: PMID:10486389
    reference_title: "Decreased density of GABA-A receptors in the left sensorimotor cortex in akinetic catatonia: investigation of in vivo benzodiazepine receptor binding."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Catatonia is a psychomotor syndrome with concomittant akinesia and anxiety
      which both respond almost immediately to benzodiazepines such as lorazepam.
    explanation: >-
      The introduction restates a clinical response that motivated the study; it is not a receptor-restoration
      experiment.
    quote_role: BACKGROUND
    directness: INDIRECT
  downstream:

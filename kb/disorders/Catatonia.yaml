- name: Orbitofrontal Emotional-Motor Processing Dysfunction
  biological_scale: TISSUE
  description: >-
    Catatonia couples emotional and motor abnormality, and functional imaging
    during emotional stimulation localizes that coupling to the orbitofrontal
    cortex and its connectivity with premotor cortex. Catatonic behavioral and
    affective symptoms correlate with orbitofrontal activity while motor
    symptoms track medial prefrontal activity, which is the imaging counterpart
    of the clinical observation that the syndrome is not purely motor. Because
    the patients studied were post-acute, the orbitofrontal alteration was
    interpreted as a trait marker of predisposition rather than a state
    correlate of the acute episode — an important limitation on how causally
    this node may be read.

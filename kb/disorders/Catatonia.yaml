- name: Parakinetic Motor Output
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: >-
    Qualitatively abnormal, context-inappropriate motor behavior is the parakinetic dimension
    of catatonia. A proposed lateral orbitofrontal circuit disturbance could contribute to repetitive
    or imitative behaviors. The circuit explanation is provisional and these signs need not
    imply increased overall motor activity.
  evidence:

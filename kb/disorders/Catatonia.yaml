diagnosis:
- name: Bush-Francis Catatonia Rating Scale
  description: >-
    The most widely used instrument for ascertaining and quantifying catatonia.
    Its screening component defines the core signs, and the full scale is
    sensitive to change, making it the standard outcome measure for treatment
    response.
  evidence:
  - reference: PMID:8686484
    reference_title: "Catatonia. II. Treatment with lorazepam and electroconvulsive therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The rating scale has predictive value and displays sensitivity to change
      in clinical status.
    explanation: >-
      Establishes the scale's utility as a quantitative response measure, not
      only a diagnostic checklist.
  - reference: PMID:32070914
    reference_title: "Catatonia in N-methyl-d-aspartate receptor antibody encephalitis: Phenomenological characteristics from a systematic review of case reports."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cases were searched for clinical data in keeping with core catatonic signs
      by applying the screening instrument of the Bush-Francis Catatonia Rating
      Scale.
    explanation: >-
      Demonstrates the screening instrument being used as the ascertainment
      standard in systematic research.
- name: Lorazepam challenge test
  description: >-
    A parenteral lorazepam challenge is used both diagnostically and
    prognostically: a positive response to the initial challenge predicted the
    eventual response to a full lorazepam trial. This is a rare instance of a
    psychiatric test whose predictive validity rests on the same mechanism as
    the treatment.
  evidence:
  - reference: PMID:8686484
    reference_title: "Catatonia. II. Treatment with lorazepam and electroconvulsive therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A positive response to an initial parenteral challenge predicted final
      lorazepam response, as did length of catatonic symptoms prior to treatment.
    explanation: >-
      The prospective evidence that the challenge test predicts treatment
      response.
treatments:
- name: Lorazepam
  description: >-
    A benzodiazepine positive allosteric modulator at the GABA-A receptor and
    the first-line treatment for catatonia, sometimes required in very high
    doses. In the defining prospective study, catatonic signs resolved in 16 of
    21 patients (76%) who completed a lorazepam trial. The near-immediate
    response of akinesia and anxiety to lorazepam is also the clinical
    observation that motivated the GABA-A receptor hypothesis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: lorazepam
      term:
        id: CHEBI:6539
        label: Lorazepam
  target_mechanisms:
  - target: Cortical GABA-A Receptor-Mediated Inhibition Deficit
    treatment_effect: RESTORES
    description: >-
      Positive allosteric modulation at the benzodiazepine site increases
      GABA-A receptor-mediated chloride conductance, restoring the inhibitory
      tone that is deficient at this node. The same receptor population imaged
      by iomazenil SPECT is the drug's binding site, which is what makes this a
      mechanistically specific rather than symptomatic treatment.
    evidence:
    - reference: PMID:10486389
      reference_title: "Decreased density of GABA-A receptors in the left sensorimotor cortex in akinetic catatonia: investigation of in vivo benzodiazepine receptor binding."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Catatonia is a psychomotor syndrome with concomittant akinesia and
        anxiety which both respond almost immediately to benzodiazepines such as
        lorazepam.
      explanation: >-
        Links the drug's effect directly to the receptor population this node
        describes.
  evidence:
  - reference: PMID:8686484
    reference_title: "Catatonia. II. Treatment with lorazepam and electroconvulsive therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 16 of 21 patients (76%) who received a complete trial of lorazepam (11
      with initial intravenous challenge), catatonic signs resolved.
    explanation: >-
      The prospective, quantitatively monitored response rate underpinning
      first-line status.
  - reference: PMID:37236789
    reference_title: The diagnosis and treatment of catatonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      First-line treatment comprises benzodiazepines and/or electroconvulsive
      therapy. The benzodiazepine of choice is lorazepam, which is sometimes
      used in very high doses.
    explanation: >-
      Current guideline statement of first-line status and the drug of choice.
- name: Electroconvulsive therapy
  description: >-
    ECT is first-line alongside benzodiazepines and is the treatment of choice
    for catatonia refractory to benzodiazepines and for malignant catatonia,
    where delay is life-threatening. In the defining prospective study, all
    four patients who failed lorazepam responded promptly to ECT. Its mechanism
    is not receptor-specific; it is curated here as modulating the distributed
    network node rather than any single neurochemical route.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: electroconvulsive therapy
    term:
      id: NCIT:C93303
      label: Electroconvulsive Therapy
  target_mechanisms:
  - target: Distributed Psychomotor Network Destabilization
    treatment_effect: MODULATES
    description: >-
      ECT acts on the destabilized network as a whole rather than on a defined
      molecular target, which is consistent with its efficacy in cases that do
      not respond to GABA-A-directed treatment.
    evidence:
    - reference: PMID:8686484
      reference_title: "Catatonia. II. Treatment with lorazepam and electroconvulsive therapy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Four patients failing lorazepam responded promptly to ECT.
      explanation: >-
        Efficacy in benzodiazepine non-responders is the clinical evidence that
        ECT acts beyond the GABA-A node.
  evidence:
  - reference: PMID:8686484
    reference_title: "Catatonia. II. Treatment with lorazepam and electroconvulsive therapy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: It is concluded that lorazepam and ECT are effective treatments for catatonia.
    explanation: >-
      The study's own summary conclusion on efficacy.
  - reference: PMID:35861966
    reference_title: "Malignant Catatonia: A Review for the Intensivist."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Catatonia typically improves with benzodiazepines and treatment of its
      underlying psychiatric or medical conditions, with electroconvulsive
      therapy reserved for catatonia refractory to benzodiazepines or for
      malignant catatonia.
    explanation: >-
      Defines the two indications that position ECT relative to
      benzodiazepines.
- name: Treatment of the underlying condition
  description: >-
    Because catatonia is a convergence syndrome, treating the upstream
    liability is part of definitive management rather than an adjunct — most
    consequentially, immunotherapy in autoimmune encephalitis and withdrawal of
    a precipitating dopamine antagonist. Multidisciplinary working between
    psychiatrists and physicians is frequently required.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Therapeutic Procedure
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Heterogeneous Upstream Liability
    treatment_effect: INHIBITS
    description: >-
      Removing or treating the upstream liability addresses the entry point to
      the mechanism rather than its downstream expression.
    evidence:
    - reference: PMID:35861966
      reference_title: "Malignant Catatonia: A Review for the Intensivist."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Catatonia typically improves with benzodiazepines and treatment of its
        underlying psychiatric or medical conditions
      explanation: >-
        States that treatment of the underlying condition is part of what
        resolves catatonia.
  evidence:
  - reference: PMID:37236789
    reference_title: The diagnosis and treatment of catatonia.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multidisciplinary working between psychiatrists and physicians is often
      essential.
    explanation: >-
      Guideline statement reflecting that the upstream cause is frequently
      medical rather than psychiatric.
- name: Amantadine and memantine
  description: >-
    Uncompetitive NMDA receptor antagonists used as second-line pharmacotherapy
    when benzodiazepines fail or are not tolerated. Amantadine additionally
    enhances central dopamine release and delays synaptic dopamine reuptake,
    which is the proposed reason it suits a syndrome hypothesised to involve
    hypodopaminergic tone. The supporting literature is case reports and case
    series rather than trials, so this is curated as a mechanistically
    motivated second-line option, not an established one.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: amantadine
      term:
        id: CHEBI:2618
        label: amantadine
    - preferred_term: memantine
      term:
        id: CHEBI:64312
        label: memantine
  target_mechanisms:
  - target: Glutamatergic NMDA Receptor Perturbation and Neuroinflammation
    treatment_effect: MODULATES
    description: >-
      Uncompetitive NMDA receptor antagonism is proposed to rebalance, rather
      than simply suppress, the NMDA receptor perturbation this node describes —
      acting on prefrontal GABA-A parvalbumin interneurons and on striatal NMDA
      signalling within the cortico-striato-thalamo-cortical circuitry.
    evidence:
    - reference: PMID:37039129
      reference_title: "Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The NMDA receptor antagonists, amantadine and memantine, may reset the
        problems related to reduced dopamine and GABA in the CSTC circuitries
      explanation: >-
        States the proposed mechanism by which these agents act on the NMDA
        receptor perturbation curated at this node.
  evidence:
  - reference: PMID:37039129
    reference_title: "Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Medications such as amantadine and memantine serve as uncompetitive
      antagonists of the NMDA receptor and thus may be helpful in patients with
      catatonia.
    explanation: >-
      Guideline statement placing both agents in the catatonia treatment
      repertoire, with the hedged wording preserved.
  - reference: PMID:37039129
    reference_title: "Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: Amantadine as monotherapy often abolished catatonia after a few doses.
    explanation: >-
      Reports the observed response, but the underlying evidence is a systematic
      review of 11 articles describing 18 cases, so it supports a signal rather
      than an established effect size — hence PARTIAL.
  notes: >-
    Curated from the BAP consensus guideline's own summary of the case-report
    and case-series literature (18 amantadine cases across 11 articles, plus
    later additions). No controlled trial evidence exists for either agent in
    catatonia.
- name: Avoidance of antipsychotic medication
  description: >-
    Antipsychotic exposure can both induce and worsen catatonia, and catatonia
    is itself a risk factor for neuroleptic malignant syndrome, so antipsychotic
    use in an actively catatonic patient is a recognised hazard. The guideline
    describes this as one of the most controversial areas of catatonia
    management rather than an absolute prohibition — antipsychotics may still be
    indicated for an underlying psychotic illness once catatonia has resolved.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: avoidance of contraindicated medications
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Reduced Striatal Dopaminergic Transmission
    treatment_effect: INHIBITS
    description: >-
      Withholding dopamine antagonists removes an avoidable driver of the
      striatal dopaminergic hypofunction curated at this node — the same
      exposure that defines antipsychotic-induced catatonia and that anchors the
      malignant-catatonia versus neuroleptic malignant syndrome differential.
    evidence:
    - reference: PMID:37039129
      reference_title: "Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Antipsychotic medications can induce catatonia
      explanation: >-
        States that the drug class can cause the mechanism this node describes,
        which is what makes withholding it mechanistically directed rather than
        merely cautious.
  evidence:
  - reference: PMID:37039129
    reference_title: "Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in some studies of catatonia, the use of antipsychotics has been
      associated with poor outcomes
    explanation: >-
      Outcome evidence behind the avoidance recommendation, quoted with the
      guideline's own hedge ("in some studies").
  - reference: PMID:37039129
    reference_title: "Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The use of antipsychotics is one of the most controversial areas in
      catatonia management
    explanation: >-
      Records that the guideline frames this as contested rather than settled,
      which is why the entry curates avoidance without asserting an absolute
      contraindication.
differential_diagnoses:
- name: Neuroleptic malignant syndrome
  description: >-
    Malignant catatonia and neuroleptic malignant syndrome share precipitants
    (dopamine antagonist exposure), an overlapping motor phenotype, and
    autonomic instability. Whether they are one entity or two has been debated
    for decades and is not settled here.
  distinguishing_features:
  - NMS is defined by a temporal relationship to dopamine-antagonist exposure, whereas malignant catatonia may arise without it.
  - In practice the distinction is often retrospective, and treatment converges on withdrawal of the offending agent, supportive care, and ECT.
  evidence:
  - reference: PMID:40368005
    reference_title: "Catatonia: American Psychiatric Association Resource Document."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      abulia/akinetic mutism, delirium, major neurocognitive disorders,
      locked-in syndrome, late-stage Parkinson's disease, stiff-person syndrome,
      akathisia, mania, malignant catatonia/neuroleptic malignant syndrome,
      autoimmune encephalitis, and serotonin syndrome
    explanation: >-
      The APA Resource Document enumerates the catatonia differential, including
      malignant catatonia/neuroleptic malignant syndrome.
- name: Delirium
  description: >-
    Delirium and catatonia can co-occur, and catatonia comorbid with delirium
    may respond less well to standard treatment.
  distinguishing_features:
  - Delirium is defined by fluctuating attention and awareness; catatonia by the psychomotor sign cluster.
  - Their coexistence is a recognized clinical problem rather than a diagnostic error.
  evidence:
  - reference: PMID:40368005
    reference_title: "Catatonia: American Psychiatric Association Resource Document."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      abulia/akinetic mutism, delirium, major neurocognitive disorders,
      locked-in syndrome, late-stage Parkinson's disease, stiff-person syndrome,
      akathisia, mania, malignant catatonia/neuroleptic malignant syndrome,
      autoimmune encephalitis, and serotonin syndrome
    explanation: >-
      The APA Resource Document enumerates the catatonia differential, including
      delirium.
- name: Akinetic mutism and abulia
  description: >-
    Both present with reduced speech and movement without the fuller catatonic
    sign cluster.
  distinguishing_features:
  - Catalepsy, waxy flexibility, negativism, and echophenomena favor catatonia.
  - A response to a parenteral lorazepam challenge favors catatonia.
  evidence:
  - reference: PMID:40368005
    reference_title: "Catatonia: American Psychiatric Association Resource Document."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      abulia/akinetic mutism, delirium, major neurocognitive disorders,
      locked-in syndrome, late-stage Parkinson's disease, stiff-person syndrome,
      akathisia, mania, malignant catatonia/neuroleptic malignant syndrome,
      autoimmune encephalitis, and serotonin syndrome
    explanation: >-
      The APA Resource Document enumerates the catatonia differential, including
      abulia/akinetic mutism.
- name: Late-stage Parkinson disease
  description: >-
    Shares hypokinesia, rigidity, and reduced verbal output with the akinetic
    presentation of catatonia; the shared striatal dopaminergic substrate is
    the basis of the proposal that catatonia be considered a psychiatric
    parkinsonism.
  distinguishing_features:
  - Parkinson disease shows a progressive course with rest tremor and levodopa responsiveness.
  - Catatonia is typically episodic and benzodiazepine-responsive.
  evidence:
  - reference: PMID:40368005
    reference_title: "Catatonia: American Psychiatric Association Resource Document."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      abulia/akinetic mutism, delirium, major neurocognitive disorders,
      locked-in syndrome, late-stage Parkinson's disease, stiff-person syndrome,
      akathisia, mania, malignant catatonia/neuroleptic malignant syndrome,
      autoimmune encephalitis, and serotonin syndrome
    explanation: >-
      The APA Resource Document enumerates the catatonia differential, including
      late-stage Parkinson's disease.
- name: Locked-in syndrome
  description: >-
    Preserved awareness with near-total loss of voluntary movement can be
    mistaken for stupor.
  distinguishing_features:
  - Locked-in syndrome follows a structural brainstem lesion demonstrable on imaging.
  - Vertical eye movement and blinking are spared in locked-in syndrome.
  evidence:
  - reference: PMID:40368005
    reference_title: "Catatonia: American Psychiatric Association Resource Document."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      abulia/akinetic mutism, delirium, major neurocognitive disorders,
      locked-in syndrome, late-stage Parkinson's disease, stiff-person syndrome,
      akathisia, mania, malignant catatonia/neuroleptic malignant syndrome,
      autoimmune encephalitis, and serotonin syndrome
    explanation: >-
      The APA Resource Document enumerates the catatonia differential, including
      locked-in syndrome.
- name: Serotonin syndrome
  description: >-
    Autonomic instability with altered mental status and neuromuscular
    abnormality overlaps with malignant catatonia.
  distinguishing_features:
  - Serotonin syndrome follows serotonergic drug exposure.
  - Clonus and hyperreflexia are characteristic, rather than catalepsy and negativism.
  evidence:
  - reference: PMID:40368005
    reference_title: "Catatonia: American Psychiatric Association Resource Document."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      abulia/akinetic mutism, delirium, major neurocognitive disorders,
      locked-in syndrome, late-stage Parkinson's disease, stiff-person syndrome,
      akathisia, mania, malignant catatonia/neuroleptic malignant syndrome,
      autoimmune encephalitis, and serotonin syndrome
    explanation: >-
      The APA Resource Document enumerates the catatonia differential, including
      serotonin syndrome.
- name: Stiff-person syndrome
  description: >-
    Autoimmune rigidity with axial and limb muscle stiffness can be mistaken for
    catatonic rigidity and posturing, and both may respond partially to
    benzodiazepines — which removes the lorazepam challenge as a discriminator.
  distinguishing_features:
  - Stiff-person syndrome is associated with anti-GAD65 (or anti-amphiphysin) antibodies and continuous motor unit activity on EMG.
  - Stiffness is stimulus-sensitive and painful, without the echophenomena, negativism, or mutism of the catatonic sign cluster.
  evidence:
  - reference: PMID:40368005
    reference_title: "Catatonia: American Psychiatric Association Resource Document."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      abulia/akinetic mutism, delirium, major neurocognitive disorders,
      locked-in syndrome, late-stage Parkinson's disease, stiff-person syndrome,
      akathisia, mania, malignant catatonia/neuroleptic malignant syndrome,
      autoimmune encephalitis, and serotonin syndrome
    explanation: >-
      The APA Resource Document enumerates the catatonia differential, including
      stiff-person syndrome.
- name: Akathisia
  description: >-
    Antipsychotic-associated motor restlessness overlaps with the hyperkinetic
    and agitated pole of catatonia, and the two share an antipsychotic-exposure
    history.
  distinguishing_features:
  - Akathisia is dominated by a subjective sense of inner restlessness that the patient can usually report.
  - Movement in akathisia is purposeful relief-seeking, rather than the non-goal-directed stereotypy and mannerism of catatonia.
  evidence:
  - reference: PMID:40368005
    reference_title: "Catatonia: American Psychiatric Association Resource Document."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      abulia/akinetic mutism, delirium, major neurocognitive disorders,
      locked-in syndrome, late-stage Parkinson's disease, stiff-person syndrome,
      akathisia, mania, malignant catatonia/neuroleptic malignant syndrome,
      autoimmune encephalitis, and serotonin syndrome
    explanation: >-
      The APA Resource Document enumerates the catatonia differential, including
      akathisia.
- name: Major neurocognitive disorders
  description: >-
    Advanced dementia can present with reduced speech, reduced spontaneous
    movement, and apparent negativism. Catatonia may also occur on top of a
    major neurocognitive disorder rather than instead of it.
  distinguishing_features:
  - Major neurocognitive disorders follow a chronic progressive course, whereas catatonia is typically episodic with a definable onset.
  - Catalepsy, waxy flexibility, and echophenomena are not features of dementia itself.
  evidence:
  - reference: PMID:40368005
    reference_title: "Catatonia: American Psychiatric Association Resource Document."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      abulia/akinetic mutism, delirium, major neurocognitive disorders,
      locked-in syndrome, late-stage Parkinson's disease, stiff-person syndrome,
      akathisia, mania, malignant catatonia/neuroleptic malignant syndrome,
      autoimmune encephalitis, and serotonin syndrome
    explanation: >-
      The APA Resource Document enumerates the catatonia differential, including
      major neurocognitive disorders.
- name: Mania
  description: >-
    Manic excitement overlaps with the hyperkinetic pole of catatonia, and
    excited catatonia has historically been conflated with mania.
  distinguishing_features:
  - Manic agitation is goal-directed and accompanied by elevated mood, pressured speech, and reduced need for sleep.
  - Catatonic excitement is non-goal-directed and co-occurs with hypokinetic signs within the same episode.
  evidence:
  - reference: PMID:40368005
    reference_title: "Catatonia: American Psychiatric Association Resource Document."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      abulia/akinetic mutism, delirium, major neurocognitive disorders,
      locked-in syndrome, late-stage Parkinson's disease, stiff-person syndrome,
      akathisia, mania, malignant catatonia/neuroleptic malignant syndrome,
      autoimmune encephalitis, and serotonin syndrome
    explanation: >-
      The APA Resource Document enumerates the catatonia differential, including
      mania.
discussions:
- discussion_id: catatonia_no_unified_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Distributed Psychomotor Network Destabilization
  prompt: >-
    Is there a single mechanism or biomarker that accounts for catatonia across
    its psychiatric, neurologic, autoimmune, and medical contexts, or is the
    convergent-network account the correct final level of explanation?
  rationale: >-
    This is the central open question of the entry and the reason the
    pathophysiology is curated as several parallel routes into one hub rather
    than as a single chain. The literature is explicit that no single biomarker
    or unified mechanism fully accounts for catatonia across contexts, and that
    the neurochemical evidence describes interacting rather than
    single-transmitter disturbance. Resolving it matters practically: if the
    convergent-network account is correct, subtype-sensitive treatment
    selection is the achievable goal and a universal catatonia biomarker is not.
  proposed_experiments:
  - experiment_id: exp_catatonia_acute_state_multimodal_cohort
    name: Prospective acute-state multimodal phenotyping across upstream causes
    description: >-
      Recruit an acute-state catatonia cohort stratified by upstream cause
      (mood disorder, schizophrenia-spectrum, autoimmune encephalitis, medical
      or drug-induced) and acquire the same multimodal battery in every stratum:
      resting-state and emotional-task fMRI, GABA-A receptor imaging, striatal
      dopaminergic imaging, CSF and serum neuronal autoantibodies, and
      dimensional Bush-Francis and Northoff scale scoring. The discriminating
      test is whether the network signature is shared across strata while the
      neurochemical signature differs by stratum — the prediction of the
      convergent model — or whether each stratum has its own network signature.
  evidence:
  - reference: PMID:42431537
    reference_title: "Toward a systems model of catatonia: Circuits, neurochemistry, immune perturbation, and biological heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No single biomarker or unified mechanism fully accounts for catatonia
      across contexts.
    explanation: >-
      The explicit statement of the gap this discussion records.
  - reference: PMID:42431537
    reference_title: "Toward a systems model of catatonia: Circuits, neurochemistry, immune perturbation, and biological heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Future progress will depend on dimensional phenotyping, multimodal
      biomarker integration, and subtype-sensitive treatment research.
    explanation: >-
      The authors' own statement of what would close the gap, which the
      proposed experiment operationalizes.
- discussion_id: catatonia_sampling_and_acute_state_bias
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Distributed Psychomotor Network Destabilization
  - pathophysiology#Orbitofrontal Emotional-Motor Processing Dysfunction
  prompt: >-
    How much of the imaging evidence for the distributed-network model is an
    artifact of studying schizophrenia-spectrum patients in the post-acute
    state rather than catatonia in the acute state across its full diagnostic
    range?
  rationale: >-
    The two limitations compound. The multimodal MRI evidence comes from a
    schizophrenia-spectrum sample, and the orbitofrontal fMRI evidence comes
    from post-acute patients whose authors explicitly interpret the finding as
    a trait marker of predisposition rather than a state correlate. A network
    signature derived under both constraints may describe the vulnerability of
    one diagnostic group rather than the mechanism of the acute syndrome. This
    is a limit on how causally the hub node may be read, and it is recorded
    rather than smoothed over.
  evidence:
  - reference: PMID:42431537
    reference_title: "Toward a systems model of catatonia: Circuits, neurochemistry, immune perturbation, and biological heterogeneity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      key limitations remain, including the overrepresentation of
      schizophrenia-spectrum samples and limited acute-state data
    explanation: >-
      Names both sampling limitations directly.
  - reference: PMID:15279056
    reference_title: "Orbitofrontal cortical dysfunction in akinetic catatonia: a functional magnetic resonance imaging study during negative emotional stimulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Because we investigated postacute patients, orbitofrontal cortical
      alterations may be interpreted as a trait marker predisposing for
      development of catatonic syndrome
    explanation: >-
      A worked instance of the acute-state limitation, stated by the original
      authors.
- discussion_id: catatonia_evidence_quality_ceiling
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Distributed Psychomotor Network Destabilization
  prompt: >-
    Can treatment recommendations for catatonia be raised above their current
    evidence ceiling, given that first-line therapy rests on observational
    studies and case series rather than randomized trials?
  rationale: >-
    Catatonia is unusual in that its first-line treatments are both effective
    and poorly evidenced by contemporary standards. The BAP consensus guideline
    states plainly that clinical trials were uncommon and that its
    recommendations are mainly informed by small observational studies, case
    series, and case reports. The 76% lorazepam response rate curated in this
    entry comes from an open, non-randomized prospective protocol in 28
    patients. Any downstream use of this entry for therapeutic inference should
    carry that ceiling with it.
  evidence:
  - reference: PMID:37039129
    reference_title: "Evidence-based consensus guidelines for the management of catatonia: Recommendations from the British Association for Psychopharmacology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical trials were uncommon, and the recommendations in this guideline
      are mainly informed by small observational studies, case series and case
      reports, which highlights the need for randomised controlled trials and
      prospective cohort studies in this area.
    explanation: >-
      The guideline's own statement of the evidence ceiling.
- discussion_id: catatonia_malignant_vs_nms
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - pathophysiology#Autonomic Decompensation
  - pathophysiology#Reduced Striatal Dopaminergic Transmission
  prompt: >-
    Are malignant catatonia and neuroleptic malignant syndrome one entity with
    two names, or two entities that share a striatal dopaminergic substrate?
  rationale: >-
    The two syndromes share precipitants, an overlapping motor phenotype,
    autonomic instability, and a treatment pathway that converges on
    withdrawing the offending agent and ECT. The striatal-dopamine hypothesis
    supplies a mechanism that would unify them. Against unification, malignant
    catatonia occurs without dopamine-antagonist exposure. The question is
    recorded as an open controversy because the entity distinction currently
    rests on exposure history rather than on any mechanistic discriminator.
  evidence:
  - reference: PMID:40966690
    reference_title: Reduced striatal dopamine transmission as a transdiagnostic substrate of psychomotor retardation.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In addition, there are close epidemiological relationships between
      depression and Parkinson's disease, and between catatonia and neuroleptic
      malignant syndrome.
    explanation: >-
      Records the epidemiological relationship that a shared-substrate account
      would explain.
  - reference: PMID:35861966
    reference_title: "Malignant Catatonia: A Review for the Intensivist."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Malignant catatonia describes catatonia that presents with clinically
      significant autonomic abnormalities including change in temperature, blood
      pressure, heart rate, and respiratory rate.
    explanation: >-
      Supplies the definition of the entity on the catatonia side of the
      controversy.
- discussion_id: catatonia_hpo_term_gap
  kind: CURATION_TODO
  status: OPEN
  attaches_to:
  - pathophysiology#Hypokinetic Psychomotor Output
  prompt: >-
    HPO has no term for catatonia, or for stupor, catalepsy, or waxy
    flexibility. Should a new-term request be filed, and until then how should
    the syndrome be bound in entries where it appears as a phenotype?
  rationale: >-
    Searched HPO for catatonia, stupor, catalepsy, and waxy flexibility on
    2026-08-14: none exists. HPO does carry the component signs used in this
    entry (Mutism HP:0002300, Abnormal posturing HP:0002533, Negativism
    HP:0410291, Motor stereotypy HP:0000733, Echolalia HP:0010529, Facial
    grimacing HP:0000273, Akinesia HP:0002304, Rigidity HP:0002063). MONDO does
    have catatonia (MONDO:0800105), which is why this is curated as a disease
    entry rather than as a disease-like phenotype module — the module family for
    disease-like phenotypes requires both an HP and a MONDO identifier. The
    practical consequence is that a disorder in which catatonia occurs cannot
    bind it as a single phenotype term and must either enumerate the component
    signs or leave the phenotype unbound, as the Schizophrenia entry currently
    does. An HPO new-term request would close this.
  notes: >-
    Upstream ontology gap, not a dismech bug. Recorded here so the decision is
    auditable rather than rediscovered.
notes: >-
  Scope decision (issue #6531). Catatonia is curated as a standalone Disease
  entry anchored on MONDO:0800105 rather than as a mechanism module, for three
  reasons. First, the disease-like-phenotype module family requires a concept
  carrying both an HP and a MONDO identifier, and HPO has no catatonia term
  (see the catatonia_hpo_term_gap discussion). Second, a mechanism module
  asserts a conserved causal chain that conforming disorders duplicate, and the
  defining feature of the current catatonia literature is that no such
  conserved chain is established — a module would assert more than the evidence
  supports, whereas competing mechanistic_hypotheses inside a disease entry
  express the heterogeneity honestly. Third, catatonia is a MONDO disease
  concept in its own right, which is the unit the psychiatric curation SOP
  assigns one entry to. If the convergent-network model consolidates, promoting
  the hub chain to a module and having Schizophrenia, Autoimmune_Encephalitis,
  Anti-NMDA_Receptor_Encephalitis and others declare conforms_to would be the
  natural follow-up.

  Cross-entry follow-up not done here: Schizophrenia carries a Catatonia
  phenotype with no phenotype_term binding, and Autoimmune_Encephalitis and
  Anti-NMDA_Receptor_Encephalitis mention catatonia only in prose. Wiring those
  entries to this one is deliberately left as separate work so this entry can be
  reviewed on its own.

  Evidence-quality note: the treatment evidence here is the best available but
  is observational (see the catatonia_evidence_quality_ceiling discussion). The
  striatal-dopamine node rests on a hypothesis-level synthesis about psychomotor
  retardation across disorders rather than on catatonia-specific measurement,
  and its evidence is marked PARTIAL accordingly.

- name: Glutamatergic NMDA Receptor Perturbation and Neuroinflammation
  biological_scale: CELLULAR
  description: >-
    In the autoimmune subgroup, antibodies against the NMDA receptor perturb
    glutamatergic excitation and are accompanied by CNS inflammation. Catatonia
    is present in a majority of published NMDA receptor antibody encephalitis
    cases, and its phenomenology in that setting is weighted toward the
    hypokinetic pole — immobility/stupor and mutism predominate — while
    excitement co-occurs in a third of patients, illustrating within-episode
    heterogeneity. Microglial processes are among those implicated by genetic
    and developmental data, though peripheral inflammatory biomarkers remain
    nonspecific.

- name: Reduced Striatal Dopaminergic Transmission
  biological_scale: CELLULAR
  description: >-
    Reduced striatal dopamine signaling is a proposed contributor to hypokinetic catatonia.
    Human imaging observations are sparse and measure presynaptic synthesis, storage or transporter
    availability rather than the complete signaling pathway. The direct/indirect basal-ganglia
    pathway model is mechanistic background; its full sequence has not been demonstrated in
    catatonia. Pharmacological reports and overlap with neuroleptic malignant syndrome support
    investigation but are not a universal explanation.

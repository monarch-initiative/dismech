  description: >-
    Levodopa and dopamine agonists have been tried in isolated cases. The BAP guideline lists
    them as low-evidence later-line possibilities, whereas the 2025 APA resource document discourages
    them because of reported worsening of psychosis. They are not established routine treatments
    for catatonia, and their use does not prove a general dopamine-deficiency mechanism.

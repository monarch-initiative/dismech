name: Streptococcal meningitis
creation_date: "2026-09-30T02:43:53Z"
description: >-
  Streptococcal meningitis is bacterial meningitis caused by invasive
  Streptococcus species. Pneumococci, neonatal group B Streptococcus, and
  zoonotic Streptococcus suis reach the bloodstream from respiratory, genital,
  or swine-associated exposure sites, cross the blood-brain or blood-CSF
  barrier, replicate in the cerebrospinal fluid, and trigger acute
  neutrophilic meningeal inflammation with fever, headache, nuchal rigidity,
  and potentially permanent auditory or neurologic sequelae.
category: Infectious Disease
disease_term:
  preferred_term: streptococcal meningitis
  term:
    id: MONDO:0001316
    label: streptococcal meningitis
parents:
- Bacterial meningitis
synonyms:
- Streptococcus meningitis
- Streptococcal bacterial meningitis
- Group B streptococcal meningitis
- Streptococcus suis meningitis
notes: >-
  This is the etiologic parent for meningitis caused by Streptococcus species.
  Species-specific child entries, such as Pneumococcal Meningitis, should carry
  the full strain-specific capsule, toxin, vaccine, and resistance details.
review_notes: >-
  Deliberately lumped. Streptococcal meningitis keeps pneumococcal, neonatal
  group B Streptococcus, and zoonotic S. suis meningitides together at this
  parent MONDO term because the species differ by age band, reservoir, exposure
  route, and sequelae but share the same bacterial-meningitis compartment and
  each clinically important species can still be curated as a species-specific
  child when its mechanism, vaccine, or resistance details warrant it.
has_subtypes:
- name: Pneumococcal
  display_name: Pneumococcal meningitis (Streptococcus pneumoniae)
  classification: etiologic_species
  curated_in: Pneumococcal_Meningitis
  description: >-
    Meningitis caused by Streptococcus pneumoniae, the commonest cause across
    age groups. Curated in full in `Pneumococcal_Meningitis.yaml`.
  subtype_term:
    preferred_term: pneumococcal meningitis
    term:
      id: MONDO:0006913
      label: pneumococcal meningitis
- name: GBS
  display_name: Group B streptococcal meningitis (Streptococcus agalactiae)
  classification: etiologic_species
  description: >-
    Neonatal and early-infant meningitis caused by Streptococcus agalactiae
    acquired perinatally from maternal genital or gastrointestinal carriage, and
    prevented by maternal screening with intrapartum antibiotic prophylaxis.
- name: S. suis
  display_name: Streptococcus suis meningitis
  classification: etiologic_species
  description: >-
    Zoonotic meningitis caused by Streptococcus suis acquired from swine or raw
    pork exposure, with a high rate of persistent sensorineural hearing and
    vestibular loss.
infectious_agent:
- name: Streptococcus pneumoniae
  infectious_agent_term:
    preferred_term: Streptococcus pneumoniae
    term:
      id: NCBITaxon:1313
      label: Streptococcus pneumoniae
  description: >-
    Streptococcus pneumoniae is the pneumococcus that causes the pneumococcal
    form of streptococcal meningitis across age groups.
  evidence:
  - reference: PMID:33370401
    reference_title: Role of astroglial Connexin 43 in pneumolysin cytotoxicity and during pneumococcal meningitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Streptococcus pneumoniae or pneumococcus (PN) is a major causative agent
      of bacterial meningitis with high mortality in young infants and elderly
      people worldwide.
    explanation: >-
      Identifies S. pneumoniae as a major bacterial-meningitis pathogen in the
      age groups at the extremes of life.
- name: Streptococcus agalactiae
  infectious_agent_term:
    preferred_term: Streptococcus agalactiae
    term:
      id: NCBITaxon:1311
      label: Streptococcus agalactiae
  description: >-
    Streptococcus agalactiae, or group B Streptococcus, causes neonatal
    streptococcal meningitis, with serotype III/ST-17 lineages enriched among
    meningitis and late-onset invasive disease.
  evidence:
  - reference: PMID:32060499
    reference_title: "Multistate, Population-Based Distributions of Candidate Vaccine Targets, Clonal Complexes, and Resistance Features of Invasive Group B Streptococci Within the United States, 2015-2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Group B Streptococcus (GBS) is a leading cause of neonatal sepsis and
      meningitis and an important cause of invasive infections in pregnant and
      nonpregnant adults.
    explanation: >-
      Establishes GBS as a leading neonatal cause of sepsis and meningitis.
  - reference: PMID:30833941
    reference_title: Molecular Characteristics and Antimicrobial Resistance of Group B Streptococcus Strains Causing Invasive Disease in Neonates and Adults.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ST-17 strains were more likely to cause meningitis and late-onset disease
      than other strains.
    explanation: >-
      Supports the specific association between ST-17 GBS lineages, neonatal
      meningitis, and late-onset invasive disease.
- name: Streptococcus suis
  infectious_agent_term:
    preferred_term: Streptococcus suis
    term:
      id: NCBITaxon:1307
      label: Streptococcus suis
  description: >-
    Streptococcus suis is a swine-associated zoonotic Streptococcus that causes
    adult bacterial meningitis after occupational or foodborne pig exposure.
  evidence:
  - reference: PMID:21779197
    reference_title: Streptococcus suis meningitis with bilateral sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Streptococcus suis infection is an emerging zoonosis in Asia. The most
      common disease manifestation is meningitis, which is often associated with
      hearing loss and cochleovestibular signs.
    explanation: >-
      Identifies S. suis as a zoonotic cause of meningitis with a
      hearing-and-vestibular complication pattern.
agent_life_cycle:
  description: >-
    Pneumococci and group B Streptococcus circulate primarily in human mucosal
    niches before invasive spread, whereas S. suis is maintained in swine and
    reaches people through occupational or raw-pork exposures; humans are the
    clinical host for meningitis in all three branches.
  hosts:
  - preferred_term: Homo sapiens
    role: clinical host and human mucosal reservoir
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  - preferred_term: Sus scrofa
    role: zoonotic S. suis source host
    term:
      id: NCBITaxon:9823
      label: Sus scrofa
  evidence:
  - reference: PMID:21779197
    reference_title: Streptococcus suis meningitis with bilateral sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      S. suis infection in humans mainly occurs among risk groups that have
      frequent exposure to pigs or raw pork.
    explanation: >-
      Supports the swine-associated zoonotic branch of the Streptococcus
      meningitis lifecycle.
  - reference: PMID:32060499
    reference_title: "Multistate, Population-Based Distributions of Candidate Vaccine Targets, Clonal Complexes, and Resistance Features of Invasive Group B Streptococci Within the United States, 2015-2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Group B Streptococcus (GBS) is a leading cause of neonatal sepsis and
      meningitis and an important cause of invasive infections in pregnant and
      nonpregnant adults.
    explanation: >-
      Supports the human maternal-neonatal branch of invasive group B
      Streptococcus disease.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Respiratory or genital Streptococcus acquisition
  description: >-
    Pneumococci colonize the upper airway and group B Streptococcus colonizes
    maternal genital or gastrointestinal mucosa; invasive disease begins when
    these mucosal organisms escape local containment and enter blood.
  evidence:
  - reference: PMID:32060499
    reference_title: "Multistate, Population-Based Distributions of Candidate Vaccine Targets, Clonal Complexes, and Resistance Features of Invasive Group B Streptococci Within the United States, 2015-2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Group B Streptococcus (GBS) is a leading cause of neonatal sepsis and
      meningitis and an important cause of invasive infections in pregnant and
      nonpregnant adults.
    explanation: >-
      Supports GBS as a maternal-neonatal and adult invasive Streptococcus
      species that belongs in the mucosal acquisition branch.
- name: Swine or raw-pork Streptococcus suis exposure
  description: >-
    Humans acquire zoonotic S. suis after frequent exposure to pigs, pork
    carcasses, swine products, or raw pork and pig blood.
  evidence:
  - reference: PMID:21779197
    reference_title: Streptococcus suis meningitis with bilateral sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      S. suis infection in humans mainly occurs among risk groups that have
      frequent exposure to pigs or raw pork.
    explanation: >-
      Establishes pig and raw-pork exposure as the route into the zoonotic S.
      suis meningitis branch.
  - reference: PMID:19275779
    reference_title: Hearing and vestibular loss in Streptococcus suis infection from swine and traditional raw pork exposure in northern Thailand.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A past history of the consumption of raw pork and/or pig's blood was found
      in 62.5 per cent of cases, whereas contact with swine products was found
      in 25 per cent.
    explanation: >-
      A northern Thailand case series quantified raw-pork or swine-product
      exposures among culture-proven S. suis infections.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Streptococcal species are leading causes of a global meningitis burden with
    high mortality, concentrated in young children.
  evidence:
  - reference: PMID:41911930
    reference_title: "Global, regional, and national burden of meningitis, its risk factors, and aetiologies, 1990-2023: a systematic analysis for the Global Burden of Disease Study 2023."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The four WHO-defined preventable meningitis pathogens of interest (S
      pneumoniae, N meningitidis, Haemophilus influenzae, and Group B
      streptococcus) contributed to 98 700 deaths (77 000-127 000) and 594 000
      cases (514 000-686 000).
    explanation: >-
      Quantifies the mortality and incidence burden to which S. pneumoniae and
      Group B streptococcus contribute (GBD 2023).
environmental:
- name: Immunocompromising host conditions
  description: >-
    Asplenia, alcoholism, HIV infection and other immunocompromising conditions
    raise the risk of invasive pneumococcal disease, including meningitis, and
    are the conditions for which pneumococcal immunization is recommended.
  disease_effect: PREDISPOSES
  evidence:
  - reference: PMID:16163421
    reference_title: "[Prevention of community-acquired pneumonia in adults]."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Immunization is recommended in adults over 65 years old, in patients
      affected by chronic diseases (cardiopathies, COPD, nephropathies, diabetes
      mellitus, hepatic cirrhosis, chronic breakage in brain-blood barrier,
      functional or anatomical asplenia, alcoholism), in immunocompromised hosts,
      including HIV infection, chemotherapy treatment and hematological
      malignancies.
    explanation: >-
      Lists asplenia, alcoholism and HIV infection among the host conditions
      recognized as risk factors for invasive pneumococcal disease and warranting
      vaccination.
pathophysiology:
- name: Mucosal or zoonotic Streptococcus invasion
  role: trigger
  description: >-
    Meningitis-capable pneumococcal, GBS, or S. suis lineages colonize a
    respiratory, genital, or swine-exposed entry surface and breach epithelial
    and innate-immune containment.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:21779197
    reference_title: Streptococcus suis meningitis with bilateral sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report a case of S. suis meningitis in a 67-yr-old pig carcass
      handler, who presented with dizziness and sensorineural hearing loss
      followed by headaches.
    explanation: >-
      Illustrates direct occupational exposure as an entry route into zoonotic
      S. suis meningitis.
  downstream:
  - target: Streptococcal Bacteremia
    causal_link_type: DIRECT
    description: >-
      Organisms that escape the mucosa enter the bloodstream and disseminate.
- name: Streptococcal Bacteremia
  description: >-
    Bloodstream Streptococcus survives host clearance and reaches neurovascular
    barriers.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:32060499
    reference_title: "Multistate, Population-Based Distributions of Candidate Vaccine Targets, Clonal Complexes, and Resistance Features of Invasive Group B Streptococci Within the United States, 2015-2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    directness: INDIRECT
    snippet: >-
      Nearly all isolates possessed capsule genes, 1-2 of the 3 main pilus gene
      clusters, and 1 of 4 homologous alpha/Rib family determinants.
    explanation: >-
      Capsules and pilus adhesins mark the invasive GBS isolates that must
      survive in blood before meningeal seeding.
  downstream:
  - target: Meningeal Streptococcus Seeding
    causal_link_type: DIRECT
    description: >-
      Circulating bacteria cross the blood-brain or blood-CSF barrier and reach
      the cerebrospinal-fluid compartment.
- name: Meningeal Streptococcus Seeding
  description: >-
    Streptococci that enter cerebrospinal fluid replicate beside the meninges
    after pneumolysin-, adhesin-, and host-barrier interactions let bloodborne
    organisms traverse the neurovascular barrier.
  biological_scale: TISSUE
  locations:
  - preferred_term: blood-brain barrier
    term:
      id: UBERON:0000120
      label: blood brain barrier
  - preferred_term: cerebrospinal fluid
    term:
      id: UBERON:0001359
      label: cerebrospinal fluid
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  evidence:
  - reference: PMID:33370401
    reference_title: Role of astroglial Connexin 43 in pneumolysin cytotoxicity and during pneumococcal meningitis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      PN also induced nuclear shrinkage in astrocytes associated with the loss of
      BBB integrity, bacterial translocation across endothelial vessels and
      replication in the brain cortex.
    explanation: >-
      Demonstrates the pneumococcal transition from bloodstream infection across
      the blood-brain barrier into the brain in vivo.
  downstream:
  - target: Streptococcal CSF Replication
    causal_link_type: DIRECT
    description: >-
      Once streptococci cross the barrier, organisms replicate in the
      cerebrospinal-fluid and subarachnoid compartments.
  - target: Pneumolysin-aCx43 Astroglial Cytotoxicity
    causal_link_type: DIRECT
    description: >-
      Pneumococcal pneumolysin engages astroglial connexin-43 during meningeal
      invasion.
- name: Streptococcal CSF Replication
  role: consequence
  description: >-
    Streptococci multiply in the cerebrospinal fluid and expose resident glial
    and recruited myeloid cells to cell-wall products and pneumococcal toxins.
  biological_scale: ORGANISM
  locations:
  - preferred_term: cerebrospinal fluid
    term:
      id: UBERON:0001359
      label: cerebrospinal fluid
  - preferred_term: subarachnoid space
    term:
      id: UBERON:0000315
      label: subarachnoid space
  evidence:
  - reference: PMID:33370401
    reference_title: Role of astroglial Connexin 43 in pneumolysin cytotoxicity and during pneumococcal meningitis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Following intravenous PN challenge, mice deficient for aCx43 developed
      milder symptoms and showed severely reduced bacterial counts in the brain.
    explanation: >-
      The reduced brain bacterial burden in aCx43-deficient mice connects
      barrier traversal to intracranial pneumococcal infection.
  downstream:
  - target: TLR-MMP Neutrophilic Meningeal Inflammation
    causal_link_type: DIRECT
    description: >-
      Streptococcal products stimulate innate receptors and inflammatory
      proteases, recruiting neutrophils into the CSF.
- name: Pneumolysin-aCx43 Astroglial Cytotoxicity
  description: >-
    Pneumococcal pneumolysin acts through astroglial connexin-43 (aCx43) gap
    junctions to injure astrocytes and promote blood-brain-barrier traversal and
    intracerebral bacterial replication.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: astrocyte
    term:
      id: CL:0000127
      label: astrocyte
  biological_processes:
  - preferred_term: cytolysis
    modifier: INCREASED
    term:
      id: GO:0019835
      label: cytolysis
  downstream:
  - target: Streptococcal CNS Injury
    causal_link_type: DIRECT
    description: >-
      Astroglial cytotoxicity contributes to the parenchymal and barrier injury
      of streptococcal CNS disease.
  evidence:
  - reference: PMID:33370401
    reference_title: Role of astroglial Connexin 43 in pneumolysin cytotoxicity and during pneumococcal meningitis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we show that the astroglial connexin 43 (aCx43), a major gap
      junctional component expressed in astrocytes, plays a predominant role
      during PN meningitis.
    explanation: >-
      Identifies astroglial connexin-43 as the mediator of pneumolysin cytotoxicity
      during pneumococcal meningitis.
- name: TLR-MMP Neutrophilic Meningeal Inflammation
  role: consequence
  description: >-
    Streptococcal cell-wall products and pneumolysin trigger Toll-like-receptor
    and NF-kappaB cytokine signaling, TNF-alpha release, matrix
    metalloproteinase activation, and neutrophilic CSF inflammation.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: innate immune response
    term:
      id: GO:0045087
      label: innate immune response
    modifier: INCREASED
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:19012971
    reference_title: Effects of Toll-like receptor 2 agonist Pam(3)CysSK(4) on inflammation and brain damage in experimental pneumococcal meningitis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Pam(3)CysSK(4) induced pleocytosis, TNF-alpha and MMP-9 in CSF in
      sham-infection but not during acute meningitis.
    explanation: >-
      Shows that TLR2 stimulation is sufficient to induce CSF leukocytosis, TNF,
      and MMP-9 in an infant-rat pneumococcal meningitis system.
  downstream:
  - target: Streptococcal CNS Injury
    causal_link_type: DIRECT
    description: >-
      Cytokines and MMP-mediated barrier injury drive edema, vasculitis,
      cochlear injury, and neuronal damage.
  - target: Fever
    description: >-
      The meningeal inflammatory cytokine response produces fever.
  - target: Headache
    description: >-
      Meningeal inflammation produces headache.
  - target: Nuchal rigidity
    description: >-
      Meningeal inflammation produces the neck stiffness of meningism.
- name: Streptococcal CNS Injury
  role: consequence
  description: >-
    Meningeal inflammation disrupts the blood-brain barrier and extends into
    cortex, hippocampus, and cerebral vasculature, producing cognitive
    morbidity, infarcts, and death.
  biological_scale: TISSUE
  locations:
  - preferred_term: hippocampal formation
    term:
      id: UBERON:0002421
      label: hippocampal formation
  - preferred_term: cerebral cortex
    term:
      id: UBERON:0000956
      label: cerebral cortex
  downstream:
  - target: Streptococcal Cochlear Injury
    causal_link_type: DIRECT
    description: >-
      Inflammatory injury extends to the inner ear, producing cochlear damage.
  - target: Coma
    causal_link_type: DIRECT
    description: >-
      Severe cortical and systemic injury depresses consciousness to coma.
  evidence:
  - reference: PMID:24419461
    reference_title: Inhibition of matrix metalloproteinases-2 and -9 prevents cognitive impairment induced by pneumococcal meningitis in Wistar rats.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Adjuvant treatments with inhibitors of MMP-2 or MMP-2/9 prevented BBB
      breakdown in the hippocampus, and treatments with inhibitors of MMP-2,
      MMP-9 or MMP-2/9 prevented BBB breakdown in the cortex.
    explanation: >-
      Links the MMP inflammatory branch to barrier breakdown in hippocampus and
      cortex during experimental pneumococcal meningitis.
- name: Streptococcal Cochlear Injury
  description: >-
    Inflammatory injury to the inner ear produces the persistent sensorineural
    hearing and vestibular loss characteristic of streptococcal (notably S.
    suis) meningitis survivors.
  biological_scale: TISSUE
  locations:
  - preferred_term: cochlea
    term:
      id: UBERON:0001844
      label: cochlea
  downstream:
  - target: Sensorineural hearing impairment
    causal_link_type: DIRECT
    description: >-
      Cochlear injury produces persistent sensorineural hearing loss.
  evidence:
  - reference: PMID:19275779
    reference_title: Hearing and vestibular loss in Streptococcus suis infection from swine and traditional raw pork exposure in northern Thailand.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      After a mean follow up of 17 months, 73 per cent of the surviving
      meningitis cases had persistent sensorineural hearing loss and 50 per cent
      demonstrated vestibular impairment.
    explanation: >-
      Quantifies persistent auditory and vestibular injury among S. suis
      meningitis survivors.
phenotypes:
- name: Fever
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:15509818
    reference_title: Clinical features and prognostic factors in adults with bacterial meningitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The classic triad of fever, neck stiffness, and a change in mental status
      was present in only 44 percent of episodes; however, 95 percent had at
      least two of the four symptoms of headache, fever, neck stiffness, and
      altered mental status.
    explanation: >-
      Identifies fever as one of the cardinal acute features of adult
      community-acquired bacterial meningitis.
- name: Coma
  phenotype_term:
    preferred_term: Coma
    term:
      id: HP:0001259
      label: Coma
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:15509818
    reference_title: Clinical features and prognostic factors in adults with bacterial meningitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On admission, 14 percent of patients were comatose and 33 percent had
      focal neurologic abnormalities.
    explanation: >-
      Reports coma in 14% of adults at presentation with community-acquired
      bacterial meningitis.
- name: Nuchal rigidity
  phenotype_term:
    preferred_term: Nuchal rigidity
    term:
      id: HP:0031179
      label: Nuchal rigidity
  evidence:
  - reference: PMID:15509818
    reference_title: Clinical features and prognostic factors in adults with bacterial meningitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The classic triad of fever, neck stiffness, and a change in mental status
      was present in only 44 percent of episodes; however, 95 percent had at
      least two of the four symptoms of headache, fever, neck stiffness, and
      altered mental status.
    explanation: >-
      Maps the clinically reported neck stiffness of acute bacterial meningitis
      to the nuchal-rigidity HPO term.
- name: Headache
  phenotype_term:
    preferred_term: Headache
    term:
      id: HP:0002315
      label: Headache
  evidence:
  - reference: PMID:15509818
    reference_title: Clinical features and prognostic factors in adults with bacterial meningitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In adults presenting with community-acquired acute bacterial meningitis,
      the sensitivity of the classic triad of fever, neck stiffness, and altered
      mental status is low, but almost all present with at least two of the four
      symptoms of headache, fever, neck stiffness, and altered mental status.
    explanation: >-
      Supports headache as a frequent feature in the adult acute
      bacterial-meningitis syndrome.
- name: Sensorineural hearing impairment
  phenotype_term:
    preferred_term: Sensorineural hearing impairment
    term:
      id: HP:0000407
      label: Sensorineural hearing impairment
  evidence:
  - reference: PMID:21779197
    reference_title: Streptococcus suis meningitis with bilateral sensorineural hearing loss.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Even after receiving antibiotic treatment, patients with S. suis infection
      frequently show complications such as hearing impairment and vestibular
      dysfunction.
    explanation: >-
      Supports hearing impairment as a common complication in the S. suis branch
      of streptococcal meningitis.
  - reference: PMID:19275779
    reference_title: Hearing and vestibular loss in Streptococcus suis infection from swine and traditional raw pork exposure in northern Thailand.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Permanent hearing loss and vestibular impairment occur frequently in
      persons surviving meningitis caused by Streptococcus suis.
    explanation: >-
      Establishes the persistence of the post-meningitic hearing deficit after
      S. suis meningitis.
diagnosis:
- name: CSF analysis and culture
  description: >-
    Lumbar puncture for CSF analysis (neutrophilic pleocytosis, low glucose,
    raised protein) with Gram stain and culture is the defining diagnostic act;
    a normal CSF cell count does not exclude bacterial meningitis.
  evidence:
  - reference: PMID:39230218
    reference_title: DECODING PEDIATRIC MENINGITIS UNRAVELING THE INTRICACIES OF ANTIMICROBIAL RESISTANCE IN IRAQI PEDIATRIC PATIENTS.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A probable case of bacterial meningitis was determined by leukocytosis
      (>100 cells/mm 3), turbidity, decreased glucose (<40 mg/dl), and raised
      protein levels (>100 mg/dl), which provided enough evidence to start
      antibiotic regimen.
    explanation: >-
      Gives the CSF criteria (pleocytosis, low glucose, raised protein) used to
      diagnose bacterial meningitis and start therapy.
  - reference: PMID:33591075
    reference_title: "Bacterial Meningitis in the Absence of Pleocytosis in Children: A Systematic Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      children with culture- or polymerase chain reaction-proven bacterial
      meningitis in the absence of pleocytosis
    explanation: >-
      A systematic review documents culture/PCR-proven bacterial meningitis
      without CSF pleocytosis, so a normal cell count does not exclude it.
prevalence:
- population: Worldwide (all-cause meningitis; S. pneumoniae a leading cause)
  measure_type: ANNUAL_INCIDENCE
  rate_denominator: POPULATION_PER_YEAR
  notes: >-
    GBD 2023 estimated 259 000 global meningitis deaths and 2.54 million
    incident cases in 2023, with children under 5 accounting for more than a
    third of deaths and Streptococcus pneumoniae among the leading causes. The
    figures are all-cause meningitis, not streptococcal-specific, so they bound
    rather than measure this entry's burden.
  evidence:
  - reference: PMID:41911930
    reference_title: "Global, regional, and national burden of meningitis, its risk factors, and aetiologies, 1990-2023: a systematic analysis for the Global Burden of Disease Study 2023."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 2023, there were 259 000 (95% uncertainty interval 202 000-335 000)
      global deaths
    explanation: >-
      Quantifies the global all-cause meningitis death burden within which
      S. pneumoniae is a leading cause; the figure is not streptococcal-specific,
      so it is indirect for this entry.
treatments:
- name: Empiric antibacterial therapy
  description: >-
    Urgent age- and resistance-adjusted bactericidal antibiotics treat
    streptococcal meningitis by stopping Streptococcus replication in
    cerebrospinal fluid.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: ceftriaxone
      term:
        id: CHEBI:29007
        label: ceftriaxone
    - preferred_term: vancomycin
      term:
        id: CHEBI:28001
        label: vancomycin
  evidence:
  - reference: PMID:42202671
    reference_title: "Pneumococcal meningitis in children and adults before and after implementation of PCV13 into national pediatric immunization program: A cohort study in Taiwan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      most of the isolates being resistant to penicillin and ceftriaxone but
      susceptible to vancomycin
    explanation: >-
      Grounds the empiric ceftriaxone-plus-vancomycin regimen: vancomycin is
      added because resistant pneumococci remain susceptible to it.
  - reference: PMID:28478238
    reference_title: "Update on community-acquired bacterial meningitis: guidance and challenges."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      The ESCMID guideline advises to start empiric treatment within one hour of
      arrival in all suspected meningitis cases, and choice of antibiotics needs
      to be differentiated according to the patient's age, risk factors, and
      local resistance rates of pneumococci.
    explanation: >-
      Summarizes guideline advice to begin empiric antibacterial therapy within
      one hour and tailor the regimen to age, risk factors, and pneumococcal
      resistance.
  target_mechanisms:
  - target: Streptococcal CSF Replication
    treatment_effect: INHIBITS
    description: >-
      Bactericidal antibiotics kill Streptococcus organisms that are replicating
      in the cerebrospinal fluid.
- name: Adjunctive dexamethasone
  description: >-
    Dexamethasone is given with empiric antibiotics to dampen the host
    inflammatory burst that follows bacterial killing in acute meningitis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dexamethasone
      term:
        id: CHEBI:41879
        label: dexamethasone
  evidence:
  - reference: PMID:28478238
    reference_title: "Update on community-acquired bacterial meningitis: guidance and challenges."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Dexamethasone is the only proven adjunctive treatment and should be started
      together with the antibiotics.
    explanation: >-
      States the timing and evidence status of dexamethasone as an adjunct to
      antibacterial therapy in acute bacterial meningitis.
  target_mechanisms:
  - target: TLR-MMP Neutrophilic Meningeal Inflammation
    treatment_effect: INHIBITS
    description: >-
      Corticosteroid treatment suppresses the downstream inflammatory cascade
      that produces neurologic and auditory injury.
- name: Pneumococcal conjugate vaccination
  description: >-
    Pneumococcal conjugate vaccines (PCV10/PCV13) induce anti-capsular antibody
    and prevent invasive pneumococcal disease; they reduced pneumococcal
    meningitis in young children by 48-74%.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: Vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  target_mechanisms:
  - target: Mucosal or zoonotic Streptococcus invasion
    treatment_effect: INHIBITS
    description: >-
      Vaccine-induced anti-capsular antibody prevents invasive pneumococcal
      disease, reducing meningitis incidence.
  evidence:
  - reference: PMID:39864526
    reference_title: "Global impact of 10- and 13-valent pneumococcal conjugate vaccines on pneumococcal meningitis in all ages: The PSERENADE project."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six years after PCV10/PCV13 introduction, pneumococcal meningitis declined
      48-74% across products and PCV7 impact strata for children
    explanation: >-
      Quantifies the reduction in pneumococcal meningitis in young children after
      PCV introduction.
- name: Maternal intrapartum antibiotic prophylaxis for group B Streptococcus
  description: >-
    Antenatal GBS screening with intrapartum antibiotic prophylaxis is the
    defining primary prevention for the neonatal GBS stratum, reducing
    early-onset GBS disease and its mortality versus no strategy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
  target_mechanisms:
  - target: Mucosal or zoonotic Streptococcus invasion
    treatment_effect: INHIBITS
    description: >-
      Intrapartum antibiotics suppress maternal-to-neonatal GBS transmission and
      the colonization step that precedes invasive neonatal disease.
  evidence:
  - reference: PMID:42060466
    reference_title: "Benefits and Harms of Antenatal/Intrapartum Screening for Maternal Group B Streptococcus and Use of Intrapartum Antibiotic Prophylaxis Versus Risk-Based Protocols or No Intervention: A Rapid Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Any prevention strategy reduces the incidence of EOGBS, all-cause EOS and
      EOGBS-related mortality compared to no strategy
    explanation: >-
      Supports screening-plus-intrapartum-prophylaxis as effective primary
      prevention of early-onset GBS disease, including GBS meningitis, versus no
      intervention.
animal_models:
- name: Infant rat pneumococcal meningitis
  species: Rat
  description: >-
    Intracisternal pneumococcal meningitis in infant rats models CSF
    inflammation and lets TLR2-linked pleocytosis, TNF-alpha, and MMP-9 be
    measured.
  evidence:
  - reference: PMID:19012971
    reference_title: Effects of Toll-like receptor 2 agonist Pam(3)CysSK(4) on inflammation and brain damage in experimental pneumococcal meningitis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      TLR2 signaling participates in the pathogenesis of pneumococcal
      meningitis.
    explanation: >-
      Uses an infant-rat pneumococcal meningitis system to test how TLR2
      stimulation affects CSF inflammation.
  modeled_mechanisms:
  - target: TLR-MMP Neutrophilic Meningeal Inflammation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      The infant-rat pneumococcal meningitis model reproduces the CSF
      neutrophilic inflammation, TNF-alpha and MMP-9 response of this node.
- name: Adult Wistar rat pneumococcal meningitis
  species: Rat
  description: >-
    Cisterna-magna inoculation of adult Wistar rats with Streptococcus
    pneumoniae models blood-brain-barrier breakdown and memory impairment after
    pneumococcal meningitis.
  evidence:
  - reference: PMID:24419461
    reference_title: Inhibition of matrix metalloproteinases-2 and -9 prevents cognitive impairment induced by pneumococcal meningitis in Wistar rats.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The animals underwent a magna cistern tap and received either 10 µL sterile
      saline as a placebo or an equivalent volume of a Streptococcus pneumoniae
      suspension at a concentration of 5 × 10(9)cfu/mL.
    explanation: >-
      Documents cisterna-magna delivery of S. pneumoniae in the Wistar-rat
      meningitis model.
  modeled_mechanisms:
  - target: Streptococcal CNS Injury
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      The adult Wistar-rat model reproduces the blood-brain-barrier breakdown
      and cognitive morbidity of the CNS-injury node, but not its auditory or
      vascular branches.

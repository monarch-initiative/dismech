genetic:
- name: SMARCA2
  gene_term:
    preferred_term: SMARCA2
    term:
      id: hgnc:11098
      label: SMARCA2
  association: Causal - de novo non-truncating variants clustered in the ATPase region
  relationship_type: CAUSATIVE
  variant_origin: DE_NOVO
  presence: Positive
  notes: >-
    SMARCA2 is at 9p24.3 and encodes BRM, one of the two alternative catalytic
    ATPase subunits of the BAF (SWI/SNF) chromatin-remodelling complex. The
    NCBRS-causing allele class is narrow and mechanistically specific: heterozygous
    de novo NON-TRUNCATING (missense and in-frame) variants clustered within
    ultra-conserved motifs of the catalytic ATPase region, thought to act by a
    dominant-negative effect on ATPase activity while leaving complex assembly
    intact. This is why NCBRS is not a SMARCA2 haploinsufficiency disorder and why
    it is distinguishable from the other SMARCA2 conditions: variants clustered
    OUTSIDE the helicase domains cause a separate blepharophimosis-intellectual
    disability syndrome, and SMARCA2 is separately listed among the BAF genes
    mutated in Coffin-Siris syndrome. Tentative genotype-phenotype correlations
    within NCBRS (domain VI variants with severe intellectual disability and
    seizures; Pro883, Leu946 and Ala1201 with milder phenotypes) are reported but
    the authors caution the numbers remain too small to be definitive.
  evidence:
  - reference: PMID:25169058
    reference_title: "Phenotype and genotype in Nicolaides-Baraitser syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "caused by non-truncating mutations in the ATPase region of SMARCA2, which codes for one of the two alternative catalytic subunits of the BAF chromatin remodeling complex"
    explanation: States the defining non-truncating, ATPase-region-restricted allele class that separates NCBRS from the other SMARCA2 disorders.
  - reference: PMID:22366787
    reference_title: "Heterozygous missense mutations in SMARCA2 cause Nicolaides-Baraitser syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We sequenced the exomes of ten individuals with NBS and identified heterozygous variants in SMARCA2 in eight of them. Extended molecular screening identified nonsynonymous SMARCA2 mutations in 36 of 44 individuals with NBS"
    explanation: The gene-discovery study establishing SMARCA2 as the cause, with a high diagnostic yield (36/44) in clinically defined NCBRS.
  - reference: PMID:25169058
    reference_title: "Phenotype and genotype in Nicolaides-Baraitser syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "There may be some genotype-phenotype correlations (mutations at domain VI with severe ID and seizures; mutations affecting residues Pro883, Leu946, and Ala1201 with mild phenotypes) but numbers are still too small to draw definitive conclusions."
    explanation: The intra-NCBRS genotype-phenotype correlations are explicitly qualified by the authors as based on too few cases, so they are curated as partial support.
  - reference: PMID:32694869
    reference_title: "De novo SMARCA2 variants clustered outside the helicase domain cause a new recognizable syndrome with intellectual disability and blepharophimosis distinct from Nicolaides-Baraitser syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SMARCA2 variants outside the helicase domains, phenotypically and molecularly distinct from NCBRS."
    explanation: Establishes that SMARCA2 variants outside the helicase domains cause a phenotypically and molecularly distinct entity, which is the basis for this entry's scope boundary.
diagnosis:
- name: Molecular Genetic Testing for SMARCA2
  description: >-
    The diagnosis is established by identifying a heterozygous pathogenic SMARCA2
    variant in an individual with suggestive findings. Because NCBRS and
    Coffin-Siris syndrome overlap clinically and both arise from BAF-complex
    genes, a one-step panel covering all six BAF-complex genes is an efficient
    testing strategy, and the specific facial features are the major diagnostic
    handle at the bedside.
  presence: Positive in affected individuals
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:26468571
    reference_title: "SMARCA2-Related Nicolaides-Baraitser Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of SMARCA2-NCBRS is established in a proband with suggestive findings and a heterozygous SMARCA2 pathogenic variant identified by molecular genetic testing."
    explanation: GeneReviews states the molecular diagnostic criterion.
  - reference: PMID:25249037
    reference_title: "Coffin-Siris and Nicolaides-Baraitser syndromes are a common well recognizable cause of intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given the high frequency of the condition we set up a one-step deep sequencing test for all 6 genes of the BAF complex."
    explanation: Supports a combined BAF-complex panel as the practical testing strategy given the NCBRS/Coffin-Siris overlap.
  - reference: PMID:25249037
    reference_title: "Coffin-Siris and Nicolaides-Baraitser syndromes are a common well recognizable cause of intellectual disability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the specific facial features being the major diagnostic handle"
    explanation: Identifies the facial gestalt as the clinical trigger for molecular testing.
- name: DNA Methylation Episignature
  description: >-
    Genome-wide DNA methylation profiling of whole blood yields an NCBRS-specific
    signature of 429 differentially methylated CpG sites. A classifier built on
    that signature achieved 100% sensitivity and specificity in an independent
    validation cohort and reclassified SMARCA2 variants of uncertain significance
    concordantly with the clinical phenotype, making it a practical adjunct for
    VUS interpretation.
  presence: Distinct signature in affected individuals
  diagnosis_term:
    preferred_term: DNA methylation analysis
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:31288860
    reference_title: "New insights into DNA methylation signatures: SMARCA2 variants in Nicolaides-Baraitser syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Differential methylated CpGs between groups (DNAm signature) were identified and used to generate a model enabling classification variants of uncertain significance (VUS; n = 9) in SMARCA2 as \"pathogenic\" or \"benign\"."
    explanation: Describes the episignature classifier and its intended use for SMARCA2 VUS reclassification.
  - reference: PMID:31288860
    reference_title: "New insights into DNA methylation signatures: SMARCA2 variants in Nicolaides-Baraitser syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A validation cohort of NCBRS cases (n = 8) and controls (n = 96) demonstrated 100% model sensitivity and specificity."
    explanation: Quantifies classifier performance in an independent validation cohort.
differential_diagnoses:
- name: Coffin-Siris Syndrome
  description: >-
    The principal differential and the closest relative. Both are BAFopathies with
    overlapping features - intellectual disability, sparse hair, low frontal
    hairline, large mouth with thick everted lips, and hand and foot anomalies -
    and SMARCA2 is itself listed among the BAF-complex genes mutated in
    Coffin-Siris syndrome. They remain distinct entities: NCBRS is caused
    specifically by non-truncating variants clustered in the SMARCA2 ATPase region
    acting dominant-negatively, and is clinically and genetically homogeneous,
    whereas Coffin-Siris is genetically heterogeneous across six BAF genes and its
    hallmark is hypoplasia of the fifth digit nail/phalanx. Curated separately in
    dismech as `Coffin_Siris_Syndrome`.
- name: SMARCA2 Blepharophimosis-Intellectual Disability Syndrome
  description: >-
    Allelic but distinct. De novo SMARCA2 variants clustered OUTSIDE the helicase
    domains cause a recognisable syndrome of intellectual disability with
    blepharophimosis that is explicitly reported as phenotypically and molecularly
    distinct from NCBRS. Variant position within SMARCA2 is the discriminator, and
    the separation is now corroborated at the epigenetic level: BIS carries its own
    episignature, which it shares with truncating-ADNP Helsmoortel-Van der Aa
    syndrome rather than with NCBRS.
  distinguishing_features:
  - Location of the SMARCA2 variant - inside the ATPase/helicase region in NCBRS,
    outside it in BIS.
  - Blepharophimosis is the recognisable facial cue in BIS and is not part of the
    NCBRS gestalt.
  - The DNA methylation episignature differs; BIS clusters with truncating-ADNP
    Helsmoortel-Van der Aa syndrome, not with NCBRS.
  evidence:
  - reference: PMID:38884529
    reference_title: "Blepharophimosis with intellectual disability and Helsmoortel-Van Der Aa Syndrome share episignature and phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Blepharophimosis with intellectual disability (BIS) is a recently recognized disorder distinct from Nicolaides-Baraister syndrome that presents with distinct facial features of blepharophimosis, developmental delay, and intellectual disability. BIS is caused by pathogenic variants in SMARCA2"
    explanation: A 2024 study states explicitly that BIS is a SMARCA2-related disorder distinct from NCBRS, which is the basis for keeping the two as separate entities.
  - reference: PMID:38884529
    reference_title: "Blepharophimosis with intellectual disability and Helsmoortel-Van Der Aa Syndrome share episignature and phenotype."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A distinct episignature was shared by 15 individuals with BIS-causing SMARCA2 pathogenic variants and 12 individuals with class II HVDAS caused by truncating pathogenic ADNP variants."
    explanation: Independent epigenetic corroboration of the split - the BIS methylation signature aligns with truncating-ADNP HVDAS rather than with the NCBRS signature, so episignature testing discriminates the two SMARCA2 phenotypes.
- name: Cornelia de Lange Syndrome
  description: >-
    Shares intellectual disability, growth restriction, distinctive facies with
    thick eyebrows and long eyelashes, and limb/digit anomalies; distinguished
    molecularly (NIPBL and cohesin-complex genes).
- name: Other BAFopathies
  description: >-
    The wider BAF-complex disorder group (ARID1A, ARID1B, SMARCB1, SMARCA4,
    SMARCE1, DPF2) overlaps clinically; a combined BAF-gene panel is the efficient
    diagnostic approach rather than sequential single-gene testing.

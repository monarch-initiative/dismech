discussions:
- discussion_id: ncbrs_dominant_negative_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is the dominant-negative, assembly-intact/ATPase-dead model of NCBRS
    SMARCA2 variants correct, and does it explain why non-truncating variants
    cause NCBRS while truncating variants do not?
  attaches_to:
  - pathophysiology#Dominant-Negative Impairment of BAF Complex ATPase Activity
  rationale: >-
    The dominant-negative model is the load-bearing mechanistic claim of this
    disorder - it explains the allelic specificity, separates NCBRS from
    SMARCA2 haploinsufficiency, and would determine what a targeted therapy
    would have to do. But it rests on inference rather than demonstration: the
    original report states the variants "likely do not impair SWI/SNF complex
    assembly but may be associated with disrupted ATPase activity", and the
    61-patient analysis states they are "likely to act through a
    dominant-negative effect". The one direct functional test in an isogenic human
    system (NCBRS K755R and R1159Q knock-in hESCs) did not measure ATPase activity
    or complex assembly; what it found instead was INCREASED mutant SMARCA2
    chromatin binding with global retargeting of SMARCA4, loss of SOX3-dependent
    neural enhancers, and emergence of astrocyte-specific de novo enhancers - a
    picture more consistent with altered targeting than with a catalytically dead
    subunit. So the two models are not yet distinguished: no published work
    measures BAF assembly and nucleosome-stimulated ATPase activity for a panel of
    NCBRS patient variants, and the DNA methylation signature, while showing that
    the variants perturb chromatin-dependent transcription, cannot separate
    dominant-negative from redistribution at the protein level.
  proposed_experiments:
  - experiment_id: ncbrs_baf_assembly_atpase_panel
    name: Biochemical panel of NCBRS variants for assembly and ATPase activity
    description: >-
      Express a panel of recurrent NCBRS SMARCA2 variants and measure BAF complex
      assembly (co-immunoprecipitation, size-exclusion) and nucleosome-stimulated
      ATPase and remodelling activity in parallel, alongside truncating alleles as
      a loss-of-function comparator.
    decision_criterion: >-
      Intact assembly with abolished ATPase activity would confirm the
      dominant-negative model; reduced assembly would reframe NCBRS as a
      complex-destabilising disorder instead.
  - experiment_id: ncbrs_isogenic_allele_class_comparison
    name: Isogenic comparison of non-truncating versus truncating SMARCA2 alleles
    description: >-
      Extend the existing isogenic NCBRS knock-in hESC system with a SMARCA2
      truncating allele and a heterozygous deletion, and compare SMARCA4
      retargeting, enhancer reorganisation, neural-progenitor differentiation and
      the DNA methylation signature across the three allele classes.
    decision_criterion: >-
      If only the non-truncating allele produces SMARCA4 retargeting and the NCBRS
      methylation signature, the allele-class boundary is explained by the
      redistribution model; if the truncating allele produces the same signature,
      the boundary must be explained some other way.
  evidence:
  - reference: PMID:22366787
    reference_title: "Heterozygous missense mutations in SMARCA2 cause Nicolaides-Baraitser syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "These alterations likely do not impair SWI/SNF complex assembly but may be associated with disrupted ATPase activity."
    explanation: The hedged wording of the original report is the substance of this gap - the mechanism is predicted, not measured.
  - reference: PMID:25169058
    reference_title: "Phenotype and genotype in Nicolaides-Baraitser syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "SMARCA2 mutations causing NCBRS are likely to act through a dominant-negative effect."
    explanation: The largest phenotype-genotype analysis also states the mechanism as a likelihood rather than a demonstrated result.
  - reference: PMID:31375262
    reference_title: "Heterozygous Mutations in SMARCA2 Reprogram the Enhancer Landscape by Global Retargeting of SMARCA4."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Together, our results demonstrate that SMARCA2 mutations cause impaired differentiation through enhancer reprogramming via inappropriate targeting of SMARCA4."
    explanation: The competing model - enhancer reprogramming via SMARCA4 mis-targeting - is demonstrated in isogenic human cells, which is why this entry does not assert the dominant-negative ATPase model as settled.

name: Nicolaides-Baraitser Syndrome
creation_date: "2026-07-31T00:00:00Z"
description: >-
  Nicolaides-Baraitser syndrome (NCBRS; intellectual disability-sparse
  hair-brachydactyly syndrome; OMIM 601358) is an autosomal dominant
  intellectual-disability/multiple-congenital-anomaly syndrome caused by de novo
  NON-TRUNCATING (missense and in-frame) variants clustered in the ATPase region
  of SMARCA2 at 9p24.3. SMARCA2 (BRM) is one of the two alternative catalytic
  ATPase subunits of the BAF (SWI/SNF) ATP-dependent chromatin-remodelling
  complex. The cardinal features - intellectual disability, short stature,
  microcephaly, a characteristic coarse face, sparse scalp hair, brachydactyly
  with prominent interphalangeal joints and prominent distal phalanges,
  behavioural problems and seizures - are described in the defining 61-patient
  analysis as almost universally present, though that summary sentence covers nine
  features at once and individual frequencies vary (short stature, for example, is
  quantified separately at about half). Developmental
  delay is severe in nearly half of affected individuals, and nearly a third never
  develop speech. Seizures are frequently difficult to treat and developmental
  regression has been observed with seizure onset. Radiographic hallmarks include
  cone-shaped epiphyses and shortening of the phalanges, metacarpals and
  metatarsals. The disorder is clinically and genetically homogeneous, and the
  variants are thought to act by a dominant-negative mechanism on ATPase activity
  rather than by haploinsufficiency.
category: Mendelian
parents:
- Neurodevelopmental Disorder
- Syndromic Intellectual Disability
- BAFopathy
notes: >-
  Scope and disambiguation - this is the most important framing decision in this
  entry, because SMARCA2 sits at the intersection of three distinct entities.
  1. Coffin-Siris syndrome. SMARCA2 is listed among the BAF-complex genes
  mutated in Coffin-Siris syndrome, and dismech already has a
  `Coffin_Siris_Syndrome` entry (curated on ARID1B) that names SMARCA2 in its
  gene list. NCBRS is nonetheless a separate entity, not a Coffin-Siris subtype:
  the two are clinically overlapping but distinguishable, the NCBRS-causing
  SMARCA2 alleles are specifically NON-TRUNCATING variants clustered in the
  ATPase region acting dominant-negatively, and NCBRS is clinically and
  genetically homogeneous in a way Coffin-Siris is not. The entries are
  cross-referenced under `differential_diagnoses` without duplicating the
  Coffin-Siris content or contradicting it.
  2. SMARCA2 blepharophimosis-intellectual disability syndrome. De novo SMARCA2
  variants clustered OUTSIDE the helicase/ATPase domains cause a different,
  recognisable syndrome with intellectual disability and blepharophimosis that is
  explicitly reported as phenotypically and molecularly distinct from NCBRS. That
  entity is out of scope here and is recorded as a differential.
  3. SMARCA2 in cancer. SMARCA2/BRM loss is extensively studied as a
  tumour-suppressor and synthetic-lethal target in SMARCA4-deficient cancers.
  That literature is mechanistically unrelated to the germline non-truncating
  NCBRS alleles and was excluded.
  Module conformance. No module in kb/modules/ captures a BAF/chromatin-remodelling
  developmental chain. `epilepsy_excitation_inhibition_imbalance` was evaluated
  and declined: NCBRS epilepsy is described in the primary literature as "rather
  genetic than structural" but no excitation/inhibition-imbalance chain has been
  curated for SMARCA2, so declaring conformance would assert a mechanism the
  evidence does not establish.
  Unquotable phenotype gaps (SOP section 4, Option A). The deep-research report
  supplies Sousa 2014 full-text denominators for five phenotypes above the 10%
  threshold. Three of them - feeding difficulties (23/49), eczematous dermatitis
  (22/58) and hypotonia (19/51) - are now curated above as phenotype entries from
  quotable NCBRS-specific sources, but WITHOUT frequency bands: the denominators
  themselves are not quotable, so asserting a band would be unsupported
  (evidence-guidelines Pattern D). Two remain uncurated because no quotable
  source for them exists at all: non-scalp hypertrichosis 22/50 (44%,
  HP:0000998) and frequent infections 13/48 (27.1%, HP:0002719). Sousa 2014
  (PMID:25169058) is cached abstract-only and its abstract contains neither
  figure; the GeneReviews chapter (PMID:26468571) mentions neither feature; a
  sweep of all 82 PubMed records tagged Nicolaides-Baraitser and an Europe PMC
  open-access query found only Coffin-Siris-specific statements of hypertrichosis
  and frequent infections, plus one mixed SWI/SNF cohort (PMID:34706719,
  hypertrichosis 8/12) containing a single NCBRS patient, none of which can be
  attributed to NCBRS; and the Orphanet route the reviewer proposed remains
  unavailable because Orphadata upstream has drifted from the sha256 pinned in
  `data/orphadata/MANIFEST.yaml`, so `just refresh-orphadata` still fails its
  checksum gate (observed sha256 df8d562a... vs pinned fb2fbe8c...) and
  `ORPHA_3051.md` cannot be regenerated - and hand-writing a cache file is
  forbidden. Note that a rebuilt file would also be stamped with the manifest's
  `2025-12-09` snapshot date while being derived from a different snapshot, so
  bypassing the gate would put false provenance into the cache. Re-adding the two
  remaining phenotypes (with their bands) becomes a mechanical follow-up as soon
  as the Orphadata manifest is re-pinned repo-wide.

    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "helps to treat epilepsy in NCBRS that mostly shows only initial response to anticonvulsive therapy, especially with LEV and VPA, but very rarely shows complete freedom of seizures in this, rather genetic than structural epilepsy"
    explanation: States both the partial benefit and the low rate of seizure freedom, which is why this treatment is curated as partial rather than full support.

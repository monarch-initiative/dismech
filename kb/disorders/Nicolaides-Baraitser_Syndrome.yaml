prevalence:
- population: Published molecularly confirmed individuals worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    61 molecularly confirmed individuals had been assembled by 2014, comprising
    all 47 previously reported patients plus 14 unpublished. The disorder was
    described as very rare before the molecular cause was identified.
  evidence:
  - reference: PMID:25169058
    reference_title: "Phenotype and genotype in Nicolaides-Baraitser syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We analyzed 61 molecularly confirmed cases, including all previously reported patients (n = 47) and 14 additional unpublished individuals."
    explanation: Quantifies the complete published molecularly confirmed caseload as of 2014, supporting an ultra-rare classification.
- population: Italian intellectual disability cohort (1161 individuals, three centres)
  measure_type: UNKNOWN
  prevalence_class: UNKNOWN
  notes: >-
    Not a population prevalence. In a clinically ascertained intellectual
    disability cohort, NCBRS plus Coffin-Siris syndrome together were molecularly
    confirmed in 11 of 1161 individuals, of whom 8 had SMARCA2 missense variants.
    The authors conclude the combined frequency of these BAFopathies among people
    with intellectual disability may be as high as about 1%.
  evidence:
  - reference: PMID:25249037
    reference_title: "Coffin-Siris and Nicolaides-Baraitser syndromes are a common well recognizable cause of intellectual disability."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "A strong clinical suspicion of either Nicolaides-Baraitser syndrome or Coffin-Siris syndrome was proposed in 11 cases who were then molecularly confirmed: 8 having de novo missense mutations in SMARCA2, two frame-shift mutations in ARID1B and one missense mutation in SMARCB1."
    explanation: Quantifies the NCBRS yield within an ascertained intellectual disability cohort. Curated as PARTIAL because the reported figure aggregates NCBRS with Coffin-Siris syndrome and is conditioned on clinical suspicion, so it is not an NCBRS-specific population rate.
inheritance:
- name: Autosomal dominant, de novo
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  expressivity: VARIABLE
  description: >-
    NCBRS is autosomal dominant and essentially always results from a de novo
    SMARCA2 variant; variants were confirmed de novo wherever parental samples
    were available in the defining cohort. GeneReviews states that the risk to
    other family members is presumed to be low; gonadal mosaicism has not been
    quantified in this disorder and cannot be formally excluded, so recurrence
    risk is best described as low rather than zero.
  evidence:
  - reference: PMID:22366787
    reference_title: "Heterozygous missense mutations in SMARCA2 cause Nicolaides-Baraitser syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Extended molecular screening identified nonsynonymous SMARCA2 mutations in 36 of 44 individuals with NBS; these mutations were confirmed to be de novo when parental samples were available."
    explanation: Establishes the de novo origin of the SMARCA2 variants across the defining cohort.
  - reference: PMID:26468571
    reference_title: "SMARCA2-Related Nicolaides-Baraitser Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SMARCA2-NCBRS is expressed in an autosomal dominant manner and typically caused by a de novo SMARCA2 pathogenic variant; the risk to other family members is presumed to be low."
    explanation: The GeneReviews Genetic Counseling statement, giving both the mode of inheritance and the recurrence-risk framing used in this block.
  - reference: PMID:35762114
    reference_title: "Ophthalmologic and facial abnormalities of Nicolaides-Baraitser syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nicolaides-Baraitser syndrome (NCBRS), first described in 1993, is a rare autosomal dominant disease caused by pathogenic variants in the SMARCA2 gene on chromosome 9p24.3."
    explanation: States the autosomal dominant inheritance and the SMARCA2 locus at 9p24.3.
pathophysiology:
- name: Non-Truncating SMARCA2 Variants Clustered in the ATPase Region
  biological_scale: MOLECULAR
  description: >-
    The NCBRS-causing alleles are a tightly constrained class: heterozygous
    non-truncating (missense and in-frame) variants clustered within sequences
    encoding ultra-conserved motifs of the catalytic ATPase region of SMARCA2.
    This allelic specificity is what separates NCBRS from the other SMARCA2
    disorders - truncating alleles do not produce NCBRS, and variants clustered
    outside the helicase domains cause a different blepharophimosis syndrome.
    Independent support comes from DNA methylation signature work, in which
    variants of uncertain significance falling within the ATPase/helicase domain
    classified as pathogenic while a variant distal to that domain did not.
  genes:
  - preferred_term: SMARCA2
    term:
      id: hgnc:11098
      label: SMARCA2
  downstream:
  - target: Dominant-Negative Impairment of BAF Complex ATPase Activity
    causal_link_type: DIRECT
    description: >-
      Variants in the ultra-conserved ATPase motifs are predicted to leave complex
      assembly intact while disrupting catalytic activity.
  evidence:
  - reference: PMID:22366787
    reference_title: "Heterozygous missense mutations in SMARCA2 cause Nicolaides-Baraitser syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutations cluster within sequences that encode ultra-conserved motifs in the catalytic ATPase region of the protein."
    explanation: Establishes the defining positional clustering of NCBRS variants within the catalytic ATPase region.
  - reference: PMID:25169058
    reference_title: "Phenotype and genotype in Nicolaides-Baraitser syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nicolaides-Baraitser syndrome (NCBRS) is an intellectual disability (ID)/multiple congenital anomalies syndrome caused by non-truncating mutations in the ATPase region of SMARCA2, which codes for one of the two alternative catalytic subunits of the BAF chromatin remodeling complex."
    explanation: States the non-truncating, ATPase-region-restricted allele class that defines NCBRS and identifies SMARCA2 as an alternative catalytic BAF subunit.
  - reference: PMID:31288860
    reference_title: "New insights into DNA methylation signatures: SMARCA2 variants in Nicolaides-Baraitser syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNAm model classifications of VUS were concordant with the clinical phenotype; those within the SMARCA2 ATPase/helicase domain classified as \"pathogenic\"."
    explanation: An orthogonal epigenomic classifier independently confirms that pathogenicity tracks with location inside the ATPase/helicase domain.
- name: Dominant-Negative Impairment of BAF Complex ATPase Activity
  biological_scale: MOLECULAR
  description: >-
    SMARCA2 is one of the two mutually exclusive alternative catalytic ATPases
    (with SMARCA4) of the SWI/SNF (BAF) ATP-dependent chromatin remodelling
    complex. The NCBRS variants are predicted not to impair
    SWI/SNF complex assembly but to disrupt ATPase activity, so a catalytically
    dead subunit is incorporated into otherwise intact complexes. This is the
    basis for the dominant-negative interpretation and is why NCBRS is not a
    haploinsufficiency disorder - a distinction with direct diagnostic
    consequences, since truncating SMARCA2 alleles do not cause this phenotype.
    An important qualification: the only direct functional test of NCBRS alleles in
    an isogenic human system found INCREASED mutant SMARCA2 chromatin binding with
    global retargeting of the alternative ATPase SMARCA4, which is a
    redistribution-of-targeting effect rather than a straightforwardly
    catalytically-dead subunit. The dominant-negative label is therefore retained
    as the field's working description but not asserted as established; see
    `discussions`.
  molecular_functions:
  - preferred_term: ATP-dependent chromatin remodeler activity
    term:
      id: GO:0140658
      label: ATP-dependent chromatin remodeler activity
    modifier: DECREASED
  - preferred_term: ATP hydrolysis activity
    term:
      id: GO:0016887
      label: ATP hydrolysis activity
    modifier: DECREASED
  downstream:
  - target: Disrupted Chromatin Remodelling and Transcriptional Programs
    causal_link_type: DIRECT
    description: >-
      Loss of catalytic activity within assembled BAF complexes degrades
      nucleosome remodelling and the transcriptional programs that depend on it.
  evidence:
  - reference: PMID:22366787
    reference_title: "Heterozygous missense mutations in SMARCA2 cause Nicolaides-Baraitser syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SMARCA2 encodes the core catalytic unit of the SWI/SNF ATP-dependent chromatin remodeling complex that is involved in the regulation of gene transcription."
    explanation: Establishes SMARCA2's identity as the catalytic ATPase of the SWI/SNF chromatin remodelling complex.
  - reference: PMID:22366787
    reference_title: "Heterozygous missense mutations in SMARCA2 cause Nicolaides-Baraitser syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "These alterations likely do not impair SWI/SNF complex assembly but may be associated with disrupted ATPase activity."
    explanation: The assembly-intact, ATPase-disrupted interpretation is stated by the authors as a prediction ("likely", "may be"), not a demonstrated biochemical result, so it is curated as partial support.
  - reference: PMID:25169058
    reference_title: "Phenotype and genotype in Nicolaides-Baraitser syndrome."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "SMARCA2 mutations causing NCBRS are likely to act through a dominant-negative effect."
    explanation: The dominant-negative mechanism is inferred from the allelic pattern rather than demonstrated functionally, which is why this node's mechanism claims are curated as partial.
  - reference: PMID:31375262
    reference_title: "Heterozygous Mutations in SMARCA2 Reprogram the Enhancer Landscape by Global Retargeting of SMARCA4."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Changes in chromatin accessibility at enhancers were associated with an increase in SMARCA2 binding and retargeting of SMARCA4."
    explanation: Isogenic hESC knock-ins of NCBRS alleles show INCREASED mutant SMARCA2 binding with retargeting of the alternative ATPase SMARCA4 - a redistribution-of-targeting effect rather than a simple catalytically-dead subunit, which is why the dominant-negative model is curated as an open question rather than as settled.
- name: Disrupted Chromatin Remodelling and Transcriptional Programs
  biological_scale: MOLECULAR
  description: >-
    BAF-dependent nucleosome remodelling controls the accessibility of
    developmental gene programs. In NCBRS the downstream consequence is measurable
    as a genome-wide DNA methylation signature: 429 differentially methylated CpG
    sites distinguish affected individuals from controls, and the genes those
    sites map to are involved in cell differentiation, calcium signalling and
    neuronal function - consistent with the disorder's neurodevelopmental and
    multisystem phenotype. The signature is sufficiently specific to classify
    variants of uncertain significance with 100% sensitivity and specificity in a
    validation cohort, so it is both a mechanistic readout and a diagnostic tool.
  biological_processes:
  - preferred_term: chromatin remodeling
    term:
      id: GO:0006338
      label: chromatin remodeling
    modifier: DECREASED
  - preferred_term: regulation of DNA-templated transcription
    term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
    modifier: ABNORMAL
  downstream:
  - target: Impaired Neurodevelopment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Dysregulated differentiation, calcium-signalling and neuronal-function gene
      programs impair neurodevelopment.
  - target: Impaired Ectodermal and Skeletal Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The same chromatin-level lesion perturbs hair-follicle and skeletal
      developmental programs, producing the sparse hair and brachydactyly.
  evidence:
  - reference: PMID:31288860
    reference_title: "New insights into DNA methylation signatures: SMARCA2 variants in Nicolaides-Baraitser syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a DNAm signature of 429 differentially methylated CpG sites in individuals with NCBRS. The genes to which these CpG sites map are involved in cell differentiation, calcium signaling, and neuronal function consistent with NCBRS pathophysiology."
    explanation: Direct human epigenomic evidence that SMARCA2 variants produce a genome-wide methylation signature over differentiation, calcium-signalling and neuronal-function genes.
  - reference: PMID:31288860
    reference_title: "New insights into DNA methylation signatures: SMARCA2 variants in Nicolaides-Baraitser syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A validation cohort of NCBRS cases (n = 8) and controls (n = 96) demonstrated 100% model sensitivity and specificity."
    explanation: Quantifies the discriminative performance of the methylation signature, supporting its use both as a mechanistic readout and as a diagnostic classifier.
- name: Impaired Neurodevelopment
  biological_scale: ORGANISM
  description: >-
    The neurodevelopmental consequence is intellectual disability of variable but
    generally marked severity, with absent speech in a substantial minority,
    acquired microcephaly, behavioural abnormalities, and epilepsy that is often
    difficult to control. Severity within the disorder is internally correlated:
    the severity of intellectual disability tracks with the presence of seizures,
    absent speech, short stature and microcephaly, indicating a shared dose of
    the underlying lesion rather than independent organ-specific effects. Brain
    MRI is mainly unremarkable, and the epilepsy is characterised as genetic
    rather than structural.
  cell_types:
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Intellectual Disability
    causal_link_type: DIRECT
    description: The neurodevelopmental lesion manifests as intellectual disability.
  - target: Seizures
    causal_link_type: DIRECT
    description: >-
      The same lesion produces a predominantly generalised, difficult-to-treat
      epilepsy that is genetic rather than structural in origin.
  - target: Secondary Microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Impaired postnatal brain growth produces acquired microcephaly.
  - target: Developmental Regression
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Regression or arrest of developmental progress has been observed with the
      onset of seizures.
  - target: Global Developmental Delay
    causal_link_type: DIRECT
    description: >-
      The neurodevelopmental lesion presents first as global developmental delay
      before the intellectual disability is formally characterised.
  - target: Absent Speech
    causal_link_type: DIRECT
    description: >-
      Speech and language are disproportionately affected, with a substantial
      minority never developing speech.
  - target: Behavioral Problems
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Behavioural abnormalities are part of the neurodevelopmental phenotype and
      track with the severity of the underlying lesion.
  - target: Autistic Behavior
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Autistic-like features occur within the behavioural phenotype, with a
      minority receiving a formal autism spectrum diagnosis.
  - target: Hyperacusis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Sensitivity to loud noises is one of the two exemplar autistic-like
      features named in the clinical description.
  - target: Feeding Difficulties
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Feeding difficulty accompanies the neurodevelopmental phenotype and drives
      the requirement to assess nutritional status and oral-intake safety at each
      visit; the intermediates (oral-motor versus oral-sensory) are not
      established.
  - target: Hypotonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Hypotonia is reported as one of the neurological abnormalities of the
      syndrome and is grouped with seizures, microcephaly and structural brain
      anomalies; the intermediates between the transcriptional lesion and reduced
      muscle tone are not established.
  evidence:
  - reference: PMID:25169058
    reference_title: "Phenotype and genotype in Nicolaides-Baraitser syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There may be a correlation between the severity of the ID and presence of seizures, absent speech, short stature and microcephaly."
    explanation: Documents the internal correlation of severity across the neurodevelopmental and growth features, supporting a single shared upstream lesion.
  - reference: PMID:33578439
    reference_title: "Epilepsy in Nicolaides-Baraitser Syndrome: Review of Literature and Report of 25 Patients Focusing on Treatment Aspects."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "EEG showed generalized epileptogenic abnormalities in 53% (9/17), cranial magnetic resonance imaging (cMRI) was mainly inconspicuous."
    explanation: Establishes that the epilepsy is accompanied by generalised EEG abnormalities without a structural MRI correlate.
  - reference: PMID:26468571
    reference_title: "SMARCA2-Related Nicolaides-Baraitser Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Regression or lack of developmental progress has been noted with the onset of seizures in some affected individuals."
    explanation: GeneReviews links developmental regression to seizure onset, which is the causal edge curated here.
- name: Impaired Ectodermal and Skeletal Development
  biological_scale: TISSUE
  description: >-
    Outside the nervous system, the same chromatin-remodelling lesion produces a
    distinctive ectodermal and skeletal phenotype: sparse scalp hair (which may be
    present only at certain ages), coarse facial features, delayed tooth eruption
    with hypo- or oligodontia, and a characteristic hand phenotype of
    brachydactyly with prominence of the interphalangeal joints and distal
    phalanges caused by decreased subcutaneous fat. Radiographs show cone-shaped
    epiphyses, metaphyseal flaring, and shortening of phalanges, metacarpals and
    metatarsals, especially of the 4th and 5th rays.
  downstream:
  - target: Sparse Scalp Hair
    causal_link_type: DIRECT
    description: Disrupted hair-follicle developmental programs produce sparse scalp hair.
  - target: Brachydactyly
    causal_link_type: DIRECT
    description: >-
      Disrupted skeletal developmental programs produce shortened phalanges,
      metacarpals and metatarsals.
  - target: Prominent Interphalangeal Joints
    causal_link_type: DIRECT
    description: >-
      Joint prominence arises from decreased subcutaneous fat over the digits
      together with the underlying skeletal changes.
  - target: Cone-Shaped Epiphyses
    causal_link_type: DIRECT
    description: The radiographic hallmark of the skeletal lesion.
  - target: Coarse Facial Features
    causal_link_type: DIRECT
    description: The characteristic facial gestalt.
  - target: Reduced Subcutaneous Adipose Tissue
    causal_link_type: DIRECT
    description: >-
      Decreased subcutaneous fat is itself part of the ectodermal/mesenchymal
      lesion and is the stated anatomical basis for the digital prominence.
  - target: Everted Lower Lip Vermilion
    causal_link_type: DIRECT
    description: The commonest single element of the facial gestalt.
  - target: Wide Mouth
    causal_link_type: DIRECT
    description: Part of the same craniofacial patterning phenotype.
  - target: Long Eyelashes
    causal_link_type: DIRECT
    description: >-
      Long eyelashes belong to the ectodermal (hair-follicle) arm of the
      phenotype alongside the scalp-hair finding.
  - target: Downslanted Palpebral Fissures
    causal_link_type: DIRECT
    description: Part of the periorbital component of the facial gestalt.
  - target: Delayed Tooth Eruption
    causal_link_type: DIRECT
    description: >-
      Dental development is an ectodermal program disrupted by the same lesion.
  - target: Hypodontia or Oligodontia
    causal_link_type: DIRECT
    description: >-
      Reduced tooth number arises from the same disrupted dental-ectodermal
      program as the delayed eruption.
  - target: Platyspondyly
    causal_link_type: DIRECT
    description: >-
      The axial counterpart of the appendicular skeletal changes, seen on
      radiographs together with flat intervertebral disc space.
  - target: Short Stature
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Growth deficiency accompanies the skeletal phenotype in about half of
      affected individuals; the intermediates are not established.
  - target: Eczematous Dermatitis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Proposed, not established: the same chromatin-remodelling lesion is
      suggested to compromise epidermal barrier integrity, which would place the
      eczematous dermatitis in the ectodermal arm. Curated as an indirect edge
      with unknown intermediates because the proposal rests on a single case
      report.
  evidence:
  - reference: PMID:26468571
    reference_title: "SMARCA2-Related Nicolaides-Baraitser Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SMARCA2-related Nicolaides-Baraitser syndrome (SMARCA2-NCBRS) is characterized by commonly shared dysmorphic features including sparse scalp hair, prominence of the interphalangeal joints and distal phalanges due to decreased subcutaneous fat, characteristic coarse facial features, microcephaly (typically acquired), seizures, and developmental delay / intellectual disability."
    explanation: GeneReviews defines the composite ectodermal, skeletal and neurological phenotype, including the mechanistic detail that joint prominence is due to decreased subcutaneous fat.
  - reference: PMID:26468571
    reference_title: "SMARCA2-Related Nicolaides-Baraitser Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Radiographic findings may include cone-shaped epiphyses, metaphyseal flaring of the phalanges, and shortening of the phalanges, metacarpals, and/or metatarsals (especially of the 4th and 5th rays) of the hands; platyspondyly; flat intervertebral disc space; and pelvic/femoral anomalies."
    explanation: Enumerates the radiographic skeletal phenotype produced by this node.
phenotypes:
- category: Cognitive
  name: Intellectual Disability
  description: >-
    Intellectual disability is almost universal. GeneReviews grades it severe in
    nearly half of affected individuals, moderate in one third, and mild in the

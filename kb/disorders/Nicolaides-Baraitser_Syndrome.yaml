- name: Antiseizure Medication
  description: >-
    Epilepsy in NCBRS mostly shows only an initial response to antiseizure
    medication and very rarely achieves complete seizure freedom. In the largest
    treatment-focused series, levetiracetam, valproic acid, phenobarbital and
    topiramate each reduced seizure frequency by more than 50% in most treated
    patients, but only a minority achieved even temporary (>6 month) seizure
    freedom. Seizure aggravation was observed with several agents, most notably
    lamotrigine, which is curated as a separate agents-to-use-with-caution item.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy

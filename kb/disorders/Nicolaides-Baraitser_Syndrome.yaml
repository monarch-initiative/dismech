    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LEV (9/12), PB (6/8), TPM (4/5), and VPA (9/12) reduced the seizures' frequency in more than 50%."
    explanation: Quantifies the response rates of the four most effective agents.

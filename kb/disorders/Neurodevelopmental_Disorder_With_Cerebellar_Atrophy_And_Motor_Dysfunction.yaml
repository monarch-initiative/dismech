- name: Loss of GEMIN5 Ribosome Association
  description: >-
    Independently of the SMN complex, GEMIN5 binds ribosomes through its
    N-terminal region, modulates global protein synthesis, and promotes
    polysome loading of selected mRNAs including SMN, ribosomal protein and
    histone mRNAs. Patient TPR-like dimerization-domain variants fail to
    associate with native ribosomes. Whether loss of this translational
    function contributes to neurological disease is not known.
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  biological_processes:
  - preferred_term: regulation of translation
    modifier: DYSREGULATED
    term:
      id: GO:0006417
      label: regulation of translation
  molecular_functions:
  - preferred_term: ribosome binding
    modifier: DECREASED
    term:
      id: GO:0043022
      label: ribosome binding
  evidence:
  - reference: PMID:27507887
    reference_title: The RNA-binding protein Gemin5 binds directly to the ribosome and regulates global translation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results reveal the ribosome-binding capacity of the N-ter moiety, enabling Gemin5 to control global protein synthesis."
    explanation: Establishes the ribosome-binding translational function of GEMIN5.
  - reference: PMID:35987821
    reference_title: Gemin5-dependent RNA association with polysomes enables selective translation of ribosomal and histone mRNAs.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "it favors translation of the ribosomal and the histone mRNAs"
    explanation: GEMIN5 selectively promotes translation of particular mRNA classes.
  - reference: PMID:35393353
    reference_title: Functional and structural deficiencies of Gemin5 variants associated with neurological disorders.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All mutants are defective in the interaction with protein networks involved in translation and RNA-driven pathways."
    explanation: Patient variants lose interactions with translation-related protein networks.
  downstream:
  - target: Reduced SMN Complex Protein Levels
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - translation_control_deficit
    description: >-
      GEMIN5 activates SMN mRNA translation, so loss of its translational
      function could contribute to the reduced SMN levels seen in patient
      neurons. This has not been tested with patient variants.
    evidence:
    - reference: PMID:25911097
      reference_title: Gemin5 Binds to the Survival Motor Neuron mRNA to Regulate SMN Expression.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Reduction of Gemin5 redistributes the SMN mRNA from heavy polysomes to lighter polysomes and monosomes, suggesting that Gemin5 functions as an activator of SMN translation."
      explanation: >-
        Shows GEMIN5 promotes SMN translation, measured after GEMIN5 depletion
        in cell lines rather than with patient alleles.

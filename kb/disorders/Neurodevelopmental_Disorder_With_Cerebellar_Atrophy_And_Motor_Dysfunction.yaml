discussions:
- discussion_id: gemin5_cerebellar_selectivity_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why does loss of a ubiquitously expressed snRNP assembly factor damage the
    cerebellum and corticospinal tract selectively, and which mis-spliced or
    mistranslated transcripts link the molecular defect to cerebellar
    degeneration?
  rationale: >-
    The snRNP assembly and splicing defect is measured only in generic
    iPSC-derived neurons, and the transcriptomic changes there barely overlap
    those of SMA neurons. No cerebellar cell type has been studied, no patient
    neuropathology is published, and the edge from splicing dysregulation to
    cerebellar degeneration rests on analogy with other snRNP lesions.
  attaches_to:
  - pathophysiology#Neuronal Pre-mRNA Splicing Dysregulation
  - pathophysiology#Cerebellar Degeneration
  evidence:
  - reference: PMID:33963192
    reference_title: Loss of function mutations in GEMIN5 cause a neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "mutations in GEMIN5 lead to an exclusive transcriptomic profile with little overlap to SMA"
    explanation: The disease-relevant transcripts remain undefined and differ from SMA.
- discussion_id: gemin5_snrnp_vs_translation
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >-
    How much of the disease is caused by loss of snRNP assembly and how much by
    loss of GEMIN5's ribosome-binding and translational functions?
  rationale: >-
    Dimerization-domain variants abolish ribosome association, but the
    consequences for neuronal protein synthesis have not been measured in
    patient cells, and the founding authors note that functions beyond snRNP
    biogenesis may explain why the phenotype differs from SMA.
  attaches_to:
  - pathophysiology#Loss of GEMIN5 Ribosome Association
  - mechanistic_hypotheses#translation_control_deficit
  evidence:
  - reference: PMID:39819844
    reference_title: "GEMIN5 and neurodevelopmental diseases: From functional insights to disease perception."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Molecular analyses of individual variants, which are defective in protein dimerization, display decreased levels of ribosome association, reinforcing the involvement of the protein in translation regulation."
    explanation: Review framing translation regulation as a disease-relevant function still to be resolved.
- discussion_id: gemin5_coq10_replication
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is secondary CoQ10 deficiency a general feature of GEMIN5 deficiency, and
    does oral CoQ10 change the course of the disease?
  rationale: >-
    The evidence is one report: fibroblasts and uncontrolled treatment in two
    patients who both carry p.Arg1016Cys, with neurological improvement but
    unchanged MRI. Developmental gains are expected in children with a mostly
    static disorder regardless of treatment, so an uncontrolled report cannot
    separate a treatment effect from natural history. Replication in other
    genotypes and a controlled assessment are needed.
  attaches_to:
  - pathophysiology#Secondary Coenzyme Q10 Deficiency
  - treatments#Coenzyme Q10 Supplementation
  evidence:
  - reference: PMID:38316953
    reference_title: "Mutations of GEMIN5 are associated with coenzyme Q(10) deficiency: long-term follow-up after treatment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We treated two of these patients with oral Coenzyme Q10 (CoQ10), which resulted in neurological improvements, although MRI abnormalities remained."
    explanation: The only clinical evidence is an uncontrolled two-patient observation.
- discussion_id: gemin5_model_gap
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    No vertebrate model reproduces the cerebellar atrophy of NEDCAM: does a
    hypomorphic or patient-allele knock-in mouse develop cerebellar
    degeneration?
  rationale: >-
    Gemin5 null mice die before E9.5 and null zebrafish die by 2 weeks, while
    patients have partial loss of function. Flies, the only model with
    neuronal phenotypes, lack a cerebellum. The cerebellar mechanism therefore
    has no in vivo model in which it can be studied or a therapy tested.
  attaches_to:
  - pathophysiology#Cerebellar Degeneration
  - animal_models#Mus musculus
  evidence:
  - reference: PMID:35295849
    reference_title: Autosomal Recessive Cerebellar Atrophy and Spastic Ataxia in Patients With Pathogenic Biallelic Variants in GEMIN5.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Since we did not get any Gemin5 null animals at E9.5, we were unable to determine the impact of abolishing Gemin5 on brain development."
    explanation: The null mouse cannot inform brain or cerebellar pathology.

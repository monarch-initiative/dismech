  description: >-
    No disease-modifying treatment is established. Management is supportive
    and symptom-directed, including physiotherapy, speech and language
    therapy, management of spasticity and contractures (for example with
    botulinum toxin), dysphagia management and, in advanced disease,
    palliative care.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive care
    term:

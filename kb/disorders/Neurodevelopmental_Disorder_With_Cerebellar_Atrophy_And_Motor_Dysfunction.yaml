    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We propose a stepwise pathway of SMN complex formation and snRNP biogenesis, highlighting Gemin5's function in delivering pre-snRNAs as substrates for Sm core assembly and processing."
    explanation: Establishes the normal role of GEMIN5 that is lost in this disorder.
  - reference: PMID:33963192
    reference_title: Loss of function mutations in GEMIN5 cause a neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "GEMIN5 mutations result in disruption of snRNP complex assembly formation in patient iPSC neurons."
    explanation: Direct measurement of the assembly defect in patient-derived neurons.
  - reference: PMID:37369805
    reference_title: SMN regulates GEMIN5 expression and acts as a modifier of GEMIN5-mediated neurodegeneration.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These results suggest that mutations and loss of Gemin5 in vivo disrupt snRNP assembly and upregulation of SMN partially rescues snRNP phenotypes associated with GEMIN5-mediated disease."
    explanation: The snRNP defect is reproduced in vivo in Drosophila larval brain after rigor mortis knockdown.
  downstream:

animal_models:
- name: Drosophila rigor mortis RNAi knockdown
  species: Drosophila melanogaster
  genotype: Ubiquitous or neuronal RNAi knockdown of rigor mortis (Rig), the fly GEMIN5 orthologue
  publication: PMID:33963192
  description: >-
    Inducible RNAi against rigor mortis causes pupal lethality, smaller
    neuromuscular junction boutons, reduced climbing and shortened lifespan, and
    in larval brain reduces nuclear Sm protein and Cajal bodies.
  modeled_mechanisms:
  - target: Impaired snRNP Assembly
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Rig knockdown reproduces the loss of nuclear Sm protein seen in patient
      neurons, partially rescued by Smn overexpression.
    limitations: >-
      RNAi knockdown of about 60-70% is not a patient allele, and the fly has
      no cerebellum, so the defining tissue phenotype cannot be modelled.
    evidence:
    - reference: PMID:37369805
      reference_title: SMN regulates GEMIN5 expression and acts as a modifier of GEMIN5-mediated neurodegeneration.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Similarly to the mutant GEMIN5 iPSC-derived neurons, we found that dSmB was drastically reduced in Rig KD animals compared to control."
      explanation: In vivo snRNP marker loss mirrors patient neurons.
  - target: Motor delay
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Rig knockdown flies have developmental defects, motor dysfunction and
      reduced lifespan, which the authors compare to the motor-predominant
      developmental delay of patients.
    limitations: >-
      Fly climbing and pupal lethality are organism-level readouts that cannot
      be mapped onto cerebellar ataxia or human motor milestones.
    evidence:
    - reference: PMID:33963192
      reference_title: Loss of function mutations in GEMIN5 cause a neurodevelopmental disorder.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Furthermore, knock down of rigor mortis, the fly homolog of human GEMIN5, leads to developmental defects, motor dysfunction, and a reduced lifespan."
      explanation: Motor and developmental phenotypes in the fly knockdown.

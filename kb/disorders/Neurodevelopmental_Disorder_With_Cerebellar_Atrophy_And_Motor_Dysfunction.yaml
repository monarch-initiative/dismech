diagnosis:
- name: Exome or genome sequencing
  description: >-
    Diagnosis rests on finding biallelic pathogenic GEMIN5 variants by exome
    or genome sequencing in a child with motor-predominant developmental delay
    and cerebellar atrophy. The founding authors recommend testing
    SMN1-negative neonates with severe hypotonia and cerebellar atrophy.
  diagnosis_term:
    preferred_term: Whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:33963192
    reference_title: Loss of function mutations in GEMIN5 cause a neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We think it would be worth considering testing for GEMIN5 variants in SMN1 negative neonates with severe hypotonia and absent reflexes, especially with cerebellar atrophy on imaging."
    explanation: Clinical guidance on when to test for GEMIN5 variants.
- name: Brain MRI
  description: >-
    Brain MRI shows cerebellar atrophy (or hypoplasia in early infancy) in
    essentially all patients and is the key imaging clue; GEMIN5 belongs on
    ataxia gene panels.
  diagnosis_term:
    preferred_term: Brain magnetic resonance imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  evidence:
  - reference: PMID:33963192
    reference_title: Loss of function mutations in GEMIN5 cause a neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We also think GEMIN5 should be covered by ataxia gene panels and should be considered in children with motor predominant developmental delay and cerebellar atrophy on neuroimaging."
    explanation: Cerebellar atrophy on neuroimaging is the trigger for considering GEMIN5.
treatments:

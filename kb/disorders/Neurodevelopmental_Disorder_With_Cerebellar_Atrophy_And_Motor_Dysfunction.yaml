mechanistic_hypotheses:
- hypothesis_group_id: snrnp_assembly_deficit
  hypothesis_label: Impaired snRNP assembly and neuronal splicing
  status: CANONICAL
  description: >-
    Loss of GEMIN5 lowers SMN complex proteins, impairs Sm core assembly on
    snRNAs and perturbs pre-mRNA splicing in neurons. This is the mechanism
    supported by patient iPSC neurons and fly models and adopted by ClinGen.
  evidence:
  - reference: PMID:33963192
    reference_title: Loss of function mutations in GEMIN5 cause a neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In summary, we have shown that biallelic variants in GEMIN5 cause developmental delay, motor dysfunction, and cerebellar atrophy and reduce snRNP complex assembly proteins, impair snRNP assembly and misregulate RNA targets."
    explanation: Summary of the founding mechanistic model.
- hypothesis_group_id: translation_control_deficit
  hypothesis_label: Loss of GEMIN5 translational control
  status: EMERGING
  description: >-
    GEMIN5 also binds ribosomes and regulates selective translation. Patient
    dimerization-domain variants lose ribosome association, and the founding
    report notes that the distinct clinical picture from SMA could reflect
    functions beyond snRNP biogenesis. No study has yet linked a translational
    defect to a neuronal phenotype.
  evidence:
  - reference: PMID:33963192
    reference_title: Loss of function mutations in GEMIN5 cause a neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The distinct but overlapping predisposition of clinical symptoms in GEMIN5 patients could be attributed to functions besides snRNP biogenesis and splicing, and needs further exploration for targeted therapeutic approaches."
    explanation: The founding authors leave open a role for non-snRNP functions.
  - reference: PMID:35393353
    reference_title: Functional and structural deficiencies of Gemin5 variants associated with neurological disorders.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Importantly, the TPR-like variants fail to associate with native ribosomes, hampering its involvement in translation control and establishing a functional difference with the wild-type protein."
    explanation: Patient variants are defective in the translational function.
- hypothesis_group_id: coq10_deficiency
  hypothesis_label: Secondary coenzyme Q10 deficiency
  status: EMERGING
  description: >-
    A single report proposes that GEMIN5 dysfunction represses CoQ10
    biosynthesis genes, causing a secondary CoQ10 deficiency that contributes
    to disease and is treatable with oral CoQ10. Evidence is limited to
    fibroblasts, flies and an uncontrolled treatment of two patients who share
    the p.Arg1016Cys allele.
  evidence:
  - reference: PMID:38316953
    reference_title: "Mutations of GEMIN5 are associated with coenzyme Q(10) deficiency: long-term follow-up after treatment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Overall, we report the association between GEMIN5 dysfunction and CoQ10 deficiency for the first time."
    explanation: The report itself presents the association as new and unreplicated.

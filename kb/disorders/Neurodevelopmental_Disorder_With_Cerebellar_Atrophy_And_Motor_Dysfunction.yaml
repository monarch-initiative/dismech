name: Neurodevelopmental Disorder With Cerebellar Atrophy And Motor Dysfunction
creation_date: "2026-10-22T00:00:00Z"
category: Mendelian
synonyms:
- NEDCAM
- GEMIN5-related neurodevelopmental disorder
- GEMIN5 disorder
description: >-
  Neurodevelopmental disorder with cerebellar atrophy and motor dysfunction
  (NEDCAM, OMIM:619333) is an autosomal recessive disorder caused by biallelic
  loss-of-function variants in GEMIN5, the snRNA-binding component of the
  survival motor neuron (SMN) complex. Affected individuals present in the first
  two years of life with motor-predominant developmental delay, central
  hypotonia and cerebellar ataxia, and brain MRI shows cerebellar atrophy in
  essentially every reported patient. Cognitive and speech delay, appendicular
  spasticity with brisk reflexes, tremor, and less often epilepsy (including
  early-infantile developmental and epileptic encephalopathy with infantile
  spasms), nystagmus, strabismus and cataract complete the picture. Severity
  spans a severe infantile form with an SMA-like picture and early death, a late
  infantile developmental delay and ataxia syndrome, and a juvenile or
  adult-onset spastic ataxia; most patients have a static course, but some
  progress. Pathogenic variants reduce GEMIN5 protein levels, lower the levels
  of other SMN complex proteins, impair snRNP assembly and perturb pre-mRNA
  splicing in patient iPSC-derived neurons; variants in the dimerization domain
  also abolish GEMIN5 binding to ribosomes, a second, translational function of
  the protein whose contribution to disease is not yet established. NEDCAM is
  distinct from spinal muscular atrophy, which is caused by loss of SMN itself:
  its transcriptomic signature in patient neurons barely overlaps that of SMA
  neurons, and cerebellar involvement is its defining feature.
disease_term:
  preferred_term: neurodevelopmental disorder with cerebellar atrophy and motor dysfunction
  term:
    id: MONDO:0859152
    label: neurodevelopmental disorder with cerebellar atrophy and motor dysfunction
parents:
- Hereditary cerebellar ataxia
- Mendelian neurodevelopmental disorder
- Spliceosomopathy
notes: >-
  No GeneReviews chapter exists for this disorder (`just check-genereviews
  --online` returned NO_CHAPTER on 2026-10-22), so the phenotype baseline is
  the founding 30-patient cohort (PMID:33963192) and the second cohort that
  pooled it to 39 patients (PMID:35295849), cross-checked against later case
  reports. NEDCAM is not spinal muscular atrophy: GEMIN5 and SMN are partners in
  the same complex, but the disorders are caused by different genes, and the
  SMN-related literature is cited here only where it directly measures GEMIN5.
  ClinGen classifies GEMIN5 for this disease as Definitive (autosomal
  recessive). Dementia, dysphagia, strabismus and cataract are left without
  an upstream mechanism node: each rests on a single sentence or single case,
  and no source proposes how GEMIN5 deficiency produces them.
inheritance:
- name: Autosomal recessive
  description: >-
    Disease requires biallelic GEMIN5 variants, homozygous in consanguineous
    families or compound heterozygous, typically a truncating allele in trans
    with a missense allele. Heterozygous carriers are asymptomatic.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:35295849
    reference_title: Autosomal Recessive Cerebellar Atrophy and Spastic Ataxia in Patients With Pathogenic Biallelic Variants in GEMIN5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All variants were rare with allele frequencies ranging from 0 to 4.48e-3 as a heterozygote and showed autosomal recessive inheritance pattern"
    explanation: >-
      Seven families with nine affected individuals segregate the disease as an
      autosomal recessive trait.
  - reference: PMID:33963192
    reference_title: Loss of function mutations in GEMIN5 cause a neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is important since haploinsufficiency does not seem to cause disease in humans, as all heterozygous carriers are asymptomatic."
    explanation: >-
      Heterozygous carrier parents in the founding cohort are unaffected, which
      is the recessive pattern.
has_subtypes:
- name: Infantile-onset severe
  display_name: Infantile-onset severe global developmental delay with cerebellar atrophy
  classification: clinical_phenotype
  description: >-
    Presentation in infancy with severe hypotonia and global developmental
    delay, cerebellar atrophy or hypoplasia on early MRI, and in some patients
    an SMA-like picture with death before 3 years of age.
  evidence:
  - reference: PMID:35295849
    reference_title: Autosomal Recessive Cerebellar Atrophy and Spastic Ataxia in Patients With Pathogenic Biallelic Variants in GEMIN5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These patients presented in infancy with severe hypotonia and global developmental delay. Neuroimaging confirmed cerebellar atrophy."
    explanation: >-
      First of the three severity groups defined by stratifying the pooled
      39-patient cohort by age of onset and severity.
  - reference: PMID:33963192
    reference_title: Loss of function mutations in GEMIN5 cause a neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients 4, 5, and 6 (Family 3 and 4) presented with severe hypotonia at birth and were evaluated for SMA. These three patients passed away before 3 years of age."
    explanation: Early death in three patients with the severe infantile form.
- name: Late infantile-onset
  display_name: Late infantile-onset developmental delay and ataxia syndrome
  classification: clinical_phenotype
  description: >-
    Motor-predominant developmental delay and cerebellar ataxia from late
    infancy, with cerebellar atrophy on MRI.
  evidence:
  - reference: PMID:35295849
    reference_title: Autosomal Recessive Cerebellar Atrophy and Spastic Ataxia in Patients With Pathogenic Biallelic Variants in GEMIN5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "2. Late infantile-onset developmental delay and ataxia syndrome with cerebellar atrophy on neuroimaging."
    explanation: Second severity group in the pooled cohort stratification.
- name: Juvenile or adult-onset spastic ataxia
  display_name: Juvenile/adult-onset spastic ataxia syndrome
  classification: clinical_phenotype
  description: >-
    Later-onset spastic ataxia with pyramidal signs and cerebellar atrophy. The
    oldest reported patient, diagnosed at 79, had progressive ataxia, spastic
    paraparesis and dementia with frontotemporal atrophy.
  evidence:
  - reference: PMID:35295849
    reference_title: Autosomal Recessive Cerebellar Atrophy and Spastic Ataxia in Patients With Pathogenic Biallelic Variants in GEMIN5.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "3. Juvenile/adult-onset spastic ataxia syndrome with cerebellar atrophy on neuroimaging."
    explanation: Third severity group in the pooled cohort stratification.
  review_notes: >-
    The three groups are a clinical stratification by onset and severity, not
    genotype-defined entities. No source assigns a specific allele class to a
    group, so no phenotype or genetic row is tagged with a subtype.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  notes: >-
    A 2024 literature review counted 48 published patients with biallelic
    GEMIN5 variants, before adding the two new patients it reported. No
    population-based prevalence estimate exists.
  evidence:
  - reference: PMID:38773790
    reference_title: "Expanding the clinical phenotype and genetic spectrum of GEMIN5 disorders: Early-infantile developmental and epileptic encephalopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Through a literature review, we found 5 published papers reporting 48 patients with biallelic variants in GEMIN5."
    explanation: Case count across the published literature as of the 2024 review.
pathophysiology:
- name: GEMIN5 Biallelic Loss of Function
  description: >-
    Biallelic GEMIN5 variants, truncating alleles and missense changes
    clustered in the WD40 snRNA-binding domain, the central TPR-like
    dimerization domain and the C-terminal noncanonical RNA-binding site 1
    (RBS1), reduce the amount of functional GEMIN5. Patient iPSC-derived neurons
    and lymphoblastoid cells show markedly reduced GEMIN5 protein; TPR-like
    variants disrupt dimerization and the RBS1 variant destabilizes the protein.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: GEMIN5
    term:
      id: hgnc:20043
      label: GEMIN5
  molecular_functions:
  - preferred_term: snRNA binding
    modifier: DECREASED
    term:
      id: GO:0017069
      label: snRNA binding
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Homozygous or compound heterozygous; heterozygous carriers are unaffected.
  evidence:
  - reference: PMID:33963192
    reference_title: Loss of function mutations in GEMIN5 cause a neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutations in GEMIN5 perturb the subcellular distribution, stability, and expression of GEMIN5 protein and its interacting partners in patient iPSC-derived neurons, suggesting a potential loss-of-function mechanism."
    explanation: Patient-derived neurons show loss of GEMIN5 protein, the basis for a loss-of-function mechanism.
  - reference: PMID:33963192
    reference_title: Loss of function mutations in GEMIN5 cause a neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that the levels of GEMIN5 were drastically reduced by ~70-80% in Leu1068Pro and His913Arg patient neurons as compared to controls"
    explanation: Quantifies the reduction of GEMIN5 protein in homozygous patient neurons.
  - reference: PMID:34569062
    reference_title: Pathogenic variants in the survival of motor neurons complex gene GEMIN5 cause cerebellar atrophy.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Western blotting analysis using lymphoblastoid cell lines derived from both affected individuals showed significantly reduced levels of GEMIN5 protein."
    explanation: Independent replication of reduced GEMIN5 protein in patient-derived cells carrying truncating alleles.
  - reference: PMID:35393353
    reference_title: Functional and structural deficiencies of Gemin5 variants associated with neurological disorders.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that the TPR-like variants disrupt protein dimerization, whereas the RBS1 variant confers protein instability."
    explanation: Missense variants in two functional domains impair GEMIN5 by distinct structural routes.
  downstream:
  - target: Reduced SMN Complex Protein Levels
    causal_link_type: DIRECT
    hypothesis_groups:
    - snrnp_assembly_deficit
    evidence:
    - reference: PMID:33963192
      reference_title: Loss of function mutations in GEMIN5 cause a neurodevelopmental disorder.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Pathogenic GEMIN5 variants significantly reduced the expression of snRNP components (SMN, Gemin2, Gemin4, and Gemin6) as compared to controls, suggesting a potential disruption in the snRNP complex as a whole."
      explanation: Loss of GEMIN5 lowers the levels of its SMN complex partners in patient neurons.
  - target: Loss of GEMIN5 Ribosome Association
    causal_link_type: DIRECT
    hypothesis_groups:
    - translation_control_deficit
    evidence:
    - reference: PMID:35393353
      reference_title: Functional and structural deficiencies of Gemin5 variants associated with neurological disorders.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Importantly, the TPR-like variants fail to associate with native ribosomes, hampering its involvement in translation control and establishing a functional difference with the wild-type protein."
      explanation: Patient TPR-like variants lose the ribosome-binding activity of GEMIN5.
  - target: Secondary Coenzyme Q10 Deficiency
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - coq10_deficiency
    evidence:
    - reference: PMID:38316953
      reference_title: "Mutations of GEMIN5 are associated with coenzyme Q(10) deficiency: long-term follow-up after treatment."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Transcriptomic analysis of GEMIN5 patients compared with controls showed general repression of genes involved in CoQ10 biosynthesis."
      explanation: >-
        Links GEMIN5 deficiency to reduced expression of CoQ10 biosynthesis
        genes in fibroblasts from two patients; the intermediate steps are not
        defined.
- name: Reduced SMN Complex Protein Levels
  description: >-
    Loss of GEMIN5 lowers the levels of other SMN complex members (SMN,
    GEMIN2, GEMIN3, GEMIN4, GEMIN6) and Sm proteins, and the remaining mutant
    GEMIN5 binds SMN, GEMIN3 and GEMIN4 less well.
  biological_scale: MOLECULAR
  cellular_components:
  - preferred_term: SMN complex
    term:
      id: GO:0032797
      label: SMN complex
  evidence:
  - reference: PMID:33963192
    reference_title: Loss of function mutations in GEMIN5 cause a neurodevelopmental disorder.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "the His913Arg and Leu1068Pro mutation in GEMIN5 drastically reduced GEMIN5's interaction with SMN, GEMIN4, and GEMIN3 as compared to WT, which could be driving the reduced snRNP assembly."
    explanation: Mutant GEMIN5 interacts poorly with the SMN complex partners that receive the pre-snRNA it delivers.
  - reference: PMID:35295849
    reference_title: Autosomal Recessive Cerebellar Atrophy and Spastic Ataxia in Patients With Pathogenic Biallelic Variants in GEMIN5.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that biallelic GEMIN5 variants cause structural abnormalities in the encoded protein and reduce expression of snRNP complex proteins in patient cells compared with unaffected controls."
    explanation: Second cohort replicating reduced snRNP complex proteins in patient cells.
  downstream:

      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: BACKGROUND
      snippet: "Loss-of-function mutations in GEMIN5 lead to a neurodevelopmental syndrome among patients presenting with developmental delay, motor dysfunction, and cerebellar atrophy by perturbing SMN complex protein expression and assembly."
      explanation: >-
        Frames reduced SMN complex protein expression and assembly as the route
        from GEMIN5 loss of function to disease. The sentence restates the
        group's earlier cell-based findings in the abstract's background.
- name: Impaired snRNP Assembly
  description: >-
    GEMIN5 recognizes the snRNP code on snRNA precursors and delivers them to
    the SMN complex for Sm core assembly. In extracts of patient iPSC-derived
    neurons, in vitro Sm core assembly on U1 snRNA is drastically reduced, and
    nuclear Sm protein and Cajal bodies are depleted in patient neurons and in
    rigor mortis knockdown fly brains. Raising SMN partially restores these
    defects.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: spliceosomal snRNP assembly
    modifier: DECREASED
    term:
      id: GO:0000387
      label: spliceosomal snRNP assembly
  cellular_components:

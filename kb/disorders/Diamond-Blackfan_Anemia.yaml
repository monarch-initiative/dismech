- name: Ribosomal Protein Haploinsufficiency
  description: >-
    The convergence point of this entry: whichever ribosomal protein is
    missing, and whether the lesion is in the gene or in the import step that
    delivers the protein, the shared consequence is reduced ribosome assembly
    and protein synthesis capacity. Erythroid progenitors are exquisitely
    sensitive to that state because of their high proliferative and
    translational demands. Causal genes are wired to the subunit-specific
    upstream nodes rather than listed here, so this node carries no `genes:`
    list of its own.

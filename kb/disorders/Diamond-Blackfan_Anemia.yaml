- name: Ribosomal Protein Nuclear Import Failure
  biological_scale: MOLECULAR
  description: >-
    The one DBA mechanism in this entry that is upstream of the ribosomal
    proteins themselves. HEATR3 is an import adaptor for the large-subunit
    proteins uL5 (RPL11) and uL18 (RPL5); biallelic HEATR3 variants destabilize
    it, and patient-derived fibroblasts show reduced nuclear accumulation of
    uL18. The consequence is a shortage of large-subunit proteins in the
    nucleolus rather than a shortage of their transcripts.

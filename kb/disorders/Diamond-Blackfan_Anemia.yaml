treatments:
- name: Corticosteroid Therapy
  description: >
    First-line treatment. Improves the red blood cell count in approximately
    60-80% of affected individuals. Recommended to start at age 12 months
    or older to minimize growth effects.
  treatment_term:
    preferred_term: systemic corticosteroid therapy
    term:
      id: NCIT:C122080
      label: Systemic Corticosteroid Therapy
  evidence:
  - reference: PMID:20301769
    reference_title: "DBA Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Corticosteroid treatment, recommended in children at age 12 months or older, improves the red blood cell count in approximately 60%-80% of affected individuals"
    explanation: Confirms corticosteroid efficacy at 60-80% response rate and recommended age of initiation.
- name: Chronic Red Blood Cell Transfusions
  description: >
    Necessary during the first year of life and for steroid-nonresponders.
    Iron chelation therapy is required after 10-12 transfusions to prevent
    transfusion-related iron overload.
  treatment_term:
    preferred_term: blood transfusion
    term:
      id: NCIT:C15192
      label: Blood Transfusion
  evidence:
  - reference: PMID:20301769
    reference_title: "DBA Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Chronic transfusion with packed red blood cells is necessary during the first year of life"
    explanation: Confirms chronic transfusion as necessary during the first year to avoid steroid effects on growth.
- name: Hematopoietic Stem Cell Transplantation
  description: >
    The only curative therapy for the hematologic manifestations of DBA.
    Recommended for transfusion-dependent patients or those developing
    other cytopenias.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  evidence:
  - reference: PMID:20301769
    reference_title: "DBA Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hematopoietic stem cell transplantation, the only curative therapy for the hematologic manifestations of DBA syndrome"
    explanation: Confirms HSCT as the only curative therapy for DBA hematologic manifestations.
- name: Iron Chelation Therapy
  description: >
    Required for transfusion-dependent patients after 10-12 transfusions.
    Deferasirox (oral) or deferoxamine (subcutaneous) are preferred.
  treatment_term:
    preferred_term: iron chelation therapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
- name: Genetic Counseling
  description: >
    Important for family screening. Approximately 40-45% of cases are
    inherited; 55-60% are de novo.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
- name: Clonal Evolution and Malignancy Surveillance
  description: >-
    As an inherited bone marrow failure syndrome, Diamond-Blackfan anemia
    carries an elevated risk of myelodysplastic neoplasm, acute myeloid
    leukemia, and solid tumors. Long-term surveillance includes periodic marrow
    evaluation with cytogenetic monitoring for acquired clonal abnormalities and
    disease-specific late-effects screening, especially after hematopoietic cell
    transplantation.
  treatment_term:
    preferred_term: surveillance for malignancies
    term:
      id: NCIT:C15406
      label: Cancer Screening
  evidence:
  - reference: PMID:38016422
    reference_title: "Cytogenetics in the management of bone marrow failure syndromes: Guidelines from the Groupe Francophone de Cytogénétique Hématologique (GFCH)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Bone marrow failure syndromes are at risk of secondary progression towards myeloid neoplasms in the form of myelodysplastic neoplasms or acute myeloid leukemia."
    explanation: The GFCH cytogenetics guideline establishes the myeloid-neoplasm progression risk in bone marrow failure syndromes (including Diamond-Blackfan anemia) that cytogenetic surveillance monitors.
  - reference: PMID:28533057
    reference_title: "Late Effects Screening Guidelines after Hematopoietic Cell Transplantation for Inherited Bone Marrow Failure Syndromes: Consensus Statement From the Second Pediatric Blood and Marrow Transplant Consortium International Conference on Late Effects After Pediatric HCT."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This companion article outlines consensus disease-specific long-term follow-up screening guidelines for patients with IMBFS."
    explanation: Consensus late-effects screening guidelines for inherited bone marrow failure syndromes (which include Diamond-Blackfan anemia) frame long-term post-transplant surveillance.

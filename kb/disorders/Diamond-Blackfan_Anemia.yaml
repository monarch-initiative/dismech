name: Diamond-Blackfan Anemia
creation_date: '2026-02-16T18:18:28Z'
category: Mendelian
description: >
  Diamond-Blackfan anemia (DBA) is a congenital ribosomopathy and inherited
  bone marrow failure syndrome characterized by a selective defect in
  erythropoiesis. Heterozygous loss-of-function mutations in ribosomal protein
  genes (most commonly RPS19, along with RPL5, RPL11, and others) cause
  ribosomal protein haploinsufficiency; the resulting ribosomal stress
  preferentially impairs erythroid progenitors, producing macrocytic anemia
  with reticulocytopenia that typically presents in the first year of life.
  DBA is frequently associated with congenital malformations and an increased
  predisposition to malignancy, and is most often inherited in an autosomal
  dominant manner. The share of cases explained by ribosomal protein genes has
  risen as the gene list grew, so any figure is dated: seven RP genes accounted
  for about 43% of patients (PMID:20116044), nine for about 53%
  (PMID:22431104), ten RP genes plus GATA1 for about 60-65% (PMID:23812780),
  and a 2024 review puts the RP-gene share at approximately 75%
  (DOI:10.3390/cells13110920). Rarer
  non-ribosomal causes exist: X-linked GATA1 is modeled in this
  entry, while X-linked TSR2 and RPS28 have their own dismech entries as the
  mandibulofacial-dysostosis forms DBA14 and DBA15. Biallelic HEATR3 variants
  (DBA21) are the one recessive form here. A substantial minority of patients
  remain genetically unexplained.

pathophysiology:
- name: Small Ribosomal Subunit Assembly Defect
  biological_scale: MOLECULAR
  description: >-
    Haploinsufficiency of a small-subunit (40S) ribosomal protein gene impairs
    18S rRNA maturation and 40S subunit production. The seven genes on this node
    are the DBA genes HGNC assigns to the "S ribosomal proteins" gene group;
    subunit-specific pre-rRNA processing defects are documented for RPS10 and
    RPS26 (18S-E accumulation) and RPS29 is stated to be a 40S component.
  genes:
  - preferred_term: RPS19
    term:
      id: hgnc:10402
      label: RPS19
  - preferred_term: RPS24
    term:
      id: hgnc:10411
      label: RPS24
  - preferred_term: RPS17
    term:
      id: hgnc:10397
      label: RPS17
  - preferred_term: RPS7
    term:
      id: hgnc:10440
      label: RPS7
  - preferred_term: RPS10
    term:
      id: hgnc:10383
      label: RPS10
  - preferred_term: RPS26
    term:
      id: hgnc:10414
      label: RPS26
  - preferred_term: RPS29
    term:
      id: hgnc:10419
      label: RPS29
  biological_processes:
  - preferred_term: ribosomal small subunit biogenesis
    modifier: DECREASED
    term:
      id: GO:0042274
      label: ribosomal small subunit biogenesis
  downstream:
  - target: Ribosomal Protein Haploinsufficiency
    description: >-
      A 40S assembly defect is one of the two routes to the shared
      ribosome-insufficiency state on which the erythroid phenotype depends.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:18535205
    reference_title: "Abnormalities of the large ribosomal subunit protein, Rpl35a, in Diamond-Blackfan anemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Small ribosomal subunit genes RPS19, RPS24, and RPS17 are mutated in approximately one-third of patients.
    explanation: Names three of this node's genes as small-subunit genes mutated in DBA.
  - reference: PMID:20116044
    reference_title: "Ribosomal protein genes RPS10 and RPS26 are commonly mutated in Diamond-Blackfan anemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Pre-rRNA analysis in lymphoblastoid cells from patients bearing mutations in RPS10 and RPS26 showed elevated levels of 18S-E pre-rRNA.
    explanation: >-
      The small-subunit pre-rRNA processing defect this node asserts, measured
      in patient-derived cells.
  - reference: PMID:24829207
    reference_title: "Whole-exome sequencing and functional studies identify RPS29 as a novel gene mutated in multicase Diamond-Blackfan anemia families."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: RPS29 is a component of the small 40S ribosomal subunit and essential for rRNA processing and ribosome biogenesis.
    explanation: Places RPS29 on this node.
- name: Large Ribosomal Subunit Assembly Defect
  biological_scale: MOLECULAR
  description: >-
    Haploinsufficiency of a large-subunit (60S) ribosomal protein gene impairs
    28S and 5.8S rRNA maturation and 60S subunit production. The six genes on
    this node are the DBA genes HGNC assigns to the "L ribosomal proteins" gene
    group. Two of them, RPL26 and RPL15, additionally disturb a small-subunit
    pre-rRNA cleavage step, so the subunit split describes which protein is
    missing rather than a clean partition of the processing defect.

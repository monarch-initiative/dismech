name: Dilated Cardiomyopathy 1B
creation_date: "2026-08-18T00:00:00Z"
synonyms:
- CMD1B
- cardiomyopathy, dilated, 1B
- dilated cardiomyopathy type 1B
- familial dilated cardiomyopathy, 9q13-q22 locus
description: >-
  Dilated cardiomyopathy 1B (CMD1B) is an autosomal dominant familial dilated
  cardiomyopathy (FDC) locus mapped in 1995 by Krajinovic and colleagues of the
  Trieste Heart Muscle Disease Study Group to chromosome 9q13-q22, in the
  interval between the microsatellite markers D9S153 and D9S152, with a maximum
  multipoint LOD score of 4.2. The mapping came from a genome-wide search in a
  large six-generation kindred with autosomal dominant FDC, undertaken only
  after a large series of candidate genes had been excluded, and was then
  extended to two further families with the same pattern of transmission and
  identical clinical features; coinheritance was excluded for more than 95% of
  the genome and there was no evidence of locus heterogeneity across the three
  families. The defining fact about this entry, and the one that should anchor
  any use of it, is that CMD1B remains a linkage locus without an identified
  causal gene: in the three decades since the original report no gene at
  9q13-q22 has been confirmed to cause this phenotype. MONDO itself defines the
  entity by region rather than by gene ("material basis in variation in the
  chromosome region 9q13"), and the corresponding NCBI Gene record (Gene ID
  1218, CMD1B, map location 9q13-q22) is a placeholder that carries no genomic
  coordinates at all. CMD1B is therefore curated here as a locus
  entry rather than a gene-anchored one. Its clinical content is the
  well-characterized FDC phenotype ascertained in the mapping kindred - impaired
  myocardial contractility with ventricular dilatation - and its mechanistic
  content is deliberately limited to the point at which the disease enters the
  conserved cardiomyopathy final common pathway. The upstream primary insult is
  recorded as an explicit knowledge gap, and the genes that sit inside the
  interval and have been raised as positional candidates (TMOD1 and PRKACG) are
  recorded as unconfirmed hypotheses, never as curated causal claims.

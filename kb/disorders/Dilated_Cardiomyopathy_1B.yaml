diagnosis:
- name: Echocardiography
  description: >-
    First-line imaging and the modality that carries the diagnostic burden for this
    locus. Left ventricular dimensions and ejection fraction establish the dilated,
    hypocontractile phenotype. Because the 9q13-q22 disease gene has never been
    identified, there is no confirmatory molecular test for CMD1B: the diagnosis is
    the echocardiographic phenotype plus the pedigree, and echocardiography is
    therefore also the only surveillance modality available to at-risk relatives.
  diagnosis_term:
    preferred_term: echocardiography
    term:
      id: NCIT:C16525
      label: Echocardiography Test
  evidence:
  - reference: PMID:31073128
    reference_title: Dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Echocardiography and other imaging techniques are required to assess
      ventricular dysfunction and adverse myocardial remodelling, and
      immunological and histological analyses of an endomyocardial biopsy sample
      are indicated when inflammation or infection is suspected.
    explanation: >-
      Establishes echocardiography as the required modality for assessing
      ventricular dysfunction and remodeling in dilated cardiomyopathy. Evidence
      source is OTHER because this is a review of the disease class.
  - reference: PMID:7573045
    reference_title: Linkage of familial dilated cardiomyopathy to chromosome 9. Heart Muscle Disease Study Group.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Idiopathic dilated cardiomyopathy is a heart muscle disease of unknown
      etiology, characterized by impaired myocardial contractility and
      ventricular dilatation.
    explanation: >-
      Names the two features an echocardiogram measures — impaired contractility
      and ventricular dilatation — as the defining characteristics of the entity
      mapped to this locus.
- name: Pedigree Analysis and Familial Screening
  description: >-
    Construction of the family pedigree and clinical screening of first-degree
    relatives. For a gene-unresolved locus this is not adjunctive but constitutive:
    the autosomal dominant transmission pattern in the six-generation kindred is
    what distinguishes familial disease from sporadic dilated cardiomyopathy, since
    no predictive or confirmatory genetic test exists to do so.
  diagnosis_term:
    preferred_term: familial clinical screening
    term:
      id: NCIT:C15419
      label: Disease Screening
  notes: >-
    The companion intervention is recorded under treatments as Cascade Clinical
    Screening of First-Degree Relatives; this entry records the same activity in
    its diagnostic role, which for CMD1B is the only route to case ascertainment.
  evidence:
  - reference: PMID:20525703
    reference_title: Prognostic impact of familial screening in dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Familial screening of patients with dilated cardiomyopathy (DCM) allows an
      early diagnosis of the disease in family members.
    explanation: >-
      Supports familial screening as a diagnostic strategy that achieves earlier
      case ascertainment in relatives.
  - reference: PMID:7573045
    reference_title: Linkage of familial dilated cardiomyopathy to chromosome 9. Heart Muscle Disease Study Group.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a large six-generation kindred with autosomal dominant FDC was studied for
      linkage analysis
    explanation: >-
      Documents the pedigree structure and dominant transmission pattern on which
      ascertainment for this locus rests.
treatments:
- name: Cascade Clinical Screening of First-Degree Relatives
  description: >-
    Echocardiographic and electrocardiographic screening of relatives is the
    only cascade strategy available for this kindred, because no gene has been
    identified and therefore no predictive genetic test exists. In the Trieste
    registry, screening identified familial DCM patients at an earlier, less
    symptomatic stage with better transplant-free survival at 2, 5 and 10 years
    than matched sporadic cases.
  treatment_term:
    preferred_term: cardiovascular screening of first-degree relatives
    term:
      id: NCIT:C15419
      label: Disease Screening
  evidence:
  - reference: PMID:20525703
    reference_title: Prognostic impact of familial screening in dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our study demonstrates that family screening can effectively identify DCM
      patients at an earlier stage of disease and can improve survival.
    explanation: >-
      Supports family screening as the actionable intervention in familial DCM,
      which for a gene-unresolved locus like CMD1B is the only available cascade
      strategy.
  - reference: PMID:20525703
    reference_title: Prognostic impact of familial screening in dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Survival free from heart transplant at 2, 5 and 10 years was 93, 91 and
      82%, respectively, in NP-FDC patients compared with 86, 76 and 62% in
      sporadic forms (P = 0.04).
    explanation: >-
      Quantifies the transplant-free survival advantage of screening-detected
      familial disease.
- name: Guideline-Directed Heart Failure Pharmacotherapy
  description: >-
    Because no molecular target exists for this locus, management is that of
    dilated cardiomyopathy with reduced ejection fraction generally:
    neurohormonal blockade with renin-angiotensin system inhibitors,
    beta-blockers, mineralocorticoid receptor antagonists, and SGLT2 inhibitors.
    No CMD1B-specific or genotype-directed therapy is possible or reported.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:31073128
    reference_title: Dilated cardiomyopathy.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      As DCM eventually leads to impaired contractility, standard approaches to
      prevent or treat heart failure are the first-line treatment for patients
      with DCM.
    explanation: >-
      Establishes heart failure pharmacotherapy as first-line treatment for
      dilated cardiomyopathy. PARTIAL and OTHER because it is a review of the
      disease class; no trial has ever enrolled CMD1B carriers, who cannot be
      identified without a gene.
  target_mechanisms:
  - target: Left Ventricular Dilation and Systolic Dysfunction
    treatment_effect: MODULATES
    description: >-
      Standard heart failure pharmacotherapy attenuates the neurohormonally
      driven remodeling that carries the ventricle to this endpoint. It targets
      the shared downstream pathway rather than the unidentified 9q13-q22
      lesion, which no available agent addresses.
    evidence:
    - reference: PMID:31073128
      reference_title: Dilated cardiomyopathy.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        As DCM eventually leads to impaired contractility, standard approaches
        to prevent or treat heart failure are the first-line treatment for
        patients with DCM.
      explanation: >-
        Establishes that management of dilated cardiomyopathy is heart failure
        management directed at the downstream phenotype. PARTIAL and OTHER
        because this is a disease-class review, not a CMD1B trial, of which
        there are none.
- name: Cardiac Resynchronization Therapy and Implantable Cardioverter Defibrillator
  description: >-
    Device therapy for the dilated, poorly contracting ventricle: resynchronization
    for conduction delay and defibrillator implantation for prevention of sudden
    arrhythmic death. Indication follows general dilated cardiomyopathy and
    arrhythmia guidelines applied to the observed phenotype. No CMD1B-specific
    arrhythmic risk-stratification rule exists, and none can exist while the gene
    is unidentified, because there is no carrier status to stratify on: at-risk
    relatives are distinguishable only by their echocardiographic and
    electrocardiographic findings.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: implantable cardioverter-defibrillator placement
    term:
      id: NCIT:C80435
      label: Implantable Cardioverter-Defibrillator Placement
  evidence:
  - reference: PMID:31073128
    reference_title: Dilated cardiomyopathy.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Cardiac resynchronization therapy and implantable cardioverter-defibrillators
      may be required to prevent life-threatening arrhythmias.
    explanation: >-
      Establishes device therapy for arrhythmic protection as part of standard
      dilated cardiomyopathy care. PARTIAL and OTHER for the same reason as the
      pharmacotherapy entry: this is a review of the disease class, and no trial
      has enrolled CMD1B kindreds, who cannot be identified without a gene.
- name: Heart Transplantation
  description: >-
    Advanced therapy for end-stage heart failure once the ventricle is no longer
    supportable medically, with mechanical circulatory support as a bridge. The
    founding report of this locus frames transplantation as the clinical weight of
    the disease entity rather than a rare tail event. Cascade echocardiographic
    screening of this kindred is measured in transplant-free survival, which makes
    transplantation the explicit endpoint the surveillance strategy is trying to
    postpone.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Organ transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  evidence:
  - reference: PMID:7573045
    reference_title: Linkage of familial dilated cardiomyopathy to chromosome 9. Heart Muscle Disease Study Group.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The disorder is an important cause of morbidity and mortality and represents
      the chief indication for heart transplantation.
    explanation: >-
      The founding linkage report for this locus states transplantation as the
      chief indication arising from the disease entity it maps.
  - reference: PMID:20525703
    reference_title: Prognostic impact of familial screening in dilated cardiomyopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Survival free from heart transplant at 2, 5 and 10 years was 93, 91 and
      82%, respectively, in NP-FDC patients compared with 86, 76 and 62% in
      sporadic forms (P = 0.04).
    explanation: >-
      Uses transplantation as the survival endpoint in familial dilated
      cardiomyopathy, confirming it as a realized outcome in this population
      rather than a theoretical option.
- name: Genetic Counseling
  description: >-
    Counseling for an autosomal dominant familial cardiomyopathy in which the
    causal gene is unknown. The recurrence risk of 50% for offspring follows
    from the transmission pattern, but carrier status cannot be determined
    molecularly, so counseling must direct at-risk relatives to serial clinical
    surveillance rather than to a predictive test.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:39519012
    reference_title: "Dilated Cardiomyopathy: A Genetic Journey from Past to Future."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Current guidelines recommend genetic counseling and screening, as well as
      endorsing a handful of genotype-specific therapies
    explanation: >-
      Supports genetic counseling as standard in genetic DCM. PARTIAL because
      the genotype-specific therapy arm of that recommendation is unavailable
      for a locus with no identified gene.
discussions:
- discussion_id: cmd1b_causal_gene_unidentified
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which gene in the 9q13-q22 interval between D9S153 and D9S152 causes CMD1B,
    and is the locus still a distinct disease entity thirty years after it was
    mapped?
  attaches_to:
  - "pathophysiology#Unidentified 9q13-q22 Disease Locus"
  rationale: >-
    This is the central open question of the entry and the reason its
    pathophysiology chain begins with a placeholder node. The linkage evidence
    is strong - a maximum multipoint LOD of 4.2, exclusion of more than 95% of
    the genome across 251 markers, replication in two additional families, and
    no evidence of heterogeneity - so the locus is unlikely to be a false
    positive, yet no gene has been confirmed in the three decades since. MONDO
    still defines the entity by chromosome region rather than by gene, and NCBI
    Gene 1218 returns no genomic coordinates. The original report
    named positional candidates within the interval, of which TMOD1
    (tropomodulin 1, 9q22.33) is the most biologically attractive: tropomodulin
    caps the pointed end of the sarcomeric actin thin filament, and
    tropomodulin-overexpressing transgenic mice develop progressive dilated
    cardiomyopathy. That mouse phenotype is evidence of plausibility only; no
    TMOD1 variant has ever been reported in this kindred or in any other family
    with this locus, and the same is true of PRKACG (9q21.11). Resolution now
    would most plausibly come from whole-genome sequencing of surviving members
    of the original pedigree, which would also address the alternative
    possibilities that the causal variant is non-coding or structural and so
    invisible to the exome-based panels that dominate DCM testing, or that the
    kindred's disease has since been reassigned to a gene now known to cause DCM
    but not resident at 9q13-q22, which would retire the locus. Note that TMOD1
    and PRKACG are named here as positional candidates on the strength of
    secondary sources plus independently verified map positions inside the
    interval; the cached abstract of the original report does not name them.
  evidence:
  - reference: PMID:7573045
    reference_title: Linkage of familial dilated cardiomyopathy to chromosome 9. Heart Muscle Disease Study Group.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Several candidate genes for causing dilated cardiomyopathy map in this
      region.
    explanation: >-
      The original report closes by naming the interval's candidates as
      unresolved, which is the state the locus has remained in since.
  - reference: PMID:10595939
    reference_title: "Pathogenesis of dilated cardiomyopathy: molecular, structural, and population analyses in tropomodulin-overexpressing transgenic mice."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Previously unexplored structural and molecular events that precede and
      initiate dilation can now be studied in tropomodulin-overexpressing
      transgenic (TOT) mice exhibiting progressive dilated cardiomyopathy.
    explanation: >-
      Shows that altered tropomodulin dosage produces dilated cardiomyopathy in
      mice, which is why TMOD1 was an attractive positional candidate. PARTIAL
      and MODEL_ORGANISM because this is a transgenic overexpression model that
      says nothing about the 9q13-q22 locus or about any human TMOD1 variant.
  - reference: PMID:37795486
    reference_title: Diagnostic yield of genetic testing in a multinational heterogeneous cohort of 2088 DCM patients.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Over half of the patients undergoing comprehensive genetic testing are
      left without a molecular diagnosis even when patient selection follows
      strict DCM criteria.
    explanation: >-
      Places the unresolved status of CMD1B in context: the majority of
      clinically well-characterized DCM remains molecularly undiagnosed on
      current panels, so an unsolved dominant locus is the norm rather than an
      anomaly. PARTIAL because the cohort is unselected DCM, not this kindred.
  - reference: PMID:33983834
    reference_title: The Complex and Diverse Genetic Architecture of Dilated Cardiomyopathy.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The foundations of DCM genetics rest on marked locus and allelic
      heterogeneity.
    explanation: >-
      Frames why a large number of independently mapped DCM loci exist and why
      several, including this one, remain without an assigned gene. PARTIAL and
      OTHER because it is a review of the disease class.
  notes: >-
    A curator reviewing this entry should resist the temptation to close the gap
    by binding TMOD1 or PRKACG as the causal gene. Neither has ever been shown
    to carry a variant segregating with disease in this kindred, and asserting
    one would convert a positional coincidence into a fabricated gene-disease
    claim.

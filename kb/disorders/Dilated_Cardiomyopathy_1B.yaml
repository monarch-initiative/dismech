notes: >-
  Identifier cross-references not carried by a dedicated schema slot: OMIM
  600884 (CARDIOMYOPATHY, DILATED, 1B; CMD1B); NCBI Gene ID 1218 (CMD1B, map
  location 9q13-q22, a record that returns no genomic coordinates, consistent
  with a phenotype-only placeholder); MedGen C5700078; DOID:0110443;
  GARD:0015323. Secondary sources report that OMIM carries 600884 with the "%"
  prefix denoting a confirmed phenotype or locus of unknown molecular basis;
  omim.org blocked automated retrieval during curation, so that specific detail
  was not independently confirmed and is not relied on anywhere in this entry. The positional candidate genes
  most often named for this interval are TMOD1 (tropomodulin 1, hgnc:11871) and
  PRKACG (protein kinase cAMP-activated catalytic subunit gamma, hgnc:9382);
  FXN (hgnc:3951) lies in the same region and is of positional interest because
  Friedreich ataxia carries its own cardiomyopathy. None of the three has been
  confirmed as causal here. Their map locations were verified independently
  against NCBI Gene (TMOD1 9q22.33, PRKACG 9q21.11, FXN 9q21.11), all inside or
  immediately adjacent to the 9q13-q22 interval; the attribution of these
  specific names to the discussion in Krajinovic et al. comes from secondary
  sources, since the abstract cached for PMID:7573045 says only that candidate
  genes map to the region and the full text was not retrievable during
  curation. They are therefore recorded as notes and as an open discussion
  rather than as evidence-backed assertions.
  The GeneReviews reference above is the Dilated Cardiomyopathy Overview chapter;
  there is no gene-specific GeneReviews chapter for CMD1B, and the cached
  abstract of the Overview is a statement of scope rather than a Clinical
  Characteristics section, so it supplies no phenotype baseline to cross-check
  against.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No prevalence estimate exists for CMD1B. The locus rests on a single
    six-generation kindred plus two further families reported in one 1995
    linkage study, and because no causal gene was ever identified there is no
    variant to ascertain in any subsequent cohort. For context on the parent
    category, familial disease accounted for 130 of 637 (20.4%) consecutively
    enrolled dilated cardiomyopathy patients in the Trieste group's registry;
    that series and the mapping study share investigators (Pinamonti, Gregori,
    Mestroni, Sinagra) and the same Heart Muscle Disease Study Group programme,
    though the 1995 report does not state that its kindred was drawn from this
    enrolment window.
  evidence:
  - reference: PMID:20525703
    reference_title: Prognostic impact of familial screening in dilated cardiomyopathy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Between 1988 and 2007, 637 DCM patients were consecutively enrolled. Of
      these, 130 patients (20.4%) had FDC, including 82 (12.9%) probands and 48
      (7.5%) non-proband FDC patients (NP-FDC), identified by family screening.
    explanation: >-
      Gives the familial fraction of dilated cardiomyopathy in the Trieste
      group's consecutive registry, the closest available denominator for this
      locus. PARTIAL because it quantifies familial DCM as a whole, not CMD1B,
      for which no rate is or can currently be estimated.
inheritance:
- name: Autosomal dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant transmission was established by segregation in a large
    six-generation kindred and confirmed by linkage; the mapping was then
    extended to two further families with the same pattern of transmission.
    Penetrance and age of onset were not quantified for this kindred in the
    published abstract and are not curated here.
  evidence:
  - reference: PMID:7573045
    reference_title: Linkage of familial dilated cardiomyopathy to chromosome 9. Heart Muscle Disease Study Group.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a large six-generation kindred with autosomal dominant FDC was studied for
      linkage analysis
    explanation: >-
      States the autosomal dominant mode of inheritance in the kindred that
      defines this locus.
genetic:
- name: CMD1B locus (9q13-q22)
  relationship_type: UNKNOWN
  presence: Linkage-defined locus; no causal gene identified
  association: >-
    Linkage to 9q13-q22 between D9S153 and D9S152, maximum multipoint LOD 4.2,
    in a six-generation autosomal dominant FDC kindred extended to two further
    families with no evidence of heterogeneity.
  notes: >-
    Deliberately carries no gene_term. No gene in this interval has been
    confirmed causal, so binding an HGNC identifier here would assert a
    gene-disease relationship the literature does not support. TMOD1 and PRKACG
    are positional candidates only and are recorded in the entry notes and in
    the open KNOWLEDGE_GAP discussion.
  evidence:
  - reference: PMID:7573045
    reference_title: Linkage of familial dilated cardiomyopathy to chromosome 9. Heart Muscle Disease Study Group.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Linkage was found for chromosome 9q13-q22, with a maximum multipoint lod
      score of 4.2. There was no evidence of heterogeneity. The FDC locus was
      placed in the interval between loci D9S153 and D9S152.
    explanation: >-
      Establishes the locus, its interval boundaries, and the strength of the
      linkage evidence that defines CMD1B.
  - reference: PMID:7573045
    reference_title: Linkage of familial dilated cardiomyopathy to chromosome 9. Heart Muscle Disease Study Group.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A genome-wide search was undertaken after a large series of candidate
      genes were excluded and was then extended to two other families with
      autosomal dominant pattern of transmission and identical clinical
      features. Coinheritance of the disease gene was excluded for > 95% of the
      genome, after 251 polymorphic markers were analyzed.
    explanation: >-
      Documents that the locus was reached by exclusion mapping across most of
      the genome and replicated in two additional families, which is what makes
      the linkage signal credible despite the causal gene remaining unknown.
  - reference: PMID:7573045
    reference_title: Linkage of familial dilated cardiomyopathy to chromosome 9. Heart Muscle Disease Study Group.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Several candidate genes for causing dilated cardiomyopathy map in this
      region.
    explanation: >-
      The original report notes that positional candidates exist in the
      interval without naming any of them in the abstract. PARTIAL because the
      sentence establishes only that candidates were present, supporting no
      individual gene as causal.
pathophysiology:
- name: Unidentified 9q13-q22 Disease Locus
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    The primary lesion of CMD1B is a dominantly transmitted variant somewhere in
    the 9q13-q22 interval between D9S153 and D9S152. Its molecular identity is
    unknown: no gene, transcript, protein, or variant class has been established
    for this locus, so this node is an explicitly unresolved placeholder rather
    than a mechanistic claim. It is deliberately NOT declared as conforming to
    the cardiomyopathy_maladaptive_remodeling module's "Primary Cardiomyocyte
    Insult" node, because the nature of the insult is precisely what is not
    known here; conformance begins downstream, where the disease enters the
    shared pathway with an evidenced phenotype.
  evidence:
  - reference: PMID:7573045
    reference_title: Linkage of familial dilated cardiomyopathy to chromosome 9. Heart Muscle Disease Study Group.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Linkage was found for chromosome 9q13-q22, with a maximum multipoint lod
      score of 4.2.
    explanation: >-
      Localizes the disease-causing variant to this interval, which is the whole
      of what is established about the primary lesion.
  downstream:
  - target: Impaired Myocardial Contractility
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The locus segregates with the cardiomyopathy phenotype in the kindred, so
      the causal chain runs from the 9q13-q22 variant to depressed myocardial
      contractility. Every intermediate step is unknown, since neither the gene
      nor the protein it encodes has been identified.
    evidence:
    - reference: PMID:7573045
      reference_title: Linkage of familial dilated cardiomyopathy to chromosome 9. Heart Muscle Disease Study Group.
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Idiopathic dilated cardiomyopathy is a heart muscle disease of unknown
        etiology, characterized by impaired myocardial contractility and
        ventricular dilatation.
      explanation: >-
        Defines the phenotype that co-segregates with the 9q13-q22 haplotype.
        PARTIAL because linkage establishes co-segregation, not the mechanistic
        route from locus to contractile failure, which remains entirely unknown.
- name: Impaired Myocardial Contractility
  biological_scale: CELLULAR
  role: effector
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Progressive Contractile Dysfunction"
  description: >-
    Cardiomyocyte force generation falls, reducing systolic shortening. This is
    the first step of the CMD1B chain that is actually observed rather than
    inferred: impaired contractility is part of the diagnostic definition of the
    phenotype ascertained in the mapping families. It is the point at which the
    disease joins the conserved cardiomyopathy pathway, and the substitution
    this disorder makes in that pathway is a null one - the upstream driver is
    unidentified.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Heart Contraction
    term:
      id: GO:0060047
      label: heart contraction
    modifier: DECREASED
  evidence:
  - reference: PMID:7573045
    reference_title: Linkage of familial dilated cardiomyopathy to chromosome 9. Heart Muscle Disease Study Group.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      characterized by impaired myocardial contractility and ventricular
      dilatation
    explanation: >-
      Impaired myocardial contractility is a defining feature of the phenotype
      mapped to this locus.
  - reference: PMID:31073128
    reference_title: Dilated cardiomyopathy.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      As DCM eventually leads to impaired contractility, standard approaches to
      prevent or treat heart failure are the first-line treatment for patients
      with DCM.
    explanation: >-
      Confirms progression to impaired contractility as the shared endpoint of
      dilated cardiomyopathy. PARTIAL and OTHER because this is a review of the
      disease class, not a study of the CMD1B locus.
  downstream:
  - target: Left Ventricular Dilation and Systolic Dysfunction
    causal_link_type: DIRECT
    description: >-
      Falling contractile performance is accompanied by chamber dilation, the
      two together constituting the dilated cardiomyopathy phenotype.
    evidence:
    - reference: PMID:7573045
      reference_title: Linkage of familial dilated cardiomyopathy to chromosome 9. Heart Muscle Disease Study Group.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        characterized by impaired myocardial contractility and ventricular
        dilatation
      explanation: >-
        Pairs impaired contractility with ventricular dilatation as the
        co-occurring features of the mapped phenotype.
- name: Left Ventricular Dilation and Systolic Dysfunction
  biological_scale: ORGANISM
  role: consequence
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Structural Cardiac Impairment and Heart Failure"
  description: >-
    The clinical endpoint: a dilated, poorly contracting left ventricle that
    cannot meet circulatory demand, progressing to heart failure. In the
    Trieste group's registry, familial cases identified
    through family screening were detected younger and with higher ejection
    fraction than sporadic cases, indicating that the endpoint is reached
    progressively and can be intercepted before symptoms.
  biological_processes:
  - preferred_term: Heart Contraction
    term:
      id: GO:0060047
      label: heart contraction
    modifier: ABNORMAL
  evidence:
  - reference: PMID:7573045
    reference_title: Linkage of familial dilated cardiomyopathy to chromosome 9. Heart Muscle Disease Study Group.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Idiopathic dilated cardiomyopathy is a heart muscle disease of unknown
      etiology, characterized by impaired myocardial contractility and
      ventricular dilatation. The disorder is an important cause of morbidity
      and mortality and represents the chief indication for heart
      transplantation.
    explanation: >-
      States the structural endpoint and its clinical weight for the disease
      entity mapped to this locus.
  - reference: PMID:20525703
    reference_title: Prognostic impact of familial screening in dilated cardiomyopathy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      At enrolment the NP-FDC patients were younger (40 +/- 16 vs. 48 +/- 13
      years, P = 0.002), less symptomatic [New York Heart Association, (NYHA)
      III-IV: 8 vs. 28%, P = 0.006], had higher left ventricular ejection
      fraction (35 +/- 10 vs. 30 +/- 9%, P = 0.005)
    explanation: >-
      Shows that in familial DCM identified by screening the same endpoint is
      reached at a milder stage. PARTIAL because the cohort is familial DCM in
      general, not CMD1B specifically.

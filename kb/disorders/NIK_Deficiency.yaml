    reference_title: "Long-term outcome of bone marrow transplantation in NIK deficiency: non-redundant role of non-canonical NF-κB signaling in thymic reconstitution and secondary lymphoid organ development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Despite complete donor chimerism, IgG levels and switched memory B cells remained low, requiring ongoing IVIG."
    explanation: Immunoglobulin replacement remained necessary despite transplantation.
diagnosis:
- name: Molecular genetic testing for biallelic MAP3K14 variants
  description: >-
    Diagnosis rests on finding biallelic loss-of-function MAP3K14 variants, since the
    combined immunodeficiency with normal or raised lymphocyte counts and the atypical
    infection spectrum (BCG, Cryptosporidium) overlap with other inborn errors of
    immunity. Exome sequencing identified the causal variant in both reported families.
  presence: PRESENT
  evidence:
  - reference: PMID:29230214
    reference_title: "Exome Sequencing Identifies a Novel MAP3K14 Mutation in Recessive Atypical Combined Immunodeficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This study describes the use of exome sequencing to identify a homozygous recessive variant in MAP3K14, NIKVal345Met, in a patient with combined immunodeficiency, disseminated BCG-osis, and paradoxically elevated lymphocytes."
    explanation: Exome sequencing established the molecular diagnosis in the South African patient.
- name: Functional non-canonical NF-kappaB pathway testing
  description: >-
    Supportive functional evidence comes from showing defective p100-to-p52 processing
    and reduced RelB nuclear translocation in patient cells on stimulation of BAFFR,
    CD40 or the lymphotoxin-beta receptor.
  presence: PRESENT
  evidence:
  - reference: PMID:25406581
    reference_title: "Biallelic loss-of-function mutation in NIK causes a primary immunodeficiency with multifaceted aberrant lymphoid immunity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "resulting in a severely reduced nuclear content of p52 and a lower nuclear content of RelB in patient-derived cells"
    explanation: Patient cells show the defective non-canonical NF-kappaB readout used to confirm the functional defect.
discussions:
- discussion_id: gap_nik_anti_ifn_autoantibodies
  prompt: >-
    Do NIK-deficient patients develop neutralizing anti-type-I-interferon
    autoantibodies, as reported after transplantation in the related non-canonical
    NF-kappaB disorder RELB deficiency?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Post-transplant Immune Dysregulation and Autoimmunity
  rationale: >-
    PMID:41280889 could not evaluate anti-type-I-IFN autoantibodies in its NIK
    patients but recommends screening for them, because such autoantibodies arise
    after HSCT in RELB deficiency and would explain persistent viral susceptibility
    despite immune reconstitution. No NIK-deficient patient has yet been tested, so
    this is an open question rather than a curated mechanism.
  evidence:
  - reference: PMID:41280889
    reference_title: "Long-term outcome of bone marrow transplantation in NIK deficiency: non-redundant role of non-canonical NF-κB signaling in thymic reconstitution and secondary lymphoid organ development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This should include regular screening for anti-type I IFN autoantibodies to identify patients at risk for delayed infectious complications."
    explanation: The human report recommends screening for these autoantibodies, which have not yet been evaluated in NIK deficiency.
animal_models:
- name: aly/aly mouse (spontaneous Nik point mutation)
  species: Mouse
  genotype: Nik aly/aly (C-terminal point mutation, autosomal recessive)
  publication: PMID:10319865
  description: >-
    The alymphoplasia (aly) mouse carries a spontaneous point mutation in the
    C-terminal interaction domain of Nik and is the classic model of the disease. It
    lacks all lymph nodes and Peyer's patches, has disorganized splenic and thymic
    architecture, and is immunodeficient; transgenic wild-type Nik restores these
    structures.
  modeled_mechanisms:
  - target: Defective Secondary Lymphoid Organ Development
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: Reproduces the systemic absence of lymph nodes and Peyer's patches and disorganized spleen and thymus.
    limitations: >-
      The aly allele is a hypomorphic C-terminal point mutation in the mouse ortholog
      rather than a human kinase-domain missense variant, and the mouse lacks all
      lymph nodes whereas the human stromal defect is inferred clinically; species
      differences in lymphoid organogenesis limit direct translation.
    evidence:
    - reference: PMID:10319865
      reference_title: "Alymphoplasia is caused by a point mutation in the mouse gene encoding Nf-kappa b-inducing kinase."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The alymphoplasia (aly) mutation of mouse is autosomal recessive and characterized by the systemic absence of lymph nodes (LN) and Peyer's patches (PP) and disorganized splenic and thymic structures with immunodeficiency."
      explanation: Establishes the aly mouse as the Nik-mutant model of absent lymphoid organs and immunodeficiency.
- name: TEC-specific Nik knockout mouse
  species: Mouse
  genotype: Thymic-epithelial-cell-specific Nik ablation
  publication: PMID:31481626
  description: >-
    Mice with NIK ablated specifically in thymic epithelial cells fail to develop
    medullary thymic epithelial cells, break central tolerance, and develop fatal
    autoimmune destruction, modelling the thymic central-tolerance arm of the human
    disease.
  modeled_mechanisms:
  - target: Defective Thymic Central Tolerance
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: TEC-specific loss of NIK abrogates medullary TEC development and central tolerance, producing autoreactive T cells.
    limitations: >-
      The model is a conditional tissue-specific knockout rather than the germline
      biallelic hypomorphic state of patients, and the fatal early autoimmunity is
      more severe and earlier than the human phenotype.
    evidence:
    - reference: PMID:31481626
      reference_title: "Medullary thymic epithelial NF-kB-inducing kinase (NIK)/IKKα pathway shapes autoimmunity and liver and lung homeostasis in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "NIK or IKKα deficiency abrogated medullary TEC development, and led to breakdown of central tolerance, production of autoreactive T cells, and fatal autoimmune destruction in the liver and lung."
      explanation: Shows that thymic-epithelial NIK loss breaks central tolerance, the mechanism behind the human autoimmune features.

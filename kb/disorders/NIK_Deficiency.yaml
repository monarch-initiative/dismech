  notes: >-
    Known only from case reports in a small number of consanguineous families since
    the first description in 2014; there is no registry or population estimate. The
    index pedigree carried a homozygous p.Pro565Arg allele, and a separate South
    African family carried a homozygous p.Val345Met allele.
  evidence:

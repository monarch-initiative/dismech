  evidence:
  - reference: PMID:25406581
    reference_title: "Biallelic loss-of-function mutation in NIK causes a primary immunodeficiency with multifaceted aberrant lymphoid immunity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Loss of kinase activity of mutant NIK, predicted by in silico analysis and confirmed by functional assays, leads to defective activation of both canonical and non-canonical NF-κB signalling."
    explanation: Establishes the proximal lesion, loss of NIK kinase activity impairing NF-kappaB signalling.
  downstream:
  - target: Impaired p100-to-p52 Processing and Non-canonical NF-kappaB Failure
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11239468
      reference_title: "NF-kappaB-inducing kinase regulates the processing of NF-kappaB2 p100."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "NIK induces p100 processing by stimulating site-specific phosphorylation and ubiquitination of this precursor protein."
      explanation: NIK is the kinase that drives p100 processing, so loss of NIK activity blocks this step directly.
- name: Impaired p100-to-p52 Processing and Non-canonical NF-kappaB Failure
  biological_scale: MOLECULAR
  description: >-
    Without NIK activity, IKK-alpha is not phosphorylated, p100 accumulates and is
    not processed to p52, and unprocessed p100 sequesters RelB. The RelB-p52
    transcription factor therefore fails to form and translocate to the nucleus, so
    the gene programme downstream of BAFFR, CD40 and the lymphotoxin-beta receptor is
    not activated.
  biological_processes:
  - preferred_term: non-canonical NF-kappaB signal transduction
    term:
      id: GO:0038061
      label: non-canonical NF-kappaB signal transduction
    modifier: DECREASED
  evidence:
  - reference: PMID:25406581
    reference_title: "Biallelic loss-of-function mutation in NIK causes a primary immunodeficiency with multifaceted aberrant lymphoid immunity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Despite p100 accumulation, p52 protein levels were decreased"
    explanation: Patient-derived cells accumulate p100 but fail to generate p52, the hallmark of the non-canonical pathway block.
  - reference: PMID:25406581
    reference_title: "Biallelic loss-of-function mutation in NIK causes a primary immunodeficiency with multifaceted aberrant lymphoid immunity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In line with this, unprocessed p100 is known to specifically sequester and inhibit RelB5, leading to a severe signalling defect."
    explanation: Explains why accumulated p100 compounds the defect by sequestering RelB.
  downstream:
  - target: Impaired B-cell Survival and Maturation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:12352969
      reference_title: "BAFF-induced NEMO-independent processing of NF-kappa B2 in maturing B cells."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "this requires the BAFF receptor (BAFF-R), the NF-kappa B-inducing kinase (NIK) and protein synthesis, but not NEMO. This NEMO-independent cascade is physiologically relevant for the survival and, hence, progression of maturing splenic B cells."
      explanation: BAFFR-driven B-cell survival depends on NIK, so loss of NIK impairs B-cell survival and maturation.
  - target: Defective T Follicular Helper and Memory T-cell Responses
    causal_link_type: DIRECT
    evidence:

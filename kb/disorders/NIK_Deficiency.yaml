    evidence_source: HUMAN_CLINICAL
    snippet: "We studied a large consanguineous pedigree with two patients (termed P1 and P2) who showed signs of combined immunodeficiency"
    explanation: >-
      The index report establishes the disease in a single consanguineous family,
      which with a few later families is the whole epidemiological record.

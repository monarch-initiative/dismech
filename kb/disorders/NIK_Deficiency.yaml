treatments:
- name: Hematopoietic Stem Cell Transplantation
  description: >-
    Allogeneic haematopoietic stem cell transplantation has been used as the only
    potentially curative treatment and corrects the haematopoietic lymphocyte
    defects. However, it does not repair the non-haematopoietic lymph-node stromal
    and thymic-epithelial defects, so memory responses, hypogammaglobulinemia and
    central tolerance remain incompletely corrected and late immune dysregulation
    can emerge.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic hematopoietic stem cell transplantation
    term:
      id: NCIT:C46089
      label: Allogeneic Hematopoietic Stem Cell Transplantation
  target_mechanisms:
  - target: Impaired B-cell Survival and Maturation
    description: Donor-derived cells carry functional NIK, partially reconstituting B-cell differentiation, though class-switched memory B cells remain reduced.
    evidence:
    - reference: PMID:41280889
      reference_title: "Long-term outcome of bone marrow transplantation in NIK deficiency: non-redundant role of non-canonical NF-κB signaling in thymic reconstitution and secondary lymphoid organ development."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "B-cell reconstitution was incomplete, characterized by persistent hypogammaglobulinemia and a marked deficiency in class-switched memory B cells, despite donor-derived chimerism."
      explanation: HSCT acts on the B-cell maturation defect but corrects it only partially, leaving hypogammaglobulinemia and reduced class-switched memory B cells.
  evidence:
  - reference: PMID:41280889
    reference_title: "Long-term outcome of bone marrow transplantation in NIK deficiency: non-redundant role of non-canonical NF-κB signaling in thymic reconstitution and secondary lymphoid organ development."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hematopoietic stem cell transplantation (HSCT) has been considered a curative approach, yet its long-term efficacy remains unclear."
    explanation: States HSCT as the considered curative approach with uncertain long-term efficacy.
  - reference: PMID:25406581
    reference_title: "Biallelic loss-of-function mutation in NIK causes a primary immunodeficiency with multifaceted aberrant lymphoid immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "allogeneic haematopoietic stem cell transplantation (aHSCT) improved the overall condition of patient P1, suggesting that functional NIK deficiency is amenable to aHSCT to at least partially correct the disease."
    explanation: HSCT at least partially corrected the disease in the index patient P1.
- name: Immunoglobulin Replacement Therapy
  description: >-
    Lifelong intravenous immunoglobulin supplementation is supportive care for the
    hypogammaglobulinemia and remains necessary even after transplantation because of
    persistent antibody deficiency.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: intravenous immunoglobulin therapy
    term:
      id: NCIT:C121331
      label: Intravenous Immunoglobulin Therapy
    therapeutic_agent:
    - preferred_term: human immunoglobulin G
      term:
        id: NCIT:C80829
        label: Human Immunoglobulin G
  evidence:

genetic:
- name: MAP3K14
  gene_term:
    preferred_term: MAP3K14
    term:
      id: hgnc:6853
      label: MAP3K14
  relationship_type: CAUSATIVE
  presence: PRESENT
  variant_origin: GERMLINE
  notes: >-
    Reported alleles are homozygous missense variants that destroy NIK kinase
    activity: p.Pro565Arg in the index consanguineous pedigree (PMID:25406581,
    a residue near the ATP-coordinating centre of the kinase domain) and p.Val345Met
    in a South African family (PMID:29230214). Both abolish or severely reduce
    phosphorylation of IKK-alpha and processing of p100 to p52.
  evidence:
  - reference: PMID:25406581
    reference_title: "Biallelic loss-of-function mutation in NIK causes a primary immunodeficiency with multifaceted aberrant lymphoid immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a single homozygous variant on chromosome 17q21 in MAP3K14 (c. C1694G, p. Pro565Arg) present in both patients"
    explanation: The homozygous p.Pro565Arg allele in the two index patients.
  - reference: PMID:25406581
    reference_title: "Biallelic loss-of-function mutation in NIK causes a primary immunodeficiency with multifaceted aberrant lymphoid immunity."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "As the NIKPro565Arg mutant is catalytically inactive and therefore deleterious to these functions, the phenotype caused by NIKPro565Arg is hereafter also referred to as functional NIK deficiency."
    explanation: >-
      Functional assays show the patient allele is catalytically dead, establishing
      loss of function rather than segregation alone.
  variants:
  - name: p.Pro565Arg
    description: >-
      Homozygous MAP3K14 c.1694C>G, p.Pro565Arg in the index consanguineous pedigree.
      Pro565 sits near the ATP-coordinating centre of the kinase domain; the
      substitution renders NIK catalytically inactive.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:25406581
      reference_title: "Biallelic loss-of-function mutation in NIK causes a primary immunodeficiency with multifaceted aberrant lymphoid immunity."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "In the NIKwild-type simulation, Pro565 remains buried within the protein in the vicinity of the ATP-coordinating centre"
      explanation: A molecular-dynamics simulation locating Pro565 at the kinase ATP-coordinating centre, explaining why its substitution is catalytically deleterious.
  - name: p.Val345Met
    description: >-
      Homozygous MAP3K14 p.Val345Met in a consanguineous South African family;
      predicted deleterious and shown in transfected cells to reduce NIK kinase
      activity, lowering phospho-IKK-alpha and p52 and raising p100.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:29230214
      reference_title: "Exome Sequencing Identifies a Novel MAP3K14 Mutation in Recessive Atypical Combined Immunodeficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Functional analysis of NIKVal345Met- versus NIKWT-transfected human embryonic kidney-293T cells showed that this mutation significantly affects the kinase activity of NIK leading to decreased levels of phosphorylated IkappaB kinase-alpha (IKKα), the target of NIK."
      explanation: Functional confirmation that p.Val345Met reduces NIK kinase activity toward IKK-alpha.
pathophysiology:
- name: Loss of NIK Kinase Activity
  biological_scale: MOLECULAR
  description: >-
    Biallelic MAP3K14 missense variants abolish the kinase activity of NIK, the MAP3
    kinase that is the apex of the non-canonical NF-kappaB pathway. Because NIK
    normally phosphorylates IKK-alpha, loss of its activity blocks the downstream
    step of p100 processing.

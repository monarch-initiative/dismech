name: Central Nervous System Germ Cell Tumor
creation_date: "2026-07-26T08:57:31Z"
synonyms:
- CNS germ cell tumor
description: >-
  Central nervous system germ cell tumors are rare, biologically heterogeneous
  tumors arising mainly in children and adolescents. The family includes
  germinoma and nongerminomatous germ cell tumors (NGGCTs), the latter
  comprising teratoma, embryonal carcinoma, yolk sac tumor, choriocarcinoma, and
  mixed histologies. Cross-sectional tumor profiling supports distinct
  developmental and molecular states across these groups, but does not by
  itself establish a single cell of origin, one universal MAPK/PI3K causal
  chain, or a molecular mechanism of refractory NGGCT. The MONDO disease term
  covers the CNS umbrella. Most directly applicable tumor and treatment evidence
  curated here is intracranial; explicitly labeled non-tumor developmental and
  extracranial germ-cell evidence remains indirect. None should be generalized
  to rare primary spinal CNS germ cell tumors without site-specific evidence.
categories:
- Central Nervous System Neoplasm
- Germ Cell Neoplasm
- Pediatric Brain Tumor
parents:
- central nervous system neoplasm
- extragonadal germ cell tumor
disease_term:
  preferred_term: central nervous system germ cell tumor
  term:
    id: MONDO:0003000
    label: central nervous system germ cell tumor
classifications:
  harrisons_chapter:
  - classification_value: ONCOLOGY_HEMATOLOGY
definitions:
- name: CNS germ cell tumor literature scope
  definition_type: OTHER
  scope: >-
    MONDO-level CNS disease-family scope encompassing germinoma and
    nongerminomatous germ cell tumors. Core disease evidence is intracranial;
    non-tumor developmental and extracranial comparator studies are explicitly
    indirect.
  description: >-
    A CNS germ cell tumor family that primarily affects children and
    adolescents and is divided clinically into germinoma and NGGCT; individual
    components range from mature teratoma to malignant histologies.
  evidence:
  - reference: PMID:42419530
    reference_title: Advances in diagnosis and treatment of intracranial germ cell tumors and future directions.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Intracranial germ cell tumors (IGCTs) are a group of malignant central
      nervous system (CNS) tumors primarily affecting children and adolescents,
      whose pathogenesis remains incompletely understood.
    explanation: >-
      The seed review supports the broad CNS tumor-family scope, typical age
      group, and unresolved pathogenesis, but its malignant-tumor wording does
      not capture mature teratoma within the broader ontology class.
prevalence:
- population: Children aged 0-14 years in Kumamoto Prefecture, Japan
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BAND_1_9_PER_1000000
  rate_per_100000: 0.45
  notes: >-
    Age-adjusted annual incidence over a 23-year regional survey; this regional
    estimate should not be treated as a global rate.
  evidence:
  - reference: PMID:24751890
    reference_title: "Incidence of primary central nervous system germ cell tumors in childhood: a regional survey in Kumamoto prefecture in southern Japan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The age-adjusted annual incidence rate was 0.45 cases (boys: 0.64, girls:
      0.28) per 10(5) children.
    explanation: >-
      The population-based regional survey directly supplies an annual
      pediatric incidence estimate and sex-stratified rates for Kumamoto.
has_subtypes:
- name: Central Nervous System Germinoma
  display_name: CNS germinoma
  subtype_term:
    preferred_term: central nervous system germinoma
    term:
      id: MONDO:0002999
      label: central nervous system germinoma
  description: >-
    The germinoma arm of the CNS germ cell tumor family. Human tumor
    methylation and transcriptome studies find a primordial-germ-cell-like,
    globally hypomethylated state, but resemblance to a developmental reference
    state is not direct lineage evidence.
  evidence:
  - reference: PMID:28078450
    reference_title: Genome-wide methylation profiles in primary intracranial germ cell tumors indicate a primordial germ cell origin for germinomas.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We showed that pure germinomas are characterized by global low DNA
      methylation, a unique epigenetic feature making them distinct from all
      other iGCTs subtypes.
    explanation: >-
      Genome-wide methylation profiling of human tumors supports a distinct
      germinoma epigenetic state without proving developmental ancestry.
- name: Central Nervous System Nongerminomatous Germ Cell Tumor
  display_name: CNS NGGCT
  subtype_term:
    preferred_term: central nervous system nongerminomatous germ cell tumor
    term:
      id: MONDO:0020574
      label: central nervous system nongerminomatous germ cell tumor
  description: >-
    The non-germinoma arm, encompassing several pure and mixed histologies with
    different differentiation states, biomarkers, treatment responses, and
    relapse patterns. This umbrella should not be represented as though every
    component shares one resistance mechanism.
  evidence:
  - reference: PMID:35137206
    reference_title: Transcriptome and methylome analysis of CNS germ cell tumor finds its cell-of-origin in embryogenesis and reveals shared similarities with testicular counterparts.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genome-wide transcriptome analysis in CNS GCTs indicated that germinoma
      had a transcriptomic profile representative of primitive cells during
      early embryogenesis with high meiosis/mitosis potentials, while
      nongerminomatous GCTs (NGGCTs) had differentiated phenotypes oriented
      toward tissue formation and organogenesis.
    explanation: >-
      Integrative human tumor profiling supports molecular and developmental
      state differences between germinoma and NGGCT.
- name: Central Nervous System Embryonal Carcinoma
  display_name: CNS embryonal carcinoma
  subtype_term:
    preferred_term: embryonal carcinoma of the central nervous system
    term:
      id: MONDO:0018843
      label: embryonal carcinoma of the central nervous system
  description: >-
    The embryonal carcinoma histology within the CNS NGGCT spectrum, previously
    named only in this entry's prose. It is the least differentiated
    non-germinomatous component, and its disease-level mechanism is curated in
    the Embryonal Carcinoma entry rather than duplicated here.
  evidence:
  - reference: PMID:42115464
    reference_title: "Germinomas and Non-germinomatous Germ Cell Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NGGCTs include embryonal carcinoma, yolk sac tumor, choriocarcinoma, and
      teratomas and often secrete tumor markers like alpha-fetoprotein (AFP) and
      beta-hCG, which guide diagnosis and treatment without biopsy.
    explanation: >-
      Names embryonal carcinoma as one of the intracranial NGGCT histologies,
      supporting it as a subtype of this entry.
- name: Central Nervous System Teratoma
  display_name: CNS teratoma
  subtype_term:
    preferred_term: central nervous system teratoma
    term:
      id: MONDO:0002718
      label: central nervous system teratoma
  description: >-
    A CNS-specific teratomatous subtype within the NGGCT spectrum. Mature,
    immature, growing-teratoma-syndrome, and somatic-type-malignancy contexts
    require separate histopathologic interpretation; this subtype does not imply
    that every CNS teratoma is malignant.
  evidence:
  - reference: PMID:37452948
    reference_title: Brain and Spinal Tumors Originating from the Germ Line Cells.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In the WHO CNS tumor classification, GCTS are classified as germinoma and
      nongerminomatous GCT (NGGCT) with different subtypes (including teratoma).
    explanation: >-
      The clinical review places teratoma within the CNS NGGCT classification
      while separately noting that mature teratoma is not malignant.
pathophysiology:
- name: Recurrent KIT-RAS Signaling Alterations
  description: >-
    Somatic alterations in KIT and other KIT/RAS-pathway genes recur in human
    intracranial germ cell tumors. They are enriched in germinoma but are not
    present in every tumor. Cross-sectional sequencing establishes recurrence,
    not whether these lesions initiate disease or are required to maintain it.
  genes:
  - preferred_term: KIT
    term:
      id: hgnc:6342
      label: KIT
  - preferred_term: KRAS
    term:
      id: hgnc:6407
      label: KRAS
  - preferred_term: NRAS
    term:
      id: hgnc:7989
      label: NRAS
  evidence:
  - reference: PMID:24896186
    reference_title: Novel somatic and germline mutations in intracranial germ cell tumours.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We find the KIT/RAS signalling pathway frequently mutated in more than
      50% of IGCTs, including novel recurrent somatic mutations in KIT, its
      downstream mediators KRAS and NRAS, and its negative regulator CBL.
    explanation: >-
      Sequencing of patient tumors establishes recurrent somatic pathway
      alterations, while neither temporal order nor causal necessity was tested.
  - reference: PMID:38409885
    reference_title: Whole-exome sequencing has revealed novel genetic characteristics in intracranial germ cell tumours in the Chinese.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found that KIT was the most significantly mutated gene (15/47, 32%),
      which mainly occurred in the germinoma group (13/20, 65%), and less
      frequently in NGGCT (2/27, 7%).
    explanation: >-
      A second human tumor cohort supports subtype enrichment and also shows
      that KIT mutation is neither universal nor confined absolutely to
      germinoma.
- name: Recurrent AKT-mTOR Signaling Alterations
  description: >-
    A subset of intracranial germ cell tumors carries AKT/mTOR-pathway lesions,
    including focal AKT1 copy-number gain with increased AKT1 expression.
    Recurrence supports a tumor molecular state but does not establish when the
    alteration arose or whether it is sufficient for transformation.
  genes:
  - preferred_term: AKT1
    term:
      id: hgnc:391
      label: AKT1
  evidence:
  - reference: PMID:24896186
    reference_title: Novel somatic and germline mutations in intracranial germ cell tumours.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Novel somatic alterations in the AKT/mTOR pathway included copy number
      gains of the AKT1 locus at 14q32.33 in 19% of patients, with corresponding
      upregulation of AKT1 expression.
    explanation: >-
      Patient-tumor genomic and expression measurements establish a recurrent
      AKT1-associated state in a minority of cases, not a universal initiating
      mechanism.
- name: Germinoma Global DNA Hypomethylation
  subtypes:
  - Central Nervous System Germinoma
  description: >-
    Pure germinomas show a globally hypomethylated tumor state distinct from
    other intracranial germ cell tumor subtypes. Its resemblance to migrating
    primordial germ cells is relevant to developmental-origin hypotheses but is
    not lineage tracing.
  evidence:
  - reference: PMID:28078450
    reference_title: Genome-wide methylation profiles in primary intracranial germ cell tumors indicate a primordial germ cell origin for germinomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We showed that pure germinomas are characterized by global low DNA
      methylation, a unique epigenetic feature making them distinct from all
      other iGCTs subtypes.
    explanation: >-
      Genome-wide profiling of patient tumors directly supports the
      subtype-specific methylation state without establishing its causal timing.
- name: Chromosome 12p Gain
  subtypes:
  - Central Nervous System Germinoma
  - Central Nervous System Nongerminomatous Germ Cell Tumor
  description: >-
    Additional 12p copy number occurs across CNS germ cell tumors but is more
    frequent in NGGCT and in tumors with malignant components. It is a
    prognostic genomic feature, not a demonstrated universal driver.
  evidence:
  - reference: PMID:34698864
    reference_title: 12p gain is predominantly observed in non-germinomatous germ cell tumors and identifies an unfavorable subgroup of central nervous system germ cell tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 12p gain was found in 25-out-of-82 cases (30%) and was more frequent in
      NGGCTs (12% of germinoma cases and 50% of NGGCT cases), particularly in
      cases with malignant components, such as immature teratoma, yolk sac
      tumor, choriocarcinoma, and embryonal carcinoma.
    explanation: >-
      Array-based copy-number analysis with FISH validation directly supports
      the prevalence and subtype distribution of 12p gain in the cohort.
  - reference: PMID:34698864
    reference_title: 12p gain is predominantly observed in non-germinomatous germ cell tumors and identifies an unfavorable subgroup of central nervous system germ cell tumors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The presence of 12p gain correlated with shorter progression-free (PFS)
      and overall survival (OS) (10-year OS: 59% vs. 94%, with and without 12p
      gain, respectively, P = 0.0002), even with histology and tumor markers
      incorporated in the multivariate analysis.
    explanation: >-
      Cohort-level outcome analysis supports prognostic association; it does not
      prove that 12p gain causes treatment failure.
- name: Neurohypophyseal Dysfunction in Suprasellar Germinoma
  subtypes:
  - Central Nervous System Germinoma
  description: >-
    Suprasellar or neurohypophyseal germinoma can disrupt posterior-pituitary
    function, producing central diabetes insipidus that may precede tumor
    diagnosis for more than a year and often persists after tumor treatment.
  locations:
  - preferred_term: neurohypophysis
    term:
      id: UBERON:0002198
      label: neurohypophysis
  downstream:
  - target: Central Diabetes Insipidus
    description: >-
      Posterior-pituitary dysfunction impairs vasopressin regulation and
      produces central diabetes insipidus.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Disruption of posterior-pituitary vasopressin regulation.
  evidence:
  - reference: PMID:25266413
    reference_title: "Diabetes insipidus in pediatric germinomas of the suprasellar region: characteristic features and significance of the pituitary bright spot."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All had symptoms of DI at presentation with a symptom interval above one
      year in eight cases (42 %).
    explanation: >-
      The retrospective pediatric suprasellar/bifocal germinoma cohort directly
      supports prolonged central diabetes insipidus before diagnosis.
  - reference: PMID:25266413
    reference_title: "Diabetes insipidus in pediatric germinomas of the suprasellar region: characteristic features and significance of the pituitary bright spot."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Desmopressin seldom reverses the clinical features of germinoma-induced DI
      to allow discontinuation, nor does treatment cause bright spot recovery.
    explanation: >-
      Persistence after tumor treatment is directly reported in this small
      retrospective suprasellar/bifocal germinoma cohort.
- name: Intracranial Tumor Mass Effect and Cerebrospinal Fluid Obstruction
  description: >-
    Pineal, ventricular, and other intracranial CNS germ cell tumors can obstruct
    cerebrospinal-fluid pathways. This location-dependent effect is distinct
    from tumor histology and from the still-unresolved initiating mechanism.
  downstream:
  - target: Hydrocephalus
    description: Obstruction of cerebrospinal-fluid flow causes hydrocephalus.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37452948
    reference_title: Brain and Spinal Tumors Originating from the Germ Line Cells.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Above 50% of intracranial GCTs (IGCTs) present obstructive hydrocephalus.
    explanation: >-
      The clinical review directly supports obstructive hydrocephalus as a common
      presentation of intracranial disease.
- name: Tumor-Marker Secretion by CNS Germ Cell Tumor Components
  description: >-
    AFP and HCG secretion varies by histologic component. Marker elevation can
    support clinical classification as NGGCT, but absence does not exclude
    malignant disease and AFP elevation is not specific to a yolk-sac component.
  evidence:
  - reference: PMID:36995447
    reference_title: "Impact of tumor markers on diagnosis, treatment and prognosis in CNS germ cell tumors: correlations with clinical practice and histopathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tumor markers in CNS germ cell tumors (GCTs) include human chorionic
      gonadotropin (HCG) and alpha fetoprotein (AFP), which have significant
      diagnostic implications, as elevation of either one leads to clinical
      diagnosis of non-germinomatous GCTs without histopathological confirmation,
      justifying intensified chemotherapy and irradiation.
    explanation: >-
      The human cohort establishes the clinical marker-to-classification
      relationship while the entry preserves histology-specific caveats.
  - reference: PMID:36995447
    reference_title: "Impact of tumor markers on diagnosis, treatment and prognosis in CNS germ cell tumors: correlations with clinical practice and histopathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AFP was often elevated in GCTs without a yolk sac tumor component,
      especially immature teratoma.
    explanation: >-
      The same cohort directly shows why AFP elevation cannot be treated as a
      component-specific readout in every CNS germ cell tumor.
  - reference: PMID:32642701
    reference_title: Clinical utility of circulating miR-371a-3p for the management of patients with intracranial malignant germ cell tumors.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The current biomarkers alpha-fetoprotein (AFP) and human chorionic
      gonadotropin (HCG) have limited sensitivity/specificity for diagnosing
      malignant germ cell tumors (GCTs) and "marker-negative" patients require
      histological confirmation for diagnosis.
    explanation: >-
      Background to the four-case intracranial biomarker series supports the
      explicit limitation of AFP/HCG-negative classification.
mechanistic_hypotheses:
- hypothesis_group_id: common_ancestry_developmental_state_divergence
  hypothesis_label: Common-Ancestry and Developmental-State Divergence Model
  status: EMERGING
  applies_to_subtypes:
  - Central Nervous System Germinoma
  - Central Nervous System Nongerminomatous Germ Cell Tumor
  description: >-
    Histologically distinct components within an individual mixed CNS germ cell
    tumor may descend from a common tumor ancestor and subsequently diverge
    into a primordial-germ-cell-like, hypomethylated germinoma state or one of
    several more differentiated NGGCT states. Cross-sectional resemblance does
    not identify that ancestor: a mis-migrated primordial germ cell and an
    endogenous neural stem or progenitor cell are competing cell-of-origin
    models to be tested rather than assumed. MAPK/PI3K-pathway alterations may
    cooperate with developmental state and can be shared by distinct components
    of a mixed tumor, but their temporal position and necessity for initiation
    remain unresolved.
  evidence:
  - reference: PMID:28078450
    reference_title: Genome-wide methylation profiles in primary intracranial germ cell tumors indicate a primordial germ cell origin for germinomas.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patterns of methylation strongly resemble that of primordial germ
      cells (PGC) at the migration phase, possibly indicating the cell of origin
      for these tumors.
    explanation: >-
      The primary methylation study supports PGC-like resemblance while its
      explicitly tentative wording preserves the absence of lineage tracing.
  - reference: PMID:28078450
    reference_title: Genome-wide methylation profiles in primary intracranial germ cell tumors indicate a primordial germ cell origin for germinomas.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Unlike PGC, however, hypomethylation extends to long interspersed nuclear
      element retrotransposons.
    explanation: >-
      The human-tumor methylome is PGC-like but not an exact PGC epigenome, so
      global resemblance cannot by itself identify the normal precursor.
  - reference: PMID:20582452
    reference_title: Variable methylation of the imprinted gene, SNRPN, supports a relationship between intracranial germ cell tumours and neural stem cells.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      We show here that the lack of methylation of SNRPN that has previously
      been taken to indicate an origin for GCTs from PGCs is also seen in
      neural stem cells of mice and humans.
    explanation: >-
      A mouse-and-human neural-stem-cell assay shows that one imprinting feature
      used to support PGC origin is not PGC-specific. It does not establish a
      neural-stem-cell lineage for the tumor.
  - reference: PMID:41190468
    reference_title: "Primordial Germ Cells in the Human Fetal Brain: Origins of Intracranial Germ Cell Tumours."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The distribution seems to favour the hypothesis that PGCs may be derived
      from germinal matrix neural stem cells rather than necessarily from
      extracranial midline migration to the brain.
    explanation: >-
      This is the authors' distribution-based inference from two non-tumor
      fetal autopsies. The observation establishes neither local
      neural-stem-cell derivation nor tumor ancestry, but it keeps that origin
      alternative open.
  - reference: PMID:28078450
    reference_title: Genome-wide methylation profiles in primary intracranial germ cell tumors indicate a primordial germ cell origin for germinomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histologically and epigenetically distinct microdissected components of
      mixed-GCTs shared identical somatic mutations in the MAPK or PI3K
      pathways, indicating that they developed from a common ancestral cell.
    explanation: >-
      Shared mutations across microdissected mixed components support common
      ancestry and component-specific epigenetic divergence. Their relative
      timing is inferred rather than directly observed, and the data neither
      identify the normal precursor nor establish initiation by the pathway
      lesion.
  - reference: PMID:34698864
    reference_title: 12p gain is predominantly observed in non-germinomatous germ cell tumors and identifies an unfavorable subgroup of central nervous system germ cell tumors.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 12p copy number status was shared among histological components in
      mixed GCTs.
    explanation: >-
      FISH-validated human-tumor copy-number analysis supplies an orthogonal
      component-shared feature in sampled mixed tumors. Shared status does not
      identify the normal precursor, establish temporal order, or prove
      universal clonality across mixed tumors.
  - reference: PMID:35137206
    reference_title: Transcriptome and methylome analysis of CNS germ cell tumor finds its cell-of-origin in embryogenesis and reveals shared similarities with testicular counterparts.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Co-analysis with the transcriptome of human embryonic cells revealed that
      germinomas had expression profiles similar to those of primordial germ
      cells, while the expression profiles of NGGCTs were similar to those of
      embryonic stem cells.
    explanation: >-
      Cross-reference transcriptome analysis supports distinct developmental
      state resemblance, not direct observation of tumor initiation.
  - reference: PMID:24896186
    reference_title: Novel somatic and germline mutations in intracranial germ cell tumours.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, 53% of the tumors harbored somatic mutations in at least one of
      the genes involved in KIT/RAS or AKT/mTOR pathways
    explanation: >-
      Sequencing of 62 human tumors establishes recurrent pathway alterations,
      but prevalence is incomplete, subtype distribution is unequal, and the
      cross-sectional design does not establish developmental timing.
  notes: >-
    This is a within-tumor developmental model inferred mainly from
    cross-sectional human profiles. It does not posit an ancestor shared across
    patients, discriminate a mis-migrated primordial germ cell from an
    endogenous neural stem or progenitor cell or another precursor, or
    generalize germinoma hypomethylation to every NGGCT component.
- hypothesis_group_id: nggct_failure_state_specific_persistence_and_evolution
  hypothesis_label: NGGCT Failure-State-Specific Persistence and Evolution Model
  status: EMERGING
  applies_to_subtypes:
  - Central Nervous System Nongerminomatous Germ Cell Tumor
  description: >-
    CNS-NGGCT failures are clinically partitioned into induction progression,
    marker-negative growing teratoma syndrome (GTS), viable residual or
    progressive disease, and post-treatment relapse. Clinical separability does
    not establish molecular separability. GTS may reflect persistence or
    expansion of a pre-existing teratomatous lineage or treatment-associated
    maturation and must be distinguished from viable malignant disease; it is
    not uniformly benign. Malignant progression or relapse may reflect selection
    of a pre-existing malignant clone or state, acquired genomic or epigenetic
    changes, reversible treatment-tolerant adaptation, treatment exposure or
    geography, or sampling. These alternatives must not be pooled or assumed to
    be therapy-selected without paired, component-resolved longitudinal
    evidence. No adequately powered diagnosis-to-failure molecular series
    currently establishes which route is causal.
  evidence:
  - reference: PMID:35218656
    reference_title: "Pattern of treatment failures in patients with central nervous system non-germinomatous germ cell tumors (CNS-NGGCT): A pooled analysis of clinical trials."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 118 patients experienced a treatment failure. Twenty-four
      patients had progressive disease during therapy, and additional 11
      patients were diagnosed with growing teratoma syndrome (GTS).
    explanation: >-
      The pooled clinical dataset operationally separates progression during
      therapy from GTS, but it does not demonstrate molecularly distinct causes.
  - reference: PMID:35218656
    reference_title: "Pattern of treatment failures in patients with central nervous system non-germinomatous germ cell tumors (CNS-NGGCT): A pooled analysis of clinical trials."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eighty-three individuals experienced disease relapses after treatment
      ended.
    explanation: >-
      The same pooled cohort separately documents post-treatment relapse,
      supporting a timing-based clinical partition from progression during
      therapy and GTS rather than a proven mechanistic partition.
  - reference: PMID:42488730
    reference_title: Growing Teratoma Syndrome Arising from a Pineal Mixed Germ Cell Tumor in a 12-Year-Old Boy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subsequent surgical resection revealed a mature teratoma without malignant
      elements, consistent with growing teratoma syndrome (GTS).
    explanation: >-
      This single post-chemotherapy resection supports a teratomatous GTS branch
      in one pineal mixed tumor. It does not distinguish treatment-associated
      maturation from persistence or expansion of a pre-existing component.
  - reference: PMID:38668041
    reference_title: Successful Multimodal Treatment of Intracranial Growing Teratoma Syndrome with Malignant Features.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A radical resection via the occipital transtentorial approach was
      performed, and histopathological examination revealed a teratoma with
      malignant features. Methylation classifier analysis confirmed the
      diagnosis of teratoma, and DMRT1 loss and 12p gain were identified by copy
      number variation analysis, potentially elucidating the cause of growth and
      malignant transformation of the teratoma.
    explanation: >-
      This single intracranial GTS case prevents treating the teratomatous branch
      as uniformly inert or benign. The alterations are hypothesis-generating
      observations, not established causes of growth, transformation, or
      treatment failure.
  - reference: PMID:41675560
    reference_title: Pre-treatment journey and outcome for children with intracranial non-germinomatous germ cell tumors-the Shanghai experience.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Whole-exome sequencing was performed on 12 paired tumor-blood samples to
      characterize molecular alterations.
    explanation: >-
      The recent NGGCT cohort adds diagnosis-time molecular observations, but
      paired tumor-blood samples are not paired diagnosis-relapse tumors and
      therefore cannot identify acquired resistance.
  - reference: PMID:38430549
    reference_title: Novel molecular subtypes of intracranial germ cell tumors expand therapeutic opportunities.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three distinct subtypes associated with unique genomic and clinical
      profiles were identified with transcriptome analysis: Immune-hot,
      MYC/E2F, and SHH.
    explanation: >-
      Molecular-state heterogeneity supplies candidates for future resistance
      testing but does not show that a state is selected by therapy or causes
      relapse.
  - reference: PMID:38409885
    reference_title: Whole-exome sequencing has revealed novel genetic characteristics in intracranial germ cell tumours in the Chinese.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clonal evolution analysis revealed an early branched evolutionary pattern
      in two IGCT patients who underwent changes in the histological subtype or
      degree of differentiation during disease surveillance.
    explanation: >-
      Two longitudinal human cases support clonal continuity and state
      selection as a possibility, but the sample is too small and
      histology-changing surveillance is not equivalent to a replicated
      refractory-NGGCT resistance mechanism.
  - reference: PMID:11005262
    reference_title: Comparative genomic hybridization in pineal germ cell tumors.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fifteen primary pineal germ cell tumors (8 germinomas, 4 mixed
      teratomas-germinomas, 2 immature teratomas, and 1 yolk sac tumor) and 2
      recurrences of the yolk sac tumor were studied by comparative genomic
      hybridization (CGH).
    explanation: >-
      The cohort contains one primary yolk-sac tumor and its two recurrences,
      establishing serial genomic material but not a treatment-resistance
      mechanism.
  - reference: PMID:11005262
    reference_title: Comparative genomic hybridization in pineal germ cell tumors.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the first recurrence showed 7 (4 gains vs 3 losses), the second 13
      imbalances (8 gains vs 5 losses).
    explanation: >-
      Copy-number complexity increased between the two recurrences. This is
      direct serial progression evidence, but the small observation lacks
      reported regimen or exposure details, gene-level resolution, a
      comparator, and functional validation, so it cannot identify a resistance
      driver.
  notes: >-
    This model operationally separates GTS, viable malignant progression, and
    post-treatment relapse without claiming that each category has a distinct
    molecular cause. It does not promote SHH, MYC/E2F, immune-hot, MAPK, or PI3K
    status to a clinical resistance biomarker without longitudinal validation.
- hypothesis_group_id: mir214_bcl2l11_cisplatin_response_candidate
  hypothesis_label: miR-214-3p–BCL2L11 Cisplatin-Response Candidate
  status: EMERGING
  applies_to_subtypes:
  - Central Nervous System Nongerminomatous Germ Cell Tumor
  description: >-
    In a subset of malignant NGGCT, altered regulation of the miR-199/214
    cluster may increase miR-214-3p, reduce the pro-apoptotic protein
    BCL2L11/BIM, and shift apoptosis and survival after cisplatin exposure. This
    is a candidate response-modifying chain: the current causal evidence comes
    from forced miR-214-3p expression and a BCL2L11-knockdown phenocopy in one
    adult mediastinal mixed-germ-cell-tumor line. It does not establish direct
    miR-214-3p binding to BCL2L11, endogenous necessity, rescue, or a difference
    between resistant and sensitive CNS NGGCT in patients.
  evidence:
  - reference: PMID:29036598
    reference_title: Global DNA methylation analysis reveals miR-214-3p contributes to cisplatin resistance in pediatric intracranial nongerminomatous malignant germ cell tumors.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The expression levels of 97 genes and 8 miRNAs were correlated with
      promoter DNA methylation and hydroxymethylation status, such as the
      miR-199/-214 cluster
    explanation: >-
      Human tumor multi-omic analysis links the miR-199/214 cluster to
      methylation state in a cross-sectional NGMGCT-versus-germinoma subtype
      comparison. Histology and differentiation state therefore confound any
      resistance inference, and no longitudinal resistant-versus-sensitive
      comparison was performed.
  - reference: PMID:29036598
    reference_title: Global DNA methylation analysis reveals miR-214-3p contributes to cisplatin resistance in pediatric intracranial nongerminomatous malignant germ cell tumors.
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Overexpresssion of miR-214-3p in NCCIT cells leads to reduced expression
      of the pro-apoptotic protein BCL2-like 11 and induces cisplatin
      resistance.
    explanation: >-
      Stable miR-214-3p expression increased NCCIT survival after cisplatin but
      the authors reported no etoposide difference (data not shown), and
      BCL2L11 knockdown phenocopied cisplatin survival. This supports a
      single-cell-line in-vitro response phenotype, but the study did not test
      endogenous miR-214-3p loss, AGO2 or seed-mutant binding, or
      miRNA-insensitive BCL2L11 rescue.
  - reference: PMID:36768818
    reference_title: "Integrated Microarray-Based Data Analysis of miRNA Expression Profiles: Identification of Novel Biomarkers of Cisplatin-Resistance in Testicular Germ Cell Tumours."
    supports: PARTIAL
    evidence_source: IN_VITRO
    snippet: >-
      Comparing CDDP-resistant vs. -sensitive TGCT cell lines, we identified
      miR-218-5p, miR-31-5p, miR-125b-5p, miR-27b-3p, miR-199a-5p, miR-214-3p,
      let-7a and miR-517a-3p as significantly up-regulated
    explanation: >-
      This extracranial testicular-GCT screen supplies an independent but
      nonfunctional association. RT-qPCR miR-214-3p direction varied by
      resistant-versus-sensitive cell-line comparison; miR-214-3p was not among
      the authors' six-miRNA proposed core biomarker panel, although they
      suggested possible added predictive value. The study did not test
      BCL2L11 or perturb miR-214-3p.
  notes: >-
    This is a cisplatin-response candidate, not a validated intrinsic-tolerance
    mechanism or clinical resistance biomarker. No independent functional
    replication in a patient-derived intracranial model or
    resistant-versus-sensitive clinical comparison was retrieved. NCCIT is not
    a patient-derived CNS NGGCT model; testicular or mediastinal GCT apoptosis
    and DNA-repair studies and non-germ-cell miR-214 targets remain indirect
    alternatives, not direct CNS evidence or refutation.
phenotypes:
- category: Endocrine
  name: Central Diabetes Insipidus
  frequency: OCCASIONAL
  description: >-
    Central diabetes insipidus is a location-dependent presentation of
    suprasellar or bifocal germinoma and may precede diagnosis for a prolonged
    interval. The frequency band is based on one broader regional CNS-GCT cohort
    and should not be generalized to every site or histology.
  phenotype_term:
    preferred_term: Central diabetes insipidus
    term:
      id: HP:0000863
      label: Central diabetes insipidus
  evidence:
  - reference: PMID:39035740
    reference_title: "Primary central nervous system germ cell tumors in Central America and the Caribbean Region: an AHOPCA 20-year experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Presenting symptoms were headaches (n = 24, 50%), visual disturbances (n =
      17, 35.4%), vomiting (n = 12, 25%), nausea (n = 8, 16.7%), and diabetes
      insipidus (n = 7, 14.6%).
    explanation: >-
      This 48-patient CNS-GCT cohort directly supports an occasional
      disease-family frequency band for diabetes insipidus.
  - reference: PMID:25266413
    reference_title: "Diabetes insipidus in pediatric germinomas of the suprasellar region: characteristic features and significance of the pituitary bright spot."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All had symptoms of DI at presentation with a symptom interval above one
      year in eight cases (42 %).
    explanation: >-
      The site-selected germinoma cohort supports prolonged diagnostic delay
      among patients whose suprasellar or bifocal tumors caused DI; it does not
      supply an umbrella-disease frequency.
- category: Nervous System
  name: Hydrocephalus
  frequency: FREQUENT

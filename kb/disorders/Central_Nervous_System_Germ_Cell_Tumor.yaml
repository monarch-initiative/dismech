diagnosis:
- name: Serum and Cerebrospinal Fluid Tumor-Marker Assessment
  markers: AFP, HCG
  description: >-
    Measure AFP and HCG in both serum and CSF to support CNS germ cell tumor
    classification. Marker elevation can permit a clinical NGGCT diagnosis in
    some settings, while marker-negative malignant tumors may require tissue
    confirmation.
  evidence:
  - reference: PMID:36995447
    reference_title: "Impact of tumor markers on diagnosis, treatment and prognosis in CNS germ cell tumors: correlations with clinical practice and histopathology."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HCG was elevated only in CSF in 3-of-52 cases, and AFP was elevated only in
      serum in 7-of-49 cases, emphasizing the potential utilization of both
      serum and CSF studies.
    explanation: >-
      Direct paired-compartment observations support testing both serum and CSF.
  - reference: PMID:32642701
    reference_title: Clinical utility of circulating miR-371a-3p for the management of patients with intracranial malignant germ cell tumors.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The current biomarkers alpha-fetoprotein (AFP) and human chorionic
      gonadotropin (HCG) have limited sensitivity/specificity for diagnosing
      malignant germ cell tumors (GCTs) and "marker-negative" patients require
      histological confirmation for diagnosis.
    explanation: >-
      Background to the proof-of-concept series bounds marker-negative
      interpretation and the need for histology.
- name: Neuraxis Staging with MRI and Cerebrospinal Fluid Cytology
  description: >-
    Before treatment, contrast-enhanced MRI of brain and whole spine plus CSF
    cytology evaluates macroscopic and cytologic dissemination. This is staging,
    not a substitute for histology when tumor markers are non-diagnostic.
  evidence:
  - reference: PMID:37452948
    reference_title: Brain and Spinal Tumors Originating from the Germ Line Cells.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Staging work-up includes CSF cytology for tumor cells and contrast-enhanced
      MRI of brain and spine for macroscopic metastasis before treatment
      commences.
    explanation: >-
      The clinical review directly describes pre-treatment neuraxis staging.
treatments:
- name: Response-Adapted CarboPEI Chemotherapy and Whole-Ventricular Radiation
  description: >-
    For localized germinoma in SIOP-CNS-GCT-II, four carboPEI courses were
    followed by 24 Gy whole-ventricular radiation, with a 16 Gy tumor boost for
    residual disease. This subtype- and response-specific protocol should not be
    generalized to NGGCT or treated as randomized proof of one optimal regimen.
  treatment_term:
    preferred_term: Chemoradiotherapy
    term:
      id: NCIT:C94626
      label: Chemoradiotherapy
  evidence:
  - reference: PMID:42234858
    reference_title: Final report of the SIOP-CNS-GCT II protocol for germinoma-omitting radiotherapy boost is safe in localized disease in complete remission after chemotherapy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with localized germinoma received four courses of 'carboPEI'
      chemotherapy, then 24Gy WVRT if in complete remission (CR), with an
      additional 16Gy tumor boost if residual disease was present.
    explanation: >-
      The prospective protocol report directly establishes the response-adapted
      localized-germinoma regimen.
- name: Response-Qualified Chemotherapy and Reduced-Field Radiation for Localized NGGCT
  description: >-
    ACNS1123 used alternating carboplatin/etoposide and
    ifosfamide/etoposide, followed in complete or partial responders by reduced
    whole-ventricular radiation and a tumor-bed boost. The phase-II result was
    accompanied by spinal failures, so field adequacy remains an open question
    rather than a universal standard.
  treatment_term:
    preferred_term: Chemoradiotherapy
    term:
      id: NCIT:C94626
      label: Chemoradiotherapy
    therapeutic_agent:
    - preferred_term: carboplatin
      term:
        id: CHEBI:31355
        label: carboplatin
    - preferred_term: etoposide
      term:
        id: CHEBI:4911
        label: etoposide
    - preferred_term: ifosfamide
      term:
        id: CHEBI:5864
        label: ifosfamide
  evidence:
  - reference: PMID:31545689
    reference_title: "Phase II Trial of Response-Based Radiation Therapy for Patients With Localized CNS Nongerminomatous Germ Cell Tumors: A Children's Oncology Group Study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients received six cycles of chemotherapy with carboplatin and
      etoposide alternating with ifosfamide and etoposide, as used in the
      Children's Oncology Group predecessor study (ACNS0122; ClinicalTrials.gov
      identifier: NCT00047320).
    explanation: >-
      The phase-II protocol directly establishes the alternating chemotherapy
      backbone for localized NGGCT.
  - reference: PMID:31545689
    reference_title: "Phase II Trial of Response-Based Radiation Therapy for Patients With Localized CNS Nongerminomatous Germ Cell Tumors: A Children's Oncology Group Study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients who achieved a complete response (CR) or partial response (PR)
      with or without second-look surgery were eligible for reduced RT, defined
      as 30.6 Gy whole ventricular field and 54 Gy tumor-bed boost, compared
      with 36 Gy craniospinal irradiation plus 54 Gy tumor-bed boost used in
      ACNS0122.
    explanation: >-
      The trial defines the response qualification and reduced radiation field;
      it does not settle whether that field is adequate for all localized NGGCT.
- name: Myeloablative Chemotherapy with Autologous Stem Cell Transplantation
  description: >-
    High-dose chemotherapy with autologous stem-cell rescue is a selected
    salvage option for relapsed or progressed CNS germ cell tumors. Evidence
    comes from a small prospective study and does not establish a
    subtype-independent standard.
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  evidence:
  - reference: PMID:23824533
    reference_title: "Myeloablative chemotherapy and autologous stem cell transplantation in patients with relapsed or progressed central nervous system germ cell tumors: results of Korean Society of Pediatric Neuro-Oncology (KSPNO) S-053 study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eleven patients with non-germinomatous germ cell tumors and nine patients
      with germinomas were enrolled.
    explanation: >-
      The 20-patient sample bounds the generalizability of this salvage strategy.
  - reference: PMID:23824533
    reference_title: "Myeloablative chemotherapy and autologous stem cell transplantation in patients with relapsed or progressed central nervous system germ cell tumors: results of Korean Society of Pediatric Neuro-Oncology (KSPNO) S-053 study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, HDCT/autoSCT was feasible, and survival rates were
      encouraging. Further study with a larger cohort of patients is needed to
      elucidate the role of HDCT/autoSCT in the treatment of relapsed or
      progressed CNS-GCTs.
    explanation: >-
      The investigators explicitly frame feasibility as encouraging but
      insufficient to define the treatment's role.
- name: Resection of Persistent or Growing Teratomatous Disease
  description: >-
    Surgical resection can define and remove enlarging teratomatous tissue after
    chemotherapy, including growing teratoma syndrome. Case-level evidence does
    not establish one universal timing or extent of resection.
  treatment_term:
    preferred_term: surgical procedure on nervous system
    term:
      id: NCIT:C15656
      label: Neurosurgical Procedure
  evidence:
  - reference: PMID:42488730
    reference_title: Growing Teratoma Syndrome Arising from a Pineal Mixed Germ Cell Tumor in a 12-Year-Old Boy.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Subsequent surgical resection revealed a mature teratoma without malignant
      elements, consistent with growing teratoma syndrome (GTS).
    explanation: >-
      This single case demonstrates resection in a post-chemotherapy pineal GTS
      context without establishing a general treatment rule.
discussions:
- discussion_id: gap_cns_gct_developmental_origin_and_driver_timing
  prompt: >-
    Do CNS germ cell tumors arise from a mis-migrated primordial germ cell, an
    endogenous neural stem or progenitor cell, or another precursor; when do
    lineage divergence and global methylation changes occur; and are MAPK/PI3K
    alterations initiating lesions, later cooperating events, or dispensable
    markers of particular components?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - mechanistic_hypothesis#common_ancestry_developmental_state_divergence
  rationale: >-
    The strongest human evidence is cross-sectional. Methylation profiles in 61
    primary tumors and integrated transcriptome/methylome profiles in 84 cases
    map germinoma and NGGCT to different developmental reference states, while
    shared MAPK/PI3K variants in microdissected mixed components and
    component-shared 12p status in a separate cohort support within-tumor common
    ancestry. SNRPN hypomethylation is also present in mouse and human neural
    stem cells, and two non-tumor fetal autopsies prompted an author hypothesis
    of local germinal-matrix derivation. These observations do not trace a
    tumor lineage. The studies do not observe embryonic migration, establish
    whether the relevant precursor is a bona fide primordial germ cell, an
    endogenous neural stem or progenitor cell, or another precursor, or
    determine whether pathway alterations precede or follow epigenetic state
    divergence. The 62-tumor sequencing cohort found KIT/RAS or AKT/mTOR lesions
    in 53%, with KIT mutations restricted to germinomas in that cohort, so one
    pathway chain cannot be generalized across the family. Direct temporal,
    lineage, and perturbational evidence that compares competing precursor
    models is required before adding an established developmental-escape or
    MAPK/PI3K pathophysiology edge.
  proposed_experiments:
  - experiment_id: exp_cns_gct_spatial_clonal_developmental_atlas
    name: >-
      Spatial single-cell clonal atlas across pure and mixed CNS germ cell tumors
    description: >-
      Prospectively collect treatment-naive pure germinomas, pure NGGCT
      histologies, and multiple spatially mapped components of mixed tumors.
      Integrate single-cell DNA, RNA, chromatin accessibility, methylation, and
      spatial pathology with matched normal DNA and a preregistered human
      embryonic germ-cell reference atlas.
    experiment_type:
      preferred_term: spatial single-cell multi-omic lineage study
    model_systems:
    - name: Treatment-naive CNS germ cell tumor cohort
      description: >-
        Include age-, sex-, location-, and histology-stratified tumors with
        central pathology review and separate sampling of every visible mixed
        component.
    - name: Human developmental reference atlas
      description: >-
        Use ethically sourced published and prospectively generated reference
        profiles spanning primordial germ-cell specification and migration,
        neural stem and progenitor states, and early embryonic differentiation
        without treating nearest-neighbor similarity as proof of ancestry.
    perturbations:
    - name: Component-resolved sampling
      target: mechanistic_hypothesis#common_ancestry_developmental_state_divergence
      description: >-
        Laser-capture and single-cell profile each component separately while
        preserving spatial relationships and shared somatic variants.
    readouts:
    - name: Clonal order and developmental-state assignment
      target: mechanistic_hypothesis#common_ancestry_developmental_state_divergence
      description: >-
        Infer trunk and branch lesions, allele-specific copy number, methylation
        erasure or acquisition, lineage programs, and uncertainty-calibrated
        similarity to developmental references.
      assays:
      - preferred_term: single-cell DNA and RNA sequencing
      - preferred_term: single-cell methylome and chromatin accessibility profiling
      - preferred_term: spatial transcriptomics
      direction: THRESHOLD_DEPENDENT
    controls:
    - name: Histology and site controls
      description: >-
        Analyze germinoma and each NGGCT component separately, include gonadal
        germ cell tumor comparators, and adjust for purity, immune infiltration,
        age, sex, anatomic site, and specimen handling.
    - name: Clonal-inference controls
      description: >-
        Confirm trunk variants by orthogonal targeted sequencing and test
        alternative phylogenies rather than selecting a lineage tree from
        transcriptomic similarity alone.
    decision_criterion: >-
      Common ancestry is supported when spatially distinct mixed components
      share orthogonally validated trunk lesions and diverge into reproducible
      component-specific epigenetic states. A particular precursor-of-origin
      model gains support only if tumor trunk states reproducibly align with a
      defined developmental interval across cohorts, fit competing precursor
      models materially less well, and cannot be explained by tumor purity or
      convergence; developmental similarity alone does not establish lineage.
      Divergent trunk lesions across components would refute a single common
      tumor ancestor, whereas component differences arising after a shared
      trunk are expected under developmental-state divergence and do not refute
      it. Inconsistent developmental assignments leave cell of origin
      unresolved rather than refuting common ancestry.
    would_support:
    - mechanistic_hypothesis#common_ancestry_developmental_state_divergence
    would_refute:
    - mechanistic_hypothesis#common_ancestry_developmental_state_divergence
  - experiment_id: exp_cns_gct_stage_specific_driver_epistasis
    name: Stage-specific MAPK/PI3K developmental epistasis
    description: >-
      Introduce recurrent KIT, RAS, AKT1, or mTOR alterations singly and in
      combinations at defined stages of human primordial-germ-cell-like-cell and
      embryonic differentiation, then test whether a lesion initiates,
      maintains, or merely accelerates a tumor-compatible state.
    experiment_type:
      preferred_term: isogenic developmental-stage causal epistasis study
    model_systems:
    - name: Isogenic human candidate-precursor differentiation series
      description: >-
        Compare multiple donor backgrounds of primordial-germ-cell-like cells
        and CNS neural stem or progenitor cells, with inducible editing at
        matched specification and differentiation stages.
    - name: Component-specific CNS germ cell tumor organoids
      description: >-
        Establish centrally reviewed germinoma and NGGCT organoids with
        isogenic correction or introduction of candidate lesions.
    perturbations:
    - name: Timed driver introduction and correction
      target: mechanistic_hypothesis#common_ancestry_developmental_state_divergence
      description: >-
        Activate or correct one candidate pathway lesion at each developmental
        stage, with matched kinase-dead, vector, and unedited controls.
    readouts:
    - name: State maintenance and transformation
      target: mechanistic_hypothesis#common_ancestry_developmental_state_divergence
      description: >-
        Measure survival without developmental cues, methylation state,
        differentiation trajectory, clonogenicity, invasion, and tumor formation
        in an anatomically relevant xenograft.
      assays:
      - preferred_term: longitudinal multi-omic profiling
      - preferred_term: clonogenic transformation assay
      direction: POSITIVE
    controls:
    - name: Lesion and developmental-stage controls
      description: >-
        Compare each alteration across matched primordial-germ-cell-like and
        neural stem or progenitor backgrounds and developmental stages, include
        pathway correction and pharmacologic rescue, and analyze
        germinoma-like and NGGCT-like outputs separately.
    decision_criterion: >-
      An initiating role requires a lesion to reproducibly create a
      self-maintaining tumor-compatible state only when introduced at a defined
      precursor stage, with loss of that phenotype after isogenic correction.
      A maintenance role is favored if correction collapses established tumor
      state but introduction does not initiate it. Lack of necessity and
      sufficiency supports a passenger or context-marker interpretation.
    would_support:
    - mechanistic_hypothesis#common_ancestry_developmental_state_divergence
    would_refute:
    - mechanistic_hypothesis#common_ancestry_developmental_state_divergence
  evidence:
  - reference: PMID:28078450
    reference_title: Genome-wide methylation profiles in primary intracranial germ cell tumors indicate a primordial germ cell origin for germinomas.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recent exhaustive genomic studies showed that mutations of the genes
      involved in the MAPK and/or PI3K pathways are common in iGCTs; however,
      the mechanisms of how different subtypes develop, often as a mixed-GCT,
      are unknown.
    explanation: >-
      The primary study explicitly identifies the unresolved link between
      recurrent pathway alterations and subtype development.
- discussion_id: gap_nggct_refractory_and_relapse_mechanism
  prompt: >-
    Which cellular, lineage, genomic, epigenetic, microenvironmental, or
    pharmacologic states cause primary refractory disease, viable progression,
    growing teratoma syndrome, and post-treatment relapse in CNS NGGCT, and
    which are actionable rather than correlates of histology?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - subtype#Central Nervous System Nongerminomatous Germ Cell Tumor
  - mechanistic_hypothesis#nggct_failure_state_specific_persistence_and_evolution
  - mechanistic_hypothesis#mir214_bcl2l11_cisplatin_response_candidate
  rationale: >-
    Clinical failure is heterogeneous. A pooled analysis separated 24
    progressions during treatment, 11 growing-teratoma-syndrome events, and 83
    post-treatment relapses. Large genomic studies predominantly profile
    primary tumors, and the recent NGGCT cohort sequenced only 12 paired
    tumor-blood samples; neither design compares diagnosis with residual,
    progressive, and relapsed viable tumor within patients. A separate study
    observed early-branched evolution across only two histology-changing
    longitudinal cases, which supports feasibility but not a recurrent driver.
    An older serial yolk-sac-tumor case likewise showed increasing copy-number
    complexity over two recurrences, but its single-case, arm-level design and
    unreported regimen or exposure details do not establish a resistance
    locus.
    Molecular subtypes such as immune-hot, MYC/E2F, and SHH are therefore
    candidates, not validated resistance states. The miR-214-3p–BCL2L11 result
    supplies a specific in-vitro cisplatin-tolerance candidate, but lacks a
    resistant-versus-sensitive clinical cohort, a patient-derived CNS model,
    and rescue evidence. Histologic mixture, sampling bias, radiation
    geography, pharmacokinetics, and therapy-selected clonal evolution remain
    competing explanations. A resistance node, predictive biomarker, or
    targeted therapy should not be added until longitudinal molecular change is
    linked to function and outcome.
  proposed_experiments:
  - experiment_id: exp_nggct_paired_failure_evolution_cohort
    name: >-
      Paired diagnosis-residual-progression-relapse NGGCT evolution cohort
    description: >-
      Build an international prospective cohort with central pathology review,
      multi-region diagnosis sampling, protocol-level treatment exposure, and
      tissue at second-look surgery, progression, GTS resection, or relapse.
      Collect serial plasma and CSF before, during, and after therapy.
    experiment_type:
      preferred_term: prospective longitudinal tumor evolution study
    model_systems:
    - name: Longitudinal CNS NGGCT clinical cohort
      description: >-
        Enroll pure and mixed NGGCT histologies and preserve separate strata for
        induction nonresponse, GTS, local viable progression, metastatic
        progression, and late relapse.
    - name: Response-matched comparator cohort
      description: >-
        Include durable responders matched on stage, histology, markers,
        radiation field, age, sex, location, and treatment regimen.
    perturbations:
    - name: Protocol-defined chemotherapy and radiotherapy exposure
      target: mechanistic_hypothesis#nggct_failure_state_specific_persistence_and_evolution
      description: >-
        Record cumulative agent doses, dose intensity, delays, surgery,
        radiation volumes and dosimetry, and supportive medications as
        time-varying exposures.
    readouts:
    - name: Within-patient clonal and lineage-state evolution
      target: mechanistic_hypothesis#nggct_failure_state_specific_persistence_and_evolution
      description: >-
        Compare somatic variants, copy number, ecDNA, methylation, transcriptome,
        chromatin accessibility, immune state, and histologic composition across
        every within-patient time point.
      assays:
      - preferred_term: single-cell and bulk multi-omic sequencing
      - preferred_term: spatial pathology
      direction: THRESHOLD_DEPENDENT
    - name: Serial molecular residual disease
      target: mechanistic_hypothesis#nggct_failure_state_specific_persistence_and_evolution
      description: >-
        Track patient-specific mutations, copy-number changes, methylation, and
        validated germ-cell-tumor RNAs in CSF and plasma alongside AFP, beta-hCG,
        imaging, and clinical response.
      assays:
      - preferred_term: cerebrospinal-fluid circulating tumor DNA assay
      - preferred_term: serial tumor-marker measurement
      direction: POSITIVE
    controls:
    - name: Failure-state separation
      description: >-
        Do not pool marker-negative GTS, viable malignant progression, and
        post-treatment relapse. Require central pathology and viable-tumor
        content estimates for every tissue comparison.
    - name: Sampling and treatment controls
      description: >-
        Model tumor purity, spatial sampling, histology, treatment intensity,
        radiation geography, and time to failure; validate candidate alterations
        in an independent protocol-treated cohort.
    decision_criterion: >-
      Therapy-selected persistence is supported when a diagnosis-time subclone
      or state survives, expands, or acquires a reproducible change in viable
      residual or relapse tumor, precedes failure in CSF, and predicts failure
      beyond histology, stage, markers, and radiation field. GTS requires a
      teratomatous lineage result rather than being labeled molecular relapse.
      Failure to find reproducible within-patient evolution, or associations
      fully explained by component sampling or treatment geography, refutes a
      shared molecular-resistance model.
    would_support:
    - mechanistic_hypothesis#nggct_failure_state_specific_persistence_and_evolution
    would_refute:
    - mechanistic_hypothesis#nggct_failure_state_specific_persistence_and_evolution
  - experiment_id: exp_nggct_resistance_functional_reconstruction
    name: Functional reconstruction of candidate NGGCT resistance states
    description: >-
      Establish paired diagnosis and failure models from the longitudinal
      cohort, barcode diagnosis-time cells, and causally test candidate
      lineage, signaling, DNA-damage-response, and microenvironmental states
      under clinically matched chemotherapy and radiation schedules.
    experiment_type:
      preferred_term: patient-derived resistance epistasis and rescue study
    model_systems:
    - name: Paired patient-derived NGGCT organoids and xenografts
      description: >-
        Preserve component-specific histology and use centrally reviewed paired
        diagnosis and failure material whenever available.
    - name: Isogenic barcoded NGGCT models
      description: >-
        Introduce or correct candidate alterations in multiple genetic and
        histologic backgrounds rather than relying on one cell line.
    perturbations:
    - name: Clinically matched multimodal therapy
      target: mechanistic_hypothesis#nggct_failure_state_specific_persistence_and_evolution
      description: >-
        Apply carboplatin or cisplatin, etoposide, ifosfamide, and fractionated
        radiation singly and in protocol-relevant sequences.
    - name: Candidate-state ablation and rescue
      target: mechanistic_hypothesis#nggct_failure_state_specific_persistence_and_evolution
      description: >-
        Genetically suppress and rescue only candidates that were observed to
        expand within patients, including lineage programs, signaling nodes,
        DNA-repair states, or immune interactions.
    - name: miR-214-3p inhibition and BCL2L11 epistasis
      target: mechanistic_hypothesis#mir214_bcl2l11_cisplatin_response_candidate
      description: >-
        In models with endogenous miR-214-3p elevation, inhibit miR-214-3p,
        knock down or restore BCL2L11 independently, and perform
        concentration-matched rescue under cisplatin and non-platinum therapy.
    readouts:
    - name: Clonal survival and cross-resistance
      target: mechanistic_hypothesis#nggct_failure_state_specific_persistence_and_evolution
      description: >-
        Measure barcode abundance, viability, apoptosis, DNA damage and repair,
        differentiation, tumor regrowth, and cross-resistance to chemotherapy
        and radiation.
      assays:
      - preferred_term: clonal barcode tracking
      - preferred_term: drug and radiation response assay
      direction: POSITIVE
    controls:
    - name: Isogenic and histology controls
      description: >-
        Include unedited, corrected, and rescue controls; test at least two
        models per histologic state and compare with durable-response models.
    decision_criterion: >-
      A candidate is a causal resistance mechanism only if it is enriched
      longitudinally in patients, increases survival under relevant therapy in
      more than one model, loses that advantage after specific ablation, and
      regains it after rescue. Baseline association without within-patient
      enrichment, or model-only resistance without clinical recurrence, is
      insufficient.
    would_support:
    - mechanistic_hypothesis#nggct_failure_state_specific_persistence_and_evolution
    - mechanistic_hypothesis#mir214_bcl2l11_cisplatin_response_candidate
    would_refute:
    - mechanistic_hypothesis#nggct_failure_state_specific_persistence_and_evolution
    - mechanistic_hypothesis#mir214_bcl2l11_cisplatin_response_candidate
  evidence:
  - reference: PMID:35218656
    reference_title: "Pattern of treatment failures in patients with central nervous system non-germinomatous germ cell tumors (CNS-NGGCT): A pooled analysis of clinical trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Due to their rarity, patients with treatment failures remain a poorly
      characterized group with unfavorable outcomes.
    explanation: >-
      The pooled clinical-trial analysis explicitly identifies the weak
      characterization of CNS-NGGCT treatment failure.
  - reference: PMID:39189644
    reference_title: Monitoring pediatric CNS non-germinomatous germ cell tumors via cerebrospinal fluid circulating tumor DNA.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among them, ctDNA before chemotherapy as well as ctDNA clearance were
      consistently associated with PFS and OS
    explanation: >-
      This 17-patient retrospective study supports serial CSF ctDNA as a
      feasible response and residual-disease readout, not as a mediator of
      resistance; its positivity threshold was optimized within the same small
      survival dataset.
- discussion_id: controversy_localized_nggct_radiation_field
  prompt: >-
    For localized CNS NGGCT that responds to induction therapy, what radiation
    field preserves disease control, especially in the spine, while reducing
    neurocognitive, endocrine, vascular, and second-neoplasm risk when the
    protocol-defined dose schedule is held constant?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - subtype#Central Nervous System Nongerminomatous Germ Cell Tumor
  rationale: >-
    ACNS1123 gave 30.6 Gy whole-ventricular irradiation with a boost bringing
    the tumor-bed total to 54 Gy in 66 response-qualified patients. Eight
    relapsed and every failure involved the spine; central dosimetry review
    found protocol-conforming targets and dose in 62 of 66 patients, and none
    of the four patients with deviations progressed.
    A separate pooled analysis of four prospective trials and two national
    protocol cohorts found no association between focal or whole-ventricular
    radiation and metastatic rather than local relapse among patients who had
    already failed treatment. Conditioning on failure and omitting
    field-specific denominators for all treated patients means that result
    cannot estimate field-specific failure incidence or rebut the ACNS1123
    pattern. The seed review describes optimal field and dose as controversial
    and minimizing long-term sequelae while preserving control as an unresolved
    challenge. Comparative disease-control and late-effect evidence is missing;
    no universal conclusion that either craniospinal or reduced-field radiation
    is optimal is warranted. This question is intentionally limited to
    response-qualified localized NGGCT and field selection at a fixed
    protocol-defined dose; dose optimization and germinoma protocols require
    separate evaluation.
  proposed_experiments:
  - experiment_id: exp_localized_nggct_risk_adapted_radiation_trial
    name: >-
      Risk-adapted radiation field trial with molecular residual-disease surveillance
    description: >-
      In a prospective international trial, centrally confirm localized NGGCT,
      induction response, histologic composition, serum and CSF markers, and
      second-look pathology. Compare protocol-defined radiation fields under
      contemporary protocol consensus and ethical oversight while embedding
      serial CSF molecular residual-disease testing and lifelong late-effect
      follow-up.
    experiment_type:
      preferred_term: randomized risk-adapted radiation field trial
    model_systems:
    - name: Response-qualified localized CNS NGGCT cohort
      description: >-
        Stratify by complete versus partial response, pure versus mixed
        histology, residual teratoma, marker status, age, sex, location, and
        protocol-defined molecular residual disease.
    perturbations:
    - name: Protocol-defined radiation-field assignment
      target: subtype#Central Nervous System Nongerminomatous Germ Cell Tumor
      description: >-
        Compare reduced ventricular or ventricular-plus-spinal strategies with
        a consensus broader-field control, holding the prescribed dose schedule
        and systemic therapy constant and using centrally reviewed dose-volume
        constraints.
    readouts:
    - name: Disease-control and failure geography
      target: subtype#Central Nervous System Nongerminomatous Germ Cell Tumor
      description: >-
        Measure event-free and overall survival, local, ventricular, spinal, and
        disseminated relapse, salvage success, serial tumor markers, and CSF
        molecular residual disease.
      assays:
      - preferred_term: magnetic resonance surveillance
      - preferred_term: cerebrospinal-fluid molecular residual-disease assay
      direction: THRESHOLD_DEPENDENT
    - name: Long-term treatment burden
      target: subtype#Central Nervous System Nongerminomatous Germ Cell Tumor
      description: >-
        Prospectively assess neurocognition, school and employment function,
        endocrine replacement, growth, hearing, vascular events, and secondary
        neoplasms for at least ten years.
      assays:
      - preferred_term: longitudinal late-effect assessment
      direction: NEGATIVE
    controls:
    - name: Central treatment-quality control
      description: >-
        Review pathology, response, second-look surgery, imaging, target
        contours, dosimetry, and protocol adherence before or during treatment.
    - name: Prespecified competing-risk analysis
      description: >-
        Lock noninferiority and late-effect estimands, account for salvage and
        competing mortality, and report every failure location rather than only
        aggregate progression-free survival.
    decision_criterion: >-
      A reduced field is acceptable only if it meets a prespecified
      noninferiority margin for disease control without an excess of spinal or
      disseminated relapse and produces a clinically meaningful late-effect
      benefit. If baseline or on-treatment CSF molecular residual disease
      reproducibly identifies spinal risk, test a biomarker-adapted field
      strategy prospectively rather than assigning a field from association
      alone. Similar disease control without measurable long-term benefit does
      not justify field reduction.
  evidence:
  - reference: PMID:31545689
    reference_title: "Phase II Trial of Response-Based Radiation Therapy for Patients With Localized CNS Nongerminomatous Germ Cell Tumors: A Children's Oncology Group Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the patterns of failure were distinct, with all patients having
      treatment failure in the spine.
    explanation: >-
      The response-based phase II trial directly identifies the spinal failure
      pattern after reduced whole-ventricular radiation.
  - reference: PMID:34990779
    reference_title: "A Phase 2 Trial of Response-Based Radiation Therapy for Localized Central Nervous System Germ Cell Tumors: Patterns of Failure and Radiation Dosimetry for Nongerminomatous Germ Cell Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eight patients relapsed: 6 with isolated spinal relapse and 2 with disease
      in the brain and spine.
    explanation: >-
      Central review confirms the number and geography of failures in the
      reduced-field cohort.
  - reference: PMID:35218656
    reference_title: "Pattern of treatment failures in patients with central nervous system non-germinomatous germ cell tumors (CNS-NGGCT): A pooled analysis of clinical trials."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In our analysis, focal or whole-ventricular radiation therapy was not
      associated with an increased risk of metastatic relapses.
    explanation: >-
      This case-only failure cohort describes metastatic versus local relapse
      patterns among patients who failed. Without field-specific denominators
      among all treated patients, it cannot estimate comparative failure
      incidence or establish that reduced fields are noninferior.
  - reference: PMID:42419530
    reference_title: Advances in diagnosis and treatment of intracranial germ cell tumors and future directions.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Current treatment predominantly relies on surgery, radiotherapy, and
      chemotherapy, though the optimal radiation field and dose remain
      controversial.
    explanation: >-
      The seed review explicitly identifies field and dose as unresolved; a
      review-level statement establishes the gap, not comparative efficacy.
  - reference: PMID:42419530
    reference_title: Advances in diagnosis and treatment of intracranial germ cell tumors and future directions.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      As the survival rate of patients with IGCTs improves, we are also
      confronted with new clinical challenges: how to minimize treatment-related
      long-term sequelae while maintaining excellent therapeutic outcomes
    explanation: >-
      The review separately frames late-effect reduction as an unresolved
      objective that must be measured alongside disease control.

genetic:
- name: IL11RA
  gene_term:
    preferred_term: IL11RA
    term:
      id: hgnc:5967
      label: IL11RA
  association: Causative (Primary)
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_903705e8-451e-4ed9-b3fc-d50df68c3fa2-2023-04-20T040000.000Z
    evidence:
    - reference: CGGV:assertion_903705e8-451e-4ed9-b3fc-d50df68c3fa2-2023-04-20T040000.000Z
      reference_title: "IL11RA / craniosynostosis and dental anomalies (Definitive)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "IL11RA | HGNC:5967 | craniosynostosis and dental anomalies | MONDO:0013615 | AR | Definitive"
      explanation: ClinGen gene-disease validity record classifying this pair as Definitive.
  notes: >-
    Reported variants include missense, nonsense, splice-region
    (c.479+6T>G), small in-frame duplication (c.916_924dup,
    p.Thr306_Ser308dup) and frameshift alleles. Most tested missense and
    in-frame variants cause receptor retention in the endoplasmic reticulum.
    One stalk-region deletion (p.Glu364_Val368del) was fully active in vitro,
    so not every IL11RA variant found in a craniosynostosis patient is
    causative.
  evidence:
  - reference: PMID:21741611
    reference_title: "Inactivation of IL11 signaling causes craniosynostosis, delayed tooth eruption, and supernumerary teeth."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutational analysis of candidate genes in the region revealed that all
      affected children harbored homozygous missense mutations
    explanation: >-
      Homozygous IL11RA missense variants (p.Pro221Arg, p.Ser245Cys,
      p.Arg296Trp) in all affected children of three Pakistani families.
  - reference: PMID:24498618
    reference_title: "Mutations in the interleukin receptor IL11RA cause autosomal recessive Crouzon-like craniosynostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study demonstrates that mutations in the IL11RA gene cause an
      autosomal recessive Crouzon-like craniosynostosis.
    explanation: >-
      Independent Turkish families confirm IL11RA as the causal gene.
  - reference: PMID:37994264
    reference_title: "Molecular characterization of the craniosynostosis-associated interleukin-11 receptor variants p.T306_S308dup and p.E364_V368del."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In contrast, the IL-11R-E364_V368del variant is fully biologically active
      and processed normally by proteases, thus allowing classic and
      trans-signaling of IL-11.
    explanation: >-
      A reported stalk-region variant is functionally normal, a caution for
      variant interpretation.
treatments:
- name: Cranial Vault Remodelling Surgery
  description: >-
    Surgical release and reconstruction of the fused cranial sutures. Repeat
    surgery may be needed when synostosis progresses.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cranial suture reconstruction
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Premature Multisuture Cranial Synostosis
    description: Surgery releases and reshapes the prematurely fused cranial vault.
  evidence:
  - reference: PMID:42627986
    reference_title: "Novel IL11RA Compound Heterozygous Variants in a Chinese Pediatric Patient With Pancraniosynostosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient underwent successful secondary cranial suture reconstruction
      with favorable 6-month outcomes.
    explanation: >-
      A patient with progressive pancraniosynostosis was treated by repeat
      cranial suture reconstruction.

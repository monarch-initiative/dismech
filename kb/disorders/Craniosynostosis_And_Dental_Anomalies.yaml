      explanation: >-
        IL-11 signalling is required for normal craniofacial bone development.
- name: Reduced IL-11-Dependent Bone Remodelling
  description: >-
    IL-11 promotes osteoclastogenesis directly and through osteoblast and
    stromal RANKL expression. Il11ra null mice have reduced osteoclast
    differentiation and increased trabecular bone. Keupp and colleagues
    proposed that loss of this osteoblast-mediated, RANKL-dependent support of
    osteoclast activity underlies the excess ossification at the sutures. This
    is a proposed mechanism, not a demonstrated one.
  biological_scale: CELLULAR
  cell_types:

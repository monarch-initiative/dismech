  evidence:
  - reference: PMID:24498618
    reference_title: "Mutations in the interleukin receptor IL11RA cause autosomal recessive Crouzon-like craniosynostosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Immunofluorescence analysis of mouse Il11ra demonstrated specific protein
      expression in cranial mesenchyme which was localized around the coronal
      suture tips and in the lambdoidal suture.
    explanation: >-
      Places the receptor in the suture mesenchyme where its loss acts.
  - reference: PMID:30282020
    reference_title: "Mutations in Craniosynostosis Patients Cause Defective Interleukin-11 Receptor Maturation and Drive Craniosynostosis-like Disease in Mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      IL-11 classic signaling via the membrane-bound receptor, but not IL-11
      trans-signaling via the soluble receptor, was the crucial pathway for
      normal skull development in mice in vivo.
    explanation: >-
      Identifies membrane-receptor classic signalling as the pathway skull
      development depends on.
  - reference: PMID:21741611
    reference_title: "Inactivation of IL11 signaling causes craniosynostosis, delayed tooth eruption, and supernumerary teeth."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that IL11 signaling is essential for the normal development
      of craniofacial bones and teeth and that its function is to restrict
      suture fusion and tooth number.
    explanation: >-
      States the restraining role of IL-11 signalling on suture fusion and
      tooth number that this node models.
  - reference: PMID:32566365
    reference_title: "A variant in IL6ST with a selective IL-11 signaling defect in human and mouse."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We show that human GP130 p.R281Q is associated with selective loss of
      IL-11 signaling without affecting IL-6, IL-27, OSM, LIF, CT1, CLC, and
      CNTF signaling.
    explanation: >-
      A gp130 variant found in a patient with craniosynostosis and retained
      primary teeth removes only IL-11 signalling.
  - reference: PMID:32566365
    reference_title: "A variant in IL6ST with a selective IL-11 signaling defect in human and mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In mice Il6st p.R279Q lowers litter size and causes facial synostosis
      and teeth abnormalities.
    explanation: >-
      The corresponding mouse variant reproduces synostosis and dental
      anomalies, so loss of the IL-11 signal itself, through either receptor
      subunit, drives the phenotype.
  downstream:
  - target: Premature Multisuture Cranial Synostosis

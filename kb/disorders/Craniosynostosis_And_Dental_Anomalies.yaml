name: Craniosynostosis and Dental Anomalies
creation_date: "2026-11-04T23:54:07Z"
category: Mendelian
description: >-
  Craniosynostosis and dental anomalies (CRSDA) is an autosomal recessive
  syndromic craniosynostosis caused by biallelic loss-of-function variants in
  IL11RA, which encodes the alpha subunit of the interleukin 11 receptor. Loss
  of membrane IL-11 receptor signalling removes a restraint on cranial suture
  fusion and on tooth number. Affected individuals have premature fusion of
  several cranial sutures (often pansynostosis), maxillary and midface
  hypoplasia with a Crouzon-like face, variable proptosis, relative
  prognathism, conductive hearing loss, and dental anomalies that include
  delayed or failed tooth eruption, retained primary teeth and supernumerary
  teeth. Limbs are spared, which separates it clinically from the FGFR
  craniosynostosis syndromes.
disease_term:
  preferred_term: craniosynostosis and dental anomalies
  term:
    id: MONDO:0013615
    label: craniosynostosis and dental anomalies
synonyms:
- "Kreiborg-Pakistani syndrome"
- "CRSDA"
- "Autosomal recessive Crouzon-like craniosynostosis"
- "IL11RA-related Crouzon-like autosomal recessive craniosynostosis"
parents:
- Syndromic Craniosynostosis
notes: >-
  The entry keeps the OMIM and MONDO title as its name. Searches of PubMed
  title and abstract fields for "IL11RA-related" and "IL11RA-associated"
  returned two and one records respectively (PMID:29926465, PMID:42084887;
  PMID:42627986), each attached to a different phenotype phrase, so no
  gene-related name is established. The two literature names in synonyms
  are the titles of PMID:24498618 and PMID:29926465. ClinGen classifies
  IL11RA for this disease as Definitive (autosomal recessive). No
  GeneReviews chapter covers this disease or IL11RA (Bookshelf index
  snapshot 2026-09-10 plus a live PubMed title and gene search), so the
  phenotype baseline is the primary case literature.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  expressivity: VARIABLE
  description: >-
    Affected individuals carry homozygous or compound heterozygous IL11RA
    variants, often in consanguineous families. Expressivity varies within
    families, from isolated pansynostosis to the full Crouzon-like picture.
  evidence:
  - reference: PMID:21741611
    reference_title: "Inactivation of IL11 signaling causes craniosynostosis, delayed tooth eruption, and supernumerary teeth."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed homozygosity mapping in three unrelated consanguineous
      Pakistani families and localized the syndrome to a region in chromosome 9.
    explanation: >-
      Homozygosity mapping in consanguineous families localized the recessive
      locus.
  - reference: PMID:29926465
    reference_title: "IL11RA-related Crouzon-like autosomal recessive craniosynostosis in 10 new patients: Resemblances and differences."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Singularly, it is inherited according to an autosomal recessive mode of
      inheritance.
    explanation: >-
      A ten-patient series confirms the autosomal recessive mode of inheritance.
  - reference: PMID:42084887
    reference_title: "The Clinical and Molecular Spectrum of Turkish Patients with Syndromic Craniosynostosis: A Single Center Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Rare etiologies included ERF-related craniosynostosis with mild
      craniofacial findings and IL11RA-related craniosynostosis with
      intrafamilial phenotypic heterogeneity.
    explanation: >-
      Documents variable expressivity within IL11RA families.
pathophysiology:
- name: Biallelic IL11RA Loss of Function
  description: >-
    Biallelic missense, nonsense, splice and small in-frame variants in IL11RA
    abolish or sharply reduce IL-11 receptor function. Many missense and
    in-frame variants prevent receptor maturation, so the receptor is retained
    in the endoplasmic reticulum and does not reach the cell surface.
  biological_scale: MOLECULAR
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: IL11RA
    term:
      id: hgnc:5967
      label: IL11RA
  molecular_functions:
  - preferred_term: interleukin-11 receptor activity
    term:
      id: GO:0004921
      label: interleukin-11 receptor activity
    modifier: DECREASED
  evidence:
  - reference: PMID:21741611
    reference_title: "Inactivation of IL11 signaling causes craniosynostosis, delayed tooth eruption, and supernumerary teeth."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In cell-transfection experiments, the p.Arg296Trp mutation rendered the
      receptor unable to mediate the IL11 signal, indicating that the mutation
      causes loss of IL11RA function.
    explanation: >-
      A patient missense variant abolishes receptor signalling in transfected
      cells.
  - reference: PMID:30282020
    reference_title: "Mutations in Craniosynostosis Patients Cause Defective Interleukin-11 Receptor Maturation and Drive Craniosynostosis-like Disease in Mice."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we show that patient mutations prevented maturation of the IL-11R,
      resulting in endoplasmic reticulum retention and diminished cell surface
      appearance.
    explanation: >-
      Patient variants block receptor maturation and surface delivery, the
      cellular basis of the loss of function.
  - reference: PMID:37596289
    reference_title: "The interleukin-11 receptor variant p.W307R results in craniosynostosis in humans."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Expression of IL-11R-W307R in cells shows impaired maturation of the
      IL-11R, no transport to the cell surface and intracellular retention.
    explanation: >-
      A further patient variant shows the same maturation and trafficking
      defect.
  - reference: CGGV:assertion_903705e8-451e-4ed9-b3fc-d50df68c3fa2-2023-04-20T040000.000Z
    reference_title: "IL11RA / craniosynostosis and dental anomalies (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The mechanism of pathogenicity is reported to be loss of function."
    explanation: >-
      The ClinGen curation records loss of function as the disease mechanism.
  downstream:
  - target: Loss of IL-11 Classic Signalling in Cranial Mesenchyme
    description: >-
      Without a functional membrane receptor, IL-11 cannot activate gp130 and
      STAT3 in IL11RA-expressing cells.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:24498618
      reference_title: "Mutations in the interleukin receptor IL11RA cause autosomal recessive Crouzon-like craniosynostosis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Using transient coexpression in HEK293T and COS7 cells, we demonstrated
        dramatically reduced IL11-mediated STAT3 phosphorylation for all
        mutations.
      explanation: >-
        Every tested patient variant reduced IL-11-induced STAT3 activation, the
        downstream readout of the receptor.
    - reference: PMID:37596289
      reference_title: "The interleukin-11 receptor variant p.W307R results in craniosynostosis in humans."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Because the ligand IL-11 is located in the extracellular space and binds
        to the IL-11R at the cell surface, the absence of IL-11R at the plasma
        membrane results in a complete loss of IL-11 signaling.
      explanation: >-
        Links the absence of surface receptor to complete loss of IL-11
        signalling.
- name: Loss of IL-11 Classic Signalling in Cranial Mesenchyme
  description: >-
    IL-11 normally signals through the membrane-bound IL-11 receptor and gp130
    (classic signalling) in cranial mesenchyme around the coronal and
    lambdoid suture tips. In mice it is classic signalling, not trans-signalling
    through soluble receptor, that skull development depends on. IL-11
    signalling restricts suture fusion and tooth number, so its loss removes
    a restraint on suture closure and on dental development. This node is the
    IL-11 instance of the restraint-loss entry point of the cranial suture
    module.
  biological_scale: CELLULAR
  conforms_to: "cranial_suture_premature_fusion#Loss of Suture Patency Restraint"

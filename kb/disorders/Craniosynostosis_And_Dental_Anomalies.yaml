    explanation: >-
      Records the previously described reduced bone remodelling of the Il11ra
      null mouse.
  downstream:
  - target: Premature Multisuture Cranial Synostosis
    description: >-
      Proposed: reduced osteoclast-mediated remodelling at the suture bone fronts
      tips the balance toward ossification and fusion.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:24498618
      reference_title: "Mutations in the interleukin receptor IL11RA cause autosomal recessive Crouzon-like craniosynostosis."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: OTHER
      snippet: >-
        Therefore, we hypothesize that the pathogenesis of the disorder in
        IL11RA patients is caused by a disruption of the osteoblast-mediated,
        RANKL-dependent, indirect positive effect on osteoclastogenesis or
        osteoclast activity.
      explanation: >-
        The authors state this edge as a hypothesis; it has not been tested
        directly in suture tissue.
- name: Premature Multisuture Cranial Synostosis
  description: >-
    Premature bony fusion of several cranial sutures, ranging from multisuture
    synostosis to pansynostosis, sometimes progressing after birth. Multisuture

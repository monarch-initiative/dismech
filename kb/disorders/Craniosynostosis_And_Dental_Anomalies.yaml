animal_models:
- name: Il11ra1 null mouse
  species: Mouse
  genotype: Il11ra1 -/-
  description: >-
    Il11ra1 null mice have disturbed cranial growth and suture activity and an
    incompletely penetrant craniosynostosis-like phenotype with snout
    displacement and tooth abnormalities, together with reduced long bone
    remodelling. Il11 null mice lack the skull phenotype, so the skull and bone
    phenotypes may be specific to loss of the receptor.
  publication: PMID:21741611
  evidence:
  - reference: PMID:21741611
    reference_title: "Inactivation of IL11 signaling causes craniosynostosis, delayed tooth eruption, and supernumerary teeth."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We also observed disturbed cranial growth and suture activity in the
      Il11ra null mutant mice
    explanation: >-
      The null mouse reproduces the cranial suture phenotype.
  - reference: PMID:34239012
    reference_title: "Similarities and differences between IL11 and IL11RA1 knockout mice for lung fibro-inflammation, fertility and craniosynostosis."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: MODEL_ORGANISM
    snippet: >-
      mutation in Il11ra1 in the mouse is associated with incompletely
      penetrant snout displacement and tooth abnormalities: a
      craniosynostosis-like phenotype
    explanation: >-
      Summarizes the incompletely penetrant craniofacial and dental phenotype of
      the receptor null mouse.
  - reference: PMID:34239012
    reference_title: "Similarities and differences between IL11 and IL11RA1 knockout mice for lung fibro-inflammation, fertility and craniosynostosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Unlike Il11ra1-/- mice, Il11-/- mice do not have craniosynostosis, have
      normal long bone mass and reduced body weights.
    explanation: >-
      The ligand null mouse lacks the skull phenotype of the receptor null.
  modeled_mechanisms:
  - target: Premature Multisuture Cranial Synostosis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces disturbed suture activity and a craniosynostosis-like snout
      deviation.
    limitations: >-
      The skull phenotype is incompletely penetrant, and the mouse
      craniosynostosis-like phenotype is scored as snout deviation rather than
      as the multisuture fusion seen in patients.
    evidence:
    - reference: PMID:34239012
      reference_title: "Similarities and differences between IL11 and IL11RA1 knockout mice for lung fibro-inflammation, fertility and craniosynostosis."
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: MODEL_ORGANISM
      snippet: >-
        mutation in Il11ra1 in the mouse is associated with incompletely
        penetrant snout displacement and tooth abnormalities: a
        craniosynostosis-like phenotype
      explanation: >-
        The receptor null mouse shows an incompletely penetrant
        craniosynostosis-like phenotype.
  - target: Reduced IL-11-Dependent Bone Remodelling
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Reduced osteoclast differentiation and increased trabecular bone.
    evidence:
    - reference: PMID:24498618
      reference_title: "Mutations in the interleukin receptor IL11RA cause autosomal recessive Crouzon-like craniosynostosis."
      supports: SUPPORT
      quote_role: BACKGROUND
      evidence_source: MODEL_ORGANISM
      snippet: >-
        a reduction of osteoclast differentiation has been shown to be
        responsible for increased trabecular bone volume
      explanation: >-
        Summarizes the reduced osteoclast differentiation of the receptor null
        mouse.

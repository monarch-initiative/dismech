    snippet: "Hodgkin and Reed/Sternberg (HRS) cells are the hallmark cells of Hodgkin's lymphoma (HL). They are large, often multinucleated with a peculiar morphology and an unusual immunophenotype, that does not resemble any normal cell in the body."
    explanation: Describes the hallmark histopathologic appearance of Reed-Sternberg cells in Hodgkin lymphoma.

diagnosis:
- name: Excisional Lymph Node Biopsy
  diagnosis_term:
    preferred_term: Lymph Node Biopsy
    term:
      id: NCIT:C51900
      label: Lymph Node Biopsy
  description: >-
    Open excisional lymph node biopsy with morphologic, immunophenotypic, and
    molecular genetic evaluation is the gold standard for establishing a
    definitive diagnosis of lymphoma.
  results: Architecture-preserving nodal tissue specimen enabling subtype classification.
  evidence:
  - reference: PMID:31894937
    reference_title: "Lymphoma: Diagnosis and Treatment."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "An open lymph node biopsy is preferred for diagnosis."
    explanation: Identifies open lymph node biopsy as the preferred diagnostic procedure for lymphoma.
  - reference: PMID:9830628
    reference_title: "Establishing the diagnosis of lymphoma: from initial biopsy to clinical staging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Routine morphologic examination of excisional biopsies from nodal or extranodal sites provides the cornerstone for establishing a definitive diagnosis."
    explanation: Confirms excisional biopsy examination as the cornerstone of lymphoma diagnosis.

- name: Hodgkin/Reed-Sternberg Cell Origin
  subtypes:
  - Hodgkin Lymphoma
  description: >-
    Hodgkin lymphoma is characterized by clonal Hodgkin/Reed-Sternberg cells
    that derive from pre-apoptotic germinal center B cells and survive via
    aberrant NF-kappaB signaling.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  - preferred_term: germinal center B cell
    term:
      id: CL:0000844
      label: germinal center B cell
  locations:
  - preferred_term: lymph node
    term:
      id: UBERON:0000029
      label: lymph node
  biological_processes:
  - preferred_term: negative regulation of apoptotic process
    modifier: INCREASED
    term:
      id: GO:0043066
      label: negative regulation of apoptotic process
  - preferred_term: canonical NF-kappaB signal transduction
    modifier: INCREASED
    term:
      id: GO:0007249
      label: canonical NF-kappaB signal transduction
  evidence:
  - reference: PMID:15618006
    reference_title: "The Hodgkin and Reed/Sternberg cell."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "HRS cells in nearly all cases of HL derive from B cells, and only rarely from T cells."
    explanation: The abstract states that Hodgkin/Reed-Sternberg cells are derived from B cells.
  - reference: PMID:15618006
    reference_title: "The Hodgkin and Reed/Sternberg cell."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Notably, the pattern of somatic mutations in their rearranged immunoglobulin V genes suggests that they are derived from pre-apoptotic germinal center B cells. The pathogenesis of HL is still largely unresolved, but it is now clear that aberrant activation of several signalling pathways (such as the NFkappaB pathway) is of key importance for HRS cell survival."
    explanation: Identifies pre-apoptotic germinal center B-cell origin and NF-kappaB pathway activation as central to HRS cell survival.
  downstream:
  - target: Malignant Lymphoid Proliferation
    description: Survival and clonal expansion of Hodgkin/Reed-Sternberg cells drive Hodgkin lymphoma tumor formation.
    evidence:
    - reference: PMID:15618006
      reference_title: "The Hodgkin and Reed/Sternberg cell."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Despite their rarity in HL tissues, HRS cells are the clonal tumour cells of HL."
      explanation: Establishes HRS cells as the clonal malignant population in Hodgkin lymphoma.
- name: MYC-Driven Proliferative Dysregulation
  subtypes:
  - Non-Hodgkin Lymphoma
  description: >-
    Acquisition of MYC chromosomal rearrangements or dysregulated MYC expression
    in B-cell non-Hodgkin lymphomas—including indolent B-cell lymphomas
    undergoing histologic transformation and double-hit B-cell lymphomas—drives
    cell-cycle progression and rapid B-cell proliferation.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  genes:
  - preferred_term: MYC
    term:
      id: hgnc:7553
      label: MYC
  molecular_functions:
  - preferred_term: DNA-binding transcription factor activity
    modifier: INCREASED
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  biological_processes:
  - preferred_term: cell population proliferation
    modifier: INCREASED
    term:
      id: GO:0008283
      label: cell population proliferation
  evidence:
  - reference: PMID:16304397
    reference_title: "Biology and management of histologic transformation of indolent lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A myriad of genetic lesions have been identified in HT, and provide insight into its pathogenesis. These include genes regulating proliferation (C-MYC and C-MYC-regulated genes); control of the cell cycle (CDKN2a and CDKN2B); and programmed cell death (TP53, C-MYC, and BCL2)."
    explanation: Identifies MYC genetic lesions as drivers of B-cell proliferation during histologic transformation of indolent B-cell lymphoma.
  - reference: PMID:24679006
    reference_title: "TP53 mutations are frequent events in double-hit B-cell lymphomas with MYC and BCL2 but not MYC and BCL6 translocations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Double-hit lymphomas (DHL) with MYC and either BCL2 or BCL6 rearrangements are rare neoplasms with an aggressive clinical presentation and grim prognosis."
    explanation: Identifies MYC rearrangements as a defining oncogenic lesion in aggressive double-hit B-cell lymphomas.
  downstream:
  - target: BCL2 and TP53-Mediated Apoptotic Evasion
    causal_link_type: DIRECT
    description: In double-hit and transformed B-cell lymphomas, MYC rearrangement co-occurs and cooperates with enforced BCL2 overexpression and TP53 inactivation to counter MYC-induced apoptosis during clonal evolution.
    evidence:
    - reference: PMID:24679006
      reference_title: "TP53 mutations are frequent events in double-hit B-cell lymphomas with MYC and BCL2 but not MYC and BCL6 translocations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified TP53 mutations in MYC+/BCL2+ lymphomas at a frequency intermediate between diffuse large B-cell lymphoma (DLBCL) and Burkitt lymphoma."
      explanation: Documents frequent co-occurrence of TP53 mutations in MYC+/BCL2+ double-hit B-cell lymphomas.
  - target: Malignant Lymphoid Proliferation
    causal_link_type: DIRECT
    description: MYC-driven proliferative lesions promote rapid clonal expansion and extranodal involvement in transformed B-cell lymphomas.
    evidence:
    - reference: PMID:16304397
      reference_title: "Biology and management of histologic transformation of indolent lymphoma."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Clinically these present with a rapid change in the behavior of the disease, with evidence of a highly proliferative malignancy with a propensity to involve extranodal sites."
      explanation: Links transformation-associated proliferative genetic lesions to highly proliferative malignancy and extranodal spread.
- name: BCL2 and TP53-Mediated Apoptotic Evasion
  subtypes:
  - Non-Hodgkin Lymphoma
  description: >-
    Enforced BCL2 overexpression via chromosomal translocation and inactivating
    somatic TP53 mutations in transformed and MYC+/BCL2+ double-hit B-cell
    non-Hodgkin lymphomas synergistically inhibit p53-mediated and mitochondrial
    programmed cell death, conferring a clonal survival advantage.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: B cell
    term:
      id: CL:0000236
      label: B cell
  genes:
  - preferred_term: BCL2
    term:
      id: hgnc:990
      label: BCL2
  - preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  molecular_functions:
  - preferred_term: identical protein binding
    modifier: INCREASED
    term:
      id: GO:0042802
      label: identical protein binding
  - preferred_term: DNA-binding transcription factor activity
    modifier: DECREASED
    term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
  biological_processes:
  - preferred_term: negative regulation of apoptotic process
    modifier: INCREASED
    term:
      id: GO:0043066
      label: negative regulation of apoptotic process
  evidence:
  - reference: PMID:24679006
    reference_title: "TP53 mutations are frequent events in double-hit B-cell lymphomas with MYC and BCL2 but not MYC and BCL6 translocations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings indicate a significant difference between these two types of DHL at a molecular level with pathogenetic implications, as arguably, TP53 mutations inhibiting p53 mediated promotion of apoptosis pose a synergistic advantage in clonal evolution of cells with malignantly enforced overexpression of BCL2."
    explanation: Demonstrates that TP53 mutations and enforced BCL2 overexpression synergistically suppress apoptosis during clonal evolution of MYC+/BCL2+ double-hit B-cell lymphomas.
  - reference: PMID:16304397
    reference_title: "Biology and management of histologic transformation of indolent lymphoma."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These include genes regulating proliferation (C-MYC and C-MYC-regulated genes); control of the cell cycle (CDKN2a and CDKN2B); and programmed cell death (TP53, C-MYC, and BCL2)."
    explanation: Identifies TP53 and BCL2 genetic lesions as recurrent regulators of defective programmed cell death in histologic transformation of B-cell lymphomas.
  downstream:
  - target: Malignant Lymphoid Proliferation
    causal_link_type: DIRECT
    description: Synergistic suppression of apoptosis by BCL2 overexpression and TP53 mutation enables survival and aggressive clonal expansion of malignant B cells.
    evidence:
    - reference: PMID:24679006
      reference_title: "TP53 mutations are frequent events in double-hit B-cell lymphomas with MYC and BCL2 but not MYC and BCL6 translocations."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our findings indicate a significant difference between these two types of DHL at a molecular level with pathogenetic implications, as arguably, TP53 mutations inhibiting p53 mediated promotion of apoptosis pose a synergistic advantage in clonal evolution of cells with malignantly enforced overexpression of BCL2."
      explanation: Links cooperative TP53 and BCL2 apoptotic evasion directly to malignant B-cell clonal evolution.

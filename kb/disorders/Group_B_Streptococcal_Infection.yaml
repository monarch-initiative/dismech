pathophysiology:
- name: Maternal rectovaginal colonisation
  description: >-
    GBS asymptomatically colonises the maternal gut and genital tract; about 18% of
    pregnant women worldwide carry GBS in the rectovaginal tract (11-35% by region),
    the reservoir from which the neonate is infected.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:42747473
    reference_title: Time to rethink prevention of neonatal group B streptococcal disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      A large meta-analysis covering nearly 300 000 pregnant women worldwide
      estimated that 18% are colonized with GBS in the rectovaginal tract with
      remarkable regional and ethnical variation (11%–35%)
    explanation: Quantifies maternal rectovaginal colonisation as the reservoir for vertical transmission.
  downstream:
  - target: Ascending and intrapartum invasion of the amniotic compartment
    description: >-
      Maternal colonisation provides the organisms that ascend into the amniotic
      compartment or are transmitted to the neonate at delivery.
- name: Sialylated capsular polysaccharide immune evasion
  description: >-
    The sialic-acid-rich GBS capsular polysaccharide, together with membrane
    glycolipids, mediates evasion of the neonatal immune defence, a key virulence
    determinant and the basis of serotype-specific protection.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: symbiont-mediated evasion of host immune response
    modifier: INCREASED
    term:
      id: GO:0042783
      label: symbiont-mediated evasion of host immune response
  evidence:
  - reference: PMID:42747473
    reference_title: Time to rethink prevention of neonatal group B streptococcal disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      evasion of neonatal immune defense mediated by GBS capsular polysaccharide
      and membrane glycolipids
    explanation: Supports capsular polysaccharide and membrane glycolipids as mediators of immune evasion.
  - reference: PMID:42747473
    reference_title: Time to rethink prevention of neonatal group B streptococcal disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Further characterization of GBS can be performed by serotyping the sialic
      acid-rich capsular polysaccharide into one of the ten serotypes Ia, Ib, II-IX
    explanation: Establishes the sialic-acid-rich capsular polysaccharide and the serotype scheme it defines.
  downstream:
  - target: Bloodstream invasion and bacteraemia
    description: >-
      Immune evasion allows GBS to survive in blood and establish invasive disease.
- name: Beta-haemolysin/cytolysin-mediated barrier breach
  description: >-
    The GBS beta-haemolysin/cytolysin, an ornithine rhamnolipid pigment whose
    expression is repressed by the CovR/S two-component system, lyses host cells and
    breaches the amniotic epithelial and chorioamniotic barriers. Hyperhaemolytic
    clinical isolates from women in preterm labour carry covR/S mutations.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: symbiont-mediated cytolysis of host cell
    modifier: INCREASED
    term:
      id: GO:0001897
      label: symbiont-mediated cytolysis of host cell
  evidence:
  - reference: PMID:23712433
    reference_title: A hemolytic pigment of Group B Streptococcus allows bacterial penetration of human placenta.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      We demonstrate for the first time that hemolytic and cytolytic activity of
      GBS is due to the ornithine rhamnolipid pigment and not due to a pore-forming
      protein toxin.
    explanation: Identifies the ornithine rhamnolipid pigment as the GBS haemolysin/cytolysin.
  - reference: PMID:23712433
    reference_title: A hemolytic pigment of Group B Streptococcus allows bacterial penetration of human placenta.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      strains lacking the hemolysin repressor CovR/S accelerate amniotic barrier
      failure and penetrate chorioamniotic membranes in a hemolysin-dependent
      manner. Clinical GBS isolates obtained from women in preterm labor are
      hyperhemolytic and some are associated with covR/S mutations.
    explanation: Supports CovR/S-repressed haemolysin driving amniotic barrier failure and links hyperhaemolytic covR/S-mutant isolates to preterm labour.
  downstream:
  - target: Ascending and intrapartum invasion of the amniotic compartment
    description: >-
      Haemolysin-dependent barrier breach permits GBS penetration of the amniotic
      compartment.
  - target: Bloodstream invasion and bacteraemia
    description: >-
      Cytolytic barrier breach contributes to tissue invasion and bloodstream entry.
- name: Pilus- and HvgA-mediated adhesion and barrier crossing
  description: >-
    GBS pilus islands mediate adhesion and colonisation. The ST-17-specific adhesin
    HvgA promotes stronger intestinal colonisation and crossing of the intestinal
    and blood-brain barriers, which underlies the elevated rate of meningitis caused
    by the hypervirulent ST-17 clone.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: adhesion of symbiont to host
    modifier: INCREASED
    term:
      id: GO:0044406
      label: adhesion of symbiont to host
  evidence:
  - reference: PMID:42747473
    reference_title: Time to rethink prevention of neonatal group B streptococcal disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Bacterial pathogenicity factors involved in adhesion and colonization, e.g.
      GBS pilus islands
    explanation: Supports pilus islands as adhesion and colonisation factors.
  - reference: PMID:31779587
    reference_title: High prevalence of group B streptococcus ST17 hypervirulent clone among non-pregnant patients from a Hungarian venereology clinic.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      This variant can be responsible for the stronger intestinal colonization of
      the ST-17 isolates, as well as for crossing the intestinal and blood-brain
      barriers, leading to meningitis in increased rates
    explanation: Supports the ST-17 adhesin HvgA driving intestinal colonisation and blood-brain barrier crossing.
  downstream:
  - target: Blood-brain barrier crossing and meningitis
    description: >-
      HvgA-mediated barrier crossing seeds the meninges, especially in ST-17 disease.
- name: Hypervirulent ST-17 clone
  description: >-
    GBS sequence type 17, strongly associated with serotype III, is the
    "hypervirulent clone" associated with invasive neonatal infection and
    especially meningitis. It is also prevalent among non-pregnant adult carriers.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:31779587
    reference_title: High prevalence of group B streptococcus ST17 hypervirulent clone among non-pregnant patients from a Hungarian venereology clinic.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      ST-17 was shown to be associated with invasive neonatal infections,
      especially meningitis, therefore was called the “hypervirulent clone”.
    explanation: Establishes ST-17 as the hypervirulent clone associated with invasive neonatal meningitis.
  - reference: PMID:31779587
    reference_title: High prevalence of group B streptococcus ST17 hypervirulent clone among non-pregnant patients from a Hungarian venereology clinic.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      21.9% of all strains belonged to the hypervirulent ST17 clone, most being of
      serotype III and all were rib +.
    explanation: Reports ST-17 prevalence and its association with serotype III in a cohort of non-pregnant adult isolates.
  downstream:
  - target: Blood-brain barrier crossing and meningitis
    description: >-
      ST-17 lineages disproportionately cause neonatal meningitis.
- name: Low maternal anti-capsular antibody and neonatal immune immaturity
  description: >-
    Low maternal serotype-specific anti-capsular IgG, which is transferred to the
    infant, is associated with increased risk of invasive GBS disease in early life;
    together with the immunological immaturity of the neonate (most marked in
    preterm infants) this underlies susceptibility.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:42521820
    reference_title: "Maternal 6-valent group B Streptococcus vaccine in non-pregnant and pregnant females: a randomized phase 1/2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      numerous seroepidemiology studies correlating GBS serotype-specific anti-CPS
      immunoglobulin G (IgG) levels in maternal, cord or infant serum with reduced
      risk of invasive GBS disease in early life
    explanation: Supports low maternal/infant anti-capsular IgG as a correlate of susceptibility to invasive disease.
  - reference: PMID:42747473
    reference_title: Time to rethink prevention of neonatal group B streptococcal disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Preterm infants are at approximately tenfold higher risk for GBS-related
      death than term infants
    explanation: Supports greater vulnerability of preterm infants, consistent with immune immaturity as a susceptibility factor.
  downstream:
  - target: Bloodstream invasion and bacteraemia
    description: >-
      Inadequate protective antibody and immature neonatal defences permit invasive
      infection.
- name: Ascending and intrapartum invasion of the amniotic compartment
  description: >-
    GBS breaches the placental and chorioamniotic membranes and the amniotic
    epithelium, reaching the amniotic fluid and fetus and provoking chorioamnionitis;
    this is the route of in-utero and intrapartum infection that leads to preterm
    birth, stillbirth and early-onset neonatal disease.
  biological_scale: TISSUE
  evidence:
  - reference: PMID:42747473
    reference_title: Time to rethink prevention of neonatal group B streptococcal disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The pathogenesis of EOS involves ascension of GBS from the vagina leading to
      colonization of the placental membranes and amniotic fluid, potentially
      provoking chorioamnionitis and/or perinatal transmission during vaginal birth
    explanation: Supports ascending amniotic invasion and chorioamnionitis as the mechanism of early-onset disease.
  downstream:
  - target: Chorioamnionitis
    description: Amniotic invasion provokes chorioamnionitis.
  - target: Premature birth
    description: Intra-amniotic infection and inflammation precipitate preterm birth.
  - target: Bloodstream invasion and bacteraemia
    description: Organisms acquired in utero or at birth enter the neonatal bloodstream.
- name: Bloodstream invasion and bacteraemia
  description: >-
    GBS that has crossed epithelial or mucosal barriers invades the bloodstream,
    producing bacteraemia and sepsis, the dominant presentation of invasive neonatal
    disease.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:30900541
    reference_title: Group B Streptococcus (Streptococcus agalactiae).
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Group B Streptococcus remains the most common culture-confirmed neonatal bacterial infection in the United States
    explanation: Supports invasive bloodstream GBS infection as the leading culture-confirmed neonatal bacterial infection.
  downstream:
  - target: Sepsis
    description: Bloodstream invasion produces neonatal sepsis.
  - target: Bacteremia
    description: Invasion of the bloodstream produces bacteraemia.
  - target: Pneumonia
    description: >-
      In neonates the immature lung is a major portal of entry and GBS produces
      pneumonia alongside bloodstream infection.
  - target: Blood-brain barrier crossing and meningitis
    description: Circulating GBS crosses the blood-brain barrier to cause meningitis.
- name: Blood-brain barrier crossing and meningitis
  description: >-
    Circulating GBS crosses the blood-brain barrier at the brain microvascular
    endothelium to invade the central nervous system and cause meningitis, which
    co-occurs with sepsis more often in late-onset than early-onset disease (31% vs
    9%).
  biological_scale: TISSUE
  cell_types:
  - preferred_term: brain microvascular endothelial cell
    term:
      id: CL:2000044
      label: brain microvascular endothelial cell
  biological_processes:
  - preferred_term: symbiont entry into host cell
    modifier: INCREASED
    term:
      id: GO:0046718
      label: symbiont entry into host cell
  evidence:
  - reference: PMID:42747473
    reference_title: Time to rethink prevention of neonatal group B streptococcal disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The critical clinical problem arises from neonatal GBS infections, mainly
      sepsis and meningitis, which significantly contribute to neonatal death and
      long-term morbidity.
    explanation: Supports meningitis as a principal invasive neonatal presentation contributing to death and long-term morbidity.
  downstream:
  - target: Meningitis
    description: Central nervous system invasion manifests as meningitis.
  - target: Neurodevelopmental impairment
    description: >-
      Meningitis and invasive neonatal infection leave neurodevelopmental sequelae
      in survivors.
phenotypes:

diagnosis:
- name: Microbial culture
  description: >-
    Invasive GBS disease is confirmed by culture of the organism from a normally
    sterile site such as blood or cerebrospinal fluid.
  diagnosis_term:
    preferred_term: microbial culture
    term:
      id: NCIT:C25300
      label: Microbial Culture Procedure
  evidence:
  - reference: PMID:30900541
    reference_title: Group B Streptococcus (Streptococcus agalactiae).
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Group B Streptococcus remains the most common culture-confirmed neonatal bacterial infection in the United States
    explanation: Supports culture confirmation as the basis of GBS diagnosis.
- name: Antenatal rectovaginal GBS screening
  description: >-
    Universal screening of pregnant women at 36 0/7 to 37 6/7 weeks of gestation by
    a single swab passed first into the lower vagina and then into the rectum
    identifies carriers who should receive intrapartum prophylaxis.
  diagnosis_term:
    preferred_term: screening for maternal GBS colonisation
    term:
      id: NCIT:C25300
      label: Microbial Culture Procedure
  evidence:
  - reference: PMID:42747473

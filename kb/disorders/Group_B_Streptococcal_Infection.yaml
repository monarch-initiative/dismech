    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the American College of Obstetricians & Gynecologists recommends a universal
      screening of all pregnant women between 36 and 37 weeks and 6 days of
      gestation with a cultural swab, that is inserted first into the lower vagina
      and then into the rectum
    explanation: Supports the 36-37 week universal culture-based screening protocol.
treatments:
- name: Antibiotic therapy
  description: >-
    Penicillin G remains the mainstay of therapy for invasive GBS disease, with
    ampicillin a standard alternative; reduced penicillin susceptibility is seen in
    select isolates and resistance to clindamycin, erythromycin and fluoroquinolones
    is increasing.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: penicillin G
      term:
        id: CHEBI:18208
        label: benzylpenicillin
    - preferred_term: ampicillin
      term:
        id: CHEBI:28971
        label: ampicillin
  target_mechanisms:
  - target: Bloodstream invasion and bacteraemia
    description: Beta-lactam therapy clears invasive GBS bloodstream infection.
    evidence:
    - reference: PMID:30900541
      reference_title: Group B Streptococcus (Streptococcus agalactiae).
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Penicillin G remains the mainstay of therapy, although reduced penicillin
        susceptibility has been observed in select isolates.
      explanation: Supports penicillin G as the mainstay of GBS therapy, with a noted caveat of reduced susceptibility in some isolates.
  evidence:
  - reference: PMID:30900541
    reference_title: Group B Streptococcus (Streptococcus agalactiae).
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Increased frequency of resistance to non-beta-lactam antibiotics, including
      clindamycin, erythromycin, and fluoroquinolones, has been observed, with some
      isolates demonstrating resistance to vancomycin.
    explanation: Records the rising non-beta-lactam resistance that constrains alternative therapy, a clinically important caveat.
  - reference: PMID:31779587
    reference_title: High prevalence of group B streptococcus ST17 hypervirulent clone among non-pregnant patients from a Hungarian venereology clinic.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      All isolates were fully susceptible to penicillin, but erythromycin and
      clindamycin resistance was high (41.7 and 35.4%, respectively)
    explanation: Supports retained penicillin susceptibility alongside high macrolide/clindamycin resistance in a clinical isolate collection.
- name: Intrapartum antibiotic prophylaxis
  description: >-
    Intrapartum penicillin or ampicillin given to colonised or at-risk women
    suppresses maternal-to-neonatal transmission and has markedly reduced early-onset
    disease; it has no effect on late-onset disease because its protective effect
    ends shortly after birth.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: intrapartum antibiotic prophylaxis
    term:
      id: NCIT:C51993
      label: Antibiotic Prophylaxis
    therapeutic_agent:
    - preferred_term: penicillin G
      term:
        id: CHEBI:18208
        label: benzylpenicillin
    - preferred_term: ampicillin
      term:
        id: CHEBI:28971
        label: ampicillin
  target_mechanisms:
  - target: Ascending and intrapartum invasion of the amniotic compartment
    description: >-
      Intrapartum antibiotics suppress intrapartum maternal-to-neonatal transmission,
      preventing early-onset disease but not late-onset disease.
    evidence:
    - reference: PMID:30900541
      reference_title: Group B Streptococcus (Streptococcus agalactiae).
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        Intrapartum antibiotic prophylaxis has reduced the incidence of early-onset
        neonatal disease without a notable impact on the incidence of late-onset
        neonatal disease.
      explanation: Supports that prophylaxis reduces early-onset but not late-onset disease.
  evidence:
  - reference: PMID:42747473
    reference_title: Time to rethink prevention of neonatal group B streptococcal disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      As a consequence of positive screening results, IAP with penicillin and
      ampicillin are mainly applied worldwide
    explanation: Supports penicillin and ampicillin as the agents used for intrapartum prophylaxis.
  - reference: PMID:42747473
    reference_title: Time to rethink prevention of neonatal group B streptococcal disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      While penicillin resistance remains rare, clindamycin resistant GBS strains
      are increasing
    explanation: Clinically important caveat that clindamycin, the penicillin-allergy alternative for prophylaxis, faces rising resistance.
clinical_trials:
- name: NCT03765073
  phase: PHASE_II
  status: COMPLETED
  description: >-
    Phase 1/2 randomized, placebo-controlled trial of the investigational maternal
    hexavalent capsular polysaccharide-protein conjugate GBS vaccine (GBS6,
    serotypes Ia, Ib, II, III, IV, V) in non-pregnant and pregnant women and their
    infants. ClinicalTrials.gov registers it under phase 2. GBS6 elicited robust,
    transplacentally transferred serotype-specific antibody responses, supporting
    continued development of a maternal vaccine for a disease with no licensed
    vaccine.
  target_phenotypes:
  - preferred_term: Neonatal sepsis
    term:
      id: HP:0040187
      label: Neonatal sepsis
  evidence:
  - reference: clinicaltrials:NCT03765073
    reference_title: "A PHASE 1/2, RANDOMIZED, PLACEBO-CONTROLLED, OBSERVER-BLINDED TRIAL TO EVALUATE THE SAFETY, TOLERABILITY, AND IMMUNOGENICITY OF A MULTIVALENT GROUP B STREPTOCOCCUS VACCINE IN HEALTHY NONPREGNANT WOMEN AND PREGNANT WOMEN 18 TO 40 YEARS OF AGE AND THEIR INFANTS"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Phase 1/2, randomized, placebo-controlled, observer-blinded study will evaluate the safety, tolerability and immunogenicity of the investigational multivalent group B streptococcus vaccine
    explanation: Establishes the trial identity, design and phase from the registry record.
  - reference: PMID:42521820
    reference_title: "Maternal 6-valent group B Streptococcus vaccine in non-pregnant and pregnant females: a randomized phase 1/2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      GBS6 elicited robust immune responses in non-pregnant and pregnant
      individuals; additionally, serotype-specific quantitative and functional
      antibody responses were observed in infants whose parent received GBS6.
    explanation: Reports the immunogenicity result of the maternal GBS6 vaccine trial.
prevalence:
- population: United States neonates (term and preterm)
  measure_type: BIRTH_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 26.0
  rate_denominator: LIVE_BIRTHS
  notes: >-
    US early-onset GBS disease incidence fell from 1.8 per 1000 live births in the
    early 1990s to 0.26 per 1000 live births by 2010 after intrapartum prophylaxis.
  evidence:
  - reference: PMID:42747473
    reference_title: Time to rethink prevention of neonatal group B streptococcal disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the incidence of EOS was reduced from 1.8/1000 live births in the early
      1990 s to 0.26/1000 live births in 2010 in the United States
    explanation: Source for the post-prophylaxis US early-onset disease incidence.
notes: >-
  Serotype distribution: capsular serotypes Ia, Ib, II, III, IV and V account for
  more than 97% of infant disease globally, with serotype III (strongly linked to
  the hypervirulent ST-17 clone) causing most cases (PMID:42521820). The global
  burden in 2020 was estimated at about 231,800 early-onset and 162,200 late-onset
  infant cases, with roughly 100,000 infant deaths and a case-fatality rate of
  5-19% in the first three months of life (PMID:42747473). The two neonatal strata
  (early-onset and late-onset disease) are kept as subtypes of one organism-level
  entry rather than separate entries; see review_notes. Chorioamnionitis is left
  with an unbound preferred_term because HPO has no chorioamnionitis term. No
  mechanism module was used: granuloma and the available barrier/sepsis modules did
  not fit the GBS pathophysiology closely enough to carry their implied cell and
  process terms honestly.
review_notes: >-
  Deliberately lumped. Early-onset neonatal disease, late-onset neonatal disease,
  pregnancy-associated invasive disease and non-pregnant adult invasive disease are
  all kept within this single organism-level entry (MONDO:0700218, an
  organism-defined term) as has_subtypes strata rather than promoted to separate
  entries, following design decisions section 3e: all are caused by one organism,
  Streptococcus agalactiae, sharing the virulence mechanisms (sialylated capsule,
  beta-haemolysin/cytolysin, pili/HvgA) curated here. Each stratum is given a
  subtype row because it is documented to differ from its siblings on timing,
  transmission route, prophylaxis responsiveness or affected population, but none
  meets the two-axis Treponematoses promotion test, and the precedents
  (Erysipelothrix_Rhusiopathiae_Infectious_Disease,
  Yersinia_Enterocolitica_Infectious_Disease) curate organism-level MONDO terms the
  same way. subtype_term is omitted rather than bound to the parent term, as no
  honest narrower MONDO term was found for the neonatal onset strata.

  phenotype_term:
    preferred_term: Neonatal sepsis
    term:
      id: HP:0040187
      label: Neonatal sepsis
  description: >-
    Sepsis is the dominant presentation of invasive neonatal GBS disease in both
    early-onset and late-onset forms.
  evidence:
  - reference: PMID:42747473
    reference_title: Time to rethink prevention of neonatal group B streptococcal disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The critical clinical problem arises from neonatal GBS infections, mainly
      sepsis and meningitis, which significantly contribute to neonatal death and
      long-term morbidity.
    explanation: Supports sepsis as a principal neonatal presentation of GBS infection.
- name: Pneumonia
  phenotype_term:
    preferred_term: Pneumonia
    term:
      id: HP:0002090
      label: Pneumonia
  description: >-
    Pneumonia is a common presentation of early-onset neonatal GBS disease, the
    immature lung being an important portal of entry.
  evidence:
  - reference: PMID:30900541
    reference_title: Group B Streptococcus (Streptococcus agalactiae).
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Invasive disease due to group B Streptococcus infection (Streptococcus agalactiae) results in a wide spectrum of clinical disease.
    explanation: Supports the wide clinical spectrum of invasive GBS disease, of which neonatal pneumonia is a recognised component.
- name: Meningitis
  phenotype_term:
    preferred_term: Meningitis
    term:
      id: HP:0001287
      label: Meningitis
  description: >-
    GBS meningitis follows blood-brain barrier crossing and co-occurs with sepsis
    more often in late-onset disease (31%) than in early-onset disease (9%).
  evidence:
  - reference: PMID:42747473
    reference_title: Time to rethink prevention of neonatal group B streptococcal disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Of note, meningitis more often co-occurs in LOS than in EOS (31 vs. 9%)
    explanation: Quantifies meningitis co-occurrence across the two neonatal strata.
- name: Neurodevelopmental impairment
  phenotype_term:
    preferred_term: Neurodevelopmental abnormality
    term:
      id: HP:0012759
      label: Neurodevelopmental abnormality
  description: >-
    A substantial fraction of survivors of invasive neonatal GBS disease develop
    moderate to severe neurodevelopmental impairment; reported sequelae include
    delayed development, vision and hearing loss, and cerebral palsy.
  evidence:
  - reference: PMID:42747473
    reference_title: Time to rethink prevention of neonatal group B streptococcal disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Nearly 100 000 infants died and 37 100 survivors developed moderate to severe
      neurodevelopmental impairment
    explanation: Supports moderate-to-severe neurodevelopmental impairment as a sequela in survivors.
  - reference: PMID:23712433
    reference_title: A hemolytic pigment of Group B Streptococcus allows bacterial penetration of human placenta.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Morbidities due to GBS infections include delayed development, vision and
      hearing loss, chronic lung disease, mental retardation, and cerebral palsy
    explanation: Enumerates the neurodevelopmental sequelae of GBS infection.
- name: Hearing impairment
  phenotype_term:
    preferred_term: Hearing impairment
    term:
      id: HP:0000365
      label: Hearing impairment
  description: Hearing loss is a recognised sequela of invasive neonatal GBS disease.
  evidence:
  - reference: PMID:23712433
    reference_title: A hemolytic pigment of Group B Streptococcus allows bacterial penetration of human placenta.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-

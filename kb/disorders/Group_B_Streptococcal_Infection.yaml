name: Group B Streptococcal Infection
creation_date: "2026-11-26T15:54:44Z"
category: Infectious Disease
disease_term:
  preferred_term: group B streptococcal infection
  term:
    id: MONDO:0700218
    label: group B streptococcal infection
description: >-
  Group B streptococcal infection is a bacterial infection caused by Streptococcus
  agalactiae (group B Streptococcus, GBS), a beta-haemolytic Gram-positive coccus
  that colonises the human intestinal and genital tract. GBS is a leading cause of
  neonatal sepsis, pneumonia and meningitis, acquired by vertical transmission from
  a colonised mother around the time of birth, and also causes invasive disease in
  pregnant women (bacteraemia, chorioamnionitis, preterm birth, stillbirth,
  endometritis) and in non-pregnant adults, mainly the elderly. Neonatal disease is
  divided clinically into early-onset disease (first 72 hours of life) and
  late-onset disease (72 hours to 3 months); intrapartum antibiotic prophylaxis has
  reduced early-onset but not late-onset disease.
synonyms:
- Group B streptococcal disease
- Streptococcus agalactiae infection
- GBS infection
infectious_agent:
- name: Streptococcus agalactiae
  infectious_agent_term:
    preferred_term: Streptococcus agalactiae
    term:
      id: NCBITaxon:1311
      label: Streptococcus agalactiae
  description: >-
    Streptococcus agalactiae (group B Streptococcus) is a Gram-positive,
    beta-haemolytic coccus that commonly colonises the human intestine, urinary
    tract and vagina and is distinguished by the Lancefield group B carbohydrate
    antigen and by serotyping of its sialic-acid-rich capsular polysaccharide.
  evidence:
  - reference: PMID:42747473
    reference_title: Time to rethink prevention of neonatal group B streptococcal disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Group B Streptococci (Streptococcus agalactiae, GBS) are gram-positive,
      β-hemolytic bacteria that commonly colonize the human intestine, urinary
      tract and vagina
    explanation: Identifies S. agalactiae as the Gram-positive, beta-haemolytic coccus colonising the human gut and genital tract.
transmission:
- name: Vertical intrapartum transmission
  description: >-
    GBS ascends from the maternal vagina to colonise the placental membranes and
    amniotic fluid, or is acquired by the neonate during passage through the birth
    canal, establishing early-onset neonatal disease.
  evidence:
  - reference: PMID:42747473
    reference_title: Time to rethink prevention of neonatal group B streptococcal disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The pathogenesis of EOS involves ascension of GBS from the vagina leading to
      colonization of the placental membranes and amniotic fluid, potentially
      provoking chorioamnionitis and/or perinatal transmission during vaginal birth
    explanation: Establishes ascending and intrapartum maternal-to-neonatal transmission as the route of early-onset disease.
- name: Postnatal and horizontal transmission
  description: >-
    Late-onset neonatal disease can follow postnatal exposure or horizontal
    transmission from colonised individuals; the exact routes are not fully
    understood and colonisation continues for weeks after birth.
  evidence:
  - reference: PMID:42521820
    reference_title: "Maternal 6-valent group B Streptococcus vaccine in non-pregnant and pregnant females: a randomized phase 1/2 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: Late-onset disease can result from postnatal exposure or horizontal transmission from colonized individuals.
    explanation: Supports postnatal and horizontal acquisition as the route of late-onset disease.
agent_life_cycle:
  description: >-
    Humans are the principal reservoir of the GBS lineages that cause human
    disease, with asymptomatic colonisation of the gut and genital tract. S.
    agalactiae is also a major cause of bovine mastitis, so cattle are a distinct
    non-human reservoir, although human and bovine populations are largely
    separate.
  hosts:
  - preferred_term: Homo sapiens
    role: primary human reservoir and host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  - preferred_term: cattle
    role: bovine reservoir (bovine mastitis)
    term:
      id: NCBITaxon:9913
      label: Bos taurus
  evidence:
  - reference: PMID:42747473
    reference_title: Time to rethink prevention of neonatal group B streptococcal disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Group B Streptococci (Streptococcus agalactiae, GBS) are gram-positive,
      β-hemolytic bacteria that commonly colonize the human intestine, urinary
      tract and vagina
    explanation: Supports asymptomatic human colonisation of gut and genital tract as the human reservoir.
  - reference: PMID:41200363
    reference_title: "Prevalence and antimicrobial resistance of Streptococcus agalactiae associated with bovine mastitis in China: A meta-analysis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      A comprehensive understanding of the distribution of Streptococcus
      agalactiae, a major pathogen responsible for bovine mastitis, is critical
      for guiding therapeutic and control strategies.
    explanation: Supports cattle as a non-human reservoir in which S. agalactiae causes bovine mastitis.
has_subtypes:
- name: Early-onset disease
  display_name: Early-onset neonatal disease (first 72 hours)
  description: >-
    Invasive GBS disease presenting in the first 72 hours of life (some definitions
    extend to 7 days), caused by organisms acquired from the maternal rectovaginal
    flora around birth and preventable by intrapartum antibiotic prophylaxis.
    Meningitis co-occurs less often than in late-onset disease (9% vs 31%).
  evidence:
  - reference: PMID:42747473
    reference_title: Time to rethink prevention of neonatal group B streptococcal disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Early onset sepsis (EOS) occurs in the first 72 h after birth
    explanation: Defines early-onset disease by onset within 72 hours of birth.
  - reference: PMID:42747473
    reference_title: Time to rethink prevention of neonatal group B streptococcal disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Of note, meningitis more often co-occurs in LOS than in EOS (31 vs. 9%)
    explanation: Records that meningitis is less frequent in early-onset than late-onset disease, a documented difference between the strata.
- name: Late-onset disease
  display_name: Late-onset neonatal disease (72 hours to 3 months)
  description: >-
    Invasive GBS disease presenting between 72 hours and 3 months of age, resulting
    from postnatal or horizontal acquisition rather than intrapartum transmission.
    It is not prevented by intrapartum antibiotic prophylaxis, accounts for up to
    50% of cases, and co-occurs with meningitis more often than early-onset disease.
  evidence:
  - reference: PMID:42747473
    reference_title: Time to rethink prevention of neonatal group B streptococcal disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Late onset sepsis (LOS) occurs between the age of 72 h and three months
    explanation: Defines late-onset disease by onset between 72 hours and three months.
  - reference: PMID:42747473
    reference_title: Time to rethink prevention of neonatal group B streptococcal disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In contrast, late onset sepsis, which accounts for up to 50% of cases, has
      not declined.
    explanation: Supports that late-onset disease accounts for up to half of cases and is not reduced by prophylaxis, the key difference from early-onset disease.
- name: Pregnancy-associated invasive disease
  description: >-
    Invasive GBS disease in pregnant women, presenting as urinary tract infection,
    bacteraemia, chorioamnionitis, preterm birth or stillbirth, and post-partum
    endometritis.
  evidence:
  - reference: PMID:42747473
    reference_title: Time to rethink prevention of neonatal group B streptococcal disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      GBS cause urinary tract infections, bacteremia, chorioamnionitis, preterm or
      stillbirth and post-partum endometritis in relation to pregnancy.
    explanation: Supports the pregnancy-associated spectrum as a distinct clinical stratum.
- name: Non-pregnant adult invasive disease
  description: >-
    Invasive GBS disease in non-pregnant adults, who are mostly elderly and present
    with urinary tract infections and soft-tissue infections; incidence in this
    group is rising.
  evidence:
  - reference: PMID:42747473
    reference_title: Time to rethink prevention of neonatal group B streptococcal disease.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      In non-pregnant adults, mostly the elderly are affected with urinary tract
      infections, soft-tissue infections and others.
    explanation: Supports non-pregnant adults, mainly the elderly, as a distinct clinical stratum with its own presentation.
  - reference: PMID:30900541
    reference_title: Group B Streptococcus (Streptococcus agalactiae).
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: an increasing incidence of invasive disease has been observed in nonpregnant adults
    explanation: Supports the rising incidence of invasive GBS disease in non-pregnant adults.
progression:

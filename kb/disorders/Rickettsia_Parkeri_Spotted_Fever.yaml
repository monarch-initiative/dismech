      An infected Amblyomma tick bite is the acquisition exposure that inoculates
      R. parkeri into skin.
    evidence:
    - reference: PMID:18808353
      reference_title: Rickettsia parkeri rickettsiosis and its clinical distinction from Rocky Mountain spotted fever.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: >-
        Rickettsia parkeri rickettsiosis, a recently identified spotted fever
        transmitted by the Gulf Coast tick (Amblyomma maculatum), was first
        described in 2004.
      explanation: The case series establishes Amblyomma tick transmission as the acquisition exposure.
  description: >-
    Exposure to infected Amblyomma ticks in endemic areas creates the proximate
    environmental risk for R. parkeri spotted fever.
  effect: Increases risk of R. parkeri infection by exposing skin to infected Amblyomma bites.
  evidence:
  - reference: PMID:18808353
    reference_title: Rickettsia parkeri rickettsiosis and its clinical distinction from Rocky Mountain spotted fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Rickettsia parkeri rickettsiosis, a recently identified spotted fever
      transmitted by the Gulf Coast tick (Amblyomma maculatum), was first
      described in 2004.
    explanation: The first U.S. case series identifies the Gulf Coast tick as a transmission vector.
  notes: >-
    Bound to ECTO:3000167 exposure to Rickettsia parkeri while keeping
    preferred_term focused on the Amblyomma acquisition route. `runoak -i
    sqlite:obo:ecto search 'l~Rickettsia'` returns the species-exact exposure
    class, while the configured ECTO/XCO sources have no general tick-bite or
    arthropod-bite exposure term: `l~tick` returns only exposure to Tick-borne
    encephalitis virus, `l~bite`, `l~arthropod`, and `l~Amblyomma` return no
    suitable ECTO exposure term, and `runoak -i sqlite:obo:xco search
    'l~tick'` returns no XCO term.

animal_models:
- name: Ifnar1/Ifngr1 receptor-deficient R. parkeri mouse
  species: Mouse
  genotype: Ifnar1-/-;Ifngr1-/-
  description: >-
    Intradermal R. parkeri infection of mice lacking both type I and type II
    interferon receptors produces necrotic, inflamed eschars and disseminated
    infection, providing a tractable R. parkeri rickettsiosis model in an
    interferon-susceptible background.
  publication: PMID:34423779
  modeled_mechanisms:
  - target: Type I Interferon Restriction of Cytosolic Rickettsiae
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Ifnar1/Ifngr1 knockout perturbs type I interferon restriction by removing
      Ifnar1 while also removing the type II interferon receptor.
    limitations: >-
      The model achieves susceptibility by disabling both type I and type II
      interferon receptor signaling, so it cannot attribute the susceptibility
      phenotype uniquely to the type I interferon arm; human R. parkeri eschars
      arise in immunocompetent hosts after natural tick inoculation.
    evidence:
    - reference: PMID:34423779
      reference_title: Interferon receptor-deficient mice are susceptible to eschar-associated rickettsiosis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our results further suggest that discrepancies between mouse and human
        susceptibility may be due to differences in interferon signaling.
      explanation: >-
        The study interprets mouse resistance versus engineered susceptibility
        as an interferon-signaling difference, supporting the IFNAR-deficient
        perturbation link.
  - target: Inoculation Eschar Formation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Intradermal inoculation of the susceptible mice produces necrotic,
      inflamed eschars resembling the human bite-site lesion.
    limitations: >-
      The model recapitulates eschar formation only in a genetically
      interferon-receptor-deficient mouse and progresses to disseminated lethal
      disease, whereas human R. parkeri eschars arise in immunocompetent hosts
      in a typically non-lethal illness after natural tick inoculation.
    evidence:
    - reference: PMID:34423779
      reference_title: Interferon receptor-deficient mice are susceptible to eschar-associated rickettsiosis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Similar to human infection, eschars exhibited necrosis and inflammation,
        with bacteria primarily found in leukocytes.
      explanation: >-
        The study directly compares the model eschar to the necrotic,
        inflamed human lesion.

treatments:
- name: Empiric doxycycline
  description: >-
    Doxycycline is first-line empiric therapy for suspected R. parkeri spotted
    fever because it is a cell-penetrant tetracycline that reaches cytosolic
    rickettsiae and inhibits bacterial protein synthesis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: doxycycline
      term:
        id: CHEBI:50845
        label: doxycycline
  target_mechanisms:
  - target: Rickettsial Ribosomal Translation (Doxycycline Target)
    treatment_effect: INHIBITS
    description: Doxycycline arrests R. parkeri translation at the bacterial ribosome.
  - target: Intracytosolic Rickettsia parkeri Niche
    treatment_effect: BYPASSES
    description: Doxycycline penetrates host cells and can reach cytosolic R. parkeri.
  evidence:
  - reference: PMID:16572105
    reference_title: >-
      Diagnosis and management of tickborne rickettsial diseases: Rocky Mountain
      spotted fever, ehrlichioses, and anaplasmosis--United States: a practical
      guide for physicians and other health-care and public health
      professionals.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the recommendations for doxycycline are the treatment of choice for both
      adults and children
    explanation: >-
      The CDC practice guideline establishes doxycycline as the first-line
      antibiotic for tick-borne rickettsial diseases in adults and children.

- name: Canine ectoparasite control
  description: >-
    In Atlantic rainforest strain foci where A. ovale ticks parasitize dogs,
    canine ectoparasite control can reduce peridomestic Amblyomma tick
    exposure and spillover risk.
  action_category: THERAPEUTIC
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: canine ectoparasite control
    term:
      id: NCIT:C15843
      label: Preventive Intervention
  evidence:
  - reference: PMID:35293560
    reference_title: A new focus of spotted fever caused by Rickettsia parkeri in Brazil.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      importance of implementing programs to control canine ectoparasites and to
      raise awareness of the risks of infection, signs and symptoms of SF caused
      by R. parkeri strain Atlantic Rainforest.
    explanation: >-
      The report recommends canine ectoparasite-control programs in the context
      of dog-associated A. ovale detection in an Atlantic rainforest strain R.
      parkeri focus.

- name: R. parkeri spotted fever risk awareness
  description: >-
    Public awareness of R. parkeri spotted fever infection risks, signs, and
    symptoms can support prevention and recognition in Atlantic rainforest
    strain foci.
  action_category: COUNSELING_INFORMATIONAL
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: community R. parkeri risk awareness
  notes: >-
    NCIT has no specific clinical-intervention term for community awareness
    campaigns about R. parkeri spotted fever risk in a tick focus.
  evidence:
  - reference: PMID:35293560
    reference_title: A new focus of spotted fever caused by Rickettsia parkeri in Brazil.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      importance of implementing programs to control canine ectoparasites and to
      raise awareness of the risks of infection, signs and symptoms of SF caused
      by R. parkeri strain Atlantic Rainforest.
    explanation: >-
      The report recommends risk-awareness programs in the context of a new
      Atlantic rainforest strain R. parkeri focus.


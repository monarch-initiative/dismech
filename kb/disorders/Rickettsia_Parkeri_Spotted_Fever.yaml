agent_life_cycle:
  description: >-
    R. parkeri is maintained in Amblyomma ticks that transmit the organism to
    humans during blood feeding. Humans are incidental hosts; the Gulf Coast tick
    A. maculatum transmits U.S. cases, A. ovale transmits Atlantic rainforest
    strain infections in Brazil, and A. triste and A. tigrinum are associated
    with Argentine transmission.
  hosts:
  - preferred_term: Homo sapiens
    role: incidental clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  - preferred_term: Amblyomma maculatum
    role: Gulf Coast tick vector and reservoir host
    term:
      id: NCBITaxon:34609
      label: Amblyomma maculatum
  - preferred_term: Amblyomma ovale
    role: Atlantic rainforest strain vector host
    term:
      id: NCBITaxon:208206
      label: Amblyomma ovale
  - preferred_term: Amblyomma triste
    role: South American vector host
    term:
      id: NCBITaxon:251400
      label: Amblyomma triste
  - preferred_term: Amblyomma tigrinum
    role: South American vector host
    term:
      id: NCBITaxon:251399
      label: Amblyomma tigrinum
  vectors:
  - Amblyomma maculatum (Gulf Coast tick)
  - Amblyomma ovale
  - Amblyomma triste
  - Amblyomma tigrinum
  evidence:
  - reference: PMID:36693294
    reference_title: "The inoculation eschar of Rickettsia parkeri rickettsiosis in Brazil: Importance and cautions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Rickettsia parkeri strain Atlantic rainforest infections transmitted by
      adult Amblyomma ovale ticks cause a milder non-lethal febrile disease with
      an eschar (necrosis) at the tick bite site.
    explanation: >-
      The Brazilian review identifies A. ovale as a vector for Atlantic
      rainforest strain R. parkeri infections.
  - reference: PMID:30928146
    reference_title: "[Spotted fever in Argentina. Description of two clinical cases]."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Amblyomma triste acts as a vector; and the provinces of Córdoba, La Rioja,
      San Luis and La Pampa where Amblyomma tigrinum is the vector.
    explanation: >-
      The Argentine case report and review identify A. triste and A. tigrinum as
      vectors in R. parkeri epidemiologic settings.

transmission:
- name: Amblyomma tick bite
  description: >-
    Infected Amblyomma ticks inoculate R. parkeri into skin while feeding.
  evidence:
  - reference: PMID:18808353
    reference_title: Rickettsia parkeri rickettsiosis and its clinical distinction from Rocky Mountain spotted fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Rickettsia parkeri rickettsiosis, a recently identified spotted fever
      transmitted by the Gulf Coast tick (Amblyomma maculatum), was first
      described in 2004.
    explanation: >-
      The first U.S. case series identifies the Gulf Coast tick as the U.S.
      transmission vector.

epidemiology:
- name: Amblyomma-exposed adults in the Americas
  description: >-
    R. parkeri spotted fever is reported in the United States and multiple South
    American countries, with a strong history of tick exposure among recognized
    cases and a predominance among men aged 18 to 64 years in the published
    systematic review.
  factors:
  - Amblyomma tick exposure
  - male sex
  - adult age
  evidence:
  - reference: PMID:33989945
    reference_title: "Clinical, epidemiological, and laboratory features of Rickettsia parkeri rickettsiosis: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, our results show that R. parkeri rickettsiosis is more frequent
      in males in the age group of 18-64 years and that a history of tick
      exposure was frequent (>90%).
    explanation: >-
      The systematic review summarizes the demographic and exposure pattern
      across confirmed and probable cases.

progression:
- phase: Acute onset after tick bite
  incubation_days: 7-10
  notes: >-
    Symptomatic Atlantic rainforest strain cases developed eschar-associated
    illness 7 to 10 days after the tick bite in the first reported outbreak.
  evidence:
  - reference: PMID:42745336
    reference_title: "Short Report: First Outbreak of Atlantic Rainforest Spotted Fever in North-Eastern of Brazil-Clinical Features and Eco-Epidemiological Investigation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients developed symptoms 7-10 days after the bite, including
      inoculation eschar with progressive enlargement, exanthema, regional
      lymphadenopathy, fever, myalgia, and prostration
    explanation: >-
      The Brazilian Atlantic rainforest spotted fever outbreak report directly
      dates the post-bite symptom interval.

clinical_burden:
  burden_level: LOW
  rationale: >-
    Published confirmed and probable cases were usually managed without
    hospitalization and recovered clinically, consistent with a milder burden
    than Rocky Mountain spotted fever despite the need for recognition and
    doxycycline treatment.
  evidence:
  - reference: PMID:33989945
    reference_title: "Clinical, epidemiological, and laboratory features of Rickettsia parkeri rickettsiosis: A systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, only 9% of cases required hospitalization and there was a 100%
      rate of clinical recovery in all of cases.
    explanation: >-
      The systematic review reports low hospitalization and complete recovery
      among the reviewed R. parkeri cases.


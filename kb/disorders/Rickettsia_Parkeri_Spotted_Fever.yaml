name: Rickettsia Parkeri Spotted Fever
creation_date: "2026-09-27T23:51:00Z"
category: Infectious Disease
description: >-
  Rickettsia parkeri spotted fever is an acute Amblyomma tick-borne spotted
  fever group rickettsiosis caused by the obligately intracellular bacterium
  Rickettsia parkeri. After inoculation into skin, R. parkeri invades host cells,
  escapes to the cytosol, and uses RickA- and Sca2-driven actin motility to
  spread cell to cell. The clinical syndrome is typically milder than Rocky
  Mountain spotted fever and is marked by an inoculation eschar, fever,
  maculopapular or vesiculopapular rash, headache, myalgia, and regional
  lymphadenopathy; systemic vascular injury is usually limited, and reported
  cases recover with tetracycline-class therapy.

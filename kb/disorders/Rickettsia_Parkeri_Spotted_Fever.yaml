- name: Rickettsial Actin-Based Cell-to-Cell Spread
  role: primary_infection
  biological_scale: CELLULAR
  description: >-
    R. parkeri coordinates two actin-based motility modes: early RickA- and
    Arp2/3-dependent movement with short curved tails, followed by faster
    Sca2-dependent directional motility with long straight tails that promotes
    cell-to-cell spread.
  biological_processes:
  - preferred_term: actin filament-based movement
    term:
      id: GO:0030048
      label: actin filament-based movement
  - preferred_term: Arp2/3 complex-mediated actin nucleation
    term:
      id: GO:0034314
      label: Arp2/3 complex-mediated actin nucleation
  downstream:
  - target: Small-Vessel Rickettsial Vasculitis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: Rickettsial spread extends local vascular infection and inflammation.
  evidence:
  - reference: PMID:24361066
    reference_title: Rickettsia actin-based motility occurs in distinct phases mediated by different actin nucleators.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we show that each protein directs an independent mode of Rickettsia
      parkeri motility at different times during infection.
    explanation: >-
      The R. parkeri cell-biology study demonstrates temporally distinct RickA
      and Sca2 motility phases.
  - reference: PMID:20972427
    reference_title: Rickettsia Sca2 is a bacterial formin-like mediator of actin-based motility.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Sca2 nucleates unbranched actin filaments, processively associates with
      growing barbed ends, requires profilin for efficient elongation, and
      inhibits the activity of capping protein, all properties shared with
      formins.
    explanation: >-
      The cell-free and cytoplasmic-extract experiments establish Sca2 as the
      formin-like actin assembly factor that drives straight-tail Rickettsia
      motility.
  - reference: PMID:34423779
    reference_title: Interferon receptor-deficient mice are susceptible to eschar-associated rickettsiosis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the actin-based motility factor Sca2 is required for dissemination from
      the skin to internal organs
    explanation: >-
      Ifnar1/Ifngr1-deficient mouse infections connect Sca2-mediated motility
      to dissemination from the inoculation site in vivo.

- name: Type I Interferon Restriction of Cytosolic Rickettsiae
  role: immune_response
  biological_scale: CELLULAR
  description: >-
    Cytosolic R. parkeri is restricted by type I interferon signaling; host-cell
    inflammasome activity antagonizes the type I interferon response and thereby
    benefits the pathogen.
  biological_processes:
  - preferred_term: type I interferon-mediated signaling pathway
    term:
      id: GO:0060337
      label: type I interferon-mediated signaling pathway
  downstream:
  - target: Small-Vessel Rickettsial Vasculitis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: The balance of interferon restriction and pathogen replication shapes tissue injury.
  evidence:
  - reference: PMID:32123346
    reference_title: Inflammasome-mediated antagonism of type I interferon enhances Rickettsia pathogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Here, we report that the human pathogen Rickettsia parkeri is sensitive to
      IFN-I and benefits from inflammasome-mediated host cell death that
      antagonizes IFN-I.
    explanation: >-
      Mouse and cell experiments show that type I interferon restricts R.
      parkeri while inflammasome-dependent cell death counteracts that
      restriction.


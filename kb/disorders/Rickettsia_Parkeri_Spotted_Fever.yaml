- name: Rickettsial Ribosomal Translation (Doxycycline Target)
  role: therapeutic_vulnerability
  conforms_to: "bacterial_protein_synthesis_inhibition#Bacterial mRNA Translation by the Ribosome"
  biological_scale: MOLECULAR
  description: >-
    Intracellular R. parkeri depends on bacterial ribosomal translation.
    Doxycycline and other tetracyclines inhibit the bacterial 30S subunit and
    arrest spotted-fever-group rickettsial protein synthesis.
  biological_processes:

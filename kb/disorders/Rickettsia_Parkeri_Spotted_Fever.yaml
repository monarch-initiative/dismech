diagnosis:
- name: Eschar-focused clinical diagnosis with molecular confirmation
  description: >-
    An inoculation eschar and compatible tick exposure should trigger suspicion,
    while PCR, immunohistochemistry, culture, and paired serology can confirm
    spotted-fever-group rickettsiosis and separate R. parkeri from
    serologically cross-reactive species.
  evidence:
  - reference: PMID:18808353
    reference_title: Rickettsia parkeri rickettsiosis and its clinical distinction from Rocky Mountain spotted fever.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using indirect immunofluorescence antibody assays,
      immunohistochemistry, polymerase chain reaction assays, and cell culture
      isolation, we identified 6 confirmed and 6 probable cases of infection
      with R. parkeri.
    explanation: >-
      The first U.S. series used serology, immunohistochemistry, PCR and cell
      culture to classify confirmed and probable cases.
  - reference: PMID:20404224
    reference_title: The expanding spectrum of eschar-associated rickettsioses in the United States.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The SFG rickettsioses share many clinical manifestations and extensive
      antigenic cross-reactivity that may hamper specific confirmation of the
      causative agent.
    explanation: >-
      The dermatology case series and review explains why molecular or tissue
      methods are needed for species-level confirmation.


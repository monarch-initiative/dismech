    explanation: The RSV and adenovirus presentation in patient P7.
genetic:
- name: IRF7
  association: Causal
  gene_term:
    preferred_term: IRF7
    term:
      id: hgnc:6122
      label: IRF7
  notes: >-
    IRF7 encodes interferon regulatory factor 7, the transcription factor that
    amplifies type I and type III interferon production. Disease-causing
    genotypes reported to date are all biallelic: compound heterozygous
    F410V/Q421X in the index patient, and homozygous frameshift and nonsense
    alleles (P364AfsX38, A280GfsX12, W91X) and combined missense alleles in
    later patients. IFN-beta induction, which is IRF3-dependent, is preserved.
  evidence:
  - reference: PMID:25814066
    reference_title: "Infectious disease. Life-threatening influenza and impaired interferon amplification in human IRF7 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WES analysis of the trio revealed, and Sanger sequencing confirmed, two compound heterozygous IRF7 mutations—p.Phe410Val (F410V) and p.Gln421X(Q421X)—with each parent being heterozygous for a single mutated allele"
    explanation: Establishes IRF7 as the causal gene, with the index compound-heterozygous genotype.
  - reference: PMID:35670811
    reference_title: "Respiratory viral infections in otherwise healthy humans with inherited IRF7 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, the three newly described homozygous IRF7 variants in our four patients with severe respiratory viral infections are deleterious, whereas variants found in the homozygous state in the general population are neutral."
    explanation: Documents additional deleterious homozygous IRF7 alleles across the cohort.

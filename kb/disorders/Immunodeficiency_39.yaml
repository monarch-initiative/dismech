name: Immunodeficiency 39
creation_date: "2026-09-24T08:00:00Z"
category: Mendelian
synonyms:
- IMD39
- immunodeficiency type 39
- IRF7 deficiency
- autosomal recessive IRF7 deficiency
- predisposition to severe viral infection due to IRF7 deficiency
- primary immunodeficiency disease caused by mutation in IRF7
- IRF7 primary immunodeficiency disease
description: >-
  Immunodeficiency 39 (IMD39) is autosomal recessive IRF7 deficiency, an inborn
  error of innate antiviral immunity caused by biallelic loss-of-function
  variants in IRF7. IRF7 is the transcription factor that amplifies type I
  (IFN-alpha, -omega and related subtypes) and type III (IFN-lambda) interferon
  production after viral sensing, and it is constitutively expressed at high
  levels in plasmacytoid dendritic cells, the body's main interferon-producing
  cells. In affected individuals, plasmacytoid dendritic cells and fibroblasts
  make no detectable type I or type III interferon other than IFN-beta, which is
  reduced but not abolished, and pulmonary epithelial cells derived from a
  patient's stem cells support increased influenza virus replication.

  The clinical phenotype is narrow. Patients are otherwise healthy and usually
  have a single life-threatening respiratory viral infection: pandemic H1N1
  influenza with acute respiratory distress syndrome in the index child,
  critical COVID-19 pneumonia in previously healthy adults, and severe
  infections with respiratory syncytial virus or adenovirus in individual
  patients. Age at first severe episode ranges from 6 months to 50 years.
  Patients have tolerated live attenuated vaccines, including MMR, and mount
  normal adaptive responses to viruses and vaccines, so management after
  diagnosis has centred on influenza and COVID-19 vaccination. Seven patients
  from six kindreds had been described by 2022.
disease_term:
  preferred_term: immunodeficiency 39
  term:
    id: MONDO:0014597
    label: immunodeficiency 39
parents:
- inborn error of immunity
- autosomal recessive disease
notes: >-
  No GeneReviews chapter covers IRF7 deficiency (just check-genereviews reported
  NO_CHAPTER). The phenotype baseline is the 2022 seven-patient cohort
  (PMID:35670811), which includes the three earlier patients from PMID:25814066
  and PMID:32972995. Heterozygous IRF7 loss-of-function variants have also been
  reported in severe COVID-19 (PMID:32972995) and, with monoallelic expression
  in plasmacytoid dendritic cells, in herpesvirus central nervous system
  infection (PMID:41159916); those dominant or heterozygous presentations are
  not part of the MONDO:0014597 recessive disease concept and are recorded here
  only as context. OMIM 616345.
inheritance:
- name: Autosomal recessive
  description: >-
    Disease results from biallelic IRF7 loss-of-function variants, either
    homozygous or compound heterozygous. In the index family neither allele was
    dominant negative, and the heterozygous parents were unaffected.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  penetrance: INCOMPLETE
  evidence:
  - reference: PMID:35670811
    reference_title: "Respiratory viral infections in otherwise healthy humans with inherited IRF7 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five were homozygous and two were compound heterozygous for IRF7 variants."
    explanation: Biallelic genotypes in all seven reported patients establish recessive inheritance.
  - reference: PMID:25814066
    reference_title: "Infectious disease. Life-threatening influenza and impaired interferon amplification in human IRF7 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "neither allele was dominant negative in terms of IRF7 or IRF3 function"
    explanation: >-
      Functional testing of both index alleles excluded a dominant-negative
      effect, consistent with the unaffected heterozygous parents.
  - reference: PMID:32972995
    reference_title: "Inborn errors of type I IFN immunity in patients with life-threatening COVID-19."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These genetic defects therefore display incomplete penetrance for influenza respiratory distress and only manifested clinically upon infection with the more virulent SARS-CoV-2."
    explanation: >-
      Two adults with recessive IRF7 deficiency had no severe infection until
      COVID-19 at ages 49 and 50, the basis for recording penetrance as incomplete.
pathophysiology:
- name: IRF7 Loss of Function
  description: >-
    Biallelic IRF7 variants abolish IRF7 transcriptional activity. The index
    patient's two alleles fail by different routes: the missense F410V protein is
    phosphorylated but does not reach the nucleus, while the truncated Q421X
    protein sits in the nucleus but lacks the C-terminal serines that TBK1 and
    IKK-epsilon phosphorylate. Later alleles include homozygous frameshift and
    nonsense variants; the recurrent A280GfsX12 allele looks hypomorphic when
    overexpressed but behaves as a null in the patients' plasmacytoid dendritic
    cells.
  biological_scale: MOLECULAR
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
  genes:
  - preferred_term: IRF7
    term:
      id: hgnc:6122
      label: IRF7
  downstream:
  - target: Failure of IRF7-Dependent Interferon Amplification
    causal_link_type: DIRECT
    description: >-
      IRF7 is the transcription factor that amplifies type I and type III
      interferon gene induction, so its loss removes that amplification step.
    evidence:
    - reference: PMID:25814066
      reference_title: "Infectious disease. Life-threatening influenza and impaired interferon amplification in human IRF7 deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Each mutation was loss-of-function in reporter assays driven by IFNB, IFNA4, or IFNA6 promoters"
      explanation: Both patient alleles fail to transactivate interferon gene promoters.
  evidence:
  - reference: PMID:25814066
    reference_title: "Infectious disease. Life-threatening influenza and impaired interferon amplification in human IRF7 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The two mutant IRF7 alleles led to loss of function by different mechanisms: F410V did not accumulate in the nucleus despite phosphorylation, whereas Q421X resided in the nucleus without phosphorylation."
    explanation: Describes how each index allele loses function.
  - reference: PMID:35670811
    reference_title: "Respiratory viral infections in otherwise healthy humans with inherited IRF7 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The results of these physiological cellular assays thus indicate that the IRF7 A280GfsX12 variant, which was hypomorphic when tested by overexpression in HEK-293T cells, is actually an LoF variant when constitutively expressed in pDCs"
    explanation: >-
      Shows that an allele scored as hypomorphic in an overexpression assay is a
      null in the patients' own plasmacytoid dendritic cells.
- name: Failure of IRF7-Dependent Interferon Amplification
  description: >-
    Without IRF7, virus-infected cells cannot amplify interferon production
    beyond the initial IRF3-dependent IFN-beta wave. Induction of the 13 IFN-alpha
    genes, IFN-omega, IFN-epsilon, IFN-kappa and the three IFN-lambda genes is
    lost, while IFN-beta is reduced but still produced. IRF3-dependent signalling
    stays intact, which is why fibroblasts still make IFN-beta after synthetic
    double-stranded RNA stimulation. This residual IFN-beta is the leading
    explanation for why the clinical phenotype is narrower than in IFNAR1 or
    IFNAR2 deficiency.
  biological_scale: CELLULAR
  conforms_to: "innate_antiviral_interferon_response#Type I and III Interferon Induction and JAK-STAT Signaling"
  genes:
  - preferred_term: IRF7
    term:
      id: hgnc:6122
      label: IRF7
  biological_processes:
  - preferred_term: positive regulation of type I interferon production
    term:
      id: GO:0032481
      label: positive regulation of type I interferon production
    modifier: DECREASED
  - preferred_term: type I interferon production
    term:
      id: GO:0032606
      label: type I interferon production
    modifier: DECREASED
  - preferred_term: type III interferon production
    term:
      id: GO:0034343
      label: type III interferon production
    modifier: DECREASED
  downstream:
  - target: Absent Plasmacytoid Dendritic Cell Interferon Production
    causal_link_type: DIRECT
    description: >-
      Plasmacytoid dendritic cells depend on their high constitutive IRF7
      expression for bulk type I and III interferon production, so this is where
      the amplification defect is most complete.
    evidence:
    - reference: PMID:25814066
      reference_title: "Infectious disease. Life-threatening influenza and impaired interferon amplification in human IRF7 deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We observed no IFN-α2 production in pDCs from P at 24 hpi with pH1N1 and herpes simplex virus–1 (HSV-1)"
      explanation: Patient plasmacytoid dendritic cells, at normal frequency, make no IFN-alpha2 after influenza or HSV-1 infection.
  - target: Impaired Epithelial Cell-Intrinsic Antiviral Immunity
    causal_link_type: DIRECT
    description: >-
      Non-haematopoietic cells also use IRF7 to amplify their own interferon
      response to infection, so their cell-intrinsic antiviral defence is weakened.
    evidence:
    - reference: PMID:25814066
      reference_title: "Infectious disease. Life-threatening influenza and impaired interferon amplification in human IRF7 deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the patient's dermal fibroblasts and induced pluripotent stem cell (iPSC)-derived pulmonary epithelial cells produced reduced amounts of type I IFN and displayed increased influenza virus replication"
      explanation: Links reduced interferon output in non-haematopoietic patient cells to increased viral replication in those cells.
  evidence:
  - reference: PMID:25814066
    reference_title: "Infectious disease. Life-threatening influenza and impaired interferon amplification in human IRF7 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Overall, we observed an overwhelming and selective defect of type I and III IFN induction in P’s PBMCs."
    explanation: Patient leukocytes infected with influenza show a selective loss of type I and III interferon induction.
  - reference: PMID:35670811
    reference_title: "Respiratory viral infections in otherwise healthy humans with inherited IRF7 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The patients' fibroblasts and plasmacytoid dendritic cells produced no detectable type I and III IFNs, except IFN-β."
    explanation: Confirms across the cohort that IFN-beta is the only type I or III interferon still produced.
- name: Absent Plasmacytoid Dendritic Cell Interferon Production
  description: >-
    Plasmacytoid dendritic cells are present in normal numbers but fail to
    produce IFN-alpha or IFN-lambda in response to influenza virus, SARS-CoV-2,
    or TLR7 and TLR9 agonists. This removes the systemic supply of interferon
    that would otherwise protect uninfected respiratory epithelium.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: plasmacytoid dendritic cell
    term:
      id: CL:0000784
      label: plasmacytoid dendritic cell
  biological_processes:
  - preferred_term: type I interferon production
    term:
      id: GO:0032606
      label: type I interferon production
    modifier: DECREASED
  downstream:
  - target: Enhanced Respiratory Viral Replication
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Exogenous IFN-alpha2b rescued the increased infection of patient-derived
      pulmonary epithelial cells, supporting the view that missing plasmacytoid
      dendritic cell interferon contributes to uncontrolled viral replication in
      the lung. The edge is inferred from rescue in vitro, not measured in patient lung.
    evidence:
    - reference: PMID:25814066
      reference_title: "Infectious disease. Life-threatening influenza and impaired interferon amplification in human IRF7 deficiency."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "Impaired IFN production by P’s pDCs may also have caused disease, as evidenced by the pulmonary cell rescue with exogenous IFN-α2b."
      explanation: The authors infer the plasmacytoid dendritic cell contribution from interferon rescue of patient epithelial cells.
  evidence:
  - reference: PMID:32972995
    reference_title: "Inborn errors of type I IFN immunity in patients with life-threatening COVID-19."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Collectively, these findings showed that AR IRF7 deficiency impaired the production of type I IFN by pDCs stimulated with SARS-CoV-2"
    explanation: Extends the plasmacytoid dendritic cell defect from influenza to SARS-CoV-2.
  - reference: PMID:35670811
    reference_title: "Respiratory viral infections in otherwise healthy humans with inherited IRF7 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In patients P5 and P6, pDCs did not produce IFN-α in response to TLR7 or TLR9 agonists"
    explanation: The same defect in two further patients, after TLR7 or TLR9 stimulation.
- name: Impaired Epithelial Cell-Intrinsic Antiviral Immunity
  description: >-
    Patient fibroblasts and stem-cell-derived pulmonary epithelial cells make
    less IFN-beta after influenza infection and support more viral replication.
    Restoring wild-type IRF7 or adding interferon (IFN-alpha2b, IFN-beta or
    IFN-lambda1) corrects the defect, showing that it is caused by the IRF7
    lesion and lies upstream of interferon signalling, which is intact.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  - preferred_term: respiratory tract epithelial cell
    term:
      id: CL:0002368
      label: respiratory tract epithelial cell
  biological_processes:
  - preferred_term: defense response to virus
    term:
      id: GO:0051607
      label: defense response to virus
    modifier: DECREASED
  downstream:
  - target: Enhanced Respiratory Viral Replication
    causal_link_type: DIRECT
    description: Epithelial cells that cannot amplify their interferon response are infected in greater numbers.
    evidence:
    - reference: PMID:25814066
      reference_title: "Infectious disease. Life-threatening influenza and impaired interferon amplification in human IRF7 deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "52.4% of P’s PECs were double positive, versus 27.2% in controls"
      explanation: More patient pulmonary epithelial cells were infected with influenza than control cells.
  evidence:
  - reference: PMID:25814066
    reference_title: "Infectious disease. Life-threatening influenza and impaired interferon amplification in human IRF7 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Stable transfection of wild-type IRF7 complemented this phenotype"
    explanation: Wild-type IRF7 corrects the increased influenza replication in patient fibroblasts, showing the defect is caused by IRF7.
  - reference: PMID:25814066
    reference_title: "Infectious disease. Life-threatening influenza and impaired interferon amplification in human IRF7 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This phenotype was rescued by treatment with IFN-α2b (Fig. 4G), IFN-β, or IFN-λ1"
    explanation: Exogenous interferon corrects the epithelial phenotype, placing the defect in interferon production rather than response.
  - reference: PMID:32972995
    reference_title: "Inborn errors of type I IFN immunity in patients with life-threatening COVID-19."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SARS-CoV-2 infection levels were higher in mutant cells than in cells from healthy donors, and transduction of WT IRF7 or IFNAR1 rescued their defects"
    explanation: The same rescue result with SARS-CoV-2 in IRF7-deficient fibroblasts.
- name: Enhanced Respiratory Viral Replication
  description: >-
    With both the plasmacytoid dendritic cell supply and the epithelial
    amplification of interferon missing, a respiratory virus replicates in the
    lung beyond what an interferon-competent host would allow. The phenotype has
    so far been confined to the respiratory tract, and patients have controlled
    many other common viruses.
  biological_scale: TISSUE
  downstream:
  - target: Severe influenza infection
    causal_link_type: DIRECT
    description: Uncontrolled influenza virus replication in the lung produces life-threatening influenza pneumonia.
    evidence:
    - reference: PMID:25814066
      reference_title: "Infectious disease. Life-threatening influenza and impaired interferon amplification in human IRF7 deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "These findings suggest that IRF7-dependent amplification of type I and III IFNs is required for protection against primary infection by influenza virus in humans."
      explanation: The authors connect the interferon amplification defect to severe primary influenza.
  - target: Severe SARS-CoV-2 infection
    causal_link_type: DIRECT
    description: The same defect underlies critical COVID-19 pneumonia in previously healthy adults.
    evidence:
    - reference: PMID:32972995
      reference_title: "Inborn errors of type I IFN immunity in patients with life-threatening COVID-19."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Inborn errors of TLR3- and IRF7-dependent type I IFN immunity can underlie life-threatening COVID-19 pneumonia in patients with no prior severe infection."
      explanation: Links inborn errors of IRF7-dependent interferon immunity, including recessive IRF7 deficiency, to critical COVID-19 pneumonia.
  - target: Severe respiratory syncytial virus infection
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Severe RSV infection has been reported in one patient. The authors suggest
      that residual IFN-beta is not enough for some respiratory viruses,
      including a large RSV or adenovirus inoculum; this has not been tested directly.
    evidence:
    - reference: PMID:35670811
      reference_title: "Respiratory viral infections in otherwise healthy humans with inherited IRF7 deficiency."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "This would imply that IFN-β is insufficient to handle some respiratory viruses, at least in certain settings (a particularly virulent influenza strain, SARS-CoV-2, or a large inoculum of RSV or adenovirus)."
      explanation: The authors' explanation for severe infection with these viruses despite residual IFN-beta; a hypothesis, hence INDIRECT.
  evidence:
  - reference: PMID:35670811
    reference_title: "Respiratory viral infections in otherwise healthy humans with inherited IRF7 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IRF7-deficient individuals are prone to viral infections of the respiratory tract but are otherwise healthy, potentially due to residual IFN-β and compensatory adaptive immunity."
    explanation: States that the susceptibility is confined to the respiratory tract.

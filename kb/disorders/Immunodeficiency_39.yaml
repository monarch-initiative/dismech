    explanation: The reported case count as of 2022.
diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Whole-exome or whole-genome sequencing, or an inborn-errors-of-immunity
    panel, establishes the diagnosis by identifying biallelic IRF7 variants.
    Both index alleles were found by trio whole-exome sequencing and confirmed
    by Sanger sequencing.
  diagnosis_term:
    preferred_term: whole exome sequencing
    term:
      id: NCIT:C101295
      label: Whole Exome Sequencing
  evidence:
  - reference: PMID:25814066
    reference_title: "Infectious disease. Life-threatening influenza and impaired interferon amplification in human IRF7 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WES analysis of the trio revealed, and Sanger sequencing confirmed, two compound heterozygous IRF7 mutations—p.Phe410Val (F410V) and p.Gln421X(Q421X)"
    explanation: Whole-exome sequencing made the molecular diagnosis in the index family.
treatments:
- name: Influenza and COVID-19 Vaccination After Diagnosis
  description: >-
    Because patients mount normal adaptive responses to viruses and vaccines,
    prophylactic annual influenza vaccination and COVID-19 vaccination have been
    implemented after molecular diagnosis. Live attenuated vaccines have been
    tolerated, so avoidance of them is not part of management, unlike in IFNAR1
    or IFNAR2 deficiency.
  treatment_term:
    preferred_term: Vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
  therapeutic_modality: VACCINE
  evidence:
  - reference: PMID:35670811
    reference_title: "Respiratory viral infections in otherwise healthy humans with inherited IRF7 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Prophylactic measures, such as annual influenza vaccination (P1 since 2014; P5, P6, and P7 since 2021) and COVID-19 vaccination (P1, P2, P3, P5, P6, and P7 in 2021), were implemented after molecular diagnosis."
    explanation: The prophylactic vaccination strategy applied after diagnosis.
  - reference: PMID:35670811
    reference_title: "Respiratory viral infections in otherwise healthy humans with inherited IRF7 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, IRF7-deficient patients can mount robust adaptive responses to viruses and to mRNA vaccines, providing protection against severe infections."
    explanation: The rationale for vaccination, namely intact adaptive immunity.

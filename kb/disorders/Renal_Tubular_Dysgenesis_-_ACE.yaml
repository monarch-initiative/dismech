    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Angiotensin I-Converting Enzyme (ACE; MIM#106180) catalyzes the
      conversion of angiotensin I into physiologically active peptide
      angiotensin II, within the angiotensin-renin system.
    explanation: >-
      States the enzymatic step that is lost.
  - reference: PMID:20454656
    reference_title: >-
      Angiotensin I-converting enzyme Gln1069Arg mutation impairs trafficking

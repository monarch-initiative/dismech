experimental_models:
- name: ACE-null iPSC-derived kidney organoids
  experimental_model_type: ORGANOID
  description: >-
    ACE-/- and AGTR1-/- iPSC lines and patient-derived iPSCs differentiated
    into kidney organoids, compared with controls under normoxic and hypoxic
    culture.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:38071212
  modeled_mechanisms:
  - target: Proximal Tubule Dysgenesis
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      ACE-null organoids formed proximal tubules indistinguishable from
      controls in vitro.
    limitations: >-
      Organoids have no perfused vasculature, blood pressure or circulating
      renin-angiotensin system, which is the compartment the canonical
      hypoperfusion model invokes; normal proximal tubules in vitro argue
      against a cell-autonomous tubular defect rather than against the
      disease mechanism.
    divergences:
    - divergence_type: BOUNDARY_OMISSION
      materiality: QUALIFYING
      description: >-
        Systemic blood pressure, renal perfusion and the circulating
        renin-angiotensin cascade are absent from the organoid, so it can only
        test whether ACE loss acts within developing nephron cells.
    evidence:
    - reference: PMID:38071212
      reference_title: >-
        RAAS-deficient organoids indicate delayed angiogenesis as a possible
        cause for autosomal recessive renal tubular dysgenesis.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Comprehensive marker analyses show that both mutant and control
        organoids generate indistinguishable PT in vitro under normoxic (21%
        O2) or hypoxic (2% O2) conditions.
      explanation: >-
        ACE-null and control organoids generated indistinguishable proximal
        tubules.
animal_models:
- name: Ace-null mouse
  species: Mouse
  genotype: Ace homozygous targeted null (lacking somatic and testis ACE)
  publication: PMID:8642790
  description: >-
    Mice lacking both ACE isozymes are markedly hypotensive with severe renal
    disease, including a reduced papilla, intrarenal vascular hyperplasia and a
    urine concentrating defect, and reduced aldosterone.
  modeled_mechanisms:
  - target: Loss of Renin-Angiotensin Blood Pressure Support
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    limitations: >-
      Mouse nephrogenesis continues after birth and the renal lesion is
      papillary and vascular rather than the absent proximal tubules of human
      fetal disease, so the model reproduces RAS-dependent hypotension better
      than the tubular lesion.
    evidence:

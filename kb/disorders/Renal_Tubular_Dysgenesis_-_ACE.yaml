inheritance:
- name: Autosomal recessive inheritance
  description: >-
    Affected individuals carry homozygous or compound heterozygous
    loss-of-function ACE variants; heterozygous parents are unaffected and have
    about half-normal plasma ACE activity.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:16116425
    reference_title: >-
      Mutations in genes in the renin-angiotensin system are associated with
      autosomal recessive renal tubular dysgenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      found that they had homozygous or compound heterozygous mutations in the
      genes encoding renin, angiotensinogen, angiotensin converting enzyme or
      angiotensin II receptor type 1
    explanation: >-
      The founding molecular study identified biallelic (homozygous or
      compound heterozygous) RAS gene variants, including ACE, in affected
      individuals.
  - reference: PMID:20454656
    reference_title: >-
      Angiotensin I-converting enzyme Gln1069Arg mutation impairs trafficking
      to the cell surface resulting in selective denaturation of the C-domain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      both parents and a brother who are heterozygous carriers of this mutation
      had exactly half-normal plasma ACE activity compared to healthy
      individuals
    explanation: >-
      Unaffected heterozygous relatives with half-normal plasma ACE activity
      are consistent with recessive inheritance of a loss-of-function allele.
mechanistic_hypotheses:
- hypothesis_group_id: renal_hypoperfusion
  hypothesis_label: Fetal renal hypoperfusion arrests proximal tubule differentiation
  status: CANONICAL
  description: >-
    Loss of angiotensin II leaves the fetal kidney chronically underperfused,
    and renal hypoperfusion of any cause prevents proximal tubules from
    developing and differentiating.
  evidence:
  - reference: PMID:22095942
    reference_title: >-
      Spectrum of mutations in the renin-angiotensin system genes in autosomal
      recessive renal tubular dysgenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Renal hypoperfusion, whether genetic or secondary to a variety of
      diseases, precludes the normal development/ differentiation of proximal
      tubules.
    explanation: >-
      States the hypoperfusion model across genetic and acquired forms of
      renal tubular dysgenesis.
- hypothesis_group_id: delayed_angiogenesis
  hypothesis_label: Delayed angiogenesis starves developing proximal tubules
  status: EMERGING
  description: >-
    Kidney organoid work suggests that proximal tubule dysgenesis is not a
    cell-autonomous failure of tubular epithelium but a consequence of delayed,
    VEGF-A-dependent angiogenesis that deprives developing proximal tubules of
    vascular supply at a critical stage. The engraftment experiments were done
    in AGTR1-null organoids; ACE-null organoids were shown only to form normal
    proximal tubules in vitro, so the angiogenesis step is extrapolated to ACE
    deficiency rather than shown for it.
  evidence:
  - reference: PMID:38071212
    reference_title: >-
      RAAS-deficient organoids indicate delayed angiogenesis as a possible
      cause for autosomal recessive renal tubular dysgenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We propose that PT dysgenesis in AR-RTD is primarily a non-autonomous
      consequence of delayed angiogenesis, starving PT at a critical time in
      their development.
    explanation: >-
      The authors propose delayed angiogenesis as the proximate cause of
      proximal tubule dysgenesis.
- hypothesis_group_id: angiotensin_erythropoiesis
  hypothesis_label: Lost angiotensin II drive to erythropoiesis explains disproportionate anemia
  status: EMERGING
  description: >-
    Proposed explanation for anemia out of proportion to renal failure in
    biallelic ACE patients. It rests on angiotensinogen- and renin-null mice
    and a review of angiotensin II actions on erythropoiesis; it has not been
    tested in ACE-deficient patients, and chronic kidney disease is itself a
    cause of anemia.
  evidence:
  - reference: PMID:20400218
    reference_title: >-
      The role of the renin-angiotensin system in the regulation of
      erythropoiesis.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      we present evidence that angiotensin II (Ang II) is a physiologically
      important regulator of erythropoiesis
    explanation: Review supporting angiotensin II as a regulator of erythropoiesis.
pathophysiology:
- name: ACE Loss of Function
  description: >-
    Biallelic nonsense, frameshift, canonical splice, missense and exon
    deletion variants leave no functional membrane-bound ACE. Some lethal
    variants still encode a catalytically active protein (the truncated R762X
    protein is secreted, and Q1069R retains catalytic properties when it can be
    rescued to the cell surface), so the loss is of tissue-bound enzyme rather
    than uniformly of catalytic activity. ACE variants account for about
    two-thirds of families with renal tubular dysgenesis.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: ACE
    term:
      id: hgnc:2707
      label: ACE
  molecular_functions:
  - preferred_term: tissue-bound peptidyl-dipeptidase activity
    term:
      id: GO:0008241
      label: peptidyl-dipeptidase activity
    modifier: DECREASED
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: "CGGV:assertion_14a5efd4-d71f-40b1-91ff-90f7f8d63ec7-2024-12-11T170000.000Z"
    reference_title: ACE / renal tubular dysgenesis - ACE (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      many nonsense, frameshift, canonical splice, missense, and single and/or
      multi-exon deletions have been reported in affected individuals
    explanation: >-
      ClinGen summarizes the range of variant classes reported in affected
      individuals.
  - reference: "CGGV:assertion_14a5efd4-d71f-40b1-91ff-90f7f8d63ec7-2024-12-11T170000.000Z"
    reference_title: ACE / renal tubular dysgenesis - ACE (Definitive)
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: The molecular mechanism of disease is loss-of-function.
    explanation: >-
      ClinGen identifies loss of function as the disease mechanism.
  - reference: PMID:22095942
    reference_title: >-
      Spectrum of mutations in the renin-angiotensin system genes in autosomal
      recessive renal tubular dysgenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most of them are novel and ACE mutations are the most frequent, observed
      in two-thirds of families (64.6%).
    explanation: >-
      In a series of 48 families, ACE was the most frequently mutated RAS gene.
  downstream:
  - target: Loss of Cell-Surface ACE
    causal_link_type: DIRECT
    description: >-
      Truncating variants that remove the membrane anchor, and missense
      variants that misfold, both prevent ACE from reaching the plasma
      membrane.
    evidence:
    - reference: PMID:24163131
      reference_title: >-
        Absence of cell surface expression of human ACE leads to perinatal
        death.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        two missense mutants (W594R and R828H) and two truncated mutants
        (Q1136X and G1145AX) were also studied. These mutants were neither
        inserted in the plasma membrane nor secreted.
      explanation: >-
        Expression of patient missense and truncating ACE variants showed loss
        of membrane insertion.
- name: Loss of Cell-Surface ACE
  description: >-
    Disease-causing ACE variants leave no enzyme at the cell surface. Some
    missense proteins, such as Q1069R, are retained in the endoplasmic
    reticulum and degraded by the proteasome; the truncated R762X protein is
    catalytically active but secreted rather than membrane-anchored. Tissue-bound
    rather than circulating ACE is what matters: a variant that still reaches
    the membrane (R1180P) was compatible with survival after transient neonatal
    renal insufficiency.
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:24163131
    reference_title: >-
      Absence of cell surface expression of human ACE leads to perinatal death.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results highlight the importance of tissue-bound ACE versus
      circulating ACE and show that the total absence of cell surface
      expression of ACE is incompatible with life.
    explanation: >-
      Links absence of cell-surface ACE to lethality and distinguishes it from
      the presence of circulating enzyme.
  - reference: PMID:21695262
    reference_title: Impaired proteostasis contributes to renal tubular dysgenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      ACE Q1069R is found sequestered in the endoplasmic reticulum and is also
      subject to increased proteasomal degradation, preventing its transport to
      the cell surface and extracellular fluids.
    explanation: >-
      A patient missense variant causes endoplasmic reticulum retention and
      degradation rather than loss of catalysis.
  - reference: PMID:20454656
    reference_title: >-
      Angiotensin I-converting enzyme Gln1069Arg mutation impairs trafficking
      to the cell surface resulting in selective denaturation of the C-domain.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      CHO cells expressing wild-type (WT) vs. Q1069R-ACE demonstrated the
      mutant accumulates intracellularly and also that it is significantly
      degraded by intracellular proteases.
    explanation: >-
      An independent study of the same variant confirms intracellular
      accumulation and degradation.
  - reference: PMID:9153279
    reference_title: >-
      The critical role of tissue angiotensin-converting enzyme as revealed by
      gene targeting in mice.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Mice that express only this modified ACE have significant plasma ACE
      activity but no tissue-bound enzyme. These animals have low blood
      pressure, renal vascular thickening, and a urine concentrating defect.
    explanation: >-
      Mice with only secreted ACE reproduce hypotension and renal disease,
      showing that tissue-bound ACE is required.
  downstream:
  - target: Loss of Tissue Angiotensin II Generation
    causal_link_type: DIRECT
- name: Loss of Tissue Angiotensin II Generation
  description: >-
    ACE catalyzes the conversion of angiotensin I to angiotensin II. Without
    membrane-bound ACE, tissue and intrarenal angiotensin II generation fails
    and the fetal renin-angiotensin system is functionally inactive, even
    where some circulating enzyme persists.
  biological_scale: MOLECULAR
  biological_processes:

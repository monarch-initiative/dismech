name: Renal Tubular Dysgenesis - ACE
creation_date: "2026-10-09T13:24:52Z"
category: Mendelian
description: >-
  Renal tubular dysgenesis - ACE is the autosomal recessive form of renal
  tubular dysgenesis caused by biallelic loss-of-function variants in ACE, the
  gene encoding angiotensin I-converting enzyme. Without ACE the fetus cannot
  convert angiotensin I to angiotensin II, so the renin-angiotensin system
  cannot sustain fetal blood pressure and renal perfusion. The chronically
  underperfused fetal kidney fails to differentiate proximal tubules, which is
  the histological hallmark of the disease. Fetal anuria follows, producing
  early-onset oligohydramnios or anhydramnios and the Potter sequence with
  pulmonary hypoplasia, together with skull ossification defects. Most affected
  fetuses and neonates die from anuria, pulmonary hypoplasia and refractory
  arterial hypotension, but a growing number of children survive the neonatal
  period with intensive blood pressure and renal support, and some biallelic
  ACE genotypes present later as progressive chronic kidney disease with
  anemia and polyuria. ACE variants are the most frequent cause of renal
  tubular dysgenesis, found in about two-thirds of families.
synonyms:
- ACE related renal tubular dysgenesis
- ACE-related autosomal recessive renal tubular dysgenesis
- RTD-ACE

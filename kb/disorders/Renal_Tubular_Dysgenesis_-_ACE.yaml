progression:
- phase: Perinatal lethality
  age_range: Late gestation to the first days after birth
  notes: >-
    Most affected pregnancies end in late-gestation stillbirth or death in the
    first days of life from anuria, pulmonary hypoplasia and refractory
    hypotension. Recorded here rather than as phenotypes because the HPO death
    terms (HP:0003826 Stillbirth, HP:0003811 Neonatal death) sit outside the
    PhenotypeTerm enum's phenotypic-abnormality root.
  evidence:
  - reference: PMID:38091257
    reference_title: >-
      Prenatal diagnosis of autosomal recessive renal tubular dysgenesis caused
      by variants in the ACE gene: Two fetuses with anhydramnios.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      nearly all affected fetuses die after birth or have a stillbirth in late
      gestation
    explanation: Late-gestation stillbirth or death after birth is the usual outcome.
  - reference: PMID:22095942
    reference_title: >-
      Spectrum of mutations in the renin-angiotensin system genes in autosomal
      recessive renal tubular dysgenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early death occurs in most cases from anuria, pulmonary hypoplasia, and
      refractory arterial hypotension.
    explanation: Names the causes of early death.
- phase: Survival beyond the neonatal period
  age_range: Infancy onward
  notes: >-
    A minority survive with intensive support; urine output may appear after
    days to weeks, and survivors usually have chronic kidney disease. A
    literature review counted 18 earlier cases with better outcomes.
  evidence:
  - reference: PMID:35286024
    reference_title: >-
      Expanding the clinical spectrum of autosomal-recessive renal tubular
      dysgenesis: Two siblings with neonatal survival and review of the
      literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      While AR-RTD is most often a lethal disease in the neonatal period, it is
      not universally so.
    explanation: Neonatal lethality is most common but not universal.
  - reference: PMID:40245857
    reference_title: >-
      Diagnosis and Treatment of Inherited Renal Tubular Dysgenesis Caused by
      ACE Gene Mutation: A Single-Center Experience.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      During the 27-month follow-up, this patient exhibited normal renal
      function and ultrasound findings.
    explanation: One ACE-mutated survivor had normal renal function at 27 months.
  - reference: PMID:34957720
    reference_title: >-
      [RENAL TUBULAR DYSGENESIS SECONDARY TO MUTATIONS IN GENES ENCODING THE
      RENIN-ANGIOTENSIN SYSTEM].
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 4/5 patients we identified a mutation in angiotensin converting enzyme
      (ACE) gene. Variable presentation was noticed in the patients, starting
      with peritoneal dialysis and extreme low blood pressure treated with
      vasopressors and plasma infusions and ending with no symptoms. Currently,
      the patients are 5-20 years old with variable stages of chronic kidney
      disease.
    explanation: >-
      Five neonatal survivors, four with ACE variants, reached 5 to 20 years
      with variable chronic kidney disease.
biochemical:
- name: Plasma ACE activity

differential_diagnoses:
- name: Fetal ACE inhibitor or angiotensin receptor blocker fetopathy
  description: >-
    Maternal ACE inhibitor or angiotensin II receptor blocker use in the second
    or third trimester produces an acquired phenocopy with reduced proximal
    tubules and hypocalvaria. A history of maternal exposure distinguishes it;
    it is not modeled as an environmental cause here because this entry is the
    gene-defined form.
  evidence:
  - reference: PMID:34082612
    reference_title: >-
      Quantifying Proximal Collecting Tubule Deficiency in Angiotensin-Converting
      Enzyme Inhibitor and Angiotensin II Receptor Blocker Fetopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AA fetopathy phenotype is similar to renal tubular dysgenesis including
      reduced proximal convoluted tubules (PCTs).
    explanation: Establishes the drug-induced phenocopy.
  - reference: PMID:9222960
    reference_title: >-
      Congenital renal tubular dysplasia and skull ossification defects similar
      to teratogenic effects of angiotensin converting enzyme (ACE) inhibitors.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical, pathological, and radiological features are similar to the
      phenotype associated with fetal exposure to angiotensin converting enzyme
      (ACE) inhibitors
    explanation: Familial RTD closely resembles ACE inhibitor fetopathy.
- name: Renal tubular dysgenesis due to REN, AGT or AGTR1 variants
  description: >-
    Biallelic variants in the other renin-angiotensin genes produce the same
    phenotype with similar severity; only molecular testing separates them.
    MONDO has no gene-specific term for these forms.
  evidence:
  - reference: PMID:22095942
    reference_title: >-
      Spectrum of mutations in the renin-angiotensin system genes in autosomal
      recessive renal tubular dysgenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The severity of the clinical course was similar whatever the mutated
      gene
    explanation: Clinical course does not distinguish the RAS genes.
- name: Renal tubular dysgenesis due to twin-twin transfusion
  description: >-
    Acquired renal hypoperfusion in the donor twin of twin-twin transfusion
    syndrome can also produce renal tubular dysgenesis.
  disease_term:
    preferred_term: renal tubular dysgenesis due to twin-twin transfusion
    term:
      id: MONDO:0019984
      label: renal tubular dysgenesis due to twin-twin transfusion
notes: >-
  No GeneReviews chapter covers renal tubular dysgenesis
  (`just check-genereviews --online` returned NO_CHAPTER, and a PubMed search
  for "tubular dysgenesis[TI] AND genereviews[book]" returned no records), so
  the phenotype baseline is the Gribouval 2005 and 2012 series and the ClinGen
  curation. Only the ACE form has a gene-specific MONDO term; the REN, AGT and
  AGTR1 forms sit under MONDO:0009970 renal tubular dysgenesis of genetic
  origin, so this entry is gene-specific and a grouping across the four genes
  is left for when those forms are curated. Single case reports of esophageal
  atresia with biallelic ACE variants are not included as phenotypes.

histopathology:
- name: Absence or paucity of differentiated proximal tubules
  diagnostic: true
  description: >-
    Cortical tubules lack proximal differentiation from at least 18 weeks of
    gestation; this is the defining lesion.
  evidence:
  - reference: PMID:16116425
    reference_title: >-
      Mutations in genes in the renin-angiotensin system are associated with
      autosomal recessive renal tubular dysgenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Absence or paucity of differentiated proximal tubules is the
      histopathological hallmark of the disease
    explanation: Defines the diagnostic histological lesion.
  - reference: PMID:16790508
    reference_title: >-
      Renal tubular dysgenesis, a not uncommon autosomal recessive disorder
      leading to oligohydramnios: Role of the Renin-Angiotensin system.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Severe defects in proximal tubules were observed in all fetuses from 18
      gestational weeks onward, and lesions also involved other tubular
      segments.
    explanation: Mixed-genotype autosomal recessive RTD series dating the lesion.
- name: Thickening of the renal arterial wall
  description: >-
    Thickened renal arterial vasculature from the arcuate to the afferent
    arteries. Shown in a mixed-genotype autosomal recessive RTD series, not
    reported separately for ACE cases; ACE-null and secreted-ACE mice show
    intrarenal vascular hyperplasia and thickening.
  evidence:
  - reference: PMID:16790508
    reference_title: >-
      Renal tubular dysgenesis, a not uncommon autosomal recessive disorder
      leading to oligohydramnios: Role of the Renin-Angiotensin system.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      They were associated with thickening of the renal arterial vasculature,
      from the arcuate to the afferent arteries.
    explanation: Arterial wall thickening accompanies the tubular lesions in human RTD.
  - reference: PMID:8642790
    reference_title: >-
      Mice lacking angiotensin-converting enzyme have low blood pressure,
      renal pathology, and reduced male fertility.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the intrarenal arteries exhibit vascular hyperplasia associated with a
      perivascular inflammatory infiltrate
    explanation: ACE-null mice show intrarenal vascular hyperplasia.
- name: Increased renal renin expression
  description: >-
    Strikingly increased renin in the juxtaglomerular apparatus and
    preglomerular arterioles in most autosomal recessive RTD kidneys.
  evidence:
  - reference: PMID:16790508
    reference_title: >-
      Renal tubular dysgenesis, a not uncommon autosomal recessive disorder
      leading to oligohydramnios: Role of the Renin-Angiotensin system.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Renal renin expression was strikingly increased in 19 of 24 patients
      studied, from 13 families, whereas no renal renin was detected in four
      patients from three families.
    explanation: Renin overexpression in most cases of a mixed-genotype series.
genetic:
- name: ACE
  gene_term:
    preferred_term: ACE
    term:
      id: hgnc:2707
      label: ACE
  association: Causative biallelic loss-of-function variants
  relationship_type: CAUSATIVE
  gene_disease_validity:
  - validity_classification: DEFINITIVE
    classified_by: CLINGEN
    external_id: CGGV:assertion_14a5efd4-d71f-40b1-91ff-90f7f8d63ec7-2024-12-11T170000.000Z
    evidence:
    - reference: CGGV:assertion_14a5efd4-d71f-40b1-91ff-90f7f8d63ec7-2024-12-11T170000.000Z
      reference_title: ACE / renal tubular dysgenesis - ACE (Definitive)
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        ACE | HGNC:2707 | renal tubular dysgenesis - ACE | MONDO:0700337 | AR |
        Definitive
      explanation: ClinGen definitive classification for this gene-disease pair.
  features: >-
    Homozygous or compound heterozygous nonsense, frameshift, splice, missense
    and exon deletion variants. Truncating variants typically cause fetal or
    early neonatal death; a variant that preserves cell-surface ACE (R1180P)
    was compatible with survival. The common intron 16 Alu insertion/deletion
    polymorphism is a separate susceptibility locus and not part of this
    disease.
  evidence:
  - reference: PMID:16116425
    reference_title: >-
      Mutations in genes in the renin-angiotensin system are associated with
      autosomal recessive renal tubular dysgenesis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      found that they had homozygous or compound heterozygous mutations in the
      genes encoding renin, angiotensinogen, angiotensin converting enzyme or
      angiotensin II receptor type 1
    explanation: First identification of biallelic ACE variants in RTD.
  - reference: PMID:25899979
    reference_title: >-
      Resolution of refractory hypotension and anuria in a premature newborn
      with loss-of-function of ACE.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Truncating alterations in ACE most often result in fetal demise during
      gestation or in the first days of life and typically as a result of the
      Potter sequence.
    explanation: Summarizes the usual outcome of truncating ACE variants.
  - reference: PMID:24163131
    reference_title: >-
      Absence of cell surface expression of human ACE leads to perinatal death.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In contrast, another mutant, R1180P, was compatible with life after
      transient neonatal renal insufficiency.
    explanation: The R1180P carrier survived after transient neonatal renal insufficiency.
  - reference: PMID:24163131
    reference_title: >-
      Absence of cell surface expression of human ACE leads to perinatal death.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: This mutant was located at the plasma membrane and rapidly secreted.
    explanation: In expression studies the survival-compatible R1180P protein reached the plasma membrane.

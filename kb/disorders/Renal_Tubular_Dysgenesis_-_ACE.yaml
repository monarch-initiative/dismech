- name: Delayed Nephrogenic Angiogenesis
  description: >-
    Insufficient VEGF-A expression, attributed to lost angiotensin II type 1
    receptor signalling, delays vascularization of developing nephrons. In AGTR1-null kidney organoids, renal-vesicle-stage grafts
    failed to engraft for lack of pro-angiogenic VEGF-A, and hypoxia or
    ectopic VEGF-A rescued engraftment.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: kidney vasculature development
    term:
      id: GO:0061440
      label: kidney vasculature development
    modifier: DECREASED
  evidence:
  - reference: PMID:38071212
    reference_title: >-
      RAAS-deficient organoids indicate delayed angiogenesis as a possible
      cause for autosomal recessive renal tubular dysgenesis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    directness: INDIRECT
    snippet: >-
      By contrast, d14 AGTR1-/- organoids fail to engraft due to insufficient
      pro-angiogenic VEGF-A expression. Notably, growth under hypoxic
      conditions induces VEGF-A expression and rescues engraftment of
      AGTR1-/- organoids at d14, as does ectopic expression of VEGF-A.
    explanation: >-
      Shows the angiogenesis defect in AGTR1-null organoids; applying it to
      ACE deficiency is an inference across RAS genes.
  downstream:
  - target: Proximal Tubule Dysgenesis
    causal_link_type: UNKNOWN
    hypothesis_groups:

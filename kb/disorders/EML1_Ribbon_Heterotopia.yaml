progression:
- phase: Onset
  age_range: Prenatal to Neonatal
  notes: >-
    Brain malformation features including ventriculomegaly, congenital
    hydrocephalus, callosal agenesis, and ribbon-like heterotopia can be
    detected on fetal ultrasound and fetal MRI in the second to third trimester
    or at birth, with progressive thickening of the subcortical heterotopic
    layer and rapid postnatal head growth.
  evidence:
  - reference: PMID:31710781
    reference_title: "EML1-associated brain overgrowth syndrome with ribbon-like heterotopia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Review of sequential imaging performed for Individual 5 illustrates that
      several of these imaging features, especially the abnormally formed
      lateral ventricles, hydrocephalus if present and - suspicion of-a cortical
      malformation, can be detected during third trimester using fetal MRI and
      even prenatal ultrasound.
    explanation: >-
      Documents prenatal recognition of core structural malformations and
      hydrocephalus on third-trimester fetal MRI and prenatal ultrasound.
  - reference: PMID:31710781
    reference_title: "EML1-associated brain overgrowth syndrome with ribbon-like heterotopia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In time, this zone thickens from a small undulating line of cells on the
      fetal and neonatal scans to thickening of this zone to near 10 mm.
    explanation: >-
      Sequential fetal, neonatal, and follow-up MRI scans document progressive
      postnatal thickening of the subcortical heterotopic layer.

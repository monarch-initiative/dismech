      label: subcortical band heterotopia
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO:0020491 was this entry's `disease_term` until the EML1-specific
      class above was adopted. It is broader: its other child is
      MONDO:0010239 (lissencephaly type 1 due to doublecortin gene mutation),
      which is curated as the X-linked/DCX subtype row of
      Lissencephaly_Spectrum_Disorders. This entry's own description
      distinguishes the EML1 progenitor mechanism from the DCX and PAFAH1B1
      neuronal-migration mechanism, so asserting identity with the parent class
      attributed EML1-unrelated diseases to this entry. Recorded as
      `skos:broadMatch`, which is a cross-reference and does not retire the
      broader concept from the curation queue.

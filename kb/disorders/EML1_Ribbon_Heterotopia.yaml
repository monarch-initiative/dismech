diagnosis:
- name: Brain MRI and Prenatal Neuroimaging
  description: >-
    Fetal ultrasound, fetal MRI, and postnatal brain MRI to identify the
    characteristic neuroradiological tetrad of megalencephaly, bilateral
    ribbon-like subcortical heterotopia in the outer subventricular zone,
    partial or complete callosal agenesis, and overlying polymicrogyria-like
    cortical malformation.
  diagnosis_term:
    preferred_term: Magnetic Resonance Imaging
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  presence: >-
    Generalized megalencephaly, undulating ribbon-like subcortical heterotopia
    with myelinated white matter on both sides, partial or complete agenesis of
    the corpus callosum, overlying polymicrogyria-like cortex, and frequently
    congenital hydrocephalus.
  evidence:
  - reference: PMID:31710781
    reference_title: "EML1-associated brain overgrowth syndrome with ribbon-like heterotopia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We show that the imaging phenotype associated with EML1 mutations is
      consistent and the disorder can be recognized by the unique appearance on
      brain MRI.
    explanation: >-
      Establishes brain MRI recognition of the unique imaging signature as a
      primary diagnostic modality.
- name: EML1 Molecular Genetic Testing
  description: >-
    Exome sequencing, targeted EML1 sequencing, or chromosomal microarray to
    detect biallelic loss-of-function or HELP-motif missense variants or
    intragenic deletions in EML1.
  presence: >-
    Homozygous or compound heterozygous pathogenic variants or exon deletions in
    EML1.
  evidence:
  - reference: PMID:31710781
    reference_title: "EML1-associated brain overgrowth syndrome with ribbon-like heterotopia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In conclusion, truncating variants and missense variants clustering in the
      HELP motif in EML1 lead to a recognizable syndrome characterized by severe
      developmental delay, drug-resistant seizures and visual impairment.
    explanation: >-
      Supports molecular confirmation via identification of biallelic EML1
      truncating or HELP-motif missense variants.
differential_diagnoses:
- name: Chudley-McCullough Syndrome
  description: >-
    Autosomal recessive GPSM2-related disorder that can share subcortical
    heterotopia, callosal agenesis/hypogenesis, ventriculomegaly, macrocephaly,
    and seizures on brain imaging.
  distinguishing_features:
  - Congenital sensorineural hearing loss is a hallmark of Chudley-McCullough syndrome
  - Intellectual disability is absent or mild in Chudley-McCullough syndrome versus severe/profound in EML1-related heterotopia
  - Subcortical heterotopia in Chudley-McCullough syndrome is less diffuse and shows a predilection for the cingulate gyrus
  evidence:
  - reference: PMID:31710781
    reference_title: "EML1-associated brain overgrowth syndrome with ribbon-like heterotopia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The imaging pattern also shows overlap with that observed in the Chudley
      McCullough syndrome. In these individuals subcortical heterotopia,
      agenesis/hypogenesis of the corpus callosum, and ventriculomegaly are
      frequently present
    explanation: >-
      Explicitly identifies Chudley-McCullough syndrome as a key neuroradiologic
      differential diagnosis.
  - reference: PMID:31710781
    reference_title: "EML1-associated brain overgrowth syndrome with ribbon-like heterotopia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although they can have macrocephaly and seizures, clinically they present
      differently with hearing loss, and absent or only mild ID in stark
      contrast to the severe ID observed in the EML1 patients (Doherty et al.,
      2012). Moreover, the subcortical heterotopia is either not or only
      slightly festooned and not as diffuse as in EML1 mutations, and shows a
      predilection for the cingulate gyrus.
    explanation: >-
      Directly supports the clinical and imaging distinguishing features between
      Chudley-McCullough syndrome and EML1-related ribbon-like heterotopia.

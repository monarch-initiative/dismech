genetic:
- name: LHB
  notes: >-
    Encodes the luteinizing hormone beta subunit. Biallelic loss-of-function variants cause the
    disease; the reported spectrum covers missense, in-frame deletion, splice-site, nonsense and
    frameshift alleles. No ClinGen gene-disease validity record for LHB is present in the
    committed ClinGen cache, so no validity tier is recorded.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: LHB
    term:
      id: hgnc:6584
      label: LHB
  evidence:
  - reference: PMID:35470463
    reference_title: "Luteinizing hormone β-subunit deficiency: Report of a novel LHB likely pathogenic variant and a systematic review of the published literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten pathogenic/likely pathogenic variants (three in-frame deletions, three missense, two splice-site, one nonsense, and one frameshift variants) have been reported in nine index patients."
    explanation: Pathogenic LHB variants across published index patients.
  - reference: PMID:29476300
    reference_title: Homozygous nonsense mutation Trp28X in the LHB gene causes male hypogonadism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a novel mutation in the LHB gene in a male patient with hypogonadism and provided evidence that LHB nonsense mutation can cause selective LH deficiency."
    explanation: A homozygous null allele causing the disease.
  - reference: PMID:25071724
    reference_title: "Reproduction, smell, and neurodevelopmental disorders: genetic defects in different hypogonadotropic hypogonadal syndromes."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Interestingly, defects in PROKR2, FGFR1, FGF8, CHD7, DUSP6, and WDR11 genes are also associated with normosmic IHH, whereas mutations in KISS1/KISSR, TAC3/TACR3, GNRH1/GNRHR, LEP/LEPR, HESX1, FSHB, and LHB are only present in patients with normosmic IHH."
    explanation: >-
      LHB variants are reported only in normosmic patients, which is why anosmia is not
      recorded despite the MONDO label.
diagnosis:
- name: Gonadotropin and sex steroid measurement
  description: >-
    The suggestive pattern is low testosterone in males, or anovulatory estradiol and
    progesterone levels in females, with low or undetectable LH and normal or raised FSH. LH
    may be immunoreactive but bioinactive, so a normal LH immunoassay result does not exclude
    the diagnosis when the clinical picture fits.
  diagnosis_term:
    preferred_term: luteinizing hormone measurement
    term:
      id: NCIT:C74790
      label: Luteinizing Hormone Measurement
  results: Low or undetectable LH, normal or raised FSH, low testosterone in males.
  evidence:
  - reference: PMID:35470463
    reference_title: "Luteinizing hormone β-subunit deficiency: Report of a novel LHB likely pathogenic variant and a systematic review of the published literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The typical phenotype in male patients with LHB deficiency is delayed puberty with low testosterone, low LH, and normal to high FSH"
    explanation: The biochemical pattern.
- name: LHB gene sequencing
  description: >-
    Sequencing of LHB, including the intron 2 splice donor site, confirms the diagnosis when
    two pathogenic alleles are found. It should be considered in boys and girls with selective
    LH deficiency.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: Biallelic pathogenic LHB variants, homozygous or compound heterozygous.
  evidence:
  - reference: PMID:22723313
    reference_title: Hypogonadism in a patient with two novel mutations of the luteinizing hormone β-subunit gene expressed in a compound heterozygous form.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These mutations should be considered in girls and boys with selective deficiency of LH."
    explanation: The recommendation to test patients with selective LH deficiency.
treatments:
- name: Human Chorionic Gonadotropin Therapy in Males
  description: >-
    hCG acts on the LH receptor, which is intact, and so replaces the missing hormone at its
    target. It raises testosterone, induces virilization and, unlike testosterone alone, can
    induce spermatogenesis; the systematic review judged hCG monotherapy the best option for
    men.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: human chorionic gonadotropin
      term:
        id: CHEBI:81570
        label: Chorionic gonadotropin
  target_mechanisms:
  - target: Leydig Cell Hypoplasia and Testosterone Deficiency
    treatment_effect: BYPASSES
    description: >-
      hCG replaces the absent LH signal at the Leydig cell, restoring testosterone production
      without correcting the LHB defect.
    evidence:
    - reference: PMID:27656125
      reference_title: A vital region for human glycoprotein hormone trafficking revealed by an LHB mutation.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Treatment with hCG led to pubertal development, increased circulating testosterone and spermatogenesis."
      explanation: hCG restored testosterone and spermatogenesis.
  - target: Impaired Spermatogenesis
    treatment_effect: BYPASSES
    description: Spermatogenesis recovers once intratesticular testosterone is restored by hCG.
    evidence:
    - reference: PMID:29476300
      reference_title: Homozygous nonsense mutation Trp28X in the LHB gene causes male hypogonadism.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "After 40 days of treatment with hCG, the patient exhibited a few spermatozoa in the semen. Treated for 6 months, the patient exhibited normal seminal parameters."
      explanation: Recovery of spermatogenesis on hCG in a man with a null allele.
  evidence:
  - reference: PMID:15602022
    reference_title: Hypogonadism in a patient with a mutation in the luteinizing hormone beta-subunit gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with human chorionic gonadotropin increased circulating testosterone, promoted virilization, and was associated with the appearance of normal spermatozoa in low concentrations."
    explanation: Response to hCG in a homozygous man.
  - reference: PMID:35470463
    reference_title: "Luteinizing hormone β-subunit deficiency: Report of a novel LHB likely pathogenic variant and a systematic review of the published literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The typical phenotype in male patients with LHB deficiency is delayed puberty with low testosterone, low LH, and normal to high FSH and hCG monotherapy being the best therapeutic option."
    explanation: The systematic review's conclusion on treatment of males.
  - reference: PMID:15569941
    reference_title: "Targeted disruption of luteinizing hormone beta-subunit leads to hypogonadism, defects in gonadal steroidogenesis, and infertility."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Finally, both male and female null mice can be pharmacologically rescued by exogenous human chorionic gonadotropin, indicating that LH-responsiveness of the target cells is not irreversibly lost."
    explanation: hCG rescue in the mouse model shows the target cells remain responsive.

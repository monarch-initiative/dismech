    evidence_source: HUMAN_CLINICAL
    snippet: "In the majority, testosterone monotherapy modestly increased testicular volume whereas human chorionic gonadotropin (hCG) monotherapy also improved spermatogenesis."
    explanation: Outcome of testosterone monotherapy in published males.

animal_models:
- name: Lhb knockout mouse
  species: Mouse
  genotype: Lhb-/-
  description: >-
    Mice lacking the LH beta subunit are viable and infertile, with Leydig cell hypoplasia,
    low testosterone and spermatogenic arrest at the round spermatid in males, and absent
    corpora lutea with low estradiol and progesterone in females. FSH is unaffected, and both
    sexes are rescued by hCG.

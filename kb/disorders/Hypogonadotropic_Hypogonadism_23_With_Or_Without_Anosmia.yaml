name: Hypogonadotropic Hypogonadism 23 With or Without Anosmia
category: Mendelian
creation_date: "2026-10-16T00:00:00Z"
synonyms:
- HH23
- Selective luteinizing hormone deficiency
- Isolated luteinizing hormone deficiency
- LHB deficiency
- LHB hypogonadotropic hypogonadism
- Pasqualini syndrome
- Fertile eunuch syndrome
- Leydig cell hypoplasia due to LHB deficiency
- Leydig cell hypoplasia due to luteinizing hormone subunit beta deficiency
- 46,XY DSD due to LHB deficiency
- 46,XY disorder of sex development due to luteinizing hormone subunit beta deficiency
description: >-
  An autosomal recessive form of hypogonadism caused by biallelic inactivating variants in LHB,
  the gene for the hormone-specific beta subunit of luteinizing hormone (LH). Because only the LH
  beta chain is affected, the defect is selective: the pituitary still makes FSH, and the common
  alpha subunit shared with FSH, TSH and hCG is intact. Reported variants act at different steps
  (failed heterodimerization with the alpha subunit, intracellular retention of the hormone,
  aberrant splicing, premature termination), but the common end point is the absence of
  biologically active LH in the circulation. Some patients have immunoreactive LH that is
  bioinactive, so an assay result in the normal range does not exclude the diagnosis.

  The consequences depend on sex. Males are born with normal male genitalia and descended
  testes, because fetal Leydig cells are driven by placental hCG rather than by pituitary LH,
  and present in adolescence or adulthood with absent or delayed puberty, low testosterone,
  small testes with immature Leydig cells, eunuchoid proportions and azoospermia. Females go
  through spontaneous breast development and menarche, because early follicle growth and enough
  estradiol for puberty are FSH-dependent, and then present with oligomenorrhea or secondary
  amenorrhea and infertility from anovulation. FSH is normal or raised in both sexes.

  The condition is very rare: a 2023 systematic review counted 11 published males and 3
  females. LH is the missing signal and its target cells are intact, so the disorder responds to
  hCG, which acts on the same receptor. hCG restores testosterone and can induce spermatogenesis
  in men, and LH followed by hCG has achieved ovulation and a live birth in a woman.
disease_term:
  preferred_term: hypogonadotropic hypogonadism 23 with or without anosmia
  term:
    id: MONDO:0009223
    label: hypogonadotropic hypogonadism 23 with or without anosmia
parents:
- Congenital hypogonadotropic hypogonadism
- Leydig cell hypoplasia
notes: >-
  The MONDO label carries "with or without anosmia" because it follows the numbered
  hypogonadotropic hypogonadism series. The defect is in the pituitary hormone itself, not in
  the olfactory-GnRH neuron system, and LHB variants are reported only in normosmic patients, so
  anosmia is not recorded as a phenotype. The defect lies downstream of GnRH, which also
  separates this entry from the GnRH-deficiency forms of congenital hypogonadotropic
  hypogonadism: the problem is a structurally defective hormone rather than an absent
  hypothalamic drive. MONDO cross-references this term to OMIM:228300 and Orphanet:325448;
  they are recorded here in prose because the mappings block has no OMIM or Orphanet slot.
  The synonym "fertile eunuch syndrome" is not specific to LHB: it is also used for partial
  GnRH deficiency, including GNRHR-related forms.
references:
- reference: PMID:25071724
  title: "Reproduction, smell, and neurodevelopmental disorders: genetic defects in different hypogonadotropic hypogonadal syndromes."
inheritance:
- name: Autosomal Recessive
  description: >-
    Affected individuals are homozygous, usually from consanguineous families, or compound
    heterozygous for LHB variants. Heterozygous parents of reported probands were clinically
    normal.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:22723313
    reference_title: Hypogonadism in a patient with two novel mutations of the luteinizing hormone β-subunit gene expressed in a compound heterozygous form.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient's heterozygous parents were clinically normal."
    explanation: >-
      Heterozygous carriers are unaffected while the compound heterozygous proband and his
      sister are affected, the recessive pattern.
  - reference: PMID:17761593
    reference_title: Luteinizing hormone beta mutation and hypogonadism in men and women.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These subjects have a newly discovered homozygous mutation of a 5' splice site in LHB: IVS2+1G-->C."
    explanation: Homozygous variant in three affected siblings of a consanguineous family.
pathophysiology:
- name: Biallelic LHB Inactivating Variants
  description: >-
    LHB encodes the beta subunit that gives LH its receptor specificity. Pathogenic variants are
    biallelic and of several classes: missense changes in the cystine knot (p.Gly36Asp,
    p.Cys46Arg), in-frame deletions (p.Lys40del, a four-leucine deletion in the signal peptide),
    splice-site variants in intron 2 (IVS2+1G>C, IVS2+1G>T), a nonsense variant (p.Trp28*) and
    a frameshift. All abolish production of bioactive LH, which is why the impact is recorded as
    loss of function regardless of the step affected.
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: LHB
    term:
      id: hgnc:6584
      label: LHB
  molecular_functions:
  - preferred_term: luteinizing hormone activity
    modifier: DECREASED
    term:
      id: GO:0005179
      label: hormone activity
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    description: >-
      Homozygous in most reported families, compound heterozygous in others (IVS2+1G>T with a
      12-bp signal-peptide deletion in an Italian sibship; p.Phe84Leu with p.Gly122Ser in a
      Chinese woman).
  downstream:
  - target: Loss of Bioactive LH Secretion
    description: >-
      Each variant class removes secreted bioactive LH by a different route: no heterodimer
      with the alpha subunit, intracellular retention of an assembled hormone, missplicing of
      the mRNA, or a truncated peptide.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:35470463
    reference_title: "Luteinizing hormone β-subunit deficiency: Report of a novel LHB likely pathogenic variant and a systematic review of the published literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Ten pathogenic/likely pathogenic variants (three in-frame deletions, three missense, two splice-site, one nonsense, and one frameshift variants) have been reported in nine index patients."
    explanation: The allelic spectrum across all published index patients.
  - reference: PMID:15602022
    reference_title: Hypogonadism in a patient with a mutation in the luteinizing hormone beta-subunit gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient had a homozygous missense mutation in the gene that encodes the beta subunit of luteinizing hormone (Gly36Asp), a mutation that disrupted a vital cystine knot motif and abrogated the heterodimerization and secretion of luteinizing hormone."
    explanation: A missense variant that prevents heterodimerization and secretion.
  - reference: PMID:29476300
    reference_title: Homozygous nonsense mutation Trp28X in the LHB gene causes male hypogonadism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The W28X mutation produces a truncated LHB peptide of seven amino acids, which prevents the synthesis of intact LH."
    explanation: A null allele, confirming that complete loss of LHB gives the disease.
  - reference: PMID:25637904
    reference_title: "[Pasqualini's syndrome: hypoandrogenism with spermatogenesis]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Different groups including ours demonstrated in these cases a LH with varying degrees of immunological activity but biologically inactive in most of the patients, due to one or more inactivating mutations in the LHB gene."
    explanation: >-
      Supports the loss of hormone activity bound on this node: LH made from mutant LHB alleles
      is biologically inactive even where it remains immunoreactive.
- name: Loss of Bioactive LH Secretion
  description: >-
    Gonadotrophs fail to release biologically active LH. Depending on the variant, LH is
    undetectable, low, or present by immunoassay but unable to activate its receptor. FSH
    synthesis and secretion are preserved. In transfected cells the p.Lys40del hormone and the
    p.Phe84Leu and p.Gly122Ser hormones still pair with the alpha subunit but are retained
    inside the cell.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: pituitary gonadotroph
    term:
      id: CL:0000438
      label: luteinizing hormone secreting cell
  biological_processes:
  - preferred_term: luteinizing hormone secretion
    modifier: DECREASED
    term:
      id: GO:0032275
      label: luteinizing hormone secretion
  downstream:
  - target: Leydig Cell Hypoplasia and Testosterone Deficiency
    description: >-
      LH is the trophic and steroidogenic signal for postnatal Leydig cells; without it they
      remain immature and testicular testosterone synthesis fails. Mouse Lhb knockouts show the
      same Leydig cell hypoplasia with intact FSH.
    causal_link_type: DIRECT
  - target: Failure of Ovulation and Luteinization
    description: >-
      FSH alone supports early follicle growth and some estradiol output, but the LH signal
      needed for ovulation and corpus luteum formation is missing.
    causal_link_type: DIRECT
  - target: Decreased Circulating LH
    description: The measurable form of the defect in the circulation.
    causal_link_type: DIRECT
  - target: Hypogonadotropic Hypogonadism
    description: >-
      Gonadal failure with an LH level that is low or inappropriately normal for the sex
      steroid deficit.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:17761593
    reference_title: Luteinizing hormone beta mutation and hypogonadism in men and women.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This mutation disrupts the splicing of messenger RNA (mRNA), generating a gross abnormality in the processing of the luteinizing hormone beta-subunit mRNA, which abrogates the secretion of luteinizing hormone."
    explanation: A splice variant that abolishes LH secretion.
  - reference: PMID:27656125
    reference_title: A vital region for human glycoprotein hormone trafficking revealed by an LHB mutation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Experiments in HeLa cells revealed that the mutant LH is retained intracellularly and showed diffuse cytoplasmic distribution. The mutated LHB heterodimerizes with the common alpha-subunit and can activate its receptor."
    explanation: >-
      The in-frame deletion yields a hormone that can assemble and signal but is not secreted,
      so the defect is in trafficking.
  - reference: PMID:39786527
    reference_title: Mechanism of female CHH caused by compound heterozygous mutations in the LHB gene.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These mutations do not impair the expression and dimerization of the alpha and beta subunits, but they do prevent the secretion of LH."
    explanation: A second pair of variants acting by blocked secretion rather than failed assembly.
  - reference: PMID:25637904
    reference_title: "[Pasqualini's syndrome: hypoandrogenism with spermatogenesis]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Different groups including ours demonstrated in these cases a LH with varying degrees of immunological activity but biologically inactive in most of the patients, due to one or more inactivating mutations in the LHB gene."
    explanation: >-
      Circulating LH can be immunoreactive yet biologically inactive, so the defect is in
      bioactivity and not always in measurable LH.
  - reference: PMID:15569941
    reference_title: "Targeted disruption of luteinizing hormone beta-subunit leads to hypogonadism, defects in gonadal steroidogenesis, and infertility."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "The defects in both sexes are not secondary to aberrant FSH regulation, because FSH levels were unaffected in null mice."
    explanation: In the mouse knockout the lesion is selective for LH; FSH is unaffected.
- name: Leydig Cell Hypoplasia and Testosterone Deficiency
  description: >-
    Without LH stimulation after birth, testicular Leydig cells stay undifferentiated and
    immature, testosterone synthesis is low, and the testes remain small. Prenatal male
    development is normal because placental hCG drives fetal Leydig cells through the same
    receptor. The Leydig cells keep their responsiveness to LH, which is why hCG restores
    testosterone production.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: Leydig cell
    term:
      id: CL:0000178
      label: Leydig cell
  biological_processes:
  - preferred_term: Leydig cell differentiation
    modifier: DECREASED
    term:
      id: GO:0033327
      label: Leydig cell differentiation
  - preferred_term: testosterone biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0061370
      label: testosterone biosynthetic process
  locations:
  - preferred_term: testis
    term:
      id: UBERON:0000473
      label: testis
  downstream:
  - target: Impaired Spermatogenesis
    description: >-
      Spermatogenesis needs intratesticular testosterone from Leydig cells in addition to FSH,
      so Leydig cell failure halts germ cell maturation.
    causal_link_type: DIRECT
  - target: Hypoplasia of the Leydig Cells
    description: The histological correlate of the node on testicular biopsy.
    causal_link_type: DIRECT
  - target: Decreased Serum Testosterone
    description: The direct biochemical output of failed Leydig cell steroidogenesis.
    causal_link_type: DIRECT
  - target: Delayed Puberty
    description: Pubertal virilization depends on testicular testosterone.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Eunuchoid Habitus
    description: >-
      Androgen deficiency through the age of epiphyseal closure leaves long limbs relative to
      the trunk.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Decreased Testicular Size
    description: Leydig cell hypoplasia and absent androgen-driven testicular growth.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:22723313
    reference_title: Hypogonadism in a patient with two novel mutations of the luteinizing hormone β-subunit gene expressed in a compound heterozygous form.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LH is essential for maturation of Leydig cells and thus steroidogenesis, puberty, and spermatogenesis in man."
    explanation: The authors' conclusion from an affected man, linking LH loss to Leydig cell failure and its consequences.
  - reference: PMID:25637904
    reference_title: "[Pasqualini's syndrome: hypoandrogenism with spermatogenesis]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "testis with normal spermatogenesis and full volume, with mature spermatozoa in a high proportion of seminiferous tubes and undifferentiated and immature Leydig cells"
    explanation: >-
      The original histological description of the syndrome: immature Leydig cells with
      variably preserved tubules.
  - reference: PMID:15569941
    reference_title: "Targeted disruption of luteinizing hormone beta-subunit leads to hypogonadism, defects in gonadal steroidogenesis, and infertility."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Mutant males have decreased testes size, prominent Leydig cell hypoplasia, defects in expression of genes encoding steroid biosynthesis pathway enzymes, and reduced testosterone levels."
    explanation: The mouse knockout reproduces the human testicular lesion.
- name: Impaired Spermatogenesis
  description: >-
    Germ cell maturation fails for lack of intratesticular testosterone, giving azoospermia in
    most genotyped men until they are treated. The degree depends on residual LH activity: a
    man with a hypomorphic LHB allele whose LH kept low partial activity had complete,
    quantitatively normal spermatogenesis despite absent virilization, because a few mature
    Leydig cells made enough intratesticular testosterone. This is the pattern of the eponymous
    "fertile eunuch". In Lhb-null mice spermatogenesis stops at the round spermatid.
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: spermatogenesis
    modifier: DECREASED
    term:
      id: GO:0007283
      label: spermatogenesis
  locations:
  - preferred_term: testis
    term:
      id: UBERON:0000473
      label: testis
  downstream:
  - target: Azoospermia
    description: The usual semen finding in untreated men.
    causal_link_type: DIRECT
  - target: Male Infertility
    description: Infertility follows from absent or very low sperm output.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:22723313
    reference_title: Hypogonadism in a patient with two novel mutations of the luteinizing hormone β-subunit gene expressed in a compound heterozygous form.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe the clinical features of a 31-yr-old man who presented with delayed puberty and azoospermia and was found to have hypogonadism associated with an absence of circulating LH."
    explanation: Azoospermia in a genotyped man.
  - reference: PMID:15569941
    reference_title: "Targeted disruption of luteinizing hormone beta-subunit leads to hypogonadism, defects in gonadal steroidogenesis, and infertility."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Furthermore, spermatogenesis is blocked at the round spermatid stage, causing a total absence of the elongated spermatids."
    explanation: The stage at which spermatogenesis stops when LH is absent, in the mouse model.
  - reference: PMID:19890128
    reference_title: Normal spermatogenesis in a man with mutant luteinizing hormone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Men with mutations in LHB, the gene encoding the beta subunit of luteinizing hormone (LHB), have azoospermia with absent or few fetal Leydig cells."
    explanation: The usual testicular outcome of LHB mutations in men, as summarized by the authors.
  - reference: PMID:19890128
    reference_title: Normal spermatogenesis in a man with mutant luteinizing hormone.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "He had complete spermatogenesis with a normal sperm count."
    explanation: >-
      An exception to impaired spermatogenesis: this man carried a hypomorphic allele, and the
      authors attribute his normal spermatogenesis to residual LH activity, so the node holds
      for complete loss of LH but not for every allele.
  - reference: PMID:19890128
    reference_title: Normal spermatogenesis in a man with mutant luteinizing hormone.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We concluded that the residual luteinizing hormone activity, resulting in the expression of steroidogenic enzymes in few mature Leydig cells producing small amounts of intratesticular testosterone (20.2 ng per gram), was sufficient for complete and quantitatively normal spermatogenesis."
    explanation: Ties the degree of spermatogenic failure to residual LH activity acting through Leydig cell testosterone.
- name: Failure of Ovulation and Luteinization
  description: >-
    In women, FSH-driven follicle growth and early to mid-follicular estradiol and progesterone
    levels are preserved, so breast development and menarche occur. Without LH the follicle
    does not ovulate and no corpus luteum forms, so ovulatory and luteal-phase hormone levels
    are never reached. The ovaries can be normal or enlarged with cysts.
  biological_scale: TISSUE
  cell_types:
  - preferred_term: theca cell
    term:
      id: CL:0000503
      label: theca cell
  - preferred_term: granulosa cell
    term:
      id: CL:0000501
      label: granulosa cell
  biological_processes:
  - preferred_term: ovulation
    modifier: DECREASED
    term:
      id: GO:0030728
      label: ovulation
  - preferred_term: luteinization
    modifier: DECREASED
    term:
      id: GO:0001553
      label: luteinization
  locations:
  - preferred_term: ovary
    term:
      id: UBERON:0000992
      label: ovary
  downstream:
  - target: Secondary Amenorrhea
    description: Anovulatory cycles after a spontaneous menarche.
    causal_link_type: DIRECT
  - target: Oligomenorrhea
    description: The milder menstrual presentation of the same anovulation.
    causal_link_type: DIRECT
  - target: Female Infertility
    description: No ovulation, so no conception without treatment.
    causal_link_type: DIRECT
  - target: Ovarian Cysts
    description: Follicles that grow under FSH but are not ovulated; the sources describe the finding without a mechanism.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:19129711
    reference_title: Inactivating mutations of luteinizing hormone beta-subunit or luteinizing hormone receptor cause oligo-amenorrhea and infertility in women.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Oestradiol and progesterone levels are normal for the early to midfollicular phase, but do not reach ovulatory or luteal phase levels, confirming lack of ovulation."
    explanation: Hormone profile in affected women showing anovulation with preserved early follicular function.
  - reference: PMID:15569941
    reference_title: "Targeted disruption of luteinizing hormone beta-subunit leads to hypogonadism, defects in gonadal steroidogenesis, and infertility."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Ovarian histology demonstrates normal thecal layer, defects in folliculogenesis including many degenerating antral follicles, and absence of corpora lutea."
    explanation: Absent corpora lutea in Lhb-null female mice, the tissue correlate of failed ovulation and luteinization.
phenotypes:
- name: Hypogonadotropic Hypogonadism
  category: Endocrine
  description: >-
    Gonadal failure from absent bioactive LH. The pattern is selective: LH is low,
    undetectable or bioinactive while FSH is normal or raised, unlike the low LH and low FSH of
    GnRH-deficiency forms.
  frequency: OBLIGATE
  phenotype_term:
    preferred_term: Hypogonadotropic hypogonadism
    term:
      id: HP:0000044
      label: Hypogonadotropic hypogonadism
  evidence:
  - reference: PMID:17761593
    reference_title: Luteinizing hormone beta mutation and hypogonadism in men and women.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Selective luteinizing hormone deficiency due to mutations in the luteinizing hormone beta-subunit gene (LHB) is a rare cause of hypogonadism."
    explanation: Hypogonadism is the defining feature in men and women.
  - reference: PMID:27656125
    reference_title: A vital region for human glycoprotein hormone trafficking revealed by an LHB mutation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Inactivating Luteinizing hormone beta (LHB) gene mutations are exceptionally rare and lead to hypogonadism that is particularly severe in males."
    explanation: Hypogonadism follows from inactivating LHB variants and is most severe in males.
- name: Decreased Circulating LH
  category: Endocrine
  description: >-
    Serum LH is low or undetectable in most patients. Some variants give immunoreactive but
    biologically inactive LH, so a normal-range immunoassay value does not exclude the
    disease.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Decreased circulating luteinizing hormone level
    term:
      id: HP:0030344
      label: Decreased circulating luteinizing hormone level
  evidence:
  - reference: PMID:15602022
    reference_title: Hypogonadism in a patient with a mutation in the luteinizing hormone beta-subunit gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A 30-year-old man who presented with delayed puberty and infertility was found to have hypogonadism associated with an absence of circulating luteinizing hormone."
    explanation: Absent circulating LH in a homozygous patient.
  - reference: PMID:35470463
    reference_title: "Luteinizing hormone β-subunit deficiency: Report of a novel LHB likely pathogenic variant and a systematic review of the published literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The typical phenotype in male patients with LHB deficiency is delayed puberty with low testosterone, low LH, and normal to high FSH"
    explanation: The systematic review's summary of the biochemical profile.
- name: Elevated Circulating FSH
  category: Endocrine
  description: >-
    FSH is normal or raised, because the FSH beta subunit and the common alpha subunit are
    intact. The dissociation between low LH and normal or high FSH is the biochemical clue to
    the diagnosis.
  phenotype_term:
    preferred_term: Elevated circulating follicle stimulating hormone level
    term:
      id: HP:0008232
      label: Elevated circulating follicle stimulating hormone level
  notes: >-
    Frequency is omitted because sources report FSH as "normal to high" in men and "normal or
    only slightly increased" in women without a proportion. No source read here explains the
    rise, so the phenotype is not wired to a mechanism node.
  evidence:
  - reference: PMID:35470463
    reference_title: "Luteinizing hormone β-subunit deficiency: Report of a novel LHB likely pathogenic variant and a systematic review of the published literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On evaluation, he had sexual maturity of Tanner's stage 3, low testosterone (0.23 ng/ml), low LH (0.44 mIU/ml), high follicle-stimulating hormone (FSH, 22.4 mIU/ml), and a novel homozygous missense likely pathogenic variant (p.Cys46Arg) in LHB."
    explanation: Raised FSH alongside low LH in a homozygous patient.
  - reference: PMID:19129711
    reference_title: Inactivating mutations of luteinizing hormone beta-subunit or luteinizing hormone receptor cause oligo-amenorrhea and infertility in women.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Notably, serum LH levels are low in patients with LHB mutations and high in those with LHCGR mutations, whereas follicle-stimulating hormone levels are normal or only slightly increased."
    explanation: In women FSH is normal or slightly increased, and low LH separates LHB from LHCGR defects.

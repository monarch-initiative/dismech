genetic:
- name: SMARCAL1
  gene_term:
    preferred_term: SMARCAL1
    term:
      id: hgnc:11102
      label: SMARCAL1
  relationship_type: CAUSATIVE
  association: >-
    Biallelic germline loss-of-function variants in SMARCAL1 cause SIOD;
    genotype tracks with severity — biallelic nonsense/frameshift/splicing
    genotypes cause severe disease, biallelic missense variants retaining
    partial function cause milder disease.
  notes: >-
    SMARCAL1 (HARP) encodes an SNF2-family ATP-driven annealing helicase.
    A Russian founder variant, c.2542G>T (p.E848*), accounted for 14 of 19
    genotyped patients in the largest single-centre series. Approximately half
    of patients referred with an SIOD-like phenotype have no detectable
    SMARCAL1 mutation, suggesting genetic heterogeneity of the broader
    phenotype.
  evidence:
  - reference: PMID:11799392
    reference_title: "Mutant chromatin remodeling protein SMARCAL1 causes Schimke immuno-osseous dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using genome-wide linkage mapping and a positional candidate approach, we determined that mutations in SMARCAL1 (SWI/SNF2-related, matrix-associated, actin-dependent regulator of chromatin, subfamily a-like 1), are responsible for SIOD."
    explanation: Establishes SMARCAL1 as the causative gene.
  - reference: PMID:11799392
    reference_title: "Mutant chromatin remodeling protein SMARCAL1 causes Schimke immuno-osseous dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "affected individuals from 13 of 23 families with severe disease had two alleles with nonsense, frameshift or splicing mutations, whereas affected individuals from 3 of 3 families with milder disease had a missense mutation on each allele"
    explanation: Documents the genotype-severity correlation.
  - reference: PMID:40004207
    reference_title: "Genetic and Clinical Features of Schimke Immuno-Osseous Dysplasia: Single-Centre Retrospective Study of 21 Unrelated Paediatric Patients over a Period of 20 Years."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the most common was c.2542G>T, resulting in premature translation termination (p.E848*), and it was found in 14 patients either in a homozygous (four patients) or compound-heterozygous (10 patients) state"
    explanation: Documents the recurrent founder truncating variant.
  - reference: PMID:20013129
    reference_title: "Schimke immunoosseous dysplasia: defining skeletal features."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biallelic mutations in swi/snf-related, matrix-associated, actin-dependent regulator of chromatin, subfamily a-like 1 (SMARCAL1) are the only identified cause of SIOD, but approximately half of patients referred for molecular studies do not have detectable mutations in SMARCAL1."
    explanation: >-
      SMARCAL1 is the only identified cause; a fraction of clinically similar
      patients remain unexplained.
treatments:
- name: Kidney transplantation
  description: >-
    Kidney transplantation is the therapy of choice for the end-stage renal
    failure of SIOD because FSGS does not recur in the graft; GeneReviews
    recommends transplantation with mild immunosuppressive therapy given the
    underlying immunodeficiency.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: kidney transplantation
    term:
      id: NCIT:C15265
      label: Kidney Transplantation
  target_mechanisms:
  - target: Podocyte Injury and Glomerulosclerosis
    treatment_effect: BYPASSES
    description: >-
      Transplantation replaces the sclerosed kidney rather than correcting the
      SMARCAL1 defect; because the podocytopathy is cell-autonomous, FSGS does
      not recur in the donor graft.
    evidence:
    - reference: PMID:18785907
      reference_title: "Improved outcome with immunosuppressive monotherapy after renal transplantation in Schimke-immuno-osseous dysplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Concerning ESRF, kidney transplantation is the therapy of choice since FSGS does not recur in the graft."
      explanation: >-
        Transplantation bypasses the intrinsic podocytopathy, and the disease
        does not recur in donor tissue.
  evidence:
  - reference: PMID:18785907
    reference_title: "Improved outcome with immunosuppressive monotherapy after renal transplantation in Schimke-immuno-osseous dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Concerning ESRF, kidney transplantation is the therapy of choice since FSGS does not recur in the graft."
    explanation: Establishes kidney transplantation as the therapy of choice.
  - reference: PMID:20301550
    reference_title: "Schimke Immunoosseous Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "renal transplantation as indicated using mild immunosuppressive therapy"
    explanation: GeneReviews management recommendation for renal transplantation.
- name: Minimized post-transplant immunosuppression
  description: >-
    Because of the underlying T-cell immunodeficiency, conventional
    combination immunosuppression after renal transplantation has led to
    severe disseminated cutaneous papillomavirus infections and
    EBV-associated lymphoproliferative disease; immunosuppressive monotherapy
    maintenance gives good graft outcomes with fewer severe infections, and
    limited immunosuppression appears possible without increased rejection
    risk.
  treatment_term:
    preferred_term: immunosuppressive therapy
    term:
      id: NCIT:C15261
      label: Immunosuppressive Therapy
  evidence:
  - reference: PMID:18785907
    reference_title: "Improved outcome with immunosuppressive monotherapy after renal transplantation in Schimke-immuno-osseous dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have found that post-renal transplantation immunosuppressive monotherapy results in a good outcome with a reduced number of severe infections."
    explanation: Supports monotherapy maintenance immunosuppression in SIOD.
  - reference: PMID:18785907
    reference_title: "Improved outcome with immunosuppressive monotherapy after renal transplantation in Schimke-immuno-osseous dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Under conventional immunosuppressive regimens some SIOD patients have developed severe disseminated cutaneous papilloma virus infections or EBV associated lymphoproliferative disease."
    explanation: >-
      Documents the infectious complications of conventional-intensity
      immunosuppression that motivate minimization.
- name: Hematopoietic stem cell transplantation
  description: >-
    HSCT is a potential definitive therapy for the T-cell immunodeficiency and
    bone marrow failure, but the historical experience is poor: only one of
    the first five transplanted patients survived, with the four deaths
    following myeloablative conditioning — a toxicity plausibly linked to the
    hypersensitivity of SMARCAL1-deficient cells to DNA-damaging agents.
    Reduced-intensity conditioning with alpha-beta T-cell-depleted
    haploidentical grafts underlies the more recent successes.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Thymic T-cell Development Failure
    treatment_effect: RESTORES
    description: >-
      Successful engraftment replaces the SMARCAL1-deficient hematopoietic
      compartment, restoring T-cell immunity; full donor chimerism has been
      achieved with reduced-intensity haploidentical protocols.
    evidence:
    - reference: PMID:35704481
      reference_title: "Sequential Stem Cell-Kidney Transplantation in Schimke Immuno-osseous Dysplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Full donor hematopoietic chimerism and functional ex vivo T-cell tolerance was achieved, and the patients continued to have normal renal function without immunosuppression at 22 to 34 months after kidney transplantation."
      explanation: >-
        Demonstrates full donor hematopoietic reconstitution in SIOD patients
        after reduced-intensity haploidentical HSCT.
  evidence:
  - reference: PMID:23950031
    reference_title: "Bone marrow transplantation in Schimke immuno-osseous dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We find that only one patient survived the transplantation procedure and that the existing indicators of a good prognosis for bone marrow transplantation were not predictive in this small cohort."
    explanation: >-
      Documents the very high procedure-related mortality of early BMT in
      SIOD, the stated caveat for this treatment.
  - reference: PMID:35704481
    reference_title: "Sequential Stem Cell-Kidney Transplantation in Schimke Immuno-osseous Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Previously, four of five patients with SIOD who underwent HSCT after myeloablative conditioning died from HSCT-related causes, including infections and GVHD"
    explanation: >-
      Attributes the historical HSCT deaths to myeloablative-conditioning-era
      protocols.
  - reference: PMID:20301550
    reference_title: "Schimke Immunoosseous Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hematopoietic stem cell transplantation as indicated"
    explanation: GeneReviews lists HSCT among management options as indicated.
- name: Sequential haploidentical HSCT and kidney transplantation
  description: >-
    Sequential transplantation of alpha-beta T-cell-depleted, CD19
    B-cell-depleted haploidentical hematopoietic stem cells followed by a
    kidney from the same donor established full donor chimerism and immune
    tolerance in three children with SIOD, who maintained normal renal
    function without any immunosuppression at 22 to 34 months — addressing the
    immunodeficiency and the renal failure with a single donor while
    eliminating post-transplant immunosuppression.
  treatment_term:
    preferred_term: sequential stem cell and kidney transplantation
    term:
      id: NCIT:C15289
      label: Organ Transplantation
  target_mechanisms:
  - target: Thymic T-cell Development Failure
    treatment_effect: RESTORES
    description: >-
      The haploidentical HSCT arm replaces the defective hematopoietic and
      immune compartment.
    evidence:
    - reference: PMID:35704481
      reference_title: "Sequential Stem Cell-Kidney Transplantation in Schimke Immuno-osseous Dysplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Full donor hematopoietic chimerism and functional ex vivo T-cell tolerance was achieved, and the patients continued to have normal renal function without immunosuppression at 22 to 34 months after kidney transplantation."
      explanation: >-
        Documents immune reconstitution with donor chimerism and tolerance.
  - target: Podocyte Injury and Glomerulosclerosis
    treatment_effect: BYPASSES
    description: >-
      The same-donor kidney replaces the failed organ, and the induced
      tolerance removes the need for maintenance immunosuppression.
    evidence:
    - reference: PMID:35704481
      reference_title: "Sequential Stem Cell-Kidney Transplantation in Schimke Immuno-osseous Dysplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Each patient received sequential transplants of αβ T-cell-depleted and CD19 B-cell-depleted haploidentical hematopoietic stem cells and a kidney from the same donor."
      explanation: >-
        Describes the sequential same-donor stem cell and kidney
        transplantation strategy.
  evidence:
  - reference: PMID:35704481
    reference_title: "Sequential Stem Cell-Kidney Transplantation in Schimke Immuno-osseous Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Full donor hematopoietic chimerism and functional ex vivo T-cell tolerance was achieved, and the patients continued to have normal renal function without immunosuppression at 22 to 34 months after kidney transplantation."
    explanation: >-
      Reports the immunosuppression-free outcome of sequential stem
      cell-kidney transplantation in three SIOD patients.
- name: Supportive and preventive management
  description: >-
    Multidisciplinary supportive care includes acyclovir for recurrent
    herpetic infections, imiquimod and cidofovir for severe disseminated
    cutaneous papillomavirus infections, G-CSF or GM-CSF for neutropenia,
    levothyroxine for hypothyroidism, agents that improve blood flow or reduce
    coagulability for ischemic events, and blood-pressure control.
    Live-attenuated vaccines should be avoided in T-cell-deficient patients;
    hypertension, heat, stress, and sleep deprivation can precipitate
    neurovascular events; and DNA-damaging anti-cancer therapies must be used
    with caution given the genotoxic hypersensitivity.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:20301550
    reference_title: "Schimke Immunoosseous Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "acyclovir for recurrent herpetic infections and/or shingles; imiquimod and cidofovir for severe disseminated cutaneous papilloma virus infections"
    explanation: GeneReviews anti-infective supportive measures.
  - reference: PMID:20301550
    reference_title: "Schimke Immunoosseous Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Avoid hypertension; heat, stress, and lack of sleep; and live attenuated immunizations in those who are T cell deficient. Use DNA-damaging anti-cancer therapies with caution due to evidence of susceptibility to genotoxic agents."
    explanation: >-
      GeneReviews agents/circumstances to avoid, including the genotoxic
      caution that follows from the replication-stress mechanism.
diagnosis:
- name: Clinical, laboratory, and radiographic diagnosis with molecular confirmation
  description: >-
    The diagnosis is established in a proband with the characteristic
    combination of spondyloepiphyseal dysplasia, progressive steroid-resistant
    nephropathy, and T-cell deficiency — clinical, laboratory, and radiographic
    features — and/or biallelic pathogenic SMARCAL1 variants on molecular
    genetic testing. Molecular confirmation matters because a fraction of
    clinically typical cases have no detectable SMARCAL1 variant.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770

name: Schimke immuno-osseous dysplasia
creation_date: "2026-08-29T00:00:00Z"
category: Genetic
description: >-
  Schimke immuno-osseous dysplasia (SIOD) is an ultra-rare autosomal recessive
  pleiotropic disorder caused by biallelic loss-of-function variants in
  SMARCAL1, which encodes an ATP-driven annealing helicase that stabilizes and
  restarts stalled replication forks. Loss of this genome-maintenance activity
  produces replication stress and DNA-damage accumulation that preferentially
  injures highly proliferative and replication-stress-sensitive compartments:
  growth-plate chondrocytes (spondyloepiphyseal dysplasia with disproportionate
  short-trunk short stature), podocytes (steroid-resistant nephrotic syndrome
  from focal segmental glomerulosclerosis progressing to end-stage renal
  disease), thymocytes and T cells (T-cell lymphopenia with IL7R promoter
  hypermethylation and recurrent, sometimes opportunistic, infections), and the
  vasculature (defective elastogenesis with premature arteriosclerosis and
  cerebral ischemic events). Additional features include hyperpigmented
  macules, an unusual facies, hypothyroidism, cytopenias and bone marrow
  failure, migraine-like headaches, and a predisposition to non-Hodgkin
  lymphoma. The disease spans a spectrum from a severe infantile-onset form
  that is usually lethal in childhood to a milder later-onset form compatible
  with survival into adulthood when renal disease is treated; disease severity
  correlates inversely with residual SMARCAL1 activity. Kidney transplantation
  (FSGS does not recur in the graft) with minimized immunosuppression is the
  mainstay for renal failure; conventional myeloablative HSCT has carried very
  high mortality, attributed to the hypersensitivity of SMARCAL1-deficient
  cells to genotoxic agents, while sequential reduced-intensity haploidentical
  HSCT and kidney transplantation from the same donor has achieved
  immunosuppression-free renal function in early reports.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of SIOD is established in a proband with the characteristic clinical, laboratory, and radiographic features and/or biallelic pathogenic variants in SMARCAL1 identified on molecular genetic testing."
    explanation: >-

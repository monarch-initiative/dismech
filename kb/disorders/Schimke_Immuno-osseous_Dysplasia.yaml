  - reference: PMID:22998683
    reference_title: "Reduced elastogenesis: a clue to the arteriosclerosis and emphysematous changes in Schimke immuno-osseous dysplasia?"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The arteriosclerosis was characterized by intimal and medial hyperplasia, smooth muscle cell hyperplasia and fragmented and disorganized elastin fibers, and the pulmonary disease was characterized by panlobular enlargement of air spaces."
    explanation: >-
      Histopathological definition of the vascular and pulmonary lesions.
  - reference: PMID:22998683
    reference_title: "Reduced elastogenesis: a clue to the arteriosclerosis and emphysematous changes in Schimke immuno-osseous dysplasia?"
    supports: SUPPORT

  - reference: PMID:10653321
    reference_title: "Manifestations and treatment of Schimke immuno-osseous dysplasia: 14 new cases and a review of the literature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We emphasize the high incidence of cerebral ischaemia and ocular abnormalities, define the high incidence of thyroid dysfunction and blood cytopenia, and confirm the absence of effective and durable medical therapies."
    explanation: Documents the high incidence of blood cytopenias.

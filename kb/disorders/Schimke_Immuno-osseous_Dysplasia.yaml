progression:
- phase: Severe infantile-onset form
  age_range: In utero / infantile onset; death usually within the first two decades
  notes: >-
    The severe end of the spectrum presents in utero or in infancy, is usually
    associated with biallelic nonsense, frameshift, or splicing SMARCAL1
    variants, and carries a high risk of death in childhood from infection,
    stroke, renal failure, or cardiopulmonary complications; the mean age of
    death across reported patients is about 10.8-11 years.
  evidence:
  - reference: PMID:20301550
    reference_title: "Schimke Immunoosseous Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SIOD involves a spectrum that ranges from an infantile or severe early-onset form with a greater risk of death during childhood to a juvenile or milder later-onset form with likely survival into adulthood if renal disease is appropriately treated."
    explanation: >-
      GeneReviews defines the severe early-onset end of the SIOD spectrum.
  - reference: PMID:23950031
    reference_title: "Bone marrow transplantation in Schimke immuno-osseous dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Individuals affected with SIOD usually die within the first two decades of life from infections (23%), stroke (17%), renal failure (15%), pulmonary hypertension and congestive heart failure (15%), complications of organ transplantation (9%), complications of lymphoproliferative disease (9%), gastrointestinal bleeding (6%), bone marrow failure (3%), and unspecified acute restrictive lung disease (3%)"
    explanation: >-
      Documents the early mortality and its cause-of-death distribution in
      SIOD.
  - reference: PMID:22888040
    reference_title: "SMARCAL1 deficiency predisposes to non-Hodgkin lymphoma and hypersensitivity to genotoxic agents in vivo."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean age of death among SIOD patients is 10.8 years (range: 3-28 years)."
    explanation: Quantifies the mean age of death across reported patients.
- phase: Milder later-onset form
  age_range: Juvenile onset; survival into adulthood possible
  notes: >-
    The milder end of the spectrum, typically associated with biallelic
    missense variants retaining partial SMARCAL1 function, presents later and
    is compatible with survival into adulthood when the renal disease is
    appropriately treated; survival beyond 20 years is reported.
  evidence:
  - reference: PMID:20301550
    reference_title: "Schimke Immunoosseous Dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SIOD involves a spectrum that ranges from an infantile or severe early-onset form with a greater risk of death during childhood to a juvenile or milder later-onset form with likely survival into adulthood if renal disease is appropriately treated."
    explanation: GeneReviews defines the milder later-onset end of the spectrum.
  - reference: PMID:40004207
    reference_title: "Genetic and Clinical Features of Schimke Immuno-Osseous Dysplasia: Single-Centre Retrospective Study of 21 Unrelated Paediatric Patients over a Period of 20 Years."

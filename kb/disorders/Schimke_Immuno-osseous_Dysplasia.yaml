      label: T cell differentiation in thymus
    modifier: DECREASED
  - preferred_term: T cell homeostasis
    term:
      id: GO:0043029
      label: T cell homeostasis
    modifier: DECREASED
  evidence:
  - reference: PMID:26499378
    reference_title: "Lack of IL7Rα expression in T cells is a hallmark of T-cell immunodeficiency in Schimke immuno-osseous dysplasia (SIOD)."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we demonstrate that the T cells of SIOD patients have undetectable levels of protein and mRNA for the IL-7 receptor alpha chain (IL7Rα) and are unresponsive to stimulation with IL-7, indicating a loss of functional receptor."
    explanation: >-
      Documents the loss of functional IL-7 receptor on SIOD T cells.

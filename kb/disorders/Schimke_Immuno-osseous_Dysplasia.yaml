- name: Defective Elastogenesis and Premature Arteriosclerosis
  biological_scale: TISSUE
  description: >-
    Reduced elastin expression in aorta and lung, with altered expression of
    regulators of elastin gene expression, produces an arteriosclerosis
    characterized by intimal and medial hyperplasia, smooth muscle cell
    hyperplasia and fragmented, disorganized elastin fibers, and an
    emphysema-like panlobular enlargement of air spaces. Vascular disease —
    including premature atherosclerosis and cerebral vaso-occlusion — is a
    major cause of morbidity and mortality.
  cell_types:
  - preferred_term: vascular smooth muscle cell
    term:
      id: CL:0000192
      label: smooth muscle cell
  biological_processes:

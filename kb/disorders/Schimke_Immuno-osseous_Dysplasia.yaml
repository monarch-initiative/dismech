    evidence_source: HUMAN_CLINICAL
    snippet: "whereas some patients develop a severe form of the disease with in utero onset, individuals with mild cases of SIOD might survive into adulthood, and cases of survival for more than 20 years have been reported"
    explanation: Documents survival into adulthood at the mild end of the spectrum.
  - reference: PMID:11799392
    reference_title: "Mutant chromatin remodeling protein SMARCAL1 causes Schimke immuno-osseous dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These observations indicate that some missense mutations allow retention of partial SMARCAL1 function and thus cause milder disease."
    explanation: >-
      Links the milder course to missense alleles retaining partial SMARCAL1
      function.
pathophysiology:
- name: SMARCAL1 Annealing Helicase Deficiency
  biological_scale: MOLECULAR
  description: >-
    Biallelic loss-of-function SMARCAL1 variants abolish or reduce the
    SMARCAL1 (HARP) protein, an SNF2-family ATP-driven annealing helicase that
    rewinds RPA-stabilized single-stranded DNA bubbles at replication forks.
    Disease-associated mutations impair SMARCAL1 expression, stability,
    chromatin binding, and ATPase/annealing activity, and residual overall
    SMARCAL1 activity is inversely proportional to disease severity.
  genetic_context:
    gene:
      preferred_term: SMARCAL1
      term:
        id: hgnc:11102
        label: SMARCAL1
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic germline loss-of-function variants; nonsense/frameshift/splice
      genotypes cause severe disease, whereas biallelic missense variants
      retaining partial function cause milder disease.
  molecular_functions:
  - preferred_term: annealing helicase activity
    term:
      id: GO:0036310
      label: ATP-dependent DNA/DNA annealing activity
    modifier: DECREASED
  evidence:
  - reference: PMID:11799392
    reference_title: "Mutant chromatin remodeling protein SMARCAL1 causes Schimke immuno-osseous dysplasia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Using genome-wide linkage mapping and a positional candidate approach, we determined that mutations in SMARCAL1 (SWI/SNF2-related, matrix-associated, actin-dependent regulator of chromatin, subfamily a-like 1), are responsible for SIOD."
    explanation: Identifies SMARCAL1 mutations as the cause of SIOD.
  - reference: PMID:18974355
    reference_title: "HARP is an ATP-driven annealing helicase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We found that HARP is an ATP-dependent annealing helicase that rewinds single-stranded DNA bubbles that are stably bound by replication protein A."
    explanation: >-
      Defines the molecular activity of SMARCAL1/HARP that is lost in SIOD.
  - reference: PMID:18974355
    reference_title: "HARP is an ATP-driven annealing helicase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Analysis of mutant HARP proteins suggests that SIOD is caused by a deficiency in annealing helicase activity."
    explanation: >-
      Attributes SIOD to deficient annealing helicase activity of the mutant
      proteins.
  - reference: PMID:18805831
    reference_title: "Schimke immuno-osseous dysplasia: SMARCAL1 loss-of-function and phenotypic correlation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The SIOD associated SMARCAL1 mutations affected SMARCAL1 protein expression, stability, subcellular localisation, chromatin binding, and enzymatic activity."
    explanation: >-
      Documents the multiple molecular defects produced by SIOD-associated
      SMARCAL1 mutations.
  - reference: PMID:18805831
    reference_title: "Schimke immuno-osseous dysplasia: SMARCAL1 loss-of-function and phenotypic correlation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Further, expressing SMARCAL1 missense mutants in Drosophila melanogaster showed that disease severity was inversely proportionate to overall SMARCAL1 activity."
    explanation: >-
      In vivo Drosophila assay showing residual SMARCAL1 activity tracks
      inversely with disease severity.
  downstream:
  - target: Replication Stress and Genome Instability
    causal_link_type: DIRECT
    description: >-
      Loss of the annealing helicase removes a replication stress response
      protein that maintains genome integrity at stalled replication forks,
      producing replication-associated DNA damage.
    evidence:
    - reference: PMID:19793861
      reference_title: "The annealing helicase SMARCAL1 maintains genome integrity at stalled replication forks."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Thus, SMARCAL1 is a replication stress response protein, and the pleiotropic phenotypes of SIOD are at least partly due to defects in genome maintenance during DNA replication."
      explanation: >-
        Directly links SMARCAL1 loss to defective genome maintenance during
        replication as the proximate disease mechanism.
  - target: Defective Elastogenesis and Premature Arteriosclerosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      SMARCAL1 is expressed in arterial and lung tissue, and SMARCAL1-deficient
      aorta and lung show reduced elastin expression with altered expression of
      elastin-gene regulators; the intermediate steps from SMARCAL1 loss to the
      transcriptional deficit are not established.
    evidence:
    - reference: PMID:22998683
      reference_title: "Reduced elastogenesis: a clue to the arteriosclerosis and emphysematous changes in Schimke immuno-osseous dysplasia?"
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Consistent with a cell autonomous disorder, SMARCAL1 was expressed in arterial and lung tissue, and both the aorta and lung of SIOD patients had reduced expression of elastin and alterations in the expression of regulators of elastin gene expression."
      explanation: >-
        Connects SMARCAL1 deficiency in vascular tissue to reduced elastin
        expression.
- name: Replication Stress and Genome Instability
  biological_scale: CELLULAR
  description: >-
    SMARCAL1-deficient cells activate the DNA damage response during S phase
    without exogenous genotoxins, show slower replication fork recovery and
    delayed mitotic entry after S-phase arrest, and are hypersensitive to
    replication stress and DNA-damaging agents in vitro and in vivo. This
    replication stress preferentially compromises highly proliferative
    compartments (growth plate, glomerulus, thymus/lymphocytes, marrow) and
    underlies the hypersensitivity to genotoxic therapies observed clinically.
  biological_processes:
  - preferred_term: replication fork processing
    term:
      id: GO:0031297
      label: replication fork processing
    modifier: DECREASED
  - preferred_term: DNA damage response
    term:
      id: GO:0006974
      label: DNA damage response
    modifier: INCREASED
  evidence:
  - reference: PMID:19793861
    reference_title: "The annealing helicase SMARCAL1 maintains genome integrity at stalled replication forks."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, SMARCAL1-deficient cells are hypersensitive to replication stress agents."
    explanation: >-
      Documents replication-stress hypersensitivity of SMARCAL1-deficient
      cells.
  - reference: PMID:19793862
    reference_title: "The SIOD disorder protein SMARCAL1 is an RPA-interacting protein involved in replication fork restart."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SMARCAL1-depleted cells display sensitivity to DNA-damaging agents that induce replication fork collapse, and exhibit slower fork recovery and delayed entry into mitosis following S-phase arrest."
    explanation: >-
      Documents defective replication fork recovery in SMARCAL1-deficient
      cells.
  - reference: PMID:22888040
    reference_title: "SMARCAL1 deficiency predisposes to non-Hodgkin lymphoma and hypersensitivity to genotoxic agents in vivo."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We did not find evidence of defective NER or NHEJ; however, Smarcal1-deficient mice were hypersensitive to several genotoxic agents."
    explanation: >-
      Confirms in vivo hypersensitivity of Smarcal1-deficient mice to
      genotoxic agents.
  - reference: PMID:25319549
    reference_title: "Insights into the renal pathogenesis in Schimke immuno-osseous dysplasia: A renal histological characterization and expression analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In renal biopsies from SIOD patients, TUNEL analysis detected marked increases in DNA fragmentation."
    explanation: >-
      Demonstrates DNA damage accumulation in affected patient tissue.
  downstream:
  - target: Impaired Chondrogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Replication stress compromises proliferating growth-plate chondrocytes;
      genotoxic agents reproduce growth-plate chondrocyte loss in
      Smarcal1-deficient mice.
    evidence:
    - reference: PMID:22888040
      reference_title: "SMARCAL1 deficiency predisposes to non-Hodgkin lymphoma and hypersensitivity to genotoxic agents in vivo."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Also, CPT-11, etoposide, and HU caused decreased growth and loss of growth plate chondrocytes."
      explanation: >-
        Genotoxic stress in Smarcal1-deficient mice produces growth-plate
        chondrocyte loss and decreased growth, linking replication stress to
        the skeletal arm.
  - target: Podocyte Injury and Glomerulosclerosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Genomic instability in the developing and mature kidney, evidenced by
      markedly increased DNA fragmentation in patient renal biopsies, is
      proposed to drive the podocytopathy.
    evidence:
    - reference: PMID:25319549
      reference_title: "Insights into the renal pathogenesis in Schimke immuno-osseous dysplasia: A renal histological characterization and expression analysis."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Further, we suggest that disruptions in genomic integrity during fetal kidney development contribute to the pathogenesis of FSGS in SIOD patients."
      explanation: >-
        Proposes genomic-integrity disruption as the driver of FSGS in SIOD
        kidneys.
  - target: Thymic T-cell Development Failure
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Replication and DNA-damage stress in thymocytes and T cells, together
      with epigenetic silencing of IL7R, restricts T-cell production; patient T
      cells show markedly increased apoptosis after DNA damage.
    evidence:
    - reference: PMID:39153074
      reference_title: "Profound T Lymphocyte and DNA Repair Defect Characterizes Schimke Immuno-Osseous Dysplasia."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "UV light irradiation caused a severe increase in the apoptosis of T cells"
      explanation: >-
        Patient T cells are hypersensitive to DNA damage, linking the
        genome-maintenance defect to the T-cell compartment.
  - target: Non-Hodgkin lymphoma
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Genome instability predisposes to malignancy; NHL is the most commonly
      reported cancer in SIOD cohorts.
    evidence:
    - reference: PMID:22888040
      reference_title: "SMARCAL1 deficiency predisposes to non-Hodgkin lymphoma and hypersensitivity to genotoxic agents in vivo."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL

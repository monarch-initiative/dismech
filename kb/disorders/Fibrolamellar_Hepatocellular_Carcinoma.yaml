      label: Weight loss

- category: Hepatic
  name: Hepatomegaly
  description: Liver enlargement from tumour bulk.
  phenotype_term:
    preferred_term: Hepatomegaly
    term:
      id: HP:0002240
      label: Hepatomegaly

- category: Laboratory
  name: Normal Serum Alpha-Fetoprotein
  description: >-
    Alpha-fetoprotein is characteristically normal, unlike in conventional
    hepatocellular carcinoma. Curated because its *absence* is the
    discriminating observation - a normal AFP in a young patient with a liver
    mass argues for this diagnosis rather than against a tumour.
  phenotype_term:
    preferred_term: Elevated circulating alpha-fetoprotein concentration
    term:
      id: HP:0006254
      label: Elevated circulating alpha-fetoprotein concentration
  evidence:
  - reference: PMID:24578576
    reference_title: "Detection of a recurrent DNAJB1-PRKACA chimeric transcript in fibrolamellar hepatocellular carcinoma."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients have normal levels of alpha fetoprotein without underlying liver disease or history of viral hepatitis"
    explanation: >-
      Graded REFUTE against the bound HP term, which names *elevated* AFP. The
      finding in this disease is a normal value, and the evidence direction
      records that rather than letting the term imply the opposite.

- category: Constitutional
  name: Abdominal Distension
  description: >-
    Abdominal distension or fullness, one of the vague presenting complaints
    that delays recognition of the tumour.
  phenotype_term:
    preferred_term: Abdominal distention
    term:
      id: HP:0003270
      label: Abdominal distention
  evidence:
  - reference: PMID:41178855
    reference_title: "Fibrolamellar hepatocellular carcinoma: Advances, challenges and opportunities in a rare malignancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Presenting symptoms are often vague and include nonspecific abdominal pain, nausea, abdominal distension or fullness, constitutional symptoms such as malaise, and unintentional weight loss."
    explanation: >-
      Lists abdominal distension among the presenting symptoms. Quoted from a
      narrative review of the clinical series; no frequency is attached because
      the source gives none.

- category: Hepatic
  name: Jaundice
  description: >-
    Obstructive jaundice, found on examination in a minority of patients and
    not part of the typical presentation.
  phenotype_term:
    preferred_term: Jaundice
    term:
      id: HP:0000952
      label: Jaundice
  evidence:
  - reference: PMID:41178855
    reference_title: "Fibrolamellar hepatocellular carcinoma: Advances, challenges and opportunities in a rare malignancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On physical examination, patients may exhibit hepatomegaly or a palpable abdominal mass, which may be associated with or without right upper quadrant tenderness and obstructive jaundice."
    explanation: >-
      Names obstructive jaundice as an examination finding, qualified as
      variable in the source itself.

- category: Endocrine
  name: Gynecomastia
  description: >-
    Gynecomastia in male patients, listed among the less frequent findings.
  phenotype_term:
    preferred_term: Gynecomastia
    term:
      id: HP:0000771
      label: Gynecomastia
  evidence:
  - reference: PMID:41178855
    reference_title: "Fibrolamellar hepatocellular carcinoma: Advances, challenges and opportunities in a rare malignancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Less frequent but notable clinical findings include gynecomastia in males, fulminant hepatic failure, recurrent episodes of deep vein thrombosis, hepatic encephalopathy, thrombophlebitis of the lower extremities, anemia, ascites, and hypoglycemia"
    explanation: >-
      Places gynecomastia explicitly in the less-frequent tier, which is how
      this phenotype is curated.

histopathology:
- name: Lamellar Fibrous Bands
  description: >-
    Parallel collagen bands encircling nests of tumour cells, the feature the
    disease is named for.
  finding_term:
    preferred_term: lamellar fibrous bands
  diagnostic: true

- name: Large Eosinophilic Mitochondria-Rich Polygonal Cells
  description: >-
    Large polygonal tumour cells with granular eosinophilic, mitochondria-rich
    cytoplasm.
  finding_term:
    preferred_term: large polygonal cells with granular eosinophilic cytoplasm
  evidence:
  - reference: PMID:28923495
    reference_title: "CRISPR/Cas9 Engineering of Adult Mouse Liver Demonstrates That the Dnajb1-Prkaca Gene Fusion Is Sufficient to Induce Tumors Resembling Fibrolamellar Hepatocellular Carcinoma."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "large polygonal cells with granular, eosinophilic, and mitochondria-rich cytoplasm, prominent nucleoli, and markers of hepatocytes and cholangiocytes"
    explanation: >-
      Describes the cytology this finding records, quoted from the mouse-model
      paper's description of tumours reproducing the human histology.

diagnosis:
- name: DNAJB1-PRKACA Fusion Detection
  description: >-
    RT-PCR, FISH for PRKACA rearrangement, or RNA in situ hybridisation. The
    fusion is the diagnostic test because it is both near-universal in this
    tumour and absent from the tumours that mimic it - including scirrhous
    hepatocellular carcinoma, the closest histologic mimic.
  evidence:
  - reference: PMID:25698061
    reference_title: "DNAJB1-PRKACA is specific for fibrolamellar carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the DNAJB1-PRKACA fusion transcript was found in all fibrolamellar carcinomas but not in other tumor types"
    explanation: >-
      The specificity result across 106 liver tumours that makes fusion
      detection diagnostic rather than merely supportive.
  - reference: PMID:25698061
    reference_title: "DNAJB1-PRKACA is specific for fibrolamellar carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rearrangements of the PRKACA locus was seen in all 19 fibrolamellar carcinoma specimens, but in none of the scirrhous hepatocellular carcinomas."
    explanation: >-
      Separates the tumour from its closest histologic mimic, which is the
      discrimination the test is used for.
  - reference: PMID:31676785
    reference_title: "DNAJB1-PRKACA fusions occur in oncocytic pancreatic and biliary neoplasms and are not specific for fibrolamellar hepatocellular carcinoma."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data prove that DNAJB1-PRKACA fusion is neither exclusive nor diagnostic for fibrolamellar hepatocellular carcinoma, and caution should be exercised in diagnosing liver tumors with DNAJB1-PRKACA fusions as fibrolamellar hepatocellular carcinoma, particularly if a pancreatic lesion is present."
    explanation: >-
      Graded REFUTE against an unqualified reading of this test as diagnostic.
      A Memorial Sloan Kettering series found the same fusion in six oncocytic
      pancreatobiliary neoplasms, so the specificity established above holds
      across liver tumours but not across all anatomic sites. The two items are
      not in conflict - they were asked in different populations - and both are
      kept.

- name: Cross-Sectional Imaging - Central Stellate Scar with Calcification
  description: >-
    A large hypervascular hepatic mass with a central non-enhancing stellate
    scar, usually containing calcification. The combination is the practical
    imaging signature and is what first raises the diagnosis in a young patient
    with a normal alpha-fetoprotein.
  evidence:
  - reference: PMID:29948061
    reference_title: "Fibrolamellar hepatocellular carcinoma: multiphasic CT features of the primary tumor on pre-therapy CT and pattern of distant metastases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Central stellate scar was present in 73% (24/33). In FLHCC having central stellate scar, calcification within the central scar was seen in 88% (21/24)."
    explanation: >-
      The frequencies from a 33-patient multiphasic CT series: the scar in
      about three quarters of tumours, and calcification within it in most of
      those that have one.
  - reference: PMID:29948061
    reference_title: "Fibrolamellar hepatocellular carcinoma: multiphasic CT features of the primary tumor on pre-therapy CT and pattern of distant metastases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Central stellate scar with internal calcification is a useful imaging feature that can help in the diagnosis of FLHCC."
    explanation: The series' own statement that this combination is diagnostically useful.
  - reference: PMID:41178855
    reference_title: "Fibrolamellar hepatocellular carcinoma: Advances, challenges and opportunities in a rare malignancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A central stellate scar is present in approximately 65%-70% of cases, and calcifications - often located within this scar - are observed in 40%-68% of patients."
    explanation: >-
      A second, wider set of figures for the same two features. Curated
      alongside the CT series rather than merged with it - 65-70% and 73% are
      different populations, not a disagreement to average away.

- name: CK7 and CD68 Immunohistochemistry
  description: >-
    Co-expression of cytokeratin 7 and CD68 on the tumour cells, which with
    compatible morphology is treated as diagnostic. Neither marker alone is
    specific; the pair is the useful test, and CD68 is what separates this
    tumour from its closest histologic mimic.
  evidence:
  - reference: PMID:26712049
    reference_title: "Fibrolamellar carcinoma versus scirrhous hepatocellular carcinoma : diagnostic usefulness of CD68."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Immunohistochemically, all cases were positive for CK7 and for CD68 (n=4)."
    explanation: The staining result in every case of the series, for both markers.
  - reference: PMID:26712049
    reference_title: "Fibrolamellar carcinoma versus scirrhous hepatocellular carcinoma : diagnostic usefulness of CD68."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CD68 immunostaining is a sensitive marker for FL-HCC that may be of use in routine diagnostic surgical pathology. Lack of CD68 staining should suggest caution in making a diagnosis of FL-HCC."
    explanation: >-
      States the test's sensitivity claim and, importantly, how a negative
      result should be read.
  - reference: PMID:35803261
    reference_title: "Human liver organoids for disease modeling of fibrolamellar carcinoma."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "when used in conjunction, along with compatible morphology, co-expression of CK7 and CD68 is diagnostic of FLC"
    explanation: >-
      States the conjunction requirement explicitly - it is the co-expression
      plus morphology that is diagnostic, not either stain on its own.
  - reference: PMID:41178855
    reference_title: "Fibrolamellar hepatocellular carcinoma: Advances, challenges and opportunities in a rare malignancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FLHCC is distinguished by consistent positivity for cytokeratin 7 and epithelial membrane antigen, suggesting a dual lineage with features of both hepatocytes and cholangiocytes"
    explanation: >-
      Adds the interpretation the CK7 result carries - a dual hepatocyte and
      cholangiocyte lineage signature rather than a simple hepatocellular one.

differential_diagnoses:
- name: Scirrhous Hepatocellular Carcinoma
  description: >-
    The closest histologic mimic, sharing a fibrous stroma. PRKACA
    rearrangement testing separates them cleanly.
  evidence:
  - reference: PMID:25698061
    reference_title: "DNAJB1-PRKACA is specific for fibrolamellar carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FISH was tested in 19 fibrolamellar carcinomas and in 6 scirrhous hepatocellular carcinomas, which can closely mimic fibrolamellar carcinoma."
    explanation: Names the mimic and the assay used to distinguish it.

- name: Conventional Hepatocellular Carcinoma
  description: >-
    Distinguished by patient age, absent cirrhosis and risk factors, normal
    alpha-fetoprotein, and a genomic landscape that whole-genome sequencing
    shows to be different.
  evidence:
  - reference: PMID:25605237
    reference_title: "The genomic landscape of fibrolamellar hepatocellular carcinoma: whole genome sequencing of ten patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutations, altered pathways and structural variants that characterized fibrolamellar hepatocellular carcinoma were distinct from those in hepatocellular carcinoma, further defining it as a distinct carcinoma."
    explanation: >-
      The genomic argument that this is a separate entity rather than an HCC
      variant - the basis for curating it as its own entry.

- name: Focal Nodular Hyperplasia
  description: >-
    The benign lesion this tumour is most often mistaken for on imaging,
    because both carry a central scar. The error matters in a specific
    direction: patients under surveillance for a presumed focal nodular
    hyperplasia have presented later with advanced fibrolamellar carcinoma. The
    scar's T2 signal and the presence of calcification are what separate them.
  evidence:
  - reference: PMID:32397993
    reference_title: "Clinical features and surgical outcomes of fibrolamellar hepatocellular carcinoma: retrospective analysis of a single-center experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to some radiomorphological similarities with focal nodular hyperplasia (FNH) (both may present with a stellate central scar), FL-HCC can be misinterpreted as FNH"
    explanation: Names the shared feature and states the direction of the misdiagnosis.
  - reference: PMID:41178855
    reference_title: "Fibrolamellar hepatocellular carcinoma: Advances, challenges and opportunities in a rare malignancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The fibrous stroma within the tumor, particularly the central scar, is hypointense on both T1- and T2-weighted images - unlike in focal nodular hyperplasia, where the scar is usually hyperintense on T2."
    explanation: >-
      The MRI feature that discriminates them: the scar is T2-hypointense here
      and T2-hyperintense in focal nodular hyperplasia.

genetic:
- name: DNAJB1-PRKACA
  gene_term:
    preferred_term: PRKACA
    term:
      id: hgnc:9380
      label: PRKACA
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  frequency: present in essentially all fibrolamellar carcinomas; 15/15 in the founding series
  notes: >-
    Curated as a structural fusion rather than a sequence variant. `gene_term`
    carries PRKACA because the slot is single-valued and the catalytic activity
    resides there; DNAJB1 (hgnc:5270) contributes the amino-terminal
    chaperone-binding domain and is bound on the pathophysiology node.
  evidence:
  - reference: PMID:24578576
    reference_title: "Detection of a recurrent DNAJB1-PRKACA chimeric transcript in fibrolamellar hepatocellular carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Evidence supporting the presence of the DNAJB1-PRKACA chimeric transcript in 100% of the FL-HCCs examined (15/15) suggests that this genetic alteration contributes to tumor pathogenesis."
    explanation: The founding recurrence figure.
  - reference: PMID:25605237
    reference_title: "The genomic landscape of fibrolamellar hepatocellular carcinoma: whole genome sequencing of ten patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The lack of a second-hit mutation in the genomic landscape of fibrolamellar hepatocellular carcinoma makes the DNAJB1-PRKACA fusion protein the best target for diagnostic and therapeutic advancements."
    explanation: >-
      Establishes the absence of a recurrent cooperating lesion, which is why
      this entry treats the fusion as the driver rather than one of several.

treatments:
- name: Surgical Resection
  description: >-
    Hepatectomy is the mainstay and the only modality with a demonstrated
    survival effect in population data. Patients not treated surgically had
    roughly three times the risk of death.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Hepatectomy
    term:
      id: NCIT:C15249
      label: Hepatectomy
  target_mechanisms:
  - target: Hepatic Mass in a Non-Cirrhotic Liver
    description: >-
      Resection removes the tumour bulk; because the background liver is not
      cirrhotic, more of it can be taken than in conventional hepatocellular
      carcinoma.
  evidence:
  - reference: PMID:32052215
    reference_title: "Fibrolamellar Hepatocellular Carcinoma: A Population-Based Observational Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients who were not treated with surgical intervention had about 3 times increased risk for death (HR 2.8, 95% CI 1.68-4.72, P = 0.000)."
    explanation: The population-based effect estimate this treatment rests on.

- name: Cytotoxic Chemotherapy
  description: >-
    Curated as a treatment that does not work. Chemotherapy is given to nearly
    half of patients in population data yet has no measurable effect on
    outcome, and the tumours were described as poorly chemoresponsive from the
    founding report onward. Recording the negative result is the point.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  evidence:
  - reference: PMID:32052215
    reference_title: "Fibrolamellar Hepatocellular Carcinoma: A Population-Based Observational Study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Radiation and chemotherapy did not significantly affect outcomes."
    explanation: >-
      Graded REFUTE because it contradicts the claim that this treatment
      benefits patients. The same sentence covers radiation.
  - reference: PMID:39326063
    reference_title: "DNAJB1-PRKACA Fusion Drives Fibrolamellar Liver Cancer through Impaired SIK Signaling and CRTC2/p300-Mediated Transcriptional Reprogramming."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "There are no standard treatments for advanced FLC, and clinical trials with targeted, conventional, and immune therapies have shown limited benefit."
    explanation: >-
      Supports the description's claim that no systemic option is established,
      across drug classes rather than only cytotoxics.

- name: DNAJB1-PRKACA Fusion-Neoantigen Peptide Vaccine with Nivolumab and Ipilimumab
  description: >-
    A synthetic long peptide spanning the fusion breakpoint, given with a
    poly-ICLC adjuvant and dual checkpoint blockade. This is the therapeutic
    payoff of the entry's single-driver framing: because the breakpoint falls
    inside an intron, the chimeric junction sequence is the same in every
    patient, so one off-the-shelf peptide is a shared neoantigen for the whole
    disease. Phase 1 only - the disease control figure comes from 12 evaluable
    patients and is not an efficacy result.
  therapeutic_modality: VACCINE
  treatment_term:
    preferred_term: Vaccination
    term:
      id: NCIT:C15346
      label: Vaccination
    therapeutic_agent:
    - preferred_term: nivolumab
      term:
        id: NCIT:C68814
        label: Nivolumab
    - preferred_term: ipilimumab
      term:
        id: NCIT:C2654
        label: Ipilimumab
  target_mechanisms:
  - target: Chimeric DNAJ-PKAc Kinase Expression
    description: >-
      The immunogen is the chimeric junction itself, so the treatment targets
      the driver lesion directly rather than a downstream consequence of it.
  evidence:
  - reference: PMID:41286513
    reference_title: "A therapeutic peptide vaccine for fibrolamellar hepatocellular carcinoma: a phase 1 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "fusion breakpoint occurs within an intron, making the sequence of the chimera consistent across patients. This allows a single vaccine to be broadly applicable for patients with FLC."
    explanation: >-
      States why a single shared peptide works for this disease - the intronic
      breakpoint makes the chimera's sequence identical across patients.
  - reference: PMID:41286513
    reference_title: "A therapeutic peptide vaccine for fibrolamellar hepatocellular carcinoma: a phase 1 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNAJ-PKAc-specific T cell responses were detected in 9 of 12 patients after treatment."
    explanation: The immunological primary endpoint, which is what a phase 1 trial is powered for.
  - reference: PMID:41286513
    reference_title: "A therapeutic peptide vaccine for fibrolamellar hepatocellular carcinoma: a phase 1 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the subset of patients who completed the initial priming phase the disease control rate was 75% (9/12), with three partial responses (25%)."
    explanation: >-
      The clinical signal, quoted with its own denominator. Curated as an
      early-phase observation, not as an efficacy claim.
  - reference: PMID:41286513
    reference_title: "A therapeutic peptide vaccine for fibrolamellar hepatocellular carcinoma: a phase 1 trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Grade 3 treatment-related adverse events were reported by six patients (37.5%)."
    explanation: The toxicity result, recorded alongside the response figures rather than omitted.

- name: Liver Transplantation
  description: >-
    Considered for liver-confined disease that cannot be resected. Reported
    five-year survival spans a wide range across series, and the individual
    reports make clear that nodal and vascular involvement drive the outcome
    rather than the transplant itself.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Liver Transplantation
    term:
      id: NCIT:C15271
      label: Liver Transplantation
  target_mechanisms:
  - target: Hepatic Mass in a Non-Cirrhotic Liver
    description: >-
      Total hepatectomy with grafting removes tumour that partial resection
      cannot clear, at the cost of lifelong immunosuppression.
  evidence:
  - reference: PMID:41178855
    reference_title: "Fibrolamellar hepatocellular carcinoma: Advances, challenges and opportunities in a rare malignancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A systematic review of 35 series involving 575 patients indicated a 5-year survival rate ranging from 29% to 55% for those undergoing liver transplantation"
    explanation: >-
      The pooled survival range across 35 series. Quoted as a range rather than
      a point estimate because that is how the source reports it.
  - reference: PMID:29633928
    reference_title: "Living-Donor Liver Transplant for Fibrolamellar Hepatocellular Carcinoma With Hilar Lymph Node Metastasis: A Case Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our patient, with poor prognostic criteria such as hilar lymph node metastasis, microvascular invasion, and poor differentiation, had 22 months of tumor-free survival and 26 months of overall survival after having undergone living-donor liver transplant."
    explanation: >-
      A single case, curated for what it shows about the limits of the
      procedure: hilar nodal metastasis and microvascular invasion were present
      and the patient died at 26 months. One case is weak evidence and is
      recorded as such.

- name: Regional Lymph Node Sampling
  description: >-
    Curated because the evidence points two ways and both directions matter.
    Fibrolamellar histology independently predicts node positivity, so sampling
    is informative for staging; but in the same cohort, sampling itself carried
    no independent survival benefit. This entry records the staging rationale
    and the absent survival effect as separate evidence items rather than
    resolving them into a recommendation.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Lymphadenectomy
    term:
      id: NCIT:C15275
      label: Lymphadenectomy
  evidence:
  - reference: PMID:35398630
    reference_title: "Prognostic Role of Lymph Node Sampling in Adolescent and Young Adults With Fibrolamellar Carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FLC was an independent risk factor for LN positivity, suggesting a role for routine LN sampling in these patients."
    explanation: >-
      The staging rationale: this histology is itself a predictor of positive
      nodes, which is the study's argument for sampling.
  - reference: PMID:35398630
    reference_title: "Prognostic Role of Lymph Node Sampling in Adolescent and Young Adults With Fibrolamellar Carcinoma."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "In AYA patients with HCC, LN sampling was not associated with an independent survival benefit."
    explanation: >-
      Graded REFUTE against a survival-benefit claim, which the deep-research
      report asserted and this cohort does not support. The same paper supplies
      both items because it makes both findings.

- name: Aurora Kinase A Inhibition
  description: >-
    ENMD-2076, an oral Aurora A inhibitor, was the first drug taken into a
    trial on the strength of this entry's own mechanism - AURKA overexpression
    downstream of the fusion. It is curated because it did not work. A single
    partial response in 35 patients is the counterexample to reading a
    phosphoproteomic node as a validated drug target.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: AURKA-GSK3 Sub-Network Activation
    description: >-
      The drug targets Aurora kinase A, which is the node's own gene product.
  evidence:
  - reference: PMID:32154962
    reference_title: "Phase II Multicenter, Open-Label Study of Oral ENMD-2076 for the Treatment of Patients with Advanced Fibrolamellar Carcinoma."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The limited results, one patient (3%) with a partial response and 57% of patients with stable disease, do not support further evaluation of ENMD-2076 as single agent."
    explanation: >-
      Graded REFUTE against the claim that this treatment benefits patients.
      The response and stable-disease figures are quoted with the trial's own
      conclusion attached to them.
  - reference: PMID:32154962
    reference_title: "Phase II Multicenter, Open-Label Study of Oral ENMD-2076 for the Treatment of Patients with Advanced Fibrolamellar Carcinoma."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The study provided no rationale for further studying ENMD-2076 as a single agent in FLC."
    explanation: The trial's formal conclusion, quoted separately from the numbers behind it.

clinical_trials:
- name: NCT04248569
  phase: PHASE_I
  status: ACTIVE_NOT_RECRUITING
  description: >-
    Pilot trial of the DNAJB1-PRKACA fusion kinase peptide vaccine with
    nivolumab and ipilimumab in unresectable or metastatic disease. Published
    as a phase 1 report in 2025.
  evidence:
  - reference: clinicaltrials:NCT04248569
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The primary objective of the trial is the safety and tolerability of administering a vaccine targeting the DNAJB1-PRKACA fusion kinase, in combination with nivolumab and ipilimumab in patients with unresectable or metastatic FLC and with non-FLC solid tumors and to assess the T-cell response."
    explanation: >-
      The registry record establishing the trial's design and endpoints. Graded
      OTHER because a registration document is not itself study evidence; the
      results are curated on the treatment from PMID:41286513.

- name: NCT02234986
  phase: PHASE_II
  status: COMPLETED
  description: >-
    Multicentre open-label phase 2 of oral ENMD-2076 in advanced disease.
    Completed and published - one partial response in 35 patients, and the
    investigators concluded against further single-agent development.
  evidence:
  - reference: clinicaltrials:NCT02234986
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The purpose of the study is to determine whether once-daily dosing with ENMD-2076 will be a safe and effective treatment in patients with FLC. Safety will be measured by looking at the adverse events that may happen and the efficacy will look at the progression of the disease over time."
    explanation: >-
      The registry record for the trial whose published results are curated on
      the Aurora Kinase A Inhibition treatment.

- name: NCT04380545
  phase: PHASE_II
  status: RECRUITING
  description: >-
    Phase I/II of nivolumab with fluorouracil and interferon alfa-2b in
    unresectable disease.
  evidence:
  - reference: clinicaltrials:NCT04380545
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This phase I/II trial studies the side effects and how well nivolumab, fluorouracil, and interferon alpha 2b work for the treatment of fibrolamellar cancer (liver cell cancer) that cannot be removed by surgery (unresectable)."
    explanation: >-
      The registry record. No results are published, so nothing is curated as a
      treatment on the strength of it.

- name: NCT06620302
  phase: PHASE_I
  status: RECRUITING
  description: >-
    Phase I with a phase II feasibility cohort for fibrolamellar carcinoma,
    testing the Bcl-xL degrader DT2216 with irinotecan in relapsed or
    refractory paediatric and young-adult solid tumours.
  evidence:
  - reference: clinicaltrials:NCT06620302
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This phase I/II trial tests the safety, side effects and best dose of DT2216 in combination with irinotecan and how well it works in treating children, adolescents and young adults with solid tumors and fibrolamellar cancer that has come back after a period of improvement (relapsed) or that has not responded to previous treatment (refractory)."
    explanation: >-
      The registry record. Listed because the disease has a named feasibility
      cohort in it, not because any result is available.

biochemical:
- name: Serum unsaturated vitamin B12 binding capacity
  presence: INCREASED
  context: >-
    The classic serum marker of this tumour, and the historical counterpart to
    the normal alpha-fetoprotein: in the founding 1982 series every patient
    with a raised value had a normal alpha-fetoprotein and no cirrhosis. It is
    a correlation established in a small cohort and has not displaced imaging
    or fusion testing in practice, so it is curated as a supporting laboratory
    finding rather than a diagnostic test.
  evidence:
  - reference: PMID:6288165
    reference_title: "High serum vitamin B12 binding capacity as a marker of the fibrolamellar variant of hepatocellular carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Seven of the 10 patients had fibrolamellar hepatocellular carcinoma, a recently recognised histological variant, which was found in only one young patient without increased serum unsaturated vitamin B12 binding capacity and no alpha-fetoprotein among the remaining 97."
    explanation: >-
      The enrichment result: seven of ten patients with a raised value had this
      histology, against one case among the other 97 patients.
  - reference: PMID:6288165
    reference_title: "High serum vitamin B12 binding capacity as a marker of the fibrolamellar variant of hepatocellular carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This high degree of correlation between increased serum unsaturated vitamin B12 binding capacity and fibrolamellar hepatocellular carcinoma has not been reported before."
    explanation: >-
      The authors' own framing of the finding as a correlation, which is the
      strength this entry claims for it.

prevalence:
- population: United States, SEER 2000-2016
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.02
  rate_denominator: POPULATION_PER_YEAR
  notes: Age-adjusted incidence from 300 SEER-registered cases.
  evidence:
  - reference: PMID:32052215
    reference_title: "Fibrolamellar Hepatocellular Carcinoma: A Population-Based Observational Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall age-adjusted incidence of FLC between 2000 and 2016 was 0.02 per 100,000 per year."
    explanation: The population-based incidence figure this record normalizes.

epidemiology:
- name: Young Age at Diagnosis
  description: >-
    Median age at diagnosis is 27, decades below conventional hepatocellular
    carcinoma. The SEER distribution is bimodal, with a second peak in the
    eighth decade that is less often emphasised in the clinical literature.
  evidence:
  - reference: PMID:32052215
    reference_title: "Fibrolamellar Hepatocellular Carcinoma: A Population-Based Observational Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median age at diagnosis was 27 ± 22 years."
    explanation: The median age this record reports.
  - reference: PMID:32052215
    reference_title: "Fibrolamellar Hepatocellular Carcinoma: A Population-Based Observational Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A bimodal distribution was observed where the highest incidences occurred between 15-19 years and 70-74 years."
    explanation: >-
      The bimodality, which the "adolescents and young adults" framing common
      elsewhere in the literature omits.

progression:
- phase: Population-Based Survival
  notes: >-
    SEER cause-specific survival is 72.0% at one year and 32.9% at five, with a
    median of 32.9 months - roughly three times the 11.7-month median for
    conventional hepatocellular carcinoma in the same analysis.
  evidence:
  - reference: PMID:32052215
    reference_title: "Fibrolamellar Hepatocellular Carcinoma: A Population-Based Observational Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One- and 5-year cause-specific survival for FLC was 72.0% and 32.9%, respectively, with a median survival of 32.9 months."
    explanation: The all-stage survival figures this phase records.

- phase: Advanced Disease
  notes: >-
    Five-year overall survival is under 10% once disease is advanced. This is
    not in conflict with the SEER figure above: that one is all-stage and
    cause-specific, this one is restricted to advanced disease. The two are
    recorded separately rather than reconciled.
  evidence:
  - reference: PMID:39326063
    reference_title: "DNAJB1-PRKACA Fusion Drives Fibrolamellar Liver Cancer through Impaired SIK Signaling and CRTC2/p300-Mediated Transcriptional Reprogramming."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Outcomes are poor for advanced disease, with a 5-year overall survival of less than 10%"
    explanation: The advanced-disease survival figure, whose population differs from the SEER record above.

- phase: Recurrence After Resection
  notes: >-
    Recurrence after a curative-intent resection is the rule rather than the
    exception, and re-resecting it is worth doing. The reported recurrence
    fraction ranges from most of a small single-centre series to all patients
    in a pooled relapse review, so the entry records the sources separately
    rather than settling on one number. Reported survival after re-resection is
    substantially longer than without, which is why an aggressive surgical
    posture persists at relapse.
  evidence:
  - reference: PMID:32397993
    reference_title: "Clinical features and surgical outcomes of fibrolamellar hepatocellular carcinoma: retrospective analysis of a single-center experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Five patients (62.5%) developed recurrent disease after a median disease-free survival of 9 months. Two patients (25.0%) received re-resection."
    explanation: >-
      A single-centre surgical series: five of eight patients recurred at a
      median of nine months, and a quarter went on to a second resection.
  - reference: PMID:41178855
    reference_title: "Fibrolamellar hepatocellular carcinoma: Advances, challenges and opportunities in a rare malignancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "found that all patients experienced recurrence after initial surgery, with a median time to recurrence of 2.2 years. For those who underwent re-resection, the median OS increased to 4.7 years, with a 5-year survival rate of 48%."
    explanation: >-
      A pooled relapse review reporting universal recurrence and the survival
      gain from re-resection. Kept separate from the single-centre figures
      above rather than averaged with them.
  - reference: PMID:41178855
    reference_title: "Fibrolamellar hepatocellular carcinoma: Advances, challenges and opportunities in a rare malignancy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Case series have demonstrated that re-resection of recurrent FLHCC lesions can lead to improved survival outcomes, with median OS extending up to 122 months in some cases"
    explanation: >-
      The upper end of the reported re-resection survival, quoted with the
      source's own hedge that it is what case series have shown in some cases.

animal_models:
- name: CRISPR/Cas9 Dnajb1-Prkaca fusion mouse
  species: Mouse
  genotype: Dnajb1-Prkaca fusion engineered by CRISPR/Cas9 deletion of the syntenic chromosome 8 region
  description: >-
    CRISPR/Cas9 vectors delivered by hydrodynamic tail vein injection to adult
    FVB/N mouse liver, juxtaposing Dnajb1 exon 1 with Prkaca exon 2. The mice
    carried no other engineered alteration and were exposed to no liver toxin
    or carcinogen, which is what makes this a sufficiency experiment rather
    than a cooperation one.
  publication: PMID:28923495
  modeled_mechanisms:
  - target: Hepatocyte Transformation and Clonal Proliferation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      The fusion alone produced neoplasms in 12 of 15 mice and none of 11
      controls, with histologic and cytologic features of human tumours.
    limitations: >-
      Tumours are described as indolent in the companion model, and the
      14-month latency is long relative to the human disease course, so the
      model reproduces initiation better than it reproduces tempo.
    evidence:
    - reference: PMID:28923495
      reference_title: "CRISPR/Cas9 Engineering of Adult Mouse Liver Demonstrates That the Dnajb1-Prkaca Gene Fusion Is Sufficient to Induce Tumors Resembling Fibrolamellar Hepatocellular Carcinoma."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Livers from 12 of the 15 mice given the vectors to induce the Dnajb1-Prkaca gene fusion, but none of the 11 mice given the control vector, developed neoplasms."
      explanation: The controlled result establishing this model as informative for the transformation node.

- name: Transposon-mediated DNAJB1-PRKACA mouse with beta-catenin activation
  species: Mouse
  genotype: DNAJB1-PRKACA chimeric cDNA or endogenous fusion, with and without activated beta-catenin
  description: >-
    CRISPR-Cas9 plus transposon-mediated somatic gene transfer, used both to
    show the fusion drives tumours and to test cooperation with beta-catenin
    and with hepatotoxin-induced injury.
  publication: PMID:29162699
  modeled_mechanisms:
  - target: Wnt/beta-Catenin Cooperation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Genetic beta-catenin activation significantly enhanced fusion-driven
      tumorigenesis.
    limitations: >-
      Cooperation is demonstrated in mouse; in humans the support is recurrent
      Wnt pathway mutations, which is an association rather than a
      demonstration, so the human claim is weaker than the mouse one.
    evidence:
    - reference: PMID:29162699
      reference_title: "DNAJB1-PRKACA fusion kinase interacts with β-catenin and the liver regenerative response to drive fibrolamellar hepatocellular carcinoma."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Tumorigenesis was significantly enhanced by genetic activation of β-catenin"
      explanation: The cooperation result this link records.

- name: zfDnaJa-Pkaca hepatocyte-expressing zebrafish
  species: Zebrafish
  genotype: hepatocyte-restricted ectopic expression of zebrafish Dnaja-Pkaca
  description: >-
    A larval zebrafish model expressing the zebrafish orthologue of the fusion
    in hepatocytes. Its point is live imaging of the earliest events, which the
    mouse models cannot show: the innate immune infiltrate appears before any
    tumour does.
  publication: PMID:32102783
  modeled_mechanisms:
  - target: Hepatocyte Transformation and Clonal Proliferation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Fusion expression enlarges the liver and the hepatocytes in it, with an
      early neutrophil and macrophage infiltrate.
    limitations: >-
      A zebrafish orthologue of the fusion in larval liver is not the human
      chimera in an adult human liver, and the readout is hepatomegaly and
      inflammation rather than a lamellar-stroma tumour. It reports early
      events, not the disease.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        The construct is zebrafish Dnaja-Pkaca, not human DNAJB1-PRKACA, so the
        chimeric junction sequence that defines the human lesion - and that the
        peptide vaccine targets - is not the sequence expressed here.
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The measured quantities are liver size, hepatocyte size and immune-cell
        infiltration in a larva. The node's quantity is transformation of
        hepatocytes into a tumour with lamellar stroma and eosinophilic
        polygonal cytology, neither of which this model reports.
    evidence:
    - reference: PMID:32102783
      reference_title: "DnaJ-PKAc fusion induces liver inflammation in a zebrafish model of fibrolamellar carcinoma."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Expression of zfDnaJa-Pkaca in hepatocytes induces hepatomegaly and increased hepatocyte size."
      explanation: The growth phenotype that ties this model to the transformation node.
    - reference: PMID:32102783
      reference_title: "DnaJ-PKAc fusion induces liver inflammation in a zebrafish model of fibrolamellar carcinoma."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "FLC larvae exhibit early innate immune inflammation characterized by early infiltration of neutrophils and macrophages into the liver microenvironment."
      explanation: >-
        The early inflammatory finding this model exists to show, which is not
        otherwise represented in this entry's pathograph.

experimental_models:
- name: Patient-derived fibrolamellar carcinoma organoids
  experimental_model_type: ORGANOID
  description: >-
    Twenty-one organoid lines grown from nine patients - primary tumour,
    metastases, and matched non-tumour liver from the same operations. The
    matched normal lines are what make this a comparison rather than a culture
    collection, and the panel was taken through a drug screen.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:35803261
  modeled_mechanisms:
  - target: Hepatocyte Transformation and Clonal Proliferation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The organoids reproduce the histology, immunohistochemistry and
      transcriptome of the tumours they came from.
    limitations: >-
      An organoid has no stroma, so nothing about the lamellar fibrous bands -
      the feature the disease is named for - can be studied in it. Seven of the
      nine donors had received chemotherapy before resection, so the lines are
      not uniformly treatment-naive.
    evidence:
    - reference: PMID:35803261
      reference_title: "Human liver organoids for disease modeling of fibrolamellar carcinoma."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "These patient-derived FLC organoids recapitulate the histologic morphology, immunohistochemistry, and transcriptome of the patient tumor."
      explanation: The fidelity claim, across three independent kinds of comparison.
    - reference: PMID:35803261
      reference_title: "Human liver organoids for disease modeling of fibrolamellar carcinoma."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We developed 21 patient-derived organoid lines: 12 from metastases, three from the liver tumor and six from adjacent non-tumor liver."
      explanation: >-
        The composition of the panel, including the matched non-tumour lines
        that give the comparison its control.
- name: AML12 DNAJ-PKAc gene-edited hepatocyte line
  experimental_model_type: CELL_LINE
  description: >-
    Mouse hepatocytes gene-edited to express DNAJ-PKAc, used for the
    phosphoproteomics and drug screening that defined the Hsp70/AKAP-Lbc
    scaffolding mechanism.
  organism:
    preferred_term: mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  publication: PMID:31063128
  modeled_mechanisms:
  - target: Acquired Hsp70 Scaffolding Function
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      The line reproduces the fusion's Hsp70 recruitment and ERK-biased
      signalling, and its proliferation is selectively blocked by Hsp70 plus
      MEK inhibitor combinations.
    limitations: >-
      A mouse hepatocyte line reports the signalling consequences of the fusion
      but not the tissue architecture, stroma or clinical course; nothing about
      the lamellar fibrosis can be learned from it.
    evidence:
    - reference: PMID:31063128
      reference_title: "An acquired scaffolding function of the DNAJ-PKAc fusion contributes to oncogenic signaling in fibrolamellar carcinoma."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Drug screening reveals Hsp70 and MEK inhibitor combinations that selectively block proliferation of AML12DNAJ-PKAc cells."
      explanation: >-
        Selective dependence on the scaffolding partners establishes the line
        as informative for this node.

discussions:
- discussion_id: flc_lamellar_stroma_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    How does a hepatocyte carrying the DNAJB1-PRKACA fusion induce the parallel
    lamellar collagen bands the disease is named for?
  rationale: >-
    The lamellar stroma is the tumour's defining histologic feature and the
    origin of its name, yet the entry cannot connect it to the driver. TGF-beta
    overexpression is the proposed route in the literature, but the support is
    correlative and histological rather than a demonstrated causal chain, so
    the edge from transformation to stroma is curated with unknown
    intermediates and no evidence attached. The gap matters because the
    fibrosis is not cirrhotic and the surrounding liver is normal, so whatever
    drives it is tumour-directed rather than a background process.
  attaches_to:
  - pathophysiology#Hepatocyte Transformation and Clonal Proliferation
  - pathophysiology#Lamellar Fibrous Stroma Formation

- discussion_id: flc_who5_versus_mondo_placement
  kind: INTERPRETATION
  prompt: >-
    Is fibrolamellar carcinoma a subtype of hepatocellular carcinoma or a
    separate entity, and what should the entry assert?
  rationale: >-
    MONDO places MONDO:0006210 under hepatocellular carcinoma, and this entry's
    `parents` follows it. The evidence curated here points the other way: the
    genomic landscape is distinct, the driver is absent from conventional
    hepatocellular carcinoma and from every other liver tumour tested, the
    patient population and risk-factor profile do not overlap, and the
    published sequencing describes it as "a distinct carcinoma". The entry does
    not attempt to resolve the ontology question - it uses MONDO's term and
    hierarchy as given, curates the evidence that bears on the placement, and
    records the disagreement here rather than silently asserting either answer.
  attaches_to:
  - disease#Fibrolamellar Hepatocellular Carcinoma
  - differential_diagnoses#Conventional Hepatocellular Carcinoma

notes: >-
  Promotion from a subtype row. Before this entry, fibrolamellar carcinoma
  existed in the knowledge base only as a `has_subtypes` row on
  `Hepatocellular_Carcinoma`. It is promoted here under the cancer granularity
  ladder (design decisions 3a): it has its own MONDO term, its own driver
  lesion, a distinct patient population, and a distinct treatment pathway. The
  pointer row is deliberately left in place on the parent rather than deleted,
  so a reader arriving at the hepatocellular carcinoma entry is still told the
  variant exists and where it went.

  Ontology placement is contested and not resolved here. See the
  `flc_who5_versus_mondo_placement` discussion. `parents` follows MONDO.

  Two survival figures that describe different populations. SEER gives 32.9%
  five-year cause-specific survival across all stages; a 2024 review gives
  under 10% five-year overall survival in advanced disease. These are not in
  conflict and are not averaged - they are curated as separate `progression`
  phases with their populations stated.

  A phenotype and a treatment are curated as negative findings. Normal
  alpha-fetoprotein is bound to the HP term for *elevated* AFP with
  `supports: REFUTE`, because the discriminating observation in this disease is
  that the value is normal. Cytotoxic chemotherapy carries a REFUTE item
  because population data show no effect on outcome despite widespread use.
  Both are recorded as negatives rather than omitted.

  The fusion is near-universal in this tumour but not unique to it. The
  specificity result curated on `DNAJB1-PRKACA Fusion Detection` was obtained
  across liver tumours, and it holds there. A later series found the same
  fusion in oncocytic pancreatic and biliary neoplasms, so the test is not
  site-agnostic. Both results are curated on that diagnosis entry, as a SUPPORT
  and a REFUTE item, rather than one being softened to accommodate the other.

  Not curated. The research report describes neurotensin as a candidate
  biomarker, single-cell work on rewired SPP1-CD44 and MIF-ACKR3 signalling,
  snATAC-seq super-enhancer landscapes, and in vitro drug screens nominating
  HDAC and topoisomerase inhibitors and napabucasin. All trace to preprints or
  sources this session did not fetch, so none is included. The report also
  offered `NCIT:C158`, which does not exist, and `GO:0016575`, which is
  obsolete; neither is bound.

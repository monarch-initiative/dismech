name: Fibrolamellar Hepatocellular Carcinoma
creation_date: '2026-09-07T00:00:00Z'
description: >-
  Fibrolamellar carcinoma is a rare primary liver cancer of adolescents and
  young adults that arises in an otherwise normal, non-cirrhotic liver and
  without the viral, alcoholic or metabolic risk factors that define
  conventional hepatocellular carcinoma. Nearly every tumour carries the same
  single lesion: a somatic ~400 kb deletion on chromosome 19 that fuses exon 1
  of DNAJB1 to the catalytic domain of PRKACA, producing a chimeric protein
  kinase A catalytic subunit. That chimera is not merely more PKA - it is
  overexpressed relative to wild-type, it acquires an Hsp70-recruiting
  scaffolding function the normal kinase lacks, and overexpressing wild-type
  PRKACA does not reproduce its oncogenic effect. Engineering the equivalent
  fusion into mouse liver, with no other genetic change and no carcinogen,
  produces tumours resembling the human disease. Whole-genome sequencing finds
  no recurrent second hit, which leaves this among the closest things in solid
  oncology to a one-lesion cancer. Histologically the tumour is built of large
  eosinophilic, mitochondria-rich polygonal cells separated by the parallel
  lamellar collagen bands that give the disease its name. Surgical resection is
  the only intervention with a demonstrated survival effect; chemotherapy and
  radiation have none.
categories:
- Hepatobiliary Neoplasm
- Primary Liver Cancer
parents:
- hepatocellular carcinoma
disease_term:
  preferred_term: fibrolamellar carcinoma
  term:
    id: MONDO:0006210
    label: fibrolamellar hepatocellular carcinoma
synonyms:
- FLC
- FL-HCC
- FHCC
- fibrolamellar carcinoma
- fibrolamellar hepatocarcinoma
- liver cell fibrolamellar carcinoma
classifications:
  icdo_morphology:
    classification_value: Carcinoma
  harrisons_chapter:

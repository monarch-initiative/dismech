pathophysiology:
- name: Chromosome 19 Deletion Creating the DNAJB1-PRKACA Fusion
  description: >-
    A somatic heterozygous deletion of roughly 400 kb on chromosome 19 joins
    DNAJB1 in frame to PRKACA. The deletion is present in essentially every
    fibrolamellar carcinoma and in no adjacent normal liver, and whole-genome
    sequencing finds no recurrent second structural event alongside it.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: DNAJB1
    term:
      id: hgnc:5270
      label: DNAJB1
  - preferred_term: PRKACA
    term:
      id: hgnc:9380
      label: PRKACA
  downstream:
  - target: Chimeric DNAJ-PKAc Kinase Expression
    causal_link_type: DIRECT
    description: >-
      The fusion transcript is translated into a chimeric protein that is
      detectable in tumour tissue and retains kinase activity.
    evidence:
    - reference: PMID:24578576
      reference_title: "Detection of a recurrent DNAJB1-PRKACA chimeric transcript in fibrolamellar hepatocellular carcinoma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Immunoprecipitation and Western blot analyses confirmed that the chimeric protein is expressed in tumor tissue, and a cell culture assay indicated that it retains kinase activity."
      explanation: >-
        Establishes that the deletion yields an expressed, catalytically active
        protein rather than only a transcript, which is what this edge claims.
  evidence:
  - reference: PMID:24578576
    reference_title: "Detection of a recurrent DNAJB1-PRKACA chimeric transcript in fibrolamellar hepatocellular carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a chimeric transcript that is expressed in FL-HCC but not in adjacent normal liver and that arises as the result of a ~400-kilobase deletion on chromosome 19."
    explanation: The founding observation defining this node - the deletion, its size, and its tumour restriction.
  - reference: PMID:24578576
    reference_title: "Detection of a recurrent DNAJB1-PRKACA chimeric transcript in fibrolamellar hepatocellular carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Evidence supporting the presence of the DNAJB1-PRKACA chimeric transcript in 100% of the FL-HCCs examined (15/15) suggests that this genetic alteration contributes to tumor pathogenesis."
    explanation: Quantifies the near-universal recurrence on which this entry's single-driver framing rests.
  - reference: PMID:25605237
    reference_title: "The genomic landscape of fibrolamellar hepatocellular carcinoma: whole genome sequencing of ten patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "There are relatively few coding, somatic mutations in this cancer, putting it on the low end of the mutational spectrum."
    explanation: >-
      Whole-genome evidence for the low mutational burden that makes this
      lesion interpretable as the driver rather than one of many.

- name: Chimeric DNAJ-PKAc Kinase Expression
  description: >-
    The chimera carries the DNAJB1 amino-terminal chaperone-binding domain
    fused to the PRKACA catalytic domain. Its transcript is expressed about
    tenfold above wild-type PRKACA, so the tumour cell holds far more of the
    mutant kinase than of the normal one.
  biological_scale: MOLECULAR
  gene_products:
  - preferred_term: DNAJB1-PRKACA fusion protein
  molecular_functions:
  - preferred_term: cAMP-dependent protein kinase activity
    modifier: INCREASED
    term:
      id: GO:0004691
      label: cAMP-dependent protein kinase activity
  downstream:
  - target: Elevated cAMP-Stimulated PKA Activity
    causal_link_type: DIRECT
  - target: Acquired Hsp70 Scaffolding Function
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:24578576
    reference_title: "Detection of a recurrent DNAJB1-PRKACA chimeric transcript in fibrolamellar hepatocellular carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The chimeric RNA is predicted to code for a protein containing the amino-terminal domain of DNAJB1, a homolog of the molecular chaperone DNAJ, fused in frame with PRKACA, the catalytic domain of protein kinase A."
    explanation: Describes the domain architecture of the chimera this node names.
  - reference: PMID:27027723
    reference_title: "Enhanced cAMP-stimulated protein kinase A activity in human fibrolamellar hepatocellular carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "DNAJB1-PRKACA was expressed 10-fold higher than the wild-type PRKACA transcript, resulting in overexpression of the mutant protein in tumors."
    explanation: Quantifies the expression imbalance between mutant and wild-type kinase.

- name: Elevated cAMP-Stimulated PKA Activity
  description: >-
    Tumours show higher cAMP-stimulated PKA catalytic activity than normal
    liver. The mutant and wild-type kinases have similar Km values, so the
    excess activity is a consequence of how much mutant kinase is present
    rather than of a changed affinity for substrate.
  biological_scale: MOLECULAR
  downstream:
  - target: AURKA-GSK3 Signalling and MYC Protein Accumulation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: SIK Inactivation and CRTC2-p300 Transcriptional Reprogramming
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27027723
    reference_title: "Enhanced cAMP-stimulated protein kinase A activity in human fibrolamellar hepatocellular carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Consequently, FL-HCCs possess elevated cAMP-stimulated PKA activity compared to normal livers, despite similar Kms between the mutant and wild-type kinases."
    explanation: >-
      States both the elevated activity and the Km comparison that locates the
      cause in abundance rather than in altered catalysis.

- name: Acquired Hsp70 Scaffolding Function
  description: >-
    The retained DNAJ domain lets the fusion recruit Hsp70, a property
    wild-type PKA does not have. A-kinase anchoring protein Lbc, itself
    upregulated in these tumours, clusters the resulting DNAJ-PKAc/Hsp70
    subcomplexes with a RAF-MEK-ERK module, so the fusion does not simply
    signal harder - it assembles a signalling complex the normal kinase never
    forms. This is the clearest evidence that the lesion is neomorphic rather
    than merely activating.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: AURKA
    term:
      id: hgnc:11393
      label: AURKA
  downstream:
  - target: ERK-Biased MAPK Signalling
    causal_link_type: DIRECT
    description: >-
      Clustering the fusion with a RAF-MEK-ERK module is what redirects the
      cell's signalling output toward ERK.
    evidence:
    - reference: PMID:31063128
      reference_title: "An acquired scaffolding function of the DNAJ-PKAc fusion contributes to oncogenic signaling in fibrolamellar carcinoma."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "the proto-oncogene A-kinase anchoring protein-Lbc is up-regulated in FLC and functions to cluster DNAJ-PKAc/Hsp70 sub-complexes with a RAF-MEK-ERK kinase module"
      explanation: Names the scaffolding step that connects this node to ERK activation.
  evidence:
  - reference: PMID:31063128
    reference_title: "An acquired scaffolding function of the DNAJ-PKAc fusion contributes to oncogenic signaling in fibrolamellar carcinoma."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "a unique property of this fusion enzyme is the ability to recruit heat shock protein 70 (Hsp70)"
    explanation: Establishes the acquired, wild-type-absent property this node describes.
  - reference: PMID:33370777
    reference_title: "Structural analyses of the PKA RIIβ holoenzyme containing the oncogenic DnaJB1-PKAc fusion protein reveal protomer asymmetry and fusion-induced allosteric perturbations in fibrolamellar hepatocellular carcinoma."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "When the J-domain of the heat shock protein DnaJB1 is fused to the catalytic (C) subunit of cAMP-dependent protein kinase (PKA), replacing exon 1, this fusion protein, J-C subunit (J-C), becomes the driver of fibrolamellar hepatocellular carcinoma (FL-HCC)."
    explanation: >-
      Independent structural line on the same node: cryo-EM plus molecular
      dynamics of the fusion holoenzyme. Graded COMPUTATIONAL because the
      quoted framing rests on the structural and simulation work this paper
      reports, not on a clinical or wet-lab perturbation.

- name: ERK-Biased MAPK Signalling
  description: >-
    Phosphoproteomic profiling shows the fusion shifts the cell's signalling
    landscape toward ERK activation and engages downstream kinase cascades.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: MAPK cascade
    modifier: INCREASED
    term:
      id: GO:0000165
      label: MAPK cascade
  downstream:
  - target: Hepatocyte Transformation and Clonal Proliferation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:31063128
    reference_title: "An acquired scaffolding function of the DNAJ-PKAc fusion contributes to oncogenic signaling in fibrolamellar carcinoma."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Phosphoproteomic profiling demonstrates that DNAJ-PKAc biases the signaling landscape toward ERK activation and engages downstream kinase cascades."
    explanation: Direct phosphoproteomic evidence for the ERK bias this node asserts.

- name: SIK Inactivation and CRTC2-p300 Transcriptional Reprogramming
  description: >-
    The fusion inactivates salt-inducible kinases, releasing the CRTC2
    coactivator and p300 acetyltransferase to drive a tumour-growth
    transcriptional program. This arm was defined in 2024 by combining model
    systems with human tumour specimens.
  biological_scale: MOLECULAR
  downstream:
  - target: Hepatocyte Transformation and Clonal Proliferation
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:39326063
    reference_title: "DNAJB1-PRKACA Fusion Drives Fibrolamellar Liver Cancer through Impaired SIK Signaling and CRTC2/p300-Mediated Transcriptional Reprogramming."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "DNAJB1-PRKACA-mediated inactivation of the SIK stimulates CRTC2-p300-mediated transcription to drive tumor growth."
    explanation: States the whole arm this node models, from SIK inactivation through to growth.

- name: AURKA-GSK3 Signalling and MYC Protein Accumulation
  description: >-
    Phosphoproteomics across PKA-activating lesions identifies an Aurora kinase
    A / GSK3 sub-network acting on MYC. In fibrolamellar carcinoma the dominant
    route to raised c-MYC protein was translational rather than
    transcriptional, and blocking translation initiation with an eIF4A
    inhibitor collapsed MYC expression and cell growth.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MYC
    term:
      id: hgnc:7553
      label: MYC
  downstream:
  - target: Hepatocyte Transformation and Clonal Proliferation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Ornithine Transcarbamylase Suppression
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Raised c-Myc is the proposed driver of the ornithine decarboxylase
      increase that in turn suppresses ornithine transcarbamylase.
    evidence:
    - reference: PMID:36788919
      reference_title: "Molecular Basis of Hyperammonemic Encephalopathy in Fibrolamellar Hepatocellular Carcinoma."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "An ornithine transcarboxylase dysfunction was suggested as a result of increased ornithine decarboxylase activity induced by c-Myc overexpression."
      explanation: >-
        States the proposed c-Myc to ODC to OTC route this edge represents.
        Quoted as the source frames it, as a proposal rather than a settled fact.
  evidence:
  - reference: PMID:36692000
    reference_title: "Oncogenic PKA signaling increases c-MYC protein expression through multiple targetable mechanisms."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Two signaling networks were identified downstream of PKA: RAS/MAPK components and an Aurora Kinase A (AURKA)/glycogen synthase kinase (GSK3) sub-network with activity toward MYC oncoproteins."
    explanation: Identifies the AURKA/GSK3 to MYC sub-network this node names.
  - reference: PMID:26489647
    reference_title: "Transcriptomic characterization of fibrolamellar hepatocellular carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Expression of several known oncogenes, such as ErbB2 and Aurora Kinase A, was increased in tumor samples."
    explanation: Independent transcriptomic confirmation that Aurora kinase A is raised in human tumours.

- name: Wnt/beta-Catenin Cooperation
  description: >-
    The fusion kinase interacts with beta-catenin, and activating beta-catenin
    genetically markedly increases tumour formation in mouse models. Recurrent
    Wnt pathway mutations in human tumours support this as a real cooperating
    route. It is curated as cooperation, not as a second required driver -
    the fusion alone suffices.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: canonical Wnt signaling pathway
    modifier: INCREASED
    term:
      id: GO:0060070
      label: canonical Wnt signaling pathway
  downstream:
  - target: Hepatocyte Transformation and Clonal Proliferation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:29162699
    reference_title: "DNAJB1-PRKACA fusion kinase interacts with β-catenin and the liver regenerative response to drive fibrolamellar hepatocellular carcinoma."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Tumorigenesis was significantly enhanced by genetic activation of β-catenin, an observation supported by evidence of recurrent Wnt pathway mutations in human FL-HCC"
    explanation: >-
      Establishes both the mouse cooperation effect and its human genomic
      correlate, which is what this node claims.

- name: Hepatocyte Transformation and Clonal Proliferation
  description: >-
    The convergent consequence is transformation of hepatocytes in a liver with
    no underlying disease. The fusion is sufficient on its own: engineering it
    into adult mouse liver, with no other engineered alteration and no
    carcinogen exposure, produces tumours resembling human fibrolamellar
    carcinoma, while overexpressing wild-type PRKACA does not.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: neoplastic hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  downstream:
  - target: Lamellar Fibrous Stroma Formation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The tumour induces its characteristic stroma, but the steps between
      transformation and lamellar collagen deposition are not established.
  - target: Hepatic Mass in a Non-Cirrhotic Liver
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:28923495
    reference_title: "CRISPR/Cas9 Engineering of Adult Mouse Liver Demonstrates That the Dnajb1-Prkaca Gene Fusion Is Sufficient to Induce Tumors Resembling Fibrolamellar Hepatocellular Carcinoma."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Livers from 12 of the 15 mice given the vectors to induce the Dnajb1-Prkaca gene fusion, but none of the 11 mice given the control vector, developed neoplasms."
    explanation: >-
      The sufficiency experiment, with its control arm, that makes this node a
      demonstrated consequence rather than an inferred one.
  - reference: PMID:29162699
    reference_title: "DNAJB1-PRKACA fusion kinase interacts with β-catenin and the liver regenerative response to drive fibrolamellar hepatocellular carcinoma."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "overexpression of the wild-type PRKACA was unable to fully recapitulate the oncogenic activity of DNAJB1-PRKACA, implying that FL-HCC does not simply result from enhanced PRKACA expression"
    explanation: >-
      The negative control that distinguishes a neomorphic fusion from simple
      PKA overactivity - the entry's central mechanistic claim.

- name: Lamellar Fibrous Stroma Formation
  description: >-
    Parallel bands of collagen encircle nests of tumour cells, producing the
    architecture the disease is named for. This is a tumour-induced stroma
    distinct from cirrhotic fibrosis, and the tumour arises in a liver that is
    not otherwise fibrotic. The cellular route from transformed hepatocyte to
    lamellar collagen is not established, so it is modelled as an edge with
    unknown intermediates rather than asserted.
  biological_scale: TISSUE

- name: Hepatic Mass in a Non-Cirrhotic Liver
  description: >-
    A large liver mass in a patient with no cirrhosis and none of the risk
    factors that precede conventional hepatocellular carcinoma. Because the
    symptoms are nonspecific and the patients are young and otherwise well, a
    substantial fraction present with a large tumour burden and locally
    invasive or metastatic disease.
  biological_scale: ORGANISM
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:39326063
    reference_title: "DNAJB1-PRKACA Fusion Drives Fibrolamellar Liver Cancer through Impaired SIK Signaling and CRTC2/p300-Mediated Transcriptional Reprogramming."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Patients typically lack cirrhosis or other risk factors and present with a large tumor burden and locally invasive or metastatic disease"
    explanation: States both the absent-risk-factor context and the advanced stage at presentation.

- name: Ornithine Transcarbamylase Suppression
  description: >-
    Tumour tissue shows raised Aurora kinase A, c-MYC and ornithine
    decarboxylase with reduced ornithine transcarbamylase. Suppressing a urea
    cycle enzyme is how a liver tumour comes to phenocopy an inborn error of
    metabolism.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: OTC
    term:
      id: hgnc:8512
      label: OTC
  - preferred_term: ODC1
    term:
      id: hgnc:8109
      label: ODC1
  biological_processes:
  - preferred_term: urea cycle
    modifier: DECREASED
    term:
      id: GO:0000050
      label: urea cycle
  downstream:
  - target: Hyperammonemic Encephalopathy
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36788919
    reference_title: "Molecular Basis of Hyperammonemic Encephalopathy in Fibrolamellar Hepatocellular Carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fibrolamellar carcinoma and adenomyomatosis samples presented increased expression of Aurora kinase A, c-MYC, and ornithine decarboxylase when compared to normal liver, while ornithine transcarbamylase was decreased."
    explanation: >-
      Measures every enzyme in the proposed chain in human tumour tissue, which
      is what this node records.

- name: Hyperammonemic Encephalopathy
  description: >-
    A paraneoplastic encephalopathy driven by the tumour's own suppression of
    urea cycle capacity rather than by liver failure. It is the reason a
    fibrolamellar carcinoma patient can present looking like a urea cycle
    disorder while their non-tumour liver function is preserved.
  biological_scale: ORGANISM


    Parallel collagen bands encircling nests of tumour cells, the feature the
    disease is named for.
  finding_term:
    preferred_term: lamellar fibrous bands
  diagnostic: true

- name: Large Eosinophilic Mitochondria-Rich Polygonal Cells
  description: >-
    Large polygonal tumour cells with granular eosinophilic, mitochondria-rich

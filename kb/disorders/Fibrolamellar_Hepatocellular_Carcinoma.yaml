  finding_term:
    preferred_term: large polygonal cells with granular eosinophilic cytoplasm
  evidence:
  - reference: PMID:28923495
    reference_title: "CRISPR/Cas9 Engineering of Adult Mouse Liver Demonstrates That the Dnajb1-Prkaca Gene Fusion Is Sufficient to Induce Tumors Resembling Fibrolamellar Hepatocellular Carcinoma."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "large polygonal cells with granular, eosinophilic, and mitochondria-rich cytopla"
    explanation: >-
      Describes the cytology this finding records. Quoted from the mouse-model
      paper's description of tumours reproducing the human histology; the
      snippet ends mid-word because the cached abstract truncates there.

diagnosis:
- name: DNAJB1-PRKACA Fusion Detection
  description: >-
    RT-PCR, FISH for PRKACA rearrangement, or RNA in situ hybridisation. The
    fusion is the diagnostic test because it is both near-universal in this
    tumour and absent from the tumours that mimic it - including scirrhous
    hepatocellular carcinoma, the closest histologic mimic.
  evidence:
  - reference: PMID:25698061
    reference_title: "DNAJB1-PRKACA is specific for fibrolamellar carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the DNAJB1-PRKACA fusion transcript was found in all fibrolamellar carcinomas but not in other tumor types"
    explanation: >-
      The specificity result across 106 liver tumours that makes fusion
      detection diagnostic rather than merely supportive.
  - reference: PMID:25698061
    reference_title: "DNAJB1-PRKACA is specific for fibrolamellar carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Rearrangements of the PRKACA locus was seen in all 19 fibrolamellar carcinoma specimens, but in none of the scirrhous hepatocellular carcinomas."
    explanation: >-
      Separates the tumour from its closest histologic mimic, which is the
      discrimination the test is used for.

differential_diagnoses:
- name: Scirrhous Hepatocellular Carcinoma
  description: >-
    The closest histologic mimic, sharing a fibrous stroma. PRKACA
    rearrangement testing separates them cleanly.
  evidence:
  - reference: PMID:25698061
    reference_title: "DNAJB1-PRKACA is specific for fibrolamellar carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FISH was tested in 19 fibrolamellar carcinomas and in 6 scirrhous hepatocellular carcinomas, which can closely mimic fibrolamellar carcinoma."
    explanation: Names the mimic and the assay used to distinguish it.

- name: Conventional Hepatocellular Carcinoma
  description: >-
    Distinguished by patient age, absent cirrhosis and risk factors, normal
    alpha-fetoprotein, and a genomic landscape that whole-genome sequencing
    shows to be different.
  evidence:
  - reference: PMID:25605237
    reference_title: "The genomic landscape of fibrolamellar hepatocellular carcinoma: whole genome sequencing of ten patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mutations, altered pathways and structural variants that characterized fibrolamellar hepatocellular carcinoma were distinct from those in hepatocellular carcinoma, further defining it as a distinct carcinoma."
    explanation: >-
      The genomic argument that this is a separate entity rather than an HCC
      variant - the basis for curating it as its own entry.

genetic:
- name: DNAJB1-PRKACA
  gene_term:
    preferred_term: PRKACA
    term:
      id: hgnc:9380
      label: PRKACA
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  frequency: present in essentially all fibrolamellar carcinomas; 15/15 in the founding series
  notes: >-
    Curated as a structural fusion rather than a sequence variant. `gene_term`
    carries PRKACA because the slot is single-valued and the catalytic activity
    resides there; DNAJB1 (hgnc:5270) contributes the amino-terminal
    chaperone-binding domain and is bound on the pathophysiology node.
  evidence:
  - reference: PMID:24578576
    reference_title: "Detection of a recurrent DNAJB1-PRKACA chimeric transcript in fibrolamellar hepatocellular carcinoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Evidence supporting the presence of the DNAJB1-PRKACA chimeric transcript in 100% of the FL-HCCs examined (15/15) suggests that this genetic alteration contributes to tumor pathogenesis."
    explanation: The founding recurrence figure.
  - reference: PMID:25605237
    reference_title: "The genomic landscape of fibrolamellar hepatocellular carcinoma: whole genome sequencing of ten patients."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The lack of a second-hit mutation in the genomic landscape of fibrolamellar hepatocellular carcinoma makes the DNAJB1-PRKACA fusion protein the best target for diagnostic and therapeutic advancements."
    explanation: >-
      Establishes the absence of a recurrent cooperating lesion, which is why
      this entry treats the fusion as the driver rather than one of several.

treatments:
- name: Surgical Resection
  description: >-
    Hepatectomy is the mainstay and the only modality with a demonstrated
    survival effect in population data. Patients not treated surgically had
    roughly three times the risk of death.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Hepatectomy
    term:
      id: NCIT:C15249
      label: Hepatectomy
  target_mechanisms:
  - target: Hepatic Mass in a Non-Cirrhotic Liver
    description: >-
      Resection removes the tumour bulk; because the background liver is not
      cirrhotic, more of it can be taken than in conventional hepatocellular
      carcinoma.
  evidence:
  - reference: PMID:32052215
    reference_title: "Fibrolamellar Hepatocellular Carcinoma: A Population-Based Observational Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients who were not treated with surgical intervention had about 3 times increased risk for death (HR 2.8, 95% CI 1.68-4.72, P = 0.000)."
    explanation: The population-based effect estimate this treatment rests on.

- name: Cytotoxic Chemotherapy
  description: >-
    Curated as a treatment that does not work. Chemotherapy is given to nearly
    half of patients in population data yet has no measurable effect on
    outcome, and the tumours were described as poorly chemoresponsive from the
    founding report onward. Recording the negative result is the point.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
  evidence:
  - reference: PMID:32052215
    reference_title: "Fibrolamellar Hepatocellular Carcinoma: A Population-Based Observational Study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Radiation and chemotherapy did not significantly affect outcomes."
    explanation: >-
      Graded REFUTE because it contradicts the claim that this treatment
      benefits patients. The same sentence covers radiation.
  - reference: PMID:39326063
    reference_title: "DNAJB1-PRKACA Fusion Drives Fibrolamellar Liver Cancer through Impaired SIK Signaling and CRTC2/p300-Mediated Transcriptional Reprogramming."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "There are no standard treatments for advanced FLC, and clinical trials with targeted, conventional, and immune therapies have shown limited benefit."
    explanation: >-
      Supports the description's claim that no systemic option is established,
      across drug classes rather than only cytotoxics.

prevalence:
- population: United States, SEER 2000-2016
  measure_type: ANNUAL_INCIDENCE
  prevalence_class: BELOW_1_IN_1000000
  rate_per_100000: 0.02
  rate_denominator: POPULATION_PER_YEAR
  notes: Age-adjusted incidence from 300 SEER-registered cases.
  evidence:
  - reference: PMID:32052215
    reference_title: "Fibrolamellar Hepatocellular Carcinoma: A Population-Based Observational Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The overall age-adjusted incidence of FLC between 2000 and 2016 was 0.02 per 100,000 per year."
    explanation: The population-based incidence figure this record normalizes.

epidemiology:
- name: Young Age at Diagnosis
  description: >-
    Median age at diagnosis is 27, decades below conventional hepatocellular
    carcinoma. The SEER distribution is bimodal, with a second peak in the
    eighth decade that is less often emphasised in the clinical literature.
  evidence:
  - reference: PMID:32052215
    reference_title: "Fibrolamellar Hepatocellular Carcinoma: A Population-Based Observational Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median age at diagnosis was 27 ± 22 years."
    explanation: The median age this record reports.
  - reference: PMID:32052215
    reference_title: "Fibrolamellar Hepatocellular Carcinoma: A Population-Based Observational Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A bimodal distribution was observed where the highest incidences occurred between 15-19 years and 70-74 years."
    explanation: >-
      The bimodality, which the "adolescents and young adults" framing common
      elsewhere in the literature omits.

progression:
- phase: Population-Based Survival
  notes: >-
    SEER cause-specific survival is 72.0% at one year and 32.9% at five, with a
    median of 32.9 months - roughly three times the 11.7-month median for
    conventional hepatocellular carcinoma in the same analysis.
  evidence:
  - reference: PMID:32052215
    reference_title: "Fibrolamellar Hepatocellular Carcinoma: A Population-Based Observational Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One- and 5-year cause-specific survival for FLC was 72.0% and 32.9%, respectively, with a median survival of 32.9 months."
    explanation: The all-stage survival figures this phase records.

- phase: Advanced Disease
  notes: >-
    Five-year overall survival is under 10% once disease is advanced. This is
    not in conflict with the SEER figure above: that one is all-stage and
    cause-specific, this one is restricted to advanced disease. The two are
    recorded separately rather than reconciled.
  evidence:
  - reference: PMID:39326063
    reference_title: "DNAJB1-PRKACA Fusion Drives Fibrolamellar Liver Cancer through Impaired SIK Signaling and CRTC2/p300-Mediated Transcriptional Reprogramming."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Outcomes are poor for advanced disease, with a 5-year overall survival of less than 10%"
    explanation: The advanced-disease survival figure, whose population differs from the SEER record above.

animal_models:
- name: CRISPR/Cas9 Dnajb1-Prkaca fusion mouse
  species: Mouse
  genotype: Dnajb1-Prkaca fusion engineered by CRISPR/Cas9 deletion of the syntenic chromosome 8 region
  description: >-
    CRISPR/Cas9 vectors delivered by hydrodynamic tail vein injection to adult
    FVB/N mouse liver, juxtaposing Dnajb1 exon 1 with Prkaca exon 2. The mice
    carried no other engineered alteration and were exposed to no liver toxin
    or carcinogen, which is what makes this a sufficiency experiment rather
    than a cooperation one.
  publication: PMID:28923495
  modeled_mechanisms:
  - target: Hepatocyte Transformation and Clonal Proliferation
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: ORGANISM
    description: >-
      The fusion alone produced neoplasms in 12 of 15 mice and none of 11
      controls, with histologic and cytologic features of human tumours.
    limitations: >-
      Tumours are described as indolent in the companion model, and the
      14-month latency is long relative to the human disease course, so the
      model reproduces initiation better than it reproduces tempo.
    evidence:
    - reference: PMID:28923495
      reference_title: "CRISPR/Cas9 Engineering of Adult Mouse Liver Demonstrates That the Dnajb1-Prkaca Gene Fusion Is Sufficient to Induce Tumors Resembling Fibrolamellar Hepatocellular Carcinoma."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Livers from 12 of the 15 mice given the vectors to induce the Dnajb1-Prkaca gene fusion, but none of the 11 mice given the control vector, developed neoplasms."
      explanation: The controlled result establishing this model as informative for the transformation node.

- name: Transposon-mediated DNAJB1-PRKACA mouse with beta-catenin activation
  species: Mouse
  genotype: DNAJB1-PRKACA chimeric cDNA or endogenous fusion, with and without activated beta-catenin
  description: >-
    CRISPR-Cas9 plus transposon-mediated somatic gene transfer, used both to
    show the fusion drives tumours and to test cooperation with beta-catenin
    and with hepatotoxin-induced injury.
  publication: PMID:29162699
  modeled_mechanisms:
  - target: Wnt/beta-Catenin Cooperation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Genetic beta-catenin activation significantly enhanced fusion-driven
      tumorigenesis.
    limitations: >-
      Cooperation is demonstrated in mouse; in humans the support is recurrent
      Wnt pathway mutations, which is an association rather than a
      demonstration, so the human claim is weaker than the mouse one.
    evidence:
    - reference: PMID:29162699
      reference_title: "DNAJB1-PRKACA fusion kinase interacts with β-catenin and the liver regenerative response to drive fibrolamellar hepatocellular carcinoma."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Tumorigenesis was significantly enhanced by genetic activation of β-catenin"
      explanation: The cooperation result this link records.

experimental_models:
- name: AML12 DNAJ-PKAc gene-edited hepatocyte line
  experimental_model_type: CELL_LINE
  description: >-
    Mouse hepatocytes gene-edited to express DNAJ-PKAc, used for the
    phosphoproteomics and drug screening that defined the Hsp70/AKAP-Lbc
    scaffolding mechanism.
  organism:
    preferred_term: mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  publication: PMID:31063128
  modeled_mechanisms:
  - target: Acquired Hsp70 Scaffolding Function
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: MOLECULAR
    description: >-
      The line reproduces the fusion's Hsp70 recruitment and ERK-biased
      signalling, and its proliferation is selectively blocked by Hsp70 plus
      MEK inhibitor combinations.
    limitations: >-
      A mouse hepatocyte line reports the signalling consequences of the fusion
      but not the tissue architecture, stroma or clinical course; nothing about
      the lamellar fibrosis can be learned from it.
    evidence:
    - reference: PMID:31063128
      reference_title: "An acquired scaffolding function of the DNAJ-PKAc fusion contributes to oncogenic signaling in fibrolamellar carcinoma."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Drug screening reveals Hsp70 and MEK inhibitor combinations that selectively block proliferation of AML12DNAJ-PKAc cells."
      explanation: >-
        Selective dependence on the scaffolding partners establishes the line
        as informative for this node.

discussions:
- discussion_id: flc_lamellar_stroma_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    How does a hepatocyte carrying the DNAJB1-PRKACA fusion induce the parallel
    lamellar collagen bands the disease is named for?
  rationale: >-
    The lamellar stroma is the tumour's defining histologic feature and the
    origin of its name, yet the entry cannot connect it to the driver. TGF-beta
    overexpression is the proposed route in the literature, but the support is
    correlative and histological rather than a demonstrated causal chain, so
    the edge from transformation to stroma is curated with unknown
    intermediates and no evidence attached. The gap matters because the
    fibrosis is not cirrhotic and the surrounding liver is normal, so whatever
    drives it is tumour-directed rather than a background process.
  attaches_to:
  - pathophysiology#Hepatocyte Transformation and Clonal Proliferation
  - pathophysiology#Lamellar Fibrous Stroma Formation

- discussion_id: flc_who5_versus_mondo_placement
  kind: INTERPRETATION
  prompt: >-
    Is fibrolamellar carcinoma a subtype of hepatocellular carcinoma or a
    separate entity, and what should the entry assert?
  rationale: >-
    MONDO places MONDO:0006210 under hepatocellular carcinoma, and this entry's
    `parents` follows it. The evidence curated here points the other way: the
    genomic landscape is distinct, the driver is absent from conventional
    hepatocellular carcinoma and from every other liver tumour tested, the
    patient population and risk-factor profile do not overlap, and the
    published sequencing describes it as "a distinct carcinoma". The entry does
    not attempt to resolve the ontology question - it uses MONDO's term and
    hierarchy as given, curates the evidence that bears on the placement, and
    records the disagreement here rather than silently asserting either answer.
  attaches_to:
  - disease#Fibrolamellar Hepatocellular Carcinoma
  - differential_diagnoses#Conventional Hepatocellular Carcinoma

notes: >-
  Promotion from a subtype row. Before this entry, fibrolamellar carcinoma
  existed in the knowledge base only as a `has_subtypes` row on
  `Hepatocellular_Carcinoma`. It is promoted here under the cancer granularity
  ladder (design decisions 3a): it has its own MONDO term, its own driver
  lesion, a distinct patient population, and a distinct treatment pathway. The
  pointer row is deliberately left in place on the parent rather than deleted,
  so a reader arriving at the hepatocellular carcinoma entry is still told the
  variant exists and where it went.

  Ontology placement is contested and not resolved here. See the
  `flc_who5_versus_mondo_placement` discussion. `parents` follows MONDO.

  Two survival figures that describe different populations. SEER gives 32.9%
  five-year cause-specific survival across all stages; a 2024 review gives
  under 10% five-year overall survival in advanced disease. These are not in
  conflict and are not averaged - they are curated as separate `progression`
  phases with their populations stated.

  A phenotype and a treatment are curated as negative findings. Normal
  alpha-fetoprotein is bound to the HP term for *elevated* AFP with
  `supports: REFUTE`, because the discriminating observation in this disease is
  that the value is normal. Cytotoxic chemotherapy carries a REFUTE item
  because population data show no effect on outcome despite widespread use.
  Both are recorded as negatives rather than omitted.

  Not curated. The research report describes neurotensin as a candidate
  biomarker, single-cell work on rewired SPP1-CD44 and MIF-ACKR3 signalling,
  snATAC-seq super-enhancer landscapes, and in vitro drug screens nominating
  HDAC and topoisomerase inhibitors and napabucasin. All trace to preprints or
  sources this session did not fetch, so none is included. The report also
  offered `NCIT:C158`, which does not exist, and `GO:0016575`, which is
  obsolete; neither is bound.

name: Fibrolamellar Hepatocellular Carcinoma
creation_date: '2026-09-07T00:00:00Z'
description: >-
  Fibrolamellar carcinoma is a rare primary liver cancer of adolescents and
  young adults arising in non-cirrhotic livers, driven in nearly all cases by a
  DNAJB1-PRKACA fusion that produces a chimeric protein kinase A catalytic
  subunit.
categories:
- Hepatobiliary Neoplasm
parents:
- hepatocellular carcinoma
disease_term:
  preferred_term: fibrolamellar carcinoma
  term:
    id: MONDO:0006210
    label: fibrolamellar hepatocellular carcinoma
synonyms:
- FLC
- FHCC
- fibrolamellar carcinoma
- fibrolamellar hepatocarcinoma
pathophysiology:
- name: DNAJB1-PRKACA Fusion Formation
  description: >-
    A recurrent chromosome 19 deletion fuses DNAJB1 to PRKACA, producing a
    chimeric protein kinase A catalytic subunit.
  biological_scale: MOLECULAR
phenotypes:
- category: Hepatic
  name: Liver Mass in a Non-Cirrhotic Liver
  description: >-
    A hepatic mass arising without underlying cirrhosis or chronic liver
    disease.

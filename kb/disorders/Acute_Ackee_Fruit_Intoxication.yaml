name: Acute Ackee Fruit Intoxication
creation_date: '2026-09-02T15:30:00Z'
description: >-
  Acute ackee fruit intoxication, long known as Jamaican vomiting sickness,
  follows eating the unripe fruit of Blighia sapida. The toxin is hypoglycin A,
  and it is harmless until the body activates it: metabolism converts it to
  methylenecyclopropylacetyl-CoA, which is a suicide substrate for acyl-CoA
  dehydrogenases. It binds the enzyme's flavin covalently and does not let go.
  Fatty acid beta-oxidation stops, so a fasting patient cannot make ketones or
  spare glucose, and the hypoglycaemia that follows is profound and unresponsive
  to the usual counter-regulation. The interest of this entry is that the
  resulting biochemistry is not merely similar to an inborn error - it is the
  same biochemistry. The urine of a poisoned patient carries the dicarboxylic
  acids of a fatty acid oxidation defect at up to a thousand times normal, and
  the acylcarnitine profile is read as multiple acyl-CoA dehydrogenase
  deficiency. One disease is inherited and one is eaten, and downstream of the
  enzyme there is nothing to tell them apart.
categories:
- Toxic Exposure Disorder
- Environmental Health Disorder
category: Complex
parents:
- Poisoning
disease_term:
  preferred_term: acute ackee fruit intoxication
  term:
    id: MONDO:0019140
    label: acute ackee fruit intoxication
pathophysiology:
- name: Hypoglycin A Ingestion
  description: >-
    Ingestion of unripe Blighia sapida arillus, which carries hypoglycin A. The
    toxin concentrates in the unripe fruit and falls as it ripens, which is why
    the disease is one of unripe fruit and of processing failure rather than of
    the plant as such.
  role: trigger
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:28613753
    reference_title: "Ackee Fruit Toxicity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Ingestion of unripe Blighia sapida fruit may precipitate the toxic metabolic
      syndrome termed "Jamaican vomiting sickness."
    explanation: >-
      Names the exposure and the syndrome it produces.
  - reference: PMID:940578
    reference_title: "Jamaican vomiting sickness. Biochemical investigation of two cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This evidence links hypoglycin A to Jamaican vomiting sickness as its
      causative agent.
    explanation: >-
      Establishes hypoglycin A as the causative toxin, on the basis of its
      metabolite being found in patient urine.
  downstream:
  - target: Metabolic Activation to MCPA-CoA
    causal_link_type: DIRECT
    description: >-
      The ingested amino acid is metabolised to the species that does the damage.
      Hypoglycin A is a protoxin; nothing happens until the body converts it.
- name: Metabolic Activation to MCPA-CoA
  description: >-
    Conversion of hypoglycin A to methylenecyclopropylacetyl-CoA. This is a
    bioactivation poisoning: the parent amino acid is not the inhibitor, and the
    CoA thioester is. Its free acid, MCPA, is what appears in the urine of
    poisoned patients and its carnitine conjugate is what is measured in serum.
  role: intermediate
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:940578
    reference_title: "Jamaican vomiting sickness. Biochemical investigation of two cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified methylenecyclopropylacetic acid, a known metabolite of
      hypoglycin A, in the urine of two patients with Jamaican vomiting sickness.
    explanation: >-
      Demonstrates the metabolite in humans with the disease, which is what makes
      this an activation step rather than an inference from animal work.
  - reference: PMID:23773055
    reference_title: "Identification of methylenecyclopropyl acetic acid in serum of European horses with atypical myopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Methylenecyclopropyl acetic acid-carnitine at high concentrations (20.39 ±
      17.24 nmol/l; range 0.95-57.63 nmol/l; reference: <0.01 nmol/l) was
      identified in serum of AM but not disease controls (0.00 ± 0.00 nmol/l).
    explanation: >-
      Quantifies the carnitine conjugate against controls. This is the equine
      disease caused by the same toxin from Acer seeds, not ackee poisoning, and
      is cited for the metabolite rather than for the disease.
  downstream:
  - target: Acyl-CoA Dehydrogenase Suicide Inactivation
    causal_link_type: DIRECT
    description: >-
      MCPA-CoA is itself the inhibitor. Unlike a normal substrate it is not turned
      over into a product; it reacts with the enzyme and stays.
    evidence:
    - reference: PMID:1247597
      reference_title: "Selective inhibition of acyl-CoA dehydrogenases by a metabolite of hypoglycin."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Unlike normal substrates of the acyl-CoA dehydrogenases, the compound
        itself, and not a reaction product, is inhibitory.
      explanation: >-
        States that the inhibitor is MCPA-CoA rather than anything downstream of
        it, which is the claim of this edge.
- name: Acyl-CoA Dehydrogenase Suicide Inactivation
  description: >-
    Covalent, irreversible inactivation of acyl-CoA dehydrogenases. MCPA-CoA
    modifies the enzyme's FAD, taking activity to under 2 percent, and the
    modification is not reversed by removing the compound. This is the node the
    whole entry turns on, and it is where the poisoning and the inherited disease
    become the same problem.
  role: central_effector
  biological_scale: MOLECULAR
  conforms_to: "metabolic_intoxication_decompensation#Enzymatic Block in Intermediary Metabolism"
  molecular_functions:
  - preferred_term: acyl-CoA dehydrogenase activity
    term:
      id: GO:0003995
      label: acyl-CoA dehydrogenase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:7275979
    reference_title: "Inactivation of general acyl-CoA dehydrogenase from pig kidney by a metabolite of hypoglycin A."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Pig kidney general acyl-CoA dehydrogenase is irreversibly inactivated by
      methylenecyclopropylacetyl-CoA, a metabolite of the hypoglycemic amino acid
      hypoglycin from Blighia sapida, to less that 2% of native activity.
    explanation: >-
      Gives the irreversibility and the residual activity. Pig kidney enzyme in
      vitro.
  - reference: PMID:7275979
    reference_title: "Inactivation of general acyl-CoA dehydrogenase from pig kidney by a metabolite of hypoglycin A."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      During inactivation, about 80% of the enzyme FAD is covalently and
      irreversibly modified with the residual inhibition possibly resulting from
      modification of the protein.
    explanation: >-
      Identifies the flavin as the modified target, which is what makes this a
      suicide inactivation rather than reversible inhibition.
  - reference: PMID:1247597
    reference_title: "Selective inhibition of acyl-CoA dehydrogenases by a metabolite of hypoglycin."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Extracts of liver mitochondria from donor rats given hypoglycin, the toxic
      amino acid from the ackee plant (Blighia sapida) showed drastically reduced
      levels of acyl-CoA dehydrogenase activity with butyryl-CoA as substrate.
    explanation: >-
      Demonstrates the loss of activity in an animal dosed with the toxin rather
      than in an enzyme preparation alone.
  downstream:
  - target: Impaired Fatty Acid Beta-Oxidation
    causal_link_type: DIRECT
    description: >-
      With the dehydrogenases inactivated, the beta-oxidation spiral cannot turn.
    evidence:
    - reference: PMID:1247597
      reference_title: "Selective inhibition of acyl-CoA dehydrogenases by a metabolite of hypoglycin."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The observed effect is consistent with quite general inhibition of fatty
        acid beta-oxidation by hypoglycin.
      explanation: >-
        The authors' own reading of what the enzyme inhibition means for the
        pathway, and stated as a consistency rather than a demonstration. Graded
        OTHER because this is the whole-study conclusion, spanning both the in
        vivo rat arm and the rabbit enzyme-preparation arm, rather than a result
        from either alone.
  notes: >-
    This node is curated as a block across several acyl-CoA dehydrogenases, not as
    a block of one named enzyme, because the sources disagree about which.


    The clinical and veterinary literature supports the broad claim and uses a
    name for it: hypoglycin A causes an ACQUIRED multiple acyl-CoA dehydrogenase
    deficiency, with acylcarnitine and organic acid profiles read as MADD. That is
    what this entry asserts.


    The narrower claim, common in reviews, is that MCPA-CoA inhibits the
    MEDIUM-chain enzyme specifically, which would make this an MCAD phenocopy. The
    two enzyme papers cited here report the opposite for that substrate: activity
    with octanoyl-CoA and palmitoyl-CoA was unaffected in hypoglycin-dosed rat
    liver mitochondria, and octanoyl-CoA affords strong protection against the
    inactivation, while butyryl-CoA activity was the sensitive one. Those results
    are from 1976 and 1981, in rat and pig preparations, and they are not the last
    word. They are enough that this entry declines to name the medium-chain enzyme
    as the target, and keeps MCAD deficiency as a differential rather than as the
    match. A modern isoform-resolved inhibition study in human enzyme would settle
    it and is the right addition.
- name: Impaired Fatty Acid Beta-Oxidation
  description: >-
    The beta-oxidation spiral stalls across multiple chain lengths. Acyl groups
    back up and leave as dicarboxylic acids and acylcarnitines, which is what
    makes the poisoning legible in a urine or blood sample - and legible as an
    inherited disease, because the profile is the one those diseases produce.
  role: intermediate
  biological_scale: CELLULAR
  conforms_to: "metabolic_intoxication_decompensation#Toxic Metabolite Accumulation and Energy Deficit"
  biological_processes:
  - preferred_term: fatty acid beta-oxidation
    term:
      id: GO:0006635
      label: fatty acid beta-oxidation
    modifier: DECREASED
  evidence:
  - reference: PMID:940578
    reference_title: "Jamaican vomiting sickness. Biochemical investigation of two cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The amounts of these dicarboxylic acids were 70 to 1000 times higher than
      normal.
    explanation: >-
      Quantifies the metabolite backup in human patients. Dicarboxylic aciduria at
      this magnitude is the signature of a beta-oxidation block.
  - reference: PMID:23167695
    reference_title: "Seasonal pasture myopathy/atypical myopathy in North America associated with ingestion of hypoglycin A within seeds of the box elder tree."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Hypoglycin A, known to cause acquired multiple acyl-CoA dehydrogenase
      deficiency (MADD), was found in box elder seeds.
    explanation: >-
      States the multi-enzyme character of the block in the term the literature
      uses for it. The study is equine, and the mechanism claim is about the toxin
      rather than about the species.
  downstream:
  - target: Failure of Ketogenesis and Gluconeogenesis
    causal_link_type: DIRECT
    description: >-
      Without beta-oxidation the liver has neither the acetyl-CoA to make ketones
      nor the reducing equivalents and ATP that gluconeogenesis runs on.
- name: Failure of Ketogenesis and Gluconeogenesis
  description: >-
    The two fasting responses fail together. Ketone bodies are not made, so the
    brain has no alternative fuel, and glucose is not made, so the supply is not
    replaced. This is why the hypoglycaemia is described as profound rather than
    merely present, and why it recurs after correction while the enzyme block
    lasts.
  role: intermediate
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: ketone body biosynthetic process
    term:
      id: GO:0046951
      label: ketone body biosynthetic process
    modifier: DECREASED
  - preferred_term: gluconeogenesis
    term:
      id: GO:0006094
      label: gluconeogenesis
    modifier: DECREASED
  downstream:
  - target: Profound Hypoglycemia and Acute Metabolic Decompensation
    causal_link_type: DIRECT
    description: >-
      With neither route available, blood glucose falls and is not defended.
  notes: >-
    The mechanistic step from a beta-oxidation block to failed ketogenesis and
    gluconeogenesis is standard metabolic physiology and is not separately
    evidenced here; the sources cited in this entry establish the enzyme block at
    one end and the profound hypoglycaemia at the other. A source measuring
    ketone bodies or gluconeogenic flux in ackee poisoning would be the right
    addition.
- name: Profound Hypoglycemia and Acute Metabolic Decompensation
  description: >-
    Severe hypoglycaemia with vomiting, the presentation that names the disease.
    Vomiting is repetitive and early; the hypoglycaemia is what kills.
  role: intermediate
  biological_scale: ORGANISM
  conforms_to: "metabolic_intoxication_decompensation#Acute Metabolic Decompensation"
  evidence:
  - reference: PMID:28613753
    reference_title: "Ackee Fruit Toxicity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Clinical manifestations typically include repetitive vomiting, altered
      mental status, and profound hypoglycemia.
    explanation: >-
      Gives the presenting triad this node covers.
  downstream:
  - target: Acute Encephalopathy and Death
    causal_link_type: DIRECT
    description: >-
      Neuroglycopenia in a brain that also has no ketones to fall back on.
  - target: Hypoglycemia
    causal_link_type: DIRECT
    description: >-
      The measured low glucose.
  - target: Vomiting
    causal_link_type: DIRECT
    description: >-
      The presenting symptom that names the disease.
- name: Acute Encephalopathy and Death
  description: >-
    Altered mental status progressing to seizures, hypothermia, coma and death in
    severe cases. The brain is hit twice - it is short of glucose and it has no
    ketone alternative, because the same block removed both.
  role: outcome
  biological_scale: ORGANISM
  conforms_to: "metabolic_intoxication_decompensation#Acute Metabolic Encephalopathy"
  evidence:
  - reference: PMID:28613753
    reference_title: "Ackee Fruit Toxicity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Severe toxicity may result in seizures, hypothermia, coma, and death.
    explanation: >-
      Gives the severe end of the course this node names.
  downstream:
  - target: Encephalopathy
    causal_link_type: DIRECT
    description: >-
      Altered mental status as the clinical readout.
  - target: Seizure
    causal_link_type: DIRECT
    description: >-
      Seizures in severe poisoning.
  - target: Hypothermia
    causal_link_type: DIRECT
    description: >-
      Hypothermia in severe poisoning.
  - target: Coma
    causal_link_type: DIRECT
    description: >-
      Loss of consciousness in severe poisoning.
discussions:
- discussion_id: mcpg_second_toxin_in_ackee
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does methylenecyclopropylglycine contribute to acute ackee fruit
    intoxication, alongside hypoglycin A?
  attaches_to:
  - pathophysiology#Acyl-CoA Dehydrogenase Suicide Inactivation
  rationale: >-
    Ackee shares a family with litchi and with the maples, and in those the
    picture is a two-toxin one. Hypoglycin A becomes MCPA-CoA and inhibits the
    acyl-CoA dehydrogenases, which is the first step of beta-oxidation and the
    mechanism this entry curates. Methylenecyclopropylglycine becomes MCPF-CoA and
    inhibits the enoyl-CoA hydratases, which is the second step. If both toxins
    act in ackee poisoning then the block is at two points in the same spiral
    rather than one, and the entry's central node is incomplete.


    What is established is that the MCPG metabolite appears in urine after a
    healthy adult eats ackee. What is not established is any role in the disease:
    MCPG exposure has not been evaluated in cases of Jamaican vomiting sickness.
    This entry therefore curates the hypoglycin A arm alone and records the second
    toxin here rather than in the pathograph.
  proposed_experiments:
  - experiment_id: mcpg_quantification_in_jvs_cases
    name: Quantify MCPG and MCPF-glycine in confirmed Jamaican vomiting sickness
    description: >-
      Measure methylenecyclopropylglycine and its urinary metabolite
      methylenecyclopropylformyl-glycine in a series of laboratory-confirmed
      cases, against ackee-exposed but asymptomatic controls who ate the same
      meals. The assay exists; it has not been applied to this disease.
    decision_criterion: >-
      MCPG or MCPF-glycine present in cases at concentrations separating them from
      exposed asymptomatic controls.
    supporting_outcome:
    - MCPG contributes to ackee poisoning and the pathograph needs a second toxin
      arm ending at the enoyl-CoA hydratase step.
    refuting_outcome:
    - Hypoglycin A acts alone in this disease and the single-toxin chain curated
      here is complete.
  - experiment_id: enoyl_hydratase_signature_in_human_ackee_poisoning
    name: Test for a hydratase block in human ackee poisoning
    description: >-
      Look for the acylcarnitine signature of a long-chain enoyl-CoA hydratase
      block in confirmed human cases. In the foal where that block was
      demonstrated it showed as accumulation of tetradecenoyl and hexadecenoyl
      carnitine, which is distinguishable from the dehydrogenase pattern.
    decision_criterion: >-
      Long-chain unsaturated acylcarnitines raised out of proportion to the
      short-chain species that a dehydrogenase block alone would produce.
    supporting_outcome:
    - A second enzymatic target operates in human ackee poisoning.
    refuting_outcome:
    - The block is confined to the dehydrogenase step in this disease.
  evidence:
  - reference: PMID:30056267
    reference_title: "Quantification of hypoglycin A and methylenecyclopropylglycine in human plasma by HPLC-MS/MS."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      To date, MCPG exposure has not been evaluated in cases of JVS
    explanation: >-
      States the gap directly. This is what makes the question open rather than
      answered either way.
  - reference: PMID:30056267
    reference_title: "Quantification of hypoglycin A and methylenecyclopropylglycine in human plasma by HPLC-MS/MS."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      These results created a renewed interest in cases of JVS, with respect to
      whether MCPG may be a causative agent along with HGA.
    explanation: >-
      Establishes that the question is live in the field, following detection of
      the MCPG metabolite in urine after ackee ingestion.
  - reference: PMID:34765670
    reference_title: "Severe Inhibition of Long-Chain Acyl-CoA Enoylhydratase (EC 4.2.1.74) in a Newborn Foal Suffering From Atypical Myopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      They inhibit mitochondrial acyl-CoA dehydrogenases and enoyl-CoA hydratases
      involved in the ß-oxidation of fatty acids
    explanation: >-
      Gives the two-enzyme framework that would apply if MCPG proves to act in
      ackee poisoning. The statement is made for the maple toxins in horses, not
      for ackee in humans, which is precisely the gap.
  notes: >-
    Raised from a deep-research report that presented the dual-target mechanism as
    established for this disease. It is established for litchi and for maple
    poisoning. For ackee it is not, and the report did not carry that distinction.
differential_diagnoses:
- name: Multiple acyl-CoA dehydrogenase deficiency
  disease_term:
    preferred_term: multiple acyl-CoA dehydrogenase deficiency
    term:
      id: MONDO:0009282
      label: multiple acyl-CoA dehydrogenase deficiency
  description: >-
    The closest genetic phenocopy, and the one the literature names outright when
    it calls hypoglycin poisoning an acquired MADD. The lesions sit one rung apart
    on the same electron path: inherited MADD disables the electron transfer
    flavoprotein or its dehydrogenase, so the acyl-CoA dehydrogenases cannot pass
    their electrons on, while hypoglycin destroys those dehydrogenases directly.
    Different molecule, same functional block, and the acylcarnitine and organic
    acid profiles do not separate them.
  distinguishing_features:
  - Exposure history of unripe ackee ingestion, with onset in hours rather than a
    lifelong or episodic course
  - Recovery of the metabolic profile after the exposure ends, since the enzyme is
    resynthesised
  - ETFA, ETFB and ETFDH sequencing negative
  evidence:
  - reference: PMID:23167695
    reference_title: "Seasonal pasture myopathy/atypical myopathy in North America associated with ingestion of hypoglycin A within seeds of the box elder tree."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Serum acylcarnitines and urine organic acid profiles in SPM horses were
      typical for MADD.
    explanation: >-
      Establishes that the biochemical profile of hypoglycin poisoning is read as
      MADD, which is what makes this the differential rather than a loose
      resemblance. Demonstrated in horses.
- name: Medium-chain acyl-CoA dehydrogenase deficiency
  disease_term:
    preferred_term: medium chain acyl-CoA dehydrogenase deficiency
    term:
      id: MONDO:0008721
      label: medium chain acyl-CoA dehydrogenase deficiency
  description: >-
    Frequently named as the phenocopy in secondary sources, and kept here as a
    differential rather than as the match. MCAD deficiency also presents with
    hypoketotic hypoglycaemia after fasting and also produces dicarboxylic
    aciduria, so it belongs on the list. What it does not have is support from the
    enzyme work: the medium-chain substrate was the one spared in the primary
    inhibition studies.
  distinguishing_features:
  - Exposure history, and resolution after withdrawal
  - ACADM sequencing negative; newborn screening acylcarnitine profile normal in
    an unaffected individual
  evidence:
  - reference: PMID:1247597
    reference_title: "Selective inhibition of acyl-CoA dehydrogenases by a metabolite of hypoglycin."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Activity with octanoyl- and palmitoyl-CoA was unaffected.
    explanation: >-
      Supports keeping MCAD deficiency as a differential rather than treating it
      as the phenocopy. Octanoyl-CoA is the medium-chain substrate and it was
      spared in hypoglycin-dosed rat liver mitochondria, so the resemblance to
      MCAD deficiency is clinical rather than enzyme-level. Graded
      MODEL_ORGANISM: this observation is from rats given the toxin, not from the
      accompanying enzyme-preparation work in the same paper.
- name: Reye syndrome
  description: >-
    The historical confusion, and a diagnosis that ackee poisoning was mistaken
    for. The paper that separated them describes the resemblance as both clinical
    and histologic without this entry curating the histology, so the resemblance
    is stated at that level and no biopsy finding is asserted here. What does
    separate them is the biochemistry: the abnormal urinary organic acids of ackee
    poisoning are not appreciably raised in Reye syndrome.
  distinguishing_features:
  - Urinary dicarboxylic acids and MCPA, absent or unremarkable in Reye syndrome
  - Exposure history of unripe ackee
  evidence:
  - reference: PMID:940578
    reference_title: "Jamaican vomiting sickness. Biochemical investigation of two cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      despite their clinical and histologic similarities, the cause and
      biochemical mechanisms of Jamaican vomiting sickness differ distinctly from
      those of Reye's syndrome
    explanation: >-
      States both the resemblance and the biochemical basis for separating them,
      in the paper that made the distinction.
biochemical:
- name: Urinary dicarboxylic acids
  presence: INCREASED
  context: >-
    The finding that makes this poisoning legible as a fatty acid oxidation
    defect. Named species are 2-ethylmalonic, 2-methylsuccinic, glutaric and
    adipic acid, along with eight and ten carbon chains, at 70 to 1000 times
    normal in two patients. This is the profile an inherited beta-oxidation
    disorder produces, which is the whole basis of the phenocopy.
  readouts:
  - target: Impaired Fatty Acid Beta-Oxidation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Accumulated acyl groups leave by an alternative route when beta-oxidation
      cannot consume them, so the magnitude of the dicarboxylic aciduria reports
      the depth of the block.
    evidence:
    - reference: PMID:940578
      reference_title: "Jamaican vomiting sickness. Biochemical investigation of two cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The amounts of these dicarboxylic acids were 70 to 1000 times higher than
        normal.
      explanation: >-
        Quantifies the excretion against normal in the two human cases.
  evidence:
  - reference: PMID:940578
    reference_title: "Jamaican vomiting sickness. Biochemical investigation of two cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Excretion of unusual dicarboxylic acids such as 2-ethylmalonic,
      2-methylsuccinic, glutaric, adipic and dicarboxylic acids with eight and 10
      carbon chains were also detected in both patients.
    explanation: >-
      Names the individual analytes, which is what allows this to be compared with
      the profile of an inherited disorder rather than described in general terms.
  - reference: PMID:940578
    reference_title: "Jamaican vomiting sickness. Biochemical investigation of two cases."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These metabolites have also been identified in urine of hypoglycin-treated
      rats.
    explanation: >-
      The same profile in animals given the toxin, which ties the human finding to
      hypoglycin rather than to the illness in general.
- name: Urinary short-chain fatty acids
  presence: INCREASED
  context: >-
    Raised up to 300 times normal in the same two patients. Short-chain species
    accumulating is consistent with the enzyme evidence, where the short-chain
    substrate was the sensitive one.
  readouts:
  - target: Impaired Fatty Acid Beta-Oxidation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Reports the same block at the short-chain end of the spiral.
    evidence:
    - reference: PMID:940578
      reference_title: "Jamaican vomiting sickness. Biochemical investigation of two cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Urinary excretion of short-chain fatty acids was also increased up to 300
        times higher than normal.
      explanation: >-
        Quantifies the short-chain excretion in the human cases.
  evidence:
  - reference: PMID:940578
    reference_title: "Jamaican vomiting sickness. Biochemical investigation of two cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Urinary excretion of short-chain fatty acids was also increased up to 300
      times higher than normal.
    explanation: >-
      Establishes the finding and its magnitude.
- name: Acylcarnitine profile
  presence: INCREASED
  context: >-
    The profile is read as multiple acyl-CoA dehydrogenase deficiency. This is the
    measurement at which the poisoning and the inherited disease become
    indistinguishable, and it is why the differential rests on exposure history
    rather than on biochemistry.
  readouts:
  - target: Impaired Fatty Acid Beta-Oxidation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      A multi-enzyme block produces a broad acylcarnitine elevation rather than a
      single-species one, which is what makes the pattern MADD-like.
    evidence:
    - reference: PMID:23167695
      reference_title: "Seasonal pasture myopathy/atypical myopathy in North America associated with ingestion of hypoglycin A within seeds of the box elder tree."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Serum acylcarnitines and urine organic acid profiles in SPM horses were
        typical for MADD.
      explanation: >-
        States that the profile reads as MADD. Demonstrated in horses poisoned by
        the same toxin from Acer seeds, not in human ackee poisoning.
  evidence:
  - reference: PMID:23167695
    reference_title: "Seasonal pasture myopathy/atypical myopathy in North America associated with ingestion of hypoglycin A within seeds of the box elder tree."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Hypoglycin A, known to cause acquired multiple acyl-CoA dehydrogenase
      deficiency (MADD), was found in box elder seeds.
    explanation: >-
      Names the acquired MADD framing that this profile is the evidence for.
  notes: >-
    The MADD-typical acylcarnitine profile is demonstrated in horses, not in human
    ackee poisoning. Human confirmation rests on the urinary organic acids above,
    which were measured in patients. A published acylcarnitine profile from
    laboratory-confirmed human ackee poisoning would close that gap and is not
    curated here because it was not found.
- name: MCPA-carnitine
  presence: INCREASED
  context: >-
    The carnitine conjugate of the active toxin, and the analyte that identifies
    the poisoning rather than merely the metabolic block. Measured at 20.39 plus
    or minus 17.24 nmol per litre against a reference below 0.01, so the
    separation from unexposed animals is not marginal.
  readouts:
  - target: Metabolic Activation to MCPA-CoA
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Reports that the protoxin was activated, which is the step no clinical
      finding can show on its own.
    evidence:
    - reference: PMID:23773055
      reference_title: "Identification of methylenecyclopropyl acetic acid in serum of European horses with atypical myopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Methylenecyclopropyl acetic acid-carnitine at high concentrations (20.39 ±
        17.24 nmol/l; range 0.95-57.63 nmol/l; reference: <0.01 nmol/l) was
        identified in serum of AM but not disease controls (0.00 ± 0.00 nmol/l).
      explanation: >-
        Gives the concentration against controls. Equine atypical myopathy, cited
        for the analyte rather than for the disease.
  evidence:
  - reference: PMID:23773055
    reference_title: "Identification of methylenecyclopropyl acetic acid in serum of European horses with atypical myopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Atypical myopathy in Europe, like seasonal pasture myopathy in North
      America, is highly associated with the toxic metabolite of hypoglycin A,
      MCPA-carnitine.
    explanation: >-
      Establishes MCPA-carnitine as the toxin-specific marker.
  notes: >-
    The free acid MCPA was identified in the urine of two human ackee poisoning
    patients (PMID:940578, quoted on the activation node). The carnitine conjugate
    and its quantification come from horses. The entry keeps that distinction
    rather than presenting one measurement as the other.

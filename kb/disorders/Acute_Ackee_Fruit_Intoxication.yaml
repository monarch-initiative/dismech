      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      directness: INDIRECT
      snippet: Once ingested, hypoglycin A is converted by an aminotransferase in the cytosol to methylenecyclopropylpyruvate (MCP-pyruvate)
      explanation: The analytical paper summarizes the established transamination step from prior metabolic studies.
  - target: Vomiting
    description: Gastrointestinal toxicity follows exposure; vomiting is not assumed to require antecedent hypoglycemia.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:28613753
      reference_title: Ackee Fruit Toxicity.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Clinical manifestations typically include repetitive vomiting, altered mental status, and profound hypoglycemia.
      explanation: Clinical toxicology review documents this manifestation; no population frequency is assigned.
      quote_role: BACKGROUND
      directness: INDIRECT
  - target: Abdominal pain
    description: Abdominal pain was observed after the shared exposure in the Nigerian family.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:

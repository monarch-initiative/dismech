  - target: Reduced Hepatic ATP Availability
    description: Reduced fatty-acid oxidation limits reducing-equivalent supply to oxidative phosphorylation; the rat study measures the resulting nucleotide changes.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES

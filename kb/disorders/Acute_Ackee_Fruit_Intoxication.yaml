discussions:
- discussion_id: mcpg_contribution_to_ackee_illness
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: How much does co-exposure to methylenecyclopropylglycine contribute to symptomatic human ackee poisoning?
  attaches_to:
  - pathophysiology#Hypoglycin A Ingestion
  rationale: MCPG-related conjugates have been detected after ackee consumption, including in a volunteer study, but an exposed volunteer is not a clinical Jamaican vomiting sickness cohort. HGA remains the main established toxin. Quantitative clinical attribution and potential co-toxin effects remain unresolved.
  evidence:
  - reference: PMID:30056267
    reference_title: Quantification of hypoglycin A and methylenecyclopropylglycine in human plasma by HPLC-MS/MS.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: Both metabolites were detected in urine after ingestion of ackee as well as litchi fruit. These results created a renewed interest in cases of JVS, with respect to whether MCPG may be a causative agent along with HGA.
    explanation: Background summarizes the healthy-adult exposure result.
  - reference: PMID:33233889
    reference_title: Study on the Metabolic Effects of Repeated Consumption of Canned Ackee.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Rapid intestinal absorption of the toxins was followed by their slow degradation to methylenecyclopropylacetyl and methylenecyclopropylformyl conjugates.
    explanation: A single-volunteer metabolic study establishes co-exposure, not a disease-specific causal fraction.
  proposed_experiments:
  - experiment_id: paired_toxin_metabolite_sampling
    name: Prospective paired toxin and metabolite sampling
    description: Measure HGA, MCPG and conjugates over time in clinically characterized poisoning cases and asymptomatic people sharing the implicated food; record dose, preparation, nutritional status and sampling delay.
    decision_criterion: Determine whether MCPG exposure or its metabolites associate with clinical severity after accounting for HGA exposure and sampling time.
    supporting_outcome:
    - A reproducible adjusted association would support a co-toxin contribution and justify targeted mechanistic testing.
    refuting_outcome:
    - Absence of an association would weaken the proposed contribution within the sampled exposures, without proving HGA acts alone.
  notes: The 2021 foal report inferred long-chain enoyl-CoA hydratase dysfunction from acylcarnitines; no enzyme assay or genetic confirmation was available. It does not establish a corresponding human ackee mechanism.
- discussion_id: human_isoform_and_flux_translation
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: Which hepatic and extrahepatic flux defects dominate in confirmed human poisoning?
  attaches_to:
  - pathophysiology#Selective Acyl-CoA Dehydrogenase Inactivation
  - pathophysiology#Reduced Hepatic Glucose Production
  rationale: Purified enzyme, isolated cell and intravenous rat protocols differ in substrates, dose and duration. Human clinical metabolite series are small, and asymptomatic exposure can alter metabolism. Prospective clinically confirmed sampling is needed before assigning universal profiles, isoform inhibition fractions or biomarker prognostic thresholds.
  evidence:
  - reference: PMID:29483297
    reference_title: In vivo studies on the mechanism of methylene cyclopropyl acetic acid and methylene cyclopropyl glycine-induced hypoglycemia.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: While we do not have an in vivo method to probe flux through the individual steps of β-oxidation, we are able to infer the step in β-oxidation targeted by the toxin-CoA conjugates
    explanation: The rodent authors acknowledge indirect enzyme-step inference.
review_notes: Comprehensive 2026 review corrected the baseline claim that MCAD is spared, distinguished substrate protection from isoform susceptibility, and removed human/equine diagnostic equivalence. The two historical human MCPA results involved hydrolyzed urine; circulating equine conjugate values remain only in the model. Complete cached clinical, analytical and rat-mechanistic bodies were consumed, including Methods and limitations; no GeneReviews chapter applies to this acquired intoxication. Human hypoglycemia and vomiting are not obligatory, and the severe liver report is confounded. No phenotype frequency is inferred from a single family, a selected fatal-outbreak series or mixed denominators. The research report was assessed across all completeness dimensions; unsupported current mortality, generalized CoA sequestration, increased peripheral glucose disposal, alpha-oxidation wording, animal diagnostic cutoffs and unproven antidotes were excluded. Modern PMC HTML recovery uses the tracked adapter committed separately in this branch.

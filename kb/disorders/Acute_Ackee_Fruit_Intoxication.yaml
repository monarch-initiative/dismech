  - target: Selective Acyl-CoA Dehydrogenase Inactivation
    description: The activated toxin interacts with susceptible enzyme active sites and can covalently modify FAD.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:7275979
      reference_title: Inactivation of general acyl-CoA dehydrogenase from pig kidney by a metabolite of hypoglycin A.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: During inactivation, about 80% of the enzyme FAD is covalently and irreversibly modified with the residual inhibition possibly resulting from modification of the protein.
      explanation: Purified pig-kidney enzyme establishes covalent FAD modification; the percentage is assay-specific.
    - reference: PMID:2331485
      reference_title: Selective inactivation of various acyl-CoA dehydrogenases by (methylenecyclopropyl)acetyl-CoA.
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: Short-chain acyl-CoA (SCADH), medium-chain acyl-CoA (MCADH) and isovaleryl-CoA (IVDH) dehydrogenases were severely and irreversibly inactivated by MCPA-CoA, while 2-methyl-branched chain acyl-CoA dehydrogenase (2-meBCADH) was only slowly and mildly inactivated.
      explanation: Purified-enzyme comparisons establish selective multi-enzyme inhibition, including MCAD.
- name: Selective Acyl-CoA Dehydrogenase Inactivation
  description: MCPA-CoA irreversibly inhibits susceptible flavin-dependent acyl-CoA dehydrogenases. Purified-enzyme studies include short-chain, medium-chain and isovaleryl-CoA dehydrogenases, with different susceptibility of other isoforms. The less-than-2% residual activity in a pig-kidney preparation is not a universal patient value.
  role: central_effector

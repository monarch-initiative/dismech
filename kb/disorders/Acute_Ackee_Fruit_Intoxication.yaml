environmental:
- name: Ingestion of unripe ackee arillus
  description: >-
    Eating the fruit of Blighia sapida before it has opened naturally. Ripening
    is the detoxification step: hypoglycin A falls as the fruit matures and the
    pods open on their own, so the traditional rule about never forcing a pod is
    a food-safety practice with a biochemical basis. Exposure also occurs through
    canned product, which is how the disease reaches countries where the tree
    does not grow.
  exposure_term:
    preferred_term: exposure to hypoglycin A in unripe ackee fruit
    term:
      id: ECTO:0000537
      label: exposure to toxin
  food_source:
    preferred_term: akee (raw)
    term:
      id: FOODON:03301360
      label: akee (raw)
  exposure_classifications:
    hazard_agent_type:
    - classification_value: CHEMICAL
    exposure_route:
    - classification_value: ORAL
    exposure_duration:
    - classification_value: ACUTE
  influences_mechanisms:
  - target: Hypoglycin A Ingestion
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Ingestion is what delivers the protoxin the rest of the entry follows from.
    evidence:
    - reference: PMID:28613753
      reference_title: "Ackee Fruit Toxicity."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Ingestion of unripe Blighia sapida fruit may precipitate the toxic
        metabolic syndrome termed "Jamaican vomiting sickness."
      explanation: >-
        Ties ingestion of the unripe fruit to the syndrome, which is this link.
  evidence:
  - reference: PMID:8185109
    reference_title: "Jamaican vomiting sickness in Toledo, Ohio."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The toxic exposure resulted from the consumption of canned ackee.
    explanation: >-
      Documents the canned-product route named in this description, in a case
      outside the endemic area.
  - reference: PMID:30056267
    reference_title: "Quantification of hypoglycin A and methylenecyclopropylglycine in human plasma by HPLC-MS/MS."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      JVS, for example, is linked to the ingestion of unripe ackee fruit
      containing high concentrations of hypoglycin A
    explanation: >-
      Ties the disease to unripe fruit specifically, and to high toxin
      concentration in it, which is the ripening point this description rests on.
  - reference: PMID:30056267
    reference_title: "Quantification of hypoglycin A and methylenecyclopropylglycine in human plasma by HPLC-MS/MS."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Investigations of JVS have led to the regulation of imported ackee into the
      United States in order to prevent ackee poisoning
    explanation: >-
      Records the regulatory response to the imported-product route, which is the
      route the Toledo case took.
  notes: >-
    Bound to ECTO:0000537 exposure to toxin. ECTO was searched through this
    repository's adapter (sqlite:obo:ecto) for a hypoglycin- or Blighia-specific
    exposure class and none exists. The food_source binding names the raw fruit,
    which is the poisoning route; canned product is the other documented route and
    is not separately bound, because this slot takes a single term. The sources
    cited here establish that the disease follows unripe fruit carrying high
    hypoglycin A. The stronger claim in this description, that concentration falls
    as the fruit ripens and the pod opens, is the standard food-safety account and
    is not measured by them; a quantification across maturity stages would be the
    right addition.
animal_models:
- name: Equine atypical myopathy and seasonal pasture myopathy
  species: Horse
  publication: PMID:23167695
  description: >-
    A naturally occurring poisoning, not an engineered model. Horses grazing
    pastures with Acer seeds eat hypoglycin A, activate it to the same MCPA-CoA,
    and develop the same acquired multiple acyl-CoA dehydrogenase deficiency. It
    is the source of most of the quantitative biochemistry available for this
    toxin, because horses present in numbers and are sampled, and human ackee
    poisoning is sporadic and rarely sampled at the bench.
  modeled_mechanisms:
  - target: Metabolic Activation to MCPA-CoA
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The activation step is the same chemistry in both species, and the horse
      literature is where the activated metabolite has been quantified against
      controls.
    limitations: >-
      Exposure is to Acer seeds rather than to ackee. The toxin is the same
      molecule; the plant, the dose and the route are not.
    readouts:
    - name: Serum MCPA-carnitine
      target: Metabolic Activation to MCPA-CoA
      direction: INCREASED
      interpretation: >-
        Separates poisoned animals from disease controls at concentrations far
        above the stated reference.
      evidence:
      - reference: PMID:23773055
        reference_title: "Identification of methylenecyclopropyl acetic acid in serum of European horses with atypical myopathy."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Methylenecyclopropyl acetic acid-carnitine at high concentrations (20.39
          ± 17.24 nmol/l; range 0.95-57.63 nmol/l; reference: <0.01 nmol/l) was
          identified in serum of AM but not disease controls (0.00 ± 0.00 nmol/l).
        explanation: >-
          Quantifies the activated metabolite against controls in the model.
    evidence:
    - reference: PMID:23773055
      reference_title: "Identification of methylenecyclopropyl acetic acid in serum of European horses with atypical myopathy."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Atypical myopathy in Europe, like seasonal pasture myopathy in North
        America, is highly associated with the toxic metabolite of hypoglycin A,
        MCPA-carnitine.
      explanation: >-
        Establishes the model as informative for the activation step.
  - target: Impaired Fatty Acid Beta-Oxidation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The metabolic block is the same and produces the same MADD-like profile.
      What differs is which tissue fails under it.
    limitations: >-
      Horses are muscle-dominant and present with rhabdomyolysis. Human ackee
      poisoning presents with vomiting, hypoglycaemia and encephalopathy. The
      enzymatic lesion recapitulates; the clinical consequence does not, so the
      model supports the biochemistry of this entry and not its phenotypes.
    readouts:
    - name: Serum acylcarnitines and urinary organic acids
      target: Impaired Fatty Acid Beta-Oxidation
      direction: ALTERED
      interpretation: >-
        The profile is read as multiple acyl-CoA dehydrogenase deficiency, which
        is the phenocopy claim this entry is built on.
      evidence:
      - reference: PMID:23167695
        reference_title: "Seasonal pasture myopathy/atypical myopathy in North America associated with ingestion of hypoglycin A within seeds of the box elder tree."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          Serum acylcarnitines and urine organic acid profiles in SPM horses were
          typical for MADD.
        explanation: >-
          Gives the profile and its interpretation in the model.
    evidence:
    - reference: PMID:23167695
      reference_title: "Seasonal pasture myopathy/atypical myopathy in North America associated with ingestion of hypoglycin A within seeds of the box elder tree."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Hypoglycin A, known to cause acquired multiple acyl-CoA dehydrogenase
        deficiency (MADD), was found in box elder seeds.
      explanation: >-
        Ties the model to the acquired MADD mechanism this entry curates.
  notes: >-
    Declared because three of this entry's mechanistic claims rest on equine data,
    and that dependency should be visible in the structure rather than only in
    evidence explanations. The divergence matters: a reader should not take the
    horse phenotype as evidence for the human one. The foal paper carrying the
    enoyl-CoA hydratase finding (PMID:34765670) is cited in the knowledge-gap
    discussion rather than here, because that observation is a single animal with
    a suspected additional sensitivity and is not a property of the model.
treatments:
- name: Dextrose and supportive care
  description: >-
    Correction of the hypoglycaemia and fluid resuscitation. There is no antidote
    and nothing that reverses the enzyme, because the inactivation is covalent -
    recovery waits on the cell synthesising new dehydrogenase. Glucose is
    therefore not a cure but a substitute for the fuel the patient cannot make,
    and it has to be sustained rather than given once.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
    therapeutic_agent:
    - preferred_term: dextrose
      term:
        id: CHEBI:17234
        label: glucose
  evidence:
  - reference: PMID:28613753
    reference_title: "Ackee Fruit Toxicity."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Management consists of supportive care, including intravenous fluid
      resuscitation and correction of hypoglycemia with dextrose administration.
    explanation: >-
      States the management, and by naming only supportive measures establishes
      the absence of a specific therapy.
  notes: >-
    The reasoning in this description about why recovery must wait on enzyme
    resynthesis follows from the irreversibility curated on the inactivation node,
    not from the treatment source, which states the management without explaining
    it.

  publication: PMID:7275979
  modeled_mechanisms:
  - target: Selective Acyl-CoA Dehydrogenase Inactivation
    relationship: MEASURES
    fidelity: MODERATE
    description: Purified pig-kidney enzyme loses nearly all activity with covalent FAD modification.
    limitations: The assay-specific residual activity is not a human tissue measurement; protection by octanoyl-CoA indicates active-site competition, not MCAD sparing.
    evidence: *id002
    readouts:

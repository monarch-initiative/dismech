name: Acute Ackee Fruit Intoxication
creation_date: '2026-09-02T15:30:00Z'
categories:
- Toxic Exposure Disorder
- Environmental Health Disorder
category: Complex
parents:
- Poisoning
disease_term:
  preferred_term: acute ackee fruit intoxication
  term:
    id: MONDO:0019140
    label: acute ackee fruit intoxication
synonyms:
- Jamaican vomiting sickness
- Ackee poisoning
- Toxic hypoglycemic syndrome
description: Acute ackee fruit intoxication is an acquired foodborne poisoning associated with hypoglycin A in unripe or improperly processed Blighia sapida fruit and toxic seeds. Bioactivation produces MCPA-CoA, which inhibits selected mitochondrial acyl-CoA dehydrogenases. Impaired fatty-acid oxidation, ketogenesis and hepatic glucose production can cause profound hypoglycemia and neurological deterioration. Vomiting is common, but hypoglycemia and vomiting are not obligatory in every reported case. Human urinary organic-acid findings and comparative animal experiments support the metabolic mechanism; they do not make human poisoning diagnostically indistinguishable from inherited fatty-acid oxidation disorders. Management is prompt glucose correction and supportive care, with prevention through safe harvesting and processing.
pathophysiology:
- name: Hypoglycin A Ingestion
  description: Oral exposure occurs through unripe or inadequately processed arils and toxic seeds. The dose and preparation vary; detection of exposure does not itself establish symptomatic poisoning.
  role: trigger
  biological_scale: ORGANISM
  evidence: &id001
  - reference: PMID:26324727
    reference_title: 'Ackee Fruit Poisoning in Eight Siblings: Implications for Public Health Awareness.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: We report a case series of eight previously well Nigerian siblings who presented at various intervals after ingestion of roasted seeds and aril of the ackee fruit.
    explanation: A shared meal caused a clinically heterogeneous family cluster; both seeds and arils were consumed.
  downstream:
  - target: Hypoglycin A Transamination
    description: Absorbed hypoglycin undergoes metabolic activation.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:

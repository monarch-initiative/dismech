- name: Impaired Fatty Acid Beta-Oxidation
  description: Inhibition of selected dehydrogenases impairs fatty-acid oxidation and alters hepatic acyl-CoA pools. Human organic aciduria is consistent with this block, while chain-specific pathway mapping derives mainly from enzyme and rodent experiments.

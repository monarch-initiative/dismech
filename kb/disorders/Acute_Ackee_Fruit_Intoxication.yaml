- name: Hypoglycin A Transamination
  description: Aminotransferase-mediated conversion of hypoglycin A to methylenecyclopropylpyruvate precedes generation of the inhibitory CoA ester.
  role: intermediate
  biological_scale: MOLECULAR
  evidence:
  - reference: PMID:26328472
    reference_title: Quantification of metabolites for assessing human exposure to soapberry toxins hypoglycin A and methylenecyclopropylglycine.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: Once ingested, hypoglycin A is converted by an aminotransferase in the cytosol to methylenecyclopropylpyruvate (MCP-pyruvate)
    explanation: The analytical paper summarizes the established transamination step from prior metabolic studies.
  downstream:
  - target: MCPA-CoA Formation
    description: Mitochondrial oxidative decarboxylation converts the keto-acid intermediate into the CoA ester.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:26328472
      reference_title: Quantification of metabolites for assessing human exposure to soapberry toxins hypoglycin A and methylenecyclopropylglycine.
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: BACKGROUND
      directness: DIRECT
      snippet: MCP-pyruvate is then decarboxylated and conjugated as a CoA ester (MCPA-CoA) in the liver by a mitochondrial branched-chain dehydrogenase.
      explanation: Background pathway describes formation of the inhibitory CoA ester; human urinary detection alone does not measure each reaction.
    - reference: PMID:29483297
      reference_title: In vivo studies on the mechanism of methylene cyclopropyl acetic acid and methylene cyclopropyl glycine-induced hypoglycemia.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      directness: DIRECT
      snippet: We identified the MCPA-CoA adduct by tandem LC-mass spectrometry in MCPA treated rat liver
      explanation: The hepatic CoA ester was directly identified after intravenous MCPA, which bypasses hypoglycin transamination.
- name: MCPA-CoA Formation
  description: Oxidative decarboxylation of the keto-acid intermediate generates methylenecyclopropylacetyl-CoA. Its conjugated excretion products support bioactivation in humans; direct hepatic CoA-ester identification comes from experimental rats.
  role: intermediate
  biological_scale: MOLECULAR
  evidence:

environmental:
- name: Ingestion of toxic ackee material
  description: Eating unripe or improperly processed arils, seeds or other toxic fruit parts delivers hypoglycin A. Canned exposure is documented. Natural ripening reduces aril toxin concentration, but seeds and rind remain unsafe; heating does not reliably detoxify unripe fruit.
  exposure_term:
    preferred_term: exposure to hypoglycin A in unripe ackee fruit
    term:
      id: ECTO:0000537
      label: exposure to toxin
  food_source:
    preferred_term: akee (raw)
    term:
      id: FOODON:03301360
      label: akee (raw)

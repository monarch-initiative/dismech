- name: Hepatocellular Injury
  description: Hepatic injury is a reported complication. A fulminant case had bridging and multiacinar necrosis with focal microvesicular steatosis, but exposure was unconfirmed and sickling-related ischemia substantially confounded attribution. The intervening injury mechanism in human ackee poisoning remains incompletely resolved.
  role: intermediate
  biological_scale: CELLULAR
  evidence:
  - reference: PMID:23259140
    reference_title: Fulminant hepatic failure attributed to ackee fruit ingestion in a patient with sickle cell trait.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: There are bridging and multiacinar necroses with approximation of adjacent portal tracts and severe centrilobular congestion and hemorrhage
    explanation: Direct pathology finding in one suspected poisoning; unconfirmed toxin exposure and concomitant sickling-related ischemia limit causal attribution.

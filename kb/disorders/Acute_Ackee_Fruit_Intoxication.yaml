  influences_mechanisms:
  - target: Hypoglycin A Ingestion
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: Oral ingestion delivers the protoxin.
    evidence: *id001
  evidence:
  - reference: PMID:8185109
    reference_title: Jamaican vomiting sickness in Toledo, Ohio.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The toxic exposure resulted from the consumption of canned ackee. The epidemiology, diagnosis, theoretical mechanism, and possible therapy of this disease are discussed.
    explanation: A United States case demonstrates the preserved-product route.
  - reference: PMID:21410289
    reference_title: 'Tracking hypoglycins A and B over different maturity stages: implications for detoxification of ackee (Blighia sapida K.D. Koenig) fruits.'
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The causal toxin, hypoglycin A, decreases in the edible arilli upon maturity; regulation of hypoglycin A in the arilli is thus critical.
    explanation: Analytical maturity study directly addresses exposure concentration.
  - reference: url:https://www.fda.gov/media/88521/download
    reference_title: https://www.fda.gov/media/88521/download
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: However, the rind and seeds still have high levels of hypoglycin A when the fruit is fully ripe and should not be consumed.
    explanation: Final FDA guidance distinguishes edible mature arils from toxic fruit parts.
  notes: The broad toxin exposure term is retained with a specific food-source annotation. The 2011 fruit study measured residual hypoglycin A in ripe Cheese arils (271 mg/kg); maturity is not a claim of zero toxin in every sample. The FDA food action criterion is not a human toxic-dose threshold.
progression:
- phase: Exposure and onset
  notes: Symptoms often begin within 6–48 hours, but severe onset at two hours and delayed gastrointestinal symptoms at four days occurred in one family. Dose, food preparation and nutritional context vary.
  evidence:
  - reference: PMID:26324727
    reference_title: 'Ackee Fruit Poisoning in Eight Siblings: Implications for Public Health Awareness.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Her symptoms had started 2 hours after ingestion of six roasted seeds and arils of ackee fruit. Loss of consciousness was preceded by vomiting and extreme body weakness.
    explanation: Direct case timing, not a universal incubation interval.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK431101/
    reference_title: Ackee Fruit Toxicity - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: Hypoglycemia may not manifest until several hours after ingestion. This metabolic derangement progresses rapidly once established.
    explanation: The review emphasizes delayed glucose deterioration.
- phase: Recovery or severe deterioration
  notes: Survivors may recover over several days with supportive care; severe cases can deteriorate rapidly. One of eight siblings died and the index child recovered by day six. Fatal-outbreak series are selected and do not establish a general case-fatality rate.
  evidence:
  - reference: PMID:26324727
    reference_title: 'Ackee Fruit Poisoning in Eight Siblings: Implications for Public Health Awareness.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: She had frequent monitoring of vital signs and was discharged on the sixth day of admission after full recovery.
    explanation: Observed recovery under combined supportive treatment.
  - reference: PMID:10028981
    reference_title: Epidemic of fatal encephalopathy in preschool children in Burkina Faso and consumption of unripe ackee (Blighia sapida) fruit.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: 29 cases of EFE were identified from January to May, 1998.
    explanation: Fatal encephalopathy ascertainment selects the most severe end of the spectrum.
epidemiology:
- name: Geographic and outbreak distribution
  description: Reported in Jamaica and other Caribbean settings, West Africa and imported-food settings. Reliable contemporary population incidence and prevalence are not established. Household clusters reflect shared exposure rather than inheritance.
  evidence:
  - reference: PMID:16749544
    reference_title: 'Ackee fruit poisoning: an outbreak investigation in Haiti 2000-2001, and review of the literature.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The Centers for Disease Control and Prevention (CDC) provided technical assistance to the Ministry of Health of Haiti during an outbreak of over 100 cases of acute illness and death in the northern region of Haiti during a 4-month period beginning in November 2000.
    explanation: Primary outbreak report abstract; no narrower case denominator or modern incidence inferred.
  - reference: PMID:10028981
    reference_title: Epidemic of fatal encephalopathy in preschool children in Burkina Faso and consumption of unripe ackee (Blighia sapida) fruit.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The only factor associated with EFE was the presence of ackee trees (Blighia sapida) within 100 m of households
    explanation: Household association supports probable etiology, not individual confirmed ingestion in every case.
  notes: The Burkina Faso study defined fatal encephalopathy; its all-fatal series must not be read as the case-fatality rate for unselected ackee exposure. The Haiti abstract uses over 100 illnesses/deaths; secondary reports use different denominators that are not combined here.
biochemical:
- name: Urinary dicarboxylic acids
  presence: INCREASED
  context: In two original human cases, several dicarboxylic acids were 70–1000 times the reported normal values. This supports an oxidation defect but is neither a validated severity scale nor a specific diagnostic signature by itself.
  evidence:
  - reference: PMID:940578
    reference_title: Jamaican vomiting sickness. Biochemical investigation of two cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Excretion of unusual dicarboxylic acids such as 2-ethylmalonic, 2-methylsuccinic, glutaric, adipic and dicarboxylic acids with eight and 10 carbon chains were also detected in both patients.
    explanation: Direct biochemical observations in two patients.
  readouts:
  - target: Impaired Fatty Acid Beta-Oxidation
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Elevated organic acids are compatible with impaired oxidation; urinary concentration does not directly quantify hepatic flux.
    evidence:
    - reference: PMID:940578
      reference_title: Jamaican vomiting sickness. Biochemical investigation of two cases.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      directness: INDIRECT
      snippet: The amounts of these dicarboxylic acids were 70 to 1000 times higher than normal.
      explanation: Case-specific comparison with normal values.
- name: Urinary short-chain fatty acids
  presence: INCREASED
  context: Up to 300-fold elevation was reported in the same two human cases. These values are not a population reference interval.
  evidence:
  - reference: PMID:940578
    reference_title: Jamaican vomiting sickness. Biochemical investigation of two cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: Urinary excretion of short-chain fatty acids was also increased up to 300 times higher than normal.
    explanation: Direct human urinary measurement.
- name: Urinary MCPA after hydrolysis
  presence: PRESENT
  context: The historical patient result supports excretion of conjugated toxin metabolites. The later analytical paper clarifies that MCPA was detected after hydrolysis; it should not be represented as a measurement of free urinary MCPA-CoA.
  evidence:
  - reference: PMID:940578
    reference_title: Jamaican vomiting sickness. Biochemical investigation of two cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: We identified methylenecyclopropylacetic acid, a known metabolite of hypoglycin A, in the urine of two patients with Jamaican vomiting sickness.
    explanation: Human toxin-metabolite evidence.
  - reference: PMID:26328472
    reference_title: Quantification of metabolites for assessing human exposure to soapberry toxins hypoglycin A and methylenecyclopropylglycine.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: When the patients’ urine samples were treated with the hydrolyzing agent barium hydroxide, the samples tested positive for MCPAA, which suggests the majority of the metabolite had been conjugated prior to excretion.
    explanation: Full analytical background clarifies the processing and analyte identity.
- name: Hypoglycin A in gastric contents
  presence: PRESENT
  context: GC-MS demonstrated hypoglycin A in gastric fluid from one deceased child in a cluster of 16 deaths. This confirms exposure in that child, not laboratory confirmation of every cluster case.
  evidence:
  - reference: PMID:21324617
    reference_title: Fatal intoxication due to ackee (Blighia sapida) in Suriname and French Guyana. GC-MS detection and quantification of hypoglycin-A.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: We have developed a GC-MS procedure allowing us to demonstrate the presence of hypoglycin-A in the gastric fluid of one of the deceased children
    explanation: Direct toxin identification in one patient.
- name: Hypoglycin A and methylenecyclopropylglycine exposure assays
  context: Specialized plasma HGA/MCPG and urinary MCPA-Gly/MCPF-Gly assays can document exposure. The plasma validation used commercial and spiked samples, and the urinary field application involved suspected acute encephalitis cases rather than an ackee-specific validation cohort. A positive exposure marker is not a validated clinical severity threshold.
  evidence:
  - reference: PMID:30056267
    reference_title: Quantification of hypoglycin A and methylenecyclopropylglycine in human plasma by HPLC-MS/MS.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: This method was applied to a commercial convenience set consisting of 100 individual plasma samples that served as a reference range for HGA and MCPG expected in a commercially available, unexposed population.
    explanation: Analytical validation scope, not a symptomatic case-control accuracy study.
  - reference: PMID:26328472
    reference_title: Quantification of metabolites for assessing human exposure to soapberry toxins hypoglycin A and methylenecyclopropylglycine.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The method was further applied in a laboratory analysis of specimens collected from suspected AES cases. Of the samples (n=73) analyzed, 66% of the samples were found positive for MCPF-Gly and/or MCPA-Gly.
    explanation: The field demonstration was in suspected AES, not confirmed Jamaican vomiting sickness.
diagnosis:
- name: Exposure history and clinical assessment
  description: Obtain a detailed food and preparation history, including preserved ackee and illness in other people sharing the meal. Evaluate compatible gastrointestinal or neurological illness promptly; absence of vomiting or a single normal glucose measurement does not exclude exposure-related illness.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK431101/
    reference_title: Ackee Fruit Toxicity - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: Vomiting is common, but its absence does not exclude the diagnosis.
    explanation: Clinical review explicitly cautions against a required vomiting criterion.
  - reference: PMID:26324727
    reference_title: 'Ackee Fruit Poisoning in Eight Siblings: Implications for Public Health Awareness.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: DIRECT
    snippet: The remaining five children aged between 4 and 10 years were brought in for evaluation after requests by the managing team.
    explanation: The family report supports assessment of other exposed children.
- name: Immediate and serial metabolic assessment
  description: Measure glucose promptly and serially, with electrolytes, liver and renal tests, lactate, ketones and blood gases as clinically indicated. Monitoring is directed at treatable metabolic deterioration and organ injury.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK431101/
    reference_title: Ackee Fruit Toxicity - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: Diagnostic evaluation should include blood glucose, serum electrolytes, liver function tests, renal function, lactate, ketones, and blood gases.
    explanation: Clinical toxicology evaluation guidance.
- name: Specialized toxin and metabolite testing
  description: Urinary organic acids and specific HGA-related metabolites can support the diagnosis when available. Timing and assay limitations matter, and emergency glucose correction should not depend on a specialized toxicology result. Veterinary acylcarnitine concentrations are not human diagnostic thresholds.
  evidence:
  - reference: PMID:26328472
    reference_title: Quantification of metabolites for assessing human exposure to soapberry toxins hypoglycin A and methylenecyclopropylglycine.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: Since the clearance rate of the metabolites is still unknown, the time lapse between collection and exposure could significantly affect the amount of metabolite remaining at the time of analysis.
    explanation: Analytical source emphasizes uncertainty in sampling-time interpretation.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK431101/
    reference_title: Ackee Fruit Toxicity - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: Patients require close monitoring for hypoglycemia and should receive dextrose therapy. Initial dextrose boluses may be administered, followed by a continuous infusion titrated to maintain euglycemia.
    explanation: Prompt treatment and monitoring are required regardless of specialized test availability.
- name: Reassessment for competing causes
  description: Consider other toxic, infectious and metabolic causes of hypoglycemia or encephalopathy. Persistent or recurrent unexplained biochemical abnormalities warrant specialist evaluation for inherited fatty-acid oxidation disease. Negative ETFA/ETFB/ETFDH or ACADM sequencing is not a mandatory diagnostic criterion for ackee poisoning.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK431101/
    reference_title: Ackee Fruit Toxicity - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: Diagnosis must be established through careful evaluation of presenting symptoms, laboratory data, and confirmation of recent unripe
    explanation: Clinical review bases diagnosis on integrated findings; it does not require negative genetic sequencing.
differential_diagnoses:
- name: Multiple acyl-CoA dehydrogenase deficiency
  disease_term:
    preferred_term: multiple acyl-CoA dehydrogenase deficiency
    term:
      id: MONDO:0009282
      label: multiple acyl-CoA dehydrogenase deficiency
  description: Inherited multiple acyl-CoA dehydrogenase deficiency and toxin-induced inhibition overlap metabolically but have different upstream causes. Broad acylcarnitine and organic-acid patterns in hypoglycin-exposed horses support a comparative acquired-MADD mechanism; they do not prove that every human poisoning profile is identical to inherited MADD.
  distinguishing_features:
  - A compatible shared-food or preserved-ackee exposure supports poisoning.
  - Toxin-specific metabolites support exposure when demonstrable; absence depends on sampling and assay.
  - Persistent or unexplained recurrent abnormalities require a metabolic differential rather than an assumed food attribution.
  evidence:
  - reference: PMID:23167695
    reference_title: Seasonal pasture myopathy/atypical myopathy in North America associated with ingestion of hypoglycin A within seeds of the box elder tree.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: Serum acylcarnitines and urine organic acid profiles in SPM horses were typical for MADD.
    explanation: The MADD-like biochemical pattern was measured in horses, so its use for human differential diagnosis is indirect.
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
- name: Medium-chain acyl-CoA dehydrogenase deficiency
  disease_term:
    preferred_term: medium chain acyl-CoA dehydrogenase deficiency
    term:
      id: MONDO:0008721
      label: medium chain acyl-CoA dehydrogenase deficiency
  description: Inherited MCAD deficiency can cause fasting-associated hypoglycemia and organic acid abnormalities. MCPA-CoA can inhibit purified MCAD as well as other dehydrogenases, so MCAD is neither excluded as a toxin target nor sufficient to describe the entire poisoning mechanism. Substrate protection of an enzyme is not evidence that the enzyme is toxin-insensitive.
  distinguishing_features:
  - A compatible toxic exposure and specific metabolites support ackee poisoning.
  - A persistent characteristic acylcarnitine profile or unexplained recurrent fasting crises warrants metabolic evaluation.
  evidence: *id002
- name: Reye syndrome
  description: Reye syndrome can resemble severe ackee poisoning clinically and histologically. The original two-case biochemical comparison found marked abnormal urinary organic acids in ackee poisoning that were not appreciably elevated in the Reye comparator literature.
  distinguishing_features:
  - A compatible ackee exposure with specific toxin metabolites supports poisoning.
  - Marked dicarboxylic aciduria supported the distinction in the historical comparison; it is not a modern standalone exclusion test.
  evidence:
  - reference: PMID:940578
    reference_title: Jamaican vomiting sickness. Biochemical investigation of two cases.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: despite their clinical and histologic similarities, the cause and biochemical mechanisms of Jamaican vomiting sickness differ distinctly from those of Reye's syndrome
    explanation: States both the resemblance and the biochemical basis for separating them, in the paper that made the distinction.
    quote_role: PRIMARY_RESULT
    directness: DIRECT
- name: Other acute poisonings and hypoglycemic illnesses
  description: Other ingestions, sulfonylurea toxicity, acute gastrointestinal illnesses and meningitis can overlap with the presentation. Dietary and medication histories, bedside glucose and targeted clinical investigation determine the differential.
  distinguishing_features:
  - Identify alternative ingestions or medication exposure.
  - Investigate fever, focal findings and other clinical features inconsistent with an isolated metabolic food poisoning.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK431101/
    reference_title: Ackee Fruit Toxicity - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: The differential diagnosis should include disorders presenting with gastrointestinal symptoms, altered mental status, or metabolic disturbances similar to those observed in ackee fruit toxicity.
    explanation: Review supports a broader acute differential.
treatments:
- name: Dextrose correction and glucose monitoring
  description: Prompt intravenous dextrose corrects symptomatic hypoglycemia. Bolus treatment may require a titrated continuous infusion with serial glucose measurements. This supplies glucose during the metabolic block; it is not evidence that the toxin-enzyme lesion has been reversed.
  evidence: &id003
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK431101/
    reference_title: Ackee Fruit Toxicity - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: Patients require close monitoring for hypoglycemia and should receive dextrose therapy. Initial dextrose boluses may be administered, followed by a continuous infusion titrated to maintain euglycemia.
    explanation: Toxicology review supports repeated glucose assessment and dextrose titration.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
    therapeutic_agent:
    - preferred_term: glucose
      term:
        id: CHEBI:17234
        label: glucose
  target_mechanisms:
  - target: Hypoglycemia
    treatment_effect: INHIBITS
    description: Restores circulating glucose during impaired endogenous production.
    evidence: *id003
- name: Fluid, electrolyte and gastrointestinal support
  description: Rehydrate and correct electrolyte abnormalities; antiemetics may relieve symptoms. Care should follow clinical status and repeated measurements.
  evidence: &id004
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK431101/
    reference_title: Ackee Fruit Toxicity - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: Intravenous fluids are indicated to prevent dehydration, and antiemetics may be used to alleviate symptoms. Vomiting and dehydration can precipitate electrolyte disturbances, which should be corrected promptly.
    explanation: Supportive care is directed at volume and electrolyte losses.
  treatment_term:
    preferred_term: Fluid Therapy
    term:
      id: NCIT:C116537
      label: Fluid Therapy
  target_mechanisms:
  - target: Dehydration
    treatment_effect: INHIBITS
    description: Replaces volume lost during vomiting.
    evidence: *id004
- name: Seizure management
  description: Correct hypoglycemia and provide standard acute seizure management when required; benzodiazepines are described in the clinical review.
  evidence: &id005
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK431101/
    reference_title: Ackee Fruit Toxicity - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: Benzodiazepines may be employed for seizure management, but hypoglycemia must first be excluded as the underlying cause.
    explanation: Seizure treatment accompanies assessment and correction of glucose.
  treatment_term:
    preferred_term: Anticonvulsant Therapy
    term:
      id: NCIT:C64172
      label: Anticonvulsant Therapy
  target_mechanisms:
  - target: Seizure
    treatment_effect: INHIBITS
    description: Treats ongoing seizures alongside correction of their metabolic cause.
    evidence: *id005
- name: Hospital observation and critical care
  description: Monitor neurological status, glucose, electrolytes and liver/renal function. Persistent hypoglycemia, seizures, acidosis, altered consciousness or poor perfusion may require intensive care. A reported emergency transplant for fulminant liver failure had a fatal outcome and does not establish an ackee-specific transplant success rate.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK431101/
    reference_title: Ackee Fruit Toxicity - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: Patients with persistent hypoglycemia, seizures, metabolic acidosis, altered mental status, or poor perfusion frequently require intensive care unit admission.
    explanation: Review identifies severe features prompting critical care.
  - reference: PMID:23259140
    reference_title: Fulminant hepatic failure attributed to ackee fruit ingestion in a patient with sickle cell trait.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: On admission, she was in fulminant hepatic failure with hepatic encephalopathy.
    explanation: The reported patient had liver failure and encephalopathy; exposure was unconfirmed and sickling-related ischemia confounded attribution.
  - reference: PMID:23259140
    reference_title: Fulminant hepatic failure attributed to ackee fruit ingestion in a patient with sickle cell trait.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    directness: INDIRECT
    snippet: After one successful code, her code status was changed to “Do Not Resuscitate.” She expired 6 hours later.
    explanation: The patient died after emergency transplantation; a single confounded case does not establish a transplant success rate.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  notes: No established specific antidote is available. Riboflavin, glycine and methylene blue have experimental or anecdotal use, without established clinical efficacy; coadministration of vitamin B complex in the sibling series cannot identify a vitamin-specific treatment effect.
- name: Toxicology consultation
  description: Consult a poison center or medical toxicologist. Routine gastrointestinal decontamination lacks demonstrated outcome benefit and may be inappropriate with vomiting, seizures or impaired consciousness.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK431101/
    reference_title: Ackee Fruit Toxicity - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: Evidence supporting routine gastrointestinal decontamination improving outcomes is insufficient.
    explanation: Do not promote charcoal or lavage as an established effective antidote.
- name: Safe harvesting, preparation and exposure prevention
  description: Use fully mature naturally opened fruit, remove seeds and raphe, and follow reliable processing controls. Do not force open or heat-shock immature fruit to accelerate opening; cooking does not make toxic unripe fruit safe. Educate households and evaluate other exposed people after a shared meal.
  evidence: &id006
  - reference: url:https://www.fda.gov/media/88521/download
    reference_title: https://www.fda.gov/media/88521/download
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: Prior to further processing and packaging, the black seeds and raphe are removed, and the arils are visually inspected for damage, blemishes, or signs of spoilage.
    explanation: Final FDA processing guidance describes removal of unsafe parts.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK431101/
    reference_title: Ackee Fruit Toxicity - StatPearls - NCBI Bookshelf
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    directness: DIRECT
    snippet: Cooking the unripe fruit does not mitigate its toxic potential. The seeds retain their toxicity and must not be ingested.
    explanation: Prevention advice distinguishes natural maturation from heating.
  target_mechanisms:
  - target: Hypoglycin A Ingestion
    treatment_effect: INHIBITS
    description: Reduces ingestion of toxin-containing fruit parts or improperly processed product.
    evidence: *id006
  notes: The final April 2014 FDA guide treats more than 100 ppm hypoglycin A in finished products as an action criterion for improper processing; this is a food-control policy, not a clinical poisoning threshold. Its guidance is nonbinding except where it cites statutory requirements.
animal_models:
- name: MCPA infusion in fasted conscious rats
  species: Rat
  description: Male Sprague-Dawley/CD rats fasted 18–20 hours received intravenous MCPA 80 mg/kg; a two-hour isotope-infusion protocol measured glucose and ketone turnover, PC flux and hepatic metabolites. Dextrose maintained euglycemia in treated rats. This bypasses oral hypoglycin exposure and does not reproduce the full human syndrome.
  publication: PMID:29483297
  modeled_mechanisms:
  - target: MCPA-CoA Formation
    relationship: MEASURES
    fidelity: MODERATE
    description: Hepatic MCPA-CoA was identified by LC-MS/MS.
    limitations: The parent amino acid and its transamination were bypassed.
    evidence: &id008
    - *id007
    readouts:
    - name: Hepatic MCPA-CoA detection

      directness: INDIRECT
      snippet: Accounting for the reduction we observed in EGP, absolute PC flux was reduced by 75% in MCPA treated rats
      explanation: Isotope-based PINTA estimates hepatic pyruvate-carboxylase flux in awake rats, not purified enzyme activity.
  - target: Reduced Ketogenesis
    description: Reduced availability of acetyl-CoA substrate contributes to lower hepatic ketone production.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    evidence:

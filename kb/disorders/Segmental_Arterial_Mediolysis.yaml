      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Segmental arterial mediolysis (SAM) is a rare but serious
        nonatherosclerotic, noninflammatory vasculopathy of unknown etiology
        that often results in dissection, aneurysm, occlusion, or stenosis of,
        primarily, the abdominal arteries.
      explanation: >-
        Nonatherosclerotic, noninflammatory peripheral and visceral arterial
        vasculopathy.

- name: Corticosteroids (not recommended)
  description: >-
    Because SAM is a noninflammatory arteriopathy rather than a vasculitis,
    corticosteroids are ineffective and potentially detrimental; distinguishing
    SAM from polyarteritis nodosa and other medium-vessel vasculitides avoids
    harmful immunosuppression.

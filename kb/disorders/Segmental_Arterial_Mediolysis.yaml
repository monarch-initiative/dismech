name: Segmental arterial mediolysis
creation_date: "2026-05-05T20:46:40Z"
category: Complex
description: >-
  Segmental arterial mediolysis is a rare, nonatherosclerotic and
  noninflammatory arteriopathy of medium- to large-sized muscular arteries,
  especially visceral abdominal branches. It is characterized by medial smooth
  muscle degeneration and lysis, with downstream arterial dilatation, aneurysm,
  dissection, stenosis, occlusion, hemorrhage, or ischemic organ injury.

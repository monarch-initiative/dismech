  prevalence_class: ULTRA_RARE
  notes: >-
    Systematic review of published cases (2005-2018) plus an institutional
    cohort identified 143 cases across 66 reports and one center; separate
    single-system retrospective cohorts reported 111 to 117 patients.
  evidence:
  - reference: PMID:31793853
    reference_title: "Segmental arterial mediolysis (SAM): Systematic review and analysis of 143 cases."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Literature review of all relevant SAM case studies from 2005 to 2018
      yielded 126 individual SAM cases from 66 reports. We identified 17
      additional SAM cases from our center, bringing our analysis to 143
      patients.
    explanation: >-
      Quantifies published and institutional case counts for SAM.

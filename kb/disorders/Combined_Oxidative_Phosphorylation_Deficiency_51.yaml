    evidence_source: HUMAN_CLINICAL
    snippet: "Other mitochondrial biomarkers such as plasma GDF‐15/GFG21 or urine organic acids disclosed normal results."
    explanation: >-
      Refutes the usefulness of these biomarkers as a screen in this disorder. Note the
      source's own typo, GFG21 for FGF21, quoted as printed.
histopathology:
- name: COX-negative fibres in a mosaic distribution in skeletal muscle
  description: >-
    Muscle biopsy in the oldest patient of the 2023 series showed a mosaic population
    of cytochrome c oxidase-negative fibres with increased lipid, alongside angulated
    hyperchromatic fibres consistent with denervation. There were no ragged-red fibres
    and no subsarcolemmal mitochondrial accumulation, so the classic mitochondrial
    myopathy picture is absent - the informative stain here is COX, not Gomori
    trichrome.
  context: Skeletal muscle biopsy at 3.5 years of age in one patient of the 2023 series.
  evidence:
  - reference: PMID:36450274
    reference_title: "Leigh syndrome is the main clinical characteristic of PTCD3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "COX staining showed a population of COX‐negative fibres in mosaic, with increased amounts of lipid material"
    explanation: The histochemical finding that supported the diagnosis of mitochondrial disease.
  - reference: PMID:36450274
    reference_title: "Leigh syndrome is the main clinical characteristic of PTCD3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Gomori's modified trichrome staining showed no increased endomysial or perimysial connective tissue and no subsarcolemmal reinforcements of mitochondria or ragged‐red fibers."
    explanation: >-
      The accompanying negative - no ragged-red fibres - which is why a normal trichrome
      does not argue against the diagnosis.
diagnosis:
- name: Exome or genome sequencing, with RNA-seq or minigene assay for splicing alleles
  description: >-
    The molecular diagnosis has been made by whole-exome and by whole-genome
    sequencing, but sequencing alone has repeatedly been insufficient in this gene.
    Two of the reported alleles were initially called variants of uncertain
    significance because they sit in exons and read as missense changes; both turned
    out to cause exon skipping. RNA-seq of patient fibroblasts prioritised PTCD3 in
    one family through an aberrant splicing signal, and minigene assays established
    causality for three alleles.

    The practical rule: an exonic PTCD3 variant of uncertain significance in a
    compatible phenotype warrants an RNA-level test before it is dismissed.
  evidence:
  - reference: PMID:36450274
    reference_title: "Leigh syndrome is the main clinical characteristic of PTCD3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In addition, RNA‐seq was also performed on P1 fibroblasts, which prioritized PTCD3 as a candidate disease gene, as an aberrant splicing was detected."
    explanation: RNA-seq, not exome interpretation, is what identified the gene in that family.
  - reference: PMID:36450274
    reference_title: "Leigh syndrome is the main clinical characteristic of PTCD3 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Additionally, minigene assays demonstrated that three of the identified variants were pathogenic by altering PTCD3 mRNA processing."
    explanation: The functional assay that reclassified the uncertain alleles.
- name: Respiratory chain enzymology in fibroblasts, read for the pattern rather than the magnitude
  description: >-
    Fibroblast enzymology shows reduced complex I and complex IV with normal or
    above-range complex II. Two cautions from the reported patients: the deficit can
    be modest, and in one patient a decreased complex IV activity fell back inside the
    control range once normalised to citrate synthase - so a normalised-only report may
    read as normal. Muscle histochemistry showed COX-negative fibres in the same
    patient whose normalised fibroblast values were unremarkable.
  evidence:
  - reference: PMID:36450274
    reference_title: "Leigh syndrome is the main clinical characteristic of PTCD3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Mitochondrial respiratory chain analysis in fibroblasts revealed decreased activity of complex IV. However, when normalized to citrate synthetase, the values fall within the control range"
    explanation: >-
      The normalisation caveat, quoted from the patient in whom it occurred. This is the
      practical reason not to treat a normal normalised panel as a rule-out.
- name: Functional complementation in patient fibroblasts
  description: >-
    Lentiviral re-expression of wild-type PTCD3 in immortalised patient fibroblasts
    restores OXPHOS subunit levels and respiratory capacity. It is not a routine
    clinical test, but it is the assay that has been used in both functionally
    characterised families to convert candidate variants into a diagnosis, and it is
    what a reference laboratory would be asked for when the genotype is ambiguous.
  evidence:
  - reference: PMID:36450274
    reference_title: "Leigh syndrome is the main clinical characteristic of PTCD3 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The expression of wild‐type PTCD3 cDNA using a lentiviral vector resulted in a complete recovery of the steady‐state levels of the altered OXPHOS subunits in both patients"
    explanation: The rescue result that establishes causality.
treatments:
- name: Supportive and Organ-Directed Care
  description: >-
    There is no disease-modifying therapy. Management follows the organs involved:
    respiratory support and eventually ventilation, gastrostomy or nasogastric feeding
    for dysphagia, antiseizure medication, antispasticity and antidystonic agents, and
    palliative care. Two of the reported patients were managed to death in the second
    decade on this basis, one at home under a palliative care team.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:36450274
    reference_title: "Leigh syndrome is the main clinical characteristic of PTCD3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Considering her overall condition, it was decided that she should be monitored by the palliative care unit."
    explanation: >-
      The endpoint of supportive management in one reported patient, recorded because it
      is the honest description of what treatment achieves here.
- name: Mitochondrial Cofactor Cocktail
  description: >-
    Coenzyme Q10, carnitine, thiamine, biotin and vitamin C have all been given to
    these patients, individually or as a "mitochondrial cocktail". In every reported
    case the effect was recorded as none. One patient did have a low plasma coenzyme
    Q10, which is the only result that gives a specific rationale for any of these
    agents, and even in that patient the cocktail produced no perceptible improvement.
    This is curated as a treatment with refuting evidence rather than omitted, because
    "the mitochondrial cocktail was tried and did not work" is a clinically useful
    thing for the entry to say.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: coenzyme Q10
      term:
        id: CHEBI:46245
        label: coenzyme Q10
    - preferred_term: carnitine
      term:
        id: CHEBI:16347
        label: (R)-carnitine
    - preferred_term: thiamine
      term:
        id: CHEBI:26948
        label: vitamin B1
    - preferred_term: biotin
      term:
        id: CHEBI:15956
        label: biotin
    - preferred_term: vitamin C
      term:
        id: CHEBI:29073
        label: L-ascorbic acid
  evidence:
  - reference: PMID:36450274
    reference_title: "Leigh syndrome is the main clinical characteristic of PTCD3 deficiency."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment with carnitine, thiamine, biotin, gabapentin, baclofen, and risperidone was also ineffective and had no effect on the disease progression."
    explanation: >-
      Refutes benefit from cofactor supplementation in the first patient of the 2023
      series, in the authors' own words.
  - reference: PMID:36450274
    reference_title: "Leigh syndrome is the main clinical characteristic of PTCD3 deficiency."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "However, this treatment did not result in a perceptible improvement of the clinical condition."
    explanation: >-
      Refutes benefit from the coenzyme Q10 and carnitine cocktail in a second, unrelated
      patient - including one with a documented low plasma coenzyme Q10.
- name: Levodopa Trial for the Movement Disorder
  description: >-
    Levodopa was tried in the akinetic-rigid patient of the 2023 series and did not
    help. Recorded because the akinetic-rigid presentation of a basal-ganglia
    mitochondrial disorder invites a levodopa trial, and the one reported trial was
    negative.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: levodopa
      term:
        id: CHEBI:15765
        label: L-dopa
  evidence:
  - reference: PMID:36450274
    reference_title: "Leigh syndrome is the main clinical characteristic of PTCD3 deficiency."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "The patient was initially treated with L‐Dopa, but no improvement was observed."
    explanation: The negative levodopa trial, stated directly.
- name: Genetic Counseling
  description: >-
    Autosomal recessive, 25% recurrence risk. Counselling here has to convey an unusual
    uncertainty: the same gene has produced death at 16 months and independent living
    into the fourth decade, and the residual-protein hypothesis that is meant to explain
    the difference is a hypothesis, not a validated genotype-phenotype rule. A carrier
    parent in one family had a measurably reduced fibroblast basal respiration rate
    while being entirely unaffected, so a functional assay result on a heterozygote must
    not be over-read.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:39544688
    reference_title: "The phenotypic spectrum of PTCD3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The similar results were observed in his unaffected mother, who is a carrier of the His269Tyr variant, concluding that both heterozygous unaffected and affected carriers exhibit a lower OCR."
    explanation: >-
      The carrier finding that makes over-interpretation of a heterozygote's respirometry
      a real counselling hazard.
animal_models:
- name: Drosophila melanogaster PTCD3 loss-of-function mutant
  species: Drosophila melanogaster
  genotype: Loss-of-function mutant of CG4679, the Drosophila PTCD3 ortholog
  publication: PMID:38074476
  description: >-
    The only published whole-organism model of PTCD3 loss. The mutant dies during the
    second larval instar with reduced expression of mitochondrial-function and
    ribosome-biogenesis genes and, unexpectedly, up-regulated neuronal-development
    genes. It establishes that the gene is essential for development in an intact
    animal, which no patient genotype can show, but it cannot model the human disease:
    every reported human genotype retains some function, and the fly has no
    basal-ganglia or optic-nerve counterpart to the human lesions.
  evidence:
  - reference: PMID:38074476
    reference_title: "A Drosophila melanogaster ortholog of pentatricopeptide repeat domain 3 ( PTCD3 ) is essential for development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we focus on the Drosophila melanogaster homolog of PPR domain 3"
    explanation: >-
      Establishes that the studied gene is the Drosophila ortholog of human PTCD3, which is
      the only thing that makes this model relevant to this disease at all.
  modeled_mechanisms:
  - target: Impaired Mitochondrial mRNA Translation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Transcriptional evidence of a coordinated loss of mitochondrial and
      ribosome-biogenesis gene expression on loss of the PTCD3 ortholog.
    limitations: >-
      A null allele in an invertebrate, lethal at the second instar, against a human
      disease in which every reported genotype retains residual protein. The readout is
      transcriptomic rather than a direct measurement of mitochondrial protein synthesis,
      and no respiratory-chain enzymology was reported, so the link to the human
      translation defect is inferential.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Drosophila has no optic nerve, basal ganglia or thalamus, so the two tissue-level
        nodes that define the human disease have no counterpart in this organism. The
        model can speak to the molecular and cellular nodes only.
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The model's measured quantity is the expression level of mitochondrial-function
        and ribosome-biogenesis genes. The node's quantity is the rate of mitochondrial
        protein synthesis. Reduced transcript abundance for ribosome components is a
        proxy for, not a measurement of, translation output.
    readouts:
    - name: Expression of mitochondrial-function and ribosome-biogenesis genes
      target: Impaired Mitochondrial mRNA Translation
      direction: DECREASED
      interpretation: >-
        Coordinated down-regulation of the mitochondrial translation apparatus on loss of
        the PTCD3 ortholog.
      evidence:
      - reference: PMID:38074476
        reference_title: "A Drosophila melanogaster ortholog of pentatricopeptide repeat domain 3 ( PTCD3 ) is essential for development."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In addition, mutants exhibit reduced expression of a group of genes related to mitochondrial function and ribosome biogenesis, and conversely, they show up-regulated expression of neuronal development-related genes."
        explanation: Reports the transcriptomic measurement behind this readout.
    evidence:
    - reference: PMID:38074476
      reference_title: "A Drosophila melanogaster ortholog of pentatricopeptide repeat domain 3 ( PTCD3 ) is essential for development."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "A loss-of-function mutant of PTCD3 is lethal during the second instar."
      explanation: >-
        Establishes that the gene is developmentally essential in an intact animal, which
        is why this model is treated as informative for the translation node despite its
        low fidelity to the human phenotype.
experimental_models:
- name: Patient-derived fibroblasts with wild-type PTCD3 lentiviral rescue
  experimental_model_type: PRIMARY_CELL_CULTURE
  description: >-
    Immortalised fibroblasts from two patients of the 2023 series, with lentiviral
    re-expression of GFP-tagged wild-type PTCD3 as the rescue arm and an empty vector
    as the control. Untransduced cells show reduced complex I, III and IV subunits and
    reduced respiratory capacity; the rescue arm restores both. The same design was used
    in the founding report on the index patient's cells.
  publication: PMID:36450274
  evidence:
  - reference: PMID:36450274
    reference_title: "Leigh syndrome is the main clinical characteristic of PTCD3 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional complementation studies demonstrated the pathogenic effect of the identified variants since the expression of wild-type PTCD3 in immortalized fibroblasts restored the steady-state levels of complexes I and IV subunits as well as the mitochondrial respiratory capacity."
    explanation: >-
      Establishes the model system and what it demonstrated, which is why this entry treats
      patient fibroblasts with wild-type rescue as informative for the biochemical node.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  modeled_mechanisms:
  - target: Combined Respiratory Chain Deficiency with Complex II Spared
    relationship: RESCUES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Re-expression of wild-type PTCD3 restores the OXPHOS subunit levels and the maximal
      respiratory capacity that are reduced in the patients' own cells, with an
      empty-vector arm as the specificity control. This is what converts the biochemical
      phenotype from a correlate of the genotype into a consequence of it.
    limitations: >-
      Fibroblasts are not the tissue in which this disease manifests. In one patient the
      complex IV deficit disappeared on normalisation to citrate synthase, so the cellular
      model understates the defect that the brain and optic nerve evidently sustain.
    readouts:
    - name: Steady-state levels of NDUFB8, MT-CO2 and UQCRC2 after wild-type PTCD3 transduction
      target: Combined Respiratory Chain Deficiency with Complex II Spared
      direction: RESTORED
      interpretation: Restoration of the reduced OXPHOS subunits, establishing PTCD3-dependence.
      evidence:
      - reference: PMID:36450274
        reference_title: "Leigh syndrome is the main clinical characteristic of PTCD3 deficiency."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "The expression of wild‐type PTCD3 cDNA using a lentiviral vector resulted in a complete recovery of the steady‐state levels of the altered OXPHOS subunits in both patients"
        explanation: Reports the rescue measurement behind this readout.
    - name: Maximal uncoupled respiratory capacity after wild-type PTCD3 transduction
      target: Combined Respiratory Chain Deficiency with Complex II Spared
      direction: RESTORED
      interpretation: >-
        The functional counterpart of the subunit rescue, with an empty-vector arm showing
        the effect is not an artefact of transduction.
      evidence:
      - reference: PMID:36450274
        reference_title: "Leigh syndrome is the main clinical characteristic of PTCD3 deficiency."
        supports: SUPPORT
        evidence_source: IN_VITRO
        snippet: "Transduction with wild‐type PTCD3, but not with the empty vector, restored the mitochondrial respiratory capacity in immortalized patients' fibroblasts."
        explanation: Reports the respirometry rescue with its vector control.
    evidence:
    - reference: PMID:30607703
      reference_title: "Mitochondrial ribosomal protein PTCD3 mutations cause oxidative phosphorylation defects with Leigh syndrome."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Complementation experiments rescued oxidative phosphorylation complex I and IV levels and activities, ATP biosynthesis, and MT-RNR1 rRNA transcript level, providing functional validation of the pathogenicity of identified variants."
      explanation: >-
        The same rescue design applied independently to the index patient's cells, which
        is what makes this model informative rather than a single-laboratory result.
prevalence:
- population: Worldwide (published cases)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Seven patients in three reports: one index patient in 2019, three from two
    unrelated families in 2023, and three more (an adult sibling pair and an unrelated
    child) in 2024. Reported families are Spanish, Brazilian, Latvian and Saudi; the
    ancestry of the index patient is not stated in that report and is not asserted here.
    No population prevalence has been estimated and none is asserted here; the
    2024 report's own cross-cohort tally of seven patients is the best available
    denominator.
  evidence:
  - reference: PMID:39544688
    reference_title: "The phenotypic spectrum of PTCD3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "showed optic atrophy and nystagmus in six of seven patients"
    explanation: >-
      The seven-patient denominator, from the authors' tabulation of previously and newly
      published cases.
  - reference: PMID:36450274
    reference_title: "Leigh syndrome is the main clinical characteristic of PTCD3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, mutations in PTCD3, encoding a component of the mitochondrial ribosome, have only been reported in a single individual with clinical evidence of Leigh syndrome."
    explanation: The count as it stood before the 2023 series, showing how small the literature is.
progression:
- phase: Onset
  age_range: first weeks of life to early childhood, with one sibling pair whose first sign appeared at age 2
  notes: >-
    Onset spans the severe and mild poles. In the severe pole symptoms begin in the
    first weeks to three months of life, or from birth in the index patient, who also
    had intrauterine growth retardation. In the mild pole the first sign was nystagmus
    at age two with normal early development, and gait disturbance did not appear until
    age six.
  evidence:
  - reference: PMID:36450274
    reference_title: "Leigh syndrome is the main clinical characteristic of PTCD3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, none of the individuals reported here had intrauterine growth retardation, and the onset age ranged from the first weeks to 3 months of life."
    explanation: The onset range in the 2023 series, contrasted with the index patient.
- phase: Established disease
  notes: >-
    Two distinct courses. The severe course is a progressive neurodegeneration with
    accumulating dystonia, epilepsy, dysphagia and respiratory failure, punctuated by
    intensive-care admissions. The mild course is a slowly progressive ataxia and optic
    neuropathy in which patients remain cognitively near-normal into their thirties but
    become blind and non-ambulatory. The disorder has no described plateau in either
    course.
  evidence:
  - reference: PMID:39544688
    reference_title: "The phenotypic spectrum of PTCD3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both are legally blind, retaining only light perception, experiencing mild cognitive decline and being non‐ambulatory."
    explanation: The established state of the mild course in the fourth decade.
- phase: Outcome
  notes: >-
    The index patient died at 16 months. Two patients of the 2023 series died at 11 and
    17 years, one of pneumonia with respiratory failure and one at home under palliative
    care; the third was alive at 19. The 2024 sibling pair were alive in their thirties.
    Survival therefore ranges over more than three decades within one gene.
  evidence:
  - reference: PMID:36450274
    reference_title: "Leigh syndrome is the main clinical characteristic of PTCD3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "They survived longer than the previously reported patient, being exitus at the ages of 11 and 17 years old, or still alive at 19 years of age."
    explanation: The survival range in the 2023 series against the index patient.
  - reference: PMID:31967322
    reference_title: "Mortality of Japanese patients with Leigh syndrome: Effects of age at onset and genetic diagnosis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nearly 90% of deaths 
occurred by age 6. Mortality rate of patients with onset before 6 months of age 
was significantly higher than that of onset after 6 months."
    explanation: >-
      Class-level prognostic data. This is a 166-patient Japanese Leigh syndrome cohort,
      not a PTCD3 series - no natural-history study of COXPD51 exists, and seven patients
      cannot support one. It is cited to give the infantile-onset pole a base rate, and
      the inference from Leigh syndrome generally to PTCD3 specifically is the reason this
      item is graded INDIRECT.
differential_diagnoses:
- name: Leigh syndrome of other genetic cause
  description: >-
    More than 75 genes, mitochondrial and nuclear, produce Leigh syndrome, and nothing
    in the clinical picture or the neuroimaging distinguishes PTCD3 from them. Optic
    atrophy, which is the most consistent PTCD3 feature, occurs in Leigh syndrome of
    other aetiologies too, and the reporting authors say explicitly that it is not
    useful for guiding the clinical diagnosis.
  distinguishing_features:
  - Not separable clinically or radiologically; the distinction is molecular.
  - A combined complex I and IV deficiency with spared complex II narrows the differential
    to the mitochondrial gene-expression disorders but does not identify the gene.
  evidence:
  - reference: PMID:36450274
    reference_title: "Leigh syndrome is the main clinical characteristic of PTCD3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "On the other hand, optic atrophy is a clinical sign that has been observed in patients with Leigh syndrome of other etiologies, and thus it is not useful in guiding the clinical diagnosis"
    explanation: >-
      The authors' own statement that the disorder's most consistent feature does not
      discriminate it from other Leigh syndromes.
- name: Other mitochondrial ribosomal protein (MRP) disorders
  description: >-
    Thirteen genes encoding mitoribosomal proteins had been implicated in human disease
    by 2023. As a class they present neonatally or in infancy with lactic acidosis and
    combined OXPHOS deficiency, and with myopathy, cardiac, hepatic, renal or hearing
    involvement. PTCD3 sits inside that class and shares its biochemistry; what
    distinguishes it clinically, on the evidence available, is the near-constant optic
    atrophy and nystagmus rather than the multiorgan pattern.
  distinguishing_features:
  - Shared biochemistry - lactic acidosis with combined OXPHOS deficiency - across the
    whole class, so enzymology does not separate them.
  - Cardiac, hepatic and renal involvement is common in the MRP class but has not been a
    feature of the reported PTCD3 patients, one of whom had only slight left ventricular
    hypertrophy.
  evidence:
  - reference: PMID:36450274
    reference_title: "Leigh syndrome is the main clinical characteristic of PTCD3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Myopathy, cardiac abnormalities, hepatopathy, renal dysfunction, deafness and dysmorphic features are the most common clinical phenotypes associated with MRP deficiencies."
    explanation: The class phenotype against which PTCD3 has to be distinguished.
  - reference: PMID:34008913
    reference_title: "COXPD9 in an individual from Puerto Rico and literature review."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Similar to previously reported individuals, this reported female proband presented with psychomotor retardation, sensorineural hearing loss, hypertrophic cardiomyopathy, failure to thrive, and lactic acidosis."
    explanation: >-
      A worked example of the sibling class, and INDIRECT for that reason: this is COXPD9
      caused by MRPL3, a large-subunit mitoribosomal protein, not PTCD3. It is cited to
      show what the differential looks like in practice - the cardiomyopathy, deafness and
      failure to thrive that dominate COXPD9 have not been features of the PTCD3 patients.
- name: Hereditary optic neuropathy and hereditary ataxia
  description: >-
    The adult pole of COXPD51 was worked up for years as hereditary ataxia and
    hereditary optic neuropathy. Mitochondrial DNA sequencing, Friedreich ataxia repeat
    testing, an NGS ataxia panel, spinocerebellar ataxia repeat analysis and whole-exome
    sequencing were all negative in that family before whole-genome sequencing found
    PTCD3. This is the practical reason to keep PTCD3 in an adult ataxia-with-optic-atrophy
    differential.
  distinguishing_features:
  - A standard ataxia gene panel and exome will miss it; the reported adult family was
    diagnosed only on whole-genome sequencing.
  - The combination of optic atrophy, nystagmus, ataxia and a motor polyneuropathy with
    preserved cognition is the phenotype that should prompt mitochondrial testing.
  evidence:
  - reference: PMID:39544688
    reference_title: "The phenotypic spectrum of PTCD3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results of mtDNA sequencing, Friedreich ataxia repeat expansion analysis, NGS ataxia gene panel (case 1), nucleotide repeat expansion analysis for all known types of spinocerebellar ataxia (case 1) and whole exome sequencing (case 2) did not reveal the cause of the disease."
    explanation: The diagnostic odyssey that the adult phenotype produced.
discussions:
- discussion_id: coxpd51_leigh_versus_leigh_like
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is PTCD3 deficiency a cause of Leigh syndrome, or of a Leigh-like syndrome that does
    not meet the diagnostic criteria?
  attaches_to:
  - pathophysiology#Subacute Necrotizing Degeneration of Basal Ganglia and Thalamus
  - disease#Combined Oxidative Phosphorylation Deficiency 51
  rationale: >-
    The founding 2019 report diagnosed its patient with Leigh syndrome. A letter in the
    same journal argued the imaging and clinical picture met criteria only for a
    Leigh-like syndrome. The 2023 series then titled itself "Leigh syndrome is the main
    clinical characteristic of PTCD3 deficiency" and set out to settle the question in
    favour of Leigh syndrome; the 2024 report nonetheless describes its own severe
    patient as Leigh-like, and its two adult patients as neither.

    This entry does not adjudicate. It records the position of each report and keeps the
    pathophysiology node named for the lesion (necrotizing degeneration of basal ganglia
    and thalamus) rather than for either syndrome label, so that the mechanism does not
    inherit the dispute.

    This entry quotes the 2023 series' summary of the challenge rather than the
    challenging Letter itself. The reason is recorded in the entry notes.
  evidence:
  - reference: PMID:30607703
    reference_title: "Mitochondrial ribosomal protein PTCD3 mutations cause oxidative phosphorylation defects with Leigh syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain MRI showed abnormal bilateral signals at the basal ganglia and brainstem, and the patient was diagnosed as Leigh syndrome."
    explanation: The original Leigh-syndrome diagnosis.
  - reference: PMID:36450274
    reference_title: "Leigh syndrome is the main clinical characteristic of PTCD3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis was compatible with Leigh Syndrome, but it was questioned by some authors, that classified the patient as Leigh‐like rather than Leigh syndrome"
    explanation: >-
      The 2023 authors' account of the challenge. This entry quotes their summary rather
      than the challenging Letter itself, for the reason given in the entry notes.
  - reference: PMID:39544688
    reference_title: "The phenotypic spectrum of PTCD3 deficiency."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "These clinical manifestations align with a Leigh‐like syndrome."
    explanation: >-
      The most recent report describes its own severe patient as Leigh-like, so the 2023
      paper's title did not close the question.
- discussion_id: coxpd51_residual_protein_hypothesis_untested
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does the amount of residual PTCD3 protein explain why one genotype kills at 16 months
    and another allows independent survival into the fourth decade?
  attaches_to:
  - pathophysiology#Depletion of PTCD3 Protein
  - genetic#PTCD3
  rationale: >-
    The only proposed explanation for the disorder's enormous severity range is
    quantitative: the index patient's two truncating alleles leave PTCD3 nearly absent,
    while the leaky splice alleles of the later patients leave 15-30% of normal protein,
    and the 2024 authors extend the same reasoning to a missense allele. It is a
    plausible dose-response account and it is entirely uncontrolled - each level was
    measured in a different laboratory, in a different patient, with a different second
    allele, and nobody has plotted protein level against any severity measure.

    What is missing is a graded series. Titrating PTCD3 in one cell background and
    measuring mitoribosome assembly, translation and respiration at each level would
    test whether the relationship is even monotonic. Until that exists the entry treats
    the residual-protein account as a hypothesis and does not use it for prognosis.
  evidence:
  - reference: PMID:36450274
    reference_title: "Leigh syndrome is the main clinical characteristic of PTCD3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As a result, the absence of PTCD3 protein is nearly complete, whereas in our patients, although reduced, was not absent."
    explanation: The observation on which the hypothesis rests.
  - reference: PMID:39544688
    reference_title: "The phenotypic spectrum of PTCD3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We hypothesise that PTCD3 missense pathogenic variants lead to a milder form of combined oxidative phosphorylation deficiency, probably due the higher level of residual PTCD3."
    explanation: >-
      The 2024 authors state it as a hypothesis in their own words, which is how this
      entry records it.
- discussion_id: coxpd51_carrier_respirometry_confound
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    If an unaffected heterozygous carrier has the same reduced fibroblast basal
    respiration as her affected son, what does a reduced basal respiration rate actually
    establish in this disorder?
  attaches_to:
  - pathophysiology#Reduced Mitochondrial Respiratory Capacity and ATP Deficit
  - diagnosis#Functional complementation in patient fibroblasts
  rationale: >-
    In the 2024 report the mother of the adult proband - clinically unaffected, carrying
    one PTCD3 allele - had a basal respiration rate as low as her son's, with no
    significant difference between them. The authors draw the conclusion themselves: a
    lower oxygen consumption rate is seen in both affected and unaffected carriers, and
    that reduction is not by itself sufficient to cause disease.

    The gap this leaves is a measurement gap. Basal respiration is being used as
    supporting functional evidence for variant classification in this gene, and in this
    family it did not discriminate patient from carrier. What has discriminated, in the
    two other functionally characterised families, is the complementation assay: subunit
    levels and maximal uncoupled capacity restored by wild-type PTCD3. Nobody has
    reported a maximal-capacity or complementation result on a heterozygous carrier, so
    it is not known whether those assays are any more discriminating.
  evidence:
  - reference: PMID:39544688
    reference_title: "The phenotypic spectrum of PTCD3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The similar results were observed in his unaffected mother, who is a carrier of the His269Tyr variant, concluding that both heterozygous unaffected and affected carriers exhibit a lower OCR."
    explanation: The carrier result and the authors' own reading of it.
- discussion_id: coxpd51_regional_selectivity_unexplained
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Why do the optic nerve and the basal ganglia and thalamus degenerate when the
    translation defect is present in every cell?
  attaches_to:
  - pathophysiology#Subacute Necrotizing Degeneration of Basal Ganglia and Thalamus
  - pathophysiology#Optic Nerve Degeneration
  rationale: >-
    PTCD3 is expressed in all tissues and the mitoribosome is required in all of them,
    yet the disease is focal: the optic nerve in essentially every patient, the basal
    ganglia and thalamus in the severe pole, the peripheral nerve in several, and almost
    nothing else. Cardiac, hepatic and renal involvement, which is common across the
    mitoribosomal protein disorders as a class, has been minimal in these patients.

    The only explanation offered is a general one - that retinal ganglion cells are
    especially vulnerable to defects in mitochondrial gene expression - and it is
    asserted rather than tested in PTCD3. It also does not address the basal-ganglia
    selectivity, which is shared with more than 75 unrelated Leigh-syndrome genes and is
    unexplained for all of them. The two selectivities may not have the same cause, and
    nothing in the PTCD3 literature distinguishes them.

    This is recorded as a gap rather than a controversy because no source argues the
    other side; the question has not been addressed.
  evidence:
  - reference: PMID:39544688
    reference_title: "The phenotypic spectrum of PTCD3 deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Defects in mitochondrial replication, RNA transcription and translation initiate early‐onset optic atrophy, as these cells are highly vulnerable to mitochondrial dysfunction."
    explanation: >-
      The whole of the published explanation for the optic-nerve selectivity - a general
      vulnerability claim about the cell type, not a PTCD3-specific result.
- discussion_id: coxpd51_no_mammalian_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    The only published whole-organism PTCD3 model is a lethal Drosophila null. Does any
    available model reproduce the human disease, in which every reported genotype retains
    residual protein?
  attaches_to:
  - animal_models#Drosophila melanogaster PTCD3 loss-of-function mutant
  - pathophysiology#Depletion of PTCD3 Protein
  rationale: >-
    Evidence exists in a model system, and its translational validity is the open
    question - which is what separates this from the gaps above. The Drosophila null dies
    in the second instar and mouse loss of function is reported as causing
    neurodevelopmental defects and early lethality. Both are null phenotypes. No reported
    human patient is null: the severity range that defines this disorder lies entirely in
    the hypomorphic range, and neither organism has been studied at a hypomorphic dose.

    Neither organism has the tissues the disease targets, either - a fly has no optic
    nerve or basal ganglia, and no mouse study reporting optic atrophy or basal-ganglia
    lesions on partial PTCD3 loss has been published. So the models establish that the
    gene is essential and say nothing about why partial loss produces this particular
    focal degeneration.

    What would resolve it is a hypomorphic mammalian allele - a knock-in of one of the
    human leaky splice alleles, or a graded conditional knockdown - assessed for optic
    nerve and basal-ganglia pathology rather than for lethality.
  evidence:
  - reference: PMID:38074476
    reference_title: "A Drosophila melanogaster ortholog of pentatricopeptide repeat domain 3 ( PTCD3 ) is essential for development."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A loss-of-function mutant of PTCD3 is lethal during the second instar."
    explanation: The invertebrate null phenotype - lethality, not the human disease.
  - reference: PMID:39544688
    reference_title: "The phenotypic spectrum of PTCD3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Similarly, PTCD3 loss‐of‐function mice exhibit neurodevelopmental defects and early lethality."
    explanation: >-
      The mouse null phenotype as summarised by the 2024 authors. Cited from their review
      sentence because the entry does not cite the underlying mouse study; a curator with
      that primary reference should cite it directly here.
notes: >-
  Evidence base and its limits. Three primary clinical reports carry this entry, and
  together they describe seven patients: PMID:30607703 (2019, one patient, with proteomics
  and complementation), PMID:36450274 (2023, three patients from two unrelated Spanish
  and Brazilian families, with minigene assays, western blot, respirometry and
  complementation), and PMID:39544688 (2024, three patients - an adult sibling pair
  recruited through the Latvian population genome database and an unrelated Saudi child
  found through GeneMatcher - with Seahorse respirometry and in silico structural
  modelling). Two non-patient papers supply the gene's normal
  function (PMID:19427859, cell-line knockdown) and its only whole-organism model
  (PMID:38074476, Drosophila).

  Named-entity hazards handled here. PTCD3 has a substantial cancer literature -
  colorectal, prostate, pancreatic, and Myc-driven lymphoma expression and CRISPR
  studies - which is about the same gene but not about this disease; none of it is cited.
  The numbered COXPD disorders are sibling entities, not synonyms: where this entry uses
  a statement about mitochondrial translation defects or mitoribosomal protein disorders
  as a class, the evidence item says so in its explanation and the claim is kept at class
  level.

  What this entry does not assert. The task framing for a combined OXPHOS deficiency is
  usually "complexes I, III, IV and V fail together". That is not what the PTCD3 patients
  show, and the entry follows the patients: complex I and complex IV are consistently
  affected, complex III variably (reduced in one of two patients tested by western blot),
  and complex V subunit levels were explicitly unaltered. No patient-level ATP synthase
  activity deficit is asserted, because none of the cited sources reports one.

  PMID:30706245, the Letter arguing for "Leigh-like rather than Leigh", is discussed in
  the Leigh/Leigh-like controversy but is not cited as evidence: its cached record has no
  abstract or body text, so there is nothing in it that can be quoted exactly. The 2023
  series' own summary of the challenge is quoted instead, and the discussion says so.

  Two class-level references are cited with `directness: INDIRECT` because no
  PTCD3-specific source exists for what they say: PMID:31967322, a 166-patient Japanese
  Leigh syndrome mortality cohort, for the prognosis of the infantile-onset pole, and
  PMID:34008913, a COXPD9/MRPL3 case report, as a worked example of the mitoribosomal
  protein disorder differential. Neither describes a PTCD3 patient, and each evidence
  item's explanation says which gene and disorder it is actually about.

  Deep research. An openscientist report (research/Combined_Oxidative_Phosphorylation_Deficiency_51-deep-research-openscientist.md)
  was produced after falcon returned HTTP 402; the fallback is recorded in the report's
  own frontmatter. Its citations validated 10/10 with a confabulation rate of 0.0 and its
  terms 32/33, and `just preflight-dr` returned PASS against MONDO:0033631 with 35 PTCD3
  mentions and a matching OMIM xref. Its synthesis agrees with the primary literature on
  the mechanism, and it contributed the two class-level references above. It did not,
  however, find PMID:39544688, the 2024 phenotypic-spectrum report, so its clinical
  picture is the infantile Leigh pole only and it describes COXPD51 as uniformly severe
  with early mortality. That is the DR report's most consequential omission, and the mild
  adult pole in this entry comes from the primary literature rather than from it.

  No `datasets:` block. Deliberate, not an oversight. Seven patients have been
  reported worldwide and none of the three clinical papers deposits a public omics
  dataset; the fibroblast proteomics of the founding report is referred to PRIDE only in
  its methods citation list. Searching a repository on the gene symbol instead is exactly
  the Named Entity Confusion trap CLAUDE.md warns about here - PTCD3 is well represented
  in colorectal, prostate and pancreatic cancer expression studies, and every one of
  those accessions would resolve perfectly while being about a different biology. A
  curator who finds a genuine COXPD51 or PTCD3-patient dataset should add it; a
  gene-symbol search result is not that.

  Uncited causal edges. Six `downstream` edges carry no evidence item of their own. Each
  is asserted by the cited literature at node level but not as a causal statement anyone
  published - the step from bioenergetic failure to regional necrosis in particular is
  unexplained for every Leigh syndrome gene, which is why it is also recorded as a
  knowledge gap. The edges are left uncited rather than propped up with a neighbouring
  node's citation.

  Not curated, for want of a citable source. The DR report attributes homozygous
  embryonic lethality and a heterozygous impaired pupillary reflex in Ptcd3 knockout mice
  to IMPC genotype-phenotype records, without an identifier that can be fetched and
  quoted. The mouse null phenotype is instead recorded in the model-mismatch discussion
  from the sentence in PMID:39544688 that states it, and the IMPC heterozygote phenotypes
  are not asserted here at all. A curator with the IMPC allele page or the underlying
  publication should add them.

  No GeneReviews chapter exists for COXPD51 or for PTCD3 deficiency; a PubMed search for
  a GeneReviews title returned nothing, so there is no expert-curated phenotype baseline
  to cross-reference. No Orphanet entry was found for the disorder either. Neither
  absence is a defect in this entry - it is the state of the secondary literature for a
  disorder with seven published patients.

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    All seven reported patients carry biallelic PTCD3 variants - compound
    heterozygous in the first six, homozygous for an intronic splice variant in the
    seventh, whose parents are double first cousins. Segregation in trans has been
    confirmed by parental testing in every family in which it was assessed.
  evidence:
  - reference: PMID:36450274
    reference_title: "Leigh syndrome is the main clinical characteristic of PTCD3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "WES and RNA-seq identified compound heterozygous variants in PTCD3 in both families"
    explanation: Compound heterozygous, trans-configured variants in two independent families.
genetic:
- name: PTCD3
  gene_term:
    preferred_term: PTCD3
    term:
      id: hgnc:24717
      label: PTCD3
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  association: >-
    PTCD3 (MRPS39, mS39) encodes a pentatricopeptide-repeat RNA-binding protein
    that forms the mRNA entry channel of the small mitoribosomal subunit. Its
    function was established a decade before any patient was reported: knockdown in
    human cells reduced mitochondrial protein synthesis, respiration, and complex
    III and IV activity without changing mitochondrial mRNA levels, which located it
    in translation rather than in RNA processing or stability.

    The striking feature of the reported allelic spectrum is how many of the
    pathogenic alleles act through splicing. Of the nine variants published across
    the three case reports, six alter mRNA processing - two canonical acceptor-site
    variants, one intronic +4 variant, and two exonic variants initially called
    variants of uncertain significance that turned out on minigene assay to cause
    exon skipping. That last pair matters practically: an exonic missense-looking
    change in PTCD3 cannot be assumed to act as a missense change.
  variants:
  - name: "PTCD3 c.415-2A>G"
    description: >-
      Canonical splice acceptor variant, in trans with a frameshift allele in the
      index patient. Together the two alleles leave the protein nearly absent, which
      is the genotype the 2023 series proposes as the explanation for that patient's
      exceptionally severe course.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:36450274
      reference_title: "Leigh syndrome is the main clinical characteristic of PTCD3 deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "As a result, the absence of PTCD3 protein is nearly complete, whereas in our patients, although reduced, was not absent."
      explanation: >-
        Contrasts the index patient's near-null genotype with the residual protein in
        the later, longer-surviving patients.
  - name: "PTCD3 c.1453-1G>C"
    description: >-
      Canonical acceptor-site variant abolishing the intron 18 splice site, causing
      exon 19 skipping and a transcript degraded by nonsense-mediated decay. On
      minigene assay it had the strongest effect of the four variants tested.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:36450274
      reference_title: "Leigh syndrome is the main clinical characteristic of PTCD3 deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "cDNA analysis of P1 revealed a skipping of exon 19 caused by the c.1453‐1G>C substitution, which altered a canonical splice acceptor site"
      explanation: Establishes the splicing consequence of this allele in patient fibroblasts.
  - name: "PTCD3 c.902C>T"
    description: >-
      Initially classified as a variant of uncertain significance because it sits
      inside exon 12 and reads as a missense change. Minigene assay showed it causes
      skipping of the exon it sits in, producing a truncating transcript alongside a
      leaky pool of correctly spliced mRNA.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:36450274
      reference_title: "Leigh syndrome is the main clinical characteristic of PTCD3 deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Additionally, minigene assays demonstrated that three of the identified variants were pathogenic by altering PTCD3 mRNA processing."
      explanation: >-
        The functional result that reclassified this and two neighbouring variants from
        uncertain significance to pathogenic-by-splicing.
  - name: "PTCD3 c.538+4A>G"
    description: >-
      Homozygous intronic variant in a consanguineous family, absent from gnomAD,
      shown by RT-PCR to cause skipping of the 124 bp exon 7. The only homozygous
      genotype reported to date.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:39544688
      reference_title: "The phenotypic spectrum of PTCD3 deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This genetic change abolishes the consensus splice site and causes exon 7 skipping"
      explanation: The splicing consequence demonstrated for the homozygous intronic allele.
  - name: "PTCD3 c.1182T>A (p.Tyr394Ter)"
    description: >-
      Nonsense allele carried by the adult sibling pair, in trans with the
      p.His269Tyr missense allele. It removes the C-terminal half of the protein
      including much of the central fold, so the product cannot be incorporated into
      the mitoribosome; western blot showed it is not cleared by nonsense-mediated
      decay.
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:39544688
      reference_title: "The phenotypic spectrum of PTCD3 deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The whole genome sequencing analysis revealed two heterozygous variants in the PTCD3: c.1182T>A, p.(Tyr394Ter) and c.805C>T, p.(His269Tyr)."
      explanation: Names the two alleles of the mild adult phenotype.
  evidence:
  - reference: PMID:30607703
    reference_title: "Mitochondrial ribosomal protein PTCD3 mutations cause oxidative phosphorylation defects with Leigh syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first report of an association of PTCD3 mutations with Leigh syndrome along with combined oxidative phosphorylation deficiencies caused by defects in the mitochondrial translation machinery."
    explanation: The founding report establishing PTCD3 as a human disease gene.
  - reference: PMID:19427859
    reference_title: "Pentatricopeptide repeat domain protein 3 associates with the mitochondrial small ribosomal subunit and regulates translation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "lowering PTCD3 in 143B osteosarcoma cells decreased mitochondrial protein synthesis, mitochondrial respiration and the activity of Complexes III and IV, suggesting that PTCD3 has a role in mitochondrial translation."
    explanation: >-
      Establishes the gene's normal function in mitochondrial translation, a decade
      before any patient was reported. This is a cell-line knockdown, not a PTCD3
      patient study.
pathophysiology:
- name: Biallelic PTCD3 Variants Disrupting mRNA Processing
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    Germline biallelic PTCD3 variants, most of which act on splicing. Canonical
    acceptor-site variants, an intronic +4 variant and two exonic variants that read
    as missense changes all produce exon-skipped transcripts; a frameshift and a
    nonsense allele complete the reported spectrum. The splice-acting alleles were
    proven to act that way by minigene assay in HAP1 cells, not inferred from
    prediction algorithms.
  genetic_context:
    genes:
    - preferred_term: PTCD3
      term:
        id: hgnc:24717
        label: PTCD3
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Compound heterozygous in six of the seven reported patients, homozygous for the
      intronic c.538+4A>G allele in the seventh.
  locations:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  evidence:
  - reference: PMID:36450274
    reference_title: "Leigh syndrome is the main clinical characteristic of PTCD3 deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Overall, these results demonstrated that the c.1918C>G, c.1453‐1G>C, and c.902C>T variants were responsible for the PTCD3 mRNA processing defects observed in patients' fibroblasts."
    explanation: Direct experimental attribution of the mRNA-processing defect to the variants.
  - reference: PMID:39544688
    reference_title: "The phenotypic spectrum of PTCD3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, PTCD3 seems to be particularly vulnerable to pathological splice site errors"
    explanation: >-
      States the generalisation across the allelic spectrum that makes splicing the
      dominant mechanism of loss of function in this gene.
  downstream:
  - target: Depletion of PTCD3 Protein
    causal_link_type: DIRECT
    description: >-
      Exon-skipped transcripts are either degraded by nonsense-mediated decay or
      translated into truncated protein that cannot be incorporated into the
      mitoribosome; either route lowers the amount of functional PTCD3.
    evidence:
    - reference: PMID:36450274
      reference_title: "Leigh syndrome is the main clinical characteristic of PTCD3 deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Results demonstrated that PTCD3 protein was significantly reduced in patients' cells, with 70% (P1) and 85% (P2.1) reduction when compared to controls"
      explanation: >-
        Quantifies the protein consequence of the splicing lesion in the same patients'
        fibroblasts in which the splicing defect was demonstrated.
- name: Depletion of PTCD3 Protein
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    PTCD3 protein is reduced but, in the patients with a leaky splice allele, not
    absent - 70% and 85% below control in the two 2023 patients tested. The index
    patient's two truncating alleles leave it nearly absent. This quantitative
    difference is the residual-function hypothesis the field currently uses to
    explain why some patients die in infancy and others reach their thirties.
  molecular_functions:
  - preferred_term: mRNA binding
    term:
      id: GO:0003729
      label: mRNA binding
    modifier: DECREASED
  evidence:
  - reference: PMID:39544688
    reference_title: "The phenotypic spectrum of PTCD3 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The PTCD3 gene product (protein PTCD3 or MRPS39) forms the entry channel of the mitochondrial small ribosomal subunit and binds to single-stranded mRNA."
    explanation: The molecular function that is lost when the protein is depleted.
  downstream:
  - target: Destabilization of the Mitochondrial Small Ribosomal Subunit
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30607703
      reference_title: "Mitochondrial ribosomal protein PTCD3 mutations cause oxidative phosphorylation defects with Leigh syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Quantitative proteomic analysis revealed decreased levels of the small mitoribosomal subunits."
      explanation: >-
        Loss of PTCD3 is accompanied by loss of the rest of the small subunit, which is
        what makes this a subunit-destabilisation mechanism rather than the loss of one
        protein's activity.
- name: Destabilization of the Mitochondrial Small Ribosomal Subunit
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Quantitative proteomics in the index patient's fibroblasts showed the small
    mitoribosomal subunit as a whole is depleted, not just PTCD3. PTCD3 sits at the
    mRNA entry channel, so its loss removes both a structural component and the site
    at which mitochondrial mRNA is engaged.
  cellular_components:

name: Combined Oxidative Phosphorylation Deficiency 51
category: Mendelian
creation_date: "2026-09-07T00:00:00Z"
synonyms:
- COXPD51
- PTCD3 deficiency
- MRPS39-related combined oxidative phosphorylation deficiency
description: >-
  Combined oxidative phosphorylation deficiency 51 (COXPD51) is an autosomal
  recessive mitochondrial disease caused by biallelic variants in PTCD3 (also
  called MRPS39, and mS39 in the standardised mitoribosome nomenclature). PTCD3
  is a pentatricopeptide-repeat RNA-binding protein of the small subunit of the
  mitochondrial ribosome, where it forms the mRNA entry channel. The lesion
  therefore sits in the mitochondrial translation apparatus itself rather than in
  any single respiratory-chain subunit.

  The consequence follows from where mitochondria get their proteins. Thirteen
  respiratory-chain subunits are encoded by mitochondrial DNA and made on the
  mitoribosome; every other subunit is nuclear-encoded and imported. Losing
  PTCD3 destabilises the small mitoribosomal subunit and impairs translation of
  all thirteen at once, so several complexes fail together - the "combined" of
  the name. What the published patients actually show is a consistent complex I
  and complex IV defect, a variable complex III defect, and unchanged complex V
  and complex II subunit levels. Complex II is built entirely from
  nuclear-encoded subunits, so its being spared is a mechanistically informative
  negative and a pointer toward translation rather than toward an individual
  complex.

  Two clinical poles have been described from a total of seven patients. The
  severe pole is Leigh or Leigh-like syndrome: onset in the first weeks to months
  of life with psychomotor delay, respiratory insufficiency, feeding difficulties,
  dystonia, seizures, optic atrophy and nystagmus, with bilateral basal-ganglia
  and thalamic MRI change, and death in the first or second decade. The mild pole,
  described in 2024, is an adult sibling pair in their thirties with optic atrophy,
  nystagmus, tremor, truncal ataxia, spasticity and a motor polyneuropathy but
  only mild cognitive decline - a chronic ataxia/optic-neuropathy phenotype that
  would not usually prompt a Leigh-syndrome workup. Optic atrophy and nystagmus
  are the features that run through both poles, present in six of the seven
  reported patients. Management is entirely supportive; every cofactor and
  mitochondrial-cocktail regimen reported in these patients was ineffective.

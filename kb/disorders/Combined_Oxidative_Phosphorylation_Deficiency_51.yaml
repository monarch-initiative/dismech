    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PTCD3, a member of the pentatricopeptide repeat domain protein family, is a component of the small mitoribosomal subunit."
    explanation: Places PTCD3 structurally within the subunit whose steady-state level falls.
  downstream:

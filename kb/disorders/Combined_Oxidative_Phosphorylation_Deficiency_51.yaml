    Loss of acquired milestones after a period of normal or near-normal early
    development. This is what makes the disease a Leigh rather than a static
    encephalopathy, and it is the axis the entry uses to separate the two clinical
    poles: in the severe pole regression follows a short normal interval and is
    punctuated by metabolic decompensations, while the adult siblings show only mild
    cognitive decline after normal early development. Documented in three of the seven
    published patients.

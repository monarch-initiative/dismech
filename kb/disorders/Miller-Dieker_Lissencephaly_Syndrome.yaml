differential_diagnoses:
- name: Isolated Lissencephaly Sequence (PAFAH1B1-Related Lissencephaly)
  disease_term:
    preferred_term: lissencephaly due to LIS1 mutation
    term:
      id: MONDO:0011830
      label: lissencephaly due to LIS1 mutation
  description: >-
    Isolated lissencephaly sequence (ILS) and Miller-Dieker lissencephaly
    syndrome both result from PAFAH1B1 (LIS1) haploinsufficiency at 17p13.3 and
    share classical smooth cerebral cortex (lissencephaly), developmental
    delay, intellectual disability, and seizures.
  distinguishing_features:
  - Caused by intragenic PAFAH1B1 pathogenic variants or smaller 17p13.3 deletions that spare YWHAE (14-3-3 epsilon) and telomeric genes
  - Less severe neuronal migration disorder than Miller-Dieker syndrome, lacking the additional craniofacial dysmorphisms, congenital anomalies, poor muscle tone, and abnormal spasticity seen with larger 17p13.3 deletions
  evidence:
  - reference: PMID:29628935
    reference_title: "Neurodevelopmental Genetic Diseases Associated With Microdeletions and Microduplications of Chromosome 17p13.3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Chromosome microdeletions within 17p13.3 can result in either isolated
      lissencephaly sequence (ILS) or Miller-Dieker syndrome (MDS). Both
      conditions are associated with a smooth cerebral cortex, or lissencephaly,
      which leads to developmental delay, intellectual disability, and seizures.
      However, patients with MDS have larger deletions than patients with ILS,
      resulting in additional symptoms such as poor muscle tone, congenital
      anomalies, abnormal spasticity, and craniofacial dysmorphisms.
    explanation: >-
      Directly compares ILS and MDS, noting shared lissencephaly, developmental
      delay, intellectual disability, and seizures versus the larger deletions
      and additional craniofacial and congenital anomalies in MDS.
  - reference: PMID:12796778
    reference_title: "14-3-3epsilon is important for neuronal migration by binding to NUDEL: a molecular explanation for Miller-Dieker syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous deletions of 17p13.3 result in the human neuronal migration
      disorders isolated lissencephaly sequence (ILS) and the more severe
      Miller-Dieker syndrome (MDS). Mutations in PAFAH1B1 (the gene encoding
      LIS1) are responsible for ILS and contribute to MDS, but the genetic
      causes of the greater severity of MDS are unknown. Here, we show that the
      gene encoding 14-3-3epsilon (YWHAE), one of a family of ubiquitous
      phosphoserine/threonine-binding proteins, is always deleted in individuals
      with MDS.
    explanation: >-
      Distinguishes ILS (PAFAH1B1 mutation/deletion alone) from MDS (always
      including deletion of YWHAE alongside PAFAH1B1).
- name: Distal 17p13.3 Microdeletion Syndrome (YWHAE-Included, PAFAH1B1-Sparing)
  description: >-
    Telomeric 17p13.3 microdeletions that include YWHAE but exclude PAFAH1B1
    share chromosome 17p13.3 copy-number loss, developmental delay, and
    craniofacial dysmorphic features with Miller-Dieker syndrome.
  distinguishing_features:
  - Spares PAFAH1B1 (LIS1) on chromosomal microarray breakpoint mapping
  - Absence of classical lissencephaly, presenting instead with a milder phenotype of dysmorphic facial features, developmental delay, and leukoencephalopathy
  evidence:
  - reference: PMID:36433683
    reference_title: "Further expansion and confirmation of phenotype in rare loss of YWHAE gene distinct from Miller-Dieker syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Through our clinical genetics practice, we identified four individuals
      with 17p13.3 deletion that include YWHAE but not PAFAH1B1. These patients
      have a similar phenotype of dysmorphic facial features, developmental
      delay, and leukoencephalopathy.
    explanation: >-
      Characterizes the clinical presentation of 17p13.3 deletions involving
      YWHAE while sparing PAFAH1B1.
  - reference: PMID:36433683
    reference_title: "Further expansion and confirmation of phenotype in rare loss of YWHAE gene distinct from Miller-Dieker syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We conclude that deletion of 17p13.3 excluding PAFAH1B1 but including
      YWHAE is associated with a consistent phenotype and should be considered
      a distinct condition from MDS.
    explanation: >-
      Establishes PAFAH1B1-sparing, YWHAE-including 17p13.3 deletion as a
      distinct clinical entity in the differential diagnosis of MDS.
- name: Chromosome 17p13.3 Microduplication Syndrome
  description: >-
    Reciprocal microduplications of the 17p13.3 region affect the same genomic
    locus and are categorized into class I (duplicating YWHAE without
    PAFAH1B1, generally resulting in learning disabilities, autism, and
    developmental delays) and class II (duplicating PAFAH1B1 with or without
    YWHAE, generally resulting in smaller body size, developmental delays,
    microcephaly, and other brain malformations).
  distinguishing_features:
  - Caused by copy-number gain (microduplication) rather than microdeletion at 17p13.3
  - Class I microduplications spare PAFAH1B1 and present with learning disabilities, autism, and developmental delays, whereas class II microduplications include PAFAH1B1 and result in smaller body size, microcephaly, and other brain malformations rather than deletion-associated Miller-Dieker syndrome
  evidence:
  - reference: PMID:29628935
    reference_title: "Neurodevelopmental Genetic Diseases Associated With Microdeletions and Microduplications of Chromosome 17p13.3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Depending on the genes involved in their microduplication, patients with
      17p13.3 microduplication syndrome may be categorized into either class I
      or class II. Individuals in class I have microduplications of the YWHAE
      gene encoding 14-3-3ε, as well as other genes in the region. However, the
      PAFAH1B1 gene encoding LIS1 is never duplicated in these patients. Class
      I microduplications generally result in learning disabilities, autism,
      and developmental delays, among other disorders.
    explanation: >-
      Defines class I 17p13.3 microduplication syndrome (duplicating YWHAE
      while sparing PAFAH1B1) and its associated neurodevelopmental phenotypes.
  - reference: PMID:29628935
    reference_title: "Neurodevelopmental Genetic Diseases Associated With Microdeletions and Microduplications of Chromosome 17p13.3."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Individuals in class II always have microduplications of the PAFAH1B1
      gene, which may include YWHAE and other genetic microduplications. Class
      II microduplications generally result in smaller body size, developmental
      delays, microcephaly, and other brain malformations.
    explanation: >-
      Defines class II 17p13.3 microduplication syndrome (always duplicating
      PAFAH1B1) and its associated phenotypes of smaller body size,
      developmental delays, microcephaly, and other brain malformations.

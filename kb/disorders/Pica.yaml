- name: Lead toxicity recognition and management
  description: >-
    Because pica is a leading route to childhood lead exposure, blood lead
    screening and prompt treatment of identified lead poisoning are part of
    routine pica management alongside treatment of the underlying cause.
  therapeutic_modality: OTHER
  action_category: SCREENING
  treatment_term:
    preferred_term: blood lead screening
    term:
      id: NCIT:C15419
      label: Disease Screening
  evidence:
  - reference: DOI:10.2174/1573396315666190313163530
    reference_title: "Pica: A Common Condition that is Commonly Missed - An Update Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Complications such as gastrointestinal obstruction and lead poisoning
      should be promptly recognized and treated.
    explanation: >-
      Review guidance that lead poisoning is a pica complication requiring
      prompt recognition and treatment, supporting screening and management as
      a curated intervention.
  - reference: DOI:10.2174/1573396315666190313163530
    reference_title: "Pica: A Common Condition that is Commonly Missed - An Update Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Pica is a significant cause of anemia and lead poisoning.
    explanation: >-
      Establishes lead poisoning as a principal pica complication, giving the
      rationale for lead-directed screening in this population.
- name: Environmental modification and caregiver supervision
  description: >-
    Restricting access to inedible and lead-containing material, training the
    child to discriminate edible from inedible items, and improving supervision
    and housing conditions are the mainstay of management in children of normal
    intelligence, in whom pica generally remits with these measures.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: environmental exposure modification
    term:
      id: NCIT:C15900
      label: Lifestyle Therapy
  evidence:
  - reference: DOI:10.2174/1573396315666190313163530
    reference_title: "Pica: A Common Condition that is Commonly Missed - An Update Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pica generally resolves in children of normal intelligence after they have
      been trained to discriminate between edible and inedible items and proper
      supervision is provided.
    explanation: >-
      Supports discrimination training plus supervision - the behavioral and
      environmental-access arm of management - as sufficient for remission in
      developmentally typical children.
  - reference: DOI:10.2174/1573396315666190313163530

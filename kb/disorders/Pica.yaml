    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Picas associated with ASD are resistant to medications but can be treated
      with applied behavioral analysis therapy (ABA).
    explanation: >-
      Review evidence supports applied behavior analysis for pica in autism
      spectrum disorder.
- name: Endoscopic or surgical bezoar removal
  description: >-
    Bezoars and ingested foreign material causing obstruction, perforation, or
    intussusception are removed endoscopically or surgically as complication
    management.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: endoscopic or surgical removal of ingested foreign material
    term:

  description: >-
    Identification and treatment of iron (and where present zinc) deficiency is
    first-line when a nutritional driver is found, and frequently resolves the
    pica behavior.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: iron supplementation
    term:
      id: NCIT:C15425
      label: Nutritional Supplementation
    therapeutic_agent:
    - preferred_term: iron
      term:
        id: CHEBI:18248
        label: iron atom
  evidence:
  - reference: PMID:37220446
    reference_title: "The Association Between Pica and Iron-Deficiency Anemia: A Scoping Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the identification of pica symptoms allowed treatment for iron deficiency
      and led to the resolution of all symptoms in all 20 articles
    explanation: >-
      Scoping-review evidence supports iron repletion as an effective treatment
      for iron-deficiency-associated pica.
- name: Behavioral intervention (applied behavior analysis)
  description: >-
    In autism spectrum disorder / intellectual disability, pica tends to be
    medication-resistant and is managed with behavioral interventions —
    applied behavior analysis, differential reinforcement, and response
    interruption/redirection.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: applied behavior analysis
    term:
      id: NCIT:C15184
      label: Behavioral Intervention
  evidence:
  - reference: PMID:35674869

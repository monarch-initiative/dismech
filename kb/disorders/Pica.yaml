  - reference: PMID:33408069
    reference_title: Pica, Autism, and Other Disabilities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      in the following subgroups: ASD with ID (28.1%), ASD without ID (14.0%)
    explanation: >-
      Case-control evidence supports the highest pica prevalence in autism
      spectrum disorder with co-occurring intellectual disability.
genetic:
- name: Multifactorial / syndromic liability (no single causal gene)
  association: Risk Factor
  notes: >-
    Pica is not a monogenic disease and has no OMIM/ClinVar causal gene. Genetic
    contribution is indirect, mediated through neurodevelopmental syndromes in
    which pica is over-represented (e.g., Smith-Magenis syndrome [RAI1],
    Prader-Willi syndrome, and other autism/intellectual-disability etiologies).
  evidence:
  - reference: PMID:33408069
    reference_title: Pica, Autism, and Other Disabilities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      pica was higher in children with ASD (23.2%) and DD (8.4%), and in the
      following subgroups: ASD with ID (28.1%), ASD without ID (14.0%)
    explanation: >-
      Case-control evidence supports neurodevelopmental disability (a largely
      genetic liability) as the dominant heritable risk context for pica.

name: Pica
creation_date: "2026-07-29T00:00:00Z"
category: Psychiatric
description: >-
  Pica is a feeding and eating disorder defined by the persistent eating of
  non-nutritive, non-food substances (e.g., earth/clay [geophagia], ice
  [pagophagia], starch [amylophagia], paper, hair [trichophagia], paint chips)
  over a period of at least one month, that is developmentally inappropriate
  and not part of a culturally sanctioned practice. It is best understood as a
  convergent behavioral endpoint reached by several overlapping routes —
  micronutrient (especially iron) deficiency, neurodevelopmental disability
  (autism spectrum disorder / intellectual disability), pregnancy, and other
  medical conditions (chronic kidney disease, sickle cell disease) — rather
  than a single-cause disease.
disease_term:
  preferred_term: pica disease
  term:
    id: MONDO:0001441
    label: pica disease
parents:
- Eating Disorder
- Mental Health Disorder
mechanistic_hypotheses:
- hypothesis_group_id: luminal_iron_sequestration
  hypothesis_label: Pica-Substance Luminal Iron Sequestration
  status: EMERGING
  description: >-
    The proposal that ingested geophagia substances (clay/kaolin) themselves
    worsen iron status by binding iron in the gut lumen or otherwise inhibiting
    its absorption, closing a self-reinforcing loop with the iron-deficiency
    route to pica. The direction of causality between pica and iron deficiency
    is genuinely unsettled, and the specific binding mechanism is contested.
  evidence:
  - reference: PMID:37220446
    reference_title: "The Association Between Pica and Iron-Deficiency Anemia: A Scoping Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some authors have suggested that pica may be inducing iron deficiency by
      replacing dietary iron sources or inhibiting the absorption of iron
    explanation: >-
      Documents the hypothesis as a suggestion in the literature rather than an
      established finding.
  - reference: PMID:37220446
    reference_title: "The Association Between Pica and Iron-Deficiency Anemia: A Scoping Review."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      there is a suggestion that geophagia substances do not bind to
      bioavailable iron and are not responsible for reduced iron absorption
    explanation: >-
      Seim et al. contest the binding mechanism, which is why this group is
      EMERGING rather than CANONICAL.
  notes: >-
    The same scoping review notes that many researchers and clinicians instead
    hold that iron deficiency itself induces pica - i.e. the opposite causal
    direction, already modeled by the "Iron Deficiency and CNS Dopaminergic
    Dysregulation" node. Both directions are retained because the review does
    not settle between them.

pathophysiology:
- name: Multifactorial Convergent Liability
  description: >-
    Pica is modeled as a convergent behavioral phenotype with no single cause:
    micronutrient deficiency, neurodevelopmental disability, pregnancy, and
    systemic medical illness each provide a route to the shared endpoint of
    persistent non-nutritive ingestion.
  biological_scale: ORGANISM
  downstream:
  - target: Iron Deficiency and CNS Dopaminergic Dysregulation
    description: >-
      Micronutrient (iron) deficiency is one of the best-supported upstream
      routes to pica.
  - target: Automatic Sensory Reinforcement
    description: >-
      In autism spectrum disorder / intellectual disability, pica is modeled as
      a behaviorally reinforced route rather than a deficiency-driven one.
  evidence:
  - reference: PMID:35674869
    reference_title: The Neurology and Psychopathology of Pica.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This article reviews the association of pica with pregnancy,
      micronutrient deficiencies, psychiatric disorders, dementia, and
      developmental disorders with emphasis on autism spectrum disorders (ASD).
    explanation: >-
      Review evidence supports pica as a multifactorial behavior with several
      distinct upstream associations.
- name: Iron Deficiency and CNS Dopaminergic Dysregulation
  description: >-
    Iron deficiency (dietary insufficiency, GI blood loss, pregnancy demand,
    malabsorption) reduces CNS iron availability. Because iron is a cofactor for
    tyrosine hydroxylase, the rate-limiting enzyme of dopamine synthesis, iron
    deficiency is hypothesized to disrupt central dopaminergic neurotransmission
    and drive aberrant craving directed at non-nutritive substances.
  biological_scale: MOLECULAR
  cell_types:
  - preferred_term: Midbrain dopaminergic neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  biological_processes:
  - preferred_term: Dopamine biosynthesis
    term:
      id: GO:0042416
      label: dopamine biosynthetic process
    modifier: DECREASED
  - preferred_term: Iron ion transport
    term:
      id: GO:0006826
      label: iron ion transport
    modifier: DECREASED
  downstream:
  - target: Non-Nutritive Substance Ingestion
    description: >-
      Dopaminergic craving is modeled upstream of the core ingestion behavior.
  evidence:
  - reference: PMID:35674869
    reference_title: The Neurology and Psychopathology of Pica.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the strong association of pica with iron deficiency anemia (IDA) lends
      credence to the hypothesis that dopamine transmission may be disrupted in
      this disorder
    explanation: >-
      Review evidence supports the iron-deficiency / disrupted-dopamine
      mechanistic hypothesis for pica.
- name: Non-Nutritive Substance Ingestion
  description: >-
    The core, defining behavior of pica: persistent ingestion of substances
    with no nutritive or food value, developmentally inappropriate and not
    culturally sanctioned, for at least one month.
  biological_scale: ORGANISM
  downstream:
  - target: Gut Luminal Iron Sequestration
    description: >-
      Ingestion of clay/kaolin can bind luminal iron and worsen the underlying
      deficiency, forming a self-reinforcing loop.
  - target: Mechanical Gastrointestinal Complications
    description: >-
      Ingested indigestible material can aggregate into bezoars and obstruct.
  - target: Toxic and Infectious Ingestion Sequelae
    description: >-
      Ingested soil/paint can carry lead, heavy metals, and soil-transmitted
      parasites.
  - target: Pica Behavior
    description: >-
      The pathophysiologic ingestion event maps to the clinical pica phenotype.
  evidence:
  - reference: PMID:35674869
    reference_title: The Neurology and Psychopathology of Pica.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the ongoing ingestion of materials with no nutritive or food value
    explanation: >-
      Review evidence supports the definition of the core pica behavior as
      persistent ingestion of non-nutritive material.
- name: Gut Luminal Iron Sequestration
  description: >-
    Clay/kaolin ingested as pica has been proposed to adsorb free iron in the
    intestinal lumen, reducing bioavailable iron in the duodenum and
    paradoxically deepening the iron deficiency that helped drive the behavior
    — a self-reinforcing loop. This binding mechanism is contested: Seim et al.
    report that geophagia substances do not bind bioavailable iron and are not
    responsible for reduced absorption, so the node is retained as an EMERGING
    hypothesis rather than an established mechanism.
  mechanism_confidence: PROVISIONAL
  biological_scale: TISSUE
  cell_types:
  - preferred_term: Duodenal enterocyte
    term:
      id: CL:0000584
      label: enterocyte
  downstream:
  - target: Iron Deficiency and CNS Dopaminergic Dysregulation
    description: >-
      Luminal iron sequestration is proposed to feed back onto the
      iron-deficiency route, but the underlying binding mechanism is contested
      (see hypothesis group `luminal_iron_sequestration`).
    hypothesis_groups:
    - luminal_iron_sequestration
  evidence:
  - reference: PMID:37220446
    reference_title: "The Association Between Pica and Iron-Deficiency Anemia: A Scoping Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Some authors have suggested that pica may be inducing iron deficiency by
      replacing dietary iron sources or inhibiting the absorption of iron
    explanation: >-
      States the proposed direction of causality this node models - that pica
      substances themselves worsen iron status, whether by displacing dietary
      iron or by inhibiting its absorption. Note this is reported as a
      suggestion by some authors, not a demonstrated mechanism, so this is
      recorded as PARTIAL support, matching the same quote's use in the
      `luminal_iron_sequestration` hypothesis group.
  - reference: PMID:37220446
    reference_title: "The Association Between Pica and Iron-Deficiency Anemia: A Scoping Review."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      there is a suggestion that geophagia substances do not bind to
      bioavailable iron and are not responsible for reduced iron absorption
    explanation: >-
      Seim et al., cited within the same scoping review, directly contest the
      adsorption mechanism this node asserts: geophagia substances are reported
      not to bind bioavailable iron and not to account for reduced absorption.
      This is the reason the node is scoped to an EMERGING hypothesis rather
      than a canonical mechanism.
- name: Automatic Sensory Reinforcement
  description: >-
    In autism spectrum disorder and intellectual disability, pica is generally
    conceptualized not as deficiency-driven craving but as a stereotyped,
    self-stimulatory behavior maintained by automatic (sensory) reinforcement,
    independent of nutritional status — hence its responsiveness to applied
    behavior analysis rather than medication.
  biological_scale: ORGANISM
  downstream:
  - target: Non-Nutritive Substance Ingestion
    description: >-
      Sensory reinforcement is modeled as an alternative upstream driver of the
      core ingestion behavior in neurodevelopmental disability.
  evidence:
  - reference: PMID:35674869
    reference_title: The Neurology and Psychopathology of Pica.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Picas associated with ASD are resistant to medications but can be treated
      with applied behavioral analysis therapy (ABA).
    explanation: >-
      Review evidence supports a behaviorally-reinforced (ABA-responsive,
      medication-resistant) mechanism for pica in autism spectrum disorder.
- name: Mechanical Gastrointestinal Complications
  description: >-
    Persistent ingestion of indigestible material (hair, soil, stones) can
    aggregate into bezoars, producing gastrointestinal obstruction, and in
    severe trichobezoar cases intestinal obstruction or intussusception.
  biological_scale: TISSUE
  downstream:
  - target: Intestinal Obstruction
    description: Bezoar formation is modeled upstream of the obstruction phenotype.
  evidence:
  - reference: PMID:37220446
    reference_title: "The Association Between Pica and Iron-Deficiency Anemia: A Scoping Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      another patient presented with a need for gastric bypass because of
      cardboard and paper bezoar causing gastric obstruction
    explanation: >-
      Directly documents the mechanism this node asserts: ingested non-nutritive
      material aggregating into a bezoar and producing gastric obstruction
      requiring surgical management.
  - reference: PMID:30360922
    reference_title: "Pica in end-stage chronic kidney disease: Literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      pica complications (anemia, altered electrolytes, poor absorption of
      micro and macronutrients and malnutrition) could be exacerbated in
    explanation: >-
      Supports the broader claim that pica produces systemic and nutritional
      complications that are worse in vulnerable populations. Note this snippet
      speaks to systemic complications, not to bezoar formation or obstruction
      specifically - that claim rests on the case evidence above.
- name: Toxic and Infectious Ingestion Sequelae
  description: >-
    Ingestion of soil and paint chips can deliver lead and other heavy metals
    (neurotoxicity) and soil-transmitted helminths (parasitic infection),
    especially in geophagia.
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:33408069
    reference_title: Pica, Autism, and Other Disabilities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pica, the repeated ingestion of nonfood items, can be life-threatening.
    explanation: >-
      Population study evidence supports the potential for severe, sometimes
      life-threatening complications of pica.
  - reference: DOI:10.2174/1573396315666190313163530
    reference_title: "Pica: A Common Condition that is Commonly Missed - An Update Review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pica is a significant cause of anemia and lead poisoning.
    explanation: >-
      Review evidence identifies lead poisoning (and anemia) as major
      consequences of the ingestion behavior.
- name: Rodent Kaolin-Intake Emesis Analogue
  description: >-
    In rats and mice — species incapable of vomiting — emetogenic agents induce
    kaolin (clay) consumption ("pica") as a compensatory illness-response
    behavior. This rodent behavior is mediated by dopamine D2 receptors in the
    chemoreceptor trigger zone and 5-HT3 receptors on gastric vagal afferents
    and is used as an emesis surrogate. It is a mechanistic analogue relevant to
    the pregnancy-nausea association, but is a model of emesis rather than of
    human craving-driven pica (a human-model mismatch).
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:8415820
    reference_title: "Pica in rats is analogous to emesis: an animal model in emesis research."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      pica in rats was induced through 1) dopamine D2 receptors in the
      chemoreceptor trigger zone, and 2) the stomach, partly via 5-HT3
      receptors in the visceral afferents in the stomach wall
    explanation: >-
      Rodent-model evidence establishes the dopaminergic/serotonergic mechanism
      of kaolin-intake "pica" as an emesis analogue; it supports the
      emesis-surrogate model, not human craving-driven pica directly.
phenotypes:
- name: Pica
  description: >-
    The core behavioral phenotype: persistent eating of non-nutritive, non-food
    substances inappropriate to developmental level.
  phenotype_term:
    preferred_term: Pica

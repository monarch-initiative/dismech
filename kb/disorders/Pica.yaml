differential_diagnoses:
- name: Avoidant Restrictive Food Intake Disorder
  description: >-
    ARFID also involves abnormal eating in the absence of body-image
    disturbance, but is defined by avoidance/restriction of normal food, not by
    ingestion of non-food substances.
  distinguishing_features:
  - >-
    Pica is defined by ingestion of non-nutritive, non-food substances; ARFID is
    defined by restriction/avoidance of food intake without craving for non-food
    items.
  disease_term:
    preferred_term: avoidant/restrictive food intake disorder
    term:
      id: MONDO:7770002
      label: avoidant/restrictive food intake disorder
- name: Culturally sanctioned geophagia
  description: >-
    Geophagia (deliberate clay/earth eating) is a normative cultural practice in
    some populations and is excluded from a pica diagnosis unless it is
    developmentally inappropriate and clinically harmful.
  distinguishing_features:
  - >-
    Culturally sanctioned non-food ingestion is not diagnosed as pica; a pica
    diagnosis requires the behavior to be outside cultural norms and clinically
    significant.

      id: HP:0011856
      label: Pica
  evidence:
  - reference: PMID:35674869
    reference_title: The Neurology and Psychopathology of Pica.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the ongoing ingestion of materials with no nutritive or food value
    explanation: >-
      Review evidence supports non-nutritive ingestion as the defining pica
      phenotype.
- name: Iron Deficiency Anemia
  description: >-
    Iron deficiency anemia is the most consistent laboratory correlate of pica
    and is frequently both a driver and a reversible treatment target.
  phenotype_term:
    preferred_term: Iron deficiency anemia
    term:
      id: HP:0001891
      label: Iron deficiency anemia
  evidence:
  - reference: PMID:37220446
    reference_title: "The Association Between Pica and Iron-Deficiency Anemia: A Scoping Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the identification of pica symptoms allowed treatment for iron deficiency
      and led to the resolution of all symptoms in all 20 articles
    explanation: >-
      Scoping-review evidence supports the strong, reversible association of
      pica with iron-deficiency anemia.
- name: Intestinal Obstruction
  description: >-
    Bezoar formation from ingested indigestible material can produce
    gastrointestinal/intestinal obstruction, a major complication of pica.
  phenotype_term:
    preferred_term: Intestinal obstruction
    term:
      id: HP:0005214
      label: Intestinal obstruction
  evidence:
  - reference: PMID:33408069
    reference_title: Pica, Autism, and Other Disabilities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pica, the repeated ingestion of nonfood items, can be life-threatening.
    explanation: >-
      Population study evidence supports the potential for severe complications
      such as obstruction from pica.
- name: Autistic Behavior
  description: >-
    Pica is strongly over-represented in autism spectrum disorder; autistic
    behavior is a major comorbidity context rather than a consequence of pica.
  phenotype_term:
    preferred_term: Autistic behavior
    term:
      id: HP:0000729
      label: Autistic behavior
  evidence:
  - reference: PMID:33408069
    reference_title: Pica, Autism, and Other Disabilities.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Compared with the prevalence of pica among POPs (3.5%), pica was higher
      in children with ASD (23.2%) and DD (8.4%)
    explanation: >-
      Case-control evidence supports markedly elevated pica prevalence in
      children with autism spectrum disorder.
- name: Intellectual Disability
  description: >-
    Intellectual disability is a strong comorbidity of pica; pica prevalence is
    highest in autism spectrum disorder with co-occurring intellectual
    disability.
  phenotype_term:
    preferred_term: Intellectual disability
    term:

  rate_per_100000: 3080.0
  notes: >-
    Ever-reported pica behavior across five waves (36-115 months), highest at
    36 months and declining with age; caregiver-reported behavior rather than a
    fully DSM-adjudicated diagnosis.
  evidence:
  - reference: DOI:10.1002/eat.24111
    reference_title: Prevalence and recurrence of pica behaviors in early childhood within the ALSPAC birth cohort
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 312 parents (3.08%) reported pica behaviors in their child. Of
      these, 19.55% reported pica at least at two waves (n = 61). Pica was most
      common at 36 months (N = 226; 2.29%) and decreased as children aged.
    explanation: >-
      Longitudinal general-population birth-cohort estimate of childhood pica
      behavior prevalence and its recurrence across waves.

      label: Foreign Body Removal
  evidence:
  - reference: PMID:37220446
    reference_title: "The Association Between Pica and Iron-Deficiency Anemia: A Scoping Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      another patient presented with a need for gastric bypass because of
      cardboard and paper bezoar causing gastric obstruction
    explanation: >-
      A case within the scoping review documents a pica-derived bezoar causing
      gastric obstruction and requiring surgical management, supporting

name: Tyrosinemia Type III
category: Mendelian
creation_date: '2026-08-21T00:00:00Z'
synonyms:
- Hereditary tyrosinemia type III
- HT III
- 4-Hydroxyphenylpyruvate dioxygenase deficiency
- HPD deficiency
- Tyrosinemia due to 4-hydroxyphenylpyruvate dioxygenase deficiency
- TYRSN3
description: >
  Tyrosinemia type III is the rarest of the three genetic tyrosinemias, an
  autosomal recessive inborn error caused by biallelic loss-of-function variants
  in HPD encoding 4-hydroxyphenylpyruvate dioxygenase, the second enzyme of the
  tyrosine catabolic pathway. Loss of HPD activity blocks conversion of
  4-hydroxyphenylpyruvate to homogentisate, producing hypertyrosinemia and
  massive urinary excretion of 4-hydroxyphenyl organic acids. Because the block
  sits upstream of the maleylacetoacetate and fumarylacetoacetate steps, no
  succinylacetone or other hepatotoxic intermediate is generated, and reported
  patients have had normal liver and renal function and no eye or skin disease
  — the distinction that separates this entry mechanistically from tyrosinemia
  type I (FAH) and type II (TAT). The clinical spectrum is dominated by variable
  neurodevelopmental manifestations (developmental delay, intellectual
  impairment, ataxia, seizures, ADHD), but the causal route from tyrosine
  elevation to neurological injury is unresolved: plasma tyrosine levels do not
  correlate with phenotype and biochemically affected individuals with normal
  development have been reported. Management is a phenylalanine- and
  tyrosine-restricted low-protein diet; nitisinone, which is therapeutic in
  tyrosinemia type I, is an HPD inhibitor and therefore pharmacologically
  reproduces rather than corrects this lesion.

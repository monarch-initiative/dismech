  - target: Neurodevelopmental dysfunction
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Despite lifelong hypertyrosinemia from a null HPD allele, the mutant
      animals were reported as apparently healthy with no evidence of
      hepatorenal dysfunction. No overt disease counterpart of the human
      neurodevelopmental phenotype was described.
    limitations: >-
      This is a negative on gross observation, not a measured absence. The
      characterising report describes no standardized neurobehavioural or
      neurodevelopmental testing, no neuropathology, and no cognitive or motor
      endpoints, so "apparently healthy" cannot exclude a phenotype that in
      humans is detected by developmental assessment rather than by inspection.

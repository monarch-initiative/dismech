    description: >
      Splice variants also cause the disorder: a homozygous IVS11+1G>A splice
      donor change in intron 11 was found in a newborn-screened boy, and a
      further novel splice-site variant was reported in a patient with
      developmental delay.
    evidence:
    - reference: PMID:23036342
      reference_title: "Tyrosinemia Type III detected via neonatal screening: management and outcome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report the case of a boy with tyrosinemia Type III detected using neonatal screening, who is homozygous for the splice donor mutation IVS11+1G>A in intron 11 of the HPD gene."
      explanation: Documents a homozygous splice donor allele.
    - reference: PMID:35707594
      reference_title: "Novel Cranial Imaging Findings and a Splice-Site Variant in a Patient with Tyrosinemia Type III, and a Summary of Published Cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The girl had a novel splice-site mutation in the HPD gene and ventriculomegaly in cranial imaging, which was not previously associated with tyrosinemia type III."
      explanation: Documents a second, novel splice-site allele.
  features: >
    HPD encodes 4-hydroxyphenylpyruvate dioxygenase, the second enzyme of
    tyrosine catabolism. Variants in the same gene cause two distinct diseases:
    biallelic loss-of-function alleles cause autosomal recessive tyrosinemia
    type III, while the heterozygous A33T change is associated with autosomal
    dominant hawkinsinuria (MONDO:0007700), which is not curated here.
  evidence:
  - reference: PMID:11073718
    reference_title: "Mutations in the 4-hydroxyphenylpyruvic acid dioxygenase gene are responsible for tyrosinemia type III and hawkinsinuria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These findings support the hypothesis that alterations in the structure and activity of HPD are causally related to two different metabolic disorders, tyrosinemia type III and hawkinsinuria."
    explanation: Establishes that HPD underlies two distinct disease entities, motivating separate dismech entries.
  - reference: PMID:11073718
    reference_title: "Mutations in the 4-hydroxyphenylpyruvic acid dioxygenase gene are responsible for tyrosinemia type III and hawkinsinuria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A heterozygous missense mutation predicting an Ala to Thr change at codon 33 (A33T) was found in the same HPD gene in the two patients with hawkinsinuria."
    explanation: Identifies the distinct heterozygous allele associated with the dominant sibling disorder.
diagnosis:
- name: Plasma amino acid and urine organic acid analysis
  description: >
    Diagnosis rests on elevated plasma tyrosine with characteristic
    p-hydroxyphenyl organic acids on urine organic acid analysis, and on the
    absence of succinylacetone, which excludes tyrosinemia type I.
  diagnosis_term:
    preferred_term: laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:16602095
    reference_title: "The genetic tyrosinemias."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "These disorders are diagnosed by observing elevated tyrosine by plasma amino acid chromatography and characteristic tyrosine metabolites by urine organic acid analysis."
    explanation: States the biochemical diagnostic approach for the genetic tyrosinemias.
- name: HPD molecular genetic testing
  description: >
    Identification of biallelic pathogenic HPD variants confirms the diagnosis;
    targeted next-generation sequencing has been used in a newborn-screened

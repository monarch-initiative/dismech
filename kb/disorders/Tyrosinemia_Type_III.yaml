    explanation: Documents ascertainment through neonatal screening.
treatments:
- name: Dietary phenylalanine and tyrosine restriction
  description: >
    A low-protein diet restricting phenylalanine and tyrosine, with a
    tyrosine-free amino acid substitute, is the standard management for all
    genetic tyrosinemias and lowers plasma tyrosine in this disorder. Whether it
    alters the neurological natural history is unresolved; the strongest
    supporting observation is that earlier initiation was associated with better
    neurological and behavioural outcome in an affected sibling pair.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Hypertyrosinemia and phenolic metabolite accumulation
    treatment_effect: INHIBITS
    description: >
      Restricting the dietary precursors of tyrosine reduces substrate delivery
      to the blocked step and lowers the circulating tyrosine burden.
    evidence:
    - reference: PMID:29456978
      reference_title: "A Case of Tyrosinemia Type III with Status Epilepticus and Mental Retardation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "She was treated with a diet low in tyrosine and phenylalanine and anamix formula that leading to catch-up growth and improvement of her symptoms. Plasma tyrosine level dropped to normal values."
      explanation: Human treatment response supports dietary restriction lowering the accumulating metabolite.
  evidence:
  - reference: PMID:16602095
    reference_title: "The genetic tyrosinemias."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Therapy consists of a diet low in phenylalanine and tyrosine for each of the tyrosinemias and 2-(2-nitro-4-trifluoromethylbenzoyl)-1,3-cyclohexanedione (NTBC) for tyrosinemia Type I."
    explanation: Establishes dietary restriction as the therapy common to all tyrosinemias and confines NTBC to type I.
  - reference: PMID:32520295
    reference_title: "TYROSINEMIA TYPE III: A CASE REPORT OF SIBLINGS AND LITERATURE REVIEW."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first case report describing siblings with HT III who underwent nutritional treatment with a low-protein diet in different phases of life, with a better neurological and behavioral evaluation in the patient who started treatment earlier."
    explanation: Within-family comparison suggesting benefit from earlier dietary initiation, but from a single sibling pair.
  - reference: PMID:11916315
    reference_title: "Outcome of tyrosinaemia type III."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "It is not clear whether a strict low tyrosine diet alters the natural history of tyrosinaemia type III, although there remains a suspicion that treatment may be important, at least in infancy."
    explanation: Explicitly limits the disease-modifying claim for dietary therapy.
- name: Developmental and neurological supportive care
  description: >
    Developmental, educational, and antiseizure support according to the
    individual neurological phenotype; one patient reported subjective gains in
    social skills and language after dietary therapy alongside falling tyrosine.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:35707594
    reference_title: "Novel Cranial Imaging Findings and a Splice-Site Variant in a Patient with Tyrosinemia Type III, and a Summary of Published Cases."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Our patient had mild subjective improvement in social skills and language development after dietary therapy was started and her tyrosine levels decreased."
    explanation: Single-patient, subjectively assessed developmental improvement; supports supportive developmental follow-up rather than a treatment effect.
discussions:
- discussion_id: tyrosinemia_iii_tyrosine_neurotoxicity_unresolved
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    If hypertyrosinemia is the only established biochemical abnormality in
    tyrosinemia type III, why does neither the severity of the HPD lesion nor
    the plasma tyrosine concentration predict the neurological phenotype, and
    what actually mediates the neurodevelopmental injury?
  rationale: >
    The pathograph edge from the metabolic block to neurodevelopmental
    dysfunction is the only edge in this entry that cannot be curated as DIRECT.
    Three independent observations refuse a simple dose-response model: the
    first mutation survey found no correlation between mutation severity,
    residual enzyme activity, mental function, or tyrosine level; an
    11-year-old girl with serum tyrosine of 425-535 micromol/L had no symptoms
    and normal mental development; and newborn-screened patients on mild protein
    restriction have had normal psychomotor development. Candidate explanations
    that the literature has not discriminated between include a critical early
    developmental window, a downstream phenolic metabolite rather than tyrosine
    itself, and ascertainment bias inflating the neurological association in a
    disorder historically found by investigating neurological symptoms.
  attaches_to:
  - pathophysiology#Hypertyrosinemia and phenolic metabolite accumulation
  - pathophysiology#Neurodevelopmental dysfunction
  proposed_experiments:
  - experiment_id: exp_ht3_screened_cohort_neurodevelopmental_followup
    name: Systematic neurodevelopmental follow-up of newborn-screened cohorts
    description: >
      Prospective, standardized neurocognitive assessment of all
      screening-ascertained HPD-deficient individuals, stratified by age at
      dietary initiation and by time-integrated tyrosine exposure, to separate
      ascertainment bias from a genuine exposure-response relationship.
    decision_criterion: >
      A monotonic relationship between time-integrated tyrosine exposure and
      neurocognitive score would support tyrosine itself as the mediator;
      normal outcomes across the full exposure range would refute it and
      redirect the search to a downstream phenolic metabolite or to
      ascertainment bias.
  evidence:
  - reference: PMID:10942115
    reference_title: "Mutations in the 4-hydroxyphenylpyruvate dioxygenase gene (HPD) in patients with tyrosinemia type III."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No correlation of the severity of the mutation and enzyme deficiency and mental function has been found; neither do the recorded tyrosine levels correlate with the clinical phenotype."
    explanation: The absence of a genotype-, enzyme-, or metabolite-phenotype correlation is the primary basis for the gap.
  - reference: PMID:28649543
    reference_title: "Tyrosinemia type III in an asymptomatic girl."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Presented case may suggest that high tyrosine concentration itself does not participate directly in neuronal damage described in patients with tyrosinemia type 3."
    explanation: A biochemically affected, neurologically normal patient supports the gap and argues against direct tyrosine neurotoxicity.
- discussion_id: tyrosinemia_iii_vs_nitisinone_phenocopy
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >
    Nitisinone is a pharmacological HPD inhibitor, so patients treated with it
    for tyrosinemia type I or alkaptonuria carry an acquired HPD block and
    develop tyrosine-driven corneal keratopathy and skin lesions. Why do
    genetically HPD-deficient patients not?
  rationale: >
    This is a direct, testable discrepancy between a genetic lesion and its
    pharmacological phenocopy at the same enzyme. Reported tyrosinemia type III
    patients have had no skin or eye abnormalities, whereas nitisinone-induced
    hypertyrosinemia in alkaptonuria causes skin issues and sight-threatening
    corneal keratopathy. Possible explanations that the literature has not
    resolved include a higher absolute tyrosine level reached under
    pharmacological blockade than under most reported genetic deficiency,
    residual HPD activity in hypomorphic genotypes, differences in the tissue
    distribution of the block, and the older age and longer exposure of
    nitisinone-treated adults. Resolving it would inform whether the ocular
    surveillance mandated for nitisinone-treated patients should extend to
    tyrosinemia type III.
  attaches_to:
  - pathophysiology#4-Hydroxyphenylpyruvate dioxygenase deficiency
  - pathophysiology#Hypertyrosinemia and phenolic metabolite accumulation
  evidence:
  - reference: PMID:11916315
    reference_title: "Outcome of tyrosinaemia type III."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All have had normal liver and renal function and none has skin or eye abnormalities."
    explanation: Establishes the absence of oculocutaneous disease in genetic HPD deficiency.
  - reference: PMID:39290064
    reference_title: "Evaluation of a casein glycomacropeptide-based protein substitute, in the dietary management of NTBC-induced tyrosinaemia in patients with alkaptonuria: A prospective open-label study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NTBC treatment of alkaptonuria (AKU) leads to increased blood tyrosine levels, causing skin issues and potentially sight-threatening corneal keratopathy."
    explanation: Establishes the contrasting oculocutaneous toxicity of pharmacological HPD blockade.
notes: >
  Position in the pathway. Tyrosine catabolism runs TAT then HPD then HGD then
  GSTZ1 then FAH. Dismech already curates the enzymatic block at three of these
  steps: Tyrosinemia Type II (TAT), Alkaptonuria (HGD), and Tyrosinemia Type I
  (FAH). This entry fills the HPD step. The clinical logic of the series is that
  severity tracks the toxicity of what accumulates behind the block, not the
  height of the tyrosine level: a block at FAH generates fumarylacetoacetate and
  succinylacetone and causes liver failure and hepatocellular carcinoma, a block
  at TAT deposits tyrosine crystals in cornea and skin, and a block at HPD
  accumulates only tyrosine and unreactive phenolic acids and produces neither.

  Nitisinone. HPD is the molecular target of nitisinone, the drug used to treat
  tyrosinemia type I and trialled in alkaptonuria. Nitisinone therefore has no
  role here: it would reproduce the lesion rather than correct it, which is
  consistent with the cited review confining NTBC to type I. The mirror-image
  relationship is curated as an OPEN_QUESTION discussion because the
  pharmacological block causes oculocutaneous disease that the genetic block
  does not.

  Hawkinsinuria. The same gene causes a second, autosomal dominant disorder
  (hawkinsinuria, MONDO:0007700) through the heterozygous A33T allele. That is a
  distinct disease entity with a distinct mechanism and inheritance and is
  deliberately not modelled as a subtype here; it remains an open IEMbase
  WP-002 row (1.4.04.01).

  Frequencies. No phenotype carries a frequency band. The published literature
  is a small number of individual case reports and a 19-patient summary without
  a defensible denominator, and per the repository's frequency-evidence SOP an
  omitted band is preferred to a fabricated one.

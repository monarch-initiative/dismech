    causal_link_type: DIRECT
    evidence:
    - reference: PMID:32520295
      reference_title: "TYROSINEMIA TYPE III: A CASE REPORT OF SIBLINGS AND LITERATURE REVIEW."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The neurological involvement varies, including intellectual impairment and attention deficit disorder with hyperactivity (ADHD)."
      explanation: Names ADHD as one of the varying neurological expressions of the disorder.

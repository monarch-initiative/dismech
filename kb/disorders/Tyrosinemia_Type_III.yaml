discussions:
- discussion_id: tyrosinemia_iii_tyrosine_neurotoxicity_unresolved
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >
    If hypertyrosinemia is the only established biochemical abnormality in
    tyrosinemia type III, why does neither the severity of the HPD lesion nor
    the plasma tyrosine concentration predict the neurological phenotype, and
    what actually mediates the neurodevelopmental injury?
  rationale: >
    The pathograph edge from the metabolic block to neurodevelopmental
    dysfunction is the only edge in this entry that cannot be curated as DIRECT.
    Three independent observations refuse a simple dose-response model: the
    first mutation survey found no correlation between mutation severity,
    residual enzyme activity, mental function, or tyrosine level; an
    11-year-old girl with serum tyrosine of 425-535 micromol/L had no symptoms
    and normal mental development; and newborn-screened patients on mild protein
    restriction have had normal psychomotor development. Candidate explanations
    that the literature has not discriminated between include a critical early
    developmental window, a downstream phenolic metabolite rather than tyrosine
    itself, and ascertainment bias inflating the neurological association in a
    disorder historically found by investigating neurological symptoms.
  attaches_to:
  - pathophysiology#Hypertyrosinemia and phenolic metabolite accumulation
  - pathophysiology#Neurodevelopmental dysfunction
  proposed_experiments:
  - experiment_id: exp_ht3_screened_cohort_neurodevelopmental_followup
    name: Systematic neurodevelopmental follow-up of newborn-screened cohorts
    description: >
      Prospective, standardized neurocognitive assessment of all
      screening-ascertained HPD-deficient individuals, stratified by age at
      dietary initiation and by time-integrated tyrosine exposure, to separate
      ascertainment bias from a genuine exposure-response relationship.
    decision_criterion: >
      A monotonic relationship between time-integrated tyrosine exposure and
      neurocognitive score would support tyrosine itself as the mediator;
      normal outcomes across the full exposure range would refute it and
      redirect the search to a downstream phenolic metabolite or to
      ascertainment bias.
  evidence:
  - reference: PMID:10942115
    reference_title: "Mutations in the 4-hydroxyphenylpyruvate dioxygenase gene (HPD) in patients with tyrosinemia type III."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No correlation of the severity of the mutation and enzyme deficiency and mental function has been found; neither do the recorded tyrosine levels correlate with the clinical phenotype."
    explanation: The absence of a genotype-, enzyme-, or metabolite-phenotype correlation is the primary basis for the gap.
  - reference: PMID:28649543
    reference_title: "Tyrosinemia type III in an asymptomatic girl."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Presented case may suggest that high tyrosine concentration itself does not participate directly in neuronal damage described in patients with tyrosinemia type 3."
    explanation: A biochemically affected, neurologically normal patient supports the gap and argues against direct tyrosine neurotoxicity.
- discussion_id: tyrosinemia_iii_vs_nitisinone_phenocopy
  kind: OPEN_QUESTION
  status: OPEN
  prompt: >
    Nitisinone is a pharmacological HPD inhibitor, so patients treated with it
    for tyrosinemia type I or alkaptonuria carry an acquired HPD block and
    develop tyrosine-driven corneal keratopathy and skin lesions. Why do
    genetically HPD-deficient patients not?
  rationale: >
    This is a direct, testable discrepancy between a genetic lesion and its
    pharmacological phenocopy at the same enzyme. Reported tyrosinemia type III
    patients have had no skin or eye abnormalities, whereas nitisinone-induced
    hypertyrosinemia in alkaptonuria causes skin issues and sight-threatening
    corneal keratopathy. Possible explanations that the literature has not
    resolved include a higher absolute tyrosine level reached under
    pharmacological blockade than under most reported genetic deficiency,
    residual HPD activity in hypomorphic genotypes, differences in the tissue
    distribution of the block, and the older age and longer exposure of
    nitisinone-treated adults. Resolving it would inform whether the ocular
    surveillance mandated for nitisinone-treated patients should extend to
    tyrosinemia type III.
  attaches_to:
  - pathophysiology#4-Hydroxyphenylpyruvate dioxygenase deficiency
  - pathophysiology#Hypertyrosinemia and phenolic metabolite accumulation
  evidence:
  - reference: PMID:11916315
    reference_title: "Outcome of tyrosinaemia type III."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All have had normal liver and renal function and none has skin or eye abnormalities."
    explanation: Establishes the absence of oculocutaneous disease in genetic HPD deficiency.
  - reference: PMID:39290064
    reference_title: "Evaluation of a casein glycomacropeptide-based protein substitute, in the dietary management of NTBC-induced tyrosinaemia in patients with alkaptonuria: A prospective open-label study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NTBC treatment of alkaptonuria (AKU) leads to increased blood tyrosine levels, causing skin issues and potentially sight-threatening corneal keratopathy."
    explanation: Establishes the contrasting oculocutaneous toxicity of pharmacological HPD blockade.
- discussion_id: tyrosinemia_iii_mouse_model_neurodevelopmental_silence
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >
    Mouse strain III carries a null Hpd allele and lifelong hypertyrosinemia yet
    was reported as apparently healthy, while the dominant consequence of the
    human disorder is neurodevelopmental. Is the mouse genuinely spared, or has
    the phenotype simply never been looked for with an assay capable of
    detecting it?
  rationale: >
    The strain is a high-fidelity model of the two upstream nodes of this entry:
    hepatic HPD activity and protein are absent with the flanking pathway
    enzymes intact, and the biochemical signature — persistent hypertyrosinemia,
    increased urinary 4-hydroxyphenyl derivatives, no succinylacetone —
    reproduces the human one including its discriminating negative. That
    fidelity is exactly what makes the third node's silence hard to read. If the
    mouse is truly unaffected, that is evidence against tyrosine itself as the
    neurotoxic agent and would strengthen the alternative explanations already
    curated in the tyrosine-neurotoxicity knowledge gap: a downstream phenolic
    metabolite, a human-specific critical developmental window, or ascertainment
    bias in a disorder historically found by investigating neurological
    symptoms. But the only reported phenotypic assessment is gross observation
    of general health plus hepatorenal chemistry. The human phenotype — mild
    intellectual impairment, developmental delay, ADHD, intermittent ataxia — is
    detected by developmental and neurocognitive assessment, not by inspection
    of an animal, and one reported human patient with serum tyrosine of 425-535
    micromol/L was herself entirely asymptomatic. Absence of an overt murine
    phenotype is therefore not yet a measurement, and the model must not be
    cited as evidence that hypertyrosinemia is neurologically harmless. The
    Ttc36-null mouse is the direct contrast that settles the reading: a mouse
    whose hepatic HPD is lowered post-translationally, and which was given
    actual learning and memory testing, shows hippocampal neuronal damage and
    cognitive deficits. Reduced HPD with tyrosinemia is therefore not inherently
    silent in mouse, and the difference between the two strains is most
    parsimoniously a difference in what was measured rather than in what
    happened — though the two models also differ in genetic architecture,
    completeness of the block, and the confound of TTC36's other substrates, so
    the comparison motivates the experiment below rather than substituting for
    it.
  attaches_to:
  - pathophysiology#Neurodevelopmental dysfunction
  proposed_experiments:
  - experiment_id: exp_ht3_mouse_strain_iii_neurobehavioural_phenotyping
    name: Standardized neurobehavioural phenotyping of the Hpd-null mouse strain
    description: >
      Battery-based neurobehavioural and neurodevelopmental assessment of
      homozygous strain III mice against littermate controls — learning and
      memory, motor coordination, activity and attention-analogous measures —
      paired with brain histology and myelination assessment, and with
      time-integrated plasma tyrosine measured so murine exposure can be placed
      on the human scale.
    decision_criterion: >
      A measurable deficit that tracks tyrosine exposure would support tyrosine
      or a proximal metabolite as the mediator and make the strain usable for
      intervention studies. A negative battery in animals whose exposure
      overlaps the human range would be genuine evidence of a human-specific
      mechanism and would redirect the search away from tyrosine itself. A
      negative battery at sub-human exposure would resolve nothing, which is the
      current state.
  evidence:
  - reference: PMID:2014797
    reference_title: "A murine model for type III tyrosinemia: lack of immunologically detectable 4-hydroxyphenylpyruvic acid dioxygenase enzyme protein in a novel mouse strain with hypertyrosinemia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "All the animals were apparently healthy, and there was no evidence of hepatorenal dysfunction."
    explanation: The sole reported phenotypic assessment of the strain, and the observation the mismatch turns on.
  - reference: PMID:2014797
    reference_title: "A murine model for type III tyrosinemia: lack of immunologically detectable 4-hydroxyphenylpyruvic acid dioxygenase enzyme protein in a novel mouse strain with hypertyrosinemia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These features are similar to type III tyrosinemia in humans."
    explanation: Establishes the biochemical fidelity that makes the absent neurological phenotype worth flagging rather than dismissing.
  - reference: PMID:35707594
    reference_title: "Novel Cranial Imaging Findings and a Splice-Site Variant in a Patient with Tyrosinemia Type III, and a Summary of Published Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although the clinical spectrum of the disease is not fully known, most patients present with neurodevelopmental symptoms."
    explanation: States the human phenotype that the model does not display, which is the other half of the mismatch.
  - reference: PMID:31537781
    reference_title: "HPD degradation regulated by the TTC36-STK33-PELI1 signaling axis induces tyrosinemia and neurological damage."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "and exhibit tyrosinemia, damage to hippocampal neurons, and deficits of learning and memory."
    explanation: >-
      A second mouse, with reduced hepatic HPD and tyrosinemia, does show
      neurological damage when learning and memory are actually tested — the
      contrast that makes strain III's silence a question about assay
      sensitivity. PARTIAL because these mice are Ttc36-null rather than
      Hpd-mutant.
notes: >
  Position in the pathway. Tyrosine catabolism runs TAT then HPD then HGD then
  GSTZ1 then FAH. Dismech already curates the enzymatic block at three of these
  steps: Tyrosinemia Type II (TAT), Alkaptonuria (HGD), and Tyrosinemia Type I
  (FAH). This entry fills the HPD step. The clinical logic of the series is that
  severity tracks the toxicity of what accumulates behind the block, not the
  height of the tyrosine level: a block at FAH generates fumarylacetoacetate and
  succinylacetone and causes liver failure and hepatocellular carcinoma, a block
  at TAT deposits tyrosine crystals in cornea and skin, and a block at HPD
  accumulates only tyrosine and unreactive phenolic acids and produces neither.

  Nitisinone. HPD is the molecular target of nitisinone, the drug used to treat
  tyrosinemia type I and trialled in alkaptonuria. Nitisinone therefore has no
  role here: it would reproduce the lesion rather than correct it, which is
  consistent with the cited review confining NTBC to type I. The mirror-image
  relationship is curated as an OPEN_QUESTION discussion because the
  pharmacological block causes oculocutaneous disease that the genetic block
  does not.

  Hawkinsinuria. The same gene causes a second, autosomal dominant disorder
  (hawkinsinuria, MONDO:0007700) through the heterozygous A33T allele. That is a
  distinct disease entity with a distinct mechanism and inheritance and is
  deliberately not modelled as a subtype here; it remains an open IEMbase
  WP-002 row (1.4.04.01).

  Frequencies. No phenotype carries a frequency band. The published literature
  is a small number of individual case reports and a 19-patient summary without
  a defensible denominator, and per the repository's frequency-evidence SOP an
  omitted band is preferred to a fabricated one.
experimental_models: []
animal_models:
- name: Mouse strain III (spontaneous Hpd-null mouse)
  species: Mouse
  genotype: Hpd exon 7 nonsense mutation, homozygous (spontaneous)
  publication: PMID:2014797
  description: >
    A spontaneously arising inbred mouse strain with autosomal recessive
    hypertyrosinemia, characterised in 1991 as the murine counterpart of human
    tyrosinemia type III. Hepatic 4-hydroxyphenylpyruvate dioxygenase activity
    is virtually absent and the enzyme subunit is undetectable on immunoblot,
    while fumarylacetoacetase and both tyrosine aminotransferase isoforms are
    normal — so the lesion is confined to the same single step of tyrosine
    catabolism as the human disease. Blood tyrosine is persistently high with
    increased urinary 4-hydroxyphenylpyruvic acid derivatives and no
    succinylacetone, reproducing the biochemical discriminant that separates
    type III from type I. The causal allele was resolved in 1995 as a nonsense
    substitution in exon 7 of Hpd that additionally causes skipping of that
    constitutive exon in most transcripts.
  evidence:
  - reference: PMID:2014797
    reference_title: "A murine model for type III tyrosinemia: lack of immunologically detectable 4-hydroxyphenylpyruvic acid dioxygenase enzyme protein in a novel mouse strain with hypertyrosinemia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These features are similar to type III tyrosinemia in humans."
    explanation: The characterising study concludes the strain's biochemical phenotype matches human tyrosinemia type III.
  - reference: PMID:7774914
    reference_title: "A nonsense mutation in the 4-hydroxyphenylpyruvic acid dioxygenase gene (Hpd) causes skipping of the constitutive exon and hypertyrosinemia in mouse strain III."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mouse strain III is a model for human tyrosinemia type 3 (McKusick 276710), and this strain together with recently established models for tyrosinemia type 1 will facilitate studies of hereditary tyrosinemias."
    explanation: Identifies the causal Hpd allele and states the strain's status as the model for this disorder.
  modeled_mechanisms:
  - target: 4-Hydroxyphenylpyruvate dioxygenase deficiency
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Enzymatically and immunologically null for hepatic 4-hydroxyphenylpyruvate
      dioxygenase, with the neighbouring enzymes of the pathway intact, so the
      block sits at the same step as the human lesion.
    limitations: >-
      The causal allele is a spontaneous murine exon-7 nonsense substitution
      acting partly through exon skipping, not one of the human patient alleles,
      so it models complete loss of function and cannot speak to the hypomorphic
      missense genotypes that make up much of the human series. Enzyme activity
      and protein were assayed in liver only; the human enzyme is also expressed
      in kidney, and this model says nothing about residual extrahepatic
      activity.
    readouts:
    - name: Hepatic 4-hydroxyphenylpyruvate dioxygenase activity
      target: 4-Hydroxyphenylpyruvate dioxygenase deficiency
      description: >-
        Enzyme assay of hepatic tyrosine-pathway enzymes in mutant versus
        control mice, with fumarylacetoacetase and both tyrosine
        aminotransferase isoforms measured as internal specificity controls.
      direction: DECREASED
      interpretation: >-
        Loss of activity restricted to HPD, with the flanking pathway enzymes
        normal, is what makes this a model of the HPD step rather than of
        hypertyrosinemia generally.
      evidence:
      - reference: PMID:2014797
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "4-hydroxyphenylpyruvic acid dioxygenase activity was virtually absent, while fumarylacetoacetase and tyrosine aminotransferases (cytosolic and mitochondrial forms) were normal in these mutant mice"
        explanation: Reports the enzyme measurement and its specificity controls.
    - name: Hepatic HPD subunit protein on immunoblot
      target: 4-Hydroxyphenylpyruvate dioxygenase deficiency
      description: >-
        Immunoblot for the 4-hydroxyphenylpyruvate dioxygenase subunit in liver
        from mutant mice.
      direction: ABOLISHED
      interpretation: >-
        Absence of the protein, not merely of activity, establishes the lesion
        as loss of the enzyme rather than inhibition of it.
      evidence:
      - reference: PMID:2014797
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM

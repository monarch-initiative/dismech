inheritance:
- name: Autosomal recessive
  description: >
    Tyrosinemia type III requires biallelic pathogenic HPD variants; reported
    probands have been homozygous or compound heterozygous, and heterozygous
    parents are unaffected. The allelic dominant disorder hawkinsinuria arises
    from a different class of HPD variant and is curated separately.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:10942115
    reference_title: "Mutations in the 4-hydroxyphenylpyruvate dioxygenase gene (HPD) in patients with tyrosinemia type III."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tyrosinemia type III (OMIM 276710) is an autosomal recessive disorder caused by the deficiency of 4-hydroxyphenylpyruvate dioxygenase (HPD), the second enzyme in the tyrosine catabolic pathway."
    explanation: States both the recessive inheritance and the position of the enzymatic block in the pathway.
  - reference: PMID:10942115
    reference_title: "Mutations in the 4-hydroxyphenylpyruvate dioxygenase gene (HPD) in patients with tyrosinemia type III."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified four presumed pathogenic mutations (two missense and two nonsense mutations) in the HPD gene in three unrelated families encompassing four homozygous individuals and one compound heterozygous individual with tyrosinemia type III."
    explanation: Documents the homozygous and compound heterozygous genotypes expected under recessive inheritance.
progression:
- phase: Neonatal-screening ascertainment
  age_range: Newborn period
  notes: >
    Infants detected by newborn screening for hypertyrosinemia may be entirely
    asymptomatic at diagnosis, and some remain so on treatment.
  evidence:
  - reference: PMID:11916315
    reference_title: "Outcome of tyrosinaemia type III."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of the nine previously reported patients have presented with neurological symptoms after the neonatal period, while others detected by neonatal screening have been asymptomatic."
    explanation: Distinguishes the screening-ascertained asymptomatic presentation from the clinically ascertained one.
- phase: Clinically ascertained neurological presentation
  age_range: Approximately 1 to 17 months
  notes: >
    Clinically ascertained patients come to attention after the neonatal period
    with seizures, developmental delay, ataxia or behavioural disturbance;
    hepatic and renal function are normal throughout.
  evidence:
  - reference: PMID:29456978
    reference_title: "A Case of Tyrosinemia Type III with Status Epilepticus and Mental Retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Neurological symptoms include developmental delay, behavioral disturbance, seizures, microcephaly, ataxia, tremor, hypotonia, absent deep tendon reflexes,"
    explanation: Enumerates the neurological presentation reported across the literature for this disorder.
clinical_burden:
  burden_level: MODERATE
  rationale: >
    The disorder spares liver, kidney, eye and skin, so it carries none of the
    life-threatening hepatic burden of tyrosinemia type I. Burden derives from
    the neurological arm, where intellectual impairment is the commonest
    long-term complication and individual patients have presented in status
    epilepticus. Burden is highly variable, and several screening-detected
    patients have had normal growth and psychomotor development.
  evidence:
  - reference: PMID:29456978
    reference_title: "A Case of Tyrosinemia Type III with Status Epilepticus and Mental Retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The most common long-term complication is intellectual impairment, found in 75% of patients."
    explanation: Quantifies the dominant long-term morbidity underpinning the moderate burden rating.
  - reference: PMID:11916315
    reference_title: "Outcome of tyrosinaemia type III."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All have had normal liver and renal function and none has skin or eye abnormalities."
    explanation: Establishes the absence of the hepatorenal and oculocutaneous burden seen in the other tyrosinemias.
pathophysiology:
- name: 4-Hydroxyphenylpyruvate dioxygenase deficiency
  role: TRIGGER
  biological_scale: MOLECULAR
  description: >
    Biallelic pathogenic HPD variants reduce or abolish 4-hydroxyphenylpyruvate
    dioxygenase activity. Recombinant expression of patient missense alleles
    shows two distinct routes to deficiency. Substitutions at the domain
    interface abolish soluble protein entirely, whereas substitutions at
    specific structural motifs reduce both folding and residual bioactivity.
  genes:
  - preferred_term: HPD
    term:
      id: hgnc:5147
      label: HPD
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HOMOZYGOUS
    variant_origin: GERMLINE
    description: >
      Biallelic germline loss-of-function HPD alleles, reported as homozygous
      missense, homozygous splice-donor and compound heterozygous genotypes.
  molecular_functions:
  - preferred_term: 4-hydroxyphenylpyruvate dioxygenase activity
    term:
      id: GO:0003868
      label: 4-hydroxyphenylpyruvate dioxygenase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: L-tyrosine catabolic process
    term:
      id: GO:0006572
      label: L-tyrosine catabolic process
    modifier: DECREASED
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  evidence:
  - reference: PMID:11073718
    reference_title: "Mutations in the 4-hydroxyphenylpyruvic acid dioxygenase gene are responsible for tyrosinemia type III and hawkinsinuria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A deficiency in the catalytic activity of HPD may lead to tyrosinemia type III, an autosomal recessive disorder characterized by elevated levels of blood tyrosine and massive excretion of tyrosine derivatives into urine."
    explanation: Identifies loss of HPD catalytic activity as the causal enzymatic lesion of this disorder.
  - reference: PMID:42140431
    reference_title: "Disease associated missense substitutions disrupt structural stability and catalytic function of 4-hydroxyphenylpyruvate dioxygenase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our whole-cell assay showed a loss of soluble protein expression for G154S, Y160C, and I267F variants, suggesting that the three locations at the domain interface can be critical for proper protein folding."
    explanation: Direct biochemical demonstration that domain-interface patient alleles abolish soluble enzyme.
  - reference: PMID:42140431
    reference_title: "Disease associated missense substitutions disrupt structural stability and catalytic function of 4-hydroxyphenylpyruvate dioxygenase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The A33T, A268V, and I335M variants exhibited low soluble protein expression and reduced bioactivity, indicating the three locations at their specific structural motifs affect protein folding but can be less effective."
    explanation: Shows the second, partial route to deficiency for motif-located alleles including the A268V tyrosinemia type III allele.
  - reference: PMID:29456978
    reference_title: "A Case of Tyrosinemia Type III with Status Epilepticus and Mental Retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "that is mainly expressed in neurons, neutrophils, kidney, and liver cells."
    explanation: States the tissue expression of the deficient enzyme, supporting the annotated liver and kidney locations.
  downstream:
  - target: Block of 4-hydroxyphenylpyruvate conversion to homogentisate
    description: >
      Loss of enzyme activity interrupts the single reaction that converts
      4-hydroxyphenylpyruvate to homogentisate.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11073718
      reference_title: "Mutations in the 4-hydroxyphenylpyruvic acid dioxygenase gene are responsible for tyrosinemia type III and hawkinsinuria."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "The enzyme 4-hydroxyphenylpyruvic acid dioxygenase (HPD) catalyzes the reaction of 4-hydroxyphenylpyruvic acid to homogentisic acid in the tyrosine catabolism pathway."
      explanation: Defines the exact reaction that the enzyme deficiency interrupts.
- name: Block of 4-hydroxyphenylpyruvate conversion to homogentisate
  role: CENTRAL_EFFECTOR
  biological_scale: MOLECULAR
  description: >
    With the second step of tyrosine catabolism blocked, 4-hydroxyphenylpyruvate
    accumulates and homogentisate is no longer generated. The block sits above
    the fumarylacetoacetate hydrolase step, so neither fumarylacetoacetate nor
    succinylacetone is produced. Succinylacetone is characteristically absent
    from the urine, which is the biochemical discriminator from tyrosinemia
    type I.
  chemical_entities:
  - preferred_term: 4-hydroxyphenylpyruvic acid
    term:
      id: CHEBI:15999
      label: 4-hydroxyphenylpyruvic acid
    modifier: INCREASED
  - preferred_term: homogentisic acid
    term:
      id: CHEBI:44747
      label: homogentisic acid
    modifier: DECREASED
  evidence:
  - reference: PMID:10942115
    reference_title: "Mutations in the 4-hydroxyphenylpyruvate dioxygenase gene (HPD) in patients with tyrosinemia type III."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The enzyme deficiency results in an accumulation and increased excretion of tyrosine and phenolic metabolites."
    explanation: States the metabolic consequence of the enzymatic block.
  - reference: PMID:29456978
    reference_title: "A Case of Tyrosinemia Type III with Status Epilepticus and Mental Retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The levels of 4-hydroxyphenyl lactic acid (1710 mmol/mol creatinine with normal <5.3) and 4-hydroxyphenyl pyruvic acid (2184 mmol/mol creatinine with normal <4.9) in the urine were elevated, without marked elevation of succinylacetone."
    explanation: Documents both the accumulating substrate metabolites and the diagnostic absence of succinylacetone.
  downstream:
  - target: Systemic hypertyrosinemia
    description: >
      Blocking the second catabolic step backs up the pathway and raises the
      circulating tyrosine pool.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11073718
      reference_title: "Mutations in the 4-hydroxyphenylpyruvic acid dioxygenase gene are responsible for tyrosinemia type III and hawkinsinuria."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A deficiency in the catalytic activity of HPD may lead to tyrosinemia type III, an autosomal recessive disorder characterized by elevated levels of blood tyrosine and massive excretion of tyrosine derivatives into urine."
      explanation: Directly links the catalytic deficiency to raised blood tyrosine.
  - target: Urinary excretion of 4-hydroxyphenyl derivatives
    description: >
      Accumulated 4-hydroxyphenylpyruvate is reduced and decarboxylated to
      4-hydroxyphenyllactate and 4-hydroxyphenylacetate, all three of which are
      excreted in large amounts.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:9343288
      reference_title: "Tyrosinemia type III: diagnosis and ten-year follow-up."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The biochemical phenotype shows hypertyrosinemia and elevated urinary excretion of 4-hydroxyphenyl derivatives."
      explanation: States the two-part biochemical phenotype produced by the block.
- name: Systemic hypertyrosinemia
  role: DOWNSTREAM
  biological_scale: ORGANISM
  description: >
    Sustained moderate elevation of plasma tyrosine, typically in the range of
    350 to 700 micromoles per litre on an unrestricted diet, in an otherwise
    normal amino-acid profile. Levels several-fold above this have been recorded
    in symptomatic infants.
  chemical_entities:
  - preferred_term: L-tyrosine
    term:
      id: CHEBI:17895
      label: L-tyrosine
    modifier: INCREASED
  evidence:
  - reference: PMID:29456978
    reference_title: "A Case of Tyrosinemia Type III with Status Epilepticus and Mental Retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis is suspected in children with sustained moderate increases in plasma levels of tyrosine (typically 350–700 μmole/L on a normal diet)"
    explanation: Gives the characteristic magnitude of the hypertyrosinemia in this disorder.
  - reference: PMID:29456978
    reference_title: "A Case of Tyrosinemia Type III with Status Epilepticus and Mental Retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Metabolic investigations showed increased level of tyrosine in the blood (737 μmol/l and 915 μmol/l) in 2 consecutive time, (normal range 88–204 μmol/l)."
    explanation: Documents measured plasma tyrosine against the laboratory reference interval in an affected infant.
  downstream:
  - target: Variable central nervous system dysfunction
    description: >
      The neurological arm of the disorder is associated with the sustained
      tyrosine elevation, but the route is unresolved. Neither the severity of
      the mutation and enzyme deficiency nor the recorded tyrosine levels
      correlate with cognitive outcome.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:10942115
      reference_title: "Mutations in the 4-hydroxyphenylpyruvate dioxygenase gene (HPD) in patients with tyrosinemia type III."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "No correlation of the severity of the mutation and enzyme deficiency and mental function has been found; neither do the recorded tyrosine levels correlate with the clinical phenotype."
      explanation: Supports an association while refusing a dose-dependent causal route from tyrosine level to neurological outcome, which is why this edge is typed through unknown intermediates.
    - reference: PMID:29456978
      reference_title: "A Case of Tyrosinemia Type III with Status Epilepticus and Mental Retardation."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "The high tyrosine concentration in an otherwise normal amino acid profile has been found in patients presenting with neurological symptoms."
      explanation: Links the biochemical abnormality to the neurological presentation without establishing the intervening steps.
- name: Urinary excretion of 4-hydroxyphenyl derivatives
  role: DOWNSTREAM
  biological_scale: ORGANISM
  description: >
    Massive urinary excretion of 4-hydroxyphenylpyruvic, 4-hydroxyphenyllactic
    and 4-hydroxyphenylacetic acids, with succinylacetone absent. This pattern
    is the diagnostic organic-acid signature of the disorder rather than a
    tissue-damaging process in its own right.
  evidence:
  - reference: PMID:42140431
    reference_title: "Disease associated missense substitutions disrupt structural stability and catalytic function of 4-hydroxyphenylpyruvate dioxygenase."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Tyrosinemia type III is an autosomal recessive disorder characterized by an increased blood tyrosine level, leading to the urinary excretion of tyrosine metabolites, such as HPP, 4-hydroxyphenyllactatic acid, and 4-hydroxyphenylacetic acid (HPA)"
    explanation: Names the three excreted derivatives that define the urinary phenotype.
  downstream:
  - target: 4-Hydroxyphenylpyruvic aciduria
    description: Accumulated 4-hydroxyphenylpyruvate is excreted in large amounts.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29456978
      reference_title: "A Case of Tyrosinemia Type III with Status Epilepticus and Mental Retardation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The levels of 4-hydroxyphenyl lactic acid (1710 mmol/mol creatinine with normal <5.3) and 4-hydroxyphenyl pyruvic acid (2184 mmol/mol creatinine with normal <4.9) in the urine were elevated, without marked elevation of succinylacetone."
      explanation: Quantifies the urinary 4-hydroxyphenylpyruvic acid elevation against its reference limit.
  - target: 4-Hydroxyphenyllactic aciduria
    description: 4-Hydroxyphenylpyruvate is reduced to 4-hydroxyphenyllactate and excreted.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29456978

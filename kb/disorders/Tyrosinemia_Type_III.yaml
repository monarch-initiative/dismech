    explanation: Documents ascorbic acid used as an adjunct to dietary restriction in an affected infant.
mechanistic_hypotheses:
- hypothesis_group_id: tyrosine_mediated_neurotoxicity
  hypothesis_label: Tyrosine-mediated neurotoxicity
  status: CANONICAL
  description: >
    The default account is that the sustained tyrosine elevation is itself
    responsible for the neurological arm, by analogy with the other
    hypertyrosinemias. Its principal weakness is stated by the literature it
    rests on. Neither tyrosine level nor residual enzyme activity predicts
    cognitive outcome, and some patients with untreated hypertyrosinemia have
    developed normally.
  evidence:
  - reference: PMID:29456978
    reference_title: "A Case of Tyrosinemia Type III with Status Epilepticus and Mental Retardation."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "The high tyrosine concentration in an otherwise normal amino acid profile has been found in patients presenting with neurological symptoms."
    explanation: The association on which the canonical account rests, without a demonstrated mechanism.
  - reference: PMID:10942115
    reference_title: "Mutations in the 4-hydroxyphenylpyruvate dioxygenase gene (HPD) in patients with tyrosinemia type III."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "No correlation of the severity of the mutation and enzyme deficiency and mental function has been found; neither do the recorded tyrosine levels correlate with the clinical phenotype."
    explanation: The negative dose-response finding that constrains the canonical account.
discussions:
- discussion_id: tyr3_neuro_route_unknown
  kind: KNOWLEDGE_GAP
  prompt: >
    Why do plasma tyrosine level, residual HPD activity and HPD genotype all
    fail to predict the neurological outcome in tyrosinemia type III?
  rationale: >
    Every other step in this disorder is well specified, including the gene, the
    enzyme, the blocked reaction and the accumulating metabolites. The one
    clinically important step, from biochemistry to brain, has no established
    route, and the strongest available evidence is explicitly negative about the
    obvious dose-response model. Two patients with comparable biochemistry can
    have severe intellectual disability or entirely normal development. Until
    this is resolved, no treatment recommendation can be grounded in the
    mechanism, and the value of a tyrosine-lowering diet for cognition remains a
    suspicion.
  attaches_to:
  - pathophysiology#Variable central nervous system dysfunction
  proposed_experiments:
  - experiment_id: tyr3_genotype_stratified_cohort
    name: Prospective genotype-stratified neurodevelopmental cohort
    description: >
      Follow all screening-ascertained and clinically ascertained patients with
      standardized neurodevelopmental assessment, serial plasma tyrosine, and
      HPD genotype, to test whether cumulative tyrosine exposure or allele class
      predicts outcome once ascertainment bias is removed.
  evidence:
  - reference: PMID:10942115
    reference_title: "Mutations in the 4-hydroxyphenylpyruvate dioxygenase gene (HPD) in patients with tyrosinemia type III."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No correlation of the severity of the mutation and enzyme deficiency and mental function has been found; neither do the recorded tyrosine levels correlate with the clinical phenotype."
    explanation: >-
      States the gap directly, reporting no genotype, enzyme-activity or
      metabolite correlation with the neurological phenotype.
- discussion_id: tyr3_hepatic_sparing_vs_type_i
  kind: INTERPRETATION
  prompt: >
    Why does a complete block of tyrosine catabolism spare the liver here when
    tyrosinemia type I destroys it?
  rationale: >
    The two disorders differ in the position of the block, not its severity. HPD
    acts above fumarylacetoacetate hydrolase, so its loss prevents formation of
    fumarylacetoacetate and succinylacetone, the electrophilic intermediates
    that cause hepatorenal injury in type I. This is the same logic that makes
    nitisinone effective in type I, since the drug inhibits HPD and deliberately
    converts a type I biochemical phenotype into a type III one. Tyrosinemia
    type III is, in that sense, the therapeutic target state of type I disease,
    which is a useful check on any claim that its own biochemistry is
    intrinsically toxic to the liver.
  evidence:
  - reference: PMID:29456978
    reference_title: "A Case of Tyrosinemia Type III with Status Epilepticus and Mental Retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As treatment with 2-(2-nitro-4-trifluoromethylbenzoyl)-1,3-ciclohexanedione (NTBC) in patients with tyrosinemia type I shifts the metabolic block from fumarylacetoacetate hydrolase to p-hydroxyphenylpyruvate dioxygenase or from tyrosinemia type I to tyrosinemia type III"
    explanation: States explicitly that nitisinone converts the type I block into the type III block.
  - reference: PMID:11916315
    reference_title: "Outcome of tyrosinaemia type III."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All have had normal liver and renal function and none has skin or eye abnormalities."
    explanation: Confirms the preserved hepatorenal and oculocutaneous status that distinguishes this disorder.
- discussion_id: tyr3_nitisinone_not_indicated
  kind: INTERPRETATION
  prompt: >
    Why is nitisinone not a treatment for tyrosinemia type III?
  rationale: >
    Nitisinone is an HPD inhibitor. In a disorder defined by HPD deficiency it
    would deepen the existing block rather than relieve it, and it is not
    approved for this indication. This is recorded explicitly because the drug
    is the principal therapy for the neighbouring disorder in this pathway and
    the mistake is an easy one to make. Note also that it is under separate
    investigation as a therapy for hawkinsinuria, the allelic dominant disorder,
    where the target is an aberrantly active enzyme rather than a deficient one.
  evidence:
  - reference: PMID:29456978
    reference_title: "A Case of Tyrosinemia Type III with Status Epilepticus and Mental Retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NTBC do not approve for the treatment of tyrosinemia type III, for this reason, we did not apply it in our patient."
    explanation: States that nitisinone is not approved for this disorder and was withheld on that basis.
animal_models:
- name: Mouse strain III (Hpd exon 7 nonsense)
  species: Mouse
  genotype: Hpd homozygous exon 7 nonsense variant with partial exon skipping
  publication: PMID:2014797
  description: >
    A spontaneous mouse strain with persistent hypertyrosinemia and increased
    urinary 4-hydroxyphenylpyruvate and derivatives, in which hepatic HPD
    activity and HPD subunit protein are absent while fumarylacetoacetase and
    both tyrosine aminotransferases are normal. The molecular lesion is a
    nonsense substitution in exon 7 that causes partial exon skipping.
  modeled_mechanisms:
  - target: 4-Hydroxyphenylpyruvate dioxygenase deficiency
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >
      An isolated, genetically determined absence of HPD enzyme and protein with
      the other tyrosine-pathway enzymes intact, which is exactly the lesion
      being modelled.
    limitations: >
      The mouse lesion is a nonsense allele with exon skipping rather than one
      of the human missense alleles, so it models complete absence of enzyme and
      cannot address residual-activity genotypes.
    readouts:
    - name: Hepatic 4-hydroxyphenylpyruvic acid dioxygenase activity
      target: 4-Hydroxyphenylpyruvate dioxygenase deficiency
      direction: ABOLISHED
      interpretation: Enzymatic confirmation that the modelled lesion is specific to HPD.
      evidence:
      - reference: PMID:2014797
        reference_title: "A murine model for type III tyrosinemia: lack of immunologically detectable 4-hydroxyphenylpyruvic acid dioxygenase enzyme protein in a novel mouse strain with hypertyrosinemia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Analyses of hepatic enzymes related to tyrosine metabolism revealed that 4-hydroxyphenylpyruvic acid dioxygenase activity was virtually absent, while fumarylacetoacetase and tyrosine aminotransferases (cytosolic and mitochondrial forms) were normal in these mutant mice."
        explanation: Reports the enzyme measurement establishing an isolated HPD defect.
    - name: Hepatic HPD subunit protein by immunoblot
      target: 4-Hydroxyphenylpyruvate dioxygenase deficiency
      direction: ABOLISHED
      interpretation: The enzyme protein itself is undetectable, not merely inactive.
      evidence:
      - reference: PMID:2014797
        reference_title: "A murine model for type III tyrosinemia: lack of immunologically detectable 4-hydroxyphenylpyruvic acid dioxygenase enzyme protein in a novel mouse strain with hypertyrosinemia."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Immunoblot analysis of 4-hydroxyphenylpyruvic acid dioxygenase protein in the liver indicated that the subunit protein of the enzyme was absent."
        explanation: Immunoblot measurement of the absent enzyme protein.
    evidence:
    - reference: PMID:7774914
      reference_title: "A nonsense mutation in the 4-hydroxyphenylpyruvic acid dioxygenase gene (Hpd) causes skipping of the constitutive exon and hypertyrosinemia in mouse strain III."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Mouse strain III is a model for human tyrosinemia type 3 (McKusick 276710), and this strain together with recently established models for tyrosinemia type 1 will facilitate studies of hereditary tyrosinemias."
      explanation: Establishes the strain as the accepted model for this disorder, keyed to the correct OMIM entry.
  - target: Variable central nervous system dysfunction
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >
      Despite the biochemical phenotype, the mutant animals are outwardly
      healthy with no reported disease, so the model does not reproduce the one
      arm of the human disorder that carries clinical burden.
    limitations: >
      The report characterizes the animals as apparently healthy and
      specifically excludes hepatorenal dysfunction, but does not describe
      formal neurobehavioural phenotyping. The negative claim is therefore about
      the absence of overt disease in a strain described as healthy, not about a
      systematic neurological assessment having been done and found normal.
    evidence:
    - reference: PMID:2014797
      reference_title: "A murine model for type III tyrosinemia: lack of immunologically detectable 4-hydroxyphenylpyruvic acid dioxygenase enzyme protein in a novel mouse strain with hypertyrosinemia."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "All the animals were apparently healthy, and there was no evidence of hepatorenal dysfunction."
      explanation: The mice carry the full biochemical lesion without overt disease, so the clinically important human arm is not reproduced.
  evidence:
  - reference: PMID:2014797
    reference_title: "A murine model for type III tyrosinemia: lack of immunologically detectable 4-hydroxyphenylpyruvic acid dioxygenase enzyme protein in a novel mouse strain with hypertyrosinemia."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "It would appear that hypertyrosinemia in this mutant strain was caused by a genetic defect in 4-hydroxyphenylpyruvic acid dioxygenase. These features are similar to type III tyrosinemia in humans."
    explanation: The authors identify the strain as recapitulating the human disorder.
  - reference: PMID:12771366
    reference_title: "Animal models reveal pathophysiologies of tyrosinemias."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "HPD-deficient mice are a good model with which to examine the biological effects of 4-hydroxyphenylpyruvic acid, which is a keto acid that causes no apparent visceral damage."
    explanation: Independent review confirming the model's use and its lack of visceral damage.
notes: >
  Placement within the pathway. Tyrosine catabolism proceeds through TAT, then
  HPD, then homogentisate 1,2-dioxygenase, then fumarylacetoacetate hydrolase.
  Deficiency of each is curated separately in this knowledge base, as
  Tyrosinemia Type II (TAT), this entry (HPD), Alkaptonuria (HGD) and
  Tyrosinemia Type I (FAH). The entries deliberately share the pathway but not a
  pathograph, because the accumulating species and the damaged tissue differ at
  every step.
  Relationship to hawkinsinuria. Both disorders are caused by HPD variants, and
  they are curated as two entries rather than one entry with subtypes because
  the mechanisms are not the same lesion at different severities. Tyrosinemia
  type III is recessive loss of function, whereas hawkinsinuria is a dominant,
  aberrant turnover producing a reactive product that the wild-type enzyme never
  makes. The decisive observation is a compound heterozygote carrying one allele
  of each class, who manifested hawkinsinuria and not tyrosinemia type III.
  Phenotype frequencies are omitted throughout except where a source states a
  proportion. Fewer than about twenty patients have been reported in total, and
  ascertainment is split between newborn screening and neurological
  presentation, so denominators from case series cannot support frequency bands.
review_notes: >
  Curated from ten cached references anchored to MONDO:0010162 and HPD
  (hgnc:5147). No deep-research provider report was used, so the DR-specific
  verification steps in CLAUDE.md sections 2a and 2b do not apply, and every
  reference was located by PubMed search and fetched with just fetch-reference.
  The neurological arm is deliberately linked by an
  INDIRECT_UNKNOWN_INTERMEDIATES edge and carries a KNOWLEDGE_GAP, because the
  only quantitative statement in the literature about that link is a negative
  one. Microcephaly is retained but typed UNKNOWN and marked PARTIAL, since it
  appears only in a review enumeration. Nitisinone is recorded as a discussion
  and explicitly not as a treatment, because in this disorder it inhibits the
  already-deficient enzyme. The mouse model carries both a RECAPITULATES link
  for the enzymatic lesion and a FAILS_TO_RECAPITULATE link for the neurological
  arm, and the limitations field records that the negative claim rests on the
  animals being described as apparently healthy rather than on formal
  neurobehavioural testing.

genetic:
- name: HPD
  gene_term:
    preferred_term: HPD
    term:
      id: hgnc:5147
      label: HPD
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  inheritance:
  - name: Autosomal recessive
    description: Biallelic pathogenic HPD variants are required; heterozygous parents are unaffected.
    evidence:
    - reference: PMID:10942115
      reference_title: "Mutations in the 4-hydroxyphenylpyruvate dioxygenase gene (HPD) in patients with tyrosinemia type III."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Tyrosinemia type III (OMIM 276710) is an autosomal recessive disorder caused by the deficiency of 4-hydroxyphenylpyruvate dioxygenase (HPD), the second enzyme in the tyrosine catabolic pathway."
      explanation: States the recessive inheritance of the HPD-deficiency disorder.
  variants:
  - name: HPD A268V
    description: >
      Homozygous missense substitution of alanine 268 by valine, identified in
      the first molecularly characterized patient. Recombinant work later placed
      Ala268 in the active site and showed the variant loses substrate binding
      by the enzyme-cobalt complex.
    evidence:
    - reference: PMID:11073718
      reference_title: "Mutations in the 4-hydroxyphenylpyruvic acid dioxygenase gene are responsible for tyrosinemia type III and hawkinsinuria."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A homozygous missense mutation predicting an Ala to Val change at codon 268 (A268V) in the HPD gene was found in the patient with tyrosinemia type III."
      explanation: Patient sequencing identifies the homozygous A268V allele.
    - reference: PMID:42140431
      reference_title: "Disease associated missense substitutions disrupt structural stability and catalytic function of 4-hydroxyphenylpyruvate dioxygenase."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "The reduced structural stability and HG production, and the loss of substrate binding with HPPD-Co(II) complex for the A268V variant suggested that its location is related to the stable conformation of the metal binding motif."
      explanation: Biochemical characterization of the A268V patient allele.
  - name: HPD I335M
    description: >
      Missense substitution of isoleucine 335 by methionine. Functionally
      equivalent to a null allele, and reported in trans with a hawkinsinuria
      allele in a compound heterozygote.
    evidence:
    - reference: PMID:17560158
      reference_title: "Manifestation of hawkinsinuria in a patient compound heterozygous for hawkinsinuria and tyrosinemia III."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The IIe335Met allele is equivalent to a null mutation while the Asn241Ser allele results in a partially active enzyme with an uncoupled turnover causing hawkinsinuria."
      explanation: Establishes I335M as a functional null, the archetypal tyrosinemia type III allele class.
  - name: HPD IVS11+1G>A
    description: >
      Homozygous splice-donor variant in intron 11, identified in a boy
      ascertained by newborn screening who had normal growth and psychomotor
      development on mild protein restriction at 30 months.
    evidence:
    - reference: PMID:23036342
      reference_title: "Tyrosinemia Type III detected via neonatal screening: management and outcome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report the case of a boy with tyrosinemia Type III detected using neonatal screening, who is homozygous for the splice donor mutation IVS11+1G>A in intron 11 of the HPD gene."
      explanation: Patient sequencing identifies the homozygous splice-donor allele.
  features: >
    HPD encodes 4-hydroxyphenylpyruvate dioxygenase, a dimeric non-heme
    iron-dependent oxygenase expressed mainly in liver and kidney. Reported
    tyrosinemia type III alleles include missense, nonsense and splice-donor
    changes. Structure-function work groups the missense alleles by location.
    Domain-interface substitutions abolish soluble protein, while
    structural-motif and active-site substitutions permit some folding but
    reduce catalytic output.
  evidence:
  - reference: PMID:10942115
    reference_title: "Mutations in the 4-hydroxyphenylpyruvate dioxygenase gene (HPD) in patients with tyrosinemia type III."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified four presumed pathogenic mutations (two missense and two nonsense mutations) in the HPD gene in three unrelated families encompassing four homozygous individuals and one compound heterozygous individual with tyrosinemia type III."
    explanation: Establishes the missense and nonsense allele classes reported in this disorder.
  - reference: PMID:42140431
    reference_title: "Disease associated missense substitutions disrupt structural stability and catalytic function of 4-hydroxyphenylpyruvate dioxygenase."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "This study showed the molecular underpinnings of how disease-related substitutions at specific structural locations affect the structural stability and function of HPPD."
    explanation: Summarizes the structure-function grouping of the disease-associated missense alleles.
diagnosis:
- name: Plasma and urine metabolite profiling
  description: >
    Quantitative plasma amino acids show sustained moderate hypertyrosinemia in
    an otherwise normal profile, and urine organic acids show massive excretion
    of 4-hydroxyphenylpyruvic, 4-hydroxyphenyllactic and 4-hydroxyphenylacetic
    acids. Absence of succinylacetone separates this disorder from tyrosinemia
    type I.
  diagnosis_term:
    preferred_term: laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:29456978
    reference_title: "A Case of Tyrosinemia Type III with Status Epilepticus and Mental Retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis is suspected in children with sustained moderate increases in plasma levels of tyrosine (typically 350–700 μmole/L on a normal diet)"
    explanation: Defines the biochemical criteria that raise the diagnosis.
- name: HPD molecular genetic testing or hepatic enzyme assay
  description: >
    Definitive confirmation requires either identification of biallelic HPD
    variants or direct assay of 4-hydroxyphenylpyruvate dioxygenase activity in
    a liver biopsy. Molecular testing has largely displaced the enzyme assay.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:29456978
    reference_title: "A Case of Tyrosinemia Type III with Status Epilepticus and Mental Retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One of the important factors for definitive diagnosis is genetic study or assay the activity of a 4-HPPD enzyme in liver biopsy."
    explanation: Names the two confirmatory diagnostic routes.
treatments:
- name: Dietary tyrosine and phenylalanine restriction
  description: >
    Restriction of dietary tyrosine and phenylalanine, usually with a
    tyrosine-free and phenylalanine-free amino-acid formula, lowers plasma
    tyrosine reliably. Whether it alters the neurological natural history is
    unresolved and is curated as an open question rather than asserted.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: dietary intervention
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  target_mechanisms:
  - target: Systemic hypertyrosinemia
    treatment_effect: INHIBITS
    description: >
      Restricting the precursor amino acids reduces flux into the blocked
      pathway and lowers the circulating tyrosine pool.
    evidence:
    - reference: PMID:29456978
      reference_title: "A Case of Tyrosinemia Type III with Status Epilepticus and Mental Retardation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "She was treated with a diet low in tyrosine and phenylalanine and anamix formula that leading to catch-up growth and improvement of her symptoms. Plasma tyrosine level dropped to normal values."
      explanation: Human treatment response showing plasma tyrosine normalizing on the restricted diet.
  evidence:
  - reference: PMID:23036342
    reference_title: "Tyrosinemia Type III detected via neonatal screening: management and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the age of 30 months, the boy's outcome under mild protein restriction was characterized by normal growth and psychomotor development."
    explanation: Reports normal growth and development on protein restriction in a screening-detected patient.
  - reference: PMID:11916315
    reference_title: "Outcome of tyrosinaemia type III."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "It is not clear whether a strict low tyrosine diet alters the natural history of tyrosinaemia type III, although there remains a suspicion that treatment may be important, at least in infancy."
    explanation: Retained deliberately as a limit on the claim, since the outcome series does not establish that diet changes the neurological course.
- name: Ascorbic acid supplementation
  description: >
    Ascorbic acid is given alongside dietary restriction. It is a cofactor
    supplement used empirically in the hypertyrosinemias rather than a therapy
    directed at the HPD lesion, and no mechanism edge is asserted for it here.

    description: >-
      Reproduces the full biochemical signature of the human disorder,
      including the discriminating negative: persistent hypertyrosinemia with
      increased urinary 4-hydroxyphenyl derivatives and no succinylacetone.
    limitations: >-
      Absolute tyrosine concentrations in the mutant strain are not directly
      comparable with human plasma values, and the reported metabolite panel is
      qualitative; the model therefore supports the pattern of accumulation but
      not the exposure levels the human neurotoxicity question turns on.

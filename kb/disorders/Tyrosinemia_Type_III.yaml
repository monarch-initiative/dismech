inheritance:
- name: Autosomal recessive
  description: >
    Tyrosinemia type III is caused by biallelic pathogenic HPD variants;
    affected individuals have been homozygous or compound heterozygous, and
    heterozygous carriers are unaffected.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:10942115
    reference_title: "Mutations in the 4-hydroxyphenylpyruvate dioxygenase gene (HPD) in patients with tyrosinemia type III."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tyrosinemia type III (OMIM 276710) is an autosomal recessive disorder caused by the deficiency of 4-hydroxyphenylpyruvate dioxygenase (HPD), the second enzyme in the tyrosine catabolic pathway."
    explanation: States the autosomal recessive inheritance and the causal enzyme deficiency.
  - reference: PMID:37817461
    reference_title: "Novel HPD mutation p.A244V compound with p.T219M causing tyrosinemia type III in a Chinese girl and review of the genotype-phenotype spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Hereditary tyrosinemia type III (HT III) is an extremely rare form of tyrosinemia, characterized by autosomal recessive inheritance and biallelic mutations in the HPD gene."
    explanation: Confirms autosomal recessive inheritance with biallelic HPD variants.
prevalence:
- population: Worldwide, published case literature
  measure_type: CASES_IN_LITERATURE
  prevalence_class: BELOW_1_IN_1000000
  notes: >
    No population-based rate has been established. As of the 2022 review, only
    19 patients with biallelic HPD variants had been reported worldwide, and
    contemporary reviews continue to describe the disorder as extremely rare and
    the rarest of the genetic tyrosinemias. The prevalence_class is recorded as
    the coarse ultra-rare band on that basis rather than from a measured rate.
  evidence:
  - reference: PMID:35707594
    reference_title: "Novel Cranial Imaging Findings and a Splice-Site Variant in a Patient with Tyrosinemia Type III, and a Summary of Published Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tyrosinemia type III is an extremely rare autosomal recessive disease, with only 19 patients yet reported."
    explanation: Provides the published-case count that the ultra-rare band is derived from.
  - reference: PMID:32520295
    reference_title: "TYROSINEMIA TYPE III: A CASE REPORT OF SIBLINGS AND LITERATURE REVIEW."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tyrosinemia type III (HT III) is the rarest form of tyrosinemia, and the full clinical spectrum of this disorder is still unknown."
    explanation: Confirms it is the rarest of the genetic tyrosinemias.
clinical_burden:
  burden_level: MODERATE
  rationale: >
    Reported burden is confined to the neurodevelopmental domain — developmental
    delay, intellectual impairment, ataxia, seizures, and attention deficit
    hyperactivity disorder — with normal liver and renal function and no ocular
    or cutaneous disease. Burden is highly variable: individuals ascertained by
    newborn screening have been asymptomatic with normal psychomotor
    development, while late-presenting patients have had severe intellectual
    disability or status epilepticus. Whether diet modifies that outcome is not
    established, which is itself part of the burden.
  evidence:
  - reference: PMID:11916315
    reference_title: "Outcome of tyrosinaemia type III."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All have had normal liver and renal function and none has skin or eye abnormalities."
    explanation: Bounds the burden to the neurological domain by excluding hepatic, renal, ocular, and cutaneous disease.
  - reference: PMID:37817461
    reference_title: "Novel HPD mutation p.A244V compound with p.T219M causing tyrosinemia type III in a Chinese girl and review of the genotype-phenotype spectrum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The clinical presentation of HT III is variable and poorly understood, with symptoms ranging from developmental delay and intellectual impairment to seizures and intermittent ataxia."
    explanation: Describes the range of neurological severity underlying the moderate, highly variable burden.
progression:
- phase: Newborn-screening ascertainment
  age_range: Neonatal period
  notes: >
    Individuals detected by newborn screening for elevated tyrosine may be
    asymptomatic at diagnosis; one screened boy homozygous for an HPD splice
    donor variant had normal growth and psychomotor development at 30 months on
    mild protein restriction.
  evidence:
  - reference: PMID:23036342
    reference_title: "Tyrosinemia Type III detected via neonatal screening: management and outcome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At the age of 30 months, the boy's outcome under mild protein restriction was characterized by normal growth and psychomotor development."
    explanation: Documents a normal early course after newborn-screening ascertainment and early dietary management.
- phase: Symptomatic neurological presentation
  age_range: Infancy through childhood
  notes: >
    Most historically reported patients came to attention after the neonatal
    period with neurological symptoms; presentations have included recurrent
    seizures and status epilepticus in infancy and severe intellectual
    disability with neurological abnormalities on long-term follow-up.
  evidence:
  - reference: PMID:11916315
    reference_title: "Outcome of tyrosinaemia type III."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The majority of the nine previously reported patients have presented with neurological symptoms after the neonatal period, while others detected by neonatal screening have been asymptomatic."
    explanation: Establishes the bimodal ascertainment pattern between symptomatic and screened patients.
  - reference: PMID:29456978
    reference_title: "A Case of Tyrosinemia Type III with Status Epilepticus and Mental Retardation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present a case, who was admitted to the hospital at the age of 4 months for recurrent seizures. Two months later, she was admitted again with status epilepticus."
    explanation: Documents a severe infantile seizure presentation.
pathophysiology:
- name: 4-Hydroxyphenylpyruvate dioxygenase deficiency
  role: trigger
  biological_scale: MOLECULAR
  description: >
    Biallelic loss-of-function HPD variants reduce 4-hydroxyphenylpyruvate
    dioxygenase activity, blocking the second step of tyrosine catabolism, which
    converts 4-hydroxyphenylpyruvate to homogentisate. The enzyme is expressed
    principally in liver and kidney.
  genes:
  - preferred_term: HPD
    term:
      id: hgnc:5147
      label: HPD
  molecular_functions:
  - preferred_term: 4-hydroxyphenylpyruvate dioxygenase activity
    term:
      id: GO:0003868
      label: 4-hydroxyphenylpyruvate dioxygenase activity
    modifier: DECREASED
  biological_processes:
  - preferred_term: L-tyrosine catabolic process
    term:
      id: GO:0006572
      label: L-tyrosine catabolic process
    modifier: DECREASED
  chemical_entities:
  - preferred_term: homogentisate
    term:
      id: CHEBI:16169
      label: homogentisate
    modifier: DECREASED
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  - preferred_term: kidney
    term:
      id: UBERON:0002113
      label: kidney
  evidence:
  - reference: PMID:11073718
    reference_title: "Mutations in the 4-hydroxyphenylpyruvic acid dioxygenase gene are responsible for tyrosinemia type III and hawkinsinuria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The enzyme 4-hydroxyphenylpyruvic acid dioxygenase (HPD) catalyzes the reaction of 4-hydroxyphenylpyruvic acid to homogentisic acid in the tyrosine catabolism pathway."
    explanation: Defines the biochemical reaction that the causal lesion blocks.
  - reference: PMID:10942115
    reference_title: "Mutations in the 4-hydroxyphenylpyruvate dioxygenase gene (HPD) in patients with tyrosinemia type III."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We have identified four presumed pathogenic mutations (two missense and two nonsense mutations) in the HPD gene in three unrelated families encompassing four homozygous individuals and one compound heterozygous individual with tyrosinemia type III."
    explanation: Patient-allele sequencing establishes HPD variants as the molecular cause.
  downstream:
  - target: Hypertyrosinemia and phenolic metabolite accumulation
    description: >
      Loss of the second catabolic step prevents disposal of tyrosine and its
      transamination product, so tyrosine and 4-hydroxyphenyl derivatives
      accumulate.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:10942115
      reference_title: "Mutations in the 4-hydroxyphenylpyruvate dioxygenase gene (HPD) in patients with tyrosinemia type III."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The enzyme deficiency results in an accumulation and increased excretion of tyrosine and phenolic metabolites."
      explanation: Directly links the enzyme deficiency to metabolite accumulation.
- name: Hypertyrosinemia and phenolic metabolite accumulation
  role: central_effector
  biological_scale: ORGANISM
  description: >
    The enzymatic block raises blood tyrosine and drives accumulation of the
    4-hydroxyphenyl organic acids proximal to the block. Unlike tyrosinemia type
    I, the block lies upstream of maleylacetoacetate and fumarylacetoacetate, so
    succinylacetone is not produced and there is no hepatorenal toxicity.
  chemical_entities:
  - preferred_term: L-tyrosine
    term:
      id: CHEBI:17895
      label: L-tyrosine
    modifier: INCREASED
  - preferred_term: 4-hydroxyphenylpyruvate
    term:
      id: CHEBI:15999
      label: 4-hydroxyphenylpyruvic acid
    modifier: INCREASED
  evidence:
  - reference: PMID:11073718
    reference_title: "Mutations in the 4-hydroxyphenylpyruvic acid dioxygenase gene are responsible for tyrosinemia type III and hawkinsinuria."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A deficiency in the catalytic activity of HPD may lead to tyrosinemia type III, an autosomal recessive disorder characterized by elevated levels of blood tyrosine and massive excretion of tyrosine derivatives into urine."
    explanation: States the defining biochemical phenotype of raised blood tyrosine with urinary derivative excretion.
  - reference: PMID:9343288
    reference_title: "Tyrosinemia type III: diagnosis and ten-year follow-up."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The biochemical phenotype shows hypertyrosinemia and elevated urinary excretion of 4-hydroxyphenyl derivatives."
    explanation: Independently confirms the two-component biochemical phenotype.
  downstream:
  - target: Hypertyrosinemia
    description: >
      Persistently elevated blood tyrosine is the clinical expression of this
      node and the finding on which newborn-screening ascertainment rests.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:11073718
      reference_title: "Mutations in the 4-hydroxyphenylpyruvic acid dioxygenase gene are responsible for tyrosinemia type III and hawkinsinuria."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A deficiency in the catalytic activity of HPD may lead to tyrosinemia type III, an autosomal recessive disorder characterized by elevated levels of blood tyrosine and massive excretion of tyrosine derivatives into urine."
      explanation: Names raised blood tyrosine as the defining manifestation of the enzyme block, which is what this edge asserts.
  - target: Urinary excretion of 4-hydroxyphenyl organic acids
    description: >
      Accumulated 4-hydroxyphenyl derivatives proximal to the enzymatic block
      are excreted in urine, where they are detected as organic acids.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16602095
      reference_title: "The genetic tyrosinemias."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Urine organic acids show elevated p-hydroxy-phenyl organic acids in each type of tyrosinemia, and the pathognomic succinylacetone in tyrosinemia Type I."
      explanation: Supports urinary p-hydroxyphenyl organic acid excretion, and separates it from the succinylacetone that is specific to type I.
  - target: Neurodevelopmental dysfunction
    description: >
      Neurological and cognitive manifestations are the dominant clinical
      consequence, but no intermediate mechanism has been established, and
      tyrosine concentration does not track phenotype severity.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:16602095
      reference_title: "The genetic tyrosinemias."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Tyrosinemia Type III is an extremely rare disorder caused by a deficiency of 4-hydroxyphenylpyruvic dioxygenase. It has been associated with ataxia and mild mental retardation."
      explanation: Supports the association while its hedged wording matches the unresolved causal route.
    - reference: PMID:10942115
      reference_title: "Mutations in the 4-hydroxyphenylpyruvate dioxygenase gene (HPD) in patients with tyrosinemia type III."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "No correlation of the severity of the mutation and enzyme deficiency and mental function has been found; neither do the recorded tyrosine levels correlate with the clinical phenotype."
      explanation: Qualifies the edge — genotype, residual enzyme activity, and tyrosine level all fail to predict the neurological outcome, which is why the link is curated with unknown intermediates.
- name: Urinary excretion of 4-hydroxyphenyl organic acids
  role: biomarker
  biological_scale: ORGANISM
  description: >
    Massive urinary excretion of tyrosine derivatives — 4-hydroxyphenylpyruvate,
    4-hydroxyphenyllactate, and 4-hydroxyphenylacetate — is the diagnostic
    organic-acid signature and, together with hypertyrosinemia in the absence of
    succinylacetone, distinguishes this disorder from tyrosinemia type I.
  chemical_entities:
  - preferred_term: 4-hydroxyphenylacetate
    term:
      id: CHEBI:18101
      label: 4-hydroxyphenylacetic acid
    modifier: INCREASED
  evidence:
  - reference: PMID:28649543
    reference_title: "Tyrosinemia type III in an asymptomatic girl."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The disorder is characterized by tyrosine accumulation in body fluids and massive excretion of tyrosine derivatives into urine"
    explanation: States the urinary derivative excretion that defines the readout.
- name: Neurodevelopmental dysfunction
  role: consequence
  biological_scale: ORGANISM
  description: >
    The clinical burden of the disorder, spanning developmental delay,
    intellectual impairment, intermittent ataxia, seizures, and attention
    deficit hyperactivity disorder. Expression is highly variable and includes
    biochemically affected individuals with entirely normal development, so the
    node is curated as a consequence with an unresolved upstream route rather
    than as a direct toxic effect of tyrosine.
  evidence:
  - reference: PMID:35707594
    reference_title: "Novel Cranial Imaging Findings and a Splice-Site Variant in a Patient with Tyrosinemia Type III, and a Summary of Published Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although the clinical spectrum of the disease is not fully known, most patients present with neurodevelopmental symptoms."
    explanation: Establishes neurodevelopmental symptoms as the predominant clinical consequence.
  - reference: PMID:28649543
    reference_title: "Tyrosinemia type III in an asymptomatic girl."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Presented case may suggest that high tyrosine concentration itself does not participate directly in neuronal damage described in patients with tyrosinemia type 3."
    explanation: A biochemically affected but neurologically normal patient argues against tyrosine concentration as the direct neurotoxic agent.
  downstream:
  - target: Intellectual disability
    description: >
      Cognitive impairment is the most frequently reported expression of the
      neurodevelopmental node, spanning mild impairment to severe intellectual
      disability with neurological abnormalities.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:9343288
      reference_title: "Tyrosinemia type III: diagnosis and ten-year follow-up."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report the clinical and biochemical findings and the results of long-term follow-up in a new patient with this disorder presenting with severe mental retardation and neurological abnormalities."
      explanation: A long-followed patient in whom the neurodevelopmental burden of the disorder presented as severe cognitive impairment.
  - target: Global developmental delay
    description: >
      Developmental delay is a common presenting expression of the node and, in
      one reported patient, the reason the disorder was investigated at all.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:35707594
      reference_title: "Novel Cranial Imaging Findings and a Splice-Site Variant in a Patient with Tyrosinemia Type III, and a Summary of Published Cases."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We report on a 20-month-old patient who was investigated due to developmental delay and dysmorphic features."
      explanation: Developmental delay is the presenting neurodevelopmental manifestation in this reported patient.
  - target: Ataxia
    description: >
      Intermittent ataxia is part of the neurological spectrum attributed to
      this node.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:37817461
      reference_title: "Novel HPD mutation p.A244V compound with p.T219M causing tyrosinemia type III in a Chinese girl and review of the genotype-phenotype spectrum."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The clinical presentation of HT III is variable and poorly understood, with symptoms ranging from developmental delay and intellectual impairment to seizures and intermittent ataxia."
      explanation: Places intermittent ataxia inside the reported neurological spectrum of the disorder.
  - target: Seizure
    description: >
      Seizures are part of the neurological spectrum attributed to this node and
      may be severe.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29456978
      reference_title: "A Case of Tyrosinemia Type III with Status Epilepticus and Mental Retardation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We present a case, who was admitted to the hospital at the age of 4 months for recurrent seizures. Two months later, she was admitted again with status epilepticus."
      explanation: Documents seizures, progressing to status epilepticus, as a neurological manifestation in an affected infant.
  - target: Attention deficit hyperactivity disorder
    description: >
      Attention deficit and hyperactivity are part of the behavioural expression

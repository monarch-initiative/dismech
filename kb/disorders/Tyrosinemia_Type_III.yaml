name: Tyrosinemia Type III
category: Mendelian
creation_date: '2026-08-21T00:00:00Z'
synonyms:
- Tyrosinaemia type III
- 4-Hydroxyphenylpyruvate dioxygenase deficiency
- 4-HPPD deficiency
- HPD deficiency
- TYRSN3
description: >
  Tyrosinemia type III is the rarest of the three hereditary tyrosinemias, an
  autosomal recessive inborn error of tyrosine catabolism caused by deficiency
  of 4-hydroxyphenylpyruvate dioxygenase (HPD), the second enzyme of the
  pathway. Loss of HPD activity blocks conversion of 4-hydroxyphenylpyruvate to
  homogentisate, producing sustained hypertyrosinemia and massive urinary
  excretion of three 4-hydroxyphenyl derivatives, namely
  4-hydroxyphenylpyruvate, 4-hydroxyphenyllactate and 4-hydroxyphenylacetate.
  Because the block sits above the fumarylacetoacetate step, the hepatotoxic
  intermediates of tyrosinemia type I are never formed. Reported patients have
  normal liver and renal function and no eye or skin disease, and the phenotype
  is confined to a variable, incompletely explained central nervous system
  picture of intellectual impairment, developmental delay, ataxia and seizures.
  Others ascertained by newborn screening have remained asymptomatic. Management
  is dietary restriction of tyrosine and phenylalanine, although whether this
  alters the natural history is unresolved.

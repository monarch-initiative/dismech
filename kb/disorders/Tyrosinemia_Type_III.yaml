review_notes: >
  Curated from twelve cached PubMed references anchored to MONDO:0010162 and HPD
  (hgnc:5147). Identity was confirmed before curation against the MONDO record:
  RO:0004003 HGNC:5147 (HPD), OMIM:276710, Orphanet:69723 — matching IEMbase
  WP-002 row 1.4.03.01 exactly, with no named-entity confusion against
  tyrosinemia types I and II or hawkinsinuria, which are separate MONDO
  entities. Every evidence snippet is an exact substring of the cached abstract
  for its PMID. One animal model is curated: the spontaneous Hpd-null mouse
  strain III, which is a high-fidelity model of the enzyme block and of the
  biochemical phenotype but shows no overt counterpart of the human
  neurodevelopmental consequence, recorded as FAILS_TO_RECAPITULATE with a
  HUMAN_MODEL_MISMATCH discussion because the only reported assessment was gross
  observation rather than neurobehavioural testing. A second, non-allelic model
  is curated as the deliberate contrast: the Ttc36-null mouse, in which hepatic
  HPD is lowered post-translationally by STK33/PELI1-mediated degradation and
  which does show hippocampal damage and learning and memory deficits when those
  are actually tested. It is curated as a model of the low-HPD state, not of
  this disease, and its links are PARTIALLY_RECAPITULATES at LOW fidelity
  throughout. No non-animal experimental
  or computational model, and no public dataset with an evidence-supported
  mechanism link, was identified, so those sections are explicitly empty rather
  than speculatively populated. The single
  edge from the metabolic block to neurodevelopmental dysfunction is curated as
  INDIRECT_UNKNOWN_INTERMEDIATES with a PARTIAL counter-citation, because the
  literature explicitly reports no correlation between tyrosine level and
  phenotype and at least one biochemically affected but neurologically normal
  patient; a KNOWLEDGE_GAP discussion carries that reasoning. Phenotype
  frequencies were omitted throughout for want of defensible denominators.

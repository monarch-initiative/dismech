  notes: >
    The strain predates targeted mutagenesis and arose spontaneously; the 1991
    paper characterises the biochemistry and the 1995 paper resolves the allele.
    No later study appears to have subjected it to neurobehavioural phenotyping,
    which is why its bearing on the tyrosine-neurotoxicity question is recorded
    as a HUMAN_MODEL_MISMATCH rather than as evidence against neurotoxicity. The
    Ttc36-null mouse below is the informative contrast: reduced hepatic HPD
    assessed with learning and memory testing rather than by inspection.
- name: Ttc36-null mouse (post-translational HPD depletion)
  species: Mouse
  genotype: Ttc36 knockout, homozygous
  publication: PMID:31537781
  description: >
    A knockout of the liver-enriched chaperone TTC36, which normally shields HPD
    from STK33-mediated T382 phosphorylation and subsequent PELI1-mediated
    polyubiquitylation and proteasomal degradation. Losing TTC36 therefore
    lowers hepatic HPD protein post-translationally, with no lesion in Hpd
    itself, and the animals develop tyrosinemia together with hippocampal
    neuronal damage and deficits of learning and memory. This is not a model of
    tyrosinemia type III — the genetic architecture is different and the route
    to low HPD is regulatory rather than allelic — but it is the only reported
    rodent in which reduced HPD and hypertyrosinemia have been paired with
    actual neurobehavioural testing, which is what makes it the necessary
    counterweight to the silence of the Hpd-null strain III.
  evidence:
  - reference: PMID:31537781
    reference_title: "HPD degradation regulated by the TTC36-STK33-PELI1 signaling axis induces tyrosinemia and neurological damage."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "and exhibit tyrosinemia, damage to hippocampal neurons, and deficits of learning and memory."
    explanation: >-
      Establishes the model's tyrosinemia-plus-neurological phenotype. Marked
      PARTIAL because the mice are Ttc36-null rather than Hpd-mutant, so the
      model is informative for the consequences of low HPD but is not a genetic
      model of this disease.
  modeled_mechanisms:
  - target: 4-Hydroxyphenylpyruvate dioxygenase deficiency
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      Reaches the same end state as the human lesion — reduced hepatic HPD
      protein — by an entirely different route: loss of a chaperone that
      normally blocks STK33/PELI1-driven degradation of the enzyme.
    limitations: >-
      There is no variant in Hpd. The reduction is post-translational and
      partial rather than a biallelic loss-of-function null, so residual enzyme
      remains and the degree of block is not comparable to the human genotypes.
      TTC36 loss also has HPD-independent consequences that this entry does not
      curate, so any phenotype in these animals may be only partly attributable
      to the HPD reduction.
    readouts:
    - name: Hepatic HPD protein abundance
      target: 4-Hydroxyphenylpyruvate dioxygenase deficiency
      description: >-
        Immunoblot of HPD in liver and in primary hepatocytes from Ttc36-null
        versus wild-type mice, with ubiquitylation and cycloheximide-chase
        assays establishing the degradative mechanism.
      direction: DECREASED
      interpretation: >-
        Confirms the model arrives at reduced HPD protein, the same node state
        as the human enzyme deficiency, without an Hpd allele.
      evidence:
      - reference: PMID:31537781
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "deficiency or depletion of TTC36 results in enhanced STK33-mediated HPD T382 phosphorylation and binding of PELI1 to HPD and subsequent PELI1-mediated HPD downregulation"
        explanation: States the measured mechanism and direction of the HPD reduction.
    evidence:
    - reference: PMID:31537781
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "Ttc36-/- mice have reduced HPD expression in the"
      explanation: >-
        Supports treating the model as informative for reduced HPD, while the
        absence of an Hpd lesion is why the link is PARTIALLY_RECAPITULATES at
        LOW fidelity.
  - target: Neurodevelopmental dysfunction
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      The one rodent result pairing reduced HPD and tyrosinemia with a measured
      neurological outcome: hippocampal neuronal damage with learning and memory
      deficits.
    limitations: >-
      The route to low HPD is regulatory, not allelic, so the phenotype cannot
      be attributed to HPD reduction alone — TTC36 has other substrates and the
      knockout is whole-body. The readout is adult rodent hippocampal
      learning and memory, which is not the human phenotype of childhood
      developmental delay, intellectual impairment, ataxia and ADHD, and the
      animals' tyrosine exposure is not calibrated against the human range.
      This model therefore does not establish that hypertyrosinemia causes the
      human neurodevelopmental phenotype; it establishes only that reduced HPD
      with tyrosinemia is not inherently neurologically silent in mouse.
    readouts:
    - name: Hippocampal neuronal integrity and learning and memory performance
      target: Neurodevelopmental dysfunction
      description: >-
        Hippocampal neuropathology together with behavioural learning and memory
        testing in Ttc36-null versus wild-type mice.
      direction: DECREASED
      interpretation: >-
        A positive neurological result in a low-HPD, tyrosinemic mouse, obtained
        with assays the Hpd-null strain III was never given. It is the direct
        contrast that makes strain III's "apparently healthy" reading a question
        about assay sensitivity rather than a finding of safety.
      evidence:
      - reference: PMID:31537781
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "and exhibit tyrosinemia, damage to hippocampal neurons, and deficits of learning and memory."
        explanation: Reports both the neuropathological and the behavioural measurement behind this readout.
    evidence:
    - reference: PMID:31537781
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "highlight the physiological significance of TTC36-STK33-PELI1-regulated HPD expression in tyrosinemia and tyrosinemia-associated neurological disorders"
      explanation: >-
        The authors frame the result as bearing on tyrosinemia-associated
        neurological disease, which is the node this link attaches to; PARTIAL
        because the genetic architecture is not that of tyrosinemia type III.
  notes: >
    Surfaced by the independent Falcon deep-research pass rather than by the
    original curation, and verified against the cached abstract before use. It
    is deliberately curated as a model of the low-HPD state and not as a model
    of this disease.

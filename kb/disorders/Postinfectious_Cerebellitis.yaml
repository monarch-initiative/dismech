      cases, though they judge it unlikely.
- name: Mycoplasma pneumoniae infection
  description: >-
    A recognised trigger in children and, in Orphanet's account, one of the two commonest in adults.
    It preceded the syndrome in 5% of 39 children of a two-centre series and was found by the
    work-up of one of 15 children with acute cerebellitis in one department. In a systematic review
    of 42 published movement disorders associated with the bacterium, cerebellar ataxia or
    cerebellitis was the commonest presentation, and the authors read the manifestations as mostly
    para-infectious or post-infectious and predominantly immune-mediated; a review of the
    bacterium's effects outside the lungs classes cerebellitis, as most likely, among those in which
    it is not present at the site of inflammation.

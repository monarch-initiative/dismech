- name: Vaccination before onset
  description: >-
    Reported rarely before onset, and causality is unproved. In a 1994 series the ataxia was related
    to immunisation in 3% of 73 consecutive children. A case report describes onset in a 7-month-old
    within 24 hours of a meningococcal B vaccine, and its review of six published cases after
    vaccination - among them onset within 24 hours of a meningococcal group C conjugate vaccine and
    ten days after varicella vaccination, with influenza, hepatitis B, human papillomavirus and DTP
    vaccines in the others - gives a mean interval of 6.8 days and complete recovery in each. Its
    authors rate their own case as probably vaccine-associated by WHO criteria, but judge causality
    unproved and consider an unknown infection still possible, infection being the commonest
    identified cause at that age; the infant had also had fever and vomiting, resolved by admission.
    A Dutch national study found no association with MMR, and an Australian national series found no
    case temporally related to any childhood vaccine.
  exposure_term:
    preferred_term: vaccination
    term:
      id: ECTO:2000129
      label: exposure to vaccination
  causal_role: ASSOCIATED_ONLY
  notes: >-
    Bound to the general vaccination-exposure term, as the varicella vaccination row is; the reports
    name several vaccines. Graded as an association because the reports place vaccination before
    onset and the review of them judges causality unproved. Not the varicella vaccination row, which
    records the vaccine's protective effect against the varicella share of the syndrome.
  influences_mechanisms:

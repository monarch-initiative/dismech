- name: SARS-CoV-2 infection
  description: >-
    The most frequently identified trigger in a systematic review of 73 published cases, in 24 of
    them, a share of published cases that the entry does not read as a frequency. A case-based
    review of 18 cerebellar syndromes after COVID-19, 8 of them classed by the review as acute
    cerebellitis or post-infectious haemorrhagic cerebellitis, gives neurological symptoms a mean of
    about 15 days after the infection and frames cerebellitis as a post-infectious consequence of
    it. One patient developed an isolated cerebellar syndrome nine weeks after COVID-19 and
    recovered on corticosteroids, and in a series of six children, three of one centre and three
    from the literature, acute cerebellar ataxia began during the acute infection, between day 2 and
    day 10.
  exposure_term:
    preferred_term: SARS-CoV-2 infection
    term:
      id: ECTO:3000173
      label: exposure to Severe acute respiratory syndrome coronavirus 2
  disease_effect: TRIGGERS
  causal_role: COMPONENT_CAUSE
  notes: >-
    Graded as a trigger: a pooled review counts it among the identified triggers, a case-based
    review frames the cerebellitis as post-infectious, and in a case nine weeks after the infection
    the authors suspected a post-infectious autoimmune cerebellitis. The pooled review's share is of
    published cases, which the review says are largely individual case reports and small case
    series, and is not carried as a frequency.
  influences_mechanisms:
  - target: Preceding Infection
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      SARS-CoV-2 infection is one of the infections that precede the syndrome: by a mean of about 15
      days in one review's cases, and by nine weeks in one patient.
    evidence:
    - reference: PMID:39113976
      reference_title: >-
        Cerebellitis following COVID-19 infection: A case-based systematic review and pooled
        analysis.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Neurological symptoms presented on average 15.15 ± 12.7 days post-COVID-19 infection.
      explanation: >-
        The interval in a case-based review. INDIRECT for this disease because the review's 18 cases
        include encephalitides and other syndromes, and the review classes 8 of them as acute
        cerebellitis or post-infectious haemorrhagic cerebellitis.
    - reference: PMID:37589883
      reference_title: >-
        Immune-mediated cerebellitis following SARS-CoV-2 infection-a case report and review of the
        literature.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In this article, we report a patient who developed an isolated cerebellar syndrome 9 weeks
        after an episode of COVID-19.
      explanation: >-
        An isolated cerebellar syndrome nine weeks after COVID-19.
  evidence:

name: Postinfectious Cerebellitis
creation_date: '2026-11-13T19:20:00Z'
disease_term:
  preferred_term: postinfectious cerebellitis
  term:
    id: MONDO:0850107
    label: postinfectious cerebellitis
categories:
- Neurological disorder
- Immune-mediated disease
parents:
- cerebellar disease
synonyms:
- acute post-infectious cerebellar ataxia
- acute cerebellar ataxia
- acute cerebellitis
description: >-
  An immune-mediated inflammatory syndrome of the cerebellum that follows an infection, or rarely a
  vaccination, after a latent interval of about a week. It spans a severity spectrum: a benign acute
  cerebellar ataxia at one end, acute cerebellitis with signal change and swelling in the middle, and a
  rare fulminant form with cerebellar oedema, hydrocephalus and a risk of herniation at the other. The
  latent interval is what separates it from an infection of the cerebellum itself. Most children
  recover completely; a minority are left with ataxia, tremor or cognitive deficits, and death is rare
  and essentially confined to the fulminant form.
has_subtypes:
- name: ACA
  display_name: Acute cerebellar ataxia (benign post-infectious)
  classification: severity_tier
  description: >-
    The benign end of the spectrum: acute ataxia with or without nystagmus, and recovery that is
    usually complete. It is the commonest tier.
  evidence:
  - reference: PMID:42649322
    reference_title: "Post-Infectious Cerebellitis: A Systematic Review of Aetiology, Clinical Presentation, Treatment, and Outcomes."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Based on neuroimaging findings and the presence of life-threatening features, 34 patients
      (46.6%) were classified as acute cerebellar ataxia (ACA), 26 (35.6%) as acute cerebellitis
      (AC), and 13 (17.8%) as acute fulminant cerebellitis (AFC), with complete recovery in 58.8%,
      69.2%, and 69.2% of each subtype, respectively, and the cohort's only death occurring in the
      AFC subgroup.
    explanation: >-
      The sentence that defines all three tiers and gives each one's share and outcome in the pooled
      cohort. Note what it does not show: complete recovery is lowest in the benign tier, at 58.8%
      against 69.2% in the other two, which is the opposite of what the tier names suggest and is
      why this entry does not present the tiers as a prognostic ladder.
- name: AC
  display_name: Acute cerebellitis
  classification: severity_tier
  description: >-
    The middle tier, distinguished clinically by headache and vomiting accompanying the ataxia and
    radiologically by cerebellar signal change with swelling. Sequelae are commoner here than the
    benign tier's reputation suggests.
  evidence:
  - reference: PMID:32160830
    reference_title: >-
      Acute Cerebellitis or Postinfectious Cerebellar Ataxia? Clinical and Imaging Features in Acute
      Cerebellitis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of acute cerebellitis rather than acute postinfectious cerebellar ataxia should
      be considered when headache and vomiting accompany ataxia in a child.
    explanation: >-
      The clinical discriminator between this tier and the benign one, stated as a rule for the
      bedside: headache and vomiting with the ataxia. It is a recommendation rather than a validated
      rule, which is why it is cited here and not in a definitions block.
  - reference: PMID:41321459
    reference_title: "Acute ataxia in children: etiological spectrum and clinical characteristics."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      AC patients exhibited later onset, longer duration from symptom onset to hospital
      presentation, and more frequent neurological symptoms (encephalopathy, headache, vomiting)
      compared to APCA.
    explanation: >-
      The same discriminator from an independent cohort of 257 children, with two more axes: later
      onset and a longer interval to presentation. Two sources agreeing on headache and vomiting is
      why the tier is recorded at all.
- name: AFC
  display_name: Acute fulminant cerebellitis
  classification: severity_tier
  description: >-
    The rare, life-threatening tier: rapid cerebellar oedema with obstructive hydrocephalus and
    brainstem compression. It may present with depressed consciousness and no cerebellar signs at all,
    which is what makes it dangerous to recognise late.
  evidence:
  - reference: PMID:33454719
    reference_title: >-
      Pediatric Fulminant Cerebellitis Is Still a Fatal Disease that We Know Little About! Two Case
      Reports and a Literature Review.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical picture started with severe headache, irritability, and acute deterioration of
      consciousness level with the absence of cerebellar signs. There was radiological evidence of
      obstructive hydrocephalus and cerebellar tonsillar herniation in the context of the inflamed
      cerebellum.
    explanation: >-
      The presentation that defines this tier and the reason it is separated from the other two: the
      cerebellar signs a clinician would look for are absent, and what is present is raised
      intracranial pressure. Two cases, so it is a description rather than a frequency.
  - reference: PMID:42699856
    reference_title: "Acute fulminant cerebellitis in children: a case series and literature review on diagnostic challenges and management strategies."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute cerebellitis (AC) in children is often benign; however, a fulminant variant featuring
      rapid cerebellar edema, hydrocephalus, and brainstem compression can be life-threatening.
    explanation: >-
      States the tier against the background of the others, and names the three features that make
      it fulminant. BACKGROUND because the sentence frames the case series rather than reporting its
      result.
pathophysiology:
- name: Preceding Infection
  role: trigger
  biological_scale: ORGANISM
  description: >-
    An infection, or rarely a vaccination, precedes the cerebellar syndrome by a latent interval of
    about a week. The interval is what makes the syndrome post-infectious rather than an infection of
    the cerebellum. No single organism defines it: the commonest trigger differs by era and population,
    and in a quarter of children none is identified.
  evidence:
  - reference: PMID:42649322
    reference_title: "Post-Infectious Cerebellitis: A Systematic Review of Aetiology, Clinical Presentation, Treatment, and Outcomes."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Post-infectious cerebellitis is an immune-mediated cerebellar inflammatory syndrome that
      follows a preceding infection (or, rarely, vaccination) after a latent interval.
    explanation: >-
      The definitional sentence, and the one that carries the latent interval. It is the interval,
      not the infection, that places the syndrome after the infection rather than inside it.
  - reference: PMID:14552515
    reference_title: >-
      Post-infectious acute cerebellar ataxia in children.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Latency from the prodromal illness to the onset of ataxia was 8.8 +/- 7.4 days.
    explanation: >-
      Puts a number on the interval in 39 children: a mean of 8.8 days. The standard deviation of
      7.4 is as informative as the mean, since it spans same-week and three-week onsets.
  - reference: PMID:14552515
    reference_title: >-
      Post-infectious acute cerebellar ataxia in children.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A prodromal febrile illness was noted in 74.4%: varicella, 31%; mumps, 20%; nonspecific viral
      infection, 15.4%; mycoplasma, 5%; Epstein Barr virus, 3%.
    explanation: >-
      The trigger distribution in that series, and the fact that a quarter of children had no
      prodromal illness at all.
  - reference: PMID:35546546
    reference_title: "Postinfectious Acute Cerebellar Syndromes in Children: A Nationally Ascertained Case Series From Australia 2013-2018."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 20 cases (65% were vaccinated for varicella) were included, of which 70% were
      subcategorized as acute cerebellar ataxia (ACA), 20% acute cerebellitis (AC), and 10% acute
      fulminant cerebellitis (AFC). An acute febrile illness was noted in 55% and none were related
      to varicella or were temporally related to varicella vaccination or other childhood vaccines.
    explanation: >-
      Why this node names no organism. Varicella was historically the commonest trigger; in this
      national surveillance series from a population with high varicella vaccine coverage, not one
      of twenty cases was varicella-related. The trigger distribution is a fact about a population
      and an era, not about the disease.
  downstream:
  - target: Immune Response Directed at the Cerebellum
    causal_link_type: DIRECT
    description: >-
      The infection raises a response that then acts on the cerebellum. What connects the two is not
      demonstrated by any source cited here: no cited paper shows a shared epitope, and molecular
      mimicry is named nowhere in this entry's references.
    evidence:
    - reference: PMID:42649322
      reference_title: "Post-Infectious Cerebellitis: A Systematic Review of Aetiology, Clinical Presentation, Treatment, and Outcomes."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Post-infectious cerebellitis is a heterogeneous, largely immune-mediated syndrome with a
        generally favorable prognosis after corticosteroid-based immunotherapy, though outcomes
        and evidence quality vary by etiology and severity subgroup.
      explanation: >-
        The review's closing judgement, and the hedge in it is load-bearing: largely
        immune-mediated, not wholly. The edge is drawn because an immune response is what the
        sources attribute the syndrome to, and it is INDIRECT because none of them demonstrates
        the connection in an individual case.
- name: Immune Response Directed at the Cerebellum
  role: central_effector
  biological_scale: ORGANISM
  description: >-
    The step that makes this disease immune-mediated rather than infectious. Five of the twenty cited
    sources name an immune mechanism; the rest describe the disease without one, and one of them
    calls the aetiology usually viral. It places the syndrome in the family of immune-mediated cerebellar ataxias, beside
    gluten ataxia, the paraneoplastic degenerations and opsoclonus-myoclonus. Which effector does the
    damage is not settled here: autoantibodies against several cerebellar targets are reported in
    individual patients, and whether any of them is pathogenic rather than a consequence of damage is an
    open question recorded in this entry's discussions.
  evidence:
  - reference: PMID:30221603
    reference_title: "Immune-mediated Cerebellar Ataxias: Practical Guidelines and Therapeutic Challenges."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Immune-mediated cerebellar ataxias (IMCAs), a clinical entity reported for the first time in
      the 1980s, include gluten ataxia (GA), paraneoplastic cerebellar degenerations (PCDs),
      antiglutamate decarboxylase 65 (GAD) antibody-associated cerebellar ataxia, post-infectious
      cerebellitis, and opsoclonus myoclonus syndrome (OMS).
    explanation: >-
      Places this disease in the immune-mediated cerebellar ataxia family, named alongside four
      others this knowledge base curates or will. REVIEW_SYNTHESIS because the review is classifying
      rather than reporting its own result.
  - reference: PMID:17049194
    reference_title: >-
      Acute cerebellar ataxia and consecutive cerebellitis produced by glutamate receptor delta2
      autoantibody.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cerebro-spinal fluid examination and magnetic resonance imaging of the brain demonstrated
      pleocytosis and meningeal enhancement, respectively. Furthermore, glutamate receptor delta2
      autoantibody was detected in serum and cerebro-spinal fluid. Thus, we believe that the
      glutamate receptor delta2 autoantibody may play a role in cerebellar ataxia and consecutive
      cerebellitis.
    explanation: >-
      One reported autoantibody, against a receptor the same paper says is predominantly expressed
      in Purkinje cells, with the authors' own hedge preserved: may play a role. A single case, and
      the next item is the reason it is not read as cause.
  - reference: PMID:17008044
    reference_title: >-
      A case of acute cerebellitis accompanied by autoantibodies against glutamate receptor delta2.
    supports: REFUTE
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It was suggested that autoantibodies against GluRdelta2 might not have injured the tissue due
      to the immunological action, but might be induced as a consequence of cerebellar damage.
    explanation: >-
      The counter-reading of the same antibody, from a different case: it may be a consequence of
      cerebellar damage rather than its cause. REFUTE against the claim that the antibody is
      pathogenic, which is why this node names no effector.
  downstream:
  - target: Microglial Activation and TNF-alpha Release
    causal_link_type: DIRECT
    description: >-
      The step from an immune response to a change the cerebellum can register. This arm is established
      in rodent models and not in human tissue: no cited source shows it in a patient.
    evidence:
    - reference: PMID:31509752
      reference_title: >-
        Microglia-Triggered Plasticity of Intrinsic Excitability Modulates Psychomotor Behaviors
        in Acute Cerebellar Inflammation.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Activated microglia via exposure to bacterial endotoxin lipopolysaccharide or heat-killed
        Gram-negative bacteria induce a potentiation of the intrinsic excitability in Purkinje
        neurons, which is suppressed by microglia-activity inhibitor and microglia depletion. An
        inflammatory cytokine, tumor necrosis factor alpha (TNF-alpha), released from microglia
        via toll-like receptor 4, triggers this plasticity.
      explanation: >-
        The whole chain in one sentence, in rodent cerebellum: microglial activation through TLR4,
        TNF-alpha release, and a change in Purkinje cell excitability, each step shown by
        suppression or depletion. MODEL_ORGANISM, and the edge is drawn into this entry on the
        understanding that no cited source demonstrates it in human disease.
  - target: Cerebellar Swelling and Mass Effect
    causal_link_type: DIRECT
    description: >-
      The second arm out of the immune response, and the one that makes the fulminant tier dangerous.
      It is reported in the fulminant tier; no cited source describes it in the benign one.
      It is an inflammatory oedema of the cerebellum rather than a functional change in its neurons,
      and it is what the surgical treatments act on.
    evidence:
    - reference: PMID:42699856
      reference_title: "Acute fulminant cerebellitis in children: a case series and literature review on diagnostic challenges and management strategies."
      supports: SUPPORT
      directness: DIRECT
      quote_role: BACKGROUND
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Acute cerebellitis (AC) in children is often benign; however, a fulminant variant
        featuring rapid cerebellar edema, hydrocephalus, and brainstem compression can be
        life-threatening.
      explanation: >-
        The arm named in one sentence, with its three consequences in order. BACKGROUND: this is
        the framing sentence of a three-case series rather than its finding.
    - reference: PMID:33454719
      reference_title: >-
        Pediatric Fulminant Cerebellitis Is Still a Fatal Disease that We Know Little About! Two
        Case Reports and a Literature Review.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        There was radiological evidence of obstructive hydrocephalus and cerebellar tonsillar
        herniation in the context of the inflamed cerebellum.
      explanation: >-
        The inflamed cerebellum and its mechanical consequences observed together in two children,
        which is as close as any cited source comes to showing this edge in a patient.
- name: Microglial Activation and TNF-alpha Release
  role: effector
  biological_scale: CELLULAR
  description: >-
    Microglia in the cerebellar cortex are activated and release tumour necrosis factor alpha. Shown in
    rodent cerebellum, with the step established by inhibiting and depleting microglia; not shown in
    human tissue by any source cited here.
  evidence:
  - reference: PMID:31509752
    reference_title: >-
      Microglia-Triggered Plasticity of Intrinsic Excitability Modulates Psychomotor Behaviors in
      Acute Cerebellar Inflammation.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Region-specific inflammation in the cerebellum in vivo shows depression- and autistic-like
      behaviors. Furthermore, both TNF-alpha inhibition and microglia depletion revert such
      behavioral abnormality.
    explanation: >-
      The necessity test for this node: blocking the cytokine or removing the cell reverses the
      behavioural change. What this model produces is that behavioural change and not ataxia - stated in those terms by a
      separate review of the same model literature, and recorded as a discussion in this entry.
  downstream:
  - target: Purkinje Cell Intrinsic Hyperexcitability
    causal_link_type: DIRECT
    description: >-
      TNF-alpha acts on its receptor on Bergmann glia, which release glutamate onto metabotropic
      receptors on the Purkinje cell. Each link in that chain was tested separately, in rat cerebellar slice and, for the glutamate step,
      in dissociated cortical astrocyte culture.
    evidence:
    - reference: PMID:30072733
      reference_title: >-
        TNF-α increases the intrinsic excitability of cerebellar Purkinje cells through elevating
        glutamate release in Bergmann Glia.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: IN_VITRO
      snippet: >-
        Interestingly, the effect of TNF-alpha on the intrinsic excitability of PCs was abolished
        under a condition in which the type1 TNF receptor (TNFR1) in Bergmann glia (BG) was
        genetically suppressed by viral delivery of an adeno-associated virus (AAV) containing
        TNFR1-shRNA.
      explanation: >-
        The glial step, tested by knocking the receptor down in Bergmann glia specifically:
        without it the cytokine no longer changes Purkinje excitability. IN_VITRO because the work
        is in slice and culture.
    - reference: PMID:30072733
      reference_title: >-
        TNF-α increases the intrinsic excitability of cerebellar Purkinje cells through elevating
        glutamate release in Bergmann Glia.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: IN_VITRO
      snippet: >-
        Taken together, our study reveals that TNF-alpha triggers glutamate release in BG, thereby
        increasing the intrinsic excitability of cerebellar PCs in a mGluR1-dependent manner.
      explanation: >-
        The authors' own statement of the whole chain this edge draws, with the receptor
        dependence they established pharmacologically.
- name: Purkinje Cell Intrinsic Hyperexcitability
  role: effector
  biological_scale: CELLULAR
  description: >-
    The Purkinje cell fires more readily. This is the cellular state the rodent work converges on, and
    the point at which the model and the human disease part company: the animals became hyperexcitable
    and did not become ataxic, while the ataxic animal models in the same literature show Purkinje
    degeneration and hypoexcitability instead.
  cell_types:
  - preferred_term: Purkinje cell
    term:
      id: CL:0000121
      label: Purkinje cell
  evidence:
  - reference: PMID:35326323
    reference_title: "Acute Cerebellar Inflammation and Related Ataxia: Mechanisms and Pathophysiology."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In our animal model of the acute inflammation of the cerebellar cortex, animals did not show
      any ataxia but hyperexcitability in the cerebellar cortex and depression-like behaviors. In
      contrast, animal models with neurodegeneration of the cerebellar Purkinje cells and
      hypoexcitability of the neurons show cerebellar ataxia. The suppression of the Ca2+-activated
      K+ channels in vivo is associated with a type of ataxia. Therefore, there is a gap in our
      interpretation between the very early phase of cerebellar inflammation and the emergence of
      cerebellar ataxia.
    explanation: >-
      The authors state the gap themselves, and this entry does not paper over it: the inflammation
      model produces hyperexcitability without ataxia, while the models that are ataxic show the
      opposite cellular state. The chain above is therefore the best-evidenced account of early
      cerebellar inflammation, not an explanation of the ataxia the patients present with.
  downstream:
  - target: Cerebellar Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Recorded as INDIRECT because the step is not demonstrated: the source that describes both ends
      says there is a gap between them. The edge is drawn so the graph reaches the clinical syndrome,
      and the gap is a discussion rather than a hidden assumption.
    evidence:
    - reference: PMID:35326323
      reference_title: "Acute Cerebellar Inflammation and Related Ataxia: Mechanisms and Pathophysiology."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The clinical observation of acute cerebellitis is associated with the emergence of
        cerebellar ataxia.
      explanation: >-
        The clinical end of the edge, stated as an association by the same review that says the
        mechanistic step to it is missing.
- name: Cerebellar Dysfunction
  role: consequence
  biological_scale: ORGANISM
  description: >-
    The clinical syndrome: a broad-based ataxic gait with dysmetria, nystagmus, intention tremor and
    dysarthria in varying combination. It is where the pathograph reaches the phenotypes.
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  evidence:
  - reference: PMID:38008790
    reference_title: "\"The Red Flags\" in Clinical Approach to Acute Ataxia-the Experience in Cohort of 76 Children."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical presentation was divided into two categories: (1) isolated cerebellar signs (CS):
      ataxic gait, dysmetria, dysdiadochokinesia, intention tremor, dysarthria, and nystagmus; (2)
      CS-plus symptoms which included CS associated with any of other symptoms such as
      encephalopathy (GCS < 15), awareness disturbances, vomiting, headache, a new onset limb or
      facial paresis, torticollis, hypotonia, and opsoclonus.
    explanation: >-
      The sign list this node resolves into, and the split the same series shows matters for
      outcome: isolated cerebellar signs against cerebellar signs plus something else.
  downstream:
  - target: Ataxic gait
    causal_link_type: DIRECT
    description: The commonest and most characteristic sign.
    evidence:
    - reference: PMID:38008790
      reference_title: >-
        "The Red Flags" in Clinical Approach to Acute Ataxia-the Experience in Cohort of 76
        Children.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Clinical presentation was divided into two categories: (1) isolated cerebellar signs (CS):
        ataxic gait, dysmetria, dysdiadochokinesia, intention tremor, dysarthria, and nystagmus;
      explanation: >-
        The cited series' own case definition, which counts the ataxic gait among the six signs it
        calls isolated cerebellar signs. A second series calls a broad-based gait disturbance the
        most characteristic finding of the disease. INDIRECT: a case definition groups the signs
        with the cerebellum, it does not derive this one from cerebellar dysfunction.
  - target: Dysmetria
    causal_link_type: DIRECT
    description: An appendicular cerebellar sign.
    evidence:
    - reference: PMID:38008790
      reference_title: >-
        "The Red Flags" in Clinical Approach to Acute Ataxia-the Experience in Cohort of 76
        Children.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Clinical presentation was divided into two categories: (1) isolated cerebellar signs (CS):
        ataxic gait, dysmetria, dysdiadochokinesia, intention tremor, dysarthria, and nystagmus;
      explanation: >-
        The cited series' own case definition, which counts dysmetria among the six signs it calls
        isolated cerebellar signs. It is also one of the two findings a paediatric series calls the
        commonest alongside the ataxia. INDIRECT: a case definition groups the signs with the
        cerebellum, it does not derive this one from cerebellar dysfunction.
  - target: Nystagmus
    causal_link_type: DIRECT
    description: The commonest ocular sign in the paediatric series cited.
    evidence:
    - reference: PMID:38008790
      reference_title: >-
        "The Red Flags" in Clinical Approach to Acute Ataxia-the Experience in Cohort of 76
        Children.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Clinical presentation was divided into two categories: (1) isolated cerebellar signs (CS):
        ataxic gait, dysmetria, dysdiadochokinesia, intention tremor, dysarthria, and nystagmus;
      explanation: >-
        The cited series' own case definition, which counts nystagmus among the six signs it calls
        isolated cerebellar signs. It is the other of that pair. INDIRECT: a case definition groups
        the signs with the cerebellum, it does not derive this one from cerebellar dysfunction.
  - target: Dysarthria
    causal_link_type: DIRECT
    description: Slurred speech, reported among the common symptoms.
    evidence:
    - reference: PMID:38008790
      reference_title: >-
        "The Red Flags" in Clinical Approach to Acute Ataxia-the Experience in Cohort of 76
        Children.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Clinical presentation was divided into two categories: (1) isolated cerebellar signs (CS):
        ataxic gait, dysmetria, dysdiadochokinesia, intention tremor, dysarthria, and nystagmus;
      explanation: >-
        The cited series' own case definition, which counts dysarthria among the six signs it calls
        isolated cerebellar signs. It is the sign this edge would otherwise rest on nothing for.
        INDIRECT: a case definition groups the signs with the cerebellum, it does not derive this
        one from cerebellar dysfunction.
  - target: Intention tremor
    causal_link_type: DIRECT
    description: >-
      A cerebellar sign like the others on this node, and one of the deficits that outlasts the
      acute phase in the long-term series.
    evidence:
    - reference: PMID:22936351
      reference_title: >-
        Long-term outcome of children with acute cerebellitis.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Neurological sequelae were reported in five children ranging from ataxia to mild tremor.
      explanation: >-
        Tremor among the persisting cerebellar deficits in eleven children followed for a mean of
        four years and four months. INDIRECT for this edge: the sentence reports the sign at
        follow-up rather than deriving it from cerebellar dysfunction.
  - target: Cognitive and behavioural sequelae
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Recorded as INDIRECT because the cited series report cognitive deficits at follow-up without
      establishing the step from the cerebellar lesion to them.

- name: Cerebellar Swelling and Mass Effect
  role: effector
  biological_scale: TISSUE
  description: >-
    The arm that makes the fulminant tier dangerous. Cerebellar oedema in the posterior fossa obstructs
    cerebrospinal fluid flow and compresses the brainstem, and it is what the surgical treatments act
    on. Scoped to the fulminant subtype because the cited sources describe it there.
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  evidence:
  - reference: PMID:32160830
    reference_title: >-
      Acute Cerebellitis or Postinfectious Cerebellar Ataxia? Clinical and Imaging Features in Acute
      Cerebellitis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tonsillar herniation was present in 73.3% and obstructive hydrocephalus in 26.6%.
    explanation: >-
      The frequencies of the two consequences this node drives, in a series of 15 children with
      acute cerebellitis. Read the denominator: this is an acute cerebellitis series, not an
      unselected one.
  downstream:
  - target: Headache
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Headache with the ataxia is what marks the tiers in which the cerebellum is swollen. No cited
      source states the mechanism, so the edge is drawn through unknown intermediates: raised
      pressure in the posterior fossa is the obvious route and none of these papers measures it.
    evidence:
    - reference: PMID:32160830
      reference_title: >-
        Acute Cerebellitis or Postinfectious Cerebellar Ataxia? Clinical and Imaging Features in
        Acute Cerebellitis.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The diagnosis of acute cerebellitis rather than acute postinfectious cerebellar ataxia
        should be considered when headache and vomiting accompany ataxia in a child.
      explanation: >-
        Ties headache, with vomiting, to the tier in which imaging shows swelling rather than to
        the benign one. INDIRECT: it is a diagnostic recommendation, so it asserts the association
        and not the mechanism behind it.
  - target: Vomiting
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The other half of the pair that marks those tiers, and on the same footing: an association the
      cited sources report without measuring what lies between.
    evidence:
    - reference: PMID:29166939
      reference_title: "Acute cerebellitis in adults: a case report and review of the literature."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        The most common clinical presentation consisted of headache, nausea/vomiting and ataxia.
        Six patients presented with only headache and nausea and subsequently returned with
        cerebellar signs.
      explanation: >-
        In 35 adults, nine of whom had hydrocephalus, this is the commonest presentation - and six
        presented with headache and nausea before any cerebellar sign appeared, which is why these
        two phenotypes are drawn off the swelling arm rather than off cerebellar dysfunction.
  - target: Obstructive hydrocephalus
    causal_link_type: DIRECT
    description: >-
      Swelling in the posterior fossa obstructs cerebrospinal fluid outflow. No cited source states the hydrodynamics; five of the twenty assert the association and the rest do
      not mention it.
    evidence:
    - reference: PMID:29166939
      reference_title: "Acute cerebellitis in adults: a case report and review of the literature."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Magnetic resonance imaging (MRI) showed a swollen cerebellum and hydrocephalus and the
        patient was diagnosed with acute cerebellitis.
      explanation: >-
        The two findings together in one patient, which is the form the association takes in the
        cited sources: imaging shows both, and none of them describes the mechanism linking them.
phenotypes:
- category: Neurological
  name: Ataxic gait
  phenotype_term:
    preferred_term: broad-based ataxic gait
    term:
      id: HP:0002066
      label: Gait ataxia
  description: >-
    The presenting sign in most children and the most characteristic finding of the disease.
  evidence:
  - reference: PMID:28606112
    reference_title: "Acute cerebellitis in children: an eleven year retrospective multicentric study in Italy."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most characteristic finding of AC/ACA was a broad-based gait disturbance. Other common
      symptoms included balance disturbances, slurred speech, vomiting, headache and fever.
    explanation: >-
      Names this as the most characteristic finding across 124 children, and lists the other common
      symptoms, which are the remaining phenotype rows here.
- category: Neurological
  name: Nystagmus
  phenotype_term:
    preferred_term: nystagmus
    term:
      id: HP:0000639
      label: Nystagmus
  description: >-
    An ocular cerebellar sign, reported with dysmetria as the commonest associated finding in the paediatric series cited.
  evidence:
  - reference: PMID:14552515
    reference_title: >-
      Post-infectious acute cerebellar ataxia in children.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common associated neurologic findings were nystagmus and dysmetria.
    explanation: >-
      Names both this row and the next as the commonest findings accompanying the ataxia in 39
      children.
- category: Neurological
  name: Dysmetria
  phenotype_term:
    preferred_term: dysmetria
    term:
      id: HP:0001310
      label: Dysmetria
  description: >-
    An appendicular cerebellar sign, and one of the two findings reported as commonest alongside the ataxia.
  evidence:
  - reference: PMID:32160830
    reference_title: >-
      Acute Cerebellitis or Postinfectious Cerebellar Ataxia? Clinical and Imaging Features in Acute
      Cerebellitis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neurologic examination median 12 months later revealed ataxia and dysmetria in 4 cases (27%),
      accompanied by memory difficulties, dysarthria or tremor.
    explanation: >-
      This sign at follow-up rather than at presentation: it is one of the deficits that persists in
      about a quarter of an acute cerebellitis series at a year.
- category: Neurological
  name: Dysarthria
  phenotype_term:
    preferred_term: slurred speech
    term:
      id: HP:0001260
      label: Dysarthria
  description: >-
    Cerebellar speech, one of the six signs the cited series counts as isolated cerebellar signs.
  evidence:
  - reference: PMID:38008790
    reference_title: "\"The Red Flags\" in Clinical Approach to Acute Ataxia-the Experience in Cohort of 76 Children."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical presentation was divided into two categories: (1) isolated cerebellar signs (CS):
      ataxic gait, dysmetria, dysdiadochokinesia, intention tremor, dysarthria, and nystagmus;
    explanation: >-
      The series' own definition of an isolated cerebellar presentation, which names this sign among
      six. It is a case definition rather than a frequency, which is why this row carries no
      frequency band.
- category: Neurological
  name: Intention tremor
  phenotype_term:
    preferred_term: intention tremor
    term:
      id: HP:0002080
      label: Intention tremor
  description: >-
    A cerebellar sign listed in the series' own definition of isolated cerebellar presentation.
  evidence:
  - reference: PMID:22936351
    reference_title: >-
      Long-term outcome of children with acute cerebellitis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neurological sequelae were reported in five children ranging from ataxia to mild tremor.
      Cognitive deficits were found in six patients.
    explanation: >-
      Tremor among the persisting deficits in a long-term acute cerebellitis follow-up of eleven
      children, beside the cognitive ones.
- category: Clinical
  name: Headache
  phenotype_term:
    preferred_term: headache
    term:
      id: HP:0002315
      label: Headache
  description: >-
    With vomiting, the pair that distinguishes acute cerebellitis from the benign tier at the bedside, and part of the raised-pressure presentation of the fulminant one.
  evidence:
  - reference: PMID:29166939
    reference_title: "Acute cerebellitis in adults: a case report and review of the literature."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common clinical presentation consisted of headache, nausea/vomiting and ataxia. Six
      patients presented with only headache and nausea and subsequently returned with cerebellar
      signs.
    explanation: >-
      In 35 adults this is the commonest presentation, and six of them presented with headache and
      nausea alone and only later developed cerebellar signs - which is why headache is a phenotype
      row here and not a footnote.
- category: Clinical
  name: Vomiting
  phenotype_term:
    preferred_term: vomiting
    term:
      id: HP:0002013
      label: Vomiting
  description: >-
    The other half of the pair that marks the cerebellitis tier, and a sign of raised intracranial pressure in the fulminant one.
  evidence:
  - reference: PMID:32160830
    reference_title: >-
      Acute Cerebellitis or Postinfectious Cerebellar Ataxia? Clinical and Imaging Features in Acute
      Cerebellitis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common first symptoms were ataxia, vomiting, and headache.
    explanation: >-
      The three commonest first symptoms in a series of fifteen children with acute cerebellitis,
      which is the tier this phenotype marks.
- category: Neurological
  name: Encephalopathy
  phenotype_term:
    preferred_term: encephalopathy
    term:
      id: HP:0001298
      label: Encephalopathy
  description: >-
    Not a cerebellar sign, and that is the point: its presence alongside the cerebellar ones predicts a worse outcome, and in the fulminant tier it may be the presentation with no cerebellar signs at all.
  evidence:
  - reference: PMID:38008790
    reference_title: "\"The Red Flags\" in Clinical Approach to Acute Ataxia-the Experience in Cohort of 76 Children."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Analysis showed that presence of additional symptoms to ataxia, so called "cerebellar plus
      symptoms" (p = 0.002) and structural abnormalities (p < 0.001), had statistically higher
      frequency of poor outcome.
    explanation: >-
      The outcome consequence, from 76 children and confirmed in that series' multivariate analysis:
      cerebellar-plus symptoms, of which this is one, and structural abnormality on imaging are the
      two factors associated with poor outcome.
- category: Neurological
  name: Obstructive hydrocephalus
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: obstructive hydrocephalus
    term:
      id: HP:0000238
      label: Hydrocephalus
  description: >-
    The consequence of posterior fossa swelling, and the reason the fulminant tier may need
    cerebrospinal fluid diversion. Four cited sources call it obstructive hydrocephalus in those
    words. HPO's nearest narrower term is Noncommunicating hydrocephalus, HP:0010953, and no cited
    source states that the two names denote the same thing, so the binding stays at the parent and
    the preferred term carries the sources' word.
  evidence:
  - reference: PMID:29166939
    reference_title: "Acute cerebellitis in adults: a case report and review of the literature."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In 9 cases, the cerebellitis was complicated by hydrocephalus.
    explanation: >-
      Nine of 35 adults in this review, one of the four cited sources that use the words obstructive
      hydrocephalus. The binding stays at the parent term for the reason given in the row's
      description.
- category: Neurological
  name: Cognitive and behavioural sequelae
  phenotype_term:
    preferred_term: cognitive impairment after recovery
    term:
      id: HP:0100543
      label: Cognitive impairment
  description: >-
    The deficit that outlasts the ataxia, and the one most easily missed because the motor signs resolve. Reported across three independent follow-up series.
  evidence:
  - reference: PMID:8210223
    reference_title: >-
      Course and outcome of acute cerebellar ataxia.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One fifth of the children followed for more than 4 months experienced transient behavioral or
      intellectual difficulties, but only 5 of the 60 children demonstrated sustained learning
      problems.
    explanation: >-
      Both halves matter: a fifth had transient difficulties, and five of sixty had sustained
      learning problems. The row records the persisting deficit, and the quote keeps the larger
      transient figure beside it so neither stands alone.
  - reference: PMID:22936351
    reference_title: >-
      Long-term outcome of children with acute cerebellitis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neurological and cognitive sequelae are common in children with AC and underline the role of
      the cerebellum in cognition.
    explanation: >-
      The authors' own conclusion from a mean follow-up of four years and four months in children
      with the cerebellitis tier specifically, where cognitive deficits were found in six of eleven.
- category: Neurological
  name: Cerebellar atrophy
  phenotype_term:
    preferred_term: cerebellar atrophy on follow-up imaging
    term:
      id: HP:0001272
      label: Cerebellar atrophy
  description: >-
    A structural outcome seen on repeat imaging in a majority of one acute cerebellitis series, and a reason to repeat the scan rather than assume resolution.
  evidence:
  - reference: PMID:32160830
    reference_title: >-
      Acute Cerebellitis or Postinfectious Cerebellar Ataxia? Clinical and Imaging Features in Acute
      Cerebellitis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Follow-up magnetic resonance imaging (MRI; n = 12) showed diffuse cerebellar cortical
      T2-hyperintense signal changes in 11 cases and cerebellar atrophy in 9.
    explanation: >-
      Nine of twelve re-imaged children in an acute cerebellitis series. The denominator is the
      re-imaged subset of a severe-tier series, not the disease.
diagnosis:
- name: Cerebellar magnetic resonance imaging
  diagnosis_term:
    preferred_term: magnetic resonance imaging of the cerebellum
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    The test that separates the tiers. Bilateral symmetrical T2 signal change in the cerebellar
    cortex with swelling marks the cerebellitis tier; a normal scan does not exclude the benign one.
    An abnormal scan at admission also carries prognostic weight.
  evidence:
  - reference: PMID:32160830
    reference_title: >-
      Acute Cerebellitis or Postinfectious Cerebellar Ataxia? Clinical and Imaging Features in Acute
      Cerebellitis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Magnetic resonance imaging (MRI) generally showed bilateral symmetrical T2 hyperintense
      changes with moderate swelling in the cerebellar cortex.
    explanation: >-
      The imaging pattern itself, in a series of fifteen children with the cerebellitis tier.
  - reference: PMID:28606112
    reference_title: "Acute cerebellitis in children: an eleven year retrospective multicentric study in Italy."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Children with pathological magnetic resonance imaging (MRI) or computed tomography (CT) had a
      higher probability of having clinical sequelae.
    explanation: >-
      The prognostic half of the same test, across 124 children: an abnormal scan at admission
      predicts sequelae, which is the authors' stated reason for imaging every child rather than
      only the severe ones.
  - reference: PMID:11826604
    reference_title: >-
      Neuroimaging of acute cerebellitis.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Their magnetic resonance imaging showed hyperintense signal of cerebellar gray matter in
      T2-weighted sequences, which is a strong indication of a diagnosis of acute cerebellitis.
    explanation: >-
      The same pattern read from two cases, with the authors' own statement of how far it takes a
      diagnosis: a strong indication, not a confirmation. Two patients, so the claim rests on the
      series above rather than on this.
- name: Cerebrospinal fluid examination
  diagnosis_term:
    preferred_term: lumbar puncture for cerebrospinal fluid examination
    term:
      id: NCIT:C15327
      label: Lumbar Puncture
  description: >-
    Used to narrow the differential rather than to confirm this diagnosis. A normal result does not
    exclude it, and in the largest paediatric series the findings correlated with nothing.
  notes: >-
    Posterior fossa swelling is a contraindication to lumbar puncture, and the fulminant tier is
    defined by that swelling. No cited source states the sequence, so the entry records the test and
    not a rule for when to omit it.
  evidence:
  - reference: PMID:28606112
    reference_title: "Acute cerebellitis in children: an eleven year retrospective multicentric study in Italy."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was no correlation among symptoms, cerebrospinal fluid findings, clinical outcome.
    explanation: >-
      The negative result that sets what this test is for: across 124 children the cerebrospinal
      fluid findings predicted neither the presentation nor the outcome.
  - reference: PMID:11826604
    reference_title: >-
      Neuroimaging of acute cerebellitis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosing of acute cerebellitis can sometimes be difficult because the patient may present
      only mild cerebellar signs and the examination of cerebrospinal fluid may be normal.
    explanation: >-
      States the limitation directly: a normal cerebrospinal fluid does not exclude the diagnosis.
  - reference: PMID:29166939
    reference_title: "Acute cerebellitis in adults: a case report and review of the literature."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To diagnose cerebellitis, imaging of the brain (preferably MRI) is required and CSF
      examination may be necessary to narrow the differential diagnosis.
    explanation: >-
      The authors' own statement of the division of labour between the two tests in this entry's
      diagnosis block, from a review of 35 adult cases.
- name: Identification of the antecedent infection
  diagnosis_term:
    preferred_term: serological and molecular testing for the preceding pathogen
    term:
      id: NCIT:C217458
      label: Diagnostic Serology Testing
  description: >-
    A search that usually fails, and that is a finding rather than a shortfall: no pathogen is
    identified in a quarter to a third of cases, and the diagnosis does not depend on finding one.
    The row covers molecular testing as well as serology, which the bound term does not: `runoak -i
    sqlite:obo:ncit search 'l~Infectious Disease'` and `'l^Microbiolog'` returned no clinical-action
    term inside the enum that covers both, so the serology term is bound and the preferred term says
    what the row is.
  evidence:
  - reference: PMID:42649322
    reference_title: "Post-Infectious Cerebellitis: A Systematic Review of Aetiology, Clinical Presentation, Treatment, and Outcomes."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SARS-CoV-2 (n = 24, 32.9%) was the most frequently identified trigger, followed by patients
      with no pathogen identified (n = 18, 24.7%), varicella-zoster virus (n = 8, 11.0%),
      Epstein-Barr virus (n = 5, 6.8%), and influenza (n = 5, 6.8%).
    explanation: >-
      The yield of the search across 73 pooled patients, with no pathogen found in a quarter. Read
      the denominator with care: this is a pooled review whose publication years are weighted
      towards the pandemic, so the SARS-CoV-2 share is a property of the literature sampled, not of
      the disease.
  - reference: PMID:32160830
    reference_title: >-
      Acute Cerebellitis or Postinfectious Cerebellar Ataxia? Clinical and Imaging Features in Acute
      Cerebellitis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Etiologic workup for infectious pathogens revealed Mycoplasma pneumoniae, influenza A virus,
      cytomegalovirus, and varicella zoster virus in 1 case each.
    explanation: >-
      The same search in an unpooled series: four pathogens across fifteen children, one case each,
      which is what a low yield looks like at the bedside.
treatments:
- name: Corticosteroid therapy
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
    - preferred_term: dexamethasone
      term:
        id: CHEBI:41879
        label: dexamethasone
  description: >-
    The commonest treatment in the pooled literature, at three quarters of patients, given on the
    reasoning that the disease is immune-mediated. Twelve of the twenty cited sources never mention
    a steroid, including five of the clinical series. No cited source compares it against no treatment
    in a controlled design; the only treated-against-untreated contrast is two children in a
    fulminant case report, and it is about immunomodulatory therapy rather than steroids
    specifically.
  notes: >-
    No cited source reports a randomised comparison, and one of them asks for exactly that. The
    paediatric series in which the sickest children were the ones who received intravenous steroids
    cannot be read as evidence of effect in either direction, and the entry does not read it that way.
  target_mechanisms:
  - target: Immune Response Directed at the Cerebellum
    description: >-
      Suppression of the immune response is what the drug is given for. No cited source demonstrates
      that it acts on this node in this disease; the target is inferred from the drug class.
    evidence:
    - reference: PMID:42649322
      reference_title: "Post-Infectious Cerebellitis: A Systematic Review of Aetiology, Clinical Presentation, Treatment, and Outcomes."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Post-infectious cerebellitis is a heterogeneous, largely immune-mediated syndrome with a
        generally favorable prognosis after corticosteroid-based immunotherapy, though outcomes
        and evidence quality vary by etiology and severity subgroup.
      explanation: >-
        The authors' own summary, and its own caveat about evidence quality. INDIRECT because
        recovery after a drug in an uncontrolled pooled series is one inference step from the drug
        acting on this node.
  evidence:
  - reference: PMID:42649322
    reference_title: "Post-Infectious Cerebellitis: A Systematic Review of Aetiology, Clinical Presentation, Treatment, and Outcomes."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Corticosteroids were the most common treatment (54/73, 74.0%), followed by antivirals (35/73,
      47.9%) and IVIG (19/73, 26.0%); plasma exchange was given for refractory cases.
    explanation: >-
      The treatment pattern across 73 pooled patients, and the source for the ordering of the rows
      in this block.
  - reference: PMID:28606112
    reference_title: "Acute cerebellitis in children: an eleven year retrospective multicentric study in Italy."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment was decided independently case by case. Patients with a higher clinical score on
      admission had a higher probability of receiving intravenous steroids.
    explanation: >-
      Confounding by indication, stated by the authors of the largest paediatric series: the
      children who got steroids were the sicker ones. This is why no outcome claim is attached to
      this row.
  - reference: PMID:28606112
    reference_title: "Acute cerebellitis in children: an eleven year retrospective multicentric study in Italy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Randomized controlled trials are needed to confirm these observations.
    explanation: >-
      The same authors on what the evidence base lacks. No quote_role is recorded: the sentence is
      this multicentre study's own call for future work, which is neither its finding nor somebody
      else's fact.
- name: Intravenous immunoglobulin
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: intravenous immunoglobulin
      term:
        id: NCIT:C80829
        label: Human Immunoglobulin G
  description: >-
    A second immunotherapy, given to about a quarter of pooled patients and to half of one
    cerebellitis series, usually alongside steroids rather than instead of them.
  evidence:
  - reference: PMID:32160830
    reference_title: >-
      Acute Cerebellitis or Postinfectious Cerebellar Ataxia? Clinical and Imaging Features in Acute
      Cerebellitis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fourteen of 15 patients were treated with intravenous and/or oral steroids and 8 cases with
      intravenous immunoglobulin.
    explanation: >-
      Shows the two immunotherapies given together rather than as alternatives: fourteen of fifteen
      had steroids and eight of those also had immunoglobulin.
  - reference: PMID:40787651
    reference_title: "Isolated Pancerebellar Syndrome With anti-GQ1b IgG Positivity: A Case Report."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient was empirically treated with intravenous immunoglobulin.
    explanation: >-
      A single adult case treated with immunoglobulin alone, and described by its own authors as
      empirical. One patient, so it establishes the practice and not its effect.
- name: Plasma exchange
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: plasmapheresis
    term:
      id: NCIT:C15304
      label: Plasmapheresis
  description: >-
    Reserved for cases that do not respond to the first two. No cited source reports how many
    received it or what followed.
  evidence:
  - reference: PMID:42649322
    reference_title: "Post-Infectious Cerebellitis: A Systematic Review of Aetiology, Clinical Presentation, Treatment, and Outcomes."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Corticosteroids were the most common treatment (54/73, 74.0%), followed by antivirals (35/73,
      47.9%) and IVIG (19/73, 26.0%); plasma exchange was given for refractory cases.
    explanation: >-
      The only statement in any cited source that counts or indicates this treatment in
      post-infectious cerebellitis specifically, and it gives the indication without a count or an
      outcome. A practical-guidelines review of immune-mediated cerebellar ataxias also lists
      plasmapheresis among the modalities to consider for this disease's class; that is cited on the
      knowledge-gap discussion instead, because it is about the class and not about this treatment's
      use here.
- name: Cerebrospinal fluid diversion and posterior fossa decompression
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cerebrospinal fluid diversion
    term:
      id: NCIT:C93208
      label: Cerebrospinal Fluid Diversion
  description: >-
    The treatment specific to the fulminant tier, and the one whose timing the cited case series
    turns on. External ventricular drainage relieves the hydrocephalus; posterior fossa decompression
    relieves the mass effect itself.
  notes: >-
    The three-case series behind this row is the entry's only source on timing, and three cases cannot
    establish that early drainage changes outcome. What it does show is that the fatal case was the one
    in which drainage was delayed, which is a reason to act rather than a measured effect.
  target_mechanisms:
  - target: Cerebellar Swelling and Mass Effect
    description: >-
      Both procedures act on the swelling arm directly: one by draining the obstructed cerebrospinal
      fluid, the other by enlarging the compartment the swollen cerebellum sits in.
    evidence:
    - reference: PMID:42699856
      reference_title: "Acute fulminant cerebellitis in children: a case series and literature review on diagnostic challenges and management strategies."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Prompt recognition and aggressive management, including high-dose corticosteroids,
        cerebrospinal fluid diversion, and timely posterior fossa decompression when needed, can
        substantially reduce morbidity and mortality in fulminant cerebellitis.
      explanation: >-
        The authors' own conclusion, naming both procedures. INDIRECT and from three cases: the
        claim that they reduce mortality is the authors' inference from their series, not a
        measured effect.
  evidence:
  - reference: PMID:42699856
    reference_title: "Acute fulminant cerebellitis in children: a case series and literature review on diagnostic challenges and management strategies."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The second patient, a 2-year-old female, presented with obstructive hydrocephalus, initially
      misdiagnosed as a posterior fossa neoplasm; despite high-dose corticosteroids and delayed
      external ventricular drainage (EVD), she progressed to brainstem failure and succumbed.
    explanation: >-
      The fatal case of the three, and the one in which the drainage was delayed. It is a single
      patient and the delay is confounded with the misdiagnosis that caused it.
  - reference: PMID:42699856
    reference_title: "Acute fulminant cerebellitis in children: a case series and literature review on diagnostic challenges and management strategies."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The third patient, a 10-year-old male, was treated with urgent EVD insertion, high-dose
      corticosteroids, and intensive care monitoring, achieving rapid clinical improvement and
      complete recovery.
    explanation: >-
      The contrasting case in the same series: urgent drainage, complete recovery. Two patients
      compared within one report is not a comparison, which is why this row carries no effect claim.
  - reference: PMID:32160830
    reference_title: >-
      Acute Cerebellitis or Postinfectious Cerebellar Ataxia? Clinical and Imaging Features in Acute
      Cerebellitis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No patient required surgical decompression.
    explanation: >-
      The counterweight, and the reason this row is scoped to the fulminant subtype: none of fifteen
      children in an acute cerebellitis series needed it.
progression:
- phase: Antecedent infection
  notes: >-
    A febrile illness, usually viral, in roughly three quarters of children. Varicella was
    historically the commonest and is no longer so where the vaccine is in use.
  evidence:
  - reference: PMID:14552515
    reference_title: >-
      Post-infectious acute cerebellar ataxia in children.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A prodromal febrile illness was noted in 74.4%: varicella, 31%; mumps, 20%; nonspecific viral
      infection, 15.4%; mycoplasma, 5%; Epstein Barr virus, 3%.
    explanation: >-
      The frequency and the breakdown, in 39 children seen between 1990 and 2001 - before varicella
      vaccination, which is why the varicella share here is not the current one.
  - reference: PMID:35546546
    reference_title: "Postinfectious Acute Cerebellar Syndromes in Children: A Nationally Ascertained Case Series From Australia 2013-2018."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An acute febrile illness was noted in 55% and none were related to varicella or were
      temporally related to varicella vaccination or other childhood vaccines.
    explanation: >-
      The same phase counted in a vaccinated population twenty years later: no varicella at all
      among 20 Australian children. Twenty cases is a small denominator, and the authors present it
      as a description rather than a rate.
- phase: Latent interval
  notes: >-
    The gap between the infection and the ataxia, of the order of a week. It is the feature that
    separates this disease from an infection of the cerebellum itself.
  evidence:
  - reference: PMID:14552515
    reference_title: >-
      Post-infectious acute cerebellar ataxia in children.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Latency from the prodromal illness to the onset of ataxia was 8.8 +/- 7.4 days.
    explanation: >-
      The only series-level figure for the interval in any cited source; a case report of
      post-varicella " ataxia puts one child's at nine days. The standard deviation here is almost
      as large as the mean, so the figure is a central tendency and not a window.
  - reference: PMID:42649322
    reference_title: "Post-Infectious Cerebellitis: A Systematic Review of Aetiology, Clinical Presentation, Treatment, and Outcomes."
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Post-infectious cerebellitis is an immune-mediated cerebellar inflammatory syndrome that
      follows a preceding infection (or, rarely, vaccination) after a latent interval.
    explanation: >-
      The latent interval written into the definition of the disease, which is why it is a phase
      here rather than a detail of the history.
- phase: Acute ataxic phase
  notes: >-
    Ataxia with the cerebellar signs, lasting days to a few weeks in the benign tier. In the
    fulminant tier this is the phase in which swelling and hydrocephalus develop, and it may begin
    with headache and depressed consciousness and no cerebellar signs at all.
  evidence:
  - reference: PMID:14552515
    reference_title: >-
      Post-infectious acute cerebellar ataxia in children.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Full gait recovery took less than 2 weeks on average, and the longest duration of neurologic
      signs was 24 days (mumps-related).
    explanation: >-
      The duration of this phase at the benign end: under two weeks on average, 24 days at the
      longest in a series in which every child recovered completely.
  - reference: PMID:33454719
    reference_title: >-
      Pediatric Fulminant Cerebellitis Is Still a Fatal Disease that We Know Little About! Two Case
      Reports and a Literature Review.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The clinical picture started with severe headache, irritability, and acute deterioration of
      consciousness level with the absence of cerebellar signs.
    explanation: >-
      The same phase in the fulminant tier, in two children: the cerebellar signs that name the
      disease were absent, which is the authors' stated reason the diagnosis is missed.
- phase: Recovery or residual deficit
  notes: >-
    Most recover completely. A minority are left with ataxia, tremor or cognitive deficits, and the
    cognitive ones are the easiest to miss because the motor signs resolve first. Death is rare and
    reported only in the fulminant tier among the sources cited here.
  evidence:
  - reference: PMID:42649322
    reference_title: "Post-Infectious Cerebellitis: A Systematic Review of Aetiology, Clinical Presentation, Treatment, and Outcomes."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Complete recovery occurred in 47/73 patients (64.4%), partial recovery/residual deficit in
      15/73 (20.5%), outcome was not stated for 10/73 (13.7%), and one death (1.4%) was recorded
      (COVID-19-associated necrotizing encephalopathy) - the only fatality, occurring in an adult.
    explanation: >-
      The outcome distribution across 73 pooled patients, with the undetermined fraction left in. A
      pooled review of case reports is weighted towards the cases worth reporting, so these shares
      are an upper bound on severity rather than a population figure.
  - reference: PMID:8210223
    reference_title: >-
      Course and outcome of acute cerebellar ataxia.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Ninety-one percent (55/60) of these, including all children with chickenpox, recovered
      completely from ataxia.
    explanation: >-
      The benign end measured without the publication bias of a pooled case review: 55 of the 60 followed
      for four months or more, out of 73 consecutive children at one hospital over 23 years.
  - reference: PMID:32160830
    reference_title: >-
      Acute Cerebellitis or Postinfectious Cerebellar Ataxia? Clinical and Imaging Features in Acute
      Cerebellitis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute cerebellitis heals with sequelae in about one-third of cases.
    explanation: >-
      The cerebellitis tier, where the proportion is the other way round from the benign one. This
      is the authors' summary of their own 15-child series.
prevalence:
- population: Children presenting to hospital with acute ataxia, Hebei, China, 2018-2024
  measure_type: UNKNOWN
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    No cited source gives a population rate for this disease, so none is recorded. What the sources
    do give is a case-mix fraction among children who present with acute ataxia, which is a different
    quantity with a different denominator and is recorded here as such rather than converted.
  evidence:
  - reference: PMID:41321459
    reference_title: "Acute ataxia in children: etiological spectrum and clinical characteristics."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Etiologies varied by age: infants/toddlers (0-3 years) showed acute postinfectious cerebellar
      ataxia (APCA, 66%), drug intoxication (14%), and acute disseminated encephalomyelitis (ADEM,
      8%); preschoolers (4-6 years) had APCA (63%), ADEM (14%), and acute cerebellitis (AC, 8%);
      school-aged children (7-14 years) presented APCA (48%), AC (21%), and drug intoxication (14%).
    explanation: >-
      The case-mix fraction among 257 children admitted with acute ataxia, and the age gradient in
      it: the post-infectious share falls from two thirds in toddlers to under half in school-age
      children while the cerebellitis share rises.
- population: Pooled published cases of post-infectious cerebellitis, all ages
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  subtype: AFC
  notes: >-
    The fulminant tier's share of reported cases, not its share of the disease: a pooled review of
    case reports over-represents the cases worth reporting, and the fulminant ones are the most
    reportable. The Australian surveillance series, which was not assembled from publications, puts
    the same tier at two of twenty.
  evidence:
  - reference: PMID:42649322
    reference_title: "Post-Infectious Cerebellitis: A Systematic Review of Aetiology, Clinical Presentation, Treatment, and Outcomes."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patient-level data from 73 individuals were extracted for quantitative pooling.
    explanation: >-
      The denominator the tier shares in this entry's has_subtypes block are taken against: the subset of
      the 47 included studies from which patient-level data could be extracted, not the whole case
      literature and not a rarity measure. No cited source gives a population rate for this disease.
  - reference: PMID:35546546
    reference_title: "Postinfectious Acute Cerebellar Syndromes in Children: A Nationally Ascertained Case Series From Australia 2013-2018."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 20 cases (65% were vaccinated for varicella) were included, of which 70% were
      subcategorized as acute cerebellar ataxia (ACA), 20% acute cerebellitis (AC), and 10% acute
      fulminant cerebellitis (AFC).
    explanation: >-
      The same tier split counted prospectively in a surveillance network rather than from
      publications, and the fulminant share is lower: 10% against 17.8% in the pooled literature.
discussions:
- discussion_id: pic_hyperexcitability_without_ataxia
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    The rodent model of acute cerebellar inflammation produces Purkinje cell hyperexcitability and
    depression-like behaviour but no ataxia, while the human disease is defined by ataxia. Does the
    inflammatory mechanism shown in the model explain the human sign, or is a further step missing?
  attaches_to:
  - pathophysiology#Purkinje Cell Intrinsic Hyperexcitability
  - pathophysiology#Cerebellar Dysfunction
  rationale: >-
    The microglia-TNF-alpha-Purkinje cell arm of this entry's pathograph rests entirely on rodent
    work, and the authors of that work say in terms that their animals were not ataxic. Models that
    are ataxic show the opposite electrophysiology - Purkinje cell loss and hypoexcitability. So the
    cited mechanism and the cited sign come from different preparations, and the edge from
    hyperexcitability to cerebellar dysfunction is the entry's weakest. It is drawn because it is
    what the sources support, and it is marked here rather than left to look settled.
  evidence:
  - reference: PMID:35326323
    reference_title: "Acute Cerebellar Inflammation and Related Ataxia: Mechanisms and Pathophysiology."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In our animal model of the acute inflammation of the cerebellar cortex, animals did not show
      any ataxia but hyperexcitability in the cerebellar cortex and depression-like behaviors.
    explanation: >-
      The mismatch stated by the authors of the model itself: inflammation produced
      hyperexcitability and no ataxia.
  - reference: PMID:35326323
    reference_title: "Acute Cerebellar Inflammation and Related Ataxia: Mechanisms and Pathophysiology."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Therefore, there is a gap in our interpretation between the very early phase of cerebellar
      inflammation and the emergence of cerebellar ataxia.
    explanation: >-
      The same authors naming the gap as a gap. This is the sentence the discussion exists to carry.
- discussion_id: pic_glurdelta2_cause_or_consequence
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is the anti-glutamate-receptor-delta2 autoantibody found in some cases a cause of the cerebellar
    injury or a consequence of it?
  attaches_to:
  - pathophysiology#Immune Response Directed at the Cerebellum
  rationale: >-
    Two case reports of the same antibody read it in opposite directions, and neither is in a
    position to settle the question: one argues the antibody is induced by cerebellar damage because
    it was absent from the cerebrospinal fluid early on, the other argues it plays a causal role
    because it was present in both serum and cerebrospinal fluid. Each is a single patient. The
    entry's immune-response node therefore names no effector, and this discussion records why.
  evidence:
  - reference: PMID:17049194
    reference_title: >-
      Acute cerebellar ataxia and consecutive cerebellitis produced by glutamate receptor delta2
      autoantibody.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, we believe that the glutamate receptor delta2 autoantibody may play a role in cerebellar
      ataxia and consecutive cerebellitis.
    explanation: >-
      One side, stated as a belief by its own authors from one 18-month-old patient in whom the
      antibody was found in both serum and cerebrospinal fluid.
  - reference: PMID:17008044
    reference_title: >-
      A case of acute cerebellitis accompanied by autoantibodies against glutamate receptor delta2.
    supports: REFUTE
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It was suggested that autoantibodies against GluRdelta2 might not have injured the tissue due
      to the immunological action, but might be induced as a consequence of cerebellar damage.
    explanation: >-
      The other side, from a single 13-year-old in whom the antibody was in serum but not
      cerebrospinal fluid. REFUTE against the pathogenic reading above, not against the antibody's
      presence, which both reports agree on.
- discussion_id: pic_steroid_effect_untested
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do corticosteroids change the outcome of post-infectious cerebellitis, and in which severity
    tier?
  attaches_to:
  - treatments#Corticosteroid therapy
  rationale: >-
    Three quarters of pooled patients receive corticosteroids and no cited source compares them with
    no treatment in a controlled design. The nearest thing to a comparison is two children in a
    fulminant case report, one given immunomodulatory therapy with a better outcome and one not. The
    largest paediatric series reports that the children who received intravenous
    steroids were the ones with the higher clinical score on admission, so its outcome data are
    confounded by indication in the direction that makes steroids look worse, and it closes by asking
    for randomised trials. Because most children in the benign tier recover without treatment, a trial
    would have to be powered on the severe tiers, which are the rare ones - which is a reason the gap
    has stayed open rather than an argument that it does not matter.
  evidence:
  - reference: PMID:28606112
    reference_title: "Acute cerebellitis in children: an eleven year retrospective multicentric study in Italy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Randomized controlled trials are needed to confirm these observations.
    explanation: >-
      The gap, stated by the authors of the largest paediatric series cited here. No quote_role is
      recorded: a call for future work is neither the paper's finding nor somebody else's fact.
  - reference: PMID:30221603
    reference_title: "Immune-mediated Cerebellar Ataxias: Practical Guidelines and Therapeutic Challenges."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is no evidence of significant differences in terms of response and prognosis among the
      various types of immunotherapies.
    explanation: >-
      The adjacent gap for the choice between immunotherapies, from a practical-guidelines review of
      immune-mediated cerebellar ataxias that treats this disease as one of its members.
notes: >-
  Eighteen of the twenty sources cited here are a case report, a case series, a retrospective cohort
  or a review of those, and no randomised or controlled study of this disease was found. The other
  two are rodent electrophysiology and supply the middle of the mechanism. All twenty are cached as
  abstracts, so every statement here about what the literature does not contain is a statement about
  twenty abstracts. The quantities in the entry
  therefore come with denominators that differ in kind, and the entry names the denominator wherever
  it gives a number. Three are worth separating when reading it. A pooled review of published cases
  counts the cases somebody chose to publish, which over-represents the severe ones. A hospital
  series counts the children who reached that hospital. A prospective surveillance network counts
  cases as they arise and is the only one of the three whose shares can be read as approximating the
  disease, and the one cited here holds twenty patients.

  The mechanism is modelled on rodent work for its middle steps. Microglial activation, TNF-alpha
  release and the change in Purkinje cell excitability are each shown in rat or mouse cerebellum and
  none of them is shown in a patient by any source cited here. That is recorded on the edges
  themselves and again as a HUMAN_MODEL_MISMATCH discussion, because the model that supplies the
  mechanism is explicitly not ataxic while the disease is defined by ataxia.

  The tier names are a severity classification, not a prognostic ladder, and the pooled data do not
  order the way the names suggest: complete recovery was lowest in the benign tier. The entry
  presents them as the classification the field uses and does not infer outcome from the label.
review_notes: >-
  Written from cached sources only. Where a claim rests on a single patient, the entry says so in the
  explanation rather than in a footnote, because a reader of a card sees the explanation.

  Three things were deliberately left out. No reference range or laboratory cut-off is recorded: the
  cerebrospinal fluid findings in the cited series correlate with nothing and no source states a
  threshold. Only one phenotype row carries a frequency, obstructive hydrocephalus at 9 of 35, because it is the
  only one whose cited source gives a number for it. The rows whose sources say only that a sign is
  the commonest or the most characteristic carry no band: a band asserts a percentage range and
  those sources state none. And no
  prevalence rate is recorded at all, because no cited source gives one; the case-mix fractions that
  exist are recorded as such.

  Two phenotypes are left unconnected on purpose. Encephalopathy is the entry's one deliberately
  non-cerebellar row - the series that reports it defines it as a cerebellar-plus symptom, that is,
  a sign that is not cerebellar and whose presence beside the cerebellar ones predicts a worse
  outcome - so drawing it off cerebellar dysfunction would assert the opposite of what the source
  says. Cerebellar atrophy on follow-up imaging is a structural outcome whose upstream no cited
  source identifies; the obvious candidate is the inflammatory injury itself, and no source here
  joins the two.

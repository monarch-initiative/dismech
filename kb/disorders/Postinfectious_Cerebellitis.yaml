      Epstein-Barr virus (n = 5, 6.8%), and influenza (n = 5, 6.8%).
    explanation: >-
      SARS-CoV-2 as the commonest identified trigger, in 24 of 73 published cases. The share is of
      published cases, not of a population, so it is not read as how often the infection precedes
      the syndrome.
  - reference: PMID:39113976
    reference_title: >-
      Cerebellitis following COVID-19 infection: A case-based systematic review and pooled analysis.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL

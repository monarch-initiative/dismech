discussions:
- discussion_id: pic_hyperexcitability_without_ataxia
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    The rodent model of acute cerebellar inflammation produces Purkinje cell hyperexcitability and
    depression-like behaviour but no ataxia, while the human disease is defined by ataxia. Does the
    inflammatory mechanism shown in the model explain the human sign, or is a further step missing?
  attaches_to:
  - pathophysiology#Purkinje Cell Intrinsic Hyperexcitability
  - pathophysiology#Cerebellar Dysfunction
  rationale: >-
    The microglia-TNF-alpha-Purkinje cell arm of this entry's pathograph rests entirely on rodent
    work, and the authors of that work say in terms that their animals were not ataxic. Models that
    are ataxic show the opposite electrophysiology - Purkinje cell loss and hypoexcitability. So the
    cited mechanism and the cited sign come from different preparations, and the edge from
    hyperexcitability to cerebellar dysfunction is the entry's weakest. It is drawn because it is
    what the sources support, and it is marked here rather than left to look settled.
  evidence:
  - reference: PMID:35326323
    reference_title: "Acute Cerebellar Inflammation and Related Ataxia: Mechanisms and Pathophysiology."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In our animal model of the acute inflammation of the cerebellar cortex, animals did not show
      any ataxia but hyperexcitability in the cerebellar cortex and depression-like behaviors.
    explanation: >-
      The mismatch stated by the authors of the model itself: inflammation produced
      hyperexcitability and no ataxia.
  - reference: PMID:35326323
    reference_title: "Acute Cerebellar Inflammation and Related Ataxia: Mechanisms and Pathophysiology."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Therefore, there is a gap in our interpretation between the very early phase of cerebellar
      inflammation and the emergence of cerebellar ataxia.
    explanation: >-
      The same authors naming the gap as a gap. This is the sentence the discussion exists to carry.
- discussion_id: pic_glurdelta2_cause_or_consequence
  kind: CONTROVERSY
  status: OPEN
  prompt: >-
    Is the anti-glutamate-receptor-delta2 autoantibody found in some cases a cause of the cerebellar
    injury or a consequence of it?
  attaches_to:
  - pathophysiology#Immune Response Directed at the Cerebellum
  - pathophysiology#Autoantibodies Binding Neural Tissue
  rationale: >-
    Two case reports of the same antibody read it in opposite directions, and neither is in a
    position to settle the question: one argues the antibody is induced by cerebellar damage because
    it was absent from the cerebrospinal fluid early on, the other argues it plays a causal role
    because it was present in both serum and cerebrospinal fluid. Each is a single patient. A review
    adds that rabbit antibodies against the receptor's putative ligand-binding region caused transient
    ataxia when injected over the mouse cerebellum, which shows that such an antibody can act, not that the
    patients' antibodies do. The entry's immune-response node therefore names no effector, and this
    discussion records why.
  evidence:
  - reference: PMID:17049194
    reference_title: >-
      Acute cerebellar ataxia and consecutive cerebellitis produced by glutamate receptor delta2
      autoantibody.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, we believe that the glutamate receptor delta2 autoantibody may play a role in cerebellar
      ataxia and consecutive cerebellitis.
    explanation: >-
      One side, stated as a belief by its own authors from one 18-month-old patient in whom the
      antibody was found in both serum and cerebrospinal fluid.
  - reference: PMID:17008044
    reference_title: >-
      A case of acute cerebellitis accompanied by autoantibodies against glutamate receptor delta2.
    supports: REFUTE
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It was suggested that autoantibodies against GluRdelta2 might not have injured the tissue due
      to the immunological action, but might be induced as a consequence of cerebellar damage.
    explanation: >-
      The other side, from a single 13-year-old in whom the antibody was in serum but not
      cerebrospinal fluid. REFUTE against the pathogenic reading above, not against the antibody's
      presence, which both reports agree on.
  - reference: PMID:26377184
    reference_title: "'Medusa head ataxia': the expanding spectrum of Purkinje cell antibodies in autoimmune cerebellar ataxia. Part 2: Anti-PKC-gamma, anti-GluR-delta2, anti-Ca/ARHGAP26 and anti-VGCC."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: MODEL_ORGANISM
    snippet: >-
      injection of polyclonal antibodies specific for the putative ligand-binding region of GluRδ2
      generated by immunisation of rabbits with a synthetic peptide into the supracerebellar
      subarachnoid space was shown to cause ... transient ataxia in mice
    explanation: >-
      Support for the pathogenic reading, as a review reports it: an antibody against the receptor can
      cause transient ataxia in mice. INDIRECT because the antibodies were raised in rabbits against a
      synthetic peptide, not taken from patients; the ellipsis skips the culture results in the same
      sentence.
- discussion_id: pic_steroid_effect_untested
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do corticosteroids change the outcome of post-infectious cerebellitis, and in which severity
    tier?
  attaches_to:
  - treatments#Corticosteroid therapy
  rationale: >-
    Three quarters of pooled patients receive corticosteroids and no cited source compares them with
    no treatment in a controlled design. The nearest things to a comparison are two children in a
    fulminant case report, one given immunomodulatory therapy with a better outcome and one not, and
    a series of six children whose ataxia began during acute COVID-19, in which the one given
    corticosteroids and the others, who had no specific treatment, all recovered completely. A
    multicentre paediatric series of acute cerebellar ataxia and cerebellitis reports that patients
    with a higher clinical score on admission had a higher probability of receiving intravenous
    steroids, so an outcome comparison in it would be confounded by indication, and it says
    randomised controlled trials are needed to confirm its observations. Because most children in
    the benign tier recover without treatment, a trial would have to be powered on the severe tiers,
    which are the rare ones - which is a reason the gap has stayed open rather than an argument that
    it does not matter.
  evidence:
  - reference: PMID:28606112
    reference_title: "Acute cerebellitis in children: an eleven year retrospective multicentric study in Italy."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Randomized controlled trials are needed to confirm these observations.
    explanation: >-
      The gap, stated by the authors of that multicentre paediatric series. No quote_role is
      recorded: a call for future work is neither the paper's finding nor somebody else's fact.
  - reference: PMID:30221603
    reference_title: "Immune-mediated Cerebellar Ataxias: Practical Guidelines and Therapeutic Challenges."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is no evidence of significant differences in terms of response and prognosis among the
      various types of immunotherapies.
    explanation: >-
      The adjacent gap for the choice between immunotherapies, from a practical-guidelines review of
      immune-mediated cerebellar ataxias that treats this disease as one of its members.
  - reference: PMID:33454719
    reference_title: >-
      Pediatric Fulminant Cerebellitis Is Still a Fatal Disease that We Know Little About! Two Case
      Reports and a Literature Review.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 2 patients received timely standard medical and surgical management for acute cerebellitis
      in the form of neuroprotective measures, osmotherapy, broad-spectrum antibiotics, and CSF
      diversion. One patient received aggressive immunomodulatory therapy and had a better outcome
      compared with the other patient who received no immunomodulatory therapy and had a poor
      outcome.
    explanation: >-
      The first of the two nearest comparisons the rationale names: both children of this fulminant
      case report had standard medical and surgical management, and the one also given
      immunomodulatory therapy did better than the one who was not. INDIRECT for this gap: the
      abstract does not name the immunomodulatory therapy, so the contrast is not a result about
      corticosteroids as such. It is also two children, uncontrolled.
  - reference: PMID:37061090
    reference_title: >-
      Acute cerebellar ataxia during acute COVID-19: A case series and review of the literature.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One patient received therapy for acute cerebellar ataxia with corticosteroids, and others did
      not receive any specific therapy for acute cerebellar ataxia. The symptoms improved completely
      in all patients, with the recovery interval ranging from one week to two months.
    explanation: >-
      The second of the two nearest comparisons the rationale names: of six children whose ataxia
      began during acute COVID-19, one was given corticosteroids and the others no specific
      treatment, and all recovered completely. INDIRECT for this disease: onset during the infection
      puts these children at the border of this entry. It is also uncontrolled.
notes: >-
  Apart from two rodent electrophysiology studies, which supply the middle of the mechanism, and a
  gene-mutation study and a vestibular physiology study cited among the differential diagnoses, the
  sources cited here are observational clinical studies, such as case reports, case series, cohorts
  and surveillance studies, reviews, and the disease's Orphanet record; no randomised or controlled
  trial of this disease was found. Most are cached as abstracts only, so a statement here about what
  the literature does not contain is mostly a statement about abstracts. The quantities in the entry
  therefore come with denominators that differ in kind, and the entry names the denominator wherever
  it gives a number. Three are worth separating when reading it. A pooled review of published cases
  counts the cases somebody chose to publish, which over-represents the severe ones. A hospital
  series counts the children who reached that hospital. A prospective surveillance network counts
  cases as they arise and is the only one of the three whose shares can be read as approximating the
  disease, though each surveillance series cited here is small.

  The mechanism is modelled on rodent work for its middle steps. Microglial activation, TNF-alpha
  release and the change in Purkinje cell excitability are each shown in rat or mouse cerebellum and
  none of them is shown in a patient with this disease by any source cited here. That is recorded on
  the edges themselves and again as a HUMAN_MODEL_MISMATCH discussion, because the model that
  supplies the mechanism is explicitly not ataxic while the disease is defined by ataxia.

  Cases in which the pathogen is found in the cerebrospinal fluid sit at the border of this entry,
  between the syndrome that follows an infection and an infection of the cerebellum itself, and the
  cited sources draw that border case by case. An adult with influenza A(H1N1)pdm09 had the virus's
  RNA in her cerebrospinal fluid, and her authors read the illness as acute influenza cerebellitis
  rather than a post-influenza process; in a patient whose cerebellar syndrome began nine weeks
  after COVID-19, with the virus found in the cerebrospinal fluid, the authors suspected a
  post-infectious autoimmune cerebellitis, and the patient recovered on corticosteroids. A review of
  Mycoplasma pneumoniae draws the contrasting classification, placing cerebellitis, as most likely,
  among the manifestations in which the bacterium is not at the site of inflammation. The trigger
  rows keep each case with the reading its authors give.

  The tier names are a severity classification, not a prognostic ladder, and the pooled data do not
  order the way the names suggest: complete recovery was lowest in the benign tier. The entry
  presents them as the classification the field uses and does not infer outcome from the label.
review_notes: >-
  Written from cached sources only. Where a claim rests on a single patient, the entry says so in the
  explanation rather than in a footnote, because a reader of a card sees the explanation.

  Three things were deliberately left out. No reference range or laboratory cut-off is recorded: the
  series of this disease cited here report their cerebrospinal fluid findings without cut-offs. The
  cut-offs that other cited sources give are for other groups: pleocytosis in a series of children
  with acute ataxia of any cause; cells, oligoclonal bands and B cells in opsoclonus-myoclonus
  syndrome; and the cell count above which, a review says, pleocytosis is rarely seen in acute
  disseminated encephalomyelitis. None is a threshold for this disease. Only one phenotype row
  carries a frequency, obstructive hydrocephalus, set from 9 of 35 adults in a review of published
  cases. The sources of other rows also give counts. The children seen by one neurosurgical service
  are the severe end of the disease, so no band is set from their altered mental status (4 of 9),
  headache (6 of 9) or vomiting (5 of 9). Cerebellar atrophy in 9 of 12 children re-imaged in one
  series and ataxia with dysmetria in 4 of its 15 children a median of 12 months later are findings
  at follow-up. Sustained learning problems in 5 of the 60 children followed for 4 months or more in
  a benign-tier series of 73, one fifth of whom had transient difficulties, and cognitive deficits
  in 6 of 11 in an acute cerebellitis-tier series are too far apart for one band. The rows whose
  sources say only that a sign is the commonest or the most characteristic carry no band: a band
  asserts a percentage range and those sources state none. And no prevalence rate is recorded at
  all: the one cited source that gives a population rate for this disease does not say in its
  abstract over what period it is counted, and the case-mix fractions that exist are recorded as
  such.

  Three phenotypes are left unconnected on purpose. Encephalopathy is not drawn off cerebellar
  dysfunction: one series defines it as a cerebellar-plus symptom, that is, a sign that is not
  cerebellar and whose presence beside the cerebellar ones predicts a worse outcome, so drawing it
  off cerebellar dysfunction would assert the opposite of what the source says, and the other series
  cited on the row report it without placing it. Papilloedema rests on one case report, which gives
  it beside raised intracranial pressure without saying how they are linked. Cerebellar atrophy on
  follow-up imaging is a structural outcome whose upstream no cited source demonstrates; the obvious
  candidate is the inflammatory injury itself, and the nearest a cited source comes is a review
  finding atrophy on the same side as one-sided inflammation in up to half of cases.

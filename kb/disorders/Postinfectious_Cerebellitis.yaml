animal_models:
- name: Acute cerebellar inflammation rodent model
  species: Mouse and rat
  genotype: wild type, with cerebellar inflammation induced by lipopolysaccharide or heat-killed Gram-negative bacteria
  publication: PMID:31509752
  description: >-
    Inflammation induced in the cerebellar cortex of a normal animal, which is the system every
    mechanistic step in the middle of this entry's chain comes from. It is not a model of this
    disease's trigger - no antecedent infection, no latent interval, no immune response directed at
    the cerebellum - and its authors say in a companion review that the animals were not ataxic.
  notes: >-
    No model-organism gene identifier is bound, because the model carries no engineered allele: the
    intervention is an inflammatory stimulus in a wild-type animal. The species field names both,
    because the cited work spans mouse in vivo behaviour and rat slice and culture electrophysiology.
  modeled_mechanisms:
  - target: Microglial Activation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The node exists because of this model. Activation is established by depleting the cells and by
      inhibiting their activity, which is a necessity test rather than an observation.
    limitations: >-
      The stimulus is bacterial endotoxin or heat-killed bacteria applied to the cerebellum, not an
      immune response to an antecedent systemic infection. Nothing in the model represents the latent
      interval that defines this disease.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: QUALIFYING
      description: >-
        The model's quantity is microglial activation by a toll-like receptor 4 ligand. The node's
        quantity is microglial activation downstream of a post-infectious immune response whose
        effector no cited source identifies.
    evidence:
    - reference: PMID:31509752
      reference_title: >-
        Microglia-Triggered Plasticity of Intrinsic Excitability Modulates Psychomotor Behaviors
        in Acute Cerebellar Inflammation.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Activated microglia via exposure to bacterial endotoxin lipopolysaccharide or heat-killed
        Gram-negative bacteria induce a potentiation of the intrinsic excitability in Purkinje
        neurons, which is suppressed by microglia-activity inhibitor and microglia depletion.
      explanation: >-
        What the model does and how the step was established.
  - target: Purkinje Cell Intrinsic Hyperexcitability
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      The electrophysiological change this entry's chain turns on, measured directly in the model.
    limitations: >-
      Measured in rodent Purkinje cells. No cited source reports Purkinje cell excitability in a
      patient with this disease, so the human end of this node is unmeasured.
    evidence:
    - reference: PMID:30072733
      reference_title: >-
        TNF-α increases the intrinsic excitability of cerebellar Purkinje cells through elevating
        glutamate release in Bergmann Glia.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: IN_VITRO
      snippet: >-
        A bath application of TNF-alpha (100 ng/ml) in acute cerebellar slices elevates spiking
        activity of PCs with no alterations in the regularity of PC firings.
      explanation: >-
        The change measured directly, in rat cerebellar slice.
  - target: Cerebellar Dysfunction
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      The model does not produce the sign that defines the human disease. Its animals show
      depression-like and autistic-like behaviour and no ataxia, which is the gap this entry records
      as a discussion.
    limitations: >-
      The behavioural readout is not the human one. A model that produces no ataxia cannot show how
      cerebellar inflammation produces ataxia, which is the step between this entry's mechanism and
      its phenotypes, and the review of this literature says so in terms.
    divergences:
    - divergence_type: PROXY_QUANTITY
      materiality: INVALIDATING
      description: >-
        The model's outcome measure is depression-like and autistic-like behaviour. The node's
        quantity is cerebellar ataxia. They are not the same observation and the model does not
        produce the second.
    evidence:
    - reference: PMID:35326323
      reference_title: >-
        Acute Cerebellar Inflammation and Related Ataxia: Mechanisms and Pathophysiology.
      supports: REFUTE
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In our animal model of the acute inflammation of the cerebellar cortex, animals did not
        show any ataxia but hyperexcitability in the cerebellar cortex and depression-like
        behaviors.
      explanation: >-
        The failure stated by the authors of the model itself. REFUTE against the claim that this
        model reproduces the human sign.
  evidence:
  - reference: PMID:35326323
    reference_title: >-
      Acute Cerebellar Inflammation and Related Ataxia: Mechanisms and Pathophysiology.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Therefore, there is a gap in our interpretation between the very early phase of cerebellar
      inflammation and the emergence of cerebellar ataxia.
    explanation: >-
      Why this model is recorded with a failure arm rather than as straightforward support: the
      reviewers of its own literature name the gap.
diagnosis:
- name: Cerebellar magnetic resonance imaging
  diagnosis_term:
    preferred_term: magnetic resonance imaging of the cerebellum
    term:
      id: NCIT:C16809
      label: Magnetic Resonance Imaging
  description: >-
    The test that separates the tiers. Bilateral symmetrical T2 signal change in the cerebellar
    cortex with swelling marks the cerebellitis tier; a normal scan does not exclude the benign one.
    An abnormal scan at admission also carries prognostic weight.
  evidence:
  - reference: PMID:32160830
    reference_title: >-
      Acute Cerebellitis or Postinfectious Cerebellar Ataxia? Clinical and Imaging Features in Acute
      Cerebellitis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Magnetic resonance imaging (MRI) generally showed bilateral symmetrical T2 hyperintense
      changes with moderate swelling in the cerebellar cortex.
    explanation: >-
      The imaging pattern itself, in a series of fifteen children with the cerebellitis tier.
  - reference: PMID:28606112
    reference_title: "Acute cerebellitis in children: an eleven year retrospective multicentric study in Italy."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Children with pathological magnetic resonance imaging (MRI) or computed tomography (CT) had a
      higher probability of having clinical sequelae.
    explanation: >-
      The prognostic half of the same test, across 124 children: an abnormal scan at admission
      predicts sequelae, which is the authors' stated reason for imaging every child rather than
      only the severe ones.
  - reference: PMID:11826604
    reference_title: >-
      Neuroimaging of acute cerebellitis.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Their magnetic resonance imaging showed hyperintense signal of cerebellar gray matter in
      T2-weighted sequences, which is a strong indication of a diagnosis of acute cerebellitis.
    explanation: >-
      The same pattern read from two cases, with the authors' own statement of how far it takes a
      diagnosis: a strong indication, not a confirmation. Two patients, so the claim rests on the
      series above rather than on this.
- name: Cerebrospinal fluid examination
  diagnosis_term:
    preferred_term: lumbar puncture for cerebrospinal fluid examination
    term:
      id: NCIT:C15327
      label: Lumbar Puncture
  description: >-
    Used to narrow the differential rather than to confirm this diagnosis. A normal result does not
    exclude it, and in a multicentre paediatric series the cerebrospinal fluid findings did not
    correlate with symptoms or clinical outcome.
  notes: >-
    Posterior fossa swelling is a contraindication to lumbar puncture, and the fulminant tier is
    defined by that swelling. No cited source states the sequence, so the entry records the test and
    not a rule for when to omit it.
  evidence:
  - reference: PMID:28606112
    reference_title: "Acute cerebellitis in children: an eleven year retrospective multicentric study in Italy."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There was no correlation among symptoms, cerebrospinal fluid findings, clinical outcome.
    explanation: >-
      The negative result that sets what this test is for: across 124 children the cerebrospinal
      fluid findings predicted neither the presentation nor the outcome.
  - reference: PMID:11826604
    reference_title: >-
      Neuroimaging of acute cerebellitis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diagnosing of acute cerebellitis can sometimes be difficult because the patient may present
      only mild cerebellar signs and the examination of cerebrospinal fluid may be normal.
    explanation: >-
      States the limitation directly: a normal cerebrospinal fluid does not exclude the diagnosis.
  - reference: PMID:29166939
    reference_title: "Acute cerebellitis in adults: a case report and review of the literature."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To diagnose cerebellitis, imaging of the brain (preferably MRI) is required and CSF
      examination may be necessary to narrow the differential diagnosis.
    explanation: >-
      The authors' own statement of the division of labour between the two tests in this entry's
      diagnosis block, from a review of 35 adult cases.
- name: Identification of the antecedent infection
  diagnosis_term:
    preferred_term: serological and molecular testing for the preceding pathogen
    term:
      id: NCIT:C217458
      label: Diagnostic Serology Testing
  description: >-
    A search that usually fails, and that is a finding rather than a shortfall: no pathogen is
    identified in a quarter to a third of cases, and the diagnosis does not depend on finding one.
    The row covers molecular testing as well as serology, which the bound term does not: `runoak -i
    sqlite:obo:ncit search 'l~Infectious Disease'` and `'l^Microbiolog'` returned no clinical-action
    term inside the enum that covers both, so the serology term is bound and the preferred term says
    what the row is.
  evidence:
  - reference: PMID:42649322
    reference_title: "Post-Infectious Cerebellitis: A Systematic Review of Aetiology, Clinical Presentation, Treatment, and Outcomes."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      SARS-CoV-2 (n = 24, 32.9%) was the most frequently identified trigger, followed by patients
      with no pathogen identified (n = 18, 24.7%), varicella-zoster virus (n = 8, 11.0%),
      Epstein-Barr virus (n = 5, 6.8%), and influenza (n = 5, 6.8%).
    explanation: >-
      The yield of the search across 73 pooled patients, with no pathogen found in a quarter. Read
      the denominator with care: this is a pooled review whose publication years are weighted
      towards the pandemic, so the SARS-CoV-2 share is a property of the literature sampled, not of
      the disease.
  - reference: PMID:32160830
    reference_title: >-
      Acute Cerebellitis or Postinfectious Cerebellar Ataxia? Clinical and Imaging Features in Acute
      Cerebellitis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Etiologic workup for infectious pathogens revealed Mycoplasma pneumoniae, influenza A virus,
      cytomegalovirus, and varicella zoster virus in 1 case each.
    explanation: >-
      The same search in an unpooled series: four pathogens across fifteen children, one case each,
      which is what a low yield looks like at the bedside.
treatments:
- name: Corticosteroid therapy
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
    - preferred_term: dexamethasone
      term:
        id: CHEBI:41879
        label: dexamethasone
  description: >-
    The commonest treatment in the pooled literature, at three quarters of patients, given on the
    reasoning that the disease is immune-mediated. Many of the cited sources never mention a steroid,
    clinical series among them. No cited source compares it against no treatment
    in a controlled design; the only treated-against-untreated contrast is two children in a
    fulminant case report, and it is about immunomodulatory therapy rather than steroids
    specifically.
  notes: >-
    Antivirals are not recorded as a treatment row, although the pooled review gives them to 47.9% of
    its patients in a sentence this entry already quotes. They treat the trigger rather than the
    post-infectious process, which is what every node in this entry's chain is about, and no cited
    source reports an outcome for them in this disease. A row would assert a treatment relationship
    the sources do not describe.

    No cited source reports a randomised comparison in this disease, and one of them asks for
    exactly that. The paediatric series in which children with a higher clinical score on admission
    were more likely to receive intravenous steroids cannot be read as evidence of effect in either
    direction, and the entry does not read it that way.
  target_mechanisms:
  - target: Immune Response Directed at the Cerebellum
    description: >-
      Suppression of the immune response is what the drug is given for. No cited source demonstrates
      that it acts on this node in this disease; the target is inferred from the drug class.
    evidence:
    - reference: PMID:42649322
      reference_title: "Post-Infectious Cerebellitis: A Systematic Review of Aetiology, Clinical Presentation, Treatment, and Outcomes."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Post-infectious cerebellitis is a heterogeneous, largely immune-mediated syndrome with a
        generally favorable prognosis after corticosteroid-based immunotherapy, though outcomes
        and evidence quality vary by etiology and severity subgroup.
      explanation: >-
        The authors' own summary, and its own caveat about evidence quality. INDIRECT because
        recovery after a drug in an uncontrolled pooled series is one inference step from the drug
        acting on this node.
  evidence:
  - reference: PMID:42649322
    reference_title: "Post-Infectious Cerebellitis: A Systematic Review of Aetiology, Clinical Presentation, Treatment, and Outcomes."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Corticosteroids were the most common treatment (54/73, 74.0%), followed by antivirals (35/73,
      47.9%) and IVIG (19/73, 26.0%); plasma exchange was given for refractory cases.
    explanation: >-
      The treatment pattern across 73 pooled patients, and the source for the ordering of the rows
      in this block.
  - reference: PMID:28606112
    reference_title: "Acute cerebellitis in children: an eleven year retrospective multicentric study in Italy."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment was decided independently case by case. Patients with a higher clinical score on
      admission had a higher probability of receiving intravenous steroids.
    explanation: >-
      The authors of a multicentre paediatric series report that children with a higher clinical
      score on admission were more likely to receive intravenous steroids, so an outcome comparison
      in it would be confounded by indication. This is why no outcome claim is attached to this row.
  - reference: PMID:28606112
    reference_title: "Acute cerebellitis in children: an eleven year retrospective multicentric study in Italy."
    supports: NO_EVIDENCE
    directness: UNKNOWN
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Randomized controlled trials are needed to confirm these observations.
    explanation: >-
      Kept on this row as NO_EVIDENCE rather than SUPPORT, because a call for trials does not support
      the treatment: it records that the evidence for it has not been gathered. The argument the
      sentence belongs to is in the knowledge-gap discussion, where it is also cited. No quote_role:
      a call for future work is neither this multicentre study's finding nor somebody else's fact.
- name: Intravenous immunoglobulin
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: intravenous immunoglobulin
      term:
        id: NCIT:C80829
        label: Human Immunoglobulin G
  description: >-
    A second immunotherapy, given to about a quarter of pooled patients and to half of one
    cerebellitis series, usually alongside steroids rather than instead of them.
  evidence:
  - reference: PMID:32160830
    reference_title: >-
      Acute Cerebellitis or Postinfectious Cerebellar Ataxia? Clinical and Imaging Features in Acute
      Cerebellitis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fourteen of 15 patients were treated with intravenous and/or oral steroids and 8 cases with
      intravenous immunoglobulin.
    explanation: >-
      Shows the two immunotherapies given together rather than as alternatives: fourteen of fifteen
      had steroids and eight of those also had immunoglobulin.
  - reference: PMID:40787651
    reference_title: "Isolated Pancerebellar Syndrome With anti-GQ1b IgG Positivity: A Case Report."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient was empirically treated with intravenous immunoglobulin.
    explanation: >-
      A single adult case treated with immunoglobulin alone, and described by its own authors as
      empirical. One patient, so it establishes the practice and not its effect.
- name: Plasma exchange
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: plasmapheresis
    term:
      id: NCIT:C15304
      label: Plasmapheresis
  description: >-
    Reserved for cases that do not respond to the first two. No cited source reports how many
    received it or what followed.
  evidence:
  - reference: PMID:42649322
    reference_title: "Post-Infectious Cerebellitis: A Systematic Review of Aetiology, Clinical Presentation, Treatment, and Outcomes."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Corticosteroids were the most common treatment (54/73, 74.0%), followed by antivirals (35/73,
      47.9%) and IVIG (19/73, 26.0%); plasma exchange was given for refractory cases.
    explanation: >-
      The only statement in any cited source that counts or indicates this treatment in
      post-infectious cerebellitis specifically, and it gives the indication without a count or an
      outcome. A practical-guidelines review of immune-mediated cerebellar ataxias also lists
      plasmapheresis among the modalities to consider for this disease's class; that is cited on the
      knowledge-gap discussion instead, because it is about the class and not about this treatment's
      use here.
- name: Cerebrospinal fluid diversion and posterior fossa decompression
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cerebrospinal fluid diversion
    term:
      id: NCIT:C93208
      label: Cerebrospinal Fluid Diversion
  description: >-
    The treatment specific to the fulminant tier, and the one whose timing the cited case series
    turns on. External ventricular drainage relieves the hydrocephalus; posterior fossa decompression
    relieves the mass effect itself.
  notes: >-
    The three-case series behind this row is the entry's only source on timing, and three cases cannot
    establish that early drainage changes outcome. What it does show is that the fatal case was the one
    in which drainage was delayed, which is a reason to act rather than a measured effect.
  target_mechanisms:
  - target: Cerebellar Swelling and Mass Effect
    description: >-
      Both procedures act on the swelling arm directly: one by draining the obstructed cerebrospinal
      fluid, the other by enlarging the compartment the swollen cerebellum sits in.
    evidence:
    - reference: PMID:42699856
      reference_title: "Acute fulminant cerebellitis in children: a case series and literature review on diagnostic challenges and management strategies."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Prompt recognition and aggressive management, including high-dose corticosteroids,
        cerebrospinal fluid diversion, and timely posterior fossa decompression when needed, can
        substantially reduce morbidity and mortality in fulminant cerebellitis.
      explanation: >-
        The authors' own conclusion, naming both procedures. INDIRECT and from three cases: the
        claim that they reduce mortality is the authors' inference from their series, not a
        measured effect.
  evidence:
  - reference: PMID:42699856
    reference_title: "Acute fulminant cerebellitis in children: a case series and literature review on diagnostic challenges and management strategies."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The second patient, a 2-year-old female, presented with obstructive hydrocephalus, initially
      misdiagnosed as a posterior fossa neoplasm; despite high-dose corticosteroids and delayed
      external ventricular drainage (EVD), she progressed to brainstem failure and succumbed.
    explanation: >-
      The fatal case of the three, and the one in which the drainage was delayed. It is a single
      patient and the delay is confounded with the misdiagnosis that caused it.
  - reference: PMID:42699856
    reference_title: "Acute fulminant cerebellitis in children: a case series and literature review on diagnostic challenges and management strategies."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The third patient, a 10-year-old male, was treated with urgent EVD insertion, high-dose
      corticosteroids, and intensive care monitoring, achieving rapid clinical improvement and
      complete recovery.
    explanation: >-
      The contrasting case in the same series: urgent drainage, complete recovery. Two patients
      compared within one report is not a comparison, which is why this row carries no effect claim.
  - reference: PMID:32160830
    reference_title: >-
      Acute Cerebellitis or Postinfectious Cerebellar Ataxia? Clinical and Imaging Features in Acute
      Cerebellitis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No patient required surgical decompression.
    explanation: >-
      The counterweight, and the reason this row is scoped to the fulminant subtype: none of fifteen
      children in an acute cerebellitis series needed it.
differential_diagnoses:
- name: Drug or toxin intoxication
  disease_term:
    preferred_term: poisoning
    term:
      id: MONDO:0029000
      label: poisoning
  description: >-
    The second commonest cause of acute ataxia in children after postinfectious cerebellitis in a
    pooled analysis of 1,167 children from eleven studies, with an expected share of 14.1%; the
    cause in 24 of 76 children in one series; and in another, which splits the causes by age, 14% of
    infants and toddlers and of school-age children. One series of acute cerebellar ataxia excludes
    it by its case definition. No cited source gives a history or examination feature that separates
    it. One review says every child with acute ataxia should be screened for toxic ingestion, and a
    systematic review that a toxicology screen should be considered in all of them, and that review
    reports of its screening tests together, toxicology among them, that in most studies the
    abnormalities detected were not diagnostic.
  distinguishing_features:
  - >-
      A toxicology screen. One review says every child with acute ataxia should be screened, and a
      systematic review that a screen should be considered in all of them. No cited source gives a
      clinical feature that separates intoxication.
  evidence:
  - reference: PMID:41325013
    reference_title: "Etiologies of Acute Ataxia in Children: A Systematic Review of 1167 Subjects."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Eleven studies, consisting of 1167 children, met inclusion criteria of 10 or more patients,
      multiple etiologies of ataxia, and diagnostic data including number of patients with each
      condition.
    explanation: >-
      The pooled analysis's size: eleven studies and 1,167 children. A statement of what the
      analysis included, so no quote role is recorded.
  - reference: PMID:41325013
    reference_title: "Etiologies of Acute Ataxia in Children: A Systematic Review of 1167 Subjects."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Postinfectious cerebellitis (EV, 38.0%; 95% CredI, 35.3-40.8%), drug intoxication/poisoning
      (EV, 14.1%; 95% CredI, 12.1-16.1%), central nervous system infection or inflammation (EV,
      8.1%; 95% CredI, 6.6-9.8%), neoplasm (EV 7.3%; 95% CredI, 5.9-8.8%), and peripheral
      neuropathies including Guillain-Barré syndrome (EV, 6.6%; 95% CredI, 5.3-8.1) occurred most
      commonly and accounted for 74.1% of cases.
    explanation: >-
      Intoxication's expected share among children with acute ataxia, second after postinfectious
      cerebellitis.
  - reference: PMID:38008790
    reference_title: >-
      "The Red Flags" in Clinical Approach to Acute Ataxia-the Experience in Cohort of 76 Children.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The study included 76 children, with a mean age of 5.7 years (IQR 2.1-8.3). The most frequent
      causes of AA were immune-mediated/infective cerebellar ataxia in 27 (35.5%), and intoxication
      in 24 (31.6%) cases, followed by vestibular ataxia, opsoclonus-myoclonus-ataxia syndrome, and
      intracranial expansive process.
    explanation: >-
      Intoxication in 24 of 76 children in one series, the second commonest cause there too.
  - reference: PMID:41321459
    reference_title: "Acute ataxia in children: etiological spectrum and clinical characteristics."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Etiologies varied by age: infants/toddlers (0-3 years) showed acute postinfectious cerebellar
      ataxia (APCA, 66%), drug intoxication (14%), and acute disseminated encephalomyelitis (ADEM,
      8%); preschoolers (4-6 years) had APCA (63%), ADEM (14%), and acute cerebellitis (AC, 8%);
      school-aged children (7-14 years) presented APCA (48%), AC (21%), and drug intoxication (14%).
    explanation: >-
      Intoxication in 14% of infants and toddlers and of school-age children, in a series that
      splits the causes by age.
  - reference: PMID:14552515
    reference_title: "Post-infectious acute cerebellar ataxia in children."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of acute cerebellar ataxia was based on the following criteria: acute onset of
      ataxia with or without nystagmus; absence of known genetic predisposing factors, such as
      familial degenerative disorders; and absence of drug intoxication, bacterial meningitis, and
      metabolic disorders.
    explanation: >-
      The series of acute cerebellar ataxia excludes drug intoxication by its own case definition. A
      methods statement, so no quote role is recorded.
  - reference: PMID:27789117
    reference_title: >-
      Acute Ataxia in Children: A Review of the Differential Diagnosis and Evaluation in the
      Emergency Department.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All patients should be reflexively screened for toxic ingestions.
    explanation: >-
      A review's recommendation that every child with acute ataxia be screened for toxic ingestion.
  - reference: PMID:23683541
    reference_title: "Evaluation of the child with acute ataxia: a systematic review."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A toxicology screen should be considered in all children presenting with acute ataxia.
    explanation: >-
      A systematic review's advice that a toxicology screen be considered in every child presenting
      with acute ataxia.
  - reference: PMID:23683541
    reference_title: "Evaluation of the child with acute ataxia: a systematic review."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The literature revealed the following frequencies of laboratory screening abnormalities in
      children with acute ataxia: CT (∼2.5%), MRI (∼5%), lumbar puncture (43%), EEG (42%), and
      toxicology (49%). In most studies, abnormalities detected by these screening tests were
      nondiagnostic.
    explanation: >-
      How often screening tests, toxicology among them, were abnormal in the studies the systematic
      review pooled, and that in most studies the abnormalities were not diagnostic.
- name: Posterior fossa tumour
  disease_term:
    preferred_term: posterior fossa tumour
    term:
      id: MONDO:0037736
      label: infratentorial neoplasm
  description: >-
    A neoplasm was the cause in an expected 7.3% of children with acute ataxia in the pooled
    analysis of 1,167 children, whose cached abstract does not give its site. One review says
    neuroimaging is needed in acute or subacute ataxia to exclude a focal lesion in the posterior
    fossa, a tumour among them, and a systematic review that it should be considered in every child
    with new-onset ataxia. The commonest presenting symptoms overlap: in one series medulloblastoma
    presented most often with vomiting and headache, then ataxia, and those three were the commonest
    first symptoms in one paediatric series of acute cerebellitis and the commonest presentation in
    a review of published adult cases. A tumour's symptoms can run for weeks before diagnosis: in
    the medulloblastoma series they had lasted a mean of 7.4 weeks in high-stage and 19.5 weeks in
    low-stage patients before staging. Obstructive hydrocephalus overlaps too: severe acute
    cerebellitis can present with raised intracranial pressure and hydrocephalus, the paediatric
    series of acute cerebellitis found obstructive hydrocephalus in 26.6%, and one child whose
    cerebellitis presented with it was first misdiagnosed as having a posterior fossa neoplasm.
  distinguishing_features:
  - >-
      A mass in the posterior fossa on neuroimaging, which one review calls necessary in acute or
      subacute ataxia.
  - >-
      A history of weeks to months: in one medulloblastoma series symptoms had lasted a mean of 7.4
      weeks in high-stage and 19.5 weeks in low-stage patients before staging.
  - >-
      Not headache, vomiting and ataxia alone, which acute cerebellitis also presents with.
  - >-
      Not obstructive hydrocephalus alone, which about a quarter of children in one series of acute
      cerebellitis had.
  evidence:
  - reference: PMID:41325013
    reference_title: "Etiologies of Acute Ataxia in Children: A Systematic Review of 1167 Subjects."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Postinfectious cerebellitis (EV, 38.0%; 95% CredI, 35.3-40.8%), drug intoxication/poisoning
      (EV, 14.1%; 95% CredI, 12.1-16.1%), central nervous system infection or inflammation (EV,
      8.1%; 95% CredI, 6.6-9.8%), neoplasm (EV 7.3%; 95% CredI, 5.9-8.8%), and peripheral
      neuropathies including Guillain-Barré syndrome (EV, 6.6%; 95% CredI, 5.3-8.1) occurred most
      commonly and accounted for 74.1% of cases.
    explanation: >-
      A neoplasm's expected share among children with acute ataxia. Indirect: the cached abstract
      does not give the site, so the share may include tumours outside the posterior fossa.
  - reference: PMID:35260471
    reference_title: >-
      Diagnosis and Management of Opsoclonus-Myoclonus-Ataxia Syndrome in Children: An International
      Perspective.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Initially, neuroimaging in children with acute or subacute onset of ataxia, regardless of
      whether they present with opsoclonus, is necessary to exclude focal lesions in the posterior
      fossa, including those due to tumor and other inflammatory or metabolic diseases.
    explanation: >-
      That neuroimaging in acute or subacute ataxia is needed to exclude a focal posterior fossa
      lesion, a tumour among them.
  - reference: PMID:23683541
    reference_title: "Evaluation of the child with acute ataxia: a systematic review."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neuroimaging should be considered in all children with new onset ataxia.
    explanation: >-
      A systematic review's advice that neuroimaging be considered in every child with new-onset
      ataxia.
  - reference: PMID:8756384
    reference_title: >-
      Is there a correlation between duration of presenting symptoms and stage of medulloblastoma at
      the time of diagnosis?
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common presenting symptoms were vomiting (67%), headache (60%), ataxia (40%), and
      nausea (39%).
    explanation: >-
      Ataxia among the presenting symptoms of medulloblastoma, behind vomiting and headache.
  - reference: PMID:8756384
    reference_title: >-
      Is there a correlation between duration of presenting symptoms and stage of medulloblastoma at
      the time of diagnosis?
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fifty of the 66 patients for whom the duration of symptoms was known (76%) had < or = 3 months
      of symptoms prior to stage. High CH stage patients had a mean duration of symptoms of 7.4 +/-
      6.9 weeks versus 19.5 +/- 22.5 weeks for low stage patients.
    explanation: >-
      How long medulloblastoma symptoms had lasted before staging: a mean of weeks, longer in
      low-stage disease.
  - reference: PMID:32160830
    reference_title: >-
      Acute Cerebellitis or Postinfectious Cerebellar Ataxia? Clinical and Imaging Features in Acute
      Cerebellitis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common first symptoms were ataxia, vomiting, and headache.
    explanation: >-
      The same three symptoms as the commonest first symptoms in one paediatric series of acute
      cerebellitis.
  - reference: PMID:32160830
    reference_title: >-
      Acute Cerebellitis or Postinfectious Cerebellar Ataxia? Clinical and Imaging Features in Acute
      Cerebellitis.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Tonsillar herniation was present in 73.3% and obstructive hydrocephalus in 26.6%.
    explanation: >-
      Obstructive hydrocephalus in about a quarter of the same paediatric series of acute
      cerebellitis.
  - reference: PMID:29166939
    reference_title: "Acute cerebellitis in adults: a case report and review of the literature."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The most common clinical presentation consisted of headache, nausea/vomiting and ataxia.
    explanation: >-
      The same three as the commonest presentation in a review of published adult cases of acute
      cerebellitis.
  - reference: PMID:22805251

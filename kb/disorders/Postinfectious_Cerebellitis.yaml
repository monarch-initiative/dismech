treatments:
- name: Corticosteroid therapy
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
    - preferred_term: dexamethasone
      term:
        id: CHEBI:41879
        label: dexamethasone
  description: >-
    The commonest treatment in the pooled literature, at three quarters of patients, given on the
    reasoning that the disease is immune-mediated. Many of the cited sources never mention a
    steroid, clinical series among them. No cited source compares it against no treatment in a
    controlled design. The treated-against-untreated contrasts are two children in a fulminant case
    report, about immunomodulatory therapy rather than steroids specifically, and a series of six
    children whose ataxia began during acute COVID-19, one given corticosteroids and the others no
    specific treatment, all of whom recovered completely; their onset during the infection puts them
    at the border of this entry.
  notes: >-
    Antivirals are not recorded as a treatment row, although the pooled review gives them to 47.9%
    of its patients in a sentence this entry already quotes. They treat the trigger rather than the
    post-infectious process, which is what every node in this entry's chain is about, and no cited
    source reports an outcome for them in this disease separable from that of the other treatment
    given with them, except in single cases of influenza or COVID-19: an adult with influenza A in
    her cerebrospinal fluid improved on oseltamivir, a boy with influenza was given oseltamivir and
    his ataxia and hallucinations continued, the boy's report tabulates two further published
    influenza cases treated with oseltamivir that recovered, and in a review of cerebellar syndromes
    after COVID-19 an adult with SARS-CoV-2 in his cerebrospinal fluid improved on lopinavir and
    ritonavir, while the same review reads the cases given remdesivir and then steroids as a sign
    that remdesivir alone may be insufficient or that the disease was severe. These are single
    cases, several of them at the border with an infection of the cerebellum (the virus in the
    cerebrospinal fluid, or read as active infection), and in single cases the drug cannot be
    separated from the course of the infection. A row would assert a treatment relationship the
    sources do not describe.

    No cited source reports a randomised comparison in this disease, and one of them asks for
    exactly that. The paediatric series in which children with a higher clinical score on admission
    were more likely to receive intravenous steroids cannot be read as evidence of effect in either
    direction, and the entry does not read it that way.
  target_mechanisms:
  - target: Immune Response Directed at the Cerebellum
    description: >-
      Suppression of the immune response is what the drug is given for. No cited source demonstrates
      that it acts on this node in this disease; the target is inferred from the drug class.
    evidence:
    - reference: PMID:42649322
      reference_title: "Post-Infectious Cerebellitis: A Systematic Review of Aetiology, Clinical Presentation, Treatment, and Outcomes."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Post-infectious cerebellitis is a heterogeneous, largely immune-mediated syndrome with a
        generally favorable prognosis after corticosteroid-based immunotherapy, though outcomes
        and evidence quality vary by etiology and severity subgroup.
      explanation: >-
        The authors' own summary, and its own caveat about evidence quality. INDIRECT because
        recovery after a drug in an uncontrolled pooled series is one inference step from the drug
        acting on this node.
  evidence:
  - reference: PMID:42649322
    reference_title: "Post-Infectious Cerebellitis: A Systematic Review of Aetiology, Clinical Presentation, Treatment, and Outcomes."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Corticosteroids were the most common treatment (54/73, 74.0%), followed by antivirals (35/73,
      47.9%) and IVIG (19/73, 26.0%); plasma exchange was given for refractory cases.
    explanation: >-
      The treatment pattern across 73 pooled patients, and the source for the ordering of the rows
      in this block.
  - reference: PMID:28606112
    reference_title: "Acute cerebellitis in children: an eleven year retrospective multicentric study in Italy."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Treatment was decided independently case by case. Patients with a higher clinical score on
      admission had a higher probability of receiving intravenous steroids.
    explanation: >-
      The authors of a multicentre paediatric series report that children with a higher clinical
      score on admission were more likely to receive intravenous steroids, so an outcome comparison
      in it would be confounded by indication. This is why no outcome claim is attached to this row.
  - reference: PMID:28606112
    reference_title: "Acute cerebellitis in children: an eleven year retrospective multicentric study in Italy."
    supports: NO_EVIDENCE
    directness: UNKNOWN
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Randomized controlled trials are needed to confirm these observations.
    explanation: >-
      Kept on this row as NO_EVIDENCE rather than SUPPORT, because a call for trials does not support
      the treatment: it records that the evidence for it has not been gathered. The argument the
      sentence belongs to is in the knowledge-gap discussion, where it is also cited. No quote_role:
      a call for future work is neither this multicentre study's finding nor somebody else's fact.
  - reference: PMID:33454719
    reference_title: >-
      Pediatric Fulminant Cerebellitis Is Still a Fatal Disease that We Know Little About! Two Case
      Reports and a Literature Review.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The 2 patients received timely standard medical and surgical management for acute cerebellitis
      in the form of neuroprotective measures, osmotherapy, broad-spectrum antibiotics, and CSF
      diversion. One patient received aggressive immunomodulatory therapy and had a better outcome
      compared with the other patient who received no immunomodulatory therapy and had a poor
      outcome.
    explanation: >-
      Both children of this fulminant case report had standard medical and surgical management, and
      the one also given immunomodulatory therapy did better than the one who was not. This is the
      first treated-against-untreated contrast the description records. INDIRECT for this row: the
      abstract does not name the immunomodulatory therapy, so the contrast is not a result about
      corticosteroids as such. It is also two children, uncontrolled.
  - reference: PMID:37061090
    reference_title: >-
      Acute cerebellar ataxia during acute COVID-19: A case series and review of the literature.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One patient received therapy for acute cerebellar ataxia with corticosteroids, and others did
      not receive any specific therapy for acute cerebellar ataxia. The symptoms improved completely
      in all patients, with the recovery interval ranging from one week to two months.
    explanation: >-
      Six children whose ataxia began during acute COVID-19, three seen at the authors' centre and
      three from the literature: one was given corticosteroids and the others no specific treatment,
      and all recovered completely. This is the second treated-against-untreated contrast the
      description records. INDIRECT for this disease: onset during the infection puts these children
      at the border of this entry. It is also uncontrolled.

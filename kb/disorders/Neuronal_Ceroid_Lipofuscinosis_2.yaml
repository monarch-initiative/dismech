    reference_title: 'Clinical management and diagnosis of CLN2 disease: consensus of the Brazilian experts group.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Electroencephalogram, magnetic resonance imaging, molecular and biochemical testing are the main tools to investigate and confirm the diagnosis.
    explanation: Brazilian expert consensus defines EEG, MRI, and molecular/biochemical TPP1 testing as the core diagnostic workup for CLN2 disease.
  - reference: PMID:37059438
    reference_title: 'Clinical management and diagnosis of CLN2 disease: consensus of the Brazilian experts group.'

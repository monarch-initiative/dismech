  description: Diagnosis of CLN2 disease is suspected in children aged 2 to 4 years presenting with language delay and new-onset epilepsy, investigated with EEG (including photic stimulation) and brain MRI, and confirmed by identifying biallelic pathogenic variants in TPP1 alongside biochemical enzyme testing.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:

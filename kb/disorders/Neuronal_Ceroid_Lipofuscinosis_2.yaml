  downstream:
  - target: Seizure
    description: Cortical neuronal lysosomal storage and neurodegeneration manifest clinically with childhood-onset seizures.
  - target: Developmental regression
    description: Progressive neuronal loss across cerebral and cerebellar networks drives loss of previously acquired language and cognitive milestones.
  - target: Ataxia
    description: Cerebellar neuronal degeneration produces early and near-universal gait and limb ataxia.
  - target: Myoclonus
    description: Cortical and subcortical hyperexcitability from neuronal storage pathology causes prominent myoclonus.
  - target: Spasticity
    description: Progressive corticospinal tract degeneration leads to spasticity during the middle stage of CLN2 movement-disorder evolution.
  - target: Dystonia
    description: Basal ganglia and extrapyramidal circuit involvement produces dystonia in over half of patients.
  - target: Hypokinesia
    description: Advanced neurodegeneration progresses from early ataxia/myoclonus and mid-stage spasticity/dystonia to late-stage hypokinesia.
  - target: Motor deterioration
    description: Cumulative cerebellar, pyramidal, and extrapyramidal neurodegeneration causes relentless deterioration of motor function.

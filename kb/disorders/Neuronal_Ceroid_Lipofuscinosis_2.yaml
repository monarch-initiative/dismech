differential_diagnoses:
- name: Progressive Myoclonus Epilepsy
  description: Other childhood progressive myoclonus epilepsies and developmental and epileptic encephalopathies share early-childhood seizures, myoclonus, ataxia, and developmental regression, and are distinguished from CLN2 by deficient TPP1 enzyme activity and biallelic TPP1 variants.
  notes: Unanchored to a verbatim differential quote because the cached abstracts of PMID:20301601 and PMID:37059438 do not explicitly enumerate progressive myoclonus epilepsy differential entities.
  disease_term:
    preferred_term: progressive myoclonus epilepsy
    term:
      id: MONDO:0020074
      label: progressive myoclonus epilepsy
- name: Infantile Neuronal Ceroid Lipofuscinosis (CLN1 Disease)
  description: PPT1-related CLN1 disease shares lysosomal storage pathology, seizures, myoclonus, neurodevelopmental regression, and retinal degeneration, and is distinguished from CLN2 by deficient palmitoyl-protein thioesterase 1 (PPT1) activity, normal TPP1 activity, and biallelic PPT1 variants.
  notes: Unanchored to a verbatim differential quote because the cached abstracts of PMID:20301601 and PMID:33268510 do not contain a direct CLN1-versus-CLN2 differential comparison sentence.
  disease_term:
    preferred_term: neuronal ceroid lipofuscinosis 1
    term:
      id: MONDO:0009744
      label: neuronal ceroid lipofuscinosis 1
- name: Juvenile Neuronal Ceroid Lipofuscinosis (CLN3 Disease)
  description: CLN3 disease shares progressive retinal dystrophy/blindness, seizures, and cognitive/motor regression within the neuronal ceroid lipofuscinosis spectrum, and is distinguished from late-infantile CLN2 by juvenile onset, preserved TPP1 enzyme activity, and biallelic CLN3 variants.
  notes: Unanchored to a verbatim differential quote because the cached abstracts of PMID:20301601 and PMID:33268510 do not contain a direct CLN3-versus-CLN2 differential comparison sentence.
  disease_term:
    preferred_term: neuronal ceroid lipofuscinosis 3
    term:
      id: MONDO:0008767
      label: neuronal ceroid lipofuscinosis 3
treatments:
- name: Cerliponase alfa
  description: Intracerebroventricular recombinant human TPP1 enzyme replacement is a disease-targeted therapy for CLN2 that slows motor-language decline. It does not fully halt neurologic disease and does not prevent retinopathy.
  treatment_term:
    preferred_term: enzyme replacement therapy
    term:
      id: NCIT:C16221
      label: Protein Replacement Therapy
  target_mechanisms:
  - target: TPP1 lysosomal peptidase deficiency
    treatment_effect: RESTORES
    description: Cerliponase alfa replaces deficient TPP1 enzyme activity in the CNS, targeting the upstream lysosomal enzyme defect.
    evidence:
    - reference: PMID:31884868
      reference_title: 'Review of Cerliponase Alfa: Recombinant Human Enzyme Replacement Therapy for Late-Infantile Neuronal Ceroid Lipofuscinosis Type 2.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Cerliponase alfa is recombinant human tripeptidyl peptidase 1 enzyme replacement therapy.
      explanation: This identifies cerliponase alfa as recombinant TPP1 enzyme replacement.
  evidence:
  - reference: PMID:31884868
    reference_title: 'Review of Cerliponase Alfa: Recombinant Human Enzyme Replacement Therapy for Late-Infantile Neuronal Ceroid Lipofuscinosis Type 2.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Treatment with intracerebroventricular cerliponase alfa resulted in slower decline of motor and language functions compared with natural history controls.
    explanation: Clinical evidence supports cerliponase alfa as disease-targeted therapy that slows functional decline in CLN2.
- name: AAVrh.10hCLN2 gene therapy
  description: Direct CNS AAVrh.10hCLN2 administration is an investigational gene-therapy strategy that increased CSF TPP1 and slowed motor-language decline in a small nonrandomized clinical trial.
  therapeutic_modality: GENE_THERAPY
  treatment_term:
    preferred_term: gene therapy
    term:
      id: NCIT:C15238
      label: Gene Therapy
  evidence:
  - reference: PMID:33268510
    reference_title: Slowing late infantile Batten disease by direct brain parenchymal administration of a rh.10 adeno-associated virus expressing CLN2.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Intraparenchymal brain administration of AAVrh.10hCLN2 slowed the progression of disease in children with CLN2 disease.
    explanation: A small nonrandomized trial supports AAVrh.10hCLN2 as an investigational disease-targeted strategy, but not established care.

name: Escherichia coli meningitis
creation_date: "2026-09-30T03:26:55Z"
description: >-
  Escherichia coli meningitis is neonatal-predominant Gram-negative bacterial
  meningitis caused chiefly by invasive, often K1-encapsulated E. coli
  lineages that enter neonatal blood from maternal or nosocomial sources, use
  serum resistance to sustain bacteremia, invade brain microvascular
  endothelium through OmpA-, CNF1-, and IbeA-linked receptor pathways, seed
  cerebrospinal fluid, and provoke neutrophilic meningeal inflammation with
  endothelial death, blood-brain-barrier disruption, and neonatal brain injury.
category: Infectious Disease
disease_term:
  preferred_term: Escherichia coli meningitis
  term:
    id: MONDO:0006753
    label: Escherichia coli meningitis
parents:
- Bacterial meningitis
synonyms:
- E. coli meningitis
- Escherichia coli bacterial meningitis
- neonatal meningitis Escherichia coli
- NMEC meningitis
infectious_agent:
- name: Escherichia coli
  infectious_agent_term:
    preferred_term: Escherichia coli
    term:
      id: NCBITaxon:562
      label: Escherichia coli
  description: >-
    E. coli K1 and related extraintestinal E. coli lineages are
    Enterobacterales that dominate neonatal Gram-negative bacterial meningitis
    and include B2 phylogroup, K1-encapsulated strains among early-onset sepsis
    and meningitis isolates.
  evidence:
  - reference: PMID:36709579
    reference_title: A high-throughput sequencing approach identifies immunotherapeutic targets for bacterial meningitis in neonates.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Worldwide, Escherichia coli is the leading cause of neonatal Gram-negative
      bacterial meningitis, but full understanding of the pathogenesis of this
      disease is not yet achieved.
    explanation: >-
      Identifies E. coli as the leading neonatal Gram-negative
      bacterial-meningitis agent.
  - reference: PMID:26407251
    reference_title: "Emergence of Antibiotic Resistance-Associated Clones Among Escherichia coli Recovered From Newborns With Early-Onset Sepsis and Meningitis in the United States, 2008-2009."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among 28 E coli strains, phylogroup B2 strains predominated (68%), of
      which more than half were K1-encapsulated (53%).
    explanation: >-
      A US neonatal early-onset sepsis and meningitis isolate collection shows
      enrichment for B2 and K1 lineages among invasive neonatal E. coli strains.
agent_life_cycle:
  description: >-
    NMEC is a human-associated extraintestinal E. coli pathotype that reaches
    neonates from maternal flora during delivery or from nosocomial exposures,
    survives in neonatal blood, and then invades the cerebrospinal-fluid
    compartment across the blood-brain barrier.
  hosts:
  - preferred_term: Homo sapiens
    role: reservoir and neonatal clinical host
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  evidence:
  - reference: PMID:26407066
    reference_title: Serotype O18 avian pathogenic and neonatal meningitis Escherichia coli strains employ similar pathogenic strategies for the onset of meningitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Neonatal meningitis Escherichia coli K1 (NMEC) are thought to be
      transmitted from mothers to newborns during delivery or by nosocomial
      infections.
    explanation: >-
      Supports maternal delivery and nosocomial acquisition as the recognized
      neonatal entry branches for NMEC.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Maternal or nosocomial NMEC acquisition
  description: >-
    Neonates acquire NMEC from maternal flora during delivery or from
    healthcare-associated sources before an invasive lineage reaches blood and
    cerebrospinal fluid.
  evidence:
  - reference: PMID:26407066
    reference_title: Serotype O18 avian pathogenic and neonatal meningitis Escherichia coli strains employ similar pathogenic strategies for the onset of meningitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Neonatal meningitis Escherichia coli K1 (NMEC) are thought to be
      transmitted from mothers to newborns during delivery or by nosocomial
      infections.
    explanation: >-
      Establishes the maternal-neonatal and hospital-associated exposure routes
      that precede NMEC bacteremia.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Neonatal E. coli meningitis carries 12% (term) to 18% (preterm) mortality
    and frequent neurosensorial and neurodevelopmental sequelae among survivors.
  evidence:
  - reference: PMID:23178136
    reference_title: "[Therapeutic strategies for Escherichia coli neonatal meningitis]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      neonatal meningitis is poor with 12% (term infant) to 18% (premature
      infant) mortality rates.
    explanation: >-
      Reports the high mortality of neonatal E. coli meningitis, supporting a
      HIGH disease-level burden.
pathophysiology:
- name: Maternal or Nosocomial NMEC Acquisition
  role: trigger
  description: >-
    A neonatal meningitis E. coli strain reaches the newborn host through
    maternal or hospital-associated exposure.
  biological_scale: ORGANISM
  downstream:
  - target: K1 and O18 Serum Resistance
    causal_link_type: DIRECT
    description: >-
      Bacteria that reach a neonatal barrier site must survive serum complement
      to expand in blood.
  evidence:
  - reference: PMID:26407066
    reference_title: Serotype O18 avian pathogenic and neonatal meningitis Escherichia coli strains employ similar pathogenic strategies for the onset of meningitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Neonatal meningitis Escherichia coli K1 (NMEC) are thought to be
      transmitted from mothers to newborns during delivery or by nosocomial
      infections.
    explanation: >-
      Supports the acquisition step used to seed the invasive neonatal disease
      path.
- name: K1 and O18 Serum Resistance
  description: >-
    O18:K1 organisms use the sialylated K1 capsule and O18
    lipopolysaccharide-repeat shielding to restrict antibody-independent
    classical-complement activation and K1-driven alternative-complement
    activation.
  biological_scale: CELLULAR
  downstream:
  - target: High-Grade Neonatal E. coli Bacteremia
    causal_link_type: DIRECT
    description: >-
      Serum-resistant organisms persist in blood long enough to amplify and
      reach the neonatal blood-brain barrier.
  evidence:
  - reference: PMID:6196296
    reference_title: Role of the capsule and the O antigen in resistance of O18:K1 Escherichia coli to complement-mediated killing.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      the K1 sialic acid polysaccharide impedes the activation of, and thus
      protects the bacteria against, the alternative complement pathway.
    explanation: >-
      Demonstrates a direct K1-capsule mechanism for complement resistance in
      neonatal meningitis-associated O18:K1 E. coli.
- name: High-Grade Neonatal E. coli Bacteremia
  description: >-
    Complement-resistant O18:K1 and related strains multiply in neonatal blood,
    generating the sustained bacteremia required for blood-brain-barrier
    invasion.
  biological_scale: ORGANISM
  downstream:
  - target: OmpA- and CNF1-Driven HBMEC Invasion Signaling
    causal_link_type: DIRECT
    description: >-
      Bloodborne organisms engage endothelial OmpA-Ecgp96 and CNF1-37LRP
      receptors to initiate barrier invasion.
  - target: IbeA-Vimentin HBMEC Invasion Signaling
    causal_link_type: DIRECT
    description: >-
      Bloodborne IbeA+ organisms engage endothelial vimentin to invade the
      barrier.
  - target: Low-Iron CsiR/IlvB HBMEC Invasion Signaling
    causal_link_type: DIRECT
    description: >-
      Low-iron blood conditions activate the CsiR/IlvB endothelial invasion
      route.
  - target: Fever
    causal_link_type: DIRECT
    description: >-
      Sustained high-grade bacteremia produces systemic fever.
  evidence:
  - reference: PMID:6196296
    reference_title: Role of the capsule and the O antigen in resistance of O18:K1 Escherichia coli to complement-mediated killing.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Epidemiological data show that O18:K1 Escherichia coli is a common cause
      of neonatal bacteremia and meningitis.
    explanation: >-
      Links O18:K1 strains to the bacteremic neonatal disease stage.
- name: OmpA- and CNF1-Driven HBMEC Invasion Signaling
  description: >-
    NMEC OmpA engages Ecgp96 to activate PI3K and CNF1 engages 37LRP to activate
    RhoA in human brain microvascular endothelial cells, driving the actin
    remodeling that initiates blood-brain-barrier invasion.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: brain microvascular endothelial cell
    term:
      id: CL:2000044
      label: brain microvascular endothelial cell
  biological_processes:
  - preferred_term: Rho protein signal transduction
    term:
      id: GO:0007266
      label: Rho protein signal transduction
    modifier: INCREASED
  locations:
  - preferred_term: blood-brain barrier
    term:
      id: UBERON:0000120
      label: blood brain barrier
  downstream:
  - target: E. coli Transcytosis Into CSF
    causal_link_type: DIRECT
    description: >-
      Infected endothelial cells internalize and translocate organisms across
      the blood-brain barrier toward cerebrospinal fluid.
  - target: RIPK1-Linked BMEC Death
    causal_link_type: DIRECT
    description: >-
      RS218 infection of brain microvascular endothelial cells assembles the
      Ripoptosome death complex.
  evidence:
  - reference: PMID:12860457
    reference_title: Outer membrane protein A and cytotoxic necrotizing factor-1 use diverse signaling mechanisms for Escherichia coli K1 invasion of human brain microvascular endothelial cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      OmpA treatment of human BMEC resulted in phosphatidylinositol 3-kinase
      (PI3K) activation with no effect on RhoA, while CNF1 treatment resulted
      in RhoA activation with no effect on PI3K, supporting the concept that
      OmpA and CNF1 contribute to E. coli K1 invasion of BMEC using different
      mechanisms.
    explanation: >-
      Places OmpA and CNF1 on separate PI3K and RhoA host-signaling arms during
      human brain endothelial invasion.
- name: IbeA-Vimentin HBMEC Invasion Signaling
  description: >-
    IbeA engages the endothelial surface receptor vimentin to activate ERK
    signaling from membrane rafts, a parallel route of human brain microvascular
    endothelial cell invasion.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: brain microvascular endothelial cell
    term:
      id: CL:2000044
      label: brain microvascular endothelial cell
  locations:
  - preferred_term: blood-brain barrier
    term:
      id: UBERON:0000120
      label: blood brain barrier
  downstream:
  - target: E. coli Transcytosis Into CSF
    causal_link_type: DIRECT
    description: >-
      Vimentin-dependent invasion contributes to translocation of organisms
      across the barrier toward cerebrospinal fluid.
  evidence:
  - reference: PMID:20088823
    reference_title: Vimentin-mediated signalling is required for IbeA+ E. coli K1 invasion of human brain microvascular endothelial cells.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      vimentin is a primary receptor required for IbeA+ E. coli K1-induced
      signalling and invasion of HBMECs
    explanation: >-
      Identifies vimentin as the endothelial receptor branch used by IbeA+
      meningitic E. coli.
- name: Low-Iron CsiR/IlvB HBMEC Invasion Signaling
  description: >-
    Under the low-iron conditions of blood, the CsiR/IlvB pathway activates
    endothelial FAK/PI3K signaling and actin cytoskeleton rearrangement to
    promote NMEC invasion and penetration of the blood-brain barrier.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: brain microvascular endothelial cell
    term:
      id: CL:2000044
      label: brain microvascular endothelial cell
  biological_processes:
  - preferred_term: actin cytoskeleton organization
    term:
      id: GO:0030036
      label: actin cytoskeleton organization
    modifier: INCREASED
  locations:
  - preferred_term: blood-brain barrier
    term:
      id: UBERON:0000120
      label: blood brain barrier
  downstream:
  - target: E. coli Transcytosis Into CSF
    causal_link_type: DIRECT
    description: >-
      Low-iron-induced FAK/PI3K signaling and actin remodeling promote
      penetration of the barrier toward cerebrospinal fluid.
  evidence:
  - reference: PMID:38531686
    reference_title: CsiR-Mediated Signal Transduction Pathway in Response to Low Iron Conditions Promotes Escherichia coli K1 Invasion and Penetration of the Blood-Brain Barrier.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      IlvB activated the FAK/PI3K pathway of HBMECs to induce actin
      cytoskeleton rearrangements, thereby promoting the bacterial invasion and
      penetration of the BBB.
    explanation: >-
      Adds the low-iron CsiR/IlvB virulence pathway that uses endothelial
      FAK/PI3K and actin remodeling to promote barrier penetration.
- name: E. coli Transcytosis Into CSF
  description: >-
    OmpA-Ecgp96, CNF1-37LRP, IbeA-vimentin, and other endothelial-entry
    pathways allow NMEC to cross the blood-brain barrier by receptor- and
    actin-dependent transcytosis and enter the cerebrospinal-fluid compartment.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: transcytosis
    term:
      id: GO:0045056
      label: transcytosis
    modifier: INCREASED
  locations:
  - preferred_term: cerebrospinal fluid
    term:
      id: UBERON:0001359
      label: cerebrospinal fluid
  downstream:
  - target: E. coli CSF Replication
    causal_link_type: DIRECT
    description: >-
      Barrier crossing places organisms in the cerebrospinal-fluid compartment
      that supports bacterial replication.
  evidence:
  - reference: PMID:24932957
    reference_title: Identification of minimum carbohydrate moiety in N-glycosylation sites of brain endothelial cell glycoprotein 96 for interaction with Escherichia coli K1 outer membrane protein A.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Outer membrane protein A (OmpA) of E. coli K1 is a major virulence factor
      in the pathogenesis of meningitis, and interacts with human brain
      microvascular endothelial cells (HBMEC) to cross the blood-brain barrier.
    explanation: >-
      Supports OmpA-Ecgp96 interaction as one route by which E. coli K1 crosses
      endothelial cells at the blood-brain barrier.
  - reference: PMID:26407066
    reference_title: Serotype O18 avian pathogenic and neonatal meningitis Escherichia coli strains employ similar pathogenic strategies for the onset of meningitis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      APEC and NMEC strains induce meningitis in newborn mice with varying
      degree of pathology in the brains as assessed by neutrophil recruitment
      and neuronal apoptosis.
    explanation: >-
      Demonstrates that O18 avian and neonatal meningitis E. coli strains can
      reach the neonatal mouse CNS and produce meningitis pathology.
- name: E. coli CSF Replication
  description: >-
    E. coli expands after entry into cerebrospinal fluid, increasing the local
    bacterial burden that exposes the subarachnoid and ventricular spaces to
    Gram-negative bacterial inflammatory products.
  biological_scale: ORGANISM
  locations:
  - preferred_term: cerebrospinal fluid
    term:
      id: UBERON:0001359
      label: cerebrospinal fluid
  - preferred_term: subarachnoid space
    term:
      id: UBERON:0000315
      label: subarachnoid space
  downstream:
  - target: IbeA-Driven PMN Transmigration
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Endothelial infection and CSF bacterial products stimulate leukocyte
      trafficking across brain endothelial cells.
  evidence:
  - reference: PMID:30188499
    reference_title: Mesenchymal stem cells transplantation attenuates brain injury and enhances bacterial clearance in Escherichia coli meningitis in newborn rats.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Meningitis modeling induced robust proliferation of E. coli in the
      cerebrospinal fluid and increased mortality in rat pups, and MSC
      transplantation significantly reduced this bacterial growth and the
      mortality rate.
    explanation: >-
      The newborn-rat model directly measures E. coli expansion in CSF after
      intraventricular meningitis induction.
- name: IbeA-Driven PMN Transmigration
  description: >-
    IbeA-vimentin signaling across infected brain endothelial cells promotes
    NF-kappaB-linked adhesion-molecule expression and neutrophil
    transendothelial migration at the blood-brain barrier.
  biological_scale: TISSUE
  cell_types:

- name: RIPK1-Linked BMEC Death
  description: >-
    NMEC infection of brain microvascular endothelial cells activates the
    RIPK1-containing Ripoptosome and coordinated apoptotic, pyroptotic, and
    necroptotic death pathways, disrupting blood-brain-barrier integrity and
    augmenting neuroinflammation.
  biological_scale: TISSUE

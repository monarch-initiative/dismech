  evidence:
  - reference: PMID:30188499
    reference_title: Mesenchymal stem cells transplantation attenuates brain injury and enhances bacterial clearance in Escherichia coli meningitis in newborn rats.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Intraventricular transplantation of hUCB-MSCs significantly improved
      survival and attenuated the brain injury via anti-inflammatory and

diagnosis:
- name: Blood and CSF Culture Diagnosis
  description: >-
    Early-onset E. coli meningitis is diagnosed by isolating pathogenic E. coli
    from blood and/or cerebrospinal-fluid culture during the neonatal sepsis
    window, followed by susceptibility testing to distinguish ampicillin-,
    third-generation-cephalosporin-, or multidrug-resistant lineages.
  evidence:
  - reference: PMID:35902218
    reference_title: "Early-onset neonatal sepsis in the Paris area: a population-based surveillance study from 2019 to 2021."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      isolation of pathogenic species from blood culture and/or cerebrospinal
      fluid culture
    explanation: >-
      This neonatal surveillance definition ties early-onset sepsis and
      meningitis ascertainment to recovery of organisms from blood or CSF.
  - reference: PMID:26407251
    reference_title: "Emergence of Antibiotic Resistance-Associated Clones Among Escherichia coli Recovered From Newborns With Early-Onset Sepsis and Meningitis in the United States, 2008-2009."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Across the strain collection, the rate of ampicillin resistance was high
      (78%).
    explanation: >-
      Supports routine susceptibility interpretation for neonatal E. coli
      isolates because ampicillin resistance is common.
- name: Cerebrospinal fluid analysis
  description: >-
    Beyond culture, CSF analysis supports the diagnosis of bacterial meningitis,
    with elevated CSF protein and low CSF glucose (hypoglycorrhachia).
  evidence:
  - reference: PMID:29384979
    reference_title: Clinical Characteristics and Risk Factors for Poor Outcome in Infants Less Than 90 Days of Age With Bacterial Meningitis in the United Kingdom and Ireland.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      cerebrospinal fluid protein greater than the median concentration
    explanation: >-
      Elevated CSF protein is a diagnostic and prognostic feature of infant
      bacterial meningitis.
  - reference: PMID:23178136
    reference_title: "[Therapeutic strategies for Escherichia coli neonatal meningitis]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Main risk factors are hemodynamic failure, apnea, seizures, hypoglycorachia
      and abnormal EEG.
    explanation: >-
      Names hypoglycorrhachia (low CSF glucose) among the features of severe
      neonatal E. coli meningitis.
treatments:
- name: Early Cefotaxime-Based Antimicrobial Therapy
  description: >-
    Neonatal E. coli meningitis requires rapid antimicrobial therapy centered
    on a third-generation cephalosporin such as cefotaxime, with adjunctive
    ciprofloxacin considered in some regimens rather than ampicillin
    monotherapy.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: cefotaxime
      term:
        id: CHEBI:204928
        label: cefotaxime
    - preferred_term: ciprofloxacin
      term:
        id: CHEBI:100241
        label: ciprofloxacin
  target_mechanisms:
  - target: E. coli CSF Replication
    treatment_effect: INHIBITS
    description: >-
      Bactericidal antibacterial therapy blocks continuing E. coli expansion in
      CSF after organism identification.
  evidence:
  - reference: PMID:23178136
    reference_title: "[Therapeutic strategies for Escherichia coli neonatal meningitis]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Antibiotics must be started as soon as possible with a third generation
      cephalosporin (3GC).
    explanation: >-
      Review guidance supports urgent antimicrobial therapy for E. coli
      neonatal meningitis using a third-generation cephalosporin backbone.
  - reference: PMID:23178136
    reference_title: "[Therapeutic strategies for Escherichia coli neonatal meningitis]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Cefotaxime is the most largely 3GC used with good tolerance and the most
      appropriate Pk/PD parameters, frequently in association with
      ciprofloxacin.
    explanation: >-
      Identifies cefotaxime, often combined with ciprofloxacin, as the
      third-generation cephalosporin strategy emphasized for neonatal E. coli
      meningitis.
- name: Meropenem for Third-Generation Cephalosporin Resistance
  description: >-
    Carbapenem therapy is used when confirmed Gram-negative bacilli or E. coli
    meningitis is resistant to third-generation cephalosporins.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: meropenem
      term:
        id: CHEBI:43968
        label: meropenem
  target_mechanisms:
  - target: E. coli CSF Replication
    treatment_effect: INHIBITS
    description: >-
      Meropenem is substituted to kill CSF bacteria when the infecting isolate
      resists third-generation cephalosporins.
  evidence:
  - reference: PMID:23178136
    reference_title: "[Therapeutic strategies for Escherichia coli neonatal meningitis]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      switch cephalosporin with meropenem in neonates with confirmed gram
      negative bacilli or 3GC-resistant E. coli meningitis.
    explanation: >-
      Supports meropenem substitution when Gram-negative neonatal meningitis is
      confirmed to be third-generation-cephalosporin resistant.
progression:
- phase: Early-onset disease
  notes: >-
    Vertically acquired disease presenting within the first 72 hours of life.
- phase: Late-onset disease
  notes: >-
    Disease presenting after 72 hours, often nosocomially acquired.
- phase: Acute CNS complications
  notes: >-
    Cerebral abscess, ventriculitis and ischaemo-haemorrhagic lesions during the
    acute illness.
- phase: Long-term sequelae
  notes: >-
    Neurosensorial and neurodevelopmental impairment among survivors.
animal_models:
- name: Neonatal mouse E. coli K1 PNAG immunization model
  species: Mouse
  publication: PMID:36709579
  description: >-
    Neonatal mice infected with E. coli K1 model systemic dissemination and
    brain infection for TnSeq virulence screening and passive or active PNAG
    immunization experiments.
  modeled_mechanisms:
  - target: High-Grade Neonatal E. coli Bacteremia
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      The model requires E. coli K1 factors needed for systemic dissemination
      before brain infection and can test antibody-mediated PNAG protection.
    limitations: >-
      The system uses experimentally infected neonatal mice, so it does not
      reproduce natural human maternal delivery or nosocomial acquisition.
    evidence:
    - reference: PMID:36709579
      reference_title: A high-throughput sequencing approach identifies immunotherapeutic targets for bacterial meningitis in neonates.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We showed that both passive and active immunization successfully
        prevented and/or treated meningitis caused by E. coli K1 in neonatal
        mice.
      explanation: >-
        Demonstrates that the neonatal mouse model supports both E. coli K1
        infection and immunization rescue experiments.
- name: Newborn rat intraventricular E. coli meningitis model
  species: Rat
  publication: PMID:30188499
  description: >-
    Postnatal-day-11 rats receiving intraventricular E. coli develop isolated
    CSF infection, mortality, ventricular dilatation, reactive gliosis, and
    sensorimotor injury that can be modified by intraventricular hUCB-MSC
    transplantation.
  modeled_mechanisms:
  - target: Neonatal Neuroinflammation and Brain Injury
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Direct ventricular inoculation isolates CSF replication and inflammatory
      neonatal brain injury from the antecedent bacteremia and barrier-crossing
      phases.
    limitations: >-
      The model bypasses maternal acquisition, bacteremia, and natural
      blood-brain-barrier invasion by injecting bacteria directly into the
      ventricle.
    evidence:
    - reference: PMID:30188499
      reference_title: Mesenchymal stem cells transplantation attenuates brain injury and enhances bacterial clearance in Escherichia coli meningitis in newborn rats.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Meningitis without concomitant bacteremia was induced by
        intraventricular injection
      explanation: >-
        Defines the newborn-rat model as a direct ventricular E. coli
        meningitis system without concomitant bacteremia.

      label: apoptotic process
    modifier: INCREASED
  - preferred_term: necroptotic process
    term:
      id: GO:0070266
      label: necroptotic process
    modifier: INCREASED
  - preferred_term: pyroptotic inflammatory response
    term:
      id: GO:0070269
      label: pyroptotic inflammatory response
    modifier: INCREASED
  locations:
  - preferred_term: blood-brain barrier
    term:
      id: UBERON:0000120
      label: blood brain barrier
  downstream:
  - target: Neonatal Neuroinflammation and Brain Injury
    causal_link_type: DIRECT
    description: >-
      Barrier disruption allows bacterial invasion and inflammatory injury to
      spread into neonatal brain tissue.
  evidence:
  - reference: PMID:40774959
    reference_title: RIPK1 kinase drove brain microvascular endothelial cells death and blood-brain barrier disruption in neonatal Escherichia coli meningitis.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The study reveals that RS218 infection promotes assembly of the
      Ripoptosome complex. This leads to the coordinated activation of
      apoptosis, pyroptosis, and necroptosis.
    explanation: >-
      Places the RIPK1-containing Ripoptosome upstream of combined cell-death
      modes in brain endothelial cells during neonatal E. coli meningitis.
  - reference: PMID:40774959
    reference_title: RIPK1 kinase drove brain microvascular endothelial cells death and blood-brain barrier disruption in neonatal Escherichia coli meningitis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Inhibition of RIPK1 kinase significantly preserves BBB integrity, and
      lowers RS218 invasion and neuroinflammation.
    explanation: >-
      RIPK1 inhibition links the kinase activity mechanistically to barrier
      breakdown, bacterial invasion, and neuroinflammation in the neonatal
      mouse model.
- name: Neonatal Neuroinflammation and Brain Injury
  description: >-
    Replicating NMEC, PMN influx, barrier disruption, and endothelial cell death
    converge on acute Gram-negative inflammation of the meninges and neonatal

phenotypes:
- name: Fever
  description: Fever is a common presentation in infant bacterial meningitis cohorts that include neonatal E. coli cases.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  evidence:
  - reference: PMID:29384979
    reference_title: Clinical Characteristics and Risk Factors for Poor Outcome in Infants Less Than 90 Days of Age With Bacterial Meningitis in the United Kingdom and Ireland.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fever was reported in 143 (54%), seizures in 73 (28%), bulging fontanelle
      in 58 (22%), coma in 15 (6%) and neck stiffness in 7 (3%).
    explanation: >-
      Fever was reported in 54% of infants under 90 days with bacterial
      meningitis, a neonatal-predominant cohort that includes E. coli cases.

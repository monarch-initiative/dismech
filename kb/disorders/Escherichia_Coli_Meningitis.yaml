  - target: Brain abscess
    description: >-
      Focal suppuration in the neonatal brain produces cerebral abscess.
  - target: Ventriculitis
    description: >-
      Spread of infection to the ventricular lining produces ventriculitis.
  - target: Ischemo-haemorrhagic cerebral lesions
    description: >-
      Barrier injury and vascular compromise produce ischaemo-haemorrhagic

      label: canonical NF-kappaB signal transduction
    modifier: INCREASED
  locations:
  - preferred_term: blood-brain barrier
    term:
      id: UBERON:0000120
      label: blood brain barrier
  downstream:
  - target: Neonatal Neuroinflammation and Brain Injury
    causal_link_type: DIRECT
    description: >-
      Neutrophil influx amplifies cytokine release and brain injury in the

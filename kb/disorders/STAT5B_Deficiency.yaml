treatments:
- name: Recombinant Human IGF-1 (Mecasermin)
  description: >-
    Recombinant IGF-1 bypasses the GH receptor-STAT5B defect and is the
    growth-directed therapy. In three siblings it raised height velocity over
    the first three years, but the response was smaller than in other forms of
    severe primary IGF-I deficiency, and hypoglycemia limited dosing in one
    child. An earlier report found no meaningful response in a chronically ill
    patient. It does not address the immune defect.
  therapeutic_modality: PROTEIN_REPLACEMENT
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: mecasermin
      term:
        id: CHEBI:749581
        label: mecasermin
  target_mechanisms:
  - target: Impaired GH-Induced IGF-1 Production
    treatment_effect: BYPASSES
    description: >-
      Exogenous IGF-1 replaces the hormone that GH can no longer induce.
    evidence:
    - reference: PMID:37586336
      reference_title: "Recombinant Human Insulin-Like Growth Factor-1 Treatment of Severe Growth Failure in Three Siblings with STAT5B Deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "With rhIGF-1 therapy, HVs increased to 5.2-6.0, 4.8-7.1, and 5.5-7.4 cm/year, respectively, in the first 3 years of treatment"
      explanation: Height velocity rose on rhIGF-1 in all three siblings.
  evidence:
  - reference: PMID:37586336
    reference_title: "Recombinant Human Insulin-Like Growth Factor-1 Treatment of Severe Growth Failure in Three Siblings with STAT5B Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The response to rhIGF-1 therapy is less than observed with rhIGF-1 therapy for patients previously described with severe primary IGF-I deficiency, including patients with documented defects in the growth hormone receptor, but may still provide patients with STAT5B deficiency with an opportunity to prevent worsening growth failure."
    explanation: >-
      rhIGF-1 is beneficial but less effective than in GH receptor defects.
  - reference: PMID:37586336
    reference_title: "Recombinant Human Insulin-Like Growth Factor-1 Treatment of Severe Growth Failure in Three Siblings with STAT5B Deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "P3 also experienced hypoglycemia that limited our ability to maintain target rhIGF-1 dosing."
    explanation: Hypoglycemia is a dose-limiting adverse effect.
  - reference: PMID:20538865
    reference_title: "A novel STAT5B mutation causing GH insensitivity syndrome associated with hyperprolactinemia and immune dysfunction in two male siblings."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "he did not present any significant change in his growth velocity (from 2.3 to 3.0 cm/year after 1.5 years of therapy)"
    explanation: >-
      One treated patient showed no significant growth response, which the
      authors attributed possibly to chronic illness.

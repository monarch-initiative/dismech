animal_models:
- name: Stat5b knockout mouse
  species: Mouse
  genotype: Stat5b(-/-)
  publication: PMID:9207075
  description: >-
    Targeted Stat5b disruption produces dwarfism with elevated GH and low
    IGF-I resembling Laron-type GH resistance, loss of male-pattern growth and
    liver gene expression, and a marked NK cell proliferation and cytotoxicity
    defect.
  modeled_mechanisms:
  - target: Impaired GH-Induced IGF-1 Production
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Knockout mice are GH-resistant with elevated GH and low IGF-I.
    limitations: >-
      The growth defect is largely confined to males (loss of sexually
      dimorphic growth), and IGF-I falls only partially, because mouse Stat5a
      partially compensates; in humans STAT5A does not compensate and IGF
      deficiency is profound in both sexes.
    divergences:
    - divergence_type: SPECIES_MISMATCH
      materiality: QUALIFYING
      description: >-
        Mouse Stat5a partly substitutes for Stat5b in GH signalling, so the
        knockout under-represents the human IGF-I deficiency and spares
        females, whereas human STAT5A cannot substitute.
    evidence:
    - reference: PMID:9207075
      reference_title: "Requirement of STAT5b for sexual dimorphism of body growth rates and liver gene expression."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Indeed, the dwarfism, elevated plasma GH, low plasma insulin-like growth factor I, and development of obesity seen in STAT5b-/- mice are all characteristics of Laron-type dwarfism"
      explanation: The knockout reproduces the GH-resistant IGF-I deficiency.
    - reference: PMID:26703237
      reference_title: "STAT5B deficiency: Impacts on human growth and immunity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: "suggested that, in mice, Stat5a can partially compensate for loss of Stat5b"
      explanation: Explains why the mouse growth phenotype is milder than the human one.
  - target: NK Cell Maturation and Cytotoxicity Defect
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: CELLULAR
    description: >-
      Stat5b-deficient mice have fewer, poorly responsive NK cells with
      greatly diminished cytolytic activity.
    evidence:
    - reference: PMID:9841920
      reference_title: "Stat5b is essential for natural killer cell-mediated proliferation and cytolytic activity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These data indicate an essential nonredundant role for Stat5b for potent NK cell-mediated proliferation and cytolytic activity."
      explanation: The knockout has the NK defect later found in patients.
  evidence:
  - reference: PMID:9207075
    reference_title: "Requirement of STAT5b for sexual dimorphism of body growth rates and liver gene expression."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Although these responses are similar to those observed in GH-deficient Little mice, STAT5b-/- mice are not GH-deficient, suggesting that they may be GH pulse-resistant."
    explanation: The knockout is GH-resistant rather than GH-deficient, like the human disease.

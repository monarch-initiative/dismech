name: STAT5B Deficiency
creation_date: "2026-09-24T16:22:46Z"
category: Mendelian
description: >-
  Autosomal recessive STAT5B deficiency is a post-receptor form of growth
  hormone insensitivity combined with a primary immune dysregulation disorder.
  Biallelic loss-of-function variants in STAT5B remove the transcription factor
  that the GH receptor-JAK2 complex uses to induce IGF1, so patients have
  normal or elevated GH with very low IGF-1, IGFBP-3 and acid-labile subunit,
  severe postnatal growth failure that phenocopies Laron syndrome, and no growth
  response to recombinant GH. Because STAT5B also carries IL-2 receptor
  signalling in lymphocytes, the same lesion depletes FOXP3+ regulatory T cells
  and impairs NK cell maturation and cytotoxicity. The immune arm presents as
  severe eczema, autoimmunity, hypergammaglobulinemia and elevated IgE, T-cell
  lymphopenia, recurrent and opportunistic infections, and chronic pulmonary
  disease that can progress through lymphocytic interstitial pneumonia to fatal
  pulmonary fibrosis. Hyperprolactinemia is a recurrent endocrine finding whose
  mechanism is unresolved. Recombinant IGF-1 is the growth therapy, with a
  smaller response than in GH receptor defects; no single therapy corrects both
  growth and immunity.
disease_term:
  preferred_term: growth hormone insensitivity with immune dysregulation 1, autosomal recessive
  term:
    id: MONDO:0100211
    label: growth hormone insensitivity with immune dysregulation 1, autosomal recessive
synonyms:
- STAT5B deficiency, autosomal recessive
- growth hormone insensitivity with immunodeficiency
- short stature due to STAT5b deficiency
- growth hormone insensitivity due to postreceptor defect
- Laron syndrome with immunodeficiency
parents:
- Growth Hormone Insensitivity Syndrome
notes: >-
  This entry is the dedicated home for the autosomal recessive STAT5B arm of
  growth hormone insensitivity syndrome. The Growth_Hormone_Insensitivity_Syndrome
  entry carries a STAT5B Deficiency subtype scoped to what distinguishes it
  from the GHR, IGFALS, IGF1 and IGF1R arms, and names this concept
  (MONDO:0100211) as the intended home for the immunologic detail; the two are
  meant to be read together. Heterozygous dominant-negative STAT5B variants
  (growth hormone insensitivity with immune dysregulation 2, autosomal
  dominant; OMIM 604260) are a separate MONDO concept with milder growth
  failure, eczema and elevated IgE but without the severe immune and pulmonary
  disease, and are deliberately not merged here. Somatic activating STAT5B
  variants in T-cell and myeloid neoplasms are unrelated to this germline
  loss-of-function disease. Hematopoietic stem cell transplantation has been
  proposed for the T-cell defect in reviews, but no outcome data were found, so
  it is not recorded as a treatment.
inheritance:
- name: Autosomal Recessive
  description: >-
    Homozygous loss-of-function STAT5B variants, usually in consanguineous
    families. Heterozygous carriers of these recessive alleles are of normal
    height and without immune or pulmonary disease, which distinguishes this
    disorder from the dominant-negative heterozygous form.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:17389811
    reference_title: "Growth hormone insensitivity and severe short stature in siblings: a novel mutation at the exon 13-intron 13 junction of the STAT5b gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the first STAT5b defect to be identified in siblings, further supporting the autosomal recessive mode of transmission of STAT5b deficiency."
    explanation: >-
      Affected siblings with a homozygous STAT5B variant and heterozygous
      parents of normal height support recessive transmission.
  - reference: PMID:29844444
    reference_title: "Dominant-negative STAT5B mutations cause growth hormone insensitivity with short stature and mild immune dysregulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "One copy of wild-type (WT) STAT5B allele appears to be sufficient for normality as heterozygous relatives of affected patients are of normal height and without immunological or pulmonary complications"
    explanation: >-
      Heterozygous relatives of recessive patients are unaffected, so the
      classic loss-of-function alleles act recessively. The sentence summarises
      earlier reports in the introduction of the dominant-negative study.
genetic:
- name: STAT5B
  gene_term:
    preferred_term: STAT5B
    term:
      id: hgnc:11367
      label: STAT5B
  association: Causative biallelic loss-of-function variants
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Reported recessive alleles include SH2-domain missense variants (p.Ala630Pro,
    p.Phe646Ser), a nonsense variant at codon 152, and several frameshifts
    (for example p.Gln368fs, p.Leu142fs and p.Asp485Thrfs), all predicted or
    shown to abolish transcriptional activity.
  evidence:
  - reference: PMID:26703237
    reference_title: "STAT5B deficiency: Impacts on human growth and immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The critical importance of STAT5B in human IGF-I production was confirmed with the identification of the first homozygous, autosomal recessive, STAT5B mutation in a young female patient who phenotypically resembled patients with classical growth hormone insensitivity (GHI) syndrome (Laron syndrome) due to mutations in the GHR gene"
    explanation: >-
      Establishes biallelic STAT5B mutation as the cause of this Laron-like
      growth hormone insensitivity.
  - reference: PMID:29844444
    reference_title: "Dominant-negative STAT5B mutations cause growth hormone insensitivity with short stature and mild immune dysregulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Autosomal-recessive mutations in signal transducer and activator of transcription (STAT5B), the key signal transducer for GH, cause severe GHIS with additional characteristics of immune and, often fatal, pulmonary complications."
    explanation: >-
      Restates the recessive STAT5B disease as severe GHIS with immune and
      pulmonary complications, in contrast to the dominant-negative form the
      paper reports.
  - reference: PMID:33122102
    reference_title: "Human growth disorders associated with impaired GH action: Defects in STAT5B and JAK2."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Only AR STAT5B defects, however, confer additional characteristics of immune dysfunction which can manifest as chronic, potentially fatal, pulmonary disease."
    explanation: >-
      Separates the recessive loss-of-function disease curated here, which
      carries the immune and pulmonary arm, from the dominant-negative form.
pathophysiology:
- name: Biallelic STAT5B Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Recessive STAT5B variants abolish the transcription factor. Missense changes
    in the SH2 domain cause misfolding and aggregation (p.Ala630Pro) or prevent
    transcription despite phosphorylation (p.Phe646Ser); nonsense and
    frameshift alleles truncate the protein before the SH2 and transactivation
    domains, often leaving no detectable protein. The highly similar STAT5A does
    not compensate in humans.
  genetic_context:
    gene:
      preferred_term: STAT5B
      term:
        id: hgnc:11367
        label: STAT5B
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  molecular_functions:
  - preferred_term: STAT5B DNA-binding transcription factor activity
    term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
    modifier: DECREASED
  evidence:
  - reference: PMID:16303763
    reference_title: "Aberrant folding of a mutant Stat5b causes growth hormone insensitivity and proteasomal dysfunction."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our results are compatible with a model in which Stat5bA630P is an inactive transcription factor by virtue of its aberrant folding and diminished solubility triggered by a misfolded SH2 domain."
    explanation: >-
      The first reported missense allele yields an inactive, misfolded
      transcription factor.
  - reference: PMID:17030597
    reference_title: "Characterization of immunodeficiency in a patient with growth hormone insensitivity secondary to a novel STAT5b gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This novel mutation determined a complete absence of protein expression."
    explanation: >-
      A homozygous nonsense allele removes STAT5B protein entirely in the
      patient.
  - reference: PMID:22419735
    reference_title: "A novel missense mutation in the SH2 domain of the STAT5B gene results in a transcriptionally inactive STAT5b associated with severe IGF-I deficiency, immune dysfunction, and lack of pulmonary disease."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The phosphorylated p.Phe646Ser, however, could not drive transcription."
    explanation: >-
      A second SH2 missense allele is phosphorylated but transcriptionally
      inactive, confirming loss of the transcription factor function.
  - reference: PMID:29844444
    reference_title: "Dominant-negative STAT5B mutations cause growth hormone insensitivity with short stature and mild immune dysregulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "All seven recessively inherited inactivating STAT5B mutations characterized to date lack functional SH2 and downstream TAD domains, and often the entire protein is immunologically undetectable"
    explanation: >-
      Summarises the recessive allele series as inactivating, with loss of the
      SH2 and transactivation domains.
  downstream:
  - target: Defective GH Receptor-STAT5B Signaling
    description: >-
      Without functional STAT5B, GH receptor-JAK2 activation cannot drive the
      STAT5B transcriptional program in GH target cells.
  - target: Defective IL-2 Receptor-STAT5B Signaling in Lymphocytes
    description: >-
      STAT5B is also the principal transducer of IL-2 signalling in T and NK
      cells, so the same lesion disables the lymphocyte arm.
  - target: Disrupted Prolactin Negative Feedback
    description: >-
      Loss of STAT5B is proposed to disrupt negative feedback on prolactin
      production; the mechanism is not established.
- name: Defective GH Receptor-STAT5B Signaling
  biological_scale: CELLULAR
  description: >-
    GH binding to the GH receptor activates JAK2, which recruits and
    phosphorylates STAT5B. In STAT5B deficiency this signal cannot induce IGF1
    transcription, and STAT5A activation does not restore it. The defect is
    downstream of an intact receptor, so exogenous GH does not correct it.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  biological_processes:
  - preferred_term: growth hormone receptor signaling pathway via JAK-STAT
    term:
      id: GO:0060397
      label: growth hormone receptor signaling pathway via JAK-STAT
    modifier: DECREASED
  evidence:
  - reference: PMID:26703237
    reference_title: "STAT5B deficiency: Impacts on human growth and immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "the loss of functional STAT5B correlated to loss of GH-induced IGF1 expression"
    explanation: >-
      In patient dermal fibroblasts loss of STAT5B abolished GH-induced IGF1
      expression, linking the lesion to the signalling defect.
  - reference: PMID:21396575
    reference_title: "STAT5b deficiency: lessons from STAT5b gene mutations."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Growth hormone (GH) regulates insulin-like growth factor (IGF)-I production primarily through activation of the GH receptor (GHR)-signal transducer and activator of transcription (STAT)-5b signaling cascade."
    explanation: >-
      Places STAT5B as the main transducer between the GH receptor and IGF-I
      production.
  downstream:
  - target: Impaired GH-Induced IGF-1 Production
    description: >-
      GH receptor signalling without STAT5B fails to induce IGF1 and the
      GH-dependent components of the circulating IGF ternary complex.
- name: Impaired GH-Induced IGF-1 Production
  biological_scale: ORGANISM
  description: >-
    Circulating IGF-1, IGFBP-3 and acid-labile subunit are all very low and do
    not rise with GH treatment, while GH secretion is normal or elevated. This
    is the growth hormone insensitivity state, and its severity tracks the
    postnatal growth failure. Birth size is normal, consistent with a
    postnatal, GH-dependent defect.
  evidence:
  - reference: PMID:26703237
    reference_title: "STAT5B deficiency: Impacts on human growth and immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Serum IGF-I, IGFBP-3 and ALS concentrations in all cases were abnormally low (Table 1), and remained low after GH treatment in an IGF-I generation test"
    explanation: >-
      IGF-I, IGFBP-3 and ALS are low in every reported patient and unresponsive
      to GH, defining the GH-insensitive IGF deficiency.
  - reference: PMID:26703237
    reference_title: "STAT5B deficiency: Impacts on human growth and immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Some of the subjects underwent growth hormone therapy (1yr to 4yr), but growth response was uniformly poor"
    explanation: >-
      Recombinant GH does not rescue growth, as expected for a defect
      downstream of the GH receptor.
  - reference: PMID:16787985
    reference_title: "Clinical and biochemical characteristics of a male patient with a novel homozygous STAT5b mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Extremely low levels of IGF-I (-6.9 SDS), IGF-binding protein-3 (-12 SDS), and acid-labile subunit (-7.5 SDS) were found."
    explanation: >-
      Quantifies the deficiency of all three GH-dependent ternary complex
      components in a homozygous patient.
  downstream:
  - target: Decreased Circulating IGF-1
    description: Low hepatic IGF1 output lowers serum IGF-1.
  - target: Decreased Circulating Acid-Labile Subunit
    description: The GH-dependent acid-labile subunit is also not induced.
  - target: Elevated Circulating Growth Hormone
    description: >-
      Stimulated GH is often elevated, the expected pituitary response when
      GH action is blocked downstream of its receptor.
  - target: Postnatal Growth Failure
    description: IGF-1 deficiency drives the severe postnatal growth failure.
  - target: Delayed Puberty
    description: Low circulating IGF-I contributes to delayed puberty.
  - target: Delayed Skeletal Maturation
    description: Bone age is considerably delayed with IGF deficiency.
- name: Defective IL-2 Receptor-STAT5B Signaling in Lymphocytes
  biological_scale: CELLULAR
  description: >-
    IL-2 and related common gamma-chain cytokines signal through STAT5B to
    induce CD25 (IL-2 receptor alpha) and FOXP3. Patient T cells show impaired
    IL-2 signalling and proliferation and reduced CD25 induction, while other
    IL-2 responses are preserved, so the defect is selective. Reduced CD25 on
    conventional T cells is also proposed to contribute to infection
    susceptibility.
  biological_processes:
  - preferred_term: interleukin-2-mediated signaling pathway
    term:
      id: GO:0038110
      label: interleukin-2-mediated signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:17030597
    reference_title: "Characterization of immunodeficiency in a patient with growth hormone insensitivity secondary to a novel STAT5b gene mutation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro T-cell proliferation and interleukin 2 signaling were impaired."
    explanation: >-
      Patient T cells tested in vitro show defective IL-2 signalling and
      proliferation.
  - reference: PMID:16920911
    reference_title: "Cutting edge: Decreased accumulation and regulatory function of CD4+ CD25(high) T cells in human STAT5b deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Expression of CD25, a component of the high-affinity IL-2R, was also reduced in response to IL-2 or after in vitro propagation."
    explanation: >-
      STAT5B-deficient T cells fail to upregulate the high-affinity IL-2
      receptor chain in response to IL-2.
  - reference: PMID:23773921
    reference_title: "Differentiating the roles of STAT5B and STAT5A in human CD4+ T cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Upon knocking down STAT5A or STAT5B in human primary T cells, we found differentially regulated expression of FOXP3 and IL-2R in STAT5B knockdown T cells"
    explanation: >-
      STAT5B knockdown in primary human T cells alters FOXP3 and IL-2 receptor
      expression, showing a STAT5B-specific role that STAT5A does not cover.
  downstream:
  - target: Regulatory T Cell Deficiency and Dysfunction
    description: >-
      IL-2-STAT5B signalling is required for accumulation of functional FOXP3+
      regulatory T cells.
  - target: NK Cell Maturation and Cytotoxicity Defect
    description: >-
      IL-2 and IL-15 signalling through STAT5B supports NK cell terminal
      maturation and cytolytic function.
  - target: T-Cell Lymphopenia
    description: >-
      Impaired cytokine-driven T-cell proliferation and homeostasis lower T-cell
      numbers.
  - target: Recurrent Respiratory Infections
    description: >-
      Decreased CD25 on T cells is proposed to contribute to increased
      susceptibility to infection.
    evidence:
    - reference: PMID:26703237
      reference_title: "STAT5B deficiency: Impacts on human growth and immunity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      directness: INDIRECT
      snippet: "The increased susceptibility to opportunistic infections could also be related to decreased CD25 on all T cells, as has been reported in humans with severe CD25 deficiency"
      explanation: >-
        Proposes, by analogy with CD25 deficiency, that reduced CD25 on T cells
        contributes to infection susceptibility.
- name: Regulatory T Cell Deficiency and Dysfunction
  biological_scale: CELLULAR
  description: >-
    CD4+CD25high regulatory T cells are reduced in number, express low FOXP3,
    and are impaired in suppressing conventional T-cell proliferation. Loss of
    Treg control of T-cell homeostasis is the proposed driver of autoimmunity
    and of lymphocyte accumulation in extra-lymphoid tissues such as the lung.
  cell_types:
  - preferred_term: CD4-positive, CD25-positive, alpha-beta regulatory T cell
    term:
      id: CL:0000792
      label: CD4-positive, CD25-positive, alpha-beta regulatory T cell
  biological_processes:
  - preferred_term: regulatory T cell differentiation
    term:
      id: GO:0045066
      label: regulatory T cell differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:16920911
    reference_title: "Cutting edge: Decreased accumulation and regulatory function of CD4+ CD25(high) T cells in human STAT5b deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A patient homozygous for a missense A630P STAT5b mutation displayed immune dysregulation and decreased numbers of CD4+ CD25(high) T cells."
    explanation: >-
      Documents reduced regulatory T-cell numbers with immune dysregulation in
      a homozygous patient.
  - reference: PMID:16920911
    reference_title: "Cutting edge: Decreased accumulation and regulatory function of CD4+ CD25(high) T cells in human STAT5b deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "STAT5b(A630P/A630P) CD4+ CD25(high) T cells had low expression of forkhead box P3 and an impaired ability to suppress the proliferation of or to kill CD4+ CD25- T cells."
    explanation: >-
      The residual regulatory T cells have low FOXP3 and poor suppressive
      function.
  - reference: PMID:16920911
    reference_title: "Cutting edge: Decreased accumulation and regulatory function of CD4+ CD25(high) T cells in human STAT5b deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These results indicate that STAT5b propagates an important IL-2-mediated signal for the in vivo accumulation of functional regulatory T cells."
    explanation: >-
      Links the IL-2-STAT5B signalling defect to the regulatory T-cell
      deficiency.
  - reference: PMID:17030597
    reference_title: "Characterization of immunodeficiency in a patient with growth hormone insensitivity secondary to a novel STAT5b gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "CD4+ and CD25+ regulatory T cells were significantly diminished"
    explanation: >-
      An independent patient with a nonsense allele also has diminished
      regulatory T cells.
  - reference: PMID:23773921
    reference_title: "Differentiating the roles of STAT5B and STAT5A in human CD4+ T cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Functional ex vivo studies in homozygous STAT5B-deficient patients showed reduced FOXP3 expression with impaired regulatory function of STAT5B-null Treg cells, also of increased memory phenotype."
    explanation: >-
      Ex vivo patient Treg cells confirm reduced FOXP3 and impaired
      suppressive function.
  downstream:
  - target: Loss of Peripheral Immune Tolerance
    description: >-
      Reduced and dysfunctional regulatory T cells fail to restrain effector
      lymphocytes.
    evidence:
    - reference: PMID:26703237
      reference_title: "STAT5B deficiency: Impacts on human growth and immunity."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: REVIEW_SYNTHESIS
      snippet: "Perturbations of Tregs, which are essential for the propagation and homeostasis of T-cell populations (49), most likely lead to an abnormal accumulation and proliferation of lymphocytes in extra-lymphoid tissues."
      explanation: >-
        Proposes the regulatory T-cell defect as the cause of lymphocyte
        accumulation in extra-lymphoid tissues.
  - target: Decreased Regulatory T Cell Proportion
    description: The Treg defect is measured as a reduced Treg fraction.
- name: Loss of Peripheral Immune Tolerance
  biological_scale: ORGANISM
  description: >-
    Without adequate regulatory T-cell control, chronically activated T cells
    and hyperactive B cells produce autoantibodies, hypergammaglobulinemia,
    elevated IgE and atopy, and lymphocytes infiltrate extra-lymphoid tissues,
    most consequentially the lung. The immune phenotype is variable even between
    siblings with the same variant.
  evidence:
  - reference: PMID:33090292
    reference_title: "Developmental Adaptive Immune Defects Associated with STAT5B Deficiency in Three Young Siblings."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All three siblings demonstrated consistent B cell hyperactivity including elevated IgE levels and autoantibody production, associated with diagnoses of atopy and autoimmunity."
    explanation: >-
      Serial immunophenotyping in three young siblings shows B-cell
      hyperactivity, autoantibodies, atopy and autoimmunity.
  - reference: PMID:17030597
    reference_title: "Characterization of immunodeficiency in a patient with growth hormone insensitivity secondary to a novel STAT5b gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "T cells presented a chronically hyperactivated phenotype."
    explanation: >-
      Chronic T-cell hyperactivation is the effector side of failed tolerance.
  downstream:
  - target: Autoimmunity
    description: Failed tolerance permits autoantibody production and autoimmune disease.
  - target: Eczema
    description: Immune dysregulation manifests in skin as severe eczema.
  - target: Lymphocytic Interstitial Pneumonia
    description: >-
      Lymphocytes accumulate in the lung interstitium, producing lymphocytic
      interstitial pneumonia.
  - target: Chronic Lung Disease
    description: >-
      Lymphocytic lung infiltration underlies the chronic pulmonary disease.
  - target: Hypergammaglobulinemia
    description: B-cell hyperactivity raises circulating immunoglobulin.
  - target: Increased Circulating IgE
    description: B-cell hyperactivity includes elevated IgE with atopy.
- name: NK Cell Maturation and Cytotoxicity Defect
  biological_scale: CELLULAR
  description: >-
    STAT5B-deficient NK cells are reduced in number, stall before terminal
    maturation, express less perforin and CD16, and form lytic synapses poorly,
    so their cytolytic capacity is low. IL-2 stimulation partly restores
    granule convergence and killing in vitro. Stat5b knockout mice show the
    same NK defect.
  cell_types:
  - preferred_term: natural killer cell
    term:
      id: CL:0000623
      label: natural killer cell
  biological_processes:
  - preferred_term: natural killer cell mediated cytotoxicity
    term:
      id: GO:0042267
      label: natural killer cell mediated cytotoxicity
    modifier: DECREASED
  - preferred_term: natural killer cell differentiation
    term:
      id: GO:0001779
      label: natural killer cell differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:31600547
    reference_title: "Human signal transducer and activator of transcription 5b (STAT5b) mutation causes dysregulated human natural killer cell maturation and impaired lytic function."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Furthermore, human STAT5b-deficient NK cells had low cytolytic capacity, and fixed-cell microscopy showed poor convergence of lytic granules."
    explanation: >-
      Patient NK cells have low cytolytic capacity with defective lytic
      synapse formation.
  - reference: PMID:31600547
    reference_title: "Human signal transducer and activator of transcription 5b (STAT5b) mutation causes dysregulated human natural killer cell maturation and impaired lytic function."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We observed low NK cell numbers and impaired NK cell maturation, suggesting that STAT5b is involved in terminal NK cell maturation in Stat5b-/- mice."
    explanation: >-
      The Stat5b knockout mouse reproduces the NK number and maturation defect.
  - reference: PMID:17030597
    reference_title: "Characterization of immunodeficiency in a patient with growth hormone insensitivity secondary to a novel STAT5b gene mutation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "very low numbers of natural killer (18/mm3) and gammadelta T (5/mm3) cells"
    explanation: >-
      A patient with complete STAT5B absence has very low NK counts.
  downstream:
  - target: Reduced NK Cell Count
    description: Impaired NK maturation lowers circulating NK cell counts.
  - target: Recurrent Respiratory Infections
    description: >-
      Deficient NK cytotoxicity weakens early defence against viral and other
      infections.
  - target: Herpetic Keratitis
    description: >-
      Impaired NK and T-cell antiviral function permits recurrent herpesvirus
      infection.
- name: Disrupted Prolactin Negative Feedback
  biological_scale: ORGANISM
  description: >-
    Serum prolactin is elevated in most patients in whom it was measured,
    without macroprolactin or pituitary tumor. The leading explanation is loss
    of a STAT5B-dependent negative feedback loop on prolactin production, but
    this has not been demonstrated.
  biological_processes:
  - preferred_term: negative regulation of prolactin secretion
    term:
      id: GO:1902721
      label: negative regulation of prolactin secretion
    modifier: DECREASED
  evidence:
  - reference: PMID:26703237
    reference_title: "STAT5B deficiency: Impacts on human growth and immunity."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    directness: INDIRECT
    snippet: "It is likely that the STAT5B mutations disrupted the negative feedback loop for PRL production, although the mechanisms involved remain to be clarified."
    explanation: >-
      States the feedback-loss hypothesis for hyperprolactinemia and that it
      is unproven.
  downstream:
  - target: Hyperprolactinemia
    description: Loss of feedback raises circulating prolactin.
phenotypes:
- category: Growth
  name: Postnatal Growth Failure
  description: >-
    Severe postnatal growth failure with normal birth size, indistinguishable
    from classic Laron syndrome; height SDS at first report ranged from about
    -3 to -9.9.
  phenotype_term:
    preferred_term: Postnatal growth retardation

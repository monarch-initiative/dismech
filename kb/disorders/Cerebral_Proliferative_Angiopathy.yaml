      CPA may be regarded as a separate clinical entity different to "classical" cerebral AVMs, because normal brain is interspersed with the abnormal vascular channels increasing the risk of neurological deficit in aggressive treatments, which in the light of the natural history does not seem to be indicated.
    explanation: The angiographic cohort supports DSA-based recognition of CPA as distinct from classic AVM.
differential_diagnoses:
- name: Classical brain arteriovenous malformation
  description: >-
    Classical brain arteriovenous malformations are the primary differential
    diagnosis and must be distinguished from CPA because aggressive
    nidus-obliterating interventions risk damaging functional brain parenchyma
    interspersed within a CPA lesion.
  distinguishing_features:
  - CPA lacks a compact nidus or dominant arterial feeders and shows normal brain parenchyma intermingled between abnormal vascular channels.
  - CPA exhibits a discrepancy between large lesion size and small shunting volume, frequent transdural supply, progressive arterial occlusion, and absence of flow-related aneurysms.
  - CPA natural history demonstrates a low risk of initial hemorrhage (with seizures, disabling headaches, and stroke-like symptoms predominating), in contrast to classical brain AVMs.
  disease_term:
    preferred_term: arteriovenous malformations of the brain
    term:
      id: MONDO:0007154
      label: arteriovenous malformations of the brain
  evidence:
  - reference: PMID:18239181
    reference_title: "Cerebral proliferative angiopathy: clinical and angiographic description of an entity different from cerebral AVMs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-

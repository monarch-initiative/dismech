    explanation: Distinguishes CPA from classical cerebral AVMs by angioarchitecture, natural history, and treatment risk.
  - reference: PMID:18239181
    reference_title: "Cerebral proliferative angiopathy: clinical and angiographic description of an entity different from cerebral AVMs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Natural history demonstrates a low risk of hemorrhage.
    explanation: Establishes the low initial hemorrhage risk in the natural history of CPA compared with classical brain AVMs.
  - reference: PMID:37701260
    reference_title: Recurrent Intraventricular Haemorrhage in Cerebral Proliferative Angiopathy - A Case Report and Review of the Literature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Angioarchitectural workup revealed intermingled brain parenchyma between vascular spaces, absence of dominant feeders and a clear nidus consistent with CPA.
    explanation: Summarizes the key angiographic features that separate CPA from classical brain AVMs.
treatments:
- name: Conservative medical management
  description: >-
    Conservative symptom-oriented management is the most common approach in CPA
    (54.4% of pooled cases) because normal brain tissue is intermingled within
    the vascular network, increasing the risk of neurological deficit with
    aggressive intervention.
  treatment_term:
    preferred_term: conservative symptomatic management
    term:
      id: NCIT:C170740
      label: Symptomatic Therapy
  evidence:
  - reference: PMID:32206904
    reference_title: "The current clinical picture of cerebral proliferative angiopathy: systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most patients were treated conservatively (54.4%), followed by endovascular (34.2%).
    explanation: Systematic review shows conservative management is the primary strategy in more than half of reported CPA patients.
  - reference: PMID:18239181
    reference_title: "Cerebral proliferative angiopathy: clinical and angiographic description of an entity different from cerebral AVMs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CPA may be regarded as a separate clinical entity different to "classical" cerebral AVMs, because normal brain is interspersed with the abnormal vascular channels increasing the risk of neurological deficit in aggressive treatments, which in the light of the natural history does not seem to be indicated.
    explanation: Explains why conservative management is favored over aggressive nidus-obliterating interventions.
- name: Indirect cerebral revascularization
  description: >-
    For symptomatic patients—particularly children—with cerebral hypoperfusion,
    pial synangiosis or related indirect bypass strategies may be used to
    augment collateral perfusion and reduce recurrent ischemic events while
    sparing intermingled brain parenchyma.
  treatment_term:
    preferred_term: indirect cerebral revascularization
    term:
      id: NCIT:C191567
      label: Invasive Revascularization Therapy
  therapeutic_modality: SURGERY
  target_mechanisms:
  - target: Altered cerebral perfusion and ischemic symptoms
    treatment_effect: BYPASSES
    description: >-
      Indirect revascularization (such as pial synangiosis and burr-hole dural
      inversion) promotes transdural and pial collateral blood supply to
      hypoperfused territory, enhancing perfusion and reducing recurrent
      ischemic events.
    evidence:
    - reference: PMID:41652190
      reference_title: "Cerebral proliferative angiopathy in pediatric patients: case-based review with an illustrative case."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In symptomatic children with hypoperfusion, indirect revascularization is a reasonable strategy to enhance perfusion and reduce recurrent ischemic events.
      explanation: Connects indirect surgical revascularization directly to the cerebral hypoperfusion and ischemia mechanism node.
  evidence:
  - reference: PMID:41652190
    reference_title: "Cerebral proliferative angiopathy in pediatric patients: case-based review with an illustrative case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In symptomatic children with hypoperfusion, indirect revascularization is a reasonable strategy to enhance perfusion and reduce recurrent ischemic events.
    explanation: The pediatric review directly supports indirect revascularization for symptomatic hypoperfused CPA.
  - reference: PMID:41573183
    reference_title: Evaluating Vascular Hemodynamics in Cerebral Proliferative Angiopathy Using Advanced Arterial Spin Labeling MRI.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our quantitative results indicated that, in regions affected by CPA, cerebral blood flow increased by at least 14% and arterial transit time decreased by 9.4% after bypass surgery.
    explanation: This single-patient imaging report supports hemodynamic improvement after bypass surgery.
- name: Targeted endovascular embolization
  description: >-
    Partial or targeted endovascular embolization of fragile angiographic targets
    may be used in selected CPA cases (34.2% of pooled cases), although

  downstream:
  - target: Focal neurologic deficits
    description: Regional hypoperfusion and vascular involvement of eloquent brain parenchyma cause focal neurological deficits.
  - target: Headache
    description: Altered cerebral hemodynamics, transdural collateralization, and venous congestion contribute to frequent disabling headaches.
  - target: Seizure
    description: Chronic cortical ischemia and abnormal vascular channels intermingled with cortical parenchyma provoke seizures.
  - target: Transient ischemic attack
    description: Perinidal oligemia and impaired hemodynamic reserve lead to transient ischemic attacks and stroke-like episodes.
- name: VEGF-associated calvarial centripetal proliferation hypothesis
  description: >-
    Some patients have calvarial thickening adjacent to CPA. A proangiogenic
    mechanism involving elevated VEGF has been proposed as a hypothesis linking
    CPA biology to surrounding tissue remodeling.

name: Cerebral Proliferative Angiopathy
creation_date: "2026-05-05T15:37:54Z"
description: >-
  Cerebral proliferative angiopathy is a rare diffuse cerebral vascular
  malformation distinct from classical arteriovenous malformations. It is
  characterized by abnormal arteriovenous channels intermingled with normal
  brain parenchyma, absence of a compact nidus or dominant feeders, and clinical
  presentations including focal deficits, headache, seizures, ischemia, and
  rarely hemorrhage.
category: Complex
disease_term:
  preferred_term: cerebral proliferative angiopathy
  term:
    id: MONDO:0979258
    label: cerebral proliferative angiopathy
parents:
- Vascular disorder
synonyms:
- CPA
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:18239181
      reference_title: "Cerebral proliferative angiopathy: clinical and angiographic description of an entity different from cerebral AVMs."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Clinical symptoms were seizures, disabling headaches, and stroke-like symptoms; hemorrhagic presentations were exceptional.
      explanation: Cerebral proliferative angiopathy is an intracranial vascular malformation presenting with seizures, disabling headaches, and stroke-like symptoms, placing it under Harrison's Neurologic Disorders part.
prevalence:
- population: Prospective brain AVM databank cohort (Hôpital de Bicêtre)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    49 of 1,434 brain AVM patients in the Hôpital de Bicêtre prospective
    referral databank were identified as having cerebral proliferative
    angiopathy (3.4% of that referral cohort; population-level prevalence is
    not established).
  evidence:
  - reference: PMID:18239181
    reference_title: "Cerebral proliferative angiopathy: clinical and angiographic description of an entity different from cerebral AVMs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In a prospectively entered databank encompassing 1434 patients with brain AVMs, a subgroup of 49 patients harboring specific angiographic characteristics were identified.
    explanation: Establishes the referral-databank proportion of CPA cases (49 of 1,434 brain AVM patients) within the Hôpital de Bicêtre registry.
- population: Published literature (PRISMA systematic review across 33 studies)
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    A 2020 systematic review identified 95 cases across 33 published studies,
    approximately half of which originated from the initial Bicêtre cohort.
  evidence:
  - reference: PMID:32206904
    reference_title: "The current clinical picture of cerebral proliferative angiopathy: systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thirty-three studies were analyzed, rendering a total 95 cases-half of which came from a single study.
    explanation: Quantifies the total published literature case count across 33 studies through 2020.
progression:
- phase: Onset
  age_range: Childhood to adulthood (mean age 22-23 years; reported range 4-69 years)
  notes: >-
    CPA predominantly presents in young adult females (60.0-67% across major
    cohorts), although pediatric cases also occur.
  evidence:
  - reference: PMID:18239181
    reference_title: "Cerebral proliferative angiopathy: clinical and angiographic description of an entity different from cerebral AVMs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We found a preponderance of CPA in young (mean age: 22) females (67%).
    explanation: Establishes the young adult onset and female predominance in the index cohort.
  - reference: PMID:32206904
    reference_title: "The current clinical picture of cerebral proliferative angiopathy: systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients were predominantly young (mean 23 years old) and female (60.0%) presenting with headaches (44.9%), seizures (37.1%), or transient ischemic attacks (33.7%).
    explanation: Confirms the mean age at presentation (23 years) and female predominance (60.0%) across 95 pooled cases.
  - reference: PMID:39833329
    reference_title: A potential VEGF-driven hypothesis of calvarial centripetal proliferation in cerebral proliferative angiopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Patients with CPA ranged from 4 to 69 years of age and underwent skull evaluation at a median age of 26.5 years.
    explanation: Substantiates the reported 4 to 69 year age range across the 16-patient multicenter cohort.
- phase: Long-term clinical course
  notes: >-
    Over 110.8 patient-years of follow-up in systematic review, neurological
    status improved in 50.7%, remained stable in 40.2%, and worsened in 9.0%;
    initial hemorrhage is relatively uncommon (18.0%) compared with classical
    AVMs, but rebleeding rates reach 67% once hemorrhage occurs.
  evidence:
  - reference: PMID:32206904
    reference_title: "The current clinical picture of cerebral proliferative angiopathy: systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hemorrhage was present in 18.0%, but rebleeding rates were as high as 67%.
    explanation: Quantifies initial hemorrhage frequency and high rebleeding rate during follow-up.
  - reference: PMID:32206904
    reference_title: "The current clinical picture of cerebral proliferative angiopathy: systematic review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neurological status improved in 50.7%, remained stable in 40.2%, and worsened in 9.0%.
    explanation: Summarizes longitudinal neurological outcomes across pooled CPA follow-up.
pathophysiology:
- name: Chronic perinidal ischemia and oligemia
  description: >-
    CPA is hypothesized to arise from reduced perinidal perfusion and chronic
    cortical ischemia, which promotes diffuse angiogenesis and recruitment of
    abnormal arteriovenous channels.
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  biological_processes:
  - preferred_term: response to hypoxia
    modifier: INCREASED
    term:
      id: GO:0001666
      label: response to hypoxia
  evidence:
  - reference: PMID:18239181
    reference_title: "Cerebral proliferative angiopathy: clinical and angiographic description of an entity different from cerebral AVMs."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diffuse angiogenetic activity is presumably related to reduced perinidal perfusion and subsequent chronic cortical ischemia.
    explanation: The field-defining cohort links reduced perinidal perfusion and chronic cortical ischemia to diffuse angiogenetic activity in CPA.
  downstream:
  - target: Diffuse proliferative cerebral arteriovenous malformation
    description: Chronic ischemia and oligemia are proposed to drive diffuse proliferative vascular remodeling.
- name: Diffuse proliferative cerebral arteriovenous malformation
  description: >-
    CPA has a diffuse angioarchitecture with intermingled brain parenchyma and
    no compact nidus, distinguishing it from classic arteriovenous malformation.
    The malformation alters local cerebral circulation and can involve eloquent
    brain regions.
  cell_types:
  - preferred_term: endothelial cell

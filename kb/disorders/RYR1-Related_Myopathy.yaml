      GeneReviews defines the IVCT methodology directly, closing the
      GeneReviews-baseline gap on the primary diagnostic test for the
      malignant hyperthermia susceptibility axis of this entry.
- name: RYR1 molecular genetic testing
  description: >-
    Next-generation sequencing of the entire RYR1 coding sequence and
    canonical splice sites, rather than restriction to historical hotspot
    regions, has become the primary diagnostic approach and has expanded the
    recognized clinical spectrum.
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:33190635
    reference_title: "Ryanodine receptor 1-related disorders: an historical perspective and proposal for a unified nomenclature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A genetics-first diagnostic approach is rapidly becoming the standard
      for confirmation of disorders with known genetic etiology
    explanation: >-
      Establishes genetics-first sequencing as the current diagnostic
      standard for RYR1-related myopathy.
treatments:
- name: Avoidance of malignant hyperthermia triggers
  description: >-
    Strict avoidance of volatile anesthetic agents and depolarizing
    neuromuscular blocking agents (succinylcholine); total intravenous
    anesthesia is preferred whenever a patient with any RYR1-related
    myopathy diagnosis requires general anesthesia, because dominant,
    recessive, and untested individuals are all managed as potentially MH
    susceptible.
  treatment_term:
    preferred_term: chemical exposure avoidance
    term:
      id: NCIT:C15900
      label: Lifestyle Therapy
  evidence:
  - reference: PMID:30406384
    reference_title: "Ryanodine Receptor 1-Related Myopathies: Diagnostic and Therapeutic Approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      all RYR1-RM-affected individuals are considered potentially MH
      susceptible [29]
    explanation: >-
      Supports universal anesthetic-trigger avoidance across the RYR1-related
      myopathy spectrum.
  - reference: PMID:20301325
    reference_title: Nonsyndromic Malignant Hyperthermia Susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Avoid potent inhalation anesthetics and succinylcholine.
    explanation: >-
      GeneReviews names the specific agents to avoid, closing the
      GeneReviews-baseline "Agents/Circumstances to Avoid" gap.
- name: Dantrolene
  description: >-
    Dantrolene is the specific emergency pharmacotherapy for an acute
    malignant hyperthermia reaction and should be immediately available
    whenever a patient with RYR1-related myopathy undergoes general
    anesthesia. Off-label chronic/periodic use for baseline myopathic
    symptoms has been reported anecdotally but is not well established.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: dantrolene
      term:
        id: CHEBI:4317
        label: dantrolene
  target_phenotypes:
  - preferred_term: Malignant hyperthermia
    term:
      id: HP:0002047
      label: Malignant hyperthermia
  target_mechanisms:
  - target: SR Calcium Leak and RyR1 Channel Hypersensitivity
    treatment_effect: INHIBITS
    description: >-
      Dantrolene antagonizes the RyR1 channel, reducing the excess calcium
      release/leak underlying both the acute malignant hyperthermia crisis
      and, potentially, baseline dominant-mechanism channel hyperactivity.
    evidence:
    - reference: PMID:26238698
      reference_title: "Malignant hyperthermia: a review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Dantrolene sodium is a specific antagonist and should be available
        wherever general anesthesia is administered.
      explanation: >-
        Supports dantrolene as the specific pharmacologic antagonist of the
        leaky-channel calcium-release mechanism.
  evidence:
  - reference: PMID:26238698
    reference_title: "Malignant hyperthermia: a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dantrolene sodium is a specific antagonist and should be available
      wherever general anesthesia is administered.
    explanation: Establishes dantrolene as the MH-crisis emergency treatment.
  - reference: PMID:20301325
    reference_title: Nonsyndromic Malignant Hyperthermia Susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Administration of intravenous dantrolene sodium (initial dose of 2.5
      mg/kg) as early as possible during an MH episode.
    explanation: >-
      GeneReviews specifies the targeted-therapy dosing for an acute MH
      episode, closing the GeneReviews-baseline Management gap.
- name: Salbutamol/albuterol
  description: >-
    An off-label beta-agonist reported to improve muscle strength and motor
    function in some RYR1-related myopathy patients, proposed to act by
    increasing SERCA expression and facilitating reuptake of cytosolic
    calcium into the sarcoplasmic reticulum, thereby partially compensating
    for either the leaky-channel or the excitation-contraction uncoupling
    mechanism.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: albuterol
      term:
        id: CHEBI:2549
        label: albuterol
  evidence:
  - reference: PMID:33190635
    reference_title: "Ryanodine receptor 1-related disorders: an historical perspective and proposal for a unified nomenclature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      salbutamol, a beta agonist that improves muscle strength and motor
      function through mechanisms that are not completely understood [120]
    explanation: >-
      Documents anecdotal reports of salbutamol benefit in RYR1-related
      myopathy.
- name: N-acetylcysteine
  description: >-
    An antioxidant tested in a completed NIH clinical trial (NCT02362425)
    directly targeting the mitochondrial oxidative/nitrosative stress
    mechanism, based on preclinical rescue of oxidative stress and improved
    survival/muscle function in zebrafish and patient-derived myotube
    models. The subsequent clinical trial did not confirm a benefit on its
    primary outcomes.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: N-acetylcysteine
      term:
        id: CHEBI:28939
        label: N-acetyl-L-cysteine
  target_mechanisms:
  - target: Oxidative and Nitrosative Stress
    treatment_effect: INHIBITS
    description: >-
      N-acetylcysteine is a glutathione precursor proposed to reduce the
      excess mitochondrial reactive oxygen species production characteristic
      of RYR1-related myopathy, the mechanism this node models.
    evidence:
    - reference: PMID:22418739
      reference_title: "Oxidative stress and successful antioxidant treatment in models of RYR1-related myopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Exposure to the antioxidant N-acetylcysteine reduced oxidative
        stress and improved survival in the RYR1-related myopathies human
        myotubes ex vivo
      explanation: >-
        Patient-derived myotube (in vitro) data establishing the
        mechanistic rationale for N-acetylcysteine acting on the
        oxidative-stress node this treatment targets.
  evidence:
  - reference: PMID:22418739
    reference_title: "Oxidative stress and successful antioxidant treatment in models of RYR1-related myopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      led to significant restoration of aspects of
      muscle function in the relatively relaxed zebrafish, thereby
      confirming its efficacy in vivo
    explanation: >-
      Zebrafish (model organism) data confirming the preclinical benefit
      that motivated the subsequent NCT02362425 clinical trial, which did
      not confirm the benefit in humans (see clinical_trials below).
- name: Rycal S48168 (ARM210)
  description: >-
    An investigational RyR-stabilizing "Rycal" small molecule tested in a
    completed phase 1, open-label, dose-escalation trial (NCT04141670) in
    ambulatory adults with genetically confirmed RYR1-related myopathy whose
    RyR1 channels were shown ex vivo to be leaky and Rycal-responsive. It was
    well tolerated, with most participants on the higher dose reporting
    reduced fatigue and improved proximal muscle strength on exam.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: Rycal S48168 (ARM210)
  target_phenotypes:
  - preferred_term: Proximal muscle weakness
    term:
      id: HP:0003701
      label: Proximal muscle weakness
  target_mechanisms:
  - target: SR Calcium Leak and RyR1 Channel Hypersensitivity
    treatment_effect: INHIBITS
    description: >-
      Rycal compounds are proposed to restore FKBP12 (calstabin1) binding to
      RyR1, stabilizing the channel closed state and reducing the resting
      calcium leak characteristic of dominant gain-of-function variants.
    evidence:
    - reference: PMID:38318125
      reference_title: "Rycal S48168 (ARM210) for RYR1-related myopathies: a phase one, open-label, dose-escalation trial."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Loss of RyR1-calstabin1 association, SR calcium leak, and increased
        RyR1 open probability were observed in 17 RYR1-RM patient skeletal
        muscle biopsies and improved following ex vivo treatment with Rycal
        compounds.
      explanation: >-
        Establishes the mechanistic rationale for Rycal compounds directly
        addressing the leaky-channel/SR calcium leak mechanism in patient
        muscle biopsies.
  evidence:
  - reference: PMID:38318125
    reference_title: "Rycal S48168 (ARM210) for RYR1-related myopathies: a phase one, open-label, dose-escalation trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      S48168 (ARM210) was well-tolerated, did not cause any serious adverse
      events, and exhibited a dose-dependent PK profile.
    explanation: Reports the phase 1 safety and tolerability outcome.
- name: Pyridostigmine for fatigable weakness
  description: >-
    Anecdotal reports describe improved fatigue and energy level with the
    acetylcholinesterase inhibitor pyridostigmine in a subset of RYR1-related
    myopathy patients with a fatigable weakness phenotype.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_phenotypes:
  - preferred_term: Fatigue
    term:
      id: HP:0012378
      label: Fatigue
  evidence:
  - reference: PMID:24951453
    reference_title: "RYR1-related congenital myopathy with fatigable weakness, responding to pyridostigimine."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These cases broaden the RYR1-related disease spectrum to include a
      myasthenic-like phenotype, including partial response to
      pyridostigimine.
    explanation: >-
      Reports partial clinical response to pyridostigmine in siblings with
      RYR1-related myopathy presenting with fatigable weakness.
  - reference: PMID:33190635
    reference_title: "Ryanodine receptor 1-related disorders: an historical perspective and proposal for a unified nomenclature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There have been anecdotal reports of positive responses to
      pyridostigmine, an acetylcholinesterase inhibitor, improving fatigue
      and energy level [43]
    explanation: Corroborates anecdotal pyridostigmine benefit in RYR1-related myopathy.
- name: Supportive orthopedic, respiratory, and physical therapy
  description: >-
    No approved disease-modifying treatment exists for RYR1-related
    myopathy. Management is primarily supportive: physical/occupational
    therapy, orthopedic evaluation and bracing/surgery for scoliosis and
    contractures, respiratory support as needed, and periodic monitoring of
    motor function.
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302
      label: Physical Therapy
  evidence:
  - reference: PMID:33190635
    reference_title: "Ryanodine receptor 1-related disorders: an historical perspective and proposal for a unified nomenclature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is no approved treatment for RYR1-RM. Symptom management is
      primarily supportive, with precautions taken when MH risk is either
      known or not ascertained.
    explanation: >-
      Establishes that management is supportive in the absence of an
      approved disease-modifying therapy.
- name: Genetic counseling
  description: >-
    Genetic counseling addresses the dominant versus recessive inheritance
    pattern, recurrence risk, and the implications of RYR1 genotype for
    malignant hyperthermia susceptibility in the proband and at-risk family
    members.
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:20301325
    reference_title: Nonsyndromic Malignant Hyperthermia Susceptibility.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each child of an individual with MHS has a 50% chance of being MH
      susceptible.
    explanation: >-
      GeneReviews states the concrete transmission-risk figure a genetic
      counseling recommendation needs for the dominant malignant hyperthermia
      susceptibility axis of this entry, closing the GeneReviews-baseline
      Genetic Counseling gap. (The corresponding recessive-disease
      recurrence risk is covered by the standard 25% autosomal recessive
      figure implicit in the `inheritance:` block above.)
clinical_trials:
- name: NCT02362425
  phase: PHASE_II
  status: COMPLETED
  description: >-
    NIH natural-history-plus-intervention trial of oral N-acetylcysteine
    (NAC), an antioxidant, in ambulatory RYR1-related myopathy patients
    ages 7 and older, testing effects on muscle damage and exercise
    tolerance. The intervention did not improve either outcome.
  target_phenotypes:
  - preferred_term: Proximal muscle weakness
    term:
      id: HP:0003701
      label: Proximal muscle weakness
  evidence:
  - reference: clinicaltrials:NCT02362425
    reference_title: "Antioxidant Therapy in RYR1-Related Congenital Myopathy"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      To see if the drug N-acetylcysteine decreases muscle damage in people
      with RYR1-RM. To see if it improves their exercise tolerance.
    explanation: States the trial's objective testing NAC in RYR1-related myopathy.
  - reference: PMID:33190635
    reference_title: "Ryanodine receptor 1-related disorders: an historical perspective and proposal for a unified nomenclature."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All participants exhibited elevated oxidative stress as determined by
      urine 15-F2t-isoprostane concentration and decreased physical
      endurance. However, oral treatment with NAC did not impact either
      outcome [121].
    explanation: >-
      Reports the negative primary-outcome result of the completed NAC
      trial, despite preclinical rationale in mouse and zebrafish models.
- name: NCT04141670
  phase: PHASE_I
  status: COMPLETED
  description: >-
    Phase 1, open-label, dose-escalation, first-in-patient trial of the
    RyR-stabilizing "Rycal" small molecule S48168 (ARM210) in ambulatory
    adults with genetically confirmed RYR1-related myopathy, directly
    targeting the dominant leaky-channel/gain-of-function mechanism. The
    compound was well tolerated with a dose-dependent pharmacokinetic
    profile; most participants on the higher (200 mg/day) dose reported
    reduced fatigue and showed improved proximal muscle strength on exam,
    setting the foundation for a subsequent placebo-controlled trial.
  target_phenotypes:
  - preferred_term: Proximal muscle weakness
    term:
      id: HP:0003701
      label: Proximal muscle weakness
  evidence:
  - reference: clinicaltrials:NCT04141670
    reference_title: "Safety and Tolerability of S 48168 (ARM 210) for the Treatment of RYR1-related Myopathies (RYR1-RM)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The study population will include adult patients (≥18 years of age)
      who have demonstrated leaky RyR1 channels that are responsive to
      S48168 (ARM210) ex vivo.
    explanation: >-
      Documents that trial eligibility directly targets the leaky-channel
      (dominant gain-of-function) RYR1 mechanism modeled in this entry.
  - reference: PMID:38318125
    reference_title: "Rycal S48168 (ARM210) for RYR1-related myopathies: a phase one, open-label, dose-escalation trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      S48168 (ARM210) was well-tolerated, did not cause any serious adverse
      events, and exhibited a dose-dependent PK profile. Three of four
      participants who received the 200 mg/day dose reported improvements
      in PROMIS-fatigue at 28 days post-dosing, and also demonstrated
      improved proximal muscle strength on physical examination.
    explanation: >-
      Reports the completed trial's published safety, tolerability, and
      exploratory efficacy findings for the leaky-channel-targeted Rycal
      compound.

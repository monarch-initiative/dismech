      inheritance pattern or documented testing.
- name: KDS
  display_name: King-Denborough Syndrome
  description: >-
    A rare dominant RYR1-related presentation first described in 1973 and
    defined by the triad of dysmorphic features (short stature, pectus
    deformity, joint contractures, facial and skeletal dysmorphism), congenital
    myopathy, and malignant hyperthermia susceptibility.
  genes:
  - preferred_term: RYR1
    term:
      id: hgnc:10483
      label: RYR1
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    description: >-
      Autosomal dominant inheritance with variable expressivity has been
      reported, alongside apparently sporadic/de novo cases.
  evidence:
  - reference: PMID:21514828
    reference_title: "King-Denborough syndrome with and without mutations in the skeletal muscle ryanodine receptor (RYR1) gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      King-Denborough syndrome (KDS), first described in 1973, is a rare
      condition characterised by the triad of dysmorphic features, myopathy,
      and malignant hyperthermia susceptibility (MHS). Autosomal dominant
      inheritance with variable expressivity has been reported in several
      cases.
    explanation: >-
      Primary source defining the King-Denborough syndrome clinical triad and
      its dominant, variably expressive inheritance.
  - reference: PMID:21514828
    reference_title: "King-Denborough syndrome with and without mutations in the skeletal muscle ryanodine receptor (RYR1) gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous missense mutations in RYR1 were uncovered in three out of
      four families, of which one mutation was novel and two have previously
      been reported in MH.
    explanation: >-
      Documents dominant heterozygous RYR1 missense variants, overlapping
      with known MH variants, as the genetic cause in the majority of
      studied King-Denborough syndrome families.
- name: CFTD-RYR1
  display_name: Congenital Fiber-Type Disproportion, RYR1-Related
  description: >-
    A recessive presentation of RYR1-related myopathy on the congenital
    fiber-type disproportion (CFTD) histopathologic spectrum, accounting for
    roughly one-fifth of CFTD cases overall. Features overlap with other
    RYR1-related myopathy subtypes, including hypotonia, non-progressive
    weakness, ophthalmoparesis, and skeletal deformities, and many cases
    later develop cores, rods, or central nuclei that supersede the initial
    CFTD diagnosis.
  genes:
  - preferred_term: RYR1
    term:
      id: hgnc:10483
      label: RYR1
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:33190635
    reference_title: "Ryanodine receptor 1-related disorders: an historical perspective and proposal for a unified nomenclature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RYR1-related CFTD is an autosomal recessive disease accounting for
      about 20% of CFTD cases [59].
    explanation: >-
      Quantifies the RYR1 share of congenital fiber-type disproportion cases
      and confirms its recessive inheritance.
  - reference: PMID:20301436
    reference_title: "Congenital Fiber-Type Disproportion – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      pathogenic variants have been identified in six genes: ACTA1 (~6% of
      individuals with CFTD), MYH7 (unknown), RYR1 (~10%-20%), SELENON
      (SEPN1) (rare), TPM2 (rare), and TPM3 (~20%-25% of individuals with
      CFTD).
    explanation: >-
      GeneReviews chapter (retired, historical reference) corroborating the
      RYR1 share of CFTD cases among the recognized CFTD-causing genes.
pathophysiology:
- name: Shared RyR1 Calcium-Release Dysfunction
  biological_scale: MOLECULAR
  description: >-
    All RYR1-related myopathy mechanisms converge on dysfunction of the RyR1
    homotetrameric calcium-release channel, the principal sarcoplasmic
    reticulum calcium-release channel that mediates excitation-contraction
    coupling in skeletal muscle. Depending on the variant, this dysfunction
    can present as increased or decreased channel activity, or as reduced
    channel abundance.
  genes:
  - preferred_term: RYR1
    term:
      id: hgnc:10483
      label: RYR1
  cell_types:
  - preferred_term: Skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  molecular_functions:
  - preferred_term: Ryanodine-sensitive calcium-release channel activity
    modifier: ABNORMAL
    term:
      id: GO:0005219
      label: ryanodine-sensitive calcium-release channel activity
  evidence:
  - reference: PMID:33190635
    reference_title: "Ryanodine receptor 1-related disorders: an historical perspective and proposal for a unified nomenclature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RYR1-RD result from varying disease pathomechanisms that collectively
      share alterations in a common pathway—intracellular calcium
      dysregulation resulting from primary RyR1 dysfunction (e.g., reduced
      RyR1 expression, leaky RyR1 channels, impaired RyR1 interdomain
      interactions, enhanced sensitivity to modulators, impaired
      excitation-contraction coupling)
    explanation: >-
      Summarizes the shared calcium-release dysfunction that both dominant
      and recessive RYR1 variant classes converge on.
  downstream:
  - target: Dominant RYR1 Gain-of-Function (Leaky Channel) Variants
    description: >-
      Dominant hotspot missense variants render the shared channel
      hyperactive/leaky.
    causal_link_type: DIRECT
  - target: Recessive RYR1 Hypomorphic (Reduced-Expression) Variants
    description: >-
      Recessive variants distributed throughout the gene reduce the
      abundance of the shared channel.
    causal_link_type: DIRECT
- name: Dominant RYR1 Gain-of-Function (Leaky Channel) Variants
  biological_scale: MOLECULAR
  description: >-
    Dominant RYR1-related myopathy is usually caused by heterozygous missense
    variants, historically clustered in three mutational hotspot regions,
    that render the RyR1 channel hypersensitive to activation and prone to
    inappropriate ("leaky") calcium release rather than simply reducing its
    abundance. This is the dominant gain-of-function mechanism requested for
    explicit modeling, and it is the same mechanism underlying malignant
    hyperthermia susceptibility.
  genetic_context:
    functional_impact_category: GAIN_OF_FUNCTION
    variant_origin: GERMLINE
    description: >-
      Heterozygous, typically de novo or dominantly inherited missense
      variants concentrated in RYR1 hotspot domains that decouple channel
      gating from its normal physiological triggers.
  genes:
  - preferred_term: RYR1
    term:
      id: hgnc:10483
      label: RYR1
  cell_types:
  - preferred_term: Skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  molecular_functions:
  - preferred_term: Ryanodine-sensitive calcium-release channel activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0005219
      label: ryanodine-sensitive calcium-release channel activity
  evidence:
  - reference: PMID:33190635
    reference_title: "Ryanodine receptor 1-related disorders: an historical perspective and proposal for a unified nomenclature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      increased sensitivity of RyR1 channels to activators (e.g., caffeine,
      halothane, CaV1.1 voltage sensors) as observed in MH resulting in
      uncontrolled channel opening and Ca2+ release
    explanation: >-
      Describes the dominant gain-of-function mechanism as hypersensitivity
      to physiological and pharmacologic activators plus a resting calcium
      leak, rather than reduced channel abundance.
  downstream:
  - target: SR Calcium Leak and RyR1 Channel Hypersensitivity
    description: >-
      The dominant hotspot missense lesion produces the downstream
      leaky-channel cellular phenotype.
    causal_link_type: DIRECT
- name: SR Calcium Leak and RyR1 Channel Hypersensitivity
  biological_scale: CELLULAR
  description: >-
    The cellular consequence of dominant gain-of-function RYR1 variants:
    hyperactive channels show elevated resting calcium leak and lowered
    threshold for triggered release, raising resting cytosolic calcium
    concentration in skeletal muscle fibers even without an anesthetic or
    exertional trigger.
  cell_types:
  - preferred_term: Skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  - preferred_term: Slow muscle cell (type I fiber)
    term:
      id: CL:0000189
      label: slow muscle cell
  biological_processes:
  - preferred_term: Regulation of SR calcium release
    modifier: INCREASED
    term:
      id: GO:0010880
      label: regulation of release of sequestered calcium ion into cytosol by sarcoplasmic reticulum
  - preferred_term: Calcium ion homeostasis
    modifier: DYSREGULATED
    term:
      id: GO:0055074
      label: calcium ion homeostasis
  evidence:
  - reference: PMID:33190635
    reference_title: "Ryanodine receptor 1-related disorders: an historical perspective and proposal for a unified nomenclature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RyR1 channels with MH- or CCD-associated variants show higher activity
      and sensitivity to activation than wildtype channels, which ultimately
      leads to increases in resting Ca2+ concentration [135, 136].
    explanation: >-
      Directly supports elevated resting calcium as the quantitative
      cellular consequence of the leaky dominant channel, justifying an
      INCREASED modifier on SR calcium release regulation.
  downstream:
  - target: Anesthetic/Stress-Triggered Malignant Hyperthermia Reaction
    description: >-
      A lowered threshold for RyR1 activation creates the substrate for an
      exaggerated calcium release when a susceptible individual is exposed
      to a triggering anesthetic or, more rarely, extreme exertion/heat.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - volatile anesthetic or succinylcholine exposure
    - uncontrolled sarcoplasmic reticulum calcium release
  - target: Oxidative and Nitrosative Stress
    description: >-
      Chronic elevation of resting cytosolic and mitochondrial calcium from
      the leaky channel drives excessive mitochondrial reactive oxygen
      species production.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - chronic disturbance of intracellular calcium homeostasis
    - increased mitochondrial calcium uptake
  - target: Skeletal Muscle Structural Remodeling and Weakness
    description: >-
      Chronic disturbance of calcium homeostasis at rest contributes to
      focal structural and metabolic change in muscle fibers (e.g., central
      core formation) and to baseline proximal weakness even without an
      anesthetic trigger.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - chronic disturbance of intracellular calcium homeostasis
    - mitochondrial and metabolic stress in affected fibers
- name: Oxidative and Nitrosative Stress
  biological_scale: CELLULAR
  description: >-
    Chronic disturbance of calcium homeostasis from either the dominant
    leaky-channel or recessive uncoupling mechanism drives excessive
    mitochondrial calcium uptake and reactive oxygen species production in
    skeletal muscle fibers, producing a secondary oxidative/nitrosative
    stress state that can further damage RyR1 and muscle fibers. This is
    the mechanism directly targeted by antioxidant (N-acetylcysteine)
    therapy, tested in the NCT02362425 clinical trial.
  cell_types:
  - preferred_term: Skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  cellular_components:
  - preferred_term: mitochondrion
    term:
      id: GO:0005739
      label: mitochondrion
  biological_processes:
  - preferred_term: Reactive oxygen species metabolic process
    modifier: INCREASED
    term:
      id: GO:0072593
      label: reactive oxygen species metabolic process
  - preferred_term: Response to oxidative stress
    modifier: INCREASED
    term:
      id: GO:0006979
      label: response to oxidative stress
  evidence:
  - reference: PMID:22418739
    reference_title: "Oxidative stress and successful antioxidant treatment in models of RYR1-related myopathy."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Subsequent studies focused on oxidative stress in relatively relaxed
      zebrafish and RYR1-related myopathy myotubes and demonstrated
      increased oxidant activity, the presence of oxidative stress markers,
      excessive production of oxidants by mitochondria and diminished
      survival under oxidant conditions.
    explanation: >-
      Zebrafish disease-model data directly demonstrating increased oxidant
      activity and mitochondrial oxidant production in RYR1-related
      myopathy, supporting the INCREASED modifier on reactive oxygen
      species metabolism.
  - reference: PMID:22418739
    reference_title: "Oxidative stress and successful antioxidant treatment in models of RYR1-related myopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Exposure to the antioxidant N-acetylcysteine reduced oxidative stress
      and improved survival in the RYR1-related myopathies human myotubes
      ex vivo
    explanation: >-
      Patient-myotube (in vitro) data confirming the oxidative-stress
      mechanism this node models and motivating N-acetylcysteine as a
      mechanism-targeted therapy (though the subsequent clinical trial,
      NCT02362425, did not confirm clinical benefit).
  - reference: PMID:33190635
    reference_title: "Ryanodine receptor 1-related disorders: an historical perspective and proposal for a unified nomenclature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Alterations in calcium homeostasis can also lead to secondary
      cellular dysfunction including increased oxidative/nitrosative
      stress, altered post-translational modifications, mitochondrial
      damage, and disrupted protein-protein/ligand interactions
    explanation: >-
      Establishes that oxidative/nitrosative stress is a shared secondary
      mechanism downstream of calcium dysregulation from both the dominant
      and recessive RYR1 variant classes, not exclusive to one branch.
  downstream:
  - target: Skeletal Muscle Structural Remodeling and Weakness
    description: >-
      Oxidative damage to RyR1 and to skeletal muscle fibers amplifies the
      structural and functional consequences of the primary calcium-release
      defect.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - excessive mitochondrial reactive oxygen species production
    - oxidative damage to RyR1 and contractile proteins
- name: Recessive RYR1 Hypomorphic (Reduced-Expression) Variants
  biological_scale: MOLECULAR
  description: >-
    Recessive RYR1-related myopathy arises from biallelic variants
    distributed throughout the gene, including nonsense and splice variants,
    that reduce RyR1 protein abundance rather than altering channel gating
    per se. This is the recessive hypomorphic mechanism requested for
    explicit modeling, mechanistically distinct from the dominant
    gain-of-function/leaky-channel class above.
  genetic_context:
    functional_impact_category: PARTIAL_LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    description: >-
      Biallelic (homozygous or compound heterozygous) nonsense, frameshift,
      splice-site, or missense variants distributed throughout the RYR1
      coding sequence, expected to reduce RyR1 protein abundance rather than
      abolish it completely (a complete RYR1 null is not compatible with the
      surviving recessive phenotype).
  genes:
  - preferred_term: RYR1

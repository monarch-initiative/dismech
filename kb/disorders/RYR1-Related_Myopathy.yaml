- population: Genetic susceptibility to malignant hyperthermia (allelic dominant RYR1 variants)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 250.0
  notes: >-
    MH-susceptibility genetic variants (mostly dominant RYR1) are far more
    common than clinically overt RYR1-related myopathy; exome-based
    estimates range up to 1 in 400 individuals.
  evidence:
  - reference: PMID:33190635
    reference_title: "Ryanodine receptor 1-related disorders: an historical perspective and proposal for a unified nomenclature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      genetic variants resulting in MH susceptibility are more common,
      affecting approximately 1:3000–1:8500
    explanation: >-
      Documents that MH-susceptibility RYR1 variants are much more prevalent
      than overt myopathy, consistent with incomplete penetrance of the
      dominant leaky-channel mechanism.
inheritance:
- name: Autosomal dominant (leaky channel / gain-of-function)
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Dominant RYR1-related myopathy is usually caused by heterozygous missense
    variants, historically clustered in three hotspot regions of the channel,
    that render the RyR1 channel hyperactive/leaky rather than reducing its
    abundance. This is the mechanism also responsible for the allelic
    malignant hyperthermia susceptibility trait.
  evidence:
  - reference: PMID:33190635
    reference_title: "Ryanodine receptor 1-related disorders: an historical perspective and proposal for a unified nomenclature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RYR1 variations resulting in CCD and MH susceptibility were initially
      reported to primarily localize in three "hot spot" regions (or
      domains): domain 1 (N-terminal residues 1–614), domain 2 (central
      residues 2163–2458), and domain 3 (C-terminal pore/transmembrane
      residues 4136–4973) [3, 56].
    explanation: >-
      Establishes the classic hotspot-domain distribution of dominant RYR1
      variants.
- name: Autosomal recessive (RyR1 deficiency / hypomorphic)
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Recessive RYR1-related myopathy reflects biallelic variants distributed
    throughout the gene, including nonsense and splice variants, that reduce
    RyR1 protein abundance. It is typically more clinically severe than
    dominant disease.
  evidence:
  - reference: PMID:22473935
    reference_title: "Clinical and genetic findings in a large cohort of patients with ryanodine receptor 1 gene-associated myopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Recessive mutations included nonsense and splice mutations expected to
      result in reduced RyR1 protein.
    explanation: >-
      Documents the reduced-expression mechanism underlying recessive
      RYR1-related myopathy.
  - reference: PMID:33190635
    reference_title: "Ryanodine receptor 1-related disorders: an historical perspective and proposal for a unified nomenclature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MmD and recessive forms of CCD exhibit a marked reduction in RyR1
      protein expression [186].
    explanation: >-
      Confirms markedly reduced RyR1 protein expression as the recessive
      disease mechanism across the multiminicore and central core spectrum.
has_subtypes:
- name: Dominant RYR1-Related Myopathy
  display_name: Dominant (leaky-channel) RYR1-related myopathy spectrum
  description: >-
    The dominant end of the RYR1-related myopathy spectrum, driven by
    hyperactive/leaky RyR1 channels rather than reduced channel abundance.
    Typically milder than recessive disease, with proximal weakness,
    hypotonia, and orthopedic complications, and it carries clinically
    important malignant hyperthermia susceptibility. Includes autosomal
    dominant central core disease (see the AD-CCD subtype of
    Central_Core_Myopathy.yaml for full curation).
  children:
  - MHS1
  - KDS
  genes:
  - preferred_term: RYR1
    term:
      id: hgnc:10483
      label: RYR1
  inheritance:
  - name: Autosomal dominant
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:22473935
    reference_title: "Clinical and genetic findings in a large cohort of patients with ryanodine receptor 1 gene-associated myopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Dominant mutations, typically missense, were frequently located in
      recognized mutational hotspot regions, while recessive mutations were
      distributed throughout the entire coding sequence.
    explanation: >-
      Defines the dominant RYR1 mutation class distinguishing it from
      recessive disease.
- name: Recessive RYR1-Related Myopathy
  display_name: Recessive (RyR1-deficiency) RYR1-related myopathy spectrum
  description: >-
    The recessive end of the RYR1-related myopathy spectrum, driven by
    reduced RyR1 protein abundance and excitation-contraction uncoupling
    rather than channel hyperactivity. Generally more severe than dominant
    disease, with earlier onset, greater weakness, and enrichment for
    extraocular, bulbar, and respiratory involvement. Includes recessive
    central core disease (AR-CCD in Central_Core_Myopathy.yaml), the RYR1
    subtype of multiminicore disease (Multiminicore_Disease.yaml), and
    RYR1-related centronuclear myopathy (RYR1-CNM in
    Centronuclear_Myopathy.yaml).
  children:
  - CFTD-RYR1
  genes:
  - preferred_term: RYR1
    term:
      id: hgnc:10483
      label: RYR1
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:22473935
    reference_title: "Clinical and genetic findings in a large cohort of patients with ryanodine receptor 1 gene-associated myopathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As a group, dominant mutations were associated with milder phenotypes;
      patients with recessive inheritance had earlier onset, more weakness,
      and functional limitations.
    explanation: >-
      Documents the more severe clinical course of recessive RYR1-related
      myopathy relative to dominant disease.
  - reference: PMID:33190635
    reference_title: "Ryanodine receptor 1-related disorders: an historical perspective and proposal for a unified nomenclature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of the nine genes currently associated with CNM (RYR1, MTM1, DNM2,
      BIN1, TTN, MTMR14, SPEG, CCDC78, and CACNA1S), RYR1 variants are the
      most common cause of autosomal recessive CNM [28].
    explanation: >-
      Cross-references RYR1 as the most common cause of recessive
      centronuclear myopathy, curated fully in Centronuclear_Myopathy.yaml.
- name: MHS1

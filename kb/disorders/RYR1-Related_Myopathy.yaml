- name: In vitro caffeine-halothane contracture test for malignant hyperthermia susceptibility
  description: >-
    The reference diagnostic test for malignant hyperthermia susceptibility,
    determining muscle contracture thresholds in response to caffeine and
    halothane on a fresh open muscle biopsy specimen. It is invasive and can
    yield false negatives, and because MH susceptibility is under-penetrant
    and lacks a single common causative variant, all RYR1-related myopathy
    patients are managed as potentially MH susceptible regardless of test or
    genotype status.

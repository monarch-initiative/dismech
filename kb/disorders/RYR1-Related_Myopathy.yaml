  rate_per_100000: 250.0
  notes: >-
    MH-susceptibility genetic variants (mostly dominant RYR1) are far more
    common than clinically overt RYR1-related myopathy; exome-based
    estimates range up to 1 in 400 individuals.
  evidence:
  - reference: PMID:33190635
    reference_title: "Ryanodine receptor 1-related disorders: an historical perspective and proposal for a unified nomenclature."
    supports: SUPPORT

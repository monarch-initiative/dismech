        id: HP:0000006
        label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:33190635
    reference_title: "Ryanodine receptor 1-related disorders: an historical perspective and proposal for a unified nomenclature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CCD is considered allelic to MH susceptibility, which is also
      predominantly associated with a dominant mode of inheritance
    explanation: >-
      Establishes the allelic relationship between the myopathy-causing
      dominant variants and the malignant hyperthermia susceptibility trait.
  - reference: PMID:30406384
    reference_title: "Ryanodine Receptor 1-Related Myopathies: Diagnostic and Therapeutic Approaches."

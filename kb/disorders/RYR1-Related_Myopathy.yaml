- name: RyR1 Deficiency and Excitation-Contraction Uncoupling
  biological_scale: CELLULAR
  description: >-
    The cellular consequence of recessive hypomorphic RYR1 variants: a
    reduced functional channel pool at the triad lowers RyR1-mediated
    calcium permeation and Cav1.1-dependent SR calcium release, uncoupling
    membrane depolarization from calcium-triggered contraction. This
    contrasts with the dominant leaky-channel mechanism and explains the
    generally greater clinical severity of recessive disease.
  cell_types:
  - preferred_term: Skeletal muscle fiber
    term:
      id: CL:0008002
      label: skeletal muscle fiber
  biological_processes:
  - preferred_term: Regulation of skeletal muscle contraction by calcium signaling
    modifier: DECREASED
    term:
      id: GO:0014722
      label: regulation of skeletal muscle contraction by calcium ion signaling
  - preferred_term: Regulation of SR calcium release
    modifier: DECREASED
    term:
      id: GO:0010880
      label: regulation of release of sequestered calcium ion into cytosol by sarcoplasmic reticulum
  evidence:
  - reference: PMID:33190635
    reference_title: "Ryanodine receptor 1-related disorders: an historical perspective and proposal for a unified nomenclature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      reduction in RyR1 Ca2+ permeation leading to reduced Cav1.1-mediated
      SR Ca2+ release, a process referred to as excitation-contraction
      uncoupling
    explanation: >-
      Defines excitation-contraction uncoupling as the mechanistic
      consequence of reduced RyR1 channel expression, directly supporting a
      DECREASED modifier on the calcium-release and contraction-regulation
      processes.
  downstream:
  - target: Oxidative and Nitrosative Stress
    description: >-
      Impaired excitation-contraction coupling and the resulting metabolic
      strain likewise drive secondary mitochondrial oxidative stress,
      convergent with the dominant leaky-channel branch.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - impaired excitation-contraction coupling
    - compensatory metabolic and mitochondrial strain
  - target: Skeletal Muscle Structural Remodeling and Weakness
    description: >-
      Uncoupling lowers calcium-dependent activation of contraction,
      producing more pronounced congenital weakness, ophthalmoplegia, and
      respiratory involvement than in dominant disease.
    causal_link_type: DIRECT
- name: Anesthetic/Stress-Triggered Malignant Hyperthermia Reaction
  biological_scale: ORGANISM
  description: >-
    In individuals carrying dominant leaky-channel RYR1 variants (and,
    rarely, some recessive genotypes), exposure to volatile anesthetics or
    succinylcholine triggers uncontrolled sarcoplasmic-reticulum calcium
    release, driving sustained muscle contraction, hypermetabolism,
    hyperthermia, and rhabdomyolysis. Fully modeled in
    Malignant_Hyperthermia_of_Anesthesia.yaml; represented here at a
    summary level to connect it explicitly to the shared dominant
    leaky-channel node. Exercise and hot environments are recognized
    non-anesthetic triggers of the same reaction in susceptible
    individuals.
  triggers:
  - preferred_term: exposure to anesthetics
    term:
      id: ECTO:2000059
      label: exposure to anesthetics
  - preferred_term: exposure to exercise
    term:
      id: ECTO:6000002
      label: exposure to exercise
  - preferred_term: exposure to high temperature environment
    term:
      id: ECTO:1000007
      label: exposure to high temperature environment
  evidence:

    reference_title: "Ryanodine receptor 1-related disorders: an historical perspective and proposal for a unified nomenclature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RYR1-related CFTD is an autosomal recessive disease accounting for
      about 20% of CFTD cases [59].
    explanation: >-
      Quantifies the RYR1 share of congenital fiber-type disproportion cases
      and confirms its recessive inheritance.
  - reference: PMID:20301436
    reference_title: "Congenital Fiber-Type Disproportion – RETIRED CHAPTER, FOR HISTORICAL REFERENCE ONLY."

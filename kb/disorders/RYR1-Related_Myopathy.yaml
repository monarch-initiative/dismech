name: RYR1-Related Myopathy
creation_date: "2026-08-26T00:00:00Z"
category: Mendelian
description: >-
  RYR1-related myopathy is the umbrella term for the clinically and
  histopathologically heterogeneous group of skeletal-muscle disorders caused
  by pathogenic variants in RYR1, the gene encoding the type 1 ryanodine
  receptor (RyR1), the principal sarcoplasmic reticulum (SR) calcium-release
  channel that couples membrane depolarization to muscle contraction
  (excitation-contraction coupling). Two broadly distinct, allele-dependent
  mechanisms converge on this shared channel: dominant, typically hotspot
  missense variants that produce a hyperactive or "leaky" channel with
  exaggerated or inappropriate SR calcium release, and recessive,
  loss-of-function or hypomorphic variants that reduce RyR1 protein
  abundance and impair excitation-contraction coupling. The resulting
  clinical and histopathologic spectrum overlaps substantially and includes
  central core disease, multiminicore disease, centronuclear myopathy,
  congenital fiber-type disproportion, and King-Denborough syndrome, as well
  as the pharmacogenetic malignant hyperthermia susceptibility trait, which
  is allelic with the myopathy-causing dominant variants. This entry models
  the RYR1-related myopathy spectrum at the root/umbrella level; see the
  Central_Core_Myopathy, Multiminicore_Disease, and Centronuclear_Myopathy
  entries for full curation of those individually named histopathologic
  entities, and the Malignant_Hyperthermia_of_Anesthesia entry for full
  curation of the general (non-syndromic) susceptibility trait.
synonyms:
- RYR1-related disease
- RYR1-related disorder
- RYR1-related myopathies
- RYR1-related disorders

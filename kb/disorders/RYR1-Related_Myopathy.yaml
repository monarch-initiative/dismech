    delayed motor milestones, hypotonia, proximal or generalized weakness,
    and orthopedic complications, together with anesthetic and family
    history. Dominant disease tends to be milder; recessive disease can
    present with severe neonatal, bulbar, ophthalmoplegic, or respiratory
    involvement.

genetic:
- name: RYR1
  association: Causative
  gene_term:
    preferred_term: RYR1
    description: >-
      Ryanodine receptor 1, encoding a homotetrameric calcium release channel
      of 5,038 amino acids that maps to chromosome 19q13.2 and is the
      principal skeletal muscle sarcoplasmic reticulum calcium release
      channel fundamental to excitation-contraction coupling. It is the
      sole causative gene for this MONDO umbrella entity and the most
      frequent genetic cause of congenital myopathy overall.
    term:
      id: hgnc:10483
      label: RYR1
  notes: >-
    Nearly 700 RYR1 variants have been identified to date, spanning the full
    coding sequence. Dominant variants are enriched in three historically
    recognized hotspot domains but have since been documented across the
    entire gene; recessive variants are distributed throughout the coding
    sequence and are expected to reduce RyR1 protein abundance.
  evidence:
  - reference: PMID:33190635
    reference_title: "Ryanodine receptor 1-related disorders: an historical perspective and proposal for a unified nomenclature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathogenic variations in the RYR1 gene, a relatively large gene in the
      human genome, are the most common cause of CM and contribute to the
      clinical, histopathological, and genetic heterogeneity of CMs.
    explanation: >-
      Establishes RYR1 as the most common cause of congenital myopathy and
      the source of its heterogeneity.
  - reference: PMID:33190635
    reference_title: "Ryanodine receptor 1-related disorders: an historical perspective and proposal for a unified nomenclature."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      With nearly 700 RYR1 variations identified to date
    explanation: >-
      Documents the scale of the RYR1 allelic series and the diagnostic
      impact of genome-wide sequencing coverage of the gene.

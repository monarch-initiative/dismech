      ophthalmoplegia, and moderate to severe respiratory insufficiency,
      which is more often apparent in recessive cases [22–24].
    explanation: >-
      Defines the clinical presentation that prompts diagnostic evaluation
      across the RYR1-related myopathy spectrum.
- name: Muscle biopsy and histopathology
  description: >-
    Muscle biopsy with oxidative enzyme histochemistry and electron
    microscopy identifies the histopathologic subtype (central cores,
    multi-minicores, central nuclei, core-rod features, or fiber-type
    disproportion), though these features are not fully specific to RYR1 and
    can be dynamic over time or absent on early biopsy.
  diagnosis_term:

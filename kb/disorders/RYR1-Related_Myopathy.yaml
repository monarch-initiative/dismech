    reference_title: "Ryanodine Receptor 1-Related Myopathies: Diagnostic and Therapeutic Approaches."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MH (MIM# 145600) is a potentially lethal hypermetabolic condition
      triggered by exposure of susceptible individuals to certain volatile
      anesthetics and muscle relaxants.
    explanation: >-
      Defines the anesthetic-triggered malignant hyperthermia mechanism

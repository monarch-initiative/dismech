discussions:
- discussion_id: oud_tolerance_molecular_basis
  kind: KNOWLEDGE_GAP
  prompt: >-
    What molecular processes actually account for the loss of mu-opioid
    receptor function after chronic opioid exposure, given that acute
    desensitization and internalization do not fully explain clinical
    tolerance?
  attaches_to:
  - pathophysiology#Mu-Opioid Receptor Desensitization and Tolerance
  rationale: >-
    The authoritative review of MOR regulation states plainly that while some
    regulatory mechanisms contributing to tolerance are understood, there are
    large gaps in understanding the molecular processes responsible for loss of
    receptor function after chronic exposure. This matters beyond mechanism:
    tolerance to analgesia and to respiratory depression diverge, and that
    divergence is what makes the post-abstinence overdose spike so lethal.
  proposed_experiments:
  - experiment_id: exp_oud_phosphosite_tolerance
    name: Phosphorylation-site mutant models separating acute desensitization from chronic tolerance
    description: >-
      Use knock-in models with defined MOR phosphorylation-site mutations to
      test which receptor regulatory events are required for chronic analgesic
      tolerance versus acute desensitization, and whether the same events
      govern tolerance to respiratory depression.
  - experiment_id: exp_oud_respiratory_tolerance_divergence
    name: Direct comparison of analgesic and respiratory tolerance time courses
    description: >-
      Measure the development and loss of tolerance to analgesia and to
      respiratory depression in parallel within the same subjects, to
      characterize the divergence that underlies overdose risk after a period
      of abstinence.
- discussion_id: oud_negative_affect_model_fidelity
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Do the rodent operationalizations of hyperkatifeia — elevated reward
    thresholds, lowered pain thresholds, anxiety-like and dysphoric-like
    behaviour — correspond to the negative emotional state that drives relapse
    in people with opioid use disorder?
  attaches_to:
  - pathophysiology#Reward-System Downregulation and Hyperkatifeia
  rationale: >-
    The evidence for the negative-affect stage is largely from extended-access
    animal models, where the state is inferred from reward thresholds and
    behavioural assays. Human hyperkatifeia is assessed by self-report of
    dysphoria and craving. The construct is plausible and clinically resonant,
    but the measurement bridge between the two species is an assumption rather
    than a demonstrated equivalence.
  proposed_experiments:
  - experiment_id: exp_oud_human_reward_threshold
    name: Human reward-sensitivity measurement across withdrawal and protracted abstinence
    description: >-
      Track objective reward sensitivity (effort-based decision making,
      monetary incentive delay fMRI) alongside self-reported dysphoria in
      people with OUD from acute withdrawal into protracted abstinence, to test
      whether a measurable reward deficit tracks the subjective state.
  - experiment_id: exp_oud_relapse_prediction
    name: Prospective test of negative affect as a relapse predictor
    description: >-
      Determine whether the magnitude of the negative-affect state during early
      abstinence prospectively predicts relapse, which is the claim the
      negative-reinforcement model makes and that animal work cannot establish.
- discussion_id: oud_tlr4_glial_human_translation
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    Does the TLR4/microglial arm that opposes opioid analgesia and drives
    tolerance, hyperalgesia, and withdrawal in rodents operate at a clinically
    meaningful magnitude in people with opioid use disorder?
  attaches_to:
  - pathophysiology#Opioid-Induced TLR4 and Microglial Neuroimmune Activation
  rationale: >-
    The rodent and in vitro evidence for this node is strong and convergent —
    non-stereoselective TLR4 activation in vitro, pharmacological blockade
    attenuating tolerance, hyperalgesia and withdrawal in vivo, and a
    dose-response shift in TLR4 knockout mice. The human evidence is not.
    The one human interventional test cited here, a placebo-controlled inpatient
    study of the glial modulator ibudilast in opioid-dependent volunteers, was
    null on its prespecified withdrawal-severity outcome and positive only in an
    exploratory pooled analysis of individual subscale items. A second
    constraint comes from the rodent work itself: TLR4 dependence was
    demonstrated for low-dose morphine, while high-dose morphine effects were
    neither TLR4- nor PKCepsilon-dependent, so the arm may not be engaged at the
    doses that characterize opioid use disorder. Until an adequately powered
    trial of a glial or TLR4-directed agent shows an effect on a prespecified
    clinical endpoint, this node should be read as a mechanism established in
    animals and only weakly corroborated in humans.
  proposed_experiments:
  - experiment_id: exp_oud_tlr4_powered_trial
    name: Adequately powered trial of a TLR4-directed or glial-modulating agent in OUD
    description: >-
      Test a TLR4 antagonist or glial modulator against placebo in people with
      opioid use disorder, powered on a single prespecified clinical endpoint
      (withdrawal severity, or opioid dose required for analgesia), so the
      result does not depend on exploratory subscale analysis.
  - experiment_id: exp_oud_tlr4_dose_range
    name: Dose-ranging test of TLR4 dependence at OUD-relevant exposures
    description: >-
      Establish whether the TLR4 arm is engaged across the full opioid dose
      range or only at low doses, since the demonstrated dose-dependence in
      rodents determines whether the mechanism is relevant to the high-exposure
      pattern of opioid use disorder at all.
- discussion_id: oud_epigenetic_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    Do chronic-opioid-associated DNA methylation changes represent a causal
    mechanism in opioid use disorder, a durable biomarker of exposure, or
    neither?
  attaches_to:
  - pathophysiology#Polygenic Susceptibility to Opioid Addiction
  - pathophysiology#Mu-Opioid Receptor Desensitization and Tolerance
  rationale: >-
    An epigenetic arm is frequently asserted for opioid use disorder, and this
    entry deliberately does not model one, because the primary evidence does not
    currently support a mechanism node. The best-known positive finding is
    OPRM1 promoter hypermethylation at two CpG sites in *lymphocytes* of
    methadone-maintained former heroin addicts — a peripheral tissue, with the
    consequence for receptor expression stated by the authors only as a
    possibility. The one epigenome-wide study in the tissue that matters,
    postmortem dorsolateral prefrontal cortex, found no CpG site surviving
    false-discovery-rate correction. Direction of causation is also open: these
    are cross-sectional comparisons of people with long exposure histories, so a
    methylation difference is at least as easily read as a consequence of
    exposure as a cause of the disorder. Curating an epigenetic node from
    review-level synthesis would overstate all of this.
  evidence:
  - reference: PMID:18650805
    reference_title: "Increased OPRM1 DNA methylation in lymphocytes of methadone-maintained former heroin addicts."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Direct sequencing of bisulfite-treated DNA showed that the percent
      methylation at two CpG sites was significantly associated with heroin
      addiction.
    explanation: >-
      The strongest positive primary finding, but measured in lymphocytes rather
      than brain, so it supports an association and not a CNS mechanism.
  - reference: PMID:18650805
    reference_title: "Increased OPRM1 DNA methylation in lymphocytes of methadone-maintained former heroin addicts."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Methylation of these CpG sites may lead to reduced OPRM1 expression in the
      lymphocytes of these former heroin addicts.
    explanation: >-
      The authors state the functional consequence as a possibility, not a
      measurement, which is exactly the step this gap records as missing.
  - reference: PMID:33667780
    reference_title: Epigenome-wide study of brain DNA methylation following acute opioid intoxication.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although no CpG sites survived false-discovery rate correction for
      multiple testing, 13 sites surpassed a relaxed significance threshold
    explanation: >-
      The epigenome-wide result in brain tissue is null at the conventional
      threshold, which is the central reason no epigenetic mechanism node is
      curated in this entry.
  - reference: PMID:33667780
    reference_title: Epigenome-wide study of brain DNA methylation following acute opioid intoxication.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Current evidence, however, is mostly limited to candidate gene analysis in
      whole blood.
    explanation: >-
      Characterizes the state of the field, and the tissue-relevance problem
      this gap turns on.
  proposed_experiments:
  - experiment_id: exp_oud_ewas_powered_brain
    name: Adequately powered brain EWAS with cell-type deconvolution
    description: >-
      Repeat the epigenome-wide analysis in postmortem brain at a sample size
      powered to survive multiple-testing correction, with cell-type
      deconvolution, so that a null result is informative rather than
      underpowered.
  - experiment_id: exp_oud_longitudinal_methylation
    name: Longitudinal methylation sampling across exposure and abstinence
    description: >-
      Sample methylation before, during, and after sustained opioid exposure in
      the same individuals to distinguish a pre-existing risk mark from an
      exposure-induced change, which no cross-sectional case-control design can
      do.
  - experiment_id: exp_oud_methylation_expression_link
    name: Test whether the OPRM1 CpG marks actually alter receptor expression
    description: >-
      Directly measure OPRM1 expression against methylation at the -18 and +84
      CpG sites, in both lymphocytes and brain, to test the mechanism the
      original study could only propose.

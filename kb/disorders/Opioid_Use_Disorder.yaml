- category: Neurologic
  name: Insomnia
  description: Sleep disturbance during withdrawal and protracted abstinence.
  phenotype_term:
    preferred_term: Insomnia
    term:
      id: HP:0100785
      label: Insomnia
  evidence:
  - reference: PMID:31400808
    reference_title: "Neurobiology of Opioid Addiction: Opponent Process, Hyperkatifeia, and Negative Reinforcement."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Hyperkatifeia can extend into protracted abstinence and interact with
      learning processes in the form of conditioned withdrawal to facilitate
      relapse to compulsive-like drug seeking.
    explanation: >-
      Supports persistence of withdrawal-associated symptoms into protracted
      abstinence; insomnia specifically is not enumerated.
- category: Behavioral
  name: Anxiety
  description: >-
    Anxiety in acute withdrawal and persisting as part of the negative
    emotional state of protracted abstinence.
  phenotype_term:
    preferred_term: Anxiety
    term:
      id: HP:0000739
      label: Anxiety
  evidence:
  - reference: PMID:31400808
    reference_title: "Neurobiology of Opioid Addiction: Opponent Process, Hyperkatifeia, and Negative Reinforcement."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In animal models, repeated extended access to drugs or opioids results in
      negative emotion-like states, reflected by the elevation of reward
      thresholds, lower pain thresholds, anxiety-like behavior, and
      dysphoric-like responses.
    explanation: >-
      Anxiety-like behaviour is a measured component of the opioid
      negative-affect state in animal models.
- category: Behavioral
  name: Depression
  description: >-
    Dysphoria and anhedonia during withdrawal and protracted abstinence, part
    of the hyperkatifeia construct.
  phenotype_term:
    preferred_term: Depression
    term:
      id: HP:0000716
      label: Depression
  evidence:
  - reference: PMID:31400808
    reference_title: "Neurobiology of Opioid Addiction: Opponent Process, Hyperkatifeia, and Negative Reinforcement."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In animal models, repeated extended access to drugs or opioids results in
      negative emotion-like states, reflected by the elevation of reward
      thresholds, lower pain thresholds, anxiety-like behavior, and
      dysphoric-like responses.
    explanation: >-
      Dysphoric-like responses and elevated reward thresholds are the
      preclinical correlates of the depressive component.
- category: Neurologic
  name: Increased Pain Sensitivity
  description: >-
    Opioid-induced hyperalgesia: paradoxically increased sensitivity to painful
    stimuli caused by opioid exposure itself.
  phenotype_term:
    preferred_term: Pain
    term:
      id: HP:0012531
      label: Pain
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:21412369
    reference_title: A comprehensive review of opioid-induced hyperalgesia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The condition is characterized by a paradoxical response whereby a
      patient receiving opioids for the treatment of pain could actually become
      more sensitive to certain painful stimuli.
    explanation: >-
      Describes the increased pain sensitivity this phenotype records.
- category: Gastrointestinal
  name: Constipation
  description: >-
    Opioid-induced bowel dysfunction. Distinctive in that tolerance to it
    develops poorly, so it persists for as long as the opioid is taken.
  phenotype_term:
    preferred_term: Constipation
    term:
      id: HP:0002019
      label: Constipation
    temporality: CHRONIC
  evidence:
  - reference: PMID:28034973
    reference_title: "Opioid-Induced Constipation and Bowel Dysfunction: A Clinical Guideline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Constipation is a major untoward effect of opioids. Increasing
      prescription of opioids has correlated to increased incidence of
      opioid-induced constipation.
    explanation: >-
      Evidence-based clinical guideline establishing constipation as a major
      opioid adverse effect and linking its incidence to opioid prescribing.
  - reference: PMID:28034973
    reference_title: "Opioid-Induced Constipation and Bowel Dysfunction: A Clinical Guideline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, the inhibitory effects of opioids are not confined to the colon,
      but also affect higher segments of the gastrointestinal tract
    explanation: >-
      Supports the broader bowel-dysfunction framing used in this phenotype's
      description rather than constipation alone.
- category: Endocrine
  name: Hypogonadism
  description: >-
    Opioid-induced androgen deficiency from suppression of the
    hypothalamic-pituitary-gonadal axis with chronic use.
  phenotype_term:
    preferred_term: Hypogonadism
    term:
      id: HP:0000135
      label: Hypogonadism
    temporality: CHRONIC
  evidence:
  - reference: PMID:22786453
    reference_title: Opioid-induced androgen deficiency (OPIAD).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Accompanying this upsurge in the use of long-term opioid therapy has been
      an increase in the occurrence of opioid associated endocrinopathy, most
      commonly manifested as an androgen deficiency and therefore referred to
      as opioid associated androgen deficiency (OPIAD).
    explanation: >-
      Establishes androgen deficiency as the characteristic endocrinopathy of
      long-term opioid therapy.
  - reference: PMID:22786453
    reference_title: Opioid-induced androgen deficiency (OPIAD).
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This syndrome is characterized by the presence of inappropriately low
      levels of gonadotropins (follicle stimulating hormone and luteinizing
      hormone) leading to inadequate production of sex hormones, particularly
      testosterone.
    explanation: >-
      Specifies the hypogonadotropic mechanism, which is what makes this a
      central rather than a primary hypogonadism.
- category: Neurologic
  name: Sedation
  description: >-
    Somnolence, lethargy, and reduced alertness during opioid exposure. It is
    the mildest point on the same dose-related CNS-depression continuum that
    ends in respiratory depression and coma, and it is one of the commonest
    reasons opioid therapy is stopped.
  phenotype_term:
    preferred_term: Sedation
    term:
      id: HP:0002329
      label: Drowsiness
  evidence:
  - reference: PMID:26461075
    reference_title: Cognitive Effects and Sedation.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cognitive effects and sedation (CES) are prevalent in chronic nonmalignant
      pain populations receiving long-term opioid therapy and are among the most
      common reasons patients discontinue opioid use.
    explanation: >-
      Establishes sedation as a prevalent and clinically consequential effect of
      sustained opioid exposure.
  - reference: PMID:26461075
    reference_title: Cognitive Effects and Sedation.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      The most prevalent CES include: memory deficits (73-81%), sleep
      disturbance (35-57%), and fatigue (10%).
    explanation: >-
      Gives the only prevalence figures available here, but they are for a
      long-term-opioid-therapy chronic-pain population rather than for a
      diagnosed opioid use disorder cohort, so no `frequency` band is asserted
      from them.
  notes: >-
    The quantitative evidence for this phenotype comes from chronic-pain
    populations on long-term opioid therapy, not from OUD cohorts. That is a
    different population with a different dose and exposure pattern, so the
    phenotype is curated without a `frequency` value rather than importing the
    chronic-pain prevalence as if it were an OUD frequency.
- category: Neurologic
  name: Cognitive Impairment
  description: >-
    Slowing and impairment across attention, executive function, verbal
    fluency, and memory. Distinct from sedation, though the two co-occur and
    are commonly reported together; the deficits are measurable on formal
    neuropsychological testing in patients stabilized on opioid agonist
    therapy, i.e. they are not merely an acute intoxication effect.
  phenotype_term:
    preferred_term: Cognitive slowing and impairment
    term:
      id: HP:0100543
      label: Cognitive impairment
  evidence:
  - reference: PMID:26885347
    reference_title: Assessment of Cognitive Functions in Methadone Maintenance Patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MMP performed significantly poorly than controls in cognitive domains of
      verbal fluency, executive function, and verbal memory.
    explanation: >-
      Primary case-control neuropsychological data in methadone-maintained
      patients, which is the OUD-relevant population rather than a chronic-pain
      one.
  - reference: PMID:26885347
    reference_title: Assessment of Cognitive Functions in Methadone Maintenance Patients.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      MMP did not exhibit impairment in working memory, and TMT Part A compared
      to controls.
    explanation: >-
      A negative result within the same study, which bounds the claim: the
      impairment is domain-selective rather than global.
  - reference: PMID:26461075
    reference_title: Cognitive Effects and Sedation.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Conclusions about the neuropsychological domains affected by opioids are
      limited due to the heterogeneity of studies and methodological issues.
    explanation: >-
      The review states plainly that the literature does not support firm
      domain-level conclusions, which is why no severity or frequency is
      asserted here.
  notes: >-
    Attribution is genuinely unresolved. The cited cohort is
    methadone-maintained, so opioid exposure, prior illicit use, and the
    comorbidities that accompany OUD are all confounded; the study design
    cannot separate them. The phenotype is curated as an observed association
    with opioid-treated OUD, not as a demonstrated pharmacological effect of
    opioids alone.
- category: Immunologic
  name: Opioid-Associated Immunosuppression
  description: >-
    Suppression of innate immune effector function during opioid exposure, with
    an associated increase in serious infection risk. Mu-opioid receptors are
    expressed on macrophages and other leukocytes, and agonism at therapeutic
    concentrations impairs phagocytosis; at the population level, current
    opioid use is associated with increased odds of invasive pneumococcal
    disease in a dose- and potency-graded fashion.
  phenotype_term:
    preferred_term: Opioid-associated immunosuppression
    term:
      id: HP:0002721
      label: Immunodeficiency
  evidence:
  - reference: PMID:29435555
    reference_title: "Opioid Analgesic Use and Risk for Invasive Pneumococcal Diseases: A Nested Case-Control Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Persons in the case group had greater odds than control participants of
      being current opioid users
    explanation: >-
      The primary human infection-risk result. The paper reports an adjusted
      odds ratio of 1.62 (95% CI 1.36 to 1.92), strongest for long-acting,
      high-potency, and high-dose opioids; the figures are given here rather
      than quoted because the reference validator strips the bracketed `[aOR]`
      abbreviation from a snippet, which would break an otherwise verbatim
      quote.
  - reference: PMID:29435555
    reference_title: "Opioid Analgesic Use and Risk for Invasive Pneumococcal Diseases: A Nested Case-Control Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Opioid use is associated with an increased risk for IPD and represents a
      novel risk factor for these diseases.
    explanation: >-
      The authors' own conclusion, stating the direction of the association this
      phenotype records.
  - reference: PMID:37259426
    reference_title: "Altered Membrane Expression and Function of CD11b Play a Role in the Immunosuppressive Effects of Morphine on Macrophages at the Nanomolar Level."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      morphine at 0.1-10 nM levels inhibited CD11b expression and function on
      macrophages via a μ-opioid receptor (MOR)-dependent mechanism, thereby
      reducing macrophage phagocytosis of tumor cells
    explanation: >-
      Supplies the receptor-level mechanism — a mu-opioid-receptor-dependent
      loss of macrophage phagocytic function at therapeutic concentrations —
      that the epidemiological association lacks.
  - reference: PMID:29435555
    reference_title: "Opioid Analgesic Use and Risk for Invasive Pneumococcal Diseases: A Nested Case-Control Study."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Actual opioid use and other nonprescription use (such as illicit opioid
      use) were not measured.
    explanation: >-
      The authors' own limitation. The exposure is prescription fills, not
      illicit or injected opioid use, so the study does not directly measure the
      OUD population this entry models.
  notes: >-
    Scope. The human evidence here is for prescription opioid analgesic use,
    not for opioid use disorder, and the entry deliberately does not model
    injection-related infectious complications (see the entry `notes`). This
    phenotype is the pharmacological immunosuppression arm only; it is not a
    claim about the infectious burden of injection drug use, which has a
    different and much larger cause.
- category: Constitutional
  name: Neonatal Opioid Withdrawal Syndrome
  description: >-
    A postnatal withdrawal syndrome in infants exposed to opioids in utero,
    including exposure via maternal methadone or buprenorphine treatment. Note
    this is a phenotype of the offspring, not of the proband; it is recorded
    here because it is a direct consequence of maternal OUD, but it would be
    better modelled as its own entity.
  notes: >-
    No `phenotype_term` is bound. NOWS is a syndrome spanning irritability,
    tremor, feeding difficulty, autonomic instability and seizures; binding it
    to any single constituent sign (HP:0000737 Irritability, used in an earlier
    draft) understates the condition for any downstream consumer. Needs term /
    NTR candidate.
  evidence:
  - reference: PMID:30819342
    reference_title: Neonatal Abstinence Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Neonatal abstinence syndrome (NAS) is a postnatal withdrawal syndrome
      that manifests shortly after birth in infants born to women with opioid
      use (including heroin, use or misuse of prescription painkillers, or
      maternal treatment medications such as methadone or buprenorphine) during
      pregnancy.
    explanation: >-
      Defines the syndrome and its exposure routes, including maintenance
      medications.
genetic:
- name: OPRM1
  gene_term:
    preferred_term: OPRM1
    term:
      id: hgnc:8156
      label: OPRM1
  relationship_type: SUSCEPTIBILITY
  association: >-
    The mu-opioid receptor gene — the direct pharmacological target of opioids
    — and the only locus with a long-standing, independently replicated
    genome-wide significant association with opioid addiction. The functional
    coding variant rs1799971 (A118G) alters receptor trafficking and signalling
    efficacy rather than producing a clean gain or loss of function, so no
    `functional_impact_category` is asserted.
  evidence:
  - reference: PMID:36207451
    reference_title: "Multi-trait genome-wide association study of opioid addiction: OPRM1 and beyond."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Opioid addiction (OA) is moderately heritable, yet only rs1799971, the
      A118G variant in OPRM1, has been identified as a genome-wide significant
      association with OA and independently replicated.
    explanation: >-
      Establishes rs1799971 as the single replicated genome-wide significant
      association.
  - reference: PMID:36207451
    reference_title: "Multi-trait genome-wide association study of opioid addiction: OPRM1 and beyond."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We observed the strongest evidence to date for OPRM1: lead SNP rs9478500
      (p = 2.56 × 10-9).
    explanation: >-
      Strengthens the OPRM1 signal in the largest multi-trait analysis to date.
- name: FURIN
  gene_term:
    preferred_term: FURIN
    term:
      id: hgnc:8568
      label: FURIN
  relationship_type: SUSCEPTIBILITY
  association: >-
    Identified by gene-based analysis in the multi-trait GWAS of opioid
    addiction, alongside PPP6C. Both are recent and comparatively less
    replicated than the OPRM1 signal.
  evidence:
  - reference: PMID:36207451
    reference_title: "Multi-trait genome-wide association study of opioid addiction: OPRM1 and beyond."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gene-based analyses identified novel genome-wide significant associations
      with PPP6C and FURIN.
    explanation: >-
      Direct statement of the gene-based association.
  - reference: PMID:36207451
    reference_title: "Multi-trait genome-wide association study of opioid addiction: OPRM1 and beyond."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variants within these loci appear to be pleiotropic for addiction and
      related traits.
    explanation: >-
      The authors describe the signal as pleiotropic across addiction traits
      rather than opioid-specific, which bounds how strongly this locus can be
      called an OUD gene.
- name: KDM4A
  gene_term:
    preferred_term: KDM4A
    term:
      id: hgnc:22978
      label: KDM4A
  relationship_type: SUSCEPTIBILITY
  association: >-
    Intronic variant rs3791033 reached genome-wide significance in a GWAS of
    *problematic opioid use* (POU) — using prescription opioids "not as
    prescribed" — in 132,113 research participants. Read the phenotype
    carefully: POU is a self-report proxy, not a diagnosed OUD case
    definition, and this locus has not been reported at genome-wide
    significance in a GWAS of diagnosed OUD. It is curated as a susceptibility
    signal for the proxy phenotype, with the genetic correlation to OUD
    (rg = 0.64-0.80) as the bridge, rather than as an established OUD locus.
  evidence:
  - reference: PMID:34728798
    reference_title: "Genome-wide association study of problematic opioid prescription use in 132,113 23andMe research participants of European ancestry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified two genome-wide significant loci (rs3791033, an intronic
      variant of KDM4A; rs640561, an intergenic variant near LRRIQ3).
    explanation: >-
      Direct statement of the genome-wide significant association, naming both
      the variant and the gene.
  - reference: PMID:34728798
    reference_title: "Genome-wide association study of problematic opioid prescription use in 132,113 23andMe research participants of European ancestry."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As a surrogate (or proxy) for OUD, we explored the genetic basis of using
      prescription opioids 'not as prescribed'.
    explanation: >-
      The authors state the phenotype is a surrogate for OUD, which is what
      limits how strongly this locus can be called an OUD susceptibility gene.
- name: LRRIQ3
  gene_term:
    preferred_term: LRRIQ3
    term:
      id: hgnc:28318
      label: LRRIQ3
  relationship_type: SUSCEPTIBILITY
  association: >-
    Intergenic variant rs640561 near LRRIQ3, the second genome-wide significant
    locus from the same problematic-opioid-use GWAS. The variant is intergenic,
    so the gene assignment is by proximity and not by demonstrated functional
    effect on LRRIQ3 — the same POU-proxy caveat recorded on KDM4A applies here
    and is compounded by that.
  evidence:
  - reference: PMID:34728798
    reference_title: "Genome-wide association study of problematic opioid prescription use in 132,113 23andMe research participants of European ancestry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified two genome-wide significant loci (rs3791033, an intronic
      variant of KDM4A; rs640561, an intergenic variant near LRRIQ3).
    explanation: >-
      Direct statement of the association, and the source of the "near" wording
      that makes the gene assignment positional.
  - reference: PMID:34728798
    reference_title: "Genome-wide association study of problematic opioid prescription use in 132,113 23andMe research participants of European ancestry."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      POU showed positive genetic correlations with the two largest available
      GWAS of OUD and opioid dependence
    explanation: >-
      The genetic correlation is the only thing connecting this locus to
      diagnosed OUD, so it is recorded as partial support for an OUD
      susceptibility claim.
environmental:
- name: Exposure to mu-opioid receptor agonists
  description: >-
    Opioid exposure — whether via prescribed analgesia, diverted prescription
    opioids, heroin, or illicit synthetic opioids such as fentanyl — is the
    necessary cause. It is not sufficient: only a minority of exposed people
    develop the disorder. Supply potency is a distinct risk dimension from
    exposure per se, because it determines whether a given episode of use is
    survivable.
  effect: Necessary causal exposure
  exposure_term:
    preferred_term: exposure to mu-opioid receptor agonist
    term:
      id: ECTO:9001896
      label: exposure to mu-opioid receptor agonist
  chemicals:
  - heroin
  - fentanyl
  - morphine
  influences_mechanisms:
  - target: Exogenous Mu-Opioid Receptor Agonism
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Administration by any route is what places an agonist at the receptor.
    evidence:
    - reference: PMID:23321159
      reference_title: "Regulation of μ-opioid receptors: desensitization, phosphorylation, internalization, and tolerance."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Morphine and related µ-opioid receptor (MOR) agonists remain among the
        most effective drugs known for acute relief of severe pain.
      explanation: >-
        Establishes that the exposure of interest is agonism at the mu-opioid
        receptor, the mechanism node this triggers.
  - target: Mu-Opioid Receptor Desensitization and Tolerance
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Chronic rather than single exposure is what produces durable receptor
      regulation and tolerance.
    evidence:
    - reference: PMID:23321159
      reference_title: "Regulation of μ-opioid receptors: desensitization, phosphorylation, internalization, and tolerance."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        there are large gaps in understanding the molecular processes
        responsible for loss of MOR function after chronic exposure to opioids
      explanation: >-
        Identifies chronic exposure as the variable that drives loss of
        receptor function, while flagging that the molecular detail is
        incomplete.
  evidence:
  - reference: PMID:36207451
    reference_title: "Multi-trait genome-wide association study of opioid addiction: OPRM1 and beyond."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately 4% of the US population aged 12 and older (10.1 million
      people) misused opioids in 2019
    explanation: >-
      Quantifies how widespread the exposure modelled by this entry is, which
      is what makes a necessary-but-not-sufficient exposure epidemiologically
      significant.
treatments:
- name: Methadone
  description: >-
    Full mu-opioid receptor agonist with a long half-life, delivered through
    regulated opioid treatment programmes. The best-retained of the opioid
    agonist treatments. It works by occupying the same receptor the disorder is
    built on, which is why it suppresses withdrawal and craving without
    producing the reinforcing peak of short-acting opioids.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: methadone
      term:
        id: CHEBI:6807
        label: methadone
  target_mechanisms:
  - target: Noradrenergic Hyperactivity and Opioid Withdrawal Syndrome
    treatment_effect: INHIBITS
    description: >-
      Sustained receptor occupancy prevents the unopposed noradrenergic surge
      that produces withdrawal.
  evidence:
  - reference: PMID:12804430
    reference_title: Methadone maintenance therapy versus no opioid replacement therapy for opioid dependence.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Methadone is an effective maintenance therapy intervention for the
      treatment of heroin dependence as it retains patients in treatment and
      decreases heroin use better than treatments that do not utilise opioid
      replacement therapy.
    explanation: >-
      Cochrane review conclusion establishing methadone maintenance against
      non-replacement approaches.
  - reference: PMID:12804430
    reference_title: Methadone maintenance therapy versus no opioid replacement therapy for opioid dependence.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      methadone appeared statistically significantly more effective than
      non-pharmacological approaches in retaining patient in treatment (3 RCTs,
      RR=3.05; 95%CI: 1.75-5.35) and in the suppression of heroin use (3 RCTs,
      RR=0.32; 95%CI: 0.23-0.44), but not statistically in criminal activity
    explanation: >-
      Quantifies the retention and heroin-use effects, and is explicit that the
      criminal-activity effect was not significant.
- name: Buprenorphine
  description: >-
    Partial mu-opioid receptor agonist, usually co-formulated with naloxone to
    deter injection. Its partial agonism produces a ceiling on respiratory
    depression, which gives it a wider safety margin than methadone and allows
    office-based prescribing — the trade-off is somewhat lower retention than
    methadone under flexible dosing.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: buprenorphine
      term:
        id: CHEBI:3216
        label: buprenorphine
  target_mechanisms:
  - target: Noradrenergic Hyperactivity and Opioid Withdrawal Syndrome
    treatment_effect: INHIBITS
    description: >-
      Partial agonism at the same receptor suppresses withdrawal while
      capping respiratory depression.
  evidence:
  - reference: PMID:24500948
    reference_title: Buprenorphine maintenance versus placebo or methadone maintenance for opioid dependence.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is high quality of evidence that buprenorphine was superior to
      placebo medication in retention of participants in treatment at all doses
      examined.
    explanation: >-
      Cochrane review of 31 trials establishes superiority to placebo for
      retention.
  - reference: PMID:24500948
    reference_title: Buprenorphine maintenance versus placebo or methadone maintenance for opioid dependence.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Methadone is superior to buprenorphine in retaining people in treatment,
      and methadone equally suppresses illicit opioid use.
    explanation: >-
      Bounds the claim: buprenorphine is effective but does not match methadone
      on retention, which is the main comparative caveat.
- name: Extended-Release Injectable Naltrexone
  description: >-
    Mu-opioid receptor antagonist given as a monthly injection. Conceptually
    the opposite of agonist treatment: it blocks the receptor rather than
    occupying it with a safer agonist. Its practical limitation is the
    induction hurdle — it requires full detoxification first, and failure to
    initiate is what drives its worse intention-to-treat outcomes.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: naltrexone
      term:
        id: CHEBI:7465
        label: naltrexone
  target_mechanisms:
  - target: VTA Disinhibition and Mesolimbic Dopamine Release
    treatment_effect: INHIBITS
    description: >-
      Receptor blockade prevents the disinhibition step that produces opioid
      reward.
  evidence:
  - reference: PMID:29150198
    reference_title: "Comparative effectiveness of extended-release naltrexone versus buprenorphine-naloxone for opioid relapse prevention (X:BOT): a multicentre, open-label, randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this population it is more difficult to initiate patients to XR-NTX
      than BUP-NX, and this negatively affected overall relapse. However, once
      initiated, both medications were equally safe and effective.
    explanation: >-
      The trial's own conclusion, separating the induction problem from
      once-initiated efficacy.
  - reference: PMID:29150198
    reference_title: "Comparative effectiveness of extended-release naltrexone versus buprenorphine-naloxone for opioid relapse prevention (X:BOT): a multicentre, open-label, randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among participants successfully inducted (per-protocol population,
      n=474), 24 week relapse events were similar across study groups (p=0·44).
    explanation: >-
      Quantifies the per-protocol equivalence that the intention-to-treat
      result obscures.
- name: Naloxone Overdose Reversal
  description: >-
    Competitive mu-opioid receptor antagonist that reverses opioid-induced
    respiratory depression within minutes. This treats the acute lethal event,
    not the disorder. Its half-life can be shorter than that of the opioid it
    reverses, so re-sedation after apparent recovery is a real hazard.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: naloxone
      term:
        id: CHEBI:7459
        label: naloxone
  target_mechanisms:
  - target: Brainstem Respiratory Rhythm Suppression
    treatment_effect: INHIBITS
    description: >-
      Competitive displacement of the agonist at brainstem mu-opioid receptors
      restores respiratory drive.
    evidence:
    - reference: PMID:35471232
      reference_title: Mechanisms of opioid-induced respiratory depression.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Reversal of OIRD has relied heavily on naloxone which also reverses
        analgesia but mismatches between the half-lives of naloxone and opioids
        can make it difficult to clinically safely avoid OIRD.
      explanation: >-
        States both the reversal mechanism and the half-life mismatch caveat.
  evidence:
  - reference: PMID:24874759
    reference_title: A systematic review of community opioid overdose prevention and naloxone distribution programs.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The current evidence from nonrandomized studies suggests that bystanders
      (mostly opioid users) can and will use naloxone to reverse opioid
      overdoses when properly trained, and that this training can be done
      successfully through OOPPs.
    explanation: >-
      Supports community naloxone distribution as an effective delivery route,
      while the authors are explicit that the evidence is nonrandomized.
- name: Lofexidine
  description: >-
    Alpha-2 adrenergic agonist approved for mitigating opioid withdrawal
    symptoms. Mechanistically it targets exactly the noradrenergic
    hyperactivity node rather than the opioid receptor, which is why it eases
    withdrawal without treating craving or preventing relapse.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: lofexidine
      term:
        id: CHEBI:51368
        label: lofexidine
  target_mechanisms:
  - target: Noradrenergic Hyperactivity and Opioid Withdrawal Syndrome
    treatment_effect: INHIBITS
    description: >-
      Alpha-2 autoreceptor agonism suppresses noradrenergic output, the
      substrate of somatic withdrawal.
  evidence:
  - reference: PMID:32002194
    reference_title: "Efficacy of lofexidine for mitigating opioid withdrawal symptoms: results from two randomized, placebo-controlled trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This simplified analysis confirmed previous per-protocol results, that
      lofexidine better reduces OWS severity and increases retention compared
      with placebo in opioid-dependent adults.
    explanation: >-
      Two randomized placebo-controlled trials support reduction in withdrawal
      severity and improved retention.
  - reference: PMID:32002194
    reference_title: "Efficacy of lofexidine for mitigating opioid withdrawal symptoms: results from two randomized, placebo-controlled trials."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypotension and bradycardia were more common with lofexidine.
    explanation: >-
      Records the predictable cardiovascular consequence of alpha-2 agonism,
      which bounds its use.
- name: Psychosocial Intervention Adjunctive to Opioid Agonist Therapy
  description: >-
    Cognitive behavioural therapy, contingency management, and related
    psychosocial treatments, delivered as an adjunct to opioid agonist therapy
    rather than as a substitute for it.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Cognitive Behavior Therapy
    term:
      id: NCIT:C64345
      label: Cognitive Behavior Therapy
  evidence:
  - reference: PMID:33370393
    reference_title: "Evaluating comparative effectiveness of psychosocial interventions adjunctive to opioid agonist therapy for opioid use disorder: A systematic review with network meta-analyses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Guidelines recommend that individuals with opioid use disorder (OUD)
      receive pharmacological and psychosocial interventions; however, the most
      appropriate psychosocial intervention is not known.
    explanation: >-
      Establishes the adjunctive role while stating explicitly that the
      comparative question is unresolved.
- name: Contingency Management
  description: >-
    A behavioural intervention delivering material incentives contingent on
    objectively verified behaviour change — typically a negative urine drug
    screen or a kept appointment. It is curated separately from the general
    psychosocial-intervention entry above because it is the psychosocial
    treatment with the strongest and most specific evidence base, and because
    it addresses a problem opioid agonist therapy does not: comorbid stimulant
    use, for which no effective pharmacotherapy exists.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: contingency management
    term:
      id: NCIT:C94375
      label: Contingency Management
  evidence:
  - reference: PMID:34347030
    reference_title: "Contingency Management for Patients Receiving Medication for Opioid Use Disorder: A Systematic Review and Meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Collapsing across abstinence and adherence categories, contingency
      management was associated with medium effect sizes for abstinence (Cohen
      d = 0.58; 95% CI, 0.47-0.69) and treatment adherence (Cohen d = 0.62;
      95% CI, 0.40-0.84) compared with controls.
    explanation: >-
      Quantifies the effect on both abstinence and treatment adherence in
      patients already receiving medication for OUD, which is the adjunctive
      role this entry curates.
  - reference: PMID:34347030
    reference_title: "Contingency Management for Patients Receiving Medication for Opioid Use Disorder: A Systematic Review and Meta-analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Medication treatment for opioid use disorder (MOUD) is efficacious, but
      comorbid stimulant use and other behavioral health problems often
      undermine efficacy.
    explanation: >-
      States the gap this treatment addresses, and why it is not redundant with
      the agonist therapies curated above.
  notes: >-
    The meta-analysis reports end-of-treatment outcomes. It does not establish
    that the effect persists after the incentives stop, so no durability claim
    is curated here.
- name: Nalmefene Nasal Spray
  description: >-
    Long-acting opioid antagonist nasal spray (Opvee), FDA-approved in 2023
    for emergency treatment of known or suspected opioid overdose. Its longer
    duration of action than naloxone's is the intended advantage against
    re-sedation as an opioid's effects outlast a single reversal dose, which
    is the same half-life-mismatch hazard already curated on the naloxone
    treatment above.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: nalmefene
      term:
        id: CHEBI:7457
        label: Nalmefene
  target_mechanisms:
  - target: Brainstem Respiratory Rhythm Suppression
    treatment_effect: INHIBITS
    description: >-
      Competitive opioid receptor antagonism at brainstem mu-opioid receptors
      restores respiratory drive, the same mechanism as naloxone but with a
      longer duration of action.
  evidence:
  - reference: PMID:39648641
    reference_title: "FDA Approval Summary: Nalmefene Nasal Spray for the Emergency Treatment of Known or Suspected Opioid Overdose."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On May 22, 2023, the United States Food and Drug Administration approved
      the first nalmefene hydrochloride nasal spray for the emergency
      treatment of known or suspected opioid overdose in adults and pediatric
      patients 12 years of age and older.
    explanation: >-
      FDA approval summary establishing the drug, route, indication, and
      approval date.
- name: Extended-Release Buprenorphine Injectable
  description: >-
    Subcutaneous depot buprenorphine formulations (monthly Sublocade, or
    weekly/monthly Buvidal/Brixadi) that reduce dosing frequency relative to
    daily sublingual buprenorphine, the same adherence rationale already
    modelled for extended-release injectable naltrexone above. Unlike
    naltrexone, induction does not require prior full detoxification, since
    buprenorphine is itself an opioid agonist rather than an antagonist.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: buprenorphine
      term:
        id: CHEBI:3216
        label: buprenorphine
  target_mechanisms:
  - target: Noradrenergic Hyperactivity and Opioid Withdrawal Syndrome
    treatment_effect: INHIBITS
    description: >-
      Same partial-agonist receptor mechanism as sublingual buprenorphine; the
      depot formulation changes pharmacokinetics and dosing frequency, not
      receptor pharmacology.
  evidence:
  - reference: PMID:40459195
    reference_title: "Transition to Extended-release Buprenorphine Injectable Within Seven Days for Opioid Use Disorder Treatment: A Scoping Narrative."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Sublocade (extended-release buprenorphine; Bup-XR-S) and Buvidal/Brixadi
      (long-acting buprenorphine; Bup-LA-B) formulations allow for less
      frequent dosing.
    explanation: >-
      Names both long-acting formulations and states the dosing-frequency
      rationale for the treatment.
  - reference: PMID:40459195
    reference_title: "Transition to Extended-release Buprenorphine Injectable Within Seven Days for Opioid Use Disorder Treatment: A Scoping Narrative."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Short-term retention (4 wk) exceeded 60%.
    explanation: >-
      Quantifies short-term retention pooled across the transition studies
      reviewed.
diagnosis:
- name: DSM-5 and ICD-11 clinical diagnostic criteria
  description: >-
    Diagnosis is clinical and behavioural: DSM-5 requires at least 2 of 11
    criteria within 12 months, graded mild/moderate/severe by criterion count;
    ICD-11 codes opioid dependence at 6C43.2 using the dependence-syndrome
    framework. Physiological tolerance and withdrawal arising from appropriate
    medical opioid use do not by themselves establish the disorder — a
    distinction that matters for patients on long-term analgesia. There is no
    validated blood biomarker; urine immunoassay panels detect exposure, not
    the disorder, and frequently miss fentanyl and other synthetic opioids
    without an extended panel.
  evidence:
  - reference: PMID:29150198
    reference_title: "Comparative effectiveness of extended-release naltrexone versus buprenorphine-naloxone for opioid relapse prevention (X:BOT): a multicentre, open-label, randomised controlled trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Extended-release naltrexone (XR-NTX), an opioid antagonist, and
      sublingual buprenorphine-naloxone (BUP-NX), a partial opioid agonist, are
      pharmacologically and conceptually distinct interventions to prevent
      opioid relapse.
    explanation: >-
      Confirms DSM-criteria-based ascertainment is the standard entry point for
      OUD trials; the abstract does not enumerate the criteria, so support for
      the criteria themselves is partial.
- name: Clinical Opiate Withdrawal Scale and related severity instruments
  description: >-
    Withdrawal severity is graded with structured instruments — the Clinical
    Opiate Withdrawal Scale (COWS, observer-rated) and the Short Opioid
    Withdrawal Scale of Gossop (SOWS-G, self-reported) — which are the primary
    endpoints in withdrawal-treatment trials.
  evidence:
  - reference: PMID:32002194
    reference_title: "Efficacy of lofexidine for mitigating opioid withdrawal symptoms: results from two randomized, placebo-controlled trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Opioid-dependent adults received placebo or lofexidine; efficacy was
      assessed using the Short Opioid Withdrawal Scale of Gossop (SOWS-G)
      daily.
    explanation: >-
      Documents use of a standardized withdrawal severity instrument as the
      trial efficacy measure.
- name: Opioid Risk Tool (ORT) and SOAPP pre-prescription risk screening
  description: >-
    Self-administered questionnaires used before initiating long-term opioid
    therapy for pain, to predict which patients are likely to develop
    aberrant opioid-related behaviors. This is a distinct pre-prescription
    screening tier from the DSM-5/ICD-11 diagnostic criteria and the
    COWS/SOWS-G withdrawal-severity instruments above, which apply once a
    patient is already on opioids or already dependent.
  evidence:
  - reference: PMID:16336480
    reference_title: "Predicting aberrant behaviors in opioid-treated patients: preliminary validation of the Opioid Risk Tool."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The ORT displayed excellent discrimination for both the male (c = 0.82)
      and the female (c = 0.85) prognostic models.
    explanation: >-
      Reports the discrimination statistics from the Opioid Risk Tool's
      preliminary validation study.
  - reference: PMID:15494186
    reference_title: Validation of a screener and opioid assessment measure for patients with chronic pain.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Receiver operating characteristics curve analysis yielded an area under
      the curve of 0.881 (P<0.001), suggesting adequate sensitivity and
      specificity for a screening device.
    explanation: >-
      Reports the SOAPP's validation performance as a pre-prescription
      screening tool.

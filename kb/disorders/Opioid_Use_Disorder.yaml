environmental:
- name: Exposure to mu-opioid receptor agonists
  description: >-
    Opioid exposure — whether via prescribed analgesia, diverted prescription
    opioids, heroin, or illicit synthetic opioids such as fentanyl — is the
    necessary cause. It is not sufficient: only a minority of exposed people
    develop the disorder. Supply potency is a distinct risk dimension from
    exposure per se, because it determines whether a given episode of use is
    survivable.
  effect: Necessary causal exposure
  exposure_term:

name: Opioid Use Disorder
creation_date: "2026-08-09T18:40:00Z"
category: Psychiatric
description: >-
  Opioid use disorder (OUD) is a chronic, relapsing substance use disorder
  driven by repeated exogenous mu-opioid receptor agonism: compulsive opioid
  seeking and use despite harm, with tolerance, a severe somatic and affective
  withdrawal syndrome, and a distinctively lethal complication in
  opioid-induced respiratory depression. DSM-5 merged the earlier opioid abuse
  and opioid dependence categories into a single graded diagnosis
  (mild/moderate/severe); ICD-11 retains a dependence syndrome (6C43.2).
  Exposure is necessary but not sufficient — only a minority of exposed people
  develop the disorder.
disease_term:
  preferred_term: opioid use disorder
  term:
    id: MONDO:0005530
    label: opiate dependence
synonyms:
- Opioid dependence
- Opioid addiction
- Opiate dependence
- Heroin dependence
parents:
- Substance Use Disorder
- Mental Health Disorder
notes: >-
  Terminology and identifier caveat, following the same convention as the
  Alcohol_Use_Disorder entry. MONDO has no single term for the DSM-5 construct
  "opioid use disorder"; it carries the two pre-DSM-5 entities separately
  (MONDO:0005530 opiate dependence, with EXACT synonym "opioid dependence",
  ICD10CM:F11.2; and MONDO:0001225 opioid abuse, ICD10CM:F11.1). This entry is
  bound to MONDO:0005530 because the dependence phenotype is what essentially
  all of the cited mechanism and treatment literature studies. Claims specific
  to the narrower DSM-IV "opioid abuse" pole should say so rather than assuming
  the binding covers them.

  Scope. This entry models the CNS disorder of opioid use and the acute
  respiratory-depression mechanism that makes it lethal. Injection-related
  infectious complications (HIV, HCV, infective endocarditis) are consequences
  of the route of administration rather than of opioid pharmacology, and are
  not modelled here.

  Known curation gaps, recorded rather than left implicit. (1) The
  neuroimmune/glial (TLR4, microglial) contribution to tolerance and
  hyperalgesia is now modelled as its own node, `Opioid-Induced TLR4 and
  Microglial Neuroimmune Activation`, closing the gap this note previously
  recorded. Its human translational status remains open and is tracked in the
  `oud_tlr4_glial_human_translation` discussion rather than asserted in the
  node. (2) Neonatal opioid withdrawal syndrome is captured as a single
  phenotype of in-utero-exposed offspring; it is properly a distinct entity
  affecting a different individual, and would be better modelled as its own
  entry or as a trajectory. (3) No population prevalence record for diagnosed
  OUD is curated — the one quotable figure available in the cached references
  is for opioid *misuse*, which is a broader construct, so it is recorded as
  such rather than relabelled. (4) Several withdrawal signs and chronic-use
  complications carry only syndrome-level citations at `supports: PARTIAL`;
  each needs a sign-specific primary reference. (5) Six further candidate risk
  loci (PPP6C, KDM4A, LRRIQ3, CPT2, CD47, SLC5A11) were assessed for curation.
  PPP6C was already covered by the multi-trait GWAS cited on the susceptibility
  node; KDM4A and LRRIQ3 are curated, with the caveat that their source GWAS
  used a self-reported problematic-opioid-use proxy phenotype rather than
  diagnosed OUD. CPT2, CD47 and SLC5A11 are deliberately *not* curated: no
  abstract-level source associating any of them with opioid use disorder could
  be found, and citing a GWAS supplementary table that cannot be quoted would
  put an unverifiable claim in the entry. They should be added if and when a
  quotable source is identified, not on the strength of the list they came
  from.

  Evidence-source convention used in this entry, recorded because it was
  queried. A reference is tagged by what the *document* reports, and the line
  this entry draws is whether it reports or synthesizes human clinical data
  (HUMAN_CLINICAL: trials, cohort and case-control studies, Cochrane and other
  systematic reviews of trials, instrument-validation studies, regulatory
  approval summaries, evidence-based clinical guidelines) or narrates a
  mechanism (OTHER: mechanism and syndrome reviews). On that rule the
  opioid-induced-constipation clinical guideline (PMID:28034973,
  HUMAN_CLINICAL) and the opioid-induced-androgen-deficiency review
  (PMID:22786453, OTHER) are consistent with each other, and both are left
  unchanged. There is no KB-wide convention to align to instead: across
  `kb/disorders/` guideline-titled references are split roughly two-to-one
  between HUMAN_CLINICAL and OTHER.
prevalence:
- population: US population aged 12 and older, past-year opioid misuse (not diagnosed OUD)
  measure_type: PERIOD_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 4000.0
  notes: >-
    This is past-year opioid MISUSE, a broader construct than diagnosed opioid
    use disorder; only a fraction of people who misuse opioids meet OUD
    criteria. Recorded at the construct the source actually measures rather
    than relabelled as OUD prevalence.
  evidence:
  - reference: PMID:36207451
    reference_title: "Multi-trait genome-wide association study of opioid addiction: OPRM1 and beyond."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately 4% of the US population aged 12 and older (10.1 million
      people) misused opioids in 2019
    explanation: >-
      Gives the national misuse figure. Support is PARTIAL for a prevalence
      record on this entry because misuse is not equivalent to diagnosed OUD.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    OUD carries a markedly elevated mortality risk dominated by fatal overdose,
    which is mechanistically a direct pharmacological consequence of the drug
    rather than a late complication. Mortality falls sharply during opioid
    agonist treatment and rises during treatment gaps. The societal cost of OUD
    and fatal opioid overdose in the US was estimated at over one trillion
    dollars for a single year.
  evidence:
  - reference: PMID:33121867
    reference_title: "The economic burden of opioid use disorder and fatal opioid overdose in the United States, 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Costs for opioid use disorder and fatal opioid overdose in 2017 were
      estimated to be $1.02 trillion.
    explanation: >-
      CDC estimate of the total US societal cost, combining health care,
      criminal justice, lost productivity, and valued quality-of-life and
      life-years lost.
  - reference: PMID:33121867
    reference_title: "The economic burden of opioid use disorder and fatal opioid overdose in the United States, 2017."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The majority of the economic burden is due to reduced quality of life
      from opioid use disorder and the value of life lost due to fatal opioid
      overdose.
    explanation: >-
      Identifies disability and premature death, rather than direct treatment
      spending, as the dominant components of the burden.
inheritance:
- name: Polygenic (multifactorial) liability
  inheritance_term:
    preferred_term: polygenic inheritance
    term:
      id: HP:0010982
      label: Polygenic inheritance
  description: >-
    OUD is a complex trait, not Mendelian. Opioid addiction is moderately
    heritable, but until recently only the OPRM1 A118G variant had reached
    genome-wide significance with independent replication — an unusually sparse
    common-variant signal compared with other substance use disorders, which
    the largest multi-trait analyses have only recently begun to extend.
  evidence:
  - reference: PMID:36207451
    reference_title: "Multi-trait genome-wide association study of opioid addiction: OPRM1 and beyond."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Opioid addiction (OA) is moderately heritable, yet only rs1799971, the
      A118G variant in OPRM1, has been identified as a genome-wide significant
      association with OA and independently replicated.
    explanation: >-
      States both the moderate heritability and the sparseness of replicated
      common-variant signal that characterizes this trait.
  - reference: PMID:36207451
    reference_title: "Multi-trait genome-wide association study of opioid addiction: OPRM1 and beyond."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genetic correlations among the various OA phenotypes were uniformly high
      (rg > 0.9).
    explanation: >-
      Supports treating the differently ascertained opioid addiction phenotypes
      as one underlying liability.
pathophysiology:
- name: Polygenic Susceptibility to Opioid Addiction
  biological_scale: MOLECULAR
  description: >-
    Inherited liability is polygenic and, relative to other substance use
    disorders, unusually concentrated on the opioid receptor gene itself.
    OPRM1 carries the only long-replicated genome-wide significant signal;
    gene-based analysis has added FURIN and PPP6C. Genetic loading modifies the
    probability that opioid exposure escalates to compulsive use; it does not
    cause the disorder without exposure.
  genes:
  - preferred_term: OPRM1
    term:
      id: hgnc:8156
      label: OPRM1
  - preferred_term: FURIN
    term:
      id: hgnc:8568
      label: FURIN
  downstream:
  - target: Exogenous Mu-Opioid Receptor Agonism
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Altered mu-opioid receptor expression, trafficking, and signalling efficacy
    description: >-
      OPRM1 variation acts on the receptor that exogenous opioids bind,
      modifying the signalling consequences of a given exposure.
    evidence:
    - reference: PMID:36207451
      reference_title: "Multi-trait genome-wide association study of opioid addiction: OPRM1 and beyond."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        We observed the strongest evidence to date for OPRM1: lead SNP
        rs9478500 (p = 2.56 × 10-9).
      explanation: >-
        Establishes OPRM1 as the strongest genetic signal, which is what makes
        this edge to receptor-level pharmacology the natural one.
  evidence:
  - reference: PMID:36207451
    reference_title: "Multi-trait genome-wide association study of opioid addiction: OPRM1 and beyond."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Gene-based analyses identified novel genome-wide significant associations
      with PPP6C and FURIN.
    explanation: >-
      Documents the loci beyond OPRM1 that this susceptibility node represents.
  - reference: PMID:35879402
    reference_title: "Genome-wide association study in individuals of European and African ancestry and multi-trait analysis of opioid use disorder identifies 19 independent genome-wide significant risk loci."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The current study identified OUD variant associations at OPRM1, single
      variant associations with FURIN, and 18 GWS associations in the OUD-MTAG.
    explanation: >-
      The largest OUD-specific GWAS independently replicates the two loci this
      node carries, and finds nothing else at genome-wide significance for
      diagnosed OUD without multi-trait augmentation.
  - reference: PMID:35879402
    reference_title: "Genome-wide association study in individuals of European and African ancestry and multi-trait analysis of opioid use disorder identifies 19 independent genome-wide significant risk loci."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The genetic architecture of OUD is likely influenced by both OUD-specific
      loci and loci shared across SUDs.
    explanation: >-
      Bounds every additional locus curated in the `genetic` section: signals
      recovered by multi-trait analysis are partly shared across substance use
      disorders rather than opioid-specific.
- name: Exogenous Mu-Opioid Receptor Agonism
  biological_scale: MOLECULAR
  description: >-
    Prescription opioids, heroin, and illicit synthetic opioids such as
    fentanyl act as agonists at the mu-opioid receptor, a Gi/Go-coupled GPCR.
    Receptor activation inhibits adenylyl cyclase and opens GIRK potassium
    channels, hyperpolarizing the target neuron. The same receptor event
    underlies analgesia, euphoria, tolerance, and — in the brainstem —
    respiratory depression, which is why the therapeutic and lethal effects of
    opioids cannot be pharmacologically separated at this node.
  biological_processes:
  - preferred_term: G protein-coupled opioid receptor signaling pathway
    term:
      id: GO:0038003
      label: G protein-coupled opioid receptor signaling pathway
    modifier: INCREASED
  - preferred_term: adenylate cyclase-inhibiting signaling
    term:
      id: GO:0007193
      label: adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
    modifier: INCREASED
  chemical_entities:
  - preferred_term: morphine
    term:
      id: CHEBI:17303
      label: morphine
  - preferred_term: heroin
    term:
      id: CHEBI:27808
      label: heroin
  - preferred_term: fentanyl
    term:
      id: CHEBI:119915
      label: fentanyl
  triggers:
  - preferred_term: exposure to mu-opioid receptor agonist
    term:
      id: ECTO:9001896
      label: exposure to mu-opioid receptor agonist
  downstream:
  - target: VTA Disinhibition and Mesolimbic Dopamine Release
    causal_link_type: DIRECT
    description: >-
      Receptor-mediated hyperpolarization of VTA GABAergic interneurons
      disinhibits dopaminergic projection neurons.
    evidence:
    - reference: PMID:31400808
      reference_title: "Neurobiology of Opioid Addiction: Opponent Process, Hyperkatifeia, and Negative Reinforcement."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
          Opioids are powerful drugs that usurp and overpower the reward function
          of endogenous opioids and engage dramatic tolerance and withdrawal via
          molecular and neurocircuitry neuroadaptations within the same reward
          system.
      explanation: >-
          Establishes that exogenous opioids act on the endogenous opioid reward
          system. The review does not itself describe the VTA interneuron
          disinhibition step, so support for this specific edge is partial.
  - target: Mu-Opioid Receptor Desensitization and Tolerance
    causal_link_type: DIRECT
    description: >-
      Sustained agonist occupancy drives receptor phosphorylation,
      desensitization, and endocytosis.
    evidence:
    - reference: PMID:23321159
      reference_title: "Regulation of μ-opioid receptors: desensitization, phosphorylation, internalization, and tolerance."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Cellular and molecular mechanisms regulating MOR function by
        phosphorylation relative to receptor desensitization and endocytosis
        are comprehensively reviewed, with an emphasis on agonist-biased
        regulation and areas where knowledge is lacking or controversial.
      explanation: >-
        Establishes phosphorylation-driven desensitization and endocytosis as
        the receptor-level response to sustained agonism.
  - target: Opioid-Induced TLR4 and Microglial Neuroimmune Activation
    causal_link_type: DIRECT
    description: >-
      Opioid exposure additionally engages the TLR4/MD-2 innate immune complex.
      This edge is drawn from the exposure node rather than from the receptor
      event it names because the activation is non-stereoselective and so is
      not mediated by the mu-opioid receptor; it is the same drug acting at a
      second, unrelated target.
    evidence:
    - reference: PMID:19679181
      reference_title: Evidence that opioids may have toll-like receptor 4 and MD-2 effects.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        A range of structurally diverse clinically-employed opioid analgesics
        was found to be capable of activating TLR4 signaling in vitro.
      explanation: >-
        Establishes that opioid exposure as a class, not one particular agent,
        is what activates this arm.
  - target: Brainstem Respiratory Rhythm Suppression
    causal_link_type: DIRECT
    description: >-
      The same receptor is expressed on brainstem respiratory neurons, so
      agonism suppresses respiratory drive directly rather than as a
      downstream complication.
    evidence:
    - reference: PMID:35471232
      reference_title: Mechanisms of opioid-induced respiratory depression.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
          Deletion of μ opioid receptors from neurons showed that the preBötC and
          KF/PBN contribute to OIRD with the KF as a respiratory modulator and the
          preBötC as inspiratory rhythm generator.
      explanation: >-
          Receptor-deletion experiments establish that the respiratory effect is
          mediated by mu-opioid receptors on specific brainstem neurons, which is
          exactly the causal link this edge asserts.
  evidence:
  - reference: PMID:31400808
    reference_title: "Neurobiology of Opioid Addiction: Opponent Process, Hyperkatifeia, and Negative Reinforcement."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Opioids are powerful drugs that usurp and overpower the reward function
      of endogenous opioids and engage dramatic tolerance and withdrawal via
      molecular and neurocircuitry neuroadaptations within the same reward
      system.
    explanation: >-
      Frames exogenous opioid action as hijacking the endogenous opioid reward
      system, the premise of this node.
- name: VTA Disinhibition and Mesolimbic Dopamine Release
  biological_scale: CELLULAR
  description: >-
    Mu-opioid receptor agonism on ventral tegmental GABAergic interneurons
    removes their inhibitory tone on dopaminergic projection neurons,
    increasing dopamine release in the nucleus accumbens. This disinhibition
    route is the positive reinforcement of early use, and it is mechanistically
    distinct from the direct dopamine-releasing action of stimulants.
  cell_types:
  - preferred_term: dopaminergic neuron
    term:
      id: CL:0000700
      label: dopaminergic neuron
  - preferred_term: GABAergic interneuron
    term:
      id: CL:0011005
      label: GABAergic interneuron
  - preferred_term: medium spiny neuron
    term:
      id: CL:1001474
      label: medium spiny neuron
  locations:
  - preferred_term: ventral tegmental area
    term:
      id: UBERON:0002691
      label: ventral tegmental area
  - preferred_term: nucleus accumbens
    term:
      id: UBERON:0001882
      label: nucleus accumbens
  biological_processes:
  - preferred_term: dopamine secretion
    term:
      id: GO:0014046
      label: dopamine secretion
    modifier: INCREASED
  downstream:
  - target: Reward-System Downregulation and Hyperkatifeia
    causal_link_type: DIRECT
    description: >-
      Repeated supraphysiological reward-system activation drives the opponent
      adaptation that lowers hedonic set point.
    evidence:
    - reference: PMID:31400808
      reference_title: "Neurobiology of Opioid Addiction: Opponent Process, Hyperkatifeia, and Negative Reinforcement."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
          Such negative emotional states that drive negative reinforcement are
          hypothesized to derive from the within-system dysregulation of key
          neurochemical circuits that mediate incentive-salience and/or reward
          systems (dopamine, opioid peptides) in the ventral striatum
      explanation: >-
          Locates the reward-system dysregulation in the same ventral striatal
          dopamine and opioid-peptide circuits that the acute reward node engages.
  - target: Compulsive Opioid Seeking and Loss of Control
    causal_link_type: DIRECT
    description: >-
      Positive reinforcement sustains early, pre-dependence use.
  evidence:
  - reference: PMID:31400808
    reference_title: "Neurobiology of Opioid Addiction: Opponent Process, Hyperkatifeia, and Negative Reinforcement."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Such negative emotional states that drive negative reinforcement are
      hypothesized to derive from the within-system dysregulation of key
      neurochemical circuits that mediate incentive-salience and/or reward
      systems (dopamine, opioid peptides) in the ventral striatum
    explanation: >-
      Identifies ventral striatal dopamine and opioid peptide circuits as the
      reward system that later dysregulates. Support is partial because this
      review describes the dysregulation rather than the acute disinhibition
      step itself.
- name: Mu-Opioid Receptor Desensitization and Tolerance
  biological_scale: MOLECULAR
  description: >-
    Chronic agonist exposure produces receptor phosphorylation,
    desensitization, and internalization, so that progressively higher doses
    are needed for the same effect. Tolerance to analgesia and euphoria is what
    drives dose escalation; critically, tolerance to respiratory depression
    develops incompletely and is lost quickly during abstinence, which is the
    pharmacological basis of the post-detoxification and post-release overdose
    spike.
  biological_processes:
  - preferred_term: G protein-coupled opioid receptor signaling pathway
    term:
      id: GO:0038003
      label: G protein-coupled opioid receptor signaling pathway
    modifier: DECREASED
  downstream:
  - target: cAMP-PKA Superactivation in Locus Coeruleus Noradrenergic Neurons
    causal_link_type: DIRECT
    description: >-
      Cellular counter-adaptation to sustained inhibitory signalling upregulates
      the cAMP cascade.
  - target: Opioid-Induced Hyperalgesia
    causal_link_type: DIRECT
    description: >-
      Chronic exposure sensitizes pronociceptive pathways in parallel with, and
      mechanistically distinct from, receptor-level tolerance.
    evidence:
    - reference: PMID:21412369
      reference_title: A comprehensive review of opioid-induced hyperalgesia.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
          Opioid-induced hyperalgesia (OIH) is defined as a state of nociceptive
          sensitization caused by exposure to opioids.
      explanation: >-
          States that opioid exposure causes the sensitization, which is the
          direction this edge asserts.
  evidence:
  - reference: PMID:23321159
    reference_title: "Regulation of μ-opioid receptors: desensitization, phosphorylation, internalization, and tolerance."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A major problem in treating painful conditions is that tolerance limits
      the long-term utility of opioid agonists.
    explanation: >-
      Establishes tolerance as the central clinical consequence of the
      receptor regulation this node models.
  - reference: PMID:23321159
    reference_title: "Regulation of μ-opioid receptors: desensitization, phosphorylation, internalization, and tolerance."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      While some functional MOR regulatory mechanisms contributing to tolerance
      are clearly understood, there are large gaps in understanding the
      molecular processes responsible for loss of MOR function after chronic
      exposure to opioids.
    explanation: >-
      The authors state explicitly that the molecular basis of chronic tolerance
      is incompletely understood, so this node's mechanism is only partially
      established.
- name: Opioid-Induced TLR4 and Microglial Neuroimmune Activation
  biological_scale: CELLULAR
  description: >-
    A non-classical, non-opioid-receptor arm of opioid action: opioids and some
    of their metabolites activate the TLR4/MD-2 innate immune complex on
    microglia and other myeloid cells, driving proinflammatory glial activation
    that opposes analgesia and contributes to analgesic tolerance, hyperalgesia,
    and withdrawal behaviour. The pharmacology is distinctive — activation is
    non-stereoselective, so it is not mediated by the mu-opioid receptor, and it
    is blocked by classical TLR4 antagonists. This node is deliberately kept
    parallel to, not upstream of, `Mu-Opioid Receptor Desensitization and
    Tolerance`: it is a second route to the same clinical endpoints rather than
    a cause of receptor-level desensitization.

    The arm is well evidenced in rodents and in vitro and only weakly
    corroborated in people; see the `oud_tlr4_glial_human_translation`
    discussion for that mismatch, and the bounding evidence below for its
    dose-dependence.
  cell_types:
  - preferred_term: Microglia
    term:
      id: CL:0000129
      label: microglial cell
  biological_processes:
  - preferred_term: TLR4/MD-2 innate immune signalling
    term:
      id: GO:0034142
      label: toll-like receptor 4 signaling pathway
    modifier: INCREASED
  - preferred_term: Proinflammatory microglial activation
    term:
      id: GO:0001774
      label: microglial cell activation
    modifier: INCREASED
  downstream:
  - target: Opioid-Induced Hyperalgesia
    causal_link_type: DIRECT
    description: >-
      Blocking TLR4 signalling in vivo attenuates the development of
      opioid-induced hyperalgesia, which is the direction this edge asserts.
    evidence:
    - reference: PMID:19679181
      reference_title: Evidence that opioids may have toll-like receptor 4 and MD-2 effects.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Pharmacological blockade of TLR4 signaling in vivo potentiated acute
        intrathecal morphine analgesia, attenuated development of analgesic
        tolerance, hyperalgesia, and opioid withdrawal behaviors.
      explanation: >-
        Loss of the hyperalgesia phenotype when the node is pharmacologically
        disabled is what supports the causal direction of this edge.
    - reference: PMID:31209174
      reference_title: "Role of Nociceptor Toll-like Receptor 4 (TLR4) in Opioid-Induced Hyperalgesia and Hyperalgesic Priming."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        whereas OIH and priming induced by LDM share receptor and second
        messenger mechanisms in common, action at TLR4 and signaling via PKC
      explanation: >-
        Bounds the edge: TLR4 dependence was demonstrated for hyperalgesia
        induced by low-dose morphine, and the same study found high-dose
        morphine effects to be neither TLR4- nor PKCepsilon-dependent. The edge
        is therefore dose-conditional rather than general.
  - target: Noradrenergic Hyperactivity and Opioid Withdrawal Syndrome
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Glial proinflammatory mediator release sensitizing withdrawal-expressing circuitry
    description: >-
      TLR4 blockade attenuates opioid withdrawal behaviour, placing this arm
      upstream of withdrawal expression alongside — not instead of — the
      cAMP-PKA noradrenergic mechanism.
    evidence:
    - reference: PMID:19679181
      reference_title: Evidence that opioids may have toll-like receptor 4 and MD-2 effects.
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Pharmacological blockade of TLR4 signaling in vivo potentiated acute
        intrathecal morphine analgesia, attenuated development of analgesic
        tolerance, hyperalgesia, and opioid withdrawal behaviors.
      explanation: >-
        The withdrawal-behaviour result is reported as one item in a combined
        statement, without a separate effect size, so it supports the edge only
        partially.
  evidence:
  - reference: PMID:19679181
    reference_title: Evidence that opioids may have toll-like receptor 4 and MD-2 effects.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Morphine non-stereoselectively induced TLR4 signaling in vitro, blocked by
      a classical TLR4 antagonist and non-stereoselectively by naloxone.
    explanation: >-
      Non-stereoselective activation blocked by a TLR4 antagonist is what
      establishes this as a TLR4 event rather than a mu-opioid receptor one.
  - reference: PMID:19679181
    reference_title: Evidence that opioids may have toll-like receptor 4 and MD-2 effects.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      TLR4 opposition to opioid actions was supported by morphine treatment of
      TLR4 knockout mice, which revealed a significant threefold leftward shift
      in the analgesia dose response function, versus wildtype mice.
    explanation: >-
      Genetic removal of TLR4 shifts the morphine dose-response, giving a
      loss-of-function line of evidence independent of the pharmacology.
  - reference: PMID:25975386
    reference_title: "The effects of ibudilast, a glial activation inhibitor, on opioid withdrawal symptoms in opioid-dependent volunteers."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although overall SOWS scores did not differ between groups, exploratory
      analyses pooling the two ibudilast groups demonstrated that they had lower
      ratings of withdrawal symptoms
    explanation: >-
      The only human interventional test of this node available here. The
      prespecified comparison was null and the supportive result is an
      exploratory pooled subscale analysis, so it corroborates the node weakly
      and is recorded as PARTIAL rather than SUPPORT.
- name: cAMP-PKA Superactivation in Locus Coeruleus Noradrenergic Neurons
  biological_scale: CELLULAR
  description: >-
    Opioid agonism acutely inhibits adenylyl cyclase in locus coeruleus
    noradrenergic neurons; chronic exposure drives a compensatory upregulation
    of the cAMP-PKA cascade. While drug is present the two oppose each other
    and firing is near normal. This is the classic opponent-process substrate
    of opioid physical dependence.
  cell_types:
  - preferred_term: noradrenergic neuron
    term:
      id: CL:0008025
      label: noradrenergic neuron
  locations:
  - preferred_term: locus coeruleus
    term:
      id: UBERON:0002148
      label: locus ceruleus
  biological_processes:
  - preferred_term: adenylate cyclase-inhibiting signaling
    term:
      id: GO:0007193
      label: adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
    modifier: ABNORMAL
  downstream:
  - target: Noradrenergic Hyperactivity and Opioid Withdrawal Syndrome
    causal_link_type: DIRECT
    description: >-
      Removing the drug unmasks the compensatory cAMP-PKA upregulation as a
      surge of noradrenergic firing.
    evidence:
    - reference: PMID:32002194
      reference_title: "Efficacy of lofexidine for mitigating opioid withdrawal symptoms: results from two randomized, placebo-controlled trials."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: >-
          Lofexidine is an FDA-approved, alpha2-adrenergic receptor agonist for
          treatment of OWS.
      explanation: >-
          Suppression of the withdrawal syndrome by an alpha-2 adrenergic agonist
          is pharmacological support for a noradrenergic output stage. The
          cAMP-PKA step upstream of it is not demonstrated by this trial, so
          support is partial.
  evidence:
  - reference: PMID:32002194
    reference_title: "Efficacy of lofexidine for mitigating opioid withdrawal symptoms: results from two randomized, placebo-controlled trials."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Lofexidine is an FDA-approved, alpha2-adrenergic receptor agonist for
      treatment of OWS.
    explanation: >-
      That an alpha-2 adrenergic agonist is an approved treatment for opioid
      withdrawal is pharmacological support for a noradrenergic substrate;
      the trial does not itself demonstrate the cAMP-PKA mechanism, so support
      is partial.
- name: Noradrenergic Hyperactivity and Opioid Withdrawal Syndrome
  biological_scale: ORGANISM
  description: >-
    On cessation or antagonist administration, unopposed noradrenergic
    hyperactivity produces the characteristic syndrome: rhinorrhea,
    lacrimation, mydriasis, piloerection, myalgia, nausea, vomiting, diarrhea,
    sweating, insomnia, and dysphoria. It is intensely aversive but, unlike
    alcohol or benzodiazepine withdrawal, rarely life-threatening in itself —
    its clinical danger is that it drives return to use, and that abstinence
    resets tolerance.
  downstream:
  - target: Reward-System Downregulation and Hyperkatifeia
    causal_link_type: DIRECT
    description: >-
      Repeated withdrawal episodes recruit and sensitize the brain stress
      systems that generate the negative emotional state.
  - target: Compulsive Opioid Seeking and Loss of Control
    causal_link_type: DIRECT
    description: >-
      Using to relieve or avoid withdrawal is itself a DSM-5 pharmacological
      criterion and a direct route back into use.
    evidence:
    - reference: PMID:32002194
      reference_title: "Efficacy of lofexidine for mitigating opioid withdrawal symptoms: results from two randomized, placebo-controlled trials."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
          Fear of opioid withdrawal syndrome (OWS) often dissuades opioid
          discontinuation.
      explanation: >-
          Documents that the withdrawal syndrome itself deters cessation, which is
          the behavioural mechanism this edge asserts.
  - target: Prefrontal Executive Control Deficit
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Repeated cycles of intoxication and withdrawal driving frontal-circuit neuroplasticity
    description: >-
      Repeated withdrawal episodes are part of the cycle that degrades
      prefrontal control, which is what makes the preoccupation/anticipation
      stage self-sustaining.
    evidence:
    - reference: PMID:27475769
      reference_title: "Neurobiology of addiction: a neurocircuitry analysis."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
        The craving and deficits in executive function in the so-called
        preoccupation/anticipation stage involve the dysregulation of key
        afferent projections from the prefrontal cortex and insula, including
        glutamate, to the basal ganglia and extended amygdala.
      explanation: >-
        Places the executive-function deficit in the same cycle stage as
        craving and links it to prefrontal projections onto the basal ganglia
        and extended amygdala. This is a cross-substance addiction review
        rather than opioid-specific evidence, so support is partial.
  evidence:
  - reference: PMID:32002194
    reference_title: "Efficacy of lofexidine for mitigating opioid withdrawal symptoms: results from two randomized, placebo-controlled trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fear of opioid withdrawal syndrome (OWS) often dissuades opioid
      discontinuation.
    explanation: >-
      Documents the aversiveness of the syndrome and its role as a barrier to
      cessation, which is the behavioural significance this node carries.
  - reference: PMID:31400808
    reference_title: "Neurobiology of Opioid Addiction: Opponent Process, Hyperkatifeia, and Negative Reinforcement."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, they also engage the brain systems for stress and pain (somatic
      and emotional) while producing hyperalgesia and hyperkatifeia, which
      drive pronounced drug-seeking behavior via processes of negative
      reinforcement.
    explanation: >-
      Links the stress and pain systems engaged in withdrawal to
      negative-reinforcement drug seeking.
- name: Reward-System Downregulation and Hyperkatifeia
  biological_scale: ORGANISM
  description: >-
    The withdrawal/negative-affect stage combines a within-system reward
    deficit (reduced dopaminergic and opioid-peptide tone in ventral striatum)
    with between-system recruitment of extended-amygdala stress mediators —
    corticotropin-releasing factor, dynorphin, norepinephrine, hypocretin,
    glucocorticoids. The resulting dysphoria, anxiety, and anhedonia extend
    into protracted abstinence and drive relapse by negative reinforcement.
  locations:
  - preferred_term: central amygdala
    term:
      id: UBERON:0002883
      label: central amygdaloid nucleus
  - preferred_term: nucleus accumbens
    term:
      id: UBERON:0001882
      label: nucleus accumbens
  biological_processes:
  - preferred_term: dopamine secretion
    term:
      id: GO:0014046
      label: dopamine secretion
    modifier: DECREASED
  downstream:
  - target: Compulsive Opioid Seeking and Loss of Control
    causal_link_type: DIRECT
    description: >-
      Negative reinforcement — using to remove an aversive internal state —
      sustains compulsive use after the euphoric effect has waned.
    evidence:
    - reference: PMID:31400808
      reference_title: "Neurobiology of Opioid Addiction: Opponent Process, Hyperkatifeia, and Negative Reinforcement."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Hyperkatifeia can extend into protracted abstinence and interact with
        learning processes in the form of conditioned withdrawal to facilitate
        relapse to compulsive-like drug seeking.
      explanation: >-
        States the relapse-facilitating role of the negative emotional state
        that this edge asserts.
  evidence:
  - reference: PMID:31400808
    reference_title: "Neurobiology of Opioid Addiction: Opponent Process, Hyperkatifeia, and Negative Reinforcement."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Such negative emotional states that drive negative reinforcement are
      hypothesized to derive from the within-system dysregulation of key
      neurochemical circuits that mediate incentive-salience and/or reward
      systems (dopamine, opioid peptides) in the ventral striatum and from the
      between-system recruitment of brain stress systems
      (corticotropin-releasing factor, dynorphin, norepinephrine, hypocretin,
      vasopressin, glucocorticoids, and neuroimmune factors) in the extended
      amygdala.
    explanation: >-
      Names both arms — within-system reward deficit and between-system stress
      recruitment — and their anatomy.
  - reference: PMID:31400808
    reference_title: "Neurobiology of Opioid Addiction: Opponent Process, Hyperkatifeia, and Negative Reinforcement."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In animal models, repeated extended access to drugs or opioids results in
      negative emotion-like states, reflected by the elevation of reward
      thresholds, lower pain thresholds, anxiety-like behavior, and
      dysphoric-like responses.
    explanation: >-
      Provides the preclinical operationalization of the negative emotional
      state, including the elevated reward threshold that defines reward
      deficit.
- name: Opioid-Induced Hyperalgesia
  biological_scale: ORGANISM
  description: >-
    Paradoxical nociceptive sensitization caused by opioid exposure, in which a
    patient receiving opioids becomes more sensitive to painful stimuli. It is
    mechanistically distinct from tolerance — sensitization of pronociceptive
    pathways rather than loss of receptor responsiveness — and it matters
    clinically because it can be mistaken for undertreated pain and answered
    with a dose increase that worsens it.
  biological_processes:
  - preferred_term: sensory perception of pain
    term:
      id: GO:0019233
      label: sensory perception of pain
    modifier: INCREASED
  downstream:
  - target: Compulsive Opioid Seeking and Loss of Control
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Increased pain leading to dose escalation and continued exposure
    description: >-
      Increased pain sensitivity motivates further opioid use, closing a
      self-reinforcing loop.
    evidence:
    - reference: PMID:21412369
      reference_title: A comprehensive review of opioid-induced hyperalgesia.
      supports: PARTIAL
      evidence_source: OTHER
      snippet: >-
          OIH appears to be a distinct, definable, and characteristic phenomenon
          that could explain loss of opioid efficacy in some patients.
      explanation: >-
          Loss of opioid efficacy is the mechanism by which hyperalgesia drives
          dose escalation. The review frames this as a possible explanation, so
          support is partial.
  evidence:
  - reference: PMID:21412369
    reference_title: A comprehensive review of opioid-induced hyperalgesia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Opioid-induced hyperalgesia (OIH) is defined as a state of nociceptive
      sensitization caused by exposure to opioids.
    explanation: >-
      Defines the phenomenon this node models.
  - reference: PMID:21412369
    reference_title: A comprehensive review of opioid-induced hyperalgesia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is generally thought to result from neuroplastic changes in the
      peripheral and central nervous system (CNS) that lead to sensitization of
      pronociceptive pathways.
    explanation: >-
      States the sensitization mechanism that distinguishes hyperalgesia from
      receptor-level tolerance.
  - reference: PMID:21412369
    reference_title: A comprehensive review of opioid-induced hyperalgesia.
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Findings of the clinical prevalence of OIH are not available.
    explanation: >-
      The review states that clinical prevalence is unknown, so no frequency
      claim can be attached to this node.
- name: Brainstem Respiratory Rhythm Suppression
  biological_scale: ORGANISM
  description: >-
    Mu-opioid receptors on brainstem respiratory neurons — the preBotzinger
    complex, which generates inspiratory rhythm, and the Kolliker-Fuse and
    parabrachial nuclei, which modulate breathing — mediate depression of
    respiratory drive. Combined with reduced consciousness and airway
    obstruction this produces ventilatory insufficiency. This is the proximate
    cause of opioid-induced death and the target of naloxone.
  biological_processes:
  - preferred_term: G protein-coupled opioid receptor signaling pathway
    term:
      id: GO:0038003
      label: G protein-coupled opioid receptor signaling pathway
    modifier: INCREASED
  notes: >-
    No `cell_types` term is bound. The relevant populations are preBotzinger
    complex inspiratory rhythm-generating neurons and Kolliker-Fuse
    respiratory-modulating neurons; CL has no term at that granularity, and
    falling back to CL:0000540 neuron (used in an earlier draft) carries no
    information beyond what the node name already says. Needs term / NTR
    candidate.
  downstream:
  - target: Fatal Opioid Overdose
    causal_link_type: DIRECT
    description: >-
      Sustained ventilatory insufficiency produces hypoxaemia and death unless
      reversed.
    evidence:
    - reference: PMID:35471232
      reference_title: Mechanisms of opioid-induced respiratory depression.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
          Opioid-induced respiratory depression (OIRD), the primary cause of
          opioid-induced death, is the neural depression of respiratory drive
          which, together with a decreased level of consciousness and obstructive
          sleep apnea, cause ventilatory insufficiency.
      explanation: >-
          Names respiratory depression as the primary cause of opioid death, which
          is precisely this edge.
  evidence:
  - reference: PMID:35471232
    reference_title: Mechanisms of opioid-induced respiratory depression.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Opioid-induced respiratory depression (OIRD), the primary cause of
      opioid-induced death, is the neural depression of respiratory drive
      which, together with a decreased level of consciousness and obstructive
      sleep apnea, cause ventilatory insufficiency.
    explanation: >-
      Establishes respiratory depression as the mechanism of opioid death and
      names its three components.
  - reference: PMID:35471232
    reference_title: Mechanisms of opioid-induced respiratory depression.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Deletion of μ opioid receptors from neurons showed that the preBötC and
      KF/PBN contribute to OIRD with the KF as a respiratory modulator and the
      preBötC as inspiratory rhythm generator.
    explanation: >-
      Receptor-deletion experiments localize the effect to specific brainstem
      nuclei, giving the anatomical claim causal support.
- name: Fatal Opioid Overdose
  biological_scale: ORGANISM
  description: >-
    Death from ventilatory insufficiency. Risk is not a simple function of
    disorder severity: it is dominated by tolerance state (sharply elevated
    after detoxification or incarceration), by co-ingested sedatives, and by
    the potency of the illicit supply. This is why overdose risk can rise at
    precisely the moment a person stops using.
  evidence:
  - reference: PMID:35471232
    reference_title: Mechanisms of opioid-induced respiratory depression.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Variability of responses to opioids and individual differences in
      physiological and neurological states (e.g., anesthesia,
      sleep-disordered breathing, concurrent drug administration) add to the
      risk.
    explanation: >-
      Supports the claim that overdose risk is modified by physiological state
      and concurrent drugs rather than being a fixed property of the dose.
- name: Prefrontal Executive Control Deficit
  biological_scale: TISSUE
  description: >-
    Impaired top-down inhibitory control over drug seeking, with altered
    prefrontal-limbic connectivity. This is the preoccupation/anticipation arm
    of the addiction cycle, and it removes the counterweight to both
    cue-driven and withdrawal-driven use.
  locations:
  - preferred_term: prefrontal cortex
    term:
      id: UBERON:0000451
      label: prefrontal cortex
  downstream:
  - target: Compulsive Opioid Seeking and Loss of Control
    causal_link_type: DIRECT
    description: >-
      Loss of executive control permits drug seeking that would otherwise be
      inhibited.
  evidence:
  - reference: PMID:31400808
    reference_title: "Neurobiology of Opioid Addiction: Opponent Process, Hyperkatifeia, and Negative Reinforcement."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Compelling evidence indicates that plasticity in the brain pain emotional
      systems is triggered by acute excessive drug intake and becomes
      sensitized during the development of compulsive drug taking with repeated
      withdrawal.
    explanation: >-
      Supports drug-induced plasticity in emotion-related systems during the
      development of compulsive use. This review does not itself demonstrate
      the prefrontal executive deficit, so support is partial and a
      prefrontal-specific citation is a curation gap.
- name: Compulsive Opioid Seeking and Loss of Control
  biological_scale: ORGANISM
  description: >-
    The convergent clinical endpoint: compulsive opioid seeking and use despite
    harm, with impaired control over intake. Three motivational routes feed it
    — positive reinforcement early, negative reinforcement from withdrawal and
    hyperkatifeia later, and escalating pain from hyperalgesia — while
    prefrontal executive deficit removes the brake.
  downstream:
  - target: Brainstem Respiratory Rhythm Suppression
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    intermediate_mechanisms:
    - Continued and escalating exposure to mu-opioid receptor agonists, often of uncertain potency
    description: >-
      Sustained use maintains repeated exposure to doses capable of suppressing
      respiratory drive, which is how the behavioural disorder becomes lethal.
  evidence:
  - reference: PMID:31400808
    reference_title: "Neurobiology of Opioid Addiction: Opponent Process, Hyperkatifeia, and Negative Reinforcement."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, they also engage the brain systems for stress and pain (somatic

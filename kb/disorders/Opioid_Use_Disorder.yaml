  - target: Mu-Opioid Receptor Desensitization and Tolerance
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Chronic rather than single exposure is what produces durable receptor
      regulation and tolerance.
    evidence:
    - reference: PMID:23321159
      reference_title: "Regulation of μ-opioid receptors: desensitization, phosphorylation, internalization, and tolerance."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        there are large gaps in understanding the molecular processes
        responsible for loss of MOR function after chronic exposure to opioids
      explanation: >-
        Identifies chronic exposure as the variable that drives loss of
        receptor function, while flagging that the molecular detail is
        incomplete.
  evidence:
  - reference: PMID:36207451
    reference_title: "Multi-trait genome-wide association study of opioid addiction: OPRM1 and beyond."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Approximately 4% of the US population aged 12 and older (10.1 million
      people) misused opioids in 2019
    explanation: >-
      Quantifies how widespread the exposure modelled by this entry is, which
      is what makes a necessary-but-not-sufficient exposure epidemiologically
      significant.
treatments:
- name: Methadone
  description: >-
    Full mu-opioid receptor agonist with a long half-life, delivered through
    regulated opioid treatment programmes. The best-retained of the opioid
    agonist treatments. It works by occupying the same receptor the disorder is
    built on, which is why it suppresses withdrawal and craving without
    producing the reinforcing peak of short-acting opioids.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: methadone
      term:
        id: NCIT:C62044
        label: Methadone
  target_mechanisms:
  - target: Noradrenergic Hyperactivity and Opioid Withdrawal Syndrome
    treatment_effect: INHIBITS
    description: >-
      Sustained receptor occupancy prevents the unopposed noradrenergic surge
      that produces withdrawal.
  evidence:
  - reference: PMID:12804430
    reference_title: Methadone maintenance therapy versus no opioid replacement therapy for opioid dependence.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Methadone is an effective maintenance therapy intervention for the
      treatment of heroin dependence as it retains patients in treatment and
      decreases heroin use better than treatments that do not utilise opioid
      replacement therapy.
    explanation: >-
      Cochrane review conclusion establishing methadone maintenance against
      non-replacement approaches.
  - reference: PMID:12804430
    reference_title: Methadone maintenance therapy versus no opioid replacement therapy for opioid dependence.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      methadone appeared statistically significantly more effective than
      non-pharmacological approaches in retaining patient in treatment (3 RCTs,
      RR=3.05; 95%CI: 1.75-5.35) and in the suppression of heroin use (3 RCTs,
      RR=0.32; 95%CI: 0.23-0.44), but not statistically in criminal activity
    explanation: >-
      Quantifies the retention and heroin-use effects, and is explicit that the
      criminal-activity effect was not significant.
- name: Buprenorphine
  description: >-
    Partial mu-opioid receptor agonist, usually co-formulated with naloxone to
    deter injection. Its partial agonism produces a ceiling on respiratory
    depression, which gives it a wider safety margin than methadone and allows
    office-based prescribing — the trade-off is somewhat lower retention than
    methadone under flexible dosing.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: buprenorphine
      term:
        id: CHEBI:3216
        label: buprenorphine
  target_mechanisms:
  - target: Noradrenergic Hyperactivity and Opioid Withdrawal Syndrome
    treatment_effect: INHIBITS
    description: >-
      Partial agonism at the same receptor suppresses withdrawal while
      capping respiratory depression.
  evidence:
  - reference: PMID:24500948
    reference_title: Buprenorphine maintenance versus placebo or methadone maintenance for opioid dependence.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      There is high quality of evidence that buprenorphine was superior to
      placebo medication in retention of participants in treatment at all doses
      examined.
    explanation: >-
      Cochrane review of 31 trials establishes superiority to placebo for
      retention.
  - reference: PMID:24500948
    reference_title: Buprenorphine maintenance versus placebo or methadone maintenance for opioid dependence.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Methadone is superior to buprenorphine in retaining people in treatment,
      and methadone equally suppresses illicit opioid use.
    explanation: >-
      Bounds the claim: buprenorphine is effective but does not match methadone
      on retention, which is the main comparative caveat.
- name: Extended-Release Injectable Naltrexone
  description: >-
    Mu-opioid receptor antagonist given as a monthly injection. Conceptually
    the opposite of agonist treatment: it blocks the receptor rather than
    occupying it with a safer agonist. Its practical limitation is the
    induction hurdle — it requires full detoxification first, and failure to
    initiate is what drives its worse intention-to-treat outcomes.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: naltrexone
      term:
        id: CHEBI:7465
        label: naltrexone
  target_mechanisms:
  - target: VTA Disinhibition and Mesolimbic Dopamine Release
    treatment_effect: INHIBITS
    description: >-
      Receptor blockade prevents the disinhibition step that produces opioid
      reward.
  evidence:
  - reference: PMID:29150198
    reference_title: "Comparative effectiveness of extended-release naltrexone versus buprenorphine-naloxone for opioid relapse prevention (X:BOT): a multicentre, open-label, randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this population it is more difficult to initiate patients to XR-NTX
      than BUP-NX, and this negatively affected overall relapse. However, once
      initiated, both medications were equally safe and effective.
    explanation: >-
      The trial's own conclusion, separating the induction problem from
      once-initiated efficacy.
  - reference: PMID:29150198
    reference_title: "Comparative effectiveness of extended-release naltrexone versus buprenorphine-naloxone for opioid relapse prevention (X:BOT): a multicentre, open-label, randomised controlled trial."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among participants successfully inducted (per-protocol population,
      n=474), 24 week relapse events were similar across study groups (p=0·44).
    explanation: >-
      Quantifies the per-protocol equivalence that the intention-to-treat
      result obscures.
- name: Naloxone Overdose Reversal
  description: >-
    Competitive mu-opioid receptor antagonist that reverses opioid-induced
    respiratory depression within minutes. This treats the acute lethal event,
    not the disorder. Its half-life can be shorter than that of the opioid it
    reverses, so re-sedation after apparent recovery is a real hazard.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: naloxone
      term:
        id: CHEBI:7459
        label: naloxone
  target_mechanisms:
  - target: Brainstem Respiratory Rhythm Suppression
    treatment_effect: INHIBITS
    description: >-
      Competitive displacement of the agonist at brainstem mu-opioid receptors
      restores respiratory drive.
    evidence:
    - reference: PMID:35471232
      reference_title: Mechanisms of opioid-induced respiratory depression.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Reversal of OIRD has relied heavily on naloxone which also reverses
        analgesia but mismatches between the half-lives of naloxone and opioids
        can make it difficult to clinically safely avoid OIRD.
      explanation: >-
        States both the reversal mechanism and the half-life mismatch caveat.
  evidence:
  - reference: PMID:24874759
    reference_title: A systematic review of community opioid overdose prevention and naloxone distribution programs.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The current evidence from nonrandomized studies suggests that bystanders
      (mostly opioid users) can and will use naloxone to reverse opioid
      overdoses when properly trained, and that this training can be done
      successfully through OOPPs.
    explanation: >-
      Supports community naloxone distribution as an effective delivery route,
      while the authors are explicit that the evidence is nonrandomized.
- name: Lofexidine
  description: >-
    Alpha-2 adrenergic agonist approved for mitigating opioid withdrawal
    symptoms. Mechanistically it targets exactly the noradrenergic
    hyperactivity node rather than the opioid receptor, which is why it eases
    withdrawal without treating craving or preventing relapse.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: lofexidine
      term:
        id: CHEBI:51368
        label: lofexidine
  target_mechanisms:
  - target: Noradrenergic Hyperactivity and Opioid Withdrawal Syndrome
    treatment_effect: INHIBITS
    description: >-
      Alpha-2 autoreceptor agonism suppresses noradrenergic output, the
      substrate of somatic withdrawal.
  evidence:
  - reference: PMID:32002194
    reference_title: "Efficacy of lofexidine for mitigating opioid withdrawal symptoms: results from two randomized, placebo-controlled trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This simplified analysis confirmed previous per-protocol results, that
      lofexidine better reduces OWS severity and increases retention compared
      with placebo in opioid-dependent adults.
    explanation: >-
      Two randomized placebo-controlled trials support reduction in withdrawal
      severity and improved retention.
  - reference: PMID:32002194
    reference_title: "Efficacy of lofexidine for mitigating opioid withdrawal symptoms: results from two randomized, placebo-controlled trials."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Hypotension and bradycardia were more common with lofexidine.
    explanation: >-
      Records the predictable cardiovascular consequence of alpha-2 agonism,
      which bounds its use.
- name: Psychosocial Intervention Adjunctive to Opioid Agonist Therapy
  description: >-
    Cognitive behavioural therapy, contingency management, and related
    psychosocial treatments, delivered as an adjunct to opioid agonist therapy
    rather than as a substitute for it.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Cognitive Behavior Therapy
    term:
      id: NCIT:C64345
      label: Cognitive Behavior Therapy
  evidence:
  - reference: PMID:33370393
    reference_title: "Evaluating comparative effectiveness of psychosocial interventions adjunctive to opioid agonist therapy for opioid use disorder: A systematic review with network meta-analyses."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Guidelines recommend that individuals with opioid use disorder (OUD)
      receive pharmacological and psychosocial interventions; however, the most
      appropriate psychosocial intervention is not known.
    explanation: >-
      Establishes the adjunctive role while stating explicitly that the
      comparative question is unresolved.
diagnosis:
- name: DSM-5 and ICD-11 clinical diagnostic criteria
  description: >-
    Diagnosis is clinical and behavioural: DSM-5 requires at least 2 of 11
    criteria within 12 months, graded mild/moderate/severe by criterion count;
    ICD-11 codes opioid dependence at 6C43.2 using the dependence-syndrome
    framework. Physiological tolerance and withdrawal arising from appropriate
    medical opioid use do not by themselves establish the disorder — a
    distinction that matters for patients on long-term analgesia. There is no
    validated blood biomarker; urine immunoassay panels detect exposure, not
    the disorder, and frequently miss fentanyl and other synthetic opioids
    without an extended panel.
  evidence:
  - reference: PMID:29150198
    reference_title: "Comparative effectiveness of extended-release naltrexone versus buprenorphine-naloxone for opioid relapse prevention (X:BOT): a multicentre, open-label, randomised controlled trial."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Extended-release naltrexone (XR-NTX), an opioid antagonist, and
      sublingual buprenorphine-naloxone (BUP-NX), a partial opioid agonist, are
      pharmacologically and conceptually distinct interventions to prevent
      opioid relapse.
    explanation: >-
      Confirms DSM-criteria-based ascertainment is the standard entry point for
      OUD trials; the abstract does not enumerate the criteria, so support for
      the criteria themselves is partial.
- name: Clinical Opiate Withdrawal Scale and related severity instruments
  description: >-
    Withdrawal severity is graded with structured instruments — the Clinical
    Opiate Withdrawal Scale (COWS, observer-rated) and the Short Opioid
    Withdrawal Scale of Gossop (SOWS-G, self-reported) — which are the primary
    endpoints in withdrawal-treatment trials.
  evidence:
  - reference: PMID:32002194
    reference_title: "Efficacy of lofexidine for mitigating opioid withdrawal symptoms: results from two randomized, placebo-controlled trials."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Opioid-dependent adults received placebo or lofexidine; efficacy was
      assessed using the Short Opioid Withdrawal Scale of Gossop (SOWS-G)
      daily.
    explanation: >-
      Documents use of a standardized withdrawal severity instrument as the
      trial efficacy measure.

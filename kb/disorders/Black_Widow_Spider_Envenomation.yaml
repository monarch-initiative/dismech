discussions:
- kind: KNOWLEDGE_GAP
  discussion_id: which_receptor_arm_carries_the_effect
  prompt: >-
    Does alpha-latrotoxin drive exocytosis through the pore it forms, through
    receptor signalling, or through both - and in what proportion in a human
    envenomation?
  rationale: >-
    Both arms are supported, and the evidence for each is of a different kind.
    Both arms are now mechanistically described, which is a change from how
    this was framed until recently. The pore's prepore and pore states are
    resolved by cryo-EM to 3.1 and 3.7 Angstrom respectively, and the
    channel's conductance is measured. The receptor arm has its own delineated
    cascade - latrophilin-1 to Gaq-phospholipase C to IP3 to store release to
    store-operated calcium entry - established with a pore-deficient toxin
    mutant in latrophilin-1 knockout mice, which is the cleanest available way
    to isolate it from the pore. What remains open is not whether either arm
    exists but what each contributes in a human envenomation. The receptor
    cascade was characterised for spontaneous quantal release at the mouse
    neuromuscular junction, not for the massive discharge of latrodectism; all
    of the discriminating work is in cultured cells, synaptosomes and mice;
    and nothing in the clinical picture distinguishes the two.
  attaches_to:
  - pathophysiology#Latrophilin Receptor Signalling at the Nerve Terminal
  - mechanistic_hypotheses#receptor_mediated_secretion
  evidence:
  - reference: PMID:10382267
    reference_title: Mechanisms of alpha-latrotoxin action.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "The molecular details of how alpha-latrotoxin binding is transduced eventually to exocytosis remain to be elucidated."
    explanation: The gap, stated by the review that lays out both receptor families.
- kind: KNOWLEDGE_GAP
  discussion_id: antivenom_efficacy_is_unsettled
  prompt: >-
    Does equine antivenom add anything to adequate analgesia in latrodectism,
    and if the two placebo-controlled trials really disagree, why?
  rationale: >-
    RAVE-II randomised 224 patients against placebo on top of standardised
    analgesia and found no significant benefit. Dart and colleagues randomised
    60 patients against placebo and met their primary endpoint. Four
    candidate explanations remain, and the entry cannot choose between them: a
    different spider and a different antivenom product (Latrodectus hasselti in
    Australia versus L. mactans in the United States - the products' antibody
    formats are not described in either trial abstract, so no comparison of
    them is asserted here); a different primary endpoint (pain improvement at 2
    hours versus sustained reduction over 48 hours); a fourfold difference in
    size, with RAVE-II's confidence interval only just crossing zero; and the
    fact that RAVE-II gave both arms standardised analgesia first, which is a
    harder comparator to beat. The species explanation is the weakest of the
    four: redback antivenom neutralises L. mactans venom in a mouse model, so
    the two products are not obviously aimed at incomparable targets. The
    practical question - whether to give a product that causes systemic
    hypersensitivity in about 1 in 28 recipients, and that killed a patient in
    the largest published series - turns on the answer.
  attaches_to:
  - treatments#Equine antivenom
  evidence:
  - reference: PMID:24999282
    reference_title: "Randomized controlled trial of intravenous antivenom versus placebo for latrodectism: the second Redback Antivenom Evaluation (RAVE-II) study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "There remains considerable controversy over antivenom treatment."
    explanation: >-
      The trialists' own framing of the question, written before they added
      the largest negative result to it.
  - reference: PMID:11407496
    reference_title: "Neutralization of Latrodectus mactans and L. hesperus venom by redback spider (L. hasseltii) antivenom."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Redback spider antivenom is effective in neutralizing the lethal effects of L. hesperus and L. mactans venoms in a mouse envenomation model."
    explanation: >-
      Bears directly on the species explanation, and against it: the Australian
      antivenom neutralises both American species' venom in a mouse model, so
      species difference alone is a weak account of why the two trials
      disagree. The species names are the point of the quote, which is why the
      whole sentence is given.

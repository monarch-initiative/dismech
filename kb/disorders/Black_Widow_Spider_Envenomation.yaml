environmental:
- name: Bite by a female widow spider
  description: >-
    The exposure is an injection through the chelicerae into subcutaneous
    tissue. Only the mature female is capable of clinically significant
    envenomation. Bites are domestic and occupational rather than exotic -
    woodpiles, outbuildings, stored furniture - and cluster in warm months and
    warm states.
  exposure_term:
    preferred_term: exposure to alpha-latrotoxin by spider bite
    term:
      id: ECTO:0000730
      label: exposure to neurotoxin
  notes: >-
    Bound to the generic `ECTO:0000730` because ECTO has no spider, venom, bite
    or arthropod exposure class. OLS `q=venom, ontology=ecto` returns only
    CHEBI and FOODON hits (`CHEBI:78505` venom, `CHEBI:30751` formic acid,
    `CHEBI:6736` melittin); `q=spider, ontology=ecto` returns `CHEBI:6651`
    malathion and `FOODON:03414899` terrestrial invertebrate; `q=bite,
    ontology=ecto` returns `CHEBI:78505` venom, `ExO:0000060` injection route
    and `GO:0071626` mastication; `q=arthropod, ontology=ecto` returns UBERON,
    NCBITaxon and CHEBI terms only. None is an exposure class.
  influences_mechanisms:
  - target: Alpha-Latrotoxin Binding to Presynaptic Receptors
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The bite is the route by which the toxin reaches presynaptic terminals;
      nothing in the chain happens without it.

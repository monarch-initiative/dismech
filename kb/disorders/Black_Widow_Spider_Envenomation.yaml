      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "The black widow spider, Latrodectus mactans, stands out as one of the most medically significant arachnids due to its extensive geographic distribution in the United States and its ability to produce a potent neurotoxin, α-latrotoxin."
      explanation: Names the exposure and the toxin it delivers, which is what this link asserts.
  evidence:

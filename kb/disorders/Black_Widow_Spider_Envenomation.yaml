name: Black Widow Spider Envenomation
creation_date: '2026-09-18T17:30:00Z'
category: Injury
description: >-
  Acute systemic envenomation following a bite by a widow spider (Latrodectus
  species). The syndrome is called latrodectism, and almost all of it is the
  work of a single 130 kDa protein toxin, alpha-latrotoxin, which is the only
  one of the venom's seven latrotoxins that targets vertebrates. The toxin does
  not block anything. It does the opposite of botulinum toxin: it drives
  presynaptic nerve terminals to discharge their neurotransmitter without
  regard to the normal controls on release, and the resulting cholinergic and
  adrenergic excess produces severe muscle cramping, autonomic hyperactivity
  and pain that is characteristically out of proportion to an almost
  unremarkable bite site. It is self-limited in the overwhelming majority of
  cases, which is what makes the evidence about how to treat it so contested.
notes: >-
  No GeneReviews chapter exists and none is expected: this is an acquired
  envenomation with no Mendelian basis, so `just check-genereviews` returns
  NO_CHAPTER for both Bookshelf collections. There is likewise no `genetic:`
  section. The host proteins that matter here - neurexin-1alpha and
  latrophilin-1/ADGRL1 - are the toxin's receptors, not disease genes, and no
  human susceptibility locus has been established; they are curated as
  mechanism rather than as genetics.

  Two scope exclusions, recorded as decisions. **The insect- and
  crustacean-specific latrotoxins are not modelled.** Widow venom contains five
  latroinsectotoxins and one latrocrustatoxin alongside alpha-latrotoxin; they
  are irrelevant to human envenomation and appear here only in the sentence
  establishing that alpha-latrotoxin is the vertebrate-active one. **The local
  bite lesion is modelled only as far as the sources support.** Widow bites are
  characteristically non-necrotic - the necrotic-arachnidism picture belongs to
  Loxosceles - so no tissue-destruction branch is curated. Two local
  bite-site phenotypes are curated (erythema and local pain) and two are not.
  Local oedema and the target-pattern localized sweating are left out because
  no source cited here describes either in a quotable sentence about a widow
  bite; the frequencies circulating for them come from an uncited table in the
  deep-research report rather than from a paper. Note also that the obvious
  erythema sentence in `PMID:21762981` is about *loxoscelism* - Loxosceles,
  not Latrodectus - so it cannot be cited here, which is the ordinary
  wrong-disease trap in a review that covers several spiders at once.

  **No module conformance is declared, and that is a decision rather than an
  omission.** The two candidate modules both model the wrong direction.
  `neuromuscular_transmission_failure` is organised around loss of the safety
  factor of neuromuscular transmission - reduced quantal release - which is
  what botulinum toxin does and is the precise inverse of what
  alpha-latrotoxin does. `synaptic_vesicle_cycle` names every one of its nodes
  for an impairment or deficiency of the release machinery. Latrodectism is
  pathological *excess* of release by an intact machine driven by an exogenous
  toxin, so conforming to either would assert the opposite of the mechanism
  this entry curates. A module for toxin-driven unregulated exocytosis would be
  a new module, not a second use of one of these.
disease_term:
  preferred_term: black widow spider envenomation
  term:
    id: MONDO:0800176
    label: black widow spider envenomation
synonyms:
- latrodectism
- widow spider envenomation
- black widow envenomation
parents:
- Envenomation
- Arthropod Envenomation
clinical_burden:
  burden_level: VARIABLE
  rationale: >-
    Most exposures are minor and managed without a healthcare visit at all,
    but a minority produce pain severe enough to require intravenous opioids,
    and a small number produce myocarditis or rhabdomyolysis. VARIABLE rather
    than LOW because the distribution is genuinely wide and symptoms are more
    severe in young children; VARIABLE rather than MODERATE because the modal
    case is minor. Deaths from the envenomation itself are not reported in the
    sources cited here - but the largest series records a death from the
    antivenom, which is a different claim and is curated on that treatment.
  evidence:
  - reference: PMID:39670790
    reference_title: "Black Widow Spider Exposures: A Retrospective Review of the National Poison Data System 2012-2022."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Poison center data indicate that most black widow spider exposures result in minor consequences."
    explanation: The low-burden end of the distribution, across 15,299 reported exposures.
  - reference: PMID:39670790
    reference_title: "Black Widow Spider Exposures: A Retrospective Review of the National Poison Data System 2012-2022."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Hospital admission was required for 10.0% of exposures."
    explanation: >-
      The other end, and the reason the level is not LOW - one in ten reported
      exposures is admitted.
  - reference: PMID:29133072
    reference_title: "Treatment of pediatric black widow spider envenomation: A national poison center's experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Symptoms tend to be more severe in young children and adults."
    explanation: The age dependence this rationale invokes, which would otherwise be uncited.
mechanistic_hypotheses:
- hypothesis_group_id: pore_mediated_calcium_influx
  hypothesis_label: Pore-mediated calcium influx drives the exocytosis
  status: CANONICAL
  description: >-
    The tetrameric toxin inserts into the presynaptic membrane and forms a
    cation-selective channel; calcium entering through that channel triggers
    the massive exocytosis. This is the structurally resolved account and the
    one the cryo-EM work describes in detail.
  evidence:
  - reference: PMID:10865131
    reference_title: Alpha-latrotoxin and its receptors CIRL (latrophilin) and neurexin 1 alpha mediate effects on secretion through multiple mechanisms.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "The stimulation of secretion by alpha-latrotoxin in neuroendocrine cells is a consequence of Ca(2+) influx through these alpha-latrotoxin-induced channels."
    explanation: >-
      States the canonical account - the channel is the route, and calcium
      influx through it is the trigger.
- hypothesis_group_id: receptor_mediated_secretion
  hypothesis_label: A receptor-signalling arm acts independently of the pore
  status: ALTERNATIVE
  description: >-
    A second route in which the toxin's receptors do more than tether it:
    engagement of latrophilin/CIRL, a G-protein-coupled receptor, stimulates
    secretion without requiring calcium entry through a pore. It began as an
    inference from a negative observation - exocytosis happens in the complete
    absence of extracellular calcium, which the pore account cannot explain -
    and has since been given a full cascade, demonstrated with a pore-deficient
    toxin mutant so that the pore cannot be doing the work. Recorded as
    ALTERNATIVE rather than CANONICAL because what has been demonstrated is
    spontaneous quantal release at the mouse neuromuscular junction; no work
    apportions the two arms in a human envenomation.
  evidence:
  - reference: PMID:10382267
    reference_title: Mechanisms of alpha-latrotoxin action.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "However, this mechanism fails to explain exocytosis which occurred in the complete absence of extracellular calcium."
    explanation: >-
      The observation that requires a second arm at all, stated as the failure
      of the first. This is what makes the two accounts rival explanations
      rather than a single chain.
  - reference: PMID:10865131
    reference_title: Alpha-latrotoxin and its receptors CIRL (latrophilin) and neurexin 1 alpha mediate effects on secretion through multiple mechanisms.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "In addition to channel formation, alpha-latrotoxin enhances secretion in permeabilized cells through interaction with the plasma membrane receptor CIRL/latrophilin."
    explanation: >-
      Secretion enhanced through the receptor in permeabilized cells, which is
      the pore-independent claim.
  - reference: PMID:9430716
    reference_title: Neurexin I alpha is a major alpha-latrotoxin receptor that cooperates in alpha-latrotoxin action.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "The action of alpha-latrotoxin may therefore be mediated by independent parallel pathways, of which the CIRL/latrophilin pathway is sufficient for neurotransmitter release, whereas the neurexin I alpha pathway contributes to the Ca(2+)-dependent action of alpha-latrotoxin."
    explanation: >-
      The strongest evidence for this hypothesis, and it is genetic rather than
      pharmacological: in neurexin-1alpha knockout mice the latrophilin pathway
      alone is sufficient for release. Note what this does and does not say -
      "independent parallel pathways" is about the two receptors, not about
      pore versus signalling, so it establishes that the latrophilin arm can
      carry the effect without establishing how.
  - reference: PMID:9430716
    reference_title: Neurexin I alpha is a major alpha-latrotoxin receptor that cooperates in alpha-latrotoxin action.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "In cultured hippocampal neurons, alpha-latrotoxin was still capable of activating neurotransmission in the absence of neurexin I alpha."
    explanation: >-
      The knockout result itself - losing one receptor family does not abolish
      the toxin's action.
  - reference: PMID:42121922
    reference_title: "Latrophilin-1-Mediated G(αq) Signaling, Store-Operated Ca(2+) Entry, and Ca(V)2.1 Activation Control Spontaneous Exocytosis at the Mouse Neuromuscular Junction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Here, we dissect the LPHN1 signaling pathway at the vertebrate neuromuscular junction, using the pore-deficient αLTX mutant LTXN4C as a selective agonist."
    explanation: >-
      The design that makes this arm testable rather than merely inferred: a
      toxin mutant that cannot form a pore, used as the agonist, so any
      exocytosis observed cannot be attributed to the pore.
  - reference: PMID:42121922
    reference_title: "Latrophilin-1-Mediated G(αq) Signaling, Store-Operated Ca(2+) Entry, and Ca(V)2.1 Activation Control Spontaneous Exocytosis at the Mouse Neuromuscular Junction."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "This store depletion activates store-operated Ca2+ entry (SOCE), providing sustained Ca2+ required for LTXN4C-induced burst-like exocytosis."
    explanation: >-
      Closes the cascade to exocytosis. Read the scope carefully - this is
      spontaneous quantal release at the mouse neuromuscular junction, not the
      massive discharge of an envenomation.
pathophysiology:
- name: Alpha-Latrotoxin Binding to Presynaptic Receptors
  biological_scale: MOLECULAR
  description: >-
    Alpha-latrotoxin binds two structurally unrelated families of presynaptic
    receptor - neurexin-1alpha, which binds calcium-dependently, and
    latrophilin/CIRL, a G-protein-coupled receptor that binds without calcium.
    Their shared and best-evidenced function is tethering: holding the toxin
    at the membrane so that it can insert. The evidence for that is unusually
    clean, because a chimera carrying only the extracellular domain of CIRL-1
    on an unrelated viral transmembrane anchor produced the same channels as
    the wild-type receptor.
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  - preferred_term: autonomic and neurosecretory neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Alpha-Latrotoxin Tetramer Insertion and Pore Formation
    causal_link_type: DIRECT
    hypothesis_groups:
    - pore_mediated_calcium_influx
    description: >-
      Receptor tethering raises the efficiency of membrane insertion by orders
      of magnitude; insertion is inefficient without it.
    evidence:
    - reference: PMID:10692492
      reference_title: "Calcium-independent receptor for alpha-latrotoxin and neurexin 1alpha [corrected] facilitate toxin-induced channel formation: evidence that channel formation results from tethering of toxin to membrane."
      supports: SUPPORT
      evidence_source: IN_VITRO
      quote_role: PRIMARY_RESULT
      snippet: "We propose that alpha-latrotoxin receptors recruit toxin to facilitate its insertion across the membrane and that alpha-latrotoxin itself controls the conductance properties of the channels it produces."
      explanation: >-
        States the causal role this edge asserts - recruitment for insertion -
        and separates it from the conductance, which is the toxin's own.
  - target: Latrophilin Receptor Signalling at the Nerve Terminal
    causal_link_type: DIRECT
    hypothesis_groups:
    - receptor_mediated_secretion
    description: >-
      Under the alternative account the same binding event initiates receptor
      signalling rather than merely positioning the toxin.
  - target: Pain
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Pain begins where the venom is deposited, so it is drawn from the first
      node rather than from the systemic ones. Unknown intermediates on
      purpose: the entry models no local sensory-terminal node, and no cited
      source traces the route from toxin binding to nociception.
  evidence:
  - reference: PMID:39362850
    reference_title: Structural basis of α-latrotoxin transition to a cation-selective pore.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "This 130 kDa toxin binds to receptors at presynaptic nerve terminals and triggers a massive release of neurotransmitters."
    explanation: >-
      The target and the outcome in one sentence. BACKGROUND because it is the
      structural paper's framing of established biology rather than its own
      cryo-EM result.
  - reference: PMID:9430716
    reference_title: Neurexin I alpha is a major alpha-latrotoxin receptor that cooperates in alpha-latrotoxin action.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "A surprising finding was the biochemical description of two distinct cell surface proteins that bind alpha-latrotoxin with nanomolar affinities; Neurexin I alpha binds alpha-latrotoxin in a Ca(2+)-dependent manner, and CIRL/latrophilin binds in a Ca(2+)-independent manner."
    explanation: >-
      Both receptor families and the binding property that distinguishes them,
      which is the claim this node makes.
  - reference: PMID:10382267
    reference_title: Mechanisms of alpha-latrotoxin action.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "Neurexins are single transmembrane proteins which bind to alpha-latrotoxin in a calcium-dependent manner and also interact with the synaptic vesicle protein, synaptotagmin. On the other hand, latrophilin is a seven-transmembrane protein and belongs to the family of G-protein-coupled receptors."
    explanation: >-
      The two receptor families and the property that distinguishes them, which
      is why the calcium-free experiments discriminate between the hypotheses.
- name: Alpha-Latrotoxin Tetramer Insertion and Pore Formation
  biological_scale: MOLECULAR
  description: >-
    In the presence of calcium or magnesium the toxin assembles into a
    C4-symmetric tetramer, then undergoes a large conformational change: four
    N-terminal helical bundles refold into a rigid coiled-coil stalk that
    drives a pair of helices into the bilayer, opening a cation-permeable
    channel. The prepore and pore states have both been resolved by cryo-EM,
    so this is a structurally described event rather than an inferred one.
  molecular_functions:
  - preferred_term: cation-selective channel formed by an exogenous toxin
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0005261
      label: monoatomic cation channel activity
  - preferred_term: toxin activity of alpha-latrotoxin
    term:
      id: GO:0090729
      label: toxin activity
  downstream:
  - target: Presynaptic Calcium Influx
    causal_link_type: DIRECT
    hypothesis_groups:
    - pore_mediated_calcium_influx
  evidence:
  - reference: PMID:10625427
    reference_title: "Structure of alpha-latrotoxin oligomers reveals that divalent cation-dependent tetramers form membrane pores."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "We discovered that alpha-latrotoxin exists in two oligomeric forms: it is dimeric in EDTA but forms tetramers in the presence of Ca2+ or Mg2+."
    explanation: The divalent-cation dependence of tetramerization, which is the first step of this node.
  - reference: PMID:10625427
    reference_title: "Structure of alpha-latrotoxin oligomers reveals that divalent cation-dependent tetramers form membrane pores."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "The C4-symmetric tetramers represent the active form of alpha-latrotoxin; they have an axial channel and can insert into lipid bilayers with their hydrophobic base, providing the first model of alpha-latrotoxin pore formation."
    explanation: The tetramer as the active, membrane-inserting form.
  - reference: PMID:39362850
    reference_title: Structural basis of α-latrotoxin transition to a cation-selective pore.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Four distinct helical bundles rearrange and together form a highly stable, 15 nm long, cation-impermeable coiled-coil stalk. This stalk, in turn, positions an N-terminal pair of helices within the membrane, thereby enabling the assembly of a cation-permeable channel."
    explanation: >-
      The prepore-to-pore transition in structural detail, and the source of
      the two resolutions quoted elsewhere in this entry.
- name: Latrophilin Receptor Signalling at the Nerve Terminal
  biological_scale: MOLECULAR
  description: >-
    The alternative arm, and no longer a black box. Engagement of
    latrophilin-1 couples to Gaq and phospholipase C, generating IP3 that
    releases calcium from intracellular stores through IP3 receptors; the
    resulting store depletion opens store-operated calcium entry, which
    supplies the sustained calcium that exocytosis needs. The cascade was
    delineated at the mouse neuromuscular junction using a pore-deficient
    toxin mutant, so the pore is excluded by construction rather than by
    argument. What this does not establish is how much of a human envenomation
    runs through it.
  biological_processes:
  - preferred_term: G protein-coupled receptor signaling pathway
    modifier: INCREASED
    term:
      id: GO:0007186
      label: G protein-coupled receptor signaling pathway
  downstream:
  - target: Unregulated Neurotransmitter Exocytosis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    hypothesis_groups:
    - receptor_mediated_secretion
    description: >-
      The intermediates are named: Gaq, phospholipase C, IP3, IP3-receptor
      store release, then store-operated calcium entry. INDIRECT rather than
      DIRECT because that is five steps, and KNOWN rather than UNKNOWN because
      each was tested rather than assumed.
    evidence:
    - reference: PMID:42121922
      reference_title: "Latrophilin-1-Mediated G(αq) Signaling, Store-Operated Ca(2+) Entry, and Ca(V)2.1 Activation Control Spontaneous Exocytosis at the Mouse Neuromuscular Junction."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Upon activation, LPHN1 engages the Gαq-phospholipase C pathway to generate inositol 1,4,5-trisphosphate (IP3), triggering Ca2+ release from intracellular stores via IP3 receptors."
      explanation: >-
        The intermediates this edge claims, named and ordered, from
        electrophysiology in latrophilin-1 knockout mice with pharmacological
        inhibitors and calcium imaging.
  evidence:
  - reference: PMID:10692492
    reference_title: "Calcium-independent receptor for alpha-latrotoxin and neurexin 1alpha [corrected] facilitate toxin-induced channel formation: evidence that channel formation results from tethering of toxin to membrane."
    supports: REFUTE
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "An analysis of CIRL-1 mutants indicated that channel formation in HEK293 cells is unlikely to be transduced by a G-protein-dependent mechanism."
    explanation: >-
      REFUTE, and narrowly: what it excludes is a G-protein-dependent route to
      *channel formation*, in HEK293 cells overexpressing CIRL-1. This node
      claims a G-protein route to *secretion*, which is a different claim in a
      different system, and PMID:42121922 has since demonstrated exactly that
      route at the neuromuscular junction. Kept because it is a real negative
      result about a neighbouring claim and a reader should see it; it is not
      evidence that this arm does not exist.
- name: Presynaptic Calcium Influx
  biological_scale: CELLULAR
  description: >-
    Calcium enters the terminal through the toxin's own channel, a high
    conductance pore measured at around 400 pS, bypassing the voltage-gated
    calcium channels that normally gate release.
  biological_processes:
  - preferred_term: calcium ion transmembrane transport
    modifier: INCREASED
    term:
      id: GO:0070588
      label: calcium ion transmembrane transport
  downstream:
  - target: Unregulated Neurotransmitter Exocytosis
    causal_link_type: DIRECT
    hypothesis_groups:
    - pore_mediated_calcium_influx
  evidence:
  - reference: PMID:10692492
    reference_title: "Calcium-independent receptor for alpha-latrotoxin and neurexin 1alpha [corrected] facilitate toxin-induced channel formation: evidence that channel formation results from tethering of toxin to membrane."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "we demonstrate that the interaction of alpha-latrotoxin with CIRL-1 produces a high conductance channel that permits increases in cytosolic Ca(2+)"
    explanation: >-
      States what this node claims - the channel admits calcium into the
      cytosol - rather than only reporting a conductance.
  - reference: PMID:10692492
    reference_title: "Calcium-independent receptor for alpha-latrotoxin and neurexin 1alpha [corrected] facilitate toxin-induced channel formation: evidence that channel formation results from tethering of toxin to membrane."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "alpha-Latrotoxin interaction with CIRL-1 transiently expressed in bovine chromaffin cells produced a 400-pS channel, which rarely closed under Ca(2+)-free conditions."
    explanation: >-
      The measured conductance. INDIRECT because it was measured in
      CIRL-1-overexpressing bovine chromaffin cells, not at a presynaptic
      terminal, which is what this node is about.
- name: Unregulated Neurotransmitter Exocytosis
  biological_scale: CELLULAR
  description: >-
    The convergence point of both hypothesis arms, and the event that produces
    the whole clinical syndrome. Vesicular acetylcholine and catecholamines are
    discharged continuously rather than in response to action potentials.
  biological_processes:
  - preferred_term: synaptic vesicle exocytosis
    modifier: INCREASED
    term:
      id: GO:0016079
      label: synaptic vesicle exocytosis
  - preferred_term: neurotransmitter secretion
    modifier: INCREASED
    term:
      id: GO:0007269
      label: neurotransmitter secretion
  downstream:
  - target: Synaptic Vesicle Pool Depletion
    causal_link_type: DIRECT
  - target: Sustained Motor End-Plate Activation
    causal_link_type: DIRECT
  - target: Autonomic Neurotransmitter Excess
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:10382267
    reference_title: Mechanisms of alpha-latrotoxin action.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: REVIEW_SYNTHESIS
    snippet: "The major component of black widow spider venom, alpha-latrotoxin, triggers massive exocytosis in a variety of neurosecretory cells."
    explanation: The node's central claim, and that it is not restricted to one cell type.
- name: Synaptic Vesicle Pool Depletion
  biological_scale: CELLULAR
  description: >-
    Sustained exocytosis outrunning endocytic retrieval empties the terminal of
    both transmitter quanta and the vesicles themselves, with vesicle membrane
    left incorporated into the axolemma. Read the limitation, because it is
    load-bearing: the experiment showing this was run in the *absence* of
    extracellular calcium, and the same paper's calcium-present control found
    active recycling of both quanta and vesicles with no depletion at all.
    Calcium is present in an envenomated patient, so this node describes a
    demonstrated capability of the toxin rather than an established step of the
    human syndrome. No source cited here establishes that vesicle depletion is
    what makes latrodectism self-limited.
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  evidence:
  - reference: PMID:1967610
    reference_title: Redistribution of synaptophysin and synapsin I during alpha-latrotoxin-induced release of neurotransmitter at the neuromuscular junction.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "In nerve-muscle preparations treated for 1 h with a low dose of alpha-latrotoxin in the absence of extracellular Ca2+ (a condition under which nerve terminals are depleted of both quanta of neurotransmitter and synaptic vesicles), the immunolabeling for both proteins was distributed along the axolemma."
    explanation: >-
      Depletion of both quanta and vesicles, with vesicle membrane proteins
      redistributed to the axolemma. INDIRECT because the condition is
      calcium-free and an envenomated patient is not - see the refuting item
      below, which is the same paper's own control.
  - reference: PMID:1967610
    reference_title: Redistribution of synaptophysin and synapsin I during alpha-latrotoxin-induced release of neurotransmitter at the neuromuscular junction.
    supports: REFUTE
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "When the same dose of alpha-latrotoxin was applied in the presence of extracellular Ca2+, the immunoreactivity patterns resembled those obtained in resting preparations"
    explanation: >-
      The same paper's calcium-present control, which is the condition that
      applies in a patient, and in which retrieval kept pace. REFUTE against
      reading this node as an established step of the human syndrome. Recorded
      rather than omitted because the supporting quote alone would misrepresent
      the paper.
- name: Sustained Motor End-Plate Activation
  biological_scale: TISSUE
  description: >-
    Continuous acetylcholine release at the neuromuscular junction holds
    skeletal muscle in involuntary contraction. The cramping spreads
    contiguously from the bitten limb to the trunk, which is the feature that
    most often distinguishes latrodectism from an acute abdomen at the bedside.
  downstream:
  - target: Muscle spasm
    causal_link_type: DIRECT
  - target: Rigidity
    causal_link_type: DIRECT
  - target: Abdominal pain
    causal_link_type: DIRECT
  - target: Rhabdomyolysis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Blepharospasm
    causal_link_type: DIRECT
    description: >-
      The muscular component of facies latrodectismica - sustained orbicularis
      oculi contraction, the same end-plate mechanism as the cramping
      elsewhere.
  evidence:
  - reference: PMID:29133072
    reference_title: "Treatment of pediatric black widow spider envenomation: A national poison center's experience."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Black widow species (Latrodectus species) envenomation can produce a syndrome characterized by painful muscle rigidity and autonomic disturbances."
    explanation: >-
      The two clinical arms this node and the next one split into. BACKGROUND
      because it is the study's framing rather than its own result.
- name: Autonomic Neurotransmitter Excess
  biological_scale: ORGANISM
  description: >-
    The same unregulated release at autonomic terminals - acetylcholine at
    ganglia and exocrine glands, catecholamines at postganglionic sympathetic
    terminals - produces a mixed autonomic picture rather than a purely
    sympathetic one. Hypertension, tachycardia and diaphoresis sit alongside
    nausea, vomiting and lacrimation.

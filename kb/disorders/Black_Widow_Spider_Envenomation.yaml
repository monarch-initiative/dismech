treatments:
- name: Opioid analgesia
  description: >-
    The mainstay, and the comparator RAVE-II measured antivenom against.
    Pain in latrodectism is characteristically refractory to simple analgesics,
    so intravenous opioids are the practical first line.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: morphine
      term:
        id: CHEBI:17303
        label: morphine
  target_mechanisms:
  - target: Sustained Motor End-Plate Activation
    treatment_effect: MODULATES
    description: >-
      Drawn at the node that generates the pain rather than upstream, and
      MODULATES rather than INHIBITS on purpose - opioids do nothing to the
      toxin or to transmitter release, they raise the threshold at which the
      resulting nociception is felt.
    evidence:
    - reference: PMID:1351707
      reference_title: "Clinical presentation and treatment of black widow spider envenomation: a review of 163 cases."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Fifty-five percent of patients initially receiving IV morphine and 70% of those initially receiving both IV morphine and benzodiazepines obtained symptomatic relief without additional medication."
      explanation: >-
        INDIRECT: a therapeutic response cited in support of the node it acts
        on. The series is retrospective and uncontrolled, so the numbers
        describe practice rather than isolating the drug's effect.
  evidence:
  - reference: PMID:22058673
    reference_title: "The treatment of black widow spider envenomation with antivenin latrodectus mactans: a case series."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The significant pain associated with envenomation is often refractory to traditional analgesics."
    explanation: Why opioids rather than simple analgesia, stated as the clinical problem.
- name: Benzodiazepine muscle relaxation
  description: >-
    Given with opioids rather than instead of them. In the largest published
    series the combination outperformed opioid alone, and benzodiazepines are
    the second most frequently recorded therapy in US poison centre data.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy

    - preferred_term: diazepam
      term:
        id: CHEBI:49575
        label: diazepam
    - preferred_term: benzodiazepine
      term:
        id: NCIT:C1012
        label: Benzodiazepine
  target_mechanisms:
  - target: Sustained Motor End-Plate Activation
    treatment_effect: MODULATES
    description: >-
      Central muscle relaxation against the sustained contraction this node
      produces.
    evidence:
    - reference: PMID:1351707
      reference_title: "Clinical presentation and treatment of black widow spider envenomation: a review of 163 cases."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Fifty-five percent of patients initially receiving IV morphine and 70% of those initially receiving both IV morphine and benzodiazepines obtained symptomatic relief without additional medication."
      explanation: >-
        The same sentence supports both drugs, and the comparison within it -
        70% versus 55% - is what justifies adding the benzodiazepine.
        INDIRECT, and uncontrolled.
  evidence:
  - reference: PMID:39670790
    reference_title: "Black Widow Spider Exposures: A Retrospective Review of the National Poison Data System 2012-2022."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The most common therapies received were wound care (43.7%) and benzodiazepines (18.6%)."
    explanation: >-
      Benzodiazepines at 18.6%, second only to wound care. The abstract does
      not report opioid use, so this establishes frequency in practice rather
      than that benzodiazepines are the commonest drug given.
- name: Equine antivenom
  description: >-
    The contested treatment. Four studies bear on it and they do not
    agree, which is curated here rather than resolved: a large retrospective series reporting
    resolution in about half an hour, a route-comparison trial whose authors
    concluded antivenom may add nothing over placebo, a placebo-controlled
    trial in 224 patients finding no benefit over standardised analgesia, and a
    second placebo-controlled trial in 60 patients meeting its primary
    endpoint. The entry records all four and the reasons they may differ.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: antivenom administration
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  notes: >-
    Bound to the generic `NCIT:C15986` because NCIT has no antivenom class
    other than a product-specific one: OLS `q=Antivenin, ontology=ncit`
    returns only `NCIT:C87794` Coral Snake (Micrurus fulvius) Immune Globulin
    Antivenin (Equine), which names a different product. The existing
    `Snakebite_Envenoming` entry binds the same generic term for antivenom
    administration.
  target_mechanisms:
  - target: Alpha-Latrotoxin Binding to Presynaptic Receptors
    treatment_effect: INHIBITS
    description: >-
      Antivenom neutralises circulating toxin, so it acts upstream of the
      receptor - which is also the likeliest reason the trials disagree. By the
      time a patient presents in severe pain the binding and insertion steps
      have already happened, and neutralising toxin that has not yet bound
      cannot undo them.
    evidence:
    - reference: PMID:11407496
      reference_title: "Neutralization of Latrodectus mactans and L. hesperus venom by redback spider (L. hasseltii) antivenom."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Redback spider antivenom is effective in neutralizing the lethal effects of L. hesperus and L. mactans venoms in a mouse envenomation model."
      explanation: >-
        Neutralisation is the mechanism this edge asserts. INDIRECT because it
        is a mouse lethality assay rather than a measurement at the receptor
        and the antigen was premixed with antibody, which is the condition the
        companion item below records.
    - reference: PMID:11407496
      reference_title: "Neutralization of Latrodectus mactans and L. hesperus venom by redback spider (L. hasseltii) antivenom."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "While this study is limited by the optimized premixing of antigen with antibody"
      explanation: >-
        The authors' own caveat, and it is the same point this edge makes:
        premixing guarantees the antivenom meets the toxin before the toxin
        meets a receptor, which is exactly the condition a patient presenting
        hours after a bite does not satisfy. Quoted because it strengthens the
        edge's stated limitation rather than the treatment's case.
  evidence:
  - reference: PMID:1351707
    reference_title: "Clinical presentation and treatment of black widow spider envenomation: a review of 163 cases."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Fifty-eight patients received antivenin with complete resolution of symptoms in a mean time of 31 +/- 26.7 minutes."
    explanation: >-
      The positive retrospective signal, and the one clinicians most often
      cite. INDIRECT and uncontrolled - there is no comparator arm inside this
      number, and a self-limited syndrome will resolve on its own.
  - reference: PMID:24999282
    reference_title: "Randomized controlled trial of intravenous antivenom versus placebo for latrodectism: the second Redback Antivenom Evaluation (RAVE-II) study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The addition of antivenom to standardized analgesia in patients with latrodectism did not significantly improve pain or systemic effects."
    explanation: >-
      The largest placebo-controlled trial, and it is negative. REFUTE against
      the claim that antivenom adds benefit on top of adequate analgesia -
      which is the claim that matters clinically, since analgesia is given
      either way.
  - reference: PMID:24999282
    reference_title: "Randomized controlled trial of intravenous antivenom versus placebo for latrodectism: the second Redback Antivenom Evaluation (RAVE-II) study."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Two hours after treatment, 26 of 112 patients (23%) from the placebo arm had a clinically significant improvement in pain versus 38 of 112 (34%) from the antivenom arm (difference in favor of antivenom 10.7%; 95% confidence interval -1.1% to 22.6%; P=.10)."
    explanation: >-
      The numbers behind that conclusion. Worth reading rather than
      summarising: the point estimate favours antivenom by 10.7 points and the
      interval only just crosses zero, so this is an underpowered null as much
      as a demonstration of no effect.
  - reference: PMID:30926190
    reference_title: "The Efficacy of Antivenin Latrodectus (Black Widow) Equine Immune F(ab')(2) Versus Placebo in the Treatment of Latrodectism: A Randomized, Double-Blind, Placebo-Controlled, Clinical Trial."
    supports: SUPPORT

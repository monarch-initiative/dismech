animal_models:
- name: Lss-null mouse (IMPC Lss tm1b(KOMP)Wtsi homozygote)
  species: Mouse
  genotype: Lss tm1b(KOMP)Wtsi homozygous (complete loss of function)
  publication: PMID:30723320
  description: >-
    Homozygous Lss-null mice from the International Mouse Phenotyping Consortium
    show variable lethality, evidencing that complete loss of lanosterol
    synthase activity is not compatible with survival - consistent with the
    absence of biallelic complete-null genotypes among human APMR4 patients, who
    instead retain hypomorphic (usually missense) alleles.
  modeled_mechanisms:
  - target: Biallelic LSS Loss-of-Function
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Germline null models the complete-loss-of-function extreme of the LSS
      allelic series; its lethality delimits why viable human APMR4 requires
      residual enzyme activity.
    limitations: >-
      The homozygous null is variably embryonic-to-perinatal lethal, so it does
      not recapitulate the viable, hypomorphic human APMR4 phenotype (alopecia,
      intellectual disability); it models the lethality of total LOF rather than
      the disease itself.
    readouts:
    - name: Homozygous-null viability
      target: Biallelic LSS Loss-of-Function
      direction: DECREASED
      interpretation: Complete LSS loss is not survivable, bounding the tolerated end of the allelic series.
      evidence:
      - reference: PMID:30723320
        reference_title: "Biallelic pathogenic variants in the lanosterol synthase gene LSS involved in the cholesterol biosynthesis cause alopecia with intellectual disability, a rare recessive neuroectodermal syndrome."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "demonstrate variable lethality, from embryonic day 9.5 to postnatal prior to weaning"
        explanation: IMPC Lss-null homozygotes show variable lethality, the readout behind the viability claim.
    evidence:
    - reference: PMID:30723320
      reference_title: "Biallelic pathogenic variants in the lanosterol synthase gene LSS involved in the cholesterol biosynthesis cause alopecia with intellectual disability, a rare recessive neuroectodermal syndrome."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "demonstrate variable lethality, from embryonic day 9.5 to postnatal prior to weaning"
      explanation: Supports treating the Lss-null mouse as informative for the complete-LOF extreme of the trigger node.
discussions:
- discussion_id: apmr4_pathogenesis_gap
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Impaired Neurodevelopment
  prompt: >-
    How does partial loss of lanosterol synthase produce alopecia and
    neurodevelopmental impairment when circulating cholesterol and its precursors
    remain normal?
  rationale: >-
    Plasma sterol quantification is unremarkable in APMR4, so a simple systemic
    cholesterol-deficiency model does not account for the phenotype. Whether the
    mechanism is tissue-local cholesterol shortfall in high-demand compartments
    (brain, hair follicle), accumulation of an upstream substrate/oxysterol, or a
    non-catalytic role of LSS is unresolved, and the pathogenesis has been
    explicitly described as poorly understood.
  evidence:
  - reference: PMID:38800572
    reference_title: "Clinical and genetic analyses of APMR4 syndrome caused by novel biallelic LSS variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the pathogenesis of APMR4 is poorly understood"
    explanation: The molecular pathogenesis linking LSS deficiency to the phenotype is unresolved.
  - reference: PMID:30723320
    reference_title: "Biallelic pathogenic variants in the lanosterol synthase gene LSS involved in the cholesterol biosynthesis cause alopecia with intellectual disability, a rare recessive neuroectodermal syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Quantification of cholesterol and its precursors did not reveal noticeable imbalance."
    explanation: Normal systemic sterols argue against a simple systemic-deficiency mechanism.
  - reference: PMID:37157980
    reference_title: "Novel LSS variants in alopecia and intellectual disability syndrome: New case report and clinical spectrum of LSS-related rare disease traits."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "normal plasma cholesterol level was reported in several patients with LSS-related disorders supporting an alternative pathway for cholesterol synthesis"
    explanation: Normal plasma cholesterol despite the LSS block is proposed to reflect an alternative cholesterol-synthesis route - a central part of the open pathogenesis question.
notes: >
  APMR4 is one molecularly characterized member of the alopecia-intellectual
  disability syndrome (APMR) group (MONDO:0008756). NEC caution: the parent issue
  and dashboard hint attributed APMR1 to LSS and APMR3 to C3orf52; both are
  incorrect (a live Named Entity Confusion example). The verified attributions are
  APMR1 = AHSG (MONDO:0021035, OMIM 203650) and APMR4 = LSS (this entry,
  MONDO:0030009, OMIM 618840); C3orf52 causes a distinct non-syndromic autosomal
  recessive hypotrichosis with no intellectual disability and is unrelated to
  APMR. APMR2 (MONDO:0012487) and APMR3 (MONDO:0013492) remain locus-only,
  uncharacterized. Because APMR types are genetically distinct diseases, the group
  should be modeled as a kb/groupings/ Grouping over separate member Disease
  entries (per issue #8727) rather than a single umbrella Disease with
  has_subtypes; that grouping is deferred until at least a second member (e.g.
  AHSG/APMR1) is curated.

name: Alopecia-Intellectual Disability Syndrome 4
synonyms:
- APMR4
- Alopecia with mental retardation syndrome 4
- LSS-related alopecia-intellectual disability syndrome
- Alopecia-intellectual disability syndrome type 4
creation_date: '2026-08-17T12:00:00Z'
category: Mendelian
description: >
  Alopecia-intellectual disability syndrome 4 (APMR4; OMIM #618840) is a very rare
  autosomal recessive neuroectodermal syndrome caused by biallelic pathogenic
  variants in LSS (lanosterol synthase), which maps to chromosome 21q22.3. It is
  characterized by congenital alopecia/atrichia (absent scalp hair with sparse
  eyebrows and eyelashes) combined with variable-degree intellectual disability, frequently
  with developmental delay and early-onset epilepsy, and variable additional
  features (scaly skin/ichthyosis, microcephaly, thin corpus callosum, hypotonia,
  and genital abnormalities in males). LSS catalyzes the rate-limiting cyclization
  of (S)-2,3-oxidosqualene to lanosterol, the first sterol of the cholesterol
  biosynthesis pathway; how partial loss of this enzyme produces alopecia and
  neurodevelopmental impairment, while circulating cholesterol stays normal, is
  not fully established.

  This entry is one molecularly characterized member of the broader
  alopecia-intellectual disability syndrome (APMR) group (MONDO:0008756), a
  multi-gene family whose four types are genetically distinct: APMR1 is caused by
  AHSG, APMR4 (this entry) by LSS, and the APMR2 and APMR3 loci remain
  uncharacterized. Because these are separate diseases with different genes rather
  than a single-gene severity spectrum, the APMR group is best modeled as a
  kb/groupings/ Grouping over the individual member Disease entries once at least
  two members are curated, NOT as one umbrella Disease with has_subtypes. APMR4 is
  curated here as the flagship member (strongest, most recent gene-disease
  evidence); a grouping is deferred until a second member (e.g. AHSG/APMR1) exists.

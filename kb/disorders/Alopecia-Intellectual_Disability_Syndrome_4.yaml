      explanation: Skin expression of LSS underlies the cutaneous (ichthyosis) arm.
- name: Impaired Hair Follicle Development
  biological_scale: TISSUE
  description: >
    Disrupted local cholesterol supply impairs hair follicle development,
    producing the congenital alopecia/atrichia (absent scalp hair, eyebrows, and
    eyelashes) that is the cardinal cutaneous feature. LSS-related conditions
    also span an isolated autosomal recessive hypotrichosis, underscoring the
    follicle sensitivity to this enzyme.
  biological_processes:
  - preferred_term: hair follicle development
    term:
      id: GO:0001942
      label: hair follicle development
    modifier: DECREASED
  cell_types:
  - preferred_term: hair follicle cell
    term:
      id: CL:0002559
      label: hair follicle cell
  evidence:
  - reference: PMID:37157980
    reference_title: "Novel LSS variants in alopecia and intellectual disability syndrome: New case report and clinical spectrum of LSS-related rare disease traits."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic biallelic variants in LSS are associated with three Mendelian rare disease traits including congenital cataract type 44, autosomal recessive hypotrichosis type 14, and alopecia-intellectual disability syndrome type 4 (APMR4)."
    explanation: The LSS hair phenotypes (hypotrichosis and APMR4 alopecia) implicate follicle-level disruption.
  downstream:
  - target: Congenital Alopecia
    description: Impaired follicle development manifests as congenital absence of hair.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:38800572
      reference_title: "Clinical and genetic analyses of APMR4 syndrome caused by novel biallelic LSS variants."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It is characterized by congenital alopecia and variable degrees of intellectual disability (ID), frequently associated with developmental delay (DD) and epilepsy."
      explanation: Congenital alopecia is a defining manifestation.
- name: Impaired Neurodevelopment
  biological_scale: TISSUE
  description: >
    Reduced local cholesterol biosynthesis in the developing central nervous
    system is proposed to impair neurodevelopment, giving rise to variable
    intellectual disability and developmental delay and, in many patients,
    early-onset epilepsy. Brain MRI abnormalities (thin corpus callosum, mild
    cortical atrophy) accompany the clinical picture in some individuals. The
    precise molecular route from LSS deficiency to the neurological phenotype
    remains unresolved.
  biological_processes:
  - preferred_term: nervous system development
    term:
      id: GO:0007399
      label: nervous system development
    modifier: ABNORMAL
  evidence:
  - reference: PMID:38800572
    reference_title: "Clinical and genetic analyses of APMR4 syndrome caused by novel biallelic LSS variants."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We studied one patient with LSS-related APMR4 who presented with severe intellectual disability, alopecia, early-onset epilepsy and developmental delay."
    explanation: Documents the neurodevelopmental features of APMR4.
  downstream:
  - target: Intellectual Disability
    description: Impaired neurodevelopment produces variable-degree intellectual disability.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:36251212
      reference_title: "Expanding the Phenotypic Spectrum of APMR4 Syndrome Caused by a Novel Variant in LSS Gene and Review of Literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "alopecia intellectual disability syndromes 4 (APMR4) (OMIM# 618,840) has a wider degree of affection when describing ID ranging from mild to severe"
      explanation: APMR4 ID severity ranges from mild to severe.
  - target: Early-Onset Epilepsy
    description: A subset of patients develop early-onset seizures.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:30723320
      reference_title: "Biallelic pathogenic variants in the lanosterol synthase gene LSS involved in the cholesterol biosynthesis cause alopecia with intellectual disability, a rare recessive neuroectodermal syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "frequently associated with early-onset epilepsy and other dermatological features"

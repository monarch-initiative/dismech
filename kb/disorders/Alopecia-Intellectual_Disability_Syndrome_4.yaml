    Disrupted local cholesterol supply impairs hair follicle development,
    producing the congenital alopecia/atrichia (absent scalp hair, eyebrows, and
    eyelashes) that is the cardinal cutaneous feature. LSS-related conditions
    also span an isolated autosomal recessive hypotrichosis, underscoring the
    follicle sensitivity to this enzyme.

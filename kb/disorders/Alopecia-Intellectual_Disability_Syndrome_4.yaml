genetic:
- name: LSS Pathogenic Variants
  gene_term:
    preferred_term: LSS
    term:
      id: hgnc:6708
      label: LSS
  association: CAUSAL
  notes: >
    Biallelic pathogenic LSS variants (chromosome 21q22.3) cause APMR4. Reported
    alleles span missense, splice-site, nonsense, and frameshift changes
    distributed across the gene; most affected individuals carry at least one
    hypomorphic missense allele, and no patient has been reported with two alleles
    predicting complete loss of protein, consistent with presumed lethality of
    total enzyme absence. LSS is also associated with two other autosomal
    recessive traits — congenital cataract type 44 and hypotrichosis simplex type
    14 — with an emerging genotype-phenotype correlation across LSS-related
    disease.
  evidence:
  - reference: PMID:30723320
    reference_title: "Biallelic pathogenic variants in the lanosterol synthase gene LSS involved in the cholesterol biosynthesis cause alopecia with intellectual disability, a rare recessive neuroectodermal syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We reported ten APMR individuals from six unrelated families with biallelic variants in LSS."
    explanation: Establishes biallelic LSS variants as causal across multiple families.
  - reference: PMID:37157980
    reference_title: "Novel LSS variants in alopecia and intellectual disability syndrome: New case report and clinical spectrum of LSS-related rare disease traits."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Pathogenic biallelic variants in LSS are associated with three Mendelian rare disease traits including congenital cataract type 44, autosomal recessive hypotrichosis type 14, and alopecia-intellectual disability syndrome type 4 (APMR4)."
    explanation: Places APMR4 within the LSS-related allelic disease spectrum.
  - reference: PMID:37157980
    reference_title: "Novel LSS variants in alopecia and intellectual disability syndrome: New case report and clinical spectrum of LSS-related rare disease traits."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "cases with a more severe phenotype were more likely to have a biallelic combination of a LoF allele plus a missense"
    explanation: Emerging genotype-phenotype correlation - a loss-of-function allele in trans with a missense allele trends toward a more severe phenotype.

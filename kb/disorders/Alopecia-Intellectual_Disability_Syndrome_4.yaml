pathophysiology:
- name: Biallelic LSS Loss-of-Function
  role: trigger
  biological_scale: MOLECULAR
  description: >
    Biallelic pathogenic LSS variants (missense, splicing, nonsense, and
    frameshift alleles) reduce lanosterol synthase activity. Most affected
    individuals carry at least one hypomorphic missense allele; complete loss of
    enzyme activity is presumed incompatible with life, consistent with the
    variable (embryonic-to-perinatal) lethality of homozygous Lss-null mice
    (see animal_models). A truncating LSS allele was shown to reduce LSS protein
    expression in patient cells.
  gene:
    preferred_term: LSS
    term:
      id: hgnc:6708
      label: LSS
  molecular_functions:
  - preferred_term: lanosterol synthase activity
    term:
      id: GO:0000250
      label: lanosterol synthase activity
    modifier: DECREASED
  evidence:
  - reference: PMID:30723320
    reference_title: "Biallelic pathogenic variants in the lanosterol synthase gene LSS involved in the cholesterol biosynthesis cause alopecia with intellectual disability, a rare recessive neuroectodermal syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our data suggest LSS as a major gene causing a rare recessive neuroectodermal syndrome."
    explanation: Establishes LSS as the causal gene for APMR4.
  - reference: PMID:38800572
    reference_title: "Clinical and genetic analyses of APMR4 syndrome caused by novel biallelic LSS variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Analysis via WB experiment indicated that c.369 > G reduced the protein expression level of LSS."
    explanation: A truncating LSS allele reduces LSS protein, supporting loss-of-function.
  downstream:
  - target: Impaired Cholesterol Biosynthesis
    description: >-
      Reduced lanosterol synthase activity impairs the cyclization step that
      commits the sterol pathway to cholesterol.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30723320
      reference_title: "Biallelic pathogenic variants in the lanosterol synthase gene LSS involved in the cholesterol biosynthesis cause alopecia with intellectual disability, a rare recessive neuroectodermal syndrome."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "In the cholesterol biosynthesis pathway, lanosterol synthase leads to the cyclization of (S)-2,3-oxidosqualene into lanosterol."
      explanation: Places LSS at the committed cyclization step of cholesterol biosynthesis.
- name: Impaired Cholesterol Biosynthesis
  biological_scale: MOLECULAR
  description: >
    Lanosterol synthase catalyzes the rate-limiting conversion of
    (S)-2,3-oxidosqualene to lanosterol, the first sterol of the pathway. Reduced
    activity is expected to lower local cholesterol synthesis, particularly in
    tissues with high demand such as brain and skin. Circulating cholesterol and
    its precursors are typically normal in APMR4, indicating that the defect is
    tissue-local rather than a systemic hypocholesterolemia.
  biological_processes:
  - preferred_term: cholesterol biosynthetic process
    term:
      id: GO:0006695
      label: cholesterol biosynthetic process
    modifier: DECREASED
  evidence:
  - reference: PMID:37157980
    reference_title: "Novel LSS variants in alopecia and intellectual disability syndrome: New case report and clinical spectrum of LSS-related rare disease traits."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "It catalyzes the rate-limiting step in the conversion of (S)-2,3-oxidosqualene into lanosterol."
    explanation: Establishes LSS as the rate-limiting enzyme of the affected step.
  - reference: PMID:37157980
    reference_title: "Novel LSS variants in alopecia and intellectual disability syndrome: New case report and clinical spectrum of LSS-related rare disease traits."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LSS is expressed in many tissues, including the brain, glomerular podocytes, and skin, potentially explaining multi-system involvement and pleiotropic phenotypic manifestations."
    explanation: Tissue expression rationalizes the skin and CNS involvement.
  - reference: PMID:30723320
    reference_title: "Biallelic pathogenic variants in the lanosterol synthase gene LSS involved in the cholesterol biosynthesis cause alopecia with intellectual disability, a rare recessive neuroectodermal syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Quantification of cholesterol and its precursors did not reveal noticeable imbalance."
    explanation: Systemic sterols are normal, supporting a tissue-local rather than systemic defect.
  downstream:
  - target: Impaired Hair Follicle Development
    description: >-
      Cholesterol homeostasis is important for the hair-growth program; its local
      disruption impairs hair follicle development.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:36251212
      reference_title: "Expanding the Phenotypic Spectrum of APMR4 Syndrome Caused by a Novel Variant in LSS Gene and Review of Literature."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It encodes lanosterol synthase enzyme which converts (S)-2,3-oxidosqualene to lanosterol in the cholesterol biosynthesis pathway which has the key role of the metabolic pathway in the homeostasis of hair growth."
      explanation: Links the cholesterol pathway to hair-growth homeostasis.
  - target: Impaired Neurodevelopment
    description: >-
      The developing brain has a high cholesterol requirement; reduced local
      synthesis is proposed to impair neurodevelopment.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37157980
      reference_title: "Novel LSS variants in alopecia and intellectual disability syndrome: New case report and clinical spectrum of LSS-related rare disease traits."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "LSS is expressed in many tissues, including the brain, glomerular podocytes, and skin, potentially explaining multi-system involvement and pleiotropic phenotypic manifestations."
      explanation: Brain expression of LSS underlies the neurodevelopmental arm.
  - target: Micropenis
    description: >-
      Cholesterol biosynthesis is required for normal male genital development
      in early fetal life; the LSS defect is proposed to underlie the genital
      anomalies seen in affected males.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37157980
      reference_title: "Novel LSS variants in alopecia and intellectual disability syndrome: New case report and clinical spectrum of LSS-related rare disease traits."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It is proposed to result from the impairment in the cholesterol biosynthesis pathway due to defective LSS which is essential for the development of normal genitalia in early fetal life."
      explanation: Links the cholesterol-biosynthesis defect to the male genital phenotype.
  - target: Cryptorchidism
    description: >-
      The same fetal cholesterol-biosynthesis requirement for normal genital
      development is proposed to underlie cryptorchidism in affected males.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37157980
      reference_title: "Novel LSS variants in alopecia and intellectual disability syndrome: New case report and clinical spectrum of LSS-related rare disease traits."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "It is proposed to result from the impairment in the cholesterol biosynthesis pathway due to defective LSS which is essential for the development of normal genitalia in early fetal life."
      explanation: Links the cholesterol-biosynthesis defect to the male genital phenotype.
  - target: Ichthyosis
    description: >-
      LSS is expressed in skin; locally reduced cholesterol biosynthesis is
      proposed to underlie the scaly-skin/ichthyosis dermatological phenotype.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:37157980

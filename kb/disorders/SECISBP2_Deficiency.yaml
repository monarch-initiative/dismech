- name: Abnormal T cell physiology
  category: Cellular
  description: >-
    Reduced selenoprotein levels in peripheral blood cells impair T lymphocyte
    proliferation and alter mononuclear cell cytokine secretion, indicating an
    immune component of the multisystem selenoprotein deficiency.
  phenotype_term:
    preferred_term: Impaired T lymphocyte proliferation
    term:

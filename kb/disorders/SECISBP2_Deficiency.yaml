    evidence_source: HUMAN_CLINICAL
    snippet: >-
      An axial muscular dystrophy was also present, with features similar to
      myopathies caused by mutations in selenoprotein N (SEPN1).
    explanation: >-
      Supports axial muscular dystrophy phenocopying SELENON/SEPN1-related
      myopathy in SECISBP2 deficiency.

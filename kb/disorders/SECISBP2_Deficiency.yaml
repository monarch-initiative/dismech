      associated with impaired T lymphocyte proliferation, abnormal mononuclear
      cell cytokine secretion, and telomere shortening.
    explanation: >-
      Supports impaired T lymphocyte proliferation and altered cytokine
      secretion in SECISBP2 deficiency.

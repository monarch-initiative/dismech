    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we describe subjects with compound heterozygous defects in the
      SECISBP2 gene.
    explanation: >-
      Compound heterozygosity in affected subjects supports recessive
      inheritance.

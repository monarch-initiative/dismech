- name: Azoospermia
  description: >-
    Loss of testis-enriched selenoproteins in SECISBP2 deficiency causes
    azoospermia from failure of the later stages of spermatogenesis, a
    recognized cause of male infertility in affected men.
  phenotype_term:
    preferred_term: Azoospermia
    term:

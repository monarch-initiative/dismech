      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Testicular GCTs (TGCTs) are the most common cancers in 15- to 39-year-old
        men, and ovarian GCTs (OvGCTs) are the leading gynecologic malignancies
        in women younger than 25 years.
      explanation: >-
        Establishes gonadal germ cell tumors (including mixed germ cell tumors)
        as solid malignancies managed within medical and surgical oncology.

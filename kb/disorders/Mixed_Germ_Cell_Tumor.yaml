- name: Lactate Dehydrogenase (LDH)
  biomarker_term:
    preferred_term: Lactate Dehydrogenase
    term:
      id: NCIT:C25184
      label: Lactate Dehydrogenase
  presence: Elevated proportional to tumor burden
  notes: Non-specific; incorporated into AJCC S-category staging and IGCCCG risk group assignment
  readouts:
  - target: Invasive Growth and Metastasis
    relationship: CORRELATES_WITH
    direction: POSITIVE
    endpoint_context: PROGNOSTIC
    interpretation: >-
      Serum LDH reflects overall invasive and metastatic germ cell tumor burden.
  evidence:
  - reference: PMID:40723290
    reference_title: "Is Human Chorionic Gonadotropin a Reliable Marker for Testicular Germ Cell Tumor? New Perspectives for a More Accurate Diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The initial phase of TGCT diagnosis is performed by detecting in the blood
      the presence of three proteins, i.e., alpha-fetoprotein (AFP), lactate
      dehydrogenase (LDH), and human chorionic gonadotropin (hCG).
    explanation: >-
      Establishes serum LDH alongside AFP and hCG in the standard diagnostic
      serum biomarker panel for germ cell tumors.
- name: microRNA-371a-3p (miR-371a-3p)
  biomarker_term:
    preferred_term: MicroRNA 371a-3p
    term:
      id: NCIT:C177289
      label: MicroRNA 371a-3p
  presence: Elevated in serum of patients with viable non-teratomatous germ cell tumor
  notes: >-
    Blood-based circulating miRNA biomarker outperforming conventional serum
    tumor markers for viable non-teratomatous germ cell tumors (100% sensitivity
    and 96.3% specificity for relapse detection in prospective stage I
    testicular GCT surveillance); does not detect mature teratoma.
  readouts:
  - target: Invasive Growth and Metastasis
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: MONITORING
    interpretation: >-
      Circulating miR-371a-3p tracks viable non-teratomatous germ cell tumor
      burden and early recurrence.
  evidence:
  - reference: PMID:38611057
    reference_title: "Advancing GCT Management: A Review of miR-371a-3p and Other miRNAs in Comparison to Traditional Serum Tumor Markers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Circulating levels of germ cell tumor (GCT)-associated miRNAs, such as
      miR-371a-3p, can be utilized as efficient and cost-effective alternatives
      in diagnosing and managing patients presenting with GCTs.
    explanation: >-
      Supports circulating miR-371a-3p as a high-accuracy blood-based biomarker
      for non-teratomatous germ cell tumors.
  - reference: PMID:37967143
    reference_title: "Detection of Recurrence through microRNA-371a-3p Serum Levels in a Follow-up of Stage I Testicular Germ Cell Tumors in the DRKS-00019223 Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      area under the ROC curve of 0.993, sensitivity 100%, specificity 96.3%,
      positive predictive value 83%, negative predictive value 100%
    explanation: >-
      Quantifies prospective multicenter sensitivity and specificity of serum
      miR-371a-3p for detecting germ cell tumor recurrence.
genetic:
- name: Isochromosome 12p [i(12p)]
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  association: Present in the large majority of invasive post-pubertal-type germ cell tumors
  features: >-
    Hallmark cytogenetic abnormality marking progression from GCNIS to invasive
    tumor; 12p amplicon harbors KRAS and pluripotency/germ-cell genes; FISH for
    i(12p) distinguishes post-pubertal from pre-pubertal type tumors
  evidence:
  - reference: PMID:32205480
    reference_title: "Report From the International Society of Urological Pathology (ISUP) Consultation Conference on Molecular Pathology of Urogenital Cancers: IV: Current and Future Utilization of Molecular-Genetic Tests for Testicular Germ Cell Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Detection of gain of the short arm of chromosome 12 is diagnostic to
      differentiate between non-GCNIS versus GCNIS related GCTs and supportive
      to the germ cell origin of both primary and metastatic tumors.
    explanation: >-
      ISUP consensus establishing chromosome 12p gain as the diagnostic somatic
      cytogenetic hallmark of GCNIS-related germ cell tumors.
  - reference: PMID:41384700
    reference_title: "Molecular pathology of testicular germ cell tumours: an update for practicing pathologists."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A common molecular alteration in type II TGCTs is the presence of an
      isochromosome 12p or gain of 12p material. It is thought that the
      isochromosome 12p develops during the progression of a GCNIS to an
      invasive TGCT.
    explanation: >-
      Confirms isochromosome 12p acquisition during progression from GCNIS to
      invasive post-pubertal-type germ cell tumor.
- name: KIT
  gene_term:
    preferred_term: KIT
    term:
      id: hgnc:6342
      label: KIT
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  association: Activating mutations in ~18-25% of cases, chiefly seminomatous components

      A mixed germ cell tumor is by definition a combination of two or more
      malignant germ cell components, and NCIT:C4290 (Mixed Germ Cell Tumor)
      descends from NCIT:C3708 (Germ Cell Tumor), the term bound to this enum
      value.
    evidence:
    - reference: ORPHA:180234
      reference_title: "Mixed germ cell tumor"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        A rare germ cell tumor characterized by composition of two or more
        malignant germ cell components, the most common combination being
        dysgerminoma and yolk sac tumor.
      explanation: >-
        Confirms mixed germ cell tumor is defined by composition of two or more
        malignant germ cell components within the germ cell tumor family.

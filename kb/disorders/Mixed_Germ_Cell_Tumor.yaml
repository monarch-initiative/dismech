datasets:
- accession: geo:GSE70783
  title: Genome-wide methylation profiles in primary intracranial germ cell tumors indicate primordial germ cell origin of germinoma [Illumina]
  description: The pathogenesis of intracranial germ cell tumors (iGCTs) is not yet fully uncovered despite exhaustive genomic analyses. By means of a genome-wide methylation analysis, we show that pure germinoma is characterized by global DNA low methylation, a unique epigenetic feature distinct from all other subtypes of iGCTs. The patterns of methylation strongly resemble that of primordial germ cells (PGC) at the migration phase, indicating the cells of origin. Unlike PGC, however, hypomethylation extends to LINE1 retrotransposon.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  data_type: METHYLATION
  sample_count: 77
  publication: PMID:28078450
  notes: Identified by GEO DataSets index search for Mixed Germ Cell Tumor (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-07-31. Title, sample count, and organism are GEO's own values.
- accession: geo:GSE260949
  title: Analysis of a mouse germ cell tumor model establishes pluripotency-associated miRNAs as conserved serum biomarkers for germ cell cancer detection
  description: Malignant testicular germ cells tumors (TGCTs) are the most common solid cancers in young men. Current TGCT diagnostics include conventional serum protein markers, but these lack the sensitivity and specificity to serve as accurate markers across all TGCT subtypes. MicroRNAs (miRNAs) are small non-coding regulatory RNAs and informative biomarkers for several diseases. In humans, miRNAs of the miR-371-373 cluster are detectable in the serum of patients with malignant TGCTs and outperform existing serum protein markers for both initial diagnosis and subsequent disease monitoring.
  organism:
    preferred_term: mouse
    term:
      id: NCBITaxon:10090
      label: Mus musculus
  data_type: BULK_RNA_SEQ
  sample_count: 6
  publication: PMID:39910147
  notes: Identified by GEO DataSets index search for Mixed Germ Cell Tumor (scripts/discover_datasets.py); accession and metadata verified against NCBI E-utilities on 2026-07-31. Title, sample count, and organism are GEO's own values.

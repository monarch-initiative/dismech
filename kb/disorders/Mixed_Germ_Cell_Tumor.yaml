- name: Cisplatin Hypersensitivity and Platinum Resistance
  biological_scale: CELLULAR
  conforms_to: "resisting_cell_death#Impaired Apoptotic Execution and Cell Survival"
  description: >-
    Germ cell tumors are exquisitely sensitive to cisplatin-based chemotherapy
    because of a hypersensitive p53-mediated apoptotic response and limited
    DNA-damage repair capacity, allowing cure even in widely metastatic disease.
    Approximately 15% of patients nonetheless develop platinum-refractory
    disease through mechanisms including TP53 mutation or MDM2 amplification,
    increased DNA methylation/epigenetic reprogramming, enhanced DNA repair, and
    anti-apoptotic signaling, which is the principal cause of germ cell tumor
    mortality.
  cell_types:

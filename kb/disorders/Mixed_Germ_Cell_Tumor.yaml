    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite high aneuploidy and a paucity of somatic mutations, several
      genomic and transcriptomic assays have identified a few significantly
      mutated somatic genes, primarily KIT and K-RAS.
    explanation: >-
      Identifies KIT as one of the two principal recurrent somatic drivers in
      germ cell tumors.
- name: KRAS
  gene_term:
    preferred_term: KRAS
    term:
      id: hgnc:6407
      label: KRAS
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  association: Copy-number gain in the majority of tumors; activating mutations in ~26% of cases
  features: Codon 12 most frequently affected; amplified via i(12p)
  evidence:
  - reference: PMID:38541652
    reference_title: "RAS/Mitogen-Activated Protein Kinase Signaling Pathway in Testicular Germ Cell Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Despite high aneuploidy and a paucity of somatic mutations, several
      genomic and transcriptomic assays have identified a few significantly
      mutated somatic genes, primarily KIT and K-RAS.
    explanation: >-
      Identifies K-RAS as one of the two principal recurrent somatic drivers in
      germ cell tumors.
- name: TP53
  gene_term:
    preferred_term: TP53
    term:
      id: hgnc:11998
      label: TP53
  relationship_type: MODIFIER
  variant_origin: SOMATIC
  association: Wild-type in most germ cell tumors; somatic mutations enriched in cisplatin-resistant or somatic-type malignant disease
  features: >-
    Wild-type p53 underlies the strong cisplatin-induced apoptotic response;
    somatic TP53 mutation or MDM2 amplification is associated with platinum
    resistance
  evidence:
  - reference: PMID:37891379
    reference_title: "Strong apoptotic response of testis tumor cells following cisplatin treatment."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Immunoblotting experiments revealed p53 to be induced in TTC, but not
      bladder cancer cells following cisplatin
    explanation: >-
      Demonstrates functional p53 induction following cisplatin treatment in
      testis tumor cells, underlying cisplatin sensitivity when TP53 is
      wild-type.
  - reference: PMID:41384700
    reference_title: "Molecular pathology of testicular germ cell tumours: an update for practicing pathologists."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Alterations associated with the formation of a somatic-type malignancy
      and/or the development of cisplatin resistance include TP53 mutations or
      MDM2 gene amplifications as well as epigenetic alterations.
    explanation: >-
      Confirms somatic TP53 mutations as a genetic modifier conferring cisplatin
      resistance and somatic-type malignant transformation in germ cell tumors.
environmental:
- name: Cryptorchidism
  influences_mechanisms:
  - target: Primordial Germ Cell Maldifferentiation and GCNIS
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Pointed at the germ-cell maldifferentiation node because the testicular
      dysgenesis model treats undescended testis and testicular germ cell tumor
      as shared consequences of a disturbed fetal gonadal programme.
    evidence:
    - reference: PMID:34301922
      reference_title: "Identification of 22 susceptibility loci associated with testicular germ cell tumors."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Among men with independent TGCT risk factors such as cryptorchidism"
      explanation: >-
        Names cryptorchidism among established independent risk factors for
        testicular germ cell tumor.
  description: >-
    Undescended testis is the strongest established developmental risk factor
    for testicular germ cell tumor.
  effect: Strong risk factor (approximately 4-fold increased risk)
  evidence:
  - reference: PMID:23423470
    reference_title: "Cryptorchidism and testicular germ cell tumors: comprehensive meta-analysis reveals that association between these conditions diminished over time and is modified by clinical characteristics."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      history of CO is associated with four-fold increased TGCT risk [RR =
      4.1(95% CI = 3.6-4.7)]
    explanation: >-
      Meta-analysis quantifying a 4.1-fold increased risk of testicular germ
      cell tumor associated with cryptorchidism.
  - reference: PMID:34301922
    reference_title: "Identification of 22 susceptibility loci associated with testicular germ cell tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among men \nwith independent TGCT risk factors such as cryptorchidism"
    explanation: >-
      Identifies cryptorchidism as an established independent risk factor for
      TGCT.
- name: Family History / Heritable Susceptibility
  description: >-
    First-degree relatives of affected men have a markedly increased risk, and
    TGCT has among the highest heritability of any malignancy, with 78
    susceptibility loci identified that account for 44% of heritability.
  effect: Strong genetic susceptibility; informs screening and counseling
  evidence:
  - reference: PMID:34301922
    reference_title: "Identification of 22 susceptibility loci associated with testicular germ cell tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This meta-analysis identifies 22 TGCT \nsusceptibility loci, bringing the total to 78, which account for 44% of disease \nheritability."
    explanation: >-
      Quantifies the heritable susceptibility architecture of testicular germ
      cell tumor.
  review_notes: >-
    Deliberately left unlinked to a pathophysiology node (issue #8085). The
    cited meta-analysis reports 78 germline susceptibility loci accounting for
    44% of heritability, which is a genetic finding rather than an exposure.
    This entry's genetic section records somatic drivers, i(12p), KIT, KRAS
    and TP53, so inherited susceptibility is represented neither there nor by
    any node here for it to act on. Not a rule against linking a host state or
    a demographic: the knowledge base does that elsewhere, including
    Osteoarthritis, where Age points at a Chondrocyte Senescence node on a
    prevalence-gradient citation.
- name: Endocrine-Disrupting Chemicals
  exposure_term:
    preferred_term: endocrine-disrupting chemicals
    term:
      id: ECTO:9001630
      label: exposure to endocrine disruptor
  description: >-
    Prenatal exposure to endocrine-disrupting chemicals is hypothesised to raise
    testicular germ cell tumor risk under the testicular dysgenesis syndrome
    model, but the evidence separates sharply by agent and should not be stated
    as one claim. For diethylstilbestrol, a meta-analysis of six studies
    estimates roughly a threefold increase in risk after in utero exposure. For
    organochlorine pesticides and polychlorinated biphenyls, the strongest
    available design, a nested case-control study measuring these chemicals
    directly in maternal serum biobanked during pregnancy, found no
    association.
  effect: Putative environmental risk factor
  evidence:
  - reference: PMID:31555759
    reference_title: Systematic Review and Meta-analysis of Testicular Germ Cell Tumors Following In Utero Exposure to Diethylstilbestrol.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "By meta-analysis of data from the six qualifying studies, the summary odds ratio estimate of the in utero DES-testicular cancer association was 2.98 (95% confidence interval = 1.15 to 7.67)."
    explanation: >-
      Supports the diethylstilbestrol half of this exposure with a pooled
      odds ratio of about three. Because DES use ceased in 1971, the authors
      note this is likely the most complete estimate that will ever be made.
  - reference: PMID:40056550
    reference_title: Prenatal exposure to organochlorine pesticides and polychlorinated biphenyls and risk of testicular germ cell cancer later in life.
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    snippet: "Prenatal exposure to OCPs and PCBs, quantified by concentrations in maternal pregnancy serum, was not associated with later risk of TGCC."
    explanation: >-
      Refutes the organochlorine and PCB half as previously stated. A nested
      case-control study measured seven organochlorine pesticides and thirteen
      PCB congeners directly in maternal pregnancy serum, rather than relying on
      recall or occupational proxies, and found no association. Recorded rather
      than dropped, so the stronger claim is not reintroduced.
  influences_mechanisms:
  - target: Primordial Germ Cell Maldifferentiation and GCNIS
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Pointed at the germ-cell maldifferentiation node for the same reason as
      cryptorchidism: the testicular dysgenesis model holds that an endocrine
      disturbance of the fetal gonadal programme is what these exposures act
      on. The intermediates are unknown, and the edge is agent-specific rather
      than class-wide: the diethylstilbestrol evidence is what carries it,
      while the strongest prenatal measurement of organochlorine pesticides and
      PCBs found no association with later tumour risk.
    evidence:
    - reference: PMID:18445826
      reference_title: Persistent organochlorine pesticides and risk of testicular germ cell tumors.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "Because evidence suggests that TGCT is initiated in very early life"
      explanation: >-
        The premise that makes this edge point at the fetal germ-cell node
        rather than at a later step. Indirect because it is the authors'
        framing of prior evidence, not a result of this study.
treatments:
- name: Radical Inguinal Orchiectomy
  description: >-
    Radical inguinal orchiectomy is the primary diagnostic and therapeutic
    procedure for a suspected testicular germ cell tumor, providing tissue for
    histologic diagnosis and pathologic staging and curing ~75% of stage I
    non-seminomatous tumors alone.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: radical orchiectomy
    term:
      id: NCIT:C15288
      label: Orchiectomy
  target_mechanisms:
  - target: Invasive Growth and Metastasis
    treatment_effect: INHIBITS
    description: >-
      Surgical resection removes the primary testicular mixed germ cell tumor
      before further local or systemic dissemination.
  evidence:
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Radical inguinal orchiectomy is mandatory to provide local tumor control
      and to establish the histopathologic subtypes, presence of in situ
      neoplasia, vascular lymphatic or rete testis invasion and spread beyond
      the tunica albuginea
    explanation: >-
      Clinical practice guideline confirming radical inguinal orchiectomy for
      local tumor control and histopathologic classification.
- name: Fertility-Sparing Surgery
  description: >-
    For ovarian mixed germ cell tumors in young patients, fertility-sparing
    surgery (unilateral salpingo-oophorectomy with preservation of the
    contralateral ovary and uterus) is prioritized, followed by platinum-based
    chemotherapy when non-dysgerminomatous malignant components are present.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: fertility-sparing surgery
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Invasive Growth and Metastasis
    treatment_effect: INHIBITS
    description: >-
      Unilateral adnexectomy resects the primary ovarian mixed germ cell tumor
      while preserving contralateral reproductive anatomy.
  evidence:
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Fertility-sparing surgery is the cornerstone of treatment for stage I
      disease, often followed by close surveillance to minimize the long-term
      toxicities of chemotherapy.
    explanation: >-
      Establishes fertility-sparing surgery as the cornerstone surgical approach
      for malignant ovarian germ cell tumors in young women.
  - reference: PMID:40037273
    reference_title: "Acute abdominopelvic pain and distension in a 21-year-old woman revealing a mixed germ cell tumor: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The treatment consisted of unilateral adnexectomy followed by
      platinum-based chemotherapy.
    explanation: >-
      Illustrates fertility-preserving unilateral adnexectomy combined with
      platinum-based chemotherapy in ovarian mixed germ cell tumor.
- name: BEP Chemotherapy
  description: >-
    Bleomycin, etoposide, and cisplatin (BEP) is the standard first-line
    chemotherapy for metastatic germ cell tumor; germ cell tumors are
    exquisitely sensitive to cisplatin-based chemotherapy, achieving cure even
    in widely metastatic disease. Three cycles for good-risk and four cycles for
    intermediate/poor-risk disease.
  therapeutic_modality: SMALL_MOLECULE
  regimen_term:
    preferred_term: BEP Regimen
    term:
      id: NCIT:C63488
      label: BEP Regimen
  treatment_term:
    preferred_term: BEP chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: bleomycin
      term:
        id: CHEBI:22907
        label: bleomycin
    - preferred_term: etoposide
      term:
        id: CHEBI:4911
        label: etoposide
    - preferred_term: cisplatin
      term:
        id: CHEBI:27899
        label: cisplatin
  target_mechanisms:
  - target: Cisplatin Hypersensitivity and Platinum Resistance
    treatment_effect: ACTIVATES
    description: >-
      BEP exploits the hypersensitive apoptotic response and limited DNA-repair
      capacity of germ cell tumor cells; platinum resistance is the principal
      cause of treatment failure.
  evidence:
  - reference: PMID:37820296
    reference_title: "Adolescent and Young Adult Germ Cell Tumors: Epidemiology, Genomics, Treatment, and Survivorship."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Excellent \noutcomes, even in widely metastatic disease using cisplatin-based chemotherapy, \ncan be achieved since Einhorn and Donohue's landmark 1977 study in TGCT."
    explanation: >-
      Confirms the high cure rate of cisplatin-based chemotherapy in metastatic
      germ cell tumor.
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients with ... poor-risk IGCCCG should be treated with
      four cycles of BEP, whereas patients with good-risk IGCCCG can be safely
      treated with three cycles of BEP
    explanation: >-
      Establishes risk-stratified three- versus four-cycle BEP chemotherapy as
      the standard of care across IGCCCG groups.
- name: VIP / EP / TIP Chemotherapy
  description: >-
    Alternative cisplatin-based regimens: EP (etoposide, cisplatin) and VIP
    (etoposide, ifosfamide, cisplatin) when bleomycin is contraindicated (such
    as planned mediastinal/thoracic surgery), and TIP (paclitaxel, ifosfamide,
    cisplatin) or high-dose chemotherapy as salvage therapy for relapsed
    disease.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: salvage chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: cisplatin
      term:
        id: CHEBI:27899
        label: cisplatin
    - preferred_term: etoposide
      term:
        id: CHEBI:4911
        label: etoposide
    - preferred_term: ifosfamide
      term:
        id: CHEBI:5864
        label: ifosfamide
    - preferred_term: paclitaxel
      term:
        id: CHEBI:45863
        label: paclitaxel
  target_mechanisms:
  - target: Cisplatin Hypersensitivity and Platinum Resistance
    treatment_effect: ACTIVATES
    description: >-
      Cisplatin-containing alternative first-line (EP, VIP) and salvage (TIP)
      regimens induce DNA-damage-mediated apoptosis in viable germ cell tumor
      cells.
  evidence:
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      BEP is the most recommended chemotherapy, but other schedules such as EP
      or VIP may be used to avoid bleomycin in some patients.
    explanation: >-
      Supports EP and VIP as bleomycin-sparing cisplatin regimens.
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Salvage treatment for these patients includes conventional-dose
      chemotherapy (TIP) and/or high-dose chemotherapy, although the best
      regimen and strategy for each subgroup of patients is not yet well
      established.
    explanation: >-
      Supports TIP and high-dose chemotherapy as salvage treatment for relapsed
      or refractory germ cell tumors.
- name: Post-Chemotherapy Residual Tumor Resection
  description: >-
    Resection of residual masses after chemotherapy (such as retroperitoneal
    lymph node dissection for residual nodes >=1 cm or mediastinal residual mass
    resection) is crucial for non-seminomatous / mixed germ cell tumors because
    residual masses frequently harbor chemoresistant teratoma (~35%) or viable
    malignant germ cell tumor (~15%).
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: residual tumor resection
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Invasive Growth and Metastasis
    treatment_effect: INHIBITS
    description: >-
      Surgical excision removes residual chemoresistant teratoma and viable
      malignant germ cell tumor foci after systemic chemotherapy.
  evidence:
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In patients with NSGCT and post-chemotherapy negative tumor markers,
      FDG-PET CT is not recommended, and all residual retroperitoneal lymph
      nodes ≥1 cm or residual masses in other locations should be resected if
      technically feasible
    explanation: >-
      Guideline recommendation establishing post-chemotherapy surgical resection
      of residual masses in non-seminomatous (including mixed) germ cell tumors.
  - reference: PMID:35554637
    reference_title: "How to classify, diagnose, treat and follow-up extragonadal germ cell tumors? A systematic review of available evidence."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In general patients with non-seminomatous EGCT, residual tumor resection
      (RTR) should be performed after chemotherapy.
    explanation: >-
      Confirms mandatory post-chemotherapy residual tumor resection in
      extragonadal non-seminomatous germ cell tumors.
- name: Sperm Banking / Fertility Preservation
  description: >-
    Fertility counseling and sperm cryopreservation before initiating
    orchiectomy or gonadotoxic cisplatin-based chemotherapy are routinely
    recommended for fertility preservation.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: sperm banking
    term:
      id: NCIT:C15326
      label: Sperm Banking
  evidence:
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Information and counselling on fertility issues and sperm
      cryopreservation should be offered routinely prior to the ... of
      any form of treatment, ideally prior to orchiectomy.
    explanation: >-
      Clinical practice guideline recommending routine fertility counseling and
      sperm cryopreservation prior to germ cell tumor treatment.

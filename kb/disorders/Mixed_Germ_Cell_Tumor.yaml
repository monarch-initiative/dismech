has_subtypes:
- name: Embryonal Carcinoma Component
  subtype_term:
    preferred_term: embryonal carcinoma
    term:
      id: MONDO:0005440
      label: embryonal carcinoma
  description: >-
    Embryonal carcinoma (EC) is the most common and most pluripotent component
    of post-pubertal mixed germ cell tumors. EC cells express OCT3/4, SOX2, and
    CD30, are highly proliferative, and predominance of EC predicts
    lymphovascular invasion and relapse.
  evidence:
  - reference: PMID:19396148
    reference_title: "Testicular mixed germ cell tumors: a morphological and immunohistochemical study using stem cell markers, OCT3/4, SOX2 and GDF3, with emphasis on morphologically difficult-to-classify areas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The different components identified in these tumors were seminoma (8),
      embryonal carcinoma (50), yolk sac tumor (40), teratoma (40),
      choriocarcinoma (3) and intra-tubular germ cell neoplasia, unclassified (35).
    explanation: >-
      In a 50-case series of mixed testicular germ cell tumors, embryonal
      carcinoma was present in all 50 cases alongside yolk sac, teratoma,
      seminoma, and choriocarcinoma components.
- name: Yolk Sac Tumor Component
  description: >-
    Yolk sac tumor (YST) recapitulates extraembryonic primitive-endoderm
    differentiation and secretes alpha-fetoprotein (AFP). Post-pubertal-type YST
    rarely occurs in pure form and is most often a component of a mixed germ
    cell tumor.
  evidence:
  - reference: ORPHA:180234
    reference_title: "Mixed germ cell tumor"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A rare germ cell tumor characterized by composition of two or more
      malignant germ cell components, the most common combination being
      dysgerminoma and yolk sac tumor.
    explanation: >-
      Identifies yolk sac tumor (frequently combined with dysgerminoma) as one
      of the characteristic malignant germ cell components of mixed germ cell
      tumor.
- name: Choriocarcinoma Component
  description: >-
    Choriocarcinoma recapitulates trophoblastic differentiation, contains
    syncytiotrophoblasts that secrete beta-human chorionic gonadotropin
    (beta-hCG), presents as hemorrhagic necrotic nodules, and has a propensity
    for early hematogenous (visceral) metastasis.
  evidence:
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Choriocarcinoma is a highly vascularized tumor with rapid development of
      extensive metastasis particularly in the lung, but also in the liver,
      brain, and other organs.
    explanation: >-
      Documents the vascularity and rapid visceral hematogenous metastasis
      characteristic of choriocarcinoma components.
- name: Teratoma Component
  description: >-
    Teratoma shows somatic differentiation along ectodermal, mesodermal, and
    endodermal lineages. In post-pubertal mixed tumors it is chemoresistant and
    residual teratoma after chemotherapy requires surgical resection.
  evidence:
  - reference: PMID:37175579
    reference_title: "Breaking the Mold: Epigenetics and Genomics Approaches Addressing Novel Treatments and Chemoresponse in TGCT Patients."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Mature teratomas showing the highest degrees of differentiation are
      recognized as the most chemotherapy-resistant TGCT cases
    explanation: >-
      Confirms differentiated teratoma as the intrinsically
      chemotherapy-resistant component of germ cell tumors.
- name: Seminoma Component
  description: >-
    A seminomatous (testis) / dysgerminomatous (ovary) component recapitulates
    primordial germ cell / gonocyte phenotype and is the component most
    associated with KIT mutation. Its presence in an otherwise non-seminomatous
    mixed tumor does not change non-seminomatous management.
  evidence:
  - reference: PMID:40037273
    reference_title: "Acute abdominopelvic pain and distension in a 21-year-old woman revealing a mixed germ cell tumor: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical evaluation and supplementary investigations confirmed the
      diagnosis of a mixed OGCT, featuring the most common combination of yolk
      sac tumor and dysgerminoma.
    explanation: >-
      Confirms dysgerminoma (the ovarian counterpart of seminoma) as a frequent
      component of mixed germ cell tumors.
pathophysiology:
- name: Primordial Germ Cell Maldifferentiation and GCNIS
  biological_scale: CELLULAR
  description: >-
    Mixed germ cell tumors originate from primordial germ cells (PGCs) /
    gonocytes that fail to differentiate normally during fetal development and
    persist in a pluripotent state. In post-pubertal-type tumors this gives rise
    to germ cell neoplasia in situ (GCNIS), the common precursor lesion from
    which the invasive tumor and all of its histologic components derive.

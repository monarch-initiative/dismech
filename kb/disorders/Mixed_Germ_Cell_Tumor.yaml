    explanation: >-
      Demonstrates that strong death-receptor and mitochondrial apoptotic
      activation coupled with attenuated DNA repair underlies germ cell tumor
      cisplatin sensitivity.
  - reference: PMID:41384700
    reference_title: "Molecular pathology of testicular germ cell tumours: an update for practicing pathologists."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Alterations associated with the formation of a somatic-type malignancy
      and/or the development of cisplatin resistance include TP53 mutations or
      MDM2 gene amplifications as well as epigenetic alterations.
    explanation: >-
      Identifies somatic TP53 mutations, MDM2 amplification, and epigenetic
      alterations as molecular drivers of cisplatin resistance.
  downstream:
  - target: Gonadal or Extragonadal Tumor Mass
    description: >-
      Platinum resistance permits persistence/relapse of the tumor mass.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
histopathology:
- name: Coexisting Multilineage Germ Cell Components and Stem-Cell Marker Immunophenotype
  finding_term:
    preferred_term: germ cell tumor immunohistochemical marker panel
    term:
      id: NCIT:C40998
      label: Immunophenotypic Finding
  diagnostic: true
  description: >-
    Mixed germ cell tumors contain two or more distinct malignant germ cell
    components (combinations of embryonal carcinoma, yolk sac tumor, teratoma,
    seminoma/dysgerminoma, and choriocarcinoma). Immunohistochemistry resolves
    difficult-to-classify components: OCT3/4, CD30, and SOX2 co-expression
    identifies embryonal carcinoma, whereas OCT3/4 positivity without SOX2/CD30
    characterizes seminoma/GCNIS and GDF3/SALL4 positivity without OCT3/4 or
    CD30 supports yolk sac tumor.
  evidence:
  - reference: PMID:19396148
    reference_title: "Testicular mixed germ cell tumors: a morphological and immunohistochemical study using stem cell markers, OCT3/4, SOX2 and GDF3, with emphasis on morphologically difficult-to-classify areas."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A total of 34/43 (79%) of difficult-to-classify areas stained 3+ for
      OCT3/4, CD30, and SOX2, similar to embryonal carcinoma.
    explanation: >-
      Establishes the OCT3/4+, CD30+, SOX2+ immunohistochemical profile used to
      classify embryonal carcinoma components within mixed germ cell tumors.
- name: Schiller-Duval Bodies in Yolk Sac Tumor Component
  finding_term:
    preferred_term: Schiller-Duval Body
    term:
      id: NCIT:C54124
      label: Schiller-Duval Body
  diagnostic: true
  description: >-
    Perivascular glomeruloid Schiller-Duval bodies are a classic diagnostic
    microscopic hallmark when a yolk sac tumor component is present within a
    mixed germ cell tumor.
  evidence:
  - reference: PMID:40818404
    reference_title: "Pediatric vaginal yolk sac tumor: A rare case report and diagnostic challenges."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histopathologic analysis confirmed YST, supported by characteristic
      Schiller-Duval bodies and markedly elevated alpha-fetoprotein (AFP) levels.
    explanation: >-
      Supports Schiller-Duval bodies as the characteristic histopathologic
      hallmark of yolk sac tumor differentiation.
- name: Postpubertal Chemoresistant Teratoma Component
  finding_term:
    preferred_term: Teratoma
    term:
      id: NCIT:C3403
      label: Teratoma
  description: >-
    Differentiated ectodermal, mesodermal, and endodermal tissues within mixed
    germ cell tumors frequently persist as chemoresistant teratoma in
    post-chemotherapy residual masses (~35% of resected residual retroperitoneal
    specimens).
  evidence:
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Pathologic examination of RPLND following chemotherapy ...
      necrosis in 50% of cases, mature teratoma in 35%, and viable tumor in 15%.
    explanation: >-
      Quantifies residual mature teratoma (35%) and viable tumor (15%) in
      post-chemotherapy non-seminomatous germ cell tumor resections.
diagnosis:
- name: Serum Tumor Marker Panel (AFP, beta-hCG, LDH)
  markers: AFP, beta-hCG, LDH
  description: >-
    Pre- and post-treatment measurement of serum alpha-fetoprotein (AFP),
    beta-human chorionic gonadotropin (beta-hCG), and lactate dehydrogenase
    (LDH) is mandatory for initial diagnosis, detection of non-seminomatous
    elements (any AFP elevation excludes pure seminoma), AJCC S-category
    staging, IGCCCG prognostic risk assignment, and kinetic response monitoring.
  diagnosis_term:
    preferred_term: Alpha-fetoprotein Measurement
    term:
      id: NCIT:C74732
      label: Alpha-fetoprotein Measurement
  evidence:
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Diagnosis, staging and risk assessment is based on a testicular
      ultrasound, pre- and post-orchiectomy AFP, BHCG and LDH, and a
      thoraco-abdominopelvic CT scan.
    explanation: >-
      Clinical practice guideline establishing pre- and post-operative AFP,
      beta-hCG, and LDH measurement as mandatory for germ cell tumor diagnosis
      and staging.
- name: Diagnostic Ultrasonography and Cross-Sectional CT/MRI Staging
  description: >-
    High-frequency scrotal or pelvic ultrasonography characterizes the primary
    gonadal mass (typically a unilateral, vascularized solid tumor with
    inhomogeneous echogenicity and small dispersed cystic spaces in ovarian
    mixed GCT), while contrast-enhanced thoraco-abdominopelvic CT or MRI stages
    nodal, mediastinal, and visceral disease.
  diagnosis_term:
    preferred_term: Diagnostic Ultrasound
    term:
      id: NCIT:C19337
      label: Diagnostic Ultrasound
  evidence:
  - reference: PMID:33142349
    reference_title: "Imaging in gynecological disease (22): clinical and ultrasound characteristics of ovarian embryonal carcinomas, non-gestational choriocarcinomas and malignant mixed germ cell tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Using pattern recognition, the typical ultrasound appearance was a large
      solid tumor with inhomogeneous echogenicity of the solid tissue and often
      dispersed cysts which, in most cases, were small and irregular.
    explanation: >-
      Characterizes the diagnostic ultrasound pattern of malignant mixed germ
      cell tumors in a multicenter IOTA cohort.
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Diagnosis, staging and risk assessment is based on a testicular
      ultrasound, pre- and post-orchiectomy AFP, BHCG and LDH, and a
      thoraco-abdominopelvic CT scan.
    explanation: >-
      Establishes bilateral testicular ultrasonography and
      thoraco-abdominopelvic CT as standard diagnostic and staging imaging.
- name: Histopathologic Assessment and Immunohistochemical Subtyping
  description: >-
    Definitive diagnosis requires thorough histopathologic sampling of the
    resected tumor to quantify every coexisting germ cell component, supported
    by an immunohistochemical panel (OCT3/4, SALL4, PLAP, D2-40, CD117/KIT,
    CD30, SOX2, glypican-3, AFP, beta-hCG) and documentation of GCNIS and
    lymphovascular invasion.
  diagnosis_term:
    preferred_term: Diagnostic Procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:32205480
    reference_title: "Report From the International Society of Urological Pathology (ISUP) Consultation Conference on Molecular Pathology of Urogenital Cancers: IV: Current and Future Utilization of Molecular-Genetic Tests for Testicular Germ Cell Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      On the basis of the premeeting survey, the most commonly used immunomarker
      panel includes OCT3/4, placental alkaline phosphate, D2-40, SALL4, CD117,
      and CD30 for GCTs and the documentation of germ cell neoplasia in situ
      (GCNIS).
    explanation: >-
      ISUP consensus report establishing the diagnostic immunohistochemical
      panel for germ cell tumor component classification and GCNIS
      documentation.
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Pathology is pivotal for diagnosis, incorporating immunohistochemical
      markers to differentiate malignant ovarian germ cell tumors subtypes,
      including dysgerminomas, yolk sac tumors, and immature teratomas.
    explanation: >-
      Confirms histopathology with immunohistochemistry as pivotal for
      differentiating germ cell tumor components in ovarian disease.
- name: Chromosome 12p Gain Molecular Cytogenetic Testing
  description: >-
    Fluorescence in situ hybridization or copy-number testing for isochromosome
    12p [i(12p)] or 12p gain distinguishes GCNIS-derived post-pubertal-type germ
    cell tumors from non-GCNIS pre-pubertal-type tumors and confirms germ cell
    origin in primary or metastatic lesions.
  diagnosis_term:
    preferred_term: Genetic Testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:32205480
    reference_title: "Report From the International Society of Urological Pathology (ISUP) Consultation Conference on Molecular Pathology of Urogenital Cancers: IV: Current and Future Utilization of Molecular-Genetic Tests for Testicular Germ Cell Tumors."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Detection of gain of the short arm of chromosome 12 is diagnostic to
      differentiate between non-GCNIS versus GCNIS related GCTs and supportive
      to the germ cell origin of both primary and metastatic tumors.
    explanation: >-
      ISUP consensus recommendation establishing chromosome 12p gain testing as
      diagnostic for GCNIS-related germ cell tumors.
phenotypes:
- category: Neoplastic
  name: Gonadal or Extragonadal Tumor Mass
  description: >-
    Mixed germ cell tumors present as a mass at gonadal (painless testicular
    mass; large fast-growing ovarian mass with abdominal pain) or extragonadal
    midline sites (anterior mediastinum, retroperitoneum, CNS).
  phenotype_term:
    preferred_term: Testicular neoplasm
    term:
      id: HP:0010788
      label: Testicular neoplasm
  evidence:
  - reference: PMID:37820296
    reference_title: "Adolescent and Young Adult Germ Cell Tumors: Epidemiology, Genomics, Treatment, and Survivorship."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Testicular GCTs (TGCTs) are the \nmost common cancers in 15- to 39-year-old men, and ovarian GCTs (OvGCTs) are the \nleading gynecologic malignancies in women younger than 25 years."
    explanation: >-
      Documents the gonadal presentation of germ cell tumors in the
      characteristic age groups.
  - reference: ORPHA:180234
    reference_title: "Mixed germ cell tumor"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      manifestations may include abdominal pain, abdominal mass, and menstrual
      disorder in females, and a testicular mass in males.
    explanation: >-
      Orphadata clinical summary confirming testicular mass in males and
      abdominal mass in females as presenting features of mixed germ cell tumor.
- category: Neoplastic
  name: Ovarian Mass
  description: >-
    Ovarian mixed germ cell tumors are typically large, fast-growing masses;
    abdominal pain and a palpable abdominal mass are the most common presenting
    symptoms, and about 10% present with acute torsion, hemorrhage, or rupture.
  phenotype_term:
    preferred_term: Ovarian neoplasm
    term:
      id: HP:0100615
      label: Ovarian neoplasm
  evidence:
  - reference: PMID:37820296
    reference_title: "Adolescent and Young Adult Germ Cell Tumors: Epidemiology, Genomics, Treatment, and Survivorship."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ovarian GCTs (OvGCTs) are the \nleading gynecologic malignancies in women younger than 25 years."
    explanation: >-
      Documents the ovarian presentation of germ cell tumors in young women.
  - reference: PMID:40037273
    reference_title: "Acute abdominopelvic pain and distension in a 21-year-old woman revealing a mixed germ cell tumor: A case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among OGCTs, malignant mixed germ cell tumors constitute approximately 8 %
      of cases and are characterized by their aggressive nature.
    explanation: >-
      Confirms malignant mixed germ cell tumor presenting as an aggressive
      ovarian neoplasm in young women.
- category: Clinical
  name: Abdominal Pain
  description: >-
    Abdominal pain is among the most common presenting symptoms of ovarian or
    retroperitoneal mixed germ cell tumor, reflecting a large rapidly growing
    pelvic or retroperitoneal mass and occasional acute complications.
  phenotype_term:
    preferred_term: Abdominal pain
    term:
      id: HP:0002027
      label: Abdominal pain
  evidence:
  - reference: ORPHA:180234
    reference_title: "Mixed germ cell tumor"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      manifestations may include abdominal pain, abdominal mass, and menstrual
      disorder in females, and a testicular mass in males.
    explanation: >-
      Directly identifies abdominal pain among the core presenting clinical
      manifestations of mixed germ cell tumor.
  - reference: PMID:40275685
    reference_title: "Malignant germ cells tumor of the ovary."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Early diagnosis is common due to the rapid tumor growth and symptoms such
      as abdominal pain and distension, leading to favorable prognoses when
      combined with the high chemosensitivity of platinum-based regimens.
    explanation: >-
      Supports abdominal pain and distension from rapid tumor growth as common
      presenting symptoms in ovarian germ cell tumors.
- category: Clinical
  name: Dyspnea
  description: >-
    Primary mediastinal or pulmonary-metastatic mixed germ cell tumors present
    with chest pain, cough, and dyspnea due to anterior mediastinal mass effect
    or lung involvement.
  phenotype_term:
    preferred_term: Dyspnea
    term:
      id: HP:0002094
      label: Dyspnea
  evidence:
  - reference: PMID:35554637
    reference_title: "How to classify, diagnose, treat and follow-up extragonadal germ cell tumors? A systematic review of available evidence."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Patients with mediastinal EGCT had in particular dyspnea (25%), chest pain
      (23%) and cough (17%) at initial presentation
    explanation: >-
      Quantifies dyspnea (25%) as the leading presenting symptom of primary
      mediastinal extragonadal germ cell tumors in a 635-patient international
      series.
- category: Laboratory
  name: Elevated Serum Alpha-Fetoprotein
  description: >-
    Serum AFP is elevated when a yolk sac tumor (or embryonal carcinoma)
    component is present; it is never elevated by pure seminoma or pure
    choriocarcinoma, so elevated AFP indicates non-seminomatous elements.
  phenotype_term:
    preferred_term: Elevated alpha-fetoprotein
    term:
      id: HP:0006254
      label: Elevated circulating alpha-fetoprotein concentration
  evidence:
  - reference: PMID:40723290
    reference_title: "Is Human Chorionic Gonadotropin a Reliable Marker for Testicular Germ Cell Tumor? New Perspectives for a More Accurate Diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Indeed, AFP is not elevated in pure seminomas; LDH serum levels can be
      elevated in other conditions, such as liver disease or tissue damage, and
      hCG can be elevated in both seminomas and non-seminomas, reducing its
      ability to differentiate between tumor types.
    explanation: >-
      Confirms AFP elevation is specific to non-seminomatous (yolk sac /
      embryonal carcinoma) components, not pure seminoma.
  reports_on:
  - target: Yolk Sac Component and AFP Secretion
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Secreted AFP raises serum AFP, the measurable laboratory phenotype.
- category: Laboratory
  name: Elevated Serum Beta-hCG
  description: >-
    Serum beta-hCG is elevated by trophoblastic differentiation, maximally by a
    choriocarcinoma component (often >50,000 IU/L) but also mildly by
    syncytiotrophoblasts in seminomatous and other components.
  phenotype_term:
    preferred_term: Elevated beta-hCG
    term:
      id: HP:6000485
      label: Elevated circulating beta chorionic gonadotropin concentration
  evidence:
  - reference: PMID:40723290
    reference_title: "Is Human Chorionic Gonadotropin a Reliable Marker for Testicular Germ Cell Tumor? New Perspectives for a More Accurate Diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "hCG can be elevated in \nboth seminomas and non-seminomas, reducing its ability to differentiate between \ntumor types."
    explanation: >-
      Confirms beta-hCG elevation across germ cell tumor types, reflecting
      trophoblastic differentiation.
  reports_on:
  - target: Choriocarcinoma Component and beta-hCG Secretion
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Secreted beta-hCG raises serum beta-hCG, the measurable laboratory
      phenotype, and can drive gynecomastia.
- category: Laboratory
  name: Elevated Serum Lactate Dehydrogenase
  description: >-
    Serum LDH is a non-specific marker that reflects tumor burden and is
    incorporated into the S-category of germ cell tumor staging.
  phenotype_term:
    preferred_term: Increased lactate dehydrogenase
    term:
      id: HP:0025435
      label: Increased circulating lactate dehydrogenase concentration
  evidence:
  - reference: PMID:40723290
    reference_title: "Is Human Chorionic Gonadotropin a Reliable Marker for Testicular Germ Cell Tumor? New Perspectives for a More Accurate Diagnosis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "LDH serum levels can be elevated in other \nconditions, such as liver disease or tissue damage"
    explanation: >-
      Notes LDH is a non-specific marker of germ cell tumor burden.
  reports_on:
  - target: Invasive Growth and Metastasis
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: Serum LDH reflects overall tumor burden of the invasive/metastatic mass.
- category: Clinical
  name: Gynecomastia
  description: >-
    Gynecomastia may occur due to beta-hCG production (especially by a
    choriocarcinoma component), which stimulates estrogen production.
  phenotype_term:
    preferred_term: Gynecomastia
    term:
      id: HP:0000771
      label: Gynecomastia
  evidence:
  - reference: PMID:38958901
    reference_title: "SEOM-GG clinical guidelines for the management of germ-cell testicular cancer (2023)."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      have symptoms of metastatic disease such as lumbar back pain, lower
      extremity swelling, dyspnea, cough, neck mass enlargement, gynecomastia
    explanation: >-
      Clinical practice guideline recognizing gynecomastia as a systemic
      manifestation of germ cell tumors.
biochemical:
- name: Alpha-Fetoprotein (AFP)
  biomarker_term:
    preferred_term: Alpha-Fetoprotein
    term:

disease_term:
  preferred_term: Advanced Sleep Phase Syndrome
  term:
    id: MONDO:0015609
    label: advanced sleep phase syndrome
description: >-
  Advanced sleep phase syndrome (ASPS), known in current sleep-medicine
  nomenclature as advanced sleep-wake phase disorder (ASWPD), is an intrinsic
  circadian rhythm sleep-wake disorder in which the endogenous circadian
  pacemaker is stably phase-advanced relative to the conventional light-dark
  and social cycle. Affected individuals fall asleep involuntarily in the early
  evening (typically 18:00-21:00) and wake spontaneously in the early morning
  (typically 02:00-05:00). The diagnostic key is that sleep itself is normal:
  when individuals are allowed to follow their own early schedule, sleep
  architecture, quality, and total duration are preserved. The complaint is
  therefore one of sleep timing, not sleep quality or quantity, and the
  clinical morbidity arises from the mismatch between biological and social
  time - evening sleepiness that truncates social and occupational activity,
  and early-morning awakening experienced as terminal insomnia when the person
  attempts to keep conventional hours.

  The familial form (familial advanced sleep phase syndrome, FASPS/FASP) is a
  landmark of human circadian genetics: it was the first well-characterized
  Mendelian circadian rhythm variant in humans and remains the clearest example
  of a single-gene lesion that changes a complex human behavior by changing the
  intrinsic period of the circadian clock. It segregates as an autosomal
  dominant trait with high penetrance and is caused by variants in components
  of the core transcription-translation feedback loop (TTFL) - PER2, CSNK1D,
  CRY2, PER3, and TIMELESS. A sporadic and age-related form also exists, in
  which advanced sleep timing emerges with aging and with neurodegenerative
  change in the suprachiasmatic nucleus.

  ASPS is substantially under-recognized relative to delayed sleep-wake phase
  disorder, in part because early rising is socially tolerated - even
  valorized - so affected individuals rarely present for care unless another
  sleep disorder brings them to attention.
has_subtypes:
- name: FASPS
  display_name: Familial Advanced Sleep Phase Syndrome (FASPS/FASP)
  description: >-
    The inherited form, segregating as an autosomal dominant trait with high
    penetrance. Typically emerges before age 30 and is present in a
    first-degree relative. Caused by variants in core circadian clock genes
    (PER2, CSNK1D, CRY2, PER3, TIMELESS) that shorten the intrinsic circadian
    period or alter photic entrainment. This is the form to which the MONDO
    concept and its familial advanced sleep-phase syndrome synonyms most
    directly correspond, and it is the mechanistic centrepiece of this entry.
  classification: genetic_etiology
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:10470086
    reference_title: "Familial advanced sleep-phase syndrome: A short-period circadian rhythm variant in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we describe three kindreds with a profound phase advance of the
      sleep-wake, melatonin and temperature rhythms associated with a very
      short tau. The trait segregates as an autosomal dominant with high
      penetrance.
    explanation: >-
      The original description of FASPS establishes the autosomal dominant,
      highly penetrant familial subtype with a short intrinsic period.
  - reference: PMID:39864932
    reference_title: "Advanced sleep phase syndrome: Role of genetics and aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Advanced sleep phase (ASP) is seldom brought to medical attention because
      many individuals easily adapt to their early chronotype, especially if it
      emerges before the age of 30 and is present in a first-degree relative.
      In this case, the disorder is considered familial (FASP)
    explanation: >-
      Defines the familial subtype by early onset plus a first-degree relative,
      and notes its characteristic under-ascertainment.
- name: Sporadic/Age-Related ASPS
  display_name: Sporadic and Age-Related Advanced Sleep Phase
  description: >-
    The non-familial form, in which advanced sleep timing arises without an
    identified Mendelian variant. Advanced sleep timing becomes progressively
    more common with age, and age-related circadian change is compounded by
    neurodegenerative disease affecting the suprachiasmatic nucleus and by
    reduced sensitivity and responsiveness to light. Early morning awakening
    occurs in roughly 4% of older individuals, and distressing advanced
    sleep-wake timing (ASWPD) affects approximately 1% of middle-aged adults.
  classification: genetic_etiology
  evidence:
  - reference: PMID:39864932
    reference_title: "Advanced sleep phase syndrome: Role of genetics and aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Early morning awakening is, instead, more common among older individuals,
      occurring in almost 4% of cases, without considering associated
      comorbidities. Advanced sleep-wake phase disorder (ASWPD) is
      characterized by a consistent and distressing anticipation of sleep-wake
      timing, affecting almost 1% of middle-aged individuals.
    explanation: >-
      Distinguishes the age-related/sporadic form and quantifies early morning
      awakening in older adults and ASWPD in middle age.
  - reference: PMID:39864932
    reference_title: "Advanced sleep phase syndrome: Role of genetics and aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Age-related alterations in circadian rhythms are exacerbated and
      compounded by neurodegenerative disorders, impacting the suprachiasmatic
      nucleus (SCN), sensitivity to light, and light responsiveness in those
      affected.
    explanation: >-
      Identifies the SCN and photic-responsiveness substrate of the age-related
      subtype, distinguishing it mechanistically from the Mendelian form.
pathophysiology:
- name: Autosomal Dominant Core Clock Gene Variant
  description: >-
    A germline, autosomal dominant variant in a component of the core circadian
    transcription-translation feedback loop (TTFL) or its regulatory kinase.
    In the canonical loop, CLOCK-BMAL1 activates transcription of PER and CRY;
    PER/CRY protein complexes accumulate, are phosphorylated, enter the
    nucleus, and repress CLOCK-BMAL1. The rate constants of this loop -
    phosphorylation, degradation, and nuclear entry - set the intrinsic period
    (tau). FASPS variants perturb exactly these rate constants. Reported genes
    are PER2, CSNK1D, CRY2, PER3, and TIMELESS.

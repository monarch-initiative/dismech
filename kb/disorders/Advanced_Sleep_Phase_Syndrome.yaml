    explanation: >-
      Evidences the behavioral positive-feedback loop - early awakening brings
      forward light exposure, which advances the clock further.
- name: Autosomal Dominant Circadian-Regulatory Gene Variant
  description: >-
    A germline, autosomal dominant variant in a component of the core circadian
    transcription-translation feedback loop (TTFL), its regulatory kinase, or
    a channel that shapes light entrainment.
    In the canonical loop, CLOCK-BMAL1 activates transcription of PER and CRY;
    PER/CRY protein complexes accumulate, are phosphorylated, enter the
    nucleus, and repress CLOCK-BMAL1. The rate constants of this loop -
    phosphorylation, degradation, and nuclear entry - set the intrinsic period
    (tau). Most FASPS variants perturb these rate constants; CACNA1D variants
    instead alter Cav1.3 channel dynamics and photic entrainment. Reported
    genes are PER2, CSNK1D, CRY2, PER3, TIMELESS, and CACNA1D.

      production and clearance rates to test which parameter regimes move
      chronotype and physiological phase markers together.
    limitations: >-
      The model is a generic human chronotype model rather than an ASPS genotype
      model. It does not encode PER2, CSNK1D, CRY2, TIMELESS, CACNA1D, or PER3,
      and the publication does not calibrate a disease-specific short-period
      parameter set against an ASPS cohort.
    readouts:
    - name: Modeled chronotype response to intrinsic-period variation
      target: Shortened Intrinsic Circadian Period
      direction: ALTERED

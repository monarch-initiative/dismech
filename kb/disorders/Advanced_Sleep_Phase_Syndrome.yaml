  - reference: PMID:15800623
    reference_title: "Functional consequences of a CKIdelta mutation causing familial advanced sleep phase syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      This mutant kinase has decreased enzymatic activity in vitro.
    explanation: >-
      Biochemical finding, split from the human genetic item above because the

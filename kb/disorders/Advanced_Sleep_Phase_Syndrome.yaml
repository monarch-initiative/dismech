      CRSWDs are easily mistaken for insomnia or early waking up, resulting in
      inappropriate treatment.
    explanation: >-
      Supports that the early awakening of a circadian disorder is commonly
      misattributed to an insomnia disorder, leading to inappropriate therapy.
- name: Evening Sleepiness
  category: Behavioral
  description: >-
    Overwhelming sleepiness in the late afternoon and evening, worsening when
    the individual attempts to remain awake for social, family, or occupational
    obligations. Unlike the excessive daytime somnolence of a primary
    hypersomnia, it is confined to the biological evening and resolves if sleep
    is permitted at the advanced time.
  phenotype_term:
    preferred_term: Evening drowsiness
    term:
      id: HP:0002329
      label: Drowsiness
    temporality: DIURNAL
  notes: >-
    `frequency:` is deliberately omitted. The cited source reports no
    per-symptom frequency data for evening sleepiness, and no quantitative

        explanation: Explicitly identifies familial advanced sleep phase as an application of the model results.
    evidence:
    - reference: PMID:20484693
      reference_title: Probing the mechanisms of chronotype using quantitative modeling.
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: "The model demonstrates that this spectrum likely results from interindividual differences in homeostatic kinetics in the first group, and differences in circadian period in the second group."
      explanation: Establishes the modeled mechanism separating the two phase-marker regimes.

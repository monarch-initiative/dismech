    - reference: PMID:41812650
      reference_title: Discovery of MARK2 as a physiological kinase for PER2 in the mammalian clock.
      supports: PARTIAL
      evidence_source: IN_VITRO
      snippet: "Circadian period was shortened in Mark2-deficient cells in an S662-dependent manner."

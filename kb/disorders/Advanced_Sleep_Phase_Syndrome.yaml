  evidence:
  - reference: PMID:11232563
    reference_title: "An hPer2 phosphorylation site mutation in familial advanced sleep phase syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Familial advanced sleep phase syndrome (FASPS) is an autosomal dominant
      circadian rhythm variant; affected individuals are "morning larks" with a
      4-hour advance of the sleep, temperature, and melatonin rhythms.
    explanation: >-
      Quantifies the coordinated multi-marker phase advance that defines this
      node.
- name: Circadian Misalignment with Conventional Social Schedule
  description: >-
    The clinically disabling step. An advanced clock is not intrinsically
    harmful; morbidity arises when biological night conflicts with the socially
    required schedule. Attempting to stay awake for evening obligations
    produces overwhelming evening sleepiness; attempting to remain asleep to a
    conventional wake time produces early-morning awakening experienced as
    terminal insomnia; and resisting the advanced schedule at both ends causes
    chronic sleep restriction. Distress or functional impairment arising from
    this misalignment - not the early timing per se - is what converts an
    advanced chronotype into advanced sleep-wake phase disorder.
  biological_scale: ORGANISM
  role: outcome
  downstream:
  - target: Sleep Restriction and Functional Impairment
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:34493186
    reference_title: "Treatment of Circadian Rhythm Sleep-Wake Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The main clinical manifestations are insomnia and excessive daytime
      sleepiness that often lead to clinically meaningful distress or cause
      mental, physical, social, occupational, educational, or other functional
      impairment.
    explanation: >-
      Establishes that clinically meaningful distress and functional impairment
      define the disorder-level presentation of circadian misalignment.
  - reference: PMID:31400754
    reference_title: "Genetics of the human circadian clock and sleep homeostat."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Negative health consequences have been identified when individuals do not
      sleep at their ideal circadian timing or are sleep deprived relative to
      intrinsic sleep need.
    explanation: >-
      Supports that harm follows from sleeping away from one's ideal circadian
      timing, i.e. from misalignment rather than from the phase itself.
phenotypes:
- name: Early Chronotype
  category: Behavioral
  description: >-
    A stable, lifelong tendency to rise very early and to go to bed early - the
    morning lark extreme of the chronotype distribution. In FASPS this is
    profound rather than a mild preference, and is present in multiple
    generations of a kindred.
  phenotype_term:
    preferred_term: Early chronotype
    term:
      id: HP:0031873
      label: Early chronotype
    clinical_course: STABLE
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:11232563
    reference_title: "An hPer2 phosphorylation site mutation in familial advanced sleep phase syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      affected individuals are "morning larks" with a 4-hour advance of the
      sleep, temperature, and melatonin rhythms
    explanation: >-
      Describes the extreme morning chronotype that defines affected
      individuals.
  - reference: PMID:10470086
    reference_title: "Familial advanced sleep-phase syndrome: A short-period circadian rhythm variant in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Although a slight 'morning lark' tendency is common, individuals with a
      large and disabling sleep phase-advance are rare.
    explanation: >-
      Distinguishes the disabling extreme chronotype of ASPS from the common
      mild morning preference.
- name: Early Evening Sleep Onset
  category: Behavioral
  description: >-
    Involuntary sleep onset in the early evening, typically between 18:00 and
    21:00, several hours earlier than the socially conventional bedtime. Sleep
    onset latency is short and sleep initiation is not impaired - this is not
    sleep-onset insomnia but a clock set early.
  phenotype_term:
    preferred_term: Advanced sleep onset
    term:
      id: HP:0031873
      label: Early chronotype
    temporality: CHRONIC
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:15800623
    reference_title: "Functional consequences of a CKIdelta mutation causing familial advanced sleep phase syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Familial advanced sleep phase syndrome (FASPS) is a human behavioural
      phenotype characterized by early sleep times and early-morning awakening.
    explanation: >-
      Directly documents early sleep times as a defining clinical feature.
  - reference: PMID:10470086
    reference_title: "Familial advanced sleep-phase syndrome: A short-period circadian rhythm variant in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This disorder, advanced sleep-phase syndrome, is characterized by very
      early sleep onset and offset
    explanation: >-
      Defines very early sleep onset as a core characteristic of the disorder.
- name: Early Morning Awakening
  category: Behavioral
  description: >-
    Spontaneous final awakening in the early morning hours, typically between
    02:00 and 05:00, with inability to return to sleep. When the individual is
    attempting to keep a conventional schedule this is experienced and often
    misreported as terminal (late) insomnia, which is a major reason ASPS is
    misdiagnosed as an insomnia disorder or as depression.
  phenotype_term:
    preferred_term: Terminal insomnia
    term:
      id: HP:0031356
      label: Terminal insomnia
    temporality: CHRONIC
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:15800623
    reference_title: "Functional consequences of a CKIdelta mutation causing familial advanced sleep phase syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Familial advanced sleep phase syndrome (FASPS) is a human behavioural
      phenotype characterized by early sleep times and early-morning
      awakening.
    explanation: >-
      Directly documents early-morning awakening as a defining clinical

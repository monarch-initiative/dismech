  - reference: PMID:39864932
    reference_title: "Advanced sleep phase syndrome: Role of genetics and aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Autosomal dominant mutations in circadian clock genes like PER2, CK1,
      PER3, CRY2, TIMELESS, and DEC2 have been linked to FASP, some with
      pleiotropic effects influencing other health aspects like migraine and
      depression.
    explanation: >-
      Review enumerates the autosomal dominant core clock genes implicated in
      familial advanced sleep phase.
  - reference: PMID:31400754
    reference_title: "Genetics of the human circadian clock and sleep homeostat."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A portion of the variation in the population is controlled by genetics as
      shown by the single-gene mutations that confer extreme early or late
      chronotypes.
    explanation: >-
      Establishes that single-gene clock mutations are sufficient to produce
      extreme early chronotype, the genetic premise of this node.
- name: PER2 CK1-Site Hypophosphorylation
  description: >-
    The original FASPS lesion, PER2 p.Ser662Gly (S662G), substitutes glycine
    for a serine that lies within the casein kinase I epsilon/delta binding
    region of hPER2 and is itself a CK1 phosphoacceptor. Loss of this
    phosphoacceptor causes PER2 to be hypophosphorylated by CK1 in vitro.
    Because CK1-dependent phosphorylation of PER2 governs both PER2
    transcriptional feedback and PER2 protein turnover, the substitution
    retunes the feedback loop and alters the circadian period. This is the
    substrate side of the PER2/CK1delta lesion pair.
  biological_scale: MOLECULAR
  role: central_effector
  biological_processes:
  - preferred_term: Protein phosphorylation
    term:
      id: GO:0006468
      label: protein phosphorylation
    modifier: DECREASED
  - preferred_term: Regulation of circadian rhythm
    term:
      id: GO:0042752
      label: regulation of circadian rhythm

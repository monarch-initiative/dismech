- name: CRY2 Destabilization by FBXL3
  description: >-
    CRY2 p.Ala260Thr (A260T) lies in the phosphate loop of the FAD-binding
    domain of CRY2. The substitution changes CRY2 conformation so as to
    increase its accessibility and affinity for FBXL3, an E3 ubiquitin ligase,
    thereby promoting CRY2 ubiquitination and degradation. Accelerated turnover
    of this negative-limb repressor shortens the circadian period.
  biological_scale: MOLECULAR
  role: central_effector
  biological_processes:

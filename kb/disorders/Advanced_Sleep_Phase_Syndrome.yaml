- name: Altered PER/CRY Negative Feedback on CLOCK-BMAL1
  description: >-
    The protein-stability and phosphorylation routes to FASPS converge here.
    The TTFL keeps time because PER/CRY repressor complexes accumulate, are
    post-translationally delayed, enter the nucleus, repress CLOCK-BMAL1, and
    are then degraded, permitting the next cycle. Reducing the delay - through
    PER2 S662-site hypophosphorylation, reduced CSNK1D activity, accelerated
    CRY2 degradation, or PER3 destabilization - can make each iteration of the
    loop complete faster. CACNA1D bypasses this node and acts through altered
    entrainment; TIMELESS also has a distinct entrainment phenotype.

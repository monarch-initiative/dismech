- name: Early Chronotype
  category: Behavioral
  description: >-
    A stable, lifelong tendency to rise very early and to go to bed early - the
    morning lark extreme of the chronotype distribution. In FASPS this is
    profound rather than a mild preference, and is present in multiple
    generations of a kindred.
  phenotype_term:

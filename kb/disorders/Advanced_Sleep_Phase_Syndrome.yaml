- name: Phillips Coupled Sleep-Wake and Circadian Chronotype Model
  description: >-
    Physiological model coupling a neuronal sleep-wake switch, homeostatic sleep
    pressure, and a circadian pacemaker. Parameter sweeps separate chronotypes

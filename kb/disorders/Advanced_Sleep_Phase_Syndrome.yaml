      associated with phase-advanced or delayed sleep-wake rhythms,
      respectively.
    explanation: >-
      States the general period-to-phase principle established in rodents that
      predicted, and explains, the human phenotype.
  - reference: PMID:27529127
    reference_title: "A Cryptochrome 2 mutation yields advanced sleep phase in humans."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In mice, the CRY2 mutation causes a shortened circadian period and
      reduced phase-shift to early-night light pulse associated with
      phase-advanced behavioral rhythms in the light-dark cycle.
    explanation: >-
      Independent genetic confirmation that period shortening produces
      phase-advanced behavioral rhythms.
- name: Advanced Circadian Phase of Melatonin, Temperature and Sleep Propensity
  description: >-
    The integrated organism-level output - the entire circadian ensemble,
    pineal melatonin secretion, core body temperature nadir, and the circadian
    drive for sleep, is displaced several hours earlier than normal. In the
    original FASPS kindreds this amounted to roughly a 4-hour advance of the
    sleep, temperature, and melatonin rhythms. Crucially, the oscillation
    itself is intact and of normal amplitude; only its phase is shifted. This
    is why sleep architecture and duration remain normal, and why the disorder
    is one of timing rather than of sleep quality.
  biological_scale: ORGANISM
  role: effector
  biological_processes:
  - preferred_term: Circadian sleep/wake cycle
    term:
      id: GO:0042745
      label: circadian sleep/wake cycle

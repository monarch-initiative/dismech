- name: PER3 Destabilization
  description: >-
    Two rare PER3 variants (p.Pro415Ala and p.His417Arg, PER3-P415A/H417R) were
    identified in individuals with familial advanced sleep phase who also had
    higher Beck Depression Inventory and seasonality scores. The variants
    destabilize PER3 and fail to stabilize PER1/PER2 proteins. The evidence
    base here is weaker than for PER2 or CSNK1D - a single kindred with a
    two-variant haplotype, and the human phenotype is co-reported with a mood
    trait rather than isolated phase advance - so this node is curated as a
    contributory rather than an established mechanism.

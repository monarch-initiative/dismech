    description: >-
      Reduced CK1delta enzymatic activity produces the same end state as loss
      of the PER2 phosphoacceptor serine - hypophosphorylated PER2. This is the
      kinase-side-to-substrate-side convergence that makes the PER2/CSNK1D
      pair unusually strong mechanistic evidence.
    evidence:
    - reference: PMID:17218255
      reference_title: "Modeling of a human circadian mutation yields insights into clock regulation by PER2."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Altering CKIdelta dosage modulates the S662 phenotype demonstrating
        that CKIdelta can regulate period through PER2 in vivo.
      explanation: >-
        Genetic-dosage evidence that CK1delta acts on circadian period through
        PER2 specifically, directly supporting the kinase to substrate edge.
  evidence:
  - reference: PMID:15800623
    reference_title: "Functional consequences of a CKIdelta mutation causing familial advanced sleep phase syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report here the identification of a missense mutation (T44A) in the
      human CKIdelta gene, which results in FASPS.
    explanation: >-
      Human genetic finding - establishes CSNK1D T44A as a FASPS-causing

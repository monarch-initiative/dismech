- name: Altered PER/CRY Negative Feedback on CLOCK-BMAL1
  description: >-
    All of the established FASPS lesions converge here. The TTFL keeps time
    because PER/CRY repressor complexes accumulate, are post-translationally
    delayed, enter the nucleus, repress CLOCK-BMAL1, and are then degraded,
    permitting the next cycle. Reducing the delay - by hypophosphorylating PER2
    (PER2 S662G, CSNK1D T44A), by accelerating CRY2 degradation (CRY2 A260T),
    or by destabilizing the PER/CRY complex (TIMELESS, PER3) - makes each
    iteration of the loop complete faster. This is the shared molecular
    convergence point of the disorder.
  biological_scale: MOLECULAR
  role: central_effector
  biological_processes:
  - preferred_term: Circadian regulation of gene expression
    term:
      id: GO:0032922
      label: circadian regulation of gene expression
  - preferred_term: PER/CRY transcriptional repression of CLOCK-BMAL1
    term:
      id: GO:0045892
      label: negative regulation of DNA-templated transcription
  downstream:
  - target: Shortened Intrinsic Circadian Period
    causal_link_type: DIRECT
    description: A faster feedback loop yields a shorter free-running period.
  evidence:
  - reference: PMID:11232563
    reference_title: "An hPer2 phosphorylation site mutation in familial advanced sleep phase syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Thus, a variant in human sleep behavior can be attributed to a missense
      mutation in a clock component, hPER2, which alters the circadian period.
    explanation: >-
      Establishes that a clock-component variant acts by altering the circadian
      period, the output of this convergence node.
- name: Altered Photic Entrainment of the Circadian Pacemaker
  description: >-
    Light reaching intrinsically photosensitive retinal ganglion cells is
    conveyed by the retinohypothalamic tract to the suprachiasmatic nucleus and
    is the dominant zeitgeber that entrains the clock to the 24-hour day. The
    direction of the resulting shift depends on when in the circadian cycle the
    light falls (the phase-response curve): light in the late night/early
    morning advances the clock, light in the evening delays it. A clock lesion
    can therefore advance phase either by shortening period or by biasing this
    entrainment response, and the TIMELESS variant acts predominantly through
    the latter. This node is also the substrate on which treatment acts, and
    the reason mistimed light worsens the disorder.
  biological_scale: CELLULAR
  role: mediator
  cell_types:
  - preferred_term: Intrinsically photosensitive retinal ganglion cell
    term:
      id: CL:0020014
      label: intrinsically photosensitive retinal ganglion cell
  biological_processes:
  - preferred_term: Entrainment of circadian clock by photoperiod
    term:
      id: GO:0043153
      label: entrainment of circadian clock by photoperiod
  locations:
  - preferred_term: Retina
    term:
      id: UBERON:0000966
      label: retina
  - preferred_term: Suprachiasmatic nucleus
    term:
      id: UBERON:0002034
      label: suprachiasmatic nucleus
  downstream:
  - target: Advanced Circadian Phase of Melatonin, Temperature and Sleep Propensity
    causal_link_type: DIRECT
    description: Biased entrainment settles the clock at an abnormally early phase.
  evidence:

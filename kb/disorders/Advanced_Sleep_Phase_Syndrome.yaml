  - preferred_term: PER2
    term:
      id: hgnc:8846
      label: PER2
  downstream:
  - target: Altered PER/CRY Negative Feedback on CLOCK-BMAL1
    causal_link_type: DIRECT
    description: >-
      Hypophosphorylated PER2 alters the timing and strength of PER/CRY
      repression of CLOCK-BMAL1.
  evidence:
  - reference: PMID:11232563
    reference_title: "An hPer2 phosphorylation site mutation in familial advanced sleep phase syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected individuals have a serine to glycine mutation within the casein
      kinase Iepsilon (CKIepsilon) binding region of hPER2
    explanation: >-
      Human genetic finding - establishes the serine-to-glycine substitution in
      the CK1epsilon binding region of hPER2 in affected individuals.
  - reference: PMID:11232563
    reference_title: "An hPer2 phosphorylation site mutation in familial advanced sleep phase syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      which causes hypophosphorylation by CKIepsilon in vitro
    explanation: >-
      Biochemical finding, split from the human genetic item above because the
      authors state the hypophosphorylation result is in vitro. This is the
      evidence for the phosphorylation defect itself.
  - reference: PMID:17218255
    reference_title: "Modeling of a human circadian mutation yields insights into clock regulation by PER2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We generated transgenic mice carrying the FASPS hPER2 S662G mutation and
      faithfully recapitulate the human phenotype. We show that phosphorylation
      at S662 leads to increased PER2 transcription and suggest that
      phosphorylation at another site leads to PER2 degradation.
    explanation: >-
      Mouse modelling of S662G recapitulates the human phenotype and shows the
      phosphosite controls PER2 transcription and, at other sites, degradation.
- name: CK1delta Reduced Kinase Activity
  description: >-
    CSNK1D p.Thr44Ala (T44A) mutates the kinase rather than the substrate:
    casein kinase I delta acts on the same PER2 phosphorylation axis that is
    disrupted by PER2 S662G. (The published evidence for the linkage is
    dosage epistasis - altering CKIdelta dosage modulates the S662 phenotype -
    rather than a direct demonstration that CK1delta phosphorylates residue
    662 itself.) The T44A mutant kinase has decreased enzymatic
    activity in vitro. This is the enzyme side of the same molecular lesion,
    and it phenocopies PER2 S662G - a strikingly clean piece of mechanistic
    evidence, because the substrate lesion and the kinase lesion converge on a
    single biochemical event (CK1-dependent PER2 phosphorylation) and produce
    the same human phenotype. Transgenic mice bearing CKIdelta-T44A have a
    shortened circadian period mimicking human FASPS, and CKIdelta gene dosage
    modulates the PER2 S662G phenotype in vivo, formally demonstrating that the
    two lesions act on the same axis.
  biological_scale: MOLECULAR
  role: central_effector
  biological_processes:

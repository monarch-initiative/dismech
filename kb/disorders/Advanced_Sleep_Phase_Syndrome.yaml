- population: Middle-aged adults
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 1000.0
  notes: >-
    Review estimate that advanced sleep-wake phase disorder affects almost 1%
    of middle-aged individuals. Substantially higher than the sleep-clinic
    ASWPD figure; reflects differing ascertainment and criteria, and should be
    read as an upper-bound community estimate.
  evidence:
  - reference: PMID:39864932
    reference_title: "Advanced sleep phase syndrome: Role of genetics and aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Advanced sleep-wake phase disorder (ASWPD) is characterized by a
      consistent and distressing anticipation of sleep-wake timing, affecting
      almost 1% of middle-aged individuals.
    explanation: >-
      Provides the community-level ASWPD prevalence estimate in middle-aged
      adults.
notes: >-
  Ascertainment and nomenclature caveats. (1) ASPS is systematically
  under-diagnosed relative to delayed sleep-wake phase disorder. Early rising
  is socially tolerated and often admired, so affected individuals seldom seek
  care; familial cases are typically found incidentally during evaluation for
  another sleep disorder, usually obstructive sleep apnea. The prevalence
  figures above are correspondingly likely to be underestimates of the
  underlying phenotype, though not necessarily of the impairing disorder.
  (2) Three overlapping entities are frequently conflated in the literature and
  should be kept distinct - advanced sleep phase (ASP, an extreme morning
  chronotype), familial advanced sleep phase (FASP, the heritable form), and
  advanced sleep-wake phase disorder (ASWPD, the subset causing distress or
  functional impairment). Only the last is a disorder by ICSD criteria.
  (3) The MONDO concept MONDO:0015609 is classified as a hereditary disease and
  carries FASPS synonyms, so it maps most precisely onto the familial subtype;
  the sporadic/age-related subtype is curated here for clinical completeness
  and differential-diagnostic value.
  (4) No `biochemical:` section is curated. The reference circadian biomarker
  (dim light melatonin onset) is instead carried by the
  `Advanced Melatonin Secretion Phase` phenotype (HP:0012689, whose definition
  covers timing as well as amount), by the `diagnosis` DLMO entry, and by the
  DLMO `definitions` entry. A `biochemical:` entry would require an NCIT
  biomarker term for melatonin measurement reachable from NCIT:C16342; no such
  term was verified, and rather than bind a plausible-but-unchecked identifier
  the section is deliberately deferred. The sibling entry
  Delayed_Sleep_Phase_Syndrome likewise has no `biochemical:` section.
  (5) Obstructive sleep apnea is curated under `differential_diagnoses` as a
  confounder/companion rather than as a comorbidity, because `comorbidities` is
  not a slot on the Disease class in this schema - comorbidity pairs are
  modelled as separate entities under `kb/comorbidities/`. An
  ASPS-OSA comorbidity entry would be a reasonable follow-up.
  (6) DEC2 (BHLHE41) is named alongside the FASP genes in review literature,
  but its best-established human phenotype is familial natural short sleep -
  short sleep duration - rather than phase advance. It is deliberately excluded
  from the genetic section here, since ASPS is defined by normal sleep duration
  at an advanced phase.
discussions:
- discussion_id: asps_per3_validity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Is PER3 a genuine advanced-sleep-phase gene, or is the reported
    P415A/H417R association confounded by the co-reported seasonal mood trait?
  attaches_to:
  - pathophysiology#PER3 Destabilization
  rationale: >-
    The original PER3 association used one kindred carrying a two-variant
    haplotype and bundled familial advanced sleep phase with elevated Beck
    Depression Inventory and seasonality scores. A 2024 Slovenian cohort found
    the same haplotype in one extreme-morning proband and the proband's father,
    providing limited replication but not broad segregation or objective DLMO
    confirmation. The functional data (destabilized PER3, failure to stabilize
    PER1/PER2) are real but do not by themselves establish which clinical trait
    is attributable to PER3. The entry therefore retains DISPUTED rather than
    CAUSATIVE status. No ClinGen gene-disease validity classification exists
    for any ASPS gene.
  proposed_experiments:
  - experiment_id: asps_exp_per3_replication
    name: Larger independent segregation series for PER3
    description: >-
      Identify additional unrelated kindreds with objective circadian-phase
      phenotyping and segregation of PER3 variants, ideally separating the two
      variants of the P415A/H417R haplotype to determine which (if either)
      drives the circadian phenotype.
  - experiment_id: asps_exp_per3_phase_vs_mood
    name: Phase-versus-mood phenotype separation in PER3 carriers
    description: >-
      Phenotype PER3 variant carriers with DLMO and actigraphy alongside
      structured mood and seasonality assessment, to determine whether phase
      advance occurs independently of the mood trait.
  evidence:
  - reference: PMID:26903630
    reference_title: "A PERIOD3 variant causes a circadian phenotype and is associated with a seasonal mood trait."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified two rare variants in the circadian clock gene PERIOD3
      (PER3-P415A/H417R) in humans with familial advanced sleep phase
      accompanied by higher Beck Depression Inventory and seasonality scores.
    explanation: >-
      Documents the confounded phenotype - advanced sleep phase reported
      together with a mood/seasonality trait - that motivates this gap.
  - reference: PMID:38695651
    reference_title: "Variants in the circadian clock genes PER2 and PER3 associate with familial sleep phase disorders."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The variants were significantly linked to Advanced sleep phase disorder
      and were also found in proband's father with extreme morningness.
    explanation: >-
      Shows that the 2024 replication is limited to a proband-parent pair and
      questionnaire-defined extreme morningness, so the validity gap narrows
      but remains open.
- discussion_id: asps_melatonin_evidence_gap
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Does correctly timed morning melatonin actually produce clinically
    meaningful phase delay in ASWPD without unacceptable daytime sedation?
  attaches_to:
  - pathophysiology#Advanced Circadian Phase of Melatonin, Temperature and Sleep Propensity
  rationale: >-
    Morning melatonin is mechanistically indicated for ASWPD by the melatonin
    phase-response curve, and review literature names advanced sleep phase
    among the disorders in which timed melatonin is useful. But the AASM
    guideline could make no recommendation for melatonin in ASWPD, the review
    literature states outright that clinical safety and effectiveness data are
    lacking, and the sedative effect of morning dosing may undermine the very
    schedule the treatment is meant to establish. The evidence for this
    treatment therefore carries a deliberate mixture of SUPPORT, NO_EVIDENCE,
    and REFUTE items in this entry - an honest reflection of an unresolved
    question rather than an internal inconsistency.
  proposed_experiments:
  - experiment_id: asps_exp_melatonin_rct
    name: Randomized trial of DLMO-timed morning melatonin in ASWPD
    description: >-
      Randomized placebo-controlled trial of morning melatonin timed against
      individually measured DLMO, in DLMO-confirmed ASWPD, with DLMO shift and
      actigraphic sleep timing as primary endpoints and next-day sleepiness
      plus schedule adherence as co-primary safety endpoints, since sedation is
      the predicted failure mode.
  evidence:
  - reference: PMID:34493186
    reference_title: "Treatment of Circadian Rhythm Sleep-Wake Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, there is a lack of clinical data and information regarding the
      safety and effectiveness of melatonin
    explanation: States the evidence gap directly.
- discussion_id: asps_variant_and_penetrance_reporting
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    What is the specific TIMELESS variant causing familial advanced sleep
    phase, and what is the penetrance of each ASPS gene?
  attaches_to:
  - pathophysiology#TIMELESS Nuclear Exclusion
  rationale: >-
    The cached TIMELESS abstract establishes that a human TIMELESS mutation
    causes FASP and characterizes its molecular consequences, but names no
    specific variant, so this entry deliberately declines to assert one rather
    than importing an unverifiable variant name from the deep-research report.
    More broadly, penetrance is quantified for none of the six ASPS genes
    beyond the original PER2 kindreds being described as highly penetrant, and
    penetrance may be age- and light-environment-dependent. This limits both
    variant interpretation and genetic counselling.
  proposed_experiments:
  - experiment_id: asps_exp_timeless_variant_sourcing
    name: Source the TIMELESS variant to a citable record
    description: >-
      Extract the specific TIMELESS variant with HGVS nomenclature against a
      stated transcript from the primary full text and ClinVar, so it can be
      asserted with a verifiable citation.
  - experiment_id: asps_exp_penetrance
    name: Age-stratified penetrance estimation across ASPS genes
    description: >-
      Aggregate reported kindreds per gene to estimate age-specific penetrance,
      recording light environment and habitual schedule as covariates given
      that both are expected to modify expression.
  evidence:
  - reference: PMID:31138685
    reference_title: "TIMELESS mutation alters phase responsiveness and causes advanced sleep phase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report a mutation in the human TIMELESS (hTIM) gene that causes
      familial advanced sleep phase (FASP).
    explanation: >-
      Establishes the gene-disease claim while naming no variant - the gap this
      discussion records.

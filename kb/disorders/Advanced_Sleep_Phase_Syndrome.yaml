    reference_title: "TIMELESS mutation alters phase responsiveness and causes advanced sleep phase."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We conclude that TIM, when excluded from the nucleus, can destabilize the
      negative regulators of the circadian clock, alter light entrainment, and
      cause FASP.
    explanation: >-
      Establishes altered light entrainment as a distinct causal route to
      familial advanced sleep phase.
  - reference: PMID:21243069
    reference_title: "Therapeutics for Circadian Rhythm Sleep Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Light is the strongest entraining agent of circadian rhythms and timed
      exposure to bright light is often used in the treatment of circadian
      rhythm sleep disorders.
    explanation: >-
      Establishes light as the dominant entraining agent and the basis of
      timed-light therapy acting on this node.
  - reference: PMID:34493186
    reference_title: "Treatment of Circadian Rhythm Sleep-Wake Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Studies have also shown that morning light can advance, while evening
      light or light before bedtime can delay the phase of the circadian
      rhythm
    explanation: >-
      Directly evidences the DIRECTIONALITY of the phase-response curve that
      this node asserts, and which underpins both the pathophysiology (morning
      light reinforces an advance) and the treatment (evening light corrects
      it). This is the sentence that makes the ASWPD-versus-DSWPD mirror-image
      logic evidentiable rather than merely asserted.
  - reference: PMID:34493186
    reference_title: "Treatment of Circadian Rhythm Sleep-Wake Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A phase response curve (PRC) has been generated to describe the magnitude
      and direction of the phase shift of the circadian rhythm according to the
      time, duration, and intensity of light exposure
    explanation: >-
      Establishes the phase-response curve itself as the formal construct

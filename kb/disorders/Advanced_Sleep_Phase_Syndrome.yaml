  - reference: PMID:15800623
    reference_title: "Functional consequences of a CKIdelta mutation causing familial advanced sleep phase syndrome."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In contrast, transgenic mice carrying the same mutation have a shorter
      circadian period, a phenotype mimicking human FASPS.
    explanation: >-
      Mouse model of CKIdelta T44A shows the period shortening that underlies
      the human phase advance. Note the accompanying Drosophila transgenic
      showed a lengthened period, so the direction of effect is
      species-dependent and the mammalian model is the relevant one.
- name: CRY2 Destabilization by FBXL3
  description: >-
    CRY2 p.Ala260Thr (A260T) lies in the phosphate loop of the FAD-binding
    domain of CRY2. The substitution changes CRY2 conformation so as to
    increase its accessibility and affinity for FBXL3, an E3 ubiquitin ligase,
    thereby promoting CRY2 ubiquitination and degradation. Accelerated turnover
    of this negative-limb repressor shortens the circadian period.
  biological_scale: MOLECULAR

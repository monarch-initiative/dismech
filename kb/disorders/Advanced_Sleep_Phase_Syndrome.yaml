    fabricated band.
  evidence:
  - reference: PMID:31384946
    reference_title: "Extreme morning chronotypes are often familial and not exceedingly rare: the estimated prevalence of advanced sleep phase, familial advanced sleep phase, and advanced sleep-wake phase disorder in a sleep clinic population."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This can optimize treatment for evening sleepiness and early morning
      awakening
    explanation: >-
      Identifies evening sleepiness (paired with early morning awakening) as
      the treatable symptom complex of extreme advanced chronotypes. Marked
      PARTIAL because this is a conclusions-section statement about treatment
      targets in a prevalence study, not a direct observation of the phenotype
      or its frequency.
- name: Preserved Sleep Quality and Duration on a Self-Selected Schedule
  category: Behavioral
  description: >-
    The single most useful discriminating feature. When affected individuals
    are permitted to sleep at their own early hours, sleep is consolidated and
    of normal architecture, quality, and total duration. This distinguishes
    ASPS from insomnia disorder (where sleep is poor regardless of timing),
    from depression with early-morning waking (where sleep is typically
    nonrestorative), and from familial natural short sleep (where duration
    itself is reduced). Sleep loss in ASPS is secondary to schedule conflict,
    not intrinsic.
  notes: >-
    Deliberately curated WITHOUT a phenotype_term. This assertion is the
    ABSENCE of a sleep-quality abnormality, so binding any HPO abnormality term
    (e.g. HP:0006979 Sleep-wake cycle disturbance) would make the entry assert
    the negation of its own claim and would be read by downstream consumers as
    a positive abnormality. HPO has no "normal sleep architecture" term; a
    normality/negation construct or a new term request would be needed. The
    same discriminating information is carried in the Insomnia Disorder and
    Major Depressive Disorder differential_diagnoses and in the ICSD-3
    criteria set.
  evidence:
  - reference: PMID:34493186
    reference_title: "Treatment of Circadian Rhythm Sleep-Wake Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Unlike other sleep maintenance disorders, early morning awakenings occur
      after a normal period of undisturbed sleep, that is, the sleep cycle is
      normal for the age.
    explanation: >-
      Directly evidences the discriminating feature - the early awakening
      follows a NORMAL, undisturbed sleep period, explicitly contrasted with
      other sleep-maintenance disorders. This is the sentence that separates
      ASWPD from insomnia disorder.
  - reference: PMID:34493186
    reference_title: "Treatment of Circadian Rhythm Sleep-Wake Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      If the patient is allowed to sleep according to his wishes, the PSG
      results show a normal sleep structure.
    explanation: >-
      Objective polysomnographic confirmation that sleep architecture is normal
      when the patient sleeps on their own advanced schedule - the strongest
      form of this claim.
  - reference: PMID:34493186
    reference_title: "Treatment of Circadian Rhythm Sleep-Wake Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In addition, unlike excessive sleepiness due to other reasons, the
      daytime work or learning ability of people with this disorder is not
      affected by sleepiness.
    explanation: >-
      Distinguishes ASWPD from primary hypersomnias - daytime function is
      preserved, consistent with normal sleep quantity and quality.
  - reference: PMID:10470086
    reference_title: "Familial advanced sleep-phase syndrome: A short-period circadian rhythm variant in humans."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we describe three kindreds with a profound phase advance of the
      sleep-wake, melatonin and temperature rhythms associated with a very
      short tau.
    explanation: >-
      Establishes that the abnormality in the original kindreds is a phase
      advance of otherwise intact sleep-wake, melatonin and temperature
      rhythms, i.e. a timing rather than a sleep-integrity defect. Supports the
      claim only partially, since the abstract does not itself quantify
      preserved sleep architecture.
- name: Sleep Restriction and Functional Impairment
  category: Behavioral
  description: >-
    When the individual resists the advanced schedule at both ends - staying up
    for evening obligations while still waking spontaneously in the early
    morning - the result is chronic curtailment of sleep, with consequent
    daytime dysfunction and social, occupational, and educational impairment.
    This, rather than the phase advance itself, is the source of clinical
    morbidity and the basis for diagnosing a disorder.
  phenotype_term:
    preferred_term: Sleep deprivation
    term:
      id: HP:0002360
      label: Sleep disturbance
    temporality: CHRONIC
  evidence:
  - reference: PMID:34493186
    reference_title: "Treatment of Circadian Rhythm Sleep-Wake Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The main clinical manifestations are insomnia and excessive daytime
      sleepiness that often lead to clinically meaningful distress or cause
      mental, physical, social, occupational, educational, or other functional
      impairment.
    explanation: >-
      Documents the functional-impairment domains that result from circadian
      sleep-wake disorders.
- name: Advanced Melatonin Secretion Phase
  category: Laboratory
  description: >-
    The objective biomarker of the disorder - the nocturnal rise in pineal
    melatonin secretion, and hence dim light melatonin onset (DLMO), occurs
    several hours earlier than normal. In the original FASPS kindreds the
    melatonin rhythm was advanced by approximately 4 hours in parallel with the
    sleep and temperature rhythms. The abnormality is one of timing, not of
    melatonin amount.
  phenotype_term:
    preferred_term: Advanced phase of melatonin secretion
    term:
      id: HP:0012689
      label: Abnormal pineal melatonin secretion
  evidence:
  - reference: PMID:11232563
    reference_title: "An hPer2 phosphorylation site mutation in familial advanced sleep phase syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      affected individuals are "morning larks" with a 4-hour advance of the
      sleep, temperature, and melatonin rhythms
    explanation: >-
      Quantifies the advance of the melatonin rhythm specifically, which is
      what DLMO measurement detects.
  - reference: PMID:10470086
    reference_title: "Familial advanced sleep-phase syndrome: A short-period circadian rhythm variant in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we describe three kindreds with a profound phase advance of the
      sleep-wake, melatonin and temperature rhythms associated with a very
      short tau.
    explanation: >-
      Independently documents the profound phase advance of the melatonin
      rhythm in the original kindreds.
  notes: >-
    HP:0012689 is defined as "An anomaly in the amount or timing of melatonin
    secretion by the pineal gland", so the timing sense is within its scope;
    the more specific claim (advance rather than delay) is carried by
    preferred_term and description, as HPO has no direction-specific child.
environmental:
- name: Morning and Early-Day Light Exposure
  description: >-
    Light is the dominant zeitgeber, and its effect is direction-dependent via
    the phase-response curve. Disproportionate light exposure in the early
    morning - the phase-advance portion of the curve - reinforces and stabilizes
    an already-advanced clock. This is the environmental counterpart of the
    disorder's mechanism and the reason morning bright light is contraindicated
    in ASPS even though it is therapeutic in delayed sleep-wake phase disorder.
  effect: EXACERBATES
  evidence:
  - reference: PMID:21243069
    reference_title: "Therapeutics for Circadian Rhythm Sleep Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Light is the strongest entraining agent of circadian rhythms and timed
      exposure to bright light is often used in the treatment of circadian
      rhythm sleep disorders.
    explanation: >-
      Establishes light as the strongest entraining agent, whose timing
      determines the direction of the resulting phase shift.
- name: Insufficient Evening Light Exposure
  description: >-
    The converse exposure. Inadequate light in the evening removes the natural
    phase-delaying input that would otherwise oppose an advanced clock,
    allowing the advance to persist. Reduced evening activity and early
    retirement to a dark bedroom compound this, which is one reason the
    phenotype becomes more prominent after retirement and in institutionalized
    older adults.
  effect: EXACERBATES
  evidence:
  - reference: PMID:34493186
    reference_title: "Treatment of Circadian Rhythm Sleep-Wake Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      If an individual receives less light in the afternoon or evening, or is
      prematurely exposed to morning light following early awakening, the
      circadian rhythm can be advanced, leading to an increased risk of an
      early sleep phase
    explanation: >-
      Directly evidences both halves of the behavioral/environmental
      contribution - insufficient afternoon/evening light AND premature morning
      light exposure - as advancing the circadian rhythm and raising the risk of
      an early sleep phase. Note this also describes a self-reinforcing loop:
      early awakening leads to earlier light exposure, which further advances
      the clock.
  - reference: PMID:39864932
    reference_title: "Advanced sleep phase syndrome: Role of genetics and aging."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Age-related alterations in circadian rhythms are exacerbated and
      compounded by neurodegenerative disorders, impacting the suprachiasmatic
      nucleus (SCN), sensitivity to light, and light responsiveness in those
      affected.
    explanation: >-
      Adds the age-related dimension - impaired light sensitivity and
      responsiveness. Marked PARTIAL because it addresses reduced light
      responsiveness rather than reduced evening light exposure specifically.
- name: Rigid Conventional Social and Occupational Schedule
  description: >-
    A non-photic environmental determinant of whether an advanced chronotype
    becomes a disorder. An early clock is only impairing when the person is
    required to be awake and functional in the evening or asleep past their
    spontaneous wake time. Schedules that permit early sleep and early rising
    render the same biology asymptomatic - which is also why ASPS is
    under-ascertained.
  effect: EXACERBATES
  evidence:
  - reference: PMID:39864932
    reference_title: "Advanced sleep phase syndrome: Role of genetics and aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Advanced sleep phase (ASP) is seldom brought to medical attention because
      many individuals easily adapt to their early chronotype
    explanation: >-
      Supports that adaptability of the schedule determines whether the
      phenotype presents clinically at all.
clinical_trials:
- name: NCT00246454
  status: COMPLETED
  description: >-
    Completed observational study (Northwestern University) of circadian
    rhythms and sleep propensity in familial advanced and familial delayed
    sleep phase syndrome. The largest ASPS-specific human cohort in this
    evidence set; ASPS inclusion required morning-type preference and an
    advanced melatonin onset.
  evidence:
  - reference: clinicaltrials:NCT00246454
    supports: SUPPORT
    snippet: >-
      The purpose of this study is to determine the properties of circadian
      rhythms and sleep propensity in familial advanced and delayed sleep phase
      syndrome (DSPS).
    explanation: >-
      Directly establishes an ASPS-specific observational cohort characterizing
      circadian rhythms and sleep propensity in the familial form.
- name: NCT04690504
  status: COMPLETED
  description: >-
    Completed biomarker-validation study (Brigham and Women's Hospital)
    comparing single-sample plasma-proteomic and monocyte-transcript estimates
    of circadian phase against melatonin phase in patients with circadian
    rhythm sleep disorders. Relevant to ASPS because the practical barrier to
    diagnosis and to correctly timed light therapy is the burden of serial
    DLMO sampling.
  evidence:
  - reference: clinicaltrials:NCT04690504
    supports: SUPPORT
    snippet: >-
      The investigators aim to develop a method that can estimate individual
      circadian time with a single blood sample taken at any time of the day or
      night.
    explanation: >-
      Establishes the aim of replacing burdensome serial circadian phase
      sampling with a single-sample estimate, the key translational bottleneck
      for circadian rhythm sleep disorders including ASPS.
genetic:
- name: PER2
  notes: >-
    The original FASPS gene. The p.Ser662Gly (S662G) missense variant lies in
    the CK1epsilon-binding region and removes a CK1 phosphoacceptor serine,
    causing PER2 hypophosphorylation. Autosomal dominant with high penetrance
    in the index kindred. Linkage localized the trait to the telomeric region
    of chromosome 2q.
  gene_term:
    preferred_term: PER2
    term:
      id: hgnc:8846
      label: PER2
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:11232563
    reference_title: "An hPer2 phosphorylation site mutation in familial advanced sleep phase syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we report localization of the FASPS gene near the telomere of
      chromosome 2q. A strong candidate gene (hPer2), a human homolog of the
      period gene in Drosophila, maps to the same locus.
    explanation: >-
      Establishes PER2 as the FASPS gene by positional mapping to 2qter.
- name: CSNK1D
  notes: >-
    Encodes casein kinase I delta, the kinase that phosphorylates PER2. The
    p.Thr44Ala (T44A) missense variant reduces kinase activity and causes
    FASPS, phenocopying the PER2 substrate mutation.
  gene_term:
    preferred_term: CSNK1D
    term:
      id: hgnc:2452
      label: CSNK1D
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:15800623
    reference_title: "Functional consequences of a CKIdelta mutation causing familial advanced sleep phase syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We report here the identification of a missense mutation (T44A) in the
      human CKIdelta gene, which results in FASPS.
    explanation: Establishes CSNK1D T44A as causative for FASPS.
- name: CRY2
  notes: >-
    Encodes cryptochrome 2, a negative-limb repressor. The p.Ala260Thr (A260T)
    variant in the FAD-binding domain phosphate loop increases FBXL3-mediated
    degradation of CRY2 and co-segregated with FASP in one family.
  gene_term:
    preferred_term: CRY2
    term:
      id: hgnc:2385
      label: CRY2
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:27529127
    reference_title: "A Cryptochrome 2 mutation yields advanced sleep phase in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified a missense mutation in the human Cryptochrome 2 (CRY2) gene
      that co-segregates with FASP in one family.
    explanation: >-
      Establishes CRY2 A260T co-segregation with FASP. Note the evidence base
      is a single family.
- name: TIMELESS
  notes: >-
    Encodes the mammalian TIMELESS protein. A reported mutation prevents
    nuclear TIM accumulation and alters CRY2 affinity, causing FASP
    predominantly via altered photic entrainment rather than period shortening.
    Evidence rests on one small family plus a CRISPR mouse model.
  gene_term:
    preferred_term: TIMELESS
    term:
      id: hgnc:11813
      label: TIMELESS
  relationship_type: CAUSATIVE
  evidence:
  - reference: PMID:31138685
    reference_title: "TIMELESS mutation alters phase responsiveness and causes advanced sleep phase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here, we report a mutation in the human TIMELESS (hTIM) gene that causes
      familial advanced sleep phase (FASP).
    explanation: Establishes TIMELESS as a FASP gene.
- name: PER3
  notes: >-
    Encodes period circadian regulator 3. The P415A/H417R variant haplotype was
    reported in familial advanced sleep phase co-occurring with a seasonal mood
    trait; the variants destabilize PER3 and fail to stabilize PER1/PER2. The
    evidence is weaker than for PER2/CSNK1D - a single kindred with a
    two-variant haplotype and a compound phenotype - so PER3 is curated here as
    a contributory rather than definitively established ASPS gene.
  gene_term:
    preferred_term: PER3
    term:
      id: hgnc:8847
      label: PER3
  relationship_type: DISPUTED
  evidence:
  - reference: PMID:26903630
    reference_title: "A PERIOD3 variant causes a circadian phenotype and is associated with a seasonal mood trait."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified two rare variants in the circadian clock gene PERIOD3
      (PER3-P415A/H417R) in humans with familial advanced sleep phase
      accompanied by higher Beck Depression Inventory and seasonality scores.
    explanation: >-
      Supports a PER3 contribution but only partially, because the reported
      phenotype bundles advanced sleep phase with a mood/seasonality trait and
      derives from a single kindred.
inheritance:
- name: Autosomal dominant inheritance
  description: >-
    Familial ASPS segregates as an autosomal dominant trait with high
    penetrance. Penetrance across genes and families beyond the original
    kindreds is not well quantified and may be modified by age and light
    environment.
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  evidence:
  - reference: PMID:10470086
    reference_title: "Familial advanced sleep-phase syndrome: A short-period circadian rhythm variant in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The trait segregates as an autosomal dominant with high penetrance.
    explanation: >-
      Directly establishes autosomal dominant inheritance with high penetrance.
definitions:
- name: Advanced Sleep-Wake Phase Disorder Diagnostic Criteria (ICSD-3-aligned)
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    Consensus clinical criteria for advanced sleep-wake phase disorder. The
    defining requirements are (a) a stable advance of the major sleep episode
    relative to the desired or required sleep and wake times, (b) symptoms -
    evening sleepiness and/or early-morning awakening - present for at least
    three months, (c) improvement in sleep quality and duration when the
    individual is allowed to follow their own preferred early schedule, (d)
    objective corroboration by sleep diary plus actigraphy for at least seven
    and preferably fourteen days including both work and free days, and (e)
    exclusion of another sleep, medical, neurological, psychiatric,
    medication-related, or environmental explanation.
  criteria_sets:
  - name: Core clinical criteria
    description: >-
      Criteria that must be jointly satisfied to diagnose ASWPD rather than a
      non-disordered advanced chronotype.
    core_clinical_characteristics:
    - preferred_term: Advance of the major sleep episode relative to desired sleep-wake time
      term:
        id: HP:0031873
        label: Early chronotype
    - preferred_term: Evening sleepiness
      term:
        id: HP:0002329
        label: Drowsiness
    - preferred_term: Early-morning awakening with inability to return to sleep
      term:
        id: HP:0031356
        label: Terminal insomnia
    additional_requirements:
    - preferred_term: >-
        Sleep onset and wake times occur at least 2 hours earlier than the
        societal norm
    - preferred_term: Symptoms present for at least three months
    - preferred_term: >-
        Sleep quality and duration improve when following the self-selected
        early schedule
    - preferred_term: >-
        Sleep diary plus actigraphy for at least 7 (preferably 14) days,
        including work and free days
    exclusion_criteria:
    - preferred_term: >-
        Another sleep, medical, neurological, psychiatric, medication-related,
        or environmental explanation for the sleep timing
    evidence:
    - reference: PMID:34493186
      reference_title: "Treatment of Circadian Rhythm Sleep-Wake Disorders."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The main clinical manifestations are insomnia and excessive daytime
        sleepiness that often lead to clinically meaningful distress or cause
        mental, physical, social, occupational, educational, or other
        functional impairment.
      explanation: >-
        Supports the requirement that symptoms produce clinically meaningful
        distress or functional impairment, which is what distinguishes the
        disorder from a well-tolerated advanced chronotype.
    - reference: PMID:39864932
      reference_title: "Advanced sleep phase syndrome: Role of genetics and aging."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Advanced sleep-wake phase disorder (ASWPD) is characterized by a
        consistent and distressing anticipation of sleep-wake timing
      explanation: >-
        Supports the core criterion of a consistent (stable) and distressing
        advance of sleep-wake timing.
    - reference: PMID:34493186
      reference_title: "Treatment of Circadian Rhythm Sleep-Wake Disorders."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        2) symptoms are present for at least 3 months; 3) when patients are
        allowed to sleep in accordance with their internal biological clock,
        sleep quality and duration are improved with a consistent but advanced
        timing of the major sleep episode; 4) sleep logs and, whenever
        possible, actigraphy monitoring for at least 7 days (preferably 14
        days), including work/school days and free days, demonstrate a stable
        advance in the timing of the habitual sleep period; and 5) the sleep
        disturbance is not better explained by another current sleep disorder,
        medical or neurologic disorder, mental disorder, medication use, or
        substance use disorder.
      explanation: >-
        Verbatim statement of ICSD criteria 2-5, directly sourcing the numeric
        thresholds used in this criteria set (3 months; 7-14 days of sleep logs
        plus actigraphy) as well as the improvement-on-preferred-schedule
        requirement and the exclusion criterion.
    - reference: PMID:34493186
      reference_title: "Treatment of Circadian Rhythm Sleep-Wake Disorders."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        sleep onset and wake times usually occur at least 2 hours earlier than
        the societal norm compared with normal individuals
      explanation: >-
        Sources the >=2 hour advance threshold that quantifies criterion 1.
  evidence:
  - reference: PMID:34493186
    reference_title: "Treatment of Circadian Rhythm Sleep-Wake Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Sleep diaries, actigraphy, and determination of day and night phase
      markers (dim light melatonin onset and core body temperature minimum)
      have all become routine diagnostic methods for CRSWDs.
    explanation: >-
      Establishes the routine objective diagnostic measures required by the
      criteria set.
  notes: >-
    The distress/impairment requirement is what separates ASWPD (a disorder)
    from an extreme but well-tolerated advanced chronotype. Many people with a
    markedly advanced phase never meet criteria because they arrange their
    lives around it.

    PROVENANCE: every numeric threshold in this criteria set is now sourced to
    a verbatim quotation. PMID:34493186 restates the five ICSD criteria in full
    ("The diagnosis of ASWPD requires that the following five main criteria are
    met") and separately gives the >=2 hour advance threshold. The definition is
    named "ICSD-3-aligned" because the criteria are quoted from a review
    restating them rather than from the ICSD-3 manual itself, which is not
    PubMed-indexed and therefore not citable under the project's snippet rules.
- name: Dim Light Melatonin Onset (DLMO) Phase Assessment
  definition_type: OTHER
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    The reference measurement protocol for objectively locating circadian
    phase. Serial salivary or plasma melatonin samples are collected under
    dim-light conditions over several hours before habitual bedtime, and DLMO
    is the clock time at which melatonin rises above a defined assay threshold.
    In ASPS, DLMO occurs abnormally early. Core body temperature minimum is an
    equivalent phase marker. DLMO is what converts a patient report of early
    sleep into a demonstrated circadian phase advance, and it is what allows
    light therapy to be timed on the correct side of the phase-response curve -
    which is why it is a treatment-enabling measurement, not merely a
    confirmatory one.
  notes: >-
    Typed as OTHER rather than PHENOTYPE_ALGORITHM: this is a laboratory
    phase-assessment protocol, not a computable EHR/OMOP case-finding query,
    which is what PHENOTYPE_ALGORITHM denotes in this schema. No
    `validation_status` is asserted, because DLMO IS the reference standard for
    circadian phase - it is the comparator against which candidate biomarkers
    are validated, so it cannot coherently be marked
    VALIDATED_AGAINST_GOLD_STANDARD against itself. A specific numeric
    salivary-melatonin threshold is deliberately not stated here; thresholds
    are assay- and laboratory-dependent and no cached source states one
    verbatim. See also the parallel `diagnosis` entry, which records DLMO as a
    diagnostic test; this entry records the measurement definition.
  evidence:
  - reference: clinicaltrials:NCT04690504
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      circadian phase estimates from the biomarker panels will be compared with
      those derived from plasma or saliva melatonin (the current "gold-standard"
      circadian phase marker)
    explanation: >-
      Establishes plasma/saliva melatonin phase as the current gold-standard
      circadian phase marker - the reason no separate validation status is
      asserted for DLMO itself.
  - reference: clinicaltrials:NCT04690504
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Current methods for assessing circadian timing require sampling over
      hours (or even up to a day) while the patient is in controlled
      conditions.
    explanation: >-
      Documents the serial-sampling-under-controlled-conditions burden that
      defines the DLMO protocol and motivates ongoing biomarker development.
  - reference: PMID:10470086
    reference_title: "Familial advanced sleep-phase syndrome: A short-period circadian rhythm variant in humans."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Here we describe three kindreds with a profound phase advance of the
      sleep-wake, melatonin and temperature rhythms associated with a very
      short tau.
    explanation: >-
      Demonstrates that the melatonin and temperature phase markers are
      advanced in ASPS, which is what DLMO assessment detects.
diagnosis:
- name: Sleep diary and actigraphy
  description: >-
    Concurrent sleep diary and wrist actigraphy for at least seven (preferably
    fourteen) consecutive days, spanning both work and free days, to document
    that the advance of sleep timing is stable and habitual rather than
    situational.
  diagnosis_term:
    preferred_term: actigraphy
    term:
      id: NCIT:C180883
      label: Actigraphy
  evidence:
  - reference: PMID:34493186
    reference_title: "Treatment of Circadian Rhythm Sleep-Wake Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Sleep diaries, actigraphy, and determination of day and night phase
      markers (dim light melatonin onset and core body temperature minimum)
      have all become routine diagnostic methods for CRSWDs.
    explanation: >-
      Establishes sleep diaries and actigraphy as routine diagnostic methods
      for circadian rhythm sleep-wake disorders.
- name: Dim light melatonin onset (DLMO)
  description: >-
    Serial melatonin sampling under dim light to establish that the endogenous
    circadian phase - not merely the behavioral schedule - is advanced. Also
    required to time light therapy correctly relative to the phase-response
    curve.
  evidence:
  - reference: PMID:34493186
    reference_title: "Treatment of Circadian Rhythm Sleep-Wake Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      determination of day and night phase markers (dim light melatonin onset
      and core body temperature minimum) have all become routine diagnostic
      methods for CRSWDs
    explanation: >-
      Establishes DLMO as a routine circadian phase marker in the diagnostic
      workup.
- name: Circadian clock gene panel or exome/genome sequencing
  description: >-
    Molecular testing is appropriate for a strongly familial, extreme,
    early-onset phenotype, and should cover the five reported ASPS genes -
    PER2, CSNK1D, CRY2, PER3, and TIMELESS. Sequence analysis (panel or
    exome/genome) is the relevant modality; karyotype, chromosomal microarray,
    mitochondrial sequencing, and repeat-expansion testing have no routine
    indication. Interpretation must be cautious: segregation, population
    frequency, functional data, and ACMG/AMP classification are all required,
    because several of these gene-disease relationships rest on single
    kindreds. Cascade testing is reasonable only once a pathogenic or likely
    pathogenic familial variant is established, and predictive testing of
    asymptomatic minors warrants counselling because an early chronotype may
    never cause disorder-level impairment.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:39864932
    reference_title: "Advanced sleep phase syndrome: Role of genetics and aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Autosomal dominant mutations in circadian clock genes like PER2, CK1,
      PER3, CRY2, TIMELESS, and DEC2 have been linked to FASP
    explanation: >-
      Establishes the gene set that a circadian-clock panel should cover in
      suspected familial advanced sleep phase.
- name: Polysomnography to exclude comorbid sleep disorders
  description: >-
    Polysomnography is not required to diagnose ASPS and does not itself
    demonstrate circadian phase. It is used to exclude comorbid conditions -
    most importantly obstructive sleep apnea, which is frequently the reason an
    individual with unrecognized advanced sleep phase presents to a sleep
    clinic in the first place.
  diagnosis_term:
    preferred_term: polysomnography
    term:
      id: NCIT:C114185
      label: Polysomnography
  evidence:
  - reference: PMID:39864932
    reference_title: "Advanced sleep phase syndrome: Role of genetics and aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      is mostly discovered coincidentally in the presence of other sleep
      disorders, mainly obstructive sleep apnea syndrome (OSAS)
    explanation: >-
      Supports the role of a sleep-disorder workup, since FASP is typically
      discovered incidentally during evaluation for obstructive sleep apnea.
differential_diagnoses:
- name: Delayed Sleep-Wake Phase Disorder
  description: >-
    The mirror-image intrinsic circadian rhythm sleep-wake disorder, and by far
    the more commonly diagnosed of the two. Both are disorders of sleep timing
    with normal sleep when the preferred schedule is followed, and they share
    almost all of their clinical vocabulary - which is precisely why the
    literatures are easy to conflate. The direction of the phase shift is
    opposite and so is the treatment: DSWPD is treated with morning light and
    evening melatonin to advance the clock, ASPS with evening light to delay
    it. Applying DSWPD treatment to ASPS would worsen it.
  disease_term:
    preferred_term: circadian rhythm sleep disorder, delayed sleep phase type
    term:
      id: MONDO:0024377
      label: circadian rhythm sleep disorder, delayed sleep phase type
  distinguishing_features:
  - Sleep onset and offset are late (typically 02:00-06:00 onset) rather than early
  - Presenting complaint is sleep-onset insomnia and difficulty awakening in the morning, rather than evening sleepiness and early-morning awakening
  - Dim light melatonin onset (DLMO) is late rather than early
  - Onset is predominantly in adolescence rather than in early adulthood or with aging
  - Treatment direction is opposite - morning light and evening melatonin, versus evening light for ASPS
  evidence:
  - reference: PMID:26414986
    reference_title: "Clinical Practice Guideline for the Treatment of Intrinsic Circadian Rhythm Sleep-Wake Disorders: Advanced Sleep-Wake Phase Disorder (ASWPD), Delayed Sleep-Wake Phase Disorder (DSWPD), Non-24-Hour Sleep-Wake Rhythm Disorder (N24SWD), and Irregular Sleep-Wake Rhythm Disorder (ISWRD). An Update for 2015: An American Academy of Sleep Medicine Clinical Practice Guideline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      strategically timed melatonin (for the treatment of DSWPD, blind adults
      with N24SWD, and children/ adolescents with ISWRD and comorbid
      neurological disorders), and light therapy with or without accompanying
      behavioral interventions (adults with ASWPD, children/adolescents with
      DSWPD, and elderly with dementia)
    explanation: >-
      Shows that AASM issues DIFFERENT treatment recommendations for ASWPD
      (light therapy) and DSWPD (melatonin, plus light therapy only in
      children/adolescents) - concrete evidence that the two disorders are
      distinct and are not managed interchangeably.
- name: Non-24-Hour Sleep-Wake Rhythm Disorder
  description: >-
    A circadian disorder in which the clock fails to entrain to the 24-hour day
    at all, so sleep timing drifts progressively later (or, rarely, earlier)
    day after day. Most common in totally blind individuals lacking photic
    input.
  disease_term:
    preferred_term: non-24-hour sleep-wake syndrome
    term:
      id: MONDO:0019137
      label: non-24-hour sleep-wake syndrome
  distinguishing_features:
  - Sleep timing progressively drifts rather than being stably advanced
  - Symptoms cycle between asymptomatic and symptomatic periods as the endogenous rhythm moves in and out of alignment
  - Actigraphy over several weeks shows a characteristic staircase pattern rather than a fixed early schedule
  - Strongly associated with total blindness and absent photic input
  evidence:
  - reference: PMID:26414986
    reference_title: "Clinical Practice Guideline for the Treatment of Intrinsic Circadian Rhythm Sleep-Wake Disorders: Advanced Sleep-Wake Phase Disorder (ASWPD), Delayed Sleep-Wake Phase Disorder (DSWPD), Non-24-Hour Sleep-Wake Rhythm Disorder (N24SWD), and Irregular Sleep-Wake Rhythm Disorder (ISWRD). An Update for 2015: An American Academy of Sleep Medicine Clinical Practice Guideline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      strategically timed melatonin (for the treatment of DSWPD, blind adults
      with N24SWD, and children/ adolescents with ISWRD and comorbid
      neurological disorders)
    explanation: >-
      Confirms N24SWD as a separate intrinsic circadian disorder with its own
      (melatonin-based, blindness-associated) treatment recommendation,
      distinct from ASWPD.
- name: Major Depressive Disorder with Early-Morning Awakening
  description: >-
    A clinically important differential in the opposite direction - terminal
    insomnia is a classic melancholic feature of major depression, and an ASPS
    patient reporting that they always wake at 4 a.m. is readily misread as
    depressed. Conversely, a depressed patient may be misclassified as having a
    circadian disorder. Getting this wrong matters because the treatments
    diverge completely, and because PER3-associated FASP is itself reported
    alongside elevated depression and seasonality scores, so the two can
    genuinely co-occur.
  disease_term:
    preferred_term: major depressive disorder
    term:
      id: MONDO:0002009
      label: major depressive disorder
  distinguishing_features:
  - Evening sleepiness is absent in depression; sleep onset is often delayed or unimpaired rather than involuntarily early
  - Sleep is nonrestorative in depression, whereas in ASPS it is restorative when taken at the preferred early hours
  - The whole circadian ensemble need not be phase-advanced in depression; DLMO is typically normal
  - Core depressive symptoms (anhedonia, low mood, guilt, appetite and psychomotor change) are present in depression and typically absent in ASPS
  evidence:
  - reference: PMID:26903630
    reference_title: "A PERIOD3 variant causes a circadian phenotype and is associated with a seasonal mood trait."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified two rare variants in the circadian clock gene PERIOD3
      (PER3-P415A/H417R) in humans with familial advanced sleep phase
      accompanied by higher Beck Depression Inventory and seasonality scores.
    explanation: >-
      Documents genuine co-occurrence of familial advanced sleep phase with
      depression scores, showing why the depression differential is both
      important and not always exclusive.
- name: Insomnia Disorder
  description: >-
    Chronic insomnia is the most frequent misdiagnosis in ASPS, because the
    early-morning awakening is reported as terminal insomnia. This
    misclassification commonly leads to hypnotic prescription, which suppresses
    the symptom without correcting circadian phase and carries particular risk
    (falls, confusion, next-day impairment) in the older adults in whom
    advanced phase is most prevalent.
  disease_term:
    preferred_term: insomnia
    term:
      id: MONDO:0013600
      label: insomnia
  distinguishing_features:
  - In insomnia disorder sleep is poor regardless of when it is attempted; in ASPS sleep is normal once permitted at the advanced biological time
  - Sleep-onset latency is prolonged even at the preferred bedtime in insomnia disorder, but short in ASPS
  - A sleep diary showing consistently early, consolidated, restorative sleep on free days discriminates the two
  evidence:
  - reference: PMID:34493186
    reference_title: "Treatment of Circadian Rhythm Sleep-Wake Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      CRSWDs are easily mistaken for insomnia or early waking up, resulting in
      inappropriate treatment.
    explanation: >-
      Directly documents that circadian rhythm sleep-wake disorders are
      commonly misdiagnosed as insomnia, with inappropriate treatment as the
      consequence.
- name: Obstructive Sleep Apnea Syndrome
  description: >-
    Not a mimic so much as a confounder and frequent companion. Familial
    advanced sleep phase is most often discovered incidentally during
    evaluation for obstructive sleep apnea, and OSA independently causes
    fragmented sleep and daytime sleepiness that can obscure or be attributed
    to the circadian abnormality.
  disease_term:
    preferred_term: obstructive sleep apnea syndrome
    term:
      id: MONDO:0007147
      label: obstructive sleep apnea syndrome
  distinguishing_features:
  - OSA produces snoring, witnessed apneas, and sleep fragmentation with non-restorative sleep at any schedule
  - OSA is confirmed by polysomnography and does not shift circadian phase markers
  - The two frequently coexist, so identifying OSA does not exclude ASPS
  evidence:
  - reference: PMID:39864932
    reference_title: "Advanced sleep phase syndrome: Role of genetics and aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      is mostly discovered coincidentally in the presence of other sleep
      disorders, mainly obstructive sleep apnea syndrome (OSAS)
    explanation: >-
      Establishes OSA as the usual clinical context in which familial advanced
      sleep phase comes to attention.
treatments:
- name: Timed Evening Bright Light Therapy
  description: >-
    The principal evidence-based treatment. Bright light delivered in the
    evening falls on the phase-delay portion of the human phase-response curve
    and pushes the advanced clock later. Phototherapy for ASWPD is usually
    given between 19:00 and 21:00, and the recommended dose to achieve a phase
    delay is at least 5,000 lux for 2 hours at night. The AASM 2015 guideline
    gives light therapy positive endorsement, at a second-tier degree of
    confidence, for adults with ASWPD, and the AASM guideline is summarized in
    the review literature as recommending night bright light therapy for ASWPD
    specifically.

    Tolerability is the main practical limitation: multiple studies report that
    elderly patients exposed to bright light at night could not tolerate it,
    resulting in poor compliance, and one comparison found better compliance
    (and symptom improvement) with dim rather than enhanced-intensity evening
    light. Side effects are otherwise minimal (eye fatigue, nausea,
    restlessness, headache) and usually self-limiting.

    DIRECTION IS CRITICAL. The same intervention mistimed does harm - morning
    bright light falls on the phase-advance portion of the curve and would
    further advance an already-advanced clock, worsening the disorder. Correct
    timing therefore depends on knowing circadian phase (DLMO or core body
    temperature minimum), not merely clock time. Tolerance of prolonged evening
    light can be poor in older adults, the group in whom ASPS is most common.
  treatment_term:
    preferred_term: bright white light therapy
    term:
      id: NCIT:C174524
      label: Bright White Light Therapy
  therapeutic_modality: DEVICE
  target_mechanisms:
  - target: Altered Photic Entrainment of the Circadian Pacemaker
    treatment_effect: MODULATES
    description: >-
      Evening light exploits the delay portion of the phase-response curve to
      shift the entrained phase later, counteracting the advance.
  evidence:
  - reference: PMID:26414986
    reference_title: "Clinical Practice Guideline for the Treatment of Intrinsic Circadian Rhythm Sleep-Wake Disorders: Advanced Sleep-Wake Phase Disorder (ASWPD), Delayed Sleep-Wake Phase Disorder (DSWPD), Non-24-Hour Sleep-Wake Rhythm Disorder (N24SWD), and Irregular Sleep-Wake Rhythm Disorder (ISWRD). An Update for 2015: An American Academy of Sleep Medicine Clinical Practice Guideline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      light therapy with or without accompanying behavioral interventions
      (adults with ASWPD, children/adolescents with DSWPD, and elderly with
      dementia)
    explanation: >-
      AASM guideline gives light therapy (with or without behavioral
      interventions) positive second-tier endorsement specifically for adults
      with ASWPD.
  - reference: PMID:21243069
    reference_title: "Therapeutics for Circadian Rhythm Sleep Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Light is the strongest entraining agent of circadian rhythms and timed
      exposure to bright light is often used in the treatment of circadian
      rhythm sleep disorders.
    explanation: >-
      Supports timed bright light as the principal entraining intervention for
      circadian rhythm sleep disorders.
  - reference: PMID:34493186
    reference_title: "Treatment of Circadian Rhythm Sleep-Wake Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Phototherapy is usually performed between 19:00~21:00 hours, which can
      improve sleep efficiency and delay the circadian rhythm
    explanation: >-
      Provides the specific EVENING timing window (19:00-21:00) and confirms
      the intended direction of effect is a circadian DELAY - the direction
      that corrects an advanced phase.
  - reference: PMID:34493186
    reference_title: "Treatment of Circadian Rhythm Sleep-Wake Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      To delay the circadian rhythm time, it is recommended that individuals
      are exposed to at least 5,000 lux of bright light at night for 2 hours
    explanation: >-
      Provides the recommended light dose (>=5,000 lux) and duration (2 hours,
      at night) for achieving the phase delay required in ASWPD.
  - reference: PMID:34493186
    reference_title: "Treatment of Circadian Rhythm Sleep-Wake Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The latest AASM guideline recommends the use of night bright light
      therapy in the treatment of ASWPD
    explanation: >-
      Independent review-level confirmation that the AASM recommendation for
      ASWPD is specifically for NIGHT (evening) bright light.
  - reference: PMID:34493186
    reference_title: "Treatment of Circadian Rhythm Sleep-Wake Disorders."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Multiple studies have shown that the circadian rhythm phase is delayed in
      elderly patients exposed to bright light at night; however, these
      patients reported that they could not tolerate light, which resulted in
      poor compliance
    explanation: >-
      Documents both efficacy (phase delay in elderly patients) and the key
      practical limitation (intolerance and poor compliance). Marked PARTIAL
      because it simultaneously supports and qualifies the treatment.
  notes: >-
    Strength of recommendation should not be overstated. The AASM 2015
    recommendation for light therapy in adult ASWPD is graded WEAK FOR on
    VERY LOW quality evidence: the single randomized ASWPD trial identified by
    the AASM systematic review was small (47 participants, mean age 70) and
    used relatively dim evening light (~265 lux), and it did not find a
    significant post-treatment group difference. Reported side effects of
    phototherapy (eye fatigue, nausea, restlessness, headaches) are minimal and
    usually resolve spontaneously.
- name: Strategically Timed Melatonin
  description: >-
    Exogenous melatonin shifts circadian phase according to a phase-response
    curve that is approximately the inverse of the light PRC - melatonin taken
    in the morning delays the clock, whereas melatonin taken in the evening
    advances it. For ASPS the theoretically correct direction is therefore
    MORNING melatonin to produce a phase delay, the exact opposite of the
    evening dosing used in delayed sleep-wake phase disorder. Evening melatonin
    would advance the clock further and is expected to worsen ASPS.

    This treatment is included because review-level literature reports timed
    melatonin as useful across circadian rhythm sleep disorders including
    advanced sleep phase, but it must be flagged that the AASM 2015 guideline
    did NOT endorse melatonin for ASWPD - its melatonin endorsement was
    restricted to DSWPD, blind adults with N24SWD, and children/adolescents
    with ISWRD. Morning dosing also risks residual daytime sleepiness.
    Melatonin for ASPS should therefore be regarded as mechanistically rational
    but not guideline-supported.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: melatonin
      term:
        id: CHEBI:16796
        label: melatonin
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Advanced Circadian Phase of Melatonin, Temperature and Sleep Propensity
    treatment_effect: MODULATES
    description: >-
      Morning-timed exogenous melatonin acts on the melatonin phase-response
      curve to delay the advanced circadian phase.
  evidence:
  - reference: PMID:21243069
    reference_title: "Therapeutics for Circadian Rhythm Sleep Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In addition, timed administration of melatonin, either alone or in
      combination with light therapy has been shown to be useful in the
      treatment of the following circadian rhythm sleep disorders: delayed
      sleep phase, advanced sleep phase, free-running, irregular sleep wake,
      jet lag and shift work.
    explanation: >-
      Review-level support for timed melatonin, explicitly naming advanced
      sleep phase among the circadian disorders in which it is useful.
  - reference: PMID:34493186
    reference_title: "Treatment of Circadian Rhythm Sleep-Wake Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      According to the melatonin PRC, to delay the circadian rhythm phase of
      ASWPD, melatonin should be given in the early morning.
    explanation: >-
      Directly evidences the DIRECTION of melatonin dosing for ASWPD - EARLY
      MORNING to produce a phase delay. This is the opposite of the evening
      dosing used in delayed sleep-wake phase disorder, and getting it backwards
      would worsen the disorder.
  - reference: PMID:34493186
    reference_title: "Treatment of Circadian Rhythm Sleep-Wake Disorders."
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      However, there is a lack of clinical data and information regarding the
      safety and effectiveness of melatonin
    explanation: >-
      Explicitly records the absence of clinical safety/efficacy data for
      melatonin in ASWPD, refuting any reading of this treatment as
      established rather than merely mechanistically rational.
  - reference: PMID:34493186
    reference_title: "Treatment of Circadian Rhythm Sleep-Wake Disorders."
    supports: REFUTE
    evidence_source: OTHER
    snippet: >-
      In addition, melatonin has a sedative and hypnotic effect, so taking
      melatonin in the morning may make it difficult to stay awake, making it
      more difficult for individuals to stick to the scheduled sleep and
      wake-up times
    explanation: >-
      Documents the specific harm of the mechanistically-indicated morning
      dosing - daytime sedation undermining the very schedule the treatment is
      meant to establish. A concrete argument against routine use.
  - reference: PMID:26414986
    reference_title: "Clinical Practice Guideline for the Treatment of Intrinsic Circadian Rhythm Sleep-Wake Disorders: Advanced Sleep-Wake Phase Disorder (ASWPD), Delayed Sleep-Wake Phase Disorder (DSWPD), Non-24-Hour Sleep-Wake Rhythm Disorder (N24SWD), and Irregular Sleep-Wake Rhythm Disorder (ISWRD). An Update for 2015: An American Academy of Sleep Medicine Clinical Practice Guideline."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No recommendations were provided for remaining treatments/ populations,
      due to either insufficient or absent data.
    explanation: >-
      Melatonin for ASWPD falls among the treatment/population combinations for
      which the AASM guideline could make no recommendation, in contrast to its
      positive melatonin endorsement for DSWPD, N24SWD, and ISWRD. Recorded as
      NO_EVIDENCE to keep the guideline gap explicit rather than implying
      endorsement.
- name: Schedule Accommodation and Sleep Scheduling
  description: >-
    Where occupational and social circumstances permit, the simplest and often
    the most effective management is to accommodate the early schedule rather
    than fight it, since sleep is normal when taken at the biologically
    preferred time. Where a delay is required, a prescribed and consistently
    maintained later sleep-wake schedule may be attempted, typically alongside
    evening light. The AASM guideline made no recommendation on prescribed
    sleep scheduling or timed exercise for ASWPD because the evidence was
    insufficient.

    Health education and behavioral guidance for ASWPD explicitly includes
    AVOIDANCE OF BRIGHT LIGHT IN THE MORNING - the direction-critical negative
    instruction, since morning light sits on the phase-advance limb of the PRC
    and would worsen the disorder - alongside a midday nap, postponing bedtime,
    physical activity, and walking outdoors in the evening under bright light.
    Chronotherapy for ASWPD delays sleep onset progressively (by 3 hours every
    2 days) until the desired later bedtime is reached; a single case
    maintained a 23:00 bedtime at 5-month follow-up.
  treatment_term:
    preferred_term: behavioral and educational intervention
    term:
      id: NCIT:C63474
      label: Behavioral, Psychological or Informational Intervention
  therapeutic_modality: BEHAVIORAL
  target_mechanisms:
  - target: Circadian Misalignment with Conventional Social Schedule
    treatment_effect: MODULATES
    description: >-
      Aligning social demands with biological time removes the misalignment
      that generates morbidity, without altering the underlying clock.
  evidence:
  - reference: PMID:26414986
    reference_title: "Clinical Practice Guideline for the Treatment of Intrinsic Circadian Rhythm Sleep-Wake Disorders: Advanced Sleep-Wake Phase Disorder (ASWPD), Delayed Sleep-Wake Phase Disorder (DSWPD), Non-24-Hour Sleep-Wake Rhythm Disorder (N24SWD), and Irregular Sleep-Wake Rhythm Disorder (ISWRD). An Update for 2015: An American Academy of Sleep Medicine Clinical Practice Guideline."
    supports: NO_EVIDENCE
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      No recommendations were provided for remaining treatments/ populations,
      due to either insufficient or absent data.
    explanation: >-
      Prescribed sleep scheduling and timed exercise for ASWPD are among the
      treatment/population combinations for which the AASM guideline could make
      no recommendation.
  - reference: PMID:34493186
    reference_title: "Treatment of Circadian Rhythm Sleep-Wake Disorders."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Health education and behavioral guidance can be given to patients,
      including the avoidance of bright light in the morning, taking a nap at
      noon, trying to postpone bedtime at night, performing physical
      activities, and walking in the evening under bright light.
    explanation: >-
      Directly evidences the behavioral package for ASWPD, including the
      direction-critical instruction to AVOID morning bright light - the
      negative counterpart of evening light therapy.
  - reference: PMID:34493186
    reference_title: "Treatment of Circadian Rhythm Sleep-Wake Disorders."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the sleep onset time is delayed by 3 hours every 2 days until the sleep
      time is consistent with the desired later bedtime
    explanation: >-
      Gives the chronotherapy schedule specific to ASWPD (progressive DELAY,
      the opposite direction from DSWPD chronotherapy). Marked PARTIAL because
      the supporting clinical evidence is a single case report.
  - reference: PMID:34493186
    reference_title: "Treatment of Circadian Rhythm Sleep-Wake Disorders."
    supports: NO_EVIDENCE
    evidence_source: OTHER
    snippet: >-
      In addition, no study has assessed the use of hypnotic drugs and CBT as
      adjuvant therapy for ASWPD.
    explanation: >-
      Records the explicit evidence gap for hypnotics and CBT in ASWPD -
      relevant because hypnotics are what patients misdiagnosed with insomnia
      commonly receive.
prevalence:
- population: North American sleep clinic patients
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_5_PER_10000
  rate_per_100000: 40.0
  notes: >-
    Advanced sleep-wake phase disorder (ASWPD, i.e. meeting disorder criteria)
    in 2422 consecutive new sleep-clinic patients - at least 0.04%, or about 1
    in 2500. Clinic-based, so not a general-population estimate.
  evidence:
  - reference: PMID:31384946
    reference_title: "Extreme morning chronotypes are often familial and not exceedingly rare: the estimated prevalence of advanced sleep phase, familial advanced sleep phase, and advanced sleep-wake phase disorder in a sleep clinic population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our results demonstrate an ASP prevalence of 0.33%, an FASP prevalence of
      0.21%, and an ASWPD prevalence of at least 0.04%.
    explanation: >-
      Provides the ASWPD prevalence estimate in a sleep clinic population.
- population: North American sleep clinic patients (familial advanced sleep phase)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 210.0
  notes: >-
    Familial advanced sleep phase (FASP) prevalence of 0.21% (about 1 in 475)
    among 2422 new sleep-clinic patients. A 2025 review gives a concordant
    range of 0.21%-0.5%.
  evidence:
  - reference: PMID:31384946
    reference_title: "Extreme morning chronotypes are often familial and not exceedingly rare: the estimated prevalence of advanced sleep phase, familial advanced sleep phase, and advanced sleep-wake phase disorder in a sleep clinic population."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Among patients presenting to a sleep clinic, conservatively 1 out of
      every 300 patients will have ASP, 1 out of every 475 will have FASP, and
      1 out of every 2500 will have ASWPD.
    explanation: >-
      Gives the FASP rate of 1 in 475 (0.21%) in a sleep clinic population.
  - reference: PMID:39864932
    reference_title: "Advanced sleep phase syndrome: Role of genetics and aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The prevalence of FASP is currently estimated to be between 0.21% and
      0.5%.
    explanation: >-
      Independent review-level confirmation of the FASP prevalence range.
- population: Middle-aged adults
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 1000.0
  notes: >-
    Review estimate that advanced sleep-wake phase disorder affects almost 1%
    of middle-aged individuals. Substantially higher than the sleep-clinic
    ASWPD figure; reflects differing ascertainment and criteria, and should be
    read as an upper-bound community estimate.
  evidence:
  - reference: PMID:39864932
    reference_title: "Advanced sleep phase syndrome: Role of genetics and aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Advanced sleep-wake phase disorder (ASWPD) is characterized by a
      consistent and distressing anticipation of sleep-wake timing, affecting
      almost 1% of middle-aged individuals.
    explanation: >-
      Provides the community-level ASWPD prevalence estimate in middle-aged
      adults.
notes: >-
  Ascertainment and nomenclature caveats. (1) ASPS is systematically
  under-diagnosed relative to delayed sleep-wake phase disorder. Early rising
  is socially tolerated and often admired, so affected individuals seldom seek
  care; familial cases are typically found incidentally during evaluation for
  another sleep disorder, usually obstructive sleep apnea. The prevalence
  figures above are correspondingly likely to be underestimates of the
  underlying phenotype, though not necessarily of the impairing disorder.
  (2) Three overlapping entities are frequently conflated in the literature and
  should be kept distinct - advanced sleep phase (ASP, an extreme morning
  chronotype), familial advanced sleep phase (FASP, the heritable form), and
  advanced sleep-wake phase disorder (ASWPD, the subset causing distress or
  functional impairment). Only the last is a disorder by ICSD criteria.
  (3) The MONDO concept MONDO:0015609 is classified as a hereditary disease and
  carries FASPS synonyms, so it maps most precisely onto the familial subtype;
  the sporadic/age-related subtype is curated here for clinical completeness
  and differential-diagnostic value.
  (4) No `biochemical:` section is curated. The reference circadian biomarker
  (dim light melatonin onset) is instead carried by the
  `Advanced Melatonin Secretion Phase` phenotype (HP:0012689, whose definition
  covers timing as well as amount), by the `diagnosis` DLMO entry, and by the
  DLMO `definitions` entry. A `biochemical:` entry would require an NCIT
  biomarker term for melatonin measurement reachable from NCIT:C16342; no such
  term was verified, and rather than bind a plausible-but-unchecked identifier
  the section is deliberately deferred. The sibling entry
  Delayed_Sleep_Phase_Syndrome likewise has no `biochemical:` section.
  (5) Obstructive sleep apnea is curated under `differential_diagnoses` as a
  confounder/companion rather than as a comorbidity, because `comorbidities` is
  not a slot on the Disease class in this schema - comorbidity pairs are
  modelled as separate entities under `kb/comorbidities/`. An
  ASPS-OSA comorbidity entry would be a reasonable follow-up.
  (6) DEC2 (BHLHE41) is named alongside the FASP genes in review literature,
  but its best-established human phenotype is familial natural short sleep -
  short sleep duration - rather than phase advance. It is deliberately excluded
  from the genetic section here, since ASPS is defined by normal sleep duration
  at an advanced phase.
classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
    evidence:
    - reference: PMID:34493186
      reference_title: "Treatment of Circadian Rhythm Sleep-Wake Disorders."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Circadian rhythm sleep-wake disorders (CRSWDs) are a distinct class of
        sleep disorders caused by alterations to the circadian time-keeping
        system, its entrainment mechanisms, or a mismatch between the
        endogenous circadian rhythm and the external environment.
      explanation: >-
        Supports classification as a nervous-system proxy in the current
        schema, which lacks a dedicated sleep/circadian Harrison chapter. Kept
        consistent with the sibling entry Delayed_Sleep_Phase_Syndrome, which
        uses the same NEUROLOGIC assignment and the same rationale.

  evidence:
  - reference: PMID:39864932
    reference_title: "Advanced sleep phase syndrome: Role of genetics and aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Age-related alterations in circadian rhythms are exacerbated and
      compounded by neurodegenerative disorders, impacting the suprachiasmatic
      nucleus (SCN), sensitivity to light, and light responsiveness in those
      affected.
    explanation: >-
      Directly identifies the SCN as the anatomical substrate of the
      age-related arm, and names neurodegenerative disease as an exacerbating
      factor.
  - reference: PMID:34493186
    reference_title: "Treatment of Circadian Rhythm Sleep-Wake Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A large survey of a middle-aged and elderly population (40~64 years old)
      showed that the prevalence of ASWPD was approximately 1%, and increased
      with age; however, no gender differences were found
    explanation: >-
      Establishes the age-dependence of ASWPD prevalence, the epidemiological
      signature of this non-Mendelian arm.
  notes: >-
    The direction of the association between ASWPD and cognitive decline is
    NOT settled. PMID:39864932 reports "Conflicting data has surfaced regarding
    the protective or detrimental effects of ASWPD in studies on aging, mild
    cognitive impairment (MCI), and diverse dementia conditions." This node
    therefore models age/neurodegeneration as an upstream contributor to
    advanced phase, and deliberately does NOT assert a downstream effect of
    advanced phase on cognition.
- name: Reduced Photic Sensitivity and Light Responsiveness
  description: >-
    The mediating step of the sporadic/age-related arm. Ageing reduces both the
    sensitivity of the circadian system to light and its responsiveness to it -
    through the SCN and its input pathway - so the daily zeitgeber signal that
    normally holds the clock at the correct phase is weakened. A weakened
    entraining signal is less able to oppose a drift toward earlier timing, and
    it also blunts the response to the evening light used therapeutically,
    which is part of why light therapy is harder to deliver effectively in
    exactly the older population in which this arm predominates.

    A behavioral positive-feedback loop compounds this: early awakening leads
    to premature morning light exposure, which falls on the phase-advance limb
    of the phase-response curve and advances the clock further.

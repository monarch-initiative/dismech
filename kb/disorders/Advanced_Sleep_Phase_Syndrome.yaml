- name: TIMELESS Nuclear Exclusion
  description: >-
    A mutation in human TIMELESS (hTIM) prevents TIM from accumulating in the
    nucleus and alters its affinity for CRY2, destabilizing the PER/CRY complex
    and weakening repression of CLOCK-BMAL1. Notably, this variant produces
    advanced sleep phase primarily by altering photic entrainment rather than
    by shortening the organismal period: CRISPR mutant mice show advanced sleep
    phase with altered photic entrainment but a normal circadian period, even
    though period shortening is seen in mutant fibroblasts. What distinguishes
    TIMELESS from the other FASPS lesions is specifically the NORMAL organismal
    period - entrainment involvement as such is not unique to it, since the
    CRY2 A260T variant also shows a reduced phase-shift to early-night light
    while additionally shortening period.
  biological_scale: MOLECULAR
  role: mediator

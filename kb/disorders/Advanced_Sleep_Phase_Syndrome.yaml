    reference_title: "An hPer2 phosphorylation site mutation in familial advanced sleep phase syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Affected individuals have a serine to glycine mutation within the casein
      kinase Iepsilon (CKIepsilon) binding region of hPER2
    explanation: >-
      Human genetic finding - establishes the serine-to-glycine substitution in
      the CK1epsilon binding region of hPER2 in affected individuals.
  - reference: PMID:11232563
    reference_title: "An hPer2 phosphorylation site mutation in familial advanced sleep phase syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      which causes hypophosphorylation by CKIepsilon in vitro
    explanation: >-
      Biochemical finding, split from the human genetic item above because the
      authors state the hypophosphorylation result is in vitro. This is the
      evidence for the phosphorylation defect itself.
  - reference: PMID:17218255
    reference_title: "Modeling of a human circadian mutation yields insights into clock regulation by PER2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We generated transgenic mice carrying the FASPS hPER2 S662G mutation and
      faithfully recapitulate the human phenotype. We show that phosphorylation
      at S662 leads to increased PER2 transcription and suggest that
      phosphorylation at another site leads to PER2 degradation.
    explanation: >-
      Mouse modelling of S662G recapitulates the human phenotype and shows the
      phosphosite controls PER2 transcription and, at other sites, degradation.
  - reference: PMID:41812650
    reference_title: "Discovery of MARK2 as a physiological kinase for PER2 in the mammalian clock."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Our biochemical purification revealed microtubule affinity regulating
      kinase 2 (MARK2) in phosphorylating S662, binding to and stabilizing PER2.
    explanation: >-
      Identifies MARK2 as the S662-site kinase and connects phosphorylation at
      the FASP site to PER2 stabilization.
  - reference: PMID:41812650
    reference_title: "Discovery of MARK2 as a physiological kinase for PER2 in the mammalian clock."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Neuronal specific Mark2 knockout mice showed phase advancement and period shortening.
    explanation: >-
      In-vivo loss of neuronal MARK2 reproduces the phase advancement and
      period shortening associated with the PER2 S662G lesion.
  - reference: PMID:41812650
    reference_title: "Discovery of MARK2 as a physiological kinase for PER2 in the mammalian clock."
    supports: REFUTE
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We found S662 phosphorylation by casein kinase 1 (CK1) δ and ε,
      testis-specific serine kinase (TSSK) 1 and 2, and salt inducible kinase
      (SIK) 1-3, but no phase advancement phenotype after genetic deletion of
      any of these seven genes.
    explanation: >-
      Refutes the stronger historical inference that in-vitro phosphorylation
      capacity makes CK1delta/epsilon the physiologically decisive S662 kinase.
- name: CK1delta Reduced Kinase Activity
  description: >-
    CSNK1D p.Thr44Ala (T44A) mutates the kinase rather than the substrate: the
    mutant kinase has decreased enzymatic activity in vitro and causes FASPS
    in humans. Transgenic mice bearing CK1delta-T44A have a shortened
    circadian period, and CK1delta dosage modulates the PER2 S662G phenotype in
    vivo, showing genetic interaction with PER2. This does not establish that
    CK1delta is the physiologically decisive kinase at S662; 2026 knockout and
    biochemical evidence instead identifies MARK2 in that role. The CSNK1D
    lesion therefore remains a distinct clock-kinase route into altered TTFL
    feedback rather than the enzyme side of a single S662 biochemical lesion.

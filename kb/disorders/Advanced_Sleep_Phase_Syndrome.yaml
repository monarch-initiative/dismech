      phosphorylation route and the degradation-promoting beta-TrCP phosphodegron
      route, then lowers FASP-route phosphorylation as an S662G-like
      parameterization.
    limitations: >-
      The 2018 revision assigns physiological priming-site control to
      CK1delta/epsilon, whereas 2026 knockout and biochemical evidence found no
      phase-advance phenotype after deletion of CK1delta/epsilon or five other
      candidate kinases and instead identified MARK2 as physiologically
      significant at S662. The phosphoswitch competition remains informative,
      but its enzyme assignment should not be treated as settled human biology.
      The parameter reduction does not explicitly represent a heterozygous allele
      or human allele dosage.
    readouts:
    - name: Simulated PER2 degradation kinetics
      target: PER2 S662-Site Hypophosphorylation
      direction: ALTERED
      interpretation: >-
        The degradation plateau and subsequent loss of PER2 report competition
        between the stabilizing FASP route and the degradation route.

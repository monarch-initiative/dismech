  - reference: PMID:39864932
    reference_title: "Advanced sleep phase syndrome: Role of genetics and aging."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Autosomal dominant mutations in circadian clock genes like PER2, CK1,
      PER3, CRY2, TIMELESS, and DEC2 have been linked to FASP, some with
      pleiotropic effects influencing other health aspects like migraine and
      depression.
    explanation: >-
      Review enumerates the historical circadian-gene candidates for familial
      advanced sleep phase. DEC2 is not modeled here because its established
      human phenotype is natural short sleep rather than normal-duration sleep
      at an advanced phase.
  - reference: PMID:31400754
    reference_title: "Genetics of the human circadian clock and sleep homeostat."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A portion of the variation in the population is controlled by genetics as
      shown by the single-gene mutations that confer extreme early or late
      chronotypes.
    explanation: >-
      Establishes that single-gene clock mutations are sufficient to produce
      extreme early chronotype, the genetic premise of this node.
  - reference: PMID:40460120
    reference_title: "CACNA1D is a circadian gene and causes familial advanced sleep phase."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We have identified five variants in five different families in the human
      voltage-gated calcium channel subunit alpha1 D (CACNA1D) that cosegregate
      with FASP.
    explanation: >-
      Extends the autosomal-dominant genetic trigger beyond canonical TTFL
      proteins to CACNA1D, with cosegregation in five independent families.
- name: PER2 S662-Site Hypophosphorylation
  description: >-
    The original FASPS lesion, PER2 p.Ser662Gly (S662G), substitutes glycine
    for a serine within the casein kinase I epsilon/delta binding region of
    hPER2. The substitution causes hypophosphorylation by CK1epsilon in vitro.
    Newer evidence separates in-vitro kinase capacity from physiological
    control: MARK2 binds PER2, phosphorylates S662, and stabilizes PER2, while
    deletion of CK1delta/epsilon or five other candidate kinases did not
    reproduce phase advancement. Loss of S662-site phosphorylation retunes
    PER2 stability and the feedback loop, altering circadian period.
  biological_scale: MOLECULAR
  role: central_effector
  biological_processes:
  - preferred_term: Protein phosphorylation
    term:

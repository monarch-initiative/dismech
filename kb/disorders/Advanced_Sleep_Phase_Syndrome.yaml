- name: Altered Photic Entrainment of the Circadian Pacemaker
  description: >-
    Light reaching intrinsically photosensitive retinal ganglion cells is
    conveyed by the retinohypothalamic tract to the suprachiasmatic nucleus and
    is the dominant zeitgeber that entrains the clock to the 24-hour day. The
    direction of the resulting shift depends on when in the circadian cycle the
    light falls (the phase-response curve): light in the late night/early
    morning advances the clock, light in the evening delays it. A clock lesion
    can therefore advance phase either by shortening period or by biasing this
    entrainment response; TIMELESS and CACNA1D variants act predominantly
    through the latter. This node is also the substrate on which treatment
    acts, and the reason mistimed light worsens the disorder.

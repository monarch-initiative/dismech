    term:
      id: GO:0002088
      label: lens development in camera-type eye
    modifier: ABNORMAL
  evidence:
  - reference: PMID:8282045
    reference_title: "Lens development in a dominant X-linked congenital cataract of the mouse."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The observed sequence of histological changes indicates that the Xcat
      mutation affects the differentiation of lens fiber cells at some point
      after their initial elongation.
    explanation: >-
      Histology of the Xcat lens places the defect in fiber cell
      differentiation.
  - reference: PMID:2272505
    reference_title: "Genetic localization and phenotypic expression of X-linked cataract (Xcat) in Mus musculus."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the site of gene action for the Xcat locus is suggested to be endogenous
      to the lens cells
    explanation: >-
      Variegated opacity in heterozygous Xcat females places gene action
      inside lens cells.
  - reference: PMID:20332100
    reference_title: "The Nance-Horan syndrome protein encodes a functional WAVE homology domain (WHD) and is important for co-ordinating actin remodelling and maintaining cell morphology."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      We show that NHS controls cell morphology by maintaining the integrity of
      the circumferential actin ring and controlling lamellipod formation.
    explanation: >-
      NHS knockdown in cultured cells disrupts actin organisation; the lens
      fiber consequence is inferred.
  downstream:
  - target: Congenital nuclear cataract
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:8282045
      reference_title: "Lens development in a dominant X-linked congenital cataract of the mouse."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Postnatally, most of the lens substance becomes amorphous; the
        cataractous process terminates in rupture of the posterior lens capsule
        by P21.
      explanation: >-
        Degeneration of fiber cells produces a total cataract in the mouse
        model.
  - target: Carrier lens opacities
    causal_link_type: DIRECT
    description: >-
      Random X-chromosome inactivation in heterozygous females produces
      variegated cell-autonomous lens fiber abnormalities and mild central or
      Y-sutural opacities.
    evidence:
    - reference: PMID:2272505
      reference_title: "Genetic localization and phenotypic expression of X-linked cataract (Xcat) in Mus musculus."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        A variegated pattern of lens opacity was evident in female
        heterozygotes.
      explanation: >-
        Variegated lens opacity in Xcat female heterozygotes models the milder
        focal lens opacities of human female carriers.

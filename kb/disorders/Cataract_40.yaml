  evidence:
  - reference: PMID:19414485
    reference_title: "X-linked cataract and Nance-Horan syndrome are allelic disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The hypothesis that intron 1 is important for transcriptional regulation
      is supported by the identification of the mutation in the Xcat mouse
    explanation: >-
      Links the intron 1 deletion to a regulatory role of that intron.
  - reference: PMID:16357105
    reference_title: "Xcat, a novel mouse model for Nance-Horan syndrome inhibits expression of the cytoplasmic-targeted Nhs1 isoform."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The insertion inhibits the expression of the Nhs1 isoform containing exon
      1 and results in exclusive expression of the alternative isoform
      containing exon 1A. Quantitative RT-PCR of Xcat cDNA shows reduced levels
      of Nhs1 transcripts.
    explanation: >-
      An intron 1 insertion in mouse changes Nhs isoform expression without
      truncating the coding sequence.
  - reference: PMID:20332100
    reference_title: "The Nance-Horan syndrome protein encodes a functional WAVE homology domain (WHD) and is important for co-ordinating actin remodelling and maintaining cell morphology."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    snippet: >-
      The N-terminus of isoforms NHS-A and NHS-1A, implicated in the
      pathogenesis of NHS, have a functional WAVE homology domain that
      interacts with the Abi protein family, haematopoietic stem/progenitor
      cell protein 300 (HSPC300), Nap1 and Sra1.
    explanation: >-
      Establishes the WAVE regulatory complex binding function of exon-1-encoded
      NHS isoforms whose transcriptional regulation is perturbed by intron 1
      and locus rearrangements.
  downstream:
  - target: Disturbed Lens Fiber Cell Differentiation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:16357105
      reference_title: "Xcat, a novel mouse model for Nance-Horan syndrome inhibits expression of the cytoplasmic-targeted Nhs1 isoform."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The Nhs1 protein is strongly expressed within the cytoplasm of
        elongating lens fiber cells from wild-type neonate lens, but is
        significantly reduced within the Xcat lens.
      explanation: >-
        In the mouse model, the expression change reaches the lens fiber
        cells that degenerate.
- name: Disturbed Lens Fiber Cell Differentiation
  role: effector
  description: >-
    In the Xcat mouse, primary and then secondary lens fibers become
    disorganised and degenerate after their initial elongation, while the lens
    epithelium looks normal. NHS isoforms regulate actin remodelling through a
    WAVE homology domain and associate with epithelial junctions, which is the
    proposed link between altered NHS levels and fiber cell failure; that link
    has been shown in cultured cells, not in lens.
  biological_scale: CELLULAR
  locations:
  - preferred_term: lens of camera-type eye
    term:
      id: UBERON:0000965
      label: lens of camera-type eye
  cell_types:

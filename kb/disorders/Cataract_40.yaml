notes: >-
  Lump/split: kept separate from Nance-Horan syndrome (kb/disorders/
  Nance-Horan_Syndrome.yaml, MONDO:0010545), which records the reciprocal
  decision. MONDO places this term under early-onset non-syndromic cataract,
  and the defining alleles (PMID:19414485) are regulatory copy number variants
  that preserve the NHS coding sequence, whereas Nance-Horan syndrome alleles
  are truncations or deletions leaving no functional protein. Truncating NHS
  point variants first ascertained as apparently isolated familial cataract
  (PMID:24968223) are not treated as cataract 40 here: the Nance-Horan entry
  covers them, because the dental and systemic features can be subtle or
  emerge later (PMID:40868138). The congenital heart defects reported in the
  original CXN family could reflect altered NHS transcription or increased
  dosage of the co-duplicated SCML1 or RAI2 genes; the source does not decide
  between these. The pathograph does not conform to the
  cataract_lens_opacification module, whose chain runs through crystallin
  aggregation: postnatal Xcat lenses showed no significant crystallin or
  cytoskeletal protein abnormality (PMID:8282045), so the opacity here is
  attributed to fiber cell degeneration rather than crystallin aggregation.

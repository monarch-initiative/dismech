treatments:
- name: Early cataract extraction with optical rehabilitation
  description: >-
    Lens extraction within the first weeks of life, followed by aphakic
    optical correction and amblyopia treatment, is the primary ophthalmic
    management; there is no NHS-directed molecular therapy. Earlier surgery
    reduces deprivation amblyopia but is associated with more secondary
    membrane formation and glaucoma.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: cataract surgery
    term:
      id: NCIT:C157809
      label: Cataract Surgery
  target_mechanisms:
  - target: Disturbed Lens Fiber Cell Differentiation
    treatment_effect: MODULATES
    description: >-
      Surgically removes the opacified degenerated lens fibers to restore a
      clear visual axis during the neonatal critical period.
  target_phenotypes:

name: Cataract 40
creation_date: "2026-10-19T20:47:46Z"
category: Mendelian
synonyms:
- CTRCT40
- CXN
- X-linked congenital cataract
- cataract, congenital, X-linked
description: >-
  Cataract 40 (CTRCT40; X-linked congenital cataract, CXN; OMIM 302200) is an
  X-linked congenital cataract without the dental, facial, and developmental
  features of Nance-Horan syndrome, although it is caused by structural
  variation at the same gene, NHS (Xp22.13). Affected males have dense
  bilateral nuclear cataracts that need extraction in the first months of
  life, and carrier females have milder central nuclear or Y-sutural lens
  opacities. In the families that defined the disease, the causal alleles were
  copy number variants that leave the NHS coding sequence intact: a complex
  duplication-triplication spanning NHS, SCML1 and RAI2, and a 4.8 kb deletion
  inside the very large first intron of NHS. Both are predicted to alter NHS
  transcriptional regulation rather than abolish the protein, in contrast to
  the truncating null alleles of Nance-Horan syndrome. The mouse Xcat mutation,
  an insertion in intron 1 of Nhs that suppresses one isoform, causes an
  X-linked cataract without other anomalies and is the closest model. In the
  original CXN family, four of six affected males also had congenital heart
  defects.
disease_term:
  preferred_term: cataract 40

      label: Nuclear cataract
  evidence:
  - reference: PMID:22383071
    reference_title: "Congenital and infantile cataract: aetiology and management."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Good outcomes have been reported in children undergoing surgery before 6
      weeks of age in children with unilateral cataract and before 10 weeks of
      age in bilateral cases.
    explanation: >-
      Timing targets for congenital cataract surgery; not specific to NHS.
  - reference: PMID:19084444
    reference_title: "The critical period for surgical treatment of dense congenital bilateral cataracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Deprivation amblyopia may be minimized with early surgery for bilateral
      cataracts.
    explanation: >-
      Prospective cohort supporting early extraction of dense bilateral
      cataracts.
- name: Genetic counseling
  description: >-
    X-linked inheritance counseling informs heterozygous carrier females of the
    50% risk of transmitting the NHS structural variant to sons (who develop
    severe congenital nuclear cataract) and daughters (carrier opacities), and
    highlights the need for targeted copy-number testing rather than coding-only
    NHS sequencing.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:19414485
    reference_title: "X-linked cataract and Nance-Horan syndrome are allelic disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In brief, all affected males required cataract extraction in the first
      few months of life. Carrier females had mild fan-shaped central nuclear
      opacities
    explanation: >-
      Establishes X-linked transmission with complete severe male expression
      and recognizable female carrier signs that guide family counseling.
animal_models:
- name: Xcat mouse
  species: Mouse
  genotype: Xcat (insertion in Nhs intron 1)
  publication: PMID:16357105
  description: >-
    A spontaneous X-linked dominant cataract mutation caused by a large
    insertion between exons 1 and 2 of Nhs, which suppresses the exon 1
    (cytoplasmic) isoform. Hemizygous males have complete penetrance and
    heterozygous females a variegated lens phenotype.
  modeled_mechanisms:
  - target: Altered NHS Transcriptional Regulation
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Like the human cataract 40 alleles, the Xcat lesion sits in intron 1 and
      changes Nhs transcription without truncating the coding sequence.
    limitations: >-
      The mouse lesion is an insertion that removes one isoform, whereas the
      human alleles are a duplication-triplication and a small intronic
      deletion whose effect on NHS expression has not been measured.
    evidence:
    - reference: PMID:16357105
      reference_title: "Xcat, a novel mouse model for Nance-Horan syndrome inhibits expression of the cytoplasmic-targeted Nhs1 isoform."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Sequence and FISH analysis of the X-chromosome region containing the
        Xcat mutation reveal a large insertion between exons 1 and 2 of the
        mouse Nhs1 gene.
      explanation: >-
        Locates the Xcat lesion in the first intron of Nhs.
  - target: Disturbed Lens Fiber Cell Differentiation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Xcat lenses show fiber cell degeneration leading to total cataract.
    evidence:
    - reference: PMID:8282045
      reference_title: "Lens development in a dominant X-linked congenital cataract of the mouse."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Progressive degeneration of primary fibers occurs from E15 to E18 and,
        during late gestation, secondary lens fibers also begin to degenerate.
      explanation: >-
        Fiber cell degeneration in the mouse lens.

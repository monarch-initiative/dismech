- name: Altered NHS Transcriptional Regulation
  role: central_effector
  description: >-
    The structural variants are proposed to disturb the regulation of NHS
    transcription, altering availability of exon-1-encoded NHS isoforms (NHS-A
    and NHS-1A) whose N-terminal WAVE homology domain binds WAVE regulatory
    complex subunits (Abi, HSPC300, Nap1, Sra1). Intron 1 is unusually large
    and is retained at proportionally large size even in the compact Fugu
    genome, suggesting regulatory elements, and the mouse Xcat insertion in the
    same intron suppresses the isoform transcribed from exon 1. Patient NHS
    expression has not been measured, so the direction and tissue pattern of
    the change are unknown.
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL

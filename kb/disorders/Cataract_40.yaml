  notes: >-
    Molecularly confirmed regulatory copy-number-variant cataract 40 was
    defined in two X-linked pedigrees (Family H with an NHS-SCML1-RAI2
    duplication-triplication and Family I with a 4.8 kb NHS intron 1 deletion);
    population birth prevalence has not been estimated separately from
    congenital cataract overall.
  evidence:
  - reference: PMID:19414485
    reference_title: "X-linked cataract and Nance-Horan syndrome are allelic disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Two CXN families, which were negative for mutations in the NHS gene,
      were further analysed using array comparative genomic hybridization.
    explanation: >-
      Documents the two molecularly resolved X-linked congenital cataract
      families defining this non-coding CNV entity.

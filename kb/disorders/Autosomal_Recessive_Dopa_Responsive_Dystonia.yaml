    snippet: >-
      Variant type-particularly R233H/nonsense versus R233H/missense
      significantly influences dose requirements, underscoring the value of
      genotype-guided, dynamic levodopa titration to optimize long-term outcomes.
    explanation: The pediatric cohort supports dynamic, genotype-informed dose adjustment.

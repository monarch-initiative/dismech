- reference: PMID:36740977
  title: iPSC-based modeling of THD recapitulates disease phenotypes and reveals neuronal malformation.
  findings:
  - statement: >-
      Patient-derived dopaminergic neurons show dopamine-metabolite depletion,
      reduced TH, neurite defects, phenotype-dependent levodopa rescue, and a
      possible developmental treatment window.
    supporting_text: >-
      THD iPSC-DAn displayed lower levels of DA metabolites and reduced TH
      expression, when compared to controls.
    evidence:
    - reference: PMID:36740977
      reference_title: iPSC-based modeling of THD recapitulates disease phenotypes and reveals neuronal malformation.
      supports: SUPPORT
      evidence_source: IN_VITRO

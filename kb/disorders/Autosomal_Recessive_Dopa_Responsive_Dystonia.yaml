        expression, when compared to controls.
      explanation: Patient-derived neurons reproduce the core biochemical defect.
- reference: PMID:38196161
  title: "Tetrahydrobiopterin (BH(4)) treatment stabilizes tyrosine hydroxylase: Rescue of tyrosine hydroxylase deficiency phenotypes in human neurons and in a knock-in mouse model."
  findings:
  - statement: >-
      BH4 increased TH and dopamine in patient-derived neurons and improved
      motor outcomes in a knock-in mouse, supporting a variant-dependent
      preclinical proteostasis strategy.
    supporting_text: >-
      Treatment with BH4 significantly improved motor function in these mice,
      as demonstrated by increased latency on the rotarod test and improved
      horizontal activity (catalepsy).
    evidence:
    - reference: PMID:38196161
      reference_title: "Tetrahydrobiopterin (BH(4)) treatment stabilizes tyrosine hydroxylase: Rescue of tyrosine hydroxylase deficiency phenotypes in human neurons and in a knock-in mouse model."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Importantly, treatment with BH4 significantly improved motor function
        in these mice, as demonstrated by increased latency on the rotarod test
        and improved horizontal activity (catalepsy).
      explanation: The knock-in mouse provides preclinical motor-rescue evidence.
- reference: PMID:41872043
  title: "Tyrosine Hydroxylase Deficiency Impairs TH Axonal Transport, Brain Function, and Neuronal Plasticity."
  findings:
  - statement: >-
      A Th-p.R203H knock-in model supports defective TH axonal transport,
      altered striatal inhibitory circuitry, and compensatory plasticity
      without dopaminergic neuron degeneration.
    supporting_text: >-
      TH deficiency disrupts striatal inhibitory circuitry and triggers
      compensatory neuronal plasticity, without causing neuronal degeneration.
    evidence:
    - reference: PMID:41872043
      reference_title: "Tyrosine Hydroxylase Deficiency Impairs TH Axonal Transport, Brain Function, and Neuronal Plasticity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Overall, our findings demonstrate that TH deficiency disrupts striatal
        inhibitory circuitry and triggers compensatory neuronal plasticity,
        without causing neuronal degeneration.
      explanation: The model identifies a circuit-level consequence beyond transmitter depletion.
- reference: PMID:33996491
  title: Blood, urine and cerebrospinal fluid analysis in TH and AADC deficiency and the effect of treatment.
  findings:
  - statement: >-
      CSF remains the most informative compartment for monoamine-metabolite
      diagnosis; urinary dopamine can be normal and routine CSF monitoring does
      not reliably measure clinical treatment response.
    supporting_text: >-
      This study confirms that cerebrospinal fluid is the most informative body
      fluid to measure monoamine neurotransmitter metabolites when AADC or TH
      deficiency is suspected.
    evidence:
    - reference: PMID:33996491
      reference_title: Blood, urine and cerebrospinal fluid analysis in TH and AADC deficiency and the effect of treatment.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        This study confirms that cerebrospinal fluid is the most informative
        body fluid to measure monoamine neurotransmitter metabolites when AADC
        or TH deficiency is suspected, and that routine follow-up of
        cerebrospinal fluid measurements to estimate treatment response is not
        needed.
      explanation: The body-fluid study defines the diagnostic and monitoring roles of CSF.

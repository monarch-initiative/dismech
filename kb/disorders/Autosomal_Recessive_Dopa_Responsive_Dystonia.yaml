- reference: PMID:20430833
  title: "Tyrosine hydroxylase deficiency: a treatable disorder of brain catecholamine biosynthesis."
  findings:
  - statement: >-
      A 36-patient study established the type A/type B clinical spectrum, the
      characteristic CSF metabolite pattern, and broad levodopa treatability.
    supporting_text: >-
      Decreased cerebrospinal fluid concentrations of homovanillic acid and
      3-methoxy-4-hydroxyphenylethylene glycol, with normal
      5-hydroxyindoleacetic acid cerebrospinal fluid concentrations, are the
      biochemical hallmark of tyrosine hydroxylase deficiency.
    evidence:

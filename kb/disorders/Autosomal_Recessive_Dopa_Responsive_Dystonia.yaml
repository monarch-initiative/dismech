      p.R153X (10.8%), and p.Q232X (6.9%).
    explanation: The large pediatric cohort documents recurrent missense and nonsense alleles.
diagnosis:
- name: Molecular genetic testing
  presence: Positive
  description: >-
    Confirm TH deficiency by identifying pathogenic or likely pathogenic
    variants on both TH alleles. Molecular confirmation is essential because
    the phenotype overlaps several dopamine and BH4 pathway disorders.
  evidence:
  - reference: PMID:41215497
    reference_title: "Consensus Guideline for the Diagnosis and Treatment of Tyrosine Hydroxylase (TH) Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis is suggested by the detection of low CSF homovanillic acid
      (HVA) and confirmed by identifying biallelic pathogenic variants in the
      TH gene.
    explanation: The current consensus requires biallelic TH confirmation.
  - reference: PMID:20301610
    reference_title: "Tyrosine Hydroxylase Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of TH deficiency is established in a proband by
      identification of biallelic pathogenic variants in TH by molecular genetic
      testing.
    explanation: GeneReviews supports molecular genetic testing for TH deficiency.
- name: CSF neurotransmitter metabolite testing
  presence: Positive
  description: >-
    The characteristic pretreatment pattern is low HVA and MHPG with normal
    5-HIAA. HVA and the HVA/5-HIAA ratio can correlate with severity, but
    age-adjusted sampling and molecular confirmation are required.
  evidence:
  - reference: PMID:20430833
    reference_title: "Tyrosine hydroxylase deficiency: a treatable disorder of brain catecholamine biosynthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Decreased cerebrospinal fluid concentrations of homovanillic acid and
      3-methoxy-4-hydroxyphenylethylene glycol, with normal
      5-hydroxyindoleacetic acid cerebrospinal fluid concentrations, are the
      biochemical hallmark of tyrosine hydroxylase deficiency.
    explanation: The clinical cohort defines the distinguishing CSF pattern.
  - reference: PMID:33996491
    reference_title: Blood, urine and cerebrospinal fluid analysis in TH and AADC deficiency and the effect of treatment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This study confirms that cerebrospinal fluid is the most informative body
      fluid to measure monoamine neurotransmitter metabolites when AADC or TH
      deficiency is suspected, and that routine follow-up of cerebrospinal
      fluid measurements to estimate treatment response is not needed.
    explanation: This study supports CSF for diagnosis but not routine response monitoring.
- name: Levodopa responsiveness
  presence: Supportive but not required
  description: >-
    A marked, sustained response strongly supports a dopamine-synthesis
    disorder, especially in mild TH-deficient DRD. Incomplete response or
    dose-limiting dyskinesia in severe disease does not exclude TH deficiency.
  evidence:
  - reference: PMID:20301610
    reference_title: "Tyrosine Hydroxylase Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      All individuals with TH-deficient DRD demonstrate complete responsiveness
      of symptoms to levodopa (with a decarboxylase inhibitor).
    explanation: GeneReviews supports levodopa responsiveness in the mild subtype.
  - reference: PMID:41215497
    reference_title: "Consensus Guideline for the Diagnosis and Treatment of Tyrosine Hydroxylase (TH) Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, initiation of therapy can be challenging in patients with severe
      disease forms who develop L-dopa/DCI-induced dyskinesia.
    explanation: The consensus cautions that severe disease may have treatment-limiting dyskinesia.
- name: Peripheral monoamine metabolite testing
  presence: Not exclusionary
  description: >-
    Normal urine or blood catecholamine metabolites do not rule out TH
    deficiency. Peripheral measurements are less informative than CSF, and
    urinary dopamine is often normal despite the central metabolic block.
  evidence:
  - reference: PMID:33996491
    reference_title: Blood, urine and cerebrospinal fluid analysis in TH and AADC deficiency and the effect of treatment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      However, in many patients with TH or AADC deficiency dopamine in urine is
      normal or increased thereby not reflecting the metabolic block.
    explanation: Normal or increased urinary dopamine cannot exclude TH deficiency.
differential_diagnoses:
- name: GTP cyclohydrolase 1-deficient dopa-responsive dystonia
  disease_term:
    preferred_term: autosomal dominant dopa-responsive dystonia
    term:
      id: MONDO:0971063
      label: autosomal dominant dopa-responsive dystonia
  description: >-
    GCH1-deficient DRD shares childhood dystonia, diurnal fluctuation, and a
    dramatic levodopa response with mild TH deficiency.
  distinguishing_features:
  - Usually a heterozygous GCH1 disorder with autosomal dominant inheritance and reduced penetrance
  - Intellectual, cerebellar, and autonomic manifestations generally do not occur in classic GCH1-deficient DRD
  - Molecular testing identifies GCH1 rather than biallelic TH variants
  evidence:
  - reference: PMID:20301681
    reference_title: GTP Cyclohydrolase 1-Deficient Dopa-Responsive Dystonia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of GTPCH1-deficient DRD is established in a proband by
      identification of a heterozygous pathogenic variant in GCH1 by molecular
      genetic testing.
    explanation: GeneReviews provides the decisive molecular distinction.
  - reference: PMID:20301681
    reference_title: GTP Cyclohydrolase 1-Deficient Dopa-Responsive Dystonia.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Intellectual, cerebellar, sensory, and autonomic disturbances generally
      do not occur.
    explanation: This contrasts classic GCH1 disease with severe TH-deficiency manifestations.
- name: Sepiapterin reductase deficiency
  description: >-
    Biallelic SPR disease is another recessive, levodopa-responsive
    neurotransmitter disorder and can present with dystonia, developmental
    impairment, oculogyric crises, and diurnal fluctuation.
  distinguishing_features:
  - Biallelic SPR rather than TH variants
  - BH4-pathway dysfunction can reduce serotonin as well as catecholamine synthesis
  - The TH-deficiency hallmark retains normal CSF 5-HIAA
  evidence:
  - reference: PMID:34834538
    reference_title: Personalized Medicine to Improve Treatment of Dopa-Responsive Dystonia-A Focus on Tyrosine Hydroxylase Deficiency.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This impairment may be due to the fact of a deficiency in GTP
      cyclohydrolase I (GTPCHI, GCH1 gene), sepiapterin reductase (SR), tyrosine
      hydroxylase (TH), or 6-pyruvoyl tetrahydrobiopterin synthase (PTPS) enzyme
      functions.
    explanation: The review places SPR and TH defects within the DRD differential.
  - reference: PMID:20430833
    reference_title: "Tyrosine hydroxylase deficiency: a treatable disorder of brain catecholamine biosynthesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Decreased cerebrospinal fluid concentrations of homovanillic acid and
      3-methoxy-4-hydroxyphenylethylene glycol, with normal
      5-hydroxyindoleacetic acid cerebrospinal fluid concentrations, are the
      biochemical hallmark of tyrosine hydroxylase deficiency.
    explanation: Normal CSF 5-HIAA supports TH rather than a combined monoamine defect.
- name: Aromatic L-amino acid decarboxylase deficiency
  disease_term:
    preferred_term: aromatic L-amino acid decarboxylase deficiency
    term:
      id: MONDO:0012084
      label: aromatic L-amino acid decarboxylase deficiency
  description: >-
    AADC deficiency overlaps with severe TH deficiency through early hypotonia,
    developmental delay, dystonia, oculogyric crises, and autonomic dysfunction.
  distinguishing_features:
  - Biallelic DDC rather than TH variants
  - Low CSF HVA and 5-HIAA with elevated 3-O-methyldopa, rather than normal 5-HIAA
  - Peripheral 3-O-methyldopa is a promising AADC marker but not a TH-deficiency marker
  evidence:

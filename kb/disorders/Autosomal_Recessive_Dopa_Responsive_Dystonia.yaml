  description: >-
    Levodopa plus carbidopa or another peripheral decarboxylase inhibitor
    bypasses the TH block and is first-line therapy. Start low and titrate
    dynamically: mild DRD usually responds completely, infantile parkinsonism
    often improves incompletely and slowly, and severe encephalopathy may be
    extremely sensitive with dose-limiting dyskinesia.

    snippet: >-
      In CSF all patients revealed the pattern typical of AADC with decreased
      concentrations of homovanillic and 5-hydroxyindoleacetic acid and elevated
      concentration of 3-ortho-methyldopa.
    explanation: The AADC CSF profile differs from the normal 5-HIAA of TH deficiency.
  - reference: PMID:33996491
    reference_title: Blood, urine and cerebrospinal fluid analysis in TH and AADC deficiency and the effect of treatment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      3-O-methyldopa in dried blood spots and vanillactic acid in urine are
      promising peripheral biomarkers for diagnosis of AADC deficiency.
    explanation: The peripheral markers help distinguish AADC from TH deficiency.
- name: Cerebral palsy and static motor disorders
  description: >-
    Infantile hypotonia, spasticity, dystonia, motor delay, and normal or
    nonspecific imaging can lead to a cerebral-palsy label. Diurnal fluctuation,
    episodic regression, CSF neurotransmitter abnormalities, and biallelic TH
    variants establish a treatable metabolic disorder instead.
  distinguishing_features:
  - Diurnal fluctuation or episodic decompensation
  - Low CSF HVA and MHPG with normal 5-HIAA
  - Biallelic pathogenic TH variants and a levodopa response
  evidence:
  - reference: PMID:27830117

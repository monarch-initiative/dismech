    reference_title: "Phenotypic, Genotypic Characteristics, and Treatment Strategies of Pediatric Tyrosine Hydroxylase Deficiency: A Single-Center Retrospective Analysis of 51 Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Movement disorders were present in 96.1% of cases, with developmental delay observed in 88.2%, and autonomic symptoms in 51.0%."
    explanation: The largest pediatric cohort documents autonomic manifestations in about half.
- name: Stress-Triggered Neurologic Decompensation
  description: >-
    A subset of patients can develop episodic lethargy, worsened tremor,
    language and motor regression, and axial hypotonia after infection or
    vaccination, with recovery over weeks and prevention of recurrence after
    levodopa/carbidopa in the reported cases.
  downstream:
  - target: Lethargy
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36101825
      reference_title: "Intermittent neurologic decompensation: An underrecognized presentation of tyrosine hydroxylase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        After viral infections or vaccination, she developed lethargy,
        worsened tremor, language, and motor regression including severe axial
        hypotonia, recuperating over several weeks of intensive rehabilitation
        but with residual tremor and mild lower limb spasticity.
      explanation: The human report directly links physiologic stress to lethargic episodes.
  - target: Axial Hypotonia
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:36101825
      reference_title: "Intermittent neurologic decompensation: An underrecognized presentation of tyrosine hydroxylase deficiency."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        After viral infections or vaccination, she developed lethargy,
        worsened tremor, language, and motor regression including severe axial
        hypotonia, recuperating over several weeks of intensive rehabilitation
        but with residual tremor and mild lower limb spasticity.
      explanation: The human report directly supports stress-associated axial hypotonia.
  evidence:
  - reference: PMID:36101825
    reference_title: "Intermittent neurologic decompensation: An underrecognized presentation of tyrosine hydroxylase deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Literature review revealed four other THD patients who had a total of
      seven episodes of marked hypotonia and motor regression following
      infections, occurring between ages 12 months and 6 years.
    explanation: The report extends the episodic presentation beyond one patient.
- name: Striatal Inhibitory Circuit Remodeling
  description: >-
    In the Th-p.R203H knock-in mouse, regionally reduced TH without reduced
    Th transcript or dopaminergic neuronal loss is associated with impaired TH
    axonal transport, altered striatal GABAergic interneuron TH expression, and
    compensatory neuronal plasticity. This is an emerging model-derived
    mechanism, not yet established as a universal human disease feature.
  locations:
  - preferred_term: striatum
    term:
      id: UBERON:0002435
      label: striatum
  cell_types:
  - preferred_term: GABAergic neuron
    term:
      id: CL:0000617
      label: GABAergic neuron
  biological_processes:
  - preferred_term: axonal transport
    term:
      id: GO:0098930
      label: axonal transport
    modifier: DECREASED
  - preferred_term: regulation of neuronal synaptic plasticity
    term:
      id: GO:0048168
      label: regulation of neuronal synaptic plasticity
    modifier: DYSREGULATED
  downstream:
  - target: Dopamine-Responsive Motor Circuit Dysfunction
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:41872043
      reference_title: "Tyrosine Hydroxylase Deficiency Impairs TH Axonal Transport, Brain Function, and Neuronal Plasticity."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Overall, our findings demonstrate that TH deficiency disrupts striatal
        inhibitory circuitry and triggers compensatory neuronal plasticity,
        without causing neuronal degeneration.
      explanation: The knock-in mouse links circuit remodeling to motor-network dysfunction.
  evidence:
  - reference: PMID:41872043
    reference_title: "Tyrosine Hydroxylase Deficiency Impairs TH Axonal Transport, Brain Function, and Neuronal Plasticity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      No changes were observed in Th-mRNA expression, and the decreased level
      of TH in the concrete brain areas in Th-ki mice appears to be due to
      defective TH protein axonal transport.
    explanation: The model directly supports defective axonal delivery of TH protein.

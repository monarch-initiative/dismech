animal_models:
- species: Mus musculus
  genotype: Th-p.R203H knock-in mouse corresponding to human TH p.R202H/p.R233H disease nomenclature
  genes:
  - preferred_term: Th
    term:
      id: MGI:98735
      label: Th
  description: >-
    This knock-in model has reduced TH and dopamine across several brain
    regions, motor impairment, defective TH protein axonal transport, altered
    striatal interneuron markers, and compensatory plasticity without
    dopaminergic neuronal degeneration. BH4 improved motor outcomes in
    preclinical treatment experiments.
  associated_phenotypes:
  - Reduced brain TH and dopamine
  - Motor impairment and catalepsy
  - Altered striatal inhibitory circuitry
  - Compensatory neuronal plasticity without dopaminergic neuron loss
  evidence:
  - reference: PMID:41872043
    reference_title: "Tyrosine Hydroxylase Deficiency Impairs TH Axonal Transport, Brain Function, and Neuronal Plasticity."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Th-ki mice displayed significantly reduced TH, especially in the
      striatum, but also in the cortex, olfactory bulb, cerebellum, substantia
      nigra, globus pallidus, and spinal cord, a decrease that is not associated
      with dopaminergic neuronal degeneration.
    explanation: The knock-in mouse recapitulates regional TH deficiency without neuron loss.
  - reference: PMID:38196161
    reference_title: "Tetrahydrobiopterin (BH(4)) treatment stabilizes tyrosine hydroxylase: Rescue of tyrosine hydroxylase deficiency phenotypes in human neurons and in a knock-in mouse model."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-

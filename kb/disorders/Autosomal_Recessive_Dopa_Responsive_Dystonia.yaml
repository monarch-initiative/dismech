- Dopa-responsive dystonia
- Inborn Error of Metabolism
- Movement Disorder
disease_term:
  preferred_term: TH-deficient dopa-responsive dystonia
  term:
    id: MONDO:0011551
    label: TH-deficient dopa-responsive dystonia
synonyms:
- Autosomal recessive Segawa syndrome
- DYT5b
- Tyrosine hydroxylase deficiency
- Tyrosine hydroxylase-deficient dopa-responsive dystonia
description: >-
  TH-deficient dopa-responsive dystonia is a very rare autosomal recessive
  neurometabolic disorder caused by biallelic pathogenic variants in TH.
  Reduced tyrosine hydroxylase activity limits the rate-limiting conversion of
  tyrosine to L-dopa and depletes dopamine and other catecholamines in the
  central nervous system. Clinical expression is continuous, ranging from
  childhood-onset, levodopa-responsive dystonia to infantile parkinsonism with
  motor delay and severe early encephalopathy with variable levodopa response.
notes: >-
  MONDO:0011551, ORPHA:101150, and OMIM:605407 map this entity to TH
  deficiency. The 2025-12-09 Orphadata snapshot also attaches TSPOAP1 to
  ORPHA:101150, but the cited TSPOAP1 primary study concerns a distinct
  presynaptic autosomal recessive dystonia rather than TH-deficient,
  dopa-responsive disease. TSPOAP1 is therefore excluded from this
  MONDO-anchored entry.

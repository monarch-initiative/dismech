      Infection- or vaccination-associated episodic regression and hypotonia
      can occur in mild TH deficiency and may respond rapidly to
      levodopa/carbidopa.
    supporting_text: >-
      After viral infections or vaccination, she developed lethargy, worsened
      tremor, language, and motor regression including severe axial hypotonia.

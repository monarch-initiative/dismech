discussions:
- discussion_id: gap_thd_genotype_guided_levodopa_dosing
  prompt: >-
    Which genotype, biochemical, and clinical markers should guide starting
    dose, titration rate, and adjunctive therapy across the TH-deficiency
    severity spectrum?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - genetic#TH biallelic pathogenic variants
  - treatments#Severity-adapted levodopa with a decarboxylase inhibitor
  rationale: >-
    The largest pediatric cohort associates second-allele variant class with
    dose requirements among p.R233H carriers, but it is single-center and
    single-ethnicity. The consensus guideline notes that available evidence is
    limited, while severe patients remain vulnerable to dyskinesia.
  evidence:
  - reference: PMID:41121981
    reference_title: "Phenotypic, Genotypic Characteristics, and Treatment Strategies of Pediatric Tyrosine Hydroxylase Deficiency: A Single-Center Retrospective Analysis of 51 Cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Variant type-particularly R233H/nonsense versus R233H/missense
      significantly influences dose requirements, underscoring the value of
      genotype-guided, dynamic levodopa titration to optimize long-term outcomes.
    explanation: The cohort provides a testable genotype-dose association.
  - reference: PMID:41215497
    reference_title: "Consensus Guideline for the Diagnosis and Treatment of Tyrosine Hydroxylase (TH) Deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Based on the limited evidence, practical recommendations have been
      developed to support clinical diagnosis, laboratory testing, neuroimaging,
      medical treatment, and non-medical interventions.
    explanation: The guideline explicitly characterizes the evidence base as limited.
- discussion_id: gap_thd_developmental_treatment_window
  prompt: >-
    Does treatment before symptomatic neurodevelopmental injury improve
    cognition and motor-network development in severe TH deficiency?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Infantile Catecholamine Deficiency Encephalopathy
  - experimental_models#Patient-derived THD iPSC dopaminergic neurons
  - clinical_trials#NCT03655223
  - clinical_trials#NCT05687474
  rationale: >-
    Patient-derived neurons suggest that precursor-stage levodopa can prevent
    severe-cell defects even when mature neurons respond poorly, and clinical
    consensus favors early diagnosis. The two registry studies screen newborns,
    but no disease-specific prospective early-treatment trial was identified.
  evidence:
  - reference: PMID:36740977
    reference_title: iPSC-based modeling of THD recapitulates disease phenotypes and reveals neuronal malformation.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Interestingly, L-Dopa treatment at the stage of neuronal precursors could
      prevent the alterations in THDB-iPSC-DAn, thus suggesting the existence
      of a critical developmental window in THD.
    explanation: The cellular model motivates prospective testing of treatment timing.
  - reference: PMID:41215497
    reference_title: "Consensus Guideline for the Diagnosis and Treatment of Tyrosine Hydroxylase (TH) Deficiency."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: >-
      Clinical experience suggests that early diagnosis and treatment initiation
      may improve the outcome.
    explanation: Clinical consensus supports early treatment while acknowledging limited evidence.
- discussion_id: gap_bh4_precision_rescue_translation
  prompt: >-
    Which TH genotypes can be stabilized by BH4 in vivo, and can clinically
    achievable exposure add benefit to levodopa without worsening adverse
    effects?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic TH Loss of Function
  - experimental_models#BH4 stabilization assay in THD patient-derived neurons
  - animal_models#Th-p.R203H knock-in mouse corresponding to human TH p.R202H/p.R233H disease nomenclature
  rationale: >-
    BH4 rescued TH abundance, dopamine, and motor phenotypes in selected
    patient-derived neurons and a knock-in mouse. The effect was
    genotype-dependent and no TH-deficiency-specific human interventional trial
    was identified, so BH4 remains preclinical for this indication.
  evidence:
  - reference: PMID:38196161
    reference_title: "Tetrahydrobiopterin (BH(4)) treatment stabilizes tyrosine hydroxylase: Rescue of tyrosine hydroxylase deficiency phenotypes in human neurons and in a knock-in mouse model."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These findings highlight the therapeutic potential of BH4 as a treatment
      option for THDA patients with specific variants and provide insights into
      the modulation of TH stability and its implications for THD management.
    explanation: The study itself frames BH4 as variant-specific therapeutic potential.
- discussion_id: gap_thd_family_diagnostic_burden
  prompt: >-
    Which care pathways and communication practices reduce diagnostic delay and
    family psychological burden across health systems?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - diagnosis#Molecular genetic testing
  - external_assertions#iNTD longitudinal patient registry
  rationale: >-
    The first focused caregiver study involved only five Serbian parents and
    found uncertainty, communication challenges, and emotional strain.
    Multinational registry work is needed to test generalizability and identify
    modifiable care-system factors.
  evidence:
  - reference: PMID:42141694
    reference_title: "Cognitive and emotional experiences of parents of children with Tyrosine Hydroxylase Deficiency during the diagnostic journey in Serbia: A preliminary study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Given the preliminary nature of this research and its geographic focus on
      Serbia, the findings are exploratory and may not generalize to other
      populations.
    explanation: The qualitative study explicitly identifies its generalizability limit.

name: Periprosthetic Joint Infection
creation_date: "2026-09-26T03:09:00Z"
updated_date: "2026-09-26T03:09:00Z"
category: Infectious Disease
description: >-
  Periprosthetic joint infection is an acquired bacterial infection of an
  implanted synovial joint prosthesis and adjacent periprosthetic tissues.
  Organisms introduced around the index arthroplasty or seeded later through
  the bloodstream adhere to avascular implant material, mature into
  antibiotic-tolerant biofilm, and sustain a local inflammatory niche that is
  difficult to sterilize without debridement or exchange of the colonized
  hardware.
synonyms:
- prosthetic joint infection
- PJI
- implant-associated joint infection
disease_term:
  preferred_term: periprosthetic joint infection
  term:
    id: MONDO:0800179
    label: periprosthetic joint infection
parents:
- Bacterial Infection

classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
    evidence:
    - reference: PMID:41511894
      reference_title: >-
        Staphylococcus aureus periprosthetic joint infection and its
        pathogenesis in total hip and knee arthroplasty: a narrative review.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Staphylococcus aureus is the most common pathogen in periprosthetic
        joint infections (PJIs), capable of biofilm formation and resistance
        mechanisms, complicating diagnosis and treatment.
      explanation: >-
        Identifies PJI as a bacterial infection complicated by staphylococcal
        biofilm and antimicrobial resistance, placing it in the infectious
        diseases chapter.

infectious_agent:
- name: Staphylococcus aureus
  description: >-
    A leading and high-virulence PJI pathogen whose surface adhesion, biofilm
    growth, and resistance phenotypes make it central to hip and knee PJI.
  infectious_agent_term:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  evidence:
  - reference: PMID:41511894
    reference_title: >-
      Staphylococcus aureus periprosthetic joint infection and its pathogenesis
      in total hip and knee arthroplasty: a narrative review.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Staphylococcus aureus is the most common pathogen in periprosthetic joint
      infections (PJIs), capable of biofilm formation and resistance mechanisms,
      complicating diagnosis and treatment.
    explanation: >-
      Names S. aureus as a common PJI agent and ties it to the biofilm biology
      curated in the pathograph.
- name: Staphylococcus epidermidis
  description: >-
    A coagulase-negative staphylococcus that frequently causes indolent,
    late-chronic implant infections.
  infectious_agent_term:
    preferred_term: Staphylococcus epidermidis
    term:
      id: NCBITaxon:1282
      label: Staphylococcus epidermidis
  evidence:
  - reference: PMID:40713651
    reference_title: Organism profiles and empirical treatments for periprosthetic joint infections.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We isolated 335 pathogens, including 218 coagulase-negative
      staphylococcal infections (65.1%). Staphylococcus epidermidis was the
      most prevalent pathogen, with 86 isolates (25.7%), followed by
      Staphylococcus aureus, with 45 isolates (13.4%), and Streptococci, with
      20 isolates (6.0%).
    explanation: >-
      Quantifies the dominance of coagulase-negative staphylococci and S.
      epidermidis in one culture-positive PJI cohort.
- name: Cutibacterium acnes
  description: >-
    A skin sebaceous-gland commensal and predominant organism in
    shoulder-region prosthetic and postsurgical joint infections.
  infectious_agent_term:
    preferred_term: Cutibacterium acnes
    term:
      id: NCBITaxon:1747
      label: Cutibacterium acnes
  evidence:
  - reference: PMID:32197761
    reference_title: "Strategies to decolonize the shoulder of Cutibacterium acnes: a review of the literature."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Cutibacterium acnes is the most prevalent cause of joint infection after
      shoulder surgery.
    explanation: >-
      Supports C. acnes as a shoulder-predominant postsurgical joint pathogen.

pathophysiology:
- name: Perioperative or Hematogenous Prosthetic Seeding
  biological_scale: TISSUE
  description: >-
    Bacteria reach prosthetic material either during early postoperative wound
    contamination, as indolent low-grade infection recognized later, or by
    hematogenous seeding from a distant focus after the implant had been
    functioning well.
  locations:
  - preferred_term: synovial joint
    term:
      id: UBERON:0002217
      label: synovial joint
  downstream:
  - target: Prosthetic Joint Biofilm Formation
    description: >-
      Organisms that persist on the foreign surface adhere to the avascular
      implant and enter biofilm growth.
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:41511894
    reference_title: >-
      Staphylococcus aureus periprosthetic joint infection and its
      pathogenesis in total hip and knee arthroplasty: a narrative review.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Most PJIs diagnosed during the first postoperative year result from
      direct contact or aerosolized contamination of implants or surrounding
      soft tissues during surgery (27). ... Hematogenous dissemination from a
      distant site may occur throughout the patient's follow-up.
    explanation: >-
      Establishes perioperative contamination and later hematogenous spread as
      recognized routes of prosthetic-joint seeding.

- name: Prosthetic Joint Biofilm Formation
  biological_scale: CELLULAR
  description: >-
    S. aureus and coagulase-negative staphylococci attach to prosthetic
    material and produce a surface biofilm. The biofilm makes bacteria
    antibiotic-tolerant and physically shields them from host clearance, which
    converts a low-inoculum implant infection into a persistent nidus.
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
    modifier: INCREASED
  downstream:
  - target: Biofilm-Driven Monocyte Immune Modulation
    description: >-
      Factors released by biofilm-encased staphylococci reprogram nearby
      innate immune cells.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Persistent Culture-Negative Diagnostic Niche
    description: >-
      Biofilm encasement hinders standard culture recovery, motivating
      sonication, synovial biomarkers, and molecular diagnostics.
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:41511894
    reference_title: >-
      Staphylococcus aureus periprosthetic joint infection and its pathogenesis
      in total hip and knee arthroplasty: a narrative review.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Biofilm formation by S. aureus on prosthetic materials is central to PJI
      persistence and antibiotic resistance.
    explanation: >-
      Directly states that S. aureus biofilm on prosthetic material is central
      to persistence and antibiotic resistance in PJI.
  - reference: PMID:38922976
    reference_title: >-
      Staphyloccocus aureus biofilm, in absence of planktonic bacteria, produces
      factors that activate counterbalancing inflammatory and immune-suppressive
      genes in human monocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      S. aureus forms biofilms that promote persistent infection by shielding
      bacteria from immune cells and inducing an antibiotic-tolerant metabolic
      state.
    explanation: >-
      Provides the mechanistic premise for biofilm-protected persistence in an
      in-vitro study that then tested how S. aureus biofilm signals to primary
      human monocytes.

- name: Biofilm-Driven Monocyte Immune Modulation
  biological_scale: CELLULAR
  description: >-
    Diffusible products of S. aureus biofilm induce a mixed inflammatory and
    immunosuppressive transcriptional program in monocytes, including TNF and
    IL1B as inflammatory genes and IL-10, IL-1RA, and PD-1 ligands as
    counter-regulators that can dampen protective T-cell differentiation.
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  evidence:
  - reference: PMID:38922976
    reference_title: >-
      Staphyloccocus aureus biofilm, in absence of planktonic bacteria, produces
      factors that activate counterbalancing inflammatory and immune-suppressive
      genes in human monocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      S. aureus biofilm induced expression of inflammatory genes such as TNF and
      IL1B, and their anti-inflammatory counter-regulator IL10.
    explanation: >-
      Shows that biofilm alone can activate inflammatory and counter-regulatory
      transcription in primary human monocytes.
  - reference: PMID:38922976
    reference_title: >-
      Staphyloccocus aureus biofilm, in absence of planktonic bacteria, produces
      factors that activate counterbalancing inflammatory and immune-suppressive
      genes in human monocytes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      S. aureus biofilm also activated expression of PD-1 ligands, and IL-1RA,
      molecules that have the potential to suppress T cell function or
      differentiation of protective Th17 cells.
    explanation: >-
      Identifies specific suppressive mediators induced by S. aureus biofilm
      that could blunt protective T-cell responses in the infected joint.

- name: Persistent Culture-Negative Diagnostic Niche
  biological_scale: TISSUE
  description: >-
    Biofilm-restricted organisms can remain locally enclosed in the prosthetic
    joint and evade routine planktonic culture, making diagnosis depend on a
    composite of synovial fluid biomarkers, deep tissue culture with sonication
    where possible, and molecular sequencing in selected culture-negative cases.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  locations:
  - preferred_term: synovial membrane of synovial joint
    term:
      id: UBERON:0002018
      label: synovial membrane of synovial joint
  evidence:
  - reference: PMID:42524013
    reference_title: >-
      From serum inflammatory markers to fluid, tissue, and molecular assays:
      current advances in the laboratory diagnosis of bone and joint infections.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      At the tissue level, the integration of multiple deep-tissue sampling with
      preprocessing techniques like sonication has substantially enhanced the
      recovery of occult biofilm-encased pathogens.
    explanation: >-
      Supports the claim that biofilm-encased organisms can require tissue
      sampling plus sonication rather than ordinary culture alone.

phenotypes:
- name: Elevated C-reactive Protein
  category: Laboratory
  description: Serum C-reactive protein is a first-line inflammatory biomarker for PJI diagnosis.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Elevated circulating C-reactive protein concentration
    term:
      id: HP:0011227
      label: Elevated circulating C-reactive protein concentration
  evidence:
  - reference: PMID:42108508
    reference_title: >-
      Diagnostic accuracy of serum and synovial biomarker thresholds for
      diagnosing periprosthetic joint infection: a QUADAS-C-guided systematic
      review and meta-analysis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Among serum biomarkers, C-reactive protein and erythrocyte sedimentation
      rate showed moderate diagnostic accuracy (Area Under the ROC curve [AUC]
      0.82-0.90), while fibrinogen demonstrated comparable performance in
      selected cohorts.
    explanation: >-
      Establishes C-reactive protein as a serum inflammatory marker whose
      elevation is informative but not definitive for PJI.
- name: Elevated Erythrocyte Sedimentation Rate
  category: Laboratory
  description: ESR is a serum inflammatory biomarker used in first-line PJI workups.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Elevated erythrocyte sedimentation rate
    term:
      id: HP:0003565
      label: Elevated erythrocyte sedimentation rate
  evidence:
  - reference: PMID:42108508
    reference_title: >-
      Diagnostic accuracy of serum and synovial biomarker thresholds for
      diagnosing periprosthetic joint infection: a QUADAS-C-guided systematic
      review and meta-analysis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Among serum biomarkers, C-reactive protein and erythrocyte sedimentation
      rate showed moderate diagnostic accuracy (Area Under the ROC curve [AUC]
      0.82-0.90), while fibrinogen demonstrated comparable performance in
      selected cohorts.
    explanation: >-
      Establishes ESR as one of the serum inflammatory markers used to separate
      septic from aseptic arthroplasty failure.

treatments:
- name: Debridement, Antibiotics, and Implant Retention
  description: >-
    Debridement with targeted antibiotics while retaining the implant is used
    for early postoperative or acute hematogenous PJI, where biofilm is still
    potentially thin enough for surgical cleaning and antimicrobials to control
    the infection without removing fixed components.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Debridement
    term:
      id: NCIT:C51682
      label: Debridement
  target_mechanisms:
  - target: Prosthetic Joint Biofilm Formation
    treatment_effect: INHIBITS
    description: >-
      DAIR tries to reduce planktonic and early adherent organisms before a
      mature biofilm makes implant retention unreliable.
    evidence:
    - reference: PMID:37714518
      reference_title: >-
        Debridement, antibiotics, and implant retention (DAIR) for the early
        prosthetic joint infection of total knee and hip arthroplasties: a
        systematic review.
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Success rates for the DAIR treatments in the following cohort ranged
        from 55.5% up to a maximum of 90% (mean value of 71%).
      explanation: >-
        Quantifies DAIR outcomes in an early postoperative and acute
        hematogenous PJI systematic review.
- name: Two-Stage Exchange Arthroplasty
  description: >-
    Removal of infected components, placement of an antibiotic spacer, and
    later reimplantation of a new prosthesis. It physically removes the
    biofilm-bearing implant and is the established surgical strategy for
    chronic knee or hip PJI when retention is unlikely to clear infection.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Prosthetic Joint Biofilm Formation
    treatment_effect: BYPASSES
    description: >-
      Exchange arthroplasty removes the colonized hardware instead of relying
      on antimicrobials to sterilize organisms embedded on its surface.
    evidence:
    - reference: PMID:39814115
      reference_title: >-
        Rethinking Repeat Two-Stage Knee Exchange Arthroplasty: Outcomes, Risks,
        and Decision-Making.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Kaplan-Meier analysis of 1,119 initial, 75 repeat, and 24 re-repeat
        two-stage cases revealed 5-year infection-free survival rates of 93,
        72, and 43%, respectively.
      explanation: >-
        Demonstrates high infection-free survival after first two-stage
        exchange in a chronic knee PJI cohort and falling success when the same
        strategy must be repeated after reinfection.
- name: Rifampicin-Combination Antibiotic Therapy
  description: >-
    Biofilm-active antimicrobial therapy used as an adjunct to surgery for
    susceptible staphylococcal PJI. Rifampicin is combined with another active
    agent rather than used alone, because monotherapy rapidly selects resistant
    mutants.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
  target_mechanisms:
  - target: Prosthetic Joint Biofilm Formation
    treatment_effect: INHIBITS
    description: >-
      Rifampicin-containing regimens are chosen because staphylococcal PJI
      organisms persist inside implant biofilm.
    evidence:
    - reference: PMID:39882934
      reference_title: Effectiveness of clindamycin-based exposure strategies in experimental mature staphylococcal biofilms.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Rifampicin-in combination with another antibiotics-is recommended in all
        guidelines as first choice treatment of prosthetic joint infections
        (PJIs), despite adverse interactions and side effects associated with
        this antibiotic.
      explanation: >-
        States the guideline position this treatment records and the adverse
        interaction trade-off that makes shorter rifampicin exposure a research
        question.

diagnosis:
- name: Composite MSIS, ICM, EBJIS, or IDSA Criteria
  description: >-
    PJI diagnosis is a composite judgment across clinical findings,
    microbiology, histopathology, serum inflammatory markers, and synovial-fluid
    leukocyte or biomarker testing; competing MSIS, ICM, EBJIS, and IDSA
    definitions do not classify identical patients in exactly the same way.
  markers: CRP, ESR, synovial WBC, synovial PMN%, alpha-defensin, calprotectin, D-lactate
  evidence:
  - reference: PMID:42108508
    reference_title: >-
      Diagnostic accuracy of serum and synovial biomarker thresholds for
      diagnosing periprosthetic joint infection: a QUADAS-C-guided systematic
      review and meta-analysis.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Synovial biomarkers demonstrated superior diagnostic performance.
      alpha-defensin, D-lactate, calprotectin (CP), and neutrophil
      gelatinase-associated lipocalin achieved excellent accuracy (AUC > 0.90;
      sensitivity and specificity > 90%).
    explanation: >-
      Supports synovial biomarkers as a high-performing part of the composite
      diagnostic workup.
- name: Metagenomic Next-Generation Sequencing
  description: >-
    Sequencing can supplement conventional culture in culture-negative,
    low-virulence, polymicrobial, or otherwise complex PJI, while interpretation
    remains limited by contamination and protocol heterogeneity.
  diagnosis_term:
    preferred_term: Next Generation Sequencing
    term:
      id: NCIT:C101293
      label: Next Generation Sequencing
  evidence:
  - reference: PMID:42746583
    reference_title: >-
      Current Concepts in Periprosthetic Joint Infection: Modern Biomarkers,
      Microbiome Insights, Molecular Diagnostics, and Emerging Prevention
      Strategies.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Molecular approaches, particularly metagenomic next-generation
      sequencing, improve pathogen detection in complex infections but remain
      limited by cost, protocol variability, and challenges in distinguishing
      clinically relevant pathogens from contaminants.
    explanation: >-
      Captures both the value of metagenomic sequencing in complex PJI and the
      specificity caveat that keeps it adjunctive rather than standalone.

progression:
- phase: Early postoperative infection
  notes: >-
    Acute infection soon after arthroplasty often involves high-virulence
    organisms, especially S. aureus and aerobic gram-negative bacilli.
  evidence:
  - reference: PMID:41511894
    reference_title: >-
      Staphylococcus aureus periprosthetic joint infection and its
      pathogenesis in total hip and knee arthroplasty: a narrative review.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Acute PJIs often involve S. aureus and aerobic gram-negative bacilli,
      comprising 60% of infections due to their high virulence (46).
    explanation: >-
      Supports the high-virulence organism pattern recorded for the acute PJI
      phase.
- phase: Late chronic infection
  notes: >-
    Indolent PJI months to years after surgery is usually associated with
    lower-virulence organisms, including coagulase-negative staphylococci.
  evidence:
  - reference: PMID:41511894
    reference_title: >-
      Staphylococcus aureus periprosthetic joint infection and its
      pathogenesis in total hip and knee arthroplasty: a narrative review.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Late chronic PJIs are usually caused by low-virulence microorganisms, such
      as CoNS and Enterococci, with aerobic gram-negative bacilli being less
      common.
    explanation: >-
      Supports the lower-virulence organism pattern recorded for late chronic
      PJI.

notes: >-
  The pathograph stops before the clinical arthroplasty-failure endpoint: PJI
  can drive osteolysis and implant loosening, but the OpenScientist report's
  strongest osteoclast and osteoblast leads came from S. aureus osteomyelitis
  models rather than from a prosthetic-joint model, so those claims were left
  out of the curated causal chain. Host variants such as DEFB1 rs1800972 may
  modify PJI susceptibility, but the available report supported them with small
  candidate-gene cohorts, not with causal Mendelian evidence.

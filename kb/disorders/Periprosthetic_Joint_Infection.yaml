    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Dogs in the case series developed infection after total hip replacement,
      providing a veterinary comparator for post-arthroplasty bacterial seeding.
    limitations: >-
      A spontaneous eight-case canine series; the small sample and species
      differences in implant design, gait loading, and immunity limit
      extrapolation to human PJI.
  - target: Painful Prosthesis Failure
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Canine cases required arthroscopic treatment or planned revision surgery
      for infected total hip replacements, recapitulating the source-control
      endpoint of human PJI.
    limitations: >-
      Outcomes come from eight dogs managed arthroscopically; sample size and
      species differences limit how far the failure and source-control endpoint
      transfer to human PJI.

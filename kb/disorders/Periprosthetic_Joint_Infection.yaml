review_notes: >-
  Deliberately lumped. Periprosthetic joint infection is scoped by a shared
  prosthesis-associated surface and biofilm niche rather than by one bacterial
  species. Staphylococcus aureus, Staphylococcus epidermidis, streptococci, and
  other culture-positive bacteria are therefore kept as agents in one
  implant-infection entry until curated evidence separates organism-specific
  pathographs that are not merely frequency strata.

  HP:0025580 (wound complication), HP:0012311 (synovial leukocytosis), and
  HP:0000988 (erythema/rash) were considered but not bound, because their
  ontology labels do not match the intended PJI meanings.

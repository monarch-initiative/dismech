name: Periprosthetic Joint Infection
creation_date: "2026-09-30T09:32:58Z"
description: >-
  Periprosthetic joint infection is a bacterial infection of an implanted joint
  arthroplasty in which perioperative contamination, contiguous spread, or
  hematogenous seeding lets staphylococci and other bacteria attach to
  prosthesis-associated surfaces, form biofilm, evade local clearance, and drive
  chronic inflammatory implant failure.
category: Infectious Disease
disease_term:
  preferred_term: periprosthetic joint infection
  term:
    id: MONDO:0800179
    label: periprosthetic joint infection
parents:
- Bacterial arthritis
synonyms:
- Prosthetic joint infection
- PJI
infectious_agent:
- name: Staphylococcus aureus
  description: >-
    Staphylococcus aureus is a biofilm-forming staphylococcal pathogen and a
    major cause of periprosthetic joint infection.
  infectious_agent_term:
    preferred_term: Staphylococcus aureus
    term:
      id: NCBITaxon:1280
      label: Staphylococcus aureus
  evidence:
  - reference: PMID:41511894
    reference_title: "Staphylococcus aureus periprosthetic joint infection and its pathogenesis in total hip and knee arthroplasty: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Staphylococcus aureus is the most common pathogen in periprosthetic joint
      infections (PJIs), capable of biofilm formation and resistance mechanisms,
      complicating diagnosis and treatment.
    explanation: >-
      A narrative review identifies S. aureus as a leading PJI pathogen and
      links the organism to biofilm-mediated persistence.
- name: Staphylococcus epidermidis
  description: >-
    Staphylococcus epidermidis is a coagulase-negative staphylococcus isolated
    frequently from hip and knee PJI cohorts.
  infectious_agent_term:
    preferred_term: Staphylococcus epidermidis
    term:
      id: NCBITaxon:1282
      label: Staphylococcus epidermidis
  evidence:
  - reference: PMID:40713651
    reference_title: "Organism profiles and empirical treatments for periprosthetic joint infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Staphylococcus epidermidis was the most prevalent pathogen, with 86
      isolates (25.7%), followed by Staphylococcus aureus, with 45 isolates
      (13.4%), and Streptococci, with 20 isolates (6.0%).
    explanation: >-
      Reports S. epidermidis as the most common species recovered in a
      retrospective hip and knee PJI cohort.
- name: Streptococcus
  description: >-
    Streptococci are less frequent Gram-positive PJI pathogens recovered from a
    subset of culture-positive hip and knee infections.
  infectious_agent_term:
    preferred_term: Streptococcus
    term:
      id: NCBITaxon:1301
      label: Streptococcus
  evidence:
  - reference: PMID:40713651
    reference_title: "Organism profiles and empirical treatments for periprosthetic joint infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Staphylococcus epidermidis was the most prevalent pathogen, with 86
      isolates (25.7%), followed by Staphylococcus aureus, with 45 isolates
      (13.4%), and Streptococci, with 20 isolates (6.0%).
    explanation: >-
      Identifies streptococci among culture-positive organisms from the same
      hip and knee PJI series.
classifications:
  harrisons_chapter:
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Perioperative or hematogenous arthroplasty seeding
  description: >-
    Bacteria reach prosthetic joint surfaces by intraoperative contamination,
    contiguous wound spread, or later hematogenous seeding from a distant
    infection focus.
  evidence:
  - reference: PMID:41511894
    reference_title: "Staphylococcus aureus periprosthetic joint infection and its pathogenesis in total hip and knee arthroplasty: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Most PJIs diagnosed during the first postoperative year result from direct
      contact or aerosolized contamination of implants or surrounding soft
      tissues during surgery
    explanation: >-
      Supports perioperative contamination during surgery as a principal route
      by which bacteria reach the prosthetic joint.
environmental:
- name: Implanted joint arthroplasty hardware
  description: >-
    A prosthetic hip or knee provides foreign surfaces that bacteria can
    contaminate during implantation and colonize as an adherent biofilm.
  disease_effect: PREDISPOSES
  influences_mechanisms:
  - target: Bacterial Seeding of Arthroplasty Hardware
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Intraoperative contamination introduces bacteria directly onto the implant
      or into adjacent periprosthetic tissue.
  evidence:
  - reference: PMID:41511894
    reference_title: "Staphylococcus aureus periprosthetic joint infection and its pathogenesis in total hip and knee arthroplasty: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Most PJIs diagnosed during the first postoperative year result from direct
      contact or aerosolized contamination of implants or surrounding soft
      tissues during surgery
    explanation: >-
      Supports perioperative arthroplasty contamination as an initiating
      exposure for early PJI.
- name: Persistent wound drainage after arthroplasty
  description: >-
    Continued wound leakage after total joint arthroplasty marks impaired
    closure and strongly increases subsequent PJI risk.
  disease_effect: PREDISPOSES
  influences_mechanisms:
  - target: Bacterial Seeding of Arthroplasty Hardware
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Ongoing drainage signals a postoperative wound environment in which
      communication with deeper tissues can permit bacterial access to the
      prosthetic joint.
  evidence:
  - reference: PMID:31516977
    reference_title: "The risk factors and an evidence-based protocol for the management of persistent wound drainage after total hip and knee arthroplasty."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Compared to those patients without wound drainage, the TJAs complicated
      by wound drainage demonstrated an OR of 16.9 (95% CI 9.1-31.6) for
      developing PJI.
    explanation: >-
      Quantifies a strong one-year association between persistent wound drainage
      after arthroplasty and subsequent PJI.
pathophysiology:
- name: Bacterial Seeding of Arthroplasty Hardware
  role: trigger
  biological_scale: TISSUE
  description: >-
    Bacteria reach the prosthetic joint space or peri-implant tissue at the time
    of surgery, from a neighboring focus, or through late bloodstream spread.
  locations:
  - preferred_term: synovial joint
    term:
      id: UBERON:0002217
      label: synovial joint
  downstream:
  - target: Prosthesis Biofilm Formation
    causal_link_type: DIRECT
    description: >-
      Once organisms reach prosthetic surfaces, adherent growth lets them
      assemble extracellular biofilm matrix.
  evidence:
  - reference: PMID:41511894
    reference_title: "Staphylococcus aureus periprosthetic joint infection and its pathogenesis in total hip and knee arthroplasty: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Another initiation mechanism is contiguous dissemination from a nearby
      focus.
    explanation: >-
      The review describes spread from an adjacent focus as one non-hematogenous
      route into the prosthetic joint space.
  - reference: PMID:41511894
    reference_title: "Staphylococcus aureus periprosthetic joint infection and its pathogenesis in total hip and knee arthroplasty: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      hematogenous long-bone osteomyelitis may begin at the metaphysis and
      progress to the joint space, affecting the prosthesis
    explanation: >-
      Covers the third seeding route named in the node description, bloodstream
      spread from a distant focus reaching the prosthesis.
- name: Prosthesis Biofilm Formation
  biological_scale: TISSUE
  description: >-
    S. aureus and coagulase-negative staphylococci attach to prosthetic material
    and surrounding tissues as a structured biofilm that shelters sessile
    organisms from antibiotic killing and host phagocytes.
  biological_processes:
  - preferred_term: biofilm formation
    term:
      id: GO:0042710
      label: biofilm formation
  locations:
  - preferred_term: synovial membrane of synovial joint
    term:
      id: UBERON:0002018
      label: synovial membrane of synovial joint
  downstream:
  - target: Biofilm-Driven Monocyte Pro-Inflammatory Activation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Biofilm signals activate infiltrating monocytes toward a pro-inflammatory
      program.
  - target: Biofilm-Driven Monocyte Immunosuppressive Programming
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      The same biofilm signals induce counter-regulatory immunosuppressive
      programs that favor bacterial persistence.
  evidence:
  - reference: PMID:41511894
    reference_title: "Staphylococcus aureus periprosthetic joint infection and its pathogenesis in total hip and knee arthroplasty: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Biofilm formation by S. aureus on prosthetic materials is central to PJI
      persistence and antibiotic resistance.
    explanation: >-
      Supports biofilm formation on prosthetic material as a core mechanism of
      persistence in S. aureus PJI.
  - reference: PMID:41511894
    reference_title: "Staphylococcus aureus periprosthetic joint infection and its pathogenesis in total hip and knee arthroplasty: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The extracellular matrix, composed of polysaccharides and proteins,
      protects biofilms against antibiotics and immune responses, making
      treatment challenging and often requiring implant removal via surgery.
    explanation: >-
      The biofilm extracellular matrix shields the embedded organisms from
      antibiotics and host immunity, central to the persistence this node
      represents.
- name: Biofilm-Driven Monocyte Pro-Inflammatory Activation
  biological_scale: CELLULAR
  description: >-
    Staphylococcal biofilm factors activate inflammatory monocytes, inducing
    pro-inflammatory cytokine expression.
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Chronic Periprosthetic Inflammation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Monocyte-derived pro-inflammatory cytokines sustain inflammation at the
      implant-bone interface.
  evidence:
  - reference: PMID:38922976
    reference_title: "Staphyloccocus aureus biofilm, in absence of planktonic bacteria, produces factors that activate counterbalancing inflammatory and immune-suppressive genes in human monocytes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      biofilm induced expression of inflammatory genes such as TNF and IL1B, and
      their anti-inflammatory counter-regulator IL10.
    explanation: >-
      Primary human monocytes exposed to S. aureus biofilm up-regulate the
      pro-inflammatory cytokines this node represents.
- name: Biofilm-Driven Monocyte Immunosuppressive Programming
  biological_scale: CELLULAR
  description: >-
    Staphylococcal biofilm induces IL-1RA and PD-1 ligand programs in monocytes
    that restrain protective T-cell and Th17 clearance responses.
  cell_types:
  - preferred_term: monocyte
    term:
      id: CL:0000576
      label: monocyte
  biological_processes:
  - preferred_term: negative regulation of T cell activation
    modifier: INCREASED
    term:
      id: GO:0050868
      label: negative regulation of T cell activation
  downstream:
  - target: Chronic Periprosthetic Inflammation
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Immune deviation favors bacterial persistence and sustained peri-implant
      inflammation.
  evidence:
  - reference: PMID:38922976
    reference_title: "Staphyloccocus aureus biofilm, in absence of planktonic bacteria, produces factors that activate counterbalancing inflammatory and immune-suppressive genes in human monocytes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      S. aureus biofilm also activated expression of PD-1 ligands, and IL-1RA,
      molecules that have the potential to suppress T cell function or
      differentiation of protective Th17 cells.
    explanation: >-
      Primary human monocytes exposed to S. aureus biofilm up-regulate PD-1
      ligands and IL-1RA, the immunosuppressive program this node represents.
- name: Chronic Periprosthetic Inflammation
  biological_scale: TISSUE
  description: >-
    Persistent biofilm-associated infection sustains inflammatory injury at the
    peri-implant synovium, bone, and soft-tissue interface.
  downstream:
  - target: Osteoclast-Mediated Periprosthetic Osteolysis
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Sustained peri-implant inflammation drives osteoclast activation and
      periprosthetic bone resorption.
  - target: Arthralgia
    description: >-
      Peri-implant inflammation produces pain in the affected prosthetic joint.
  - target: Joint Swelling
    description: >-
      Peri-implant inflammation produces swelling of the affected joint.
  evidence:
  - reference: PMID:42524013
    reference_title: "From serum inflammatory markers to fluid, tissue, and molecular assays: current advances in the laboratory diagnosis of bone and joint infections."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Histopathology provides important morphological evidence for bone and
      joint infections by directly visualizing acute inflammatory cell
      infiltration in infected bone tissue, periprosthetic membranes, and
      adjacent soft tissues.
    explanation: >-
      Histopathology of infected periprosthetic tissue visualizes the acute
      inflammatory infiltration this node represents.
- name: Osteoclast-Mediated Periprosthetic Osteolysis
  biological_scale: CELLULAR
  description: >-
    Persistent peri-implant infection drives osteoclast-mediated bone resorption,
    producing periprosthetic osteolysis at the bone-implant interface.
  cell_types:
  - preferred_term: osteoclast
    term:
      id: CL:0000092
      label: osteoclast
  biological_processes:
  - preferred_term: bone resorption
    modifier: INCREASED
    term:
      id: GO:0045453
      label: bone resorption
  downstream:
  - target: Periprosthetic Implant Loosening
    causal_link_type: DIRECT
    description: >-
      Periprosthetic bone loss undermines implant fixation.
  evidence:
  - reference: PMID:38922976
    reference_title: "Staphyloccocus aureus biofilm, in absence of planktonic bacteria, produces factors that activate counterbalancing inflammatory and immune-suppressive genes in human monocytes."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      Lack of clearance of bacterial pathogens like S. aureus in response to
      antibiotic therapy results in persistent infections that cause pain, bone
      loss, and decreased mobility
    explanation: >-
      Attributes the bone loss of persistent S. aureus implant infection, the
      substrate of this osteolysis node, to failure of pathogen clearance.
- name: Periprosthetic Implant Loosening
  biological_scale: TISSUE
  description: >-
    Osteolytic bone loss at the interface loosens the prosthesis, a mechanical
    endpoint of chronic infection.
  downstream:
  - target: Painful Prosthesis Failure
    causal_link_type: DIRECT
    description: >-
      Loss of implant fixation produces the painful, failing arthroplasty.
  - target: Implant loosening
    description: >-
      Loss of fixation presents clinically as implant loosening.
  evidence:
  - reference: PMID:40468465
    reference_title: "Periprosthetic joint infection of megaprostheses for oncologic and non-oncologic indications-IMPLANT retention or removal? A retrospective cohort study of 50 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For implant removal, assumed chronic infections or septic loosening are
      the most frequently used indications
    explanation: >-
      Ties septic loosening to chronic periprosthetic infection as an
      indication for implant removal.
- name: Painful Prosthesis Failure
  biological_scale: ORGANISM
  description: >-
    The infected arthroplasty develops pain, loss of function, loosening, sinus
    tracts, or systemic illness requiring antimicrobial therapy plus surgical
    source control.
  downstream:
  - target: Fever
    description: >-
      Systemic illness from the infected prosthesis produces fever.
  - target: Sepsis
    description: >-
      Severe systemic infection can produce septic physiology.
  - target: Sinus tract
    description: >-
      Chronic infection can drain through a sinus tract to the skin.
  evidence:
  - reference: PMID:41511894
    reference_title: "Staphylococcus aureus periprosthetic joint infection and its pathogenesis in total hip and knee arthroplasty: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      PJIs remain a leading cause of total joint arthroplasty failure and are
      associated with significant morbidity, mortality, and healthcare and
      economic burdens.
    explanation: >-
      Establishes PJI as a major failure mode of total joint arthroplasty.
phenotypes:
- name: Arthralgia
  phenotype_term:
    preferred_term: Arthralgia
    term:
      id: HP:0002829
      label: Arthralgia
  description: >-
    Pain in the affected prosthetic joint is a local manifestation of acute PJI.
  evidence:
  - reference: PMID:40713651
    reference_title: "Organism profiles and empirical treatments for periprosthetic joint infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      pronounced joint swelling, local warmth and pain, and synovial fluid
      leakage
    explanation: >-
      Lists pain among severe local manifestations that can force immediate
      intervention in acute PJI.
- name: Joint Swelling
  phenotype_term:
    preferred_term: Joint swelling
    term:
      id: HP:0001386
      label: Joint swelling
  description: >-
    The infected prosthetic joint can become swollen as acute inflammation
    develops.
  evidence:
  - reference: PMID:40713651
    reference_title: "Organism profiles and empirical treatments for periprosthetic joint infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      pronounced joint swelling, local warmth and pain, and synovial fluid
      leakage
    explanation: >-
      Lists pronounced joint swelling as a severe local presentation of acute
      PJI.
- name: Fever
  phenotype_term:
    preferred_term: Fever
    term:
      id: HP:0001945
      label: Fever
  description: >-
    Fever can accompany acute postoperative PJI when the infection has systemic
    inflammatory manifestations.
  evidence:
  - reference: PMID:40713651
    reference_title: "Organism profiles and empirical treatments for periprosthetic joint infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      systemic symptoms (e.g., fever, signs of sepsis)
    explanation: >-
      Describes fever as a systemic symptom that can accompany acute PJI
      requiring urgent surgery.
- name: Sepsis
  phenotype_term:
    preferred_term: Sepsis
    term:
      id: HP:0100806
      label: Sepsis
  description: >-
    Acute PJI can rarely present with systemic septic physiology that requires
    urgent culture collection, antibiotics, and surgical source control.
  evidence:
  - reference: PMID:40713651
    reference_title: "Organism profiles and empirical treatments for periprosthetic joint infections."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: >-
      systemic symptoms (e.g., fever, signs of sepsis)
    explanation: >-
      Uses signs of sepsis as an example of systemic acute PJI manifestations
      that drive urgent management.
- name: Sinus tract
  description: >-
    A draining sinus tract communicating with the prosthesis is a major
    (pathognomonic) diagnostic criterion for PJI.
  phenotype_term:
    preferred_term: Sinus tract
    term:
      id: HP:6000095
      label: Draining sinus tract in skin
  evidence:
  - reference: PMID:41511894
    reference_title: "Staphylococcus aureus periprosthetic joint infection and its pathogenesis in total hip and knee arthroplasty: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      MSIS classification encompasses major criteria, such as sinus tract and
      pathogen isolation, and minor criteria, including serum markers, synovial
      fluid (SF) analysis, histopathology, and culture results
    explanation: >-
      Names a sinus tract as a major MSIS diagnostic criterion for PJI.
- name: Implant loosening
  description: >-
    Loosening of the prosthesis is a mechanical manifestation of chronic PJI. No
    specific HP term for prosthesis loosening is available, so the ontology
    binding is omitted.
  phenotype_term:
    preferred_term: Implant loosening
  evidence:
  - reference: PMID:40468465
    reference_title: "Periprosthetic joint infection of megaprostheses for oncologic and non-oncologic indications-IMPLANT retention or removal? A retrospective cohort study of 50 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      For implant removal, assumed chronic infections or septic loosening are
      the most frequently used indications
    explanation: >-
      Ties septic loosening to chronic periprosthetic infection as an
      indication for implant removal.
diagnosis:
- name: PJI diagnostic criteria
  description: >-
    PJI is diagnosed by composite criteria (MSIS/ICM/EBJIS) combining a sinus
    tract or pathogen isolation with serum markers, synovial fluid analysis,
    histopathology, and culture; synovial biomarkers and sonication improve
    sensitivity.
  evidence:
  - reference: PMID:41511894
    reference_title: "Staphylococcus aureus periprosthetic joint infection and its pathogenesis in total hip and knee arthroplasty: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      MSIS classification encompasses major criteria, such as sinus tract and
      pathogen isolation, and minor criteria, including serum markers, synovial
      fluid (SF) analysis, histopathology, and culture results
    explanation: >-
      Describes the MSIS composite criteria for diagnosing PJI.
  - reference: PMID:42524013
    reference_title: "From serum inflammatory markers to fluid, tissue, and molecular assays: current advances in the laboratory diagnosis of bone and joint infections."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      novel synovial fluid biomarkers, notably calprotectin and alpha-defensin,
      accurately reflect the infection microenvironment and offer exceptional
      diagnostic specificity
    explanation: >-
      Supports synovial calprotectin and alpha-defensin as specific PJI
      diagnostic biomarkers.
treatments:
- name: Debridement, Antibiotics, and Implant Retention
  description: >-
    DAIR is an early-postoperative or acute-hematogenous PJI source-control
    strategy that surgically debrides infected tissue and exchanges modular
    components while retaining fixed implant components.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Debridement
    term:
      id: NCIT:C51682
      label: Debridement
  target_mechanisms:
  - target: Prosthesis Biofilm Formation
    treatment_effect: INHIBITS
    description: >-
      Debridement lowers the adherent and planktonic bacterial burden before
      retained-hardware antimicrobial therapy.
  evidence:
  - reference: PMID:37714518
    reference_title: "Debridement, antibiotics, and implant retention (DAIR) for the early prosthetic joint infection of total knee and hip arthroplasties: a systematic review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Success rates for the DAIR treatments in the following cohort ranged from
      55.5% up to a maximum of 90% (mean value of 71%).
    explanation: >-
      A systematic review found that DAIR had variable but substantial success
      rates for early hip and knee PJI cohorts.
- name: Vancomycin and Rifampicin-Based Anti-Staphylococcal Therapy
  description: >-
    MRSA or other staphylococcal PJI is treated with pathogen-directed
    anti-staphylococcal therapy; vancomycin is used up front for MRSA, and
    rifampicin is added only in combination when a prosthesis is retained or
    reimplanted.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: vancomycin
      term:
        id: CHEBI:28001
        label: vancomycin
    - preferred_term: rifampicin
      term:
        id: CHEBI:28077
        label: rifampicin
  target_mechanisms:
  - target: Prosthesis Biofilm Formation
    treatment_effect: INHIBITS
    description: >-
      Rifampicin-containing combination regimens are used for their activity
      against staphylococci growing on retained or newly implanted prosthetic
      surfaces.
  evidence:
  - reference: PMID:41511894
    reference_title: "Staphylococcus aureus periprosthetic joint infection and its pathogenesis in total hip and knee arthroplasty: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Intravenous vancomycin remains first-line, administered at 15-20 mg/kg
      every 8-12 h
    explanation: >-
      Supports vancomycin as first-line intravenous therapy for MRSA PJI in this
      narrative synthesis.
  - reference: PMID:41511894
    reference_title: "Staphylococcus aureus periprosthetic joint infection and its pathogenesis in total hip and knee arthroplasty: a narrative review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Rifampin should be initiated a few days after starting antimicrobial
      therapy and debridement, as an adjunctive agent due to its biofilm
      activity
    explanation: >-
      Supports adding rifampin to an anti-staphylococcal partner when treating
      biofilm-associated S. aureus PJI after debridement.
- name: Two-stage exchange arthroplasty
  description: >-
    Two-stage revision (resection, an interval of antibiotics, then
    reimplantation) is the most successful option for chronic PJI, at the cost
    of multiple surgeries.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Orthopedic Surgical Procedure
    term:
      id: NCIT:C16186
      label: Orthopedic Surgical Procedure
  target_mechanisms:
  - target: Prosthesis Biofilm Formation
    treatment_effect: INHIBITS
    description: >-
      Removing the infected implant eradicates the biofilm reservoir before
      reimplantation.
  evidence:
  - reference: PMID:40468465
    reference_title: "Periprosthetic joint infection of megaprostheses for oncologic and non-oncologic indications-IMPLANT retention or removal? A retrospective cohort study of 50 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Two-stage revision is the most promising treatment option, but it requires
      patients to be able to cope with the burden of multiple surgeries.
    explanation: >-
      A retrospective megaprosthesis cohort finds two-stage revision the most
      promising PJI treatment option, though on small numbers (two-stage
      succeeded in 5 of 7, 71.4%).

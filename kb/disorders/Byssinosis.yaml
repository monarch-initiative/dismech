- name: Exposure Tolerance Across the Working Week
  description: >-
    With continued exposure the acute cross-shift and cross-week falls shrink in
    magnitude — over the first working week, and further over the first year of
    employment. This tolerance is what produces the Monday pattern: the response
    is largest after a break and smaller on subsequent days. Crucially it is
    tolerance of the acute response only, and does not indicate that the
    underlying process has stopped.
  role: modifier
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:17693783
    reference_title: "Natural history and risk factors of early respiratory responses to exposure to cotton dust in newly exposed workers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cross-first-shift and cross-week falls in FEV1 reduced in magnitude during the course of the study."
    explanation: >-
      Direct measurement of the attenuation over the first year in workers naive
      to cotton dust at enrolment.
  - reference: PMID:17693783
    reference_title: "Natural history and risk factors of early respiratory responses to exposure to cotton dust in newly exposed workers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "a tolerance effect develops in those workers with the continued exposure"
    explanation: >-
      Names the phenomenon as tolerance in the authors' own words, which is what
      this node is called after.
- name: Chronic Airway Inflammation and Remodeling
  description: >-
    Sustained low-grade airway inflammation from repeated exposure drives
    structural change — chronic bronchitis and small-airway narrowing. This is
    the arm that carries the disease from a reversible daily response to a fixed
    deficit, and it is driven by cumulative past exposure rather than by recent
    exposure.
  role: driver
  biological_scale: TISSUE
  locations:
  - preferred_term: bronchiole
    term:
      id: UBERON:0002186
      label: bronchiole
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: INCREASED
  downstream:
  - target: Chronic Airflow Obstruction and Accelerated FEV1 Loss
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20797932
      reference_title: "Chronic lung function decline in cotton textile workers: roles of historical and recent exposures to endotoxin."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Past exposure to endotoxin was associated with reduced FEV1 level among retired cotton workers."
      explanation: >-
        Sources this edge on the cumulative arm: the sustained inflammatory
        exposure history, not recent exposure, is what carries the fixed
        deficit.
  - target: Chronic bronchitis
  evidence:
  - reference: PMID:20797932
    reference_title: "Chronic lung function decline in cotton textile workers: roles of historical and recent exposures to endotoxin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recent endotoxin exposure was significantly associated with byssinosis, chronic bronchitis, and chronic cough."
    explanation: >-
      Attaches the symptomatic and bronchitic manifestations to recent exposure,
      the half of the temporal split this node sits on.
- name: Chronic Airflow Obstruction and Accelerated FEV1 Loss
  description: >-
    Fixed, non-reversible airflow obstruction with an accelerated annual decline
    in FEV1 — about 10 mL/year above baseline attributable to cotton dust, plus a
    further increment scaled to the size of earlier acute drops. Past cumulative
    endotoxin exposure predicts this decline while recent exposure predicts
    current symptoms, so the chronic and acute phases are measurably decoupled
    rather than two views of one process.
  role: consequence
  biological_scale: ORGANISM
  downstream:
  - target: Reduced forced expiratory volume in one second
  - target: Reduced FEV1/FVC ratio
  - target: Wheezing
  evidence:
  - reference: PMID:20797932
    reference_title: "Chronic lung function decline in cotton textile workers: roles of historical and recent exposures to endotoxin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Past exposure to endotoxin was associated with reduced FEV1 level among retired cotton workers."
    explanation: >-
      Sources the past-exposure half of the temporal decoupling, measured in
      workers no longer exposed at all.
  - reference: PMID:17975204
    reference_title: "Cross-shift airway responses and long-term decline in FEV1 in cotton textile workers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The magnitude and frequency of cross-shift drops were associated with chronic loss in FEV(1) over the entire 20-year period examined."
    explanation: >-
      The 20-year result establishing that this node's deficit is predicted by
      the acute response, not merely coincident with the same exposure.
  - reference: PMID:17693783
    reference_title: "Natural history and risk factors of early respiratory responses to exposure to cotton dust in newly exposed workers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The mean longitudinal fall in FEV1 at 1 year was 65.5 mL (standard error = 37.2)."
    explanation: >-
      Measures the first-year loss in newly exposed workers, showing the chronic
      arm begins accruing well before the acute response has faded.
phenotypes:
- name: Chest tightness
  category: Respiratory
  description: >-
    Work-related chest tightness, characteristically worst on the first working
    day after a break. This single symptom is the WHO case definition of
    byssinosis and the basis of the original Schilling grading, which makes it
    the defining phenotype rather than one manifestation among many.
  phenotype_term:
    preferred_term: Chest tightness
    term:
      id: HP:0031352
      label: Chest tightness
  frequency: OBLIGATE
  diagnostic: true
  evidence:
  - reference: PMID:14437722
    reference_title: "A clinical and environmental study of byssinosis in the Lancashire cotton industry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Grade 1—Chest tightness and/or breathlessness on Mondays only"
    explanation: >-
      The original grading definition, in which work-related chest tightness on
      Mondays is the criterion that establishes byssinosis. OBLIGATE follows
      from this being the case definition rather than from a measured case
      series: a patient without it is not graded as having the disease.
  notes: >-
    The frequency is OBLIGATE by definition, not by observation. Note the
    denominator distinction this entry keeps: the systematic-review range of
    4-58% for chest tightness is prevalence among *exposed textile workers* and
    is curated under `prevalence:`, not as a frequency among cases. Reading that
    range as a case frequency would be a denominator error.
- name: Airway hyperresponsiveness
  category: Respiratory
  description: >-
    Heightened bronchial reactivity following cotton dust exposure, demonstrated
    by an increased response to methacholine challenge after inhalation of cotton
    dust or bract extract.
  phenotype_term:
    preferred_term: Airway hyperresponsiveness
    term:
      id: HP:0032933
      label: Airway hyperresponsiveness
  evidence:
  - reference: PMID:16179819
    reference_title: "Airway responses to the inhalation of cotton dust and cotton bract extracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All subjects enhanced their MCh response following CBE or CDE."
    explanation: >-
      Every subject showed increased methacholine responsiveness after cotton
      extract challenge, which is the direct measurement of this phenotype.
- name: Chronic bronchitis
  category: Respiratory
  description: >-
    Chronic cough with sputum production in long-exposed workers, associated with
    recent rather than cumulative past endotoxin exposure.
  phenotype_term:
    preferred_term: Chronic bronchitis
    term:
      id: HP:0004469
      label: Chronic bronchitis
    temporality: CHRONIC
  evidence:
  - reference: PMID:20797932
    reference_title: "Chronic lung function decline in cotton textile workers: roles of historical and recent exposures to endotoxin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Recent endotoxin exposure was significantly associated with byssinosis, chronic bronchitis, and chronic cough."
    explanation: >-
      Associates chronic bronchitis specifically with recent endotoxin exposure
      in the 25-year cohort.
- name: Reduced forced expiratory volume in one second
  category: Respiratory
  description: >-
    Accelerated loss of FEV1, both as the acute cross-shift fall and as the fixed
    long-term deficit. The two are the same measurement on different timescales,
    which is what allows the acute drop to serve as a predictor of the chronic
    one.
  phenotype_term:
    preferred_term: Reduced forced expiratory volume in one second
    term:
      id: HP:0032342
      label: Reduced forced expiratory volume in one second
  evidence:
  - reference: PMID:17975204
    reference_title: "Cross-shift airway responses and long-term decline in FEV1 in cotton textile workers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exposure to cotton dust was associated with a 10 ml/year decrement in 5-year annualized FEV(1) decline."
    explanation: >-
      Quantifies the dust-attributable FEV1 decrement against a silk-worker
      reference group.
- name: Reduced FEV1/FVC ratio
  category: Respiratory
  description: >-
    Obstructive spirometric pattern. In a contemporary Karachi mill survey,
    post-bronchodilator FEV1/FVC below the lower limit of normal defined chronic
    airflow obstruction, present in about 4% of workers.
  phenotype_term:
    preferred_term: Reduced FEV1/FVC ratio
    term:
      id: HP:0030877
      label: Reduced FEV1/FVC ratio
  evidence:
  - reference: PMID:36717255
    reference_title: "Byssinosis and lung health among cotton textile workers: baseline findings of the MultiTex trial in Karachi, Pakistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Values of FEV1/forced vital capacity ratio below the lower limit of normality on postbronchodilator test were considered as 'chronic airflow obstruction' (CAO)."
    explanation: >-
      Defines the obstructive criterion used in a contemporary survey, including
      the post-bronchodilator requirement that makes it a fixed rather than
      reversible finding.
- name: Wheezing
  category: Respiratory
  description: >-
    Expiratory wheeze accompanying the acute and chronic airflow obstruction.
  phenotype_term:
    preferred_term: Wheezing
    term:
      id: HP:0030828
      label: Wheezing
  evidence:
  - reference: PMID:36717255
    reference_title: "Byssinosis and lung health among cotton textile workers: baseline findings of the MultiTex trial in Karachi, Pakistan."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "56% of participants had at least one respiratory symptom"
    explanation: >-
      Indirect: establishes the high overall respiratory symptom burden in
      exposed mill workers, of which wheeze is one, without reporting wheeze
      separately.
- name: Dyspnea
  category: Respiratory
  description: >-
    Breathlessness, which alongside chest tightness is one of the two symptoms
    the Schilling grading is written on — grade 1 is chest tightness "and/or
    breathlessness" on Mondays only. Present in nearly half of exposed mill
    workers in a contemporary cohort.
  phenotype_term:
    preferred_term: Dyspnea
    term:
      id: HP:0002094
      label: Dyspnea
  frequency: FREQUENT
  evidence:
  - reference: PMID:36717255
    reference_title: "Byssinosis and lung health among cotton textile workers: baseline findings of the MultiTex trial in Karachi, Pakistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "56% of participants had at least one respiratory symptom, while 43% had shortness of breath (grade 1)."
    explanation: >-
      Direct measurement of breathlessness prevalence in exposed cotton mill
      workers, and the source of the FREQUENT band.
  - reference: PMID:14437722
    reference_title: "A clinical and environmental study of byssinosis in the Lancashire cotton industry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Grade 1—Chest tightness and/or breathlessness on Mondays only"
    explanation: >-
      Establishes breathlessness as a defining symptom of the disease rather
      than an incidental one: it is named in the grading criterion itself,
      interchangeably with chest tightness.
environmental:
- name: Occupational inhalation of cotton, flax, hemp or sisal dust
  description: >-
    Inhalation of dust from raw vegetable fibre during textile processing is the
    necessary cause. Risk concentrates in the dustiest upstream operations —
    opening, carding and spinning — and rises with duration of employment in the
    industry. Contemporary mills can show high symptom rates at low measured
    inhalable dust concentrations.
  exposure_term:
    preferred_term: exposure to cotton dust
    term:
      id: ECTO:7000148
      label: exposure to cotton dust
  exposure_classifications:
    hazard_agent_type:
    - classification_value: BIOLOGICAL
      notes: >-
        Classified biological rather than chemical because the operative agent on
        the canonical model is bacterial endotoxin of gram-negative origin, and
        the dust is plant material. This is the substantive difference from the
        mineral-dust exposures curated for silicosis and coal workers'
        pneumoconiosis, which are CHEMICAL.
    exposure_route:
    - classification_value: INHALATION
    exposure_duration:
    - classification_value: CHRONIC
      notes: >-
        ATSDR chronic duration. Note the acute cross-shift response occurs on the
        timescale of a single shift, but the disease as curated — including its
        chronic irreversible arm — requires years of repeated exposure.
    ghs_health_hazard_class:
    - classification_value: STOT_REPEATED_EXPOSURE
    exposome_domain:
    - classification_value: SPECIFIC_EXTERNAL
  notes: >-
    No IARC carcinogen group is recorded: IARC has not classified cotton dust in
    a group this entry would be entitled to assert, and byssinosis is not a
    neoplastic outcome.
  evidence:
  - reference: PMID:36717255
    reference_title: "Byssinosis and lung health among cotton textile workers: baseline findings of the MultiTex trial in Karachi, Pakistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cigarette smoking (≥3.5 pack-years), increasing duration of employment in the textile industry and work in the spinning section were important factors found to be associated with several respiratory outcomes."
    explanation: >-
      Identifies duration of employment and the specific mill section as
      exposure determinants, grounding the occupational specificity of this
      entry.
  - reference: PMID:36717255
    reference_title: "Byssinosis and lung health among cotton textile workers: baseline findings of the MultiTex trial in Karachi, Pakistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We found low inhalable dust exposures (geometric mean: 610 µg/m3)."
    explanation: >-
      Documents that a high symptom burden coexisted with low measured inhalable
      dust, which is why dust concentration alone is a poor exposure surrogate
      here.
  influences_mechanisms:
  - target: Inhalation of Endotoxin-Contaminated Vegetable Dust
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      Textile processing aerosolizes the fibre dust that is then inhaled and
      deposited in the conducting airways.
    evidence:
    - reference: PMID:38423290
      reference_title: "Respiratory Diseases Associated With Organic Dust Exposure."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "In the textile industry, recognized to have high endotoxin exposure, byssinosis is an occupational respiratory disease due to exposure to cotton, hemp, or flax."
      explanation: >-
        Ties the occupational setting directly to the inhaled fibre dust this
        node represents.
- name: Cigarette smoking
  description: >-
    Smoking is not a cause of byssinosis — the disease is defined by a
    work-related temporal symptom pattern that tobacco does not produce — but
    cohort studies report additive interaction between dust and smoke on both
    respiratory symptoms and lung-function decline. It is curated as a modifier
    of the chronic arm, not of the acute cross-shift response.
  exposure_term:
    preferred_term: exposure to cigarette smoking
    term:
      id: ECTO:0100003
      label: exposure to cigarette smoking
  review_notes: >-
    Bound and linked as MODULATES rather than EXACERBATES. The cited review
    describes additive interaction, which is joint burden on a shared outcome
    rather than a demonstrated amplification of the dust mechanism; EXACERBATES
    would claim more than the source supports. The same review notes that
    inadequate smoking adjustment confounds much of the older literature, which
    is a reason to keep this record explicit rather than to leave smoking
    unmodelled.
  evidence:
  - reference: PMID:23361196
    reference_title: "Long-term respiratory health effects in textile workers."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "A number of cohort studies have noted additive interactions between dust and smoke exposure on respiratory symptoms and lung function decline in cotton"
    explanation: >-
      Sources the additive dust-smoke interaction on exactly the two outcomes
      this entry models in its chronic arm.
  - reference: PMID:23361196
    reference_title: "Long-term respiratory health effects in textile workers."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Many early studies did not adequately control for smoking when evaluating respiratory outcome in textile workers, which is problematic as exposure to tobacco and organic dust may result in the same clinical symptoms or pathologic lesions."
    explanation: >-
      The confounding problem that makes smoking worth an explicit record: it
      produces overlapping symptoms and lesions, so leaving it unmodelled would
      make the dust attribution look cleaner than the literature is.
  influences_mechanisms:
  - target: Chronic Airflow Obstruction and Accelerated FEV1 Loss
    environmental_effect: MODULATES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Smoking adds to the chronic decline the dust exposure drives, without
      being required for it and without altering the acute Monday pattern that
      defines the disease.
    evidence:
    - reference: PMID:23361196
      reference_title: "Long-term respiratory health effects in textile workers."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "A number of cohort studies have noted additive interactions between dust and smoke exposure on respiratory symptoms and lung function decline in cotton"
      explanation: >-
        Sources this specific edge onto the chronic-decline node rather than
        onto the acute response.
genetic:
- name: TNF
  gene_term:
    preferred_term: TNF
    term:
      id: hgnc:11892
      label: TNF
  association: >-
    Host susceptibility modifier of the chronic arm rather than of disease onset.
    In a 20-year cohort of cotton and silk workers, TNF promoter genotypes
    associated with higher TNF expression showed a steeper endotoxin-related
    annual FEV1 decline — about -6.8 mL/year in G/A and A/A carriers against
    -2.9 mL/year in G/G. The effect was clearest in never-smokers, so it is not a
    smoking interaction.
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:17332138
    reference_title: "TNF polymorphisms modify endotoxin exposure-associated longitudinal lung function decline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Endotoxin exposure was associated with faster lung function decline among genotypes associated with higher TNF expression levels, with estimates of annual FEV1 change in relation to endotoxin exposure of -2.9 ml and -6.8 ml in the G/G and G/A+AA genotypes, respectively, for the TNF polymorphism"
    explanation: >-
      Gives the effect estimate and its direction: higher-expressing TNF
      genotypes lose lung function faster per unit endotoxin exposure.
  - reference: PMID:17332138
    reference_title: "TNF polymorphisms modify endotoxin exposure-associated longitudinal lung function decline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the effect modification of TNF and LTA polymorphisms was prominent in never smokers"
    explanation: >-
      Places the modifier effect in never-smokers, which rules out smoking as
      the source of the interaction.
  notes: >-
    Curated as MODIFIER rather than SUSCEPTIBILITY because the measured outcome
    is the rate of decline in exposed workers, not the odds of developing
    disease. The same locus is curated as SUSCEPTIBILITY on Coal Workers
    Pneumoconiosis, where the studies are case-control against exposed controls —
    the difference is in what was measured, not in the biology.
- name: LTA
  gene_term:
    preferred_term: LTA
    term:
      id: hgnc:6709
      label: LTA
  association: >-
    Second modifier locus in the same TNF-region haplotype block, with the same
    direction of effect on endotoxin-related FEV1 decline (-2.0, -4.0 and
    -3.6 mL/year across A/A, A/G and G/G). Because LTA sits adjacent to TNF in
    the MHC, the two signals are not independent.
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:17332138
    reference_title: "TNF polymorphisms modify endotoxin exposure-associated longitudinal lung function decline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "and -2.0 ml, -4.0 ml and -3.6 ml in A/A, A/G and G/G genotypes, respectively, for the LTA polymorphism"
    explanation: >-
      The LTA effect estimates from the same cohort analysis.
  - reference: PMID:17332138
    reference_title: "TNF polymorphisms modify endotoxin exposure-associated longitudinal lung function decline."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TNF and LTA polymorphisms may modify the association between occupational endotoxin exposure and longitudinal lung function decline"
    explanation: >-
      The study's conclusion, naming both loci as modifiers of the
      exposure-response relationship rather than of disease risk.
- name: Cotton textile worker FEV1-decline risk loci (rs1910047, rs9469089)
  association: >-
    The largest genetic dataset in this entry's reference set, and the only one
    whose outcome is a byssinosis-relevant endpoint rather than a blood cytokine.
    A large gene-centric association study (Illumina Human CVD BeadChip, so a
    targeted cardiovascular-and-inflammation panel rather than a genome-wide
    scan) in newly-hired female cotton textile workers found two loci associated
    with the rate of FEV1 decline, and a genetic risk
    score in which decline scaled with the number of risk alleles carried. The
    effect differed across endotoxin exposure subgroups, which is a
    gene-by-exposure interaction on the same axis this entry's canonical
    hypothesis runs along.
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:23527081
    reference_title: "A large scale gene-centric association study of lung function in newly-hired female cotton textile workers with endotoxin exposure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two SNPs were found to be significant (P<6.29×10(-5)), including rs1910047 (P = 3.07×10(-5), FDR = 0.0778) and rs9469089 (P = 6.19×10(-5), FDR = 0.0967)"
    explanation: >-
      The two associated loci and their effect estimates, against rate of FEV1
      decline in cotton textile workers.
  - reference: PMID:23527081
    reference_title: "A large scale gene-centric association study of lung function in newly-hired female cotton textile workers with endotoxin exposure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic risk score analysis showed that the more risk loci the subjects carried, the larger the rate of FEV1 decline occurred (P trend = 3.01×10(-18))."
    explanation: >-
      The dose-response across risk alleles, which is what makes this a genuine
      polygenic effect on the chronic-decline arm rather than two isolated hits.
  - reference: PMID:23527081
    reference_title: "A large scale gene-centric association study of lung function in newly-hired female cotton textile workers with endotoxin exposure."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, the association was different among age subgroups (P = 7.11×10(-6)) and endotoxin subgroups (P = 1.08×10(-2))."
    explanation: >-
      The gene-by-endotoxin-exposure interaction, tying host genotype to the
      exposure axis the endotoxin hypothesis models.
  notes: >-
    No `gene_term` is bound. The two lead SNPs are reported as rsIDs against
    nearby genes (TBX3/TBX5 and RNF5/MHC region), and an association signal near
    a gene is not evidence that gene carries the effect — binding one would
    overstate what the study shows. The record is kept at the locus level
    deliberately. The cohort is female Chinese cotton textile workers, so the
    estimates are population-specific and the study is unreplicated.
- name: TLR4
  gene_term:
    preferred_term: TLR4
    term:
      id: hgnc:11850
      label: TLR4
  association: >-
    The endotoxin signalling receptor itself, and the other half of the receptor
    complex the Endotoxin Sensing node is named for. TLR4 +896 AG and GG
    genotypes were associated with lower IL-6 and eosinophil cationic protein in
    organic-dust-exposed workers, so variation at the receptor modulates the
    magnitude of the inflammatory response to a given endotoxin dose.
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:16142747
    reference_title: "Organic dust induced inflammation--role of atopy and TLR-4 and CD14 gene polymorphisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IL-6 and ECP values were lower among those with TLR-4 /+896 AG and GG polymorphisms as compared to AA."
    explanation: >-
      The measured genotype-to-cytokine effect at the receptor, the counterpart
      of the CD14 result below.
  - reference: PMID:16142747
    reference_title: "Organic dust induced inflammation--role of atopy and TLR-4 and CD14 gene polymorphisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results suggest that CD14 and TLR-4 polymorphisms influence regulators of the inflammation induced by endotoxin in organic dusts."
    explanation: >-
      The study's own conclusion placing both receptor-complex genes as
      modifiers of the endotoxin response this entry models.
  notes: >-
    Same cohort caveat as CD14: organic-dust-exposed workers generally rather
    than a byssinosis cohort, with blood cytokines rather than a byssinosis
    outcome as the readout. Curated because TLR4 is the receptor the canonical
    mechanism node names.
- name: CD14
  gene_term:
    preferred_term: CD14
    term:
      id: hgnc:1628
      label: CD14
  association: >-
    Endotoxin co-receptor. The CD14 -550 CC genotype was associated with lower
    IL-8 among atopic organic-dust-exposed workers, placing CD14 variation
    upstream in the inflammatory response rather than at the chronic-decline
    stage where TNF and LTA act.
  relationship_type: MODIFIER
  variant_origin: GERMLINE
  evidence:
  - reference: PMID:16142747
    reference_title: "Organic dust induced inflammation--role of atopy and TLR-4 and CD14 gene polymorphisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among atopic workers with CD-14(-550) polymorphism CC, IL-8 was lower."
    explanation: >-
      The measured genotype-to-cytokine effect, which is what places CD14 in the
      endotoxin-sensing step of the chain.
  notes: >-
    The cohort is organic-dust-exposed workers generally rather than a byssinosis
    cohort, and the readout is blood cytokines rather than a byssinosis outcome.
    Curated because CD14 is the co-receptor the canonical mechanism node names;
    the evidence supports the receptor's involvement, not a byssinosis risk
    estimate.
prevalence:
- population: Textile workers in low- and middle-income countries (chest tightness)
  measure_type: POINT_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_low: 4000.0
  rate_high: 58000.0
  notes: >-
    Prevalence of the cardinal symptom rather than of graded byssinosis, across
    26 studies. The very wide range reflects heterogeneity in dust levels,
    process and case ascertainment between settings. Recorded here because the
    denominator is exposed workers, not cases.
  evidence:
  - reference: PMID:35073782

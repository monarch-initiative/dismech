name: Byssinosis
creation_date: "2026-09-03T00:00:00Z"
category: Environmental Lung Disease
parents:
- Occupational Lung Disease
disease_term:
  preferred_term: byssinosis
  term:
    id: MONDO:0006688
    label: byssinosis
description: >-
  Byssinosis ("brown lung", "Monday fever") is an occupational airway disease
  caused by inhaling dust from cotton, flax, hemp or sisal, classically in
  textile mill carding and spinning rooms. MONDO files it under pneumoconiosis,
  but it is not one in the mineral-dust sense: the lesion is in the conducting
  airways rather than the parenchyma, there is no retained indigestible particle
  building a nodule, and the defining feature is a temporal pattern rather than a
  structural one — chest tightness and a measurable fall in FEV1 on the first
  working day after a break, attenuating across the working week.

  Gram-negative bacterial endotoxin contaminating the vegetable dust is the
  leading candidate agent, and endotoxin exposure does predict both symptoms and
  lung-function decline. It is not the whole story: cotton extracts with low
  measured endotoxin still provoke large airway responses, and complement
  activation by cotton dust does not track endotoxin concentration, so at least
  one non-endotoxin constituent contributes. This entry curates that as an open
  question rather than resolving it.

  The natural history is counterintuitive and is the clinically important part.
  Acute cross-shift responses appear within the first week of exposure and then
  shrink with continued exposure — a tolerance effect — yet their magnitude and
  frequency predict irreversible long-term FEV1 loss. Acute reactivity fades
  while damage accumulates, and past cumulative exposure predicts chronic decline
  while recent exposure predicts current symptoms, so the two phases are
  measurably decoupled.
classifications:
  harrisons_chapter:
  - classification_value: RESPIRATORY
  ilo_disease_category:
  - classification_value: bronchopulmonary_disease_from_organic_dust
    notes: >-
      ILO List of Occupational Diseases (revised 2010), item 2.1.6
      "Bronchopulmonary diseases caused by dust of cotton (byssinosis), flax,
      hemp, sisal or sugar cane (bagassosis)" — byssinosis is named in the item
      text. Note the ILO files this as a bronchopulmonary disease of organic
      dust, separately from the fibrogenic mineral-dust pneumoconioses at 2.1.1,
      which matches this entry's position that byssinosis is an airway rather
      than a parenchymal disease. ILO item 2.1.7 (occupational asthma) is
      deliberately not claimed: byssinosis is not a sensitizer-driven asthma,
      and its Monday pattern is the opposite of the progressive
      sensitization course.
  eu_occupational_category:
  - classification_value: cotton_flax_hemp_jute_sisal_bagasse_lung_disease
    notes: >-
      European schedule of occupational diseases (Commission Recommendation
      2003/670/EC), Annex I item 304.02, covering lung diseases caused by
      inhalation of dusts and fibres from cotton, flax, hemp, jute, sisal and
      bagasse. The European item names the fibre range explicitly, which matches
      the exposure curated here better than a cotton-only heading would.

has_subtypes:
- name: Acute Byssinosis
  display_name: Acute (Reversible) Byssinosis
  description: >-
    The classic Monday-pattern presentation: work-related chest tightness with a
    measurable cross-shift fall in FEV1, appearing on return to work after a
    break and easing over subsequent working days. Reversible on removal from
    exposure, and detectable within the first week of a worker's first-ever
    exposure.
  evidence:
  - reference: PMID:17693783
    reference_title: "Natural history and risk factors of early respiratory responses to exposure to cotton dust in newly exposed workers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Forty percent of workers reported work-related symptoms in the first week of the study."
    explanation: >-
      Establishes how early the acute form appears — within the first working
      week of first exposure, in a cohort naive to cotton dust.
  - reference: PMID:17693783
    reference_title: "Natural history and risk factors of early respiratory responses to exposure to cotton dust in newly exposed workers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acute airway responses were witnessed after immediate exposure."
    explanation: >-
      Confirms the acute airway response is an immediate-exposure phenomenon,
      which is what separates this subtype from the chronic form.
- name: Chronic Byssinosis
  display_name: Chronic Byssinosis with Fixed Airflow Obstruction
  description: >-
    Accelerated, irreversible loss of FEV1 after years of exposure, with chronic
    bronchitis and fixed airflow obstruction. Distinguished from the acute form
    not by different symptoms but by irreversibility: removal from exposure no
    longer restores function. Predicted by the magnitude and frequency of earlier
    acute cross-shift drops.
  evidence:
  - reference: PMID:17975204
    reference_title: "Cross-shift airway responses and long-term decline in FEV1 in cotton textile workers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Exposure to cotton dust was associated with a 10 ml/year decrement in 5-year annualized FEV(1) decline."
    explanation: >-
      Quantifies the accelerated chronic decline attributable to cotton dust in
      a 20-year prospective cohort with a silk-worker reference group.
  - reference: PMID:17975204
    reference_title: "Cross-shift airway responses and long-term decline in FEV1 in cotton textile workers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Cotton workers had larger and more frequent drops, as well as excessive chronic declines in FEV(1), than did silk workers."
    explanation: >-
      Contrasts cotton against silk workers on both the acute and the chronic
      measure, which is what makes the chronic decline dust-attributable rather
      than an ageing effect.
mechanistic_hypotheses:
- hypothesis_group_id: endotoxin_model
  hypothesis_label: Endotoxin-driven innate airway inflammation
  status: CANONICAL
  description: >-
    Gram-negative bacterial endotoxin contaminating the vegetable fibre is the
    causative agent, sensed through CD14/TLR4 on airway macrophages and
    epithelium, driving cytokine release, neutrophil recruitment and
    bronchoconstriction. This is the mainstream model and carries the strongest
    epidemiologic support: measured endotoxin exposure predicts both symptoms and
    the rate of FEV1 decline, and polymorphisms in the endotoxin-sensing and
    TNF pathways modify that decline.
- hypothesis_group_id: non_endotoxin_constituent_model
  hypothesis_label: Non-endotoxin dust constituent contributes independently
  status: EMERGING
  description: >-
    At least one non-endotoxin constituent of cotton dust — bract-derived tannin
    is the usual candidate — contributes to the acute airway response
    independently of endotoxin. Two observations motivate this: cotton bract and
    cotton dust extracts with low measured endotoxin still produce large falls
    in expiratory flow in healthy volunteers, and complement activation by
    cotton dust does not track endotoxin concentration. This does not displace
    the endotoxin model; the two are not mutually exclusive and the acute
    response may be the sum of both.
pathophysiology:
- name: Inhalation of Endotoxin-Contaminated Vegetable Dust
  description: >-
    Mechanical opening, carding and spinning of raw cotton, flax, hemp or sisal
    aerosolizes respirable dust carrying gram-negative bacterial endotoxin
    acquired during field growth, harvest and storage, together with plant bract
    and trash material. Exposure is concentrated in carding and opening rooms.
  role: trigger
  biological_scale: TISSUE
  locations:
  - preferred_term: bronchus
    term:
      id: UBERON:0002185
      label: bronchus
  triggers:
  - preferred_term: exposure to cotton dust
    term:
      id: ECTO:7000148
      label: exposure to cotton dust
  downstream:
  - target: Pulmonary Mast Cell Histamine Accumulation and Release
    causal_link_type: DIRECT
    description: >-
      Cotton and flax dust act on the lung's histamine economy directly, not
      only through the endotoxin receptor branch.
    evidence:
    - reference: PMID:6722048
      reference_title: "Role of histamine in the aetiology of byssinosis. II. Lung histamine concentrations in guinea pigs chronically exposed to cotton and flax dusts."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The potentiating effect may be through the recruitment of mast cells into the lung."
      explanation: >-
        Sources the edge from dust inhalation to the mast cell and histamine
        node, which otherwise had no upstream connection.
  - target: Endotoxin Sensing by CD14 and TLR4
    causal_link_type: DIRECT
    hypothesis_groups:
    - endotoxin_model
    evidence:
    - reference: PMID:17693783
      reference_title: "Natural history and risk factors of early respiratory responses to exposure to cotton dust in newly exposed workers."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Smoking, endotoxin, and dust concentrations were risk factors for all work-related symptoms."
      explanation: >-
        Sources this edge on the canonical model: measured endotoxin in the
        inhaled dust, independently of total dust, predicts the work-related
        response.
  - target: Non-Endotoxin Dust Constituent Activity
    causal_link_type: DIRECT
    hypothesis_groups:
    - non_endotoxin_constituent_model
    evidence:
    - reference: PMID:16179819
      reference_title: "Airway responses to the inhalation of cotton dust and cotton bract extracts."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Endotoxin levels were low for CBE (5.71 EU/mg) and CDE (31.88 EU/mg)."
      explanation: >-
        Sources this alternative edge: the challenge material carrying the
        activity had little endotoxin in it, so the inhaled dust must supply
        something else.
  evidence:
  - reference: PMID:38423290
    reference_title: "Respiratory Diseases Associated With Organic Dust Exposure."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In the textile industry, recognized to have high endotoxin exposure, byssinosis is an occupational respiratory disease due to exposure to cotton, hemp, or flax."
    explanation: >-
      Establishes the exposure and its fibre range, and the high endotoxin
      content of the textile dust that the canonical model rests on.
  - reference: PMID:17693783
    reference_title: "Natural history and risk factors of early respiratory responses to exposure to cotton dust in newly exposed workers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Smoking, endotoxin, and dust concentrations were risk factors for all work-related symptoms."
    explanation: >-
      Measured endotoxin and dust concentration both act as risk factors,
      supporting the inhaled dose of this node as the driving quantity.
- name: Endotoxin Sensing by CD14 and TLR4
  description: >-
    Inhaled endotoxin is recognized by the CD14/TLR4/MD-2 receptor complex on
    airway macrophages and bronchial epithelium, activating NF-kappaB-driven
    pro-inflammatory transcription. Human evidence for this step in byssinosis
    specifically is genetic rather than histological: variants in CD14 and TLR4
    shift the inflammatory-mediator response to organic dust endotoxin.
  role: driver
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: alveolar macrophage
    term:
      id: CL:0000583
      label: alveolar macrophage
  - preferred_term: bronchial epithelial cell
    term:
      id: CL:0002328
      label: bronchial epithelial cell
  biological_processes:
  - preferred_term: response to lipopolysaccharide
    term:
      id: GO:0032496
      label: response to lipopolysaccharide
    modifier: INCREASED
  - preferred_term: toll-like receptor 4 signaling pathway
    term:
      id: GO:0034142
      label: toll-like receptor 4 signaling pathway
    modifier: INCREASED
  downstream:
  - target: Airway Cytokine Release and Neutrophil Recruitment
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16142747
      reference_title: "Organic dust induced inflammation--role of atopy and TLR-4 and CD14 gene polymorphisms."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "IL-6 and ECP values were lower among those with TLR-4 /+896 AG and GG polymorphisms as compared to AA."
      explanation: >-
        Sources this specific edge: changing the receptor genotype changes the
        cytokine output, which is the receptor-to-mediator step.
  evidence:
  - reference: PMID:16142747
    reference_title: "Organic dust induced inflammation--role of atopy and TLR-4 and CD14 gene polymorphisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results suggest that CD14 and TLR-4 polymorphisms influence regulators of the inflammation induced by endotoxin in organic dusts."
    explanation: >-
      Human genetic evidence that CD14 and TLR4 are functionally in the path
      between organic-dust endotoxin and the inflammatory response, which is the
      claim this node makes.
  - reference: PMID:16142747
    reference_title: "Organic dust induced inflammation--role of atopy and TLR-4 and CD14 gene polymorphisms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IL-6 and ECP values were lower among those with TLR-4 /+896 AG and GG polymorphisms as compared to AA."
    explanation: >-
      The specific measured effect: TLR4 genotype changes the cytokine output of
      endotoxin-exposed workers, tying receptor to mediator quantitatively.
  notes: >-
    The receptor step itself is inferred for byssinosis rather than demonstrated
    in byssinotic airway tissue. The cited study is of organic-dust-exposed
    workers generally, not a byssinosis cohort, and its readouts are blood
    cytokines rather than airway histology.
- name: Non-Endotoxin Dust Constituent Activity
  description: >-
    A constituent of cotton dust other than endotoxin — bract-derived tannin is
    the usual candidate — contributes to the acute airway response. Cotton bract
    and cotton dust extracts with low measured endotoxin provoke large falls in
    expiratory flow and heighten methacholine responsiveness in healthy
    volunteers, and cotton dust activates complement without that activation
    tracking endotoxin content.
  role: driver
  biological_scale: TISSUE
  biological_processes:
  - preferred_term: complement activation
    term:
      id: GO:0006956
      label: complement activation
    modifier: INCREASED
  downstream:
  - target: Acute Bronchoconstriction and Cross-Shift Airflow Decline
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:16179819
      reference_title: "Airway responses to the inhalation of cotton dust and cotton bract extracts."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The average maximal falls in MEF40%(P) were 70 +/- 4.9 and 70 +/- 4.4% of baseline (nonsignificant) following CBE and CDE, respectively."
      explanation: >-
        Sources this edge directly: inhaled cotton extract produces the acute
        expiratory-flow fall this node represents.
  evidence:
  - reference: PMID:6617618
    reference_title: "In vitro alternative and classical activation of complement by extracts of cotton mill dust: a possible mechanism in the pathogenesis of byssinosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Extracts of cotton mill dust (CDE) were shown to activate complement by the classical and alternative pathways."
    explanation: >-
      The primary assay behind the complement activation bound on this node,
      establishing that cotton dust extract activates complement by both
      pathways.
  - reference: PMID:6617618
    reference_title: "In vitro alternative and classical activation of complement by extracts of cotton mill dust: a possible mechanism in the pathogenesis of byssinosis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The data presented suggest that endotoxin is not the principal complement-activating component, as complement activation could not be correlated to endotoxin concentrations of extracts of various parts of the cotton plant."
    explanation: >-
      The decisive observation for this node: the complement effect does not
      track endotoxin content, so it is attributable to a different constituent.
      This is the mechanistic case for the non-endotoxin hypothesis, independent
      of the airway-challenge evidence below.
  - reference: PMID:23361196
    reference_title: "Long-term respiratory health effects in textile workers."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "a study in healthy human volunteers did not demonstrate a dose-response relationship between the endotoxin content of cotton bract extracts and acute drops in FEV1"
    explanation: >-
      Review statement of the dose-response failure that motivates positing a
      second agent at all.
  - reference: PMID:23361196
    reference_title: "Long-term respiratory health effects in textile workers."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "endotoxin did not cause contraction of isolated tracheal smooth muscle seen with cotton dust"
    explanation: >-
      Isolates the specific effect endotoxin fails to reproduce — smooth-muscle
      contraction — which is the bronchoconstriction step this node feeds.
  - reference: PMID:16179819
    reference_title: "Airway responses to the inhalation of cotton dust and cotton bract extracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Endotoxin levels were low for CBE (5.71 EU/mg) and CDE (31.88 EU/mg)."
    explanation: >-
      Documents the low endotoxin content of the challenge material, which is
      half of what makes the large response below an argument for a
      non-endotoxin constituent.
  - reference: PMID:16179819
    reference_title: "Airway responses to the inhalation of cotton dust and cotton bract extracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The average maximal falls in MEF40%(P) were 70 +/- 4.9 and 70 +/- 4.4% of baseline (nonsignificant) following CBE and CDE, respectively."
    explanation: >-
      The other half: a roughly 70% fall in expiratory flow from low-endotoxin
      extracts, in 18 and 17 of 21 healthy subjects. A large effect from little
      endotoxin is the case for an additional agent.
  - reference: PMID:16179819
    reference_title: "Airway responses to the inhalation of cotton dust and cotton bract extracts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All subjects enhanced their MCh response following CBE or CDE."
    explanation: >-
      Both extracts also induced airway hyperresponsiveness, so the effect is
      not limited to acute bronchoconstriction.
  notes: >-
    Curated as an EMERGING alternative rather than a replacement for the
    endotoxin model. The challenge study is in healthy volunteers, not byssinotic
    workers, and it does not identify the responsible constituent — tannin is the
    literature's candidate, not a demonstrated agent. The complement activation
    bound here is sourced to its primary in vitro assay, which also rules
    endotoxin out as the complement-activating component; what remains unknown
    is which constituent is responsible, tracked in the
    `non_endotoxin_agent_identity` discussion.
- name: Airway Cytokine Release and Neutrophil Recruitment
  description: >-
    Activated macrophages and epithelium release IL-6, IL-8 and other
    neutrophil chemoattractants, recruiting neutrophils into the airway lumen and
    bronchial mucosa and establishing a self-amplifying inflammatory response.
  role: driver
  biological_scale: TISSUE
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  biological_processes:
  - preferred_term: neutrophil chemotaxis
    term:
      id: GO:0030593
      label: neutrophil chemotaxis
    modifier: INCREASED
  - preferred_term: production of molecular mediator involved in inflammatory response
    term:
      id: GO:0002532
      label: production of molecular mediator involved in inflammatory response
    modifier: INCREASED
  downstream:
  - target: Acute Bronchoconstriction and Cross-Shift Airflow Decline
  - target: Chronic Airway Inflammation and Remodeling
  evidence:
  - reference: PMID:38423290
    reference_title: "Respiratory Diseases Associated With Organic Dust Exposure."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The immunopathogenesis predominantly involves Toll-like receptor signaling cascade, T-helper 1/T-helper 17 lymphocyte responses, neutrophil influx"
    explanation: >-
      Names neutrophil influx alongside TLR signalling as the core
      immunopathogenesis of organic-dust airway disease, which is the step this
      node represents.
- name: Pulmonary Mast Cell Histamine Accumulation and Release
  description: >-
    Cotton and flax dust potentiate histamine formation or accumulation in the
    lung, possibly by recruiting mast cells and by inhibiting histamine-degrading
    enzyme activity. Histamine accumulated during an exposure-free interval is
    proposed to be released on re-exposure, which is the leading mechanistic
    account of why symptoms peak on the first working day after a break.
  role: driver
  biological_scale: TISSUE
  cell_types:
  - preferred_term: mast cell
    term:
      id: CL:0000097
      label: mast cell
  biological_processes:
  - preferred_term: mast cell degranulation
    term:
      id: GO:0043303
      label: mast cell degranulation
    modifier: INCREASED
  downstream:
  - target: Acute Bronchoconstriction and Cross-Shift Airflow Decline
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:6202313
      reference_title: "Role of histamine in the aetiology of byssinosis. I Blood histamine concentrations in workers exposed to cotton and flax dusts."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Histamine accumulated in the lung over the weekend is released on exposure to dust causing the symptoms of byssinosis."
      explanation: >-
        Sources this edge as the histamine model states it: accumulated
        histamine released on re-exposure is what produces the acute symptoms.
  evidence:
  - reference: PMID:6202313
    reference_title: "Role of histamine in the aetiology of byssinosis. I Blood histamine concentrations in workers exposed to cotton and flax dusts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Histamine accumulated in the lung over the weekend is released on exposure to dust causing the symptoms of byssinosis."
    explanation: >-
      States the accumulate-then-release account of the weekend-break pattern
      that this node models, in the paper that proposed it.
  - reference: PMID:6202313
    reference_title: "Role of histamine in the aetiology of byssinosis. I Blood histamine concentrations in workers exposed to cotton and flax dusts."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The difference in the rate of histamine metabolism relative to the rate of histamine formation in byssinotic subjects leads to a more prolonged histamine accumulation than in symptom free subjects"
    explanation: >-
      Proposes the host difference that would explain why only some exposed
      workers become byssinotic — a metabolism-versus-formation imbalance rather
      than a difference in exposure.
  - reference: PMID:6722048
    reference_title: "Role of histamine in the aetiology of byssinosis. II. Lung histamine concentrations in guinea pigs chronically exposed to cotton and flax dusts."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "cotton and flax dusts contain agents which potentiate the formation or accumulation of histamine or both in the lungs of guinea pigs exposed to dust"
    explanation: >-
      The animal-model counterpart, measuring lung histamine directly rather
      than inferring it from blood concentrations in workers.
  - reference: DOI:10.1080/109158101753253054
    reference_title: "Differential Diagnosis of Byssinosis by Blood Histamine and Pulmonary Function Test: A Review and an Appraisal"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The results showed that the histamine levels were significantly higher in the cotton dust-exposed workers in association with significantly decreased FEV1, PEFR, and FEF25–75%, indicating bronchoconstriction of the central, larger, and peripheral airways."
    explanation: >-
      Later human data pairing raised blood histamine with simultaneous
      obstruction across central, large and peripheral airways in exposed
      workers. This is the one item on this node that couples the histamine
      measurement to the physiological outcome in humans rather than proposing
      the link.
  notes: >-
    Kept as one contributing pathway rather than the mechanism. The 1984 studies
    state the accumulate-then-release account as a proposal in their own words,
    and no modern replication of the lung-histamine measurement was retrieved;
    the later human study above pairs raised blood histamine with measured
    obstruction but is a small cross-sectional comparison (8 byssinotic, 16
    non-byssinotic exposed, 15 unexposed), not a test of the accumulation
    mechanism. The convergent modern evidence for the Monday pattern is the
    cross-shift physiology, not the histamine chemistry.

    The histamine item is DOI-keyed because the article has no PubMed record
    (checked via the PMC ID Converter). DOI: is in `skip_prefixes`, so the gating
    reference validator does not snippet-check it; it was verified separately
    with `just count-verified-snippets --unskip-prefix DOI`.
- name: Acute Bronchoconstriction and Cross-Shift Airflow Decline
  description: >-
    Neutrophilic inflammation, mast-cell histamine and direct smooth-muscle
    contraction converge on acute airway narrowing, measurable as a fall in FEV1
    across a work shift or across the working week and experienced as chest
    tightness. Reversible in itself, and it attenuates with continued exposure —
    but its magnitude and frequency predict the irreversible loss below, which is
    why it is modelled as feeding the chronic node rather than resolving.
  role: central_effector
  biological_scale: ORGANISM
  cell_types:
  - preferred_term: bronchial smooth muscle cell
    term:
      id: CL:0002598
      label: bronchial smooth muscle cell
  biological_processes:
  - preferred_term: muscle contraction
    term:
      id: GO:0006936
      label: muscle contraction
    modifier: INCREASED
  downstream:
  - target: Exposure Tolerance Across the Working Week
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17693783
      reference_title: "Natural history and risk factors of early respiratory responses to exposure to cotton dust in newly exposed workers."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Cross-first-shift and cross-week falls in FEV1 reduced in magnitude during the course of the study."
      explanation: >-
        Sources this specific edge: it is the acute response itself that
        attenuates, measured as the shrinking of the same cross-shift falls.
  - target: Chronic Airflow Obstruction and Accelerated FEV1 Loss
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:17975204
      reference_title: "Cross-shift airway responses and long-term decline in FEV1 in cotton textile workers."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "every 10 ml in DeltaFEV(1) drop was associated with an additional 1.5 ml/year loss in annualized FEV(1) decline"
      explanation: >-
        Sources this specific edge with a dose-response: the size of the acute
        drop scales the rate of permanent loss, which is what makes this a
        causal link rather than two effects of one exposure.
  - target: Chest tightness
  - target: Dyspnea
  - target: Airway hyperresponsiveness
  evidence:
  - reference: PMID:17975204
    reference_title: "Cross-shift airway responses and long-term decline in FEV1 in cotton textile workers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Acute airway response, measured as cross-shift change in FEV(1), to cotton dust may lead to subsequent chronic loss of lung function in exposed workers."
    explanation: >-
      States the acute-to-chronic link this node's downstream edge asserts, as
      the hypothesis the 20-year cohort was built to test.
  - reference: PMID:17975204
    reference_title: "Cross-shift airway responses and long-term decline in FEV1 in cotton textile workers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "every 10 ml in DeltaFEV(1) drop was associated with an additional 1.5 ml/year loss in annualized FEV(1) decline"
    explanation: >-
      Quantifies the edge to the chronic node: a dose-response between the size

name: Byssinosis
creation_date: "2026-09-03T00:00:00Z"
category: Environmental Lung Disease
parents:
- Occupational Lung Disease
- Occupational Asthma-like Airway Disease
disease_term:
  preferred_term: byssinosis
  term:
    id: MONDO:0006688
    label: byssinosis
description: >-
  Byssinosis ("brown lung", "Monday morning fever") is an occupational airway
  disease caused by inhalation of cotton, flax, hemp or sisal dust, classically
  in textile mill workers. Unlike the mineral-dust pneumoconioses it is an
  airway rather than a parenchymal disease: the causative agent is thought to be
  gram-negative bacterial endotoxin contaminating the vegetable dust, and the
  defining clinical feature is chest tightness and airflow decline that appears
  on the first working day after a break and attenuates across the working week.
pathophysiology:
- name: Inhalation of Endotoxin-Contaminated Vegetable Dust
  description: >-
    Cotton dust carrying gram-negative bacterial endotoxin is inhaled and
    deposits in the conducting airways.
  biological_scale: TISSUE
  downstream:
  - target: Airway Inflammatory Response
- name: Airway Inflammatory Response
  description: >-
    Endotoxin drives innate immune activation in the airway with neutrophil
    influx and cytokine release.
  biological_scale: TISSUE
  downstream:
  - target: Acute Airflow Obstruction
- name: Acute Airflow Obstruction
  description: >-
    Bronchoconstriction and airway narrowing produce the acute cross-shift
    decline in expiratory flow.
  biological_scale: ORGANISM
phenotypes:
- name: Chest tightness
  category: Respiratory
  phenotype_term:
    preferred_term: Chest tightness
    term:
      id: HP:0031352
      label: Chest tightness
environmental:
- name: Occupational inhalation of cotton dust
  description: >-
    Inhalation of cotton, flax, hemp or sisal dust in textile processing is the
    necessary cause of byssinosis.

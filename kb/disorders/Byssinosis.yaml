definitions:
- name: Schilling grading of byssinosis
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  description: >-
    The original and still-used symptom grading, from the 1960 Lancashire cotton
    industry study. Grade 0 is no Monday chest tightness or breathlessness;
    Grade 1/2 occasional Monday chest tightness or mild respiratory irritation;
    Grade 1 chest tightness and/or breathlessness on Mondays only; Grade 2 the
    same on Mondays and other days. The scale is built entirely on the temporal
    pattern — what day symptoms fall on — which is why it works for a disease
    with no distinctive radiographic or histologic finding. Contemporary use adds
    an FEV1 decrement to the symptom criterion.
  validation_status:
    status: VALIDATED_AGAINST_GOLD_STANDARD
    rationale: >-
      In continuous use since 1960 and still the reference standard against which
      contemporary surveys report, but note that applying WHO symptom-only versus
      Schilling symptom-plus-FEV1 criteria to the same 2,031-worker cohort gave
      3% and 4% respectively, so the choice of criterion moves the answer.
  evidence:
  - reference: PMID:14437722
    reference_title: "A clinical and environmental study of byssinosis in the Lancashire cotton industry."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The workers were graded by their histories as follows: Grade 0—No symptoms of chest tightness or breathlessness on Mondays Grade ½—Occasional chest tightness on Mondays, or mild symptoms such as irritation of the respiratory tract on Mondays Grade 1—Chest tightness and/or breathlessness on Mondays only Grade 2—Chest tightness and/or breathlessness on Mondays and other days"
    explanation: >-
      The grading scale in full, quoted from the paper that defined it.
  - reference: PMID:36717255
    reference_title: "Byssinosis and lung health among cotton textile workers: baseline findings of the MultiTex trial in Karachi, Pakistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Byssinosis was defined using both WHO symptoms-based (work-related chest tightness), and Schilling's criteria (symptoms with decreased forced expiratory volume in 1 s (FEV1)."
    explanation: >-
      Contemporary statement of the two competing criteria and what separates
      them: whether an FEV1 decrement is required alongside the symptom.
  notes: >-
    The authors of the contemporary survey explicitly discuss the difficulty of
    applying the standard guidelines, so this definition is recorded as the
    established criterion while noting it is actively contested in practice.
diagnosis:
- name: Occupational history with work-related symptom timing and cross-shift spirometry
  description: >-
    Diagnosis rests on a compatible fibre-dust exposure history plus the
    characteristic symptom timing, optionally with spirometry demonstrating a
    cross-shift FEV1 fall. There is no confirmatory imaging or histologic test —
    unlike the mineral-dust pneumoconioses, byssinosis has no radiographic
    signature — so the temporal pattern carries the diagnosis.
  evidence:
  - reference: PMID:36717255
    reference_title: "Byssinosis and lung health among cotton textile workers: baseline findings of the MultiTex trial in Karachi, Pakistan."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Data collection involved questionnaire-based interviews, spirometry and measurements of personal exposure to inhalable dust."
    explanation: >-
      The three diagnostic inputs in practice — symptom questionnaire,
      spirometry and exposure measurement — with no imaging component.
  notes: >-
    Cross-shift spirometry is the one test that reflects the disease's defining
    physiology, but it requires measuring a worker before and after a shift
    following a break, which is why symptom-based criteria dominate field
    surveys.
animal_models:
- name: Guinea pig chronic cotton and flax dust inhalation
  species: Guinea pig
  publication: PMID:6722048
  description: >-
    Guinea pigs chronically exposed to cotton, flax or cottonseed dust, with lung
    histamine measured directly. Used to test whether the histamine accumulation
    inferred from workers' blood concentrations occurs in lung tissue, and to
    separate cotton from flax dust by potency.
  modeled_mechanisms:
  - target: Pulmonary Mast Cell Histamine Accumulation and Release
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the dust-driven lung histamine accumulation the human blood
      studies could only infer, and discriminates cotton from flax dust by the
      size of the effect.
    limitations: >-
      A 1984 study with no retrieved modern replication. It establishes that the
      dusts potentiate histamine accumulation but not that histamine release is
      what produces the human Monday symptom, and guinea pig airway
      pharmacology is unusually histamine-sensitive relative to human.
    readouts:
    - name: Lung histamine concentration
      target: Pulmonary Mast Cell Histamine Accumulation and Release
      direction: INCREASED
      interpretation: >-
        Direct tissue measurement of the accumulation this mechanism node
        asserts, rather than the circulating surrogate.
      evidence:
      - reference: PMID:6722048
        reference_title: "Role of histamine in the aetiology of byssinosis. II. Lung histamine concentrations in guinea pigs chronically exposed to cotton and flax dusts."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "cotton and flax dusts contain agents which potentiate the formation or accumulation of histamine or both in the lungs of guinea pigs exposed to dust, and that such agents are present at much higher levels in cotton dust than in flax dust"
        explanation: >-
          Reports the measured lung histamine effect and the cotton-over-flax
          potency difference.
    evidence:
    - reference: PMID:6722048
      reference_title: "Role of histamine in the aetiology of byssinosis. II. Lung histamine concentrations in guinea pigs chronically exposed to cotton and flax dusts."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "The potentiating effect may be through the recruitment of mast cells into the lung."
      explanation: >-
        Attests that the model is informative for this node specifically by
        implicating the mast cell population the node is built on.
treatments:
- name: Exposure Reduction and Dust Control
  description: >-
    Engineering dust control in opening, carding and spinning, with medical
    removal or job transfer for affected workers. The only intervention that
    addresses the cause. It halts the acute response and slows further decline,
    but does not recover the fixed deficit already accrued — which is the
    practical consequence of the acute and chronic arms being decoupled.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: occupational exposure reduction
    term:
      id: NCIT:C49236
      label: Therapeutic Procedure
  target_mechanisms:
  - target: Inhalation of Endotoxin-Contaminated Vegetable Dust
    description: >-
      Reduces the inhaled dose that initiates every downstream step.
    evidence:
    - reference: PMID:36717255
      reference_title: "Byssinosis and lung health among cotton textile workers: baseline findings of the MultiTex trial in Karachi, Pakistan."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "increasing duration of employment in the textile industry and work in the spinning section were important factors found to be associated with several respiratory outcomes"
      explanation: >-
        Indirect: shows respiratory outcomes scale with duration and dustiest
        job section, from which reducing exposure follows as the intervention,
        rather than evaluating a dust-control programme itself.
  evidence:
  - reference: PMID:20797932
    reference_title: "Chronic lung function decline in cotton textile workers: roles of historical and recent exposures to endotoxin."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Past exposure to endotoxin was associated with reduced FEV1 level among retired cotton workers."
    explanation: >-
      Supports the limit stated in this treatment's description: the deficit
      persists in workers who have left the industry entirely, so removal caps
      accrual rather than reversing it.
- name: Bronchodilator Therapy
  description: >-
    Inhaled bronchodilators for the reversible component of airflow obstruction.
    Symptomatic only, and by definition ineffective against the fixed
    post-bronchodilator obstruction that defines the chronic arm.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: bronchodilator
      term:
        id: NCIT:C319
        label: Bronchodilator
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  target_mechanisms:
  - target: Acute Bronchoconstriction and Cross-Shift Airflow Decline
    description: >-
      Targets the smooth-muscle contraction component of the acute response.
  evidence:
  - reference: PMID:36717255
    reference_title: "Byssinosis and lung health among cotton textile workers: baseline findings of the MultiTex trial in Karachi, Pakistan."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Values of FEV1/forced vital capacity ratio below the lower limit of normality on postbronchodilator test were considered as 'chronic airflow obstruction' (CAO)."
    explanation: >-
      Indirect: the post-bronchodilator criterion establishes that a
      bronchodilator-unresponsive component exists and defines chronic disease,
      which bounds what this treatment can achieve.
  notes: >-
    No trial of bronchodilator therapy specifically in byssinosis was retrieved.
    Use here is extrapolated from obstructive-airway-disease practice, and the
    entry does not claim a byssinosis-specific efficacy result.
discussions:
- discussion_id: non_endotoxin_agent_identity
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Which constituent of cotton dust other than endotoxin causes the acute airway
    response, and how much of the response does it account for?
  attaches_to:
  - pathophysiology#Non-Endotoxin Dust Constituent Activity
  - mechanistic_hypotheses#non_endotoxin_constituent_model
  rationale: >-
    The evidence that a non-endotoxin constituent contributes is reasonably
    strong — a roughly 70% fall in expiratory flow in 18 of 21 healthy subjects
    from extracts measured at 5.71 and 31.88 EU/mg, plus complement activation
    that does not track endotoxin content. The evidence for *what* that
    constituent is, is not. Bract-derived tannin is the literature's standing
    candidate, and the entry names it as a candidate only.

    This matters practically rather than just taxonomically. Every control
    measure and exposure limit for byssinosis is built around dust mass or
    endotoxin concentration. If a substantial share of the acute response comes
    from an unmeasured constituent, then dust and endotoxin monitoring will
    under-predict risk in exactly the way the Karachi survey observed — 56% of
    workers symptomatic at a geometric mean inhalable dust of 610 µg/m3.
  proposed_experiments:
  - experiment_id: fractionated_cotton_extract_challenge
    name: Airway challenge with fractionated cotton bract extract
    description: >-
      Separate cotton bract extract into fractions, deplete endotoxin from each
      by polymyxin B affinity or equivalent, and challenge healthy volunteers
      with the fractions and with endotoxin-replete controls, measuring
      expiratory flow and methacholine responsiveness as in the existing
      challenge protocol. The design point is that the reference arm must be
      endotoxin-matched, not vehicle, or the result cannot separate the two
      agents.
    would_support:
    - pathophysiology#Non-Endotoxin Dust Constituent Activity
    supporting_outcome:
    - >-
      An endotoxin-depleted fraction retains a substantial share of the flow
      fall and the methacholine shift, and the responsible fraction can be
      chemically characterized.
    would_refute:
    - pathophysiology#Non-Endotoxin Dust Constituent Activity
    refuting_outcome:
    - >-
      Endotoxin depletion abolishes the response across all fractions, placing
      the whole acute effect on endotoxin and making the low-endotoxin result an
      artifact of the assay's detection limit rather than evidence of a second
      agent.
  notes: >-
    Recorded as a KNOWLEDGE_GAP rather than a HUMAN_MODEL_MISMATCH: the human
    challenge evidence is in humans, so translational validity is not the
    problem. What is missing is the identity of the agent.

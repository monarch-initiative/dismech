pathophysiology:
- name: PTHLH Loss of Function
  role: trigger
  biological_scale: MOLECULAR
  description: >
    Heterozygous loss of PTHLH function. The allele spectrum is all
    loss-of-function: whole-gene and contiguous deletions, nonsense and
    frameshift variants, a nonstop extension, initiation-codon and signal-peptide
    variants (p.L15R impairs signal-peptide cleavage), and missense variants in
    the N-terminal PTH-like domain, of which L60P was shown to lose function in
    chicken micromass culture. That deletions and truncations give the same
    phenotype as the point mutations is the argument for haploinsufficiency.
    Duplications of PTHLH cause different disorders (enchondromatosis,
    acro-osteolysis, a combined type E/A1 osteochondroplasia) and are outside
    this entry.
  genes:
  - preferred_term: PTHLH
    term:
      id: hgnc:9607
      label: PTHLH
  molecular_functions:
  - preferred_term: Hormone Activity
    term:
      id: GO:0005179
      label: hormone activity
    modifier: DECREASED
  - preferred_term: PTH1R Binding
    term:
      id: GO:0031857
      label: type 1 parathyroid hormone receptor binding
    modifier: DECREASED
  evidence:
  - reference: PMID:20170896
    reference_title: Deletion and point mutations of PTHLH cause brachydactyly type E.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a large pedigree with BDE, short stature, and learning disabilities, we detected a microdeletion of approximately 900 kb encompassing PTHLH, the gene coding for parathyroid hormone related protein (PTHRP)."
    explanation: Whole-gene deletion of PTHLH causes the disorder.
  - reference: PMID:20170896
    reference_title: Deletion and point mutations of PTHLH cause brachydactyly type E.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The missense mutation L60P was tested in chicken micromass culture with the replication-competent avian sarcoma leukosis virus retroviral expression system and was shown to result in a loss of function."
    explanation: Functional test showing a disease missense allele is loss of function.
  - reference: PMID:20170896
    reference_title: Deletion and point mutations of PTHLH cause brachydactyly type E.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, loss-of-function mutations in PTHLH cause BDE with short stature."
    explanation: The gene-identification paper's conclusion on mechanism.
  - reference: PMID:25801215
    reference_title: Exome sequencing reveals a novel PTHLH mutation in a Chinese pedigree with brachydactyly type E and short stature.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Further in vitro functional analysis showed that this mutation can lead to the retention of an N-terminal signal peptide fragment after the nascent proteins are translated."
    explanation: A signal-peptide missense variant (p.L15R) impairs PTHrP processing.
  - reference: PMID:26640227
    reference_title: Report of two novel mutations in PTHLH associated with brachydactyly type E and literature review.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Alterations that predict haploinsufficiency of PTHLH, the gene coding for parathyroid hormone related protein (PTHrP), have been identified as a cause of this disorder in seven families."
    explanation: Frames the allele spectrum as haploinsufficiency.
  downstream:
  - target: Reduced PTHrP Signaling to Growth-Plate Chondrocytes
    causal_link_type: DIRECT
    description: Halving PTHLH dosage halves the paracrine PTHrP signal in cartilage.
    evidence:
    - reference: PMID:42539507
      reference_title: "Case Report: A novel PTHLH nonsense variant in a mother-son pair with brachydactyly type E and short stature, with a genotype-stature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This report expands the mutational spectrum of PTHLH and supports the role of PTHLH haploinsufficiency in impaired skeletal growth."
      explanation: Links PTHLH haploinsufficiency to impaired skeletal growth.
  - target: Failed Formation of the Tooth Eruption Pathway
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Loss of PTHrP from the enamel epithelium removes the signal that drives
      osteoclastic clearing of bone over the erupting tooth. Shown in mice
      lacking PTHrP outside cartilage; whether heterozygous loss in humans acts
      the same way is inferred from the shared phenotype.
    evidence:
    - reference: PMID:9751753
      reference_title: Parathyroid hormone-related protein is required for tooth eruption.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "The replacement of PTHrP expression in the enamel epithelium with a keratin 14-driven transgene corrects the defect in bone resorption and restores the normal program of tooth eruption."
      explanation: >-
        Restoring PTHrP in the enamel epithelium alone rescues eruption, so the
        eruption failure follows from loss of PTHrP itself. The mice lack PTHrP
        entirely outside cartilage, so applying this to human heterozygous loss
        is an inference.
- name: Disrupted Long-Range PTHLH Cis-Regulation
  role: trigger
  biological_scale: MOLECULAR
  description: >
    Two families carry balanced translocations, t(8;12)(q13;p11.2) and
    t(4;12)(q13.2-13.3;p11.2), with breakpoints outside PTHLH. Neither disrupts
    the coding sequence; both lower PTHLH expression by breaking its regulatory
    landscape, including a long-range element on 12q that contacts PTHLH in cis
    over 24.4 Mb and SOX9 in trans and carries a long noncoding RNA. Patient
    fibroblasts differentiated into chondrogenic cells show reduced PTHLH and
    impaired chondrogenic differentiation, so the regulatory lesion converges on
    the same dosage reduction as the coding alleles.
  genes:
  - preferred_term: PTHLH
    term:
      id: hgnc:9607
      label: PTHLH
  biological_processes:
  - preferred_term: Regulation of Gene Expression
    term:
      id: GO:0010468
      label: regulation of gene expression
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:20015959
    reference_title: A cis-regulatory site downregulates PTHLH in translocation t(8;12)(q13;p11.2) and leads to Brachydactyly Type E.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We studied a family with autosomal-dominant Brachydactyly Type E (BDE) and identified a t(8;12)(q13;p11.2) translocation with breakpoints (BPs) upstream of PTHLH on chromosome 12p11.2 and a disrupted KCNB2 on 8q13."
    explanation: Identifies the translocation family with breakpoints outside PTHLH.
  - reference: PMID:23093776
    reference_title: A misplaced lncRNA causes brachydactyly in humans.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Both translocations caused downregulation of the parathyroid hormone-like hormone (PTHLH) gene by disrupting the cis-regulatory landscape."
    explanation: Two translocations act by disrupting PTHLH cis-regulation.
  - reference: PMID:23093776
    reference_title: A misplaced lncRNA causes brachydactyly in humans.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Using chromosome conformation capturing, we identified a regulator on chromosome 12q that interacts in cis with PTHLH over a 24.4-megabase distance and in trans with the sex-determining region Y-box 9 (SOX9) gene on chromosome 17q."
    explanation: Identifies the long-range regulatory element the translocations disconnect.
  downstream:
  - target: Reduced PTHrP Signaling to Growth-Plate Chondrocytes
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20015959
      reference_title: A cis-regulatory site downregulates PTHLH in translocation t(8;12)(q13;p11.2) and leads to Brachydactyly Type E.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We differentiated fibroblasts from BDE patients into chondrogenic cells and found that PTHLH and its targets, ADAMTS-7 and ADAMTS-12 were downregulated along with impaired chondrogenic differentiation."
      explanation: Patient-derived chondrogenic cells show reduced PTHLH expression.
- name: Reduced PTHrP Signaling to Growth-Plate Chondrocytes
  role: central_effector
  biological_scale: CELLULAR
  description: >
    In the growth plate, prehypertrophic chondrocytes secrete Indian hedgehog,
    which induces PTHrP in the periarticular perichondrium and resting
    chondrocytes; PTHrP acts through PTH1R on prehypertrophic chondrocytes to
    keep them proliferating and to delay hypertrophy. This negative feedback
    loop sets how long a chondrocyte column keeps growing. Mice heterozygous for
    a Pthrp null allele show that the loop is dosage-sensitive: they are normal
    at birth but develop bone abnormalities postnatally, while circulating PTH
    and calcium stay normal, which matches the normal mineral biochemistry of
    affected people.
  cell_types:
  - preferred_term: Prehypertrophic Chondrocyte
    term:
      id: CL:0020022
      label: prehypertrophic chondrocyte
  biological_processes:
  - preferred_term: PTH1R (Gs-coupled) Receptor Signaling
    term:
      id: GO:0007189
      label: adenylate cyclase-activating G protein-coupled receptor signaling pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:8662546
    reference_title: Regulation of rate of cartilage differentiation by Indian hedgehog and PTH-related protein.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Analysis of PTHrP (-/-) mutant mice indicated that the PTHrP protein signals to its receptor in the prehypertrophic chondrocytes, thereby blocking hypertrophic differentiation."
    explanation: Places PTHrP action on prehypertrophic chondrocytes.
  - reference: PMID:8662546
    reference_title: Regulation of rate of cartilage differentiation by Indian hedgehog and PTH-related protein.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro application of Hedgehog or PTHrP protein to normal or PTHrP (-/-) limb explants demonstrated that PTHrP mediates the effects of Ihh through the formation of a negative feedback loop that modulates the rate of chondrocyte differentiation."
    explanation: Defines the Ihh-PTHrP feedback loop that sets the rate of chondrocyte differentiation.
  - reference: PMID:8608863
    reference_title: Haploinsufficiency of parathyroid hormone-related peptide (PTHrP) results in abnormal postnatal bone development.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Thus, while a physiologic concentration of PTH was capable of maintaining calcium homeostasis, it was incapable of compensating for PTHrP haploinsufficiency in developing bone."
    explanation: Shows the skeletal effect of PTHrP is dosage-sensitive and not compensated by circulating PTH.
  downstream:
  - target: Premature Chondrocyte Hypertrophic Differentiation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:20170896
      reference_title: Deletion and point mutations of PTHLH cause brachydactyly type E.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "PTHRP is known to regulate the balance between chondrocyte proliferation and the onset of hypertrophic differentiation during endochondral bone development."
      explanation: States the step from PTHrP signaling to the timing of hypertrophy.
- name: Premature Chondrocyte Hypertrophic Differentiation
  biological_scale: CELLULAR
  description: >
    With less PTHrP, chondrocytes leave the proliferative pool and become
    hypertrophic early, so each column contributes fewer cells to longitudinal
    growth. Complete loss in mice gives a lethal chondrodysplasia with reduced
    proliferation and premature maturation; the human heterozygous state is the
    milder counterpart.
  cell_types:
  - preferred_term: Chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  biological_processes:
  - preferred_term: Chondrocyte Proliferation
    term:
      id: GO:0035988
      label: chondrocyte proliferation
    modifier: DECREASED
  - preferred_term: Chondrocyte Hypertrophy
    term:
      id: GO:0003415
      label: chondrocyte hypertrophy
    modifier: INCREASED
  evidence:
  - reference: PMID:8314082
    reference_title: Lethal skeletal dysplasia from targeted disruption of the parathyroid hormone-related peptide gene.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Histological examination revealed a diminution of chondrocyte proliferation, associated with premature maturation of chondrocytes and accelerated bone formation."
    explanation: Loss of PTHrP reduces chondrocyte proliferation and accelerates maturation.
  - reference: PMID:8662561
    reference_title: PTH/PTHrP receptor in early development and Indian hedgehog-regulated bone growth.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice that survived exhibited accelerated differentiation of chondrocytes in bone, and their bones, grown in explant culture, were resistant to the effects of PTHrP and Sonic hedgehog."
    explanation: Loss of the PTHrP receptor gives the same accelerated chondrocyte differentiation.
  - reference: PMID:34897794
    reference_title: Novel Pathogenetic Variants in PTHLH and TRPS1 Genes Causing Syndromic Brachydactyly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Haploinsufficiency of PTHLH consequent to loss-of-function heterozygous mutations leads to premature differentiation of chondrocytes and abnormal bone size, with cone-shaped epiphyses and their premature fusion."
    explanation: Applies the premature-differentiation mechanism to human PTHLH haploinsufficiency.
  downstream:
  - target: Premature Growth-Plate Fusion in Short Tubular Bones
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42539507
      reference_title: "Case Report: A novel PTHLH nonsense variant in a mother-son pair with brachydactyly type E and short stature, with a genotype-stature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Disruption of this regulatory loop can accelerate chondrocyte maturation, promote premature epiphyseal fusion, and impair longitudinal bone growth"
      explanation: Links accelerated chondrocyte maturation to early epiphyseal fusion.
  - target: Short Stature
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:42539507
      reference_title: "Case Report: A novel PTHLH nonsense variant in a mother-son pair with brachydactyly type E and short stature, with a genotype-stature review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "the family was counseled that the proband's short stature was more likely related to altered growth-plate regulation than to a primary GH-IGF-1 axis defect"
      explanation: Attributes the short stature to growth-plate dysregulation; the long-bone growth plates, not the short tubular bones, set height.
- name: Premature Growth-Plate Fusion in Short Tubular Bones
  biological_scale: TISSUE
  description: >
    The single growth plate of a metacarpal, metatarsal or phalanx gives these
    short tubular bones little reserve, so early maturation shows there first:
    cone-shaped epiphyses and early epiphyseal fusion, with metaphyseal
    widening in some patients. Long bones are affected less, which shows as
    reduced adult height rather than as a visible deformity. Bone age has been
    reported as delayed in some children despite this, which is not explained.
  biological_processes:
  - preferred_term: Endochondral Bone Growth
    term:
      id: GO:0003416
      label: endochondral bone growth
    modifier: DECREASED
  cell_types:
  - preferred_term: Hypertrophic Chondrocyte
    term:
      id: CL:0000743
      label: hypertrophic chondrocyte
  evidence:
  - reference: PMID:42631736
    reference_title: "Skeletal dysplasias of the parathyroid hormone signaling cascade: radiological manifestations and molecular mechanisms."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Partial loss of signaling can present as type E brachydactyly due to premature maturation of the growth plate of short tubular bones, typically exemplified by pseudohypoparathyroidism."
    explanation: Explains type E brachydactyly as premature growth-plate maturation in the short tubular bones; the review states it for partial loss of PTH-cascade signalling generally, with pseudohypoparathyroidism as its example.
  - reference: PMID:42539507
    reference_title: "Case Report: A novel PTHLH nonsense variant in a mother-son pair with brachydactyly type E and short stature, with a genotype-stature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Radiographs showed generalized shortening of the metacarpals, metatarsals, and phalanges, premature epiphyseal fusion, and metaphyseal widening."
    explanation: Radiographic premature epiphyseal fusion in a PTHLH truncation carrier.

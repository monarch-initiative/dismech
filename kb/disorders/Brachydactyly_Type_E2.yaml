genetic:
- name: PTHLH Loss-of-Function Variants and Deletions
  gene_term:
    preferred_term: PTHLH
    term:
      id: hgnc:9607
      label: PTHLH
  association: Causative
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  notes: >-
    Reported alleles include missense (L44P, L60P, p.L15R in the signal peptide,
    p.Trp9Arg, p.Gln42Pro), nonsense (K120X, p.R56*, p.R57*, p.Tyr18Ter, p.Glu28Ter),
    frameshift (p.N87Tfs*18, p.S50Vfs*22, p.Glu100Glyfs*5), initiation-codon
    (p.Met1?) and nonstop (X178WextX*54) variants; whole-gene deletions of 900
    kb and 3.06 Mb that also remove neighbouring genes; and two balanced
    translocations that lower PTHLH expression without touching it. Fewer than
    20 distinct variants were known in 2026. No ClinGen gene-disease validity
    record was found in the repository cache.
  evidence:
  - reference: PMID:20170896
    reference_title: Deletion and point mutations of PTHLH cause brachydactyly type E.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, loss-of-function mutations in PTHLH cause BDE with short stature."
    explanation: Gene identification.
  - reference: PMID:38407575
    reference_title: A novel heterozygous mutation in PTHLH causing autosomal dominant brachydactyly type E complicated with short stature.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No translocation or microdeletion/duplication was found in karyotype analysis and array-CGH; hence, a novel heterozygous mutation, c.146dupA. p.S50Vfs*22, was detected by next-generation sequencing in PTHLH gene, leading to a premature stop codon."
    explanation: Frameshift allele segregating in a four-generation family.
  - reference: PMID:42441359
    reference_title: "PTHLH gene variant in an Indian boy with brachydactyly type E: A case report and literature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This detailed phenotypic characterization of the early truncating PTHLH variant p.Tyr18Ter expands the clinical spectrum associated with PTHLH haploinsufficiency."
    explanation: An early truncating allele, consistent with haploinsufficiency.
  - reference: PMID:30835359
    reference_title: "[Mutation analysis of a pedigree affected with brachydactyly type E2 and obesity]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "NGS has identified a novel heterozygous missense mutation (c.125A>C, p.Gln42Pro) in the exon 1 of PTHLH gene."
    explanation: A further missense allele in a BDE2 pedigree.
diagnosis:
- name: Radiographic and molecular diagnosis
  description: >
    Hand and foot radiographs show short metacarpals and metatarsals, often
    with short phalanges and cone-shaped epiphyses. Calcium, phosphate, PTH,
    thyroid function and IGF-1 are normal, with no hormone resistance. The main
    differential is the inactivating PTH/PTHrP signalling disorders
    (pseudohypoparathyroidism, pseudopseudohypoparathyroidism, acrodysostosis),
    and also tricho-rhino-phalangeal syndrome, 2q37 deletion, the HOXD13-related
    type E1, and Turner syndrome. The skeletal pattern alone does not separate
    these, so diagnosis is molecular: PTHLH sequencing with copy-number analysis,
    since deletions are a recurrent cause.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  results: >-
    A heterozygous PTHLH loss-of-function variant or deletion with normal
    calcium-phosphate metabolism and no PTH resistance.
  evidence:
  - reference: PMID:42539507
    reference_title: "Case Report: A novel PTHLH nonsense variant in a mother-son pair with brachydactyly type E and short stature, with a genotype-stature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This combination of metacarpal/metatarsal shortening, normal calcium-phosphate metabolism, and familial skeletal findings should prompt consideration of PTHLH-associated brachydactyly type E."
    explanation: Gives the clinical-biochemical pattern that should prompt PTHLH testing.
  - reference: PMID:42539507
    reference_title: "Case Report: A novel PTHLH nonsense variant in a mother-son pair with brachydactyly type E and short stature, with a genotype-stature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biochemical and endocrine evaluation revealed no evidence of hormone resistance or major metabolic abnormalities."
    explanation: Normal endocrine biochemistry distinguishes BDE2 from pseudohypoparathyroidism.
  - reference: PMID:29947179
    reference_title: Novel Mutation in PTHLH Related to Brachydactyly Type E2 Initially Confused with Unclassical Pseudopseudohypoparathyroidism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Herein, we report a family affected with brachydactyly type E2 caused by a novel PTHLH mutation, which was confused with PPHP with unclassical genetic penetrance."
    explanation: Shows the clinical confusion with pseudopseudohypoparathyroidism.
  - reference: PMID:34897794
    reference_title: Novel Pathogenetic Variants in PTHLH and TRPS1 Genes Causing Syndromic Brachydactyly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Unfortunately, we could not find distinctive phenotypic features that might have led to an earlier clinical diagnosis"
    explanation: The phenotype alone does not separate BDE2 from overlapping disorders, so testing is needed.
treatments:
- name: Genetic Counseling
  description: >-
    Counseling for autosomal dominant transmission with a 50% recurrence risk
    and variable expressivity, including of short stature.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:42539507
    reference_title: "Case Report: A novel PTHLH nonsense variant in a mother-son pair with brachydactyly type E and short stature, with a genotype-stature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular diagnosis is valuable not only for confirming the etiology but also for genetic counseling, because affected individuals have a 50% recurrence risk for offspring."
    explanation: Supports counseling based on the 50% recurrence risk.
- name: Growth Monitoring
  description: >-
    There is no disease-specific treatment. Growth is monitored. Recombinant
    growth hormone has no evidence base in this disorder and was withheld in a
    reported child with a normal GH-IGF-1 axis.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive care with growth monitoring
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:42539507
    reference_title: "Case Report: A novel PTHLH nonsense variant in a mother-son pair with brachydactyly type E and short stature, with a genotype-stature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The molecular diagnosis also informed management by supporting longitudinal growth monitoring rather than recombinant growth hormone therapy in the absence of GH-IGF-1 axis abnormalities."
    explanation: Supports growth monitoring over GH therapy.
  - reference: PMID:42539507
    reference_title: "Case Report: A novel PTHLH nonsense variant in a mother-son pair with brachydactyly type E and short stature, with a genotype-stature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Given the absence of clear GH deficiency and the lack of evidence supporting GH therapy specifically for PTHLH-associated BDE, recombinant growth hormone was not initiated."
    explanation: States the lack of evidence for growth hormone in this disorder.
animal_models:
- name: Pthlh heterozygous null mouse
  species: Mouse
  genotype: Pthlh+/- (heterozygous null)
  publication: PMID:8608863
  description: >-
    The genetic counterpart of the human disorder: heterozygous loss of PTHrP.
    Normal at birth, with skeletal abnormalities developing postnatally while
    PTH and calcium stay normal.
  modeled_mechanisms:
  - target: Reduced PTHrP Signaling to Growth-Plate Chondrocytes
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: Reproduces dosage sensitivity of skeletal PTHrP signaling with normal mineral homeostasis.
    limitations: >-
      The reported phenotype is in the tibial growth plate and trabecular bone;
      the abstract does not describe the metacarpals or metatarsals, so
      reproduction of the human brachydactyly itself is not shown.
    evidence:
    - reference: PMID:8608863
      reference_title: Haploinsufficiency of parathyroid hormone-related peptide (PTHrP) results in abnormal postnatal bone development.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Although apparently phenotypically normal at birth, mice heterozygous for inactivation of the gene encoding parathyroid hormone-related peptide (PTHrP) develop haplotype insufficiency by 3 months of age."
      explanation: Heterozygous Pthrp mice develop postnatal skeletal abnormality.
- name: Cartilage-rescued Pthlh null mouse
  species: Mouse
  genotype: Pthlh-/- with Col2a1-driven Pthlh transgene
  publication: PMID:9751753
  description: >-
    PTHrP restored in cartilage only, so the mice survive and are effectively
    PTHrP-null elsewhere. They are small and their teeth fail to erupt.
  modeled_mechanisms:
  - target: Failed Formation of the Tooth Eruption Pathway
    relationship: RECAPITULATES
    fidelity: LOW
    description: Teeth form but fail to erupt without PTHrP.
    limitations: >-
      Complete absence of PTHrP outside cartilage, not heterozygous loss; the
      human dental phenotype is milder and present in only a minority of
      carriers.
    evidence:
    - reference: PMID:9751753
      reference_title: Parathyroid hormone-related protein is required for tooth eruption.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "These rescued PTHrP-knockout mice survive to at least 6 months of age but are small in stature and display a number of developmental defects, including cranial chondrodystrophy and a failure of tooth eruption."
      explanation: Shows failure of tooth eruption in PTHrP-deficient mice.
references:
- reference: PMID:24028571
  title: "Brachydactyly E: isolated or as a feature of a syndrome."
- reference: PMID:36779427
  title: "Nosology of genetic skeletal disorders: 2023 revision."
- reference: PMID:26733284
  title: Duplication of PTHLH causes osteochondroplasia with a combined brachydactyly type E/A1 phenotype with disturbed bone maturation and rhizomelia.
  findings:
  - statement: >-
      Describes a PTHLH-only duplication that causes a different disorder, a
      combined type E/A1 osteochondroplasia. It is listed to mark the boundary of
      this entry and is not evidence for brachydactyly type E2.
    supporting_text: "Microarray-based comparative genomic hybridization (array-CGH) revealed a 70-kb duplication on chromosome 12p11.22 encompassing only PTHLH."

- name: Failed Formation of the Tooth Eruption Pathway
  biological_scale: TISSUE
  description: >
    PTHrP from the enamel epithelium (stellate reticulum) acts on PTH1R in the
    dental follicle, which then supports osteoclast formation and resorption of
    the bone over the crown. Without PTHrP the teeth form but stay trapped in
    bone. Evidence is from mice lacking PTHrP outside cartilage and from dental
    crypt cell culture; in patients the corresponding finding is delayed or
    failed eruption.
  biological_processes:
  - preferred_term: Tooth Eruption
    term:
      id: GO:0044691
      label: tooth eruption
    modifier: DECREASED
  evidence:
  - reference: PMID:9751753
    reference_title: Parathyroid hormone-related protein is required for tooth eruption.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Teeth appear to develop normally but become trapped by the surrounding bone and undergo progressive impaction."
    explanation: Mice lacking PTHrP outside cartilage form teeth that fail to erupt.
  - reference: PMID:9751753
    reference_title: Parathyroid hormone-related protein is required for tooth eruption.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "PTHrP therefore represents an essential signal in the formation of the eruption pathway."
    explanation: Establishes PTHrP as required for the eruption pathway.
  - reference: PMID:10829073
    reference_title: Parathyroid hormone-related protein induces spontaneous osteoclast formation via a paracrine cascade.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Neutralizing the effects of PTHrP resulted in a decrease in the number of osteoclasts formed, suggesting that stellate reticulum-derived PTHrP drives osteoclast formation."
    explanation: PTHrP from the enamel epithelium drives the osteoclast formation the eruption pathway needs.
  downstream:
  - target: Delayed Tooth Eruption
    causal_link_type: DIRECT
phenotypes:
- category: Skeletal
  name: Type E Brachydactyly
  description: >
    Shortening of metacarpals and metatarsals, with phalanges frequently
    involved. Present in essentially all reported carriers, though the number of
    digits involved varies within families and mildly affected relatives occur.
  phenotype_term:
    preferred_term: Type E brachydactyly
    term:
      id: HP:0005863
      label: Type E brachydactyly
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:37501674
    reference_title: A novel mutation in PTHLH in a family with a variable phenotype with brachydactyly, short stature, oligodontia and developmental delay.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "found that all patients had BDE with intrafamilial variability in regard to number of digits affected"
    explanation: Restates a prior review finding BDE in all PTHLH carriers, with variable digit involvement.
  - reference: PMID:34897794
    reference_title: Novel Pathogenetic Variants in PTHLH and TRPS1 Genes Causing Syndromic Brachydactyly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "All PTHLH mutated patients presented BDE and short stature, which are clinical features considered hallmarks of BDE2."
    explanation: BDE is a hallmark of BDE2.
- category: Skeletal
  name: Short Metacarpals
  description: Shortened metacarpals are the core skeletal lesion.
  phenotype_term:
    preferred_term: Short metacarpal
    term:
      id: HP:0010049
      label: Short metacarpal
  frequency: VERY_FREQUENT
  evidence:
  - reference: PMID:20170896
    reference_title: Deletion and point mutations of PTHLH cause brachydactyly type E.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "small hands and feet predominantly as a result of shortened metacarpals and metatarsals"
    explanation: Short metacarpals define the hand phenotype.
- category: Skeletal
  name: Short Fourth Metacarpal
  description: >
    The fourth and fifth rays are most often affected, usually with the third,
    which gives the clinical sign of short fourth and fifth fingers.
  phenotype_term:
    preferred_term: Short 4th metacarpal
    term:
      id: HP:0010044
      label: Short 4th metacarpal
  frequency: FREQUENT
  evidence:
  - reference: PMID:24028571
    reference_title: "Brachydactyly E: isolated or as a feature of a syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Several authors have reported shortening of metacarpals III, IV and V in most cases"
    explanation: Fourth-metacarpal shortening is part of the usual III-V pattern; the review pools PTHLH loss-of-function cases with one PTHLH duplication case.
  - reference: PMID:29947179
    reference_title: Novel Mutation in PTHLH Related to Brachydactyly Type E2 Initially Confused with Unclassical Pseudopseudohypoparathyroidism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We recently encountered a young gentleman exhibiting shortening of 4th and 5th fingers and toes."
    explanation: Fourth and fifth ray shortening in a PTHLH carrier.
- category: Skeletal
  name: Short Fifth Metacarpal
  description: The fifth metacarpal is short in most reported patients.
  phenotype_term:
    preferred_term: Short 5th metacarpal
    term:
      id: HP:0010047
      label: Short 5th metacarpal
  frequency: FREQUENT
  evidence:
  - reference: PMID:24028571
    reference_title: "Brachydactyly E: isolated or as a feature of a syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Several authors have reported shortening of metacarpals III, IV and V in most cases"
    explanation: Fifth-metacarpal shortening is part of the usual III-V pattern; the review pools PTHLH loss-of-function cases with one PTHLH duplication case.
- category: Skeletal
  name: Short Metatarsals
  description: The feet are involved together with the hands.
  phenotype_term:
    preferred_term: Short metatarsal
    term:
      id: HP:0010743
      label: Short metatarsal
  frequency: FREQUENT
  evidence:
  - reference: PMID:20170896
    reference_title: Deletion and point mutations of PTHLH cause brachydactyly type E.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "small hands and feet predominantly as a result of shortened metacarpals and metatarsals"
    explanation: Short metatarsals are part of the defining phenotype.
- category: Skeletal
  name: Cone-Shaped Phalangeal Epiphyses
  description: >
    Cone-shaped epiphyses of the middle and distal phalanges, especially of the
    second and fifth fingers, are a frequent radiographic sign of the early
    growth-plate maturation.
  phenotype_term:
    preferred_term: Cone-shaped epiphyses of the phalanges of the hand
    term:
      id: HP:0010230
      label: Cone-shaped epiphyses of the phalanges of the hand
  frequency: FREQUENT
  evidence:
  - reference: PMID:24028571
    reference_title: "Brachydactyly E: isolated or as a feature of a syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "shortening and cone-shaped epiphyses on middle and distal phalanges II and V were frequently mentioned"
    explanation: Cone-shaped phalangeal epiphyses are frequently reported in PTHLH-related BDE; the review pools loss-of-function cases with one PTHLH duplication case.
- category: Skeletal
  name: Premature Epiphyseal Fusion
  description: Early fusion of the epiphyses of the short tubular bones.
  phenotype_term:
    preferred_term: Premature epiphyseal fusion
    term:
      id: HP:0010588
      label: Premature epimetaphyseal fusion
  evidence:
  - reference: PMID:42539507
    reference_title: "Case Report: A novel PTHLH nonsense variant in a mother-son pair with brachydactyly type E and short stature, with a genotype-stature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Radiographs showed generalized shortening of the metacarpals, metatarsals, and phalanges, premature epiphyseal fusion, and metaphyseal widening."
    explanation: Radiographic premature epiphyseal fusion in a PTHLH carrier.
  - reference: PMID:31283647
    reference_title: A 3.06-Mb interstitial deletion on 12p11.22-12.1 caused brachydactyly type E combined with pectus carinatum.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The affected individuals showed bilateral, severe, and generalized brachydactyly with short stature, pectus carinatum, and prematurely fusion of epiphyses."
    explanation: Premature epiphyseal fusion in a family with a PTHLH-containing deletion.
- category: Growth
  name: Short Stature
  description: >
    Common but incompletely penetrant. In a 2026 pooled review 20 of 42
    carriers with stature data had height at or below -2 SDS, and 31 of 42 were
    short or of reduced stature when cases described as short without numbers
    were included. No genotype reliably predicts it; the recurrent p.R56*
    allele occurs in people with both normal and short stature.
  phenotype_term:
    preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  frequency: FREQUENT
  evidence:
  - reference: PMID:42539507
    reference_title: "Case Report: A novel PTHLH nonsense variant in a mother-son pair with brachydactyly type E and short stature, with a genotype-stature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "31 of 42 individuals (73.8%) were classified as having short stature or reduced stature"
    explanation: Quantifies short or reduced stature across published carriers.
  - reference: PMID:42539507
    reference_title: "Case Report: A novel PTHLH nonsense variant in a mother-son pair with brachydactyly type E and short stature, with a genotype-stature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "These findings indicate that short stature is common but incompletely penetrant in PTHLH-associated brachydactyly type E."
    explanation: Short stature is frequent but not obligate.
  - reference: PMID:37501674
    reference_title: A novel mutation in PTHLH in a family with a variable phenotype with brachydactyly, short stature, oligodontia and developmental delay.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, there are adults reported with PTHLH mutations without a short stature suggesting a variable penetrance of the gene defect"
    explanation: Adults with normal stature show variable penetrance of short stature.
- category: Dental
  name: Delayed Tooth Eruption
  description: >
    Delayed or failed eruption, including of the permanent molars, in a
    minority of families. A 2016 review found oligodontia or eruption problems
    in 3 of 27 patients.
  phenotype_term:
    preferred_term: Delayed eruption of teeth
    term:
      id: HP:0000684
      label: Delayed eruption of teeth
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:34897794
    reference_title: Novel Pathogenetic Variants in PTHLH and TRPS1 Genes Causing Syndromic Brachydactyly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Moreover, patients 2 and 3 presented delayed dental eruption and/or numerical tooth abnormalities, that are frequently but not obligatory observed in BDE2."
    explanation: Delayed dental eruption in PTHLH carriers.
  - reference: PMID:37501674
    reference_title: A novel mutation in PTHLH in a family with a variable phenotype with brachydactyly, short stature, oligodontia and developmental delay.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "3 out of 27 had oligodontia/problems with tooth eruption"
    explanation: Gives the frequency of dental involvement in a pooled review.
- category: Dental
  name: Hypodontia
  description: >
    Congenitally missing teeth in some carriers. The sources call it
    oligodontia, but the one case described in detail is missing two lateral
    incisors, which is hypodontia (oligodontia means six or more missing teeth),
    so the narrower-severity term is bound. No upstream node is drawn: the mouse
    evidence concerns eruption of teeth that did form, not tooth agenesis, so the
    mechanism of the missing teeth is not established.
  phenotype_term:
    preferred_term: Hypodontia (reported as oligodontia)
    term:
      id: HP:0000668
      label: Hypodontia
  frequency: OCCASIONAL
  evidence:
  - reference: PMID:37501674
    reference_title: A novel mutation in PTHLH in a family with a variable phenotype with brachydactyly, short stature, oligodontia and developmental delay.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He misses 1 upper and 1 lower lateral incisor"
    explanation: Two congenitally missing incisors in a PTHLH p.Trp9Arg carrier.
  - reference: PMID:34897794
    reference_title: Novel Pathogenetic Variants in PTHLH and TRPS1 Genes Causing Syndromic Brachydactyly.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Additionally, the clinical presentation may include delayed dental eruption and/or oligodontia, hypoplastic nails, learning disabilities, altered mammary gland development, mild craniofacial dysmorphism, and delayed bone age."
    explanation: Lists missing teeth (reported as oligodontia) among the variable features of BDE2.
- category: Growth
  name: Disproportionate Short Stature
  description: >
    Where body proportions were measured, short stature can be
    disproportionate, with increased sitting height for height or reduced arm
    span to height ratio.
  phenotype_term:
    preferred_term: Disproportionate short stature
    term:
      id: HP:0003498
      label: Disproportionate short stature
  evidence:
  - reference: PMID:37501674
    reference_title: A novel mutation in PTHLH in a family with a variable phenotype with brachydactyly, short stature, oligodontia and developmental delay.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The first patient presented with developmental delay and disproportionate short stature with skeletal abnormalities."
    explanation: Disproportionate short stature in a PTHLH p.Trp9Arg carrier.
  - reference: PMID:29947179
    reference_title: Novel Mutation in PTHLH Related to Brachydactyly Type E2 Initially Confused with Unclassical Pseudopseudohypoparathyroidism.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Previously reported patients with PTHLH-related BDE had varied BD appearance, short stature, abnormal arm span/height ratio, dental problems, and mental retardation, or did not have some of these features"
    explanation: Abnormal arm span to height ratio in earlier PTHLH reports.
- category: Metabolic
  name: Obesity
  description: >
    Obesity is reported in some carriers, including one pedigree named for it,
    but it is inconsistently reported and common in the general population, so
    its link to PTHLH is uncertain.
  phenotype_term:
    preferred_term: Obesity
    term:
      id: HP:0001513
      label: Obesity
  evidence:
  - reference: PMID:30835359
    reference_title: "[Mutation analysis of a pedigree affected with brachydactyly type E2 and obesity]."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A novel mutation of the PTHLH gene has been identified in a pedigree affected with brachydactyly type E2 and obesity."
    explanation: Obesity in a PTHLH missense pedigree.
  - reference: PMID:42539507
    reference_title: "Case Report: A novel PTHLH nonsense variant in a mother-son pair with brachydactyly type E and short stature, with a genotype-stature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Her weight was 60 kg (+1.12 SDS), and BMI was 30.61 kg/m², consistent with obesity."
    explanation: Obesity in an affected PTHLH carrier.
- category: Neurodevelopmental
  name: Learning Disability
  description: >
    Reported in the original deletion family and in later point-mutation
    families. The first family's 900 kb deletion removes other genes, so its
    learning problems are not attributable to PTHLH alone. The sources say
    "learning disabilities" without naming a type; HP:0001328 is bound because
    HPO lists learning disability as its synonym, not because a specific
    disorder such as dyslexia was reported.
  phenotype_term:
    preferred_term: Specific learning disability
    term:
      id: HP:0001328
      label: Specific learning disability
  evidence:
  - reference: PMID:20170896
    reference_title: Deletion and point mutations of PTHLH cause brachydactyly type E.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In a large pedigree with BDE, short stature, and learning disabilities, we detected a microdeletion of approximately 900 kb encompassing PTHLH"
    explanation: Learning disabilities in the original PTHLH deletion family.
  - reference: PMID:37501674
    reference_title: A novel mutation in PTHLH in a family with a variable phenotype with brachydactyly, short stature, oligodontia and developmental delay.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This is the second report on learning disabilities in PTHLH defects and first report of a PTHLH point mutation in a family with speech and/or language development delay."
    explanation: Learning disability in a point-mutation family, so not only deletion-driven.
- category: Neurodevelopmental
  name: Global Developmental Delay

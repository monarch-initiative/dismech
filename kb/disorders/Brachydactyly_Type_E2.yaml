name: Brachydactyly Type E2
synonyms:
- BDE2
- PTHLH brachydactyly type E
- Brachydactyly type E caused by mutation in PTHLH
- Brachydactyly type E with short stature, PTHLH type
creation_date: '2026-10-15T00:00:00Z'
category: Mendelian
description: >
  Brachydactyly type E2 is the PTHLH-related form of brachydactyly type E:
  autosomal dominant shortening of the metacarpals and metatarsals, usually most
  marked in the third to fifth rays and often with short phalanges and
  cone-shaped epiphyses, accompanied in most but not all carriers by short
  stature. Some families also have delayed tooth eruption or missing teeth,
  learning or speech difficulties, mild facial dysmorphism, obesity, or
  abnormal breast development. It is caused by heterozygous loss of function of PTHLH, which
  encodes parathyroid hormone-related protein (PTHrP): point mutations,
  deletions, and balanced translocations that silence PTHLH from a distance all
  produce it. PTHrP is the paracrine signal that holds growth-plate
  chondrocytes in the proliferative state, so halving it lets chondrocytes
  mature early and the growth plates of the short tubular bones close early.
  Calcium, phosphate and PTH are normal and there is no hormone resistance,
  which is what separates it from pseudohypoparathyroidism, the disorder it is
  most often taken for. The HOXD13-related isolated form is the separate entry
  Brachydactyly_Type_E1.
disease_term:
  preferred_term: brachydactyly type E2
  term:
    id: MONDO:0013244
    label: brachydactyly type E2
parents:
- Limb Development Disorders
- Skeletal Disorders of Parathyroid Hormone Signaling
notes: >-
  The "E2" in this name is the OMIM/MONDO genetic designation (OMIM 613382,
  PTHLH). It is not Hertzog's older radiographic subtype E2 (short fourth and
  fifth metacarpals with a short distal thumb phalanx), which predates the gene
  and does not map one-to-one onto it. No GeneReviews chapter covers this
  disorder (PubMed `genereviews[book]` title search, October 2026).
inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    Autosomal dominant, with marked intrafamilial variability and incomplete
    penetrance of the extraskeletal features, most importantly of short stature.
  evidence:
  - reference: PMID:42539507
    reference_title: "Case Report: A novel PTHLH nonsense variant in a mother-son pair with brachydactyly type E and short stature, with a genotype-stature review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "Heterozygous pathogenic variants in PTHLH, which encodes parathyroid hormone-related protein, are an established cause of autosomal dominant brachydactyly type E and are variably associated with short stature."
    explanation: States autosomal dominant inheritance of PTHLH-related BDE.
  - reference: PMID:26763883
    reference_title: Variable expressivity of the phenotype in two families with brachydactyly type E, craniofacial dysmorphism, short stature and delayed bone age caused by novel heterozygous mutations in the PTHLH gene.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Data shown here expand the knowledge on the phenotypic presentation of PTHLH mutations, highlighting significant clinical variability and incomplete penetrance of the PTHLH-related symptoms."
    explanation: Documents variable expressivity and incomplete penetrance within PTHLH families.
classifications:
  isds_skeletal_category:
  - classification_value: parathyroid_hormone_signaling
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 28 "Skeletal disorders of parathyroid hormone
      signaling cascade", whose six members include PTHLH-related brachydactyly
      type E2 (membership as transcribed in the schema's
      parathyroid_hormone_signaling description; the cached article text does
      not carry Table 1, so the row is not quotable from the cache). This is why
      the HOXD13-related type E1, which stays in group 18 (isolated
      brachydactylies), is a separate entry.
    evidence:
    - reference: PMID:42631736
      reference_title: "Skeletal dysplasias of the parathyroid hormone signaling cascade: radiological manifestations and molecular mechanisms."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "The group encompasses genetic defects associated with abnormal signaling of PTH, PTH-related protein (PTHrP) encoded by the PTHLH (PTH-like hormone) gene, and their common receptor termed parathyroid hormone 1 receptor (PTH1R)."
      explanation: Describes the new nosology group as including PTHLH defects.

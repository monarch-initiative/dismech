      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Partial loss of signaling can present as type E brachydactyly due to premature maturation of the growth plate of short tubular bones, typically exemplified by pseudohypoparathyroidism."
      explanation: >-
        States that early growth-plate maturation in the short tubular bones

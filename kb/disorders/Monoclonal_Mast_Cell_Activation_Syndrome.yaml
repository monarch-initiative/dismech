    evidence_source: HUMAN_CLINICAL
    snippet: "Although the release of mast cell (MC) mediators upon MC activation might present with a wide variety of symptoms, particular clinical features typically characterize MC mediator release episodes in patients with clonal MCD without skin involvement."
    explanation: >-
      Supports a characteristic episode phenotype in clonal disease without skin involvement.
      Graded INDIRECT because the abstract does not itemise which features, so the specific
      attribution of hypotension rests on the anaphylaxis phenotype above.

name: Monoclonal Mast Cell Activation Syndrome
creation_date: "2026-09-03T16:40:00Z"
category: Complex
synonyms:
- MMAS
- monoclonal MCAS
- clonal mast cell activation syndrome
description: >
  Monoclonal mast cell activation syndrome is the entity defined by a threshold rather than
  by a lesion, and that is the whole difficulty of curating it. The patient has severe,
  recurrent, systemic mast cell mediator symptoms - classically hymenoptera-venom
  anaphylaxis without urticaria - and a demonstrably clonal mast cell population, carrying
  KIT D816V or aberrant CD25 or CD2 expression, or a clonal androgen-receptor assay result.
  What they do not have is enough mast cell burden to meet the WHO criteria for systemic
  mastocytosis. MMAS is what is left when the clonality is present and the criteria are not
  met.

  So the mechanism is the same mechanism as systemic mastocytosis, arrived at with a
  smaller cell population: an activating KIT mutation lowers the mast cell activation
  threshold and drives constitutive signalling, and the clinical picture is mediator
  release rather than organ infiltration. That is why the disease behaves as an
  anaphylaxis disorder while being, molecularly, a clonal neoplastic one.

  This entry is separate from `Systemic_Mastocytosis` on a decision the knowledge base has
  already recorded rather than one made here. `kb/groupings/Mastocytosis.yaml` states that
  MMAS "carries a clonal KIT D816V mast cell population but does not meet the mast cell
  burden that the proliferation and mastocytosis-finding operands require", and its
  membership criteria deliberately exclude it. The nosology agrees: the ECNM-AIM
  classification separates confirmed MCAS from mast cell activation disorder not fulfilling
  MCAS criteria, and places clonal and non-clonal MCAS in different categories.

  Two boundaries move under this entry and curators should know it. The 2021 refined
  criteria for bone marrow mastocytosis carve out a variant that is older, more male, has
  lower tryptase and lower neoplastic mast cell burden, and has *more* hymenoptera-triggered
  allergic reactions than typical indolent systemic mastocytosis - which is the same
  clinical description MMAS was built from, on the other side of the SM threshold. And MCAS
  as a category has never been uncontroversial; the 2010 criteria paper says so in its own
  abstract. Neither is a reason to avoid the entry, but both mean its extension depends on
  which criteria set is in force, and no prevalence figure here should be read as stable.
disease_term:
  preferred_term: monoclonal mast cell activation syndrome
  term:
    id: MONDO:0033954
    label: monoclonal mast cell activation syndrome
parents:
- Mast cell activation syndrome
genetic:
- name: KIT
  gene_term:
    preferred_term: KIT
    term:
      id: hgnc:6342
      label: KIT
  association: CAUSATIVE
  relationship_type: SOMATIC_DRIVER
  variant_origin: SOMATIC
  features: >
    Somatic activating KIT mutation, overwhelmingly D816V, in the mast cell compartment.
    It is the same driver as in systemic mastocytosis; what differs is burden, not the
    variant. Demonstrating it requires a sensitive assay on bone marrow, because the clonal
    population is small by definition, which is why the diagnosis cannot be made on
    peripheral blood or on symptoms.
  evidence:
  - reference: PMID:20434205
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients showing clonal BM MCs were grouped into indolent systemic mastocytosis without skin lesions (ISMs(-); n = 48) and other c-MCADs (n = 3)-both with CD25(++) BM MCs and either positive mast/stem cell growth factor receptor gene (KIT) mutation or clonal human androgen receptor assay (HUMARA) tests-and nc-MCAD (CD25-negative BM MCs in the absence of KIT mutation; n = 32) and compared for their clinical, biological, and molecular characteristics."
    explanation: >-
      Defines the clonality criteria this entry rests on, and shows the clonal-but-not-SM group
      is small even within a referred cohort: three of eighty-three patients.
  - reference: PMID:34298172
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we review the relevant aspects related to the pathogenesis of MCAS, with special emphasis on the prevalence and diagnostic relevance of KIT mutations."
    explanation: >-
      Establishes KIT mutation status as the pathogenetically and diagnostically relevant axis
      in mast cell activation syndromes.
pathophysiology:
- name: Somatic Activating KIT Mutation in a Small Mast Cell Clone
  biological_scale: MOLECULAR
  description: >
    An activating KIT variant, characteristically D816V, arises somatically in the mast
    cell lineage. The variant is the same one that drives systemic mastocytosis, and the
    distinguishing feature of this disorder is quantitative: the clone stays below the mast
    cell burden that the systemic mastocytosis criteria require. Nothing about the variant
    itself is different, which is why the entry does not claim a distinct molecular lesion.
  genetic_context:
    gene:
      preferred_term: KIT
      term:
        id: hgnc:6342
        label: KIT
    allele_type: SNV
    variant_origin: SOMATIC
    functional_impact_category: GAIN_OF_FUNCTION
    description: >-
      Somatic gain-of-function KIT variant, characteristically D816V, restricted to the mast
      cell compartment.
  molecular_functions:
  - preferred_term: protein tyrosine kinase activity
    term:
      id: GO:0004713
      label: protein tyrosine kinase activity
    modifier: GAIN_OF_FUNCTION
  downstream:
  - target: Constitutive KIT Downstream Signaling
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:30948489
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Furthermore, mast cell lines expressing D816V-KIT, but not those expressing normal KIT or other KIT variants, produced constitutively high IL-6 amounts at the message and protein levels."
      explanation: >-
        Shows the D816V variant specifically, and not normal KIT or other KIT variants, produces
        constitutive downstream output, which is the causal step this edge asserts.
  evidence:
  - reference: PMID:30948489
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "Since systemic mastocytosis often associates with the presence in hematopoietic cells of a somatic gain-of-function variant in KIT, D816V-KIT, we examined its potential role in IL-6 upregulation."
    explanation: >-
      Establishes D816V-KIT as a somatic gain-of-function variant in haematopoietic cells.
      Graded INDIRECT because the framing is systemic mastocytosis rather than MMAS, and the
      shared driver is the point being relied on.
- name: Constitutive KIT Downstream Signaling
  biological_scale: CELLULAR
  description: >
    D816V-KIT signals constitutively through STAT5 and PI3K, with STAT5A and STAT5B
    activation mediated by JAK2 and also by MEK and ERK1/2, the latter driving both STAT5
    phosphorylation and its long-term transcription. STAT3 and STAT4 are not involved. The
    functional consequence demonstrated in this pathway is persistent IL-6 production by
    the mast cell itself, which links the clone to a systemic inflammatory output
    independent of degranulation.
  cell_types:
  - preferred_term: mast cell
    term:
      id: CL:0000097
      label: mast cell
  downstream:
  - target: Lowered Mast Cell Activation Threshold
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:30948489
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We further demonstrate that aberrant KIT activity and signaling are critical for the induction of IL-6 and involve STAT5 and PI3K pathways but not STAT3 or STAT4."
    explanation: >-
      Identifies the pathways carrying the constitutive signal, and excludes two others.
  - reference: PMID:30948489
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Activation of STAT5A and STAT5B downstream of D816V-KIT was mediated by JAK2 but also by MEK/ERK1/2, which not only promoted STAT5 phosphorylation but also its long-term transcription."
    explanation: >-
      Details the kinases through which the constitutive signal reaches STAT5.
- name: Lowered Mast Cell Activation Threshold
  biological_scale: CELLULAR
  description: >
    The clonal mast cells activate and degranulate on stimuli that would not trigger normal
    mast cells, which is what converts a small clone into a systemic clinical syndrome. This
    is the node the entry is least able to source directly: the concept was articulated at
    the consensus conference that classified systemic mastocytosis variants, as a
    hypothesis, and the evidence curated here is that statement of the hypothesis rather
    than a measurement in MMAS patients. The `directness: INDIRECT` grading and this note
    are the honest description of its status.
  cell_types:
  - preferred_term: mast cell
    term:
      id: CL:0000097
      label: mast cell
  biological_processes:
  - preferred_term: mast cell activation
    term:
      id: GO:0045576
      label: mast cell activation
    modifier: INCREASED
  downstream:
  - target: Systemic Mast Cell Mediator Release
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:21035176
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: "There also may be unknown diseases of mast cell activation, in which mast cells either activate at a lower threshold of stimulation, or perhaps resist the usual stimuli to degranulate. The explanation for why some patients would have unexplained flushing or anaphylaxis would then be an abnormal sensitivity of their mast cells to activation"
    explanation: >-
      The consensus-conference formulation of the lowered-threshold hypothesis, quoted in a
      criteria paper. Graded INDIRECT and evidence_source OTHER because it is expert reasoning
      about a then-hypothetical disease class, not a measurement; it is curated because it is
      the origin of this node's claim rather than confirmation of it.
- name: Systemic Mast Cell Mediator Release
  biological_scale: ORGANISM
  description: >
    Degranulation releases histamine, tryptase and other mediators, producing severe,
    recurrent, systemic symptoms across skin, gastrointestinal tract and cardiovascular
    system. In clonal disease the episodes have a characteristic shape - cardiovascular
    collapse predominating, frequently without urticaria - which is what makes hymenoptera
    anaphylaxis in a patient with no skin lesions the classic presentation.
  cell_types:
  - preferred_term: mast cell
    term:
      id: CL:0000097
      label: mast cell
  biological_processes:
  - preferred_term: mast cell degranulation
    term:
      id: GO:0043303
      label: mast cell degranulation
    modifier: INCREASED
  downstream:
  - target: Anaphylaxis
    causal_link_type: DIRECT
  - target: Flushing
    causal_link_type: DIRECT
  - target: Hypotension
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:28740494
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although the release of mast cell (MC) mediators upon MC activation might present with a wide variety of symptoms, particular clinical features typically characterize MC mediator release episodes in patients with clonal MCD without skin involvement."
    explanation: >-
      Establishes that mediator release episodes in clonal disease without skin involvement have
      a characteristic clinical shape, which is the claim this node makes.
  - reference: PMID:35623575
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When the symptoms are severe, systemic, and recurrent, and accompanied by a diagnostic increase in the serum tryptase level or other mast cell mediators, an MCA syndrome (MCAS) may be diagnosed."
    explanation: >-
      States the severity, distribution, recurrence and mediator-rise pattern that defines the
      syndrome and that this node produces.
- name: Sub-threshold Clonal Burden
  biological_scale: TISSUE
  description: >
    The clonal population does not reach the mast cell burden required by the systemic
    mastocytosis criteria. This node records the defining negative, and it is the reason the
    entry exists: the disorder is constituted by failing a threshold, so the negative is
    part of the mechanism rather than a caveat about it. It has no downstream edges by
    design. Note that where the threshold sits has moved - the 2021 refined bone marrow
    mastocytosis criteria describe an SM variant with lower neoplastic mast cell burden and
    more hymenoptera-triggered reactions than typical indolent systemic mastocytosis - so
    this node's extension depends on which criteria set is applied.
  cell_types:
  - preferred_term: mast cell
    term:
      id: CL:0000097
      label: mast cell
  evidence:
  - reference: PMID:35623575
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this article, we discuss diagnostic features and criteria and propose a ICD-10-CM-adjusted classification for disorders associated with MCA, herein referred to as MCA disorders (MCADs), with special emphasis on the delineation between confirmed MCAS, MCAD not fulfilling MCAS criteria, and suspected MCAD that is not present."
    explanation: >-
      Establishes that the classification turns on which criteria are and are not fulfilled,
      which is the threshold logic this node encodes.
  - reference: PMID:34545185
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "BMM patients were significantly older, predominantly male, had lower tryptase and lower burden of neoplastic mast cells, and displayed a higher frequency of allergic reactions, mainly triggered by Hymenoptera, than patients with typical ISM."
    explanation: >-
      Describes an SM variant with low mast cell burden and hymenoptera-triggered reactions,
      which is the moving boundary this node sits against. Graded INDIRECT because the cohort is
      bone marrow mastocytosis, that is patients who do meet SM criteria.
phenotypes:
- category: Immunologic
  name: Anaphylaxis
  description: >
    Severe recurrent anaphylaxis, frequently hymenoptera-venom triggered and frequently
    without urticaria, and commonly the presenting event. Anaphylaxis prevalence in clonal
    mast cell disease is clearly higher than in the general population.
  phenotype_term:
    preferred_term: Anaphylaxis
    term:
      id: HP:0100845
      label: Anaphylactic shock
    temporality: RECURRENT
  frequency: VERY_FREQUENT
  diagnostic: true
  evidence:
  - reference: PMID:28740494
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The prevalence of anaphylaxis among patients with clonal mast cell disorders (MCD) is clearly higher comparing to the general population."
    explanation: >-
      Establishes raised anaphylaxis prevalence in clonal mast cell disease, the group this
      entry belongs to.
  - reference: PMID:28740494
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Due to a lower frequency of symptoms outside of acute episodes, clonal MCD in the absence of skin lesions might sometimes be difficult to identify which may lead to underdiagnosis, and anaphylaxis is commonly the presenting symptom in these patients."
    explanation: >-
      States that anaphylaxis is commonly the presenting symptom and that the disorder is
      underdiagnosed for lack of interval symptoms.
- category: Cardiovascular

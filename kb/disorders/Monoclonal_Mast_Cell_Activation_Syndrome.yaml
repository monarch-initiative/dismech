- category: Gastrointestinal
  name: Abdominal pain
  phenotype_term:
    preferred_term: Abdominal pain
    term:
      id: HP:0002027
      label: Abdominal pain
    temporality: RECURRENT
  evidence:
  - reference: PMID:23179866
    reference_title: "Mast cell activation syndrome: a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Earlier proposed criteria for the diagnosis of MCAS included episodic symptoms consistent with mast cell mediator release affecting two or more organ systems with urticaria, angioedema, flushing, nausea, vomiting, diarrhea, abdominal cramping, hypotensive syncope or near syncope, tachycardia, wheezing, conjunctival injection, pruritus, and nasal stuffiness."

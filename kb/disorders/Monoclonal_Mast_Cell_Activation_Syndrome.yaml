    evidence_source: OTHER
    snippet: "The last several years have witnessed an increasing use of the term “mast cell activation syndrome (MCAS)” as a diagnosis for individuals who present with signs and symptoms from flushing to hives, abdominal pain to diarrhea, and paresthesias to cognitive dysfunction"

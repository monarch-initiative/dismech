- category: Dermatologic
  name: Absence of skin lesions
  description: >
    The absence of cutaneous mastocytosis lesions is part of the diagnostic setting rather
    than a symptom, and it is what makes the disorder hard to find: patients have few
    symptoms between episodes and no skin sign to prompt investigation. Curated because the
    negative carries diagnostic weight, left unbound, and deliberately so: see the note below.
  phenotype_term:
    preferred_term: absence of cutaneous mastocytosis lesions
  evidence:
  - reference: PMID:20434205
    reference_title: "Clinical, biological, and molecular characteristics of clonal mast cell disorders presenting with systemic mast cell activation symptoms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To analyze the clinical, biological, and molecular characteristics of adult patients presenting with systemic MC activation symptoms/anaphylaxis in the absence of skin mastocytosis who showed clonal (c) versus nonclonal (nc) MCs and to provide indication criteria for bone marrow (BM) studies."
    explanation: >-
      Establishes absence of skin mastocytosis as the defining clinical setting of the cohort in
      which clonal and non-clonal disease were separated.
biochemical:
- name: Serum baseline tryptase
  notes: >
    Raised serum baseline tryptase is the mediator marker that prompts investigation and is
    part of the diagnostic increase required for a mast cell activation syndrome diagnosis.
    It is also the axis on which the moving SM boundary is drawn: the refined bone marrow
    mastocytosis criteria use a tryptase level below 125 ng/mL as one of their defining
    features, so tryptase does double duty as a mediator readout and as a burden proxy.
  biomarker_term:
    preferred_term: Elevated total serum tryptase
    term:
      id: HP:0031901
      label: Elevated total serum tryptase
  presence: INCREASED
  readouts:
  - target: Systemic Mast Cell Mediator Release
    relationship: READOUT_OF
    direction: POSITIVE
    endpoint_context: DIAGNOSTIC
    interpretation: >-
      Raised baseline tryptase reports the mast cell mediator burden and is part of the
      diagnostic increase the syndrome definition requires.
  evidence:
  - reference: PMID:20434205
    reference_title: "Clinical, biological, and molecular characteristics of clonal mast cell disorders presenting with systemic mast cell activation symptoms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Systemic mast cell activation disorders (MCADs) are characterized by severe and systemic mast cell (MC) mediators-related symptoms frequently associated with increased serum baseline tryptase (sBt)."
    explanation: >-
      Establishes raised serum baseline tryptase as a characteristic feature of systemic mast
      cell activation disorders.
  - reference: PMID:34545185
    reference_title: "Refined diagnostic criteria for bone marrow mastocytosis: a proposal of the European competence network on mastocytosis."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "These data support the proposal to define BMM as a separate SM variant characterized by SM criteria, absence of skin lesions, absence of B-Findings, and tryptase levels <125 ng/mL."
    explanation: >-
      Shows tryptase being used as a criteria threshold in the neighbouring category. Graded
      INDIRECT because the criteria are for bone marrow mastocytosis, not for this disorder.
treatments:
- name: Epinephrine for Acute Anaphylaxis
  description: >
    First-line treatment of the acute episode, and given the frequency of hymenoptera-venom
    anaphylaxis as the presenting event, self-injectable epinephrine is the practical
    mainstay. No trial evidence specific to this disorder exists; this is standard
    anaphylaxis management applied to a population with an unusually high anaphylaxis rate.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: epinephrine
      term:
        id: CHEBI:33568
        label: adrenaline
  therapeutic_modality: SMALL_MOLECULE
  target_phenotypes:
  - preferred_term: Anaphylaxis
    term:
      id: HP:0100845
      label: Anaphylactic shock
  target_mechanisms:
  - target: Systemic Mast Cell Mediator Release
    description: >-
      Counteracts the haemodynamic and airway effects of released mediators. It does not act
      on the clone or on the activation threshold.
  evidence:
  - reference: PMID:28740494
    reference_title: "Insights in Anaphylaxis and Clonal Mast Cell Disorders."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this article, we address the main triggers for anaphylaxis, risk factors, clinical presentation, diagnosis, and management of patients with MC activation syndromes (MCASs), with special emphasis on clonal MCAS [systemic mastocytosis and mono(clonal) MC activations syndromes]."
    explanation: >-
      Establishes that management of anaphylaxis in monoclonal mast cell activation syndrome is
      an addressed clinical topic. Graded INDIRECT because the abstract states the scope rather
      than the specific recommendation, so this citation supports the treatment being relevant
      rather than reporting its effect.
- name: Hymenoptera Venom Immunotherapy
  description: >
    The most disorder-specific management point here, and the reason establishing clonality
    changes care rather than only classification. Patients with venom allergy and a clonal mast
    cell disorder are treated with immunotherapy against the venom they are sensitised to, and
    for this high-risk subgroup the recommendation is to continue it beyond five years or
    indefinitely and to carry at least three epinephrine autoinjectors rather than one. Both
    departures from standard venom-allergy practice follow from the clonal diagnosis.
  treatment_term:
    preferred_term: Immunotherapy
    term:
      id: NCIT:C15262
      label: Immunotherapy
  therapeutic_modality: OTHER
  target_mechanisms:
  - target: Lowered Mast Cell Activation Threshold
    description: >-
      Raises the threshold for venom-triggered degranulation by inducing tolerance to the
      sensitising allergen. It does not act on the clone.
  evidence:
  - reference: PMID:39187156
    reference_title: "Mast Cell Disorders and Hymenoptera Venom-Triggered Anaphylaxis: Evaluation and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "For this high-risk subgroup of patients with HVA, it is recommended to continue immunotherapy for more than 5 years or indefinitely and to carry at least three epinephrine autoinjectors."
    explanation: >-
      States both the indefinite duration and the three-autoinjector recommendation that
      distinguish management in clonal disease from standard venom-allergy care.
  - reference: PMID:39187156
    reference_title: "Mast Cell Disorders and Hymenoptera Venom-Triggered Anaphylaxis: Evaluation and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with HVA and a clonal MCD should be treated with immunotherapy directed against the Hymenoptera venom for which they are sensitized."
    explanation: >-
      States the indication for venom immunotherapy in clonal mast cell disease specifically.
- name: Anti-mediator Therapy
  description: >
    H1 and H2 histamine receptor antagonists, anti-leukotrienes and mast cell stabilisers such
    as cromolyn, used to suppress mediator production or block mediator effects between and
    during episodes. Response to these agents is not merely therapeutic: a decrease in
    frequency or severity of symptoms on anti-mediator therapy is itself one of the diagnostic
    criteria for the syndrome, so treatment and diagnosis are entangled here in a way they are
    not in most entries.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  therapeutic_modality: SMALL_MOLECULE
  target_mechanisms:
  - target: Systemic Mast Cell Mediator Release
    description: >-
      Blocks mediator receptors or stabilises the mast cell against degranulation. It does not
      act on the clone.
  evidence:
  - reference: PMID:23179866
    reference_title: "Mast cell activation syndrome: a review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Other criteria included a decrease in the frequency, severity, or resolution of symptoms with anti-mediator therapy including H(1) and H(2)histamine receptor antagonists, anti-leukotrienes, or mast cell stabilizers."
    explanation: >-
      Names the anti-mediator agents and records that response to them is part of the diagnostic
      criteria, which is the entanglement this treatment description notes.
  - reference: PMID:35623575
    reference_title: "Global Classification of Mast Cell Activation Disorders: An ICD-10-CM-Adjusted Proposal of the ECNM-AIM Consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In these patients, the symptoms typically respond to drugs suppressing MCA, mediator production in mast cells, or mediator effects."
    explanation: >-
      Confirms symptomatic response to the three classes of mediator-directed drug.
diagnosis:
- name: Bone marrow study for clonality assessment
  description: >
    The step the diagnosis depends on. Establishing clonality moves a patient from idiopathic
    anaphylaxis to a clonal mast cell disorder with different surveillance, and it cannot be
    done on peripheral blood or on symptoms. The recommendation is that it be performed in
    reference centres. A sensitive assay is needed because the clone is small by definition.
  markers: KIT D816V, aberrant CD25 or CD2 expression, or a clonal HUMARA result, on bone marrow mast cells
  evidence:
  - reference: PMID:28740494
    reference_title: "Insights in Anaphylaxis and Clonal Mast Cell Disorders."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Final diagnosis requires a bone marrow study, and it is recommended that this should be done in reference centers."
    explanation: >-
      States that bone marrow study is required for diagnosis and should be done in reference
      centres.
  - reference: PMID:20434205
    reference_title: "Clinical, biological, and molecular characteristics of clonal mast cell disorders presenting with systemic mast cell activation symptoms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To analyze the clinical, biological, and molecular characteristics of adult patients presenting with systemic MC activation symptoms/anaphylaxis in the absence of skin mastocytosis who showed clonal (c) versus nonclonal (nc) MCs and to provide indication criteria for bone marrow (BM) studies."
    explanation: >-
      Establishes that indication criteria for bone marrow study in this population were the
      explicit object of the defining cohort.
- name: Red Espanola de Mastocitosis (REMA) score
  description: >
    The instrument that decides who is sent for a bone marrow biopsy, calculated from
    anaphylaxis clinical features, baseline serum tryptase and sex. It sits upstream of the
    clonality assessment: the recommendation is biopsy at a REMA score of 2 or more, or with
    monomorphic maculopapular cutaneous mastocytosis lesions, or an elevated baseline tryptase
    given the patient's tryptase genotype. Note the genotype step, which exists because
    hereditary alpha-tryptasemia raises baseline tryptase independently of any clone and would
    otherwise send the wrong patients to biopsy.
  markers: anaphylaxis clinical features, baseline serum tryptase, tryptase genotype, sex
  evidence:
  - reference: PMID:39187156
    reference_title: "Mast Cell Disorders and Hymenoptera Venom-Triggered Anaphylaxis: Evaluation and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A bone marrow biopsy should be performed in patients with monomorphic maculopapular cutaneous mastocytosis, a Red Española de Mastocitosis score of 2 or greater, or an elevated BST based on tryptase genotype."
    explanation: >-
      States the biopsy threshold this record captures, including the tryptase-genotype
      qualifier.
  - reference: PMID:39187156
    reference_title: "Mast Cell Disorders and Hymenoptera Venom-Triggered Anaphylaxis: Evaluation and Management."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The pretest probability of clonal MCD can be assessed in a stepwise fashion starting with examination of the skin for typical monomorphic maculopapular cutaneous mastocytosis lesions; measurement of the baseline serum tryptase (BST) and tryptase genotyping for patients with BST greater than 11 ng/mL; followed by the Red Española de Mastocitosis score, which is calculated using anaphylaxis clinical features, BST, and the patient's sex."
    explanation: >-
      Gives the score's components and its place in the stepwise pretest-probability assessment.
- name: Mast cell activation syndrome mediator criterion
  description: >
    Diagnosis of the syndrome layer requires severe, systemic and recurrent symptoms
    accompanied by a diagnostic rise in serum tryptase or another mast cell mediator, and
    response to drugs suppressing mast cell activation or mediator effects. The monoclonal
    qualifier is then added by the clonality finding above. Note that consensus criteria must
    be fulfilled for the syndrome diagnosis at all, which is what makes this disorder a
    conjunction of two separate criteria sets rather than one.
  evidence:
  - reference: PMID:35623575
    reference_title: "Global Classification of Mast Cell Activation Disorders: An ICD-10-CM-Adjusted Proposal of the ECNM-AIM Consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "When the symptoms are severe, systemic, and recurrent, and accompanied by a diagnostic increase in the serum tryptase level or other mast cell mediators, an MCA syndrome (MCAS) may be diagnosed."
    explanation: >-
      States the mediator-rise criterion this diagnosis record captures.
  - reference: PMID:35623575
    reference_title: "Global Classification of Mast Cell Activation Disorders: An ICD-10-CM-Adjusted Proposal of the ECNM-AIM Consortium."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In each case, diagnostic consensus criteria must be fulfilled to diagnose MCAS."
    explanation: >-
      Establishes that the syndrome diagnosis is criteria-gated, which is what makes this
      disorder a conjunction of a syndrome criterion and a clonality criterion.
definitions:
- name: Clonality-based separation of monoclonal from non-clonal mast cell activation syndrome
  definition_type: DIAGNOSTIC_CRITERIA
  derivation_basis: ESTABLISHED_CRITERIA
  attaches_to:
  - pathophysiology#Sub-threshold Clonal Burden
  - genetic#KIT
  description: >
    The operative distinction is made on bone marrow mast cells: aberrant CD25 expression
    together with either a KIT mutation or a clonal human androgen receptor assay result
    defines clonal disease, and CD25-negative mast cells without a KIT mutation define
    non-clonal disease. Monoclonal mast cell activation syndrome is then the clonal group
    that does not meet systemic mastocytosis criteria. Note the practical asymmetry: in the
    cohort this criterion set comes from, the clonal group was dominated by indolent
    systemic mastocytosis without skin lesions, and only three of eighty-three patients fell
    into the clonal-but-not-SM category. So applying the criterion mostly reclassifies
    patients as systemic mastocytosis, and this diagnosis is what remains.
  validation_status:
    status: UNVALIDATED
    rationale: >-
      The criteria are consensus- and cohort-derived and are in clinical use, but no diagnostic
      accuracy study establishes operating characteristics for the monoclonal category
      specifically, and the neighbouring systemic mastocytosis threshold has been redefined
      since, which moves this category's boundary without revalidating it.
  evidence:
  - reference: PMID:20434205
    reference_title: "Clinical, biological, and molecular characteristics of clonal mast cell disorders presenting with systemic mast cell activation symptoms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients showing clonal BM MCs were grouped into indolent systemic mastocytosis without skin lesions (ISMs(-); n = 48) and other c-MCADs (n = 3)-both with CD25(++) BM MCs and either positive mast/stem cell growth factor receptor gene (KIT) mutation or clonal human androgen receptor assay (HUMARA) tests-and nc-MCAD (CD25-negative BM MCs in the absence of KIT mutation; n = 32) and compared for their clinical, biological, and molecular characteristics."
    explanation: >-
      States the clonality criteria and the group sizes this definition records.
discussions:
- discussion_id: mmas_boundary_moves_with_sm_criteria
  kind: KNOWLEDGE_GAP
  prompt: >-
    How much of what was called monoclonal mast cell activation syndrome is now bone marrow
    mastocytosis, and does the category retain a distinct population?
  attaches_to:
  - pathophysiology#Sub-threshold Clonal Burden
  - definitions#Clonality-based separation of monoclonal from non-clonal mast cell activation syndrome
  rationale: >
    This entity is defined by failing the systemic mastocytosis criteria, so redefining those
    criteria redefines it, without anybody restudying it. The 2021 refined criteria carve out
    bone marrow mastocytosis as an SM variant that is older, more male, has lower tryptase and
    lower neoplastic mast cell burden, and has more hymenoptera-triggered allergic reactions
    than typical indolent systemic mastocytosis. That is the same clinical description this
    category was assembled from, on the other side of the threshold. No study has
    reclassified an MMAS cohort under the refined criteria to see what is left, and the
    original cohort had three such patients, so the question is whether the category survives
    as a population or only as a residual definition. Until that is answered, no prevalence or
    frequency figure for this entry is stable.
- discussion_id: threshold_hypothesis_unmeasured
  kind: KNOWLEDGE_GAP
  prompt: >-
    Has a lowered mast cell activation threshold ever been measured in monoclonal mast cell
    activation syndrome patients, as opposed to inferred?
  attaches_to:
  - pathophysiology#Lowered Mast Cell Activation Threshold
  rationale: >
    The lowered-threshold model is the link between a very small clone and a systemic clinical
    syndrome, and it is the load-bearing step in the mechanism. Its origin is a
    consensus-conference conjecture about a then-hypothetical class of disease, quoted in the
    2010 criteria paper, and the sources curated here contain no measurement of activation
    threshold in patients with this diagnosis. The alternative account - that mediator output
    scales with clone size and the syndrome is simply the low end of systemic mastocytosis -
    is not excluded by anything cited, and would predict that MMAS and low-burden systemic
    mastocytosis are one continuum, which is what the boundary question above asks from the
    other direction.
- discussion_id: mcas_category_contested
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is mast cell activation syndrome, as a clinical entity, established enough for its
    monoclonal subset to be a stable disease concept?
  attaches_to:
  - disease#Monoclonal Mast Cell Activation Syndrome
  rationale: >
    The 2010 criteria paper states in its own abstract that MCAS as a distinct clinical entity
    has not been generally accepted and that definitive diagnostic criteria do not exist, and
    it proposes criteria explicitly as a basis for further study and validation. The 2022
    ECNM-AIM classification is a substantial advance but is itself framed as a proposal and
    notes that validated diagnostic criteria for implicating suspected mast cell activation are
    lacking. The monoclonal subset is the best-defined part of that landscape, because clonality
    is a demonstrable laboratory fact rather than a symptom pattern, which is why this entry
    curates it rather than the broader category. The contestedness is recorded because it bounds
    how much weight any epidemiology or phenotype frequency here can carry.
prevalence:
- population: Adults with systemic mast cell activation symptoms or anaphylaxis and no skin mastocytosis, referred for bone marrow study
  measure_type: POINT_PREVALENCE
  prevalence_class: UNKNOWN
  notes: >-
    Three of 83 such patients fell into the clonal-but-not-systemic-mastocytosis category; 48
    had indolent systemic mastocytosis without skin lesions and 32 were non-clonal. This is a
    proportion within a highly selected referred population, not a population prevalence, and
    it predates the refined bone marrow mastocytosis criteria that have since moved the
    boundary. prevalence_class is UNKNOWN deliberately: no population figure exists and this
    proportion should not be converted into one.
  evidence:
  - reference: PMID:20434205
    reference_title: "Clinical, biological, and molecular characteristics of clonal mast cell disorders presenting with systemic mast cell activation symptoms."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients showing clonal BM MCs were grouped into indolent systemic mastocytosis without skin lesions (ISMs(-); n = 48) and other c-MCADs (n = 3)-both with CD25(++) BM MCs and either positive mast/stem cell growth factor receptor gene (KIT) mutation or clonal human androgen receptor assay (HUMARA) tests-and nc-MCAD (CD25-negative BM MCs in the absence of KIT mutation; n = 32) and compared for their clinical, biological, and molecular characteristics."
    explanation: >-
      Gives the numerator and denominator behind this proportion, and the composition of the
      cohort it comes from.

- name: Clonal Leukemic Transformation
  biological_scale: CELLULAR
  description: >-
    Over time a haematopoietic clone in a carrier acquires somatic cooperating lesions, often
    including deletion of the wild-type ETV6 allele and, in B-ALL, lesions of IKZF1, PAX5 and other
    B-lineage genes, and transforms. B-ALL in carriers is often hyperdiploid and arises at an older
    median age than sporadic childhood ALL.
  evidence:
  - reference: PMID:26102509
    reference_title: "Germline ETV6 Mutations Confer Susceptibility to Acute Lymphoblastic Leukemia and Thrombocytopenia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Genome-wide DNA copy alteration analysis using single nucleotide polymorphism microarrays of
      the diagnostic ALL sample from the proband in Kindred 2 revealed deletion of the wild type and
      retention of the mutant ETV6 allele, as well as deletions of IKZF1, PAX5, BTG1, and RB1.
    explanation: Somatic second hit and cooperating deletions in a carrier's leukaemia.
  - reference: PMID:26522332
    reference_title: "Germline genetic variation in ETV6 and risk of childhood acute lymphoblastic leukaemia: a systematic genetic study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The hyperdiploid leukaemia karyotype was highly over-represented in ALL cases harbouring
      germline ETV6 risk variants compared with the wild-type group
    explanation: Distinctive leukaemia karyotype in germline carriers.

name: ETV6-Related Thrombocytopenia
creation_date: "2026-10-31T19:00:00Z"
category: Mendelian
description: >-
  ETV6-related thrombocytopenia (thrombocytopenia 5, THC5) is an autosomal dominant inherited
  platelet disorder with predisposition to haematological malignancy, caused by heterozygous
  germline variants in ETV6, which encodes an ETS-family transcriptional repressor. Affected
  individuals have lifelong, usually mild-to-moderate thrombocytopenia with normal platelet size,
  mild bleeding that can exceed what the platelet count predicts, and red cell macrocytosis in a
  subset. The most consequential feature is an incompletely penetrant risk of haematological
  malignancy, most often childhood B-cell acute lymphoblastic leukaemia, with myelodysplastic
  syndrome and myeloid leukaemias also reported. Most pathogenic variants are missense changes in
  the ETS DNA-binding domain or the central linker domain; the mutant protein is retained in the
  cytoplasm, dimerises with and sequesters wild-type ETV6, and so acts as a dominant negative,
  abolishing transcriptional repression. In megakaryocytes this produces a maturation defect with
  impaired proplatelet formation, and the resulting platelets show cytoskeletal and functional
  defects. Leukaemic progression is accompanied by somatic second hits, including loss of the
  wild-type ETV6 allele.
synonyms:
- thrombocytopenia 5
- THC5
- ETV6-Related Thrombocytopenia and Predisposition to Leukemia
- ETV6-related thrombocytopenia with or without myeloid malignancy
- ETV6 thrombocytopenia
- thrombocytopenia caused by mutation in ETV6

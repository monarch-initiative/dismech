      consideration of bone marrow aspirate and biopsy every one to three years.
    explanation: GeneReviews surveillance recommendation.
- name: Allogeneic Hematopoietic Cell Transplantation with Carrier-Aware Donor Selection
  description: >-
    Malignancies are treated with standard neoplasm-specific therapy, with added consideration of
    stem cell transplantation. Related donors should be tested so that a relative carrying the same
    germline variant is not used, because donor-derived leukaemia has followed transplantation from
    variant-positive relatives in hereditary predisposition syndromes.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: allogeneic hematopoietic cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
  target_mechanisms:
  - target: Clonal Leukemic Transformation
    treatment_effect: INHIBITS
  evidence:
  - reference: PMID:33226740
    reference_title: "ETV6-Related Thrombocytopenia and Predisposition to Leukemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For neoplasm, standard neoplasm-specific therapy with extra consideration of indications for
      stem cell transplantation, eligibility, and available donors.
    explanation: GeneReviews management of neoplasms.
  - reference: PMID:42418371
    reference_title: "Outcomes of germ line testing for children with hematologic malignancies undergoing hematopoietic cell transplantation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Of 5 patients who received an HCT from a PV-positive relative, 1 patient developed
      donor-derived leukemia.
    explanation: >-
      Pan-gene paediatric transplant cohort, not ETV6-specific; shows the donor-derived leukaemia
      risk that motivates testing related donors.
- name: Genetic Counseling and Cascade Testing
  description: >-
    Each child of a carrier has a 50% chance of inheriting the variant. Testing apparently
    unaffected relatives identifies those who need malignancy surveillance and bleeding
    management, and informs related-donor selection.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:33226740
    reference_title: "ETV6-Related Thrombocytopenia and Predisposition to Leukemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      It is appropriate to clarify the genetic status of apparently asymptomatic older and younger
      at-risk relatives of an affected individual in order to identify as early as possible those
      who would benefit from prompt initiation of clinical surveillance for malignancy and
      management of potential significant thrombocytopenia.
    explanation: GeneReviews evaluation of relatives at risk.
prevalence:
- population: Reported families worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    No population prevalence has been measured. Eighteen families had been reported by 2017. In a
    consecutive Italian series ETV6 accounted for 2.6% of families with inherited thrombocytopenia,
    and germline ETV6 risk variants were found in about 1% of unselected childhood ALL; neither
    figure is a population prevalence.
  evidence:
  - reference: PMID:28555414
    reference_title: "Germline ETV6 mutations and predisposition to hematological malignancies."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Since the first description of germline ETV6 mutations, 18 families have been reported.
    explanation: Count of reported families at the time of review.
differential_diagnoses:
- name: RUNX1 familial platelet disorder with associated myeloid malignancy
  disease_term:
    preferred_term: RUNX1 familial platelet disorder with associated myeloid malignancy
    term:
      id: MONDO:0100083
      label: hereditary thrombocytopenia and hematological cancer predisposition syndrome associated with RUNX1
  description: >-
    Autosomal dominant thrombocytopenia with normal platelet size and malignancy predisposition,
    resolved by molecular testing.
  distinguishing_features:
  - A germline RUNX1 variant rather than an ETV6 variant.
  - Malignancies are predominantly myeloid, whereas B-ALL predominates in ETV6 carriers.
  - RUNX1-mutant iPSC-derived megakaryocytes are fewer and more agonist-responsive, the opposite of ETV6-mutant ones.
  evidence:
  - reference: PMID:27365488
    reference_title: "Clinical and pathogenic features of ETV6-related thrombocytopenia with predisposition to acute lymphoblastic leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since the dominant thrombocytopenias due to mutations in RUNX1 and ANKRD26 are also
      characterized by normal platelet size and predispose to hematologic malignancies, we suggest
      that screening for ETV6, RUNX1 and ANKRD26 mutations should be performed in all subjects with
      autosomal dominant thrombocytopenia and normal platelet size.
    explanation: Clinical overlap that makes RUNX1 and ANKRD26 the principal differentials.
  - reference: PMID:34019812
    reference_title: "Study of inherited thrombocytopenia resulting from mutations in ETV6 or RUNX1 using a human pluripotent stem cell model."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      On the contrary, RUNX1-mutant iPSCs yield fewer hematopoietic progenitor cells and
      megakaryocytes, but the megakaryocytes are more responsive to agonist stimulation.
    explanation: Cellular phenotype differs from the ETV6-mutant line.
- name: ANKRD26-related thrombocytopenia
  disease_term:
    preferred_term: ANKRD26-related thrombocytopenia
    term:
      id: MONDO:0008555
      label: thrombocytopenia 2
  description: >-
    Autosomal dominant thrombocytopenia with normal platelet size and predisposition to myeloid
    malignancy, caused by 5' untranslated region variants in ANKRD26.
  distinguishing_features:
  - A germline ANKRD26 variant rather than an ETV6 variant.
  evidence:
  - reference: PMID:27365488
    reference_title: "Clinical and pathogenic features of ETV6-related thrombocytopenia with predisposition to acute lymphoblastic leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Since the dominant thrombocytopenias due to mutations in RUNX1 and ANKRD26 are also
      characterized by normal platelet size and predispose to hematologic malignancies, we suggest
      that screening for ETV6, RUNX1 and ANKRD26 mutations should be performed in all subjects with
      autosomal dominant thrombocytopenia and normal platelet size.
    explanation: Shared normal platelet size and malignancy risk.
- name: Immune thrombocytopenia
  disease_term:
    preferred_term: immune thrombocytopenia
    term:
      id: MONDO:0008558
      label: autoimmune thrombocytopenic purpura
  description: >-
    Isolated thrombocytopenia with normal platelet size can be mistaken for immune thrombocytopenia,
    leading to ineffective steroids or splenectomy.
  distinguishing_features:
  - A family history of thrombocytopenia or leukaemia and lifelong stable thrombocytopenia favour ETV6-RT.
  - Failure to respond to immune thrombocytopenia therapies.
  evidence:
  - reference: PMID:27365488
    reference_title: "Clinical and pathogenic features of ETV6-related thrombocytopenia with predisposition to acute lymphoblastic leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      One patient (E/I-3) was initially misdiagnosed with immune thrombocytopenia, and received
      steroids and underwent splenectomy at the age of 9 years without this producing an increase
      in his platelet count.
    explanation: Documented misdiagnosis as ITP with ineffective treatment.
animal_models:
- name: Etv6 knock-in mouse of the recurrent human germline mutation
  species: Mouse
  genotype: CRISPR/Cas9 knock-in of the most common recurrent disease-causing germline ETV6 mutation
  publication: PMID:35803545
  modeled_mechanisms:
  - target: Sterile Bone Marrow Inflammation
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    description: The knock-in mouse shows sterile inflammation with raised marrow cytokines.
    limitations: >-
      Human marrow inflammation in carriers has not been directly shown; the human link rests on an
      interferon gene signature in blood cells.
    evidence:
    - reference: PMID:35803545
      reference_title: "Germline ETV6 mutation promotes inflammation and disrupts lymphoid development of early hematopoietic progenitors."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        We found defects in hematopoiesis related primarily to abnormalities of the multipotent
        progenitor population 4 (MPP4) subset of hematopoietic progenitor cells and evidence of
        sterile inflammation.
      explanation: Model phenotype underlying the link.
  - target: Impaired B-Lymphoid Development of Multipotent Progenitors
    relationship: RECAPITULATES
    fidelity: UNKNOWN
    description: MPP4 cells from the model have impaired B-cell development in response to IL-18 and IL-13.
    evidence:
    - reference: PMID:35803545
      reference_title: "Germline ETV6 mutation promotes inflammation and disrupts lymphoid development of early hematopoietic progenitors."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Among these, interleukin-18 and interleukin-13 abrogated B-cell development of sorted MPP4
        cells, but not common lymphoid progenitors
      explanation: Model phenotype underlying the link.
- name: Humanized ETV6 P214L mouse
  species: Mouse
  genotype: Etv6 humanized at the P214L-equivalent region to carry the human germline P214L mutation
  publication: PMID:40238870
  modeled_mechanisms:
  - target: Thrombocytopenia
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: Humanized P214L mice are thrombocytopenic and have haematopoietic stem cell defects.
    limitations: >-
      The mouse residue had to be humanized for the mutation to create a functional nuclear export
      signal, so single-residue mouse knock-ins do not model this allele.
    evidence:
    - reference: PMID:40238870
      reference_title: "A germline ETV6 mutation disrupts hematopoiesis via de novo creation of a nuclear export signal."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Mechanistic insight inspired the design of "humanized" ETV6 mice in which the germline P214L
        mutation is sufficient to elicit severe defects in thrombopoiesis and hematopoietic stem cell
        maintenance and survival in animals.
      explanation: Model reproduces the thrombopoiesis defect.
references:
- reference: PMID:33226740
  title: "ETV6-Related Thrombocytopenia and Predisposition to Leukemia."
  tags:
  - GeneReviews
notes: >-
  Germline predisposition syndrome kept separate from somatic ETV6-altered leukaemia entries, in line
  with the cancer granularity rules. Solid tumours have been reported in some carriers, and a
  common ETV6 polymorphism is associated with colorectal carcinoma, but a causal increase in solid
  tumour risk is not established, so no solid tumour phenotype is asserted. Red cell macrocytosis
  is variable between series, and the original reports differed partly because of different upper
  limits of normal MCV.

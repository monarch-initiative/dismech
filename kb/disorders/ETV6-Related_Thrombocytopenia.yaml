- name: Sterile Bone Marrow Inflammation
  biological_scale: TISSUE
  description: >-
    Mice carrying the recurrent germline Etv6 mutation show sterile inflammation with raised
    marrow cytokines, including interleukin-18 and interleukin-13. Its contribution to human
    disease is inferred from this model and from the interferon signature in patient cells.

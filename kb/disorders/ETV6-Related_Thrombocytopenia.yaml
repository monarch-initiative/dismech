    reference_title: "ETV6-Related Thrombocytopenia and Predisposition to Leukemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For individuals with a history of moderate or severe bleeding, antifibrinolytic agents or
      desmopressin may be considered prior to surgical procedures to reduce bleeding complications.
    explanation: GeneReviews management recommendation.
  - reference: PMID:33226740
    reference_title: "ETV6-Related Thrombocytopenia and Predisposition to Leukemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      For those with a history of bleeding, avoidance of medications that decrease platelet function
      (e.g., aspirin, nonsteroidal anti-inflammatory drugs) and avoidance of participation in
      contact sports are recommended.
    explanation: GeneReviews agents and circumstances to avoid.

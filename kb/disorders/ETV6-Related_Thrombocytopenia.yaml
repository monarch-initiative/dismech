pathophysiology:
- name: Dominant-Negative Cytoplasmic Retention of ETV6
  biological_scale: MOLECULAR
  description: >-
    Germline ETV6 missense and truncating variants yield stable mutant protein that is retained in
    the cytoplasm instead of the nucleus. Because ETV6 acts as a pointed-domain homodimer, mutant
    protein dimerises with and also retains wild-type ETV6 in the cytoplasm, a dominant-negative
    effect. For the recurrent central-domain variant p.Pro214Leu the mechanism is the de novo
    creation of an XPO1-dependent nuclear export signal; for ETS-domain variants nuclear import or
    retention is impaired by a mechanism that is less well defined.
  genes:
  - preferred_term: ETV6
    term:
      id: hgnc:3495
      label: ETV6
  molecular_functions:
  - preferred_term: DNA-binding transcription repressor activity, RNA polymerase II-specific
    term:
      id: GO:0001227
      label: DNA-binding transcription repressor activity, RNA polymerase II-specific
    modifier: DECREASED
  biological_processes:
  - preferred_term: XPO1-dependent nuclear export of ETV6 p.Pro214Leu
    term:
      id: GO:0006611
      label: protein export from nucleus
    modifier: INCREASED
  evidence:
  - reference: PMID:25807284
    reference_title: "Germline mutations in ETV6 are associated with thrombocytopenia, red cell macrocytosis and predisposition to lymphoblastic leukemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These results indicate that the mutant forms of ETV6 mislocalize inside cells, and by
      dimerizing with endogenous WT protein, may also prevent nuclear localization, further
      compromising ETV6 repression activity.
    explanation: >-
      Transduced megakaryocytes show cytoplasmic mutant ETV6 and dimerisation with wild-type
      protein, the basis of the dominant-negative model.
  - reference: PMID:35586967
    reference_title: "ETV6-related thrombocytopenia: dominant negative effect of mutations as common pathogenic mechanism."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Moreover, we have demonstrated that the mutations act through a dominant negative effect,
      which results in accumulation of the wild-type (WT) protein in the cytoplasm likely due to
      formation of WT-mutant dimer of ETV6.
    explanation: Shows across variants that wild-type ETV6 is retained in the cytoplasm by mutant protein.
  - reference: PMID:40238870
    reference_title: "A germline ETV6 mutation disrupts hematopoiesis via de novo creation of a nuclear export signal."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Here, we report that the ETV6 P214L mutation creates an XPO1-dependent nuclear export signal
      to cause protein mislocalization.
    explanation: Defines the nuclear export mechanism for the recurrent p.Pro214Leu variant.
  - reference: PMID:26102509
    reference_title: "Germline ETV6 Mutations Confer Susceptibility to Acute Lymphoblastic Leukemia and Thrombocytopenia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Enforced expression of the ETV6 mutants revealed normal transcript and protein levels, but
      impaired nuclear localization.
    explanation: ETS-domain mutants (L349P, N385fs) are stable but fail to localise to the nucleus.

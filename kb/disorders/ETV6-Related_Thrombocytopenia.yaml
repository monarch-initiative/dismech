- name: Haematological Malignancy Surveillance
  description: >-
    Carriers are monitored with a complete blood count with differential every 6 to 12 months and
    consideration of bone marrow aspirate and biopsy every 1 to 3 years, balanced against the
    burden of screening in young children.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: Supportive Care

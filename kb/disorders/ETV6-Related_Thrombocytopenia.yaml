diagnosis:
- name: Germline ETV6 molecular genetic testing
  diagnosis_term:
    preferred_term: germline ETV6 genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  description: >-
    Diagnosis rests on finding a heterozygous germline pathogenic ETV6 variant, usually on an
    inherited platelet disorder or leukaemia predisposition gene panel. ETV6 should be tested
    together with RUNX1 and ANKRD26 in any autosomal dominant thrombocytopenia with normal platelet
    size, because routine laboratory findings do not distinguish the disorder. Rare ETV6 variants,
    especially outside the ETS and central domains, need functional or segregation evidence,
    since some behave like wild type in localisation and reporter assays.
  results: >-
    A heterozygous germline pathogenic ETV6 variant establishes the diagnosis.
  evidence:
  - reference: PMID:33226740
    reference_title: "ETV6-Related Thrombocytopenia and Predisposition to Leukemia."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of ETV6-related thrombocytopenia and predisposition to leukemia is established
      in a proband by identification of a heterozygous germline pathogenic variant in ETV6 by
      molecular genetic testing.
    explanation: GeneReviews diagnostic criterion.
  - reference: PMID:27365488
    reference_title: "Clinical and pathogenic features of ETV6-related thrombocytopenia with predisposition to acute lymphoblastic leukemia."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Clinical and laboratory findings did not identify any particular defects that could lead to
      the suspicion of this disorder from the routine diagnostic workup.
    explanation: Routine workup does not identify the disorder, so molecular testing is needed.
  - reference: PMID:42479114
    reference_title: "Comprehensive genomic analysis of five kindreds with multiple childhood leukemias: importance of individual functional analysis for rare ETV6 germline variants."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Collectively, these findings indicate that p.Arg202Gly behaves as WT-like in the assays
      performed and do not support a loss-of-function effect.
    explanation: A rare ETV6 variant found in a leukaemia kindred behaved like wild type, a caution against over-calling.
treatments:
- name: Antifibrinolytic and Desmopressin Therapy for Bleeding
  description: >-
    Clinical bleeding is managed with local measures, adding antifibrinolytic agents or
    desmopressin, which may also be given before surgery in people with a history of moderate or
    severe bleeding. People with a history of bleeding should avoid aspirin, nonsteroidal
    anti-inflammatory drugs and other medications that reduce platelet function, and avoid contact
    sports.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:

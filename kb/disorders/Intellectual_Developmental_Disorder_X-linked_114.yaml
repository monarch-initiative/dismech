- name: SRPK3 Protein Misfolding
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    Structural modelling on the AlphaFold SRPK3 model places His159 and Thr458
    in the protein interior, where Asp159 loses about half of the side-chain
    atomic contacts and Asn458 clashes with neighbouring aromatic residues,
    predicting misfolding. Glu529 is surface-exposed and its substitution is
    instead predicted to alter a protein-interaction surface. Ser318 lies in an
    unstructured loop that could not be modelled.
  evidence:
  - reference: PMID:39073169
    reference_title: SRPK3 Is Essential for Cognitive and Ocular Development in Humans and Zebrafish, Explaining X-Linked Intellectual Disability.
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      We found that the H159D and T458N substitutions can cause protein
      misfolding, because His159 and Thr458 are located in the interior of
      SRPK3 and their side chains play a structural role for the maintenance
      of the protein folding
    explanation: Modelling prediction for the two buried substitutions.
  downstream:
  - target: Cytoplasmic Mislocalization of SRPK3
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:39073169
      reference_title: SRPK3 Is Essential for Cognitive and Ocular Development in Humans and Zebrafish, Explaining X-Linked Intellectual Disability.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        These results imply that important roles of H159 and T458 in proper
        protein folding of SRPK3, as suggested by molecular modeling, contribute
        to the subcellular localization of SRPK3.
      explanation: The authors connect the predicted misfolding to the observed mislocalization.
- name: Cytoplasmic Mislocalization of SRPK3
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    GFP-tagged wild-type SRPK3 and the p.Ser318Leu and p.Glu529Lys variants
    were mainly nuclear in transfected HeLa cells, whereas p.His159Asp and
    p.Thr458Asn were cytosolic. Shown by overexpression in a non-neural cell
    line only.
  biological_processes:
  - preferred_term: protein localization to nucleus
    term:
      id: GO:0034504
      label: protein localization to nucleus
    modifier: DECREASED
  evidence:
  - reference: PMID:39073169
    reference_title: SRPK3 Is Essential for Cognitive and Ocular Development in Humans and Zebrafish, Explaining X-Linked Intellectual Disability.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Fluorescence cytochemistry revealed that SRPK3 wild type, S318L and E529K

    label: intellectual developmental disorder, X-linked 114
parents:
- X-linked syndromic intellectual disability
- SRPK3-related disorder
notes: >-
  Lump/split. This is curated as its own Disease entry rather than as a
  gene-defined subtype of Non-Syndromic_X-Linked_Intellectual_Disability. The
  defining report (PMID:39073169) states that the eight postnatally ascertained
  patients "shared common clinical features including intellectual disability,
  agenesis of the corpus callosum, abnormal eye movement, and ataxia" and
  concludes for a role in syndromic X-linked intellectual disability, which is
  what the non-syndromic class excludes. MONDO nevertheless files MONDO:0975828
  as a direct subclass of MONDO:0019181 non-syndromic X-linked intellectual
  disability (its only parent in the OLS MONDO release read on 2026-09-25);
  that placement follows the historical numbered-locus pattern and is recorded
  as a MONDO disagreement in the notes of the non-syndromic parent entry.
  The `parents` strings here therefore follow the published phenotype, not
  the MONDO hierarchy.

  How widely "shared" the features are. The abstract lists agenesis of the
  corpus callosum among features common to all eight postnatal patients, but
  the case descriptions in the same paper record callosal agenesis or
  dysgenesis only in the four imaged males of family 1, posterior callosal
  volume loss in family 3, cerebellar atrophy without supratentorial change in
  family 2, and a normal brain MRI in family 4. Frequencies are therefore not
  assigned to the brain-imaging phenotypes; only intellectual disability, which
  the paper states for all postnatal patients, carries one.

  Evidence strength. SRPK3 has no ClinGen gene-disease validity record (the
  same statement is made for this gene in the non-syndromic parent entry,
  read from the ClinGen gene-validity download on 2026-09-24). The p.E529K
  allele is present in 32 males in gnomAD v4.0.0, which the authors themselves
  flag as possible incomplete penetrance, and the fetal proband carried
  additional variants of uncertain significance in BAALC and LOC400499. A
  separate study of X-linked myopathy found 40 males with hemizygous
  deleterious SRPK3 variants, most of them truncating, and six gnomAD males
  with truncating SRPK3 alleles (PMID:38429495); that study does not report on
  cognition, so whether a hemizygous null SRPK3 allele is by itself sufficient
  for intellectual disability is open (see discussions).

  Allelic and overlapping SRPK3 conditions. Hemizygous SRPK3 variants also
  cause a progressive early-onset skeletal myopathy, but only together with a
  heterozygous TTN variant (SRPK3/TTN digenic myopathy, PMID:38429495), and
  SRPK3 lies inside the Xq28 contiguous deletions that extend from BCAP31
  towards SSR4 (PMID:40662097). Both are listed as differential diagnoses.
  Srpk3-null mice have a centronuclear-like myopathy (PMID:16140986); in mice
  Srpk3 is expressed in heart and skeletal muscle, and no neural phenotype is
  reported, so the mouse is recorded only as a perturbation of the gene. None
  of the XLID114 patients was described with a myopathy, and the knockout
  zebrafish showed no signs of one.

  No GeneReviews chapter covers this disorder (`just check-genereviews
  --online`, NO_CHAPTER), and MONDO carries no Orphanet cross-reference for
  it. No disease-specific treatment has been reported.
inheritance:
- name: X-linked recessive
  inheritance_term:
    preferred_term: X-linked recessive inheritance
    term:
      id: HP:0001419
      label: X-linked recessive inheritance
  description: >-
    Affected individuals are hemizygous males. In all five families the
    variant was maternally inherited, and the three missense variants found
    first (families 1-3) segregated with the phenotype within their families;
    the heterozygous carrier mother in family 3 had no symptoms, and her
    hemizygous brother was affected. No affected female has been described. The authors raise incomplete penetrance for p.E529K
    because of its presence in gnomAD males.
  evidence:
  - reference: PMID:39073169
    reference_title: SRPK3 Is Essential for Cognitive and Ocular Development in Humans and Zebrafish, Explaining X-Linked Intellectual Disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      all three missense variants were found to segregate within the
      respective families
    explanation: Segregation of the first three missense variants with the phenotype.
  - reference: PMID:39073169
    reference_title: SRPK3 Is Essential for Cognitive and Ocular Development in Humans and Zebrafish, Explaining X-Linked Intellectual Disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The first variant c.475C>G; p.H159D in Family 1 was maternally inherited
      from a Manitoba female of Anglo-Saxon origin
    explanation: Maternal transmission in the largest family, which had five affected males.
  - reference: PMID:39073169
    reference_title: SRPK3 Is Essential for Cognitive and Ocular Development in Humans and Zebrafish, Explaining X-Linked Intellectual Disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Similar phenotypical characteristics were observed in his maternal uncle,
      who carried the hemizygous SRPK3 variant. The proband's mother,
      heterozygous for the SRPK3 variant, showed no symptoms
    explanation: >-
      Hemizygous affected males and an unaffected heterozygous carrier mother
      in family 3, the X-linked recessive pattern.
  - reference: PMID:39073169
    reference_title: SRPK3 Is Essential for Cognitive and Ocular Development in Humans and Zebrafish, Explaining X-Linked Intellectual Disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It is possible that this variant has incomplete penetrance and/or that it
      exerts its effect only on a specific genetic background.
    explanation: >-
      The authors' own caveat for p.E529K, reported in 32 gnomAD males;
      recorded because it qualifies the recessive, fully penetrant reading.

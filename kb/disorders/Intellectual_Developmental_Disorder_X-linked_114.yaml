      explanation: The knockout phenotype is a myopathy.
discussions:
- discussion_id: xlid114_splicing_mechanism_gap
  prompt: >-
    Do XLID114 variants reduce SRPK3 phosphorylation of SR proteins, and which
    neural splicing events, in which developing cell types, link that loss to
    callosal, white matter and cerebellar maldevelopment?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced SRPK3-Mediated SR Protein Phosphorylation
  - pathophysiology#Dysregulated SR Protein-Dependent Pre-mRNA Splicing
  - mechanistic_hypotheses#srpk3_sr_splicing
  rationale: >-
    The pathograph stops at a presumed splicing defect because nothing has
    been measured beyond variant localization in HeLa cells. The authors
    themselves say phosphorylation assays are needed. SR-protein
    phosphorylation, RNA-seq splicing analysis in patient-derived neural
    cells or knockout fish brain, and identification of mis-spliced targets
    would each test a step that is currently inferred.
  evidence:
  - reference: PMID:39073169
    reference_title: SRPK3 Is Essential for Cognitive and Ocular Development in Humans and Zebrafish, Explaining X-Linked Intellectual Disability.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Although, further studies with phosphorylation assays are required to
      confirm this prediction
    explanation: The authors' statement that kinase function was not tested.
- discussion_id: xlid114_penetrance_null_allele_question
  prompt: >-
    Is a hemizygous SRPK3 loss-of-function allele by itself sufficient to
    cause intellectual disability, given that p.Glu529Lys is carried by 32
    gnomAD males and that truncating SRPK3 alleles occur in gnomAD males and in
    myopathy-cohort brothers without a reported neurodevelopmental phenotype?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - genetic#SRPK3
  - pathophysiology#SRPK3 Hemizygous Variant
  - mechanistic_hypotheses#srpk3_second_hit_model
  rationale: >-
    The XLID114 evidence is one truncating allele, in a fetus with other
    variants, and four missense alleles of which two seem hypomorphic. The
    SRPK3/TTN myopathy study reports 40 hemizygous males with deleterious
    SRPK3 variants, most truncating, and six gnomAD males with truncating
    alleles, without describing cognition in either group. Whether those males
    are cognitively normal would decide between a simple loss-of-function
    model, an allele-specific (for example misfolding or interaction-surface)
    mechanism, and a second-hit model. Checking cognition and brain imaging in
    the myopathy cohort is the most direct test.
  evidence:
  - reference: PMID:38429495
    reference_title: Digenic inheritance involving a muscle-specific protein kinase and the giant titin protein causes a skeletal muscle myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As of September 2023, there are six hemizygous males (of 76,702)
      carrying five truncating variants in SRPK3 canonical transcript
    explanation: Truncating SRPK3 alleles in population control males.
  - reference: PMID:38429495
    reference_title: Digenic inheritance involving a muscle-specific protein kinase and the giant titin protein causes a skeletal muscle myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Their unaffected brothers carried either the SRPK3 or the TTN variant,
      but never both.
    explanation: >-
      Brothers hemizygous for deleterious SRPK3 variants were unaffected by
      myopathy; their cognition is not reported.
  - reference: PMID:39073169
    reference_title: SRPK3 Is Essential for Cognitive and Ocular Development in Humans and Zebrafish, Explaining X-Linked Intellectual Disability.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We also note that, although rare, the p.E529K variant is reported in 32
      males in the gnomAD database (v.4.0.0).
    explanation: Population hemizygotes for one of the XLID114 alleles.
- discussion_id: xlid114_model_species_mismatch
  prompt: >-
    Why does loss of Srpk3 give a myopathy without a reported brain phenotype
    in mice, a cerebellar and oculomotor phenotype without myopathy in
    zebrafish, and a neurodevelopmental disorder without myopathy in humans?

      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Although, further studies with phosphorylation assays are required to
        confirm this prediction
      explanation: >-
        The authors state that the predicted effect of the variants on kinase
        function has not been confirmed by phosphorylation assays; cited to
        mark this edge as untested.
- name: Reduced SRPK3-Mediated SR Protein Phosphorylation
  biological_scale: MOLECULAR
  mechanism_confidence: HYPOTHETICAL
  description: >-
    Presumed reduction of SRPK3 phosphorylation of serine/arginine-rich (SR)
    splicing factors. SRPKs phosphorylate the RS domains of SR proteins, which
    is needed for their nuclear import and splicing activity, and SRPK3
    phosphorylates the RS region of the splicing regulator RBM20 in vitro. No
    study has measured SR-protein phosphorylation in patient cells, in
    variant-expressing cells, or in the knockout zebrafish.
  molecular_functions:
  - preferred_term: protein serine kinase activity
    term:
      id: GO:0106310
      label: protein serine kinase activity
    modifier: DECREASED
  evidence:

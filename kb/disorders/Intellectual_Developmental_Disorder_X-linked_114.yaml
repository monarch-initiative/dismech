  rationale: >-
    Mouse Srpk3 is reported as muscle-restricted, while human SRPK3 is
    expressed in embryonic brain, retina and cerebellum, and zebrafish srpk3 in
    brain, heart and muscle. The mouse brain is not described in the published
    abstract, the fish lacks a corpus callosum so the most distinctive human
    imaging finding cannot be modelled, and wild-type human SRPK3 mRNA failed
    to rescue the fish phenotype, which leaves open how specific the fish
    phenotypes are. A neural examination of Srpk3-null mice and a stable
    rescue in fish would address the mismatch.

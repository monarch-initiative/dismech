pathophysiology:
- name: SRPK3 Hemizygous Variant
  biological_scale: MOLECULAR
  mechanism_confidence: PROVISIONAL
  description: >-
    A hemizygous germline variant in SRPK3 (NM_014370.4) in an affected male,
    inherited from a heterozygous mother. Four missense variants are known -
    p.His159Asp in the first kinase domain, p.Ser318Leu in the unstructured
    spacer loop, and p.Thr458Asn and p.Glu529Lys in the second kinase domain -
    plus one frameshift predicted to truncate the protein (p.Tyr471Ter).
    The missense variants are not all alike: modelling and cell localization
    suggest p.His159Asp and p.Thr458Asn destabilize the protein, while
    p.Ser318Leu and p.Glu529Lys may be hypomorphic. Whether the disease is a
    loss of SRPK3 kinase function has not been tested directly, so no
    functional-impact category is asserted.

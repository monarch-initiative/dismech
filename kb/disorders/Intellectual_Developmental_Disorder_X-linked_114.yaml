      variants exhibited cytosolic localization
    explanation: Direct observation of variant-specific mislocalization in HeLa cells.
  downstream:
  - target: Reduced SRPK3-Mediated SR Protein Phosphorylation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - srpk3_sr_splicing
    evidence:
    - reference: PMID:39073169

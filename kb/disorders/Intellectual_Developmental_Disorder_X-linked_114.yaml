name: Intellectual Developmental Disorder, X-Linked 114
creation_date: "2026-09-25T13:56:18Z"
category: Mendelian
synonyms:
- XLID114
- IDX114
- SRPK3-related X-linked intellectual disability
description: >-
  Intellectual developmental disorder, X-linked 114 (XLID114; OMIM 301134) is a
  syndromic X-linked neurodevelopmental disorder of hemizygous males caused by
  germline variants in SRPK3 at Xq28, which encodes serine/arginine-rich
  protein-specific kinase 3, a kinase that phosphorylates SR-domain splicing
  factors. The only defining report describes nine affected individuals from
  five unrelated families: eight males ascertained after birth and one male
  fetus. The postnatal patients share intellectual disability, usually mild to
  moderate, with learning difficulty, delayed speech and short attention span,
  together with structural brain anomalies (agenesis or dysgenesis of the
  corpus callosum with dilated lateral ventricles and colpocephaly in the
  largest family, cerebral white matter loss, and cerebellar atrophy),
  abnormal eye movements (impaired smooth pursuit, convergence insufficiency,
  strabismus) and ataxia. Presentation is variable: one proband had learning
  difficulty and then a rapidly progressive cerebellar ataxic syndrome from
  his early twenties, another had severe global delay with absent speech,
  axial hypotonia and dystonic-dyskinetic movements with a normal brain MRI,
  and the fetus with a truncating allele had hydrocephalus, polymicrogyria and
  cerebellar dysplasia. The one carrier mother whose clinical status is
  reported was unaffected.

  The evidence base is small: five families, four missense variants and one
  truncating variant, with no ClinGen gene-disease validity curation. Support
  for causality rests on segregation, variant rarity, in silico and HeLa-cell
  evidence that two of the missense substitutions misfold SRPK3 and displace it
  from the nucleus, and an srpk3 knockout zebrafish with reduced spontaneous eye
  movements, a smaller valvula cerebelli and impaired social behaviour. How
  loss of SRPK3 disturbs brain development is not known; reduced SR-protein
  phosphorylation and altered pre-mRNA splicing are the presumed route but
  have not been measured in patient cells or in the fish.
disease_term:
  preferred_term: intellectual developmental disorder, X-linked 114
  term:

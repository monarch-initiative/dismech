- name: Oculomotor Control Deficit
  biological_scale: ORGANISM
  mechanism_confidence: PROVISIONAL
  description: >-
    Impaired control of eye movements. Patients have impaired smooth pursuit,
    convergence insufficiency and strabismus; srpk3 knockout zebrafish larvae
    have fewer spontaneous eye movements with reduced angle and reset time
    but a normal colour response. The authors propose a defect in the
    oculomotor neural integrator circuit, and state that a neuronal versus
    extraocular muscle origin has not been distinguished; extraocular muscle
    marker expression was unchanged in the fish.
  evidence:
  - reference: PMID:39073169
    reference_title: SRPK3 Is Essential for Cognitive and Ocular Development in Humans and Zebrafish, Explaining X-Linked Intellectual Disability.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      These oculomotor behaviors observed in KO zebrafish may arise in part
      from a deficit in the circuit connectivity within the integrator
    explanation: Proposed neural-circuit basis of the eye-movement defect.
  - reference: PMID:39073169
    reference_title: SRPK3 Is Essential for Cognitive and Ocular Development in Humans and Zebrafish, Explaining X-Linked Intellectual Disability.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      one must consider both neuronal and muscle function-related mechanisms in
      future studies of SRPK function
    explanation: The authors leave a neuronal versus muscular origin open.
  downstream:
  - target: Impaired Smooth Pursuit
  - target: Impaired Convergence
  - target: Exotropia
mechanistic_hypotheses:
- hypothesis_group_id: srpk3_sr_splicing
  hypothesis_label: Loss of SRPK3 phosphorylation of SR splicing factors dysregulates neural pre-mRNA splicing
  status: EMERGING
  description: >-
    The presumed mechanism, following from the known function of the SRPK
    family: reduced SRPK3 activity (from a truncating, misfolded or hypomorphic
    allele) leaves SR proteins under-phosphorylated, impairing their nuclear
    entry and splicing function, and the resulting splicing changes disturb
    brain development. Every step after the variant is inferred from SRPK
    biology rather than shown in XLID114: no phosphorylation assay, splicing
    analysis or target transcript has been reported. The same paper notes that
    SRPK2 acts in synaptic vesicle release, so a splicing-independent neuronal
    role is also possible.
  evidence:
  - reference: PMID:39073169
    reference_title: SRPK3 Is Essential for Cognitive and Ocular Development in Humans and Zebrafish, Explaining X-Linked Intellectual Disability.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      Phosphorylation is required for SR proteins to enter the nucleus and
      play a role in alternative splicing of pre-mRNA, mRNA export, and other
      processing events.
    explanation: The biochemical premise of the hypothesis.
  - reference: PMID:14555757
    reference_title: Processive phosphorylation of alternative splicing factor/splicing factor 2.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      SR protein function is regulated through phosphorylation of their RS
      domains by multiple kinases, including a family of evolutionarily
      conserved SR protein-specific kinases (SRPKs).
    explanation: Background on SRPK-family regulation of SR proteins, the basis of the hypothesis.
  - reference: PMID:9472028
    reference_title: "SRPK2: a differentially expressed SR protein-specific kinase involved in mediating the interaction and localization of pre-mRNA splicing factors in mammalian cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      These observations likely reflect the function of the SRPK family of
      kinases in spliceosome assembly and in mediating the trafficking of
      splicing factors in mammalian cells.
    explanation: >-
      The SRPK2 cloning study's interpretation of its SRPK1/SRPK2 data as a
      family-wide role in spliceosome assembly and splicing-factor
      trafficking; extended to SRPK3 by analogy only.
  - reference: PMID:39073169
    reference_title: SRPK3 Is Essential for Cognitive and Ocular Development in Humans and Zebrafish, Explaining X-Linked Intellectual Disability.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Although, further studies with phosphorylation assays are required to
      confirm this prediction
    explanation: States that the kinase-function prediction is untested.
- hypothesis_group_id: srpk3_second_hit_model
  hypothesis_label: SRPK3 deficiency causes disease together with a deficient downstream target
  status: EMERGING
  description: >-
    Proposed by the authors of the SRPK3/TTN digenic myopathy study, who found
    that hemizygous deleterious SRPK3 variants caused myopathy only with a
    heterozygous TTN variant, and suggested that the same kinase deficiency
    combined with a second deficient target gene could underlie other SRPK3
    phenotypes, citing the intellectual-disability reports. If it applied to
    XLID114, it would explain the gnomAD males carrying p.E529K or truncating
    SRPK3 alleles. No second locus has been sought or found in XLID114
    families, and the fetal proband's extra VUS in BAALC and LOC400499 are not
    evidence for one.
  evidence:
  - reference: PMID:38429495
    reference_title: Digenic inheritance involving a muscle-specific protein kinase and the giant titin protein causes a skeletal muscle myopathy.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: BACKGROUND
    snippet: >-
      it is conceivable that defective or absent phosphorylation activity of
      this kinase, in combination with a second deficient downstream target
      gene, could result in these, as well as other, disease phenotypes
    explanation: The digenic-study authors' own extension of their model to other SRPK3 phenotypes.
  - reference: PMID:38429495
    reference_title: Digenic inheritance involving a muscle-specific protein kinase and the giant titin protein causes a skeletal muscle myopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified 40 males (from 25 families) carrying hemizygous deleterious
      variants in the X-linked SRPK3 gene. Of those, only the 31 patients who
      also carried cosegregating heterozygous TTN variants presented with a
      myopathy.
    explanation: >-
      The observation the model rests on: hemizygous SRPK3 variants were not
      sufficient for the muscle phenotype.

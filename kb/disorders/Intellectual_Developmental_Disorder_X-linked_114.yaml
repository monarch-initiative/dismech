animal_models:
- name: srpk3 knockout zebrafish
  species: Zebrafish
  genotype: >-
    Homozygous CRISPR-Cas9 srpk3 indel allele predicted to truncate the
    protein (zebrafish srpk3, chromosome 8, orthologue of human SRPK3)
  publication: PMID:39073169
  genes:
  - preferred_term: SRPK3
    term:
      id: hgnc:11402
      label: SRPK3
  description: >-
    srpk3 transcripts are reduced in knockout larvae, consistent with
    nonsense-mediated decay. Knockouts develop normally as embryos, with no
    change in apoptosis, body length, pigmentation or eye size, but most fail
    to inflate the swim bladder and only 6 of 73 reached adulthood. At 5 days
    they have fewer spontaneous eye movements with reduced ocular angle and
    reset time. Adult survivors show reduced social approach and shoal
    cohesion with normal locomotion, and a halved valvula cerebelli with
    normal overall brain size. Early neural markers (her4, islet1, th) and
    muscle markers were unchanged, and no myopathy was seen. Injected
    wild-type human SRPK3 mRNA did not rescue swim bladder inflation.
  modeled_mechanisms:
  - target: Cerebellar Structural Deficit
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      Loss of srpk3 reduces the valvula cerebelli, which the authors compare
      to cerebellar atrophy in patients.
    limitations: >-
      The fish valvula cerebelli has no direct human homologue, and the
      reduction was measured on three sections of adult survivors, a small and
      possibly selected group (8% survival). The human cerebellar change was
      progressive atrophy in one adult and dysplasia in one fetus, so the
      developmental versus degenerative character is not matched.
    readouts:
    - name: Relative valvula cerebelli area
      target: Cerebellar Structural Deficit
      direction: DECREASED
      interpretation: Reduced cerebellar region in the knockout.
      evidence:
      - reference: PMID:39073169
        reference_title: SRPK3 Is Essential for Cognitive and Ocular Development in Humans and Zebrafish, Explaining X-Linked Intellectual Disability.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          We observed that the relative size of valvular cerebelli in the whole
          brain of srpk3 KO zebrafish was reduced to 50%, 59%, and 41% compared to
          that of WT zebrafish in three different sections
        explanation: The histological measurement behind the readout.
    evidence:
    - reference: PMID:39073169
      reference_title: SRPK3 Is Essential for Cognitive and Ocular Development in Humans and Zebrafish, Explaining X-Linked Intellectual Disability.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In adult KO zebrafish, cerebellar agenesis and behavioral abnormalities
        were observed, recapitulating human phenotypes of cerebellar atrophy and
        intellectual disability.
      explanation: The authors treat the model as informative for the cerebellar node.
  - target: Oculomotor Control Deficit
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: ORGANISM
    description: >-
      Reduced frequency, angle and reset time of spontaneous eye movements in
      5-day larvae, compared by the authors to the patients' uncontrolled eye
      movements.
    limitations: >-
      Larval spontaneous saccade-fixation behaviour is not the same measure as
      smooth pursuit or convergence in patients, and whether the fish defect is
      neural or muscular was not determined.
    readouts:
    - name: Spontaneous eye movement frequency
      target: Oculomotor Control Deficit
      direction: DECREASED
      interpretation: Impaired oculomotor behaviour in knockout larvae.
      evidence:
      - reference: PMID:39073169
        reference_title: SRPK3 Is Essential for Cognitive and Ocular Development in Humans and Zebrafish, Explaining X-Linked Intellectual Disability.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          However, srpk3 KO siblings exhibited a significant reduction in eye
          movement frequency (Fig. 5 A, B); indicating a role of srpk3 in
          maintaining the movement pattern.
        explanation: The measurement behind the readout.
    evidence:
    - reference: PMID:39073169
      reference_title: SRPK3 Is Essential for Cognitive and Ocular Development in Humans and Zebrafish, Explaining X-Linked Intellectual Disability.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In post-fertilization day 5 larvae (free swimming stage), KO zebrafish
        exhibited severe deficits in eye movement and swim bladder inflation,
        mimicking uncontrolled ocular movement and physical clumsiness observed
        in human patients.
      explanation: The authors treat the larval eye-movement defect as a model of the patients' oculomotor phenotype.
  - target: Abnormal Social Behavior
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Adult knockouts spent less time near conspecifics and formed looser
      shoals, used by the authors as a proxy for impaired social interaction.
    limitations: >-
      Shoaling and social-preference assays are indirect proxies for human
      social cognition, and the patients' social difficulties are described
      only in a supplementary table.
    readouts:
    - name: Shoal cohesion
      target: Abnormal Social Behavior
      direction: DECREASED
      interpretation: Reduced social cohesion in knockout adults.
      evidence:
      - reference: PMID:39073169
        reference_title: SRPK3 Is Essential for Cognitive and Ocular Development in Humans and Zebrafish, Explaining X-Linked Intellectual Disability.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          In contrast, srpk3 KO zebrafish did not appear to interact with one
          another and exhibited decreased shoal cohesion, i.e., increased
          inter-individual distance
        explanation: The behavioural measurement behind the readout.
    evidence:
    - reference: PMID:39073169
      reference_title: SRPK3 Is Essential for Cognitive and Ocular Development in Humans and Zebrafish, Explaining X-Linked Intellectual Disability.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        These findings again demonstrate impaired shoaling response in srpk3 KO
        zebrafish compared to their WT siblings.
      explanation: Summary of the social-behaviour phenotype of the knockout.
- name: Srpk3-null mouse
  species: Mouse
  genotype: Srpk3 null (X-linked; hemizygous males)
  publication: PMID:16140986
  genes:
  - preferred_term: SRPK3
    term:
      id: hgnc:11402
      label: SRPK3
  description: >-
    In mice Srpk3 is a MEF2-regulated, heart- and skeletal-muscle-specific
    kinase, and Srpk3-null mice have a type 2 fibre myopathy with many
    centrally placed nuclei. No neural or behavioural phenotype is reported in
    the abstract. It is recorded here as a loss-of-function model of the gene,
    not as a model of the neurodevelopmental disease; its muscle phenotype
    relates to the allelic SRPK3/TTN digenic myopathy, and a large knockout
    screen cited by the zebrafish paper did not detect myopathy.
  modeled_mechanisms:
  - target: SRPK3 Hemizygous Variant
    relationship: PERTURBS
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Complete loss of Srpk3 in mice; informative about SRPK3 function in
      muscle but not about the brain phenotype of XLID114.
    limitations: >-
      In mice Srpk3 expression is reported as specific to heart and skeletal
      muscle, whereas human SRPK3 is expressed in the embryonic brain, retina
      and cerebellum; the published phenotype is muscular and brain structure
      and behaviour were not reported, so the model neither supports nor
      refutes the neurodevelopmental mechanism.
    evidence:
    - reference: PMID:16140986
      reference_title: Centronuclear myopathy in mice lacking a novel muscle-specific protein kinase transcriptionally regulated by MEF2.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        The Srpk3 gene is specifically expressed in the heart and skeletal
        muscle from embryogenesis to adulthood and is controlled by a
        muscle-specific enhancer directly regulated by MEF2.
      explanation: Muscle-restricted Srpk3 expression in mouse, the basis of the species caveat.
    - reference: PMID:16140986
      reference_title: Centronuclear myopathy in mice lacking a novel muscle-specific protein kinase transcriptionally regulated by MEF2.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Srpk3-null mice display a new entity of type 2 fiber-specific myopathy

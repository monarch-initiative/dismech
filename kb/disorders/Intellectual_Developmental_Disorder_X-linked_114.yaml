  prompt: >-
    Does SRPK3 loss in the choroid plexus epithelium contribute to the
    ventricular dilatation and hydrocephalus seen in XLID114?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - phenotypes#Ventriculomegaly
  - phenotypes#Hydrocephalus
  rationale: >-
    SRPK3 is strongly expressed in the embryonic hindbrain choroid plexus
    epithelium, which produces cerebrospinal fluid, and ventricular dilatation
    was the most consistent imaging finding in family 1. The authors raise
    choroid plexus involvement only as a question for future work, so no
    pathophysiology node is curated for it.

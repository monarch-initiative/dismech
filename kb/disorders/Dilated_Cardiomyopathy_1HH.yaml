  biological_scale: TISSUE
  role: central_effector
  conforms_to: "cardiomyopathy_maladaptive_remodeling#Ventricular Remodeling"
  description: >-
    Cumulative Z-disc and sarcomere degradation produces the defining structural
    remodeling of dilated cardiomyopathy: left ventricular chamber enlargement with
    wall thinning, myocyte loss, and interstitial fibrosis, with falling ejection
    fraction. Knockdown of bag3 in zebrafish reproduces this dilated phenotype and
    heart failure, confirming that loss of the co-chaperone is sufficient to
    generate the remodeling.

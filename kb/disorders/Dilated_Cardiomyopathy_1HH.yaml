notes: >-
  CMD1HH is the BAG3 member of the numbered dilated cardiomyopathy series and
  carries ClinGen Definitive gene-disease validity. It conforms to the shared
  cardiomyopathy_maladaptive_remodeling module.

  Mechanistic distinctiveness is the point of this entry. BAG3 is not a component
  of the contractile apparatus: it is the organizing co-chaperone of
  chaperone-assisted selective autophagy (CASA) at the Z-disc. The disease is
  therefore a failure of protein quality control and structural turnover in a
  continuously load-bearing myocyte, not a defect of force generation - the
  counterpart, within dilated cardiomyopathy, of what KLHL24/CMH29 is within the
  hypertrophic series. This is why it is curated with a proteostasis chain
  (impaired CASA -> Z-disc disintegration) upstream of the shared remodeling nodes
  rather than with a sarcomeric contractile lesion.

  Evidence scope caveat: the CASA mechanism nodes rest on Drosophila/mouse and
  cell-based work (PMID:20060297, PMID:31326538) plus the zebrafish bag3 knockdown,
  with the human evidence being genetic (segregation and case-control variant
  burden) rather than direct demonstration of impaired CASA in patient myocardium.

  GeneReviews scope. The GeneReviews resource applicable to this entry is the
  disease-level "Dilated Cardiomyopathy Overview" (PMID:20301486), tagged
  accordingly in `references`. Its indexed PubMed record is content_type
  abstract_only and carries only the chapter's purpose statement, not the
  Clinical Characteristics, Management, or Genetic Counseling sections, so
  section-by-section GeneReviews mining is not possible from the cache and no
  snippet is quoted from it. The clinical-characteristics baseline for this
  entry is therefore built from the primary BAG3 cohort and pedigree literature
  cited throughout, principally PMID:21353195.

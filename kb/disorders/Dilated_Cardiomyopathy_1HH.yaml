name: Dilated Cardiomyopathy 1HH
creation_date: "2026-08-22T00:00:00Z"
synonyms:
- CMD1HH
- BAG3 familial isolated dilated cardiomyopathy
- dilated cardiomyopathy type 1HH
- cardiomyopathy, dilated, 1HH
- BAG3-related dilated cardiomyopathy
description: >-
  Dilated cardiomyopathy 1HH (CMD1HH) is the BAG3-related form of familial
  isolated dilated cardiomyopathy. BAG3 encodes Bcl2-associated athanogene 3, a
  co-chaperone that is not a component of the contractile apparatus at all: it is
  the organizing hub of protein quality control at the sarcomeric Z-disc. Working
  with Hsc70 and the small heat shock protein HSPB8, BAG3 initiates
  chaperone-assisted selective autophagy (CASA), the pathway that recognizes and
  disposes of mechanically damaged Z-disc proteins - notably force-unfolded
  filamin - and replaces them. CMD1HH is therefore mechanistically distinct from
  the sarcomeric dilated cardiomyopathies: the primary lesion is a failure of
  proteostasis and structural turnover in a myocyte under continuous mechanical
  load, not a defect of force generation. BAG3 was established as a dilated
  cardiomyopathy gene by Norton and colleagues in 2011 through combined
  genome-wide copy-number and exome analysis in a multigenerational family, with
  loss-of-function alleles (a whole-exon deletion, frameshift, nonsense, and
  missense variants) segregating with disease and bag3 knockdown recapitulating
  dilated cardiomyopathy and heart failure in zebrafish. ClinGen classifies the
  BAG3-DCM relationship as Definitive with autosomal dominant inheritance; the
  operative mechanism for truncating alleles is haploinsufficiency.

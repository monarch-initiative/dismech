    description: >-
      Without CASA-mediated turnover, damaged Z-disc components accumulate and the
      Z-disc loses structural integrity.
- name: Z-Disc Disintegration and Sarcomere Structural Failure
  biological_scale: CELLULAR
  role: effector
  description: >-
    The Z-disc is the anchor for actin thin filaments and the mechanical node of
    the sarcomere. When CASA cannot clear force-damaged components, they accumulate
    and the Z-disc disintegrates, producing progressive structural failure of the
    contractile apparatus. This has been shown across species - impaired CASA
    causes Z-disc disintegration and progressive muscle weakness in flies, mice,
    and humans - and in the heart it converts a maintenance defect into a
    contractile one.

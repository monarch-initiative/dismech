  evidence:
  - reference: PMID:20060297
    reference_title: "Chaperone-assisted selective autophagy is essential for muscle maintenance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Stv and its mammalian ortholog BAG-3 coordinate the activity of Hsc70 and the
      small heat shock protein HspB8 during disposal that is initiated by the
      chaperone-associated ubiquitin ligase CHIP and the autophagic ubiquitin
      adaptor p62.
    explanation: >-
      Defines the BAG3-organized CASA machinery - Hsc70, HspB8, CHIP, p62 - that
      this node represents.
  - reference: PMID:20060297
    reference_title: "Chaperone-assisted selective autophagy is essential for muscle maintenance."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      Instead of keeping Z disk proteins in a folded conformation, this machinery
      facilitates the degradation of damaged components, such as filamin, through
      chaperone-assisted selective autophagy (CASA).
    explanation: >-
      States that the BAG3 machinery works by degrading damaged Z-disc components
      rather than refolding them - the distinguishing feature of this mechanism.
  - reference: PMID:31326538
    reference_title: "The Hippo network kinase STK38 contributes to protein homeostasis by inhibiting BAG3-mediated autophagy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Under mechanical stress, the cochaperone cooperates with the small heat shock
      protein HSPB8 and the cytoskeleton-associated protein SYNPO2 to degrade
      force-unfolded forms of the actin-crosslinking protein filamin.
    explanation: >-
      Specifies the mechanical-stress trigger and the filamin substrate of
      BAG3-initiated CASA.

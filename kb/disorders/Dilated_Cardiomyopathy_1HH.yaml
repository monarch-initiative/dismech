- name: Impaired Chaperone-Assisted Selective Autophagy at the Z-Disc
  biological_scale: MOLECULAR
  role: effector
  description: >-
    BAG3 initiates chaperone-assisted selective autophagy (CASA), the pathway that
    disposes of misfolded and mechanically damaged proteins. In striated muscle,
    BAG3 coordinates Hsc70 and the small heat shock protein HSPB8, with the
    chaperone-associated ubiquitin ligase CHIP and the autophagic adaptor p62, to
    degrade force-unfolded Z-disc components such as filamin so that they can be
    replaced. This machinery is required continuously because the Z-disc is under
    mechanical, thermal, and oxidative stress with every contraction. A BAG3
    loss-of-function allele reduces the capacity of this disposal pathway; CASA is
    mechanistically distinct from chaperone-mediated autophagy.
  cell_types:
  - preferred_term: Cardiomyocyte
    term:
      id: CL:0000746
      label: cardiac muscle cell
  biological_processes:
  - preferred_term: Autophagy
    term:
      id: GO:0006914
      label: autophagy
    modifier: DECREASED

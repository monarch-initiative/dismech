name: Acute Myeloid Leukemia with CEBPA Somatic Mutations
creation_date: "2026-05-11T12:14:38Z"
description: >-
  Acute myeloid leukemia with CEBPA somatic mutations (MONDO:0017894) is scoped
  here to non-familial AML in which the relevant CEBPA lesion or lesions are
  acquired. WHO-HAEM5 and ICC 2022 use different diagnostic boundaries, and
  neither boundary is interchangeable with ELN genetic-risk assignment. WHO
  recognizes AML with biallelic CEBPA or a single bZIP-region mutation and
  retains a 20% blast threshold; ICC recognizes AML with an in-frame bZIP CEBPA
  mutation from 10% blasts. Separately, ELN 2022 assigns in-frame bZIP CEBPA AML
  to favorable genetic risk for intensively treated adults irrespective of
  monoallelic or biallelic occurrence. Pooled outcome data nevertheless localize
  the reproducible favorable-survival signal to bZIP in-frame indels, so formal
  classification inclusion and observed prognostic subgroup should not be
  conflated. Acquired CEBPA lesions perturb the p42/p30 isoform balance or bZIP
  DNA-binding/dimerization functions, causing abnormal transcription,
  granulocytic differentiation arrest, leukemic progenitor expansion, blast
  accumulation, and marrow failure. Germline CEBPA predisposition is a separate
  qualifying context and cannot be excluded from diagnostic marrow variant
  allele fraction alone.
categories:
- Hematologic Malignancy
- Acute Leukemia
- Molecularly Defined Cancer
parents:
- acute myeloid leukemia
has_subtypes:
- name: CEBPA bZIP In-Frame-Indel AML
  display_name: AML with CEBPA bZIP in-frame insertion/deletion
  description: >-
    Narrow outcome-defined subgroup with an acquired in-frame insertion/deletion
    in the C-terminal CEBPA basic leucine zipper region. It overlaps the ICC
    entity and ELN 2022 favorable genetic-risk group but is not coextensive with
    their broader bZIP wording, which can include bZIP missense variants. The
    indel-specific favorable association is established most securely in
    intensively treated adults and does not eliminate relapse risk.
  genes:
  - preferred_term: CEBPA
    term:
      id: hgnc:1833
      label: CEBPA
  evidence:
  - reference: PMID:38228680
    reference_title: Prognostic impact of CEBPA mutational subgroups in adult AML.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only bZIPInDel patients had significantly higher rates of complete
      remission and longer relapse free and overall survival (OS) compared with
      all other CEBPA-mutant subgroups.
    explanation: >-
      The pooled cohort localizes the favorable outcome association to the bZIP
      in-frame-indel subgroup rather than every classification-included variant.
- name: Other CEBPA-Mutated AML
  display_name: CEBPA-mutated AML outside the bZIP in-frame-indel subgroup
  description: >-
    Residual analytic category containing somatic CEBPA mutation patterns other
    than an in-frame bZIP insertion/deletion, including isolated TAD mutations,
    bZIP stop/frameshift mutations, and bZIP missense mutations. This is not a
    separately grounded ontology entity, and membership does not imply exclusion
    from every formal classification: current ICC/ELN recommendations can include
    bZIP missense variants, while WHO membership is broader still. The pooled
    outcome evidence does not extend the indel-specific favorable signal to the
    entire residual group.
  genes:
  - preferred_term: CEBPA
    term:
      id: hgnc:1833
      label: CEBPA
  evidence:
  - reference: PMID:38228680
    reference_title: Prognostic impact of CEBPA mutational subgroups in adult AML.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only bZIPInDel patients had significantly higher rates of complete
      remission and longer relapse free and overall survival (OS) compared with
      all other CEBPA-mutant subgroups.
    explanation: >-
      The pooled cohort separates bZIP in-frame insertion/deletion cases from
      other CEBPA-mutant patterns on outcome.
  - reference: PMID:38228680
    reference_title: Prognostic impact of CEBPA mutational subgroups in adult AML.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ELN2022 and ICC recommendations (including CEBPA bZIPms).
    explanation: Current formal recommendations can include bZIP missense variants even though the pooled favorable-outcome signal was indel-specific.
definitions:
- name: WHO-HAEM5 AML with CEBPA mutation definition
  definition_type: DIAGNOSTIC_CRITERIA
  scope: WHO Classification of Haematolymphoid Tumours, fifth edition
  description: >-
    WHO-HAEM5 recognizes AML with biallelic CEBPA mutation or a single mutation
    in the bZIP region and retains a minimum 20% blast threshold for this entity.
    The local MONDO scope adds the requirement that the relevant CEBPA lesion or
    lesions be somatic rather than a germline-predisposition context.
  evidence:
  - reference: PMID:35732831
    reference_title: "The 5th edition of the World Health Organization Classification of Haematolymphoid Tumours: Myeloid and Histiocytic/Dendritic Neoplasms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      include biallelic (biCEBPA) as well as single mutations located in the
      basic leucine zipper (bZIP) region of the gene (smbZIP- CEBPA).
    explanation: WHO-HAEM5 states the qualifying CEBPA patterns.
  - reference: PMID:35732831
    reference_title: "The 5th edition of the World Health Organization Classification of Haematolymphoid Tumours: Myeloid and Histiocytic/Dendritic Neoplasms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      at least 20% blasts for diagnosis.
    explanation: WHO-HAEM5 retains the 20% blast threshold for AML with CEBPA mutation.
- name: ICC 2022 AML with in-frame bZIP CEBPA mutation definition
  definition_type: DIAGNOSTIC_CRITERIA
  scope: International Consensus Classification 2022
  description: >-
    ICC recognizes AML with an in-frame bZIP CEBPA mutation at a minimum of 10%
    blasts, irrespective of allelic state. Pooled analyses describe current ICC
    recommendations as including bZIP missense variants; that classification
    boundary must not be equated with the narrower indel-specific favorable
    outcome or generalized to every CEBPA-mutated AML case.
  evidence:
  - reference: DOI:10.1007/s11899-023-00699-3
    reference_title: Sporadic and Familial Acute Myeloid Leukemia with CEBPA Mutations
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      in-frame bZIP-mutation irrespective of double or single CEBPA-mutated
      status [12– 14] has been adapted in both ICC and the 2022 ELN
      recommendation
    explanation: The classification review describes the ICC shift to in-frame bZIP mutation irrespective of allelic state.
  - reference: DOI:10.1007/s11899-023-00699-3
    reference_title: Sporadic and Familial Acute Myeloid Leukemia with CEBPA Mutations
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In addition, ICC and ELN require a minimum of 10% blast for AML-CEBPA,
      whereas WHO-5 mandates 20% blast threshold.
    explanation: The review directly contrasts the ICC and WHO blast thresholds.
  - reference: PMID:38228680
    reference_title: Prognostic impact of CEBPA mutational subgroups in adult AML.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ELN2022 and ICC recommendations (including CEBPA bZIPms).
    explanation: The pooled analysis documents that current ICC/ELN recommendations can include bZIP missense variants.
mechanistic_hypotheses:
- hypothesis_group_id: cebpa_variant_convergence
  hypothesis_label: Variant-specific CEBPA dysfunction converges on differentiation arrest
  status: CANONICAL
  description: >-
    N-terminal truncating lesions preserve and overproduce p30, whereas
    C-terminal bZIP lesions alter DNA binding and dimerization. These distinct
    molecular defects converge on abnormal granulocytic transcription,
    differentiation arrest, leukemic progenitor expansion, and AML.
  evidence:
  - reference: PMID:11242107
    reference_title: "Dominant-negative mutations of CEBPA, encoding CCAAT/enhancer binding protein-alpha (C/EBPalpha), in acute myeloid leukemia."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      The mutant proteins block wild-type C/EBPalpha DNA binding and
      transactivation of granulocyte target genes in a dominant-negative manner,
      and fails to induce granulocytic differentiation.
    explanation: Founding functional evidence connects human AML CEBPA mutations to dominant-negative differentiation failure.
- hypothesis_group_id: cebpa_high_risk_state
  hypothesis_label: Immune and mitochondrial expression state correlates with relapse risk
  status: EMERGING
  applies_to_subtypes:
  - CEBPA bZIP In-Frame-Indel AML
  description: >-
    A subset of bZIP in-frame-indel AML shows interferon-signaling and mitochondrial
    expression programs associated with shorter event-free survival. The data
    are prognostic correlations; the direction and causal intermediates remain
    unresolved.
  evidence:
  - reference: PMID:38253683
    reference_title: Dysregulated immune and metabolic pathways are associated with poor survival in adult acute myeloid leukemia with CEBPA bZIP in-frame mutations.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      RNA-sequencing analysis revealed an enrichment of interferon (IFN)
      signaling and metabolic pathways in those with a shorter event-free
      survival (EFS).
    explanation: This supports association with outcome but not a causal pathway from CEBPA mutation to relapse.
pathophysiology:
- name: N-Terminal CEBPA p42-to-p30 Dysregulation
  description: >-
    Acquired N-terminal TAD frameshift or nonsense variants truncate the p42
    isoform while permitting downstream translation reinitiation and excess p30.
    The retained p30 protein interferes with normal C/EBPalpha transcriptional
    control; this is a dominant-negative isoform imbalance rather than simple
    absence of the protein.

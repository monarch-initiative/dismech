      explanation: Functional assays directly connect mutant CEBPA to failure of granulocytic differentiation.
  - target: Premalignant HSC and Leukemia-Initiating Progenitor Expansion
    description: Loss of p42-mediated control permits abnormal myeloid progenitor proliferation and leukemia initiation.
    hypothesis_groups:

animal_models:
- species: Mus musculus
  genotype: Cebpa p30-only knock-in with loss of the p42 isoform
  description: >-
    A p30-only knock-in models the N-terminal human mutation consequence by
    removing p42 while retaining p30. Mice develop AML with complete penetrance
    and yield transplantable committed myeloid leukemia-initiating cells. The
    model isolates isoform imbalance and does not reproduce the common paired
    N-terminal plus bZIP genotype or the full human co-mutation landscape.
  genes:
  - preferred_term: Cebpa
    term:
      id: hgnc:1833
      label: CEBPA
  evidence:
  - reference: PMID:18394553
    reference_title: Modeling of C/EBPalpha mutant acute myeloid leukemia reveals a common expression signature of committed myeloid leukemia-initiating cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      we modified the mouse Cebpa locus to express only p30. p30 supported the
      formation of granulocyte-macrophage progenitors. However, p42 was required
      for control of myeloid progenitor proliferation, and p42-deficient mice
      developed AML with complete penetrance.
    explanation: The engineered model directly tests the p42-loss/p30-retention mechanism and develops AML.
- species: Mus musculus
  genotype: Combined N-terminal and C-terminal Cebpa knock-in mutations
  description: >-
    Complementary Cebpa knock-in alleles model the classic paired mutation
    architecture. C-terminal lesions expand premalignant long-term HSCs, while
    N-terminal lesions allow committed myeloid leukemia-initiating progenitors;
    the combined genotype accelerates disease. Exact alleles and treatment
    context still differ from the heterogeneous human bZIP in-frame entity.
  genes:
  - preferred_term: Cebpa
    term:
      id: hgnc:1833
      label: CEBPA
  evidence:
  - reference: PMID:19878871
    reference_title: Hematopoietic stem cell expansion precedes the generation of committed myeloid leukemia-initiating cells in C/EBPalpha mutant AML.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      The combination of N- and C-terminal C/EBPalpha mutations incorporates
      both features, accelerating disease development and explaining the
      clinical prevalence of this configuration of CEBPA mutations.
    explanation: The paired knock-in experiment demonstrates complementary mutation effects and accelerated leukemogenesis.
- species: Danio rerio
  genotype: cebpa loss-of-function and N-terminal zP30-expressing mutants
  description: >-
    Zebrafish cebpa mutants resolve developmental HSPC generation and isoform
    function. N-terminal zP30 mutants impair myeloid differentiation without
    reducing HSPC number. This is a developmental hematopoiesis model, not an AML
    model, and it should not be used as evidence of leukemia penetrance or therapy.
  evidence:
  - reference: PMID:39500381
    reference_title: Cebpa is required for haematopoietic stem and progenitor cell generation and maintenance in zebrafish.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      while myeloid differentiation was impaired in cebpa N-terminal mutants
      expressing the truncated zP30 protein, the number of HSPCs was not affected
    explanation: The developmental model separates an N-terminal isoform effect on myeloid differentiation from HSPC abundance.
discussions:
- discussion_id: controversy_cebpa_classification_and_risk_boundaries
  prompt: >-
    How should WHO-HAEM5, ICC 2022, and ELN 2022 CEBPA categories be represented
    without conflating disease definition, blast threshold, allelic state, and
    treatment-context risk?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - definitions#WHO-HAEM5 AML with CEBPA mutation definition
  - definitions#ICC 2022 AML with in-frame bZIP CEBPA mutation definition
  - has_subtypes#CEBPA bZIP In-Frame-Indel AML
  rationale: >-
    WHO includes biallelic CEBPA or a single bZIP mutation and retains 20% blasts;
    ICC requires an in-frame bZIP mutation and permits diagnosis from 10% blasts;
    ELN assigns in-frame bZIP CEBPA to favorable risk in intensively treated
    adults. These are overlapping but non-identical assertions, and newer outcome
    data suggest that in-frame bZIP indels, not every bZIP mutation, carry the
    clearest favorable signal.
  evidence:
  - reference: PMID:35732831
    reference_title: "The 5th edition of the World Health Organization Classification of Haematolymphoid Tumours: Myeloid and Histiocytic/Dendritic Neoplasms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      include biallelic (biCEBPA) as well as single mutations located in the
      basic leucine zipper (bZIP) region of the gene (smbZIP- CEBPA).
    explanation: WHO-HAEM5 documents one diagnostic boundary.
  - reference: PMID:38228680
    reference_title: Prognostic impact of CEBPA mutational subgroups in adult AML.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only bZIPInDel patients had significantly higher rates of complete
      remission and longer relapse free and overall survival (OS) compared with
      all other CEBPA-mutant subgroups.
    explanation: Pooled outcome data sharpen the favorable signal to bZIP in-frame insertion/deletion cases.
  proposed_experiments:
  - experiment_id: exp_cebpa_harmonized_classification_outcomes
    name: Harmonized WHO-ICC-ELN prospective outcome analysis
    description: >-
      Prospectively phase full-length CEBPA variants and assign each case in
      parallel under WHO, ICC, and ELN rules, stratified by intensive versus
      lower-intensity treatment and serial flow MRD.
    decision_criterion: >-
      A boundary is clinically coherent if it independently separates remission,
      relapse-free survival, and overall survival after adjustment for treatment,
      age, co-mutations, and MRD in external validation cohorts.
- discussion_id: controversy_cebpa_comutations_mrd_and_transplant
  prompt: >-
    Which co-mutations or post-treatment MRD states identify in-frame bZIP CEBPA
    AML patients who benefit from transplantation in first remission?
  kind: CONTROVERSY
  status: OPEN
  attaches_to:
  - genetic#WT1
  - genetic#DNMT3A
  - genetic#FLT3-ITD
  - diagnosis#Bone-Marrow Multiparameter Flow MRD Assessment
  - treatments#Allogeneic Hematopoietic Stem Cell Transplantation
  rationale: >-
    One intensively treated cohort associated WT1, DNMT3A, immune/metabolic
    expression, and upfront transplant with outcome, whereas a larger pooled
    analysis found no independent overall-survival effect from several
    co-mutations. Flow MRD during consolidation is prognostic, but there is no
    validated CEBPA-specific randomized rule for transplant in first remission.
  evidence:
  - reference: PMID:38253683
    reference_title: Dysregulated immune and metabolic pathways are associated with poor survival in adult acute myeloid leukemia with CEBPA bZIP in-frame mutations.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Concurrent WT1 or DNMT3A mutations significantly predicted worse survival
      in AML patients with CEBPAbZIP-inf.
    explanation: This cohort supports one proposed adverse-risk signal.
  - reference: PMID:38228680
    reference_title: Prognostic impact of CEBPA mutational subgroups in adult AML.
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      co-mutations in bZIPInDel patients (e.g. GATA2, FLT3, WT1 as well as
      ELN2022 adverse risk aberrations) had no independent impact on OS
    explanation: The pooled cohort provides a conflicting estimate, keeping a co-mutation-based transplant rule unresolved.
  proposed_experiments:
  - experiment_id: exp_cebpa_mrd_adapted_transplant_strategy
    name: Prospective MRD-adapted transplant strategy study
    description: >-
      Enroll molecularly defined in-frame bZIP CEBPA AML, stratify by harmonized
      co-mutation profile and consolidation-time bone-marrow flow MRD, and compare
      chemotherapy consolidation with allogeneic transplantation in the
      prespecified high-risk/MRD-positive strata.
    decision_criterion: >-
      A first-remission transplant rule would require a reproducible interaction
      showing improved overall survival, not only relapse reduction, with an
      acceptable non-relapse mortality tradeoff in an independent cohort.
- discussion_id: gap_cebpa_model_to_human_variant_fidelity
  prompt: >-
    Do p30-only and paired Cebpa knock-in mice reproduce the variant-specific
    human bZIP in-frame-indel outcome subgroup and its treatment response?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#N-Terminal CEBPA p42-to-p30 Dysregulation
  - pathophysiology#C-Terminal CEBPA bZIP DNA-Binding and Dimerization Dysfunction
  rationale: >-
    The mouse models establish etiologic and cellular effects of Cebpa isoform
    imbalance and paired terminal lesions, but human favorable risk is most
    clearly associated with diverse bZIP in-frame indels. The models do not
    reproduce the complete human allelic, co-mutation, immune/metabolic, and
    treatment-context landscape.
  evidence:
  - reference: PMID:18394553
    reference_title: Modeling of C/EBPalpha mutant acute myeloid leukemia reveals a common expression signature of committed myeloid leukemia-initiating cells.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      To mimic the most common mutations affecting CEBPA-that is, those leading
      to loss of the 42 kDa C/EBPalpha isoform (p42) while retaining the 30kDa
      isoform (p30)-we modified the mouse Cebpa locus to express only p30.
    explanation: The model deliberately isolates the N-terminal isoform consequence rather than the full human genotype spectrum.
  - reference: PMID:19878871
    reference_title: Hematopoietic stem cell expansion precedes the generation of committed myeloid leukemia-initiating cells in C/EBPalpha mutant AML.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      We here use knockin mutagenesis in the mouse to model the spectrum of
      acquired CEBPA mutations in human acute myeloid leukemia.
    explanation: The paired knock-in system provides mechanistic precedent but still abstracts heterogeneous human alleles.
  proposed_experiments:
  - experiment_id: exp_cebpa_isogenic_human_variant_panel
    name: Isogenic human CEBPA variant-panel leukemia model
    description: >-
      Engineer representative N-terminal truncating, bZIP in-frame indel, bZIP
      stop, and bZIP missense alleles singly and in phased pairs in human CD34+
      hematopoietic cells, with matched xenografts and drug-response profiling.
    decision_criterion: >-
      Model fidelity would be supported if variant classes reproduce the human
      hierarchy of differentiation arrest, stem/progenitor state, transcriptome,
      chemotherapy sensitivity, and relapse-associated MRD in independent donors.

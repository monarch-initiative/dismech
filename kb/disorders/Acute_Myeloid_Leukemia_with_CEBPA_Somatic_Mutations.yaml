clinical_trials:
- name: NCT06458257
  phase: NOT_APPLICABLE
  status: RECRUITING
  description: >-
    Recruiting observational study evaluating outcomes after allogeneic
    transplantation following induction and consolidation in newly diagnosed
    patients labeled high-relapse-risk CEBPA-mutant AML. It is not randomized
    and has no posted results, so efficacy is not established.
  evidence:
  - reference: clinicaltrials:NCT06458257
    reference_title: The Efficacy of Allogeneic Hematopoietic Stem Cell Transplantation in Newly Diagnosed High-relapse-risk CEBPA Mutant Acute Myeloid Leukemia
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To access whether the therapeutic regimen is effective for
      high-relapse-risk CEBPA mutant acute myeloid leukemia, the
      disease-free-survival (DFS), overall survival (OS), non-relapse-mortality
      of patients is evaluated.
    explanation: >-
      The registry states the planned outcomes; it does not provide an efficacy result.
  review_notes: >-
    ClinicalTrials.gov status checked 2026-07-17. The eligibility text is
    internally inconsistent about CD7, so CD7 is not encoded as a validated
    transplant-selection marker.
- name: NCT06529250
  phase: NOT_APPLICABLE
  status: RECRUITING
  description: >-
    Recruiting open-label randomized study comparing intermediate-dose HAD with
    a conventional regimen in CEBPA-mutated AML. The registry reports no results;
    superiority remains a study hypothesis.
  evidence:
  - reference: clinicaltrials:NCT06529250
    reference_title: "A Multicenter, Randomized, Controlled Clinical Trial of Intermediate-dose HAD Regimen for CEBPA Double-mutated Acute Myeloid Leukemia"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Therefore, this project intends to confirm the efficacy of
      intermediate-dose HAD in the treatment of CEBPA double-mutated AML is
      superior to the conventional treatment regimen through the multi-center RCT
      study.
    explanation: >-
      The trial summary describes the intended randomized comparison, not a completed result.
  review_notes: >-
    ClinicalTrials.gov status checked 2026-07-17. The title uses double-mutated
    CEBPA while current eligibility language refers to bZIP mutation, so the
    enrolled molecular population should be verified before interpreting results.
- name: NCT04415008
  phase: PHASE_II
  status: ACTIVE_NOT_RECRUITING
  description: >-
    Active-not-recruiting prospective multicenter single-arm phase 2 study of
    HAD induction with intensified cytarabine in newly diagnosed CEBPA
    double-mutated AML. No results are posted in the registry.
  evidence:
  - reference: clinicaltrials:NCT04415008
    reference_title: "A Prospective, Multicenter, Single Arm Clinical Study to Evaluate Efficacy of HAD Induction With Intensified Cytarabine in Newly-diagnosed CEBPA Double Mutated Acute Myeloid Leukemia"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HAD(homoharringtonine(HHT)+cytarabine+daunorubicin) with intermediate
      dose cytarabine improved the survival of AML, especially in patients with
      CEBPA double mutation.
    explanation: >-
      The registry text supplies the study rationale; the single-arm study has not posted results.
  review_notes: ClinicalTrials.gov status checked 2026-07-17; efficacy remains unreported.
- name: NCT07451912
  status: RECRUITING
  description: >-
    Recruiting open-label single-arm phase 1/2 study of venetoclax plus a
    hypomethylating agent and low-dose subcutaneous cytarabine for adults with
    newly diagnosed CEBPA-mutated AML who cannot tolerate intensive chemotherapy.
    It has no posted results and the triplet remains investigational.
  evidence:
  - reference: clinicaltrials:NCT07451912
    reference_title: Prospective Multicenter Clinical Study of Venetoclax Combined With Hypomethylating Agents and Subcutaneous Cytarabine in Induction Therapy for CEBPA-Mutated Acute Myeloid Leukemia
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The goal of this clinical trial is to learn if a treatment
      combination-venetoclax plus hypomethylating agents (like azacitidine or
      decitabine) and low-dose cytarabine-works to treat adults with newly
      diagnosed CEBPA-mutated acute myeloid leukemia (AML) who can't tolerate
      intensive chemotherapy.
    explanation: The registry defines the investigational triplet and intensive-therapy-ineligible study population.
  review_notes: >-
    ClinicalTrials.gov status checked 2026-07-17. The registry labels this a
    combined phase 1/2 study; the phase field is omitted because the schema has
    no combined-phase value.

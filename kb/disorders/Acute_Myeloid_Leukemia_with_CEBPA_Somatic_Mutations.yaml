progression:
- phase: Diagnosis and Classification Assignment
  notes: >-
    Establish AML, apply the selected WHO or ICC blast threshold, identify the
    precise CEBPA domain and variant type, and distinguish disease definition
    from ELN treatment-context risk assignment. Diagnostic marrow VAF cannot by
    itself establish somatic origin.
  evidence:
  - reference: PMID:35732831
    reference_title: "The 5th edition of the World Health Organization Classification of Haematolymphoid Tumours: Myeloid and Histiocytic/Dendritic Neoplasms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      include biallelic (biCEBPA) as well as single mutations located in the
      basic leucine zipper (bZIP) region of the gene (smbZIP- CEBPA).
    explanation: WHO shows why exact mutation pattern is part of disease assignment.
- phase: Induction and Complete Remission
  subtype: CEBPA bZIP In-Frame-Indel AML
  notes: >-
    Fit patients usually receive intensive induction. The bZIP in-frame-indel
    subgroup has higher complete-remission rates and better survival than other
    CEBPA mutation patterns, but this prognostic association does not eliminate
    relapse risk.
  evidence:
  - reference: PMID:38228680
    reference_title: Prognostic impact of CEBPA mutational subgroups in adult AML.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Only bZIPInDel patients had significantly higher rates of complete
      remission and longer relapse free and overall survival (OS) compared with
      all other CEBPA-mutant subgroups.
    explanation: The pooled analysis identifies the response and survival advantage of the in-frame bZIP subgroup.
- phase: Consolidation and MRD Reassessment
  notes: >-
    Bone-marrow multiparameter-flow MRD during consolidation refines relapse
    risk. CEBPA mutation detection is not automatically an MRD assay because a
    persisting variant can indicate germline predisposition; interpret molecular
    findings with remission tissue and broader clonality context.
  evidence:
  - reference: DOI:10.1007/s11899-023-00699-3
    reference_title: Sporadic and Familial Acute Myeloid Leukemia with CEBPA Mutations
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      MRD-positive status during consolidation but not after induction was
      associated with an increased risk of relapse and decreased relapse free
      survival.
    explanation: The CEBPA review summarizes the prognostic timing of flow-cytometric MRD.
  - reference: PMID:41397238
    reference_title: "2025 update on MRD in acute myeloid leukemia: a consensus document from the ELN-DAVID MRD Working Party."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Measurable residual disease (MRD) monitoring has become a critical
      component in the management of acute myeloid leukemia (AML), to inform
      prognosis, guide therapy, and serve as a key end point in clinical trials.
    explanation: Current ELN-DAVID consensus establishes MRD as a dynamic AML management tool.
- phase: Relapsed or Refractory Disease
  notes: >-
    Relapsed CEBPA double-mutated AML can remain chemotherapy-sensitive.
    Reinduction, molecular reassessment, MRD response, donor suitability, and
    overall AML risk inform allogeneic transplantation in second remission or
    refractory disease.
  evidence:
  - reference: DOI:10.1007/s11899-023-00699-3
    reference_title: Sporadic and Familial Acute Myeloid Leukemia with CEBPA Mutations
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The second CR rate was reported to be 83–85% [78, 79].
    explanation: The review supports retained chemosensitivity after relapse in double-mutated disease.

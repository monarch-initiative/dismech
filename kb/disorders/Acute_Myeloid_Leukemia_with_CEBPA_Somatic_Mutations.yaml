    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We found that five mutations in the amino terminus truncate the
      full-length protein, but did not affect a 30-kD protein initiated further
      downstream.
    explanation: Human AML variants were shown to truncate p42 while preserving downstream p30 translation.
  - reference: DOI:10.1007/s11899-023-00699-3

- name: Bone Marrow Morphology and Blast Enumeration
  diagnosis_term:
    preferred_term: biopsy of bone marrow
    term:
      id: NCIT:C15193
      label: Bone Marrow Biopsy
  description: >-
    Aspirate and core biopsy establish an acute myeloid blast process, assess
    maturation and dysplasia, and supply material for flow, cytogenetic, and
    molecular studies. Apply the classification-specific threshold: WHO-HAEM5
    requires at least 20% blasts for AML with CEBPA mutation, whereas ICC uses
    at least 10% for its in-frame bZIP entity.
  results: An acute myeloid blast proliferation meeting the selected WHO or ICC threshold.
  evidence:
  - reference: PMID:35732831
    reference_title: "The 5th edition of the World Health Organization Classification of Haematolymphoid Tumours: Myeloid and Histiocytic/Dendritic Neoplasms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      at least 20% blasts for diagnosis.
    explanation: WHO directly establishes the CEBPA-entity blast threshold.
  - reference: DOI:10.1007/s11899-023-00699-3
    reference_title: Sporadic and Familial Acute Myeloid Leukemia with CEBPA Mutations
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ICC and ELN require a minimum of 10% blast for AML-CEBPA, whereas WHO-5
      mandates 20% blast threshold.
    explanation: The classification review states the ICC-versus-WHO threshold difference.
- name: Flow-Cytometric Myeloid Lineage Assessment
  diagnosis_term:
    preferred_term: flow cytometry procedure
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  description: >-
    Multiparameter flow cytometry confirms an acute myeloid immunophenotype and
    establishes a leukemia-associated phenotype for later MRD assessment.
    CEBPA double-mutated blasts frequently express CD7, CD15, and HLA-DR, but no
    immunophenotype substitutes for sequencing.
  results: Myeloid blasts with a reproducible leukemia-associated immunophenotype.
  evidence:
  - reference: DOI:10.1007/s11899-023-00699-3
    reference_title: Sporadic and Familial Acute Myeloid Leukemia with CEBPA Mutations
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      frequency of CD7, CD15, and HLA-DR expression
    explanation: The review summarizes the characteristic but non-pathognomonic flow phenotype.
- name: Cytogenetic and Broad Myeloid Molecular Profiling
  diagnosis_term:
    preferred_term: cytogenetic analysis
    term:
      id: NCIT:C18280
      label: Cytogenetic Analysis
  description: >-
    Karyotyping/FISH and broad myeloid NGS identify competing AML-defining
    lesions, myelodysplasia-related abnormalities, and co-mutations that affect
    integrated risk. A normal karyotype is common but is not a diagnostic
    requirement.
  results: Cytogenetic and co-mutation profile used for diagnostic hierarchy and risk assignment.
  evidence:
  - reference: DOI:10.1007/s11899-023-00699-3
    reference_title: Sporadic and Familial Acute Myeloid Leukemia with CEBPA Mutations
    supports: SUPPORT
    evidence_source: OTHER
    snippet: CEBPAdm is strongly associated with a normal karyotype
    explanation: The review supports cytogenetic assessment while showing that CEBPA AML is often karyotypically normal.
- name: Full-Length CEBPA Sequencing and Variant Annotation
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  description: >-
    Sequence the full single-exon CEBPA coding region and report domain,
    insertion/deletion frame, variant allele fraction, and co-occurring CEBPA
    lesions. Capture-based NGS is preferred over amplicon-only methods because
    the locus is GC-rich and indel-heavy. Routine short reads may not phase
    distant N- and C-terminal variants.
  results: Precise CEBPA mutation pattern supporting WHO/ICC assignment and ELN risk classification.
  evidence:
  - reference: DOI:10.1007/s11899-023-00699-3
    reference_title: Sporadic and Familial Acute Myeloid Leukemia with CEBPA Mutations
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      method for CEBPA mutation detection is full length sequencing of this
      single exon gene.
    explanation: The review directly recommends full-length sequencing.
  - reference: DOI:10.1007/s11899-023-00699-3
    reference_title: Sporadic and Familial Acute Myeloid Leukemia with CEBPA Mutations
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Capture-based NGS has been shown to perform better than amplicon-based NGS
      in CEBPA mutation detection
    explanation: This supports the assay-design recommendation for the GC-rich, indel-prone locus.
- name: Constitutional Evaluation for Germline CEBPA Predisposition
  diagnosis_term:
    preferred_term: molecular genetic testing
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  description: >-
    Evaluate germline predisposition when the CEBPA variant persists in complete
    remission, onset or family history is suggestive, or donor selection makes
    constitutional status consequential. Marrow or blood VAF near 50% cannot
    distinguish germline from somatic disease. Cultured skin fibroblasts are the
    preferred constitutional specimen; related donors require appropriate
    testing and counseling.
  results: Constitutional testing distinguishes this somatic-only entry from germline CEBPA-associated predisposition.
  evidence:
  - reference: DOI:10.1007/s11899-023-00699-3
    reference_title: Sporadic and Familial Acute Myeloid Leukemia with CEBPA Mutations
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      VAF cannot be reliably used as a marker
    explanation: This directly refutes using diagnostic blood or marrow VAF alone to assign origin.
  - reference: DOI:10.1007/s11899-023-00699-3
    reference_title: Sporadic and Familial Acute Myeloid Leukemia with CEBPA Mutations
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The gold standard constitutional sample type for germline confirmation is
      cultured skin fibroblasts
    explanation: The review identifies the preferred constitutional specimen.
- name: Bone-Marrow Multiparameter Flow MRD Assessment
  diagnosis_term:
    preferred_term: flow cytometry procedure
    term:
      id: NCIT:C16585
      label: Flow Cytometry
  description: >-
    Assess MRD using bone-marrow multiparameter flow after therapy, especially
    during consolidation, and interpret it with integrated genetic risk.
    Persisting CEBPA sequence alone is not automatically residual leukemia
    because it can indicate a constitutional variant.
  results: MRD category used for dynamic relapse-risk and transplant assessment.
  evidence:
  - reference: DOI:10.1007/s11899-023-00699-3
    reference_title: Sporadic and Familial Acute Myeloid Leukemia with CEBPA Mutations
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      MRD-positive status during consolidation but not after induction was
      associated with an increased risk of relapse and decreased relapse free
      survival.
    explanation: The CEBPA review supports consolidation-time MFC-MRD as prognostic.
  - reference: PMID:41397238
    reference_title: "2025 update on MRD in acute myeloid leukemia: a consensus document from the ELN-DAVID MRD Working Party."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      MRD recommendations are tailored to individual prognostic and genetic
      subgroups.
    explanation: Current ELN-DAVID consensus supports genotype-aware MRD interpretation.
differential_diagnoses:
- name: Germline CEBPA-Associated Myeloid Neoplasm Predisposition
  description: >-
    Familial or de novo constitutional CEBPA pathogenic variants can produce AML
    with a second acquired CEBPA lesion and can closely resemble sporadic
    double-mutated disease.
  distinguishing_features:
  - Persistence of a CEBPA variant in complete remission supports constitutional evaluation.
  - Diagnostic blood or marrow VAF near 50% is not sufficient to distinguish origin.
  - Cultured skin fibroblast testing, family evaluation, and genetic counseling establish constitutional status.
  evidence:
  - reference: DOI:10.1007/s11899-023-00699-3
    reference_title: Sporadic and Familial Acute Myeloid Leukemia with CEBPA Mutations
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      the persistence of a CEBPA mutation at the time of complete remission
      warrants
    explanation: Persistence in remission is a direct trigger for germline evaluation even without family history.
- name: Acute Myeloid Leukemia with Mutated NPM1
  disease_term:
    preferred_term: acute myeloid leukemia with mutated NPM1
    term:
      id: MONDO:0044923
      label: acute myeloid leukemia with mutated NPM1
  description: A separate mutation-defined AML entity that may present with similar acute myeloid morphology.
  distinguishing_features:
  - A defining NPM1 mutation and application of the WHO/ICC diagnostic hierarchy distinguish this entity.
  - NPM1 co-mutation is uncommon in the biallelic and single-bZIP CEBPA groups.
  evidence:
  - reference: PMID:35732831
    reference_title: "The 5th edition of the World Health Organization Classification of Haematolymphoid Tumours: Myeloid and Histiocytic/Dendritic Neoplasms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: include AML with NPM1 and AML with CEBPA mutation.
    explanation: WHO lists NPM1-mutated and CEBPA-mutated AML as separate mutation-defined types.
- name: Acute Promyelocytic Leukemia with PML::RARA
  disease_term:
    preferred_term: acute promyelocytic leukemia
    term:
      id: MONDO:0012883
      label: acute promyelocytic leukemia
  description: A genetically defined AML emergency that can overlap in cytopenic acute-leukemia presentation.
  distinguishing_features:
  - Promyelocytic morphology, coagulopathy, and PML::RARA testing distinguish APL and require immediate disease-specific management.
  evidence:
  - reference: PMID:35732831
    reference_title: "The 5th edition of the World Health Organization Classification of Haematolymphoid Tumours: Myeloid and Histiocytic/Dendritic Neoplasms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      criteria for AML with PML::RARA, AML with RUNX1::RUNX1T1, and AML with
      CBF::MYH11
    explanation: WHO recognizes these as distinct AML types requiring lesion-specific assignment.
- name: Core-Binding-Factor Acute Myeloid Leukemia
  description: RUNX1::RUNX1T1- or CBFB::MYH11-defined AML can share an acute myeloid blast presentation.
  distinguishing_features:
  - Fusion testing identifies a core-binding-factor lesion and redirects classification and risk assessment.
  evidence:
  - reference: PMID:35732831
    reference_title: "The 5th edition of the World Health Organization Classification of Haematolymphoid Tumours: Myeloid and Histiocytic/Dendritic Neoplasms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Acute myeloid leukaemia with RUNX1::RUNX1T1 fusion
      Acute myeloid leukaemia with CBFB::MYH11 fusion
    explanation: WHO lists the two core-binding-factor AML types separately.
- name: Myelodysplastic Syndrome or ICC MDS/AML
  disease_term:
    preferred_term: myelodysplastic syndrome
    term:
      id: MONDO:0018881
      label: myelodysplastic syndrome
  description: Cytopenia, dysplasia, and 10-19% blasts can overlap at the MDS/AML boundary.
  distinguishing_features:
  - Apply the selected classification's blast threshold and CEBPA mutation-pattern requirements.
  - WHO retains 20% blasts for AML with CEBPA mutation, whereas ICC permits its in-frame bZIP entity from 10% blasts.
  evidence:
  - reference: PMID:35732831
    reference_title: "The 5th edition of the World Health Organization Classification of Haematolymphoid Tumours: Myeloid and Histiocytic/Dendritic Neoplasms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: retaining a 20% blast cutoff to delineate MDS from AML.
    explanation: WHO describes the retained general boundary that must be reconciled with genetic-entity exceptions.
- name: AML with Myelodysplasia-Related Genetics
  description: >-
    Myelodysplasia-related cytogenetic or molecular abnormalities and prior MDS
    can coexist with a CEBPA mutation. Classification and risk assignment depend
    on the exact lesions and the selected WHO or ICC hierarchy; this entry does
    not assert a universal precedence rule.
  distinguishing_features:
  - Prior myeloid disease, myelodysplasia-related cytogenetics, and defining MR-gene mutations support AML-MR.
  - Broad NGS and cytogenetics are required because an incidental or nonqualifying CEBPA variant must not obscure independently qualifying AML-MR features.
  - Apply the selected framework's hierarchy rather than assuming that either label always supersedes the other.
  evidence:
  - reference: PMID:35732831
    reference_title: "The 5th edition of the World Health Organization Classification of Haematolymphoid Tumours: Myeloid and Histiocytic/Dendritic Neoplasms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      removal of morphology alone as a diagnostic premise to make a diagnosis
      of AML-MR;
    explanation: WHO-HAEM5 explicitly removes morphology alone as a sufficient basis for AML-MR.
- name: Mixed-Phenotype Acute Leukemia
  description: Acute leukemia of ambiguous lineage can overlap when blasts express cross-lineage markers.
  distinguishing_features:
  - Formal lineage criteria and flow/cytochemical evidence of more than one lineage distinguish MPAL.
  - A CEBPA mutation alone does not replace lineage assignment.
  evidence:
  - reference: PMID:35732831
    reference_title: "The 5th edition of the World Health Organization Classification of Haematolymphoid Tumours: Myeloid and Histiocytic/Dendritic Neoplasms."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Mixed-phenotype acute leukaemia, B/myeloid
    explanation: WHO-HAEM5 recognizes MPAL as a separate ambiguous-lineage category.
treatments:
- name: Intensive Anthracycline- and Cytarabine-Based Chemotherapy
  description: >-
    Medically fit patients are generally treated with anthracycline- and
    cytarabine-based induction followed by cytarabine-containing consolidation.
    This is an AML treatment backbone, not a CEBPA-directed therapy. The favorable
    reproducible favorable-outcome evidence applies most securely to bZIP
    in-frame-indel disease treated intensively; it does not establish that every
    classification-included bZIP variant responds equivalently.
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: cytarabine
      term:
        id: CHEBI:28680
        label: cytarabine
    - preferred_term: daunorubicin
      term:
        id: CHEBI:41977
        label: daunorubicin
  target_mechanisms:
  - target: Leukemic Myeloblast Accumulation
    treatment_effect: INHIBITS
    description: Cytotoxic induction and consolidation reduce the proliferating leukemic blast population.
    evidence:
    - reference: DOI:10.1007/s11899-023-00699-3
      reference_title: Sporadic and Familial Acute Myeloid Leukemia with CEBPA Mutations
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        The anthracycline and cytarabine based induction chemotherapy followed
        by consolidation
      explanation: The CEBPA-focused review identifies intensive induction and consolidation as the principal treatment backbone for fit patients.
  evidence:
  - reference: DOI:10.1007/s11899-023-00699-3
    reference_title: Sporadic and Familial Acute Myeloid Leukemia with CEBPA Mutations
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The anthracycline and cytarabine based induction chemotherapy followed by
      consolidation
    explanation: >-
      This supports the standard intensive AML backbone without treating an
      unreported trial result as efficacy evidence.
- name: Hypomethylating Agent Plus Venetoclax for Intensive-Therapy-Ineligible Patients
  description: >-
    A hypomethylating agent plus venetoclax is a lower-intensity frontline AML
    option when age, frailty, or comorbidity precludes intensive chemotherapy.
    CEBPA-specific evidence is limited: favorable-risk AML was excluded from
    VIALE-A, and the reported CEBPA double-mutated experience is a small subset.
    The addition of low-dose cytarabine is being studied and is not encoded as
    established standard care for this molecular subtype.
  treatment_term:
    preferred_term: pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: venetoclax
      term:
        id: CHEBI:133021
        label: venetoclax
    - preferred_term: azacitidine
      term:
        id: NCIT:C288
        label: Azacitidine
  target_mechanisms:
  - target: Leukemic Myeloblast Accumulation
    treatment_effect: INHIBITS
    description: The combination is used to reduce the leukemic blast population in patients unable to receive intensive induction.
    evidence:
    - reference: DOI:10.1007/s11899-023-00699-3
      reference_title: Sporadic and Familial Acute Myeloid Leukemia with CEBPA Mutations
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        Recently, hypomethylating agents (HMA) coupled with venetoclax have been
        adapted as frontline therapy for patients who are not eligible for high
        intensity chemotherapy
      explanation: The review supports use of the lower-intensity combination to treat the leukemic disease in intensive-therapy-ineligible patients.
  evidence:
  - reference: DOI:10.1007/s11899-023-00699-3
    reference_title: Sporadic and Familial Acute Myeloid Leukemia with CEBPA Mutations
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Recently, hypomethylating agents (HMA) coupled with venetoclax have been
      adapted as frontline therapy for patients who are not eligible for high
      intensity chemotherapy
    explanation: The review supports this as an eligibility-based lower-intensity AML approach.
  - reference: DOI:10.1007/s11899-023-00699-3
    reference_title: Sporadic and Familial Acute Myeloid Leukemia with CEBPA Mutations
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The complete remission (CR) and complete remission with incomplete count
      recovery (CRi) rate in this patient population were 75%.
    explanation: A small reported CEBPA double-mutated subset supports activity but cannot establish subtype-specific comparative efficacy.
  review_notes: >-
    No approved drug directly targets mutant CEBPA. NCT07451912 is testing a
    venetoclax/HMA/low-dose-cytarabine triplet and has no posted efficacy results.
- name: Allogeneic Hematopoietic Stem Cell Transplantation
  therapeutic_modality: CELL_THERAPY
  description: >-
    Retrospective double-mutated CEBPA cohorts found improved relapse-free but
    not overall survival from transplantation in first complete remission and
    support reserving allogeneic transplantation for refractory disease, relapse,
    or second remission. Whether co-mutations or post-treatment MRD identify a
    first-remission subgroup with an overall-survival benefit remains unresolved
    and is represented below as an open discussion, not a recommendation.
    Suspected germline CEBPA predisposition requires constitutional evaluation
    before related-donor selection.
  treatment_term:
    preferred_term: allogeneic hematopoietic stem cell transplantation
    term:
      id: NCIT:C46089
      label: Allogeneic Hematopoietic Stem Cell Transplantation
  target_mechanisms:
  - target: Leukemic Myeloblast Accumulation
    treatment_effect: INHIBITS
    description: Conditioning and donor hematopoiesis provide cytoreduction and a graft-versus-leukemia effect in selected high-risk or relapsed settings.
    evidence:
    - reference: DOI:10.1007/s11899-023-00699-3
      reference_title: Sporadic and Familial Acute Myeloid Leukemia with CEBPA Mutations
      supports: SUPPORT
      evidence_source: OTHER
      snippet: >-
        This study provided evidence to reserve hematopoietic stem cell
        transplant to CR2 or refractory disease.
      explanation: The review supports transplant as an anti-leukemia strategy in selected later or refractory settings.
  evidence:
  - reference: DOI:10.1007/s11899-023-00699-3
    reference_title: Sporadic and Familial Acute Myeloid Leukemia with CEBPA Mutations
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      While both autologous and allogeneic stem cell transplant provide improved
      RFS in CR1, the OS was not different compared to patient who received
      chemotherapy only. This study provided evidence to reserve hematopoietic
      stem cell transplant to CR2 or refractory disease.
    explanation: >-
      The review supports a limited CR1 role and later transplant use rather than
      routine upfront transplantation for favorable-risk disease.
  - reference: DOI:10.1007/s11899-023-00699-3
    reference_title: Sporadic and Familial Acute Myeloid Leukemia with CEBPA Mutations
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      This information is important for patient management including allogeneic
      stem cell transplant donor selection as well as patient family consultation
      and surveillance.
    explanation: Germline-versus-somatic assignment is clinically consequential for donor selection.
  review_notes: >-
    NCT06458257 is a recruiting observational study with no posted results; it
    does not establish benefit from transplantation in first remission.
- name: Supportive Care for Cytopenias and Infection Risk
  description: >-
    Supportive management includes red-cell and platelet transfusion when
    clinically indicated, prompt evaluation and treatment of infection, and
    individualized measures for disease- and therapy-associated cytopenias.
    These measures treat complications but do not eradicate the CEBPA-mutant clone.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_phenotypes:
  - preferred_term: Anemia
    term:
      id: HP:0001903
      label: Anemia
  - preferred_term: Thrombocytopenia
    term:
      id: HP:0001873
      label: Thrombocytopenia
  - preferred_term: Neutropenia
    term:
      id: HP:0001875
      label: Decreased total neutrophil count
  - preferred_term: Abnormal bleeding
    term:
      id: HP:0001892
      label: Abnormal bleeding
  - preferred_term: Recurrent infections
    term:
      id: HP:0002719
      label: Recurrent infections
  evidence:
  - reference: PMID:23901108
    reference_title: Acute myeloid leukemia does not deplete normal hematopoietic stem cells but induces cytopenias by impeding their differentiation.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Acute myeloid leukemia (AML) induces bone marrow (BM) failure in patients,
      predisposing them to life-threatening infections and bleeding.
    explanation: Human AML marrow failure establishes the complications that supportive care addresses.
  - reference: PMID:34307165
    reference_title: "Improving Outcomes of Chemotherapy: Established and Novel Options for Myeloprotection in the COVID-19 Era."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      chemotherapy-induced myelosuppression is managed with chemotherapy dose
      delays/reductions and lineage-specific supportive care interventions, such
      as hematopoietic growth factors and blood transfusions.
    explanation: This oncology supportive-care review directly supports transfusion and lineage-specific management of treatment-associated myelosuppression.

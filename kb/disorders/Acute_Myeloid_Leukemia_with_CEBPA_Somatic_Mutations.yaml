notes: >-
  Comprehensive somatic-scope re-review. The entry deliberately separates
  WHO-HAEM5 and ICC disease definitions from ELN treatment-context risk, limits
  favorable prognosis to the supported in-frame bZIP subgroup, and treats
  germline CEBPA predisposition as a differential requiring constitutional
  testing. Co-mutation effects, immune/metabolic signatures, first-remission
  transplant selection, and CEBPA-focused trials remain qualified rather than
  encoded as settled efficacy claims. No approved CEBPA-directed drug exists.

name: Multiple Epiphyseal Dysplasia, Beighton Type
creation_date: "2026-09-04T00:00:00Z"
category: Mendelian
description: >-
  Multiple epiphyseal dysplasia, Beighton type (EDMMD; epiphyseal dysplasia,
  multiple, with myopia and conductive deafness; OMIM 132450) is an autosomal
  dominant type II collagenopathy defined by the co-occurrence of a mild
  epiphyseal dysplasia, a progressive ocular disorder (myopia, retinal thinning
  and crenated cataracts), and conductive deafness. It was delineated in a single
  Afrikaner kindred in South Africa, in which affected individuals also had
  reduced stature, a round and flattened face, and short, stubby digits. Two
  decades later the molecular lesion in that family was identified as a
  heterozygous C-to-T change in COL2A1 exon 39 producing an arginine-to-cysteine
  substitution, Arg704Cys, in the triple-helical domain of the pro-alpha-1(II)
  collagen chain. An independent series of COL2A1 arginine-to-cysteine probands
  subsequently reproduced the same genotype-phenotype pairing, describing R704C
  carriers as having Stickler dysplasia with brachydactyly. Recombinant work on
  this exact substitution separates it mechanistically from the more severe
  C-terminal arginine-to-cysteine alleles: the R704C chain folds into a stable,
  trypsin-resistant triple helix, traffics normally from ER to Golgi, and
  triggers neither the unfolded protein response nor apoptosis, so the disease is
  attributed to interference with the collagen network after secretion rather
  than to chondrocyte endoplasmic-reticulum stress.
disease_term:
  preferred_term: multiple epiphyseal dysplasia, Beighton type
  term:
    id: MONDO:0007562
    label: multiple epiphyseal dysplasia, Beighton type
parents:
- multiple epiphyseal dysplasia

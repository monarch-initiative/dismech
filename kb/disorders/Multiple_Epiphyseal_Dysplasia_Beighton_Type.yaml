- population: Reported cases worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Four affected members of one South African Afrikaner kindred are the
    molecularly characterized cases (PMID:9800905). PMID:16155195 identified
    R704C among eleven unrelated probands carrying COL2A1
    arginine-to-cysteine substitutions but does not state how many of the eleven
    carried R704C, so no cumulative case count is asserted here.

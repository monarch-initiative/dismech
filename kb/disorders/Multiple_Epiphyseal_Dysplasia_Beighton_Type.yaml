    snippet: >-
      In this report we discuss a South African family in which four members
      have a phenotype resembling Stickler syndrome type 1.
    explanation: Gives the size of the molecularly characterized kindred.
diagnosis:
- name: COL2A1 Sequencing
  description: >-
    The diagnosis in the index kindred was established by sequencing the exons of
    COL2A1, which found the exon 39 arginine-to-cysteine allele. Because each of
    the three defining manifestations is individually non-specific — a mild
    epiphyseal dysplasia, myopia with cataract, conductive deafness — molecular
    analysis of COL2A1 is what separates this entity from the COMP, MATN3, COL9A1-3
    and SLC26A2 forms of multiple epiphyseal dysplasia, in none of which COL2A1 is
    involved.
  diagnosis_term:
    preferred_term: Molecular Analysis
    term:
      id: NCIT:C19770
      label: Molecular Analysis
  evidence:
  - reference: PMID:9800905
    reference_title: "Stickler-like syndrome due to a dominant negative mutation in the COL2A1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DNA analysis of the exons of the COL2A1 gene documented a C-T transversion
      in exon 39, resulting in an Arg704Cys substitution in the triple helical
      domain of the type II collagen peptide
    explanation: >-
      Records the molecular test that established the diagnosis in the index
      kindred, and the exon it was found in.
- name: Genotype-Directed Placement Within the COL2A1 Arginine-to-Cysteine Series
  description: >-
    The COL2A1 arginine-to-cysteine alleles each give a fairly constant,
    site-specific phenotype, so placement within the series is made on the variant
    rather than on the clinical picture. R704C carriers were described as having
    Stickler dysplasia with brachydactyly; R365C gives classic Stickler dysplasia
    and R789C gives spondyloepiphyseal dysplasia congenita, while R75C, R519C and
    R1076C give spondyloarthropathy with normal stature and no ocular involvement.
    A carrier presenting with the skeletal-ocular-auditory combination but a
    different arginine-to-cysteine allele is therefore a different entity, not a
    variant of this one.
  diagnosis_term:
    preferred_term: Diagnostic Procedure
    term:
      id: NCIT:C18020
      label: Diagnostic Procedure
  evidence:
  - reference: PMID:16155195
    reference_title: "The phenotypic spectrum in patients with arginine to cysteine mutations in the COL2A1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each mutation resulted in a rather constant and site-specific phenotype, but
      a perinatally lethal disorder was never observed.
    explanation: >-
      States that the phenotype tracks the specific arginine-to-cysteine
      substitution, which is what makes genotype the discriminator.
  - reference: PMID:16155195
    reference_title: "The phenotypic spectrum in patients with arginine to cysteine mutations in the COL2A1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Stickler dysplasia with brachydactyly was observed in patients with the
      R704C mutation.
    explanation: >-
      Gives the phenotype assigned to this entry's allele in an independently
      ascertained cohort.
treatments:
- name: Routine Ophthalmological Surveillance
  description: >-
    Scheduled review by an ophthalmologist, which the type II collagen disorder
    best-practice guidelines recommend for the disorder class this entity belongs
    to. The rationale that applies here is that the guideline panel records
    retinal detachment as common across type II collagen disorders, and this
    disorder's ocular component is progressive myopia with retinal thinning and
    cataract.
  treatment_term:
    preferred_term: routine ophthalmological monitoring
    term:
      id: NCIT:C38060
      label: Eye Examination
  notes: >-
    Group-level guidance, not disease-specific. The guideline addresses type II
    collagen disorders as a class and says nothing about `p.Arg704Cys`; no
    EDMMD-specific ophthalmic management study exists, which is why the evidence
    is graded `INDIRECT` and `OTHER`. No `target_mechanisms` is declared:
    surveillance detects a complication rather than acting on a mechanism node.
  evidence:
  - reference: PMID:30696995
    reference_title: "Best practice guidelines regarding diagnosis and management of patients with type II collagen disorders."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Routine monitoring by an ophthalmologist is recommended
    explanation: >-
      The consensus recommendation for type II collagen disorders. INDIRECT
      because it is issued for the disorder class, and this entity is a member of
      that class by virtue of its COL2A1 allele rather than by being named in the
      guideline.
  - reference: PMID:30696995
    reference_title: "Best practice guidelines regarding diagnosis and management of patients with type II collagen disorders."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: OTHER
    snippet: >-
      Retinal detachment is common in type II collagen disorders
    explanation: >-
      The complication the surveillance is for. INDIRECT for the same reason, and
      note that no cited source reports retinal detachment in this entry's own
      kindred.
- name: Routine Audiological Surveillance
  description: >-
    Scheduled hearing assessment, recommended by the same guidelines for type II
    collagen disorders. Conductive deafness is one of the three defining
    components of this disorder, so the class-level recommendation is directly
    applicable in practice even though it was not written for this entity.
  treatment_term:
    preferred_term: routine audiological monitoring
    term:
      id: NCIT:C38036

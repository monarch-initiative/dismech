notes: >-
  Eight things about this entry are deliberate.

  First, **the allele numbering.** Every study that reports this substitution
  writes it R704C, and the same laboratory series that reports it numbers the
  Czech dysplasia allele R75C — that is, mature triple-helical-domain numbering,
  not the precursor numbering under which the Czech allele is written R275C. The
  entry therefore keeps the published form, `p.Arg704Cys`, and does not assert a
  precursor-numbering equivalent, which none of the cached sources states.

  Second, **the evidence base is one kindred plus one replication series, and
  the entry does not disguise that.** PMID:699354 describes the Afrikaner
  kindred clinically; PMID:9800905 reports the COL2A1 genotype in four affected
  members of that same family; PMID:16155195 independently found R704C in a
  separate laboratory's arginine-to-cysteine cohort and describes those carriers
  as having "Stickler dysplasia with brachydactyly", which is the same
  combination. Phenotype records therefore carry no `frequency` band: the
  denominator available is a handful of individuals in one family, not a series
  from which a population frequency could be read.

  Third, **the negative in-vitro results are curated as content, not omitted.**
  PMID:29439465 tested R704C alongside R740C and R789C and found that only the
  latter two are retained in the ER, splice XBP-1, and kill the expressing cell.
  That is what separates this disorder mechanistically both from the C-terminal
  COL2A1 dysplasias and from the COMP/MATN3 forms of multiple epiphyseal
  dysplasia, whose shared mechanism is precisely mutant-protein retention and ER
  stress. The `Preserved Chondrocyte Proteostasis` node exists to carry that
  finding and deliberately has no `downstream` edge, because a preserved process
  does not cause anything.

  Fourth, **"Beighton type" is an ambiguous eponym and is a live confusion
  hazard.** It also names *spondyloepimetaphyseal dysplasia with joint laxity
  type 1* (SEMD-JL1, OMIM 271640, biallelic B3GALT6) — a severe, unrelated
  recessive linkeropathy — and, separately, the Beighton *score* for joint
  hypermobility, which is what makes `Familial_Vesicoureteral_Reflux` and
  `Spondylodysplastic_Ehlers-Danlos_Syndrome` match a text search for this
  disease. A Falcon/Edison deep-research run against the entry name alone
  returned a full report on SEMD-JL1 and never mentioned COL2A1;
  `just preflight-dr` caught it (`B3GALT6=28, COL2A1=0`) and the report was
  discarded rather than mined. Anything sourced by disease name for this entry
  needs the OMIM number or the gene attached — and doing that fixes it. The
  committed report, `research/Multiple_Epiphyseal_Dysplasia_Beighton_Type-deep-research-falcon.md`,
  is a re-run whose `disease_name` variable was replaced with "Epiphyseal
  dysplasia multiple with myopia and conductive deafness, EDMMD, OMIM 132450,
  also called Stickler dysplasia with brachydactyly, caused by the heterozygous
  COL2A1 arginine-to-cysteine substitution p.Arg704Cys in exon 39". That run
  `PASS`es `preflight-dr` (`COL2A1=40`, report OMIM 132450 matching MONDO's
  132450, `B3GALT6=0`), so the confusion is a query problem rather than a gap in
  the provider's index. Two cautions for anyone mining it. Its reference
  validation leaves one identifier unresolved, `DOI:10.1002/(sici)1096-8628(19981102)80:1`,
  which is a truncation of the 1998 Ballo paper already cited here as
  PMID:9800905 rather than a fabrication; and its term validation flags
  `GO:0062023` as obsolete, replaced by `GO:0031012`, so that CURIE must not be
  bound. The `MONDO:0007562` label mismatch it reports is an artifact of the
  template's literal "(if available)" text, not a report error. Most of the
  report's disease-specific content is drawn from full-text pages of PMID:9800905
  and PMID:16155195, which are cached here as abstracts only, so it could not be
  quoted; what it did contribute is the type II collagen disorder management
  guideline behind this entry's `treatments` section, and confirmation that no
  R704C-specific treatment or trial evidence exists.

  Fifth, **the entry is separate from `Multiple_Epiphyseal_Dysplasia`, not a
  subtype of it.** That entry curates the COMP / MATN3 / COL9A1-3 / SLC26A2 /
  CANT1 forms and its two mechanism nodes are mutant-cartilage-protein
  misfolding with ER retention and SLC26A2 sulfate-transport failure; COL2A1 is
  not among its genes and neither mechanism applies here. The disorder belongs to
  the type II collagenopathy allelic series instead, alongside the entries
  collected by the `Type_2_Collagenopathies` grouping. Adding it as a member of
  that grouping is a natural follow-up and is deliberately left out of this
  entry's pull request so the grouping change can be reviewed on its own.

  Sixth, **the GeneReviews chapter is tagged but not mined.**
  `PMID:31021589`, *Type II Collagen Disorders Overview* (Gregersen & Savarirayan,
  2019, updated 2024), is the applicable GeneReviews chapter for a COL2A1 type II
  collagenopathy and is listed in `references` with a `GeneReviews` tag. It
  carries no evidence item: the cached record is the chapter's five-line scope
  statement — "The purpose of this GeneReview is to..." — with no clinical
  characteristics, management or genetic counselling text, so there is nothing in
  it that substantively supports a claim, and inventing a snippet from a scope
  statement would be worse than citing nothing. `PMID:20301479` *Stickler
  Syndrome* is a chapter for a different disorder and is not cited, even though
  PMID:16155195 describes R704C carriers as having "Stickler dysplasia with
  brachydactyly".

  Seventh, **the `treatments` section is entirely group-level and is graded that
  way.** No management study exists for this disorder or for `p.Arg704Cys`. None
  of the five originally cited sources discusses management at all — the only
  occurrences of the word "treatment" in any of them are laboratory protease
  treatments in the recombinant study — and the GeneReviews chapter's cached
  record stops at its scope statement. What is available is the Skeletal
  Dysplasia Management Consortium's best-practice guideline for type II collagen
  disorders as a class (PMID:30696995), whose ophthalmic and audiological
  surveillance recommendations apply to this entity by virtue of its COL2A1
  allele rather than by naming it. Both treatment records therefore carry
  `directness: INDIRECT` and `evidence_source: OTHER` — the guideline is expert
  consensus, not a study — and say so in their own `notes`. Nothing about
  prophylactic retinopexy is curated: the retinal-detachment prophylaxis
  literature is Stickler-syndrome-specific, no cited source reports retinal
  detachment in this kindred, and importing it would assert a risk this entry
  cannot evidence. The `diagnosis` section, by contrast, is disease-specific:
  the index kindred was resolved by sequencing the COL2A1 exons, and the
  arginine-to-cysteine series is separated by genotype rather than by clinical
  picture.

  Eighth, **`classifications` carries only the Harrison's part, and the OMIM and
  Orphanet identifiers are `external_assertions` rather than `mappings`.** No
  `isds_skeletal_category` is asserted: the sibling COL2A1 entries cite the ISDS
  nosology's own group listing for their assignment, and neither cached nosology
  paper (`PMID:31633310`, `PMID:36779427`) names this entity, so which group it
  falls in could not be verified. `DiseaseMappings` has slots only for ICD-10-CM,
  ICD-11, MONDO and NCIT, so there is no `mappings` slot that could hold OMIM
  132450 or ORPHA 166011; both are recorded as `external_assertions` instead,
  taken from the cross-references on MONDO:0007562.

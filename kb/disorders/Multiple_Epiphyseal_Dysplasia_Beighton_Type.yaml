genetic:
- name: COL2A1
  gene_term:
    preferred_term: COL2A1
    term:
      id: hgnc:2200
      label: COL2A1
  relationship_type: CAUSATIVE
  association: Heterozygous p.Arg704Cys substitution in the triple-helical domain
  variant_origin: GERMLINE
  notes: >-
    Every molecularly characterized case reported to date carries the same
    arginine-to-cysteine substitution at position 704 of the triple-helical
    domain of the alpha-1(II) chain, first found in the index Afrikaner kindred
    and subsequently in unrelated probands screened for COL2A1
    arginine-to-cysteine variants. The allele's zygosity, allele type and
    functional-impact classification are curated on the
    `COL2A1 p.Arg704Cys Substitution in the Triple-Helical Domain`
    pathophysiology node, which carries the `genetic_context` block.
  evidence:
  - reference: PMID:9800905
    reference_title: "Stickler-like syndrome due to a dominant negative mutation in the COL2A1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DNA analysis of the exons of the COL2A1 gene documented a C-T transversion
      in exon 39, resulting in an Arg704Cys substitution in the triple helical
      domain of the type II collagen peptide
    explanation: >-
      The molecular finding in the index kindred, reported by the authors as a
      dominant-negative COL2A1 allele.
  - reference: PMID:16155195
    reference_title: "The phenotypic spectrum in patients with arginine to cysteine mutations in the COL2A1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Stickler dysplasia with brachydactyly was observed in patients with the
      R704C mutation.
    explanation: >-
      Independent genotype-phenotype correlation for the same allele, in probands
      ascertained outside the index family.
  - reference: PMID:16155195
    reference_title: "The phenotypic spectrum in patients with arginine to cysteine mutations in the COL2A1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each mutation resulted in a rather constant and site-specific phenotype,
      but a perinatally lethal disorder was never observed.
    explanation: >-
      Supports treating the R704C phenotype as an allele-specific, non-lethal
      entity rather than a point on a continuous severity gradient.
prevalence:
- population: Reported cases worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Four affected members of one South African Afrikaner kindred are the
    molecularly characterized cases (PMID:9800905). PMID:16155195 identified
    R704C among eleven unrelated probands carrying COL2A1
    arginine-to-cysteine substitutions but does not state how many of the eleven
    carried R704C, so no cumulative case count is asserted here.
  evidence:
  - reference: PMID:9800905
    reference_title: "Stickler-like syndrome due to a dominant negative mutation in the COL2A1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In this report we discuss a South African family in which four members
      have a phenotype resembling Stickler syndrome type 1.
    explanation: Gives the size of the molecularly characterized kindred.
discussions:
- discussion_id: gap_edmmd_conductive_deafness_substrate
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which middle-ear structure carries the conductive component of the hearing
    loss in COL2A1 p.Arg704Cys carriers?
  rationale: >-
    Conductive deafness is one of the three features that define this disorder
    and is what separates it clinically from the other COL2A1
    arginine-to-cysteine phenotypes, yet neither of the two reports on the index
    kindred describes an otological examination that localizes the lesion — to
    the ossicular chain, the tympanic membrane, the middle-ear space, or
    otitis-media-related effusion. Type II collagen is present in cartilaginous
    structures of the ear, so an ossicular or eustachian-tube substrate is
    plausible, but the entry curates the edge with unknown intermediates because
    nothing in the cited literature distinguishes among these possibilities.
  attaches_to:
  - phenotypes#Conductive hearing impairment
  - pathophysiology#Extracellular Interference with the Type II Collagen Network
- discussion_id: gap_edmmd_extracellular_lesion_unmeasured
  kind: KNOWLEDGE_GAP
  prompt: >-
    What does the type II collagen fibril network actually look like in tissue
    from an R704C carrier?
  rationale: >-
    The extracellular-interference mechanism for this allele rests on an
    inference the recombinant study draws from negative intracellular results —
    the R704C protein folds, is secreted, and provokes no unfolded protein
    response, so the authors reason the disease must act after secretion. No
    cited source reports fibril ultrastructure, matrix composition, or
    biomechanics in cartilage or vitreous from a carrier, which is why the
    `Extracellular Interference with the Type II Collagen Network` node is
    curated as HYPOTHETICAL. The same gap is recorded for the sibling allele
    R275C in the Czech dysplasia entry, and a single study of
    arginine-to-cysteine COL2A1 carrier tissue would address both.
  attaches_to:
  - pathophysiology#Extracellular Interference with the Type II Collagen Network

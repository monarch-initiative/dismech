pathophysiology:
- name: COL2A1 p.Arg704Cys Substitution in the Triple-Helical Domain
  biological_scale: MOLECULAR
  description: >-
    A heterozygous C-to-T change in exon 39 of COL2A1 replaces an arginine with a
    cysteine at position 704 of the triple-helical domain of the pro-alpha-1(II)
    chain. The substituted arginine sits at an X or Y position of a Gly-X-Y
    repeat rather than at the obligate glycine, which is the position mutated in
    the severe, often perinatally lethal type II collagenopathies.
  genes:
  - preferred_term: COL2A1
    term:
      id: hgnc:2200
      label: COL2A1
  genetic_context:
    gene:
      preferred_term: COL2A1
      term:
        id: hgnc:2200
        label: COL2A1
    allele_type: MISSENSE
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
    description: >-
      A heterozygous germline missense allele in a structural collagen chain.
      Curated as dominant-negative rather than loss-of-function because the
      mutant chain is secreted and incorporated into the trimer rather than being
      degraded, so the proposed mechanism is interference by the mutant chain
      with the network the wild-type chains build.
  molecular_functions:
  - preferred_term: extracellular matrix structural constituent
    term:
      id: GO:0005201
      label: extracellular matrix structural constituent
    modifier: ABNORMAL
  evidence:
  - reference: PMID:9800905
    reference_title: "Stickler-like syndrome due to a dominant negative mutation in the COL2A1 gene."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DNA analysis of the exons of the COL2A1 gene documented a C-T transversion
      in exon 39, resulting in an Arg704Cys substitution in the triple helical
      domain of the type II collagen peptide
    explanation: >-
      Identifies the causal allele and locates it precisely in exon 39 and in the
      triple-helical domain of the alpha-1(II) chain.
  - reference: PMID:16155195
    reference_title: "The phenotypic spectrum in patients with arginine to cysteine mutations in the COL2A1 gene."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Six different mutations (R75C, R365C, R519C, R704C, R789C, R1076C) were
      found in 11 unrelated probands.
    explanation: >-
      Independent ascertainment of the R704C allele outside the index kindred, in
      a laboratory series of COL2A1 arginine-to-cysteine probands.
  downstream:
  - target: Secreted, Correctly Folded Mutant Type II Collagen Heterotrimer
    description: >-
      The substituted chain is not degraded or retained: it assembles into a
      thermally stable, protease-resistant triple helix and leaves the cell,
      which is what makes an extracellular rather than an intracellular disease
      mechanism the plausible one for this allele.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29439465
      reference_title: "Impact of Arginine to Cysteine Mutations in Collagen II on Protein Secretion and Cell Survival."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        Substitutions R75C, R134C and R704C did not alter the thermal stability
        with respect to wild type
      explanation: >-
        Recombinant R704C collagen II retains wild-type thermal stability, unlike
        the C-terminal R740C and R789C substitutions tested alongside it.
  - target: Preserved Chondrocyte Proteostasis
    description: >-
      Because the mutant chain folds and is exported normally, the misfolded
      protein burden that drives the endoplasmic-reticulum stress mechanism of
      the other epiphyseal dysplasias never accumulates.
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29439465
      reference_title: "Impact of Arginine to Cysteine Mutations in Collagen II on Protein Secretion and Cell Survival."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: >-
        WT, R75C, R134C and R704C collagen II proteins co-localized mainly with
        the perinuclear Golgi apparatus, demonstrating that the intracellular
        trafficking of these proteins from ER to Golgi apparatus is not affected
        by the mutation
      explanation: >-
        Directly shows normal ER-to-Golgi trafficking for the R704C protein, the
        step whose failure produces ER retention in the severe alleles.
- name: Secreted, Correctly Folded Mutant Type II Collagen Heterotrimer
  biological_scale: MOLECULAR
  description: >-
    Type II collagen is a homotrimer of three alpha-1(II) chains, so in a
    heterozygote roughly seven of every eight molecules incorporate at least one
    mutant chain. Recombinant R704C collagen II is trypsin-resistant, gives a
    normal collagen circular-dichroism spectrum, and is recovered mainly from the
    culture supernatant, so the mutant chain reaches the extracellular space
    carrying an unpaired cysteine that the wild-type sequence does not have.
  cellular_components:
  - preferred_term: collagen trimer
    term:
      id: GO:0005581
      label: collagen trimer
    modifier: ABNORMAL
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  evidence:
  - reference: PMID:29439465
    reference_title: "Impact of Arginine to Cysteine Mutations in Collagen II on Protein Secretion and Cell Survival."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      WT, R75C, R134C and R704C collagens were trypsin resistant, while R740C and
      R789C collagens were completely degraded
    explanation: >-
      Protease resistance establishes that the R704C chain forms a correctly
      aligned, stable triple helix, in contrast to the C-terminal substitutions.
  downstream:
  - target: Extracellular Interference with the Type II Collagen Network
    description: >-
      A structurally competent but chemically altered alpha-1(II) chain, carrying
      an extra cysteine thiol in the helix, is built into the fibrillar network of
      every tissue in which type II collagen is load-bearing.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:29439465
      reference_title: "Impact of Arginine to Cysteine Mutations in Collagen II on Protein Secretion and Cell Survival."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: >-
        even the rather C-terminal R704C and also the N-terminal R75C mutation
        neither induce ER stress nor apoptosis and might cause a disease
        predominantly via extracellular interference
      explanation: >-
        The authors' own reading of their negative intracellular results. Curated
        as INDIRECT because it is an inference the authors draw from what R704C
        does not do, not a measurement of the extracellular fibril.
- name: Preserved Chondrocyte Proteostasis
  biological_scale: CELLULAR
  description: >-
    Cells expressing R704C collagen II show no splicing of XBP-1 and no activated
    caspase-3, meaning neither the unfolded protein response nor apoptosis is
    engaged. This is the mechanistic point on which the disorder separates from
    both the C-terminal COL2A1 dysplasias and the COMP- and MATN3-related forms
    of multiple epiphyseal dysplasia, in all of which mutant cartilage protein is
    retained in the endoplasmic reticulum and the resulting stress response is
    the proximate cause of chondrocyte dysfunction.
  biological_processes:
  - preferred_term: response to unfolded protein
    term:
      id: GO:0006986
      label: response to unfolded protein
  cell_types:
  - preferred_term: chondrocyte
    term:
      id: CL:0000138
      label: chondrocyte
  notes: >-
    This node deliberately carries no `downstream` edge. It records a process
    that is *not* perturbed, which is a substantive mechanistic finding for this
    allele but cannot be a cause of any consequence node.
  evidence:
  - reference: PMID:29439465
    reference_title: "Impact of Arginine to Cysteine Mutations in Collagen II on Protein Secretion and Cell Survival."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      In cells expressing WT, R75C, R134C and R704C collagen, only the unspliced
      form of XBP-1 was detected
    explanation: >-
      Absence of XBP-1 splicing is the direct readout that the IRE1 arm of the
      unfolded protein response is not activated by the R704C protein.
  - reference: PMID:29439465
    reference_title: "Impact of Arginine to Cysteine Mutations in Collagen II on Protein Secretion and Cell Survival."
    supports: SUPPORT
    directness: DIRECT
    evidence_source: IN_VITRO
    snippet: >-
      In non-transfected cells or cells expressing WT, R75C, R134C and R704C
      collagens, no active caspase-3 staining could be detected
    explanation: >-
      Shows that R704C expression does not trigger the apoptotic execution
      caspase, unlike the ER-retained R740C and R789C proteins.
- name: Extracellular Interference with the Type II Collagen Network
  biological_scale: TISSUE
  description: >-
    The proposed proximate lesion of this disorder: a mutant alpha-1(II) chain
    incorporated into the secreted fibrillar network degrades the mechanical and
    optical properties of the matrices that network builds. The tissue
    distribution of the clinical syndrome follows the tissues in which type II
    collagen is the principal fibrillar constituent — epiphyseal and growth-plate
    hyaline cartilage, the vitreous body, and the cartilaginous structures of the
    ear.
  mechanism_confidence: HYPOTHETICAL
  biological_processes:
  - preferred_term: collagen fibril organization
    term:
      id: GO:0030199
      label: collagen fibril organization
    modifier: ABNORMAL
  - preferred_term: extracellular matrix organization
    term:
      id: GO:0030198
      label: extracellular matrix organization
    modifier: ABNORMAL
  notes: >-
    Curated `HYPOTHETICAL` because no cited source reports the state of the
    collagen fibril or the matrix in tissue from an R704C carrier. What is
    measured is upstream (the recombinant protein behaves normally
    intracellularly) and downstream (the clinical phenotype); the extracellular
    step between them is the authors' inference.
  evidence:
  - reference: PMID:26443184
    reference_title: "Mutation Update for COL2A1 Gene Variants Associated with Type II Collagenopathies."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Mutations in the COL2A1 gene cause a spectrum of rare autosomal-dominant
      conditions characterized by skeletal dysplasia, short stature, and
      sensorial defects.
    explanation: >-
      Establishes that COL2A1 variants act through the collagen the gene encodes
      to produce combined skeletal and sensory disease, the pattern seen here.
      INDIRECT because it is a statement about the gene's disorders as a class,
      not about this allele's fibril.
  downstream:
  - target: Abnormal Epiphyseal Cartilage and Endochondral Ossification
    description: >-
      Type II collagen is the load-bearing fibrillar protein of the epiphyseal
      and growth-plate hyaline cartilage in which endochondral ossification takes
      place.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:9800905
      reference_title: "Stickler-like syndrome due to a dominant negative mutation in the COL2A1 gene."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Ocular problems and conductive deafness predominate, while skeletal
        changes resemble those of a mild form of multiple epiphyseal dysplasia
        (MED).
      explanation: >-
        Ties the COL2A1 genotype reported in the same paper to an epiphyseal
        skeletal phenotype. INDIRECT because it is a clinical correlation, not a
        demonstration of the cartilage lesion.
  - target: Abnormal Vitreous and Retinal Collagen Matrix
    description: >-
      Type II collagen is the principal fibrillar collagen of the vitreous body,
      and vitreoretinal disease is the shared ocular signature of the milder
      COL2A1 disorders.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:9800905
      reference_title: "Stickler-like syndrome due to a dominant negative mutation in the COL2A1 gene."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In this report we discuss a South African family in which four members
        have a phenotype resembling Stickler syndrome type 1.
      explanation: >-
        Places the ocular phenotype of the R704C kindred within the
        vitreoretinopathy pattern of COL2A1 disease. INDIRECT because it is a
        clinical resemblance rather than a vitreous-matrix measurement.
  - target: Conductive hearing impairment
    description: >-
      Conductive deafness is one of the three defining components of the
      syndrome, and is curated as an outcome of the same collagen-network lesion.
      The middle-ear substrate is not established by any cited source, so the
      edge is typed as having unknown intermediates.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:699354
      reference_title: "Dominant inheritance of multiple epiphyseal dysplasia, myopia and deafness."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Progressive myopia, retinal thinning and crenated cataracts led to visual
        disturbance, while conductive deafness represented the third component of
        the triad.
      explanation: >-
        Establishes conductive deafness as a constant component of the syndrome
        caused by this allele. INDIRECT because it does not identify the
        middle-ear structure through which the collagen defect acts.

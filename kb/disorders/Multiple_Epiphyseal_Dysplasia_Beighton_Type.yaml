discussions:
- discussion_id: gap_edmmd_conductive_deafness_substrate
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which middle-ear structure carries the conductive component of the hearing
    loss in COL2A1 p.Arg704Cys carriers?
  rationale: >-
    Conductive deafness is one of the three features that define this disorder
    and is what separates it clinically from the other COL2A1
    arginine-to-cysteine phenotypes, yet neither of the two reports on the index
    kindred describes an otological examination that localizes the lesion — to
    the ossicular chain, the tympanic membrane, the middle-ear space, or
    otitis-media-related effusion. Type II collagen is present in cartilaginous
    structures of the ear, so an ossicular or eustachian-tube substrate is
    plausible, but the entry curates the edge with unknown intermediates because
    nothing in the cited literature distinguishes among these possibilities.
  attaches_to:
  - phenotypes#Conductive hearing impairment
  - pathophysiology#Extracellular Interference with the Type II Collagen Network
- discussion_id: gap_edmmd_extracellular_lesion_unmeasured
  kind: KNOWLEDGE_GAP
  prompt: >-
    What does the type II collagen fibril network actually look like in tissue
    from an R704C carrier?
  rationale: >-
    The extracellular-interference mechanism for this allele rests on an
    inference the recombinant study draws from negative intracellular results —
    the R704C protein folds, is secreted, and provokes no unfolded protein
    response, so the authors reason the disease must act after secretion. No
    cited source reports fibril ultrastructure, matrix composition, or
    biomechanics in cartilage or vitreous from a carrier, which is why the
    `Extracellular Interference with the Type II Collagen Network` node is
    curated as HYPOTHETICAL. The same gap is recorded for the sibling allele
    R275C in the Czech dysplasia entry, and a single study of
    arginine-to-cysteine COL2A1 carrier tissue would address both.
  attaches_to:
  - pathophysiology#Extracellular Interference with the Type II Collagen Network

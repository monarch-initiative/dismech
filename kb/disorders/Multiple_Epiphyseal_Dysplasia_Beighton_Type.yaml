genetic:
- name: COL2A1
  gene_term:
    preferred_term: COL2A1
    term:
      id: hgnc:2200
      label: COL2A1
  relationship_type: CAUSATIVE
  association: Heterozygous p.Arg704Cys substitution in the triple-helical domain
  variant_origin: GERMLINE
  notes: >-
    Every molecularly characterized case reported to date carries the same
    arginine-to-cysteine substitution at position 704 of the triple-helical
    domain of the alpha-1(II) chain, first found in the index Afrikaner kindred
    and subsequently in unrelated probands screened for COL2A1
    arginine-to-cysteine variants. The allele's zygosity, allele type and
    functional-impact classification are curated on the
    `COL2A1 p.Arg704Cys Substitution in the Triple-Helical Domain`
    pathophysiology node, which carries the `genetic_context` block.
  evidence:
  - reference: PMID:9800905
    reference_title: "Stickler-like syndrome due to a dominant negative mutation in the COL2A1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DNA analysis of the exons of the COL2A1 gene documented a C-T transversion
      in exon 39, resulting in an Arg704Cys substitution in the triple helical
      domain of the type II collagen peptide
    explanation: >-
      The molecular finding in the index kindred, reported by the authors as a
      dominant-negative COL2A1 allele.
  - reference: PMID:16155195
    reference_title: "The phenotypic spectrum in patients with arginine to cysteine mutations in the COL2A1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Stickler dysplasia with brachydactyly was observed in patients with the
      R704C mutation.
    explanation: >-
      Independent genotype-phenotype correlation for the same allele, in probands
      ascertained outside the index family.
  - reference: PMID:16155195
    reference_title: "The phenotypic spectrum in patients with arginine to cysteine mutations in the COL2A1 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Each mutation resulted in a rather constant and site-specific phenotype,
      but a perinatally lethal disorder was never observed.
    explanation: >-
      Supports treating the R704C phenotype as an allele-specific, non-lethal
      entity rather than a point on a continuous severity gradient.

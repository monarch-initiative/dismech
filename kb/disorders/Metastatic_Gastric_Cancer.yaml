datasets:
- accession: ega:EGAS00001005588
  title: RNA-sequencing of tumors from 45 patients with recurrent or metastatic gastric cancer treated with immune checkpoint inhibitors
  description: Genomic profiling can provide prognostic and predictive information to guide clinical care. Biomarkers that reliably predict patient response to chemotherapy and immune checkpoint inhibition in gastric cancer are lacking. In this work, we used our machine learning algorithm NTriPath to identify a gastric-cancer specific 32-gene signature. Using unsupervised clustering on expression levels of these 32 genes in tumors from 567 patients, we identified four molecular subtypes that were prognostic for survival.
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  notes: 'European Genome-phenome Archive study, matched because the disease is named in the study''s own title ("Metastatic Gastric Cancer"); description-level mentions were not accepted. EGA study_type: Other. Controlled access -- data require a Data Access Agreement. EGA metadata retrieved 2026-08-01.'
- accession: massive:MSV000098357
  title: Proteomic Profiling of Serum Exosomes from Patients with Metastatic Gastric Cancer
  description: Clinical management of metastatic gastric cancer (mGC) remains a major challenge due to a lack of specific biomarkers and effective therapeutic targets. Recently, accumulating evidence has suggested that exosomes play an essential role in cancer metastasis and can be an excellent reservoir of novel biomarkers and candidate therapeutic targets for cancer. Therefore, in this study, we aimed to reveal the proteomic profile of mGC-derived exosomes.Exosomes were isolated from pooled serum samples of 20 mGC patients and 40 healthy controls (HCs) by ultracentrifugation.
  notes: Located via OmicsDI, which aggregates across omics repositories; this record comes from massive. Only repositories with no other discovery route in this project and with a working accession resolver are curated from OmicsDI -- GEO, ArrayExpress, PRIDE, MetaboLights and EGA hits are excluded as duplicates of dedicated passes. Matched because the disease is named in the dataset's own title ("Metastatic Gastric Cancer"). Retrieved 2026-08-02.

pathophysiology:
- name: Helicobacter pylori Chronic Active Gastritis
  description: >-
    Persistent colonisation of the gastric mucosa by Helicobacter pylori establishes a
    non-resolving active gastritis that the host inflammatory response cannot clear.
    This is the initiating step of the carcinogenic sequence that produces the primary
    tumour from which the metastatic disease modeled in this entry arises; the full
    cascade is curated in Gastric_Adenocarcinoma.
  biological_scale: TISSUE
  role: trigger
  cell_types:
  - preferred_term: gastric epithelial cell
    term:
      id: CL:0002178
      label: epithelial cell of stomach
  locations:
  - preferred_term: gastric mucosa
    term:
      id: UBERON:0001199
      label: mucosa of stomach
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  downstream:
  - target: Gastric Carcinogenesis Substrate
    causal_link_type: DIRECT
    description: >-
      Chronic active gastritis is the first stage of the multistep sequence that
      constitutes the carcinogenic substrate node.
    evidence:
    - reference: PMID:1458460
      reference_title: "Human gastric carcinogenesis: a multistep and multifactorial process--First American Cancer Society Award Lecture on Cancer Epidemiology and Prevention."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Evidence from pathology and epidemiology studies has been provided for a human model of gastric carcinogenesis with the following sequential stages: chronic gastritis; atrophy; intestinal metaplasia; and dysplasia."
      explanation: Places chronic gastritis as the first stage of the staged sequence that the downstream substrate node models.
  evidence:
  - reference: PMID:1458460
    reference_title: "Human gastric carcinogenesis: a multistep and multifactorial process--First American Cancer Society Award Lecture on Cancer Epidemiology and Prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: The initial stages of gastritis and atrophy have been linked to excessive salt intake and infection with Helicobacter pylori.
    explanation: Correa places H. pylori infection at the initiating gastritis stage of the carcinogenic cascade, which is the process this node models.
  - reference: PMID:36483973
    reference_title: "Influence of Helicobacter pylori oncoprotein CagA in gastric cancer: A critical-reflective analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Helicobacter pylori is a Gram-negative bacterium that inhabits the gastric environment of 60.3% of the world's population and represents the main risk factor for the onset of gastric neoplasms.
    explanation: Establishes H. pylori as the principal risk factor for gastric neoplasia and the scale of the exposed population.
- name: Gastric Carcinogenesis Substrate
  description: >-
    Metastatic gastric cancer arises from a primary gastric adenocarcinoma that
    develops through the multistep Correa cascade of chronic gastritis, atrophy,
    intestinal metaplasia, and dysplasia. This node collapses the atrophy,
    intestinal metaplasia and dysplasia stages of that sequence into a single
    preinvasive substrate; each stage is modeled separately in Gastric_Adenocarcinoma.
    It precedes the invasive and metastatic biology modeled by the downstream nodes
    in this entry.
  biological_scale: TISSUE
  role: mediator
  locations:
  - preferred_term: gastric mucosa
    term:
      id: UBERON:0001199
      label: mucosa of stomach
  evidence:
  - reference: PMID:1458460
    reference_title: "Human gastric carcinogenesis: a multistep and multifactorial process--First American Cancer Society Award Lecture on Cancer Epidemiology and Prevention."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Evidence from pathology and epidemiology studies has been provided for a human model of gastric carcinogenesis with the following sequential stages: chronic gastritis; atrophy; intestinal metaplasia; and dysplasia."
    explanation: Establishes the multistep carcinogenic substrate (the Correa cascade) from which the primary gastric adenocarcinoma, and later the metastatic disease modeled in this entry, arises.
  downstream:
  - target: Intestinal-Type Invasive Adenocarcinoma
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Dysplastic epithelium breaches the basement membrane and becomes invasive
      carcinoma. The intervening step is the transition from high-grade dysplasia to
      invasion, which is not a separate node in this entry.
    evidence:
    - reference: PMID:1458460
      reference_title: "Human gastric carcinogenesis: a multistep and multifactorial process--First American Cancer Society Award Lecture on Cancer Epidemiology and Prevention."
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: "Evidence from pathology and epidemiology studies has been provided for a human model of gastric carcinogenesis with the following sequential stages: chronic gastritis; atrophy; intestinal metaplasia; and dysplasia."
      explanation: "Anchors the staged preinvasive sequence that leads into this edge. Support is PARTIAL: Correa's sequence terminates at dysplasia and does not itself assert the invasive-carcinoma endpoint."
  notes: >-
    The Correa cascade quoted above is the intestinal-type route, so this node's only
    downstream edge is into Intestinal-Type Invasive Adenocarcinoma. Diffuse-type
    gastric cancer arises via CDH1 E-cadherin loss without passing through atrophy and
    intestinal metaplasia, and is modeled here as the separate CDH1 Inactivation and
    E-cadherin Loss route; an edge from this node into that route would cross the two
    Lauren routes.
- name: Intestinal-Type Invasive Adenocarcinoma
  description: >-
    Gland-forming carcinoma that has breached the basement membrane and invades the
    lamina propria, submucosa and, in advanced disease, the muscularis propria and
    serosa. This is the terminal step of the Correa cascade and the primary tumour of
    the intestinal Lauren route, from which the disseminated disease modeled by the
    downstream nodes arises.
  biological_scale: TISSUE
  role: consequence
  cell_types:
  - preferred_term: glandular epithelial cell of stomach
    term:
      id: CL:0002659
      label: glandular epithelial cell of stomach
  locations:
  - preferred_term: stomach
    term:
      id: UBERON:0000945
      label: stomach
  downstream:
  - target: Peritoneal Dissemination
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Invasive carcinoma penetrates the gastric serosa and sheds cells into the
      peritoneal cavity. Serosal penetration and transcoelomic shedding are the known
      intervening steps and are not separate nodes in this entry.
    evidence:
    - reference: PMID:39023829
      reference_title: SEOM-GEMCAD-TTD clinical guideline for the diagnosis and treatment of gastric cancer (2023).
      supports: PARTIAL
      evidence_source: HUMAN_CLINICAL
      snippet: Peritoneal metastases are present in almost 20% of GC at
      explanation: "Quantifies peritoneal spread as already present in almost a fifth of gastric cancers at diagnosis. Support is PARTIAL: the guideline reports the frequency across gastric cancer as a whole and does not resolve it by Lauren type, so it supports the route rather than its intestinal-type share."
  evidence:
  - reference: PMID:1458460
    reference_title: "Human gastric carcinogenesis: a multistep and multifactorial process--First American Cancer Society Award Lecture on Cancer Epidemiology and Prevention."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "Evidence from pathology and epidemiology studies has been provided for a human model of gastric carcinogenesis with the following sequential stages: chronic gastritis; atrophy; intestinal metaplasia; and dysplasia."
    explanation: "Anchors the multistep human model leading up to this node. Support is PARTIAL because Correa's staged sequence terminates at dysplasia and does not itself assert the invasive-carcinoma endpoint."
  - reference: PMID:15668283
    reference_title: "Amplification of HER-2 in gastric carcinoma: association with Topoisomerase IIalpha gene amplification, intestinal type, poor prognosis and sensitivity to trastuzumab."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "HER-2/neu amplification is common in the intestinal type of gastric carcinoma, and it is associated with a poor outcome."
    explanation: "Confirms intestinal-type carcinoma as a distinct, clinically consequential histology in this disease. Support is PARTIAL: the finding is about HER2 enrichment within that histology, not about the invasive transition this node models."
- name: CDH1 Inactivation and E-cadherin Loss
  description: >-
    Biallelic inactivation of CDH1 abolishes E-cadherin, the adhesion molecule of the
    epithelial adherens junction. In hereditary diffuse gastric cancer the first hit is
    a germline truncating variant and the second is usually promoter hypermethylation or
    loss of heterozygosity; in sporadic diffuse cancer both hits are somatic. This is
    the initiating lesion of the diffuse Lauren route and is the carcinogenic event
    upstream of the invasion node it feeds.
  biological_scale: MOLECULAR
  role: trigger
  gene:
    preferred_term: CDH1
    term:
      id: hgnc:1748
      label: CDH1
  genes:
  - preferred_term: CDH1
    term:
      id: hgnc:1748
      label: CDH1
  biological_processes:
  - preferred_term: cell-cell adhesion
    modifier: DECREASED
    term:
      id: GO:0098609
      label: cell-cell adhesion
  cellular_components:
  - preferred_term: adherens junction
    term:
      id: GO:0005912
      label: adherens junction
  downstream:
  - target: E-Cadherin Loss and Diffuse Invasion
    causal_link_type: DIRECT
    description: >-
      Without E-cadherin the epithelial sheet loses junctional cohesion and cells
      detach and infiltrate individually.
    evidence:
    - reference: PMID:9537325
      reference_title: E-cadherin germline mutations in familial gastric cancer.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Diminished E-cadherin expression is associated with aggressive, poorly differentiated carcinomas.
      explanation: Ties reduced E-cadherin expression directly to the aggressive poorly differentiated phenotype that the downstream node models.
  evidence:
  - reference: PMID:9537325
    reference_title: E-cadherin germline mutations in familial gastric cancer.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Sequencing of the E-cadherin gene revealed a G --> T nucleotide substitution in the donor splice consensus sequence of exon 7, leading to a truncated gene product.
    explanation: The founding observation identifying a truncating germline E-cadherin (CDH1) variant as the cause of hereditary diffuse gastric cancer.
- name: E-Cadherin Loss and Diffuse Invasion
  description: >-
    Reduced E-cadherin expression weakens epithelial adhesion, promotes infiltrative
    growth, and facilitates lymphatic, perineural, and peritoneal dissemination,
    particularly in diffuse-type gastric cancer.
  evidence:
  - reference: PMID:41710815
    reference_title: "E-Cadherin Immunohistochemical Expression in Gastrointestinal Adenocarcinomas and Its Association With Histological and Prognostic Parameters."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Loss of E-cadherin expression in advanced tumor stages, higher nodal metastasis, and perineural invasion elucidate the role of E-cadherin as a useful prognostic immunohistochemical marker in gastrointestinal adenocarcinomas.
    explanation: This supports a direct relationship between E-cadherin loss and invasive metastatic behavior.
  biological_processes:
  - preferred_term: epithelial to mesenchymal transition
    modifier: INCREASED
    term:
      id: GO:0001837
      label: epithelial to mesenchymal transition
  - preferred_term: cell migration
    modifier: INCREASED
    term:
      id: GO:0016477
      label: cell migration
  downstream:
  - target: Peritoneal Dissemination
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Non-cohesive cells permeate the gastric wall and, on reaching the serosa, seed the
      peritoneal cavity - the characteristic route of spread for diffuse-type disease.
      Transmural infiltration and serosal penetration are the known intervening steps.
    evidence:
    - reference: PMID:34650801
      reference_title: Clinical significance of coexisting histological diffuse type in stage II/III gastric cancer.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: A pathological diagnosis of Sig was an independent risk factor for peritoneal recurrence in patients with stage II/III gastric cancer.
      explanation: Signet-ring histology, the morphological expression of E-cadherin loss, was an independent risk factor for peritoneal recurrence in a 968-patient resection cohort.
    - reference: PMID:34650801
      reference_title: Clinical significance of coexisting histological diffuse type in stage II/III gastric cancer.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Patients with diffuse type had peritoneal recurrence more frequently than patients with intestinal type, whereas intestinal type had more hepatic recurrence caused by venous infiltration than diffuse type.
      explanation: Contrasts the two Lauren routes directly, showing peritoneal recurrence to be the diffuse-type pattern that this edge asserts.
- name: Peritoneal Dissemination
  description: >-
    Peritoneal spread in gastric cancer is reinforced by interactions between tumor
    cells
    and peritoneal mesothelial cells, helping establish invasive implants, serosal
    disease,
    and malignant ascites.
  cell_types:
  - preferred_term: mesothelial cell
    term:
      id: CL:0000077
      label: mesothelial cell
  evidence:
  - reference: PMID:25088196
    reference_title: "Tks5 activation in mesothelial cells creates invasion front of peritoneal carcinomatosis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "The peritoneal dissemination of gastric cancer was significantly increased by mixing cancer cells and PMCs, and was suppressed by knockdown of Tks5 in PMCs."
    explanation: Model data supports a direct role for mesothelial cell interactions in establishing peritoneal gastric cancer implants.
  biological_processes:
  - preferred_term: positive regulation of cell migration
    modifier: INCREASED
    term:
      id: GO:0030335
      label: positive regulation of cell migration
  downstream:
  - target: Angiogenesis and Metastatic Outgrowth
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Implants seeded on the peritoneum and omentum depend on the surrounding stromal
      compartment for the angiogenic support that lets a deposit grow beyond a
      micrometastasis. Adipocyte-derived CXCL2 and tumour VEGFA induction are the known
      intervening steps.
    evidence:
    - reference: PMID:32439934
      reference_title: Omental adipocytes promote peritoneal metastasis of gastric cancer through the CXCL2-VEGFA axis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In an orthotopic tumour model using SCID mice, omentectomy suppressed GC growth and peritoneal dissemination, and reduced serum levels of CXCL2."
      explanation: Removing the omental stromal compartment suppressed both growth and peritoneal dissemination, supporting the dependence of seeded implants on stromal angiogenic support.
- name: HER2 Signaling Subset
  description: >-
    A clinically important gastric cancer subset that remains relevant in metastatic
    disease
    is driven by HER2 amplification and receptor tyrosine kinase signaling, particularly
    in intestinal-type tumors.
  evidence:
  - reference: PMID:15668283
    reference_title: "Amplification of HER-2 in gastric carcinoma: association with Topoisomerase IIalpha gene amplification, intestinal type, poor prognosis and sensitivity to trastuzumab."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "HER-2/neu amplification is common in the intestinal type of gastric carcinoma, and it is associated with a poor outcome."
    explanation: Human cohort data supports a clinically relevant HER2-amplified gastric cancer subset enriched in intestinal-type disease.
  biological_processes:
  - preferred_term: cell surface receptor protein tyrosine kinase signaling pathway
    modifier: INCREASED
    term:
      id: GO:0007169
      label: cell surface receptor protein tyrosine kinase signaling pathway
- name: MSI-High Immune-Responsive Subset
  description: >-
    MSI-high gastric cancers represent a minority of metastatic cases but have distinct
    mutational and immune biology with implications for checkpoint inhibitor sensitivity.
  evidence:
  - reference: PMID:37271124
    reference_title: "Performance of Immunohistochemical and Molecular Methods in Detecting Microsatellite Instability in Gastric Cancer: A Multicenter Study."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Microsatellite instability (MSI) is an important prognostic molecular biomarker for gastric cancer (GC).
    explanation: This supports MSI as a biologically and clinically important gastric cancer state.
  biological_processes:
  - preferred_term: mismatch repair
    modifier: DECREASED
    term:
      id: GO:0006298
      label: mismatch repair
- name: Angiogenesis and Metastatic Outgrowth
  description: >-
    Peritoneal and distant outgrowth is reinforced by angiogenic support and reciprocal
    signaling with stromal compartments such as omental adipocytes.
  evidence:
  - reference: PMID:32439934
    reference_title: "Omental adipocytes promote peritoneal metastasis of gastric cancer through the CXCL2-VEGFA axis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Conditioned media derived from OmAd (OmAd-CM) promoted the proliferation, migration and capacity to induce angiogenesis of GC cells through AKT phosphorylation and VEGFA overexpression, whereas silencing CXCL2 in OmAd cancelled OmAd-induced effects."
    explanation: Coculture data shows stromal adipocyte signals can promote angiogenesis and migratory behavior in gastric cancer cells.
  - reference: PMID:32439934
    reference_title: "Omental adipocytes promote peritoneal metastasis of gastric cancer through the CXCL2-VEGFA axis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In an orthotopic tumour model using SCID mice, omentectomy suppressed GC growth and peritoneal dissemination, and reduced serum levels of CXCL2."
    explanation: Orthotopic mouse data links omental stromal support to metastatic outgrowth and peritoneal dissemination.
  biological_processes:
  - preferred_term: angiogenesis
    modifier: INCREASED
    term:
      id: GO:0001525
      label: angiogenesis

environmental:
- name: Helicobacter pylori infection
  exposure_term:
    preferred_term: exposure to Helicobacter pylori
    term:
      id: ECTO:3000003
      label: exposure to Helicobacter pylori
  influences_mechanisms:
  - target: Helicobacter pylori Chronic Active Gastritis
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The organism colonises the gastric mucosa and the chronic active gastritis
      at this node is its direct consequence, the first step of the carcinogenic
      cascade that produces the primary tumour. Nothing intervenes between the
      infection and the gastritis it causes.
    evidence:
    - reference: PMID:1458460
      reference_title: "Human gastric carcinogenesis: a multistep and multifactorial process--First American Cancer Society Award Lecture on Cancer Epidemiology and Prevention."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The initial stages of gastritis and atrophy have been linked to excessive salt intake and infection with Helicobacter pylori."
      explanation: >-
        Correa links the initial gastritis and atrophy stages to Helicobacter
        pylori infection by name, which is this node's own process rather than
        the cancer at the end of the cascade.
  notes: H. pylori remains a dominant upstream risk factor for many gastric cancers that later metastasize.
  evidence:
  - reference: PMID:39004993
    reference_title: "[Advances in the application of intragastric flora in the diagnosis and treatment of gastric cancer]."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "Gastric cancer is one of the major causes of cancer-related deaths worldwide, and infection with Helicobacter pylori and EBV, smoking and a salt-heavy diet have been shown to be risk factors for the development of gastric cancer."
    explanation: This review abstract identifies H. pylori infection as an established upstream risk factor for gastric cancer, which precedes metastatic disease.
- name: Smoking
  exposure_term:
    preferred_term: exposure to tobacco smoking
    term:
      id: ECTO:6000029
      label: exposure to tobacco smoking
  influences_mechanisms:
  - target: Gastric Carcinogenesis Substrate
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      A review-level risk-factor listing names smoking alongside H. pylori and
      salt intake, but does not itself trace a mechanistic route into the
      carcinogenic cascade, so the intermediates are unknown rather than known.
    evidence:
    - reference: PMID:39004993
      reference_title: "[Advances in the application of intragastric flora in the diagnosis and treatment of gastric cancer]."
      supports: PARTIAL
      evidence_source: OTHER
      snippet: "Gastric cancer is one of the major causes of cancer-related deaths worldwide, and infection with Helicobacter pylori and EBV, smoking and a salt-heavy diet have been shown to be risk factors for the development of gastric cancer."
      explanation: >-
        Names smoking as a risk factor for the development of gastric cancer,
        i.e. for the carcinogenic substrate rather than for metastasis itself.
    - reference: PMID:18293090
      reference_title: "Smoking and gastric cancer: systematic review and meta-analysis of cohort studies."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "smoking was significantly associated with both cardia (RR = 1.87; 95% CI: 1.31-2.67; I (2) = 73.2%; nine studies) and non-cardia (RR = 1.60; 95% CI: 1.41-1.80; I (2) = 18.9%; nine studies) cancers"
      explanation: >-
        Quantifies the excess gastric cancer risk in smokers at both anatomical
        sites, supporting a predisposing effect on the carcinogenic substrate
        rather than on established metastatic disease.
  notes: Smoking is an established risk factor for the development of gastric cancer, acting on the carcinogenic cascade that produces the primary tumour rather than on the biology of established metastatic disease.
  evidence:
  - reference: PMID:18293090
    reference_title: "Smoking and gastric cancer: systematic review and meta-analysis of cohort studies."

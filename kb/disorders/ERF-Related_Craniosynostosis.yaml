name: ERF-Related Craniosynostosis
creation_date: "2026-11-09T19:45:19Z"
category: Mendelian
description: >-
  ERF-related craniosynostosis (craniosynostosis 4, CRS4) is an autosomal dominant
  craniosynostosis syndrome caused by heterozygous loss-of-function variants in ERF,
  which encodes ETS2 repressor factor, an ETS-family transcriptional repressor that is
  switched off by ERK1/2-mediated nuclear export. Reduced ERF dosage (haploinsufficiency)
  de-represses osteogenic transcriptional programs in the cranial suture, producing
  postnatal, often insidious and progressive multisuture synostosis - most characteristically
  a combined sagittal and bilambdoid ("Mercedes-Benz") pattern - with a Crouzon-like facial
  appearance but a Class I occlusion. The condition carries a high and frequently
  unsuspected risk of raised intracranial pressure and Chiari type I malformation, and is
  commonly accompanied by speech, language, attention and fine-motor difficulties.
  Presentation is often delayed into childhood, so surveillance for raised intracranial
  pressure is important even when the skull shape looks mild.

notes: >-
  Entry name: the MONDO label is "craniosynostosis 4"; this entry uses "ERF-Related
  Craniosynostosis", which is a MONDO EXACT synonym of MONDO:0010929 and the established
  literature name (coined by Twigg et al. 2013, PMID:23354439, and used as the title of
  Glass et al. 2019, PMID:30758909). The numbered-series label is kept in synonyms.
  GeneReviews: no GeneReviews or StatPearls chapter exists for ERF-related craniosynostosis
  or craniosynostosis 4 (checked against the committed Bookshelf index and by online PubMed
  title search, 2026-11-09). The phenotype baseline is therefore taken from the primary
  cohorts (Twigg 2013 PMID:23354439, Glass 2019 PMID:30758909, Chaudhry 2015 PMID:26097063,
  Care 2022 PMID:35761471, Afshari 2023 PMID:36209295, Moddemann 2022 PMID:35852485).
  Gene-disease validity: ClinGen (Craniofacial Malformations GCEP) and multiple GenCC
  submitters classify the ERF-CRS4 relationship as Definitive; no ClinGen CGGV assertion
  record is cached in this repository, so a structured gene_disease_validity assertion is
  not recorded (per project policy a tier must be copied from a cached CGGV record).
  Allelic / related ERF disorders are deliberately kept out of this entry: Chitayat
  syndrome (recurrent ETS-domain missense p.Tyr89Cys; MONDO:0014956), the MIDES phenotype
  (in-frame variants that increase nuclear ERF, the opposite direction of effect), and the
  ERF Noonan-syndrome-like phenotype are distinct entities on the ERF allelic spectrum.

mechanistic_hypotheses:
- hypothesis_group_id: erf_dosage_derepression_model
  hypothesis_label: ERF Dosage-Derepression Model
  status: CANONICAL
  description: >-
    Cranial suture patency is sensitive to the nuclear dosage of ERF, an ETS repressor that
    restrains osteogenic transcriptional programs (ETS/RUNX2 targets) downstream of RAS-MEK-ERK
    signaling. Heterozygous loss of function lowers repressor dosage below a threshold, derepressing
    the suture osteogenic program and converging on premature fusion. This is the same pathway
    that FGFR gain-of-function activates from above (through ERK-driven ERF inactivation), which
    explains the Crouzon-like overlap.
  evidence:
  - reference: PMID:23354439
    reference_title: "Reduced dosage of ERF causes complex craniosynostosis in humans and mice and links ERK1/2 signaling to regulation of osteogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data suggest that the predominant pathophysiological mechanism is heterozygous
      loss-of-function (haploinsufficiency).
    explanation: Supports haploinsufficiency (reduced repressor dosage) as the canonical mechanism.
- hypothesis_group_id: erf_direct_cns_role
  hypothesis_label: Direct CNS Role of ERF in Neurodevelopment
  status: EMERGING
  description: >-
    The neurodevelopmental features may not be entirely secondary to raised intracranial pressure
    and Chiari malformation; ERF haploinsufficiency might act directly in the developing CNS. The
    occurrence of attention, language and fine-motor difficulties in carrier relatives who lack
    overt craniosynostosis is the main supportive observation, but this remains unproven.
  evidence:
  - reference: PMID:35761471
    reference_title: "Cognitive, Behavioural, Speech, Language and Developmental Outcomes Associated with Pathogenic Variants in the ERF Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a pattern of cognitive difficulties is described, which includes poor attention, impulsivity
      and difficulties with functional fine motor skills
    explanation: >-
      Documents a consistent cognitive-difficulty pattern that may reflect more than a secondary
      consequence of raised intracranial pressure.
discussions:
- discussion_id: oq_erf_late_presentation_icp
  prompt: >-
    Why does ERF-related craniosynostosis present later and with a higher burden of unsuspected
    raised intracranial pressure and Chiari malformation than the suture-specific FGFR
    craniosynostosis syndromes?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Premature Multisuture Cranial Fusion
  - pathophysiology#Restricted Cranial Vault Growth and Raised Intracranial Pressure
  rationale: >-
    Fusion in this syndrome is postnatal, insidious and progressive, so the head shape can remain
    near-normal while intracranial pressure rises undetected, in contrast to the earlier, more
    overt presentation of FGFR gain-of-function syndromes. Why the same final pathway produces a
    delayed, dosage-dependent course here rather than a congenital one is not understood, and it
    has direct implications for how long at-risk carriers must be monitored.
  evidence:
  - reference: PMID:30758909
    reference_title: "ERF-related craniosynostosis: The phenotypic and developmental profile of a new craniosynostosis syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the craniosynostosis was often postnatal in onset, insidious and progressive
    explanation: Establishes the late, insidious course that distinguishes this syndrome.
  - reference: PMID:37175668
    reference_title: "Development of Erf-Mediated Craniosynostosis and Pharmacological Amelioration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      CRS4 has an unusual late-onset phenotype with variable severity
    explanation: Contrasts the late-onset CRS4 course with FGFR-driven syndromes.
- discussion_id: gap_erf_neurodev_origin
  prompt: >-
    Are the neurodevelopmental features of ERF-related craniosynostosis secondary to raised
    intracranial pressure and Chiari malformation, or do they reflect a direct developmental role
    of ERF in the CNS?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Neurodevelopmental Impairment of Uncertain Origin
  rationale: >-
    Speech, language, attention and fine-motor difficulties are common, and a purely secondary
    explanation (chronic raised pressure, hindbrain compression) would predict that neurologically
    well-compensated carriers are spared. The reported occurrence of cognitive difficulties in
    carriers without overt craniosynostosis argues against a purely secondary model, but no study
    has separated the two, so management (how aggressively to treat intracranial pressure to
    protect cognition) rests on an unresolved mechanism.
  evidence:
  - reference: PMID:35761471
    reference_title: "Cognitive, Behavioural, Speech, Language and Developmental Outcomes Associated with Pathogenic Variants in the ERF Gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      a pattern of cognitive difficulties is described, which includes poor attention, impulsivity
      and difficulties with functional fine motor skills
    explanation: Documents the neurodevelopmental pattern whose origin is in question.
  proposed_experiments:
  - experiment_id: exp_erf_cognition_vs_icp_history
    name: Longitudinal cognition versus intracranial-pressure history in ERF carriers
    description: >-
      Prospectively relate neurodevelopmental outcomes to documented intracranial-pressure and
      Chiari history, including carriers without craniosynostosis, to separate a secondary from a
      direct CNS mechanism.
    readouts:
    - name: Neurocognitive outcome stratified by intracranial-pressure history
      target: pathophysiology#Neurodevelopmental Impairment of Uncertain Origin
      interpretation: >-
        Cognitive difficulties in carriers who never had raised intracranial pressure would support
        a direct CNS role of ERF.
- discussion_id: gap_erf_ossification_delay_to_fusion
  prompt: >-
    How does the early reduction in calvarial ossification caused by ERF insufficiency transition
    into later premature multisuture fusion?
  kind: KNOWLEDGE_GAP
  status: OPEN
  attaches_to:
  - pathophysiology#Impaired Osteogenic Commitment of Suture Mesenchymal Progenitors
  - pathophysiology#Accelerated Osteogenic Differentiation of Suture Mesenchyme
  rationale: >-
    Mouse and ex vivo data show that reduced ERF first impairs osteogenic commitment and delays
    calvarial mineralization, yet the human and mouse endpoint is premature fusion of sutures. The
    intervening steps - whether compensatory osteogenesis, loss or exhaustion of the suture
    stem-cell niche, or a shift in the timing of differentiation - are not established, and this
    gap limits any attempt to time an intervention.
  evidence:
  - reference: PMID:33972395
    reference_title: "Erf Affects Commitment and Differentiation of Osteoprogenitor Cells in Cranial Sutures via the Retinoic Acid Pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Cellular data suggest that Erf insufficiency specifically decreases osteogenic
      differentiation of sdMSCs, resulting in the initially delayed mineralization of the
      calvarium.
    explanation: Establishes the early ossification deficit that must be reconciled with later fusion.
- discussion_id: hmm_erf_mouse_dosage_threshold
  prompt: >-
    Does the mouse Erf-insufficiency model, which requires a lower residual dosage than the human
    disease to manifest, faithfully capture the human dosage threshold for craniosynostosis?
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#ERF Haploinsufficiency
  rationale: >-
    In mice, heterozygous Erf loss (about 50% dosage) causes no phenotype; multisuture synostosis
    appears only in the hypomorphic ErfloxP/- genotype with roughly 30% residual Erf. In humans,
    heterozygous loss of function (about 50% dosage) is sufficient to cause disease. The model
    therefore recapitulates the mechanism but at a different dosage threshold, so any quantitative
    inference (for example, how much residual ERF a therapy must restore) does not transfer directly
    from mouse to human.
  evidence:
  - reference: PMID:23354439
    reference_title: "Reduced dosage of ERF causes complex craniosynostosis in humans and mice and links ERK1/2 signaling to regulation of osteogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      the threshold level required for phenotypic manifestation is lower in mice
    explanation: States directly that the mouse dosage threshold differs from the human one.
  - reference: PMID:37175668
    reference_title: "Development of Erf-Mediated Craniosynostosis and Pharmacological Amelioration."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      a threshold level of Erf required for normal calvarium development may be the cause of the
      variable disease expressivity
    explanation: Frames the dosage threshold as the basis of variable expressivity in the model.
  proposed_experiments:
  - experiment_id: exp_erf_humanized_dosage_series
    name: Humanized ERF dosage series
    description: >-
      Establish an allelic dosage series (for example in human iPSC-derived suture progenitors)
      spanning 50% to 30% residual ERF to map the human osteogenic-derepression threshold directly.
    readouts:
    - name: Osteogenic differentiation as a function of ERF dosage
      target: pathophysiology#ERF Haploinsufficiency
      interpretation: >-
        A derepression/osteogenic switch at ~50% in human cells would confirm the human-specific
        threshold implied by the clinical data.
- discussion_id: oq_erf_fgfr_ras_erk_network
  prompt: >-
    Where does ERF loss of function sit relative to FGFR gain of function in the shared
    FGFR-RAS-ERK-ERF craniosynostosis network, and could ERF-activity-augmenting drugs benefit
    FGFR-driven syndromes as well?
  kind: OPEN_QUESTION
  status: OPEN
  attaches_to:
  - pathophysiology#Reduced ERF Repression of Osteogenic Transcriptional Targets
  rationale: >-
    ERF is a terminal ERK effector, and FGFR activation causes craniosynostosis in part by
    phosphorylating and inactivating ERF. CRS4 therefore overlaps clinically with Crouzon syndrome
    and is frequently misdiagnosed as an FGFR syndrome. Whether augmenting residual ERF activity
    (for example by MEK or nuclear-export inhibition) would ameliorate FGFR-driven as well as
    ERF-driven synostosis is an open therapeutic question raised by the preclinical work.
  evidence:
  - reference: PMID:37175668
    reference_title: "Development of Erf-Mediated Craniosynostosis and Pharmacological Amelioration."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Children affected by CRS4 at infancy are frequently considered initially as FGFR syndromic
      cases
    explanation: Establishes the clinical overlap with FGFR syndromes that motivates the shared-pathway question.
animal_models:
- name: Erf-insufficient mouse (ErfloxP/-)
  species: Mouse
  genotype: ErfloxP/- hypomorphic allele over a null (roughly 30% residual Erf)
  category: hypomorphic allele model
  publication: PMID:37175668
  description: >-
    A hypomorphic ErfloxP allele combined with a null allele reduces Erf to roughly 30% of
    wild-type levels and produces postnatal multisuture craniosynostosis with facial
    dysmorphism, preceded by a mild embryonic delay in calvarial ossification - closely
    resembling the human disorder.
  genes:
  - preferred_term: ERF
    term:
      id: hgnc:3444
      label: ERF
  modeled_mechanisms:
  - target: Premature Multisuture Cranial Fusion
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    model_scale: TISSUE
    description: >-
      The model reproduces postnatal multisuture synostosis but requires a lower residual Erf
      dosage (~30%) than the human disease (~50% from heterozygous loss of function).
    limitations: >-
      The dosage threshold differs from humans: heterozygous Erf+/- mice (about 50% dosage,
      equivalent to the human genotype) are phenotypically normal, so quantitative inferences
      about the human derepression threshold do not transfer directly.
    readouts:
    - name: Multisuture closure on microCT
      target: Premature Multisuture Cranial Fusion
      direction: INCREASED
      interpretation: Progressive multisuture closure by P65 is the structural correlate of the fusion node.
      evidence:
      - reference: PMID:37175668
        reference_title: "Development of Erf-Mediated Craniosynostosis and Pharmacological Amelioration."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: >-
          at P65, the multisuture craniosynostosis phenotype is the main characteristic of
        explanation: Documents the multisuture synostosis endpoint measured by microCT.
    evidence:
    - reference: PMID:37175668
      reference_title: "Development of Erf-Mediated Craniosynostosis and Pharmacological Amelioration."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        Our mouse model of Erf-insufficiency closely resembles the human craniosynostosis disorder
      explanation: Supports treating the ErfloxP/- mouse as informative for the human fusion mechanism.
  evidence:
  - reference: PMID:23354439
    reference_title: "Reduced dosage of ERF causes complex craniosynostosis in humans and mice and links ERK1/2 signaling to regulation of osteogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      embryonic calvarial development appears mildly delayed
    explanation: Documents the mild embryonic ossification delay that precedes synostosis in the model.
- name: Erf heterozygous null mouse (Erf+/-)
  species: Mouse
  genotype: Erf+/- (about 50% Erf dosage)
  category: knockout model
  publication: PMID:37175668
  description: >-
    Mice heterozygous for an Erf null allele retain about 50% of normal Erf - the dosage
    equivalent to the human disease genotype - yet show no craniosynostosis. This negative
    result defines the species difference in dosage tolerance.
  genes:
  - preferred_term: ERF
    term:
      id: hgnc:3444
      label: ERF
  modeled_mechanisms:
  - target: Premature Multisuture Cranial Fusion
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      At the dosage that causes human disease (heterozygous loss of function, ~50%), the mouse
      develops no synostosis, so Erf+/- does not model the human fusion phenotype.
    limitations: >-
      The mouse suture tolerates a 50% reduction in Erf that is pathogenic in humans, so a
      negative result in Erf+/- cannot be read as evidence against ERF dosage sensitivity in
      people; it reflects a species-specific threshold difference.
    evidence:
    - reference: PMID:37175668
      reference_title: "Development of Erf-Mediated Craniosynostosis and Pharmacological Amelioration."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: >-
        In contrast to humans, however, mice heterozygous for Erf (Erf+/−) are phenotypically normal.
      explanation: Documents that the heterozygous-null mouse does not reproduce the human craniosynostosis phenotype.

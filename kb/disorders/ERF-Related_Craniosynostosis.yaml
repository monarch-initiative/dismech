pathophysiology:
- name: ERF Haploinsufficiency
  biological_scale: MOLECULAR
  description: >-
    A heterozygous loss-of-function ERF variant (nonsense, frameshift, splice-site,
    translation-initiation, ETS-domain missense, or whole-gene deletion) reduces functional
    ERF2 repressor dosage to roughly half. ERF is normally held inactive in the cytoplasm by
    ERK1/2-mediated phosphorylation and nuclear export downstream of RAS-MEK-ERK signaling; its
    repressor activity depends on nuclear accumulation of unphosphorylated protein. Reduced
    dosage therefore lowers the amount of repressor available to the nucleus.
  genes:
  - preferred_term: ERF
    term:
      id: hgnc:3444
      label: ERF
    modifier: DECREASED
  molecular_functions:
  - preferred_term: DNA-binding transcription repressor activity
    term:
      id: GO:0001227
      label: DNA-binding transcription repressor activity, RNA polymerase II-specific
    modifier: DECREASED
  genetic_context:
    description: Germline heterozygous loss-of-function ERF variant (haploinsufficiency).
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    zygosity: HETEROZYGOUS
  evidence:
  - reference: PMID:23354439
    reference_title: "Reduced dosage of ERF causes complex craniosynostosis in humans and mice and links ERK1/2 signaling to regulation of osteogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      the transcriptional activity of ERF is primarily regulated by ERK1/2-mediated
      phosphorylation, which leads to its export from the nucleus
    explanation: >-
      Establishes that ERF repressor activity depends on nuclear localization controlled by
      ERK1/2, the regulatory axis whose dosage is reduced by a loss-of-function allele.
  downstream:
  - target: Reduced ERF Repression of Osteogenic Transcriptional Targets
    description: Lower nuclear ERF repressor dosage de-represses its osteogenic ETS/RUNX target genes.
    causal_link_type: DIRECT
- name: Reduced ERF Repression of Osteogenic Transcriptional Targets
  biological_scale: MOLECULAR
  conforms_to: "cranial_suture_premature_fusion#Loss of Suture Patency Restraint"
  description: >-
    Nuclear ERF normally represses osteogenic transcriptional programs in suture mesenchyme,
    competing with activating ETS factors (such as ETS2) and modulating RUNX2-associated
    regulatory complexes at distal enhancers enriched for RUNX and AP-1 motifs. In the wild
    type, Erf is expressed along the osteogenic margins of the developing calvarial bones in a
    distribution resembling that of the master osteogenic regulator Runx2. Reduced ERF dosage
    relaxes this anti-osteogenic restraint - the restraint-loss entry point into the shared
    cranial-suture premature-fusion endpoint, distinct from the pro-osteogenic-signalling drive
    of the FGFR and BMP routes.
  cell_types:
  - preferred_term: mesenchymal stem cell
    term:
      id: CL:0000134
      label: mesenchymal stem cell
  biological_processes:
  - preferred_term: negative regulation of transcription by RNA polymerase II
    term:
      id: GO:0000122
      label: negative regulation of transcription by RNA polymerase II
    modifier: DECREASED
  - preferred_term: negative regulation of osteoblast differentiation
    term:
      id: GO:0045668
      label: negative regulation of osteoblast differentiation
    modifier: DECREASED
  evidence:
  - reference: PMID:23354439
    reference_title: "Reduced dosage of ERF causes complex craniosynostosis in humans and mice and links ERK1/2 signaling to regulation of osteogenesis."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In the wt, Erf is expressed along the osteogenic margins of the developing calvarial
      bones in a similar distribution to the master osteogenic regulator Runx2
    explanation: >-
      Localizes Erf to the osteogenic margins alongside Runx2, supporting a role in restraining
      the suture osteogenic program.
  downstream:
  - target: Elevated Cyp26b1-Mediated Retinoic Acid Catabolism
    description: >-
      Reduced ERF repression raises Cyp26b1 expression in suture mesenchymal progenitors (shown
      in the mouse model).
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
  - target: Accelerated Osteogenic Differentiation of Suture Mesenchyme
    description: >-
      Loss of ERF repression of osteogenic ETS/RUNX2 targets de-represses the osteogenic
      program in suture mesenchyme, converging on net excess osteoblast differentiation.
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Elevated Cyp26b1-Mediated Retinoic Acid Catabolism
  biological_scale: MOLECULAR
  description: >-
    In the mouse model, decreased Erf levels raise the cytochrome P450 enzyme Cyp26b1, which
    hydroxylates and catabolizes all-trans-retinoic acid, lowering local retinoic acid
    available for osteogenic commitment. This branch is supported by ex vivo mouse
    suture-derived progenitor data; exogenous retinoic acid rescues the differentiation defect.
    Its direct relevance to human suture tissue has not been demonstrated.
  genes:
  - preferred_term: CYP26B1
    term:
      id: hgnc:20581
      label: CYP26B1
    modifier: INCREASED
  molecular_functions:
  - preferred_term: retinoic acid 4-hydroxylase activity
    term:
      id: GO:0008401
      label: retinoic acid 4-hydroxylase activity
    modifier: INCREASED
  biological_processes:
  - preferred_term: retinoic acid catabolic process
    term:
      id: GO:0034653
      label: retinoic acid catabolic process
    modifier: INCREASED
  chemical_entities:
  - preferred_term: all-trans-retinoic acid
    term:
      id: CHEBI:15367
      label: all-trans-retinoic acid
    modifier: DECREASED
  evidence:
  - reference: PMID:33972395
    reference_title: "Erf Affects Commitment and Differentiation of Osteoprogenitor Cells in Cranial Sutures via the Retinoic Acid Pathway."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Elevated retinoic acid catabolism due to increased levels of the cytochrome P450
      superfamily member Cyp26b1 as a result of decreased Erf levels appears to be the
      underlying mechanism leading to defective differentiation.
    explanation: >-
      Directly links reduced Erf to increased Cyp26b1, retinoic acid catabolism and impaired
      osteogenic differentiation in cranial suture progenitors.
  downstream:
  - target: Impaired Osteogenic Commitment of Suture Mesenchymal Progenitors
    description: >-

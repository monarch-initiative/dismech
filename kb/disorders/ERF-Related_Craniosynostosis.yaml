inheritance:
- name: Autosomal Dominant
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    ERF-related craniosynostosis is inherited in an autosomal dominant manner. Both familial
    and de novo cases occur; many affected individuals inherit the variant from a mildly
    affected or clinically unaffected parent, and each child of an affected individual has a
    50% risk of inheriting the variant. Expressivity is highly variable within and between
    families: relatives carrying the same ERF variant can differ in which sutures fuse, in
    facial features, and in whether raised intracranial pressure develops.
  evidence:
  - reference: PMID:23354439
    reference_title: "Reduced dosage of ERF causes complex craniosynostosis in humans and mice and links ERK1/2 signaling to regulation of osteogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      reduced dosage of ERF, which encodes an inhibitory ETS transcription factor directly
      bound by ERK1/2
    explanation: >-
      The discovery study establishes heterozygous reduced ERF dosage as the autosomal
      dominant cause of this craniosynostosis syndrome.
  - reference: PMID:35852485
    reference_title: "Intrafamilial variability in six family members with ERF-related craniosynostosis syndrome type 4."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This work provides further information on the expressive variability of an ERF variant
      in six members of one family
    explanation: >-
      A six-member, three-generation family with one ERF nonsense variant directly documents
      variable expressivity within a single autosomal dominant kindred.
- name: Incomplete penetrance
  inheritance_term:
    preferred_term: Typified by incomplete penetrance
    term:
      id: HP:0003829
      label: Typified by incomplete penetrance
  description: >-
    Penetrance for craniosynostosis is incomplete: carrier adults may show only macrocephaly
    or mild craniofacial signs, or no synostosis at all.
  evidence:
  - reference: PMID:32370745
    reference_title: "A progressive and complex clinical course in two family members with ERF-related craniosynostosis: a case report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This further supports the decreased penetrance and variable expressivity seen in
      autosomal dominant disorders
    explanation: >-
      A mother-son pair sharing one ERF variant but differing in suture involvement supports
      incomplete penetrance in ERF-related craniosynostosis.
genetic:
- name: ERF variants
  association: Causative
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: ERF
    term:
      id: hgnc:3444
      label: ERF
  notes: >-
    ERF (ETS2 repressor factor; 19q13.2) encodes an ETS-family transcriptional repressor.
    Pathogenic variants are heterozygous and act through loss of function / haploinsufficiency:
    nonsense, frameshift, splice-site and translation-initiation variants reduce full-length
    protein, while ETS-domain missense variants are expressed but fail to repress ETS-site
    targets. Whole-gene 19q13.2 deletions also cause the phenotype; larger deletions that
    additionally remove CIC add intellectual disability. ClinGen (Craniofacial Malformations
    GCEP) and multiple GenCC submitters classify the ERF-CRS4 gene-disease relationship as
    Definitive; no ClinGen CGGV assertion record is cached in this repository, so a structured
    gene_disease_validity assertion is not recorded here (it must be copied from a cached CGGV
    record, per project policy) and the Definitive tier is noted rather than asserted.
  evidence:
  - reference: PMID:23354439
    reference_title: "Reduced dosage of ERF causes complex craniosynostosis in humans and mice and links ERK1/2 signaling to regulation of osteogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These data suggest that the predominant pathophysiological mechanism is heterozygous
      loss-of-function (haploinsufficiency).
    explanation: >-
      Establishes haploinsufficiency as the causative mechanism of ERF variants in this
      craniosynostosis syndrome.
  - reference: PMID:23354439
    reference_title: "Reduced dosage of ERF causes complex craniosynostosis in humans and mice and links ERK1/2 signaling to regulation of osteogenesis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous loss-of-function mutations were present in a further 11 patient samples but
      in no normal controls (P = 0.004, Fisher's exact test)
    explanation: >-
      Case-control enrichment of heterozygous ERF loss-of-function variants in craniosynostosis
      patients versus controls supports causation.
  - reference: PMID:33993607
    reference_title: "Dissection of contiguous gene effects for deletions around ERF on chromosome 19."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Heterozygous intragenic loss-of-function mutations of ERF, encoding an ETS transcription
      factor, were previously reported to cause a novel craniosynostosis syndrome, suggesting
      that ERF is haploinsufficient.
    explanation: >-
      Confirms that intragenic ERF loss-of-function variants and ERF-containing deletions act
      by haploinsufficiency.

diagnosis:
- name: Molecular genetic testing for biallelic ISCA2 variants
  description: >
    The diagnosis is established by identifying biallelic pathogenic ISCA2
    variants, typically by a mitochondrial/leukodystrophy gene panel or exome/
    genome sequencing; targeted testing for c.229G>A is efficient in individuals
    of Arab/Saudi ancestry given the founder effect.
  evidence:
  - reference: PMID:29470032
    reference_title: "ISCA2-Related Mitochondrial Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The diagnosis of ISCA2-related mitochondrial disorder is established in a proband by the identification of biallelic pathogenic variants in ISCA2 on molecular genetic testing."
    explanation: >
      GeneReviews states molecular identification of biallelic ISCA2 variants as
      the diagnostic standard.
- name: Brain MRI
  description: >
    Brain MRI shows diffuse, bilateral, symmetric white matter disease; cerebellar
    white matter is abnormal in about 75% of patients and the spinal cord is
    involved in about 55%, with a lactate peak on MR spectroscopy in a subset.
  evidence:
  - reference: PMID:31106229
    reference_title: "Multiple Mitochondrial Dysfunctions Syndrome 4 Due to ISCA2 Gene Defects: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Magnetic resonance imaging findings include 75% of patients have cerebellar white matter abnormalities, and the spinal cord was affected in 55%."
    explanation: >
      Review characterizes the MRI white-matter pattern used diagnostically.
- name: Plasma and CSF amino acids and lactate
  description: >
    Plasma and CSF amino-acid analysis may show elevated glycine, and plasma/CSF
    lactate may be elevated; these biochemical findings are supportive but
    inconsistent and do not by themselves establish the diagnosis.
  evidence:
  - reference: PMID:31106229
    reference_title: "Multiple Mitochondrial Dysfunctions Syndrome 4 Due to ISCA2 Gene Defects: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biochemical abnormalities include high cerebrospinal fluid glycine and lactate and high plasma glycine and lactate, but these findings were not consistent."
    explanation: >
      Review lists elevated CSF/plasma glycine and lactate as supportive
      biochemical findings.
- name: Respiratory chain enzymology (complex II/IV)
  description: >
    Respiratory-chain enzymology in patient cells/tissue shows deficient
    complex II and IV activity, reflecting failure to mature the [4Fe-4S]

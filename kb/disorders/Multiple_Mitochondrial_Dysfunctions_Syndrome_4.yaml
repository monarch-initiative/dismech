name: Multiple Mitochondrial Dysfunctions Syndrome 4
category: Genetic
creation_date: "2026-09-05T00:00:00Z"
synonyms:
- MMDS4
- ISCA2-related mitochondrial disorder
- ISCA2 deficiency
- Fatal infantile leukoencephalopathy due to ISCA2 deficiency
description: >
  Multiple Mitochondrial Dysfunctions Syndrome 4 (MMDS4; OMIM #616370), also called
  ISCA2-related mitochondrial disorder, is a fatal autosomal recessive infantile
  neurodegenerative leukoencephalopathy caused by biallelic loss-of-function
  variants in ISCA2, encoding iron-sulfur cluster assembly factor 2. ISCA2 acts
  with ISCA1 and IBA57 in the late steps of mitochondrial [4Fe-4S] cluster
  biogenesis, catalyzing the reductive fusion of two GLRX5-derived [2Fe-2S]
  clusters into a [4Fe-4S] cluster. Loss of ISCA2 impairs maturation of [4Fe-4S]
  client enzymes — respiratory chain complexes I and II, aconitase, and lipoic
  acid synthase (LIAS). LIAS deficiency reduces lipoylation of pyruvate
  dehydrogenase and 2-oxoglutarate dehydrogenase and inactivates the glycine
  cleavage system, producing hyperglycinemia; respiratory chain failure produces
  lactic acidosis. Affected infants develop normally for the first months, then
  between roughly 2 and 7 months of age undergo rapid neurodevelopmental
  regression with the triad of regression, optic atrophy with nystagmus, and
  diffuse white matter disease, becoming vegetative within 1-2 years and usually
  dying in early childhood. A homozygous founder missense variant, c.229G>A
  (p.Gly77Ser), accounts for the large majority of reported (predominantly Saudi
  Arabian) cases; sporadic non-founder variants have been reported in other
  populations. Fewer than 25 patients had been reported worldwide as of 2020.
disease_term:
  preferred_term: Multiple mitochondrial dysfunctions syndrome 4
  term:
    id: MONDO:0014611
    label: multiple mitochondrial dysfunctions syndrome 4
parents:
- MONDO:0044970
classifications:
  mechanistic_category:
  - classification_value: mitochondrial disease
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
genetic:
- name: ISCA2
  gene_term:
    preferred_term: ISCA2
    term:
      id: hgnc:19857
      label: ISCA2
  relationship_type: CAUSATIVE
  notes: >
    Biallelic loss-of-function variants in ISCA2 (iron-sulfur cluster assembly
    factor 2) cause MMDS4. The recurrent homozygous missense founder variant
    c.229G>A (p.Gly77Ser) is found in consanguineous Arab (predominantly Saudi
    Arabian) families and accounts for most reported cases; several sporadic
    non-founder variants have been reported in patients of other ancestries.
  evidence:
  - reference: PMID:25539947
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a homoallelic missense founder mutation in ISCA2 leading to mitochondrial depletion and reduced complex I activity as well as decreased ISCA2, ISCA1 and IBA57 expression in fibroblasts."
    explanation: >
      Original description identifying the homozygous ISCA2 founder missense
      variant as the cause of an infantile mitochondrial leukodystrophy.
  - reference: PMID:34440194
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Molecular studies revealed a homozygous variant in ISCA2 for each patient, the Gly77Ser variant, leading to the description of the first patients with MMDS 4"
    explanation: >
      Systematic review confirming p.Gly77Ser as the founder variant in the
      original MMDS4 patients.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    MMDS4 is inherited in an autosomal recessive manner; parents are obligate
    asymptomatic heterozygous carriers, with a 25% recurrence risk per pregnancy.
  evidence:
  - reference: PMID:29470032
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ISCA2-related mitochondrial disorder is inherited in an autosomal recessive manner. At conception, each sib of an affected individual with IRMD has a 25% chance of being affected"
    explanation: >
      GeneReviews states the autosomal recessive inheritance pattern and
      recurrence risk.
pathophysiology:
- name: Biallelic ISCA2 Loss of Function
  description: >
    Biallelic loss-of-function ISCA2 variants (e.g., the founder p.Gly77Ser)
    reduce or abolish the Fe-S cluster carrier function of iron-sulfur cluster
    assembly factor 2.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: iron-sulfur cluster binding
    term:
      id: GO:0051536
      label: iron-sulfur cluster binding
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Defective Mitochondrial 4Fe-4S Cluster Biogenesis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29297947
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We specifically tested the impact of loss of ISCA2 on 2Fe-2S proteins versus 4Fe-4S proteins and observed deficits in the functioning of 4Fe-4S but not 2Fe-2S proteins."
      explanation: >
        Knockdown and patient-cell studies show ISCA2 loss selectively impairs
        [4Fe-4S] protein maturation.
- name: Defective Mitochondrial 4Fe-4S Cluster Biogenesis
  description: >
    ISCA2 normally heterodimerizes with ISCA1 (with IBA57) to catalyze the
    reductive fusion of two GLRX5-derived [2Fe-2S] clusters into a [4Fe-4S]
    cluster, the terminal step of mitochondrial iron-sulfur cluster biogenesis.
    Loss of ISCA2 impairs [4Fe-4S] cluster supply while sparing [2Fe-2S]
    proteins.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: "[4Fe-4S] cluster assembly"
    term:
      id: GO:0044572
      label: "[4Fe-4S] cluster assembly"
    modifier: DECREASED
  downstream:
  - target: Failure to Mature 4Fe-4S Client Enzymes
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34440194
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "On the heterocomplex ISCA1-ISCA2, the reductive fusion of two GLRX5-derived"
      explanation: >
        Review describes the ISCA1-ISCA2 step of [4Fe-4S] biogenesis whose
        failure withholds clusters from downstream client enzymes.
- name: Failure to Mature 4Fe-4S Client Enzymes
  description: >
    Deficient [4Fe-4S] cluster supply prevents maturation of multiple client
    holoenzymes, including respiratory chain complexes I and II, the TCA-cycle
    enzyme aconitase, and lipoic acid synthase (LIAS), itself a [4Fe-4S]
    radical-SAM enzyme.
  biological_scale: MOLECULAR
  downstream:
  - target: Respiratory Chain Complex I and II Deficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34440194
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "most of them, including the subunits of the respiratory complexes I and II and the lipoic acid synthase (LIAS) involved in the critical modifications of the pyruvate dehydrogenase (PDH) and of the alpha-ketoglutarate dehydrogenase (αKGDH) complexes, require dedicated late-acting ISC targeting factors"
      explanation: >
        Complexes I/II and LIAS are [4Fe-4S] clients whose maturation fails when
        the late ISC pathway is disrupted.
  - target: Deficient Protein Lipoylation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34440194
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Lipoylated proteins (PDH, KGDH) were also decreased in the fibroblasts of patients, in accordance with the involvement of ISCA2 in the maturation of mitochondrial"
      explanation: >
        In ISCA2-deficient patient fibroblasts, lipoylated PDH and KGDH are
        reduced, evidencing failure of the LIAS-dependent lipoylation branch.
- name: Respiratory Chain Complex I and II Deficiency
  description: >
    Failure to mature [4Fe-4S] subunits of respiratory complexes I and II
    (succinate dehydrogenase) impairs oxidative phosphorylation and, with
    reduced aconitase and TCA-cycle flux, produces lactic acidosis. Mitochondrial
    DNA depletion has also been reported.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: mitochondrial electron transport, succinate to ubiquinone
    term:
      id: GO:0006121
      label: mitochondrial electron transport, succinate to ubiquinone
    modifier: DECREASED
  downstream:
  - target: Elevated lactate
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29297947
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Loss of ISCA2 diminished mitochondrial membrane potential, the mitochondrial network, basal and maximal respiration, ATP production, and activity of ETC complexes II and IV."
      explanation: >
        ISCA2 loss reduces respiration and ETC complex activity, the metabolic
        basis for lactate accumulation.
  - target: Leukoencephalopathy
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25539947
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our data demonstrate that ISCA2 deficiency leads to a hereditary mitochondrial neurodegenerative white matter disease in infancy."
      explanation: >
        Links the mitochondrial respiratory defect to the infantile white matter
        (leukoencephalopathy) disease.
- name: Deficient Protein Lipoylation
  description: >
    Loss of LIAS activity reduces lipoylation of the E2 subunits of pyruvate
    dehydrogenase and 2-oxoglutarate dehydrogenase and of the H-protein of the
    glycine cleavage system, inactivating glycine catabolism.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: protein lipoylation
    term:
      id: GO:0009249
      label: protein lipoylation
    modifier: DECREASED
  downstream:
  - target: Elevated glycine (hyperglycinemia)
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31106229
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This occurs due to defects in the iron–sulfur clusters pathway that leads to the inhibition of lipoic acid synthase that is vital for the glycine cleavage system, an impairment of which results in hyperglycinemia."
      explanation: >
        Directly traces impaired lipoic acid synthase, and thus glycine cleavage
        system failure, to the hyperglycinemia of ISCA2 deficiency.
phenotypes:
- name: Developmental regression
  category: Phenotypic
  description: >
    After apparently normal early development, affected infants undergo rapid
    neurodevelopmental regression, typically between 2 and 7 months of age,
    progressing to a vegetative state within 1-2 years.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Developmental regression
    term:
      id: HP:0002376
      label: Developmental regression
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:29470032
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At age three to seven months, affected individuals usually present with a triad of neurodevelopmental regression, nystagmus with optic atrophy, and diffuse white matter disease."
    explanation: >
      GeneReviews describes neurodevelopmental regression as a core presenting
      feature.
- name: Leukoencephalopathy
  category: Phenotypic
  description: >
    Diffuse, bilateral, symmetric white matter disease is a defining feature;
    cerebral and cerebellar white matter and the spinal cord are frequently
    involved, and some cases show cavitation.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Leukoencephalopathy
    term:
      id: HP:0002352
      label: Leukoencephalopathy
  evidence:
  - reference: PMID:34440194
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lesions in cerebral and cerebellar white matter and the spinal cord were indeed quite constantly present"
    explanation: >
      Review documents the constant, diffuse white matter involvement in MMDS4.
- name: Optic atrophy
  category: Phenotypic
  description: >
    Optic atrophy, part of the presenting triad, develops with disease
    progression and is nearly universal in the founder-variant cohort.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Optic atrophy
    term:
      id: HP:0000648
      label: Optic atrophy
  evidence:
  - reference: PMID:31106229
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the triad of neurodevelopmental regression, optic atrophy with nystagmus, and diffuse white matter disease"
    explanation: >
      Optic atrophy is a component of the characteristic MMDS4 presenting triad.
- name: Nystagmus
  category: Phenotypic
  description: >
    Nystagmus commonly accompanies optic atrophy and is often an early sign.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Nystagmus
    term:
      id: HP:0000639
      label: Nystagmus
  evidence:
  - reference: PMID:29470032
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "affected individuals usually present with a triad of neurodevelopmental regression, nystagmus with optic atrophy, and diffuse white matter disease"
    explanation: >
      GeneReviews lists nystagmus with optic atrophy in the presenting triad.
- name: Spasticity
  category: Phenotypic
  description: >
    Progressive spasticity and hypertonia develop as the disease advances.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Spasticity
    term:
      id: HP:0001257
      label: Spasticity
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:34440194
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "clinical status was deteriorated during the first year of life leading to spasticity and visual impairment (nystagmus and/or optic atrophy)"
    explanation: >
      Review describes progressive spasticity developing during the first year.
- name: Seizures
  category: Phenotypic
  description: >
    Seizures develop in a subset of patients (roughly 30%) as the disease
    progresses and are treated with standard anticonvulsants.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Seizure
    term:
      id: HP:0001250
      label: Seizure
  evidence:
  - reference: PMID:29470032
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "As the disease progresses, global psychomotor regression continues at a variable pace and seizures may develop."
    explanation: >
      GeneReviews notes seizures developing in a subset of patients with disease
      progression.
- name: Elevated glycine (hyperglycinemia)
  category: Laboratory
  description: >
    Elevated plasma and CSF glycine, secondary to glycine cleavage system
    failure from the lipoylation defect, is a characteristic (though not
    invariant) biochemical finding.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Hyperglycinemia
    term:
      id: HP:0002154
      label: Hyperglycinemia
  evidence:
  - reference: PMID:29297947
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We present two additional unrelated cases, and provide a more complete clinical description that includes hyperglycinemia, leukodystrophy of the brainstem with longitudinally extensive spinal cord involvement, and mtDNA deficiency."
    explanation: >
      Reports hyperglycinemia as part of the expanded clinical description of
      ISCA2 deficiency.
- name: Elevated lactate
  category: Laboratory
  description: >
    Elevated lactate in blood and CSF, and a lactate peak on MR spectroscopy in
    a subset of patients, reflects the respiratory chain defect.
  frequency: FREQUENT
  phenotype_term:
    preferred_term: Increased circulating lactate concentration
    term:
      id: HP:0002151
      label: Increased circulating lactate concentration
  evidence:
  - reference: PMID:31106229
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Biochemical abnormalities include high cerebrospinal fluid glycine and lactate and high plasma glycine and lactate, but these findings were not consistent."
    explanation: >
      Review reports elevated lactate (and glycine) in body fluids, noting
      inconsistency across patients.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >
    Ultra-rare. Approximately 20-24 affected individuals from ~18 families had
    been reported as of 2019-2020, most Saudi Arabian and homozygous for the
    p.Gly77Ser founder variant. No formal population prevalence or incidence
    estimate exists.
  evidence:
  - reference: PMID:31106229
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To date, 20 cases have been reported: 13 females and 7 males from 18 different families. All cases are from Saudi Arabia except those from one Italian family."
    explanation: >
      Review tabulates the reported case count and predominant population as of
      2019.
progression:
- phase: Infantile onset and regression
  notes: >
    Normal antenatal history and early development, followed by rapid
    deterioration between about 2 and 7 months of age with the presenting triad,
    progression to a vegetative state within 1-2 years, and death usually in
    early childhood. The course is uniformly progressive with no reported
    remission.
  evidence:
  - reference: PMID:29470032
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Affected children become vegetative within one to two years. During their vegetative state, which may persist for years, affected individuals are prone to recurrent chest infections that may require ventilator support."
    explanation: >
      GeneReviews describes the progression to a vegetative state and terminal
      respiratory complications.
treatments:
- name: Supportive and multidisciplinary care
  description: >
    No curative therapy exists; management is exclusively supportive, drawing on
    genetics, neurology, dietetics, and developmental specialists.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:29470032
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Treatment is primarily supportive and may require input from a geneticist, neurologist, dietician, and developmental specialist."
    explanation: >
      GeneReviews specifies supportive, multidisciplinary management as the
      standard of care.
- name: Enteral nutritional support (feeding tube)
  description: >
    A nasogastric or gastrostomy feeding tube is typically required as bulbar
    and motor function deteriorate.
  treatment_term:
    preferred_term: Nutritional Support
    term:
      id: NCIT:C15433
      label: Nutritional Support
  evidence:
  - reference: PMID:29470032
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A feeding tube (nasogastric or gastrostomy) is typically required."
    explanation: >
      GeneReviews states that enteral feeding-tube support is typically needed.
- name: Antiseizure pharmacotherapy
  description: >
    Standard anticonvulsant therapy is used for the subset of patients who
    develop epilepsy.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
  evidence:
  - reference: PMID:29470032
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Standard treatment for epilepsy. Recurrent chest infections may require ventilator support in addition to antimicrobial therapy."
    explanation: >
      GeneReviews recommends standard antiepileptic pharmacotherapy for the
      seizures that develop in a subset of patients.
- name: Genetic counseling
  description: >
    Autosomal recessive counseling with a 25% recurrence risk; carrier testing
    and prenatal/preimplantation testing are available when the familial variants
    are known.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:29470032
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Carrier testing for at-risk relatives and prenatal testing for a pregnancy at increased risk are possible if the ISCA2 pathogenic variants in the family are known."
    explanation: >
      GeneReviews describes carrier and prenatal testing offered through genetic
      counseling.
references:
- reference: PMID:29470032
  title: "ISCA2-Related Mitochondrial Disorder."
  tags:

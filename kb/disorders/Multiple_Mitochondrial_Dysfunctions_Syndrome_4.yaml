genetic:
- name: ISCA2
  gene_term:
    preferred_term: ISCA2
    term:
      id: hgnc:19857
      label: ISCA2
  relationship_type: CAUSATIVE
  notes: >
    Biallelic loss-of-function variants in ISCA2 (iron-sulfur cluster assembly
    factor 2) cause MMDS4. The recurrent homozygous missense founder variant
    c.229G>A (p.Gly77Ser) is found in consanguineous Arab (predominantly Saudi
    Arabian) families and accounts for most reported cases; several sporadic
    non-founder variants have been reported in patients of other ancestries and
    affect all regions of the ISCA2 protein.
  variants:
  - name: c.229G>A (p.Gly77Ser)
    description: >
      Recurrent homozygous missense founder variant in consanguineous Arab
      (predominantly Saudi Arabian) families; the most frequently reported ISCA2
      allele and the one in the original MMDS4 description.
    type: missense
    clinical_significance: PATHOGENIC
    evidence:
    - reference: PMID:34440194
      reference_title: "A Review of Multiple Mitochondrial Dysfunction Syndromes, Syndromes Associated with Defective Fe-S Protein Maturation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Molecular studies revealed a homozygous variant in ISCA2 for each patient, the Gly77Ser variant, leading to the description of the first patients with MMDS 4"
      explanation: >
        Identifies p.Gly77Ser as the recurrent founder allele in the original
        MMDS4 cohort.
  - name: c.355G>A (p.Ala119Thr)
    description: >
      Novel non-founder missense variant reported in a consanguineous Iranian
      family, predicted to eliminate a helix motif in the Fe-S biosynthesis
      domain; the third ISCA2 patient reported worldwide at the time and outside
      the Saudi founder background.
    type: missense
    clinical_significance: LIKELY_PATHOGENIC
    evidence:
    - reference: PMID:31279336
      reference_title: "A novel ISCA2 variant responsible for an early-onset neurodegenerative mitochondrial disorder: a case report of multiple mitochondrial dysfunctions syndrome 4."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "A novel variant (c.355G > A, p.Ala119Thr) in ISCA2 gene was identified by WES in the proband."
      explanation: >
        Reports a non-founder ISCA2 missense allele in an Iranian family,
        establishing allelic and geographic heterogeneity beyond the founder
        variant.
  evidence:
  - reference: PMID:25539947
    reference_title: "ISCA2 mutation causes infantile neurodegenerative mitochondrial disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a homoallelic missense founder mutation in ISCA2 leading to mitochondrial depletion and reduced complex I activity as well as decreased ISCA2, ISCA1 and IBA57 expression in fibroblasts."
    explanation: >
      Original description identifying the homozygous ISCA2 founder missense
      variant as the cause of an infantile mitochondrial leukodystrophy.
  - reference: PMID:34440194
    reference_title: "A Review of Multiple Mitochondrial Dysfunction Syndromes, Syndromes Associated with Defective Fe-S Protein Maturation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "in five other patients from different countries, seven sporadic variants were identified. These seven variants affect all regions of the ISCA2 protein"
    explanation: >
      Documents allelic heterogeneity: besides the Saudi founder variant, seven
      sporadic ISCA2 variants span the protein.
inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    MMDS4 is inherited in an autosomal recessive manner; parents are obligate
    asymptomatic heterozygous carriers, with a 25% recurrence risk per pregnancy.
  evidence:
  - reference: PMID:29470032
    reference_title: "ISCA2-Related Mitochondrial Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ISCA2-related mitochondrial disorder is inherited in an autosomal recessive manner. At conception, each sib of an affected individual with IRMD has a 25% chance of being affected"
    explanation: >
      GeneReviews states the autosomal recessive inheritance pattern and
      recurrence risk.
pathophysiology:
- name: Biallelic ISCA2 Loss of Function
  description: >
    Biallelic loss-of-function ISCA2 variants (e.g., the founder p.Gly77Ser)
    reduce or abolish the Fe-S cluster carrier function of iron-sulfur cluster
    assembly factor 2.
  biological_scale: MOLECULAR
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    allele_type: missense (founder p.Gly77Ser); also frameshift and splice-site alleles
    description: >
      Biallelic germline loss-of-function ISCA2 variants; most patients are
      homozygous for the p.Gly77Ser founder missense allele, while sporadic
      cases carry compound or homozygous non-founder missense, frameshift, or
      splice-affecting alleles.
  molecular_functions:
  - preferred_term: iron-sulfur cluster binding
    term:
      id: GO:0051536
      label: iron-sulfur cluster binding
    modifier: LOSS_OF_FUNCTION
  downstream:
  - target: Defective Mitochondrial 4Fe-4S Cluster Biogenesis
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29297947
      reference_title: "Loss-of-function mutations in ISCA2 disrupt 4Fe-4S cluster machinery and cause a fatal leukodystrophy with hyperglycinemia and mtDNA depletion."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We specifically tested the impact of loss of ISCA2 on 2Fe-2S proteins versus 4Fe-4S proteins and observed deficits in the functioning of 4Fe-4S but not 2Fe-2S proteins."
      explanation: >
        Knockdown and patient-cell studies show ISCA2 loss selectively impairs
        [4Fe-4S] protein maturation.
- name: Defective Mitochondrial 4Fe-4S Cluster Biogenesis
  description: >
    ISCA2 normally heterodimerizes with ISCA1 (with IBA57) to catalyze the
    reductive fusion of two GLRX5-derived [2Fe-2S] clusters into a [4Fe-4S]
    cluster, the terminal step of mitochondrial iron-sulfur cluster biogenesis.
    Loss of ISCA2 impairs [4Fe-4S] cluster supply while sparing [2Fe-2S]
    proteins.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: "[4Fe-4S] cluster assembly"
    term:
      id: GO:0044572
      label: "[4Fe-4S] cluster assembly"
    modifier: DECREASED
  downstream:
  - target: Failure to Mature 4Fe-4S Client Enzymes
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34440194
      reference_title: "A Review of Multiple Mitochondrial Dysfunction Syndromes, Syndromes Associated with Defective Fe-S Protein Maturation."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "which results in a deficiency of mitochondrial respiratory complexes and the impaired function of lipoic-acid-dependent enzymes"
      explanation: >
        Review states that impaired [4Fe-4S] cluster maturation is what leaves
        the downstream client enzymes (respiratory complexes and lipoic-acid
        enzymes) deficient.
- name: Failure to Mature 4Fe-4S Client Enzymes
  description: >
    Deficient [4Fe-4S] cluster supply prevents maturation of multiple client
    holoenzymes, including respiratory chain complexes I and II, the TCA-cycle
    enzyme aconitase, and lipoic acid synthase (LIAS), itself a [4Fe-4S]
    radical-SAM enzyme.
  biological_scale: MOLECULAR
  downstream:
  - target: Respiratory Chain Complex I and II Deficiency
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34440194
      reference_title: "A Review of Multiple Mitochondrial Dysfunction Syndromes, Syndromes Associated with Defective Fe-S Protein Maturation."
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "most of them, including the subunits of the respiratory complexes I and II and the lipoic acid synthase (LIAS) involved in the critical modifications of the pyruvate dehydrogenase (PDH) and of the alpha-ketoglutarate dehydrogenase (αKGDH) complexes, require dedicated late-acting ISC targeting factors"
      explanation: >
        Complexes I/II and LIAS are [4Fe-4S] clients whose maturation fails when
        the late ISC pathway is disrupted.
  - target: Deficient Protein Lipoylation
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:34440194
      reference_title: "A Review of Multiple Mitochondrial Dysfunction Syndromes, Syndromes Associated with Defective Fe-S Protein Maturation."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Lipoylated proteins (PDH, KGDH) were also decreased in the fibroblasts of patients"
      explanation: >
        In ISCA2-deficient patient fibroblasts, lipoylated PDH and KGDH are
        reduced, evidencing failure of the LIAS-dependent lipoylation branch.
- name: Respiratory Chain Complex I and II Deficiency
  description: >
    Failure to mature [4Fe-4S] subunits of respiratory complexes I and II
    (succinate dehydrogenase) impairs oxidative phosphorylation and, with
    reduced aconitase and TCA-cycle flux, produces lactic acidosis. Mitochondrial
    DNA depletion has also been reported.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: mitochondrial electron transport, NADH to ubiquinone
    term:
      id: GO:0006120
      label: mitochondrial electron transport, NADH to ubiquinone
    modifier: DECREASED
  - preferred_term: mitochondrial electron transport, succinate to ubiquinone
    term:
      id: GO:0006121
      label: mitochondrial electron transport, succinate to ubiquinone
    modifier: DECREASED
  downstream:
  - target: Elevated lactate
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:29297947
      reference_title: "Loss-of-function mutations in ISCA2 disrupt 4Fe-4S cluster machinery and cause a fatal leukodystrophy with hyperglycinemia and mtDNA depletion."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Loss of ISCA2 diminished mitochondrial membrane potential, the mitochondrial network, basal and maximal respiration, ATP production, and activity of ETC complexes II and IV."
      explanation: >
        ISCA2 loss reduces respiration and ETC complex activity, the metabolic
        basis for lactate accumulation.
  - target: Leukoencephalopathy
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:25539947
      reference_title: "ISCA2 mutation causes infantile neurodegenerative mitochondrial disorder."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Our data demonstrate that ISCA2 deficiency leads to a hereditary mitochondrial neurodegenerative white matter disease in infancy."
      explanation: >
        Links the mitochondrial respiratory defect to the infantile white matter
        (leukoencephalopathy) disease.
  - target: Optic atrophy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:31106229
      reference_title: "Multiple Mitochondrial Dysfunctions Syndrome 4 Due to ISCA2 Gene Defects: A Review."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "the triad of neurodevelopmental regression, optic atrophy with nystagmus, and diffuse white matter disease"
      explanation: >
        Optic atrophy is a constant feature of the ISCA2 respiratory/energy
        failure, but the tissue-selective mechanism linking the bioenergetic
        defect to optic-nerve degeneration is not established, so the edge is
        indirect.
- name: Deficient Protein Lipoylation
  description: >
    Loss of LIAS activity reduces lipoylation of the E2 subunits of pyruvate
    dehydrogenase and 2-oxoglutarate dehydrogenase and of the H-protein of the
    glycine cleavage system, inactivating glycine catabolism.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: protein lipoylation
    term:
      id: GO:0009249
      label: protein lipoylation
    modifier: DECREASED
  downstream:
  - target: Elevated glycine (hyperglycinemia)
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31106229
      reference_title: "Multiple Mitochondrial Dysfunctions Syndrome 4 Due to ISCA2 Gene Defects: A Review."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "This occurs due to defects in the iron–sulfur clusters pathway that leads to the inhibition of lipoic acid synthase that is vital for the glycine cleavage system, an impairment of which results in hyperglycinemia."
      explanation: >
        Directly traces impaired lipoic acid synthase, and thus glycine cleavage
        system failure, to the hyperglycinemia of ISCA2 deficiency.
phenotypes:
- name: Developmental regression
  category: Phenotypic
  description: >
    After apparently normal early development, affected infants undergo rapid
    neurodevelopmental regression, typically between 2 and 7 months of age,
    progressing to a vegetative state within 1-2 years.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Developmental regression
    term:
      id: HP:0002376
      label: Developmental regression
    clinical_course: PROGRESSIVE
  evidence:
  - reference: PMID:29470032
    reference_title: "ISCA2-Related Mitochondrial Disorder."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "At age three to seven months, affected individuals usually present with a triad of neurodevelopmental regression, nystagmus with optic atrophy, and diffuse white matter disease."
    explanation: >
      GeneReviews describes neurodevelopmental regression as a core presenting
      feature.
- name: Leukoencephalopathy
  category: Phenotypic
  description: >
    Diffuse, bilateral, symmetric white matter disease is a defining feature;
    cerebral and cerebellar white matter and the spinal cord are frequently
    involved, and some cases show cavitation. The white matter destruction is the
    proximate driver of the psychomotor regression, spasticity, and seizures.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Leukoencephalopathy
    term:
      id: HP:0002352
      label: Leukoencephalopathy
  sequelae:
  - target: Developmental regression
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:29470032
      reference_title: "ISCA2-Related Mitochondrial Disorder."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "As the disease progresses, global psychomotor regression continues at a variable pace and seizures may develop."
      explanation: >
        Progressive white matter disease tracks with the continuing psychomotor
        regression; the link is clinical association rather than a demonstrated
        mechanism.
  - target: Spasticity
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:34440194
      reference_title: "A Review of Multiple Mitochondrial Dysfunction Syndromes, Syndromes Associated with Defective Fe-S Protein Maturation."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "clinical status was deteriorated during the first year of life leading to spasticity and visual impairment (nystagmus and/or optic atrophy)"
      explanation: >
        Progressive CNS white matter disease is followed by spasticity; the
        corticospinal-tract mechanism is inferred.
  - target: Seizures
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:29470032
      reference_title: "ISCA2-Related Mitochondrial Disorder."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "global psychomotor regression continues at a variable pace and seizures may develop"
      explanation: >
        Seizures develop as the encephalopathy advances; the epileptogenic
        mechanism is not specified.
  evidence:
  - reference: PMID:34440194
    reference_title: "A Review of Multiple Mitochondrial Dysfunction Syndromes, Syndromes Associated with Defective Fe-S Protein Maturation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Lesions in cerebral and cerebellar white matter and the spinal cord were indeed quite constantly present"
    explanation: >
      Review documents the constant, diffuse white matter involvement in MMDS4.

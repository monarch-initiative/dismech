discussions:
- discussion_id: isca2_no_vertebrate_cns_model
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Biallelic ISCA2 Loss of Function
  prompt: >
    Does any whole-organism vertebrate model reproduce the CNS
    leukoencephalopathy and optic-atrophy phenotype of human ISCA2 deficiency,
    given that in mouse ISCA1 (not ISCA2) is reported to be required for
    mitochondrial [4Fe-4S] protein maturation in postmitotic tissues under
    standard conditions?
  rationale: >
    Human ISCA2 loss is fully penetrant and fatal, yet a review of the pathway
    states that ISCA2 (and IBA57) are not required in postmitotic mouse cell
    types under standard physiological conditions, where ISCA1 is. A
    straightforward Isca2-null rodent may therefore not recapitulate the human
    CNS disease, so the translational validity of any such model is an open
    question that should be recorded rather than assumed.
  evidence:
  - reference: PMID:31106229
    reference_title: "Multiple Mitochondrial Dysfunctions Syndrome 4 Due to ISCA2 Gene Defects: A Review."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The ISCA1 is required for the maturation of mitochondrial Fe4S4 proteins in mature skeletal muscle, whereas ISCA2 and IBA57 are not required in the 2 postmitotic cell types, under standard physiological conditions."
    explanation: >
      Documents the mouse finding that ISCA2 is dispensable in postmitotic
      tissues, the basis for the human-model mismatch given the fully penetrant
      human disease.
  notes: >
    Recorded from the review's synthesis only; the primary rodent studies were
    not independently retrieved in this curation, so no whole-organism model
    link is asserted in the pathograph.

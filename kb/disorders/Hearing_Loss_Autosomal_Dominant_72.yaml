    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Although more evidence is needed to support a causal role, no convincing evidence has emerged that contradicts the gene-disease relationship."
    explanation: >-
      The panel's position in full: not enough evidence to rely on, and no reason to discard
      it either. That is exactly the interpretive situation a laboratory faces with an
      SLC44A4 hit.
treatments:
- name: Hearing Amplification
  description: >-
    Hearing aids, the first-line intervention for postlingual sensorineural loss of this
    degree. No management detail of any kind is reported for the DFNA72 family - not aided
    thresholds, not device use, not speech scores - so this record is the standard of care
    for the class rather than an observation about this disease. A mid-frequency
    configuration is worth naming to a fitter, since amplification prescriptions built around
    the usual sloping high-frequency loss are not the right target here.
  therapeutic_modality: DEVICE
  treatment_term:
    preferred_term: hearing aid amplification
    term:
      id: NCIT:C15315
      label: Rehabilitation
    qualifiers:
    - predicate:
        preferred_term: medical device
        term:
          id: NCIT:C16830
          label: Medical Device
      value:
        preferred_term: hearing aid
        term:
          id: NCIT:C183182
          label: Hearing Aid
  target_mechanisms:
  - target: Mid-Frequency Sensorineural Hearing Loss
    description: >-
      Raises the sound pressure reaching the cochlea to compensate for the threshold loss. It
      does nothing to the cholinergic efferent mechanism proposed upstream, so no
      treatment_effect value is recorded - every value in that enum asserts a change to the
      mechanism, and amplification makes no such claim.
  evidence:
  - reference: PMID:37371710
    reference_title: "Autosomal Dominant Non-Syndromic Hearing Loss (DFNA): A Comprehensive Narrative Review."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "A long audiological follow-up is of paramount importance to identify hearing threshold deteriorations early and ensure prompt treatment with hearing aids or cochlear implants."
    explanation: >-
      Class-level support: a narrative review of autosomal dominant nonsyndromic hearing loss
      as a group, not of DFNA72. Graded INDIRECT for that reason and OTHER because it is a
      review. No DFNA72-specific management report exists.
- name: Genetic Counselling
  description: >-
    Counselling for a dominant condition carries a 50 percent transmission risk, but the
    disease-specific content here is about certainty rather than risk. The gene-disease
    relationship is classified Limited on one family, so an SLC44A4 result should be
    presented as a possible rather than an established explanation, and predictive testing of
    an unaffected relative cannot be interpreted. Penetrance has never been estimated.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  notes: >-
    No target_mechanisms link is recorded. Counselling does not act on a pathograph node,
    and every TreatmentEffectEnum value asserts a change to a mechanism. No SLC44A4-directed
    therapy, and no DFNA72-specific clinical trial, has been reported.
  evidence:
  - reference: CGGV:assertion_3ddbe083-55c3-483b-8c32-fc9bdbef10c6-2022-11-22T170000.000Z
    reference_title: "SLC44A4 / nonsyndromic genetic hearing loss (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "In summary, there is limited evidence to support this gene-disease relationship."
    explanation: >-
      The fact that has to be conveyed in the counselling room, and the reason a positive
      SLC44A4 result is not a closed diagnostic question.
animal_models:
- name: slc44a4 morpholino knockdown zebrafish
  species: Zebrafish
  genotype: slc44a4 morpholino knockdown (transient antisense knockdown; no stable line)
  publication: PMID:28013291
  description: >-
    The only in vivo work on this gene in relation to hearing. Morpholino knockdown of
    zebrafish slc44a4 produced abnormalities of the inner ear and of the lateral line
    neuromasts, with hearing and balance deficits described by the authors as present "to
    some extent". The ClinGen curation counts this model, and a rescue of the phenotype,
    among the evidence supporting the gene-disease relationship - and still classifies the
    total as Limited.
  genes:
  - preferred_term: SLC44A4
    term:
      id: hgnc:13941
      label: SLC44A4
  modeled_mechanisms:
  - target: Mid-Frequency Sensorineural Hearing Loss
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    description: >-
      A hearing and balance deficit does appear when the fish orthologue is knocked down,
      which is the reason to think the gene matters for the ear at all. What it cannot model
      is the disease: fish have no cochlea and no mid-frequency place code, so the one
      clinically distinctive feature of DFNA72 has no counterpart in this system.
    limitations: >-
      Three separate gaps. First, direction and dose: this is a knockdown approximating
      complete loss of function, while patients are heterozygous for a missense allele whose
      effect on the protein was never assayed. Second, transience and specificity: morpholino
      knockdown is a developmental, non-genetic manipulation, and morphant inner-ear
      phenotypes are a known source of off-target artefact - no stable mutant line has been
      made. Third, the phenotype is gross malformation of the ear and neuromasts, which is
      developmental, whereas the human disease is postlingual and appears in an ear that
      formed normally. Fidelity is LOW because the model and the disease differ in mechanism
      class, not only in degree.
    readouts:
    - name: Inner ear and lateral line neuromast morphology
      target: Mid-Frequency Sensorineural Hearing Loss
      direction: ALTERED
      interpretation: >-
        Structural abnormality of the fish auditory and mechanosensory organs following
        knockdown, the primary observation of the model.
      evidence:
      - reference: PMID:28013291
        reference_title: "SLC44A4 mutation causes autosomal dominant hereditary postlingual non-syndromic mid-frequency hearing loss."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In the zebrafish model, downregulation of slc44a4 using morpholinos led to significant abnormalities in the zebrafish inner ear and lateral line neuromasts and contributed, to some extent, to disabilities in hearing and balance."
        explanation: >-
          The structural and behavioural result together, in the authors' own hedged
          phrasing.
    evidence:
    - reference: CGGV:assertion_3ddbe083-55c3-483b-8c32-fc9bdbef10c6-2022-11-22T170000.000Z
      reference_title: "SLC44A4 / nonsyndromic genetic hearing loss (Limited)"
      supports: SUPPORT
      evidence_source: OTHER
      snippet: "This gene-disease relationship is also supported by an animal model and rescue of the phenotype as well as expression level data (PMID: 28013291)."
      explanation: >-
        Independent confirmation that the model, including its rescue arm, was weighed by the
        expert panel and treated as informative for the gene-disease relationship.
discussions:
- discussion_id: dfna72_gene_disease_validity_is_limited
  kind: KNOWLEDGE_GAP
  prompt: >-
    Is SLC44A4 a hearing loss gene? Nine years after the founding report there is still one
    proband, one publication and one variant, and ClinGen has twice classified the
    relationship Limited. What would a second family change, and what should a laboratory do
    with an SLC44A4 hit in the meantime?
  attaches_to:
  - genetic#SLC44A4
  - pathophysiology#SLC44A4 p.Met156Val Heterozygous Variant
  - diagnosis#SLC44A4 on hearing loss gene panels, read against a Limited gene-disease classification
  rationale: >-
    This is the gap that governs how everything else in the entry should be read. The Hearing
    Loss Gene Curation Expert Panel first assessed SLC44A4 in April 2018, re-assessed it in
    November 2022, and the classification did not move: Limited, on one variant in one
    proband with a segregation LOD of 2.1, plus a morpholino model and expression data from
    the same paper. Nothing in the published record has been added since.

    The asymmetry worth stating is that Limited is not Disputed and not Refuted. The panel
    notes explicitly that no convincing contradictory evidence has emerged. So the honest
    position is neither that DFNA72 is established nor that it has been retired - it is that
    a single kindred has never been replicated, and that the sequencing volume of the last
    decade means the absence of a second family is beginning to be informative in itself.

    What would resolve it is ordinary: a second unrelated pedigree with a segregating
    SLC44A4 variant and a mid-frequency audiogram. Failing that, a mechanistic result that
    connects the gene to cochlear physiology - inner-ear expression, an efferent function
    measurement in a carrier, or a knock-in animal carrying p.Met156Val - would move it more
    than another association would.
  evidence:
  - reference: CGGV:assertion_3ddbe083-55c3-483b-8c32-fc9bdbef10c6-2022-11-22T170000.000Z
    reference_title: "SLC44A4 / nonsyndromic genetic hearing loss (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "This gene-disease pair was originally evaluated by the Hearing Loss GCEP on 04/24/2018. It was reevaluated on 11/16/2022. As a result of this reevaluation, the classification did not change from limited (SOP Version 9)."
    explanation: >-
      Two independent assessments four years apart reaching the same conclusion, which is
      what makes this a stable gap rather than a curation that is merely out of date.
  - reference: CGGV:assertion_3ddbe083-55c3-483b-8c32-fc9bdbef10c6-2022-11-22T170000.000Z
    reference_title: "SLC44A4 / nonsyndromic genetic hearing loss (Limited)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Although more evidence is needed to support a causal role, no convincing evidence has emerged that contradicts the gene-disease relationship."
    explanation: >-
      The reason this is a knowledge gap and not a refutation, in the panel's own framing.
- discussion_id: dfna72_morphant_versus_human_heterozygous_missense
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    The only in vivo evidence for DFNA72 is a transient morpholino knockdown in a fish
    without a cochlea, standing in for a heterozygous human missense allele causing
    postlingual mid-frequency loss. How much of that model transfers?
  attaches_to:
  - animal_models#slc44a4 morpholino knockdown zebrafish
  - pathophysiology#Loss of Efferent Protection of Outer Hair Cells
  - mechanistic_hypotheses#cholinergic_efferent_model
  rationale: >-
    The model and the disease differ on every axis that usually matters. Dose: the morphant
    approximates loss of the gene product, the patients carry one missense allele alongside a
    normal one. Timing: morpholino knockdown acts through early development and produces
    gross malformation of the ear and neuromasts, while the human loss is postlingual in an
    ear that formed normally. Anatomy: the distinguishing clinical feature of DFNA72 is a
    mid-frequency audiogram, and a fish has neither a cochlea nor a tonotopic place code in
    which "mid-frequency" means anything.

    There is also a methodological point that is specific rather than generic. Morpholino
    phenotypes in the zebrafish inner ear are a well-known site of off-target effect, and the
    usual remedy is a stable mutant line; none exists for slc44a4. The knockdown was rescued,
    which the expert panel counted, and rescue does control for some off-target effects - but
    it controls for the knockdown's specificity, not for the relevance of a null phenotype to
    a heterozygous missense disease.

    The consequence for this entry is concrete. The fish supports "this gene is needed for a
    normal ear" and does not support any step of the cholinergic efferent chain, which is why
    the model's modeled_mechanisms link points at the phenotype rather than at an internal
    node, and why the efferent nodes carry no model evidence at all.
  evidence:
  - reference: PMID:28013291
    reference_title: "SLC44A4 mutation causes autosomal dominant hereditary postlingual non-syndromic mid-frequency hearing loss."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In the zebrafish model, downregulation of slc44a4 using morpholinos led to significant abnormalities in the zebrafish inner ear and lateral line neuromasts and contributed, to some extent, to disabilities in hearing and balance."
    explanation: >-
      The model result, including the authors' own qualifier "to some extent" on the
      functional arm.
  - reference: PMID:28013291
    reference_title: "SLC44A4 mutation causes autosomal dominant hereditary postlingual non-syndromic mid-frequency hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical, genetic, and functional investigations were performed to identify the causative mutation in a distinctive Chinese family with postlingual non-syndromic mid-frequency sensorineural hearing loss."
    explanation: >-
      The human side of the mismatch: postlingual onset and a mid-frequency configuration,
      neither of which the fish model can represent.
- discussion_id: dfna72_substrate_identity_of_slc44a4
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does SLC44A4 transport choline or thiamine pyrophosphate, and does the DFNA72 mechanism
    survive if the answer is thiamine pyrophosphate?
  attaches_to:
  - pathophysiology#Reduced Choline Uptake and Acetylcholine Release
  - mechanistic_hypotheses#thiamine_pyrophosphate_transport_model
  - mechanistic_hypotheses#cholinergic_efferent_model
  rationale: >-
    The first step of the published DFNA72 mechanism is choline uptake, and the only direct
    characterisation of human SLC44A4 says the protein carries thiamine pyrophosphate with
    high affinity and is not affected by choline at all. The two results come from different
    cell backgrounds - SH-SY5Y neuroblastoma against ARPE19 - and neither from inner-ear
    tissue, so they are not a clean contradiction, but they cannot both be the whole story.

    The family name is part of how this happened. SLC44A4 belongs to the "choline
    transporter-like" family, which is a homology label, and the hearing-loss report states
    the choline function as an established premise rather than measuring it. The uptake
    difference that report measured is real; what it measured uptake *of* rests on that
    premise.

    The stakes are not merely nomenclatural. On the thiamine pyrophosphate reading the
    acetylcholine-release result needs another explanation, the olivocochlear efferent
    framing loses its rationale, and a cochlear mechanism would have to be built around a
    cofactor for pyruvate dehydrogenase and transketolase instead. No one has attempted that,
    and this entry does not, because nothing has been published to build it from.

    The resolving experiment is a side-by-side choline and thiamine pyrophosphate uptake
    comparison in one system, with and without the p.Met156Val allele.
  evidence:
  - reference: PMID:24379411
    reference_title: "Molecular identification and functional characterization of the human colonic thiamine pyrophosphate transporter."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "highly specific for TPP and not affected by free thiamine, thiamine monophosphate, or choline"
    explanation: >-
      The observation that opens the gap - choline does not compete with this transport.
  - reference: PMID:28013291
    reference_title: "SLC44A4 mutation causes autosomal dominant hereditary postlingual non-syndromic mid-frequency hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing revealed SLC44A4, which encodes the choline transport protein, as the pathogenic gene in this family."
    explanation: >-
      The other side of the gap, and the point at which the choline attribution enters the
      hearing-loss literature as an assumption.

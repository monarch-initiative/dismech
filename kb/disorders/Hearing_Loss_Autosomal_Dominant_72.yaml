mechanistic_hypotheses:
- hypothesis_group_id: cholinergic_efferent_model
  hypothesis_label: Reduced cholinergic supply to the olivocochlear efferent synapse on outer hair cells
  status: EMERGING
  description: >-
    The mechanism proposed by the reporting authors, and the only one anyone has proposed.
    Its three links were each measured in a different system and never in the same one.

    The first link is cellular and is the strongest: SH-SY5Y neuroblastoma cells transfected
    with wild-type SLC44A4 took up more choline and released more acetylcholine than cells
    transfected with the mutant construct, so the variant reduces the output of the
    choline-acetylcholine pathway in a cell that can be made to run it.

    The second link is anatomical and is imported: the medial olivocochlear bundle synapses
    cholinergically onto outer hair cells, and in mice that synapse is protective -
    overexpressing the alpha9 nicotinic receptor subunit in outer hair cells reduces acoustic
    injury. That establishes the pathway matters for cochlear survival; it says nothing about
    SLC44A4.

    The third link is the one with no data at all. Nobody has shown that SLC44A4 is expressed
    in olivocochlear efferent neurons, or that acetylcholine release at that particular
    synapse depends on it, or that a heterozygous p.Met156Val allele changes anything in a
    cochlea. The zebrafish experiment that is sometimes read as filling this gap is a
    morpholino knockdown showing gross inner-ear and neuromast malformation, which is a
    developmental phenotype in a fish that has no cochlea and no mid-frequency place code.

    EMERGING is therefore the honest status, and the authors' own verb - "may cause" - is
    the reason.
  evidence:
  - reference: PMID:28013291
    reference_title: "SLC44A4 mutation causes autosomal dominant hereditary postlingual non-syndromic mid-frequency hearing loss."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We concluded that mutation of SLC44A4 may cause defects in the Choline- acetylcholine system, which is crucial to the efferent innervation of hair cells in the olivocochlear bundle for the maintenance of physiological function of outer hair cells and the protection of hair cells from acoustic injury, leading to hearing loss."
    explanation: >-
      The hypothesis in the authors' own words, hedged in the authors' own words. Graded
      OTHER because the sentence is the paper's synthesis across its human, cell and fish
      arms rather than the report of any one of them.
  - reference: PMID:28013291
    reference_title: "SLC44A4 mutation causes autosomal dominant hereditary postlingual non-syndromic mid-frequency hearing loss."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SH-SY5Y cells transfected with SLC44A4 showed higher choline uptake and acetylcholine release than that of cells transfected with mutant SLC44A4."
    explanation: >-
      The measured functional difference between wild-type and mutant protein, and the only
      quantitative support the hypothesis has.
- hypothesis_group_id: thiamine_pyrophosphate_transport_model
  hypothesis_label: SLC44A4 is a thiamine pyrophosphate transporter and the choline step is misassigned
  status: ALTERNATIVE
  description: >-
    SLC44A4 sits in the SLC44 "choline transporter-like" family, and the family name is where
    the choline attribution comes from. The one study that characterised the human protein
    directly reaches a different answer: expressed in ARPE19 cells it drives high-affinity,
    saturable uptake of thiamine pyrophosphate with an apparent Km of 0.17 micromolar, and
    that uptake is unaffected by free thiamine, thiamine monophosphate, or choline. Its
    tissue distribution is colonic, at the apical membrane of polarised epithelium.

    If that is the protein's actual transport activity, the DFNA72 mechanism as published
    loses its first step, and the disease would need a different account - perhaps a
    thiamine-pyrophosphate-dependent one, since thiamine pyrophosphate is the cofactor of
    pyruvate dehydrogenase and transketolase and the cochlea is metabolically demanding, but
    nothing at all has been published along those lines.

    Recorded as ALTERNATIVE rather than as a refutation because the two are not strictly
    exclusive. A transporter can have more than one substrate, the assays were done in
    different cell backgrounds, and neither was done in inner-ear tissue. What would settle
    it is a choline and thiamine pyrophosphate uptake comparison in the same system, with
    and without the p.Met156Val allele. It has not been done.
  evidence:
  - reference: PMID:24379411
    reference_title: "Molecular identification and functional characterization of the human colonic thiamine pyrophosphate transporter."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Here we report on the molecular identification of the colonic TPP uptake system as the product of the SLC44A4 gene."
    explanation: >-
      The competing substrate assignment, from the study that cloned and expressed the human
      protein.
  - reference: PMID:24379411
    reference_title: "Molecular identification and functional characterization of the human colonic thiamine pyrophosphate transporter."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "highly specific for TPP and not affected by free thiamine, thiamine monophosphate, or choline"
    explanation: >-
      The direct observation that makes this an alternative and not merely an additional
      activity: choline did not compete with the transport this assay measured.
  - reference: PMID:28013291
    reference_title: "SLC44A4 mutation causes autosomal dominant hereditary postlingual non-syndromic mid-frequency hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing revealed SLC44A4, which encodes the choline transport protein, as the pathogenic gene in this family."
    explanation: >-
      The competing assignment, stated as settled fact in the DFNA72 report. Quoted here to
      show that the choline attribution enters the hearing-loss literature as a premise
      rather than as a measurement.
pathophysiology:
- name: SLC44A4 p.Met156Val Heterozygous Variant
  description: >-
    A single missense allele, c.466A>G (p.Met156Val), in a family of Chinese ancestry. It is
    the only SLC44A4 variant ever curated in relation to hearing loss. ClinVar records it
    against the DFNA72 concept without a classification from unflagged submissions, and no
    other SLC44A4 variant carries a pathogenic or likely pathogenic classification for this
    disease, so the allelic spectrum of DFNA72 is a single change in a single kindred.

    The reporting authors did not assay the mutant protein's stability, localisation or
    oligomerisation, so how a heterozygous missense change produces a dominant phenotype is
    unaddressed. The expert panel records the reported mechanism as loss of function, which
    for a dominant disease implies haploinsufficiency, but no truncating allele, deletion or
    dosage evidence exists to support that reading.

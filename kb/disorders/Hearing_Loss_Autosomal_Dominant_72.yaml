- name: Reduced Choline Uptake and Acetylcholine Release
  description: >-
    In SH-SY5Y neuroblastoma cells, transfection with wild-type SLC44A4 produced higher
    choline uptake and higher acetylcholine release than transfection with the mutant
    construct. This is the only functional measurement made on the DFNA72 allele, and it is
    a comparison between two transfected constructs in a cell line, not a measure of what a
    heterozygous carrier's cells do.

    Whether this node exists at all depends on which hypothesis is right: on the
    thiamine-pyrophosphate reading of SLC44A4 the protein does not carry choline, and the
    difference measured here would need another explanation.

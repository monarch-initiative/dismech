    - cholinergic_efferent_model
  evidence:
  - reference: PMID:12486177
    reference_title: "Efferent protection from acoustic injury is mediated via alpha9 nicotinic acetylcholine receptors on outer hair cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "These data demonstrate that efferent protection is mediated via the alpha9 nAChR in the outer hair cells and provide direct evidence for a protective role, in vivo, of a member of the nAChR family."
    explanation: >-
      Establishes that the cholinergic efferent synapse onto outer hair cells is protective.
      Indirect with respect to DFNA72: the experiment is a mouse transgenic overexpressing a
      receptor subunit, and involves neither SLC44A4 nor a human allele.
  - reference: PMID:12486177
    reference_title: "Efferent protection from acoustic injury is mediated via alpha9 nicotinic acetylcholine receptors on outer hair cells."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "Here, we show that overexpression of alpha9 nAChR in the outer hair cells of bacterial artificial chromosome transgenic mice significantly reduces acoustic injury from exposures causing either temporary or permanent damage, without changing pre-exposure cochlear sensitivity to low- or moderate-level sound."
    explanation: >-
      The measurement behind the protection claim, and the detail that matters for onset:
      the effect is on injury from exposure, not on baseline thresholds.
phenotypes:
- name: Mid-Frequency Sensorineural Hearing Loss
  category: Auditory
  description: >-
    Sensorineural hearing loss with a mid-frequency configuration in the single reported
    kindred. This is what makes DFNA72 clinically recognisable: dominant nonsyndromic
    hearing loss is usually high-frequency and sloping, and a mid-frequency ("U-shaped" or
    "cookie-bite") audiogram is the exception in the DFNA series. No threshold values,
    laterality, severity grades or progression data are published for this family, so none
    are curated. No frequency band is recorded because the denominator is one pedigree.
  phenotype_term:
    preferred_term: Mid-frequency hearing loss
    term:
      id: HP:0012781
      label: Mid-frequency hearing loss
  evidence:
  - reference: PMID:28013291
    reference_title: "SLC44A4 mutation causes autosomal dominant hereditary postlingual non-syndromic mid-frequency hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical, genetic, and functional investigations were performed to identify the causative mutation in a distinctive Chinese family with postlingual non-syndromic mid-frequency sensorineural hearing loss."
    explanation: >-
      The clinical description of the family, and the source of both the configuration and
      the word "distinctive" that the authors applied to it.
  - reference: PMID:37371710
    reference_title: "Autosomal Dominant Non-Syndromic Hearing Loss (DFNA): A Comprehensive Narrative Review."
    supports: SUPPORT
    evidence_source: OTHER
    directness: INDIRECT
    snippet: "in most cases, HL tends to be bilateral, post-lingual in onset (childhood to early adulthood), high-frequency (sloping audiometric configuration), progressive, and variable in severity (mild to profound degree)"
    explanation: >-
      The class background against which the mid-frequency configuration is unusual. Indirect
      because the review describes autosomal dominant nonsyndromic hearing loss as a group
      and does not discuss DFNA72.
- name: Postlingual Onset
  category: Auditory
  description: >-
    The loss in the reported family was postlingual - it appeared after speech had been
    acquired rather than being present at birth. No age of onset is given for any individual,
    and with one pedigree there is no basis for an onset range.
  phenotype_term:
    preferred_term: Postlingual sensorineural hearing impairment
    term:
      id: HP:0008596
      label: Postlingual sensorineural hearing impairment
  notes: >-
    Deliberately unwired: this record has no incoming causal edge. Onset timing is a
    property of when the hearing loss record appears, not a separate consequence of the
    pathophysiology, and drawing an edge into it from the outer hair cell node would assert
    that the efferent model explains the timing. The model is compatible with a late onset -
    a cumulative-exposure mechanism should spare a newborn - but nothing has tested that,
    and an edge would state it.
  evidence:
  - reference: PMID:28013291
    reference_title: "SLC44A4 mutation causes autosomal dominant hereditary postlingual non-syndromic mid-frequency hearing loss."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical, genetic, and functional investigations were performed to identify the causative mutation in a distinctive Chinese family with postlingual non-syndromic mid-frequency sensorineural hearing loss."
    explanation: The onset descriptor for the family, from the paper's clinical summary.
genetic:
- name: SLC44A4
  notes: >-
    SLC44A4 is one of five human SLC44 family members, named "choline transporter-like"
    proteins by homology rather than by assay. Which substrate the protein actually carries
    is unresolved and is curated as two competing hypotheses in this entry: the hearing-loss
    literature treats it as a choline transporter, while the study that cloned and expressed
    the human protein identifies it as the colonic apical thiamine pyrophosphate transporter,
    with uptake unaffected by choline.

    Its documented expression is colonic and high, negligible in small intestine. No
    inner-ear expression study specific to SLC44A4 has been published; the ClinGen curation
    counts "expression level data" among the supporting evidence, all of it from the single
    2017 report.

    The gene is also known as a tumour-associated antigen and as the Colon Cancer
    Antigen-associated protein in other literatures, which is not curated here.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: SLC44A4
    term:
      id: hgnc:13941
      label: SLC44A4
  evidence:
  - reference: CGGV:assertion_3ddbe083-55c3-483b-8c32-fc9bdbef10c6-2022-11-22T170000.000Z
    reference_title: "SLC44A4 / nonsyndromic genetic hearing loss (Limited)"
    supports: SUPPORT

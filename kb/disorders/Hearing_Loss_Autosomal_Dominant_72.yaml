  - reference: PMID:28013291
    reference_title: "SLC44A4 mutation causes autosomal dominant hereditary postlingual non-syndromic mid-frequency hearing loss."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We concluded that mutation of SLC44A4 may cause defects in the Choline- acetylcholine system, which is crucial to the efferent innervation of hair cells in the olivocochlear bundle for the maintenance of physiological function of outer hair cells and the protection of hair cells from acoustic injury, leading to hearing loss."
    explanation: >-
      The only published statement placing the lesion at the olivocochlear efferent synapse.
      It is a conclusion drawn across systems and hedged with "may", which is why every
      edge on this chain is enrolled in the cholinergic_efferent_model hypothesis group
      rather than asserted as established.
- name: Loss of Efferent Protection of Outer Hair Cells
  description: >-
    Outer hair cells that receive weakened cholinergic efferent input. What is established -
    in mice, not in this disease - is that the alpha9 nicotinic receptor at that synapse is
    protective: overexpressing it in outer hair cells reduces acoustic injury from exposures
    that otherwise cause temporary or permanent damage, without changing baseline
    sensitivity. The inference DFNA72 needs is the mirror image, that weakening the same
    input leaves outer hair cells vulnerable over years of ordinary sound exposure.

    That inference is consistent with a postlingual, later-onset loss rather than a
    congenital one, and it is the only part of the model with a natural explanation for the
    onset. It has not been tested in a carrier.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: cochlear outer hair cell
    term:
      id: CL:0000601
      label: cochlear outer hair cell
  downstream:

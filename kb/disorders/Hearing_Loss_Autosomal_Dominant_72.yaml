name: Hearing Loss Autosomal Dominant 72
category: Mendelian
creation_date: "2026-09-04T00:00:00Z"
synonyms:
- DFNA72
- deafness, autosomal dominant 72
- autosomal dominant nonsyndromic deafness 72
- SLC44A4-related autosomal dominant nonsyndromic hearing loss
description: >-
  DFNA72 is autosomal dominant nonsyndromic sensorineural hearing loss attributed to a
  heterozygous SLC44A4 variant. It is one of the thinnest gene-disease relationships in the
  DFNA series and this entry is written around that fact rather than around a mechanism.

  The whole clinical literature is one Chinese kindred reported in 2017, in which
  whole-exome sequencing found SLC44A4 c.466A>G (p.Met156Val) segregating with postlingual,
  non-syndromic, mid-frequency sensorineural hearing loss. The ClinGen Hearing Loss Gene
  Curation Expert Panel evaluated the pair in 2018, re-evaluated it in 2022, and both times
  classified it Limited - one proband, one publication, a segregation LOD of 2.1 - while
  noting that nothing has emerged to contradict it. No second family has been published in
  the nine years since. A reader should treat everything below as one family's disease until
  that changes.

  The audiometric configuration is the one clinically distinctive feature. Autosomal dominant
  nonsyndromic hearing loss is characteristically high-frequency and sloping; this family's
  loss is mid-frequency, which is uncommon enough in the DFNA series that it carried the
  original report's title.

  The proposed mechanism is cholinergic and efferent rather than about the hair bundle. The
  reporting authors framed SLC44A4 as a choline transport protein, showed that cells
  expressing the mutant took up less choline and released less acetylcholine than cells
  expressing wild type, and reasoned from there to the olivocochlear efferent bundle, whose
  cholinergic synapses onto outer hair cells are known - from mouse work on the alpha9
  nicotinic receptor - to protect the organ of Corti from acoustic injury. That chain is a
  hypothesis assembled across three systems, and the authors wrote it with "may cause". It
  is curated here as EMERGING, and every causal edge along it is hedged accordingly.

  There is a specific reason not to state the choline step as settled. The only direct
  molecular characterisation of human SLC44A4 identifies it as the colonic thiamine
  pyrophosphate transporter, with uptake that is high-affinity and specific for thiamine
  pyrophosphate and explicitly *not* affected by choline. Two literatures therefore assign
  the same protein two different substrates, and no inner-ear transport assay has been
  published for either. The alternative is recorded as its own hypothesis instead of being
  left out.

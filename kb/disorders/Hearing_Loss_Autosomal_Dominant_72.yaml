    explanation: >-
      The expert panel's bottom line, and the reason this record is CAUSATIVE with a caveat
      rather than a settled gene-disease assertion.
  - reference: CGGV:assertion_3ddbe083-55c3-483b-8c32-fc9bdbef10c6-2022-11-22T170000.000Z

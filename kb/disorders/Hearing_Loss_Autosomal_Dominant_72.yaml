      Cuts against the node as stated. In the assay that characterised human SLC44A4
      directly, choline did not compete with the transport the protein performs, which is
      hard to reconcile with a choline uptake step.
- name: Impaired Cholinergic Olivocochlear Efferent Signalling
  description: >-
    The hypothesised organ-level consequence: less acetylcholine available at the medial
    olivocochlear synapse onto outer hair cells. Nothing has been measured here in DFNA72.
    No SLC44A4 expression has been reported in olivocochlear neurons, no efferent function
    test - contralateral suppression of otoacoustic emissions, for example - has been
    published in a carrier, and no animal carries the human allele.

    The node is kept in the graph rather than dropped because it is the step the published
    mechanism turns on, and leaving it out would make the chain look shorter and better
    supported than it is.

- name: Cortical Layering Defect
  description: >-
    Abnormal cortical layering in the knockout mouse. It is not corrected by
    mannose restriction from weaning, together with cognitive performance,
    which suggests it arises earlier in development. Its link to the
    GDP-mannose excess is not shown directly, so it has no upstream edge.
  biological_scale: TISSUE
  cell_types:

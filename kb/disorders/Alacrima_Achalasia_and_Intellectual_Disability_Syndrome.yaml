  evidence:
  - reference: PMID:33755596
    reference_title: "GMPPA defects cause a neuromuscular disorder with α-dystroglycan hyperglycosylation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we showed that Gmppa-KO mice recapitulated cognitive and motor deficits. As structural correlates, we found cortical layering defects, progressive neuron loss, and myopathic alterations."

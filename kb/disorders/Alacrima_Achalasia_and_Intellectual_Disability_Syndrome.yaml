    quote_role: BACKGROUND
    snippet: "Topical lubricants and artificial tears are the main therapies used to reduce the risk of complications like severe scarring, perforation, or blindness"
    explanation: Standard management of alacrima.
- name: Oral N-Acetylglucosamine Supplementation
  description: >-
    Experimental. In a nonblinded pilot of three patients, oral GlcNAc at
    4-6 g/day improved tear production and reduced corneal inflammation, with
    no change in growth or development. The authors' rationale is that GlcNAc
    may benefit the mannosylation phenotype by reducing inflammation.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: N-acetylglucosamine
      term:
        id: CHEBI:506227
        label: N-acetyl-D-glucosamine
  therapeutic_modality: SMALL_MOLECULE
  evidence:
  - reference: PMID:40706141
    reference_title: "Phenotypic and genotypic description of GMPPA-congenital disorder of glycosylation: A review of 26 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Under treatment with GlcNAc (4-6 g/day), we noted improved tear production in our 3 patients."
    explanation: Uncontrolled three-patient observation.
  - reference: PMID:40706141
    reference_title: "Phenotypic and genotypic description of GMPPA-congenital disorder of glycosylation: A review of 26 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No change was observed in growth or development"
    explanation: No effect on growth or development in the same three patients.
- name: Dietary Mannose Restriction
  description: >-
    Experimental and so far only in mice. Restricting dietary mannose from
    weaning corrected alpha-dystroglycan hyperglycosylation, muscle morphology
    and neuron loss in Gmppa knockout mice, but not cortical layering or
    cognition.
  treatment_term:
    preferred_term: mannose-restricted diet
    term:
      id: NCIT:C15447
      label: Dietary Intervention
  therapeutic_modality: BEHAVIORAL
  target_mechanisms:
  - target: Glycoprotein Hypermannosylation
    description: Lowers the mannose supply that drives hyperglycosylation.
    evidence:
    - reference: PMID:33755596
      reference_title: "GMPPA defects cause a neuromuscular disorder with α-dystroglycan hyperglycosylation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In mice, dietary mannose restriction beginning after weaning corrected α-DG hyperglycosylation and abundance, normalized skeletal muscle morphology, and prevented neuron degeneration and the development of motor deficits."
      explanation: Mouse rescue.
  evidence:
  - reference: PMID:33755596
    reference_title: "GMPPA defects cause a neuromuscular disorder with α-dystroglycan hyperglycosylation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In mice, dietary mannose restriction beginning after weaning corrected α-DG hyperglycosylation and abundance, normalized skeletal muscle morphology, and prevented neuron degeneration and the development of motor deficits."
    explanation: Mouse evidence only.
  - reference: PMID:40706141
    reference_title: "Phenotypic and genotypic description of GMPPA-congenital disorder of glycosylation: A review of 26 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Emerging therapeutic options, such as a mannose-depleted diet and GlcNAc supplementation, warrant further investigation to establish their safety and efficacy."
    explanation: States that safety and efficacy in patients are not established.
animal_models:
- name: Gmppa knockout mouse
  species: Mouse
  genotype: Gmppa-/-
  publication: PMID:33755596
  description: >-
    Recapitulates cognitive and motor deficits, with cortical layering defects,
    progressive neuron loss, myopathy, raised GDP-mannose and
    alpha-dystroglycan hyperglycosylation. Dietary mannose restriction rescues
    the muscle, neuron-loss and motor phenotypes.
  evidence:
  - reference: PMID:33755596
    reference_title: "GMPPA defects cause a neuromuscular disorder with α-dystroglycan hyperglycosylation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here, we showed that Gmppa-KO mice recapitulated cognitive and motor deficits."
    explanation: Behavioural recapitulation.
  modeled_mechanisms:
  - target: Glycoprotein Hypermannosylation
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: The same alpha-dystroglycan hyperglycosylation is found in mouse and human tissue.
    limitations: >-
      The model is characterized for its neuromuscular and cognitive features;
      tear production and esophageal motility, the two features present in
      every patient, are not among the phenotypes described for it.
    evidence:
    - reference: PMID:33755596
      reference_title: "GMPPA defects cause a neuromuscular disorder with α-dystroglycan hyperglycosylation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Thus, its disruption enhanced mannose incorporation into glycoproteins, including α-DG in mice and humans."
      explanation: Shared glycosylation defect in mouse and human.
  - target: Myopathy
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: The knockout develops myopathic alterations and motor deficits.
    limitations: >-
      Muscle findings are not tabulated in the 26-patient review, so how often
      patients have a comparable myopathy is not established.
    evidence:
    - reference: PMID:33755596
      reference_title: "GMPPA defects cause a neuromuscular disorder with α-dystroglycan hyperglycosylation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we showed that Gmppa-KO mice recapitulated cognitive and motor deficits. As structural correlates, we found cortical layering defects, progressive neuron loss, and myopathic alterations."
      explanation: Myopathy in the knockout.
  - target: Progressive Neuron Loss
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: The knockout shows progressive neuron loss.
    limitations: Neuron loss has not been documented in patient brain tissue.
    evidence:
    - reference: PMID:33755596
      reference_title: "GMPPA defects cause a neuromuscular disorder with α-dystroglycan hyperglycosylation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we showed that Gmppa-KO mice recapitulated cognitive and motor deficits. As structural correlates, we found cortical layering defects, progressive neuron loss, and myopathic alterations."
      explanation: Neuron loss in the knockout.
discussions:
- discussion_id: autonomic_mechanism_unknown
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Autonomic Nervous System Dysfunction
  prompt: >-
    How does GDP-mannose excess and glycoprotein hypermannosylation produce the
    defining alacrima and achalasia?
  rationale: >-
    The chain is established for muscle and neurons in the knockout mouse, but
    the two features present in every patient are attributed to autonomic
    dysfunction with no described link to the glycosylation defect, and the
    mouse model is not characterized for tear production or esophageal
    motility. The autonomic node therefore has no upstream edge.
  evidence:
  - reference: PMID:40706141
    reference_title: "Phenotypic and genotypic description of GMPPA-congenital disorder of glycosylation: A review of 26 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Although the pathomechanism of these autonomic symptoms is not understood, the presence of these features signifies a strong association with GMPPA-CDG"
    explanation: States that the pathomechanism of the autonomic features is not understood.

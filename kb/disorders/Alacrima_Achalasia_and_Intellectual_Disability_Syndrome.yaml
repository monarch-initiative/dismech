name: Alacrima, Achalasia, and Intellectual Disability Syndrome
creation_date: "2026-10-23T15:00:00Z"
category: Mendelian
synonyms:
- AAMR syndrome
- GMPPA-CDG
- GMPPA-congenital disorder of glycosylation
- alacrima, achalasia, and mental retardation syndrome
- alacrima, achalasia, and impaired intellectual development syndrome
description: >-
  Alacrima, achalasia, and intellectual disability syndrome (AAMR, GMPPA-CDG) is
  an autosomal recessive congenital disorder of glycosylation caused by
  biallelic GMPPA variants. Absent tear production, achalasia and developmental
  delay are present from infancy in every reported patient, and intellectual
  disability in nearly all; growth impairment, hypotonia, gait abnormality,
  hearing loss, hypohidrosis and other ectodermal findings are variable. It
  resembles triple A syndrome but lacks adrenal insufficiency.

  GMPPA is the catalytically inactive partner of GMPPB, the enzyme that makes
  GDP-mannose. GMPPA binds GDP-mannose and acts as an allosteric feedback
  inhibitor of GMPPB. Losing it leaves GMPPB unrestrained, so GDP-mannose rises
  and excess mannose is incorporated into glycoproteins, including
  alpha-dystroglycan. Unlike most glycosylation disorders, the defect is
  dysregulation and hyperglycosylation rather than a shortage of glycan
  synthesis. In Gmppa knockout mice, alpha-dystroglycan hyperglycosylation
  increases its turnover and lowers its abundance, and the mice develop
  myopathy, progressive neuron loss and cortical layering defects. A
  mannose-restricted diet from weaning corrects the muscle, neuron-loss and
  motor phenotypes but not cortical layering or cognition. The pathomechanism
  of the autonomic features, alacrima and achalasia, is not understood.
disease_term:
  preferred_term: alacrima, achalasia, and intellectual disability syndrome
  term:
    id: MONDO:0014219
    label: alacrima, achalasia, and intellectual disability syndrome
parents:
- congenital disorder of glycosylation
notes: >-
  No GeneReviews chapter is specific to this disorder: `just check-genereviews`
  reports NO_CHAPTER against the 2026-09-10 Bookshelf index, and the PubMed
  query "GMPPA AND genereviews[book]" (2026-10-23) returns only the retired
  congenital disorders of glycosylation overview chapter, which is not used as
  a baseline. The 2025 review of 26 patients (PMID:40706141) is the phenotype
  baseline; its frequencies use per-feature denominators, which differ because
  not every report describes every feature.
inheritance:
- name: Autosomal recessive
  description: >-
    Biallelic GMPPA variants, homozygous in consanguineous families. A founder
    frameshift (c.265dup, p.Leu89fs) occurs homozygously in families of
    Maya-Mam ancestry from Guatemala, and maternal uniparental disomy of
    chromosome 2 has produced homozygosity in one patient.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:24035193
    reference_title: "Mutations in GMPPA cause a glycosylation disorder characterized by intellectual disability and autonomic dysfunction."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "This autosomal-recessive disorder shows many similarities with triple A syndrome, which is characterized by achalasia, alacrima, and variable neurological deficits in combination with adrenal insufficiency."
    explanation: States the recessive inheritance in the gene-discovery report.
  - reference: PMID:31898852
    reference_title: "Evidence of GMPPA founder mutation in indigenous Guatemalan population associated with alacrima, achalasia, and mental retardation syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Notably, both families reported indigenous Maya-Mam heritage and originated from the town of Concepción Chiquirichapa in Quezaltenango, Guatemala."
    explanation: Founder origin of the homozygous c.265dup allele.
  - reference: PMID:40979943
    reference_title: "Achalasia and mental retardation in a child with uniparental disomy of GMPPA treated with POEM."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Herein, we report an AAMR case with maternal UPD of chromosome 2 causing the homozygous mutation of GMPPA."
    explanation: Uniparental disomy as an unusual route to homozygosity.
pathophysiology:
- name: Biallelic GMPPA Loss of Function
  description: >-
    The initiating lesion. Biallelic GMPPA variants remove the regulatory GMPPA
    subunit, which normally inhibits GMPPB.
  biological_scale: MOLECULAR
  genetic_context:
    functional_impact_category: LOSS_OF_FUNCTION
    variant_origin: GERMLINE
  genes:
  - preferred_term: GMPPA
    term:
      id: hgnc:22923
      label: GMPPA
  molecular_functions:
  - preferred_term: GDP-mannose-dependent inhibition of GMPPB
    term:
      id: GO:0004857
      label: enzyme inhibitor activity
    modifier: DECREASED
  downstream:
  - target: Unrestrained GMPPB Activity and GDP-Mannose Excess
    causal_link_type: DIRECT
    description: >-
      Without its inhibitory partner, GMPPB keeps producing GDP-mannose and the
      metabolite accumulates.
    evidence:
    - reference: PMID:24035193
      reference_title: "Mutations in GMPPA cause a glycosylation disorder characterized by intellectual disability and autonomic dysfunction."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Surprisingly, GDP-mannose pyrophosphorylase activity was unchanged and GDP-mannose levels were strongly increased in lymphoblasts of individuals with GMPPA mutations."
      explanation: Raised GDP-mannose with normal pyrophosphorylase activity in cultured patient lymphoblasts.
  evidence:
  - reference: PMID:33755596
    reference_title: "GMPPA defects cause a neuromuscular disorder with α-dystroglycan hyperglycosylation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Increased GDP-mannose levels in skeletal muscle and in vitro assays identified GMPPA as an allosteric feedback inhibitor of GMPPB."
    explanation: >-
      Identifies the molecular function lost. The sentence combines knockout
      mouse muscle with in vitro assays; it is graded by the mouse data.
  - reference: PMID:33986552
    reference_title: "Cryo-EM structures of human GMPPA-GMPPB complex reveal how cells maintain GDP-mannose homeostasis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Unexpectedly, we find that the catalytically inactive subunit GMPPA displays a much higher affinity to GDP-Man than the active subunit GMPPB and, subsequently, inhibits the catalytic activity of GMPPB through a unique C-terminal loop of GMPPA."
    explanation: Structural basis for GMPPA as a GDP-mannose-sensing inhibitor of GMPPB.
- name: Unrestrained GMPPB Activity and GDP-Mannose Excess
  description: >-
    GDP-mannose, the mannose donor for glycosylation, accumulates because its
    synthesis is no longer feedback-limited.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: GDP-mannose biosynthetic process
    term:
      id: GO:0009298
      label: GDP-mannose biosynthetic process
    modifier: INCREASED
  chemical_entities:
  - preferred_term: GDP-mannose
    term:
      id: CHEBI:15820
      label: GDP-alpha-D-mannose
    modifier: INCREASED
  downstream:
  - target: Glycoprotein Hypermannosylation
    causal_link_type: DIRECT
    description: Excess donor drives excess mannose incorporation into glycoproteins.
    evidence:
    - reference: PMID:33755596
      reference_title: "GMPPA defects cause a neuromuscular disorder with α-dystroglycan hyperglycosylation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Thus, its disruption enhanced mannose incorporation into glycoproteins, including α-DG in mice and humans."
      explanation: >-
        Links loss of GMPPA to increased mannose incorporation. The sentence
        covers both mouse and human tissue; it is graded by the mouse data,
        which is the study's main system.
  evidence:
  - reference: PMID:33755596
    reference_title: "GMPPA defects cause a neuromuscular disorder with α-dystroglycan hyperglycosylation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Increased GDP-mannose levels in skeletal muscle and in vitro assays identified GMPPA as an allosteric feedback inhibitor of GMPPB."
    explanation: >-
      Raised GDP-mannose in knockout muscle. The sentence also covers in vitro
      assays; it is graded by the mouse data.
- name: Glycoprotein Hypermannosylation
  description: >-
    Excess mannose is incorporated into glycoproteins, including
    alpha-dystroglycan, which becomes hyperglycosylated. Bound to the general
    glycoprotein biosynthesis term because the sources do not restrict the
    excess to N-linked or O-linked glycans.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: glycoprotein hypermannosylation
    term:
      id: GO:0009101
      label: glycoprotein biosynthetic process
    modifier: INCREASED
  downstream:
  - target: Reduced Alpha-Dystroglycan Abundance
    causal_link_type: DIRECT
    description: Hyperglycosylated alpha-dystroglycan turns over faster, lowering its abundance.
    evidence:
    - reference: PMID:33755596
      reference_title: "GMPPA defects cause a neuromuscular disorder with α-dystroglycan hyperglycosylation."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This increased α-DG turnover and thereby lowered α-DG abundance."
      explanation: The step from hyperglycosylation to reduced alpha-dystroglycan.
  - target: Progressive Neuron Loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Mannose restriction prevents neuron degeneration in the knockout, which
      ties neuron loss to the mannose excess; the intermediate steps are not
      described.
    evidence:
    - reference: PMID:33755596
      reference_title: "GMPPA defects cause a neuromuscular disorder with α-dystroglycan hyperglycosylation."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: MODEL_ORGANISM
      snippet: "In mice, dietary mannose restriction beginning after weaning corrected α-DG hyperglycosylation and abundance, normalized skeletal muscle morphology, and prevented neuron degeneration and the development of motor deficits."
      explanation: >-
        Dietary rescue implicates mannose excess in neuron loss. INDIRECT
        because it is an intervention result, not a demonstration of the path.
  evidence:
  - reference: PMID:33755596
    reference_title: "GMPPA defects cause a neuromuscular disorder with α-dystroglycan hyperglycosylation."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We thus identified GMPPA defects as the first congenital disorder of glycosylation characterized by α-DG hyperglycosylation, to our knowledge"
    explanation: Alpha-dystroglycan hyperglycosylation as the defining glycosylation defect.
- name: Reduced Alpha-Dystroglycan Abundance
  description: >-
    Faster turnover of hyperglycosylated alpha-dystroglycan lowers its
    abundance. Alpha-dystroglycan links the extracellular matrix to the muscle
    cytoskeleton.
  biological_scale: MOLECULAR
  downstream:
  - target: Myopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Correcting alpha-dystroglycan abundance by mannose restriction also
      normalizes muscle morphology in the knockout, tying the myopathy to the

differential_diagnoses:
- name: Triple A syndrome
  description: >-
    AAAS-related achalasia, alacrima and neurological disease with adrenal
    insufficiency. Adrenal insufficiency is absent in GMPPA-CDG and is the main
    distinguishing feature. Curated in Triple_A_Syndrome.
  disease_term:
    preferred_term: triple-A syndrome
    term:
      id: MONDO:0009279
      label: triple-A syndrome
  evidence:
  - reference: PMID:40706141
    reference_title: "Phenotypic and genotypic description of GMPPA-congenital disorder of glycosylation: A review of 26 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Although there were no reports of adrenocorticotropic hormone (ACTH) or cortisol levels, none of the individuals exhibited adrenal insufficiency"
    explanation: >-
      No adrenal insufficiency among 26 patients, although ACTH and cortisol were
      not reported.
diagnosis:
- name: GMPPA molecular testing
  description: >-
    The diagnosis rests on biallelic GMPPA variants. Standard glycosylation
    screening is uninformative: serum transferrin profiles were normal in the
    reported patients.
  evidence:
  - reference: PMID:40706141
    reference_title: "Phenotypic and genotypic description of GMPPA-congenital disorder of glycosylation: A review of 26 cases."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "none reported abnormalities in the serum transferrin profiles or other glycosylated proteins evaluated by mass spectrometry of transferrin isoelectric focusing"
    explanation: A normal transferrin screen does not exclude the disorder.

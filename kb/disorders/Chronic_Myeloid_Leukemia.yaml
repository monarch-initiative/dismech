      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Since tyrosine kinase activity is essential to the transforming function
        of BCR-ABL, an inhibitor of the kinase could be an effective treatment for
        CML.
      explanation: >-
        Imatinib was designed as a specific inhibitor of BCR-ABL tyrosine kinase
        activity, directly supporting the mechanism by which it inhibits the
        constitutive kinase-activation node.
  description: >-
    First-generation tyrosine kinase inhibitor that revolutionized CML treatment.
    Competitively inhibits BCR-ABL1 ATP binding, inducing molecular remission in
    most chronic phase patients. Standard first-line therapy with excellent long-term outcomes.

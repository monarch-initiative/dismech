computational_models:
- name: Patient-Specific CML Tumor-NK Treatment-Cessation ODE Model
  description: >-
    Patient-calibrated three-state ordinary differential-equation model of active,
    TKI-sensitive CML tumor cells; reversible quiescent, niche-bound and
    TKI-insensitive tumor cells; and immune effector cells represented using
    cytolytic NK-cell data. TKI exposure is a time-varying tumor-kill term, while
    immune control incorporates density-dependent searching, handling, recharging,
    and tumor-suppressed effector function and recruitment.
  model_type: KINETIC
  repository_url: https://zenodo.org/records/13939516
  model_id: Zenodo:13939516
  model_software: Wolfram Mathematica 14.1
  model_format: Wolfram Notebook (.nb); Wolfram Language (.m/.wl); CSV/TXT inputs; PDF outputs
  publication: PMID:41102232
  variables:
  - name: Active TKI-sensitive tumor cells
    dataset_identifier: Y
    description: >-
      Proliferating CML tumor-cell state (paper notation T; deposited-code
      identifier Y) subject to TKI and immune-mediated depletion.
    unit: cells
  - name: Quiescent niche-bound tumor cells
    dataset_identifier: X
    description: >-
      Reversible non-proliferating tumor-cell state (paper notation T_N;
      deposited-code identifier X) that is insensitive to TKI in the model.
    unit: cells
  - name: Immune effector-cell abundance
    dataset_identifier: Z
    description: >-
      Effector-cell state (paper notation E; deposited-code identifier Z)
      calibrated using absolute cytolytic NK-cell counts from peripheral blood.
    unit: cells/uL
  - name: Tumor-dependent NK-cell functionality
    dataset_identifier: h
    description: >-
      Dimensionless functional response (paper h(T); deposited code h[Y]) fitted
      from normalized percentages of CD107a-positive NK cells across tumor burdens.
    unit: dimensionless
  - name: BCR-ABL1/ABL1 molecular burden
    dataset_identifier: pontosBcrAblData
    description: >-
      Clinical percentage used as the observed proxy for active tumor-cell burden.
    unit: percent
  - name: Functional immune-cell abundance
    description: >-
      Product of immune effector-cell abundance and modeled NK-cell functionality,
      evaluated in the deposited code as h[Y[t]]*Z[t].
    unit: cells/uL
  - name: Molecular-relapse probability
    dataset_identifier: problossMR3
    description: >-
      Fraction of the 100 retained patient-specific parameter fits whose simulated
      tumor burden exceeds MR3 at 12, 24, or 36 months after treatment cessation.
    unit: fraction
  modeled_mechanisms:
  - target: Uncontrolled Myeloid Proliferation
    relationship: PARTIALLY_RECAPITULATES
    description: >-
      Active CML tumor cells proliferate, transition reversibly to a quiescent
      niche-bound state, and are depleted by lumped TKI and NK-cell effects.
      Longitudinal BCR-ABL1/ABL1 molecular burden calibrates the active tumor-cell
      trajectory for individual patients.
    fidelity: MODERATE
    limitations: >-
      The generic active and quiescent tumor compartments do not reproduce the
      node's BCR-ABL1-driven myeloid-progenitor differentiation, granulocytic
      expansion, marrow anatomy, or hypercellularity. BCR-ABL1/ABL1 is a tumor-load
      proxy rather than an explicit fusion or kinase-signaling state; TKI action is
      a time-switched kill term. The model omits kinase-domain resistance,
      RAS-MAPK, PI3K-AKT, JAK-STAT, apoptosis signaling, genomic evolution, and
      blast-phase progression. Patient-specific tumor-growth and immune-kill
      parameters are non-identifiable from full-dose data alone, and the study has
      no held-out, external, or prospective clinical validation cohort. The
      published and deposited m_K search bounds also differ, so the fitted
      immune-kill contribution is not exactly reproducible from the Methods alone.
    readouts:
    - name: BCR-ABL1/ABL1 tumor-burden trajectory
      target: Uncontrolled Myeloid Proliferation
      description: >-
        Simulated active tumor-cell abundance converted to the clinical
        BCR-ABL1/ABL1 percentage and fitted across full-dose, half-dose, and
        treatment-cessation intervals.
      interpretation: >-
        A patient-calibrated molecular-burden trajectory, not a direct measure of
        marrow myeloid proliferation or lineage output.
      evidence:
      - reference: PMID:41102232
        reference_title: "Predicting treatment-free remission in chronic myeloid leukemia patients using an integrated model of tumor-immune dynamics."
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: >-
          The tumor load data is given as BCR-ABL1/ABL1 ratios (measured in %),
          which we assume to be proportional to tumor load
        explanation: Establishes the clinical molecular ratio as the model's tumor-load observable.
    - name: Patient-specific molecular-relapse probability
      target: Uncontrolled Myeloid Proliferation
      description: >-
        Fraction of retained fits predicting tumor burden above MR3 at 12, 24, or
        36 months after TKI cessation.
      interpretation: >-
        An ensemble-derived model probability evaluated against a full-trajectory
        best-fit reference, not a prospectively validated recurrence probability.
      evidence:
      - reference: PMID:41102232
        reference_title: "Predicting treatment-free remission in chronic myeloid leukemia patients using an integrated model of tumor-immune dynamics."
        supports: SUPPORT
        evidence_source: COMPUTATIONAL
        snippet: >-
          For each of the 75 patients, we obtained the 100 best fits as outlined
          above and defined the predicted probability of relapse at 12, 24 and 36
          months after cessation as the fraction of fits predicting tumor load
          above MR3 (Fig. 4).
        explanation: Defines the patient-specific ensemble relapse readout and its time horizons.
    evidence:
    - reference: PMID:41102232
      reference_title: "Predicting treatment-free remission in chronic myeloid leukemia patients using an integrated model of tumor-immune dynamics."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        We assume that active tumor cells follow a logistic growth
      explanation: Directly supports the model's explicit proliferative tumor-cell state.
  evidence:
  - reference: PMID:41102232
    reference_title: "Predicting treatment-free remission in chronic myeloid leukemia patients using an integrated model of tumor-immune dynamics."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: >-
      Starting from classical ecological modeling concepts, which allow to
      explicitly account for immune interactions at the cellular level, we
      incorporate time-course data on natural killer (NK) cell number, function,
      and their tumor-induced suppression into our general model of CML treatment.
    explanation: Summarizes the integrated mechanistic and longitudinal-data basis of the model.
  findings:
  - statement: >-
      Full-dose tumor trajectories alone did not resolve treatment-cessation
      behavior; including the one-year half-dose response increased internal
      prediction quality, with a further increase after six post-cessation months.
    evidence:
    - reference: PMID:41102232
      reference_title: "Predicting treatment-free remission in chronic myeloid leukemia patients using an integrated model of tumor-immune dynamics."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        While the model predictions do not agree with the actual data when using
        the data under full dose only (Fig. 4A), including the data under reduced
        dose increases the prediction quality (Fig. 4B). Further including the
        additional response six months after treatment cessation leads to very
        good predictions (Fig. 4C).
      explanation: >-
        Supports the qualitative improvement from dose-change data; the comparison
        uses the complete-trajectory best fit as its internal reference.
  - statement: >-
      In the model ensembles, a loss of more than 20% of functional immune-cell
      abundance after dose reduction was strongly associated with molecular relapse.
    evidence:
    - reference: PMID:41102232
      reference_title: "Predicting treatment-free remission in chronic myeloid leukemia patients using an integrated model of tumor-immune dynamics."
      supports: SUPPORT
      evidence_source: COMPUTATIONAL
      snippet: >-
        We found that the loss of functional immune cells from dose reduction to
        6 and 12 months thereafter strongly correlates with relapse, with losses
        larger than 20% highly associating with relapse (Fig. 6).
      explanation: Reports a simulation-derived association, not a validated clinical threshold.
  notes: >-
    The final five-author publication is PMID:41102232. Its code and data point to
    Zenodo record 13939516, created for the 2024 preprint; its UI shows v1, but
    its metadata has no semantic version. The record has concept DOI
    10.5281/zenodo.13939515 and uses
    the bioRxiv DOI 10.1101/2024.10.10.617526 as its record DOI; a putative version
    DOI 10.5281/zenodo.13939516 does not resolve. The single code and data.zip file
    is 135,806,838 bytes (Zenodo-reported MD5
    327afa8fc9df02a01c4c4318cfe04aaf; locally computed SHA-256
    6656ac6fb83cf893ca33367b0f39b70829a80c72c452dbb02ea5de4c2d1099a4),
    passes ZIP integrity checks, and contains 398 files: ten ordered Mathematica
    notebooks, generated 4_model_Code.m, four input-data files, 16 precomputed
    Wolfram outputs, 57 manuscript figures, 308 patient-fit PDFs, a DOCX README,
    and .DS_Store. Zenodo metadata declares CC BY 4.0, but the ZIP has no embedded
    license; the final article is separately CC BY-NC-ND 4.0. The author environment
    is Mathematica 14.1 on an ARM Mac and uses built-ins without an environment
    lock. A Mathics compatibility smoke test parsed and loaded the generated package
    and bundled serialized cohort metadata (n=8 Hughes; n=75 DESTINY), then
    constructed the three ODEs and default initial conditions. Per-patient Hughes
    evaluation hit Mathics Association/string incompatibilities, Mathics cannot
    execute the required multivariate NDSolve workflow, and licensed Mathematica
    was unavailable, so full numerical and figure reproduction was not verified.
    The notebooks also depend on NotebookDirectory, $FrontEndSession, and PDF export,
    while solver method, numerical precision, and kernel count are unpinned. Fresh
    execution on a case-sensitive system also requires correcting
    data_destiny.csv to the deposited data_Destiny.csv and
    out_patients_hughes.wl to
    out_patients_Hughes.wl; the README misnames the final notebook. The complete
    million-combination search over three parameters is documented as about seven
    hours on an M3 Mac, while the fixed-parameter 10,000-pair workflow takes under
    30 minutes; precomputed outputs permit figure inspection without recomputation.
    A material methods/code discrepancy affects the immune-kill parameter m_K: the
    paper specifies a search range of [0,1], while the deposited code searches
    [0,4]; 2,159 of 7,500 retained million-combination fits across 29 of 75 patients
    exceed 1 (maximum 3.99966), as do 200 of 7,500 fixed-c_K full-course fits for
    patients 60 and 69 (maximum 2.89195). The deposited code and results therefore
    do not exactly implement the published bound, and interpretation requires author
    clarification. The README also mislabels fitted p_T tuples as p_E. The deposited
    Hughes data have ten patients, and the workflow hard-codes eight without
    recording the selection rationale; the paper describes its modeled subset as
    the eight patients on full TKI dose. The DESTINY
    deposit has 78 patients (75 selected plus three extras), not the full 174
    described in the paper, so the original selection cannot be rerun from this
    archive alone. For each
    selected patient, simplified fixed-c_K analyses retain the 100 best fits from
    10,000 (p_T,m_K) pairs, while the full analysis retains 100 from one million
    (p_T,m_K,c_K) combinations. DESTINY has no NK trajectories: NK-number/suppression
    and NK-function parameters are fixed to population-summary values derived from
    the eight Hughes patients, while patient-specific p_T and m_K (and c_K in the
    full three-parameter analysis) are calibrated only from tumor-load data.
    Deposited internal ROC
    AUCs for relapse at 12/24/36 months rise from 0.57/0.53/0.53 using full-dose data
    to 0.79/0.73/0.71 through half dose and 0.92/0.95/0.92 after six post-cessation
    months, but the reference true scenario is the best complete-trajectory fit,
    not observed held-out outcomes. This is an artifact-backed, partially
    reproducible proof-of-concept for patient-calibrated tumor-immune dynamics, not
    a clinically validated digital twin. The model does not justify links to
    upstream BCR-ABL1 signaling,
    apoptosis resistance, genomic instability, or blast crisis.

discussions:
- discussion_id: cml_cdh2_gsk3beta_translational_mismatch
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  attaches_to:
  - pathophysiology#Uncontrolled Myeloid Proliferation
  - pathophysiology#Constitutive Tyrosine Kinase Activation
  - pathophysiology#PI3K-AKT Pathway Activation
  - pathophysiology#JAK-STAT Pathway Activation
  prompt: >-
    Does CDH2 (N-cadherin) mediated GSK3β-sensitive suppression of proliferation
    observed in K562 leukemia cells represent a tractable therapeutic vulnerability
    in human CML, or is it a cell-line artifact without relevance to BCR-ABL1 driven
    pathophysiology?
  rationale: >-
    K562 CML cells represent a well-established model but may diverge from primary
    CML stem cells and patient-derived xenografts in GSK3β signaling and CDH2 expression
    context. CDH2 exhibits pan-cancer context-dependent effects, suggesting that
    anti-proliferative phenotype in K562 cells may not generalize to human CML. The
    paper's own conclusion notes "the precise molecular mechanism remains unresolved"
    and identifies this as a "therapeutic vulnerability in this model" — language
    that appropriately caveat-gates claims to the K562 cell line. Clarifying whether
    the CDH2-GSK3β axis operates as a disease mechanism (not just in vitro drug target)
    is mechanistically meaningful for CML's relationship to Wnt/β-catenin and MAPK
    checkpoint signaling.
  proposed_experiments:
  - experiment_id: exp_cml_cdh2_gsk3beta_primary_cells
    name: CDH2-GSK3β axis validation in primary CML progenitors and patient-derived xenografts
    description: >-
      Quantify CDH2 and GSK3β expression levels in primary CML stem cells (CD34+),
      patient-derived xenografts (PDX), and K562 cells to determine whether K562
      model recapitulates the expression and signaling context of human disease.
      Test whether CDH2 overexpression or GSK3β inhibition (CHIR-99,021) suppresses
      proliferation in primary human CML progenitors or PDX models matching K562
      phenotype. If the effect does not replicate, the mechanism is K562-specific.
    experiment_type:
      preferred_term: gene-perturbation proliferation assay in primary progenitors and xenografts
    model_systems:
    - name: Primary CML CD34+ progenitor culture
      description: >-
        Patient-derived CD34+ chronic myeloid leukemia stem/progenitor cells,
        the primary-cell context against which the K562 CDH2-GSK3β phenotype is
        tested for translational validity.
      experimental_model_type: PRIMARY_CELL_CULTURE
    - name: CML patient-derived xenograft (PDX)
      description: >-
        In vivo engraftment of primary CML cells used to assess whether CDH2
        overexpression or GSK3β inhibition reproduces the K562 anti-proliferative
        effect in a disease-faithful microenvironment.
      experimental_model_type: OTHER
    - name: K562 CML cell line
      description: >-
        The immortalized BCR-ABL1-positive cell line in which the original
        CDH2-GSK3β-sensitive anti-proliferative effect was observed.
      experimental_model_type: CELL_LINE
  - experiment_id: exp_cml_cdh2_bcr_abl1_intersection
    name: Mechanistic intersection of CDH2-GSK3β axis with BCR-ABL1 signaling
    description: >-
      Map CDH2-GSK3β axis to BCR-ABL1 signaling: determine whether CDH2 upregulation
      suppresses BCR-ABL1-driven proliferation through MAPK/PI3K/JAK-STAT checkpoint
      effects, or through an off-axis Wnt/GSK3β-independent route. Mechanistically
      contextualize CDH2 effects within the documented CML pathophysiology nodes
      (Uncontrolled Myeloid Proliferation, Constitutive Tyrosine Kinase Activation,
      PI3K-AKT Pathway Activation, JAK-STAT Pathway Activation).
    experiment_type:
      preferred_term: signaling-pathway epistasis mapping assay
    model_systems:
    - name: K562 CML cell line
      description: >-
        BCR-ABL1-positive cell line used to map the CDH2-GSK3β axis onto
        BCR-ABL1 downstream checkpoint signaling (MAPK/PI3K/JAK-STAT).
      experimental_model_type: CELL_LINE
    - name: Primary CML CD34+ progenitor culture
      description: >-
        Patient-derived CD34+ progenitors used to confirm any BCR-ABL1
        intersection observed in the K562 model in disease-relevant cells.
      experimental_model_type: PRIMARY_CELL_CULTURE
  evidence:
  - reference: PMID:42401590
    reference_title: "Pan-cancer profiling of CDH2 and a GSK3β-sensitive anti-proliferative effect in K562 chronic myeloid leukemia cells."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      CDH2 overexpression suppressed proliferation, induced cell cycle arrest and
      early apoptosis. This was accompanied by increased total β-catenin protein
      but a reduced nuclear-to-cytoplasmic β-catenin ratio, without consistent
      changes in canonical Wnt target gene expression. Notably, the GSK3 inhibitor
      CHIR-99,021 reversed the anti-proliferative effect of CDH2, whereas the
      β-catenin degrader MSAB did not rescue it. CDH2 exhibits context-dependent
      expression across malignancies. In K562 CML cells, CDH2 overexpression
      suppresses proliferation through a GSK3β-sensitive mechanism. However, the
      precise molecular mechanism remains unresolved.
    explanation: >-
      This IN_VITRO evidence from K562 cells demonstrates CDH2-GSK3β-sensitive
      anti-proliferation but explicitly acknowledges mechanistic uncertainty and
      context-dependence across cancer types, indicating that human validation is
      required to interpret this as a generalizable CML mechanism rather than a
      K562 cell-line artifact.


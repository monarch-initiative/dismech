diagnosis:
- name: Molecular genetic testing
  description: >-
    Diagnosis rests on finding biallelic VPS41 variants by exome or genome
    sequencing. When phase cannot be set from parents, long-read sequencing
    can show that two variants lie in trans, and RNA analysis can establish
    the effect of splice variants.
  evidence:
  - reference: PMID:42656169
    reference_title: "Biallelic VPS41 Variants in Autosomal Recessive Spinocerebellar Ataxia 29 Resolved by Long-Read Sequencing and RNA Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Because maternal DNA was unavailable, long-read genome sequencing was performed to determine allelic configuration, followed by RNA and protein analyses."
    explanation: Describes the sequencing, phasing and RNA route used to confirm the diagnosis.
- name: Electron microscopy of patient cells
  description: >-
    Electron microscopy of lymphocytes, lymphoblastoid cells or fibroblasts
    shows abnormal multilayered vesicles or vacuoles. It supports variant
    interpretation but is not specific to VPS41.
  evidence:
  - reference: PMID:32808683
    reference_title: "Loss-of-Function Variants in HOPS Complex Genes VPS16 and VPS41 Cause Early Onset Dystonia Associated with Lysosomal Abnormalities."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Electron microscopy of patient-derived lymphocytes and fibroblasts from both patients with VPS16 and VPS41 showed vacuolar abnormalities suggestive of impaired lysosomal function."
    explanation: Ultrastructural abnormality in patient cells, shared with VPS16 disease.

animal_models:
- name: Zebrafish vps41 crispant
  species: Zebrafish
  genotype: vps41 F0 CRISPR/Cas9 crispant (60-90% disruption efficiency)
  publication: PMID:33764426
  description: >-
    F0 crispants of the single zebrafish vps41 homologue show hypopigmentation,
    absent swim bladder inflation with loss of viability, increased brain
    lysosomal acidity concentrated in microglia, and a reduced optokinetic
    response.
  modeled_mechanisms:
  - target: Microglial Lysosomal Accumulation
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Microglial lysosomal accumulation rescued by wild-type vps41 mRNA.
    limitations: >-
      Mosaic F0 knockout rather than the patients' hypomorphic missense or
      splice alleles; larval stage only, and the microglial finding has not
      been examined in human tissue.
    evidence:
    - reference: PMID:33764426
      reference_title: "Bi-allelic variants in HOPS complex subunit VPS41 cause cerebellar ataxia and abnormal membrane trafficking."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This revealed that vps41-deficient microglia have distinct morphological abnormalities suggestive of larger, or possibly more numerous, lysosomal compartments compared to microglia from control larvae."
      explanation: Supports the model as informative for the microglial node.
  - target: Cerebellar Neurodegeneration
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: Reduced optokinetic response, used as a cerebellar-function assay.
    limitations: >-
      The optokinetic deficit may also reflect retinal pigment epithelium or
      photoreceptor dysfunction (crispants have reduced retinal pigmentation),
      and gross brain morphology and size were normal, so cerebellar
      degeneration itself was not shown.
    evidence:
    - reference: PMID:33764426
      reference_title: "Bi-allelic variants in HOPS complex subunit VPS41 cause cerebellar ataxia and abnormal membrane trafficking."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In contrast to control injected larvae, which demonstrated normal responses to visual stimuli, vps41 crispants showed a dramatically reduced response"
      explanation: Optokinetic deficit in crispants.
notes: >-
  No GeneReviews chapter or specific treatment is known for SCAR29; management
  is supportive and no treatment is curated. Differentials within the HOPS
  group are Mucopolysaccharidosis-Plus Syndrome (VPS33A, HOPS and CORVET) and
  VPS16-related dystonia (heterozygous loss of function). Fewer than twenty
  patients had been reported by 2026. The reported VPS41 knockout mouse is
  embryonic lethal and was not usable as a disease model.

pathophysiology:
- name: VPS41 Loss of Function
  biological_scale: MOLECULAR
  description: >-
    Biallelic VPS41 variants reduce or abolish the function of the
    HOPS-specific VPS41 subunit. Disease missense variants fail to restore
    lysosomal function in VPS41 knockout cells, and in one compound
    heterozygote the two splice alleles (one producing an NMD-targeted
    out-of-frame transcript, one an in-frame exon-skipped transcript) jointly
    reduced VPS41 transcript and protein. VPS41 acts as an adaptor linking the
    HOPS complex to the lysosomal small GTPase ARL8B via its effector SKIP.
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Biallelic germline variants, homozygous or compound heterozygous;
      missense, nonsense and splice alleles are reported.
  genes:
  - preferred_term: VPS41
    term:
      id: hgnc:12713
      label: VPS41
  molecular_functions:
  - preferred_term: molecular adaptor activity (HOPS-to-lysosome linkage)
    term:
      id: GO:0060090
      label: molecular adaptor activity
    modifier: DECREASED
  evidence:
  - reference: PMID:42656169
    reference_title: "Biallelic VPS41 Variants in Autosomal Recessive Spinocerebellar Ataxia 29 Resolved by Long-Read Sequencing and RNA Analysis."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "These complementary defects reduced VPS41 expression at both transcript and protein levels, supporting pathogenicity and variant reclassification."
    explanation: Patient-derived RNA and protein analysis shows reduced VPS41 from the two splice alleles.
  - reference: PMID:33764426
    reference_title: "Bi-allelic variants in HOPS complex subunit VPS41 cause cerebellar ataxia and abnormal membrane trafficking."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "The interaction of VPS41 with ARL8B through its effector SKIP (SifA and kinesin-interacting protein) contributes to lysosomal localization and trafficking and degradation of EGFR"
    explanation: Background statement of the adaptor role of VPS41 between HOPS and the lysosomal ARL8B-SKIP machinery, the activity whose loss this node records.
  downstream:
  - target: HOPS Tethering Complex Dysfunction
    causal_link_type: DIRECT
    description: >-
      Without functional VPS41, a functional HOPS complex does not form.

- name: HOPS Tethering Complex Dysfunction
  biological_scale: MOLECULAR
  description: >-
    VPS41 is one of the two HOPS-specific subunits. All tested disease
    variants prevented formation of a functional HOPS complex. Because VPS41
    is not part of CORVET, the defect is confined to the late
    endosome/autophagosome-to-lysosome fusion arm, in contrast to VPS33A
    (Mucopolysaccharidosis-Plus Syndrome), whose loss compromises both
    complexes. A HOPS-independent function of VPS41 in regulated secretion was
    preserved for the p.Ser285Pro allele.
  protein_complexes:
  - preferred_term: HOPS complex
    term:
      id: GO:0030897
      label: HOPS complex
    modifier: DECREASED
  evidence:
  - reference: PMID:33851776
    reference_title: "Neurodegenerative VPS41 variants inhibit HOPS function and mTORC1-dependent TFEB/TFE3 regulation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All mutants prevented formation of a functional HOPS complex, causing delayed lysosomal delivery of endocytic and autophagic cargo."
    explanation: Patient fibroblasts and VPS41-depleted cells show loss of functional HOPS with all tested variants.
  - reference: PMID:33764426
    reference_title: "Bi-allelic variants in HOPS complex subunit VPS41 cause cerebellar ataxia and abnormal membrane trafficking."
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: "VPS39 and VPS41, which are HOPS-specific, as well as VPS11, VPS16, VPS18 and VPS33A, which are also present in the CORVET complex"
    explanation: States that VPS41 is HOPS-specific, which restricts the lesion to HOPS rather than CORVET.
  downstream:
  - target: Delayed Lysosomal Delivery of Endocytic and Autophagic Cargo
    causal_link_type: DIRECT
    description: >-
      HOPS tethers late endosomes and autophagosomes to lysosomes for fusion;
      its loss delays cargo delivery.

- name: Delayed Lysosomal Delivery of Endocytic and Autophagic Cargo
  biological_scale: CELLULAR
  description: >-
    Endocytic and autophagic cargo reaches enzymatically active lysosomes
    late. The lysosomes themselves remain functional; the defect is
    insufficient delivery, which places SCAR29 among lysosomal disorders of
    trafficking rather than of hydrolase activity.
  biological_processes:
  - preferred_term: late endosome to lysosome transport
    term:
      id: GO:1902774
      label: late endosome to lysosome transport
    modifier: DECREASED
  - preferred_term: autophagosome-lysosome fusion
    term:
      id: GO:0061909
      label: autophagosome-lysosome fusion
    modifier: DECREASED
  evidence:
  - reference: PMID:33851776
    reference_title: "Neurodegenerative VPS41 variants inhibit HOPS function and mTORC1-dependent TFEB/TFE3 regulation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "All mutants prevented formation of a functional HOPS complex, causing delayed lysosomal delivery of endocytic and autophagic cargo."
    explanation: Direct cellular readout of delayed delivery of endocytic and autophagic cargo to lysosomes.
  - reference: PMID:33851776
    reference_title: "Neurodegenerative VPS41 variants inhibit HOPS function and mTORC1-dependent TFEB/TFE3 regulation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Our study shows that VPS41 patients represent a new class of lysosomal disorders in which lysosomes are functional, but insufficiently reached by cargo due to a trafficking defect."
    explanation: Characterizes the lesion as a delivery defect with functional lysosomes.
  downstream:
  - target: Abnormal Lysosomal Compartment
    causal_link_type: DIRECT
    description: >-
      Undelivered and partially processed material accumulates in abnormal
      membrane-bound vesicles.
  - target: mTORC1 Redistribution and Constitutive TFE3 Activation
    causal_link_type: DIRECT
    description: >-
      Loss of HOPS function disrupts lysosome-dependent mTORC1 control of
      TFE3/TFEB.

- name: mTORC1 Redistribution and Constitutive TFE3 Activation
  biological_scale: CELLULAR
  description: >-
    In VPS41-deficient cells mTORC1 redistributes to the cytosol and TFE3 is
    continuously nuclear, while phosphorylation of the mTORC1 substrates S6K1
    and 4EBP1 is unaffected; the defect is selective for the TFEB/TFE3 arm.
    Lysosomal biogenesis and autophagosome formation are continuously
    upregulated regardless of nutrient status, and the autophagic response to
    starvation is reduced.
  biological_processes:
  - preferred_term: lysosome organization (lysosomal biogenesis)
    term:
      id: GO:0007040
      label: lysosome organization
    modifier: INCREASED
  evidence:
  - reference: PMID:33851776
    reference_title: "Neurodegenerative VPS41 variants inhibit HOPS function and mTORC1-dependent TFEB/TFE3 regulation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Strikingly, loss of VPS41 function caused a cytosolic redistribution of mTORC1, continuous nuclear localization of Transcription Factor E3 (TFE3), enhanced levels of LC3II, and a reduced autophagic response to nutrient starvation."
    explanation: Direct cellular evidence for the mTORC1/TFE3 dysregulation.
  - reference: PMID:33851776
    reference_title: "Neurodegenerative VPS41 variants inhibit HOPS function and mTORC1-dependent TFEB/TFE3 regulation."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "As a result, lysosomal biogenesis and autophagosome formation is continuously upregulated independent of nutrient conditions."
    explanation: Supports the INCREASED modifier on lysosome organization (biogenesis).
  downstream:
  - target: Abnormal Lysosomal Compartment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Continuous TFE3-driven lysosomal biogenesis is consistent with the
      raised lysosomal membrane protein (LAMP2) seen in VPS41 knockout cells;
      the two observations come from different studies and the link is an
      inference.

- name: Abnormal Lysosomal Compartment
  biological_scale: CELLULAR
  description: >-
    Patient lymphocytes, lymphoblastoid cells and fibroblasts show excess
    multilayered membrane-bound vesicles and vacuolar abnormalities on
    electron microscopy, and VPS41 knockout cells show raised LAMP2 that
    disease alleles fail to correct. This is the cellular storage-like
    phenotype shared by the HOPS-associated neurological disorders.
  evidence:
  - reference: PMID:33764426
    reference_title: "Bi-allelic variants in HOPS complex subunit VPS41 cause cerebellar ataxia and abnormal membrane trafficking."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Transmission electron microscopy (TEM) on peripheral blood lymphocytes from Subject 2 and lymphoblastoid cells from Subject 3 revealed more multilayered vesicles compared to control cells"
    explanation: Ultrastructural evidence of abnormal vesicles in patient-derived cells.
  - reference: PMID:33764426
    reference_title: "Bi-allelic variants in HOPS complex subunit VPS41 cause cerebellar ataxia and abnormal membrane trafficking."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Whereas transfection of wild-type VPS41 resulted in downregulation of LAMP2 in transfected KO ESCs, expression of Ser285Pro, Cys791Phe, and to a lesser extent Arg633Pro, failed to downregulate LAMP2 at a population level"
    explanation: Disease alleles fail to rescue the lysosomal phenotype of VPS41 knockout cells.
  - reference: PMID:32808683
    reference_title: "Loss-of-Function Variants in HOPS Complex Genes VPS16 and VPS41 Cause Early Onset Dystonia Associated with Lysosomal Abnormalities."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Electron microscopy of patient-derived lymphocytes and fibroblasts from both patients with VPS16 and VPS41 showed vacuolar abnormalities suggestive of impaired lysosomal function."
    explanation: Independent ultrastructural evidence in a VPS41 patient's cells.
  downstream:
  - target: Microglial Lysosomal Accumulation
    causal_link_type: DIRECT
    description: >-
      Highly endocytic and phagocytic microglia accumulate enlarged or
      excess acidic lysosomal compartments.
  - target: Cerebellar Neurodegeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Membrane trafficking defects in neurons are proposed to underlie the
      cerebellar atrophy; reduced Purkinje cell viability is plausible but
      not demonstrated.
  - target: Dystonia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Lysosomal and autophagic dysfunction is the proposed shared mechanism
      of dystonia across the HOPS-associated neurological disorders; the
      circuit-level route is not established.
    evidence:
    - reference: PMID:33871597
      reference_title: "HOPS-associated neurological disorders (HOPSANDs): linking endolysosomal dysfunction to the pathogenesis of dystonia."
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "The delineation of HOPSANDs further confirms the connection of lysosomal and autophagic dysfunction with the pathogenesis of dystonia"
      explanation: Review synthesis linking HOPS-related lysosomal/autophagic dysfunction to dystonia.

- name: Microglial Lysosomal Accumulation
  biological_scale: CELLULAR
  description: >-
    In zebrafish vps41 crispants, brain acidity (LysoTracker) is increased,
    concentrated within microglia, and is reduced by wild-type vps41 mRNA;
    microglia show morphology suggestive of larger or more numerous
    lysosomal compartments. Microglial lysosomal dysfunction is proposed to
    impair brain development, including of the cerebellum. Human tissue
    confirmation is lacking.
  cell_types:
  - preferred_term: microglial cell
    term:
      id: CL:0000129
      label: microglial cell
  evidence:
  - reference: PMID:33764426
    reference_title: "Bi-allelic variants in HOPS complex subunit VPS41 cause cerebellar ataxia and abnormal membrane trafficking."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "This revealed that vps41-deficient microglia have distinct morphological abnormalities suggestive of larger, or possibly more numerous, lysosomal compartments compared to microglia from control larvae."
    explanation: Zebrafish evidence of microglial lysosomal abnormality.
  downstream:
  - target: Cerebellar Neurodegeneration
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Lysosomal accumulation impairs microglial function, and microglial loss
      is known to cause brain abnormalities including cerebellar hypoplasia;
      this contribution is proposed from the zebrafish data.

- name: Cerebellar Neurodegeneration
  biological_scale: TISSUE
  description: >-
    Brain MRI shows mild cerebellar and vermian atrophy or hypoplasia in most
    patients, with anterior-predominant cerebellar atrophy in a later case;
    serial MRI in two siblings showed the vermis, normal at first, losing
    volume on follow-up, so the process is degenerative. Zebrafish crispants
    show a reduced optokinetic response, used as a readout of cerebellar
    dysfunction.
  locations:
  - preferred_term: cerebellum
    term:
      id: UBERON:0002037
      label: cerebellum
  evidence:
  - reference: PMID:33764426
    reference_title: "Bi-allelic variants in HOPS complex subunit VPS41 cause cerebellar ataxia and abnormal membrane trafficking."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Brain MRI revealed mild cerebellar atrophy and vermian atrophy without other major structural abnormalities in most affected individuals"
    explanation: Neuroimaging evidence of cerebellar involvement in patients.
  - reference: PMID:42656169
    reference_title: "Biallelic VPS41 Variants in Autosomal Recessive Spinocerebellar Ataxia 29 Resolved by Long-Read Sequencing and RNA Analysis."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "He also developed pes cavus, anterior-predominant cerebellar atrophy on brain MRI"
    explanation: Cerebellar atrophy in a later, independently reported patient.
  - reference: PMID:33851776
    reference_title: "Neurodegenerative VPS41 variants inhibit HOPS function and mTORC1-dependent TFEB/TFE3 regulation."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "brain MRI done on the younger brother (patient 2) at 10 years of age confirmed the thin corpus callosum, mild progression of the cerebellar atrophy"
    explanation: Serial MRI shows the cerebellar atrophy progressing, supporting a degenerative rather than purely malformative process.
  downstream:
  - target: Cerebellar Vermis Atrophy
    causal_link_type: DIRECT
    description: Cerebellar tissue loss is visible on MRI.
  - target: Cerebellar Ataxia
    causal_link_type: DIRECT
    description: Cerebellar dysfunction produces ataxia.
  - target: Nystagmus
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Nystagmus is a common cerebellar oculomotor sign; the specific
      substrate in SCAR29 has not been studied.


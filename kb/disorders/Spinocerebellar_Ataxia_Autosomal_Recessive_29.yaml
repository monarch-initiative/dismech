name: Spinocerebellar Ataxia, Autosomal Recessive 29
creation_date: "2026-10-23T02:04:54Z"
category: Mendelian
synonyms:
- SCAR29
- Barakat-Van Ham-Kaya syndrome
- neurodevelopmental disorder with hypotonia and cerebellar ataxia
- VPS41-related neurodevelopmental disorder
description: >-
  Spinocerebellar ataxia, autosomal recessive 29 (SCAR29) is an ultra-rare
  progressive neurodevelopmental disorder caused by biallelic variants in
  VPS41, which encodes a subunit specific to the HOPS (homotypic fusion and
  protein sorting) tethering complex. HOPS mediates fusion of late endosomes
  and autophagosomes with lysosomes; VPS41 and VPS39 are its two HOPS-specific
  subunits, while VPS11, VPS16, VPS18 and VPS33A are shared with the CORVET
  complex. Patients present in infancy or early childhood with hypotonia,
  developmental delay, intellectual disability with speech delay, cerebellar
  ataxia, dystonia, dysarthria and nystagmus, usually without independent
  ambulation; lower-limb spasticity and retinal pigment changes occur in some.
  Brain MRI shows cerebellar (mainly vermian) atrophy that progresses on
  serial imaging, often with a thin corpus callosum and sometimes pallidal
  iron deposition. Therapy-resistant epilepsy has been reported in one
  sibship. Pathogenic variants
  prevent assembly of a functional HOPS complex, so endocytic and autophagic
  cargo reaches enzymatically competent lysosomes late; the disease is
  therefore a trafficking (delivery) disorder of lysosomal function rather
  than a hydrolase deficiency. Patient cells also show mTORC1 redistribution
  and constitutive nuclear TFE3, and zebrafish vps41 crispants show lysosomal
  accumulation in microglia and cerebellar dysfunction. SCAR29 belongs to the
  proposed group of HOPS-associated neurological disorders (HOPSANDs), which
  also includes VPS16- and VPS11-related dystonia.

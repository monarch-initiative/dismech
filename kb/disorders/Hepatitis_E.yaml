name: Hepatitis E
creation_date: "2026-08-22T00:00:00Z"
category: Infectious Disease
description: >-
  Infection with hepatitis E virus (HEV), a major cause of acute viral hepatitis
  worldwide with approximately 20 million infections annually. The disease is
  best understood as two epidemiologically and clinically distinct entities
  sharing one virus species. Genotypes 1 and 2 are human-restricted, spread by
  faecally contaminated water in developing countries, and cause epidemic acute
  hepatitis with a strikingly high mortality in pregnancy. Genotypes 3 and 4 are
  zoonotic, acquired in developed countries from undercooked meat, and are
  usually asymptomatic in immunocompetent hosts but establish chronic infection
  and cirrhosis in immunocompromised patients - the only hepatitis E arm that
  becomes chronic. Both acute and chronic infection can produce extrahepatic
  manifestations. The outcome is determined chiefly by the host immune response
  rather than by viral virulence. No treatment is approved for chronic infection
  and no HEV vaccine is FDA-approved.
disease_term:
  preferred_term: hepatitis E virus infection
  term:
    id: MONDO:0005788
    label: hepatitis E virus infection
parents:
- Liver Disease
- Viral Hepatitis
infectious_agent:
- name: Hepatitis E virus (HEV)
  description: >-
    A positive-strand RNA virus of the family Hepeviridae. Four main genotypes
    infect humans and divide sharply by ecology: genotypes 1 and 2 are
    human-restricted and waterborne, genotypes 3 and 4 are zoonotic and
    foodborne. The genotype largely determines the clinical entity, so it is
    curated here as a property of the agent rather than as disease severity.
  infectious_agent_term:
    preferred_term: Paslahepevirus balayani
    term:
      id: NCBITaxon:1678143
      label: Paslahepevirus balayani
  evidence:
  - reference: PMID:37376687
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      There are four main genotypes of HEV. Genotype 1 and genotype 2 are common
      in developing countries and are transmitted by contaminated water from a
      fecal-oral route. Genotype 3 and genotype 4 are common in developed
      countries and can lead to occasional transmission to humans via undercooked
      meat.
    explanation: >-
      Establishes the four-genotype structure and the epidemiological split that
      organises this entry. Evidence source is OTHER because this is a review.
transmission:
- name: Waterborne Faecal-Oral Transmission (Genotypes 1 and 2)
  description: >-
    Genotypes 1 and 2 spread by the faecal-oral route through contaminated
    water, producing large epidemics in settings with inadequate sanitation.
  evidence:
  - reference: PMID:37376687
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Genotype 1 and genotype 2 are common in developing countries and are
      transmitted by contaminated water from a fecal-oral route.
    explanation: >-
      Documents the transmission route for the human-restricted genotypes.
      Evidence source is OTHER because this is a review.
- name: Zoonotic Foodborne Transmission (Genotypes 3 and 4)
  description: >-
    Genotypes 3 and 4 are zoonotic, maintained in animal reservoirs and
    transmitted to humans through undercooked meat. This is the dominant route
    in developed countries and explains why hepatitis E is now recognised as an
    endemic rather than imported infection there.
  evidence:
  - reference: PMID:37376687
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Genotype 3 and genotype 4 are common in developed countries and can lead
      to occasional transmission to humans via undercooked meat.
    explanation: >-
      Documents the zoonotic foodborne route for the animal-reservoir genotypes.
      Evidence source is OTHER because this is a review.
pathophysiology:
- name: Hepatotropic HEV Infection and Replication
  description: >-
    Acquired HEV reaches the liver and replicates in hepatocytes. Infection is
    established in the great majority of exposed people; what varies is whether
    it produces disease, which is decided downstream by the host response rather
    than at this node.
  role: trigger
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:39039260
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hepatitis E virus (HEV) infections are a major cause of acute viral
      hepatitis in humans worldwide.
    explanation: >-
      Establishes HEV infection as a leading cause of acute hepatitis, the
      starting point of this chain. Evidence source is OTHER because this is a
      review.
  downstream:
  - target: Host Immune Response Determining Infection Outcome
    causal_link_type: DIRECT
    description: >-
      The innate and adaptive immune response to the infected hepatocyte
      determines whether the virus is cleared, causes symptomatic hepatitis, or
      persists.

- name: Host Immune Response Determining Infection Outcome
  description: >-
    The decisive node of hepatitis E. In immunocompetent individuals the
    majority of infections remain asymptomatic and lead to spontaneous clearance,
    with only 5-16% developing symptomatic acute hepatitis. A growing body of
    evidence indicates that the host immune response to different HEV genotypes
    is the critical determinant of the distinct outcomes. Two host states break
    the usual outcome in opposite directions: immunosuppression permits
    persistence, and pregnancy converts a self-limited illness into one with up
    to 30% mortality.
  role: central_effector
  biological_scale: ORGANISM
  biological_processes:
  - preferred_term: inflammatory response
    term:
      id: GO:0006954
      label: inflammatory response
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:39039260
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      A growing body of evidence suggests that the host immune response to
      infection with different HEV genotypes is a critical determinant of
      distinct HEV infection outcomes.
    explanation: >-
      States the central claim of this node - that outcome is set by host
      immunity interacting with genotype rather than by viral virulence alone.
      Evidence source is OTHER because this is a review.
  - reference: PMID:39039260
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      In immunocompetent individuals, the majority of HEV infections remain
      asymptomatic and lead to spontaneous clearance of the virus, and only a
      minority of individuals with infection (5-16%) experience symptoms of
      acute viral hepatitis.
    explanation: >-
      Quantifies the usual outcome in an intact host, against which the
      immunosuppressed and pregnancy branches are the exceptions. Evidence
      source is OTHER because this is a review.
  downstream:
  - target: Chronic HEV Infection in the Immunocompromised Host
    causal_link_type: DIRECT
    description: >-
      When the adaptive response is insufficient to clear the virus,
      genotype 3 infection persists.
  - target: Severe Acute Hepatitis and Fulminant Failure
    causal_link_type: DIRECT
    description: >-
      In pregnancy and in some genotype 1 and 3 infections the acute hepatitis
      becomes fulminant.

- name: Chronic HEV Infection in the Immunocompromised Host
  description: >-
    Genotype 3 HEV establishes chronic infection in immunocompromised
    patients - most importantly solid-organ transplant recipients - and can
    progress to cirrhosis. This is the only chronic arm of hepatitis E and it is
    entirely host-determined: the same virus in an immunocompetent host is
    cleared. No treatment has been approved for chronic HEV infection.
  role: consequence
  biological_scale: ORGANISM
  locations:
  - preferred_term: liver
    term:
      id: UBERON:0002107
      label: liver
  evidence:
  - reference: PMID:37376687
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hepatitis E virus 1 and HEV3 can lead to fulminant hepatitis, and HEV3 can
      lead to chronic hepatitis and cirrhosis in immunocompromised patients.
    explanation: >-
      Assigns chronic infection and cirrhosis specifically to genotype 3 in
      immunocompromised hosts, the scoping claim of this node. Evidence source
      is OTHER because this is a review.
  - reference: PMID:37376687
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, infection in immunocompromised individuals can lead to chronic
      HEV infection.
    explanation: >-
      Confirms that immunocompromise is the host condition permitting
      persistence. Evidence source is OTHER because this is a review.

- name: Severe Acute Hepatitis and Fulminant Failure
  description: >-
    Genotypes 1 and 3 can cause fulminant hepatitis. The most striking severity
    modifier is pregnancy: HEV infection can cause up to 30% mortality in
    pregnant women, a case fatality unmatched by any other hepatitis virus and
    concentrated in genotype 1 epidemics. The mechanism of this
    pregnancy-specific severity is not established.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:39039260
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      However, HEV infections can cause up to 30% mortality in pregnant women,
      become chronic in immunocompromised patients and cause extrahepatic
      manifestations.
    explanation: >-
      Records the pregnancy case-fatality figure alongside the other two
      outcome-modifying host states. Evidence source is OTHER because this is a
      review.
  - reference: PMID:37376687
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Hepatitis E virus 1 and HEV3 can lead to fulminant hepatitis
    explanation: >-
      Assigns fulminant hepatitis to genotypes 1 and 3. Evidence source is OTHER
      because this is a review.

- name: Extrahepatic Manifestations
  description: >-
    Both acute and chronic HEV infection can produce manifestations outside the
    liver, most prominently neurological. These are curated as a distinct arm
    rather than as complications of liver failure, because they occur in
    patients whose hepatitis is mild or absent.
  role: consequence
  biological_scale: ORGANISM
  evidence:
  - reference: PMID:37376687
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Both acute and chronic HEV infections can have extrahepatic
      manifestations.
    explanation: >-
      Establishes that extrahepatic disease occurs in both arms of the
      infection. Evidence source is OTHER because this is a review.
phenotypes:
- category: Clinical
  name: Acute Hepatitis
  description: >-
    Symptomatic acute viral hepatitis, occurring in a minority (5-16%) of
    immunocompetent infected individuals.
  frequency: OCCASIONAL
  phenotype_term:
    preferred_term: Acute hepatitis
    term:
      id: HP:0200119
      label: Acute hepatitis
  evidence:
  - reference: PMID:39039260
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      only a minority of individuals with infection (5-16%) experience symptoms
      of acute viral hepatitis
    explanation: >-
      Provides the 5-16% figure supporting the OCCASIONAL frequency band
      recorded here. Evidence source is OTHER because this is a review.
- category: Clinical
  name: Cirrhosis
  description: >-
    Cirrhosis develops from chronic genotype 3 infection in immunocompromised
    patients. It does not occur in immunocompetent hosts, in whom the infection
    is cleared.
  phenotype_term:
    preferred_term: Cirrhosis
    term:
      id: HP:0001394
      label: Cirrhosis
  evidence:
  - reference: PMID:37376687
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      HEV3 can lead to chronic hepatitis and cirrhosis in immunocompromised
      patients
    explanation: >-
      Documents cirrhosis as an outcome restricted to chronic genotype 3
      infection in immunocompromised hosts. Evidence source is OTHER because
      this is a review.
treatments:
- name: Supportive Care for Acute Infection
  description: >-
    Acute hepatitis E in an immunocompetent host requires no specific treatment;
    the majority of patients clear the virus spontaneously. The therapeutic
    problem in hepatitis E is not the acute illness but the chronic arm, for
    which nothing is approved.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:37376687
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      No specific treatment is required for acute HEV infection, no treatment
      has been approved in chronic infection, and no HEV vaccine has been
      approved by the (United States) Food and Drug Administration.
    explanation: >-
      States all three components of the current therapeutic position: none
      needed for acute disease, none approved for chronic disease, and no
      FDA-approved vaccine. Evidence source is OTHER because this is a review.
discussions:
- discussion_id: hev_pregnancy_mortality_mechanism
  kind: KNOWLEDGE_GAP
  prompt: >-
    Why does hepatitis E cause up to 30% mortality in pregnant women when the
    same infection is usually asymptomatic and self-limited outside pregnancy?
  attaches_to:
  - "pathophysiology#Severe Acute Hepatitis and Fulminant Failure"
  rationale: >-
    The pregnancy case fatality of hepatitis E is unmatched by any other
    hepatitis virus and is the single most consequential unexplained feature of
    the disease. It is not attributable to viral virulence, since the same
    genotypes cause mild or asymptomatic disease in non-pregnant hosts, which
    points at the host response node upstream. Candidate explanations - hormonal
    modulation of immunity, a shifted T-helper balance, altered viral replication
    in pregnancy - are not settled, and the review literature explicitly lists
    outstanding questions about HEV immune responses. Curators should record the
    association without asserting a mechanism.
  proposed_experiments:
  - experiment_id: hev_pregnancy_immune_profiling
    name: Longitudinal immune profiling of HEV infection in pregnancy
    description: >-
      Comparing innate sensing, interferon induction, and HEV-specific T and B
      cell responses between pregnant and non-pregnant patients infected in the
      same outbreak would separate a host-immunity explanation from a
      viral-replication one.
- discussion_id: hev_chronic_infection_untreatable
  kind: KNOWLEDGE_GAP
  prompt: >-
    What therapy should be used for chronic hepatitis E in immunocompromised
    patients, given that no treatment is approved?
  attaches_to:
  - "pathophysiology#Chronic HEV Infection in the Immunocompromised Host"
  rationale: >-
    Chronic hepatitis E progresses to cirrhosis in a growing transplant
    population, and the review literature states plainly that no treatment has
    been approved for chronic infection and no HEV vaccine has FDA approval.
    This entry therefore curates no treatment against this node deliberately -
    the absence is the finding, not an omission.
  proposed_experiments:
  - experiment_id: hev_chronic_antiviral_trial
    name: Randomized antiviral trial in chronic HEV infection
    description: >-
      A randomized trial in transplant recipients with persistent HEV viraemia,
      powered on sustained virological clearance and fibrosis progression, would
      supply the evidence base this node currently lacks entirely.

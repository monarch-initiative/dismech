    two names explicitly ("polycystic ovarian syndrome/polyendocrine metabolic
    ovarian syndrome"); curated here under the established PCOS identity rather
    than as a distinct disorder.
- name: Glucagon-like Peptide-1 Receptor Agonists
  description: >-
    GLP-1 receptor agonists are emerging as potential therapeutic agents in PCOS,
    targeting insulin resistance and metabolic dysregulation. Beyond their
    glucose-lowering effects, GLP-1RAs may improve androgen metabolism and
    ovulatory function through weight loss and insulin sensitization, offering
    a multi-pathway intervention approach in metabolic-dominant PCOS phenotypes.

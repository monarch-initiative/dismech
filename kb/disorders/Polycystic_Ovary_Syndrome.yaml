datasets:
- accession: geo:GSE313660
  title: Single-cell analysis of follicular fluid reveals dysregulation of ovulatory immune function in Polycystic Ovary Syndrome patients undergoing ovarian stimulation
  description: Polycystic ovary syndrome is the most common endocrine condition in women and anovulatory cause of female infertility. While a pro-inflammatory cytokines and leukocyte bias in systemic circulation is well-documented in PCOS, it is not known how this inflammation extends to or affects the ovary. Additionally, the relationship between ovulation and inflammation in PCOS is not well-defined. We hypothesize that the ovarian follicular immune environment in PCOS is uniquely dysregulated, and that resolving anovulation through ovulation induction is not sufficient to alleviate this dysregulation.
  organism:

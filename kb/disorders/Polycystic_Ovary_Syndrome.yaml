  - reference: PMID:42365073
    reference_title: "Gene prioritization across ancestries uncovers distinct molecular pathophysiology and therapeutic landscape in polycystic ovary syndrome."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "the prioritization of the TLR4 -NF-κB-NLRP3 signaling axis in EUR population"
    explanation: >
      Gene prioritization in European PCOS reveals preferential dysregulation of
      TLR4-NF-kB-NLRP3 inflammatory axis, identifying NF-kB and inflammasome
      inhibition as population-specific therapeutic strategies for immune-dominant disease.
  notes: Population-specific to European PCOS; enriched in inflammatory and immune-related pathway signature.
- name: Mesenchymal Stem Cell and Exosome-Based Regenerative Therapy
  description: >
    Investigational, preclinical regenerative and cell-based disease-modifying
    strategy for PCOS. Mesenchymal stem cells (MSCs) and their secreted
    derivatives (including exosomes), together with gene-edited induced
    pluripotent stem cell (iPSC) platforms, are being explored to move beyond
    symptom-focused management toward mechanism-directed intervention. In
    preclinical models these approaches modulate ovarian inflammation, restore
    ovarian structure, and improve metabolic parameters, while iPSC-based models
    support patient-specific investigation of steroidogenic and metabolic
    abnormalities. Not clinically validated in PCOS; translational barriers
    include targeted delivery, off-target effects, and phenotypic heterogeneity.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: Mesenchymal stem cell and exosome therapy
    term:
      id: NCIT:C70601
      label: Cellular Therapy
  evidence:
  - reference: PMID:42412303
    reference_title: "From Gene Function to Precision Intervention: CRISPR/Cas9 and Stem Cell-Based Strategies as Emerging Disease-Modifying Approaches in PMOS."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Preclinical studies demonstrate that MSCs and their derivatives modulate inflammation, restore ovarian structure, and improve metabolic parameters"
    explanation: >
      Narrative review summarizing preclinical (predominantly animal-model)
      mesenchymal stem cell and exosome regenerative studies in PCOS.

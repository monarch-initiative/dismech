- accession: geo:GSE294074
  title: CNOT6L regulates energy metabolism in the ovarian granulosa cells associated with polycystic ovary syndrome.
  description: As somatic cells surround the oocyte, the endocrine functions exerted by ovarian granulosa cells (GCs) are crucial factors in maintaining follicle development, as oocyte development relies on the provision of energy substrates and cytokines by ovarian granulosa cells. The mRNA deadenylase level of granulosa cells precisely regulates the transcription processes of key molecules involved in oocyte maturation. In this study, we detect the expression level of the deadenylase CNOT6L in PCOS patients' granulosa cells and mouse models' ovaries. We found that the CNOT6L significantly upregulated in the ovarian granulosa cells of both PCOS patients and mouse models.

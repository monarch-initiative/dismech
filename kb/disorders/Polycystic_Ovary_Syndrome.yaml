- accession: ega:EGAS50000000735
  title: 'Single-Cell Profiling of the Human Endometrium in Polycystic Ovary Syndrome: Uncovering Disease Signatures and Treatment Responses'
  description: We generated the first single-nuclei map of human endometrial biopsies from women with and without PCOS to identify cell-type-specific disease signatures, compositional variations, and transcriptomic reversibility after a 16-week intervention with metformin or lifestyle. Single nuclei were extracted from 27 frozen endometrial biopsies for snRNA-seq using the 10X Genomics protocol.

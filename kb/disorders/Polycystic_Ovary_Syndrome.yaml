- name: Microbiota Modulation Therapy
  description: >-
    Microbiota modulation through probiotics, prebiotics, and fecal microbiota
    transplantation (FMT) represents an emerging strategy for restoring metabolic
    homeostasis in PCOS. Dysbiosis-driven metabolic endotoxemia and altered
    short-chain fatty acid production contribute to PCOS pathophysiology, and

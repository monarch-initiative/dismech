inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Biallelic PEX12 variants are required. Every patient assigned to complementation
    group 3 was found to carry variants on both alleles.
  evidence:
  - reference: PMID:9792857
    reference_title: Phenotype-genotype relationships in complementation group 3 of the
      peroxisome-biogenesis disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Here we show that all patients from this group carry mutations on both alleles
      of PEX12.
    explanation: Establishes biallelic requirement across the whole complementation group.
pathophysiology:
- name: Biallelic PEX12 Loss of Function
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Variants on both PEX12 alleles. Truncating alleles that remove the C-terminal
    zinc-binding domain are the ones associated with the severe presentation.
  molecular_functions:
  - preferred_term: zinc ion binding
    modifier: DECREASED
    term:
      id: GO:0008270
      label: zinc ion binding
  downstream:
  - target: Disrupted PEX2-PEX10-PEX12 Retrotranslocation Channel
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:14571262
    reference_title: Novel mutations in the PEX12 gene of patients with a peroxisome
      biogenesis disorder.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Four of the patients have mutations that disrupt the translation frame and/or
      create an early termination codon in the PEX12 open reading frame predicted to
      result in truncated protein products, lacking at least the COOH-terminal zinc-binding
      domain. All these patients display the more severe phenotypes
    explanation: Ties loss of the zinc-binding domain to the severe end of the spectrum,
      which is the presentation this entry curates.
  - reference: PMID:9632816
    reference_title: 'PEX12, the pathogenic gene of group III Zellweger syndrome: cDNA
      cloning by functional complementation on a CHO cell mutant, patient analysis, and
      characterization of PEX12p.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Fibroblasts derived from patients with the peroxisome deficiency Zellweger
      syndrome of complementation group III (CG-III) were also complemented for peroxisome
      biogenesis with PEX12.
    explanation: The complementation experiment that assigned group III to PEX12; IN_VITRO
      because the result is in cultured patient fibroblasts.
- name: Disrupted PEX2-PEX10-PEX12 Retrotranslocation Channel
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    PEX12 co-assembles with its paralogues PEX2 and PEX10 into the ubiquitin-ligase
    retrotranslocation channel of the peroxisomal membrane. Losing PEX12 leaves the
    channel unable to regulate PEX5 ubiquitination.
  cellular_components:
  - preferred_term: peroxisomal membrane
    term:
      id: GO:0005778
      label: peroxisomal membrane
  molecular_functions:
  - preferred_term: ubiquitin-protein transferase activity
    modifier: DECREASED
    term:
      id: GO:0004842
      label: ubiquitin-protein transferase activity
  downstream:
  - target: Failure of PEX5 Receptor Recycling
    causal_link_type: DIRECT
- name: Failure of PEX5 Receptor Recycling
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    PEX5 delivers PTS1-tagged matrix enzymes and must be ubiquitinated and exported
    back to the cytosol to be reused. Without a functioning channel it is not returned,
    so the import cycle stalls after a single round.
  downstream:
  - target: Collapse of Peroxisomal Matrix Protein Import
    causal_link_type: DIRECT
- name: Collapse of Peroxisomal Matrix Protein Import
  biological_scale: CELLULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Matrix enzymes never reach the organelle. The membrane compartment still forms -
    the "peroxisomal ghost" - which is the morphological signature distinguishing a
    biogenesis defect from a single enzyme deficiency.
  biological_processes:
  - preferred_term: protein import into peroxisome matrix
    modifier: DECREASED
    term:
      id: GO:0016558
      label: protein import into peroxisome matrix
  - preferred_term: peroxisome organization
    modifier: DECREASED
    term:
      id: GO:0007031
      label: peroxisome organization
  cellular_components:
  - preferred_term: peroxisomal matrix
    term:
      id: GO:0005782
      label: peroxisomal matrix
  downstream:
  - target: Accumulation of Very-Long-Chain and Branched-Chain Fatty Acids
    causal_link_type: DIRECT
  - target: Plasmalogen Deficiency
    causal_link_type: DIRECT
- name: Accumulation of Very-Long-Chain and Branched-Chain Fatty Acids
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Substrates that only peroxisomes degrade build up systemically: C26:0 and other
    VLCFA, phytanic and pristanic acid, and C27 bile-acid intermediates. This is the
    accumulation half of the biochemical signature and the basis of diagnostic testing.
  biological_processes:
  - preferred_term: very long-chain fatty acid beta-oxidation
    modifier: DECREASED
    term:
      id: GO:0140493
      label: very long-chain fatty acid beta-oxidation
  downstream:
  - target: Progressive Hepatic Injury
    causal_link_type: DIRECT
  - target: Adrenocortical Insufficiency
    causal_link_type: DIRECT
  - target: Impaired Neuronal Migration in the Developing Cortex
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Peroxisomal failure demonstrably disrupts cortical migration, but which accumulating
      substrate or missing lipid does it is not established.
- name: Plasmalogen Deficiency
  biological_scale: MOLECULAR
  mechanism_confidence: ESTABLISHED
  description: >-
    Ether phospholipid synthesis begins in the peroxisome, so plasmalogens - major
    constituents of myelin - and DHA are not made. This is the deficiency half of the
    signature, and the one most plausibly linked to the white-matter disease.
  biological_processes:
  - preferred_term: ether lipid biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0008611
      label: ether lipid biosynthetic process
  downstream:
  - target: Impaired Neuronal Migration in the Developing Cortex
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Impaired Neuronal Migration in the Developing Cortex
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    Neuronal precursors fail to reach their laminar destinations during fetal cortical
    development, producing the perisylvian polymicrogyria and heterotopia that make this
    a congenital malformation rather than a purely degenerative disease. Because the
    lesion is formed before birth, it is not reversible by any postnatal intervention.
  cell_types:
  - preferred_term: radial glial cell
    term:
      id: CL:0000681
      label: radial glial cell
  - preferred_term: neuron
    term:
      id: CL:0000540
      label: neuron
  downstream:
  - target: Severe Neurodevelopmental Impairment
    causal_link_type: DIRECT
- name: Progressive Hepatic Injury
  biological_scale: TISSUE
  mechanism_confidence: ESTABLISHED
  description: >-
    VLCFA and C27 bile-acid intermediates are directly hepatotoxic, driving cholestasis
    and fibrosis.
  cell_types:
  - preferred_term: hepatocyte
    term:
      id: CL:0000182
      label: hepatocyte
- name: Adrenocortical Insufficiency
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    VLCFA accumulation in adrenocortical cells impairs steroidogenesis. Often subclinical
    at first, which is why GeneReviews asks for ACTH and cortisol measurement by age one
    even in children who look adrenally well.
  cell_types:
  - preferred_term: cortical cell of adrenal gland
    term:
      id: CL:0002097
      label: cortical cell of adrenal gland
- name: Severe Neurodevelopmental Impairment
  biological_scale: ORGANISM
  mechanism_confidence: ESTABLISHED
  description: >-
    Profound hypotonia, intractable neonatal seizures, and absent developmental progress.
    In the severe form death usually follows within the first year.
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: Infants with severe ZSD are significantly impaired and typically die during
      the first year of life, usually having made no developmental progress.
    explanation: GeneReviews states the course of the severe end of the spectrum, which
      is what PBD3A denotes.

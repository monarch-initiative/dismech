- discussion_id: pbd3a_no_disease_modifying_therapy
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#
  - pathophysiology#Collapse of Peroxisomal Matrix Protein Import
  prompt: Could peroxisomal matrix import be restored therapeutically in a patient?
  rationale: >-
    Every treatment in this entry is symptomatic. Restoring import would mean restoring
    a membrane translocon in every affected tissue, and the two organs that determine
    outcome present different obstacles: the brain lesion is a completed malformation of
    fetal migration, so even perfect postnatal correction could not undo it, while the
    liver and adrenal disease is progressive and might in principle respond. No approach
    - gene therapy, read-through of nonsense alleles, chaperone rescue of hypomorphic
    alleles - has reached patients. The gap is recorded rather than left implicit
    because the absence of disease-modifying options is the single most important fact
    about managing this diagnosis.

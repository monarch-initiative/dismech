animal_models:
- name: Pex2-deficient mouse
  species: Mouse
  genotype: PEX2 (Pxmp3) targeted null, homozygous
  publication: PMID:9382874
  description: >-
    A knockout of PEX2, one of PEX12's two paralogues in the same retrotranslocation
    channel. It is not a model of PBD3A as such, but it is the model that established
    what losing that channel does to a mammal.
  modeled_mechanisms:
  - target: Collapse of Peroxisomal Matrix Protein Import
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the defining cell-biological lesion, including the ghost membranes.
    limitations: >-
      The disrupted gene is PEX2, not PEX12. The two are paralogous subunits of one
      channel, so the import phenotype is shared, but any PEX12-specific effect - notably
      its role in stimulating PEX10 ligase activity - is not modelled.
    readouts:
    - name: Peroxisomal ghost membranes without matrix enzymes
      target: Collapse of Peroxisomal Matrix Protein Import
      direction: ALTERED
      interpretation: Membrane compartments form but are empty, the signature of a
        biogenesis defect.
      evidence:
      - reference: PMID:9382874
        reference_title: Targeted deletion of the PEX2 peroxisome assembly gene in mice
          provides a model for Zellweger syndrome, a human neuronal migration disorder.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: The PEX2-deficient mice lack normal peroxisomes but do assemble empty
          peroxisome membrane ghosts.
        explanation: Direct observation of the ghost phenotype in the model.
    evidence:
    - reference: PMID:9382874
      reference_title: Targeted deletion of the PEX2 peroxisome assembly gene in mice
        provides a model for Zellweger syndrome, a human neuronal migration disorder.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: They display abnormal peroxisomal biochemical parameters, including accumulations
        of very long chain fatty acids in plasma and deficient erythrocyte plasmalogens.
      explanation: Shows both halves of the biochemical signature - accumulation and
        deficiency - in the model.
  - target: Impaired Neuronal Migration in the Developing Cortex
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces the cortical migration defect that is otherwise inferred from human
      neuropathology, which is the main reason this model matters for the entry.
    limitations: >-
      Mice die within hours of birth, so the postnatal white-matter disease and the
      sensory phenotypes of longer-surviving humans cannot be studied in it. As above,
      the gene is PEX2.
    readouts:
    - name: Cortical lamination and white-matter cell density
      target: Impaired Neuronal Migration in the Developing Cortex
      direction: ALTERED
      interpretation: Disordered lamination with retained cells in the white matter is
        the expected signature of arrested radial migration.
      evidence:
      - reference: PMID:9382874
        reference_title: Targeted deletion of the PEX2 peroxisome assembly gene in mice
          provides a model for Zellweger syndrome, a human neuronal migration disorder.
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: In the central nervous system of newborn mutant mice there is disordered
          lamination in the cerebral cortex and an increased cell density in the underlying
          white matter, indicating an abnormality of neuronal migration.
        explanation: The histological result establishing the migration defect in vivo.
discussions:
- discussion_id: pbd3a_internal_aug_reinitiation
  kind: INTERPRETATION
  attaches_to:
  - genetic#PEX12
  - pathophysiology#Biallelic PEX12 Loss of Function
  prompt: Why does a patient with two apparently severe PEX12 alleles present mildly?
  rationale: >-
    Genotype predicts phenotype well in complementation group 3 - less PEX12 function,
    worse disease - with one documented exception that turns out to be informative rather
    than noise. A compound heterozygote carrying two seemingly null alleles was mildly
    affected. The explanation was that the expressed allele, a 2-bp deletion eight codons
    into the reading frame, still produced a functional protein because translation
    reinitiated at a downstream AUG.

    The general lesson is that "predicted truncating" is a statement about the reading
    frame, not about the protein. An early frameshift can be rescued by internal
    initiation, so severity prediction from variant class alone will occasionally be
    wrong in the direction of over-calling severity. Curated here because this entry is
    defined by being the severe end of its locus, and the boundary between 3A and the
    milder presentations is exactly what such an allele blurs.

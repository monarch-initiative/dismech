notes: >-
  Scope and naming. "3A" is a complementation-group label, not a severity grade applied
  after the fact: group 3 of the peroxisome biogenesis disorders was defined by cell
  fusion long before PEX12 was cloned, and the A/B suffix then split that group by
  severity. This entry curates the A end. The KB already holds Peroxisome Biogenesis
  Disorder 1B (PEX1) and 4B (PEX6), so the three entries together span two severity
  tiers across three subunits of the same import machinery.

  GeneReviews. The chapter is written for the Zellweger spectrum as a whole rather than
  for PEX12, and it says explicitly that the older phenotype names are now subsumed
  under one continuum. Evidence items quoting it say which end of the spectrum the
  quoted sentence describes; several phenotypes are graded PARTIAL because the sentence
  supporting them is about the intermediate/milder end while this entry is the severe
  one.

  Animal model. The Pex2-null mouse is curated rather than a PEX12 model because no
  PEX12 mouse is reported in the sources used here. It is the paralogous subunit of the
  same channel, its limitations field says so, and both links are scoped to what the
  shared channel defect explains rather than to PEX12-specific biology.

  Ontology corrections. Ten of the CURIEs the research report suggested were wrong,
  obsolete, or nonexistent, and were corrected against OLS before use. GO:0033539 was
  offered for peroxisomal beta-oxidation but is the mitochondrial acyl-CoA dehydrogenase
  process - the peroxisomal counterpart is GO:0033540 - which would have been a
  mechanistically inverted binding rather than a mislabel. Also wrong: CL:0000601
  (offered as radial glial cell, is cochlear outer hair cell), CL:0001133 (does not
  resolve), CHEBI:143092 (offered as a VLCFA, is a phosphatidylserine species),
  CHEBI:28865 (offered as phytanic acid, is taurocholic acid), CHEBI:36620 (offered as
  cholic acid, is quinolizine), HP:0002656 (offered as chondrodysplasia punctata, is
  epiphyseal dysplasia), HP:0000121 (offered as nephrolithiasis, is nephrocalcinosis),
  HP:0002187 (offered as hypomyelination, is profound intellectual disability), and
  HP:0012825 (offered as a seizure term, is the severity modifier "Mild").

  Bracketed quotes. Two GeneReviews snippets stop short of the sites they describe
  because the sentence embeds "[chondrodysplasia punctata]" and "patella[e]", and the
  reference validator strips bracketed text, so a span crossing a bracket cannot match
  the cache.

name: Peroxisome Biogenesis Disorder 3A (Zellweger)
creation_date: "2026-08-27T06:05:00Z"
category: Mendelian
description: >-
  Peroxisome biogenesis disorder 3A is the severe, neonatal-lethal end of the
  PEX12-related Zellweger spectrum - historically complementation group 3 of the
  peroxisome biogenesis disorders, which is where the "3" in the name comes from.
  PEX12 is one of three paralogous RING-finger peroxins, with PEX2 and PEX10, that
  together form the retrotranslocation channel in the peroxisomal membrane. That
  channel exists to recycle PEX5, the receptor that carries matrix enzymes into the
  organelle. When it fails, PEX5 is not returned to the cytosol for another round,
  and matrix protein import collapses.

  The consequence is a peroxisome that is still there but empty. Cells from affected
  patients assemble "peroxisomal ghosts" - membrane compartments with no matrix
  enzymes inside - which is why this is a disorder of biogenesis rather than of any
  single peroxisomal enzyme, and why the biochemical signature is broad: very-long-chain
  fatty acids, phytanic and pristanic acid and C27 bile-acid intermediates accumulate
  because nothing is left to degrade them, while plasmalogens and DHA are missing
  because nothing is left to synthesise them. Both halves damage the developing brain,
  the liver, and the adrenal cortex at once, producing the cerebro-hepato-renal
  presentation Zellweger described.

  Within PEX12 the genotype tracks the phenotype more cleanly than in most of the
  spectrum: alleles that truncate the protein before its C-terminal zinc-binding
  domain give the severe "A" presentation curated here, while alleles retaining
  residual function shift toward the milder end. The KB curates the milder "B" end of
  two other PEX genes - Peroxisome Biogenesis Disorder 1B (PEX1) and 4B (PEX6) - so
  this entry is their severity counterpart at a third locus.

genetic:
- name: PEX12
  gene_term:
    preferred_term: PEX12
    term:
      id: hgnc:8854
      label: PEX12
  relationship_type: CAUSATIVE
  notes: >-
    The complementation group 3 gene. Genotype-phenotype correlation is unusually
    tractable here: alleles truncating the protein before the C-terminal zinc-binding
    domain give the severe presentation, while alleles preserving residual function
    shift toward the milder end of the spectrum.
  case_fractions:
  - population: Egyptian PEX12 cohort (14 unrelated families)
    case_fraction_percent: 95.0
    cohort_size: 20
    notes: >-
      A founder in-frame deletion accounted for 19 of 20 patients in this series, so the
      allelic spectrum is population-specific rather than universal.
    evidence:
    - reference: PMID:33123925
      reference_title: A founder mutation in PEX12 among Egyptian patients in peroxisomal
        biogenesis disorder.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: Herein, we define 20 patients derived from 14 unrelated Egyptian families,
        19 of which show a homozygous PEX12 in-frame (c.1047_1049del p.(Gln349del)) deletion.
      explanation: Gives the founder allele and its share of the cohort.
  evidence:
  - reference: PMID:9792857
    reference_title: Phenotype-genotype relationships in complementation group 3 of the
      peroxisome-biogenesis disorders.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: the loss of PEX12 function leads to more-severe cellular and clinical phenotypes
    explanation: States the dose-of-function relationship that separates the A and B ends
      of this locus.
diagnosis:
- name: Plasma Very-Long-Chain Fatty Acid Profile
  description: >-
    The first-line biochemical test. Elevated C26:0 with abnormal C24/C22 and C26/C22
    ratios points at a peroxisomal disorder before any gene is sequenced.
  diagnosis_term:
    preferred_term: laboratory procedure
    term:
      id: NCIT:C25294
      label: Laboratory Procedure
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: The diagnosis of ZSD is established in a proband with the suggestive clinical
      and biochemical findings above by identification of biallelic pathogenic variants
      in one of the 13 known ZSD-PEX genes.
    explanation: GeneReviews Diagnosis places biochemical findings ahead of molecular
      confirmation in the diagnostic sequence.
- name: Molecular Genetic Testing of the ZSD-PEX Genes
  description: >-
    Confirmation requires biallelic variants in one of the ZSD-PEX genes; assignment to
    PEX12 is what makes the entry PBD3 rather than another group.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: by identification of biallelic pathogenic variants in one of the 13 known
      ZSD-PEX genes
    explanation: States the molecular criterion.
treatments:
- name: Supportive and Symptomatic Management
  therapeutic_modality: OTHER
  description: >-
    There is no treatment for the biogenesis defect. Management is entirely symptomatic -
    gastrostomy feeding, anti-seizure medication, hearing aids, cataract surgery,
    fat-soluble vitamin and cholic acid supplementation, adrenal replacement. None of it
    restores peroxisomal import, and the congenital brain malformation is fixed before
    birth, so no postnatal intervention can address the central lesion.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Severe Neurodevelopmental Impairment
    treatment_effect: MODULATES
    description: >-
      Addresses consequences - nutrition, seizures, sensory deficits - without acting on
      peroxisome biogenesis.
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: 'Treatment of manifestations: The focus is on symptomatic therapy and may
      include gastrostomy to provide adequate calories, hearing aids, cataract removal,
      glasses to correct refractive errors, supplementation of fat-soluble vitamins, and
      cholic acid supplementation'
    explanation: GeneReviews Management states that therapy is symptomatic and lists the
      measures.
- name: Adrenal Replacement Therapy
  therapeutic_modality: OTHER
  description: >-
    Glucocorticoid replacement once adrenal insufficiency is documented. Curated
    separately from general supportive care because it depends on active surveillance
    rather than on symptoms - the deficiency is often silent until stressed.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  target_mechanisms:
  - target: Adrenocortical Insufficiency
    treatment_effect: RESTORES
    description: >-
      Replaces the missing hormone output; it does not correct the VLCFA accumulation
      that impaired steroidogenesis.
  evidence:
  - reference: PMID:20301621
    reference_title: Zellweger Spectrum Disorder.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: adrenal replacement therapy; vitamin D supplementation and consideration

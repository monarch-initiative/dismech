      label: squamous epithelial cell
  description: >-
    HPV-independent PSCC frequently harbors somatic loss-of-function mutations
    in CDKN2A (26% overall; 37.5% of HPV16/18-negative tumors), abolishing
    p16INK4a cyclin-dependent kinase inhibitor activity and G1/S cell-cycle
    checkpoint restraint in penile squamous epithelial cells.
  genes:
  - preferred_term: CDKN2A
    term:
      id: hgnc:1787
      label: CDKN2A
  molecular_functions:
  - preferred_term: cyclin-dependent protein serine/threonine kinase inhibitor activity
    modifier: DECREASED
    term:
      id: GO:0004861
      label: cyclin-dependent protein serine/threonine kinase inhibitor activity
  biological_processes:
  - preferred_term: cell cycle checkpoint signaling
    modifier: DECREASED
    term:
      id: GO:0000075
      label: cell cycle checkpoint signaling
  evidence:
  - reference: PMID:37565840
    reference_title: "Comprehensive genomic profiling of penile squamous cell carcinoma and the impact of human papillomavirus status on immune-checkpoint inhibitor-related biomarkers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      KMT2C mutations (33% vs. 0%) and FGF3 amplifications (30.8% vs. 0%) were
      specific to HPV16/18+ tumors, whereas CDKN2A mutations (0% vs. 37.5%) were
      exclusive to HPV16/18- tumors.
    explanation: >-
      Establishes somatic CDKN2A mutation as a recurrent driver exclusive to
      HPV16/18-negative PSCC in the sequenced subset.
  downstream:
  - target: Invasive Squamous Cell Proliferation
    description: Loss of CDKN2A cell-cycle checkpoint restraint promotes proliferation in HPV-independent PSCC.

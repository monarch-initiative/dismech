    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      The recent refinements in the technique of dynamic sentinel lymph node
      biopsy (DSLNB) demonstrated high diagnostic accuracy with considerably
      lower morbidity compared to conventional open modified/superficial

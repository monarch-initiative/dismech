- name: Somatic CDKN2A Cell-Cycle Kinase Inhibitor Loss
  biological_scale: MOLECULAR
  conforms_to: "evading_growth_suppressors#Loss of Cell-Cycle Checkpoint Control"
  genetic_context:
    variant_origin: SOMATIC
    functional_impact_category: LOSS_OF_FUNCTION
  cell_types:
  - preferred_term: squamous epithelial cell
    term:

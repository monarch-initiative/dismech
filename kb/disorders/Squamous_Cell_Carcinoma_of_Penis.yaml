    term:
      id: GO:0043491
      label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
  evidence:
  - reference: PMID:37565840
    reference_title: "Comprehensive genomic profiling of penile squamous cell carcinoma and the impact of human papillomavirus status on immune-checkpoint inhibitor-related biomarkers."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      NGS of the overall cohort (N = 108) revealed TP53 (46%), CDKN2A (26%),
      and PIK3CA (25%) to be the most common mutations.
    explanation: >-
      Identifies PIK3CA among the three most frequent somatic driver mutations
      in PSCC.
  downstream:

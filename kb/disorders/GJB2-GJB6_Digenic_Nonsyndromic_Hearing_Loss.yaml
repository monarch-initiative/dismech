- name: Cochlear Implantation
  description: For severe-to-profound hearing loss, cochlear implantation as early as possible, within the
    1-3-6 benchmark of newborn screening by one month, genetic diagnosis by three months and intervention
    by six months. The implant stimulates the auditory nerve directly and does not correct the cochlear
    connexin defect.

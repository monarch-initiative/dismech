name: GJB2-GJB6 Digenic Nonsyndromic Hearing Loss
creation_date: '2026-07-03T00:00:00Z'
category: Mendelian
description: >
  DFNB1 is the most common cause of autosomal recessive nonsyndromic prelingual
  sensorineural hearing loss and maps to a complex locus on chromosome 13q12 that
  contains two genes encoding cochlear gap-junction beta connexins: GJB2 (connexin
  26) and GJB6 (connexin 30). Most DFNB1 disease is monogenic, caused by biallelic
  GJB2 mutations. However, a substantial fraction of patients carry only a single
  GJB2 mutant allele, and in many of these the second lesion is a large deletion
  in GJB6, del(GJB6-D13S1830). Because connexin 26 and connexin 30 co-assemble
  into the same cochlear gap-junction plaques required for potassium recycling,
  a GJB2 mutation on one allele together with a GJB6 deletion on the other can
  cause hearing loss digenically - the classic textbook example of digenic
  inheritance in nonsyndromic deafness. The GJB6 deletion may also act in cis by
  removing a GJB2 regulatory element; both routes converge on loss of cochlear
  connexin function.
disease_term:
  preferred_term: DFNB1 nonsyndromic hearing loss (GJB2/GJB6, digenic)
  term:
    id: MONDO:0009076
    label: autosomal recessive nonsyndromic hearing loss 1A
parents:
- Nonsyndromic Hearing Loss
- Inner Ear Disorder
inheritance:
- name: Autosomal recessive (monogenic GJB2, DFNB1A)
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >
    The majority of DFNB1 hearing loss is monogenic autosomal recessive disease
    caused by biallelic pathogenic variants in GJB2 (connexin 26), the single most
    common cause of hereditary nonsyndromic deafness.
  evidence:
  - reference: PMID:11807148
    reference_title: "A deletion involving the connexin 30 gene in nonsyndromic hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Up to 50 percent of all patients with autosomal recessive nonsyndromic
      prelingual deafness in different populations have mutations in the gene
      encoding the gap-junction protein connexin 26 (GJB2) at locus DFNB1 on
      chromosome 13q12.
    explanation: >-
      Establishes GJB2 (connexin 26) biallelic mutation as the predominant,
      monogenic autosomal recessive cause of DFNB1 prelingual deafness.
- name: Digenic inheritance (GJB2/GJB6)
  inheritance_term:
    preferred_term: Digenic inheritance
    term:
      id: HP:0010984
      label: Digenic inheritance
  description: >
    A large fraction of patients carry only one GJB2 mutant allele; in many of
    these the second lesion is the del(GJB6-D13S1830) deletion in GJB6 (connexin
    30) in trans, so that double heterozygosity for a GJB2 mutation and a GJB6
    deletion causes hearing loss digenically. This is the canonical example of
    digenic inheritance in nonsyndromic deafness.
  evidence:
  - reference: PMID:11807148
    reference_title: "A deletion involving the connexin 30 gene in nonsyndromic hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our data suggest that mutations in the complex locus DFNB1, which contains
      two genes (GJB2 and GJB6), can result in a monogenic or a digenic pattern
      of inheritance of prelingual deafness.
    explanation: >-
      Directly establishes a digenic (GJB2/GJB6) pattern of inheritance at the
      DFNB1 locus alongside the monogenic GJB2 form.
  - reference: PMID:11807148
    reference_title: "A deletion involving the connexin 30 gene in nonsyndromic hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Twenty-two of the 33 subjects were heterozygous for both the GJB6 and GJB2
      mutations, including all 9 with evidence of linkage to DFNB1.
    explanation: >-
      Documents the double-heterozygous GJB2/GJB6 genotype in affected patients,
      the genetic signature of digenic DFNB1 deafness.
prevalence:
- population: Spanish nonsyndromic prelingual deafness probands with a single GJB2 mutant allele
  notes: >-
    Among probands with only one GJB2 mutant allele, the del(GJB6-D13S1830)
    deletion was the second most frequent DFNB1 mutation, most often found in
    trans with a GJB2 mutation (digenic genotype).
  evidence:
  - reference: PMID:11807148
    reference_title: "A deletion involving the connexin 30 gene in nonsyndromic hearing impairment."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 342-kb deletion in GJB6 is the second most frequent mutation causing
      prelingual deafness in the Spanish population.
    explanation: >-
      Quantifies the GJB6 deletion as the second most common DFNB1 lesion,
      supporting the epidemiological relevance of the digenic genotype.
pathophysiology:
- name: Loss of Cochlear Connexin Gap-Junction Coupling
  description: >
    Connexin 26 (GJB2) and connexin 30 (GJB6) co-assemble into the gap-junction
    plaques of the non-sensory epithelial supporting cells and the spiral ligament
    fibrocytes of the cochlea. A GJB2 loss-of-function mutation combined with a
    GJB6 deletion (or biallelic GJB2 mutation) disrupts this shared connexin
    network and abolishes intercellular coupling.
  genes:
  - preferred_term: GJB2
    term:
      id: hgnc:4284
      label: GJB2
  - preferred_term: GJB6
    term:
      id: hgnc:4288
      label: GJB6
  cell_types:
  - preferred_term: Cochlear supporting cell
    term:
      id: CL:0000630
      label: supporting cell
  biological_processes:
  - preferred_term: Gap-junctional cell-cell signaling
    modifier: DECREASED
    term:
      id: GO:0007267
      label: cell-cell signaling
  evidence:
  - reference: PMID:9139825
    reference_title: "Connexin 26 mutations in hereditary non-syndromic sensorineural deafness."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      Immunohistochemical staining of human cochlear cells for Cx26 demonstrated
      high levels of expression.
    explanation: >-
      Demonstrates high connexin 26 expression in human cochlear cells, the
      substrate whose loss disrupts cochlear gap-junction coupling.
  downstream:
  - target: Impaired Endocochlear Potassium Recycling
- name: Impaired Endocochlear Potassium Recycling
  description: >
    The cochlear connexin gap-junction networks form the route by which potassium
    ions entering sensory hair cells during mechanotransduction are recycled back
    to the endolymph. Loss of connexin 26/30 coupling interrupts this potassium
    recycling pathway, disturbing endolymph homeostasis.
  cell_types:
  - preferred_term: Cochlear supporting cell
    term:
      id: CL:0000630
      label: supporting cell
  biological_processes:
  - preferred_term: Potassium ion recycling
    modifier: DECREASED
    term:
      id: GO:0006813
      label: potassium ion transport
  evidence:
  - reference: PMID:11810458
    reference_title: "Potassium ion recycling pathway via gap junction systems in the mammalian cochlea and its interruption in hereditary nonsyndromic deafness."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The two networks of gap junctions form the route by which K+ ions that
      pass through the sensory cells during mechanosensory transduction can be
      recycled back to the endolymphatic space, from which they reenter the
      sensory cells.
    explanation: >-
      Describes the cochlear gap-junction potassium recycling pathway whose
      interruption by connexin loss underlies DFNB1 deafness.
  downstream:
  - target: Prelingual Sensorineural Hearing Loss
- name: Prelingual Sensorineural Hearing Loss
  description: >
    Disruption of cochlear potassium recycling causes sensorineural hearing loss
    that is typically prelingual (congenital), bilateral, and ranges from mild to
    profound.
  evidence:
  - reference: PMID:9139825
    reference_title: "Connexin 26 mutations in hereditary non-syndromic sensorineural deafness."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      identified a mutation in the gene encoding the gap-junction protein
      connexin 26 (Cx26) that segregates with the profound deafness in the
      family.
    explanation: >-
      Links connexin 26 mutation to profound sensorineural deafness segregating
      in an affected family.

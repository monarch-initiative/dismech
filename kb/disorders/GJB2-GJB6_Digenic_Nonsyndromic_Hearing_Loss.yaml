    - reference: PMID:31656340
      reference_title: 'Hearing loss grades and the International classification of functioning, disability and health.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Profound hearing loss | 80.0 to 94.9 dB hearing level"
      explanation: Table 2 row giving the profound grade.
    - reference: PMID:31656340
      reference_title: 'Hearing loss grades and the International classification of functioning, disability and health.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Complete or total hearing loss | 95.0 dB hearing level or greater"
      explanation: Table 2 row giving the top, open-ended grade.
    - reference: PMID:31656340
      reference_title: 'Hearing loss grades and the International classification of functioning, disability and health.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "b Average of 500, 1000, 2000 and 4000 Hz. Source: Global Burden of Disease Expert Group on Hearing Loss."
      explanation: >-
        Table 2 footnote naming the four frequencies averaged and the body that set the grades; footnote a
        places the measurement in the better ear.
    - reference: PMID:41718341
      reference_title: 'Self-Perceived Hearing Handicap and Audiometric Severity in Age-Related Hearing Loss: Associations with Age and Sex.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Moderate hearing loss (BE PTA-4 35 to <50 dB HL)"
      explanation: >-
        A clinical study stratifying patients by WHO hearing loss categories uses the same 35 to below 50 dB
        moderate band on the better-ear four-frequency average.
  - unit: dB
    population: >-
      Earlier WHO grades of hearing impairment (based on the 1991 version), better-ear average of 500, 1000,
      2000 and 4000 Hz, as tabulated by Olusanya, Davis and Hoffman (WHO Bulletin)
    interpretation_bands:
    - name: 'Grade 0: no impairment'
      upper_bound: 26
      unit: dB
      abnormal_flag: NORMAL
    - name: 'Grade 1: slight impairment'
      lower_bound: 26
      upper_bound: 41
      unit: dB
      abnormal_flag: HIGH
    - name: 'Grade 2: moderate impairment'
      lower_bound: 41
      upper_bound: 61
      unit: dB
      abnormal_flag: HIGH
      severity: MODERATE
    - name: 'Grade 3: severe impairment'
      lower_bound: 61
      upper_bound: 81
      unit: dB
      abnormal_flag: HIGH
      severity: SEVERE
    - name: 'Grade 4: profound impairment including deafness'
      lower_bound: 81
      unit: dB
      abnormal_flag: HIGH
    notes: >-
      Superseded scheme, recorded because older clinical literature reports severity on it and its
      boundaries differ from the Global Burden of Disease grades above. The source states whole-decibel
      ranges (25 dB or better, 26-40 dB, 41-60 dB, 61-80 dB, 81 dB or greater); an average falling between
      two stated ranges, such as 25.5 dB, is not assigned by the source and falls in the upper grade under
      the half-open convention used here. The same source records that only adults with a permanent
      unaided impairment above 40 dB hearing level in the better ear, and children with more than 30 dB,
      were regarded as having a disabling hearing impairment. Severity is set only where the grade name is
      moderate or severe. The grading is generic to hearing loss of any cause.
    evidence:
    - reference: PMID:31656340
      reference_title: 'Hearing loss grades and the International classification of functioning, disability and health.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "1: slight impairment | 26-40 dB | Able to hear and repeat words spoken in normal voice at 1 m"
      explanation: Table 1 row giving the slight grade in the earlier WHO scheme.
    - reference: PMID:31656340
      reference_title: 'Hearing loss grades and the International classification of functioning, disability and health.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "4: profound impairment including deafness | 81 dB or greater"
      explanation: Table 1 row giving the top grade in the earlier WHO scheme.
    - reference: PMID:31656340
      reference_title: 'Hearing loss grades and the International classification of functioning, disability and health.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: >-
        currently only adults (≥ 15 years) with a permanent unaided hearing impairment above 40 dB hearing
        level in the better ear and children (from birth to 14 years of age) with > 30 dB hearing level are
        regarded as having a disabling hearing impairment
      explanation: Places the earlier scheme's disabling-impairment cut-offs in the better ear.
  evidence:
  - reference: PMID:15064611
    reference_title: 'Connexin 26 and connexin 30 mutations in children with nonsyndromic hearing loss.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Audiometric testing, including pure-tone audiometry and auditory evoked brainstem response, was also
      performed to determine the degree of hearing loss.
    explanation: >-
      In a cohort of children with nonsyndromic sensorineural hearing loss screened for Cx26 mutations
      and the del(GJB6-D13S1830) Cx30 deletion, pure-tone audiometry and auditory brainstem response
      testing were the measurements used to grade the degree of hearing loss.

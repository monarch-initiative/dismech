    quote_role: REVIEW_SYNTHESIS
    snippet: About 1% of individuals with GJB2-AR NSHL are compound heterozygotes for one GJB2 pathogenic variant and one of several different deletions that include sequences upstream of GJB2 (comprising either GJB6 and portions of CRYL1 or just portions of CRYL1) that delete regulatory regions of GJB2 on the same allele, thereby abolishing GJB2 expression.
    explanation: States the cis-regulatory mechanism of the GJB6-containing deletions, which abolish GJB2
      expression from the same allele.
  downstream:
  - target: Loss of Cochlear Connexin Gap-Junction Coupling
    causal_link_type: DIRECT
- name: Loss of Cochlear Connexin Gap-Junction Coupling
  biological_scale: MOLECULAR
  description: |
    Connexin 26 (GJB2) and connexin 30 (GJB6) co-assemble into the gap-junction plaques of the non-sensory epithelial supporting cells and the spiral ligament fibrocytes of the cochlea. Biallelic GJB2 loss, whether from two GJB2 coding variants or from one coding variant in trans with an upstream deletion that silences GJB2 in cis, disrupts this connexin network and abolishes intercellular coupling. Deletions that remove GJB6 also remove the connexin 30 contribution from that allele.

inheritance:
- name: Autosomal recessive (monogenic GJB2, DFNB1A)
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: |
    The majority of DFNB1 hearing loss is monogenic autosomal recessive disease caused by biallelic pathogenic variants in GJB2 (connexin 26), the single most common cause of hereditary nonsyndromic deafness.
  evidence:
  - reference: PMID:11807148
    reference_title: A deletion involving the connexin 30 gene in nonsyndromic hearing impairment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Up to 50 percent of all patients with autosomal recessive nonsyndromic prelingual deafness
      in different populations have mutations in the gene encoding the gap-junction protein connexin 26
      (GJB2) at locus DFNB1 on chromosome 13q12.
    explanation: Establishes GJB2 (connexin 26) biallelic mutation as the predominant, monogenic autosomal
      recessive cause of DFNB1 prelingual deafness.
  - reference: PMID:20301449
    reference_title: GJB2-Related Autosomal Recessive Nonsyndromic Hearing Loss.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: If both parents are known to be heterozygous for a pathogenic variant, each sib of an individual
      with GJB2-AR NSHL has at conception a 25% chance of inheriting biallelic pathogenic variants and having
      hearing loss, a 50% chance of inheriting one pathogenic variant, and a 25% chance of inheriting neither
      of the familial GJB2 pathogenic variants.
    explanation: GeneReviews genetic-counseling statement of the autosomal recessive sib recurrence risks.
- name: Digenic inheritance (GJB2/GJB6)
  inheritance_term:
    preferred_term: Digenic inheritance
    term:
      id: HP:0010984
      label: Digenic inheritance
  description: |
    Historical interpretation. Patients carrying one GJB2 mutant allele in trans with the del(GJB6-D13S1830) deletion were reported in 2002 as double heterozygotes with a digenic pattern of inheritance, and the genotype is often cited as the canonical example of digenic inheritance in nonsyndromic deafness. GeneReviews now describes these deletions as removing GJB2 regulatory regions on the same allele, which makes the genotype a compound heterozygous loss of GJB2 expression, that is, monogenic autosomal recessive disease. The REFUTE item below records that reading. The binding is kept because the published digenic interpretation is what this entry is named after; whether the entry should remain separate from GJB2-related autosomal recessive hearing loss is an open scope question.
  evidence:
  - reference: PMID:11807148
    reference_title: A deletion involving the connexin 30 gene in nonsyndromic hearing impairment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Our data suggest that mutations in the complex locus DFNB1, which contains two genes (GJB2
      and GJB6), can result in a monogenic or a digenic pattern of inheritance of prelingual deafness.
    explanation: Directly establishes a digenic (GJB2/GJB6) pattern of inheritance at the DFNB1 locus
      alongside the monogenic GJB2 form.
  - reference: PMID:11807148
    reference_title: A deletion involving the connexin 30 gene in nonsyndromic hearing impairment.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: Twenty-two of the 33 subjects were heterozygous for both the GJB6 and GJB2 mutations, including
      all 9 with evidence of linkage to DFNB1.
    explanation: Documents the double-heterozygous GJB2/GJB6 genotype in affected patients, the genetic
      signature of digenic DFNB1 deafness.
  - reference: PMID:20301449
    reference_title: GJB2-Related Autosomal Recessive Nonsyndromic Hearing Loss.
    supports: REFUTE
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: About 1% of individuals with GJB2-AR NSHL are compound heterozygotes for one GJB2 pathogenic variant and one of several different deletions that include sequences upstream of GJB2 (comprising either GJB6 and portions of CRYL1 or just portions of CRYL1) that delete regulatory regions of GJB2 on the same allele, thereby abolishing GJB2 expression.
    explanation: GeneReviews places the GJB6-containing deletions in cis with GJB2, acting by abolishing
      GJB2 expression from the same allele. A GJB2 variant in trans with such a deletion is therefore biallelic
      loss of GJB2 expression, which contradicts a requirement for variants at two independent loci.
prevalence:
- population: Spanish nonsyndromic prelingual deafness probands with a single GJB2 mutant allele
  notes: Among probands with only one GJB2 mutant allele, the del(GJB6-D13S1830) deletion was the second
    most frequent DFNB1 mutation, most often found in trans with a GJB2 mutation (digenic genotype).
  evidence:

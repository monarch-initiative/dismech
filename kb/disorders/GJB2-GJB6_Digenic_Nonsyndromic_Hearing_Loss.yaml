- name: GJB2 and GJB6 molecular genetic testing
  presence: Post-test confirmation
  description: Molecular screening of the DFNB1 locus combines GJB2 coding-sequence analysis with targeted
    breakpoint PCR for the 342-kb del(GJB6-D13S1830) deletion in GJB6, resolving the morbid genotype in
    patients who carry only a single GJB2 mutant allele.
  results: Double heterozygosity in trans for a pathogenic GJB2 variant and the del(GJB6-D13S1830) deletion
    in GJB6 (or biallelic pathogenic variants in GJB2 or GJB6).

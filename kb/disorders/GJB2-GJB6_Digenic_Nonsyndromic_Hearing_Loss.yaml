  reference_ranges:
  - unit: dB
    population: >-
      Grades recommended by the Global Burden of Disease Expert Group on Hearing Loss, better-ear average
      of 500, 1000, 2000 and 4000 Hz, as tabulated by Olusanya, Davis and Hoffman (WHO Bulletin)
    interpretation_bands:
    - name: Normal hearing
      upper_bound: 20
      unit: dB
      abnormal_flag: NORMAL
    - name: Mild hearing loss
      lower_bound: 20
      upper_bound: 35
      unit: dB
      abnormal_flag: HIGH
      severity: MILD
    - name: Moderate hearing loss
      lower_bound: 35
      upper_bound: 50
      unit: dB
      abnormal_flag: HIGH
      severity: MODERATE
    - name: Moderately severe hearing loss
      lower_bound: 50
      upper_bound: 65
      unit: dB
      abnormal_flag: HIGH
    - name: Severe hearing loss
      lower_bound: 65
      upper_bound: 80
      unit: dB
      abnormal_flag: HIGH
      severity: SEVERE
    - name: Profound hearing loss
      lower_bound: 80
      upper_bound: 95
      unit: dB
      abnormal_flag: HIGH
    - name: Complete or total hearing loss
      lower_bound: 95
      unit: dB
      abnormal_flag: HIGH
    notes: >-
      Values are dB hearing level (HL). The source gives each grade as a closed range to one decimal place
      (Mild hearing loss 20.0 to 34.9 dB hearing level, and so on up to Complete or total hearing loss 95.0
      dB hearing level or greater); the half-open bands here are the same partition. The source splits
      normal hearing into -10.0 to 4.9 and 5.0 to 19.9 dB hearing level; both are folded into one Normal
      hearing band. Its Unilateral category (below 20.0 dB in the better ear, 35.0 dB or greater in the
      worse ear) needs both ears and is not representable as a band. Severity is set only where the grade
      name is mild, moderate or severe. Bonetti (PMID:41718341) applies the same boundaries, up to
      moderately severe, as the WHO-defined hearing loss categories; the WHO report itself is not
      PubMed-indexed, so the grades are quoted from these restatements. No LOINC code was found for the better-ear four-frequency pure-tone average these grades read: Monarch KG searches for pure tone average, threshold average, average hearing, PTA and hearing level returned none. The range therefore names no loinc_term. A numeric band on the panel LOINC:89015-2 would put a number on an instrument, and on any one frequency code would misstate what is graded; the average is computed from the eight per-frequency codes bound above. LOINC:98422-9 (Hearing loss degree Ear - left) and LOINC:98427-8 (Hearing loss degree Ear - right) exist but carry the category, not the dB value, so they are not bound. The grading is generic to hearing loss of any cause, not specific to this disease. The severity words this entry uses come from its cited clinical sources, which do not necessarily use these boundaries.
    evidence:
    - reference: PMID:31656340
      reference_title: 'Hearing loss grades and the International classification of functioning, disability and health.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: REVIEW_SYNTHESIS
      snippet: "Mild hearing loss | 20.0 to 34.9 dB hearing level"
      explanation: >-
        Table 2 row giving the lower boundary of hearing loss and the mild grade in the Global Burden of

  - reference: PMID:26633546
    reference_title: Accelerating matchmaking of novel dysmorphology syndromes through clinical and genomic characterization of a large cohort.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      10 of these genes are published here for the first time as novel
      candidates (CDK9, NEK9, ZNF668, TTC28, MBL2, CADPS, CACNA1H, HYAL2, CTU2,
      and C3ORF17)
    explanation: >-
      First report of ZNF668 as a candidate gene for a recessive dysmorphology
      syndrome.
pathophysiology:
- name: Biallelic ZNF668 Loss of Function
  description: >-
    Both ZNF668 alleles carry truncating variants, so affected individuals are
    expected to lack functional ZNF668.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: ZNF668
    term:
      id: hgnc:25821
      label: ZNF668

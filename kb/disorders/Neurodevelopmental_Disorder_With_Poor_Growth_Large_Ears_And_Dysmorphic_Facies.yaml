- name: Impaired Tip60-Mediated H2AX Acetylation and Chromatin Relaxation
  description: ZNF668 binds Tip60 and promotes acetylation of histone H2AX after ionizing radiation. Without
    ZNF668, H2AX hyperacetylation and the chromatin relaxation it drives are impaired, so repair proteins
    are recruited less efficiently to DNA lesions. Experimentally relaxing chromatin rescues the defect.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: chromatin remodeling
    modifier: DECREASED
    term:
      id: GO:0006338
      label: chromatin remodeling
  evidence:
  - reference: PMID:23777805
    reference_title: Zinc finger protein 668 interacts with Tip60 to promote H2AX acetylation after DNA
      damage.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In response to IR, ZNF668 knockdown reduces Tip60-H2AX interaction and impairs IR-induced
      histone H2AX hyperacetylation, thus impairing chromatin relaxation.
    explanation: Knockdown in U2OS cells impairs H2AX acetylation and chromatin relaxation.
  - reference: PMID:23777805
    reference_title: Zinc finger protein 668 interacts with Tip60 to promote H2AX acetylation after DNA
      damage.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In both IR and UV damage responses, chromatin relaxation counteracted the impaired loading
      of repair proteins and DNA repair defects in ZNF668-deficient U2OS cells
    explanation: Relaxing chromatin rescues the defect, placing chromatin access upstream of it.
  downstream:
  - target: Defective DNA Damage Repair
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:23777805
      reference_title: Zinc finger protein 668 interacts with Tip60 to promote H2AX acetylation after
        DNA damage.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: Impaired chromatin relaxation causes decreased recruitment of repair proteins to DNA lesions,
        defective homologous recombination (HR) repair and impaired cell survival after IR.
      explanation: The impaired chromatin relaxation is shown to cause the repair defect.
- name: Reduced p53 Stabilization After DNA Damage
  description: ZNF668 is a nucleolar protein that binds MDM2 and p53 and limits MDM2-mediated ubiquitination
    and degradation of p53. Its loss lowers basal p53 and blunts p53 stabilization after DNA damage. This
    was characterized as a tumor-suppressor function in breast cancer cells; whether it contributes to
    the neurodevelopmental disorder is unknown.
  biological_scale: MOLECULAR
  biological_processes:
  - preferred_term: DNA damage response
    modifier: DECREASED
    term:
      id: GO:0006974
      label: DNA damage response
  evidence:
  - reference: PMID:21852383
    reference_title: ZNF668 functions as a tumor suppressor by regulating p53 stability and function in
      breast cancer.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: Through MDM2 binding, ZNF668 regulated autoubiquitination of MDM2 and its ability to mediate
      p53 ubiquitination and degradation.
    explanation: ZNF668 controls MDM2-mediated p53 degradation in cell lines.
- name: Defective DNA Damage Repair
  description: Fibroblasts from affected individuals in both families show a DNA damage repair defect.
    In ZNF668-depleted cell lines, repair proteins are recruited less to DNA lesions, homologous recombination
    repair is defective, and RPA phosphorylation and recruitment after UV damage are reduced.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: fibroblast
    term:
      id: CL:0000057
      label: fibroblast
  biological_processes:
  - preferred_term: DNA repair
    modifier: DECREASED
    term:
      id: GO:0006281
      label: DNA repair
  - preferred_term: double-strand break repair via homologous recombination
    modifier: DECREASED
    term:
      id: GO:0000724
      label: double-strand break repair via homologous recombination
  evidence:
  - reference: PMID:34313816
    reference_title: ZNF668 deficiency causes a recognizable disorder of DNA damage repair.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: DNA damage repair defect was observed in fibroblasts of affected individuals.
    explanation: Patient fibroblasts show the repair defect.
  - reference: PMID:23777805
    reference_title: Zinc finger protein 668 interacts with Tip60 to promote H2AX acetylation after DNA
      damage.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: In addition, ZNF668 knockdown decreased RPA phosphorylation and its recruitment to DNA damage
      foci in response to UV.
    explanation: Knockdown cells also have a defective response to UV damage.
  downstream:
  - target: Microcephaly
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Proposed by analogy with other Mendelian DNA repair disorders that cause microcephaly
      and growth failure; no study has traced the step in ZNF668 deficiency.
  - target: Growth delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Proposed by the same analogy; not studied directly.
  - target: Severe global developmental delay
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Proposed by the same analogy; not studied directly.
  - target: Brain malformation
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Proposed by the same analogy; not studied directly.
  - target: Facial dysmorphism
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: Proposed by the same analogy; not studied directly.

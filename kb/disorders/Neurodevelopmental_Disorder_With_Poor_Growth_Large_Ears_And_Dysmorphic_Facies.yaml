notes: 'No GeneReviews chapter covers this disorder (checked with `just check-genereviews`). The clinical
  literature is two reports with shared authors, both cited here from their PubMed abstracts: the 2016
  candidate-gene report (PMID:26633546) and the 2021 delineation of two families, one new and one previously
  published (PMID:34313816). The large ears named in the MONDO label come from the OMIM entry (OMIM:620194);
  neither cached abstract names the ear finding, so it is not recorded as a phenotype here. The mechanistic
  work on ZNF668 (PMID:23777805, PMID:21852383) was done in cancer cell lines by knockdown, not in patient
  cells or neural tissue.'

name: Neurodevelopmental Disorder With Poor Growth, Large Ears, And Dysmorphic Facies
creation_date: '2026-10-19T02:00:00Z'
category: Mendelian
synonyms:
- ZNF668-related ZMAND
- ZNF668-related brain malformation, microcephaly, abnormal growth, neurodevelopmental delay, and dysmorphism
- ZNF668 deficiency
description: >-
  Autosomal recessive neurodevelopmental disorder caused by biallelic truncating
  variants in ZNF668, a nucleolar zinc finger protein. ZNF668 was first proposed
  as a candidate gene in a consanguineous family with an unexplained
  dysmorphology syndrome, and the disorder was then delineated in two families
  with microcephaly, growth deficiency, severe global developmental delay, brain
  malformation and a recognizable facial dysmorphism. Patient fibroblasts show a
  DNA damage repair defect, which places the disorder among the Mendelian
  disorders of DNA repair. In cell lines, ZNF668 promotes Tip60-mediated
  acetylation of histone H2AX after DNA damage, which relaxes chromatin and lets
  repair proteins reach the lesion, and it stabilizes p53 by restraining MDM2.
  How the repair defect produces the neurodevelopmental phenotype has not been
  studied.
disease_term:
  preferred_term: neurodevelopmental disorder with poor growth, large ears, and dysmorphic facies
  term:
    id: MONDO:0859350
    label: neurodevelopmental disorder with poor growth, large ears, and dysmorphic facies
parents:
- Neurodevelopmental Disorder
- DNA Repair Disorder
notes: >-
  No GeneReviews chapter covers this disorder (checked with
  `just check-genereviews`). The clinical literature is two reports with shared
  authors, both cited here from their PubMed abstracts: the 2016 candidate-gene
  report (PMID:26633546) and the 2021 delineation of two families, one new and
  one previously published (PMID:34313816). The large ears named in the
  MONDO label come from the OMIM entry (OMIM:620194); neither cached abstract
  names the ear finding, so it is not recorded as a phenotype here. The
  mechanistic work on ZNF668 (PMID:23777805, PMID:21852383) was done in cancer
  cell lines by knockdown, not in patient cells or neural tissue.

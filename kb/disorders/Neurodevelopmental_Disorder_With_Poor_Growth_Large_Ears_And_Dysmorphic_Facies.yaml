genetic:
- name: ZNF668
  notes: >-
    Biallelic truncating variants in ZNF668 cause the disorder. ZNF668 was first
    named as a novel candidate gene in a series of consanguineous families with
    apparently novel autosomal recessive dysmorphology syndromes.
  gene_term:
    preferred_term: ZNF668
    term:

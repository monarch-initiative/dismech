name: Neurodevelopmental Disorder With Poor Growth, Large Ears, And Dysmorphic Facies
creation_date: '2026-10-19T02:00:00Z'
category: Mendelian
synonyms:
- ZNF668-related ZMAND
- ZNF668-related brain malformation, microcephaly, abnormal growth, neurodevelopmental delay, and dysmorphism
- ZNF668 deficiency
description: Autosomal recessive neurodevelopmental disorder caused by biallelic truncating variants in
  ZNF668, a nucleolar zinc finger protein. ZNF668 was first proposed as a candidate gene in a consanguineous
  family with an unexplained dysmorphology syndrome, and the disorder was then delineated in two families
  with microcephaly, growth deficiency, severe global developmental delay, brain malformation and a recognizable
  facial dysmorphism. Patient fibroblasts show a DNA damage repair defect, which places the disorder among
  the Mendelian disorders of DNA repair. In cell lines, ZNF668 promotes Tip60-mediated acetylation of
  histone H2AX after DNA damage, which relaxes chromatin and lets repair proteins reach the lesion, and
  it stabilizes p53 by restraining MDM2. How the repair defect produces the neurodevelopmental phenotype
  has not been studied.

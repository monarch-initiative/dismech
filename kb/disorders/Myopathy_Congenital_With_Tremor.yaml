    - preferred_term: primidone
      term:
        id: CHEBI:8412
        label: primidone
  evidence:
  - reference: PMID:40508067
    reference_title: "Pulsatile Myofilament Activity in Myotrem Myopathy Associated with Myogenic Tremor."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "β-blockers, commonly prescribed to treat heart rhythm disturbances and essential tremor, and primidone, typically used to control epileptic seizures, have proven ineffective in treating Myotrem tremor."
    explanation: The introduction of a laboratory study states that these drugs do not control the tremor in patients.
  - reference: PMID:42211024
    reference_title: "MYBPC1-associated congenital myopathy with tremor: further delineation of the clinical and pathological phenotype in the first Italian case."
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "In our patient, no symptomatic treatment for tremor was attempted, considering the available literature suggesting limited or no benefit of primidone and beta-blockers in this form of tremor"
    explanation: A case report citing prior literature that these drugs give little or no benefit.
diagnosis:
- name: Genetic testing
  description: >-
    MYBPC1 sequencing, usually within a neuromuscular panel or exome,
    confirms the diagnosis; it should be considered in hypotonic infants with
    tremor and normal nerve conduction, where spinal muscular atrophy is the
    main alternative.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:38690148
    reference_title: "Expanding the Spectrum of Congenital Myopathy Linked to Variants in the MYBPC1 Gene: A Clinical Report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Tremors and respiratory distress associated with stridor should raise the diagnosis of congenital myopathy with tremors linked to MYBPC1-dominant variants in children with neonatal hypotonia."
    explanation: When to suspect the disease.
- name: Tremor electrophysiology
  description: >-
    Accelerometry and surface EMG show a postural tremor of about 10-11 Hz
    with antagonist co-activation and no rest tremor in adults.
  diagnosis_term:
    preferred_term: electromyography
    term:
      id: NCIT:C38056
      label: Electromyography
  evidence:
  - reference: PMID:42211024
    reference_title: "MYBPC1-associated congenital myopathy with tremor: further delineation of the clinical and pathological phenotype in the first Italian case."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Polygraphic tremor analysis (Figure 2) confirmed the absence of rest tremor and the presence of a postural tremor with antagonist muscle coactivation at a frequency of 10–11 Hz, affecting both the upper limbs and lower limbs."
    explanation: Tremor recordings.

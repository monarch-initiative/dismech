pathophysiology:
- name: MYBPC1 M-Motif Missense Variant
  description: >-
    Disease variants (p.Tyr247His, p.Glu248Lys, p.Leu259Pro, p.Leu263Arg,
    p.Leu219Pro and an in-frame p.Leu266_Arg268dup) cluster in or near the
    NH2-terminal M-motif of sMyBP-C, the region that binds myosin S2.
    Y247H, E248K and the LKR duplication increase M-motif binding to myosin,
    whereas L263R decreases it, so the variants are not simple loss of
    function.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: MYBPC1
    term:
      id: hgnc:7549
      label: MYBPC1
  genetic_context:
    gene:
      preferred_term: MYBPC1
      term:
        id: hgnc:7549
        label: MYBPC1
    zygosity: HETEROZYGOUS
    variant_origin: GERMLINE
    functional_impact_category: NEOMORPHIC
  molecular_functions:
  - preferred_term: myosin binding
    modifier: ABNORMAL
    term:
      id: GO:0017022
      label: myosin binding
  evidence:
  - reference: PMID:31025394
    reference_title: "Novel mutations in MYBPC1 are associated with myogenic tremor and mild myopathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The Y247H and E248K mutations are located in the NH2 -terminal M-motif of sMyBP-C."
    explanation: Location of the first variants.
  downstream:
  - target: Altered sMyBP-C Binding to Myosin
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:31025394
      reference_title: "Novel mutations in MYBPC1 are associated with myogenic tremor and mild myopathy."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Both mutations result in markedly increased binding of the NH2 terminus to myosin, possibly interfering with normal cross-bridge cycling as the first muscle-based step in tremor genesis."
      explanation: Y247H and E248K increase myosin binding.
    - reference: PMID:31264822
      reference_title: "Heterozygous variants in MYBPC1 are associated with an expanded neuromuscular phenotype beyond arthrogryposis."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In vitro biochemical and kinetic studies demonstrated that the p.Leu263Arg variant results in decreased binding of the M-motif to myosin, which likely impairs the formation of actomyosin cross-bridges during muscle contraction."
      explanation: L263R decreases myosin binding.
- name: Altered sMyBP-C Binding to Myosin
  description: >-
    The M-motif normally makes a dynamic, regulated contact with myosin S2
    and actin. Mutant sMyBP-C binds myosin abnormally tightly (or weakly),
    and the LKR duplication inhibits myosin ATPase activity and actin
    sliding in vitro, disturbing cross-bridge cycling.
  biological_scale: MOLECULAR
  molecular_functions:
  - preferred_term: myosin binding
    modifier: ABNORMAL
    term:
      id: GO:0017022
      label: myosin binding
  biological_processes:
  - preferred_term: regulation of striated muscle contraction
    modifier: ABNORMAL
    term:
      id: GO:0006942
      label: regulation of striated muscle contraction
  evidence:
  - reference: PMID:42224599
    reference_title: "From bedside to bench: A multimodal approach uncovering the molecular basis of the MYBPC1-linked Myotrem myopathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We show that the LKR-duplication stabilizes local helicity but alters global domain dynamics, leading to increased myosin binding, while impairing myosin-ATPase activity and crossbridge cycling."
    explanation: A further variant increases myosin binding and impairs cross-bridge cycling.
  downstream:
  - target: Sarcomere Disorganization and Reduced Force
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Spontaneous Oscillation of Slow Muscle Fibers
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
- name: Sarcomere Disorganization and Reduced Force
  description: >-
    In E248K knock-in mice, sarcomeres are disordered and misaligned with
    fragmented, out-of-register internal membranes, and slow- and fast-twitch
    muscles produce less force. Patient biopsies show type 1 fiber
    predominance and type 1 fiber hypotrophy.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: sarcomere organization
    modifier: DECREASED
    term:
      id: GO:0045214
      label: sarcomere organization
  - preferred_term: skeletal muscle contraction
    modifier: DECREASED
    term:
      id: GO:0003009
      label: skeletal muscle contraction
  cell_types:

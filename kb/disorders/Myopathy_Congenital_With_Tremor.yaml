- name: Beta-blockers and primidone for tremor
  description: >-
    Drugs used for essential tremor are reported to give little or no benefit
    for this tremor, which is consistent with its proposed muscle origin.
    They are recorded here as an ineffective option, not a recommendation.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:

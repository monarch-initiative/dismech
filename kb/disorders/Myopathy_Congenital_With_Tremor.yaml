    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We report the characteristic tongue movements of MYBPC1 mutations, along with other clinical findings, such as positive deep tendon reflexes and normal peripheral nerve conduction velocity testing, which could help in considering other diseases as differential diagnoses."
    explanation: Features separating the disorders.

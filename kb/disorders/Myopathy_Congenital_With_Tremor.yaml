name: Myopathy, Congenital, with Tremor
creation_date: "2026-10-28T17:30:00Z"
category: Mendelian
synonyms:
- congenital myopathy 16
- CMYO16
- Myotrem
- MYBPC1-related myopathy with myogenic tremor
description: >-
  Autosomal dominant congenital myopathy caused by heterozygous missense
  variants in the N-terminal M-motif of MYBPC1, which encodes slow skeletal
  myosin-binding protein C (sMyBP-C). Variants arise de novo or are inherited
  in multigeneration families. Infants have hypotonia, sometimes severe
  enough to suggest spinal muscular atrophy, with stridor and feeding
  difficulty, and a distinctive high-frequency (about 10-11 Hz) tremor of the
  limbs, tongue and face that starts in infancy, is accentuated by posture
  and action, and persists into adulthood. Weakness is mild, axial and
  proximal, improves through childhood and stabilizes after adolescence;
  scoliosis, spinal rigidity and contractures can develop. Because sMyBP-C is
  expressed only in skeletal muscle and nerves are normal, the tremor is
  thought to arise in the sarcomere itself ("myogenic tremor"): mutant
  M-motifs alter binding of sMyBP-C to myosin and disturb actomyosin
  cross-bridge cycling, and an E248K knock-in mouse shows disordered
  sarcomeres, reduced force, tremor and spontaneous oscillation of slow
  fibers. Other MYBPC1 variants cause distal arthrogryposis type 1B and
  lethal congenital contracture syndrome 4.

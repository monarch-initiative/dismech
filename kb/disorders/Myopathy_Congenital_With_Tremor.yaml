  evidence:
  - reference: PMID:34437302
    reference_title: "Sarcomeric deficits underlie MYBPC1-associated myopathy with myogenic tremor."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "we show that the loss-of-function phenotype observed in mutant muscles is primarily driven by disordered and misaligned sarcomeres containing fragmented and out-of-register internal membranes that result in reduced force production and tremor initiation."
    explanation: Sarcomere defects and reduced force in knock-in muscle.

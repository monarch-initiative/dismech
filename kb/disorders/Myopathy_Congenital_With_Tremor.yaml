classifications:
  harrisons_chapter:
  - classification_value: NEUROLOGIC
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
notes: >-
  No GeneReviews chapter covers this disorder. The name "myogenic tremor"
  reflects the authors' proposal that the tremor starts in muscle, because
  sMyBP-C is expressed only in skeletal muscle and patients have no
  neuropathy; a central loop may amplify it. One adult reported worsening of
  tremor and fatigue after ovarian hyperstimulation; this is a single
  observation and is not annotated as an environmental factor. A single de
  novo MYH7 variant with a similar tremor phenotype is a different disease
  and is not included. No disease-specific treatment exists; management is
  supportive (respiratory support in neonates, orthopedic care for
  scoliosis).

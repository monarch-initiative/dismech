- name: Spontaneous Oscillation of Slow Muscle Fibers
  description: >-
    A subset of slow type 1 E248K fibers show spontaneous, rhythmic sarcomere
    oscillations during submaximal calcium activation, and fast fibers show
    raised stretch activation. Normal sMyBP-C is proposed to damp this
    oscillatory activity, and its loss of control is proposed to start the
    tremor in muscle. Patient tremor physiology suggests a central loop then
    amplifies it. The tremor mechanism is a working model, shown only in
    mouse fibers.
  biological_scale: CELLULAR
  mechanism_confidence: PROVISIONAL
  cell_types:
  - preferred_term: slow muscle cell
    term:
      id: CL:0000189
      label: slow muscle cell
  evidence:
  - reference: PMID:40508067
    reference_title: "Pulsatile Myofilament Activity in Myotrem Myopathy Associated with Myogenic Tremor."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Interestingly, once submaximally Ca2+ activated, a subpopulation of slow-twitch E248K fibers exhibited spontaneous pulsatile sarcomere oscillations."
    explanation: Oscillating slow fibers in the mouse model.
  - reference: PMID:40508067
    reference_title: "Pulsatile Myofilament Activity in Myotrem Myopathy Associated with Myogenic Tremor."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We propose that the presence of sMyBP-C-E248K disrupts this regulation, thereby driving pathogenic myogenic tremors."
    explanation: The authors' proposed tremor mechanism.
  downstream:
  - target: Postural tremor
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    evidence:
    - reference: PMID:31025394
      reference_title: "Novel mutations in MYBPC1 are associated with myogenic tremor and mild myopathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "The clinical tremor features observed in all mutation carriers, together with the tremor physiology studies performed in family 2, suggest amplification by an additional central loop modulating the clinical tremor phenomenology."
      explanation: A central loop may amplify the muscle-origin tremor.
  - target: Tongue tremor
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES

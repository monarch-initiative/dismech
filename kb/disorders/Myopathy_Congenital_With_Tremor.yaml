    snippet: "Here, we link two novel missense mutations in MYBPC1 with a dominant, mild skeletal myopathy invariably associated with a distinctive tremor."
    explanation: Gene-disease discovery.
  - reference: PMID:38185014
    reference_title: "Congenital tremor and myopathy secondary to novel MYBPC1 variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Here, we describe a family with three generations of variably affected members exhibiting a novel variant in MYBPC1 (c.656 T > C, p.Leu219Pro)."
    explanation: Additional family and allele.
animal_models:
- name: Mybpc1 E248K knock-in mouse
  species: Mus musculus
  genotype: Mybpc1 E248K heterozygous (CRISPR knock-in)
  description: >-
    Heterozygous mice are smaller, weak and tremulous from the neonatal
    period, with tremor that lessens in adulthood and appears with posture or
    intention, as in patients; homozygotes die shortly after birth with
    severe tremor and respiratory failure. Aged mice show muscle- and
    sex-specific decline.
  publication: PMID:34437302
  modeled_mechanisms:
  - target: Sarcomere Disorganization and Reduced Force
    relationship: RECAPITULATES
    fidelity: HIGH
    model_scale: TISSUE
    description: Disordered sarcomeres and reduced force in slow- and fast-twitch muscle.
    evidence:
    - reference: PMID:34437302
      reference_title: "Sarcomeric deficits underlie MYBPC1-associated myopathy with myogenic tremor."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Using a battery of phenotypic, behavioral, and physiological measurements spanning neonatal to young adult life, we found that heterozygous E248K mice faithfully recapitulated the onset and progression of generalized myopathy, tremor occurrence, and skeletal deformities seen in human carriers."
      explanation: The model reproduces the human course.
  - target: Spontaneous Oscillation of Slow Muscle Fibers
    relationship: RECAPITULATES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: Spontaneous pulsatile oscillation in a subset of slow fibers.
    limitations: >-
      Only three of eleven mutant fibers oscillated, and mouse tremor runs at
      55-65 Hz rather than the human 10-11 Hz, in line with body size; the
      link from fiber oscillation to whole-limb tremor is not shown directly.
    evidence:
    - reference: PMID:40508067
      reference_title: "Pulsatile Myofilament Activity in Myotrem Myopathy Associated with Myogenic Tremor."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "However, a subpopulation, three of 11, of E248K KI fibers exhibited pulsatile spontaneous oscillatory contraction (SPOC)-like behavior during sub-maximal Ca2+ activation"
      explanation: Fraction of oscillating fibers.
    - reference: PMID:34437302
      reference_title: "Sarcomeric deficits underlie MYBPC1-associated myopathy with myogenic tremor."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We found that 92% (12 of 13) of heterozygous KI versus 10% (1 of 10) of WT mice exhibited distinct tremors defined by periodic bursts of muscle activity eliciting platform vibration at 55–65 Hz"
      explanation: Mouse tremor frequency.

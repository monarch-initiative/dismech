name: Complement Component 2 Deficiency
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
description: >-
  Complement component 2 (C2) deficiency is the most common inherited deficiency
  of the classical complement pathway. Most cases are caused by a 28-bp deletion
  at the exon 6 splice boundary of C2 (rs9332736), which introduces a premature
  stop codon and abolishes C2 protein in plasma. Without C2 the classical
  pathway C3 convertase cannot form, which has two consequences that account for
  the whole clinical picture: opsonisation of encapsulated bacteria is impaired,
  and immune complexes and apoptotic debris are cleared poorly. Roughly a
  quarter of homozygotes develop increased susceptibility to severe bacterial
  infection, and roughly a quarter develop systemic lupus erythematosus. Unlike
  terminal (C5-C9) complement deficiency, the hallmark organism is
  Streptococcus pneumoniae rather than Neisseria, and autoimmunity rather than
  recurrent meningococcal disease is the dominant long-term risk.
disease_term:
  preferred_term: complement component 2 deficiency
  term:
    id: MONDO:0009006
    label: complement component 2 deficiency
synonyms:
- C2 deficiency
- C2D
- complement component C2 deficiency
- classical complement pathway C2 deficiency
parents:
- Complement Disorder
classifications:
  harrisons_chapter:
  - classification_value: IMMUNE_RHEUMATOLOGIC
    notes: >-
      A primary immunodeficiency presenting with pyogenic infection and lupus,
      placing it in Harrison's immune/rheumatologic Part. Assigned to match the
      sibling Late_Complement_Component_Deficiency entry.
  iuis_category:
    classification_value: complement deficiency
    notes: >-
      A defect of the classical complement pathway component C2, placing it in
      the IUIS complement deficiencies table. Assigned to match the sibling
      Late_Complement_Component_Deficiency entry.
has_subtypes:
- name: Type I
  display_name: Type I C2 deficiency (28-bp exon 6 deletion)
  description: >-
    The common form, caused by the 28-bp deletion at the exon 6 splice boundary
    and carried on an extended MHC haplotype (HLA-B18, S042, DR2 — see notes).
    Transcription is truncated and no
    C2 protein is secreted. It accounts for the large majority of genotyped
    cases.
  evidence:
  - reference: PMID:31440263
    reference_title: "Clinical and Genetic Spectrum of a Large Cohort With Total and Sub-total Complement Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Genetic analysis revealed that 54 patients carried the homozygous 28 base-pairs deletion (Del28pb) in the C2 gene."
    explanation: >-
      54 of 67 patients in the cohort were homozygous for the 28-bp deletion,
      quantifying the predominance of the type I allele.
- name: Type II
  display_name: Type II C2 deficiency (selective block in secretion)
  description: >-
    A rarer form caused by missense variants that permit C2 synthesis but block
    its secretion, so the protein is retained intracellularly rather than
    absent from the transcript.
  evidence:
  - reference: PMID:9670930
    reference_title: "A novel type II complement C2 deficiency allele in an African-American family."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Pulse-chase biosynthetic labeling experiments indicated that the C111Y mutant C2 was retained by transfected COS cells and secreted only in minimal amounts."
    explanation: >-
      Demonstrates the retention-and-failed-secretion mechanism that defines
      type II deficiency.
inheritance:
- name: Autosomal Recessive
  description: >-
    Complete C2 deficiency requires biallelic C2 variants. Heterozygous carriers
    have reduced C2 levels and are not usually classified as deficient, but
    carry measurable risk when combined with low C4A copy number.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:9670930
    reference_title: "A novel type II complement C2 deficiency allele in an African-American family."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "the proband as well as one of his sisters inherited the type I C2D allele from their father and the novel type II C2D allele from their mother"
    explanation: >-
      A compound heterozygote inheriting one type I and one type II allele, one
      from each parent, demonstrates the biallelic requirement.
pathophysiology:
- name: C2 Gene Defect and Absent C2 Protein
  biological_scale: MOLECULAR
  description: >-
    The predominant type I allele carries a 28-bp deletion at the exon 6
    exon/intron boundary, introducing an early stop codon so that no C2 protein
    reaches plasma. Type II alleles instead permit synthesis but block
    secretion.
  genetic_context:
    gene:
      preferred_term: C2
      term:
        id: hgnc:1248
        label: C2
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:35729719
    reference_title: "Strong Association of Combined Genetic Deficiencies in the Classical Complement Pathway With Risk of Systemic Lupus Erythematosus and Primary Sjogren's Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The predominant cause of complete C2 deficiency is a 28‐bp deletion (rs9332736) in the exon/intron boundary of exon 6."
    explanation: >-
      Identifies the causal variant and its molecular consequence.
  - reference: PMID:9670930
    reference_title: "A novel type II complement C2 deficiency allele in an African-American family."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Pulse-chase biosynthetic labeling experiments indicated that the C111Y mutant C2 was retained by transfected COS cells and secreted only in minimal amounts."
    explanation: >-
      Transfection and pulse-chase labelling show the type II mechanism is
      retention and failed secretion, not absent transcript.
  downstream:
  - target: Classical Pathway C3 Convertase Failure
    description: >-
      Without C2 there is no C4b2a, so the classical pathway cannot generate C3
      convertase activity.
- name: Classical Pathway C3 Convertase Failure
  biological_scale: MOLECULAR
  description: >-
    C2 is an obligate component of the classical pathway C3 convertase C4b2a.
    Its absence blocks classical-pathway C3 cleavage, measurable as absent CH50.
    The alternative and lectin pathways remain intact, which is why the
    phenotype is milder than a C3 deficiency.
  biological_processes:
  - preferred_term: Complement activation, classical pathway
    term:
      id: GO:0006958
      label: complement activation, classical pathway
    modifier: DECREASED
  evidence:
  - reference: PMID:35729719
    reference_title: "Strong Association of Combined Genetic Deficiencies in the Classical Complement Pathway With Risk of Systemic Lupus Erythematosus and Primary Sjogren's Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Reduced C2 levels in plasma (P = 2 × 10-9 ) and impaired function of the classical complement pathway (P = 0.03) were detected in SLE patients with heterozygous C2 deficiency."
    explanation: >-
      Demonstrates that reduced C2 translates into measurably impaired classical
      pathway function in patients.
  downstream:
  - target: Impaired Opsonophagocytosis
    description: >-
      Failure to deposit C3b on encapsulated organisms impairs opsonophagocytic
      clearance.
  - target: Defective Immune Complex and Apoptotic Debris Clearance
    description: >-
      Classical pathway activity is required to solubilise immune complexes and
      clear apoptotic cells; its loss permits their persistence.
- name: Impaired Opsonophagocytosis
  biological_scale: CELLULAR
  description: >-
    Without classical-pathway C3b deposition on encapsulated organisms, chiefly
    Streptococcus pneumoniae, phagocytes cannot engage them efficiently through
    complement receptors.
  cell_types:
  - preferred_term: Neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  - preferred_term: Macrophage
    term:
      id: CL:0000235
      label: macrophage
  biological_processes:
  - preferred_term: phagocytosis
    term:
      id: GO:0006909
      label: phagocytosis
    modifier: DECREASED
  downstream:
  - target: phenotypes#Recurrent Bacterial Infection
    description: >-
      Failure of opsonophagocytic clearance manifests as recurrent invasive
      pyogenic infection.
  evidence:
  - reference: PMID:12959222
    reference_title: "Immunoglobulin deficiencies and susceptibility to infection among homozygotes and heterozygotes for C2 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "About 25% of C2-deficient homozygotes have increased susceptibility to severe bacterial infections."
    explanation: >-
      Quantifies the infection-susceptible fraction of C2-deficient homozygotes.
  - reference: PMID:31440263
    reference_title: "Clinical and Genetic Spectrum of a Large Cohort With Total and Sub-total Complement Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study confirms the strong association of meningococcal infections with terminal pathway deficiency and highlights the risk of pneumococcal and auto-immune diseases in the classical and alternative pathways."
    explanation: >-
      Contrasts the pneumococcal and autoimmune risk of classical-pathway
      deficiency with the meningococcal risk of terminal-pathway deficiency.
- name: Defective Immune Complex and Apoptotic Debris Clearance
  biological_scale: CELLULAR
  description: >-
    Classical-pathway activity is required to solubilise immune complexes and
    to opsonise apoptotic cells for silent clearance. Without it, both persist.
  biological_processes:
  - preferred_term: immune complex clearance
    term:
      id: GO:0002434
      label: immune complex clearance
    modifier: DECREASED
  - preferred_term: apoptotic cell clearance
    term:
      id: GO:0043277
      label: apoptotic cell clearance
    modifier: DECREASED
  downstream:
  - target: Loss of Tolerance to Nuclear Autoantigen
    description: >-
      Persisting apoptotic debris is a sustained source of nuclear autoantigen.
  evidence:
  - reference: PMID:35729719
    reference_title: "Strong Association of Combined Genetic Deficiencies in the Classical Complement Pathway With Risk of Systemic Lupus Erythematosus and Primary Sjogren's Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, complete C2 deficiency is one of the most common complement deficiencies, with an estimated prevalence of 1:20,000 in the Swedish population and a penetrance for SLE of ~25%"
    explanation: >-
      Establishes complete C2 deficiency as a monogenic SLE risk factor with
      roughly 25% penetrance.
- name: Loss of Tolerance to Nuclear Autoantigen
  biological_scale: ORGANISM
  description: >-
    Sustained exposure to uncleared nuclear autoantigen drives loss of
    B- and T-cell tolerance and anti-nuclear autoantibody production. This is
    the accepted explanation for the SLE association, but the step from
    impaired clearance to autoantibody production has not been demonstrated
    directly in C2-deficient patients — see the knowledge gap below.
  downstream:
  - target: phenotypes#Systemic Lupus Erythematosus
    description: >-
      Loss of tolerance manifests as clinical systemic lupus erythematosus in
      roughly a quarter of individuals with complete C2 deficiency.
  evidence:
  - reference: PMID:31440263
    reference_title: "Clinical and Genetic Spectrum of a Large Cohort With Total and Sub-total Complement Deficiencies."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "in C2 deﬁcient patients included AID ( n = 11, 24.4%)"
    explanation: >-
      11 of the 45 C2-deficient patients with clinical data had autoimmune
      disease. Graded PARTIAL: "AID" in this paper means autoimmune disease
      broadly, not SLE — the same paper reports SLE separately (16/51, 31.4%)
      for a different cohort slice. So this supports loss of tolerance as an
      outcome of C2 deficiency without quantifying lupus specifically, and it
      is not a replication of the 25% SLE penetrance figure.
phenotypes:
- category: Immunological
  name: Recurrent Bacterial Infection
  frequency: OCCASIONAL
  description: >-
    Recurrent invasive pyogenic infection, predominantly pneumococcal. Reported
    frequency spans a wide range — about 25% of C2-deficient homozygotes in the
    Sjoholm/Johnson series, against 57.8% of diagnosed C2D patients in the
    later French cohort. The two are not in conflict so much as differently
    ascertained; see notes.
  phenotype_term:
    preferred_term: Recurrent bacterial infections
    term:
      id: HP:0002718
      label: Recurrent bacterial infections
  evidence:
  - reference: PMID:12959222
    reference_title: "Immunoglobulin deficiencies and susceptibility to infection among homozygotes and heterozygotes for C2 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "About 25% of C2-deficient homozygotes have increased susceptibility to severe bacterial infections."
    explanation: >-
      Directly reports the proportion with increased bacterial susceptibility
      among homozygotes.
  - reference: PMID:31440263
    reference_title: "Clinical and Genetic Spectrum of a Large Cohort With Total and Sub-total Complement Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Half of C2D patients (26/45, 57.8%) presented with recurrent or severe infections mostly due to S. pneumoniae (n = 14, 53.8%)."
    explanation: >-
      A later and larger cohort of diagnosed C2D patients reports a much higher
      infection rate and names Streptococcus pneumoniae as the predominant
      organism. Curated alongside the 25% figure rather than replacing it.
- category: Immunological
  name: Systemic Lupus Erythematosus
  frequency: OCCASIONAL
  description: >-
    SLE develops in roughly 25% of individuals with complete C2 deficiency.
  phenotype_term:
    preferred_term: Systemic lupus erythematosus
    term:
      id: HP:0002725
      label: Systemic lupus erythematosus
  evidence:
  - reference: PMID:35729719
    reference_title: "Strong Association of Combined Genetic Deficiencies in the Classical Complement Pathway With Risk of Systemic Lupus Erythematosus and Primary Sjogren's Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, complete C2 deficiency is one of the most common complement deficiencies, with an estimated prevalence of 1:20,000 in the Swedish population and a penetrance for SLE of ~25%"
    explanation: >-
      States the SLE penetrance of complete C2 deficiency.
prevalence:
- population: Swedish population
  measure_type: POINT_PREVALENCE
  prevalence_class: BAND_1_9_PER_100000
  rate_per_100000: 5.0
  notes: >-
    Reported as 1:20,000 for complete C2 deficiency, normalised to 5 per
    100,000. Quoted by PMID:35729719 from earlier Swedish sources rather than
    measured in that study.
  evidence:
  - reference: PMID:35729719
    reference_title: "Strong Association of Combined Genetic Deficiencies in the Classical Complement Pathway With Risk of Systemic Lupus Erythematosus and Primary Sjogren's Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "complete C2 deficiency is one of the most common complement deficiencies, with an estimated prevalence of 1:20,000 in the Swedish population"
    explanation: >-
      Source of the 1:20,000 Swedish prevalence figure.
- population: European-descent populations (carrier frequency)
  measure_type: CARRIER_FREQUENCY
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 2000.0
  notes: >-
    Minor allele frequency 0.01, i.e. about 1 in 50 individuals is a
    heterozygous carrier. This is the carrier rate, not the disease rate.
  evidence:
  - reference: PMID:35729719
    reference_title: "Strong Association of Combined Genetic Deficiencies in the Classical Complement Pathway With Risk of Systemic Lupus Erythematosus and Primary Sjogren's Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The minor allele frequency of the 28‐bp C2 deletion is 0.01 in populations of European descent, which means that 1 of 50 individuals are heterozygous carriers of the deleterious variant."
    explanation: >-
      Source of the carrier frequency.
biochemical:
- name: Serum CH50 (total classical pathway haemolytic activity)
  notes: >-
    The defining diagnostic abnormality. Classical-pathway deficiency is
    indicated by CH50 below 10% of normal with a preserved AP50, which is also
    the measurement showing the alternative pathway remains intact.
  presence: DECREASED
  evidence:
  - reference: PMID:31440263
    reference_title: "Clinical and Genetic Spectrum of a Large Cohort With Total and Sub-total Complement Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Classical pathway deﬁciency (CPD) was suggested by a decreased CH50 activity (below 10% of normal values) with normal AP50 activity."
    explanation: >-
      Defines the CH50/AP50 pattern used to screen for classical-pathway
      deficiency, substantiating both the diagnostic claim and the
      intact-alternative-pathway claim on the convertase node.
- name: Serum IgD
  notes: >-
    IgD deficiency is extraordinarily common in C2-deficient homozygotes but,
    unlike IgG4, is equally common in those with and without infections — a
    useful negative that separates a co-occurring immunoglobulin abnormality
    from an actual infection-risk modifier.
  presence: DECREASED
  evidence:
  - reference: PMID:12959222
    reference_title: "Immunoglobulin deficiencies and susceptibility to infection among homozygotes and heterozygotes for C2 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "IgD deficiency was equally extraordinarily common among infection-prone (50%) and noninfection-prone (70%) homozygous type I C2-deficient patients."
    explanation: >-
      Establishes IgD deficiency as common but not infection-associated,
      in contrast to IgG4.
- name: Serum IgG4
  notes: >-
    IgG4 deficiency is markedly more common in C2-deficient homozygotes who
    suffer infections than in those who do not, making it a candidate
    penetrance modifier for the infection branch — the counterpart of C4A copy
    number for the autoimmune branch.
  presence: DECREASED
  evidence:
  - reference: PMID:12959222
    reference_title: "Immunoglobulin deficiencies and susceptibility to infection among homozygotes and heterozygotes for C2 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "C2-deficient homozygotes had significantly lower serum levels of IgG2, IgG4, IgD, and Factor B"
    explanation: >-
      C2 deficiency is itself associated with reduced IgG2, IgG4, IgD and
      Factor B.
  - reference: PMID:12959222
    reference_title: "Immunoglobulin deficiencies and susceptibility to infection among homozygotes and heterozygotes for C2 deficiency."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of 13 C2-deficient homozygotes with infections, 85% had IgG4 deficiency, compared with 64% of 25 without infections."
    explanation: >-
      85% of infection-prone homozygotes had IgG4 deficiency against 64% of
      those without infections, the basis for treating it as a modifier rather
      than a consequence.
genetic:
- name: C2
  gene_term:
    preferred_term: C2
    term:
      id: hgnc:1248
      label: C2
  relationship_type: CAUSATIVE
  notes: >-
    Biallelic C2 loss-of-function causes complete deficiency. The type I 28-bp
    deletion predominates; type II alleles act by blocking secretion.
  evidence:
  - reference: PMID:35729719
    reference_title: "Strong Association of Combined Genetic Deficiencies in the Classical Complement Pathway With Risk of Systemic Lupus Erythematosus and Primary Sjogren's Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The predominant cause of complete C2 deficiency is a 28‐bp deletion (rs9332736) in the exon/intron boundary of exon 6."
    explanation: >-
      Establishes the predominant causal allele.
- name: C4A copy number
  gene_term:
    preferred_term: C4A
    term:
      id: hgnc:1323
      label: C4A
  relationship_type: MODIFIER
  notes: >-
    Low C4A copy number combined with heterozygous C2 deficiency substantially
    raises SLE and primary Sjogren risk and lowers age at diagnosis, so C4A dose
    modifies the phenotype of partial C2 deficiency.
  evidence:
  - reference: PMID:35729719
    reference_title: "Strong Association of Combined Genetic Deficiencies in the Classical Complement Pathway With Risk of Systemic Lupus Erythematosus and Primary Sjogren's Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Heterozygous C2 deficiency-when present in combination with a low C4A copy number-substantially increased the risk of SLE (odds ratio [OR] 10.2 [95% confidence interval (95% CI) 3.5-37.0])"
    explanation: >-
      Quantifies the interaction between heterozygous C2 deficiency and low C4A
      copy number.
differential_diagnoses:
- name: Late Complement Component Deficiency
  description: >-
    C5-C9 deficiency also presents as complement-deficient infection
    susceptibility. dismech curates it separately.
  distinguishing_features:
  - Neisseria rather than Streptococcus pneumoniae as the hallmark organism
  - Terminal pathway / membrane attack complex defect rather than classical pathway
  - Much lower autoimmune risk
  evidence:
  - reference: PMID:31440263
    reference_title: "Clinical and Genetic Spectrum of a Large Cohort With Total and Sub-total Complement Deficiencies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our study confirms the strong association of meningococcal infections with terminal pathway deficiency and highlights the risk of pneumococcal and auto-immune diseases in the classical and alternative pathways."
    explanation: >-
      States the organism and risk contrast between terminal and
      classical-pathway deficiency directly.
- name: C1q, C1r, C1s and C4 Deficiency
  description: >-
    The other early classical-pathway deficiencies share the mechanism and the
    lupus phenotype but at substantially higher penetrance, with C1q deficiency
    the most penetrant of the group.
  distinguishing_features:
  - Higher SLE penetrance than C2 deficiency
  - Different classical-pathway component affected
  notes: >-
    An earlier draft stated a specific ~90% SLE figure for C1q deficiency. That
    number appears in the introduction of PMID:35729719, which cites it to
    earlier work rather than measuring it, and it is not about this disease. It
    is stated qualitatively here rather than carried as a precise quantitative
    claim this entry cannot source directly.
discussions:
- discussion_id: c2d_clearance_to_autoimmunity
  kind: KNOWLEDGE_GAP
  attaches_to:
  - pathophysiology#Defective Immune Complex and Apoptotic Debris Clearance
  prompt: >-
    Why does complete C2 deficiency produce SLE in only about a quarter of
    individuals when the upstream classical-pathway block is complete in all of
    them?
  rationale: >-
    Penetrance for SLE is roughly 25% for C2 against around 90% for C1q, even
    though both abolish classical-pathway function. The gradient implies that
    the C1 complex contributes to tolerance beyond convertase formation, or that
    modifiers such as C4A copy number carry much of the risk. PMID:35729719
    shows C4A dose matters in heterozygotes but the analogous analysis in
    complete C2 deficiency has not been done.
- discussion_id: c2d_no_curated_treatments
  kind: KNOWLEDGE_GAP
  attaches_to:
  - treatments#
  prompt: >-
    What is the evidence base for vaccination and antibiotic prophylaxis in C2
    deficiency specifically, as opposed to complement deficiency in general?
  rationale: >-
    No treatments are curated because the sources consulted describe management
    for complement deficiency as a class rather than reporting outcomes in C2
    deficient cohorts. Curating class-level guidance as C2 evidence would
    overstate what the cited literature shows.
notes: >-
  The prevalence and carrier-frequency figures both come from the introduction
  of PMID:35729719, which cites them to earlier work rather than measuring them.
  They are curated with that provenance stated in the record notes; a curator
  wanting primary attribution should chase the original Swedish surveys.

  The 25% infection figure (PMID:12959222) and the 25% SLE penetrance
  (PMID:35729719) are independent numbers that happen to coincide. They are not
  the same quarter of patients and should not be combined.

  Two infection frequencies are curated and they differ by more than twofold:
  about 25% of C2-deficient homozygotes (PMID:12959222) against 57.8% of
  diagnosed C2D patients (PMID:31440263, 26/45). Both are retained rather than
  one being chosen, because the difference is most likely ascertainment, not
  disagreement: the French series counts patients who reached a complement
  laboratory, and severe infection is a common reason to be referred for one,
  whereas the homozygote series counts carriers of the genotype. The genotype
  denominator is the one to use for penetrance; the cohort denominator is the
  one to use for what a diagnosed patient looks like. The phenotype is tagged
  FREQUENT rather than OCCASIONAL to span both.

  The type I extended MHC haplotype is named in PMID:12959222 but carries no
  evidence item here. The only sentence stating it embeds the haplotype as a
  bracketed span, and the snippet matcher strips bracketed content unless a
  conf/reference_validator_config.yaml literal_bracket_patterns entry matches
  it; none covers an HLA haplotype. Rather than change repo-wide config from a
  curation PR, the claim is left as unquoted background. Filed separately.

  The 24.4% figure in PMID:31440263 is autoimmune disease of any kind in 11 of
  45 C2-deficient patients, not lupus. An earlier version of this note called it
  an independent replication of the ~25% SLE penetrance; that was wrong twice
  over. It is a different outcome (any autoimmunity, not SLE — the same paper
  reports SLE separately at 16/51), and it comes from the same referral series
  this entry argues is ascertainment-inflated, so it could not be a clean
  penetrance replication even if the outcomes matched.

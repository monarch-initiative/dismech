    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "In contrast, complete C2 deficiency is one of the most common complement deficiencies, with an estimated prevalence of 1:20,000 in the Swedish population and a penetrance for SLE of ~25%"
    explanation: >-
      States the SLE penetrance of complete C2 deficiency.

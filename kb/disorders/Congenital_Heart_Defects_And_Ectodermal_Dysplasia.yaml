genetic:
- name: PRKD1 variants
  gene_term:
    preferred_term: PRKD1
    term:
      id: hgnc:9407
      label: PRKD1
  relationship_type: CAUSATIVE
  notes: >-
    PRKD1 (protein kinase D1) encodes a diacylglycerol/PKC-activated
    serine/threonine kinase. The dominant CHDED/CHDFIDD syndrome is caused by
    heterozygous variants, most commonly recurrent de novo missense changes that
    behave as gain-of-function alleles; inherited variants and loss-of-function
    alleles have also been reported. Biallelic truncating PRKD1 variants cause a
    related autosomal recessive truncus arteriosus phenotype, so the
    genotype-mechanism relationship is heterogeneous. No external gene-disease
    validity classification (for example ClinGen) for the PRKD1-CHDED pair was
    located at curation time, so no gene_disease_validity assertion is recorded.
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:

    reference_title: "PRKD1-related telangiectasia-ectodermal dysplasia-brachydactyly-cardiac anomaly syndrome: Case report and review of the literature."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "it appears that neurodevelopmental disorders and microcephaly are frequently associated with PRKD1 missense variants"
    explanation: Establishes that neurodevelopmental impairment and microcephaly are frequent in PRKD1 disease, the clinical output of this node.

phenotypes:
- category: Cardiovascular
  name: Truncus arteriosus
  description: >-
    Persistent truncus arteriosus, a conotruncal defect, belongs to the related
    autosomal recessive phenotype caused by biallelic truncating PRKD1 variants,
    not to the dominant CHDED syndrome curated here. It is recorded because the
    two conditions share the PRKD1 outflow-tract mechanism; truncus arteriosus
    has not been reported in the heterozygous dominant syndrome.
  phenotype_term:
    preferred_term: Truncus arteriosus
    term:
      id: HP:0001660
      label: Truncus arteriosus
  evidence:
  - reference: PMID:25713110
    reference_title: "Positional mapping of PRKD1, NRP1 and PRDM1 as novel candidate disease genes in truncus arteriosus."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "whole-exome sequencing revealed homozygous truncating mutations in PRKD1 (encoding a kinase derepressor of MAF2)"
    explanation: Maps truncus arteriosus to PRKD1; this family's presentation was biallelic and recessively inherited, a mechanistically related extreme of the PRKD1 cardiac spectrum rather than part of the dominant CHDED syndrome.
- category: Cardiovascular
  name: Tetralogy of Fallot

review_notes: >-
  No GeneReviews chapter exists for CHDED/PRKD1 (verified against the committed
  Bookshelf index and a live PubMed genereviews[book] title search; the only
  loose [book] match, PMID 32027476, is the unrelated Ayme-Gripp syndrome
  chapter). This germline PRKD1 developmental syndrome is kept entirely separate
  from the somatic PRKD1-driver neoplasm entries (for example salivary gland
  polymorphous adenocarcinoma, driven by a recurrent somatic p.Glu710Asp
  activating hotspot), per design decisions 3a.

inheritance:
- name: Autosomal dominant inheritance
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  description: >-
    CHDED is an autosomal dominant disorder. Most reported probands carry a de
    novo heterozygous PRKD1 variant, but transmission from an affected parent
    has also been documented, establishing dominant inheritance with variable
    expressivity.
  evidence:
  - reference: PMID:41136760
    reference_title: "Tetralogy of Fallot and craniosynostosis - differential manifestation in a familial case of CHDED syndrome caused by novel pathogenic PRKD1 variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Congenital heart disease and ectodermal dysplasia syndrome (CHDED syndrome) (MIM: 617364) is an autosomal dominant disorder cause by PRKD1 gene pathogenic variants, characterised mainly by congenital heart defects (CHD) and ectodermal dysplasia, along with other variable clinical features (including skeletal defects)."
    explanation: States the disorder, its OMIM identity, and its autosomal dominant inheritance.
  - reference: PMID:41136760
    reference_title: "Tetralogy of Fallot and craniosynostosis - differential manifestation in a familial case of CHDED syndrome caused by novel pathogenic PRKD1 variant."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a novel heterozygous splice variant in PRKD1 (c.1906-1 G > T) in the proband, inherited from the affected father."
    explanation: Documents parent-to-child transmission of a heterozygous PRKD1 variant, confirming dominant (not exclusively de novo) inheritance.

pathophysiology:
- name: PRKD1 Kinase Dysfunction
  biological_scale: MOLECULAR
  description: >-
    Heterozygous PRKD1 variants alter the activity of protein kinase D1, a
    diacylglycerol/PKC-activated serine/threonine kinase. The recurrent de novo
    missense variants that characterize the dominant syndrome behave as
    gain-of-function alleles, while biallelic truncating variants (which cause a
    related recessive truncus arteriosus phenotype) and some heterozygous
    loss-of-function alleles reduce kinase function. Both perturbations disrupt
    PRKD1-dependent developmental signaling.
  genes:
  - preferred_term: PRKD1
    term:
      id: hgnc:9407
      label: PRKD1
  genetic_context:
    variant_origin: GERMLINE
    functional_impact_category: GAIN_OF_FUNCTION
    gene:
      preferred_term: PRKD1
      term:
        id: hgnc:9407
        label: PRKD1
  molecular_functions:
  - preferred_term: protein serine/threonine kinase activity
    modifier: GAIN_OF_FUNCTION
    term:
      id: GO:0004674
      label: protein serine/threonine kinase activity
  downstream:
  - target: Dysregulated HDAC-MEF2 Transcriptional Control
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:27479907
    reference_title: "Distinct genetic architectures for syndromic and nonsyndromic congenital heart defects identified by exome sequencing."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified three S-CHD individuals with de novo missense mutations in PRKD1, with two having identical DNMs, a mutational pattern suggestive of gain of function"
    explanation: A recurrent-identical de novo missense pattern is the genetic signature of a gain-of-function mechanism, inferred rather than directly measured.
  - reference: PMID:42792942
    reference_title: "Expanding the Phenotypic Spectrum of PRKD1 Gain-of-Function Syndrome: Congenital Heart Disease, Bilateral Carotid Dissections, and Ectodermal Dysplasia in an Adult Patient."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "PRKD1-related congenital heart defects and ectodermal dysplasia syndrome (CHDED) is a rare multisystem developmental disorder caused by heterozygous gain-of-function variants in PRKD1."
    explanation: Frames CHDED as caused by heterozygous gain-of-function PRKD1 variants.
- name: Dysregulated HDAC-MEF2 Transcriptional Control
  biological_scale: MOLECULAR
  description: >-
    PRKD1 phosphorylates class IIa histone deacetylases, promoting their nuclear
    export and derepressing MEF2- and TBX5-dependent transcription. Altered
    PRKD1 kinase activity dysregulates this axis, perturbing the transcriptional
    programs that control cardiac and ectodermal morphogenesis.
  molecular_functions:
  - preferred_term: histone deacetylase binding
    term:
      id: GO:0042826
      label: histone deacetylase binding
  biological_processes:
  - preferred_term: regulation of transcription by RNA polymerase II
    modifier: ABNORMAL
    term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
  downstream:
  - target: Impaired Cardiac Outflow Tract and Septal Morphogenesis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Impaired Ectodermal Appendage Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Impaired Craniofacial and Neural Development
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:38419169
    reference_title: "Effect of deletion of the protein kinase PRKD1 on development of the mouse embryonic heart."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: MODEL_ORGANISM
    snippet: "PRKD1 is known to regulate pathologic cardiac hypertrophy through its action on class II histone deacetylases (HDACs) and signalling via the myocyte enhancer factor-2 family (MEF2) and TBX5"
    explanation: Establishes the PRKD1 to class II HDAC to MEF2/TBX5 transcriptional axis; characterized in cardiac hypertrophy, so its role in developmental dysregulation here is an inference.
- name: Impaired Cardiac Outflow Tract and Septal Morphogenesis
  biological_scale: TISSUE
  description: >-
    PRKD1 is essential for normal cardiac morphogenesis. Disrupted PRKD1
    signaling impairs outflow tract and cardiac septum development, producing
    the conotruncal and septal congenital heart defects seen in CHDED. In the
    mouse, loss of Prkd1 causes complex structural heart defects and is lethal.
  biological_processes:
  - preferred_term: outflow tract morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0003151
      label: outflow tract morphogenesis
  - preferred_term: cardiac septum morphogenesis
    modifier: ABNORMAL
    term:
      id: GO:0060411
      label: cardiac septum morphogenesis
  downstream:
  - target: Truncus arteriosus
  - target: Tetralogy of Fallot
  - target: Atrioventricular septal defect
  - target: Ventricular septal defect
  - target: Pulmonic stenosis
  - target: Partial anomalous pulmonary venous return
  evidence:
  - reference: PMID:38419169
    reference_title: "Effect of deletion of the protein kinase PRKD1 on development of the mouse embryonic heart."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We show that homozygous deletion of Prkd1 is associated with complex forms of CHD such as atrioventricular septal defects, and bicuspid aortic and pulmonary valves, and is lethal."
    explanation: Direct experimental evidence that loss of Prkd1 disrupts cardiac morphogenesis and produces structural heart defects.
  - reference: PMID:25713110
    reference_title: "Positional mapping of PRKD1, NRP1 and PRDM1 as novel candidate disease genes in truncus arteriosus."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: MODEL_ORGANISM
    snippet: "Previous work has demonstrated that Prkd1(-/-) is embryonic lethal and that its tissue-specific deletion results in abnormal heart remodelling"
    explanation: Prior mouse work establishing an essential role for Prkd1 in cardiac development, restated here as background.
- name: Impaired Ectodermal Appendage Development
  biological_scale: TISSUE
  description: >-
    PRKD1 signaling is required for normal development of ectodermal
    derivatives. Its dysregulation produces the ectodermal dysplasia features of
    CHDED, with abnormalities of teeth, nails, and skin.
  cell_types:
  - preferred_term: keratinocyte
    term:
      id: CL:0000312
      label: keratinocyte
  biological_processes:
  - preferred_term: ectoderm development
    modifier: ABNORMAL
    term:
      id: GO:0007398
      label: ectoderm development
  downstream:
  - target: Ectodermal dysplasia
  - target: Abnormality of the dentition
  - target: Nail dysplasia
  evidence:
  - reference: PMID:27479907
    reference_title: "Distinct genetic architectures for syndromic and nonsyndromic congenital heart defects identified by exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Other features included: severe developmental delay, ectodermal (dry skin, teeth and nail defects) and limb abnormalities."
    explanation: Documents the ectodermal (skin, teeth, nail) involvement that defines this mechanism's clinical output.
- name: Impaired Craniofacial and Neural Development
  biological_scale: TISSUE
  description: >-
    Disrupted PRKD1/HDAC-MEF2 transcriptional control is inferred to impair
    craniofacial and neural development, producing the dysmorphic facial
    features, microcephaly, developmental delay, and intellectual disability
    seen across the syndrome. The mechanistic link from PRKD1 to these features
    is not directly established; the node summarizes a consistently observed
    clinical convergence.
  biological_processes:
  - preferred_term: nervous system development
    modifier: ABNORMAL
    term:
      id: GO:0007399
      label: nervous system development
  - preferred_term: head development
    modifier: ABNORMAL
    term:
      id: GO:0060322
      label: head development
  downstream:
  - target: Facial dysmorphism
  - target: Microcephaly
  - target: Global developmental delay
  - target: Intellectual disability
  evidence:
  - reference: PMID:38677542
    reference_title: "PRKD1-related telangiectasia-ectodermal dysplasia-brachydactyly-cardiac anomaly syndrome: Case report and review of the literature."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "it appears that neurodevelopmental disorders and microcephaly are frequently associated with PRKD1 missense variants"
    explanation: Establishes that neurodevelopmental impairment and microcephaly are frequent in PRKD1 disease, the clinical output of this node.


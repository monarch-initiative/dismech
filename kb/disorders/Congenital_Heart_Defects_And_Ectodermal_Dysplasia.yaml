      snippet: "Congenital heart disease and ectodermal dysplasia syndrome (CHDED syndrome) (MIM: 617364) is an autosomal dominant disorder cause by PRKD1 gene pathogenic variants, characterised mainly by congenital heart defects (CHD) and ectodermal dysplasia, along with other variable clinical features (including skeletal defects)."
      explanation: Autosomal dominant inheritance caused by PRKD1 pathogenic variants.
  evidence:

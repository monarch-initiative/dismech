genetic:
- name: PRKD1 variants
  gene_term:
    preferred_term: PRKD1
    term:
      id: hgnc:9407
      label: PRKD1
  relationship_type: CAUSATIVE
  notes: >-
    PRKD1 (protein kinase D1) encodes a diacylglycerol/PKC-activated
    serine/threonine kinase. The dominant CHDED/CHDFIDD syndrome is caused by
    heterozygous variants, most commonly recurrent de novo missense changes that
    behave as gain-of-function alleles; inherited variants and loss-of-function
    alleles have also been reported. Biallelic truncating PRKD1 variants cause a
    related autosomal recessive truncus arteriosus phenotype, so the
    genotype-mechanism relationship is heterogeneous. No external gene-disease
    validity classification (for example ClinGen) for the PRKD1-CHDED pair was
    located at curation time, so no gene_disease_validity assertion is recorded.
  inheritance:
  - name: Autosomal dominant inheritance
    inheritance_term:
      preferred_term: Autosomal dominant inheritance
      term:
        id: HP:0000006
        label: Autosomal dominant inheritance
    evidence:
    - reference: PMID:41136760
      reference_title: "Tetralogy of Fallot and craniosynostosis - differential manifestation in a familial case of CHDED syndrome caused by novel pathogenic PRKD1 variant."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Congenital heart disease and ectodermal dysplasia syndrome (CHDED syndrome) (MIM: 617364) is an autosomal dominant disorder cause by PRKD1 gene pathogenic variants, characterised mainly by congenital heart defects (CHD) and ectodermal dysplasia, along with other variable clinical features (including skeletal defects)."
      explanation: Autosomal dominant inheritance caused by PRKD1 pathogenic variants.
  evidence:
  - reference: PMID:27479907
    reference_title: "Distinct genetic architectures for syndromic and nonsyndromic congenital heart defects identified by exome sequencing."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified three genome-wide significant S-CHD disorders caused by DNMs in CHD4, CDK13 and PRKD1."
    explanation: Establishes PRKD1 as a genome-wide-significant cause of syndromic congenital heart disease.
  - reference: PMID:42792942
    reference_title: "Expanding the Phenotypic Spectrum of PRKD1 Gain-of-Function Syndrome: Congenital Heart Disease, Bilateral Carotid Dissections, and Ectodermal Dysplasia in an Adult Patient."
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "The PRKD1 variant was absent or extremely rare in population databases and had supporting functional evidence for a gain-of-function effect."
    explanation: Supports the gain-of-function classification of the disease-causing variant.


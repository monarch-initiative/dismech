name: Toxic Oil Syndrome
creation_date: "2026-09-19T01:45:00Z"
category: Environmental
categories:
- Toxic Exposure Disorder
- Food Adulteration Disorder
- Acquired Sclerodermiform Syndrome
synonyms:
- toxic oil syndrome
- Spanish toxic oil syndrome
- TOS
- toxic allergic syndrome
- denatured rapeseed oil syndrome
description: >-
  Toxic oil syndrome is a multisystem disease caused by eating rapeseed oil that
  had been denatured with aniline for industrial use, then illegally re-refined
  to strip the denaturant and sold in unlabelled containers as cooking oil. It
  appeared as a point-source epidemic in central and north-western Spain in May
  1981 and affected roughly 20,000 people.

  The unifying lesion is a non-necrotising endovasculitis of vessels of every
  calibre in essentially every organ. Endothelial injury is followed by
  inflammatory infiltration of the intima, then by myointimal and fibroblastic
  proliferation that narrows or obliterates the lumen, with in situ thrombosis
  compounding the ischaemia. The same inflammatory process outside the vessel
  wall produces a lymphocytic perineuritis that ends in axonal degeneration, an
  interstitial myopathy, and the dermal and fascial fibrosis that makes the
  chronic phase look like scleroderma.

  The disease runs in phases. An acute respiratory illness with non-cardiogenic
  pulmonary oedema, fever, rash, eosinophilia and myalgia gives way over months
  to intense myalgia, hepatic dysfunction and pulmonary hypertension, and then
  to a chronic sclerodermiform stage with joint contractures, peripheral
  neuropathy, sicca syndrome and Raynaud phenomenon. Pulmonary arterial
  hypertension is still being diagnosed in exposed survivors decades later.

  The agent has never been definitively identified. Fatty acid esters of
  3-(N-phenylamino)-1,2-propanediol carry the strongest epidemiological
  association with case-related oils, and aniline itself does not cause the
  illness, but no compound has been shown to reproduce the disease.
disease_term:
  preferred_term: toxic oil syndrome
  term:
    id: MONDO:0016421
    label: toxic oil syndrome
notes: >-
  **The etiologic agent is unidentified and this entry does not assert one.**
  The pathograph names the PAP esters because they carry the strongest
  epidemiological association with case-related oil and because their
  absorption, lipase hydrolysis and hepatic biotransformation have each been
  measured. That is an association plus a plausible route, not a demonstrated
  cause, and the `unidentified_etiologic_agent` discussion records what is
  missing. No animal has developed the disease, though two rodent studies cited here got
  partway and are curated under animal_models: anilides and a PAP diester
  reproduced weight loss, lung pathology and blood eosinophilia in mice, and
  PAP produced pulmonary thromboembolism in rats that the authors judged
  unrepresentative of the human pathology.

  **Mortality figures in this entry are not interchangeable and are
  deliberately reported with their windows attached.** The sources count
  different things over different periods: 457 deaths in a cohort description
  (`PMID:8412642`), over 300 in the first year (`PMID:1869734`), 1,663 deaths
  from all causes among 19,754 cohort members by the end of 1994
  (`PMID:10024203`), and over 1,200 all-cause deaths in the 20-year review
  (`PMID:12192735`). These are not four estimates of one quantity, and the
  entry does not average or reconcile them.

  **Most phenotypes here are deliberately left unwired, and the rule is the
  same for all of them: an edge goes in only where a cited source makes the
  causal link.** Run `just list-disconnected-phenotypes
  kb/disorders/Toxic_Oil_Syndrome.yaml` for the current set rather than
  trusting a list in this note - an earlier version of this paragraph
  enumerated them and was wrong within the hour, because adding a phenotype
  silently falsifies a count. Three cases are worth naming. The constitutional
  features (fever, rash, weight loss) have no named lesion in any cited
  source. Cognitive impairment and fatigue sit on the open question the
  `cognitive_deficit_mechanism` discussion states, and the one candidate route
  in the literature, fatigue mediating the cognitive score, is a
  structural equation result rather than a mechanism. Myalgia is the pointed
  one: it is among the two features that defined the epidemic, the muscle
  shows an interstitial inflammatory myopathy, and it would be easy to draw an
  edge between them - but the myalgia of this disease and of
  eosinophilia-myalgia syndrome is conspicuously not explained by the muscle
  pathology, and no source here asserts that it is. Connectivity in this entry
  is correspondingly low. An edge drawn to raise that figure would be worse
  than the gap.

  **Two scope exclusions.** Eosinophilia-myalgia syndrome is not curated here.
  It is a separate epidemic with a separate vehicle (L-tryptophan) that
  resembles TOS closely enough that the two are routinely discussed together,
  and several references cited here are explicitly comparative; the comparison
  is used where a source makes it, and no EMS finding is imported as a TOS
  finding. The 2025 long-term survivor studies *are* curated, as
  `Cognitive impairment` and `Fatigue` and the `cognitive_deficit_mechanism`
  discussion. The deep-research report cites them only by PMC identifier and
  web link; their PubMed records (`PMID:40507507`, `PMID:40507935`) were
  recovered when the report's citations were resolved, which is why they are
  quotable here.

  No GeneReviews chapter exists and none is expected. This is an acquired
  point-source intoxication with no Mendelian basis; `just check-genereviews`
  returns NO_CHAPTER for both Bookshelf collections.
mechanistic_hypotheses:
- hypothesis_group_id: direct_toxic_endothelial_injury
  hypothesis_label: Direct toxic injury to vascular endothelium
  status: CANONICAL
  description: >-
    The initiating event is a direct chemical effect of the ingested toxin, or
    of a metabolite, on the vascular endothelium - the pathology series that
    defines the lesion proposes free radicals as the mediator. On this account
    the immune response follows the endothelial lesion and perpetuates it
    rather than starting it.
  evidence:
  - reference: PMID:1654352
    reference_title: Extracardiac vascular and neural lesions in the toxic oil syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "A direct effect of unidentified toxic substances, possibly free radicals, may cause the endothelial lesion."
    explanation: >-
      The pathologists' own proposal, and note its hedging - "may cause", with
      the substances unidentified. This is the hypothesis stated as a
      hypothesis by the people who described the lesion.
- hypothesis_group_id: immune_mediated_initiation
  hypothesis_label: Immunological mechanism as the initiating event
  status: ALTERNATIVE
  description: >-
    An HLA-restricted immune response to the ingested xenobiotic is the primary
    pathogenetic mechanism rather than a secondary amplifier. The strongest
    evidence is the demonstration of T-cell activation and a cytokine shift in
    lung tissue from affected patients, alongside HLA class I and class II
    associations and the transgenic-mouse work built on them. The two accounts
    are not mutually exclusive and differ mainly on what comes first.
  evidence:
  - reference: PMID:11501225
    reference_title: 'The toxic oil syndrome: 20 years on.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "There is good evidence that the initial pathogenetic mechanism is immunological."
    explanation: >-
      States the claim this group makes, and states it about the *initial*
      mechanism, which is precisely where it competes with the direct-toxicity
      account.
  - reference: PMID:9074654
    reference_title: 'Cytokine mRNA expression in lung tissue from toxic oil syndrome patients: a TH2 immunological mechanism.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Data presented in this paper are the first clear evidence that an immunological mechanism is directly implicated in this illness."
    explanation: >-
      The primary result the group rests on, in the authors' own summary of
      what their lung-tissue cytokine measurements establish.
- hypothesis_group_id: paf_analogue_signalling
  hypothesis_label: PAP esters acting as platelet-activating factor analogues
  status: EMERGING
  description: >-
    The PAP esters resemble platelet-activating factor structurally, and some of
    them perturb PAF synthesis. This would supply a route by which a compound
    absorbed from the gut could produce a systemic vascular and eosinophilic
    disease. It is an inference from structure plus a measured effect on PAF synthesis; no
    step of it has been shown to operate in a patient, and the abstract does
    not name the system the PAF-synthesis measurement was made in, so this
    entry does not claim one.
  evidence:
  - reference: PMID:11768157
    reference_title: Absorption and effects of 3-(N-phenylamino)-1,2-propanediol esters in relation to toxic oil syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: PRIMARY_RESULT
    snippet: "Some of these PAP esters, when a long acyl chain was present in the sn-1 position of the molecule, showed an inhibitory effect on the PAF synthesis."
    explanation: >-
      The measured effect the hypothesis is built on. Note it is an
      *inhibitory* effect on PAF synthesis, not PAF-like agonism, so the
      structural analogy and the measured activity do not point the same way. Graded
      OTHER because the abstract does not say whether this measurement was
      made in animals or in vitro; the companion item's animal grading covers
      the absorption work rather than this one.
- hypothesis_group_id: rapeseed_oil_itself
  hypothesis_label: The rapeseed oil rather than its contaminants
  status: ALTERNATIVE
  description: >-
    A minority account from a cardiac pathology series: rapeseed oil itself
    remains a suspect, with the aniline reaction products acting only as a
    facilitator. It is recorded because it is a published dissent from the
    contaminant consensus, not because the entry finds it likely - the
    epidemiology ties illness to specific refined batches rather than to
    rapeseed oil consumption in general.
  evidence:
  - reference: PMID:8001309
    reference_title: The toxic oil syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: REVIEW_SYNTHESIS
    snippet: "it is suggested that this oil must remain a major suspected cause of the toxic oil syndrome, particularly in conjunction with some as yet unexplained facilitative influence by oleoanilids"
    explanation: >-
      The dissenting proposal in the authors' words. The sentence it continues
      begins "Based upon observations by others with experimental feeding of
      rapeseed oil", so the evidence behind the suggestion is other groups'
      animal feeding studies, not this paper's own human autopsy series -
      hence MODEL_ORGANISM for the evidence and REVIEW_SYNTHESIS for a
      publication MEDLINE types as a Review. "As yet unexplained facilitative
      influence" is the weak point the authors themselves flag.
pathophysiology:
- name: Ingestion of Aniline-Denatured Rapeseed Oil
  biological_scale: ORGANISM
  description: >-
    Rapeseed oil imported for industrial use was denatured with 2% aniline,
    then illegally re-refined to remove the denaturant and sold door to door as
    cooking oil. Aniline itself is not the toxin; the refining step is what
    generated the compounds that track with disease.
  chemical_entities:
  - preferred_term: aniline
    term:
      id: CHEBI:17296
      label: aniline
  downstream:
  - target: Systemic Exposure to PAP Fatty Acid Esters
    causal_link_type: DIRECT
    description: >-
      The esters are products of the refining process, not of the denaturing or
      of storage, which is what ties them to the one refinery whose oil caused
      illness.
    evidence:
    - reference: PMID:7710294
      reference_title: 'Possible etiologic agents for toxic oil syndrome: fatty acid esters of 3-(N-phenylamino)-1,2-propanediol.'
      supports: SUPPORT
      evidence_source: OTHER
      quote_role: PRIMARY_RESULT
      snippet: "These results show that the esters of PAP were products of the ITH refining process and were not formed spontaneously during storage."
      explanation: >-
        Establishes this edge specifically - that the ingested oil carried the
        esters because of what was done to it, which is the step this link
        asserts. Graded OTHER because it is an analytical chemistry result on
        oil samples rather than a study of people, animals or cells.
  evidence:
  - reference: PMID:12192735
    reference_title: 'Toxic oil syndrome: the perspective after 20 years.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The vehicle of the causative toxic agent was identified as an illicit oil that had been diverted from industrial use and refined in order to remove the aniline denaturant, and that was sold in unlabeled 5-liter containers by itinerant salesmen."
    explanation: >-
      The vehicle and the route by which it reached households, which is what
      this node claims.
  - reference: PMID:1869734
    reference_title: 'Toxic oil syndrome: a current clinical and epidemiologic summary, including comparisons with the eosinophilia-myalgia syndrome.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Aniline itself did not cause the illness, but the causal agent may be a reaction product of aniline with some oil component."
    explanation: >-
      The reason this node is named for the denatured oil rather than for
      aniline exposure, and the reason no ECTO aniline-exposure term is bound
      anywhere in this entry.
- name: Systemic Exposure to PAP Fatty Acid Esters
  biological_scale: ORGANISM
  description: >-
    The di- and mono-oleyl esters of 3-(N-phenylamino)-1,2-propanediol are the
    compounds most strongly associated with case-related oil. They are
    hydrolysed by pancreatic lipase like a triglyceride, absorbed from the gut,
    and distributed to organs - which is what makes a systemic disease from an
    ingested compound.
  biological_processes:
  - preferred_term: response to xenobiotic stimulus
    term:
      id: GO:0009410
      label: response to xenobiotic stimulus
  downstream:
  - target: Hepatic Biotransformation of PAP to 3-(Phenylamino)alanine
    causal_link_type: DIRECT
  - target: Vascular Endothelial Injury
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    hypothesis_groups:
    - direct_toxic_endothelial_injury
    - paf_analogue_signalling
    description: >-
      The central unproven step of the whole entry. No cited source traces a
      route from an absorbed PAP ester to an injured endothelial cell; the
      pathology series proposes free radicals and says so hypothetically. The
      intermediates are recorded as unknown rather than filled in.
  evidence:
  - reference: PMID:10069247
    reference_title: Epidemiologic evidence for a new class of compounds associated with toxic oil syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We found the odds ratio for exposure to DPAP (OR = 26.4, 95% CI = 6.4-76.3) is much higher than the odds ratio for exposure to oleyl anilide (OR = 4.1, 95% CI = 2.2-7.8), implying that exposure to DPAP was a more relevant risk factor for development of toxic oil syndrome than exposure to oleyl anilide."
    explanation: >-
      Quantifies why this node names the PAP esters and not the fatty acid
      anilides that were the earlier suspect, and gives both odds ratios so the
      comparison is visible rather than asserted.
  - reference: PMID:11768157
    reference_title: Absorption and effects of 3-(N-phenylamino)-1,2-propanediol esters in relation to toxic oil syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: "Results indicate that PAP esters are absorbed in the gastrointestinal tract and are distributed and stored in different organs, particularly in the liver and brown adipose tissue."
    explanation: >-
      Supplies the absorption and distribution step this node asserts. Graded
      MODEL_ORGANISM because the absorption and tissue-distribution
      measurements were made in animals.
  - reference: PMID:15257613
    reference_title: 'Studies on toxic oil syndrome: stereoselective hydrolysis of 3-(phenylamino)propane-1,2-diol esters by human pancreatic lipase.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Taken together, these results showed that PAP esters are substrates of hPL and that the two hydrolytic steps exhibit kinetic resolution in favor of the (S)-enantiomers."
    explanation: >-
      Shows the esters enter normal lipid handling at the first step, which is
      how a compound eaten in trace amounts becomes systemically available.
- name: Hepatic Biotransformation of PAP to 3-(Phenylamino)alanine
  biological_scale: MOLECULAR
  description: >-
    Liver tissue converts PAP to 3-(phenylamino)alanine, the aniline derivative
    independently isolated from the L-tryptophan implicated in
    eosinophilia-myalgia syndrome. This is the chemical link between the two
    epidemics, and it is a shared metabolite rather than a shared exposure.
  biological_processes:
  - preferred_term: response to xenobiotic stimulus
    term:
      id: GO:0009410
      label: response to xenobiotic stimulus
  evidence:
  - reference: PMID:8555405
    reference_title: 'Biotransformation of 3-(phenylamino)-1,2-propanediol to 3-(phenylamino)alanine: a chemical link between toxic oil syndrome and eosinophilia-myalgia syndrome.'
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "Here, we demonstrate the biotransformation of PAP into PAA by both rat hepatocytes and human liver tissue."
    explanation: >-
      The reaction this node names, shown in human liver tissue as well as rat
      hepatocytes. IN_VITRO because both preparations are tissue and cells
      outside an organism.
  - reference: PMID:8555405
    reference_title: 'Biotransformation of 3-(phenylamino)-1,2-propanediol to 3-(phenylamino)alanine: a chemical link between toxic oil syndrome and eosinophilia-myalgia syndrome.'
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: "This finding is the first reported chemical link between TOS and EMS and suggests that these two related diseases share a common etiology, namely, PAA."
    explanation: >-
      Why the node is worth having as its own step rather than folded into the
      exposure node. INDIRECT because a shared metabolite makes a common
      etiology plausible without establishing it - the authors write
      "suggests".
- name: Vascular Endothelial Injury
  biological_scale: CELLULAR
  description: >-
    The first lesion in the vessel wall, graded in the pathology series from
    endothelial cell swelling through to cell necrosis. Every later vascular
    step in this entry follows from it.
  cell_types:
  - preferred_term: vascular endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  locations:
  - preferred_term: blood vessel
    term:
      id: UBERON:0001981
      label: blood vessel
  downstream:
  - target: Perivascular and Interstitial Inflammatory Infiltration
    causal_link_type: DIRECT
    evidence:
    - reference: PMID:1654352
      reference_title: Extracardiac vascular and neural lesions in the toxic oil syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "It then progresses by mixed cellular inflammatory infiltration of the intima and, in some cases, of the media and adventitia."
      explanation: >-
        States the ordering this edge asserts - infiltration follows the
        endothelial lesion - rather than merely that both are present.
  evidence:
  - reference: PMID:1654352
    reference_title: Extracardiac vascular and neural lesions in the toxic oil syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The vascular lesions begins with endothelial damage that varies from cellular swelling to cellular necrosis."
    explanation: >-
      Names this as the first lesion and gives its range. Quoted with the
      source's own grammatical slip intact, as a snippet must be.
  - reference: PMID:9074654
    reference_title: 'Cytokine mRNA expression in lung tissue from toxic oil syndrome patients: a TH2 immunological mechanism.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: BACKGROUND
    snippet: "The pathologic findings in TOS showed primary endothelial injury, with cell proliferation and perivascular inflammatory infiltrates."
    explanation: >-
      An independent statement that the endothelial injury is primary. BACKGROUND
      because it is this cytokine paper's framing of established pathology
      rather than its own measurement.
- name: T Cell Activation with Th2 Skewing in Lung Tissue
  biological_scale: CELLULAR
  description: >-
    Lung tissue from affected patients shows T-cell activation with both Th1 and
    Th2 cytokine profiles raised, and the Th2 increment over Th1 is itself
    significant. The response is not purely Th2 - both arms are up - and the
    entry says so rather than simplifying to a Th2 disease.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: T-helper 2 cell
    term:
      id: CL:0000546
      label: T-helper 2 cell
  biological_processes:
  - preferred_term: T cell activation
    term:
      id: GO:0042110
      label: T cell activation
    modifier: INCREASED
  - preferred_term: type 2 immune response
    term:
      id: GO:0042092
      label: type 2 immune response
    modifier: INCREASED
  locations:
  - preferred_term: lung
    term:
      id: UBERON:0002048
      label: lung
  downstream:
  - target: Peripheral Eosinophilia
    causal_link_type: DIRECT
  - target: Perivascular and Interstitial Inflammatory Infiltration
    causal_link_type: DIRECT
    hypothesis_groups:
    - immune_mediated_initiation
  evidence:
  - reference: PMID:9074654
    reference_title: 'Cytokine mRNA expression in lung tissue from toxic oil syndrome patients: a TH2 immunological mechanism.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We found a significant increase in Th1 (P = 0.006) and Th2 (P = 0.003) cytokine profile in TOS patients with respect to controls."
    explanation: >-
      Both arms rose, and the quote is chosen to carry that rather than the
      Th2 figure alone - the node's description depends on it.
  - reference: PMID:9074654
    reference_title: 'Cytokine mRNA expression in lung tissue from toxic oil syndrome patients: a TH2 immunological mechanism.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The increment in TH2 response with respect to TH1 is significant (P = 0.03) in TOS lung specimens."
    explanation: >-
      The skew itself, which is the part of the claim the previous quote does
      not establish.
- name: Peripheral Eosinophilia
  biological_scale: ORGANISM
  description: >-
    Marked peripheral eosinophilia is one of the two features that made the
    epidemic recognisable as a single disease, alongside incapacitating myalgia.
    Eosinophils are also found in the vessel wall infiltrate in some cases.
  cell_types:
  - preferred_term: eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  biological_processes:
  - preferred_term: eosinophil chemotaxis
    term:
      id: GO:0048245
      label: eosinophil chemotaxis
    modifier: INCREASED
  downstream:
  - target: Increased total eosinophil count
    causal_link_type: DIRECT
  - target: Perivascular and Interstitial Inflammatory Infiltration
    causal_link_type: DIRECT
    description: >-
      The eosinophil-rich subset of the infiltrate. The pathology series is
      careful that this is "some cases" rather than the rule, and the edge
      claims no more than that.
    evidence:
    - reference: PMID:1654352
      reference_title: Extracardiac vascular and neural lesions in the toxic oil syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "In some cases the infiltrate is rich in eosinophils and a few show foamy histiocytes."
      explanation: >-
        Supports the edge and bounds it - eosinophil-rich infiltration is a
        subset finding, not the universal picture.
  evidence:
  - reference: PMID:8266108
    reference_title: 'Toxic oil syndrome and eosinophilia-myalgia syndrome: May 8-10, 1991, World Health Organization meeting report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Both illnesses affect patients clinically by causing intense, incapacitating myalgias and a marked peripheral eosinophilia."
    explanation: >-
      The WHO workshop's statement of the two defining clinical features. It is
      a comparative sentence covering TOS and EMS together, which is how the
      source makes the claim.
- name: Perivascular and Interstitial Inflammatory Infiltration
  biological_scale: TISSUE
  description: >-
    The mixed cellular infiltrate that follows endothelial injury, in the intima
    and sometimes the media and adventitia, and more widely in the interstitium
    of affected organs. It is the branch point of the entry: the vascular,
    neural, muscular and cutaneous arms all descend from it.
  cell_types:
  - preferred_term: T cell
    term:
      id: CL:0000084
      label: T cell
  - preferred_term: eosinophil
    term:
      id: CL:0000771
      label: eosinophil
  biological_processes:
  - preferred_term: leukocyte migration
    term:
      id: GO:0050900
      label: leukocyte migration
    modifier: INCREASED
  locations:
  - preferred_term: tunica intima
    term:
      id: UBERON:0002523
      label: tunica intima
  downstream:
  - target: Myointimal and Fibroblastic Proliferation
    causal_link_type: DIRECT
  - target: Lymphocytic Perineuritis
    causal_link_type: DIRECT
  - target: Interstitial Inflammatory Myopathy
    causal_link_type: DIRECT
  - target: Dermal and Fascial Fibrosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Drawn with unknown intermediates deliberately. The fibrogenic growth
      factors that would supply the intermediates in the comparable disease
      were looked for in TOS skin and were not found - see the REFUTE item on
      the target node.
  - target: Pulmonary infiltrates
    causal_link_type: DIRECT
    description: >-
      The radiographic infiltrate of the acute phase is this same interstitial
      inflammatory process seen in the lung.
    evidence:
    - reference: PMID:3961509
      reference_title: 'Toxic oil syndrome: a syndrome with features overlapping those of various forms of scleroderma.'
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: PRIMARY_RESULT
      snippet: "Histologic investigations showed a widespread chronic interstitial infiltrate with lymphocytic vasculitis."
      explanation: >-
        Supports this edge rather than either node alone: the histology of
        patients presenting with the acute pulmonary picture is a widespread
        interstitial infiltrate, which is the lesion behind the radiographic
        finding.
  evidence:
  - reference: PMID:8412642
    reference_title: Toxic oil syndrome. A long-term follow-up of a cohort of 332 patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The most important pathologic features of TOS were widespread interstitial infiltrates, non-necrotizing angiitis, endothelial proliferation, and tissue fibrosis."
    explanation: >-
      Names the infiltrate as widespread and interstitial, not only intimal,
      which is what lets this one node serve as the branch point for the
      non-vascular arms.
  - reference: PMID:1654352
    reference_title: Extracardiac vascular and neural lesions in the toxic oil syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Vessels of every type and size are involved, affecting practically every organ."
    explanation: >-
      The distribution of the lesion, which is why this entry has arms reaching
      lung, nerve, muscle and skin rather than one target organ.
- name: Myointimal and Fibroblastic Proliferation
  biological_scale: TISSUE
  description: >-
    Proliferation of myointimal cells, joined in advanced lesions by
    fibroblasts. This is what converts an inflamed vessel into a narrowed one.
  cell_types:
  - preferred_term: myointimal smooth muscle cell
    term:

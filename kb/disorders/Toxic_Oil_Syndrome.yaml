environmental:
- name: Ingestion of aniline-denatured rapeseed oil sold as cooking oil
  description: >-
    Rapeseed oil imported under a 2% aniline denaturant for industrial use,
    re-refined to strip the denaturant, and distributed in unlabelled 5-litre
    containers by itinerant salesmen in central and north-western Spain in 1981.
  exposure_term:
    preferred_term: exposure to a food adulterated with an industrial denaturant
    term:
      id: ECTO:9002126
      label: exposure to environmental food contaminant
  influences_mechanisms:
  - target: Ingestion of Aniline-Denatured Rapeseed Oil
    environmental_effect: TRIGGERS
    causal_link_type: DIRECT
    description: >-
      The exposure is the disease's sole cause; withdrawal of the oil from sale
      ended the epidemic and there has been no ongoing incidence since.
    evidence:
    - reference: PMID:10069247
      reference_title: Epidemiologic evidence for a new class of compounds associated with toxic oil syndrome.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      quote_role: BACKGROUND
      snippet: "Epidemiologic studies have demonstrated that illness was caused by consumption of rapeseed oil that had been denatured with aniline."
      explanation: >-
        States the exposure-disease link this edge asserts. BACKGROUND because
        it is this chemistry paper's framing of the established epidemiology
        rather than its own analysis.
  evidence:
  - reference: PMID:12192735
    reference_title: 'Toxic oil syndrome: the perspective after 20 years.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "The vehicle of the causative toxic agent was identified as an illicit oil that had been diverted from industrial use and refined in order to remove the aniline denaturant, and that was sold in unlabeled 5-liter containers by itinerant salesmen."
    explanation: The exposure, its provenance and its distribution route in one sentence.
  notes: >-
    ECTO has an `exposure to aniline` term (`ECTO:9000980`, found with
    `runoak -i ols:ecto search "exposure to aniline"`), and it is deliberately
    not used: `PMID:1869734` states that aniline itself did not cause the
    illness. Binding it would assert the one thing the sources rule out. The
    bound term names the concept the epidemiology actually supports - a food
    carrying an industrial contaminant.
genetic:
- name: HLA class II association with fatal disease
  notes: >-
    Susceptibility and severity have repeatedly been linked to HLA, but the
    findings do not all agree, and the best-designed study found the association
    only in those who died. No causal gene is established, and TOS is not
    heritable - these are host susceptibility factors for an environmental
    exposure.
  relationship_type: MODIFIER
  gene_term:
    preferred_term: HLA-DRB1
    term:
      id: hgnc:4948
      label: HLA-DRB1
  evidence:
  - reference: PMID:10746782
    reference_title: DR2 antigens are associated with severity of disease in toxic oil syndrome (TOS).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "In contrast, an increase in phenotypic frequency of DR2 antigen, was found in patients who had died from TOS (73.5%)"
    explanation: >-
      The positive finding, and it is specifically about patients who died
      rather than about susceptibility to the disease.
  - reference: PMID:10746782
    reference_title: DR2 antigens are associated with severity of disease in toxic oil syndrome (TOS).
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Regarding surviving patients no significant association was found between HLA and disease."
    explanation: >-
      SUPPORT, not REFUTE, and the distinction is the whole point of this
      record. The absence of any association among survivors is what confines
      the DR2 finding to fatal disease, which is exactly what this record
      claims and why it is typed MODIFIER. The same sentence is carried as
      REFUTE on the susceptibility record below, where it does cut against the
      claim being made.
- name: HLA class I and DR4-DQ8 association with susceptibility
  notes: >-
    An earlier case series reported HLA-A24, the DR4-DQ8 haplotype and DQ-alpha
    arginine 52 as susceptibility markers, and read the pattern as supporting an
    autoimmune classification.
  relationship_type: RISK_FACTOR
  gene_term:
    preferred_term: HLA-A
    term:
      id: hgnc:4931
      label: HLA-A
  evidence:
  - reference: PMID:8803534
    reference_title: Frequencies of HLA-A24 and HLA-DR4-DQ8 are increased and that of HLA-B blank is decreased in chronic toxic oil syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "In this paper it is also established that a human class I antigen (HLA-A24) and, independently, an HLA class II haplotype (DR4-DQ8, Pcorrected = 0.04) and arginine 52 in the alpha-DQ chains (Pcorrected = 0.03) are associated with TOS susceptibility, similarly to insulin-dependent diabetes."
    explanation: >-
      The reported associations with their corrected p-values. The gene binding
      is HLA-A because A24 is a serotype of that locus; allele-level detail in
      a gene field follows the HLA-B27 precedent in this repository.
  - reference: PMID:10746782
    reference_title: DR2 antigens are associated with severity of disease in toxic oil syndrome (TOS).
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Regarding surviving patients no significant association was found between HLA and disease."
    explanation: >-
      REFUTE against this record's susceptibility claim. A later, larger
      case-control study with family and unrelated controls found no HLA
      association among surviving patients at all, which is the population
      a susceptibility claim is about.
treatments:
- name: Corticosteroid Therapy
  description: >-
    Used in the acute and subacute phases. It relieves symptoms without
    changing the course of the disease, which is the conclusion the WHO
    workshop reached for both TOS and eosinophilia-myalgia syndrome.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: corticosteroid
      term:
        id: CHEBI:50858
        label: corticosteroid
  evidence:
  - reference: PMID:8266108
    reference_title: 'Toxic oil syndrome and eosinophilia-myalgia syndrome: May 8-10, 1991, World Health Organization meeting report.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Although treatment with corticosteroids has resulted in significant symptomatic relief in persons with either disorder, it does not alter the clinical course or long-term outcome."
    explanation: >-
      Supports the symptomatic benefit this treatment claims. The same sentence
      is carried again below as REFUTE against disease modification, because it
      makes both claims at once.
  - reference: PMID:8266108
    reference_title: 'Toxic oil syndrome and eosinophilia-myalgia syndrome: May 8-10, 1991, World Health Organization meeting report.'
    supports: REFUTE
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Although treatment with corticosteroids has resulted in significant symptomatic relief in persons with either disorder, it does not alter the clinical course or long-term outcome."
    explanation: >-
      REFUTE against corticosteroids as disease-modifying therapy. There is
      deliberately no `target_mechanisms` edge: on this evidence the drug does
      not act on the pathograph, and recording one would assert an effect the
      only cited source denies.
  notes: >-
    The same quoted sentence appears twice with opposite `supports` values.
    That is the claim-relative behaviour `supports` is meant to have - the
    sentence supports symptomatic relief and refutes disease modification -
    and `evidence_source` is identical in both, so the grading gate is
    satisfied.
- name: Supportive Care
  description: >-
    The mainstay throughout: respiratory support in the acute pulmonary oedema,
    and management of the chronic complications. An earlier draft said no
    intervention trialled during or after the epidemic altered the course of
    the disease. Only corticosteroids are cache-backed for that claim here, so
    it is narrowed - the other agents the literature reports as trialled
    without benefit (azathioprine, penicillamine, plasmapheresis, vitamin E,
    superoxide dismutase) are not cited in this entry and are not asserted by
    it.
  treatment_term:
    preferred_term: Supportive Care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:8266108
    reference_title: 'Toxic oil syndrome and eosinophilia-myalgia syndrome: May 8-10, 1991, World Health Organization meeting report.'
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Research into the etiologic agents, preferred treatments, and ways to avoid similar problems in the future is needed."
    explanation: >-
      INDIRECT, and quoted for what it concedes: a decade after the epidemic
      the WHO workshop still listed preferred treatment as an open research
      question, which is the situation that leaves supportive care as the
      mainstay. It is not a study of supportive care.
- name: Rehabilitation
  description: >-
    For the joint contractures and the neuropathic disability of the chronic
    phase, which are among the three complications the WHO workshop named as
    long-term.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: Rehabilitation
    term:
      id: NCIT:C15315
      label: Rehabilitation
  evidence:
  - reference: PMID:8266108
    reference_title: 'Toxic oil syndrome and eosinophilia-myalgia syndrome: May 8-10, 1991, World Health Organization meeting report.'
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Long-term complications include pulmonary hypertension, peripheral neuropathies, and joint contractures."
    explanation: >-
      INDIRECT: the source establishes the disabling complications that
      rehabilitation addresses, not the efficacy of rehabilitation in this
      disease, which no cited source reports.
prevalence:
- population: Spain, 1981 epidemic cohort
  measure_type: CASES_IN_LITERATURE
  prevalence_class: NOT_YET_DOCUMENTED
  notes: >-
    A closed point-source epidemic with no ongoing incidence, so a population rate
    would be misleading and no numeric slot is populated. prevalence_class is
    NOT_YET_DOCUMENTED because no rate has been documented, not because the
    epidemic was uncounted - the cohort size is documented, and appears in the
    evidence snippet below. Estimates differ slightly with the cohort-closure
    date used.
  evidence:
  - reference: PMID:8412642
    reference_title: Toxic oil syndrome. A long-term follow-up of a cohort of 332 patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "It affected 19,748 people, of whom 457 died."
    explanation: >-
      One cohort count with its own death toll. See the entry `notes:` for why
      this is not reconciled with the other published figures.
progression:
- phase: Acute phase
  notes: >-
    The first two months: non-cardiogenic pulmonary oedema, rash, eosinophilia and
    myalgia. Roughly half of patients across the epidemic recovered from this
    phase without apparent sequelae (PMID:1869734), against 9% achieving
    remission in the 332-patient cohort followed below. The two figures are
    not in conflict and are not averaged here: the first is the whole
    ~20,000-case epidemic, the second a referral cohort selected for longer
    follow-up.
  evidence:
  - reference: PMID:8412642
    reference_title: Toxic oil syndrome. A long-term follow-up of a cohort of 332 patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "The acute phase lasted 2 months, and was characterized by pulmonary edema, rash, eosinophilia, and myalgia."
    explanation: The duration and the four defining features.
- phase: Intermediate phase
  notes: >-
    Months two to four: severe myalgia, skin tenderness, subcutaneous oedema,
    altered liver function and pulmonary hypertension.
  evidence:
  - reference: PMID:8412642
    reference_title: Toxic oil syndrome. A long-term follow-up of a cohort of 332 patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "During the intermediate phase (second to fourth months), severe myalgia, skin tenderness, subcutaneous edema, altered liver function, and pulmonary hypertension developed."
    explanation: The window and its features.
- phase: Early chronic phase
  notes: >-
    Month four to the end of the second year: scleroderma, sicca syndrome,
    polyneuropathy, joint contractures, weight loss and functional limitation.
    Only 9% of patients remitted after the acute phase.
  evidence:
  - reference: PMID:8412642
    reference_title: Toxic oil syndrome. A long-term follow-up of a cohort of 332 patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Only 9% of the patients achieved remission after the acute phase, the rest developing late clinical manifestations of the disease."
    explanation: >-
      The proportion that did not progress, which is what makes the chronic
      phase the expected course rather than a complication.
- phase: Late chronic phase
  notes: >-
    Beyond two years, with partial improvement in many: muscle cramps, chronic
    musculoskeletal pain, chronic lung disease, Raynaud phenomenon, carpal
    tunnel syndrome and psychological disturbance.
  evidence:
  - reference: PMID:8412642
    reference_title: Toxic oil syndrome. A long-term follow-up of a cohort of 332 patients.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Its most prominent clinical features were muscle cramps, chronic musculoskeletal pain, chronic lung disease, Raynaud phenomenon, carpal tunnel syndrome, and psychologic disturbances."
    explanation: The late-phase feature set.
animal_models:
- name: HLA-DR2/DQ6 transgenic mouse fed toxic oil
  species: Mouse
  genotype: HLA-DR2 and HLA-DQ6 transgenic
  publication: PMID:15979827
  description: >-
    Built to test the human HLA restriction rather than to reproduce the
    disease. DR2 and DQ6 transgenic mice given toxic oil showed higher
    eosinophil percentages and IgE than DR3 or DR4 transgenics, which matches
    the direction of the human HLA finding.
  modeled_mechanisms:
  - target: T Cell Activation with Th2 Skewing in Lung Tissue
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: CELLULAR
    description: >-
      Reproduces the HLA-dependent immunological readouts, and nothing else
      about the disease.
    limitations: >-
      The model reports eosinophil percentage, IgE and a cytokine shift. It
      does not produce the endovasculitis that defines toxic oil syndrome, and
      no animal model does - see the `no_animal_model` discussion. Reading
      these mice as a model of the disease rather than of one immunological
      axis is the error the entry is guarding against.
    evidence:
    - reference: PMID:15979827
      reference_title: 'Toxic oil syndrome: genetic restriction and immunomodulatory effects due to adulterated oils in a model of HLA transgenic mice.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Results show that mice expressing human DR2 and DQ6 (both in linkage disequilibrium), had higher percentage of eosinophils (DQ6) and IgE (DR2) than other transgenic mice tested (DR3 and DR4)."
      explanation: >-
        The measured result, and the reason the link is PARTIALLY rather than
        fully recapitulating: two immunological readouts, no disease.
- name: Mouse given fatty acid anilides and the linoleic PAP diester
  species: Mouse
  genotype: wild type
  publication: PMID:10650923
  description: >-
    Intraperitoneal administration of the two suspect compound classes. The
    closest any animal has come to the acute human illness, and the authors
    are careful about how close that is.
  modeled_mechanisms:
  - target: Peripheral Eosinophilia
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Reproduces the blood eosinophilia and lung pathology of the acute phase
      from the candidate compounds, without the vasculitis that defines the
      disease.
    limitations: >-
      Intraperitoneal rather than oral, which is the route the disease took,
      and the companion rat study found intragastric PAP produced no toxicity
      at all. The endovasculitis is absent. The authors say the effects
      "resemble" the acute human disease and explicitly note the full spectrum
      was not produced.
    evidence:
    - reference: PMID:10650923
      reference_title: 'The acute pathology of fatty acid anilides and linoleic diester of 3-phenylamino-1,2-propanediol in mice: possible implication as aetiologic agents for the toxic oil syndrome.'
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Linoleic diester of PAP led to weight loss, haemorrhage, congestion and emphysema in the lungs and an increase in blood eosinophilia."
      explanation: >-
        The measured findings, including the eosinophilia this link targets.
    - reference: PMID:10650923
      reference_title: 'The acute pathology of fatty acid anilides and linoleic diester of 3-phenylamino-1,2-propanediol in mice: possible implication as aetiologic agents for the toxic oil syndrome.'
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Although not producing the full spectrum of symptoms the effects of the substances resemble the acute human disease."
      explanation: >-
        REFUTE against reading this as a model of toxic oil syndrome. The
        authors' own qualification, and the reason the link is PARTIALLY at
        LOW fidelity rather than recapitulating.
- name: Rat given 3-phenylamino-1,2-propanediol
  species: Rat
  genotype: wild type
  publication: PMID:7779449
  description: >-
    A direct attempt to produce the disease with the leading candidate
    compound. It failed, and the way it failed is informative: the pathology
    it did produce was judged unrepresentative, and the oral route - the route
    of the actual epidemic - produced nothing at all.
  modeled_mechanisms:
  - target: In Situ Thrombosis on the Damaged Vessel Wall
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    model_scale: ORGANISM
    description: >-
      Intraperitoneal PAP caused massive pulmonary thromboembolism in rats,
      but by thrombosis in mesenteric vessels that then embolised - not by the
      endovasculitis of the human disease.
    limitations: >-
      The authors state the pathology is not representative of human toxic oil
      syndrome. The mono-oleoyl ester caused no toxicity at all, and
      intragastric PAP caused none either, which is the finding that matters
      most: the human disease was caused by eating the compound.
    evidence:
    - reference: PMID:7779449
      reference_title: A comparison of the acute pathology induced by 3-phenylamino-1,2-propanediol (PAP) and its mono-oleoyl ester in rodents with the toxic oil syndrome in man.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Comparatively, the pathology seen after intraperitoneal administration of PAP was not thought to be representative of the pathology of the toxic oil syndrome in man."
      explanation: >-
        The authors' own verdict on their model, which is what makes this a
        FAILS_TO_RECAPITULATE link rather than a partial one.
    - reference: PMID:7779449
      reference_title: A comparison of the acute pathology induced by 3-phenylamino-1,2-propanediol (PAP) and its mono-oleoyl ester in rodents with the toxic oil syndrome in man.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      quote_role: PRIMARY_RESULT
      snippet: "Intra-gastric administration of PAP caused no toxicity in rats."
      explanation: >-
        The sharpest negative in the entry. The human disease came from eating
        the oil; giving rats the leading candidate compound by mouth did
        nothing. Any account of PAP as the agent has to explain this.
discussions:
- kind: KNOWLEDGE_GAP
  discussion_id: unidentified_etiologic_agent
  prompt: >-
    Which compound in the re-refined oil caused toxic oil syndrome, and by what
    molecular mechanism does it injure vascular endothelium?
  attaches_to:
  - pathophysiology#Systemic Exposure to PAP Fatty Acid Esters
  - pathophysiology#Vascular Endothelial Injury
  rationale: >-
    Forty years on, the agent is unidentified. The PAP esters carry the
    strongest association, their absorption and hepatic biotransformation are
    measured, and a metabolite is shared with eosinophilia-myalgia syndrome -
    but no compound has been shown to produce the disease, and the step from an
    absorbed ester to an injured endothelial cell is entirely unfilled. One
    review argues on metabolic grounds that there was never a single agent to
    find.
  evidence:
  - reference: PMID:12192735
    reference_title: 'Toxic oil syndrome: the perspective after 20 years.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "Although the exact identity of the etiologic agent in toxic oil syndrome remains unknown, work on toxic oil syndrome continues."
    explanation: States the gap directly, twenty years after the epidemic.
  - reference: PMID:11501225
    reference_title: 'The toxic oil syndrome: 20 years on.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "On metabolic evidence, it is suggested that not one, but a group of, toxic agents was responsible for TOS."
    explanation: >-
      Raises the possibility that the search has been for the wrong kind of
      answer - a group of agents rather than one - which would explain why no
      single compound has been convicted.
- kind: HUMAN_MODEL_MISMATCH
  discussion_id: no_animal_model
  prompt: >-
    Why has no animal species reproduced the pathology of toxic oil syndrome,
    and does that failure reflect a missing host factor rather than the wrong
    compound?
  attaches_to:
  - pathophysiology#Vascular Endothelial Injury
  - animal_models#Mouse
  rationale: >-
    This is the load-bearing gap in the whole disease, and it is not a
    KNOWLEDGE_GAP: evidence in model systems exists, it simply does not
    reproduce the human lesion. Because no animal develops the endovasculitis,
    candidate compounds cannot be tested by administering them, which is why
    the etiology has rested on epidemiological association with oil batches for
    four decades. A review of the problem proposed screening species and
    strains predisposed to vasculitis, eosinophilia and raised IgE - an
    approach that assumes the missing ingredient is host susceptibility rather
    than the wrong compound. The human HLA associations make that assumption
    reasonable and do not establish it.
  evidence:
  - reference: PMID:12176082
    reference_title: A search for an animal model of the Spanish toxic oil syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "To date, pathology characteristics of toxic oil syndrome (TOS), a disease associated with consumption of a contaminated cooking oil in Spain in 1981, have not been reproduced in an animal model."
    explanation: >-
      States the mismatch. MEDLINE types this publication as a Review and it
      performed no animal experiment of its own, so the quote is the field's
      state as this review reports it - REVIEW_SYNTHESIS, and OTHER rather
      than MODEL_ORGANISM, which would assert an animal study that does not
      exist here.
  - reference: PMID:12176082
    reference_title: A search for an animal model of the Spanish toxic oil syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "The intent was to determine predisposed strains or species that potentially might be effective in testing the toxic oils and thus defining the precise identity of the toxic contaminant(s)."
    explanation: >-
      Makes the dependency explicit - identifying the agent is blocked on
      having a model, which is why this gap and the etiology gap are the same
      problem from two sides. Graded as the same review's synthesis, for the
      reason given on the item above.
- kind: KNOWLEDGE_GAP
  discussion_id: cognitive_deficit_mechanism
  prompt: >-
    Is the cognitive impairment measured in toxic oil syndrome survivors four
    decades after exposure a direct neurotoxic sequela, or a downstream effect
    of chronic fatigue, mood symptoms and medication?
  attaches_to:
  - phenotypes#Cognitive impairment
  - phenotypes#Fatigue
  rationale: >-
    Two 2025 case-control studies, each 50 survivors against 50 matched controls,
    pull in opposite directions and neither settles it. Whether they report
    the same 50 people is not stated in either abstract and is not assumed
    here. Survivors perform worse on
    attention, executive function, processing speed and global cognition, but
    the difference disappears once fatigue, depression, anxiety and CNS-acting
    medication are adjusted for, and fatigue mediates most of it. In parallel, neurofilament light chain was slightly higher in survivors on the
    raw group comparison (p = 0.025) while GFAP and pTau217 were not, and
    clinical status predicted none of the three once age, sex and education
    entered the models. So there is a measurable deficit with no biomarker
    correlate and a plausible non-neurotoxic explanation, which is three
    different things being unresolved at once rather than one.
  evidence:
  - reference: PMID:40507935
    reference_title: 'Blood Biomarkers of Neurodegeneration over Four Decades After Toxic Oil Syndrome: A Case-Control Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Clinical status (TOS vs. control) did not significantly predict biomarker concentrations in any model."
    explanation: >-
      The negative biomarker result stated at its strongest and narrowest -
      no predictive effect of disease status in any model.
  - reference: PMID:40507935
    reference_title: 'Blood Biomarkers of Neurodegeneration over Four Decades After Toxic Oil Syndrome: A Case-Control Study.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "However, the possibility of subtle, compartmentalized, or slowly evolving neurotoxic processes cannot be excluded."
    explanation: >-
      The authors' own limit on their negative result, quoted so the gap is
      recorded as open rather than closed against neurotoxicity.
- kind: KNOWLEDGE_GAP
  discussion_id: fibrosis_driver_unknown
  prompt: >-
    What drives the dermal and fascial fibrosis of the chronic phase, given
    that the growth factors responsible in eosinophilia-myalgia syndrome are
    absent from toxic oil syndrome skin?
  attaches_to:
  - pathophysiology#Dermal and Fascial Fibrosis
  rationale: >-
    The two epidemics are routinely discussed as near-identical, and the
    temptation is to carry the eosinophilia-myalgia syndrome mechanism across.
    An immunohistochemical comparison blocks that: TGF-beta and PDGF-AA were
    present in the periappendageal dermis of 57% of EMS specimens and 0% of
    toxic oil syndrome specimens. Whatever drives the fibrosis here is not the
    driver there, and it has not been identified. The specimen count is small,
    so this is a finding to explain rather than a settled negative.
  evidence:
  - reference: PMID:8285738
    reference_title: Fibrogenic growth factors in the eosinophilia-myalgia syndrome and the toxic oil syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "Seven skin biopsy specimens from EMS, six skin biopsy specimens from toxic oil syndrome, nine muscle biopsy specimens from EMS, and one sural nerve biopsy specimen from EMS were studied."
    explanation: >-
      The specimen counts, quoted because the gap's force depends on them: six
      TOS skin biopsies is a small denominator for a 0% finding, and the
      rationale says so rather than leaving the reader to assume otherwise.
clinical_burden:
  burden_level: HIGH
  rationale: >-
    Around 20,000 people were affected in a single point-source epidemic, most
    of whom did not remit after the acute phase, and mortality in the cohort was
    8.4% over the first thirteen years. Pulmonary hypertension is one of only
    two causes of death that were not decreased relative to the general Spanish
    population - the cohort's overall mortality was lower than expected, so
    this is one cause spared a general decline rather than a demonstrated
    excess - and new cases of it were still being diagnosed in exposed
    survivors decades on.
  evidence:
  - reference: PMID:10024203
    reference_title: 'Toxic oil syndrome mortality: the first 13 years.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "We identified 1663 deaths between 1 May 1981 and 31 December 1994 among 19 754 TOS cohort members, for a crude mortality rate of 8.4%."
    explanation: The cohort size and its thirteen-year crude mortality.
  - reference: PMID:10024203
    reference_title: 'Toxic oil syndrome mortality: the first 13 years.'
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: "except for deaths attributed to external causes including TOS and deaths due to pulmonary hypertension, all causes of death were decreased in TOS patients compared to the Spanish population"
    explanation: >-
      Identifies pulmonary hypertension as one of only two causes of death not
      decreased relative to the Spanish population. Note what the sentence
      does and does not say: "not decreased" is weaker than "raised", and the
      same abstract reports the cohort's overall mortality as less than
      expected. It still makes this the burden-defining phenotype, because
      every other cause moved the other way.

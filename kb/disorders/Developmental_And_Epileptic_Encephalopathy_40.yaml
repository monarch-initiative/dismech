treatments:
- name: Genetic counseling
  description: >-
    Because DEE40 is autosomal recessive and the reported family was
    consanguineous, recurrence-risk counselling and carrier testing are part of
    family care. No disease-modifying or GUF1-specific therapy exists, and no
    antiseizure drug response has been reported in a GUF1 patient (see notes).
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: PMID:26486472
    reference_title: West syndrome caused by homozygous variant in the evolutionary conserved gene encoding the mitochondrial elongation factor GUF1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we exome-sequenced the members of a consanguineous family affected with isolated WS. We identified a homozygous variant (c.1825G>T/p.(Ala609Ser)) in the GUF1 gene in the three affected siblings."
    explanation: >-
      Establishes the consanguineous, biallelic recurrence situation that makes
      recurrence-risk counselling relevant.
animal_models:
- name: mtEF4 knockout mouse
  species: Mouse
  genotype: mtEF4 (Guf1) knockout, including germline-specific conditional deletion
  category: Genetic
  publication: PMID:27065197
  description: >-
    Whole-animal and germline-specific mtEF4 knockout mice were made to test the
    physiological requirement for the factor. The result is informative for the
    translation node of this entry and, equally importantly, is a negative result
    for the neurological one: the phenotype is testis-restricted male infertility,
    with somatic tissues compensating through mTOR-driven cytoplasmic
    translation. No epilepsy or encephalopathy phenotype is reported.
  modeled_mechanisms:
  - target: Impaired Mitochondrial Translation Elongation Fidelity
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Deleting mtEF4 in the mouse produces exactly the fidelity defect this node
      models — mitochondrial translation runs faster and yields unstable
      proteins — giving the node a mammalian in vivo measurement.
    limitations: >-
      A complete knockout models null activity, whereas the human allele is a
      missense variant whose activity is altered rather than abolished, so the
      severity is not matched. The direction of the rate change is also opposite
      to that seen in cold-stressed yeast, so this model fixes the fidelity claim
      but not a direction of translational rate change.
    evidence:
    - reference: PMID:27065197
      reference_title: Mammalian elongation factor 4 regulates mitochondrial translation essential for spermatogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Deletion of mtEF4 accelerated mitochondrial translation at the cost of producing unstable proteins."
      explanation: >-
        Supports treating the knockout mouse as informative for the
        translation-fidelity node.
  - target: Neuronal Energy Failure and Epileptic Encephalopathy
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The mouse knockout does not reproduce the human neurological endpoint. The
      reported consequence of mtEF4 ablation is testis-specific oxidative
      phosphorylation dysfunction causing male infertility; somatic tissues,
      which include the brain, compensate by upregulating mTOR-driven cytoplasmic
      translation to match the accelerated mitochondrial rate.
    limitations: >-
      This is a reported absence of a neurological phenotype in a study designed
      around fertility, not a dedicated neurological or EEG assessment, so it is
      weaker than a deliberate negative finding. The compensation mechanism was
      characterised in somatic tissue generally rather than in neurons
      specifically, and mouse and human may differ in the developmental window
      over which such compensation is available.
    evidence:
    - reference: PMID:27065197
      reference_title: Mammalian elongation factor 4 regulates mitochondrial translation essential for spermatogenesis.
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "Here we report that genetic ablation of mitochondrial EF4 (mtEF4) in mice causes testis-specific dysfunction in oxidative phosphorylation, leading to male infertility."
      explanation: >-
        The phenotype of mtEF4 ablation in the mouse is testis-specific and does
        not include the encephalopathy this node models, which refutes the mouse
        as a model of the human neurological endpoint.
    - reference: PMID:27065197
      reference_title: Mammalian elongation factor 4 regulates mitochondrial translation essential for spermatogenesis.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Somatic tissues overcame this defect by activating mechanistic (mammalian) target of rapamycin (mTOR), thereby increasing rates of cytoplasmic translation to match rates of mitochondrial translation."
      explanation: >-
        Gives the mechanism by which somatic tissues escape the defect, which is
        the proposed explanation for why the mouse spares the nervous system.
experimental_models:
- name: Yeast guf1-null complementation assay
  description: >-
    Saccharomyces cerevisiae lacking GUF1 has cold- and heat-sensitive growth
    defects on non-fermentable carbon sources and defective cytochrome oxidase
    assembly. Complementing that strain with human GUF1 alleles grades their
    function, and this is the assay that supplied the only functional evidence for
    the patient variant.
  experimental_model_type: OTHER
  organism:
    preferred_term: Saccharomyces cerevisiae
    term:
      id: NCBITaxon:4932
      label: Saccharomyces cerevisiae
  publication: PMID:26486472
  modeled_mechanisms:
  - target: Impaired Mitochondrial Translation Elongation Fidelity
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      The complementation assay reads out how well a given GUF1 allele supports
      mitochondrial protein synthesis under the suboptimal conditions in which
      the factor is required, which is the functional grading behind the
      pathogenicity claim.
    limitations: >-
      A yeast growth readout is several steps removed from a human neuronal
      phenotype, and the reported effect is a modification of activity under
      suboptimal conditions rather than a clear-cut loss, so the assay
      establishes that the variant is functionally consequential without
      quantifying how consequential it is for human brain development.
    evidence:
    - reference: PMID:26486472
      reference_title: West syndrome caused by homozygous variant in the evolutionary conserved gene encoding the mitochondrial elongation factor GUF1.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Yeast complementation assays show that the activity of GUF1(A609S) is modified in suboptimal environments."
      explanation: >-
        The assay result grading the patient allele, which is the measurement
        this model contributes.
  evidence:
  - reference: PMID:18442968
    reference_title: The membrane-bound GTPase Guf1 promotes mitochondrial protein synthesis under suboptimal conditions.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Mutants lacking Guf1 show cold- and heat-sensitive growth defects on non-fermentable carbon sources that are especially pronounced under nutrient-limiting conditions."
    explanation: >-
      Characterises the yeast null phenotype that makes the complementation
      readout interpretable.
- name: mtef4-null Caenorhabditis elegans
  description: >-
    Deleting the C. elegans mtEF4 ortholog produces mitochondrial dysfunction,
    growth delay and reduced brood size at normal temperature, and at low
    temperature reduces mitochondrial translation and disrupts complex
    IV-containing respiratory chain supercomplexes. It is the model that connects
    the translation defect to respiratory chain assembly in a whole metazoan.
  experimental_model_type: OTHER
  organism:
    preferred_term: Caenorhabditis elegans
    term:
      id: NCBITaxon:6239
      label: Caenorhabditis elegans
  publication: PMID:24837196
  modeled_mechanisms:
  - target: Defective Respiratory Chain Complex Assembly
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Loss of mtEF4 in the worm disrupts assembly of respiratory chain
      supercomplexes containing complex IV, the assembly failure this node
      models.
    limitations: >-
      The supercomplex disruption is observed at 15°C rather than at the animal's
      optimal temperature, so it is a cold-stress phenotype and may overstate what
      happens at mammalian body temperature. C. elegans has no nervous system
      comparable to the developing human cortex, so the model speaks to the
      assembly node only and not to the neurological consequence.
    evidence:
    - reference: PMID:24837196
      reference_title: Mitochondrial EF4 links respiratory dysfunction and cytoplasmic translation in Caenorhabditis elegans.
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "At low temperature (15°C), mtef4 deletion reduces mitochondrial translation and disrupts the assembly of respiratory chain supercomplexes containing complex IV."
      explanation: >-
        Supports treating the worm deletion as informative for the respiratory
        chain assembly node.
  evidence:
  - reference: PMID:24837196
    reference_title: Mitochondrial EF4 links respiratory dysfunction and cytoplasmic translation in Caenorhabditis elegans.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "At worms' optimum growing temperature (20°C), mtef4 deletion leads to self-brood size reduction, growth delay and mitochondrial dysfunction."
    explanation: >-
      Establishes that the deletion causes mitochondrial dysfunction in this
      organism even without cold stress.
discussions:
- discussion_id: gap_human_neuronal_bioenergetics
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    Do DEE40 patients actually have a measurable respiratory chain or
    bioenergetic deficit, and is it present in neural tissue?
  attaches_to:
  - "pathophysiology#Defective Respiratory Chain Complex Assembly"
  - "pathophysiology#Neuronal Energy Failure and Epileptic Encephalopathy"
  rationale: >-
    Every respiratory chain observation supporting this entry comes from yeast,
    worm, or cultured human cancer cells. No muscle or fibroblast respiratory
    chain enzymology, lactate, or oxidative phosphorylation measurement has been
    published for a GUF1 patient, and the discovering authors present the link to
    West syndrome as a suggestion. Until such a measurement exists, the central
    effector node of this entry is supported only by cross-species inference,
    which is also why no conformance to a mitochondrial mechanism module is
    declared (see notes).
  proposed_experiments:
  - experiment_id: exp_guf1_patient_respiratory_chain
    name: Respiratory chain assessment in GUF1 patient-derived cells
    description: >-
      Measure respiratory chain complex activities, assembly by blue-native
      electrophoresis, and mitochondrial translation rates in fibroblasts or
      iPSC-derived neurons from a GUF1 p.(Ala609Ser) homozygote against controls,
      to establish whether the assembly defect seen in model systems is present
      in patient cells and whether it is neuron-selective.
  evidence:
  - reference: PMID:26486472
    reference_title: West syndrome caused by homozygous variant in the evolutionary conserved gene encoding the mitochondrial elongation factor GUF1.
    supports: SUPPORT
    directness: INDIRECT
    evidence_source: HUMAN_CLINICAL
    snippet: "We suggest a new link between improper assembly of respiratory chain complexes and WS."
    explanation: >-
      The authors' own framing of the mechanism as a suggestion is what this gap
      records. Classified INDIRECT because it evidences the state of the argument
      rather than a measurement.
- discussion_id: gap_mouse_spares_nervous_system
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why does mtEF4 knockout in the mouse produce testis-restricted disease while
    the human variant produces an epileptic encephalopathy with no reported
    fertility phenotype?
  attaches_to:
  - "pathophysiology#Neuronal Energy Failure and Epileptic Encephalopathy"
  - "animal_models#mtEF4 knockout mouse"
  rationale: >-
    This is a mismatch rather than an absence of evidence: the mouse knockout was
    made and characterised, and its phenotype is male infertility from
    testis-specific oxidative phosphorylation failure, with somatic tissues
    compensating through mTOR-driven cytoplasmic translation. The organ affected
    in the mouse is not the organ affected in the reported human family. Either
    the developing human brain cannot mount the somatic compensation that mouse
    somatic tissues can, or the human missense allele acts differently from a
    null, or the mouse neurological phenotype was simply not looked for. The
    distinction matters because the mouse is currently the only mammalian in vivo
    system available for this gene, and reading it as a model of DEE40 would
    misstate what has been shown.
  proposed_experiments:
  - experiment_id: exp_neuro_phenotyping_mtef4_mouse
    name: Neurological phenotyping of mtEF4-deficient mice
    description: >-
      Perform EEG, seizure-susceptibility and developmental assessment in
      constitutive and neuron-specific mtEF4 knockout mice, and measure mTOR
      pathway activity and cytoplasmic translation rates in brain, to test
      whether the nervous system is genuinely spared or merely unexamined, and
      whether neuronal compensation differs from that in other somatic tissues.
  - experiment_id: exp_knockin_a609s_mouse
    name: Knock-in of the patient allele
    description: >-
      Generate a mouse carrying the orthologous p.(Ala609Ser) substitution rather
      than a null allele, to test whether the human missense variant produces a
      neurological phenotype that complete ablation does not.
  evidence:
  - reference: PMID:27065197
    reference_title: Mammalian elongation factor 4 regulates mitochondrial translation essential for spermatogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Here we report that genetic ablation of mitochondrial EF4 (mtEF4) in mice causes testis-specific dysfunction in oxidative phosphorylation, leading to male infertility."
    explanation: >-
      Documents the tissue specificity of the mouse phenotype, which is the
      mismatch with the human presentation that this discussion records.
notes: >-
  Scale of the evidence. This entry is deliberately shallow because the
  literature is. Human evidence for DEE40 consists of one consanguineous family
  with three affected siblings (PMID:26486472) and one further GUF1 patient
  counted in a targeted-panel cohort (PMID:37820178). Everything mechanistic
  comes from yeast, C. elegans, mouse, or cultured human cancer cells. Phenotypes
  are curated only where the cached source supports them: the accessible record
  for the primary paper carries the abstract and reference list but not the case
  narratives, so features that would be expected in an early infantile
  encephalopathy — microcephaly, hypotonia, specific neuroimaging findings — are
  deliberately absent rather than assumed. The three West syndrome triad
  phenotypes are marked directness INDIRECT because they follow from the stated
  syndrome diagnosis rather than from per-patient description.

  Deliberate non-conformances. No conforms_to is declared, and two candidate
  modules were considered and rejected. The mitochondrial_dysfunction module
  scopes itself to the aging hallmark and expects its central effector node to
  carry decreased oxidative phosphorylation and increased reactive oxygen species;
  neither has been measured in a GUF1 patient, and the ROS arm is stated as a
  possibility even in the mtEF4 review (PMID:30693836). The
  complex_iv_assembly_deficiency module models isolated cytochrome c oxidase
  deficiency as a human biochemical diagnosis, and no COX enzymology exists for
  any DEE40 patient; the complex IV signal here is entirely from yeast and worm.
  Declaring either conformance would assert measurements that have not been made
  (see gap_human_neuronal_bioenergetics). This should be revisited if patient
  respiratory chain data are published.

  No antiseizure treatment is curated. Neither human report describes the
  seizure response of a GUF1 patient to any specific drug. The 2023 cohort paper
  discusses antiseizure regimens in two places, and neither licenses a DEE40
  treatment entry. Its Dravet syndrome passage names agents for a different
  patient with a different gene, so attributing those to DEE40 would be
  named-entity confusion. Its West syndrome passage reports that the risk of
  developing Lennox-Gastaut syndrome was lower in patients who received a
  ketogenic diet, prednisone, or ACTH — but that is a cohort-level association
  in mixed-etiology West syndrome, made while recounting a 98-patient follow-up
  study, reported for LGS risk rather than for seizure response, and the paper
  never states that its GUF1 patient was among its four West syndrome patients.
  Curating those agents here would attribute a population-level
  infantile-spasms observation to a four-patient disease that no source
  connects them to. Only genetic counselling is curated, which the recessive
  consanguineous pedigree supports directly.

  Prevalence caveat. The 1:3500 live-birth figure in the primary report is the
  incidence of West syndrome from all causes and is recorded in the prevalence
  notes explicitly as not a DEE40 rate.

name: Developmental And Epileptic Encephalopathy 40
creation_date: "2026-09-05T19:12:28Z"
description: >-
  DEE40 (EIEE40; OMIM 617065) is an autosomal recessive developmental and
  epileptic encephalopathy attributed to biallelic variants in GUF1, which
  encodes the nuclear genome-encoded mitochondrial translation elongation factor
  EF-4 (mtEF4), the eukaryotic homolog of bacterial LepA. The mechanism runs
  through mitochondrial protein synthesis rather than through an ion channel:
  mtEF4 is a fidelity factor that remobilizes stalled mitoribosomes and
  transiently inhibits elongation, and its disruption compromises assembly of
  the respiratory chain complexes whose core subunits are made inside the
  mitochondrion. The single reported family presented with isolated West
  syndrome — infantile spasms with hypsarrhythmia and developmental regression.
  The evidence base is deliberately small: one consanguineous family with three
  affected siblings (2016), a single additional GUF1 patient in a targeted
  gene-panel cohort (2023), and functional work in yeast, worm, and mouse rather
  than in human neural tissue. The final step from respiratory chain assembly
  failure to the epilepsy is proposed by the discovering authors and has not
  been measured in patients.
category: Mendelian
parents:
- Genetic Developmental and Epileptic Encephalopathy
synonyms:
- DEE40
- EIEE40
- early infantile epileptic encephalopathy 40
- epileptic encephalopathy, early infantile, 40
- GUF1 early infantile epileptic encephalopathy
- early infantile epileptic encephalopathy caused by mutation in GUF1
disease_term:
  preferred_term: developmental and epileptic encephalopathy, 40
  term:
    id: MONDO:0014895
    label: developmental and epileptic encephalopathy, 40
inheritance:
- name: Autosomal recessive inheritance
  description: >-
    The reported family was consanguineous, and the three affected siblings were
    homozygous for the same GUF1 missense variant (c.1825G>T, p.(Ala609Ser)).
    Only one family has been reported with segregation data, so the recessive
    mode rests on that single pedigree together with Orphanet's gene-disease
    assertion.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:26486472
    reference_title: West syndrome caused by homozygous variant in the evolutionary conserved gene encoding the mitochondrial elongation factor GUF1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we exome-sequenced the members of a consanguineous family affected with isolated WS. We identified a homozygous variant (c.1825G>T/p.(Ala609Ser)) in the GUF1 gene in the three affected siblings."
    explanation: >-
      Homozygosity for one variant in three affected siblings of a consanguineous
      family is the segregation pattern that establishes recessive inheritance
      here.
pathophysiology:
- name: Biallelic GUF1 Variants
  biological_scale: MOLECULAR
  role: trigger
  description: >-
    The initiating lesion is a homozygous GUF1 missense variant. In the reported
    family the allele is c.1825G>T, p.(Ala609Ser), which substitutes an alanine
    conserved across all eukaryotic organisms and positioned within the
    tRNA-binding moiety of the protein. Note that the functional consequence is
    reported as a modification of activity under suboptimal conditions rather
    than as a clean null, so this node is deliberately not labelled a loss of
    function.
  genes:
  - preferred_term: GUF1
    term:
      id: hgnc:25799
      label: GUF1
  evidence:
  - reference: PMID:26486472
    reference_title: West syndrome caused by homozygous variant in the evolutionary conserved gene encoding the mitochondrial elongation factor GUF1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The variant identified in the WS family changes an alanine residue conserved in all eukaryotic organisms and positioned within the tRNA-binding moiety of this nuclear genome-encoded mitochondrial translational elongation factor."
    explanation: >-
      Locates the disease allele within the tRNA-binding region of mtEF4 and
      establishes the residue's conservation, the basis for treating it as the
      initiating lesion.
  downstream:
  - target: Impaired Mitochondrial Translation Elongation Fidelity
    causal_link_type: DIRECT
    description: >-
      The variant alters mtEF4 activity in the conditions under which the factor
      is required, as measured by yeast complementation.
    evidence:
    - reference: PMID:26486472
      reference_title: West syndrome caused by homozygous variant in the evolutionary conserved gene encoding the mitochondrial elongation factor GUF1.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Yeast complementation assays show that the activity of GUF1(A609S) is modified in suboptimal environments."
      explanation: >-
        The functional assay linking the patient allele to altered elongation
        factor activity, which is the next node.
- name: Impaired Mitochondrial Translation Elongation Fidelity
  biological_scale: MOLECULAR
  description: >-
    GUF1/mtEF4 is a quality-control factor of mitochondrial protein synthesis
    rather than a core elongation engine: it binds mitoribosomes in a
    GTP-dependent manner, remobilizes stalled ribosomes, and transiently inhibits
    elongation so that synthesis remains accurate. No modifier is asserted on the
    elongation process below because the reported direction is
    condition-dependent — yeast lacking Guf1 show diminished synthesis rates at
    low temperature, whereas mouse mtEF4 deletion accelerates mitochondrial
    translation at the cost of producing unstable proteins. What is consistent
    across systems is the loss of fidelity, not a single direction of rate
    change.
  biological_processes:
  - preferred_term: mitochondrial translational elongation
    term:
      id: GO:0070125
      label: mitochondrial translational elongation
  molecular_functions:
  - preferred_term: GTPase activity
    term:
      id: GO:0003924
      label: GTPase activity
  evidence:
  - reference: PMID:26486472
    reference_title: West syndrome caused by homozygous variant in the evolutionary conserved gene encoding the mitochondrial elongation factor GUF1.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "GUF1 encodes a protein essential in conditions that counteract faithful protein synthesis: it is able to remobilize stuck ribosomes and transiently inhibit the elongation process to optimize protein synthesis."
    explanation: >-
      States the molecular role of the gene product that this node models.
      Evidence source is OTHER because the sentence is background molecular
      biology synthesised from model-system work, not a clinical observation
      made in this study.
  - reference: PMID:18442968
    reference_title: The membrane-bound GTPase Guf1 promotes mitochondrial protein synthesis under suboptimal conditions.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "The observed defects in Guf1-deficient mitochondria are consistent with a function of Guf1 as a fidelity factor of mitochondrial protein synthesis."
    explanation: >-
      Establishes the fidelity-factor role in the yeast ortholog, the conserved
      function whose disruption this node describes.
  - reference: PMID:18442968
    reference_title: The membrane-bound GTPase Guf1 promotes mitochondrial protein synthesis under suboptimal conditions.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "It binds to mitochondrial ribosomes in a GTP-dependent manner."
    explanation: >-
      Supports the GTPase and ribosome-engagement molecular function annotated on
      this node.
  - reference: PMID:27065197
    reference_title: Mammalian elongation factor 4 regulates mitochondrial translation essential for spermatogenesis.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Deletion of mtEF4 accelerated mitochondrial translation at the cost of producing unstable proteins."
    explanation: >-
      The mammalian in vivo result, and the reason this node asserts a fidelity
      defect without asserting a direction of rate change: here loss of mtEF4
      speeds translation up rather than slowing it.
  downstream:
  - target: Defective Respiratory Chain Complex Assembly
    causal_link_type: DIRECT
    description: >-
      Because the mitochondrially translated polypeptides are the core subunits
      of the respiratory chain complexes, infidelity in their synthesis yields
      products that cannot be assembled into functional complexes.
    evidence:
    - reference: PMID:18442968
      reference_title: The membrane-bound GTPase Guf1 promotes mitochondrial protein synthesis under suboptimal conditions.
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "At elevated temperatures, Guf1-deficient mutants exhibit defects in the assembly of cytochrome oxidase, suggesting that the polypeptides produced are not functional."
      explanation: >-
        Directly connects the translation-fidelity defect to failed cytochrome
        oxidase assembly, which is the causal step this edge asserts.
- name: Defective Respiratory Chain Complex Assembly
  biological_scale: CELLULAR
  role: central_effector
  description: >-
    Loss of mtEF4 function impairs biogenesis of the oxidative phosphorylation
    complexes, with complex IV the most consistently affected across model
    systems: cytochrome oxidase assembly fails in Guf1-deficient yeast at
    restrictive temperature, respiratory chain supercomplexes containing complex
    IV are disrupted in mtef4-null C. elegans at low temperature, and knockout of
    mtEF4 in human cells induces respiratory chain complex defects and apoptosis.
    This node is the mechanistic pivot the discovering authors proposed for the
    epilepsy, and it is supported entirely by non-human or non-neural systems —
    no respiratory chain measurement has been reported in a DEE40 patient.
  biological_processes:
  - preferred_term: mitochondrial respiratory chain complex assembly
    term:
      id: GO:0033108
      label: mitochondrial respiratory chain complex assembly
    modifier: DECREASED
  evidence:
  - reference: PMID:24837196
    reference_title: Mitochondrial EF4 links respiratory dysfunction and cytoplasmic translation in Caenorhabditis elegans.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "At low temperature (15°C), mtef4 deletion reduces mitochondrial translation and disrupts the assembly of respiratory chain supercomplexes containing complex IV."
    explanation: >-
      A whole-organism metazoan result tying mtEF4 loss to disrupted complex IV
      supercomplex assembly.
  - reference: PMID:29572227
    reference_title: Human Elongation Factor 4 Regulates Cancer Bioenergetics by Acting as a Mitochondrial Translation Switch.
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Knockout of mtEF4 induced respiratory chain complex defects and apoptosis, while its overexpression stimulated cancer development."
    explanation: >-
      Shows the same consequence for the human protein in cultured cells. Cited
      only for the respiratory chain phenotype of mtEF4 loss; the tumour biology
      that is this paper's subject is not relevant to DEE40.
  - reference: PMID:30693836
    reference_title: Mitochondrial translation factor EF4 regulates oxidative phosphorylation complexes and the production of ROS.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "We will discuss the influence of mtEF4 on the electron transport chain, especially at respiratory chain complex IV, which could result in cytochrome c peroxidase formation, electron leakage from electron transport chain and ROS increase."
    explanation: >-
      A review summarising the complex IV focus of the mtEF4 respiratory
      phenotype and the proposed ROS consequence. Evidence source is OTHER
      because this is a review, and the ROS arm is stated as a possibility
      ("could result in"), so it is not asserted as a node here.
  downstream:
  - target: Neuronal Energy Failure and Epileptic Encephalopathy
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The step from respiratory chain assembly failure to infantile spasms is the
      link the discovering authors proposed, by analogy with the broader
      association between respiratory chain defects and infantile epilepsy. The
      intervening events in developing human neurons have not been demonstrated.
    evidence:
    - reference: PMID:26486472
      reference_title: West syndrome caused by homozygous variant in the evolutionary conserved gene encoding the mitochondrial elongation factor GUF1.
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "We suggest a new link between improper assembly of respiratory chain complexes and WS."
      explanation: >-
        Classified INDIRECT because the authors offer this as a suggested link
        rather than a demonstrated mechanism; no patient respiratory chain or
        neuronal measurement is reported.
- name: Neuronal Energy Failure and Epileptic Encephalopathy
  biological_scale: ORGANISM
  role: consequence
  description: >-
    The clinical endpoint is an early-infantile developmental and epileptic
    encephalopathy presenting as West syndrome. The energy-failure framing is
    inherited from the general association between respiratory chain disorders
    and infantile epilepsy rather than from any measurement in GUF1 patients,
    which is why this node carries no biological process annotation asserting a
    bioenergetic deficit in human neural tissue.
  evidence:
  - reference: PMID:26486472
    reference_title: West syndrome caused by homozygous variant in the evolutionary conserved gene encoding the mitochondrial elongation factor GUF1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "To get better insights on the genetic of this pathology, we exome-sequenced the members of a consanguineous family affected with isolated WS."
    explanation: >-
      Establishes that the affected siblings' clinical endpoint was isolated West
      syndrome, the phenotype this consequence node represents.

genetic:
- name: GUF1
  gene_term:
    preferred_term: GUF1
    term:
      id: hgnc:25799
      label: GUF1
  association: Pathogenic Variants
  relationship_type: CAUSATIVE
  notes: >-
    GUF1 (GTP binding elongation factor GUF1) is the only gene implicated in
    DEE40 (MONDO:0014895; OMIM 617065). The single reported segregating allele is
    the homozygous missense c.1825G>T, p.(Ala609Ser), found in three affected
    siblings of one consanguineous family by exome sequencing. A second,
    unspecified GUF1 variant was reported in one patient of a 198-patient
    targeted-panel cohort. The gene-disease relationship therefore rests on a
    single multiplex pedigree plus a supportive functional assay, and Orphanet
    lists GUF1 among the disease-causing genes for infantile epileptic spasms
    syndrome. External gene-disease validity curation reflects the same thin
    base: Genomics England PanelApp lists GUF1 at AMBER (confidence level 2) on
    its early onset or syndromic epilepsy panel, and at RED (level 1) on its
    mitochondrial disorders panel (PanelApp API, checked 2026-09-06; recorded as
    prose because PanelApp is not a snippet-citable structured source in this
    repository). No functional_impact_category is asserted: the yeast assay
    reports that the variant's activity is "modified in suboptimal environments"
    rather than abolished, which does not license a loss-of-function call.
  evidence:
  - reference: PMID:26486472
    reference_title: West syndrome caused by homozygous variant in the evolutionary conserved gene encoding the mitochondrial elongation factor GUF1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a homozygous variant (c.1825G>T/p.(Ala609Ser)) in the GUF1 gene in the three affected siblings."
    explanation: >-
      The variant-level gene-disease observation on which the entry rests.
  - reference: ORPHA:697160
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "GUF1 | GTP binding elongation factor GUF1 | hgnc:25799 | Disease-causing germline mutation(s) in"
    explanation: >-
      Orphanet's curated gene-disease assertion for GUF1, corroborating the
      causative relationship recorded here.
  - reference: PMID:37820178
    reference_title: Importance of targeted next-generation sequencing in pediatric patients with developmental epileptic encephalopathy.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "An identifiable underlying genetic cause was identified in 48 (25%) out of 198 patients."
    explanation: >-
      Establishes the diagnostic-yield context of the panel cohort in which one
      further GUF1 patient was identified.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    DEE40 is ultra-rare and has no estimated population prevalence. The reported
    literature amounts to three affected siblings in one consanguineous family
    (2016) and one further patient carrying a GUF1 variant in a 198-patient
    targeted next-generation sequencing cohort (2023) — four patients in total by
    that count, which is a dated lower bound rather than a current total. The
    1:3500 figure quoted in the primary report is the birth incidence of West
    syndrome from all causes, not of GUF1-related disease, and must not be read
    as a DEE40 rate.
  evidence:
  - reference: PMID:26486472
    reference_title: West syndrome caused by homozygous variant in the evolutionary conserved gene encoding the mitochondrial elongation factor GUF1.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified a homozygous variant (c.1825G>T/p.(Ala609Ser)) in the GUF1 gene in the three affected siblings."
    explanation: >-
      The three-sibling count from the index family, kept as a literature case
      count rather than converted to a population rate.

    explanation: The first large exome study to implicate FLT4 describes the mutations as dominant.
- name: Incomplete penetrance
  description: >-
    Many heterozygous carriers, including transmitting parents, have no heart
    defect or only a subclinical one.
  inheritance_term:
    preferred_term: Typified by incomplete penetrance
    term:
      id: HP:0003829
      label: Typified by incomplete penetrance
  evidence:
  - reference: PMID:28991257
    reference_title: "Contribution of rare inherited and de novo variants in 2,871 congenital heart disease probands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, only 4 of 10 FLT4 mutation carriers reported CHD, indicating incomplete penetrance."
    explanation: Among relatives of FLT4 probands who carried the familial variant, fewer than half had congenital heart disease.
  - reference: PMID:39870876
    reference_title: "RNA-sequencing unveils FLT4 splice site variants in variable congenital heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "our study establishes FLT4 splice site variants as a molecular cause of both left and right-sided isolated CHD, with incomplete penetrance"
    explanation: Two families segregating FLT4 splice variants show incomplete penetrance.
  - reference: PMID:32037394
    reference_title: "The Cardiac Genome Clinic: implementing genome sequencing in pediatric heart disease."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "six were inherited from parents with no or subclinical heart phenotypes (FLT4, DNAH9, MYH11, NEXMIF, NIPBL, PTPN11)"
    explanation: The causative FLT4 variant in this cohort was inherited from a parent without an overt heart phenotype.
pathophysiology:
- name: FLT4 Heterozygous Loss of Function
  description: >-
    Heterozygous germline FLT4 variants, most of them predicted loss of
    function (nonsense, frameshift, canonical and near-canonical splice-site
    variants, and an 8-kb deletion), reduce the dose of functional VEGFR3. FLT4
    is highly intolerant of loss-of-function variation in population databases,
    consistent with haploinsufficiency. ClinGen split this disease from Milroy
    disease partly on mechanism, loss of function here against the dominant
    negative kinase-dead alleles of Milroy disease.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: FLT4
    term:
      id: hgnc:3767
      label: FLT4
  genetic_context:
    variant_origin: GERMLINE
    zygosity: HETEROZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
  evidence:
  - reference: PMID:30232381
    reference_title: "Haploinsufficiency of vascular endothelial growth factor related signaling genes is associated with tetralogy of Fallot."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified nine (5.1%) probands with novel FLT4 variants: seven loss-of-function, including an 8-kb deletion, and two predicted damaging."
    explanation: Most FLT4 variants in an adult tetralogy cohort were loss of function, including a deletion.
  - reference: PMID:28991257
    reference_title: "Contribution of rare inherited and de novo variants in 2,871 congenital heart disease probands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "FLT4 was highly intolerant to LoF variation in ExAC (pLI = 1) and only one LoF allele was identified among 3,578 parental controls."
    explanation: Population constraint against FLT4 loss of function, consistent with a haploinsufficiency mechanism.
  - reference: CGGV:assertion_03e5cbf0-2888-4416-bb0f-85909fc297ce-2023-03-08T170000.000Z
    reference_title: "FLT4 / congenital heart defects, multiple types, 7 (Definitive)"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: "a large case-control study reporting statistically significant enrichment of heterozygous loss-of-function variants in individuals with ToF compared to ethnically matched individuals without ToF"
    explanation: ClinGen summarizes the case-control enrichment of heterozygous loss-of-function FLT4 variants in tetralogy of Fallot.
  downstream:
  - target: Dysregulated VEGF Receptor 3 Signaling in Cardiac Development
    description: >-
      Loss of one functional FLT4 allele is proposed to impair VEGFR3
      signaling during heart development.
    evidence:
    - reference: PMID:30232381
      reference_title: "Haploinsufficiency of vascular endothelial growth factor related signaling genes is associated with tetralogy of Fallot."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: HUMAN_CLINICAL
      snippet: "The findings support dysregulated VEGF signaling as a novel mechanism contributing to the pathogenesis of TOF."
      explanation: The authors infer dysregulated VEGF signaling from the loss-of-function variant burden; the signaling defect itself was not measured.
- name: Perinuclear ER Aggregation of Missense FLT4 Protein
  description: >-
    Missense FLT4 variants found in patients with tetralogy of Fallot, expressed
    in primary human endothelial cells, cause the receptor to aggregate in the
    perinuclear endoplasmic reticulum and activate proteostatic and metabolic
    signaling. Milroy disease variants and wild-type FLT4 do not. The variant
    cells show altered expression in developmental signaling pathways, and
    inhibiting proteostatic signaling abrogates these effects. This is a
    mechanism for the missense subset of alleles, distinct from the dominant
    negative mechanism of Milroy alleles.
  biological_scale: CELLULAR
  genes:
  - preferred_term: FLT4
    term:
      id: hgnc:3767
      label: FLT4
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  cellular_components:
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  biological_processes:
  - preferred_term: response to endoplasmic reticulum stress
    term:
      id: GO:0034976
      label: response to endoplasmic reticulum stress
    modifier: INCREASED
  evidence:
  - reference: PMID:38713105
    reference_title: "FLT4 causes developmental disorders of the cardiovascular and lymphovascular systems via pleiotropic molecular mechanisms."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "FLT4 variants identified in patients with TOF, when expressed in primary human endothelial cells, cause aggregation of FLT4 protein in the perinuclear endoplasmic reticulum, activating proteostatic and metabolic signalling, whereas lymphoedema-associated FLT4 variants and wild-type (WT) FLT4 do not."
    explanation: Direct cellular demonstration of ER aggregation and proteostatic signaling for tetralogy-associated FLT4 variants.
  - reference: PMID:38713105
    reference_title: "FLT4 causes developmental disorders of the cardiovascular and lymphovascular systems via pleiotropic molecular mechanisms."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Inhibition of proteostatic signalling abrogates these effects, identifying potential avenues for therapeutic intervention."
    explanation: Blocking proteostatic signaling reverses the cellular effects, linking them to the stress response.
  downstream:
  - target: Dysregulated VEGF Receptor 3 Signaling in Cardiac Development
    description: >-
      Tetralogy-associated variant cells show characteristic changes in
      developmental signaling pathways that differ from the lymphatic role of
      FLT4.
    evidence:
    - reference: PMID:38713105
      reference_title: "FLT4 causes developmental disorders of the cardiovascular and lymphovascular systems via pleiotropic molecular mechanisms."
      supports: SUPPORT
      directness: INDIRECT
      evidence_source: IN_VITRO
      snippet: "FLT4 TOF variants display characteristic gene expression profiles in key developmental signalling pathways, revealing a role for FLT4 in cardiogenesis distinct from its role in lymphatic development."
      explanation: Gene expression in variant-expressing endothelial cells points to altered developmental signaling; the in vivo signaling state was not measured.
- name: Dysregulated VEGF Receptor 3 Signaling in Cardiac Development
  description: >-
    Reduced or abnormal VEGFR3 signaling in the developing heart, the proposed
    common step between FLT4 variants and abnormal cardiac morphogenesis.
    VEGFR3 has a role in early cardiac development separate from its
    established role in lymphatic development.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: VEGFR3 signaling pathway
    term:
      id: GO:0036325
      label: vascular endothelial growth factor receptor-3 signaling pathway
    modifier: DYSREGULATED
  evidence:
  - reference: PMID:33067626
    reference_title: "The physiological and pathological functions of VEGFR3 in cardiac and lymphatic development and related diseases."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "FLT4 variants, distinct to those observed in Milroy disease cases, predispose individuals to Tetralogy of Fallot, the most common cyanotic congenital heart disease, demonstrating a novel function for VEGFR3 in early cardiac development"
    explanation: Review stating that FLT4 variants in tetralogy point to a cardiac developmental function of VEGFR3.
  downstream:
  - target: Abnormal Embryonic Heart Morphogenesis
- name: Abnormal Embryonic Heart Morphogenesis
  description: >-
    Abnormal formation of the embryonic heart. In zebrafish, depletion of flt4
    reduces heart size and alters heart looping; wild-type human FLT4 mRNA
    rescues this, while mRNA carrying tetralogy-associated variants rescues it
    incompletely or not at all. In patients the result is a conotruncal or
    outflow-tract defect, most often tetralogy of Fallot.
  biological_scale: TISSUE
  locations:
  - preferred_term: heart
    term:
      id: UBERON:0000948
      label: heart
  biological_processes:
  - preferred_term: heart morphogenesis
    term:
      id: GO:0003007
      label: heart morphogenesis
    modifier: ABNORMAL
  - preferred_term: heart looping
    term:
      id: GO:0001947
      label: heart looping
    modifier: ABNORMAL
  evidence:
  - reference: PMID:38713105
    reference_title: "FLT4 causes developmental disorders of the cardiovascular and lymphovascular systems via pleiotropic molecular mechanisms."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Depletion of flt4 in zebrafish caused cardiac phenotypes of reduced heart size and altered heart looping."
    explanation: Loss of flt4 in a vertebrate embryo disrupts heart morphogenesis.
  - reference: PMID:38713105
    reference_title: "FLT4 causes developmental disorders of the cardiovascular and lymphovascular systems via pleiotropic molecular mechanisms."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "These phenotypes were rescued with coinjection of WT human FLT4 mRNA, but incompletely or not at all by mRNA harbouring FLT4 TOF variants."
    explanation: Tetralogy-associated variants fail to restore heart development, showing they are functionally deficient in vivo.
  downstream:

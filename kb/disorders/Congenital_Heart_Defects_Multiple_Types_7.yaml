      label: Autosomal dominant inheritance
  evidence:
  - reference: CGGV:assertion_03e5cbf0-2888-4416-bb0f-85909fc297ce-2023-03-08T170000.000Z
    reference_title: "FLT4 / congenital heart defects, multiple types, 7 (Definitive)"
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "FLT4 | HGNC:3767 | congenital heart defects, multiple types, 7 | MONDO:0032913 | AD | Definitive"
    explanation: ClinGen classifies the FLT4 relationship to this disease with an autosomal dominant mode of inheritance.
  - reference: PMID:28991257
    reference_title: "Contribution of rare inherited and de novo variants in 2,871 congenital heart disease probands."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL

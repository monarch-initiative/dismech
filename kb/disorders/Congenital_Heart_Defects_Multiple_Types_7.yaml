      reference_title: "FLT4 causes developmental disorders of the cardiovascular and lymphovascular systems via pleiotropic molecular mechanisms."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "FLT4 variants identified in patients with TOF, when expressed in primary human endothelial cells, cause aggregation of FLT4 protein in the perinuclear endoplasmic reticulum"
      explanation: The system in which the aggregation mechanism was shown.

name: Congenital Heart Defects, Multiple Types, 7
creation_date: "2026-11-05T00:49:26Z"
category: Mendelian
synonyms:
- CHTD7
description: >-
  Autosomal dominant, incompletely penetrant predisposition to structural
  congenital heart disease caused by heterozygous germline variants in FLT4,
  which encodes vascular endothelial growth factor receptor 3 (VEGFR3). The
  usual lesion is tetralogy of Fallot, often with pulmonary atresia, and the
  reported spectrum also includes left-sided lesions such as aortic
  coarctation. Most reported variants are loss of function (nonsense,
  frameshift, splice-site and an 8-kb deletion), and carriers usually have no
  extracardiac malformations. Many carrier parents and relatives have no heart
  defect. The disease is allelic with, and distinct from, Milroy disease
  (lymphatic malformation 1), in which different FLT4 variants act by a
  dominant negative mechanism on the receptor kinase and cause congenital
  lymphedema. In primary human endothelial cells, missense variants found in
  tetralogy of Fallot cause the receptor to aggregate in the perinuclear
  endoplasmic reticulum, which Milroy variants do not. Management is that of
  the cardiac lesion.
parents:
- Tetralogy of Fallot
- Congenital heart disease
notes: >-
  Scope. This entry covers the FLT4-defined disease (OMIM:618780). Tetralogy of
  Fallot in general, with its other genetic and non-genetic causes, is the
  separate Tetralogy_of_Fallot entry, which lists FLT4 among its contributing
  genes. Pathophysiology here is limited to what is shown for FLT4; the
  anatomical mechanism of the tetralogy itself and its post-repair course are
  curated in that entry. ClinGen split this disease from lymphatic malformation 1
  (Milroy disease, OMIM:153100, MONDO:0007919) on differences in mechanism and
  phenotype. One FLT4 carrier with tetralogy, pulmonary atresia and major
  aortopulmonary collateral arteries is tabulated with mild congenital
  lymphedema in PMID:32037394, so a lymphatic feature in an occasional carrier is
  not excluded; ClinGen records that no curated individual had lymphedema.
  Environmental risk factors for congenital heart disease in general (maternal
  diabetes, folate status) were not curated, because no study has tested them in
  FLT4 carriers. No GeneReviews chapter covers this disease. The only FLT4 hit,
  GeneReviews "Milroy Disease" (PMID:20301417), is the allelic lymphatic disease
  and was not used as a phenotype baseline (just check-genereviews --online).

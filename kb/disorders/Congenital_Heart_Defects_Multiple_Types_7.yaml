treatments:
- name: Surgical repair of tetralogy of Fallot
  description: >-
    Management is that of the cardiac lesion; no FLT4-directed therapy exists.
    For tetralogy of Fallot, repair closes the ventricular septal defect and
    relieves right ventricular outflow obstruction. The supporting figure comes
    from tetralogy of Fallot in general, not from FLT4 carriers.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Surgical Procedure
    term:
      id: NCIT:C15329
      label: Surgical Procedure
  target_mechanisms:
  - target: Tetralogy of Fallot
    treatment_effect: BYPASSES
    description: Surgical repair corrects the structural lesion without acting on its genetic cause.
  evidence:
  - reference: PMID:42258347
    reference_title: "Survivors of Cyanotic Congenital Heart Disease: A Review."
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: "Ninety percent of patients with TOF survive more than 30 years after surgery to close the ventricular septal defect and repair the right ventricular outflow tract."
    explanation: Long-term survival after tetralogy repair, from tetralogy of Fallot in general.
animal_models:
- name: flt4 zebrafish depletion with human FLT4 mRNA rescue
  species: Zebrafish
  genotype: flt4 depletion, with coinjection of wild-type or TOF-variant human FLT4 mRNA
  publication: PMID:38713105
  description: >-
    Embryonic depletion of flt4 in zebrafish, rescued by wild-type but not by
    tetralogy-variant human FLT4 mRNA.
  modeled_mechanisms:
  - target: Abnormal Embryonic Heart Morphogenesis
    relationship: PARTIALLY_RECAPITULATES
    fidelity: LOW
    model_scale: TISSUE
    description: >-
      Depletion produces reduced heart size and altered heart looping, and
      tetralogy-associated variants fail to rescue it.
    limitations: >-
      The zebrafish heart has a single ventricle and no septated outflow tract,
      so tetralogy of Fallot itself cannot form; the model reports early heart
      size and looping only.
    evidence:
    - reference: PMID:38713105
      reference_title: "FLT4 causes developmental disorders of the cardiovascular and lymphovascular systems via pleiotropic molecular mechanisms."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Depletion of flt4 in zebrafish caused cardiac phenotypes of reduced heart size and altered heart looping."
      explanation: Supports the model as informative for the heart morphogenesis node.
- name: Flt4 heterozygous and knockout mouse
  species: Mouse
  genotype: Flt4 (Vegfr3) heterozygous and homozygous knockout
  description: >-
    Homozygous knockout mice die in utero with defective vasculature
    formation; heterozygous mice are normal.
  modeled_mechanisms:
  - target: Abnormal Embryonic Heart Morphogenesis
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Heterozygous mice, the genotype matching patients, have no reported
      phenotype; the homozygous knockout is embryonic lethal with a vascular
      defect.
    limitations: >-
      The human disease is heterozygous, but heterozygous mice are normal, and
      the lethal homozygous phenotype is a vascular defect rather than a
      specific outflow-tract malformation.
    evidence:
    - reference: CGGV:assertion_03e5cbf0-2888-4416-bb0f-85909fc297ce-2023-03-08T170000.000Z
      reference_title: "FLT4 / congenital heart defects, multiple types, 7 (Definitive)"
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: "heterozygous mice models are phenotypically and embryonically normal"
      explanation: ClinGen summary that heterozygous mice do not reproduce the human disease.
    - reference: CGGV:assertion_03e5cbf0-2888-4416-bb0f-85909fc297ce-2023-03-08T170000.000Z
      reference_title: "FLT4 / congenital heart defects, multiple types, 7 (Definitive)"
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      quote_role: REVIEW_SYNTHESIS
      snippet: "knockout mice lacking the intact FLT4 gene demonstrating a defect in the vasculature formation that is not compatible with life"
      explanation: ClinGen summary of the lethal homozygous knockout phenotype.
experimental_models:
- name: Primary human endothelial cells expressing TOF-associated FLT4 variants
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: Homo sapiens
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: endothelial cell
    term:
      id: CL:0000115
      label: endothelial cell
  publication: PMID:38713105
  description: >-
    Primary human endothelial cells expressing tetralogy-associated,
    Milroy-associated or wild-type FLT4.
  modeled_mechanisms:
  - target: Perinuclear ER Aggregation of Missense FLT4 Protein
    relationship: MEASURES
    fidelity: MODERATE
    model_scale: CELLULAR
    description: >-
      Shows perinuclear ER aggregation and proteostatic signaling for
      tetralogy variants, absent for Milroy variants and wild type.
    limitations: >-
      Variants are expressed exogenously in endothelial cells rather than in
      patient cells at endogenous dosage, and the cells are not the embryonic
      cardiac lineages in which the defect arises.
    evidence:

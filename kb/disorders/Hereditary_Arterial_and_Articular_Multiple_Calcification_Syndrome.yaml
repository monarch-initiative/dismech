  - target: Arthralgia
    description: >-
      Progressive periarticular calcification produces severe joint pain.
  - target: Joint deformity
    description: >-
      Progressive periarticular calcification produces joint deformity.
  - target: Arterial tortuosity
    description: >-
      CD73-deficient vascular remodeling includes tortuosity alongside
      calcification.
  - target: Arteriomegaly and ectasia of lower-limb arteries
    description: >-
      CD73-deficient vascular remodeling includes diffuse aneurysmal
      enlargement (arteriomegaly) of femoral and popliteal arteries.

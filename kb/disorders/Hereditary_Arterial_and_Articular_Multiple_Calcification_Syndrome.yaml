    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As each smaller nidus of calcification enlarges, differentiating cell types appear, including osteoblast-like cells inside of vacuolar spaces in the calcium-containing regions.
    explanation: This supports osteoblast-like cellular differentiation inside calcified vascular lesions.
diagnosis:
- name: Genetic testing for NT5E variants
  description: >-
    Molecular diagnosis is made by identifying pathogenic biallelic NT5E
    variants in the setting of characteristic arterial and periarticular
    calcification.
  evidence:
  - reference: DOI:10.1007/s42399-023-01485-1
    reference_title: "Calcification of Joints and Arteries (CALJA) Is a Rare Cause of Arthritis and Lower Limb Ischemia: Case Report and Literature Review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The results of the NT5E gene analysis were positive for an inactivating variant, leading to the diagnosis of CALJA.
    explanation: This case supports NT5E testing as diagnostic.
- name: CT and radiographic vascular-articular calcification pattern
  description: >-
    Imaging shows dense lower-extremity arterial calcification and periarticular
    soft-tissue calcification, often with relative sparing of the aorta or
    coronary arteries.
  evidence:
  - reference: DOI:10.3941/jrcr.v17i12.5175
    reference_title: "Imaging findings of arterial calcification due to deficiency of CD73: A case study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Review of previous CT studies of the abdomen and lower extremities showed severe ectasia and arterial calcification in the femoral and popliteal arteries bilaterally, but no calcifications in the aorta and common iliac arteries.
    explanation: This supports the distinctive lower-extremity vascular imaging pattern.
- name: Normal serum mineral and parathyroid laboratory values
  description: >-
    Serum calcium, phosphate, vitamin D and parathyroid hormone are typically
    normal despite extensive calcification, which helps distinguish CD73
    deficiency from calcification secondary to disordered mineral metabolism or
    hyperparathyroidism.
  evidence:
  - reference: PMID:21288095
    reference_title: NT5E mutations and arterial calcifications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Serum calcium, phosphate, and vitamin D levels were normal.
    explanation: Normal serum calcium, phosphate and vitamin D in the nine original patients.
  - reference: PMID:21371928
    reference_title: "Vascular pathology of medial arterial calcifications in NT5E deficiency: implications for the role of adenosine in pseudoxanthoma elasticum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Laboratory studies, including serum cholesterol, parathyroid hormone, and vitamin D, were normal (Table 1).
    explanation: Normal parathyroid hormone in a molecularly confirmed patient.
  - reference: DOI:10.1007/s42399-023-01485-1
    reference_title: "Calcification of Joints and Arteries (CALJA) Is a Rare Cause of Arthritis and Lower Limb Ischemia: Case Report and Literature Review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In CALJA, laboratory findings are typically normal
    explanation: The literature review states that laboratory findings are typically normal.
differential_diagnoses:
- name: Arterial calcification of infancy
  disease_term:
    preferred_term: arterial calcification of infancy
    term:
      id: MONDO:0018870
      label: arterial calcification of infancy
  description: >-
    Generalized arterial calcification of infancy (GACI) due to ENPP1 deficiency
    is a purinergic/pyrophosphate-pathway arterial calcification disorder in the
    differential diagnosis of CD73 deficiency.
  distinguishing_features:
  - Caused by biallelic ENPP1 deficiency reducing extracellular pyrophosphate generation rather than NT5E/CD73 ecto-5'-nucleotidase deficiency.
  - Presents in infancy with generalized arterial calcification, whereas CD73 deficiency begins in adolescence or adulthood, progresses slowly, and typically spares the aorta, coronary arteries and vasculature above the diaphragm.
  evidence:
  - reference: PMID:21288095
    reference_title: NT5E mutations and arterial calcifications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      chest radiography revealed no vascular calcifications above the diaphragm
    explanation: Supports sparing of vasculature above the diaphragm in CD73 deficiency, in contrast to generalized arterial calcification in GACI.
  - reference: DOI:10.3941/jrcr.v17i12.5175
    reference_title: "Imaging findings of arterial calcification due to deficiency of CD73: A case study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Review of previous CT studies of the abdomen and lower extremities showed severe ectasia and arterial calcification in the femoral and popliteal arteries bilaterally, but no calcifications in the aorta and common iliac arteries.
    explanation: Supports aortic sparing with lower-extremity-restricted calcification in CD73 deficiency.
  - reference: PMID:21371928
    reference_title: "Vascular pathology of medial arterial calcifications in NT5E deficiency: implications for the role of adenosine in pseudoxanthoma elasticum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      This autosomal recessive disorder due to biallelic mutations in ENPP1 (Fig. 7) presents with calcification of large and medium-sized arteries and results in arterial stenosis, myocardial ischemia, and death in early childhood [20].
    explanation: Distinguishes ENPP1-related GACI by early-childhood fatal generalized arterial calcification versus adolescent/adult-onset CD73 deficiency.
- name: Inherited pseudoxanthoma elasticum
  disease_term:
    preferred_term: inherited pseudoxanthoma elasticum
    term:
      id: MONDO:0100091
      label: inherited pseudoxanthoma elasticum
  description: >-
    Pseudoxanthoma elasticum (PXE) due to biallelic ABCC6 variants causes
    ectopic arterial mineralization and claudication that overlap clinically
    with CD73 deficiency.
  distinguishing_features:
  - Caused by biallelic ABCC6 mutations rather than NT5E mutations.
  - Distinguished by dermal and ocular involvement, whereas CD73 deficiency is characterized by hand and foot joint-capsule calcification.
  evidence:
  - reference: PMID:33925341
    reference_title: "ABCC6, Pyrophosphate and Ectopic Calcification: Therapeutic Solutions."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Pseudoxanthoma elasticum (PXE), a multi-organ disease affecting dermal, ocular, and cardiovascular tissues, is a model for ectopic mineralization disorders.
    explanation: Supports the dermal and ocular involvement that distinguishes PXE.
  - reference: PMID:27562569
    reference_title: "Arterial calcification due to CD73 deficiency (ACDC): imaging manifestations of ectopic mineralization."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ACDC is characterized by progressive and painful arterial calcifications primarily affecting the lower extremities, as well as calcifications affecting small joint capsules of the hands and feet.
    explanation: Supports small-joint capsular calcification as the CD73-deficiency side of the contrast.
  - reference: PMID:21371928
    reference_title: "Vascular pathology of medial arterial calcifications in NT5E deficiency: implications for the role of adenosine in pseudoxanthoma elasticum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Classical PXE is caused by deficiency of ABCC6, a C type ABC transporter whose ligand is unknown.
    explanation: Contrasts ABCC6-related classical pseudoxanthoma elasticum with NT5E/CD73 deficiency among hereditary disorders of ectopic arterial calcification.
treatments:
- name: Etidronate
  description: >-
    Etidronate has pilot human evidence for safety and possible slowing of
    lower-extremity vascular calcification progression, but it has not reversed
    established vascular or periarticular calcification.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: etidronate
      term:
        id: CHEBI:4907
        label: etidronic acid
  target_mechanisms:
  - target: Ectopic arterial and periarticular calcification
    treatment_effect: INHIBITS
    description: Etidronate is a bisphosphonate intended to slow ectopic mineral deposition.
  evidence:
  - reference: DOI:10.1177/1358863X241235669
    reference_title: Pilot study to evaluate the safety and effectiveness of etidronate treatment for arterial calcification due to deficiency of CD73 (ACDC)
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Etidronate treatment appeared to have slowed the progression of further vascular calcification in lower extremities as measured by CT but did not have an effect in reversing vascular and/or periarticular joint calcifications in our small ACDC cohort.
    explanation: This pilot study supports etidronate as a partially effective disease-modifying treatment.
- name: Symptomatic vascular and joint management
  description: >-
    Patients may require antiplatelet or vascular management for ischemic
    symptoms and anti-inflammatory or analgesic treatment for joint symptoms,
    but no standard curative therapy is established.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: DOI:10.3941/jrcr.v17i12.5175
    reference_title: "Imaging findings of arterial calcification due to deficiency of CD73: A case study"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The patient was enrolled in an NIH trial of bisphosphonates and dual-antiplatelet therapy with stabilization of symptoms.
    explanation: This case supports symptomatic medical vascular management alongside bisphosphonate trial participation.
- name: Colchicine for inflammatory joint symptoms
  description: >-
    Colchicine has case-report evidence for improving inflammatory symptoms and
    inflammatory markers in CALJA/HAAMC, but it is not established as
    disease-modifying therapy for calcification.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: colchicine
      term:
        id: CHEBI:23359
        label: colchicine
  target_phenotypes:
  - preferred_term: Arthralgia
    term:
      id: HP:0002829
      label: Arthralgia
  evidence:
  - reference: DOI:10.1007/s42399-023-01485-1
    reference_title: "Calcification of Joints and Arteries (CALJA) Is a Rare Cause of Arthritis and Lower Limb Ischemia: Case Report and Literature Review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Our case is the first in which clinical symptoms and a steady increase of inflammatory markers improved only after colchicine therapy initiation.
    explanation: This supports colchicine as symptom-directed therapy in a single CALJA case rather than established disease-modifying treatment.

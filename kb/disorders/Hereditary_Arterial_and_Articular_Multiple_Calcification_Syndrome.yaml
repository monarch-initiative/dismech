    reference_title: "Calcification of Joints and Arteries (CALJA) Is a Rare Cause of Arthritis and Lower Limb Ischemia: Case Report and Literature Review"
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      To the best of our knowledge, 23 patients (6 males and 17 females) with a confirmed NT5E mutation have been reported since 2011
    explanation: Updates the published case count to 23 genetically confirmed patients as of 2023.
  - reference: PMID:21288095
    reference_title: NT5E mutations and arterial calcifications.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We identified nine persons with calcifications of the lower-extremity arteries and hand and foot joint capsules: all five siblings in one family, three siblings in another, and one patient in a third family.
    explanation: Documents the initial cohort of nine affected individuals across three families.
  - reference: PMID:21371928
    reference_title: "Vascular pathology of medial arterial calcifications in NT5E deficiency: implications for the role of adenosine in pseudoxanthoma elasticum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Three families with autosomal recessive CD73 deficiency have been described, with homozygous nonsense, homozygous missense, and compound heterozygous mutations, respectively [3].
    explanation: Confirms the ultra-rare family count in early clinical descriptions of CD73 deficiency.
progression:
- phase: Onset
  age_range: Adolescence to adulthood (14-44 years)
  notes: >-
    Symptomatic lower-extremity claudication and periarticular calcification
    typically begin in the teenage years or adulthood, distinguishing the
    condition from infantile arterial calcification syndromes.
  evidence:
  - reference: PMID:21371928
    reference_title: "Vascular pathology of medial arterial calcifications in NT5E deficiency: implications for the role of adenosine in pseudoxanthoma elasticum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      A 44-year old woman first noted calf pain on exercise at 14 years of age.
    explanation: Documents adolescent-onset lower-extremity ischemic symptoms in CD73 deficiency.
  - reference: PMID:21371928
    reference_title: "Vascular pathology of medial arterial calcifications in NT5E deficiency: implications for the role of adenosine in pseudoxanthoma elasticum."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      By 43 years of age, the pain had progressed to definitive lower limb claudication after very brief exercise or a 100-meter walk.
    explanation: Establishes slow clinical progression from adolescent exercise-induced calf pain to adult lower-limb claudication.
pathophysiology:
- name: NT5E/CD73 loss impairs extracellular adenosine generation
  description: >-
    Biallelic NT5E variants produce nonfunctional CD73, reducing conversion of
    extracellular AMP to adenosine and disrupting an anti-calcification pathway
    in vascular and periarticular tissues.

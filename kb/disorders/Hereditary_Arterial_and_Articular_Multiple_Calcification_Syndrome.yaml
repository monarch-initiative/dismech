  notes: >-
    Ultra-rare disorder; initial molecular descriptions identified nine affected
    individuals across three families with biallelic NT5E variants. A 2023
    literature review counted 23 patients (6 males, 17 females) with a confirmed
    NT5E mutation reported since 2011.

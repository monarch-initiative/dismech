genetic:
- name: SORD
  gene_term:
    preferred_term: SORD
    term:
      id: hgnc:11184
      label: SORD
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE
  presence: PRESENT
  association: >-
    SORD (15q26.1) encodes the 357-residue cytosolic NAD+-dependent sorbitol
    dehydrogenase. Biallelic loss-of-function is necessary and sufficient for
    disease. Molecular diagnosis is complicated by SORD2P, a highly homologous
    non-functional pseudogene in which the recurrent c.757delG position is fixed
    on most control chromosomes, so short-read data mismap and biallelic status
    is hard to phase; long-read sequencing resolves both problems, and a
    recurrent SORD/SORD2P inversion is only detectable that way.
  inheritance:
  - name: Autosomal recessive
    inheritance_term:
      preferred_term: Autosomal recessive inheritance
      term:
        id: HP:0000007
        label: Autosomal recessive inheritance
    evidence:
    - reference: PMID:32367058
      reference_title: "Biallelic mutations in SORD cause a common and potentially treatable hereditary neuropathy with implications for diabetes."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "We identified 45 individuals from 38 families across multiple ancestries carrying the nonsense c.757delG (p.Ala253GlnfsTer27) variant in SORD, in either a homozygous or compound heterozygous state."
      explanation: >-
        Biallelic requirement across unrelated families establishes recessive
        transmission at the gene level.
  evidence:
  - reference: PMID:32367058
    reference_title: "Biallelic mutations in SORD cause a common and potentially treatable hereditary neuropathy with implications for diabetes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SORD has a non-functional highly homologous paralogue, the pseudogene SORD2P, which is thought to have arisen from the duplication of SORD within a 0.5 Mb region on chromosome 15"
    explanation: >-
      Describes the pseudogene that makes standard molecular diagnosis
      unreliable.
  - reference: PMID:35224818
    reference_title: "Long read sequencing overcomes challenges in the diagnosis of SORD neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequent Oxford Nanopore Tech (ONT) long-read sequencing was used to successfully differentiate SORD from the highly homologous non-functional SORD2P pseudogene and confirmed that the mutations were biallelic through haplotype-resolved analysis."
    explanation: >-
      Demonstrates the technical solution to the pseudogene and phasing
      problems.
  - reference: PMID:41282915
    reference_title: "Gene-Pseudogene Inversions as a Hidden Source of Missing Heritability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified novel and recurrent inversions between SORD and its pseudogene SORD2P in 13 out of 151 patients (9%) affected by SORD-related Charcot-Marie-Tooth (CMT) neuropathy, including 6 out of 8 (75%) of SORD-CMT cases where only one pathogenic variant was identified on short read sequencing, making it the third most common pathogenic allele causing SORD-CMT."
    explanation: >-
      Establishes gene-pseudogene inversion as a third recurrent allele class
      and explains apparently monoallelic cases.
  case_fractions:
  - population: German neuromuscular centre cohort of 166 patients with genetically unexplained axonal neuropathy
    case_fraction_percent: 3.0
    cohort_size: 166
    notes: >-
      Yield of SORD screening among unsolved predominantly axonal CMT/dHMN
      cases, not a share of a SORD-diagnosed cohort.
    evidence:
    - reference: PMID:38975976
      reference_title: "SORDD: mutation frequency and phenotype in predominantly axonal Charcot-Marie-Tooth disease of undefined genetic cause."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Five patients of the total cohort of 166 patients harbored pathogenic variants in SORD (3%)."
      explanation: >-
        Direct count and percentage from a single-centre screening study.
  - population: Chinese hereditary neuropathy cohort, undiagnosed subset
    case_fraction_percent: 6.4
    cohort_size: 78
    notes: >-
      Five of 78 patients remaining undiagnosed after PMP22 duplication and
      panel testing carried biallelic SORD variants.
    evidence:
    - reference: PMID:34819907
      reference_title: "Clinical and Genetic Features of Biallelic Mutations in SORD in a Series of Chinese Patients With Charcot-Marie-Tooth and Distal Hereditary Motor Neuropathy."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "SORD mutation was identified in five out of 78 undiagnosed patients."
      explanation: >-
        Screening yield in an East Asian cohort, showing the allele is not
        restricted to European ancestry.
  notes: >-
    The discovery paper's abstract numbers the recurrent frameshift c.757delG
    while its main text writes c.753delG; an author correction was published

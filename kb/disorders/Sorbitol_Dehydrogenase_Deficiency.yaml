mechanistic_hypotheses:
- hypothesis_group_id: osmotic_myelin_injury_model
  hypothesis_label: Osmotic injury to Schwann cells and myelin
  status: CANONICAL
  description: >-
    Sorbitol is a polar polyol that crosses membranes poorly, so trapping it
    raises intracellular osmolarity and draws water in. On this model the
    primary target is the myelinating Schwann cell, and the observable signature
    is the enlarged "ballooned" myelin sheath that the Sord-null rat shows around
    otherwise intact axons, with axonal degeneration following secondarily. It is
    marked CANONICAL as the leading proposal in the mammalian literature - it is
    the only candidate with a matching structural lesion, and the same
    abnormality appears in galactosemic neuropathy, another polyol disorder -
    but leading is not the same as established: no study has measured water
    content or osmolyte composition in SORD-deficient nerve.
- hypothesis_group_id: mitochondrial_oxidative_model
  hypothesis_label: Bioenergetic failure and oxidative stress
  status: ALTERNATIVE
  description: >-
    Sorbitol accumulation is followed by falling ATP production and rising
    reactive oxygen species, and axons - the longest and most energy-hungry
    compartment - fail first. This is the best-evidenced arm in the sense of
    having direct measurements behind it, but the measurements are in Drosophila
    brain and muscle and in human skeletal muscle proteomics, neither of which is
    peripheral nerve, and none of them shows the deficit causing axonal loss.
- hypothesis_group_id: redox_cofactor_imbalance_model
  hypothesis_label: NADPH and NAD+ cofactor imbalance
  status: EMERGING
  description: >-
    Flux through the polyol pathway consumes NADPH at the aldose reductase step
    and regenerates NAD+ at the SORD step. Losing SORD leaves the reductive step
    running without its oxidative partner, depleting NADPH - and with it the
    glutathione-based antioxidant capacity - while NAD+ is not regenerated. This
    is a well-developed idea in the diabetic-neuropathy literature, but in SORD
    deficiency it is named as a plausible candidate rather than measured, which
    is why it is EMERGING and carries no node of its own.
  evidence:
  - reference: PMID:32367058
    reference_title: "Biallelic mutations in SORD cause a common and potentially treatable hereditary neuropathy with implications for diabetes."
    supports: PARTIAL
    evidence_source: OTHER
    snippet: "one or more of the known effects of decreased SORD activity, including increased sorbitol level, cellular osmolarity, oxidative stress and decreased NADPH levels, are plausible"
    explanation: >-
      The discovery authors list cofactor depletion among the candidate routes.
      PARTIAL because it is named as plausible, not demonstrated.
pathophysiology:
- name: Biallelic SORD Loss-of-Function Variants
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    Two loss-of-function SORD alleles. The recurrent frameshift c.757delG
    (p.Ala253GlnfsTer27) dominates the allele spectrum worldwide and is found
    homozygously in most patients; c.458C>A (p.Ala153Asp) is the commonest second
    allele. A third allele class - inversion between SORD and its highly
    homologous pseudogene SORD2P - is invisible to short-read sequencing and
    accounts for a further tranche of cases. Missense alleles act by
    destabilising the enzyme rather than by any dominant-negative or neomorphic
    route: c.404A>G produces insoluble SORD aggregates in vitro, and a splice
    allele c.908+1G>C disrupts the transcript.
  genetic_context:
    gene:
      preferred_term: SORD
      term:
        id: hgnc:11184
        label: SORD
    allele_type: frameshift, missense, splice-site, and gene-pseudogene inversion
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Homozygous in most patients and compound heterozygous in the remainder;
      all characterised alleles converge on absent or non-functional enzyme.
  genes:
  - preferred_term: SORD
    term:
      id: hgnc:11184
      label: SORD
  evidence:
  - reference: PMID:32367058
    reference_title: "Biallelic mutations in SORD cause a common and potentially treatable hereditary neuropathy with implications for diabetes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 45 individuals from 38 families across multiple ancestries carrying the nonsense c.757delG (p.Ala253GlnfsTer27) variant in SORD, in either a homozygous or compound heterozygous state."
    explanation: >-
      The discovery cohort establishing c.757delG as the dominant recurrent
      allele across ancestries.
  - reference: PMID:33397963
    reference_title: "Biallelic SORD pathogenic variants cause Chinese patients with distal hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro cell functional studies showed that c.404 A > G variant resulted in aggregate formation of SORD and low protein solubility, confirming the pathogenicity of SORD variants."
    explanation: >-
      Functional demonstration that a missense allele destroys the enzyme by
      destabilising it, supporting a loss-of-function rather than
      dominant-negative reading.
  downstream:
  - target: Loss of Sorbitol Dehydrogenase Activity
    causal_link_type: DIRECT
    description: >-
      Absent or unstable protein leaves the cell with no functional sorbitol
      dehydrogenase.
    evidence:
    - reference: PMID:32367058
      reference_title: "Biallelic mutations in SORD cause a common and potentially treatable hereditary neuropathy with implications for diabetes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In patient-derived fibroblasts, we found a complete loss of SORD protein and increased intracellular sorbitol."
      explanation: >-
        Cells carrying the biallelic genotype have no enzyme protein, which is
        the step this edge asserts.
- name: Loss of Sorbitol Dehydrogenase Activity
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Sorbitol dehydrogenase (EC 1.1.1.14), the NAD+-dependent second enzyme of the
    polyol pathway, is absent from patient cells. Protein is undetectable by
    western blot in fibroblasts homozygous for c.757delG, and red-cell enzyme
    activity is significantly reduced against run controls - a difference large
    enough that a screening assay has been built on it. The 30% figure quoted in
    the biochemical record is that assay's proposed cutoff, not a measured
    residual activity of the disease.
  molecular_functions:

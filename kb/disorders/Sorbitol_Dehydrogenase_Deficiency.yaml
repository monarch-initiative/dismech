clinical_trials:
- name: NCT05397665
  phase: PHASE_III
  status: COMPLETED
  description: >-
    INSPIRE, a randomised, double-blind, placebo-controlled study of the aldose
    reductase inhibitor govorestat (AT-007) in SORD deficiency, registered as a
    two-part phase 2/3 study with 56 participants and treatment for up to 24
    months. Recorded here as PHASE_III because the schema has no combined
    phase 2/3 value.

    The two evidence items below disagree about status, and the disagreement is
    chronological rather than a conflict: the ClinicalTrials.gov record now
    reports the study as completed (actual completion 2026-06-01, status
    verified 2026-06), while the 2025 cohort paper cited beside it described the
    study as ongoing when it was written. `status: COMPLETED` is taken from the
    registry record, checked directly against the ClinicalTrials.gov API during
    curation; the cached reference file carries only the trial's title and
    design summary, so it cannot be quoted for the status.

    No peer-reviewed publication of the trial's results was found at the time of
    curation, and none of its outcomes are curated here.

    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Sixteen carried a homozygous c.757delG (p.Ala253Glnfs*27) variant, and 11 carried compound heterozygous variants"
    explanation: >-
      Shows the allele dominating a 30-patient European cohort in both
      homozygous and compound heterozygous form.
  - reference: PMID:39938083
    reference_title: "Genotype and phenotype spectrum of Charcot-Marie-Tooth disease due to mutations in SORD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We confirmed c.757delG (p.Ala253GlnfsTer27) as the most common pathogenic allele, followed by c.458C>A (p.Ala153Asp), while other variants were identified, mostly in single cases."
    explanation: >-

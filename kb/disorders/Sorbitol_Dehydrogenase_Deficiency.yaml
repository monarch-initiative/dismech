    term:
      id: CHEBI:17924
      label: D-glucitol
    modifier: INCREASED
  evidence:
  - reference: PMID:32367058
    reference_title: "Biallelic mutations in SORD cause a common and potentially treatable hereditary neuropathy with implications for diabetes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "SORD is an enzyme that converts sorbitol into fructose in the two-step polyol pathway previously implicated in diabetic neuropathy."
    explanation: >-
      States the enzymatic step whose loss produces the block.
  - reference: PMID:32367058
    reference_title: "Biallelic mutations in SORD cause a common and potentially treatable hereditary neuropathy with implications for diabetes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "intracellular sorbitol concentrations were over 10 times higher in patient fibroblasts compared to controls"
    explanation: >-
      Quantifies the intracellular accumulation in human patient cells.
  - reference: PMID:38538210
    reference_title: "SORD-deficient rats develop a motor-predominant peripheral neuropathy unveiling novel pathophysiological insights."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Sord-/- rats had remarkably increased levels of sorbitol in serum, CSF and peripheral nerve."
    explanation: >-
      Shows the accumulation reaches the peripheral nerve compartment, which

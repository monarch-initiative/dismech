biochemical:
- name: Elevated Fasting Serum Sorbitol
  biomarker_term:
    preferred_term: sorbitol
    term:
      id: CHEBI:17924
      label: D-glucitol
  presence: INCREASED
  frequency: OBLIGATE
  context: >-
    The defining biochemical abnormality and the practical diagnostic test.
    Fasting serum sorbitol is roughly two orders of magnitude above control and
    separates patients from both controls and heterozygous carriers, which makes
    it usable for adjudicating variants of uncertain significance as well as for
    case finding.
  evidence:
  - reference: PMID:32367058
    reference_title: "Biallelic mutations in SORD cause a common and potentially treatable hereditary neuropathy with implications for diabetes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we next tested the fasting sorbitol level in serum from ten patients carrying the homozygous p.Ala253GlnfsTer27 mutation and ten unrelated controls and found it was over 100 times higher"
    explanation: >-
      Quantifies the elevation against matched controls.
  - reference: PMID:39938083
    reference_title: "Genotype and phenotype spectrum of Charcot-Marie-Tooth disease due to mutations in SORD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fasting serum sorbitol is a reliable biomarker of the condition that can be utilized for pathogenicity assessment of identified rare SORD variants."
    explanation: >-
      Establishes the clinical use of the marker, including for variant
      interpretation.
  notes: >-
    Serum sorbitol also discriminates patients from heterozygous carriers, which
    is what allows it to be used on single-variant cases.

  - target: Polyol Pathway Block with Sorbitol Accumulation
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Aldose reductase inhibitor feeding normalised sorbitol and rescued motor
      and eye phenotypes, which is the pharmacological proof that the metabolite
      and not some other consequence of the genotype drives degeneration.
    limitations: >-
      Rescue was demonstrated in flies and in patient fibroblasts, not in a

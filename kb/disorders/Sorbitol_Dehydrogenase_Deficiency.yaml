- name: Osmotic Stress in Schwann Cells and Myelinated Axons
  biological_scale: CELLULAR
  role: amplifier
  mechanism_confidence: HYPOTHETICAL
  description: >-
    The osmotic candidate for how a trapped metabolite injures nerve. Sorbitol
    crosses membranes poorly, so an unclearable intracellular pool should draw
    water in, and the structural finding that fits is the enlarged "ballooned"
    myelin sheath seen around otherwise intact axons in the Sord-null rat - an
    abnormality also described in galactosemic neuropathy, where a different
    polyol accumulates. The node is HYPOTHETICAL by design: the lesion is
    consistent with osmotic swelling and is the reason this is the leading
    model, but nobody has measured water content, osmolyte composition or
    volume regulation in SORD-deficient nerve, so the inference runs from
    morphology to mechanism rather than the other way round.

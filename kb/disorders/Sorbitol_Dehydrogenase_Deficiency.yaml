    reference_title: "Biallelic mutations in SORD cause a common and potentially treatable hereditary neuropathy with implications for diabetes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SORD protein was absent in all patients and the SORD levels were reduced in unaffected carriers compared to controls"
    explanation: >-
      Direct demonstration of absent enzyme protein in patient-derived cells.
  - reference: PMID:42021567
    reference_title: "Measurement of Red Blood Cell Sorbitol Dehydrogenase Activity for Fast Screening of SORD-Related Neuropathies."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "RBC SORD activity was significantly reduced in individuals diagnosed with SORD deficiency when compared to within-run controls"
    explanation: >-
      Confirms the enzymatic (not merely protein-level) deficit directly in
      patient material.
  downstream:
  - target: Polyol Pathway Block with Sorbitol Accumulation
    causal_link_type: DIRECT
    description: >-
      With the oxidative step gone, sorbitol produced by aldose reductase has no

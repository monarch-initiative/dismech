pathophysiology:
- name: Biallelic SORD Loss-of-Function Variants
  biological_scale: MOLECULAR
  role: trigger
  mechanism_confidence: ESTABLISHED
  description: >-
    Two loss-of-function SORD alleles. The recurrent frameshift c.757delG
    (p.Ala253GlnfsTer27) dominates the allele spectrum worldwide and is found
    homozygously in most patients; c.458C>A (p.Ala153Asp) is the commonest second
    allele. A third allele class - inversion between SORD and its highly
    homologous pseudogene SORD2P - is invisible to short-read sequencing and
    accounts for a further tranche of cases. Missense alleles act by
    destabilising the enzyme rather than by any dominant-negative or neomorphic
    route: c.404A>G produces insoluble SORD aggregates in vitro, and a splice
    allele c.908+1G>C disrupts the transcript.
  genetic_context:
    gene:
      preferred_term: SORD
      term:
        id: hgnc:11184
        label: SORD
    allele_type: frameshift, missense, splice-site, and gene-pseudogene inversion
    variant_origin: GERMLINE
    zygosity: HOMOZYGOUS
    functional_impact_category: LOSS_OF_FUNCTION
    description: >-
      Homozygous in most patients and compound heterozygous in the remainder;
      all characterised alleles converge on absent or non-functional enzyme.
  genes:
  - preferred_term: SORD
    term:
      id: hgnc:11184
      label: SORD
  evidence:
  - reference: PMID:32367058
    reference_title: "Biallelic mutations in SORD cause a common and potentially treatable hereditary neuropathy with implications for diabetes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 45 individuals from 38 families across multiple ancestries carrying the nonsense c.757delG (p.Ala253GlnfsTer27) variant in SORD, in either a homozygous or compound heterozygous state."
    explanation: >-
      The discovery cohort establishing c.757delG as the dominant recurrent
      allele across ancestries.
  - reference: PMID:33397963
    reference_title: "Biallelic SORD pathogenic variants cause Chinese patients with distal hereditary motor neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "In vitro cell functional studies showed that c.404 A > G variant resulted in aggregate formation of SORD and low protein solubility, confirming the pathogenicity of SORD variants."
    explanation: >-
      Functional demonstration that a missense allele destroys the enzyme by
      destabilising it, supporting a loss-of-function rather than
      dominant-negative reading.
  downstream:
  - target: Loss of Sorbitol Dehydrogenase Activity
    causal_link_type: DIRECT
    description: >-
      Absent or unstable protein leaves the cell with no functional sorbitol

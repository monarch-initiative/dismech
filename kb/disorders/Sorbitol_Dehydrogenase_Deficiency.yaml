      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "Reducing the polyol influx by treatment with aldose reductase inhibitors normalized intracellular sorbitol levels in patient-derived fibroblasts and in Drosophila, and also dramatically ameliorated motor and eye phenotypes."
      explanation: >-
        Pharmacological reversal implicates the metabolite itself, rather than
        some other consequence of the genotype, as the cause of degeneration.
        PARTIAL because the intermediate steps remain unidentified and the

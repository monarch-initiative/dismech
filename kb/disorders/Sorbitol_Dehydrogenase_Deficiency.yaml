      explanation: >-
        Cells carrying the biallelic genotype have no enzyme protein, which is
        the step this edge asserts.
- name: Loss of Sorbitol Dehydrogenase Activity
  biological_scale: MOLECULAR
  role: effector
  mechanism_confidence: ESTABLISHED
  description: >-
    Sorbitol dehydrogenase (EC 1.1.1.14), the NAD+-dependent second enzyme of the
    polyol pathway, is absent from patient cells. Protein is undetectable by
    western blot in fibroblasts homozygous for c.757delG, and red-cell enzyme
    activity falls below 30% of control - a difference large enough to be used
    diagnostically.

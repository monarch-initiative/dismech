    description: >-
      On this model the Schwann cell is injured first and axonal degeneration is
      secondary, which is what the rat morphology - swollen sheaths around
      initially intact axons - suggests.
- name: Mitochondrial Dysfunction and Oxidative Stress
  biological_scale: CELLULAR
  role: amplifier
  mechanism_confidence: PROVISIONAL
  description: >-
    Sord-deficient Drosophila show reduced brain ATP production and reactive
    oxygen species accumulation in CNS and muscle, and both are corrected by
    aldose reductase inhibition, which ties them to sorbitol rather than to the

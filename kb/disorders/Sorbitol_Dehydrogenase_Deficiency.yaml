discussions:
- discussion_id: gap_sorbitol_to_axon_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what route does trapped intracellular sorbitol kill long motor axons -
    osmotic stress, oxidative stress, NADPH/NAD+ cofactor imbalance, or some
    combination - and why are motor axons affected while sensory axons are
    largely spared?
  attaches_to:
  - "pathophysiology#Polyol Pathway Block with Sorbitol Accumulation"
  - "pathophysiology#Osmotic Stress in Schwann Cells and Myelinated Axons"
  - "pathophysiology#Mitochondrial Dysfunction and Oxidative Stress"
  - "pathophysiology#Distal Motor Axonal Degeneration and Demyelination"
  rationale: >-
    The genotype-to-metabolite half of the mechanism is settled, and the
    metabolite-to-axon half is not. The candidates are curated as competing
    mechanistic_hypotheses rather than argued in prose here:
    osmotic_myelin_injury_model (CANONICAL), mitochondrial_oxidative_model
    (ALTERNATIVE) and redox_cofactor_imbalance_model (EMERGING), with the first
    two carried on tagged causal edges out of the accumulation node. This
    discussion records what would settle between them. The discovery authors listed osmotic stress,
    oxidative stress and reduced NADPH as plausible and did not choose between
    them, and the govorestat study restated that the mechanisms of
    sorbitol-induced degeneration are not fully elucidated. The gap matters
    therapeutically as well as descriptively: substrate reduction works upstream
    of whichever route is correct, so it can succeed without settling the
    question, but any attempt to protect the axon downstream needs the answer.
    The motor-over-sensory selectivity is a second, related unknown - sorbitol
    accumulates systemically, yet the lesion is selective, and the ballooned
    myelin seen in the rat points at Schwann cells as at least a co-target.
  proposed_experiments:
  - experiment_id: exp_osmotic_vs_oxidative_rat_nerve
    name: Compartment-resolved osmotic versus oxidative dissection in Sord-null rat nerve
    description: >-
      In Sord-/- rat sciatic and tibial nerve, measure Schwann cell and axonal
      water content and organic-osmolyte composition alongside oxidative-damage
      markers and NADPH/NADP+ and NAD+/NADH ratios, at ages before and after the
      onset of conduction slowing, and test whether an antioxidant that does not
      lower sorbitol prevents the lesion. A dissociation between sorbitol
      lowering and antioxidant protection would separate the osmotic and
      oxidative arms.
  - experiment_id: exp_motor_vs_sensory_isogenic_ipsc
    name: Motor versus sensory neuron comparison in isogenic human cultures
    description: >-
      Differentiate isogenic patient and gene-corrected iPSC lines into motor and
      sensory neurons in microfluidic axon-compartment devices, and compare
      sorbitol handling, axonal transport, bioenergetics and axon survival
      between the two lineages under matched glucose. This tests whether the
      selectivity is cell-intrinsic or requires the Schwann cell.
  evidence:
  - reference: PMID:32367058
    reference_title: "Biallelic mutations in SORD cause a common and potentially treatable hereditary neuropathy with implications for diabetes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Our findings do not fully elucidate yet the mechanism of axonal damage caused by SORD deficiency: one or more of the known effects of decreased SORD activity, including increased sorbitol level, cellular osmolarity, oxidative stress and decreased NADPH levels, are plausible"
    explanation: >-
      The discovery authors state the gap and enumerate the candidate routes.
  - reference: PMID:37014713
    reference_title: "Sorbitol reduction via govorestat ameliorates synaptic dysfunction and neurodegeneration in sorbitol dehydrogenase deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The underlying mechanisms of sorbitol-induced degeneration have not been fully elucidated"
    explanation: >-
      Restates the gap three years later, confirming it remains open.
- discussion_id: mismatch_mouse_sord_no_neuropathy
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why does a mouse with markedly reduced SORD protein develop no neuropathy and
    no conduction slowing, when biallelic SORD loss reliably causes neuropathy in
    humans and a motor-predominant neuropathy in the rat?
  attaches_to:
  - "pathophysiology#Distal Motor Axonal Degeneration and Demyelination"
  rationale: >-
    This is a mismatch rather than an absence of evidence: the C57BL/LiA mouse
    has been studied and is negative. The explanation offered - that standard
    mouse chow is low in sugar relative to human and Drosophila diets, so polyol
    flux never reaches the level needed to accumulate toxic sorbitol - is
    attractive because it predicts the disease is flux-dependent rather than
    purely genotype-dependent, and because SORD deficiency does aggravate
    neuropathy in diabetic rodents. It is also untested. The alternative, that
    the hypomorphic allele leaves enough residual enzyme, is not excluded. The
    distinction matters for interpreting every negative rodent result in this
    disease and for whether dietary sugar should be treated as a modifier in
    patients.
  proposed_experiments:
  - experiment_id: exp_high_sugar_diet_hypomorphic_mouse
    name: High-sugar diet and ageing challenge in the hypomorphic mouse
    description: >-
      Maintain C57BL/LiA and control mice on standard versus high-sugar diets to
      old age, with serial motor nerve conduction, nerve histology and nerve
      sorbitol. Emergence of the lesion on the high-sugar arm alone would confirm
      flux dependence; its absence under both would point instead at residual
      enzyme activity or a species difference.
  - experiment_id: exp_null_vs_hypomorph_mouse
    name: Null versus hypomorph comparison
    description: >-
      Phenotype a true Sord-null mouse alongside C57BL/LiA under identical
      husbandry, measuring residual enzyme activity, nerve sorbitol and
      conduction. This separates allele strength from diet as the explanation.
  evidence:
  - reference: PMID:32367058
    reference_title: "Biallelic mutations in SORD cause a common and potentially treatable hereditary neuropathy with implications for diabetes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice that have significantly reduced levels of SORD protein due to an intronic splicing mutation (C57BL/LiA mice), bred and fed according to the standard laboratory conditions, do not develop neuropathy or even slowed nerve conduction velocities"
    explanation: >-
      Establishes the negative mouse result that constitutes the mismatch.
  - reference: PMID:38538210
    reference_title: "SORD-deficient rats develop a motor-predominant peripheral neuropathy unveiling novel pathophysiological insights."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In summary, Sord-/- rats develop a motor-predominant neuropathy that closely resembles the human phenotype."
    explanation: >-
      The contrasting positive rodent result that makes the mouse finding a
      mismatch rather than a rule about rodents.
- discussion_id: interpretation_cmt2_dhmn_split
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    Should SORD deficiency be curated as one disease spanning CMT2 and dHMN, as
    it is here, or split along the clinical labels its patients receive?
  attaches_to:
  - "pathophysiology#Motor-Predominant Hereditary Neuropathy Spanning CMT2 and dHMN"
  rationale: >-
    Cohorts assign the same genotype to different labels in different
    proportions - roughly two-thirds CMT2 in the largest multicentre series,
    but a dHMN majority in the French and Swiss cohort - and a third label,
    intermediate CMT, is used for patients whose conduction velocities fall in
    between. The labels track how much sensory involvement was found and how
    velocities were interpreted, not genotype, mechanism, or the allele carried.
    Splitting would therefore produce entries that differ in ascertainment rather
    than in biology. MONDO indexes the disease under the dHMN branch
    (MONDO:0030055, is_a neuronopathy, distal hereditary motor, autosomal
    recessive), which this entry follows for its disease_term while recording the
    CMT2 presentation as the same disease.
  evidence:
  - reference: PMID:39938083
    reference_title: "Genotype and phenotype spectrum of Charcot-Marie-Tooth disease due to mutations in SORD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two-thirds of cases were diagnosed with CMT2 while one-third had distal hereditary motor neuropathy."
    explanation: >-
      The CMT2-majority split in the largest cohort.
  - reference: PMID:36943151
    reference_title: "SORD-related peripheral neuropathy in a French and Swiss cohort: Clinical features, genetic analyses, and sorbitol dosages."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eighteen had dHMN, nine had CMT2, and three had intermediate CMT."
    explanation: >-
      The opposite split in an independent cohort, which is the argument against
      splitting the entry on these labels.
notes: >-
  Scope and boundary decisions recorded deliberately.

  Relationship to the umbrella entry: MONDO:0030055 is a child of MONDO:0015363,
  which dismech curates separately as Distal Hereditary Motor Neuronopathy,
  Autosomal Recessive - an entry that already carries a SORD block in its
  genetic section. Both are now members of the Distal_Hereditary_Motor_Neuropathies
  grouping, so a child sits beside its own parent there. That is deliberate: the
  umbrella entry covers IGHMBP2, SIGMAR1, PLEKHG5 and RTN2 as well, and splitting
  SORD out is what lets its distinct metabolic mechanism, biochemical markers and
  drug target be modelled. Anyone extending either entry should check the other
  first rather than duplicating.

  No GeneReviews chapter exists for SORD deficiency: PubMed searches for
  "sorbitol dehydrogenase deficiency GeneReviews" and "SORD deficiency
  GeneReviews" both returned zero records at the time of curation, so the
  GeneReviews phenotype baseline step was not applicable and the phenotype set
  is built from the primary cohorts instead.

  Conformance to peripheral_axonal_degeneration is declared on four nodes but
  deliberately not on the module's "Axonal Transport Impairment and
  Mitochondrial Dysfunction" amplifier. That module node bundles impaired axonal
  transport with mitochondrial dysfunction and oxidative stress; this entry has
  evidence for the mitochondrial and oxidative arms only, and none for axonal
  transport in SORD deficiency, so declaring conformance there would assert an
  unevidenced claim.

  The disease is repeatedly framed as a genetic window onto diabetic neuropathy
  because it engages the same polyol pathway. That link is not curated as
  conformance to diabetic_vascular_complications: patients are normoglycaemic,
  the upstream trigger there is chronic hyperglycaemia, and nothing in that
  module's chain is evidenced here.

  Skeletal muscle findings - raised creatine kinase, vacuoles and tubular
  aggregates on biopsy, complex I deficiency on muscle proteomics - are curated
  as a laboratory phenotype and as evidence on the mitochondrial node rather
  than as a separate myopathy arm. The reported muscle changes are described by
  their authors as subclinical and accompanied by a neurogenic pattern, so
  reading them as a primary myopathy would overstate them.

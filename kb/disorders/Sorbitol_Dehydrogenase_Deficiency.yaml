      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Five patients of the total cohort of 166 patients harbored pathogenic variants in SORD (3%)."
      explanation: >-
        Direct count and percentage from a single-centre screening study.

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires biallelic SORD loss-of-function variants - homozygosity for
    the recurrent c.757delG frameshift allele, compound heterozygosity for that
    allele with a second variant, or (increasingly recognised) a SORD/SORD2P
    inversion in trans. Heterozygous carriers have reduced SORD protein but are
    unaffected. Just over half of probands are sporadic with neither a family
    history nor reported consanguinity, but consanguinity is not negligible: 18%
    of the largest cohort had consanguineous parents.
  evidence:
  - reference: PMID:32367058
    reference_title: "Biallelic mutations in SORD cause a common and potentially treatable hereditary neuropathy with implications for diabetes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 45 individuals from 38 families across multiple ancestries carrying the nonsense c.757delG (p.Ala253GlnfsTer27) variant in SORD, in either a homozygous or compound heterozygous state."
    explanation: >-
      Establishes the biallelic (homozygous or compound heterozygous)
      requirement across unrelated families and ancestries.
  - reference: PMID:32367058
    reference_title: "Biallelic mutations in SORD cause a common and potentially treatable hereditary neuropathy with implications for diabetes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SORD protein was absent in all patients and the SORD levels were reduced in unaffected carriers compared to controls"
    explanation: >-
      Shows the gene-dosage basis of recessiveness - carriers retain partial
      protein and are unaffected, while biallelic patients have none.
  - reference: PMID:39938083
    reference_title: "Genotype and phenotype spectrum of Charcot-Marie-Tooth disease due to mutations in SORD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thus, in 79 (55%) individuals the disease was sporadic, without report of family history of neuropathy or consanguinity."
    explanation: >-
      Quantifies the sporadic majority, which is a bare majority rather than the
      overwhelming one a looser phrasing would imply.
  - reference: PMID:39938083
    reference_title: "Genotype and phenotype spectrum of Charcot-Marie-Tooth disease due to mutations in SORD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Forty-seven (33%) patients had a family history of neuropathy and 26 (18%) were born from consanguineous parents, including eight individuals with an additional affected family member."
    explanation: >-
      Gives the consanguinity figure, which is why the entry does not claim that
      consanguinity plays no part.

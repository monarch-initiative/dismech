- name: SORD/SORD2P gene-pseudogene inversion
  description: >-
    A structural rearrangement between SORD and its pseudogene, and the third
    commonest pathogenic allele class. It is curated as a variant in its own
    right rather than left in the diagnostic discussion because it changes what a
    negative result means: short-read sequencing cannot see it, so it is
    concentrated precisely among the cases that look monoallelic and therefore
    unsolved.

animal_models:
- name: Sord knockout Sprague Dawley rat
  species: Rat
  genotype: Sord-/- (CRISPR knockout, Sprague Dawley background)
  background: Sprague Dawley
  publication: PMID:38538210
  description: >-
    The best-characterised mammalian model. Sorbitol is raised in serum, CSF and
    peripheral nerve; motor performance and gait decline from about seven months;
    tibial motor conduction slows; and nerve histology shows degenerating and
    de/remyelinated axons with enlarged "ballooned" myelin sheaths, affecting
    motor axons while largely sparing sensory ones.
  modeled_mechanisms:
  - target: Distal Motor Axonal Degeneration and Demyelination
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Reproduces the motor-over-sensory selectivity of the human lesion at the
      level of nerve pathology and conduction.
    limitations: >-
      Histology was assessed at advanced ages and electrophysiology was not
      followed longitudinally, so the model speaks to the established lesion
      rather than to its earliest steps.
    readouts:
    - name: Tibial motor nerve conduction velocity
      target: Distal Motor Axonal Degeneration and Demyelination
      direction: DECREASED
      interpretation: >-
        Physiological correlate of motor axonal degeneration in the model.
      evidence:
      - reference: PMID:38538210
        reference_title: "SORD-deficient rats develop a motor-predominant peripheral neuropathy unveiling novel pathophysiological insights."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Motor nerve conduction velocities of the tibial nerves were slowed."
        explanation: >-
          Direct measurement of slowed motor conduction.
    - name: Serum neurofilament light chain
      target: Distal Motor Axonal Degeneration and Demyelination
      direction: INCREASED
      interpretation: >-
        Fluid biomarker of ongoing axonal degeneration in the model.
      evidence:
      - reference: PMID:38538210
        reference_title: "SORD-deficient rats develop a motor-predominant peripheral neuropathy unveiling novel pathophysiological insights."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "serum from Sord-/- rats contained significantly increased levels of neurofilament light chain, an established biomarker for axonal degeneration"
        explanation: >-
          Quantitative fluid readout of axonal injury.
    evidence:
    - reference: PMID:38538210
      reference_title: "SORD-deficient rats develop a motor-predominant peripheral neuropathy unveiling novel pathophysiological insights."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In summary, Sord-/- rats develop a motor-predominant neuropathy that closely resembles the human phenotype."
      explanation: >-
        The authors' own assessment of fidelity to the human disease.
  - target: Polyol Pathway Block with Sorbitol Accumulation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Establishes that sorbitol accumulates in the nervous-system compartments
      that patient serum measurements cannot reach.
    limitations: >-
      Rodent sugar handling and laboratory diet differ from the human setting,
      which is the same variable invoked to explain why one mouse model fails.
    readouts:
    - name: Sorbitol concentration in serum, CSF and peripheral nerve
      target: Polyol Pathway Block with Sorbitol Accumulation
      direction: INCREASED
      interpretation: >-
        Compartment-resolved confirmation of the metabolic block.
      evidence:
      - reference: PMID:38538210
        reference_title: "SORD-deficient rats develop a motor-predominant peripheral neuropathy unveiling novel pathophysiological insights."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Sord-/- rats had remarkably increased levels of sorbitol in serum, CSF and peripheral nerve."
        explanation: >-
          Direct measurement across three compartments.
  evidence:
  - reference: PMID:38538210
    reference_title: "SORD-deficient rats develop a motor-predominant peripheral neuropathy unveiling novel pathophysiological insights."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Therefore, we have generated a Sord knockout (KO), Sord-/-, Sprague Dawley rat, to model the human disease and to investigate the pathophysiology underlying SORD deficiency."
    explanation: >-
      Establishes the model, its construction and its intended use.
- name: C57BL/LiA mouse with reduced SORD
  species: Mouse
  genotype: intronic splicing variant reducing SORD protein (C57BL/LiA)
  background: C57BL/LiA
  publication: PMID:32367058
  description: >-
    A mouse strain carrying an intronic splicing variant that substantially
    reduces SORD protein. Under standard husbandry it develops neither neuropathy
    nor slowed nerve conduction - a negative result that the discovery authors
    attribute to the low sugar content of standard mouse chow relative to human
    and Drosophila diets, and therefore to polyol flux rather than to a species
    difference in the mechanism itself.
  modeled_mechanisms:
  - target: Distal Motor Axonal Degeneration and Demyelination
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Reduced SORD protein in this strain does not produce the human lesion, so
      the model cannot be used to test the axonal-degeneration arm.
    limitations: >-
      The allele is hypomorphic rather than null, and the proposed explanation -
      dietary sugar limiting polyol flux - has not been tested by feeding these
      animals a high-sugar diet or by ageing them, so the failure may reflect
      husbandry rather than a real species difference.
    evidence:
    - reference: PMID:32367058
      reference_title: "Biallelic mutations in SORD cause a common and potentially treatable hereditary neuropathy with implications for diabetes."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "Mice that have significantly reduced levels of SORD protein due to an intronic splicing mutation (C57BL/LiA mice), bred and fed according to the standard laboratory conditions, do not develop neuropathy or even slowed nerve conduction velocities"
      explanation: >-
        Explicit negative result: the model does not reproduce the human
        neuropathy.
  evidence:
  - reference: PMID:32367058
    reference_title: "Biallelic mutations in SORD cause a common and potentially treatable hereditary neuropathy with implications for diabetes."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "This is possibly due to a difference in sugar metabolism between human and mouse since standard mouse chow consists of a low-sugar diet compared to humans"
    explanation: >-
      The authors' proposed explanation for the negative result, curated as
      PARTIAL because it is a hypothesis they did not test.
- name: Drosophila Sodh2 loss-of-function
  species: Drosophila melanogaster
  genotype: Sodh2(MB01265) homozygous, and neuronal Sodh1/Sodh2 double knockdown
  publication: PMID:32367058
  description: >-
    Fly models of SORD loss with elevated head sorbitol, age-dependent synaptic
    degeneration in the visual system, and progressive locomotor decline on a
    normal lifespan. They were the system in which aldose reductase inhibition
    was first shown to rescue the phenotype, and later the system used to show
    bioenergetic and oxidative changes.
  modeled_mechanisms:
  - target: Mitochondrial Dysfunction and Oxidative Stress
    relationship: RECAPITULATES
    fidelity: LOW
    description: >-
      Supplies the bioenergetic and oxidative-stress evidence for this node.
    limitations: >-
      An invertebrate without myelin or Schwann cells, so it cannot speak to the
      myelin abnormality that is central to the mammalian lesion; the readouts
      are brain and muscle rather than peripheral nerve.
    readouts:
    - name: Brain ATP production and tissue ROS
      target: Mitochondrial Dysfunction and Oxidative Stress
      direction: ALTERED
      interpretation: >-
        ATP falls and ROS rises, the paired readout used to call mitochondrial
        dysfunction in this model.
      evidence:
      - reference: PMID:37014713
        reference_title: "Sorbitol reduction via govorestat ameliorates synaptic dysfunction and neurodegeneration in sorbitol dehydrogenase deficiency."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "In addition, we found reduced ATP production in the brain and ROS accumulation in the CNS and muscle, indicating mitochondrial dysfunction."
        explanation: >-
          The measurement behind this readout.
    evidence:
    - reference: PMID:32367058
      reference_title: "Biallelic mutations in SORD cause a common and potentially treatable hereditary neuropathy with implications for diabetes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In Drosophila, loss of SORD orthologs caused synaptic degeneration and progressive motor impairment."
      explanation: >-
        Establishes the model as informative for degeneration downstream of
        SORD loss.
  - target: Polyol Pathway Block with Sorbitol Accumulation
    relationship: RESCUES
    fidelity: MODERATE
    description: >-
      Aldose reductase inhibitor feeding normalised sorbitol and rescued motor
      and eye phenotypes, which is the pharmacological proof that the metabolite
      and not some other consequence of the genotype drives degeneration.
    limitations: >-
      Rescue was demonstrated in flies and in patient fibroblasts, not in a
      mammalian nervous system.
    evidence:
    - reference: PMID:32367058
      reference_title: "Biallelic mutations in SORD cause a common and potentially treatable hereditary neuropathy with implications for diabetes."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Reducing the polyol influx by treatment with aldose reductase inhibitors normalized intracellular sorbitol levels in patient-derived fibroblasts and in Drosophila, and also dramatically ameliorated motor and eye phenotypes."
      explanation: >-
        Demonstrates that lowering the metabolite reverses the phenotype.
  evidence:
  - reference: PMID:32367058
    reference_title: "Biallelic mutations in SORD cause a common and potentially treatable hereditary neuropathy with implications for diabetes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Two in vivo Drosophila models recapitulated key aspects of the human phenotype"
    explanation: >-
      The authors' own summary of what the fly models reproduce.
experimental_models:
- name: Patient-derived skin fibroblasts (SORD c.757delG homozygous)
  experimental_model_type: PRIMARY_CELL_CULTURE
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  publication: PMID:32367058
  description: >-
    Fibroblasts from patients homozygous for c.757delG, used to show absent SORD
    protein and raised intracellular sorbitol, and later as the assay system for
    aldose reductase inhibitor target engagement.
  modeled_mechanisms:
  - target: Loss of Sorbitol Dehydrogenase Activity
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Human cells carrying the patient genotype, with complete absence of the
      enzyme protein.
    limitations: >-
      Fibroblasts are not neurons or Schwann cells, so they report the metabolic
      lesion but nothing about axonal vulnerability.
    evidence:
    - reference: PMID:32367058
      reference_title: "Biallelic mutations in SORD cause a common and potentially treatable hereditary neuropathy with implications for diabetes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In patient-derived fibroblasts, we found a complete loss of SORD protein and increased intracellular sorbitol."
      explanation: >-
        Establishes the model's core finding.
  evidence:
  - reference: PMID:32367058
    reference_title: "Biallelic mutations in SORD cause a common and potentially treatable hereditary neuropathy with implications for diabetes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SORD protein was absent in all patients and the SORD levels were reduced in unaffected carriers compared to controls"
    explanation: >-
      Confirms the fibroblast panel reports the genotype faithfully, including
      the intermediate carrier state.
- name: Patient iPSC-derived motor neurons
  experimental_model_type: IPSC_DERIVED_MODEL
  organism:
    preferred_term: human
    term:
      id: NCBITaxon:9606
      label: Homo sapiens
  cell_types:
  - preferred_term: motor neuron
    term:
      id: CL:0000100
      label: motor neuron
  publication: PMID:37014713
  description: >-
    iPSC-derived motor neurons from patients, used to show that govorestat lowers
    sorbitol in the human cell type the disease actually targets. Patient iPSC
    lines carrying SORD variants have since been deposited as a shared resource.
  modeled_mechanisms:
  - target: Polyol Pathway Block with Sorbitol Accumulation
    relationship: MEASURES
    fidelity: MODERATE
    description: >-
      Provides the sorbitol readout in a human motor neuron rather than in a
      fibroblast or fly.
    limitations: >-
      A two-dimensional culture without Schwann cells or long axonal
      compartments, so it cannot reproduce length-dependent degeneration.
    evidence:
    - reference: PMID:37014713
      reference_title: "Sorbitol reduction via govorestat ameliorates synaptic dysfunction and neurodegeneration in sorbitol dehydrogenase deficiency."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "AT-007 significantly reduced sorbitol levels in patient-derived fibroblasts, induced pluripotent stem cell-derived (iPSC-derived) motor neurons, and Drosophila brains."
      explanation: >-
        Names iPSC-derived motor neurons as one of the systems in which sorbitol
        was measured and lowered.
  evidence:
  - reference: PMID:38796985
    reference_title: "Generation of 3 patient induced Pluripotent stem cell lines containing SORD mutations linked to a recessive neuropathy."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "Fibroblast lines from 3 different patients containing the c.753delG; p.Ala253GlnfsTer27 SORD mutations were reprogrammed into induced Pluripotent Stem Cell (iPSC) lines."
    explanation: >-
      Reports the deposited patient iPSC lines that make this model a shared
      resource rather than a single laboratory's material.
discussions:
- discussion_id: gap_sorbitol_to_axon_mechanism
  kind: KNOWLEDGE_GAP
  status: OPEN
  prompt: >-
    By what route does trapped intracellular sorbitol kill long motor axons -
    osmotic stress, oxidative stress, NADPH/NAD+ cofactor imbalance, or some
    combination - and why are motor axons affected while sensory axons are
    largely spared?
  attaches_to:
  - "pathophysiology#Polyol Pathway Block with Sorbitol Accumulation"
  - "pathophysiology#Distal Motor Axonal Degeneration and Demyelination"
  rationale: >-
    The genotype-to-metabolite half of the mechanism is settled, and the
    metabolite-to-axon half is not. The discovery authors listed osmotic stress,
    oxidative stress and reduced NADPH as plausible and did not choose between
    them, and the govorestat study restated that the mechanisms of
    sorbitol-induced degeneration are not fully elucidated. The gap matters
    therapeutically as well as descriptively: substrate reduction works upstream
    of whichever route is correct, so it can succeed without settling the
    question, but any attempt to protect the axon downstream needs the answer.
    The motor-over-sensory selectivity is a second, related unknown - sorbitol
    accumulates systemically, yet the lesion is selective, and the ballooned
    myelin seen in the rat points at Schwann cells as at least a co-target.
  proposed_experiments:
  - experiment_id: exp_osmotic_vs_oxidative_rat_nerve
    name: Compartment-resolved osmotic versus oxidative dissection in Sord-null rat nerve
    description: >-
      In Sord-/- rat sciatic and tibial nerve, measure Schwann cell and axonal
      water content and organic-osmolyte composition alongside oxidative-damage
      markers and NADPH/NADP+ and NAD+/NADH ratios, at ages before and after the
      onset of conduction slowing, and test whether an antioxidant that does not
      lower sorbitol prevents the lesion. A dissociation between sorbitol
      lowering and antioxidant protection would separate the osmotic and
      oxidative arms.
  - experiment_id: exp_motor_vs_sensory_isogenic_ipsc
    name: Motor versus sensory neuron comparison in isogenic human cultures
    description: >-
      Differentiate isogenic patient and gene-corrected iPSC lines into motor and
      sensory neurons in microfluidic axon-compartment devices, and compare
      sorbitol handling, axonal transport, bioenergetics and axon survival
      between the two lineages under matched glucose. This tests whether the
      selectivity is cell-intrinsic or requires the Schwann cell.
  evidence:
  - reference: PMID:32367058
    reference_title: "Biallelic mutations in SORD cause a common and potentially treatable hereditary neuropathy with implications for diabetes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings do not fully elucidate yet the mechanism of axonal damage caused by SORD deficiency: one or more of the known effects of decreased SORD activity, including increased sorbitol level, cellular osmolarity, oxidative stress and decreased NADPH levels, are plausible"
    explanation: >-
      The discovery authors state the gap and enumerate the candidate routes.
  - reference: PMID:37014713
    reference_title: "Sorbitol reduction via govorestat ameliorates synaptic dysfunction and neurodegeneration in sorbitol dehydrogenase deficiency."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The underlying mechanisms of sorbitol-induced degeneration have not been fully elucidated"
    explanation: >-
      Restates the gap three years later, confirming it remains open.
- discussion_id: mismatch_mouse_sord_no_neuropathy
  kind: HUMAN_MODEL_MISMATCH
  status: OPEN
  prompt: >-
    Why does a mouse with markedly reduced SORD protein develop no neuropathy and
    no conduction slowing, when biallelic SORD loss reliably causes neuropathy in
    humans and a motor-predominant neuropathy in the rat?
  attaches_to:
  - "pathophysiology#Distal Motor Axonal Degeneration and Demyelination"
  rationale: >-
    This is a mismatch rather than an absence of evidence: the C57BL/LiA mouse
    has been studied and is negative. The explanation offered - that standard
    mouse chow is low in sugar relative to human and Drosophila diets, so polyol
    flux never reaches the level needed to accumulate toxic sorbitol - is
    attractive because it predicts the disease is flux-dependent rather than
    purely genotype-dependent, and because SORD deficiency does aggravate
    neuropathy in diabetic rodents. It is also untested. The alternative, that
    the hypomorphic allele leaves enough residual enzyme, is not excluded. The
    distinction matters for interpreting every negative rodent result in this
    disease and for whether dietary sugar should be treated as a modifier in
    patients.
  proposed_experiments:
  - experiment_id: exp_high_sugar_diet_hypomorphic_mouse
    name: High-sugar diet and ageing challenge in the hypomorphic mouse
    description: >-
      Maintain C57BL/LiA and control mice on standard versus high-sugar diets to
      old age, with serial motor nerve conduction, nerve histology and nerve
      sorbitol. Emergence of the lesion on the high-sugar arm alone would confirm
      flux dependence; its absence under both would point instead at residual
      enzyme activity or a species difference.
  - experiment_id: exp_null_vs_hypomorph_mouse
    name: Null versus hypomorph comparison
    description: >-
      Phenotype a true Sord-null mouse alongside C57BL/LiA under identical
      husbandry, measuring residual enzyme activity, nerve sorbitol and
      conduction. This separates allele strength from diet as the explanation.
  evidence:
  - reference: PMID:32367058
    reference_title: "Biallelic mutations in SORD cause a common and potentially treatable hereditary neuropathy with implications for diabetes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Mice that have significantly reduced levels of SORD protein due to an intronic splicing mutation (C57BL/LiA mice), bred and fed according to the standard laboratory conditions, do not develop neuropathy or even slowed nerve conduction velocities"
    explanation: >-
      Establishes the negative mouse result that constitutes the mismatch.
  - reference: PMID:38538210
    reference_title: "SORD-deficient rats develop a motor-predominant peripheral neuropathy unveiling novel pathophysiological insights."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "In summary, Sord-/- rats develop a motor-predominant neuropathy that closely resembles the human phenotype."
    explanation: >-
      The contrasting positive rodent result that makes the mouse finding a
      mismatch rather than a rule about rodents.
- discussion_id: interpretation_cmt2_dhmn_split
  kind: INTERPRETATION
  status: OPEN
  prompt: >-
    Should SORD deficiency be curated as one disease spanning CMT2 and dHMN, as
    it is here, or split along the clinical labels its patients receive?
  attaches_to:
  - "pathophysiology#Motor-Predominant Hereditary Neuropathy Spanning CMT2 and dHMN"
  rationale: >-
    Cohorts assign the same genotype to different labels in different
    proportions - roughly two-thirds CMT2 in the largest multicentre series,
    but a dHMN majority in the French and Swiss cohort - and a third label,
    intermediate CMT, is used for patients whose conduction velocities fall in
    between. The labels track how much sensory involvement was found and how
    velocities were interpreted, not genotype, mechanism, or the allele carried.
    Splitting would therefore produce entries that differ in ascertainment rather
    than in biology. MONDO indexes the disease under the dHMN branch
    (MONDO:0030055, is_a neuronopathy, distal hereditary motor, autosomal
    recessive), which this entry follows for its disease_term while recording the
    CMT2 presentation as the same disease.
  evidence:
  - reference: PMID:39938083
    reference_title: "Genotype and phenotype spectrum of Charcot-Marie-Tooth disease due to mutations in SORD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Two-thirds of cases were diagnosed with CMT2 while one-third had distal hereditary motor neuropathy."
    explanation: >-
      The CMT2-majority split in the largest cohort.
  - reference: PMID:36943151
    reference_title: "SORD-related peripheral neuropathy in a French and Swiss cohort: Clinical features, genetic analyses, and sorbitol dosages."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Eighteen had dHMN, nine had CMT2, and three had intermediate CMT."
    explanation: >-
      The opposite split in an independent cohort, which is the argument against
      splitting the entry on these labels.
notes: >-
  Scope and boundary decisions recorded deliberately.

  No GeneReviews chapter exists for SORD deficiency: PubMed searches for
  "sorbitol dehydrogenase deficiency GeneReviews" and "SORD deficiency
  GeneReviews" both returned zero records at the time of curation, so the
  GeneReviews phenotype baseline step was not applicable and the phenotype set
  is built from the primary cohorts instead.

  Conformance to peripheral_axonal_degeneration is declared on four nodes but
  deliberately not on the module's "Axonal Transport Impairment and
  Mitochondrial Dysfunction" amplifier. That module node bundles impaired axonal
  transport with mitochondrial dysfunction and oxidative stress; this entry has
  evidence for the mitochondrial and oxidative arms only, and none for axonal
  transport in SORD deficiency, so declaring conformance there would assert an
  unevidenced claim.

  The disease is repeatedly framed as a genetic window onto diabetic neuropathy
  because it engages the same polyol pathway. That link is not curated as
  conformance to diabetic_vascular_complications: patients are normoglycaemic,
  the upstream trigger there is chronic hyperglycaemia, and nothing in that
  module's chain is evidenced here.

  Skeletal muscle findings - raised creatine kinase, vacuoles and tubular
  aggregates on biopsy, complex I deficiency on muscle proteomics - are curated
  as a laboratory phenotype and as evidence on the mitochondrial node rather
  than as a separate myopathy arm. The reported muscle changes are described by
  their authors as subclinical and accompanied by a neurogenic pattern, so
  reading them as a primary myopathy would overstate them.

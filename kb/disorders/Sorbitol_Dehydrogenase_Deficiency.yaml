        reference_title: "SORD-deficient rats develop a motor-predominant peripheral neuropathy unveiling novel pathophysiological insights."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Sord-/- rats had remarkably increased levels of sorbitol in serum, CSF and peripheral nerve."
        explanation: >-
          Direct measurement across three compartments.
  evidence:
  - reference: PMID:38538210
    reference_title: "SORD-deficient rats develop a motor-predominant peripheral neuropathy unveiling novel pathophysiological insights."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Therefore, we have generated a Sord knockout (KO), Sord-/-, Sprague Dawley rat, to model the human disease and to investigate the pathophysiology underlying SORD deficiency."
    explanation: >-
      Establishes the model, its construction and its intended use.
- name: C57BL/LiA mouse with reduced SORD
  species: Mouse
  genotype: intronic splicing variant reducing SORD protein (C57BL/LiA)
  background: C57BL/LiA
  publication: PMID:32367058
  description: >-
    A mouse strain carrying an intronic splicing variant that substantially
    reduces SORD protein. Under standard husbandry it develops neither neuropathy
    nor slowed nerve conduction - a negative result that the discovery authors
    attribute to the low sugar content of standard mouse chow relative to human
    and Drosophila diets, and therefore to polyol flux rather than to a species
    difference in the mechanism itself.
  modeled_mechanisms:
  - target: Distal Motor Axonal Degeneration and Demyelination
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      Reduced SORD protein in this strain does not produce the human lesion, so
      the model cannot be used to test the axonal-degeneration arm.
    limitations: >-
      The allele is hypomorphic rather than null, and the proposed explanation -
      dietary sugar limiting polyol flux - has not been tested by feeding these
      animals a high-sugar diet or by ageing them, so the failure may reflect
      husbandry rather than a real species difference.
    evidence:
    - reference: PMID:32367058
      reference_title: "Biallelic mutations in SORD cause a common and potentially treatable hereditary neuropathy with implications for diabetes."
      supports: REFUTE
      evidence_source: MODEL_ORGANISM
      snippet: "Mice that have significantly reduced levels of SORD protein due to an intronic splicing mutation (C57BL/LiA mice), bred and fed according to the standard laboratory conditions, do not develop neuropathy or even slowed nerve conduction velocities"
      explanation: >-
        Explicit negative result: the model does not reproduce the human
        neuropathy.
  evidence:
  - reference: PMID:32367058
    reference_title: "Biallelic mutations in SORD cause a common and potentially treatable hereditary neuropathy with implications for diabetes."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "This is possibly due to a difference in sugar metabolism between human and mouse since standard mouse chow consists of a low-sugar diet compared to humans"
    explanation: >-
      The authors' proposed explanation for the negative result, curated as
      PARTIAL because it is a hypothesis they did not test.

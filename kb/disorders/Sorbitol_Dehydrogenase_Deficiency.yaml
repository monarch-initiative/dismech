  description: >-
    Recurrent single-nucleotide deletion in SORD exon 7 producing a frameshift
    and premature termination. It is by far the commonest pathogenic allele,
    present homozygously in most reported patients and on one allele in most of
    the rest, and it recurs across European, Middle Eastern and East Asian
    ancestries rather than tracking a single founder haplotype.

inheritance:
- name: Autosomal recessive
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  description: >-
    Disease requires biallelic SORD loss-of-function variants - homozygosity for
    the recurrent c.757delG frameshift allele, compound heterozygosity for that
    allele with a second variant, or (increasingly recognised) a SORD/SORD2P
    inversion in trans. Heterozygous carriers have reduced SORD protein but are
    unaffected. Most probands are sporadic, consistent with recessive inheritance
    on a relatively common carrier allele rather than with consanguinity.
  evidence:
  - reference: PMID:32367058
    reference_title: "Biallelic mutations in SORD cause a common and potentially treatable hereditary neuropathy with implications for diabetes."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified 45 individuals from 38 families across multiple ancestries carrying the nonsense c.757delG (p.Ala253GlnfsTer27) variant in SORD, in either a homozygous or compound heterozygous state."
    explanation: >-
      Establishes the biallelic (homozygous or compound heterozygous)
      requirement across unrelated families and ancestries.
  - reference: PMID:32367058
    reference_title: "Biallelic mutations in SORD cause a common and potentially treatable hereditary neuropathy with implications for diabetes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "SORD protein was absent in all patients and the SORD levels were reduced in unaffected carriers compared to controls"
    explanation: >-
      Shows the gene-dosage basis of recessiveness - carriers retain partial
      protein and are unaffected, while biallelic patients have none.

progression:
- phase: Adolescent onset with slow decades-long progression
  notes: >-
    Onset is usually in the second decade, and progression is slow enough that
    most patients remain independently ambulatory decades later; a minority take
    up ankle-foot orthoses, typically in their thirties.
  evidence:
  - reference: PMID:39938083
    reference_title: "Genotype and phenotype spectrum of Charcot-Marie-Tooth disease due to mutations in SORD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Disease onset was usually in the second decade of life."
    explanation: >-
      Establishes the typical age of onset in the largest assembled cohort.
  - reference: PMID:39938083
    reference_title: "Genotype and phenotype spectrum of Charcot-Marie-Tooth disease due to mutations in SORD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "One-fourth of patients used ankle foot orthoses, usually in their 30s, but most patients maintained independent ambulation later in life."
    explanation: >-
      Quantifies the slow functional decline and preserved ambulation.
  - reference: PMID:39938083
    reference_title: "Genotype and phenotype spectrum of Charcot-Marie-Tooth disease due to mutations in SORD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Foot dorsiflexion and plantar flexion decreased significantly with age."
    explanation: >-
      Establishes measurable progression of distal lower-limb strength with age.
- phase: Male sex associated with greater severity and faster decline
  notes: >-
    Sex modifies expressivity rather than causing disease. In the largest cohort
    men were both over-represented (99 of 144) and more severely affected, with
    a larger longitudinal change in dorsiflexion strength. The same direction of
    effect was seen in the Sord-null rat, where motor conduction slowing was more
    pronounced in males. Whether the over-representation reflects true
    sex-differential expressivity or under-recognition in women is not resolved
    by these data.
  evidence:
  - reference: PMID:39938083
    reference_title: "Genotype and phenotype spectrum of Charcot-Marie-Tooth disease due to mutations in SORD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Male sex was significantly associated with the severity of distal lower limb weakness (plantar flexion) and a larger change over time (dorsiflexion)."
    explanation: >-
      Direct statement of the sex effect on both cross-sectional severity and
      rate of change.
  - reference: PMID:39938083
    reference_title: "Genotype and phenotype spectrum of Charcot-Marie-Tooth disease due to mutations in SORD."
    supports: PARTIAL
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified 144 patients from 126 families, including 99 males (69%) and 45 females (31%)"
    explanation: >-

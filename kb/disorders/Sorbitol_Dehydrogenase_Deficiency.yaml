  downstream:
  - target: Mitochondrial Dysfunction and Oxidative Stress
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Sorbitol accumulation is followed by bioenergetic failure and ROS

      supports: SUPPORT
      evidence_source: OTHER
      snippet: "Loss of SORD causes high sorbitol levels in tissues due to the inability to convert sorbitol to fructose in the 2-step polyol pathway, leading to degenerative neuropathy."
      explanation: >-
        States the enzyme-loss to metabolite-accumulation step directly.
- name: Polyol Pathway Block with Sorbitol Accumulation
  biological_scale: CELLULAR
  role: amplifier
  mechanism_confidence: ESTABLISHED
  conforms_to: "peripheral_axonal_degeneration#Insult to Peripheral Neurons and Schwann Cells"
  description: >-
    Aldose reductase continues to reduce glucose to sorbitol, but the second step
    is blocked, so sorbitol - a polar, poorly membrane-permeant polyol -
    accumulates. Intracellular sorbitol is more than ten-fold elevated in patient
    fibroblasts and fasting serum sorbitol is roughly two orders of magnitude
    above control. In the Sord-null rat the accumulation is documented in the
    compartment that matters: serum, CSF and peripheral nerve. This is the
    metabolic insult that the conserved peripheral-axonal-degeneration module
    describes generically; here it is the whole trigger, with no toxic,
    inflammatory or hyperglycaemic component.

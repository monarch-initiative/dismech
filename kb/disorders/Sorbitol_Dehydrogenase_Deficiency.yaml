        reference_title: "SORD-deficient rats develop a motor-predominant peripheral neuropathy unveiling novel pathophysiological insights."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Motor nerve conduction velocities of the tibial nerves were slowed."
        explanation: >-
          Direct measurement of slowed motor conduction.
    - name: Serum neurofilament light chain
      target: Distal Motor Axonal Degeneration and Demyelination
      direction: INCREASED
      interpretation: >-
        Fluid biomarker of ongoing axonal degeneration in the model.
      evidence:
      - reference: PMID:38538210
        reference_title: "SORD-deficient rats develop a motor-predominant peripheral neuropathy unveiling novel pathophysiological insights."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "serum from Sord-/- rats contained significantly increased levels of neurofilament light chain, an established biomarker for axonal degeneration"
        explanation: >-
          Quantitative fluid readout of axonal injury.
    evidence:
    - reference: PMID:38538210
      reference_title: "SORD-deficient rats develop a motor-predominant peripheral neuropathy unveiling novel pathophysiological insights."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In summary, Sord-/- rats develop a motor-predominant neuropathy that closely resembles the human phenotype."
      explanation: >-
        The authors' own assessment of fidelity to the human disease.
  - target: Polyol Pathway Block with Sorbitol Accumulation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Establishes that sorbitol accumulates in the nervous-system compartments
      that patient serum measurements cannot reach.
    limitations: >-
      Rodent sugar handling and laboratory diet differ from the human setting,
      which is the same variable invoked to explain why one mouse model fails.
    readouts:
    - name: Sorbitol concentration in serum, CSF and peripheral nerve
      target: Polyol Pathway Block with Sorbitol Accumulation
      direction: INCREASED
      interpretation: >-

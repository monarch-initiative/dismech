name: Sorbitol Dehydrogenase Deficiency
creation_date: "2026-08-23T00:00:00Z"
category: Genetic
description: >
  Sorbitol dehydrogenase (SORD) deficiency - also called SORD deficiency with
  peripheral neuropathy (SORDD), CMT-SORD, or distal hereditary motor
  neuronopathy autosomal recessive 8 (HMNR8) - is an autosomal recessive,
  adolescent-onset, length-dependent axonal peripheral neuropathy caused by
  biallelic loss-of-function variants in SORD. It was defined as a disease
  entity only in 2020 and is now recognised as one of the most frequent
  recessive causes of axonal Charcot-Marie-Tooth disease type 2 (CMT2) and
  distal hereditary motor neuropathy (dHMN).

  The mechanism is an enzyme block in the two-step polyol pathway. Aldose
  reductase reduces glucose to sorbitol; SORD then oxidises sorbitol to
  fructose. When SORD is absent, sorbitol - a poorly membrane-permeant polyol -
  accumulates in cells, serum, CSF and peripheral nerve, and a motor-predominant
  axonal degeneration follows. This is the same pathway invoked in diabetic
  neuropathy, but here it is driven by a germline enzyme deficiency at normal
  blood glucose, which is why the disease is repeatedly described as a genetic
  window onto polyol-pathway neurotoxicity.

  Two features make the entry unusual among inherited neuropathies. First, it
  has a directly measurable biochemical readout: fasting serum sorbitol is
  roughly two orders of magnitude above control, and urine sorbitol plus
  xylitol, or a red-cell SORD activity assay, can be used for case finding -
  which matters because the SORD2P pseudogene makes short-read molecular
  diagnosis unreliable and hides a recurrent SORD/SORD2P inversion allele.
  Second, the enzyme block is therapeutically approachable from upstream:
  inhibiting aldose reductase reduces the flux into sorbitol rather than
  replacing the missing enzyme, the rationale for the govorestat (AT-007)
  programme.

  The entry deliberately spans the CMT2/dHMN boundary rather than choosing one
  label. Roughly two-thirds of patients are classified as CMT2 and one-third as
  dHMN in the largest cohort, on one genotype and one mechanism, so the split is
  a clinical description of the same disease rather than two entities.

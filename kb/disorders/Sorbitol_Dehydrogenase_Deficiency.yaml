  - target: Distal Motor Axonal Degeneration and Demyelination
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      The route from trapped sorbitol to axonal loss is the central open
      question of the disease; osmotic stress, oxidative stress and NADPH/NAD+

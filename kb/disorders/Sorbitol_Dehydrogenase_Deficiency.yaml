    Direct enzymatic assay of SORD in red-cell haemolysate, monitoring NADH
    consumption. Offers a functional read on the enzyme itself, which is
    particularly useful when short-read sequencing returns an ambiguous or
    single-variant genotype because of the SORD2P pseudogene.
  evidence:

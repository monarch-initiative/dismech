    limitations: >-
      An invertebrate without myelin or Schwann cells, so it cannot speak to the
      myelin abnormality that is central to the mammalian lesion; the readouts
      are brain and muscle rather than peripheral nerve.
    readouts:
    - name: Brain ATP production and tissue ROS
      target: Mitochondrial Dysfunction and Oxidative Stress
      direction: ALTERED

diagnosis:
- name: Molecular testing of SORD with pseudogene-aware methods
  description: >-
    Confirmatory testing is molecular, but standard short-read exome or CMT
    panel sequencing is not sufficient on its own. SORD2P shares near-identical
    sequence with SORD and carries the c.757delG position on most control
    chromosomes, so reads mismap and biallelic variants cannot be phased.
    Long-read sequencing resolves the two loci and phases the alleles, and it is
    the only route that detects the recurrent SORD/SORD2P inversion - which
    accounts for most cases in which short-read testing finds just one
    pathogenic variant. A patient with a single detected variant and a
    compatible phenotype is therefore not excluded, and the biochemical markers
    curated above are the practical way to adjudicate such a case.
  evidence:
  - reference: PMID:35224818
    reference_title: "Long read sequencing overcomes challenges in the diagnosis of SORD neuropathy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Subsequent Oxford Nanopore Tech (ONT) long-read sequencing was used to successfully differentiate SORD from the highly homologous non-functional SORD2P pseudogene and confirmed that the mutations were biallelic through haplotype-resolved analysis."
    explanation: >-
      Demonstrates that long-read sequencing solves both the mismapping and the
      phasing problem in a real diagnostic case.
  - reference: PMID:41282915
    reference_title: "Gene-Pseudogene Inversions as a Hidden Source of Missing Heritability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "we identified novel and recurrent inversions between SORD and its pseudogene SORD2P in 13 out of 151 patients (9%) affected by SORD-related Charcot-Marie-Tooth (CMT) neuropathy, including 6 out of 8 (75%) of SORD-CMT cases where only one pathogenic variant was identified on short read sequencing, making it the third most common pathogenic allele causing SORD-CMT."
    explanation: >-
      Quantifies the allele class that short-read testing misses, and shows it
      concentrates precisely in the single-variant cases.
- name: Biochemical case finding by polyol measurement
  description: >-
    Because the molecular route is unreliable, biochemistry does the case
    finding: fasting serum sorbitol, the paired urine sorbitol and xylitol
    profile, or a red-cell SORD activity assay. Serum sorbitol separates
    patients from heterozygous carriers as well as from controls, which is what
    lets it adjudicate a variant of uncertain significance. The individual
    markers and their reported performance are curated under biochemical.
  evidence:
  - reference: PMID:39938083
    reference_title: "Genotype and phenotype spectrum of Charcot-Marie-Tooth disease due to mutations in SORD."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Fasting serum sorbitol is a reliable biomarker of the condition that can be utilized for pathogenicity assessment of identified rare SORD variants."
    explanation: >-
      States both diagnostic uses: identifying the condition, and adjudicating
      variants the molecular test cannot classify.
treatments:
- name: Aldose Reductase Inhibition (Investigational)
  description: >-
    Substrate reduction rather than enzyme replacement: inhibiting aldose
    reductase, the enzyme upstream of the block, reduces flux of glucose into
    sorbitol and so lowers sorbitol despite the missing SORD. Epalrestat and
    ranirestat established the principle in patient fibroblasts and in
    Drosophila; the CNS-penetrant next-generation inhibitor govorestat (AT-007)
    carried it into the clinic, lowering sorbitol in patient fibroblasts,
    iPSC-derived motor neurons and fly brain and rescuing synaptic, locomotor and
    mitochondrial phenotypes in flies. No aldose reductase inhibitor is approved
    for this indication, and this entry records no clinical efficacy claim: the
    evidence curated here is preclinical, and the clinical trial is listed
    separately under clinical_trials.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: epalrestat
      term:
        id: CHEBI:31539
        label: epalrestat
    - preferred_term: govorestat (AT-007)
  target_mechanisms:
  - target: Polyol Pathway Block with Sorbitol Accumulation
    treatment_effect: INHIBITS
    description: >-
      The drug acts one step upstream of the genetic lesion, cutting production
      of the metabolite that accumulates rather than restoring the missing
      enzyme.
    evidence:
    - reference: PMID:32367058
      reference_title: "Biallelic mutations in SORD cause a common and potentially treatable hereditary neuropathy with implications for diabetes."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "In patient fibroblasts both Epalrestat and Ranirestat significantly reduced sorbitol levels"
      explanation: >-
        Target engagement in human patient cells: inhibiting the upstream enzyme
        lowers the metabolite that accumulates. Quoted from the fibroblast
        experiment alone so the evidence source is unambiguously in vitro.
  evidence:
  - reference: PMID:37014713
    reference_title: "Sorbitol reduction via govorestat ameliorates synaptic dysfunction and neurodegeneration in sorbitol dehydrogenase deficiency."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "AT-007 significantly reduced sorbitol levels in patient-derived fibroblasts, induced pluripotent stem cell-derived (iPSC-derived) motor neurons, and Drosophila brains."
    explanation: >-
      Target engagement for govorestat in human patient-derived cells including
      motor neurons. The quoted sentence also reports fly brain; the item is
      tagged IN_VITRO for the human-cell measurements it is cited for, and the
      Drosophila arm is carried separately by the MODEL_ORGANISM item below.
  - reference: PMID:37014713
    reference_title: "Sorbitol reduction via govorestat ameliorates synaptic dysfunction and neurodegeneration in sorbitol dehydrogenase deficiency."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "AT-007 feeding in Sord-deficient Drosophila mitigated synaptic degeneration and significantly improved synaptic transduction, locomotor activity, and mitochondrial function."
    explanation: >-
      Phenotypic rescue in vivo, but in an invertebrate model - the basis for
      the trial, not evidence of clinical benefit.
  notes: >-
    Efficacy in humans is not established here. The phase 2/3 INSPIRE trial
    (NCT05397665) is recorded by its registry as completed, but no peer-reviewed
    report of its results was found in PubMed at the time of curation, so no
    clinical outcome is curated; company announcements are not used as evidence.
- name: Ankle-Foot Orthoses and Rehabilitation
  description: >-
    The current standard of care is supportive: ankle-foot orthoses for foot
    drop, plus physiotherapy for gait and strength maintenance. About a quarter
    of patients take up orthoses, usually in their thirties.
  therapeutic_modality: BEHAVIORAL
  treatment_term:
    preferred_term: physical therapy
    term:
      id: NCIT:C15302

    snippet: "This retrospective study included newly diagnosed 79 cases of neuroblastoma, which were referred for bone marrow examination for the staging of the disease. ... Also, 55.6% (44/79) of cases in the study population showed evidence of marrow infiltration. The bone marrow infiltration was significantly linked to thrombocytopenia (p = 0.043) and nucleated red blood cells (p = 0.003) in peripheral blood."
    explanation: >-
      In a retrospective single-center series of 79 newly diagnosed patients
      referred for staging bone marrow examination at King George Medical
      University, Lucknow, North India, 44/79 had marrow infiltration, and
      infiltration was significantly linked to thrombocytopenia in peripheral
      blood (p = 0.043). The quote states the association directly. The p-value
      lies close to the significance threshold, the paper does not state the
      platelet cut-off it used, and a tertiary-center referral series is not an
      unselected population.
  phenotype_contexts:

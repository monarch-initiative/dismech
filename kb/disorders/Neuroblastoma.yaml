  - reference: PMID:25345447
    reference_title: "Neuroblastoma models for insights into tumorigenesis and new therapies."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "MYCN amplification is found in about 20% of cases"
    explanation: >-
      A review statement of the rounded figure, about 20% of cases. The
      review's subject is mouse models; this sentence restates the human
      clinical figure.
- name: ALK Mutations
  association: Oncogenic Driver Mutations
  gene_term:
    preferred_term: ALK
    term:
      id: hgnc:427
      label: ALK
  notes: >-
    ALK point mutations occur in approximately 8-10% of neuroblastomas at
    diagnosis; in 1,596 diagnostic samples, three hotspot residues accounted
    for 85% of the mutations: R1275 (43%), F1174 (30%) and F1245 (12%).
    Germline activating ALK mutations are the major cause of hereditary
    (familial) neuroblastoma, making ALK the principal familial neuroblastoma
    predisposition gene, and R1275Q is the most frequent germline mutation.
    Published estimates of the share of familial cases carrying a germline
    ALK mutation range from about 50% to 80%: the group that mapped ALK as
    the major familial gene reported more than 50%, one review gives 50%, and
    two others give 75% and 80%. Together with PHOX2B, ALK accounts for most
    familial cases. ALK is a therapeutic target for crizotinib and, in
    current frontline cooperative-group trials, lorlatinib.
  evidence:
  - reference: PMID:32296467
    reference_title: "Nervous system: Embryonal tumors: Neuroblastoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The primary predisposition genes in familial neuroblastoma are ALK and PHOX2B."
    explanation: >-
      Identifies ALK as a primary predisposition gene in familial
      neuroblastoma, consistent with its role as an oncogenic driver.
  - reference: PMID:18724359
    reference_title: "Identification of ALK as a major familial neuroblastoma predisposition gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results demonstrate that heritable mutations of ALK are the main cause of familial neuroblastoma, and that germline or acquired activation of this cell-surface kinase is a tractable therapeutic target for this lethal paediatric malignancy."
    explanation: >-
      The linkage-plus-resequencing study in neuroblastoma pedigrees that
      established heritable ALK mutation as the main cause of familial
      neuroblastoma and ALK as the principal familial predisposition gene.
  - reference: PMID:18724359
    reference_title: "Identification of ALK as a major familial neuroblastoma predisposition gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Resequencing in 194 high-risk neuroblastoma samples showed somatically acquired mutations in the tyrosine kinase domain in 12.4% of samples."
    explanation: >-
      Quantifies somatic ALK tyrosine-kinase-domain mutation in a high-risk
      cohort at 12.4%; the 8-10% figure cited in the notes refers to
      unselected neuroblastoma, which is enriched for lower-risk disease.
  - reference: PMID:25517749
    reference_title: "ALK mutations confer differential oncogenic activation and sensitivity to ALK inhibition therapy in neuroblastoma."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe comprehensive genomic, biochemical, and computational analyses of ALK mutations across 1,596 diagnostic neuroblastoma samples. ALK tyrosine kinase domain mutations occurred in 8% of samples--at three hot spots and 13 minor sites--and correlated significantly with poorer survival in high- and intermediate-risk neuroblastoma."
    explanation: >-
      ALK tyrosine kinase domain mutations in 8% of 1,596 diagnostic
      neuroblastoma samples, the lower end of the approximately 8-10% figure
      in the notes. The count is of tumors carrying a mutation, so on its own
      it does not separate somatic from germline events.
  - reference: PMID:26059187
    reference_title: "Deep Sequencing Reveals Occurrence of Subclonal ALK Mutations in Neuroblastoma at Diagnosis."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this series, deep sequencing allows the detection of F1174 and R1275 ALK mutational events at diagnosis in 10% of cases, with subclonal events in more than half of these, which would have gone undetected by Sanger sequencing."
    explanation: >-
      The upper end of the approximately 8-10% figure: targeted deep
      sequencing of the F1174 and R1275 hotspots found ALK mutations in 10% of
      cases at diagnosis, more than half of them subclonal events that Sanger
      sequencing would have missed.
  - reference: PMID:29589100
    reference_title: "Genetic susceptibility to neuroblastoma: current knowledge and future directions."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "It is estimated that gain-of-function mutations in ALK account for 75% of familial neuroblastoma."
    explanation: >-
      A review estimate of 75%: ALK gain-of-function mutations account for 75%
      of familial neuroblastoma. The sentence is in the review's full text,
      not its abstract.
  - reference: PMID:38791942
    reference_title: "The Neuroblastoma Microenvironment, Heterogeneity and Immunotherapeutic Approaches."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline mutations in the anaplastic lymphoma kinase (ALK) gene are found in 80% of familial cases"
    explanation: >-
      A review statement of 80%, the upper end of the range in the notes:
      germline ALK mutations in 80% of familial cases. It is a passing
      statement in the full text of a review of the tumor microenvironment.
  - reference: PMID:21734404
    reference_title: "Genome-wide linkage analysis to identify genetic modifiers of ALK mutation penetrance in familial neuroblastoma."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Following a genome-wide linkage analysis and sequencing of candidate genes in the critical region, we identified ALK as the major familial NB gene. Dominant mutations in ALK are found in more than 50% of familial NB cases."
    explanation: >-
      A lower estimate, from the group that mapped ALK as the major familial
      gene: dominant ALK mutations in more than 50% of familial cases. It is
      the background section of a later linkage study of ALK penetrance, not
      a new count.
  - reference: PMID:28674118
    reference_title: "Retinoblastoma and Neuroblastoma Predisposition and Surveillance."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline mutations in ALK and PHOX2B account for most familial NB cases."
    explanation: >-
      A predisposition-workshop review stating that germline ALK and PHOX2B
      mutations together account for most familial cases, supporting the
      combined clause of the notes; it gives no share for ALK alone.
  - reference: PMID:25345447
    reference_title: "Neuroblastoma models for insights into tumorigenesis and new therapies."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Anaplastic lymphoma kinase (ALK) mutation is also found in 7% of sporadic neuroblastomas and 50% of familial neuroblastomas."
    explanation: >-
      A review figure at the low end of the published range: ALK mutation in
      50% of familial neuroblastomas. The same sentence gives 7% for sporadic
      tumors, close to the 8% diagnostic-cohort figure above.
  - reference: PMID:25517749
    reference_title: "ALK mutations confer differential oncogenic activation and sensitivity to ALK inhibition therapy in neuroblastoma."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three 'hotspot' residues accounted for 85% of mutations (Figure 1, Table 1): R1275 (43%), F1174 (30%), and F1245 (12%)"
    explanation: >-
      The distribution of ALK mutations by residue in the same 1,596-sample
      cohort: R1275, F1174 and F1245 together account for 85%. The sentence is
      in the paper's full text.
  - reference: PMID:28674118
    reference_title: "Retinoblastoma and Neuroblastoma Predisposition and Surveillance."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline mutations in ALK encode for single-base substitutions in key regions of the kinase domain that result in constitutive activation of the kinase, with the R1275Q mutation most frequently observed (Table 2)."
    explanation: >-
      Supports R1275Q as the most frequent germline ALK mutation, and germline
      ALK variants as activating kinase-domain substitutions. The sentence is
      in the review's full text.
- name: Segmental Chromosomal Aberrations
  association: Prognostic Markers
  notes: >-
    Segmental chromosomal aberrations including 1p deletion, 11q deletion,
    and 17q gain are associated with worse prognosis and help define
    risk stratification. Chromosome 11q status is one of the factors formally
    incorporated into the INRG classification system; 11q deletion is
    characteristically found in MYCN-non-amplified high-risk disease.
  evidence:
  - reference: PMID:19047291
    reference_title: "The International Neuroblastoma Risk Group (INRG) classification system: an INRG Task Force report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stage, age, histologic category, grade of tumor differentiation, the status of the MYCN oncogene, chromosome 11q status, and DNA ploidy were the most highly statistically significant and clinically relevant factors."
    explanation: >-
      Establishes chromosome 11q status as a statistically significant,
      clinically relevant prognostic factor in a large patient cohort and as a
      formal component of INRG risk classification.
  - reference: PMID:41560679
    reference_title: "Coexpression of MYCN and ALK Induces Neuroblastoma-Like Tumors From Human iPS Cell-Derived Cranial Neural Crest Cells."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: "we identified key features of NB, including loss of NF1 and gain of 17q chromosome, which are critical for the development of malignant tumor."
    explanation: >-
      Supports 17q gain specifically, as a feature the study's own expression
      profiling and exome sequencing identified in MYCN/ALK-induced clones of
      iPSC-derived cranial neural crest cells, cells that formed
      neuroblastoma-like tumors when transplanted into immunodeficient mice;
      it is not patient-derived prognostic data. Indirect for this record: the
      sentence calls 17q gain critical for malignant tumor development in a
      model system, and an association with worse prognosis in patients
      follows only by inference. It does not address 1p or 11q deletion; of
      the record's prognostic claim, the INRG item above covers 11q status
      only.
- name: TERT Rearrangement
  association: Telomere Maintenance Activation
  gene_term:
    preferred_term: TERT
    term:
      id: hgnc:11730
      label: TERT
  notes: >-
    Genomic rearrangements juxtaposing enhancers to the TERT locus drive
    massive TERT upregulation and telomerase-mediated telomere maintenance.
    TERT rearrangement occurs in high-risk disease and is largely mutually
    exclusive with MYCN amplification and ATRX mutation, defining one of three
    alternative routes to telomere maintenance in neuroblastoma.
  evidence:
  - reference: PMID:26466568
    reference_title: "Telomerase activation by genomic rearrangements in high-risk neuroblastoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These rearrangements occurred only in high-risk neuroblastomas (12/39, 31%) in a mutually exclusive fashion with MYCN amplifications and ATRX mutations, which are known genetic events in this tumour type."
    explanation: >-
      Establishes TERT rearrangement as a high-risk-restricted event that is
      mutually exclusive with MYCN amplification and ATRX mutation, defining
      the three-way telomere-maintenance structure of neuroblastoma genomics.
  - reference: PMID:26466568
    reference_title: "Telomerase activation by genomic rearrangements in high-risk neuroblastoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TERT rearrangements defined a subgroup of high-risk tumours with particularly poor outcome."
    explanation: Links TERT rearrangement to adverse outcome in an extended case series.
- name: ATRX Mutation
  association: Alternative Lengthening of Telomeres
  gene_term:
    preferred_term: ATRX
    term:
      id: hgnc:886
      label: ATRX
  notes: >-
    Somatic ATRX loss-of-function drives telomere maintenance by the
    alternative lengthening of telomeres (ALT) pathway. ATRX-mutant
    neuroblastoma is strongly age-dependent, characterising an
    adolescent/young-adult subtype with indolent but chronically progressive,
    treatment-refractory disease. ATRX mutation is essentially absent in
    infants and is mutually exclusive with MYCN amplification.
  evidence:
  - reference: PMID:22416102
    reference_title: "Association of age at diagnosis and genetic mutations in patients with neuroblastoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ATRX mutations were associated with an absence of the ATRX protein in the nucleus and with long telomeres."
    explanation: >-
      Links ATRX mutation to loss of nuclear ATRX protein and to the long
      telomeres characteristic of alternative lengthening of telomeres.
  - reference: PMID:22416102
    reference_title: "Association of age at diagnosis and genetic mutations in patients with neuroblastoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ATRX mutations were associated with age at diagnosis in children and young adults with stage 4 neuroblastoma."
    explanation: >-
      Whole-genome sequencing across 104 patients establishes the age
      dependence of ATRX mutation, supporting the adolescent/young-adult
      subtype framing.
- name: PHOX2B
  association: Germline Predisposition
  gene_term:
    preferred_term: PHOX2B
    term:
      id: hgnc:9143
      label: PHOX2B
  notes: >-
    PHOX2B is a master regulator of autonomic nervous system development and,
    with ALK, one of the two primary familial neuroblastoma predisposition
    genes; it was the first neuroblastoma predisposition gene to be
    identified. Germline PHOX2B mutations cause neuroblastoma predisposition
    that may co-occur with other neurocristopathies — Hirschsprung disease
    and congenital central hypoventilation syndrome — reflecting a shared
    neural-crest developmental origin.
  evidence:
  - reference: PMID:32296467
    reference_title: "Nervous system: Embryonal tumors: Neuroblastoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The primary predisposition genes in familial neuroblastoma are ALK and PHOX2B."
    explanation: >-
      Identifies PHOX2B alongside ALK as one of the two primary familial
      neuroblastoma predisposition genes.
  - reference: PMID:29589100
    reference_title: "Genetic susceptibility to neuroblastoma: current knowledge and future directions."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "These cases of neuroblastoma comorbid with other neural crest-implicated diseases facilitated the discovery of the first neuroblastoma predisposition gene, the paired-like homeobox 2B gene (PHOX2B) (Mosse et al. 2004; Trochet et al. 2004)."
    explanation: >-
      States that PHOX2B was the first neuroblastoma predisposition gene to be
      identified, through cases that co-occurred with other neural crest
      disorders. The sentence is in the review's full text.
treatments:
- name: Risk-Adapted Chemotherapy
  description: >-
    Chemotherapy intensity varies by risk group. Low-risk patients may need
    only observation or minimal chemotherapy. High-risk patients receive
    intensive induction chemotherapy including cisplatin, etoposide,
    vincristine, cyclophosphamide, doxorubicin, and topotecan.
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: cisplatin
      term:
        id: CHEBI:27899
        label: cisplatin
    - preferred_term: etoposide
      term:
        id: CHEBI:4911
        label: etoposide
    - preferred_term: cyclophosphamide
      term:
        id: CHEBI:4027
        label: cyclophosphamide
- name: Surgical Resection
  description: >-
    Surgery for primary tumor resection is performed after chemotherapy for
    high-risk disease. Complete resection is associated with better outcomes
    when achievable without significant morbidity.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Definitive Surgical Resection
    term:
      id: NCIT:C154430
      label: Definitive Surgical Resection
- name: Autologous Stem Cell Transplant
  description: >-
    High-dose chemotherapy with autologous stem cell rescue is standard for
    high-risk neuroblastoma following induction chemotherapy and surgical
    resection. Tandem transplant may provide additional benefit.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
- name: Radiation Therapy
  description: >-
    Radiation to the primary tumor bed is used in high-risk disease following
    surgical resection and stem cell transplant.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: Radiation Therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
- name: Anti-GD2 Immunotherapy
  description: >-
    Anti-GD2 monoclonal antibody (dinutuximab) combined with GM-CSF and IL-2
    has significantly improved outcomes in high-risk neuroblastoma during
    maintenance therapy. GD2 is highly expressed on neuroblastoma cells.
  treatment_term:
    preferred_term: immunotherapy procedure
    term:
      id: NCIT:C15262
      label: Immunotherapy
- name: ALK Inhibitor Therapy
  description: >-
    ALK tyrosine kinase inhibition targets the constitutive ALK signalling
    produced by activating ALK point mutations or ALK amplification. The
    first-generation inhibitor crizotinib has limited activity against several
    common neuroblastoma ALK variants (notably F1174L), which motivated the
    move to third-generation, CNS-penetrant inhibitors; lorlatinib is under
    evaluation in frontline cooperative-group trials for ALK-altered
    high-risk disease. Applicable only to the ALK-altered molecular subset.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: crizotinib
      term:
        id: CHEBI:64310
        label: crizotinib
    - preferred_term: lorlatinib
      term:
        id: CHEBI:143117
        label: lorlatinib
  target_mechanisms:
  - target: ALK Signaling Activation
    description: >-
      ATP-competitive inhibition of the ALK tyrosine kinase domain abolishes
      the constitutive receptor autophosphorylation produced by activating
      ALK mutations, removing the downstream proliferative signal.
    evidence:
    - reference: PMID:18724359
      reference_title: "Identification of ALK as a major familial neuroblastoma predisposition gene."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Mutations resulted in constitutive phosphorylation, and targeted knockdown of ALK messenger RNA resulted in profound inhibition of growth in all cell lines harbouring mutant or amplified ALK"
      explanation: >-
        Establishes ALK dependence of ALK-mutant and ALK-amplified
        neuroblastoma cells, the mechanistic rationale for ALK-directed
        therapy. Genetic knockdown rather than pharmacologic inhibition.
- name: Isotretinoin (Retinoic Acid)
  description: >-
    13-cis-retinoic acid (isotretinoin) is given during maintenance therapy
    to promote differentiation of residual neuroblastoma cells and reduce
    relapse risk.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: isotretinoin
      term:
        id: CHEBI:6067
        label: isotretinoin
animal_models:
- name: Xenopus anteroventral noradrenergic (AVNA) cell differentiation model
  species: Xenopus laevis
  genotype: >-
    Embryos expressing wild-type Ascl1, a phospho-mutant Ascl1 that cannot be
    phosphorylated at serine-proline motifs, CDKs, or MYCN, with Ascl1
    morpholino knockdown
  category: Developmental model of the presumed cell of origin
  publication: PMID:25786414
  description: >-
    Rather than growing a tumour, this model reconstructs the normal
    differentiation of the neural-crest-derived sympathoadrenal cell that
    neuroblastoma is thought to arise from, and asks what stops it. Frog AVNA
    cells differentiate under transient Ascl1 expression; in neuroblastoma cells
    Ascl1 is instead persistently expressed and multiply phosphorylated.
    Introducing that phospho-state into the frog cells blocks their
    differentiation, and CDK or MYCN overexpression blocks it too — but not when
    Ascl1 cannot be phosphorylated, which places phosphorylation downstream of
    both. The model tests the differentiation-arrest hypothesis in a normal
    developmental context; it does not produce tumours and so says nothing about
    transformation, growth, or metastasis.
  genes:
  - preferred_term: ASCL1
    term:
      id: hgnc:738
      label: ASCL1
  - preferred_term: MYCN
    term:
      id: hgnc:7559
      label: MYCN
  modeled_mechanisms:
  - target: Neural Crest Developmental Arrest
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Supplies a molecular switch for the arrest this node asserts: multi-site
      phosphorylation of Ascl1 converts it from a driver of sympathoadrenal
      differentiation into an inert factor, matching the phospho-state Ascl1 is
      held in within neuroblastoma cells.
    limitations: >-
      Frog AVNA cells are a developmental counterpart of the presumed cell of
      origin, not tumour cells, and the model contains no transformed tissue —
      arrest is scored as failure to differentiate on schedule rather than as
      tumour formation. The link to human disease rests on the observed
      phospho-state of ASCL1 in neuroblastoma lines, so the model shows the
      state is sufficient to block differentiation, not that it is what maintains
      any patient's tumour.
    readouts:
    - name: AVNA cell differentiation driven by wild-type versus phospho-mutant Ascl1
      target: Neural Crest Developmental Arrest
      direction: DECREASED
      interpretation: >-
        Differentiation fails when Ascl1 can be multiply phosphorylated and
        proceeds when it cannot, isolating phospho-status as the controlling
        variable.
      evidence:
      - reference: PMID:25786414
        reference_title: "Ascl1 phospho-status regulates neuronal differentiation in a Xenopus developmental model of neuroblastoma."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "ability to induce differentiation of AVNA cells is inhibited by its multi-site phosphorylation at serine-proline motifs"
        explanation: States the measured effect of Ascl1 phospho-status on differentiation in this model.
    evidence:
    - reference: PMID:25786414
      reference_title: "Ascl1 phospho-status regulates neuronal differentiation in a Xenopus developmental model of neuroblastoma."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we use Xenopus frog embryos to characterise the differentiation of anteroventral noradrenergic (AVNA) cells, cells derived from the neural crest."
      explanation: Establishes what the model is and that its cells are neural crest derived.
    - reference: PMID:25786414
      reference_title: "Ascl1 phospho-status regulates neuronal differentiation in a Xenopus developmental model of neuroblastoma."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We find that the transcriptional regulator Ascl1 is expressed transiently in normal AVNA cell differentiation but its expression is aberrantly maintained in NB cells, where it is largely phosphorylated on multiple sites."
      explanation: >-
        The neuroblastoma-cell half of this comparison is cell-based, and it is
        what connects the frog readout to the human disease state.
  - target: MYCN-Driven Proliferation
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Positions MYCN upstream of the differentiation block: MYCN overexpression
      prevents Ascl1-driven differentiation, and loses that ability when Ascl1
      cannot be phosphorylated.
    limitations: >-
      This is the differentiation-blocking arm of MYCN only. The node is about
      proliferation, and no proliferative or tumour-growth readout was taken
      here; MYCN is introduced by overexpression in a normal embryo, not by the
      genomic amplification that defines high-risk neuroblastoma.
    readouts:
    - name: Ascl1-driven AVNA differentiation under CDK or MYCN overexpression
      target: MYCN-Driven Proliferation
      direction: DECREASED
      interpretation: >-
        The epistasis result: MYCN and CDKs block differentiation only when Ascl1
        is phosphorylatable, so their effect on this cell fate runs through Ascl1
        phospho-status.
      evidence:
      - reference: PMID:25786414
        reference_title: "Ascl1 phospho-status regulates neuronal differentiation in a Xenopus developmental model of neuroblastoma."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "overexpression of cyclin-dependent kinases (CDKs) and MYCN inhibit wild-type Ascl1-driven AVNA differentiation, but not differentiation driven by a phospho-mutant form of Ascl1"
        explanation: Reports the measured differentiation block and the phospho-mutant control that makes it interpretable.
    evidence:
    - reference: PMID:25786414
      reference_title: "Ascl1 phospho-status regulates neuronal differentiation in a Xenopus developmental model of neuroblastoma."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This suggests that the maintenance of ASCL1 in its multiply phosphorylated state might prevent terminal differentiation in NB, which could offer new approaches for differentiation therapy in NB."
      explanation: >-
        The authors put the therapeutic and disease-level reading as a
        suggestion, which is the level of support this link carries.

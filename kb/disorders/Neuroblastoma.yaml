mappings:
  mondo_mappings:
  - term:
      id: MONDO:0005072
      label: neuroblastoma
    mapping_predicate: skos:exactMatch
    mapping_source: MONDO
    mapping_justification: >-
      Primary MONDO identifier for this entry. MONDO defines the class as an
      extracranial childhood cancer that originates from neural crest tissues of
      the sympathetic nervous system, matching this entry's scope, and records
      NCIT:C3270 and Orphanet:635 as exact matches. MONDO also files olfactory,
      cerebral and retinal neuroblastoma, and adrenal gland and mediastinum
      ganglioneuroblastoma, beneath the class; this entry does not cover them
      (see notes).
  ncit_mappings:
  - term:
      id: NCIT:C3270
      label: Neuroblastoma
    mapping_predicate: skos:exactMatch
    mapping_source: NCIT
    mapping_justification: >-
      NCIT concept that MONDO records as an exact match of MONDO:0005072. NCIT
      defines it as a malignant neuroblastic tumor with neuroblastic cells, no
      ganglion cells and no prominent Schwannian stroma, matching this entry.
      NCIT also files olfactory neuroblastoma (NCIT:C3789), CNS neuroblastoma
      with FOXR2 activation (NCIT:C186547) and retinal neuroblastoma
      (NCIT:C6956) beneath it; this entry does not cover them (see notes). NCIT
      also has a narrower Peripheral Neuroblastoma class (NCIT:C6591); C3270 is
      used because it is the class MONDO records as an exact match, and NCIT
      files this disease's stage, risk-group and differentiation-grade classes
      under C3270 rather than under C6591.

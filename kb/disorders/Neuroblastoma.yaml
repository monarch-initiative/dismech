  - reference: PMID:36112265
    reference_title: "Management and Outcomes of Children with Stage 4S (MS) Neuroblastoma: A Single-Center Experience from a Resource-Challenged Nation."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL

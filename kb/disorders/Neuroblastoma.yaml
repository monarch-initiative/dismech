      observed at evaluation beside liver involvement in every child. The series
      is limited to stage 4S, so it supports the association only and sets no
      frequency band; its figure is recorded in the population context.
  phenotype_contexts:
  - population: "Children with stage 4S neuroblastoma diagnosed January 1996 to December 2019 at a single tertiary care center in a resource-challenged nation (22 children)"
    frequency: "9%"
    notes: >-
      Subcutaneous nodules were observed at evaluation in 9% of this
      single-center stage 4S cohort, beside liver involvement in every child.
      The abstract gives a percentage, not a count. The figure applies to stage
      4S disease only and, coming from a small single-center series, is
      imprecise.
    evidence:
    - reference: PMID:36112265
      reference_title: "Management and Outcomes of Children with Stage 4S (MS) Neuroblastoma: A Single-Center Experience from a Resource-Challenged Nation."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "The archives for children with NB 4S, diagnosed over a 24-y period (January 1996-December 2019), were retrospectively retrieved. ... A total of 22 children (59% males) were included. ... Liver involvement (100%), bone marrow infiltration (23%), and subcutaneous nodules (9%) were observed upon evaluation."
      explanation: >-
        In this retrospective single-center series of 22 children with stage 4S
        neuroblastoma diagnosed between January 1996 and December 2019,
        subcutaneous nodules were observed at evaluation in 9%, against liver
        involvement in 100% and bone marrow infiltration in 23%. The quote names
        the nodules directly and shows them as a minority feature beside
        universal liver involvement. The title labels the cohort 4S (MS) and the
        abstract does not give the cohort's age range, so it does not show
        whether the INSS stage 4S age limit or the higher INRG stage MS age
        limit defined the cohort. With few patients from one center, the 9% is
        an imprecise estimate.
biochemical:
- name: Catecholamine Metabolites
  notes: >-
    Elevated urinary catecholamine metabolites, classically vanillylmandelic
    acid (VMA) and homovanillic acid (HVA), are found in most neuroblastomas
    at diagnosis and support the diagnosis. Reviews cite high urinary
    catecholamine levels in more than 90% of cases (92% for VMA and HVA in
    clinically presenting neuroblastoma), and in a series of patients who
    later relapsed or progressed, urinary VMA and/or HVA had been abnormal at
    diagnosis in 92%. In two diagnostic series published in 2017 and 2020,
    however, the VMA and HVA pair had a diagnostic sensitivity of 82-84%,
    rising to 95% in the 2017 series when all eight urinary metabolites in
    its panel were combined. Relapse or progression cannot be detected
    reliably by monitoring tumor markers alone.
  evidence:
  - reference: PMID:28061374
    reference_title: "Catecholamines profiles at diagnosis: Increased diagnostic sensitivity and correlation with biological and clinical features in neuroblastoma patients."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "The combination of the classical markers VMA and HVA had a diagnostic sensitivity of 84%. NMN was the most sensitive single diagnostic metabolite with overall sensitivity of 89%. When all 8 metabolites were combined, a diagnostic sensitivity of 95% was achieved."
    explanation: >-
      In patients at diagnosis, VMA and HVA together had a diagnostic
      sensitivity of 84%, below the classical figure of more than 90%;
      combining all eight urinary metabolites measured raised it to 95%.
      Normetanephrine (NMN) alone reached 89%.
  - reference: PMID:31724812
    reference_title: "Biochemical testing for neuroblastoma using plasma free 3-O-methyldopa, 3-methoxytyramine, and normetanephrine."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Overall, 94 of the 96 patients with neuroblastoma had concentrations of 3-methoxytyramine or normetanephrine above age-specific upper limits of reference intervals, providing a diagnostic sensitivity of 97.9% that was higher (P < 0.0001) than that of 82.2% for HVA and VMA."
    explanation: >-
      A second diagnostic series: urinary HVA and VMA had a diagnostic
      sensitivity of 82.2%, lower than the 97.9% of plasma 3-methoxytyramine
      or normetanephrine. The abstract does not give the denominator for the
      urinary comparison.
  - reference: PMID:8790511
    reference_title: "Screening for neuroblastoma: a review of the evidence."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The screening test consists of measurements of the levels of vanillylmandelic acid and homovanillic acid in the urine; these metabolites of catecholamine are excreted in the urine of 92% of patients with clinically presenting neuroblastoma."
    explanation: >-
      The classical review figure for the VMA and HVA pair: 92% of patients
      with clinically presenting neuroblastoma, stated without a source cohort
      in the abstract.
  - reference: PMID:15235064
    reference_title: "Neuroblastoma: a disease requiring a multitude of imaging studies."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Origin from precursors of the sympathetic nervous system accounts for (a) primary sites in adrenal glands and in paraspinal locations from neck to pelvis and (b) high urinary levels of catecholamines in >90% of cases."
    explanation: >-
      A review statement of high urinary catecholamine levels in more than 90%
      of cases. It refers to urinary catecholamines in general rather than to
      VMA and HVA specifically.
  - reference: PMID:12932669
    reference_title: "Tumour markers are poor predictors for relapse or progression in neuroblastoma."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "At diagnosis, we found abnormal results in 75% for VMA and/or HVA (s), 92% for VMA and/or HVA (u), 90% for NSE, and 81% for LDH."
    explanation: >-
      In patients who later relapsed or progressed after first-line treatment,
      urinary (u) VMA and/or HVA had been abnormal in 92% at diagnosis (serum
      (s) 75%). The cohort is restricted to patients who relapsed or
      progressed, so it is not an unselected diagnostic series.
  - reference: PMID:12932669
    reference_title: "Tumour markers are poor predictors for relapse or progression in neuroblastoma."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Relapse or progression in neuroblastoma cannot be detected reliably by monitoring tumour markers alone."
    explanation: >-
      Qualifies the use of these markers in follow-up: in patients who
      relapsed or progressed after first-line treatment, the authors conclude
      that monitoring tumour markers, which in this study included urinary and
      serum VMA and HVA, does not reliably detect relapse or progression on
      its own.
- name: Neuron-Specific Enolase
  presence: INCREASED
  biomarker_term:
    preferred_term: neuron-specific enolase
    term:
      id: NCIT:C62216
      label: Gamma-Enolase
  notes: >-
    Serum neuron-specific enolase (NSE) is raised at diagnosis in most children
    with metastatic (stage IV) neuroblastoma: in a Children's Cancer Study Group
    series of 122 such children, 96% had levels more than three standard
    deviations above the mean for age-matched normal children. In a series of 61
    children with neuroblastoma of all stages, sampled at diagnosis, median
    serum NSE was 13, 23, 40 and 214 ng/ml in stages I, II, III and IV, whereas
    stage IV-S levels (median 40 ng/ml) were significantly lower than stage IV
    levels despite extensive tumor burden, so NSE does not simply track tumor
    burden. In stage III and IV disease in that series, a level above 100 ng/ml
    was associated with poor outcome, and the stage IV series, which shares its
    lead authors, suggested the same for stage IV disease. In a cohort
    restricted to 196 patients who had successfully completed first-line
    treatment and later relapsed or progressed, NSE had been abnormal at
    diagnosis in 90%, but that study's abstract does not say how many of them
    had NSE measured or in which specimen.
  evidence:
  - reference: PMID:12932669
    reference_title: "Tumour markers are poor predictors for relapse or progression in neuroblastoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "We analysed the data of neuroblastoma patients who had successfully completed first-line treatment and had laboratory results available from their initial diagnosis and from relapse/progression (n=196). ... At diagnosis, we found abnormal results in 75% for VMA and/or HVA (s), 92% for VMA and/or HVA (u), 90% for NSE, and 81% for LDH."
    explanation: >-
      In a cohort restricted to 196 patients who had successfully completed
      first-line treatment and had laboratory results from both initial
      diagnosis and relapse or progression, NSE results at diagnosis had been
      abnormal in 90%. Every patient in it went on to relapse or progress, so
      this is a cohort selected on outcome, not an unselected diagnostic series.
      The abstract does not say how many of the 196 had NSE measured, in which
      specimen, or against what cut-off, so 196 is the cohort size rather than
      the NSE denominator.
  - reference: PMID:3002599
    reference_title: "Serum neuron-specific enolase in children with neuroblastoma. Relationship to stage and disease course."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum neuron-specific enolase (NSE) was measured in 61 children at diagnosis with all stages of neuroblastoma. The median serum values for Stages I, II, III, IV, and IV-S were 13, 23, 40, 214, and 40 ng/ml, respectively. ... In patients with Stages III and IV disease, a raised serum NSE level was associated with poor outcome: only 1/19 (5%) survived with NSE levels greater than 100 ng/ml, whereas survival was 5/8 (63%) with values below 100 ng/ml. ... In patients with Stage IV-S disease serum NSE levels were significantly lower than those in Stage IV despite their extensive tumor burden."
    explanation: >-
      In a series of 61 children with neuroblastoma of all stages, sampled at
      diagnosis, median serum NSE was 13, 23, 40 and 214 ng/ml in stages I, II,
      III and IV, and 40 ng/ml in stage IV-S. The authors report stage IV-S
      levels as significantly lower than stage IV levels despite extensive tumor
      burden, so serum NSE does not simply track tumor burden. In stage III and
      IV disease, 1 of 19 patients (5%) with NSE above 100 ng/ml survived,
      against 5 of 8 (63%) with values below 100 ng/ml. Limitations: this
      comparison rests on 19 patients above and 8 below the cut-off, and the
      abstract gives no significance test for it and does not report it within
      stage III or stage IV separately, so from the abstract the effect of NSE
      cannot be separated from that of stage. Staging follows the Roman-numeral
      system then in use (stages I to IV and IV-S), and the 100 ng/ml cut-off
      was set with an assay of that era and may not transfer to current
      immunoassays.
  - reference: PMID:6135871
    reference_title: "Raised neuron-specific enolase in serum of children with metastatic neuroblastoma. A report from the Children's Cancer Study Group."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Serum levels of neuron-specific enolase (NSE) were measured by radioimmunoassay at diagnosis in 122 children with widespread metastatic neuroblastoma (clinical stage IV). 96% of these patients had NSE levels more than three standard deviations above the mean for age-matched normal children. ... Analysis of survival in relation to the level of NSE at diagnosis suggested that serum levels greater than 100 ng/ml were associated with a poor outcome. This relation was highly significant in the subgroup of infants less than 1 year old at diagnosis; all 7 with serum NSE below 100 ng/ml were alive up to 36 months after diagnosis, whereas 7 of 8 with serum NSE above 100 ng/ml died within 12 months of diagnosis."
    explanation: >-
      In a Children's Cancer Study Group series of 122 children with stage IV
      neuroblastoma sampled at diagnosis, 96% had serum NSE more than three
      standard deviations above the mean for age-matched normal children, and
      survival analysis suggested that levels above 100 ng/ml were associated
      with poor outcome. The abstract reports this relation as highly
      significant in the subgroup of infants under 1 year at diagnosis (all 7
      below 100 ng/ml alive up to 36 months; 7 of 8 above it dead within 12
      months) and gives no significance level for the stage IV group as a whole.
      It therefore supports raised NSE in stage IV disease only, not in
      neuroblastoma generally. Its stage IV finding is consistent with the 100
      ng/ml threshold that PMID:3002599 reported for stage III and IV disease
      combined, but the studies share their lead authors, so their patients may
      overlap and they are not independent replications.
genetic:
- name: MYCN Amplification
  association: Oncogene Amplification
  gene_term:
    preferred_term: MYCN
    term:
      id: hgnc:7559
      label: MYCN
  notes: >-
    MYCN amplification occurs in approximately 20% of neuroblastomas overall;
    in a Children's Oncology Group cohort of 4,672 patients, 845 (18.1%) had
    amplification and a further 133 (2.8%) had MYCN gain, a smaller
    copy-number increase below the amplification threshold. MYCN
    amplification is among the most powerful adverse genomic prognostic
    markers, used alongside stage, age, histology, 11q status, and ploidy for
    risk stratification. The proportion depends strongly on stage: in the
    original 1984 series of untreated tumors, amplification was found in none
    of 15 patients with stage 1 or 2 disease but in 24 of 48 with stage 3 or
    4 disease.
  evidence:
  - reference: PMID:19047291
    reference_title: "The International Neuroblastoma Risk Group (INRG) classification system: an INRG Task Force report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stage, age, histologic category, grade of tumor differentiation, the status of the MYCN oncogene, chromosome 11q status, and DNA ploidy were the most highly statistically significant and clinically relevant factors."
    explanation: >-
      The INRG Task Force analysis of 8,800 patients establishes MYCN status
      as one of the most statistically significant prognostic factors, and
      places it alongside (not above) stage, age, histology, 11q status, and
      ploidy in risk classification.
  - reference: PMID:6719137
    reference_title: "Amplification of N-myc in untreated human neuroblastomas correlates with advanced disease stage."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "N-myc amplification is highly correlated with advanced stages of disease"
    explanation: >-
      The original Brodeur series in untreated primary tumors established the
      association of MYCN amplification with advanced-stage disease.
  - reference: PMID:6719137
    reference_title: "Amplification of N-myc in untreated human neuroblastomas correlates with advanced disease stage."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Amplification was found in 0 of 15 patients with stage 1 or 2 disease, whereas 24 of 48 cases (50 percent) with stage 3 or 4 had evidence of N-myc amplification."
    explanation: >-
      The stage dependence given in the notes: in the original series,
      amplification was found in none of 15 stage 1-2 tumors and in 24 of 48
      (50%) stage 3-4 tumors, so cohorts weighted toward advanced stage report
      higher frequencies than the overall figure.
  - reference: PMID:28696504
    reference_title: "Association of MYCN copy number with clinical features, tumor biology, and outcomes in neuroblastoma: A report from the Children's Oncology Group."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Among 4672 patients, 3694 (79.1%) had MYCN wild-type tumors, 133 (2.8%) had MYCN gain, and 845 (18.1%) had MNA."
    explanation: >-
      A primary cohort figure consistent with the rounded approximately 20%:
      of 4,672 Children's Oncology Group patients, 845 (18.1%) had MYCN
      amplification (MNA) and 133 (2.8%) had MYCN gain, which in this paper
      is a smaller increase below the amplification threshold.
  - reference: PMID:25345447
    reference_title: "Neuroblastoma models for insights into tumorigenesis and new therapies."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "MYCN amplification is found in about 20% of cases"
    explanation: >-
      A review statement of the rounded figure, about 20% of cases. The
      review's subject is mouse models; this sentence restates the human
      clinical figure.
- name: ALK Mutations
  association: Oncogenic Driver Mutations
  gene_term:
    preferred_term: ALK
    term:
      id: hgnc:427
      label: ALK
  notes: >-
    ALK point mutations occur in approximately 8-10% of neuroblastomas at
    diagnosis; in 1,596 diagnostic samples, three hotspot residues accounted
    for 85% of the mutations: R1275 (43%), F1174 (30%) and F1245 (12%).
    Germline activating ALK mutations are the major cause of hereditary
    (familial) neuroblastoma, making ALK the principal familial neuroblastoma
    predisposition gene, and R1275Q is the most frequent germline mutation.
    Published estimates of the share of familial cases carrying a germline
    ALK mutation range from about 50% to 80%: the group that mapped ALK as
    the major familial gene reported more than 50%, one review gives 50%, and
    two others give 75% and 80%. Together with PHOX2B, ALK accounts for most
    familial cases. ALK is a therapeutic target for crizotinib and, in
    current frontline cooperative-group trials, lorlatinib.
  evidence:
  - reference: PMID:32296467
    reference_title: "Nervous system: Embryonal tumors: Neuroblastoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The primary predisposition genes in familial neuroblastoma are ALK and PHOX2B."
    explanation: >-
      Identifies ALK as a primary predisposition gene in familial
      neuroblastoma, consistent with its role as an oncogenic driver.
  - reference: PMID:18724359
    reference_title: "Identification of ALK as a major familial neuroblastoma predisposition gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our results demonstrate that heritable mutations of ALK are the main cause of familial neuroblastoma, and that germline or acquired activation of this cell-surface kinase is a tractable therapeutic target for this lethal paediatric malignancy."
    explanation: >-
      The linkage-plus-resequencing study in neuroblastoma pedigrees that
      established heritable ALK mutation as the main cause of familial
      neuroblastoma and ALK as the principal familial predisposition gene.
  - reference: PMID:18724359
    reference_title: "Identification of ALK as a major familial neuroblastoma predisposition gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Resequencing in 194 high-risk neuroblastoma samples showed somatically acquired mutations in the tyrosine kinase domain in 12.4% of samples."
    explanation: >-
      Quantifies somatic ALK tyrosine-kinase-domain mutation in a high-risk
      cohort at 12.4%; the 8-10% figure cited in the notes refers to
      unselected neuroblastoma, which is enriched for lower-risk disease.
  - reference: PMID:25517749
    reference_title: "ALK mutations confer differential oncogenic activation and sensitivity to ALK inhibition therapy in neuroblastoma."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "We describe comprehensive genomic, biochemical, and computational analyses of ALK mutations across 1,596 diagnostic neuroblastoma samples. ALK tyrosine kinase domain mutations occurred in 8% of samples--at three hot spots and 13 minor sites--and correlated significantly with poorer survival in high- and intermediate-risk neuroblastoma."
    explanation: >-
      ALK tyrosine kinase domain mutations in 8% of 1,596 diagnostic
      neuroblastoma samples, the lower end of the approximately 8-10% figure
      in the notes. The count is of tumors carrying a mutation, so on its own
      it does not separate somatic from germline events.
  - reference: PMID:26059187
    reference_title: "Deep Sequencing Reveals Occurrence of Subclonal ALK Mutations in Neuroblastoma at Diagnosis."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "In this series, deep sequencing allows the detection of F1174 and R1275 ALK mutational events at diagnosis in 10% of cases, with subclonal events in more than half of these, which would have gone undetected by Sanger sequencing."
    explanation: >-
      The upper end of the approximately 8-10% figure: targeted deep
      sequencing of the F1174 and R1275 hotspots found ALK mutations in 10% of
      cases at diagnosis, more than half of them subclonal events that Sanger
      sequencing would have missed.
  - reference: PMID:29589100
    reference_title: "Genetic susceptibility to neuroblastoma: current knowledge and future directions."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "It is estimated that gain-of-function mutations in ALK account for 75% of familial neuroblastoma."
    explanation: >-
      A review estimate of 75%: ALK gain-of-function mutations account for 75%
      of familial neuroblastoma. The sentence is in the review's full text,
      not its abstract.
  - reference: PMID:38791942
    reference_title: "The Neuroblastoma Microenvironment, Heterogeneity and Immunotherapeutic Approaches."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline mutations in the anaplastic lymphoma kinase (ALK) gene are found in 80% of familial cases"
    explanation: >-
      A review statement of 80%, the upper end of the range in the notes:
      germline ALK mutations in 80% of familial cases. It is a passing
      statement in the full text of a review of the tumor microenvironment.
  - reference: PMID:21734404
    reference_title: "Genome-wide linkage analysis to identify genetic modifiers of ALK mutation penetrance in familial neuroblastoma."
    supports: SUPPORT
    quote_role: BACKGROUND
    evidence_source: HUMAN_CLINICAL
    snippet: "Following a genome-wide linkage analysis and sequencing of candidate genes in the critical region, we identified ALK as the major familial NB gene. Dominant mutations in ALK are found in more than 50% of familial NB cases."
    explanation: >-
      A lower estimate, from the group that mapped ALK as the major familial
      gene: dominant ALK mutations in more than 50% of familial cases. It is
      the background section of a later linkage study of ALK penetrance, not
      a new count.
  - reference: PMID:28674118
    reference_title: "Retinoblastoma and Neuroblastoma Predisposition and Surveillance."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline mutations in ALK and PHOX2B account for most familial NB cases."
    explanation: >-
      A predisposition-workshop review stating that germline ALK and PHOX2B
      mutations together account for most familial cases, supporting the
      combined clause of the notes; it gives no share for ALK alone.
  - reference: PMID:25345447
    reference_title: "Neuroblastoma models for insights into tumorigenesis and new therapies."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Anaplastic lymphoma kinase (ALK) mutation is also found in 7% of sporadic neuroblastomas and 50% of familial neuroblastomas."
    explanation: >-
      A review figure at the low end of the published range: ALK mutation in
      50% of familial neuroblastomas. The same sentence gives 7% for sporadic
      tumors, close to the 8% diagnostic-cohort figure above.
  - reference: PMID:25517749
    reference_title: "ALK mutations confer differential oncogenic activation and sensitivity to ALK inhibition therapy in neuroblastoma."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three 'hotspot' residues accounted for 85% of mutations (Figure 1, Table 1): R1275 (43%), F1174 (30%), and F1245 (12%)"
    explanation: >-
      The distribution of ALK mutations by residue in the same 1,596-sample
      cohort: R1275, F1174 and F1245 together account for 85%. The sentence is
      in the paper's full text.
  - reference: PMID:28674118
    reference_title: "Retinoblastoma and Neuroblastoma Predisposition and Surveillance."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Germline mutations in ALK encode for single-base substitutions in key regions of the kinase domain that result in constitutive activation of the kinase, with the R1275Q mutation most frequently observed (Table 2)."
    explanation: >-
      Supports R1275Q as the most frequent germline ALK mutation, and germline
      ALK variants as activating kinase-domain substitutions. The sentence is
      in the review's full text.
- name: Segmental Chromosomal Aberrations
  association: Prognostic Markers
  notes: >-
    Segmental chromosomal aberrations including 1p deletion, 11q deletion,
    and 17q gain are associated with worse prognosis and help define
    risk stratification. Chromosome 11q status is one of the factors formally
    incorporated into the INRG classification system; 11q deletion is
    characteristically found in MYCN-non-amplified high-risk disease.
  evidence:
  - reference: PMID:19047291
    reference_title: "The International Neuroblastoma Risk Group (INRG) classification system: an INRG Task Force report."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Stage, age, histologic category, grade of tumor differentiation, the status of the MYCN oncogene, chromosome 11q status, and DNA ploidy were the most highly statistically significant and clinically relevant factors."
    explanation: >-
      Establishes chromosome 11q status as a statistically significant,
      clinically relevant prognostic factor in a large patient cohort and as a
      formal component of INRG risk classification.
  - reference: PMID:41560679
    reference_title: "Coexpression of MYCN and ALK Induces Neuroblastoma-Like Tumors From Human iPS Cell-Derived Cranial Neural Crest Cells."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: "we identified key features of NB, including loss of NF1 and gain of 17q chromosome, which are critical for the development of malignant tumor."
    explanation: >-
      Supports 17q gain specifically, as a feature the study's own expression
      profiling and exome sequencing identified in MYCN/ALK-induced clones of
      iPSC-derived cranial neural crest cells, cells that formed
      neuroblastoma-like tumors when transplanted into immunodeficient mice;
      it is not patient-derived prognostic data. Indirect for this record: the
      sentence calls 17q gain critical for malignant tumor development in a
      model system, and an association with worse prognosis in patients
      follows only by inference. It does not address 1p or 11q deletion; of
      the record's prognostic claim, the INRG item above covers 11q status
      only.
- name: TERT Rearrangement
  association: Telomere Maintenance Activation
  gene_term:
    preferred_term: TERT
    term:
      id: hgnc:11730
      label: TERT
  notes: >-
    Genomic rearrangements juxtaposing enhancers to the TERT locus drive massive
    TERT upregulation and telomerase-mediated telomere maintenance. TERT
    rearrangement occurs in high-risk disease and is largely mutually exclusive
    with MYCN amplification and ATRX mutation. Like MYCN amplification, it is a
    genomic route into telomerase activation, one of the two telomere
    maintenance mechanisms in neuroblastoma.
  evidence:
  - reference: PMID:26466568
    reference_title: "Telomerase activation by genomic rearrangements in high-risk neuroblastoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "These rearrangements occurred only in high-risk neuroblastomas (12/39, 31%) in a mutually exclusive fashion with MYCN amplifications and ATRX mutations, which are known genetic events in this tumour type."
    explanation: >-
      Establishes TERT rearrangement as a high-risk-restricted event in the
      whole-genome discovery series, where it was mutually exclusive with MYCN
      amplification and ATRX mutation.
  - reference: PMID:26466568
    reference_title: "Telomerase activation by genomic rearrangements in high-risk neuroblastoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "TERT rearrangements defined a subgroup of high-risk tumours with particularly poor outcome."
    explanation: Links TERT rearrangement to adverse outcome in an extended case series.
- name: ATRX Mutation
  association: Alternative Lengthening of Telomeres
  gene_term:
    preferred_term: ATRX
    term:
      id: hgnc:886
      label: ATRX
  notes: >-
    Somatic ATRX alterations, most often multi-exon deletions, are the commonest
    known lesion behind alternative lengthening of telomeres (ALT) in
    neuroblastoma, although many ALT tumours carry none. ATRX alteration is
    strongly age-dependent, rare in infancy and most frequent in adolescents and
    young adults, and it is almost mutually exclusive with MYCN amplification.
    The clinical course is often slow but progressive. Poor response to standard
    induction chemotherapy has been reported for large ATRX deletions and
    truncating mutations in one two-centre retrospective cohort, and
    chemo-resistance with late recurrence in a small series of ATRX- or
    DAXX-altered tumours.
  evidence:
  - reference: PMID:22416102
    reference_title: "Association of age at diagnosis and genetic mutations in patients with neuroblastoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "ATRX mutations were associated with an absence of the ATRX protein in the nucleus and with long telomeres."
    explanation: >-
      Links ATRX mutation to loss of nuclear ATRX protein and to the long
      telomeres characteristic of alternative lengthening of telomeres.
  - reference: PMID:22416102
    reference_title: "Association of age at diagnosis and genetic mutations in patients with neuroblastoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "ATRX mutations were associated with age at diagnosis in children and young adults with stage 4 neuroblastoma."
    explanation: >-
      This is the conclusion of a retrospective study of 104 patients with stage
      4 neuroblastoma. ATRX mutations were found by whole-genome sequencing in a
      40-patient discovery cohort and by PCR and Sanger sequencing in a
      64-patient validation cohort, in tumours from 14 of 32 adolescents and
      young adults, 9 of 54 children and none of 18 infants, which supports the
      age dependence of ATRX alteration. Patients were sampled to represent each
      age group, so these are per-age-group rates, not an overall frequency.
  - reference: PMID:42558321
    reference_title: "ATRX large deletions and truncating mutations are associated with primary induction chemotherapy resistance in high-risk neuroblastoma: a multicenter propensity-weighted cohort study."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Compared with the WT group (71.0%), the LDT group exhibited a substantially lower ORR (36.0%; P < 0.001), with a primary induction-refractory rate of 64.0%."
    explanation: >-
      A retrospective cohort at two Chinese hospitals compared 33 high-risk
      neuroblastomas carrying large ATRX deletions or truncating mutations with
      92 ATRX wild-type tumours, scoring response to multi-agent,
      platinum-containing induction by blinded central review. The objective
      response rate was 36% against 71%, and the quoted 64% induction-refractory
      rate is the complement of that response rate rather than a separate
      measurement. The figures are propensity-weighted estimates from one
      unreplicated cohort of 33 such tumours, and missense ATRX variants did not
      differ from wild-type.
  - reference: PMID:25487495
    reference_title: "Clinical features of ATRX or DAXX mutated neuroblastoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "ATRX altered cases without MYCN amplification detected at greater than 18months showed poor prognosis, suggesting that ATRX or DAXX alterations are a particular NBL subtype. Since these tumors showed chemo-resistance and late recurrence, complete resection in a surgical approach should be performed to improve patient prognosis."
    explanation: >-
      Among 121 neuroblastomas, all 11 ALT tumours carried ATRX (10) or DAXX (1)
      alterations, and the authors conclude that this ATRX/DAXX-altered subtype
      showed chemo-resistance and late recurrence. Only that observation is
      cited, not the complete-resection recommendation that follows it. The
      abstract presents no chemotherapy-response or relapse data and reports
      poor prognosis only for the seven ALT cases detected after 18 months of
      age. Its purpose statement says the group had already reported ALT as a
      possible biomarker of chemotherapy response and late recurrence; the
      ATRX/DAXX genotype is the new element.
  - reference: PMID:22416102
    reference_title: "Association of age at diagnosis and genetic mutations in patients with neuroblastoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Specifically, patients with ATRX mutations, ultrabright telomere FISH signal characteristic of ALT, loss of nuclear ATRX protein and absence of MYCN gain may be more likely to have a chronic but progressive clinical course with standard therapeutic approaches and may require a different treatment strategy."
    explanation: >-
      This retrospective genomic study of 104 patients with advanced-stage
      neuroblastoma hedges its own conclusion: patients whose tumors combine
      ATRX mutation, the ultrabright telomere FISH signal of ALT, nuclear ATRX
      loss and no MYCN gain 'may be more likely' to follow a chronic but
      progressive course with standard therapy and 'may require' a different
      treatment strategy. The study tests neither: its course data are
      descriptive (4 of 5 ATRX-mutant children in the discovery cohort lived at
      least twice as long as their time to first relapse), and it has no
      treatment-response analysis.
  - reference: PMID:35384159
    reference_title: "Mutational spectrum of ATRX aberrations in neuroblastoma and associated patient and tumor characteristics."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "We subdivide the ATRX aberrations into nonsense, missense, and multiexon deletions (MEDs) and show that 68% of them are MEDs. Of these MEDs, 75% are predicted to be in-frame."
    explanation: >-
      This meta-analysis pooled 127 neuroblastoma patients and three cell lines
      with ATRX aberrations from 20 published papers and found that 68% of the
      aberrations were multi-exon deletions, the commonest class, and that 75%
      of these were predicted to be in-frame. All but two of the tumours were
      stage 4, and the pooled series are published cases rather than an
      unselected cohort.
  - reference: PMID:32291317
    reference_title: "Telomere Maintenance Mechanisms Define Clinical Outcome in High-Risk Neuroblastoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "ALT was identified in 23.4% of high-risk neuroblastoma tumors and genomic alterations in ATRX were detected in 60% of ALT tumors; 40% of ALT tumors lacked genomic alterations in known ALT-associated genes."
    explanation: >-
      In a Children's Oncology Group cohort of high-risk primary tumours, ATRX
      alterations were found in 60% of the tumours with ALT, and the other 40%
      had no alteration in known ALT-associated genes. ATRX is therefore the
      commonest known altered gene behind ALT, while many ALT tumours carry no
      known lesion. The cohort is high-risk only.
  - reference: PMID:32060267
    reference_title: "MYCN amplification and ATRX mutations are incompatible in neuroblastoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "In the cohort of 819 tumors, ATRX mutations (n = 64) and MYCN amplification (n = 140) showed statistically significant mutual exclusivity (p = 0.0037, Cochrane-Mantel-Haenszel test) (Fig. 1e and Supplementary Note 1). Only 1 of 819 (0.1%) tumors had both lesions."
    explanation: >-
      In patient tumours pooled from three sequencing datasets (819 tumours),
      ATRX mutation and MYCN amplification were significantly mutually exclusive
      and only one tumour carried both, so the exclusivity is near-complete
      rather than absolute.
- name: PHOX2B
  association: Germline Predisposition
  gene_term:
    preferred_term: PHOX2B
    term:
      id: hgnc:9143
      label: PHOX2B
  notes: >-
    PHOX2B is a master regulator of autonomic nervous system development and,
    with ALK, one of the two primary familial neuroblastoma predisposition
    genes; it was the first neuroblastoma predisposition gene to be
    identified. Germline PHOX2B mutations cause neuroblastoma predisposition
    that may co-occur with other neurocristopathies — Hirschsprung disease
    and congenital central hypoventilation syndrome — reflecting a shared
    neural-crest developmental origin.
  evidence:
  - reference: PMID:32296467
    reference_title: "Nervous system: Embryonal tumors: Neuroblastoma."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The primary predisposition genes in familial neuroblastoma are ALK and PHOX2B."
    explanation: >-
      Identifies PHOX2B alongside ALK as one of the two primary familial
      neuroblastoma predisposition genes.
  - reference: PMID:29589100
    reference_title: "Genetic susceptibility to neuroblastoma: current knowledge and future directions."
    supports: SUPPORT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "These cases of neuroblastoma comorbid with other neural crest-implicated diseases facilitated the discovery of the first neuroblastoma predisposition gene, the paired-like homeobox 2B gene (PHOX2B) (Mosse et al. 2004; Trochet et al. 2004)."
    explanation: >-
      States that PHOX2B was the first neuroblastoma predisposition gene to be
      identified, through cases that co-occurred with other neural crest
      disorders. The sentence is in the review's full text.
treatments:
- name: Risk-Adapted Chemotherapy
  description: >-
    Chemotherapy intensity varies by risk group. Low-risk patients may need
    only observation or minimal chemotherapy. High-risk patients receive
    intensive induction chemotherapy including cisplatin, etoposide,
    vincristine, cyclophosphamide, doxorubicin, and topotecan.
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: cisplatin
      term:
        id: CHEBI:27899
        label: cisplatin
    - preferred_term: etoposide
      term:
        id: CHEBI:4911
        label: etoposide
    - preferred_term: cyclophosphamide
      term:
        id: CHEBI:4027
        label: cyclophosphamide
- name: Surgical Resection
  description: >-
    Surgery for primary tumor resection is performed after chemotherapy for
    high-risk disease. Complete resection is associated with better outcomes
    when achievable without significant morbidity.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Definitive Surgical Resection
    term:
      id: NCIT:C154430
      label: Definitive Surgical Resection
- name: Autologous Stem Cell Transplant
  description: >-
    High-dose chemotherapy with autologous stem cell rescue is standard for
    high-risk neuroblastoma following induction chemotherapy and surgical
    resection. Tandem transplant may provide additional benefit.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
- name: Radiation Therapy
  description: >-
    Radiation to the primary tumor bed is used in high-risk disease following
    surgical resection and stem cell transplant.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: Radiation Therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
- name: Anti-GD2 Immunotherapy
  description: >-
    Anti-GD2 monoclonal antibody (dinutuximab) combined with GM-CSF and IL-2
    has significantly improved outcomes in high-risk neuroblastoma during
    maintenance therapy. GD2 is highly expressed on neuroblastoma cells.
  treatment_term:
    preferred_term: immunotherapy procedure
    term:
      id: NCIT:C15262
      label: Immunotherapy
- name: ALK Inhibitor Therapy
  description: >-
    ALK tyrosine kinase inhibition targets the constitutive ALK signalling
    produced by activating ALK point mutations or ALK amplification. The
    first-generation inhibitor crizotinib has limited activity against several
    common neuroblastoma ALK variants (notably F1174L), which motivated the
    move to third-generation, CNS-penetrant inhibitors; lorlatinib is under
    evaluation in frontline cooperative-group trials for ALK-altered
    high-risk disease. Applicable only to the ALK-altered molecular subset.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: crizotinib
      term:
        id: CHEBI:64310
        label: crizotinib
    - preferred_term: lorlatinib
      term:
        id: CHEBI:143117
        label: lorlatinib
  target_mechanisms:
  - target: ALK Signaling Activation
    description: >-
      ATP-competitive inhibition of the ALK tyrosine kinase domain abolishes
      the constitutive receptor autophosphorylation produced by activating
      ALK mutations, removing the downstream proliferative signal.
    evidence:
    - reference: PMID:18724359
      reference_title: "Identification of ALK as a major familial neuroblastoma predisposition gene."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Mutations resulted in constitutive phosphorylation, and targeted knockdown of ALK messenger RNA resulted in profound inhibition of growth in all cell lines harbouring mutant or amplified ALK"
      explanation: >-
        Establishes ALK dependence of ALK-mutant and ALK-amplified
        neuroblastoma cells, the mechanistic rationale for ALK-directed
        therapy. Genetic knockdown rather than pharmacologic inhibition.
- name: Isotretinoin (Retinoic Acid)
  description: >-
    13-cis-retinoic acid (isotretinoin) is given during maintenance therapy
    to promote differentiation of residual neuroblastoma cells and reduce
    relapse risk.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: isotretinoin
      term:
        id: CHEBI:6067
        label: isotretinoin
animal_models:
- name: Xenopus anteroventral noradrenergic (AVNA) cell differentiation model
  species: Xenopus laevis
  genotype: >-
    Embryos expressing wild-type Ascl1, a phospho-mutant Ascl1 that cannot be
    phosphorylated at serine-proline motifs, CDKs, or MYCN, with Ascl1
    morpholino knockdown
  category: Developmental model of the presumed cell of origin
  publication: PMID:25786414
  description: >-
    Rather than growing a tumour, this model reconstructs the normal
    differentiation of the neural-crest-derived sympathoadrenal cell that
    neuroblastoma is thought to arise from, and asks what stops it. Frog AVNA
    cells differentiate under transient Ascl1 expression; in neuroblastoma cells
    Ascl1 is instead persistently expressed and multiply phosphorylated.
    Introducing that phospho-state into the frog cells blocks their
    differentiation, and CDK or MYCN overexpression blocks it too — but not when
    Ascl1 cannot be phosphorylated, which places phosphorylation downstream of
    both. The model tests the differentiation-arrest hypothesis in a normal
    developmental context; it does not produce tumours and so says nothing about
    transformation, growth, or metastasis.
  genes:
  - preferred_term: ASCL1
    term:
      id: hgnc:738
      label: ASCL1
  - preferred_term: MYCN
    term:
      id: hgnc:7559
      label: MYCN
  modeled_mechanisms:
  - target: Neural Crest Developmental Arrest
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Supplies a molecular switch for the arrest this node asserts: multi-site
      phosphorylation of Ascl1 converts it from a driver of sympathoadrenal
      differentiation into an inert factor, matching the phospho-state Ascl1 is
      held in within neuroblastoma cells.
    limitations: >-
      Frog AVNA cells are a developmental counterpart of the presumed cell of
      origin, not tumour cells, and the model contains no transformed tissue —
      arrest is scored as failure to differentiate on schedule rather than as
      tumour formation. The link to human disease rests on the observed
      phospho-state of ASCL1 in neuroblastoma lines, so the model shows the
      state is sufficient to block differentiation, not that it is what maintains
      any patient's tumour.
    readouts:
    - name: AVNA cell differentiation driven by wild-type versus phospho-mutant Ascl1
      target: Neural Crest Developmental Arrest
      direction: DECREASED
      interpretation: >-
        Differentiation fails when Ascl1 can be multiply phosphorylated and
        proceeds when it cannot, isolating phospho-status as the controlling
        variable.
      evidence:
      - reference: PMID:25786414
        reference_title: "Ascl1 phospho-status regulates neuronal differentiation in a Xenopus developmental model of neuroblastoma."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "ability to induce differentiation of AVNA cells is inhibited by its multi-site phosphorylation at serine-proline motifs"
        explanation: States the measured effect of Ascl1 phospho-status on differentiation in this model.
    evidence:
    - reference: PMID:25786414
      reference_title: "Ascl1 phospho-status regulates neuronal differentiation in a Xenopus developmental model of neuroblastoma."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we use Xenopus frog embryos to characterise the differentiation of anteroventral noradrenergic (AVNA) cells, cells derived from the neural crest."
      explanation: Establishes what the model is and that its cells are neural crest derived.
    - reference: PMID:25786414
      reference_title: "Ascl1 phospho-status regulates neuronal differentiation in a Xenopus developmental model of neuroblastoma."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We find that the transcriptional regulator Ascl1 is expressed transiently in normal AVNA cell differentiation but its expression is aberrantly maintained in NB cells, where it is largely phosphorylated on multiple sites."
      explanation: >-
        The neuroblastoma-cell half of this comparison is cell-based, and it is
        what connects the frog readout to the human disease state.
  - target: MYCN-Driven Proliferation
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Positions MYCN upstream of the differentiation block: MYCN overexpression
      prevents Ascl1-driven differentiation, and loses that ability when Ascl1
      cannot be phosphorylated.
    limitations: >-
      This is the differentiation-blocking arm of MYCN only. The node is about
      proliferation, and no proliferative or tumour-growth readout was taken
      here; MYCN is introduced by overexpression in a normal embryo, not by the
      genomic amplification that defines high-risk neuroblastoma.
    readouts:
    - name: Ascl1-driven AVNA differentiation under CDK or MYCN overexpression
      target: MYCN-Driven Proliferation
      direction: DECREASED
      interpretation: >-
        The epistasis result: MYCN and CDKs block differentiation only when Ascl1
        is phosphorylatable, so their effect on this cell fate runs through Ascl1
        phospho-status.
      evidence:
      - reference: PMID:25786414
        reference_title: "Ascl1 phospho-status regulates neuronal differentiation in a Xenopus developmental model of neuroblastoma."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "overexpression of cyclin-dependent kinases (CDKs) and MYCN inhibit wild-type Ascl1-driven AVNA differentiation, but not differentiation driven by a phospho-mutant form of Ascl1"
        explanation: Reports the measured differentiation block and the phospho-mutant control that makes it interpretable.
    evidence:
    - reference: PMID:25786414
      reference_title: "Ascl1 phospho-status regulates neuronal differentiation in a Xenopus developmental model of neuroblastoma."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This suggests that the maintenance of ASCL1 in its multiply phosphorylated state might prevent terminal differentiation in NB, which could offer new approaches for differentiation therapy in NB."
      explanation: >-
        The authors put the therapeutic and disease-level reading as a
        suggestion, which is the level of support this link carries.

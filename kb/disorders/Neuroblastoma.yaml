imaging_findings:
- name: MIBG-Avid Disease
  modality: OTHER
  frequency: VERY_FREQUENT
  description: >-
    Uptake of MIBG at the sites of disease, primary and metastatic, on 123I-MIBG
    scintigraphy. Neuroblastoma cells typically express the norepinephrine
    transporter (NET), which mediates active MIBG uptake in about 90% of
    patients; in a Cochrane review, about 10% of histologically proven
    neuroblastomas did not accumulate 123I-MIBG (recorded separately as
    MIBG-Nonavid Disease). In a small COG series of high-risk patients, the
    percentage of tumor cells expressing NET protein was higher in avid than
    nonavid tumors (P = 0.027), but the groups overlapped widely, including an
    avid tumor with no NET-expressing cells; NET mRNA measured by quantitative
    PCR did not differ significantly (P = 0.31), and neither did VMAT1 or VMAT2
    mRNA. In a later COG immunohistochemistry study of tumors from 76 patients
    with high-risk metastatic disease, avid tumors had higher composite VMAT2
    protein scores than nonavid tumors (median 216 vs 45, P = 0.04), with
    substantial overlap between the groups, while VMAT1 protein showed no
    association. In a 23-patient expression-array subset of a 343-patient COG
    cohort, NET mRNA was lower in nonavid tumors at borderline significance (P =
    0.052) while VMAT2 mRNA did not differ; the authors note that this NET
    result is contrary to their earlier PCR result and may reflect differences
    in methodology or tumor material.
  imaging_finding_term:
    preferred_term: increased 123I-MIBG uptake (MIBG avidity)
    term:
      id: NCIT:C79553
      label: Increased Uptake by 123-Iodine-Meta-Iodobenzylguanidine Scintigraphy
  notes: >-
    modality is OTHER because the whole-body survey in 123I-MIBG imaging is
    planar scintigraphy, which ImagingModalityEnum does not list. SPECT or
    SPECT/CT, which the enum does list, is often added over selected regions,
    such as the chest and abdomen or sites where tumor must be told apart from
    physiological uptake, and does not replace the whole-body images.
    NCIT:C79553 is specific to 123I-MIBG, the INRG Task Force's
    radiopharmaceutical of choice in children; two of the COG transporter
    studies cited here (PMID:23050139, PMID:26338179) read avidity from
    diagnostic 123I- or 131I-MIBG scans obtained by local institutional
    practice, and the third (PMID:28383813) does not state the isotope. NCIT has
    no isotope-neutral or 131I uptake finding to bind instead: OLS NCIT searches
    on 2026-10-21 for "MIBG uptake" and "MIBG scintigraphy" returned NCIT:C79553
    as the only finding term, "131I-MIBG" returned only the tracer NCIT:C970
    Iobenguane I-131, and "MIBG avid" returned nothing.
  evidence:
  - reference: PMID:28471719
    reference_title: "Revisions to the International Neuroblastoma Response Criteria: A Consensus Statement From the National Cancer Institute Clinical Trials Planning Meeting."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "Neuroblastoma is a tumor derived from the sympathetic nervous system, and neuroblastoma cells typically express the norepinephrine transporter, which mediates active intracellular uptake of radiolabeled MIBG in approximately 90% of patients"
    explanation: >-
      This 2017 National Cancer Institute consensus statement revising the
      International Neuroblastoma Response Criteria states that neuroblastoma
      cells typically express the norepinephrine transporter (NET), which
      mediates active MIBG uptake in approximately 90% of patients. That places
      MIBG avidity in the very frequent band (80-99% of patients) and names NET
      as the uptake route. The figure is restated from a cited earlier source,
      not measured by the consensus group, and it counts patients whose tumour
      takes up MIBG, not patients with metastases.
  - reference: PMID:26417712
    reference_title: "123I-MIBG scintigraphy and 18F-FDG-PET imaging for diagnosing neuroblastoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "As described both in the literature and in this review, in about 10% of the patients with histologically proven neuroblastoma the tumour does not accumulate ¹²³I-MIBG (false negative results)."
    explanation: >-
      This Cochrane diagnostic test accuracy review of 11 studies in children
      concludes that in about 10% of patients with histologically proven
      neuroblastoma the tumour does not take up 123I-MIBG, giving a
      false-negative scan. The figure is approximate, combining earlier
      literature with the review's own crude total false-negative rate of 11% in
      608 patients (no pooled estimate was possible), and per-study sensitivity
      ranged from 67% to 100%. The review also notes that physiological uptake
      can make small lesions less visible, so some false-negative scans may
      reflect missed lesions.
  - reference: PMID:23050139
    reference_title: "Evaluation of Norepinephrine Transporter Expression and Metaiodobenzylguanidine Avidity in Neuroblastoma: A Report from the Children's Oncology Group."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Median NET mRNA expression level for the 19 MIBG avid patients was 12.9% (range 1.6-73.7%) versus 5.9% (range 0.6-110.0%) for the 8 nonavid patients (P = 0.31). Median percent NET protein expression was 50% (range 0-100%) in MIBG avid patients compared to 10% (range 0-80%) in nonavid patients (P = 0.027)."
    explanation: >-
      This Children's Oncology Group study compared NET expression in archived
      tumour samples with centrally reviewed diagnostic 123I- or 131I-MIBG
      scans. The percentage of tumour cells staining for NET protein was higher
      in MIBG-avid than nonavid tumours (median 50% vs 10%, P = 0.027), whereas
      NET mRNA did not differ significantly (P = 0.31). Numbers were small, and
      both comparisons used only high-risk patients: 27 for mRNA (19 avid, 8
      nonavid) and 23 for protein (15 avid, 8 nonavid). Protein values
      overlapped widely, so the difference holds only at group level.
  - reference: PMID:23050139
    reference_title: "Evaluation of Norepinephrine Transporter Expression and Metaiodobenzylguanidine Avidity in Neuroblastoma: A Report from the Children's Oncology Group."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "However, these two groups showed extensive overlap in the distribution of the percent of tumor cells expressing NET, including one MIBG-avid patient with 0% NET expression"
    explanation: >-
      In a Children's Oncology Group study, 23 high-risk patients from trial
      A3973 had NET immunohistochemistry and centrally reviewed diagnostic
      123I- or 131I-MIBG scans (15 avid, 8 nonavid). The percentage of tumour
      cells expressing NET overlapped extensively between avid and nonavid
      tumours, and one MIBG-avid patient's tumour had 0% NET-expressing cells;
      the authors say this raises the possibility that factors besides NET
      protein may influence MIBG uptake. Limitations: the subset is small, and
      avid tumours still had a higher median percentage of NET-expressing cells
      (50% vs 10%, P = 0.027).
  - reference: PMID:23050139
    reference_title: "Evaluation of Norepinephrine Transporter Expression and Metaiodobenzylguanidine Avidity in Neuroblastoma: A Report from the Children's Oncology Group."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "While the median VMAT1 and VMAT2 expression levels were higher in MIBG avid tumors, none of these differences were statistically significant (P > 0.10 for all comparisons; Table 4)."
    explanation: >-
      In 27 high-risk patients from COG A3973 with centrally reviewed diagnostic
      123I- or 131I-MIBG scans (19 avid, 8 nonavid), tumour VMAT1 and VMAT2 mRNA
      measured by quantitative PCR did not differ significantly by avidity,
      although median VMAT2 mRNA was higher in avid tumours (175% vs 27% of PGK1
      expression; Table 4). The comparison is small, and in the same study NET
      mRNA correlated poorly with NET protein (correlation coefficient 0.22), so
      this mRNA result does not test the later VMAT2 protein association.
  - reference: PMID:26338179
    reference_title: "Vesicular monoamine transporter protein expression correlates with clinical features, tumor biology, and MIBG avidity in neuroblastoma: a report from the Children's Oncology Group."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "VMAT1 expression intensity category, percent of cells positive for VMAT1, and VMAT1 composite expression score were not associated with MIBG avidity (Table 2 and Fig 2b). For VMAT2, expression intensity category was not statistically associated with MIBG avidity. However, MIBG avid tumors had significantly higher VMAT2 composite expression scores compared to MIBG non-avid tumors, though there was substantial overlap between groups (median 216 vs. 45; p = 0.04; Table 2 and Fig 2c)."
    explanation: >-
      In a retrospective immunohistochemistry study of tumours from 76 patients
      with high-risk metastatic neuroblastoma on COG A3973 (centrally reviewed
      diagnostic 123I- or 131I-MIBG scans; cohort enriched with 20 nonavid
      tumours), VMAT1 was not associated with avidity on any measure (assessed
      in 74), and neither was the VMAT2 intensity category (p = 0.26), but the
      VMAT2 composite expression score was higher in avid tumours, with
      substantial overlap between the groups (median 216 vs 45, p = 0.04). VMAT2
      also correlated with NET expression, so the association may not be
      independent of NET.
  - reference: PMID:28383813
    reference_title: "MIBG avidity correlates with clinical features, tumor biology, and outcomes in neuroblastoma: A report from the Children's Oncology Group."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Of the membrane transporters investigated, only expression for the gene encoding NET differed between MIBG avid versus. nonavid tumors (Fig. 3). The median NET mRNA expression was 9.1 (range 6.3-10.1) for MIBG avid tumors versus 7.6 (range 6.1-8.6) for MIBG non-avid tumors (P =0.052)."
    explanation: >-
      In the secondary gene-expression analysis of this retrospective Children's
      Oncology Group cohort (23 patients, 18 MIBG-avid and 5 nonavid, with
      TARGET Affymetrix HuEx array data), median NET mRNA was 7.6 in nonavid
      versus 9.1 in avid tumours; Welch t-tests on log2-transformed values gave
      P = 0.052. The authors call NET the only transporter gene whose expression
      differed, but the paper states no significance threshold, and this P value
      lies just above the conventional 0.05 level. NET, one of 16 genes
      compared, was measured as mRNA only.
  - reference: PMID:28383813
    reference_title: "MIBG avidity correlates with clinical features, tumor biology, and outcomes in neuroblastoma: A report from the Children's Oncology Group."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "We demonstrated that NET mRNA expression, but not VMAT2 mRNA expression, is lower in MIBG nonavid tumors. This finding is contrary to prior work by our group that relied on polymerase chain reaction assays for NET mRNA expression and failed to demonstrate a difference in NET gene expression between MIBG avid versus nonavid tumors ... This discrepancy may reflect differences in methodology and/or tumor material between studies."
    explanation: >-
      In the 23-patient expression-array subset of this retrospective Children's
      Oncology Group cohort (18 MIBG-avid, 5 nonavid), VMAT2 mRNA did not differ
      by avidity. The authors state that the lower NET mRNA they found in
      nonavid tumours (P = 0.052) is contrary to their group's earlier PCR study
      (PMID:23050139), which found no NET mRNA difference, and suggest that
      differences in methodology or tumour material may explain the discrepancy.
      With only five nonavid tumours the sample may have been too small to
      detect differences, so the VMAT2 mRNA result is weak evidence of no
      association.
- name: MIBG-Nonavid Disease
  modality: OTHER
  frequency: OCCASIONAL
  description: >-
    Tumor that does not take up MIBG on diagnostic scintigraphy, so that the
    MIBG scan is falsely negative. In a Cochrane review, about 10% of
    histologically proven neuroblastomas did not accumulate 123I-MIBG. The INRG
    Task Force attributes such false-negative scans to low norepinephrine
    transporter expression, the blood-brain barrier, or large areas of scar or
    necrosis, while the Cochrane authors judged the reasons not entirely clear,
    suggesting that altered uptake mechanisms or interfering medication may
    contribute. In a COG cohort of 343 patients with metastatic high- or
    intermediate-risk disease, 30 (8.7%) were MIBG-nonavid at diagnosis.
    Compared with patients with avid disease, they less often had adrenal
    primary tumors or bone metastases, less often had positive urine
    catecholamines (compared in the high-risk patients only), more often had
    MYCN-amplified tumors (a difference significant in the pooled cohort but not
    among the high-risk patients alone), and had better 5-year event-free
    survival. On multivariable analysis among the high-risk patients, avidity
    was the only adverse prognostic factor for event-free survival identified
    (hazard ratio 1.77 for avid versus nonavid disease; P = 0.034); in the
    pooled cohort the adjusted hazard ratio was not significant (P = 0.059).
  imaging_finding_term:
    preferred_term: absent MIBG uptake by tumor (MIBG nonavidity)
  notes: >-
    No imaging finding term is bound. NCIT has no finding term for absent or
    decreased MIBG uptake: OLS NCIT searches on 2026-10-21 for "decreased uptake
    MIBG", "absent MIBG uptake", "MIBG non-avid", "nonavid" and "MIBG avid"
    returned nothing, "MIBG negative" returned only the stage terms NCIT:C198075
    and NCIT:C9504, and "MIBG uptake" returned NCIT:C79553 (increased uptake,
    bound on MIBG-Avid Disease), NCIT:C133468 Curie Intensity Score and the
    tracer NCIT:C74049. OLS HP searches for "MIBG", "metaiodobenzylguanidine"
    and "iobenguane" on the same date returned nothing. modality is OTHER for
    the reason given on MIBG-Avid Disease. The 8.7% figure comes from a
    metastatic high- or intermediate-risk cohort.
  evidence:
  - reference: PMID:26417712
    reference_title: "123I-MIBG scintigraphy and 18F-FDG-PET imaging for diagnosing neuroblastoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "As described both in the literature and in this review, in about 10% of the patients with histologically proven neuroblastoma the tumour does not accumulate ¹²³I-MIBG (false negative results)."
    explanation: >-
      This Cochrane diagnostic test accuracy review of 11 studies in children
      concludes that in about 10% of patients with histologically proven
      neuroblastoma the tumour does not take up 123I-MIBG, giving a
      false-negative scan. The figure is approximate, combining earlier
      literature with the review's own crude total false-negative rate of 11% in
      608 patients (no pooled estimate was possible), and per-study sensitivity
      ranged from 67% to 100%. The review also notes that physiological uptake
      can make small lesions less visible, so some false-negative scans may
      reflect missed lesions.
  - reference: PMID:20424613
    reference_title: "Criteria for evaluation of disease extent by (123)I-metaiodobenzylguanidine scans in neuroblastoma: a report for the International Neuroblastoma Risk Group (INRG) Task Force."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "False-negative scans may be observed in approximately 10% of neuroblastomas that do not concentrate mIBG, owing to low expression of the norepinephrine transporter (Carlin et al, 2003), or owing to blood-brain barrier or large areas of scar or necrosis (Matthay et al, 2003a)."
    explanation: >-
      This 2010 INRG Task Force consensus guideline on 123I-MIBG scans lists the
      reasons for a false-negative scan in the roughly 10% of neuroblastomas
      that do not concentrate MIBG: low norepinephrine transporter expression,
      lesions behind the blood-brain barrier, and large areas of scar or
      necrosis. It restates cited studies and does not say how often each cause
      applies.
  - reference: PMID:26417712
    reference_title: "123I-MIBG scintigraphy and 18F-FDG-PET imaging for diagnosing neuroblastoma."
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: "The reasons for these MIBG-non-avid tumours are not entirely clear. Possible modifications in the uptake mechanism or interfering medication may play a role (Boubaker 2008), but most studies do not report on the reasons of MIBG-non-avid neuroblastoma lesions."
    explanation: >-
      In its discussion, this Cochrane diagnostic test accuracy review, which
      found MIBG-nonavid disease in 11% of 608 patients across 11 studies, says
      the reasons for nonavid tumours are not entirely clear and that changes in
      the uptake mechanism or interfering medication may play a role, citing an
      earlier review. Most included studies did not report why lesions were
      nonavid, so the review cannot divide the roughly 10% figure between tumour
      biology and drug interference.
  - reference: PMID:28383813
    reference_title: "MIBG avidity correlates with clinical features, tumor biology, and outcomes in neuroblastoma: A report from the Children's Oncology Group."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Thirty of 343 patients (8.7%) had MIBG nonavid disease."
    explanation: >-
      This retrospective Children's Oncology Group analysis of 343 patients with
      metastatic high- or intermediate-risk neuroblastoma reports that 30 (8.7%)
      had MIBG-nonavid disease at diagnosis; Table 1 lists the other 313 as MIBG
      avid. The 306 high-risk patients (protocol A3973) had centrally reviewed
      scans, while avidity for the 37 intermediate-risk patients (A3961, each
      with at least one bone metastasis) was recorded at enrollment without
      central review. The authors state that generalization to low-risk or
      localized disease is unknown, and the paper does not state which isotope
      the diagnostic scans used.
  - reference: PMID:28383813
    reference_title: "MIBG avidity correlates with clinical features, tumor biology, and outcomes in neuroblastoma: A report from the Children's Oncology Group."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Patients with nonavid tumors were less likely to have adrenal primary tumors (34.5 vs. 57.2%; P = 0.019), bone metastases (36.7 vs. 61.7%; P = 0.008), or positive urine catecholamines (66.7 vs. 91.0%; P < 0.001) compared with patients with MIBG avid tumors."
    explanation: >-
      This retrospective Children's Oncology Group analysis of 343 patients (30
      MIBG-nonavid) with metastatic high- or intermediate-risk neuroblastoma
      reports all three differences directly. Urine catecholamines were compared
      only in the high-risk cohort. Intermediate-risk patients had to have a
      bone metastasis and 36 of 37 were avid, inflating the avid group's pooled
      bone-metastasis rate, but the adrenal and bone differences persist in the
      high-risk cohort alone. No multiple-testing correction was made, and the
      authors say it is unclear whether the bone difference is real or reflects
      differing MIBG and bone-scan sensitivity.
  - reference: PMID:28383813
    reference_title: "MIBG avidity correlates with clinical features, tumor biology, and outcomes in neuroblastoma: A report from the Children's Oncology Group."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Nonavid tumors were more likely to be MYCN amplified (53.8 vs. 32.6%; P = 0.030) ... Patients with MIBG nonavid disease had a 5-year EFS of 50.0% compared with 38.7% for patients with MIBG avid disease (P = 0.028)."
    explanation: >-
      Retrospective Children's Oncology Group analysis of 343 patients with
      metastatic intermediate- or high-risk neuroblastoma, 30 of them
      MIBG-nonavid. The abstract reports both differences for this pooled
      cohort: MYCN amplification in 53.8% of nonavid versus 32.6% of avid
      tumours with known MYCN status, and 5-year event-free survival of 50.0%
      versus 38.7%. The MYCN comparison was made without correction for multiple
      testing and was not significant among the 306 high-risk patients alone (P
      = 0.078), and the authors state it is unknown whether the findings extend
      to localised or low-risk disease.
  - reference: PMID:28383813
    reference_title: "MIBG avidity correlates with clinical features, tumor biology, and outcomes in neuroblastoma: A report from the Children's Oncology Group."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "On multivariate testing, the hazard ratio for an event for patients with MIBG avid tumors was 1.77 (95% confidence interval 0.98-3.19; P = 0.059) after adjusting for significant variables (age and ploidy) following backward selection. ... On multivariate testing in high-risk patients, MIBG avidity was the sole adverse prognostic factor for EFS identified (hazard ratio 1.77; 95% confidence interval 1.04-2.99; P = 0.034)."
    explanation: >-
      In this retrospective Children's Oncology Group analysis, Cox models built
      by backward selection kept MIBG avidity as a fixed variable. In the pooled
      cohort of 343 patients with metastatic high- or intermediate-risk disease,
      the event hazard ratio for avid versus nonavid disease after adjustment
      for age and ploidy was 1.77 (95% CI 0.98-3.19; P = 0.059), short of
      significance. Among the high-risk patients (COG A3973, centrally reviewed
      scans), avidity was the only adverse prognostic factor for event-free
      survival the model identified (hazard ratio 1.77; 95% CI 1.04-2.99; P =
      0.034). Avidity did not predict overall survival on multivariate testing
      in either cohort.
treatments:
- name: Risk-Adapted Chemotherapy
  description: >-
    Chemotherapy intensity varies by risk group. Low-risk patients may need
    only observation or minimal chemotherapy. High-risk patients receive
    intensive induction chemotherapy including cisplatin, etoposide,
    vincristine, cyclophosphamide, doxorubicin, and topotecan.
  treatment_term:
    preferred_term: chemotherapy
    term:
      id: NCIT:C15632
      label: Chemotherapy
    therapeutic_agent:
    - preferred_term: cisplatin
      term:
        id: CHEBI:27899
        label: cisplatin
    - preferred_term: etoposide
      term:
        id: CHEBI:4911
        label: etoposide
    - preferred_term: cyclophosphamide
      term:
        id: CHEBI:4027
        label: cyclophosphamide
- name: Surgical Resection
  description: >-
    Surgery for primary tumor resection is performed after chemotherapy for
    high-risk disease. Complete resection is associated with better outcomes
    when achievable without significant morbidity.
  therapeutic_modality: SURGERY
  treatment_term:
    preferred_term: Definitive Surgical Resection
    term:
      id: NCIT:C154430
      label: Definitive Surgical Resection
- name: Autologous Stem Cell Transplant
  description: >-
    High-dose chemotherapy with autologous stem cell rescue is standard for
    high-risk neuroblastoma following induction chemotherapy and surgical
    resection. Tandem transplant may provide additional benefit.
  therapeutic_modality: CELL_THERAPY
  treatment_term:
    preferred_term: hematopoietic stem cell transplantation
    term:
      id: NCIT:C15431
      label: Hematopoietic Cell Transplantation
- name: Radiation Therapy
  description: >-
    Radiation to the primary tumor bed is used in high-risk disease following
    surgical resection and stem cell transplant.
  therapeutic_modality: RADIOTHERAPY
  treatment_term:
    preferred_term: Radiation Therapy
    term:
      id: NCIT:C15313
      label: Radiation Therapy
- name: Anti-GD2 Immunotherapy
  description: >-
    Anti-GD2 monoclonal antibody (dinutuximab) combined with GM-CSF and IL-2
    has significantly improved outcomes in high-risk neuroblastoma during
    maintenance therapy. GD2 is highly expressed on neuroblastoma cells.
  treatment_term:
    preferred_term: immunotherapy procedure
    term:
      id: NCIT:C15262
      label: Immunotherapy
- name: ALK Inhibitor Therapy
  description: >-
    ALK tyrosine kinase inhibition targets the constitutive ALK signalling
    produced by activating ALK point mutations or ALK amplification. The
    first-generation inhibitor crizotinib has limited activity against several
    common neuroblastoma ALK variants (notably F1174L), which motivated the
    move to third-generation, CNS-penetrant inhibitors; lorlatinib is under
    evaluation in frontline cooperative-group trials for ALK-altered
    high-risk disease. Applicable only to the ALK-altered molecular subset.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: crizotinib
      term:
        id: CHEBI:64310
        label: crizotinib
    - preferred_term: lorlatinib
      term:
        id: CHEBI:143117
        label: lorlatinib
  target_mechanisms:
  - target: ALK Signaling Activation
    description: >-
      ATP-competitive inhibition of the ALK tyrosine kinase domain abolishes
      the constitutive receptor autophosphorylation produced by activating
      ALK mutations, removing the downstream proliferative signal.
    evidence:
    - reference: PMID:18724359
      reference_title: "Identification of ALK as a major familial neuroblastoma predisposition gene."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "Mutations resulted in constitutive phosphorylation, and targeted knockdown of ALK messenger RNA resulted in profound inhibition of growth in all cell lines harbouring mutant or amplified ALK"
      explanation: >-
        Establishes ALK dependence of ALK-mutant and ALK-amplified
        neuroblastoma cells, the mechanistic rationale for ALK-directed
        therapy. Genetic knockdown rather than pharmacologic inhibition.
- name: Isotretinoin (Retinoic Acid)
  description: >-
    13-cis-retinoic acid (isotretinoin) is given during maintenance therapy
    to promote differentiation of residual neuroblastoma cells and reduce
    relapse risk.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: isotretinoin
      term:
        id: CHEBI:6067
        label: isotretinoin
- name: Eflornithine (DFMO) Maintenance Therapy
  description: >-
    An oral ornithine decarboxylase inhibitor given as maintenance after
    front-line therapy, to reduce the risk of relapse rather than to treat
    active disease. The United States approved indication, granted on 13
    December 2023, is for patients with high-risk neuroblastoma who have
    demonstrated at least a partial response to prior multiagent, multimodality
    therapy including anti-GD2 immunotherapy; dosing in the pivotal study was
    oral, twice daily and continued for up to two years. The evidence base is
    unusual and the record is written around that: approval rested on an
    externally controlled trial, a single-arm study compared with an external
    control drawn from a separate cooperative-group trial, and the review
    describes it as the first oncology approval to rely on that design as its
    primary clinical data. Against the external control, event-free and overall
    survival both favoured eflornithine. No randomized trial has tested it in
    this setting.
  context: High-risk neuroblastoma, post-immunotherapy maintenance in remission
  therapeutic_modality: SMALL_MOLECULE
  dosing_interval: twice a day
  dosing_interval_days: 0.5
  notes: >-
    Three caveats bear on how much this record should be taken to settle, and
    none of them is visible from the approval alone. First, the reviewers
    themselves called the missing randomized trial a significant limitation,
    given reliance on a time-to-event endpoint, and the cited approval summary
    is quoted for that below rather than only for the indication. Second, the
    mechanism at the approved dose is open: a 2025 study found that low-dose
    eflornithine did not extend survival in mouse models and that sensitivity
    did not track MYCN or ODC1 copy number, which is why the linked
    pathophysiology node is marked PROVISIONAL rather than ESTABLISHED. Third,
    two facts relevant to reading the approval are not carried by any
    publication cached here and are therefore stated without an evidence item:
    the European Medicines Agency application was withdrawn in July 2025, with
    a provisional view that effectiveness had not been demonstrated, per the
    agency's own public medicine page; and the one randomized test of
    eflornithine in neuroblastoma, an add-on in relapsed or refractory disease
    (NCT03794349), posted response rates showing no advantage for the
    eflornithine arm. The registry record's cached body holds only its brief
    summary, so those figures cannot be quoted as a snippet. Both are recorded
    here because omitting them would leave "FDA-approved" reading as settled
    and global.
  treatment_term:
    preferred_term: Pharmacotherapy
    term:
      id: NCIT:C15986
      label: Pharmacotherapy
    therapeutic_agent:
    - preferred_term: eflornithine
      term:
        id: CHEBI:41948
        label: eflornithine
  evidence:
  - reference: PMID:38917371
    reference_title: "US Food and Drug Administration Approval Summary: Eflornithine for High-Risk Neuroblastoma After Prior Multiagent, Multimodality Therapy."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: OTHER
    snippet: "On December 13, 2023, the US Food and Drug Administration (FDA) approved eflornithine (IWILFIN, US WorldMeds) to reduce the risk of relapse in adult and pediatric patients with high-risk neuroblastoma who have demonstrated at least a partial response to prior multiagent, multimodality therapy including anti-GD2 immunotherapy."
    explanation: >-
      The approved indication, in full, which is narrower than "approved for
      high-risk neuroblastoma": it is maintenance to reduce relapse risk, in
      patients who already responded to prior therapy that included anti-GD2
      immunotherapy. Graded OTHER because the quoted sentence states a
      regulatory decision rather than a study result.
  - reference: PMID:38917371
    reference_title: "US Food and Drug Administration Approval Summary: Eflornithine for High-Risk Neuroblastoma After Prior Multiagent, Multimodality Therapy."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: OTHER
    snippet: "The approval was based on an externally controlled trial (ECT) consisting of a single-arm trial, study 3(b), compared with an external control (EC) derived from a National Cancer Institute/Children's Oncology Group-sponsored clinical trial (Study ANBL0032) and supported by confirmatory evidence."
    explanation: >-
      What the approval rested on, and the reason this record describes its
      own evidence base rather than presenting the indication alone: the
      comparison is against patients from a different trial, not a randomized
      control arm. Graded OTHER as a regulatory fact.
  - reference: PMID:38917371
    reference_title: "US Food and Drug Administration Approval Summary: Eflornithine for High-Risk Neuroblastoma After Prior Multiagent, Multimodality Therapy."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: OTHER
    snippet: "Notably, this is the first oncology drug approval which relies on an ECT as the primary clinical data to support substantial evidence of effectiveness."
    explanation: >-
      How unusual the design is, in the reviewers' own words. Recorded because
      it is the fact a reader most needs in order to weigh this treatment
      against one approved on a randomized trial. Graded OTHER as a
      regulatory fact.
  - reference: PMID:38917371
    reference_title: "US Food and Drug Administration Approval Summary: Eflornithine for High-Risk Neuroblastoma After Prior Multiagent, Multimodality Therapy."
    supports: REFUTE
    quote_role: PRIMARY_RESULT
    evidence_source: OTHER
    snippet: "Even so, the lack of an RCT was a significant limitation to this application given the reliance on a time to event endpoint with no expected objective response rate data."
    explanation: >-
      The reviewers' own statement of the weakness, recorded as a REFUTE item
      against reading this treatment's benefit as established rather than
      hidden in prose. It cuts against the strength of the evidence, not
      against the approval, which was granted. Graded OTHER as a regulatory
      fact.
  - reference: PMID:37883734
    reference_title: "Eflornithine as Postimmunotherapy Maintenance in High-Risk Neuroblastoma: Externally Controlled, Propensity Score-Matched Survival Outcome Comparisons."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "DFMO after completion of immunotherapy was associated with improved EFS (hazard ratio [HR], 0.50 [95% CI, 0.29 to 0.84]; P = .008) and OS (HR, 0.38 [95% CI, 0.19 to 0.76]; P = .007)."
    explanation: >-
      The effect estimates behind the approval, from the externally controlled
      comparison of 141 patients against propensity-score-matched external
      controls. Read with the design in mind: these are not randomized
      estimates, and the item above records what the reviewers made of that.
      Abstract results sentence.
  - reference: PMID:37883734
    reference_title: "Eflornithine as Postimmunotherapy Maintenance in High-Risk Neuroblastoma: Externally Controlled, Propensity Score-Matched Survival Outcome Comparisons."
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "who received up to 2 years of continuous treatment with oral DFMO (750 ± 250 mg/m2 twice a day)"
    explanation: >-
      The route, schedule and duration stated in the description, and the
      source of the twice-daily dosing interval recorded on this record.
      Abstract methods clause.
  - reference: PMID:30262852
    reference_title: Maintenance DFMO Increases Survival in High Risk Neuroblastoma.
    supports: SUPPORT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "101 subjects enrolled on Stratum 1 and 100 were eligible for ITT analysis; two-year EFS was 84% (±4%) and OS 97% (±2%)."
    explanation: >-
      The single-arm survival figures from the pivotal study's first-remission
      stratum. Quoted with its denominator because the number that matters for
      an uncontrolled result is how many patients it rests on; no comparison
      arm is implied by this item.
  - reference: PMID:40774224
    reference_title: High-dose DFMO alters protein translation in neuroblastoma.
    supports: REFUTE
    quote_role: PRIMARY_RESULT
    evidence_source: MODEL_ORGANISM
    snippet: "We show that low-dose DFMO does not extend survival in mouse models in vivo nor alter translation biomarkers in vitro."
    explanation: >-
      Cuts against polyamine depletion being the operative mechanism at the
      dose that was approved: in mouse models the low dose neither extended
      survival nor moved the molecular readouts, while the high dose did. It
      does not contradict the clinical result, which stands on its own data;
      it contradicts the inference from that result to this mechanism, which
      is why the linked pathophysiology node is PROVISIONAL. Abstract
      sentence.
  - reference: PMID:40774224
    reference_title: High-dose DFMO alters protein translation in neuroblastoma.
    supports: REFUTE
    quote_role: PRIMARY_RESULT
    evidence_source: IN_VITRO
    snippet: "No correlation was seen among MYCN and/or ODC1 copy number and sensitivity to DFMO."
    explanation: >-
      A second tested null against the mechanistic reading, and the one that
      bears on patient selection: if the drug worked by blocking a
      MYCN-driven ODC1 dependence, sensitivity should track those copy
      numbers, and it did not. Graded IN_VITRO because the sensitivity
      comparison was made across cell lines. Supports leaving the approved
      indication unrestricted by MYCN status.
  target_mechanisms:
  - target: Polyamine Biosynthesis Dependence
    treatment_effect: INHIBITS
    description: >-
      Eflornithine is an irreversible inhibitor of ornithine decarboxylase, the
      rate-limiting enzyme of the pathway this node describes, so the drug acts
      on the node directly. What is not established is that this inhibition is
      what produces the clinical effect at the approved dose; the treatment's
      own evidence records the two results that cut against that inference.
    evidence:
    - reference: PMID:19047152
      reference_title: ODC1 is a critical determinant of MYCN oncogenesis and a therapeutic target in neuroblastoma.
      supports: SUPPORT
      quote_role: PRIMARY_RESULT
      evidence_source: MODEL_ORGANISM
      snippet: "DFMO treatment of neuroblastoma-prone genetically engineered mice (TH-MYCN) extended tumor latency and survival in homozygous mice and prevented oncogenesis in hemizygous mice."
      explanation: >-
        The preclinical result that made this pathway a therapeutic target:
        inhibiting it delayed and in hemizygous animals prevented tumors in a
        MYCN-driven mouse model. Mouse models only, and at preclinical doses,
        which is the gap the 2025 low-dose result on this record's evidence
        opens up. Abstract sentence.
animal_models:
- name: Xenopus anteroventral noradrenergic (AVNA) cell differentiation model
  species: Xenopus laevis
  genotype: >-
    Embryos expressing wild-type Ascl1, a phospho-mutant Ascl1 that cannot be
    phosphorylated at serine-proline motifs, CDKs, or MYCN, with Ascl1
    morpholino knockdown
  category: Developmental model of the presumed cell of origin
  publication: PMID:25786414
  description: >-
    Rather than growing a tumour, this model reconstructs the normal
    differentiation of the neural-crest-derived sympathoadrenal cell that
    neuroblastoma is thought to arise from, and asks what stops it. Frog AVNA
    cells differentiate under transient Ascl1 expression; in neuroblastoma cells
    Ascl1 is instead persistently expressed and multiply phosphorylated.
    Introducing that phospho-state into the frog cells blocks their
    differentiation, and CDK or MYCN overexpression blocks it too — but not when
    Ascl1 cannot be phosphorylated, which places phosphorylation downstream of
    both. The model tests the differentiation-arrest hypothesis in a normal
    developmental context; it does not produce tumours and so says nothing about
    transformation, growth, or metastasis.
  genes:
  - preferred_term: ASCL1
    term:
      id: hgnc:738
      label: ASCL1
  - preferred_term: MYCN
    term:
      id: hgnc:7559
      label: MYCN
  modeled_mechanisms:
  - target: Neural Crest Developmental Arrest
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      Supplies a molecular switch for the arrest this node asserts: multi-site
      phosphorylation of Ascl1 converts it from a driver of sympathoadrenal
      differentiation into an inert factor, matching the phospho-state Ascl1 is
      held in within neuroblastoma cells.
    limitations: >-
      Frog AVNA cells are a developmental counterpart of the presumed cell of
      origin, not tumour cells, and the model contains no transformed tissue —
      arrest is scored as failure to differentiate on schedule rather than as
      tumour formation. The link to human disease rests on the observed
      phospho-state of ASCL1 in neuroblastoma lines, so the model shows the
      state is sufficient to block differentiation, not that it is what maintains
      any patient's tumour.
    readouts:
    - name: AVNA cell differentiation driven by wild-type versus phospho-mutant Ascl1
      target: Neural Crest Developmental Arrest
      direction: DECREASED
      interpretation: >-
        Differentiation fails when Ascl1 can be multiply phosphorylated and
        proceeds when it cannot, isolating phospho-status as the controlling
        variable.
      evidence:
      - reference: PMID:25786414
        reference_title: "Ascl1 phospho-status regulates neuronal differentiation in a Xenopus developmental model of neuroblastoma."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "ability to induce differentiation of AVNA cells is inhibited by its multi-site phosphorylation at serine-proline motifs"
        explanation: States the measured effect of Ascl1 phospho-status on differentiation in this model.
    evidence:
    - reference: PMID:25786414
      reference_title: "Ascl1 phospho-status regulates neuronal differentiation in a Xenopus developmental model of neuroblastoma."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Here, we use Xenopus frog embryos to characterise the differentiation of anteroventral noradrenergic (AVNA) cells, cells derived from the neural crest."
      explanation: Establishes what the model is and that its cells are neural crest derived.
    - reference: PMID:25786414
      reference_title: "Ascl1 phospho-status regulates neuronal differentiation in a Xenopus developmental model of neuroblastoma."
      supports: SUPPORT
      evidence_source: IN_VITRO
      snippet: "We find that the transcriptional regulator Ascl1 is expressed transiently in normal AVNA cell differentiation but its expression is aberrantly maintained in NB cells, where it is largely phosphorylated on multiple sites."
      explanation: >-
        The neuroblastoma-cell half of this comparison is cell-based, and it is
        what connects the frog readout to the human disease state.
  - target: MYCN-Driven Proliferation
    relationship: PERTURBS
    fidelity: MODERATE
    description: >-
      Positions MYCN upstream of the differentiation block: MYCN overexpression
      prevents Ascl1-driven differentiation, and loses that ability when Ascl1
      cannot be phosphorylated.
    limitations: >-
      This is the differentiation-blocking arm of MYCN only. The node is about
      proliferation, and no proliferative or tumour-growth readout was taken
      here; MYCN is introduced by overexpression in a normal embryo, not by the
      genomic amplification that defines high-risk neuroblastoma.
    readouts:
    - name: Ascl1-driven AVNA differentiation under CDK or MYCN overexpression
      target: MYCN-Driven Proliferation
      direction: DECREASED
      interpretation: >-
        The epistasis result: MYCN and CDKs block differentiation only when Ascl1
        is phosphorylatable, so their effect on this cell fate runs through Ascl1
        phospho-status.
      evidence:
      - reference: PMID:25786414
        reference_title: "Ascl1 phospho-status regulates neuronal differentiation in a Xenopus developmental model of neuroblastoma."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "overexpression of cyclin-dependent kinases (CDKs) and MYCN inhibit wild-type Ascl1-driven AVNA differentiation, but not differentiation driven by a phospho-mutant form of Ascl1"
        explanation: Reports the measured differentiation block and the phospho-mutant control that makes it interpretable.
    evidence:
    - reference: PMID:25786414
      reference_title: "Ascl1 phospho-status regulates neuronal differentiation in a Xenopus developmental model of neuroblastoma."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "This suggests that the maintenance of ASCL1 in its multiply phosphorylated state might prevent terminal differentiation in NB, which could offer new approaches for differentiation therapy in NB."
      explanation: >-
        The authors put the therapeutic and disease-level reading as a
        suggestion, which is the level of support this link carries.

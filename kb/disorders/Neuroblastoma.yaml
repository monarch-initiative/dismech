      explanation: >-
        Of the 79 newly diagnosed Lucknow patients, 44/79 had marrow
        infiltration at staging, and thrombocytopenia was present in 29.55%
        (13/44) of them. The quote gives the frequency in this subgroup
        directly; the frequency across the whole series is given only in a table
        of the paper.
  - population: "Newly diagnosed children with neuroblastoma and bone marrow involvement at staging examination, Postgraduate Institute of Medical Education and Research, Chandigarh, India, 2009-2012 (24 of 44 children)"
    frequency: "8.3%"
    notes: >-
      Thrombocytopenia (platelet count below 150 x 10^9/L) in 8.3% of the
      children with marrow involvement, against 10% of the uninvolved children
      in the same series, so here it was not more frequent with marrow
      involvement. The authors report leukopenia and bicytopenia as the
      cytopenias significantly associated with infiltration.
    evidence:
    - reference: PMID:25548446
      reference_title: "Bone Marrow Involvement in Neuroblastoma: A Study of Hemato-morphological Features."
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "In this study, we analyzed 44 cases of neuroblastoma for bone marrow infiltration status and their hematological parameters. ... Of these, 24 cases (54.5 %) showed marrow infiltration. Leucopenia and bicytopenia were significantly (p < 0.05) associated with marrow infiltration. ... Complete blood counts in involved cases showed that ... platelet count below 150 ... (thrombocytopenia) was seen in 8.3 % cases ... In the uninvolved cases anemia was seen in 75 %, leucopenia in none and thrombocytopenia in 10 % cases."
      explanation: >-
        In 44 newly diagnosed children referred for staging marrow examination
        at one Chandigarh center, 24 had marrow infiltration. Thrombocytopenia,
        defined as a platelet count below 150 x 10^9/L, was seen in 8.3% of the
        involved and 10% of the uninvolved cases, and the abstract names only
        leukopenia and bicytopenia as significantly associated with infiltration
        (p < 0.05). So in this series thrombocytopenia was not more frequent
        with marrow involvement; the quote gives its frequency in each group.
        The series is small and selected by referral.
- category: Hepatic
  name: Hepatomegaly
  description: >-
    In infants with INSS stage 4S neuroblastoma, the special metastatic stage of
    infancy in which a localized primary tumor has spread only to the liver,
    skin and/or bone marrow, the liver is the main metastatic site. Hepatomegaly
    and its complications can be fatal in these infants.
  phenotype_term:
    preferred_term: Hepatomegaly
    term:
      id: HP:0002240
      label: Hepatomegaly
  evidence:
  - reference: PMID:30444686
    reference_title: "Defining Risk Factors for Chemotherapeutic Intervention in Infants With Stage 4S Neuroblastoma: A Report From Children's Oncology Group Study ANBL0531."
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "five acute deaths were a result of hepatomegaly and associated toxicities"
    explanation: >-
      In the Children's Oncology Group trial ANBL0531, which enrolled infants
      with stage 4S neuroblastoma who had impaired or impending organ
      dysfunction or unfavorable tumor biology and excluded infants whose tumors
      had known MYCN amplification (infants too ill for biopsy could enroll with
      tumor biology unknown), five acute deaths were a result of hepatomegaly
      and associated toxicities. The trial counted deaths from late relapse and
      from treatment complications separately, so the authors attribute these
      deaths to hepatomegaly and its complications rather than to treatment.
      This shows that hepatomegaly can be fatal in stage 4S disease. The trial
      enrolled only a higher-risk subset of stage 4S infants (most infants with
      stage 4S disease do well with observation or minimal chemotherapy), so the
      quote speaks to severity, not to how often hepatomegaly occurs.
  phenotype_contexts:
  - population: "Infants with stage 4s neuroblastoma treated in French Society of Paediatric Oncology centers, 1990-2000 (94 infants)"
    notes: >-
      In this SFOP series, hepatic dissemination was present in 87 of 94 infants
      (92%). This counts liver metastasis rather than measured liver
      enlargement, so no hepatomegaly frequency is given. The series excluded
      infants whose liver involvement came from contiguous spread of a large
      abdominal primary tumor.
    evidence:
    - reference: PMID:12888814
      reference_title: "Treatment of stage 4s neuroblastoma--report of 10 years' experience of the French Society of Paediatric Oncology (SFOP)."
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: "Most tumours showed hepatic dissemination (87 out of 94, 92%), with bone marrow and skin metastasis occurring much less frequently."
      explanation: >-
        In this retrospective review by the French Society of Paediatric
        Oncology (SFOP) of infants with stage 4s neuroblastoma, 87 of 94 (92%)
        had hepatic dissemination, while bone marrow and skin metastases were
        much less frequent, so the liver was the main metastatic site. The paper
        counts liver metastasis, not liver size: it reports no hepatomegaly
        count, and in some infants liver metastases were found only at surgery,
        so liver involvement was not always clinically evident. Hepatomegaly
        follows from this metastatic burden only by inference, so the figure
        supports the phenotype indirectly and is not entered as a hepatomegaly
        frequency. The series did not apply the INSS limit on marrow involvement
        and included infants with bilateral adrenal tumors, which the authors
        note strict INSS staging does not take into account, so its stage 4s
        group is broader than strict INSS stage 4S.
- category: Dermatologic
  name: Subcutaneous Nodules
  description: >-
    Skin metastases presenting as subcutaneous nodules are part of the
    metastatic pattern of INSS stage 4S, the special metastatic stage of
    infancy, and are less frequent than liver involvement.
  phenotype_term:
    preferred_term: subcutaneous metastatic nodules
    term:
      id: HP:0001482
      label: Subcutaneous nodule
  evidence:
  - reference: PMID:12888814
    reference_title: "Treatment of stage 4s neuroblastoma--report of 10 years' experience of the French Society of Paediatric Oncology (SFOP)."
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: "Most tumours showed hepatic dissemination (87 out of 94, 92%), with bone marrow and skin metastasis occurring much less frequently."
    explanation: >-
      In this retrospective multicenter French Society of Paediatric Oncology
      series of 94 infants with stage 4s neuroblastoma, 87 (92%) had hepatic
      dissemination, while bone marrow and skin metastasis occurred much less
      frequently. This places skin involvement within the stage 4S metastatic
      pattern but well below liver involvement. Indirect for this phenotype: the
      paper reports skin (cutaneous) metastasis and never describes the lesions
      as subcutaneous nodules, so reading them as this phenotype is an inference
      step. The series is limited to stage 4s infants, so it gives no frequency
      for neuroblastoma as a whole. The series did not apply the INSS limit on
      marrow involvement, so its stage 4s group is slightly broader than strict

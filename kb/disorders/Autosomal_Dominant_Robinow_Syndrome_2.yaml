name: Autosomal Dominant Robinow Syndrome 2
synonyms:
- DRS2
- DVL1-related Robinow syndrome
- Robinow syndrome, autosomal dominant 2
- osteosclerotic form of Robinow syndrome
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: autosomal dominant Robinow syndrome 2
  term:
    id: MONDO:0014591
    label: autosomal dominant Robinow syndrome 2
description: >-
  The DVL1 form of dominant Robinow syndrome, and the one that carries the
  osteosclerotic variant of the disease: normal stature, persistent
  macrocephaly, increased bone mineral density with skull osteosclerosis, and
  hearing loss, on top of the mesomelic limb shortening, genital hypoplasia and
  fetal facies shared across the syndrome.

  The allele class is unusually specific and is what makes this entity distinct
  from the WNT5A form. Every reported variant is a frameshift confined to the
  penultimate exon of DVL1, placing a premature termination codon in the last
  exon so the transcript escapes nonsense-mediated decay. The product is not
  absent Dishevelled but altered Dishevelled — an intact core with a novel -1
  reading-frame C-terminus, expressed alongside the wild-type allele.

  Functional work published in 2026 separates two effects that had been
  conflated. Compared against a plain stop codon at the same position, the
  frameshift protein transduces canonical and JNK-PCP WNT signal less
  efficiently — but so does the stop codon, so that part is loss of the
  C-terminus. Only the frameshift protein mislocalizes to the nucleus, and only
  it perturbs morphogenesis in Drosophila. The novel peptide therefore does
  something that merely losing the wild-type C-terminus does not.
parents:
- Robinow Syndrome
- Skeletal Dysplasia
notes: >-
  Scope. This entry covers the DVL1 form only (MONDO:0014591, DRS2). The
  dominant syndrome has at least three genes; the WNT5A form is
  ``Autosomal_Dominant_Robinow_Syndrome_1`` and the DVL3 form is
  ``Autosomal_Dominant_Robinow_Syndrome_3``. They are curated as separate
  entries and cross-referenced as differential diagnoses, with
  ``kb/groupings/Robinow_Syndrome.yaml`` holding the union.

  GeneReviews (PMID:25577943) describes the dominant syndrome across all three
  genes, so quoted clinical descriptions apply to the syndrome rather than
  exclusively to DVL1 patients; evidence explanations say so where it matters.
  The osteosclerosis statements are the exception — those are DVL1-specific and
  the sources say so explicitly.
classifications:
  harrisons_chapter:
  - classification_value: GENETICS_ENVIRONMENT_DISEASE
    notes: >-
      A Mendelian developmental disorder of a defined signalling pathway.
  isds_skeletal_category:
  - classification_value: mesomelic_and_rhizomesomelic_dysplasias
    notes: >-
      ISDS Nosology of Genetic Skeletal Disorders, 2023 revision (Unger et al.,
      PMID:36779427), group 15 "Mesomelic and rhizo-mesomelic dysplasias", row
      NOS 15-0060, listed as "Robinow syndrome, DVL1-related" (MIM 616331, AD).
      The 2019 revision (Mortier et al., PMID:31633310) numbered the same group
      17.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Eight subjects carrying six distinct DVL1 frameshifts in the defining
    series, with further cases since. No denominator-based estimate exists, so
    the count is recorded rather than a rate.
  evidence:
  - reference: PMID:25817016
    reference_title: "DVL1 frameshift mutations clustering in the penultimate exon cause autosomal-dominant Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In total, six distinct frameshift mutations were found in eight subjects,
      and all were heterozygous truncating variants within the penultimate exon
      of DVL1.
    explanation: >-
      Gives the cohort size on which the entity was delineated.
inheritance:
- name: Autosomal dominant, usually de novo
  inheritance_term:
    preferred_term: Autosomal dominant inheritance
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  de_novo_rate: "majority"
  description: >-
    Autosomal dominant. In the families where parental samples were available,
    the variants were de novo, so an unaffected-parent pedigree does not argue
    against the diagnosis.
  evidence:
  - reference: PMID:25577943
    reference_title: "Autosomal Dominant Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      ADRS is inherited in an autosomal dominant manner.
    explanation: >-
      GeneReviews states the inheritance mode for the dominant forms, of which
      this is one.
  - reference: PMID:25817016
    reference_title: "DVL1 frameshift mutations clustering in the penultimate exon cause autosomal-dominant Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In five families in which samples from unaffected parents were available,
      the variants were demonstrated to represent de novo mutations.
    explanation: >-
      Establishes de novo origin in the families that could be tested.
pathophysiology:
- name: DVL1 Penultimate-Exon Frameshift Escaping Nonsense-Mediated Decay
  role: trigger
  biological_scale: MOLECULAR
  genes:
  - preferred_term: DVL1
    term:
      id: hgnc:3084
      label: DVL1
  genetic_context:
    gene:
      preferred_term: DVL1
      term:
        id: hgnc:3084
        label: DVL1
    allele_type: penultimate-exon -1 frameshift escaping nonsense-mediated decay
    variant_origin: DE_NOVO
    zygosity: HETEROZYGOUS
    functional_impact_category: DOMINANT_NEGATIVE
    notes: >-
      DOMINANT_NEGATIVE is a mechanistic reading of an NMD-escaping
      altered-C-terminus allele expressed alongside wild type. The 2026
      functional work supports a mixed picture — reduced signalling shared with
      a plain truncation, plus a nuclear mislocalization unique to the
      frameshift — which no single enum value captures cleanly. See the
      ``dvl1_frameshift_mode_of_action`` discussion.
  description: >-
    The variants are confined to the penultimate exon, so the premature
    termination codon falls in the last exon and the transcript escapes
    nonsense-mediated decay. Both wild-type and variant transcripts are
    detectable in patient leukocytes, so the altered protein is genuinely made.
  evidence:
  - reference: PMID:25817016
    reference_title: "DVL1 frameshift mutations clustering in the penultimate exon cause autosomal-dominant Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All variant alleles are predicted to result in a premature termination
      codon within the last exon, escape nonsense-mediated decay (NMD), and most
      likely generate a C-terminally truncated protein with a distinct -1
      reading-frame terminus.
    explanation: >-
      States the NMD-escape architecture that defines this allele class.
  - reference: PMID:25817016
    reference_title: "DVL1 frameshift mutations clustering in the penultimate exon cause autosomal-dominant Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Study of the transcripts extracted from affected subjects' leukocytes
      confirmed expression of both wild-type and variant alleles, supporting the
      hypothesis that mutant mRNA escapes NMD.
    explanation: >-
      Patient-derived confirmation that the mutant transcript is expressed
      rather than degraded.
  downstream:
  - target: Reduced WNT Signal Transduction Through Dishevelled
    causal_link_type: DIRECT
    description: >-
      The altered protein sits in the transducer position of the pathway.
  - target: Nuclear Mislocalization of Altered Dishevelled
    causal_link_type: DIRECT
    description: >-
      A property of the novel C-terminal peptide, not of losing the wild-type
      one.
- name: Reduced WNT Signal Transduction Through Dishevelled
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    In luciferase assays in facial mesenchyme, wild-type DVL1 activates both
    canonical and JNK-PCP WNT signalling, while the frameshift protein and a
    plain stop codon at the same position both signal significantly less. The
    loss-of-signalling component is therefore attributable to the missing
    wild-type C-terminus and is shared with an ordinary truncation.
  biological_processes:
  - preferred_term: non-canonical Wnt signaling pathway
    modifier: DECREASED
    term:
      id: GO:0035567
      label: non-canonical Wnt signaling pathway
  - preferred_term: Wnt signaling pathway, planar cell polarity pathway
    modifier: DECREASED
    term:
      id: GO:0060071
      label: Wnt signaling pathway, planar cell polarity pathway
  evidence:
  - reference: PMID:42424595
    reference_title: "The abnormal C-terminus caused by DVL1 variants impacts Robinow syndrome phenotypes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      In luciferase assays carried out in facial mesenchyme, wtDVL1 activated
      canonical and JNK-PCP WNT signalling whereas the DVL11519* and the
      DVL11519ΔT variant had significantly lower signaling activity.
    explanation: >-
      Measures the signalling deficit and, by including the stop-codon
      construct, shows it is not specific to the frameshift.
  downstream:
  - target: Disrupted Planar Cell Polarity in Developing Skeleton and Face
    causal_link_type: DIRECT
    description: >-
      Reduced PCP transduction is the input to the developmental phenotype.
- name: Nuclear Mislocalization of Altered Dishevelled
  role: central_effector
  biological_scale: CELLULAR
  description: >-
    Dishevelled is a cytoplasmic signal transducer. The protein made from the
    frameshift allele is found in the nucleus instead, while both wild-type
    DVL1 and the stop-codon construct stay cytoplasmic. In Drosophila, only the
    frameshift allele perturbs morphogenesis and signalling. This is the
    component of the allele's effect that a simple loss of the C-terminus does
    not reproduce, and the authors raise altered nuclear transcription as the
    candidate consequence.
  evidence:
  - reference: PMID:42424595
    reference_title: "The abnormal C-terminus caused by DVL1 variants impacts Robinow syndrome phenotypes."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      We also determined that there is mislocalization of the protein expressed
      from DVL11519ΔT in the nucleus while the other two constructs were
      expressed in the cytoplasm.
    explanation: >-
      Establishes that the mislocalization is specific to the frameshift
      product.
  - reference: PMID:42424595
    reference_title: "The abnormal C-terminus caused by DVL1 variants impacts Robinow syndrome phenotypes."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: >-
      In complementary Drosophila experiments using a variety of readouts, only
      the DVL11519ΔT variant and not the 1519* impacted morphogenesis and
      signaling.
    explanation: >-
      The discriminating in vivo result: the frameshift perturbs morphogenesis
      where an equivalent truncation does not.
  downstream:
  - target: Disrupted Planar Cell Polarity in Developing Skeleton and Face
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Whether the nuclear protein alters transcription, and which targets, is
      not established.
  - target: Increased Cranial Bone Mineral Density
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Osteosclerosis is restricted to this genotype among molecularly
      characterized Robinow patients, so it is attributed to the DVL1-specific
      component of the allele's effect rather than to reduced PCP signalling
      shared with the other genes. The intermediate steps are unidentified.
- name: Disrupted Planar Cell Polarity in Developing Skeleton and Face
  role: central_effector
  biological_scale: TISSUE
  description: >-
    The shared endpoint of every Robinow genotype: loss of the polarized,
    directional cell behaviour that PCP signalling governs, in the growth plate,
    the frontonasal midline and the genital tubercle. The developmental
    decomposition — reduced presomitic mesoderm, perturbed chondrocyte
    differentiation, midline outgrowth failure, genital tubercle reduction —
    comes from the Ror2-null mouse and is inherited here by pathway membership
    rather than demonstrated for DVL1.
  biological_processes:
  - preferred_term: Wnt signaling pathway, planar cell polarity pathway
    modifier: DECREASED
    term:
      id: GO:0060071
      label: Wnt signaling pathway, planar cell polarity pathway
  - preferred_term: chondrocyte differentiation
    modifier: DECREASED
    term:
      id: GO:0002062
      label: chondrocyte differentiation
  evidence:
  - reference: PMID:35047859
    reference_title: "Novel pathogenic variants and quantitative phenotypic analyses of Robinow syndrome: WNT signaling perturbation and phenotypic variability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Robinow syndrome (RS) is a genetically heterogeneous disorder with six
      genes that converge on the WNT/planar cell polarity (PCP) signaling
      pathway implicated (DVL1, DVL3, FZD2, NXN, ROR2, and WNT5A).
    explanation: >-
      Establishes that DVL1 disease shares a final common pathway with the other
      Robinow genes, which is what licenses the shared developmental model.
  downstream:
  - target: Mesomelic Limb Shortening
    causal_link_type: DIRECT
    description: >-
      Disordered growth plate chondrocyte behaviour shortens the middle limb
      segment.
  - target: Fetal Facies
    causal_link_type: DIRECT
    description: >-
      Midline outgrowth failure of the frontonasal region.
  - target: Genital Hypoplasia
    causal_link_type: DIRECT
    description: >-
      Reduced genital tubercle outgrowth.
  - target: Dental Crowding and Malocclusion
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Small, retruded jaws leave insufficient arch length for the dentition.
- name: Increased Cranial Bone Mineral Density
  role: consequence
  biological_scale: TISSUE
  description: >-
    The DVL1-specific bone phenotype. High-resolution peripheral quantitative CT
    in molecularly confirmed patients shows a distinctive pattern — low cortical
    but increased trabecular bone mineral density, with fewer and thicker
    trabeculations — and cranial osteosclerosis is confined to the DVL1 (and one
    GPC4) genotype.
  cell_types:
  - preferred_term: osteoblast
    term:
      id: CL:0000062
      label: osteoblast
  biological_processes:
  - preferred_term: bone development
    modifier: DYSREGULATED
    term:
      id: GO:0060348
      label: bone development
  evidence:
  - reference: PMID:32888393
    reference_title: "Characterization of the Robinow syndrome skeletal phenotype, bone micro-architecture, and genotype-phenotype correlations with the osteosclerotic form."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Cranial osteosclerosis was only observed in DVL1-RS (4/4) and GPC4-RS
      (1/1) subjects and in one case was complicated by choanal atresia,
      bilateral conductive hearing loss, and cranial nerve III, VI, and VII
      palsy.
    explanation: >-
      Establishes the genotype restriction of the osteosclerosis and its
      clinical consequences.
  - reference: PMID:32888393
    reference_title: "Characterization of the Robinow syndrome skeletal phenotype, bone micro-architecture, and genotype-phenotype correlations with the osteosclerotic form."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      HR-pQCT revealed a unique pattern of low cortical BMD, increased
      trabecular BMD, decreased number of trabeculations, and increased
      thickness of the trabeculations for the DVL1-RS subjects.
    explanation: >-
      Gives the micro-architectural signature, which is not simply more bone
      everywhere.
  downstream:
  - target: Skull Osteosclerosis
    causal_link_type: DIRECT
    description: >-
      The radiographic expression of the cranial bone phenotype.
  - target: Increased Bone Mineral Density
    causal_link_type: DIRECT
    description: >-
      The DEXA-measurable expression of the same phenotype.
  - target: Macrocephaly
    causal_link_type: DIRECT
    description: >-
      Persistent macrocephaly travels with the osteosclerotic variant.
  - target: Hearing Loss
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Conductive hearing loss follows from skull-base osteosclerosis narrowing
      the middle-ear and foraminal spaces, in the same patients whose cranial
      nerve palsies arise the same way.

genetic:
- name: DVL1
  gene_term:
    preferred_term: DVL1
    term:
      id: hgnc:3084
      label: DVL1
  relationship_type: CAUSATIVE
  notes: >-
    Dishevelled 1. The pathogenic alleles are frameshifts confined to the
    penultimate exon — an unusually tight positional constraint that is
    diagnostically useful, since a truncating variant elsewhere in DVL1 should
    not be called causal for this entity on the strength of the gene alone.
  evidence:
  - reference: PMID:25817016
    reference_title: "DVL1 frameshift mutations clustering in the penultimate exon cause autosomal-dominant Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In total, six distinct frameshift mutations were found in eight subjects,
      and all were heterozygous truncating variants within the penultimate exon
      of DVL1.
    explanation: >-
      Establishes the gene, the allele class, and the exon restriction.
diagnosis:
- name: Molecular Confirmation of a DVL1 Penultimate-Exon Frameshift
  description: >-
    Confirmed by a heterozygous frameshift in the penultimate exon of DVL1.
    Because the alleles cluster in one exon, targeted sequencing of that exon in
    the DVL paralogs is a high-yield first step in a clinically typical dominant
    case; broad panel or exome testing is appropriate otherwise.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:25577943
    reference_title: "Autosomal Dominant Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The diagnosis of autosomal dominant Robinow syndrome is established in a
      proband with typical suggestive findings and/or by the identification of a
      heterozygous pathogenic variant in DVL1, DVL3, or WNT5A through molecular
      genetic testing.
    explanation: >-
      States the molecular confirmation criteria for the dominant forms.
  - reference: PMID:26924530
    reference_title: "DVL3 Alleles Resulting in a -1 Frameshift of the Last Exon Mediate Autosomal-Dominant Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      we elected to pursue direct Sanger sequencing of the penultimate exon of
      DVL1 and its paralogs DVL2 and DVL3 to search for potential
      disease-associated variants
    explanation: >-
      Supports the targeted penultimate-exon strategy described here.
differential_diagnoses:
- name: Autosomal Dominant Robinow Syndrome 1
  description: >-
    The WNT5A form. Hypomorphic ligand missense alleles rather than an altered
    transducer, and without the osteosclerosis, macrocephaly and preserved
    stature that mark the DVL1 form.
- name: Autosomal Dominant Robinow Syndrome 3
  description: >-
    The DVL3 form, mechanistically the closest relative: the same -1 frameshift
    architecture in the paralog. Distinguished by gene, not by phenotype.
- name: Autosomal Recessive Robinow Syndrome
  description: >-
    The ROR2 form. More severe skeletal involvement with vertebral segmentation
    defects and rib fusions, which the dominant forms do not produce, and
    recessive inheritance.
- name: Osteopetrosis and other sclerosing bone disorders
  description: >-
    Considered when cranial osteosclerosis dominates the presentation. The
    Robinow facial gestalt, mesomelia and genital hypoplasia separate them, as
    does the DVL1 micro-architecture — low cortical with high trabecular
    density, rather than uniformly dense bone.
treatments:

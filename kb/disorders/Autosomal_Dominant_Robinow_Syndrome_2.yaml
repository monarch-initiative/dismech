- name: Genetic and reproductive counseling
  description: >-
    Each child of an affected heterozygote has a 50% chance of inheriting the variant; severity cannot be predicted
    reliably. Offer family-specific counseling, parental assessment/testing and prenatal or preimplantation
    testing once the familial pathogenic variant is identified. The overall de novo fraction is unknown. If
    the variant is absent from both parents' blood, sibling recurrence remains low but nonzero because germline
    mosaicism cannot be excluded; GeneReviews quotes less than 1% for this circumstance across ADRS.
  treatment_term:
    preferred_term: Genetic Counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Once the DVL1, DVL3, or WNT5A pathogenic variant has been identified in an affected family member, prenatal
      and preimplantation genetic testing are possible.
    explanation: >-
      Family-specific reproductive testing and counseling, not prevention of the developmental mechanism.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      the risk to sibs is presumed to be slightly greater than that of the general population (though still
      <1%) because of the theoretic possibility of parental germline mosaicism.
    explanation: >-
      Applies after a proband variant is undetectable in both parents' leukocyte DNA; not a measured DVL1-specific
      recurrence rate.
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Each child of an individual with ADRS has a 50% chance of inheriting the pathogenic variant; however,
      the severity of the clinical manifestations cannot be predicted from the results of molecular genetic
      testing.
    explanation: >-
      Transmission probability applies to a heterozygous affected parent; variable expression limits prediction
      of severity.
  action_category: COUNSELING_INFORMATIONAL
mechanistic_hypotheses:
- hypothesis_group_id: nuclear_mislocalization_transcription_model
  hypothesis_label: Neomorphic Nuclear Mislocalization Model
  status: EMERGING
  description: >-
    Nuclear enrichment of altered DVL1 could change transcription or interactions with transcription factors,
    contributing to developmental abnormalities. This is a proposed consequence of the cellular localization
    result; no causal transcriptional target or direct connection to cranial osteosclerosis has been established.
    The model can coexist with altered cytoplasmic signaling.
  evidence:
  - reference: PMID:42424595
    reference_title: "The abnormal C-terminus caused by DVL1 variants impacts Robinow syndrome phenotypes."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Further studies are needed to precisely determine whether nuclear DVL1 plays a transcriptional role in
      eliciting phenotypes in RS.
    explanation: >-
      Author interpretation explicitly leaves the transcriptional consequence untested.
    quote_role: PRIMARY_RESULT
- hypothesis_group_id: coexpression_canonical_wnt_gain_model
  hypothesis_label: Dominant-Increase Canonical Wnt Co-Expression Model
  status: ALTERNATIVE
  description: >-
    The 2015 C2C12 assay found increased canonical WNT reporter output when mutant and wild-type DVL1 were
    co-expressed. This could contribute to osteosclerosis, but the human bone link is untested. The 2023 HEK293
    co-expression experiment instead found reduced output. Cell type, expression dose and experimental design
    differ, so neither assay is a universal physiological heterozygous state and the results remain unreconciled.
    Nuclear effects are not excluded by this model.
  evidence:
  - reference: PMID:25817014
    reference_title: "Mutations in DVL1 cause an osteosclerotic form of Robinow syndrome."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: >-
      However, when the mutant and wild-type alleles were co-expressed,
      canonical Wnt activity was 2-fold higher than that in the wild-type
      construct alone.
    explanation: >-
      Canonical co-expression gain in a cell-based reporter assay; the proposed osteosclerosis consequence
      was not directly tested.
  - reference: PMID:36916233
    reference_title: Mechanistic studies in Drosophila and chicken give new insights into functions of DVL1 in dominant Robinow syndrome.
    supports: REFUTE
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      When plasmids expressing the variants were added in equimolar concentration with the wtDVL1 plasmid,
      all three had significant dominant-negative effects on wtDVL1
    explanation: >-
      Primary HEK293 experiment directly identifies the study recounted in PMID:42424595. The authors propose
      dose as a possible explanation for the discrepancy with C2C12; no direct reconciliation experiment is
      reported.
discussions:
- discussion_id: dvl1_frameshift_mode_of_action
  kind: KNOWLEDGE_GAP
  prompt: >-
    Which context-dependent effects of the altered DVL1 C terminus drive human developmental abnormalities
    and cranial osteosclerosis?
  attaches_to:
  - pathophysiology#Nuclear enrichment of altered DVL1
  - pathophysiology#Context-dependent WNT signal transduction
  - mechanistic_hypotheses#coexpression_canonical_wnt_gain_model
  rationale: >-
    Overexpression studies distinguish altered C-terminal sequence from a simple truncation, but both constructs
    retain some activity. Nuclear enrichment occurs in HEK cells and is not seen in fly follicle cells. Reporter
    direction depends on pathway and model. Direct targets, patient-tissue localization and the route to excess
    cranial bone remain unresolved. No allele-directed clinical treatment follows from these observations.

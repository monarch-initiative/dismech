- name: Disordered cartilage architecture
  description: >-
    Variant-expressing chicken cartilage is dysplastic, with irregular nuclei and patchy hypertrophic COL10A1
    expression. Early Golgi-angle and cell-shape assays did not distinguish variants from wild-type DVL1 overexpression;
    only selected variant-versus-GFP comparisons were significant. Both wild type and variants shortened experimental
    bones. The specifically mesomelic human pattern is not fully explained.
  evidence:
  - reference: PMID:36916233
    reference_title: Mechanistic studies in Drosophila and chicken give new insights into functions of DVL1 in dominant Robinow syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Variant-infected limbs had dysplastic cartilage morphology with disorganized chondrocytes and irregular
      borders that were not seen in the wtDVL1-infected limbs
    explanation: >-
      Experimental avian cartilage architecture; separate from early polarity measurements.
  - reference: PMID:36916233
    reference_title: Mechanistic studies in Drosophila and chicken give new insights into functions of DVL1 in dominant Robinow syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Overall, the variants did not produce differences relative to wtDVL1 in stage 29 limbs in all the assays
      (proliferation, Golgi-nucleus angle, roundness and apoptosis).
    explanation: >-
      Early-stage negative comparisons constrain the claim of a variant-specific polarity mechanism.
  mechanism_confidence: PROVISIONAL

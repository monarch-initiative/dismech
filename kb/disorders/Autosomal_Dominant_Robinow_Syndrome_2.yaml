      pathogenic variants in FGD1 are the most frequent molecular diagnostic finding in clinically diagnosed
      RS with otherwise negative testing
    explanation: >-
      Selected cohort finding supports including FGD1 in the molecular differential; it does not estimate prevalence
      in all referrals.
- name: ROR2-related autosomal recessive Robinow syndrome
  description: >-
    Biallelic ROR2 variants cause a recessive Robinow syndrome that often has more severe skeletal and vertebral
    involvement. Severity overlaps with dominant forms, and vertebral anomalies do not categorically exclude
    a dominant etiology. Inheritance and molecular testing provide the distinction.

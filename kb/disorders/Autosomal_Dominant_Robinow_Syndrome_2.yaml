discussions:
- discussion_id: dvl1_frameshift_mode_of_action
  kind: KNOWLEDGE_GAP
  prompt: >-
    Does the nuclear-mislocalized frameshift protein alter transcription, and is
    that what produces the skeletal phenotype and the DVL1-specific
    osteosclerosis?
  attaches_to:
  - pathophysiology#Nuclear Mislocalization of Altered Dishevelled
  rationale: >-
    The 2026 comparison against a stop codon at the same position settled that
    the reduced canonical and JNK-PCP signalling is a consequence of losing the
    wild-type C-terminus, not of the novel peptide — yet only the frameshift
    perturbs morphogenesis, and only it goes to the nucleus. Something the novel
    peptide does, beyond reduced signalling, is doing the work. The authors
    propose altered nuclear transcription; no target has been identified. The
    distinction is actionable: a gained nuclear activity is in principle a
    target for allele-specific knockdown, whereas a lost domain function is not.
    It would also explain why osteosclerosis is confined to this genotype.

- name: Persistence of mutant DVL1 transcript
  description: >-
    Both normal and variant DVL1 transcripts are detectable in sampled patient leukocytes. This supports escape
    from nonsense-mediated decay for the tested alleles; it is not direct measurement of mutant protein abundance
    in developing skeletal tissue.
  evidence:
  - reference: PMID:25817016
    reference_title: DVL1 frameshift mutations clustering in the penultimate exon cause autosomal-dominant Robinow syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Study of the transcripts extracted from affected subjects' leukocytes confirmed expression of both wild-type
      and variant alleles, supporting the hypothesis that mutant mRNA escapes NMD.
    explanation: >-
      Patient RNA observation, distinct from protein expression assays.
  downstream:
  - target: Altered DVL1 C-terminal protein sequence
    causal_link_type: DIRECT
    description: >-

name: Autosomal Dominant Robinow Syndrome 2
synonyms:
- DRS2
- DVL1-related Robinow syndrome
- Robinow syndrome, autosomal dominant 2
- osteosclerotic form of Robinow syndrome
creation_date: "2026-08-27T00:00:00Z"
category: Mendelian
disease_term:
  preferred_term: autosomal dominant Robinow syndrome 2
  term:
    id: MONDO:0014591
    label: autosomal dominant Robinow syndrome 2
description: >-
  DVL1-related dominant Robinow syndrome is a developmental skeletal and craniofacial disorder with variable
  mesomelia, brachydactyly, facial features and genital abnormalities. Macrocephaly and cranial osteosclerosis
  are prominent in many reported patients, but normal stature and osteosclerosis are not universal diagnostic
  requirements.

  The characteristic alleles alter the C-terminal sequence through a selected minus-one frameshift; a splice-acceptor
  variant predicted to produce the same frame has also been reported. Mutant transcripts persist in sampled
  patient cells. Functional models reveal altered signaling, context-dependent nuclear enrichment and developmental
  abnormalities, but neither a universal direction of WNT activity nor the mechanism of excess cranial bone
  has been established.

  Clinical care addresses skeletal, dental, genital, hearing and other associated findings. Experimental reporter
  effects are not evidence that a pathway-directed treatment corrects the human disease.
parents:
- Robinow Syndrome
- Skeletal Dysplasia
notes: >-
  GeneReviews is a clinical baseline across dominant Robinow genotypes; its feature lists are not DVL1-specific
  frequencies. The 2022 phenotype compilation is retrospective, selected and incomplete, with overlapping published
  cohorts. The 2020 bone study contains four DVL1 cases among seven individuals of different genotypes. Nuclear
  enrichment and signaling results come from overexpression systems; physiological expression and patient tissue
  may differ. The two proposed functional models are not mutually exclusive and neither establishes the cause
  of cranial osteosclerosis. Less-common renal anomalies, nail dysplasia and developmental delay are included
  in baseline assessment and follow-up, without assigning DVL1-specific population frequencies. Umbilical hernia,
  macrocephaly, vertebral anomalies and cardiac defects remain clinical associations without invented causal
  intermediates.

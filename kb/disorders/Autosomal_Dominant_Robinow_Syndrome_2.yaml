- name: Cranial osteosclerosis
  description: >-
    Cranial osteosclerosis was observed in four DVL1 cases in a seven-person mixed-genotype study and also
    in its single GPC4 case. It is enriched in DVL1-related Robinow syndrome but not demonstrated to be genotype-exclusive
    or universal. Neither altered nuclear DVL1 nor a canonical reporter effect has been shown to cause the
    human cranial bone phenotype.
  evidence:
  - reference: PMID:32888393
    reference_title: "Characterization of the Robinow syndrome skeletal phenotype, bone micro-architecture, and genotype-phenotype correlations with the osteosclerotic form."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Cranial osteosclerosis was only observed in DVL1-RS (4/4) and GPC4-RS (1/1) subjects and in one case
      was complicated by choanal atresia, bilateral conductive hearing loss, and cranial nerve III, VI, and
      VII palsy.
    explanation: >-
      Small selected clinical cohort; the abstract does not identify the genotype of the individual with complications.
  downstream:
  - target: Skull Osteosclerosis
    causal_link_type: DIRECT
    description: >-
      Radiographic manifestation of the cranial density abnormality.
  - target: Increased Bone Mineral Density
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Cranial density can contribute to high DXA measurements; peripheral bone compartments need not be uniformly
      dense.
  - target: Hearing Loss
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      Osteosclerosis can accompany conductive hearing impairment; it does not explain all mixed or other hearing
      loss.
  biological_scale: TISSUE
- name: Altered peripheral bone microarchitecture
  description: >-
    The DVL1 subgroup in a small HR-pQCT study showed lower cortical and higher trabecular density, with fewer
    and thicker trabeculations. These are peripheral measurements and must not be presented as direct imaging
    of cranial bone or proof of uniformly increased skeletal density.
  evidence:
  - reference: PMID:32888393
    reference_title: "Characterization of the Robinow syndrome skeletal phenotype, bone micro-architecture, and genotype-phenotype correlations with the osteosclerotic form."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      HR-pQCT revealed a unique pattern of low cortical BMD, increased trabecular BMD, decreased number of
      trabeculations, and increased thickness of the trabeculations for the DVL1-RS subjects.
    explanation: >-
      Observed peripheral microarchitecture in four selected DVL1 participants; no specific osteoblast mechanism
      was measured.
  biological_scale: TISSUE
phenotypes:
- category: Skeletal
  name: Mesomelic Limb Shortening
  description: >-
    Shortening of the middle limb segments - forearm and lower leg - with upper-limb predominance. The mesomelic
    pattern is the skeletal signature of this condition and what distinguishes it from proportionate short
    stature.
  phenotype_term:
    preferred_term: Mesomelia
    term:
      id: HP:0003027
      label: Mesomelia
  evidence:
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: mesomelic limb shortening predominantly of the upper limbs
    explanation: >-
      States both the mesomelic pattern and its upper-limb predominance. This chapter covers dominant Robinow
      syndrome across genes; it is not a DVL1-specific frequency estimate.
    quote_role: REVIEW_SYNTHESIS
- category: Growth
  name: Short Stature
  description: >-
    Stature is variable. Short stature was reported in 8 of 21 assessed DVL1 cases in the selected 2022 compilation;
    normal or low-normal stature does not exclude this diagnosis. The cross-genotype GeneReviews birth-onset
    description should not be read as universal for DVL1 disease.
  phenotype_term:
    preferred_term: Short stature
    term:
      id: HP:0004322
      label: Short stature
  evidence:
  - reference: PMID:35047859
    reference_title: "Novel pathogenic variants and quantitative phenotypic analyses of Robinow syndrome: WNT signaling perturbation and phenotypic variability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      only 38% (N = 8 out of 21) of DVL1 individuals have short stature
    explanation: >-
      Selected retrospective cohort with incomplete phenotype data; this is not population penetrance.

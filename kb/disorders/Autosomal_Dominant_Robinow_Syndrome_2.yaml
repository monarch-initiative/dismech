- name: Osteopetrosis and other sclerosing bone disorders
  description: >-
    Consider other sclerosing bone disorders when high cranial density dominates. The combined Robinow facial,
    limb and genital phenotype and DVL1 testing inform distinction. Regional cortical and trabecular measurements
    are not a universal rule separating all sclerosing bone disorders.
  evidence:
  - reference: PMID:32888393
    reference_title: "Characterization of the Robinow syndrome skeletal phenotype, bone micro-architecture, and genotype-phenotype correlations with the osteosclerotic form."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      HR-pQCT revealed a unique pattern of low cortical BMD, increased trabecular BMD, decreased number of
      trabeculations, and increased thickness of the trabeculations for the DVL1-RS subjects.
    explanation: >-
      Observed peripheral microarchitecture in four selected DVL1 participants; no specific osteoblast mechanism
      was measured.

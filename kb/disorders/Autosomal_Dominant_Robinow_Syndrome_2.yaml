      is unmeasured.
  biological_scale: MOLECULAR
- name: Altered DVL1 C-terminal protein sequence
  description: >-
    The frameshift replaces most of the native C terminus while preserving upstream DIX, PDZ and DEP domains.
    Transfected constructs produce detectable altered protein, but expression level, tag and host cell influence
    assay interpretation. The novel sequence has effects that differ from a simple stop construct.
  evidence:
  - reference: PMID:25817014
    reference_title: Mutations in DVL1 cause an osteosclerotic form of Robinow syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      demonstrated unimpaired protein stability with transfected GFP-tagged constructs bearing a frameshift
      mutation.
    explanation: >-
      Transfected GFP-tagged protein assay; no direct patient-bone protein measurement is claimed.
  downstream:

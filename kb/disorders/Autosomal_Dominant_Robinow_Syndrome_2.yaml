      label: Autosomal dominant inheritance
  description: >-
    Heterozygous pathogenic variants cause dominant disease. De novo origin was demonstrated in five discovery
    families with available parental samples; this ascertainment does not establish a population de novo fraction.
    An affected heterozygote has a 50% variant-transmission probability, with severity incompletely predictable.
    Parental assessment and testing inform recurrence counseling.
  evidence:
  - reference: PMID:25577943
    reference_title: "Autosomal Dominant Robinow Syndrome."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      ADRS is inherited in an autosomal dominant manner.
    explanation: >-
      GeneReviews states the inheritance mode for the dominant forms, of which
      this is one.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:25817016
    reference_title: "DVL1 frameshift mutations clustering in the penultimate exon cause autosomal-dominant Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In five families in which samples from unaffected parents were available,
      the variants were demonstrated to represent de novo mutations.
    explanation: >-
      Establishes de novo origin in the families that could be tested.
pathophysiology:
- name: Heterozygous DVL1 C-terminal alteration
  description: >-
    Selected variants near the DVL1 C terminus cause a minus-one frameshift, replacing the native terminal
    sequence. Most are small coding insertions/deletions; c.1640-1C>T is a reported splice-acceptor variant
    with a predicted cryptic-splice/minus-one effect. A generic truncating variant elsewhere in the gene is
    not equivalent.
  evidence:
  - reference: PMID:25817016
    reference_title: DVL1 frameshift mutations clustering in the penultimate exon cause autosomal-dominant Robinow syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      In total, six distinct frameshift mutations were found in eight subjects, and all were heterozygous truncating
      variants within the penultimate exon of DVL1.
    explanation: >-
      Human discovery cohort establishes a restricted allele class.
  - reference: PMID:35047859
    reference_title: "Novel pathogenic variants and quantitative phenotypic analyses of Robinow syndrome: WNT signaling perturbation and phenotypic variability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      BAB13797 was found to have a previously unreported heterozygous splicing variant in DVL1, which is the
      first splicing variant reported in this gene thus far.
    explanation: >-
      The variant was classified as likely pathogenic; inheritance was unknown and its transcript consequence
      was predicted rather than measured.

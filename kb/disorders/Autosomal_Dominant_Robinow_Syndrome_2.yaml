- name: Structured Multisystem Surveillance
  therapeutic_modality: OTHER
  description: >-
    Measure head circumference through infancy and childhood. Assess development every three months in infancy
    and every six to twelve months thereafter. Arrange dental review every six to twelve months, periodic hearing
    assessment in childhood, and specialist cardiac or renal monitoring if abnormalities are identified. These
    are GeneReviews recommendations across dominant Robinow genotypes.
  treatment_term:
    preferred_term: supportive care
    term:
      id: NCIT:C15747
      label: Supportive Care
  evidence:
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      Measurement of head circumference regularly in infancy and throughout childhood. Developmental assessment
      every three months in infancy and every six months to one year thereafter
    explanation: >-
      The GeneReviews Surveillance schedule, quoted for the elements it specifies by interval.
    quote_role: REVIEW_SYNTHESIS
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Dental evaluation every six to 12 months or as recommended. Periodic hearing assessments in childhood.
      Regular cardiac and renal assessment as needed by respective specialists if abnormalities are identified.
    explanation: >-
      GeneReviews clinical baseline across dominant Robinow genotypes; no DVL1-specific frequency is inferred.
- name: Orthodontic Treatment
  therapeutic_modality: DEVICE
  description: >-
    Orthodontic management is typically required, reflecting the dental crowding, malocclusion, hypodontia
    and delayed eruption that accompany the craniofacial phenotype.

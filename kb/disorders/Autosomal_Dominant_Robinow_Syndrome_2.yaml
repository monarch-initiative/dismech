genetic:
- name: DVL1
  gene_term:
    preferred_term: DVL1
    term:
      id: hgnc:3084
      label: DVL1
  relationship_type: CAUSATIVE
  notes: >-
    Pathogenic DVL1 alleles characteristically alter the terminal reading frame and C-terminal sequence. The
    discovery series found penultimate-exon minus-one frameshifts; a 2022 report additionally classified c.1640-1C>T
    as likely pathogenic, with a cryptic acceptor and the same minus-one frame predicted computationally. The
    splice effect was not demonstrated in patient RNA. Neither an arbitrary DVL1 truncation nor every variant
    near the gene end establishes this diagnosis.
  evidence:
  - reference: PMID:25817016
    reference_title: "DVL1 frameshift mutations clustering in the penultimate exon cause autosomal-dominant Robinow syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In total, six distinct frameshift mutations were found in eight subjects,
      and all were heterozygous truncating variants within the penultimate exon
      of DVL1.
    explanation: >-
      Discovery cohort establishes the initial coding-frameshift series; it does not exclude later splice-associated
      alleles.
  - reference: PMID:35047859
    reference_title: "Novel pathogenic variants and quantitative phenotypic analyses of Robinow syndrome: WNT signaling perturbation and phenotypic variability."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      BAB13797 was found to have a previously unreported heterozygous splicing variant in DVL1, which is the
      first splicing variant reported in this gene thus far.
    explanation: >-
      The variant was classified as likely pathogenic; inheritance was unknown and its transcript consequence
      was predicted rather than measured.
diagnosis:
- name: Molecular Genetic Testing
  description: >-
    Typical findings warrant molecular testing to identify a heterozygous pathogenic or likely pathogenic DVL1
    variant with an appropriate terminal-sequence effect. A variant of uncertain significance neither establishes
    nor excludes the diagnosis. Testing should cover relevant coding and splice regions and detect small indels,
    rather than assume every truncating allele is causal. A Robinow/skeletal-dysplasia panel or exome/genome
    analysis can assess overlapping dominant and recessive etiologies, with laboratory-specific gene content
    and coverage.
  evidence:
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of autosomal dominant Robinow syndrome is established in a proband with typical suggestive
      findings and/or by the identification of a heterozygous pathogenic variant in DVL1, DVL3, or WNT5A through
      molecular genetic testing.
    explanation: The GeneReviews Diagnosis/Testing criterion in full.
    quote_role: REVIEW_SYNTHESIS
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Identification of a heterozygous DVL1, DVL3, or WNT5A variant of uncertain significance does not establish
      or rule out the diagnosis.
    explanation: Variant uncertainty must remain distinct from molecular confirmation.
  diagnosis_term:
    preferred_term: genetic testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
- name: Baseline organ and skeletal evaluation
  description: >-
    Assess skeletal extent with radiographs of limbs, chest, vertebrae and skull, including cranial density
    and bone complications where indicated. Obtain echocardiography, renal ultrasound and hearing assessment;
    consider pelvic ultrasound in females and urologic/endocrine assessment for genital abnormalities. Evaluate
    development and dental/craniofacial findings. These are cross-genotype baseline recommendations, not DVL1-specific
    frequencies.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Renal ultrasound To assess for renal anomalies & hydronephrosis
    explanation: >-
      GeneReviews recommends baseline assessment for renal anomalies and hydronephrosis across dominant Robinow
      genotypes.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Cardiovascular Echocardiogram To evaluate for congenital heart defect
    explanation: >-
      Baseline echocardiography differs from subsequent specialist monitoring only when abnormalities are found.
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: Radiographs of limbs, chest, vertebrae, & skull To establish the extent of skeletal involvement
    explanation: >-
      Baseline skeletal characterization can detect vertebral complications without asserting they arise directly
      from a growth-plate lesion.
differential_diagnoses:
- name: WNT5A-related Robinow syndrome
  description: >-
    Heterozygous WNT5A disease shares craniofacial, genital and limb findings. Macrocephaly and short stature
    do not provide absolute gene separators; molecular testing distinguishes the ligand-associated disorder
    from DVL1 disease.
  disease_term:
    preferred_term: autosomal dominant Robinow syndrome 1
    term:
      id: MONDO:0024455
      label: autosomal dominant Robinow syndrome 1
  evidence:
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      The diagnosis of autosomal dominant Robinow syndrome is established in a proband with typical suggestive
      findings and/or by the identification of a heterozygous pathogenic variant in DVL1, DVL3, or WNT5A through
      molecular genetic testing.
    explanation: The GeneReviews Diagnosis/Testing criterion in full.
    quote_role: REVIEW_SYNTHESIS
- name: DVL3-related Robinow syndrome
  description: >-
    Overlapping dominant skeletal and craniofacial findings with a higher reported burden of cardiac abnormalities
    in small series. Molecular testing separates this adaptor-related disorder from DVL1-related disease.
  evidence:
  - reference: url:https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    reference_title: https://www.ncbi.nlm.nih.gov/sites/books/NBK268648/pdf/Bookshelf_NBK268648.pdf
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Three out of four individuals with DVL3-associated ADRS had cardiac abnormalities; osteosclerosis has
      not been reported.
    explanation: Small chapter-era series, not a stable population frequency or a rule excluding osteosclerosis.
  - reference: PMID:26924530
    reference_title: DVL3 Alleles Resulting in a -1 Frameshift of the Last Exon Mediate Autosomal-Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Similar to the variants observed in DVL1-mediated Robinow syndrome, all variants in DVL3 result in a
      -1 frameshift
    explanation: >-
      Primary molecular series identifies a convergent reading-frame consequence for its DVL3 alleles. Molecular
      testing distinguishes the paralog-associated disorder; the discovery protocol is not a preferred clinical
      testing guideline.
  disease_term:
    preferred_term: autosomal dominant Robinow syndrome 3
    term:
      id: MONDO:0014819
      label: autosomal dominant Robinow syndrome 3
- name: NXN-related recessive Robinow syndrome
  description: >-
    Biallelic NXN variants produce a clinically overlapping recessive syndrome. Inheritance and molecular testing
    distinguish it; phenotype severity alone is unreliable.
  evidence:

- name: Craniofacial morphogenetic disruption
  description: >-
    DVL1-related disease alters development of multiple craniofacial and oral structures. As one experimental
    component, chicken 1519ΔT misexpression widens the frontonasal mass and impairs prenasal cartilage and
    premaxillary bone formation, with reduced proliferation at the later embryonic time point. This model does
    not directly explain every human facial or oral feature, and neither increased proliferation nor impaired
    neural-crest migration was demonstrated as the cause.
  evidence:
  - reference: PMID:42424595
    reference_title: The abnormal C-terminus caused by DVL1 variants impacts Robinow syndrome phenotypes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      frontonasal mass width was significantly greater in the DVL11519ΔT embryos compared to GFP and wtDVL1
    explanation: >-
      Chicken morphometry supports impaired narrowing; it does not establish every facial feature through one
      pathway.
  - reference: PMID:25577943
    reference_title: Autosomal Dominant Robinow Syndrome.
    supports: SUPPORT
    evidence_source: OTHER
    snippet: >-
      dysmorphic facial features (widely spaced and prominent eyes, frontal bossing, anteverted nares, midface
      retrusion)
    explanation: >-
      Describes the widely spaced prominent eyes this record captures. This chapter covers dominant Robinow
      syndrome across genes; it is not a DVL1-specific frequency estimate.
    quote_role: REVIEW_SYNTHESIS
  mechanism_confidence: PROVISIONAL

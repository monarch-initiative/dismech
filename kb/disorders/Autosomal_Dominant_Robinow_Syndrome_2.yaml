- name: Growth Hormone Therapy (selected patients)
  therapeutic_modality: PROTEIN_REPLACEMENT
  description: >-
    Consider growth hormone replacement when endocrine evaluation demonstrates deficiency. A small 1999 clinical
    series reported increased growth velocity in treated patients, but their molecular subtypes were uncharacterized.
    This supports selected treatment of coexisting deficiency without establishing efficacy in DVL1-confirmed
    disease or correction of its developmental mechanism.

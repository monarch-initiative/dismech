      patterning defect. Corrective, not disease-modifying.
  evidence:
  - reference: PMID:25577943
    reference_title: "Autosomal Dominant Robinow Syndrome."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Orthodontic treatment is typically required.
    explanation: >-
      GeneReviews states that orthodontic treatment is typically required.
- name: Genital Reconstructive Surgery
  description: >-
    Corrective surgery for cryptorchidism and abnormal penile insertion or

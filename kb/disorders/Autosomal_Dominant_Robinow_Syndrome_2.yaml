    causal_link_type: DIRECT
    description: >-
      Tagged variants become enriched in nuclei of HEK cells; this distribution is not universal across species.
    hypothesis_groups:
    - nuclear_mislocalization_transcription_model
  - target: Cranial osteosclerosis
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      DVL1 genotype is associated with cranial osteosclerosis, but the cellular link remains unresolved.
  - target: Altered peripheral bone microarchitecture
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
    description: >-
      DVL1-associated peripheral microarchitecture is clinically observed; the intervening cell mechanism is

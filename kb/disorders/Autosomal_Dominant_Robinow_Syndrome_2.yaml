- name: Nuclear enrichment of altered DVL1
  description: >-
    Tagged DVL1 frameshift proteins are more frequently nuclear in HEK293 cells. In the 2026 DVL-triple-knockout
    comparison, 1519ΔT is enriched in nuclei while wild type and the 1519-stop construct are mainly cytoplasmic.
    In Drosophila follicle cells, the human variants instead remain cytoplasmic/membrane-associated. Altered
    nuclear export or protein conformation is proposed; the exact export sequence and downstream transcriptional
    effects remain unresolved.
  evidence:
  - reference: PMID:42424595
    reference_title: The abnormal C-terminus caused by DVL1 variants impacts Robinow syndrome phenotypes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      In contrast, the plasmid expressing Flag-tagged DVL11519ΔT were primarily localized within the nucleus
    explanation: >-
      Tagged-protein assay in HEK293T DVL-triple-knockout cells, not a patient tissue observation.
  - reference: PMID:36916233
    reference_title: Mechanistic studies in Drosophila and chicken give new insights into functions of DVL1 in dominant Robinow syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      The lack of nuclear expression of Flag-tagged human DVL1 variants in the Drosophila cells compared to
      predominantly nuclear expression in HEK293 cells may be due to differences in the cellular context.
    explanation: >-
      The full-text comparison prevents generalizing nuclear localization to every model.
  mechanism_confidence: PROVISIONAL
  biological_scale: CELLULAR
- name: Impaired chondrocyte differentiation
  description: >-
    DVL1-variant misexpression in chicken limbs creates regions of virus-positive, SOX9-negative mesenchyme
    within cartilage. In the face, 1519ΔT replaces portions of SOX9-positive prenasal cartilage with TWIST-positive
    mesenchyme; later cultured cartilage expansion is impaired. These model observations support disturbed
    differentiation, without proving a patient-cell transcriptional target.
  evidence:
  - reference: PMID:36916233
    reference_title: Mechanistic studies in Drosophila and chicken give new insights into functions of DVL1 in dominant Robinow syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Some areas of the DVL11519ΔT-infected cartilage have GAG staining, but cells are undifferentiated as
      shown by the absence of SOX9 staining
    explanation: >-
      Figure-associated result from chicken limbs, supported by virus/SOX9 co-staining.
  - reference: PMID:42424595
    reference_title: The abnormal C-terminus caused by DVL1 variants impacts Robinow syndrome phenotypes.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      These results suggest the DVL11519ΔT virus prevents neural crest-derived mesenchymal differentiation
      into cartilage that forms the template of the upper beak.
    explanation: >-
      Chicken frontonasal cartilage observation; no neural-crest migration defect is inferred because injection
      follows migration.

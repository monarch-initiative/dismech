  biological_scale: MOLECULAR
- name: Context-dependent WNT signal transduction
  description: >-
    DVL1 variants alter canonical and noncanonical WNT outputs. The 2015 C2C12 co-expression assay increased
    canonical activity, while 2023 HEK293 and fly assays supported reduced canonical output. JNK readouts increase
    for selected variants in HEK293 cells and in flies but are weaker in 2026 chicken facial cultures. These
    assays do not establish one direction in all patient tissues.
  evidence:
  - reference: PMID:36916233
    reference_title: Mechanistic studies in Drosophila and chicken give new insights into functions of DVL1 in dominant Robinow syndrome.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      When plasmids expressing the variants were added in equimolar concentration with the wtDVL1 plasmid,
      all three had significant dominant-negative effects on wtDVL1
    explanation: >-
      Direct canonical reporter result in HEK293 cells; the later paper recounts this identifiable primary
      study.
  - reference: PMID:42424595
    reference_title: The abnormal C-terminus caused by DVL1 variants impacts Robinow syndrome phenotypes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Thus, our data suggest that in primary cells, the Robinow syndrome variant DVL11519ΔT and the DVL11519*
      truncation are both able to weakly activate the WNT canonical and JNK/PCP pathways.
    explanation: >-
      Primary chicken facial cells retain weak activation, unlike the same constructs in DVL-triple-knockout
      HEK cells.
  - reference: PMID:36916233
    reference_title: Mechanistic studies in Drosophila and chicken give new insights into functions of DVL1 in dominant Robinow syndrome.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      Both assays indicated that the DVL1 variants ectopically induced JNK signaling in the wing pouch
    explanation: >-
      Drosophila Mmp1 and puckered reporter results; wing-hair polarity alone cannot determine whether signaling
      increased or decreased.

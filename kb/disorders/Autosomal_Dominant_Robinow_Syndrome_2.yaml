    snippet: >-
      Recombinant human GH therapy in our patient and the three patients from the NCGS resulted in a significant
      increase in the growth rate per year.
    explanation: >-
      Clinical growth-rate response in patients of unknown genotype; transfer to DVL1-related disease is indirect.

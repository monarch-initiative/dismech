diagnosis:
- name: Urine dipstick and culture
  description: >-
    Acute cystitis is diagnosed clinically and supported by urine dipstick
    (leukocyte esterase, nitrite) and confirmed by urine culture.
  evidence:
  - reference: PMID:23859578
    reference_title: >-
      History and physical examination plus laboratory testing for the diagnosis of adult female urinary tract infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The comparator was UTI confirmed by a positive urine culture.
    explanation: >-
      Establishes a positive urine culture as the reference standard for UTI
      diagnosis.
  - reference: PMID:23859578
    reference_title: >-
      History and physical examination plus laboratory testing for the diagnosis of adult female urinary tract infection.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Urinalysis with a positive nitrite or moderate pyuria and/or bacteruria
      are accurate predictors of a UTI
    explanation: >-
      Supports urine dipstick nitrite and pyuria/bacteriuria as accurate
      predictors of UTI.
treatments:
- name: Nitrofurantoin first-line antimicrobial therapy
  description: >-
    Acute uncomplicated cystitis can be treated with oral nitrofurantoin, which
    concentrates in urine and targets the lower-urinary-tract bacterial
    population while producing little systemic exposure.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: Nitrofurantoin
      term:
        id: NCIT:C29293
        label: Nitrofurantoin
  target_mechanisms:
  - target: FimH-Mediated Urothelial Adhesion
    treatment_effect: INHIBITS
    description: >-
      Nitrofurantoin kills or suppresses bladder uropathogens and thereby
      removes the bacterial driver of urothelial colonization.
  - target: Acute Neutrophilic Bladder Inflammation
    treatment_effect: INHIBITS
    description: >-
      Bacterial eradication removes the stimulus for acute bladder
      inflammation.
  evidence:
  - reference: PMID:42594063
    reference_title: >-
      Nitrofurantoin treatment and prophylaxis for recurrent urinary tract
      infections in women: First-line for a reason.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Nitrofurantoin is considered a first-line antimicrobial agent by the
      AUA/CUA/SUFU Guideline and Infectious Disease Society of America (IDSA)
      Guideline for the treatment of acute uncomplicated simple cystitis in
      women.
    explanation: >-
      Supports nitrofurantoin as a guideline-backed first-line oral antibiotic
      option for acute uncomplicated cystitis.
- name: Fosfomycin first-line therapy
  description: >-
    Single-dose oral fosfomycin is a guideline first-line agent for acute
    uncomplicated cystitis.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: fosfomycin
      term:
        id: CHEBI:28915
        label: fosfomycin
  target_mechanisms:
  - target: FimH-Mediated Urothelial Adhesion
    treatment_effect: INHIBITS
    description: >-
      Bactericidal fosfomycin clears uropathogenic E. coli from the bladder.
  evidence:
  - reference: PMID:34896337
    reference_title: >-
      A global perspective on improving patient care in uncomplicated urinary tract infection: expert consensus and practical guidance.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Specific antimicrobials are first-line therapy (typically nitrofurantoin,
      fosfomycin, trimethoprim/sulfamethoxazole and pivmecillinam, dependent on
      availability and local resistance data).
    explanation: >-
      Names fosfomycin, trimethoprim/sulfamethoxazole and pivmecillinam among
      the guideline first-line agents for uncomplicated UTI.
- name: Trimethoprim-sulfamethoxazole first-line therapy
  description: >-
    Trimethoprim-sulfamethoxazole is a guideline first-line agent for acute
    uncomplicated cystitis where local resistance is low.
  therapeutic_modality: SMALL_MOLECULE

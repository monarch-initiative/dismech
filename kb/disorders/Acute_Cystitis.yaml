progression:
- phase: Acute cystitis episode
  notes: Acute onset of dysuria, urgency and frequency over hours to a few days.
- phase: Resolution or recurrence
  notes: >-
    Most episodes resolve with antimicrobial therapy; intracellular bacterial
    communities can seed recurrent cystitis.
- phase: Ascending pyelonephritis
  notes: >-
    Uncommonly, infection ascends from the bladder to the kidney, producing
    acute pyelonephritis.

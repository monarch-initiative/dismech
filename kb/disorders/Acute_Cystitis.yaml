treatments:
- name: Nitrofurantoin first-line antimicrobial therapy
  description: >-
    Acute uncomplicated cystitis can be treated with oral nitrofurantoin, which
    concentrates in urine and targets the lower-urinary-tract bacterial
    population while producing little systemic exposure.
  therapeutic_modality: SMALL_MOLECULE
  treatment_term:
    preferred_term: Antibiotic Therapy
    term:
      id: NCIT:C15620
      label: Antibiotic Therapy
    therapeutic_agent:
    - preferred_term: Nitrofurantoin
      term:
        id: NCIT:C29293
        label: Nitrofurantoin
  target_mechanisms:
  - target: Urothelial Adhesion and Proliferation
    treatment_effect: INHIBITS
    description: >-
      Nitrofurantoin kills or suppresses bladder uropathogens and thereby
      removes the bacterial driver of urothelial colonization.
  - target: Acute Neutrophilic Bladder Inflammation
    treatment_effect: INHIBITS
    description: >-
      Bacterial eradication removes the stimulus for acute bladder
      inflammation.
  evidence:
  - reference: PMID:42594063
    reference_title: >-
      Nitrofurantoin treatment and prophylaxis for recurrent urinary tract
      infections in women: First-line for a reason.
    supports: SUPPORT
    evidence_source: OTHER
    quote_role: REVIEW_SYNTHESIS
    snippet: >-
      Nitrofurantoin is considered a first-line antimicrobial agent by the
      AUA/CUA/SUFU Guideline and Infectious Disease Society of America (IDSA)
      Guideline for the treatment of acute uncomplicated simple cystitis in
      women.
    explanation: >-
      Supports nitrofurantoin as a guideline-backed first-line oral antibiotic
      option for acute uncomplicated cystitis.

name: Acute Cystitis
creation_date: "2026-09-30T09:47:36Z"
description: >-
  Acute cystitis is a bacterial lower urinary tract infection in which
  uropathogenic bacteria, most often Escherichia coli, ascend the urethra,
  adhere to the bladder mucosa, proliferate in urine and superficial urothelium,
  and trigger an acute neutrophilic inflammatory syndrome with dysuria,
  frequency, urgency, and suprapubic pain.
category: Infectious Disease
disease_term:
  preferred_term: acute cystitis
  term:
    id: MONDO:0001650
    label: acute cystitis
parents:
- Bacterial urinary tract infection
synonyms:
- Acute bacterial cystitis
- Acute uncomplicated cystitis
infectious_agent:
- name: Escherichia coli
  description: >-
    Uropathogenic E. coli is the dominant bacterial cause of acute cystitis.
  infectious_agent_term:
    preferred_term: Escherichia coli
    term:
      id: NCBITaxon:562
      label: Escherichia coli
  evidence:
  - reference: PMID:27639858
    reference_title: >-
      Uropathogen distribution and antimicrobial susceptibility in uncomplicated
      cystitis in Belgium, a high antibiotics prescribing country: 20-year
      surveillance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Escherichia coli (81.6 %) was the most frequently isolated uropathogen,
      followed by Staphylococcus saprophyticus (8 %)
    explanation: >-
      Identifies E. coli as the major cultured uropathogen among adult women
      presenting with suspected uncomplicated cystitis.
classifications:
  harrisons_chapter:
  - classification_value: KIDNEY_URINARY_TRACT
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Ascending periurethral bladder seeding
  description: >-
    Uropathogens from perineal or intestinal reservoirs ascend the urethra into
    the bladder lumen and seed the lower urinary tract.
prevalence:
- population: Adult women
  measure_type: LIFETIME_PREVALENCE
  prevalence_class: ABOVE_1_IN_1000
  rate_per_100000: 55000.0
  rate_low: 50000.0
  rate_high: 60000.0
  notes: Lifetime incidence 50-60% in adult women.
  evidence:
  - reference: PMID:31105774
    reference_title: >-
      An introduction to the epidemiology and burden of urinary tract infections.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Urinary tract infections (UTIs) are the most common outpatient
      infections, with a lifetime incidence of 50-60% in adult women.
    explanation: Quantifies the lifetime UTI incidence in adult women.
genetic:
- name: TLR2 variant
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: TLR2
    term:
      id: hgnc:11848
      label: TLR2
  notes: >-
    The TLR2 G2258A variant, which lowers lipopeptide-induced innate signaling,
    is associated with increased bacteriuria/UTI susceptibility.
  evidence:
  - reference: PMID:20016852
    reference_title: >-
      Genetic variation of the human urinary tract innate immune response and asymptomatic bacteriuria in women.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Polymorphism TLR2_G2258A, a variant associated with decreased
      lipopeptide-induced signaling, was associated with increased ASB risk
    explanation: >-
      Associates the TLR2 G2258A variant with increased asymptomatic-bacteriuria
      risk, a urinary-tract-infection susceptibility factor.
- name: FUT2 non-secretor status
  relationship_type: SUSCEPTIBILITY
  gene_term:
    preferred_term: FUT2
    term:
      id: hgnc:4013
      label: FUT2
  notes: >-
    FUT2 non-secretor status alters uroepithelial histo-blood-group antigen
    expression; the secretor-negative phenotype is over-represented among women
    with acute uncomplicated pyelonephritis, the ascending complication of
    cystitis, and is a recognized urinary-tract-infection susceptibility factor.
  evidence:
  - reference: PMID:12010227
    reference_title: >-
      Non-secretor status is associated with female acute uncomplicated pyelonephritis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Forty-four (41%) of the women were non-secretors, a significantly higher
      frequency than in the (control) Japanese population (217 of 960, 22.6%; P
      < 0.001).
    explanation: >-
      Shows the secretor-negative phenotype is enriched among women with acute
      uncomplicated pyelonephritis, measured as a saliva phenotype rather than a
      FUT2 genotype.
environmental:
- name: Frequent sexual intercourse
  description: >-
    Frequent sexual intercourse is an established behavioral risk factor for
    urinary tract infection, promoting periurethral seeding of the bladder.
  disease_effect: PREDISPOSES
  influences_mechanisms:
  - target: Ascending Bladder Seeding
    environmental_effect: PREDISPOSES
    causal_link_type: INDIRECT_KNOWN_INTERMEDIATES
    description: >-
      Intercourse mechanically promotes periurethral-to-bladder ascent of
      uropathogens.
    evidence:
    - reference: PMID:15630106
      reference_title: >-
        Risk factors associated with acute pyelonephritis in healthy women.
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        In multivariable models, factors associated with pyelonephritis risk
        were frequency of sexual intercourse in the previous 30 days
      explanation: >-
        Quantifies frequent sexual intercourse as a dominant UTI risk factor
        (measured here for the ascending complication, pyelonephritis).
  evidence:
  - reference: PMID:15630106
    reference_title: >-
      Risk factors associated with acute pyelonephritis in healthy women.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      As with cystitis in reproductive-age women, sexual behaviors and patient
      and family history of UTI are associated with increased pyelonephritis
      risk
    explanation: >-
      Identifies frequent sexual intercourse as a dominant risk factor for
      ascending urinary-tract infection.
- name: Diabetes mellitus
  description: >-
    Diabetes mellitus is a host comorbidity that predisposes to urinary tract
    infection.
  disease_effect: PREDISPOSES
  evidence:
  - reference: PMID:15630106
    reference_title: >-
      Risk factors associated with acute pyelonephritis in healthy women.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Diabetes and incontinence also seem to independently increase the risk
      for pyelonephritis.
    explanation: >-
      Identifies diabetes as an independent risk factor for ascending
      urinary-tract infection.
pathophysiology:
- name: Ascending Bladder Seeding
  role: trigger
  biological_scale: TISSUE
  description: >-
    Uropathogenic bacteria ascend from the periurethral reservoir through the
    urethra into the bladder lumen.
  locations:
  - preferred_term: urinary bladder
    term:
      id: UBERON:0001255
      label: urinary bladder
  downstream:
  - target: FimH-Mediated Urothelial Adhesion
    causal_link_type: DIRECT
    description: >-
      Seeded bacteria adhere to the bladder mucosa and expand locally instead
      of being washed out by urine flow.
- name: FimH-Mediated Urothelial Adhesion
  biological_scale: CELLULAR
  description: >-
    Type 1 fimbrial FimH adhesin binds mannosylated uroplakin Ia on the
    superficial bladder urothelium, the initial attachment step of UPEC
    colonization.
  cell_types:
  - preferred_term: bladder urothelial cell
    term:
      id: CL:1001428
      label: bladder urothelial cell
  biological_processes:
  - preferred_term: cell adhesion
    modifier: INCREASED
    term:
      id: GO:0007155
      label: cell adhesion
  downstream:
  - target: UPEC Invasion and Intracellular Bacterial Communities
    causal_link_type: DIRECT
    description: >-
      Firm FimH attachment precedes invasion of the superficial umbrella cells.
  evidence:
  - reference: PMID:16930149
    reference_title: >-
      The affinity of the FimH fimbrial adhesin is receptor-driven and
      quasi-independent of Escherichia coli pathotypes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Bacterial adhesion to the high-mannosylated uroplakin Ia glycoprotein
      receptors of bladder epithelium is mediated by the FimH adhesin.
    explanation: >-
      Supports FimH-mediated E. coli adhesion to bladder epithelial uroplakin
      receptors as the initial colonization step.
- name: UPEC Invasion and Intracellular Bacterial Communities
  biological_scale: CELLULAR
  description: >-
    Adherent UPEC invade bladder umbrella cells, escape the endosome, and
    proliferate in the cytoplasm to form intracellular bacterial communities,
    the reservoir underlying persistence and recurrence.
  cell_types:
  - preferred_term: bladder urothelial cell
    term:
      id: CL:1001428
      label: bladder urothelial cell
  downstream:
  - target: Acute Neutrophilic Bladder Inflammation
    causal_link_type: DIRECT
    description: >-
      Urothelial sensing of invading bacteria recruits innate immune cells into
      the bladder wall and urine.
  evidence:
  - reference: PMID:32083802
    reference_title: Matrix stiffness regulates endosomal escape of uropathogenic E. coli.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: BACKGROUND
    snippet: >-
      Uropathogenic E. coli (UPEC) infection in vivo is characterized by
      invasion of bladder umbrella epithelial cells followed by endosomal escape
      and proliferation in the cytoplasm to form intracellular bacterial
      communities.
    explanation: >-
      Supports invasion, endosomal escape and intracellular bacterial community
      formation as the intracellular UPEC lifecycle underlying recurrence.
- name: Acute Neutrophilic Bladder Inflammation
  biological_scale: TISSUE
  description: >-
    Acute innate inflammation in the bladder produces lower-tract pain,
    urgency, frequency, and dysuria.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  locations:
  - preferred_term: urinary bladder
    term:
      id: UBERON:0001255
      label: urinary bladder
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  - preferred_term: neutrophil activation
    modifier: INCREASED
    term:
      id: GO:0042119
      label: neutrophil activation
  downstream:
  - target: Dysuria
    description: >-
      Acute bladder inflammation produces painful urination.
  - target: Urinary urgency
    description: >-
      Bladder inflammation produces the urgent need to void.
  - target: Urinary frequency
    description: >-
      Bladder inflammation produces increased urinary frequency.
  evidence:
  - reference: PMID:38638825
    reference_title: >-
      Uropathogenic Escherichia coli infection: innate immune disorder, bladder
      damage, and Tailin Fang II.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      TLF-II inhibited the expression of TLR4 and NF-κB on BECs and decreased
      the urine levels of IL-1β and IL-6 and urine leukocyte counts.
    explanation: >-
      Supports bladder epithelial TLR4/NF-κB signaling and urinary leukocyte
      inflammation in a transurethral UPEC mouse model, with the herbal
      intervention suppressing that inflammatory branch.

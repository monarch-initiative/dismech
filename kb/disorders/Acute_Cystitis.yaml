name: Acute Cystitis
creation_date: "2026-09-30T09:47:36Z"
description: >-
  Acute cystitis is a bacterial lower urinary tract infection in which
  uropathogenic bacteria, most often Escherichia coli, ascend the urethra,
  adhere to the bladder mucosa, proliferate in urine and superficial urothelium,
  and trigger an acute neutrophilic inflammatory syndrome with dysuria,
  frequency, urgency, and suprapubic pain.
category: Infectious Disease
disease_term:
  preferred_term: acute cystitis
  term:
    id: MONDO:0001650
    label: acute cystitis
parents:
- Bacterial urinary tract infection
synonyms:
- Acute bacterial cystitis
- Acute uncomplicated cystitis
notes: >-
  The Falcon deep-research request fell back to OpenScientist and all 31
  reported references resolved. Two asserted quotes were unsupported and the
  report used wrong identifiers for suprapubic pain, pyuria, bacteriuria,
  bladder umbrella cells, nitrofurantoin, TMP-SMX, and fosfomycin, so this entry
  keeps only manually checked claims and locally cached ontology bindings.
infectious_agent:
- name: Escherichia coli
  description: >-
    Uropathogenic E. coli is the dominant bacterial cause of acute cystitis.
  infectious_agent_term:
    preferred_term: Escherichia coli
    term:
      id: NCBITaxon:562
      label: Escherichia coli
  evidence:
  - reference: PMID:27639858
    reference_title: >-
      Uropathogen distribution and antimicrobial susceptibility in uncomplicated
      cystitis in Belgium, a high antibiotics prescribing country: 20-year
      surveillance.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Escherichia coli (81.6 %) was the most frequently isolated uropathogen,
      followed by Staphylococcus saprophyticus (8 %)
    explanation: >-
      Identifies E. coli as the major cultured uropathogen among adult women
      presenting with suspected uncomplicated cystitis.
classifications:
  harrisons_chapter:
  - classification_value: KIDNEY_URINARY_TRACT
  - classification_value: INFECTIOUS_DISEASES
transmission:
- name: Ascending periurethral bladder seeding
  description: >-
    Uropathogens from perineal or intestinal reservoirs ascend the urethra into
    the bladder lumen and seed the lower urinary tract.
pathophysiology:
- name: Ascending Bladder Seeding
  role: trigger
  biological_scale: TISSUE
  description: >-
    Uropathogenic bacteria ascend from the periurethral reservoir through the
    urethra into the bladder lumen.
  locations:
  - preferred_term: urinary bladder
    term:
      id: UBERON:0001255
      label: urinary bladder
  downstream:
  - target: Urothelial Adhesion and Proliferation
    causal_link_type: DIRECT
    description: >-
      Seeded bacteria adhere to the bladder mucosa and expand locally instead
      of being washed out by urine flow.
- name: Urothelial Adhesion and Proliferation
  biological_scale: TISSUE
  description: >-
    E. coli adhesins and local nutrient use permit bacterial persistence on or
    within the superficial bladder urothelium.
  cell_types:
  - preferred_term: bladder urothelial cell
    term:
      id: CL:1001428
      label: bladder urothelial cell
  biological_processes:
  - preferred_term: cell adhesion
    modifier: INCREASED
    term:
      id: GO:0007155
      label: cell adhesion
  downstream:
  - target: Acute Neutrophilic Bladder Inflammation
    causal_link_type: DIRECT
    description: >-
      Urothelial sensing of bacterial products recruits innate immune cells into
      the bladder wall and urine.
  evidence:
  - reference: PMID:16930149
    reference_title: >-
      The affinity of the FimH fimbrial adhesin is receptor-driven and
      quasi-independent of Escherichia coli pathotypes.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: PRIMARY_RESULT
    snippet: >-
      Bacterial adhesion to the high-mannosylated uroplakin Ia glycoprotein
      receptors of bladder epithelium is mediated by the FimH adhesin.
    explanation: >-
      Supports FimH-mediated E. coli adhesion to bladder epithelial uroplakin
      receptors as an early urinary-tract colonization mechanism.
  - reference: PMID:32083802
    reference_title: Matrix stiffness regulates endosomal escape of uropathogenic E. coli.
    supports: SUPPORT
    evidence_source: IN_VITRO
    quote_role: BACKGROUND
    snippet: >-
      Uropathogenic E. coli (UPEC) infection in vivo is characterized by
      invasion of bladder umbrella epithelial cells followed by endosomal escape
      and proliferation in the cytoplasm to form intracellular bacterial
      communities.
    explanation: >-
      Supports the intracellular portion of the UPEC bladder-epithelium
      lifecycle, while the study's own experiments are in vitro.
- name: Acute Neutrophilic Bladder Inflammation
  biological_scale: TISSUE
  description: >-
    Acute innate inflammation in the bladder produces lower-tract pain,
    urgency, frequency, and dysuria.
  cell_types:
  - preferred_term: neutrophil
    term:
      id: CL:0000775
      label: neutrophil
  locations:
  - preferred_term: urinary bladder
    term:
      id: UBERON:0001255
      label: urinary bladder
  biological_processes:
  - preferred_term: inflammatory response
    modifier: INCREASED
    term:
      id: GO:0006954
      label: inflammatory response
  - preferred_term: neutrophil activation
    modifier: INCREASED
    term:
      id: GO:0042119
      label: neutrophil activation
  evidence:
  - reference: PMID:38638825
    reference_title: >-
      Uropathogenic Escherichia coli infection: innate immune disorder, bladder
      damage, and Tailin Fang II.
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    quote_role: PRIMARY_RESULT
    snippet: >-
      TLF-II inhibited the expression of TLR4 and NF-κB on BECs and decreased
      the urine levels of IL-1β and IL-6 and urine leukocyte counts.
    explanation: >-
      Supports bladder epithelial TLR4/NF-κB signaling and urinary leukocyte
      inflammation in a transurethral UPEC mouse model, with the herbal
      intervention suppressing that inflammatory branch.
phenotypes:
- name: Dysuria
  description: >-
    Burning or painful urination is one of the typical lower-tract symptoms
    with high diagnostic value in acute cystitis.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Dysuria
    term:
      id: HP:0100518
      label: Dysuria
  evidence:
  - reference: PMID:30419565
    reference_title: Reliability of Symptom-Based Diagnosis of Uncomplicated Cystitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Highest diagnostic values for AC in this study belonged to dysuria,
      urgency, and frequency.
    explanation: >-
      Supports dysuria as part of the highest-diagnostic-value symptom cluster
      in women assessed with the Acute Cystitis Symptom Score.
- name: Urinary urgency
  description: >-
    Acute bladder inflammation causes an urgent need to void.
  frequency: VERY_FREQUENT
  phenotype_term:
    preferred_term: Urinary urgency
    term:
      id: HP:0000012
      label: Urinary urgency
  evidence:
  - reference: PMID:30419565
    reference_title: Reliability of Symptom-Based Diagnosis of Uncomplicated Cystitis.
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    quote_role: PRIMARY_RESULT
    snippet: >-
      Highest diagnostic values for AC in this study belonged to dysuria,
      urgency, and frequency.
    explanation: >-
      Supports urgency as part of the highest-diagnostic-value symptom cluster

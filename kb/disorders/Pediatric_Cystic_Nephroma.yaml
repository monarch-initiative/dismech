histopathology:
- name: Septa without blastemal cells
  description: >-
    By definition the tumour has no solid components and no blastemal (undifferentiated) cells in
    its septa; this separates it from cystic partially differentiated nephroblastoma, whose septa
    contain blastemal cells.
  diagnostic: true
  evidence:
  - reference: PMID:33673661
    reference_title: >-
      Clinical and Molecular Characteristics and Outcome of Cystic Partially Differentiated
      Nephroblastoma and Cystic Nephroma: A Narrative Review of the Literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Histologically, CPDN is characterized by the presence of undifferentiated (blastemal) cells in
      the septa of the cysts, and by the lack of solid components (tumor “nodules”). By definition,
      CN does not contain any solid components or blastemal cells in the septa.
    explanation: >-
      The defining histological criterion, as the 2021 review states it, beside the criterion for
      cystic partially differentiated nephroblastoma.
- name: Stromal hypercellularity beneath the cyst lining
  description: >-
    Increased cellularity of the stroma beneath the epithelial lining, often including inflammatory
    cells, in 6 of 7 childhood tumours of a 2017 series (and in 11 of 12 adult tumours).
  evidence:
  - reference: PMID:28177962
    reference_title: >-
      Pediatric Cystic Nephroma Is Morphologically, Immunohistochemically, and Genetically Distinct
      From Adult Cystic Nephroma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both lesions (11 of 12 adult cases, 6 of 7 pediatric cases) frequently demonstrated
      subepithelial accentuation of stromal cellularity, though the increased cellularity frequently
      included inflammatory cells in the pediatric cases.
    explanation: >-
      Stromal hypercellularity beneath the lining in 6 of 7 childhood tumours, often with
      inflammatory cells.
- name: Inhibin-negative immunostaining
  description: >-
    No childhood tumour of the 2017 series stained for inhibin, against 83% of the adult tumours;
    all tumours of both kinds stained for oestrogen receptor.
  evidence:
  - reference: PMID:28177962
    reference_title: >-
      Pediatric Cystic Nephroma Is Morphologically, Immunohistochemically, and Genetically Distinct
      From Adult Cystic Nephroma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      All adult and pediatric cases labeled for estrogen receptor; however, whereas most (83%) of
      adult cases labeled for inhibin at least focally, no pediatric case labeled for inhibin.
    explanation: >-
      Inhibin staining in none of the childhood tumours and in most adult ones; oestrogen receptor
      in all.
- name: Absence of ropy collagen
  description: >-
    Wavy, ropy collagen with cellular stroma, found in most adult tumours (58%), was not found in
    the childhood tumours of the 2017 series.
  evidence:
  - reference: PMID:28177962
    reference_title: >-
      Pediatric Cystic Nephroma Is Morphologically, Immunohistochemically, and Genetically Distinct
      From Adult Cystic Nephroma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Most adult cases (58%) demonstrated wavy, ropy collagen in association with cellular stroma,
      whereas this was not found in pediatric cases.
    explanation: >-
      Ropy collagen in 58% of the adult tumours and in none of the childhood ones.
diagnosis:
- name: Renal ultrasound surveillance of DICER1 carriers
  description: >-
    Children who carry a germline DICER1 variant are offered abdominal ultrasound so that the tumour
    is found early. GeneReviews advises it every six months until age 8 years, then once a year
    until age 12; the European minimum programme advises renal ultrasound every six months from
    birth to age 6 years. In the 2024 carrier cohort, 7 cystic nephromas were found by surveillance.
  diagnosis_term:
    preferred_term: renal ultrasound
    term:
      id: NCIT:C159885
      label: Renal Ultrasound
  evidence:
  - reference: PMID:24761742
    reference_title: >-
      DICER1-Related Tumor Predisposition.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Abdominal ultrasounds for pediatric CN and other kidney tumors every six months until age
      eight years and then annually until age 12 years.
    explanation: >-
      The GeneReviews schedule of kidney ultrasound for carrier children.
  - reference: PMID:34170462
    reference_title: >-
      Surveillance recommendations for DICER1 pathogenic variant carriers: a report from the SIOPE
      Host Genome Working Group and CanGene-CanVar Clinical Guideline Working Group.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      The key recommendations of the minimum program are: annual clinical examination from birth to
      age 20 years, six-monthly chest X-ray and renal ultrasound from birth to age 6 years, and
      thyroid ultrasound every 3 years from age 8 to age 40 years.
    explanation: >-
      The European minimum programme (SIOPE Host Genome Working Group and CanGene-CanVar Clinical
      Guideline Working Group): renal ultrasound every six months from birth to age 6, a shorter
      period than GeneReviews advises.
  - reference: PMID:39400264
    reference_title: >-
      DICER1-Related Tumor Predisposition: Identification of At-risk Individuals and Recommended
      Surveillance Strategies.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Overall, 7 CNs and 1 Wilms tumor were diagnosed by surveillance.
    explanation: >-
      Seven cystic nephromas found by surveillance among the cohort's germline carriers.
- name: Histopathological examination
  description: >-
    Histology, immunostaining and DICER1 status separate the childhood tumour from the adult one,
    which the WHO classification treats as a distinct entity.
  diagnosis_term:
    preferred_term: histopathology and immunohistochemistry
    term:
      id: NCIT:C18190
      label: Histopathologic Examination
  evidence:
  - reference: PMID:28177962
    reference_title: >-
      Pediatric Cystic Nephroma Is Morphologically, Immunohistochemically, and Genetically Distinct
      From Adult Cystic Nephroma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      In summary, although cellular stroma and estrogen receptor immunoreactivity are commonly
      present in both adult and pediatric cystic nephroma, ropy collagen and inhibin
      immunoreactivity are far more common in adult cystic nephroma/MEST, whereas DICER1 mutations
      are far more prevalent in pediatric cystic nephroma.
    explanation: >-
      What tells the two tumours apart: ropy collagen and inhibin in the adult one, DICER1 mutations
      in the childhood one.
  - reference: PMID:28177962
    reference_title: >-
      Pediatric Cystic Nephroma Is Morphologically, Immunohistochemically, and Genetically Distinct
      From Adult Cystic Nephroma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      These results support the current World Health Organization Classification's separation of
      adult and pediatric cystic nephromas as distinct entities.
    explanation: >-
      The series' conclusion supports the WHO's separation of the two tumours.
- name: DICER1 genetic testing
  description: >-
    According to GeneReviews, the diagnosis of DICER1-related tumour predisposition is established
    by identifying a heterozygous germline DICER1 pathogenic variant known or suspected to cause
    loss of function. A 2021 review recommends that every child with cystic nephroma be referred to
    a clinical geneticist and evaluated for DICER1 syndrome, so that follow-up can be adequate. A
    2026 series of five DICER1-mutated kidney tumours concludes that molecular diagnostics in
    childhood kidney tumours bear on management, surveillance and genetic counselling.
  diagnosis_term:
    preferred_term: germline and tumour DICER1 testing
    term:
      id: NCIT:C15709
      label: Genetic Testing
  evidence:
  - reference: PMID:24761742
    reference_title: >-
      DICER1-Related Tumor Predisposition.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      The diagnosis of DICER1 is established by identification of a heterozygous germline DICER1
      pathogenic variant that is known or suspected to cause loss of function.
    explanation: >-
      The GeneReviews criterion for the diagnosis of DICER1-related tumour predisposition.
  - reference: PMID:33673661
    reference_title: >-
      Clinical and Molecular Characteristics and Outcome of Cystic Partially Differentiated
      Nephroblastoma and Cystic Nephroma: A Narrative Review of the Literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: OTHER
    snippet: >-
      Therefore, referral to a clinical geneticist is important for all patients with CN, who should
      be evaluated for DICER1 syndrome so that they can receive adequate follow-up
    explanation: >-
      The 2021 review's recommendation for cystic nephroma.
  - reference: PMID:41905669
    reference_title: >-
      DICER1-mutated renal neoplasia: A series of 5 cases demonstrating the spectrum of cystic
      nephroma, Wilms tumor, and anaplastic sarcoma.
    supports: SUPPORT
    directness: INDIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: OTHER
    snippet: >-
      Our findings underscore the critical role of molecular diagnostics in pediatric renal tumors,
      with implications for management, surveillance, and genetic counseling.
    explanation: >-
      The conclusion of a series of five DICER1-mutated kidney tumours, mostly in children.
      INDIRECT: stated for paediatric kidney tumours in general.

        diverse cellular functions.
      explanation: >-
        DICER1's ribonuclease is essential for microRNA processing. INDIRECT: a general statement,
        from the objectives of a series of DICER1-mutated kidney tumours.
    - reference: PMID:24909177
      reference_title: >-
        Exome sequencing of pleuropulmonary blastoma reveals frequent biallelic loss of TP53 and two
        hits in DICER1 resulting in retention of 5p-derived miRNA hairpin loop sequences.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        5p-Derived microRNA (miRNA) transcripts retained abnormal precursor miRNA loop sequences
        normally removed by DICER1.
      explanation: >-
        In one pleuropulmonary blastoma with a somatic RNase IIIb missense variant, 5p-derived

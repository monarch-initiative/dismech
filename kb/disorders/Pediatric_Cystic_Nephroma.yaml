progression:
- phase: Outcome
  description: >-
    Excellent. Among the published cases reviewed in 2021, no child with cystic nephroma or cystic
    partially differentiated nephroblastoma presented with metastases; one child with cystic
    nephroma had a local relapse, which the authors of the original report attributed to incomplete
    resection, and 6 of 118 died, none of them directly of the disease: two of complications of its
    treatment and four of complications of treating another disease, pleuropulmonary blastoma among
    them.
  evidence:
  - reference: PMID:33673661
    reference_title: >-
      Clinical and Molecular Characteristics and Outcome of Cystic Partially Differentiated
      Nephroblastoma and Cystic Nephroma: A Narrative Review of the Literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-

prevalence:
- population: Published cases, worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: RARE
  notes: >-
    A count of reported cases, not a rate: a 2021 review of the literature on the childhood tumours
    found 167 cases of cystic nephroma. In a 2024 analysis of 713 germline DICER1 carriers enrolled
    in the International PPB/DICER1 Registry, the International Ovarian and Testicular Stromal Tumor
    Registry or the NCI DICER1 natural history study, 62 had a cystic nephroma, the commonest of the
    73 people with a DICER1-related kidney tumour; the authors warn that the cohort's counts are not
    incidence or risk, because enrolment is driven partly by a personal or family history of the
    tumours. None of the sources cited here gives a population incidence or prevalence of the
    childhood tumour.
  evidence:
  - reference: PMID:33673661
    reference_title: >-
      Clinical and Molecular Characteristics and Outcome of Cystic Partially Differentiated
      Nephroblastoma and Cystic Nephroma: A Narrative Review of the Literature.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      We performed an extensive literature review, in which we identified 113 CPDN and 167 CN.
    explanation: >-
      167 published cases of cystic nephroma, in a review of the childhood tumours.

  downstream:
  - target: Defective microRNA Processing
    description: >-
      DICER1 is the ribonuclease that processes microRNA precursors, and the hotspot variants hit
      its RNase IIIb domain. In one pleuropulmonary blastoma with a somatic RNase IIIb missense
      variant, studied in its tumour and a cell line, 5p-derived microRNA transcripts retained
      precursor loop sequences that DICER1 normally removes. The 2019 neoplasm-risk study calls the
      hotspot variants hypomorphic (reduced RNase IIIb function), and the 2017 report of a family's
      tumours calls the acquired activity neomorphic. No cited source describes what the variant
      does to microRNA processing in cystic nephroma itself.

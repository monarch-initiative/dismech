      chance of inheriting the pathogenic variant.
    explanation: >-
      Each child of a carrier of a germline constitutional variant has a 50% chance of inheriting
      it.
  - reference: PMID:21036787
    reference_title: >-
      Germline DICER1 mutations and familial cystic nephroma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      It has been established that DICER1 mutations cause familial CN and may be implicated in

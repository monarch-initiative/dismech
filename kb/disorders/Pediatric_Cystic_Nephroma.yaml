    explanation: >-
      Penetrance by age 10 in carriers who were not index cases. INDIRECT: neoplasms as the study
      defined them, of which cystic nephroma is one.
pathophysiology:
- name: Germline DICER1 Loss-of-Function Variant
  description: >-
    A heterozygous germline DICER1 variant, predicted to inactivate the allele. In the two families
    with several cases of cystic nephroma studied in 2010, both variants created premature stop
    codons, predicted to remove the ribonuclease and double-stranded RNA-binding domains; among the
    published cases reviewed in 2021, all 12 children with cystic nephroma who had germline testing
    carried a DICER1 variant. The tumour also carries a second, somatic DICER1 hit.
  conforms_to: "germline_two_hit_tumor_predisposition#Constitutional First-Hit Tumor Suppressor Inactivation"
  biological_scale: MOLECULAR
  genetic_context:

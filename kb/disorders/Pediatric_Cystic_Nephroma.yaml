name: Pediatric Cystic Nephroma
creation_date: '2026-11-21T00:48:03Z'
category: Neoplastic
categories:
- Kidney Tumor
- Pediatric Tumor
- DICER1-Associated Neoplasm
synonyms:
- Childhood cystic nephroma
- Paediatric cystic nephroma
description: >-
  Pediatric cystic nephroma is a benign, typically multicystic tumour of the kidney in young
  children and one of the commonest tumours of DICER1 tumour predisposition: among germline DICER1
  carriers in a 2024 analysis of two registries and an NCI study, the median age at diagnosis was 2
  years, with 90% diagnosed by age 5. Most of these tumours carry DICER1 variants, in many children
  a germline loss-of-function variant with a somatic missense variant in the RNase IIIb domain as
  the second hit. The name cystic nephroma has also been used for an adult kidney tumour, now placed
  with mixed epithelial and stromal tumour; that tumour is a different entity and is not covered
  here. Surgery is the main treatment and the outcome is excellent, but the childhood tumour is
  presumed to be the benign precursor of anaplastic sarcoma of the kidney.
parents:
- childhood multilocular cystic kidney neoplasm
- kidney benign neoplasm

    explanation: >-
      Germline DICER1 variants in all 12 children with cystic nephroma who had germline testing, and
      somatic variants in 27 of 29 tumours tested, among published cases. Tested cases only, so not
      a population rate.
  downstream:
  - target: Somatic DICER1 Second Hit
    description: >-
      The germline variant is the first hit; the tumour acquires a second, somatic missense variant
      in the RNase IIIb domain of the other allele. Both hits were found in the cystic nephroma of a
      family carrying a germline truncating variant, and in an infant's cystic nephroma with
      anaplastic foci, read by its authors as a nascent anaplastic sarcoma, which carried a germline
      frameshift and a somatic missense variant.
    evidence:
    - reference: PMID:28222777
      reference_title: >-
        Identification of somatic and germ-line DICER1 mutations in pleuropulmonary blastoma, cystic
        nephroma and rhabdomyosarcoma tumors within a DICER1 syndrome pedigree.
      supports: SUPPORT
      directness: INDIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Additional in trans DICER1 missense somatic mutations in the IIIb DICER1 domain were found
        both in the cystic nephroma and in the rhabdomyosarcoma, suggesting that neoplasms in this
        family might arise from the unusual two-hit mechanism for DICER-derived tumorigenesis in
        which after the presence of a truncated constitutive protein, a neomorphic DICER1 activity
        is somatically adquired.
      explanation: >-
        In one family's cystic nephroma, a somatic RNase IIIb missense variant on the other allele
        (in trans) from the germline truncating variant ('adquired' is the source's spelling).
        INDIRECT: the authors suggest the two-hit mechanism from the variants found.
    - reference: PMID:27036314

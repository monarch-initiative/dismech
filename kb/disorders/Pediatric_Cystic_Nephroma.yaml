genetic:
- name: DICER1
  gene_term:
    preferred_term: DICER1
    term:
      id: hgnc:17098
      label: DICER1
  relationship_type: CAUSATIVE
  variant_origin: GERMLINE_AND_SOMATIC
  notes: >-
    Both hits are in DICER1: a germline variant, truncating in the familial cases, and a somatic
    second hit in the tumour, typically a missense variant at a hotspot in the RNase IIIb domain. No
    ClinGen gene-disease validity assertion for this tumour is cached here, so none is recorded: the
    ClinGen export cached in this repository (cache/clingen/gene_validity.csv) classifies DICER1 as
    Definitive for DICER1-related tumor predisposition (MONDO:0100216), a different disease from
    this tumour. The relationship_type is the reading of the series cited.
  case_fractions:
  - population: Children with cystic nephroma, 2017 pathology series
    case_fraction_percent: 86
    cohort_size: 7
    notes: >-
      DICER1 mutations in 86% of the childhood cases, against 1 of 10 adult cases; the abstract does
      not say which tissue was tested.
    evidence:
    - reference: PMID:28177962
      reference_title: >-
        Pediatric Cystic Nephroma Is Morphologically, Immunohistochemically, and Genetically
        Distinct From Adult Cystic Nephroma.
      supports: SUPPORT
      directness: DIRECT
      quote_role: PRIMARY_RESULT
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        86% of pediatric cases demonstrated DICER1 mutations, whereas only 1 of 10 adult cases
        demonstrated a DICER1 mutation.
      explanation: >-
        DICER1 mutations in 86% of the childhood cases of a series of seven, against 1 of 10 adult
        cases.
  - population: Published childhood cystic nephromas with somatic DICER1 testing, 2021 review
    case_fraction_percent: 93.1
    cohort_size: 29
    notes: >-
      Somatic variants in 27 of 29 tumours tested, and germline variants in 12 of 12 children
      tested; tested cases only, so not a population rate.
    evidence:
    - reference: PMID:33673661
      reference_title: >-
        Clinical and Molecular Characteristics and Outcome of Cystic Partially Differentiated
        Nephroblastoma and Cystic Nephroma: A Narrative Review of the Literature.
      supports: SUPPORT
      directness: DIRECT
      quote_role: REVIEW_SYNTHESIS
      evidence_source: HUMAN_CLINICAL
      snippet: >-
        Unlike CPDN, CN was strongly associated with somatic (n = 27/29) and germline (n = 12/12)
        DICER1-mutations.
      explanation: >-
        Somatic DICER1 variants in 27 of 29 tumours tested among published cases.
  evidence:
  - reference: PMID:24481001
    reference_title: >-
      DICER1 mutations in childhood cystic nephroma and its relationship to DICER1-renal sarcoma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      The genetic analyses presented here confirm that DICER1 mutations are the major genetic event
      in the development of cystic nephroma.
    explanation: >-
      From a series of 20 childhood cystic nephromas selected without regard to a family history of
      pleuropulmonary blastoma.
  - reference: PMID:24761742
    reference_title: >-
      DICER1-Related Tumor Predisposition.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DICER1-related neoplasms include pleuropulmonary blastoma (PPB), Sertoli-Leydig cell tumor
      (SLCT), including gynandroblastoma, pediatric cystic nephroma (CN), and differentiated thyroid
      carcinoma.
    explanation: >-
      GeneReviews lists the childhood cystic nephroma among the DICER1-related neoplasms.
references:
- reference: PMID:24761742
  title: DICER1-Related Tumor Predisposition.
  tags:
  - GeneReviews
notes: >-
  This entry covers the childhood cystic nephroma, the DICER1-associated tumour. The adult tumour of
  the same name, now placed with mixed epithelial and stromal tumour, is a different entity and is
  not covered; nor is cystic partially differentiated nephroblastoma, which a 2010 study's
  background places in one family of kidney neoplasms with cystic nephroma and Wilms tumour; Wilms
  tumour has its own entry, Wilms_Tumor. The 2021 review finds cystic nephroma, unlike cystic
  partially differentiated nephroblastoma, strongly associated with DICER1 variants. MONDO has no
  class for the childhood cystic nephroma alone, so the entry is bound to its broader parent,
  childhood multilocular cystic kidney neoplasm (MONDO:0004356), which also covers cystic partially
  differentiated nephroblastoma; MONDO's benign cystic nephroma (MONDO:0002385) is recorded as a
  related term, because its NCIt cross-reference is the adult tumour.
  DICER1_Tumor_Predisposition_Syndrome carries cystic nephroma as one of its phenotypes. The cached
  text of the sources cited here does not say how often the tumour turns into sarcoma, how often
  presentations other than a mass occur, or what share of childhood kidney tumours it makes up. The
  2021 review is cached as full text. Kidney surveillance schedules differ between GeneReviews and
  the European minimum programme, and the acquired DICER1 activity is called hypomorphic in the 2019
  neoplasm-risk study and neomorphic in one family report. The DICER1 GeneReviews chapter is cached
  as its summary only, so only the summary is cited.

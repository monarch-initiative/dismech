      id: MONDO:0004356
      label: childhood multilocular cystic kidney neoplasm
    mapping_predicate: skos:broadMatch
    mapping_source: MONDO
    mapping_justification: >-
      The entry is narrower than this term. MONDO's childhood multilocular cystic kidney neoplasm
      also covers cystic partially differentiated nephroblastoma (MONDO:0030604, its only subclass),
      which this entry leaves out, and MONDO has no class for the childhood cystic nephroma alone.
  - term:
      id: MONDO:0002385
      label: benign cystic nephroma
    mapping_predicate: skos:relatedMatch
    mapping_source: MONDO
    mapping_justification: >-
      MONDO's cystic nephroma term. Its NCIt cross-reference is the adult cystic nephroma
      (NCIT:C7504) and it has no subclass, so it does not single out the childhood tumour; the
      relation is recorded as related rather than as broader or narrower.
inheritance:
- name: Autosomal dominant predisposition
  inheritance_term:
    preferred_term: autosomal dominant
    term:
      id: HP:0000006
      label: Autosomal dominant inheritance
  penetrance: INCOMPLETE
  description: >-
    The tumour is not inherited as such. Many children with it carry a germline DICER1 variant,
    which is inherited in an autosomal dominant manner with reduced, age-related penetrance, and the
    second hit is acquired in the tumour. Each child of a carrier of a germline constitutional
    variant has a 50% chance of inheriting it. DICER1 variants cause familial cystic nephroma, and a
    variant can also arise de novo or as somatic mosaicism. The cached text of the 2019
    neoplasm-risk study gives no penetrance figure for cystic nephroma alone: it plots its
    cumulative incidence in a figure that covers 148 index and non-index carriers, and among its 102
    carriers who were not index cases it records two cystic nephromas. For any neoplasm as that
    study defined it (cancers plus pleuropulmonary blastoma, cystic nephroma and nasal
    chondromesenchymal hamartoma, without type Ir pleuropulmonary blastoma and thyroid nodules),
    5.3% of those carriers had developed one by age 10.
  evidence:
  - reference: PMID:24761742
    reference_title: >-
      DICER1-Related Tumor Predisposition.
    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DICER1 is inherited in an autosomal dominant manner with reduced, age-related penetrance.
    explanation: >-
      The inheritance and penetrance of the germline DICER1 variant behind the tumour.
  - reference: PMID:24761742

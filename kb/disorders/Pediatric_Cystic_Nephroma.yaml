- name: Benign Multicystic Kidney Tumour Formation
  description: >-
    The tumour itself: a benign, typically multicystic tumour of the kidney in young children,
    thought to originate from metanephric tissue. It was bilateral in 9 of 167 published cases
    (5.4%). A 2014 series noted two views of cystic nephroma: the benign end of a spectrum with
    cystic partially differentiated nephroblastoma and Wilms tumour, or a mixed epithelial and
    stromal tumour. The adult tumour is now placed with mixed epithelial and stromal tumour, and a
    2021 review reports that one group has classed the childhood tumour, which often carries DICER1
    mutations where cystic partially differentiated nephroblastoma does not, as a separate entity
    rather than part of a spectrum with it.

    supports: SUPPORT
    directness: DIRECT
    quote_role: REVIEW_SYNTHESIS
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Unlike CPDN, CN was strongly associated with somatic (n = 27/29) and germline (n = 12/12)

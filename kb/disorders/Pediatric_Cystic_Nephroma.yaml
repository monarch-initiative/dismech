      Germline DICER1 mutations and familial cystic nephroma.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      Both families with multiple CN were found to have mutations in DICER1 leading to premature
      stop codons, predicted to result in loss of the ribonuclease and dsRNA binding domains.
    explanation: >-
      Truncating germline variants in both families with several cases of cystic nephroma.
  - reference: PMID:33673661
    reference_title: >-
      Clinical and Molecular Characteristics and Outcome of Cystic Partially Differentiated

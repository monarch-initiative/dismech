      Surveillance Strategies.
    supports: SUPPORT
    directness: DIRECT
    quote_role: PRIMARY_RESULT
    evidence_source: HUMAN_CLINICAL
    snippet: >-
      DICER1-related renal tumors were found in 73 individuals (cystic nephroma (CN) = 62, Wilms =
      7, and anaplastic sarcoma of the kidney (ASK) = 4).
    explanation: >-
      62 cystic nephromas among the 73 people with a DICER1-related kidney tumour in the 2024
      carrier cohort.
  - reference: PMID:39400264
    reference_title: >-
      DICER1-Related Tumor Predisposition: Identification of At-risk Individuals and Recommended
      Surveillance Strategies.
    supports: SUPPORT
    directness: DIRECT

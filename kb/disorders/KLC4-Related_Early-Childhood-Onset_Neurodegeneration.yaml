inheritance:
- name: Autosomal recessive
  description: >-
    A homozygous KLC4 deletion in three affected siblings of one consanguineous family, with
    both unaffected parents and two unaffected siblings heterozygous and a third unaffected
    sibling homozygous wild type. That is complete segregation within the family, and the
    unaffected heterozygotes are what makes the mode recessive rather than dominant with
    reduced penetrance. Only one family has been reported, so nothing can be said about
    penetrance, expressivity or de novo rate.
  inheritance_term:
    preferred_term: Autosomal recessive inheritance
    term:
      id: HP:0000007
      label: Autosomal recessive inheritance
  evidence:
  - reference: PMID:26423925
    reference_title: "Hereditary spastic paraplegia with recessive trait caused by mutation in KLC4 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Meanwhile, the unaffected parents and two siblings were heterozygous and one sibling was homozygous wild type."
    explanation: >-
      The segregation result. Carrier parents and an unaffected homozygous-wild-type sibling
      together establish recessive inheritance in this pedigree.
  - reference: PMID:37565267
    reference_title: "A humanized Caenorhabditis elegans model of hereditary spastic paraplegia-associated variants in KLC4."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "An additional family was previously reported where a premature stop codon after residue 277 of KLC4 caused HSP in an autosomal-recessive manner; heterozygous family members did not have any symptoms (Bayrakli et al., 2015)."
    explanation: >-
      An independent group's reading of the same pedigree, which matters here because it is
      the sentence that separates this recessive entity from the heterozygous late-onset case
      the same paper reports. Graded OTHER because it summarises prior work rather than
      reporting a new observation.
pathophysiology:
- name: KLC4 Homozygous Truncating Deletion
  description: >-
    A homozygous 19-base-pair deletion in exon 6 of KLC4, c.853_871del19, found by
    homozygosity mapping followed by whole-exome sequencing in a consanguineous family. The
    deletion generates a stop codon, so both the transcript and the protein are truncated.
    It is the only allele reported in a published patient with this disease.
  biological_scale: MOLECULAR
  genes:
  - preferred_term: KLC4
    term:
      id: hgnc:21624
      label: KLC4
  downstream:
  - target: Loss of the KLC4 Cargo-Binding TPR Domain
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:26423925
    reference_title: "Hereditary spastic paraplegia with recessive trait caused by mutation in KLC4 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Whole-exome sequencing revealed a homozygous mutation (c.853_871del19) in the gene coding the kinesin light chain 4 protein (KLC4)."
    explanation: The allele, and the gene it identifies.
  - reference: PMID:26423925
    reference_title: "Hereditary spastic paraplegia with recessive trait caused by mutation in KLC4 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The 19 bp deletion in exon 6 generates a stop codon and thus a truncated messenger RNA and protein."
    explanation: >-
      The molecular consequence, stated at both the transcript and the protein level. The
      truncated transcript matters because nonsense-mediated decay may remove it altogether,
      which is the difference between a null and a dominant-negative allele.
- name: Loss of the KLC4 Cargo-Binding TPR Domain
  description: >-
    The kinesin light chains carry six tetratricopeptide repeats that bind cargo adaptor
    proteins, and they also activate the motor by relieving autoinhibition of the kinesin
    heavy chain. A stop codon after residue 277 removes those repeats. This is a prediction
    from the position of the truncation rather than a measurement: no patient material has
    been assayed for KLC4 protein, cargo binding or motor activity.
  biological_scale: MOLECULAR
  cellular_components:
  - preferred_term: kinesin I complex
    term:
      id: GO:0016938
      label: kinesin I complex
  downstream:
  - target: Impaired Kinesin-1 Cargo Delivery in Developing Neurons
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:37565267
    reference_title: "A humanized Caenorhabditis elegans model of hereditary spastic paraplegia-associated variants in KLC4."
    supports: SUPPORT
    evidence_source: COMPUTATIONAL
    snippet: "Truncations in KLC4 after either 277 or 369 residues are predicted to disrupt the TPR domain, which mediates the interaction between kinesin and the cargo adaptor (Pernigo et al., 2013; Zhu et al., 2012), suggesting that both KLC4 variants should produce similar pathologies."
    explanation: >-
      The domain-level prediction, graded COMPUTATIONAL because it is inferred from the
      truncation position and published structures rather than assayed. It is also the
      sentence that ties the recessive early-childhood allele and the dominant late-onset
      allele to one molecular lesion.
  - reference: PMID:36222498
    reference_title: "KLC4 shapes axon arbors during development and mediates adult behavior."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "KLCs are known to mediate binding between the kinesin motor and cellular cargos, and also to activate the motor by releasing KHC autoinhibition"
    explanation: >-
      What the lost domain does. Graded OTHER because the sentence is this paper's summary of
      established structural and biochemical work rather than a result it reports.
- name: Impaired Kinesin-1 Cargo Delivery in Developing Neurons
  description: >-
    Kinesin-1 carries mitochondria, synaptic vesicle precursors, endosomes, lysosomes and RNA
    granules along microtubules, and the light chain is what makes that transport selective.
    In a klc4 mutant, endosomal transport and microtubule dynamics are both altered.

    The specificity of the defect is the notable part. Losing KLC4 does not stop transport
    in general - mutant axons grow faster than wild type - so the lesion is in which cargo
    reaches which compartment rather than in how much cargo moves.
  biological_scale: CELLULAR
  cell_types:
  - preferred_term: sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  biological_processes:
  - preferred_term: anterograde axonal transport
    term:
      id: GO:0008089
      label: anterograde axonal transport
    modifier: DYSREGULATED
  downstream:
  - target: Defective Axon Branch Stabilisation and Arbor Patterning
    causal_link_type: DIRECT
  evidence:
  - reference: PMID:36222498
    reference_title: "KLC4 shapes axon arbors during development and mediates adult behavior."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Using live imaging approaches in klc4 mutant zebrafish, we show that KLC4 is required for stabilization of nascent axon branches, proper microtubule (MT) dynamics, and endosomal transport."
    explanation: The three cell-biological requirements measured directly in a klc4 mutant animal.
  - reference: PMID:36222498
    reference_title: "KLC4 shapes axon arbors during development and mediates adult behavior."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Klc4 mutant neurons do not have a general growth defect, in that their axons grow faster than wild type axons. In addition, klc4 mutants are adult viable and show no signs of early neurodegeneration."
    explanation: >-
      The control that makes this a specificity defect rather than a transport failure -
      and, in its second sentence, the observation that sits least comfortably with the word
      "neurodegeneration" in this disease's name.
- name: Defective Axon Branch Stabilisation and Arbor Patterning
  description: >-
    Without KLC4, nascent sensory axon branches fail to stabilise and peripheral axons lose
    the contact repulsion that normally keeps neighbouring arbors from overlapping - they
    fasciculate instead, which is how central rather than peripheral axons behave. The result
    is a sensory field that is innervated in the wrong pattern rather than not innervated at
    all, and it implies KLC4 helps establish the molecular difference between a neuron's
    central and peripheral axons.

    Every measurement behind this node is from zebrafish. Nothing equivalent has been looked
    at in a patient.
  biological_scale: CELLULAR
  biological_processes:
  - preferred_term: axon guidance
    term:
      id: GO:0007411
      label: axon guidance
    modifier: ABNORMAL
  cell_types:
  - preferred_term: sensory neuron
    term:
      id: CL:0000101
      label: sensory neuron
  downstream:
  - target: Disordered Patterning Across Multiple Neural Systems
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:36222498
    reference_title: "KLC4 shapes axon arbors during development and mediates adult behavior."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our work implicates one such subunit, KLC4, as an essential regulator of axon branching and arborization pattern of sensory neurons during development."
    explanation: The paper's central claim about what KLC4 is for.
  - reference: PMID:36222498
    reference_title: "KLC4 shapes axon arbors during development and mediates adult behavior."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Furthermore, KLC4 is required for proper tiling of peripheral axon arbors: in klc4 mutants, peripheral axons showed abnormal fasciculation, a behavior characteristic of central axons."
    explanation: >-
      The tiling defect, and the detail that gives it mechanistic meaning: peripheral axons
      start behaving like central ones, so the lost function is compartment identity rather
      than growth.
  - reference: PMID:36222498
    reference_title: "KLC4 shapes axon arbors during development and mediates adult behavior."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Finally, we find that klc4 mutant larva are hypersensitive to touch and adults show anxiety-like behavior in a novel tank test, implicating klc4 as a new gene involved in stress response circuits."
    explanation: >-
      That the mispatterned arbor has a functional consequence at the level of behaviour,
      which is what makes the patterning defect more than a morphological curiosity.
- name: Disordered Patterning Across Multiple Neural Systems
  description: >-
    The organism-level step, and the weakest link in the chain. In zebrafish, klc4 is
    expressed early and in diverse neural populations of both the central and peripheral
    nervous system, so a patterning defect in its absence would be expected to affect several
    systems at once - which is what the patients have.
    The zebrafish authors read the human disease that way explicitly, as a disorder of
    developmental patterning.

    What is missing is everything between a mispatterned sensory arbor in a fish embryo and
    a child who loses vision, hearing, walking and cognition. No neuropathology, imaging
    correlate, nerve conduction study or retinal study from an affected person has been
    published in a source that can be read, so the edge into this node carries
    INDIRECT_UNKNOWN_INTERMEDIATES and means it.
  biological_scale: ORGANISM
  downstream:
  - target: Progressive Complicated Spastic Paraplegia
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Visual Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Hearing Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  - target: Cognitive Impairment
    causal_link_type: INDIRECT_UNKNOWN_INTERMEDIATES
  evidence:
  - reference: PMID:36222498
    reference_title: "KLC4 shapes axon arbors during development and mediates adult behavior."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results also give insight into mechanisms of the human disease caused by KLC4 mutation, which may be caused by defects in developmental patterning."
    explanation: >-
      The authors' own bridge from their fish to the human disease, hedged with "may be" -
      which is the hedge this node preserves rather than removing.
  - reference: PMID:36222498
    reference_title: "KLC4 shapes axon arbors during development and mediates adult behavior."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Multiple neural systems are affected in the human disease caused by KLC4 mutation; patients show defects in vision, hearing, movement and cognition (Bayrakli et al., 2015)."
    explanation: >-
      The multisystem character of the human phenotype, and the only quotable statement of it
      outside the paywalled primary report. Graded OTHER because it is this paper's summary
      of the clinical literature rather than an observation it made.
  - reference: PMID:36222498
    reference_title: "KLC4 shapes axon arbors during development and mediates adult behavior."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    directness: INDIRECT
    snippet: "The early expression of klc4 in diverse neural populations in both the central and peripheral nervous system suggests it has functions in neural development."
    explanation: >-
      The expression pattern that makes a multisystem consequence expected rather than
      surprising. Indirect with respect to the human disease because it is measured in
      zebrafish; no human KLC4 expression study has been published.
phenotypes:
- name: Progressive Complicated Spastic Paraplegia
  category: Neurological
  description: >-
    Progressive spastic paraplegia with additional neurological features - "complicated" in
    the hereditary spastic paraplegia sense, meaning spasticity plus involvement beyond the
    corticospinal tracts. All three affected siblings shared it. Onset is in early childhood.

    No age at onset, examination finding, gait description, imaging result or nerve
    conduction study is available in a quotable source, so none is curated. Three siblings in
    one family is too small a denominator for a frequency band and none is recorded.
  phenotype_term:
    preferred_term: Progressive complicated spastic paraplegia
    term:
      id: HP:0007020
      label: Progressive spastic paraplegia
  evidence:
  - reference: PMID:26423925
    reference_title: "Hereditary spastic paraplegia with recessive trait caused by mutation in KLC4 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three patients from the same family shared common features of progressive complicated spastic paraplegia."
    explanation: >-
      The entire published clinical description of this disease's core phenotype, in the
      abstract of its only clinical report.
  - reference: PMID:36222498
    reference_title: "KLC4 shapes axon arbors during development and mediates adult behavior."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Mutation of KLC4 in humans causes a type of hereditary spastic paraplegia (HSP) that manifests in early childhood (Bayrakli et al., 2015), indicating essential developmental functions."
    explanation: >-
      The age of onset, which the primary abstract does not give. Graded OTHER because it is
      a later paper's summary of the clinical report.
- name: Visual Impairment
  category: Ophthalmological
  description: >-
    Impaired vision. Curated at this level deliberately: the disease's MONDO and OMIM name
    specifies retinitis pigmentosa, but no source that can be quoted describes a retinal
    finding in these patients, and binding a retinal dystrophy term would assert an
    examination result this entry cannot show.
  phenotype_term:
    preferred_term: Visual impairment
    term:
      id: HP:0000505
      label: Visual impairment
  notes: >-
    If the 2015 paper's full text becomes available, this record should be re-examined
    against it and, if retinitis pigmentosa is documented, rebound to HP:0000510 and split
    from the general visual record. See the discussion
    `klc4_disease_name_outruns_its_published_phenotype`.
  evidence:
  - reference: PMID:36222498
    reference_title: "KLC4 shapes axon arbors during development and mediates adult behavior."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Multiple neural systems are affected in the human disease caused by KLC4 mutation; patients show defects in vision, hearing, movement and cognition (Bayrakli et al., 2015)."
    explanation: >-
      The visual involvement, at the level of specificity the quotable literature supports.
      Graded OTHER because it summarises the clinical report rather than reporting new
      observations.
- name: Hearing Impairment
  category: Auditory
  description: >-
    Impaired hearing. As with vision, the disease's name specifies sensorineural hearing
    loss and no quotable source establishes the sensorineural character, so the record is
    bound to the general term.

    Worth noting for a reader who wonders whether the sensorineural attribution is
    plausible: the paralogous light chain KLC2 does produce hearing loss with cochlear hair
    cell loss in mouse, so a cochlear lesion would not be surprising for a kinesin light
    chain. That is a reason to look, not evidence about these patients.
  phenotype_term:
    preferred_term: Hearing impairment
    term:
      id: HP:0000365
      label: Hearing impairment
  evidence:
  - reference: PMID:36222498
    reference_title: "KLC4 shapes axon arbors during development and mediates adult behavior."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Multiple neural systems are affected in the human disease caused by KLC4 mutation; patients show defects in vision, hearing, movement and cognition (Bayrakli et al., 2015)."
    explanation: >-
      The auditory involvement, at the level of specificity the quotable literature supports.
- name: Cognitive Impairment
  category: Neurological
  description: >-
    Impaired cognition. No developmental assessment, IQ measure or trajectory is available in
    a quotable source, so nothing is said about severity or whether the impairment is
    developmental or acquired.
  phenotype_term:
    preferred_term: Cognitive impairment
    term:
      id: HP:0100543
      label: Cognitive impairment
  evidence:
  - reference: PMID:36222498
    reference_title: "KLC4 shapes axon arbors during development and mediates adult behavior."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Multiple neural systems are affected in the human disease caused by KLC4 mutation; patients show defects in vision, hearing, movement and cognition (Bayrakli et al., 2015)."
    explanation: >-
      The cognitive involvement, at the level of specificity the quotable literature supports.
genetic:
- name: KLC4
  notes: >-
    KLC4 encodes kinesin light chain 4, one of four vertebrate kinesin light chains. Three of
    them - KLC1, KLC2 and KLC4 - are expressed in the nervous system, and the evidence is
    that they divide the work rather than substituting for one another: each has distinct
    cargo-adaptor affinities and distinct loss-of-function phenotypes. In zebrafish, klc4 is
    expressed early and in diverse neural populations of both the central and peripheral
    nervous system; no equivalent human expression study has been published.

    One published disease allele exists: c.853_871del19 in exon 6, homozygous, in one
    consanguineous family. ClinVar holds a second allele classified against this disease
    concept, NM_201521.3:c.1164T>A (p.Cys388Ter), as likely pathogenic. A PubMed search
    for KLC4 and for "kinesin light chain 4" returned no clinical report beyond the two
    discussed here, so that allele is not used as evidence.

    The gene-phenotype relationship is not settled. NCBI's `mim2gene_medgen` maps MIM 621129
    to KLC4 with the qualifier `question`, which that file's documentation defines as a
    question mark before the disease name in OMIM, indicating an unconfirmed or possibly
    spurious mapping. KLC4 has no ClinGen gene-disease validity classification - it does not
    appear in the ClinGen Gene-Disease Validity CSV.

    The sibling gene is worth knowing about when reading this disease. Biallelic KLC2
    variants cause SPOAN syndrome, a progressive spastic paraplegia with optic atrophy and
    neuropathy beginning in infancy, which is close enough to this phenotype that the two
    genes are best understood as a pair.
  relationship_type: CAUSATIVE
  gene_term:
    preferred_term: KLC4
    term:
      id: hgnc:21624
      label: KLC4
  evidence:
  - reference: PMID:26423925
    reference_title: "Hereditary spastic paraplegia with recessive trait caused by mutation in KLC4 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The association of a KLC4 mutation with spastic paraplegia identifies a new locus for the disease."
    explanation: >-
      The gene-disease claim as its discoverers stated it - a new locus, from one family, on
      the strength of homozygosity mapping and segregation.
  - reference: PMID:36222498
    reference_title: "KLC4 shapes axon arbors during development and mediates adult behavior."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Mutations in human klc2 can cause SPOAN syndrome, which is characterized by progressive spastic paraplegia, optic atrophy and neuropathy with onset in infancy"
    explanation: >-
      The paralogue's disease, which is the closest thing to a positive control for this
      gene-disease relationship: a different kinesin light chain producing a strikingly
      similar spastic-paraplegia-plus-sensory phenotype.
prevalence:
- population: Worldwide
  measure_type: CASES_IN_LITERATURE
  prevalence_class: ULTRA_RARE
  notes: >-
    Three affected siblings in one consanguineous family, reported once, in 2015. No second
    published family in the eleven years since. No prevalence or incidence estimate exists,
    so ULTRA_RARE is a qualitative band and no rate_per_100000 is recorded. The absence of a
    second family is part of why OMIM flags the gene-phenotype mapping as unconfirmed.
  evidence:
  - reference: PMID:26423925
    reference_title: "Hereditary spastic paraplegia with recessive trait caused by mutation in KLC4 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three patients from the same family shared common features of progressive complicated spastic paraplegia."
    explanation: The published case count, which is also the current case count.
diagnosis:
- name: Homozygosity mapping with exome sequencing in a consanguineous pedigree
  description: >-
    The diagnosis was reached the way recessive diseases in consanguineous families usually
    are: clinical phenotyping, then homozygosity mapping to find shared runs of homozygosity,
    then whole-exome sequencing within them. The interpretive caution is the same one that
    applies to any gene at unconfirmed validity - a KLC4 variant found on a panel or exome in
    a child with complicated spastic paraplegia is a candidate to pursue with segregation
    testing, not a finished diagnosis, and OMIM's own qualifier on this gene-phenotype
    mapping should be read alongside it.
  evidence:
  - reference: PMID:26423925
    reference_title: "Hereditary spastic paraplegia with recessive trait caused by mutation in KLC4 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Clinical phenotyping of one consanguineous family followed by combined homozygosity mapping and whole-exome sequencing analysis."
    explanation: The diagnostic route, stated as the paper's own methods summary.
treatments:
- name: Genetic Counselling
  description: >-
    Recessive counselling with a 25 percent recurrence risk for a carrier couple, and
    consanguinity to discuss in a family where it is the reason the allele became homozygous.
    Two things specific to this disease belong in the conversation: the gene-phenotype
    relationship is flagged by OMIM as unconfirmed, so a KLC4 result should be presented as
    probable rather than settled; and unaffected heterozygous relatives in the reported
    family had no symptoms, which is the reassurance carrier testing can offer.
  therapeutic_modality: OTHER
  treatment_term:
    preferred_term: genetic counseling
    term:
      id: NCIT:C15240
      label: Genetic Counseling
  notes: >-
    No target_mechanisms link is recorded: counselling does not act on a pathograph node and
    every TreatmentEffectEnum value asserts a change to a mechanism.

    This is the only treatment record in the entry because it is the only one that can be
    stated without inventing an experience. No management of any kind is described for any
    affected individual - no physiotherapy, no antispasticity drug, no hearing or visual
    aid, no outcome - and no KLC4-directed therapy or clinical trial exists. Symptomatic
    management of spasticity and sensory impairment is what these children would receive,
    but writing that as a treatment record would state a class-level standard of care as
    though it were something known about this disease.
  evidence:
  - reference: PMID:26423925
    reference_title: "Hereditary spastic paraplegia with recessive trait caused by mutation in KLC4 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Meanwhile, the unaffected parents and two siblings were heterozygous and one sibling was homozygous wild type."
    explanation: >-
      The carrier state in this family, which is the concrete fact counselling turns on: four
      heterozygous relatives, none affected.
animal_models:
- name: klc4 mutant zebrafish
  species: Zebrafish
  genotype: klc4 uw314 (nonsense mutation, homozygous)
  publication: PMID:36222498
  description: >-
    The principal in vivo model, and the source of essentially all of this entry's cell
    biology. Live imaging in klc4 mutant embryos shows that KLC4 is required for stabilising
    nascent sensory axon branches, for normal microtubule dynamics and endosomal transport,
    and for the contact repulsion that keeps peripheral arbors tiled rather than
    fasciculated. Mutant larvae are hypersensitive to touch and mutant adults show
    anxiety-like behaviour.

    It is also the model that complicates the disease's name: these fish are adult viable
    and show no signs of early neurodegeneration.
  genes:
  - preferred_term: KLC4
    term:
      id: hgnc:21624
      label: KLC4
  modeled_mechanisms:
  - target: Defective Axon Branch Stabilisation and Arbor Patterning
    relationship: RECAPITULATES
    fidelity: MODERATE
    description: >-
      This node is not a human observation that the fish corroborates - it is the experiment.
      Axon branch dynamics and arbor tiling cannot be measured in a patient, and no
      neuropathology from an affected person has been published, so every claim in the node
      comes from this line.
    limitations: >-
      Two gaps. The fish is a whole-animal nonsense mutant of a single klc4 gene, while the
      human patients are homozygous for a truncation in one of four light chains whose
      paralogues are also expressed in neurons - so redundancy differs between the species
      and nothing establishes that a human KLC4 truncation produces the same cellular defect.
      And the measurements are in embryonic Rohon-Beard sensory neurons, a cell type with no
      direct human counterpart, whereas the human phenotype is dominated by corticospinal
      involvement that this model does not address at all. Fidelity is MODERATE rather than
      HIGH for that reason.
    readouts:
    - name: Nascent axon branch stabilization
      target: Defective Axon Branch Stabilisation and Arbor Patterning
      direction: DECREASED
      interpretation: >-
        New peripheral sensory axon branches fail to be maintained in the mutant, which is
        the primary morphological defect the model shows.
      evidence:
      - reference: PMID:36222498
        reference_title: "KLC4 shapes axon arbors during development and mediates adult behavior."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Using live imaging approaches in klc4 mutant zebrafish, we show that KLC4 is required for stabilization of nascent axon branches, proper microtubule (MT) dynamics, and endosomal transport."
        explanation: The live-imaging measurement behind this readout.
    - name: Peripheral axon contact repulsion and arbor tiling
      target: Defective Axon Branch Stabilisation and Arbor Patterning
      direction: ALTERED
      interpretation: >-
        Peripheral axons fasciculate instead of repelling on contact, so arbors overlap
        rather than tile - a change in axon identity rather than in growth capacity.
      evidence:
      - reference: PMID:36222498
        reference_title: "KLC4 shapes axon arbors during development and mediates adult behavior."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Furthermore, KLC4 is required for proper tiling of peripheral axon arbors: in klc4 mutants, peripheral axons showed abnormal fasciculation, a behavior characteristic of central axons."
        explanation: The tiling and fasciculation measurement behind this readout.
    - name: Touch sensitivity and adult anxiety-like behaviour
      target: Defective Axon Branch Stabilisation and Arbor Patterning
      direction: INCREASED
      interpretation: >-
        The mispatterned sensory arbor has a behavioural consequence: larvae over-respond to
        touch, and adults show anxiety-like behaviour in a novel tank.
      evidence:
      - reference: PMID:36222498
        reference_title: "KLC4 shapes axon arbors during development and mediates adult behavior."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "Finally, we find that klc4 mutant larva are hypersensitive to touch and adults show anxiety-like behavior in a novel tank test, implicating klc4 as a new gene involved in stress response circuits."
        explanation: The behavioural measurements behind this readout.
    evidence:
    - reference: PMID:36222498
      reference_title: "KLC4 shapes axon arbors during development and mediates adult behavior."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Our work implicates one such subunit, KLC4, as an essential regulator of axon branching and arborization pattern of sensory neurons during development."
      explanation: Why this line is informative for a node about axon branching and arbor pattern.
  - target: Progressive Complicated Spastic Paraplegia
    relationship: FAILS_TO_RECAPITULATE
    fidelity: LOW
    description: >-
      The human disease is a childhood-onset progressive neurodegeneration with spastic
      paraplegia. The fish mutant is adult viable, its axons grow faster rather than slower,
      and it shows no signs of early neurodegeneration. Whatever the fish is modelling, it is
      not degeneration.
    limitations: >-
      The mismatch may be real biology or may be species redundancy: zebrafish and human both
      have several kinesin light chains, but nothing establishes that the compensation
      available in a fish is available in a child, and no ageing study of these mutants
      beyond adult viability has been published. Nor has the fish been examined for a
      corticospinal-equivalent phenotype - fish have no corticospinal tract - so the absence
      of paraplegia is partly a statement about the model's anatomy rather than about KLC4.
      Recorded as FAILS_TO_RECAPITULATE because the published phenotypes do not correspond,
      not because degeneration has been excluded as a consequence of KLC4 loss.
    evidence:
    - reference: PMID:36222498
      reference_title: "KLC4 shapes axon arbors during development and mediates adult behavior."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Klc4 mutant neurons do not have a general growth defect, in that their axons grow faster than wild type axons. In addition, klc4 mutants are adult viable and show no signs of early neurodegeneration."
      explanation: >-
        The negative result itself - viability and no early degeneration in the mutant fish.
    - reference: PMID:26423925
      reference_title: "Hereditary spastic paraplegia with recessive trait caused by mutation in KLC4 gene."
      supports: SUPPORT
      evidence_source: HUMAN_CLINICAL
      snippet: "Three patients from the same family shared common features of progressive complicated spastic paraplegia."
      explanation: >-
        The human side of the mismatch: a progressive disorder, which is what the fish does
        not reproduce.
- name: Humanized hKLC4 Caenorhabditis elegans
  species: Caenorhabditis elegans
  genotype: klc-2 replaced by human KLC4 (hKLC4), with hKLC4 variants introduced
  publication: PMID:37565267
  description: >-
    A humanised worm built to test KLC4 variants of uncertain significance: the endogenous
    klc-2 gene was replaced with human KLC4, which retained most of klc-2's function, and
    five hKLC4 variants were then introduced into that background. The clinical variant
    caused early lethality with nuclear migration defects when homozygous and a weak defect
    when heterozygous.

    Important scope limit: the "clinical variant" here is the *heterozygous, late-onset*
    frameshift at residue 369 from an Undiagnosed Diseases Network proband, not the
    homozygous exon-6 deletion of the family this entry curates. The model is included
    because both truncations are predicted to remove the same cargo-binding domain, so it
    speaks to whether losing that domain is deleterious - not to this disease's allele.
  genes:
  - preferred_term: KLC4
    term:
      id: hgnc:21624
      label: KLC4
  modeled_mechanisms:
  - target: Loss of the KLC4 Cargo-Binding TPR Domain
    relationship: PERTURBS
    fidelity: LOW
    description: >-
      The only experimental test of what a truncating KLC4 allele does in a living animal
      expressing human KLC4. A homozygous truncation is lethal in this background with
      severe nuclear migration defects, which is direct evidence that the truncation is not
      tolerated - the question this node otherwise answers only by structural prediction.
    limitations: >-
      The allele is the wrong one: a residue-369 frameshift from a heterozygous late-onset
      patient, not the residue-277 truncation of this recessive childhood disease. The
      readout is also the wrong one: nuclear migration is a klc-2 function in the worm with
      no established counterpart in this disease's phenotype. And the paper notes that a
      dominant-negative effect of the truncated protein could not be reproduced in this
      system at all, because the transcript is likely subject to nonsense-mediated decay.
      Fidelity is LOW; this establishes that the domain matters, and nothing about the
      disease.
    readouts:
    - name: Nuclear migration in humanized hKLC4 worms carrying the clinical variant
      target: Loss of the KLC4 Cargo-Binding TPR Domain
      direction: ALTERED
      interpretation: >-
        Homozygous clinical variant animals show significant nuclear migration defects and
        early lethality; heterozygotes show a weak defect.
      evidence:
      - reference: PMID:37565267
        reference_title: "A humanized Caenorhabditis elegans model of hereditary spastic paraplegia-associated variants in KLC4."
        supports: SUPPORT
        evidence_source: MODEL_ORGANISM
        snippet: "The clinical variant led to early lethality, with significant defects in nuclear migration when homozygous and a weak nuclear migration defect when heterozygous, possibly correlating with the clinical finding of late-onset HSP when the proband was heterozygous."
        explanation: The measurement behind this readout, with the authors' own hedge on its clinical correlation.
    evidence:
    - reference: PMID:37565267
      reference_title: "A humanized Caenorhabditis elegans model of hereditary spastic paraplegia-associated variants in KLC4."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "We created a humanized Caenorhabditis elegans model in which klc-2 was replaced by human KLC4 (referred to as hKLC4) and assessed the extent to which hKLC4 retained function in the worm."
      explanation: >-
        What makes this line informative for a node about human KLC4 domain loss: it is human
        KLC4 protein being tested, not a worm orthologue.
discussions:
- discussion_id: klc4_disease_name_outruns_its_published_phenotype
  kind: KNOWLEDGE_GAP
  prompt: >-
    MONDO and OMIM name this disease after retinitis pigmentosa, sensorineural hearing loss
    and demyelinating peripheral neuropathy. The abstract of its only clinical publication
    names none of the three. Where did they come from, and what should a curator do about it?
  attaches_to:
  - disease#KLC4-Related Early-Childhood-Onset Neurodegeneration
  - phenotypes#Visual Impairment
  - phenotypes#Hearing Impairment
  rationale: >-
    MedGen's definition of this concept attributes the full description - progressive walking
    difficulty, retinitis pigmentosa with blindness, sensorineural hearing loss, demyelinating
    peripheral neuropathy, severely impaired intellectual development - to Bayrakli et al.
    2015. That is the same publication this entry cites. So the features are almost certainly
    in the paper's full text, in a clinical table or case descriptions that its abstract
    compresses into the four words "progressive complicated spastic paraplegia".

    The paper is behind a paywall and its full text cannot be retrieved into the reference
    cache, and a dismech evidence snippet must be an exact substring of a cached source. So
    the entry cannot curate retinitis pigmentosa, sensorineural hearing loss or demyelinating
    neuropathy, even though the disease is named after them and they are very likely true.

    What it can do is curate one level up. A later zebrafish paper summarises the human
    phenotype as defects in vision, hearing, movement and cognition, and that sentence is
    quotable. The three phenotype records here are bound accordingly - HP:0000505 rather than
    a retinal dystrophy term, HP:0000365 rather than a sensorineural one - and each says in
    its description why.

    This is a resolvable gap, not a permanent one, and the resolution is mechanical: obtain
    the 2015 full text, cache it, and split the visual, auditory and peripheral nerve records
    to the specificity it supports. Until then, a reader should treat the disease's own name
    as the best available hypothesis about its phenotype rather than as something this entry
    has verified.
  evidence:
  - reference: PMID:26423925
    reference_title: "Hereditary spastic paraplegia with recessive trait caused by mutation in KLC4 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three patients from the same family shared common features of progressive complicated spastic paraplegia."
    explanation: >-
      The whole of the abstract's clinical description. The gap is the distance between this
      sentence and the disease's four-feature name.
  - reference: PMID:36222498
    reference_title: "KLC4 shapes axon arbors during development and mediates adult behavior."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "Multiple neural systems are affected in the human disease caused by KLC4 mutation; patients show defects in vision, hearing, movement and cognition (Bayrakli et al., 2015)."
    explanation: >-
      The intermediate level of description that is quotable, and the reason this entry
      curates four organ systems rather than either one phenotype or four named diagnoses.
- discussion_id: klc4_two_alleles_two_inheritance_modes
  kind: KNOWLEDGE_GAP
  prompt: >-
    KLC4 has two published patients: three siblings homozygous for a residue-277 truncation
    with early-childhood multisystem disease, and one man heterozygous for a residue-369
    truncation with myelopathy and neuropathy from age fifty. One gene, two truncations
    predicted to do the same thing, two inheritance modes, and fifty years between the
    onsets. Are these one disease or two?
  attaches_to:
  - pathophysiology#Loss of the KLC4 Cargo-Binding TPR Domain
  - genetic#KLC4
  - animal_models#Humanized hKLC4 Caenorhabditis elegans
  rationale: >-
    This entry curates them as two, and the reason is dosage. The recessive family's
    unaffected heterozygous parents and siblings are the control the dominant case lacks: if
    one truncated KLC4 allele were sufficient to cause disease, four heterozygous relatives
    should not have been well. So either the residue-369 allele does something the
    residue-277 allele does not - a dominant-negative effect on the kinesin complex rather
    than simple loss - or something else contributes in that proband.

    Both possibilities are live in the literature and neither is settled. The 2023 paper
    raises the dominant-negative reading itself and says it could not be tested in the worm,
    because the truncated transcript is likely destroyed by nonsense-mediated decay. It also
    reports that other variants were found by genome sequencing in the same individual and
    that their contribution is under investigation - and notes his celiac disease and
    occupational herbicide and pesticide exposure, both of which can produce myelopathy and
    neuropathy.

    The practical consequence for this entry is a boundary rather than a mystery: the
    late-onset case is not curated as a phenotype, prevalence entry or subtype of this
    disease, and the C. elegans model is linked only to the molecular domain-loss node with
    fidelity LOW, because the allele it tests is that patient's rather than this family's.

    What would resolve it is a second recessive family, or a functional comparison of the two
    truncated proteins in the same system with wild-type protein co-expressed - the
    experiment that separates loss of function from dominant negative, and the one the worm
    model explicitly could not perform.
  evidence:
  - reference: PMID:37565267
    reference_title: "A humanized Caenorhabditis elegans model of hereditary spastic paraplegia-associated variants in KLC4."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "We identified an individual with late-onset HSP with a heterozygous variant in KLC4 predicted to cause a frame shift at residue 369, closely followed by a premature stop codon."
    explanation: The second patient, whose allele and inheritance mode differ from this disease's.
  - reference: PMID:37565267
    reference_title: "A humanized Caenorhabditis elegans model of hereditary spastic paraplegia-associated variants in KLC4."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "A male individual with the clinical KLC4 variant presented to the Undiagnosed Diseases Network (UDN) with slowly progressive myelopathy and neuropathy"
    explanation: >-
      His presentation, which is separated from this disease's by roughly fifty years of
      onset and by the absence of visual, auditory and cognitive involvement.
  - reference: PMID:37565267
    reference_title: "A humanized Caenorhabditis elegans model of hereditary spastic paraplegia-associated variants in KLC4."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "The truncated KLC4 protein variant could conceivably be acting in a dominant-negative manner in the proband, which would not be recapitulated in C. elegans owing to likely nonsense-mediated decay of the transcript."
    explanation: >-
      The mechanism that would reconcile the two inheritance modes, together with the reason
      it remains untested. Graded OTHER because the sentence is the authors' interpretive
      discussion rather than a result from either their human or their worm arm.
  - reference: PMID:26423925
    reference_title: "Hereditary spastic paraplegia with recessive trait caused by mutation in KLC4 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Meanwhile, the unaffected parents and two siblings were heterozygous and one sibling was homozygous wild type."
    explanation: >-
      The control that makes the two cases hard to reconcile: four heterozygous carriers of a
      truncating KLC4 allele, none of them affected.
- discussion_id: klc4_zebrafish_patterning_versus_human_neurodegeneration
  kind: HUMAN_MODEL_MISMATCH
  prompt: >-
    The klc4 mutant zebrafish is adult viable with no early neurodegeneration, and its defect
    is one of axon patterning rather than axon survival. The human disease is called a
    neurodegeneration. Which is right about KLC4?
  attaches_to:
  - animal_models#klc4 mutant zebrafish
  - pathophysiology#Disordered Patterning Across Multiple Neural Systems
  - phenotypes#Progressive Complicated Spastic Paraplegia
  rationale: >-
    The fish authors are explicit that their mutant's neurons look healthy, that axons grow
    faster rather than slower, and that there is no sign of early degeneration - and they read
    the human disease accordingly, as possibly caused by defects in developmental patterning
    rather than by degeneration. The human report describes a progressive disorder, and the
    disease's name in MONDO and OMIM begins with the word neurodegeneration.

    These need not be contradictory. A developmental patterning defect can present as
    progressive loss of function if a mispatterned circuit decompensates with age or fails to
    keep pace with growth, and "progressive" in the clinical report is a description of
    course, not of pathology. No neuropathology from an affected person has been published,
    so no one has looked at whether neurons are actually dying.

    But they are different mechanistic claims with different consequences, and the entry does
    not choose between them. The pathograph is built on the patterning account, because that
    is where the measurements are, and the fish's viability is curated as a
    FAILS_TO_RECAPITULATE link against the spastic paraplegia phenotype rather than omitted.

    Two caveats belong with the mismatch. Fish have no corticospinal tract, so the absence of
    spastic paraplegia in the model is partly a fact about its anatomy. And vertebrates carry
    four kinesin light chains with overlapping neuronal expression, so paralogue redundancy
    may differ between species - the fish may simply be better compensated than a child.
  evidence:
  - reference: PMID:36222498
    reference_title: "KLC4 shapes axon arbors during development and mediates adult behavior."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Klc4 mutant neurons do not have a general growth defect, in that their axons grow faster than wild type axons. In addition, klc4 mutants are adult viable and show no signs of early neurodegeneration."
    explanation: The negative result at the centre of the mismatch.
  - reference: PMID:36222498
    reference_title: "KLC4 shapes axon arbors during development and mediates adult behavior."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our results also give insight into mechanisms of the human disease caused by KLC4 mutation, which may be caused by defects in developmental patterning."
    explanation: >-
      The alternative reading of the human disease that the model supports, hedged by its own
      authors.
  - reference: PMID:26423925
    reference_title: "Hereditary spastic paraplegia with recessive trait caused by mutation in KLC4 gene."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Three patients from the same family shared common features of progressive complicated spastic paraplegia."
    explanation: >-
      The word "progressive" is the whole of the published evidence that this disease is
      degenerative, and it describes a clinical course rather than a pathology.

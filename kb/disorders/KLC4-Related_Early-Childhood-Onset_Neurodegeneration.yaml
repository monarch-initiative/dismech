name: KLC4-Related Early-Childhood-Onset Neurodegeneration
category: Mendelian
creation_date: "2026-09-04T00:00:00Z"
synonyms:
- CONDRHN
- early-childhood-onset neurodegeneration with retinitis pigmentosa, sensorineural hearing loss, and demyelinating peripheral neuropathy
- KLC4-related complicated hereditary spastic paraplegia
description: >-
  A childhood-onset multisystem neurodegenerative disorder caused by biallelic truncating
  KLC4 variants, known from a single consanguineous family. KLC4 encodes kinesin light chain
  4, one of the four cargo-binding light-chain subunits of the kinesin-1 motor, and the
  reported allele - a 19-base-pair deletion in exon 6 - introduces a stop codon that removes
  the tetratricopeptide repeats through which the light chain binds cargo adaptors.

  Two things about this entry's scope need stating before anything else, because both are
  unusual.

  First, the disease's own name is more specific than its published clinical description.
  MONDO and OMIM call it "early-childhood-onset neurodegeneration with retinitis pigmentosa,
  sensorineural hearing loss, and demyelinating peripheral neuropathy", and MedGen
  attributes that description to the single 2015 report. That report's abstract describes
  the three affected siblings only as having "progressive complicated spastic paraplegia";
  its full text is behind a paywall and cannot be quoted. The nearest independently
  published statement of the phenotype is a later paper's summary - patients show defects
  in vision, hearing, movement and cognition - and that is the level at which the phenotype
  records below are curated. Retinitis pigmentosa, the sensorineural character of the
  hearing loss, and the demyelinating character of the neuropathy are all in the disease's
  name and none is supported by a source this entry can quote.

  Second, OMIM itself treats the gene-phenotype relationship as unconfirmed. NCBI's
  `mim2gene_medgen` maps MIM 621129 to KLC4 with the comment `question`, which the file's
  own documentation defines as "A question mark, '?', before the disease name indicates an
  unconfirmed or possibly spurious mapping". One family, one allele, and no replication in
  the eleven years since. ClinVar does hold a second KLC4 allele classified against this
  disease concept - `NM_201521.3:c.1164T>A` (p.Cys388Ter), likely pathogenic - but a PubMed
  search for KLC4 turned up no publication describing that patient, so it does not enter
  this entry as evidence.

  What is well supported is the cell biology. KLC4 is expressed broadly in developing
  central and peripheral neurons, and a zebrafish klc4 mutant shows that it is required for
  stabilising nascent axon branches, for normal microtubule dynamics and endosomal
  transport, and for the contact repulsion that lets peripheral sensory arbors tile. The
  fish's authors read the human disease as a disorder of developmental patterning rather
  than of bulk cargo transport - which fits a multisystem sensory and motor phenotype, and
  sits awkwardly with the word "neurodegeneration" in the disease name, since the fish
  mutant is adult viable with no early degeneration at all.

  A separate KLC4 story should not be merged into this one. A man reported in 2023 through
  the Undiagnosed Diseases Network had slowly progressive myelopathy and neuropathy from
  around age fifty, carrying a *heterozygous* frameshift at residue 369 - a different
  allele, a different inheritance mode, and a different age of onset by half a century.
  Both truncations are predicted to remove the same cargo-binding domain, which is why the
  two are discussed together in the literature, but they are not the same disease and this
  entry does not curate the late-onset case as one.

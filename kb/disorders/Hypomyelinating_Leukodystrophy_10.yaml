    14 patients with a birth measurement) and falls progressively thereafter to -3
    to -6 SD. The literature's framing is "postnatally acquired", meaning the bulk
    of the deficit accrues after birth, which discriminates HLD10 from the primary
    (congenital) microcephalies - but this is a matter of trajectory, not of a
    normal starting head size.

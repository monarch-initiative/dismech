    evidence:
    - reference: PMID:32330411
      reference_title: "Loss of PYCR2 Causes Neurodegeneration by Increasing Cerebral Glycine Levels via SHMT2."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "Our findings identify the glycine metabolic pathway as a possible intervention point to alleviate the neurological symptoms of PYCR2-mutant patients."
      explanation: >-
        The authors nominate this node as a therapeutic target. PARTIAL because it
        is a proposal supported by neuronal-culture rescue, not a treatment.
  description: >-
    Recorded explicitly as a negative: there is no specific, disease-modifying or
    curative treatment for HLD10. Management is entirely supportive. The SHMT2
    or glycine axis is the leading proposed intervention point but has not been
    tested in patients.
  evidence:
  - reference: PMID:36548190
    reference_title: "Hypomyelinating Leukodystrophy 10 (HLD10)-Associated Mutations of PYCR2 Form Large Size Mitochondria, Inhibiting Oligodendroglial Cell Morphological Differentiation."
    supports: SUPPORT
    evidence_source: OTHER
    snippet: "To date, there is no known specific therapeutic strategy or drug for HLD10."

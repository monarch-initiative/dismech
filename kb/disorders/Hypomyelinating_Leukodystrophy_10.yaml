- name: Preserved Bulk Proline Supply by Paralogue Redundancy
  biological_scale: ORGANISM
  description: >-
    Despite the enzymatic block, proline itself is not depleted. Plasma and CSF
    proline are normal in patients, routine metabolic screens are unremarkable,
    and serum proline is not reduced in Pycr2-null mice. PYCR1 is largely
    functionally redundant with PYCR2 for bulk proline supply, so proline
    auxotrophy is not the central disease mechanism. The cytosolic third
    paralogue PYCR3 sits in a different compartment and is fed P5C from ornithine
    by ornithine aminotransferase rather than from glutamate; it was not tested
    for redundancy and is deliberately not part of this claim. Proline is nonetheless
    semi-essential in the mutant state: a proline-free diet worsens the mouse
    phenotype. This node is curated explicitly because it constrains every
    downstream mechanistic claim and rules out a metabolite-replacement
    rationale.
  mechanism_confidence: ESTABLISHED
  biological_processes:
  - preferred_term: L-proline biosynthetic process
    modifier: DECREASED
    term:
      id: GO:0055129
      label: L-proline biosynthetic process
  evidence:
  - reference: PMID:38709052
    reference_title: "Exploring metabolic alterations in PYCR2 deficiency: Unveiling pathways and clinical presentations of hypomyelinating leukodystrophy 10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "While plasma and CSF proline levels were found to be totally normal, untargeted metabolomic profiling revealed mild increases of glutamate, alpha-ketoglutarate, and l-glutamate semialdehyde and marked increases of inosine and xanthine."
    explanation: Direct measurement showing proline is not depleted in patient plasma or CSF.
  - reference: PMID:38709052
    reference_title: "Exploring metabolic alterations in PYCR2 deficiency: Unveiling pathways and clinical presentations of hypomyelinating leukodystrophy 10."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "Our findings and all the previous reports suggest that proline auxotrophy is not the central disease mechanism."
    explanation: States the negative conclusion this node encodes.
  - reference: PMID:27860360
    reference_title: "Homozygous variants in pyrroline-5-carboxylate reductase 2 (PYCR2) in patients with progressive microcephaly and hypomyelinating leukodystrophy."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "No significant changes were identified in proline biosynthesis pathway or related metabolites."
    explanation: Independent plasma metabolomics in three severely affected patients finds no proline-pathway change.
  - reference: PMID:33734376
    reference_title: "Genetic analysis of Pycr1 and Pycr2 in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Proline levels were not reduced, and precursors were not increased in serum from Pycr2 mutant mice or in lysates from skin fibroblast cultures, but placing Pycr2 mutant mice on a proline-free diet worsened the phenotype."
    explanation: >-
      Confirms preserved proline in the mouse model while showing dietary proline
      still modulates severity, i.e. proline becomes semi-essential.
  - reference: PMID:33734376
    reference_title: "Genetic analysis of Pycr1 and Pycr2 in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Thus, Pycr1 and -2 have redundant functions in proline biosynthesis, and their loss makes proline a semi-essential amino acid."
    explanation: States the paralogue redundancy that explains the preserved proline pool.
  - reference: PMID:27130255
    reference_title: "PYCR2 Mutations cause a lethal syndrome of microcephaly and failure to thrive."
    supports: SUPPORT
    evidence_source: IN_VITRO
    snippet: "We also noted essentially unchanged expression levels of PYCR1 in PYCR2-mutated samples, suggesting lack of expression compensation."
    explanation: >-
      Important qualifier on the redundancy: PYCR1 is not upregulated to compensate
      in patient cells, so the preserved proline pool reflects baseline paralogue
      activity rather than an induced compensatory response.
  - reference: PMID:32330411
    reference_title: "Loss of PYCR2 Causes Neurodegeneration by Increasing Cerebral Glycine Levels via SHMT2."
    supports: PARTIAL
    evidence_source: MODEL_ORGANISM
    snippet: "We find that knocking out Pycr2 in mice phenocopies the human disorder and depletes PYCR1 levels in neural lineages."
    explanation: >-
      Bounds the redundancy in the tissue that matters: in neural lineages loss of
      PYCR2 actually depletes PYCR1, so paralogue cover is weakest in the CNS.
      PARTIAL because it qualifies rather than simply supports the claim.
- name: Mitochondrial Dysfunction and Oxidative Stress Susceptibility
  biological_scale: CELLULAR
  description: >-
    PYCR2 is a mitochondrial matrix enzyme, and its loss is felt as a
    mitochondrial rather than a metabolite-supply defect. PYCR2-deficient cells
    show decreased mitochondrial membrane potential and markedly increased
    apoptosis under oxidative stress. In an oligodendroglial cell model, the
    disease missense proteins additionally shift the fusion-fission balance
    towards fusion, producing abnormally large mitochondria with decreased
    activity.
  cell_types:

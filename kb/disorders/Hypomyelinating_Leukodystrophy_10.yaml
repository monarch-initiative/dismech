  - reference: PMID:32330411
    reference_title: "Loss of PYCR2 Causes Neurodegeneration by Increasing Cerebral Glycine Levels via SHMT2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "Our findings identify the glycine metabolic pathway as a possible intervention point to alleviate the neurological symptoms of PYCR2-mutant patients."
    explanation: >-
      Records the proposed but untested therapeutic direction, framed by its
      authors as a possibility rather than an established treatment.
animal_models:
- name: Pycr2 loss-of-function mouse (chemically induced p.Met1Thr)
  species: Mouse
  genotype: Pycr2 c.2T>C (p.Met1Thr) homozygous, chemically induced null
  publication: PMID:33734376
  description: >-
    A chemically induced start-codon mutation abolishing the 34 kDa PYCR2 protein
    in brain, spinal cord and muscle while leaving Pycr2 mRNA intact. Mutant mice
    show weight loss, progressive kyphosis, hind-limb clasping, reduced grip
    strength, severe subcutaneous fat loss, mild peripheral axonal atrophy,
    reduced white blood cell counts and altered lipid metabolism.
  modeled_mechanisms:
  - target: Preserved Bulk Proline Supply by Paralogue Redundancy
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      The mouse reproduces the defining negative finding of the human disease -
      an enzymatic block without proline depletion - and adds the dietary
      manipulation that shows proline is semi-essential rather than irrelevant.
    limitations: >-
      Serum and fibroblast measurements only; brain proline was not the reported
      readout, so tissue-specific depletion in the CNS is not excluded.
    evidence:
    - reference: PMID:33734376
      reference_title: "Genetic analysis of Pycr1 and Pycr2 in mice."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Proline levels were not reduced, and precursors were not increased in serum from Pycr2 mutant mice or in lysates from skin fibroblast cultures, but placing Pycr2 mutant mice on a proline-free diet worsened the phenotype."
      explanation: Supports treating the mouse as informative for the preserved-proline node.
  - target: Severe Neurodevelopmental Impairment and Early Mortality
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      The mouse develops a neurological and neuromuscular syndrome - kyphosis,
      hind-limb clasping, weight loss, reduced grip strength - consistent with
      the human neurological impairment.
    limitations: >-
      The reported characterisation does not establish frank microcephaly or CNS
      hypomyelination, the two defining human features, so the correspondence is
      to the neurological syndrome in general rather than to leukodystrophy. See
      the HUMAN_MODEL_MISMATCH discussion.
    evidence:
    - reference: PMID:33734376
      reference_title: "Genetic analysis of Pycr1 and Pycr2 in mice."
      supports: PARTIAL
      evidence_source: MODEL_ORGANISM
      snippet: "Mice with recessive loss-of-function mutations in Pycr2 showed phenotypes consistent with neurological and neuromuscular disorders, including weight loss, kyphosis, and hind-limb clasping."
      explanation: >-
        Supports a neurological phenotype while stopping short of the defining
        human features, hence PARTIAL.
  evidence:
  - reference: PMID:33734376
    reference_title: "Genetic analysis of Pycr1 and Pycr2 in mice."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "A severe loss of subcutaneous fat in Pycr2 mutant mice is reminiscent of a CL-like phenotype, but primary features such as elastin abnormalities were not observed."
    explanation: >-
      Records that the mouse does not develop the elastin pathology of the
      paralogue disease, keeping the PYCR1/PYCR2 separation intact in the model.
- name: Pycr2 knockout mouse (Escande-Beillard)
  species: Mouse
  genotype: Pycr2 knockout
  publication: PMID:32330411
  description: >-
    A Pycr2 knockout reported to phenocopy the human disorder, in which in situ
    neurotransmitter quantification revealed excessive cerebral glycine and
    secondary depletion of PYCR1 in neural lineages. Cultured knockout neurons
    show axonal beading and shortened neurites that are rescued by SHMT2
    knockdown.
  modeled_mechanisms:
  - target: SHMT2 Upregulation and Cerebral Glycine Accumulation
    relationship: RECAPITULATES
    fidelity: HIGH
    description: >-
      Excess cerebral glycine was measured in the mutant mouse brain and in
      patients in the same study, and the SHMT2 knockdown rescue establishes the
      mechanism rather than merely the association.
    limitations: >-
      The rescue was performed in cultured knockout neurons, not in vivo, so
      whether lowering glycine improves the organismal phenotype is untested.
    evidence:
    - reference: PMID:32330411
      reference_title: "Loss of PYCR2 Causes Neurodegeneration by Increasing Cerebral Glycine Levels via SHMT2."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "In situ quantification of neurotransmitters in the brains of PYCR2 mutant mice and patients revealed a signature of encephalopathy driven by excessive cerebral glycine."
      explanation: >-
        Supports the mouse as informative for the glycine node by measuring the
        same signature in mice and patients.
  evidence:
  - reference: PMID:32330411
    reference_title: "Loss of PYCR2 Causes Neurodegeneration by Increasing Cerebral Glycine Levels via SHMT2."
    supports: SUPPORT
    evidence_source: MODEL_ORGANISM
    snippet: "We find that knocking out Pycr2 in mice phenocopies the human disorder and depletes PYCR1 levels in neural lineages."
    explanation: The authors' own assessment of the model's fidelity to the human disorder.
- name: pycr1b morpholino knockdown zebrafish
  species: Zebrafish
  genotype: pycr1b morpholino knockdown (PYCR2 orthologue)
  publication: PMID:25865492
  description: >-
    Morpholino knockdown of the zebrafish PYCR2 orthologue pycr1b reproduces
    microcephaly, rescued by wild-type but not mutant human PYCR2 mRNA. The
    allele-specific rescue is the functional evidence for pathogenicity of the
    founding variants.
  modeled_mechanisms:
  - target: Progressive Neuronal Loss and Brain Atrophy
    relationship: PARTIALLY_RECAPITULATES
    fidelity: MODERATE
    description: >-
      Reproduces reduced head and brain size, the developmental counterpart of the
      human microcephaly, with allele-specific rescue confirming specificity.
    limitations: >-
      Transient whole-embryo morpholino knockdown models a developmental
      reduction in brain size, not the postnatal progressive degeneration of the
      human disease, and does not model hypomyelination.
    evidence:
    - reference: PMID:25865492
      reference_title: "Mutations in PYCR2, Encoding Pyrroline-5-Carboxylate Reductase 2, Cause Microcephaly and Hypomyelination."
      supports: SUPPORT
      evidence_source: MODEL_ORGANISM
      snippet: "Morpholino-based knockdown of a zebrafish PYCR2 ortholog, pycr1b, recapitulated the human microcephaly phenotype, which was rescued by wild-type human PYCR2 mRNA, but not by mutant mRNAs, further supporting the pathogenicity of the identified variants."
      explanation: Supports the model as informative for the brain-size phenotype, with allele-specific rescue.
experimental_models:
- name: FBD-102b oligodendroglial differentiation model expressing HLD10 PYCR2 variants
  experimental_model_type: CELL_LINE
  publication: PMID:36548190
  description: >-
    The FBD-102b oligodendroglial differentiation model expressing the HLD10
    missense proteins p.Arg119Cys and p.Arg251Cys. Mutant-expressing cells form
    abnormally large mitochondria with increased fusion, decreased fission and
    decreased mitochondrial activity, and fail to undergo morphological
